genetic:

- name: TINF2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TINF2
    term:
      id: hgnc:11824
      label: TINF2
  association: >-
    TINF2 encodes TIN2, the structural hub of the shelterin complex. Its link to this disease
    was established in the same 2008 paper that first connected shelterin to human disease at
    all, which reported TINF2 variants in classical dyskeratosis congenita probands and, for
    the first time, in a patient with Revesz syndrome. Every genotyped Revesz patient published
    since 2010 has carried a TINF2 variant in exon 6.

    The gene-disease relationship is not in doubt: ClinGen's Interstitial Lung Disease Gene
    Curation Expert Panel rates TINF2 Definitive, having reached the maximum genetic evidence
    score. What is in doubt is the disease boundary. That same curation applied the ClinGen
    Lumping and Splitting Working Group criteria and lumped Revesz syndrome with autosomal
    dominant dyskeratosis congenita 3, Hoyeraal-Hreidarsson syndrome and pulmonary fibrosis
    into one entity, TINF2-related short telomere syndrome, finding no difference in molecular
    mechanism or inheritance between them.

    The clinical genetics supports that reading rather than contradicting it. The recurrent
    R282H allele appears across probands with classical dyskeratosis congenita, with Revesz
    syndrome and with overlapping presentations, and the Karremann review states plainly that
    genotype alone cannot define Revesz syndrome. No modifier locus, second hit or
    environmental factor explaining who develops the retinal and CNS phenotype has been
    identified.
  evidence:
  - reference: PMID:18252230
    reference_title: "TINF2, a component of the shelterin telomere protection complex, is mutated in dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that a fifth gene, TINF2, is mutated in classical DC and, for the first
      time, in Revesz syndrome.
    explanation: >-
      The founding gene-disease claim for this entity.
  - reference: PMID:18252230
    reference_title: "TINF2, a component of the shelterin telomere protection complex, is mutated in dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TINF2 R282H in three additional unrelated DC probands, including one with Revesz syndrome
    explanation: >-
      The same allele in three unrelated probands of whom only one had Revesz syndrome - the
      original demonstration, in the founding paper's own data, that the genotype does not
      determine the phenotype.
  - reference: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
    reference_title: "TINF2 / dyskeratosis congenita, autosomal dominant 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TINF2 | HGNC:11824 | dyskeratosis congenita, autosomal dominant 3 | MONDO:0013522 | AD |
      Definitive | SOP11 | Interstitial Lung Disease Gene Curation Expert Panel
    explanation: >-
      The expert-panel classification row. Note the curated disease term is autosomal dominant
      dyskeratosis congenita 3, not Revesz syndrome - there is no Revesz-specific ClinGen
      curation, because the panel folded Revesz into this one.
  - reference: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
    reference_title: "TINF2 / dyskeratosis congenita, autosomal dominant 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, there is definitive evidence to support the relationship between TINF2 and
      TINF2 -related short telomere syndrome.
    explanation: >-
      The panel's conclusion on gene-disease validity, which is what makes relationship_type
      CAUSATIVE here rather than anything weaker.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, the same mutations in TINF2 may be found in classical DKC patients
      presenting clinically without the distinct RS phenotype, hence, the genotype alone is not
      able to define RS
    explanation: >-
      The clearest statement that this disease is not genotypically separable from TINF2
      dyskeratosis congenita, from the review that assembled its entire clinical evidence base.

external_assertions:
- name: ClinGen TINF2 gene-disease validity assertion and lumping decision
  source: ClinGen
  assertion_type: gene_disease_validity
  external_id: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
  url: https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
  description: >-
    Recorded because it is two assertions in one, and the second is about this entry's right to
    exist. The ClinGen Interstitial Lung Disease Gene Curation Expert Panel rates TINF2
    Definitive for the disease it curates, approved November 2024 under SOP11. In reaching that
    classification it applied the ClinGen Lumping and Splitting Working Group criteria and
    merged four separately named conditions - autosomal dominant dyskeratosis congenita 3,
    Revesz syndrome, Hoyeraal-Hreidarsson syndrome and pulmonary fibrosis - into a single
    entity, TINF2-related short telomere syndrome, on the ground that no difference in
    molecular mechanism or inheritance pattern separates them.

    dismech does not currently curate that lumped entity, and MONDO, OMIM and Orphanet all
    still carry Revesz syndrome as a distinct concept. This entry therefore curates the MONDO
    term as it exists while recording, prominently, that a criteria-based expert decision has
    already merged it away.
  evidence:
  - reference: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
    reference_title: "TINF2 / dyskeratosis congenita, autosomal dominant 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Per criteria outlined by the ClinGen Lumping and Splitting Working Group, we found no
      difference in molecular mechanism or inheritance pattern between these conditions
      suggesting that these may constitute a disease spectrum associated with variants in TINF2 .
    explanation: >-
      The reasoning behind the lumping decision, and the strongest single argument against
      treating Revesz syndrome as a separate disease.
  - reference: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
    reference_title: "TINF2 / dyskeratosis congenita, autosomal dominant 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      have been lumped into one disease entity– TINF2 -related short telomere syndrome.
    explanation: >-
      The decision itself, naming the entity Revesz syndrome was merged into.
  - reference: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
    reference_title: "TINF2 / dyskeratosis congenita, autosomal dominant 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Two forms of DC/TBD with more severe manifestations have been identified, Hoyeraal
      Hreidarsson syndrome, and Revesz syndrome, which were previously thought to be distinct
      disorders, but are now recognized to be part of the phenotypic spectrum of DC
    explanation: >-
      The panel's summary of the current nosological position: distinct disorder previously,
      severity band on dyskeratosis congenita now.

inheritance:
- name: Autosomal dominant, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous TINF2 variants, dominant in mechanism but almost never inherited: every
    genetically characterised Revesz patient reported so far has arisen de novo from unaffected
    parents. That is a consequence of the disease rather than a property of the gene - children
    who die before six do not reproduce - and it distinguishes this presentation from TINF2
    dyskeratosis congenita generally, which is transmitted through families.

    No de_novo_rate is recorded. Only twelve of the eighteen assembled patients were genotyped,
    parental testing is not documented for all of them, and a percentage computed on that basis
    would give a precision the source does not have.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to classical DKC, all cases of RS represented de novo mutations with
      unaffected parents, reflecting the severe course and early death in this disease.
    explanation: >-
      The de novo observation and the review's own explanation of why it follows from the
      severity rather than from the gene.
  - reference: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
    reference_title: "TINF2 / dyskeratosis congenita, autosomal dominant 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TINF2 | HGNC:11824 | dyskeratosis congenita, autosomal dominant 3 | MONDO:0013522 | AD |
      Definitive | SOP11 | Interstitial Lung Disease Gene Curation Expert Panel
    explanation: >-
      The mode of inheritance the expert panel curated the gene under.

diagnosis:

- name: Telomere Length Measurement by Flow-FISH
  description: >-
    Age-adjusted lymphocyte telomere length below the first percentile is the functional
    screening test for a telomere biology disorder and is the single most discriminating
    investigation in a child with unexplained exudative retinopathy and cytopenias. Revesz
    patients sit far below that threshold - shorter, as a group, than any other dyskeratosis
    congenita subtype.
  evidence:
  - reference: PMID:39371255
    reference_title: "Inherited Telomere Biology Disorders: Pathophysiology, Clinical Presentation, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Revesz and Hoyeraal-Hreidarsson syndrome are characterized by a severe disease course,
      very short telomeres (considerably below the 1% percentile), and a disease onset in the
      early childhood
    explanation: >-
      The telomere-length threshold that identifies the severe pediatric telomere biology
      disorders.
  - reference: PMID:18669893
    reference_title: "TINF2 mutations result in very short telomeres: analysis of a large cohort of patients with dyskeratosis congenita and related bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Telomere lengths in patients with TINF2 mutations were the shortest compared with other
      DC subtypes, but TERC levels were normal.
    explanation: >-
      Why the test is particularly discriminating for TINF2 disease specifically.

- name: Widefield Fluorescein Angiography of the Retina
  description: >-
    Widefield fluorescein angiography demonstrates the peripheral non-perfusion, telangiectasia
    and leakage that define the retinal lesion, and does so before the child is symptomatic.
    The 2026 series that established this found 18 of 22 patients asymptomatic at the time
    their retinal abnormality was detected on screening, which changes the test from a
    confirmatory one into a surveillance one for anybody with a telomere biology disorder.
  evidence:
  - reference: PMID:42617951
    reference_title: "Retinopathy in Dyskeratosis Congenita and Related Telomere Biology Disorders: Short Telomere Associated Retinopathy (STAR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 44 eyes from 22 patients were included (59.1% males).
    explanation: >-
      The size of the imaging series behind this recommendation. Small, and the only one of its
      kind.
  - reference: PMID:42617951
    reference_title: "Retinopathy in Dyskeratosis Congenita and Related Telomere Biology Disorders: Short Telomere Associated Retinopathy (STAR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contrary to prior assumptions, the retinovascular abnormalities in patients with TBDs,
      including DC, were universal in our cohort.
    explanation: >-
      The finding that makes angiographic screening worthwhile across telomere biology
      disorders rather than only in children already diagnosed with Revesz syndrome.

- name: TINF2 Sequencing
  description: >-
    Sequencing TINF2, or a telomere biology disorder panel, confirms the molecular diagnosis.
    In this disease the yield is concentrated: every reported variant lies in exon 6.

    A positive result establishes a telomere biology disorder but does not by itself establish
    Revesz syndrome, because the same alleles occur in patients without the retinal and CNS
    phenotype. The diagnosis remains clinical.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of these harbored a TINF2 mutation and the underlying alterations were restricted to
      exon six.
    explanation: >-
      The concentration of variants in a single exon, which is what makes targeted sequencing
      high-yield here.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, the same mutations in TINF2 may be found in classical DKC patients
      presenting clinically without the distinct RS phenotype, hence, the genotype alone is not
      able to define RS
    explanation: >-
      Why a positive TINF2 result is not a diagnosis of this particular entity.

treatments:

- name: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    The only potentially curative treatment for the marrow failure, and the only intervention
    that has demonstrably changed survival in this disease. Eight of the eighteen assembled
    children were transplanted and four were alive at last follow-up, a median of 22 months
    afterwards.

    Conditioning matters more here than in most transplant indications. Alkylators and
    radiation damage the same DNA-repair-limited tissues the disease already compromises, so
    reduced-intensity, radiation-sparing regimens are used; the children in this series who
    received fludarabine, cyclophosphamide and anti-thymocyte globulin tolerated transplant
    without severe early toxicity. Transplantation corrects the haematopoietic branch of the
    pathograph and nothing else: the retinal, pulmonary and CNS branches continue, and
    refractory lung failure remains a cause of death after transplant.
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Hematopoietic Stem Cell Exhaustion
    description: >-
      Replaces the exhausted stem cell compartment with donor cells whose telomeres are of
      normal length. It does not correct the germline defect in any other tissue.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stem cell transplantation (SCT) was performed in eight children, and after a median of 22
      months from SCT four of these patients were alive at the last follow up visit.
    explanation: >-
      The whole of the transplant outcome data in this disease: eight patients, four alive at a
      median of under two years.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Patients died from BMF in most cases, but refractory lung failure was another cause of
      death in some cases.
    explanation: >-
      The limit of what transplantation achieves. INDIRECT because the sentence describes causes
      of death across the whole cohort rather than a transplant outcome specifically; it is
      quoted to show the non-haematopoietic branches persist.

- name: Retinal Laser Photocoagulation
  therapeutic_modality: DEVICE
  description: >-
    Ablation of the non-perfused peripheral retina to remove the ischaemic drive to
    neovascularisation. It is the primary ophthalmic treatment proposed in the only systematic
    series of telomere-disorder retinopathy, with anti-VEGF reserved for angiographically
    active eyes.

    The evidence is a case series with a proposed staging system, not a trial, and in the
    assembled Revesz cohort retinopathy still led to severe visual loss in most children
    despite treatment. What laser can plausibly do is preserve some vision if applied before
    the exudative and tractional stages, which is the argument for angiographic screening
    rather than for treating established disease.
  treatment_term:
    preferred_term: laser photocoagulation
    term:
      id: NCIT:C217424
      label: Laser Photocoagulation
  target_mechanisms:
  - target: Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
    description: >-
      Ablates the ischaemic peripheral retina, interrupting the ischaemia-to-neovascularisation
      step. It does not address the telomere defect that produced the non-perfusion.
  evidence:
  - reference: PMID:42617951
    reference_title: "Retinopathy in Dyskeratosis Congenita and Related Telomere Biology Disorders: Short Telomere Associated Retinopathy (STAR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose a staging system and discuss management strategies, including laser
      photocoagulation as the primary treatment, with adjunctive anti-VEGF agents for vascularly
      active eyes and vitreoretinal surgery for vitreous hemorrhage and retinal detachment.
    explanation: >-
      The management proposal from the largest angiographic series, including the place of laser
      relative to anti-VEGF and surgery.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      retinopathy led to a severe loss of visual acuity in most patients. Glaucoma occurred in
      three cases.
    explanation: >-
      The visual outcome despite treatment across the assembled cohort. NO_EVIDENCE because the
      sentence reports an outcome in a mixed, uncontrolled group rather than an assessment of
      whether treatment helped; it neither supports nor refutes laser efficacy, and is quoted so
      the treatment is not read as effective on this evidence.

- name: Pars Plana Vitrectomy
  therapeutic_modality: SURGERY
  description: >-
    Vitreoretinal surgery for the end-stage ocular complications - vitreous haemorrhage and
    tractional retinal detachment. Anatomical reattachment with some visual improvement has
    been achieved in individual Revesz patients, in one report after repeated surgery on the
    worse eye, so surgery is worth offering rather than withholding on grounds of prognosis.
    The evidence is single case reports.
  treatment_term:
    preferred_term: vitrectomy
    term:
      id: NCIT:C50837
      label: Vitrectomy
  target_mechanisms:
  - target: Retinal Detachment
    description: >-
      Relieves vitreoretinal traction and clears haemorrhage so the retina can reattach. Purely
      anatomical; the underlying vasculopathy is untouched.
  evidence:
  - reference: PMID:34189343
    reference_title: "Revesz syndrome with bilateral retinal detachments successfully treated by pars plana vitrectomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A retinal attachment with vision improvement was achieved by a single surgery for the
      right eye and after repeated surgeries for the left eye.
    explanation: >-
      The surgical outcome in the one Revesz patient reported in detail, including that the left
      eye needed repeated surgery.

- name: Multisystem Surveillance and Supportive Care
  therapeutic_modality: OTHER
  description: >-
    Because transplantation corrects only the haematopoietic branch, surveillance of the other
    branches continues afterwards: ophthalmic review, pulmonary assessment, and the hepatic and
    malignancy surveillance that applies across telomere biology disorders. There is no
    Revesz-specific surveillance protocol; the telomere biology disorder guidance applies.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Extreme Telomere Shortening
    description: >-
      Detects the consequences of the shared upstream defect in each affected organ; it does not
      modify it.
  evidence:
  - reference: PMID:39371255
    reference_title: "Inherited Telomere Biology Disorders: Pathophysiology, Clinical Presentation, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Revesz syndrome typically features bilateral exudative retinopathy, intracranial
      calcification, cerebellar hypoplasia thereby causing ataxia, (intrauterine) growth
      restriction, general developmental delay, and fine hairs.
    explanation: >-
      The multisystem feature list that determines which specialties surveillance has to cover.

clinical_trials:
- name: NCT01659606
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Radiation- and alkylator-free haematopoietic cell transplantation for marrow failure due to
    dyskeratosis congenita and telomere disease. The ClinicalTrials.gov record lists Revesz
    syndrome among its conditions alongside dyskeratosis congenita, Hoyeraal-Hreidarsson
    syndrome and aplastic anaemia. Its premise is exactly the conditioning problem this disease
    poses: DNA-damaging conditioning agents worsen the lung, liver and cancer risk that short
    telomeres already create.
  evidence:
  - reference: clinicaltrials:NCT01659606
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the biology of DC, we hypothesize that it may be possible to avoid these DNA
      damaging agents in patients with DC, and still have a successful BMT.
    explanation: >-
      The trial's stated hypothesis, which is the rationale behind the reduced-intensity
      conditioning already used in the Revesz patients who were transplanted.

- name: NCT06817590
  phase: PHASE_I
  status: RECRUITING
  description: >-
    Oral nucleoside therapy in telomere biology disorders. The ClinicalTrials.gov record lists
    Revesz syndrome among its conditions. This is the only trial of a systemic,
    mechanism-directed treatment for which patients with this disease are eligible; it is phase
    I, and no efficacy claim should be read into its existence.
  evidence:
  - reference: clinicaltrials:NCT06817590
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goal of this clinical trial is to learn if a combination therapy of deoxycytidine (dC)
      plus deoxythymidine (dT) is safe in patients with telomere biology disorders.
    explanation: >-
      The trial's stated objective and enrolled population, which is the class this disease
      belongs to. Quoted to establish eligibility, not to make any claim about the intervention -
      it is a phase I safety study.

differential_diagnoses:
- name: Hoyeraal-Hreidarsson Syndrome
  description: >-
    The other severe infantile variant of dyskeratosis congenita, and the closest relative.
    Shares cerebellar hypoplasia, intrauterine growth restriction and early marrow failure with
    Revesz syndrome, and was lumped with it into the same TINF2 entity by ClinGen. Distinguished
    clinically by microcephaly, progressive immunodeficiency and more severe cognitive
    impairment, and by the absence of the exudative retinopathy - although proliferative
    retinopathy has been reported in Hoyeraal-Hreidarsson too, which weakens that boundary as
    well.
  distinguishing_features:
  - Microcephaly and progressive immunodeficiency, which are not features of Revesz syndrome.
  - >-
    Not confined to TINF2 - Hoyeraal-Hreidarsson syndrome also arises from RTEL1, TERT, ACD,
    PARN and DKC1 variants.
  evidence:
  - reference: PMID:39371255
    reference_title: "Inherited Telomere Biology Disorders: Pathophysiology, Clinical Presentation, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hoyeraal-Hreidarsson syndrome, on the other hand, shares some signs of Revesz syndrome
      such as cerebellar hypoplasia and intrauterine growth restriction, but can also present
      with progressive immunodeficiency, microcephaly, and moderate to severe mental retardation.
    explanation: >-
      The overlap and the distinguishing features, stated side by side by a recent review.

- name: Coats Plus Syndrome
  description: >-
    Cerebroretinal microangiopathy with calcifications and cysts, caused by biallelic CTC1
    variants. It reproduces the Revesz combination of bilateral exudative retinopathy and
    intracranial calcification through a different telomere-maintenance gene, and the two were
    described in the literature as having key similarities before either gene was known.

    It is the most instructive differential in this file, because it shows the Revesz phenotype
    is reachable from a different lesion in the same pathway - which argues that the retinal and
    CNS branches are a property of severe telomere dysfunction rather than of TINF2. dismech
    does not yet curate Coats plus; the two entities should be decided together.
  distinguishing_features:
  - >-
    Autosomal recessive CTC1 variants rather than dominant TINF2, and intracranial cysts and
    leukodystrophy in addition to calcification.
  - >-
    Telomere length is not necessarily reduced, which limits the value of telomere-length
    screening in distinguishing it.
  - >-
    Bone marrow failure, when it occurs, is later - adolescence or early adulthood rather than
    infancy - and gastrointestinal bleeding is prominent.
  evidence:
  - reference: PMID:39371255
    reference_title: "Inherited Telomere Biology Disorders: Pathophysiology, Clinical Presentation, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Early severe pediatric forms of TBDs with often characteristic underlying genetic variants
      are the Revesz syndrome, the Hoyeraal-Hreidarsson syndrome, and the Coats plus syndrome
    explanation: >-
      Groups the three severe paediatric telomere biology disorders together, which is the
      differential set a clinician faces.

- name: Retinopathy of Prematurity
  description: >-
    Included because it is the misdiagnosis that has actually happened. Revesz syndrome presents
    with bilateral peripheral retinal non-perfusion in an infant, frequently one born preterm or
    small for gestational age, which is precisely the setting in which retinopathy of prematurity
    is expected. At least one child was treated with bilateral laser for presumed retinopathy of
    prematurity before the systemic diagnosis emerged, and others were managed as Coats disease
    or familial exudative vitreoretinopathy.
  distinguishing_features:
  - >-
    Cytopenias, growth restriction and nail or skin change accompanying the retinopathy, none of
    which belong to retinopathy of prematurity.
  - >-
    Progression or new exudative change after the window in which retinopathy of prematurity
    would be expected to stabilise.
  evidence:
  - reference: PMID:35724369
    reference_title: "The Masquerading Retinopathy of Revesz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the case of a 2-year-old male child, initially treated with bilateral laser
      photocoagulation for retinopathy of prematurity. He developed exudative changes in the
      right eye, presumed to be Coats disease.
    explanation: >-
      A documented case in which Revesz syndrome was treated first as retinopathy of prematurity
      and then as Coats disease before the diagnosis was made.

animal_models:
- name: TIN2(DC) knock-in mouse (K280E equivalent)
  species: Mouse
  genotype: Tinf2 knock-in, equivalent of human TIN2 K280E dyskeratosis congenita allele, heterozygous
  publication: PMID:24449270
  genes:
  - preferred_term: TINF2
    term:
      id: hgnc:11824
      label: TINF2
  description: >-
    A gene-targeted mouse carrying the murine equivalent of TIN2 K280E, a dyskeratosis congenita
    cluster allele that falls inside the same 280-289 window as every reported Revesz variant.
    Homozygotes are inviable; heterozygotes are healthy in the first generation and develop mild
    pancytopenia and reduced fecundity only in the second and third, as bone marrow telomeres
    shorten across generations.

    It is the only in vivo model of a Revesz-window TINF2 allele. It is emphatically not a model
    of Revesz syndrome.
  modeled_mechanisms:
  - target: Extreme Telomere Shortening
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the central molecular consequence - progressive telomere attrition from a
      heterozygous DC-cluster TIN2 allele - and reproduces a mild haematopoietic phenotype
      downstream of it. It also produced the finding that the attrition is not solely
      telomerase-dependent, which the human system could not have shown.
    limitations: >-
      Laboratory mice begin with telomeres several times longer than human telomeres, so a
      single generation cannot reach a pathogenic length; the phenotype only appears after
      successive intercrosses, which is a breeding artefact with no human counterpart. The
      haematopoietic phenotype is mild pancytopenia in adult mice rather than the fatal infantile
      marrow failure of this disease. Neither the retinal nor the cerebral branch of the human
      pathograph was assessed - the paper reports no ophthalmic or neuroimaging examination - so
      this model says nothing about the two features that define Revesz syndrome, and its silence
      on them is untested rather than negative.
    readouts:
    - name: Bone marrow telomere length across successive generations
      target: Extreme Telomere Shortening
      direction: DECREASED
      interpretation: >-
        The core readout: telomeres in the haematopoietic compartment shorten progressively over
        generations in heterozygotes, the murine counterpart of the very short telomeres measured
        in patients.
      evidence:
      - reference: PMID:24449270
        reference_title: "A TIN2 dyskeratosis congenita mutation causes telomerase-independent telomere shortening in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Bone marrow telomeres of TIN2(+/DC) mice shortened over the generations, and
          immortalized TIN2(+/DC) mouse embryonic fibroblasts (MEFs) showed telomere shortening
          with proliferation.
        explanation: >-
          The telomere measurement in marrow and in fibroblasts that grounds this readout.
    - name: Peripheral blood counts in second- and third-generation heterozygotes
      target: Extreme Telomere Shortening
      direction: DECREASED
      interpretation: >-
        The haematopoietic consequence, and the point at which the model's severity diverges
        sharply from the human disease: mild pancytopenia in later generations of adult mice
        versus universal marrow failure by age six in children.
      evidence:
      - reference: PMID:24449270
        reference_title: "A TIN2 dyskeratosis congenita mutation causes telomerase-independent telomere shortening in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the second and third generations, the TIN2(+/DC) mice developed mild pancytopenia,
          consistent with hematopoietic dysfunction in DC, as well as diminished fecundity.
        explanation: >-
          The blood-count phenotype, and the generation at which it appears.
  evidence:
  - reference: PMID:24449270
    reference_title: "A TIN2 dyskeratosis congenita mutation causes telomerase-independent telomere shortening in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we generated mice with the equivalent of the TIN2 K280E DC allele (TIN2(DC)) by gene
      targeting
    explanation: >-
      Establishes the allele modelled, which lies inside the same exon-6 window as every reported
      Revesz variant.
  - reference: PMID:24449270
    reference_title: "A TIN2 dyskeratosis congenita mutation causes telomerase-independent telomere shortening in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whereas homozygous TIN2(DC/DC) mice were not viable, first-generation TIN2(+/DC) mice were
      healthy and fertile.
    explanation: >-
      The generational limitation that governs how this model must be interpreted: a
      first-generation heterozygote is normal.

experimental_models:
- name: Ectopic DC-cluster TIN2 missense expression in human cells
  experimental_model_type: CELL_LINE
  publication: PMID:21536674
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  description: >-
    Human cells expressing TIN2 carrying dyskeratosis congenita cluster missense mutations. The
    system reproduces accelerated telomere shortening and was used to establish what the mutants
    can and cannot do: they lose telomerase association while leaving total telomerase activity,
    TIN2 localisation and telomere end protection intact.
  modeled_mechanisms:
  - target: Impaired Shelterin-Mediated Telomere Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the molecular phenotype of a DC-cluster TIN2 allele - progressive telomere
      shortening - in human cells, and localises the defect to telomerase recruitment rather than
      to end protection.
    limitations: >-
      Ectopic overexpression on a wild-type background, not the heterozygous endogenous state of
      a patient; transformed cell lines rather than the stem cell compartments that fail in the
      disease; and a molecular readout with no tissue phenotype. It also cannot address the
      telomerase-independent component that the mouse work later identified, because the system
      retains endogenous telomerase throughout.
    readouts:
    - name: Telomere length in cells expressing DC-mutant TIN2
      target: Impaired Shelterin-Mediated Telomere Maintenance
      direction: DECREASED
      interpretation: >-
        Accelerated telomere shortening, reproducing the patient phenotype in a controlled human
        cell system.
      evidence:
      - reference: PMID:21536674
        reference_title: "TIN2 protein dyskeratosis congenita missense mutants are defective in association with telomerase."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          ectopic expression of TIN2 with DC missense mutations in human cells led to accelerated
          telomere shortening, similar to the telomere phenotypes found in DC patients
        explanation: >-
          The telomere-length readout and the authors' own comparison of it to the patient
          phenotype.
    - name: Total cellular telomerase activity and telomere end protection status
      target: Impaired Shelterin-Mediated Telomere Maintenance
      direction: UNCHANGED
      interpretation: >-
        A negative result that carries the argument: the shortening is not explained by less
        telomerase or by loss of end protection, which is what narrows the defect to recruitment.
      evidence:
      - reference: PMID:21536674
        reference_title: "TIN2 protein dyskeratosis congenita missense mutants are defective in association with telomerase."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          However, this telomere shortening was not accompanied by changes in total telomerase
          activity, localization of TIN2, or telomere end protection status.
        explanation: >-
          The three measurements that were unchanged, and the reason the conclusion is specific.

discussions:

- discussion_id: revesz_is_a_severity_band_not_a_disease
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is Revesz syndrome a disease, or a severity band on TINF2 dyskeratosis congenita that two
    authorities have already voted to retire?
  attaches_to:
  - disease#Revesz Syndrome
  - phenotypes#Bilateral Exudative Retinopathy
  - genetic#TINF2
  rationale: >-
    The case for retiring the eponym is strong and comes from two independent directions.
    ClinGen's Interstitial Lung Disease Gene Curation Expert Panel applied the Lumping and
    Splitting Working Group criteria in 2024 and merged Revesz syndrome into TINF2-related short
    telomere syndrome, finding no difference in molecular mechanism or inheritance from classical
    dyskeratosis congenita. Independently, a 2026 widefield angiography series found
    retinovascular abnormality in every eye of every telomere biology disorder patient examined,
    most of them asymptomatic, and proposed replacing the eponym with Short Telomere Associated
    Retinopathy. Add the Karremann review's finding that genotype cannot define the syndrome, and
    the entity has no mechanistic, genetic or now even phenotypic boundary.

    The case for keeping a record is narrower but real. The natural history is categorically
    different - median survival 6.5 years against survival into adulthood in classical
    dyskeratosis congenita - and the retinal and cerebral branches of the pathograph are absent
    from the dismech Dyskeratosis Congenita entry, whose subtype list is keyed by gene and whose
    Subtype records cannot hold pathophysiology in any case. MONDO, OMIM and Orphanet all still
    carry the term, so a clinician or a pipeline will keep encountering it.

    This entry takes the position that curating the concept with the dispute attached is more
    useful than deleting it: a reader who arrives at MONDO:0009990 should find the lumping
    decision and the STAR proposal, not silence. If dismech later curates TINF2-related short
    telomere syndrome as an entity, this file should be reconsidered as a subtype of it.
  evidence:
  - reference: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
    reference_title: "TINF2 / dyskeratosis congenita, autosomal dominant 3 (Definitive)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Per criteria outlined by the ClinGen Lumping and Splitting Working Group, we found no
      difference in molecular mechanism or inheritance pattern between these conditions
      suggesting that these may constitute a disease spectrum associated with variants in TINF2 .
    explanation: >-
      The formal, criteria-based decision against Revesz syndrome being a separate entity. REFUTE
      relative to the claim that this is a distinct disease.
  - reference: PMID:42617951
    reference_title: "Retinopathy in Dyskeratosis Congenita and Related Telomere Biology Disorders: Short Telomere Associated Retinopathy (STAR)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with retinopathy have been termed Revesz syndrome until now, but with the advent
      of WF-FA, we show that the retinopathy is likely more prevalent than previously thought.
    explanation: >-
      The ophthalmological argument against the eponym: the feature that defines it is not
      distinctive once imaged properly.
  - reference: PMID:42617951
    reference_title: "Retinopathy in Dyskeratosis Congenita and Related Telomere Biology Disorders: Short Telomere Associated Retinopathy (STAR)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that these findings be termed Short Telomere Associated Retinopathy (STAR) to
      reflect the underlying systemic pathophysiology.
    explanation: >-
      The proposed replacement terminology, named here so the concept is findable under both.
  - reference: PMID:39371255
    reference_title: "Inherited Telomere Biology Disorders: Pathophysiology, Clinical Presentation, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      certain pediatric forms such as the Revesz syndrome, the Hoyeraal-Hreidarsson syndrome, or
      the Coats plus syndrome are characterized by a strikingly more severe phenotype and earlier
      disease onset clearly distinct from classical DKC
    explanation: >-
      The counter-position, from a 2024 review: the severe paediatric forms are clinically
      distinct from classical dyskeratosis congenita. Note this is a phenotype description rather
      than a nosological ruling, so it is weaker in kind than the ClinGen decision it opposes.

- discussion_id: revesz_tissue_selectivity_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do the retina and the cerebral microvasculature fail catastrophically in these children
    when other carriers of the identical TINF2 variant develop classical dyskeratosis congenita?
  attaches_to:
  - pathophysiology#Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
  - pathophysiology#Intracranial Calcification and Cerebrovascular Fragility
  - pathophysiology#TINF2 Exon 6 Cluster Variant
  rationale: >-
    This is the central unexplained fact of the disease. R282H appears in unrelated probands with
    classical dyskeratosis congenita, with Revesz syndrome, and with overlapping presentations,
    and the review that assembled the cohort states that genotype alone cannot define the
    syndrome. Something other than the TINF2 allele determines whether a child develops
    sight-destroying retinopathy and intracranial calcification in infancy.

    No candidate has been tested. Parentally inherited telomere length, a modifier locus, a
    second variant, and stochastic variation in how short telomeres are at conception are all
    plausible and none has been examined in a Revesz cohort - which, at eighteen patients across
    the whole literature, may be too small to examine any of them. The STAR finding partially
    dissolves the question for the retina by making retinopathy universal, but it does not touch
    the CNS branch, and it does not explain the difference in severity and age of onset.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, the same mutations in TINF2 may be found in classical DKC patients presenting
      clinically without the distinct RS phenotype, hence, the genotype alone is not able to
      define RS
    explanation: >-
      The statement of the gap: identical genotype, different disease.
  proposed_experiments:
  - experiment_id: revesz_modifier_and_telomere_setpoint
    name: Parental telomere-length and modifier analysis across TINF2 carriers stratified by ocular phenotype
    description: >-
      Assemble TINF2 exon-6 carriers with and without early exudative retinopathy, measure
      telomere length in the probands and both parents, and sequence for modifier variants in
      telomere-maintenance and retinal-vascular genes. The design tests whether the Revesz
      phenotype tracks a shorter inherited telomere set point rather than a distinct lesion.
    would_support:
    - pathophysiology#Extreme Telomere Shortening
    supporting_outcome:
    - >-
      Carriers with the Revesz phenotype have shorter telomeres, or shorter parental telomeres,
      than genotype-matched carriers without it, in a dose-dependent relation to age of ocular
      onset.
    would_refute:
    - pathophysiology#Extreme Telomere Shortening
    refuting_outcome:
    - >-
      Telomere length is indistinguishable between carriers with and without the Revesz
      phenotype, which would place the determinant outside telomere length altogether.
  - experiment_id: revesz_retinal_endothelial_senescence
    name: Senescence and telomere phenotyping of retinal microvascular endothelium in telomere biology disorders
    description: >-
      Measure telomere length and senescence markers in retinal microvascular endothelial cells -
      from donor eyes, or from patient iPSC-derived retinal microvascular endothelium - and
      compare against a matched non-retinal endothelial bed, to test whether the retinal
      periphery is intrinsically more vulnerable to short telomeres than other vascular beds.
    would_support:
    - pathophysiology#Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
    supporting_outcome:
    - >-
      Retinal microvascular endothelium shows shorter telomeres and higher senescence-marker
      burden than the comparator bed in the same patients, with peripheral retina worse than
      posterior pole.
    would_refute:
    - pathophysiology#Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
    refuting_outcome:
    - >-
      No difference in telomere length or senescence between retinal and comparator endothelium,
      which would make peripheral non-perfusion a consequence of something other than endothelial
      replicative failure.

- discussion_id: tin2_dc_mechanism_dispute
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do DC-cluster TIN2 variants shorten telomeres by failing to recruit telomerase, by causing a
    telomerase-independent replication defect, or by both?
  attaches_to:
  - pathophysiology#Impaired Shelterin-Mediated Telomere Maintenance
  - mechanistic_hypotheses#tin2_telomerase_recruitment_defect
  - mechanistic_hypotheses#tin2_telomere_replication_defect
  rationale: >-
    Two well-executed studies reach different answers, and the disagreement is real rather than
    apparent. Human-cell work shows DC-cluster TIN2 mutants losing telomerase association while
    end protection is intact, which is a recruitment defect. Mouse knock-in work shows the same
    class of allele accelerating telomere shortening with telomerase RNA deleted entirely, which
    a recruitment defect cannot produce, together with ATR signalling and fragile telomeres.

    The most likely resolution is that both operate, in different compartments - recruitment
    failure in telomerase-positive stem cells, replication failure in telomerase-negative somatic
    tissue - which is what the mouse authors themselves propose. If that is right it has a
    consequence for this disease specifically: a replication defect in telomerase-negative tissue
    would predict damage in slowly renewing compartments such as retinal endothelium, which is
    exactly where this syndrome differs from classical marrow-limited disease. Nobody has tested
    that prediction.
  evidence:
  - reference: PMID:24449270
    reference_title: "A TIN2 dyskeratosis congenita mutation causes telomerase-independent telomere shortening in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest that this TIN2-DC mutation could induce telomeric dysfunction phenotypes
      in telomerase-negative somatic cells and tissues that further exacerbate the telomere
      maintenance problems in telomerase-positive stem cell compartments.
    explanation: >-
      The authors' own proposed reconciliation of the two mechanisms, and the source of the
      testable prediction about slowly renewing tissue.

- discussion_id: revesz_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can any current model reproduce the retinal and CNS phenotypes that define Revesz syndrome?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
  rationale: >-
    The only in vivo model of a Revesz-window TINF2 allele is the TIN2(DC) knock-in mouse, and it
    models the wrong part of the disease. Its phenotype is mild pancytopenia appearing only in the
    second and third generations, because laboratory mice start with far longer telomeres than
    humans; first-generation heterozygotes are healthy and fertile. No ophthalmic or neuroimaging
    assessment is reported, so the model is silent rather than negative on the retinal and CNS
    branches.

    This is a HUMAN_MODEL_MISMATCH rather than a plain gap because a model does exist and is
    informative - it produced the telomerase-independent finding that the human system could not
    have - while being structurally unable to address the features that define the disease. Any
    model that could would need a short-telomere background, such as a late-generation
    telomerase-null mouse, or a human iPSC-derived retinal vascular system.
  evidence:
  - reference: PMID:24449270
    reference_title: "A TIN2 dyskeratosis congenita mutation causes telomerase-independent telomere shortening in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Whereas homozygous TIN2(DC/DC) mice were not viable, first-generation TIN2(+/DC) mice were
      healthy and fertile.
    explanation: >-
      The generational limitation that makes this model a poor match for an infantile human
      disease.

notes: >-
  **The lump-or-split decision, and how it was reached.** The stub was recorded as a Disease and
  curated as a standalone entry, against a genuinely strong case for making it a subtype. The
  deciding argument was structural rather than biological. Biologically, the case for a subtype is
  better: Revesz has no upstream mechanistic divergence from TINF2 dyskeratosis congenita at all -
  it is the same gene, the same exon, often the same allele, and the same shelterin defect - which
  is precisely the divergence that justified a standalone entry for methylmalonic aciduria cblA in
  issue #10260. ClinGen's Lumping and Splitting Working Group reached the same conclusion formally
  in 2024 and merged the concept away.

  What decided it the other way is what a subtype record can hold. The dismech Dyskeratosis
  Congenita pathograph has three nodes and terminates in marrow, lung and liver; it has no retinal
  and no CNS branch, and its has_subtypes list is keyed by gene, so Revesz - which is not a gene,
  and whose alleles also produce non-Revesz disease - has no axis to sit on. More decisively, the
  Subtype class in this schema carries name, term, mappings, description, evidence, genes,
  frequency and inheritance and nothing else: no pathophysiology, no progression, no treatments, no
  models, no discussions. Recording Revesz as a subtype would have bound MONDO:0009990 and
  discarded the retinal and cerebral limbs of the pathograph, the two competing TIN2 mechanisms,
  the natural history, the transplant outcomes, and the STAR reframing - which is the material this
  file exists to preserve. That is the same shape of argument the cblA PR made about its umbrella's
  subtype axis, applied to a different limitation.

  Dyskeratosis_Congenita.yaml was not modified. It still describes Revesz in its top-level prose,
  in its TINF2 subtype description, and as an unattached Exudative retinopathy phenotype, and it
  still binds no MONDO term for it. That duplication is deliberate and follows the cblA precedent
  of leaving the umbrella alone.

  **Named entity confusion.** The gene is not the trap here - TINF2 is uncontested and preflight-dr
  passed cleanly with 52 TINF2 mentions and the correct OMIM. The trap is the neighbouring
  syndromes, which share the retinopathy, the calcification, or both: Coats plus / cerebroretinal
  microangiopathy (CTC1), Hoyeraal-Hreidarsson syndrome, and the growing literature on
  telomere-disorder retinopathy in TERT, RTEL1 and TERC patients. Every clinical citation in this
  file was checked to be about patients labelled Revesz syndrome, with two deliberate exceptions
  that are marked as such: the Walne TINF2 series and the STAR angiography series are about broader
  telomere-disorder cohorts, and each is used with directness INDIRECT or with an explanation
  saying what population it describes. A TINF2 autopsy study of tissue-specific telomere shortening
  was read and excluded, because its patient had classical dyskeratosis congenita and survived to
  eighteen.

  **What was deliberately not curated.** No biochemical, histopathology, imaging_findings or
  dataset sections: there is no neuropathology series, no biomarker panel and no omics dataset for
  this disease, and populating those from telomere-disorder sources generally would manufacture
  depth that does not exist. No frequency band on intrauterine growth restriction or retinal
  detachment, because the available numbers come from the wrong denominator in each case. No
  androgen or nucleoside pharmacotherapy treatment entry: danazol response data come from adult
  telomere-disorder cohorts and there is no Revesz evidence, so the nucleoside trial is recorded
  under clinical_trials as eligibility rather than as treatment.

  **Related queue items.** stubs/Coats_Plus_Syndrome.yaml is open and covers the disease with the
  most nearly identical pathograph to this one; the two should ideally be decided by the same
  curator. Hoyeraal-Hreidarsson syndrome is in the same position as Revesz was - described in the
  Dyskeratosis Congenita entry, bound nowhere - and currently survives in the queue only as a
  synonym on stubs/Dyskeratosis_Congenita_X-linked.yaml, which is a misfiling because
  Hoyeraal-Hreidarsson is not confined to DKC1. Neither was addressed in this PR.


  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intracranial hemorrhage was detected in three patients during the course of the disease
    explanation: >-
      Three of eighteen, which places this in the OCCASIONAL band of 5-29%.

- category: Ophthalmologic
  name: Retinal Detachment
  description: >-
    Tractional retinal detachment following neovascularisation and vitreous haemorrhage. No

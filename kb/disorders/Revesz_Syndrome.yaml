- category: Neurologic
  name: Seizures
  frequency: OCCASIONAL
  description: >-
    Seizures in a minority, beginning exclusively in early childhood. The cumulative incidence
    was estimated at 20%, which places this in the OCCASIONAL band and makes it one of the

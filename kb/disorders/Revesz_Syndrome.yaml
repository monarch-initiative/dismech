name: Revesz Syndrome
creation_date: "2026-08-31T18:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Revesz syndrome
  term:
    id: MONDO:0009990
    label: Revesz syndrome
synonyms:
- DKCA5
- dyskeratosis congenita, autosomal dominant 5
- dyskeratosis congenita with bilateral exudative retinopathy
- retinopathy-anemia-central nervous system anomalies syndrome
- exudative retinopathy with bone marrow failure
- Revesz-Debuse syndrome
- TINF2-associated Revesz syndrome
description: >-
  The severe infantile end of the telomere biology disorder spectrum: bilateral exudative
  retinopathy and bone marrow failure, both beginning in the first two years of life, with
  intracranial calcification, cerebellar hypoplasia, growth restriction and a median survival
  of six and a half years. It is caused by heterozygous TINF2 variants in a nine-residue
  window of exon 6, almost always de novo. Fewer than twenty patients have ever been
  described with enough clinical detail to analyse.

  **This entry curates a diagnostic label that two authorities are actively trying to
  retire, and that is the most important thing in it.** In November 2024 ClinGen's
  Interstitial Lung Disease Gene Curation Expert Panel applied the Lumping and Splitting
  Working Group criteria to TINF2 and lumped Revesz syndrome (OMIM 268130) together with
  autosomal dominant dyskeratosis congenita 3, Hoyeraal-Hreidarsson syndrome and pulmonary
  fibrosis into a single entity, TINF2-related short telomere syndrome, on the ground that
  no difference in molecular mechanism or inheritance pattern separates them. In August 2026
  a 22-patient widefield fluorescein angiography study found retinovascular abnormality in
  every eye of every telomere biology disorder patient examined - 81.8% of them asymptomatic -
  and proposed replacing the eponym with Short Telomere Associated Retinopathy. If the
  defining feature is universal in the parent disease once you look for it properly, Revesz
  syndrome names a point on a severity continuum rather than a separate disease.

  Three things nevertheless make this worth a file of its own rather than a line on
  Dyskeratosis Congenita. The mechanism is not where the two differ - upstream, Revesz is
  TINF2 dyskeratosis congenita and nothing else - but the *tissues that fail* are. The
  dismech Dyskeratosis Congenita pathograph runs telomere attrition to senescence to stem
  cell exhaustion to marrow, lung and liver, and has no retinal and no CNS limb at all; those
  limbs are what this file adds. Second, that entry's has_subtypes list is keyed by gene, and
  Revesz is not a gene: the same TINF2 alleles produce classical dyskeratosis congenita in
  other patients, which the Karremann review states outright. Third, a Subtype record in this
  schema carries a name, a term, genes and inheritance - it cannot carry pathophysiology,
  progression, treatments or models - so recording Revesz as a subtype would bind the MONDO
  term and discard the mechanism.

  What is *not* claimed here: that Revesz is genetically or mechanistically separable from
  TINF2 dyskeratosis congenita. It is not, and the entry says so repeatedly. The open
  question - why the retina and the cerebral microvasculature fail catastrophically in these
  children and not in other carriers of the same variant - is curated as a knowledge gap
  rather than papered over.

parents:
- Dyskeratosis Congenita
- Telomere Biology Disorder
- Inherited Bone Marrow Failure Syndrome

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence or incidence estimate exists. The largest analysis assembled 18 children
    from the entire English-language literature up to 2020, which is the whole denominator
    the disease has. ULTRA_RARE is the qualitative band; no numeric prevalence_class tier is
    recorded because no numeric estimate exists to place in one.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The literature review included 18 children.
    explanation: >-
      The size of the only assembled cohort, and therefore of the entire clinical evidence
      base for this disease.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Revesz syndrome is an extremely rare disorder, and to date, patients have only been
      published anecdotally.
    explanation: >-
      The review's own characterisation of the evidence base as anecdotal, which is why no
      rate is recorded.

progression:
- phase: Retinopathy onset
  age_range: 6 to 18 months
  notes: >-
    Retinopathy is typically the first manifestation, preceding marrow failure by months.
    That ordering matters clinically: several children were first diagnosed with retinopathy
    of prematurity, Coats disease or familial exudative vitreoretinopathy and only later
    recognised as having a telomere biology disorder.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinopathy occurred typically between 6 and 18 months of age (median age 1.1 years;
      95% CI 0.7-1.5).
    explanation: >-
      The reported timing of retinopathy onset across the assembled cohort.

- phase: Bone marrow failure
  age_range: birth to 6 years, median 1.5 years
  notes: >-
    Marrow failure follows the retinopathy and is the usual cause of death.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients experienced early bone marrow failure, in most cases within the second
      year of life (median age 1.5 years; 95% CI 1.4-1.6).
    explanation: >-
      The reported timing and universality of marrow failure.

- phase: Death in childhood
  age_range: median 6.5 years, none beyond 12 years
  notes: >-
    Survival is the sharpest quantitative difference between this entity and classical
    dyskeratosis congenita, where survival into adulthood is ordinary. Whether that
    difference justifies a separate disease label or simply marks the severe tail of one
    disease is the nosological question this entry does not settle.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Kaplan-Meier estimate of survival was dismal (median survival 6.5 years; 95% CI
      3.6-9.4), and none of the patients survived beyond the age of 12 years.
    explanation: >-
      The survival analysis across all 18 assembled cases.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients died from BMF in most cases, but refractory lung failure was another cause of
      death in some cases.
    explanation: >-
      The reported causes of death, including the pulmonary complication that is the shared
      telomere-disorder endpoint.

pathophysiology:

- name: TINF2 Exon 6 Cluster Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous germline TINF2 variant in a strikingly narrow window: every variant in
    genotyped Revesz patients has fallen in exon 6, between amino acids 280 and 289 of TIN2.
    The recurrent allele is c.845G>A, and the same residue - 282 - accounts for the majority
    of TINF2 dyskeratosis congenita variants generally. Frameshift alleles producing truncated
    TIN2 occur in the same window.

    That window is the "dyskeratosis congenita cluster" of TIN2, and its constancy is the
    single most distinctive genetic fact about this disease. It is also the fact that most
    undermines Revesz as a separate entity: the identical variants are found in patients with
    classical dyskeratosis congenita who never develop the retinopathy. The founding TINF2
    paper makes the point in its own data, reporting R282H across three unrelated probands of
    whom only one had Revesz syndrome. Genotype therefore cannot define this disease, and no
    modifier that does has been identified.
  genes:
  - preferred_term: TINF2
    term:
      id: hgnc:11824
      label: TINF2
  genetic_context:
    gene:
      preferred_term: TINF2
      term:
        id: hgnc:11824
        label: TINF2
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline TINF2 variants confined to exon 6, amino acids 280-289; missense
      substitutions predominate, with frameshift alleles also reported. Almost always de novo.
      No functional_impact_category is recorded: the DC-cluster alleles are neither a clean
      loss of function nor a clean gain, and the two published mechanistic accounts of what
      they do to TIN2 disagree - see the mechanistic hypotheses below.
  downstream:
  - target: Impaired Shelterin-Mediated Telomere Maintenance
    causal_link_type: DIRECT
    description: >-
      TIN2 is a structural hub of shelterin; a variant in its DC cluster impairs the complex's
      maintenance of telomere length. The step is direct, but which molecular activity is lost
      is disputed, so both hypothesis groups attach to the edge below it rather than here.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of these harbored a TINF2 mutation and the underlying alterations were restricted to
      exon six.
    explanation: >-
      Establishes TINF2 exon 6 as the location of every variant found in genotyped Revesz
      patients.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hence, all mutations were located between amino acid 280 and 289.
    explanation: >-
      The nine-residue window that all reported Revesz alleles fall within.
  - reference: PMID:18252230
    reference_title: "TINF2, a component of the shelterin telomere protection complex, is mutated in dyskeratosis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that a fifth gene, TINF2, is mutated in classical DC and, for the first
      time, in Revesz syndrome.
    explanation: >-
      The paper that first attached TINF2 to this disease, and in the same sentence to
      classical dyskeratosis congenita - the ambiguity the entity has carried ever since.
  - reference: PMID:18669893
    reference_title: "TINF2 mutations result in very short telomeres: analysis of a large cohort of patients with dyskeratosis congenita and related bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      A total of 21 of the mutations affected amino acid 282, changing arginine to histidine
      (n = 14) or cysteine (n = 7).
    explanation: >-
      The dominance of residue 282 in a large TINF2 series. INDIRECT for this node because the
      series is TINF2 dyskeratosis congenita broadly rather than Revesz syndrome specifically;
      it establishes the hotspot, not its relation to the Revesz phenotype.

- name: Impaired Shelterin-Mediated Telomere Maintenance
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Shelterin is the six-protein complex that coats the telomere and suppresses the DNA damage
    response there. TIN2 is its structural hub, binding TRF1 and TRF2 on the duplex telomeric
    DNA and TPP1 - and through TPP1, POT1 - on the single-stranded overhang. A DC-cluster
    variant leaves the complex assembled but impairs its regulation of telomere length.

    What exactly is impaired is genuinely disputed, and the two published accounts are set out
    as separate hypothesis groups rather than blended. One holds that DC-cluster TIN2 mutants
    lose the ability to recruit telomerase; the other, from a knock-in mouse, holds that they
    cause a telomerase-independent replication defect at the telomere. The experiments behind
    each are sound, they are not mutually exclusive, and no work has apportioned them.
  genes:
  - preferred_term: TINF2
    term:
      id: hgnc:11824
      label: TINF2
  protein_complexes:
  - preferred_term: shelterin complex
    term:
      id: GO:0070187
      label: shelterin complex
  biological_processes:
  - preferred_term: telomere maintenance
    term:
      id: GO:0000723
      label: telomere maintenance
    modifier: DECREASED
  cellular_components:
  - preferred_term: telomeric region of the chromosome
    term:
      id: GO:0000781
      label: chromosome, telomeric region
  downstream:
  - target: Extreme Telomere Shortening
    causal_link_type: DIRECT
    hypothesis_groups:
    - tin2_telomerase_recruitment_defect
    description: >-
      Under the recruitment model, the DC-cluster variant reduces TPP1-dependent delivery of
      telomerase to the telomere, so telomeres are not replenished and shorten with every
      division.
  - target: Extreme Telomere Shortening
    causal_link_type: DIRECT
    hypothesis_groups:
    - tin2_telomere_replication_defect
    description: >-
      Under the replication model, the DC-cluster variant makes the telomere a fragile
      replication substrate, producing attrition that persists in the complete absence of
      telomerase.
  evidence:
  - reference: CGGV:assertion_b32866f2-6fa1-4a63-9624-3588d0811ea7-2025-02-20T170000.000Z
    reference_title: "TINF2 / dyskeratosis congenita, autosomal dominant 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is caused by mutations in the TINF2 gene, which encodes a component of shelterin, a
      six-protein complex that coats the telomere and is essential for suppressing the DNA
      damage response at telomeres
    explanation: >-
      The expert panel's statement of the molecular role of the affected complex.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In RS, mutations in TINF2 at chromosome 14q11.2 result in dysfunctional TIN2 protein
      leading to impaired telomere protection by the shelterin complex
    explanation: >-
      The review's statement of this step as it applies specifically to Revesz syndrome.

- name: Extreme Telomere Shortening
  biological_scale: CELLULAR
  description: >-
    Telomeres far below the first age-adjusted percentile - shorter, as a group, than in any
    other genetic subtype of dyskeratosis congenita. In the assembled Revesz cohort every
    patient with a measurement had a very short result, and in a large TINF2 series the
    telomere lengths were the shortest of all dyskeratosis congenita subtypes while telomerase
    RNA levels were normal, which localises the defect to the telomere rather than to the
    enzyme.

    This is the quantitative link between the genotype and the severity, and the reason
    telomere length by flow-FISH is the functional screening test for the disease. Below some
    threshold, replication-limited tissues stop being replenished; which tissues fail first is
    what the branches below describe.
  biological_processes:
  - preferred_term: replicative senescence
    term:
      id: GO:0090399
      label: replicative senescence
    modifier: INCREASED
  - preferred_term: telomere maintenance via telomerase
    term:
      id: GO:0007004
      label: telomere maintenance via telomerase
    modifier: DECREASED
  downstream:
  - target: Hematopoietic Stem Cell Exhaustion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The best-established branch, shared with all telomere biology disorders: the
      highest-turnover compartment fails first.
  - target: Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The branch that defines this entity, and the one whose intermediates are unknown. No
      study has demonstrated the cellular step between short telomeres and a non-perfused
      peripheral retina.
  - target: Intracranial Calcification and Cerebrovascular Fragility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The CNS branch, equally unresolved at the cellular level.
  evidence:
  - reference: PMID:18669893
    reference_title: "TINF2 mutations result in very short telomeres: analysis of a large cohort of patients with dyskeratosis congenita and related bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Telomere lengths in patients with TINF2 mutations were the shortest compared with other
      DC subtypes, but TERC levels were normal.
    explanation: >-
      Places TINF2 patients at the extreme of telomere shortness among dyskeratosis congenita
      subtypes, with normal telomerase RNA - the observation that makes this a telomere defect
      rather than a telomerase-abundance defect.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Telomere analysis was available in seven patients. All presented with very short lengths
    explanation: >-
      The telomere-length finding in the Revesz cohort itself, in the seven patients who were
      measured.
  - reference: PMID:39371255
    reference_title: "Inherited Telomere Biology Disorders: Pathophysiology, Clinical Presentation, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Revesz and Hoyeraal-Hreidarsson syndrome are characterized by a severe disease course,
      very short telomeres (considerably below the 1% percentile), and a disease onset in the
      early childhood
    explanation: >-
      A recent review's statement of the telomere threshold that characterises the severe
      pediatric telomere biology disorders, Revesz among them.

- name: Hematopoietic Stem Cell Exhaustion
  biological_scale: TISSUE
  description: >-
    Failure of the marrow's stem cell compartment to sustain haematopoiesis, producing
    progressive pancytopenia in the first years of life. This branch is shared in full with
    classical dyskeratosis congenita and with the other telomere biology disorders; what
    distinguishes Revesz syndrome is only how early it arrives. It is the usual cause of death
    and the target of the only potentially curative treatment.
  cell_types:
  - preferred_term: Hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  downstream:
  - target: Bone Marrow Failure
    causal_link_type: DIRECT
    description: >-
      Exhaustion of the stem cell pool presents clinically as marrow failure.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients experienced early bone marrow failure, in most cases within the second year
      of life (median age 1.5 years; 95% CI 1.4-1.6).
    explanation: >-
      Establishes marrow failure as universal and infantile in this disease.
  - reference: PMID:18669893
    reference_title: "TINF2 mutations result in very short telomeres: analysis of a large cohort of patients with dyskeratosis congenita and related bone marrow failure syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      A total of 32 of 33 patients with DC with TINF2 mutations have severe disease, with most
      developing aplastic anaemia by the age of 10 years.
    explanation: >-
      The severity and timing of marrow failure across TINF2 dyskeratosis congenita as a whole.
      INDIRECT because the cohort is TINF2 patients generally rather than Revesz patients; it
      shows the early-marrow-failure tendency is a property of the gene, not of the eponym.

- name: Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The lesion that gives the syndrome its name: a bilateral peripheral retinal vasculopathy -
    avascular peripheral retina, telangiectasia, microaneurysms and fluorescein leakage -
    progressing to exudation, neovascularisation, vitreous haemorrhage and tractional retinal
    detachment. Angiographically it is indistinguishable from familial exudative
    vitreoretinopathy, Coats disease and cicatricial retinopathy of prematurity, and children
    with Revesz syndrome have been treated for all three before the systemic diagnosis was made.

    The cellular mechanism is not established. The plausible account is that the retinal
    microvascular endothelium, a slowly renewing compartment, reaches replicative failure at
    the extremely short telomeres these patients carry, so peripheral capillaries drop out and
    the resulting ischaemia drives the exudative and neovascular sequence. No study has
    demonstrated that step - there is no telomere measurement, senescence marker or endothelial
    study in Revesz retina - so the node is tagged HYPOTHETICAL and describes the observed
    vascular lesion rather than the inferred cell biology.

    A 2026 widefield angiography series changed how this node should be read. Peripheral
    non-perfusion was present in 100% of 44 eyes across 22 telomere biology disorder patients,
    most of whom were asymptomatic and none of whom would previously have been called Revesz
    syndrome. On that evidence the retinal branch is not a Revesz-specific limb of the
    pathograph at all; it is a universal telomere-disorder limb that becomes symptomatic
    earliest and most severely in these children.
  cell_types:
  - preferred_term: Retinal microvascular endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  downstream:
  - target: Bilateral Exudative Retinopathy
    causal_link_type: DIRECT
    description: >-
      Peripheral capillary dropout and leakage present clinically as exudative retinopathy.
  - target: Retinal Detachment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Ischaemia drives neovascularisation, vitreous haemorrhage and fibrovascular traction,
      which detach the retina.
  evidence:
  - reference: PMID:42617951
    reference_title: "Retinopathy in Dyskeratosis Congenita and Related Telomere Biology Disorders: Short Telomere Associated Retinopathy (STAR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For posterior segment findings, all eyes had some combination of peripheral non-perfusion
      (100%), microaneurysmal changes (63.6%), telangiectasias (54.5%), fluorescein leakage
      (54.5%), sclerotic vessels (40.1%), retinal hemorrhages (36.3%), exudates (27.3%),
      retinal neovascularization (13.6%), and tractional retinal detachment (9.1%).
    explanation: >-
      The best-characterised description of the vascular lesion, quantified by widefield
      fluorescein angiography, and the source for the ordering from non-perfusion through
      leakage to neovascularisation and detachment.
  - reference: PMID:42617951
    reference_title: "Retinopathy in Dyskeratosis Congenita and Related Telomere Biology Disorders: Short Telomere Associated Retinopathy (STAR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contrary to prior assumptions, the retinovascular abnormalities in patients with TBDs,
      including DC, were universal in our cohort.
    explanation: >-
      The finding that makes this branch a telomere-disorder feature rather than a
      Revesz-specific one, and the basis for the nosological discussion below.
  - reference: PMID:28095086
    reference_title: "Retinal findings and a novel TINF2 mutation in Revesz syndrome: Clinical and molecular correlations with pediatric retinal vasculopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Revesz syndrome is a telomere disorder in the dyskeratosis congenita (DKC) spectrum
      characterized by exudative retinopathy, bone marrow failure, neuroradiographic
      abnormalities, and integumentary findings.
    explanation: >-
      A retinal-specialist description of the entity, from the report of identical twins in
      whom the retinopathy was compared directly against the other paediatric retinal
      vasculopathies.
  - reference: PMID:34189343
    reference_title: "Revesz syndrome with bilateral retinal detachments successfully treated by pars plana vitrectomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were extensive areas of avascular retina detected by fluorescein angiography and a
      thinning of the inner and outer retina detected by optical coherence tomography.
    explanation: >-
      Imaging confirmation of peripheral avascularity in an individual Revesz patient,
      alongside structural retinal thinning.

- name: Intracranial Calcification and Cerebrovascular Fragility
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Progressive intracranial calcification, most often in the basal ganglia and thalami,
    together with cerebellar hypoplasia and white matter change, and in a minority intracranial
    haemorrhage. Calcification was present in 85% of the Revesz patients imaged and cerebellar
    hypoplasia in 76%.

    The mechanism is inferred rather than shown, and the inference is drawn from a neighbour
    disease. Cerebroretinal microangiopathy with calcifications and cysts - Coats plus, caused
    by CTC1 - produces an almost identical combination of exudative retinopathy and
    intracranial calcification through a small-vessel angiopathy, which is the main reason
    calcification here is read as a microvascular rather than a metabolic process. The
    haemorrhages reported in three Revesz children point the same way. Nothing in the Revesz
    literature demonstrates it: there is no neuropathology series and no vascular study, so
    this node is tagged HYPOTHETICAL and names the imaging finding rather than a cell mechanism.

    Cerebellar hypoplasia is grouped here for anatomical convenience but is probably not the
    same process. It is present from the earliest imaging rather than progressive, which makes
    it a developmental consequence of the telomere defect rather than an acquired vascular one.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Cerebral Calcification
    causal_link_type: DIRECT
  - target: Intracranial Hemorrhage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported in three of the assembled patients and interpreted by the reviewing authors as
      possible cerebrovascular fragility. The intermediates are unknown and the number is small.
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cerebellar hypoplasia (76%, n = 13/17) and intracranial calcifications (85%, n = 11/13)
      were common features
    explanation: >-
      The frequencies of the two neuroimaging findings across the assembled cohort, with their
      denominators.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intracranial hemorrhage was detected in three patients during the course of the disease
    explanation: >-
      The haemorrhage observation that prompted the suggestion of cerebrovascular fragility.
      Three patients is the whole of it.

mechanistic_hypotheses:
- hypothesis_group_id: tin2_telomerase_recruitment_defect
  hypothesis_label: DC-cluster TIN2 variants shorten telomeres by impairing telomerase recruitment
  status: ALTERNATIVE
  description: >-
    Ectopically expressed TIN2 carrying dyskeratosis congenita missense mutations shortens
    telomeres in human cells, and the mutants are specifically defective in associating with
    the telomerase RNA component and with telomerase activity, while leaving total cellular
    telomerase activity, TIN2 localisation and telomere end protection intact. On this account
    the lesion is a failure to deliver telomerase to the telomere through TPP1, not a failure
    of the enzyme or of end protection.

    This is the more widely cited of the two models and fits the clinical observation that
    telomerase RNA levels are normal in TINF2 patients. It is nevertheless recorded as
    ALTERNATIVE rather than CANONICAL, because the mouse work below shows the defect is not
    solely telomerase-dependent, and no experiment has apportioned the two.
  evidence:
  - reference: PMID:21536674
    reference_title: "TIN2 protein dyskeratosis congenita missense mutants are defective in association with telomerase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found TIN2 to participate in the TPP1-dependent recruitment of telomerase activity.
      Furthermore, DC mutations in TIN2 led to its decreased ability to associate with TERC and
      telomerase activity.
    explanation: >-
      The core result of this model: DC-cluster TIN2 mutants lose telomerase association, in a
      pathway TIN2 normally supports through TPP1.
  - reference: PMID:21536674
    reference_title: "TIN2 protein dyskeratosis congenita missense mutants are defective in association with telomerase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, this telomere shortening was not accompanied by changes in total telomerase
      activity, localization of TIN2, or telomere end protection status.
    explanation: >-
      The controls that make this a recruitment defect specifically rather than a general loss
      of telomerase or of shelterin function.

- hypothesis_group_id: tin2_telomere_replication_defect
  hypothesis_label: DC-cluster TIN2 variants shorten telomeres by a telomerase-independent replication defect
  status: ALTERNATIVE
  description: >-
    A knock-in mouse carrying the equivalent of the TIN2 K280E dyskeratosis congenita allele
    shortens telomeres faster than controls even when telomerase RNA is deleted entirely, which
    is a result the recruitment model cannot produce: if the only defect were telomerase
    delivery, removing telomerase from both genotypes should abolish the difference. The same
    allele induces ATR signalling and a fragile-telomere phenotype, the signature of a
    replication problem at telomeric DNA.

    The authors' own reading is that the two mechanisms compose - a replication defect in
    telomerase-negative somatic tissue on top of impaired telomerase action in stem cell
    compartments - which if correct would explain why so many different tissues fail. Recorded
    as ALTERNATIVE alongside the recruitment model rather than in place of it.
  evidence:
  - reference: PMID:24449270
    reference_title: "A TIN2 dyskeratosis congenita mutation causes telomerase-independent telomere shortening in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, telomere shortening was accelerated in TIN2(+/DC) mTR(-/-) mice and MEFs
      compared with TIN2(+/+) mTR(-/-) controls, establishing that the TIN2(DC) telomere
      maintenance defect was not solely due to diminished telomerase action.
    explanation: >-
      The decisive experiment: the shortening persists and is accelerated with telomerase RNA
      deleted, so it cannot be entirely a telomerase-recruitment failure.
  - reference: PMID:24449270
    reference_title: "A TIN2 dyskeratosis congenita mutation causes telomerase-independent telomere shortening in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The TIN2(DC) allele induced mild ATR kinase signaling at telomeres and a fragile telomere
      phenotype, suggestive of telomere replication problems.
    explanation: >-
      The mechanistic signature the authors propose for the telomerase-independent component.

phenotypes:

- category: Ophthalmologic
  name: Bilateral Exudative Retinopathy
  frequency: OBLIGATE
  description: >-
    Bilateral peripheral retinal non-perfusion with exudation, progressing to severe visual
    loss in most patients and to glaucoma in a minority. Present in every reported patient.

    The OBLIGATE frequency is partly circular and should be read that way: retinopathy is one
    of the two features by which the diagnosis is made, so a patient without it would not be
    called Revesz syndrome. The 2026 angiography series makes the circularity explicit -
    retinovascular abnormality is universal across telomere biology disorders once widefield
    angiography is used, so what is obligate here is symptomatic, early, severe retinopathy
    rather than retinal vasculopathy as such.
  phenotype_term:
    preferred_term: Bilateral exudative retinopathy
    term:
      id: HP:0030490
      label: Exudative vitreoretinopathy
    clinical_course: PROGRESSIVE
  diagnostic: true
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RS is a severe variant of DKC with early bone marrow failure and retinopathy in all
      patients.
    explanation: >-
      The review's conclusion that retinopathy was present in all 18 assembled patients.
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      retinopathy led to a severe loss of visual acuity in most patients. Glaucoma occurred in
      three cases.
    explanation: >-
      The visual outcome and the frequency of glaucoma as a complication.

- category: Hematologic
  name: Bone Marrow Failure
  frequency: OBLIGATE
  description: >-
    Progressive pancytopenia from failure of the haematopoietic stem cell compartment,
    universal and usually established within the second year of life. It is the usual cause of
    death and the indication for transplantation.
  phenotype_term:
    preferred_term: Bone marrow failure
    term:
      id: HP:0001915
      label: Aplastic anemia
    clinical_course: PROGRESSIVE
  diagnostic: true
  evidence:
  - reference: PMID:33097095
    reference_title: "Revesz syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients experienced early bone marrow failure, in most cases within the second year
      of life (median age 1.5 years; 95% CI 1.4-1.6).
    explanation: >-
      Universality and timing of marrow failure across the assembled cohort.

- category: Neurologic
  name: Cerebral Calcification
  frequency: VERY_FREQUENT

name: Myeloperoxidase Deficiency
creation_date: "2026-09-23T19:09:54Z"
category: Mendelian
description: >-
  Myeloperoxidase deficiency is an inherited defect of the neutrophil and
  monocyte azurophil-granule enzyme myeloperoxidase (MPO), caused by
  biallelic or compound heterozygous variants in MPO on chromosome 17. Most
  pathogenic missense alleles yield a precursor that is not processed into
  mature enzyme, so affected neutrophils lack peroxidase activity and cannot
  convert respiratory-burst hydrogen peroxide and chloride into hypochlorous
  acid; completely deficient neutrophils also fail to form neutrophil
  extracellular traps. It is the most common inherited phagocyte defect,
  usually detected incidentally by automated hematology analyzers that
  classify leukocytes by peroxidase staining. Most affected individuals are
  asymptomatic because MPO-independent microbicidal systems compensate, but
  candidacidal activity is markedly impaired and a small minority, mostly
  those with coexisting diabetes mellitus, develop severe or disseminated
  Candida infection.
synonyms:
- MPO deficiency
- MPOD
disease_term:
  preferred_term: myeloperoxidase deficiency
  term:
    id: MONDO:0009694
    label: myeloperoxidase deficiency
parents:
- functional neutrophil defect
notes: >-
  No GeneReviews chapter exists for this disease (just check-genereviews
  --online returned NO_CHAPTER); the StatPearls chapter PMID:29262241 is cited
  for orientation only. Acquired MPO deficiency secondary to myeloid
  neoplasms or other conditions is out of scope for this entry, which covers
  the hereditary MPO-gene disorder.
prevalence:
- population: General population (hospital hematology screening, United States)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 37.5
  rate_low: 25.0
  rate_high: 50.0
  notes: >-
    Hereditary MPO deficiency (complete plus partial) occurs in 1 in 2,000 to
    1 in 4,000 individuals, as ascertained by automated peroxidase-based
    leukocyte differential counting.
  evidence:
  - reference: PMID:9468285
    reference_title: "Pattern of inheritance in hereditary myeloperoxidase deficiency associated with the R569W missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary deficiency of MPO occurs in 1 in 2,000 to 4,000 individuals in the general population"
    explanation: States the population frequency of hereditary MPO deficiency.
- population: Japan (clinical hematology laboratories), complete deficiency
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.75
  notes: >-
    Complete MPO deficiency 1 in 57,135 and partial deficiency 1 in 17,501 in a
    Japanese survey using Technicon H series analyzers; complete deficiency is
    considerably rarer in Japan than in European and North American series.
  evidence:
  - reference: PMID:12953846
    reference_title: "Prevalence of inherited myeloperoxidase deficiency in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 26 cases of complete MPO deficiency, prevalence 1 in 57,135, and 129 cases of partial deficiency, prevalence 1 in 17,501."
    explanation: Population-based laboratory survey reporting prevalence of complete and partial MPO deficiency in Japan.
pathophysiology:
- name: MPO Pathogenic Variants
  description: >-
    Biallelic or compound heterozygous variants in MPO cause the disease. The
    most frequent allele in Western populations is the exon 10 missense
    variant R569W; other missense, frameshift, splice-site and small-deletion
    alleles (Y173C, M251T, the exon 9 14-base deletion, and several Italian
    and Japanese alleles) have been described. Several genotypes produce the
    same biochemical phenotype.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MPO
    term:
      id: hgnc:7218
      label: MPO
  evidence:
  - reference: PMID:7904599
    reference_title: "Hereditary myeloperoxidase deficiency due to a missense mutation of arginine 569 to tryptophan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the amino acid level this mutation would replace arginine at codon 569 with tryptophan. Six of seven patients with complete MPO deficiency had this mutation."
    explanation: Identifies R569W as the predominant causal MPO variant in completely deficient patients.
  - reference: PMID:15108282
    reference_title: "Genetic characterization of myeloperoxidase deficiency in Italy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic characterization of the subjects showed the presence of three already-known mutations (c.752T>C, c.1705C>T, and c.1566_1579del14) and six novel mutations"
    explanation: Population screening shows allelic heterogeneity of MPO variants in MPO-deficient subjects.
  downstream:
  - target: Defective MPO Precursor Maturation
    causal_link_type: DIRECT
    description: >-
      Missense MPO variants produce a precursor protein that is not processed
      into the mature heavy and light subunits.
    evidence:
    - reference: PMID:7904599
      reference_title: "Hereditary myeloperoxidase deficiency due to a missense mutation of arginine 569 to tryptophan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We have thus hypothesized that hereditary MPO deficiency reflects a defect in processing of a mutated primary translation product."
      explanation: Links the mutated MPO primary translation product to a processing defect.
- name: Defective MPO Precursor Maturation
  description: >-
    Mutant MPO precursors are glycosylated and acquire heme but are retained
    in the endoplasmic reticulum in prolonged association with calreticulin
    and calnexin, are not proteolytically processed to mature subunits, and
    are degraded by the proteasome through endoplasmic reticulum quality
    control. Neutrophils therefore carry a 90-kDa precursor but no mature
    enzyme.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: ER-associated degradation of mutant MPO precursor
    term:
      id: GO:0036503
      label: ERAD pathway
    modifier: INCREASED
  - preferred_term: MPO precursor proteolytic maturation
    term:
      id: GO:0051604
      label: protein maturation
    modifier: DECREASED
  evidence:
  - reference: PMID:9637725
    reference_title: "A novel form of hereditary myeloperoxidase deficiency linked to endoplasmic reticulum/proteasome degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "it was neither proteolytically processed to mature MPO subunits nor secreted. After prolonged association with calreticulin and calnexin in the endoplasmic reticulum, MPOY173C was degraded."
    explanation: Transfection study showing that the Y173C precursor is retained in the ER and degraded instead of being matured.
  - reference: PMID:7904599
    reference_title: "Hereditary myeloperoxidase deficiency due to a missense mutation of arginine 569 to tryptophan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neutrophils from individuals with MPO deficiency lack enzymatic and immunochemical evidence for mature MPO but have a 90-kDa precursor protein"
    explanation: Patient neutrophils contain unprocessed precursor but no mature MPO.
  downstream:
  - target: Loss of Neutrophil and Monocyte Myeloperoxidase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10482305
      reference_title: "Quality control in the endoplasmic reticulum: lessons from hereditary myeloperoxidase deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "the quality control system operating in the endoplasmic reticulum retrieves malfolded MPO precursors from the biosynthetic pathway and creates the biochemical phenotype of MPO deficiency"
      explanation: Review stating that ER retrieval of misfolded precursors produces the loss of enzyme that defines the disease.
- name: Loss of Neutrophil and Monocyte Myeloperoxidase Activity
  description: >-
    Peroxidase activity is absent (complete deficiency) or reduced (partial
    deficiency) in neutrophils and monocytes, while eosinophil peroxidase,
    encoded by a separate gene, is preserved.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  locations:
  - preferred_term: azurophil granule
    term:
      id: GO:0042582
      label: azurophil granule
  molecular_functions:
  - preferred_term: myeloperoxidase peroxidase activity
    term:
      id: GO:0004601
      label: peroxidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:217268
    reference_title: "Leukocyte myeloperoxidase deficiency and diabetes mellitus associated with Candida albicans liver abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peroxidase activity is completely absent from the neutrophils and monocytes although it is present in the eosinophils."
    explanation: Case documenting absent neutrophil and monocyte peroxidase with preserved eosinophil peroxidase.
  - reference: PMID:15108282
    reference_title: "Genetic characterization of myeloperoxidase deficiency in Italy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary myeloperoxidase (MPO) deficiency (MPOD) is the most common neutrophil biochemical defect, and is characterized by a lack of peroxidase activity."
    explanation: Defines the disease by the lack of neutrophil peroxidase activity.
  downstream:
  - target: Impaired Hypochlorous Acid Generation
    causal_link_type: DIRECT
  - target: Impaired Neutrophil Extracellular Trap Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20974672
      reference_title: "Myeloperoxidase is required for neutrophil extracellular trap formation: implications for innate immunity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "neutrophils from donors who are completely deficient in MPO fail to form neutrophil extracellular traps (NETs), indicating that MPO is required for NET formation"
      explanation: Ex vivo study of patient neutrophils linking absent MPO to failed NET formation.
  - target: Compensatory Enhancement of the Respiratory Burst
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced neutrophil myeloperoxidase activity
    causal_link_type: DIRECT
- name: Impaired Hypochlorous Acid Generation
  description: >-
    Without MPO, hydrogen peroxide produced by the NADPH oxidase respiratory
    burst is not converted with chloride into hypochlorous acid and its
    downstream chlorinating oxidants inside the phagosome.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  chemical_entities:
  - preferred_term: hypochlorous acid
    term:
      id: CHEBI:24757
      label: hypochlorous acid
    modifier: DECREASED
  evidence:
  - reference: PMID:15689384
    reference_title: "Myeloperoxidase: friend and foe."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The initial product of the MPO-H2O2-chloride system is hypochlorous acid"
    explanation: Review establishing hypochlorous acid as the product of the MPO-H2O2-chloride system that is lost when MPO is absent.
  - reference: PMID:17592500
    reference_title: "Myeloperoxidase: a target for new drug development?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A unique activity of MPO is its ability to use chloride as a cosubstrate with hydrogen peroxide to generate chlorinating oxidants such as hypochlorous acid, a potent antimicrobial agent."
    explanation: Review stating that chloride-dependent HOCl generation is the activity unique to MPO, and hence the one no other peroxidase replaces.
  - reference: PMID:8960464
    reference_title: "Phagocytic activity and oxidative burst of granulocytes in persons with myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This was demonstrated by comparing myeloperoxidase mass concentration measured with an enzyme immunoassay, lack of HOCl production"
    explanation: Totally MPO-deficient neutrophils produced no HOCl.
  downstream:
  - target: Impaired Neutrophil Candidacidal Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10085024
      reference_title: "Severe impairment in early host defense against Candida albicans in mice deficient in myeloperoxidase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MPO is important for early host defense against fungal infection, and the inability to generate HOCl cannot be compensated for by other oxygen-dependent systems in vivo in mice"
      explanation: Mpo-null mice show that loss of HOCl generation impairs antifungal defense.
- name: Impaired Neutrophil Extracellular Trap Formation
  description: >-
    Completely MPO-deficient neutrophils fail to form neutrophil extracellular
    traps, whereas partially deficient neutrophils form them; MPO acts
    cell-autonomously in NET formation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil extracellular trap formation
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
    modifier: DECREASED
  evidence:
  - reference: PMID:20974672
    reference_title: "Myeloperoxidase is required for neutrophil extracellular trap formation: implications for innate immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, neutrophils from partially MPO-deficient donors make NETs, and pharmacological inhibition of MPO only delays and reduces NET formation."
    explanation: Shows the NET defect depends on complete loss of MPO.
  downstream:
  - target: Impaired Neutrophil Candidacidal Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20974672
      reference_title: "Myeloperoxidase is required for neutrophil extracellular trap formation: implications for innate immunity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "NET-dependent inhibition of Candida albicans growth is compromised in MPO-deficient neutrophils"
      explanation: Links the NET defect to reduced control of Candida albicans.
- name: Compensatory Enhancement of the Respiratory Burst
  description: >-
    MPO-deficient neutrophils show increased phagocytic activity and increased
    superoxide production (enhanced lucigenin chemiluminescence), which is
    thought to compensate for the missing MPO system and to explain why most
    affected individuals do not suffer severe bacterial infection.
  biological_scale: CELLULAR
  role: compensation
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: respiratory burst
    term:
      id: GO:0045730
      label: respiratory burst
    modifier: INCREASED
  evidence:
  - reference: PMID:8960464
    reference_title: "Phagocytic activity and oxidative burst of granulocytes in persons with myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lack of myeloperoxidase activity is compensated for by an increased phagocytic activity, an increased production of superoxide anion (lucigenin-chemiluminescence)"
    explanation: Ex vivo study of MPO-deficient granulocytes showing enhanced superoxide production and phagocytosis.
  - reference: PMID:17384005
    reference_title: "Chronic granulomatous disease (CGD) and complete myeloperoxidase deficiency both yield strongly reduced dihydrorhodamine 123 test signals but can be easily discerned in routine testing for CGD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lucigenin-enhanced chemiluminescence (LCL) is increased in neutrophils from MPO-deficient patients, whereas neutrophils from patients with CGD show a decreased response."
    explanation: Confirms increased NADPH-oxidase-derived superoxide signal in MPO-deficient neutrophils.
  - reference: PMID:2831185
    reference_title: "Myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the absence of MPO, auxiliary mechanisms protect most MPO-deficient hosts from clinically significant sequelae"
    explanation: Review attributing the usual clinical silence of MPO deficiency to MPO-independent auxiliary microbicidal mechanisms.
- name: Impaired Neutrophil Candidacidal Activity
  description: >-
    Killing of Candida albicans by MPO-deficient neutrophils is markedly
    impaired, while killing of Staphylococcus aureus is only minimally
    affected, so the clinical susceptibility that does occur is dominated by
    Candida.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil-mediated killing of fungus
    term:
      id: GO:0070947
      label: neutrophil-mediated killing of fungus
    modifier: DECREASED
  evidence:
  - reference: PMID:6267975
    reference_title: "Myeloperoxidase deficiency: prevalence and clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In assays of leukocyte function only minor defects in killing of Staphylococcus aureus by MPO-deficient cells were noted whereas killing of Candida albicans was much more impaired."
    explanation: Patient neutrophils show a selective, marked defect in Candida killing.
  - reference: PMID:216438
    reference_title: "Hereditary myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The microbicidal activity of the granulocytes was partially diminished with regard to Staphylococcus aureus and was almost nil with regard to Candida albicans."
    explanation: Granulocytes of an MPO-deficient patient had almost no candidacidal activity.
  - reference: PMID:15507755
    reference_title: "In vivo role of myeloperoxidase for the host defense."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MPO-KO mice showed severely reduced cytotoxicity to various microorganisms such as Candida albicans, Aspergillus fumigatus, and Klebsiella pneumoniae"
    explanation: Mpo-knockout mice reproduce the reduced antifungal killing seen in human MPO deficiency.
  downstream:
  - target: Severe Candida infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The candidacidal defect predisposes to invasive candidiasis, but only a
      minority of MPO-deficient individuals develop it, usually with a
      second risk factor such as diabetes mellitus.
    evidence:
    - reference: PMID:6267975
      reference_title: "Myeloperoxidase deficiency: prevalence and clinical significance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although MPO appears to be necessary for killing of Candida species by neutrophils, the importance of its role in normal antibacterial defense must be re-evaluated."
      explanation: Relates the neutrophil Candida-killing requirement for MPO to the clinical picture.
  - target: Hepatic candidiasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Fungal meningitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Unusual fungal osteomyelitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Candida esophagitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Unusual fungal skin infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Hyperglycemia-Impaired Granulocyte Fungicidal Activity
  description: >-
    Coexisting diabetes mellitus is the main clinical modifier. Hyperglycemia
    itself impairs the fungicidal activity of normal granulocytes, adding a
    second hit to the MPO-dependent candidacidal defect; most reported cases of
    serious Candida infection in MPO deficiency occurred in diabetic patients.
  biological_scale: CELLULAR
  role: disease modifier
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil-mediated killing of fungus
    term:
      id: GO:0070947
      label: neutrophil-mediated killing of fungus
    modifier: DECREASED
  evidence:
  - reference: PMID:216438
    reference_title: "Hereditary myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fungicidal activity of normal granulocytes was shown to be impaired during the in vitro artificial hyperglycemic condition."
    explanation: In vitro hyperglycemia impairs granulocyte fungicidal activity, the proposed mechanism for the diabetes interaction.
  - reference: PMID:9766845
    reference_title: "Clinical manifestation of myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Infectious diseases, especially with species of Candida, have been observed predominantly in MPO-deficient patients who also have diabetes mellitus"
    explanation: Review noting that Candida infections cluster in diabetic MPO-deficient patients.
  - reference: PMID:2831185
    reference_title: "Myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "except for some persons with diabetes mellitus who suffer severe candidal disease"
    explanation: Review identifying diabetes mellitus as the setting in which MPO deficiency produces severe candidal disease.
  downstream:
  - target: Impaired Neutrophil Candidacidal Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- name: Reduced neutrophil myeloperoxidase activity
  category: Hematological
  description: >-
    Absent (complete) or reduced (partial) neutrophil peroxidase activity,
    detected as an abnormal peroxidase index or displaced neutrophil cluster on
    peroxidase-based automated hematology analyzers and confirmed by
    cytochemistry. This is the defining laboratory feature.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Absent or reduced neutrophil myeloperoxidase activity
    term:
      id: HP:6000375
      label: Reduced neutrophil myeloperoxidase activity
  evidence:
  - reference: PMID:9766844
    reference_title: "Prevalence of myeloperoxidase deficiency: population studies using Bayer-Technicon automated hematology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peroxidase deficiencies are manifested by the irregular location of these clusters. This makes it possible to identify persons totally or partially lacking myeloperoxidase."
    explanation: Describes detection of total or partial MPO deficiency on peroxidase-based analyzers.
  - reference: PMID:6267975
    reference_title: "Myeloperoxidase deficiency: prevalence and clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Partial (13 patients) or complete (13 patients) MPO deficiency was confirmed by examination of cytochemical stains in 26"
    explanation: Screening cohort confirming partial and complete neutrophil MPO deficiency by cytochemistry.
- name: Severe Candida infection
  category: Infectious
  description: >-
    Disseminated or visceral candidiasis is the characteristic serious
    complication, reported in fewer than 5% of MPO-deficient subjects and
    predominantly in those with diabetes mellitus; fatal Candida sepsis has
    been reported.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Disseminated candidiasis
    term:
      id: HP:6001283
      label: Severe Candida infection
  evidence:
  - reference: PMID:9766845
    reference_title: "Clinical manifestation of myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "but the frequency of such cases is very low, less than 5% of reported MPO-deficient subjects"
    explanation: Review estimating the frequency of Candida and other infections among reported MPO-deficient subjects.
  - reference: PMID:17614858
    reference_title: "Lethal candida sepsis associated with myeloperoxidase deficiency and pre-eclampsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Candida sepsis was discovered as the cause of death at postmortem examination. Myeloperoxidase (MPO) deficiency was identified as having supported the invasive candida infection."
    explanation: Case of fatal disseminated candidiasis in an MPO-deficient patient.
- name: Hepatic candidiasis
  category: Infectious
  description: >-
    Candida albicans liver abscess has been reported in a diabetic patient with
    hereditary MPO deficiency.
  phenotype_term:
    preferred_term: Candida albicans liver abscess
    term:
      id: HP:5210167
      label: Hepatic candidiasis
  evidence:
  - reference: PMID:217268
    reference_title: "Leukocyte myeloperoxidase deficiency and diabetes mellitus associated with Candida albicans liver abscess."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reported here is a case of hereditary myeloperoxidase deficinecy in a diabetic patient suffering from a Candida albicans liver abscess."
    explanation: Case report of Candida liver abscess in MPO deficiency.
- name: Fungal meningitis
  category: Infectious
  description: >-
    Candida meningitis has been reported, and in one child with compound
    heterozygous MPO deficiency it led to a mistaken diagnosis of chronic
    granulomatous disease because of a low dihydrorhodamine oxidation signal.
  phenotype_term:
    preferred_term: Candida meningitis
    term:
      id: HP:0032159
      label: Fungal meningitis
  evidence:
  - reference: PMID:27301573
    reference_title: "Complete Myeloperoxidase Deficiency: Beware the \"False-Positive\" Dihydrorhodamine Oxidation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A patient with Candida meningitis and low dihydrorhodamine oxidation signal was diagnosed with chronic granulomatous disease but actually had compound heterozygous myeloperoxidase deficiency."
    explanation: Case report of Candida meningitis in compound heterozygous MPO deficiency.
- name: Unusual fungal osteomyelitis
  category: Infectious
  description: >-
    Extensive Candida albicans osteomyelitis of the skull base and first
    cervical vertebra was reported in a child whose neutrophils lacked MPO.
  phenotype_term:
    preferred_term: Candida osteomyelitis of the skull base
    term:
      id: HP:5210206
      label: Unusual fungal osteomyelitis
  evidence:
  - reference: PMID:2825109
    reference_title: "Myeloperoxidase deficiency with extensive candidal osteomyelitis of the base of the skull."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A CT scan of the mastoids showed extensive bone destruction of the base of the skull and C-1."
    explanation: Documents skull-base bone destruction in the index case.
  - reference: PMID:2825109
    reference_title: "Myeloperoxidase deficiency with extensive candidal osteomyelitis of the base of the skull."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "histopathologic findings were suggestive of mycotic infection and cultures were positive for Candida albicans"
    explanation: Establishes Candida albicans as the cause of the osteomyelitis.
- name: Candida esophagitis
  category: Infectious
  description: >-
    Invasive Candida esophagitis, part of disseminated candidiasis, was found
    at autopsy in a pre-eclamptic woman with MPO deficiency.
  phenotype_term:
    preferred_term: Invasive Candida esophagitis
    term:
      id: HP:0033351
      label: Candida esophagitis
  evidence:
  - reference: PMID:17614858
    reference_title: "Lethal candida sepsis associated with myeloperoxidase deficiency and pre-eclampsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Toxemia with disseminated intravascular coagulation (DIC) and acute renal failure had masked the symptoms of invasive candida esophagitis and disseminated candidiasis in both lungs."
    explanation: Autopsy case with invasive Candida esophagitis in MPO deficiency.
- name: Unusual fungal skin infection
  category: Infectious
  description: >-
    Disseminated pustular candidal dermatitis was reported in a nondiabetic MPO
    deficient man receiving narrow-spectrum antibiotic therapy.
  phenotype_term:
    preferred_term: Pustular candidal dermatitis
    term:
      id: HP:5210236
      label: Unusual fungal skin infection
  evidence:
  - reference: PMID:9114158
    reference_title: "Myeloperoxidase deficiency manifesting as pustular candidal dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a case of myeloperoxidase deficiency manifesting as disseminated pustular candidal dermatitis in a nondiabetic male."
    explanation: Case report of cutaneous candidiasis as the presenting manifestation of MPO deficiency.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Hereditary MPO deficiency is classically autosomal recessive; family
    studies show that many completely deficient subjects are compound
    heterozygotes and that heterozygous relatives often have partial
    deficiency, so the phenotype is a quantitative spectrum rather than a
    simple two-state trait.
  evidence:
  - reference: PMID:29262241
    reference_title: "Myeloperoxidase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Myeloperoxidase deficiency, first described in 1954, is an autosomal recessive disorder caused by mutations in the MPO gene on chromosome 17."
    explanation: StatPearls review states autosomal recessive inheritance of MPO gene variants.
  - reference: PMID:6296995
    reference_title: "Hereditary myeloperoxidase deficiency: study of 12 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MPO deficiency was found to follow autosomal recessive inheritance and only rarely to have clinical effects."
    explanation: Two-generation family studies of 12 cases supporting recessive inheritance.
  - reference: PMID:9468285
    reference_title: "Pattern of inheritance in hereditary myeloperoxidase deficiency associated with the R569W missense mutation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis demonstrated that MPO deficiency was not inherited as a simple autosomal recessive trait. Most subjects were compound heterozygotes with respect to the R569W mutation and demonstrated a spectrum of phenotypes."
    explanation: Kindred study showing the inheritance departs from a simple recessive pattern because of compound heterozygosity and partial phenotypes.
genetic:
- name: MPO
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MPO
    term:
      id: hgnc:7218
      label: MPO
  notes: >-
    MPO on chromosome 17q encodes myeloperoxidase. Reported disease alleles
    include R569W (c.1705C>T), Y173C, M251T (c.752T>C), the exon 9 14-base
    deletion (c.1566_1579del14), c.325delA and the splice variant
    c.2031-2A>C.
  evidence:
  - reference: PMID:29262241
    reference_title: "Myeloperoxidase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "is an autosomal recessive disorder caused by mutations in the MPO gene on chromosome 17"
    explanation: Identifies MPO as the causal gene.
  - reference: PMID:9637725
    reference_title: "A novel form of hereditary myeloperoxidase deficiency linked to endoplasmic reticulum/proteasome degradation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel missense mutation in the MPO gene at codon 173 whereby tyrosine is replaced with cysteine (Y173C) that is associated with MPO deficiency"
    explanation: Reports a further causal MPO missense allele.
diagnosis:
- name: Peroxidase-based automated leukocyte differential
  description: >-
    Hematology analyzers that separate leukocytes by peroxidase staining and
    volume (Technicon/Bayer H series, Siemens ADVIA) flag MPO deficiency
    through displaced neutrophil clusters and a low mean peroxidase index.
    Neutrophils may be misclassified as monocytes, giving a spurious
    neutropenia with monocytosis; a manual differential count is normal.
  diagnosis_term:
    preferred_term: flow cytochemistry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  results: Low mean peroxidase index; neutrophils misplaced into the monocyte region
  evidence:
  - reference: PMID:9766844
    reference_title: "Prevalence of myeloperoxidase deficiency: population studies using Bayer-Technicon automated hematology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deficiency is quantified by the myeloperoxidase index, which is expressed for every routine analysis and for which normal values were determined."
    explanation: Describes the analyzer-derived MPO index used to detect and grade deficiency.
  - reference: PMID:31622460
    reference_title: "Myeloperoxidase Deficiency Manifesting as Pseudoneutropenia with Low Mean Peroxidase Index and High Monocyte Count in 4 Adult Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When MPO deficiency is present, neutrophils may be incorrectly counted as monocytes with lower MPXI values."
    explanation: Describes the pseudoneutropenia artefact that brings MPO deficiency to attention.
- name: Molecular genetic testing of MPO
  description: >-
    Sequencing of MPO identifies the causal alleles and distinguishes
    hereditary from acquired deficiency.
  diagnosis_term:
    preferred_term: MPO gene sequencing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic or compound heterozygous pathogenic MPO variants
  evidence:
  - reference: PMID:15108282
    reference_title: "Genetic characterization of myeloperoxidase deficiency in Italy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a population screening was carried out to detect mutations in the MPO gene"
    explanation: MPO gene analysis was used to characterize screen-detected MPO-deficient subjects.
differential_diagnoses:
- name: Chronic granulomatous disease
  description: >-
    Complete MPO deficiency produces a strongly reduced dihydrorhodamine 123
    oxidation signal, the standard screening test for chronic granulomatous
    disease, and can be misdiagnosed as CGD. MPO deficiency is distinguished by
    normal eosinophil DHR signal (eosinophil peroxidase is preserved), rescue
    of the DHR signal by added recombinant MPO, and increased rather than
    decreased lucigenin chemiluminescence.
  disease_term:
    preferred_term: chronic granulomatous disease
    term:
      id: MONDO:0018305
      label: chronic granulomatous disease
  evidence:
  - reference: PMID:17384005
    reference_title: "Chronic granulomatous disease (CGD) and complete myeloperoxidase deficiency both yield strongly reduced dihydrorhodamine 123 test signals but can be easily discerned in routine testing for CGD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eosinophils from MPO-deficient individuals retain eosinophilic peroxidase and therefore generate a normal DHR signal."
    explanation: Gives a laboratory feature that separates MPO deficiency from CGD.
  - reference: PMID:27301573
    reference_title: "Complete Myeloperoxidase Deficiency: Beware the \"False-Positive\" Dihydrorhodamine Oxidation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myeloperoxidase deficiency is the most common inherited phagocyte disorder (1:2000) and causes an abnormal dihydrorhodamine oxidation test, which also is seen in chronic granulomatous disease."
    explanation: States the DHR overlap that makes CGD the key differential.
- name: Acquired myeloperoxidase deficiency
  description: >-
    Secondary MPO deficiency occurs with other hematological or
    nonhematological diseases and must be separated from the primary
    hereditary form.
  evidence:
  - reference: PMID:9766845
    reference_title: "Clinical manifestation of myeloperoxidase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "an acquired abnormality associated with other hematological or nonhematological diseases has been occasionally described, but the primary deficiency is the form more commonly reported"
    explanation: Distinguishes acquired from primary MPO deficiency.
treatments:
- name: Antifungal therapy for invasive candidiasis
  description: >-
    There is no disease-specific therapy and asymptomatic individuals need no
    treatment. Invasive Candida infections are treated with systemic
    antifungal agents; amphotericin B cured extensive candidal skull-base
    osteomyelitis in a child with MPO deficiency.
  treatment_term:
    preferred_term: systemic antifungal therapy
    term:
      id: NCIT:C15704
      label: Antifungal Therapy
    therapeutic_agent:
    - preferred_term: amphotericin B
      term:
        id: CHEBI:2682
        label: amphotericin B
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Candida osteomyelitis
    term:
      id: HP:5210206
      label: Unusual fungal osteomyelitis
  evidence:
  - reference: PMID:2825109
    reference_title: "Myeloperoxidase deficiency with extensive candidal osteomyelitis of the base of the skull."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The child was treated successfully with amphotericin B."
    explanation: Case report of successful amphotericin B treatment of Candida osteomyelitis in MPO deficiency.

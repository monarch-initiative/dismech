      label: TOMM7
  evidence:
  - reference: PMID:36299998
    reference_title: A hypomorphic variant in the translocase of the outer mitochondrial membrane complex subunit TOMM7 causes short stature and developmental delay.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of mouse models strongly suggested that the identified variant is hypomorphic because mice homozygous for this variant showed a milder phenotype than those with homozygous Tomm7 deletion."
    explanation: Knock-in versus deletion mice show the patient allele is hypomorphic.
  downstream:
  - target: Weakened TOMM7-TOMM40 Core Complex Interaction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36282599
      reference_title: Autosomal recessive progeroid syndrome due to homozygosity for a TOMM7 variant.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The TOMM7P29L protein interacted poorly with the core TOMM complex proteins — TOMM40 and TOMM22 — in contrast to TOMM7wt"
      explanation: >-
        Co-immunoprecipitation in HEK293 and TOMM7-null HeLa cells shows the
        patient variant directly weakens binding to the core TOM complex.
- name: Weakened TOMM7-TOMM40 Core Complex Interaction
  biological_scale: MOLECULAR
  description: >-
    TOMM7 is a small regulatory subunit that contacts the TOMM40 beta-barrel
    pore and modulates TOM complex assembly and stability. Pro29 breaks the
    alpha-helix of the kinked transmembrane segment, and Trp25 sits beside
    Arg24, which is needed for TOMM40 interaction. The P29L protein still
    localizes to mitochondria but binds TOMM40 and TOMM22 poorly.
  cellular_components:
  - preferred_term: TOM complex
    term:
      id: GO:0005742
      label: mitochondrial outer membrane translocase complex
  evidence:
  - reference: PMID:36282599
    reference_title: Autosomal recessive progeroid syndrome due to homozygosity for a TOMM7 variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This effect was not due to mislocalization, as GFP-tagged TOMM7wt and TOMM7P29L both localized to mitochondria"
    explanation: The defect is in complex binding, not in targeting of TOMM7 itself.
  downstream:
  - target: Altered Mitochondrial Preprotein Import
    causal_link_type: DIRECT
- name: Altered Mitochondrial Preprotein Import
  biological_scale: CELLULAR
  description: >-
    Altered TOM complex function changes the abundance of a subset of the
    mitochondrial proteome rather than causing a global import block. In
    patient fibroblasts 91 of 587 detected mitochondrial proteins differed,
    with oxidative phosphorylation subunits increased and phospholipid
    metabolism proteins reduced, leading the authors to propose that wild-type
    TOMM7 acts as a negative regulator of import for some precursors. In
    endothelium, Tomm7 deficiency increases mitochondrial import of Rac1. The
    direction of the proteomic change differs by cell type (see notes).
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: mitochondrial preprotein import
    modifier: ABNORMAL
    term:
      id: GO:0070585
      label: protein localization to mitochondrion
  evidence:
  - reference: PMID:36282599
    reference_title: Autosomal recessive progeroid syndrome due to homozygosity for a TOMM7 variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Of the 587 detected mitochondrial proteins, 91 were differentially expressed (P < 0.05), indicating that a subset of the mitochondrial proteome is affected by the presence of the TOMM7P29L variant"
    explanation: Patient-fibroblast proteomics shows a selective import-dependent change.
  downstream:

notes: >-
  The three case reports disagree on the direction of the respiratory defect.
  Patient and P29L mouse fibroblasts show increased oxygen consumption with
  upregulated respiratory chain subunits (PMID:36282599); Tomm7 mutant mouse
  cells show increased oxygen consumption but inefficient ATP synthesis
  (PMID:36299998); iPSC-derived endothelial cells show slightly decreased
  respiration with a glycolytic shift (PMID:39615461). These may be cell-type
  effects of a selective import defect rather than contradictions. TOMM7 is
  also needed to stabilize PINK1 on depolarized mitochondria (PMID:24270810),
  but Parkin recruitment and mitochondrial clearance were normal in P29L
  patient fibroblasts, so impaired mitophagy is not currently supported as a
  disease mechanism. The Taiwanese study also found increased TOM7 stability
  in P29L endothelial cells and cites partial ER mislocalization of P29L in
  yeast, whereas GFP-tagged P29L localized to mitochondria in human cells
  (PMID:36282599); the authors still conclude P29L is hypomorphic. No GeneReviews chapter or Orphanet record exists for this
  disorder (OMIM:620601).

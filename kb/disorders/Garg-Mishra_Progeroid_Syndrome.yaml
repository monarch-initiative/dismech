inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported affected individuals are homozygous for a TOMM7 variant, with
    heterozygous unaffected parents and siblings. The p.Pro29Leu allele recurs
    in East Asian families (Chinese-Malaysian, Taiwanese, Han Chinese), while
    p.Trp25Arg was found in a single Japanese proband.
  evidence:
  - reference: PMID:36282599
    reference_title: Autosomal recessive progeroid syndrome due to homozygosity for a TOMM7 variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analyses of exome sequencing data from the entire family revealed only 1 rare homozygous missense variant (c.86C>T; p.Pro29Leu) in TOMM7 in the proband, while the parents and 2 unaffected siblings were heterozygous for the variant."
    explanation: >-
      Segregation of a homozygous TOMM7 variant with heterozygous unaffected
      relatives establishes recessive inheritance in the index family.
  - reference: PMID:36299998
    reference_title: A hypomorphic variant in the translocase of the outer mitochondrial membrane complex subunit TOMM7 causes short stature and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents are heterozygous and the proband is homozygous for TOMM7 c.73T>C variant."
    explanation: Independent recessive segregation of a second TOMM7 allele.
pathophysiology:
- name: TOMM7 Hypomorphic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic missense variants at conserved residues in the kinked
    transmembrane helix of TOMM7 (p.Pro29Leu, p.Trp25Arg). Mouse knock-in data
    show the variants are hypomorphic rather than null: homozygous W25R mice are
    milder than Tomm7 deletion mice.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: TOMM7

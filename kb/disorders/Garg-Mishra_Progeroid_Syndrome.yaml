genetic:
- name: TOMM7
  gene_term:
    preferred_term: TOMM7
    term:
      id: hgnc:21648
      label: TOMM7
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Reported pathogenic alleles: c.86C>T p.(Pro29Leu), recurrent in East Asian
    families (index Chinese-Malaysian patient; nine patients in seven
    Taiwanese families; a Han Chinese boy), and c.73T>C p.(Trp25Arg) in one
    Japanese proband. A biallelic canonical splice variant, c.153-2A>C, was
    reported with neonatal Leigh syndrome (PMID:39333057); whether that is the
    severe end of the same disorder or a distinct entity is unresolved.
  evidence:
  - reference: PMID:39615461
    reference_title: Homozygous variant in translocase of outer mitochondrial membrane 7 leads to metabolic reprogramming and microcephalic osteodysplastic dwarfism with moyamoya disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report showed the segregation of the variant allele in nine members from seven unrelated families and solidified that TOMM7 is the disease-causing gene of a syndrome with unique phenotypes."
    explanation: Multi-family segregation establishes TOMM7 as causal.
animal_models:
- name: Tomm7 W25R knock-in and deletion mice
  species: Mouse
  genotype: Tomm7 W25R/W25R, W25R/deletion and deletion/deletion
  publication: PMID:36299998
  description: >-
    Knock-in of the patient W25R allele and a splice-disrupting null deletion
    allele. All genotypes show growth defects, severe lipoatrophy and hepatic
    lipid accumulation with premature death, graded by allele severity.
  modeled_mechanisms:
  - target: Adipose Tissue Lipoatrophy
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Lipoatrophy in mice is generalized and severe, whereas patients have
      partial lipodystrophy; mice die prematurely after rapid weight loss,
      which is not the human course.
    evidence:
    - reference: PMID:36299998
      reference_title: A hypomorphic variant in the translocase of the outer mitochondrial membrane complex subunit TOMM7 causes short stature and developmental delay.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The most prominent gross phenotype in these mouse models is lipoatrophy"
      explanation: Mouse lipoatrophy models the adipose phenotype.
  - target: Mitochondrial Uncoupling With Inefficient ATP Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:36299998
      reference_title: A hypomorphic variant in the translocase of the outer mitochondrial membrane complex subunit TOMM7 causes short stature and developmental delay.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "despite the bioenergetic deficiency, mutant cells show increased oxygen consumption with normal responses to electron transport chain (ETC) inhibitors, suggesting that Tomm7 deficiency leads to an uncoupling between oxidation and ATP synthesis"
      explanation: Mutant mouse cells show the uncoupled state.
- name: tomm7 loss-of-function zebrafish
  species: Zebrafish
  genotype: tomm7 loss of function
  publication: PMID:30354240
  description: >-
    tomm7 loss impairs cerebrovascular network formation; endothelial-specific
    restoration of tomm7 rescues the vascular defect. A CRISPR tomm7 deletion
    line (PMID:39615461) independently shows craniofacial and cerebrovascular
    defects.
  modeled_mechanisms:
  - target: Impaired Cerebral Angiogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Models a developmental cerebrovascular patterning defect, not the
      progressive large-artery stenosis and collateral formation of human
      moyamoya; no patient allele was tested.
    evidence:
    - reference: PMID:30354240
      reference_title: Endothelial Mitochondrial Preprotein Translocase Tomm7-Rac1 Signaling Axis Dominates Cerebrovascular Network Homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tomm7 drives brain angiogenesis and cerebrovascular network formation through modulating mitochondrial Rac1 signaling within the endothelium."
      explanation: Model establishes the endothelial angiogenic defect.
- name: Tomm7 knockout mouse (cerebrovascular)
  species: Mouse
  genotype: Tomm7 knockout
  publication: PMID:30354240
  description: >-
    Constitutive Tomm7 ablation reproduces the cerebrovascular abnormalities
    seen in zebrafish.
  modeled_mechanisms:
  - target: Impaired Cerebral Angiogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Null allele rather than the hypomorphic patient alleles; developmental
      vascular defect rather than progressive moyamoya arteriopathy.
    evidence:
    - reference: PMID:30354240
      reference_title: Endothelial Mitochondrial Preprotein Translocase Tomm7-Rac1 Signaling Axis Dominates Cerebrovascular Network Homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM

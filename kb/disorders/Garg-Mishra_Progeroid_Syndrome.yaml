treatments:
- name: Growth Hormone Therapy
  description: >-
    Long-acting recombinant human growth hormone was given to a 2-year-old
    P29L homozygote with growth arrest despite normal endocrine testing. It
    slowed further loss of height SDS over 10 months. Growth hormone and
    IGF-1 were normal, so this is pharmacological growth promotion rather
    than hormone replacement. Single case, no control; efficacy and safety in
    this mitochondrial disorder are unestablished.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy

name: Garg-Mishra Progeroid Syndrome
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
parents:
- Progeroid syndrome
- Mitochondrial disease
synonyms:
- GMPGS
- TOMM7-associated syndrome
- Microcephalic osteodysplastic dwarfism with moyamoya disease
description: >-
  Garg-Mishra progeroid syndrome is an ultra-rare autosomal recessive disorder
  caused by biallelic hypomorphic variants in TOMM7, which encodes a small
  regulatory subunit of the translocase of the outer mitochondrial membrane
  (TOM complex). Missense variants such as p.Pro29Leu and p.Trp25Arg weaken
  TOMM7 binding to the TOMM40 pore and alter import of a subset of the
  mitochondrial proteome, producing an unusual bioenergetic state in which
  oxygen consumption can rise while ATP synthesis is inefficient, and, in
  endothelium, a shift toward glycolysis. Clinically it presents with severe
  postnatal growth failure and proportionate dwarfism, progeroid facies with
  mandibular hypoplasia and abnormal dentition, high hyperopia, microphthalmia,
  nystagmus, amblyopia and atrophic macular scarring, narrow chest and hip
  and spine deformities, variable developmental delay or mild intellectual
  disability, occasional partial lipodystrophy, and in more than half of
  evaluated patients childhood-onset moyamoya cerebral vasculopathy with
  ischemic stroke. Several patients have died in childhood.

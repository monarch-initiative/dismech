    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A proteomic comparison of mitochondria from control and proband-derived cultured fibroblasts revealed an increase in abundance of several proteins involved in oxidative phosphorylation, as well as a reduction in abundance of proteins involved in phospholipid metabolism."

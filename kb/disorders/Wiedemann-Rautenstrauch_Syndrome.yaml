notes: >-
  Scope and lump/split decision. WRS (MONDO:0009910) is curated as ONE Disease
  entry, a single clinically recognizable neonatal progeroid syndrome with one
  established gene. It is deliberately kept separate from the allelic
  POLR3A-related leukodystrophy entries (POLR-Related_Leukodystrophy,
  Hypomyelinating_Leukodystrophy_7), which share the gene but differ in onset,
  defining features and predominant variant classes; that relationship is
  recorded as a differential diagnosis and as the allele-combination hypothesis
  rather than as a subtype of either entry. The POLR3GL and POLR3B reports (one
  patient and one family respectively, the latter with ACMG variants of
  uncertain significance) are recorded as candidate loci in the genetic section
  with no relationship_type, not as subtypes, because neither has been
  replicated.

  Grouping follow-up. kb/groupings/Progeroid_Syndromes.yaml lists WRS as a known
  curation gap among MONDO:0015333 descendants; that grouping should add
  Wiedemann-Rautenstrauch_Syndrome as a DISEASE member in a follow-up PR. It is
  not edited here.

  Evidence policy. No GeneReviews chapter exists for WRS; the POLR3-Related
  Leukodystrophy chapter (PMID:22855961) is cited only for its single sentence
  about WRS and is deliberately not tagged as a phenotype baseline. Orphanet
  ORPHA:3455 has no structured cache entry (just fetch-reference ORPHA:3455
  reports no source for the reference type), so its prevalence class and
  phenotype frequencies are not cited. Several quotes come from cached full text
  rather than a PubMed abstract, because those records carry no abstract or the
  needed sentence sits in the body. Frequency bands follow the qualitative
  Pattern C mapping of docs/frequency-evidence-guidelines.md, treating core
  manifestation and "almost all patients" as hallmark (VERY_FREQUENT), often,
  common and "very often" as FREQUENT, and in some cases as OCCASIONAL. The
  51-patient analysis (PMID:28447407) is cached as full text and its Table 2
  does report per-feature counts for the WRS column (for example 18/18 pointed
  chin, 17/18 natal teeth and prominent scalp veins, 3/16 tremor, 7/10
  intellectual disability). Bands here are taken from that paper's own prose
  summary of those counts rather than from the table cells, because the
  extracted PDF text interleaves the WRS column with the three comparison
  cohorts on one line and a single-feature cell cannot be quoted unambiguously;
  where the two differ the prose is the more conservative, and the count is
  named in the explanation.
  Myelofibrosis appears only in the title of PMID:41549341, so it is mentioned
  in the anemia description but is not curated as a phenotype with a title-only
  snippet.

  Progression and prognosis. Both are curated from cached full text:
  PMID:28447407 supplies the age-at-death distribution and the late-infancy
  onset of the progressive neurological signs, and PMID:36159344 supplies the
  reported average survival and the usual causes of death. What the caches do
  not contain is any formal survival analysis, life table or cause-of-death
  series: the figures are counts from an 18-patient descriptive series and a
  narrative statement in a single case report, so no rate or median is asserted
  here. Genotype-specific prognosis is likewise unavailable, and PMID:28447407
  states that whether the spread in life expectancy is caused by specific
  variants or by other factors remains uncertain.

  Deep research. A Perplexity sonar-deep-research report
  (research/Wiedemann-Rautenstrauch_Syndrome-deep-research-perplexity.md) was
  used as a lead source only. Of its seven resolved references, PMID:1026530 is
  a mis-parsed DOI fragment that resolves to a 1976 disopyramide
  pharmacokinetics paper and was rejected, and its DOI-keyed Frontiers citation
  was replaced by that paper's PMID (36385762). Its suggested terms HP:0008106
  and HP:0001077 do not exist, GO:0006379 is obsolete, and GO:0009306,
  UBERON:0002371, UBERON:0008897 and three NCIT codes name unrelated concepts;
  every CURIE used here was re-derived with OAK against the configured
  ontologies.

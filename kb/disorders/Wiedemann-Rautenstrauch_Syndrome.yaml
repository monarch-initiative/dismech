    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We evaluated bone mineral findings in our two patients with WRS and recommend caution when handling children with WRS."
    explanation: Handling precautions because of severe neonatal osteopenia.
  - reference: PMID:36159344

    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic mutations in POLR3A, which encodes for the largest subunit of the DNA-dependent RNA polymerase III, underlie WRS."
    explanation: Establishes the initiating molecular lesion.
  - reference: PMID:31695177
    reference_title: "A variant of neonatal progeroid syndrome, or Wiedemann-Rautenstrauch syndrome, is associated with a nonsense variant in POLR3GL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants reported in the literature lead to at least a partial loss-of-function (when considering both alleles together)."
    explanation: Supports classifying the allele pair as partial loss of function.
  - reference: PMID:30323018
    reference_title: "Specific combinations of biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "All WRS-associated POLR3A amino acid changes were predicted to perturb substantially POLR3A structure/function."
    explanation: In silico structural modelling of the missense alleles.
  - reference: PMID:38348603
    reference_title: "Further delineation of Wiedemann-Rautenstrauch syndrome linked with POLR3A."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In silico homology modeling of wild-type and mutated proteins revealed a substantial change in the structure and stability of both proteins, demonstrating a possible effect on function."
    explanation: Homology modelling of the homozygous missense alleles p.Pro819Leu and p.Cys632Phe.
  - reference: PMID:40912518
    reference_title: "Clinical and molecular insights into Wiedemann-Rautenstrauch syndrome: A case report and genetic analysis of the c.2707G>A variant in the POLR3A gene."
    supports: SUPPORT

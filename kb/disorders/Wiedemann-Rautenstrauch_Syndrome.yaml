        label: POLR3A
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Most reported genotypes are compound heterozygous; homozygous missense
      genotypes occur in consanguineous families. Complete loss of both alleles is
      presumed lethal, so the allele pair retains partial function.
  cellular_components:
  - preferred_term: RNA polymerase III complex
    term:
      id: GO:0005666

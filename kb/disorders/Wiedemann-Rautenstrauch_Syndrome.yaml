inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Autosomal recessive, with affected sib pairs from unaffected parents reported
    before the gene was known and biallelic POLR3A variants (compound
    heterozygous far more often than homozygous) in molecularly confirmed cases.
    Expressivity is markedly variable, from death in the first months to
    survival into adulthood.
  evidence:
  - reference: PMID:10607952
    reference_title: "Neonatal progeroid (Wiedemann-Rautenstrauch) syndrome: report of five new cases and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that there are 2 pairs of sibs among the 5 patients further supports that NPS is an autosomal recessive condition."
    explanation: Sib recurrence from unaffected parents in the largest pre-molecular series supports recessive inheritance.
  - reference: PMID:21671373
    reference_title: "Neonatal progeroid syndrome (Wiedemann-Rautenstrauch syndrome): report of three affected sibs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support autosomal recessive inheritance in WRS and support the possibility of homozygocity mapping as a good approach to find the causative gene."
    explanation: Three affected sibs born to unaffected, non-consanguineous parents.
  - reference: PMID:30414627
    reference_title: "Bi-allelic POLR3A Loss-of-Function Variants Cause Autosomal-Recessive Wiedemann-Rautenstrauch Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present seven additional infants, children, and adults with WRS and bi-allelic truncating and/or splicing variants in POLR3A."
    explanation: Molecular confirmation that affected individuals carry biallelic POLR3A variants.
  - reference: PMID:28447407
    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients reported to date demonstrate a remarkable variability in phenotype, which hampers diagnostics."
    explanation: Supports the VARIABLE expressivity classification.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been measured. Fewer than 40 patients had been
    reported by 2016 and "over 50" by 2022; Orphanet classes the disorder as
    <1/1,000,000 but its ORPHA:3455 record is not in the structured cache, so
    that figure is not cited as evidence here.
  evidence:
  - reference: PMID:27612211
    reference_title: "Neonatal progeriod syndrome associated with biallelic truncating variants in POLR3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wiedemann-Rautenstrauch syndrome, also known as neonatal progeroid syndrome, is a rare condition with fewer than 40 patients reported in the literature."
    explanation: Literature case count as of 2016.
  - reference: PMID:36385762
    reference_title: "A synonymous variant contributes to a rare Wiedemann-Rautenstrauch syndrome complicated with mild anemia via affecting pre-mRNA splicing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, over 50 cases with variable phenotypes of WDRTS have been reported."
    explanation: Literature case count as of 2022, consistent with an ultra-rare disorder.
progression:
- phase: Neonatal period and infancy
  age_range: Birth to 1 year
  notes: >-
    The period of highest mortality. In the 18-patient gold-standard series six
    of the patients whose outcome is recorded died within the first year, four
    of them in the first weeks of life. Death is usually attributed to
    malnutrition or infection rather than to a single organ failure, and one
    neonate died of hyperkalemic renal failure on day three.
  evidence:
  - reference: PMID:28447407
    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients have died within the 1st weeks of life, 2 other in the 1st year, 4 between 5 and 10 years of age, 1 at 17 years, but 2 are still alive at age 20 years."
    explanation: Gives the age-at-death distribution for the molecularly and photographically confirmed WRS patients.
  - reference: PMID:36159344
    reference_title: "A Case of Wiedemann-Rautenstrauch Syndrome With Fatal Hyperkalemic Renal Faliure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average survival in WRS is seven months, although survival into the third decade of life has been reported"
    explanation: States the reported average survival, which falls inside this phase.
  - reference: PMID:36159344
    reference_title: "A Case of Wiedemann-Rautenstrauch Syndrome With Fatal Hyperkalemic Renal Faliure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WRS patients have a short life expectancy due to malnutrition"
    explanation: Identifies malnutrition as a proximate cause of the early mortality.
- phase: Late infancy and childhood
  age_range: 1 to 10 years
  notes: >-
    Survivors of infancy develop and then accumulate neurological signs, chiefly
    tremor, hypertonia and ataxia, which is what makes WRS a progressive rather
    than a purely static congenital disorder. Growth failure and lipoatrophy
    persist unchanged. Four of the recorded deaths fall between 5 and 10 years.
  evidence:
  - reference: PMID:28447407
    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These symptoms arise typically in late infancy or childhood."
    explanation: Dates the onset of the progressive neurological signs to this phase.
  - reference: PMID:28447407
    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed a clear progression in signs and symptoms with time, especially with respect of neurological signs as tremor, hypertonia, and ataxia"
    explanation: Establishes that the neurological phenotype progresses rather than remaining static.
- phase: Adolescence and adulthood
  age_range: Second and third decade
  notes: >-
    A minority reach adolescence or adulthood. In the confirmed series one
    patient was alive at 17 years and two at 20 years, and survival into the
    third decade is reported. These survivors carry the accumulated neurological
    burden of the previous phase; ataxia and tremor increase with age.
  evidence:
  - reference: PMID:28447407
    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "1 at 17 years, but 2 are still alive at age 20 years"
    explanation: Documents the long-surviving minority within the confirmed series.
  - reference: PMID:28447407
    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the progressive nature of WRS became clear in the increase with age of ataxia and tremor in some of the patients"
    explanation: Describes what continues to change in the patients who survive longest.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    WRS is frequently lethal in the first year of life and imposes lifelong
    multi-system disability on those who survive. Of the confirmed patients
    whose outcome is recorded, six died within the first year and four more
    before age ten, with reported average survival of seven months. Survivors
    face feeding failure that does not respond to high-calorie enteral support,
    progressive ataxia, tremor and spasticity, intellectual disability in most,
    and dental, ophthalmic and skeletal complications. No disease-modifying
    therapy exists, so the entire burden is met with supportive care.
  evidence:
  - reference: PMID:28447407
    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients have died within the 1st weeks of life, 2 other in the 1st year, 4 between 5 and 10 years of age, 1 at 17 years, but 2 are still alive at age 20 years."
    explanation: Quantifies the mortality that dominates the burden assessment.
  - reference: PMID:36159344
    reference_title: "A Case of Wiedemann-Rautenstrauch Syndrome With Fatal Hyperkalemic Renal Faliure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average survival in WRS is seven months, although survival into the third decade of life has been reported"
    explanation: Reported average survival supports a HIGH rather than VARIABLE burden level.
  - reference: PMID:36596744
    reference_title: "Biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome with atypical brain involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nutritional support using high calorie milk and enteral tube was ineffective to gain weight due to frequent vomiting and aspiration."
    explanation: Illustrates the refractory feeding burden carried by survivors.

genetic:
- name: POLR3A
  gene_term:
    preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic variants in POLR3A, encoding the largest (catalytic) subunit of RNA
    polymerase III. WRS genotypes are dominated by compound heterozygosity for a
    truncating or missense allele in trans with a recurrent intronic
    splice-affecting allele, most often c.3337-11T>C (also c.1909+18G>A and
    c.1771-6C>G / c.1771-7C>G), and by synonymous or deep-intronic variants that
    perturb transcript processing; homozygous missense variants have been reported
    in consanguineous families. Two null alleles have been reported in a single
    proband. Considered together, the allele pairs are believed to leave partial
    Pol III function, in contrast to the missense-dominated genotypes of 4H
    leukodystrophy.
  evidence:
  - reference: PMID:27612211
    reference_title: "Neonatal progeriod syndrome associated with biallelic truncating variants in POLR3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report an infant with the characteristic phenotypic features of Wiedemann-Rautenstrauch syndrome in whom exome sequencing identified two pathogenic variants in POLR3A: c.1909+18G>A; p.(Y637Cfs*23) and c.2617C>T; p.(R873*)."
    explanation: First report of biallelic POLR3A variants in WRS, including the recurrent c.1909+18G>A intronic allele.
  - reference: PMID:30414627
    reference_title: "Bi-allelic POLR3A Loss-of-Function Variants Cause Autosomal-Recessive Wiedemann-Rautenstrauch Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings confirm the association of bi-allelic POLR3A variants with WRS, expand the clinical phenotype of WRS, and suggest specific POLR3A genotypes associated with WRS and hypomyelinating leukodystrophy."
    explanation: Independent seven-patient replication establishing POLR3A as the WRS gene.
  - reference: PMID:30323018
    reference_title: "Specific combinations of biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic POLR3A variants were identified in eight affected individuals and monoallelic variants of the same gene in four other individuals."
    explanation: Twelve-family series; biallelic variants in every individual with sufficient material.
  - reference: PMID:30323018
    reference_title: "Specific combinations of biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple variants were found to affect POLR3A transcript processing and were mostly located in deep intronic regions, making clinical suspicion fundamental to detection."
    explanation: Documents the deep-intronic, splice-affecting character of many WRS alleles.
  - reference: PMID:30450527
    reference_title: "Analyses of LMNA-negative juvenile progeroid cases confirms biallelic POLR3A mutations in Wiedemann-Rautenstrauch-like syndrome and expands the phenotypic spectrum of PYCR1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, we firmly establish biallelic mutations in POLR3A as the genetic cause of a recognizable, neonatal, Wiedemann-Rautenstrauch-like progeroid syndrome."
    explanation: Third independent cohort confirming the gene-disease relationship.
  - reference: PMID:32555393
    reference_title: "Unique combination and in silico modeling of biallelic POLR3A variants as a cause of Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The other variant, c.3337-11T>C, was previously shown in WRS patients in trans with other variations."
    explanation: Documents c.3337-11T>C as the recurrent WRS allele found in trans with a second variant.
  - reference: PMID:38348603
    reference_title: "Further delineation of Wiedemann-Rautenstrauch syndrome linked with POLR3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified one novel homozygous missense variant (NM_007055: c.2456C>T; p. Pro819Leu) in two Omani families and one novel homozygous variant (c.1895G>T; p Cys632Phe) in Saudi family that segregates with the disease in the POLR3A gene."
    explanation: Homozygous missense genotypes in consanguineous families, showing that WRS is not restricted to compound heterozygosity.
  - reference: PMID:33559318
    reference_title: "Wiedemann-Rautenstrauch syndrome in an Indian patient with biallelic pathogenic variants in POLR3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Till date, 19 families are reported with WRS due to variants in POLR3A."
    explanation: Family count for the POLR3A-WRS association as of 2021.
  variants:
  - name: POLR3A c.3337-11T>C
    description: >-
      Recurrent intronic variant that perturbs POLR3A splicing; the commonest WRS
      allele, found in trans with truncating or missense alleles and, in one
      patient, in cis with c.1909+22G>A on the same haplotype.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38397171
      reference_title: "The Genetic Basis of the First Patient with Wiedemann-Rautenstrauch Syndrome in the Russian Federation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Via the analysis of mRNA derived from fibroblasts, we reconfirmed the splicing-affecting nature of the c.3337-11T>C variant."
      explanation: Patient-fibroblast mRNA analysis confirming the splicing effect of the recurrent allele.
    - reference: PMID:32555393
      reference_title: "Unique combination and in silico modeling of biallelic POLR3A variants as a cause of Wiedemann-Rautenstrauch syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One of the reported variations in our patient, c.3568C>T, p.(Gln1190Ter), is a novel variation that was not reported before."
      explanation: Example of the recurrent intronic allele paired in trans with a novel nonsense allele.
  - name: POLR3A c.1909+18G>A
    description: >-
      Intronic variant predicted to cause a frameshift, p.(Y637Cfs*23), reported in
      trans with a nonsense allele in the first molecularly solved WRS proband.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27612211
      reference_title: "Neonatal progeriod syndrome associated with biallelic truncating variants in POLR3A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This proband is notable because she had two null pathogenic variants."
      explanation: The authors treat both alleles, including c.1909+18G>A, as null.
  - name: POLR3A c.1771-6C>G / c.1771-7C>G
    description: >-
      Adjacent intron-13 variants shared with the striatal and hereditary spastic
      ataxia presentations of POLR3A-related disease; c.1771-7C>G was found in trans
      with p.(Arg669Ter) in an Indian WRS patient, and c.1771-6C>G in a Korean WRS
      patient with striatal-variant brain involvement.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33559318
      reference_title: "Wiedemann-Rautenstrauch syndrome in an Indian patient with biallelic pathogenic variants in POLR3A."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant c.1771-7C>G was earlier found to be associated with hereditary spastic ataxia."
      explanation: The same intronic allele underlies a distinct POLR3A phenotype depending on its partner allele.
    - reference: PMID:36596744
      reference_title: "Biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome with atypical brain involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our patient has a c.1771-6C>G variant and also showed profound neurodevelopmental problem and striatal involvement."
      explanation: c.1771-6C>G in a WRS patient with the striatal-variant neurologic phenotype.
  - name: POLR3A c.3342C>T (p.Ser1114=)
    description: >-
      Synonymous exonic variant shown by minigene assay to generate aberrant splice
      isoforms; an example of a "silent" WRS allele that is pathogenic through
      transcript processing.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:36385762
      reference_title: "A synonymous variant contributes to a rare Wiedemann-Rautenstrauch syndrome complicated with mild anemia via affecting pre-mRNA splicing."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "For POLR3A, the synonymous mutation (c.3342C > T, p.Ser1114=) generated three types of aberrant isoforms."
      explanation: Minigene reporter assay demonstrating aberrant splicing from the synonymous change.
- name: POLR3GL
  gene_term:
    preferred_term: POLR3GL
    term:
      id: hgnc:28466
      label: POLR3GL
  association: Candidate second locus (single patient, WRS-like variant phenotype)
  variant_origin: GERMLINE
  notes: >-
    A homozygous nonsense POLR3GL variant with RNA evidence of nonsense-mediated
    decay was reported in one individual with several, not all, features of
    neonatal progeroid syndrome; the authors describe the presentation as a
    variant of the syndrome. POLR3GL encodes another Pol III subunit. Treated here
    as a candidate gene rather than a second established WRS gene; no
    relationship_type is asserted.
  evidence:

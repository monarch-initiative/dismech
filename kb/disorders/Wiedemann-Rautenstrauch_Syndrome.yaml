diagnosis:
- name: Molecular genetic testing of POLR3A
  diagnosis_term:
    preferred_term: POLR3A sequencing including intronic regions
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis is confirmed by identifying biallelic POLR3A variants. Because many
    WRS alleles are deep-intronic or synonymous and are missed by coding-only
    filters, clinical suspicion must drive targeted intronic analysis and, where
    possible, RNA studies.
  results: Biallelic POLR3A variants, typically a recurrent intronic allele in trans with a truncating or missense allele.
  evidence:
  - reference: PMID:30323018
    reference_title: "Specific combinations of biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple variants were found to affect POLR3A transcript processing and were mostly located in deep intronic regions, making clinical suspicion fundamental to detection."
    explanation: Deep-intronic alleles make targeted, suspicion-driven testing essential.
  - reference: PMID:38397171
    reference_title: "The Genetic Basis of the First Patient with Wiedemann-Rautenstrauch Syndrome in the Russian Federation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Utilizing whole-exome sequencing (WES), we identified a novel missense variant c.3677T>C (p.Leu1226Pro) in the POLR3A gene (NM_007055.4) alongside two cis intronic variants c.1909+22G>A and c.3337-11T>C."
    explanation: Exome sequencing with attention to near-exon intronic variants resolved the diagnosis.
- name: Whole-exome sequencing
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: Trio or singleton exome sequencing has been the discovery and diagnostic modality in most molecularly confirmed cases.
  evidence:
  - reference: PMID:34289880
    reference_title: "Whole-exome sequencing reveals POLR3B variants associated with progeria-related Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study not only identified a novel WRS-associated gene, POLR3B, but also broadened the mutational and phenotypic spectra of POLR3B."
    explanation: Exome sequencing as the route to a molecular diagnosis in a progeroid proband.
- name: Prenatal ultrasound
  diagnosis_term:
    preferred_term: Serial prenatal ultrasound
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  description: >-
    In a family with a previous affected child, serial ultrasound showing growth
    retardation of the biparietal and abdominal diameters with preserved femoral
    length identified a second affected pregnancy before molecular testing was
    available.
  evidence:
  - reference: PMID:1619643
    reference_title: "Two sibs with Wiedemann-Rautenstrauch syndrome: possibilities of prenatal diagnosis by ultrasound."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case shows that ultrasound examination can be a useful tool in the prenatal diagnosis of this rare, autosomal recessive syndrome."
    explanation: Ultrasound-based prenatal recognition in a recurrence pregnancy.
- name: Brain magnetic resonance imaging
  diagnosis_term:
    preferred_term: Brain MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Brain MRI evaluates white-matter involvement; delayed myelination, striatal
    involvement and superior cerebellar peduncle or midbrain hyperintensity have
    been reported in POLR3A-related disease including WRS.
  evidence:
  - reference: PMID:36825045
    reference_title: "Spectrum of Pediatric to Early Adulthood POLR3A-Associated Movement Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common brain MRI abnormality was T2-weighted/FLAIR hyperintensity of the superior cerebellar peduncles and midbrain."
    explanation: Imaging sign suggestive of POLR3A-related disease.
differential_diagnoses:
- name: POLR3-related (4H) hypomyelinating leukodystrophy
  disease_term:
    preferred_term: POLR3-related (4H) leukodystrophy, POLR3A type (HLD7)
    term:
      id: MONDO:0011897
      label: leukodystrophy, hypomyelinating, 7, with or without oligodontia and/or hypogonadotropic hypogonadism
  description: >-
    The allelic disorder. 4H leukodystrophy presents in childhood with diffuse
    hypomyelination, hypodontia and hypogonadotropic hypogonadism and is
    associated mainly with biallelic missense POLR3A variants, whereas WRS
    presents at birth with lipodystrophy and growth failure and is associated
    with splice-affecting and truncating allele combinations; the two overlap in
    dental, endocrine and later neurologic features.
  distinguishing_features:
  - Neonatal onset with generalized lipoatrophy, natal teeth and pseudohydrocephalus in WRS
  - Diffuse hypomyelination as the defining feature in 4H, variable and often absent in WRS
  - Predominantly missense genotypes in 4H versus splice-affecting or truncating combinations in WRS
  evidence:
  - reference: PMID:30414627
    reference_title: "Bi-allelic POLR3A Loss-of-Function Variants Cause Autosomal-Recessive Wiedemann-Rautenstrauch Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic missense variants in POLR3A have been associated with phenotypes distinct from WRS: hypogonadotropic hypogonadism and hypomyelinating leukodystrophy with or without oligodontia."
    explanation: Frames the leukodystrophy as a distinct POLR3A phenotype with different variant classes.
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Confirmation of this as a very severe form of POLR3-related leukodystrophy awaits replication in other individuals with a clinical diagnosis of Wiedemann-Rautenstrauch syndrome."
    explanation: The POLR3-related leukodystrophy GeneReviews chapter considered WRS a possible severe end of its own spectrum before replication.
  - reference: PMID:28447407
    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are major differences but there are also similarities in phenotype, which sustain the suggestion that the syndrome can be caused by disturbed POLR3A functioning."
    explanation: Systematic phenotype comparison of WRS with the recessive POLR3A conditions.
- name: Hutchinson-Gilford progeria syndrome
  disease_term:
    preferred_term: Hutchinson-Gilford progeria syndrome
    term:
      id: MONDO:0008310
      label: Hutchinson-Gilford progeria syndrome
  description: >-
    The prototypic progeria, caused by a recurrent de novo LMNA variant, presents
    after the first year with progressive loss of fat and hair and vascular
    disease; it lacks the neonatal onset, natal teeth and pseudohydrocephalus of
    WRS, and LMNA is normal in WRS.
  distinguishing_features:
  - Onset after infancy in HGPS versus at birth in WRS
  - LMNA G608G in HGPS; no LMNA variants in WRS
  - Sporadic dominant in HGPS versus recessive in WRS
  evidence:
  - reference: PMID:19938095
    reference_title: "Absence of Lamin A/C gene mutations in four Wiedemann-Rautenstrauch syndrome patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not find mutations in Lamin A/C (LMNA) gene in four WRS patients, and in particular, we did not find the G608G mutation (GGC > GGT transition) which is associated with most cases with Hutchinson-Gilford progeria (OMIM 176670)."
    explanation: Molecular exclusion of HGPS in clinically diagnosed WRS.
  - reference: PMID:30450527
    reference_title: "Analyses of LMNA-negative juvenile progeroid cases confirms biallelic POLR3A mutations in Wiedemann-Rautenstrauch-like syndrome and expands the phenotypic spectrum of PYCR1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, we suggest that POLR3A mutations are causal for a portion of under-diagnosed early-onset segmental progeroid syndromes."
    explanation: POLR3A testing resolves LMNA-negative progeroid cases.
- name: Marfanoid-progeroid-lipodystrophy syndrome
  disease_term:
    preferred_term: progeroid and marfanoid aspect-lipodystrophy syndrome
    term:
      id: MONDO:0014831
      label: progeroid and marfanoid aspect-lipodystrophy syndrome
  description: >-
    Neonatal progeroid appearance with congenital generalized lipodystrophy
    caused by 3-prime FBN1 truncating variants; repeatedly diagnosed at birth as
    WRS. The marfanoid habitus, ectopia lentis and aortic dilation that emerge
    later, dominant de novo inheritance and the FBN1 genotype distinguish it.
  distinguishing_features:
  - Later marfanoid skeletal and ocular features and aortic root dilation
  - De novo heterozygous 3-prime FBN1 variant rather than biallelic POLR3A variants
  - Normal intellect and preserved insulin sensitivity
  evidence:
  - reference: PMID:24613577
    reference_title: "Neonatal progeroid variant of Marfan syndrome with congenital lipodystrophy results from mutations at the 3' end of FBN1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 16-year-old girl with neonatal progeroid features and congenital lipodystrophy who was considered at birth as a possible variant of Wiedemann-Rautenstrauch syndrome."
    explanation: Documents the neonatal misdiagnosis that makes this the leading non-POLR3A differential.
- name: POLR3A striatal variant
  description: >-
    Biallelic POLR3A genotypes including c.1771-6C>G or c.1771-7C>G produce an
    early-onset, rapidly progressive neurologic disorder with focal striatal
    involvement rather than diffuse hypomyelination. One WRS patient carried
    c.1771-6C>G and showed both the progeroid and lipodystrophic phenotype and
    striatal involvement, so the two can coincide.
  distinguishing_features:
  - Striatal MRI involvement and profound neurodevelopmental impairment
  - Absence of lipodystrophy and progeroid face in the classic striatal variant
  evidence:
  - reference: PMID:36596744
    reference_title: "Biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome with atypical brain involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient has a c.1771-6C>G variant and also showed profound neurodevelopmental problem and striatal involvement."
    explanation: Overlap case linking WRS with the striatal-variant allele and imaging pattern.
  - reference: PMID:33559318
    reference_title: "Wiedemann-Rautenstrauch syndrome in an Indian patient with biallelic pathogenic variants in POLR3A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant c.1771-7C>G was earlier found to be associated with hereditary spastic ataxia."
    explanation: The neighbouring intronic allele is shared with another POLR3A neurologic phenotype.
treatments:
- name: Multidisciplinary supportive care
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  description: >-
    There is no disease-modifying therapy. Care is supportive and symptom
    directed, covering feeding support, infection management, monitoring of renal
    and electrolyte status in the neonatal period, careful handling because of
    osteopenia, ophthalmic protection where lagophthalmos or entropion is
    present, dental care, and developmental and neurological follow-up in
    survivors.
  target_phenotypes:
  - preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  - preferred_term: Osteopenia
    term:

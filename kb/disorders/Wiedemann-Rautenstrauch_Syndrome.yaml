pathophysiology:
- name: Biallelic POLR3A Variants with Residual Pol III Function
  description: >-
    The initiating lesion is compound heterozygosity (occasionally homozygosity)
    for POLR3A variants that, considered as a pair, leave partial function of the
    catalytic subunit of RNA polymerase III. The characteristic WRS genotype pairs
    a recurrent intronic or synonymous splice-affecting allele with a truncating
    or missense allele; all WRS-associated amino-acid substitutions are predicted
    to perturb POLR3A structure. Which allele combinations produce WRS rather than
    4H leukodystrophy is the central genotype-phenotype question for this gene.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  gene:
    preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  genetic_context:

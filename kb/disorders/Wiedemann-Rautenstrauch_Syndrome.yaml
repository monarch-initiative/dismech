    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe an individual with several clinical features of neonatal progeroid syndrome in whom exome sequencing revealed a homozygous nonsense variant in POLR3GL (NM_032305.2:c.358C>T; p.(Arg120Ter))."
    explanation: Single-patient report of a POLR3GL nonsense variant with a WRS-like phenotype.
  - reference: PMID:31695177
    reference_title: "A variant of neonatal progeroid syndrome, or Wiedemann-Rautenstrauch syndrome, is associated with a nonsense variant in POLR3GL."
    supports: SUPPORT

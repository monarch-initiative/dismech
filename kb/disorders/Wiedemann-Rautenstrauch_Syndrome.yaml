    reference_title: "Wiedemann-Rautenstrauch syndrome: A phenotype analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Core manifestations of the syndrome are marked pre-natal and severe post-natal growth retardation, an unusual face (triangular shape, sparse hair, small mouth, pointed chin), dental anomalies (natal teeth; hypodontia), generalized lipodystrophy with localized fat masses, and-in some cases-progressive ataxia and tremor."
    explanation: >-
      Listed as a core manifestation across the 15 confirmed and 12 suggestive
      patients of the 51-patient analysis. Core manifestation is mapped to
      VERY_FREQUENT under the qualitative Pattern C table (equivalent to
      hallmark); no percentage was reported.

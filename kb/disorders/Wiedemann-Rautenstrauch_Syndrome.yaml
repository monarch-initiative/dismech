discussions:
- discussion_id: wrs_adipose_mechanism_gap
  prompt: >-
    How does partial loss of RNA polymerase III function abolish subcutaneous
    adipose tissue while sparing gluteal and labial fat pads?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Mesenchymal Progenitor Proliferation and Differentiation
  - pathophysiology#Generalized Subcutaneous Lipoatrophy with Localized Fat Pads
  rationale: >-
    Congenital generalized lipoatrophy is the defining tissue phenotype, yet no
    study has examined adipocyte differentiation, adipose progenitor number or
    lipid handling in WRS cells; the only differentiation data are osteogenic,
    chondrogenic and hematopoietic. The regional sparing of specific fat depots
    is unexplained by any global Pol III model and suggests depot-specific
    progenitor biology.
  evidence:
  - reference: PMID:16097434
    reference_title: "In vitro osteogenic differentiation is affected in Wiedemann-Rautenstrauch-Syndrome (WRS)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "To date, there are no data about the differentiation capacity of WRS progenitor cells available in the literature."
    explanation: States the gap that the osteogenic study only partly filled; adipogenic differentiation remains unassayed.
  - reference: PMID:10607952
    reference_title: "Neonatal progeroid (Wiedemann-Rautenstrauch) syndrome: report of five new cases and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neonatal progeroid syndrome (NPS), or Wiedemann-Rautenstrauch, is a rare autosomal recessive disorder comprised of generalized lipoatrophy except for fat pads in the suprabuttock areas, hypotrichosis of the scalp hair, eyebrows, and eyelashes, relative macrocephaly, triangular face, natal teeth, and micrognathia."
    explanation: The depot-sparing pattern that a mechanism must explain.
- discussion_id: wrs_pol3_output_unmeasured
  prompt: >-
    Is Pol III transcript output actually reduced in WRS cells, and does the WRS
    allele combination affect a different subset of Pol III transcripts than
    leukodystrophy alleles?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#RNA Polymerase III Transcriptional Hypofunction
  - mechanistic_hypotheses#allele_combination_determines_wrs_versus_4h
  rationale: >-
    Reduced tRNA and BC200 levels have been shown for a leukodystrophy allele,
    and WRS fibroblasts show reduced wild-type POLR3A, but no study has profiled
    Pol III transcripts in WRS cells. Whether WRS and 4H alleles differ in the
    magnitude or transcript selectivity of Pol III hypofunction is the testable
    core of the allele-combination hypothesis.
  evidence:
  - reference: PMID:30323018
    reference_title: "Specific combinations of biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No isolated functional sites in POLR3A explain the phenotype variability in POLR3A-related disorders."
    explanation: Structural position alone does not explain which phenotype a genotype produces.
- discussion_id: wrs_no_animal_model
  prompt: >-
    Can a mouse model of the WRS allele combination be built, given that the
    homozygous G672E leukodystrophy allele produces no phenotype and only
    lineage-restricted conditional alleles produce hypomyelination?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Central Nervous System Hypomyelination
  - pathophysiology#Generalized Subcutaneous Lipoatrophy with Localized Fat Pads
  - animal_models#Mouse
  rationale: >-
    No animal model of WRS exists. The available Polr3a mice model the allelic
    leukodystrophy instead: a homozygous founder missense allele gives no
    neurological or myelin phenotype, and conditional Olig2-lineage expression of
    pathogenic alleles gives a mild hypomyelination without the systemic
    features. A WRS model would need a germline compound-heterozygous genotype
    with a splice-affecting allele whose leakiness in mouse is unknown, so the
    mouse negative results should not be read as evidence about the human
    mechanism.
  evidence:
  - reference: PMID:28407788
    reference_title: "Absence of neurological abnormalities in mice homozygous for the Polr3a G672E hypomyelinating leukodystrophy mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that the first transgenic mice with a leukodystrophy-causing Polr3a mutation do not recapitulate the childhood-onset HLD observed in the majority of human patients with POLR3A mutations, and provide essential information to guide selection of Polr3a mutations for developing future mouse models of the disease."
    explanation: Direct evidence of a human-mouse mismatch for the closest available allele.
  - reference: PMID:34583988
    reference_title: "Defective myelination in an RNA polymerase III mutant leukodystrophic mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These phenotypes reflect a subset of clinical features seen in patients."
    explanation: Even the conditional model reproduces only part of the human leukodystrophy.

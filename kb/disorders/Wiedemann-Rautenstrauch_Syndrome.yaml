name: Wiedemann-Rautenstrauch Syndrome
creation_date: "2026-09-05T06:37:27Z"
category: Mendelian
description: >-
  Wiedemann-Rautenstrauch syndrome (WRS), also called neonatal progeroid syndrome,
  is an ultra-rare autosomal recessive segmental progeroid disorder that is
  recognizable at birth. Affected infants show marked intrauterine and severe
  postnatal growth failure, generalized loss of subcutaneous fat with paradoxical
  localized fat pads (classically gluteal/suprabuttock and labial), a
  pseudohydrocephalic appearance produced by relative macrocephaly, widened
  fontanelles, sparse scalp hair and prominent scalp veins over a triangular face
  with a pinched or convex nose, small mouth and pointed chin, natal teeth and
  later hypodontia, thin skin, hypotonia, and variable intellectual disability.
  Survivors may develop progressive ataxia and tremor, and a subset show central
  white-matter abnormalities that overlap with the allelic POLR3A-related
  hypomyelinating leukodystrophy.

  The syndrome is caused by biallelic POLR3A variants that, taken together,
  leave residual RNA polymerase III activity: typically a recurrent intronic
  splice-affecting allele (most often c.3337-11T>C, or c.1909+18G>A) in trans
  with a null or missense allele. Patient fibroblasts and iPSCs show reduced
  wild-type POLR3A, nucleolar disruption, p53 activation and premature
  senescence, and patient progenitors differentiate poorly along osteogenic and
  chondrogenic lineages; how Pol III hypofunction produces the adipose and
  craniofacial phenotypes specifically is still inferred rather than
  demonstrated. Rare WRS-like presentations have been attributed to POLR3GL and
  POLR3B. Management is supportive, with no disease-modifying therapy.

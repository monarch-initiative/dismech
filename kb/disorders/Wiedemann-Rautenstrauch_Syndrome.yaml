  treatment_term:
    preferred_term: High-calorie enteral nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  description: >-
    High-calorie formula and enteral tube feeding are used for failure to thrive,
    but weight gain is often poor because the growth failure is intrinsic and
    vomiting and aspiration complicate feeding.
  notes: >-
    therapeutic_modality BEHAVIORAL is used here because the intervention is a
    feeding regimen, not a supplement compound; see the CLAUDE.md caution about
    NCIT:C15433.
  target_phenotypes:
  - preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  evidence:
  - reference: PMID:36596744
    reference_title: "Biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome with atypical brain involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nutritional support using high calorie milk and enteral tube was ineffective to gain weight due to frequent vomiting and aspiration."
    explanation: Documents the intervention and its limited effectiveness in one patient.

    reference_title: "Bi-allelic POLR3A Loss-of-Function Variants Cause Autosomal-Recessive Wiedemann-Rautenstrauch Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has been proposed to be autosomal-recessive and is characterized by variable clinical features, such as intrauterine growth restriction and poor postnatal weight gain, characteristic facial features (triangular appearance to the face, convex nasal profile or pinched nose, and small mouth), widened fontanelles, pseudohydrocephalus, prominent scalp veins, lipodystrophy, and teeth abnormalities."
    explanation: Intrauterine growth restriction in the molecularly confirmed cohort.

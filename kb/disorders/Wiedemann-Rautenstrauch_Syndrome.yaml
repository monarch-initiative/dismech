mechanistic_hypotheses:
- hypothesis_group_id: canonical_pol3_partial_lof
  hypothesis_label: Partial loss of RNA polymerase III function drives a multi-lineage developmental growth failure
  status: CANONICAL
  description: >-
    Biallelic POLR3A variants that jointly retain partial function reduce Pol III
    output of tRNAs and other small RNAs, limiting the proliferation and
    differentiation of progenitors in adipose, skeletal, craniofacial and
    oligodendroglial lineages. The genetic and cellular ends of this chain are
    established; the Pol III-output step is extrapolated from leukodystrophy
    alleles and the lineage-specific consequences are inferred from the phenotype.
  evidence:
  - reference: PMID:30323018
    reference_title: "Specific combinations of biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic mutations in POLR3A, which encodes for the largest subunit of the DNA-dependent RNA polymerase III, underlie WRS."
    explanation: The genetic anchor of the canonical model.
  - reference: PMID:16097434
    reference_title: "In vitro osteogenic differentiation is affected in Wiedemann-Rautenstrauch-Syndrome (WRS)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data suggest a lack of cellular differentiation capacity in WRS patients, which may be responsible for the clinical appearance and symptoms of this rare disorder."
    explanation: The progenitor-differentiation limb of the model.
- hypothesis_group_id: senescence_driven_progeroid_phenotype
  hypothesis_label: Nucleolar stress, p53 activation and premature senescence produce the progeroid phenotype
  status: EMERGING
  description: >-
    Mutant POLR3A accumulation causes nucleolar disruption, a p53/DNA-damage
    response and premature senescence in patient fibroblasts and iPSCs, and
    telomerase RNA is sequestered in nucleoli. On this model the progeroid
    features arise from senescence-driven exhaustion of progenitor pools, as in
    other segmental progerias. Supported by two cellular studies; no in vivo or
    rescue evidence.
  evidence:
  - reference: PMID:32976914
    reference_title: "Nucleolar disruption, activation of P53 and premature senescence in POLR3A-mutated Wiedemann-Rautenstrauch syndrome fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All these changes were associated with premature senescence."
    explanation: Premature senescence in WRS fibroblasts.
  - reference: PMID:41081995
    reference_title: "POLR3A mutations cause nucleolus abnormalities and aberrant telomerase RNA metabolism in induced pluripotent stem cells from Wiedemann-Rautenstrauch premature aging syndrome patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HGPS and WRS patient fibroblasts showed similar signs of cellular aging; however, unlike HGPS, the causal link between the premature aging phenotype and WRS driving mutations is unclear."
    explanation: Same cellular signature as HGPS, with the causal link explicitly flagged as open.
- hypothesis_group_id: allele_combination_determines_wrs_versus_4h
  hypothesis_label: Specific allele combinations, not a functional site, decide WRS versus 4H leukodystrophy
  status: EMERGING
  description: >-
    WRS-specific recurrent haplotypes and the predominance of truncating or
    splice-affecting alleles in WRS, versus missense alleles in 4H leukodystrophy,
    suggest that the residual-function level set by the particular allele pair
    determines which POLR3A phenotype appears. Homozygous missense WRS families
    and shared intronic alleles between WRS and spastic ataxia show the rule is
    not absolute.
  evidence:
  - reference: PMID:30323018
    reference_title: "Specific combinations of biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that specific combinations of compound heterozygous variants must be present to cause the WRS phenotype."
    explanation: The allele-combination proposal.
  - reference: PMID:30323018
    reference_title: "Specific combinations of biallelic POLR3A variants cause Wiedemann-Rautenstrauch syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While biallelic POLR3A variants have been previously reported in 4H syndrome and adolescent-onset progressive spastic ataxia, recurrent haplotypes specifically occurring in individuals with WRS were detected."
    explanation: WRS-specific recurrent haplotypes.
  - reference: PMID:30414627
    reference_title: "Bi-allelic POLR3A Loss-of-Function Variants Cause Autosomal-Recessive Wiedemann-Rautenstrauch Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic missense variants in POLR3A have been associated with phenotypes distinct from WRS: hypogonadotropic hypogonadism and hypomyelinating leukodystrophy with or without oligodontia."
    explanation: Variant-class contrast between WRS and the leukodystrophy phenotypes.
  - reference: PMID:34611991
    reference_title: "A novel homozygous synonymous variant further expands the phenotypic spectrum of POLR3A-related pathologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypic differences between these disorders are thought to occur mainly due to different functional effects of underlying POLR3A variants."
    explanation: Restates the model as the field's working assumption.
  - reference: PMID:38348603
    reference_title: "Further delineation of Wiedemann-Rautenstrauch syndrome linked with POLR3A."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified one novel homozygous missense variant (NM_007055: c.2456C>T; p. Pro819Leu) in two Omani families and one novel homozygous variant (c.1895G>T; p Cys632Phe) in Saudi family that segregates with the disease in the POLR3A gene."
    explanation: Homozygous missense genotypes causing WRS contradict a strict truncating-versus-missense dichotomy.

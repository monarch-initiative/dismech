prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Four affected members of one three-generation family, in a single 2004 report. A PubMed
    search on 2026-09-08 for the syndrome name, and for VSX1 combined with craniofacial,
    anterior segment, sella and CVC-domain terms, returned no second family and no follow-up
    on this one. No population estimate exists and none is possible from a single pedigree
    ascertained through an ophthalmology clinic. The prevalence_class is the numeric floor
    tier; no rate_per_100000 is given because none has been reported. Read the tier as a
    statement about how few cases are on record, not as an estimate of how many exist.
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 3-generation family with 7 available family members."
    explanation: The entire evidence base for this entity, stated as the study's participant count.
genetic:
- name: VSX1
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  gene_term:
    preferred_term: VSX1
    term:
      id: hgnc:12723
      label: VSX1
  notes: >-
    VSX1 encodes a paired-like homeodomain transcription factor with homeo and CVC domains,
    expressed in retinal bipolar cells and in spinal V2 interneuron precursors, where it acts
    as a transcriptional repressor.

    relationship_type is DISPUTED rather than CAUSATIVE, and the reasons are cumulative
    rather than any one being decisive. The syndrome rests on one family, never replicated in
    twenty-two years. The genotype is two changes in cis, one of which the reporting authors
    themselves classify as a variation and which is independently catalogued as a
    polymorphism. Neither change has been functionally characterised, and the tested VSX1
    missense changes either enhance repressor activity or leave it unchanged, so the
    direction a loss-of-function reading needs has not been observed for this gene. A mouse
    carrying the equivalent of a VSX1 CVC-domain change reproduces the retinal
    electrophysiology and not the corneal phenotype. And there is no ClinGen gene-disease
    validity assertion for VSX1 - checked against the ClinGen gene-validity download of
    2026-09-08.

    This typing is consistent with how the knowledge base already treats this gene. Keratoconus
    types VSX1 DISPUTED, and Posterior_Polymorphous_Corneal_Dystrophy records the historical
    VSX1-PPCD1 assignment as unconfirmed or of uncertain significance. Those are different
    diseases from this one, and the evidence for each is separate - but a gene whose two
    better-studied associations have both weakened over time is not one to type CAUSATIVE on
    a single unreplicated family.

    A search trap for whoever extends this entry. The VSX1 literature is dominated by
    keratoconus candidate-gene studies, most of them negative or equivocal, and by retinal and
    spinal-cord developmental biology in zebrafish, goldfish and mouse. Almost none of it
    concerns this syndrome, and a search on the gene alone will return sixty-odd records of
    which one is the entity curated here.
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To present a previously unreported African American family with 1 variation and 1 mutation of the homeobox transcription factor gene, VSX1 (RINX), and to describe the clinical features of family members."
    explanation: >-
      The study's own statement of what it found - one variation and one mutation, in one
      family - which is the whole basis of the gene-disease claim.
  - reference: PMID:30535423
    reference_title: "Investigating the Pathogenicity of VSX1 Missense Mutations and Their Association With Corneal Disease."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "While we cannot exclude a role for VSX1 as a risk factor for corneal disease, on its own, it does not appear to play a major causative role."
    explanation: >-
      The most direct challenge to a causative typing, from the study that built a mouse to
      test it. It bears on the corneal half of this phenotype specifically.
  - reference: PMID:16799019
    reference_title: "No VSX1 gene mutations associated with keratoconus."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of pathogenic mutations in the VSX1 gene in a large number of unrelated KTCN patients indicates that other genetic factors are involved in the development of this disorder."
    explanation: >-
      A negative cohort study of the gene's best-known association. It does not test this
      syndrome, and it is cited because the cumulative weakening of VSX1's disease
      associations is part of why this entry types the gene DISPUTED.
diagnosis:
- name: No established diagnostic pathway
  description: >-
    There is none to describe. The single reported family was ascertained clinically and
    genotyped by direct sequencing of VSX1 in all available members. No diagnostic criteria
    have been proposed, no second family has been diagnosed, and the combination of findings
    that defines the entity - craniofacial features, corneal endothelial anomalies, an empty
    sella and abnormal bipolar cell electrophysiology - has not been assembled in anyone
    outside this pedigree. A clinician who found this constellation today would be making the
    same judgement the original authors made, without the benefit of a second case.
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood was drawn from all available family members, and the VSX1 (RINX) gene was sequenced."
    explanation: >-
      The genetic method, which was candidate-gene sequencing of VSX1 rather than an unbiased
      search - so the gene was chosen before the variant was found.
discussions:
- discussion_id: caasds_is_this_a_real_entity
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - disease#
  - "genetic#VSX1"
  prompt: >-
    Is CAASDS a distinct disease entity, or a single family's coincidence around a VSX1
    polymorphism?
  rationale: >-
    The question has to be asked because everything that would normally answer it is missing.
    One family, four affected members, one paper, 2004, and nothing since - a PubMed search on
    2026-09-08 for the syndrome name and for VSX1 with craniofacial, anterior segment and
    sella terms returned no second family. The genotype is two coding changes in cis, and the
    reporting authors classify one of them, R131S, as a variation rather than a mutation; it
    turns up elsewhere as a previously reported polymorphism in a keratoconus cohort. The
    other, A256S, sits in the conserved CVC domain and was absent from controls, which is
    suggestive and is not a functional result - the change has never been assayed.

    Three things argue the entity is real, and they should not be dismissed. The craniofacial
    features and the corneal endothelial anomalies were present in all four affected members
    and absent from the unaffected ones, which is what segregation looks like. The retinal
    electrophysiology has independent support from two directions: Vsx1 controls terminal gene
    expression in mouse type 7 ON bipolar cells, and a mouse carrying a VSX1 CVC-domain change
    has an abnormal electroretinogram. And OMIM and MONDO both carry the entity, so it is at
    least a concept other resources have accepted.

    Three argue the other way. VSX1's better-studied disease associations have weakened rather
    than strengthened - dismech already records the PPCD1 assignment as unconfirmed and types
    the gene DISPUTED in keratoconus. The same mouse that reproduces the retinal finding has
    no corneal defect, and its authors conclude VSX1 does not on its own play a major
    causative role in corneal disease. And the craniofacial and sellar half of the phenotype,
    which is what the syndrome is named for, has no proposed mechanism, no animal correlate
    and no second observation anywhere.

    The honest position, and the one this entry takes, is that the entity is curated because
    it exists as a named concept with a real published pedigree behind it, and that every
    causal claim in it is marked at the strength the source supports rather than at the
    strength the disease name implies. What would settle it is a second family, or a
    functional assay of A256S. Neither has been done.
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two changes in VSX1 (RINX) were identified: a variation (R131S) not in a critical region and in few controls, and a mutation (A256S) in the critical CVC-domain and not in any controls."
    explanation: >-
      The genotype at the centre of the question, with the authors' own asymmetric
      classification of its two halves.
  - reference: PMID:16799019
    reference_title: "No VSX1 gene mutations associated with keratoconus."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Two previously reported SNPs were also identified: c.426C>A (Arg131Ser) in one affected patient and c.581A>G (Ala182Ala) in 51 of the 100 affected patients."
    explanation: >-
      That one of the two changes is a circulating polymorphism, which removes it from the
      causal account and leaves the entity resting on a single untested substitution.
  - reference: PMID:30535423
    reference_title: "Investigating the Pathogenicity of VSX1 Missense Mutations and Their Association With Corneal Disease."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "A mouse model for VSX1 p.P247R did not have any observable corneal defect, but did exhibit an abnormal electroretinogram response characterized by a more prominent ON as opposed to OFF panretinal responsiveness."
    explanation: >-
      The experiment that splits this phenotype - the retinal half reproduces in a model, the
      corneal half does not.
  proposed_experiments:
  - experiment_id: exp_caasds_a256s_repressor_assay
    name: Assay A256S repressor activity against the tested VSX1 missense panel
    description: >-
      The published luciferase reporter assay for VSX1 transcriptional repression has already
      been run against a panel of VSX1 missense changes, including the CVC-domain change
      P247R. Running A256S through the same assay alongside that panel would say whether the
      one change this entity rests on does anything to repressor function, and in which
      direction. A result matching P247R - enhanced repression - would be as informative as a
      loss, because it would mean the entity's causal account has to be rewritten rather than
      confirmed.
    readouts:
    - name: VSX1 transcriptional repressor activity for A256S relative to wild type
      target: "pathophysiology#Impaired VSX1 Transcriptional Repression"
      direction: ALTERED
      interpretation: >-
        Any reproducible difference from wild type would move this node off PROVISIONAL; no
        difference would argue that A256S is not the causal change either.
    would_support:
    - "pathophysiology#Impaired VSX1 Transcriptional Repression"
    supporting_outcome:
    - >-
      Reduced repressor activity for A256S would support the causal chain this entry draws;
      unchanged or enhanced activity would leave the entity without a molecular mechanism.
- discussion_id: caasds_no_treatment_or_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    Is there anything to curate about management?
  rationale: >-
    No. The source is a genotype-phenotype study, not a clinical follow-up, and it reports no
    intervention for any family member - not for the severe hydrocephalus in the proband,
    which would certainly have been managed somehow, and not for the corneal, retinal or
    auditory findings. No treatment, no outcome and no natural history is recoverable from it,
    and there is no second report to supply them.

    Generic management of the individual findings - shunting for hydrocephalus, corneal
    transplantation for endothelial failure, hearing amplification - would look plausible in a
    treatments block and would be an invention. None of it is reported of these patients, and
    importing it would assert of four people an experience recorded only of others. The
    treatments section is therefore empty, deliberately, and this discussion is why.
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Main outcome measures included identification and molecular characterization of 1 variation and 1 mutation in VSX1 (RINX) of 4 affected family members (3 adults and 1 child)."
    explanation: >-
      The study's stated outcome measures are molecular and descriptive. Recorded as
      NO_EVIDENCE because the source does not bear on treatment at all, rather than bearing
      on it negatively.
notes: >-
  Scope decision: DISEASE, curated as a standalone entry, and the decision was close enough
  to be worth recording rather than asserting. MONDO:0013618 and OMIM 610256 both carry the
  concept, its only superclass in MONDO is hereditary disease, and it has no descendants, so
  there is no grouping or parent entry to fold it into. The alternative was OUT_OF_SCOPE on
  the grounds that a never-replicated single-family syndrome whose gene is disputed does not
  carry a conserved pathograph. That was rejected because the entity does have one part with
  independent mechanistic support - the retinal bipolar cell electrophysiology - and because
  recording the contest is more useful than leaving a named MONDO concept with no entry and
  no note of why. The stub is deleted, since MONDO:0013618 is now bound as disease_term.

  What this entry is mostly about. The evidence base is one 2004 paper describing one
  three-generation family with four affected members, and a PubMed search on 2026-09-08 for
  the syndrome name and for VSX1 with craniofacial, anterior segment, sella and CVC-domain
  terms found no second family and no follow-up. Every frequency band in the entry is a count
  out of four people in one pedigree and says so in its own notes. Three of the five
  pathophysiology nodes are marked PROVISIONAL, and the two that are not - the genotype and
  the bipolar cell dysfunction - are the two with something outside the family behind them.

  The gene is typed DISPUTED, not CAUSATIVE. Four things drive that, and they are cumulative:
  the genotype is two changes in cis of which the reporting authors call one a variation and
  which is independently catalogued as a polymorphism; neither change has ever been
  functionally assayed; the VSX1 missense changes that have been assayed either enhance
  repressor activity or leave it unchanged, which is the opposite of the direction a
  loss-of-function account needs; and a mouse carrying a VSX1 CVC-domain change reproduces
  the retinal electrophysiology but has no corneal defect at all. There is no ClinGen
  gene-disease validity assertion for VSX1, checked directly against the ClinGen
  gene-validity download of 2026-09-08 - GTPBP3, curated in the same session, does appear
  there, so this is a real negative and not a missing file.

  Consistency with the rest of the knowledge base was checked rather than assumed.
  kb/disorders/Keratoconus.yaml already types VSX1 as DISPUTED, and
  kb/disorders/Posterior_Polymorphous_Corneal_Dystrophy.yaml records the historical
  VSX1-PPCD1 assignment as unconfirmed or of uncertain significance. Those are separate
  diseases with separate evidence and neither settles this one, but typing the gene CAUSATIVE
  here while it is DISPUTED two files away would have been inconsistent without justification.

  What is deliberately not curated. There is no treatments block: the source reports no
  intervention for anyone in the family, including the child with severe hydrocephalus, and
  importing generic management of the individual findings would assert of these four people
  an experience recorded only of others. The reasoning is in the discussion
  caasds_no_treatment_or_natural_history. There is no progression block, for the same reason -
  the study is a genotype-phenotype description with no follow-up. There are no animal models
  of this syndrome; the mouse cited here carries a different VSX1 change and was built to test
  corneal disease, so it is cited as evidence within nodes rather than curated as a model of
  this entity. There are no clinical trials, and no prevalence estimate beyond the
  cases-in-literature floor. The posterior fossa cyst and anterior encephalocele in the
  proband are described in prose rather than bound, because each was seen once and neither is
  separable from the severe hydrocephalus in the same child.

  The named-entity trap for this gene runs the other way from most. VSX1's literature is
  dominated by keratoconus candidate-gene studies - many of them negative - and by retinal and
  spinal-cord developmental biology in zebrafish, goldfish and mouse. A search on the gene
  alone returns around sixty records of which one is this syndrome. The risk here is not
  curating the wrong disease but importing the corneal-dystrophy literature's conclusions into
  an entry it does not describe, which is why the two dismech corneal entries are named
  explicitly above rather than paraphrased.

name: Craniofacial Anomalies and Anterior Segment Dysgenesis Syndrome
category: Mendelian
creation_date: "2026-09-08T00:00:00Z"
synonyms:
- CAASDS
- craniofacial anomalies and anterior segment dysgenesis syndrome
- VSX1-related craniofacial and anterior segment syndrome
disease_term:
  preferred_term: craniofacial anomalies and anterior segment dysgenesis syndrome
  term:
    id: MONDO:0013618
    label: craniofacial anomalies and anterior segment dysgenesis syndrome
description: >-
  CAASDS (OMIM 610256) rests on a single publication: one three-generation African American
  family, four affected members, reported in 2004. A PubMed search on 2026-09-08 for the
  syndrome name, and for VSX1 with craniofacial or anterior segment terms, returned no
  second family in the twenty-two years since. This entry is therefore as much about the
  limits of the evidence as about the disease, and it is written that way rather than
  presenting a four-person phenotype as an established entity.

  What the family shows is consistent. Craniofacial features - wide interpupillary distance
  and unusual pinnae - were present in all four affected members, and anterior segment
  anomalies of the corneal endothelium were described as a constant finding in all of them.
  Beyond that the expressivity is extreme: the proband had an empty sella turcica, a
  posterior fossa cyst, an anterior encephalocele and severe hydrocephalus, her mother had a
  partially empty sella with a small pituitary and hypertelorism, and her older sister had
  hypertelorism and otherwise normal neuroimaging. Electrophysiology found abnormal cone
  bipolar cell function in the affected adults and abnormal auditory bipolar cell function in
  the proband.

  Two VSX1 changes segregate with the phenotype, and they sit on the same chromosome: R131S,
  which the authors classify as a variation outside a critical region and present in a few
  controls, and A256S, in the conserved CVC domain and absent from controls. Only the second
  is offered as the mutation. That matters, because R131S is catalogued elsewhere as a
  previously reported single-nucleotide polymorphism, found in a keratoconus cohort in which
  no VSX1 variant proved pathogenic.

  The gene's disease associations are contested more broadly, and this entry carries that
  context because it bears directly on how much weight the entity can take. VSX1 was
  originally reported for posterior polymorphous corneal dystrophy and keratoconus; dismech
  already records those assignments as unconfirmed or of uncertain significance in
  Posterior_Polymorphous_Corneal_Dystrophy, and types VSX1 as DISPUTED in Keratoconus. A
  mouse carrying the equivalent of the VSX1 CVC-domain change p.P247R has no corneal defect
  at all, though it does have an abnormal electroretinogram, and the authors of that study
  conclude that VSX1 on its own does not appear to play a major causative role in corneal
  disease. There is no ClinGen gene-disease validity assertion for VSX1.

  The one part of this phenotype with independent mechanistic support is the retinal
  electrophysiology. VSX1 is a paired-like homeodomain transcriptional repressor expressed in
  retinal bipolar cells; it regulates terminal differentiation of type 7 ON bipolar cells in
  mouse, and abnormal inner-retinal function on electroretinography has been reported in
  carriers of two other VSX1 changes in an unrelated family. The craniofacial and sellar
  findings have no proposed mechanism in any source read here, and none is invented.
parents:
- Anterior segment dysgenesis
- Hereditary disease
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Reported as a Mendelian, gene-attributed syndrome, though the gene-disease
      relationship rests on one family and has never been independently assessed.
  - classification_value: OTHER
    notes: >-
      The dominant organ system is the eye - anterior segment anomalies of the corneal
      endothelium were present in every affected family member, and the retinal
      electrophysiology is the only part of the phenotype with independent mechanistic
      support. HarrisonsChapterEnum has no ophthalmology value, so OTHER is used rather than
      forcing the entity into a Part it does not belong to.

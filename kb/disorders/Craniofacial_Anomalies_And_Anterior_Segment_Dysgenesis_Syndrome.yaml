inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The two VSX1 changes were present on one chromosome at 20p11.2 and segregated with the
    four affected members of a three-generation pedigree, which is a dominant pattern in a
    single family. Nothing stronger can be said: there is no second family, no de novo event,
    and no functional demonstration that either change is pathogenic. Expressivity within
    the family is described by the authors as extremely variable, so the pattern is
    segregation in one pedigree rather than an established mode of inheritance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both were present on 1 chromosome at 20p11.2 and were segregated with the 4 affected patients."
    explanation: >-
      The segregation evidence, and the fact that the two changes travel together on one
      chromosome rather than as independent alleles.
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features demonstrated extremely variable expressivity."
    explanation: >-
      The authors' own summary of how differently the same genotype presented within one
      family, which is what makes any frequency claim from this series fragile.
pathophysiology:
- name: VSX1 CVC-Domain Substitution in cis with a Coding Variant
  biological_scale: MOLECULAR
  description: >-
    Two changes in VSX1, on the same chromosome, in all four affected members. R131S lies
    outside a critical region and was found in a few controls, and the authors class it as a
    variation rather than a mutation; A256S falls in the conserved CVC domain and was found
    in no control. Only A256S is offered as the causal change. The distinction is not
    academic: R131S is independently catalogued as a previously reported single-nucleotide
    polymorphism in a keratoconus cohort in which no VSX1 variant proved pathogenic.
  genes:
  - preferred_term: VSX1
    term:
      id: hgnc:12723
      label: VSX1
  genetic_context:
    genes:
    - preferred_term: VSX1
      term:
        id: hgnc:12723
        label: VSX1
    allele_type: two coding substitutions in cis, R131S and A256S, the latter in the CVC domain
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous in all four affected members of one pedigree, both changes on the same
      chromosome. No second family has been reported.
    notes: >-
      No functional_impact_category is recorded, and that is deliberate. Neither change has
      been functionally characterised. The published in vitro work on VSX1 covers the
      homeodomain change R166W, which impairs DNA binding and hinders repressor function, and
      a set of missense changes that either enhanced repressor activity or left it unaltered -
      A256S is not among them. Assigning LOSS_OF_FUNCTION or GAIN_OF_FUNCTION here would be an
      inference from domain position rather than a measurement, and the direction is not even
      predictable: the closest characterised CVC-domain change, P247R, enhanced rather than
      reduced repressor activity.
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two changes in VSX1 (RINX) were identified: a variation (R131S) not in a critical region and in few controls, and a mutation (A256S) in the critical CVC-domain and not in any controls."
    explanation: >-
      Both changes with the authors' own classification of each, which is the reason this
      entry treats only one of the two as a candidate cause.
  - reference: PMID:16799019
    reference_title: "No VSX1 gene mutations associated with keratoconus."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two previously reported SNPs were also identified: c.426C>A (Arg131Ser) in one affected patient and c.581A>G (Ala182Ala) in 51 of the 100 affected patients."
    explanation: >-
      Independent evidence that R131S circulates as a polymorphism. INDIRECT because the
      cohort is a keratoconus series rather than this syndrome, but it is the same nucleotide
      change and it bears directly on how much of this genotype can be doing any work.
  downstream:
  - target: Impaired VSX1 Transcriptional Repression
    causal_link_type: DIRECT
- name: Impaired VSX1 Transcriptional Repression
  biological_scale: MOLECULAR
  description: >-
    VSX1 is a paired-like homeodomain protein that acts as a transcriptional repressor, and
    its CVC domain contributes to the DNA binding and repression that the closely related
    CHX10 also performs. A keratoconus-associated homeodomain change, R166W, impairs DNA
    binding and hinders repressor function, which is the demonstration that VSX1 repression
    is disruptable by a coding change. Whether A256S does anything of the sort has not been
    tested.
  genes:
  - preferred_term: VSX1
    term:
      id: hgnc:12723
      label: VSX1
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity
    modifier: DECREASED
    term:
      id: GO:0001227
      label: "DNA-binding transcription repressor activity, RNA polymerase II-specific"
  mechanism_confidence: PROVISIONAL
  notes: >-
    PROVISIONAL, and the reason is worth stating plainly: this node is an inference from
    domain position, not a measurement. The repression machinery is real and the CVC domain
    is part of it, but no functional study of A256S exists. Worse for the naive reading, the
    direction is not predictable from what has been tested - a later survey of VSX1 missense
    changes found that they either enhanced repressor activity or did not alter it, and the
    CVC-domain change P247R enhanced it. So the modifier here records the direction this
    entry's causal chain would need rather than one that has been observed for this allele,
    and a reviewer should treat it as a hypothesis.
  evidence:
  - reference: PMID:15647262
    reference_title: "Transcriptional activity of the paired-like homeodomain proteins CHX10 and VSX1."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "VSX1 contains closely related homeo and CVC domains and, like CHX10, also repressed transcription."
    explanation: >-
      That VSX1 is a repressor and that the CVC domain is one of its functional domains.
      INDIRECT because it establishes the machinery rather than what this family's change
      does to it.
  - reference: PMID:15647262
    reference_title: "Transcriptional activity of the paired-like homeodomain proteins CHX10 and VSX1."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "A VSX1 HD mutation, R166W, that impairs DNA binding and causes keratoconus in humans, hindered repressor function."
    explanation: >-
      The proof of principle that a disease-associated VSX1 coding change can impair
      repression - for a different change, in a different domain, in a different disease.
  - reference: PMID:30535423
    reference_title: "Investigating the Pathogenicity of VSX1 Missense Mutations and Their Association With Corneal Disease."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "In vitro analysis of additional VSX1 missense mutations showed that they either enhanced repressor activity or did not alter activity."
    explanation: >-
      The counterweight, kept on the node it argues against. Tested VSX1 missense changes do
      not reduce repression, so a loss-of-repression reading for an untested change in this
      gene runs against the available functional data rather than with it.
  downstream:
  - target: Retinal and Auditory Bipolar Cell Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      VSX1 is expressed in retinal bipolar cells and controls their terminal gene expression,
      so a change in its repressor function has a route to bipolar cell dysfunction. The
      intermediate steps in this family were not measured.
  - target: Corneal Endothelial Dysgenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Midline Craniofacial and Sellar Maldevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Retinal and Auditory Bipolar Cell Dysfunction
  biological_scale: CELLULAR
  description: >-
    The one part of this phenotype with support outside the family. Electrophysiology found
    evidence of abnormal cone bipolar cells on visual evoked response and electroretinogram
    in the affected adults, and of abnormal auditory bipolar cells on audiogram and auditory
    evoked brainstem response in the proband. Independently, Vsx1 controls terminal gene
    expression in type 7 ON bipolar cells in mouse, and abnormal inner-retinal function on
    electroretinography has been reported in carriers of two other VSX1 changes in an
    unrelated family - the one place where the VSX1-to-retina link has been seen twice.
  cell_types:
  - preferred_term: retinal bipolar neuron
    term:
      id: CL:0000748
      label: retinal bipolar neuron
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiologic examination provided evidence for abnormal cone bipolar cells (visual evoked response and electroretinogram) in the adult affected patients and for abnormal auditory bipolar cells (audiogram and audio-evoked brainstem response) in the propositus."
    explanation: >-
      The measurement in the family, and the two modalities used for each of the two cell
      populations.
  - reference: PMID:21917795
    reference_title: "Vsx1 regulates terminal differentiation of type 7 ON bipolar cells."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In the absence of Vsx1, Type 7 bipolar cells exhibit proper morphological specification but show defects in terminal gene expression."
    explanation: >-
      That losing Vsx1 does something specific to bipolar cells, which is what makes the
      family's electrophysiology mechanistically plausible rather than coincidental. INDIRECT
      because it is a mouse null rather than this family's allele.
  - reference: PMID:11978762
    reference_title: "VSX1: a gene for posterior polymorphous dystrophy and keratoconus."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, with either the G160D or P247R mutation, electroretinography detected abnormal function of the inner retina, where VSX1 is expressed."
    explanation: >-
      The same class of finding in a different family with different VSX1 changes, which is
      the only independent human replication of any part of this phenotype. INDIRECT because
      the family and the alleles are different.
  downstream:
  - target: Abnormal Electroretinogram
  - target: Abnormal Auditory Evoked Potentials
- name: Corneal Endothelial Dysgenesis
  biological_scale: TISSUE
  description: >-
    Anterior segment anomalies of the corneal endothelium were a constant finding in all four
    affected family members, and the authors take the change to reflect anomalous development
    of the corneal endothelium. Nothing beyond the family supports a VSX1 role here, and one
    substantial piece of evidence runs against it: a mouse carrying the equivalent of the
    VSX1 CVC-domain change p.P247R had no observable corneal defect.
  locations:
  - preferred_term: corneal endothelium
    term:
      id: UBERON:0001985
      label: corneal endothelium
  mechanism_confidence: PROVISIONAL
  notes: >-
    PROVISIONAL because the finding is consistent within one family and contradicted outside
    it. dismech already records VSX1's corneal assignments as unconfirmed or of uncertain
    significance in Posterior_Polymorphous_Corneal_Dystrophy and types the gene DISPUTED in
    Keratoconus, and the mouse model of a CVC-domain change has no corneal phenotype. The
    node is kept because the observation in this family is real and reported in every
    affected member; the incoming edge is marked as having unknown intermediates because no
    step between a transcription factor and a corneal endothelial phenotype has been shown.
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anterior segment anomalies of the corneal endothelium were a constant finding in all affected family members."
    explanation: The finding, and that it was the only one present in every affected member.
  - reference: PMID:30535423
    reference_title: "Investigating the Pathogenicity of VSX1 Missense Mutations and Their Association With Corneal Disease."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "A mouse model for VSX1 p.P247R did not have any observable corneal defect, but did exhibit an abnormal electroretinogram response characterized by a more prominent ON as opposed to OFF panretinal responsiveness."
    explanation: >-
      The counter-evidence, and it splits the phenotype in an informative way - the same
      mouse reproduces the retinal abnormality and not the corneal one, which is the pattern
      this entry's confidence markings follow.
  - reference: PMID:30535423
    reference_title: "Investigating the Pathogenicity of VSX1 Missense Mutations and Their Association With Corneal Disease."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "While we cannot exclude a role for VSX1 as a risk factor for corneal disease, on its own, it does not appear to play a major causative role."
    explanation: >-
      The authors' own conclusion about VSX1 and corneal disease, at the strength they give
      it - they do not exclude a contributory role, and they do exclude a major causative one.
  downstream:
  - target: Abnormal Corneal Endothelium Morphology
- name: Midline Craniofacial and Sellar Maldevelopment
  biological_scale: TISSUE
  description: >-
    The part of the phenotype with no proposed mechanism at all. All four affected members
    had craniofacial features - wide interpupillary distance and unusual pinnae. Neuroimaging
    found an empty sella turcica, a posterior fossa cyst, an anterior encephalocele,
    hypertelorism and severe hydrocephalus in the proband; a partially empty sella with a
    small pituitary and hypertelorism in her mother; and hypertelorism with otherwise normal
    imaging in her older sister. The authors conclude that the mutation results in abnormal
    craniofacial features and absence of the roof of the sella turcica, but propose no route
    from a retinal transcription factor to a midline skull-base defect, and none is invented
    here.
  locations:
  - preferred_term: sella turcica
    term:
      id: UBERON:0003689
      label: sella turcica
  mechanism_confidence: PROVISIONAL
  notes: >-
    PROVISIONAL, and this is the weakest node in the entry. VSX1 is a retinal and spinal
    interneuron transcription factor; no source read here proposes a craniofacial or
    skull-base role for it, no animal model shows one, and the finding rests on imaging of
    three individuals in one family. The posterior fossa cyst and the anterior encephalocele
    are described in prose rather than bound as phenotypes because each was seen in one
    person and neither is separable from the severe hydrocephalus in the same child.
  evidence:
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Craniofacial features, including wide interpupillary distance and unusual pinnae, occurred in the 4 affected patients."
    explanation: The craniofacial findings with the denominator, which is the whole affected sibship.
  - reference: PMID:15051220
    reference_title: "VSX1 (RINX) mutation with craniofacial anomalies, empty sella, corneal endothelial changes, and abnormal retinal and auditory bipolar cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The new mutation in the VSX1 (RINX) gene described in this report results in abnormal craniofacial features, absence of the roof of the sella turcica, and anomalous development of the corneal endothelium."
    explanation: >-
      The authors' causal conclusion, quoted at the strength they state it. It is an
      attribution rather than a demonstration, which is why this node is PROVISIONAL.
  downstream:
  - target: Hypertelorism
  - target: Abnormal Pinna Morphology
  - target: Empty Sella Turcica
  - target: Hydrocephalus

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0018631
      label: Marie Unna hereditary hypotrichosis
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >
      MONDO:0018631 is the parent grouping concept "Marie Unna hereditary
      hypotrichosis". It has exactly two children in MONDO - MONDO:0100522
      (hypotrichosis 4 / MUHH1, causal gene HGNC:55085 HRURF) and MONDO:0013017
      (hypotrichosis 5 / MUHH2, attributed to EPS8L3). Because the parent spans two
      different causal loci it is a broader concept than this entry, not an exact
      match, and is recorded as a cross-reference only.
classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Heterozygous HRURF (U2HR) variants segregate with the phenotype in
    multigenerational families across several ancestries, including the original
    1925 German kindred. Sporadic (presumed de novo) cases are also reported.
    Penetrance and expressivity are left unset: no formal penetrance study was
    found, and although reports describe severity varying within families, no
    source was located that assesses expressivity as such.
  evidence:
  - reference: PMID:20659777
    reference_title: "Marie Unna hereditary hypotrichosis: identification of a U2HR mutation in the family from the original 1925 report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MUHH is an autosomal dominant disorder that is characterized by the absence or scarcity of scalp hair, eyebrows, and eyelashes at birth; coarse and wiry hair during childhood; and progressive hair loss beginning around puberty."
    explanation: States the autosomal dominant inheritance pattern of MUHH alongside its defining clinical course.
  - reference: PMID:26269244
    reference_title: "Identification of mutations in U2HR in two Chinese families with Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both these mutations cosegregated with the disease phenotype in the two families."
    explanation: Cosegregation of heterozygous U2HR variants with the phenotype in two multigenerational families supports dominant transmission.
  - reference: PMID:37012647
    reference_title: "Identification of a novel sporadic U2HR pathogenic variant in a patient with Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a sporadic case of a 4-year-old boy with clinical features suggestive of MUHH, in whom we identified the new pathogenic variant c.67C>T; p.(Gln23*) in U2HR."
    explanation: Documents a sporadic presentation, so a negative family history does not exclude the diagnosis.
genetic:
- name: HRURF
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: HRURF
    term:
      id: hgnc:55085
      label: HRURF
  notes: >
    HRURF (HGNC:55085, "HR upstream open reading frame", 8p21.3) was approved as a
    distinct HGNC gene record only in 2020, with U2HR retained as an alias. Every
    primary MUHH1 report from 2009 through at least 2023 attributes the variants to
    "U2HR", described as an inhibitory upstream ORF inside the 5' UTR of HR
    (HGNC:5172); reports from 2025 onward use HRURF and gloss it as "formerly known
    as U2HR". The two names denote the same element. MONDO records HRURF as the
    RO:0004003 causal gene for MONDO:0100522, which is why this entry uses the
    approved symbol while the cited snippets say U2HR.

    Reported variant classes are all confined to the 34-codon uORF: loss of the
    initiation codon (c.1A>T, c.2T>C, c.3G>A), delayed/read-through termination
    (c.104A>G, c.105G>T), nonsense (c.67C>T) and missense (c.74C>T, c.74C>G), with
    mutation hot spots at codons 1-7 and 24-28.
  evidence:
  - reference: PMID:19122663
    reference_title: "Loss-of-function mutations of an inhibitory upstream ORF in the human hairless transcript cause Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a large Chinese family carrying MUHH, we identified a pathogenic initiation codon mutation in U2HR, an inhibitory upstream ORF in the 5' UTR of the gene encoding the human hairless homolog (HR)."
    explanation: The founding report identifying U2HR/HRURF as the causal element and locating it in the 5' UTR of HR.
  - reference: PMID:19122663
    reference_title: "Loss-of-function mutations of an inhibitory upstream ORF in the human hairless transcript cause Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 18 more families from different ancestral groups, we identified a range of defects in U2HR, including loss of initiation, delayed termination codon and nonsense and missense mutations."
    explanation: Establishes the allelic spectrum within the uORF across 18 additional unrelated families.
  - reference: PMID:39872230
    reference_title: "Recalcitrant Female Pattern Hair Loss Like Alopecia Unveils Unexpected Rare Entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing confirmed a heterozygous pathogenic variant in the HRURF gene, associated with autosomal dominant Marie Unna Hereditary Hypotrichosis."
    explanation: A recent report using the approved HRURF symbol for the same causal element, confirming heterozygous variants in patients.
- name: HR
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  gene_term:
    preferred_term: HR
    term:
      id: hgnc:5172
      label: HR
  notes: >
    HR (HGNC:5172) is recorded here only to make the relationship explicit, not as a
    second causal gene for HYPT4. HRURF sits inside HR's 5' UTR and the disease acts
    through HR protein output, but the linkage-era studies that mapped MUHH to 8p21
    explicitly excluded the HR coding sequence, and that exclusion is what led to the
    uORF discovery.

    One outlier exists: a single Hungarian patient with alopecia universalis and
    four-limb deformities was reported with a heterozygous HR exon-3 missense variant
    (c.974G>A, p.Gly325Asp) under the label MUHH1 (PMID:22584530). That report is not
    cited as evidence anywhere in this entry. The authors themselves wrote that
    further studies are needed to establish a role for the variant, only one
    unaffected relative was available, the phenotype (alopecia universalis plus limb
    deformity) is not the MUHH1 triphasic course, and no subsequent family has
    replicated a coding-HR cause of MUHH1. Biallelic HR coding loss-of-function
    causes atrichia with papular lesions and alopecia universalis congenita, which
    are recessive and separate entities - see `differential_diagnoses`.
pathophysiology:
- name: HRURF Upstream Open Reading Frame Disruption
  biological_scale: MOLECULAR
  description: >
    A heterozygous germline variant disrupts the 34-codon inhibitory upstream open
    reading frame HRURF (U2HR) in the 5' untranslated region of the HR transcript.
    Loss-of-initiation, delayed-termination, nonsense and missense changes all
    destroy the uORF peptide's normal function. The variant is loss-of-function
    *for the uORF*; its effect on hairless is the opposite (see the next node).
  genetic_context:
    gene:
      preferred_term: HRURF
      term:
        id: hgnc:55085
        label: HRURF
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >
      The category applies to HRURF, whose repressive uORF function is abolished. The
      downstream consequence for HR is increased protein output, which is a different
      claim about a different gene product and is modeled as a separate node.
  biological_processes:
  - preferred_term: uORF-mediated repression of translational initiation at the main HR ORF
    term:
      id: GO:0045947
      label: negative regulation of translational initiation
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:19122663
    reference_title: "Loss-of-function mutations of an inhibitory upstream ORF in the human hairless transcript cause Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 18 more families from different ancestral groups, we identified a range of defects in U2HR, including loss of initiation, delayed termination codon and nonsense and missense mutations."
    explanation: Defines the classes of uORF-disrupting variants that constitute the initiating lesion.
  - reference: PMID:19122663
    reference_title: "Loss-of-function mutations of an inhibitory upstream ORF in the human hairless transcript cause Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "U2HR is predicted to encode a 34-amino acid peptide that is highly conserved among mammals."
    explanation: The uORF peptide length and its mammalian conservation are a sequence prediction, not an experimental measurement, and are graded accordingly.
  - reference: PMID:20163456
    reference_title: "Marie Unna hereditary hypotrichosis caused by a novel mutation in the human hairless transcript."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutations of an inhibitory upstream ORF in the human hairless transcript were found as the cause for autosomal dominant Marie Unna hereditary hypotrichosis."
    explanation: Independently states that the causal lesion is loss of function of the inhibitory uORF, not of the hairless coding sequence.
  downstream:
  - target: Translational De-repression of the Main HR Open Reading Frame
    causal_link_type: DIRECT
    description: >
      Destroying the uORF removes the translational brake it imposes on the
      downstream main HR ORF.
    evidence:
    - reference: PMID:19122663
      reference_title: "Loss-of-function mutations of an inhibitory upstream ORF in the human hairless transcript cause Marie Unna hereditary hypotrichosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional analysis showed that these classes of mutations all resulted in increased translation of the main HR physiological ORF."
      explanation: Reporter assays link each class of uORF defect directly to increased translation of the main HR ORF, which is the edge asserted here.
- name: Translational De-repression of the Main HR Open Reading Frame
  biological_scale: MOLECULAR
  description: >
    With the inhibitory uORF disabled, ribosomes translate the downstream main HR
    open reading frame more efficiently. This is the pivotal direction in the entry:
    translation of HR goes *up*, not down.
  biological_processes:
  - preferred_term: translation of the main HR open reading frame
    term:
      id: GO:0006412
      label: translation
    modifier: INCREASED
  evidence:
  - reference: PMID:19122663
    reference_title: "Loss-of-function mutations of an inhibitory upstream ORF in the human hairless transcript cause Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis showed that these classes of mutations all resulted in increased translation of the main HR physiological ORF."
    explanation: Directly states the increased-translation direction for every reported class of uORF variant.
  - reference: PMID:20163456
    reference_title: "Marie Unna hereditary hypotrichosis caused by a novel mutation in the human hairless transcript."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional assays confirmed that this mutation led to increased translation of the main HR ORF."
    explanation: An independent laboratory reproduces the increased-translation result for a further missense uORF variant.
  downstream:
  - target: Hairless Corepressor Protein Overexpression
    causal_link_type: DIRECT
    description: More efficient translation of the main ORF raises HR protein levels.
    evidence:
    - reference: PMID:19897589
      reference_title: "Overexpression of Hr links excessive induction of Wnt signaling to Marie Unna hereditary hypotrichosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This mutation conferred overexpression of HR through translational derepression and, in turn, decreased the expression of Sfrp2, an inhibitor of the Wnt signaling pathway."
      explanation: States the derepression-to-overexpression step explicitly in the mouse carrying the orthologous uORF mutation.
- name: Hairless Corepressor Protein Overexpression
  biological_scale: MOLECULAR
  description: >
    Hairless is a nuclear-receptor transcriptional corepressor expressed mainly in
    skin and brain that governs hair-follicle morphogenesis and cycling. In MUHH1 the
    protein itself is structurally normal; there is simply too much of it. Because HR
    acts by repressing transcription, excess HR means excess corepression at its
    target genes. Hair growth depends on HR being present in the right amount rather
    than merely present, which is why both loss and gain of HR produce alopecia.
  biological_processes:
  - preferred_term: hairless-mediated transcriptional corepression at nuclear-receptor target genes
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: INCREASED
  cell_types:
  - preferred_term: hair follicle keratinocyte
    term:
      id: CL:2000092
      label: hair follicular keratinocyte
  evidence:
  - reference: PMID:24447645
    reference_title: "Increased expression of Dkk1 by HR is associated with alteration of hair cycle in hairpoor mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hairless (Hr), a transcriptional corepressor expressed mainly in the skin, regulates hair follicle (HF) morphogenesis and hair cycling."
    explanation: Establishes what the overproduced protein does - transcriptional corepression governing follicle morphogenesis and cycling.
  - reference: PMID:19122663
    reference_title: "Loss-of-function mutations of an inhibitory upstream ORF in the human hairless transcript cause Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "show that fine-tuning of HR protein levels is important in control of hair growth"
    explanation: States that the quantity of HR protein, not its presence or absence, is the controlled variable in hair growth - the dosage framing of this node.
  - reference: PMID:19897589
    reference_title: "Overexpression of Hr links excessive induction of Wnt signaling to Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study indicates that the gain in function of HR also results in alopecia, as seen with the loss of function of HR, via abnormal upregulation of the Wnt signaling pathway."
    explanation: States that gain, not loss, of HR causes the alopecia in this model - the direction this entry curates.
  downstream:
  - target: Dysregulated Wnt Pathway Modulation in the Hair Follicle
    causal_link_type: DIRECT
    description: >
      Excess HR corepressor alters transcription of Wnt-pathway modulator genes in
      follicular skin. Demonstrated in the hairpoor mouse only.
    evidence:
    - reference: PMID:19897589
      reference_title: "Overexpression of Hr links excessive induction of Wnt signaling to Marie Unna hereditary hypotrichosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This mutation conferred overexpression of HR through translational derepression and, in turn, decreased the expression of Sfrp2, an inhibitor of the Wnt signaling pathway."
      explanation: Links HR overexpression to reduced expression of the Wnt inhibitor Sfrp2, the edge asserted here.
    - reference: PMID:24447645
      reference_title: "Increased expression of Dkk1 by HR is associated with alteration of hair cycle in hairpoor mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Dkk1 expression was increased in the skin of (+)/Hr(HP) and Hr(Hp)/Hr(Hp) mice, as well as in Hr-overexpressing mouse keratinocytes."
      explanation: An independent Wnt modulator, Dkk1, is also altered by HR overexpression, including in HR-overexpressing keratinocytes.
  - target: Abnormal Hair Shaft Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      The coarse, twisted, variable-calibre shafts of MUHH1 arise in follicles
      operating under excess HR corepression. The intervening steps between HR dosage
      and shaft geometry are not established; the link is recorded as indirect and
      the specific cellular step is flagged in `discussions`.
- name: Dysregulated Wnt Pathway Modulation in the Hair Follicle
  biological_scale: CELLULAR
  description: >
    In the hairpoor mouse, HR overexpression changes the expression of secreted Wnt
    inhibitors in follicular skin. The two published results are not concordant in
    sign: Sfrp2 falls (which the authors read as excess Wnt activation), while Dkk1
    rises (a Wnt inhibitor and catagen inducer). The node therefore records the
    pathway as dysregulated rather than asserting a direction, and the discrepancy is
    tracked as an open controversy. Nothing here has been shown in human MUHH1 skin.
  biological_processes:
  - preferred_term: Wnt signaling pathway modulation in follicular skin
    term:
      id: GO:0016055
      label: Wnt signaling pathway
    modifier: DYSREGULATED
  - preferred_term: secreted Wnt-inhibitor (Sfrp2, Dkk1) expression
    term:
      id: GO:0030178
      label: negative regulation of Wnt signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:19897589
    reference_title: "Overexpression of Hr links excessive induction of Wnt signaling to Marie Unna hereditary hypotrichosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study indicates that the gain in function of HR also results in alopecia, as seen with the loss of function of HR, via abnormal upregulation of the Wnt signaling pathway."
    explanation: Reports abnormal upregulation of Wnt signaling downstream of HR gain in the hairpoor mouse.
  - reference: PMID:24447645
    reference_title: "Increased expression of Dkk1 by HR is associated with alteration of hair cycle in hairpoor mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "One of the Wnt inhibitors, Dickkopf (Dkk), inhibits hair growth during the hair cycle as a catagen inducer of apoptosis, resulting in HF reductions."
    explanation: Establishes Dkk1's role as a Wnt inhibitor and catagen inducer, the axis the same group found upregulated by HR - the reason this node is labelled dysregulated rather than uniformly activated.
  downstream:
  - target: Premature Catagen Entry and Hair Follicle Shortening
    causal_link_type: DIRECT
    description: >
      Upregulation of the catagen-inducing Wnt inhibitor Dkk1 accompanies early
      catagen entry and shorter follicles in heterozygous hairpoor mice.
    evidence:
    - reference: PMID:24447645
      reference_title: "Increased expression of Dkk1 by HR is associated with alteration of hair cycle in hairpoor mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings also indicated that alteration of the hair cycle in (+)/Hr(HP) mice was related to the up-regulation of Dkk1 by HR."
      explanation: The authors attribute the altered hair cycle in the heterozygous model to HR-driven Dkk1 upregulation, which is this edge.
- name: Premature Catagen Entry and Hair Follicle Shortening
  biological_scale: TISSUE
  description: >
    Heterozygous hairpoor mice enter catagen earlier and grow shorter hair follicles
    than wild type. This is the mechanistic proposal for why MUHH1 hair is short and
    why follicles progressively fail; it is a mouse result and has not been shown in
    human MUHH1 scalp.
  biological_processes:
  - preferred_term: hair cycle (anagen-catagen transition)
    term:
      id: GO:0042633
      label: hair cycle
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24447645
    reference_title: "Increased expression of Dkk1 by HR is associated with alteration of hair cycle in hairpoor mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, an earlier entrance of HFs into catagen and shortened HF length in (+)/Hr(HP) mice compared to wild-type mice was observed."
    explanation: Directly measures earlier catagen entry and shortened follicles in the heterozygous model of MUHH1.
  downstream:
  - target: Progressive Loss of Hair Follicle Density
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Repeated cycles truncated at catagen are the proposed route to permanent
      follicle loss. The step is inferred: no study follows individual human MUHH1
      follicles from shortened cycling to loss.
- name: Progressive Loss of Hair Follicle Density
  biological_scale: TISSUE
  description: >
    Scalp biopsy in MUHH1 shows a markedly reduced number of follicles per unit area
    with only a mild to moderate inflammatory infiltrate, little fibrosis and no
    scarring - a non-scarring alopecia. The mechanism by which follicles are lost was
    explicitly stated as unknown in the largest histopathological pedigree study and
    remains so.
  cell_types:
  - preferred_term: hair follicle keratinocyte
    term:
      id: CL:2000092
      label: hair follicular keratinocyte
  biological_processes:
  - preferred_term: hair follicle development and maintenance
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:10674378
    reference_title: "Marie Unna congenital hypotrichosis: clinical description, histopathology, scanning electron microscopy of a previously unreported large pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, there are dramatically reduced numbers of follicles per unit area, averaging nine total hairs per 4 mm cross-section as compared with a normal of 40."
    explanation: Quantifies the loss of follicle density in affected human scalp.
  - reference: PMID:10674378
    reference_title: "Marie Unna congenital hypotrichosis: clinical description, histopathology, scanning electron microscopy of a previously unreported large pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mechanism of progressive hair loss is unknown."
    explanation: The authors state directly that the mechanism of follicle loss was not established, which is why this node carries no asserted cellular mechanism.
  - reference: PMID:39872230
    reference_title: "Recalcitrant Female Pattern Hair Loss Like Alopecia Unveils Unexpected Rare Entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic factors, altered hair shaft morphology, a decreased number of functional follicles, and abnormal follicle cycling have been suggested as contributors to the disease pathogenesis, with mutations in the U2HR gene, located on chromosome 8p21, identified as the underlying cause."
    explanation: A recent molecularly confirmed case series names reduced functional follicle number and abnormal follicle cycling as the proposed contributors, matching this node and the one above it.
  downstream:
  - target: Progressive Scalp Hair Loss After Puberty
    causal_link_type: DIRECT
    description: Loss of follicles is what the patterned post-pubertal alopecia consists of.
- name: Abnormal Hair Shaft Formation
  biological_scale: TISSUE
  description: >
    The hair that does grow is structurally abnormal: shafts of uniformly increased
    and variable diameter (up to 0.12 mm), deeply pigmented, twisted, bent at odd
    angles, longitudinally grooved on scanning electron microscopy, and irregular in
    cross-section. Dermoscopy shows pili torti. This produces the coarse, wiry,
    unruly hair of the childhood phase.
  evidence:
  - reference: PMID:10674378
    reference_title: "Marie Unna congenital hypotrichosis: clinical description, histopathology, scanning electron microscopy of a previously unreported large pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual hair shafts are deeply pigmented, variable in diameter, twisted, and bent at odd angles; some have a longitudinal groove visible on scanning electron microscopy."
    explanation: Structural characterization of the abnormal shaft by light and scanning electron microscopy.
  - reference: PMID:10674378
    reference_title: "Marie Unna congenital hypotrichosis: clinical description, histopathology, scanning electron microscopy of a previously unreported large pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hair shafts are uniformly increased in diameter, measuring up to 0.12 mm."
    explanation: Quantifies the increased shaft calibre that gives the hair its coarse quality.
  downstream:
  - target: Coarse Wiry Scalp Hair in Childhood
    causal_link_type: DIRECT
    description: The altered shaft geometry is what makes the hair coarse, wiry and unruly.
  - target: Pili Torti
    causal_link_type: DIRECT
    description: Twisting of the shaft on its own axis is seen dermoscopically as pili torti.
phenotypes:
- category: Cutaneous
  name: Sparse Scalp Hair at Birth
  description: >
    Scalp hair is absent or scanty at birth and through early infancy. Note that this
    is not universal: the six-generation pedigree of Roberts et al. described affected
    individuals as born with adequate, normal to coarse hair, so the congenital phase
    varies between families.
  phenotype_term:
    preferred_term: Sparse scalp hair
    term:
      id: HP:0002209
      label: Sparse scalp hair
  evidence:
  - reference: PMID:20659777
    reference_title: "Marie Unna hereditary hypotrichosis: identification of a U2HR mutation in the family from the original 1925 report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MUHH is an autosomal dominant disorder that is characterized by the absence or scarcity of scalp hair, eyebrows, and eyelashes at birth; coarse and wiry hair during childhood; and progressive hair loss beginning around puberty."
    explanation: Defines absent or scanty scalp hair at birth as a characteristic feature.
  - reference: PMID:10674378
    reference_title: "Marie Unna congenital hypotrichosis: clinical description, histopathology, scanning electron microscopy of a previously unreported large pedigree."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals are born with adequate, normal to coarse hair."
    explanation: In this large pedigree the neonatal hair was adequate rather than sparse, contradicting the claim that sparse hair at birth is universal.
- category: Cutaneous
  name: Coarse Wiry Scalp Hair in Childhood
  description: >

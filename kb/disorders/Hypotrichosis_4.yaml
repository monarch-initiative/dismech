name: Hypotrichosis 4
creation_date: "2026-09-07T00:00:00Z"
category: Mendelian
description: >
  Hypotrichosis 4 (HYPT4; OMIM 146550), clinically known as Marie Unna hereditary
  hypotrichosis 1 (MUHH1), is a rare autosomal dominant hair disorder with a
  characteristic triphasic course: scalp hair, eyebrows and eyelashes are absent or
  scanty at birth, coarse and wiry hair grows in during childhood, and progressive
  scalp hair loss begins around puberty. Other ectodermal structures are essentially
  spared.

  The molecular lesion is unusual and is easy to state backwards. The disease variants
  do not lie in the coding sequence of the hairless gene (HR) at 8p21.3. They lie in
  HRURF (approved 2020; historically and still widely called U2HR), a small inhibitory
  upstream open reading frame embedded in the 5' untranslated region of the HR
  transcript, which encodes a conserved 34-amino-acid peptide and normally represses
  translation of the downstream main HR ORF. Loss-of-initiation, delayed-termination,
  nonsense and missense variants all abolish that repression, and functional assays
  show they converge on *increased* translation of the main HR ORF. The consequence for
  hairless is therefore overproduction of an otherwise wild-type corepressor - a
  dosage/gain-of-expression lesion - not loss of hairless function. This distinguishes
  HYPT4 sharply from the biallelic HR coding loss-of-function disorders (atrichia with
  papular lesions, alopecia universalis congenita), which are separate entities and are
  not curated here.

  What excess hairless then does to the follicle is established only in the mouse. The
  ENU-derived hairpoor mouse carries the orthologous uORF start-codon mutation, and in
  that model HR overexpression alters Wnt-pathway modulators and shortens the hair
  cycle. Those downstream steps have not been demonstrated in human MUHH1 scalp, and
  the two published mouse results point in opposite directions on Wnt activity; both
  points are recorded in `discussions`.

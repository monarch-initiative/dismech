inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    This is the authoritative OMIM/HPO inheritance annotation and correctly
    describes the reported pedigrees: affected individuals are hemizygous males,
    the founding families were multiplex X-linked pedigrees with transmission
    through unaffected carrier mothers, and the original linkage was to
    Xp11.3-q21.3. Penetrance is recorded as incomplete and expressivity as
    variable on the strength of two documented observations within families: in
    the original Siderius-Hamel family only two of three affected individuals had
    both intellectual disability and clefting while the third had mild
    intellectual disability alone, and in the Finnish F279S sibship the identical
    allele produced unilateral clefting in one brother and bilateral clefting in
    the other. No systematic study of heterozygous female carriers has been
    published for this entity, so nothing is asserted about female manifestation
    here.
  evidence:
  - reference: PMID:10398231
    reference_title: X-linked mental retardation associated with cleft lip/palate maps
      to Xp11.3-q21.3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage analysis showed a maximum LOD score of Z=2.78 at straight theta=0.0 for the DXS441 locus with flanking markers DXS337 and DXS990, defining the region Xp11.3-q21.3 with a linkage interval of 25 cM."
    explanation: The original X-linkage evidence that established the inheritance
      pattern before the gene was known.
  - reference: PMID:17594395
    reference_title: A novel mutation in the PHF8 gene is associated with X-linked mental
      retardation with cleft lip/cleft palate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second mutation was present in a family with four affected men, three of whom had MR and CL/P, while the fourth individual had mild MR without clefting."
    explanation: Documents intrafamilial variability for the clefting component,
      supporting the VARIABLE expressivity annotation.
  - reference: PMID:17661819
    reference_title: Screening of mutations in the PHF8 gene and identification of a
      novel mutation in a Finnish family with XLMR and cleft lip/cleft palate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unilateral cleft lip and cleft palate in one and bilateral cleft lip and cleft palate in the other sibling"
    explanation: Same-allele, same-family variation in cleft laterality, a second
      independent line of support for variable expressivity.
  - reference: PMID:18498374
    reference_title: Autism-associated familial microdeletion of Xp11.22.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "shown to be inherited from their unaffected mother who had skewed (100%) X inactivation of the aberrant chromosome"
    explanation: >
      The only published X-inactivation data bearing on carrier status in this
      disorder: complete skewing in an unaffected transmitting mother. It is a
      single observation of a deletion carrier, so it is consistent with, but
      does not establish, non-penetrance in females generally.

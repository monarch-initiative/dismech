- name: Impaired Serine Biosynthesis in Neural Progenitors
  biological_scale: CELLULAR
  description: >
    The most recently described arm, and the one that connects chromatin
    regulation to metabolism. In neural stem cells PHF8 drives the serine
    biosynthesis pathway by tuning chromatin accessibility at the promoters of
    metabolic genes, safeguarding the intracellular serine pool that progenitor
    proliferation depends on. Loss of PHF8 disrupts amino-acid metabolism, blocks
    autophagy and impairs vesicle formation, and culminates in replication
    defects, DNA damage and proliferation arrest; in mouse embryos PHF8 deficiency
    halts progenitor expansion and neuron generation in the developing brain.
    Evidence is from neural stem cells and mouse embryos, not from patients.

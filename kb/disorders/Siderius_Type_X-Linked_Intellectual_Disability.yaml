    explanation: >
      Qualifies the node - a reanalysis of published ChIP-seq indicates the
      transcriptional output is bidirectional, so "loss of activation" is the
      dominant but not the exclusive consequence.
  - reference: PMID:20548336
    reference_title: The X-linked mental retardation gene PHF8 is a histone demethylase
      involved in neuronal differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we show that PHF8 interacts with RARalpha and functions as a coactivator for RARalpha."
    explanation: >
      Identifies a specific nuclear-receptor partner through which the

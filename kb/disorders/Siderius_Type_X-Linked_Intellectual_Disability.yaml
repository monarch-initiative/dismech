    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, a mutant PHF8 (phenylalanine at position 279 to serine) identified in the XLMR patients is defective in enzymatic activity, indicating that the loss of histone demethylase activity is causally linked with the onset of disease."
    explanation: Independent confirmation, with the authors drawing the causal

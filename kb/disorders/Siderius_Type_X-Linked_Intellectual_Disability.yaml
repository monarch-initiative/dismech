- name: RSK1 Derepression and mTOR Pathway Hyperactivation
  biological_scale: MOLECULAR
  description: >
    A specific, pharmacologically actionable branch of the H4K20me1 arm. In Phf8
    knockout mice, failure to demethylate H4K20me1 at the RSK1 locus derepresses
    RSK1, and the mTOR signalling pathway becomes hyperactive in hippocampus.
    This is the one node in the entry with a demonstrated rescue: rapamycin
    normalises both long-term potentiation and cognitive performance in the
    knockout. The evidence is entirely from the mouse; no patient has been
    treated on this rationale.
  biological_processes:
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:29317619
    reference_title: Phf8 histone demethylase deficiency causes cognitive impairments
      through the mTOR pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also show that mTOR signaling pathway is hyperactive in hippocampus in Phf8 knockout mouse."
    explanation: Establishes mTOR hyperactivation as a consequence of Phf8 loss in
      vivo.
  - reference: PMID:29317619
    reference_title: Phf8 histone demethylase deficiency causes cognitive impairments
      through the mTOR pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, we show that demethylation of H4K20me1 by Phf8 results in transcriptional suppression of RSK1 and homeostasis of mTOR signaling."

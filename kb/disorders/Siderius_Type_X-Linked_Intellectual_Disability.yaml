- name: Loss of PHD-Finger H3K4me3 Reading and Nuclear Targeting
  biological_scale: MOLECULAR
  description: >
    The N-terminal PHD finger of PHF8 binds H3K4me3/me2, the mark that decorates
    active transcription start sites, and this reader function is what recruits
    the enzyme to the promoters it acts on. Truncating patient alleles remove not
    only the JmjC domain but also the nuclear localisation signals, so the
    residual protein cannot reach chromatin at all. This is modelled as a sibling
    of the catalytic arm rather than a downstream consequence, because the F279S
    catalytic-dead allele leaves the PHD finger intact while the K177X nonsense
    allele removes both modules - the two arms are separable in the patient
    allele series.
  molecular_functions:
  - preferred_term: histone H3K4me3 reader activity
    term:
      id: GO:0140002
      label: histone H3K4me3 reader activity
    modifier: DECREASED
  evidence:
  - reference: PMID:20421419
    reference_title: PHF8 targets histone methylation and RNA polymerase II to activate
      transcription.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our biochemical analysis revealed specific association of the PHF8 PHD with histone H3 trimethylated at lysine 4 (H3K4me3)."
    explanation: Establishes the PHD finger as an H3K4me3 reader module.
  - reference: PMID:20548336
    reference_title: The X-linked mental retardation gene PHF8 is a histone demethylase
      involved in neuronal differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, we show that PHF8 binds specifically to H3K4me3/2 peptides via an N-terminal PHD finger domain."
    explanation: Independent confirmation of the reader specificity.
  - reference: PMID:17594395
    reference_title: A novel mutation in the PHF8 gene is associated with X-linked
      mental retardation with cleft lip/cleft palate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation results in a truncated PHF8 protein lacking the Jumonji-like C terminus domain and five nuclear localization signals."
    explanation: >
      Documents that a patient nonsense allele removes the nuclear localisation
      signals in addition to the catalytic domain, which is the nuclear-targeting
      component of this node.
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,
      encodes for an Nepsilon-dimethyl lysine demethylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to the wild-type HA-PHF8, analogous studies revealed that the clinically observed F279S variant did not show clear nuclear localization, with apparent cytoplasmic localization."
    explanation: >
      Shows that even the F279S missense allele mislocalises out of the nucleus,
      so nuclear targeting is compromised by more than just the truncating
      alleles. This is why the node is framed as reading plus nuclear targeting.
  downstream:
  - target: Failure of RNA Polymerase II-Coupled Transcriptional Coactivation
- name: Persistence of Repressive H4K20me1 at Target Promoters
  biological_scale: MOLECULAR
  description: >
    PHF8 is the founding H4K20me1 demethylase. When catalysis is lost, H4K20me1
    accumulates at the transcription start sites of PHF8 target genes and the
    genes stay repressed. Two H4K20me1-dependent target sets have been mapped
    directly: cytoskeletal and cell-adhesion regulators (RHOA, RAC1, GSK3B) whose
    promoters PHF8 demethylates, and RSK1, whose derepression is the entry point
    into the mTOR arm. In astrocytes the related H4K20me3 mark accumulates at
    synaptogenic genes when PHF8 is depleted, extending the same
    heterochromatinisation logic to glia.
  biological_processes:
  - preferred_term: Chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20622853
    reference_title: Histone H4K20/H3K9 demethylase PHF8 regulates zebrafish brain
      and craniofacial development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we provide multiple lines of evidence establishing PHF8 as the first mono-methyl histone H4 lysine 20 (H4K20me1) demethylase, with additional activities towards histone H3K9me1 and me2."
    explanation: Establishes H4K20me1 as a principal PHF8 substrate.
  - reference: PMID:20622853
    reference_title: Histone H4K20/H3K9 demethylase PHF8 regulates zebrafish brain
      and craniofacial development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PHF8 depletion resulted in upregulation of H4K20me1 and H3K9me1 at the TSS and H3K9me2 in the non-TSS sites, respectively, demonstrating differential substrate specificities at different target locations."
    explanation: Direct demonstration that losing PHF8 causes the repressive marks
      to persist, and that the two marks accumulate at different genomic locations.
  - reference: PMID:22850744
    reference_title: The histone demethylase PHF8 is essential for cytoskeleton dynamics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data demonstrate that PHF8 directly regulates the expression of these genes by demethylating H4K20me1 at promoters."
    explanation: Maps a specific H4K20me1-dependent target set (cytoskeletal and
      adhesion genes) to promoter demethylation by PHF8.
  downstream:
  - target: Failure of RNA Polymerase II-Coupled Transcriptional Coactivation
  - target: RSK1 Derepression and mTOR Pathway Hyperactivation
- name: Persistence of Repressive H3K9me1/me2 Marks
  biological_scale: MOLECULAR
  description: >
    PHF8 also erases mono- and dimethylated H3K9, a repressive mark associated
    with facultative heterochromatin. Recombinant PHF8 is selective for H3K9me2
    and H3K9me1 and does not accept H3K9me3, so the enzyme trims the repressive
    mark toward the unmethylated state rather than resolving constitutive
    heterochromatin. In cells, PHF8 depletion raises H3K9me1 at transcription
    start sites and H3K9me2 at non-TSS sites. Loss of this activity is one of the
    two routes by which target promoters fail to be activated.
  molecular_functions:
  - preferred_term: histone H3K9me/H3K9me2 demethylase activity
    term:

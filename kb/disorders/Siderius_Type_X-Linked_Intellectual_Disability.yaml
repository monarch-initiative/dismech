    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutant encodes a F279S variant of PHF8 that modifies a conserved hydrophobic region; assays with both peptides and intact histones reveal this variant to be catalytically inactive."
    explanation: First functional demonstration of catalytic inactivity.
  - reference: PMID:20548336
    reference_title: The X-linked mental retardation gene PHF8 is a histone demethylase

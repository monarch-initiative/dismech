    A nonsense allele (p.K177X) reported in a male with intellectual disability and
    cleft lip/palate. It truncates the protein upstream of the JmjC domain and
    removes five nuclear localisation signals, so it is the cleanest example of
    the null end of the allele spectrum and the reason the PHD/nuclear-targeting

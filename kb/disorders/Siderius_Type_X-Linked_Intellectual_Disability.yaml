    snippet: "The mutation resides in exon 8 and changes phenylalanine to serine (F279S) in the functionally important Jmonji C domain of the protein."
    explanation: Localises the substitution to the catalytic domain.
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, PHF8 interacts with another XMLR protein, ZNF711, which binds to a subset of PHF8 target genes, including the XLMR gene JARID1C."
    explanation: >

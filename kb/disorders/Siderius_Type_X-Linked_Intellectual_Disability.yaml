genetic:
- name: PHF8
  association: Causative
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PHF8
    term:
      id: hgnc:20672
      label: PHF8
  notes: >
    PHF8 (Xp11.22; aliases JHDM1F, KIAA1111, ZNF422) encodes a 1024-amino-acid
    PHD-finger and JmjC-domain histone demethylase. The gene is ubiquitously
    transcribed, with strong expression of the mouse orthologue in embryonic and
    adult brain. The reported disease-allele spectrum is small - the 2022 series
    counted only five previous reports describing PHF8 predicted loss-of-function
    variants in eight individuals before it added sixteen more - and comprises
    nonsense, frameshift, splice and JmjC-clustered missense alleles plus
    Xp11.22 microdeletions. Clinical missense alleles cluster in the exons
    encoding the double-stranded beta-helix catalytic fold. Mechanism is loss of
    function throughout; no dominant-negative or gain-of-function germline
    mechanism has been demonstrated.

    Two scope cautions. First, PHF8 must not be confused with PHF6 (the
    Borjeson-Forssman-Lehmann gene) or PHF21A - all are PHD-finger chromatin
    genes with distinct diseases. Second, there is a large somatic-oncology PHF8
    literature (breast, hepatocellular and gastric carcinoma) in which PHF8 acts
    as an overexpressed tumour promoter; that is a different disease context and
    contributes nothing to this germline neurodevelopmental entity.
  evidence:
  - reference: PMID:16199551
    reference_title: Mutations in PHF8 are associated with X linked mental retardation
      and cleft lip/cleft palate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating mutations were found in the PHF8 gene (encoding the PHD finger protein 8) in two unrelated families with X linked mental retardation (XLMR) associated with cleft lip/palate (MIM 300263)."
    explanation: Gene-discovery paper establishing the PHF8 gene-disease
      relationship and binding it to OMIM 300263.
  - reference: PMID:16199551
    reference_title: Mutations in PHF8 are associated with X linked mental retardation
      and cleft lip/cleft palate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression studies showed that this gene is ubiquitously transcribed, with strong expression of the mouse orthologue Phf8 in embryonic and adult brain structures."
    explanation: Sources the expression statement in the notes.
  - reference: PMID:35469323
    reference_title: Variants in PHF8 cause a spectrum of X-linked neurodevelopmental
      disorders and facial dysmorphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHF8-XLID is an under-characterized disorder with only five previous reports describing different PHF8 predicted loss-of-function variants in eight individuals."
    explanation: Quantifies how small the pre-2022 allele series was, which is the
      basis for the "small reported spectrum" claim.
  - reference: PMID:35469323
    reference_title: Variants in PHF8 cause a spectrum of X-linked neurodevelopmental
      disorders and facial dysmorphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report we present 16 additional individuals with PHF8-XLID from 11 different families of diverse ancestry."
    explanation: Establishes the size and family structure of the largest published
      cohort, which is the denominator for the frequency derivations.
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,
      encodes for an Nepsilon-dimethyl lysine demethylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations of human PHF8 cluster within its JmjC encoding exons and are linked to mental retardation (MR) and a cleft lip/palate phenotype."
    explanation: Sources the statement that clinical alleles cluster in the
      JmjC-encoding exons.
variants:
- name: PHF8 p.Phe279Ser
  description: >
    The c.836C>T (p.F279S) missense allele, identified in a Finnish family with
    multiply affected males. It is the reference functional allele for this
    disorder: it substitutes a conserved hydrophobic residue in the JmjC domain
    and is catalytically dead in assays against both peptide and intact-histone
    substrates, in two independent laboratories, while leaving the rest of the
    protein intact. It is also the allele used to show that catalytic activity is
    required for PHF8 to drive neuronal differentiation.
  gene:
    preferred_term: PHF8
    term:
      id: hgnc:20672
      label: PHF8
  type: MISSENSE
  evidence:
  - reference: PMID:17661819

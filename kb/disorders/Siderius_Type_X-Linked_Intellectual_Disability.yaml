notes: >
  GeneReviews baseline: searched PubMed on 2026-08-01 with
  `GeneReviews[All Fields] AND (PHF8 OR Siderius)` (0 hits) and
  `Siderius[TI] GeneReviews[TI]` (0 hits). No GeneReviews chapter exists for
  Siderius-Hamel syndrome / PHF8-related X-linked intellectual disability. In the
  absence of a GeneReviews baseline the phenotype list here is anchored on the
  single largest systematic series (PMID:35469323, 16 newly reported individuals
  from 11 families plus review of the 8 previously reported) together with the
  four founding clinical reports (PMID:10398231, PMID:16199551, PMID:17594395,
  PMID:17661819).

  Frequency derivations, all from the 16-individual cohort in PMID:35469323
  unless stated: developmental delay "All affected individuals" = 16/16 (100%,
  VERY_FREQUENT); intellectual disability "all but two had borderline to severe
  ID" = 14/16 (87.5%, VERY_FREQUENT); orofacial clefting "seen in three
  individuals from our cohort" = 3/16 (18.8%, OCCASIONAL); autism spectrum
  disorder and ADHD "frequently observed" (qualitative, mapped to FREQUENT);
  the individual craniofacial findings are reported collectively as occurring
  "in some affected individuals", which maps to OCCASIONAL and is applied to the
  group rather than to each dysmorphism separately. Where the source is
  qualitative and does not license even a coarse band, `frequency:` is omitted.

  Known gap in phenotype coverage. The deep-research report surfaced a
  per-feature frequency table from the PMC full text of PMID:35469323 -
  retrognathia 10/16, infantile feeding difficulty 10/16, high-arched palate
  6/16, seizures 5/16, low-set ears 5/16, gross motor delay 12/16, fine motor
  delay 14/16, speech delay 16/16, and neuroimaging findings including
  polymicrogyria in one twin pair. Only the abstract of that paper is cached by
  `just fetch-reference`, so none of those counts can be verified as a byte-exact
  snippet and none of those phenotypes is curated here. This is a deliberate
  omission, not an oversight: a smaller correct entry is preferred. Anyone
  extending this entry should obtain the full text and add them with verified
  quotes.

  Structured-source citations (ORPHA:85287 for the Orphanet prevalence class,
  and any ClinGen gene-disease validity or dosage record for PHF8) are NOT
  included: neither is present in `references_cache/`, and generating them would
  require bumping a pinned data MANIFEST, which is out of scope for a curation PR
  and is blocked pending issue #7622. No population prevalence estimate is
  recorded for the same reason - the literature reports only case counts, and no
  numerator/denominator that would license a rate is available.

  Deliberately excluded: the extensive somatic-cancer PHF8 literature (breast,
  hepatocellular, triple-negative breast, gastric), which concerns a different
  disease context; and the PHF8 depression/anxiety-resistance mouse work
  (PMID:28485378), which reports a behavioural phenotype not documented in
  patients with this syndrome.
pathophysiology:
- name: Pathogenic PHF8 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >
    The shared upstream lesion is a hemizygous loss-of-function variant in PHF8
    at Xp11.22. The reported allele spectrum is small but mechanistically
    coherent: nonsense and frameshift alleles that truncate the protein before or
    within the JmjC domain and remove the nuclear localisation signals, splice
    alleles, missense alleles clustered in the JmjC-encoding exons, and whole-gene
    microdeletions. All reported mechanisms converge on loss of function; no
    dominant-negative or gain-of-function mechanism has been demonstrated for the
    germline neurodevelopmental phenotype. Two consequences fan out from this node
    in parallel rather than in series - loss of JmjC catalysis, and, for the
    truncating alleles, loss of the PHD-finger/nuclear-targeting module - because
    the F279S missense allele abolishes catalysis while leaving the N-terminal PHD
    finger intact, and the K177X nonsense allele removes both.
  gene:
    preferred_term: PHF8
    term:
      id: hgnc:20672
      label: PHF8
  evidence:
  - reference: PMID:16199551
    reference_title: Mutations in PHF8 are associated with X linked mental retardation
      and cleft lip/cleft palate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating mutations were found in the PHF8 gene (encoding the PHD finger protein 8) in two unrelated families with X linked mental retardation (XLMR) associated with cleft lip/palate (MIM 300263)."
    explanation: >
      The gene-discovery paper, and the strongest available identity anchor - it
      binds PHF8 directly to MIM 300263, which is the OMIM xref of MONDO:0010286.
  - reference: PMID:35469323
    reference_title: Variants in PHF8 cause a spectrum of X-linked neurodevelopmental
      disorders and facial dysmorphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function variants in PHD Finger Protein 8 (PHF8) cause Siderius X-linked intellectual disability (ID) syndrome, hereafter called PHF8-XLID."
    explanation: States the loss-of-function mechanism and names the entity being
      curated here.
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,
      encodes for an Nepsilon-dimethyl lysine demethylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Clinically observed mutations to the PHF8 gene cluster in exons encoding for the double stranded beta-helix fold and will therefore disrupt catalytic activity."
    explanation: >
      Establishes that the clinical allele spectrum is concentrated in the
      catalytic fold, which is why the catalytic arm is the dominant downstream
      consequence of this node.
  downstream:
  - target: Loss of JmjC-Domain Histone Demethylase Activity
  - target: Loss of PHD-Finger H3K4me3 Reading and Nuclear Targeting
- name: Loss of JmjC-Domain Histone Demethylase Activity
  biological_scale: MOLECULAR
  description: >
    PHF8 is an Fe(II)- and 2-oxoglutarate-dependent oxygenase of the
    double-stranded beta-helix class. Its JmjC domain removes mono- and dimethyl marks
    from lysine but not trimethyl marks. Patient alleles clustered in the
    JmjC-encoding exons abolish this catalysis: the F279S missense variant, which
    substitutes a residue in a conserved hydrophobic region of the JmjC domain, is
    catalytically inactive against both peptide and intact-histone substrates,
    and truncating alleles remove the domain outright. Because the reaction
    requires molecular oxygen, PHF8 activity is oxygen-dependent, a property that
    has been proposed - though not demonstrated in patients - to link the
    catalytic arm to the known association between maternal hypoxia and cleft
    lip in mouse studies.
  molecular_functions:
  - preferred_term: histone H4K20 demethylase activity
    term:
      id: GO:0035575
      label: histone H4K20 demethylase activity
    modifier: DECREASED
  - preferred_term: histone H3K9 demethylase activity
    term:
      id: GO:0032454
      label: histone H3K9 demethylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,
      encodes for an Nepsilon-dimethyl lysine demethylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We report that recombinant PHF8 is an Fe(II) and 2-oxoglutarate-dependent N(epsilon)-methyl lysine demethylase, which acts on histone substrates."
    explanation: Defines the enzyme class and cofactor dependence of the catalytic
      arm.
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,
      encodes for an Nepsilon-dimethyl lysine demethylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutant encodes a F279S variant of PHF8 that modifies a conserved hydrophobic region; assays with both peptides and intact histones reveal this variant to be catalytically inactive."
    explanation: Direct demonstration that a patient missense allele abolishes
      catalysis.
  - reference: PMID:20101266

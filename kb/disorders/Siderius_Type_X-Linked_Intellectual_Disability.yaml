  - reference: PMID:20421419
    reference_title: PHF8 targets histone methylation and RNA polymerase II to activate
      transcription.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that PHF8 is a histone demethylase that removes repressive histone H3 dimethyl lysine 9 marks."
    explanation: Third independent demonstration of the H3K9me2 eraser activity.
  downstream:
  - target: Failure of RNA Polymerase II-Coupled Transcriptional Coactivation
- name: Failure of RNA Polymerase II-Coupled Transcriptional Coactivation
  biological_scale: MOLECULAR
  description: >
    The convergence point of the chromatin arms. PHF8 occupies the transcription
    start sites of thousands of active or poised genes, mirroring the distribution
    of RNA polymerase II and H3K4me3-marked nucleosomes, and contacts the RNAPII
    C-terminal domain directly; it therefore acts as a promoter-resident
    transcriptional coactivator whose activation function depends on PHD binding
    to H3K4me3. Patient alleles are defective in coactivation as well as in
    demethylation. PHF8 additionally partners with the XLID transcription factor
    ZNF711 at a shared target set, and co-occupies promoters with the REST/NRSF
    repressor, so the net transcriptional output at any locus can be activating or
    repressive; the dominant documented effect is loss of activation. Downstream
    of this node the disease diversifies into distinct neural and craniofacial
    cell-type programmes.
  molecular_functions:
  - preferred_term: transcription coactivator activity
    term:
      id: GO:0003713
      label: transcription coactivator activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: Regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  evidence:
  - reference: PMID:20421419
    reference_title: PHF8 targets histone methylation and RNA polymerase II to activate
      transcription.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Chromatin immunoprecipitation followed by high-throughput sequencing indicated that PHF8 is enriched at the transcription start sites of many active or poised genes, mirroring the presence of RNA polymerase II (RNAPII) and of H3K4me3-bearing nucleosomes."
    explanation: Places PHF8 physically at active promoters together with RNAPII.
  - reference: PMID:20421419
    reference_title: PHF8 targets histone methylation and RNA polymerase II to activate

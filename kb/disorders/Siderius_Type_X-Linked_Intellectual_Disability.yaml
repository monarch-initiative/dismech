- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate has been published for this
    disorder, so only a literature case count is recorded. Derivation: 8
    individuals across five reports before 2022, plus 16 individuals from 11
    families in the 2022 series, giving 24 individuals with a PHF8

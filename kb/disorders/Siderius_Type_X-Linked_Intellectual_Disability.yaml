description: >
  Siderius type syndromic X-linked intellectual disability (MRXSSD; OMIM 300263;
  ORPHA:85287) is a rare X-linked chromatinopathy caused by loss-of-function
  variants in PHF8 at Xp11.22. PHF8 encodes a PHD-finger plus JmjC-domain,
  Fe(II)/2-oxoglutarate-dependent histone demethylase that erases the repressive
  marks H4K20me1 and H3K9me1/me2 at promoters to which it is recruited by
  PHD-finger recognition of H3K4me3 and by direct contact with RNA polymerase II.
  Hemizygous males present with developmental delay and borderline to severe
  intellectual disability, mild facial dysmorphism, and — in a minority of
  contemporary cases — orofacial clefting, the feature on which the syndrome was
  originally delineated. Autism spectrum disorder and attention deficit
  hyperactivity disorder were added to the phenotype by the largest published
  series.

  The entity has a two-phase literature. The founding descriptions
  (Siderius 1999; Laumonnier 2005; Abidi 2007; Koivisto 2007) were ascertained
  through cleft clinics and multiplex X-linked pedigrees, so cleft lip/palate
  looked obligate. The 2022 multicentre series of 16 additional individuals,
  ascertained largely by exome sequencing for developmental delay, found
  orofacial clefting in only 3 of 16 and explicitly reported that the feature is
  less common than previously reported. Both ascertainment frames are curated
  here, with the frequency bands taken from the contemporary series.

  IMPORTANT SCOPE NOTE - this entity is defined by PHF8. It must not be conflated
  with (a) PHF6-related Borjeson-Forssman-Lehmann syndrome or PHF21A-related
  disorders, which are different PHD-finger genes with different diseases;
  (b) the other eponymous X-linked intellectual disability types, in particular
  Claes-Jensen type (KDM5C) and Lubs type (MECP2 duplication), which are
  separate MONDO entities with separate genes - note that the PHF8 and KDM5C
  literatures are genuinely entangled because PHF8, ZNF711 and KDM5C/JARID1C sit
  in one transcriptional module, but the diseases are distinct; or (c) the large
  somatic-cancer PHF8 literature, which is a different disease context entirely.

mechanistic_hypotheses:
- hypothesis_group_id: mtor_targeting
  hypothesis_label: mTOR pathway suppression as a disease-modifying strategy
  status: EMERGING
  description: >
    Because the cognitive and synaptic deficits of the Phf8 knockout mouse are
    driven by RSK1-dependent mTOR hyperactivation and are reversed by rapamycin,
    mTOR inhibition has been proposed as a rational therapeutic target for
    PHF8-related intellectual disability. The hypothesis rests on a single mouse
    study. It has not been tested in any human with a PHF8 variant, the
    therapeutic window in a chronic paediatric neurodevelopmental indication is
    unknown, and rapamycin's immunosuppressive and metabolic toxicity is
    substantial. It is recorded here as an emerging research direction, not as a
    treatment.
  evidence:
  - reference: PMID:29317619
    reference_title: Phf8 histone demethylase deficiency causes cognitive impairments
      through the mTOR pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "and provides a potential therapeutic drug target to treat XLID"
    explanation: The authors' own framing of the finding as a drug-target hypothesis.
- hypothesis_group_id: oxygen_sensing_clefting
  hypothesis_label: Oxygen-dependence of PHF8 catalysis as a link to hypoxia-associated
    clefting
  status: EMERGING
  description: >
    PHF8 is a 2-oxoglutarate/Fe(II) oxygenase and therefore consumes molecular
    oxygen. This has prompted the suggestion that partial loss of PHF8 activity
    and gestational hypoxia converge on the same craniofacial endpoint, which
    would predict that maternal hypoxic exposures modify cleft risk in carriers.
    No human data address this. It is recorded because it is the only proposed
    gene-environment interaction for this disorder and because it would be
    testable.
  evidence:
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,
      encodes for an Nepsilon-dimethyl lysine demethylase.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The dependence of PHF8 activity on oxygen availability is interesting because the occurrence of fetal cleft lip has been demonstrated to increase with maternal hypoxia in mouse studies."
    explanation: >
      The originating statement of the hypothesis. Marked PARTIAL because the
      paper juxtaposes a biochemical property with a separate mouse observation
      rather than demonstrating the interaction.

diagnosis:
- name: Exome or Genome Sequencing
  description: >
    There are no formal clinical diagnostic criteria and the gestalt is too mild
    to be reliably recognised prospectively; molecular testing is the diagnosis.
    Exome or genome sequencing, or a targeted X-linked intellectual disability
    gene panel, is the appropriate route for a male with unexplained developmental
    delay, with or without orofacial clefting. The ascertainment shift matters
    clinically: the largest series was assembled largely through sequencing of
    individuals with developmental delay rather than through cleft clinics, so
    PHF8 should not be reserved for patients who have a cleft. Chromosomal
    microarray covers the Xp11.22 microdeletion fraction, which sequencing may
    miss.
  evidence:
  - reference: PMID:31906484
    reference_title: Targeted Next-Generation Sequencing in Patients with Suggestive
      X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven families could be re-contacted and variant segregation analysis of the respective eight candidate variants was performed: HUWE1, IQSEC2, MAOA, MED12, PHF8, SLC6A8, SLC9A6, and SYN1."
    explanation: Demonstrates PHF8 being returned as a candidate by a targeted
      X-linked intellectual disability sequencing panel in real diagnostic practice.
  - reference: PMID:31906484
    reference_title: Targeted Next-Generation Sequencing in Patients with Suggestive
      X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results show the utility of targeted next-generation sequencing in unravelling the genetic origin of XLID, especially in retrospective cases."
    explanation: Supports targeted sequencing as a diagnostic strategy in this
      disease class.
  - reference: PMID:35469323
    reference_title: Variants in PHF8 cause a spectrum of X-linked neurodevelopmental
      disorders and facial dysmorphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also present five individuals from four different families who have ID and a variant of unknown significance in PHF8 with no other explanatory variant in another gene."
    explanation: >
      Documents the interpretation problem that follows from sequencing-first
      ascertainment - a substantial fraction of PHF8 findings in individuals with
      intellectual disability remain variants of uncertain significance.
- name: Targeted PHF8 Sequencing in Cleft Plus Intellectual Disability
  description: >
    The historical diagnostic route, and still reasonable when the combination is
    present. In a nationwide Finnish cleft cohort, restricting PHF8 sequencing to
    the 18 patients who had cleft lip/palate together with intellectual disability
    of unknown cause yielded one causative family. That yield illustrates both
    that the combination enriches strongly for PHF8 and that PHF8 accounts for
    only a small fraction of syndromic clefting.
  evidence:
  - reference: PMID:17661819
    reference_title: Screening of mutations in the PHF8 gene and identification of a
      novel mutation in a Finnish family with XLMR and cleft lip/cleft palate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From this nationwide material, 18 patients including one family with two male patients with cleft lip/cleft palate and unknown cause of mental retardation (MR) were sequenced for the coding regions and splice sites of the PHF8 gene."
    explanation: Describes the phenotype-directed screening strategy and its
      denominator.
  - reference: PMID:17661819
    reference_title: Screening of mutations in the PHF8 gene and identification of a
      novel mutation in a Finnish family with XLMR and cleft lip/cleft palate.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated the prevalence of mutations in the PHD finger protein 8 (PHF8) gene in X-linked mental retardation (XLMR) and facial cleft starting from the original cohort of 7712 patients operated on since 1 January 1950 for cleft lip/cleft palate in the Cleft Centre at the Helsinki University Hospital."
    explanation: >
      Establishes the full cleft-cohort denominator (7712) from which the 18
      sequenced patients were selected, which is why no population frequency is
      derived from this study.
differential_diagnoses:
- name: Claes-Jensen type syndromic X-linked intellectual disability (KDM5C)
  disease_term:
    preferred_term: syndromic X-linked intellectual disability Claes-Jensen type
    term:
      id: MONDO:0010355
      label: syndromic X-linked intellectual disability Claes-Jensen type
  description: >
    The most important named-entity distinction for this entry, because the two
    literatures are genuinely entangled rather than merely similarly named. Both
    are eponymous X-linked syndromic intellectual disability entities caused by
    JmjC-domain histone demethylases, both were delineated by the same era of
    X-chromosome mutation screening, and PHF8 and KDM5C/JARID1C are functionally
    linked in one transcriptional module through ZNF711 - so KDM5C is cited
    inside PHF8 mechanism papers and vice versa. They are nonetheless distinct
    MONDO entities with distinct genes, distinct OMIM numbers and distinct
    clinical profiles: Claes-Jensen is a KDM5C H3K4me3 eraser disorder with short
    stature, spasticity, hyperreflexia and seizures and is one of the commoner
    causes of X-linked intellectual disability, whereas Siderius type is a PHF8
    H4K20me1/H3K9me1-2 eraser disorder with orofacial clefting and a milder,
    much rarer picture. Evidence must never be pooled across the two.
  evidence:
  - reference: PMID:20346720
    reference_title: A functional link between the histone demethylase PHF8 and the
      transcription factor ZNF711 in X-linked mental retardation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, our results functionally link the XLMR gene PHF8 to two other XLMR genes, ZNF711 and JARID1C, indicating that MR genes may be functionally linked in pathways, causing the complex phenotypes observed in patients developing MR."
    explanation: >
      Documents exactly the functional entanglement that makes this differential
      necessary: PHF8 and JARID1C/KDM5C share a pathway but cause separate
      diseases.
  - reference: PMID:31691806
    reference_title: Histone demethylase KDM5C is a SAHA-sensitive central hub at the
      crossroads of transcriptional axes involved in multiple neurodevelopmental
      disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, mutations in all four genes (KDM5C, ARX, ZNF711 and PHF8) are associated with X-linked NDDs comprising intellectual disability as a core feature."
    explanation: >
      States explicitly that PHF8 and KDM5C are separate genes causing separate
      X-linked neurodevelopmental disorders while sharing one regulatory module -
      the precise reason the two literatures must be kept apart during curation.
- name: Nonsyndromic cleft lip with or without cleft palate
  disease_term:
    preferred_term: orofacial cleft
    term:
      id: MONDO:0000358
      label: orofacial cleft
  description: >
    Orofacial clefting is one of the commonest birth defects, so the great
    majority of children presenting with cleft lip/palate do not have this
    syndrome. What should raise suspicion of PHF8 is the combination of clefting
    with intellectual disability in a male with an X-linked family history - the
    Finnish screen found one PHF8 family among 18 such selected patients drawn
    from a nationwide cleft cohort of 7712.
  evidence:
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,
      encodes for an Nepsilon-dimethyl lysine demethylase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of cleft lip with or without cleft palate is amongst the most common of all birth defects, averaging at 10.5 per 10,000 live births in the United States"
    explanation: Quantifies the background clefting rate against which this rare
      syndrome must be distinguished.
- name: Xp11.22 contiguous gene deletion syndrome
  description: >
    Deletions at Xp11.22 can remove PHF8 together with neighbouring genes
    including FAM120C and part of WNK3. The reported brothers with such a
    microdeletion had the Siderius features plus autism spectrum disorder,
    hypertelorism and broad halluces, so a deletion-mediated presentation may be
    broader than the single-gene phenotype and the extra features should not be
    attributed to PHF8. Chromosomal microarray, not sequencing, is the test that
    resolves this.
  evidence:
  - reference: PMID:19843542
    reference_title: PHF8, a gene associated with cleft lip/palate and mental retardation,
      encodes for an Nepsilon-dimethyl lysine demethylase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, a microdeletion encompassing all of the PHF8 and FAM120C genes and parts of WNK3 was reported in two brothers with autism spectrum disorders, causing hypertelorism and broad halluces in addition to the Siderius XLMR features"
    explanation: Documents the contiguous-gene deletion presentation and the extra
      features it carries.
  - reference: PMID:18498374
    reference_title: Autism-associated familial microdeletion of Xp11.22.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings show that in addition to point mutations, a complete deletion of the PHF8 gene is associated with the X-linked mental retardation Siderius-Hamel syndrome (OMIM 300263)"
    explanation: >
      The primary report of the deletion, and a second independent identity anchor
      binding PHF8 deletion to OMIM 300263, the OMIM xref of MONDO:0010286.
  - reference: PMID:18498374
    reference_title: Autism-associated familial microdeletion of Xp11.22.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "further suggest that the larger size of the Xp11.22 deletion including genes FAM120C and WNK3 may be involved in the pathogenesis of autism"
    explanation: >
      The authors themselves attribute the autism component to the extra deleted
      genes rather than to PHF8, which is why deletion cases must not be pooled
      with single-gene cases when curating the PHF8 phenotype.
treatments:
- name: Surgical Repair of Orofacial Cleft
  description: >
    Where a cleft is present, staged surgical repair is the standard of care and
    is the single most consequential intervention for these patients. It is
    generic cleft management rather than anything specific to PHF8, and is
    included because clefting is the defining malformation of the syndrome and
    because the founding Finnish cohort was assembled from patients operated on
    for cleft lip/palate. No PHF8-specific surgical outcome data exist.
  treatment_term:
    preferred_term: reconstructive surgery for orofacial cleft
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:17661819
    reference_title: Screening of mutations in the PHF8 gene and identification of a
      novel mutation in a Finnish family with XLMR and cleft lip/cleft palate.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the original cohort of 7712 patients operated on since 1 January 1950 for cleft lip/cleft palate in the Cleft Centre at the Helsinki University Hospital"
    explanation: >
      Marked PARTIAL: this establishes that affected individuals are managed
      surgically in a cleft centre, but it is not an outcome study and no
      PHF8-specific surgical evidence exists.
- name: Developmental and Educational Intervention
  description: >
    Management of the neurodevelopmental phenotype is supportive and identical to
    that for other causes of developmental delay: early intervention, special
    education, and speech and language therapy directed at the communication
    delay. There is no disease-specific evidence base; this is recorded because
    it is the actual standard of care and because developmental delay was present
    in every individual in the largest series.
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:35469323
    reference_title: Variants in PHF8 cause a spectrum of X-linked neurodevelopmental
      disorders and facial dysmorphology.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals exhibited developmental delay and all but two had borderline to severe ID."
    explanation: >
      Marked PARTIAL: this establishes the universal need for developmental
      intervention but is not evidence for the efficacy of any specific therapy in
      this disorder.
- name: Genetic Counselling
  description: >
    X-linked recessive counselling applies: carrier mothers have a 50% risk of
    transmitting the allele to each son, affected males transmit the allele to all
    daughters and no sons, and maternal carrier testing should follow a diagnosis
    in a proband. The founding pedigrees were multiplex X-linked families
    identified through linkage, which is the empirical basis for the counselling
    model.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:10398231
    reference_title: X-linked mental retardation associated with cleft lip/palate maps
      to Xp11.3-q21.3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A family is described in which X-linked mild to borderline mental retardation (MR) is associated with cleft lip/palate."
    explanation: Establishes the X-linked familial transmission pattern that the
      counselling model rests on.
animal_models:
- species: Mus musculus
  genotype: Phf8 knockout (constitutive null; Chen et al. 2018 line)
  category: KNOCKOUT
  description: >
    The most informative model for the cognitive phenotype, but see the second
    mouse entry below for a direct contradiction. Phf8-null mice in this line
    have impaired learning and memory and impaired hippocampal long-term
    potentiation with no gross morphological brain defect, which parallels the
    absence of a consistent structural brain abnormality in patients. The
    deficits are driven by RSK1 derepression and mTOR hyperactivation and are
    rescued by rapamycin. Two limitations: the model does not reproduce the
    craniofacial arm of the human syndrome, and an independently generated
    knockout line found no cognitive impairment at all.
  evidence:
  - reference: PMID:29317619
    reference_title: Phf8 histone demethylase deficiency causes cognitive impairments
      through the mTOR pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we report that Phf8 knockout mice displayed impaired learning and memory, and impaired hippocampal long-term potentiation (LTP) without gross morphological defects."
    explanation: Describes the model's core neurobehavioural phenotype.
  - reference: PMID:41714361
    reference_title: Epigenetic regulation of serine biosynthesis by PHF8 during neurogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo, PHF8 deficiency in mouse embryos halts neurogenesis, progenitor expansion, and neuron generation in the developing brain."
    explanation: A second, developmental-stage mouse phenotype from an independent
      group.
- species: Mus musculus
  genotype: Phf8 knockout (independently generated constitutive null; Walsh et al.
    2017 line)
  category: KNOCKOUT
  description: >
    An independently generated Phf8 knockout allele that directly contradicts the
    other line on the phenotype that matters most: these mice have neither
    obvious developmental defects nor signs of cognitive impairment. What they do
    show is resilience to stress-induced anxiety- and depression-like behaviour,
    attributable to misregulated serotonin signalling in prefrontal cortex, with
    Htr1a and Htr2a as direct PHF8 targets. Recorded here because omitting it
    would misrepresent the strength of the mouse evidence, and because no
    counterpart of the stress-resilience phenotype has been looked for in
    patients.
  evidence:
  - reference: PMID:28485378
    reference_title: Phf8 loss confers resistance to depression-like and anxiety-like
      behaviors in mice.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Phf8 deficient mice neither display obvious developmental defects nor signs of cognitive impairment."
    explanation: >
      Marked REFUTE against the claim that a Phf8 knockout mouse models the human
      cognitive phenotype - this line did not reproduce it, which is the single
      most important caveat on the mouse literature for this disorder.
  - reference: PMID:28485378
    reference_title: Phf8 loss confers resistance to depression-like and anxiety-like
      behaviors in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, we report a striking resiliency to stress-induced anxiety- and depression-like behaviour on loss of Phf8."
    explanation: The phenotype this line does show, which has no described human
      counterpart.
  - reference: PMID:28485378
    reference_title: Phf8 loss confers resistance to depression-like and anxiety-like
      behaviors in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further observe misregulation of serotonin signalling within the prefrontal cortex of Phf8 deficient mice and identify the serotonin receptors Htr1a and Htr2a as direct targets of PHF8."
    explanation: Supplies the mechanism of the model-only behavioural phenotype.
- species: Danio rerio
  genotype: phf8 morpholino knockdown
  category: KNOCKDOWN
  description: >
    The model that captures the craniofacial arm the mouse misses. Loss of phf8
    in zebrafish impairs brain cell survival and jaw development, acting in part
    through direct regulation of the homeodomain transcription factor MSX1/MSXB.
    It remains the principal in vivo evidence connecting PHF8 catalysis to
    craniofacial morphogenesis.
  evidence:
  - reference: PMID:20622853
    reference_title: Histone H4K20/H3K9 demethylase PHF8 regulates zebrafish brain and
      craniofacial development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PHF8 regulates cell survival in the zebrafish brain and jaw development, thus providing a potentially relevant biological context for understanding the clinical symptoms associated with PHF8 patients."
    explanation: Establishes the craniofacial and neuronal-survival phenotypes of the
      model.
  - reference: PMID:20622853
    reference_title: Histone H4K20/H3K9 demethylase PHF8 regulates zebrafish brain and
      craniofacial development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings indicate that an imbalance of histone methylation dynamics has a critical role in XLMR."
    explanation: The authors' summary conclusion linking the model back to the human
      disease class.
- species: Caenorhabditis elegans
  genotype: F29B9.2 (jmjd-1.2) loss-of-function mutant
  category: MUTANT
  description: >
    The invertebrate orthologue demonstrates deep conservation of both the
    enzymatic activity and the neuronal requirement: F29B9.2 catalyses H3K9me2/me1
    demethylation, is highly expressed in neurons, and mutant animals have
    impaired locomotion. Useful for establishing conservation, but the behavioural
    readout is too distant from human cognition to model the clinical phenotype.
  evidence:
  - reference: PMID:20346720
    reference_title: A functional link between the histone demethylase PHF8 and the
      transcription factor ZNF711 in X-linked mental retardation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Of interest, the C. elegans PHF8 homolog is highly expressed in neurons, and mutant animals show impaired locomotion."
    explanation: Documents the conserved neuronal expression and the mutant
      behavioural phenotype.
discussions:
- discussion_id: phf8_clefting_ascertainment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    What is the true frequency of orofacial clefting in PHF8-related intellectual
    disability once ascertainment bias is removed?
  attaches_to:
  - pathophysiology#Orofacial Clefting and Craniofacial Dysmorphology
  rationale: >
    Every published frequency for clefting in this disorder is confounded by how
    the cases were found. The founding families came from cleft clinics and
    multiplex X-linked pedigrees, so clefting appeared obligate; the 2022 series
    came largely from exome sequencing for developmental delay and found clefting
    in 3 of 16. Neither denominator is unbiased. Because clefting is the feature
    that gives the syndrome its clinical identity, and because its presence or
    absence currently drives whether PHF8 is considered at all, this is the single
    most consequential unresolved number in the entry.
  proposed_experiments:
  - experiment_id: unselected_dd_cohort_cleft_frequency
    name: Cleft frequency in PHF8 carriers from an unselected developmental-delay
      cohort
    description: >
      Ascertain PHF8 loss-of-function carriers from a large-scale sequencing
      cohort recruited on developmental delay alone, with no craniofacial
      inclusion criterion, then phenotype for orofacial clefting prospectively.
    decision_criterion: >
      The cleft frequency in the unselected cohort differs significantly from
      both the founding-cohort estimate and the 3-of-16 figure.
    supporting_outcome:
    - Clefting frequency in PHF8-related intellectual disability is
      ascertainment-determined rather than a fixed property of the disorder.
    refuting_outcome:
    - Clefting is an intrinsically variable feature whose frequency is stable
      across ascertainment frames.
  - experiment_id: biobank_reverse_phenotyping
    name: Reverse phenotyping of PHF8 variant carriers in population biobanks
    description: >
      Identify PHF8 loss-of-function carriers in population biobanks with no
      neurodevelopmental ascertainment at all, and retrieve their craniofacial
      and cognitive phenotypes from linked health records.
    decision_criterion: >
      A substantial fraction of biobank PHF8 carriers have neither clefting nor
      recorded intellectual disability.
    supporting_outcome:
    - The published phenotype is the severe tail of a broader and milder
      distribution.
- discussion_id: phf8_mtor_rapamycin_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Does the rapamycin rescue of the Phf8 knockout mouse predict anything about
    human PHF8-related intellectual disability, given that a second independent
    knockout line showed no cognitive impairment at all?
  attaches_to:
  - pathophysiology#RSK1 Derepression and mTOR Pathway Hyperactivation
  rationale: >
    The mouse result is striking - mTOR hyperactivation is mechanistically
    specified down to RSK1, and rapamycin restores both LTP and cognition. But
    the rescue rests on a single knockout line, and a separately generated Phf8
    knockout allele reported neither developmental defects nor cognitive
    impairment, so the very phenotype the rescue corrects was not reproducible
    between laboratories. Neither line reproduces the craniofacial phenotype, and
    no measurement of mTOR pathway activity has been reported in any human tissue
    from a person with a PHF8 variant. Whether the human disorder is an
    mTOR-opathy at all is therefore untested, and treating the mouse rescue as a
    therapeutic lead would be premature in a chronic paediatric indication where
    rapamycin carries real toxicity.
  proposed_experiments:
  - experiment_id: patient_ipsc_mtor_activity
    name: mTOR pathway activity in patient-derived PHF8-mutant neurons
    description: >
      Measure S6K and S6 phosphorylation and RSK1 protein levels in iPSC-derived
      cortical neurons from individuals carrying PHF8 loss-of-function alleles,
      against isogenic corrected controls.
    decision_criterion: >
      PHF8-mutant human neurons show elevated mTOR pathway activity relative to
      isogenic controls.
    supporting_outcome:
    - The mouse mTOR mechanism operates in human PHF8-deficient neurons.
    refuting_outcome:
    - The mTOR arm is a mouse-specific consequence of Phf8 loss.
  - experiment_id: f279s_rsk1_derepression
    name: RSK1 derepression by the catalytic-dead F279S allele
    description: >
      Test whether the F279S catalytic-dead missense allele, and not only a
      complete null, derepresses RSK1, since several reported human alleles
      retain protein.
    decision_criterion: >
      F279S produces RSK1 derepression comparable to the null allele.
    supporting_outcome:
    - The mTOR arm is engaged by catalytic loss alone and therefore applies to
      the missense end of the human allele spectrum.
  - experiment_id: phf8_ko_line_comparison
    name: Side-by-side comparison of the two Phf8 knockout alleles
    description: >
      Backcross both published Phf8 knockout alleles onto a common genetic
      background and run identical learning, memory and hippocampal LTP assays
      in the same laboratory.
    decision_criterion: >
      The cognitive phenotype tracks the allele rather than the background.
    supporting_outcome:
    - The published discordance is allele-driven and one allele is not a true
      null.
    refuting_outcome:
    - The discordance is background- or protocol-driven, which would weaken both
      reports equally.
- discussion_id: phf8_mouse_no_clefting
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Why do Phf8-null mice fail to develop orofacial clefting when human PHF8
    loss-of-function causes cleft lip/palate and zebrafish phf8 knockdown causes
    jaw malformation?
  attaches_to:
  - pathophysiology#Impaired Neural Crest and Craniofacial Midline Development
  rationale: >
    The craniofacial arm of this entry rests almost entirely on zebrafish jaw and
    msxb data, because both published Phf8 knockout mouse lines are reported
    without craniofacial malformation - one explicitly as having no obvious
    developmental defects, the other as having no gross morphological defects.
    That is a species mismatch at exactly the point where the human phenotype is
    most distinctive. Paralogue compensation by PHF2/KDM7A in mouse, or a species
    difference in how much lip and palate fusion depends on MSX1, would both
    explain it, and distinguishing them would materially change how the
    craniofacial mechanism should be modelled.
  proposed_experiments:
  - experiment_id: phf8_phf2_double_mutant
    name: Phf8;Phf2 double-mutant mouse craniofacial phenotyping
    description: >
      Generate mice null for both Phf8 and its closest paralogue Phf2 and assess
      lip and palate fusion, to test whether paralogue compensation masks a
      craniofacial requirement in mouse.
    decision_criterion: >
      Clefting emerges in double mutants but not in either single mutant.
    supporting_outcome:
    - Paralogue compensation explains the absence of clefting in Phf8-null mice.
  - experiment_id: msx1_facial_primordia_assay
    name: Msx1 expression in Phf8-null mouse facial primordia
    description: >
      Assay Msx1 transcript and protein in the facial primordia of Phf8-null
      mouse embryos across the lip and palate fusion window.
    decision_criterion: >
      Msx1 expression is reduced in Phf8-null primordia.
    supporting_outcome:
    - The zebrafish msxb mechanism is conserved in mammals even where the
      morphological endpoint is not.
    refuting_outcome:
    - The MSX1 link is fish-specific and the human craniofacial mechanism is
      unexplained.
- discussion_id: phf8_female_carrier_status
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Are heterozygous female carriers of pathogenic PHF8 variants affected?
  attaches_to:
  - pathophysiology#Pathogenic PHF8 Loss-of-Function Variant
  rationale: >
    The disorder is annotated X-linked recessive and every reported affected
    individual is male, but for several other X-linked chromatinopathies - KDM5C
    and USP9X among them - the recessive label has proved empirically wrong for
    females once carriers were systematically assessed. The only X-inactivation
    data in this disorder come from a single unaffected deletion-carrier mother
    with complete skewing. No systematic study of PHF8 carrier females has been
    published, so the absence of reported affected females may reflect absence of
    looking rather than absence of effect. This matters directly for genetic
    counselling.
  proposed_experiments:
  - experiment_id: carrier_mother_cognitive_phenotyping
    name: Formal cognitive phenotyping of obligate PHF8 carrier mothers
    description: >
      Recruit obligate carrier mothers from the published PHF8 pedigrees and
      apply formal cognitive and adaptive-behaviour testing rather than clinical
      impression, with population norms as the comparator.
    decision_criterion: >
      Carrier mothers score below population norms on formal testing.
    supporting_outcome:
    - The X-linked recessive annotation understates female involvement.
  - experiment_id: phf8_xci_escape
    name: Determine whether PHF8 escapes X-inactivation
    description: >
      Measure allele-specific PHF8 expression in female cells with informative
      heterozygous markers and quantified X-inactivation ratios.
    decision_criterion: >
      PHF8 shows measurable expression from the inactive X.
    supporting_outcome:
    - Females have a higher baseline PHF8 dose, which would predict milder or
      absent manifestation.
- discussion_id: phf8_episignature
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Does PHF8-related intellectual disability have a DNA-methylation episignature
    that could resolve its reported variants of uncertain significance?
  attaches_to:
  - pathophysiology#Failure of RNA Polymerase II-Coupled Transcriptional Coactivation
  rationale: >
    Many chromatinopathies - Kabuki, Sotos and CHARGE among them - now have
    peripheral-blood DNA-methylation episignatures that reclassify missense
    variants of uncertain significance into pathogenic or benign. No such
    classifier exists for PHF8. This is not an academic gap: the largest series
    reported five individuals from four families with intellectual disability, a
    PHF8 variant of uncertain significance and no alternative explanation, which
    is precisely the population an episignature would resolve. PHF8 is a
    transcriptional coactivator acting on repressive histone marks, so a
    downstream methylation signature is mechanistically plausible.
  proposed_experiments:
  - experiment_id: phf8_methylation_classifier
    name: Peripheral-blood methylation classifier for PHF8 loss of function
    description: >
      Generate genome-wide methylation array data from peripheral blood of
      individuals with confirmed PHF8 loss-of-function variants and train a
      classifier against matched controls and against other chromatinopathy
      signatures.
    decision_criterion: >
      A reproducible signature separates PHF8 loss-of-function carriers from
      controls with high sensitivity and specificity.
    supporting_outcome:
    - PHF8 belongs among the episignature-classifiable chromatinopathies.
  - experiment_id: phf8_vus_classification
    name: Classification of reported PHF8 missense variants of uncertain significance
    description: >
      Apply the trained classifier to samples from the five reported individuals
      carrying PHF8 missense variants of uncertain significance.
    decision_criterion: >
      Each variant of uncertain significance is assigned to the affected or the
      control cluster.
    supporting_outcome:
    - Episignature testing can resolve the PHF8 variant-interpretation backlog.
  evidence:
  - reference: PMID:35469323
    reference_title: Variants in PHF8 cause a spectrum of X-linked neurodevelopmental
      disorders and facial dysmorphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also present five individuals from four different families who have ID and a variant of unknown significance in PHF8 with no other explanatory variant in another gene."
    explanation: Establishes that the variant-of-uncertain-significance population
      this gap concerns actually exists and is quantified.

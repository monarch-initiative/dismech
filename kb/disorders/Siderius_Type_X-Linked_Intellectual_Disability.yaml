    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical and structural studies reveal that PHF8 is a novel histone demethylase specific for di- and mono-methylated histone H3 lysine 9 (H3K9me2/1), but not for H3K9me3."
    explanation: Defines the H3K9 substrate specificity, including the exclusion of
      the trimethyl state.
  - reference: PMID:20346720
    reference_title: A functional link between the histone demethylase PHF8 and the
      transcription factor ZNF711 in X-linked mental retardation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that the XLMR protein PHF8 and a C. elegans homolog F29B9.2 catalyze demethylation of di- and monomethylated lysine 9 of histone H3 (H3K9me2/me1)."
    explanation: Independent confirmation of the H3K9me2/me1 demethylase activity,

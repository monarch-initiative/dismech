    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, a PHF8 disease mutant was defective in demethylation and in coactivation."
    explanation: Directly links a patient allele to failure of the coactivation
      function, which is the claim of this node.
  - reference: PMID:20622853
    reference_title: Histone H4K20/H3K9 demethylase PHF8 regulates zebrafish brain

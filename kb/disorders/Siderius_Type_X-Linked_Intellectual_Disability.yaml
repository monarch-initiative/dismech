    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The in vitro demethylation assay also showed that the F279S mutant observed in clinical patients possesses no demethylation activity, suggesting that loss of enzymatic activity is crucial for pathogenesis of PHF8 patients."
    explanation: Independent replication of catalytic inactivity, with the authors

- population: Province of Lecce, Puglia, southern Italy
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    Six apparently unrelated patients from small towns in one area of Puglia
    carry the p.Val23Met variant on a shared 213 kb haplotype, a founder
    effect that makes this the one known geographic cluster.
  evidence:
  - reference: PMID:33193651
    reference_title: "A Recurrent Pathogenic Variant of INPP5K Underlies Autosomal Recessive Congenital Muscular Dystrophy With Cataracts and Intellectual Disability: Evidence for a Founder Effect in Southern Italy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected subjects were homozygous or compound heterozygous for the
      c.67G > A (p.Val23Met) missense change and shared a common haplotype,
      indicating the occurrence of a founder effect.
    explanation: >-
      Establishes the southern Italian founder allele and therefore a local
      cluster of cases.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for INPP5K
    variants, and the disease segregates with recessive inheritance in the
    reported families, several of them consanguineous. Expressivity is
    variable within and between families: cataract and intellectual disability
    can each be absent, and one family carrying the recurrent p.Ile50Thr allele
    presented with congenital cataract, intellectual disability and only
    electromyographic myopathy.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whenever DNA from family members was available, we observed that the
      disease segregated with recessive inheritance of the INPP5K mutations
    explanation: >-
      Segregation analysis in the discovery families supports autosomal
      recessive inheritance.
  - reference: PMID:28940338
    reference_title: INPP5K variant causes autosomal recessive congenital cataract in a Pakistani family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparison of clinical phenotype of all the known affected individuals,
      including LUCC15 family, homozygous for INPP5K alleles revealed reduced
      penetrance of muscular dystrophy and intellectual disability.
    explanation: >-
      Supports variable expressivity of the muscle and cognitive features
      among biallelic carriers.
genetic:
- name: INPP5K
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: INPP5K
    term:
      id: hgnc:33882
      label: INPP5K
  notes: >-
    INPP5K encodes inositol polyphosphate-5-phosphatase K (SKIP), a 448-residue
    protein with an N-terminal 5-phosphatase domain and a C-terminal SKICH
    domain that targets it to the endoplasmic reticulum. Most reported
    pathogenic alleles are missense or in-frame changes in the phosphatase
    domain that leave partial residual activity in vitro; the truncating and
    splice alleles reported so far occur in compound heterozygosity with a
    missense allele. Constitutive Inpp5k knockout is embryonic lethal in mice,
    so patient alleles are interpreted as hypomorphic. INPP5K has no row in the
    committed ClinGen gene-disease validity ingest
    (kb/genes/ingest/clingen_gene_validity.tsv), so no validity tier is
    recorded.
  evidence:
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In individuals exhibiting congenital muscular dystrophy, early-onset
      cataracts, and mild intellectual disability but normal cranial magnetic
      resonance imaging, we identified bi-allelic mutations in INPP5K, encoding
      inositol polyphosphate-5-phosphatase K.
    explanation: >-
      First of the two concurrent 2017 gene-discovery studies.
  - reference: PMID:28190459
    reference_title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren Syndrome and Dystroglycanopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing revealed homozygous missense and compound
      heterozygous mutations in INPP5K in the affected members of each family.
    explanation: >-
      The independent companion discovery study in four further families.
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of INPP5K truncation mutations with clear loss of function
      may imply that variants in our series represent hypomorphic alleles; this
      is further supported by embryonic lethality in homozygous constitutive
      Inpp5k knockout mice.
    explanation: >-
      Supports treating patient alleles as hypomorphic rather than null.
  variants:
  - name: p.Ile50Thr (c.149T>C)
    description: >-
      Recurrent homozygous missense allele in consanguineous families of
      Bangladeshi and Pakistani origin. It reduces PI(4,5)P2 5-phosphatase
      activity in vitro with partial residual activity. The same allele, in a
      Pakistani family, produced congenital cataract and intellectual
      disability with only electromyographic myopathy.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28190456
      reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A c.149T>C (p.Ile50Thr) variant in INPP5K (GenBank: NM_016532.3)
        (Figures 1A and S2) was a non-conservative change, affected a strictly
        conserved amino acid
      explanation: >-
        Identifies p.Ile50Thr as the homozygous allele in the index family of
        the first discovery study. The same c.149T>C change was later reported
        in the cataract-predominant Pakistani family (PMID:28940338).
  - name: p.Val23Met (c.67G>A)
    description: >-
      Southern Italian founder allele, homozygous or compound heterozygous in
      six patients from Puglia sharing one haplotype. The recombinant protein
      retained 27% of wild-type activity against PI(4,5)P2 in vitro.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28190459
      reference_title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren Syndrome and Dystroglycanopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that when compared to a phosphatase-dead construct
        (p.Asp310Gly), p.Gly140Ser and p.Asp269Asn had almost no enzymatic
        activity, while p.Val23Met and p.Met93Val retained 27% and 42%
        activity, respectively.
      explanation: >-
        Quantifies the residual activity of p.Val23Met and other patient
        alleles in a recombinant phosphatase assay.
    - reference: PMID:33193651
      reference_title: "A Recurrent Pathogenic Variant of INPP5K Underlies Autosomal Recessive Congenital Muscular Dystrophy With Cataracts and Intellectual Disability: Evidence for a Founder Effect in Southern Italy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All affected subjects were homozygous or compound heterozygous for the
        c.67G > A (p.Val23Met) missense change and shared a common haplotype,
        indicating the occurrence of a founder effect.
      explanation: Establishes p.Val23Met as a founder allele.
  - name: p.Lys87= (c.261G>A) splice variant
    description: >-
      Synonymous variant that causes exon 3 skipping and a frameshift, reported
      in compound heterozygosity with the hypomorphic missense p.Arg92Cys in an
      adult with cataract and limb-girdle weakness but no intellectual
      disability.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:42467360
      reference_title: "INPP5K-related muscular dystrophy caused by a novel synonymous splicing variant in a Chinese patient: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Functional studies confirmed the synonymous variant causes aberrant
        splicing (exon 3 skipping), leading to a frameshift and premature
        termination p.(Leu52SerfsTer49).
      explanation: Establishes the splice mechanism of this synonymous allele.
pathophysiology:
- name: INPP5K Phosphoinositide 5-Phosphatase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic hypomorphic variants reduce the 5-phosphatase activity of INPP5K
    toward PI(4,5)P2, or, for the SKICH-domain variant p.Ile363Thr, displace
    the enzyme from the endoplasmic reticulum. Residual activity ranges from
    almost none to about half of wild type depending on the allele.
  genetic_context:
    gene:
      preferred_term: INPP5K
      term:
        id: hgnc:33882
        label: INPP5K
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous missense, in-frame deletion, splice
      and late frameshift alleles with partial residual activity.
  genes:
  - preferred_term: INPP5K
    term:
      id: hgnc:33882
      label: INPP5K
  molecular_functions:
  - preferred_term: phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity
    modifier: DECREASED
    term:
      id: GO:0004439
      label: phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity
  evidence:
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations impaired phosphatase activity toward the phosphoinositide
      phosphatidylinositol (4,5)-bisphosphate or altered the subcellular
      localization of INPP5K.
    explanation: >-
      Recombinant enzyme assays and localization studies show the two ways
      patient variants compromise INPP5K.
  - reference: PMID:28190459
    reference_title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren Syndrome and Dystroglycanopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that when compared to a phosphatase-dead construct
      (p.Asp310Gly), p.Gly140Ser and p.Asp269Asn had almost no enzymatic
      activity, while p.Val23Met and p.Met93Val retained 27% and 42% activity,
      respectively.
    explanation: >-
      Shows reduced but often partial catalytic activity across a second set
      of patient alleles.
  - reference: PMID:33060052
    reference_title: "The phosphoinositide 5-phosphatase INPP5K: From gene structure to in vivo functions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Its protein structure is comprised of a N-terminal catalytic domain which
      hydrolyses both PtdIns(4,5)P2 and PtdIns(3,4,5)P3, followed by a SKICH
      domain at the C-terminus which is responsible for protein-protein
      interactions and subcellular localization of INPP5K.
    explanation: >-
      Review of the two-domain structure that explains the two classes of
      patient allele: catalytic-domain variants that lower activity and a
      SKICH-domain variant that mislocalizes the enzyme.
  downstream:
  - target: Impaired PI(4,5)P2 to PI(4)P Conversion on Autolysosomes
    causal_link_type: DIRECT
    description: >-
      Loss of the enzyme that removes the 5-phosphate leaves PI(4,5)P2 high
      and PI(4)P low on autolysosome membranes.
    evidence:
    - reference: PMID:33879025
      reference_title: Bidirectional interconversion between PtdIns4P and PtdIns(4,5)P(2) is required for autophagic lysosome reformation and protection from skeletal muscle disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This was due to decreased PtdIns4P and increased PtdIns(4,5)P2 on
        autolysosomes, causing reduced scission of reformation tubules.
      explanation: >-
        In muscle-specific Inpp5k knockout mice, loss of INPP5K shifts the
        autolysosomal phosphoinositide balance toward PI(4,5)P2.
  - target: Lens Fiber Organization Defect
    description: >-
      Shown only in zebrafish knockdown; the cellular mechanism linking INPP5K
      to lens fiber organization is not known.
  - target: Impaired Neuronal Differentiation
  - target: PHGDH Dysregulation
  - target: Endoplasmic Reticulum Tubule-to-Sheet Imbalance
  - target: Secondary Alpha-Dystroglycan Hypoglycosylation
- name: Impaired PI(4,5)P2 to PI(4)P Conversion on Autolysosomes
  biological_scale: MOLECULAR
  description: >-
    On autolysosomes, PI(4)P is phosphorylated to PI(4,5)P2 to recruit the
    effectors that extrude reformation tubules, and INPP5K converts PI(4,5)P2
    back to PI(4)P so that the tubules can complete. Without INPP5K, PI(4,5)P2
    persists on autolysosomes and PI(4)P is reduced.
  chemical_entities:
  - preferred_term: phosphatidylinositol 4,5-bisphosphate
    modifier: INCREASED
    term:
      id: CHEBI:18348
      label: 1-phosphatidyl-1D-myo-inositol 4,5-bisphosphate
  - preferred_term: phosphatidylinositol 4-phosphate
    modifier: DECREASED
    term:
      id: CHEBI:17526
      label: 1-phosphatidyl-1D-myo-inositol 4-phosphate
  biological_processes:
  - preferred_term: phosphatidylinositol dephosphorylation
    modifier: DECREASED
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
  evidence:
  - reference: PMID:33119550
    reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reduced PI(4,5)P2 turnover on autolysosomes in Inpp5k-/- muscle
      suppressed autophagy and lysosome repopulation via ALR inhibition.
    explanation: >-
      Establishes reduced PI(4,5)P2 turnover on autolysosomes in knockout
      muscle and places it upstream of the ALR defect.
  downstream:
  - target: Defective Autophagic Lysosome Reformation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33879025
      reference_title: Bidirectional interconversion between PtdIns4P and PtdIns(4,5)P(2) is required for autophagic lysosome reformation and protection from skeletal muscle disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Therefore on autolysosomes, both PtdIns(4,5)P2 generation and its
        removal by INPP5K is required for completion of ALR.
      explanation: >-
        States that INPP5K-mediated removal of PI(4,5)P2 is required for ALR to
        complete.
- name: Defective Autophagic Lysosome Reformation
  biological_scale: CELLULAR
  description: >-
    Autophagic lysosome reformation recycles autolysosome membranes into new
    lysosomes through tubules that bud and undergo scission. In INPP5K-deficient
    myoblasts the autolysosomes enlarge and hyperextended reformation tubules
    persist, with the PI(4,5)P2 effector clathrin failing to disengage, so new
    lysosomes are not released. Wild-type INPP5K, but not disease mutants,
    restores lysosome homeostasis, which ties the patient alleles to this step.
  cell_types:
  - preferred_term: skeletal muscle myoblast
    term:
      id: CL:0000515
      label: skeletal muscle myoblast
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: lysosome organization (autophagic lysosome reformation)
    modifier: DECREASED
    term:
      id: GO:0007040
      label: lysosome organization
  evidence:
  - reference: PMID:33119550
    reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Defective ALR in Inpp5k-/- myoblasts was characterized by enlarged
      autolysosomes and the persistence of hyperextended reformation tubules,
      structures that participate in membrane recycling to form lysosomes.
    explanation: >-
      Describes the cellular ALR defect in knockout myoblasts.
  - reference: PMID:33119550
    reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Inhibition of PI(4,5)P2 synthesis or expression of WT INPP5K but not
      INPP5K disease mutants in INPP5K-depleted myoblasts restored lysosomal
      homeostasis.
    explanation: >-
      Rescue by wild-type but not patient-mutant INPP5K, and by lowering
      PI(4,5)P2 synthesis, links the patient alleles and the lipid imbalance to
      the lysosome defect.
  downstream:
  - target: Lysosome Depletion and Autophagic Flux Inhibition in Skeletal Muscle
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33119550
      reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Activation of TFEB-dependent de novo lysosome biogenesis did not
        compensate for loss of ALR in Inpp5k-/- muscle, revealing a dependence
        on this lysosome recycling pathway.
      explanation: >-
        Shows that muscle cannot replace ALR-derived lysosomes through de novo
        biogenesis, so the ALR block leads to lysosome loss.
- name: Lysosome Depletion and Autophagic Flux Inhibition in Skeletal Muscle
  biological_scale: CELLULAR
  conforms_to: disabled_macroautophagy#Failure of Cytoplasmic Quality Control
  description: >-
    With lysosomes not replenished, knockout muscle accumulates LC3-II, p62 and
    ubiquitinated proteins from six weeks of age and fills with enlarged
    autolysosome vacuoles, while autophagosome formation and fusion remain
    intact. The defect is a failure of autophagic clearance downstream of a
    lysosome supply problem, not a failure of autophagy induction. Human muscle
    biopsies show compatible features (rimmed vacuoles, p62 and alpha-B
    crystallin accumulation), but autophagic flux measured in patient
    fibroblasts was normal, so the step is established in mouse and only
    inferred in patients.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: autophagy
    modifier: DECREASED
    term:
      id: GO:0006914
      label: autophagy
  evidence:
  - reference: PMID:33119550
    reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report that loss of INPP5K in muscle caused severe disease, autophagy
      inhibition, and lysosome depletion.
    explanation: >-
      Direct demonstration in muscle-specific knockout mice.
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In some biopsies, cytoplasmic labeling for α-B crystallin, VCP, and p62
      as well as developmental and fetal myosin was observed in a variable
      proportion of fibers.
    explanation: >-
      p62 accumulation in patient muscle is a marker compatible with impaired
      autophagic clearance; it does not by itself measure flux.
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      However, LC3B immunoblotting and immunofluorescence staining as well as
      measurement of LC3B turnover and p62 levels in fibroblasts treated with
      the autophagy inducer rapamycin and the lysosomal inhibitor bafilomycin A1
      did not reveal specific effects of different INPP5K genotypes.
    explanation: >-
      Autophagic flux in patient skin fibroblasts was not altered. Fibroblasts
      are not muscle, and the mouse work locates the dependence on ALR in
      muscle, so this does not exclude the mechanism, but it is the only human
      flux measurement available.
  downstream:
  - target: Skeletal Myofiber Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33119550
      reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Therefore, in muscle, ALR is indispensable for lysosome homeostasis
        during autophagy and when defective is associated with muscular
        dystrophy.
      explanation: >-
        The knockout study concludes that the ALR and autophagy defect underlies
        the dystrophy.
- name: Skeletal Myofiber Degeneration
  biological_scale: TISSUE
  description: >-
    Dystrophic degeneration of skeletal muscle with fiber size variation,
    necrotic and regenerating fibers, fibrosis, fatty replacement and in some
    patients vacuolated fibers. Serum creatine kinase is markedly raised.
    Muscle-specific knockout mice develop the same pattern with a deficit in
    specific force, and zebrafish knockdown embryos show disorganized
    myofibers.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle pathology was largely nonspecific, showing variable degrees of
      dystrophic features, including increased range of muscle fiber size with
      small and hypertrophic fibers, muscle fibrosis, excess adipose tissue,
      occasional fibers with internal nuclei, rare necrotic fibers, and a few
      basophilic (regenerating) fibers
    explanation: Patient muscle biopsies show dystrophic degeneration.
  - reference: PMID:33119550
    reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inpp5kfl/fl MCK-Cre mice developed muscle disease resembling that caused
      by INPP5K mutations
    explanation: Muscle-specific knockout reproduces the dystrophy.
  - reference: PMID:28190459
    reference_title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren Syndrome and Dystroglycanopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that morpholino-mediated inpp5k loss of function in the zebrafish
      results in shortened body axis, microphthalmia with disorganized lens,
      microcephaly, reduced touch-evoked motility, and highly disorganized
      myofibers.
    explanation: Zebrafish knockdown produces disorganized myofibers.

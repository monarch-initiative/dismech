- name: Endoplasmic Reticulum Tubule-to-Sheet Imbalance
  biological_scale: CELLULAR
  description: >-
    INPP5K is recruited to endoplasmic reticulum tubules by ARL6IP1, and its
    depletion in mammalian cells, or loss of its worm orthologue CIL-1 in
    neurons, expands ER sheets at the expense of tubules. Patient-derived cells
    have not been examined for this, and the first discovery study found no
    unfolded protein response in patient fibroblasts, so whether ER morphology
    contributes to disease is open.
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  biological_processes:
  - preferred_term: endoplasmic reticulum tubular network organization
    modifier: DECREASED
    term:
      id: GO:0071786
      label: endoplasmic reticulum tubular network organization
  evidence:
  - reference: PMID:30087126
    reference_title: The inositol 5-phosphatase INPP5K participates in the fine control of ER organization.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of either INPP5K or ARL6IP1 results in the increase of ER
      sheets.
    explanation: Cell-based evidence that INPP5K loss alters ER architecture.
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      However, we found no evidence for induction of the ER stress response in
      skin fibroblasts from individuals with bi-allelic INPP5K mutations and
      disease-causing INPP5K mutants did not interfere with interaction with
      BiP, suggesting still other mechanisms resulting in INPP5K-related
      disease.
    explanation: >-
      Argues against an ER stress mechanism of the Marinesco-Sjogren type in
      patient cells; it does not test ER morphology directly.
- name: Secondary Alpha-Dystroglycan Hypoglycosylation

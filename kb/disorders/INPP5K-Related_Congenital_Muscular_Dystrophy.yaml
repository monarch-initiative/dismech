histopathology:
- name: Dystrophic myopathy with variable vacuolation
  description: >-
    Biopsies show nonspecific dystrophic changes: fiber size variation,
    fibrosis, fatty replacement, internal nuclei, rare necrotic and
    regenerating fibers, with vacuolated fibers in some. Electron microscopy
    can show dense membranous structures associated with myonuclei, as in
    Marinesco-Sjogren syndrome. Dystrophin, sarcoglycans and merosin are
    normal; alpha-dystroglycan is normal in some patients and reduced in
    others.
  evidence:
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological examination of three diagnostic muscle biopsies from
      individuals with INPP5K mutations showed vacuoles in several myofibers,
      and electron microscopy of one biopsy revealed dense membranous
      structures associated with some myonuclei.
    explanation: Vacuoles and perinuclear membranous structures shared with MSS.
imaging_findings:
- name: Selective thigh and leg muscle involvement on muscle MRI
  modality: MRI
  description: >-
    Fatty replacement of the vasti, adductor magnus, tibialis anterior, peronei
    and soleus, with relative sparing of rectus femoris, sartorius, gracilis
    and gastrocnemii. Severity rises with age, and young children may have a
    normal scan. Muscle ultrasound shows the same vasti-over-rectus-femoris
    pattern.
  diagnostic: true
  evidence:
  - reference: PMID:33193651
    reference_title: "A Recurrent Pathogenic Variant of INPP5K Underlies Autosomal Recessive Congenital Muscular Dystrophy With Cataracts and Intellectual Disability: Evidence for a Founder Effect in Southern Italy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle MRI showed consistent involvement of vasti, anterior tibialis and
      peronei muscles, and the degree of muscle degeneration appears to be
      age-related being more severe in older patients
    explanation: Defines the pattern and its age dependence.
  - reference: PMID:42467360
    reference_title: "INPP5K-related muscular dystrophy caused by a novel synonymous splicing variant in a Chinese patient: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle magnetic resonance imaging (MRI) revealed a characteristic pattern
      of selective fatty infiltration, with severe involvement of gluteal and
      thigh muscles and striking sparing of the rectus femoris, sartorius, and
      gracilis.
    explanation: Same sparing pattern in an independent patient.
diagnosis:
- name: Molecular genetic testing of INPP5K
  description: >-
    Diagnosis rests on biallelic INPP5K variants. Exome or neuromuscular panel
    sequencing is the usual route; in patients from Puglia, targeted
    sequencing of exon 2 for the p.Val23Met founder allele is a reasonable
    first step. Synonymous variants can be pathogenic through splicing, so RNA
    analysis may be needed when only one variant is found.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33193651
    reference_title: "A Recurrent Pathogenic Variant of INPP5K Underlies Autosomal Recessive Congenital Muscular Dystrophy With Cataracts and Intellectual Disability: Evidence for a Founder Effect in Southern Italy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      especially if originating from the same area of southern Italy (Puglia),
      sequencing of exon 2 of INPP5K as the first screening step
    explanation: Recommends founder-exon screening in patients from Puglia.
  - reference: PMID:42467360
    reference_title: "INPP5K-related muscular dystrophy caused by a novel synonymous splicing variant in a Chinese patient: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case highlights the critical role of RNA analysis in diagnosing
      non-canonical variants
    explanation: Supports RNA analysis for non-canonical variants.
- name: Muscle imaging
  description: >-
    Muscle MRI or ultrasound showing vasti involvement with sparing of rectus
    femoris, sartorius and gracilis supports the diagnosis and can help
    interpret genetic results.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39133882
    reference_title: "Pearls & Oy-sters: Use of Muscle Ultrasound as a Clinical Tool in INPP5K-Related Muscular Dystrophy: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A characteristic pattern of muscle involvement has been identified on
      muscle MRI in a small case series, including involvement of the vasti,
      anterior tibialis, and peronei with relative sparing of the rectus
      femoris, sartorius, and gracilis muscles.
    explanation: States the diagnostic muscle imaging pattern.
differential_diagnoses:
- name: Marinesco-Sjogren syndrome
  description: >-
    SIL1-related disorder sharing early cataracts, myopathy, intellectual
    disability and vacuolar muscle pathology with perinuclear membranous
    structures. Cerebellar ataxia with cerebellar atrophy is defining in
    Marinesco-Sjogren syndrome but absent or mild in INPP5K disease. The INPP5K
    discovery cohort was assembled from patients referred for SIL1 testing who
    had no SIL1 variant. Curated in kb/disorders/Marinesco-Sjogren_Syndrome.yaml.
  disease_term:
    preferred_term: Marinesco-Sjogren syndrome
    term:
      id: MONDO:0009567
      label: Marinesco-Sjogren syndrome
  evidence:
  - reference: PMID:28190459
    reference_title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren Syndrome and Dystroglycanopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While no ataxia or cerebellar atrophy was noted, this presentation is
      reminiscent of MSS and could fall in the larger MSS spectrum.
    explanation: States the overlap and the distinguishing absence of ataxia.
- name: Dystroglycanopathy
  description: >-
    Alpha-dystroglycan glycosylation defects cause congenital muscular
    dystrophy with eye and brain involvement. Some INPP5K patients show reduced
    alpha-dystroglycan glycosylation, but the dystroglycanopathy brain
    malformations are absent, and the hypoglycosylation appears to be
    secondary. Curated in kb/disorders/Dystroglycanopathy.yaml.
  evidence:
  - reference: PMID:28190459
    reference_title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren Syndrome and Dystroglycanopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, a reduction in dystroglycan glycosylation in S2 and S3
      suggest an overlap with less severe forms of dystroglycanopathies, where
      CMD is present with cataracts and ID.
    explanation: States the partial overlap with the dystroglycanopathies.
- name: 3-Phosphoglycerate dehydrogenase deficiency
  description: >-
    Serine biosynthesis defect whose neurological picture overlaps INPP5K
    disease and Marinesco-Sjogren syndrome; altered PHGDH is the proposed
    shared molecular feature. Curated in
    kb/disorders/3-Phosphoglycerate_Dehydrogenase_Deficiency.yaml.
  evidence:
  - reference: PMID:33792664
    reference_title: INPP5K and SIL1 associated pathologies with overlapping clinical phenotypes converge through dysregulation of PHGDH.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      d-3-PHGDH modulates the production of l-serine and mutations in this
      enzyme were previously associated with a neurological phenotype, which
      clinically overlaps with Marinesco-Sjögren syndrome and INPP5K disease.
    explanation: States the clinical overlap with PHGDH deficiency.

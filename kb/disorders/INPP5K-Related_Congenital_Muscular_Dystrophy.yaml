name: INPP5K-Related Congenital Muscular Dystrophy
creation_date: '2026-10-14T12:36:44Z'
category: Mendelian
parents:
- Congenital Muscular Dystrophy
description: >-
  Autosomal recessive congenital muscular dystrophy caused by biallelic,
  mostly hypomorphic missense variants in INPP5K (also called SKIP), an
  inositol polyphosphate 5-phosphatase that converts phosphatidylinositol
  4,5-bisphosphate to phosphatidylinositol 4-phosphate and sits largely on the
  endoplasmic reticulum. The core picture is hypotonia or proximal weakness
  from birth or early childhood with markedly raised creatine kinase and
  dystrophic muscle pathology, bilateral early-onset cataracts, short stature,
  and usually mild to moderate intellectual disability. Brain MRI is often
  normal; microcephaly, seizures and mild cerebral or cerebellar atrophy occur
  in some patients. Motor function is often stable for years and then declines,
  with loss of ambulation in some adolescents and adults. Muscle MRI shows a
  recognizable pattern with vasti, tibialis anterior and peronei involved and
  rectus femoris, sartorius and gracilis spared. The clinical picture overlaps
  Marinesco-Sjogren syndrome (early cataracts, myopathy, intellectual
  disability, vacuolar muscle pathology) and, in some patients with reduced
  alpha-dystroglycan glycosylation, the dystroglycanopathies. The leading
  mechanistic model, established in a muscle-specific knockout mouse, is
  failure of autophagic lysosome reformation: without INPP5K, PI(4,5)P2 is not
  cleared from autolysosome membranes, reformation tubules fail to resolve,
  lysosomes are depleted and autophagic flux stalls in muscle. Whether the same
  defect operates in patient muscle has not been shown directly.

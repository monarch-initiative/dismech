animal_models:
- name: Muscle-specific Inpp5k knockout mouse (Inpp5k fl/fl MCK-Cre)
  species: Mouse
  genotype: Inpp5k fl/fl; MCK-Cre (skeletal muscle-specific deletion)
  publication: PMID:33119550
  description: >-
    Constitutive knockout is embryonic lethal, so Inpp5k was deleted in
    skeletal muscle. Mice develop early-onset progressive dystrophy with raised
    CK, vacuolated fibers, fibrosis and reduced force, with lysosome depletion
    and autophagy inhibition caused by failed autophagic lysosome reformation.
  modeled_mechanisms:
  - target: Defective Autophagic Lysosome Reformation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Knockout muscle and myoblasts show the ALR block directly.
    limitations: >-
      Complete deletion, whereas patient alleles are hypomorphic; an ALR
      defect has not been demonstrated in patient muscle.
    evidence:
    - reference: PMID:33119550
      reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Reduced PI(4,5)P2 turnover on autolysosomes in Inpp5k-/- muscle
        suppressed autophagy and lysosome repopulation via ALR inhibition.
      explanation: The model shows the ALR defect in muscle.
  - target: Skeletal Myofiber Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Progressive dystrophy with raised CK and vacuolated fibers.
    limitations: >-
      Muscle-only deletion cannot model the lens, brain and growth features,
      and disease onset and course in mice need not match the human timeline.
    evidence:
    - reference: PMID:33119550
      reference_title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Inpp5kfl/fl MCK-Cre mice developed muscle disease resembling that caused
        by INPP5K mutations
      explanation: The authors judge the muscle disease to resemble the human one.
- name: inpp5ka morphant zebrafish
  species: Zebrafish
  genotype: inpp5ka (with or without inpp5kb) morpholino knockdown
  publication: PMID:28190459
  description: >-
    Morpholino knockdown of inpp5ka, the closer orthologue of human INPP5K,
    gives microphthalmia with a disorganized lens, microcephaly, short and
    curved body, reduced motility and disorganized myofibers with sarcomere
    defects, rescued by human INPP5K mRNA. inpp5kb has lost catalytic activity
    toward PI(4,5)P2, so inpp5ka is the relevant target.
  modeled_mechanisms:
  - target: Lens Fiber Organization Defect
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Lens cortex disorganization with retained central nuclei.
    limitations: >-
      Transient embryonic knockdown; lens disorganization in larvae is
      reminiscent of, not identical to, human postnatal cataract.
    evidence:
    - reference: PMID:28190459
      reference_title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren Syndrome and Dystroglycanopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        inpp5k loss-of-function modeling in the zebrafish led to a
        constellation of phenotypes that closely resembles the human
        presentation, including reduced growth, microcephaly, lens
        disorganization, reduced motility, and myopathy.
      explanation: Morphants show lens disorganization and other human features.
  - target: Skeletal Myofiber Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Disorganized myofibers in embryos.
    limitations: >-
      Embryonic myofiber disorganization reflects development as much as
      degeneration, and morpholino effects are transient.
    evidence:
    - reference: PMID:28190456
      reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Downregulation of INPP5K orthologs in zebrafish embryos disrupted
        muscle fiber morphology and resulted in abnormal eye development.
      explanation: Independent morphant study with muscle and eye defects.
  evidence:
  - reference: PMID:37184573
    reference_title: Duplicated zebrafish (Danio rerio) inositol phosphatases inpp5ka and inpp5kb diverged in expression pattern and function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Since most human mutations are missense changes disrupting phosphatase
      activity, we propose that loss of inpp5ka alone can be targeted to
      recapitulate the human presentation.
    explanation: Identifies inpp5ka as the relevant paralogue to model.
discussions:
- discussion_id: inpp5k_alr_defect_in_patient_muscle
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Muscle-specific Inpp5k knockout mice show failed autophagic lysosome
    reformation with autophagy inhibition, but autophagic flux in patient
    fibroblasts was normal. Does the ALR defect operate in patient muscle
    carrying hypomorphic alleles?
  attaches_to:
  - pathophysiology#Defective Autophagic Lysosome Reformation
  - pathophysiology#Lysosome Depletion and Autophagic Flux Inhibition in Skeletal Muscle
  rationale: >-
    The mouse deletes the gene completely in muscle, while patients retain
    partial activity, and the only human flux experiment used skin
    fibroblasts, a cell type the mouse work suggests is less dependent on ALR.
    Patient biopsies show rimmed vacuoles and p62 labeling, which fit the model
    but do not measure flux or lysosome number. Measuring lysosome abundance,
    LC3-II flux and reformation tubules in patient myoblasts or muscle would
    test whether the mouse mechanism transfers.
  evidence:
  - reference: PMID:28190456
    reference_title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, LC3B immunoblotting and immunofluorescence staining as well as
      measurement of LC3B turnover and p62 levels in fibroblasts treated with
      the autophagy inducer rapamycin and the lysosomal inhibitor bafilomycin A1
      did not reveal specific effects of different INPP5K genotypes.
    explanation: The negative human cell result that defines the mismatch.
- discussion_id: inpp5k_lens_and_brain_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What links INPP5K deficiency to cataract, intellectual disability and short
    stature?
  attaches_to:
  - pathophysiology#Lens Fiber Organization Defect
  - pathophysiology#Impaired Neuronal Differentiation
  - phenotypes#Short stature
  rationale: >-
    The muscle mechanism has a mouse model, but the lens and brain evidence is
    limited to zebrafish morphants, an N2A knockdown and a PHGDH proteomic
    finding with zebrafish L-serine rescue. Whether autophagic lysosome
    reformation, ER organization, PHGDH and serine supply, or another INPP5K
    function drives the non-muscle features is untested, and nothing in the
    cited literature addresses short stature.
references:
- reference: PMID:28190456
  title: Mutations in INPP5K, Encoding a Phosphoinositide 5-Phosphatase, Cause Congenital Muscular Dystrophy with Cataracts and Mild Cognitive Impairment.
- reference: PMID:28190459
  title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren Syndrome and Dystroglycanopathy.
- reference: PMID:33119550
  title: Defective lysosome reformation during autophagy causes skeletal muscle disease.
notes: >-
  Lump/split. The cataract-predominant Pakistani family (PMID:28940338),
  reported as INPP5K congenital cataract, carries p.Ile50Thr, the same
  homozygous allele as most families of the first discovery series, and its
  affected members also have intellectual disability and EMG myopathy. It is
  treated as variable expressivity of this disease, not a separate allelic
  disorder. Cases presenting after walking was achieved, more like a
  limb-girdle dystrophy, are likewise included. INPP5K disease is kept
  separate from Marinesco-Sjogren syndrome (SIL1): different gene, cerebellar
  ataxia absent or mild, and no unfolded protein response in patient cells,
  with the overlap recorded as a differential diagnosis. No grouping currently
  fits: the glycosylation-disorder groupings cover primary glycosylation
  defects, whereas alpha-dystroglycan hypoglycosylation here is inconstant and
  appears secondary.

  Rejected mechanism. INPP5K also hydrolyzes PI(3,4,5)P3 and restrains AKT
  signaling in muscle, and knockout muscle shows AKT and mTOR hyperactivation,
  but an AKT inhibitor rescued neither the autophagy defect nor the dystrophy
  (PMID:33119550, full text), and patient fibroblasts showed no change in AKT
  phosphorylation after IGF-II stimulation (PMID:28190456, full text). AKT
  signaling is therefore not modelled as a disease node.

  Identifier caveats for the deep-research report in research/
  (INPP5K-Related_Congenital_Muscular_Dystrophy-deep-research-openscientist.md).
  It gives OMIM 616827 as the phenotype number; MONDO maps OMIM 616827 to
  autosomal recessive limb-girdle muscular dystrophy type 2W (MONDO:0014788),
  and the correct number for this disease is OMIM 617404. It gives HGNC:21940
  for INPP5K, which returns nothing from the HGNC REST service; the gene is
  hgnc:33882. It also states that no mouse disease model has been published,
  which the muscle-specific knockout (PMID:33119550) contradicts. Its
  prevalence and carrier-frequency figures are its own gnomAD calculations,
  not published estimates, and are not used here.

  No GeneReviews chapter names this disorder.

- name: PHGDH Dysregulation
  biological_scale: CELLULAR
  description: >-
    Unbiased proteomics of cells from INPP5K and SIL1 (Marinesco-Sjogren)
    patients converged on altered D-3-phosphoglycerate dehydrogenase (PHGDH),
    the first enzyme of serine biosynthesis, whose own deficiency causes a
    neurological disorder. L-serine improved the neuronal phenotype of
    inpp5k zebrafish. The direction of the PHGDH change in INPP5K cells is not
    stated in the cached abstract, so no modifier is recorded.
  genes:

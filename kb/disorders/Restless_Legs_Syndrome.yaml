- name: Dopamine Agonist (Pramipexole)
  description: >-
    Immediately and reliably effective at doses well below those used in
    Parkinson disease, and for many years first-line - but curated here with its
    principal harm attached, because the harm is mechanistically informative
    rather than incidental. Sustained dopaminergic treatment causes augmentation:
    the disease itself worsens, with symptoms starting earlier in the day,
    becoming more intense, and spreading to previously unaffected limbs. The
    evidence-based review identifies augmentation as more frequent with
    pramipexole than pregabalin and possibly with all dopaminergic agents more
    than alpha-2-delta ligands, and requires special monitoring for every
    dopaminergic drug. A treatment that reverses into an exacerbation of the
    disorder is exactly what a relative-dopamine-excess model predicts and a
    deficiency model does not.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

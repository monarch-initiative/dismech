name: Restless Legs Syndrome
creation_date: "2026-08-24T00:00:00Z"
category: Neurological Disorder
parents:
- Sleep Disorder
- Neurological Disease
disease_term:
  preferred_term: restless legs syndrome
  term:
    id: MONDO:0005391
    label: restless legs syndrome
description: >-
  Restless legs syndrome (Willis-Ekbom disease) is a common sensorimotor
  disorder defined by an urge to move the legs that appears or worsens at rest,
  is relieved by movement, and follows a circadian pattern with onset in the
  evening or night. It is a sleep disorder by consequence rather than by
  definition - the diagnostic criteria describe a waking sensorimotor
  experience, but the circadian timing places it at sleep onset, and sleep
  disruption is what brings most patients to attention. Most patients also show
  periodic limb movements during sleep, a distinct and separately heritable
  motor trait. The pathophysiology is not settled. What is best established is
  regional brain iron deficiency in the presence of normal or near-normal
  systemic iron stores, most consistently in the substantia nigra, which
  neuropathology attributes to impaired iron acquisition by neuromelanin-
  containing cells rather than to degeneration. Around that core sit a
  dopaminergic abnormality that is a state of relative dopamine excess rather
  than deficiency, strong non-coding genetic associations at MEIS1 and BTBD9
  that connect to iron homeostasis, and candidate adenosinergic and
  glutamatergic contributions. The therapeutic paradox that shapes management -
  dopamine agonists work immediately and then cause augmentation, a
  drug-induced worsening of the disease they treat - follows directly from that
  unsettled mechanism.
notes: >-
  CURATORIAL POSITION ON THE DOPAMINE STORY. The dopaminergic response is
  reliable and the dopaminergic hypothesis is widely repeated, but the direction
  usually assumed is wrong: neuropathology and imaging show relative dopamine
  EXCESS in the affected regions, and tyrosine hydroxylase staining is normal.
  This entry therefore curates the dopaminergic abnormality as a downstream
  consequence of brain iron deficiency and as a treatment target, NOT as a
  degenerative dopamine deficiency analogous to Parkinson disease. Curators
  should not "correct" this toward the familiar deficiency framing - the
  augmentation phenomenon is precisely what a deficiency model fails to
  predict and an excess-with-receptor-downregulation model does.

  The entry deliberately does not conform to
  parkinsonism_dopaminergic_degeneration: there is no nigral cell loss here, and
  the neuropathology paper cited says so explicitly.
pathophysiology:
- name: Regional Brain Iron Deficiency
  description: >-
    The best-established abnormality, and the trigger node. Iron content is
    reduced in specific brain regions - most consistently the substantia nigra,
    also the thalamus - while systemic iron stores may be entirely normal. This
    is a compartment-specific deficiency, not a systemic one, which is why serum
    ferritin is an unreliable guide and why oral iron is ineffective in
    iron-sufficient patients. Neuropathologically the lesion is one of acquisition
    rather than of loss: H-ferritin and iron staining are markedly reduced,
    transferrin receptor staining on neuromelanin-containing cells is decreased
    while transferrin itself is increased - the signature of cells that are iron
    starved but failing to upregulate their uptake machinery, i.e. a regulatory
    defect at the transferrin receptor. Crucially there is no neurodegeneration:
    the RLS brain shows no histopathological abnormality unique to it and normal
    tyrosine hydroxylase staining, which distinguishes this disorder from the
    dopaminergic degenerations at the level of tissue.
  role: trigger
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: iron ion transport
    term:
      id: GO:0006826
      label: iron ion transport
    modifier: DECREASED
  locations:
  - preferred_term: substantia nigra
    term:
      id: UBERON:0002038
      label: substantia nigra
  evidence:
  - reference: PMID:12913188
    reference_title: Neuropathological examination suggests impaired brain iron acquisition in restless legs syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iron staining and H-ferritin staining was markedly decreased in the RLS
      substantia nigra.
    explanation: >-
      Direct neuropathological demonstration of the regional iron deficit that
      this node asserts.
  - reference: PMID:12913188
    reference_title: Neuropathological examination suggests impaired brain iron acquisition in restless legs syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RLS may not be rooted in pathologies associated with traditional
      neurodegenerative processes but may be a functional disorder resulting from
      impaired iron acquisition by the neuromelanin cells in RLS. The underlying
      mechanism may be a defect in regulation of the transferrin receptors.
    explanation: >-
      Establishes both halves of the node's claim - that the lesion is impaired
      acquisition rather than degeneration, and that the defect is at the level
      of transferrin receptor regulation.
  - reference: PMID:12913188
    reference_title: Neuropathological examination suggests impaired brain iron acquisition in restless legs syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no histopathologic abnormalities unique to the RLS brains.
      Tyrosine hydroxylase staining in the major dopaminergic regions appeared
      normal in the RLS brains.
    explanation: >-
      The negative finding that keeps this entry out of the dopaminergic
      degeneration family, and the reason the notes forbid recurating the
      dopaminergic node as a deficiency.
  downstream:
  - target: Altered Dopaminergic Signalling with Relative Dopamine Excess
    description: >-
      Iron is the cofactor of tyrosine hydroxylase and is required for normal
      dopamine receptor and transporter regulation, so regional iron deficiency
      perturbs dopaminergic signalling in the same regions.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Sensorimotor Network Hyperexcitability
    description: >-
      Brain iron deficiency is also proposed to reduce adenosinergic tone and
      raise glutamatergic transmission, contributing to hyperexcitability
      independently of the dopaminergic arm.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Genetic Susceptibility at Iron-Linked Regulatory Loci
  description: >-
    Restless legs syndrome is highly heritable, and its common risk variants are
    unusual in two respects that are mechanistically informative. First, they are
    almost all non-coding and regulatory rather than protein-altering - the
    strongest signal is a linkage-disequilibrium block within intron 8 of MEIS1 -
    so the disease mechanism runs through altered expression of developmental
    transcription factors, not through altered protein function. Second, the
    effect sizes are among the largest reported for any common disease, and yet
    identified variants explain under 10% of heritability. MEIS1 risk haplotype
    carriers show lower MEIS1 mRNA and protein in blood and thalamus, and the
    MEIS1 orthologue is linked to iron homeostasis in C. elegans - which is the
    connection that ties the genetic arm back to the iron trigger rather than
    leaving it a separate story.
  role: trigger
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:17637780
    reference_title: Genome-wide association study of restless legs syndrome identifies common variants in three genomic regions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a genome-wide association study we found highly significant associations
      between RLS and intronic variants in the homeobox gene MEIS1, the BTBD9
      gene encoding a BTB(POZ) domain as well as variants in a third locus
      containing the genes encoding mitogen-activated protein kinase MAP2K5 and
      the transcription factor LBXCOR1
    explanation: >-
      The founding association study, identifying the three loci this node
      encodes and establishing that they are intronic rather than coding.
  - reference: PMID:17637780
    reference_title: Genome-wide association study of restless legs syndrome identifies common variants in three genomic regions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each genetic variant was associated with a more than 50% increase in risk
      for RLS, with the combined allelic variants conferring more than half of
      the risk.
    explanation: >-
      Quantifies the unusually large common-variant effect sizes referred to in
      the node description.
  - reference: PMID:31551905
    reference_title: "MEIS1 and Restless Legs Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Work in C. elegans showed a link between the MEIS1 ortholog and iron
      homeostasis, which is in line with the fact that central nervous system
      (CNS) iron insufficiency is thought to be a cause of RLS.
    explanation: >-
      The link that connects the genetic trigger to the iron trigger, and the
      reason both are curated as arms of one disorder rather than as competing
      accounts.
  - reference: PMID:31551905
    reference_title: "MEIS1 and Restless Legs Syndrome: A Comprehensive Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The genetic factors so far identified explain less than 10% of the disease
      heritability.
    explanation: >-
      Cited as PARTIAL because it bounds the genetic arm rather than supporting
      it: the associations are real and strong but account for a small fraction
      of a highly heritable disorder, so this node cannot be presented as the
      cause.
  downstream:
  - target: Regional Brain Iron Deficiency
    description: >-
      Risk-haplotype-associated reduction in MEIS1 expression is proposed to act
      through iron homeostasis, though the specific protein function linking the
      two has not been established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Altered Dopaminergic Signalling with Relative Dopamine Excess
  description: >-
    The dopaminergic abnormality, curated in the direction the evidence
    supports. The iron-deficient regions show a state of relative dopamine
    excess, not deficiency, with presynaptic upregulation and postsynaptic
    receptor downregulation; tyrosine hydroxylase staining is normal and there is
    no cell loss. This reading is what makes sense of the disorder's two most
    distinctive pharmacological facts. Dopamine agonists relieve symptoms
    immediately, at doses far below those used in Parkinson disease, because they
    act on a downregulated postsynaptic system at its circadian trough. And
    sustained agonist exposure produces augmentation - earlier onset, greater
    intensity, and spread to the arms - which is what a chronically overdriven
    system that is already in relative excess would be expected to do, and which a
    deficiency model does not predict at all.
  role: amplifier
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: dopaminergic synaptic transmission
    term:
      id: GO:0001963
      label: synaptic transmission, dopaminergic
    modifier: ABNORMAL
  locations:
  - preferred_term: substantia nigra
    term:
      id: UBERON:0002038
      label: substantia nigra
  evidence:
  - reference: PMID:28236139
    reference_title: "Iron, dopamine, genetics, and hormones in the pathophysiology of restless legs syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human neuropathologic and imaging studies have consistently shown decreased
      iron in different brain regions including substantia nigra and thalamus.
      These same areas also demonstrate a state of relative dopamine excess.
    explanation: >-
      States the direction of the dopaminergic abnormality explicitly and
      co-localises it with the iron deficit, which is the whole basis for
      curating this node downstream of iron rather than as an independent
      deficiency.
  - reference: PMID:28236139
    reference_title: "Iron, dopamine, genetics, and hormones in the pathophysiology of restless legs syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      While it is not known how these changes in dopamine or iron produce the
      symptoms of RLS
    explanation: >-
      Cited as PARTIAL because it records the limit of the account: the
      iron-dopamine relationship is established but the step from it to the
      sensory symptom is not, which is why the downstream edge is curated with
      unknown intermediates.
  downstream:
  - target: Sensorimotor Network Hyperexcitability
    description: >-
      Altered dopaminergic modulation of spinal and supraspinal sensorimotor
      circuits is proposed to lower the threshold for the sensory urge and for
      periodic limb movements, though the intervening steps are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Sensorimotor Network Hyperexcitability
  description: >-
    The convergence node: a state of increased excitability in spinal and
    supraspinal sensorimotor circuits, expressed as an aversive sensory urge at
    rest and as involuntary periodic limb movements during sleep. Beyond the
    dopaminergic arm, the leading candidate contributors are reduced adenosinergic
    tone (adenosine is inhibitory, and brain iron deficiency has been proposed to
    downregulate A1 receptors) and increased glutamatergic transmission - which
    would explain why alpha-2-delta ligands, which reduce glutamate release and
    have no dopaminergic action at all, are as effective as dopamine agonists.
    That equivalence is a strong constraint on any mechanistic account, and it is
    the reason this node is curated as a convergence point rather than as a
    dopaminergic effector.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: INCREASED
  evidence:
  - reference: PMID:34732752
    reference_title: Restless legs syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The pathophysiology is still unclear, with the involvement of brain iron
      deficiency, dysfunction in the dopaminergic and nociceptive systems and
      altered adenosine and glutamatergic pathways as hypotheses being
      investigated.
    explanation: >-
      Cited as PARTIAL because it is the disease primer's own statement that the
      pathophysiology is unresolved and that the adenosinergic and glutamatergic
      contributions are hypotheses under investigation, not established
      mechanism - the calibration this node is written to preserve.
  - reference: PMID:28888061
    reference_title: "Gabapentin enacarbil, pregabalin and rotigotine are equally effective in restless legs syndrome: a comparative meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      gabapentin enacarbil, pregabalin and rotigotine
    explanation: >-
      Cited for the meta-analytic finding named in its title - that two
      alpha-2-delta ligands and a dopamine agonist are equally effective - which
      is the pharmacological constraint requiring a convergence node rather than
      a purely dopaminergic effector.
  downstream:
  - target: Rest-Dependent Urge to Move with Circadian Timing
    description: >-
      Hyperexcitable sensorimotor circuits produce the characteristic sensory
      urge when sensory input and motor output are reduced by rest.
    causal_link_type: DIRECT
  - target: Periodic Limb Movements of Sleep
    description: >-
      The same hyperexcitability, expressed through spinal motor circuits
      released during sleep, produces stereotyped periodic movements.
    causal_link_type: DIRECT

- name: Rest-Dependent Urge to Move with Circadian Timing
  description: >-
    The defining clinical phenomenon, and its two modulations are diagnostic
    rather than incidental. It is rest-dependent: the urge appears during
    inactivity and is relieved, immediately and completely, by movement - a
    relief pattern no other sensory symptom shares. And it is circadian:
    symptoms appear in the evening and night, following the endogenous rhythm
    rather than time awake, which is why they persist at the same clock time
    after a shifted schedule and why sleep onset is the point of maximal
    impairment.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: circadian rhythm
    term:
      id: GO:0007623
      label: circadian rhythm
  evidence:
  - reference: PMID:34732752
    reference_title: Restless legs syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Restless legs syndrome (RLS) is a common sensorimotor disorder
      characterized by an urge to move that appears during rest or is exacerbated
      by rest, that occurs in the evening or night and that disappears during
      movement or is improved by movement.
    explanation: >-
      Gives all three defining features of this node - rest dependence,
      circadian timing, and relief by movement - in the primer's own definition.
  downstream:
  - target: Sleep Disruption and Its Consequences
    description: >-
      Symptoms peaking at the time of intended sleep onset delay and fragment
      sleep.
    causal_link_type: DIRECT

- name: Periodic Limb Movements of Sleep
  description: >-
    Stereotyped, repetitive limb movements during sleep, present in most patients
    with restless legs syndrome and quantifiable on polysomnography. Curated as
    its own node because the genetics show it is partly separable: the BTBD9
    variant is associated with periodic limb movements both with and without the
    restless legs phenotype, and NOT with restless legs in the absence of
    periodic limb movements - which identifies it as a genetic determinant of the
    movement trait rather than of the sensory disorder. Treating the two as one
    entity would discard that dissociation.
  role: effector
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:17634447
    reference_title: A genetic risk factor for periodic limb movements in sleep.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An association between the variant and periodic limb movements in sleep
      without RLS (and the absence of such an association for RLS without
      periodic limb movements) suggests that we have identified a genetic
      determinant of periodic limb movements in sleep
    explanation: >-
      The dissociation evidence that justifies curating periodic limb movements
      as a separate node rather than as a feature of the sensory disorder.
  - reference: PMID:17634447
    reference_title: A genetic risk factor for periodic limb movements in sleep.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum ferritin levels were decreased by 13% per allele of the at-risk
      variant
    explanation: >-
      Ties this node's genetic determinant back to iron status quantitatively,
      which is the link between the movement trait and the module's trigger.
  downstream:
  - target: Sleep Disruption and Its Consequences
    description: >-
      Repetitive movements, particularly when associated with cortical arousals,
      fragment sleep.
    causal_link_type: DIRECT

- name: Sleep Disruption and Its Consequences
  description: >-
    The clinical endpoint through which restless legs syndrome becomes a sleep
    disorder: delayed sleep onset from the evening urge, fragmentation from
    periodic movements, and consequent daytime impairment and mood disturbance.
    Severity varies widely, and only the more severe forms warrant drug
    treatment - a threshold that matters here more than in most disorders,
    because the most effective first-line agents carry augmentation risk.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: sleep
    term:
      id: GO:0030431
      label: sleep
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34732752
    reference_title: Restless legs syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Symptoms vary considerably in age at onset, frequency and severity, with
      severe forms affecting sleep, quality of life and mood.
    explanation: >-
      Establishes both the sleep and mood consequences and the wide severity
      distribution that governs the treatment threshold.

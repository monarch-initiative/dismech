discussions:
- discussion_id: gap_augmentation_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the mechanism of dopaminergic augmentation, and can it be predicted
    or prevented?
  attaches_to:
  - pathophysiology#Altered Dopaminergic Signalling with Relative Dopamine Excess
  rationale: >-
    Augmentation is the central clinical problem of this disorder and one of the
    few examples in medicine of a treatment reliably converting into an
    exacerbation of the disease it treats. It is the strongest available probe
    of the dopaminergic node: a deficiency model has no account of it, while an
    excess-plus-receptor-downregulation model predicts it, so establishing its
    mechanism would settle the direction of the dopaminergic abnormality.
    Practically, there is no way to identify in advance which patients will
    augment, and by the time it appears the dopaminergic agent is difficult to
    withdraw. Low iron status is a suspected risk factor, which - if confirmed -
    would tie augmentation risk back to the trigger node and make iron repletion
    a preventive as well as a therapeutic intervention.
  proposed_experiments:
  - experiment_id: exp_augmentation_iron_stratified_cohort
    name: Iron-stratified prospective cohort of dopaminergic initiation
    description: >-
      Prospective follow-up of treatment-naive patients starting a dopamine
      agonist, stratified at baseline by peripheral iron status and, where
      feasible, by brain iron on quantitative susceptibility MRI, with augmentation
      as the outcome; testing whether the trigger node's severity predicts the
      complication and whether prior iron repletion reduces its incidence.
- discussion_id: gap_iron_to_symptom_step
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does regional brain iron deficiency produce a rest-dependent, circadian
    sensory urge?
  attaches_to:
  - pathophysiology#Regional Brain Iron Deficiency
  - pathophysiology#Sensorimotor Network Hyperexcitability
  rationale: >-
    The two ends of this entry's causal chain are each well supported and the
    middle is not: the iron deficit is demonstrated neuropathologically and the
    clinical phenomenology is precisely characterised, but the step between them
    is explicitly unknown, which is why the downstream edges here carry unknown
    intermediates. Two features of the symptom are especially unexplained by an
    iron-and-dopamine account. Its circadian timing follows endogenous phase
    rather than time awake, implicating an interaction with the circadian system
    that neither the iron nor the dopamine arm addresses; and its immediate,
    complete relief by voluntary movement implies a sensorimotor gating
    mechanism rather than a static excitability change.
  proposed_experiments:
  - experiment_id: exp_forced_desynchrony_rls_symptom_timing
    name: Forced desynchrony of restless legs symptom timing
    description: >-
      A forced-desynchrony protocol dissociating circadian phase from time
      awake in patients with restless legs syndrome, with symptom intensity and
      periodic limb movement rate as outcomes, to establish which of the two the
      symptom rhythm follows and whether iron status modifies the amplitude of
      that rhythm.

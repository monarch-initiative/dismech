genetic:
- name: MEIS1
  notes: >-
    The strongest common-variant association in restless legs syndrome and one of
    the strongest reported for any common disease. Risk variants are non-coding,
    concentrated in a linkage-disequilibrium block in intron 8, and act by
    reducing MEIS1 expression rather than by altering the protein. Carriers of
    the risk haplotype show lower MEIS1 mRNA and protein in blood and thalamus.
  gene_term:
    preferred_term: MEIS1
    term:
      id: hgnc:7000
      label: MEIS1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:31551905
    reference_title: "MEIS1 and Restless Legs Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this gene shows a lower expression of mRNA and protein in blood and
      thalamus of individuals with the MEIS1 RLS risk haplotype
    explanation: >-
      Establishes the direction of effect - reduced expression - which is what
      makes this a regulatory rather than a coding mechanism.
  - reference: PMID:31551905
    reference_title: "MEIS1 and Restless Legs Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The MEIS1 GWAS signals are some of the strongest genetic associations
      reported for any common disease.
    explanation: >-
      Records the unusual effect size that distinguishes this association from a
      typical common-disease signal.
- name: BTBD9
  notes: >-
    A common intronic variant at BTBD9 confers susceptibility, and the genetics
    identify it specifically as a determinant of periodic limb movements in
    sleep rather than of the restless legs sensory phenotype. The at-risk allele
    also lowers serum ferritin, connecting the locus to iron status.
  gene_term:
    preferred_term: BTBD9
    term:
      id: hgnc:21228
      label: BTBD9
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:17634447
    reference_title: A genetic risk factor for periodic limb movements in sleep.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we observed a genomewide significant association with a common variant in
      an intron of BTBD9 on chromosome 6p21.2
    explanation: >-
      The primary association finding for this locus.
  - reference: PMID:17634447
    reference_title: A genetic risk factor for periodic limb movements in sleep.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With this variant, the population attributable risk of RLS with periodic
      limb movements was approximately 50%.
    explanation: >-
      Quantifies the population impact of the locus in the phenotype it is
      specific to.
inheritance:
- name: Complex/Multifactorial
  description: >-
    Highly heritable but not Mendelian: twin and familial aggregation studies
    place heritability at roughly 54-69%, while identified common variants
    explain under 10% of it. Linkage studies in large multiplex families
    identified loci but no causative variant, and results were often not
    reproducible - which is why the field moved to association study designs.
  evidence:
  - reference: PMID:31551905
    reference_title: "MEIS1 and Restless Legs Syndrome: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twin studies and a familial aggregation analysis estimated the heritability
      of RLS between 54.0 and 69.4%, thus there is a strong genetic element to
      the disease
    explanation: >-
      Quantifies heritability, establishing a strong genetic contribution
      without a Mendelian architecture.
treatments:
- name: Intravenous Ferric Carboxymaltose
  description: >-
    Iron repletion is the only treatment directed at the entry's trigger node
    rather than at its downstream consequences, and it is the mechanistically
    most interesting: a single intravenous dose can produce prolonged benefit,
    consistent with correcting a compartment rather than maintaining a drug
    level. Two caveats are curated deliberately. The effect is slow - in a
    randomised trial in iron-deficient non-anaemic patients the difference from
    placebo was not significant at 4 weeks and became significant only by 12
    weeks - which means a 4-week endpoint will call it a failure. And oral iron
    is not a substitute: it is non-efficacious in iron-sufficient patients, which
    is what a compartment-specific rather than systemic deficiency predicts.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ferric carboxymaltose
      term:
        id: NCIT:C166915
        label: Ferric Carboxymaltose
  target_mechanisms:
  - target: Regional Brain Iron Deficiency
    treatment_effect: INHIBITS
    description: >-
      Parenteral iron raises the iron available for central uptake, addressing
      the trigger node directly rather than modulating downstream signalling.
  evidence:
  - reference: PMID:28643901
    reference_title: "Ferric carboxymaltose in patients with restless legs syndrome and nonanemic iron deficiency: A randomized trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ferric carboxymaltose treatment (n = 59) led to nonsignificant improvement
      over placebo (n = 51) in International Restless Legs Syndrome Severity Scale
      score at week 4
    explanation: >-
      Cited as PARTIAL and deliberately: the primary endpoint was negative. The
      benefit emerged only at the secondary 12-week timepoint, so the evidence
      supports a delayed effect rather than an established one.
  - reference: PMID:29756335
    reference_title: "Treatment of restless legs syndrome: Evidence-based review and implications for clinical practice (Revised 2017)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intravenous ferric carboxymaltose and pneumatic compression devices are
      considered likely efficacious in idiopathic restless legs syndrome.
    explanation: >-
      The evidence-based review's own grading - "likely efficacious" rather than
      "efficacious" - which is the calibration this treatment is curated at.
  - reference: PMID:29756335
    reference_title: "Treatment of restless legs syndrome: Evidence-based review and implications for clinical practice (Revised 2017)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Oral iron is nonefficacious in iron-sufficient subjects, but its benefit for
      patients with low peripheral iron status has not been adequately evaluated.
    explanation: >-
      Supports the distinction between routes of iron repletion, and is
      consistent with the trigger node being a compartment-specific rather than
      systemic deficiency.
- name: Alpha-2-Delta Ligand (Gabapentin Enacarbil, Pregabalin)
  description: >-
    Ligands of the alpha-2-delta subunit of the voltage-gated calcium channel,
    which reduce presynaptic neurotransmitter release including glutamate. They
    are as effective as a dopamine agonist in head-to-head meta-analysis while
    carrying substantially less augmentation risk, and are increasingly
    preferred first-line for that reason. Their efficacy is also the strongest
    single argument that the disorder's effector node is not purely
    dopaminergic - a drug with no dopaminergic action should not work as well as
    one that has it, if the mechanism were dopaminergic.

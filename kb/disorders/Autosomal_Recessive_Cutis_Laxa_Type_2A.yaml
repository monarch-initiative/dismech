- name: Familial Variant Testing and Counseling
  presence: PRESENT
  description: >-
    Confirm parental variants to assess recurrence and offer familial-variant testing to at-risk siblings.
    Once the causative familial variants are identified, carrier testing, prenatal testing and preimplantation
    genetic testing are possible.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is appropriate to test older and younger sibs for presence of the ATP6V0A2 pathogenic variants found
      in the proband in order to identify as early as possible those who would benefit from institution of
      treatment and preventive measures.
    explanation: >-
      The chapter recommends early recognition of affected siblings.
  - reference: PMID:20301755
    reference_title: "ATP6V0A2-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once the ATP6V0A2 pathogenic variants have been identified in an affected
      family member, carrier testing for at-risk relatives, prenatal testing for a
      pregnancy at increased risk, and preimplantation genetic testing for
      ATP6V0A2-related cutis laxa are possible.
    explanation: >-
      The reproductive options available once the family's variants are known.
    quote_role: REVIEW_SYNTHESIS

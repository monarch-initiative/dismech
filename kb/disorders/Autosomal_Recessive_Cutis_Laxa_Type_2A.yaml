experimental_models:
- name: ATP6V0A2 patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Primary skin fibroblasts from individuals with biallelic ATP6V0A2 variants
  publication: PMID:19321599
  description: >-
    Patient-derived cultures demonstrate Golgi swelling, delayed tropoelastin secretion with intracellular
    retention, reduced mature elastin deposition and increased TUNEL staining. Selected patient-cell lines
    also show increased TGF-beta signaling in the 2012 study. These are culture findings, not skin-biopsy measurements.
  modeled_mechanisms:
  - target: Tropoelastin Retention and Impaired Secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Pulse-chase assays directly measure delayed secretion and retention.
    limitations: >-
      The assays demonstrate impairment rather than complete blockade and do not measure every clinical allele.
    evidence:
    - reference: PMID:19321599
      reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Immunostaining of ARCL2 cells showed the accumulation of tropoelastin (TE) in the Golgi and in large,
        abnormal intracellular and extracellular aggregates.
      explanation: >-
        Measured localization and accumulation in patient cells.
    - reference: PMID:19321599
      reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Pulse-chase studies confirmed impaired secretion and increased intracellular retention of TE, and insoluble
        elastin assays showed significantly reduced extracellular deposition of mature elastin.
      explanation: >-
        Pulse-chase and deposition readouts distinguish impaired secretion from a complete block.
  - target: Reduced Mature Elastin Deposition
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Insoluble-elastin assays measure reduced extracellular deposition.
    limitations: >-
      Normal fibrillin assembly and preserved or elevated secreted LOX activity do not establish that every
      crosslinking or matrix component is normal.
    evidence:
    - reference: PMID:19321599
      reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Despite normal microfibrillar network and elevated LOX activity, elastin staining using an antibody
        against
        the alpha elastin fraction of insoluble elastin revealed a diminished elastic fiber network in all
        three
        ARCL2 fibroblast lines tested.
      explanation: >-
        Main-text result supports impaired deposition with preserved scaffold and non-reduced measured LOX
        activity.
  - target: Increased Fibroblast Apoptosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      TUNEL assays demonstrate increased apoptosis in patient-cell cultures.
    limitations: >-
      Unchanged culture density means that lower cell number alone does not explain reduced elastin deposition.
    evidence:
    - reference: PMID:19321599
      reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        TUNEL staining demonstrated increased rates of apoptosis in ARCL2 cell cultures.
      explanation: >-
        Direct cell-culture apoptosis observation.
  - target: Increased TGF-beta Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Patient fibroblast studies identify increased signaling.
    limitations: >-
      This finding does not establish the clinical effectiveness of a TGF-beta-directed treatment.
    evidence:
    - reference: PMID:22773132
      reference_title: Further characterization of ATP6V0A2-related autosomal recessive cutis laxa.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Furthermore, fibroblasts from patients with ATP6V0A2 mutations displayed elevated TGF-β signalling
        and
        increased TGF-β1 levels in the supernatant.
      explanation: >-
        Measured signaling and ligand-level changes in patient cells.
- name: ATP6V0A2-depleted HeLa cells
  experimental_model_type: CELL_LINE
  cell_source: HeLa cells treated with ATP6V0A2 siRNA
  publication: PMID:19321599
  description: >-
    Acute ATP6V0A2 knockdown disrupts the Golgi ribbon and produces swollen cisternae. This heterologous depletion
    system is distinct from patient dermal fibroblasts.
  modeled_mechanisms:
  - target: Impaired Golgi Trafficking
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The perturbation reproduces abnormal Golgi morphology associated with the trafficking defect.
    limitations: >-
      Morphology is an indirect readout; these HeLa experiments do not themselves establish tropoelastin secretion
      or clinical penetrance.
    evidence:
    - reference: PMID:19321599
      reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Electron microscopy (EM) showed tight Golgi stacks in control cells (Fig.5C) and swelling of the cisternae
        in knockdown cells (Fig.5D).
      explanation: >-
        Direct morphology result from siRNA-treated HeLa cells.
- name: Atp6v0a2-mutant mouse embryonic fibroblasts
  experimental_model_type: CELL_LINE
  cell_source: E13.5 mouse embryonic fibroblasts immortalized with SV40 large T antigen
  publication: PMID:39680136
  description: >-
    Cells derived from wild-type, knockout and R755Q knock-in embryos were used for trans-Golgi pH and trafficking
    assays. Reported mean pH values were 5.80, 6.52 and 6.25, respectively. Golgi collapse after brefeldin
    A and anterograde TNF-alpha transport were delayed. These are in-vitro measurements, not direct measurements
    of human tissue or whole-mouse organ pH.
  modeled_mechanisms:
  - target: Elevated Trans-Golgi Luminal pH
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ratiometric measurement directly demonstrates a pH increase in both mutant cultures.
    limitations: >-
      The smaller pH shift in knock-in cells does not predict the stronger neuronal abnormality in knock-in
      mice.
    evidence:
    - reference: PMID:39680136
      reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Measurement of the pH in the trans Golgi compartment revealed a shift from 5.80 in wildtype to 6.52
        in
        Atp6v0a2-/- and 6.25 in Atp6v0a2RQ/RQ.
      explanation: >-
        Measurements were performed in immortalized MEFs; no universal patient severity biomarker is established.
  - target: Impaired Golgi Trafficking
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Drug-challenge and cargo-transport assays measure distinct trafficking abnormalities.
    limitations: >-
      The experiments do not establish brefeldin A as a clinical diagnostic test.
    evidence:
    - reference: PMID:22773132
      reference_title: Further characterization of ATP6V0A2-related autosomal recessive cutis laxa.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Investigation of brefeldin A-induced Golgi collapse in dermal fibroblasts as well as in HeLa cells
        deficient
        for ATP6V0A2 revealed a delay, which was absent in cells deficient for the ARCL-associated proteins
        GORAB
        or PYCR1.
      explanation: >-
        Experimental comparison in specified deficient-cell systems.
    - reference: PMID:19321599
      reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Loss of ATP6V0A2 either by siRNA knockdown or in ARCL2 cells resulted in distended Golgi cisternae,
        accumulation
        of abnormal lysosomes and multivesicular bodies.
      explanation: >-
        Cellular ultrastructure accompanies the trafficking defect.
diagnosis:
- name: Molecular Diagnosis
  presence: PRESENT
  description: >-
    Diagnosis requires suggestive findings and biallelic pathogenic or likely pathogenic ATP6V0A2 variants.
    A cutis laxa/connective-tissue/glycosylation multigene panel or comprehensive genomic testing is preferred
    because clinical overlap is substantial. Testing should include appropriate deletion/duplication analysis;
    exome sequencing alone may not detect every exon-level or larger deletion. Two variants of uncertain significance,
    or one pathogenic variant with one VUS, neither establish nor exclude the diagnosis.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of ATP6V0A2-related cutis laxa is established by the presence of suggestive findings and
      biallelic pathogenic (or likely pathogenic) variants in ATP6V0A2 identified by molecular genetic testing
      (see Table 1).
    explanation: >-
      The full chapter includes likely pathogenic variants in the diagnostic standard.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      recommended molecular genetic testing approaches include use of a multigene panel or comprehensive genomic
      testing.
    explanation: >-
      GeneReviews favors a panel or genomic approach over routine single-gene testing.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification of biallelic ATP6V0A2 variants of uncertain significance (or of one known ATP6V0A2 pathogenic
      variant and one ATP6V0A2 variant of uncertain significance) does not establish or rule out the diagnosis.
    explanation: >-
      The VUS limitation applies even when one pathogenic allele is present.
  - reference: PMID:41732832
    reference_title: "ATP6V0A2-Related Cutis Laxa: Identification of a Recurrent Exon 16 Deletion With Founder Effect in Southeastern Türkiye and a Novel Frameshift Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This study expands the genotypic and phenotypic spectrum of ATP6V0A2-CL and underscores the importance
      of copy number variation detection in next-generation sequencing-based diagnostics.
    explanation: >-
      The recurrent exon deletion illustrates why structural-variant detection matters.
- name: Transferrin and Apolipoprotein C-III Isoelectric Focusing
  presence: PRESENT
  description: >-
    Serum transferrin and apolipoprotein C-III assays assess N-linked and mucin-type O-linked glycosylation,
    respectively. Abnormal results support the diagnosis but are neither unique to ATP6V0A2 nor obligatory
    in both assays at every age. Transferrin may be normal in early infancy; normal or inconclusive O-glycosylation
    does not exclude disease. Glycosylation testing complements molecular testing rather than selecting one
    gene with validated sensitivity.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      infants may have a normal transferrin isofocusing profile in the first months of life
    explanation: >-
      The full chapter identifies an early false-negative limitation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Note: Abnormal O-glycosylation is supportive of the diagnosis, but a normal or inconclusive result does
      not eliminate the possibility of ATP6V0A2-related cutis laxa.
    explanation: >-
      A normal O-glycosylation profile cannot rule out the diagnosis.
  - reference: PMID:19321599
    reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Abnormal N- and/or mucin type O-glycosylation was observed in all patients tested.
    explanation: >-
      The primary study allows isolated abnormalities, unlike a mandatory combined-screen criterion.
  markers: Serum transferrin isoforms; serum apolipoprotein C-III isoforms
- name: Baseline Neurologic and Developmental Assessment
  presence: PRESENT
  description: >-
    Assess development and obtain brain MRI to characterize cortical and cerebellar findings. EEG is recommended
    when seizures are suspected; an abnormal MRI is not a substitute for molecular confirmation.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      • Baseline neurodevelopmental eval • Brain MRI • EEG if seizures are suspected
    explanation: >-
      Direct baseline evaluation recommendations.
- name: Musculoskeletal, Hernia and Cardiac Assessment
  presence: PRESENT
  description: >-
    Evaluate hip stability and inguinal hernias. GeneReviews recommends hip ultrasound as needed in newborns
    and a pelvic radiograph for an older child at diagnosis. Echocardiography assesses valvular dysplasia and
    can characterize reported aortic-root widening.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      • For newborns: clinical exam w/hip ultrasound as needed • For older child at diagnosis: pelvic radiograph
      (1x only) to identify hip dysplasia in the event that hip dislocation was not treated properly
    explanation: >-
      Age-specific hip evaluation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"

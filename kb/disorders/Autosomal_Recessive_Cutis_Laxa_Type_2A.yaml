    explanation: >-
      The developmental and psychological management recommendation.
animal_models:
- name: Atp6v0a2 knock-out mouse
  species: Mouse
  genotype: Atp6v0a2-/- (null)
  publication: PMID:39680136
  description: >-
    Constitutive null. Trans-Golgi pH 6.52 against a wild-type 5.80, with reduced
    growth, dermis thickness and elastic fibre formation.
  modeled_mechanisms:
  - target: Elevated Trans-Golgi Luminal pH
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Provides the direct pH measurement that defines this node, and the largest
      pH shift of the two models.
    limitations: >-
      A null allele removes the protein entirely, so it cannot distinguish loss of
      proton transport from loss of any other function of the subunit. That is
      precisely what the knock-in below was made to do, and the two must be read
      together.
    readouts:
    - name: Trans-Golgi luminal pH
      target: Elevated Trans-Golgi Luminal pH
      direction: INCREASED
      interpretation: >-
        pH rises from 5.80 in wild type to 6.52 in the null - the larger of the two
        mutant shifts.
      evidence:
      - reference: PMID:39680136
        reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Measurement of the pH in the trans Golgi compartment revealed a shift
          from 5.80 in wildtype to 6.52 in Atp6v0a2-/- and 6.25 in Atp6v0a2RQ/RQ.
        explanation: >-
          The measured values for both genotypes.
    evidence:
    - reference: PMID:39680136
      reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous mutants from both strains displayed a reduction of growth,
        dermis thickness, and elastic fiber formation compatible with WSS.
      explanation: >-
        Establishes that the model reproduces the human connective-tissue
        phenotype, which is what makes its pH measurement informative for the
        disease.
- name: Atp6v0a2 R755Q knock-in mouse
  species: Mouse
  genotype: Atp6v0a2RQ/RQ (R755Q missense, proton transport selectively abolished)
  publication: PMID:39680136
  description: >-
    The separation-of-function model, and the more informative of the pair. R755Q
    abolishes V0a2-mediated proton transport while leaving the subunit in place, so
    any phenotype it produces is attributable to the pumping activity rather than
    to the protein's presence.
  modeled_mechanisms:
  - target: Elevated Trans-Golgi Luminal pH
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Establishes that proton transport is the disease-relevant function: removing
      only the transport raises pH to 6.25 and reproduces the connective-tissue
      phenotype.
    limitations: >-
      The pH shift is smaller than the null's, so the two models are not
      interchangeable, and a phenotype milder in this line than in the null could
      reflect either residual pumping or a retained non-pumping function of the
      protein.
    readouts:
    - name: Trans-Golgi luminal pH
      target: Elevated Trans-Golgi Luminal pH
      direction: INCREASED
      interpretation: >-
        pH 6.25, intermediate between wild type and the null, from a lesion that
        removes proton transport alone.
      evidence:
      - reference: PMID:39680136
        reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We used knock-out (Atp6v0a2-/-) and knock-in (Atp6v0a2RQ/RQ) mice
          harboring the R755Q missense mutation selectively abolishing
          V0a2-mediated proton transport to investigate the WSS pathomechanism.
        explanation: >-
          States what the knock-in isolates, which is what licenses attributing the
          phenotype to proton transport.
    evidence:
    - reference: PMID:39680136
      reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous mutants from both strains displayed a reduction of growth,
        dermis thickness, and elastic fiber formation compatible with WSS.
      explanation: >-
        The knock-in reproduces the connective-tissue phenotype, so abolishing
        proton transport alone is sufficient for it.
  - target: Aberrant Cortical Neuron Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the migration abnormality and the associated seizures, and links
      them to reduced O-mannosylation of alpha-dystroglycan.
    limitations: >-
      Graded PARTIALLY_RECAPITULATES because of a specific discordance rather than
      a general species caveat. The knock-in shows more abnormal migration than
      the null despite a smaller pH shift, which the simple pH-dose model does not
      predict, and the human neuronal phenotype is characterised by imaging and
      clinical features rather than by the histology this readout measures.
    readouts:
    - name: Cortical neuron migration and alpha-dystroglycan O-mannosylation
      target: Aberrant Cortical Neuron Migration
      direction: DECREASED
      interpretation: >-
        More abnormal migration than in the null, correlating with seizures, and
        with reduced O-mannosylation of alpha-dystroglycan as the proposed route.
      evidence:
      - reference: PMID:39680136
        reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Atp6v0a2RQ/RQ mutants displayed more abnormal migration of cortical
          neurons, correlating with seizures and a reduced O-mannosylation of
          α-dystroglycan.
        explanation: >-
          The measured migration abnormality, its seizure correlate, and the
          dystroglycan mechanism.
    evidence:
    - reference: PMID:39680136
      reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings suggest that altered O-glycosylation is more relevant for the
        WSS pathomechanism than N-glycosylation and leads to a secondary
        dystroglycanopathy.
      explanation: >-
        Supports treating this model as informative for the neuronal node, by way
        of the O-glycosylation limb.
experimental_models:
- name: ATP6V0A2 patient dermal fibroblasts and siRNA-knockdown HeLa cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary dermal fibroblasts from ARCL2A patients, alongside HeLa cells depleted
    of ATP6V0A2 by siRNA. Read out by Golgi ultrastructure, brefeldin-A-induced
    retrograde transport, tropoelastin pulse-chase and immunostaining, insoluble
    elastin assay, TUNEL, and TGF-beta1 in the supernatant.
  modeled_mechanisms:
  - target: Tropoelastin Secretion Block
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      This is where the secretion block was demonstrated, in cells carrying the
      patient's own genotype rather than in a heterologous overexpression system.
    limitations: >-
      A cultured dermal fibroblast is not dermis, so the assay measures the cell's
      secretory behaviour and infers the tissue consequence. The mouse
      dermis-thickness measurement is what closes that gap.
    readouts:
    - name: Extracellular mature elastin deposition
      target: Tropoelastin Secretion Block
      direction: DECREASED
      interpretation: >-
        Insoluble-elastin assay shows significantly reduced deposition of mature
        elastin, with tropoelastin retained intracellularly.
      evidence:
      - reference: PMID:19321599
        reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Pulse-chase studies confirmed impaired secretion and increased
          intracellular retention of TE, and insoluble elastin assays showed
          significantly reduced extracellular deposition of mature elastin.
        explanation: >-
          The quantitative readout behind this node.
    evidence:
    - reference: PMID:19321599
      reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Loss of ATP6V0A2 either by siRNA knockdown or in ARCL2 cells resulted in
        distended Golgi cisternae, accumulation of abnormal lysosomes and
        multivesicular bodies.
      explanation: >-
        Two independent routes to the same cellular phenotype - patient genotype
        and acute knockdown - which is what makes the model informative rather than
        merely descriptive.
diagnosis:
- name: Combined transferrin and apolipoprotein C-III isoelectric focusing
  presence: PRESENT
  description: >-
    The first-line screen, and the step that selects ATP6V0A2 out of the
    genetically heterogeneous cutis laxa group before sequencing. Transferrin
    focusing detects the N-linked limb and apolipoprotein C-III focusing the
    O-linked one; it is the combination that points at a Golgi-homeostasis defect
    rather than an endoplasmic-reticulum one or a single-enzyme CDG.

    Every ATP6V0A2 patient in the prospective neurometabolic cutis laxa cohort had
    abnormal glycosylation, so a normal result argues against the gene more
    strongly than an abnormal one argues for it.
  markers: >-
    Type II transferrin isoform profile on serum transferrin isoelectric focusing,
    together with an abnormal apolipoprotein C-III isoform profile detecting the
    mucin-type O-linked limb.
  results: >-
    A combined N- and O-linked abnormality. Either limb alone points elsewhere:
    an isolated transferrin abnormality is compatible with many CDGs, and it is
    the pairing that localises the defect to Golgi homeostasis.
  evidence:
  - reference: PMID:23963297
    reference_title: "Clinical and biochemical features guiding the diagnostics in neurometabolic cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with ATP6V0A2 defects had abnormal glycosylation.
    explanation: >-
      The sensitivity of the screen within the genetically confirmed group.
  notes: >-
    `Diagnosis.markers` is a single free-text string with no ontology binding, so
    a two-analyte test cannot be represented as two grounded markers here - both
    are named in one sentence instead. The HP term for the transferrin finding,
    HP:0012301, is carried on the corresponding `phenotypes` and `biochemical`
    entries, which is where it can be validated.
- name: ATP6V0A2 molecular genetic testing
  presence: PRESENT
  description: >-
    Confirmatory, and required: the cutis laxa syndromes overlap too much
    clinically for the diagnosis to be made on features alone. GeneReviews states
    the diagnosis is established by suggestive findings plus biallelic pathogenic
    ATP6V0A2 variants.
  results: >-
    Biallelic pathogenic ATP6V0A2 variants. Most are predicted null and subject to
    nonsense-mediated decay, so a sequencing-only approach that finds one allele
    should be followed by deletion and duplication analysis.
  evidence:
  - reference: PMID:20301755
    reference_title: "ATP6V0A2-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ATP6V0A2-related cutis laxa is established by the presence
      of suggestive findings and biallelic pathogenic variants in ATP6V0A2
      identified by molecular genetic testing.
    explanation: >-
      The diagnostic standard, stated as requiring both clinical findings and
      genotype.
  - reference: PMID:19401719
    reference_title: "Autosomal recessive cutis laxa syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In several other clinically similar autosomal recessive syndromes, however,
      the classic histological anomalies are absent, and the definite diagnosis
      remains uncertain.
    explanation: >-
      Why molecular confirmation is required rather than optional - the
      histological criterion is not reliably present across the group.
- name: Annual ophthalmologic examination and EEG surveillance
  presence: PRESENT
  description: >-
    The recommended ongoing surveillance rather than a diagnostic test at
    presentation: annual ophthalmological examination, EEG, and anticonvulsant
    drug-level monitoring.

    The ophthalmological arm has a specific, gene-specific evidence base beyond
    the GeneReviews recommendation. In a prospectively and uniformly examined
    cutis laxa cohort, reduced corrected visual acuity was found only in the
    ATP6V0A2 patients, and all four had corneal tomographic abnormalities - so
    corneal imaging, not just acuity, is the informative examination.
  evidence:
  - reference: PMID:20301755
    reference_title: "ATP6V0A2-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: Annual ophthalmologic examination, EEG, and monitoring of
      anticonvulsive drug levels.
    explanation: >-
      The surveillance schedule.
  - reference: PMID:40043299
    reference_title: "Ocular Manifestations in Congenital Cutis Laxa: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings highlight the impact of elastic fiber disassembly on corneal
      homeostasis and indicate a need for ocular assessment including corneal
      imaging in patients with CL.
    explanation: >-
      Extends the recommendation from acuity to corneal imaging, on the basis of
      the gene-specific corneal findings.
  notes: >-
    Moved here from `treatments:`, where an earlier revision of this entry filed
    it despite its own description saying it was not a treatment. Surveillance
    belongs with diagnosis.
differential_diagnoses:
- name: Other autosomal recessive cutis laxa syndromes
  description: >-
    ARCL is genetically heterogeneous - PYCR1, ALDH18A1, GORAB, RIN2, LTBP4, FBLN5
    and ELN all produce overlapping skin phenotypes, and in early infancy the
    progeroid appearance, dysmorphism, hypotonia and psychomotor delay look much
    the same across them. This is the differential the disease actually sits in.
  distinguishing_features:
  - Abnormal serum glycosylation is present in every ATP6V0A2 patient and is the most useful single discriminator within the group.
  - Epilepsy is commonest in ATP6V0A2 disease; corpus callosum dysgenesis points instead to PYCR1 or ALDH18A1, and dystonic posturing discriminates for those two.
  - The brefeldin-A-induced retrograde transport delay is present in ATP6V0A2-deficient cells and absent in GORAB- and PYCR1-deficient cells.
  evidence:
  - reference: PMID:23963297
    reference_title: "Clinical and biochemical features guiding the diagnostics in neurometabolic cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progeroid symptoms, dysmorphic features, hypotonia and psychomotor
      retardation are highly overlapping in the early phase of these disorders.
      This makes the genetic diagnosis often challenging.
    explanation: >-
      States the overlap that makes this the operative differential.
  - reference: PMID:23963297
    reference_title: "Clinical and biochemical features guiding the diagnostics in neurometabolic cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corpus callosum dysgenesis was associated with PYCR1 and ALDH18A1
      mutations. Dystonic posturing was discriminatory for PYCR1 and ALDH18A1
      defects.
    explanation: >-
      The features that point away from ATP6V0A2, curated as distinguishing
      features above.
  - reference: PMID:22773132
    reference_title: "Further characterization of ATP6V0A2-related autosomal recessive cutis laxa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      revealed a delay, which was absent in cells deficient for the
      ARCL-associated proteins GORAB or PYCR1
    explanation: >-
      The functional assay that separates ATP6V0A2 from two of the main
      differentials at the cell-biology level.
discussions:
- discussion_id: arcl2a_severity_axis_is_not_genotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a disease with a 78% null-allele spectrum show no genotype-phenotype
    correlation, and what variable is severity actually tracking?
  attaches_to:
  - "genetic#ATP6V0A2"
  - "pathophysiology#Elevated Trans-Golgi Luminal pH"
  rationale: >-
    The systematic review of 70 individuals found age at ascertainment to be the
    unique phenotypic discriminator and identified no genotype-phenotype
    correlation. That is an unusual negative result and it is easy to read as
    simply a failure of power, but the mouse data suggest a more interesting
    reading.

    In mice, phenotype severity correlates with trans-Golgi pH - 5.80 wild type,
    6.25 in the transport-dead knock-in, 6.52 in the null - and the pH is what
    varies continuously. Genotype class is only a proxy for it, and a poor one:
    two null alleles can differ in residual transcript, in tissue-specific
    compensation by other V-ATPase a-subunit isoforms, and in developmental
    timing. If the disease variable is a continuous pH shift and the measured
    variable is a categorical allele class, a null correlation is what you would
    expect even with adequate power.

    Age at ascertainment is not an alternative explanation so much as a
    confounder that has not been separated from severity: severe patients present
    early by definition, so the association may be partly circular. Nobody has
    published a cohort with severity scored at a fixed age.

    The practical consequence is a counselling one. In this disease, variant class
    does not support a severity prediction, and the entry says so rather than
    quietly implying otherwise by curating a genotype-severity gradient it cannot
    evidence.
  proposed_experiments:
  - experiment_id: exp_arcl2a_patient_fibroblast_golgi_ph
    name: Golgi pH in patient fibroblasts against phenotype severity
    description: >-
      Measure trans-Golgi luminal pH in dermal fibroblasts from a genotypically
      diverse ARCL2A cohort, using the same ratiometric method as the mouse work,
      and correlate it with a severity score assessed at a fixed age rather than
      at ascertainment. This tests directly whether the mouse's pH-severity
      relationship holds in patients and whether pH explains variance that
      genotype class does not.
    would_support:
    - "pathophysiology#Elevated Trans-Golgi Luminal pH"
    supporting_outcome:
    - Patient fibroblast Golgi pH correlates with age-adjusted severity where genotype class does not.
    would_refute:
    - "pathophysiology#Elevated Trans-Golgi Luminal pH"
    refuting_outcome:
    - Golgi pH is uniform across patients of markedly different severity, placing the severity variable elsewhere.
  evidence:
  - reference: PMID:33369135
    reference_title: "Review of clinical and molecular variability in autosomal recessive cutis laxa 2A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No specific genotype-phenotype correlations were identified.
    explanation: >-
      The negative result this discussion is about.
  - reference: PMID:39680136
    reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Most phenotypic and cellular properties correlate with the different
      degrees of trans Golgi pH elevation in both mutants underlining the
      fundamental relevance of pH regulation in the secretory pathway.
    explanation: >-
      The mouse pH-severity relationship that motivates looking for the same
      variable in patients.
- discussion_id: arcl2a_globozoospermia_untested_in_humans
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do men with ARCL2A have globozoospermia and infertility, as both mouse models
    do?
  attaches_to:
  - "pathophysiology#Combined N- and O-Glycosylation Defect"
  rationale: >-
    Both the null and the knock-in mouse are male-infertile from globozoospermia,
    with impaired Golgi-derived acrosome formation and abolished mucin-type
    O-glycosylation in spermatids. The mechanism is the same one that produces the
    rest of the disease - the acrosome is a Golgi-derived organelle - so there is
    no obvious reason it would be mouse-specific.

    No corresponding human observation exists. The paper describes the finding as
    hitherto unrecognised, and the clinical literature on ARCL2A does not report
    fertility outcomes at all - which is unsurprising given that the severe
    phenotype presents in infancy, but conspicuous now that an attenuated adult
    phenotype is established and those men reach reproductive age.

    This is a HUMAN_MODEL_MISMATCH in the weaker of the two possible senses: not
    a model finding contradicted in humans, but a model finding never looked for
    in humans, where the mechanism predicts it should be present. It is curated
    because the actionable step is small - a semen analysis in an adult male
    patient - and because the absence of any human data is easy to mistake for
    absence of the phenotype.

    Nothing in this entry asserts that human patients are infertile, and a
    counselling conversation should not use this discussion as though it did.
  proposed_experiments:
  - experiment_id: exp_arcl2a_semen_analysis
    name: Semen analysis in adult males with ATP6V0A2 variants
    description: >-
      Offer semen analysis with acrosome morphology assessment to adult men with
      biallelic ATP6V0A2 variants identified through the attenuated-phenotype
      route, and report the results whether positive or negative.
    would_support:
    - "pathophysiology#Combined N- and O-Glycosylation Defect"
    supporting_outcome:
    - Round-headed, acrosome-deficient spermatozoa in men with biallelic ATP6V0A2 variants, matching the mouse acrosome phenotype.
    would_refute:
    - "pathophysiology#Combined N- and O-Glycosylation Defect"
    refuting_outcome:
    - Normal sperm morphology and acrosome formation in affected men, making the mouse globozoospermia species-specific.
  evidence:
  - reference: PMID:39680136
    reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A hitherto unrecognized male infertility due to globozoospermia was evident
      in both mouse lines with impaired Golgi-derived acrosome formation and
      abolished mucin-type O-glycosylation in spermatids.
    explanation: >-
      The model finding, in both lines, together with its mechanism - and the
      authors' own statement that it was previously unrecognised.
notes: >-
  Lump/split call. Wrinkly skin syndrome is curated as a has_subtypes entry
  rather than a separate disease, on the ground that the same ATP6V0A2 variants
  cause both and the gene-discovery paper ascertained the two labels together. The
  stub's MONDO context supported this: MONDO:0018163 lists exactly one descendant,
  MONDO:0010208 wrinkly skin syndrome.

  On frequency bands. Four phenotypes - seizures, developmental delay, high/cleft
  palate and facial dysmorphism - are curated FREQUENT on the strength of a
  systematic review that reports their association with age at ascertainment and
  its p value, not their prevalence. The band is therefore a coarse literature
  reading, and the p values in the snippets should not be mistaken for frequency
  data. Where a real denominator exists it is stated instead: 4/4 for the corneal
  finding, all-patients for the glycosylation abnormality.

  Terminology. The disease appears in the literature under at least four names -
  ARCL2A, ATP6V0A2-CDG, cutis laxa Debre type, and wrinkly skin syndrome - and
  they are indexed inconsistently. A search on any one of them alone will miss
  papers; the synonym list here is meant to be used.

  On the GeneReviews chapter, and how it was missed. PMID:20301755
  (ATP6V0A2-Related Cutis Laxa) was absent from the first revision of this entry
  and is now the source for eleven phenotypes, the diagnosis section, two
  treatments and the counselling content on `inheritance`. Its absence was a
  process failure rather than a judgement call: the deep-research report did not
  surface it, and no GeneReviews-specific search was run to compensate. It is
  worth stating because the chapter turned out to supply exactly the frequency
  data whose absence the first revision's own notes complained about - the
  entry said "no counted figures exist" while a source giving them went unread.

  Three frequency bands moved as a result, all upward, and one phenotype
  (neurologic regression) was missing entirely while the entry described the
  disease as attenuating with age. That framing was true of the skin and the
  opposite of true for the brain.

  On histopathology. No `histopathology:` section is curated. Abnormal elastic
  fibres are the classic finding and are quoted on the elastic-fibre
  pathophysiology node, but no source fetched here describes the stain, the
  fibre morphology, or the biopsy site in quotable terms - and a histopathology
  entry saying only "abnormal elastic fibres" would duplicate the phenotype
  without adding the detail that section exists to carry.

  Not curated for want of quotable evidence in the sources fetched here: the
  founder exon 16 deletion reported in southeastern Turkiye, the heterotopic
  calcifications and progressive dysmorphism described in the oldest reported
  patient, and retinal and chorioretinal scarring (a single case report).

  Provenance. Built from primary literature with an OpenScientist deep-research
  report run alongside and committed under research/. The report supplied four
  of the eight references - the systematic review, the neurometabolic cutis laxa
  cohort, the ocular case series and the 2024 mouse study - each verified on
  PubMed and fetched through 'just fetch-reference' before use. Two of the
  report's own suggestions were not followed: it proposed GO:0006486 for protein
  glycosylation, which its term-validation section correctly flagged as obsolete,
  and it labelled HP:0002269 "Abnormal cortical gyration" when that identifier
  is "Abnormality of neuronal migration" - this entry uses HP:0002536, which is
  the term that label names. It also gave ATP6V0A2 as HGNC:865, which is wrong;
  the correct identifier is hgnc:18481, as the curation stub recorded.

    explanation: >-
      Baseline cardiac imaging for valvular disease.
- name: Ophthalmic Evaluation and Surveillance
  presence: PRESENT
  description: >-
    Perform refraction, slit-lamp and fundus examination at diagnosis. GeneReviews recommends annual ophthalmic
    assessment including refraction for progressive myopia and examination of Bruch's membrane. The small 2025
    mixed-genotype cutis laxa series additionally supports corneal imaging; its four ATP6V0A2 patients do not
    establish population sensitivity or a universal corneal phenotype.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

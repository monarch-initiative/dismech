- name: Tropoelastin Secretion Block
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Tropoelastin accumulates in the Golgi and forms abnormal intracellular and
    extracellular aggregates; pulse-chase confirms impaired secretion and
    increased intracellular retention, and insoluble-elastin assays show
    significantly reduced deposition of mature extracellular elastin. Apoptosis of
    elastogenic cells is increased.

    Two negatives from the same experiments are what localise the lesion, and they
    are worth as much as the positive finding. Fibrillin-1 microfibril assembly is
    normal, and secreted lysyl oxidase activity is normal. So the defect is in
    getting tropoelastin out of the cell, not in the microfibrillar scaffold it
    deposits onto and not in the cross-linking step that matures it.

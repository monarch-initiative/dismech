inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic ATP6V0A2 variants cause autosomal recessive disease. Confirming parental variants
    supports recurrence assessment. With two heterozygous carrier parents, each conception has a 25% affected,
    50% carrier and 25% unaffected non-carrier probability. Familial-variant testing permits carrier assessment
    and prenatal or preimplantation genetic testing. Expression varies and variant class does not reliably
    predict severity.
  evidence:
  - reference: PMID:20301755
    reference_title: "ATP6V0A2-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If both parents are known to be heterozygous for an ATP6V0A2 pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of being affected, a 50% chance of being an asymptomatic carrier, and a 25%
      chance of being unaffected and not a carrier.
    explanation: >-
      The recurrence risks curated in the description above.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301755
    reference_title: "ATP6V0A2-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once the ATP6V0A2 pathogenic variants have been identified in an affected
      family member, carrier testing for at-risk relatives, prenatal testing for a
      pregnancy at increased risk, and preimplantation genetic testing for
      ATP6V0A2-related cutis laxa are possible.
    explanation: >-
      The reproductive options available once the family's variants are known.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: Biallelic ATP6V0A2 Loss of Function
  description: >-
    Biallelic pathogenic variants impair the a2 subunit of the V-type H+-ATPase. Coding truncations, splice
    variants, missense changes and exon or larger deletions are reported. Reduced or absent protein was measured
    in selected patient fibroblasts; this does not demonstrate complete protein absence for every disease allele.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:18157129
    reference_title: Impaired glycosylation and cutis laxa caused by mutations in the vesicular H+-ATPase subunit ATP6V0A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified loss-of-function mutations in ATP6V0A2, encoding the a2 subunit of the V-type H+ ATPase,
      in several families with autosomal recessive cutis laxa type II or wrinkly skin syndrome.
    explanation: >-
      Founding gene-disease association.
  - reference: PMID:22773132
    reference_title: Further characterization of ATP6V0A2-related autosomal recessive cutis laxa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Furthermore, we demonstrate a localization of ATP6V0A2 at the Golgi-apparatus and a loss of the mutated
      ATP6V0A2 protein in patients' dermal fibroblasts.
    explanation: >-
      Protein localization and loss in the assayed patient cells; not a universal allelic consequence.

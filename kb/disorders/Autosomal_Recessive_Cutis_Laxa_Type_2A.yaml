- name: Impaired Golgi Trafficking
  description: >-
    Patient fibroblasts and ATP6V0A2-depleted cells show disrupted Golgi organization and delayed brefeldin-A-induced
    redistribution of Golgi membranes to the ER. This drug-challenge phenotype was absent in the tested GORAB-
    and PYCR1-deficient controls, but it is not a validated disease-specific clinical test. Mouse-cell RUSH
    assays separately show delayed anterograde cargo transit.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:22773132
    reference_title: Further characterization of ATP6V0A2-related autosomal recessive cutis laxa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Investigation of brefeldin A-induced Golgi collapse in dermal fibroblasts as well as in HeLa cells deficient
      for ATP6V0A2 revealed a delay, which was absent in cells deficient for the ARCL-associated proteins GORAB
      or PYCR1.
    explanation: >-
      Experimental comparison in specified deficient-cell systems.
  - reference: PMID:19321599
    reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Loss of ATP6V0A2 either by siRNA knockdown or in ARCL2 cells resulted in distended Golgi cisternae, accumulation
      of abnormal lysosomes and multivesicular bodies.
    explanation: >-
      Cellular ultrastructure accompanies the trafficking defect.

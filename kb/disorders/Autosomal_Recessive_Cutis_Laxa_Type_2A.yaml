discussions:
- discussion_id: arcl2a_severity_axis_is_not_genotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which tissue-specific cellular defects explain variable human severity?
  attaches_to:
  - genetic#ATP6V0A2
  - pathophysiology#Elevated Trans-Golgi Luminal pH
  rationale: >-
    The 2021 review found no specific genotype-phenotype correlation. In the mouse comparison, many cellular
    abnormalities were greater in the knockout, but neuronal migration and alpha-dystroglycan O-mannosylation
    were more abnormal in the knock-in despite a smaller fibroblast pH shift. Compensation, mutation-specific
    effects, developmental context and possible pH-independent functions remain unresolved. Mouse fibroblast
    pH is not a validated clinical severity biomarker.
  proposed_experiments:
  - experiment_id: exp_arcl2a_patient_fibroblast_golgi_ph
    name: Patient-cell pH and trafficking against age-adjusted phenotype
    description: >-
      Measure Golgi pH, V0a2 abundance and trafficking in patient-derived cells alongside standardized clinical
      outcomes at comparable ages, and compare findings with relevant neuronal models. Test whether pH explains
      variation independently of genotype and age.
    supporting_outcome:
    - A reproducible association between a measured cellular defect and a specific age-adjusted clinical outcome supports that proposed severity relationship.
    refuting_outcome:
    - Absence of a pH-severity association would argue against pH as a severity predictor, without refuting its mechanistic involvement in disease.
  evidence:
  - reference: PMID:33369135
    reference_title: Review of clinical and molecular variability in autosomal recessive cutis laxa 2A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      No specific genotype-phenotype correlations were identified.
    explanation: >-
      The human synthesis does not establish prediction by variant class.
  - reference: PMID:39680136
    reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Except α-dystroglycan O-mannosylation and the consequent brain anomalies most cellular and glycosylation
      alterations described in this report are milder in presence of V0a2-RQ than in the V0a2 knockout and
      this difference correlates to a less alkaline Golgi pH in Atp6v0a2RQ/RQ cells (Fig. 7).
    explanation: >-
      The paper explicitly excludes brain findings from the general pH correlation.
- discussion_id: arcl2a_globozoospermia_untested_in_humans
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Does the murine acrosome phenotype occur in men with ATP6V0A2-related cutis laxa?
  attaches_to:
  - experimental_models#Atp6v0a2-mutant mouse embryonic fibroblasts
  - pathophysiology#Impaired Golgi Trafficking
  rationale: >-
    Both mutant mouse lines show male infertility and impaired acrosome formation with loss of spermatid mucin-type
    O-glycosylation. The reviewed study does not report equivalent patient fertility data. Impaired GOPC recruitment
    and possible GALNT3 dysfunction are proposed contributors, not a proven complete causal explanation. Human
    infertility should not be inferred from the mouse finding.
  proposed_experiments:
  - experiment_id: exp_arcl2a_semen_analysis
    name: Human sperm and acrosome assessment
    description: >-
      In consenting adult affected men, assess semen parameters, sperm head and acrosome morphology, and relevant
      glycosylation, reporting positive and negative findings. This is a proposed investigation rather than
      a disease-specific clinical recommendation.
    supporting_outcome:
    - Acrosomal and sperm-head abnormalities concordant with the mouse phenotype would support human relevance.
    refuting_outcome:
    - Normal sperm and acrosome findings would weaken generalization to humans; they would not refute the established serum glycosylation defect.
  evidence:
  - reference: PMID:39680136
    reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      A hitherto unrecognized male infertility due to globozoospermia was evident in both mouse lines with
      impaired Golgi-derived acrosome formation and abolished mucin-type O-glycosylation in spermatids.
    explanation: >-
      The fertility finding was measured in male mice, not in human ARCL2A patients.
- discussion_id: arcl2a_vwf_mechanism
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: What causes the qualitative VWF abnormality reported in two affected sisters?
  attaches_to:
  - pathophysiology#Abnormal VWF Multimer Distribution
  rationale: >-
    Plasma multimer and activity results show a functional abnormality. Direct VWF glycan analysis and studies
    of VWF secretion, multimerization and matrix binding could distinguish altered processing from defective
    interaction with the abnormal extracellular matrix. The two-sister observation does not establish frequency
    across ATP6V0A2 disease.
  evidence:
  - reference: url:https://ern-ithaca.eu/wp-content/uploads/2020/12/Beyens_cutislaxa_molecExpDermatol2018.pdf
    reference_title: "https://ern-ithaca.eu/wp-content/uploads/2020/12/Beyens_cutislaxa_molecExpDermatol2018.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      While glycosylation anomalies may impair proper glycosylation and multimerization of VWF resulting in
      deceased functionality, we cannot exclude that extrace llular matrix disarray could preclude proper interaction
      of VWF with the extracellular matrix, hence reducing its activity.
    explanation: >-
      Alternative mechanisms remain explicit in the primary report.
notes: >-
  This entry is restricted to ATP6V0A2-related disease. The historical label wrinkly skin syndrome also appears
  in genetically heterogeneous reports, so phenotype alone does not establish this molecular diagnosis. Clinical
  frequencies vary by age, ascertainment and follow-up; selected-case fractions are not population penetrance.
  Serum mucin-type O-glycosylation and brain alpha-dystroglycan O-mannosylation are distinct processes. The
  mouse findings do not establish human infertility or a universal pH-severity relationship.
histopathology:
- name: Rarefied and Fragmented Dermal Elastic Fibers
  description: >-
    Human skin electron microscopy shows sparse, fragmented elastic fibers with frayed or moth-eaten elastin
    and disorganized microfibrils. GeneReviews notes that light microscopy may be normal. These ultrastructural
    findings support but do not uniquely establish the molecular diagnosis. They should not be conflated with
    electron microscopy of cultured fibroblasts.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Electron microscopy (EM) shows rarefaction and fragmentation of the elastin network in which elastic
      fibers are small and misshapen.
    explanation: >-
      Directly described human skin ultrastructure in the disease chapter.
  - reference: url:https://ern-ithaca.eu/wp-content/uploads/2020/12/Beyens_cutislaxa_molecExpDermatol2018.pdf
    reference_title: "https://ern-ithaca.eu/wp-content/uploads/2020/12/Beyens_cutislaxa_molecExpDermatol2018.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Overall, elastic fibres are less abundant compared to controls.
    explanation: >-
      Skin electron microscopy independently supports reduced elastic fibers.
- name: Variable Dermal Collagen Fiber Diameter
  description: >-
    Skin electron microscopy in the small 2019 series showed variable collagen-fiber diameter and increased
    interfibrillar spaces alongside elastic-fiber abnormalities. This observation does not establish generalized
    collagen depletion or a separate collagen-gene disorder. Needs term/NTR for this precise ultrastructural
    finding.
  evidence:
  - reference: url:https://ern-ithaca.eu/wp-content/uploads/2020/12/Beyens_cutislaxa_molecExpDermatol2018.pdf
    reference_title: "https://ern-ithaca.eu/wp-content/uploads/2020/12/Beyens_cutislaxa_molecExpDermatol2018.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Collagen fibres show more variable diam - eters with wider interfibrillar spaces.
    explanation: >-
      Direct human skin-biopsy observation; the paper examined ultrastructure in two patients.

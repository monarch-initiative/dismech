    pial basement membrane. This supports a secondary dystroglycan glycosylation defect, distinct from the
    serum ApoC-III assay. The corresponding biochemical lesion has not been demonstrated in patient brain.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:39680136
    reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      A reduction of the IIH6 immunofluorescence intensity in relation to ß-dystroglycan as a glycosylation-independent
      reference was observed in Atp6v0a2−/− and Atp6v0a2RQ/RQ mice indicating an O-mannosylation deficiency.
    explanation: >-
      Embryonic mouse brain glyco-epitope assay, not human neural-tissue measurement.
  mechanism_confidence: PROVISIONAL
  downstream:

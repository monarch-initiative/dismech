- name: Elevated Trans-Golgi Luminal pH
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The single physical abnormality from which the rest of the disease follows.
    Direct measurement in mouse models puts trans-Golgi pH at 5.80 in wild type,
    6.25 in a knock-in that abolishes only V0a2-mediated proton transport, and
    6.52 in the null - and phenotype severity tracks that gradient rather than
    tracking whether the protein is present.

    The knock-in is what makes this node an established mechanism rather than an
    inference. It carries an R755Q missense change that selectively removes proton
    transport while leaving the protein in place, so the pH shift can be
    attributed to the pumping activity and not to loss of some structural or
    membrane-fusion role of the subunit.

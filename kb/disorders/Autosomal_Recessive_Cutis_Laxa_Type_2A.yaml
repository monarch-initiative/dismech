- name: Aberrant Cortical Neuron Migration
  description: >-
    Both mouse models exhibit focal neuronal overmigration into cortical layer I, especially in frontal cortex.
    The R755Q model is more severely affected despite its smaller measured MEF pH shift. Human MRI demonstrates
    a characteristic cobblestone-like cortical malformation; it is not direct histologic proof of the mouse
    cellular mechanism. Developmental dysgenesis may contribute to neurologic manifestations, but does not
    fully explain later regression.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:39680136
    reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT

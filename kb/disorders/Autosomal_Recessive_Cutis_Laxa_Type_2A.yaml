- name: Combined N- and O-Glycosylation Defect
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Golgi glycosyltransferases and glycosidases have narrow pH optima, so raising
    the luminal pH degrades their output. The result is a defect in both N-linked
    and mucin-type O-linked glycosylation - the combined pattern that places
    ARCL2A in the congenital disorders of glycosylation and that is detectable in
    serum by transferrin and apolipoprotein C-III isoelectric focusing.

    Which limb matters more is not settled the way the clinical framing implies.
    The mouse work concludes that altered O-glycosylation is the more relevant
    limb for the pathomechanism, and that it produces a secondary
    dystroglycanopathy through reduced O-mannosylation of alpha-dystroglycan -
    which is a specific, testable route to the neuronal-migration phenotype rather
    than a general appeal to hypoglycosylation.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  - preferred_term: mucin-type protein O-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006493
      label: protein O-linked glycosylation
  evidence:
  - reference: PMID:18157129
    reference_title: "Impaired glycosylation and cutis laxa caused by mutations in the vesicular H+-ATPase subunit ATP6V0A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

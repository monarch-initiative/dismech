    quote_role: PRIMARY_RESULT
    snippet: >-
      We used knock-out (Atp6v0a2-/-) and knock-in (Atp6v0a2RQ/RQ) mice harboring the R755Q missense mutation
      selectively abolishing V0a2-mediated proton transport to investigate the WSS pathomechanism.
    explanation: >-

biochemical:
- name: Serum transferrin isoelectric focusing
  presence: PRESENT
  biomarker_term:
    preferred_term: Type II transferrin isoform profile
    term:
      id: HP:0012301
      label: Type II transferrin isoform profile
  evidence:
  - reference: PMID:23963297
    reference_title: "Clinical and biochemical features guiding the diagnostics in neurometabolic cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with ATP6V0A2 defects had abnormal glycosylation.
    explanation: >-
      Supports the marker's sensitivity within the genetically confirmed group.
  notes: >-
    Sensitive but not specific. A type II pattern says the defect is in Golgi
    processing rather than in the endoplasmic reticulum; it does not say which
    Golgi gene. Its value in this differential is as a triage step that selects
    ATP6V0A2 out of the genetically heterogeneous cutis laxa group before
    sequencing, and a normal result in a patient with cutis laxa argues against
    ATP6V0A2 more strongly than an abnormal one argues for it.

    No reference range or interpretation band is curated. Isoelectric focusing is
    read as a qualitative pattern, not a number, so a numeric interval would
    misrepresent the assay.
genetic:
- name: ATP6V0A2
  gene_term:
    preferred_term: ATP6V0A2
    term:
      id: hgnc:18481
      label: ATP6V0A2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  features: >-
    ATP6V0A2 encodes the a2 subunit of the V-type H+-ATPase, the isoform that
    localises to the trans-Golgi membrane and acidifies the Golgi lumen. Most
    reported disease alleles are predicted null.
  notes: >-
    The genotype-phenotype expectation this disease sets up, and does not meet.

    With about 78% predicted-null alleles and a minority of missense, the obvious
    hypothesis is that residual protein function grades severity - and there is a
    single suggestive data point for it, the p.P87L missense allele reported with
    unusually mild disease. But the systematic review of 70 individuals looked for
    genotype-phenotype correlations and identified none. The only discriminator it
    found was age at ascertainment.

    That is worth stating plainly because it cuts against how a rare-disease report
    is usually written. A curator or clinician should not counsel severity from
    variant class in this disease, and should be sceptical of a case report that
    attributes a mild phenotype to a missense allele without a cohort behind it.

    Note also that the mouse data suggest what the human data would need in order
    to find the correlation: severity tracks trans-Golgi pH, which no clinical
    study measures. A genotype class is a poor proxy for a pH shift.
  evidence:
  - reference: PMID:33369135
    reference_title: "Review of clinical and molecular variability in autosomal recessive cutis laxa 2A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No specific genotype-phenotype correlations were identified.
    explanation: >-
      The negative result that the notes above are built around.
  - reference: PMID:33369135
    reference_title: "Review of clinical and molecular variability in autosomal recessive cutis laxa 2A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 78.3% of known variants were predicted null alleles, while 11 were
      missense and 2 affected noncanonical splice sites.
    explanation: >-
      The allelic spectrum against which the absent correlation should be read.
  - reference: PMID:19321599
    reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considerable allelic and phenotypic heterogeneity was observed, with a
      missense mutation of a moderately conserved residue p.P87L leading to
      unusually mild disease.
    explanation: >-
      Graded PARTIAL because it is the one observation pointing towards a
      genotype-severity relationship, and it is a single allele in a 17-patient
      cohort - not enough to stand against the systematic review's null result.
  - reference: PMID:19321599
    reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Premature stop codon mutations led to decreased ATP6V0A2 mRNA levels by
      destabilizing the mutant mRNA via the nonsense-mediated decay pathway.
    explanation: >-
      The molecular fate of the majority allele class, and why null variants
      produce absence of protein rather than a truncated product.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seventy individuals from 65 families in the 2021 systematic review - 69
    identified by literature review plus the index case reported alongside it.
    That is a count of the published literature, not an ascertainment-corrected
    estimate, and the true figure is certainly higher given that the attenuated
    adult phenotype is easy to miss.

    Reported worldwide with enrichment in consanguineous populations, which is a
    property of recessive disease ascertainment rather than of this gene.
    rate_per_100000 is left empty: no denominator has been published.
  evidence:
  - reference: PMID:33369135
    reference_title: "Review of clinical and molecular variability in autosomal recessive cutis laxa 2A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A systematic literature review allowed us to identify 69 additional
      individuals from 64 families.
    explanation: >-
      The size of the reported literature as of the review, additional to the
      index case reported in the same paper.
treatments:
- name: Multidisciplinary Symptomatic Management
  description: >-
    There is no disease-modifying therapy. Management is surveillance and symptom
    control across the affected systems - dermatological, neurological and
    developmental, orthopaedic, and ophthalmological.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:19401719
    reference_title: "Autosomal recessive cutis laxa syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variable presence of protein glycosylation abnormalities in the diverse
      clinical forms of the wrinkled skin-cutis laxa syndrome spectrum
      necessitates revisiting the diagnostic criteria to be able to offer adequate
      prognosis assessment and counseling.
    explanation: >-
      Graded PARTIAL and quoted for what it actually supports: that the clinical
      offer in this disease is diagnosis, prognosis and counselling. The review
      describes no disease-modifying treatment, and none is claimed here.
  notes: >-
    No target_mechanisms link is curated, because no available treatment acts on
    any node in this pathograph. Recording that absence explicitly is more useful
    than an empty treatments section: it says the gap has been looked for.
- name: Anti-Seizure Medication
  description: >-
    Standard anti-seizure treatment; no ATP6V0A2-specific regimen is recommended.
    Curated because seizures are in nearly all affected individuals and this is
    the one manifestation with a routine, effective symptomatic therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    Linked with `target_phenotypes`, not `target_mechanisms`, and the distinction
    is load-bearing rather than clerical. An anti-seizure drug suppresses a
    downstream manifestation of the malformed cortex; it does nothing to the
    neuronal-migration node that produced it. A `target_mechanisms` edge would
    draw a treatment-to-node arrow in the pathograph and carry into the export
    layer, where the qualifying sentence does not travel with it - so the graph
    would assert an action on the mechanism that no evidence supports and that
    this description denies. The link's own evidence is a sentence about treating
    seizures and says nothing about migration.
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:20301755
    reference_title: "ATP6V0A2-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: Annual ophthalmologic examination, EEG, and monitoring of
      anticonvulsive drug levels.
    explanation: >-
      Establishes anticonvulsant therapy as ongoing rather than episodic, with
      drug-level monitoring as part of routine care.
- name: Early Developmental Intervention
  description: >-
    Early intervention for developmental delay and intellectual disability, and
    psychological support for self-image, which GeneReviews names specifically -
    a visible connective-tissue disorder carries that burden alongside the

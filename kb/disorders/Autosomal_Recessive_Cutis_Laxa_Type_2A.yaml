- name: Focal Pial Basement Membrane Disruption
  description: >-
    Mouse brain sections show local basal-lamina disruption where ectopic neuronal clusters occur. Reduced
    dystroglycan glycosylation is the proposed connecting mechanism. The focal distribution and greater abnormality

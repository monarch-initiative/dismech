- name: Bleeding Assessment
  presence: PRESENT
  description: >-
    Obtain a bleeding history and coagulation evaluation including von Willebrand factor. Routine PT, APTT
    and platelet counts were normal in the two sisters with a qualitative VWF defect, so those tests alone
    did not capture their abnormality. Further evaluation should be directed by the clinical and laboratory
    findings.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK5200/pdf/Bookshelf_NBK5200.pdf"
    supports: SUPPORT

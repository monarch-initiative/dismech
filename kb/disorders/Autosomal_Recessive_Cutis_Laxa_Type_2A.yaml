animal_models:
- name: Atp6v0a2 knock-out mouse
  species: Mouse
  genotype: Atp6v0a2-/-
  publication: PMID:39680136
  description: >-
    Constitutive loss of V0a2 produces reduced dermal thickness and elastic fibers, cortical neuronal overmigration
    and male infertility. Skin appearance was not visibly altered despite histologic abnormalities. Derived
    fibroblast pH measurements are recorded separately from whole-animal findings.
  modeled_mechanisms:
  - target: Deficient Dermal Elastic Fiber Network
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Dermal thinning and smaller elastic fibers reproduce a tissue-level component of cutis laxa.
    limitations: >-
      Murine skin histology is not a quantitative measure of human severity; no uniform pH-severity rule follows.
    evidence:
    - reference: PMID:39680136
      reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Homozygous mutants from both strains displayed a reduction of growth, dermis thickness, and elastic
        fiber formation compatible with WSS.
      explanation: >-
        Both strains reproduce aspects of the connective-tissue phenotype.
  - target: Aberrant Cortical Neuron Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Frontal cortical neurons overmigrate into layer I, with prenatal ectopias, pial basement-membrane gaps
      and reduced alpha-dystroglycan O-mannosylation.
    limitations: >-
      Human cortical abnormalities are primarily characterized by imaging; the direct molecular chain is established
      in mice rather than patient brain.
    evidence:
    - reference: PMID:39680136
      reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Atp6v0a2RQ/RQ mutants displayed more abnormal migration of cortical neurons, correlating with seizures
        and a reduced O-mannosylation of α-dystroglycan.
      explanation: >-
        The neuronal phenotype was stronger in the knock-in despite its smaller fibroblast pH elevation.
    readouts:
    - name: Cortical neuronal overmigration
      target: Aberrant Cortical Neuron Migration
      direction: ALTERED
      interpretation: >-
        Aberrant positioning and overmigration, not a demonstrated uniform decrease in neuronal migration.
      evidence:
      - reference: PMID:39680136
        reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: >-
          Investigating the cortical layering in postnatal developmental stages in both mouse models we found
          a
          neuronal overmigration of neurons into layer I of the cerebral cortex, which was more pronounced
          in Atp6v0a2RQ/RQ
          mice
        explanation: >-
          The measured migration abnormality is overmigration, not a uniform decrease in migration.
      - reference: PMID:18716235
        reference_title: "Cobblestone-like brain dysgenesis and altered glycosylation in congenital cutis laxa, Debre type."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        quote_role: PRIMARY_RESULT
        snippet: >-
          An unusual cobblestone-like cortical malformation over the frontal and parietal regions was seen
          in eight
          patients
        explanation: >-
          Human imaging supplies the clinical correlate; no direct neuronal-migration assay in patients.
  evidence:
  - reference: PMID:39680136
    reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia.

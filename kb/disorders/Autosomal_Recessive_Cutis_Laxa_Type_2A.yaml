genetic:
- name: ATP6V0A2
  gene_term:
    preferred_term: ATP6V0A2
    term:
      id: hgnc:18481
      label: ATP6V0A2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  features: >-
    Biallelic pathogenic variants in ATP6V0A2 cause disease. The reported spectrum includes nonsense, frameshift,
    canonical and noncanonical splice variants, missense variants, exon deletions and larger deletions. In
    the 2021 review, 78.3% of known distinct variants were predicted null; this is a variant-catalog proportion,
    not an allele frequency or penetrance estimate.
  notes: >-
    No specific genotype-phenotype correlation was identified in the 2021 review. A mildly affected individual
    carried p.P87L with p.S27fsX54, but this does not establish a general protective effect of missense variants
    or measured residual function. In patient fibroblasts, cycloheximide increased transcripts carrying p.R133fsX135
    and p.Q765X, consistent with nonsense-mediated decay; p.S27fsX54 remained undetectable, indicating that
    not every truncating allele follows the same measured RNA mechanism.

    A 2026 series reported nine individuals with a homozygous 380-bp exon 16 deletion, c.1936-147_2055+113del,
    and one with c.235del, p.Leu79Phefs*13. Shared homozygous regions in three cases supported a founder effect
    in southeastern Türkiye. This regional observation supports inclusion of deletion detection and does not
    establish a population carrier frequency or a broadly predictive severity association.
  evidence:
  - reference: PMID:33369135
    reference_title: Review of clinical and molecular variability in autosomal recessive cutis laxa 2A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      About 78.3% of known variants were predicted null alleles, while 11 were missense and 2 affected noncanonical
      splice sites.
    explanation: >-
      The denominator is known variants, rather than all patient alleles.
  - reference: PMID:33369135
    reference_title: Review of clinical and molecular variability in autosomal recessive cutis laxa 2A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      No specific genotype-phenotype correlations were identified.
    explanation: >-
      Variant class cannot currently provide a reliable individual severity prediction.
  - reference: PMID:19321599
    reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Patient 13 was compound heterozygous for missense mutation p.P87L and frameshift mutation p.S27fsX54.
    explanation: >-
      The mild presentation occurred in a compound heterozygote, not an isolated functional test of p.P87L.
  - reference: PMID:19321599
    reference_title: "Loss-of-function mutations in ATP6V0A2 impair vesicular trafficking, tropoelastin secretion and cell survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Upon incubation with cycloheximide (CHX), which blocks nonsense-mediated decay, the expression of mutations
      p.R133fsX135 and p.Q765X increased (Fig.4B and D). Interestingly, mutation S27fsX54 was not expressed
      at the mRNA level (Fig.4C), even after treatment with CHX, suggesting that this mutation interferes with
      either transcription or RNA stability through a different mechanism.
    explanation: >-
      Direct transcript experiments show allele-dependent effects and an exception to cycloheximide rescue.
  - reference: PMID:41732832
    reference_title: "ATP6V0A2-Related Cutis Laxa: Identification of a Recurrent Exon 16 Deletion With Founder Effect in Southeastern Türkiye and a Novel Frameshift Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Nine individuals carried a recurrent homozygous 380 bp deletion spanning exon 16 (c.1936-147_2055+113del).
    explanation: >-
      The recurrent structural allele in the ten-person, six-family cohort.
  - reference: PMID:41732832
    reference_title: "ATP6V0A2-Related Cutis Laxa: Identification of a Recurrent Exon 16 Deletion With Founder Effect in Southeastern Türkiye and a Novel Frameshift Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Haplotype analysis revealed shared homozygous regions in three cases, suggesting a founder effect.
    explanation: >-

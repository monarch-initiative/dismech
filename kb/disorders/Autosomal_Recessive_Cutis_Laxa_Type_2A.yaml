classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY
    notes: >-
      The presenting and defining feature is generalized cutis laxa; dermatology
      is where these patients are usually first seen.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian recessive disorder identified by homozygosity mapping and
      candidate-gene sequencing in consanguineous families.
  icimd_category:
  - classification_value: multiple_glycosylation_pathways
    notes: >-
      ICIMD scopes this group to disorders affecting multiple glycosylation
      pathways, explicitly including Golgi transport and homeostasis, which is
      exactly what ARCL2A is. The narrower n_linked_protein_glycosylation and
      o_linked_protein_glycosylation groups would each be wrong on their own: the
      defect is combined, and it is a compartment defect rather than a
      glycosyltransferase deficiency - the enzymes are intact and the compartment
      they work in is at the wrong pH.

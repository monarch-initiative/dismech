    evidence_source: MODEL_ORGANISM
    snippet: >-
      Measurement of the pH in the trans Golgi compartment revealed a shift from
      5.80 in wildtype to 6.52 in Atp6v0a2-/- and 6.25 in Atp6v0a2RQ/RQ.
    explanation: >-
      The direct measurement, with the two mutant genotypes giving different pH
      values - which is what turns the pH into a graded variable rather than a
      binary defect.
  - reference: PMID:39680136
    reference_title: "Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with tissue-specific glycosylation changes and globozoospermia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Most phenotypic and cellular properties correlate with the different
      degrees of trans Golgi pH elevation in both mutants underlining the

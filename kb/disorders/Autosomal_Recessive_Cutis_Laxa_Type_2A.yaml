- name: Elevated Trans-Golgi Luminal pH
  description: >-
    In immortalized mouse embryonic fibroblasts, a ratiometric trans-Golgi probe measured mean pH 5.80 in wild
    type, 6.52 in knockout and 6.25 in R755Q homozygous cells. These are cell-culture measurements, not direct
    measurements in human organs. Several cellular readouts track this ordering, but neuronal defects are more
    severe in the knock-in and the skin phenotype is broadly similar in both mutants. Increased V0a1 abundance
    is a proposed compensatory explanation, not a demonstrated rescue mechanism.
  biological_scale: CELLULAR

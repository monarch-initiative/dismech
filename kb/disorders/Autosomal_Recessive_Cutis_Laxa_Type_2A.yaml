name: Autosomal Recessive Cutis Laxa Type 2A
creation_date: "2026-08-29T12:15:00Z"
category: Mendelian
disease_term:
  preferred_term: ATP6V0A2-related cutis laxa
  term:
    id: MONDO:0018163
    label: autosomal recessive cutis laxa type 2A
description: >-
  Autosomal recessive cutis laxa type 2A (ARCL2A, Debre type) is caused by
  biallelic loss-of-function variants in ATP6V0A2, which encodes the a2 subunit
  of the vacuolar H+-ATPase in the trans-Golgi membrane. Losing it raises Golgi
  luminal pH, and everything else in the disease follows from that single
  physical change.

  What makes the entity worth curating is that one lesion produces phenotypes
  from three different domains that would otherwise look unrelated. Golgi
  glycosyltransferases and glycosidases are pH-sensitive enzymes, so raising the
  pH gives a combined N- and O-glycosylation defect and places the disease inside
  the congenital disorders of glycosylation. Golgi trafficking is also
  pH-dependent, so tropoelastin is retained rather than secreted and the dermal
  elastic fibre network is not built - which is the cutis laxa. And cortical
  neurons migrate abnormally, giving developmental delay, seizures and gyration
  abnormalities. Skin, sugar and brain, from one proton pump.

  Two things about the shape of this entry are deliberate. Wrinkly skin syndrome
  is not a separate disease here: the same ATP6V0A2 variants cause both, and it
  is curated as the attenuated end of one spectrum rather than as a sibling
  entity. And the severity axis that the literature actually supports is age at
  ascertainment, not genotype - a systematic review of 70 individuals found age
  at ascertainment to be the unique phenotypic discriminator and identified no
  genotype-phenotype correlation, which is the opposite of what the 78%
  null-allele spectrum would lead you to expect.

  The strongest mechanistic evidence is a pair of mouse models that separate the
  pump's proton-transport function from the protein itself, and they establish a
  graded relationship: trans-Golgi pH 5.80 in wild type, 6.25 in the
  transport-dead knock-in, 6.52 in the null, with phenotype severity tracking the
  pH rather than the genotype class. That is an unusually direct demonstration
  that the pH is the disease variable.

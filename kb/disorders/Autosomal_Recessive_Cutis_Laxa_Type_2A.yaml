- name: Reduced V0a2-dependent Golgi proton transport
  description: >-
    The a2 subunit contributes to the proton channel of Golgi-associated V-ATPase complexes. The engineered
    R755Q mouse allele disrupts proton transport while retaining Golgi-localized protein. It supports a proton-transport
    contribution to disease but does not exclude compensatory effects or additional functions of the retained
    mutant protein.
  biological_scale: MOLECULAR

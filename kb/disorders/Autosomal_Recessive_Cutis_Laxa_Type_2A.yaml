- name: Seizure Surveillance
  presence: PRESENT
  description: >-
    For affected individuals with seizures, monitor EEG and antiseizure drug levels as clinically appropriate.
    This is surveillance of the seizure disorder, not evidence that every patient develops epilepsy.

- name: Impaired Golgi Trafficking
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Patient fibroblasts show distended Golgi cisternae, abnormal lysosomes and
    multivesicular bodies, and a delay in brefeldin-A-induced retrograde fusion of
    Golgi membranes with the endoplasmic reticulum. The delay is specific: it is
    absent in cells deficient for GORAB or PYCR1, the proteins behind two other
    autosomal recessive cutis laxa syndromes, so it is a property of the V-ATPase
    lesion rather than of cutis laxa generally.

    Elevated TGF-beta signalling accompanies it, with raised TGF-beta1 in the
    fibroblast supernatant.

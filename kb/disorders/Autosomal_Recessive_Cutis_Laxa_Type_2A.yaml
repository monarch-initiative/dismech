- name: Aberrant Cortical Neuron Migration
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    Cortical neurons migrate abnormally, which is the substrate for the
    developmental delay, seizures and gyration abnormalities seen clinically.

    Graded PROVISIONAL for a reason specific to this node rather than to the
    entry. The abnormal migration itself is directly observed - but in mice, and
    the human evidence is imaging and clinical rather than histological. More
    awkwardly, the mouse data run against the intuitive dose-response: the
    knock-in with the smaller pH shift showed more abnormal migration than the
    null, correlating with seizures and with reduced O-mannosylation of
    alpha-dystroglycan. So the neuronal arm does not simply follow the pH gradient
    the way the skin arm does, and the entry does not pretend otherwise.

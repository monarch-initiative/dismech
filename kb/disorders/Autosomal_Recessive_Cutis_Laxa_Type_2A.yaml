has_subtypes:
- name: Wrinkly skin syndrome
  display_name: Wrinkly skin syndrome (attenuated ATP6V0A2 phenotype)
  description: >-
    Historically a separate diagnosis, and now understood as the milder end of
    the same disorder: the same ATP6V0A2 mutations are found in patients labelled
    wrinkly skin syndrome and in patients labelled cutis laxa, and the
    distinction is one of degree of elastic-fibre involvement rather than of
    mechanism.

    Curated as a subtype rather than as a separate entry precisely because it has
    no separate mechanism. A curator meeting a patient labelled wrinkly skin
    syndrome should look for the same variants and expect the same glycosylation
    abnormality.
  evidence:
  - reference: PMID:19401719
    reference_title: "Autosomal recessive cutis laxa syndrome revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, similar mutations have been found in patients with wrinkly
      skin syndrome, without the presence of severe skin symptoms of elastin
      deficiency. These findings suggest that the cutis laxa and wrinkly skin
      syndromes are phenotypic variants of the same disorder.
    explanation: >-
      The explicit statement that the two labels name phenotypic variants of one
      disorder, which is the basis for curating WSS as a subtype.
  - reference: PMID:18157129
    reference_title: "Impaired glycosylation and cutis laxa caused by mutations in the vesicular H+-ATPase subunit ATP6V0A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified loss-of-function mutations in ATP6V0A2, encoding the a2
      subunit of the V-type H+ ATPase, in several families with autosomal
      recessive cutis laxa type II or wrinkly skin syndrome.
    explanation: >-
      The gene-discovery paper already ascertained both labels together, so the
      lumping is original to the entity rather than a later reinterpretation.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ATP6V0A2 variants, homozygous or compound heterozygous, ascertained
    largely through consanguineous families. About 78% of reported alleles are
    predicted null - nonsense, frameshift or canonical splice - with a minority of
    missense and non-canonical splice variants.

    Counselling numbers are the standard recessive ones: for a sib of an affected
    individual with two carrier parents, 25% affected, 50% asymptomatic carrier,
    25% unaffected non-carrier. Once the family's variants are known, carrier
    testing for at-risk relatives, prenatal testing and preimplantation genetic
    testing are all available.
  evidence:
  - reference: PMID:33369135
    reference_title: "Review of clinical and molecular variability in autosomal recessive cutis laxa 2A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 78.3% of known variants were predicted null alleles, while 11 were
      missense and 2 affected noncanonical splice sites.
    explanation: >-
      The allelic spectrum across the systematically reviewed literature.
  - reference: PMID:33369135
    reference_title: "Review of clinical and molecular variability in autosomal recessive cutis laxa 2A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This work confirmed the existence of an attenuated phenotype associated
      with ATP6V0A2 biallelic variants
    explanation: >-
      Confirms that biallelic variants can produce the attenuated phenotype
      curated as the wrinkly-skin subtype.
  - reference: PMID:20301755
    reference_title: "ATP6V0A2-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for an ATP6V0A2 pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of being affected, a 50% chance of being an asymptomatic carrier, and a 25%
      chance of being unaffected and not a carrier.
    explanation: >-
      The recurrence risks curated in the description above.
  - reference: PMID:20301755
    reference_title: "ATP6V0A2-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the ATP6V0A2 pathogenic variants have been identified in an affected
      family member, carrier testing for at-risk relatives, prenatal testing for a
      pregnancy at increased risk, and preimplantation genetic testing for
      ATP6V0A2-related cutis laxa are possible.
    explanation: >-
      The reproductive options available once the family's variants are known.

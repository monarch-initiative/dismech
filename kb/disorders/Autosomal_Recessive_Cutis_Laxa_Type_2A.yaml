phenotypes:
- category: Dermatological
  name: Generalized Cutis Laxa
  frequency: OBLIGATE
  description: >-
    Redundant, wrinkled, inelastic skin, present from birth or infancy and
    generalized rather than localized. It tends to attenuate with age, which is

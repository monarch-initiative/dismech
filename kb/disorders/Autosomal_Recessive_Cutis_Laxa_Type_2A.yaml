    label: autosomal recessive cutis laxa type 2A
description: >-
  ATP6V0A2-related cutis laxa is an autosomal recessive connective-tissue and glycosylation disorder with congenital
  loose, wrinkled skin and variable skeletal, ocular and neurologic involvement. Historical Debré-type cutis
  laxa and ATP6V0A2-associated wrinkly skin syndrome form a clinical spectrum. Cutaneous laxity often improves
  with age, whereas some individuals develop seizures and neurologic decline; attenuated adult presentations
  also occur.

  Biallelic pathogenic variants impair the V-ATPase a2 subunit involved in Golgi acidification and trafficking.
  Patient-cell studies demonstrate abnormal tropoelastin secretion, reduced elastin deposition and increased
  apoptosis. Mouse models reveal tissue-specific glycosylation abnormalities and a possible dystroglycan-mediated
  route to cortical neuronal overmigration. Golgi pH is an important mechanistic variable, but it has not been
  shown to explain all human manifestations or predict severity.

  Diagnosis uses clinical findings and biallelic pathogenic or likely pathogenic variants. Glycosylation testing
  is supportive, with age-dependent and assay-specific limitations. Care is directed to the individual connective-tissue,
  visual, developmental, neurologic and bleeding manifestations.

discussions:
- discussion_id: gap_ad_dysbiosis_causal_ordering
  prompt: >-
    In human atopic dermatitis, is skin dysbiosis (loss of commensal diversity
    with Staphylococcus aureus overgrowth) a driver of disease, an amplifier that
    sustains established lesions, or mainly a consequence of the barrier defect
    and the type 2 cytokine milieu that together suppress cutaneous antimicrobial
    defence?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Epidermal Barrier Dysfunction
  - pathophysiology#Type 2 Immune Response
  - pathophysiology#Secondary Inflammatory Amplification
  rationale: >-
    The environmental entry Microbial Dysbiosis records that S. aureus occupies
    roughly 70 percent of lesional skin and that its abundance rises with flares
    and with severity, and it now declares influences_mechanisms edges into the
    type 2 and secondary amplification nodes. Both edges are drawn EXACERBATES
    rather than TRIGGERS, because the abundant correlational human data are
    compatible with either direction and the two directions are separately
    evidenced.

    Evidence for dysbiosis acting causally is largely from model systems and from
    commensal biology. In Adam17-deficient mice, species-specific antibiotics
    reversed the dysbiosis and eliminated the skin inflammation, an interventional
    result no human study matches; the same abstract states plainly that the
    causal relationship in human disease has yet to be clarified. In humans,
    coagulase-negative staphylococci producing antimicrobial peptides are depleted
    on atopic dermatitis skin, their scarcity correlates with S. aureus
    colonization, and reintroducing active strains lowered S. aureus, which is a
    human interventional result on colonization but not on disease activity.

    Evidence for dysbiosis being downstream is at least as strong in humans.
    Blocking IL-4 receptor alpha with dupilumab in a placebo-controlled trial
    raised microbial diversity and lowered S. aureus abundance in both lesional
    and nonlesional skin, with the fall tracking clinical improvement and type 2
    biomarkers; the microbiome shifted because the host immune state was changed,
    not the other way round. In a birth cohort followed to one year, infants who
    went on to develop atopic dermatitis were not colonized by S. aureus before
    disease onset, and it was the relative abundance of protective commensal
    staphylococci at two months, not pathobiont overgrowth, that distinguished
    them.

    A defensible reading is that the two arms describe different disease stages,
    with commensal depletion preceding infantile onset and S. aureus overgrowth
    amplifying established adult lesions. That reading is currently an inference
    across separate cohorts, assay generations, and age groups rather than a
    measured trajectory, and until it is tested the edges above should not be
    strengthened to TRIGGERS. Note also that most human abundance data cited here
    are 16S amplicon rather than shotgun metagenomic, so species-level and
    strain-level attribution carries the resolution limits recorded on the
    Microbial Dysbiosis evidence items.
  proposed_experiments:
  - experiment_id: exp_ad_dysbiosis_temporal_ordering
    name: Birth-cohort strain-resolved ordering of dysbiosis against barrier and type 2 onset
    description: >-
      Follow an unselected birth cohort from the neonatal period through the age
      of peak atopic dermatitis incidence, sampling predilection and control skin
      sites at fixed intervals regardless of disease status. Pair shotgun
      metagenomics, which resolves S. aureus and commensal staphylococci to strain
      level where amplicon sequencing cannot, with transepidermal water loss,
      filaggrin genotype, and tape-strip measurement of type 2 cytokines and
      antimicrobial peptides at the same visits. Analyse each subject as their own
      control across the transition into disease, so the question becomes which
      measurement moves first within an individual rather than which group differs
      at one cross-section. Stratify by age at onset to test the staged reading in
      which commensal depletion precedes infantile disease while pathobiont
      overgrowth amplifies established lesions.
    experiment_type:
      preferred_term: longitudinal birth cohort with paired multi-omic skin sampling
    readouts:
    - name: Time ordering of commensal depletion against barrier change
      target: pathophysiology#Epidermal Barrier Dysfunction
      description: >-
        Determine whether the fall in commensal staphylococcal abundance precedes,
        coincides with, or follows the measurable rise in transepidermal water
        loss within individual subjects who go on to develop disease.
      assays:
      - preferred_term: shotgun metagenomic sequencing
      - preferred_term: transepidermal water loss measurement
    - name: Time ordering of S. aureus expansion against type 2 activation
      target: pathophysiology#Type 2 Immune Response
      description: >-
        Determine whether S. aureus expansion precedes or follows the local rise
        in type 2 cytokines and the fall in antimicrobial peptide expression at
        the same skin site.
      assays:
      - preferred_term: cytokine quantification
      - preferred_term: shotgun metagenomic sequencing
    - name: Pathobiont load against lesion persistence in established disease
      target: pathophysiology#Secondary Inflammatory Amplification
      description: >-
        In subjects with established disease, test whether S. aureus load predicts
        subsequent lesion persistence and severity beyond what the concurrent type
        2 biomarker level already predicts.
      assays:
      - preferred_term: quantitative PCR
      direction: POSITIVE
    decision_criterion: >-
      A driver model is supported if commensal depletion or S. aureus expansion
      reproducibly precedes barrier and type 2 change within individuals before
      disease onset. A consequence model is supported if the microbial change
      follows barrier or type 2 change, consistent with the dupilumab trial in
      which suppressing type 2 signalling alone restored diversity. A staged model
      is supported if the ordering differs by age at onset, with commensal
      depletion leading in infantile disease and S. aureus expansion following in
      established disease; in that case the two influences_mechanisms edges should
      be re-curated separately rather than kept uniform.
    would_support:
    - pathophysiology#Epidermal Barrier Dysfunction
    - pathophysiology#Type 2 Immune Response
    - pathophysiology#Secondary Inflammatory Amplification
  evidence:
  - reference: PMID:25902485
    reference_title: "Dysbiosis and Staphylococcus aureus Colonization Drives Inflammation in Atopic Dermatitis."

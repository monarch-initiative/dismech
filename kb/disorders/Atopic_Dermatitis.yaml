  title: CHN1 as a Predictive Biomarker for Atopic Dermatitis-related Depression
  description: The comorbidity of Atopic Dermatitis (AD) and depression has garnered increasing attention in recent years. Yet, the immunopathological mechanisms underlying this connection remain unclear. To bridge this gap, we collected peripheral blood mononuclear cell samples from 20 AD patients with and without depression, and performed RNA sequencing analysis. By integrating bioinformatics and machine learning techniques, we aimed to uncover the immune regulatory networks and identify key genetic markers for the depression comorbidity in AD patients. Our analysis revealed 394 differentially expressed genes in AD patients with depression as compared to those non-depression counterparts.

    healthy skin under identical exposure.
  effect: TRIGGERS
  evidence:
  - reference: PMID:26426984
    reference_title: "Barrier function and natural moisturizing factor levels after cumulative exposure to a fruit-derived organic acid and a detergent: different outcomes in atopic and healthy skin and relevance for occupational contact dermatitis in the food industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Repeated exposure to SLS and the irritant tandems enhanced the reactions and resulted in a significantly higher increase in TEWL in the AD compared to the control group"
    explanation: "Controlled tandem repeated irritation test in atopic dermatitis volunteers versus healthy controls, using the detergent sodium lauryl sulfate. Evidences both the barrier disruption and the greater susceptibility of atopic skin."
- name: Microbial Dysbiosis
  description: Staphylococcus aureus colonizes lesional skin in roughly 70 percent of
    patients - far more often than healthy controls - and its abundance tracks
    disease activity, rising during flares and with severity.
  review_notes: The prevalence figure was corrected from a previously curated value
    of over 90 percent. The pooled estimate from a 95-study meta-analysis is 70
    percent for lesional skin. The earlier claims of superantigen- and
    biofilm-mediated amplification were also removed rather than cited, since no
    source was found whose abstract states them; they belong in the pathophysiology
    section with their own evidence if reinstated.
  effect: WORSENS
  notes: >-
    This entry stands for the dysbiotic skin community as a whole, of which
    S. aureus is the dominant but not the sole member. The distinction matters
    when reading the influences_mechanisms edges: PMID:25902485 attributes eczema
    formation to S. aureus but the T helper 2 arm to C. bovis, so the edge into
    the type 2 node is evidenced for the community rather than for S. aureus
    specifically. The description above quantifies only the S. aureus component
    because that is what the cited human studies measure.
  influences_mechanisms:
  - target: Type 2 Immune Response
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysbiotic colonization acts on the type 2 inflammatory circuit rather than
      merely accompanying it. In a mouse model of eczematous dermatitis,
      species-specific antibiotic treatment reversed the dysbiosis and abolished
      the skin inflammation, and separate members of the dysbiotic community had
      separable effects on eczema formation and on T helper 2 responses. The edge
      is drawn as EXACERBATES rather than TRIGGERS, and the direction it takes in
      human disease is the open question recorded in
      gap_ad_dysbiosis_causal_ordering.
    evidence:
    - reference: PMID:25902485
      reference_title: "Dysbiosis and Staphylococcus aureus Colonization Drives Inflammation in Atopic Dermatitis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "antibiotics specific for these bacterial species almost completely reversed dysbiosis and eliminated skin inflammation"
      explanation: >-
        Interventional evidence in Adam17-deficient mice that removing the
        dysbiotic community removes the inflammation, which is the strongest
        available support for an edge running from dysbiosis to inflammation
        rather than the reverse. Model organism only, and the same abstract
        states the causal relationship in human disease is unclarified.
    - reference: PMID:25902485
      reference_title: "Dysbiosis and Staphylococcus aureus Colonization Drives Inflammation in Atopic Dermatitis."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Whereas S. aureus prominently drove eczema formation, C. bovis induced robust T helper 2 cell responses."
      explanation: >-
        Attributes the type 2 arm of the response to a different member of the
        dysbiotic flora than the one driving eczema formation, so the link from
        this entry to the type 2 node is supported for the community as a whole
        but not specifically for S. aureus, which the entry description names.
  - target: Secondary Inflammatory Amplification
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      S. aureus overgrowth is treated as an amplifier of established lesional
      inflammation. Commensal coagulase-negative staphylococci that produce
      antimicrobial peptides are depleted in atopic dermatitis skin, and their
      loss correlates with S. aureus colonization, so failure of commensal
      colonization resistance is the route by which the pathobiont load is
      sustained.
    evidence:
    - reference: PMID:28228596
      reference_title: "Antimicrobials from human skin commensal bacteria protect against Staphylococcus aureus and are deficient in atopic dermatitis."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "a pathogen commonly found in patients with atopic dermatitis (AD) and an important factor that exacerbates this disease"
      explanation: >-
        Supports the EXACERBATES predicate on this edge. Recorded as PARTIAL and
        OTHER because it is the authors' framing of prior literature rather than
        a result of the study reported in this abstract.
    - reference: PMID:28228596
      reference_title: "Antimicrobials from human skin commensal bacteria protect against Staphylococcus aureus and are deficient in atopic dermatitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CoNS strains with antimicrobial activity were common on the normal population but rare on AD subjects."
      explanation: >-
        Human isolate screening establishing depletion of antimicrobial commensal
        staphylococci on atopic dermatitis skin, the colonization resistance
        failure through which this entry acts on lesional inflammation.
    - reference: PMID:22310478
      reference_title: "Temporal shifts in the skin microbiome associated with disease flares and treatment in children with atopic dermatitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the proportion of Staphylococcus sequences, particularly S. aureus, was greater during disease flares than at baseline or post-treatment, and correlated with worsened disease severity"
      explanation: >-
        The closest evidence for this specific edge: pathobiont load rises with
        flare activity and falls after treatment, which is amplification of
        established lesional inflammation rather than the colonization resistance
        step the other two items cover. Correlational and 16S amplicon based, so
        it constrains the predicate to EXACERBATES and not TRIGGERS.
  evidence:
  - reference: PMID:26994362
    reference_title: "Prevalence and odds of Staphylococcus aureus carriage in atopic dermatitis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled prevalence of S. aureus colonization among patients was 70% for lesional skin, 39% for nonlesional skin and 62% for the nose"
    explanation: "Meta-analysis of 95 observational studies. Establishes the lesional colonization prevalence. The same abstract reports the odds of colonization versus healthy controls and that prevalence in lesional skin increased with disease severity; those figures are given in brackets in the source and so are described here rather than quoted."
  - reference: PMID:22310478
    reference_title: "Temporal shifts in the skin microbiome associated with disease flares and treatment in children with atopic dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proportion of Staphylococcus sequences, particularly S. aureus, was greater during disease flares than at baseline or post-treatment, and correlated with worsened disease severity"
    explanation: "Longitudinal 16S rRNA gene sequencing of the skin microbiome across the flare cycle in children, evidencing that abundance tracks disease activity rather than merely co-occurring with it. Note the assay is 16S amplicon rather than shotgun metagenomics, so the species-level attribution to S. aureus in the quoted sentence carries the resolution limits of amplicon sequencing."

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Extrinsic or allergic AD shows high total serum IgE levels and the presence of specific IgE for environmental and food allergens"
      explanation: The extrinsic AD review directly supports elevated IgE in the allergic/type 2 AD phenotype.
  - target: Food Allergy

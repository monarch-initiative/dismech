    establish a clinical benefit.
  effect: TRIGGERS
  evidence:
  - reference: PMID:14609097
    reference_title: "Allergy and irritation: an adverse association in patients with atopic eczema."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most impressive barrier disruption was seen after application of house dust mite, followed by cat dander and grass pollen"
    explanation: "Atopy patch testing in 30 sensitized patients with atopic eczema versus healthy controls, measuring transepidermal water loss. Covers all three allergen classes named in the description."
  - reference: PMID:25598014
    reference_title: "House dust mite reduction and avoidance measures for treating eczema."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "As many as a third of people with eczema who have a positive test for allergy to house dust mite have reported worsening of eczema or respiratory symptoms when exposed to dust"
    explanation: "Cochrane review. Supports exposure as a trigger in a sensitized subset rather than in all patients, and its conclusion of very low-quality evidence for avoidance measures is the caveat recorded in the description."
- name: Skin Irritants
  description: Soaps, detergents, and harsh fabrics disrupt the already compromised

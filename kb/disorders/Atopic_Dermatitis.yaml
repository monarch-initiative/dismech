- reference: DOI:10.1038/s41467-023-41857-8
  title: Multifaceted analysis of cross-tissue transcriptomes reveals phenotype–endotype associations in atopic dermatitis
  findings:
  - statement: >-
      Integrated skin-tissue and blood (PBMC) transcriptomic profiling of atopic
      dermatitis patients links distinct clinical presentations to matching
      molecular signatures, with the two main skin manifestations (erythema and
      papulation) distinguished by differential immunological signatures,
      supporting a phenotype-endotype framework and the view of AD as a systemic
      rather than a purely local disease.
    supporting_text: "The two main, qualitatively differential skin manifestations of AD, erythema and papulation are distinguished by differential immunological signatures."
- reference: DOI:10.1126/sciimmunol.abi6887
  title: IL-31–dependent neurogenic inflammation restrains cutaneous type 2 immune response in allergic dermatitis
  findings:
  - statement: >-
      In a mouse model of house dust mite-induced allergic dermatitis, IL-31 is
      not strictly proinflammatory but acts as an immunoregulatory factor that
      limits the magnitude of type 2 skin inflammation via IL31RA+ pruritoceptor
      release of CGRP, a neuroimmune brake that may explain paradoxical
      dermatitis flares in atopic patients treated with anti-IL31RA therapy.
    supporting_text: "Thus, IL-31 is not strictly a proinflammatory cytokine but rather an immunoregulatory factor that limits the magnitude of type 2 inflammatory responses in skin."

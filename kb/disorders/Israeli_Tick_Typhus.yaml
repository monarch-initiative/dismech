  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:15766388
      reference_title: >-
        Proposal to create subspecies of Rickettsia conorii based on
        multi-locus sequence typing and an emended description of Rickettsia
        conorii.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Rickettsiae closely related to the Malish strain, the reference
        Rickettsia conorii strain, include Indian tick typhus rickettsia (ITTR),
        Israeli spotted fever rickettsia (ISFR), and Astrakhan fever rickettsia
        (AFR).
      explanation: >-
        The taxonomic study identifies Israeli tick typhus as a rickettsial
        bacterial infection, placing it in Harrison's Infectious Diseases Part.


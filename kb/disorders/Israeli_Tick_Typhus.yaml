diagnosis:
- name: Indirect immunofluorescence assay serology
  description: >-
    Paired indirect immunofluorescence serology demonstrating seroconversion or
    a fourfold titer rise can confirm recent R. conorii infection.
  results: Seroconversion, a fourfold titer rise, or a single high titer supports diagnosis.
  evidence:
  - reference: PMID:23168048
    reference_title: Mediterranean spotted fever in the Trakya region of Turkey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using IFA, seroconversion or a fourfold or greater rise in titre was
      observed in 97 (77%) patients, whereas a single high titre was
      demonstrated in 16 (12.7%) patients.
    explanation: >-
      R. conorii Mediterranean spotted fever data establish IFA serology as a
      practical confirmatory test for the R. conorii complex.

- name: Skin biopsy rickettsial PCR and sequencing
  description: >-
    PCR amplification and sequencing of skin biopsy material from eschar or rash
    can detect R. conorii DNA and identify the infecting strain.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: Positive rickettsial PCR with sequencing supports R. conorii strain identification.
  evidence:
  - reference: PMID:23168048
    reference_title: Mediterranean spotted fever in the Trakya region of Turkey.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to PCR analysis, 77 (72.6%) of 106 biopsy samples showed
      positive results.
    explanation: >-
      Skin-biopsy PCR was positive in most confirmed Mediterranean spotted fever
      cases, including biopsies from both eschar and maculopapular rash.

treatments:
- name: Doxycycline
  description: >-
    Doxycycline is first-line antibacterial therapy for Israeli tick typhus and
    related R. conorii infections because it blocks rickettsial ribosomal
    translation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Doxycycline inhibits bacterial protein synthesis through the conserved
      tetracycline-class ribosomal target.
  evidence:
  - reference: PMID:2193627
    reference_title: Randomized trial of doxycycline versus josamycin for Mediterranean spotted fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 59 patients recovered uneventfully, and results did not significantly
      differ between the two schedules. One-day doxycycline therapy is an
      effective, easy, and inexpensive treatment.
    explanation: >-
      A randomized Mediterranean spotted-fever trial supports doxycycline
      efficacy in the R. conorii complex.

- name: Clarithromycin
  description: >-
    Clarithromycin is an oral macrolide alternative for Mediterranean
    spotted-fever-group rickettsioses when tetracyclines or josamycin are not
    suitable.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: Clarithromycin targets bacterial ribosomal translation.
  evidence:
  - reference: PMID:26711765
    reference_title: Randomized Trial of Clarithromycin for Mediterranean Spotted Fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no adverse reactions to treatment or relapses in either group.
      In conclusion, clarithromycin is a good alternative to doxycycline or
      josamycin in the treatment of MSF.
    explanation: >-
      A randomized MSF trial identifies clarithromycin as a macrolide
      alternative in the R. conorii complex.

animal_models:
- name: C3H/HeN Rickettsia conorii Malish infection mouse
  species: Mouse
  genotype: Wild-type C3H/HeN
  publication: PMID:7511715
  description: >-
    Intravenous R. conorii Malish 7 infection in C3H/HeN mice produces
    disseminated endothelial infection and vascular-injury outcomes, modeling
    the endotheliotropic vasculitis shared across R. conorii spotted-fever
    infections.
  modeled_mechanisms:
  - target: Rickettsial Endothelial Infection
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      High-dose infection establishes disseminated endothelial infection and
      vascular-injury-based meningoencephalitis and interstitial pneumonia.
    limitations: >-
      The model uses the R. conorii Malish 7 strain associated with
      Mediterranean spotted fever, not R. conorii subsp. israelensis, so it
      supports the shared endotheliotropic rickettsial mechanism rather than an
      israelensis-specific virulence program.
    evidence:
    - reference: PMID:7511715
      reference_title: >-
        Rickettsia conorii infection of C3H/HeN mice. A model of
        endothelial-target rickettsiosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice inoculated with a high dose of rickettsiae established
        disseminated endothelial infection on day 1, became ill with
        progressive increase in rickettsiae on day 4, and died with vascular
        injury-based meningoencephalitis and interstitial pneumonia on day 5 or
        6.
      explanation: >-
        The C3H/HeN model directly measures the endothelial infection and
        vascular-injury phenotypes central to spotted-fever pathogenesis.
  evidence:
  - reference: PMID:7511715
    reference_title: >-
      Rickettsia conorii infection of C3H/HeN mice. A model of
      endothelial-target rickettsiosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This experimental infection provides the best available model for
      rickettsial disease with endothelial infection and injury, immune
      rickettsial clearance, regeneration of endothelium, and repair of the
      vascular lesions.
    explanation: >-
      The authors frame C3H/HeN R. conorii infection as an endothelial-target
      rickettsiosis model.

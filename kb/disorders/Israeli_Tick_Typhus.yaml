name: Israeli Tick Typhus
creation_date: "2026-09-28T06:28:43Z"
category: Infectious Disease
description: >-
  Israeli tick typhus is an acute tick-borne spotted-fever-group rickettsiosis
  caused by the obligately intracellular bacterium Rickettsia conorii subsp.
  israelensis. Rhipicephalus sanguineus ticks transmit the ISF strain into
  skin, after which Sca-family rickettsial invasion factors seed endothelial
  infection, disseminated small-vessel vasculitis, thromboxane-dependent
  platelet activation, fever, rash, eschar-poor presentations, and potentially
  fulminant neurologic, renal, and shock complications.
disease_term:
  preferred_term: Israeli tick typhus
  term:
    id: MONDO:0000230
    label: Israeli tick typhus
parents:
- Spotted fever rickettsiosis
synonyms:
- Israeli spotted fever
- Rickettsia conorii subsp. israelensis infection
- Israeli spotted fever rickettsiosis

references:
- reference: PMID:15766388
  title: >-
    Proposal to create subspecies of Rickettsia conorii based on multi-locus
    sequence typing and an emended description of Rickettsia conorii.
  findings:
  - statement: >-
      Multilocus sequence typing separated Israeli spotted fever rickettsia as
      the ISFR type and established R. conorii subsp. israelensis with ISTT CDC1
      as the type strain.
    supporting_text: >-
      We propose the names R. conorii subsp. conorii subsp. nov. (type strain =
      Malish, ATCC VR-613), R. conorii subspecies indica subsp. nov. (type
      strain = ATCC VR-597), R. conorii subspecies caspia subsp. nov. (type
      strain = A-167), and R. conorii subspecies israelensis subsp. nov. (type
      strain = ISTT CDC1).
- reference: PMID:19421877
  title: >-
    Incongruent effects of two isolates of Rickettsia conorii on the survival
    of Rhipicephalus sanguineus ticks.
  findings:
  - statement: >-
      R. sanguineus is the recognized R. conorii vector in the Mediterranean
      region, and experimental ISTT exposure infected 35-66% of surviving
      R. sanguineus ticks.
    supporting_text: >-
      In the Mediterranean region, the brown dog tick, Rhipicephalus
      sanguineus, is the recognized vector of R. conorii.
- reference: PMID:34286684
  title: Spotted Fever Group Rickettsioses in Israel, 2010-2019.
  findings:
  - statement: >-
      A nationwide hospitalized Israeli spotted-fever cohort found the Israeli
      tick typhus strain in 33 of 42 patients, with 52% intensive-care use, 30%
      fatality, only 5% tick-bite history, and eschar in 12%.
    supporting_text: >-
      The most prevalent species was the Rickettsia conorii Israeli tick typhus
      strain (n = 33, 79%); infection with this species necessitated intensive
      care for 52% of patients and was associated with a 30% fatality rate. A
      history of tick bite was rare, found for only 5% of patients; eschar was
      found in 12%; and leukocytosis was more common than leukopenia.
- reference: PMID:18582199
  title: >-
    Host- and microbe-related risk factors for and pathophysiology of fatal
    Rickettsia conorii infection in Portuguese patients.
  findings:
  - statement: >-
      In a 140-patient Portuguese strain-identified R. conorii cohort, fatal
      outcome was significantly more likely with the Israeli spotted fever
      strain, and alcoholism was a host risk factor.
    supporting_text: >-
      A fatal outcome was significantly more likely for patients infected with
      the ISF strain, and alcoholism was a risk factor.
- reference: PMID:2710586
  title: Clinical and laboratory findings of spotted fever in Israeli children.
  findings:
  - statement: >-
      A prospective Israeli pediatric spotted-fever cohort documented fever,
      rash, myalgia, vomiting, thrombocytopenia, and hyponatremia as common
      manifestations.
    supporting_text: >-
      In a prospective study of 70 Israeli children with spotted fever the major
      clinical features were fever (100%), skin rash (98.5%), myalgia (54%) and
      vomiting (40%). Thrombocytopenia (75%) and hyponatremia (62.5%) were
      common, but were not associated with increased mortality.
- reference: PMID:8286624
  title: Fatal Israeli spotted fever in children.
  findings:
  - statement: >-
      Fatal pediatric Israeli spotted fever can present without tick-bite
      history or tache noire and progress to shock, encephalopathy, renal
      failure, and bleeding with death within 24 hours of admission.
    supporting_text: >-
      Clinical disease was characterized by irreversible shock, encephalopathy,
      renal failure, bleeding tendency, and death within 24 hours of admission.
      None of the patients had a history of tick bite, and no tache noire was
      noted.
- reference: PMID:22612237
  title: >-
    Identification and characterization of the mammalian association and
    actin-nucleating domains in the Rickettsia conorii autotransporter protein,
    Sca2.
  findings:
  - statement: >-
      R. conorii Sca2 is sufficient for adherence and invasion of human
      endothelial cells and participates in intracellular actin-based motility.
    supporting_text: >-
      A rickettsial autotransporter from Rickettsia conorii, Sca2, has been
      shown to be sufficient to mediate both adherence and invasion of human
      endothelial cells and to participate in intracellular actin-based motility.
- reference: PMID:8584998
  title: >-
    Demonstration of Rickettsia Conorii-induced coagulative and platelet
    activation in vivo in patients with Mediterranean spotted fever.
  findings:
  - statement: >-
      Human R. conorii infection can drive TXA2-dependent platelet activation,
      thrombin generation, endothelial dysfunction, vasculitis, and focal
      microthrombus formation.
    supporting_text: >-
      Our results provide biochemical evidence for the occurrence of
      TXA2-dependent platelet activation and thrombin generation in vivo,
      together with endothelial dysfunction. These phenomena could account for
      clinical manifestations of MSF, such as vasculitis and focal microthrombus
      formation.
- reference: PMID:23168048
  title: Mediterranean spotted fever in the Trakya region of Turkey.
  findings:
  - statement: >-
      In confirmed R. conorii Mediterranean spotted fever, IFA demonstrated
      seroconversion or a fourfold titer rise in 77% of patients and skin-biopsy
      PCR was positive in 72.6% of tested biopsies.
    supporting_text: >-
      Using IFA, seroconversion or a fourfold or greater rise in titre was
      observed in 97 (77%) patients, whereas a single high titre was
      demonstrated in 16 (12.7%) patients. According to PCR analysis, 77 (72.6%)
      of 106 biopsy samples showed positive results.
- reference: PMID:2193627
  title: Randomized trial of doxycycline versus josamycin for Mediterranean spotted fever.
  findings:
  - statement: >-
      One-day doxycycline and five-day josamycin both achieved uneventful
      recovery in a Mediterranean spotted-fever randomized trial.
    supporting_text: >-
      We undertook a randomized clinical trial comparing therapeutic efficacy of
      the 1-day doxycycline regimen with the 5-day josamycin regimen for
      Mediterranean spotted fever. All 59 patients recovered uneventfully, and
      results did not significantly differ between the two schedules.
- reference: PMID:26711765
  title: Randomized Trial of Clarithromycin for Mediterranean Spotted Fever.
  findings:
  - statement: >-
      Clarithromycin is an oral macrolide alternative to doxycycline or
      josamycin for Mediterranean spotted fever.
    supporting_text: >-
      There were no adverse reactions to treatment or relapses in either group.
      In conclusion, clarithromycin is a good alternative to doxycycline or
      josamycin in the treatment of MSF.
- reference: PMID:7511715
  title: >-
    Rickettsia conorii infection of C3H/HeN mice. A model of
    endothelial-target rickettsiosis.
  findings:
  - statement: >-
      R. conorii Malish infection in C3H/HeN mice produces disseminated
      endothelial infection and vascular injury.
    supporting_text: >-
      Mice inoculated with a high dose of rickettsiae established disseminated
      endothelial infection on day 1, became ill with progressive increase in
      rickettsiae on day 4, and died with vascular injury-based
      meningoencephalitis and interstitial pneumonia on day 5 or 6.


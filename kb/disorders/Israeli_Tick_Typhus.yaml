  description: >-
    R. conorii subsp. israelensis, like other bacteria, depends on ribosomal
    translation of its mRNA, making the bacterial ribosome the conserved target
    for doxycycline and macrolide antibacterial therapy.
  biological_processes:
  - preferred_term: Translation

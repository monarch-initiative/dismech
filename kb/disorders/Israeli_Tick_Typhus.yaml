transmission:
- name: Rhipicephalus sanguineus tick bite inoculation
  description: >-
    Humans acquire Israeli tick typhus when infected brown dog ticks bite and
    inoculate R. conorii subsp. israelensis into skin.
  evidence:
  - reference: PMID:19421877
    reference_title: >-
      Incongruent effects of two isolates of Rickettsia conorii on the survival
      of Rhipicephalus sanguineus ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the Mediterranean region, the brown dog tick, Rhipicephalus
      sanguineus, is the recognized vector of R. conorii.
    explanation: >-
      The experimental tick study identifies R. sanguineus as the recognized
      vector for R. conorii in the Mediterranean setting.
  - reference: PMID:19421877
    reference_title: >-
      Incongruent effects of two isolates of Rickettsia conorii on the survival
      of Rhipicephalus sanguineus ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      On the other hand, exposure to ISTT strain had lesser effect on tick
      survival and resulted in 35-66% prevalence of infection.
    explanation: >-
      R. sanguineus ticks experimentally exposed to the Israeli tick typhus
      strain sustain infection, supporting biological compatibility between the
      pathogen and vector.

epidemiology:
- name: Israel and Mediterranean brown-dog-tick exposure
  description: >-
    Hospitalized Israeli cases are dominated by the Israeli tick typhus strain,
    cluster near the Mediterranean shoreline, and often lack a recalled tick
    bite or visible eschar.
  factors:
  - Israel exposure
  - Rhipicephalus sanguineus tick exposure
  - Mediterranean shoreline exposure
  evidence:
  - reference: PMID:34286684
    reference_title: Spotted Fever Group Rickettsioses in Israel, 2010-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a multicenter, nationwide, retrospective study of patients hospitalized
      with spotted fever group rickettsiosis in Israel during 2010-2019, we
      identified 42 cases, of which 36 were autochthonous.
    explanation: >-
      The national series documents modern autochthonous spotted-fever-group
      rickettsiosis in hospitalized Israeli patients.
  - reference: PMID:34286684
    reference_title: Spotted Fever Group Rickettsioses in Israel, 2010-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prevalent species was the Rickettsia conorii Israeli tick typhus
      strain (n = 33, 79%); infection with this species necessitated intensive
      care for 52% of patients and was associated with a 30% fatality rate.
    explanation: >-
      Species-identified hospitalized cases show that the Israeli tick typhus
      strain was the dominant local agent and that it caused severe disease in a
      selected hospitalized cohort.

pathophysiology:
- name: Brown Dog Tick ISF Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    A feeding R. sanguineus tick inoculates R. conorii subsp. israelensis into
    skin, seeding a local dermal focus that may form an eschar and can
    disseminate to vascular endothelium.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:19421877
    reference_title: >-
      Incongruent effects of two isolates of Rickettsia conorii on the survival
      of Rhipicephalus sanguineus ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the Mediterranean region, the brown dog tick, Rhipicephalus
      sanguineus, is the recognized vector of R. conorii.
    explanation: >-
      R. sanguineus is the recognized tick vector for the Mediterranean
      R. conorii complex.
  downstream:
  - target: Inoculation Eschar
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Local dermal rickettsial infection produces the necrotic eschar.
  - target: Sca2-Dependent Endothelial Invasion and Actin Motility
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Disseminating organisms use Sca-family host-cell entry machinery.
  - target: Rickettsial Endothelial Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Inoculated organisms disseminate to vascular endothelium.

- name: Sca2-Dependent Endothelial Invasion and Actin Motility
  role: host_cell_invasion
  biological_scale: CELLULAR
  description: >-
    R. conorii Sca2 is a multifunctional surface autotransporter that mediates
    mammalian host-cell association, invasion of human endothelial cells, and
    actin-based motility; these shared spotted-fever-group functions are placed
    upstream of systemic Israeli tick typhus endothelial infection.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: symbiont entry into host
    modifier: INCREASED
    term:
      id: GO:0044409
      label: symbiont entry into host
  - preferred_term: actin filament polymerization
    modifier: INCREASED
    term:
      id: GO:0030041
      label: actin filament polymerization
  evidence:
  - reference: PMID:22612237
    reference_title: >-
      Identification and characterization of the mammalian association and
      actin-nucleating domains in the Rickettsia conorii autotransporter
      protein, Sca2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A rickettsial autotransporter from Rickettsia conorii, Sca2, has been
      shown to be sufficient to mediate both adherence and invasion of human
      endothelial cells and to participate in intracellular actin-based motility.
    explanation: >-
      R. conorii Sca2 provides a direct bacterial mechanism for endothelial
      adhesion, invasion, and actin-linked spread.
  downstream:
  - target: Rickettsial Endothelial Infection
    causal_link_type: DIRECT
    description: Rickettsial uptake and cytosolic motility seed endothelial infection.

- name: Rickettsial Endothelial Infection
  role: cellular_infection
  description: >-
    R. conorii subsp. israelensis belongs to the R. conorii complex of
    endotheliotropic spotted-fever rickettsiae; systemic infection of small
    vascular endothelium is the cellular lesion that transduces infection into
    vasculitis, vascular leak, and severe end-organ injury.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:7511715
    reference_title: >-
      Rickettsia conorii infection of C3H/HeN mice. A model of
      endothelial-target rickettsiosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This experimental infection provides the best available model for
      rickettsial disease with endothelial infection and injury, immune
      rickettsial clearance, regeneration of endothelium, and repair of the
      vascular lesions.
    explanation: >-
      The R. conorii C3H/HeN model demonstrates the conserved endothelial-target
      lesion for the R. conorii complex; it is strain-general rather than
      israelensis-specific.
  downstream:
  - target: Rickettsial Vasculitis
    causal_link_type: DIRECT
    description: Endothelial infection drives disseminated vascular inflammation.

- name: Rickettsial Vasculitis
  role: vascular_response
  description: >-
    Endothelial infection and inflammation produce a systemic small-vessel
    vasculitis that clinically manifests as fever, rash, severe vascular leak,
    neurologic involvement, renal failure, and shock in fulminant Israeli tick
    typhus.

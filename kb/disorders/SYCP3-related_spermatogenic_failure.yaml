- reference: PMID:19110213
  title: "Mutations of the SYCP3 gene in women with recurrent pregnancy loss."
  findings:
  - statement: >-
      Heterozygous SYCP3 variants were reported in two of 26 women with
      recurrent pregnancy loss and shown to disrupt SYCP3 fibre formation in
      cultured cells.
    supporting_text: >-
      In our current study, we show that mutations in SYCP3, a gene encoding an
      essential component of the synaptonemal complex that is central to the
      interaction of homologous chromosomes, are associated with recurrent
      pregnancy loss.

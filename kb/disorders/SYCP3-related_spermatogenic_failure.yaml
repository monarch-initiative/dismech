differential_diagnoses:
- name: SYCE1-related gametogenic failure
  disease_term:
    preferred_term: SYCE1-related gametogenic failure
    term:
      id: MONDO:1060214
      label: SYCE1-related gametogenic failure
  description: >-
    Caused by recessive pathogenic variants or copy-number deletions in SYCE1,
    which encodes central element protein 1 of the synaptonemal complex, leading
    to defective synaptonemal complex assembly, meiotic arrest, and
    non-obstructive azoospermia in males or premature ovarian insufficiency in
    females.
  distinguishing_features:
  - Autosomal recessive inheritance due to biallelic loss-of-function variants or deletions in SYCE1, whereas human male SYCP3-related spermatogenic failure is typically autosomal dominant via dominant-negative C-terminal truncation
  - Distinguished definitively by molecular genetic sequencing and copy-number analysis of synaptonemal complex genes
  evidence:
  - reference: PMID:34718620
    reference_title: "Variations of C14ORF39 and SYCE1 Identified in Idiopathic Premature Ovarian Insufficiency and Nonobstructive Azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two homozygous variations of C14ORF39 and 2 recessive variations of SYCE1
      were first identified in sporadic patients with POI and NOA, respectively.
      Functional studies showed the C14ORF39 variations significantly accelerated
      the protein degradation and the variations in SYCE1 disrupted its
      interaction with SYCP1 or C14ORF39, both of which affected SC assembly and
      meiosis.
    explanation: >-
      Demonstrates that recessive SYCE1 variants disrupt synaptonemal complex
      assembly and meiosis to cause non-obstructive azoospermia, distinguishing
      autosomal recessive SYCE1 deficiency from autosomal dominant SYCP3
      truncation.
  - reference: PMID:35718780
    reference_title: "Novel copy number variations within SYCE1 caused meiotic arrest and non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      H&E and IF staining demonstrated that the spermatogenesis was arrested at
      pachytene stage in the two patients with NOA, suggesting these two novel
      CNVs within SYCE1 could lead to meiotic defect and NOA.
    explanation: >-
      Confirms that copy-number deletions within SYCE1 cause pachytene-stage
      meiotic arrest and non-obstructive azoospermia clinically overlapping with
      SYCP3-related spermatogenic failure.
  - reference: PMID:40896145
    reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The LP/P variants impacted 25 genes: ADAD2, BCORL1, C1orf146, DCAF12L1,
      DMRT1, FANCA, FATE1, KCTD19, LUZP4, M1AP, MCM9, MEIOB, MLH3, MSH4, PASD1,
      RBBP7, SHOC1, STAG3, SYCE1, SYCP3, TERB1, TEX11, TEX14, UBR2, and ZMYM5.
    explanation: >-
      Identifies both SYCE1 and SYCP3 among the monogenic causes of human
      non-obstructive azoospermia that require molecular genetic testing for
      differentiation.
- name: TEX11-related spermatogenic failure
  disease_term:
    preferred_term: spermatogenic failure, X-linked, 2
    term:
      id: MONDO:0010647
      label: spermatogenic failure, X-linked, 2
  description: >-
    Caused by hemizygous pathogenic variants or exon deletions in the X-linked
    meiotic gene TEX11 (a component of the ZZS complex with SHOC1 and SPO16),
    resulting in severe disruption of the meiotic recombination machinery, early
    meiotic arrest with complete absence of haploid germ cells, and
    non-obstructive azoospermia clinically overlapping with SYCP3-related
    spermatogenic failure.
  distinguishing_features:
  - X-linked recessive inheritance due to hemizygous TEX11 variants rather than autosomal dominant SYCP3 variants
  - Distinguished by molecular genetic testing of meiotic-arrest azoospermia genes
  evidence:
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified a 99-kb hemizygous loss on chromosome Xq13.2 that involved
      three TEX11 exons.
    explanation: >-
      Establishes X-linked hemizygous loss-of-function mutations in TEX11 on
      chromosome Xq13.2, contrasting with autosomal SYCP3 mutations on 12q23.2.
  - reference: PMID:25970010
    reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In our study, hemizygous TEX11 mutations were a common cause of meiotic
      arrest and azoospermia in infertile men.
    explanation: >-
      Demonstrates that hemizygous TEX11 mutations cause human meiotic arrest
      and non-obstructive azoospermia clinically overlapping with SYCP3-related
      spermatogenic failure.
  - reference: PMID:40374915
    reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In contrast, the complete loss of one of the human ZZS proteins, SHOC1,
      TEX11 or SPO16, which interact with M1AP, resulted in a severe disruption
      of the recombination machinery, leading to early meiotic arrest and the
      complete absence of haploid cells.
    explanation: >-
      Details the mechanism of TEX11 loss of function—disruption of the ZZS
      meiotic recombination complex causing early meiotic arrest and absence of
      haploid cells—which mimics the histological maturation arrest of SYCP3
      deficiency.
animal_models:
- name: Sycp3-/- (Scp3-null) knockout mouse
  species: Mus musculus
  genotype: Sycp3-/- (homozygous null)
  category: Knockout
  publication: PMID:10678170
  description: >-
    Homozygous Sycp3-null mice exhibit sexually dimorphic meiotic defects:
    males are completely sterile with failure of axial/lateral element assembly,
    absent homologous chromosome synapsis, and massive pachytene/zygotene
    spermatocyte apoptosis, whereas females are subfertile with achiasmate
    oocytes, meiotic nondisjunction, oocyte aneuploidy, and embryonic death.
  associated_phenotypes:
  - Azoospermia
  - Male infertility
  - Abnormal spermatogenesis
  modeled_mechanisms:
  - target: Synaptonemal complex axial/lateral element assembly failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Recapitulates complete failure of axial/lateral element and synaptonemal
      complex assembly in primary spermatocytes, though via a homozygous null
      allele rather than the human heterozygous dominant-negative truncation.
    evidence:
    - reference: PMID:10678170
      reference_title: "The murine SCP3 gene is required for synaptonemal complex assembly, chromosome synapsis, and male fertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The SCP3-deficient male mice failed to form axial/lateral elements and
        SCs, and the chromosomes in the mutant spermatocytes did not synapse.
      explanation: >-
        Demonstrates that the mouse knockout directly models failure of
        axial/lateral element and synaptonemal complex assembly.
  - target: Pachytene-stage meiotic arrest and germ-cell apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Recapitulates zygotene/pachytene meiotic arrest and massive apoptotic
      elimination of developing spermatocytes resulting in male sterility.
    evidence:
    - reference: PMID:10678170
      reference_title: "The murine SCP3 gene is required for synaptonemal complex assembly, chromosome synapsis, and male fertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        homozygous mutant males were sterile due to massive apoptotic cell death
        during meiotic prophase.
      explanation: >-
        Demonstrates that the mouse knockout faithfully recapitulates meiotic
        prophase apoptosis and male sterility.
  - target: Female meiotic chromosome missegregation and oocyte aneuploidy (contested)
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygous Sycp3-null female mice exhibit defective meiotic chromosome
      segregation, oocyte aneuploidy, and in utero embryo death, providing the
      mechanistic basis for the proposed human female phenotype.
    evidence:
    - reference: PMID:12004129
      reference_title: "Female germ cell aneuploidy and embryo death in mice lacking the meiosis-specific protein SCP3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we show that the absence of synaptonemal complex protein 3 (SCP3)
        promotes aneuploidy in murine oocytes by inducing defective meiotic
        chromosome segregation.
      explanation: >-
        Shows that Sycp3-null female mice model oocyte aneuploidy and embryo
        death from defective meiotic chromosome segregation.
  evidence:
  - reference: PMID:10678170
    reference_title: "The murine SCP3 gene is required for synaptonemal complex assembly, chromosome synapsis, and male fertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A null mutation in the SCP3 gene was generated, and we noted that
      homozygous mutant males were sterile due to massive apoptotic cell death
      during meiotic prophase.
    explanation: >-
      Primary report generating and characterizing the Sycp3-/- mouse model.
  - reference: PMID:12004129
    reference_title: "Female germ cell aneuploidy and embryo death in mice lacking the meiosis-specific protein SCP3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the absence of synaptonemal complex protein 3 (SCP3)
      promotes aneuploidy in murine oocytes by inducing defective meiotic
      chromosome segregation.
    explanation: >-
      Characterizes the sexually dimorphic female oocyte aneuploidy phenotype in
      the same Sycp3-null mouse model.
discussions:
- discussion_id: sycp3-female-recurrent-pregnancy-loss-controversy
  prompt: >-
    Do heterozygous SYCP3 variants cause oocyte aneuploidy and recurrent
    pregnancy loss in women, or is human SYCP3-related gametogenic failure
    clinically restricted to male meiotic arrest?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - "pathophysiology#Female meiotic chromosome missegregation and oocyte aneuploidy (contested)"
  rationale: >-
    A 2009 study (PMID:19110213) reported heterozygous SYCP3 variants
    (including IVS7-16_19delACTT and 657T>C) in 2 of 26 women with unexplained
    recurrent pregnancy loss and showed dominant-negative interference with
    SYCP3 fibre formation in vitro, proposing human sexual dimorphism analogous
    to Sycp3-null mice. However, Mizutani et al. (2011, PMID:21357605) screened
    101 patients with recurrent miscarriage and 200 fertile controls, finding
    the 657T>C allele at comparable frequencies in patients with normal and
    abnormal embryonic karyotypes as well as fertile controls. Whether genuinely
    loss-of-function or dominant-negative SYCP3 variants cause human female
    recurrent pregnancy loss remains unresolved.
  evidence:
  - reference: PMID:19110213
    reference_title: "Mutations of the SYCP3 gene in women with recurrent pregnancy loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined with the fact that similar mutations have been previously
      identified in two males with azoospermia, our current data suggest that
      sexual dimorphism in response to meiotic disruption occurs even in humans.
    explanation: >-
      Presents the initial claim that heterozygous SYCP3 mutations cause human
      recurrent pregnancy loss via sexually dimorphic meiotic disruption.
  - reference: PMID:21357605
    reference_title: "SYCP3 mutation may not be associated with recurrent miscarriage caused by aneuploidy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 657T>C mutation of SYCP3 may not be associated with recurrent
      miscarriage caused by aneuploidy.
    explanation: >-
      Refutes a causal association between the reported SYCP3 657T>C variant
      and aneuploidy-related recurrent miscarriage in a larger follow-up cohort.

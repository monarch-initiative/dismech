- reference: PMID:14643120
  title: "Azoospermia in patients heterozygous for a mutation in SYCP3."
  findings:
  - statement: >-
      Heterozygous 643delA truncating mutations in SYCP3 were identified in two
      of 19 azoospermic men with maturation arrest and act via dominant-negative
      interference with SYCP3 fibre formation.
    supporting_text: >-

- reference: PMID:21357605
  title: "SYCP3 mutation may not be associated with recurrent miscarriage caused by aneuploidy."
  findings:
  - statement: >-
      Screening of 101 recurrent miscarriage patients and 200 fertile controls
      found no association between the SYCP3 657T>C polymorphism and
      aneuploidy-related recurrent miscarriage.
    supporting_text: >-
      The 657T>C mutation of SYCP3 may not be associated with recurrent
      miscarriage caused by aneuploidy.

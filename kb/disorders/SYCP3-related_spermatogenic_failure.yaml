        miscarriage caused by aneuploidy.
      explanation: >-
        Finds no association between the SYCP3 657T>C variant and recurrent
        miscarriage caused by embryonic aneuploidy.
- reference: PMID:25970010
  title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
  findings:
  - statement: >-
      Standardized semen analysis according to World Health Organization
      guidelines confirms the clinical diagnosis of non-obstructive azoospermia
      in infertile men with meiotic arrest, and hemizygous X-linked TEX11
      mutations are a recurrent monogenic cause of meiotic arrest and
      azoospermia.
    supporting_text: >-
      In our study, hemizygous TEX11 mutations were a common cause of meiotic
      arrest and azoospermia in infertile men.
    evidence:
    - reference: PMID:25970010
      reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In all patients, a diagnosis of nonobstructive azoospermia was confirmed
        by means of semen analysis performed according to the guidelines of the
        World Health Organization.
      explanation: >-
        Documents WHO-standardized semen analysis as the diagnostic test
        confirming non-obstructive azoospermia in men with meiotic arrest.
    - reference: PMID:25970010
      reference_title: "X-linked TEX11 mutations, meiotic arrest, and azoospermia in infertile men."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In our study, hemizygous TEX11 mutations were a common cause of meiotic
        arrest and azoospermia in infertile men.
      explanation: >-
        Establishes X-linked hemizygous TEX11 mutations as a monogenic cause of
        human meiotic arrest and non-obstructive azoospermia.
- reference: PMID:34718620
  title: "Variations of C14ORF39 and SYCE1 Identified in Idiopathic Premature Ovarian Insufficiency and Nonobstructive Azoospermia."
  findings:
  - statement: >-
      Recessive SYCE1 variants identified in patients with non-obstructive
      azoospermia disrupt SYCE1 interaction with SYCP1 or C14ORF39 and impair
      synaptonemal complex assembly and meiosis.
    supporting_text: >-
      Two homozygous variations of C14ORF39 and 2 recessive variations of SYCE1
      were first identified in sporadic patients with POI and NOA, respectively.
      Functional studies showed the C14ORF39 variations significantly accelerated
      the protein degradation and the variations in SYCE1 disrupted its
      interaction with SYCP1 or C14ORF39, both of which affected SC assembly and
      meiosis.
    evidence:
    - reference: PMID:34718620
      reference_title: "Variations of C14ORF39 and SYCE1 Identified in Idiopathic Premature Ovarian Insufficiency and Nonobstructive Azoospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two homozygous variations of C14ORF39 and 2 recessive variations of SYCE1
        were first identified in sporadic patients with POI and NOA, respectively.
        Functional studies showed the C14ORF39 variations significantly accelerated
        the protein degradation and the variations in SYCE1 disrupted its
        interaction with SYCP1 or C14ORF39, both of which affected SC assembly and
        meiosis.
      explanation: >-
        Demonstrates that recessive SYCE1 variations disrupt synaptonemal
        complex assembly and cause human non-obstructive azoospermia.
- reference: PMID:35718780
  title: "Novel copy number variations within SYCE1 caused meiotic arrest and non-obstructive azoospermia."
  findings:
  - statement: >-
      Copy-number deletions within SYCE1 cause pachytene-stage meiotic arrest
      and non-obstructive azoospermia in infertile men.
    supporting_text: >-
      H&E and IF staining demonstrated that the spermatogenesis was arrested at
      pachytene stage in the two patients with NOA, suggesting these two novel
      CNVs within SYCE1 could lead to meiotic defect and NOA.
    evidence:
    - reference: PMID:35718780
      reference_title: "Novel copy number variations within SYCE1 caused meiotic arrest and non-obstructive azoospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        H&E and IF staining demonstrated that the spermatogenesis was arrested at
        pachytene stage in the two patients with NOA, suggesting these two novel
        CNVs within SYCE1 could lead to meiotic defect and NOA.
      explanation: >-
        Demonstrates that SYCE1 copy-number deletions cause pachytene-stage
        meiotic arrest and non-obstructive azoospermia.
- reference: PMID:40374915
  title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
  findings:
  - statement: >-
      Men with primary meiotic-arrest non-obstructive azoospermia due to M1AP
      or ZZS-gene (SHOC1, TEX11, SPO16) loss-of-function variants present with
      normal testicular volumes, serum follicle-stimulating hormone in the high
      range, and normal serum testosterone, with complete loss of ZZS proteins
      causing early meiotic arrest and absence of haploid cells.
    supporting_text: >-
      Clinical features were similar between men, including normal testicular
      volumes, normal luteinising hormone, follicle-stimulating hormone in the
      high range, and normal testosterone
    evidence:
    - reference: PMID:40374915
      reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical features were similar between men, including normal testicular
        volumes, normal luteinising hormone, follicle-stimulating hormone in the
        high range, and normal testosterone
      explanation: >-
        Documents the typical clinical and endocrine profile of primary
        meiotic-arrest non-obstructive azoospermia in M1AP and ZZS-gene cohorts.
    - reference: PMID:40374915
      reference_title: "Genotype-specific differences in infertile men due to loss-of-function variants in M1AP or ZZS genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast, the complete loss of one of the human ZZS proteins, SHOC1,
        TEX11 or SPO16, which interact with M1AP, resulted in a severe disruption
        of the recombination machinery, leading to early meiotic arrest and the
        complete absence of haploid cells.
      explanation: >-
        Establishes that complete loss of TEX11 or its ZZS complex partners
        disrupts meiotic recombination and causes early meiotic arrest without
        haploid germ cells.
- reference: PMID:40896145
  title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
  findings:
  - statement: >-
      Multicentre exome sequencing of men with non-obstructive azoospermia
      identifies likely pathogenic or pathogenic variants across 25 meiotic and
      spermatogenic genes including SYCP3, SYCE1, and TEX11.
    supporting_text: >-
      The LP/P variants impacted 25 genes: ADAD2, BCORL1, C1orf146, DCAF12L1,
      DMRT1, FANCA, FATE1, KCTD19, LUZP4, M1AP, MCM9, MEIOB, MLH3, MSH4, PASD1,
      RBBP7, SHOC1, STAG3, SYCE1, SYCP3, TERB1, TEX11, TEX14, UBR2, and ZMYM5.
    evidence:
    - reference: PMID:40896145
      reference_title: "Genetic determinants of testicular sperm extraction outcomes: insights from a large multicentre study of men with non-obstructive azoospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The LP/P variants impacted 25 genes: ADAD2, BCORL1, C1orf146, DCAF12L1,
        DMRT1, FANCA, FATE1, KCTD19, LUZP4, M1AP, MCM9, MEIOB, MLH3, MSH4, PASD1,
        RBBP7, SHOC1, STAG3, SYCE1, SYCP3, TERB1, TEX11, TEX14, UBR2, and ZMYM5.
      explanation: >-
        Identifies SYCP3, SYCE1, and TEX11 among the 25 genes harboring likely
        pathogenic or pathogenic variants in a multicentre non-obstructive
        azoospermia cohort.

- reference: PMID:12004129
  title: "Female germ cell aneuploidy and embryo death in mice lacking the meiosis-specific protein SCP3."
  findings:
  - statement: >-
      Loss of SCP3 (SYCP3) in female mice causes defective meiotic chromosome
      segregation, oocyte aneuploidy, and in utero death of aneuploid embryos.
    supporting_text: >-
      Here we show that the absence of synaptonemal complex protein 3 (SCP3)
      promotes aneuploidy in murine oocytes by inducing defective meiotic
      chromosome segregation.

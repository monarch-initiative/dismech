- name: Female meiotic chromosome missegregation and oocyte aneuploidy (contested)
  description: >-
    A sexually dimorphic female branch has been proposed: SYCP3 variants may
    perturb meiotic chromosome segregation in oocytes, generating aneuploid
    oocytes and conceptuses that manifest clinically as recurrent pregnancy loss.
    In Sycp3-null female mice, chiasma reduction, meiotic chromosome
    missegregation, oocyte aneuploidy, and early embryo death are well
    established. In humans the association with recurrent pregnancy loss is
    contested — reported in a small recurrent-pregnancy-loss cohort but not
    confirmed in a later study — so this cellular meiotic mechanism is modeled
    with both supporting and refuting evidence rather than as an established
    downstream clinical phenotype.

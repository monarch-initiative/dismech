name: Propofol Infusion Syndrome
creation_date: "2026-09-29T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Adverse Drug Reaction
- Acquired Mitochondrial Dysfunction
description: >-
  Propofol infusion syndrome (PRIS) is a rare, frequently fatal multi-organ
  toxicity of high-dose, prolonged propofol sedation. The defining presentation
  is acute refractory bradycardia progressing toward asystole, accompanied by
  some combination of unexplained metabolic or lactic acidosis, rhabdomyolysis,
  hyperkalemia, hyperlipidemia, hepatomegaly, renal failure and rapidly
  progressive cardiac failure. The proposed mechanism is impairment of
  mitochondrial energy metabolism by propofol, through inhibition of the
  respiratory chain, uncoupling by proton leak, and a defect of fatty acid
  oxidation, which together starve tissues with high oxidative demand. Because
  the electrocardiogram in PRIS can show coved ST elevation in the right
  precordial leads, the syndrome is also the clinical setting in which the term
  Brugada phenocopy was first used. This entry models the toxic syndrome rather
  than propofol sedation in general or every adverse effect of the drug.
synonyms:
- PRIS
- propofol-related infusion syndrome
parents:
- adverse drug reaction
- drug-induced mitochondrial toxicity
notes: >-
  No ontology term for this syndrome was found, so no disease_term is asserted.
  MONDO was searched through the configured ols:mondo adapter with
  `search l~propofol` and with free-text searches for "propofol" and "propofol
  infusion syndrome"; all three returned nothing, against a positive control on
  `l~Brugada` that returns the expected Brugada syndrome terms. NCIT
  (`ols:ncit`, `search l^propofol`) holds only the drug, NCIT:C29384 Propofol.
  No cached Orphanet leaf record mentions propofol. MeSH, by contrast, does code
  the syndrome, as the supplementary concept D000072736 "Propofol Infusion
  Syndrome" (verified through the NCBI MeSH database; note that a supplementary
  concept record is retrieved by its own UID, 2016775, not by the 68-prefixed
  form that works for descriptors). dismech has no MeSH mapping slot, so that
  identifier is recorded here rather than under mappings. A MONDO term request is
  a reasonable follow-up; its required parent field is a nosology judgement that
  has not been made, because classifying by cause places the syndrome with drug
  toxicities while classifying by manifestation places it with acquired
  multi-system metabolic disease. See issue #13101.

  No conforms_to is declared. The two closest mechanism modules were read and
  neither fits. `mitochondrial_dysfunction` scopes itself to the hallmark of
  aging, and its chain begins at mitochondrial damage with mtDNA mutation and
  passes through impaired mitophagy, neither of which this acute
  pharmacological inhibition has. `metabolic_intoxication_decompensation`
  scopes itself to intoxication-type inborn errors with a deficient enzyme or
  transporter, where the block here is reversible drug inhibition in a
  previously normal pathway. A drug-induced mitochondrial toxicity module would
  be a new module rather than a second use of either.
classifications:
  harrisons_chapter:
  - classification_value: POISONING_ENVENOMATION
    evidence:
    - reference: PMID:17567345
      reference_title: Propofol infusion syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        There is an association between PRIS and propofol infusions at doses
        higher than 4 mg.kg(-1).h(-1) for greater than 48 h duration.
      explanation: >-
        The syndrome is a dose- and duration-related toxicity of a drug rather
        than a disease of independent origin, which places it in the poisoning
        and drug-overdose chapter.
  - classification_value: CRITICAL_CARE
    evidence:
    - reference: PMID:26558513
      reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In 138 cases (90 %) patients developed PRIS as a complication of
        non-procedural sedation in ICUs and in 15 cases (10 %) as a complication
        of the use of propofol during anaesthesia.
      explanation: >-
        Nine in ten reported cases arose during intensive-care sedation rather
        than anaesthesia, which places the syndrome in the critical-care chapter
        as well as the poisoning one.
definitions:
- name: Classic PRIS case definition
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Acute refractory bradycardia progressing to asystole, together with at least
    one of metabolic acidosis with a base deficit above 10 mmol/L,
    rhabdomyolysis, hyperlipidemia, or an enlarged or fatty liver, in a patient
    receiving propofol.
  notes: >-
    Recorded as a case definition rather than consensus diagnostic criteria,
    because the structured review of 153 published cases states that no widely
    accepted definition exists and that reported cases describe varying
    combinations of features.
  evidence:
  - reference: PMID:17567345
    reference_title: Propofol infusion syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical features of propofol infusion syndrome (PRIS) are acute
      refractory bradycardia leading to asystole, in the presence of one or more
      of the following: metabolic acidosis (base deficit > 10 mmol.l(-1)),
      rhabdomyolysis, hyperlipidaemia, and enlarged or fatty liver.
    explanation: The source of the feature set this definition records.
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There is no widely accepted definition, but in most cases various
      combinations of the following are described: unexplained metabolic
      acidosis, rhabdomyolysis, hyperkalaemia, hepatomegaly, renal failure,
      hyperlipidaemia, arrhythmia, Brugada-type electrocardiograph (ECG;
      elevated ST-segment and coved T-wave) and rapidly progressive cardiac
      failure.
    explanation: >-
      States that the definition is not settled and lists the wider feature set
      seen across reported cases, which is why this is a case definition rather
      than validated criteria.
epidemiology:
- name: Incidence in critically ill adults on propofol for more than 24 hours
  description: >-
    In a prospective multicenter cohort of 1,017 critically ill adults
    prescribed propofol, the syndrome developed in 11, slightly exceeding 1%,
    under a conservative definition requiring metabolic acidosis plus cardiac
    dysfunction plus one of rhabdomyolysis, hypertriglyceridemia or renal
    failure. This is the only prospective incidence estimate; every other figure
    in this entry comes from pooled case reports, where the denominator is
    unknown.
  unit: proportion of a prospective ICU cohort
  evidence:
  - reference: PMID:19874582
    reference_title: "Incidence of propofol-related infusion syndrome in critically ill adults: a prospective, multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      CONCLUSIONS: Despite using a conservative definition for PRIS, and only
      considering new-onset PRIS clinical manifestations, the incidence of PRIS
      slightly exceeds 1%.
    explanation: >-
      The prospective incidence estimate, with the authors' own note that their
      definition was conservative.
  - reference: PMID:19874582
    reference_title: "Incidence of propofol-related infusion syndrome in critically ill adults: a prospective, multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      While propofol is associated with an infusion syndrome (PRIS) that may
      cause death, the incidence of PRIS is unknown.
    explanation: >-
      States why a prospective denominator was needed: before this study the
      incidence rested on voluntarily reported cases.
- name: Cases in the published literature to 2019
  description: >-
    A structured literature review identified 168 cases across 108
    publications, analysing children and adults separately because propofol is
    no longer used for long-term sedation in children.
  unit: cases reported in the literature
  evidence:
  - reference: PMID:30857601
    reference_title: "Propofol infusion syndrome: a structured literature review and analysis of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We reviewed 108 publications documenting 168 cases of propofol infusion syndrome.
    explanation: Gives the size of the reported case literature.
pathophysiology:
- name: Mitochondrial Respiratory Chain Inhibition by Propofol
  biological_scale: MOLECULAR
  description: >-
    Propofol inhibits electron transport, with complex I more sensitive than
    complex II, and additionally permits a proton leak across the inner
    mitochondrial membrane. The result is reduced oxidative phosphorylation
    capacity with a dissipated proton-motive force.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
  - preferred_term: proton leak across the inner mitochondrial membrane
    modifier: INCREASED
    term:
      id: GO:1902600
      label: proton transmembrane transport
  downstream:
  - target: Cellular Bioenergetic Failure
    causal_link_type: DIRECT
    description: Loss of oxidative ATP production starves tissues of high oxidative demand.
  evidence:
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Complex I in isolated rat liver mitochondria is more sensitive to
      inhibition by propofol than complex II
    explanation: >-
      Locates the respiratory-chain lesion at complex I in isolated
      mitochondria, which is the experimental basis for this node.
  - reference: PMID:17567345
    reference_title: Propofol infusion syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is proposed that the syndrome may be caused by either a direct
      mitochondrial respiratory chain inhibition or impaired mitochondrial fatty
      acid metabolism mediated by propofol.
    explanation: >-
      States respiratory-chain inhibition as one of the two proposed mechanisms.
      Note the hedging verb: this is a proposal, not an established mechanism.
- name: Impaired Mitochondrial Fatty Acid Oxidation
  biological_scale: MOLECULAR
  description: >-
    Propofol also produces a defect of fatty acid oxidation, evidenced in
    children with PRIS by accumulation of acylcarnitine species that normalised
    once the infusion stopped. Free fatty acids rise at the same time, because
    critical illness shifts the energy source toward lipolysis and the lipid
    vehicle of propofol adds further substrate.
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    modifier: DECREASED
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  downstream:
  - target: Cellular Bioenergetic Failure
    causal_link_type: DIRECT
    description: >-
      Blocking the alternative oxidative fuel compounds the energy deficit,
      particularly where carbohydrate intake is inadequate.
  evidence:
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      increased plasma concentrations of acyl derivatives of carnitine in
      children with PRIS, which normalised after cessation of propofol infusion,
      suggesting a propofol-induced defect of fatty acid oxidation
    explanation: >-
      The human biochemical observation behind the fatty-acid-oxidation arm, and
      its reversibility on withdrawal.
- name: Cellular Bioenergetic Failure
  biological_scale: CELLULAR
  description: >-
    With both oxidative routes impaired, cells with high and sustained energy
    demand, cardiac myocytes and skeletal muscle in particular, fail to meet
    their ATP requirement and shift to anaerobic metabolism.
  downstream:
  - target: Myocyte Injury and Necrosis
    causal_link_type: DIRECT
  - target: Cardiac Conduction Instability
    causal_link_type: DIRECT
  - target: Lactic acidosis
    causal_link_type: DIRECT
    description: Anaerobic metabolism raises lactate, producing the unexplained acidosis.
  - target: Metabolic acidosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17567345
    reference_title: Propofol infusion syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is proposed that the syndrome may be caused by either a direct
      mitochondrial respiratory chain inhibition or impaired mitochondrial fatty
      acid metabolism mediated by propofol.
    explanation: >-
      Both proposed mechanisms converge on failure of mitochondrial energy
      production, which is what this node represents.
- name: Myocyte Injury and Necrosis
  biological_scale: TISSUE
  description: >-
    Energy failure in striated muscle produces rhabdomyolysis with release of
    creatine kinase, myoglobin and intracellular potassium. In the reported
    series this feature accumulates with duration of exposure rather than with
    dose.
  downstream:
  - target: Rhabdomyolysis
    causal_link_type: DIRECT
  - target: Hyperkalemia
    causal_link_type: DIRECT
    description: Potassium released from necrotic myocytes raises serum potassium.
  - target: Acute kidney injury
    causal_link_type: DIRECT
    description: Myoglobin released by muscle necrosis injures the kidney.
  - target: Discolouration of urine
    causal_link_type: DIRECT
    description: >-
      Myoglobin in the urine discolours it, which is how the muscle injury
      presents at the bedside.
  evidence:
  - reference: PMID:36407194
    reference_title: "Propofol-Related Infusion Syndrome: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Also, the long-chain acyl-carnitine esters too require CPT-1 for transport
      and henceforth are unable to traverse into the muscular tissue cells, which
      leads to muscle necrosis and associated rhabdomyolysis of PRIS
    explanation: >-
      States the mechanistic step this node asserts: the fatty-acid-transport
      defect starves muscle and produces necrosis with rhabdomyolysis.
  - reference: PMID:36407194
    reference_title: "Propofol-Related Infusion Syndrome: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The cardiovascular system suffers from depleted ATP stores and high FFAs,
      which directly attack cardiomyocytic functions
    explanation: >-
      Extends the same energy-failure mechanism to cardiac myocytes, which is why
      this node feeds both the rhabdomyolysis and the cardiac branches.
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cardiac failure and metabolic acidosis occur early in a dose-dependent
      manner, while arrhythmia, other electrocardiographic changes and
      rhabdomyolysis appear more frequently after prolonged propofol infusions,
      irrespective of dose.
    explanation: >-
      Separates the dose-dependent from the duration-dependent features, and
      places rhabdomyolysis in the latter group.
- name: Cardiac Conduction Instability
  biological_scale: TISSUE
  description: >-
    Bioenergetic failure in the myocardium destabilises conduction. The earliest
    electrocardiographic sign reported is right bundle branch block with coved
    ST elevation in the right precordial leads, the pattern that makes the
    tracing indistinguishable from the Brugada type 1 pattern. Refractory
    bradycardia and progression toward asystole follow.
  downstream:
  - target: Coved ST-segment elevation in right precordial leads
    causal_link_type: DIRECT
  - target: Complete right bundle branch block
    causal_link_type: DIRECT
  - target: Arrhythmia
    causal_link_type: DIRECT
    description: >-
      Reported arrhythmias are not confined to bradycardia; the case literature
      counts arrhythmia in general as one of the commonest features.
  - target: Bradycardia
    causal_link_type: DIRECT
  - target: Hypotension
    causal_link_type: DIRECT
  - target: Cardiogenic shock
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17567345
    reference_title: Propofol infusion syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An early sign of cardiac instability associated with the syndrome is the
      development of right bundle branch block with convex-curved ('coved type')
      ST elevation in the right praecordial leads (V1 to V3) of the
      electrocardiogram.
    explanation: >-
      Names the electrocardiographic signature and its position as an early
      marker of cardiac instability.
phenotypes:
- name: Lactic acidosis
  category: Laboratory
  description: Unexplained lactic acidosis, one of the cardinal features of the syndrome.
  phenotype_term:
    preferred_term: Lactic acidosis
    term:
      id: HP:0003128
      label: Lactic acidosis
  evidence:
  - reference: PMID:20544610
    reference_title: Propofol infusion syndrome and Brugada syndrome electrocardiographic phenocopy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This anesthetic drug may cause a rare condition named propofol infusion
      syndrome, characterized by unexplained lactic acidosis, lipemia,
      rhabdomyolysis, cardiovascular collapse and Brugada-like
      electrocardiographic pattern or Brugada electrocardiographic phenocopy
      changes following high-dose propofol infusion over prolonged periods of
      time.
    explanation: >-
      The paper that introduced the phenocopy term, listing lactic acidosis
      first among the syndrome's features.
- name: Metabolic acidosis
  category: Laboratory
  description: >-
    Metabolic acidosis with a base deficit above 10 mmol/L is part of the
    classic case definition, and occurs early and in proportion to dose.
  frequency: 77% of reported cases
  phenotype_term:
    preferred_term: Metabolic acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
  evidence:
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Metabolic acidosis remained the most common symptom of PRIS with a constant
      incidence at around 77 % in reported cases.
    explanation: Source for the frequency, and for this being the commonest feature.
  - reference: PMID:17567345
    reference_title: Propofol infusion syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical features of propofol infusion syndrome (PRIS) are acute
      refractory bradycardia leading to asystole, in the presence of one or more
      of the following: metabolic acidosis (base deficit > 10 mmol.l(-1)),
      rhabdomyolysis, hyperlipidaemia, and enlarged or fatty liver.
    explanation: Places metabolic acidosis in the case definition with its threshold.
- name: Rhabdomyolysis
  category: Laboratory
  description: >-
    Skeletal muscle breakdown, more frequent in adults than children, appearing
    after prolonged infusion irrespective of dose.
  frequency: 56% of reported cases
  phenotype_term:
    preferred_term: Rhabdomyolysis
    term:
      id: HP:0003201
      label: Rhabdomyolysis
  evidence:
  - reference: PMID:30857601
    reference_title: "Propofol infusion syndrome: a structured literature review and analysis of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Lipidaemia, fever, and hepatomegaly occurred more frequently in children
      than in adults, whilst rhabdomyolysis and hyperkalaemia were more frequent
      in adults.
    explanation: >-
      Reports the age split in feature frequency, with rhabdomyolysis commoner
      in adults.
- name: Hyperkalemia
  category: Laboratory
  description: >-
    Raised serum potassium, in part from potassium released by necrotic
    myocytes, and independently associated with mortality in adults.
  frequency: 24% of reported cases
  phenotype_term:
    preferred_term: Hyperkalemia
    term:
      id: HP:0002153
      label: Hyperkalemia
  evidence:
  - reference: PMID:30857601
    reference_title: "Propofol infusion syndrome: a structured literature review and analysis of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mortality from propofol infusion syndrome is independently associated with
      fever and hepatomegaly in children, and electrocardiogram changes,
      hypotension, hyperkalaemia, traumatic brain injury, and a mean propofol
      infusion rate >5 mg kg-1 h-1 in adults.
    explanation: >-
      Identifies hyperkalemia among the features independently associated with
      death in adults.
- name: Hypertriglyceridemia
  category: Laboratory
  description: >-
    Hyperlipidemia, reported as lipaemia or raised plasma triglycerides, and
    more frequent in children than adults.
  frequency: 24% of reported cases, and absent in most
  phenotype_term:
    preferred_term: Hypertriglyceridemia
    term:
      id: HP:0002155
      label: Hypertriglyceridemia
  evidence:
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      CONCLUSION: PRIS can develop with propofol infusion <4 mg/kg per hour and
      its diagnosis may be challenging as some of its typical features
      (hypertriglyceridaemia, fever, hepatomegaly, heart failure) are often (>95
      %) missing and others (arrhythmia, electrocardiographic changes) occur
      late.
    explanation: >-
      Names hypertriglyceridaemia directly, matching the bound term, and records
      the review's own caution that this feature is usually absent, so it must
      not be treated as required for the diagnosis.
  - reference: PMID:30857601
    reference_title: "Propofol infusion syndrome: a structured literature review and analysis of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Lipidaemia, fever, and hepatomegaly occurred more frequently in children
      than in adults, whilst rhabdomyolysis and hyperkalaemia were more frequent
      in adults.
    explanation: Reports lipidaemia as commoner in children.
- name: Elevated hepatic transaminases
  category: Laboratory
  frequency: 13% of reported cases, tabulated as abnormal liver function test
  description: >-
    Abnormal liver function tests, reported in 13% of pooled cases. Bound to the
    transaminase term because that is the abnormality the clinical review names;
    the review that tabulates the frequency uses the broader phrase "abnormal
    liver function test", so the frequency is recorded with that wording.
  phenotype_term:
    preferred_term: Elevated liver enzymes
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "| Abnormal liver function test | 20 (13 %)"
    explanation: The tabulated frequency across 153 pooled cases.
  - reference: PMID:36407194
    reference_title: "Propofol-Related Infusion Syndrome: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The patient should be closely monitored for the development of signs and
      symptoms of PRIS which include metabolic acidosis with lactic acidosis,
      severe bradycardia, ventricular arrhythmia, asystole, cardiogenic shock,
      rhabdomyolysis, hepatomegaly, acute kidney injury, renal failure,
      hypertriglyceridemia, hyperkalaemia, hyperlipidaemia, elevated liver
      enzymes, increased serum creatinine kinase, serum lipase, amylase, lactate,
      myoglobinuria and Brugada-like ST elevation in ECG to name the important
      ones.
    explanation: >-
      Names elevated liver enzymes among the features to monitor for, which is
      the abnormality the bound term describes.
- name: Discolouration of urine
  category: Clinical
  frequency: 11% of reported cases
  description: >-
    Discoloured urine, reflecting myoglobin released by muscle necrosis. Bound to
    the urinary-colour term rather than to myoglobinuria, because the 11% figure
    counts the observed discolouration rather than a confirmed myoglobin
    measurement.
  phenotype_term:
    preferred_term: Discolouration of urine
    term:
      id: HP:0012086
      label: Abnormal urinary color
  evidence:
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "| Discolouration of urine | 16 (11 %)"
    explanation: The tabulated frequency across 153 pooled cases.
  - reference: PMID:36407194
    reference_title: "Propofol-Related Infusion Syndrome: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These are typical signs of rhabdomyolysis, leading to renal failure and
      myoglobinuria.
    explanation: >-
      Supports the mechanism behind the discolouration, myoglobin released by
      muscle breakdown, which is why this phenotype is wired from the myocyte
      necrosis node.
- name: Hepatomegaly
  category: Clinical
  description: >-
    Enlarged or fatty liver, part of the classic case definition, and in
    children independently associated with mortality.
  frequency: 11% of reported cases
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: PMID:30857601
    reference_title: "Propofol infusion syndrome: a structured literature review and analysis of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mortality from propofol infusion syndrome is independently associated with
      fever and hepatomegaly in children, and electrocardiogram changes,
      hypotension, hyperkalaemia, traumatic brain injury, and a mean propofol
      infusion rate >5 mg kg-1 h-1 in adults.
    explanation: >-
      Identifies hepatomegaly among the features independently associated with
      death in children.
- name: Fever
  category: Clinical
  description: >-
    Unexplained fever, more frequent in children, and independently associated
    with mortality both in children and in the earlier case series.
  frequency: 19% of reported cases
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:26558513
    reference_title: "Propofol infusion syndrome: a structured review of experimental studies and 153 published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We found that propofol infusion rate and duration, the presence of
      traumatic brain injury and fever are factors independently associated with
      mortality in reported cases of PRIS
    explanation: >-
      Places fever among the factors independently associated with death in the
      153-case series.
- name: Acute kidney injury

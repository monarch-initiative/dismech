differential_diagnoses:
- name: Brugada syndrome
  description: >-
    The electrocardiogram in propofol infusion syndrome can show coved ST
    elevation in the right precordial leads, which is the Brugada type 1
    pattern, so the tracing alone does not separate the two. What separates them
    is the clinical setting, the accompanying metabolic and muscle findings, and
    resolution once the infusion stops. Whether the pattern here should be
    called a Brugada phenocopy is contested, and the dispute matters because
    this syndrome is where the term was coined; see notes.
  phenotypes:
  - name: Coved type ST segment elevation
    phenotype_term:
      preferred_term: Coved type ST segment elevation
      term:
        id: HP:6000984
        label: Coved type ST segment elevation
  distinguishing_features:
  - A high-dose, prolonged propofol infusion is running when the pattern appears
  - Accompanying metabolic acidosis, rhabdomyolysis, hyperkalemia or hepatomegaly,
    which congenital Brugada syndrome does not produce
  - Resolution of the pattern after the infusion is stopped
  - Right bundle branch block accompanying the coved ST elevation as an early sign
  evidence:
  - reference: PMID:20544610
    reference_title: Propofol infusion syndrome and Brugada syndrome electrocardiographic phenocopy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This anesthetic drug may cause a rare condition named propofol infusion
      syndrome, characterized by unexplained lactic acidosis, lipemia,
      rhabdomyolysis, cardiovascular collapse and Brugada-like
      electrocardiographic pattern or Brugada electrocardiographic phenocopy
      changes following high-dose propofol infusion over prolonged periods of
      time.
    explanation: >-
      The paper that introduced the phenocopy term, describing the shared ECG
      appearance alongside the metabolic and muscle features that distinguish
      the syndrome.
  - reference: PMID:23094876
    reference_title: "Brugada phenocopy: new terminology and proposed classification."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      to describe an acquired Brugada-like ECG pattern in the setting of
      propofol infusion syndrome.
    explanation: >-
      Records that the phenocopy terminology was introduced for this syndrome
      specifically.
  - reference: PMID:23094876
    reference_title: "Brugada phenocopy: new terminology and proposed classification."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Consequently, the Group 1 drugs for the most part cannot be considered
      Brugada phenocopies.
    explanation: >-
      The same classification paper places propofol among its Group 1 agents,
      which it says act by sodium channel blockade and mostly cannot be
      considered phenocopies. So the paper that adopted the term for this
      syndrome also excludes its drug from the category.
  notes: >-
    Whether the electrocardiographic change in this syndrome is a Brugada
    phenocopy is unsettled, and the tension sits inside a single paper.
    PMID:23094876 credits Riera and colleagues with introducing the term for
    propofol infusion syndrome, and in the same text lists propofol among its
    Group 1 agents, states that nearly all of those act via sodium channel
    blockade, and concludes that Group 1 drugs for the most part cannot be
    considered Brugada phenocopies. The entry records both statements rather
    than choosing between them. Brugada_Syndrome carries the reciprocal
    differential. No sodium-channel mechanism is asserted for propofol in this
    entry's pathophysiology, because the reviews cited here attribute the
    syndrome to mitochondrial impairment and do not establish a channel-blocking
    mechanism for the ECG change.
discussions:
- discussion_id: q_pris_genetic_susceptibility
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does an inherited susceptibility determine which patients receiving
    high-dose prolonged propofol develop propofol infusion syndrome?
  rationale: >-
    The syndrome is rare relative to how widely propofol is used for
    intensive-care sedation, which implies host susceptibility rather than dose
    alone. Subclinical mitochondrial disease is listed among the predisposing
    factors, and a fatty-acid-oxidation defect is one of the two proposed
    mechanisms, so an inherited partial defect in either pathway is a plausible
    determinant. The question has been open since the syndrome was named and no
    cited source here resolves it.
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Fatty Acid Oxidation
  - pathophysiology#Mitochondrial Respiratory Chain Inhibition by Propofol
  evidence:
  - reference: PMID:20544610
    reference_title: Propofol infusion syndrome and Brugada syndrome electrocardiographic phenocopy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Uncertainty remains as to whether a genetic susceptibility exists.
    explanation: States the open question directly.
  - reference: PMID:17567345
    reference_title: Propofol infusion syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Predisposing factors include young age, severe critical illness of central
      nervous system or respiratory origin, exogenous catecholamine or
      glucocorticoid administration, inadequate carbohydrate intake and
      subclinical mitochondrial disease.
    explanation: >-
      Names subclinical mitochondrial disease among the predisposing factors,
      which is the specific form an inherited susceptibility would most likely
      take.

pathophysiology:
- name: DSP Biallelic Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade"
  description: >-
    Biallelic pathogenic variants in DSP impair desmoplakin's structural
    plaque-linker activity. Documented causal genotypes include compound
    heterozygosity pairing a nonsense premature-termination allele with a
    missense substitution (p.Cys809Ter/p.Asn287Lys and p.Gln664Ter/p.Arg2366Cys),
    compound heterozygosity for exon 24 nonsense and frameshift truncations
    (p.Arg2548Ter/p.Arg2151GlyfsTer3), and homozygosity for C-terminal
    plakin-repeat missense substitutions at codon Arg2366 (p.Arg2366His,
    p.Arg2366Cys). Whereas monoallelic carrier status for these alleles is
    clinically silent in parents, biallelic reduction and C-terminal/N-terminal
    domain perturbation compromise desmoplakin's capacity to bridge desmosomal
    plaque proteins to keratin intermediate filaments.
  genes:
  - preferred_term: DSP
    term:
      id: hgnc:3052
      label: DSP
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Reported genotypes combine truncating and missense alleles, biallelic
      C-terminal exon 24 truncations, or homozygous Arg2366 missense
      substitutions; because the functional class of homozygous p.Arg2366His has
      not been experimentally established as a complete null, overall impact is
      recorded conservatively as partial loss of function.

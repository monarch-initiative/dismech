inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All genetically confirmed families with skin fragility-woolly hair syndrome
    exhibit autosomal recessive inheritance — either compound heterozygous
    nonsense/missense DSP variants or homozygous C-terminal missense DSP
    variants — with heterozygous carrier parents showing no cutaneous, hair, or
    cardiac abnormalities. (Orphanet ORPHA:293165 additionally lists autosomal
    dominant inheritance across broader DSP keratoderma entries, whereas
    dominant DSP haploinsufficiency causes isolated striate palmoplantar
    keratoderma type 2 rather than SFWHS.)
  evidence:
  - reference: PMID:11841538
    reference_title: "Compound heterozygosity for non-sense and mis-sense mutations in desmoplakin underlies skin fragility/woolly hair syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe two unrelated individuals with a new autosomal
      recessive genodermatosis characterized by focal and diffuse palmoplantar
      keratoderma, hyperkeratotic plaques on the trunk and limbs, varying
      degrees of alopecia, but no apparent cardiac anomalies.
    explanation: >-
      Establishes autosomal recessive inheritance in the founding two unrelated
      probands.
  - reference: PMID:20738328
    reference_title: "Novel homozygous mutation in DSP causing skin fragility-woolly hair syndrome: report of a large family and review of the desmoplakin-related phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full sequencing of the DSP showed a novel homozygous c.7097 G>A (p.R2366H)

description: >-
  Skin fragility-woolly hair syndrome (skin fragility-woolly hair-palmoplantar
  keratoderma syndrome) is an ultra-rare autosomal recessive desmosomal
  genodermatosis caused by biallelic pathogenic variants in DSP, encoding the
  constitutive desmosomal plaque linker desmoplakin. Reported molecular
  genotypes include compound heterozygosity for nonsense, frameshift, or
  missense variants (such as p.Cys809Ter/p.Asn287Lys,
  p.Gln664Ter/p.Arg2366Cys, and p.Arg2548Ter/p.Arg2151GlyfsTer3) as well as
  homozygosity for C-terminal plakin-repeat domain missense substitutions at
  codon Arg2366 (p.Arg2366His, p.Arg2366Cys). Clinically, affected individuals
  present from birth, infancy, or childhood with persistent skin fragility and
  non-scarring blistering/erosions after minimal mechanical trauma, focal,
  striate, or diffuse palmoplantar keratoderma with painful fissuring,
  hyperkeratotic plaques on the trunk and extremities, woolly hair with
  variable alopecia, and nail dystrophy. Unlike allelic Carvajal syndrome,
  cardiac abnormalities have not been reported in published skin
  fragility-woolly hair syndrome cases, although precautionary cardiac
  evaluation and regular monitoring are recommended because DSP is expressed in
  myocardium and DSP pathology is associated with cardiac disease.

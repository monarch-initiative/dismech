genetic:
- name: DSP
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  gene_term:
    preferred_term: DSP
    term:
      id: hgnc:3052
      label: DSP
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:11841538
      reference_title: "Compound heterozygosity for non-sense and mis-sense mutations in desmoplakin underlies skin fragility/woolly hair syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Heterozygous carriers of any of these mutations displayed no phenotypic
        abnormalities.
      explanation: >-
        Confirms autosomal recessive inheritance through absence of disease in
        monoallelic carriers.
  features: >-
    Autosomal recessive compound heterozygous or homozygous DSP variants,
    frequently involving exon 24 encoding the C-terminal plakin-repeat/tail
    region: reported genotypes include compound heterozygous nonsense/missense
    combinations (p.Cys809Ter/p.Asn287Lys and p.Gln664Ter/p.Arg2366Cys),
    homozygous missense substitutions at codon Arg2366 (c.7097G>A p.Arg2366His;
    p.Arg2366Cys), and compound heterozygous exon 24 nonsense/frameshift
    truncations (c.7642C>T p.Arg2548Ter and c.6449delC p.Arg2151GlyfsTer3). No
    cardiac abnormality was reported across these published families, with
    formal cardiac examination noted as not feasible in the index patient of the
    p.Arg2366His family (PMID:20738328) although echocardiography in two
    affected younger siblings was normal, and normal electrocardiogram and
    echocardiogram findings reported in the 2025 compound heterozygous proband
    (PMID:41064314).
  evidence:
  - reference: PMID:11841538
    reference_title: "Compound heterozygosity for non-sense and mis-sense mutations in desmoplakin underlies skin fragility/woolly hair syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicopathologic and mutational analyses therefore demonstrate that
      desmoplakin haploinsufficiency can be tolerated in some cases, but that in
      combination with a mis-sense mutation on the other allele, the
      consequences are a severe genodermatosis with specific clinical
      manifestations.
    explanation: >-
      Establishes the recessive dosage/functional threshold for compound
      heterozygous DSP alleles.
  - reference: PMID:20738328
    reference_title: "Novel homozygous mutation in DSP causing skin fragility-woolly hair syndrome: report of a large family and review of the desmoplakin-related phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full sequencing of the DSP showed a novel homozygous c.7097 G>A (p.R2366H)
      mutation in all affected members, and the parents were heterozygous.
    explanation: >-
      Demonstrates homozygous missense mutation at DSP codon Arg2366 causing
      skin fragility-woolly hair syndrome.
  - reference: PMID:41064314
    reference_title: "Novel Compound Heterozygous Variants of DSP Causing Skin Fragility-Woolly Hair Syndrome: A Rare Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two heterozygous variants in exon 24 of DSP, c.7642C>T (p.R2548X) and
      c.6449delC (p.R2151Gfs*3), were identified by whole-exome sequencing and
      further proven to be a novel compound heterozygous variant by Sanger
      sequencing.
    explanation: >-
      Documents compound heterozygous exon 24 nonsense and frameshift DSP
      variants in skin fragility-woolly hair syndrome.
diagnosis:
- name: Skin Biopsy with Immunohistochemistry and Transmission Electron Microscopy
  diagnosis_term:
    preferred_term: skin biopsy with immunohistochemistry and electron microscopy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    Skin biopsy evaluated by desmoplakin immunohistochemistry demonstrates
    abnormal cytoplasmic redistribution alongside reduced cortical plaque
    staining, while transmission electron microscopy reveals pan-epidermal
    acantholysis, focal detachment of desmosomes into intercellular spaces, and
    perinuclear condensation of the suprabasal keratin intermediate filament
    network.
  evidence:
  - reference: PMID:11841538
    reference_title: "Compound heterozygosity for non-sense and mis-sense mutations in desmoplakin underlies skin fragility/woolly hair syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry of skin biopsies from both affected individuals
      revealed that desmoplakin was not just located at the cell periphery but
      there was also cytoplasmic staining. In addition, electron microscopy
      demonstrated acantholysis throughout all layers of the skin, focal
      detachment of desmosomes into the intercellular spaces, and perinuclear
      condensation of the suprabasal keratin intermediate filament network.
    explanation: >-
      Establishes the diagnostic immunohistochemical and ultrastructural skin
      biopsy findings.
- name: DSP Molecular Genetic Testing
  diagnosis_term:
    preferred_term: DSP molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequence analysis of DSP confirms biallelic pathogenic variants (compound
    heterozygous nonsense/missense or homozygous missense variants) and
    separates DSP-related skin fragility-woolly hair syndrome from PKP1-related
    ectodermal dysplasia-skin fragility syndrome, which shares an overlapping
    mucocutaneous phenotype without cardiac risk.
  evidence:
  - reference: PMID:11841538
    reference_title: "Compound heterozygosity for non-sense and mis-sense mutations in desmoplakin underlies skin fragility/woolly hair syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation screening of desmoplakin demonstrated compound heterozygosity for
      a non-sense/mis-sense combination of mutations in both cases, C809X/N287K
      and Q664X/R2366C, respectively.
    explanation: >-
      Confirms DSP mutation screening as the definitive molecular diagnostic
      test.
- name: Precautionary Echocardiographic Cardiac Evaluation
  diagnosis_term:
    preferred_term: echocardiographic cardiac evaluation
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    No cardiac abnormalities have been reported in published skin
    fragility-woolly hair syndrome cases; however, unlike PKP1 (which is not
    expressed in the heart), DSP is expressed in cardiac muscle and DSP
    pathology is associated with cardiac disease, making echocardiographic
    evaluation and periodic monitoring reasonable as precautionary surveillance.
  evidence:
  - reference: PMID:20738328
    reference_title: "Novel homozygous mutation in DSP causing skin fragility-woolly hair syndrome: report of a large family and review of the desmoplakin-related phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No cardiac symptoms were reported. Although formal cardiac examination was
      not feasible, the echocardiographic evaluation of the other two affected
      younger siblings was normal.
    explanation: >-
      Documents normal echocardiographic evaluation in two affected siblings
      while noting that formal cardiac examination was not feasible in the index
      patient.
  - reference: PMID:19016709
    reference_title: "Novel truncating mutations in PKP1 and DSP cause similar skin phenotypes in two Brazilian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss-of-function mutations in the DSP gene can result in a phenotype
      similar to ectodermal dysplasia-skin fragility syndrome resulting from
      PKP1 mutations but only DSP pathology is associated with cardiac disease.
    explanation: >-
      Explains why DSP-related skin fragility warrants precautionary cardiac
      evaluation whereas PKP1-related skin fragility does not.
  - reference: PMID:41064314
    reference_title: "Novel Compound Heterozygous Variants of DSP Causing Skin Fragility-Woolly Hair Syndrome: A Rare Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrocardiogram and echocardiogram findings in all family members were
      within normal limits.
    explanation: >-
      Documents normal baseline cardiac screening in a 2-year-old SFWHS proband
      alongside planned ongoing cardiac monitoring.
differential_diagnoses:
- name: Ectodermal Dysplasia-Skin Fragility Syndrome (PKP1 Deficiency)
  description: >-
    Autosomal recessive plakophilin-1 (PKP1) deficiency produces nearly
    identical skin fragility with blisters and erosions, palmoplantar
    hyperkeratosis, hypotrichosis/woolly hair, and nail dystrophy, but PKP1 is
    not expressed in myocardium so affected patients do not develop
    cardiomyopathy.
  evidence:
  - reference: PMID:19016709
    reference_title: "Novel truncating mutations in PKP1 and DSP cause similar skin phenotypes in two Brazilian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, PKP1 is not expressed in the heart, which accounts for the
      lack of cardiomyopathy in patient 1.
    explanation: >-
      Establishes the cardiac-expression discriminator separating PKP1-related
      ectodermal dysplasia-skin fragility syndrome from DSP-related disease.
- name: Carvajal Syndrome and Cardiocutaneous Desmoplakinopathy
  description: >-
    Allelic autosomal recessive desmoplakinopathy (often caused by truncating
    variants affecting the cardiac-predominant DSP-I isoform, such as
    c.2516del4/c.3971del4 or C-terminal truncations) that combines woolly hair
    and palmoplantar keratoderma with early-onset dilated or arrhythmogenic
    cardiomyopathy.
  evidence:
  - reference: PMID:19016709
    reference_title: "Novel truncating mutations in PKP1 and DSP cause similar skin phenotypes in two Brazilian families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although there was considerable clinical overlap in the skin and hair
      abnormalities in these two cases, patient 2 also had early-onset
      cardiomyopathy. The mutation c.3971del4 occurs in the longer desmoplakin-I
      isoform (which is the major cardiac transcript) but not in the more
      ubiquitous desmoplakin-II.
    explanation: >-
      Demonstrates how truncating mutations hitting the cardiac DSP-I isoform
      yield early-onset cardiocutaneous disease rather than isolated cutaneous
      SFWHS.
- name: Striate Palmoplantar Keratoderma Type 2
  description: >-
    Autosomal dominant DSP haploinsufficiency disorder presenting with linear/
    striate palmoplantar keratoderma without generalized pan-epidermal
    acantholytic blistering, woolly hair, or alopecia.
  evidence:
  - reference: PMID:11841538
    reference_title: "Compound heterozygosity for non-sense and mis-sense mutations in desmoplakin underlies skin fragility/woolly hair syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Recently, mutations in desmoplakin have been shown to underlie some cases
      of the autosomal dominant disorder, striate palmoplantar keratoderma, as
      well as an autosomal recessive condition characterized by dilated
      cardiomyopathy, woolly hair, and keratoderma.
    explanation: >-
      Contrasts autosomal dominant striate palmoplantar keratoderma and
      recessive cardiocutaneous Carvajal syndrome against skin fragility-woolly
      hair syndrome.
notes: >-
  Grouping and module conformance: this entry is a member of
  `Hereditary_Desmosomopathies` and conforms to `desmosomal_adhesion_failure`
  across the trigger (`#Desmosomal Component Loss or Blockade`), cellular
  filament-uncoupling (`#Failure of Desmosome Assembly and Intermediate Filament
  Anchorage`), and tissue acantholysis (`#Acantholysis and Mechanical Failure of
  Desmosome-Dependent Tissues`) nodes. Ectodermal appendage (hair follicle and
  nail) failure is separated into its own PROVISIONAL tissue node because
  published transmission electron microscopy in SFWHS examined interfollicular
  skin rather than follicular or nail-bed biopsies.

  Clinical cardiac observations and post-2011 literature scope: across the two
  founding compound heterozygous probands (PMID:11841538), the five-member
  homozygous p.Arg2366His family (PMID:20738328, where formal cardiac
  examination was not feasible in the index patient though echocardiography in
  two affected younger siblings was normal), and subsequent post-2011 reports
  reviewed through 2025 (seven index cases/families in total in Table 1 of
  PMID:41064314, with normal electrocardiogram and echocardiogram findings in
  their p.Arg2548Ter/p.Arg2151GlyfsTer3 proband; note that the 2018 case report
  PMID:30133754 has no abstract or full text retrievable from PubMed/PMC and is
  summarized only via Table 1 of PMID:41064314), no cardiomyopathy or other
  cardiac abnormality has been reported in skin fragility-woolly hair syndrome.
  Because DSP is expressed in cardiac muscle and DSP pathology is associated
  with cardiac disease (PMID:19016709, PMID:41064314), echocardiographic
  evaluation is curated under `diagnosis:` as precautionary surveillance rather
  than as a clinical feature of SFWHS.

  Treatments: reported management is supportive (emollients, keratolytics, and
  trauma avoidance; PMID:41064314), and no interventional trials or
  disorder-specific treatment outcome series have been published, so no
  `treatments:` block is curated.

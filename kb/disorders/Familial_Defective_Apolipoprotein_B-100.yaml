    snippet: "This amino acid substitution diminishes the binding capacity of the low-density lipoprotein particle for the low-density lipoprotein receptor, which in turn leads to an increase in levels of plasma total and low-density lipoprotein cholesterol."
    explanation: States that the FDB substitution raises plasma LDL cholesterol.
- category: Biochemical

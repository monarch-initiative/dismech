- name: Elevated Plasma LDL Cholesterol
  description: >
    The clinically measured consequence: lifelong elevation of plasma total and
    LDL cholesterol. In Danish general-population carriers of Arg3500Gln, total
    cholesterol was about 100 mg/dL higher than in noncarriers. Levels tend to
    fluctuate more within individuals than in LDLR-mediated FH and may not be
    clearly elevated in young carriers, which contributes to underdiagnosis.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED

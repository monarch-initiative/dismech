- name: Reduced Receptor-Mediated Hepatic LDL Clearance
  description: >
    Because the mutant LDL cannot engage the hepatic LDL receptor, it is not
    internalized or delivered to the lysosome, and its fractional catabolic rate
    falls. Uptake of the wild-type LDL pool and of apoE-containing precursors is
    unaffected, which is why hepatic receptor abundance remains a therapeutic
    lever. Downstream sterol sensing in the hepatocyte is also blunted, since
    mutant LDL is less effective at stimulating intracellular cholesteryl ester
    synthesis.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:

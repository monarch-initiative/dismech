genetic:
- name: APOB
  gene_term:
    preferred_term: APOB
    term:
      id: hgnc:603
      label: APOB
  association: Causal
  presence: Positive
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  variant_origin: GERMLINE
  notes: >
    APOB encodes apolipoprotein B-100, the single structural protein of the LDL
    particle and the ligand for the LDL receptor. The FDB allelic series is
    confined to missense substitutions in or affecting the receptor-binding
    region; it is mechanistically distinct from the truncating APOB alleles that
    cause familial hypobetalipoproteinemia, which lower LDL cholesterol.
  case_fractions:
  - population: Familial hypercholesterolemia cases (APOB p.Arg3527Gln and p.Arg3527Trp combined)
    case_fraction_percent: 12.0
    notes: >
      Upper end of the reported range for the APOB share of familial
      hypercholesterolemia, counting both recurrent codon-3527 alleles. This is
      the share of FH cases explained by APOB, not a population prevalence of
      FDB - the two are recorded separately and must not be conflated.
    evidence:
    - reference: PMID:38393015
      reference_title: "ApoB100 and Atherosclerosis: What's New in the 21st Century?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both APOB R3500Q and R3500W variants are also implicated in familial hypercholesterolemia (FH), accounting for 12% of FH cases."
      explanation: Review-level estimate of the combined APOB share of FH cases.
  - population: European familial hypercholesterolemia phenotypes (p.Arg3527Gln allele only)
    case_fraction_percent: 3.5
    case_fraction_low: 2.0
    case_fraction_high: 5.0
    notes: >
      Lower end of the range, for the classic R3500Q allele alone in Europe.
      case_fraction_percent records the midpoint of the quoted 2-5% interval;
      the bounds carry the interval itself. The spread against the 12% figure
      above is genuine and is driven by which alleles are counted, by
      population, and by how the FH denominator was ascertained - it is
      recorded as two cohort-specific records rather than averaged into one.
    evidence:
    - reference: PMID:33519890
      reference_title: "The Digenic Causality in Familial Hypercholesterolemia: Revising the Genotype-Phenotype Correlations of the Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "(R3500Q) is common in Europe and accounts for 2–5% of FH phenotypes"
      explanation: European estimate of the R3500Q share of FH phenotypes.
  variants:
  - name: p.Arg3527Gln (R3500Q; c.10580G>A)
    description: >
      The classic and by far the most common FDB allele. Numbering differs by
      convention: 3500 counts from the mature protein, 3527 includes the signal
      peptide and is the current HGVS form. Arises at a CpG mutational hot spot.
      Carriers of Western European descent share a common haplotype, consistent
      with a founder allele.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:8215738
      reference_title: "Familial defective apolipoprotein B-100 is clinically indistinguishable from familial hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation was associated with a similar haplotype, which was also reported in other patients of Western European descent with familial defective apolipoprotein B100. This strongly suggests that the mutation has a common chromosomal background that originated in Western Europe."
      explanation: Establishes the shared founder haplotype of the p.Arg3527Gln allele in Western Europe.
    - reference: PMID:32591292
      reference_title: "The first Japanese cases of familial hypercholesterolemia due to a known pathogenic APOB gene variant, c.10580 G>A: p.(Arg3527Gln)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The known p.(Arg3527Gln) variant in the APOB gene was identified in one Japanese family."
      explanation: Confirms the c.10580G>A / p.(Arg3527Gln) designation and documents its rarity outside European-descent populations.
  - name: p.Arg3527Trp (R3500W)
    description: >
      A distinct substitution at the same codon, reported in hyperlipidemic
      East Asian populations on its own founder haplotype. It is the APOB allele
      of note for FDB outside European-descent populations.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:9702952
      reference_title: "Identification and haplotype analysis of apolipoprotein B-100 Arg3500-->Trp mutation in hyperlipidemic Chinese."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A total of 373 hyperlipidemic patients and 309 controls were screened for R3500W. Nine unrelated subjects were shown to be heterozygous for the mutation, and no R3500W carriers were found in the control group (P = 0.004)."
      explanation: Demonstrates enrichment of R3500W in hyperlipidemic Chinese subjects versus controls.
    - reference: PMID:9702952
      reference_title: "Identification and haplotype analysis of apolipoprotein B-100 Arg3500-->Trp mutation in hyperlipidemic Chinese."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The fact that the same mutant allele was identified in other Asians with FDB indicates a common Asian origin for the R3500W mutations."
      explanation: Establishes a separate Asian founder origin for this allele.
    - reference: PMID:27919345
      reference_title: "Familial defective apolipoprotein B-100: A review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the APOB R3500 W variant is known to make a significant contribution to familial hypercholesterolemia (FH) among East Asians"
      explanation: Review confirms the population-specific contribution of R3500W.
  - name: p.Arg3558Cys (R3531C)
    description: >
      A neighbouring APOB substitution that was screened alongside the FDB
      alleles but did not raise cholesterol or ischemic heart disease risk in the
      general population. Recorded here as an explicit negative, since it
      delimits which APOB substitutions produce the FDB phenotype.
    type: missense
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:9603795
      reference_title: "Association of mutations in the apolipoprotein B gene with hypercholesterolemia and the risk of ischemic heart disease."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Heterzygous carriers of the Arg3531Cys mutation in the general population did not have higher-than-normal plasma cholesterol levels or an increased risk of ischemic heart disease"
      explanation: Refutes a causal FDB role for this substitution in an unselected population.
  evidence:
  - reference: PMID:27919345
    reference_title: "Familial defective apolipoprotein B-100: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FDB is caused by mutations in APOB reducing the binding affinity between apolipoprotein B-100 and the low-density lipoprotein receptor."
    explanation: Establishes APOB as the causal gene and the binding-affinity mechanism.
  - reference: PMID:2563166
    reference_title: "Association between a specific apolipoprotein B mutation and familial defective apolipoprotein B-100."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This same mutant allele occurs in six other, unrelated subjects and in eight affected relatives in two of these families."
    explanation: Original demonstration of segregation of the APOB allele with the FDB phenotype.
- name: LDLR
  gene_term:
    preferred_term: LDLR
    term:
      id: hgnc:6547
      label: LDLR
  association: Modifier (digenic second locus)
  presence: Positive
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >
    LDLR is not a cause of FDB - by definition the receptor is normal in this
    disorder, which is the whole point of the entity. It is recorded here as a
    modifier because a pathogenic LDLR allele carried in trans with APOB
    p.Arg3527Gln produces a double-heterozygous state more severe than either
    single heterozygote. That is a dosage effect on the same clearance step:
    the ligand defect and the receptor defect subtract from the same LDL
    removal capacity. Curated as MODIFIER rather than CAUSATIVE deliberately,
    since an LDLR lesion on its own gives LDLR-mediated FH, a different entry.
  evidence:
  - reference: PMID:33519890
    reference_title: "The Digenic Causality in Familial Hypercholesterolemia: Revising the Genotype-Phenotype Correlations of the Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "double-heterozygotes carrying LDLR and p.(R3500Q) APOB mutations have more severe phenotypes when compared to the heterozygote FH cases carrying only one mutation in any of the mentioned genes"
    explanation: >-
      Names the APOB p.Arg3527Gln plus LDLR double-heterozygous state as more
      severe than either single heterozygote, the basis for the MODIFIER call.
- name: PCSK9
  gene_term:
    preferred_term: PCSK9
    term:
      id: hgnc:20001
      label: PCSK9
  association: Modifier (LDL receptor abundance)
  presence: Positive
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >
    PCSK9 sets hepatic LDL receptor abundance by targeting the receptor for
    degradation, so PCSK9 genotype changes how much functional receptor is
    available to clear the receptor-competent share of the LDL pool. It is an
    established modifier of FH phenotype severity in carriers of an identical
    primary lesion. The same axis is why anti-PCSK9 antibodies work in FDB -
    see the PCSK9 monoclonal antibody treatment, whose rationale is receptor
    abundance rather than any effect on the defective ligand.
  evidence:
  - reference: PMID:33519890
    reference_title: "The Digenic Causality in Familial Hypercholesterolemia: Revising the Genotype-Phenotype Correlations of the Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCSK9 has been identified as an FH modifier gene as it generates significant variable phenotypes even in patients having the same mutation in LDLR"
    explanation: >-
      Identifies PCSK9 as a modifier gene producing variable phenotypes at a
      fixed primary lesion.
  - reference: PMID:33519890
    reference_title: "The Digenic Causality in Familial Hypercholesterolemia: Revising the Genotype-Phenotype Correlations of the Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "recently several reports have identified digenic mutations in familial cases that do not necessarily reflect a much severe phenotype"
    explanation: >-
      Retained as the counterweight: digenic second hits do not uniformly
      worsen the phenotype, so modifier status is recorded without a claimed
      effect size. PARTIAL because it qualifies rather than supports the
      severity direction.
prevalence:
- population: Denmark (general population)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 100.0
  notes: >
    Genotyped in 9255 unselected Danish women and men. The measured heterozygote
    prevalence was 0.08% (95% CI 0.03-0.16%), which the authors round to
    approximately 1 in 1000; rate_per_100000 records that stated figure. This is
    the best unselected-population estimate available, since clinic-based series
    are ascertained on hypercholesterolemia.
  evidence:
  - reference: PMID:9603795
    reference_title: "Association of mutations in the apolipoprotein B gene with hypercholesterolemia and the risk of ischemic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of heterozygotes in the general population was 0.08 percent (95 percent confidence interval, 0.03 to 0.16 percent) for both the Arg3500Gln and the Arg3531Cys mutations"
    explanation: Direct measurement of FDB heterozygote prevalence in an unselected general population.
- population: Northern Europeans and US Caucasians
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 100.0
  notes: Approximately 0.1% carry the R3500Q variant per the 2016 review.
  evidence:
  - reference: PMID:27919345
    reference_title: "Familial defective apolipoprotein B-100: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Population studies suggest that approximately 0.1% of Northern Europeans and US Caucasians carries the R3500Q variant in APOB most commonly associated with FDB"
    explanation: Review-level population estimate for European-descent populations.
- population: Switzerland (German, French, and Romansh speaking regions)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 478.0
  notes: >
    A striking founder-effect outlier: combined estimate 1 in 209 (rate_per_100000
    computed as 100000/209 = 478). Derived by combining 728 healthy volunteers
    (3 carriers, ~1/240) with 142 hypercholesterolemic families extrapolated to
    the general population (~1/190). The extrapolated arm is ascertainment-prone,
    so treat this as an upper bound rather than a directly measured prevalence;
    the volunteer arm alone (1/240, ~417 per 100000) is the cleaner figure.
  evidence:
  - reference: PMID:8006512
    reference_title: "High prevalence of familial defective apolipoprotein B-100 in Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combined prevalence based on both samples was 1/209. Thus, the investigated point mutation was highly prevalent in Switzerland and appeared to be more frequent than in other populations studied hitherto."
    explanation: Reports the Swiss combined prevalence estimate and its status as an international outlier.
- population: United States, Canada, and Europe
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 200.0
  notes: >
    Early aggregate estimate of approximately 1 in 500 across Western
    populations, predating the large unselected Danish genotyping study; retained
    for historical range but the Danish figure is the more reliable one.
  evidence:
  - reference: PMID:2280177
    reference_title: "Familial defective apolipoprotein B-100: a mutation of apolipoprotein B that causes hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation has been identified in the United States, Canada, and Europe and is estimated to occur at a frequency of approximately 1/500 in these populations."
    explanation: Historical Western-population frequency estimate.
progression:
- phase: Childhood and adolescence
  notes: >
    Carriers may be normocholesterolemic or only mildly hypercholesterolemic at
    this stage, which is a diagnostic trap in cascade screening of families.
    This is also the stage at which lipid surveillance begins and at which
    statin therapy first becomes available, so the diagnostic trap has direct
    management consequences.
  evidence:
  - reference: PMID:8006512
    reference_title: "High prevalence of familial defective apolipoprotein B-100 in Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of the mutation was not necessarily associated with an elevation of serum cholesterol levels, particularly in young individuals"
    explanation: >-
      Documents unselected young carriers who were not hypercholesterolemic,
      the basis for treating this phase as biochemically silent or mild.
- phase: Early adulthood
  notes: >
    Total cholesterol rises sharply into the elevated range in the early
    twenties in unselected carriers.
  evidence:
  - reference: PMID:8006512
    reference_title: "High prevalence of familial defective apolipoprotein B-100 in Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three volunteers with the point mutation demonstrated an increase in total cholesterol concentrations by 1.30 mmol/l or by 25% within 2 years, suggesting that, in the early twenties, cholesterol concentrations increase markedly from normal to elevated levels."
    explanation: Dates the sharp rise in total cholesterol to the early twenties in unselected carriers.
- phase: Mid to late adulthood
  notes: >
    Cumulative LDL exposure produces coronary atherosclerosis and symptomatic
    ischemic heart disease. Median age at recorded coronary heart disease in
    FDB was 52 years, later than the mean of 41 years in directly compared
    LDLR-mediated FH.
  evidence:
  - reference: PMID:38393015
    reference_title: "ApoB100 and Atherosclerosis: What's New in the 21st Century?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost 40% of FH patients had coronary heart disease (CHD) at a mean age of 41 years, while CHD was present in 5.6% of FDB subjects with a median age of 52 years."
    explanation: Places FDB coronary events in mid-to-late adulthood, later than in LDLR-mediated FH.
  - reference: PMID:8215738
    reference_title: "Familial defective apolipoprotein B-100 is clinically indistinguishable from familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eight of 18 patients had angina or other evidence of coronary artery disease"
    explanation: Documents symptomatic coronary disease as the clinical burden of this phase.
diagnosis:
- name: Molecular Genetic Testing of APOB
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >
    Targeted APOB genotyping resolves FDB from LDLR-mediated FH in patients
    meeting clinical FH criteria. This matters because a substantial minority of
    clinically diagnosed FH is genetically FDB, and because carriers with milder
    lipid values are missed by criteria calibrated on LDLR-mediated FH. The
    variant is a single-nucleotide substitution amenable to simple PCR-based
    assays.
  results: >
    Identification of a heterozygous pathogenic APOB missense variant in the
    LDL-receptor-binding region - p.Arg3527Gln (c.10580G>A) in European-descent
    populations, p.Arg3527Trp in East Asian populations - establishes the
    molecular diagnosis of FDB in a proband with hypercholesterolemia.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews establishes molecular testing as diagnostic and defines the
      APOB route in exactly the ligand-binding terms this entry models.
  - reference: PMID:8141833
    reference_title: "Familial defective apolipoprotein B-100: a review, including some comparisons with familial hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most lipid clinics, 2-5% of patients given a clinical diagnosis of FH have FDB, not FH."
    explanation: Quantifies the diagnostic yield that motivates APOB genotyping in clinically diagnosed FH.
  - reference: PMID:8006512
    reference_title: "High prevalence of familial defective apolipoprotein B-100 in Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the estimated high prevalence and the relative ease of PCR-based tests, screening for FDB may become a standard procedure in patients with suggested familial forms of hypercholesterolemia."
    explanation: Supports molecular screening for FDB among suspected familial hypercholesterolemia.
- name: Familial Hypercholesterolemia Multigene Panel
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >
    In practice FDB is usually reached through an FH multigene panel rather than
    a single-gene APOB assay, because the clinical presentation does not
    discriminate the genes. The panel covers LDLR, APOB, PCSK9 and LDLRAP1; a
    positive APOB result in the receptor-binding region is what assigns the
    patient to this entry rather than to LDLR- or PCSK9-mediated FH.
  results: >
    An APOB receptor-binding-region variant assigns FDB; an LDLR or PCSK9
    variant assigns a different monogenic FH; a negative panel in a patient
    with a clinical FH phenotype favours polygenic hypercholesterolemia or a
    secondary cause.
  notes: >
    The gene assignment is not merely a label. Because the receptor is intact in
    FDB, receptor-directed therapy retains its target, which is the practical
    consequence the source draws from distinguishing the two disorders.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: Names the four genes that constitute the FH panel and their distinct molecular mechanisms.
  - reference: PMID:38393015
    reference_title: "ApoB100 and Atherosclerosis: What's New in the 21st Century?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "certain lipid-modifying agents may act via the LDL-R, which is typically normal in subjects with FDB"
    explanation: >-
      States the therapeutic consequence of resolving FDB from LDLR-mediated
      FH, and restates the receptor-normal premise of this entry.
- name: Clinical Lipid-Based Diagnosis and LDL-C Thresholds
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >
    A clinical FH diagnosis rests on characteristic features plus untreated
    LDL-C above threshold. These thresholds are calibrated on the FH population
    as a whole, which is dominated by LDLR-mediated disease.
  results: >
    Untreated LDL-C typically above 190 mg/dL in adults and above 160 mg/dL in
    children supports a clinical diagnosis of familial hypercholesterolemia.
  notes: >
    Recorded with an explicit caveat rather than as a clean diagnostic rule for
    FDB. Because LDL-C elevation in FDB is on average milder than in
    LDLR-mediated FH, thresholds calibrated on FH cohorts systematically miss
    part of the FDB carrier distribution - the same ascertainment problem
    curated as an open controversy in this entry. A normal or borderline LDL-C
    in a young carrier is likewise uninformative, since the biochemical
    phenotype is age-dependent.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A clinical diagnosis of FH can be established in a proband with characteristic clinical features and significantly elevated LDL-C levels (typically >190 mg/dL in adults and >160 mg/dL in children)."
    explanation: GeneReviews states the untreated LDL-C thresholds used for a clinical FH diagnosis.
  - reference: PMID:27919345
    reference_title: "Familial defective apolipoprotein B-100: A review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the elevation of plasma low-density lipoprotein cholesterol observed in FDB is frequently milder than that of FH due to mutations in LDLR, and FDB is subsequently underdiagnosed according to standard FH diagnostic criteria"
    explanation: >-
      Qualifies the thresholds for FDB specifically - they underdiagnose this
      disorder. PARTIAL because it limits rather than supports their use here.
- name: Differential Diagnosis of Inherited Hypercholesterolemia
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    FDB must be separated from the other monogenic hypercholesterolemias that
    present identically - LDLR-mediated FH (receptor defect), PCSK9
    gain-of-function FH (accelerated receptor degradation), and autosomal
    recessive LDLRAP1-related FH - as well as from polygenic
    hypercholesterolemia, elevated lipoprotein(a), and secondary dyslipidemias.
  results: >
    Resolution is molecular, not clinical: the disorders are not reliably
    distinguishable on lipid values or physical signs.
  notes: >
    A separate and more important discrimination for this entry runs in the
    opposite direction. APOB also harbours a truncating allelic series causing
    familial hypobetalipoproteinemia, which LOWERS apoB-containing lipoproteins
    and produces hepatic steatosis rather than premature atherosclerosis. It is
    the same gene with the opposite lipid direction, so APOB-keyed literature
    must be checked for which allelic series it describes before being applied
    to FDB. This entry covers only the receptor-binding-region missense series
    that raises LDL cholesterol.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: Enumerates the monogenic FH differentials that molecular testing separates.
  - reference: PMID:38393015
    reference_title: "ApoB100 and Atherosclerosis: What's New in the 21st Century?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial hypobetalipoproteinemia (FHBL) is an autosomal codominant genetic disorder characterized by the diminished secretion of ApoB48 and ApoB100 lipoproteins due to defects in the ApoB gene."
    explanation: >-
      Establishes the opposite-direction APOB disorder that must not be
      conflated with FDB, in a source that describes both.
treatments:
- name: Statin (HMG-CoA Reductase Inhibitor) Therapy
  description: >
    First-line LDL-lowering therapy. The mechanistic rationale is specific to
    FDB: because the LDL receptor is normal, statin-induced hepatic LDL receptor
    upregulation still works. The extra receptor capacity clears the wild-type
    LDL pool and apoE-containing LDL precursors more efficiently even though the
    mutant LDL particles remain poor ligands, so LDL cholesterol falls.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: statin
      term:
        id: CHEBI:87631
        label: statin
  target_mechanisms:
  - target: Reduced Receptor-Mediated Hepatic LDL Clearance
    treatment_effect: ACTIVATES
    description: >
      Statins raise hepatic LDL receptor abundance, partially compensating for
      the ligand defect by increasing clearance of the receptor-competent
      lipoprotein pool.
    evidence:
    - reference: PMID:8141833
      reference_title: "Familial defective apolipoprotein B-100: a review, including some comparisons with familial hypercholesterolaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This may be due partly to increased receptor-mediated hepatic removal of mutant and normal precursors of LDL, using apo E as recognition element."
      explanation: States the proposed receptor-mediated mechanism by which receptor-inducing drugs work in FDB.
  evidence:
  - reference: PMID:8141833
    reference_title: "Familial defective apolipoprotein B-100: a review, including some comparisons with familial hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most FDB heterozygotes respond well to drugs that lower plasma LDL levels by inducing receptor activity."
    explanation: States preserved responsiveness to LDL-receptor-inducing therapy in FDB.
  - reference: PMID:8215738
    reference_title: "Familial defective apolipoprotein B-100 is clinically indistinguishable from familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Response to lipid-lowering therapy with beta-hydroxy-beta-methylglutaryl coenzyme A reductase inhibitors was similar to that reported in patients with familial hypercholesterolemia."
    explanation: Direct clinical observation that statin response in FDB matches that in FH.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "statins can be used in children starting around age eight years"
    explanation: >-
      GeneReviews sets the paediatric initiation age for statins in FH.
      PARTIAL because the recommendation is made for FH as a class, not for
      APOB-related FH specifically.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Statins are contraindicated in pregnancy because of concerns for teratogenicity and should be discontinued prior to conception."
    explanation: >-
      GeneReviews states the pregnancy contraindication carried in the notes
      above. PARTIAL because it constrains rather than supports the therapy,
      and is stated for FH as a class.
  notes: >
    Two management constraints carried from the GeneReviews FH chapter, both
    class-level rather than FDB-specific. Statins may be started in children
    from around age eight, which matters here because the biochemical phenotype
    in FDB is age-dependent and cascade-identified children may be
    normocholesterolemic at first testing. Statins are contraindicated in
    pregnancy and should be stopped before conception - a hard constraint on an
    otherwise lifelong therapy in a disorder that is transmitted to half of
    offspring.
- name: PCSK9 Monoclonal Antibody Therapy
  description: >
    Anti-PCSK9 monoclonal antibodies (alirocumab, evolocumab) block PCSK9-mediated
    degradation of the hepatic LDL receptor, increasing receptor recycling and
    surface abundance. The mechanistic rationale in FDB is the same one that makes
    statins work and is arguably stronger: the receptor is structurally normal, so
    every additional receptor molecule is fully functional. In a pooled genotyped
    analysis of six alirocumab trials, the 46 heterozygous APOB-defective patients
    lowered LDL cholesterol comparably to LDLR-mutation carriers.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alirocumab
      term:
        id: NCIT:C174849
        label: Alirocumab
    - preferred_term: evolocumab
      term:
        id: NCIT:C174672
        label: Evolocumab
  target_mechanisms:
  - target: Reduced Receptor-Mediated Hepatic LDL Clearance
    treatment_effect: ACTIVATES
    description: >
      Raising hepatic LDL receptor abundance partially compensates for the ligand
      defect by increasing clearance of the receptor-competent lipoprotein pool.
    evidence:
    - reference: PMID:28964736
      reference_title: "Efficacy of alirocumab in 1191 patients with a wide spectrum of mutations in genes causative for familial hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "54.1% (n = 20) and 50.1% (n = 6) in APOB-defective heterozygotes"
      explanation: Quantifies LDL cholesterol lowering specifically in APOB-defective (FDB) heterozygotes.
  notes: >
    The genotype-stratified APOB arm is small (46 patients, of whom 26 contributed
    the quoted Week 24 reductions), so this is an FDB-specific but low-precision
    estimate rather than a dedicated FDB trial. No retrieved trial enrolled FDB as
    a distinct molecular cohort.
  evidence:
  - reference: PMID:28964736
    reference_title: "Efficacy of alirocumab in 1191 patients with a wide spectrum of mutations in genes causative for familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this large patient cohort, individuals with a wide spectrum of mutations in genes underlying familial hypercholesterolemia responded substantially and similarly to alirocumab treatment."
    explanation: Supports comparable alirocumab efficacy across FH genotypes including APOB-defective carriers.
  - reference: PMID:28964736
    reference_title: "Efficacy of alirocumab in 1191 patients with a wide spectrum of mutations in genes causative for familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "46 had a heterozygous APOB-defective mutation"
    explanation: Documents the size of the FDB-relevant genotype stratum, the basis for the precision caveat.
- name: Second-Line LDL-Lowering Therapy (Ezetimibe and Add-On Agents)
  description: >
    Where a statin alone does not bring LDL cholesterol to target, guidelines
    add further LDL-lowering agents, ezetimibe first among them. Ezetimibe
    inhibits intestinal NPC1L1-mediated cholesterol absorption, which lowers
    the hepatic cholesterol pool and, like a statin, drives compensatory
    hepatic LDL receptor upregulation - so its mechanistic rationale in FDB is
    the same receptor-side one, and it is likewise unaffected by the ligand
    defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ezetimibe
      term:
        id: CHEBI:49040
        label: ezetimibe
  target_mechanisms:
  - target: Reduced Receptor-Mediated Hepatic LDL Clearance
    treatment_effect: ACTIVATES
    description: >
      Lowering the hepatic cholesterol pool upregulates LDL receptor
      expression, increasing clearance of the receptor-competent lipoprotein
      pool despite the persisting ligand defect. The mechanism is the same
      receptor-abundance lever exploited by statins and anti-PCSK9 antibodies.
    evidence:
    - reference: PMID:38393015
      reference_title: "ApoB100 and Atherosclerosis: What's New in the 21st Century?"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "certain lipid-modifying agents may act via the LDL-R, which is typically normal in subjects with FDB"
      explanation: >-
        Supports the receptor-side rationale that makes add-on LDL-lowering
        agents mechanistically applicable in FDB. PARTIAL because it states the
        principle without naming ezetimibe or giving an FDB effect size.
  notes: >
    Carried with an explicit extrapolation caveat, as the deep-research report
    itself recommends. No retrieved study reports ezetimibe (or bempedoic acid,
    inclisiran, or LDL apheresis) outcomes in a molecularly defined FDB cohort;
    the recommendation is drawn from mixed-genotype FH management, in which
    APOB carriers are a minority. It is recorded rather than omitted because
    silence would misrepresent standard care, and because the receptor-side
    mechanism gives a specific reason to expect it to work here - but no
    FDB-specific efficacy is asserted, and no FDB-specific effect size is
    curated. This is a weaker evidential footing than the statin and anti-PCSK9
    entries above, both of which carry genotype-stratified data.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Adults: pharmacotherapy (statins with additional medications as needed) to reduce lipid levels"
    explanation: >-
      GeneReviews establishes add-on pharmacotherapy beyond statins as standard
      FH management. PARTIAL because it is class-level FH guidance, not
      FDB-specific evidence.
- name: Cardiovascular Risk Factor Modification and Lipid Surveillance
  description: >
    Because FDB is a lifelong LDL-exposure disorder whose clinical endpoint is
    atherosclerosis, non-pharmacological management targets the modifiable
    determinants of that endpoint - smoking, saturated and trans fat intake,
    physical inactivity, obesity, hypertension and diabetes - alongside lipid
    monitoring from early childhood. Cascade evaluation of at-risk relatives
    belongs to the same arm and is especially consequential here, since half of
    a carrier's children inherit the allele and clinical criteria calibrated on
    LDLR-mediated FH will miss part of the FDB distribution.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  notes: >
    Class-level FH management from the GeneReviews chapter, applied here on the
    grounds of shared cumulative LDL burden rather than FDB-specific trial
    evidence. Recorded as BEHAVIORAL because the intervention is lifestyle and
    risk-factor counselling; the surveillance component is a monitoring
    schedule rather than a therapy, and is kept here rather than duplicated
    into the diagnosis section.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Smoking, high intake of saturated and trans unsaturated fat, sedentary lifestyle, obesity, hypertension, and diabetes mellitus."
    explanation: >-
      GeneReviews enumerates the modifiable exposures to avoid in FH. PARTIAL
      because the guidance is class-level rather than FDB-specific.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Monitor lipid levels from age two years"
    explanation: >-
      GeneReviews sets the surveillance schedule. PARTIAL for the same
      class-level reason; it is nonetheless pointed for FDB, where carriers can
      be normocholesterolemic when first tested.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Early diagnosis and treatment of first-degree and second-degree relatives at risk for FH can reduce morbidity and mortality."
    explanation: >-
      GeneReviews supports cascade evaluation of at-risk relatives. PARTIAL
      because the benefit is established for FH as a class.
discussions:
- discussion_id: controversy_fdb_severity_versus_ldlr_fh
  prompt: >
    Is the FDB phenotype genuinely milder than LDLR-mediated familial
    hypercholesterolemia, or does it only appear milder because the two
    disorders have been compared in cohorts ascertained through clinical FH
    criteria that FDB carriers with lower LDL cholesterol fail to meet?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Elevated Plasma LDL Cholesterol
  - phenotypes#Hypercholesterolemia
  rationale: >
    Two directly relevant studies disagree. A 1993 Dutch/Canadian series of 18
    molecularly confirmed FDB patients concluded the disorder was clinically
    indistinguishable from FH in physical characteristics and lipoprotein
    measures - but every one of those 18 had been ascertained through a clinical
    FH diagnosis, which selects for the high-cholesterol tail of FDB. A 1995
    multivariate comparison of 28 FDB against 129 FH heterozygotes found
    significantly lower total cholesterol, LDL cholesterol and triglycerides and
    higher HDL cholesterol in FDB, and explicitly noted that only some FDB
    subjects meet FH criteria. The 2016 review sides with the milder reading and
    draws the practical consequence, that FDB is underdiagnosed by standard FH
    criteria. The disagreement is not resolvable from these data because the
    ascertainment differs, so the entry curates the milder reading as the
    prevailing view while retaining the contradicting evidence rather than
    quietly dropping it.
  evidence:
  - reference: PMID:8215738
    reference_title: "Familial defective apolipoprotein B-100 is clinically indistinguishable from familial hypercholesterolemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder was clinically indistinguishable from familial hypercholesterolemia in terms of physical characteristics and lipoprotein measures."
    explanation: Refutes the milder-phenotype claim, in a cohort ascertained via clinical FH diagnosis.
  - reference: PMID:7583549
    reference_title: "Differences in the phenotypic characteristics of subjects with familial defective apolipoprotein B-100 and familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these results demonstrate that FDB subjects tend to have a milder form of hyperlipoproteinemia than FH subjects and that only a part of the subjects with FDB fulfill the established criteria for identifying FH"
    explanation: Supports the milder-phenotype claim and names the ascertainment bias that would hide it.
  - reference: PMID:27919345
    reference_title: "Familial defective apolipoprotein B-100: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the elevation of plasma low-density lipoprotein cholesterol observed in FDB is frequently milder than that of FH due to mutations in LDLR, and FDB is subsequently underdiagnosed according to standard FH diagnostic criteria"
    explanation: Contemporary review statement of the milder phenotype and its diagnostic consequence.
  proposed_experiments:
  - experiment_id: exp_fdb_genotype_first_severity_comparison
    name: Genotype-first comparison of FDB and LDLR-FH lipid phenotypes in an unselected biobank
    description: >
      Identify APOB p.Arg3527Gln and pathogenic LDLR carriers by sequence alone
      in a population biobank with linked lipid measurements, without any
      clinical FH ascertainment, and compare LDL cholesterol distributions and
      incident ASCVD. A genotype-first design removes the criteria-based
      selection that confounds every clinic-derived comparison to date.
- discussion_id: gap_vldl_kinetic_arm_of_fdb
  prompt: >
    Does FDB alter apoB-100 lipoprotein production and the VLDL-to-IDL-to-LDL
    delipidation cascade, or is it purely a clearance defect at the LDL step?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Receptor-Mediated Hepatic LDL Clearance
  rationale: >
    The disorder is modeled here as a clearance defect, which the receptor-binding
    data strongly support. But a stable-isotope kinetic study found VLDL apoB
    production rates in FDB intermediate between FH and controls with large
    interindividual variability, and IDL apoB production reduced relative to
    controls - so the precursor arm is not simply normal. With only six FDB
    subjects studied, the finding cannot yet support a curated production-side
    mechanism node, and none is asserted.
  evidence:
  - reference: PMID:9507998
    reference_title: "VLDL and IDL apolipoprotein B-100 kinetics in familial hypercholesterolemia due to impaired LDL receptor function or to defective apolipoprotein B-100."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "VLDL APR in FDB were between those of FH and controls (24.3+/-4.8 mg/kg/day), and demonstrated a relatively large inter-individual variability."
    explanation: Shows an unresolved production-side signal in FDB, underdetermined at this sample size.
  - reference: PMID:9507998
    reference_title: "VLDL and IDL apolipoprotein B-100 kinetics in familial hypercholesterolemia due to impaired LDL receptor function or to defective apolipoprotein B-100."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VLDL and IDL kinetics differ when LDL concentrations are elevated either due to a LDL receptor defect or due to defective apolipoprotein B-100."
    explanation: States that the precursor kinetics genuinely differ between the receptor-side and ligand-side disorders.
  proposed_experiments:
  - experiment_id: exp_fdb_apob_kinetics_powered
    name: Adequately powered stable-isotope apoB kinetic study in genotyped FDB
    description: >
      Repeat the primed-constant [1-13C]leucine infusion design in a larger,
      genotype-confirmed FDB cohort with matched LDLR-FH and normolipidemic
      controls, powered to resolve VLDL and IDL apoB production and fractional
      catabolic rates. This would settle whether a production-side node belongs
      in the FDB mechanism graph.

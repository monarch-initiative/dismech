name: Familial Defective Apolipoprotein B-100
creation_date: "2026-08-18T00:00:00Z"
description: >
  Familial defective apolipoprotein B-100 (FDB; hypercholesterolemia, autosomal
  dominant, type B) is a monogenic hypercholesterolemia caused by missense
  variants in the LDL-receptor-binding region of APOB. It is the mechanistic
  mirror image of LDLR-mediated familial hypercholesterolemia: the LDL receptor
  itself is structurally and functionally normal, but its ligand is not. The
  classic allele is p.Arg3527Gln in current HGVS numbering, the same
  substitution historically written R3500Q under mature-protein numbering. It
  destabilizes the apoB-100 conformation that presents the
  receptor-binding site, so LDL particles carrying mutant apoB-100 bind the
  normal LDL receptor poorly, are cleared inefficiently from plasma, and
  accumulate as elevated LDL cholesterol. The result is lifelong LDL elevation
  and premature atherosclerotic cardiovascular disease. Because the receptor
  pathway is intact and can still be upregulated, FDB heterozygotes generally
  respond well to LDL-receptor-inducing therapy such as statins. Whether the FDB
  phenotype is milder than LDLR-mediated FH is not fully settled and is curated
  here as an open controversy.
category: Mendelian
synonyms:
- Familial ligand-defective apolipoprotein B-100
- FDB
- Hypercholesterolemia, autosomal dominant, type B
- APOB-related familial hypercholesterolemia
- Familial hypercholesterolemia 2
disease_term:
  preferred_term: Familial Defective Apolipoprotein B-100
  term:
    id: MONDO:0007751
    label: hypercholesterolemia, autosomal dominant, type B
parents:
- Familial Hypercholesterolemia
notes: >
  Scope: curated as a standalone Disease rather than a subtype of
  kb/disorders/Familial_Hypercholesterolemia.yaml (MONDO:0005439). MONDO models
  MONDO:0007751 as a distinct is_a child of MONDO:0005439 defined by its causal
  gene (RO:0004003 hgnc:603 APOB, OMIM:144010), and the existing FH entry's
  has_subtypes axis is zygosity (heterozygous/homozygous), not gene. More
  importantly the mechanism differs at the molecular step that defines the
  disease: FDB is a ligand defect against a normal receptor, whereas
  LDLR-mediated FH is a receptor defect. The FH entry already carries an
  "APOB-LDLR Binding Defect" node as one of several genetic entry points into a
  shared pathway; this entry elaborates that node into its own mechanism graph
  and is deliberately not a duplicate of the umbrella entry.

  Not to be confused with the loss-of-function/truncating APOB allelic series
  that causes familial hypobetalipoproteinemia, which lowers rather than raises
  LDL cholesterol. Only APOB missense variants in the LDL-receptor-binding
  region produce this high-LDL phenotype.

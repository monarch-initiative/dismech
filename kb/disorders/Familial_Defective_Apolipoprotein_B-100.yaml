- name: Subendothelial Retention of ApoB-Containing Lipoproteins
  description: >
    Chronically raised circulating LDL drives infiltration and retention of
    apoB-containing lipoproteins in the arterial intima, the shared initiating
    event of atherogenesis. FDB substitutes an elevated ligand-defective LDL
    burden at this trigger; the downstream plaque biology is the conserved
    pattern captured by the atherogenesis module and is not re-derived here.
  conforms_to: "atherogenesis#Endothelial Dysfunction and Subendothelial LDL Retention"
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

biochemical:
- name: LDL Cholesterol
  context: Plasma
  presence: Increased
  notes: >
    In a multivariate comparison of 28 FDB heterozygotes against 129 heterozygous
    FH subjects, LDL cholesterol was 6.3 mmol/L in FDB versus 8.2 mmol/L in FH.
    Absolute values depend heavily on ascertainment, since FDB carriers found
    through lipid clinics are selected for high cholesterol.
  evidence:
  - reference: PMID:7583549
    reference_title: "Differences in the phenotypic characteristics of subjects with familial defective apolipoprotein B-100 and familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FDB subjects demonstrated significantly lower concentrations of total cholesterol (8.1 versus 10.2 mmol/L, P < .001), LDL cholesterol (6.3 versus 8.2 mmol/L, P < .001), and triglycerides (1.3 versus 1.8 mmol/L, P = .025) and higher concentrations of HDL cholesterol (1.4 versus 1.2 mmol/L, P = .015) than subjects with FH."
    explanation: Reports FDB LDL cholesterol concentrations against a directly compared FH group.
- name: Total Cholesterol
  context: Plasma
  presence: Increased
  notes: >
    Elevation is age-dependent. Swiss general-population carriers identified in
    their late teens were not necessarily hypercholesterolemic, then rose sharply
    into their early twenties.
  evidence:
  - reference: PMID:8006512
    reference_title: "High prevalence of familial defective apolipoprotein B-100 in Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three volunteers with the point mutation demonstrated an increase in total cholesterol concentrations by 1.30 mmol/l or by 25% within 2 years, suggesting that, in the early twenties, cholesterol concentrations increase markedly from normal to elevated levels."
    explanation: Documents the age-dependent emergence of total-cholesterol elevation in unselected carriers.
- name: HDL Cholesterol
  context: Plasma
  presence: Increased
  notes: >
    Relative to LDLR-mediated FH rather than to healthy controls - FDB subjects
    had higher HDL cholesterol than FH subjects (1.4 versus 1.2 mmol/L). This is
    a between-disease contrast, not an assertion that FDB raises HDL above normal.
  evidence:
  - reference: PMID:7583549
    reference_title: "Differences in the phenotypic characteristics of subjects with familial defective apolipoprotein B-100 and familial hypercholesterolemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "higher concentrations of HDL cholesterol (1.4 versus 1.2 mmol/L, P = .015) than subjects with FH"
    explanation: Supports the FDB-versus-FH contrast only; PARTIAL because no comparison to a normolipidemic reference group is made.
genetic:
- name: APOB
  gene_term:
    preferred_term: APOB
    term:
      id: hgnc:603
      label: APOB
  association: Causal
  presence: Positive
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  variant_origin: GERMLINE
  notes: >
    APOB encodes apolipoprotein B-100, the single structural protein of the LDL
    particle and the ligand for the LDL receptor. The FDB allelic series is
    confined to missense substitutions in or affecting the receptor-binding
    region; it is mechanistically distinct from the truncating APOB alleles that
    cause familial hypobetalipoproteinemia, which lower LDL cholesterol.
  variants:
  - name: p.Arg3527Gln (R3500Q; c.10580G>A)
    description: >
      The classic and by far the most common FDB allele. Numbering differs by
      convention: 3500 counts from the mature protein, 3527 includes the signal
      peptide and is the current HGVS form. Arises at a CpG mutational hot spot.
      Carriers of Western European descent share a common haplotype, consistent
      with a founder allele.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:8215738
      reference_title: "Familial defective apolipoprotein B-100 is clinically indistinguishable from familial hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation was associated with a similar haplotype, which was also reported in other patients of Western European descent with familial defective apolipoprotein B100. This strongly suggests that the mutation has a common chromosomal background that originated in Western Europe."
      explanation: Establishes the shared founder haplotype of the p.Arg3527Gln allele in Western Europe.
    - reference: PMID:32591292
      reference_title: "The first Japanese cases of familial hypercholesterolemia due to a known pathogenic APOB gene variant, c.10580 G>A: p.(Arg3527Gln)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The known p.(Arg3527Gln) variant in the APOB gene was identified in one Japanese family."
      explanation: Confirms the c.10580G>A / p.(Arg3527Gln) designation and documents its rarity outside European-descent populations.
  - name: p.Arg3527Trp (R3500W)
    description: >
      A distinct substitution at the same codon, reported in hyperlipidemic
      East Asian populations on its own founder haplotype. It is the APOB allele
      of note for FDB outside European-descent populations.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:9702952
      reference_title: "Identification and haplotype analysis of apolipoprotein B-100 Arg3500-->Trp mutation in hyperlipidemic Chinese."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A total of 373 hyperlipidemic patients and 309 controls were screened for R3500W. Nine unrelated subjects were shown to be heterozygous for the mutation, and no R3500W carriers were found in the control group (P = 0.004)."
      explanation: Demonstrates enrichment of R3500W in hyperlipidemic Chinese subjects versus controls.
    - reference: PMID:9702952
      reference_title: "Identification and haplotype analysis of apolipoprotein B-100 Arg3500-->Trp mutation in hyperlipidemic Chinese."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The fact that the same mutant allele was identified in other Asians with FDB indicates a common Asian origin for the R3500W mutations."
      explanation: Establishes a separate Asian founder origin for this allele.
    - reference: PMID:27919345
      reference_title: "Familial defective apolipoprotein B-100: A review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the APOB R3500 W variant is known to make a significant contribution to familial hypercholesterolemia (FH) among East Asians"
      explanation: Review confirms the population-specific contribution of R3500W.
  - name: p.Arg3558Cys (R3531C)
    description: >
      A neighbouring APOB substitution that was screened alongside the FDB
      alleles but did not raise cholesterol or ischemic heart disease risk in the
      general population. Recorded here as an explicit negative, since it
      delimits which APOB substitutions produce the FDB phenotype.
    type: missense
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:9603795
      reference_title: "Association of mutations in the apolipoprotein B gene with hypercholesterolemia and the risk of ischemic heart disease."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Heterzygous carriers of the Arg3531Cys mutation in the general population did not have higher-than-normal plasma cholesterol levels or an increased risk of ischemic heart disease"
      explanation: Refutes a causal FDB role for this substitution in an unselected population.
  evidence:
  - reference: PMID:27919345
    reference_title: "Familial defective apolipoprotein B-100: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FDB is caused by mutations in APOB reducing the binding affinity between apolipoprotein B-100 and the low-density lipoprotein receptor."
    explanation: Establishes APOB as the causal gene and the binding-affinity mechanism.
  - reference: PMID:2563166
    reference_title: "Association between a specific apolipoprotein B mutation and familial defective apolipoprotein B-100."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This same mutant allele occurs in six other, unrelated subjects and in eight affected relatives in two of these families."
    explanation: Original demonstration of segregation of the APOB allele with the FDB phenotype.

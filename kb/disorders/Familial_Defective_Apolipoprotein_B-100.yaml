    snippet: "Normal and abnormal LDL subpopulations were partially separated from plasma of two subjects by density-gradient ultracentrifugation, a finding consistent with the presence of a normal and a mutant allele."
    explanation: Demonstrates the heterozygous two-allele LDL subpopulation structure underlying dominant inheritance.
pathophysiology:
- name: APOB Receptor-Binding-Region Missense Variant
  description: >
    The initiating lesion is a missense substitution in the LDL-receptor-binding
    region of APOB, most commonly at the arginine residue numbered 3500 in the
    mature apoB-100 protein (p.Arg3527Gln in current HGVS numbering; c.10580G>A).
    The codon sits at a CpG mutational hot spot, which explains its recurrence.
    Critically, the variant is in the ligand, not the receptor: LDLR, PCSK9, and
    LDLRAP1 are wild type.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: APOB
    term:
      id: hgnc:603
      label: APOB
  genetic_context:
    gene:
      preferred_term: APOB
      term:
        id: hgnc:603
        label: APOB
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >
      Scored as PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION or
      DOMINANT_NEGATIVE. The protein is made and assembled normally into an
      LDL particle of normal chemical and physical composition; only the
      receptor-binding activity of that particle is reduced, and it is reduced
      partially rather than abolished - LDL from an FDB heterozygote retained
      about 32% of normal receptor binding activity in the original fibroblast
      binding study. DOMINANT_NEGATIVE would be the wrong call: the mutant
      apoB-100 does not interfere with the wild-type allele's product. Each LDL
      particle carries exactly one apoB-100 molecule, so mutant and wild-type
      particles are separate species that behave independently, and dominance is
      explained by preferential plasma accumulation of the poorly cleared mutant
      particles rather than by any trans effect on the normal protein.
      Supporting evidence for this call is carried on this node's evidence
      list, since GeneticContext has no evidence slot.
  downstream:
  - target: Defective ApoB-100 Binding to a Structurally Normal LDL Receptor
    description: The substitution directly produces the ligand-side binding defect.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8006512
      reference_title: "High prevalence of familial defective apolipoprotein B-100 in Switzerland."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Familial defective apolipoprotein B-100 (FDB) is caused by a single G-to-A substitution at nucleotide 10,708 leading to an arginine to glutamine change at amino acid 3,500 of the apolipoprotein B-100 and thus, a reduced binding of the apolipoprotein B to the low density lipoprotein (LDL) receptor."
      explanation: States the direct causal step from the single nucleotide substitution to reduced apoB-LDLR binding.
  evidence:
  - reference: PMID:2563166
    reference_title: "Association between a specific apolipoprotein B mutation and familial defective apolipoprotein B-100."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extensive sequence analysis of the two alleles of one subject heterozygous for the disorder has revealed a previously unreported mutation in the codon for amino acid 3500 that results in the substitution of glutamine for arginine."
    explanation: The original identification of the causal APOB missense variant.
  - reference: PMID:3477815
    reference_title: "Familial defective apolipoprotein B-100: low density lipoproteins with abnormal receptor binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The G.R. LDL possessed 32% of normal receptor binding activity"
    explanation: Quantifies residual (partial, not absent) receptor-binding activity, supporting the PARTIAL_LOSS_OF_FUNCTION call on this node's genetic_context.
  - reference: PMID:3477815
    reference_title: "Familial defective apolipoprotein B-100: low density lipoproteins with abnormal receptor binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the defect in receptor binding does not appear to be associated with an abnormal lipid composition or structure of the LDL: the chemical and physical properties of the particles were normal"
    explanation: Shows the particle is otherwise normally assembled, arguing against a global loss of apoB-100 function.
  - reference: PMID:2563166
    reference_title: "Association between a specific apolipoprotein B mutation and familial defective apolipoprotein B-100."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutation in the codon for amino acid 3500 (CGG----CAG), a CG mutational \"hot spot\", defines a minor apoB-100 allele associated with defective low density lipoproteins and hypercholesterolemia"
    explanation: Identifies the CpG hot spot that accounts for the recurrence of this allele.
  - reference: PMID:8215738
    reference_title: "Familial defective apolipoprotein B-100 is clinically indistinguishable from familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial defective apolipoprotein B-100 is caused by a substitution of adenine for guanine in exon 26 of the gene coding for apolipoprotein B, which results in the substitution of glutamine for arginine in the putative low-density lipoprotein-receptor binding domain of the mature protein."
    explanation: Locates the substitution in exon 26 within the LDL-receptor-binding domain.
- name: Defective ApoB-100 Binding to a Structurally Normal LDL Receptor
  description: >
    The defining mechanistic step, and the point at which FDB diverges from
    LDLR-mediated familial hypercholesterolemia. The LDL receptor is normal; the
    ligand is defective. Arg3527 is not itself a contact residue of the receptor
    binding site - site B (residues 3359-3369) makes the contact. Instead
    Arg3527 interacts with the carboxyl terminus of apoB-100 (including Trp4396)
    to hold the belt of apoB-100 around the LDL particle in the conformation that
    exposes and stabilizes the basic-residue clusters of the binding site.
    Losing that arginine destabilizes the interaction and misconfigures the
    binding site, so the receptor cannot recognize the particle. Removing the
    carboxyl terminus of FDB LDL restores normal receptor binding, which shows
    the defect is conformational rather than a direct loss of a contact residue.
  role: central_effector
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: APOB
    term:
      id: hgnc:603
      label: APOB
  molecular_functions:
  - preferred_term: low-density lipoprotein particle receptor binding
    term:
      id: GO:0050750
      label: low-density lipoprotein particle receptor binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: low-density lipoprotein particle
    term:
      id: GO:0034362
      label: low-density lipoprotein particle
  downstream:
  - target: Reduced Receptor-Mediated Hepatic LDL Clearance
    description: >
      A particle the LDL receptor cannot bind cannot be internalized, so
      receptor-mediated catabolism of the mutant LDL pool fails.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2280177
      reference_title: "Familial defective apolipoprotein B-100: a mutation of apolipoprotein B that causes hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Low density lipoproteins accumulate in the plasma because their efficient receptor-mediated catabolism is disrupted."
      explanation: States the causal link from defective binding to failed receptor-mediated catabolism.
  - target: Small Dense LDL Particle Formation
    description: >
      Prolonged plasma residence of poorly cleared LDL exposes the particle to
      lipase and lipid-transfer remodeling, shifting the LDL population smaller.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26643808
      reference_title: "Structural analysis of APOB variants, p.(Arg3527Gln), p.(Arg1164Thr) and p.(Gln4494del), causing Familial Hypercholesterolaemia provides novel insights into variant pathogenicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "It has been suggested that in patients carrying p.(Arg3527Gln) variant, the impaired removal of LDL from plasma promotes the formation of small dense LDL particles (sdLDL)"
      explanation: States the proposed route from impaired LDL removal to small dense LDL in Arg3527Gln carriers.
  evidence:
  - reference: PMID:9486979
    reference_title: "Identification of the low density lipoprotein receptor-binding site in apolipoprotein B100 and the modulation of its binding activity by the carboxyl terminus in familial defective apo-B100."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Site-directed mutagenesis and other evidence indicated that Site B (amino acids 3,359-3,369) binds to the LDL receptor and that arginine-3,500 is not directly involved in receptor binding."
    explanation: Establishes that the mutated arginine is not itself a receptor contact residue, so the defect must be conformational.
  - reference: PMID:9486979
    reference_title: "Identification of the low density lipoprotein receptor-binding site in apolipoprotein B100 and the modulation of its binding activity by the carboxyl terminus in familial defective apo-B100."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The carboxyl-terminal 20% of apo-B100 is necessary for the R3500Q mutation to disrupt receptor binding, since removal of the carboxyl terminus in FDB LDL results in normal receptor-binding activity."
    explanation: Rescue of binding by carboxyl-terminal removal shows the mechanism is a conformational misconfiguration of the binding site.
  - reference: PMID:9486979
    reference_title: "Identification of the low density lipoprotein receptor-binding site in apolipoprotein B100 and the modulation of its binding activity by the carboxyl terminus in familial defective apo-B100."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the loss of arginine at this site destabilizes this interaction, resulting in receptor-binding defective LDL"
    explanation: States the proposed destabilization mechanism producing binding-defective LDL.
  - reference: PMID:26643808
    reference_title: "Structural analysis of APOB variants, p.(Arg3527Gln), p.(Arg1164Thr) and p.(Gln4494del), causing Familial Hypercholesterolaemia provides novel insights into variant pathogenicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The belt conformation of ApoB100 that surrounds the LDL particle is maintained by interaction of Arg3527 with Trp4396"
    explanation: Names the specific intramolecular interaction that the variant disrupts.
  - reference: PMID:26643808
    reference_title: "Structural analysis of APOB variants, p.(Arg3527Gln), p.(Arg1164Thr) and p.(Gln4494del), causing Familial Hypercholesterolaemia provides novel insights into variant pathogenicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It has been proposed that replacement of the Arg3527 promotes a conformational change in ApoB100 causing a rearrangement of a number of charged residues rather than loss of a single receptor-interactive residue"
    explanation: Explicitly frames the defect as conformational rearrangement rather than loss of a contact residue.
  - reference: PMID:27919345
    reference_title: "Familial defective apolipoprotein B-100: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FDB is caused by mutations in APOB reducing the binding affinity between apolipoprotein B-100 and the low-density lipoprotein receptor."
    explanation: Review statement of the ligand-side binding-affinity defect that defines the disorder.
- name: Small Dense LDL Particle Formation
  description: >
    LDL isolated from p.Arg3527Gln heterozygotes is measurably smaller than
    wild-type LDL and shows an altered apoB-100 secondary structure, with reduced
    beta-strand content. This is a consequence of the prolonged plasma residence
    time and of the conformational change itself, and is a plausible atherogenic
    amplifier rather than the primary disease step. Curated as a supporting node,
    not as the driver of the cardiovascular risk.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  cellular_components:
  - preferred_term: low-density lipoprotein particle
    term:
      id: GO:0034362
      label: low-density lipoprotein particle
  downstream:
  - target: Subendothelial Retention of ApoB-Containing Lipoproteins
    description: >
      Smaller, denser LDL particles are described as more atherogenic; treated
      here as a contributory rather than established route.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26643808
      reference_title: "Structural analysis of APOB variants, p.(Arg3527Gln), p.(Arg1164Thr) and p.(Gln4494del), causing Familial Hypercholesterolaemia provides novel insights into variant pathogenicity."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "changes in the intensity and width of the β-strands band detected by IR spectroscopy might be related to more atherogenic LDL"
      explanation: Only a hedged structural-correlate claim ("might be related"), hence PARTIAL support and an unknown-intermediates link.
  evidence:
  - reference: PMID:26643808
    reference_title: "Structural analysis of APOB variants, p.(Arg3527Gln), p.(Arg1164Thr) and p.(Gln4494del), causing Familial Hypercholesterolaemia provides novel insights into variant pathogenicity."

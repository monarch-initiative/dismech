progression:
- phase: Childhood and adolescence
  notes: >
    Carriers may be normocholesterolemic or only mildly hypercholesterolemic at
    this stage, which is a diagnostic trap in cascade screening of families.
- phase: Early adulthood
  notes: >
    Total cholesterol rises sharply into the elevated range in the early
    twenties in unselected carriers.
- phase: Mid to late adulthood
  notes: >
    Cumulative LDL exposure produces coronary atherosclerosis and symptomatic
    ischemic heart disease.
treatments:
- name: Statin (HMG-CoA Reductase Inhibitor) Therapy
  description: >
    First-line LDL-lowering therapy. The mechanistic rationale is specific to
    FDB: because the LDL receptor is normal, statin-induced hepatic LDL receptor
    upregulation still works. The extra receptor capacity clears the wild-type
    LDL pool and apoE-containing LDL precursors more efficiently even though the
    mutant LDL particles remain poor ligands, so LDL cholesterol falls.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: statin
      term:
        id: CHEBI:87631
        label: statin
  target_mechanisms:
  - target: Reduced Receptor-Mediated Hepatic LDL Clearance
    treatment_effect: ACTIVATES
    description: >
      Statins raise hepatic LDL receptor abundance, partially compensating for
      the ligand defect by increasing clearance of the receptor-competent
      lipoprotein pool.
    evidence:
    - reference: PMID:8141833
      reference_title: "Familial defective apolipoprotein B-100: a review, including some comparisons with familial hypercholesterolaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This may be due partly to increased receptor-mediated hepatic removal of mutant and normal precursors of LDL, using apo E as recognition element."
      explanation: States the proposed receptor-mediated mechanism by which receptor-inducing drugs work in FDB.
  evidence:
  - reference: PMID:8141833
    reference_title: "Familial defective apolipoprotein B-100: a review, including some comparisons with familial hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most FDB heterozygotes respond well to drugs that lower plasma LDL levels by inducing receptor activity."
    explanation: States preserved responsiveness to LDL-receptor-inducing therapy in FDB.
  - reference: PMID:8215738
    reference_title: "Familial defective apolipoprotein B-100 is clinically indistinguishable from familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Response to lipid-lowering therapy with beta-hydroxy-beta-methylglutaryl coenzyme A reductase inhibitors was similar to that reported in patients with familial hypercholesterolemia."
    explanation: Direct clinical observation that statin response in FDB matches that in FH.
- name: PCSK9 Monoclonal Antibody Therapy
  description: >
    Anti-PCSK9 monoclonal antibodies (alirocumab, evolocumab) block PCSK9-mediated
    degradation of the hepatic LDL receptor, increasing receptor recycling and
    surface abundance. The mechanistic rationale in FDB is the same one that makes
    statins work and is arguably stronger: the receptor is structurally normal, so
    every additional receptor molecule is fully functional. In a pooled genotyped
    analysis of six alirocumab trials, the 46 heterozygous APOB-defective patients
    lowered LDL cholesterol comparably to LDLR-mutation carriers.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alirocumab
      term:
        id: NCIT:C174849
        label: Alirocumab
    - preferred_term: evolocumab
      term:
        id: NCIT:C174672
        label: Evolocumab
  target_mechanisms:
  - target: Reduced Receptor-Mediated Hepatic LDL Clearance
    treatment_effect: ACTIVATES
    description: >
      Raising hepatic LDL receptor abundance partially compensates for the ligand
      defect by increasing clearance of the receptor-competent lipoprotein pool.
    evidence:
    - reference: PMID:28964736
      reference_title: "Efficacy of alirocumab in 1191 patients with a wide spectrum of mutations in genes causative for familial hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "54.1% (n = 20) and 50.1% (n = 6) in APOB-defective heterozygotes"
      explanation: Quantifies LDL cholesterol lowering specifically in APOB-defective (FDB) heterozygotes.
  notes: >
    The genotype-stratified APOB arm is small (46 patients, of whom 26 contributed
    the quoted Week 24 reductions), so this is an FDB-specific but low-precision
    estimate rather than a dedicated FDB trial. No retrieved trial enrolled FDB as
    a distinct molecular cohort.
  evidence:
  - reference: PMID:28964736
    reference_title: "Efficacy of alirocumab in 1191 patients with a wide spectrum of mutations in genes causative for familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this large patient cohort, individuals with a wide spectrum of mutations in genes underlying familial hypercholesterolemia responded substantially and similarly to alirocumab treatment."
    explanation: Supports comparable alirocumab efficacy across FH genotypes including APOB-defective carriers.
  - reference: PMID:28964736
    reference_title: "Efficacy of alirocumab in 1191 patients with a wide spectrum of mutations in genes causative for familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "46 had a heterozygous APOB-defective mutation"
    explanation: Documents the size of the FDB-relevant genotype stratum, the basis for the precision caveat.
- name: Molecular Genetic Testing of APOB
  description: >
    Targeted APOB genotyping resolves FDB from LDLR-mediated FH in patients
    meeting clinical FH criteria. This matters because a substantial minority of
    clinically diagnosed FH is genetically FDB, and because carriers with milder
    lipid values are missed by criteria calibrated on LDLR-mediated FH. The
    variant is a single-nucleotide substitution amenable to simple PCR-based
    assays. Recorded as a diagnostic action, so it deliberately carries no
    target_mechanisms link.
  treatment_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:8141833
    reference_title: "Familial defective apolipoprotein B-100: a review, including some comparisons with familial hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most lipid clinics, 2-5% of patients given a clinical diagnosis of FH have FDB, not FH."
    explanation: Quantifies the diagnostic yield that motivates APOB genotyping in clinically diagnosed FH.
  - reference: PMID:8006512
    reference_title: "High prevalence of familial defective apolipoprotein B-100 in Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the estimated high prevalence and the relative ease of PCR-based tests, screening for FDB may become a standard procedure in patients with suggested familial forms of hypercholesterolemia."
    explanation: Supports molecular screening for FDB among suspected familial hypercholesterolemia.
discussions:
- discussion_id: controversy_fdb_severity_versus_ldlr_fh
  prompt: >
    Is the FDB phenotype genuinely milder than LDLR-mediated familial
    hypercholesterolemia, or does it only appear milder because the two
    disorders have been compared in cohorts ascertained through clinical FH
    criteria that FDB carriers with lower LDL cholesterol fail to meet?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Elevated Plasma LDL Cholesterol
  - phenotypes#Hypercholesterolemia
  rationale: >
    Two directly relevant studies disagree. A 1993 Dutch/Canadian series of 18
    molecularly confirmed FDB patients concluded the disorder was clinically
    indistinguishable from FH in physical characteristics and lipoprotein
    measures - but every one of those 18 had been ascertained through a clinical
    FH diagnosis, which selects for the high-cholesterol tail of FDB. A 1995
    multivariate comparison of 28 FDB against 129 FH heterozygotes found
    significantly lower total cholesterol, LDL cholesterol and triglycerides and
    higher HDL cholesterol in FDB, and explicitly noted that only some FDB
    subjects meet FH criteria. The 2016 review sides with the milder reading and
    draws the practical consequence, that FDB is underdiagnosed by standard FH
    criteria. The disagreement is not resolvable from these data because the
    ascertainment differs, so the entry curates the milder reading as the
    prevailing view while retaining the contradicting evidence rather than
    quietly dropping it.
  evidence:
  - reference: PMID:8215738
    reference_title: "Familial defective apolipoprotein B-100 is clinically indistinguishable from familial hypercholesterolemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder was clinically indistinguishable from familial hypercholesterolemia in terms of physical characteristics and lipoprotein measures."
    explanation: Refutes the milder-phenotype claim, in a cohort ascertained via clinical FH diagnosis.
  - reference: PMID:7583549
    reference_title: "Differences in the phenotypic characteristics of subjects with familial defective apolipoprotein B-100 and familial hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these results demonstrate that FDB subjects tend to have a milder form of hyperlipoproteinemia than FH subjects and that only a part of the subjects with FDB fulfill the established criteria for identifying FH"
    explanation: Supports the milder-phenotype claim and names the ascertainment bias that would hide it.
  - reference: PMID:27919345

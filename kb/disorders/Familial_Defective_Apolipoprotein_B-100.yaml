inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    A single mutant APOB allele is sufficient. Heterozygotes carry a mixed LDL
    pool of normal and receptor-binding-defective particles, and the defective
    particles accumulate preferentially because only they escape efficient
    receptor-mediated clearance. Each child of a heterozygous carrier has a 50%
    chance of inheriting the allele.

    Penetrance is recorded as INCOMPLETE and expressivity as VARIABLE, and the
    two qualifiers refer to different things. The biochemical phenotype emerges
    with age - unselected carriers identified in their late teens need not be
    hypercholesterolemic and rise into the elevated range in their early
    twenties - so a normal cholesterol in a young carrier is not evidence
    against the genotype. Clinical penetrance measured against formal FH
    criteria is genuinely incomplete: only a subset of molecularly confirmed
    FDB carriers meet them, which is the mechanism by which FDB is
    underdiagnosed. Expressivity is variable in the same cohorts, with
    intraindividual cholesterol fluctuation markedly larger than in
    LDLR-mediated FH. Neither qualifier is a quantitative penetrance estimate;
    none is available for genotype-first FDB, so penetrance_percentage is
    deliberately omitted.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each child of an individual with a heterozygous pathogenic variant in APOB, LDLR, or PCSK9 has a 50% chance of inheriting the pathogenic variant and having FH."
    explanation: >-
      GeneReviews states the 50% transmission risk for APOB-related FH, the
      genetic-counseling consequence of autosomal dominant inheritance here.
  - reference: PMID:7583549
    reference_title: "Differences in the phenotypic characteristics of subjects with familial defective apolipoprotein B-100 and familial hypercholesterolemia."
    supports: SUPPORT

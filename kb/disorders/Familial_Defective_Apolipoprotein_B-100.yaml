- name: Premature Atherosclerotic Cardiovascular Disease
  description: >
    The terminal clinical consequence: accelerated coronary atherosclerosis with
    premature ischemic heart disease. In the Danish general-population study the
    Arg3500Gln allele conferred a sevenfold odds of ischemic heart disease, and
    the effect was allele-specific - the neighbouring Arg3531Cys substitution
    raised neither cholesterol nor ischemic heart disease risk, an internal
    negative control for the mechanism.
  role: outcome
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  locations:
  - preferred_term: coronary artery
    term:
      id: UBERON:0001621
      label: coronary artery
  evidence:
  - reference: PMID:9603795
    reference_title: "Association of mutations in the apolipoprotein B gene with hypercholesterolemia and the risk of ischemic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Arg3500Gln mutation in the apolipoprotein B gene, which is responsible for familial defective apolipoprotein B-100 and is present in approximately 1 in 1000 persons in Denmark, causes severe hypercholesterolemia and increases the risk of ischemic heart disease."
    explanation: States the population-level conclusion that the FDB allele causes hypercholesterolemia and raises ischemic heart disease risk.
  - reference: PMID:9603795
    reference_title: "Association of mutations in the apolipoprotein B gene with hypercholesterolemia and the risk of ischemic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterzygous carriers of the Arg3531Cys mutation in the general population did not have higher-than-normal plasma cholesterol levels or an increased risk of ischemic heart disease"
    explanation: Allele-specific negative control - a different APOB substitution produced neither phenotype, supporting specificity of the binding-region lesion.
  - reference: PMID:8141833
    reference_title: "Familial defective apolipoprotein B-100: a review, including some comparisons with familial hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

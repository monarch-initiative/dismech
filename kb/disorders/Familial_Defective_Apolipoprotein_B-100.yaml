    snippet: "LDL particles obtained from heterozygous patients carrying p.(Arg3527Gln) or p.(Arg1164Thr) variants show a main population of particles of ~27 nm, significantly smaller than the ones carrying wt ApoB100 (~29 nm)"
    explanation: Direct measurement of reduced LDL particle size in Arg3527Gln heterozygotes.
  - reference: PMID:26643808
    reference_title: "Structural analysis of APOB variants, p.(Arg3527Gln), p.(Arg1164Thr) and p.(Gln4494del), causing Familial Hypercholesterolaemia provides novel insights into variant pathogenicity."

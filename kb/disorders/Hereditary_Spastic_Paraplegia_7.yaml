inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    SPG7-related neurologic disorder is inherited in an autosomal recessive
    manner. Several studies have reported a single heterozygous SPG7 variant in
    affected individuals, raising the possibility of autosomal dominant
    inheritance, but that possibility remains controversial and is not curated
    here as an established mode. Where both parents are known heterozygotes,
    each sib of a proband has a 25% chance of being affected at conception.
  evidence:
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPG7-related neurologic disorder is inherited in an autosomal recessive
      manner.
    explanation: States the established mode of inheritance.
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      however, the possibility of autosomal dominant inheritance remains
      controversial
    explanation: >-
      Records the unresolved monoallelic question. Classified PARTIAL because the
      source explicitly declines to settle it, and this entry therefore does not
      curate a dominant inheritance block.
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for an SPG7 pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of being affected, a 50% chance of being heterozygous, and a 25% chance of
      inheriting neither of the familial pathogenic variants.
    explanation: >-
      GeneReviews genetic-counseling statement supplying the recurrence risk for
      sibs of a proband. Cited separately from the mode-of-inheritance snippet
      above because a transmission figure is a distinct quantitative claim.
pathophysiology:
- name: Paraplegin Loss and m-AAA Protease Deficiency
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic SPG7 variants abolish paraplegin, a nuclear-encoded mitochondrial
    metalloprotease that localizes to mitochondria and is highly homologous to the
    yeast inner-membrane ATPases AFG3, RCA1, and YME1, which carry both
    proteolytic and chaperone-like activities. In its metazoan role, paraplegin
    is a subunit of the m-AAA protease family responsible for degrading
    oxidatively damaged and misfolded mitochondrial proteins. Loss of this
    quality-control protease is the entry point of the disorder, and it places
    SPG7 in the mitochondrial-function category of HSP genes alongside
    SPG13/HSPD1.
  gene:
    preferred_term: SPG7
    term:
      id: hgnc:11237
      label: SPG7
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: mitochondrial protein quality control
    term:
      id: GO:0141164
      label: mitochondrial protein quality control
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9635427
    reference_title: "Spastic paraplegia and OXPHOS impairment caused by mutations in paraplegin, a nuclear-encoded mitochondrial metalloprotease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that patients from a chromosome 16q24.3-linked HSP family are
      homozygous for a 9.5 kb deletion involving a gene encoding a novel protein,
      named Paraplegin.
    explanation: >-
      The original identification of biallelic SPG7/paraplegin loss as the cause,
      in human HSP families.
  - reference: PMID:9635427
    reference_title: "Spastic paraplegia and OXPHOS impairment caused by mutations in paraplegin, a nuclear-encoded mitochondrial metalloprotease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Paraplegin is highly homologous to the yeast mitochondrial ATPases, AFG3,
      RCA1, and YME1, which have both proteolytic and chaperon-like activities at
      the inner mitochondrial membrane. Immunofluorescence analysis and import
      experiments showed that Paraplegin localizes to mitochondria.
    explanation: >-
      Establishes the molecular identity and subcellular localization of the lost
      protein. Evidence source is IN_VITRO because the localization rests on
      immunofluorescence and import experiments.
  - reference: PMID:29467464
    reference_title: "Loss of the Drosophila m-AAA mitochondrial protease paraplegin results in mitochondrial dysfunction, shortened lifespan, and neuronal and muscular degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we have created a CRISPR/Cas9 allele of the Drosophila homolog of SPG7,
      which encodes an inner membrane-localized AAA+ protease known as paraplegin
    explanation: >-
      Confirms paraplegin's identity as an inner-membrane AAA+ protease in a
      metazoan and supplies the model system used below. Evidence source is
      MODEL_ORGANISM because the work is in Drosophila.
  - reference: PMID:29467464
    reference_title: "Loss of the Drosophila m-AAA mitochondrial protease paraplegin results in mitochondrial dysfunction, shortened lifespan, and neuronal and muscular degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To oppose this occurrence, organisms employ a variety of strategies,
      including the selective degradation of oxidatively damaged and misfolded
      mitochondrial proteins.
    explanation: >-
      Supports this node's functional claim, and the GO mitochondrial
      protein quality control binding, that the m-AAA protease family degrades
      oxidatively damaged and misfolded mitochondrial proteins. Evidence source
      is OTHER because this is the review-style framing of the paper rather than
      its own experimental result.
  downstream:
  - target: Mitochondrial Dysfunction and OXPHOS Impairment
    description: >-
      Without the quality-control protease, damaged mitochondrial proteins are
      not cleared and respiratory function falls.

- name: Mitochondrial Dysfunction and OXPHOS Impairment
  biological_scale: CELLULAR
  description: >-
    Loss of the m-AAA protease leaves oxidatively damaged and misfolded
    mitochondrial proteins uncleared, and oxidative phosphorylation fails. This
    was demonstrable in human tissue from the outset: muscle biopsies from two of
    the original paraplegin-mutant patients showed typical signs of mitochondrial
    OXPHOS defects. The Drosophila SPG7 null recapitulates the mitochondrial
    phenotype in detail, with reduced respiratory chain complex I and II
    activities, electron-dense matrix accumulation, and severely swollen and
    dysmorphic mitochondria.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9635427
    reference_title: "Spastic paraplegia and OXPHOS impairment caused by mutations in paraplegin, a nuclear-encoded mitochondrial metalloprotease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of muscle biopsies from two patients carrying Paraplegin mutations
      showed typical signs of mitochondrial OXPHOS defects, thus suggesting a
      mechanism for neurodegeneration in HSP-type disorders.
    explanation: >-
      Direct human tissue evidence for OXPHOS impairment in paraplegin-mutant
      patients, which is why this node is not a model-only claim.
  - reference: PMID:29467464
    reference_title: "Loss of the Drosophila m-AAA mitochondrial protease paraplegin results in mitochondrial dysfunction, shortened lifespan, and neuronal and muscular degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A variety of mitochondrial defects accompanied the degenerative phenotypes
      of SPG7 mutants, including altered axonal transport of mitochondria,
      accumulation of electron-dense material in the matrix of flight muscle
      mitochondria, reduced activities of respiratory chain complexes I and II,
      and severely swollen and dysmorphic mitochondria in the synaptic terminals
      of photoreceptors.
    explanation: >-
      Enumerates the mitochondrial defects in the null model, including the
      altered axonal transport of mitochondria that is the edge to the next node.
  downstream:
  - target: Impaired Axonal Mitochondrial Transport and Distal Synaptic Failure
    description: >-
      Dysfunctional mitochondria are also mistransported along the axon, so the
      distal compartment is worst supplied.

- name: Impaired Axonal Mitochondrial Transport and Distal Synaptic Failure
  conforms_to: "corticospinal_tract_axonopathy#Impaired Axonal Transport and Organelle Distribution"
  biological_scale: CELLULAR
  description: >-
    Beyond the bioenergetic deficit itself, mitochondrial transport along the axon
    is disturbed, so the distal axon and its terminal are the compartment least
    well supplied with functional mitochondria. Ultrastructural examination of
    Drosophila SPG7-null photoreceptors localizes the start of the
    neurodegenerative process to the synaptic terminal rather than the cell body,
    which is the model-level correlate of the dying-back pattern seen clinically.
    This is a model-organism claim about where degeneration begins; the human
    evidence for SPG7 establishes the OXPHOS lesion and the tract degeneration
    but not the subcellular sequence.
  biological_processes:
  - preferred_term: axonal transport of mitochondrion
    term:
      id: GO:0019896
      label: axonal transport of mitochondrion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29467464
    reference_title: "Loss of the Drosophila m-AAA mitochondrial protease paraplegin results in mitochondrial dysfunction, shortened lifespan, and neuronal and muscular degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ultrastructural examination of photoreceptor neurons indicated that the
      neurodegenerative phenotype of SPG7 mutants initiates at the synaptic
      terminal.
    explanation: >-
      Localizes the onset of degeneration to the distal compartment, the
      subcellular basis for the dying-back pattern. Evidence source is
      MODEL_ORGANISM because the observation is in Drosophila photoreceptors.
  - reference: PMID:29467464
    reference_title: "Loss of the Drosophila m-AAA mitochondrial protease paraplegin results in mitochondrial dysfunction, shortened lifespan, and neuronal and muscular degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Drosophila SPG7 mutants exhibited shortened lifespan, progressive locomotor
      defects, sensitivity to chemical and environmental stress, and muscular and
      neuronal degeneration.
    explanation: >-
      Establishes that the null allele produces progressive locomotor decline and
      neuronal degeneration, i.e. that the mitochondrial lesion is sufficient for
      the degenerative phenotype in this model.
  downstream:
  - target: Corticospinal and Cerebellar Degeneration
    description: >-
      Distal supply failure kills the longest and most metabolically exposed
      central axons first.

- name: Corticospinal and Cerebellar Degeneration
  conforms_to: "corticospinal_tract_axonopathy#Distal Length-Dependent Degeneration of Long CNS Axons"
  biological_scale: TISSUE
  description: >-
    The corticospinal axons degenerate, producing the progressive bilateral leg
    weakness and spasticity that names the disorder. Unlike most HSP genes,
    however, SPG7 produces cerebellar degeneration in parallel and often in
    equal or greater measure, so ataxia, dysarthria, and dysphagia may be the
    presenting features rather than spasticity. Optic nerve degeneration is a
    third target, and isolated optic atrophy is a recognized presentation of the
    same genotype.
  cell_types:
  - preferred_term: cortical motor neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: neuron projection maintenance
    term:
      id: GO:1990535
      label: neuron projection maintenance
    modifier: DECREASED
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:9635427
    reference_title: "Spastic paraplegia and OXPHOS impairment caused by mutations in paraplegin, a nuclear-encoded mitochondrial metalloprotease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary spastic paraplegia (HSP) is characterized by progressive
      weakness and spasticity of the lower limbs due to degeneration of
      corticospinal axons.
    explanation: >-
      The class-level statement that HSP weakness and spasticity arise from
      corticospinal axon degeneration. Evidence source is OTHER because this is a
      background statement about the disease class rather than a finding of the
      study.
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially the spastic paraplegia is typically characterized by insidiously
      progressive bilateral leg weakness and spasticity or cerebellar findings
      (ataxia, dysarthria, and dysphagia) or both.
    explanation: >-
      Supports the parallel corticospinal and cerebellar involvement that
      distinguishes SPG7 from a pure corticospinal HSP.
  downstream:
  - target: Progressive Spastic Ataxia
    description: >-
      Combined corticospinal and cerebellar degeneration produces the mixed
      spastic-ataxic syndrome characteristic of SPG7.

- name: Progressive Spastic Ataxia
  conforms_to: "corticospinal_tract_axonopathy#Progressive Lower-Limb Spasticity and Weakness"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint is a phenotypic spectrum rather than a single syndrome:
    uncomplicated spastic ataxia, complicated spastic ataxia, spinocerebellar
    ataxia, and isolated optic nerve atrophy are all recognized presentations of
    biallelic SPG7 variants. Onset is typically adult but ranges from infancy to
    age 72. Spasticity and ataxia are progressive and may result in wheelchair
    dependence. Additional central features include decreased visual acuity from
    optic neuropathy, cognitive impairment, and dystonia, and there is a
    peripheral nervous system arm with motor and sensory neuropathy, neuropathic
    pain, and amyotrophy.
  evidence:
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic spectrum of SPG7-related neurologic disorder includes
      uncomplicated spastic ataxia, complicated spastic ataxia, spinocerebellar
      ataxia, and isolated optic nerve atrophy.
    explanation: >-
      Establishes that this endpoint is a spectrum of four recognized
      presentations, which is why the node does not assert a single syndrome.
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although onset typically occurs in adulthood, it may start in infancy or as
      late as age 72 years.
    explanation: Supplies the age-of-onset range recorded in this node.

genetic:
- name: SPG7 pathogenic variants
  gene_term:
    preferred_term: SPG7
    term:
      id: hgnc:11237
      label: SPG7
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic SPG7 variants encoding paraplegin. The original report identified a
    homozygous 9.5 kb deletion in a 16q24.3-linked family plus two further
    frameshift mutations, one in a complicated and one in a pure form of HSP -
    the phenotypic breadth of this gene was evident from the first description.
    Monoallelic SPG7 variants have been reported in affected individuals but a
    dominant mode remains controversial.
  evidence:
  - reference: PMID:9635427
    reference_title: "Spastic paraplegia and OXPHOS impairment caused by mutations in paraplegin, a nuclear-encoded mitochondrial metalloprotease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two additional Paraplegin mutations, both resulting in a frameshift, were
      found in a complicated and in a pure form of HSP.
    explanation: >-
      Documents both the loss-of-function mechanism and the pure/complicated
      phenotypic breadth present from the gene's first description.
  variants:
  - name: p.Ala510Val
    description: >-
      Recurrent pathogenic missense variant in SPG7 that is among the most
      frequent disease alleles in European cohorts; apparent monoallelic
      carriers are frequently explained by an undetected trans variant on
      genome sequencing.
    evidence:
    - reference: PMID:39978794
      reference_title: "Expanding the Phenotypic Spectrum of SPG7 Rare Damaging Variants: Insights From a Hungarian Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common variant was p. Leu78Ter (N = 23), followed by p.
        Ala510Val (N = 21).
      explanation: >-
        Identifies p.Ala510Val as one of the two predominant pathogenic SPG7
        alleles in a national cohort.
    - reference: PMID:41656397
      reference_title: "Identification of an additional deep intronic splice variant prompts critical evaluation of SPG7 inheritance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There is a growing number of reports of affected individuals found to be
        heterozygous carriers for the recurrent pathogenic coding variants in
        SPG7, most notably p.Ala510Val, and this has further led to the
        suggestion of SPG7-HSP having both recessive and dominant forms.
      explanation: >-
        Notes p.Ala510Val as the leading recurrent coding variant in SPG7-HSP.
  - name: p.Leu78Ter
    description: >-
      Recurrent nonsense loss-of-function variant in SPG7, the single most
      frequent pathogenic allele in the Hungarian SPG7 cohort.
    evidence:
    - reference: PMID:39978794
      reference_title: "Expanding the Phenotypic Spectrum of SPG7 Rare Damaging Variants: Insights From a Hungarian Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common variant was p. Leu78Ter (N = 23), followed by p.
        Ala510Val (N = 21).
      explanation: >-
        Documents p.Leu78Ter as the most frequent SPG7 allele in the Hungarian
        cohort.
  - name: c.987+152G>A
    description: >-
      Deep intronic splice-activating variant uncovered by short-read genome
      sequencing in trans with a coding nonsense allele, causing pseudoexon
      inclusion and premature termination (p.Ser330ValfsTer10).
    evidence:
    - reference: PMID:41656397
      reference_title: "Identification of an additional deep intronic splice variant prompts critical evaluation of SPG7 inheritance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Subsequent short-read genome sequencing (GS) identified a second, novel
        deep intronic variant (NM_003119.4:c.987 + 152G > A) in trans, predicted
        to activate a cryptic splice donor site. RNA sequencing confirmed
        inclusion of intronic sequence, resulting in a frameshift and premature
        stop codon (p.Ser330ValfsTer10).
      explanation: >-
        Establishes deep intronic cryptic-splice activation as an occult second
        hit in recessive SPG7-HSP.
diagnosis:
- name: Molecular genetic testing for SPG7
  description: >-
    The diagnosis is confirmed by identifying biallelic pathogenic SPG7
    variants in a proband with suggestive findings. Because the phenotypic
    spectrum spans spastic ataxia, pure spinocerebellar ataxia and isolated
    optic atrophy, the suggestive findings that prompt testing are broader
    than a spastic paraparesis alone; genome sequencing is recommended when
    panel or exome testing detects only a single heterozygous coding variant.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Biallelic pathogenic coding, structural, or deep intronic variants in SPG7
  evidence:
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SPG7-related neurologic disorder is established in a
      proband with suggestive findings and biallelic pathogenic variants in SPG7
      identified by molecular genetic testing.
    explanation: >-
      The GeneReviews confirmatory-testing criterion. Note it says "suggestive
      findings" rather than naming a syndrome, consistent with the breadth of the
      SPG7 phenotypic spectrum this entry curates.
  - reference: PMID:41656397
    reference_title: "Identification of an additional deep intronic splice variant prompts critical evaluation of SPG7 inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recommend the use of GS in individuals with suspected SPG7-HSP carrying
      only a single pathogenic variant to ensure a complete and accurate
      molecular diagnosis.
    explanation: >-
      Supports genome sequencing to detect trans deep intronic SPG7 variants
      when exome or panel testing identifies a single heterozygous coding
      allele.
- name: Skeletal Muscle Biopsy for Mitochondrial DNA Deletions and OXPHOS Deficiency
  description: >-
    Skeletal muscle histochemistry and single-fiber molecular analysis can
    demonstrate mosaic respiratory chain deficiency (complexes I, III, and IV)
    and high levels of multiple mitochondrial DNA deletions supporting
    paraplegin-related mitochondrial dysfunction.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: >-
    Mosaic respiratory chain complex I, III, and IV deficiency with multiple
    mitochondrial DNA deletions in respiratory-deficient muscle fibers
  evidence:
  - reference: PMID:24466038
    reference_title: "Spastic paraplegia type 7 is associated with multiple mitochondrial DNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical studies in skeletal muscle showed mosaic deficiency
      predominantly affecting respiratory complex I, but also complexes III and
      IV. Molecular studies in single, microdissected fibres showed multiple
      mitochondrial DNA deletions segregating at high levels (38-97%) in
      respiratory deficient fibres.
    explanation: >-
      Establishes skeletal muscle respiratory chain immunohistochemistry and
      mtDNA deletion analysis findings in SPG7 patients.

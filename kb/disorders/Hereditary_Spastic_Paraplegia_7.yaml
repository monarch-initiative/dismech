  - reference: PMID:29467464
    reference_title: "Loss of the Drosophila m-AAA mitochondrial protease paraplegin results in mitochondrial dysfunction, shortened lifespan, and neuronal and muscular degeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To oppose this occurrence, organisms employ a variety of strategies,
      including the selective degradation of oxidatively damaged and misfolded
      mitochondrial proteins.
    explanation: >-
      Supports this node's functional claim, and the GO mitochondrial

- name: Progressive Spastic Ataxia
  conforms_to: "corticospinal_tract_axonopathy#Progressive Lower-Limb Spasticity and Weakness"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint is a phenotypic spectrum rather than a single syndrome:
    uncomplicated spastic ataxia, complicated spastic ataxia, spinocerebellar
    ataxia, and isolated optic nerve atrophy are all recognized presentations of
    biallelic SPG7 variants. Onset is typically adult but ranges from infancy to
    age 72. Spasticity and ataxia are progressive and may result in wheelchair
    dependence. Additional central features include decreased visual acuity from
    optic neuropathy, cognitive impairment, and dystonia, and there is a
    peripheral nervous system arm with motor and sensory neuropathy, neuropathic
    pain, and amyotrophy.

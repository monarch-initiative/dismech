notes: >-
  SPG7 is a mitochondrial disease as much as a spastic paraplegia, and the MONDO
  hierarchy reflects that by placing it under mitochondrial oxidative
  phosphorylation disorder, hereditary spastic paraplegia, and hereditary ataxia
  simultaneously. Curating it only as an HSP understates the phenotype: isolated
  optic atrophy and pure spinocerebellar ataxia are both recognized presentations
  of the same biallelic genotype, so SPG7 belongs in the differential for
  adult-onset ataxia and for optic neuropathy, not only for spastic paraparesis.

  The subcellular sequence - mitochondrial transport failure, then degeneration
  beginning at the synaptic terminal - rests on the Drosophila SPG7 null and is
  curated as MODEL_ORGANISM evidence. The human evidence establishes the OXPHOS
  lesion (in patient muscle) and the corticospinal degeneration (clinically), but
  not the order in which the axonal compartment fails.

  The monoallelic question is deliberately left open. Several studies report a
  single heterozygous SPG7 variant in affected individuals, but GeneReviews
  explicitly calls dominant inheritance controversial and genome sequencing has
  uncovered trans deep intronic splice variants in apparent heterozygotes, so
  this entry curates only the recessive mode and records the unresolved
  monoallelic reports in the inheritance evidence rather than adding a dominant
  inheritance block.

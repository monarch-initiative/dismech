- name: Mitochondrial Dysfunction and OXPHOS Impairment
  biological_scale: CELLULAR
  description: >-
    Loss of the m-AAA protease leaves oxidatively damaged and misfolded
    mitochondrial proteins uncleared, leading to accumulation of multiple
    mitochondrial DNA deletions and oxidative phosphorylation failure. This was
    demonstrable in human tissue from the outset: muscle biopsies from
    paraplegin-mutant patients showed mosaic respiratory complex deficiencies
    and high levels of multiple mtDNA deletions. The Drosophila SPG7 null
    recapitulates the mitochondrial phenotype in detail, with reduced
    respiratory chain complex I and II activities, electron-dense matrix
    accumulation, and severely swollen and dysmorphic mitochondria.

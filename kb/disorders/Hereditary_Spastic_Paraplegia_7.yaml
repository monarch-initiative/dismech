  - reference: PMID:9635427
    reference_title: "Spastic paraplegia and OXPHOS impairment caused by mutations in paraplegin, a nuclear-encoded mitochondrial metalloprotease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Paraplegin is highly homologous to the yeast mitochondrial ATPases, AFG3,
      RCA1, and YME1, which have both proteolytic and chaperon-like activities at

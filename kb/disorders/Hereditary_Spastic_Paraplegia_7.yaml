inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    SPG7-related neurologic disorder is inherited in an autosomal recessive
    manner. Several studies have reported a single heterozygous SPG7 variant in
    affected individuals, raising the possibility of autosomal dominant
    inheritance, but that possibility remains controversial and is not curated
    here as an established mode. Where both parents are known heterozygotes,
    each sib of a proband has a 25% chance of being affected at conception.
  evidence:
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPG7-related neurologic disorder is inherited in an autosomal recessive
      manner.
    explanation: States the established mode of inheritance.
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      however, the possibility of autosomal dominant inheritance remains
      controversial
    explanation: >-
      Records that monoallelic SPG7 reports remain unresolved and autosomal
      dominant inheritance is not established.
  - reference: PMID:41656397
    reference_title: "Identification of an additional deep intronic splice variant prompts critical evaluation of SPG7 inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further, critical review of such reports in the literature found no
      substantial evidence for true autosomal dominant inheritance in SPG7-HSP.
      These cases most likely represent undetected second variants, alternative
      molecular diagnoses, or more complex disease mechanisms that have yet to
      be understood.
    explanation: >-
      Critical review and genome-sequencing evidence attributing apparent
      monoallelic SPG7 cases to cryptic second alleles such as deep intronic
      splice variants rather than true dominant inheritance.
  - reference: PMID:20301286
    reference_title: SPG7-Related Neurologic Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for an SPG7 pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of being affected, a 50% chance of being heterozygous, and a 25% chance of
      inheriting neither of the familial pathogenic variants.
    explanation: >-
      GeneReviews genetic-counseling statement supplying the recurrence risk for
      sibs of a proband. Cited separately from the mode-of-inheritance snippet
      above because a transmission figure is a distinct quantitative claim.
pathophysiology:
- name: Paraplegin Loss and m-AAA Protease Deficiency
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic SPG7 variants abolish paraplegin, a nuclear-encoded mitochondrial
    metalloprotease that localizes to mitochondria and is highly homologous to the
    yeast inner-membrane ATPases AFG3, RCA1, and YME1, which carry both
    proteolytic and chaperone-like activities. In its metazoan role, paraplegin
    is a subunit of the m-AAA protease family responsible for degrading
    oxidatively damaged and misfolded mitochondrial proteins. Loss of this
    quality-control protease is the entry point of the disorder, and it places
    SPG7 in the mitochondrial-function category of HSP genes alongside
    SPG13/HSPD1.

- name: Corticospinal and Cerebellar Degeneration
  conforms_to: "corticospinal_tract_axonopathy#Distal Length-Dependent Degeneration of Long CNS Axons"
  biological_scale: TISSUE
  description: >-
    The corticospinal axons degenerate, producing the progressive bilateral leg
    weakness and spasticity that names the disorder. Unlike most HSP genes,
    however, SPG7 produces cerebellar degeneration in parallel and often in
    equal or greater measure, so ataxia, dysarthria, and dysphagia may be the
    presenting features rather than spasticity. Optic nerve degeneration is a
    third target, and isolated optic atrophy is a recognized presentation of the
    same genotype.

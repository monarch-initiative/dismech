name: Hereditary Spastic Paraplegia 7
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- SPG7
- spastic paraplegia 7
- SPG7-related neurologic disorder
- hereditary spastic paraplegia paraplegin type
- spastic paraplegia 7, autosomal recessive
description: >-
  Hereditary spastic paraplegia 7 (SPG7) is caused by biallelic variants in SPG7,
  which encodes paraplegin, a nuclear-encoded subunit of the m-AAA metalloprotease
  of the inner mitochondrial membrane. The m-AAA complex has both proteolytic and
  chaperone-like activity and is responsible for the selective degradation of
  oxidatively damaged and misfolded mitochondrial proteins; its loss produces
  oxidative phosphorylation impairment, which was demonstrable in muscle biopsies
  from the very first patients in whom paraplegin mutations were identified. The
  clinical phenotype is broader than the SPG designation suggests: it spans
  uncomplicated spastic ataxia, complicated spastic ataxia, spinocerebellar
  ataxia, and isolated optic atrophy, so SPG7 belongs to the hereditary ataxia
  differential as much as to the spastic paraplegia one. Onset is typically in
  adulthood but ranges from infancy to age 72.

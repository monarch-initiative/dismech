    Adult SPG7 disease with progressive external ophthalmoplegia and multiple
    skeletal muscle mtDNA deletions overlaps clinically and pathologically with
    primary nuclear-encoded mtDNA maintenance PEO syndromes, warranting SPG7
    inclusion in the diagnostic workup of autosomal recessive PEO.

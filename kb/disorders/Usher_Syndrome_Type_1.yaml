  - population: >-
      Usher syndrome of all types: 684 patients pooled from 11 next-generation sequencing
      studies
    case_fraction_percent: 21.0
    cohort_size: 684
    notes: >-
      144 of 684 patients carried biallelic variants in this gene. The denominator is
      all Usher syndrome rather than this entry's clinical type, because that is the
      cohort the meta-analysis reports.
    evidence:
    - reference: PMID:30531642
      reference_title: "Genetics of Usher Syndrome: New Insights From a Meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the biallelic disease-causing mutation rate was assessed for each Usher gene to propose a classification by frequency: USH2A: 50% (341/684) of patients, MYO7A: 21% (144/684), CDH23: 6% (39/684), ADGRV1: 5% (35/684), PCDH15: 3% (21/684), USH1C: 2% (17/684), CLRN1: 2% (14/684), USH1G: 1% (9/684), WHRN: 0.4% (3/684), PDZD7 0.1% (1/684), CIB2 (0/684)"
      explanation: Meta-analysis biallelic mutation rate for this gene across all Usher syndrome patients.

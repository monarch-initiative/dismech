diagnosis:
- name: Audiologic, vestibular and retinal functional evaluation
  description: >-
    Establish the clinical phenotype with subjective and electrophysiologic
    hearing and retinal testing. Vestibular testing carries particular weight here
    because areflexia is present from infancy, long before the retinal phenotype.
  results: >-
    Congenital profound hearing loss with absent vestibular responses distinguishes
    type 1 from type 2 and type 3 before retinitis pigmentosa is detectable.
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of USH1 is established in a proband with characteristic findings on electrophysiologic and subjective tests of hearing and retinal function."
    explanation: Establishes combined hearing and retinal functional testing as the clinical diagnostic route.
- name: Molecular genetic confirmation
  description: >-
    Identify biallelic pathogenic variants in one of the five type-1 genes.
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in one of five genes – MYO7A, USH1C, CDH23, PCDH15, and USH1G – confirms the diagnosis."
    explanation: Establishes molecular confirmation for the five type-1 genes.
treatments:
- name: Cochlear Implantation
  description: >-
    Cochlear implantation should be considered as young as medically feasible,
    typically before age one year. The profound congenital loss of type 1 makes
    this the primary auditory intervention, in contrast to type 2 where hearing
    aids are the usual first step.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cochlear implantation should be considered as young as medically feasible, typically before age one year."
    explanation: GeneReviews recommends early cochlear implantation for the profound hearing loss of type 1.
- name: Vestibular Physical Therapy
  description: >-
    Physical therapy and vestibular rehabilitation for the areflexia and imbalance
    of type 1, beginning in childhood and continuing throughout the disease course.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Vestibular areflexia
    term:
      id: HP:0008568
      label: Vestibular areflexia
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical therapy is recommended to manage vestibular dysfunction \nand imbalance throughout the disease course"
    explanation: GeneReviews recommends physical therapy for the vestibular dysfunction of type 1.
- name: Speech and Multimodal Communication Support
  description: >-
    Pair hearing technology with timely audioverbal therapy where auditory
    communication is pursued, and offer sign language from infancy so a robust
    communication modality exists before and alongside devices.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."
    supports: SUPPORT

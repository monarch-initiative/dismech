  description: >-
    Biallelic loss of myosin VIIa, harmonin, SANS, cadherin-23 or
    protocadherin-15 disrupts the upper tip-link density (UTLD), the
    tension-bearing assembly at the insertion point of the tip link into the
    taller stereocilium. In the accepted model a cluster of myosin motors at the
    UTLD holds the tip link under resting tension; myosin VIIa and SANS are
    localized there, which is what places these Usher proteins in
    mechanotransduction rather than only in bundle morphogenesis.

    This is the mature-bundle complex. It is deliberately distinguished from the
    transient ankle-link complex that carries the type-2 mechanism, which is
    present in developing stereocilia and absent from mature ones.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: Hair Bundle Cohesion and Tip-Link Tension Failure
    description: >-
      Loss of a UTLD component removes the anchoring or tensioning element of the
      tip link, so bundle cohesion and resting tip-link tension are not maintained.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21709241
      reference_title: Myosin VIIa and sans localization at stereocilia upper tip-link density implicates these Usher syndrome proteins in mechanotransduction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "In the most accepted model for hair cell mechanotransduction, a cluster of myosin motors located at the stereocilia upper tip-link density (UTLD) keeps the tip-link under tension at rest."
      explanation: >-
        States the tension-bearing role of the UTLD myosin cluster. Marked
        BACKGROUND: this is the paper's opening statement of the accepted model,
        not the localization result the study itself produced.
  - target: Photoreceptor Calyceal Process Network Disruption
    description: >-
      The same five proteins form a network at the photoreceptor calyceal
      processes, so the retinal branch is a parallel consequence of the same
      molecular lesion rather than a sequel to the cochlear one.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23045546
      reference_title: "Localization of Usher 1 proteins to the photoreceptor calyceal processes, which are absent from mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This pattern, conserved in humans and frogs, was mediated by the formation of an USH1 protein network, which was associated with the calyceal processes from the early embryonic stages of outer segment growth onwards."
      explanation: Establishes that the same type-1 proteins form a conserved network at the calyceal processes.
  evidence:
  - reference: PMID:21709241
    reference_title: Myosin VIIa and sans localization at stereocilia upper tip-link density implicates these Usher syndrome proteins in mechanotransduction.
    supports: SUPPORT
    evidence_source: IN_VITRO

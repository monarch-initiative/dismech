phenotypes:
- category: Auditory
  name: Congenital Sensorineural Hearing Loss
  description: >-
    Congenital bilateral profound sensorineural hearing loss is the defining
    auditory presentation of type 1 and is what separates it clinically from the
    sloping congenital loss of type 2 and the progressive postlingual loss of
    type 3.
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527

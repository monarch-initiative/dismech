- name: MYO7A
  association: Causative
  subtype: USH1B
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MYO7A
    term:
      id: hgnc:7606
      label: MYO7A
  features: >-
    Myosin VIIa, the motor element of the upper tip-link density complex.
    ClinGen's Hearing Loss Gene Curation Expert Panel classifies the
    MYO7A-Usher-syndrome-type-1 relationship as Definitive.

    MYO7A also has a separate Definitive ClinGen assertion for autosomal dominant
    nonsyndromic hearing loss (DFNA11), curated in this KB as
    Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11, so a MYO7A variant has to be
    classified against a named disease entity rather than against "MYO7A disease".

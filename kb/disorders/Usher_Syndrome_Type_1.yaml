name: Usher Syndrome Type 1
creation_date: "2026-09-24T00:00:00Z"
category: Mendelian
synonyms:
- USH1
- Usher syndrome type I
- Usher syndrome type 1
description: >
  Usher syndrome type 1 is the mechanism entity in which biallelic loss of a
  component of the stereocilia upper tip-link density (UTLD) complex - myosin
  VIIa (MYO7A), harmonin (USH1C), SANS (USH1G), cadherin-23 (CDH23) and
  protocadherin-15 (PCDH15) - produces congenital profound sensorineural hearing
  loss, absent vestibular function, and adolescent-onset retinitis pigmentosa.
  The defining lesion is a tension-bearing complex of the MATURE hair bundle, in
  which a myosin motor cluster anchored by harmonin and SANS holds the
  cadherin-23/protocadherin-15 tip link under resting tension so that bundle
  deflection gates the mechanotransduction channel. This is a different assembly,
  in a different developmental window, from the transient ankle-link complex of
  Usher syndrome type 2, and clarin-1 (type 3) belongs to neither.

  In the retina the same five proteins form a conserved network at the calyceal
  processes - microvillus-like projections collaring the base of the photoreceptor
  outer segment in human, macaque and frog. This is NOT the periciliary membrane
  compartment that carries the type-2 retinal mechanism, and it is the reason the
  classical mouse models are deaf without retinal degeneration: mice have no
  calyceal processes at all.

  The numbered clinical type is retained as the entry label because it is the
  identity ClinGen and MONDO both curate at, but the entity is defined by the
  complex rather than by the clinical typing, which is an imperfect proxy - a
  CLRN1 (type 3) family has been reported as clinically diagnosable as type 1.

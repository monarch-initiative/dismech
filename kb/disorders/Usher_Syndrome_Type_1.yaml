    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Usher syndrome type I (USH1) is characterized by congenital bilateral profound sensorineural hearing loss, vestibular areflexia, and adolescent-onset retinitis pigmentosa (RP)."
    explanation: Confirms congenital bilateral profound sensorineural hearing loss in type 1.
- category: Vestibular
  name: Vestibular Areflexia
  description: >-
    Absent vestibular responses. Unlike type 2, where vestibular function is
    intact or variable, areflexia is constant in type 1 and is the earliest
    clinically detectable feature.

    reference_title: "The genetic and phenotypic landscapes of Usher syndrome: from disease mechanisms to a new classification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As in the inner ear, USH protein defects cause diverse phenotypic abnormalities in the retina, including decreased electroretinogram responses (ERGs), probably due to misshapen photoreceptor disks"
    explanation: Model evidence supports decreased ERG responses as a readout of Usher retinal dysfunction.
  - reference: PMID:20301442
    reference_title: "Usher Syndrome Type I."

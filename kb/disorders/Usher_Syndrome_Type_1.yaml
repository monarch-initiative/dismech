discussions:
- discussion_id: ush1_mouse_lacks_calyceal_processes
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can a mouse model report on the type-1 retinal mechanism at all, given that
    mice have no calyceal processes?
  attaches_to:
  - pathophysiology#Photoreceptor Calyceal Process Network Disruption
  rationale: >-
    The classical type-1 mouse models are deaf without retinal degeneration, and
    the usual explanation has been species differences in where individual
    proteins are expressed. A structural explanation covers all five genes at
    once: the mouse photoreceptor lacks calyceal processes entirely, so the
    structure the type-1 protein network builds in human, macaque and frog does
    not exist in the model organism. That makes the absent retinal phenotype an
    expected consequence of the model rather than evidence against the mechanism,
    and it means a negative retinal result in mouse carries very little weight
    for this entity.

    This bears directly on preclinical efficacy testing for MYO7A gene therapy: a
    mouse retina cannot report restoration of a structure it never had.
  evidence:
  - reference: PMID:23045546
    reference_title: "Localization of Usher 1 proteins to the photoreceptor calyceal processes, which are absent from mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By contrast, mouse photoreceptors lacked calyceal processes and had no USH1 proteins at the inner-outer segment interface."
    explanation: States the structural absence that makes the mouse retina uninformative for this mechanism.
notes: >
  MONDO coverage of the type-1 subtype series, and the type-1 concepts deliberately not
  curated here. Each of the five locus subtypes now binds its own MONDO term - USH1B
  MONDO:0700087, USH1C MONDO:0010171, USH1D MONDO:0010984, USH1F MONDO:0011186, USH1G
  MONDO:0011748 - and a sixth row, USH1DF, binds MONDO:0100050 for the digenic
  CDH23-plus-PCDH15 form, whose inheritance claim neither the USH1D nor the USH1F row
  describes. MONDO's parentage agrees: all six are children of MONDO:0010168, this entry's
  own term.

  MONDO:0010984 carries no causal-gene axiom in the release read on 2026-09-24, even though
  CDH23 is one of the five established type-1 genes, so a gene-keyed knowledge-graph
  comparison cannot see it. That is an upstream gap rather than a gap here.

  Three further children of MONDO:0010168 are declined as locus-only concepts: Usher
  syndrome type 1E (MONDO:0011195), type 1H (MONDO:0012968) and type 1K (MONDO:0014001).
  MONDO's definitions give a chromosome band and no gene for each, and none carries a
  causal-gene axiom, so there is nothing for a subtype row to bind that this entry does not
  already assert.

  Two Usher-named MONDO concepts belong to type 1 and are declined for stated reasons. Usher
  syndrome type 1J has been retired: MONDO:0013935 is marked owl:deprecated with
  term-replaced-by MONDO:0012273, autosomal recessive nonsyndromic hearing loss 48, which
  carries USH1J and Usher syndrome type 1J as exact synonyms, is axiomatized on CIB2, and
  sits under hearing loss rather than under Usher syndrome. dismech curates that disease as
  Autosomal_Recessive_Nonsyndromic_Hearing_Loss_48, which is consistent with the DISPUTED
  CIB2 record below. Usher syndrome, type 1M (MONDO:0032841) is still live but is a direct
  subclass of MONDO:0003847 hereditary disease rather than of Usher syndrome, has no text
  definition and no causal-gene axiom, and the ESPN assignment reported for USH1M is marked
  with a question mark in the ultra-rare-gene table of PMID:35353227; it is declined pending
  an upstream MONDO fix and better gene evidence.

  Reading the case fractions below: the meta-analysis denominator is all Usher syndrome,
  not type 1. Only the MYO7A record carries a type-specific figure, because that is the only
  gene for which a type-1 denominator is stated in a source cited here.
review_notes: >-
  Created 2026-09-24 by splitting kb/disorders/Usher_Syndrome.yaml into four
  mechanism entities plus a grouping, per the decision recorded on issue #10822.

  The entity is defined by the upper tip-link density complex, not by the clinical
  type. The numbered label is retained because ClinGen and MONDO both curate at
  that identity - ClinGen's Hearing Loss Gene Curation Expert Panel asserts all
  five type-1 genes against MONDO:0010168, the same term this entry binds - but
  the clinical typing is an imperfect proxy for the mechanism, and the entry
  description says so.

  Two nodes replace what the lumped entry carried as one. The retained
  "Photoreceptor Connecting Cilium Dysfunction" node was wrong for this entity:
  the type-1 retinal structure is the calyceal-process adhesion belt, a different
  subcellular compartment from the type-2 periciliary membrane complex. The
  hair-bundle node is scoped to the mature tension-bearing UTLD rather than to the
  transient ankle-link complex that carries the type-2 mechanism.

  Subtypes are named for the locus (USH1B, USH1D, USH1F) rather than the gene,
  because USH1C and USH1G are simultaneously locus designations and HGNC gene
  symbols and a gene-symbol convention would be ambiguous for two of the five.

  Not curated here, deliberately: no per-entity prevalence is asserted, because
  the source the lumped entry cited (4-17 per 100,000) reports that figure for
  Usher syndrome as a whole and splitting it across four entities would invent
  four numbers no source states; the `Grouping` class has no prevalence slot
  either, so the combined figure is carried in the grouping's prose. The five
  nonsyndromic DFNB stubs for these genes are left to issue #9863 rather than
  absorbed, and the isoform-selection question for
  MYO7A gene therapy is named in the treatment description but is not curated as a
  mechanistic_hypotheses group, because no evidence in this entry's reference set
  bears on which isoform a vector should carry.

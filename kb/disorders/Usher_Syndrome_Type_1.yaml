- name: Hair Cell Mechanotransduction Failure
  description: >-
    Cochlear and vestibular hair cells cannot convert bundle deflection into a
    receptor potential. Because the UTLD complex is required in the mature bundle
    and from development onward, the failure is present at birth, producing
    congenital profound hearing loss and complete vestibular areflexia rather
    than a progressive postlingual course.

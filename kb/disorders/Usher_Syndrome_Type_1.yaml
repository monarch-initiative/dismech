      id: hgnc:14674
      label: PCDH15
  description: >-
    Without an intact UTLD the cadherin-23/protocadherin-15 tip link is not
    correctly anchored or tensioned, and the graded-height cohesion of the
    stereocilia bundle is lost. Because the tip link gates the transduction
    channel directly, this is a failure of the transduction apparatus itself, not
    a downstream degenerative change.

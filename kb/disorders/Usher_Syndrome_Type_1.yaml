  description: >-
    In human, macaque and frog photoreceptors the five type-1 proteins colocalize
    at the interface between the inner and outer segments and between the
    microvillus-like calyceal processes and the basolateral outer segment. Loss of
    a network component is expected to destabilize that adhesion belt and the
    structural relationship it maintains between the calyceal processes and the
    outer segment.

    This is a different subcellular compartment from the periciliary membrane
    complex that carries the type-2 retinal mechanism, which is why a single
    "connecting cilium dysfunction" node cannot serve both entities.
  biological_scale: CELLULAR

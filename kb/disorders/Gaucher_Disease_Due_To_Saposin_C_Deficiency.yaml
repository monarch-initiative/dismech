progression:
- phase: Acute infantile neuronopathic presentation
  age_range: Infancy
  notes: >-
    Rare severe infantile cases present in the first months of life with
    hepatosplenomegaly, cytopenias, cherry-red spots, hypotonia, tonic-clonic
    seizures, and rapid encephalopathic decline.
  evidence:
  - reference: PMID:41812503
    reference_title: "Repurposing Gaucher disease therapy for Saposin C deficiency: Proof-of-concept with eliglustat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clonic seizures, hypotonia of all limbs, sluggish deep tendon reflexes and finally encephalopathic"
    explanation: Documents the severe acute infantile neuronopathic course reported at 1 month of age in homozygous truncating PSAP saposin C deficiency.
- phase: Childhood or young-adult visceral and hematologic presentation
  age_range: Childhood to young adulthood
  notes: >-
    Patients commonly present in childhood, adolescence, or young adulthood
    with hepatosplenomegaly, thrombocytopenia, and anemia resembling Gaucher
    disease.
  evidence:
  - reference: PMID:41812503
    reference_title: "Repurposing Gaucher disease therapy for Saposin C deficiency: Proof-of-concept with eliglustat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AZ is a 48-year-old female who first presented at the age of 29 with hepatosplenomegaly, anaemia and thrombocytopenia."
    explanation: Illustrates systemic visceral and hematologic onset prior to neurological progression.
- phase: Variable or delayed neuronopathic progression
  notes: >-
    While a subset of patients present with early-onset neuronopathic disease,
    several patients initially reported as non-neuronopathic later developed
    myoclonus and generalized seizures in adulthood.
  evidence:
  - reference: PMID:41812503
    reference_title: "Repurposing Gaucher disease therapy for Saposin C deficiency: Proof-of-concept with eliglustat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From the seventeen patients published up to this date with SapC deficiency, six of them did not have neurological manifestations at the time of their first publication. These six patients include AZ and MZ. Since the initial publication by Tylki-Szymańska in 2007, AZ did develop myoclonus and subsequently generalized seizures later in life."
    explanation: Documents delayed adult-onset neurological progression in initially non-neuronopathic saposin C deficiency.
pathophysiology:
- name: Saposin C Deficiency from PSAP Variants
  biological_scale: MOLECULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >-
    Saposin C arises from proteolytic cleavage of prosaposin (encoded by PSAP). Biallelic
    PSAP variants abolish saposin C, the activator protein that glucocerebrosidase requires
    to access and degrade glucosylceramide. Enzyme and GBA1 gene are normal; the defect is
    a missing activator cofactor.

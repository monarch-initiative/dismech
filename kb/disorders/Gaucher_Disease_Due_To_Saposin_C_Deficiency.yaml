    reference_title: A mutation in the saposin C domain of the sphingolipid activator protein (Prosaposin) gene causes neurodegenerative disease in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggest the in vivo role of saposin C in axonal membrane homeostasis, the disruption of which leads to neurodegeneration in lysosomal storage disease."
    explanation: Demonstrates in vivo that saposin C is required to maintain neuronal axonal membrane homeostasis upstream of neurodegeneration.
  - reference: PMID:41812503
    reference_title: "Repurposing Gaucher disease therapy for Saposin C deficiency: Proof-of-concept with eliglustat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the biology of Sap C is related to that of GD, it is not identical, and it is therefore not surprising that the neurological involvement in Sap C deficiency is atypical for GD."
    explanation: Explains why saposin C deficiency produces distinct central nervous system biology compared with classic GBA1-related Gaucher disease.

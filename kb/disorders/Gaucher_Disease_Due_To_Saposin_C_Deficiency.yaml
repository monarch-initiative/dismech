- Gaucher disease, variant due to SAP-C deficiency
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Saposin C deficiency is an autosomal recessive lysosomal sphingolipid
      storage disorder impairing glucocerebrosidase-mediated glucosylceramide
      degradation.
    evidence:
    - reference: PMID:41812503
      reference_title: "Repurposing Gaucher disease therapy for Saposin C deficiency: Proof-of-concept with eliglustat."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Saposin C (Sap C) deficiency (GDSAPC, OMIM #610539, ORPHA:309252) is an ultra-rare autosomal recessive disorder caused by mutations in the PSAP gene. Sap C functions as an essential activating cofactor of glucosylceramidase (GCase) and facilitates the degradation of glucosylceramide in the lysosome."
      explanation: Establishes saposin C deficiency as an inherited lysosomal metabolic disorder of glucosylceramide catabolism.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Monogenic autosomal recessive disorder caused by biallelic pathogenic
      variants affecting the saposin C domain or prosaposin precursor encoded
      by PSAP.
    evidence:
    - reference: PMID:35456468
      reference_title: "Phenotype Expansion for Atypical Gaucher Disease Due to Homozygous Missense PSAP Variant in a Large Consanguineous Pakistani Family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Atypical Gaucher disease is caused by variants in the PSAP gene. Saposin C is one of four homologous proteins derived from sequential cleavage of the saposin precursor protein, prosaposin."
      explanation: Confirms PSAP pathogenic variants as the monogenic cause of atypical Gaucher disease due to saposin C deficiency.
  - classification_value: NEUROLOGIC
    notes: >-
      Many patients develop neuronopathic manifestations including myoclonus,
      generalized epileptic seizures, or sensorineural hearing and vestibular
      impairment, sometimes appearing later in adulthood.
    evidence:
    - reference: PMID:41812503
      reference_title: "Repurposing Gaucher disease therapy for Saposin C deficiency: Proof-of-concept with eliglustat."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite improvement in systemic features and a reduction in fatigue, the patient continued to experience frequent myoclonic jerks and generalized epileptic seizures."
      explanation: Documents prominent central nervous system involvement with myoclonic epilepsy and generalized seizures in saposin C deficiency.
  lysosomal_storage_category:
    classification_value: sphingolipidosis
    notes: >-
      Atypical sphingolipidosis in which loss of the saposin C sphingolipid
      activator protein impairs lysosomal glucocerebrosidase-mediated
      glucosylceramide degradation despite intact GBA1-encoded enzyme.
    evidence:
    - reference: PMID:17919309
      reference_title: "Non-neuronopathic Gaucher disease due to saposin C deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Saposin (SAP-) C is required for glucosylceramide degradation, and its deficiency results in a variant form of Gaucher disease."
      explanation: Places saposin C deficiency within the glucosylceramide-accumulating sphingolipidoses.
  icimd_category:
  - classification_value: sphingolipid_degradation
    notes: >-
      ICIMD category 20 ("Disorders of complex molecule degradation"), group
      "Sphingolipid degradation" (sphingolipidoses), encompassing activator-protein
      defects of glucosylceramide catabolism.
    evidence:
    - reference: PMID:38928321
      reference_title: "Deficiency of Glucocerebrosidase Activity beyond Gaucher Disease: PSAP and LIMP-2 Dysfunctions."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Glucocerebrosidase (GCase) is a lysosomal enzyme that catalyzes the breakdown of glucosylceramide in the presence of its activator saposin C (SapC)."
      explanation: Confirms saposin C as an obligatory cofactor in lysosomal sphingolipid (glucosylceramide) degradation.
parents:

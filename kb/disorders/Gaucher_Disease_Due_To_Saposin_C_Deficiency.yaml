- name: Central Nervous System Sphingolipid and Axonal Membrane Homeostasis Disruption
  biological_scale: CELLULAR
  description: >-
    Loss of saposin C in central nervous system neurons disrupts lysosomal
    sphingolipid turnover and axonal membrane homeostasis independently of bulk
    visceral glucosylceramide storage, establishing an intrinsic neuronal
    membrane defect that is not reached by non-brain-penetrant peripheral
    substrate reduction therapy.

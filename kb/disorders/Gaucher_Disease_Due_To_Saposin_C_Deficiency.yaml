treatments:
- name: Substrate Reduction Therapy (Eliglustat / Miglustat)
  description: >-
    Oral glucosylceramide synthase inhibition (off-label eliglustat or
    miglustat) limits de novo glucosylceramide synthesis upstream of the
    saposin-C-dependent degradative block; long-term eliglustat produced
    sustained improvement in hepatosplenomegaly, hematologic cytopenias, bone
    density, and storage biomarkers in adult saposin C deficiency, although
    non-brain-penetrant eliglustat did not control central nervous system
    seizures or myoclonus and prior miglustat trials yielded variable or
    limited benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Substrate Deprivation Therapy
    term:
      id: NCIT:C85876
      label: Substrate Deprivation Therapy
    therapeutic_agent:
    - preferred_term: eliglustat
      term:
        id: CHEBI:82752
        label: eliglustat
    - preferred_term: miglustat
      term:
        id: CHEBI:50381
        label: miglustat
  target_mechanisms:
  - target: Lysosomal Glucosylceramide Accumulation
    treatment_effect: INHIBITS
    description: >-
      Inhibition of glucosylceramide synthase reduces substrate influx into
      macrophage lysosomes, attenuating peripheral glucosylceramide storage
      despite absent saposin C activator.
  evidence:
  - reference: PMID:41812503
    reference_title: "Repurposing Gaucher disease therapy for Saposin C deficiency: Proof-of-concept with eliglustat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As we previously mentioned, standard treatment with enzyme replacement therapy for GD may not be appropriate, but substrate reduction therapy with Eliglustat resulted in a clear response in the systemic manifestations of Sap C deficiency."
    explanation: Demonstrates proof-of-concept systemic efficacy of glucosylceramide synthase substrate reduction therapy in saposin C deficiency.
  - reference: PMID:41812503
    reference_title: "Repurposing Gaucher disease therapy for Saposin C deficiency: Proof-of-concept with eliglustat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In another case, twelve months of miglustat use in an adolescent with Sap C deficiency led to some improvement in neurological symptoms, but no effect was observed on her overall quality of life [21]."
    explanation: Summarizes clinical experience with miglustat substrate reduction therapy in saposin C deficiency.

animal_models:
- name: Saposin C C384S knock-in mouse (Sap-C-/-)
  species: Mouse
  genotype: Psap<tm1Suz>/Psap<tm1Suz> (homozygous C384S in the saposin C domain)
  background: 'involves: 129P2/OlaHsd'
  alleles:
  - Psap<tm1Suz>
  genes:
  - preferred_term: PSAP
    term:
      id: hgnc:9498
      label: PSAP
  publication: PMID:20175216
  description: >-
    A homozygous C384S missense knock-in confined to the saposin C domain of
    prosaposin, plus a compound heterozygote over a null Psap allele
    (Psap<tm2.1Juma>, Psap(-/C384S)) that progresses faster. The design isolates
    loss of the activator from loss of the hydrolase: glucocerebrosidase itself is
    intact and present, and only its in vivo activation is impaired. The result is
    the reason this model is curated here - the mice develop progressive
    neurodegeneration without the glucosylceramide accumulation and organomegaly
    that define human Gaucher disease.
  notes: >-
    MGI annotates this genotype on both MP branches from the same paper - increased
    beta-galactosidase level (MP:0020261, a homeostasis-branch term) alongside
    abnormal enzyme/coenzyme activity (MP:0005584, a metabolism-branch term).
  modeled_mechanisms:
  - target: Saposin C Deficiency from PSAP Variants
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A domain-restricted missense allele that removes saposin C function while
      leaving the remaining saposins and the glucocerebrosidase locus untouched,
      which is the lesion this node describes.
    limitations: >-
      C384S is an engineered allele rather than one of the human PSAP saposin C
      variants, and the mouse phenotype is neurodegenerative rather than visceral,
      so allele-specific severity should not be transferred to patients.
    readouts:
    - name: Motor and behavioral performance
      target: Saposin C Deficiency from PSAP Variants
      direction: DECREASED
      interpretation: >-
        Late-onset, progressive functional decline in animals that were normal in
        early life - the phenotypic consequence of losing the activator.
      evidence:
      - reference: PMID:20175216
        reference_title: A mutation in the saposin C domain of the sphingolipid activator
          protein (Prosaposin) gene causes neurodegenerative disease in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: they developed progressive motor and behavioral deficits after 3
          months of age and the majority of affected mice could scarcely move by about
          15 months
        explanation: Reports the progressive motor phenotype in both saposin C genotypes.
    evidence:
    - reference: PMID:20175216
      reference_title: A mutation in the saposin C domain of the sphingolipid activator
        protein (Prosaposin) gene causes neurodegenerative disease in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We generated two types of saposin C mutant mice, one carrying a homozygous
        missense mutation (C384S) in the saposin C domain of prosaposin (Sap-C(-/-))
        and the other carrying the compound heterozygous mutation with a second null
        Psap allele (Psap(-/C384S)).
      explanation: Establishes that the modelled lesion is saposin C specifically,
        not whole-prosaposin loss, which is what makes the model informative for this
        node.
  - target: Lysosomal Glucosylceramide Accumulation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Neither substrate accumulated in brain or liver and the mice never developed
      organomegaly, so the storage step that defines human Gaucher disease is absent
      in this model despite the activator defect being present.
    limitations: >-
      This is a substantive negative result, not an unmeasured one: glucosylceramide
      and glucosylsphingosine were assayed in brain and liver of both genotypes and
      were not raised, and hepatosplenomegaly never appeared. The pathology that did
      develop - Purkinje cell loss, axonal spheroids, lipofuscin-like deposits - is a
      different lesion from lysosomal glucosylceramide storage, so this model cannot
      be used to study substrate accumulation, substrate-reduction therapy, or
      storage-burden endpoints. It remains informative for the activator defect
      itself (see the link above) and for axonal membrane homeostasis.
    readouts:
    - name: Brain and liver glucosylceramide and glucosylsphingosine content
      target: Lysosomal Glucosylceramide Accumulation
      direction: UNCHANGED
      interpretation: >-
        The measurement that fails the node. Substrate was looked for in the two
        tissues where it would be expected and was not found.
      evidence:
      - reference: PMID:20175216
        reference_title: A mutation in the saposin C domain of the sphingolipid activator
          protein (Prosaposin) gene causes neurodegenerative disease in mice.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: No accumulation of glucosylceramide and glucosylsphingosine was detected
          in the brain or liver of both Sap-C(-/-) and Psap(-/C384S) mice.
        explanation: Directly reports the absent substrate accumulation in both saposin
          C genotypes.
    - name: Hepatosplenomegaly
      target: Lysosomal Glucosylceramide Accumulation
      direction: UNCHANGED
      interpretation: >-
        The visceral storage phenotype of human Gaucher disease is absent across the
        animals' lifespan.
      evidence:
      - reference: PMID:20175216
        reference_title: A mutation in the saposin C domain of the sphingolipid activator
          protein (Prosaposin) gene causes neurodegenerative disease in mice.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: They showed no signs of hepatosplenomegaly throughout their lives.
        explanation: Documents the absent visceral phenotype over the full lifespan.
    evidence:
    - reference: PMID:20175216
      reference_title: A mutation in the saposin C domain of the sphingolipid activator
        protein (Prosaposin) gene causes neurodegenerative disease in mice.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: No accumulation of glucosylceramide and glucosylsphingosine was detected
        in the brain or liver of both Sap-C(-/-) and Psap(-/C384S) mice.
      explanation: The negative substrate measurement is the basis for recording this
        link as FAILS_TO_RECAPITULATE rather than omitting it.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The duplication co-segregates fully with dominant hearing loss in five affected and three unaffected family members."
    explanation: Full dominant co-segregation of the exon 28 duplication in the Israeli family.
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband (PID IV-7) presented at age 13 years with a progressive, sloping, bilateral SNHL and a family history consistent with autosomal dominant inheritance."
    explanation: The dominant family history in the discovery kindred.
  - reference: PMID:41007806
    reference_title: "Unraveling the Functional Impact of Splicing Variants in Inherited Hearing Disorders Through Minigene Splicing Assays."
    supports: SUPPORT

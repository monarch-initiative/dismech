    explanation: The allelic spectrum converges on the C-terminal region.
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNA studies verified in silico predictions, revealing the retention of 153 bp of intron in the 3' UTR of several ATP11A isoforms."
    explanation: Experimental confirmation of the splicing consequence of the Newfoundland allele.
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the insertion is predicted to extend exon 28 by 8 bp, including the 2 intronic nucleotides (gt), followed by the 6 last exonic nucleotides (GTCCAG), leading to a frame shift at amino acid 1110 (82 amino acids before the end of the protein) and a stop codon 43 amino acids downstream, p.Asn1110Valfs43Ter"
    explanation: The C-terminal truncation produced by the recurrent Israeli allele.
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "As the C-terminus region of ATP11A has been shown to be critical for Ca2+-dependent endocytosis or polarized localization at the plasma membrane"
    explanation: >-
      Why a C-terminal lesion is functionally consequential even when the transport domains
      are intact. Graded COMPUTATIONAL because the sentence introduces the authors'
      AlphaFold modelling of the wild-type and mutant tails.
  - reference: PMID:42371110
    reference_title: Integrative genetic and functional analysis of autosomal dominant hearing loss in 108 multigenerational families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants located outside the coding regions of MANE select transcripts may disrupt coding exons in alternative isoforms, which could be relevant for inner ear function."
    explanation: The interpretation trap specific to this gene's disease alleles.
  - reference: PMID:41007806
    reference_title: "Unraveling the Functional Impact of Splicing Variants in Inherited Hearing Disorders Through Minigene Splicing Assays."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "selection of a cryptic splice site that causes partial intron retention was seen in ATP11A and OTOF (c.5533+12G>T) cases"
    explanation: >-
      Minigene confirmation that the ATP11A allele activates a cryptic donor site and
      retains part of the intron. The earlier version of this item quoted the sentence-level
      result for c.1221+5G>C and stopped mid-token at the typographic prime in "5'ss"; that
      quote was not propositional and its stated justification (validator normalisation of
      the prime glyph) is not documented in conf/reference_validator_config.yaml. This
      quote is the authors' summary of the same result, contains no prime character and
      names ATP11A explicitly.
- name: Loss of Phosphatidylserine Flippase Activity
  description: >-
    ATP11A is a class-6 P4-ATPase whose substrate specificity is for phosphatidylserine and
    phosphatidylethanolamine. The AUNA2 deletion allele was tested directly and the
    C-terminally altered protein lost flippase activity for phosphatidylserine, and the
    2026 multi-family analysis reads the whole allelic series the same way. Whether the
    heterozygous state acts by haploinsufficiency or by dominant-negative interference with
    wild-type protein is stated as unresolved by the discovery paper and is not settled
    here.
  biological_scale: MOLECULAR
  molecular_functions:

- discussion_id: atp11a_ps_exposure_druggability
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is phosphatidylserine actually externalised on cochlear cells in ATP11A-related hearing
    loss, and would blocking the resulting phagocytic signal preserve hearing?
  attaches_to:
  - pathophysiology#Loss of Plasma Membrane Phospholipid Asymmetry
  - treatments#
  rationale: >-
    The discovery paper's therapeutic proposal has two links, and only the first is
    established. That ATP11A flips phosphatidylserine inward, and that a disease allele
    abolishes that activity, is demonstrated. That the consequence in the cochlea is surface
    phosphatidylserine marking hair cells or spiral ganglion neurons for phagocytic
    clearance is an inference from general phospholipid biology - no cochlear
    phosphatidylserine-exposure measurement has been reported in any ATP11A model, human or
    animal.

    The proposal is nonetheless worth recording, because unlike most deafness genes it names
    a druggable intermediate rather than requiring gene replacement: surface
    phosphatidylserine has established pharmacological ligands. The experiment that would
    move this from proposal to hypothesis is a direct one - stain cochlear or hair-cell
    membranes from an ATP11A model for outer-leaflet phosphatidylserine and ask whether it
    is increased. The zebrafish mutants and the conditional mouse both exist and neither has
    been used this way.
  evidence:
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."

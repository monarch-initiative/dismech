    explanation: Convergence of the allelic series onto one functional lesion.
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is likely that pathogenic splicing variants act via dominant-negative or haploinsufficiency mechanism."
    explanation: >-
      The authors leave the dominance mechanism open; this entry records the flippase
      deficit without committing to which of the two produces it.
- name: Loss of Plasma Membrane Phospholipid Asymmetry
  description: >-
    Eukaryotic plasma membranes hold phosphatidylserine and phosphatidylethanolamine on the
    inner leaflet, an asymmetry that is generated and maintained by ATP-dependent flipping
    and that underpins membrane potential, curvature, stability and domain organisation.
    Losing ATP11A flipping is expected to leave phosphatidylserine on the outer leaflet.

    The downstream consequence proposed by the discovery paper is that exposed
    phosphatidylserine is the canonical "eat me" signal, marking the cell for recognition
    and phagocytic clearance. That step is a mechanistic proposal drawn from general
    phospholipid biology and has not been demonstrated in cochlear tissue, which is why it
    is carried in this node's description and in the therapeutic knowledge gap rather than
    as its own asserted node.

name: Hearing Loss Autosomal Dominant 84
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- DFNA84
- deafness, autosomal dominant 84
- ATP11A-related hearing loss
- autosomal dominant deafness-84
description: >-
  DFNA84 is dominantly inherited, postlingual, slowly progressive bilateral sensorineural
  hearing loss caused by heterozygous variants in ATP11A, a class-6 P4-ATPase that flips
  phosphatidylserine and phosphatidylethanolamine from the outer to the inner leaflet of
  the plasma membrane. It is the first Mendelian phenotype attributed to this flippase.

  Two things make the entry worth curating beyond "another DFNA locus". The first is
  where the variants sit. Every reported disease allele affects the C-terminal region or
  the 3' end of the gene rather than the catalytic core - a cryptic-splice-site
  substitution retaining 153 bp of intron in the 3' UTR, an 8 bp duplication at the exon
  28 boundary producing p.Asn1110Valfs43Ter, a 5.5 kb deletion removing the last coding
  exon, a further 3' UTR deletion of more than 5 kb, and a +5 splice-donor variant
  activating a cryptic site in intron 12. Several of these lie outside the coding sequence
  of the MANE select transcript and are only interpretable once alternative ATP11A
  isoforms are considered, which is why in silico pipelines anchored on MANE missed them.
  Functionally the alleles converge: the mammalian P4-ATPase C-terminus governs folding,
  activity and localisation, and the AUNA2 deletion allele was shown directly to abolish
  phosphatidylserine flippase activity.

  The second is that the same gene produces two clinically distinguishable auditory
  phenotypes. The Newfoundland and Israeli families have nonsyndromic sensorineural
  hearing loss (DFNA84); a large German family with a 5.5 kb deletion has autosomal
  dominant auditory neuropathy type 2 (AUNA2), in which outer hair cell amplification is
  preserved and it is sound encoding by inner hair cells and auditory nerve fibres that
  fails. Atp11a is expressed in auditory nerve fibres, their synaptic contacts and the
  cochlear nucleus in mice, and it is also a Deiters cell defining gene in the organ of
  Corti - so the gene sits on both sides of the hair cell/neuron divide, which is a
  plausible substrate for the split presentation rather than an explanation for it.

  The disease mechanism is explicitly unresolved in the primary literature. Haploinsufficiency
  and dominant negative action are both on the table, the C-terminally altered protein is
  made rather than simply lost, and homozygous Atp11a deletion is embryonic lethal in mice
  so the null is not the human situation. What is established is the phenotype: slow
  progression with onset typically in the first or second decade, high frequencies worst,
  with marked intrafamilial variability in onset, configuration and symmetry.

  There is a specific therapeutic hook. If loss of flipping leaves phosphatidylserine
  exposed on the outer leaflet, the affected cells carry a phagocytic "eat me" signal, and
  surface phosphatidylserine is an established pharmacological target - so the discovery
  paper argues ATP11A hearing loss could in principle be druggable. That is a proposal,
  not a result, and is curated here as a knowledge gap rather than as a treatment.

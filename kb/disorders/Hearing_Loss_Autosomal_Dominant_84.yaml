    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Phagocytic signals such as PS at the cell surface are known pharmaceutical targets"
    explanation: >-
      The druggability half of the proposal. Marked INDIRECT because it is a statement about
      phosphatidylserine as a target class generally, not about the cochlea.

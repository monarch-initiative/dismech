- name: Cochlear Hair Cell and Supporting Cell Dysfunction
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult"
  description: >-
    ATP11A is expressed in the sensory epithelium of the organ of Corti. Single-cell and
    long-read RNA-seq places the murine Atp11a exon corresponding to the short human
    ATP11A-203 isoform in inner hair cells, outer hair cells and Deiters cells, and
    identifies Atp11a as a Deiters cell defining gene with a marked postnatal rise in
    expression - a timing that fits a postlingual, progressive disease rather than a
    developmental one.

    The direct structural evidence is from zebrafish rather than from human cochlea:
    loss-of-function atp11a mutants have reduced stereocilia counts across four of the five
    larval otic sensory patches and fewer hair cells in one lateral-line neuromast.

    Conformance to the sensorineural hair cell loss module is asserted at that module's
    sensory-epithelium-insult node and not at its mechanotransduction-failure-and-death
    node, because no study has shown hair-cell mechanotransduction failure or hair-cell
    death for any ATP11A allele; the zebrafish result is a structural stereocilia count.
    Nothing links ATP11A to the module's ionic-homeostasis and oxidative-stress node
    either, so that step is left out rather than assumed.

    Of the two biological processes the module node carries, only GO:0007605 is reproduced
    here. GO:0050910, detection of mechanical stimulus involved in sensory perception of
    sound, is deliberately omitted for the same reason the conformance target is the insult
    node rather than the mechanotransduction node: no ATP11A study demonstrates a
    mechanotransduction defect. The single observation in the vicinity is a Yo-Pro-1
    uptake difference in one zebrafish lateral-line neuromast, which the authors themselves
    read as either cell loss or loss of mechanotransduction capacity without deciding
    between them, and which is not a cochlear hair cell.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: ABNORMAL

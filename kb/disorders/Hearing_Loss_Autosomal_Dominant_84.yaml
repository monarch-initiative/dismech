discussions:
- discussion_id: atp11a_dominance_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does a heterozygous C-terminal ATP11A allele cause hearing loss by halving flippase
    dose, or by the altered protein interfering with the wild-type protein?
  attaches_to:
  - pathophysiology#Loss of Phosphatidylserine Flippase Activity
  - pathophysiology#ATP11A C-Terminal and 3' Region Variants
  rationale: >-
    Every reported allele leaves a protein that is made and C-terminally altered rather than
    absent, and the C-terminus is where folding, activity regulation and localisation are
    controlled. That is the classic setup for dominant-negative action, but it is equally
    compatible with the altered protein being degraded and the phenotype reflecting
    haploinsufficiency. The discovery paper names both possibilities and chooses neither.

    The question is not academic. If the mechanism is haploinsufficiency, dose restoration -
    gene addition or upregulation of the wild-type allele - is the therapeutic route. If it
    is dominant-negative, adding wild-type protein may not help and allele-specific
    silencing is needed instead. The available models do not settle it: the mouse null is
    embryonic lethal, the conditional knockout is a null in the targeted cells, and the
    zebrafish alleles are coding loss-of-function rather than C-terminal. A model carrying a
    knock-in of a patient C-terminal allele in the heterozygous state is the missing
    reagent.
  evidence:
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease mechanism, how variants in the ATP11A gene cause hearing loss, is unclear."
    explanation: The authors state the gap directly.

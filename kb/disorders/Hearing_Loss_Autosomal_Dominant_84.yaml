genetic:
- name: ATP11A
  notes: >-
    ATP11A (13q34) encodes a class-6 P4-ATPase phospholipid flippase specific for
    phosphatidylserine and phosphatidylethanolamine. It is ubiquitously expressed and
    homozygous deletion is embryonic lethal in mice, so the human heterozygous disease state
    is not modelled by the null. Seventeen transcripts are annotated and the disease alleles
    are distributed across them, which is why isoform-aware interpretation matters here more
    than for most deafness genes.
  gene_term:
    preferred_term: ATP11A
    term:
      id: hgnc:13552
      label: ATP11A
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this study documents the first association of ATP11A with a highly penetrant Mendelian phenotype"
    explanation: Establishes ATP11A as a Mendelian deafness gene.
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The ATP11A protein specifically transports phosphatidylserine (PS) and phosphatidylethanolamine (PE) across cell membranes, is ubiquitously expressed in various tissues and deletion of in atp11a in mice results in lethality during embryogenesis"
    explanation: >-
      Substrate specificity, expression breadth, and the embryonic lethality of the mouse
      null that constrains which model systems can address the heterozygous disease.
diagnosis:
- name: Isoform-aware genome or exome sequencing
  description: >-
    Molecular diagnosis requires an analysis that does not stop at the MANE select
    transcript. Two of the reported alleles sit in the 3' UTR of the MANE transcript and
    were assigned significance only after the short and long ATP11A isoforms were
    considered, and one was passed over by in silico splicing prediction entirely. Linkage
    or haplotype reduction in a large kindred remains a practical way to shrink the
    candidate list before this analysis.
  evidence:
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the complexity in genomes, a comprehensive bioinformatics pipeline targeting all known transcripts is essential as is the need to experimentally validate in silico predictions in patient-derived tissues."
    explanation: The authors' explicit methodological conclusion, which is the diagnostic recommendation.
  - reference: PMID:42371110
    reference_title: Integrative genetic and functional analysis of autosomal dominant hearing loss in 108 multigenerational families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In silico analysis also did not predict its impact on splicing."
    explanation: A reported disease allele that prediction tools scored as benign.
- name: Minigene splicing assay for candidate ATP11A splice alleles
  description: >-
    Because the recurrent finding is a non-canonical splice-region variant of uncertain
    significance, an in vitro splicing assay is the step that converts a prediction into
    evidence. Minigene assays have been applied to two ATP11A alleles - one confirming that
    the exon 28 duplication adds 8 bp without disturbing the splice pattern, the other
    confirming that c.1221+5G>C activates a cryptic donor. Note the limitation the authors
    themselves raise: a minigene reports on a construct, not on the patient's tissue.
  evidence:
  - reference: PMID:41007806
    reference_title: "Unraveling the Functional Impact of Splicing Variants in Inherited Hearing Disorders Through Minigene Splicing Assays."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The functional studies with minigene assays confirmed this observation and showed that the tested variants induced both exon skipping and activation"
    explanation: The assay converts predicted splicing effects into demonstrated ones.
  - reference: PMID:41007806
    reference_title: "Unraveling the Functional Impact of Splicing Variants in Inherited Hearing Disorders Through Minigene Splicing Assays."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "results obtained from minigene assays should be interpreted with caution and ideally validated using patient-derived RNA"
    explanation: The authors' own caveat on the assay's standing as evidence.

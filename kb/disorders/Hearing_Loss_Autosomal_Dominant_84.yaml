notes: >-
  Literature base. A PubMed sweep run on 2026-09-04 for ATP11A crossed with hearing loss,
  deafness, auditory, cochlea, DFNA84 and 13q34 returns six ATP11A hearing-loss reports,
  all of which are cited here, plus PMID:28601886, the pre-gene clinical description of the
  AUNA2 family, which was added to the AUNA2 subtype as a result. "DFNA84" as a query
  string returns nothing indexed. A falcon deep-research report was also generated and is
  committed at research/Hearing_Loss_Autosomal_Dominant_84-deep-research-falcon.md. It
  introduced no reference the entry was missing: every indexed source in its citation list
  resolves to a paper already cited here - the Research Square preprint
  DOI:10.21203/rs.3.rs-530835/v1 is the preprint of PMID:35278131, and its remaining DOIs
  are PMID:36300302, PMID:37671045, PMID:40223426 and PMID:41007806. Its only other two
  sources are unindexed dissertations (von Loh 2021; Pater 2019) with no PMID or DOI. The
  manual sweep and the retrieval pass therefore agree that the citable literature base is
  complete, which is a stronger statement of completeness than either check alone. One
  preflight warning on that report is a false positive worth recording, because it will
  recur for every audiology entry curated from a deep-research report: preflight-dr flags
  "ABR" as a rival gene symbol - hgnc:81 is a real gene called ABR - but every occurrence
  of ABR in this report and in this entry is the auditory brainstem response. The report also
  suggests GO:0004012, which is obsolete and replaced by GO:0140326; it was treated as a
  lead and not bound, and this entry binds GO:0140346, GO:0140331, GO:0097035 and
  GO:0005886 instead.

  GeneReviews. PMID:20301607, the Genetic Hearing Loss Overview, is cached and is tagged
  GeneReviews in sibling hearing-loss entries, but it is deliberately not tagged here. Its
  cached record is abstract-only - the body is the chapter's six-point statement of scope
  and nothing more - and contains no occurrence of ATP11A, DFNA84 or AUNA2, so tagging it
  would produce a tagged-but-not-mined reference. There is no ATP11A-specific GeneReviews
  chapter; the entity was first described in 2022. This paragraph records the negative so
  it is auditable rather than looking like an omission.

  AUNA2 and kb/disorders/Auditory_Neuropathy.yaml. The AUNA2 subtype below is also carried
  as a subtype of Auditory_Neuropathy, bound to the same MONDO:0957279 term and citing the
  same PMID:36300302 finding. That is deliberate overlap along two different axes - this
  entry groups by gene and allelic mechanism, Auditory_Neuropathy groups by the
  audiological presentation - and neither is a duplicate of the other. If the two are ever
  reconciled, the gene-side pathophysiology lives here and the audiological
  differential lives there.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous ATP11A variants segregating with hearing loss over multiple generations.
    In the Israeli families the exon 28 duplication co-segregated fully across five
    affected and three unaffected members; in the Newfoundland kindred linkage to 13q34
    reached a LOD of 4.77 under a dominant model. Penetrance is high but expressivity is
    variable, and at least one report describes obligate young adult carriers who are not
    yet symptomatic.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

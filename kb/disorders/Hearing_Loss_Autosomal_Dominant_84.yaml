  description: >-
    A large German family carrying a 5.5 kb ATP11A deletion presents instead as auditory
    synaptopathy/neuropathy: outer hair cell cochlear amplification is preserved while
    sound encoding by inner hair cells and/or auditory nerve fibres is disrupted. Curated
    here as a subtype of the same gene-disease entity rather than as a separate disease
    because the causal allele class, the locus and the flippase mechanism are shared; the
    difference is which cochlear compartment carries the deficit.

    The clinical course was described in this family six years before the gene was found:
    first symptoms in the second decade, moderate hearing loss by the fourth decade, and
    profound impairment in the older members, with no involvement of other organ systems.
    The same study excluded the AUNA1 locus and mapped the family to 13q34 (and 12q24),
    which is the linkage result the later whole-genome sequencing resolved to ATP11A.

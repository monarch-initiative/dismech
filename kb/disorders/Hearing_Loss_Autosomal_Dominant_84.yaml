    snippet: "Atp11a was identified as a Deiter cell defining gene that exhibits moderate expression during mouse embryonic development, followed by a marked increase in expression after birth"
    explanation: >-
      Cell-type expression and its postnatal timing in mouse cochlea, which is the
      expression basis for locating the lesion in the organ of Corti.
  - reference: PMID:40223426
    reference_title: The P4-phospholipid flippase Atp11a is required for maintenance of eye and ear structure in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A reduction in stereocilia number, as evidenced by phalloidin staining, was observed in the medial crista, posterior crista, posterior macula and anterior macula of homozygous atp11a mutants"
    explanation: Structural hair-bundle deficit on loss of the orthologue.
- name: Auditory Nerve and Spiral Ganglion Dysfunction
  description: >-
    In the AUNA2 presentation the deficit is neural rather than in the cochlear amplifier.
    Atp11a is expressed in auditory nerve fibres, their synaptic contacts and the cochlear
    nucleus in mice, and conditional Atp11a knockout mice show a progressive fall in the
    spiral ganglion neuron compound action potential. This is the pathophysiological branch
    that separates the AUNA2 subtype from the nonsyndromic DFNA84 presentation; both derive
    from the same flippase deficit and it is not known what determines which one a given
    family develops.

    This node deliberately does not declare conformance to the sensorineural hair cell loss
    module's "Cochlear Amplification Loss and Spiral Ganglion Neuron Degeneration" node.
    That module node derives spiral ganglion degeneration from hair-cell loss and lost
    cochlear amplification; in AUNA2 outer hair cell amplification is explicitly preserved
    and the neural deficit is primary, so conforming here would assert the opposite of what
    the source reports.

- name: High-Frequency Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    High frequencies are worst affected, with low and mid frequencies relatively preserved
    early. Two Israeli probands had normal hearing to 1 kHz with a sloping high-frequency
    loss above it; a further reported proband had moderate-to-severe symmetric loss

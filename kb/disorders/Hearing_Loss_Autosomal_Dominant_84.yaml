pathophysiology:
- name: ATP11A C-Terminal and 3' Region Variants
  description: >-
    Every established disease allele disturbs the C-terminal region or the 3' end of ATP11A
    rather than its catalytic core. The Newfoundland allele (chr13:113534963G>A) creates a
    cryptic donor site that retains 153 bp of intron in the 3' UTR; the Israeli allele
    c.3322_3327+2dupGTCCAGGT extends exon 28 by 8 bp and truncates the protein 82 residues
    before its normal end; the German AUNA2 allele deletes 5.5 kb spanning the last coding
    exon; and a fourth family carries a further 3' UTR deletion of more than 5 kb. One
    further allele, c.1221+5G>C, activates a cryptic donor 44 bp into intron 12 and is the
    exception on both counts - it lies in the middle of the gene rather than the 3' region,
    and it is a variant of uncertain significance rather than an established DFNA84 allele.
    It is listed here because the minigene result below is real, not because it extends the
    C-terminal pattern.

    Two curation-relevant points follow. First, several alleles do not touch the coding
    sequence of the MANE select transcript at all and are only interpretable against
    alternative ATP11A isoforms, so a MANE-anchored pipeline scores them benign. Second,
    the C-terminal region of a mammalian P4-ATPase is not inert: it governs folding,
    activity regulation, and calcium-dependent endocytosis or polarised plasma-membrane
    localisation, so a shortened and differently charged tail is a plausible functional
    lesion even where the transport domains are intact.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ATP11A
    term:
      id: hgnc:13552
      label: ATP11A
  downstream:

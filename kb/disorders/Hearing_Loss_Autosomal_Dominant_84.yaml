    explanation: >-
      Expression in the auditory nerve plus a conditional knockout that reproduces the
      progressive neural deficit.
phenotypes:
- name: Progressive Bilateral Sensorineural Hearing Loss
  category: Auditory
  description: >-
    The defining feature: bilateral sensorineural hearing loss that worsens over time.
    Progression is slow, and severity within a single family at a comparable age varies
    widely - the discovery paper compares six relatives all in their third decade with
    markedly different thresholds.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  notes: >-
    Graded OBLIGATE because it is definitional for the entity rather than because a
    proportion was counted: DFNA84 is diagnosed by an ATP11A variant segregating with
    dominant progressive SNHL, so an unaffected carrier is recorded as non-penetrant rather
    than as an affected individual lacking the feature.
  evidence:
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Splice variants in the 3' region of ATP11A cause a bilateral, progressive SNHL with variable onset and configuration."
    explanation: The authors' summary of the phenotype across all three of their families.
  - reference: PMID:41007806
    reference_title: "Unraveling the Functional Impact of Splicing Variants in Inherited Hearing Disorders Through Minigene Splicing Assays."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATP11A is associated with autosomal dominant deafness-84 (DFNA84; MIM #619810), an NSHL form, characterized by a slow progression, typically with onset in the first or second decade of life."
    explanation: >-

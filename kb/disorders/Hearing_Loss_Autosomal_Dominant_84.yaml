- discussion_id: dfna33_locus_disposition
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the historical DFNA33 locus the same entity as DFNA84, or was the original mapping
    wrong?
  attaches_to:
  - disease#Hearing Loss Autosomal Dominant 84
  rationale: >-
    The discovery kindred for DFNA84 linked to 13q34, the interval mapped in 2009 as DFNA33
    in a German family, and the discovery paper closes by saying the original DFNA33 family
    should be sequenced to settle whether ATP11A is DFNA33. That was attempted. A member of
    the original family was genome-sequenced; the ATP11A variant found was deep intronic and
    spliced normally, and re-examination of the published haplotypes turned up two double
    recombination events and one triple - a pattern the authors read as genotyping error
    rather than biology.

    So the disposition of DFNA33 is unresolved in a specific way that matters for this entry:
    the shared 13q34 coordinates are not evidence that DFNA33 and DFNA84 are one disease,
    and DFNA84 should be treated as resting on its own families rather than inheriting the
    DFNA33 kindred's phenotype description. Nothing here casts doubt on ATP11A as the DFNA84
    gene.
  evidence:
  - reference: PMID:37671045
    reference_title: Unraveling haplotype errors in the DFNA33 locus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The DFNA33 locus was mapped in 2009 and coincidentally contains ATP11A, a gene recently associated with autosomal dominant hearing loss and auditory neuropathy type 2."
    explanation: The coincidence of coordinates that prompted the re-analysis.
  - reference: PMID:37671045
    reference_title: Unraveling haplotype errors in the DFNA33 locus.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a deep intronic variant in ATP11A that showed evidence of functionally normal splicing."
    explanation: >-
      Refutes the proposal that ATP11A is the DFNA33 gene, at least via the variant found in
      the re-ascertained family member.
  - reference: PMID:37671045
    reference_title: Unraveling haplotype errors in the DFNA33 locus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we re-assessed haplotypes from the originally published DFNA33 family and identified two double recombination events and one triple recombination event in the pedigree, a highly unlikely occurrence, especially at this scale"
    explanation: The evidence that the original DFNA33 interval itself is unreliable.
  - reference: PMID:35278131
    reference_title: "Autosomal dominant non-syndromic hearing loss maps to DFNA33 (13q34) and co-segregates with splice and frameshift variants in ATP11A, a phospholipid flippase gene."
    supports: SUPPORT

    term:
      id: hgnc:289
      label: GRK2
  description: >
    A very rare form caused by biallelic loss-of-function variants in GRK2, encoding a
    kinase that phosphorylates ciliary Smoothened to activate Hedgehog signaling. Unlike
    the IFT and dynein forms, cilia morphology is intact; disease results from impaired
    cilia-based Hedgehog and Wnt signaling without structural IFT defects. Reported in a
    single case in 2024; replication in additional families is needed.
  evidence:
  - reference: PMID:38585547
    reference_title: >-
      Reanalysis of Whole-Exome Sequencing Data of an Infant with Suspected Diagnosis of Jeune
      Syndrome Revealed a Likely Pathogenic Variant in GRK2: A Newly Associated Gene for Jeune
      Syndrome Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired function of GRK2 compromises cilia-based signaling of Hedgehog pathway as well as Wnt signaling, while cilia morphology remains intact"
    explanation: >-
      Establishes the non-structural, signaling-only mechanism that distinguishes this
      subtype from the IFT and dynein forms.

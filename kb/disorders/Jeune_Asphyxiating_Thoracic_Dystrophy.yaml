name: Jeune Asphyxiating Thoracic Dystrophy
creation_date: '2026-02-13T00:31:42Z'
category: Mendelian
description: >
  Jeune asphyxiating thoracic dystrophy (JATD), also known as Jeune syndrome,
  is an autosomal recessive skeletal ciliopathy characterized by a narrow, bell-shaped
  thorax with short ribs leading to respiratory insufficiency. It is genetically
  heterogeneous. Most causal genes encode components of the intraflagellar
  transport machinery -- the anterograde IFT-B particle, the retrograde IFT-A
  particle, and the dynein-2 motor -- or the centriolar proteins required to
  build the cilium at all. Two exceptions are recorded here: GRK2, which leaves
  cilium morphology intact and fails only at ciliary Hedgehog and Wnt signal
  transduction, and FGF4, a secreted growth factor with no ciliary transport
  role. The pathophysiology nodes below are organized by that complex membership,
  because the complex a gene belongs to is what determines which step fails.
  Additional features include short limbs, polydactyly, renal cystic
  disease, hepatic fibrosis, and retinal dystrophy. JATD represents the mildest
  end of the short-rib polydactyly syndrome spectrum. Gene-defined subtypes are
  curated below against the MONDO short-rib thoracic dysplasia (SRTD) numbered
  series, which MONDO files under this term; the one exception is SRTD9, the
  IFT140 form, which is curated on the dedicated
  IFT140-related_Recessive_Ciliopathy entry and is deliberately not bound twice.

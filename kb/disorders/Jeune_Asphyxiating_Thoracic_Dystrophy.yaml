- name: Dynein Motor Complex Deficiency
  description: >
    Mutations in DYNC2H1 (most common cause) and in the other dynein-2 subunits
    -- the intermediate chains DYNC2I1 (WDR60) and DYNC2I2 (WDR34), the light

    disrupt the motor that powers retrograde intraflagellar transport, which is
    essential for cilium function and Hedgehog signal transduction in developing
    cartilage and other tissues. The chain assignments follow the HGNC gene
    names for these symbols (dynein 2 intermediate chain 1 and 2, dynein
    cytoplasmic 2 light intermediate chain 1, dynein light chain Tctex-type 2B)
    together with the two subunit descriptions quoted below.

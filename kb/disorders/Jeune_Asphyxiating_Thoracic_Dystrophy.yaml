      label: IFT140
  association: Causative
  relationship_type: CAUSATIVE
  subtype: IFT140-associated
  notes: >
    Biallelic mutations in IFT140, encoding a component of the IFT-A
    complex involved in retrograde intraflagellar transport. The
    corresponding MONDO concept, short-rib thoracic dysplasia 9, is

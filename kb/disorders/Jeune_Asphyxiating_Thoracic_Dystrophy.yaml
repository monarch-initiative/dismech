- name: Intraflagellar Transport Dysfunction
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  description: >
    Loss of subunits of the anterograde IFT-B particle (IFT80, IFT172, IFT74,
    IFT81) disrupts transport of cargo towards the ciliary tip. This impairs
    ciliary assembly, maintenance, and signaling, particularly Hedgehog pathway
    transduction required for skeletal development. The genes bound here are the
    IFT-B subunits; the retrograde IFT-A adaptor and the dynein-2 motor that
    returns cargo to the ciliary base are modeled as separate nodes, because the
    complex a gene belongs to is what determines which transport direction fails.

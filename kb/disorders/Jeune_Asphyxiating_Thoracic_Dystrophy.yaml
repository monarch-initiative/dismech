- name: DYNC2H1-associated
  display_name: DYNC2H1-associated JATD (SRTD3)
  subtype_term:
    preferred_term: asphyxiating thoracic dystrophy 3
    term:
      id: MONDO:0013127
      label: asphyxiating thoracic dystrophy 3
  genes:
  - preferred_term: DYNC2H1
    term:
      id: hgnc:2962
      label: DYNC2H1
  description: >
    The most common genetic form, accounting for 33-59% of families. Caused by biallelic
    mutations in DYNC2H1, the dynein-2 heavy chain that provides the motor ATPase of the
    retrograde intraflagellar transport machinery. Characterized by predominantly skeletal
    involvement with limited extra-skeletal features: polydactyly, renal cysts, and
    retinal dystrophy are rare or absent. Corresponds to short-rib thoracic dysplasia 3
    (SRTD3).
  evidence:
  - reference: PMID:23456818
    reference_title: "Exome sequencing identifies DYNC2H1 mutations as a common cause of asphyxiating thoracic dystrophy (Jeune syndrome) without major polydactyly, renal or retinal involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DYNC2H1 patients largely lacked significant extra-skeletal involvement,
      demonstrating an important genotype-phenotype correlation in JATD.
    explanation: >-
      Supports the predominantly skeletal presentation that distinguishes this
      subtype from the IFT-A-associated forms.
- name: IFT80-associated
  display_name: IFT80-associated JATD (SRTD2)
  subtype_term:
    preferred_term: asphyxiating thoracic dystrophy 2
    term:
      id: MONDO:0012644
      label: asphyxiating thoracic dystrophy 2
  genes:
  - preferred_term: IFT80
    term:
      id: hgnc:29262
      label: IFT80
  description: >
    The first genetically defined JATD subtype, caused by biallelic mutations in IFT80,
    a subunit of the anterograde IFT-B complex. A rare cause, reported in two of
    39 families (5%) in one clinical and molecular series. Corresponds to
    short-rib thoracic dysplasia 2 (SRTD2).
  evidence:
  - reference: PMID:17468754
    reference_title: "IFT80, which encodes a conserved intraflagellar transport protein, is mutated in Jeune asphyxiating thoracic dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that IFT80 mutations underlie a subset of Jeune asphyxiating
      thoracic dystrophy cases, establishing the first association of a
      defective intraflagellar transport (IFT) protein with human disease.
    explanation: >-
      Establishes IFT80 as the first JATD gene and the first IFT protein linked
      to human disease.
  - reference: PMID:23339108
    reference_title: "Asphyxiating thoracic dysplasia: clinical and molecular review of 39 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified DYNC2H1 mutations in 23 families (59%) and IFT80
      mutations in two families (5%).
    explanation: >-
      Source for the two-of-39-families share quoted in this subtype description.
- name: TTC21B-associated
  display_name: TTC21B-associated JATD (SRTD4)
  subtype_term:
    preferred_term: asphyxiating thoracic dystrophy 4
    term:
      id: MONDO:0013441
      label: asphyxiating thoracic dystrophy 4
  genes:
  - preferred_term: TTC21B
    term:
      id: hgnc:25660
      label: TTC21B
  description: >
    Caused by biallelic mutations in TTC21B, which encodes the retrograde IFT-A
    complex protein IFT139. The same gene also causes isolated nephronophthisis,
    so the JATD presentation is the syndromic end of a single allelic spectrum.
    Corresponds to short-rib thoracic dysplasia 4 (SRTD4).
  evidence:
  - reference: PMID:21258341
    reference_title: TTC21B contributes both causal and modifying alleles across the ciliopathy spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations in TTC21B, which encodes the retrograde intraflagellar transport
      protein IFT139, cause both isolated nephronophthisis and syndromic Jeune
      asphyxiating thoracic dystrophy
    explanation: >-
      Establishes TTC21B as causal for JATD and identifies its IFT-A/IFT139
      identity and the shared allelic spectrum with nephronophthisis.
- name: WDR19-associated
  display_name: WDR19-associated JATD (SRTD5)
  subtype_term:
    preferred_term: asphyxiating thoracic dystrophy 5
    term:
      id: MONDO:0013717
      label: asphyxiating thoracic dystrophy 5
  genes:
  - preferred_term: WDR19
    term:
      id: hgnc:18340
      label: WDR19
  description: >
    Caused by biallelic mutations in WDR19, which encodes the IFT-A complex subunit
    IFT144 required for retrograde ciliary transport. The same gene causes
    Sensenbrenner (cranioectodermal dysplasia) syndrome and isolated
    nephronophthisis; the reported Jeune family also had a nephronophthisis-like
    nephropathy. Corresponds to short-rib thoracic dysplasia 5 (SRTD5).
  evidence:
  - reference: PMID:22019273
    reference_title: Ciliopathies with skeletal anomalies and renal insufficiency due to mutations in the IFT-A gene WDR19.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a Dutch family with the clinically overlapping Jeune syndrome, a
      homozygous missense mutation in the same gene was found.
    explanation: >-
      Reports a biallelic WDR19 mutation in a family with Jeune syndrome.
  - reference: PMID:22019273
    reference_title: Ciliopathies with skeletal anomalies and renal insufficiency due to mutations in the IFT-A gene WDR19.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WDR19 encodes IFT144, a member of the intraflagellar transport (IFT)
      complex A that drives retrograde ciliary transport.
    explanation: >-
      Source for assigning WDR19 to the IFT-A complex in this entry's mechanism wiring.
- name: WDR35-associated
  display_name: WDR35-associated JATD (SRTD7)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 7 with or without polydactyly
    term:
      id: MONDO:0013569
      label: short-rib thoracic dysplasia 7 with or without polydactyly
  genes:
  - preferred_term: WDR35
    term:
      id: hgnc:29250
      label: WDR35
  description: >
    Caused by biallelic mutations in WDR35 (IFT121), an IFT-A complex subunit.
    Reported first in siblings with a severe short-rib polydactyly presentation,
    in whom fibroblasts lacking the protein failed to produce cilia; WDR35 also
    causes cranioectodermal dysplasia. Corresponds to short-rib thoracic
    dysplasia 7 (SRTD7).
  evidence:
  - reference: PMID:21473986
    reference_title: Human and mouse mutations in WDR35 cause short-rib polydactyly syndromes due to abnormal ciliogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped the disease locus from two siblings affected by a severe form of
      SRP to 2p24, where we identified an in-frame homozygous deletion of exon 5
      in WDR35.
    explanation: >-
      Primary identification of biallelic WDR35 mutation in the short-rib
      polydactyly spectrum.
  - reference: PMID:21473986
    reference_title: Human and mouse mutations in WDR35 cause short-rib polydactyly syndromes due to abnormal ciliogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      human and mouse fibroblasts lacking the protein fail to produce cilia
    explanation: >-
      Supports the ciliogenesis failure quoted in this subtype description.
- name: DYNC2I1-associated
  display_name: DYNC2I1 (WDR60)-associated JATD (SRTD8)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 8 with or without polydactyly
    term:
      id: MONDO:0014214
      label: short-rib thoracic dysplasia 8 with or without polydactyly
  genes:
  - preferred_term: DYNC2I1
    term:
      id: hgnc:21862
      label: DYNC2I1
  description: >
    Caused by biallelic mutations in DYNC2I1, previously called WDR60, a dynein-2
    intermediate chain. Reported in an individual with short-rib polydactyly
    syndrome type III and, on wider exome screening, in a Spanish individual with
    a relatively mild Jeune presentation. Corresponds to short-rib thoracic
    dysplasia 8 (SRTD8).
  evidence:
  - reference: PMID:23910462
    reference_title: Short-rib polydactyly and Jeune syndromes are caused by mutations in WDR60.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of an additional 54 skeletal ciliopathy exomes identified compound
      heterozygous mutations in WDR60 in a Spanish individual with Jeune syndrome
      of relatively mild presentation.
    explanation: >-
      Establishes biallelic DYNC2I1/WDR60 mutations as a cause of Jeune syndrome.
- name: IFT172-associated
  display_name: IFT172-associated JATD (SRTD10)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 10 with or without polydactyly
    term:
      id: MONDO:0014284
      label: short-rib thoracic dysplasia 10 with or without polydactyly
  genes:
  - preferred_term: IFT172
    term:
      id: hgnc:30391
      label: IFT172
  description: >
    Caused by biallelic mutations in IFT172, a structural component of the anterograde
    IFT-B complex. Recognized prenatally by narrow thorax and short long bones.
    Corresponds to short-rib thoracic dysplasia 10 (SRTD10).
  evidence:
  - reference: PMID:25492405
    reference_title: "Whole exome sequencing is an efficient, sensitive and specific method for determining the genetic cause of short-rib thoracic dystrophies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous or homozygous mutations were identified in six confirmed
      SRTD genes in 10 individuals (IFT172, DYNC2H1, TTC21B, WDR60, WDR34 and NEK1),
      giving overall sensitivity of 90.9%.
    explanation: >-
      Independent confirmation of IFT172 among the established SRTD genes in a
      clinical exome cohort.
- name: DYNC2I2-associated
  display_name: DYNC2I2 (WDR34)-associated JATD (SRTD11)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 11 with or without polydactyly
    term:
      id: MONDO:0014287
      label: short-rib thoracic dysplasia 11 with or without polydactyly
  genes:
  - preferred_term: DYNC2I2
    term:
      id: hgnc:28296
      label: DYNC2I2
  description: >
    Caused by biallelic mutations in DYNC2I2, previously called WDR34, a dynein-2
    intermediate chain orthologous to Chlamydomonas FAP133. Reported in nine
    families with a clinical diagnosis of Jeune syndrome. Disease-associated
    alleles produce a range of molecular consequences across dynein-2 assembly,
    IFT-B localization, transition zone integrity and Hedgehog signaling.
    Corresponds to short-rib thoracic dysplasia 11 (SRTD11).
  evidence:
  - reference: PMID:24183451
    reference_title: Mutations in the gene encoding IFT dynein complex component WDR34 cause Jeune asphyxiating thoracic dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a total of 11 mutations in WDR34 in 9 families with the
      clinical diagnosis of Jeune syndrome (asphyxiating thoracic dystrophy)
    explanation: >-
      Primary report establishing DYNC2I2/WDR34 as a JATD gene and the source of
      the nine-family count quoted here.
- name: CEP120-associated
  display_name: CEP120-associated JATD (SRTD13)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 13 with or without polydactyly
    term:
      id: MONDO:0014577
      label: short-rib thoracic dysplasia 13 with or without polydactyly
  genes:
  - preferred_term: CEP120
    term:
      id: hgnc:26690
      label: CEP120
  description: >
    Caused by biallelic mutations in CEP120, a core centriolar protein rather than
    an IFT or dynein subunit, so the lesion lies upstream of transport at
    centriole and cilium assembly. Described from a founder missense allele shared
    by consanguineous Saudi families, with reduced cilia and an abnormal number of
    centrioles in patient fibroblasts. Corresponds to short-rib thoracic dysplasia
    13 (SRTD13).
  evidence:
  - reference: PMID:25361962
    reference_title: A founder CEP120 mutation in Jeune asphyxiating thoracic dystrophy expands the role of centriolar proteins in skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing revealed a single novel variant within the disease
      haplotype in CEP120, which encodes a core centriolar protein.
    explanation: >-
      Establishes CEP120 as a JATD gene and identifies it as centriolar rather
      than an IFT component.
  - reference: PMID:25361962
    reference_title: A founder CEP120 mutation in Jeune asphyxiating thoracic dystrophy expands the role of centriolar proteins in skeletal ciliopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show marked reduction of cilia and abnormal number of centrioles in
      fibroblasts from one affected individual
    explanation: >-
      Source for the centriole and cilium counts quoted in this subtype description.
- name: KIAA0586-associated
  display_name: KIAA0586 (TALPID3)-associated JATD (SRTD14)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 14 with polydactyly
    term:
      id: MONDO:0014688
      label: short-rib thoracic dysplasia 14 with polydactyly
  genes:
  - preferred_term: KIAA0586
    term:
      id: hgnc:19960
      label: KIAA0586
  description: >
    Caused by biallelic mutations in KIAA0586, the human ortholog of chicken
    TALPID3, a coiled-coil protein required for primary ciliogenesis. The reported
    children had overlapping features of Jeune and Joubert syndromes, so this
    subtype sits at the boundary between the skeletal and neurological ciliopathies.
    Corresponds to short-rib thoracic dysplasia 14 (SRTD14).
  evidence:
  - reference: PMID:26386044
    reference_title: Mutations in human homologue of chicken talpid3 gene (KIAA0586) cause a hybrid ciliopathy with overlapping features of Jeune and Joubert syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified biallelic mutations in the human TALPID3 ortholog, KIAA0586,
      in six children with findings of overlapping Jeune and Joubert syndromes.
    explanation: >-
      Establishes biallelic KIAA0586 mutations as a cause of the Jeune phenotype
      and records the Joubert overlap quoted here.
- name: DYNC2LI1-associated
  display_name: DYNC2LI1-associated JATD (SRTD15)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 15 with polydactyly
    term:
      id: MONDO:0014907
      label: short-rib thoracic dysplasia 15 with polydactyly
  genes:
  - preferred_term: DYNC2LI1
    term:
      id: hgnc:24595
      label: DYNC2LI1
  description: >
    Caused by biallelic mutations in DYNC2LI1, the dynein-2 light intermediate
    chain. Reported in two affected siblings of a Chinese family presenting a
    short-rib polydactyly phenotype in whom a definitive SRTD15 diagnosis was
    made. Corresponds to short-rib thoracic dysplasia 15 (SRTD15).
  evidence:
  - reference: PMID:33030252
    reference_title: Whole-exome sequencing identified two novel mutations of DYNC2LI1 in fetal skeletal ciliopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Definitive diagnosis of short-rib thoracic dysplasia 15 with polydactyly
      (SRTD15) was made in the family.
    explanation: >-
      Ties biallelic DYNC2LI1 variants to the SRTD15 diagnosis this subtype records.
- name: DYNLT2B-associated
  display_name: DYNLT2B (TCTEX1D2)-associated JATD (SRTD17)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 17 with or without polydactyly
    term:
      id: MONDO:0054565
      label: short-rib thoracic dysplasia 17 with or without polydactyly
  genes:
  - preferred_term: DYNLT2B
    term:
      id: hgnc:28482
      label: DYNLT2B
  description: >
    Caused by mutations in DYNLT2B, previously called TCTEX1D2, a dynein light
    chain of the retrograde IFT dynein motor. Reported with partially penetrant
    inheritance, and loss of the protein destabilizes the retrograde IFT dynein
    motor. Corresponds to short-rib thoracic dysplasia 17 (SRTD17).
  evidence:
  - reference: PMID:26044572
    reference_title: TCTEX1D2 mutations underlie Jeune asphyxiating thoracic dystrophy with impaired retrograde intraflagellar transport.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identify TCTEX1D2 mutations causing Jeune asphyxiating thoracic
      dystrophy with partially penetrant inheritance.
    explanation: >-
      Establishes DYNLT2B/TCTEX1D2 as a JATD gene and records the partial
      penetrance quoted in this subtype description.
  - reference: PMID:26044572
    reference_title: TCTEX1D2 mutations underlie Jeune asphyxiating thoracic dystrophy with impaired retrograde intraflagellar transport.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of TCTEX1D2 impairs retrograde intraflagellar transport (IFT) in humans
      and the protist Chlamydomonas, accompanied by destabilization of the
      retrograde IFT dynein motor.
    explanation: >-
      Source for the dynein-motor destabilization mechanism assigned to this subtype.
- name: IFT43-associated
  display_name: IFT43-associated JATD (SRTD18)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 18 with polydactyly
    term:
      id: MONDO:0036483
      label: short-rib thoracic dysplasia 18 with polydactyly
  genes:
  - preferred_term: IFT43
    term:
      id: hgnc:29669
      label: IFT43
  description: >
    Caused by biallelic mutations in IFT43, a satellite subunit of the retrograde
    IFT-A complex. The reported form shows unusual bending of the ribs and
    appendicular bones, and the phenotype resembles that produced by mutations in
    its direct interactor WDR35 (IFT121). Corresponds to short-rib thoracic
    dysplasia 18 (SRTD18).
  evidence:
  - reference: PMID:28400947
    reference_title: Mutations in IFT-A satellite core component genes IFT43 and IFT121 produce short rib polydactyly syndrome with distinctive campomelia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein we describe mutations in IFT43, a satellite member of the retrograde
      IFT-A complex, that produce a form of SRPS with unusual bending of the ribs
      and appendicular bones.
    explanation: >-
      Establishes IFT43 as an SRPS/SRTD locus and assigns it to the IFT-A complex.
- name: IFT81-associated
  display_name: IFT81-associated JATD (SRTD19)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 19 with or without polydactyly
    term:
      id: MONDO:0033485
      label: short-rib thoracic dysplasia 19 with or without polydactyly
  genes:
  - preferred_term: IFT81
    term:
      id: hgnc:14313
      label: IFT81
  description: >
    Caused by biallelic mutations in IFT81, a core subunit of the anterograde IFT-B
    complex. Mutant chondrocytes carry low levels of IFT81, produce elongated cilia
    and show altered hedgehog signaling. Corresponds to short-rib thoracic
    dysplasia 19 (SRTD19).
  evidence:
  - reference: PMID:27666822
    reference_title: Destabilization of the IFT-B cilia core complex due to mutations in IFT81 causes a Spectrum of Short-Rib Polydactyly Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein we describe a new spectrum of SRPS caused by mutations in the gene
      IFT81, a key component of the IFT-B complex essential for anterograde
      transport.
    explanation: >-
      Establishes IFT81 as an SRPS locus and assigns it to the anterograde IFT-B complex.
  - reference: PMID:32783357
    reference_title: "Expanding the phenotypic spectrum of IFT81: Associated ciliopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date there have only been six reported patients with homozygous and
      compound heterozygous variants in IFT81, causing a short-rib thoracic
      dysplasia, with, or without, polydactyly (SRTD19: OMIM 617895).
    explanation: >-
      Independent source naming the SRTD19 designation this subtype is bound to.
- name: FGF4-associated
  display_name: FGF4-associated thoracic dystrophy (SRTD22)
  subtype_term:
    preferred_term: short-rib thoracic dysplasia 22 without polydactyly
    term:
      id: MONDO:0979242
      label: short-rib thoracic dysplasia 22 without polydactyly
  genes:
  - preferred_term: FGF4
    term:
      id: hgnc:3682
      label: FGF4
  description: >
    Reported in two unrelated families with biallelic missense substitutions in
    FGF4. Unlike every other subtype recorded here, FGF4 is a secreted growth
    factor rather than a ciliary transport component, so this form is not an IFT
    or dynein lesion; it is included because MONDO classes it under Jeune syndrome
    and because the reported phenotype is a thoracic dystrophy. The reported
    phenotype is restricted to short ribs, a narrow chest and respiratory
    insufficiency without other diagnostic signs. The authors state the
    association as newly identified, and it is not yet independently replicated.
  evidence:
  - reference: PMID:40259859
    reference_title: Biallelic FGF4 Variants Linked to Thoracic Dystrophy and Respiratory Insufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both harbor rare biallelic and predicted deleterious missense substitutions
      in FGF4, a gene known to be essential for formation of the thoracic skeleton
      in mice.
    explanation: >-
      Primary report of biallelic FGF4 variants in two families with thoracic dystrophy.
  - reference: PMID:40259859
    reference_title: Biallelic FGF4 Variants Linked to Thoracic Dystrophy and Respiratory Insufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that the phenotype is restricted to short ribs, abnormally
      narrow chest, and respiratory insufficiency, without other diagnostic
      clinical or radiological signs.
    explanation: >-
      Source for the restricted phenotype recorded in this subtype description.
  - reference: PMID:40259859
    reference_title: Biallelic FGF4 Variants Linked to Thoracic Dystrophy and Respiratory Insufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that biallelic alterations in FGF4 are a newly identified disease
      association of thoracic dystrophy.
    explanation: >-
      Records the authors' own hedging, which is why this subtype is marked as
      not yet independently replicated.
- name: IFT140-associated
  display_name: IFT140-associated JATD
  genes:
  - preferred_term: IFT140
    term:
      id: hgnc:29077
      label: IFT140
  description: >
    Caused by biallelic mutations in IFT140, an IFT-A complex subunit involved in
    retrograde intraflagellar transport. No subtype_term is bound here on purpose:
    the corresponding MONDO concept, short-rib thoracic dysplasia 9
    (MONDO:0009964), is already curated as a has_subtypes row of the dedicated
    entry IFT140-related_Recessive_Ciliopathy, and binding it twice would
    duplicate that curation. This row exists so the IFT140 gene reaches this
    entry's pathograph.
  evidence:
  - reference: PMID:22791528
    reference_title: Ciliary disorder of the skeleton.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In this review, we focus on skeletal conditions belonging to the ciliopathy
      group: the short rib-polydactyly group (SRPs) that includes Verma-Naumoff
      syndrome (SRP type III), Majewski syndrome (SRP type II), Jeune syndrome
      (ATD), as well as Ellis-van Creveld syndrome (EVC), the Sensenbrenner
      syndrome, and, finally, Weyers acrofacial dysostosis.
    explanation: >-
      Review establishing the skeletal ciliopathy grouping within which the
      IFT-A genes recorded in this entry act.
- name: IFT74-associated
  display_name: IFT74-associated JATD
  genes:
  - preferred_term: IFT74
    term:
      id: hgnc:21424
      label: IFT74
  description: >
    Caused by biallelic mutations in IFT74, the tubulin-binding subunit of the
    IFT-B complex. Allele-specific phenotypes are reported: homozygous exon 2
    deletion cases presented a ciliary chondrodysplasia with narrow thorax
    together with a mucociliary clearance disorder, making this the one subtype
    recorded here that involves motile as well as primary cilia. No SRTD number
    or dedicated MONDO subtype term was found for this gene, so no subtype_term
    is bound.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1010796
    reference_title: IFT74 variants cause skeletal ciliopathy and motile cilia defects in mice and humans
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous exon 2 deletion cases presented a ciliary chondrodysplasia with narrow thorax and progressive growth retardation along with a mucociliary clearance disorder phenotype with severely shorted cilia."
    explanation: >-
      Reports the allele-specific skeletal plus mucociliary phenotype recorded here.
  - reference: DOI:10.1371/journal.pgen.1010796
    reference_title: IFT74 variants cause skeletal ciliopathy and motile cilia defects in mice and humans
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the first 40 amino acids of IFT74 are dispensable for binding of other IFT
      subunits but are important for tubulin binding
    explanation: >-
      Source for describing IFT74 as the tubulin-binding subunit, and for why the
      exon 2 deletion allele behaves differently from a null allele.

- name: IFT-A Complex Retrograde Transport Failure
  description: >
    Loss of subunits of the IFT-A particle (IFT140, WDR19/IFT144, WDR35/IFT121,
    IFT43, TTC21B/IFT139) disrupts the adaptor that returns cargo from the ciliary
    tip to the base. This is a distinct lesion from loss of the dynein-2 motor that
    powers the same direction of travel, and distinct again from the anterograde
    IFT-B particle. Comparing the two clinical reports cited below, IFT-A genes
    carry a heavier extra-skeletal burden than DYNC2H1: IFT140 patients had only
    mild chest narrowing but all reached end-stage renal failure under 13 years
    of age, with retinal dystrophy in those examined for ocular dysfunction,
    whereas DYNC2H1 patients largely lacked significant extra-skeletal involvement.

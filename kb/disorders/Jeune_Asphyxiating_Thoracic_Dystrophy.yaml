    reference_title: Combined NGS approaches identify mutations in the intraflagellar transport gene IFT140 in skeletal ciliopathies with early progressive kidney Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identified mutations in IFT140, an IFT complex A gene, in five
      Jeune asphyxiating thoracic dystrophy (JATD) and two Mainzer-Saldino
      syndrome (MSS) families
    explanation: >-
      Establishes IFT140 as causative in JATD and assigns it to the IFT-A complex.
- name: WDR19 Mutations
  gene_term:

name: Brunner Syndrome
creation_date: "2026-11-09T19:45:19Z"
category: Mendelian
description: >-
  Brunner syndrome is an X-linked recessive inborn error of monoamine metabolism
  caused by hemizygous loss-of-function variants in MAOA (monoamine oxidase A).
  Loss of MAO-A catalytic activity abolishes oxidative deamination of serotonin,
  norepinephrine and dopamine, producing a characteristic biochemical signature
  (elevated serum serotonin and urinary O-methylated amine metabolites, with low
  deaminated metabolites) together with borderline-to-mild intellectual
  disability and episodic impulsive or aggressive behaviour. It was first
  described in 1993 in a large Dutch kindred and remains reported in only a small
  number of families.
disease_term:
  preferred_term: Brunner syndrome
  term:
    id: MONDO:0010379
    label: Brunner syndrome
synonyms:
- MAOA deficiency
- Monoamine oxidase A deficiency
- MAO-A deficiency
- Antisocial behavior, X-linked recessive
- X-linked borderline mental retardation with prominent behavioral disturbance
parents:
- inborn disorder of neurotransmitter metabolism and transport
- inborn disorder of amino acid metabolism
- X-linked recessive disease
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Brunner syndrome is inherited in an X-linked recessive pattern. Hemizygous
    males carrying a pathogenic MAOA variant are affected; the disease locus was
    originally mapped to Xp11.23-11.4 by linkage in the Dutch kindred. Carrier
    females are usually clinically unaffected, although some show episodic
    serotonergic symptoms or mild cognitive involvement.
  evidence:
  - reference: PMID:8503438
    reference_title: "X-linked borderline mental retardation with prominent behavioral disturbance: phenotype, genetic localization, and evidence for disturbed monoamine metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A maximal multipoint lod score of 3.69 was obtained at the monoamine oxidase type A (MAOA) locus in Xp11.23-11.4."
    explanation: >-
      Linkage in the original Dutch kindred places the disease locus at MAOA on
      the X chromosome, establishing X-linked inheritance.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_maoa_monoamine_excess_model
  hypothesis_label: Canonical MAOA Loss / Monoamine Excess / Monoaminergic Dysregulation Model
  status: CANONICAL
  description: >-
    Hemizygous loss-of-function variants in MAOA abolish monoamine oxidase A
    catalytic activity, blocking oxidative deamination of serotonin,
    norepinephrine and dopamine. The resulting accumulation of these
    neurotransmitters (with a reciprocal shift toward O-methylated metabolites
    and depletion of deaminated metabolites) perturbs central monoaminergic
    neurotransmission and, peripherally, produces episodic serotonergic symptoms.
    The central disturbance is held to underlie the borderline-to-mild
    intellectual disability and the episodic impulsive or aggressive behaviour.
    The biochemical arm of this model is firmly established in patient urine and
    serum and reproduced in Maoa-deficient mice; the step from monoamine
    disturbance to the specific human behavioural phenotype is supported by
    convergent model-organism and in vitro data but remains inferential in
    humans.
  evidence:
  - reference: PMID:8211186
    reference_title: Abnormal behavior associated with a point mutation in the structural gene for monoamine oxidase A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome was associated with a complete and selective deficiency of enzymatic activity of monoamine oxidase A (MAOA)."
    explanation: >-
      The founding description ties the behavioural syndrome to selective loss
      of MAO-A activity, the top of this causal model.
  - reference: PMID:42511567
    reference_title: "Genotype-Driven Diagnosis Enables Targeted Pharmacological Treatment in Brunner Syndrome: A Novel Splice-Site MAOA Variant and Case-Based Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impaired MAOA activity leads to abnormal monoamine accumulation and disruption of monoaminergic signalling, resulting in intellectual disability and behavioural dysregulation."
    explanation: >-
      States the full canonical chain from impaired MAOA activity through
      monoamine accumulation to the clinical phenotype.
- hypothesis_group_id: synaptic_nmdar_developmental_model
  hypothesis_label: Synaptic NMDAR Hyperfunction / Developmental Circuit Model
  status: EMERGING
  description: >-
    An emerging, more proximal model proposes that MAOA loss acts on neuronal
    circuits not only through steady-state monoamine excess but through
    developmental and synaptic remodelling: patient iPSC-derived dopaminergic
    neurons show reduced synaptic density with paradoxically hyperactive network
    activity driven by up-regulated GRIN2A/GRIN2B NMDA receptor subunits, and
    Maoa-null mouse pups show up to ninefold brain serotonin during development
    with cytoarchitectural cortical changes. This frames the phenotype as a
    consequence of altered circuit maturation and excitatory/inhibitory imbalance
    rather than acute neurotransmitter excess alone. It is supported only by in
    vitro and model-organism data.
  evidence:
  - reference: PMID:34923109
    reference_title: Brunner syndrome associated MAOA mutations result in NMDAR hyperfunction and increased network activity in human dopaminergic neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the neuronal network hyperactivity is mediated by upregulation of the GRIN2A and GRIN2B subunits of the N-methyl-d-aspartate receptor (NMDAR), resulting in increased NMDAR-mediated currents"
    explanation: >-
      Identifies NMDAR hyperfunction as the proximal synaptic defect in patient
      neurons, the basis of this alternative model.
pathophysiology:
- name: MAOA Loss-of-Function Variant
  description: >-
    A hemizygous loss-of-function variant in MAOA (nonsense, frameshift,
    splice-site or inactivating missense) is the initiating germline lesion.
    Reported classes include the original exon-8 nonsense variant p.Gln296*,
    frameshift p.Ser251Lysfs*2, inactivating missense variants (p.Arg45Trp,
    p.Cys266Phe, p.Glu137Gly, p.Thr408Met), and a splice-site variant causing
    intron-8 retention and a premature stop codon.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of Monoamine Oxidase A Catalytic Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36536002
      reference_title: Brunner syndrome caused by point mutation explained by multiscale simulation of enzyme reaction.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "the R45W mutation causes a 6000-fold slowdown of enzymatic function, whereas the E446K mutation causes a 450-fold reduction of serotonin degradation rate, both of which are practically equivalent to a gene knockout"
      explanation: >-
        Multiscale simulation shows that disease missense variants reduce
        catalytic rate to a degree equivalent to a null allele, linking the
        variant to loss of enzyme activity.
- name: Loss of Monoamine Oxidase A Catalytic Activity
  description: >-
    The variant abolishes or near-abolishes MAO-A, the FAD-dependent enzyme of
    the outer mitochondrial membrane that catalyses oxidative deamination of
    monoamine neurotransmitters. Affected males show complete and selective loss
    of MAO-A enzymatic activity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MAOA
    term:
      id: hgnc:6833
      label: MAOA
  molecular_functions:

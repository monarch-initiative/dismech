name: Normal Pressure Hydrocephalus
creation_date: "2026-08-22T00:00:00Z"
category: Complex
disease_term:
  preferred_term: normal pressure hydrocephalus
  term:
    id: MONDO:0009366
    label: normal pressure hydrocephalus
description: >-
  Ventricular enlargement with cerebrospinal fluid pressure in the high-normal range,
  presenting in older adults as the triad of gait disturbance, cognitive decline and
  urinary incontinence, and treated by surgical CSF diversion. The idiopathic form is
  common in the elderly and is the one form of dementia widely described as reversible.

  Two mechanisms are curated here, and the reason to curate both is that they differ in
  reversibility. A mechanical arm runs from age-related loss of intracranial compliance
  through disturbed CSF pulsatility and absorption to ventriculomegaly and stretch injury
  of the periventricular white matter. A glymphatic arm runs from perivascular AQP4
  depolarization through impaired CSF-interstitial fluid exchange to interstitial
  amyloid-beta accumulation. The first arm is what a shunt addresses; the second is not.
  In the placebo-controlled trial that finally tested shunting, gait improved and
  cognition did not.

parents:
- Communicating Hydrocephalus
- Hydrocephalus

pathophysiology:

- name: Age-Related Loss of Intracranial Compliance
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Ageing stiffens the cerebral arteries and the CSF circulatory channels alike.
    Atherosclerotic loss of arterial pulsatility removes the Windkessel dampening that
    normally absorbs each systolic pulse before it reaches the CSF spaces, while falling
    intracranial compliance and rising venous pressure leave the pulse with nowhere to go.
    This is the substrate on which the rest of the entry is built, and it is why
    idiopathic NPH is a disease of the eighth and ninth decades rather than a disease that
    happens to appear in them.
  biological_processes:
  - preferred_term: cerebrospinal fluid circulation
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
    modifier: DECREASED
  evidence:
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the aging process, the loss of arterial pulsatility due to atherosclerosis would
      significantly increase the pulsatility of aqueduct.
    explanation: >-
      States the arterial-stiffening route by which ageing raises CSF pulsatility, the
      claim this node makes.
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intracranial compliance gradually reduces with the progress of aging, resulting in
      more rigid CSF circulatory channels and the elevation of venous pressure.
    explanation: >-
      The compliance half of the same trigger, and the reason the increased pulse energy
      is not absorbed.
  - reference: PMID:28062721
    reference_title: "Vascular risk factors in INPH: A prospective case-control study (the INPH-CRasH study)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings confirm that patients with INPH have more VRFs and lack the protective
      factors present in the general population.
    explanation: >-
      Case-control evidence that the vascular burden this node posits is actually
      overrepresented in idiopathic NPH rather than merely age-expected.
  - reference: PMID:28062721
    reference_title: "Vascular risk factors in INPH: A prospective case-control study (the INPH-CRasH study)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariable logistic regression analysis indicated that hyperlipidemia (odds ratio
      [OR] 2.380; 95% confidence interval [CI] 1.434-3.950), diabetes (OR 2.169; 95% CI
      1.195-3.938), obesity (OR 5.428; 95% CI 2.502-11.772), and psychosocial factors (OR
      5.343; 95% CI 3.219-8.868) were independently associated with INPH.
    explanation: >-
      Quantifies the individual vascular contributors, several of them modifiable, which
      is what makes this trigger node clinically actionable rather than merely descriptive.
  - reference: PMID:42239999
    reference_title: "Idiopathic Normal Pressure Hydrocephalus: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      involving alterations in CSF dynamics, reduced vascular compliance, periventricular
      ischemia, and dysfunction of the glymphatic system
    explanation: >-
      A recent review naming reduced vascular compliance and glymphatic dysfunction
      together, which is the pairing this entry's two arms curate.
  downstream:
  - target: Increased CSF Pulsatility with Impaired CSF Absorption
    causal_link_type: DIRECT
    description: >-
      Reduced compliance and lost arterial dampening together produce the hyperdynamic
      CSF state.

- name: Increased CSF Pulsatility with Impaired CSF Absorption
  role: amplifier
  biological_scale: ORGANISM
  description: >-
    CSF flow has a bulk and a pulsatile component, and in idiopathic NPH both are
    deranged: outflow resistance impedes absorption while aqueductal stroke volume rises.
    The combination matters more than either part. Raised outflow resistance alone would
    produce accumulation; raised pulsatility supplies the force that converts accumulation
    into ventricular dilatation.
  biological_processes:
  - preferred_term: cerebrospinal fluid circulation
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
    modifier: DYSREGULATED
  locations:
  - preferred_term: ventricular system of brain
    term:
      id: UBERON:0005282
      label: ventricular system of brain
  evidence:
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased CSF pulsatility may associate with reduced arterial pulsatility and
      decreased intracranial compliance.
    explanation: >-
      Links this node to the trigger upstream of it.
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lack of sufficient CSF absorption caused by outflow resistance could lead to the
      accumulation of CSF, and further facilitate the ventricular dilatation driven by
      high CSF pulsatility.
    explanation: >-
      States both halves of this node and their joint effect on the ventricles, which is
      the edge below.
  downstream:
  - target: Ventriculomegaly at Normal Mean CSF Pressure
    causal_link_type: DIRECT
    description: >-
      Accumulating CSF, driven by a pulsatile force the compliant compartments can no
      longer absorb, dilates the ventricles without raising mean pressure.

- name: Ventriculomegaly at Normal Mean CSF Pressure
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    The defining lesion, and the source of the disease's name: the ventricles enlarge
    while mean CSF pressure stays within the normal range, so the syndrome is invisible to
    the measurement that would identify ordinary hydrocephalus. Ventriculomegaly is
    curated as the central effector rather than as a radiological sign because it is where
    both curated arms converge and the point at which the mechanical injury below it
    begins.
  locations:
  - preferred_term: ventricular system of brain
    term:
      id: UBERON:0005282
      label: ventricular system of brain
  evidence:
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common consensus is that ventriculomegaly resulting from cerebrospinal fluid
      (CSF) dynamics could initiate a vicious cycle of neurological damages in iNPH.
    explanation: >-
      Places ventriculomegaly as the node from which the downstream damage proceeds, which
      is how it is curated here.
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 10% of dementia patients have idiopathic normal pressure hydrocephalus
      (iNPH), an expansion of the cerebrospinal fluid (CSF)-filled brain ventricles.
    explanation: >-
      Defines the disorder by this node and gives its weight among the dementias.
  downstream:
  - target: Periventricular White Matter Compression and Stretch Injury
    causal_link_type: DIRECT
    description: >-
      Expansion of the ventricles compresses and stretches the white matter immediately
      around them.
  - target: Ventriculomegaly
    causal_link_type: DIRECT
    description: >-
      The node's own radiological expression. Curated as an edge so the imaging phenotype
      is attached to the mechanism that produces it rather than standing alone, since
      ventricular enlargement from cortical atrophy looks similar and arises differently.
    evidence:
    - reference: PMID:33242372
      reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Typical brain imaging of iNPH displays ventriculomegaly, periventricular
        hyperintensities, wide Sylvian fissures, narrowed subarachnoid space, and cortical
        sulci at the high convexity.
      explanation: >-
        The imaging expression of this node, including the high-convexity feature that
        separates it from atrophic enlargement.

- name: Periventricular White Matter Compression and Stretch Injury
  role: consequence
  biological_scale: TISSUE
  description: >-
    White matter lesions are prominent in idiopathic NPH, and the mechanical account of
    the triad rests here. Fibres of the corticospinal tract run in the periventricular
    white matter arranged somatotopically, with the leg and sacral fibres closest to the
    ventricle, so ventricular expansion loads them first. This is what makes gait the
    earliest and most shunt-responsive feature, and it is also the account from which the
    urinary arm is usually derived - a derivation the trial evidence below does not
    straightforwardly support.
  locations:
  - preferred_term: periventricular white matter
    term:
      id: UBERON:0014932
      label: periventricular white matter
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  evidence:
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms of iNPH could be attributed, at least partially, to the compression and
      stretch of white matter.
    explanation: >-
      The mechanical claim this node makes, stated with the hedge the source uses.
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When the motor nerve fibers of corticospinal tract are inflicted, gait disturbance
      may occur.
    explanation: >-
      Connects the periventricular lesion to the gait phenotype specifically.
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The stretch of sacral fibers of the corticospinal tract may disrupt bladder
      contractions, resulting in urinary incontinence, which is the second most common
      symptom of iNPH.
    explanation: >-
      The conventional derivation of the urinary arm from the same lesion as the gait arm.
      Curated because the placebo-controlled trial result makes this derivation the
      entry's sharpest open question, not because it is settled.
  downstream:
  - target: Gait Disturbance
    causal_link_type: DIRECT
    description: >-
      Loading of the periventricular corticospinal fibres, leg fibres first, is the
      mechanical account of why gait fails earliest and responds to CSF diversion.
    evidence:
    - reference: PMID:33242372
      reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        When the motor nerve fibers of corticospinal tract are inflicted, gait disturbance
        may occur.
      explanation: >-
        States this edge directly.
  - target: Urinary Incontinence
    causal_link_type: DIRECT
    description: >-
      The conventional derivation of the urinary arm from the same lesion as the gait arm,
      via the sacral corticospinal fibres. Curated as an edge rather than left in prose
      precisely because the placebo-controlled trial did not confirm it: the graph now
      asserts a link the evidence for treatment response contradicts, and the knowledge
      gap below attaches to that tension rather than floating above it.
    evidence:
    - reference: PMID:33242372
      reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The stretch of sacral fibers of the corticospinal tract may disrupt bladder
        contractions, resulting in urinary incontinence, which is the second most common
        symptom of iNPH.
      explanation: >-
        The mechanistic claim this edge makes. Note it is a claim about pathogenesis, not
        about reversibility - which is exactly the distinction the trial exposed.
  - target: Urinary Urgency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same bladder arm at the severity the trials actually measured. Curated with
      unknown intermediates rather than DIRECT because the cited mechanism names
      incontinence specifically, and urgency is the earlier, milder form recorded by the
      overactive-bladder instruments both randomised trials used.
    evidence:
    - reference: PMID:40960253
      reference_title: "A Randomized Trial of Shunting for Idiopathic Normal-Pressure Hydrocephalus."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Idiopathic normal-pressure hydrocephalus is a neurologic disorder characterized by
        impaired gait, balance, cognition, and bladder control in older adults.
      explanation: >-
        Establishes bladder control as a defining domain of the syndrome. PARTIAL because
        it does not itself attribute the bladder arm to the periventricular lesion; that
        attribution comes from the incontinence edge above.

- name: Perivascular AQP4 Depolarization
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "glymphatic_dysfunction#Perivascular AQP4 Depolarization and Reduced Periarterial CSF Influx"
  description: >-
    Periarterial CSF influx into the parenchyma depends on aquaporin-4 held at the
    perivascular astroglial end-feet. Cortical biopsies taken at shunt surgery show
    reduced perivascular AQP4 density in idiopathic NPH, which is direct human tissue
    evidence rather than an imaging surrogate - the distinction the glymphatic module
    insists on. It is the disorder-specific substitution this module node asks for: the
    cause of reduced influx here is AQP4 mislocalization at the astrocyte end-foot.
  cell_types:
  - preferred_term: astrocyte of the cerebral cortex
    term:
      id: CL:0002605
      label: astrocyte of the cerebral cortex
  cellular_components:
  - preferred_term: astrocyte end-foot
    term:
      id: GO:0097450
      label: astrocyte end-foot
  biological_processes:
  - preferred_term: water transport
    term:
      id: GO:0006833
      label: water transport
    modifier: DECREASED
  locations:
  - preferred_term: perivascular space
    term:
      id: UBERON:0014930
      label: perivascular space
  evidence:
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also, AQP4 immunogold cytochemistry analysis of cortical brain biopsies from 30 iNPH
      patients and 12 reference subjects demonstrated reduced AQP4 density in the
      perivascular astroglial endfeet of iNPH brains as compared to control brains
    explanation: >-
      Direct human tissue measurement of the molecular lesion at this node, in idiopathic
      NPH specifically.
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      iNPH and Alzheimer's disease (AD) both exhibit sleep disturbances, build-up of brain
      metabolic wastes and amyloid-β (Aβ) plaques, perivascular reactive astrogliosis, and
      mislocalization of astrocyte aquaporin-4 (AQP4).
    explanation: >-
      Establishes AQP4 mislocalization as a feature of idiopathic NPH and not only of
      Alzheimer disease, which is what licenses conformance to the module here.
  - reference: PMID:16552421
    reference_title: "Accelerated progression of kaolin-induced hydrocephalus in aquaporin-4-deficient mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results indicate a significant role for AQP4-mediated transparenchymal CSF
      absorption in hydrocephalus and provide a rational basis for evaluation of AQP4
      induction as a nonsurgical therapy for hydrocephalus.
    explanation: >-
      The only causal rather than correlational support in this arm: removing AQP4 makes
      hydrocephalus worse, which is the direction this node asserts. PARTIAL because the
      model is kaolin-induced obstructive hydrocephalus in mice, not normal pressure
      hydrocephalus, so it establishes that AQP4 participates in CSF absorption without
      establishing that its loss initiates the human syndrome.
  downstream:
  - target: Impaired Glymphatic CSF-ISF Exchange and Solute Clearance
    causal_link_type: DIRECT
    description: >-
      Loss of perivascular AQP4 reduces the astroglia-supported influx on which
      CSF-interstitial fluid exchange depends.

- name: Impaired Glymphatic CSF-ISF Exchange and Solute Clearance
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "glymphatic_dysfunction#Impaired Perivascular CSF-ISF Exchange and Solute Clearance"
  description: >-
    Reduced exchange between cerebrospinal and interstitial fluid produces both an
    abnormal accumulation of cerebral CSF and a failure to clear interstitial solute - the
    two arms of this entry emerging from a single node. Imaging measures of perivascular
    diffusivity are lower in idiopathic NPH than in mimics and correlate with ventricular
    volume, though the glymphatic module's own caution applies: a diffusivity index is a
    correlate of glymphatic transport, not a measurement of it, and the tissue evidence
    upstream carries more weight here than the imaging does.
  biological_processes:
  - preferred_term: cerebrospinal fluid circulation
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
    modifier: DECREASED
  - preferred_term: amyloid-beta clearance
    term:
      id: GO:0097242
      label: amyloid-beta clearance
    modifier: DECREASED
  locations:
  - preferred_term: perivascular space
    term:
      id: UBERON:0014930
      label: perivascular space
  evidence:
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glymphatic dysfunction, characterized by reduced CSF-ISF exchange, leads to an
      abnormal accumulation of cerebral CSF and impaired interstitial solute clearance,
      both defining clinical features of iNPH and a likely cause of cognitive
      deterioration.
    explanation: >-
      States this node and both of its downstream edges, and does so for idiopathic NPH
      specifically.
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human studies have implicated impaired glymphatic function in both AD and iNPH.
    explanation: >-
      Records the evidence tier honestly - implicated in human studies, not demonstrated
      as causal.
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the authors found that the ALPS index positively correlated with ventricular volume,
      suggesting a direct link between glymphatic impairment and ventriculomegaly
    explanation: >-
      Supports the edge from this node to ventriculomegaly, but only partially: it is a
      correlation between an imaging surrogate and ventricular size in a small study, and
      it does not establish direction.
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALPS indices of the iNPH patients were also lower than those of the pseudo-iNPH
      group
    explanation: >-
      The comparison against mimics asserted in this node's description, which was
      previously uncited. PARTIAL for the same reason as the item above - a small study,
      and an imaging surrogate rather than a measurement of transport.
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathophysiological factors including hypoperfusion, glymphatic impairment,
      disturbance of metabolism, astrogliosis, neuroinflammation, and blood-brain barrier
      disruption jointly cause white matter and gray matter lesions, and eventually lead
      to various iNPH symptoms.
    explanation: >-
      Places glymphatic impairment among the accepted pathophysiological factors in
      idiopathic NPH, alongside several this entry does not curate.
  - reference: PMID:42239999
    reference_title: "Idiopathic Normal Pressure Hydrocephalus: A Comprehensive Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent MRI advances have introduced biomarkers of glymphatic dysfunction, such as
      diffusion tensor imaging along perivascular spaces (DTI-ALPS), which may improve
      understanding of disease mechanisms and refine patient selection.
    explanation: >-
      Cited for the hedge as much as the claim. DTI-ALPS is described as a biomarker that
      may improve understanding, not as an established measurement of transport, which is
      the same caution the glymphatic module records and the reason the imaging evidence
      here is curated as PARTIAL throughout.
  downstream:
  - target: Ventriculomegaly at Normal Mean CSF Pressure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced glymphatic flux is reported to exacerbate ventriculomegaly, making the two
      arms of this entry mutually reinforcing rather than parallel. The edge is curated with
      unknown intermediates because the human evidence is a correlation between an imaging surrogate
      and ventricular volume, and the direction is not established.
    evidence:
    - reference: PMID:31959516
      reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This correlation may indicate a role of inflammation-induced depolarization of
        AQP4 in iNPH pathogenesis, such that attenuated perivascular AQP4 expression
        reduces glymphatic fluid flux, subsequently exacerbating Aβ accumulation and
        ventriculomegaly.
      explanation: >-
        Proposes exactly this edge, in the source's own hypothetical register, which is
        why the edge is INDIRECT and the evidence PARTIAL.
  - target: Interstitial Amyloid-beta Accumulation
    causal_link_type: DIRECT
    description: >-
      Failure of perivascular solute clearance leaves interstitial amyloid-beta in place.

- name: Interstitial Amyloid-beta Accumulation
  role: consequence
  biological_scale: TISSUE
  conforms_to: "glymphatic_dysfunction#Accumulation of Aggregation-Prone Interstitial Proteins"
  description: >-
    Amyloid-beta plaques are found in cortical biopsies from idiopathic NPH as well as
    from Alzheimer disease, less severe but present. The clinically consequential fact is
    what they predict: amyloid burden correlates with poor shunt responsiveness. That
    makes this node the mechanistic candidate for the part of the syndrome a shunt cannot
    fix, and it is the reason this entry treats the triad as two problems rather than one.
  biological_processes:
  - preferred_term: amyloid-beta clearance
    term:
      id: GO:0097242
      label: amyloid-beta clearance
    modifier: DECREASED
  evidence:
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      accumulation of interstitial amyloid-β (Aβ) plaques are a characteristic feature of
      both iNPH and AD cortical brain biopsies, a pathological finding that correlates
      with poor shunt responsiveness in iNPH patients
    explanation: >-
      Both halves of this node: the deposition in idiopathic NPH cortex, and its
      association with failure to respond to CSF diversion.
  downstream:
  - target: Cognitive Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The glymphatic arm's route to the cognitive deficit, and the entry's candidate
      explanation for why that deficit did not separate from placebo under shunting: a
      shunt acts on the mechanical arm, and this one is not on it. Curated with unknown
      intermediates because the cited source calls impaired solute clearance a likely
      cause of cognitive deterioration rather than a demonstrated one.
    evidence:
    - reference: PMID:31959516
      reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glymphatic dysfunction, characterized by reduced CSF-ISF exchange, leads to an
        abnormal accumulation of cerebral CSF and impaired interstitial solute clearance,
        both defining clinical features of iNPH and a likely cause of cognitive
        deterioration.
      explanation: >-
        PARTIAL because the source says "a likely cause", which is the strength this edge
        is curated at.
    - reference: PMID:31959516
      reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        accumulation of interstitial amyloid-β (Aβ) plaques are a characteristic feature of
        both iNPH and AD cortical brain biopsies, a pathological finding that correlates
        with poor shunt responsiveness in iNPH patients
      explanation: >-
        Ties this edge to treatment response: the burden at its source node predicts
        failure of the intervention that acts on the other arm.

phenotypes:

- category: Neurological
  name: Gait Disturbance
  description: >-
    A slowly progressive apraxic gait, typically the earliest feature and the only arm of
    the triad with placebo-controlled evidence of reversibility.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Gait apraxia
    term:
      id: HP:0010521
      label: Gait apraxia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:40960253
    reference_title: "A Randomized Trial of Shunting for Idiopathic Normal-Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic normal-pressure hydrocephalus is a neurologic disorder characterized by
      impaired gait, balance, cognition, and bladder control in older adults.
    explanation: >-
      Gait impairment as a defining feature, from the trial that measured it.

- category: Neurological
  name: Cognitive Impairment
  description: >-
    Subcortical-frontal cognitive decline. Idiopathic NPH is widely described as a
    reversible dementia, but in the placebo-controlled trial the cognitive measure did not
    separate from placebo at three months.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Dementia
    term:
      id: HP:0000726
      label: Dementia
  evidence:
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT

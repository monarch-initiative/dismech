genetic:

- name: SLCO1A2
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: SLCO1A2
    term:
      id: hgnc:10956
      label: SLCO1A2
  association: >-
    The strongest signal in the largest genome-wide association study of normal pressure
    hydrocephalus, and a protective rather than a risk allele. rs7962263 near SLCO1A2 gave
    an odds ratio of 0.71 across 1,522 NPH cases and 451,091 controls, replicated in UK
    Biobank, and the effect held in the idiopathic-only sensitivity analysis at 0.70.
  evidence:
  - reference: PMID:39141892
    reference_title: "Risk Variants Associated With Normal Pressure Hydrocephalus: Genome-Wide Association Study in the FinnGen Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The top loci near the following genes were rs7962263, SLCO1A2 (odds ratio [OR] 0.71,
      95% CI 0.65-0.78, p = 1.0e-14)
    explanation: >-
      The lead protective locus and its effect size in the discovery cohort.
  - reference: PMID:39141892
    reference_title: "Risk Variants Associated With Normal Pressure Hydrocephalus: Genome-Wide Association Study in the FinnGen Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the sensitivity analysis comparing only patients with iNPH (n = 1,055) with the
      controls (n = 451,091), 4 top loci near the following genes remained significant:
      rs7962263, SLCO1A2 (OR 0.70, 95% CI 0.63-0.78, p = 2.1e-11)
    explanation: >-
      The association survives restriction to idiopathic cases, which is what makes it a
      determinant of the syndrome curated here rather than of a secondary aetiology.

- name: CFAP43
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: CFAP43
    term:
      id: hgnc:26684
      label: CFAP43
  association: >-
    The cilia gene MONDO records as the causal gene of MONDO:0009366 via RO:0004003, on
    the strength of the OMIM-numbered familial form. In the systematic review of NPH
    genetics it appears among the genes enriched for risk variants in NPH cohorts rather
    than as an established Mendelian cause of the common idiopathic syndrome, which is why
    it is typed SUSCEPTIBILITY here and not CAUSATIVE.
  evidence:
  - reference: PMID:40266017
    reference_title: "Genetic Risk Factors in Normal Pressure Hydrocephalus: What We Know and What Is Next."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      copy-number variant analyses, and genome-wide association studies showed risk
      variants enriched in NPH cohorts in or near CFAP43, SFMBT1, CWH43, AK9, RXFP2,
      PRKD1, HAVCR1, OTOG, MYO7A, NOTCH1, SPG11, MYH13, FOXJ1, AMZ1/GNA12, and C16orf95
    explanation: >-
      Places CFAP43 among the risk-enriched rather than established-causal genes for NPH,
      which is the typing used here.

- name: SFMBT1
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: SFMBT1
    term:
      id: hgnc:20255
      label: SFMBT1
  association: >-
    One of the recurrently reported NPH risk genes. Its mechanistic interest is that the
    NPH risk genes as a set converge on the blood-brain and blood-CSF barriers, cilia and
    ependymal function rather than on any single pathway, which is the class of biology
    the CSF-absorption node of this entry depends on.
  evidence:
  - reference: PMID:40266017
    reference_title: "Genetic Risk Factors in Normal Pressure Hydrocephalus: What We Know and What Is Next."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These genes are associated with blood-brain and blood-cerebrospinal fluid barriers,
      cilia, and ependymal function.
    explanation: >-
      The functional convergence of the risk-gene set, which is the reason this section is
      curated at all: it is mechanistically coherent with the absorption defect above.
  - reference: PMID:40266017
    reference_title: "Genetic Risk Factors in Normal Pressure Hydrocephalus: What We Know and What Is Next."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      copy-number variant analyses, and genome-wide association studies showed risk
      variants enriched in NPH cohorts in or near CFAP43, SFMBT1, CWH43, AK9, RXFP2,
      PRKD1, HAVCR1, OTOG, MYO7A, NOTCH1, SPG11, MYH13, FOXJ1, AMZ1/GNA12, and C16orf95
    explanation: >-
      Names SFMBT1 among the risk-enriched genes, which is the first sentence of this
      block's association and was previously supported only by the convergence claim.

inheritance:

- name: Polygenic susceptibility
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Idiopathic NPH is not Mendelian, but it is not sporadic either. Six genome-wide
    significant loci of modest effect have been replicated across two biobanks, and
    familial aggregation is reported in a tenth to a sixth of patients. The contributing
    loci named in the genetic section above are SLCO1A2, AMZ1/GNA12, MLLT10, CDCA2,
    C16orf95 and PLEKHG1 from the GWAS, alongside CFAP43, SFMBT1 and CWH43 from sequencing
    and copy-number studies. A separate CFAP43 Mendelian form shares the MONDO term and is
    not what this block describes.
  evidence:
  - reference: PMID:39141892
    reference_title: "Risk Variants Associated With Normal Pressure Hydrocephalus: Genome-Wide Association Study in the FinnGen Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified 6 gene regions significantly (p < 5.0e-8) associated with NPH that
      replicated in a meta-analysis with UKBB
    explanation: >-
      Six replicated common-variant loci of modest effect, which is a polygenic
      architecture rather than a Mendelian one.
  - reference: PMID:40266017
    reference_title: "Genetic Risk Factors in Normal Pressure Hydrocephalus: What We Know and What Is Next."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 30 familial cases were identified, and two cohorts found that 10%-16% of
      patients with NPH had relatives with NPH symptoms.
    explanation: >-
      Familial aggregation at a rate incompatible with a purely sporadic disorder and too
      high to be explained by the rare Mendelian form alone.

animal_models:

- name: AQP4-null mouse, kaolin-induced hydrocephalus
  species: Mouse
  genotype: Aqp4 null
  publication: PMID:16552421
  description: >-
    Obstructive hydrocephalus induced by cisterna magna kaolin injection in AQP4-deficient
    versus wild-type mice. The model exists here for one reason: it is the only evidence
    in this entry that manipulates AQP4 and observes the consequence, rather than
    observing AQP4 and the consequence together.
  modeled_mechanisms:
  - target: Perivascular AQP4 Depolarization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Genetic ablation of AQP4 is a clean loss of the water channel whose perivascular
      mislocalization this node models, and the consequence is more severe ventricular
      enlargement and higher intracranial pressure.
    limitations: >-
      The lesion is not the human one in two respects. Ablation removes AQP4 entirely
      rather than depolarizing it from the astroglial end-feet, and the hydrocephalus is
      kaolin-induced obstruction with intracranial pressure rising to 22 mm Hg, which is
      the opposite of the normal-pressure state that defines the human disease. The model
      therefore supports AQP4's role in CSF absorption without supporting AQP4 loss as the
      initiating event in idiopathic NPH.
    readouts:
    - name: Lateral ventricle volume at 3 and 5 days after kaolin injection
      target: Perivascular AQP4 Depolarization
      direction: INCREASED
      interpretation: >-
        Ventricular enlargement is greater without AQP4, placing the channel upstream of
        ventricular volume rather than alongside it.
      evidence:
      - reference: PMID:16552421
        reference_title: "Accelerated progression of kaolin-induced hydrocephalus in aquaporin-4-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Lateral ventricle volume increased to 3.7+/-0.5 and 5.1+/-0.5 mm(3) in AQP4 null
          mice at 3 and 5 days after injection, respectively, significantly greater than
          2.6+/-0.3 and 3.5+/-0.5 mm(3) in wildtype mice
        explanation: >-
          The quantitative ventricular measurement behind this readout.
    - name: Intracranial pressure at 3 days after kaolin injection
      target: Perivascular AQP4 Depolarization
      direction: INCREASED
      interpretation: >-
        Also the readout that bounds the model's relevance: pressure rises steeply here,
        whereas the human disease is defined by pressure staying normal.
      evidence:
      - reference: PMID:16552421
        reference_title: "Accelerated progression of kaolin-induced hydrocephalus in aquaporin-4-deficient mice."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The corresponding ICP was 22+/-2 mm Hg at 3 days in AQP4 null mice,
          significantly greater than 14+/-1 mm Hg in wildtype mice
        explanation: >-
          Supports the AQP4 effect and simultaneously documents the divergence from
          normal-pressure hydrocephalus, hence PARTIAL.
    evidence:
    - reference: PMID:16552421
      reference_title: "Accelerated progression of kaolin-induced hydrocephalus in aquaporin-4-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we provide evidence for AQP4-facilitated CSF absorption in hydrocephalus by
        a transparenchymal pathway into the cerebral vasculature.
      explanation: >-
        Supports treating this model as informative for an AQP4-dependent CSF absorption
        node.


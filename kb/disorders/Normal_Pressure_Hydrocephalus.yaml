diagnosis:

- name: MRI morphology (DESH pattern and callosal angle)
  description: >-
    MRI does two different jobs here and the entry separates them. It excludes the
    alternative causes of ventriculomegaly - which matters because the leading
    differential, Alzheimer disease, enlarges the ventricles by atrophy - and it
    identifies features that positively support idiopathic NPH: a reduced callosal angle
    and the disproportionately enlarged subarachnoid space hydrocephalus pattern, in which
    the sulci at the high convexity are effaced rather than widened.

    Their predictive value for treatment response is explicitly limited, which is why this
    entry curates them as diagnostic rather than prognostic and why the shunt-selection
    test below is a separate entry.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:42239999
    reference_title: "Idiopathic Normal Pressure Hydrocephalus: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI is essential to exclude alternative causes of ventriculomegaly and to identify
      characteristic imaging features such as a reduced callosal angle and the
      disproportionately enlarged subarachnoid space hydrocephalus (DESH) pattern, which
      support the diagnosis, although their predictive value for treatment response
      remains limited
    explanation: >-
      Both diagnostic roles and, in the same sentence, the hedge on prognostic use. Quoted
      whole rather than trimmed, because the hedge is the part that governs how this entry
      uses it.

- name: Cerebrospinal fluid outflow resistance
  description: >-
    The direct physiological readout of the absorption defect curated in the
    pathophysiology above: outflow resistance is pathologically elevated. That makes it
    the one diagnostic test in this entry that measures the mechanism rather than its
    consequences, and it is used both to diagnose and to select shunt candidates.
  diagnosis_term:
    preferred_term: cerebrospinal fluid outflow resistance measurement
  evidence:
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the resistance to CSF outflow (Rout) is pathologically elevated and has been widely
      used for the diagnosis of iNPH and the selection of candidates for shunting surgery.
    explanation: >-
      States the abnormality and both of its uses. This is the diagnostic counterpart of
      the Increased CSF Pulsatility with Impaired CSF Absorption node.

- name: Response to temporary cerebrospinal fluid drainage
  description: >-
    The shunt-selection test, and the one whose consequences run through this entry's
    knowledge gaps. Patients are taken to surgery on the basis of gait-velocity
    improvement after temporary drainage - which is what makes the 2025 trial's cohort
    enriched for gait responders before randomisation, and therefore why its cognitive
    null is weaker evidence than its gait positive.
  diagnosis_term:
    preferred_term: temporary cerebrospinal fluid drainage trial
  evidence:
  - reference: PMID:40960253
    reference_title: "A Randomized Trial of Shunting for Idiopathic Normal-Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conducted a double-blind, randomized, placebo-controlled trial involving
      participants selected for shunt surgery on the basis of gait-velocity improvement
      with cerebrospinal fluid (CSF) drainage.
    explanation: >-
      Establishes the test and, in the same sentence, that it was the enrolment gate -
      which is the fact the cognitive knowledge gap argues from.

treatments:

- name: Ventriculoperitoneal Shunt Placement
  description: >-
    Surgical diversion of CSF from the ventricle to the peritoneum, the standard therapy
    and the only treatment for idiopathic NPH. Uncontrolled series reported 60-80%
    improvement, which is what made the disease famous as a reversible dementia; two
    randomised placebo-controlled trials, using a valve set either open or effectively
    off, have since measured the effect against a blinded sham. Gait improves. The
    2025 trial found no separation from placebo on cognition or on incontinence, and the
    procedure carried more subdural bleeding and positional headache than placebo.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ventriculoperitoneal shunt placement
    term:
      id: NCIT:C168483
      label: Ventriculoperitoneal Shunt Placement
  target_mechanisms:
  - target: Ventriculomegaly at Normal Mean CSF Pressure
    treatment_effect: INHIBITS
    description: >-
      Diverting CSF relieves the ventricular distension and thereby the mechanical arm of
      the entry. It does not act on the glymphatic arm, which is the curated reason its
      benefit is confined to gait.
    evidence:
    - reference: PMID:40960253
      reference_title: "A Randomized Trial of Shunting for Idiopathic Normal-Pressure Hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among participants with idiopathic normal-pressure hydrocephalus who had a
        response to temporary CSF drainage, shunting resulted in significant improvements
        at 3 months in gait velocity and a measure of gait and balance but not in measures
        of cognition or incontinence.
      explanation: >-
        The placebo-controlled result, and the reason this treatment is curated as acting
        on the mechanical node alone.
  evidence:
  - reference: PMID:40960253
    reference_title: "A Randomized Trial of Shunting for Idiopathic Normal-Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      resulting in a treatment difference of 0.21 m per second (95% confidence interval,
      0.12 to 0.31; P<0.001)
    explanation: >-
      The gait-velocity effect size against blinded placebo.
  - reference: PMID:40960253
    reference_title: "A Randomized Trial of Shunting for Idiopathic Normal-Pressure Hydrocephalus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significantly greater improvement in the open-shunt group than the placebo group
      was seen for the Tinetti scale score (mean change, 2.9 points vs. 0.5 points; P =
      0.003) but not the MoCA score (1.3 points vs. 0.3 points) or the Overactive Bladder
      Questionnaire score (-3.3 points vs. -1.5 points).
    explanation: >-
      PARTIAL because it supports the treatment for one arm of the triad and refutes it
      for the other two at this time point. This is the single most important evidence
      item in the entry.
  - reference: PMID:40960253
    reference_title: "A Randomized Trial of Shunting for Idiopathic Normal-Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more participants in the open-shunt group having subdural bleeding (12% vs. 2%) and
      positional headaches (59% vs. 28%)
    explanation: >-
      The harms measured against blinded placebo, which the uncontrolled series could not
      isolate.
  - reference: PMID:36700738
    reference_title: "Placebo-Controlled Effectiveness of Idiopathic Normal Pressure Hydrocephalus Shunting: A Randomized Pilot Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The estimated treatment difference was 0.22 m/s
    explanation: >-
      The earlier pilot found a gait effect of almost identical magnitude but did not
      reach significance in 18 patients, which is why it is PARTIAL and why the larger
      trial was needed.
  - reference: PMID:36700738
    reference_title: "Placebo-Controlled Effectiveness of Idiopathic Normal Pressure Hydrocephalus Shunting: A Randomized Pilot Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 4-month treatment delay did not reduce the subsequent response to active
      shunting, nor did it increase the adverse advents rate at 12 months.
    explanation: >-
      Establishes that the placebo arm was not harmed by the delay, which is what made the
      larger placebo-controlled trial ethically tractable.
  - reference: PMID:33242372
    reference_title: "Pathogenesis and pathophysiology of idiopathic normal pressure hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of ventricular shunting, mostly the ventriculoperitoneal shunting, was
      proved to be successful in alleviating symptoms in approximately 60%‐80% patients.
    explanation: >-
      The uncontrolled figure that the placebo-controlled trials were designed to test.
  - reference: PMID:40054973
    reference_title: "Guidelines for Diagnosis and Management of Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Afterward the adoption of shunt treatment without clear diagnostic criteria and
      surgical techniques resulted in poor outcomes with significant complications.
    explanation: >-
      Why this treatment's effect is inseparable from patient selection: shunting applied
      without selection criteria performed badly.
  - reference: PMID:40054973
    reference_title: "Guidelines for Diagnosis and Management of Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both guidelines led to diagnosis and treatment algorithms and significantly improved
      outcomes, along with decreased surgical risk.
    explanation: >-
      Establishes that the reported success of shunting is a property of the selected
      population, which is the caveat carried into the discussions below.
  - reference: PMID:37004132
    reference_title: "The impact of cerebrospinal fluid shunting on quality of life in idiopathic normal pressure hydrocephalus: a long-term analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      QOL improved in 103/130 (79%) patients through 5 years after shunt surgery, although
      it remained lower than that of the control group
    explanation: >-
      Benefit on a patient-centred measure, and its ceiling: shunted patients improved but
      did not reach the control group.
  - reference: PMID:37004132
    reference_title: "The impact of cerebrospinal fluid shunting on quality of life in idiopathic normal pressure hydrocephalus: a long-term analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SF-36 score reduced progressively, reaching baseline at 5-7 years of follow-up
      and decreased to below baseline at 7-11 years of follow-up
    explanation: >-
      The durability limit. Quality of life returns to baseline within five to seven years
      and falls below it thereafter, so reversibility in this disease is a statement about
      a time window, not a cure. Curated as PARTIAL for the same reason.

differential_diagnoses:

- name: Alzheimer disease
  description: >-
    The leading differential, and not merely a look-alike: the two disorders share
    amyloid-beta deposition, perivascular astrogliosis, AQP4 mislocalization and sleep
    disturbance, and this entry curates the shared glymphatic mechanism explicitly. Most
    patients with idiopathic NPH are said to be misdiagnosed with it. Ventriculomegaly
    does not settle the question, since severe cortical atrophy enlarges the ventricles
    too. The practical stake is that CSF diversion helps one and not the other.
  evidence:
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For these reasons, AD has become the leading differential diagnosis to iNPH
    explanation: >-
      Names Alzheimer disease as the leading differential.
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most notably, CSF diversion confers no symptomatic relief to patients with AD
    explanation: >-
      The therapeutic stake in distinguishing them.

- name: Ventricular enlargement secondary to cortical atrophy
  description: >-
    Sometimes called pseudo-NPH. Ventricular volume rises passively as parenchyma is lost,
    without the CSF-dynamic derangement curated here, and shunting has nothing to relieve.
    The high-convexity sulcal narrowing seen in idiopathic NPH is the imaging feature that
    separates the two, since atrophy widens sulci rather than effacing them.
  evidence:
  - reference: PMID:31959516
    reference_title: "Glymphatic System Impairment in Alzheimer's Disease and Idiopathic Normal Pressure Hydrocephalus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ventricular enlargement can also be seen in AD as a result of severe cerebral
      atrophy, further complicating radiographic recognition of iNPH
    explanation: >-
      States the confound this differential turns on.

discussions:

- discussion_id: gap_cognitive_arm_unresponsive_to_shunting
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the cognitive impairment of idiopathic normal pressure hydrocephalus caused by the
    hydrocephalus at all, or is it concurrent Alzheimer-type pathology that a shunt cannot
    reach?
  attaches_to:
  - pathophysiology#Impaired Glymphatic CSF-ISF Exchange and Solute Clearance
  - pathophysiology#Interstitial Amyloid-beta Accumulation
  - treatments#Ventriculoperitoneal Shunt Placement
  rationale: >-
    Idiopathic NPH is the standard example of a reversible dementia, and that reputation
    rests on uncontrolled series reporting 60-80% improvement. When the comparison was
    finally made against a blinded placebo valve, gait velocity and the Tinetti score
    separated and the cognitive measure did not - 1.3 points against 0.3 on the MoCA in 99
    patients.

    Three readings are consistent with what this entry curates and are not distinguished
    by it. The cognitive deficit may be genuinely hydrocephalic but slower to recover than
    three months, in which case the trial's endpoint is simply early. It may be driven by
    the glymphatic and amyloid arm curated here, which a shunt does not act on - the
    reading this entry's structure favours, and the one that the correlation between
    cortical amyloid burden and poor shunt responsiveness supports. Or the cohort may
    contain concurrent Alzheimer disease that no CSF diversion could help, which the
    entry's own leading differential makes unavoidable as a possibility.

    A fourth consideration cuts across all three, and it is a property of the trial rather
    than of the disease: participants were selected for surgery on the basis of
    gait-velocity improvement with temporary CSF drainage. The cohort was therefore
    enriched for gait responders before randomisation, so the trial is better powered to
    detect the effect it found than the one it did not, and its cognitive null is weaker
    evidence than its gait positive is. The guidelines literature makes the same point in
    reverse: shunting applied without selection criteria performed badly, so selection is
    not an incidental design choice but the thing that makes the operation work.

    These are not equivalent for practice. Under the second and third, a patient selected
    for shunting on gait grounds should not be promised cognitive recovery, and the
    disease's reputation as reversible dementia is a claim about one third of the triad.
  proposed_experiments:
  - experiment_id: amyloid_pet_stratified_shunt_outcome
    name: Amyloid-stratified randomised shunt trial with extended cognitive follow-up
    description: >-
      Stratify a placebo-controlled shunt trial by amyloid PET status at baseline and
      follow cognition to 12 months. If the amyloid-negative stratum shows cognitive
      separation and the amyloid-positive stratum does not, the deficit is hydrocephalic
      and the pooled null reflects co-pathology. If neither separates at any time point,
      the cognitive arm is not shunt-responsive in either group.

- discussion_id: gap_urinary_arm_mechanism_versus_trial
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does the urinary arm not respond to shunting, when it is derived from the same
    periventricular lesion as the gait arm that does?
  attaches_to:
  - pathophysiology#Periventricular White Matter Compression and Stretch Injury
  - treatments#Ventriculoperitoneal Shunt Placement
  rationale: >-
    The mechanical account curated in this entry derives gait failure and urinary
    incontinence from one lesion: stretch of somatotopically arranged corticospinal
    fibres, with the leg and sacral fibres nearest the expanding ventricle. If that is
    right, relieving the distension should move both.

    It moved one. In the 99-patient trial the Overactive Bladder Questionnaire did not
    separate from placebo, while gait velocity did so decisively. Awkwardly, the earlier
    18-patient pilot found the opposite on this arm: the overactive-bladder symptom bother
    score improved significantly in the open-shunt group at four months, on the smaller
    sample and the weaker gait signal.

    So the two randomised trials disagree about the bladder in the direction opposite to
    their disagreement about gait, which is hard to explain by power alone. The
    possibilities include instrument sensitivity - both trials measured symptom bother
    rather than incontinence episodes or urodynamics - and a genuinely different
    reversibility for the sacral fibres. Neither is settled, and the entry curates the
    conventional sacral-fibre derivation with this discussion attached rather than
    silently dropping it.
  proposed_experiments:
  - experiment_id: urodynamic_endpoint_shunt_trial
    name: Randomised shunt trial with urodynamic rather than questionnaire endpoints
    description: >-
      Repeat the placebo-controlled design with pre-specified urodynamic measurement
      (detrusor overactivity, cystometric capacity) alongside the symptom questionnaire,
      to establish whether the null bladder result reflects an unresponsive mechanism or
      an insensitive instrument.

- discussion_id: gap_aqp4_depolarization_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is perivascular AQP4 depolarization specific to idiopathic normal pressure
    hydrocephalus, or is it a feature of normal ageing that any elderly cohort would show?
  attaches_to:
  - pathophysiology#Perivascular AQP4 Depolarization
  rationale: >-
    The tissue evidence for the glymphatic arm of this entry is a comparison of cortical
    biopsies from 30 patients with idiopathic NPH against 12 reference subjects. The
    source that reports it also states that progressive AQP4 depolarization occurs
    throughout physiological ageing, and that age-matched human studies are needed to
    establish specificity.

    That caveat lands on the arm of this entry with the least redundancy. Idiopathic NPH
    is a disease of the eighth and ninth decades and its trigger node is age-related loss
    of compliance, so an ageing-associated finding in an aged cohort is exactly the
    confound that cannot be ruled out from a case-control design without age matching. If
    the depolarization is ageing rather than disease, the glymphatic arm loses its
    disorder-specific molecular anchor and the conformance declared here should be
    reconsidered - not the module's validity, but this entry's claim on it.
  proposed_experiments:
  - experiment_id: age_matched_aqp4_biopsy_comparison
    name: Age-matched cortical AQP4 polarization comparison
    description: >-
      Quantify perivascular AQP4 polarization by immunogold cytochemistry in idiopathic
      NPH cortical biopsies against age-matched controls and against age-matched patients
      with other neurodegenerative disease, to separate disease-associated from
      ageing-associated depolarization.

notes: >-
  Scope. This entry curates idiopathic normal pressure hydrocephalus, the form in which
  the CSF-dynamic derangement has no identified antecedent. Secondary normal pressure
  hydrocephalus following haemorrhage, meningitis or trauma shares the ventriculomegaly
  and much of the mechanical arm but has a known cause, and is not curated here.

  Pathograph shape, stated precisely. Seven pathophysiology nodes and five phenotypes are
  joined by eleven `downstream` edges into one connected component; counting the shunt's
  `target_mechanisms` link and the AQP4-null mouse's `modeled_mechanisms` link, that
  component is fourteen nodes and thirteen edges. An earlier version of this sentence said
  twelve edges, which is neither count. The five phenotypes are attached to the arm
  that produces them, which is the point of the entry: gait and the bladder arm hang off
  the periventricular lesion, cognition off the amyloid node, and the imaging phenotype
  off ventriculomegaly itself. An earlier version left them unattached, so the entry's
  central claim - which arm each element of the triad belongs to - lived only in prose and
  was invisible to anything reading the graph.

  The three `genetic:` entries are deliberately not part of that component, and the reason
  is a curation judgement rather than a schema limitation. An earlier version of this note
  claimed the latter and was wrong. `Genetic` has no `downstream` slot, but that is not the
  only route into the pathograph: graph.py indexes pathophysiology nodes by the genes named
  in their descriptors and emits a contributes_to edge whenever a `genetic:` entry's gene
  matches, and SUSCEPTIBILITY is not among the relationship types excluded from that
  inference. Wiring these loci in would take one `genes:` descriptor on a node.

  They are left unwired because the mechanistic step is not established. The GWAS gives
  replicated loci at the population level, and the systematic review gives a functional
  convergence for the risk-gene set as a whole - barriers, cilia, ependymal function - but
  neither says that SLCO1A2, CFAP43 or SFMBT1 acts on CSF absorption in particular.
  Attaching them to that node would assert a per-gene mechanism the sources do not make,
  and the convergence claim is already curated where it belongs, on the SFMBT1 entry.

  Reversibility is a time window. The disease's reputation rests on symptom reversal after
  shunting, and that reversal is real on the gait arm against blinded placebo. On a
  patient-centred measure it is also finite: quality of life improves in about four fifths
  of shunted patients, never reaches that of controls, returns to baseline at five to
  seven years and falls below it thereafter. The entry curates that trajectory rather than
  the headline, because the headline is what makes idiopathic NPH the standard example of
  reversible dementia.

  Why two arms. The mechanical and glymphatic chains are curated as one connected
  pathograph rather than as competing accounts because the sources treat them as
  mutually reinforcing, and because separating them is what makes the trial result
  legible: shunting acts on the mechanical arm and the mechanical arm is where gait sits.
  The reinforcing edge from glymphatic impairment back to ventriculomegaly is curated as
  indirect with unknown intermediates and PARTIAL evidence, because the human support for it is a correlation
  between an imaging surrogate and ventricular volume in a small study and the direction
  is not established.

  Glymphatic conformance. Three nodes declare conformance to the glymphatic_dysfunction
  module. The decision was argued from evidence rather than from topic adjacency: the
  anchor is the AQP4 immunogold measurement in idiopathic NPH cortical biopsies, which is
  human tissue rather than an imaging index. The module carries an explicit knowledge gap
  warning that a low perivascular-diffusivity index is not a measurement of glymphatic
  dysfunction, and that caution is honoured here - the ALPS findings are curated as
  PARTIAL support for a correlation, never as a measurement of transport. Conformance is
  not declared for the module's sleep node, because no sleep measurement in idiopathic
  NPH is cited in the sources used here; the sleep disturbance is mentioned only as a
  feature shared with Alzheimer disease.

  Clinical trial record. The 2025 randomised trial is registered as NCT05081128 (PENS).
  No clinical_trials entry is curated for it because the ClinicalTrials.gov fetch failed
  in this environment on TLS certificate verification, and reference cache files must
  never be hand-created. The trial's design and results are fully covered by
  PMID:40960253, which is cached and quoted throughout. The trial entry should be added
  once the identifier can be fetched.

  Terminology. HP:0002343 (Normal pressure hydrocephalus) exists alongside
  MONDO:0009366, so this is one of the disease-like phenotypes that carries both. It is
  not annotated as a phenotype of itself here. Whether the mechanism curated above should
  eventually be lifted into a module in the manner of the other dual-identifier entries
  is left open; there is currently one disorder to conform to it.

  MONDO:0009366 covers two entities. Its definition is the acquired clinical syndrome,
  attributing the absorption defect to antecedents such as subarachnoid haemorrhage and
  chronic meningitis. The same term nevertheless carries the synonym "hydrocephalus,
  normal pressure, 1", the xref OMIM:236690, an is_a edge to hereditary neurological
  disease, and a causal-gene relation RO:0004003 to CFAP43. So the term simultaneously
  names the common idiopathic syndrome curated here and the OMIM-numbered CFAP43
  Mendelian form, which is a distinct entity with a distinct mechanism. This entry curates
  the idiopathic syndrome; the CFAP43 Mendelian form is not curated here.

  The genetic section is typed SUSCEPTIBILITY throughout, deliberately. Idiopathic NPH has
  a real and replicated common-variant architecture - six genome-wide significant loci
  across two biobanks, with familial aggregation in a tenth to a sixth of patients - and
  the risk-gene set converges on the blood-brain and blood-CSF barriers, cilia and
  ependymal function, which is the biology the absorption node above depends on. None of
  that makes any of these genes causative for the common syndrome. CFAP43 in particular is
  typed SUSCEPTIBILITY here even though MONDO records it as the causal gene of this term,
  because the term's causal-gene relation belongs to the Mendelian entity discussed above
  and the systematic review places CFAP43 among risk-enriched rather than
  established-causal genes for NPH. Curating the CFAP43 Mendelian form properly is
  separate work and, given the term's dual character, probably belongs in a separate entry.
  That cannot be queued as a stub, because a stub needs its own mondo_id and the only
  available one is this term, which is now curated - the absence of a distinct identifier
  is the problem rather than an obstacle to recording it. Tracked as issue #9225 instead.

  Only three of the reported risk genes are curated as structured entries. The remaining
  GWAS loci (AMZ1/GNA12, MLLT10, CDCA2, C16orf95, PLEKHG1) and sequencing hits (CWH43 and
  the longer list in the review) are named in the inheritance block rather than given
  their own entries, because the evidence for each is a single locus-level association
  and expanding them would multiply structure without adding a mechanistic claim the
  entry can act on.

  Not used. A PubMed All Fields search for GeneReviews coverage returned chapters on
  unrelated Mendelian disorders; the idiopathic syndrome curated here is not Mendelian and
  has no GeneReviews chapter, so no GeneReviews baseline applies.

  Deep-research provenance and its limits. The candidate reference set was drawn from a
  claude_code deep-research report, which was used as a lead generator only: every claim
  in this entry was written from the cached primary reference after reading it, not from
  the report's summary of it. The report-level reference validation could not be run in
  this environment - both `just validate-research-reference` and the ClinicalTrials.gov
  fetch fail on TLS certificate verification through the outbound proxy - so that report
  carries no Reference Validation section. The KB-level checks, which are the ones that
  govern what is asserted here, were all run: all eleven cited references were fetched
  individually into the cache and all 54 evidence snippets verify against it.

  The NEC preflight against MONDO:0009366 returns WARN rather than PASS, and the reason
  is worth recording because it is a false positive of a check worth keeping. The tool
  compares gene-mention frequency against MONDO's canonical causal gene, finds CFAP43 at
  6 mentions against AQP4 at 16, and warns that a second disease entity may be mixed in.
  AQP4 here is not a rival disease's gene but the astroglial water channel that is the
  molecular substrate of the glymphatic arm curated above, and the next most frequent
  symbols (SFMBT1, CWH43, DNAH14) are all reported idiopathic-NPH candidate genes rather
  than another disease's. The report mentions iNPH 67 times and neuromyelitis optica, the
  disease AQP4 is otherwise famous for, not once. The asymmetry the check detected is
  real; it reflects a mechanism gene dominating a mechanism report about a
  non-Mendelian disease, compounded by MONDO recording a causal gene for the Mendelian
  entity that shares the term.


animal_models:
- name: Chimeric Gibbin CRISPR mutant mouse
  species: Mouse
  genotype: Chimeric CRISPR-generated Ahdc1 (Gibbin) mutants
  publication: PMID:35585237
  description: >-
    In vivo chimeric CRISPR mutants show Gibbin-dependent developmental
    patterning defects of craniofacial structure, abdominal wall closure and
    epidermal stratification.
  modeled_mechanisms:
  - target: Dysregulated Gibbin-Dependent Mesodermal Gene Expression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Reproduces developmental patterning defects attributed to loss of Gibbin mesodermal function.
    limitations: >-
      Chimeric mosaic mutants rather than germline heterozygotes carrying a
      patient truncation; neurodevelopmental and sleep phenotypes were not the
      focus of the study.
    evidence:
    - reference: PMID:35585237
      reference_title: "Gibbin mesodermal regulation patterns epithelial development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vivo chimeric CRISPR mouse mutants reveal a spectrum of Gibbin-dependent developmental patterning defects affecting craniofacial structure, abdominal wall closure and epidermal stratification that mirror patient phenotypes."
      explanation: Mouse phenotypes reported for Gibbin mutants.
- name: Ahdc1-deficient mouse
  species: Mouse
  genotype: Ahdc1-deficient (CRISPR/Cas9)
  publication: PMID:37819197
  description: >-
    Ahdc1-deficient mice of both sexes develop adiposity from weaning and
    obesity with reduced energy expenditure, hyperleptinemia, insulin
    resistance and fatty liver. Obesity is not an established feature of XGS,
    so the relevance of this phenotype to the human disorder is unclear.
  evidence:
  - reference: PMID:37819197
    reference_title: "Ahdc1 is a potent regulator of obesity and energy metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ahdc1 deficiency in both male and female mice led to adiposity from weaning and obesity characterized by reduced energy expenditure and respiratory quotient"
    explanation: Metabolic phenotype of the Ahdc1-deficient mouse.
- name: ahdc1 loss-of-function zebrafish
  species: Zebrafish
  genotype: ahdc1 4-bp insertion (CRISPR/Cas9)
  publication: PMID:37054903
  description: >-
    A CRISPR/Cas9 zebrafish line carrying a loss-of-function insertion in the
    ahdc1 ortholog, established together with patient-derived iPSC lines as a
    resource for studying XGS. Heterozygotes are fertile; no disease-relevant
    phenotype was reported in the resource paper.
  evidence:
  - reference: PMID:37054903
    reference_title: "Establishment of iPSC lines and zebrafish with loss-of-function AHDC1 variants: Models for Xia-Gibbs syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The zebrafish model has an insertion of four base pairs in the ahdc1 gene, is fertile, and breeding between heterozygous and wild-type (WT) animals generated offspring in a genotypic proportion in agreement with Mendelian law."
    explanation: Describes the zebrafish model resource.
discussions:
- discussion_id: xgs_downstream_mechanism_gap
  prompt: >-
    What molecular and cellular events connect a heterozygous AHDC1 truncation
    to abnormal brain development, intellectual disability and hypotonia?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Brain Development
  - pathophysiology#AHDC1 Truncating Variant
  rationale: >-
    AHDC1 is a nuclear AT-hook protein whose loss alters DNA methylation and
    mesodermal gene expression in stem-cell-derived skin organoids, and patient
    truncations mislocalize when overexpressed in cell lines. Neither result
    was obtained in neural cells, and no study has identified AHDC1 target
    genes or a cellular defect in the developing brain, so every edge into
    the neurodevelopmental phenotypes in this entry has unknown intermediates.
    Patient-derived iPSC lines now exist and could be differentiated into
    neural lineages to test this.
  evidence:
  - reference: PMID:37054903
    reference_title: "Establishment of iPSC lines and zebrafish with loss-of-function AHDC1 variants: Models for Xia-Gibbs syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Xia-Gibbs syndrome (XGS) is a syndromic form of intellectual disability caused by heterozygous AHDC1 variants, but the pathophysiological mechanisms underlying this syndrome are still unclear."
    explanation: States that the pathophysiological mechanism is unresolved.
- discussion_id: xgs_allelic_mechanism_controversy
  prompt: >-
    Do AHDC1 truncating variants cause XGS through haploinsufficiency or
    through a dominant-negative or other gain-of-function effect of the
    truncated protein?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#AHDC1 Truncating Variant
  - genetic#AHDC1
  rationale: >-
    ClinGen records haploinsufficiency as the disease mechanism, but the single
    coding exon predicts escape from nonsense-mediated decay (confirmed in one
    patient's sample), missense variants
    cluster in conserved domains, truncated proteins mislocalize in a
    position-dependent way, and a deletion of one allele did not lower total
    AHDC1 expression in blood. Conversely, small de novo deletions removing the
    coding region or most of the 5' UTR have been taken as evidence for
    haploinsufficiency. These observations are compatible with a
    dominant-negative component, and different alleles may act differently.
  evidence:
  - reference: PMID:34950897
    reference_title: "AHDC1 missense mutations in Xia-Gibbs syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The mechanism by which AHDC1 mutations result in XGS is unknown, and there have been prior suggestions of both haploinsufficiency and dominant negative effects."
    explanation: States both proposed mechanisms and that neither is established.
  - reference: PMID:34950897
    reference_title: "AHDC1 missense mutations in Xia-Gibbs syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, the report here and from prior missense mutations supports the dominant negative model, but it does not exclude that both haploinsufficiency (LoF) and dominant negative (GoF) mechanisms could be at play, depending on the primary mutation."
    explanation: The missense series' own conclusion favours, without establishing, a dominant-negative model.
  - reference: PMID:39359946
    reference_title: "De novo AHDC1 Deletions Identified by Genome Sequencing in Two Individuals with Xia-Gibbs Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, our data provide additional evidence of AHDC1 haploinsufficiency as a disease mechanism in XGS."
    explanation: Small de novo deletions of AHDC1 (whole coding region; most of the 5' UTR) in individuals with XGS features support haploinsufficiency.
  - reference: PMID:41653504
    reference_title: "Clinical and molecular profiles of patients with Xia-Gibbs syndrome: a cohort in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one patient with a frameshift variant, escape from nonsense-mediated mRNA decay was confirmed using the patient's sample."
    explanation: Direct demonstration in patient material that a truncating AHDC1 transcript escapes nonsense-mediated decay.

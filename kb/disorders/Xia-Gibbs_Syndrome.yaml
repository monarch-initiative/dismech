diagnosis:
- name: Exome Sequencing for AHDC1 Variants
  description: >-
    Because the clinical features are nonspecific, diagnosis is made
    molecularly, by identifying a heterozygous AHDC1 variant predicted to
    truncate the protein (or a de novo missense variant in a conserved region)
    in an individual with suggestive features, usually by exome or multigene
    panel sequencing.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34902026
    reference_title: "Xia-Gibbs Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of XGS is established in a proband with suggestive clinical findings and a heterozygous pathogenic variant in AHDC1 that is predicted to lead to a truncated protein, identified by molecular genetic testing"
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:29696776
    reference_title: "The phenotypic spectrum of Xia-Gibbs syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "making DNA testing and the establishment of molecular diagnosis the primary diagnostic tool for XGS"
    explanation: The nonspecific phenotype makes molecular testing the primary route to diagnosis.
differential_diagnoses:
- name: Contiguous 1p36.11 Deletion Including AHDC1
  description: >-
    Large interstitial deletions of 1p36.11-p35.3 that include AHDC1 and
    neighbouring genes cause a neurodevelopmental phenotype overlapping XGS;
    their pathogenic relationship to AHDC1 loss is uncertain.
  evidence:
  - reference: PMID:36054313
    reference_title: "Long read sequencing and expression studies of AHDC1 deletions in Xia-Gibbs syndrome reveal a novel genetic regulatory mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Large de novo heterozygous deletions that encompass the AHDC1 gene have also been ascribed as diagnostic for the disorder, without substantial evidence to support their pathogenicity."
    explanation: Describes the uncertain status of contiguous deletions relative to XGS.
- name: Craniosynostosis Syndromes, Connective Tissue Disorders and Mitochondrial Disorders
  description: >-
    Individual XGS patients with additional features (craniosynostosis, loose
    skin, multisystem involvement) were initially evaluated for these broad
    disease groups before exome sequencing identified AHDC1 variants.
  evidence:
  - reference: PMID:30152016
    reference_title: "Variable Clinical Manifestations of Xia-Gibbs syndrome: Findings of Consecutively Identified Cases at a Single Children's Hospital."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differential diagnoses considered for each patient were quite broad, and included craniosynostosis syndromes, connective tissue disorders, and mitochondrial disorders."
    explanation: Single-center case series lists the differential diagnoses considered.

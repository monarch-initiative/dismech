name: Xia-Gibbs Syndrome
creation_date: "2026-10-29T18:16:21Z"
category: Mendelian
description: >-
  Xia-Gibbs syndrome (XGS) is a rare autosomal dominant neurodevelopmental
  disorder caused by heterozygous pathogenic variants in AHDC1 (1p36.11), which
  encodes the AT-hook DNA-binding motif containing protein 1 (Gibbin). Most
  variants are de novo nonsense or frameshift changes predicted to truncate the
  protein; de novo missense variants clustering near the second AT-hook and a
  REV3L-homologous region, and rare mosaic cases, have also been reported.
  Affected individuals present in infancy with hypotonia and delayed motor
  milestones, followed by speech delay (often severely limited or absent
  speech) and intellectual disability. Variable features include obstructive
  sleep apnea, structural brain anomalies (hypoplasia of the corpus callosum,
  posterior fossa or retrocerebellar cysts), seizures, ataxia and other movement
  disorders, autism spectrum features, strabismus, scoliosis, short stature,
  laryngomalacia and nonspecific mild facial dysmorphism. AHDC1 is a nuclear
  protein of largely undefined function; how its truncation produces the
  neurodevelopmental phenotype is not known.
synonyms:
- AHDC1-related intellectual disability - obstructive sleep apnea - mild dysmorphism syndrome
- XGS
- Autosomal dominant intellectual disability 25
parents:
- Syndromic Intellectual Disability
- Mendelian Neurodevelopmental Disorder
notes: >-
  OMIM #615829. The clinical picture is nonspecific, and the original
  description was gene-first: the four probands were grouped by their shared
  de novo AHDC1 truncations rather than by a recognizable gestalt. A latent
  class analysis of 85 published cases (PMID:39648204) proposed ataxia, sleep
  apnea plus short stature, and neuropsychological phenotypic clusters; these
  are descriptive groupings of a heterogeneous phenotype and are not recorded
  here as subtypes.

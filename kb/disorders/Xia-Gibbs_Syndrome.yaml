genetic:
- name: AHDC1
  gene_term:
    preferred_term: AHDC1
    term:
      id: hgnc:25230
      label: AHDC1
  association: Pathogenic Mutations
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    AHDC1 has a single protein-coding exon, so truncating mRNAs are predicted
    to escape nonsense-mediated decay. Whether disease results from
    haploinsufficiency (the mechanism ClinGen records), a dominant-negative or
    other gain-of-function effect of truncated protein, or different mechanisms
    for different alleles is unresolved. Large deletions spanning AHDC1 and
    neighbouring 1p36.11 genes have been reported in individuals with XGS-like
    features, but in one such individual blood AHDC1 expression was not
    reduced, so their contribution is uncertain.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_59a6c010-95ac-4813-9cf4-5ff60fa5c7e9-2021-11-16T170000.000Z
    evidence:
    - reference: CGGV:assertion_59a6c010-95ac-4813-9cf4-5ff60fa5c7e9-2021-11-16T170000.000Z
      reference_title: "AHDC1 / AHDC1-related intellectual disability - obstructive sleep apnea - mild dysmorphism syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "AHDC1 | HGNC:25230 | AHDC1-related intellectual disability - obstructive sleep apnea - mild dysmorphism syndrome | MONDO:0014358 | AD | Definitive"
      explanation: ClinGen Intellectual Disability and Autism GCEP classifies the AHDC1-XGS relationship as Definitive (autosomal dominant).
  evidence:
  - reference: PMID:24791903
    reference_title: "De novo truncating mutations in AHDC1 in individuals with syndromic expressive language delay, hypotonia, and sleep apnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using WES, we identified AHDC1 de novo truncating mutations that most likely cause this genetic syndrome."
    explanation: Gene discovery report establishing de novo AHDC1 truncations as the cause.
  - reference: PMID:34950897
    reference_title: "AHDC1 missense mutations in Xia-Gibbs syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, de novo missense variants in AHDC1 are likely diagnostic of XGS when in silico analysis of their position relative to conserved regions is considered together with disease trait manifestations."
    explanation: Extends the allelic spectrum to de novo missense variants clustering in conserved regions.
  - reference: PMID:36054313
    reference_title: "Long read sequencing and expression studies of AHDC1 deletions in Xia-Gibbs syndrome reveal a novel genetic regulatory mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantification of RNA expression patterns in whole blood revealed that AHDC1 exhibited a mono-allelic expression pattern with no deficiency in overall AHDC1 expression levels, in contrast to the other deleted genes, which exhibited a 50% reduction in mRNA expression."
    explanation: Shows that a deletion removing one AHDC1 allele need not reduce total AHDC1 expression, complicating a simple haploinsufficiency model for deletions.
  - reference: PMID:39359946
    reference_title: "De novo AHDC1 Deletions Identified by Genome Sequencing in Two Individuals with Xia-Gibbs Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, our data provide additional evidence of AHDC1 haploinsufficiency as a disease mechanism in XGS."
    explanation: Small de novo deletions of AHDC1 (whole coding region; most of the 5' UTR) in individuals with XGS features support haploinsufficiency.
pathophysiology:
- name: AHDC1 Truncating Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous, usually de novo, nonsense or frameshift variant in the
    single coding exon of AHDC1. Because the variant lies in the last (only)
    coding exon, the mutant transcript is predicted to escape nonsense-mediated
    decay and could encode a truncated protein lacking the AT-hook DNA-binding
    motifs and conserved regions downstream of the truncation. Escape from
    nonsense-mediated decay has been confirmed in one patient's sample. Whether the
    variant acts through loss of function or a dominant-negative effect has not
    been established.
  genes:
  - preferred_term: AHDC1
    term:
      id: hgnc:25230
      label: AHDC1
  molecular_functions:
  - preferred_term: AT-hook DNA binding
    term:
      id: GO:0003677
      label: DNA binding
  genetic_context:
    allele_type: protein-truncating (nonsense or frameshift)
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:24791903
    reference_title: "De novo truncating mutations in AHDC1 in individuals with syndromic expressive language delay, hypotonia, and sleep apnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AHDC1 has two AT-hook DNA-binding motifs located at codons 396–408 and 544–556, contained in conserved region 1."
    explanation: Locates the AT-hook DNA-binding motifs that truncating variants upstream of them remove.
  - reference: PMID:24791903
    reference_title: "De novo truncating mutations in AHDC1 in individuals with syndromic expressive language delay, hypotonia, and sleep apnea."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "AT-hook domains are DNA-binding motifs that act to fasten proteins to AT-rich sequences in DNA."
    explanation: >-
      Grounds the DNA-binding molecular function on the motif class AHDC1
      carries; DNA binding by AHDC1 itself, and its loss in truncated forms,
      has not been measured directly.
  - reference: PMID:41653504
    reference_title: "Clinical and molecular profiles of patients with Xia-Gibbs syndrome: a cohort in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one patient with a frameshift variant, escape from nonsense-mediated mRNA decay was confirmed using the patient's sample."
    explanation: Direct demonstration in patient material that a truncating AHDC1 transcript escapes nonsense-mediated decay.
  - reference: PMID:24791903
    reference_title: "De novo truncating mutations in AHDC1 in individuals with syndromic expressive language delay, hypotonia, and sleep apnea."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given that each mutation identified here occurs in a single coding exon, the modified mRNA might escape nonsense-mediated decay,22 suggesting that the autosomal-dominant mode of inheritance of these mutations is possibly due to the formation of dominant-negative proteins rather than haploinsufficiency."
    explanation: Raises NMD escape and a dominant-negative mechanism as a hypothesis from gene structure; not tested experimentally in the report.
  downstream:
  - target: Abnormal Nuclear Localization of Truncated AHDC1
    causal_link_type: DIRECT
    description: >-
      When expressed in human cell lines, patient-derived truncated AHDC1
      proteins distribute abnormally in the nucleus, with the pattern depending
      on where the truncation falls.
    evidence:
    - reference: PMID:33644933
      reference_title: "Phenotypic and protein localization heterogeneity associated with AHDC1 pathogenic protein-truncating alleles in Xia-Gibbs syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transient expression of wild type and different patient truncated AHDC1 protein forms in human cell lines revealed abnormal patterns of nuclear localization including a diffuse distribution of a short truncated form and nucleolar aggregation in mid-protein truncated forms."
      explanation: Overexpression of patient truncations produces position-dependent mislocalization.
  - target: Dysregulated Gibbin-Dependent Mesodermal Gene Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of Gibbin in human embryonic stem cell-derived organoids disrupts
      mesodermal gene expression. The study used engineered Gibbin-mutant
      cells and chimeric mice, so it shows the consequence of losing Gibbin
      rather than of a specific heterozygous patient allele.
    evidence:
    - reference: PMID:35585237
      reference_title: "Gibbin mesodermal regulation patterns epithelial development."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The loss of Gibbin causes an increase in DNA methylation at GATA3-dependent mesodermal genes, resulting in a loss of signalling between developing dermal and epidermal cell types."
      explanation: Links loss of the AHDC1 product to altered methylation and expression of mesodermal genes in a stem-cell system.
  - target: Disrupted Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      De novo AHDC1 truncation is associated with structural brain anomalies
      and a neurodevelopmental phenotype, but no molecular or cellular step
      between the variant and abnormal brain development has been demonstrated.
    evidence:
    - reference: PMID:24791903
      reference_title: "De novo truncating mutations in AHDC1 in individuals with syndromic expressive language delay, hypotonia, and sleep apnea."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "All probands had prior brain MRI demonstrating hypoplasia of the corpus callosum. Simplification of the gyral pattern and delayed myelination were also observed."
      explanation: Every proband with an AHDC1 truncation in the original report had abnormal brain imaging; the intervening mechanism is not addressed.
  - target: Upper Airway Structural Abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Upper airway abnormalities are recurrent in XGS; how AHDC1 variants
      produce them is unknown.
    evidence:
    - reference: PMID:29696776
      reference_title: "The phenotypic spectrum of Xia-Gibbs syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Upper airway abnormalities also appear to be a common feature in XGS."
      explanation: Registry cohort observation associating XGS with upper airway abnormalities.
- name: Abnormal Nuclear Localization of Truncated AHDC1
  biological_scale: CELLULAR
  description: >-
    Wild-type AHDC1 is nuclear. Truncated forms modelled on patient alleles
    show either a diffuse distribution (short N-terminal fragments) or
    aggregation in the nucleolus (mid-protein truncations). This was observed
    on transient overexpression in cell lines, so whether endogenous truncated
    protein is produced and mislocalized in patient neural cells is not known.
  mechanism_confidence: PROVISIONAL
  cellular_components:
  - preferred_term: nucleolus
    term:
      id: GO:0005730
      label: nucleolus
  evidence:
  - reference: PMID:33644933
    reference_title: "Phenotypic and protein localization heterogeneity associated with AHDC1 pathogenic protein-truncating alleles in Xia-Gibbs syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transient expression of wild type and different patient truncated AHDC1 protein forms in human cell lines revealed abnormal patterns of nuclear localization including a diffuse distribution of a short truncated form and nucleolar aggregation in mid-protein truncated forms."
    explanation: Direct cell-line observation of the localization defect.
- name: Dysregulated Gibbin-Dependent Mesodermal Gene Expression
  biological_scale: CELLULAR
  description: >-
    Gibbin binds enhancers and promoters together with many zinc-finger
    transcription factors and methyl-CpG-binding proteins. Its loss increases
    DNA methylation at GATA3-dependent mesodermal genes, impairs dermal
    maturation in skin organoids and, in chimeric mouse mutants, produces
    craniofacial, abdominal wall and epidermal patterning defects. The study
    proposes that some XGS features arise from abnormal mesoderm maturation;
    how far this explains the neurodevelopmental phenotype has not been tested.
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: mesoderm development
    modifier: DYSREGULATED
    term:
      id: GO:0007498
      label: mesoderm development
  evidence:
  - reference: PMID:35585237
    reference_title: "Gibbin mesodermal regulation patterns epithelial development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that enhancer- or promoter-bound Gibbin interacts with dozens of sequence-specific zinc-finger transcription factors and methyl-CpG-binding proteins to regulate the expression of mesoderm genes."
    explanation: Establishes Gibbin as a chromatin-bound regulator of mesodermal gene expression.
  - reference: PMID:35585237
    reference_title: "Gibbin mesodermal regulation patterns epithelial development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, Gibbin-mutant human embryonic stem-cell-derived skin organoids lack dermal maturation, resulting in p63-expressing basal cells that possess defective keratinocyte stratification."
    explanation: Organoid consequence of Gibbin loss.
  downstream:
  - target: Mild Facial Dysmorphism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chimeric Gibbin mouse mutants show craniofacial patterning defects that
      the authors relate to patient phenotypes; the link to human facial
      features is by analogy.
    evidence:
    - reference: PMID:35585237
      reference_title: "Gibbin mesodermal regulation patterns epithelial development."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "In vivo chimeric CRISPR mouse mutants reveal a spectrum of Gibbin-dependent developmental patterning defects affecting craniofacial structure, abdominal wall closure and epidermal stratification that mirror patient phenotypes."
      explanation: Mouse craniofacial patterning defects attributed to loss of Gibbin.

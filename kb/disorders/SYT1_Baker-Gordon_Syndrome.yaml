    modifier: ABNORMAL
  evidence:
  - reference: PMID:30107533
    reference_title: "SYT1-associated neurodevelopmental disorder: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The extent of disturbance to synaptic vesicle kinetics is mirrored by the
      severity of the affected individuals' phenotypes, suggesting that the
      efficiency of SYT1-mediated neurotransmitter release is critical to cognitive
      development.
    explanation: >-
      Directly links the degree of synaptic-vesicle-kinetic disturbance to
      neurodevelopmental phenotype severity.
  downstream:

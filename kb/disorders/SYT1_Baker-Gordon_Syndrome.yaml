pathophysiology:
- name: Dominant-Negative Synaptotagmin-1 C2B Dysfunction
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    De novo missense variants in SYT1 alter highly conserved residues clustered in
    the calcium-binding C2B domain of synaptotagmin-1 (e.g. M303K, D304G, D366E,
    I368T, N371K). Synaptotagmin-1 is the vesicular calcium sensor that couples
    action-potential calcium influx to synchronous vesicle fusion; the variants act
    dominant-negatively, with mutant sensor incorporated at nerve terminals
    impairing wild-type function.
  role: trigger
  cell_types:

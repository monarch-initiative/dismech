differential_diagnoses:
- name: Epileptic synaptic vesicle cycle disorders (STXBP1, UNC13A, DNM1)
  description: >-
    Other synaptic vesicle cycle disorders (STXBP1, UNC13A, DNM1) present with
    developmental impairment and movement features but are epileptic
    encephalopathies; the characteristic absence of seizures and the prominent
    hyperkinetic movement disorder with distinctive EEG favor SYT1 disease.
  distinguishing_features:
  - A de novo C2B-domain SYT1 variant with a hyperkinetic movement disorder and no seizures favors this disorder.
  - Prominent early-onset epilepsy favors an epileptic vesicle-cycle disorder (STXBP1, UNC13A, DNM1).
  evidence:
  - reference: PMID:30107533
    reference_title: "SYT1-associated neurodevelopmental disorder: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absence of epileptic seizures and normal orbitofrontal head circumference are
      important negative features.
    explanation: >-
      The absence of seizures is a key discriminator from the epileptic vesicle-cycle
      encephalopathies.

      label: calcium-dependent activation of synaptic vesicle fusion
    modifier: DECREASED
  - preferred_term: synaptic vesicle exocytosis
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:30107533
    reference_title: "SYT1-associated neurodevelopmental disorder: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Synaptotagmin 1 (SYT1) is a critical mediator of fast, synchronous,
      calcium-dependent neurotransmitter release and also modulates synaptic
      vesicle endocytosis.
    explanation: >-
      Establishes synaptotagmin-1 as the calcium sensor for synchronous fusion, the
      step impaired by the disease variants.
  - reference: PMID:25705886
    reference_title: "Identification of a human synaptotagmin-1 mutation that perturbs synaptic vesicle cycling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The presence of the mutant SYT1 slowed synaptic vesicle fusion kinetics, a
      finding that agrees with the previously demonstrated role for I368 in
      calcium-dependent membrane penetration.
    explanation: >-
      In vitro neuronal expression shows the disease variant slows calcium-triggered
      vesicle fusion.
  downstream:
  - target: Disrupted Neurotransmission and Impaired Neurodevelopment
    causal_link_type: DIRECT
- name: Disrupted Neurotransmission and Impaired Neurodevelopment
  conforms_to: "synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit"
  description: >-
    Desynchronized, kinetically impaired neurotransmitter release degrades the
    dynamic fidelity of synaptic transmission, limiting activity-dependent postnatal
    brain organization. Clinically this produces a hyperkinetic movement disorder,
    developmental delay/intellectual disability, and a distinctive universal EEG
    disturbance (intermittent low-frequency high-amplitude oscillations); the
    severity of the synaptic-kinetic disturbance tracks phenotype severity.
    Epileptic seizures are characteristically absent.
  role: effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron

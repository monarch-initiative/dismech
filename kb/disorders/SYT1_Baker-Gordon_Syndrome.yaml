- name: Impaired Calcium-Triggered Synchronous Vesicle Fusion
  conforms_to: "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion"
  description: >-
    Synaptotagmin-1 is the calcium sensor that triggers fast, synchronous
    SNARE-mediated vesicle fusion. The dominant-negative C2B variants slow vesicle
    fusion kinetics and desynchronize evoked neurotransmitter release, degrading the
    temporal precision of synaptic transmission; the variants also perturb the
    coupled endocytic retrieval of the sensor. This is the key conformance target
    of the module — the calcium-sensor/fusion arm.
  role: central_effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: calcium-dependent activation of synaptic vesicle fusion
    term:

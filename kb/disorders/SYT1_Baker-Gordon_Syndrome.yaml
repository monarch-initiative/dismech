name: SYT1-Associated Neurodevelopmental Disorder
creation_date: "2026-07-06T00:00:00Z"
description: >-
  A neurodevelopmental disorder (Baker-Gordon syndrome) caused by de novo
  heterozygous missense variants in SYT1, which encodes synaptotagmin-1, the
  presynaptic vesicular calcium sensor for fast, synchronous, calcium-triggered
  neurotransmitter release. Pathogenic variants cluster in the calcium-binding C2B
  domain and act by a dominant-negative mechanism, slowing and desynchronizing
  synaptic vesicle fusion. The clinical syndrome comprises infantile hypotonia,
  congenital ophthalmic (oculomotor) abnormalities, childhood-onset hyperkinetic
  movement disorders, motor stereotypies, and moderate-to-profound developmental
  delay, with a distinctive, universal EEG signature of intermittent low-frequency
  high-amplitude oscillations. Notably, epileptic seizures are characteristically
  absent — distinguishing it from the epileptic encephalopathies among the synaptic
  vesicle cycle disorders. It represents the calcium-sensor / fusion arm of the
  synaptic vesicle cycle.
category: Mendelian
parents:
- Neurodevelopmental Disorder

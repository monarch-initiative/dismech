  evidence:
  - reference: PMID:30107533
    reference_title: "SYT1-associated neurodevelopmental disorder: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations alter highly conserved residues, and cluster in two regions of
      the SYT1 C2B domain at positions Met303 (M303K), Asp304 (D304G), Asp366
      (D366E), Ile368 (I368T) and Asn371 (N371K).
    explanation: >-
      Establishes the C2B calcium-binding-domain clustering of the disease variants.
  - reference: PMID:25705886
    reference_title: "Identification of a human synaptotagmin-1 mutation that perturbs synaptic vesicle cycling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trio analysis of whole-exome sequence identified a de novo SYT1 missense
      variant (I368T).
    explanation: >-
      The founding case established a de novo C2B-domain SYT1 missense variant.

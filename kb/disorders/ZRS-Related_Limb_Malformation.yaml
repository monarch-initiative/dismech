discussions:
- discussion_id: mondo_no_zrs_spectrum_class
  prompt: >-
    Which disease term should ground a locus-level entry when the ontology has
    classes for every member of a spectrum but none for the spectrum itself?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - has_subtypes#Preaxial Polydactyly Type 2
  - has_subtypes#Triphalangeal Thumb-Polysyndactyly Syndrome
  - has_subtypes#Werner Mesomelic Syndrome
  rationale: >-
    MONDO has classes for all six members curated here, and they are grounded
    individually via subtype_term, but no class covers the ZRS gain-of-function
    spectrum as a whole. The members are scattered across unrelated branches:
    PPD2 sits under preaxial polydactyly of fingers, TPT-PS under congenital limb
    malformation, syndactyly type IV under non-syndromic syndactyly, and Werner
    under dysostosis and non-syndromic limb reduction defect, so there is no
    existing common ancestor below the level of developmental disorders. MONDO's
    natural construct for this would be a gene-anchored disease series, which is
    unavailable because ZRS has no HGNC identifier. Rather than ground the entry
    on the narrowest available member class, which is how this file previously
    came to be scoped as TPT-PS alone, disease_term is omitted so the gap is
    recorded. Resolving it needs either a new MONDO grouping class for the
    spectrum or an agreed convention for locus-level entries with no ontology
    counterpart. Note also that Orphanet has already partially lumped: ORPHA:2950
    (TPT-PS) and ORPHA:3332 are both moved into ORPHA:988, the Werner
    mesomelic spectrum; ORPHA:2950 is additionally flagged "Deprecated entity"
    in Orphanet's own record.
  evidence:
  - reference: ORPHA:988
    reference_title: "Tibial hemimelia-polysyndactyly-triphalangeal thumb syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ORPHA:2950 | Triphalangeal thumb-polysyndactyly syndrome | Moved to |
      ORPHA:988 | Tibial hemimelia-polysyndactyly-triphalangeal thumb syndrome
    explanation: >-
      Orphanet's own disorder-disorder association list for ORPHA:988 records
      ORPHA:2950 (TPT-PS) as "Moved to" this entry, directly documenting half
      of the lumping this discussion notes.
  - reference: ORPHA:988
    reference_title: "Tibial hemimelia-polysyndactyly-triphalangeal thumb syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ORPHA:3332 | Hypoplastic tibiae-postaxial polydactyly syndrome | Moved to
      | ORPHA:988 | Tibial hemimelia-polysyndactyly-triphalangeal thumb
      syndrome
    explanation: >-
      The same association list also records ORPHA:3332 as "Moved to"
      ORPHA:988, documenting the other half of the lumping this discussion
      notes.
  - reference: PMID:19847792
    reference_title: >-
      A specific mutation in the distant sonic hedgehog (SHH) cis-regulator (ZRS)
      causes Werner mesomelic syndrome (WMS) while complete ZRS duplications
      underlie Haas type polysyndactyly and preaxial polydactyly (PPD) with or
      without triphalangeal thumb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest the term "ZRS-associated syndromes" and a clinical
      subclassification for the continuum of limb malformations caused by
      different molecular alterations of the ZRS.
    explanation: >-
      The literature proposes a cover term for exactly the grouping that no
      ontology class currently provides.
  - reference: PMID:10869115
    reference_title: >-
      Are triphalangeal thumb-polysyndactyly syndrome (TPTPS) and tibial
      hemimelia-polysyndactyly-triphalangeal thumb syndrome (THPTTS) identical? A
      father with TPTPS and his daughter with THPTTS in a Thai family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Having two different syndromes in the same family suggests that they are
      actually the same disorder.
    explanation: >-
      The single-family observation underlying Orphanet's deprecation of
      ORPHA:2950 into ORPHA:988, and the clearest statement that the named
      entities of this spectrum are not separable.
- discussion_id: zrs_regulatory_element_not_groundable
  prompt: >-
    How should a disease entry ground its causal entity when that entity is a
    cis-regulatory element rather than a gene?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - genetic#ZRS/pZRS cis-regulatory locus controlling limb-specific SHH expression
  - pathophysiology#ZRS or pZRS Regulatory Gain of Ectopic Expression
  rationale: >-
    The causal entity for this spectrum is the ZRS enhancer. The LMBR1 protein is
    a bystander - no LMBR1 coding variant causes any branch - and OMIM records
    this by maintaining a separate locus entry for the enhancer (OMIM:620738,
    NCBI Gene 105804841, Homo sapiens chromosome 7). The schema cannot express
    that. The gene slot binds to the GeneTerm enum, which is HGNC-only, and HGNC
    has no entry for ZRS because HGNC names genes; a lookup by NCBI Gene ID
    returns nothing, and a search for the symbol returns LMBR1 as an alias. There
    is no regulatory-element or genomic-feature descriptor in the schema:
    regulatory_element_type records that an ENHANCER was disrupted but has no
    companion slot for which enhancer. The entry is therefore grounded on
    hgnc:13243 LMBR1, which reproduces the gene-centric conflation OMIM moved away
    from. A regulatory_element_term slot alongside gene_term, rangeable over NCBI
    Gene or OMIM locus entries, would fix this; ZRS is the canonical test case
    because here the element is the disease locus and the gene is incidental.
    Note also that the schema is internally inconsistent on this point:
    GeneDescriptor is documented as "bindable to HGNC or other gene databases",
    while the gene_term slot is documented as "The HGNC term for this gene" and
    the enum admits HGNC alone.
- discussion_id: lss_nasal_defects_outside_limb_enhancer_scope
  prompt: >-
    How does a limb-specific enhancer produce the nasal defects reported in
    Laurin-Sandrow syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Laurin-Sandrow Syndrome
  - pathophysiology#Ectopic Limb-Bud SHH Regulatory Activity
  rationale: >-
    Nasal defects are part of the clinical definition of Laurin-Sandrow syndrome,
    but every mechanism curated in this entry is limb-restricted. ZRS drives SHH
    expression specifically in the limb bud, and the pathograph runs from ectopic
    limb-bud enhancer activity to autopod and zeugopod patterning; there is no
    curated route from that lesion to the developing face. The nasal phenotype is
    therefore recorded in the Laurin-Sandrow subtype description but is
    deliberately not curated as a phenotype record, because doing so would attach
    a disconnected node asserting a causal path the evidence does not support.
    Candidate explanations that would need testing: the smaller (<80 kb)
    duplications associated with Laurin-Sandrow may disturb regulatory elements or
    topological boundaries beyond ZRS itself, giving a craniofacial effect that
    larger duplications and point variants do not; alternatively the nasal finding
    may be a variable or coincidental association in a small reported series.
    Distinguishing these matters for the spectrum's boundaries, since it is the
    one curated feature that a purely limb-specific mechanism cannot explain.
  evidence:
  - reference: PMID:24456159
    reference_title: >-
      Microduplications encompassing the Sonic hedgehog limb enhancer ZRS are
      associated with Haas-type polysyndactyly and Laurin-Sandrow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laurin-Sandrow syndrome (LSS) is a rare autosomal dominant disorder
      characterized by polysyndactyly of hands and/or feet, mirror image
      duplication of the feet, nasal defects, and loss of identity between fibula
      and tibia.
    explanation: >-
      Establishes nasal defects as part of the syndrome definition, which is what
      makes their absence from the limb-restricted mechanism a gap.
- discussion_id: pzrs_fibroblast_mouse_limb_bud_model_mismatch
  prompt: >-
    Are the pZRS-associated contact changes measured in patient skin
    fibroblasts and the ectopic reporter activity measured in transgenic mouse
    limbs faithful to endogenous regulation in the human embryonic limb bud?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - experimental_models#Patient-skin-fibroblast SHH-LMBR1 4C-seq model
  - animal_models#Human pZRS mutant transgenic mouse enhancer-reporter assay
  - pathophysiology#Altered SHH-LMBR1 Regulatory-Domain Contacts
  - pathophysiology#Ectopic Limb-Bud SHH Regulatory Activity
  rationale: >-
    Existing model evidence is informative but not anatomically equivalent to
    the human embryonic limb. The 4C-seq result comes from one affected donor's
    skin fibroblasts, while the mouse assay measures an isolated human
    regulatory construct and reporter rather than the intact human SHH-LMBR1
    locus or endogenous SHH transcription. Their fidelity to the
    disease-relevant human developmental cell state therefore remains open.
  proposed_experiments:
  - experiment_id: pzrs_isogenic_limb_bud_context_fidelity
    name: Isogenic pZRS human limb-bud context-fidelity study
    description: >-
      Introduce and correct the recurrent pZRS variant in isogenic human
      iPSC-derived limb-bud mesenchymal models, then jointly measure enhancer
      accessibility, SHH-LMBR1 contacts, endogenous SHH expression, and
      Hedgehog-response gradients across the developmental time course. Compare
      those readouts directly with the fibroblast 4C-seq and mouse-reporter
      observations to establish which model findings translate to human
      limb-bud biology.
    readouts:
    - name: Difference in SHH-LMBR1 contact frequency
      target: pathophysiology#Altered SHH-LMBR1 Regulatory-Domain Contacts
    - name: Spatial and temporal endogenous SHH expression
      target: pathophysiology#Ectopic Limb-Bud SHH Regulatory Activity
  evidence:
  - reference: PMID:35821352
    reference_title: "The pZRS non-coding regulatory mutation resulting in triphalangeal thumb-polysyndactyly syndrome changes the pattern of local interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we performed a circular chromatin conformation
      capture-sequencing (4C-seq) assay on skin fibroblasts of one affected
      family member and control samples to examine potential alterations in
      the SHH regulatory domain and functionally characterize the identified
      variant.
    explanation: >-
      Confirms the 4C-seq model is a single-donor skin-fibroblast system, the
      basis for the fibroblast side of the human-model-fidelity mismatch.
  - reference: PMID:29543231
    reference_title: "A point mutation in the pre-ZRS disrupts sonic hedgehog expression in the limb bud and results in triphalangeal thumb-polysyndactyly syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Functional characterization using a mouse transgenic enhancer essay
      showed extended ectopic expression dispersed throughout the entire
      limb bud (E11.5).
    explanation: >-
      Identifies the mouse readout as a transgenic enhancer assay and reports
      its ectopic-expression result, the basis for the mouse-model side of the
      fidelity mismatch. That such an assay scores a reporter construct rather
      than endogenous SHH transcription is domain knowledge about the assay
      type, not a claim the quote itself makes.
- discussion_id: pzrs_chromatin_contact_causality
  prompt: >-
    Do altered SHH-LMBR1 chromatin contacts causally mediate pZRS-dependent
    ectopic endogenous SHH expression?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#ZRS or pZRS Regulatory Gain of Ectopic Expression
  - pathophysiology#Altered SHH-LMBR1 Regulatory-Domain Contacts
  - pathophysiology#Ectopic Limb-Bud SHH Regulatory Activity
  rationale: >-
    The patient-fibroblast study associates the pZRS variant with increased TAD
    contacts, and the mouse reporter assay separately shows ectopic regulatory
    activity. Neither study perturbs chromatin contacts independently of pZRS
    genotype, so they do not establish that the contact change causes
    endogenous SHH misexpression. The source explicitly states that the contact
    change arose by an unknown mechanism.
  proposed_experiments:
  - experiment_id: pzrs_contact_causality_perturbation
    name: Orthogonal SHH-LMBR1 contact-causality test
    description: >-
      In pZRS-mutant and corrected human iPSC-derived limb-bud mesenchyme,
      disrupt or restore the relevant regulatory-domain contacts while holding
      pZRS genotype constant. Jointly measure contact frequency, endogenous SHH
      transcription, and Hedgehog-response output to test whether expression
      follows contact manipulation independently of the sequence variant.
    readouts:
    - name: SHH-LMBR1 contact frequency under orthogonal perturbation
      target: pathophysiology#Altered SHH-LMBR1 Regulatory-Domain Contacts
    - name: Endogenous SHH transcription at fixed pZRS genotype
      target: pathophysiology#Ectopic Limb-Bud SHH Regulatory Activity
  evidence:
  - reference: PMID:35821352
    reference_title: "The pZRS non-coding regulatory mutation resulting in triphalangeal thumb-polysyndactyly syndrome changes the pattern of local interactions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The pathogenic mutation causative for TPT-PS in our patient gave rise to
      increased interactions within the SHH regulatory domain in yet unknown
      mechanism.
    explanation: >-
      The authors explicitly identify the mechanism connecting the pZRS variant
      to altered contacts as unresolved.
notes: >-
  Entry scope: this file was retargeted from the single TPT-PS entity
  (MONDO:0017454 / OMIM:190605) to the locus-level ZRS gain-of-function spectrum.
  The earlier narrow scoping produced two artefacts that this revision reverses.
  First, the ZRS dosage-effect content from PMID:24777739 - one allele giving PPD2
  when heterozygous and Werner mesomelic syndrome when homozygous - had been
  deleted as "crossing this entry's disease boundary"; under the locus-level scope
  it is core evidence and is restored as an inheritance entry and in the Werner
  subtype. Second, TPT-PS and syndactyly type IV were noted as a reported
  phenotypic continuum (PMID:23793141) but held apart as separate entities; both
  are now subtypes.
  There is no top-level disease_term. No MONDO class covers the ZRS
  gain-of-function spectrum: the six member entities exist as separate MONDO
  classes and are grounded individually via subtype_term, but MONDO has no
  grouping class over them, and the natural construct (a gene-anchored disease
  series) is unavailable because ZRS has no HGNC identifier. Omitting the slot
  records that gap rather than resolving it by picking the narrowest available
  member class; 22 other disorder entries omit disease_term for comparable
  reasons. See the mondo_no_zrs_spectrum_class discussion.
  Acheiropodia (OMIM:200500; MONDO:0008700) is deliberately out of scope. It maps
  to the same locus but arises from deletion, and its pathograph is loss of
  enhancer-promoter contact producing limb reduction - the opposite direction of
  travel from the gain-of-ectopic-expression mechanism curated here.
  PPD3 (OMIM:174600) is noted in the genetic section but not curated as a
  subtype: Kantaputra and Chalidapong place it in this spectrum (PMID:10869115),
  but OMIM assigns the entry no gene or locus and Orphanet records no literature
  description since 1962.
  No disease-specific GeneReviews article was located. GEO discovery returned
  GSE44325 as a lexical polydactyly hit, but it studies Sost/Sostdc1-Gli3
  digit-number biology rather than a ZRS/pZRS model, so no dataset accession was
  curated. No spectrum-specific clinical trial was identified.
  Phenotype coverage spans both limb segments. The six autopod phenotypes
  inherited from the TPT-PS scoping are joined by mirror-image foot polydactyly
  and absent thumb in the autopod, and by tibial hypoplasia or aplasia, fibular
  duplication, mesomelic shortening and patellar aplasia in the zeugopod. The
  zeugopod group hangs off a separate pathograph node, Disrupted Zeugopod Element
  Specification, because it is engaged in a lesion-class-dependent way: ZRS
  position-404 point variants drive strong ectopic expression that reaches the
  zeugopod, while complete duplications leave lower-limb development unaffected
  (PMID:19847792). That contrast is the branch point separating Werner mesomelic
  syndrome from the duplication phenotypes, so it is modelled as an edge condition
  rather than a universal consequence.
  One Laurin-Sandrow feature is deliberately uncurated. Nasal defects are part of
  that syndrome's definition but no limb-specific enhancer mechanism reaches the
  face, so recording them as a phenotype would create a node asserting a causal
  path the evidence does not support. They are described in the subtype entry and
  raised as the lss_nasal_defects_outside_limb_enhancer_scope discussion instead.

  - target: Disrupted Zeugopod Element Specification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - strong ectopic SHH expression extending the patterning defect proximally from the autopod into the zeugopod
    description: >-
      Lesion class determines how far proximally the defect reaches. The ZRS
      position-404 point variants drive strong ectopic SHH expression and add
      zeugopod involvement, whereas complete ZRS duplications leave lower-limb
      development unaffected. This is the branch point that separates Werner
      mesomelic syndrome from the duplication phenotypes.
    evidence:
    - reference: PMID:19847792
      reference_title: "A specific mutation in the distant sonic hedgehog (SHH) cis-regulator (ZRS) causes Werner mesomelic syndrome (WMS) while complete ZRS duplications underlie Haas type polysyndactyly and preaxial polydactyly (PPD) with or without triphalangeal thumb."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These data provide the first evidence that WMS is caused by a specific
        ZRS mutation, which leads to strong ectopic SHH expression.
      explanation: >-
        Attributes the more severe, zeugopod-involving branch to stronger ectopic
        expression from a specific ZRS allele.
    - reference: PMID:19847792
      reference_title: "A specific mutation in the distant sonic hedgehog (SHH) cis-regulator (ZRS) causes Werner mesomelic syndrome (WMS) while complete ZRS duplications underlie Haas type polysyndactyly and preaxial polydactyly (PPD) with or without triphalangeal thumb."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast, we show that complete duplications of the ZRS region lead to
        type Haas polysyndactyly or triphalangeal thumb-polysyndactyly syndrome,
        but do not affect lower limb development.
      explanation: >-
        The contrasting arm of the same study: duplications spare the zeugopod,
        establishing this edge as lesion-class dependent rather than universal.

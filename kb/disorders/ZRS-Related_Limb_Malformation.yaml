    - duplication of posterior positional identity across the anteroposterior axis of the hindlimb autopod
  - target: Absent Thumb
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - loss of thumb positional identity with transformation of digit 1 towards a finger-like identity
- name: Disrupted Zeugopod Element Specification
  biological_scale: TISSUE
  role: consequence
  description: >-
    In the strong-ectopic-expression branch the patterning defect is not confined
    to the autopod: specification of the zeugopod elements is also disturbed,
    producing tibial hypoplasia or aplasia, abnormal or duplicated fibulae, and
    mesomelic shortening of the limb. This node is what distinguishes Werner
    mesomelic syndrome and the fibular phenotype of Laurin-Sandrow syndrome from
    the autopod-only branches of the spectrum, and it is engaged in a
    lesion-class-dependent way rather than by every ZRS alteration.
  biological_processes:
  - preferred_term: Embryonic limb morphogenesis
    term:
      id: GO:0030326
      label: embryonic limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:19847792
    reference_title: >-
      A specific mutation in the distant sonic hedgehog (SHH) cis-regulator (ZRS)
      causes Werner mesomelic syndrome (WMS) while complete ZRS duplications
      underlie Haas type polysyndactyly and preaxial polydactyly (PPD) with or
      without triphalangeal thumb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Werner mesomelic syndrome (WMS) is an autosomal dominant disorder with
      unknown molecular etiology characterized by hypo- or aplasia of the tibiae
      in addition to the preaxial polydactyly (PPD) of the hands and feet and/or
      five-fingered hand with absence of thumbs.
    explanation: >-
      Establishes zeugopod involvement as an addition to, not a replacement for,
      the shared autopod phenotype.
  - reference: PMID:24777739
    reference_title: >-
      A novel ZRS mutation leads to preaxial polydactyly type 2 in a heterozygous
      form and Werner mesomelic syndrome in a homozygous form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although most mutations cause preaxial polydactyly (PPD), triphalangeal
      thumb (TPT) or both, a mutation in position 404 of the ZRS causes more
      severe Werner mesomelic syndrome (WMS) for which malformations include the
      distal arm or leg bones in addition to the hands and/or feet.
    explanation: >-
      States the proximal extension of the defect into the distal long bones as
      the feature that marks the severe branch.
  downstream:
  - target: Tibial Hypoplasia or Aplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failure of anterior zeugopod element specification and outgrowth
  - target: Fibular Duplication
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - duplication of posterior zeugopod positional identity
  - target: Mesomelic Limb Shortening
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced growth of the mispatterned zeugopod segment
  - target: Patellar Aplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - absent or malformed proximal tibial articulation removing the template for patellar formation

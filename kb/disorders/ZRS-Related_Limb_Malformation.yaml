has_subtypes:
- name: Isolated Triphalangeal Thumb
  classification: clinical_phenotype
  subtype_term:
    preferred_term: triphalangeal thumb, nonopposable
    term:
      id: MONDO:0008605
      label: triphalangeal thumb, Nonopposable
  description: >-
    The mildest branch: a three-phalanx thumb without polydactyly. OMIM splits
    this presentation across two entries, carrying opposable triphalangeal thumb
    as an included title of PPD2 (OMIM:174500) while OMIM:190600 covers the
    nonopposable form; MONDO:0008605 is the only MONDO class for isolated
    triphalangeal thumb as an entity, so it is used here with that caveat.
    Isolated triphalangeal thumb and PPD2 co-occur in single ZRS kindreds.
  evidence:
  - reference: PMID:24777739
    reference_title: >-
      A novel ZRS mutation leads to preaxial polydactyly type 2 in a heterozygous
      form and Werner mesomelic syndrome in a homozygous form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although most mutations cause preaxial polydactyly (PPD), triphalangeal
      thumb (TPT) or both, a mutation in position 404 of the ZRS causes more
      severe Werner mesomelic syndrome (WMS) for which malformations include the
      distal arm or leg bones in addition to the hands and/or feet.
    explanation: >-
      Establishes isolated triphalangeal thumb as one of the routine outcomes of
      ZRS point variants, alongside preaxial polydactyly.
- name: Preaxial Polydactyly Type 2
  classification: molecular
  subtype_term:
    preferred_term: polydactyly of a triphalangeal thumb
    term:
      id: MONDO:0008270
      label: polydactyly of a triphalangeal thumb
  description: >-
    Preaxial polydactyly type 2 (PPD2; OMIM:174500; ORPHA:93336), duplication on
    the radial side of the hand with a usually opposable triphalangeal thumb.
    The classical ZRS point-variant phenotype. OMIM assigns PPD2 to the ZRS locus
    entry (OMIM:620738) rather than to LMBR1.
  evidence:
  - reference: PMID:12837695
    reference_title: >-
      A long-range Shh enhancer regulates expression in the developing limb and
      fin and is associated with preaxial polydactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that the chromosome 7q36 associated preaxial polydactyly, a
      frequently observed congenital limb malformation, results from point
      mutations in a Shh regulatory element.
    explanation: >-
      The founding demonstration that preaxial polydactyly is a ZRS enhancer
      point-variant disease.
- name: Triphalangeal Thumb-Polysyndactyly Syndrome
  classification: molecular
  subtype_term:
    preferred_term: triphalangeal thumb-polysyndactyly syndrome
    term:
      id: MONDO:0017454
      label: triphalangeal thumb-polysyndactyly syndrome
  description: >-
    Triphalangeal thumb-polysyndactyly syndrome (TPT-PS; OMIM:190605), combining
    triphalangeal thumbs with pre- and postaxial polydactyly and variable
    syndactyly of hands and feet. Caused by complete ZRS duplications and, more
    rarely, by pre-ZRS point variants. OMIM assigns this entry to LMBR1
    (OMIM:605522) because the causal duplications span the gene body as well as
    the enhancer. Orphanet no longer carries a standalone TPT-PS concept:
    ORPHA:2950 is deprecated and moved to ORPHA:988, the Werner mesomelic
    spectrum.
  evidence:
  - reference: ORPHA:2950
    reference_title: "Triphalangeal thumb-polysyndactyly syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      **ORPHA:2950** — Triphalangeal thumb-polysyndactyly syndrome (Malformation syndrome, Disorder)

      **Status:** Deprecated entity; Inactive
    explanation: >-
      Orphanet's own record for ORPHA:2950 (TPT-PS) carries the "Deprecated
      entity" and "Inactive" status flags, the literal source for the claim
      that Orphanet no longer carries a standalone TPT-PS concept.
  - reference: ORPHA:988
    reference_title: "Tibial hemimelia-polysyndactyly-triphalangeal thumb syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ORPHA:2950 | Triphalangeal thumb-polysyndactyly syndrome | Moved to |
      ORPHA:988 | Tibial hemimelia-polysyndactyly-triphalangeal thumb syndrome
    explanation: >-
      Orphanet's disorder-disorder association record confirms ORPHA:2950
      (TPT-PS) was moved into ORPHA:988, so Orphanet no longer carries a
      standalone TPT-PS concept.
  - reference: PMID:18417549
    reference_title: >-
      Triphalangeal thumb-polysyndactyly syndrome and syndactyly type IV are
      caused by genomic duplications involving the long range, limb-specific
      SHH enhancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both TPTPS and SD4 are due to duplications involving ZRS, the limb
      specific SHH enhancer.
    explanation: >-
      Establishes the ZRS duplication mechanism shared by TPT-PS and syndactyly
      type IV.
- name: Haas-Type Polysyndactyly
  display_name: Haas-Type Polysyndactyly (Syndactyly Type IV)
  classification: molecular
  subtype_term:
    preferred_term: syndactyly type 4
    term:
      id: MONDO:0008515
      label: syndactyly type 4
  description: >-
    Haas-type polysyndactyly (syndactyly type IV; OMIM:186200; ORPHA:93405),
    complete syndactyly of all fingers giving a cup-shaped or rosebud hand, with
    polydactyly. Caused by larger (>80 kb) ZRS duplications, and reported within
    the same families as TPT-PS.
  evidence:
  - reference: PMID:24456159
    reference_title: >-
      Microduplications encompassing the Sonic hedgehog limb enhancer ZRS are
      associated with Haas-type polysyndactyly and Laurin-Sandrow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that larger duplications of the ZRS region (>80 kb) are associated
      with HTS, whereas smaller duplications (<80 kb) result in the LSS
      phenotype.
    explanation: >-
      Assigns Haas-type polysyndactyly to the larger-duplication end of the ZRS
      dosage series.
- name: Laurin-Sandrow Syndrome
  classification: molecular
  subtype_term:
    preferred_term: Laurin-Sandrow syndrome
    term:
      id: MONDO:0007615
      label: laurin-Sandrow syndrome
  description: >-
    Laurin-Sandrow syndrome (LSS; OMIM:135750; ORPHA:2378), polysyndactyly with
    mirror-image duplication of the feet, fibular duplication and nasal defects.
    Caused by smaller (<80 kb) ZRS duplications, and distinguished from Haas-type
    polysyndactyly by the mirror-image foot phenotype.
  evidence:
  - reference: PMID:24456159
    reference_title: >-
      Microduplications encompassing the Sonic hedgehog limb enhancer ZRS are
      associated with Haas-type polysyndactyly and Laurin-Sandrow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we show that these small microduplications within the ZRS
      region are the underlying genetic cause of Laurin-Sandrow syndrome.
    explanation: >-
      Establishes small ZRS microduplication as the cause of Laurin-Sandrow
      syndrome, placing it inside this locus spectrum.
- name: Werner Mesomelic Syndrome
  classification: molecular
  subtype_term:
    preferred_term: tibia, hypoplasia or aplasia of, with polydactyly
    term:
      id: MONDO:0008572
      label: tibia, hypoplasia or aplasia of, with polydactyly
  description: >-
    Werner mesomelic syndrome, also curated by OMIM as tibial hypoplasia or
    aplasia with polydactyly (OMIM:188740, which absorbed the former OMIM:188770;
    ORPHA:988). The most severe branch: tibial hypo- or aplasia in addition to
    the hand and foot phenotype, i.e. zeugopod involvement rather than autopod
    only. Caused by point variants at ZRS position 404, and OMIM assigns it to
    the ZRS locus entry (OMIM:620738). Inheritance is dominant, but a homozygous
    ZRS 402C>T individual showed the Werner phenotype while heterozygotes in the
    same kindred had only PPD2, establishing a dosage effect at this locus.
    ORPHA:988 absorbed the deprecated TPT-PS concept ORPHA:2950.
  evidence:
  - reference: ORPHA:988
    reference_title: "Tibial hemimelia-polysyndactyly-triphalangeal thumb syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ORPHA:2950 | Triphalangeal thumb-polysyndactyly syndrome | Moved to |
      ORPHA:988 | Tibial hemimelia-polysyndactyly-triphalangeal thumb syndrome
    explanation: >-
      Orphanet's own disorder-disorder association record for ORPHA:988 lists
      the deprecated TPT-PS concept (ORPHA:2950) as "Moved to" this entry,
      directly confirming that Orphanet no longer maintains TPT-PS as a
      standalone concept and folded it into the Werner mesomelic spectrum.
  - reference: PMID:19847792
    reference_title: >-
      A specific mutation in the distant sonic hedgehog (SHH) cis-regulator (ZRS)
      causes Werner mesomelic syndrome (WMS) while complete ZRS duplications
      underlie Haas type polysyndactyly and preaxial polydactyly (PPD) with or
      without triphalangeal thumb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Werner mesomelic syndrome (WMS) is an autosomal dominant disorder with
      unknown molecular etiology characterized by hypo- or aplasia of the tibiae
      in addition to the preaxial polydactyly (PPD) of the hands and feet and/or
      five-fingered hand with absence of thumbs.
    explanation: >-
      Defines the Werner branch by zeugopod involvement added to the shared hand
      and foot phenotype.
  - reference: PMID:24777739
    reference_title: >-
      A novel ZRS mutation leads to preaxial polydactyly type 2 in a heterozygous
      form and Werner mesomelic syndrome in a homozygous form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a novel point mutation in the ZRS, 402C>T
      (AC007097.4:g.105548C>T), that is transmitted through two Mexican families
      with one homozygous individual.
    explanation: >-
      Documents the allele whose homozygous form gives Werner mesomelic syndrome
      and whose heterozygous form gives PPD2 in the same families.
classifications:
  isds_skeletal_category:
  - classification_value: polydactyly_syndactyly_triphalangism
    notes: >-
      Members of this spectrum sit in the ISDS Polydactyly-Syndactyly-Triphalangism
      group. The ISDS row cited in PMID:31633310 names PPD2/triphalangeal thumb.
      That grouping is a nosology bucket admitting members on any of polydactyly,
      syndactyly or triphalangism; it is not an identity claim about its members,
      and it is much broader than this locus (it also holds GLI3-, HOXD13- and
      ciliopathy-related entities).
prevalence:
- population: Global
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Every branch of the ZRS spectrum is consistently described as rare, but no
    population-based numeric prevalence estimate was identified either for the
    locus-level spectrum or for its individual subtypes.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Pedigrees show autosomal dominant transmission with marked variable
    expression. Complete penetrance has been documented in individual large
    families, but a syndrome-wide penetrance percentage is not established.
  evidence:
  - reference: PMID:23793141
    reference_title: >-
      Confirmation of genetic homogeneity of syndactyly type IV and
      triphalangeal thumb-polysyndactyly syndrome in a Chinese family and
      review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Triphalangeal thumb-polysyndactyly syndrome (TPTPS) consists of a
      triphalangeal thumb, polydactyly, and syndactyly and is transmitted in an
      autosomal dominant manner with variable expression.
    explanation: >-
      Directly supports autosomal dominant inheritance and variable
      expressivity in TPT-PS.
  - reference: PMID:8958333
    reference_title: >-
      An autosomal dominant triphalangeal thumb: polysyndactyly syndrome with
      variable expression in a large Indian family maps to 7q36.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The abnormalities were present only in the upper limbs, and the
      phenotype was fully penetrant.
    explanation: >-
      Documents full penetrance in one large pedigree; marked PARTIAL because
      that family-specific estimate is not generalized to all TPT-PS families.
- name: Autosomal Recessive (dosage effect at a dominant locus)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    The locus is dominant, but allele dosage modifies severity, so a homozygous
    genotype can present as a distinct and more severe clinical branch. In two
    Mexican families a homozygous ZRS 402C>T individual had Werner mesomelic
    syndrome while heterozygous relatives carrying the same allele had only
    preaxial polydactyly type 2. OMIM therefore records both AD and AR for
    OMIM:188740. This is a gene-dosage effect at a dominant locus rather than a
    conventional recessive disease, and it is one reason the branches of this
    spectrum are not separable by inheritance pattern.
  evidence:
  - reference: PMID:24777739
    reference_title: >-
      A novel ZRS mutation leads to preaxial polydactyly type 2 in a heterozygous
      form and Werner mesomelic syndrome in a homozygous form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of more than 15 reported families with ZRS mutations, only one homozygous
      individual has been reported, with no change in phenotype compared with
      heterozygotes.
    explanation: >-
      Sets up the dosage question this paper then answers, documenting that
      homozygosity for the novel 402C>T allele produces the more severe Werner
      phenotype.
genetic:
- name: ZRS/pZRS cis-regulatory locus controlling limb-specific SHH expression
  gene_term:
    preferred_term: ZRS enhancer, within the LMBR1 locus (hgnc:13243)
    term:
      id: hgnc:13243
      label: LMBR1
  association: >-
    Causative noncoding regulatory variants in the ZRS enhancer and its flanking
    pre-ZRS, which lie within the LMBR1 locus, alter limb-specific SHH expression
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    ZRS is a long-range limb-specific SHH enhancer embedded in intron 5 of LMBR1,
    about 1 Mb from its target gene. The causal entity for this entry is the
    enhancer, not the LMBR1 protein: no LMBR1 coding variant causes any branch of
    this spectrum, and SHH is the distant regulatory target whose spatial
    expression is altered. OMIM recognises this by maintaining a separate locus
    entry for the enhancer, ZRS (OMIM:620738, NCBI Gene 105804841), and it splits
    the spectrum's phenotypes between the two identifiers by lesion class rather
    than by clinical entity. Sequence variants of the enhancer itself are assigned
    to ZRS - PPD2 (OMIM:174500) and Werner mesomelic syndrome (OMIM:188740) -
    while structural lesions of the surrounding interval are assigned to LMBR1
    (OMIM:605522), because the causal duplications and deletions span the gene
    body as well as the enhancer: TPT-PS (OMIM:190605), syndactyly type IV
    (OMIM:186200), Laurin-Sandrow syndrome (OMIM:135750) and acheiropodia
    (OMIM:200500). This entry is grounded on hgnc:13243 LMBR1 only because ZRS has
    no HGNC identifier and the schema's gene slot accepts HGNC terms alone; see
    the zrs_regulatory_element_not_groundable discussion.
    Lesion class does not map cleanly onto clinical entity in either direction:
    complete ZRS duplications underlie Haas-type polysyndactyly and preaxial
    polydactyly with or without triphalangeal thumb as well as TPT-PS
    (PMID:19847792), and the 404G>A allele reported as the "Cuban mutation" of
    PPD2 was reclassified once the index patient was found to also have tibial
    hypoplasia. Kantaputra and Chalidapong additionally reported PPD3 within this
    spectrum (PMID:10869115), though OMIM assigns no gene or locus to
    OMIM:174600, so that branch is noted rather than curated as a subtype.
  variants:
  - name: Heterozygous genomic duplications encompassing ZRS
    description: >-
      Copy-number gains spanning the limb-specific ZRS enhancer segregate
      with TPT-PS and/or syndactyly type IV; in six families, minimum
      duplications ranged from 131 kb to 398 kb.
    gene:
      preferred_term: LMBR1
      term:
        id: hgnc:13243
        label: LMBR1
    type: copy-number gain
    clinical_significance: PATHOGENIC
    regulatory_category: GOE
    functional_effects:
    - function: limb-specific SHH expression
      description: >-
        Increased ZRS dosage produces gain of ectopic SHH regulatory activity
        during embryonic limb development.
      type: gain of ectopic expression
      regulatory_category: GOE
      regulatory_element_type: ENHANCER
      affected_developmental_stage: embryonic limb development
      regulatory_mechanism: >-
        Duplication of the long-range limb-specific enhancer increases or
        spatially deregulates its activity in the limb bud.
    evidence:
    - reference: PMID:18417549
      reference_title: >-
        Triphalangeal thumb-polysyndactyly syndrome and syndactyly type IV are
        caused by genomic duplications involving the long range, limb-specific
        SHH enhancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using real-time quantitative polymerase chain reaction (qPCR), we
        identified duplication of ZRS and found that this duplication
        segregated with the limb phenotypes in all families but was not
        detected in unaffected family members or in unrelated control
        individuals.
      explanation: >-
        Segregation across six families establishes ZRS-encompassing
        duplications as a principal pathogenic variant class.
  - name: Heterozygous pre-ZRS point variant
    description: >-
      The recurrent pZRS variant chr7:156585476G>C (GRCh37/hg19;
      NC_000007.14:g.156792782C>G on GRCh38) segregates with TPT-PS and drives
      ectopic enhancer-reporter activity throughout the developing mouse limb
      bud.
    gene:
      preferred_term: LMBR1
      term:
        id: hgnc:13243
        label: LMBR1
    type: single-nucleotide regulatory variant
    clinical_significance: PATHOGENIC
    regulatory_category: GOE
    functional_effects:
    - function: limb-specific SHH expression
      description: >-
        The pZRS variant produces spatial gain of ectopic regulatory activity
        during limb development.
      type: gain of ectopic expression
      regulatory_category: GOE
      regulatory_element_type: ENHANCER
      affected_developmental_stage: embryonic limb development
      regulatory_mechanism: >-
        Alteration of an evolutionarily conserved sequence adjacent to ZRS
        changes enhancer activity; the exact transcription-factor and
        chromatin-contact mechanism remains unresolved.
    evidence:
    - reference: PMID:29543231
      reference_title: >-
        A point mutation in the pre-ZRS disrupts sonic hedgehog expression in
        the limb bud and results in triphalangeal thumb-polysyndactyly
        syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A point mutation in the pZRS (chr7:156585476G>C; GRCh37/hg19) was
        detected in all affected family members.
      explanation: >-
        Identifies the pZRS variant in every affected member of the studied
        TPT-PS family.
  evidence:
  - reference: PMID:18417549
    reference_title: >-
      Triphalangeal thumb-polysyndactyly syndrome and syndactyly type IV are
      caused by genomic duplications involving the long range, limb-specific
      SHH enhancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both TPTPS and SD4 are due to duplications involving ZRS, the limb
      specific SHH enhancer.
    explanation: >-
      Supports the causal LMBR1/ZRS regulatory locus while distinguishing the
      distant functional target, SHH.
phenotypes:
- category: Musculoskeletal
  name: Triphalangeal Thumb
  subtypes:
  - Isolated Triphalangeal Thumb
  - Preaxial Polydactyly Type 2
  - Triphalangeal Thumb-Polysyndactyly Syndrome
  - Werner Mesomelic Syndrome
  description: >-
    The thumb contains three phalanges rather than two. Shape, opposability,
    stiffness, and laterality vary among affected individuals.
  phenotype_term:
    preferred_term: Triphalangeal thumb
    term:
      id: HP:0001199
      label: Triphalangeal thumb
  evidence:
  - reference: PMID:10594878
    reference_title: >-
      Phenotypic variability of triphalangeal thumb-polysyndactyly syndrome
      linked to chromosome 7q36.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The characteristic findings in this family are triphalangeal thumb,
      webbing between 3rd, 4th, and 5th fingers associated with bony synostosis
      in the distal phalanges of the same fingers, and pre- and postaxial
      polysyndactyly of feet.
    explanation: >-
      Directly documents triphalangeal thumb in a TPT-PS pedigree.
- category: Musculoskeletal
  name: Preaxial Hand Polydactyly
  subtypes:
  - Preaxial Polydactyly Type 2
  - Triphalangeal Thumb-Polysyndactyly Syndrome
  - Werner Mesomelic Syndrome
  description: >-
    Extra digit elements occur on the radial/thumb side of the hand as part of
    the polysyndactyly phenotype.
  phenotype_term:
    preferred_term: Preaxial hand polydactyly
    term:
      id: HP:0001177
      label: Preaxial hand polydactyly
  evidence:
  - reference: PMID:10594878
    reference_title: >-
      Phenotypic variability of triphalangeal thumb-polysyndactyly syndrome
      linked to chromosome 7q36.
    supports: SUPPORT

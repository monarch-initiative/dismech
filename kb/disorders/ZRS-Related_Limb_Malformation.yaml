name: ZRS-Related Limb Malformation
creation_date: '2026-04-04T00:00:00Z'
description: >-
  ZRS-related limb malformation is the continuum of autosomal dominant congenital
  limb malformations produced by gain-of-function alterations of the zone of
  polarizing activity regulatory sequence (ZRS), a long-range limb-specific
  enhancer of SHH lying in intron 5 of LMBR1 roughly 1 Mb from its target gene.
  Every branch of the spectrum shares one pathograph: ectopic anterior SHH
  regulatory activity in the developing limb bud, disrupting anterior-posterior
  digit number and identity specification. What differs between branches is the
  molecular alteration and its dosage, not the mechanism. Point variants across
  the ZRS typically produce preaxial polydactyly with or without triphalangeal
  thumb; the specific position-404 variants produce the more severe Werner
  mesomelic phenotype that additionally involves the zeugopod; complete
  duplications produce Haas-type polysyndactyly and triphalangeal
  thumb-polysyndactyly syndrome, with smaller (<80 kb) duplications producing
  Laurin-Sandrow syndrome; and rarer point variants in the adjacent pre-ZRS
  (pZRS) produce triphalangeal thumb-polysyndactyly syndrome. Wieczorek et al.
  proposed "ZRS-associated syndromes" as the cover term for this continuum
  (PMID:19847792), and a single ZRS allele can produce several of the named
  entities within one kindred (PMID:24777739). This entry is curated at the locus
  level for that reason; the historically named entities are retained as grounded
  subtypes. Acheiropodia (OMIM:200500) is curated separately: it arises from
  deletion at the same locus and is a loss-of-function, limb-reduction pathograph
  running in the opposite direction.
category: Mendelian
parents:
- Congenital Disorder
- Limb Malformation
synonyms:
- ZRS-associated syndromes
- ZRS-associated limb malformation
- SHH ZRS enhancer gain-of-function limb malformation spectrum

name: POLR-Related Leukodystrophy
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: POLR-related (4H) leukodystrophy
  term:
    id: MONDO:0100605
    label: POLR-related leukodystrophy
description: >-
  POLR-related leukodystrophy — usually called POLR3-related hypomyelinating
  leukodystrophy (POLR3-HLD) or 4H leukodystrophy — is an autosomal recessive
  hypomyelinating leukodystrophy caused by biallelic hypomorphic variants in
  genes encoding subunits of RNA polymerase III (Pol III): POLR3A, POLR3B,
  POLR1C, and rarely POLR3K. Pol III transcribes short non-coding RNAs (all
  nuclear-encoded tRNAs, 5S rRNA, 7SL, 7SK and others); partial loss of that
  output produces a strikingly tissue-restricted disease dominated by failure of
  central nervous system myelin deposition, together with dental, endocrine and
  ocular involvement. The eponymous "4H" tetrad is Hypomyelination, Hypodontia,
  Hypogonadotropic hypogonadism, plus (near-universal, recognized later)
  progressive myopia. This entry is the umbrella entity spanning the Pol III
  subunit genes; the POLR3A-specific OMIM phenotype is curated separately as
  Hypomyelinating Leukodystrophy 7.
synonyms:
- 4H leukodystrophy
- 4H syndrome
- POLR3-related leukodystrophy
- POLR3-HLD
- Pol III-related leukodystrophy
- RNA polymerase III-related leukodystrophy
- Hypomyelination, hypodontia, hypogonadotropic hypogonadism
- Tremor-ataxia with central hypomyelination
- TACH
- Ataxia, delayed dentition and hypomyelination
- ADDH
- Leukodystrophy with oligodontia
- Hypomyelination with cerebellar atrophy and hypoplasia of the corpus callosum
- HCAHC

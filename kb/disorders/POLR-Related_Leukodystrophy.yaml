has_subtypes:
- name: POLR3A
  display_name: POLR3A-related POLR3-HLD (HLD7)
  subtype_term:
    preferred_term: Hypomyelinating leukodystrophy 7 (HLD7)
    term:
      id: MONDO:0011897
      label: leukodystrophy, hypomyelinating, 7, with or without oligodontia and/or hypogonadotropic hypogonadism
  description: >-
    Caused by biallelic POLR3A variants (largest, catalytic Pol III subunit,
    RPC1). Historically ascertained through French-Canadian founder families
    with tremor-ataxia with central hypomyelination (TACH), and shown to be
    allelic with 4H syndrome and leukodystrophy with oligodontia. Associated
    with a more severe clinical course than POLR3B-related disease. A dedicated
    dismech entry, Hypomyelinating Leukodystrophy 7, curates this subtype in
    depth.
  genes:
  - preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  evidence:
  - reference: PMID:21855841
    reference_title: "Mutations of POLR3A encoding a catalytic subunit of RNA polymerase Pol III cause a recessive hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 14 recessive mutations were found in 19 individuals with TACH,
      4H, or LO, establishing that these leukodystrophies are allelic.
    explanation: >-
      Establishes POLR3A as a cause of the disorder and unifies three
      historically separate clinical labels into one allelic spectrum.
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in POLR3A are associated with a more severe clinical course."
    explanation: Supports POLR3A-related disease as the more severe end of the spectrum.
- name: POLR3B
  display_name: POLR3B-related POLR3-HLD (HLD8)
  subtype_term:
    preferred_term: Hypomyelinating leukodystrophy 8 (HLD8)
    term:
      id: MONDO:0013722
      label: hypomyelinating leukodystrophy 8 with or without oligodontia and-or hypogonadotropic hypogonadism
  description: >-
    Caused by biallelic POLR3B variants (second-largest Pol III subunit, RPC2,
    which forms the catalytic centre together with RPC1). Generally a milder
    disease course than POLR3A-related disease. The recurrent hypomorphic
    c.1568T>A (p.Val523Glu) allele is carried by most patients on one allele,
    and homozygosity for it produces a mild phenotype.
  genes:
  - preferred_term: POLR3B
    term:
      id: hgnc:30348
      label: POLR3B
  evidence:
  - reference: PMID:22036172
    reference_title: "Recessive mutations in POLR3B, encoding the second largest subunit of Pol III, cause a rare hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We uncovered in three cases without POLR3A mutation recessive mutations in
      POLR3B, which codes for the second largest subunit of Pol III.
    explanation: Original identification of POLR3B as a second causal Pol III subunit gene.
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients carried the common c.1568T>A POLR3B mutation on one allele,
      homozygosity for which causes a mild phenotype.
    explanation: Documents the recurrent hypomorphic POLR3B allele and its milder effect.
- name: POLR1C
  display_name: POLR1C-related POLR3-HLD (HLD11)
  subtype_term:
    preferred_term: Hypomyelinating leukodystrophy 11 (HLD11)
    term:
      id: MONDO:0014666
      label: hypomyelinating leukodystrophy 11
  description: >-
    Caused by biallelic POLR1C variants. POLR1C encodes a subunit shared between
    RNA polymerase I and RNA polymerase III, making this subtype mechanistically
    distinctive: leukodystrophy-causing POLR1C variants selectively impair Pol
    III (not Pol I) assembly and nuclear import, whereas Treacher Collins
    syndrome-causing POLR1C variants leave polymerase assembly intact and
    instead disturb Pol I nucleolar targeting.
  genes:
  - preferred_term: POLR1C
    term:
      id: hgnc:20194
      label: POLR1C
  evidence:
  - reference: PMID:26151409
    reference_title: "Recessive mutations in POLR1C cause a leukodystrophy by impairing biogenesis of RNA polymerase III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report eight of these cases carrying recessive mutations in
      POLR1C, a gene encoding a shared POLR1 and POLR3 subunit, also mutated in
      some Treacher Collins syndrome (TCS) cases.
    explanation: >-
      Identifies POLR1C as a third causal gene and flags the shared Pol I/Pol III
      subunit identity underlying the allelic relationship with Treacher Collins
      syndrome.
- name: POLR3K
  display_name: POLR3K-related POLR3-HLD
  description: >-
    An ultra-rare subtype caused by biallelic POLR3K variants (a small Pol III
    subunit). Only a handful of patients have been reported worldwide. Reported
    phenotypes span a severe early-onset, rapidly progressive end and a
    comparatively mild end with childhood intellectual and behavioural
    disturbance and later minor motor dysfunction. No distinct MONDO term exists
    for this subtype, so subtype_term is deliberately left unbound rather than
    mapped to a near-miss identifier.
  genes:
  - preferred_term: POLR3K
    term:
      id: hgnc:14121
      label: POLR3K
  evidence:
  - reference: PMID:40225923
    reference_title: "Novel Pathogenic Variants in POLR3K Cause POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the third patient worldwide with pathogenic variants in
      POLR3K and clinical features consistent with POLR3-HLD.
    explanation: Establishes POLR3K as a causal gene and documents its extreme rarity.
  - reference: PMID:30584594
    reference_title: "Mutation in POLR3K causes hypomyelinating leukodystrophy and abnormal ribosomal RNA regulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease progression for both patients appeared in the most severe range of
      Pol III–related leukodystrophies in terms of age at onset (<18 months) and
      death (<20 years) and motor and cognitive development (no independent
      walking)
    explanation: Documents the severe end of the reported POLR3K phenotype.

pathophysiology:
- name: Biallelic Hypomorphic Pol III Subunit Variant
  description: >-
    The proximal molecular lesion is a pair of hypomorphic (not complete-null)
    variants in a gene encoding a subunit of RNA polymerase III — POLR3A,
    POLR3B, POLR1C, or POLR3K. No individual has been reported carrying two
    nonsense POLR3A alleles, consistent with a requirement for residual Pol III
    activity. Because Pol III is essential and ubiquitously expressed, disease
    arises from partial quantitative reduction of enzyme function rather than
    from its abolition.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:21855841
    reference_title: "Mutations of POLR3A encoding a catalytic subunit of RNA polymerase Pol III cause a recessive hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No individual was found to carry two nonsense mutations."
    explanation: >-
      Direct evidence that biallelic complete loss of function is not observed,
      supporting a hypomorphic-variant disease mechanism.
  - reference: PMID:22036172
    reference_title: "Recessive mutations in POLR3B, encoding the second largest subunit of Pol III, cause a rare hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in genes coding for Pol III subunits are a major cause of
      childhood-onset hypomyelinating leukodystrophies with prominent cerebellar
      dysfunction, oligodontia, and hypogonadotropic hypogonadism.
    explanation: Establishes Pol III subunit variants as the causal lesion of the 4H phenotype.
  downstream:
  - target: Impaired Pol III Complex Assembly and Nuclear Import
    description: >-
      Mutant subunits fail to support cytoplasmic assembly and nuclear import of
      the Pol III holoenzyme.
  - target: Reduced Steady-State Pol III Subunit Protein in Cerebral White Matter
    description: >-
      Hypomorphic alleles lower steady-state subunit protein, disproportionately
      in cerebral white matter.
  - target: Lysosomal Mislocalization of Mutant Pol III Subunits
    description: >-
      Some nonsense alleles produce aggregated mutant protein that is routed to
      lysosomes rather than to the nucleus.

- name: Impaired Pol III Complex Assembly and Nuclear Import
  description: >-
    Leukodystrophy-causing variants interfere with assembly of the multi-subunit
    Pol III holoenzyme in the cytoplasm and with its subsequent import into the
    nucleus, so less functional enzyme reaches chromatin. For POLR1C — a subunit
    shared with RNA polymerase I — this defect is selective for Pol III and
    spares Pol I, which is why POLR1C leukodystrophy variants do not produce the
    craniofacial phenotype caused by other POLR1C variants.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein-containing complex assembly
    term:
      id: GO:0065003
      label: protein-containing complex assembly
    modifier: DECREASED
  - preferred_term: protein import into nucleus
    term:
      id: GO:0006606
      label: protein import into nucleus
    modifier: DECREASED
  evidence:
  - reference: PMID:26151409
    reference_title: "Recessive mutations in POLR1C cause a leukodystrophy by impairing biogenesis of RNA polymerase III."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using shotgun proteomics and ChIP sequencing, we demonstrate that
      leukodystrophy-causative mutations, but not TCS mutations, in POLR1C
      impair assembly and nuclear import of POLR3, but not POLR1
    explanation: >-
      Direct experimental demonstration of the assembly and nuclear-import defect
      and of its selectivity for Pol III over Pol I.
  downstream:
  - target: Reduced Pol III Occupancy at Target Genes
    description: >-
      Less assembled, nuclear-localized enzyme is available to occupy Pol
      III-transcribed genes.

- name: Reduced Steady-State Pol III Subunit Protein in Cerebral White Matter
  description: >-
    Hypomorphic alleles reduce the steady-state amount of Pol III subunit
    protein, and this reduction is not uniform across tissues: immunoblotting of
    patient fibroblasts and of an autopsied 4H brain showed a significantly
    greater decrease in cerebral white matter than in cortex. This regional
    gradient is one of the few direct human observations bearing on why a
    ubiquitously required enzyme produces a white-matter-predominant disease.
  biological_scale: MOLECULAR
  locations:
  - preferred_term: white matter
    term:
      id: UBERON:0002316
      label: white matter
  evidence:
  - reference: PMID:21855841
    reference_title: "Mutations of POLR3A encoding a catalytic subunit of RNA polymerase Pol III cause a recessive hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      documented a significant decrease in POLR3A levels, and there was a more
      significant decrease in the cerebral white matter compared to that in the
      cortex
    explanation: >-
      Human tissue evidence for a white-matter-predominant reduction in Pol III
      subunit protein.
  downstream:
  - target: Oligodendrocyte Differentiation Arrest
    description: >-
      The white-matter-predominant protein deficit is proposed to underlie the
      selective vulnerability of the oligodendrocyte lineage.

- name: Reduced Pol III Occupancy at Target Genes
  description: >-
    With less assembled nuclear enzyme available, chromatin occupancy at Pol
    III-transcribed genes falls. ChIP-sequencing of mutant POLR1C showed reduced
    binding across the classes of Pol III-transcribed genes, including tRNA and
    5S rRNA genes, while occupancy at the Pol I-transcribed ribosomal RNA gene
    was unchanged.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: transcription by RNA polymerase III
    term:
      id: GO:0006383
      label: transcription by RNA polymerase III
    modifier: DECREASED
  evidence:
  - reference: PMID:26151409
    reference_title: "Recessive mutations in POLR1C cause a leukodystrophy by impairing biogenesis of RNA polymerase III."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also demonstrated that the leukodystrophy-causing mutations affect
      POLR3, but not POLR1 assembly and nuclear import, leading to decrease
      binding to POLR3 target genes
    explanation: >-
      Establishes reduced chromatin occupancy at Pol III target genes as the step
      linking the assembly defect to reduced transcript output.
  downstream:
  - target: Reduced Pol III Non-Coding Transcript Output
    description: Lower promoter occupancy translates into lower non-coding RNA synthesis.

- name: Reduced Pol III Non-Coding Transcript Output
  description: >-
    Transcription of the Pol III repertoire falls: all nuclear-encoded tRNAs, 5S
    rRNA (a structural component of the large ribosomal subunit), 7SL RNA (the
    signal recognition particle RNA) and 7SK RNA. Which transcript classes are
    most affected varies by causal gene and assay — patient fibroblasts with a
    POLR3K variant showed 5S rRNA and 7SL RNA most severely reduced, whereas the
    earliest measurable change in a Polr3a mutant mouse was a global reduction
    in the mature tRNA pool.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: tRNA transcription by RNA polymerase III
    term:
      id: GO:0042797
      label: tRNA transcription by RNA polymerase III
    modifier: DECREASED
  evidence:
  - reference: PMID:30584594
    reference_title: "Mutation in POLR3K causes hypomyelinating leukodystrophy and abnormal ribosomal RNA regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we compared the expression levels of some Pol III–transcribed RNAs in
      patient and control fibroblasts: transcription of both 5S rRNA and 7SL RNA
      was most severely reduced
    explanation: >-
      Human patient-derived cells directly demonstrate reduced Pol III transcript
      output.
  - reference: PMID:22036171
    reference_title: "Mutations in POLR3A and POLR3B encoding RNA Polymerase III subunits cause an autosomal-recessive hypomyelinating leukoencephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We hypothesize that perturbation of Pol III target transcription,
      especially of tRNAs, could be a common pathological mechanism underlying
      POLR3A and POLR3B mutations.
    explanation: >-
      Framed by the original authors as a hypothesis rather than a demonstrated
      result, so recorded as partial support for the shared-mechanism claim.
  downstream:
  - target: Reduced Mature tRNA Pool
    description: >-
      Lower tRNA gene transcription shrinks and reshapes the mature tRNA pool.
  - target: Constrained Translational Capacity
    description: >-
      Reduced 5S rRNA and 7SL RNA supply constrains ribosome function and
      co-translational targeting independently of the tRNA route.
  - target: Integrated Stress and Innate Immune Response Induction
    description: >-
      Later in the disease course, reduced Pol III output is accompanied by
      induction of stress and innate immune programmes.
  - target: Impaired Odontogenesis
    description: >-
      The dental arm branches from the shared transcript deficit rather than from
      the oligodendrocyte route. A conditional Polr3b mouse develops hypodontia,
      so the lesion acts directly on tooth development, but the intervening steps
      between reduced Pol III output and disturbed odontogenesis are not
      established.
  - target: Hypothalamic-Pituitary Gonadotropic Insufficiency
    description: >-
      The endocrine arm likewise branches from the shared transcript deficit. No
      published work identifies the cell type or step through which reduced Pol
      III output impairs gonadotropin drive, so this edge records the
      branch point rather than a worked-out mechanism.
  - target: Impaired Somatic Growth
    description: >-
      Growth impairment branches from the same shared deficit and is not
      explained by the neurological disease. The intervening mechanism, including
      why growth hormone deficiency is present in only some affected individuals,
      is unresolved.

- name: Lysosomal Mislocalization of Mutant Pol III Subunits
  description: >-
    A mechanistically separate, cell-autonomous arm demonstrated in
    oligodendroglial cell models: severe nonsense alleles of POLR3A
    (p.Arg140Ter) and POLR3B (p.Arg550Ter) produce protein aggregates that are
    routed to lysosomes instead of to the nucleus, whereas wild-type subunits
    are not lysosomal. This is currently supported only by in vitro cell-line
    data, and uses an allele class not observed biallelically in patients.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:35076634
    reference_title: "Hypomyelinating Leukodystrophy 7 (HLD7)-Associated Mutation of POLR3A Is Related to Defective Oligodendroglial Cell Differentiation, Which Is Ameliorated by Ibuprofen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      an HLD7-associated nonsense mutation of Arg140-to-Ter (R140X) primarily
      localizes POLR3A proteins as protein aggregates into lysosomes in mouse
      oligodendroglial FBD-102b cells
    explanation: Direct in vitro evidence for lysosomal mislocalization of a POLR3A nonsense allele.
  - reference: PMID:35225888
    reference_title: "Hypomyelinating Leukodystrophy 8 (HLD8)-Associated Mutation of POLR3B Leads to Defective Oligodendroglial Morphological Differentiation Whose Effect Is Reversed by Ibuprofen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      a severe HLD8-associated nonsense mutation (Arg550-to-Ter (R550X))
      primarily localizes POLR3B proteins as protein aggregates into lysosomes
      in the FBD-102b cell line as an oligodendroglial precursor cell model
    explanation: >-
      Shows the same lysosomal-mislocalization mechanism for a POLR3B nonsense
      allele, supporting it as a cross-gene arm.
  downstream:
  - target: mTOR Signaling Suppression
    description: >-
      The lysosomal burden of mislocalized mutant subunits suppresses
      lysosome-associated mTOR signaling.

- name: mTOR Signaling Suppression
  description: >-
    Expression of lysosomally mislocalized mutant Pol III subunits reduces
    signaling through the mechanistic target of rapamycin, the lysosome-anchored
    hub controlling anabolic growth. This is the node the ibuprofen rescue acts
    on, and the reason that lead is mechanistically framed as mTOR reactivation
    rather than as an anti-inflammatory effect.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:35076634
    reference_title: "Hypomyelinating Leukodystrophy 7 (HLD7)-Associated Mutation of POLR3A Is Related to Defective Oligodendroglial Cell Differentiation, Which Is Ameliorated by Ibuprofen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of the R140X mutant proteins, but not the wild type proteins,
      in cells decreased signaling through the mechanistic target of rapamycin
      (mTOR), controlling signal transduction around lysosomes.
    explanation: Direct in vitro evidence that the POLR3A mutant suppresses mTOR signaling.
  - reference: PMID:35225888
    reference_title: "Hypomyelinating Leukodystrophy 8 (HLD8)-Associated Mutation of POLR3B Leads to Defective Oligodendroglial Morphological Differentiation Whose Effect Is Reversed by Ibuprofen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, the expression of proteins with the R550X mutation in cells
      decreased lysosome-related signaling through the mechanistic target of
      rapamycin (mTOR).
    explanation: Independent replication of mTOR suppression for a POLR3B nonsense allele.
  downstream:
  - target: Oligodendrocyte Differentiation Arrest
    description: >-
      Suppressed mTOR signaling blocks the morphological differentiation
      programme of oligodendroglial cells.

- name: Reduced Mature tRNA Pool
  description: >-
    The mature tRNA pool shrinks and shifts in composition. In a postnatal
    whole-body Polr3a mutant mouse, tRNA sequencing early in disease showed a
    global reduction and altered profile of mature tRNAs at a stage when no
    other Pol III transcript class had changed and stress programmes were not
    yet induced, placing this deficit upstream as a disease-initiating event.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:39499645
    reference_title: "Molecular basis of neurodegeneration in a mouse model of Polr3-related disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Earlier in the disease when integrated stress and innate immune responses
      are minimally induced, mature tRNA sequencing revealed a global reduction
      in tRNA levels and an altered tRNA profile but no changes in other Pol III
      transcripts. Thus, changes in the size and/or composition of the tRNA pool
      have a causal role in disease initiation.
    explanation: >-
      Temporal ordering evidence placing the tRNA-pool deficit upstream of stress
      responses; mouse data, not yet confirmed in human tissue.
  downstream:
  - target: Constrained Translational Capacity
    description: >-
      A smaller, compositionally altered tRNA pool is expected to limit the rate
      and fidelity of protein synthesis.

- name: Constrained Translational Capacity
  description: >-
    Reduced supply of Pol III products that serve protein synthesis — tRNAs, 5S
    rRNA as a structural component of the large ribosomal subunit, and 7SL RNA
    as the signal recognition particle RNA — is proposed to constrain
    translational capacity. This step is an inference: it is the mechanism the
    field invokes to connect reduced Pol III output to a myelination defect, but
    translational output has not been measured directly in patient
    oligodendrocytes, so both supporting citations are recorded as partial.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  evidence:
  - reference: PMID:22036171
    reference_title: "Mutations in POLR3A and POLR3B encoding RNA Polymerase III subunits cause an autosomal-recessive hypomyelinating leukoencephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pol III is involved in the transcription of small noncoding RNAs, such as
      5S ribosomal RNA and all transfer RNAs (tRNA).
    explanation: >-
      Establishes that the affected transcripts are the ones serving translation,
      without itself measuring translational output.
  - reference: PMID:30584594
    reference_title: "Mutation in POLR3K causes hypomyelinating leukodystrophy and abnormal ribosomal RNA regulation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Disruption in ribosomal regulation of mRNA translation may contribute to
      white matter developmenta
    explanation: >-
      The authors frame the translational link as a possible contribution ("may
      contribute"), which is why this is partial rather than full support.
  downstream:
  - target: Oligodendrocyte Differentiation Arrest
    description: >-
      Oligodendrocyte maturation and the high translational demand of myelin
      protein synthesis are proposed to be especially sensitive to this
      constraint.

- name: Integrated Stress and Innate Immune Response Induction
  description: >-
    As disease progresses in a Polr3a mutant mouse, cerebral transcriptomes show
    induction of innate immune and integrated stress response programmes
    alongside microglial activation. This is a secondary amplification arm
    rather than a disease-initiating event, since it is minimally induced at the
    stage when the tRNA deficit is already present.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:39499645
    reference_title: "Molecular basis of neurodegeneration in a mouse model of Polr3-related disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Transcriptome and immunohistochemistry analyses of cerebra during disease
      progression show a reduction in most Pol III transcripts, induction of
      innate immune and integrated stress responses and cell-type-specific gene
      expression changes reflecting neuron and oligodendrocyte loss and
      microglial activation.
    explanation: >-
      Documents the stress and innate-immune arm and its association with neuron
      and oligodendrocyte loss in the mouse model.
  downstream:
  - target: Progressive Cerebral Neurodegeneration
    description: >-
      Chronic stress and innate immune activation accompany progressive neuronal
      and oligodendrocyte loss.

- name: Oligodendrocyte Differentiation Arrest
  conforms_to: "cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death"
  description: >-
    Oligodendrocyte precursor cells fail to proliferate and differentiate into
    mature myelinating oligodendrocytes. Lineage tracing in a conditional Polr3b
    mouse model identified defective precursor proliferation and differentiation,
    with failure to generate an adequate number of mature oligodendrocytes during
    postnatal myelinogenesis, as the mechanism underlying hypomyelination.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: oligodendrocyte differentiation
    term:
      id: GO:0048709
      label: oligodendrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:37635302
    reference_title: "Hypomyelination, hypodontia and craniofacial abnormalities in a Polr3b mouse model of leukodystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lineage tracing uncovered the underlying mechanism for the hypomyelinating
      phenotype: defective oligodendrocyte precursor proliferation and
      differentiation resulted in a failure to produce an adequate number of
      mature oligodendrocytes during postnatal myelinogenesis.
    explanation: >-
      In vivo lineage-tracing evidence that precursor proliferation and
      differentiation failure is the proximate cause of hypomyelination.
  - reference: PMID:34583988
    reference_title: "Defective myelination in an RNA polymerase III mutant leukodystrophic mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      disease pathogenesis in the mice involves defects that reduce both the
      number of mature myelinating oligodendrocytes and the ability of these
      cells to produce a myelin sheath of normal thickness
    explanation: >-
      Independent mouse model showing both reduced mature oligodendrocyte number
      and reduced per-cell myelinating capacity.
  downstream:
  - target: Deficient Central Nervous System Myelin Deposition
    description: >-
      Too few mature oligodendrocytes, each with reduced myelinating capacity,
      cannot lay down a normal myelin sheath.

- name: Deficient Central Nervous System Myelin Deposition
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"
  description: >-
    Central myelin is never adequately deposited — a developmental and
    maturational deficit (hypomyelination), not destruction of previously normal
    myelin (demyelination). Structures that myelinate earliest in development are
    relatively spared, giving the characteristic MRI pattern of diffuse
    hypomyelination with relative T2 hypointensity of the ventrolateral thalamus,
    globus pallidus, optic radiation, corticospinal tract at the internal
    capsule, and dentate nucleus.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: central nervous system myelination
    term:
      id: GO:0022010
      label: central nervous system myelination
    modifier: DECREASED
  locations:
  - preferred_term: white matter
    term:
      id: UBERON:0002316
      label: white matter
  evidence:
  - reference: PMID:34583988
    reference_title: "Defective myelination in an RNA polymerase III mutant leukodystrophic mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice expressing pathogenic mutations in the largest Pol III subunit,
      Polr3a, specifically in Olig2-expressing cells, have impaired growth and
      developmental delay, deficits in cognitive, sensory, and fine sensorimotor
      function, and hypomyelination in multiple regions of the cerebrum and
      spinal cord
    explanation: >-
      Oligodendrocyte-lineage-restricted expression of a pathogenic Polr3a variant
      is sufficient to cause hypomyelination, supporting a cell-autonomous
      mechanism.
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systematic MRI review revealed that the combination of hypomyelination
      with relative T2 hypointensity of the ventrolateral thalamus, optic
      radiation, globus pallidus, and dentate nucleus, cerebellar atrophy, and
      thinning of the corpus callosum suggests the diagnosis.
    explanation: >-
      Human imaging evidence for hypomyelination with a characteristic
      relative-sparing pattern.
  downstream:
  - target: Progressive Cerebellar Atrophy
    description: >-
      Chronically hypomyelinated cerebellar tracts undergo progressive atrophy.
  - target: Progressive Cerebral Neurodegeneration
    description: >-
      Chronically hypomyelinated supratentorial tracts and their neurons undergo
      progressive degeneration.
  - target: Progressive Cerebellar Motor Dysfunction
    description: >-
      Deficient myelination of cerebellar and corticospinal pathways impairs
      motor control.

- name: Progressive Cerebellar Atrophy
  description: >-
    Superimposed on the developmental hypomyelination is progressive loss of
    cerebellar volume, visible on serial imaging alongside thinning of the
    corpus callosum. The presence of an atrophic component on top of a
    developmental myelination deficit is what distinguishes the Pol III
    leukodystrophies from purely demyelinating disorders.
  biological_scale: TISSUE
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cerebellar atrophy, and thinning of the corpus callosum suggests the diagnosis"
    explanation: Human imaging evidence for the superimposed cerebellar atrophic component.
  downstream:
  - target: Progressive Cerebellar Motor Dysfunction
    description: Cerebellar atrophy translates into worsening ataxia, tremor and dysarthria.

- name: Progressive Cerebral Neurodegeneration
  description: >-
    A distinct supratentorial degenerative arm, characterized in mouse cerebra
    as neuron and oligodendrocyte loss with microglial activation and
    accompanying behavioural deficits. It is separated from the cerebellar node
    because the two rest on different evidence: the cerebellar claim is human
    imaging, this one is mouse neuropathology and transcriptomics.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:39499645
    reference_title: "Molecular basis of neurodegeneration in a mouse model of Polr3-related disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Polr3a mutant mice exhibit behavioral deficits, cerebral pathology and
      exocrine pancreatic atrophy.
    explanation: Supports progressive cerebral pathology in a Pol III mutant model.
  - reference: PMID:39499645
    reference_title: "Molecular basis of neurodegeneration in a mouse model of Polr3-related disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cell-type-specific gene expression changes reflecting neuron and
      oligodendrocyte loss and microglial activation
    explanation: Identifies the cell populations lost in the cerebral degenerative arm.
  downstream:
  - target: Progressive Cognitive Decline
    description: Cerebral neuronal loss contributes to later cognitive deterioration.

- name: Progressive Cerebellar Motor Dysfunction
  description: >-
    The clinically dominant motor syndrome: progressive cerebellar dysfunction
    (ataxia, dysarthria, dysmetria, tremor), with lesser pyramidal (spasticity)
    and extrapyramidal (dystonia) involvement. Most patients present before age
    6 years with gross motor delay or regression.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic dysfunction, typically predominated by motor dysfunction"
    explanation: GeneReviews states the motor-predominant character of the neurologic syndrome.
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients presented before 6 years with gross motor delay
      or regression.
    explanation: Cohort evidence for the age and mode of motor presentation.

- name: Progressive Cognitive Decline
  description: >-
    Cognitive dysfunction is part of the neurologic syndrome but is generally
    later and less prominent than the motor deterioration, except in the
    late-onset subgroup where academic difficulty or cognitive plateau can be
    the presenting feature.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "and cognitive dysfunctions"
    explanation: >-
      GeneReviews lists cognitive dysfunction among the neurologic features and
      ranks it below motor dysfunction, but the abstract does not itself time the
      decline, so this is recorded as partial support.
  - reference: PMID:30584594
    reference_title: "Mutation in POLR3K causes hypomyelinating leukodystrophy and abnormal ribosomal RNA regulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      motor and cognitive development (no independent walking) and degradation
    explanation: >-
      Documents cognitive degradation, not merely static impairment, in two
      severely affected POLR3K patients.

- name: Impaired Odontogenesis
  description: >-
    Tooth development is disturbed independently of the CNS phenotype, producing
    delayed dentition, an abnormal order of eruption, abnormally placed or
    shaped teeth, and hypodontia or oligodontia. A conditional Polr3b mouse
    model reproduces hypodontia together with craniofacial abnormalities,
    supporting the dental arm as a direct consequence of reduced Pol III function
    rather than a secondary effect of neurological disease.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: odontogenesis
    term:
      id: GO:0042476
      label: odontogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37635302
    reference_title: "Hypomyelination, hypodontia and craniofacial abnormalities in a Polr3b mouse model of leukodystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we characterized the Polr3bΔ10 mutation and developed an animal model that
      recapitulates features of POLR3-HLD caused by POLR3B mutations
    explanation: >-
      The model, whose reported features include hypodontia and craniofacial
      abnormalities alongside hypomyelination, supports a primary Pol
      III-dependent dental arm.
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal dentition (delayed dentition, hypodontia, oligodontia, and
      abnormally placed or shaped teeth).
    explanation: GeneReviews defines the dental component of the tetrad.

- name: Hypothalamic-Pituitary Gonadotropic Insufficiency
  description: >-
    Insufficient gonadotropin drive to the gonads produces hypogonadotropic
    hypogonadism, manifesting as delayed, arrested, or absent puberty. This is
    the most common endocrine feature and one of the three defining "H"s, though
    it is not invariably present.
  biological_scale: ORGANISM
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more commonly, hypogonadotropic hypogonadism manifesting as delayed,
      arrested, or absent puberty
    explanation: GeneReviews defines the endocrine component and its clinical manifestation.

- name: Impaired Somatic Growth
  description: >-
    Linear growth is impaired in roughly half of individuals. Growth hormone
    deficiency is demonstrable in some but not all of them, so the node is
    stated as the growth outcome rather than as a specific pituitary lesion.
    This is a separate endocrine axis from the gonadotropic one and is not
    universally coupled to it.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endocrine abnormalities such as short stature (in ~50% of individuals)
      with or without growth hormone deficiency
    explanation: >-
      GeneReviews documents short stature with variable growth hormone deficiency
      as a distinct endocrine manifestation.

phenotypes:

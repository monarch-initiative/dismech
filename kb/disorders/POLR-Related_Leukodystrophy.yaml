diagnosis:
- name: Brain MRI pattern recognition
  description: >-
    Brain MRI is the diagnostic cornerstone. The combination of diffuse
    hypomyelination with relative T2 hypointensity of the ventrolateral
    thalamus, optic radiation, globus pallidus and dentate nucleus, plus
    cerebellar atrophy and corpus callosum thinning, suggests the diagnosis —
    and is especially valuable when the non-neurological cardinal features are
    absent. Atypical patterns exist, so an atypical MRI does not exclude the
    diagnosis.
  evidence:
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI characteristics are helpful in addressing the diagnosis, especially if
      patients lack the cardinal non-neurologic features.
    explanation: States the specific diagnostic role of MRI pattern recognition.

- name: Molecular genetic testing of Pol III subunit genes
  description: >-
    Definitive diagnosis requires identification of biallelic pathogenic
    variants in POLR3A, POLR3B or POLR1C (or, rarely, POLR3K). Because
    copy-number alleles occur, testing should be able to detect deletions as
    well as sequence variants.
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      POLR3-related leukodystrophy is diagnosed by the combination of classic
      clinical findings, typical brain MRI features, and the presence of
      biallelic pathogenic variants in POLR3A, POLR3B, or POLR1C.
    explanation: GeneReviews states the diagnostic triad including molecular confirmation.
  - reference: PMID:40225923
    reference_title: "Novel Pathogenic Variants in POLR3K Cause POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a maternally inherited large deletion, spanning approximately 17.8 kb from
      chr16:30,362-48,162
    explanation: >-
      Concrete example of a copy-number allele that sequence-only analysis would
      not detect.

treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    No disease-modifying therapy exists. Management is symptomatic and
    supportive, delivered by a multidisciplinary team spanning neurology,
    genetics, rehabilitation, dentistry, endocrinology, ophthalmology,
    otolaryngology and primary care. Dysphagia management deserves particular
    care because swallowing ability varies widely, even within a single day, and
    dystonia should be monitored and treated to prevent complications.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individualized care by a multidisciplinary team including a pediatric
      neurologist, clinical geneticist, physiotherapist, occupational therapist,
      speech and language pathologist, neuropsychologist, rehabilitation
      physician, dentist, endocrinologist, ophthalmologist,
      ear-nose-and-throat specialist, and primary care physician is recommended.
    explanation: GeneReviews management recommendation, quoted directly.

- name: Physical and Occupational Therapy
  description: >-
    Rehabilitation for progressive ataxia, spasticity and dystonia, forming part
    of the recommended multidisciplinary programme.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "physiotherapist, occupational therapist, speech and language pathologist"
    explanation: >-
      GeneReviews includes physiotherapy and occupational therapy in the
      recommended care team.

- name: Dysphagia Management and Surveillance
  description: >-
    Proactive swallowing assessment, dietary texture modification, and
    escalation to gastrostomy when nutritional intake or aspiration risk
    demands. Swallowing ability is characteristically variable within a single
    day, so a single assessment can be misleading.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Special caution needs to be taken when managing dysphagia in this disorder
      as it is known to vary widely, even in a single day.
    explanation: GeneReviews explicitly flags this management caution.

- name: Dystonia Monitoring and Treatment
  description: >-
    GeneReviews singles dystonia out for active monitoring and treatment, not
    merely observation, because untreated dystonia drives complications and
    quality-of-life loss. No POLR3-specific antidystonic agent or regimen has
    been established, so drug selection follows general dystonia practice; that
    is why this entry records the management imperative without naming a
    specific agent.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Dystonia
    term:
      id: HP:0001332
      label: Dystonia
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dystonia should be monitored and treated to prevent complications and
      improve the quality of life
    explanation: GeneReviews states the management imperative verbatim.

- name: Deep Brain Stimulation for Refractory Dystonic Tremor
  description: >-
    Deep brain stimulation has been used for treatment-refractory dystonic arm

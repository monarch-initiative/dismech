- name: Endocrine Surveillance and Replacement Therapy
  description: >-
    Systematic endocrine evaluation is warranted: in a 150-patient cohort,
    delayed puberty (77%) and short stature (61%) were the commonest
    abnormalities and abnormal thyroid function was found in 22%. Pubertal
    induction and sex-hormone replacement, growth-hormone assessment, and thyroid
    monitoring follow from these findings. Important caveat carried from the
    source: the same authors concluded that endocrine abnormalities are typically
    underinvestigated and that evidence-based management recommendations do not
    yet exist for this disorder, so this entry records surveillance and standard
    replacement practice rather than a validated protocol. Modality is recorded
    as OTHER because the node mixes a surveillance arm with pharmacological
    hormone replacement and so belongs to neither the behavioral/lifestyle nor a
    single drug bucket cleanly.

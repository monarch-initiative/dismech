imaging_findings:
- name: Diffuse Hypomyelination with Selective Relative T2 Hypointensity
  modality: MRI
  description: >-
    The diagnostic hallmark: diffuse white matter hypomyelination combined with
    relative T2 hypointensity (i.e., comparatively preserved myelination) of the
    ventrolateral thalamus, optic radiation, globus pallidus, corticospinal
    tract at the internal capsule, and dentate nucleus — all structures that
    myelinate early in development.
  diagnostic: true
  evidence:
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systematic MRI review revealed that the combination of hypomyelination
      with relative T2 hypointensity of the ventrolateral thalamus, optic
      radiation, globus pallidus, and dentate nucleus, cerebellar atrophy, and
      thinning of the corpus callosum suggests the diagnosis.
    explanation: Defines the pattern-recognition criteria used clinically.

- name: Closed Eye Sign (Preserved Medial Lemniscus Myelination)
  modality: MRI
  description: >-
    At 3T, better myelination of the medial lemniscus produces a relatively
    hypointense signal of this structure on axial T2-weighted images — the
    "closed eye sign" — present in all patients in a 12-patient 3T series and
    useful in separating 4H leukodystrophy from Pelizaeus-Merzbacher disease.
  evidence:
  - reference: PMID:29179231
    reference_title: "4H Leukodystrophy: Lessons from 3T Imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had better myelination of the medial lemniscus with a
      relatively hypointense signal of this structure on axial T2-weighted (T2W)
      images ("closed eye sign").
    explanation: Documents the sign and its presence in all 12 patients imaged at 3T.

- name: Myelin Islets
  modality: MRI
  description: >-
    Variable numbers of small T1-hyperintense, T2-hypointense dots, mostly in
    frontal and parietal white matter, present in all patients in the 3T series
    and corresponding histologically to perivascular myelin staining within
    hypomyelinated white matter.
  evidence:
  - reference: PMID:29179231
    reference_title: "4H Leukodystrophy: Lessons from 3T Imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myelin islets were variable numbers of small T1 hyperintense and T2
      hypointense dots, mostly in the frontal and parietal white matter, and
      present in all patients.
    explanation: Describes the finding and its frequency in the 3T cohort.

- name: Atypical Selective Corticospinal Tract Involvement
  modality: MRI
  description: >-
    A minority of molecularly confirmed patients lack diffuse hypomyelination
    and instead show selective involvement of the corticospinal tracts at the
    posterior limbs of the internal capsules, or isolated moderate-to-severe
    cerebellar atrophy. Recognizing these patterns matters because the classic
    pattern cannot be used as a gate for genetic testing.
  evidence:
  - reference: PMID:27029625
    reference_title: "Diffuse hypomyelination is not obligate for POLR3-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 2 novel MRI patterns: 4 participants presented a selective
      involvement of the corticospinal tracts, specifically at the level of the
      posterior limbs of the internal capsules; 4 patients presented moderate to
      severe cerebellar atrophy.
    explanation: >-
      Documents the two atypical imaging patterns in eight molecularly confirmed
      patients.

genetic:
- name: POLR3A
  gene_term:
    preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic hypomorphic variants in POLR3A, encoding the largest catalytic Pol
    III subunit (RPC1), cause POLR3-HLD. Together with POLR3B it accounts for
    the large majority of molecularly solved cases; in one referral series
    POLR3A variants were the more frequent of the two.
  evidence:
  - reference: PMID:23355746
    reference_title: "Mutations in POLR3A and POLR3B are a major cause of hypomyelinating leukodystrophies with or without dental abnormalities and/or hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, our group has described 37 patients, of whom 27 have mutations in
      POLR3A and 10 in POLR3B, respectively.
    explanation: >-
      Provides the per-gene case split in this referral series; ascertainment
      differs between series, so this is not a population estimate.
  case_fractions:
  - population: Single-group referral series of hypomyelinating leukodystrophy patients with typical Pol III features
    case_fraction_percent: 73.0
    cohort_size: 37
    notes: >-
      27 of 37 patients described by this group carried POLR3A variants. This is
      a clinically ascertained referral series, not a population estimate, and
      the split differs in other series.
    evidence:
    - reference: PMID:23355746
      reference_title: "Mutations in POLR3A and POLR3B are a major cause of hypomyelinating leukodystrophies with or without dental abnormalities and/or hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        our group has described 37 patients, of whom 27 have mutations in POLR3A
        and 10 in POLR3B
      explanation: Numerator and denominator for the case fraction.

- name: POLR3B
  gene_term:
    preferred_term: POLR3B
    term:
      id: hgnc:30348
      label: POLR3B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic variants in POLR3B, encoding the second-largest Pol III subunit
    (RPC2), cause a generally milder form. The recurrent c.1568T>A (p.Val523Glu)
    hypomorphic allele is carried on one allele by most POLR3B patients, and
    patients of European background are more likely to carry POLR3B than other
    Pol III gene variants. Variant classes include missense, nonsense and
    splice-site changes and also large exonic deletions, which matters for
    testing strategy: patients in whom only one POLR3B variant is found on
    sequencing may carry a copy-number allele in trans that requires
    deletion-sensitive analysis to detect.
  evidence:
  - reference: PMID:26045207
    reference_title: "Large exonic deletions in POLR3B gene cause POLR3-related leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a small proportion of patients, no mutation in either gene or only one
      mutation is found. Analysis of the POLR3B cDNA revealed a large deletion
      of exons 21-22 in one case and of exons 26-27 in another case.
    explanation: >-
      Documents multi-exon POLR3B deletions as a real variant class and ties them
      to the single-variant-found diagnostic scenario.
  - reference: PMID:25339210
    reference_title: "Clinical spectrum of 4H leukodystrophy caused by POLR3A and POLR3B mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Except for French Canadian patients, patients from European backgrounds
      were more likely to have POLR3B mutations than other populations.
    explanation: Documents the ancestry-dependent distribution between the two major genes.

- name: POLR1C
  gene_term:
    preferred_term: POLR1C
    term:
      id: hgnc:20194
      label: POLR1C
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic POLR1C variants cause a minority of cases. POLR1C is shared
    between Pol I and Pol III; leukodystrophy-causing variants selectively
    disrupt Pol III biogenesis. Clinical and radiological features are
    compatible with POLR3-related leukodystrophy, but affected individuals do
    not necessarily display the full tetrad.
  evidence:
  - reference: PMID:26151409
    reference_title: "Recessive mutations in POLR1C cause a leukodystrophy by impairing biogenesis of RNA polymerase III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      clinical and radiological characteristics of these eight cases were
      compatible with POLR3-related leukodystrophy; however, patients did not
      necessarily have all clinical
    explanation: >-
      Establishes POLR1C causality and the incomplete expression of the full
      tetrad in POLR1C-related disease.

- name: POLR3K
  gene_term:
    preferred_term: POLR3K
    term:
      id: hgnc:14121
      label: POLR3K
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: ultra-rare; a handful of patients reported worldwide
  association: >-
    Biallelic POLR3K variants are an ultra-rare cause. Reported genotypes
    include a C-terminal missense variant in trans with a large deletion
    removing the last exon, with demonstrated reduction of POLR3K RNA and of Pol
    III-transcribed RNAs in patient material.
  evidence:
  - reference: PMID:40225923
    reference_title: "Novel Pathogenic Variants in POLR3K Cause POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing revealed a paternally inherited missense
      variant in POLR3K (c.322G>T; p.D108Y) and a maternally inherited large
      deletion, spanning approximately 17.8 kb from chr16:30,362-48,162.
    explanation: >-
      Documents a compound-heterozygous POLR3K genotype including a copy-number
      allele, which sequence-only testing would miss.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    POLR-related leukodystrophy is inherited in an autosomal recessive manner.
    Each sib of an affected individual has a 25% chance of being affected, a 50%
    chance of being an asymptomatic carrier, and a 25% chance of being
    unaffected and not a carrier. Carrier testing and prenatal diagnosis are
    possible once both familial pathogenic variants are known. Biallelic
    complete-null genotypes have not been observed, consistent with a
    requirement for residual Pol III activity. Expressivity is highly variable,
    ranging from a severe early-infantile course with death in the first years of
    life to attenuated adult-onset presentations; variability tracks the specific
    allele combination (severe versus hypomorphic) more than any identified
    modifier locus.
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      POLR3-related leukodystrophy is inherited in an autosomal recessive
      manner. At conception, each sib of an affected individual has a 25% chance
      of being affected, a 50% chance of being an asymptomatic carrier, and a
      25% chance of being unaffected and not a carrier.
    explanation: GeneReviews states the inheritance pattern and recurrence risks directly.


    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:22855961
    reference_title: "POLR3-Related Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carrier testing for at-risk relatives and prenatal diagnosis for
      pregnancies at increased risk are possible if both pathogenic variants in
      the family are known.
    explanation: GeneReviews genetic counseling recommendation, quoted directly.

- name: Ibuprofen (investigational, preclinical only)
  description: >-
    Ibuprofen, an NSAID that also acts as an mTOR signaling activator, reverses
    the defective oligodendroglial differentiation phenotype produced by severe
    POLR3A and POLR3B nonsense alleles in an oligodendroglial precursor cell
    line. This is a mechanism-based repurposing lead only: the evidence is
    entirely in vitro in a mouse cell line, there is no in vivo or human
    efficacy data, and it must not be read as a treatment recommendation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ibuprofen
      term:
        id: CHEBI:5855
        label: ibuprofen
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: mTOR Signaling Suppression
    treatment_effect: INHIBITS
    description: >-
      Ibuprofen acts as an mTOR signaling activator, reversing the suppression
      caused by lysosomally mislocalized mutant Pol III subunits and releasing
      the differentiation block in vitro.
  evidence:
  - reference: PMID:35225888
    reference_title: "Hypomyelinating Leukodystrophy 8 (HLD8)-Associated Mutation of POLR3B Leads to Defective Oligodendroglial Morphological Differentiation Whose Effect Is Reversed by Ibuprofen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ibuprofen, which is a non-steroidal anti-inflammatory drug (NSAID),
      improved the defects in their differentiation phenotypes and signaling
      through mTOR.
    explanation: >-
      In vitro rescue in an oligodendroglial precursor cell model carrying a
      POLR3B nonsense allele. Cell-line evidence only.
  - reference: PMID:35076634
    reference_title: "Hypomyelinating Leukodystrophy 7 (HLD7)-Associated Mutation of POLR3A Is Related to Defective Oligodendroglial Cell Differentiation, Which Is Ameliorated by Ibuprofen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ibuprofen, a non-steroidal anti-inflammatory drug (NSAID), which is also
      known as an mTOR signaling activator, ameliorated defects in
      differentiation with myelin marker protein expression and the related
      signaling in cells harboring the R140X mutant constructs.
    explanation: >-
      Parallel in vitro rescue for a POLR3A nonsense allele, supporting a
      cross-gene mechanism. Cell-line evidence only.

animal_models:
- species: Mus musculus
  genotype: Olig2-Cre-driven expression of pathogenic Polr3a variants
  category: Conditional oligodendrocyte-lineage mouse model
  description: >-
    Restricting expression of pathogenic Polr3a mutations to Olig2-expressing
    (oligodendrocyte-lineage) cells is sufficient to cause hypomyelination in
    cerebrum and spinal cord together with growth, cognitive, sensory and fine
    sensorimotor deficits, establishing a cell-autonomous oligodendroglial
    requirement for Pol III. Gross motor deficits and cerebellar hypomyelination,
    common in severely affected patients, are absent, so the model reproduces
    only part of the human phenotype.
  genes:
  - preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  evidence:
  - reference: PMID:34583988
    reference_title: "Defective myelination in an RNA polymerase III mutant leukodystrophic mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, the gross motor defects and cerebellar hypomyelination that
      are common features of severely affected patients are absent in the mice,
      suggesting a relatively mild form of the disease in this conditional
      model.
    explanation: >-
      The authors themselves scope the model's fidelity, which is why it is
      recorded here with its limitation rather than as a full phenocopy.

- species: Mus musculus
  genotype: Polr3b delta-10 conditional hypomorph (Pdgfra-Cre/ERT; R26-Stopfl-EYFP; Polr3bfl)
  category: Inducible conditional mouse model
  description: >-
    The most complete published murine phenocopy: postnatally induced expression
    of the orthologous Polr3b delta-10 hypomorph reproduces hypomyelination,
    hypodontia and craniofacial abnormalities, and lineage tracing identified
    defective oligodendrocyte precursor proliferation and differentiation as the
    mechanism.
  genes:
  - preferred_term: POLR3B
    term:
      id: hgnc:30348
      label: POLR3B
  evidence:
  - reference: PMID:37635302
    reference_title: "Hypomyelination, hypodontia and craniofacial abnormalities in a Polr3b mouse model of leukodystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we characterized the Polr3bΔ10 mutation and developed an animal model that
      recapitulates features of POLR3-HLD caused by POLR3B mutations, shedding
      light on disease pathogenesis, and opening the door to the development of
      therapeutic interventions.
    explanation: Establishes the model as a partial phenocopy spanning CNS and dental features.

- species: Mus musculus
  genotype: Polr3a c.2015G>A (p.G672E) knock-in, homozygous and compound heterozygous with a null allele
  category: Constitutive knock-in mouse model (negative result)
  description: >-
    Introducing the French-Canadian founder Polr3a mutation into mice produced
    no motor phenotype, no detectable myelination deficit, and no significant
    change in brain Pol III transcript levels — a negative result that contrasts
    with the oligodendrocyte-lineage conditional models and is a key caveat when
    interpreting mouse data for this disease.
  genes:
  - preferred_term: POLR3A
    term:
      id: hgnc:30074
      label: POLR3A
  evidence:
  - reference: PMID:28407788
    reference_title: "Absence of neurological abnormalities in mice homozygous for the Polr3a G672E hypomyelinating leukodystrophy mutation."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that the first transgenic mice with a leukodystrophy-causing
      Polr3a mutation do not recapitulate the childhood-onset HLD observed in
      the majority of human patients
    explanation: >-
      Recorded as REFUTE with respect to the claim that this knock-in models human
      POLR3-HLD; it is a genuine negative model result, not a supporting one.

differential_diagnoses:
- name: Pelizaeus-Merzbacher disease and Pelizaeus-Merzbacher-like disease 1
  description: >-
    The archetypal hypomyelinating leukodystrophies and the closest imaging
    mimics. PLP1-related Pelizaeus-Merzbacher disease (X-linked) and
    GJC2-related Pelizaeus-Merzbacher-like disease 1 (autosomal recessive) both
    produce diffuse hypomyelination on MRI with nystagmus, hypotonia, tremor,
    titubation, ataxia and spasticity, overlapping substantially with the
    neurological presentation of POLR3-HLD.
  distinguishing_features:
  - "X-linked inheritance (PLP1) or a GJC2 genotype rather than biallelic Pol III subunit variants."
  - "Absent dental, hypogonadotropic and myopic components; the non-neurological 4H tetrad is not part of PMD or PMLD1."
  - "At 3T, POLR3-HLD shows better myelination of the medial lemniscus (the closed eye sign), which is not seen in PMD."
  evidence:
  - reference: PMID:22422208
    reference_title: "Pelizaeus-Merzbacher disease, Pelizaeus-Merzbacher-like disease 1, and related hypomyelinating disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Signs of PMD include nystagmus, hypotonia, tremors, titubation, ataxia,
      spasticity, athetotic movements and cognitive impairment; the major
      findings in SPG2 are leg weakness and spasticity. A diffuse pattern of
      hypomyelination is seen on magnetic resonance imaging (MRI) of PMD/SPG2
      patients.
    explanation: >-
      Documents the overlapping neurological and imaging features that drive the
      differential.
  - reference: PMID:29179231
    reference_title: "4H Leukodystrophy: Lessons from 3T Imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in 4H leukodystrophy there is clearly better myelination of the
      medial lemniscus, which is not present in PMD.
    explanation: Provides an explicit imaging discriminator between the two conditions.

- name: POLR3A-related hereditary spastic ataxia (deep-intronic c.1909+22G>A)
  description: >-
    An allelic POLR3A disorder that is not a leukodystrophy. Compound
    heterozygosity involving the deep-intronic c.1909+22G>A variant produces
    adolescent-onset progressive spastic ataxia with tremor and dental problems,
    and accounts for around 3% of hereditary spastic paraplegia and cerebellar
    ataxia index cases — a far larger ascertained population than classic 4H.
    Because the gene is the same, this is a differential for the interpretation
    of a POLR3A genotype rather than for the clinical presentation alone.
  distinguishing_features:
  - "Adolescent or adult onset of spastic ataxia rather than early-childhood motor delay or regression."
  - "MRI shows hyperintensities along the superior cerebellar peduncles instead of the typical diffuse hypomyelination pattern."
  - "Hypodontia is accompanied by early, severe and aggressive periodontal disease, which is not typical of classic 4H."
  evidence:
  - reference: PMID:28459997
    reference_title: "Hypomorphic mutations in POLR3A are a frequent cause of sporadic and recessive spastic ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Instead of the typical hypomyelination magnetic resonance imaging pattern
      associated with classical POLR3A mutations, cases carrying c.1909+22G>A
      demonstrated hyperintensities along the superior cerebellar peduncles.
    explanation: >-
      Directly contrasts the imaging phenotype of this allele with classic
      POLR3-HLD.

- name: Wiedemann-Rautenstrauch (neonatal progeroid) syndrome
  description: >-
    A second allelic POLR3A disorder. Biallelic truncating and/or splicing
    POLR3A variants cause neonatal progeroid syndrome with intrauterine growth
    restriction, lipodystrophy, characteristic triangular facies and dental
    abnormalities — a genotype class distinct from the biallelic missense
    variants associated with hypomyelinating leukodystrophy.
  distinguishing_features:
  - "Neonatal presentation with progeroid features, lipodystrophy and pseudohydrocephalus rather than childhood hypomyelination."
  - "Associated with biallelic truncating or splicing POLR3A genotypes, whereas 4H is associated with biallelic missense genotypes."
  evidence:
  - reference: PMID:30414627
    reference_title: "Bi-allelic POLR3A Loss-of-Function Variants Cause Autosomal-Recessive Wiedemann-Rautenstrauch Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic missense variants in POLR3A have been associated with
      phenotypes distinct from WRS: hypogonadotropic hypogonadism and
      hypomyelinating leukodystrophy with or without oligodontia.
    explanation: >-
      The authors themselves separate the WRS and leukodystrophy
      genotype-phenotype classes.

- name: POLR1C-related Treacher Collins syndrome
  description: >-
    An allelic POLR1C disorder with a completely different phenotype —
    mandibulofacial dysostosis rather than leukodystrophy. It matters here
    because the discriminator is molecular and mechanistic: leukodystrophy
    variants impair Pol III assembly and nuclear import, whereas the Treacher
    Collins variant leaves polymerase assembly intact and instead disrupts Pol I
    targeting to the nucleolus.
  distinguishing_features:
  - "Craniofacial dysostosis without hypomyelination, the dental-plus-endocrine tetrad, or progressive neurological decline."
  - "Mechanistically separable, because Treacher Collins-causing POLR1C variants do not impair Pol III assembly or nuclear import."
  evidence:
  - reference: PMID:26151409
    reference_title: "Recessive mutations in POLR1C cause a leukodystrophy by impairing biogenesis of RNA polymerase III."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrate that leukodystrophy-causative mutations, but not TCS
      mutations, in POLR1C impair assembly and nuclear import of POLR3, but not
      POLR1
    explanation: Provides the experimental basis for separating the two POLR1C disorders.

- name: De novo POLR3B-related ataxia, spasticity and demyelinating neuropathy
  description: >-
    A monoallelic, de novo POLR3B disorder distinct from recessive POLR3-HLD.
    Its existence means a single heterozygous POLR3B variant in a patient with
    ataxia and neuropathy should not be dismissed as carrier status, and that
    peripheral nerve involvement points away from classic 4H.
  distinguishing_features:
  - "De novo heterozygous rather than biallelic POLR3B genotype."
  - "Prominent demyelinating peripheral neuropathy, which is not a feature of classic POLR3-HLD."
  evidence:
  - reference: PMID:33417887
    reference_title: "De Novo Variants in POLR3B Cause Ataxia, Spasticity, and Demyelinating Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic pathogenic variants in POLR3B are a well-established cause of
      hypomyelinating leukodystrophy.
    explanation: >-
      The paper contrasts the established biallelic leukodystrophy phenotype with
      the newly described de novo monoallelic neuropathy phenotype named in its
      title.

- name: POLR1A-related hypomyelinating leukodystrophy
  description: >-
    A biallelic RNA polymerase I subunit disorder that also produces
    hypomyelinating leukodystrophy with cerebellar atrophy, but through a
    different molecular route — aberrant rRNA processing, abnormal nucleolar
    homeostasis, disturbed protein homeostasis and endoplasmic reticulum stress.
    Whether it belongs inside the "POLR-related leukodystrophy" umbrella is an
    open scoping question recorded under discussions.
  distinguishing_features:
  - "Pol I (rRNA transcription) rather than Pol III (tRNA and 5S rRNA transcription) is the affected polymerase."
  - "Mechanism runs through nucleolar and protein-homeostasis disruption rather than reduced Pol III transcript supply."
  evidence:
  - reference: PMID:36917474
    reference_title: "A homozygous POLR1A variant causes leukodystrophy and affects protein homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive in vitro experiments in fibroblasts from Patient 1 documented
      that the mutated POLR1A led to aberrant rRNA processing and degradation,
      and abnormal nucleolar homeostasis.
    explanation: >-
      Establishes the mechanistically distinct Pol I route to a clinically
      overlapping leukodystrophy.

discussions:
- discussion_id: polr_hld_oligodendrocyte_selective_vulnerability
  prompt: >-
    Why does partial loss of a ubiquitously required enzyme produce a
    white-matter-predominant disease, and what makes the oligodendrocyte lineage
    the most sensitive cell type?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Steady-State Pol III Subunit Protein in Cerebral White Matter
  - pathophysiology#Oligodendrocyte Differentiation Arrest
  rationale: >-
    Pol III transcribes tRNAs, 5S rRNA and other RNAs required by every cell,
    yet the clinical phenotype is dominated by hypomyelination. Two partial
    explanations exist and are not mutually exclusive: a regional gradient in
    steady-state subunit protein (greater loss in cerebral white matter than
    cortex in one autopsied brain) and an intrinsic sensitivity of
    oligodendrogenesis and myelination to reduced Pol III output. Neither has
    been shown to be sufficient, and the single-brain protein gradient has not
    been replicated.
  proposed_experiments:
  - experiment_id: polr_hld_celltype_resolved_pol3_quantification
    name: Cell-type-resolved Pol III transcript and protein quantification in human brain
    description: >-
      Quantify Pol III subunit protein and Pol III transcript output across
      oligodendrocyte-lineage, neuronal and astrocytic populations in
      post-mortem POLR3-HLD and control brain, to test whether the
      white-matter-predominant deficit is cell-intrinsic to the oligodendrocyte
      lineage rather than a bulk-tissue composition artefact.
  evidence:
  - reference: PMID:34583988
    reference_title: "Defective myelination in an RNA polymerase III mutant leukodystrophic mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The findings suggest unique sensitivities of oligodendrogenesis and
      myelination to perturbations of Pol III transcription.
    explanation: >-
      The authors frame lineage-selective sensitivity as a suggestion arising from
      the model, i.e., an open question rather than an established mechanism.

- discussion_id: polr_hld_which_transcript_deficit_drives_disease
  prompt: >-
    Which Pol III transcript class is the proximate driver of disease — the tRNA
    pool, 5S rRNA and ribosome biogenesis, 7SL and the signal recognition
    particle, or some combination that differs by causal gene?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Pol III Non-Coding Transcript Output
  - pathophysiology#Reduced Mature tRNA Pool
  - pathophysiology#Constrained Translational Capacity
  rationale: >-
    Different studies nominate different transcript classes. The original
    POLR3A/POLR3B paper hypothesized tRNAs; a mouse time-course placed a global
    tRNA-pool reduction earliest and argued for a causal role in disease
    initiation; but POLR3K patient fibroblasts showed 5S rRNA and 7SL RNA most
    severely reduced, with the authors reasoning through ribosome function and
    signal recognition particle biology instead. It is unresolved whether these
    are competing accounts or gene-specific and assay-specific differences within
    a shared final pathway.
  proposed_experiments:
  - experiment_id: polr_hld_matched_transcript_class_profiling
    name: Matched multi-transcript-class profiling across causal genotypes
    description: >-
      Profile mature tRNA, 5S rRNA, 7SL and 7SK in a single harmonized assay
      across patient-derived oligodendrocyte-lineage cells carrying POLR3A,
      POLR3B, POLR1C and POLR3K genotypes, to determine whether the transcript
      hierarchy is genotype-dependent or an artefact of differing assays and
      cell types.
  evidence:
  - reference: PMID:39499645
    reference_title: "Molecular basis of neurodegeneration in a mouse model of Polr3-related disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, changes in the size and/or composition of the tRNA pool have a
      causal role in disease initiation.
    explanation: States the tRNA-first position in the disagreement.
  - reference: PMID:30584594
    reference_title: "Mutation in POLR3K causes hypomyelinating leukodystrophy and abnormal ribosomal RNA regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      transcription of both 5S rRNA and 7SL RNA was most severely reduced. 5S
      rRNA is a component of the large subunit of the ribosome and therefore
      important for ribosomal functioning.
    explanation: States the ribosome and signal-recognition-particle position in the disagreement.

- discussion_id: polr_hld_mouse_model_fidelity
  prompt: >-
    Which mouse models faithfully represent human POLR3-HLD, given that a
    constitutive knock-in of a bona fide human pathogenic allele produced no
    phenotype while lineage-restricted conditional models did?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Oligodendrocyte Differentiation Arrest
  - pathophysiology#Deficient Central Nervous System Myelin Deposition
  rationale: >-
    The Polr3a G672E constitutive knock-in carries a validated human founder
    allele yet showed normal behaviour, normal myelination and no significant
    change in brain Pol III transcripts. In contrast, Olig2-Cre-driven
    expression of pathogenic Polr3a and the conditional Polr3b delta-10 hypomorph
    both produce hypomyelination. This means a negative mouse result cannot be
    read as evidence against a mechanism, and that conclusions drawn from the
    conditional models inherit the assumption that lineage-restricted expression
    is a fair proxy for the constitutive human condition. Even the best
    conditional model omits gross motor deficits and cerebellar hypomyelination
    seen in severely affected patients, and no model reproduces the full human
    tetrad including hypogonadotropic hypogonadism.
  proposed_experiments:
  - experiment_id: polr_hld_allelic_series_single_background
    name: Allelic series in a single mouse background
    description: >-
      Compare constitutive, oligodendrocyte-lineage-conditional and
      whole-body-postnatal-inducible expression of the same pathogenic Polr3a
      allele on one genetic background, measuring myelination, Pol III
      transcript output and behaviour, to isolate whether developmental timing,
      compensation, or cell-type context explains the divergent results.
  evidence:
  - reference: PMID:28407788
    reference_title: "Absence of neurological abnormalities in mice homozygous for the Polr3a G672E hypomyelinating leukodystrophy mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cerebral and cerebellar Luxol Fast Blue staining and measurement of levels
      of myelin proteins showed no significant differences between the three
      groups, suggesting that myelination is not overtly impaired in Polr3a
      KI/KI and KI/KO mice.
    explanation: The negative model result that creates the mismatch.
  - reference: PMID:34583988
    reference_title: "Defective myelination in an RNA polymerase III mutant leukodystrophic mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, the gross motor defects and cerebellar hypomyelination that
      are common features of severely affected patients are absent in the mice,
      suggesting a relatively mild form of the disease in this conditional
      model.
    explanation: Shows that even the positive conditional model is only a partial phenocopy.

- discussion_id: polr_hld_umbrella_scope_pol_i_genes
  prompt: >-
    Should "POLR-related leukodystrophy" (MONDO:0100605) include the RNA
    polymerase I gene POLR1A, or be restricted to Pol III subunit genes?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic Pol III Subunit Variant
  rationale: >-
    The MONDO label says "POLR-related" and the definition says "any of the POLR
    genes, including POLR1C, POLR3A or POLR3B", which reads as open-ended, while
    the clinical literature almost uniformly says "POLR3-related". Biallelic
    POLR1A variants cause a clinically overlapping hypomyelinating leukodystrophy
    with cerebellar atrophy, but through Pol I rRNA processing and nucleolar and
    protein-homeostasis disruption rather than reduced Pol III transcript supply.
    POLR1C sits awkwardly across the boundary, being shared between the two
    polymerases while its leukodystrophy variants act specifically on Pol III.
    This entry is currently scoped to the Pol III subunit genes and treats
    POLR1A-related leukodystrophy as a differential; that decision should be
    revisited if the ontology or the clinical literature converges.
  evidence:
  - reference: PMID:36917474
    reference_title: "A homozygous POLR1A variant causes leukodystrophy and affects protein homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We confirm that POLR1A biallelic variants cause neurodegenerative disease,
      expand the knowledge of the clinical phenotype of the disorder
    explanation: >-
      Establishes POLR1A-related leukodystrophy as a real entity whose relationship
      to this umbrella needs an explicit scoping decision.

- discussion_id: polr_hld_hypomyelination_not_obligate
  prompt: >-
    If diffuse hypomyelination is not obligate, what should the diagnostic entry
    criterion for POLR-related leukodystrophy be, and how many patients are
    being missed by MRI-gated testing?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Cerebral Hypomyelination
  - imaging_findings#Atypical Selective Corticospinal Tract Involvement
  rationale: >-
    The characteristic MRI pattern is the practical entry point to diagnosis,
    but eight molecularly confirmed patients have been reported without it,
    showing instead selective corticospinal tract involvement or isolated
    cerebellar atrophy. Separately, the hypomorphic POLR3A c.1909+22G>A allele
    produces spastic ataxia frequently without leukodystrophy imaging and
    accounts for roughly 3% of hereditary spastic paraplegia and ataxia index
    cases. The size of the missed population is unknown because ascertainment
    has historically been MRI-driven, which makes the denominator unmeasurable
    from existing cohorts.
  proposed_experiments:
  - experiment_id: polr_hld_unbiased_screening_imaging_negative_cohorts
    name: Unbiased Pol III gene screening in imaging-negative ataxia cohorts
    description: >-
      Sequence POLR3A, POLR3B, POLR1C and POLR3K in large ataxia and spastic
      paraplegia cohorts ascertained without any MRI requirement, and report the
      yield stratified by imaging pattern, to estimate what fraction of Pol
      III-related disease is invisible to hypomyelination-gated testing.
  evidence:
  - reference: PMID:27029625
    reference_title: "Diffuse hypomyelination is not obligate for POLR3-related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse hypomyelination is not an obligatory feature of POLR3-related disorders."
    explanation: Directly establishes that the diagnostic imaging gate is imperfect.
  - reference: PMID:28459997
    reference_title: "Hypomorphic mutations in POLR3A are a frequent cause of sporadic and recessive spastic ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we screened a cohort of hereditary spastic paraplegia and cerebellar
      ataxia cases (n = 618) for mutations in POLR3A and identified compound
      heterozygous POLR3A mutations in ∼3.1% of index cases.
    explanation: >-
      Quantifies a substantial POLR3A-related population ascertained outside the
      leukodystrophy imaging phenotype.

- discussion_id: polr_hld_ibuprofen_translation_gap
  prompt: >-
    Does the in vitro ibuprofen rescue of oligodendroglial differentiation
    translate to any in vivo benefit, and is the lysosomal/mTOR arm relevant to
    the missense alleles that actually cause human disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lysosomal Mislocalization of Mutant Pol III Subunits
  - pathophysiology#mTOR Signaling Suppression
  rationale: >-
    The ibuprofen result is attractive because it is a repurposed, well-tolerated
    drug acting on a defined target. But the experiments used severe nonsense
    alleles (POLR3A p.Arg140Ter, POLR3B p.Arg550Ter) in a mouse oligodendroglial
    cell line, whereas human POLR3-HLD is caused by hypomorphic, largely missense
    genotypes and no patient has been reported with two nonsense alleles. Whether
    missense mutant subunits are also routed to lysosomes and suppress mTOR is
    untested, so the therapeutic hypothesis may rest on an allele class that does
    not occur biallelically in patients. No in vivo or human data exist.
  proposed_experiments:
  - experiment_id: polr_hld_lysosomal_localization_patient_alleles
    name: Lysosomal localization and mTOR readout across the patient allele spectrum
    description: >-
      Test whether recurrent patient missense alleles (for example POLR3B
      p.Val523Glu) reproduce the lysosomal mislocalization and mTOR suppression
      seen with nonsense alleles, and whether ibuprofen rescues differentiation
      in that context.
  - experiment_id: polr_hld_in_vivo_ibuprofen_trial
    name: In vivo ibuprofen trial in a validated conditional mouse model
    description: >-
      Administer ibuprofen to the conditional Polr3b delta-10 mouse during
      postnatal myelinogenesis and measure oligodendrocyte maturation and myelin
      thickness, to establish whether the in vitro rescue has any in vivo
      counterpart.
  evidence:
  - reference: PMID:21855841
    reference_title: "Mutations of POLR3A encoding a catalytic subunit of RNA polymerase Pol III cause a recessive hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No individual was found to carry two nonsense mutations."
    explanation: >-
      Establishes the allele-class mismatch between the human disease and the cell
      models used for the ibuprofen experiments.

- discussion_id: polr_hld_pol3_dna_sensing_arm
  prompt: >-
    Pol III also functions as a cytosolic DNA sensor driving interferon
    induction, and monoallelic POLR3A/POLR3C variants cause severe varicella
    zoster virus disease. Do biallelic POLR3-HLD patients also carry an
    antiviral-immunity defect, and should they be monitored for it?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic Pol III Subunit Variant
  rationale: >-
    Pol III has a second, transcription-independent role as a cytosolic sensor
    of AT-rich DNA that drives type I interferon induction. Rare heterozygous
    POLR3A and POLR3C missense variants cause life-threatening varicella zoster
    virus infection in otherwise healthy children through impaired DNA-triggered
    interferon induction — a phenotype with no reported overlap with 4H
    leukodystrophy. It is unresolved whether the biallelic hypomorphic genotypes
    that cause POLR3-HLD also compromise this sensing function, whether the two
    functions are separably affected by different variant classes, and therefore
    whether POLR3-HLD patients warrant any specific antiviral vigilance. This
    entry does not model the DNA-sensing arm because no evidence connects it to
    the leukodystrophy phenotype.
  proposed_experiments:
  - experiment_id: polr_hld_ifn_induction_in_patient_leukocytes
    name: DNA-triggered interferon induction in POLR3-HLD patient leukocytes
    description: >-
      Measure interferon induction in response to synthetic and virus-derived
      cytosolic DNA in leukocytes from patients with biallelic POLR3-HLD
      genotypes, using the same assay that demonstrated the defect in
      monoallelic varicella-susceptibility patients, to determine whether the
      sensing and transcription functions are separably affected.
  evidence:
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 4 cases of acute severe VZV infection affecting the central
      nervous system or the lungs in unrelated, otherwise healthy children who
      are heterozygous for rare missense mutations in POLR3A (one patient),
      POLR3C (one patient), or both (two patients).
    explanation: >-
      Establishes a second, immunological disease mechanism for variants in Pol
      III subunit genes, distinct from the leukodystrophy phenotype.
  - reference: PMID:28783042
    reference_title: "Inborn errors in RNA polymerase III underlie severe varicella zoster virus infections."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Leukocytes from all 4 patients tested exhibited poor IFN induction in
      response to synthetic or VZV-derived DNA.
    explanation: >-
      Defines the functional assay that would need to be applied to POLR3-HLD
      patients to answer this question.

- discussion_id: polr_hld_agents_to_avoid_unverified
  prompt: >-
    Should dopamine D2 receptor blockers (haloperidol, risperidone,
    metoclopramide) be recorded as agents to avoid in POLR-related
    leukodystrophy, and is there a citable source for that claim?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - phenotypes#Dystonia
  rationale: >-
    The deep-research artifact for this entry asserted that dopamine D2 receptor
    blockers exacerbate the extrapyramidal and dystonic features of this
    population and flagged it as a drug-safety item to model. The claim is
    clinically plausible — D2 blockade worsening dystonia is a general
    pharmacological principle — but a targeted PubMed search found no source
    that makes it specifically about POLR3-related leukodystrophy, and the
    cached GeneReviews abstract does not contain an "Agents/Circumstances to
    Avoid" statement (the abstract is a condensed form of the full chapter,
    which may well carry one). A drug-safety assertion is exactly the kind of
    claim that must not be curated from an unverified secondary summary, so it
    is deliberately NOT recorded as a treatment or a note here. Resolution
    requires either the full GeneReviews chapter text or a primary source; if
    one is found, this should become an agents-to-avoid entry on the dystonia
    management treatment.
  proposed_experiments:
  - experiment_id: polr_hld_agents_to_avoid_source_hunt
    name: Locate a citable agents-to-avoid source
    description: >-
      Retrieve the full GeneReviews POLR3-Related Leukodystrophy chapter
      (NBK99167) and check its Agents/Circumstances to Avoid section, and search
      case-level literature for reported dystonia exacerbation after D2-blocker
      exposure in molecularly confirmed patients.

- discussion_id: polr_hld_cerebellar_module_conformance
  prompt: >-
    Should the cerebellar degenerative arm of POLR-related leukodystrophy
    declare conformance to the cerebellar_purkinje_degeneration module?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Cerebellar Atrophy
  rationale: >-
    Cerebellar atrophy with progressive ataxia is a cardinal feature, which makes
    cerebellar_purkinje_degeneration a natural conformance candidate. However,
    that module's key node is Purkinje neuron degeneration, and the available
    evidence here reports generic neuron and oligodendrocyte loss in mouse
    cerebra rather than Purkinje-specific degeneration in human tissue. Declaring
    conformance now would assert a cell-type specificity the evidence does not
    support, so it is deliberately deferred pending Purkinje-resolved
    neuropathology.
  evidence:
  - reference: PMID:39499645
    reference_title: "Molecular basis of neurodegeneration in a mouse model of Polr3-related disease."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cell-type-specific gene expression changes reflecting neuron and
      oligodendrocyte loss and microglial activation
    explanation: >-
      Reports neuronal loss without resolving whether Purkinje cells are the
      affected population, which is exactly the gap blocking a conformance claim.

notes: >-
  Scope: this entry is the umbrella POLR-related (4H) leukodystrophy entity
  (MONDO:0100605). The POLR3A-specific OMIM phenotype HLD7 (MONDO:0011897) has
  its own dismech entry, Hypomyelinating Leukodystrophy 7, whose `parents:` entry
  is set to this entry's exact `name` ("POLR-Related Leukodystrophy") so the
  cross-reference resolves by string; that entry carries POLR3A-specific detail, while this one
  carries the cross-gene Pol III mechanism, the gene-level subtypes, imaging
  criteria, differentials and open questions. Population prevalence, formal
  survival statistics and a validated disease-specific quality-of-life instrument
  were sought and not found in the literature reviewed; they are recorded as not
  established rather than estimated.


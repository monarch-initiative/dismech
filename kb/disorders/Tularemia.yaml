- name: Arthropod and infected-animal contact
  description: >-
    Tick, mosquito, and other arthropod bites or direct handling of infected
    animals are exposure routes that can inoculate F. tularensis into skin and
    soft tissue, triggering ulceroglandular or glandular tularemia.

- name: Francisella PCR on Lesional or Node Specimens
  diagnosis_term:
    preferred_term: Francisella PCR on lesional or node specimens
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  description: >-
    PCR detection of F. tularensis DNA in wound or lymph-node material can
    confirm tularemia before seroconversion and can outperform culture, which is
    insensitive and hazardous for laboratories.
  evidence:
  - reference: PMID:10618057
    reference_title: Comparative analysis of PCR versus culture for diagnosis of ulceroglandular tularemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 40 patients with culture- and/or serology-verified ulceroglandular
      tularemia, PCR detected F. tularensis DNA in 30 (75%) patients, whereas
      culture detected bacterial growth in 25 (62%) patients.
    explanation: >-
      Direct comparison in human ulceroglandular tularemia supports PCR as a
      more sensitive direct detection method than culture.

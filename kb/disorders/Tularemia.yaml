infectious_agent:
- name: Francisella tularensis
  description: >
    Tularemia is caused by the Gram-negative coccobacillus Francisella tularensis.
    Subspecies tularensis (type A) is more virulent and predominates in North
    America; subspecies holarctica (type B) is widespread across Europe and Asia.
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tularemia caused by Gram-negative, coccobacillus bacterium, Francisella tularensis, is a highly infectious zoonotic disease."
    explanation: Review identifies F. tularensis as the Gram-negative coccobacillus causative agent of tularemia.
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Type A (subspecies tularensis) is more virulent and causes disease mainly in North America; type B (subspecies holarctica) is widespread"
    explanation: Documents the two principal human-pathogenic subspecies and their geographic distribution and relative virulence.
has_subtypes:
- name: Glandular form
  display_name: Glandular tularemia
  subtype_term:
    preferred_term: glandular tularemia
    term:
      id: MONDO:0000320
      label: glandular tularemia
  classification: clinical_form
  subtype_frequency: "15.8%"
  description: >-
    Localized tularemia form with acute flu-like symptoms and marked regional
    lymphadenopathy after arthropod or animal inoculation but without the visible
    cutaneous inoculation ulcer that defines the ulceroglandular form.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In glandular form, there are no skin ulcers but lymphadenopathy is marked
    explanation: >-
      The review distinguishes glandular tularemia from ulceroglandular
      tularemia by the absence of a skin ulcer and the presence of marked
      lymphadenopathy.
  - reference: PMID:23104256
    reference_title: Tularemia in central Anatolia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients had clinical presentations compatible with oropharyngeal (74 %),
      glandular (15.8 %), and oculoglandular (5.0 %) tularemia.
    explanation: >-
      This Central Anatolia cohort observed the glandular clinical form in 15.8%
      of confirmed tularemia patients.
- name: Oculoglandular
  display_name: Oculoglandular tularemia
  subtype_term:
    preferred_term: oculoglandular tularemia

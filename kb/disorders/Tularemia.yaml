datasets:
- accession: geo:GSE186408
  title: 'Novel transcriptional and translational biomarkers of tularemia vaccine efficacy in a mouse inhalation model: proof of concept'
  description: Francisella tularensis subspecies tularensis (Ftt) is extremely virulent for humans when inhaled as small particle aerosols (<5μm). Inhalation of ≥ 20 viable bacteria is sufficient to initiate infection with a mortality rate ≥30%. Consequently, in the past, Ftt became a primary candidate for biological weapons development. To counter this threat, the USA developed a live vaccine strain that showed efficacy in humans against inhalation of virulent Ftt. However, the breakthrough dose was fairly low and protection waned with time. These weaknesses triggered extensive research for better vaccine candidates.

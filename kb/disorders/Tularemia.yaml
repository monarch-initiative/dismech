  evidence:
  - reference: PMID:23104256
    reference_title: Tularemia in central Anatolia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients had clinical presentations compatible with oropharyngeal (74 %),
      glandular (15.8 %), and oculoglandular (5.0 %) tularemia.
    explanation: >-
      This Central Anatolia cohort observed the oculoglandular clinical form in
      5.0% of confirmed tularemia patients.
transmission:
- name: Arthropod bite
  description: >-
    Ticks and mosquitoes inoculate F. tularensis through the skin; this is the
    route behind the ulceroglandular and glandular forms, which are the commonest
    presentations.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vector-borne tularemia primarily involves ticks and mosquitoes."
    explanation: Names the arthropod vectors that transmit the organism.
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ulcero-glandular and glandular forms are acquired by arthropod bite or handling of infected animals"
    explanation: Ties the bite route to the clinical forms it produces.
  notes: >-
    Person-to-person transmission has not been reported for any of these routes
    (PMID:37916743, "Human-to-human transmission has not been known."), so every
    route here is an acquisition from an animal, arthropod, or environmental source.
- name: Direct contact with infected animals
  description: >-
    Handling infected lagomorphs and rodents, including skinning and dressing game,
    transmits the organism through skin and conjunctiva. The very low infectious
    dose makes brief handling sufficient.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Small mammals like rabbits, hares, and muskrats are primary sources of human infections, but true reservoir of F. tularensis is unknown."
    explanation: Identifies the small mammals whose handling is the source of human infection.
- name: Ingestion of contaminated food or water
  description: >-
    Swallowing contaminated water or undercooked meat from an infected animal
    produces the oropharyngeal form; water-borne outbreaks are a recurrent pattern
    in parts of Eurasia.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "oro-pharyngeal form by intake of contaminated food or water"
    explanation: Links ingestion of contaminated food or water to the oropharyngeal form.
- name: Inhalation of infectious aerosols
  description: >-
    Inhaled aerosol, whether raised agriculturally from contaminated material or
    released deliberately, produces pneumonic tularemia. This route and the
    organism's low infectious dose are why it is a Category A bioterrorism agent.
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pulmonary form appears after inhalation of bacteria."
    explanation: States the inhalational route and the pulmonary form it produces.
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "F. tularensis is a possible bioweapon due to its lethality, low infectious dosage, and aerosol transmission."
    explanation: Supports aerosol transmissibility at a low infectious dose as the basis of the bioweapon concern.
pathophysiology:
- name: Arthropod-Borne and Zoonotic Acquisition
  description: >
    Humans acquire F. tularensis through arthropod bites (ticks and mosquitoes),
    handling of infected animals, ingestion of contaminated food or water, or
    inhalation of contaminated aerosols. The route of entry determines the
    resulting clinical form.
  biological_processes:
  - preferred_term: Phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ulcero-glandular and glandular forms are acquired by arthropod bite or handling of infected animals, oculo-glandular form as a result of conjunctival infection, and oro-pharyngeal form by intake of contaminated food or water."
    explanation: Establishes that the route of inoculation determines the clinical form of tularemia.
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Depending on its entry route into the organism, F. tularensis causes different diseases, ranging from life-threatening pneumonia to less severe ulceroglandular tularaemia."
    explanation: Confirms entry route determines disease severity and clinical form.
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    description: >
      Following inoculation, F. tularensis is taken up by macrophages, where it
      establishes its intracellular replicative niche.
    causal_link_type: DIRECT
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >
    F. tularensis enters macrophages by looping phagocytosis. The
    Francisella-containing phagosome matures transiently before the bacterium
    escapes into the cytosol within 30-60 minutes via the Francisella
    Pathogenicity Island-encoded type VI secretion system (T6SS), then proliferates
    in the cytosol. The T6SS and its effectors are the main virulence attribute
    promoting phagosomal escape.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Suppression of host phagosome maturation
    term:
      id: GO:0141158
      label: symbiont-mediated suppression of host phagosome maturation
  - preferred_term: Symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main virulence attribute of F. tularensis is the type 6 secretion system (T6SS) and its effectors that promote escape from the phagosome."
    explanation: Identifies the FPI-encoded T6SS as the principal virulence factor mediating phagosomal escape.
  - reference: PMID:19863554
    reference_title: "Cell biology and molecular ecology of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Entry of F. tularensis into macrophages is mediated by looping phagocytosis"
    explanation: Describes the looping phagocytosis mechanism of macrophage entry.
  - reference: PMID:19863554
    reference_title: "Cell biology and molecular ecology of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The Francisella pathogenicity island, which potentially encodes a putative type VI secretion system, is essential for phagosome biogenesis and bacterial escape into the cytosol within macrophages and arthropod-derived cells."
    explanation: Confirms the FPI/T6SS is essential for bacterial escape into the macrophage cytosol.
  downstream:
  - target: Inflammasome Activation and Granulomatous Inflammation
    description: >
      Cytosolic replication of F. tularensis is sensed by the host innate immune
      system, triggering caspase-1 inflammasome activation and a pro-inflammatory,
      granulomatous response.
    causal_link_type: DIRECT
  - target: Lymphatic Francisella Spread to Regional Nodes
    description: >
      Organisms introduced through skin or mucosa can drain from the inoculation
      territory into the regional lymph node basin.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Lymphatic Francisella Spread to Regional Nodes
  description: >-
    After peripheral inoculation, F. tularensis drains through lymphatics into
    the regional node basin, anatomically localizing glandular and
    ulceroglandular tularemia as painful regional lymphadenitis.
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:37941380
    reference_title: "Pathogenicity and virulence of Francisella tularensis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Later, one or more chronically evolving lymphadenopathies can develop in
      the lymphatic system draining the site of entry.
    explanation: >-
      The Francisella review connects the portal of entry to later
      lymphadenopathy in the draining lymphatic basin.
  downstream:
  - target: Necrotizing and Suppurative Granulomatous Lymphadenitis
    description: >-
      Node infection drives granulomatous and suppurative tissue inflammation.
    causal_link_type: DIRECT
- name: Necrotizing and Suppurative Granulomatous Lymphadenitis
  description: >-
    Node-localized tularemia produces granulomas, necrosis, abscess-forming
    suppuration, and extracapsular inflammation; fluctuant infected nodes can
    require fine-needle aspiration, drainage, or excision.
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:23763361
    reference_title: "Tularemia: potential role of cytopathology in differential diagnosis of cervical lymphadenitis: multicenter experience in 53 cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On histopathology; granulomas, necrosis, and suppurative inflammation
      extending extracapsular areas were seen.
    explanation: >-
      Human node cytology and resection specimens establish granulomatous,
      necrotizing, suppurative lymphadenitis as a tularemia tissue pattern.
  downstream:
  - target: Lymphadenopathy
    description: >-
      Granulomatous and suppurative node inflammation produces painful regional
      lymph node enlargement.
    causal_link_type: DIRECT
- name: Inflammasome Activation and Granulomatous Inflammation
  description: >
    Cytosolic sensing of F. tularensis triggers IRF-3-dependent IFN-beta secretion
    and activation of the caspase-1 inflammasome with a pro-inflammatory response.
    The resulting inflammation produces granulomatous lesions and the systemic and
    localized clinical manifestations of tularemia, including fever, regional
    lymphadenopathy, skin ulceration, and pneumonia.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Inflammasome-mediated signaling
    term:
      id: GO:0141084
      label: inflammasome-mediated signaling pathway
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:19863554
    reference_title: "Cell biology and molecular ecology of Francisella tularensis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "activation of the inflammasome mediated by caspase-1, and a pro-inflammatory response"
    explanation: Establishes caspase-1 inflammasome activation and a pro-inflammatory response as the host innate response to cytosolic F. tularensis.
  downstream:
  - target: Fever
    description: Systemic inflammation produces fever, the most consistent finding across tularemia forms.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Headache
    description: Systemic inflammation contributes to headache in the flu-like prodrome.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Myalgia
    description: Systemic inflammation contributes to myalgia in the flu-like prodrome.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Lymphadenopathy
    description: Regional inflammation produces lymph node enlargement, the hallmark of glandular and ulceroglandular forms.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Skin Ulcer
    description: Inflammation at a cutaneous inoculation site produces the ulcer of ulceroglandular tularemia.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Pneumonia
    description: Inflammation following inhalational exposure produces pneumonic tularemia.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Chills
    description: Systemic inflammatory cytokines drive the chills of the early flu-like phase.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Francisella Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    Francisella depends on bacterial 70S ribosomal translation for protein
    synthesis; aminoglycosides and tetracyclines used for tularemia act on this
    conserved bacterial ribosomal target.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review support for the shared bacterial-ribosome target of
      aminoglycosides and tetracyclines.
  downstream: []
- name: Francisella DNA Gyrase and Topoisomerase IV
  role: therapeutic_vulnerability
  conforms_to: "bacterial_dna_topoisomerase_inhibition#DNA Gyrase and Topoisomerase IV (Fluoroquinolone Target)"
  description: >-
    F. tularensis requires bacterial type II topoisomerases to control DNA
    supercoiling and chromosome segregation; fluoroquinolones used for tularemia
    trap gyrase/topoisomerase-DNA cleavage complexes at this druggable target.
  biological_processes:
  - preferred_term: DNA topological change
    term:
      id: GO:0006265
      label: DNA topological change
  evidence:
  - reference: PMID:27449972
    reference_title: "Topoisomerase Inhibitors: Fluoroquinolone Mechanisms of Action and Resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Quinolones dually target DNA gyrase and topoisomerase IV binding to
      specific domains and conformations so as to block DNA strand passage
      catalysis and stabilize DNA-enzyme complexes that block the DNA
      replication apparatus and generate double breaks in DNA that underlie
      their bactericidal activity.
    explanation: >-
      Review support for the bacterial DNA gyrase/topoisomerase IV target of
      fluoroquinolones.
  downstream: []
phenotypes:
- name: Fever
  description: >
    Fever is the most consistent clinical feature of tularemia and is present in
    most cases regardless of clinical form, typically as part of an early flu-like
    illness.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Early signs are flu-like illnesses that may evolve into different clinical forms of tularemia that may or may not include lymphadenopathy."
    explanation: Review describes the early flu-like (febrile) presentation of tularemia preceding localized findings.
- name: Lymphadenopathy
  subtypes:
  - Glandular form
  description: >
    Regional lymphadenopathy is the hallmark of the glandular and ulceroglandular
    forms, draining the site of inoculation.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ulcero-glandular and glandular forms are acquired by arthropod bite or handling of infected animals"
    explanation: Glandular and ulceroglandular forms are defined by regional lymphadenopathy following arthropod or animal exposure.
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common clinical forms were ulceroglandular, oropharyngeal, glandular, and pneumonic disease."
    explanation: CDC systematic review of 870 human cases confirms glandular and ulceroglandular (lymphadenopathy-defined) forms are among the most common.
- name: Skin Ulcer
  notes: >-
    This finding defines the ulceroglandular form and is absent by definition in
    the MONDO:0000320 glandular form.
  description: >
    A skin ulcer at the cutaneous site of inoculation is the defining lesion of
    ulceroglandular tularemia, the most common clinical form.
  phenotype_term:
    preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ulcero-glandular and glandular forms are acquired by arthropod bite or handling of infected animals"
    explanation: The ulceroglandular form is characterized by a skin ulcer at the inoculation site.
- name: Pneumonia
  description: >
    Pneumonic tularemia follows inhalation of infectious aerosols and is among the
    most severe and most common clinical forms; it can also arise secondarily by
    hematogenous spread.
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pulmonary form appears after inhalation of bacteria."
    explanation: The pulmonary (pneumonic) form of tularemia follows inhalational exposure.
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common clinical forms were ulceroglandular, oropharyngeal, glandular, and pneumonic disease."
    explanation: CDC systematic review confirms pneumonic disease is among the most common clinical forms of human tularemia.
- name: Chills
  description: Chills accompany the early febrile, flu-like phase of tularemia.
  phenotype_term:
    preferred_term: Chills
    term:
      id: HP:0025143
      label: Chills
  evidence:
  - reference: PMID:37916743
    reference_title: "Tularemia - a re-emerging disease with growing concern."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Early signs are flu-like illnesses that may evolve into different clinical forms of tularemia"

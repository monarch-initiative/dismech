- name: Fine-Needle Aspiration or Surgical Drainage
  description: >-
    Fluctuant or necrotic tularemia lymph nodes may require fine-needle
    aspiration, surgical drainage, or excision as adjunctive source control.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Necrotizing and Suppurative Granulomatous Lymphadenitis
    description: >-
      Needle aspiration, drainage, and excision remove the suppurative lymph-node
      compartment responsible for persistent regional disease.
  evidence:
  - reference: PMID:23104256
    reference_title: Tularemia in central Anatolia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fine-needle aspiration (FNA) or surgical drainage of fluctuant lymph nodes
      were performed in 51 (39 %) patients.
    explanation: >-
      The prospective Central Anatolia series documents node aspiration or
      drainage in 39% of confirmed tularemia cases with fluctuant nodes.
diagnosis:
- name: Serology or Microagglutination Testing
  diagnosis_term:
    preferred_term: Diagnostic serology and microagglutination testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  description: >-
    Tularemia is commonly confirmed serologically by a positive
    microagglutination test or by seroconversion on paired sera when the first
    sample is negative early in the course. Serology should be considered when a
    cervical lymphadenitis syndrome fails beta-lactam treatment, because delayed
    appropriate therapy is associated with poorer outcomes.
  evidence:
  - reference: PMID:22090310
    reference_title: "[Evaluation of tularemia cases originated from Central Anatolia, Turkey]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with fever, sore throat, cervical mass and failure to respond to
      beta-lactam antibiotics, were followed up with the preliminary diagnosis
      of tularemia.
    explanation: >-
      Central Anatolia clinicians escalated cervical lymphadenitis cases with
      beta-lactam nonresponse to suspected tularemia, supporting the diagnostic
      implication of intrinsic beta-lactam resistance.
  - reference: PMID:22090310
    reference_title: "[Evaluation of tularemia cases originated from Central Anatolia, Turkey]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients who applied to the hospital within 10 days of the initiation
      of the symptoms were treated successfully, while the others that applied
      later were not.
    explanation: >-
      The same case series links early presentation with successful treatment,
      supporting diagnostic delay as a modifiable driver of morbidity.
  - reference: PMID:22090310

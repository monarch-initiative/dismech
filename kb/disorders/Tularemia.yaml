treatments:
- name: Streptomycin
  description: >
    Aminoglycoside, historically the first-line agent for tularemia. In a CDC
    systematic review of human cases, aminoglycosides were associated with a low
    fatality rate (0.7%).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: streptomycin
      term:
        id: CHEBI:17076
        label: streptomycin
  target_mechanisms:
  - target: Francisella Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Streptomycin is an aminoglycoside that treats tularemia by acting at the
      bacterial ribosome.
  evidence:
  - reference: PMID:38294108
    reference_title: "Systematic Review: Clinical Features, Antimicrobial Treatment, and Outcomes of Human Tularemia, 1993-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aminoglycosides, fluoroquinolones, and tetracyclines are effective antimicrobials for treatment of tularemia, regardless of clinical manifestation."
    explanation: CDC systematic review confirms aminoglycosides (e.g., streptomycin) are effective for tularemia.
- name: Ciprofloxacin
  description: >
    Fluoroquinolone used for tularemia. In the CDC systematic review, patients
    with pneumonic disease who received ciprofloxacin had no fatalities and the
    lowest rates of complications.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  target_mechanisms:
  - target: Francisella DNA Gyrase and Topoisomerase IV
    treatment_effect: INHIBITS
    description: >-
      Ciprofloxacin is a fluoroquinolone that treats tularemia through the
      conserved bacterial type-II-topoisomerase target.
  evidence:

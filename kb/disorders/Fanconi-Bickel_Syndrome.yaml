    evidence_source: HUMAN_CLINICAL
    snippet: "Fanconi-Bickel syndrome (FBS) is a rare autosomal recessive disorder of carbohydrate metabolism recently demonstrated to be caused by mutations in Glut2, the gene for the glucose transporter protein 2 expressed in liver, pancreas, intestine and kidney."
    explanation: Describes GLUT2 expression across the four tissues (liver, pancreas, intestine, kidney) whose dysfunction defines the disease.
  - reference: PMID:38802119
    reference_title: "Repurposing SGLT2 inhibitors: Treatment of renal proximal tubulopathy in Fanconi-Bickel syndrome with empagliflozin."
    supports: SUPPORT

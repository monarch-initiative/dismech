    explanation: Directly links impaired basolateral GLUT2-mediated glucose transport to intracellular glucose/glycogen accumulation in renal proximal tubular cells.
  downstream:
  - target: Impaired Hepatocyte Glucose Transport
    causal_link_type: DIRECT
    description: >-
      Loss of hepatocyte basolateral GLUT2 function traps glucose within
      hepatocytes, shifting it toward glycogen synthesis rather than release
      into the circulation.
    evidence:
    - reference: PMID:9809815
      reference_title: "Fanconi-Bickel syndrome--the original patient and his natural history, historical steps leading to the primary defect, and a review of the literature."
      supports: SUPPORT

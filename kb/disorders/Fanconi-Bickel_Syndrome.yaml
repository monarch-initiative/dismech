      snippet: "hepatomegaly secondary to glycogen accumulation, glucose and galactose intolerance, fasting hypoglycaemia, a characteristic proximal tubular nephropathy and severe short stature"
      explanation: Long-term natural history study links hepatomegaly and glycogen accumulation to the underlying glucose transport defect.
  - target: Impaired Renal Proximal Tubular Glucose Transport
    causal_link_type: DIRECT
    description: >-
      Loss of basolateral GLUT2 in renal proximal tubular epithelial cells

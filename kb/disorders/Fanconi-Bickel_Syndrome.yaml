inheritance:
- name: Autosomal Recessive
  description: >-
    Fanconi-Bickel syndrome is inherited in an autosomal recessive manner,
    requiring biallelic pathogenic variants in SLC2A2. Affected individuals
    are homozygous or compound heterozygous for loss-of-function variants;
    parents of affected individuals are typically unaffected heterozygous
    carriers, and consanguinity is common in reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:9354798
    reference_title: "Mutations in GLUT2, the gene for the liver-type glucose transporter, in patients with Fanconi-Bickel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous mutations were found in affected individuals, whereas all parents tested were heterozygous for the respective mutation."
    explanation: The original gene-discovery study demonstrates the autosomal recessive segregation pattern of SLC2A2 mutations in Fanconi-Bickel syndrome families.
pathophysiology:
- name: SLC2A2 (GLUT2) Loss-of-Function Variants
  description: >-
    Biallelic pathogenic variants in SLC2A2, the gene encoding the
    facilitative glucose transporter GLUT2, predict truncated or
    non-functional translation products lacking monosaccharide transport
    activity. Reported variants include frameshift, nonsense, splice-site,
    and missense changes, as well as exonic deletions, distributed
    throughout the gene.
  gene:
    preferred_term: SLC2A2
    term:
      id: hgnc:11006
      label: SLC2A2
  evidence:
  - reference: PMID:9354798
    reference_title: "Mutations in GLUT2, the gene for the liver-type glucose transporter, in patients with Fanconi-Bickel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report mutations in the gene encoding the facilitative glucose transporter 2 (GLUT2) in three FBS families, including the original patient described in 1949 by Fanconi and Bickel."
    explanation: The seminal gene-discovery study identifies SLC2A2/GLUT2 mutations as the molecular cause of Fanconi-Bickel syndrome, including in the original 1949 patient.
  - reference: PMID:39548873
    reference_title: "Genetic, Clinical, and Biochemical Characterization of a Large Cohort of Palestinian Patients With Fanconi-Bickel Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed five distinct SLC2A2 pathogenic variants, including three previously unreported variants: p.Gln23Arg (c.68A > G), p.Thr353Arg (c.1058_1059delinsGG), and an exon 7 deletion."
    explanation: A large Palestinian cohort study expands the SLC2A2 pathogenic variant spectrum, including novel missense variants and an exonic deletion.
  downstream:
  - target: Loss of GLUT2 Transporter Function
    causal_link_type: DIRECT
    description: >-
      Truncating and other loss-of-function SLC2A2 variants abolish GLUT2
      monosaccharide transport activity.
    evidence:
    - reference: PMID:9354798
      reference_title: "Mutations in GLUT2, the gene for the liver-type glucose transporter, in patients with Fanconi-Bickel syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Because all detected mutations (delta T446-449, C1251T and C1405T) predict truncated translation products that cannot be expected to have functional monosaccharide transport activity, GLUT2 mutations are probably the cause of FBS."
      explanation: The gene-discovery study directly links the identified truncating mutations to loss of functional GLUT2 monosaccharide transport activity.
- name: Loss of GLUT2 Transporter Function
  description: >-
    GLUT2 is a high-capacity, low-affinity facilitative glucose transporter
    normally expressed on the basolateral membrane of hepatocytes and renal
    proximal tubular epithelial cells, on pancreatic beta cells, and on the
    basolateral membrane of intestinal enterocytes, where it mediates
    bidirectional, insulin-independent glucose (and galactose) flux down
    the concentration gradient. Loss of GLUT2 activity uncouples
    intracellular glucose handling from these tissues' normal transport
    function, impairing both glucose uptake/release across the basolateral
    membrane and pancreatic beta-cell glucose sensing.
  gene:
    preferred_term: SLC2A2

- name: Glucosuria with Normal-to-Low Blood Glucose
  presence: Abnormal
  context: >-
    Urinary glucose loss occurring despite normal or low blood glucose
    concentration is the classic diagnostic biochemical clue distinguishing
    the renal tubular glucose-transport defect from ordinary diabetic
    glucosuria.
  biomarker_term:
    preferred_term: D-glucose
    term:
      id: CHEBI:17634
      label: D-glucose
  readouts:
  - target: Impaired Renal Proximal Tubular Glucose Transport
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Urinary glucose loss despite normal-to-low serum glucose reports
      failure of basolateral GLUT2-mediated tubular glucose reabsorption.
    evidence:
    - reference: PMID:38802119
      reference_title: "Repurposing SGLT2 inhibitors: Treatment of renal proximal tubulopathy in Fanconi-Bickel syndrome with empagliflozin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Renal proximal tubulopathy in Fanconi-Bickel syndrome is caused by impaired basolateral glucose transport via GLUT2 and consequently, intracellular accumulation of glucose and glycogen."
      explanation: Directly links the renal glucosuria of FBS to impaired basolateral tubular GLUT2 transport rather than a filtered-load excess.
  evidence:
  - reference: PMID:9354798
    reference_title: "Mutations in GLUT2, the gene for the liver-type glucose transporter, in patients with Fanconi-Bickel syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hepatorenal glycogen accumulation, Fanconi nephropathy and impaired utilization of glucose and galactose"
    explanation: Founding gene-discovery paper documents the Fanconi nephropathy and impaired glucose/galactose utilization underlying the diagnostic glucosuria.
diagnosis:
- name: Molecular Genetic Testing of SLC2A2
  description: >-
    Diagnosis is suggested by the characteristic clinical triad of
    hepatomegaly, growth failure/rickets, and a generalized (Fanconi-type)
    proximal renal tubulopathy in the setting of fasting hypoglycemia,
    glucose and galactose intolerance, glucosuria despite normal-to-low blood
    glucose, and hypertriglyceridemia, and is confirmed by molecular genetic
    testing identifying biallelic pathogenic SLC2A2 variants.
  evidence:
  - reference: PMID:39548873
    reference_title: "Genetic, Clinical, and Biochemical Characterization of a Large Cohort of Palestinian Patients With Fanconi-Bickel Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals diagnosed with FBS via molecular genetic testing were included in the study."
    explanation: Confirms molecular genetic testing of SLC2A2 as the diagnostic standard used to confirm FBS cases in a large clinical cohort.
treatments:
- name: Dietary Management (Frequent Feeding and Uncooked Cornstarch)
  description: >-
    Frequent small meals and uncooked cornstarch supplementation provide a
    sustained-release glucose source to reduce the amplitude of fasting
    hypoglycemia and glucose/galactose intolerance characteristic of
    Fanconi-Bickel syndrome; galactose restriction is also used given the
    shared GLUT2-dependent transport defect.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Fasting Hypoglycemia and Glucose/Galactose Intolerance
    treatment_effect: MODULATES
    description: >-
      Frequent feeding and sustained-release cornstarch reduce the
      amplitude of glycemic instability resulting from impaired GLUT2-mediated
      hepatic glucose buffering and glucose/galactose intolerance.
  evidence:
  - reference: PMID:9809815
    reference_title: "Fanconi-Bickel syndrome--the original patient and his natural history, historical steps leading to the primary defect, and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fasting hypoglycaemia"
    explanation: Long-term natural history study documents persistent fasting hypoglycemia, the target abnormality that frequent feeding/cornstarch dietary management addresses.
- name: Phosphate, Alkali, and Alfacalcidol Supplementation
  description: >-
    Oral phosphate, alkali, and active vitamin D (alfacalcidol) replacement
    address the renal phosphate and bicarbonate wasting from the proximal
    tubulopathy and support treatment of hypophosphatemic rickets.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alfacalcidol
      term:
        id: CHEBI:31186
        label: alfacalcidol
  target_mechanisms:
  - target: Impaired Renal Proximal Tubular Glucose Transport
    treatment_effect: MODULATES
    description: >-
      Supplementation replaces phosphate and bicarbonate lost through the
      Fanconi-type proximal tubulopathy and supports bone mineralization.
  evidence:
  - reference: PMID:38802119
    reference_title: "Repurposing SGLT2 inhibitors: Treatment of renal proximal tubulopathy in Fanconi-Bickel syndrome with empagliflozin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supplementations (i.e., phosphate, alkali, carnitine, and alfacalcidol) could be completely discontinued in the three children"
    explanation: Documents standard supplementation regimen (phosphate, alkali, carnitine, alfacalcidol) used to manage the renal tubulopathy prior to empagliflozin repurposing.
- name: Empagliflozin (SGLT2 Inhibitor, Off-Label)
  description: >-
    Off-label repurposing of the SGLT2 inhibitor empagliflozin blocks apical
    glucose reabsorption in renal proximal tubular cells, reducing the
    intracellular glucose/glycogen burden created by the basolateral GLUT2
    defect and improving biochemical markers of tubular integrity and
    function; in a case series, phosphate/alkali/carnitine/alfacalcidol
    supplementation could be discontinued in treated children.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: empagliflozin
      term:
        id: CHEBI:82720
        label: empagliflozin
    - preferred_term: SGLT2 Inhibitor
      term:
        id: NCIT:C98083
        label: SGLT2 Inhibitor
  target_mechanisms:
  - target: Impaired Renal Proximal Tubular Glucose Transport
    treatment_effect: MODULATES
    description: >-
      SGLT2 inhibition blocks apical glucose reabsorption in the proximal
      tubule, shifting the metabolic block and reducing the intracellular
      glucose/glycogen accumulation caused by the basolateral GLUT2 defect.
  evidence:
  - reference: PMID:38802119
    reference_title: "Repurposing SGLT2 inhibitors: Treatment of renal proximal tubulopathy in Fanconi-Bickel syndrome with empagliflozin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SGLT2 inhibitors such as empagliflozin shift the metabolic block in Fanconi-Bickel syndrome, that is, they intervene specifically in the underlying pathophysiology and can thus attenuate renal proximal tubulopathy, especially when started in early childhood."
    explanation: A case series of seven genetically confirmed FBS patients demonstrates that empagliflozin, by blocking apical tubular glucose reabsorption, specifically targets the underlying basolateral GLUT2 transport defect and improves biochemical markers of tubular function.
  - reference: PMID:38802119
    reference_title: "Repurposing SGLT2 inhibitors: Treatment of renal proximal tubulopathy in Fanconi-Bickel syndrome with empagliflozin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biochemical parameters of tubular cell integrity (urinary N-acetyl-glucosaminidase) and/or tubular functions (including urinary α1-microglobulin) improved in all persons with Fanconi-Bickel syndrome, albeit to varying degrees"
    explanation: Demonstrates measurable improvement in tubular cell integrity and function biomarkers under empagliflozin treatment across all seven treated patients.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Approximately 150 cases from over 100 families have been reported
    worldwide; an early literature review summarized 82 cases from 70
    families.
  evidence:
  - reference: PMID:9809815
    reference_title: "Fanconi-Bickel syndrome--the original patient and his natural history, historical steps leading to the primary defect, and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "give an overview of the 82 cases from 70 families in the published literature and from personal communications"
    explanation: The 1998 literature review documents 82 published/personally-communicated cases from 70 families, an early quantification of the ultra-rare global case burden.
- population: Palestinian population (Al-Makassed Hospital cohort)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    A single-center Palestinian cohort of 20 genetically confirmed cases is
    the largest reported single-center series, suggesting possible local
    enrichment or ascertainment bias from a consanguineous population;
    formal regional prevalence has not been established.
  evidence:
  - reference: PMID:39548873
    reference_title: "Genetic, Clinical, and Biochemical Characterization of a Large Cohort of Palestinian Patients With Fanconi-Bickel Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study presents the largest single-center cohort of FBS patients, expanding our understanding of the disorder's phenotypic and genotypic spectrum."
    explanation: Documents the largest single-center FBS cohort (20 patients) reported to date, from a Palestinian population.

- name: Impaired Hepatocyte Glucose Transport
  description: >-
    With hepatocyte GLUT2 nonfunctional, glucose entering via other routes
    (e.g., during feeding) cannot be efficiently released back into the
    circulation during fasting, and instead accumulates intracellularly
    where it drives excessive glycogen synthesis. This produces massive
    hepatic glycogen accumulation and hepatomegaly, with impaired hepatic
    glucose output during fasting.

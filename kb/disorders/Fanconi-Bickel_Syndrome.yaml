name: Fanconi-Bickel Syndrome
creation_date: "2026-07-06T00:00:00Z"
category: Mendelian
synonyms:
- Bickel-Fanconi Glycogenosis
- GSD due to GLUT2 Deficiency
- Glycogen Storage Disease due to GLUT2 Deficiency
- Glycogen Storage Disease Type XI
- Hepatorenal Glycogenosis with Renal Fanconi Syndrome
description: >-
  Fanconi-Bickel syndrome (FBS) is a rare autosomal recessive disorder of
  carbohydrate metabolism caused by biallelic loss-of-function variants in
  SLC2A2, which encodes the facilitative glucose transporter GLUT2. GLUT2 is
  expressed on the basolateral membrane of hepatocytes, the basolateral
  membrane of renal proximal tubular epithelial cells, pancreatic beta cells,
  and the basolateral membrane of intestinal enterocytes, where it mediates
  bidirectional, insulin-independent transport of glucose (and galactose)
  down their concentration gradient. Loss of GLUT2 function traps glucose
  intracellularly in hepatocytes and renal tubular cells, driving hepatorenal
  glycogen accumulation, a generalized (Fanconi-type) proximal renal
  tubulopathy, and impaired hepatic glucose release with fasting hypoglycemia
  with glucose and galactose intolerance.
  Clinically, FBS presents in infancy with hepatomegaly, failure to thrive,
  rickets/growth failure, and a characteristic "doll-like" facies, and carries
  a generally favorable long-term prognosis with dietary and supportive
  management.

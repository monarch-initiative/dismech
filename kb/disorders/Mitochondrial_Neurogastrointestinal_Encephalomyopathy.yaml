      external ophthalmoplegia syndromes and Kearns-Sayre syndrome linked to
      mtDNA deletions and MNGIE phenotypes associated with mtDNA depletion in
      clinically involved tissues
    explanation: >-
      Establishes RRM2B-related MTDPS8B as a distinct subtype presenting with a
      MNGIE phenotype and tissue mtDNA depletion.
  downstream:
  - target: Mitochondrial dNTP Pool Imbalance
    description: >-
      Loss of RRM2B ribonucleotide reductase activity disrupts de novo
      deoxyribonucleotide synthesis, unbalancing the mitochondrial dNTP pool.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Collectively named Mitochondrial DNA Depletion Syndromes (MTDPS), these
        diseases are clinically and genetically heterogeneous conditions caused
        by nuclear gene mutations disrupting deoxy ribonucleotide metabolism,
        which leads to an imbalance of the mitochondrial nucleotide pool and
        limited availability of one or more deoxy ribonucleoside triphosphates.
      explanation: >-
        Links nuclear gene defects in MTDPS (including RRM2B) to an imbalanced
        mitochondrial nucleotide pool.
- name: POLG Polymerase Gamma Deficiency
  description: >-
    In the rare POLG-related MNGIE-like subtype (MTDPS4B), biallelic pathogenic
    variants in POLG impair the catalytic subunit of mitochondrial DNA
    polymerase gamma without causing systemic thymidine or deoxyuridine
    accumulation.

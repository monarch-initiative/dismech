- name: Gene therapy (investigational)
  description: >-
    Hematopoietic stem cell gene therapy and AAV/liver-directed gene-therapy
    approaches aim to restore endogenous TYMP/TP activity and normalize
    nucleoside levels without allogeneic-donor risk. These remain preclinical /
    investigational, with efficacy and safety demonstrated in Tymp/Upp1
    double-knockout mouse models, but no human efficacy data are available yet.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Thymidine Phosphorylase Deficiency
    treatment_effect: RESTORES
    description: >-
      Lentiviral hematopoietic or AAV liver-directed TYMP gene transfer restores
      endogenous thymidine phosphorylase expression in preclinical Tymp/Upp1
      knockout mice.
    evidence:
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Lentiviral-mediated hematopoietic gene therapy was used in partially
        myeloablated double Tymp/Upp1 knockout mice and, again, high levels of
        TP activity were observed in the peripheral blood of the transplanted
        mice with a concomitant reduction of nucleoside concentrations.
      explanation: >-
        Filosto 2018 summarizes Tymp/Upp1 knockout mouse studies showing high
        peripheral-blood TP activity after lentiviral hematopoietic gene
        therapy.
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        More recently, it has been reported that treatment with AAV2/8-mediated
        transfer of the human TYMP coding sequence (hcTYP) targeting the liver
        in a murine model provides a permanent biochemical correction without
        adverse effects, which further indicates that gene therapy is a
        feasible therapeutic option for MNGIE treatment
      explanation: >-
        Filosto 2018 summarizes liver-directed AAV2/8 TYMP transfer in a mouse
        model providing permanent biochemical correction.

        impairment.
      explanation: >-
        Documents progressive bilateral ptosis as a primary ocular manifestation
        of MNGIE.
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Their vulnerability is likely due to the high energy request with high
        content in mitochondria and due to dependence on oxidative
        phosphorylation, which make ocular muscles more prone to the effect of
        mitochondrial dysfunction
      explanation: >-
        Explains how dependence on oxidative phosphorylation and high
        mitochondrial content make ocular muscles vulnerable to mitochondrial
        dysfunction.
  - target: Progressive external ophthalmoplegia
    description: >-
      Mitochondrial respiratory-chain dysfunction in extraocular muscles causes
      ocular myopathy (fiber atrophy and fibrosis) and chronic progressive
      external ophthalmoplegia / ophthalmoparesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Histological studies showed marked myopathic signs in the ocular muscles
        (i.e., fiber atrophy and fibrosis), which confirmed that myopathy rather
        than cranial neuropathy is involved in the external ophthalmoplegia
      explanation: >-
        Demonstrates that mitochondrial myopathy in extraocular muscles causes
        progressive external ophthalmoplegia in MNGIE.
  - target: Demyelinating peripheral neuropathy
    description: >-
      Mitochondrial dysfunction in peripheral nerves and Schwann cells causes a
      demyelinating sensorimotor peripheral neuropathy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mitochondrial abnormalities such as accumulation of mitochondria in
        Schwann cells and axons can be observed
      explanation: >-
        Links mitochondrial dysfunction in MNGIE to peripheral neuropathy.
  - target: Leukoencephalopathy
    description: >-
      Mitochondrial dysfunction in the central nervous system is associated with
      diffuse, symmetric cerebral white-matter T2 hyperintensity
      (leukoencephalopathy).
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Brain magnetic resonance imaging (MRI) usually showed symmetric and
        confluent T2 hyper-intensities located in the cerebral white matter
        (with sparing of subcortical U-fibers) and, sometimes, in the cerebellar
        white matter in the splenium of the corpus callosum, in the basal
        ganglia, and in the thalami
      explanation: >-
        Links MNGIE pathophysiology to diffuse cerebral leukoencephalopathy on
        brain MRI.
  - target: Skeletal myopathy
    description: >-
      Mitochondrial respiratory-chain dysfunction in skeletal muscle fibers
      produces proximal and limb myopathy with ragged-red and COX-deficient
      fibers.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A limb muscle biopsy usually shows classical signs of mitochondrial
        dysfunction including ragged-red fibers at Modified Gomori trichrome and
        scattered COX negative fibers, but it can also show only a few or no
        significant abnormalities
      explanation: >-
        Links mitochondrial dysfunction (ragged-red and COX-negative fibers) to
        skeletal myopathy in MNGIE.
phenotypes:
- name: Gastrointestinal dysmotility
  description: >-
    Progressive gastrointestinal dysmotility is the hallmark feature, manifesting
    as early satiety, nausea, dysphagia, gastroesophageal reflux, postprandial
    emesis, episodic abdominal pain and distention, and diarrhea, often
    progressing to chronic intestinal pseudo-obstruction.
  phenotype_term:
    preferred_term: Gastrointestinal dysmotility
    term:
      id: HP:0002579
      label: Gastrointestinal dysmotility
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:20301358
    reference_title: "Mitochondrial Neurogastrointestinal Encephalopathy Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitochondrial neurogastrointestinal encephalopathy (MNGIE) disease is
      characterized by progressive gastrointestinal dysmotility (manifesting as
      early satiety, nausea, dysphagia, gastroesophageal reflux, postprandial
      emesis, episodic abdominal pain and/or distention, and diarrhea)
    explanation: >-
      GeneReviews lists progressive gastrointestinal dysmotility as a defining
      feature of MNGIE.
  sequelae:
  - target: Intestinal pseudo-obstruction
    description: >-
      Progressive enteric neuromuscular dysmotility in the stomach and small
      bowel culminates in chronic intestinal pseudo-obstruction (CIPO)-like
      sub-occlusive episodes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30373120
      reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This is the clinical picture of a chronic intestinal pseudo-obstruction
        (CIPO), which is an increasingly recognized clinical feature of
        mitochondrial encephalomyopathies and a highly morbid and often
        life-threatening condition characterized by marked dysfunction of gut
        propulsive motility
      explanation: >-
        Links gastrointestinal dysmotility directly to chronic intestinal
        pseudo-obstruction.
  - target: Cachexia
    description: >-
      Chronic severe gastrointestinal dysmotility and malabsorption lead to
      progressive malnutrition, severe weight loss, and cachexia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32173240
      reference_title: "Successful liver transplantation in mitochondrial neurogastrointestinal encephalomyopathy (MNGIE)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Characteristic clinical findings of patients with MNGIE include
        gastrointestinal dysmotility leading to malnutrition and cachexia
      explanation: >-
        Directly links gastrointestinal dysmotility to malnutrition and
        cachexia.

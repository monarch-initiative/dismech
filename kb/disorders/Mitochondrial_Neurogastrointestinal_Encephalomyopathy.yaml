diagnosis:
- name: Thymidine phosphorylase enzyme activity assay
  diagnosis_term:
    preferred_term: enzyme activity measurement
    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  presence: Markedly reduced leukocyte or buffy-coat thymidine phosphorylase enzyme activity
  markers: Buffy-coat or leukocyte thymidine phosphorylase enzyme activity
  description: >-
    Measurement of thymidine phosphorylase (TP) enzyme activity in leukocytes
    or buffy coat shows markedly reduced activity in classic TYMP-related
    MNGIE, whereas obligate heterozygous carriers are asymptomatic.
  evidence:
  - reference: PMID:20301358
    reference_title: "Mitochondrial Neurogastrointestinal Encephalopathy Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of MNGIE disease can be established in a proband by
      detection of one of the following: (1) biallelic pathogenic variants in
      TYMP (formerly known as ECGF1); (2) markedly reduced levels of thymidine
      phosphorylase enzyme activity; or (3) elevated plasma concentrations of
      thymidine and deoxyuridine.
    explanation: >-
      GeneReviews establishes markedly reduced leukocyte TP enzyme activity as a
      primary biochemical diagnostic criterion for MNGIE.
- name: Plasma thymidine and deoxyuridine measurement
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  presence: Increased (plasma thymidine >3 micromol/L and plasma 2'-deoxyuridine >5 micromol/L)
  markers: Plasma thymidine and 2'-deoxyuridine concentrations
  results: Confirms diagnostic elevation of plasma thymidine (>3 micromol/L) and plasma 2'-deoxyuridine (>5 micromol/L).
  description: >-
    Quantitative measurement of plasma thymidine and 2'-deoxyuridine
    demonstrates marked elevation above diagnostic thresholds (>3 micromol/L
    and >5 micromol/L in plasma, respectively).
  evidence:
  - reference: PMID:30959750
    reference_title: "Safety and Efficacy of Erythrocyte Encapsulated Thymidine Phosphorylase in Mitochondrial Neurogastrointestinal Encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a definitive diagnosis of MNGIE due to thymidine phosphorylase deficiency
      that as established by the confirmation of a pathogenic mutation in TYMP,
      <18% of normal thymidine phosphorylase activity in the buffy coat, and
      plasma thymidine and deoxyuridine concentrations greater than 3 µmol/L
      and 5 µmol/L, respectively
    explanation: >-
      Establishes the diagnostic plasma metabolite thresholds and buffy-coat TP
      activity assay used to diagnose MNGIE.
- name: TYMP molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Biallelic pathogenic variants in TYMP (or POLG / RRM2B in MNGIE-like subtypes)
  markers: TYMP sequence analysis and targeted deletion/duplication analysis
  description: >-
    Sequence analysis (and deletion/duplication analysis if needed) of TYMP
    identifies biallelic pathogenic variants in almost all individuals with
    classic MNGIE; testing of POLG and RRM2B evaluates rare MNGIE-like
    phenocopies when TP activity and nucleoside levels are normal.
  evidence:
  - reference: PMID:20301358
    reference_title: "Mitochondrial Neurogastrointestinal Encephalopathy Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of MNGIE disease can be established in a proband by
      detection of one of the following: (1) biallelic pathogenic variants in
      TYMP (formerly known as ECGF1); (2) markedly reduced levels of thymidine
      phosphorylase enzyme activity; or (3) elevated plasma concentrations of
      thymidine and deoxyuridine.
    explanation: >-
      GeneReviews confirms molecular genetic testing for biallelic pathogenic
      variants in TYMP as definitive genetic confirmation of MNGIE.
- name: Brain magnetic resonance imaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  presence: Diffuse symmetric T2-weighted hyperintensity of cerebral white matter sparing subcortical U-fibers
  markers: Symmetric confluent cerebral white-matter T2 hyperintensity
  results: Demonstrates characteristic symmetric and confluent cerebral white-matter T2 hyperintensities on brain MRI.
  description: >-
    Brain MRI demonstrates characteristic symmetric and confluent T2
    hyperintensities in the cerebral white matter (with sparing of subcortical
    U-fibers) and sometimes in the cerebellar white matter, splenium of the
    corpus callosum, basal ganglia, and thalami, which is a key clue
    distinguishing MNGIE from primary gastrointestinal or peripheral-nerve
    disorders.
  evidence:
  - reference: PMID:30373120
    reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging (MRI) usually showed symmetric and
      confluent T2 hyper-intensities located in the cerebral white matter
      (with sparing of subcortical U-fibers) and, sometimes, in the cerebellar
      white matter in the splenium of the corpus callosum, in the basal
      ganglia, and in the thalami
    explanation: >-
      Documents the characteristic brain MRI leukoencephalopathy pattern used in
      the diagnostic evaluation of MNGIE.
differential_diagnoses:
- name: Anorexia nervosa
  disease_term:
    preferred_term: anorexia nervosa
    term:
      id: MONDO:0005351
      label: anorexia nervosa
  description: >-
    Prominent early satiety, postprandial vomiting, and severe weight loss in
    adolescents and young adults with MNGIE frequently lead to an initial
    misdiagnosis of anorexia nervosa.
  distinguishing_features:
  - Psychiatric eating disorder with body-image disturbance
  - Absence of organic gastrointestinal dysmotility, ptosis, ophthalmoplegia, demyelinating neuropathy, and brain MRI leukoencephalopathy
  - Normal leukocyte thymidine phosphorylase activity and plasma nucleoside levels
  evidence:
  - reference: PMID:30373120
    reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential diagnoses include, other than MNGIE-type MTDPS and CIDP,
      many other conditions such as anorexia nervosa, inflammatory bowel
      disease and irritable bowel disease, intestinal pseudo-obstruction
      disorders, celiac disease, and various leukodystrophies.
    explanation: >-
      Filosto 2018 documents anorexia nervosa as a common differential
      diagnosis in patients presenting with MNGIE.
- name: Inflammatory bowel disease
  disease_term:
    preferred_term: inflammatory bowel disease
    term:
      id: MONDO:0005265
      label: inflammatory bowel disease
  description: >-
    Chronic abdominal pain, diarrhea, weight loss, and intestinal sub-occlusion
    in MNGIE frequently mimic inflammatory bowel disease.
  distinguishing_features:
  - Mucosal inflammation and ulceration on endoscopy and histology
  - Absence of extra-intestinal mitochondrial features (ptosis, PEO, leukoencephalopathy, demyelinating neuropathy)
  - Normal leukocyte thymidine phosphorylase activity and plasma thymidine/deoxyuridine levels
  evidence:
  - reference: PMID:30373120
    reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential diagnoses include, other than MNGIE-type MTDPS and CIDP,
      many other conditions such as anorexia nervosa, inflammatory bowel
      disease and irritable bowel disease, intestinal pseudo-obstruction
      disorders, celiac disease, and various leukodystrophies.
    explanation: >-
      Filosto 2018 documents inflammatory bowel disease as a common differential
      diagnosis in MNGIE.
- name: Celiac disease
  disease_term:
    preferred_term: celiac disease
    term:
      id: MONDO:0005130
      label: celiac disease
  description: >-
    Chronic diarrhea, malabsorption, and weight loss in MNGIE often prompt
    evaluation or empirical treatment for celiac disease.
  distinguishing_features:
  - Gluten-sensitive enteropathy with positive celiac serologies (anti-tTG/EMA) and duodenal villous atrophy responsive to a gluten-free diet
  - Absence of leukoencephalopathy, progressive external ophthalmoplegia, and thymidine phosphorylase deficiency
  evidence:
  - reference: PMID:30373120
    reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential diagnoses include, other than MNGIE-type MTDPS and CIDP,
      many other conditions such as anorexia nervosa, inflammatory bowel
      disease and irritable bowel disease, intestinal pseudo-obstruction
      disorders, celiac disease, and various leukodystrophies.
    explanation: >-
      Filosto 2018 lists celiac disease among the frequent gastrointestinal
      differential diagnoses of MNGIE.
- name: Chronic inflammatory demyelinating polyradiculoneuropathy
  disease_term:
    preferred_term: chronic inflammatory demyelinating polyradiculoneuropathy
    term:
      id: MONDO:0006702
      label: chronic inflammatory demyelinating polyradiculoneuropathy
  description: >-
    When demyelinating sensorimotor neuropathy and elevated CSF protein
    predominate early in the course of MNGIE, patients are frequently
    misdiagnosed with CIDP and treated unsuccessfully with immunomodulatory
    therapy.
  distinguishing_features:
  - Acquired immune-mediated neuropathy without diffuse brain MRI leukoencephalopathy
  - Absence of chronic intestinal pseudo-obstruction, external ophthalmoplegia, and thymidine phosphorylase deficiency
  evidence:
  - reference: PMID:30373120
    reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, patients with incomplete or atypical clinical manifestations
      have been repeatedly described and frequently misdiagnosed with
      conditions like anorexia nervosa, inflammatory bowel disease, CIDP, and
      Charcot Marie Tooth disease
    explanation: >-
      Filosto 2018 highlights that MNGIE with prominent demyelinating neuropathy
      is frequently misdiagnosed as CIDP.
- name: Charcot-Marie-Tooth disease
  disease_term:
    preferred_term: Charcot-Marie-Tooth disease
    term:
      id: MONDO:0015626
      label: Charcot-Marie-Tooth disease
  description: >-
    Chronic distal symmetric sensorimotor demyelinating neuropathy with foot
    deformity or distal weakness in MNGIE can be mistaken for hereditary
    motor and sensory neuropathy (Charcot-Marie-Tooth disease).
  distinguishing_features:
  - Isolated hereditary peripheral neuropathy without severe gastrointestinal dysmotility
  - Absence of diffuse brain MRI leukoencephalopathy, ptosis/PEO, and thymidine phosphorylase deficiency
  evidence:
  - reference: PMID:30373120
    reference_title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, patients with incomplete or atypical clinical manifestations
      have been repeatedly described and frequently misdiagnosed with
      conditions like anorexia nervosa, inflammatory bowel disease, CIDP, and
      Charcot Marie Tooth disease
    explanation: >-
      Filosto 2018 notes that MNGIE with prominent demyelinating neuropathy is
      frequently misdiagnosed as Charcot-Marie-Tooth disease.
clinical_trials:
- name: NCT03866954
  phase: PHASE_II
  status: WITHDRAWN
  description: >-
    Open-label phase 2 trial of erythrocyte-encapsulated thymidine phosphorylase
    (EE-TP) in MNGIE, sponsored by St George's, University of London. Withdrawn
    before enrollment due to a change of circumstances with the commercial
    partner.
  target_phenotypes:
  - preferred_term: Gastrointestinal dysmotility
    term:
      id: HP:0002579
      label: Gastrointestinal dysmotility
  evidence:
  - reference: clinicaltrials:NCT03866954
    reference_title: "The Safety, Tolerability, Pharmacodynamics, and Efficacy of Erythrocyte Encapsulated Thymidine Phosphorylase (EE-TP) in Patients With MNGIE"
    supports: SUPPORT
    snippet: >-
      The purpose of this study is to determine the safety, tolerability, action
      and effectiveness of repeated doses of Erythrocyte Encapsulated Thymidine
      Phosphorylase (EE-TP) for the treatment of patients with Mitochondrial
      Neurogastrointestinal Encephalomyopathy (MNGIE).
    explanation: >-
      Registered phase 2 trial of EE-TP enzyme-replacement therapy for MNGIE.
prevalence:
- population: General population
  notes: >-
    MNGIE is an ultra-rare disorder. Affected individuals have a markedly reduced
    life expectancy, with premature death reported at an average age of about
    37.6 years.
  evidence:
  - reference: PMID:30959750
    reference_title: "Safety and Efficacy of Erythrocyte Encapsulated Thymidine Phosphorylase in Mitochondrial Neurogastrointestinal Encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It causes relentless and progressive morbidity, followed by premature
      death at an average age of 37.6 years
    explanation: >-
      Documents the ultra-rare, progressive, and frequently fatal natural
      history of MNGIE.

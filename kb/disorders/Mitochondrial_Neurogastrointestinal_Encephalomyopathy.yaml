references:
- reference: PMID:20301358
  title: "Mitochondrial Neurogastrointestinal Encephalopathy Disease."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      MNGIE is an autosomal recessive disorder characterized by progressive
      gastrointestinal dysmotility, cachexia, ptosis/ophthalmoplegia,
      leukoencephalopathy, and demyelinating peripheral neuropathy, with symptom
      onset before age 20 years in approximately 60% of individuals.
    supporting_text: >-
      Mitochondrial neurogastrointestinal encephalopathy (MNGIE) disease is
      characterized by progressive gastrointestinal dysmotility (manifesting as
      early satiety, nausea, dysphagia, gastroesophageal reflux, postprandial
      emesis, episodic abdominal pain and/or distention, and diarrhea);
      cachexia; ptosis/ophthalmoplegia or ophthalmoparesis; leukoencephalopathy;
      and demyelinating peripheral neuropathy
- reference: PMID:9924029
  title: "Thymidine phosphorylase gene mutations in MNGIE, a human mitochondrial disorder."
  findings:
  - statement: >-
      Homozygous or compound-heterozygous loss-of-function mutations in TYMP on
      chromosome 22q13.32-qter reduce leukocyte thymidine phosphorylase activity
      to less than 5% of controls and cause MNGIE with multiple skeletal muscle
      mtDNA deletions.
    supporting_text: >-
      TP activity in leukocytes from MNGIE patients was less than 5 percent of
      controls, indicating that loss-of-function mutations in TP cause the
      disease.
- reference: PMID:30373120
  title: "Mitochondrial Neurogastrointestinal Encephalomyopathy (MNGIE-MTDPS1)."
  findings:
  - statement: >-
      Classic MNGIE-MTDPS1 is caused by TYMP loss-of-function mutations leading
      to systemic nucleoside accumulation and mitochondrial dysfunction, while
      rare MNGIE-type clinical phenocopies are linked to mutations in POLG and
      RRM2B.
    supporting_text: >-
      Other two MNGIE-type phenotypes have been described so far, which are
      linked to mutations in POLG and RRM2B genes.
- reference: PMID:26264513
  title: "Allogeneic haematopoietic stem cell transplantation for mitochondrial neurogastrointestinal encephalomyopathy."
  findings:
  - statement: >-
      Allogeneic hematopoietic stem cell transplantation restores thymidine
      phosphorylase enzyme function and improves long-term clinical
      manifestations in surviving MNGIE patients, with survival strongly
      associated with HLA match and absence of liver disease or gastrointestinal
      pseudo-obstruction.
    supporting_text: >-
      Allogeneic haematopoietic stem cell transplantation can restore thymidine
      phosphorylase enzyme function in patients with mitochondrial
      neurogastrointestinal encephalomyopathy and improve clinical
      manifestations of mitochondrial neurogastrointestinal encephalomyopathy in
      the long term.
- reference: PMID:30959750
  title: "Safety and Efficacy of Erythrocyte Encapsulated Thymidine Phosphorylase in Mitochondrial Neurogastrointestinal Encephalomyopathy."
  findings:
  - statement: >-
      Erythrocyte-encapsulated thymidine phosphorylase (EE-TP) reduces elevated
      plasma thymidine and deoxyuridine levels and produces clinical
      improvements in weight and disease scores in MNGIE patients.
    supporting_text: >-
      EE-TP was well tolerated and reductions in the disease-associated plasma
      metabolites, thymidine, and deoxyuridine were observed in all three
      patients. Clinical improvements, including weight gain and improved disease
      scores, were observed in two patients
- reference: PMID:32173240
  title: "Successful liver transplantation in mitochondrial neurogastrointestinal encephalomyopathy (MNGIE)."
  findings:
  - statement: >-
      Orthotopic liver transplantation nearly normalizes plasma thymidine levels
      and stabilizes disease symptoms in patients with MNGIE with a favorable
      safety profile.
    supporting_text: >-
      Following LT, thymidine levels nearly normalized in all four patients and
      remained low for the duration of follow-up. Disease symptoms stabilized in
      all patients, with some manifesting improvements, including intestinal
      function.

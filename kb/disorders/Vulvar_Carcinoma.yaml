experimental_models:
- name: VCC1 Lichen-Sclerosus-Associated VSCC Cell Line
  description: >-
    VCC1 is a spontaneously immortalized human vulvar squamous carcinoma cell
    line derived from lichen-sclerosus-associated VSCC. Three-dimensional
    organotypic cultures and xenografts make it useful for studying tumor-stroma
    dependence, invasion, and drug response.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: vulva
    term:
      id: UBERON:0000997
      label: mammalian vulva
  cell_types:
  - preferred_term: vulvar squamous carcinoma cell
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: cancer-associated fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cell_source: Spontaneously immortalized VCC1 cells isolated from a human lichen-sclerosus-associated VSCC.
  culture_system: Monolayer culture and three-dimensional fibroblast-containing organotypic culture, complemented by xenografts.
  publication: PMID:31654625
  modeled_mechanisms:
  - target: Fibroblast-Supported Tumor Invasion
    description: Tests whether cancer-associated fibroblasts support VSCC invasion and tumor formation.
    evidence:
    - reference: PMID:31654625
      reference_title: "Establishment of a novel cancer cell line derived from vulvar carcinoma associated with lichen sclerosus exhibiting a fibroblast-dependent tumorigenic potential."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In vitro 3D organotypic assays and in vivo xenografts revealed a prominent
        role of cancer-associated fibroblasts in VCC1 invasion and tumor formation.
      explanation: >-
        The combined organotypic and xenograft result directly links the model

discussions:
- discussion_id: gap_vulvar_carcinoma_caf_model_subtype_generality
  prompt: >-
    Is cancer-associated-fibroblast dependence a shared invasion mechanism
    across HPV-associated, HPV-independent p53-abnormal, and HPV-independent
    p53-wild-type VSCC, or is the VCC1 result specific to one
    lichen-sclerosus-associated tumor model?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Fibroblast-Supported Tumor Invasion
  - experimental_models#VCC1 Lichen-Sclerosus-Associated VSCC Cell Line
  rationale: >-
    The current experimental evidence comes from one spontaneously immortalized
    lichen-sclerosus-associated cell line studied in organotypic culture and
    xenografts. That model supports stromal dependence in VCC1 but cannot by
    itself establish generality across the three molecular VSCC subtypes or
    distinguish patient-specific from subtype-shared fibroblast effects.
  proposed_experiments:
  - experiment_id: exp_vscc_subtype_stratified_organoid_caf_panel
    name: Subtype-stratified patient-derived VSCC organoid and CAF perturbation panel
    description: >-
      Establish multiple patient-derived tumor organoids from each major VSCC
      molecular subtype and compare matched CAF addition, depletion, and
      cross-over coculture under a harmonized invasion assay.
    experiment_type:
      preferred_term: patient-derived tumor organoid coculture perturbation experiment
    model_systems:
    - name: Subtype-stratified patient-derived VSCC organoid-CAF coculture panel
      description: >-
        Replicate organoid lines from HPV-associated p16-positive,
        HPV-independent p53-abnormal, and HPV-independent p53-wild-type tumors,
        each paired with matched primary CAFs and normal-vulvar fibroblasts.
      experimental_model_type: CO_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: vulva
        term:
          id: UBERON:0000997
          label: mammalian vulva
      cell_types:
      - preferred_term: vulvar squamous carcinoma cell
        term:
          id: CL:0000312
          label: keratinocyte
      - preferred_term: cancer-associated fibroblast
        term:
          id: CL:0000057
          label: fibroblast
      cell_source: Fresh patient VSCC resections and matched tumor-adjacent stromal tissue, stratified by p16, p53, and direct HPV status.
      culture_system: Three-dimensional tumor organoids in matrix with matched, depleted, or cross-over primary fibroblast coculture.
    perturbations:
    - name: Matched CAF addition or depletion
      target: pathophysiology#Fibroblast-Supported Tumor Invasion
      description: >-
        Compare tumor organoids with matched CAFs, without fibroblasts, and with
        normal-vulvar fibroblasts to isolate stromal dependence.
    - name: Cross-subtype CAF exchange
      target: pathophysiology#Fibroblast-Supported Tumor Invasion
      description: >-
        Exchange CAFs among molecular-subtype organoids to distinguish a shared

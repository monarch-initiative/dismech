- name: Adjuvant Radiotherapy for Resected Node-Positive Disease
  description: >-
    After surgery for inguinofemoral node-positive vulvar cancer, adjuvant
    radiotherapy may reduce groin recurrence. The systematic-review evidence is
    explicitly very low certainty, so this entry does not claim a definitive
    overall-survival benefit or universal indication.
  evidence:
  - reference: DOI:10.3389/or.2024.1389035
    reference_title: "Adjuvant Radiotherapy for Groin Node Metastases Following Surgery for Vulvar Cancer: A Systematic Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three (5.3%) versus 13 (24.1%) groin recurrences were noted, respectively,
      in the adjuvant radiotherapy and pelvic lymphadenectomy groups.
    explanation: >-
      The single eligible randomized trial reported fewer groin recurrences
      after adjuvant radiotherapy than after pelvic lymphadenectomy.
  - reference: DOI:10.3389/or.2024.1389035
    reference_title: "Adjuvant Radiotherapy for Groin Node Metastases Following Surgery for Vulvar Cancer: A Systematic Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is only very low-quality evidence on administering adjuvant
      radiotherapy for inguinal lymph node metastases.
    explanation: >-
      The review's certainty statement limits this treatment claim and prevents
      extrapolation to broad definitive or routine adjuvant radiotherapy.
  therapeutic_modality: RADIOTHERAPY
  target_mechanisms:
  - target: Inguinofemoral Nodal Metastasis
    treatment_effect: INHIBITS

      label: Surgical Procedure
- name: Inguinofemoral Radiotherapy for Sentinel-Node Micrometastases
  description: >-
    In patients with sentinel-node micrometastases, inguinofemoral radiotherapy
    is a groin-treatment alternative to inguinofemoral lymphadenectomy with
    comparable efficacy and lower treatment-related morbidity. This evidence
    does not support a blanket definitive or adjuvant radiotherapy claim.
  evidence:
  - reference: DOI:10.6004/jnccn.2024.7002
    reference_title: "Update on the Sentinel Node Procedure in Vulvar Cancer"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inguinofemoral radiotherapy is a good alternative to IFL in patients
      with micrometastases in the SN, with comparable efficacy and less

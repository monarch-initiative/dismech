progression:
- phase: HPV-associated HSIL/uVIN precursor lesion to invasive carcinoma
  notes: >-
    HPV-associated VIN 2/3 corresponds to HSIL. Its progression toward squamous
    carcinoma is generally slower than dVIN, and spontaneous regression can
    occur within the HPV-associated VIN spectrum, especially in lower-grade VIN.
  evidence:
  - reference: DOI:10.1055/a-1545-4279
    reference_title: "2020 WHO Classification of Female Genital Tumors"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous regression possible (especially VIN 1)
      Most common form of VIN
      Slower rate of progression squamous cell carcinomaVIN
    explanation: >-
      The WHO review supplies a qualitative, subtype-specific natural-history
      comparison; no unsupported numerical transition probability is inferred.
- phase: Differentiated VIN precursor lesion to invasive carcinoma
  notes: >-
    dVIN is less common, occurs in older women, can accompany lichen
    sclerosus, has no expected spontaneous regression, and progresses more
    rapidly toward squamous carcinoma than HPV-associated VIN.
  evidence:
  - reference: DOI:10.1055/a-1545-4279
    reference_title: "2020 WHO Classification of Female Genital Tumors"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Less common form of VIN
      No spontaneous regression
      Older women
      Faster rate of progression VIN squamous cell carcinoma
    explanation: >-
      This directly supports the calibrated qualitative natural history of dVIN.
  - reference: DOI:10.3390/diagnostics14161799
    reference_title: "Squamous Cell Carcinoma In Situ—The Importance of Early Diagnosis in Bowen Disease, Vulvar Intraepithelial Neoplasia, Penile Intraepithelial Neoplasia, and Erythroplasia of Queyrat"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histopathologic features, degree of differentiation, and associations
      with lichen planus, lichen sclerosus, and HPV guide the selection of
      conservative treatments or surgical excision.
    explanation: >-
      The VIN-focused review supports lichen sclerosus as a precursor-lesion
      context; the progression-rate comparison remains sourced to WHO.
- phase: Vulvar lichen sclerosus-associated risk surveillance
  notes: >-
    Vulvar lichen sclerosus carries a long-term vulvar-cancer risk that rises
    over extended follow-up, supporting early detection of premalignant lesions
    and lifelong surveillance rather than a fixed short surveillance window.
  evidence:
  - reference: DOI:10.3389/fmed.2023.1106318
    reference_title: "Lichen sclerosus: The 2023 update"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the cumulative probability of progression to vulvar cancer escalates from
      1.2% at 2 years to 36.8% at 25 years
    explanation: >-
      The review reports increasing long-term cumulative progression in a VLS
      cohort and supports sustained surveillance in this specific risk context.
stages:
- name: FIGO 2021 Vulvar Carcinoma Staging
  description: >-
    The data-derived 2021 FIGO system stages vulvar carcinoma across Stages I
    through IV, incorporates tumor, nodal, and distant-disease characteristics,
    and permits cross-sectional imaging findings to contribute to staging.
  evidence:
  - reference: PMID:34520062
    reference_title: "FIGO staging for carcinoma of the vulva: 2021 revision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The resulting new staging for carcinoma of the vulva has two substages in
      Stage I, no substage in Stage II, three substages in Stage III, and two
      substages in Stage IV.
    explanation: >-
      The FIGO revision defines the current stage and substage structure from a
      12,063-case dataset.
  - reference: PMID:34520062
    reference_title: "FIGO staging for carcinoma of the vulva: 2021 revision."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This revision has a new definition for depth of invasion, uses the same
      definition for lymph node metastases utilized in cervical cancer, and
      allows findings from cross-sectional imaging to be incorporated into
      vulvar cancer staging.
    explanation: >-
      This directly supports the invasion-depth, nodal, and imaging components
      of the 2021 FIGO staging framework.

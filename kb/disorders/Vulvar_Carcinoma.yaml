- name: Vulvar Intraepithelial Neoplasia
  biological_scale: TISSUE
  description: >-
    Vulvar intraepithelial neoplasia is a precancerous squamous lesion that can
    arise in HPV-associated or HPV-independent vulvar carcinogenic pathways and
    precede invasive squamous carcinoma.
  evidence:
  - reference: PMID:39202286
    reference_title: "Squamous Cell Carcinoma In Situ-The Importance of Early Diagnosis in Bowen Disease, Vulvar Intraepithelial Neoplasia, Penile Intraepithelial Neoplasia, and Erythroplasia of Queyrat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnoses of vulvar intraepithelial neoplasia (VIN) and PeIN present
      significant challenges and typically necessitate one or more biopsies,
      potentially guided by dermoscopy. Aceto-white testing demonstrates a
      notably high negative predictive value for genital precancerous lesions.
    explanation: >-
      The review explicitly places VIN among genital precancerous lesions and
      describes the biopsy-based diagnostic pathway for this precursor state.

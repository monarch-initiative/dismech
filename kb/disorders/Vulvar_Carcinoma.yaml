- name: HPV E7-Mediated pRB Binding
  conforms_to: "viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack"
  biological_scale: MOLECULAR
  description: >-
    The high-risk HPV16 E7 oncoprotein binds the retinoblastoma protein pRB,
    disrupting RB-pathway control and enabling inappropriate cell-cycle entry
    in infected vulvar keratinocytes.
  evidence:
  - reference: PMID:2537532
    reference_title: "The human papilloma virus-16 E7 oncoprotein is able to bind to the retinoblastoma gene product."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These assays have been used to demonstrate that the E7 oncoprotein of the
      human papilloma virus type-16 can form similar complexes with p105-RB.
    explanation: >-
      The biochemical study directly demonstrates HPV16 E7 binding to the RB
      gene product and supports RB-pathway disruption in HPV-associated cancer.
  - reference: PMID:25340830
    reference_title: "Viral carcinogenesis: factors inducing DNA damage and virus integration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      E7, another HPV oncogene, mimics this process by binding to pRB and
      releasing the E2F protein
    explanation: >-
      The review directly supports the modeled step from E7-pRB binding to E2F
      release.
  - reference: PMID:25340830
    reference_title: "Viral carcinogenesis: factors inducing DNA damage and virus integration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This results in the release of the E2F protein, which then activates the
      transcription of genes required for the S-phase transition
    explanation: >-
      The same review connects E2F release to transcriptional activation of the
      S-phase program, supporting increased G1/S transition in this node.

- name: HPV E6-Mediated p53 Degradation
  conforms_to: "viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack"
  biological_scale: MOLECULAR
  description: >-
    The high-risk HPV E6 oncoprotein binds p53 and stimulates its degradation
    through the ubiquitin-dependent protease system, weakening a central
    tumor-suppressor checkpoint in infected vulvar keratinocytes.
  evidence:
  - reference: PMID:2175676
    reference_title: "The E6 oncoprotein encoded by human papillomavirus types 16 and 18 promotes the degradation of p53."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study we demonstrate that the E6 proteins of the oncogenic HPVs
      that bind p53 stimulate the degradation of p53.
    explanation: >-
      This classic mechanistic study directly supports E6-mediated p53
      degradation rather than inferring tumor-suppressor disruption from p16
      staining alone.
  - reference: PMID:25340830
    reference_title: "Viral carcinogenesis: factors inducing DNA damage and virus integration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The HR HPV E6 protein induces ubiquitin-mediated degradation of p53,
      resulting in disabling of the normal cellular response to many insults,
      including the DNA damage response
    explanation: >-
      This viral-carcinogenesis review connects E6-mediated p53 degradation to
      loss of the host DNA-damage response modeled by this node.

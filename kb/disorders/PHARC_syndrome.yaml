differential_diagnoses:
- name: Usher syndrome
  disease_term:
    preferred_term: Usher syndrome
    term:
      id: MONDO:0019501
      label: Usher syndrome
  description: Usher syndrome (particularly Usher syndrome type 3) overlaps clinically through progressive sensorineural hearing loss, balance defects, and retinitis pigmentosa, and patients with biallelic ABHD12 variants may be misdiagnosed with Usher syndrome if neurological findings are not evaluated.
  distinguishing_features:
  - Development of peripheral polyneuropathy, cerebellar ataxia, and early-onset cataracts alongside biallelic ABHD12 variants in PHARC syndrome
  evidence:
  - reference: PMID:35353227
    reference_title: 'The genetic and phenotypic landscapes of Usher syndrome: from disease mechanisms to a new classification.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PHARC should, therefore, be considered as a differential diagnosis for patients with USH3-like phenotypes presenting with progressive hearing loss and balance defects.
    explanation: Directly establishes PHARC syndrome as a differential diagnosis for Usher syndrome type 3-like dual sensory loss with balance defects.
  - reference: PMID:35353227
    reference_title: 'The genetic and phenotypic landscapes of Usher syndrome: from disease mechanisms to a new classification.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: One major problem with these studies is that they do not usually include neurological results for the patients, potentially leading to the misdiagnosis of their condition as USH3.
    explanation: Explains how omitting neurological evaluations in patients with biallelic ABHD12 variants leads to misdiagnosis of PHARC syndrome as Usher syndrome type 3.

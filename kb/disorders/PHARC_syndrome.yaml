prevalence:
- population: Global published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: Ultra-rare disorder; a 2025 systematic review of PubMed/MEDLINE and NLM databases identified 57 unique published cases worldwide.
  evidence:
  - reference: PMID:40064796
    reference_title: 'Characterizing and expanding the neurological clinical spectrum of PHARC syndrome: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A systematic search of studies reporting cases of PHARC syndrome was conducted using PubMed/MEDLINE and NLM databases, identifying 57 unique cases.
    explanation: Documents 57 unique reported cases globally, establishing ultra-rare prevalence.
progression:
- phase: Initial symptom presentation
  age_range: Childhood to early adulthood
  notes: Hearing loss is the most common initial symptom, though cataract (including congenital forms) or polyneuropathy may appear first; only 31.6% of patients exhibit the complete pentad at reporting, contributing to a mean diagnostic delay of 20.5 years from first symptom to diagnosis.
  evidence:
  - reference: PMID:40064796
    reference_title: 'Characterizing and expanding the neurological clinical spectrum of PHARC syndrome: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The results showed that hearing loss was the most common initial symptom, with a complete syndrome observed in only 31.6% of reported cases. The mean diagnostic delay from the appearance of the first PHARC-related symptom to diagnosis was 20.5 years.
    explanation: Documents initial symptom presentation and the 20.5-year mean diagnostic delay in PHARC syndrome.
- phase: Progressive visual and neurologic decline
  notes: Progressive retinal and macular degeneration is accompanied by a trend of declining best-corrected visual acuity (mean 1.1 logMAR), while neurological involvement frequently includes pyramidal tract signs that correlate with ataxia and cerebellar atrophy on MRI.
  evidence:
  - reference: PMID:34573385
    reference_title: 'The Phenotypic Spectrum of Patients with PHARC Syndrome Due to Variants in ABHD12: An Ophthalmic Perspective.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mean best-corrected visual acuity was 1.1 logMAR (SD ± 0.9; range from 0.1 to 2.8; equivalent to 20/250 Snellen) and showed a trend of progressive decline.
    explanation: Demonstrates a trend of progressive decline in best-corrected visual acuity in PHARC syndrome.
  - reference: PMID:40064796
    reference_title: 'Characterizing and expanding the neurological clinical spectrum of PHARC syndrome: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with pyramidal signs were more likely to exhibit an ataxic phenotype (p-value 0.018), a complete syndrome (p-value 0.092), and cerebellar atrophy on MRI (p-value 0.001), compared to those without pyramidal signs.
    explanation: Documents the correlation between pyramidal tract signs, ataxia, and cerebellar atrophy on MRI in progressive neurological disease.

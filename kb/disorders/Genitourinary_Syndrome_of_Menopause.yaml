- name: Vaginal Epithelial Atrophy and Glycogen Depletion
  biological_scale: TISSUE
  description: >-
    The vaginal epithelium loses proliferative drive, thins from many layers of
    glycogen-laden superficial cells to a few layers of parabasal cells, and stops
    delivering glycogen to the lumen. Two consequences separate here and are curated as
    separate downstream nodes: the mechanical and barrier consequence of a thin epithelium,
    and the ecological consequence of withdrawing the carbon source the luminal
    lactobacilli depend on. The glycogen claim is specifically about free glycogen in
    genital fluid rather than intraepithelial staining, because that is the fraction the
    cited study measured and the fraction available to the lumen; intraepithelial glycogen
    has been reported in postmenopausal and ovariectomized women, so the node does not
    claim the epithelium stops making glycogen altogether.
  cell_types:
  - preferred_term: vaginal squamous epithelial cell
    term:
      id: CL:1001578
      label: vagina squamous cell
  locations:
  - preferred_term: epithelium of vagina
    term:
      id: UBERON:0001344
      label: epithelium of vagina
  biological_processes:
  - preferred_term: proliferation of the vaginal squamous epithelium
    term:
      id: GO:0050673
      label: epithelial cell proliferation
    modifier: DECREASED
  - preferred_term: glycogen deposition in the vaginal epithelium
    term:
      id: GO:0005978
      label: glycogen biosynthetic process
    modifier: DECREASED
  evidence:

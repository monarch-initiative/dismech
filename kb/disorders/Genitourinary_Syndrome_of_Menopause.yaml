    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Across all samples, those from postmenopausal women had significantly lower levels of free glycogen than those from premenopausal women
    explanation: >-
      The measured glycogen difference this node asserts, in the fraction available to the
      vaginal lumen.
  - reference: PMID:25535963
    reference_title: Exploratory comparison of vaginal glycogen and Lactobacillus levels in premenopausal and postmenopausal women.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: At menopause, epithelial glycogen in the vagina is reportedly reduced
    explanation: >-
      The intraepithelial half of the claim, which the cited study itself takes from
      earlier work rather than measuring, and which it goes on to qualify. Quoted as
      BACKGROUND and graded INDIRECT for that reason.
  - reference: PMID:27577677
    reference_title: Local oestrogen for vaginal atrophy in postmenopausal women.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Vaginal atrophy is a frequent complaint of postmenopausal women; symptoms include vaginal dryness, itching, discomfort and painful intercourse."
    explanation: >-
      Establishes that the atrophic state this node describes is the common postmenopausal
      one rather than an unusual presentation. Graded INDIRECT and OTHER because the
      sentence is the review's framing of the condition, not a measurement of epithelial
      thickness.
  downstream:
  - target: Loss of Vaginal Lactobacillus Dominance and Rise in Vaginal pH
    causal_link_type: DIRECT
    description: >-
      Withdrawing free glycogen from the lumen removes the carbon source the
      lactobacillus-dominated community depends on.
    evidence:
    - reference: PMID:25535963
      reference_title: Exploratory comparison of vaginal glycogen and Lactobacillus levels in premenopausal and postmenopausal women.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: A major finding of this study is that there was a strong positive correlation between free glycogen and Lactobacillus levels in samples from both pre- and post-menopausal women
      explanation: >-
        The edge's own evidence: glycogen availability and lactobacillus abundance move
        together within each menopausal group, which is what makes the glycogen loss above
        a plausible cause of the community change below rather than a parallel
        consequence. Graded INDIRECT because a correlation within groups does not by
        itself establish the direction of the link.
  - target: Vaginal Dryness
    causal_link_type: DIRECT
    description: >-
      A thinned epithelium with reduced transudate contributes directly to the dryness
      symptom.
- name: Loss of Vaginal Lactobacillus Dominance and Rise in Vaginal pH
  biological_scale: TISSUE
  description: >-
    Lactobacilli ferment glycogen-derived sugars to lactic acid and hold the premenopausal
    vaginal lumen below pH 4.5; as the substrate is withdrawn the community thins and the
    pH rises into the high fours and above. This is the node with the weakest internal
    evidence in the entry and the description says so rather than overstating it: in the
    cited cohort both the lactobacillus difference and the pH difference between
    premenopausal and postmenopausal women were trends that did not reach significance,
    and some postmenopausal women retained substantial glycogen and lactobacilli. What
    does hold is the pH half from the opposite direction, since local estradiol
    significantly lowers vaginal pH in a placebo-controlled trial. The node is kept because
    it is the step that connects the epithelial lesion to the recurrent urinary tract
    infection phenotype, and because its reversal is a measured treatment effect.
    Contrast with bacterial vaginosis, which reaches a similar luminal state by a
    different route - the lactobacilli are displaced by anaerobes rather than starved of
    substrate - and which is this entry's main differential.
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  biological_processes:
  - preferred_term: lactic acid production by the vaginal lactobacillus community
    description: >-
      The mechanism behind the luminal pH change. GO:0006885 regulation of pH is
      deliberately not bound: the claim is about the chemistry of the vaginal lumen, not
      about a cellular homeostatic process, which is the convention the
      Bacterial_Vaginosis entry sets for the same node.
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Under normal conditions, 70-90% of the vaginal bacterial species in healthy premenopausal women are Lactobacilli
    explanation: >-
      Establishes the premenopausal baseline whose loss this node asserts. Graded INDIRECT
      because the source is about bacterial vaginosis and states the baseline as
      background rather than measuring the postmenopausal departure from it.
  - reference: PMID:25535963
    reference_title: Exploratory comparison of vaginal glycogen and Lactobacillus levels in premenopausal and postmenopausal women.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Samples from premenopausal women had higher Lactobacillus levels and lower vaginal pH (median log, 8.1; median pH, 4) than those from postmenopausal women (median log, 7.1; median pH, 4.6), although these differences were not significant."
    explanation: >-
      The direct measurement of this node in human cohorts, quoted in full including the
      clause saying the differences were not significant. It is the reason the node is
      graded INDIRECT and the reason the description says this is the entry's weakest
      step: the direction is as the mechanism predicts and the effect size is small in a
      cohort of 23 women.
  - reference: PMID:41803447
    reference_title: "Efficacy of vaginal 17β-estradiol on the urinary storage symptoms in postmenopausal women: a randomized double-blind, placebo-controlled study."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Vaginal pH significantly decreased at both time points (p < 0.001) in the intervention group.
    explanation: >-
      The pH half of this node established from the treatment side in a randomised,
      double-blind, placebo-controlled trial: restoring local estradiol significantly
      lowers vaginal pH, so the raised pH is estrogen-dependent. Graded INDIRECT because
      reversal by treatment supports the mechanism through an inference step rather than
      measuring the untreated postmenopausal change.
  downstream:
  - target: Recurrent Urinary Tract Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the acidic, lactobacillus-dominated vaginal reservoir permits periurethral
      colonization by uropathogens, with ascending colonization as the intermediate step.
- name: Reduced Urogenital Blood Flow and Secretory Lubrication
  biological_scale: TISSUE
  description: >-
    Estrogen withdrawal reduces the subepithelial vascular supply and with it the
    transudate and secretion that lubricate the vagina and vestibule. The vascular arm is
    quantified in the cited trial's account of the periurethral vessels, which contribute
    roughly a third of urethral closure pressure; the secretory arm is recorded at the
    level the consensus definition states it, as lack of lubrication, because no cited
    source here measures glandular output separately. The node is kept distinct from the
    epithelial node above because the two produce dryness and dyspareunia by different
    routes and because only one of them is reversible on the timescale of the epithelial
    maturation index.
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  biological_processes:
  - preferred_term: subepithelial blood flow in the vagina and periurethral tissue
    term:
      id: GO:0008015
      label: blood circulation
    modifier: DECREASED
  - preferred_term: vaginal and vestibular secretion contributing to lubrication
    term:
      id: GO:0070254
      label: mucus secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:41803447
    reference_title: "Efficacy of vaginal 17β-estradiol on the urinary storage symptoms in postmenopausal women: a randomized double-blind, placebo-controlled study."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Estrogens may disrupt SUI by increasing the number of periurethral vessels, which account for one-third of urethral pressure.
    explanation: >-
      The vascular arm of this node and the quantitative claim in its description:
      estrogen increases periurethral vessel number, and those vessels carry about a third
      of urethral closure pressure, so withdrawal reduces both. Quoted as BACKGROUND
      because the sentence is the trial's account of established mechanism rather than its
      own result, and graded INDIRECT because the direction is inferred from the effect of
      adding estrogen.
  - reference: PMID:25160739
    reference_title: "Genitourinary syndrome of menopause: new terminology for vulvovaginal atrophy from the International Society for the Study of Women's Sexual Health and the North American Menopause Society."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "The syndrome may include but is not limited to genital symptoms of dryness, burning, and irritation; sexual symptoms of lack of lubrication, discomfort or pain, and impaired function; and urinary symptoms of urgency, dysuria and recurrent urinary tract infections."
    explanation: >-
      The source for the secretory arm, at the level the consensus states it. It is also
      the enumeration from which this entry's phenotype set is taken.
  downstream:
  - target: Vaginal Dryness
    causal_link_type: DIRECT
    description: >-
      Reduced transudate and secretion is the proximate cause of the dryness symptom.
  - target: Dyspareunia
    causal_link_type: DIRECT
    description: >-
      Loss of lubrication during intercourse produces friction and pain at the introitus.
- name: Vaginal Wall Connective Tissue Remodelling
  biological_scale: TISSUE
  description: >-
    Estrogen governs collagen turnover in the vaginal and periurethral wall, and its
    withdrawal leaves that turnover unregulated, with loss of elasticity, narrowing and
    shortening of the vagina and reduced distensibility of the introitus. The direction of
    the collagen effect is not the simple one: in the cited placebo-controlled trial six
    months of estradiol decreased total collagen while raising matrix metalloproteinase-2
    expression and immature cross-links, which the authors read as accelerated turnover
    - aged collagen degraded and new collagen laid down - rather than net accumulation.
    This node therefore asserts loss of regulated turnover, not simply loss of collagen,
    and the entry does not claim that postmenopausal vaginal collagen content is lower
    than premenopausal.
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  biological_processes:
  - preferred_term: estrogen-regulated collagen turnover in the vaginal and periurethral wall
    term:
      id: GO:0032963
      label: collagen metabolic process
    modifier: DYSREGULATED
  - preferred_term: organization of the vaginal wall extracellular matrix
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:11950190
    reference_title: The effect of oestradiol on vaginal collagen metabolism in postmenopausal women with genuine stress incontinence.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Six months treatment with oestrogen has profound effects upon pelvic collagen metabolism, stimulating collagen degradation via increased proteinase activity.
    explanation: >-
      Establishes that estrogen is an active regulator of collagen metabolism in this
      tissue, which is what makes its withdrawal a dysregulation claim. Graded INDIRECT
      because the trial measured the effect of restoring estrogen in postmenopausal women
      rather than the untreated postmenopausal state.
  - reference: PMID:11950190
    reference_title: The effect of oestradiol on vaginal collagen metabolism in postmenopausal women with genuine stress incontinence.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Collagen loss contradicts previous reports; perhaps aged collagen degradation is merely an early response to oestrogen stimulation.
    explanation: >-
      Recorded as REFUTE against the simpler claim that estrogen withdrawal lowers vaginal
      collagen content, which this entry therefore does not make. The authors' own reading
      of their result is that estrogen reduced total collagen, which is the opposite sign
      from what a straightforward deficiency model predicts.
  downstream:
  - target: Dyspareunia
    causal_link_type: DIRECT
    description: >-
      Loss of elasticity and distensibility at the introitus and vaginal wall contributes
      to pain on penetration independently of lubrication.
- name: Urethral and Trigonal Mucosal Atrophy
  biological_scale: TISSUE
  description: >-
    The urethral and trigonal transitional epithelium shares the urogenital sinus origin
    and the estrogen receptor of the vaginal epithelium and atrophies with it, which is
    the structural basis of the syndrome's urinary arm. The measurable index is urethral
    maturation, the urethral counterpart of the vaginal maturation index, and local
    estradiol raises it within four weeks. Whether that structural change translates into
    symptom relief is a separate question and the cited trial answers it only partly: its
    primary storage-symptom endpoint was negative at twelve weeks while urgency incontinence
    improved at both time points, so this node is better supported structurally than
    symptomatically.
  cell_types:
  - preferred_term: urothelial cell of urethra and bladder trigone
    term:
      id: CL:0000731
      label: urothelial cell
  locations:
  - preferred_term: urethra
    term:
      id: UBERON:0000057
      label: urethra
  biological_processes:
  - preferred_term: proliferation and maturation of the urethral transitional epithelium
    term:
      id: GO:0050673
      label: epithelial cell proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:41803447
    reference_title: "Efficacy of vaginal 17β-estradiol on the urinary storage symptoms in postmenopausal women: a randomized double-blind, placebo-controlled study."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Urethral maturation index (UMI) improved at 4 weeks (p < 0.001) and remained higher than the placebo group at 12 weeks (p = 0.007).
    explanation: >-
      The structural claim of this node, established from the treatment side: restoring
      local estradiol significantly raises the urethral maturation index against placebo
      and keeps it raised, so the low index of the untreated postmenopausal urethra is
      estrogen-dependent. Graded INDIRECT because reversal by treatment is one inference
      step from the untreated lesion.
  - reference: PMID:41803447
    reference_title: "Efficacy of vaginal 17β-estradiol on the urinary storage symptoms in postmenopausal women: a randomized double-blind, placebo-controlled study."
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: The primary outcome, improvement in storage symptoms assessed using ICIQ-FLUTS, showed no significant difference between groups at 12 weeks
    explanation: >-
      Recorded against the stronger claim that reversing this node's structural lesion
      relieves storage symptoms generally. The trial's primary endpoint was negative, which
      is why the node's description separates the structural from the symptomatic claim.
  downstream:
  - target: Urinary Urgency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Atrophy of the urethral and trigonal mucosa lowers the sensory threshold of the
      lower urinary tract, with altered afferent signalling as the intermediate step.
  - target: Dysuria
    causal_link_type: DIRECT
    description: >-
      A thinned, fragile urethral mucosa produces pain on voiding.
  - target: Recurrent Urinary Tract Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of urethral mucosal barrier function contributes to uropathogen ascent
      alongside the vaginal reservoir change.
phenotypes:
- category: Genitourinary
  name: Vaginal Dryness
  description: >-
    The commonest and most characteristic symptom of the syndrome, reached by two routes in
    this entry's graph: the thinned epithelium with reduced transudate, and the reduced
    vascular and secretory supply.

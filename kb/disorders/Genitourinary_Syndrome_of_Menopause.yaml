name: Genitourinary Syndrome of Menopause
creation_date: '2026-11-14T00:00:00Z'
category: Endocrine
synonyms:
- GSM
- vulvovaginal atrophy
- atrophic vaginitis
- postmenopausal atrophic vaginitis
- urogenital atrophy
description: >-
  The syndrome of genital, sexual and lower urinary tract signs and symptoms produced by
  withdrawal of estrogen and other sex steroids from the urogenital tract. One hormonal
  change acts simultaneously on four substrates that share an estrogen receptor:
  the stratified squamous epithelium of the vagina and vestibule, which thins and stops
  storing glycogen; the lactobacillus-dominated luminal community that depends on that
  glycogen, whose loss lets vaginal pH rise; the subepithelial vasculature and the
  secretory supply that produce lubrication; and the collagen and elastin of the vaginal
  and periurethral wall. The urethral and trigonal mucosa shares the same embryologic
  origin and the same receptor, which is why urinary urgency, dysuria and recurrent
  urinary tract infection belong in the same entry as dryness and dyspareunia rather than
  being separate diagnoses. The entry is the field's own unit: the 2014 ISSWSH/NAMS
  consensus replaced "vulvovaginal atrophy" with this name precisely to put the urinary
  component inside the syndrome, and the 2025 AUA/SUFU/AUGS guideline uses it. Unlike the
  vasomotor arm, the syndrome does not remit with time on the low-estrogen state; local
  low-dose vaginal estrogen is its treatment with the most robust evidence base.
disease_term:
  preferred_term: genitourinary syndrome of menopause
  description: >-
    MONDO has no class under this name, so the entry anchors the nearest class,
    postmenopausal atrophic vaginitis, which is narrower than the entry. See
    mappings.mondo_mappings for the direction of that relationship and notes for what is
    missing from MONDO.
  term:
    id: MONDO:0001410
    label: postmenopausal atrophic vaginitis
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0001410
      label: postmenopausal atrophic vaginitis
    mapping_predicate: skos:narrowMatch
    mapping_source: manual curation
    mapping_justification: >-
      Recorded because the entry anchors a class narrower than itself, which design
      decisions section 19 names as the case here and section 3a's convention covers in
      the opposite direction. SKOS predicates read subject to object with the entry as
      subject, so the mapped class is recorded as narrowMatch, not broadMatch: this entry
      covers the vulva, clitoris, vestibule, urethra and bladder as well as the vagina,
      while MONDO:0001410 is defined as "Inflammation of the vagina due to thinning of
      the vaginal wall and decreased lubrication associated with reduced estrogen levels
      at menopause" and so covers only the vaginal component. Every case of
      MONDO:0001410 is in scope of this entry; the converse does not hold, so the
      mapping retires MONDO:0001410 from the curation queue and the entry's own concept
      remains unrepresented in MONDO.
  icd10cm_mappings:
  - term:
      id: ICD10CM:N95.2
      label: Postmenopausal atrophic vaginitis
    mapping_predicate: skos:narrowMatch
    mapping_source: manual curation
    mapping_justification: >-
      The ICD-10-CM code MONDO records as an exact match of MONDO:0001410, and narrower
      than this entry for the same reason: it names the vaginal component only, and
      ICD-10-CM has no code for the syndrome. The urinary component of this entry is
      coded separately in ICD-10-CM (urgency, dysuria and recurrent cystitis each have
      their own code), which is the coding consequence of the syndrome name the 2014
      consensus introduced.

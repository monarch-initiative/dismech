diagnosis:
- name: Symptom-Based Clinical Diagnosis
  description: >-
    The syndrome is diagnosed from its symptoms, with or without physical findings, after
    other causes have been excluded; there is no agreed count or combination of symptoms
    that defines it and no laboratory or imaging criterion. The exclusion step is what makes
    the differential diagnoses below part of the diagnostic procedure rather than
    background.
  evidence:
  - reference: PMID:40298120
    reference_title: The AUA/SUFU/AUGS Guideline on Genitourinary Syndrome of Menopause.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Clinicians diagnose GSM based on symptoms, with or without related physical findings, and after ruling out other etiologies or co-occurring pathologies."
    explanation: >-
      The guideline's diagnostic statement, including the exclusion requirement.
  - reference: PMID:40298120
    reference_title: The AUA/SUFU/AUGS Guideline on Genitourinary Syndrome of Menopause.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "There has not been a consensus reached about the number or type of symptoms needed to diagnose GSM, and the associated urinary symptoms are also linked with other common urologic conditions such as overactive bladder."
    explanation: >-
      Records that the diagnostic criteria are unsettled and names the specific overlap -
      overactive bladder - that makes the urinary arm hardest to attribute.
differential_diagnoses:
- name: Bacterial Vaginosis
  disease_term:
    preferred_term: bacterial vaginosis
    term:
      id: MONDO:0005316
      label: bacterial vaginosis
  description: >-
    The two conditions share a luminal endpoint - loss of lactobacillus dominance and a
    vaginal pH above 4.5 - and reach it by different routes. In this entry the lactobacilli
    are starved of the epithelial glycogen that estrogen maintains; in bacterial vaginosis
    they are displaced by an anaerobic polymicrobial community, with a Gardnerella-dominated
    adherent biofilm. A raised vaginal pH therefore does not distinguish them, and the
    conditions can coexist in a postmenopausal woman.
  distinguishing_features:
  - >-
    Bacterial vaginosis produces a thin homogeneous malodorous discharge and clue cells and
    meets the Amsel criteria; the genitourinary syndrome of menopause produces dryness,
    a pale thin epithelium and reduced lubrication with no discharge or odour. Bacterial
    vaginosis responds to antimicrobial therapy and recurs; this syndrome responds to local
    estrogen and does not remit spontaneously.
  evidence:
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "BV is the result of a disturbance in the vaginal ecosystem; i.e., a sudden replacement of Lactobacilli by anaerobic bacteria such as Gardnerella vaginalis, Atopobium vaginae, Ureaplasma urealyticum, Mycoplasma hominis, and others."
    explanation: >-
      States the alternative route to the shared luminal state - displacement by anaerobes
      rather than substrate withdrawal - which is the mechanistic basis for the
      differential.
- name: Overactive Bladder
  description: >-
    Named by the AUA/SUFU/AUGS guideline as the condition the urinary arm of this syndrome
    is hardest to separate from, because urgency, frequency and urgency incontinence are
    the defining symptoms of both. The guideline does not resolve the overlap and the
    entry does not either; it is recorded because the diagnosis of this syndrome requires
    ruling other causes out, and this is the one that most often remains.
  distinguishing_features:
  - >-
    Genital signs - a pale thin vaginal epithelium, reduced lubrication, a raised vaginal
    pH and a low urethral maturation index - accompany the urinary symptoms in this
    syndrome and not in idiopathic overactive bladder, and the urinary symptoms respond at
    least partly to local estrogen. No test separates them, and the two can coexist.
  evidence:
  - reference: PMID:40298120
    reference_title: The AUA/SUFU/AUGS Guideline on Genitourinary Syndrome of Menopause.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "There has not been a consensus reached about the number or type of symptoms needed to diagnose GSM, and the associated urinary symptoms are also linked with other common urologic conditions such as overactive bladder."
    explanation: >-
      The guideline names overactive bladder as the specific competing attribution for the
      urinary symptoms, which is why it is recorded as a differential.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    No numeric estimate is recorded. The most recent review of the question reports a wide
    range of estimates across studies and attributes the spread to differences in
    population, study design and data collection rather than to real variation, and the
    diagnostic criteria the estimates rest on are themselves unsettled. The class is set to
    COMMON, which presupposes no numeric estimate, and measure_type to UNKNOWN because the
    sources quoted do not say which measure they report.
  evidence:
  - reference: PMID:38126336
    reference_title: "Genitourinary Syndrome of Menopause: Prevalence and Predictors."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Within recent literature, we found a wide range of prevalence estimates, likely a function of the differing populations studied, study design, and methods of data collection."
    explanation: >-
      The reason this record carries a class and no rate: the review's own finding is that
      the published estimates are not comparable.
  - reference: PMID:38126336
    reference_title: "Genitourinary Syndrome of Menopause: Prevalence and Predictors."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Factors related to the prevalence of GSM included age and aging; reproductive aging stage; hormones, especially estrogen; and culture and language."
    explanation: >-
      Names reproductive aging stage and estrogen among the determinants of prevalence,
      which is consistent with the entry's causal model, and names culture and language,
      which is a determinant of reporting rather than of occurrence.
discussions:
- discussion_id: gsm_urinary_arm_attribution
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the urinary arm of the genitourinary syndrome of menopause is attributable
    to estrogen withdrawal, as against coexisting idiopathic overactive bladder and
    age-related change in the lower urinary tract?
  rationale: >-
    The entry's urinary nodes are better supported structurally than symptomatically. Local
    estradiol reliably raises the urethral maturation index and lowers vaginal pH, but the
    trial that measured both missed its primary storage-symptom endpoint, improved urgency
    only transiently, and improved urgency incontinence throughout. The AUA/SUFU/AUGS
    guideline records that no consensus exists on which symptoms define the syndrome and
    that the urinary symptoms are shared with overactive bladder. Until the attribution is
    settled, the size of the estrogen-dependent fraction of the urinary burden is unknown,
    and so is whether the structural reversal is on the causal path to the symptom relief
    that is observed.
  attaches_to:
  - pathophysiology#Urethral and Trigonal Mucosal Atrophy
  - phenotypes#Urinary Urgency
- discussion_id: gsm_glycogen_microbiome_uti_route
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the rise in vaginal pH after menopause caused by withdrawal of epithelial glycogen,
    and is the resulting community change on the causal path to recurrent urinary tract
    infection?
  rationale: >-
    The glycogen-to-lactobacillus-to-pH chain is the entry's weakest step and the cited
    study is candid about why: free glycogen was significantly lower in postmenopausal
    women and correlated with lactobacillus abundance within each group, but the
    lactobacillus and pH differences between groups were not significant in a cohort of 23
    women, some postmenopausal women retained substantial glycogen and lactobacilli, and
    estrogen level did not predict glycogen within the premenopausal group. The treatment
    side is stronger - local estradiol significantly lowers vaginal pH, and vaginal estrogen
    prevents recurrent urinary tract infection - but neither trial measured the microbial
    intermediate, so the proposed route from glycogen to infection is inferred rather than
    traced.
  attaches_to:
  - pathophysiology#Loss of Vaginal Lactobacillus Dominance and Rise in Vaginal pH
  - phenotypes#Recurrent Urinary Tract Infection
notes: >-
  Anchoring. MONDO has no class for this syndrome: searches of MONDO through OLS on
  2026-11-14 for "genitourinary syndrome of menopause", "vulvovaginal atrophy" and
  "urogenital atrophy" return nothing matching (the third returns three unrelated
  malformation syndromes whose definitions contain the words). The nearest class is
  MONDO:0001410 postmenopausal atrophic vaginitis, which is narrower than this entry
  because it is defined as inflammation of the vagina and so excludes the vulvar,
  clitoral, vestibular, urethral and bladder components the 2014 consensus brought inside
  the syndrome. Following design decisions section 19, which names MONDO:0001410 as the
  nearest and narrower anchor and section 3a's parent-anchoring convention as the model,
  the entry binds that class as its disease_term and records the relationship explicitly in
  mappings.mondo_mappings. The direction is the reverse of section 3a's own case: there a
  stratum anchors a broader parent and records skos:broadMatch, here the entry anchors a
  narrower class and records skos:narrowMatch, because SKOS predicates read subject to
  object with the entry as subject. A MONDO term request for the syndrome, as a parent of
  MONDO:0001410 and a sibling of the lower urinary tract classes, is what would resolve
  this properly; it has not been filed.

  Naming. The entry is named for the syndrome rather than for the anchored class. The
  2014 ISSWSH/NAMS consensus (PMID:25160739) replaced "vulvovaginal atrophy" with
  "genitourinary syndrome of menopause" on the grounds that the older name is neither
  accurate nor complete, and the 2025 AUA/SUFU/AUGS guideline (PMID:40298120) uses the
  new name throughout. Both older names, and the MONDO and ICD-10-CM labels, are kept in
  synonyms. "Postmenopausal Atrophic Vaginitis" was rejected as an entry name because it
  is narrower than the entry's content: an entry named for vaginal inflammation would not
  cover the urethral and bladder nodes and phenotypes curated here.

  ICD-11. No ICD-11 Foundation entity is asserted. The WHO ICD-11 API requires an OAuth2
  client credential and returns HTTP 401 without one; cache/icd11f/terms.csv holds 24
  rows and none is menopause-related; and the icd11f build the term validator would need
  is outside this session's disk budget. ICD-10-CM was reachable instead: the N95 block
  was read from the NLM Clinical Table Search Service and the two codes used here were
  resolved against the local ICD-10-CM build, which gives N95.1 "Menopausal and female
  climacteric states" and N95.2 "Postmenopausal atrophic vaginitis", both under N95
  "Menopausal and other perimenopausal disorders".

  GeneReviews. No chapter covers this syndrome, and none is expected: it is an acquired
  endocrine condition with no Mendelian basis. `just check-genereviews` reports
  NO_CHAPTER against the entry's name, synonyms and disease_term. StatPearls carries
  chapters titled "Genitourinary Syndrome of Menopause" (PMID:32644723) and "Atrophic
  Vaginitis" (PMID:33232011); neither is cited, because StatPearls is a point-of-care
  reference and never a phenotype baseline. The phenotype set here is taken instead from
  the 2014 ISSWSH/NAMS consensus definition's own enumeration of the syndrome's genital,
  sexual and urinary symptoms.

  Conformance. Two nodes conform to menopausal_estrogen_withdrawal, at the systemic and
  receptor nodes, which are the two the module names as its conformance targets. The
  module ends at the receptor by design, so everything below the receptor node here - the
  epithelial, microbial, vascular, connective-tissue and urethral arms - is this entry's
  own and is not duplicated from the module. The module's hypothalamic KNDy arm is not
  conformed to, because nothing in this syndrome runs through it; that arm belongs to the
  vasomotor entry.

  Androgen. The consensus definition and the AUA guideline both name androgen withdrawal
  beside estrogen, and the vestibule and periurethral stroma are androgen-responsive. No
  node separates the androgen arm, because no source cited here attributes a specific
  urogenital lesion to androgen withdrawal on its own. Intravaginal dehydroepiandrosterone
  (prasterone) is an approved treatment for dyspareunia in this syndrome and is not
  curated, for the same reason: it would need its own evidence, which this pass did not
  gather.

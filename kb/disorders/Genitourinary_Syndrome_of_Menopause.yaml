pathophysiology:
- name: Systemic Estradiol Withdrawal
  biological_scale: ORGANISM
  conforms_to: menopausal_estrogen_withdrawal#Systemic Estradiol Withdrawal
  description: >-
    Circulating estradiol falls to a postmenopausal range and stays there. The node is the
    systemic hormonal state and is the entry's root: it is the same fall whichever
    urogenital tissue is being considered, and it is entered by the same routes the module
    describes - follicle-pool exhaustion in natural menopause, bilateral oophorectomy, or
    gonadotoxic chemotherapy or pelvic radiation. Androgen withdrawal accompanies it and
    the consensus definition names "estrogen and other sex steroids" rather than estrogen
    alone, which matters for the two tissues (vestibule, periurethral stroma) where
    androgen receptor density is high; this entry does not separate the two hormones into
    distinct nodes because no cited source attributes a specific urogenital lesion to the
    androgen arm on its own.
  biological_processes:
  - preferred_term: fall in circulating estradiol to a postmenopausal range
    term:
      id: GO:0010817
      label: regulation of hormone levels
    modifier: DECREASED
  evidence:
  - reference: PMID:25160739
    reference_title: "Genitourinary syndrome of menopause: new terminology for vulvovaginal atrophy from the International Society for the Study of Women's Sexual Health and the North American Menopause Society."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: GSM is defined as a collection of symptoms and signs associated with a decrease in estrogen and other sex steroids involving changes to the labia majora/minora, clitoris, vestibule/introitus, vagina, urethra and bladder.
    explanation: >-
      The consensus definition makes the fall in sex steroids the defining cause of the
      syndrome and names every tissue the downstream nodes cover, which is why this node
      is the entry's root rather than an upstream risk factor. Graded OTHER because a
      terminology consensus statement reports expert agreement rather than a study.
  - reference: PMID:40298120
    reference_title: The AUA/SUFU/AUGS Guideline on Genitourinary Syndrome of Menopause.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Genitourinary syndrome of menopause (GSM) describes the symptoms and physical changes that result from declining estrogen and androgen concentrations in the genitourinary tract during the menopausal transition.
    explanation: >-
      A second, independently developed guideline statement of the same causal claim, and
      the source for naming androgen beside estrogen in this node's description.
  downstream:
  - target: Loss of Urogenital Estrogen Receptor Signalling
    causal_link_type: DIRECT
    description: >-
      Falling circulating estradiol removes receptor occupancy in the urogenital epithelium,
      stroma and vasculature.
- name: Loss of Urogenital Estrogen Receptor Signalling
  biological_scale: CELLULAR
  conforms_to: menopausal_estrogen_withdrawal#Loss of Estrogen Receptor Signalling in the Target Tissue
  description: >-
    The module's tissue-agnostic receptor node, instantiated in the urogenital tract. The
    substitution the primer asks for is made here: the responsive populations are the
    stratified squamous epithelium of the vagina and vestibule and the transitional
    epithelium of the urethra and bladder trigone, together with the subepithelial stroma
    and vasculature they sit on. Both receptor paralogues are present in human vaginal
    tissue and both are expressed at their highest level before menopause, so the lost
    signal is not attributable to one isoform; in mouse urogenital tissue the alpha
    transcript is concentrated in the vagina rather than in the upper urinary tract, which
    is consistent with the vaginal lesion being the more severe of the two. The receptors
    themselves are intact, so the activity is reduced rather than absent.
  cell_types:
  - preferred_term: vaginal squamous epithelial cell
    term:
      id: CL:1001578
      label: vagina squamous cell
  - preferred_term: urothelial cell of urethra and bladder trigone
    description: >-
      The second responsive population, named because the urinary arm of the syndrome
      runs through it. Bound at the general urothelial level because the cited sources
      locate estrogen receptors in the bladder and urethra without resolving a
      trigone-specific cell type.
    term:
      id: CL:0000731
      label: urothelial cell

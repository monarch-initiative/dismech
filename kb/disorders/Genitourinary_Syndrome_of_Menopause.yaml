treatments:
- name: Local Low-Dose Vaginal Estrogen
  description: >-
    Estradiol or estriol delivered into the vagina as a tablet, cream, gel, pessary or
    slow-release ring, at doses chosen to restore receptor occupancy in the urogenital
    tissue without a systemic effect. It is the treatment with the most robust evidence
    base in the syndrome and it acts at the receptor node, so every downstream arm of the
    entry is in principle reversible by it; the Cochrane review found no efficacy
    difference between the preparations, and oestrogen cream was associated with a greater
    increase in endometrial thickness than the ring, which the reviewers attribute to the
    higher doses used in the cream arms.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: local low-dose vaginal estrogen therapy
    term:
      id: NCIT:C15483
      label: Estrogen Therapy
    therapeutic_agent:
    - preferred_term: 17beta-estradiol
      term:
        id: CHEBI:16469
        label: 17beta-estradiol
    - preferred_term: estriol
      term:
        id: CHEBI:27974
        label: estriol
  target_mechanisms:
  - target: Loss of Urogenital Estrogen Receptor Signalling
    treatment_effect: RESTORES
    description: >-
      The drug replaces the withdrawn ligand at the receptor node itself, which is why its
      measured effects appear in the epithelial, microbial, vascular and urethral arms
      alike.
  target_phenotypes:
  - preferred_term: Vaginal dryness
    term:
      id: HP:0031088
      label: Vaginal dryness
  - preferred_term: Dyspareunia
    term:
      id: HP:0030016
      label: Dyspareunia
  evidence:
  - reference: PMID:27577677
    reference_title: Local oestrogen for vaginal atrophy in postmenopausal women.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: However, there was low-quality evidence that intra-vaginal oestrogenic preparations improve the symptoms of vaginal atrophy in postmenopausal women when compared to placebo.
    explanation: >-
      The pooled efficacy claim, quoted with the reviewers' own grading of the evidence as
      low quality across 30 randomised trials in 6235 women.
  - reference: PMID:27577677
    reference_title: Local oestrogen for vaginal atrophy in postmenopausal women.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence of a difference in efficacy between the various intravaginal oestrogenic preparations when compared with each other."
    explanation: >-
      Supports treating the preparations as one treatment row rather than several, which is
      how this entry curates them.
  - reference: PMID:40298120
    reference_title: The AUA/SUFU/AUGS Guideline on Genitourinary Syndrome of Menopause.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "There is a large body of evidence examining the use of hormonal and non-hormonal treatment options to manage the symptoms of GSM; however, the local low-dose vaginal estrogen has the most robust evidence base."
    explanation: >-
      The guideline's own ranking of this treatment against the alternatives, which is the
      basis for curating it as the entry's primary therapy.
  - reference: PMID:41803447
    reference_title: "Efficacy of vaginal 17β-estradiol on the urinary storage symptoms in postmenopausal women: a randomized double-blind, placebo-controlled study."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Urgency urinary incontinence (UUI) showed a consistent benefit, with significant improvement at both 4 and 12 weeks (p = 0.013).
    explanation: >-
      The one urinary symptom endpoint that improved and stayed improved in a trial whose
      primary storage-symptom endpoint was negative. Graded INDIRECT because it is a

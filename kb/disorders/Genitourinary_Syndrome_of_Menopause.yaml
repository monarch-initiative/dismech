- category: Genitourinary
  name: Vulvovaginal Burning and Irritation
  description: >-
    Burning and irritation of the vulva and vagina, named in the consensus definition
    alongside dryness and deliberately left unbound, because HPO has no term for it.
    Searched OLS on 2026-11-14. HP "vulvar" returns 17 terms: six neoplastic, plus vulvar
    abscess, vulvodynia, pruritus vulvae, abnormal vulvar morphology, three labial terms,
    Bartholin cyst, persistent HPV infection and recurrent bacterial vaginosis. HP
    "burning" returns 65 terms including site-specific ones for other sites - HP:0032143
    Burning mouth and HP:6000420 Burning eye sensation - and none for the vulva or
    vagina. HP "irritation" returns irritability and site-specific inflammations only.
    The nearest candidates are therefore HP:0030943 Vulvodynia, defined as "Pain in the
    vulvar area", and HP:0032004 Pruritus vulvae, "A sensation of itching in the vulvar
    region". Binding Vulvodynia would assert a distinct chronic idiopathic vulvar pain
    entity, and Pruritus vulvae would substitute itching for burning, so the phenotype
    carries a free-text preferred term and no binding. HPO's existing Burning mouth and
    Burning eye sensation terms are the pattern a term request for this one would
    follow.

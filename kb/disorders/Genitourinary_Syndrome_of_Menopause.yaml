    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Genitourinary syndrome of menopause (GSM) describes the symptoms and physical changes that result from declining estrogen and androgen concentrations in the genitourinary tract during the menopausal transition.
    explanation: >-

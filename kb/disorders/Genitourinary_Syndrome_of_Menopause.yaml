environmental:
- name: Estrogen Deficiency
  description: >-
    The hormonal state that drives the entry, recorded as an exposure record with the
    direction reversed, following the convention design decisions section 19 sets for a
    menopause fact of this kind: bind the hormonal state rather than the life stage,
    because ECTO has no menopause term and the stage is not an exposure. The same record
    covers iatrogenic withdrawal - bilateral oophorectomy, gonadotoxic chemotherapy, pelvic
    radiation, and the aromatase inhibitors and gonadotropin-releasing hormone agonists
    used in breast cancer treatment, in which the syndrome is a recognised and often
    severe consequence.

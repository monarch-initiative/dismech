  description: >-
    First-line standard of care for HER2-positive metastatic gastric cancer. The
    phase 3 ToGA trial demonstrated improved overall survival when intravenous
    trastuzumab was added to cisplatin plus capecitabine or 5-fluorouracil
    chemotherapy.

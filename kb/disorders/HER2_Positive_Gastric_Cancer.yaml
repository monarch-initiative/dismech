mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005036
      label: gastric adenocarcinoma
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      HER2-positive gastric adenocarcinoma is a molecularly defined stratum of
      MONDO's gastric adenocarcinoma class, not the full class itself: MONDO has
      no distinct term for the HER2-positive stratum, so disease_term anchors to
      the broader parent class MONDO:0005036 while skos:broadMatch records
      subject-to-object that this entry is narrower than the broader MONDO
      target. MONDO:0001056 (gastric cancer) is not used because it is the
      organ-level class that also encompasses gastric lymphomas and sarcomas.
      The parent class MONDO:0005036 itself is claimed as skos:exactMatch by
      Gastric_Adenocarcinoma.


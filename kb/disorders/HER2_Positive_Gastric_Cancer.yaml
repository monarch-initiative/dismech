  evidence:
  - reference: PMID:20728210
    reference_title: "Trastuzumab in combination with chemotherapy versus chemotherapy alone for treatment of HER2-positive advanced gastric or gastro-oesophageal junction cancer (ToGA): a phase 3, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median overall survival was 13.8 months (95% CI 12-16) in those assigned to
      trastuzumab plus chemotherapy compared with 11.1 months (10-13) in those
      assigned to chemotherapy alone (hazard ratio 0.74; 95% CI 0.60-0.91;
      p=0.0046).
    explanation: >-
      The phase 3 ToGA trial showed adding trastuzumab to cisplatin/fluoropyrimidine
      chemotherapy significantly prolonged overall survival in HER2-positive
      advanced gastric/GEJ cancer, establishing it as first-line standard of care.
- name: Trastuzumab Deruxtecan (T-DXd)
  description: >-
    Antibody-drug conjugate linking an anti-HER2 monoclonal antibody to a
    topoisomerase I inhibitor payload. DESTINY-Gastric01 demonstrated superior
    overall survival compared to chemotherapy in previously treated
    HER2-positive gastric cancer, with membrane-permeable bystander activity
    across tumors with heterogeneous HER2 expression.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy

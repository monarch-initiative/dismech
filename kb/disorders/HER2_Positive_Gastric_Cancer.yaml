  evidence:
  - reference: PMID:32469182
    reference_title: Trastuzumab Deruxtecan in Previously Treated HER2-Positive Gastric Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An objective response was reported in 51% of the patients in the trastuzumab
      deruxtecan group, as compared with 14% of those in the physician's choice
      group (P<0.001). Overall survival was longer with trastuzumab deruxtecan
      than with chemotherapy (median, 12.5 vs. 8.4 months; hazard ratio for death,
      0.59
    explanation: >-
      DESTINY-Gastric01 showed the anti-HER2 antibody-drug conjugate T-DXd more
      than tripled objective response and prolonged overall survival versus
      chemotherapy in previously treated HER2-positive gastric cancer.

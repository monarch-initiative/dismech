biochemical:
- name: HER2 Immunohistochemistry
  loinc_term:
    id: LOINC:18474-7
    label: HER2 Ag [Presence] in Tissue by Immune stain
  notes: >-
    IHC scoring criteria differ from breast cancer due to heterogeneous staining and
    basolateral membrane patterns in gastric cancer. Scoring: 0 (negative), 1+ (faint),
    2+ (weak to moderate complete/basolateral staining in 10% or more of cells - requires
    ISH confirmation), 3+ (strong complete/basolateral staining in 10% or more - positive).
    Bound the tissue-generic IHC presence code: this row's own text states
    that "IHC scoring criteria differ from breast cancer due to
    heterogeneous staining and basolateral membrane patterns in gastric
    cancer," so a code whose own label names a breast specimen would
    misstate the specimen this row is about. No `interpretation_bands` are
    recorded for the 0/1+/2+/3+ scoring criteria stated above: this row
    carries no citation, and LOINC has no distinct ordinal-score code for
    the IHC grading in any specimen.
- name: HER2 In Situ Hybridization
  loinc_term:
    id: LOINC:49683-6
    label: ERBB2 gene copy number/Chromosome 17 copy number in Tissue by FISH
  notes: >-
    FISH or other ISH methods assess HER2/CEP17 ratio. Ratio greater than 2.0 is positive.
    Required for IHC 2+ (equivocal) cases. Intratumoral heterogeneity is more common
    in
    gastric than breast cancer.
    Bound the tissue-generic FISH ratio code: its own LOINC label names
    "Tissue" rather than a specific organ, so it is not the breast-specimen
    trap the IHC code above is. No `interpretation_bands` are recorded for
    the "ratio greater than 2.0" cutoff stated above: this row carries no
    citation for it.
diagnosis:
- name: HER2 Immunohistochemistry
  diagnosis_term:
    preferred_term: Immunohistochemistry Staining Method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  description: >-
    First-line tissue biomarker assay on endoscopic biopsy or surgical resection
    specimens to evaluate membranous HER2 protein expression using
    gastric-specific scoring (complete, basolateral, or lateral reactivity; 3+
    is positive, 0/1+ is negative, and 2+ is equivocal requiring reflex ISH).
    Multiple biopsy fragments are recommended to mitigate intratumoral
    heterogeneity.
  evidence:
  - reference: PMID:20728210
    reference_title: "Trastuzumab in combination with chemotherapy versus chemotherapy alone for treatment of HER2-positive advanced gastric or gastro-oesophageal junction cancer (ToGA): a phase 3, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with gastric or gastro-oesophageal junction cancer were eligible for inclusion if their tumours showed overexpression of HER2 protein by immunohistochemistry or gene amplification by fluorescence in-situ hybridisation."
    explanation: >-
      Establishes HER2 immunohistochemistry as a primary eligibility and
      diagnostic biomarker assay for HER2-positive gastric/GEJ cancer.
  - reference: DOI:10.1200/jco.2016.69.4836
    reference_title: "<i>HER2</i> Testing and Clinical Decision Making in Gastroesophageal Adenocarcinoma: Guideline From the College of American Pathologists, American Society for Clinical Pathology, and the American Society of Clinical Oncology"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The Panel recommends that tumor specimen(s) from all patients with advanced GEA, who are candidates for HER2-targeted therapy, should be assessed for HER2 status before the initiation of HER2-targeted therapy."
    explanation: >-
      CAP/ASCP/ASCO guideline mandates tissue HER2 testing prior to initiating
      HER2-directed therapy in advanced gastroesophageal adenocarcinoma.
- name: HER2 Fluorescence In Situ Hybridization
  diagnosis_term:
    preferred_term: Fluorescence In Situ Hybridization
    term:
      id: NCIT:C17563
      label: Fluorescence In Situ Hybridization
  description: >-
    Reflex or confirmatory in situ hybridization assay quantifying ERBB2 gene
    amplification (typically HER2:CEP17 ratio > 2.0), mandatory when HER2 IHC
    is equivocal (2+).
  evidence:
  - reference: PMID:24260051
    reference_title: "HER2 status in advanced gastric carcinoma: A retrospective multicentric analysis from Sicily."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the cases that were considered equivocal (2+) were further assessed using the FISH test (pharmDx; Dako) in three reference laboratories. Gene amplification was recorded when the HER2:CEP17 signal ratio was >2.0."
    explanation: >-
      Documents reflex FISH testing of IHC 2+ gastric adenocarcinomas with the
      HER2:CEP17 > 2.0 amplification threshold.
- name: Upper Gastrointestinal Endoscopic Biopsy
  diagnosis_term:
    preferred_term: Endoscopic Biopsy
    term:
      id: NCIT:C15389
      label: Endoscopic Biopsy
  description: >-
    Gastroscopic direct visualization and multi-fragment mucosal biopsy to
    establish histologic diagnosis of gastric adenocarcinoma and provide
    representative neoplastic tissue for HER2 biomarker assessment.
  evidence:
  - reference: PMID:23564704
    reference_title: "HER2 amplification in gastric cancer is a rare event restricted to the intestinal phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only endoscopic biopsies were available in 97 patients and HER2 IHC expression was 0 in 88, 1+ in 3, 2+ in 4, and 3+ in 2 patients."
    explanation: >-
      Demonstrates diagnostic use of endoscopic biopsy specimens for histologic
      confirmation and HER2 immunohistochemical evaluation.

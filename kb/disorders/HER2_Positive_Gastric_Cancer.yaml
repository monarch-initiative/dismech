- name: MAPK Pathway Activation
  biological_scale: MOLECULAR
  description: >-
    HER2 receptor activation recruits GRB2/SOS adaptor proteins, activating RAS
    and the downstream MAPK cascade to drive transcription of pro-proliferative
    genes.
  cell_types:
  - preferred_term: epithelial cell of stomach
    term:

histopathology:
- name: Gastric Adenocarcinoma
  finding_term:
    preferred_term: Gastric Adenocarcinoma
    term:
      id: NCIT:C4004
      label: Gastric Adenocarcinoma
  frequency: VERY_FREQUENT
  description: Adenocarcinoma is the most common histologic type of gastric cancer.
  evidence:
  - reference: PMID:40647518
    reference_title: "A Histopathological and Surgical Analysis of Gastric Cancer: A Two-Year Experience in a Single Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study involved 67 patients (mean age 65.7 years, 56.7% men), with adenocarcinoma being the most common histologic type (91.0%) and most tumors being diagnosed directly as Stage III (40.3%)."
    explanation: Establishes adenocarcinoma as the predominant histologic type (91.0%) in a surgical gastric cancer cohort.
- name: Intestinal-Type Adenocarcinoma
  finding_term:
    preferred_term: Gastric Intestinal-Type Adenocarcinoma
    term:
      id: NCIT:C9157
      label: Gastric Intestinal-Type Adenocarcinoma
  frequency: VERY_FREQUENT
  description: >-
    HER2 amplification/positivity in gastric cancer is strongly enriched in, and
    largely restricted to, the intestinal (Lauren) histologic phenotype.
  evidence:
  - reference: PMID:23564704
    reference_title: "HER2 amplification in gastric cancer is a rare event restricted to the intestinal phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amplified tumors were intestinal adenocarcinomas located throughout the different regions of the stomach."
    explanation: >-
      In this cohort, HER2-amplified gastric tumors were intestinal-type
      adenocarcinomas, tying HER2 positivity to the intestinal Lauren phenotype.
- name: Tubular Adenocarcinoma
  finding_term:
    preferred_term: Gastric Tubular Adenocarcinoma
    term:
      id: NCIT:C5473
      label: Gastric Tubular Adenocarcinoma
  frequency: FREQUENT
  description: >-
    HER2 overexpression is substantially more frequent in differentiated,
    gland-forming tubular/papillary adenocarcinomas than in poorly cohesive
    carcinomas.
  evidence:
  - reference: PMID:24260051
    reference_title: "HER2 status in advanced gastric carcinoma: A retrospective multicentric analysis from Sicily."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present study, a progressive increase in HER2 immunoreactivity was observed, from the poorly cohesive histotype (3.5%) to MRCs (11.1%), tubular/papillary adenocarcinomas (31.3%) and HACs (42.9%)."
    explanation: >-
      HER2 immunoreactivity rose to 31.3% in tubular/papillary adenocarcinomas
      compared with 3.5% in poorly cohesive tumors, linking HER2 positivity to
      differentiated gland-forming morphology.


name: HER2-Positive Gastric Cancer
creation_date: '2026-01-26T02:55:13Z'
description: >-
  HER2-positive gastric cancer is a molecularly defined subtype characterized by ERBB2
  (HER2)
  amplification or overexpression, occurring in approximately 15-20% of gastric and
  gastroesophageal junction adenocarcinomas. HER2 positivity is enriched in intestinal-type
  tumors and those at the gastroesophageal junction. Trastuzumab combined with chemotherapy
  was the first targeted therapy to improve survival in gastric cancer (ToGA trial).
  More
  recently, trastuzumab deruxtecan (T-DXd) has demonstrated remarkable activity, establishing
  a new standard of care for HER2-positive gastric cancer.
categories:
- Gastrointestinal Cancer
- Gastric Cancer
- Molecularly Defined Cancer
parents:
- gastric adenocarcinoma
synonyms:
- HER2-positive gastric adenocarcinoma
- HER2+ gastric cancer
- ERBB2-amplified gastric adenocarcinoma
- HER2-overexpressing gastric cancer
- HER2-positive gastroesophageal junction adenocarcinoma
notes: >-
  HER2-positive gastric cancer is a somatic biomarker-defined stratum of gastric
  and gastroesophageal junction adenocarcinoma characterized by ERBB2 gene
  amplification and/or HER2 protein overexpression (IHC 3+ or IHC 2+ with ISH
  amplification). Because MONDO lacks a distinct term for the HER2-positive
  subset, disease_term anchors to MONDO:0005036 (gastric adenocarcinoma) with
  skos:broadMatch. No GeneReviews chapter covers somatic HER2-positive gastric
  cancer; the PIK3CA-Related Overgrowth Spectrum chapter covers post-zygotic
  mosaic overgrowth syndromes rather than somatic gastric neoplasia.
prevalence:
- population: Gastric adenocarcinoma patients
  measure_type: POINT_PREVALENCE
  percentage: 17.43
  notes: >-
    HER2 positivity occurs in roughly 15-20% of gastric and gastroesophageal
    junction adenocarcinomas across multicenter surgical and clinical trial
    cohorts, with higher prevalence in gastroesophageal junction and Lauren
    intestinal-type tumors than in diffuse/poorly cohesive tumors.
  evidence:
  - reference: PMID:24260051
    reference_title: "HER2 status in advanced gastric carcinoma: A retrospective multicentric analysis from Sicily."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HER2 overexpression was encountered in 17.43% of all the gastric adenocarcinomas, which was consistent with the results that have been reported elsewhere in the literature."
    explanation: >-
      Establishes the multicenter cohort prevalence of HER2 overexpression
      among 304 gastric adenocarcinomas.
  - reference: DOI:10.3390/cancers16091747
    reference_title: Recent Progress in Treatment for HER2-Positive Advanced Gastric Cancer
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human epidermal receptor (HER) 2-positive advanced gastric cancer is one of the major subtypes of gastric cancer, accounting for ~20% of all cases."
    explanation: >-
      Confirms that HER2-positive disease accounts for approximately 20% of
      advanced gastric cancer cases overall.
pathophysiology:
- name: ERBB2 (HER2) Amplification and Overexpression
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    gene:
      preferred_term: ERBB2
      term:
        id: hgnc:3430
        label: ERBB2
  description: >-
    Somatic ERBB2 gene amplification leads to overexpression of the HER2
    receptor tyrosine kinase at the plasma membrane of gastric epithelial cells.
    High-level HER2 expression promotes constitutive receptor dimerization
    (particularly HER2 homodimers and HER2/HER3 heterodimers), leading to
    ligand-independent kinase signaling. Spatial and temporal heterogeneity of
    HER2 expression is characteristic of gastric adenocarcinoma.
  genes:
  - preferred_term: ERBB2
    term:
      id: hgnc:3430
      label: ERBB2
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    modifier: INCREASED
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
  evidence:
  - reference: PMID:41355925
    reference_title: "Perioperative immunotherapy combined with standard therapy for human epidermal growth factor receptor 2-positive locally advanced gastric cancer: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Human epidermal growth factor receptor 2 (HER2)-positive gastric cancer (GC) represents a distinct molecular cancer subtype that is often associated with a poor prognosis.
    explanation: Identifies HER2-positive gastric cancer as a distinct molecular subtype driven by HER2 positivity.
  - reference: PMID:25079317
    reference_title: Comprehensive molecular characterization of gastric adenocarcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal amplifications targeted oncogenes such as ERBB2, CCNE1, KRAS, MYC, EGFR, CDK6, GATA4, GATA6 and ZNF217."
    explanation: >-
      TCGA somatic copy-number profiling identifies recurrent focal ERBB2
      oncogene amplification in primary gastric adenocarcinomas.
  - reference: PMID:24260051
    reference_title: "HER2 status in advanced gastric carcinoma: A retrospective multicentric analysis from Sicily."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HER-2 gene amplification and protein overexpression have been indicated as the targets for therapy with the anti-HER2 humanized monoclonal antibody, trastuzumab, in various cancers (1–9)."
    explanation: >-
      Links somatic ERBB2 gene amplification and HER2 protein overexpression as
      the actionable molecular lesion in gastric carcinoma.
  cell_types:
  - preferred_term: epithelial cell of stomach
    term:
      id: CL:0002178
      label: epithelial cell of stomach
  biological_processes:

inheritance:
- name: Autosomal dominant, de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    All reported probands carry heterozygous KDM1A missense variants that arose
    de novo; no vertical transmission has been reported and parents are
    unaffected. Expressivity is variable — palatal involvement, the feature that
    names the MONDO/Orphanet entity, was absent in the fourth published proband.
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three variants in KDM1A were missense variants predicted to be
      deleterious (minimum Polyphen-2 HumVar score of 0.962), result in amino
      acid substitutions of highly conserved amino acid residues (minimum GERP
      score was 5.72) in KDM1A, and have high CADD scores suggestive of dominant
      mutations (minimum CADD score 27.2) (Table 1).
    explanation: >-
      The three index probands each carried a de novo heterozygous missense
      variant with CADD scores in the range expected for dominant disease
      alleles, establishing autosomal dominant, de novo inheritance.
  - reference: PMID:40530541
    reference_title: "Phenotypical and Genotypical Expansion of Autosomal-Dominant KDM1A -Related Neurodevelopmental Disorder Spectrum: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this first reported individual without palate abnormalities highlights the
      variable expressivity of this feature in the KDM1A-related phenotype.
    explanation: >-
      Directly documents variable expressivity of the palatal phenotype within
      this autosomal dominant disorder.
genetic:
- name: KDM1A de novo missense variants
  gene_term:
    preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  features: >-
    Every reported disease-associated KDM1A allele is a heterozygous missense
    change; no truncating, whole-gene-deletion or biallelic alleles have been
    reported in this phenotype. The three index variants — p.(Glu403Lys),
    p.(Asp580Gly) and p.(Tyr785His) — all alter conserved residues within the
    FAD-dependent amine oxidase domain, and a fourth proband carried a novel
    missense variant in exon 16. KDM1A sits in the top 2% of evolutionarily
    constrained human genes.
  evidence:
  - reference: PMID:24838796
    reference_title: De novo ANKRD11 and KDM1A gene mutations in a male with features of KBG syndrome and Kabuki syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      c.2353T>C, predicting p.Tyr785His in KDM1A, a gene not previously
      associated with a human phenotype.
    explanation: >-
      First report of a deleterious KDM1A sequence variant in a human, in the
      proband who later became Family A of the delineating cohort.
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KDM1A is in the top 2% of evolutionarily constrained genes, i.e. genes
      that are intolerant to functional variation, and this set of genes is
      enriched for genes known to underlie dominant Mendelian phenotypes
    explanation: >-
      Population-constraint evidence supporting KDM1A as a dominant
      disease gene and the pathogenicity of the de novo missense alleles.
  - reference: PMID:27094131
    reference_title: LSD1/KDM1A mutations associated to a newly described form of intellectual disability impair demethylase activity and binding to transcription factors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

differential_diagnoses:
- name: Kabuki syndrome
  description: >-
    Kabuki syndrome (KMT2D, KDM6A) is the principal differential: it shares
    developmental delay, hypotonia, elongated palpebral fissures, arched
    eyebrows, cleft palate and dental anomalies, and the index KDM1A proband was
    initially described as having features of Kabuki syndrome. Both are
    chromatin-modifier disorders acting on histone H3 lysine 4 methylation —
    KMT2D writes and KDM1A erases the mark — which plausibly explains the
    convergence. The delineating study concluded that the KDM1A condition
    overlaps with but is nonetheless distinct from Kabuki syndrome.
  disease_term:
    preferred_term: Kabuki syndrome
    term:
      id: MONDO:0016512
      label: Kabuki syndrome
  distinguishing_features:
  - Pathogenic KMT2D or KDM6A variants rather than de novo KDM1A missense variants.
  - Eversion of the lateral third of the lower eyelid, a Kabuki hallmark not described in the KDM1A phenotype.
  - Persistent fetal fingertip pads, postnatal growth deficiency, recurrent otitis media and immune deficiency, none of which is part of the described KDM1A phenotype.
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations in KDM1A cause a condition that has phenotypic overlap with
      Kabuki syndrome but is nonetheless distinct.
    explanation: >-
      Explicit statement that the KDM1A condition overlaps with, but is separable
      from, Kabuki syndrome.
- name: KBG syndrome
  description: >-
    KBG syndrome (ANKRD11 haploinsufficiency) entered the differential because
    the index proband carried a second de novo variant, ANKRD11
    c.2606_2608delAGA p.(Lys869del), and was initially reported as a dual
    diagnosis. The delineating study argued against a KBG contribution: nearly
    all KBG-causing ANKRD11 alleles are truncating, the in-frame deletion has a
    CADD score well below the dominant-disease range, and the proband lacked
    macrodontia of the upper central incisors. This is a resolved
    dual-diagnosis differential rather than a live clinical one, but it is a
    standing reminder to consider blended diagnoses in this disorder.
  disease_term:
    preferred_term: KBG syndrome
    term:
      id: MONDO:0007846
      label: KBG syndrome
  distinguishing_features:
  - Macrodontia of the upper central incisors is the hallmark of KBG syndrome and was absent in the KDM1A index proband, whose dental phenotype is widely spaced teeth.
  - KBG-causing ANKRD11 alleles are overwhelmingly truncating, whereas the KDM1A alleles are missense.
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      variant in ANKRD11 in Family A does not cause KBG syndrome.
    explanation: >-
      The delineating study argues against a KBG syndrome contribution in the
      index proband. The quote is deliberately truncated because the full
      sentence contains a bracketed HGVS protein change that the reference
      validator strips; the full sentence reads "Additional evidence suggests
      that the c.2606_2608delAGA [p.(Lys869del)] variant in ANKRD11 in Family A
      does not cause KBG syndrome" — i.e. the authors hedge with "suggests"
      rather than asserting exclusion outright.
- name: Potocki-Shaffer syndrome (PHF21A-related disorder)
  description: >-
    PHF21A (BHC80) encodes a partner of LSD1 in the BRAF-HDAC/CoREST corepressor
    complex, and its haploinsufficiency causes the intellectual disability plus
    craniofacial anomaly component of Potocki-Shaffer syndrome. The two
    disorders are therefore mechanistically adjacent — different subunits of the
    same repressor complex — and PHF21A disruption is the best available human
    evidence that impairing this complex produces the ID-plus-craniofacial
    combination.
  disease_term:
    preferred_term: Potocki-Shaffer syndrome
    term:
      id: MONDO:0011022
      label: Potocki-Shaffer syndrome
  distinguishing_features:
  - Potocki-Shaffer syndrome is a contiguous-gene deletion disorder of 11p11.2, not a single-gene missense disorder.
  - Multiple exostoses and parietal foramina are part of Potocki-Shaffer syndrome and are not features of the KDM1A phenotype.
  - Epilepsy and autistic features are prominent in PHF21A-related disorder but are not established features of KDM1A-related neurodevelopmental disorder.
  evidence:
  - reference: PMID:22770980
    reference_title: Translocations disrupting PHF21A in the Potocki-Shaffer-syndrome region are associated with intellectual disability and craniofacial anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have uncovered evidence that the ID and CFA phenotypes are both caused
      by haploinsufficiency of a single gene, PHF21A, at 11p11.2.
    explanation: >-
      Establishes PHF21A haploinsufficiency, in the same complex as LSD1, as a
      cause of intellectual disability with craniofacial anomalies.
animal_models:
- species: Mus musculus
  genotype: Inducible, forebrain-restricted conditional Kdm1a knockout
  category: Conditional knockout
  description: >-
    Inducible deletion of Kdm1a restricted to adult forebrain neurons, profiled
    by transcriptomics, epigenomics, chromatin-conformation analysis and
    super-resolution microscopy. Loss of Kdm1a derepresses non-neuronal genes
    silenced by the polycomb repressor complex and weakens the topological
    segregation of those genes from neighbouring active chromatin. This is the
    strongest available demonstration of what the chromatin lesion does at the
    level of neuronal genome organisation, but it models complete somatic loss
    in mature neurons rather than a germline heterozygous missense allele.
  associated_phenotypes:
  - Derepression of PRC2-silenced non-neuronal genes in neurons
  - Weakened topological segregation of Kdm1a-repressed chromatin domains
  evidence:
  - reference: PMID:38453932
    reference_title: Kdm1a safeguards the topological boundaries of PRC2-repressed genes and prevents aging-related euchromatinization in neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To explore Kdm1a's function in adult neurons, we develop inducible and
      forebrain-restricted Kdm1a knockouts.
    explanation: Describes the conditional mouse model and its design.
- species: Danio rerio
  genotype: CRISPR/Cas9 kdm1a knockout
  category: Knockout
  description: >-
    CRISPR/Cas9 kdm1a-deficient zebrafish larvae show developmental toxicity and
    abnormal neurobehaviour, with suppressed CNS neurogenesis, shortened
    motor-neuron axons, downregulated neurodevelopmental gene expression and
    increased autophagy/apoptosis gene expression. This supports impaired
    neurogenesis as a downstream consequence of loss of kdm1a, but it is a
    knockout rather than a patient-allele knock-in.
  associated_phenotypes:
  - Locomotor abnormalities
  - Learning and memory deficits
  - Suppressed CNS neurogenesis
  - Reduced motor neuron axon length
  evidence:
  - reference: PMID:41351445
    reference_title: Deficiency of Kdm1a Induces Locomotor Abnormalities and Learning and Memory Deficits in Zebrafish Larvae.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that kdm1a knockout zebrafish exhibited developmental toxicity
      and abnormal neurobehaviors, including locomotor abnormalities, and
      learning and memory deficits.
    explanation: >-
      Establishes the neurobehavioural consequence of kdm1a loss in a vertebrate
      model.
diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    There is no biochemical or imaging marker for this disorder and the clinical
    presentation (developmental delay, hypotonia, non-specific dysmorphism) is
    not distinctive enough to be diagnosed on examination. Diagnosis is
    molecular: trio exome or genome sequencing analysed under a de novo model,
    with KDM1A also included on broad
    developmental-delay/intellectual-disability, cleft-palate and chromatinopathy
    panels. Because every reported
    allele is a missense change, variant interpretation requires confirming de
    novo status by parental testing and weighing domain location and
    conservation; the index cohort was ascertained exactly this way, and the
    fourth proband was diagnosed by trio genome sequencing only after
    karyotype, microarray, FMR1 repeat testing and a metabolic workup were
    unrevealing.
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of variants from ES under a de novo mutation model confirmed the
      presence of a different de novo variant in KDM1A (Refseq NM_001009999.2)
      in each of Families A and B
    explanation: >-
      Exome sequencing analysed under a de novo model is the diagnostic route by
      which the disorder was established and by which affected individuals are
      identified.
  notes: >-
    No disease-specific DNA-methylation episignature has been validated for
    KDM1A, unlike several other chromatinopathies; the 2025 report proposes
    episignature analysis as a future means of classifying KDM1A variants of
    uncertain significance.

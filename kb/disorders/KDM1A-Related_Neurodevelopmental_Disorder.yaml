pathophysiology:
- name: De Novo Missense Variants in the LSD1 Amine Oxidase Domain
  biological_scale: MOLECULAR
  description: >-
    All three index disease alleles alter highly conserved residues inside the
    FAD-dependent amine oxidase domain of LSD1/KDM1A. This domain comprises the
    FAD-binding and substrate-binding subdomains, and the substrate-binding
    subdomain forms the active-site cavity through which LSD1 demethylates
    mono- and dimethylated histone H3 lysine 4. Clustering of independently
    ascertained de novo variants in a single functional domain is itself
    evidence that the lesion is domain-specific rather than a matter of gene
    dosage.
  genes:
  - preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  downstream:
  - target: Impaired LSD1 Catalytic Activity and Protein Stability
    description: >-
      Active-site substitutions partially inactivate the demethylase and
      destabilise the protein.
  - target: Impaired LSD1 Engagement of Developmental Transcription Factors
    description: >-
      The same substitutions differentially disrupt the protein-protein
      interfaces through which LSD1 is recruited by transcription factors.
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all three mutations alter residues in the amine-oxidase domain (Figure
      2B), which is composed of FAD-binding and substrate-binding functional
      subdomains
    explanation: >-
      Establishes that the disease-associated variants cluster in the catalytic
      amine oxidase domain of LSD1.
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The active site cavity of KDM1A is formed by the substrate-binding
      subdomain
    explanation: >-
      Links the affected substrate-binding subdomain to the active-site cavity;
      the source continues that this cavity "is required for KDM1A to
      demethylate H3K4me1/2 and repress transcription". Tagged IN_VITRO because
      this is a structural/biochemical assertion in the discussion rather than a
      clinical observation.
- name: Impaired LSD1 Catalytic Activity and Protein Stability
  biological_scale: MOLECULAR
  description: >-
    In vitro and cellular assays of the three index variants show partial —
    not complete — impairment of H3K4 demethylase activity, together with a
    reduction in the cellular half-life of the mutant protein. The hypomorphic
    rather than null character of the biochemical defect is consistent with the
    survival of affected individuals, given that complete loss of Kdm1a is
    embryonic-lethal in mouse.
  genes:
  - preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  molecular_functions:
  - preferred_term: histone H3K4 demethylase activity
    term:
      id: GO:0032453
      label: histone H3K4 demethylase activity
    modifier: DECREASED
  downstream:
  - target: Loss of LSD1-CoREST-Mediated Transcriptional Repression
    description: >-
      Reduced demethylase output and reduced steady-state LSD1 weaken repression
      at LSD1-CoREST target loci.
  evidence:
  - reference: PMID:27094131
    reference_title: LSD1/KDM1A mutations associated to a newly described form of intellectual disability impair demethylase activity and binding to transcription factors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The three mutations (Glu403Lys, Asp580Gly and Tyr785His) affect
      active-site residues and lead to a partial impairment of catalytic
      activity.
    explanation: >-
      Direct biochemical demonstration of partial catalytic impairment by the
      disease alleles.
  - reference: PMID:27094131
    reference_title: LSD1/KDM1A mutations associated to a newly described form of intellectual disability impair demethylase activity and binding to transcription factors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, cellular data indicate a decrease in the protein cellular
      half-life.
    explanation: >-
      Reduced protein stability compounds the catalytic defect, lowering
      effective LSD1 activity in cells.
- name: Impaired LSD1 Engagement of Developmental Transcription Factors
  biological_scale: MOLECULAR
  description: >-
    Beyond catalysis, the disease variants differentially perturb the ability of
    LSD1 to bind transcription factors that orchestrate developmental gene
    programs. Because LSD1 acts as a scaffold as well as an enzyme, this
    non-catalytic defect is a mechanistically separate arm of the pathology and
    may explain why different active-site substitutions produce overlapping but
    not identical phenotypes.
  genes:
  - preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  downstream:
  - target: Dysregulated Neurodevelopmental and Craniofacial Gene Programs
    description: >-
      Failure to be recruited by developmental transcription factors misdirects
      the LSD1-dependent repressive program.
  evidence:
  - reference: PMID:27094131
    reference_title: LSD1/KDM1A mutations associated to a newly described form of intellectual disability impair demethylase activity and binding to transcription factors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      They also differentially perturb the ability of LSD1 to engage
      transcription factors that orchestrate key developmental programs.
    explanation: >-
      Establishes a non-catalytic, protein-interaction arm of the molecular
      defect distinct from loss of demethylase activity.
  - reference: PMID:27094131
    reference_title: LSD1/KDM1A mutations associated to a newly described form of intellectual disability impair demethylase activity and binding to transcription factors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This depicts a perturbed interplay of catalytic and non-catalytic
      processes at the origin of the pathology.
    explanation: >-
      The authors' own synthesis that the pathology arises from combined
      catalytic and non-catalytic dysfunction.
- name: Loss of LSD1-CoREST-Mediated Transcriptional Repression
  biological_scale: CELLULAR
  description: >-
    LSD1 functions within the BRAF-HDAC/CoREST corepressor complex, together
    with PHF21A (BHC80), to keep non-neuronal and neuronal gene sets correctly
    silenced and to time neuronal gene expression during development. Reduced
    LSD1 activity or occupancy therefore derepresses this target set. Two
    independent lines support the step. In mouse, inducible forebrain-restricted
    Kdm1a deletion activates non-neuronal genes normally silenced by the
    polycomb repressor complex and weakens their topological segregation from
    neighbouring active chromatin. In humans, haploinsufficiency of the LSD1
    partner PHF21A derepresses the neuronal gene SCN3A with reduced LSD1
    promoter occupancy, and PHF21A knockdown in zebrafish causes craniofacial
    abnormalities and neuronal apoptosis.
  genes:
  - preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: chromatin
    term:
      id: GO:0000785
      label: chromatin
  downstream:
  - target: Dysregulated Neurodevelopmental and Craniofacial Gene Programs
    description: >-
      Derepression of LSD1-CoREST target genes mistimes neuronal and
      craniofacial developmental programs.
  evidence:
  - reference: PMID:22770980
    reference_title: Translocations disrupting PHF21A in the Potocki-Shaffer-syndrome region are associated with intellectual disability and craniofacial anomalies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Along with lysine-specific demethylase 1 (LSD1), PHF21A, also known as
      BHC80, is a component of the BRAF-histone deacetylase complex that
      represses target-gene transcription.
    explanation: >-
      Places LSD1 in the BRAF-HDAC/CoREST repressive complex whose disruption is
      the proposed proximal cellular lesion. Tagged IN_VITRO because this is a
      statement of complex composition from biochemical work, not a clinical
      observation.
  - reference: PMID:22770980
    reference_title: Translocations disrupting PHF21A in the Potocki-Shaffer-syndrome region are associated with intellectual disability and craniofacial anomalies.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      In lymphoblastoid cell lines from two translocation subjects in whom
      PHF21A was directly disrupted by the respective breakpoints, we observed
      derepression of the neuronal gene SCN3A and reduced LSD1 occupancy at the
      SCN3A promoter, supporting a direct functional consequence of PHF21A
      haploinsufficiency on transcriptional regulation.
    explanation: >-
      Indirect (PARTIAL) support on two counts — the derepression was
      demonstrated for the LSD1 partner PHF21A rather than for KDM1A variants
      themselves, and it was measured in patient-derived lymphoblastoid cell
      lines (hence IN_VITRO) rather than in neural tissue. It nevertheless shows
      that impairing this complex derepresses neuronal targets and reduces LSD1
      promoter occupancy.
  - reference: PMID:38453932
    reference_title: Kdm1a safeguards the topological boundaries of PRC2-repressed genes and prevents aging-related euchromatinization in neurons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we find that Kdm1a elimination causes the neuronal activation of
      nonneuronal genes that are silenced by the polycomb repressor complex and
      interspersed with active genes.
    explanation: >-
      Conditional Kdm1a deletion in adult mouse forebrain neurons directly
      demonstrates that loss of Kdm1a derepresses silenced target genes, the
      cellular step modelled by this node.
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      during the perinatal period, alternative splicing of KDM1A results in
      expression of two neuron-specific isoforms that regulate neurite
      maturation
    explanation: >-
      Establishes a developmentally timed, neuron-specific role for KDM1A that
      links the chromatin lesion to neurodevelopment.
- name: Dysregulated Neurodevelopmental and Craniofacial Gene Programs
  biological_scale: TISSUE
  description: >-
    The convergent consequence of reduced LSD1 catalytic output, reduced LSD1
    protein, and impaired transcription-factor engagement is mistimed and
    misplaced expression of the gene programs that build the developing brain
    and the craniofacial skeleton, including the palate. In zebrafish, kdm1a
    knockout suppresses CNS neurogenesis, shortens motor-neuron axons and
    downregulates neurodevelopmental genes, producing locomotor and
    learning/memory deficits. The craniofacial arm is the weaker link: it is
    supported by knockdown of the LSD1 partner PHF21A rather than by any
    patient-variant craniofacial model. Together these produce the two-part
    clinical picture — global developmental delay with hypotonia, and a
    recognisable facial gestalt with palatal anomalies — that defines the
    syndrome.
  biological_processes:
  - preferred_term: regulation of neuron differentiation
    term:
      id: GO:0045664
      label: regulation of neuron differentiation
    modifier: ABNORMAL
  - preferred_term: roof of mouth development
    term:
      id: GO:0060021
      label: roof of mouth development
    modifier: ABNORMAL
  - preferred_term: embryonic cranial skeleton morphogenesis
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      de novo variants in KDM1A cause a newly-delineated condition characterized
      by developmental delay, hypotonia, and characteristic facial features.
    explanation: >-
      States the clinical output of the mechanism: a combined neurodevelopmental
      and craniofacial phenotype.
  - reference: PMID:41351445
    reference_title: Deficiency of Kdm1a Induces Locomotor Abnormalities and Learning and Memory Deficits in Zebrafish Larvae.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Kdm1a deficiency suppressed central nervous system (CNS) neurogenesis in
      Tg (HuC:egfp) zebrafish, reduced motor neuron axon length in Tg
      (hb9:egfp) zebrafish and downregulated the expression of neurodevelopment
      related genes at 96 hours post fertilization (hpf).
    explanation: >-
      Loss of kdm1a directly impairs neurogenesis, axon growth and
      neurodevelopmental gene expression, the neural arm of this node.
  - reference: PMID:22770980
    reference_title: Translocations disrupting PHF21A in the Potocki-Shaffer-syndrome region are associated with intellectual disability and craniofacial anomalies.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      suppression of the latter led to both craniofacial abnormalities and
      neuronal apoptosis.
    explanation: >-
      Indirect (PARTIAL) support from zebrafish knockdown of the LSD1 partner
      PHF21A, showing that disrupting this complex during development produces
      both the craniofacial and the neuronal arms of the phenotype. No
      patient-variant craniofacial model exists.
phenotypes:
- name: Global Developmental Delay
  category: Neurologic
  frequency: VERY_FREQUENT
  description: >-
    Global developmental delay affecting motor, speech and cognitive domains is
    present in every reported proband and was one of the two features (with the
    facial gestalt) used to recognise the syndrome.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three children with de novo
      KDM1A variants had similar, albeit non-specific, clinical findings (Table
      1) including similar facial features, global developmental delay and
      hypotonia
    explanation: >-
      All three delineating probands had global developmental delay. With the
      fourth published proband (PMID:40530541) that is 4/4 = 100%;
      VERY_FREQUENT rather than OBLIGATE is used because n=4 cannot establish
      complete penetrance.
  - reference: PMID:40530541
    reference_title: "Phenotypical and Genotypical Expansion of Autosomal-Dominant KDM1A -Related Neurodevelopmental Disorder Spectrum: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KDM1A-related neurodevelopmental disorder (CPRF, OMIM #616728) is
      characterized by cleft palate, global developmental delay, and distinct
      facial gestalt
    explanation: >-
      The most recent report confirms global developmental delay as a defining
      feature.
- name: Hypotonia
  category: Neurologic
  frequency: VERY_FREQUENT
  description: >-
    Muscular hypotonia is reported in every published case and was present from

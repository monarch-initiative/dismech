name: KDM1A-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: KDM1A-related neurodevelopmental disorder
  term:
    id: MONDO:0014751
    label: palatal anomalies-widely spaced teeth-facial dysmorphism-developmental delay syndrome
description: >-
  KDM1A-related neurodevelopmental disorder (CPRF; OMIM #616728;
  MONDO:0014751) is an ultra-rare autosomal dominant multiple congenital
  anomalies/dysmorphic syndrome caused by de novo heterozygous missense
  variants in KDM1A, which encodes lysine-specific histone demethylase 1
  (LSD1). Affected individuals share global developmental delay, hypotonia,
  and a recognisable facial gestalt comprising a prominent forehead, arched
  eyebrows, elongated palpebral fissures, a wide nasal bridge, thin lips and
  widely spaced teeth. Cleft palate is a defining feature of the originally
  delineated phenotype but is not obligate; the Orphanet description of the
  entity additionally reports a high, narrow palate. The facial gestalt is
  itself variable — the fourth published proband had unspecific facial features
  and no palate abnormality. The condition was delineated in 2015-2016 from three
  unrelated children ascertained through family-driven social networking, and
  the published cohort remains very small — on the order of four detailed
  probands — so the full phenotypic spectrum is still being defined.
synonyms:
- CPRF
- cleft palate, psychomotor retardation, and distinctive facial features
- palatal anomalies-multiple diastemata-facial dysmorphism-developmental delay syndrome
parents:
- hereditary disease
- multiple congenital anomalies/dysmorphic syndrome-intellectual disability

discussions:
- discussion_id: kdm1a_loss_versus_gain_of_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired LSD1 Catalytic Activity and Protein Stability
  prompt: >-
    Do the disease-associated KDM1A missense variants act through loss of
    function, gain of function, or a dominant-negative effect on the
    LSD1-CoREST complex?
  rationale: >-
    Every reported allele is missense and clusters in the amine oxidase domain,
    and biochemistry shows only partial catalytic impairment plus reduced
    protein half-life — a hypomorphic profile. But mice heterozygous for a Kdm1a
    deletion are reported to be normal, which argues that simple
    haploinsufficiency is not sufficient to produce the phenotype. The absence
    of any reported truncating or whole-gene-deletion allele in this phenotype
    is consistent with a non-loss-of-function mechanism, but could equally
    reflect ascertainment in an ultra-rare cohort. Because LSD1 acts both
    catalytically and as a scaffold, a mutant protein that is stably
    incorporated into CoREST but catalytically crippled could poison the complex
    — a dominant-negative model that has not been tested. The distinction
    matters therapeutically: pharmacological LSD1 inhibition, which is
    beneficial in mouse models of Kabuki syndrome, would be expected to worsen a
    loss-of-function KDM1A disorder.
  proposed_experiments:
  - experiment_id: kdm1a_truncating_allele_cohort_screen
    name: Truncating-allele cohort screen
    description: >-
      Screen large developmental-disorder sequencing cohorts for truncating
      KDM1A alleles and phenotype any carriers.
    supporting_outcome:
    - Recovery of truncating carriers with the CPRF phenotype would support a simple loss-of-function/haploinsufficiency mechanism.
    refuting_outcome:
    - Truncating carriers who are unaffected, or complete absence of truncating alleles despite adequate power, would argue against haploinsufficiency and favour a dominant-negative or altered-specificity mechanism.
  - experiment_id: kdm1a_knockin_versus_null_comparison
    name: Patient-allele knock-in versus null allele comparison
    description: >-
      Generate mouse or human iPSC models carrying p.Glu403Lys, p.Asp580Gly or
      p.Tyr785His in the heterozygous state and compare craniofacial and
      neurodevelopmental phenotypes and transcriptomes with isogenic
      heterozygous-null controls.
    supporting_outcome:
    - A missense knock-in phenotype more severe than the heterozygous null would support a dominant-negative or gain-of-function mechanism.
    refuting_outcome:
    - Phenotypic equivalence between missense knock-in and heterozygous null would support simple loss of function.
  - experiment_id: kdm1a_corest_incorporation_profiling
    name: CoREST incorporation and target-locus chromatin profiling
    description: >-
      Determine whether mutant LSD1 is still incorporated into the CoREST
      complex, and measure H3K4me1/2 and target-gene expression at LSD1-CoREST
      loci in patient-derived neurons.
    supporting_outcome:
    - Retained complex incorporation with locally increased H3K4me1/2 and target derepression would support complex poisoning by a dominant-negative mechanism.
    refuting_outcome:
    - Failure of mutant LSD1 to be incorporated into CoREST would favour simple reduction of functional complex.
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, it remains to be seen if the phenotypes we report to be
      caused by variants in KDM1A are due to loss or gain of function.
    explanation: >-
      The delineating study explicitly leaves the direction of effect
      unresolved.
  - reference: PMID:27094131
    reference_title: LSD1/KDM1A mutations associated to a newly described form of intellectual disability impair demethylase activity and binding to transcription factors.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      This depicts a perturbed interplay of catalytic and non-catalytic
      processes at the origin of the pathology.
    explanation: >-
      PARTIAL — biochemistry shows combined catalytic and non-catalytic
      perturbation but does not resolve loss versus gain versus
      dominant-negative at the level of the intact complex in vivo.
- discussion_id: kdm1a_heterozygous_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired LSD1 Catalytic Activity and Protein Stability
  - pathophysiology#Dysregulated Neurodevelopmental and Craniofacial Gene Programs
  prompt: >-
    Given that mice heterozygous for a Kdm1a deletion are reported to be
    apparently normal and fertile while homozygous knockout is embryonic-lethal,
    does any available model reproduce the human heterozygous missense-variant
    syndrome — and in particular its craniofacial arm?
  rationale: >-
    The mouse Kdm1a allelic series brackets the human condition without
    reproducing it. The homozygous null dies in early embryogenesis, so it
    cannot be used to study postnatal neurodevelopment or craniofacial
    patterning. The heterozygous null is reported as phenotypically normal, so
    it does not reproduce the human dysmorphism, hypotonia or developmental
    delay. Human disease sits between these: a stably expressed but
    catalytically impaired protein at one of two alleles. The two strongest
    modern datasets share this limitation — the adult forebrain conditional
    knockout models complete somatic loss in mature neurons, and the zebrafish
    line is a knockout. Most importantly, the craniofacial and palatal arm of
    the phenotype, which supplies the disorder's name, has never been modelled
    with a KDM1A patient allele at all; the supporting evidence comes from
    knockdown of the partner gene PHF21A. This is a model-fidelity question, not
    an absence of data.
  proposed_experiments:
  - experiment_id: kdm1a_heterozygous_knockin_mouse
    name: Heterozygous patient-allele knock-in mouse
    description: >-
      Build heterozygous knock-in mice carrying the human missense substitutions
      and phenotype palate, craniofacial skeleton, muscle tone and behaviour
      against both wild-type and heterozygous-null littermates.
    supporting_outcome:
    - Reproduction of palatal, craniofacial and neurodevelopmental phenotypes would validate the mouse as a model of the human disorder.
    refuting_outcome:
    - A normal heterozygous knock-in mouse would indicate that the mouse cannot model this disorder and would redirect effort to human cellular models.
  - experiment_id: kdm1a_ipsc_neural_crest_model
    name: Patient-derived iPSC neurons and cranial neural crest cells
    description: >-
      Differentiate patient-derived iPSCs into cortical neurons and cranial
      neural crest cells and test whether the human alleles perturb LSD1-CoREST
      target-gene repression in the relevant human cell types, against isogenic
      corrected controls.
    supporting_outcome:
    - Allele-dependent derepression of LSD1-CoREST targets in human neural crest would establish the craniofacial arm of the mechanism in human cells.
    refuting_outcome:
    - Absence of any transcriptional consequence in patient neural crest would argue that the craniofacial phenotype arises by a different route.
  evidence:
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice heterozygous for a Kdm1a deletion are apparently normal and fertile
    explanation: >-
      The heterozygous null mouse does not recapitulate the human heterozygous
      phenotype, establishing the model-fidelity mismatch.
  - reference: PMID:26656649
    reference_title: "Gene discovery for Mendelian conditions via social networking: de novo variants in KDM1A cause developmental delay and distinctive facial features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous knockout of Kdm1a in mice is lethal during early embryogenesis
    explanation: >-
      The homozygous null is embryonic-lethal, so it cannot model the postnatal
      human phenotype either; the two available mouse genotypes bracket rather
      than reproduce the human condition.
review_notes: >-
  NAMED-ENTITY-CONFUSION PREFLIGHT — PASSED. The MONDO label ("palatal
  anomalies-widely spaced teeth-facial dysmorphism-developmental delay
  syndrome") is purely descriptive and carries no gene handle, which is a
  high-risk NEC configuration: multi-feature descriptive syndrome names collide
  easily with other dysmorphology entities. Identity was therefore anchored
  before any deep-research output was consumed, using
  `runoak -i sqlite:obo:mondo info MONDO:0014751 -O obo`. That record supplies
  three independent anchors, all concordant: (i) the gene relation
  `RO:0004003 HGNC:29079 ! KDM1A`; (ii) `xref: OMIM:616728`, which is
  "CLEFT PALATE, PSYCHOMOTOR RETARDATION, AND DISTINCTIVE FACIAL FEATURES; CPRF";
  and (iii) the RELATED synonym "CPRF", matching that OMIM title. The literature
  is concordant: Burkart et al. (PMID:40530541) explicitly equate "KDM1A-related
  neurodevelopmental disorder" with "CPRF, OMIM #616728", and the facial gestalt
  behind the Orphanet definition matches that reported by Chong et al.
  (PMID:26656649). The Edison/falcon deep-research report independently returned
  KDM1A and OMIM 616728 as the dominant gene/entity, so the DR passes the
  gene-frequency-versus-MONDO check and was used. Two adjacent entities were
  checked and excluded: KDM5C (Claes-Jensen X-linked ID, curated separately) and
  PHF21A (Potocki-Shaffer / 11p11.2), which is a complex partner of LSD1 and is
  modelled here only as a differential diagnosis and as indirect (PARTIAL)
  mechanistic support, never as the causal gene.
notes: >-
  SCOPE AND SIZING. This entry is deliberately sized to a very small literature:
  three probands in the delineating report (PMID:26656649, one of whom was first
  published as PMID:24838796), functional characterisation of their three
  alleles (PMID:27094131), and one subsequent phenotype-expansion case report
  (PMID:40530541). Generic developmental-delay biology has not been imported to
  pad the pathograph.

  DEEP RESEARCH. Edison/falcon
  (`research/KDM1A-Related_Neurodevelopmental_Disorder-deep-research-falcon.md`,
  646 s, 21 citations). The report independently converged on KDM1A / CPRF /
  OMIM 616728 and contributed two mechanistic sources used here (PMID:38453932
  forebrain conditional-knockout mouse; PMID:41351445 kdm1a-knockout zebrafish).
  It did NOT retrieve either of the two delineating clinical papers
  (PMID:26656649, PMID:24838796), which were found independently via PubMed and
  supply most of the phenotype evidence — a reminder that DR coverage of very
  small clinical literatures is unreliable. Its suggested identifiers were
  partly unusable (it declined to assign MONDO/Orphanet IDs; several suggested
  GO/HP terms are obsolete or non-preferred, e.g. GO:0070544 and HP:0001212),
  so every ontology term in this entry was independently verified with OAK
  rather than taken from the report.

  FEATURES IN THE MONDO/ORPHANET DEFINITION THAT ARE NOT CURATED AS PHENOTYPES.
  The Orphanet-derived definition additionally lists hypertelorism, downslanting
  palpebral fissures, high and narrow palate, short stature, axial hypotonia,
  lower-limb hypertonia, brachydactyly, clinodactyly, hypoplastic toenails, a
  single palmar crease, joint hypermobility, and ocular and urogenital
  anomalies. These are omitted, not overlooked: the Orphanet structured record
  (ORPHA:477993) is not present in `references_cache/`, `just refresh-orphadata`
  currently fails a manifest checksum against upstream drift, the targeted
  per-ID rebuild `just structured-rebuild-orphanet --id 477993` was also tried
  and fails with FileNotFoundError on the un-downloadable
  `data/orphadata/en_product1.xml`, and none of these features appears in a
  quotable form in any abstract or open full text available for this disorder.
  Curating them would require fabricating a
  snippet. Note also a real discrepancy worth preserving: the delineating study
  reports *elongated* palpebral fissures (a Kabuki-like feature), whereas the
  Orphanet definition reports *downslanting* palpebral fissures. Only the
  directly quotable "elongated" form is curated. The fourth proband additionally
  had myopia, mild thoracic kyphosis, broad fingertips, hypoplastic nails and
  clinodactyly, but the cached abstract does not quote them, so they are also
  left out. The same applies to that proband's allele: the deep-research report,
  working from the Burkart full text, gives it as c.1844G>A p.(Arg615Gln), but
  the cached abstract says only "exon 16", so no fourth `variants[]` entry is
  asserted. These should be added when the ORPHA:477993 cache can be rebuilt or
  when the Burkart full text becomes fetchable.

  NO GENEREVIEWS BASELINE. A PubMed search for a GeneReviews chapter
  ("KDM1A GeneReviews[All Fields]", and a title-restricted search) returned no
  results. There is no GeneReviews article for this disorder, so the mandatory
  GeneReviews phenotype baseline does not apply.

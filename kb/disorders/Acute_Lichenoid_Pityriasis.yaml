name: Acute Lichenoid Pityriasis
creation_date: '2026-05-04T19:32:38Z'
description: >-
  Acute lichenoid pityriasis is pityriasis lichenoides et varioliformis acuta
  (PLEVA, Mucha-Habermann disease), the acute pole of the pityriasis
  lichenoides spectrum. It is a rare inflammatory dermatosis characterized by
  abrupt crops of erythematous papules or papulovesicles that can
  scale, become hemorrhagic or necrotic, crust, and heal with dyspigmentation
  or varioliform scarring. Pityriasis lichenoides chronica (PLC) is the chronic
  spectrum pole and can overlap clinicopathologically with PLEVA, but is not
  the scope of this entry. Febrile ulceronecrotic Mucha-Habermann disease
  (FUMHD) is a rare, severe PLEVA variant with coalescing ulcers, high fever,
  and possible systemic involvement. Etiology remains unresolved: an
  antigen-triggered reactive process and a clonal or oligoclonal T-cell
  dyscrasia are competing or potentially superimposed models. PLEVA-specific
  immunophenotyping supports a CD8-positive, TIA-1-positive cytotoxic
  T-cell-rich infiltrate associated with epidermal injury, but does not
  identify the upstream antigen.
category: Complex

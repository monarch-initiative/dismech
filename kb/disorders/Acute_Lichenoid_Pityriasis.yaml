discussions:
- discussion_id: upstream_trigger_identity
  prompt: What upstream antigen or exposure initiates PLEVA, if any?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Antigen-associated immune triggering
  rationale: >-
    Temporal associations support a reactive model, but no specific agent is
    reproducibly causal and PLEVA tissue was negative for the common viruses
    tested. Identifying the initiating antigen would distinguish a postinfectious
    response from a direct infection or noninfectious trigger.
  evidence:
  - reference: PMID:38973067
    reference_title: "Immunophenotyping and viral studies in pityriasis lichenoides et varioliformis acuta lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry for human HHV-1 and HHV-2, CMV and HHV-8,
      parvovirus B19, and in situ hybridization for EBV were all negative.
    explanation: This PLEVA-specific study leaves the upstream trigger unresolved.
- discussion_id: reactive_versus_clonal_t_cell_model
  prompt: Is PLEVA primarily reactive, a clonal T-cell dyscrasia, or a heterogeneous spectrum containing both?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Antigen-associated immune triggering
  - pathophysiology#Clonal or oligoclonal cutaneous T-cell expansion
  - diagnosis#Clinicopathologic and phenotypic assessment of atypical or persistent lesions
  rationale: >-
    Clonality and aberrant phenotypes occur in selected PL cohorts, yet
    clonality is not synonymous with lymphoma. Follow-up studies disagree on
    whether apparent MF evolution represents true progression, initial
    misclassification, or a selected atypical subset.
  evidence:
  - reference: PMID:12203210
    reference_title: "Pityriasis lichenoides: a clonal T-cell lymphoproliferative disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Clonality was shown in 25 of 27 biopsies in which amplifiable DNA was obtained."
    explanation: This selected cohort supports the clonal side of the controversy.
  - reference: PMID:41420620
    reference_title: "Pityriasis lichenoides: a university department long-term follow-up study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "During the follow-up period, no progression to cutaneous T-cell lymphoma was established."
    explanation: >-
      A 242-patient PL cohort with median 9.9-year follow-up found no
      established CTCL progression, supporting a generally benign interpretation.
  - reference: PMID:29210716
    reference_title: "Relationship Between Pityriasis Lichenoides and Mycosis Fungoides: A Clinicopathological, Immunohistochemical, and Molecular Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 3 (5.2%) of the 58 patients with PL developed MF after 3-11 years of prolonged clinical course."
    explanation: >-
      This selected PL cohort reports apparent evolution, but the result is not
      PLEVA-specific and should not be converted into a general PLEVA risk.
- discussion_id: pleva_treatment_evidence_gap
  prompt: Which treatment improves PLEVA-specific remission and durable control beyond spontaneous resolution?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Narrowband UVB phototherapy
  - treatments#Oral erythromycin therapy
  - treatments#Topical corticosteroid therapy
  - treatments#Methotrexate therapy for refractory or severe disease
  rationale: >-
    Most studies pool PLEVA with PLC, use heterogeneous response definitions,
    and have short follow-up. PLEVA-specific comparative evidence is therefore
    insufficient for a high-certainty treatment hierarchy.
  evidence:
  - reference: PMID:32112390
    reference_title: "Systematic review of the efficacies and adverse effects of treatments for pityriasis lichenoides."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The current literature consists almost entirely of uncontrolled studies,
      and none provides compelling data to support an evidence-based approach
      to PL treatment.
    explanation: >-
      This systematic review directly identifies the evidence-quality gap while
      noting that its corpus did include two randomized studies.
- discussion_id: fumhd_optimal_treatment
  prompt: Which systemic therapy improves FUMHD survival, and how should immunosuppression be balanced against sepsis risk?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Prompt systemic and supportive management for FUMHD
  - treatments#Methotrexate therapy for refractory or severe disease
  - treatments#Intravenous immunoglobulin (IVIG) for FUMHD
  - treatments#TNF-alpha inhibitor therapy for FUMHD
  - treatments#Ciclosporin therapy for FUMHD
  rationale: >-
    FUMHD management rests on heterogeneous single cases and small reviews with
    no controlled trials, so no regimen is proven by RCT-grade evidence and the
    tradeoff between immunosuppression and infectious mortality is unresolved. A
    pooled review nonetheless signals that systemic corticosteroids combined with
    methotrexate or ciclosporin are associated with significantly more effective
    outcomes, suggesting early combination therapy as a candidate optimal
    approach that still needs prospective validation.
  evidence:
  - reference: PMID:36483219
    reference_title: "Mortality risk factors in febrile ulceronecrotic Mucha- Habermann disease: A systematic review of therapeutic outcomes and complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FUMHD is a diagnostic and therapeutic challenge due to the lack of clearly
      defined diagnostic criteria and optimum treatment.
    explanation: This directly supports the absence of an established optimal FUMHD treatment.
  - reference: PMID:35950146
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease: A Case Report and a Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systematic corticosteroids combination with other immunosuppressants
      (methotrexate or cyclosporine) were associated with significantly more
      effective cases (26/31 = 83.9%, χ2 = 4.065, p = 0.044)
    explanation: >-
      A pooled analysis provides the strongest quantitative treatment signal,
      partially qualifying the optimal-regimen gap.
- discussion_id: fumhd_escalation_driver
  prompt: What molecular driver determines why only a minority of PLEVA patients escalate to fulminant, systemic FUMHD?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Ulceronecrotic systemic inflammatory escalation in FUMHD
  rationale: >-
    FUMHD shares the cytotoxic-T-cell PLEVA mechanism but adds fever, coalescing
    ulceronecrosis, and systemic/HLH-range hyperinflammation. The host or
    lesional factors that tip a minority of PLEVA patients into this severe,
    sometimes fatal branch are unknown, and no biomarker predicts escalation.
  evidence:
  - reference: PMID:38959922
    reference_title: "Febrile ulceronecrotic Mucha-Habermann disease - a case and treatment review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Febrile ulceronecrotic Mucha-Habermann disease is a rare and severe
      variant of pityriasis lichenoides, characterized by sudden onset of
      generalized ulceronecrotic papules that rapidly coalesce into ulcers
      associated with high fever.
    explanation: The severe-variant framing motivates the open question of what drives escalation.

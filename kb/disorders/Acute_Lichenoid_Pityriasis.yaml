    term:
      id: HP:0000989
      label: Pruritus
  evidence:
  - reference: PMID:32112390
    reference_title: "Systematic review of the efficacies and adverse effects of treatments for pityriasis lichenoides."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "topical corticosteroids were found to have been trialled in the highest number of patients."
    explanation: This supports common use, not high-certainty efficacy.
  - reference: PMID:23488769
    reference_title: "Pityriasis lichenoides in an Asian population."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all patients did not respond to topical corticosteroids."

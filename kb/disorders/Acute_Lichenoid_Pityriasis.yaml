  evidence:
  - reference: PMID:31318465
    reference_title: "A systematic review of treatments for pityriasis lichenoides."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "methotrexate up to 100% but in small and dated studies."
    explanation: >-
      The review documents a high reported clearance ceiling while explicitly

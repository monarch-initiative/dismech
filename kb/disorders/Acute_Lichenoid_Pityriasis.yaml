- name: Keratinocyte death and epidermal necrosis
  description: >-
    PLEVA lesions can show vacuolar change, necrotic keratinocytes, and focal
    epidermal necrosis. Epidermal disruption is a plausible contributor to
    vesiculation, crusting, small ulcers, dyspigmentation, and scars, but these
    outcomes are not an obligatory causal sequence.

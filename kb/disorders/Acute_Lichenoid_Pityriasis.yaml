environmental:
- name: Temporally associated infectious, medication, and vaccination exposures
  description: >-
    Infections, medications, and vaccinations have preceded PL or PLEVA in
    reports and small cohorts. These observations support an antigen-trigger
    hypothesis only; they do not prove that a specific exposure caused PLEVA,
    and PLEVA-specific lesion testing did not detect the common viruses assayed.
  evidence:
  - reference: PMID:38677323
    reference_title: "Pityriasis lichenoides: assessment of 41 pediatric patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency peaks coincided with infectious outbreaks."
    explanation: >-
      The cohort supports temporal clustering for pediatric PL, but included
      mostly PLC and does not prove a PLEVA cause.
  - reference: PMID:36688177
    reference_title: "Pityriasis Lichenoides Following SARS-CoV-2 Infection/Vaccination."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This review cannot determine causality. However, a temporal association
      was observed with the case reports
    explanation: >-
      The review supports only a temporal SARS-CoV-2 infection or vaccination
      association and explicitly rejects causal certainty.
  - reference: PMID:25816855
    reference_title: "Pityriasis Lichenoides in Childhood: Review of Clinical Presentation and Treatment Options."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The proposed etiologies are discussed, including its association with
      infectious agents, medications, and immunizations and evidence for PL as
      a lymphoproliferative disorder.
    explanation: >-
      This mixed-spectrum review documents the reported exposure categories
      without establishing that any exposure causes PLEVA.
  - reference: PMID:38973067
    reference_title: "Immunophenotyping and viral studies in pityriasis lichenoides et varioliformis acuta lesions."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Viral presence was not detected."
    explanation: >-
      PLEVA-specific lesional testing did not support persistent presence of
      the assayed viruses, constraining a direct viral-infection interpretation.
diagnosis:
- name: Clinical morphology with skin biopsy and clinicopathologic correlation
  description: >-
    Lesions at several stages suggest PLEVA, but biopsy is commonly needed
    because inflammatory eruptions and cutaneous lymphoproliferative disorders
    can mimic it. Histology must be interpreted with the distribution, lesion
    evolution, and clinical course.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  results: >-
    Supportive findings include interface or lichenoid dermatitis, vacuolar
    change or necrotic keratinocytes, superficial and deep lymphocytes,
    lymphocytes in adnexal epithelium, perivascular or intraepidermal
    erythrocytes, and a CD8/TIA-1-rich infiltrate. No single feature is
    pathognomonic.
  evidence:
  - reference: PMID:37155724
    reference_title: "Acute lichenoid and varioliform pityriasis in a pediatric patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is made by clinical suspicion and confirmed by histology."
    explanation: This directly supports clinical suspicion followed by histologic confirmation.
  - reference: PMID:31880634
    reference_title: "Pityriasis Lichenoides: A Large Histopathological Case Series With a Focus on Adnexotropism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the histopathological assessment of a biopsy is sometimes needed to
      differentiate between PL and a range of other diseases.
    explanation: >-
      This mixed-PL series supports biopsy for difficult differentials.
  - reference: PMID:31880634
    reference_title: "Pityriasis Lichenoides: A Large Histopathological Case Series With a Focus on Adnexotropism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      both superficial and deep lymphocytic infiltrates (99%), and the
      infiltration of lymphocytes into the adnexal epithelium (97%).
    explanation: >-
      This large mixed-PL series supplies the deep and adnexal infiltrate
      findings but did not stratify them by PLEVA versus PLC.
- name: Dermoscopy as a noninvasive diagnostic adjunct
  description: >-
    Punctate or glomerular vessels and erythematous globules around an orange
    or crusted center can support a rapid clinical impression, but dermoscopy
    does not replace biopsy when the diagnosis or lymphoma differential remains
    uncertain.
  results: >-
    Punctate or glomerular vessels and erythematous globules surrounding a
    homogeneous orange or crusty central area.
  evidence:
  - reference: PMID:37847066
    reference_title: "Dermoscopy as a diagnostic aid in pityriasis lichenoides et varioliformis acuta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Observation of the dermatoscopic findings described, such as punctate or
      glomerular vessels and erythematous globules surrounding a homogeneous
      orange or crusty central area, may allow for a rapid diagnosis, avoiding
      the need for invasive techniques.
    explanation: This three-case PLEVA report supports dermoscopy as an adjunct.
- name: Clinicopathologic and phenotypic assessment of atypical or persistent lesions
  description: >-
    For atypical or persistent lesions, or when mycosis fungoides or
    lymphomatoid papulosis is considered, complete phenotypic analysis should be
    integrated with morphology and clinical course. Molecular clonality should
    not be interpreted alone.
  results: >-
    In one comparative series, molecular clonality did not differ meaningfully
    among conventional PL, atypical PL, lymphomatoid papulosis, and mycosis
    fungoides, making an isolated clonality result nondiscriminating.
  evidence:
  - reference: PMID:29851705
    reference_title: "Pityriasis Lichenoides, Atypical Pityriasis Lichenoides, and Related Conditions: A Study of 66 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      clinicopathologic correlation and complete phenotypic analyses are
      paramount in order to achieve proper classification.
    explanation: >-
      This study of conventional PL, atypical PL, LyP, and MF supports integrated
      classification rather than reliance on a single marker.
  - reference: PMID:29851705
    reference_title: "Pityriasis Lichenoides, Atypical Pityriasis Lichenoides, and Related Conditions: A Study of 66 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analyses of clonality of the infiltrate did not reveal relevant
      differences among these 4 groups.
    explanation: >-
      Clonality alone did not distinguish conventional PL, atypical PL,
      lymphomatoid papulosis, and mycosis fungoides in this series.
- name: Clinicopathologic diagnosis of FUMHD with proposed criteria
  description: >-
    FUMHD is diagnosed clinicopathologically; Nofal et al. proposed a
    constant-plus-variable diagnostic-criteria framework, the closest to formal
    FUMHD criteria in the absence of a consensus definition.
  results: >-
    Constant clinical and histopathological features present in every case,
    combined with variable features present in some cases.
  evidence:
  - reference: PMID:26695875
    reference_title: "Febrile ulceronecrotic Mucha-Habermann disease: proposed diagnostic criteria and therapeutic evaluation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The first comprises constant clinical and histopathological features that
      are always present in every case
    explanation: Nofal et al. proposed a constant-plus-variable diagnostic-criteria framework for FUMHD.
differential_diagnoses:
- name: Pityriasis lichenoides chronica
  description: >-
    PLC is the chronic pole of the PL spectrum and may coexist or overlap with
    PLEVA. The distinction rests on the tempo and morphology of lesions plus
    clinicopathologic correlation rather than a rigid binary histologic test.
  distinguishing_features:
  - PLC has a more chronic, scaling papular course; PLEVA has abrupt papulovesicular or papulonecrotic crops.
  - Clinical and histopathologic overlap is common, so mixed presentations should be acknowledged.
  evidence:
  - reference: PMID:25816855
    reference_title: "Pityriasis Lichenoides in Childhood: Review of Clinical Presentation and Treatment Options."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is often classified into the acute form, pityriasis lichenoides et
      varioliformis acuta (PLEVA), and the chronic form, pityriasis lichenoides
      chronica (PLC).
    explanation: This review directly establishes the acute/chronic spectrum boundary.
  - reference: PMID:25816855
    reference_title: "Pityriasis Lichenoides in Childhood: Review of Clinical Presentation and Treatment Options."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in many cases, there is clinical and histopathologic overlap between the
      two phenotypes.
    explanation: This supports caution against treating PLEVA and PLC as perfectly separable.
- name: Cutaneous CD8-positive necrotizing angiocentric lymphoproliferative disease
  description: >-
    Severe FUMHD can mimic an aggressive CD8-positive angiocentric cutaneous
    T-cell lymphoproliferative disease, and the atypical lymphomatoid
    immunophenotype makes this the key differential for the FUMHD severity
    variant. It is the natural clinical partner to the atypical CD8-positive
    lymphomatoid histopathology of FUMHD.
  distinguishing_features:
  - FUMHD is self-limited/reactive and typically lacks a persistent monoclonal aggressive lymphoma course; clinicopathologic correlation and follow-up distinguish it.
  evidence:
  - reference: PMID:38457671
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease Associated With Hemophagocytic Lymphohistiocytosis: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FUMHD should be considered in the differential diagnosis for patients
      presenting with cutaneous CD8 + necrotizing angiocentric
      lymphoproliferative disease complicated by HLH.
    explanation: This FUMHD paper directly frames the aggressive angiocentric CTCL differential.
- name: Lymphomatoid papulosis
  disease_term:
    preferred_term: lymphomatoid papulosis
    term:
      id: MONDO:0020326
      label: lymphomatoid papulosis
  description: >-
    Lymphomatoid papulosis can also produce recurrent self-healing papules and
    may be mistaken for atypical PL.
  distinguishing_features:
  - Waxing and waning papules or nodules with a CD30-positive atypical lymphoid infiltrate favor lymphomatoid papulosis.
  evidence:
  - reference: PMID:29851705
    reference_title: "Pityriasis Lichenoides, Atypical Pityriasis Lichenoides, and Related Conditions: A Study of 66 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphomatoid papulosis (waxing and waning lesions and positivity for CD30)"
    explanation: This study directly identifies the key clinical and immunophenotypic distinction.
- name: Mycosis fungoides
  disease_term:
    preferred_term: mycosis fungoides
    term:
      id: MONDO:0009691
      label: mycosis fungoides
  description: >-
    Early or PL-like mycosis fungoides can overlap clinically and
    histologically with prolonged or atypical pityriasis lichenoides.
  distinguishing_features:
  - Persistent patches or larger plaques, increasing nuclear atypia, marked CD7/CD8 diminution, and concordant clonal TCR findings raise concern for MF.
  - Serial clinicopathologic assessment is more informative than clonality alone.
  evidence:
  - reference: PMID:29210716
    reference_title: "Relationship Between Pityriasis Lichenoides and Mycosis Fungoides: A Clinicopathological, Immunohistochemical, and Molecular Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prolonged clinical course, appearance of patches and larger plaques,
      markedly increased lymphocytic nuclear atypia, marked diminution of
      apoptotic keratinocytes and CD7 and CD8 lymphocytes, and clonal T-cell
      receptor gene rearrangement may serve as clues.
    explanation: This PL follow-up study directly lists features concerning for MF.
- name: Guttate psoriasis
  disease_term:
    preferred_term: guttate psoriasis
    term:
      id: MONDO:0023297
      label: guttate psoriasis
  description: >-
    Guttate psoriasis can mimic the acute disseminated scaly papules of PLEVA.
  distinguishing_features:
  - PLEVA lesions evolve through vesiculation, hemorrhagic necrosis, and crusting, while clinicopathologic biopsy can resolve uncertain cases.
  evidence:
  - reference: DOI:10.70672/bcfbzp08
    reference_title: "Diagnostic Challenges of Pityriasis Lichenoides et Varioliformis Acuta (PLEVA)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A provisional diagnosis of guttate psoriasis with PLEVA as the
      differential diagnosis was made after a thorough history and examination.
    explanation: This PLEVA case directly documents the guttate-psoriasis diagnostic overlap.
- name: Varicella
  description: >-
    Early PLEVA may resemble varicella because both can present with an acute
    vesicular or crusted eruption.
  distinguishing_features:
  - Fever and mucous-membrane involvement favor varicella, while PLEVA generally has a more prolonged course.
  evidence:
  - reference: DOI:10.1007/s13671-013-0054-x
    reference_title: "Pityriasis Lichenoides and Cutaneous T Cell Lymphoma: An Update on the Diagnosis and Management of the Most Common Benign and Malignant Cutaneous Lymphoproliferative Diseases in Children"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In its early presentations, the condition may be confused with varicella."
    explanation: This pediatric review directly identifies varicella as an early mimic.
  - reference: DOI:10.1007/s13671-013-0054-x
    reference_title: "Pityriasis Lichenoides and Cutaneous T Cell Lymphoma: An Update on the Diagnosis and Management of the Most Common Benign and Malignant Cutaneous Lymphoproliferative Diseases in Children"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      lack the typical fever and mucous membrane involvement seen in varicella,
      and the course of PLEV A is considerably more prolonged.
    explanation: This review supplies the main clinical distinctions.
treatments:
- name: Narrowband UVB phototherapy
  description: >-
    Narrowband UVB is the best-supported active treatment in pooled PL
    literature and is commonly favored when observation, topical measures, or
    antibiotics are insufficient. Evidence combines PLEVA and PLC, consists
    mostly of uncontrolled studies, and is vulnerable to spontaneous
    resolution and short follow-up.
  treatment_term:
    preferred_term: phototherapy
    term:
      id: NCIT:C15301
      label: Phototherapy
  target_phenotypes:
  - preferred_term: Papulovesicular eruption
    term:
      id: HP:0033700
      label: Papulovesicular eruption
  - preferred_term: Scaling skin
    term:
      id: HP:0040189
      label: Scaling skin
  evidence:
  - reference: PMID:31318465
    reference_title: "A systematic review of treatments for pityriasis lichenoides."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "According to the results of this review, we suggest narrow-band UVB phototherapy as first-line treatment."
    explanation: >-
      This systematic review supports NB-UVB as a proposed first-line PL
      treatment, but pooled acute and chronic disease.
  - reference: PMID:32112390
    reference_title: "Systematic review of the efficacies and adverse effects of treatments for pityriasis lichenoides."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "phototherapy led to complete remission in the highest proportion of patients"
    explanation: >-
      The pooled PL review favors phototherapy but concludes that evidence is
      not compelling enough for a high-certainty evidence-based approach.
- name: Oral erythromycin therapy
  description: >-
    Oral erythromycin is a commonly proposed initial systemic option,
    particularly in children. Its benefit may be anti-inflammatory rather than
    proof of an active bacterial cause, and response estimates are drawn from
    mixed PL cohorts.
  treatment_term:
    preferred_term: antimicrobial agent therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
  target_phenotypes:
  - preferred_term: Papulovesicular eruption
    term:
      id: HP:0033700
      label: Papulovesicular eruption
  evidence:
  - reference: PMID:8864599
    reference_title: "Mucha-Habermann disease and its febrile ulceronecrotic variant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "beginning with oral antibiotics, usually erythromycin, is recommended."
    explanation: This PLEVA/Mucha-Habermann review supports pediatric initial use.
  - reference: PMID:31318465
    reference_title: "A systematic review of treatments for pityriasis lichenoides."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Oral erythromycin showed clearance rates ranging between 66% and 83%"
    explanation: The estimate comes from pooled PL studies and is not PLEVA-stratified.
- name: Topical corticosteroid therapy
  description: >-
    Topical corticosteroids may be tried for inflammatory symptoms or itch, but
    they should not be presented as reliably disease-clearing monotherapy.
  treatment_term:
    preferred_term: topical corticosteroid therapy
    term:
      id: NCIT:C122078
      label: Topical Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_phenotypes:

pathophysiology:
- name: T-cell-predominant lichenoid cutaneous inflammation
  description: >-
    PLEVA lesions reflect cutaneous immune activation with lichenoid/interface
    inflammation and keratinocyte injury, producing papulonecrotic eruptions.
  downstream:
  - target: Papules
    description: Interface inflammation and keratinocyte injury produce crops of erythematous papules.
    causal_link_type: DIRECT
  - target: Skin ulcer
    description: Interface lymphocytic inflammation with focal epidermal necrosis can progress to crusting and ulceration.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Focal epidermal necrosis
    evidence:
    - reference: PMID:37155724
      reference_title: Acute lichenoid and varioliform pityriasis in a pediatric patient.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        lymphocytic vasculitis (LV) with focal epidermal necrosis consistent with acute
        pityriasis lichenoides (PL) was identified.
      explanation: This biopsy-confirmed case directly links interface lymphocytic inflammation to focal epidermal necrosis, the histologic correlate of necrotic/ulcerative lesions.
  - target: Scaling skin
    description: Interface inflammation of this papulosquamous dermatosis produces overlying scale.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Pruritus
    description: Cutaneous inflammation is accompanied by pruritus in a majority of patients.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

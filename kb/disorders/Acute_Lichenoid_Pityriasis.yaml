  treatment_term:
    preferred_term: methotrexate therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_phenotypes:
  - preferred_term: Papulovesicular eruption
    term:
      id: HP:0033700
      label: Papulovesicular eruption
  - preferred_term: Skin ulcer

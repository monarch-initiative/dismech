has_subtypes:
- name: Febrile ulceronecrotic Mucha-Habermann disease
  display_name: Febrile Ulceronecrotic Mucha-Habermann Disease (FUMHD)
  classification: clinical_severity_variant
  subtype_term:
    preferred_term: febrile ulceronecrotic Mucha-Habermann disease
    term:
      id: MONDO:0023134
      label: febrile ulceronecrotic Mucha-Habermann disease
  description: >-
    FUMHD is a rare, severe PLEVA variant, not the usual presentation of
    ordinary PLEVA. Generalized ulceronecrotic papules rapidly coalesce into
    ulcers with high fever; disseminated intravascular coagulation and
    pulmonary, cardiac, gastrointestinal, or central nervous system
    involvement may occur. Mortality is concentrated in this subtype, so its
    systemic findings and aggressive management must not be generalized to
    uncomplicated PLEVA.
  evidence:
  - reference: PMID:36483219
    reference_title: "Mortality risk factors in febrile ulceronecrotic Mucha- Habermann disease: A systematic review of therapeutic outcomes and complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Febrile Ulceronecrotic Mucha- Habermann Disease (FUMHD) is a variant of
      Pityriasis Lichenoides Et Varioliformis Acuta (PLEVA).
    explanation: >-
      This systematic review directly defines FUMHD as a PLEVA variant.
  - reference: PMID:38959922
    reference_title: "Febrile ulceronecrotic Mucha-Habermann disease - a case and treatment review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Febrile ulceronecrotic Mucha-Habermann disease is a rare and severe
      variant of pityriasis lichenoides, characterized by sudden onset of
      generalized ulceronecrotic papules that rapidly coalesce into ulcers
      associated with high fever.
    explanation: >-
      The review supplies the defining ulceronecrotic and febrile phenotype.
  - reference: PMID:34287852
    reference_title: "Mucha-Habermann disease: a pediatric case report and proposal of a risk score."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall lethality was 14/119 (12%, CI 6-17%), and lethality in children
      was lower (1/54, 2%, CI 0-6%) compared to adults (13/65, 20%, CI 11-31%).
    explanation: >-
      The 119-case review quantifies the mortality confined to the FUMHD
      literature and shows the strong age gradient.
  - reference: PMID:35950146
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease: A Case Report and a Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of them were male (62/83, 74.7%), with high fever state (50/80, 62.5%
      had a high fever of 39°C or above)
    explanation: >-
      A pooled FUMHD review quantifies the male predominance and high-fever
      frequency across reported cases.
prevalence:
- population: General population
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    PLEVA is rare, but a reliable population prevalence or incidence has not
    been established. Referral-series proportions within the broader PL
    spectrum should not be interpreted as population prevalence.
  evidence:
  - reference: PMID:31334928
    reference_title: "An Atypical Presentation of PLEVA: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pityriasis lichenoides et varioliformis acuta (PLEVA) is a rare,
      self-limited, cutaneous disorder of unknown etiology.
    explanation: >-
      This PLEVA-specific review supports the qualitative rarity statement,
      while not providing a population rate.
- population: Reported case literature
  subtype: Febrile ulceronecrotic Mucha-Habermann disease
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    FUMHD is very rare and described mainly in single cases and small
    case-literature reviews; one systematic case review aggregated 119 patients.
    No reliable population incidence or prevalence has been established. Reported
    cases show a clear male predominance (roughly three-quarters male).
  evidence:
  - reference: PMID:34287852
    reference_title: "Mucha-Habermann disease: a pediatric case report and proposal of a risk score."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall lethality was 14/119 (12%, CI 6-17%), and lethality in children
      was lower (1/54, 2%, CI 0-6%) compared to adults (13/65, 20%, CI 11-31%).
    explanation: >-
      The 119-case review defines the size of the reported FUMHD literature and
      is used here only to convey rarity, not a population rate.
  - reference: PMID:35950146
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease: A Case Report and a Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of them were male (62/83, 74.7%), with high fever state (50/80, 62.5%
      had a high fever of 39°C or above)
    explanation: >-
      A pooled FUMHD systematic review quantifies the male predominance and the
      high-fever frequency across reported cases.
progression:
- phase: Acute papulovesicular eruption
  duration: The eruption typically resolves over weeks to months
  notes: >-
    PLEVA begins abruptly or subacutely with polymorphous lesions that can range
    from macules and papules to hemorrhagic papules and ulcers. The simultaneous
    presence of lesions at several stages is a useful clinical clue.
  evidence:
  - reference: PMID:8864599
    reference_title: "Mucha-Habermann disease and its febrile ulceronecrotic variant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In 1916 Mucha and in 1925 Habermann reported an acute form of pityriasis
      lichenoides characterized by the abrupt onset of papulovesicular eruptions
      and gave the name, pityriasis lichenoides et varioliformis acuta (PLEVA)
      or Mucha-Habermann disease (MH).
    explanation: >-
      This directly supports the abrupt papulovesicular onset that defines
      PLEVA.
  - reference: PMID:37847066
    reference_title: "Dermoscopy as a diagnostic aid in pityriasis lichenoides et varioliformis acuta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of pityriasis lichenoides et varioliformis acuta (PLEVA) is
      based on the characteristic pattern of lesions in different stages of
      development, ranging from erythematous maculopapules to papules with a
      crusted and/or necrotic centre.
    explanation: >-
      This PLEVA case series supports staged lesion evolution and polymorphism.
  - reference: DOI:10.1007/s13671-023-00380-1
    reference_title: "Pityriasis Lichenoides Following SARS-CoV-2 Infection/Vaccination"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      PLEVA onsets acutely/subacutely with the eruption of polymorphous lesions
      ranging from macules, to hemorrhagic papules, to ulcers
    explanation: >-
      This review supports the acute-to-subacute polymorphous eruption but is
      not a prospective natural-history study.
  - reference: DOI:10.1007/s13671-023-00380-1
    reference_title: "Pityriasis Lichenoides Following SARS-CoV-2 Infection/Vaccination"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "typically resolves within weeks to months"
    explanation: >-
      This review supplies the broad resolution interval without asserting a
      recurrence pattern.
- phase: Healing with dyspigmentation or varioliform scarring
  notes: >-
    Necrotic lesions may heal with residual hypopigmented or hyperpigmented
    macules and, when dermal injury is sufficient, varioliform scars. These are
    sequelae, not evidence that every lesion ulcerates or scars.
  evidence:
  - reference: DOI:10.35755/jmedassocthai.2025.5.377-383-02606
    reference_title: "Pityriasis Lichenoides in Thai Children: A 10-Years Review of Clinical and Treatment Outcome"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dyspigmentation was predominantly observed in PLC, whereas varioliform
      scarring was more common in PLEVA (p<0.05).
    explanation: >-
      This retrospective pediatric series directly compared the spectrum
      subtypes but included only ten PLEVA cases.
  - reference: PMID:37155724
    reference_title: "Acute lichenoid and varioliform pityriasis in a pediatric patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple erythematous lesions that disappeared leaving hypopigmented macules."
    explanation: >-
      This PLEVA case directly supports post-inflammatory hypopigmentation.
- phase: Febrile ulceronecrotic systemic branch
  subtype: Febrile ulceronecrotic Mucha-Habermann disease
  notes: >-
    A small subset develops FUMHD, with rapid coalescence of ulceronecrotic
    lesions, high fever, and possible systemic complications. This is a severe
    branch rather than an obligatory stage of ordinary PLEVA.
  evidence:
  - reference: PMID:38959922
    reference_title: "Febrile ulceronecrotic Mucha-Habermann disease - a case and treatment review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systemic manifestations such as intravascular disseminated coagulation
      and pulmonary, cardiac, gastrointestinal, and central nervous system
      involvement are common.
    explanation: >-
      This review directly supports the systemic-complication branch in FUMHD.
mechanistic_hypotheses:
- hypothesis_group_id: cytotoxic_t_cell_epidermal_injury_model
  hypothesis_label: Cytotoxic T-Cell Epidermal Injury Model
  status: EMERGING
  description: >-
    CD8-positive, TIA-1-positive cytotoxic T cells accumulate in PLEVA lesions
    and may contribute to epidermal keratinocyte injury, interface damage, and
    the papulonecrotic eruption. Their causal effector function has not been
    directly demonstrated.
  notes: >-
    PLEVA-specific human tissue supports cytotoxic-cell enrichment and an
    inferred epidermal-damage role. The antigen, effector repertoire, and exact
    death pathway remain unresolved, so this model should not be expanded into
    unsupported molecular signaling claims.
  evidence:
  - reference: PMID:38973067
    reference_title: "Immunophenotyping and viral studies in pityriasis lichenoides et varioliformis acuta lesions."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The predominant T-cell infiltrate in PLEVA is dominated by CD8+ cells,
      and by increased numbers of TIA1+ cells, which may indicate a cytotoxic
      T-cell damage to the epidermis.
    explanation: >-
      PLEVA-specific immunophenotyping supports marker enrichment and an
      inferred damage role while retaining the authors' causal qualification.
- hypothesis_group_id: reactive_antigen_trigger_model
  hypothesis_label: Reactive Antigen-Trigger Model
  status: ALTERNATIVE
  description: >-
    An infection, medication, vaccine, or other antigenic exposure initiates a
    postinfectious or hypersensitivity-like cutaneous T-cell response in a
    susceptible person.
  notes: >-
    Evidence is temporal and epidemiologic rather than causal. Negative viral
    testing in PLEVA lesions argues against persistent presence of the common
    viruses assayed, but does not exclude a cleared infection, an untested
    agent, or a noninfectious antigen.
  evidence:
  - reference: PMID:8864599
    reference_title: "Mucha-Habermann disease and its febrile ulceronecrotic variant."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The etiology of MH remains obscure, but it may be the result of a
      hypersensitivity reaction to an infectious agent.
    explanation: >-
      This review states the reactive hypothesis but explicitly preserves its
      uncertainty.
  - reference: PMID:38973067
    reference_title: "Immunophenotyping and viral studies in pityriasis lichenoides et varioliformis acuta lesions."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Viral presence was not detected."
    explanation: >-
      Negative lesional testing constrains a direct persistent-virus version of
      the model without excluding an antigen-triggered reaction.
- hypothesis_group_id: clonal_t_cell_dyscrasia_model
  hypothesis_label: Clonal T-Cell Dyscrasia Model
  status: ALTERNATIVE
  description: >-
    PLEVA may in some patients reflect a clonal or oligoclonal cutaneous T-cell
    dyscrasia rather than a purely polyclonal reactive dermatitis.
  notes: >-
    The strongest clonality study used a selected, mixed PL cohort and does not
    establish that ordinary PLEVA is lymphoma or that clonality predicts
    transformation. Clinicopathologic correlation is essential.
  evidence:
  - reference: PMID:12203210
    reference_title: "Pityriasis lichenoides: a clonal T-cell lymphoproliferative disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Clonality was shown in 25 of 27 biopsies in which amplifiable DNA was obtained."
    explanation: >-
      This selected mixed-PL study supports a clonal-dyscrasia model, but its
      cohort included only seven PLEVA cases and cannot define all PLEVA.
- hypothesis_group_id: systemic_hyperinflammatory_escalation_model
  hypothesis_label: Systemic Hyperinflammatory Escalation Model
  status: EMERGING
  description: >-
    In the FUMHD severity variant, the cutaneous cytotoxic process is
    accompanied by high fever and systemic inflammation, and in extreme cases
    can meet criteria for hemophagocytic lymphohistiocytosis (HLH), suggesting a
    hyperinflammatory escalation beyond ordinary PLEVA. Whether HLH is a driver
    or a downstream complication of severe FUMHD is unresolved.
  notes: >-
    Evidence is limited to case-level associations. The HLH association is a
    single-case observation and should be read as an illustrative severe-end
    phenotype, not an established obligatory mechanism. Applies only to the FUMHD
    subtype, not to uncomplicated PLEVA.
  evidence:
  - reference: PMID:38457671
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease Associated With Hemophagocytic Lymphohistiocytosis: A Case Report and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient also met 7 of 9 HLH-2004 criteria, leading to a diagnosis of HLH."
    explanation: >-
      A single FUMHD case reaching HLH-2004 criteria illustrates the
      hyperinflammatory severe end, without establishing HLH as an obligatory
      FUMHD mechanism.
pathophysiology:
- name: Antigen-associated immune triggering
  description: >-
    In the reactive model, an unidentified infectious or noninfectious antigen
    precedes cutaneous immune activation. The association is not equivalent to
    proof of infection within the lesion.
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: immune response
    modifier: ABNORMAL
    term:
      id: GO:0006955
      label: immune response
  evidence:
  - reference: PMID:38677323
    reference_title: "Pityriasis lichenoides: assessment of 41 pediatric patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency peaks coincided with infectious outbreaks."
    explanation: >-
      Temporal clustering in a pediatric PL cohort is compatible with an
      infectious trigger but is not PLEVA-specific and does not establish
      causality.
  downstream:
  - target: CD8-positive cytotoxic T-cell epidermal response
    description: >-
      The reactive model proposes that antigen exposure activates and recruits
      a cytotoxic cutaneous T-cell response.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - reactive_antigen_trigger_model
    evidence:
    - reference: PMID:8864599
      reference_title: "Mucha-Habermann disease and its febrile ulceronecrotic variant."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        The etiology of MH remains obscure, but it may be the result of a
        hypersensitivity reaction to an infectious agent.
      explanation: >-
        The review supports the proposed upstream hypersensitivity route, not
        the identity of an antigen or the intermediate immune steps.
- name: Clonal or oligoclonal cutaneous T-cell expansion
  description: >-
    In the dyscrasia model, a lesional T-cell clone or oligoclonal population
    expands in skin and contributes to the PLEVA inflammatory phenotype.
    Clonality is neither universal nor by itself diagnostic of lymphoma. In the
    FUMHD severity variant, a monoclonal T-cell receptor rearrangement has been
    documented in a subset of cases and is associated with worse prognosis,
    placing those cases on a continuum with cutaneous T-cell lymphoma.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell activation
    modifier: ABNORMAL
    term:
      id: GO:0042110
      label: T cell activation
  evidence:
  - reference: PMID:12203210
    reference_title: "Pityriasis lichenoides: a clonal T-cell lymphoproliferative disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intraepithelial atypical lymphocytes, phenotypic abnormalities, and
      TCR-gamma rearrangements suggest that PLC and PLEVA are a form of T-cell
      dyscrasia.
    explanation: >-
      The authors interpret their selected mixed cohort as supporting a
      dyscrasia; this is retained as an alternative model rather than a settled
      classification.
  - reference: PMID:15583604
    reference_title: "Febrile ulceronecrotic Mucha-Habermann disease with clonality: a cutaneous T-cell lymphoma entity?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report two cases of FUMHD with monoclonal T-cell population, as detected
      by Southern blot analysis
    explanation: >-
      This directly documents a monoclonal T-cell population in FUMHD lesions in
      a subset of cases (FUMHD subtype-specific).
  - reference: PMID:36483219
    reference_title: "Mortality risk factors in febrile ulceronecrotic Mucha- Habermann disease: A systematic review of therapeutic outcomes and complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased age, systemic involvement, and monoclonal T-cell receptor
      rearrangement were associated with worst prognosis, but mucosal
      involvement did not affect mortality risk
    explanation: >-
      The FUMHD systematic review associates monoclonal TCR rearrangement with
      worse prognosis, supporting the clonal modifier arm in the FUMHD subtype.
  downstream:
  - target: CD8-positive cytotoxic T-cell epidermal response
    description: >-
      The clonal model proposes convergence on the same cytotoxic lesional
      effector population observed by PLEVA immunophenotyping.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - clonal_t_cell_dyscrasia_model
    evidence:
    - reference: PMID:12203210
      reference_title: "Pityriasis lichenoides: a clonal T-cell lymphoproliferative disorder."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In general, CD8-positive lymphocytes dominated in cases of PLEVA"
      explanation: >-
        This supports CD8 predominance in the PLEVA subset of the clonality
        cohort, but not a proven causal transition from clonality to effector
        activity.
- name: CD8-positive cytotoxic T-cell epidermal response
  description: >-
    PLEVA lesions contain increased CD8-positive and TIA-1-positive T cells.

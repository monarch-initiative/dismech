histopathology:
- name: Amyloid deposition in cerebral arteries and arterioles
  description: >-
    Heavy amyloid deposits in the walls of small cerebral arteries and
    arterioles, most prominent in the media of parenchymal vessels and the
    adventitia of leptomeningeal vessels, with sparing of capillaries and veins.
  evidence:
  - reference: PMID:9063500
    reference_title: Microvascular degeneration in hereditary cystatin C amyloid angiopathy of the brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cystatin C deposition was more prominent in the media of parenchymal vessels and in the adventitia of leptomeningeal vessels."
    explanation: >-
      Defines the layer-specific distribution of deposits seen on
      immunohistochemistry.
- name: Extracellular matrix accumulation in the arterial wall
  description: >-
    Affected leptomeningeal arteries show collagen IV and aggrecan deposition,
    thickened laminin distribution, intimal thickening with a frayed elastic
    layer, and variable loss of endothelial integrity.
  evidence:
  - reference: PMID:23973860
    reference_title: Deposition of collagen IV and aggrecan in leptomeningeal arteries of hereditary brain haemorrhage with amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other structural abnormalities were thickening of the laminin distribution, intimal thickening concomitant with a frayed elastic layer, and variable reduction in the integrity of endothelia."
    explanation: >-
      Enumerates the additional structural wall abnormalities found at
      post-mortem.
- name: Cystatin C deposition in skin basement membrane
  description: >-
    In carriers, cystatin C deposits first in the dermal-epidermal basement
    membrane and extend to other basement membrane regions as disease advances,
    always in close association with collagen IV.
  evidence:
  - reference: PMID:28067897
    reference_title: Pathological changes in basement membranes and dermal connective tissue of skin from patients with hereditary cystatin C amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the deposits were more advanced, they extended to other BM regions in the skin."
    explanation: >-
      Documents the staged extension of skin basement membrane deposition with
      disease progression.
biochemical:
- name: Cerebrospinal fluid cystatin C
  notes: >-

genetic:
- name: CST3
  gene_term:
    preferred_term: CST3
    term:
      id: hgnc:2475
      label: CST3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A single T-to-A substitution in codon 68 of CST3 replaces leucine with
    glutamine (L68Q) in cystatin C. This is the sole known cause of HCCAA; every
    examined patient carries the same founder allele, heterozygously, and the
    mutation abolishes an AluI restriction site, which historically enabled
    simple RFLP-based diagnosis.
  variants:
  - name: CST3 L68Q
    description: >-
      Founder missense variant in exon 2 of CST3 (T-to-A at the codon for leucine
      68), replacing leucine with glutamine. Carried heterozygously by every
      known HCCAA patient and traced to a single common ancestor.
    evidence:
    - reference: PMID:8097919
      reference_title: Molecular diagnosis of hereditary cystatin C amyloid angiopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HCCAA has been shown to be caused by a T-->A point mutation in the codon for leucine at position 68 in exon 2 of the cystatin C gene, which results in a leucine-->glutamine amino acid substitution in the cystatin C molecule."
      explanation: >-
        Specifies the exact nucleotide and amino acid change and its exon
        location.
  evidence:

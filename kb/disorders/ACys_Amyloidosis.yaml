- cerebral amyloid angiopathy
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    HCCAA segregates as a highly penetrant autosomal dominant trait; all known
    carriers are heterozygous for the same CST3 L68Q founder variant.
  evidence:
  - reference: PMID:18566660
    reference_title: A drastic reduction in the life span of cystatin C L68Q carriers due to life-style changes during the last two centuries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary cystatin C amyloid angiopathy (HCCAA) is an autosomal dominant disease with high penetrance, manifest by brain hemorrhages in young normotensive adults."
    explanation: >-
      Directly establishes autosomal dominant inheritance with high penetrance
      for HCCAA.
  - reference: PMID:2602420
    reference_title: Mutation in the cystatin C gene causes hereditary brain hemorrhage.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Alu I marker has been used to show that this mutation is transmitted only in the affected members in all eight families investigated, proving that the mutated cystatin C gene causes HCCAA."
    explanation: >-
      Co-segregation of the CST3 variant with disease across eight families
      establishes the dominant Mendelian relationship.
prevalence:
- population: Iceland
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    HCCAA is confined to a small number of Icelandic families descending from a
    common founder; case counts rather than population rates are what the
    literature reports.
  evidence:
  - reference: PMID:8097919
    reference_title: Molecular diagnosis of hereditary cystatin C amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-six individuals belonging to nine Icelandic families have been found to have the mutation and it is highly probable that these families descend from a common ancestor."
    explanation: >-
      Reports the identified carrier count and the restriction to a small set of
      related Icelandic families.
  - reference: PMID:16612982
    reference_title: 'Hereditary cystatin C amyloid angiopathy: genetic, clinical, and pathological aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary cystatin C amyloid angiopathy (HCCAA) is a rare, fatal amyloid disease in young people in Iceland caused by a mutation in cystatin C, which is an inhibitor of several cysteine proteinases, such as cathepsins S, B, and K."
    explanation: >-
      Characterizes HCCAA as a rare disease geographically restricted to Iceland.
progression:
- phase: Presymptomatic carrier state
  age_range: childhood to early adulthood
  notes: >-
    Carriers are clinically well before the first hemorrhage, but cystatin C
    already deposits in skin basement membrane, which is why skin biopsy can
    stage preclinical disease.
  evidence:
  - reference: PMID:28067897
    reference_title: Pathological changes in basement membranes and dermal connective tissue of skin from patients with hereditary cystatin C amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that cystatin C deposition in minimally affected samples was limited to the basement membrane (BM) between the dermis and epidermis."
    explanation: >-
      Establishes that early, minimally affected carriers already show restricted
      basement-membrane deposition before advanced disease.
- phase: First symptomatic hemorrhage
  age_range: third decade
  notes: >-
    Most carriers present with their first intracerebral hemorrhage in their
    twenties.
  evidence:
  - reference: PMID:40163249
    reference_title: 'N-Acetylcysteine for Hereditary Cystatin C Amyloid Angiopathy: A Nonrandomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most carriers of this sequence variation experience their first intracerebral hemorrhage in their 20s."
    explanation: >-
      Directly dates the typical first hemorrhage to the third decade.
- phase: Recurrent hemorrhage and neurological decline
  age_range: third to fourth decade
  duration: about 5 years after the first bleed
  notes: >-
    Hemorrhages recur with increasing frequency and severity, accompanied by
    dementia and paralysis, and death occurs at a mean age of about 30 years.
  evidence:
  - reference: PMID:39054254
    reference_title: 'The historical background of hereditary cystatin C amyloid angiopathy: Genealogical, pathological, and clinical manifestations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the carriers survive the first hemorrhage, the frequency and severity of the hemorrhages tend to increase, resulting in death at average of 30 years with mean number of major hemorrhages ranging from 3.2 to 3.9 over a 5-year average life span."
    explanation: >-
      Quantifies recurrence, mean number of major hemorrhages, and mean age at
      death.
pathophysiology:
- name: CST3 L68Q Founder Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A single T-to-A substitution in codon 68 of CST3 replaces leucine with
    glutamine in cystatin C. Every known HCCAA carrier is heterozygous for this
    one Icelandic founder allele, so the disorder has a uniform initiating
    genetic lesion.
  genes:
  - preferred_term: CST3
    term:
      id: hgnc:2475
      label: CST3
  evidence:
  - reference: PMID:2602420
    reference_title: Mutation in the cystatin C gene causes hereditary brain hemorrhage.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have used the full length cystatin C cDNA probe (Abrahamson et al., 1987) to demonstrate a mutation in the codon for leucine at position 68, which abolishes an Alu I restriction site in cystatin C gene of the HCCAA patients."
    explanation: >-
      Identifies the codon-68 CST3 mutation as the initiating lesion in HCCAA
      patients.
  - reference: PMID:16612982
    reference_title: 'Hereditary cystatin C amyloid angiopathy: genetic, clinical, and pathological aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same mutation in cystatin C, L68Q, has been found in all patients examined so far pointing to a common founder."
    explanation: >-
      Establishes L68Q as the single founder allele shared by all examined
      patients.
  downstream:
  - target: Destabilized L68Q Cystatin C Precursor
    causal_link_type: DIRECT
    description: >-
      The L68Q substitution sits near the inhibitory region of cystatin C and
      yields a conformationally destabilized variant protein.
    evidence:
    - reference: PMID:3517880
      reference_title: Amyloid fibrils in hereditary cerebral hemorrhage with amyloidosis of Icelandic type is a variant of gamma-trace basic protein (cystatin C).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It has an amino acid substitution (glutamine for leucine) at position 58 (position 68 in gamma-trace numbering), which is near the proposed active site of related proteins"
      explanation: >-
        Locates the amino acid substitution in the amyloid-forming variant
        protein purified from patient tissue.
- name: Destabilized L68Q Cystatin C Precursor
  conforms_to: amyloidogenesis#Amyloidogenic Precursor Protein
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Variant cystatin C is the amyloidogenic precursor of this disease, the
    disorder-specific substitution for the module's generic destabilized
    precursor. The variant protein purified from patient amyloid is cystatin C
    (gamma-trace) carrying the position-68 substitution, and structural work
    shows the mutation destabilizes the folded monomer.
  genes:
  - preferred_term: CST3
    term:
      id: hgnc:2475
      label: CST3
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  molecular_functions:
  - preferred_term: cysteine-type endopeptidase inhibitor activity
    term:
      id: GO:0004869
      label: cysteine-type endopeptidase inhibitor activity
  evidence:
  - reference: PMID:3517880
    reference_title: Amyloid fibrils in hereditary cerebral hemorrhage with amyloidosis of Icelandic type is a variant of gamma-trace basic protein (cystatin C).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A gamma-trace variant protein is the major constituent of the amyloid fibrils in patients from Iceland with hereditary cerebral hemorrhage with amyloidosis."
    explanation: >-
      Identifies variant cystatin C (gamma-trace) as the amyloid subunit in
      patient tissue, establishing it as the amyloidogenic precursor.
  - reference: PMID:11276250
    reference_title: Human cystatin C, an amyloidogenic protein, dimerizes through three-dimensional domain swapping.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The structure of the three-dimensional domain-swapped dimers shows how the L68Q mutation destabilizes the monomers and makes the partially unfolded intermediate less unstable."
    explanation: >-
      Crystallographic work provides the destabilization mechanism that makes the
      L68Q precursor misfolding-prone.
  downstream:
  - target: Domain-Swapped Dimerization and Oligomerization
    causal_link_type: DIRECT
    description: >-
      Destabilization of the monomer favours the partially unfolded intermediate
      that permits three-dimensional domain swapping.
    evidence:
    - reference: PMID:11276250
      reference_title: Human cystatin C, an amyloidogenic protein, dimerizes through three-dimensional domain swapping.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The structure of the three-dimensional domain-swapped dimers shows how the L68Q mutation destabilizes the monomers and makes the partially unfolded intermediate less unstable."
      explanation: >-
        Links monomer destabilization directly to the domain-swapped dimer that
        initiates aggregation.
  - target: Intracellular Retention of Variant Cystatin C
    causal_link_type: DIRECT
    description: >-
      The variant protein is poorly secreted and is retained in association with
      cells, which lowers extracellular cystatin C and raises the intracellular
      pool.
    evidence:
    - reference: PMID:9445375
      reference_title: 'Hereditary cystatin C amyloid angiopathy: monitoring the presence of the Leu-68-->Gln cystatin C variant in cerebrospinal fluids and monocyte cultures by MS.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results support the conclusion that the mutated cystatin C is retained in association with the monocytes and not secreted."
      explanation: >-
        Mass-spectrometric analysis of patient-derived monocyte cultures shows
        retention rather than secretion of the variant protein.
- name: Intracellular Retention of Variant Cystatin C
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Variant cystatin C accumulates within cells rather than being secreted,
    which depletes cerebrospinal fluid cystatin C and is proposed to raise the
    local concentration that drives aggregation. This is a secretion/trafficking
    arm that runs alongside the intrinsic destabilization arm.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9445375
    reference_title: 'Hereditary cystatin C amyloid angiopathy: monitoring the presence of the Leu-68-->Gln cystatin C variant in cerebrospinal fluids and monocyte cultures by MS.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The concentration of cystatin C in cerebrospinal fluid (CSF) of HCCAA patients is markedly diminished and cultivated monocytes from affected individuals accumulate cystatin C."
    explanation: >-
      Documents both the reduced extracellular (CSF) pool and the cellular
      accumulation that define this node.
  downstream:
  - target: Domain-Swapped Dimerization and Oligomerization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors propose that the raised intracellular concentration promotes
      aggregation and fibril formation; the intermediate steps in patient brain
      are not established.
    evidence:
    - reference: PMID:9445375
      reference_title: 'Hereditary cystatin C amyloid angiopathy: monitoring the presence of the Leu-68-->Gln cystatin C variant in cerebrospinal fluids and monocyte cultures by MS.'
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "An increased intracellular concentration would presumably promote the aggregation and denaturation of the mutated cystatin C, leading to the formation of amyloid fibrils and cell death."
      explanation: >-
        The link is explicitly framed by the authors as a presumption, so this
        edge is recorded as partial support with unknown intermediates.
- name: Domain-Swapped Dimerization and Oligomerization
  conforms_to: amyloidogenesis#Protein Misfolding and Beta-Sheet Oligomerization
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Cystatin C dimerizes by three-dimensional domain swapping, in which two
    partially unfolded monomers exchange structural elements to reconstitute
    monomer-like domains. Open-ended propagation of the same mechanism links
    molecules into higher aggregates. Oligomer formation - not the monomer - is
    the species that accumulates in the cerebral vasculature.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  molecular_functions:
  - preferred_term: protein homodimerization activity
    term:
      id: GO:0042803
      label: protein homodimerization activity
    modifier: INCREASED
  evidence:
  - reference: PMID:11276250
    reference_title: Human cystatin C, an amyloidogenic protein, dimerizes through three-dimensional domain swapping.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The dimerization occurs through three-dimensional domain swapping, a mechanism for forming oligomeric proteins."
    explanation: >-
      Establishes the specific misfolding/oligomerization mechanism substituted
      for the module's generic beta-sheet oligomerization step.
  - reference: PMID:11276250
    reference_title: Human cystatin C, an amyloidogenic protein, dimerizes through three-dimensional domain swapping.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Higher aggregates may arise through the three-dimensional domain-swapping mechanism occurring in an open-ended fashion in which partially unfolded molecules are linked into infinite chains."
    explanation: >-
      Extends the dimer mechanism to higher-order aggregates, the amplifying step
      of the chain.
  - reference: PMID:40163249
    reference_title: 'N-Acetylcysteine for Hereditary Cystatin C Amyloid Angiopathy: A Nonrandomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the most important drivers of the disease is the aggregation of L68Q-hCC into amyloid oligomers, as the monomer does not accumulate in the cerebral vasculature."
    explanation: >-
      Identifies the oligomer, rather than the monomer, as the disease-driving
      species, which is what makes this node the therapeutic target.
  downstream:
  - target: Cystatin C Amyloid Deposition in Cerebral Arterial Walls
    causal_link_type: DIRECT
    description: >-
      Aggregation-prone variant protein forms heavy amyloid deposits in the walls
      of small cerebral arteries and arterioles.
    evidence:
    - reference: PMID:8737928
      reference_title: The molecular pathology of hereditary cystatin C amyloid angiopathy causing brain hemorrhage.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant protein has an increased tendency to aggregate and forms heavy depositions of amyloid in the walls of the small arteries and arterioles of the brain."
      explanation: >-
        Directly connects the aggregation tendency of the variant to arterial
        wall amyloid deposition.
- name: Cystatin C Amyloid Deposition in Cerebral Arterial Walls
  conforms_to: amyloidogenesis#Amyloid Fibril Formation and Extracellular Deposition
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The rate-limiting lesion of HCCAA. Variant cystatin C amyloid deposits
    selectively in the walls of brain arteries and arterioles - grey and white
    matter alike, and in leptomeningeal as well as parenchymal vessels - while
    capillaries and veins are spared. Perivascular and parenchymal focal deposits
    also occur.
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: amyloid fibril formation
    term:
      id: GO:1990000
      label: amyloid fibril formation
    modifier: INCREASED
  evidence:
  - reference: PMID:26115583
    reference_title: Parenchymal cystatin C focal deposits and glial scar formation around brain arteries in Hereditary Cystatin C Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cystatin C was deposited in all brain areas, grey and white matter alike, most prominently in arteries and arterioles; capillaries and veins were not, or minimally, affected."
    explanation: >-
      Post-mortem topographical mapping establishes the arterial selectivity of
      deposition in patient brain.
  - reference: PMID:9063500
    reference_title: Microvascular degeneration in hereditary cystatin C amyloid angiopathy of the brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that cystatin C amyloid immunoreactivity was present not only in cerebral cortical and leptomeningeal vessels, but also in white matter parenchymal vessels."
    explanation: >-
      Immunohistochemistry documents the anatomical distribution of cystatin C
      amyloid across cortical, leptomeningeal, and parenchymal vessels.
  - reference: PMID:26115583
    reference_title: Parenchymal cystatin C focal deposits and glial scar formation around brain arteries in Hereditary Cystatin C Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study shows for the first time, that cystatin C does not exclusively form CAA and perivascular amyloid but also focal deposits in the brain parenchyma."
    explanation: >-
      Extends deposition beyond the vessel wall to parenchymal focal deposits.
  downstream:
  - target: Arterial Wall Matrix Accumulation and Thickening
    causal_link_type: DIRECT
    description: >-
      Amyloid deposits are accompanied by excess basement-membrane extracellular
      matrix within the arterial wall.
    evidence:
    - reference: PMID:23973860
      reference_title: Deposition of collagen IV and aggrecan in leptomeningeal arteries of hereditary brain haemorrhage with amyloidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Examination of post-mortem samples revealed extensive changes in the walls of affected arteries characterised by deposition of extracellular matrix constituents, notably collagen IV and the proteoglycan aggrecan."
      explanation: >-
        Post-mortem arterial wall analysis identifies the specific matrix
        constituents accumulating alongside amyloid.
  - target: Vascular Smooth Muscle Cell Loss and Microvascular Degeneration
    causal_link_type: DIRECT
    description: >-
      Smooth muscle cells progressively disappear from vessel walls as cystatin C
      accumulates.
    evidence:
    - reference: PMID:9063500
      reference_title: Microvascular degeneration in hereditary cystatin C amyloid angiopathy of the brain.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Smooth muscle (sm) cells were few or could not be identified within vessel walls showing extensive cystatin C deposition, suggesting progressive loss of these cells as cystatin C accumulates."
      explanation: >-
        Directly correlates extent of cystatin C deposition with smooth muscle
        cell loss in patient vessels.
  - target: Perivascular Glial Scar Formation
    causal_link_type: DIRECT
    description: >-
      The neuroinflammatory response is confined to the immediate vicinity of
      affected arteries and their focal deposits.
    evidence:
    - reference: PMID:26115583
      reference_title: Parenchymal cystatin C focal deposits and glial scar formation around brain arteries in Hereditary Cystatin C Amyloid Angiopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "our results indicate that the central nervous system pathology of HCCAA is characterised by the formation of a glial scar within and around affected arteries."
      explanation: >-
        Establishes glial scar formation as a consequence localized to affected
        arteries.
  - target: Systemic Extracerebral Cystatin C Deposition
    causal_link_type: DIRECT
    description: >-
      The same aggregation process deposits amyloid in extracerebral tissues,
      most usefully in skin.
    evidence:
    - reference: PMID:16612982
      reference_title: 'Hereditary cystatin C amyloid angiopathy: genetic, clinical, and pathological aspects.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutated cystatin C forms amyloid, predominantly in brain arteries and arterioles, but also to a lesser degree in tissues outside the central nervous system such as skin, lymph nodes, testis, spleen, submandibular salivary glands, and adrenal cortex."
      explanation: >-
        Enumerates the extracerebral tissues in which the same amyloid is
        deposited.
- name: Arterial Wall Matrix Accumulation and Thickening
  conforms_to: amyloidogenesis#Progressive Tissue Amyloid Accumulation
  biological_scale: TISSUE
  role: effector
  description: >-
    Continued amyloid and extracellular matrix deposition - collagen IV,
    aggrecan, thickened laminin, intimal thickening over a frayed elastic layer -
    progressively expands and stiffens the arterial wall. This is the
    disorder-specific form of the module's progressive tissue amyloid
    accumulation, and it is what converts molecular aggregation into a
    structural vascular lesion.
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23973860
    reference_title: Deposition of collagen IV and aggrecan in leptomeningeal arteries of hereditary brain haemorrhage with amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results show that excess deposition of extracellular matrix proteins in cerebral arteries of HCCAA is a prominent feature of the disease and may play an important role in its pathogenesis."
    explanation: >-
      Establishes excess matrix deposition as a prominent structural feature of

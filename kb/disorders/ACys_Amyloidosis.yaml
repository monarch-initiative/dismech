environmental:
- name: Twentieth-century Icelandic lifestyle change
  description: >-
    Obligate L68Q carriers born between 1825 and 1900 experienced a fall in life
    span from about 65 years to the modern average of about 30, and a
    parent-of-origin effect emerged over the same period. Because the shift
    appears in several independent extended families many generations after the
    founding mutation, the authors infer an environmental cause tied to changes
    in Icelandic life-style. The specific exposure has not been identified, so no
    ECTO term is bound here.

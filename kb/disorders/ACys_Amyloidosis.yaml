    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HCCAA is the first human disorder known to be caused by an abnormal gene for a cysteine proteinase inhibitor."
    explanation: >-
      Establishes CST3, a cysteine proteinase inhibitor gene, as the causative
      gene.
  - reference: PMID:39054254
    reference_title: 'The historical background of hereditary cystatin C amyloid angiopathy: Genealogical, pathological, and clinical manifestations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HCCAA is dominantly inherited, caused by L68Q mutation in the cystatin C gene, leading to aggregation of the cystatin C protein."
    explanation: >-
      Confirms the dominant CST3 L68Q aetiology and links it to protein

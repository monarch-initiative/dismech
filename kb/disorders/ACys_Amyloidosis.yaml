    aggregates, and reduced disease-associated biomarkers in skin. It is an
    investigational, biomarker-supported candidate preventive strategy, not an
    established therapy - the trial was nonrandomized, uncontrolled for clinical
    outcome, and cerebral bleeds still occurred during treatment.

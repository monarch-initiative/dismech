  downstream:
  - target: Recurrent Lobar Intracerebral Hemorrhage
    causal_link_type: DIRECT
    description: >-
      Thickened, amyloid-laden arterial walls occlude or rupture, producing brain
      hemorrhage.
    evidence:
    - reference: PMID:16612982
      reference_title: 'Hereditary cystatin C amyloid angiopathy: genetic, clinical, and pathological aspects.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The amyloid deposition in the vessel walls causes thickening of the walls leading to occlusion or rupture and resulting in brain hemorrhage."
      explanation: >-
        States the causal path from wall thickening to rupture and hemorrhage.
- name: Vascular Smooth Muscle Cell Loss and Microvascular Degeneration
  biological_scale: CELLULAR
  role: effector
  description: >-
    Smooth muscle cells are progressively lost from the media and adventitia of
    affected vessels. Solubilized cystatin C amyloid extracted from patient
    leptomeninges kills cultured cerebral smooth muscle cells, supplying a direct
    cytotoxic mechanism for the withdrawal of these cells observed in patient
    tissue. The denuded, structurally incompetent wall is what fails under
    pressure.
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:9063500
    reference_title: Microvascular degeneration in hereditary cystatin C amyloid angiopathy of the brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cystatin C deposition within the vascular media and adventitia, with associated vessel wall injury as manifested by sm cell loss, represents microvascular degeneration that leads to cerebral hemorrhage."
    explanation: >-
      Names smooth muscle cell loss as the vessel wall injury that leads to
      hemorrhage.
  - reference: PMID:17963746
    reference_title: Solubilized cystatin C amyloid is cytotoxic to cultured human cerebrovascular smooth muscle cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "To evaluate possible cytotoxicity in this condition solubilized cystatin C amyloid extracted from HCHWA-I leptomeninges was applied to cerebral smooth muscle cells in culture and was found to kill the cells."
    explanation: >-
      Supplies the direct cytotoxicity mechanism; note this is a culture
      experiment, so the in vivo magnitude of this contribution is not
      established.
  downstream:
  - target: Recurrent Lobar Intracerebral Hemorrhage
    causal_link_type: DIRECT
    description: >-
      Loss of the muscular wall component leaves the vessel unable to withstand
      luminal pressure.
    evidence:
    - reference: PMID:9063500
      reference_title: Microvascular degeneration in hereditary cystatin C amyloid angiopathy of the brain.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cystatin C deposition within the vascular media and adventitia, with associated vessel wall injury as manifested by sm cell loss, represents microvascular degeneration that leads to cerebral hemorrhage."
      explanation: >-
        Explicitly identifies this microvascular degeneration as leading to
        cerebral hemorrhage.
- name: Perivascular Glial Scar Formation
  biological_scale: TISSUE
  role: effector
  description: >-
    A spatially restricted neuroinflammatory reaction forms a glial scar within
    and around affected arteries and their perivascular and parenchymal focal
    deposits. The response is local rather than diffuse, tracking the deposits
    themselves.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127

name: ACys Amyloidosis
creation_date: '2026-08-18T10:00:00Z'
category: Mendelian
synonyms:
- hereditary cystatin C amyloid angiopathy
- HCCAA
- hereditary cerebral hemorrhage with amyloidosis, Icelandic type
- HCHWA-Icelandic type
- cystatin amyloidosis
- CST3-related amyloidosis
description: >-
  ACys amyloidosis (hereditary cystatin C amyloid angiopathy, HCCAA) is an
  ultra-rare autosomal dominant cerebral amyloidosis caused by a single Icelandic
  founder variant, CST3 L68Q. The substitution destabilizes cystatin C and drives
  three-dimensional domain-swapped dimerization and oligomerization, producing
  amyloid that deposits in the walls of brain arteries and arterioles together
  with excess basement-membrane extracellular matrix. Progressive arterial wall
  thickening and smooth muscle cell loss culminate in recurrent lobar
  intracerebral hemorrhage in young normotensive adults, with dementia and
  paralysis, and death at a mean age of about 30 years. Amyloid is deposited
  systemically - notably in skin basement membrane - but clinical manifestations
  are essentially restricted to the brain, and the systemic deposits are
  exploited diagnostically. Distinguish carefully from the Dutch type of
  hereditary cerebral hemorrhage with amyloidosis (HCHWA-D), which is an
  APP-related amyloid-beta disease and not part of this entry.
disease_term:
  preferred_term: ACys amyloidosis
  term:
    id: MONDO:0007098
    label: ACys amyloidosis
parents:
- hereditary disease

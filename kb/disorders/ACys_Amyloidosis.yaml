- name: Systemic Extracerebral Cystatin C Deposition
  biological_scale: TISSUE
  role: effector
  description: >-
    Variant cystatin C also deposits outside the central nervous system - skin,
    lymph nodes, testis, spleen, salivary glands, adrenal cortex. In skin it
    begins in the dermal-epidermal basement membrane, colocalizes with collagen
    IV, and is associated with increased upper-dermal fibroblast density.
    Clinically this arm is essentially silent, but it is the basis for skin
    biopsy as a staging and pharmacodynamic assay.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast

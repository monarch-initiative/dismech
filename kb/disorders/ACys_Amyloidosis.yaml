  role: consequence
  description: >-
    The clinical end state. Amyloid-laden arteries rupture, producing
    intracerebral hemorrhage in normotensive young adults. Hemorrhages recur with
    increasing frequency and severity, accompanied by dementia and paralysis, and
    are fatal at a mean age of about 30 years. Microinfarcts are also found in a
    substantial minority at autopsy.

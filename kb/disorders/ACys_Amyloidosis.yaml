- discussion_id: hccaa_environmental_modifier
  prompt: >-
    Which specific environmental or life-style exposure accounts for the
    halving of L68Q carrier life span between 1825 and 1900?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Recurrent Lobar Intracerebral Hemorrhage
  rationale: >-
    The genealogical evidence for an environmental modifier is strong and
    replicated across independent extended families, and it implies that a
    preventive strategy may exist. But the responsible exposure has never been
    identified, so no ECTO term can be bound and the effect cannot be modeled
    mechanistically. A parent-of-origin effect emerging over the same period is
    an additional unexplained observation.
  evidence:
  - reference: PMID:18566660
    reference_title: A drastic reduction in the life span of cystatin C L68Q carriers due to life-style changes during the last two centuries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the same time, a parent-of-origin effect emerged, whereby maternal inheritance of the mutation was associated with a 9 year reduction in life span relative to paternal inheritance."
    explanation: >-
      Records the unexplained parent-of-origin effect that accompanies the
      life-span shift.
notes: >-
  Naming caution: HCHWA without a type qualifier is ambiguous. HCHWA-Icelandic
  type (this entry, ACys, CST3 L68Q, cystatin C amyloid) and HCHWA-Dutch type
  (APP, amyloid-beta) are distinct diseases. Literature searches on the
  unqualified acronym return both. ACys is also represented as the ACys subtype
  of the Cerebral_Amyloid_Angiopathy entry, which models the CAA umbrella; this
  entry is the standalone disease, paralleling the existing ADan_amyloidosis
  entry.

  - reference: PMID:16612982
    reference_title: 'Hereditary cystatin C amyloid angiopathy: genetic, clinical, and pathological aspects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The amyloid deposition in the vessel walls causes thickening of the walls leading to occlusion or rupture and resulting in brain hemorrhage."
    explanation: >-
      Connects wall thickening to the two vascular outcomes, occlusion and

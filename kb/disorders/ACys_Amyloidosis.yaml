differential_diagnoses:
- name: Sporadic cerebral amyloid angiopathy
  description: >-
    Age-related sporadic CAA is amyloid-beta based and affects the elderly,
    whereas HCCAA presents with hemorrhage in the third decade and is cystatin C
    based. Cystatin C does colocalize with amyloid-beta in sporadic CAA, so
    immunostaining for cystatin C alone does not distinguish the two.
  evidence:
  - reference: PMID:9063500
    reference_title: Microvascular degeneration in hereditary cystatin C amyloid angiopathy of the brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cystatin C is also found to colocalize with amyloid beta/A4 protein in cerebral vessel walls of patients with Alzheimer's disease (AD), sporadic CAA, and hereditary cerebral hemorrhage with amyloidosis, Dutch type (HCHWA-D)."
    explanation: >-
      Establishes the colocalization that makes cystatin C staining alone
      non-discriminating between these entities.
- name: Hereditary cerebral hemorrhage with amyloidosis, Dutch type (HCHWA-D)
  description: >-
    HCHWA-D is caused by an APP variant and deposits amyloid-beta, not cystatin
    C. The shared HCHWA acronym is a recognized source of confusion between two
    genetically and biochemically distinct diseases; only the Icelandic type is
    modeled in this entry.
  evidence:
  - reference: PMID:9063500
    reference_title: Microvascular degeneration in hereditary cystatin C amyloid angiopathy of the brain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cystatin C is also found to colocalize with amyloid beta/A4 protein in cerebral vessel walls of patients with Alzheimer's disease (AD), sporadic CAA, and hereditary cerebral hemorrhage with amyloidosis, Dutch type (HCHWA-D)."
    explanation: >-
      Names HCHWA-D as a separate entity from HCCAA within the same paper,
      supporting the distinction.
- name: Hypertensive intracerebral hemorrhage
  description: >-
    HCCAA hemorrhage occurs in normotensive young adults, which separates it from
    hypertensive deep intracerebral hemorrhage.
  evidence:
  - reference: PMID:8737928
    reference_title: The molecular pathology of hereditary cystatin C amyloid angiopathy causing brain hemorrhage.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder has an autosomal dominant mode of inheritance and causes fatal brain hemorrhage in normotensive young adults."
    explanation: >-
      The explicit normotensive qualifier is what distinguishes HCCAA from
      hypertensive hemorrhage.
discussions:
- discussion_id: hccaa_no_animal_model
  prompt: >-
    Why does HCCAA still lack an animal model, and what would a faithful model
    have to reproduce?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cystatin C Amyloid Deposition in Cerebral Arterial Walls
  - pathophysiology#Arterial Wall Matrix Accumulation and Thickening
  rationale: >-
    Essentially all mechanistic knowledge of HCCAA comes from human post-mortem
    tissue, patient-derived cells, and in vitro structural biology. The absence
    of an animal model is stated explicitly in the vascular pathology
    literature, and it is why the temporal ordering of amyloid deposition,
    matrix accumulation, and smooth muscle cell loss remains inferred from
    cross-sectional autopsy material rather than demonstrated longitudinally.
  evidence:
  - reference: PMID:23973860
    reference_title: Deposition of collagen IV and aggrecan in leptomeningeal arteries of hereditary brain haemorrhage with amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The aetiology of HCCAA pathology is not clear and there is, at present, no animal model of the disease."
    explanation: >-
      States both the unresolved aetiology and the absence of an animal model.
- discussion_id: hccaa_basement_membrane_primacy
  prompt: >-
    Are basement membrane changes an early driver that facilitates cystatin C
    deposition, or a consequence of deposition already underway?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Cystatin C Amyloid Deposition in Cerebral Arterial Walls
  - pathophysiology#Arterial Wall Matrix Accumulation and Thickening
  - pathophysiology#Systemic Extracerebral Cystatin C Deposition
  rationale: >-
    This entry currently draws the edge from amyloid deposition to matrix
    accumulation, following the arterial post-mortem description. The skin biopsy
    study argues the opposite direction - that basement membrane change is early
    and facilitates deposition - and reports collagen IV increased to a similar
    extent in all carrier biopsies regardless of deposit stage. Both directions
    are supported by cross-sectional human material only, and resolving the order
    would require longitudinal sampling or a model system that does not yet
    exist.
  evidence:
  - reference: PMID:28067897
    reference_title: Pathological changes in basement membranes and dermal connective tissue of skin from patients with hereditary cystatin C amyloid angiopathy.

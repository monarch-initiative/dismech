- name: Impaired Cochlear Mechanotransduction
  role: effector
  biological_scale: CELLULAR
  description: >-
    P5 outer hair cells from Ripor2-null mice retain mechanically evoked currents, with reduced peak amplitude
    and a shifted, broadened displacement–open-probability curve. Mean saturated currents were approximately
    233 pA in null cells and 417 pA in heterozygous controls. Re-expression in P2 explants restored fluid-jet-evoked
    GCaMP3 calcium responses; that rescue readout is not a direct measurement of restored transduction current.
  evidence:
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanotransduction currents could also be evoked in OHCs fromFam65bLacZ/LacZmice but peak currents were
      reduced (Figure 6A).
    explanation: >-
      Whole-cell recordings in P5 outer hair cells show reduced, retained currents. The source extraction joins
      genotype text; this is an ex vivo recording.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell

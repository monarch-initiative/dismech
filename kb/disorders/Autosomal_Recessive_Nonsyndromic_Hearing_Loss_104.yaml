name: Autosomal Recessive Nonsyndromic Hearing Loss 104
creation_date: "2026-08-26T14:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 104
  term:
    id: MONDO:0014675
    label: autosomal recessive nonsyndromic hearing loss 104
synonyms:
- DFNB104
- deafness, autosomal recessive 104
- RIPOR2-related autosomal recessive nonsyndromic hearing loss
- FAM65B-related deafness
description: >-
  Congenital, profound, non-progressive sensorineural hearing loss caused by biallelic
  loss-of-function variants in RIPOR2 (formerly FAM65B). It is a disease of one small
  place: RIPOR2 forms a ring of oligomers around the basal taper of hair cell stereocilia,
  the narrow hinge where each stereocilium pivots when sound deflects the bundle. Remove
  it and stereocilia still start to grow, but the taper compartment loses its
  organisation, mechanotransduction fails, and the bundle deteriorates.

  The entry has two features that shaped how it is curated.

  The first is that RIPOR2 causes two different hearing-loss diseases, and they are easy
  to conflate. This one is recessive, congenital, profound and stable. A heterozygous
  in-frame deletion in the same gene causes an adult-onset, progressive, dominant hearing
  loss that is a common founder allele in the Netherlands. The deletion is not a milder
  version of this disease and evidence about it is not curated here; it appears under
  differential diagnoses instead.

  The second is a model mismatch that the field has stated explicitly. The Tunisian
  siblings with a homozygous nonsense allele have vestibular areflexia alongside their
  deafness, while the Ripor2 knockout mouse and a zebrafish model are deaf with normal
  vestibular function. The mouse is the source of nearly everything known about the
  mechanism, so the discrepancy matters, and it is recorded as a HUMAN_MODEL_MISMATCH
  rather than left as a footnote.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Two consanguineous families are reported: a large Turkish kindred with six affected
    individuals homozygous for a splice-acceptor allele, and a Tunisian sibship of three
    homozygous for a nonsense allele. Each allele is private to its family. No prevalence
    estimate exists, and none is meaningful at this evidence base.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous Turkish kindred with recessive nonsyndromic, prelingual,
      profound hearing loss, we identified in the gene FAM65B (MIM611410) a splice site
      mutation (c.102-1G>A) that perfectly cosegregates with the phenotype in the family.
    explanation: >-
      The first family and the cosegregation on which the gene-disease claim rests.

pathophysiology:

- name: Biallelic RIPOR2 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Two reported alleles, in two consanguineous families, both loss of function and both
    homozygous.

    The Turkish allele c.102-1G>A destroys a splice acceptor site, causing exon skipping
    and an in-frame deletion of 52 residues from the PX membrane-localization domain. It
    is not a null: protein is made, but it is the wrong protein, and where it goes is the
    point of the next node.

    The Tunisian allele c.1561C>T (p.Arg521*) is a nonsense variant. It is the allele that
    comes with a vestibular phenotype, which the splice allele does not.
  genetic_context:
    gene:
      preferred_term: RIPOR2
      term:
        id: hgnc:13872
        label: RIPOR2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in both reported families, each of which is consanguineous. Typed
      LOSS_OF_FUNCTION for both alleles: the splice allele's product fails to reach its
      compartment and the nonsense allele truncates the protein.
  downstream:
  - target: Loss of RIPOR2 from the Stereociliary Taper
    causal_link_type: DIRECT
    description: >-
      Either allele removes functional RIPOR2 from the place it works.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation leads to exon skipping and deletion of 52-amino acid residues of a PX
      membrane localization domain.
    explanation: >-
      The molecular consequence of the Turkish allele, and the domain it removes.
  - reference: PMID:37864412
    reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in RIPOR2 (RHO family interacting cell polarization regulator 2) has been identified
      by WES in Tunisian siblings suffering from congenital bilateral profound hearing and
      vestibular dysfunctions.
    explanation: >-
      The second family and its allele, together with the phenotype that distinguishes it.

- name: Loss of RIPOR2 from the Stereociliary Taper
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    RIPOR2 works at the plasma membrane of stereocilia, and specifically at their base. In
    the mouse cochlea the wild-type protein localises to the stereociliary plasma membrane
    of inner and outer hair cells, and super-resolution imaging places it as a
    circumferential ring of oligomers around the basal taper - the narrow hinge where a
    stereocilium pivots when the bundle is deflected.

    The splice allele's product does not get there. Wild-type protein targets the plasma
    membrane while the mutant accumulates in cytoplasmic inclusion bodies, so this is a
    mislocalisation disease at the protein level rather than simple absence, even though
    the functional outcome is the same.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  cellular_components:
  - preferred_term: stereocilium
    term:
      id: GO:0032420
      label: stereocilium
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Disorganisation of the Taper Compartment
    causal_link_type: DIRECT
    description: >-
      RIPOR2 oligomerisation organises the taper; without it the compartment's other
      components are displaced.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that wild-type Fam65b is expressed during embryonic and postnatal
      development stages in murine cochlea, and that the protein localizes to the plasma
      membranes of the stereocilia of inner and outer hair cells of the inner ear.
    explanation: >-
      Establishes where the protein is, in the cell types this disease affects.
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The wild-type protein targets the plasma membrane, whereas the mutant protein
      accumulates in cytoplasmic inclusion bodies and does not reach the membrane.
    explanation: >-
      The mislocalisation of the patient allele's product, which is the functional case
      for calling the splice variant loss of function.
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using biochemistry and stochastic optical reconstruction microscopy (STORM), we show
      here that Fam65b oligomers form a circumferential ring near the basal taper of the
      mechanically sensitive stereocilia of murine hair cells.
    explanation: >-
      Refines the localisation from "stereocilia" to the taper ring, which is what makes
      the mechanism specific.

- name: Disorganisation of the Taper Compartment
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The taper is a distinct subcellular compartment with its own protein complement, and
    RIPOR2 organises it. Two dependencies are documented in mouse.

    Taperin, a second taper protein, forms a dense-core-like structure that is disrupted
    when Fam65b is absent - so the compartment loses its architecture, not just one of its
    components. And RIPOR2 is not self-organising: RhoC binds it, co-localises with it in
    stereocilia and regulates its oligomerisation, and both the RhoC interaction and the
    oligomerisation are required for function. That places the lesion in a small GTPase
    module rather than in a structural protein acting alone.

    All of this is mouse work. The claim curated here is about the mechanism, and the
    human evidence for it is the phenotype plus the mislocalisation of the patient allele.
  cell_types:
  - preferred_term: sensory hair cell
    term:
      id: CL:0000855
      label: sensory hair cell
  cellular_components:
  - preferred_term: stereocilium
    term:
      id: GO:0032420
      label: stereocilium
  biological_processes:
  - preferred_term: Rho protein signal transduction
    term:
      id: GO:0007266
      label: Rho protein signal transduction
  - preferred_term: auditory receptor cell stereocilium organization
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
    modifier: ABNORMAL
  downstream:
  - target: Hair Bundle Malformation and Misorientation
    causal_link_type: DIRECT
    description: >-
      A disorganised taper gives a malformed bundle: stereocilia begin to develop and then
      deteriorate, and bundle orientation is set wrongly during morphogenesis.
  - target: Mechanotransduction Failure
    causal_link_type: DIRECT
    description: >-
      The taper is where the stereocilium pivots, so its disorganisation affects
      transduction directly and not only through the bundle's shape.
  evidence:
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taperin, a second protein near the taper, forms a dense-core-like structure that is
      disrupted in the absence of Fam65b.
    explanation: >-
      The dependency that makes this a compartment-organisation defect rather than the
      loss of one protein.
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RhoC co-localizes with Fam65b in stereocilia and regulates Fam65b oligomerization.
    explanation: >-
      The upstream regulator of the ring, placing the mechanism in Rho GTPase signalling.
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Binding to RhoC and oligomerization are critical for Fam65b function.
    explanation: >-
      Establishes both dependencies as functionally required, not merely correlated.

- name: Hair Bundle Malformation and Misorientation
  role: effector
  biological_scale: CELLULAR
  description: >-
    Two distinct bundle defects follow, and they occur at different stages.

    During morphogenesis, the absence of Ripor2 affects the orientation of the hair bundle.
    The route runs through Myh9, the non-muscle myosin heavy chain encoded by a known
    deafness gene: Ripor2 interacts with Myh9, and in its absence Myh9 protein is low in
    the cochlea despite increased Myh9 transcript, while the kinocilium - which sets the
    bundle's axis - is aberrantly placed and its phosphorylated Myh9 content reduced. The
    transcript-protein discordance is the informative detail, because it makes this a
    protein-stability effect rather than a transcriptional one.

    After development, the bundle does not hold. Stereocilia of Fam65b-deficient hair
    cells start to develop but then deteriorate - so this is a maintenance failure on top
    of a morphogenetic one, and neither alone accounts for the phenotype.
  cell_types:
  - preferred_term: sensory hair cell
    term:
      id: CL:0000855
      label: sensory hair cell
  cellular_components:
  - preferred_term: stereocilium bundle
    term:
      id: GO:0032421
      label: stereocilium bundle
  - preferred_term: kinocilium
    term:
      id: GO:0060091
      label: kinocilium
  downstream:
  - target: Mechanotransduction Failure
    causal_link_type: DIRECT
    description: >-
      A misoriented, deteriorating bundle cannot transduce deflection reliably.
  evidence:
  - reference: PMID:30280293
    reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we demonstrate that during the morphogenesis of the hair cell bundle, absence
      of Ripor2 affects the orientation of this key subcellular structure.
    explanation: >-
      The morphogenetic half of this node.
  - reference: PMID:30280293
    reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Absence of Ripor2 is associated with low Myh9 abundance in the mouse cochlea despite
      increased amount of Myh9 transcripts.
    explanation: >-
      The Myh9 route, with the transcript-protein discordance that identifies it as
      post-transcriptional.
  - reference: PMID:30280293
    reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In Ripor2-deficient mice, kinocilium shows an aberrant localization which associates
      with a reduced content of phosphorylated Myh9.
    explanation: >-
      Links the misplaced kinocilium, which sets bundle orientation, to the Myh9 defect.
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Stereocilia of Fam65b-deficient murine hair cells start to develop, but
      mechanotransduction is affected and stereocilia deteriorate.
    explanation: >-
      The maintenance half: development starts normally and the structure is then lost.

- name: Mechanotransduction Failure
  role: effector
  biological_scale: CELLULAR
  description: >-
    Hair cells lacking RIPOR2 fail to convert bundle deflection into a receptor current.
    The failure is reported alongside, not after, the structural deterioration, which is
    why it is drawn from both the taper node and the bundle node rather than only from the
    structural one.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  biological_processes:
  - preferred_term: sensory perception of mechanical stimulus
    term:
      id: GO:0050954
      label: sensory perception of mechanical stimulus
    modifier: DECREASED
  downstream:
  - target: Congenital Profound Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      No transduction current means no auditory signal, from birth.
  evidence:
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings thus reveal a highly organized compartment near the base of stereocilia
      that is critical for hair cell function and affected in disease.
    explanation: >-
      The paper's summary claim, connecting the taper compartment to hair cell function
      and to this disease.


      id: hgnc:13872
      label: RIPOR2
  association: >-
    Biallelic pathogenic RIPOR2 variants cause DFNB104. Reported alleles include NM_014722.2:c.102-1G>A, producing
    p.Arg34_Asp86delinsSer, and NM_014722.4:c.1561C>T (p.Arg521*). ClinVar RCV000190353 maps c.102-1G>A and
    NM_001286445.3:c.189-1G>A to the same genomic allele; these are transcript aliases, not independent variants.
    The distinct heterozygous c.1696_1707del (p.Gln566_Lys569del) allele causes DFNA21. In-frame deletion alone
    does not distinguish dominant from recessive disease; specific allele, segregation and phenotype must be
    considered.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous Turkish kindred with recessive nonsyndromic, prelingual, profound hearing loss,
      we identified in the gene FAM65B (MIM611410) a splice site mutation (c.102-1G>A) that perfectly cosegregates
      with the phenotype in the family.
    explanation: >-
      Segregation in the discovery pedigree supports recessive RIPOR2-associated hearing loss.
  - reference: PMID:37864412
    reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous pathogenic variation c.1561C > T (p.Arg521*) in RIPOR2 (RHO family interacting cell polarization
      regulator 2) has been identified by WES in Tunisian siblings suffering from congenital bilateral profound
      hearing and vestibular dysfunctions.
    explanation: >-
      The abstract establishes the second family and cochleovestibular phenotype.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance is supported by homozygous affected individuals and heterozygous parents
    in the reported pedigrees. Consanguinity facilitated ascertainment but is not required for this inheritance
    pattern. When both parents carry a causal recessive allele, recurrence risk is 25% per pregnancy. The specific
    dominant DFNA21 allele has different counseling implications.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous Turkish kindred with recessive nonsyndromic, prelingual, profound hearing loss,
      we identified in the gene FAM65B (MIM611410) a splice site mutation (c.102-1G>A) that perfectly cosegregates
      with the phenotype in the family.
    explanation: >-
      Segregation in the discovery pedigree supports recessive RIPOR2-associated hearing loss.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If both parents are known to be heterozygous for an autosomal recessive hearing loss-related pathogenic
      variant, each sib of the proband has at conception a 25% chance of having hearing loss, a 50% chance
      of having no hearing loss and being a carrier, and a 25% chance of having no hearing loss and not being
      a carrier.
    explanation: >-
      General recessive hearing-loss counseling applies after the causal variants and parental genotypes are
      established.
    quote_role: REVIEW_SYNTHESIS

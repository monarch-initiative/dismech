          Western blot analysis shows a decrease on the content of alpha-acetyl-tubulin in protein extracts
          from cochleae of Ripor2 deficient mice (Fig. 5E, F).
        explanation: >-
          The measured acetylated-tubulin abundance is separate from the proposed HDAC6 mechanism.
  - target: Vestibular End-Organ Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      No overt circling or balance deficit and normal rotarod performance.
    limitations: >-
      Mouse behavioral tests are not equivalent to the human cVEMP and video head-impulse battery. A species-specific
      absence of vestibular pathology is not established.
    evidence:
    - reference: PMID:30280293
      reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Absence of circling and balance defects as well as a normal performance in the rotating rod tests suggest
        a normal vestibular function for Ripor2 KO mouse (Fig. S1D).
      explanation: >-
        Behavioral screening does not exclude subtle vestibular end-organ dysfunction.
- name: fam65b zebrafish morphant
  species: Zebrafish
  genotype: Two splice-blocking morpholinos causing intron 2 or intron 3 retention
  publication: PMID:24958875
  description: >-
    Transient knockdown at 3 dpf reduces saccular hair-cell and neuromast numbers and microphonic amplitudes.
    Mild cardiac edema occurred. This experiment is distinct from the later stable CRISPR lines.
  modeled_mechanisms:
  - target: Sensorineural Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced inner-ear microphonic responses after knockdown.
    limitations: >-
      Transient morpholino exposure, nonhuman lateral-line anatomy and cell loss limit comparison with the
      human alleles. Both amplitudes fell, but only MO1 significantly raised threshold.
    evidence:
    - reference: PMID:24958875
      reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        After activation by 200-Hz stimulation, MO1 and MO2 morphants had weaker microphonic response than
        the controls did (Fig. 5 I and J).
      explanation: >-
        Both splice-blocking morpholinos reduce microphonic amplitudes at 3 dpf; only MO1 significantly increased
        threshold.
- name: ripor2 exon 14 CRISPR zebrafish lines
  species: Zebrafish
  genotype: Three stable exon 14 premature-stop lines; homozygous F2 larvae
  publication: PMID:37864412
  description: >-
    Stable exon-14 CRISPR lines showed no hearing or balance behavioral difference at 5 dpf. This differs from
    the 2014 morphants. The publisher full text, rather than its compressed abstract, establishes the hearing
    result.
  modeled_mechanisms:
  - target: Vestibular End-Organ Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      No overt vestibular behavioral phenotype in stable F2 larvae.
    limitations: >-
      Behavior at 5 dpf does not exclude subtle sensory dysfunction. Transient F0 circling was not retained
      in stable homozygotes; these are not promoter-deletion nulls.
    evidence:
    - reference: PMID:37864412
      reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to the vestibular areflexia observed in our patients, deaf Ripor2 KO mouse model and our
        zebrafish model have normal vestibular function.
      explanation: >-
        Abstract comparison; the full text specifies stable exon-14 F2 lines and behavioral assessment, with
        compensation proposed but untested.
diagnosis:
- name: Comprehensive Hearing Loss Gene Panel or Exome Sequencing
  description: >-
    Use a hearing-loss multigene panel or genomic testing, interpreting RIPOR2 variants with inheritance, phase,
    segregation and the clinical phenotype. Assess assay coverage for deletions and duplications when relevant.
    A variant of uncertain significance does not confirm or exclude DFNB104. Apparent homozygosity should be
    reconciled with parental testing. Exome sequencing identified both reported families.
  evidence:
  - reference: PMID:37864412
    reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous pathogenic variation c.1561C > T (p.Arg521*) in RIPOR2 (RHO family interacting cell polarization
      regulator 2) has been identified by WES in Tunisian siblings suffering from congenital bilateral profound
      hearing and vestibular dysfunctions.
    explanation: >-
      The abstract establishes the second family and cochleovestibular phenotype.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recommended molecular genetic testing approaches include use of a multigene hearing loss panel and/or
      genomic testing.
    explanation: >-
      General testing strategy; RIPOR2-specific causality still requires appropriate variant interpretation.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The identification of variant(s) of uncertain significance cannot be used to confirm or rule out the
      diagnosis.
    explanation: >-
      Diagnostic limitation applies to uncertain RIPOR2 findings.
    quote_role: REVIEW_SYNTHESIS
- name: Vestibular Function Testing
  description: >-
    Assess vestibular function and motor development in affected individuals. Formal cVEMP and video head-impulse
    testing documented areflexia in the Tunisian siblings. Normal bedside balance or a negative symptom history
    cannot substitute for an equivalent vestibular battery.
  evidence:
  - reference: PMID:37864412
    reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous pathogenic variation c.1561C > T (p.Arg521*) in RIPOR2 (RHO family interacting cell polarization
      regulator 2) has been identified by WES in Tunisian siblings suffering from congenital bilateral profound
      hearing and vestibular dysfunctions.
    explanation: >-
      The abstract establishes the second family and cochleovestibular phenotype.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The finding of vestibular dysfunction may guide physical therapy, particularly in children with delayed
      motor milestones.
    explanation: >-
      General care guidance supports assessment and referral; the primary family report supplies the RIPOR2-specific
      findings.
    quote_role: REVIEW_SYNTHESIS
- name: Audiologic Characterization
  description: >-
    Use age-appropriate behavioral audiometry, auditory brainstem responses and otoacoustic emissions to define
    severity and hearing function. Repeat assessment to establish course; a stable pattern in one family does
    not predict all RIPOR2 cases.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hearing status can be determined at any age and is tailored to the individual's ability to participate
      (see Audiometric and Clinical Characteristics of Hearing Loss).
    explanation: >-
      General audiologic assessment guidance.
    quote_role: REVIEW_SYNTHESIS
treatments:
- name: Cochlear Implantation
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    Consider cochlear implantation according to hearing severity, aided benefit, anatomy and patient/family
    goals. The 2023 Tunisian report documents unilateral implantation in all three siblings with satisfactory
    results; this is a small uncontrolled experience, not a genotype-wide response estimate. An implant bypasses
    hair-cell transduction rather than restoring the stereociliary defect.
  target_mechanisms:
  - target: Impaired Cochlear Mechanotransduction
    treatment_effect: BYPASSES
    description: >-
      Bypasses the failed transduction step by stimulating the auditory nerve directly.
  action_category: THERAPEUTIC
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cochlear implantation can be considered in children with severe-to-profound hearing loss who are older
      than age nine months.
    explanation: >-
      General candidacy guidance. Disease-specific outcomes are recorded in the findings for PMID:37864412,
      whose publisher full text was reviewed.
    quote_role: REVIEW_SYNTHESIS
- name: Early Language Access and Habilitation
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: auditory habilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: >-
    Provide timely access to language and communication support, with spoken, signed or combined approaches
    reflecting patient and family goals. Audiology, speech-language support and educational services are complementary.
    Newborn screening and early assessment can support identification, but universal detection of every RIPOR2
    presentation has not been demonstrated.
  action_category: THERAPEUTIC
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      On initial evaluation of individuals with hearing loss, the goals for communication must be established
      with a focus on equipping individuals with language and appropriate access to language.
    explanation: >-
      General management guidance supports communication access, without restricting benefit to spoken language.
    quote_role: REVIEW_SYNTHESIS

    quote_role: REVIEW_SYNTHESIS
- name: Hearing Aids
  therapeutic_modality: DEVICE
  action_category: THERAPEUTIC
  description: >-
    Offer amplification when residual hearing provides useful aided benefit, with reassessment as severity
    changes and consideration of implantation when indicated.
  evidence:

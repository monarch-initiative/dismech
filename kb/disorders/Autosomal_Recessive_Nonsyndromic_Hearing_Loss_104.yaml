    label: autosomal recessive nonsyndromic hearing loss 104
synonyms:
- DFNB104
- deafness, autosomal recessive 104
- RIPOR2-related autosomal recessive nonsyndromic hearing loss
- FAM65B-related deafness
description: >-
  Autosomal recessive hearing loss caused by biallelic pathogenic RIPOR2 (formerly FAM65B) variants. Reported
  families have early-onset bilateral severe-to-profound sensorineural hearing loss; vestibular areflexia occurs
  in the Tunisian sibship. Available audiograms suggested stability in the Turkish family, whereas the Tunisian
  report describes progression from severe to profound loss. Mouse and cell studies implicate stereociliary
  taper organization, hair-bundle morphogenesis and impaired mechanotransduction. Human inner-ear cellular
  mechanisms remain inferred from these models. The allele-specific dominant disorder DFNA21 is a differential
  diagnosis.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Two published recessive families anchor the clinical evidence: six affected Turkish relatives with a splice
    variant and three Tunisian siblings with a nonsense variant. These family reports do not establish population
    prevalence, complete penetrance or that either allele is globally private.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous Turkish kindred with recessive nonsyndromic, prelingual, profound hearing loss,
      we identified in the gene FAM65B (MIM611410) a splice site mutation (c.102-1G>A) that perfectly cosegregates
      with the phenotype in the family.
    explanation: >-
      Segregation in the discovery pedigree supports recessive RIPOR2-associated hearing loss.
  - reference: PMID:37864412
    reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous pathogenic variation c.1561C > T (p.Arg521*) in RIPOR2 (RHO family interacting cell polarization
      regulator 2) has been identified by WES in Tunisian siblings suffering from congenital bilateral profound
      hearing and vestibular dysfunctions.
    explanation: >-
      The abstract establishes the second family and cochleovestibular phenotype.
pathophysiology:
- name: Biallelic RIPOR2 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The Turkish NM_014722.2:c.102-1G>A allele causes exon 3 skipping in patient leukocyte RNA, producing p.Arg34_Asp86delinsSer,
    a net 52-residue deletion. The Tunisian NM_014722.4:c.1561C>T (p.Arg521*) allele is predicted to truncate
    RIPOR2 or reduce its abundance; patient protein absence and nonsense-mediated decay were not demonstrated.
    The proposed PX–BAR domain interpretation of the N-terminal deletion was challenged in published correspondence
    and remains unverified.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous Turkish kindred with recessive nonsyndromic, prelingual, profound hearing loss,
      we identified in the gene FAM65B (MIM611410) a splice site mutation (c.102-1G>A) that perfectly cosegregates
      with the phenotype in the family.
    explanation: >-
      Segregation in the discovery pedigree supports recessive RIPOR2-associated hearing loss.
  - reference: PMID:37864412
    reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous pathogenic variation c.1561C > T (p.Arg521*) in RIPOR2 (RHO family interacting cell polarization
      regulator 2) has been identified by WES in Tunisian siblings suffering from congenital bilateral profound
      hearing and vestibular dysfunctions.
    explanation: >-
      The abstract establishes the second family and cochleovestibular phenotype.
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gel electrophoresis and sequence analysis of cDNA synthesized from leukocyte mRNA from family members
      revealed that exon 3 of FAM65B was absent in all affected relatives, whereas heterozygous individuals
      (III:9, III:10, IV:3, IV:4) carried both the wild-type and the mutant transcripts (Fig. 1 D and F).
    explanation: >-
      RNA from affected and heterozygous relatives demonstrates exon skipping; this is a patient-derived molecular
      assay, not only a splice prediction.

- name: Disorganisation of the Taper Compartment
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Taperin staining becomes reduced and diffuse in Ripor2-null hair cells, whereas espin staining is retained.
    No direct interaction with taperin, CLIC5, radixin, whirlin or the PTPRQ cytoplasmic domain was detected
    in the tested heterologous assays. RhoC enhances N-terminal RIPOR2 oligomerization in HEK293 cells, and
    tagged RhoC colocalizes with RIPOR2 in explants. The RL/AA construct fails rescue but also reduces basal
    homophilic binding, so it does not isolate a uniquely RhoC-dependent effect. A primary taper defect versus
    secondary disruption by abnormal bundle morphology remains unresolved.
  evidence:
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The taperin signal is reduced and diffused in mutant hair cells, while the espin signal is similar.
    explanation: >-
      Figure 5 distinguishes altered taperin localization from preserved espin staining; a direct RIPOR2–taperin
      interaction was not detected.
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In fact, the mutation appeared to even reduce the basal homophilic binding activity of Fam65b that is
      observed without expression of RhoC (Figure 9H,I).
    explanation: >-
      This control limits causal interpretation of the RhoC-binding-deficient rescue construct.

- name: Reduced Cochlear MYH9 Abundance
  role: effector
  biological_scale: MOLECULAR
  description: >-
    MYH9 protein and its Ser1943-phosphorylated form are reduced in Ripor2-null cochleae despite increased
    Myh9 transcript. Tagged-protein co-immunoprecipitation supports association with RIPOR2. Reduced protein
    abundance is established; altered translation versus degradation and a causal role in kinocilium migration
    remain unresolved.
  evidence:
  - reference: PMID:30280293
    reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Absence of Ripor2 is associated with low Myh9 abundance in the mouse cochlea despite increased amount
      of Myh9 transcripts.
    explanation: >-
      Cochlear protein and transcript measurements establish post-transcriptional discordance, without measuring
      protein turnover.
  - reference: PMID:30280293
    reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

- name: Ripor2 knockout mouse (hair bundle morphogenesis)
  species: Mouse
  genotype: Homozygous Ripor2tm1(KOMP)Vlcg; exons 2–14 replaced by lacZ on a C57BL/6 background
  publication: PMID:30280293
  description: >-
    The same KOMP null allele studied for polarity, protein abundance and vestibular behavior.
  modeled_mechanisms:
  - target: Misorientation of Developing Hair Bundles
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Embryonic and postnatal orientation defects.
    limitations: >-
      Human cochlear cellular measurements are unavailable; fidelity concerns the model-derived mechanism,
      not complete clinical equivalence.
    evidence:
    - reference: PMID:30280293
      reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we demonstrate that during the morphogenesis of the hair cell bundle, absence of Ripor2 affects
        the orientation of this key subcellular structure.
      explanation: >-
        Orientation and kinocilium-position defects are present at E18.5 and P5 in null mice.
    readouts:
    - name: Hair-bundle orientation
      target: Misorientation of Developing Hair Bundles
      direction: ALTERED
      interpretation: >-
        Excess angular deviations and abnormal kinocilium position at E18.5 and P5.
      evidence:
      - reference: PMID:30280293
        reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Here, we demonstrate that during the morphogenesis of the hair cell bundle, absence of Ripor2 affects
          the orientation of this key subcellular structure.
        explanation: >-
          Orientation and kinocilium-position defects are present at E18.5 and P5 in null mice.
  - target: Reduced Cochlear MYH9 Abundance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced protein abundance despite increased transcript.
    limitations: >-
      Human cochlear cellular measurements are unavailable; fidelity concerns the model-derived mechanism,
      not complete clinical equivalence.
    evidence:
    - reference: PMID:30280293
      reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Absence of Ripor2 is associated with low Myh9 abundance in the mouse cochlea despite increased amount
        of Myh9 transcripts.
      explanation: >-
        Cochlear protein and transcript measurements establish post-transcriptional discordance, without measuring
        protein turnover.
    readouts:
    - name: Cochlear MYH9 protein abundance
      target: Reduced Cochlear MYH9 Abundance
      direction: DECREASED
      interpretation: >-
        Protein/transcript discordance does not establish altered protein half-life.
      evidence:
      - reference: PMID:30280293
        reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."

    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hearing aids (sound amplification), customized by an audiologist to the degree and frequency of hearing
      loss, can be used in individuals with mild-to-severe hearing loss.
    explanation: >-
      General audiologic guidance; not a measured RIPOR2-specific response rate.
    quote_role: REVIEW_SYNTHESIS
differential_diagnoses:
- name: RIPOR2-related autosomal dominant hearing loss (DFNA21)
  description: >-
    DFNA21 is associated with the heterozygous RIPOR2 c.1696_1707del (p.Gln566_Lys569del) founder allele. Onset
    was highly variable, from congenital to age 70, although typically later than recessive DFNB104. The dominant
    molecular mechanism remains uncertain.
  distinguishing_features:
  - Specific heterozygous p.Gln566_Lys569del allele and dominant segregation
  - Variable onset and progressive course; onset alone is not diagnostic
  - The recessive splice allele also produces an in-frame deletion, so broad variant class is insufficient
  evidence:
  - reference: PMID:32631815
    reference_title: "A RIPOR2 in-frame deletion is a frequent and highly penetrant cause of adult-onset hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss associated with the deletion in 63 subjects displayed variable audiometric characteristics
      and an average (SD) age of onset of 30.6 (14.9) years (range 0-70 years).
    explanation: >-
      The observed range precludes an absolute adult-onset distinction.
- name: Usher syndrome
  description: >-
    Usher syndrome type I can initially resemble early deafness with vestibular areflexia. Retinal degeneration
    may emerge later, so a normal early eye examination does not exclude it. Molecular testing and longitudinal
    clinical assessment distinguish the diagnoses.
  distinguishing_features:
  - Pathogenic variants in an Usher-associated gene rather than recessive RIPOR2 alleles
  - Retinal degeneration supports Usher syndrome, but its absence early in life is not exclusionary
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ophthalmology evaluation may be recommended, as individuals with hearing loss may depend more on vision
      for sensory input, as well as to evaluate for retinitis pigmentosa.
    explanation: >-
      General hearing-loss evaluation includes assessment for retinal disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nonsyndromic HL mimic: HL is congenital; RP begins in late adolescence or early adulthood.
    explanation: >-
      The Usher type I row explicitly describes a nonsyndromic hearing-loss mimic before retinal disease emerges.
    quote_role: REVIEW_SYNTHESIS
discussions:
- discussion_id: mismatch_vestibular_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Vestibular End-Organ Dysfunction
  - animal_models#Fam65b/Ripor2 knockout mouse
  prompt: >-
    Do differing vestibular assays, alleles or compensatory mechanisms explain the human–model discrepancy?
  rationale: >-
    Human vestibular areflexia was characterized with cVEMP and video head-impulse testing, whereas the null
    mouse was screened by behavior and rotarod. Stable exon-14 zebrafish lines had no overt hearing or balance
    behavioral difference at 5 dpf; the earlier morpholino experiment measured microphonics at 3 dpf. These
    are different alleles, developmental stages and assays. RIPOR1/RIPOR3 compensation is a proposed explanation,
    not a demonstrated mechanism.
  proposed_experiments:
  - experiment_id: ripor_paralogue_expression_vestibular
    name: Paralogue expression and compensation in mouse versus human vestibular epithelium
    description: >-
      First compare vestibular end-organ function with sensitive, age-appropriate assays across models and
      affected families. Test paralogue expression and combined perturbation only after distinguishing subtle
      sensory deficits from preserved overt balance behavior.
    would_support:
    - pathophysiology#Vestibular End-Organ Dysfunction
    supporting_outcome:
    - >-
      Combined paralogue perturbation reveals a vestibular deficit absent after Ripor2 loss alone, supporting
      compensation in the tested model.
    refuting_outcome:
    - >-
      Equivalent sensitive testing already detects dysfunction after Ripor2 loss alone, supporting an ascertainment
      contribution rather than complete model resistance.
- discussion_id: gap_allele_specific_vestibular
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Vestibular Areflexia
  - genetic#RIPOR2
  prompt: >-
    Is the vestibular phenotype specific to the nonsense allele, or was it simply not
    looked for in the first family?
  rationale: >-
    The two reported families differ on vestibular involvement and also differ on allele
    class and on how vestibular function was assessed. The Turkish kindred was reported as
    having no balance problems on clinical assessment; the Tunisian siblings were
    characterised with cervical VEMPs and video head-impulse testing, which detect
    dysfunction that a clinical balance history does not.

    So there are at least three live readings - an allele-specific effect, a
    genetic-background effect, and an ascertainment difference - and two families cannot
    distinguish them. The practical stake is whether to counsel a newly diagnosed RIPOR2
    patient about vestibular involvement, and whether to test for it.
  proposed_experiments:
  - experiment_id: vestibular_testing_all_ripor2_families
    name: Uniform vestibular testing across all reported and newly ascertained RIPOR2 families
    description: >-
      Apply the same vestibular battery - cervical and ocular VEMPs, video head-impulse
      testing, and developmental motor milestones - to affected individuals from both
      published recessive families and any newly ascertained ones, and record the result
      against allele class.
    would_support:
    - phenotypes#Vestibular Areflexia
    supporting_outcome:
    - >-
      Formal testing finds vestibular dysfunction in splice-allele patients too, making
      vestibular involvement part of the disease rather than an allele-specific feature.
    refuting_outcome:
    - >-
      Splice-allele patients test normal on the same battery, which would support a real
      allele-specific difference and make variant class relevant to counselling.

- discussion_id: gap_ripor2_domain_and_causal_intermediates
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic RIPOR2 Loss-of-Function Variant
  - pathophysiology#Reduced Cochlear MYH9 Abundance
  - pathophysiology#Disorganisation of the Taper Compartment
  prompt: >-
    Which structural and molecular dependencies directly mediate RIPOR2-related hearing loss?
  rationale: >-
    The PX–BAR assignment was challenged by sequence/structure analysis, and the authors agreed that experimental
    confirmation was needed. MYH9 abundance, tubulin acetylation and taperin localization change in null mice,
    but their relative causal contributions are unresolved. The RL/AA construct alters both RhoC binding and
    basal self-association. Selective rescue and structural studies are needed to distinguish these possibilities.
  evidence:
  - reference: PMID:25239234
    reference_title: Little evidence that FAM65B belongs to the family of phox homology (PX) and bin/amphiphysin/rvs (BAR) domain-containing proteins.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Secondary structure predictions of FAM65 do not reveal any similarity to the PX–BAR family of molecules.
    explanation: >-
      The published computational challenge supports treating the initial domain assignment as unresolved.
notes: >-
  RIPOR2 and FAM65B are current and historical symbols for the same gene. Primary family studies supply the
  disease-specific clinical baseline; the general GeneReviews hearing-loss chapter supplies diagnosis, management
  and recessive counseling guidance. No RIPOR2-specific clinical gene-replacement efficacy is established by
  neonatal explant rescue. The 2023 publisher full text was readable during review, but automated reference
  fetching returned HTTP 403; its clinical and stable-zebrafish details are recorded in publication findings
  without inventing cache-backed quotations.


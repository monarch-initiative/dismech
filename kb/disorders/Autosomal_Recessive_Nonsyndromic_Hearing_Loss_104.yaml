- name: Loss of RIPOR2 from the Stereociliary Taper
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    RIPOR2 localizes around the basal stereociliary taper in mouse hair cells. Patient-deletion constructs
    accumulate in cytoplasmic inclusions in COS7 cells, and a related construct fails normal targeting in cultured
    mouse hair cells. These overexpression results support defective localization; they do not show endogenous
    mutant protein abundance or localization in the human cochlea. STORM ring geometry does not by itself establish
    direct lipid binding.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The wild-type protein targets the plasma membrane, whereas the mutant protein accumulates in cytoplasmic
      inclusion bodies and does not reach the membrane.
    explanation: >-
      Transfected COS7 cells expressing the deletion construct; this does not measure endogenous protein abundance
      in patients.
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using biochemistry and stochastic optical reconstruction microscopy (STORM), we show here that Fam65b
      oligomers form a circumferential ring near the basal taper of the mechanically sensitive stereocilia
      of murine hair cells.
    explanation: >-
      Mouse imaging and heterologous biochemistry support a ring-like oligomeric organization.

        explanation: >-
          Cochlear protein and transcript measurements establish post-transcriptional discordance, without
          measuring protein turnover.
  - target: Reduced Cochlear Tubulin Acetylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced acetylated alpha-tubulin in cochlear extracts.
    limitations: >-
      Human cochlear cellular measurements are unavailable; fidelity concerns the model-derived mechanism,
      not complete clinical equivalence.
    evidence:
    - reference: PMID:30280293
      reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."

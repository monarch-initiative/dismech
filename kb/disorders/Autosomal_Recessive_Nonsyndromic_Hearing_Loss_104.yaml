animal_models:

- name: Fam65b/Ripor2 knockout mouse
  species: Mouse
  genotype: Fam65b (Ripor2) constitutive knockout, homozygous
  publication: PMID:27269051
  description: >-
    The homozygous null mouse, which matches the biallelic human genotype in kind. It is
    the source of essentially everything known about how RIPOR2 works: the taper ring,
    the taperin dependency, the RhoC interaction, and the observation that stereocilia
    develop before they deteriorate.
  modeled_mechanisms:
  - target: Disorganisation of the Taper Compartment
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Loss of the RIPOR2 ring, with disruption of taperin's dense-core structure at the
      same site.
    limitations: >-
      A constitutive null, whereas the Turkish human allele produces a mislocalised
      protein. Whether a mislocalised product is inert or mildly interfering is not
      addressed by a knockout.
    readouts:
    - name: Taperin dense-core structure at the stereociliary taper
      target: Disorganisation of the Taper Compartment
      direction: ALTERED
      interpretation: >-
        Taperin's organisation at the taper is disrupted in the absence of Fam65b,
        establishing the compartment-level defect.
      evidence:
      - reference: PMID:27269051
        reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Taperin, a second protein near the taper, forms a dense-core-like structure that
          is disrupted in the absence of Fam65b.
        explanation: >-
          The imaging result behind this readout.
    evidence:
    - reference: PMID:27269051
      reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using biochemistry and stochastic optical reconstruction microscopy (STORM), we
        show here that Fam65b oligomers form a circumferential ring near the basal taper
        of the mechanically sensitive stereocilia of murine hair cells.
      explanation: >-
        Supports the model as the system in which the taper mechanism was defined.
  - target: Mechanotransduction Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Mechanotransduction is affected in the knockout, and stereocilia deteriorate after
      beginning to develop.
    limitations: >-
      Mouse hair cell transduction is measured directly; the human equivalent is inferred
      from profound congenital deafness with no cochlear malformation, so the two are
      linked by argument rather than by a shared measurement.
    readouts:
    - name: Hair cell mechanotransduction and stereocilia integrity
      target: Mechanotransduction Failure
      direction: DECREASED
      interpretation: >-
        Transduction is impaired and stereocilia deteriorate despite normal initiation of
        development.
      evidence:
      - reference: PMID:27269051
        reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Stereocilia of Fam65b-deficient murine hair cells start to develop, but
          mechanotransduction is affected and stereocilia deteriorate.
        explanation: >-
          Both halves of the readout in one sentence: function and structure.
    evidence:
    - reference: PMID:27269051
      reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings thus reveal a highly organized compartment near the base of
        stereocilia that is critical for hair cell function and affected in disease.
      explanation: >-
        The authors' own statement linking the model's compartment to human disease.
  - target: Vestibular End-Organ Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The knockout mouse is deaf but vestibularly normal, while the Tunisian patients have
      vestibular areflexia. The negative result is recorded because it is the substance of
      this entry's model-mismatch discussion, not an incidental difference.
    limitations: >-
      The mouse is a constitutive null and the patients carry a nonsense allele, so the
      comparison is close but not exact; and the discrepancy is reported by a paper whose
      own zebrafish model behaves like the mouse, which strengthens the observation rather
      than explaining it. Paralogue compensation has been proposed and not tested.
    evidence:
    - reference: PMID:37864412
      reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to the vestibular areflexia observed in our patients, deaf Ripor2 KO
        mouse model and our zebrafish model have normal vestibular function.
      explanation: >-
        REFUTE against the proposition that the mouse reproduces the human vestibular
        phenotype - which is exactly what FAILS_TO_RECAPITULATE asserts.

- name: Ripor2 knockout mouse (hair bundle morphogenesis)
  species: Mouse
  genotype: Ripor2 knockout, homozygous
  publication: PMID:30280293
  description: >-
    The same null genotype studied for bundle orientation rather than taper
    ultrastructure, and the source of the Myh9 route.
  modeled_mechanisms:
  - target: Hair Bundle Malformation and Misorientation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Misoriented hair bundles during morphogenesis, aberrant kinocilium placement, and
      reduced Myh9 protein despite increased transcript.
    limitations: >-
      MODERATE because bundle orientation has not been examined in human RIPOR2 tissue and
      cannot be - the inner ear is not biopsied - so the human counterpart of this
      structural readout is unobserved rather than confirmed.
    readouts:
    - name: Cochlear Myh9 protein abundance
      target: Hair Bundle Malformation and Misorientation
      direction: DECREASED
      interpretation: >-
        Myh9 protein falls in the Ripor2-null cochlea while its transcript rises,
        identifying a post-transcriptional dependency.
      evidence:
      - reference: PMID:30280293
        reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Absence of Ripor2 is associated with low Myh9 abundance in the mouse cochlea
          despite increased amount of Myh9 transcripts.
        explanation: >-
          The measurement, with the transcript comparison that makes it interpretable.
    evidence:
    - reference: PMID:30280293
      reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we demonstrate that during the morphogenesis of the hair cell bundle,
        absence of Ripor2 affects the orientation of this key subcellular structure.
      explanation: >-
        Supports the model as informative for the bundle-morphogenesis node.

- name: fam65b zebrafish morphant
  species: Zebrafish
  genotype: fam65b morpholino knockdown
  publication: PMID:24958875
  description: >-
    Knockdown in zebrafish, used in the founding report as independent functional support
    for the gene. It reduces saccular hair cell and neuromast numbers and impairs hearing.
  modeled_mechanisms:
  - target: Congenital Profound Sensorineural Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces hearing loss on knockdown, alongside a loss of hair cells.
    limitations: >-
      A morpholino knockdown rather than a genetic null, in a species whose hair cells
      regenerate and whose lateral line has no human counterpart. The hair cell loss also
      goes further than the mouse phenotype, where cells are present but their bundles
      deteriorate - so the two models disagree on whether cells die, and neither
      observation has a human correlate.
    evidence:
    - reference: PMID:24958875
      reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In zebrafish, knockdown of fam65b leads to significant reduction of numbers of
        saccular hair cells and neuromasts and to hearing loss.
      explanation: >-
        PARTIAL because knockdown supports gene function in hearing without modelling the
        human allele or its cellular consequence.

diagnosis:

- name: Comprehensive Hearing Loss Gene Panel or Exome Sequencing
  description: >-
    DFNB104 is clinically indistinguishable from the many other causes of congenital
    profound nonsyndromic deafness, so it is found by sequencing rather than by
    phenotyping. Both reported families were solved by exome sequencing in a consanguineous
    pedigree, where homozygosity mapping narrows the search substantially.
  evidence:
  - reference: PMID:37864412
    reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in RIPOR2 (RHO family interacting cell polarization regulator 2) has been identified
      by WES in Tunisian siblings suffering from congenital bilateral profound hearing and
      vestibular dysfunctions.
    explanation: >-
      Names the diagnostic method used in the second family.

- name: Vestibular Function Testing
  description: >-
    Worth doing in a RIPOR2 patient rather than assuming the deafness is isolated. The
    Tunisian siblings' vestibular involvement was characterised by cervical VEMP and video
    head-impulse testing; the Turkish kindred, assessed clinically, had no balance
    problems. Whether the difference is real or a difference in how hard anyone looked is
    the open question below.
  evidence:
  - reference: PMID:37864412
    reference_title: "RIPOR2: A new gene of non-syndromic cochleovestibular dysfunction, discrepancy between human pathology and animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cochleovestibular dysfunctions are rare conditions misrecognized.
    explanation: >-
      The paper's framing claim, which is the argument for testing rather than assuming.

treatments:

- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  description: >-
    The standard intervention for congenital profound sensorineural hearing loss, and the
    only one that addresses the phenotype. The mechanism supports it in principle: the
    lesion is in the hair cell bundle, upstream of the spiral ganglion that an implant
    stimulates, and no cochlear structural malformation has been described in this
    disease.

    No outcome data exist for RIPOR2 patients specifically. Recorded without an evidence
    item rather than with a quote from the general cochlear-implant literature, which
    would not be about this disease.
  target_mechanisms:
  - target: Mechanotransduction Failure
    description: >-
      Bypasses the failed transduction step by stimulating the auditory nerve directly.
  notes: >-
    Carries no evidence item deliberately. The published RIPOR2 literature reports no
    implant outcomes; the mechanistic rationale above is this entry's inference and is
    labelled as such.

- name: Early Identification and Habilitation
  therapeutic_modality: BEHAVIORAL
  description: >-
    Because the loss is prelingual and profound, the outcome that is actually modifiable
    is spoken-language development, and the modifier is how early the loss is identified
    and habilitated. Newborn hearing screening detects it. As with implantation, there are
    no disease-specific data.
  notes: >-
    No evidence item, for the same reason as above. This is general practice for congenital
    profound deafness, not a RIPOR2 finding.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Autosomal recessive inheritance with a 25% recurrence risk per pregnancy for carrier
    couples. Both reported families are consanguineous, which raises the prior for a
    recessive cause in a similar family and makes carrier testing of at-risk relatives
    worth offering.

differential_diagnoses:

- name: RIPOR2-related autosomal dominant hearing loss (DFNA21)
  description: >-
    The allelic dominant disorder, and the entity most likely to be confused with this one
    because it is the same gene. A heterozygous 12-nucleotide in-frame deletion causes
    adult-onset progressive hearing loss, segregating dominantly in twelve Dutch families
    and highly penetrant. It is common enough in the southeast Netherlands to be found in
    people not selected for hearing loss at all, which is the opposite epidemiological
    situation from the private recessive alleles of DFNB104.
  distinguishing_features:
  - Heterozygous in-frame deletion rather than biallelic loss of function
  - Adult onset, with a mean around the fourth decade, rather than congenital
  - Progressive rather than stable
  - A frequent founder allele in one population rather than a family-private variant
  evidence:
  - reference: PMID:32631815
    reference_title: "A RIPOR2 in-frame deletion is a frequent and highly penetrant cause of adult-onset hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An in-frame deletion of 12 nucleotides in RIPOR2 was identified as a highly
      penetrant cause of adult-onset progressive hearing loss that segregated as an
      autosomal dominant trait in 12 families from the Netherlands.
    explanation: >-
      The dominant disorder in full - allele, onset, course and inheritance - every one of
      which differs from this entry's disease.
  - reference: PMID:32631815
    reference_title: "A RIPOR2 in-frame deletion is a frequent and highly penetrant cause of adult-onset hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study expands the phenotypic spectrum associated with RIPOR2 defects which had
      so far only been described to underlie early-onset recessively inherited HL.
    explanation: >-
      States that the two RIPOR2 phenotypes are distinct, and that the recessive
      early-onset one came first.

- name: Usher syndrome
  description: >-
    Relevant only for the family with vestibular involvement. Congenital profound deafness
    with vestibular areflexia is the classic type 1 Usher presentation, so a RIPOR2 patient
    with that combination can be mistaken for one until the retina is examined and found
    normal. There is no retinitis pigmentosa in DFNB104.
  distinguishing_features:
  - No retinitis pigmentosa or other retinal degeneration
  - Biallelic RIPOR2 variants rather than variants in an Usher gene

discussions:

- discussion_id: mismatch_vestibular_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Vestibular End-Organ Dysfunction
  - animal_models#Mouse
  prompt: >-
    Why do RIPOR2-null mice and zebrafish have normal vestibular function when human
    patients with a homozygous RIPOR2 nonsense allele have vestibular areflexia?
  rationale: >-
    This is a mismatch rather than a gap: the model evidence exists and is clear, and it
    disagrees with the patients. The mouse knockout is deaf with normal vestibular
    function, and a zebrafish model behaves the same way, while the Tunisian siblings have
    documented vestibular areflexia with abnormal cervical VEMPs and video head-impulse
    testing. The paper reporting the patients names the discrepancy in its own title.

    It matters because the mouse is the whole mechanistic account of this disease. Every
    claim in the pathophysiology section above about the taper ring, taperin, RhoC and
    Myh9 comes from an animal in which one of the two affected end organs behaves
    normally. If the vestibular epithelium can tolerate RIPOR2 loss in mouse but not in
    human, the mouse cochlear mechanism cannot be assumed to transfer without checking.

    A specific hypothesis is available: RIPOR1 and RIPOR3 are close paralogues, and
    compensation by them in the mouse vestibular epithelium could mask the phenotype.
    Nobody has tested it, and an alternative - that human vestibular hair cells depend
    more heavily on the taper compartment than mouse ones do - would have quite different
    implications for reading the rest of the mouse data.
  proposed_experiments:
  - experiment_id: ripor_paralogue_expression_vestibular
    name: Paralogue expression and compensation in mouse versus human vestibular epithelium
    description: >-
      Compare RIPOR1, RIPOR2 and RIPOR3 expression across cochlear and vestibular hair
      cells in mouse and in human inner ear tissue, then test whether removing the
      paralogues alongside Ripor2 in mouse vestibular hair cells unmasks a vestibular
      phenotype.
    would_support:
    - pathophysiology#Vestibular End-Organ Dysfunction
    supporting_outcome:
    - >-
      Paralogue expression is higher in mouse vestibular hair cells than in the human
      equivalent, and combined removal produces vestibular dysfunction in mouse - which
      would make the mismatch a compensation artefact and leave the cochlear mechanism
      transferable.
    refuting_outcome:
    - >-
      Paralogue expression is comparable across species and combined removal leaves
      vestibular function intact, which would point to a genuine species difference in how
      the taper compartment is used and would weaken the case for reading any of the mouse
      mechanism straight across.

- discussion_id: gap_allele_specific_vestibular
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Vestibular Areflexia
  - genetic#RIPOR2
  prompt: >-
    Is the vestibular phenotype specific to the nonsense allele, or was it simply not
    looked for in the first family?
  rationale: >-
    The two reported families differ on vestibular involvement and also differ on allele
    class and on how vestibular function was assessed. The Turkish kindred was reported as
    having no balance problems on clinical assessment; the Tunisian siblings were
    characterised with cervical VEMPs and video head-impulse testing, which detect
    dysfunction that a clinical balance history does not.

    So there are at least three live readings - an allele-specific effect, a
    genetic-background effect, and an ascertainment difference - and two families cannot
    distinguish them. The practical stake is whether to counsel a newly diagnosed RIPOR2
    patient about vestibular involvement, and whether to test for it.
  proposed_experiments:
  - experiment_id: vestibular_testing_all_ripor2_families
    name: Uniform vestibular testing across all reported and newly ascertained RIPOR2 families
    description: >-
      Apply the same vestibular battery - cervical and ocular VEMPs, video head-impulse
      testing, and developmental motor milestones - to affected individuals from both
      published recessive families and any newly ascertained ones, and record the result
      against allele class.
    would_support:
    - phenotypes#Vestibular Areflexia
    supporting_outcome:
    - >-
      Formal testing finds vestibular dysfunction in splice-allele patients too, making
      vestibular involvement part of the disease rather than an allele-specific feature.
    refuting_outcome:
    - >-
      Splice-allele patients test normal on the same battery, which would support a real
      allele-specific difference and make variant class relevant to counselling.

notes: >-
  Named entity check. RIPOR2 carries two hearing-loss diseases and the literature does not
  always separate them in its titles. This entry is the recessive one - DFNB104, biallelic
  loss of function, congenital, profound, stable. The dominant in-frame-deletion disorder
  (adult-onset, progressive, a Dutch founder allele) is a different disease and is curated
  only under differential diagnoses, where PMID:32631815 is cited for what it actually
  reports. The one place that paper is cited outside that section is on the gene entry,
  for its statement that the two phenotypes are distinct.

  Gene symbol. RIPOR2 was formerly FAM65B, and the founding paper and the 2016 mouse work
  both use the old symbol throughout. Snippets quote whichever symbol the source used;
  the ontology binding is to the current one.

  Model provenance. Every mechanistic claim in the pathophysiology section other than the
  protein-mislocalisation result comes from mouse, and the evidence items are typed
  MODEL_ORGANISM to keep that visible. Human inner ear tissue is not obtainable, so this
  is not a curation shortcut that better sources would fix.


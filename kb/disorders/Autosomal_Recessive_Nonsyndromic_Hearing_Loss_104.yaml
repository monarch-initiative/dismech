- name: Stereocilia Disorganisation
  role: effector
  biological_scale: CELLULAR
  description: >-
    Inner-hair-cell bundles are already severely disorganized at P2 in Ripor2-null mice; outer-hair-cell bundles
    initially retain much of their staircase arrangement but show orientation defects. By P5 both cell types
    have abnormal length, thickness or arrangement of stereocilia. Deterioration occurs during maturation.
    Little hair-cell loss is evident at P16/P28, so bundle pathology is not equivalent to early wholesale hair-cell
    death.
  evidence:
  - reference: PMID:27269051
    reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Stereocilia of Fam65b-deficient murine hair cells start to develop, but mechanotransduction is affected
      and stereocilia deteriorate.
    explanation: >-
      The full-text time course shows early defects during maturation, rather than normal development followed
      only by adult maintenance failure.

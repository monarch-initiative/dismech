genetic:

- name: RIPOR2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RIPOR2
    term:
      id: hgnc:13872
      label: RIPOR2
  association: >-
    Biallelic loss-of-function variants in RIPOR2 cause DFNB104. The gene-disease claim
    rests on perfect cosegregation in a large consanguineous Turkish kindred, functional
    demonstration that the mutant protein fails to reach the plasma membrane, expression
    of the wild-type protein in the right cells at the right developmental stages, and
    loss of hair cells on knockdown in zebrafish - all in the founding report - with an
    unrelated Tunisian family and a second allele added later.

    RIPOR2 is also a dominant deafness gene, and that is a separate disease. A heterozygous
    12-nucleotide in-frame deletion causes adult-onset progressive hearing loss and is a
    frequent, highly penetrant founder allele in the Netherlands. Variant class and
    zygosity, not the gene, decide which disease a patient has.
  evidence:
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that FAM65B is a plasma membrane-associated protein of hair cell
      stereocilia that is essential for hearing.
    explanation: >-
      The gene-function conclusion of the founding report.
  - reference: PMID:24958875
    reference_title: "FAM65B is a membrane-associated protein of hair cell stereocilia required for hearing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In zebrafish, knockdown of fam65b leads to significant reduction of numbers of
      saccular hair cells and neuromasts and to hearing loss.
    explanation: >-
      The independent functional support for the gene, from a model organism rather than
      from the family.
  - reference: PMID:32631815
    reference_title: "A RIPOR2 in-frame deletion is a frequent and highly penetrant cause of adult-onset hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study expands the phenotypic spectrum associated with RIPOR2 defects which had
      so far only been described to underlie early-onset recessively inherited HL.
    explanation: >-
      Curated on the gene rather than on any phenotype node: it establishes that RIPOR2
      carries two distinct diseases, and confirms from the outside that the recessive,
      early-onset one is the disease this entry describes.

inheritance:

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both reported families are consanguineous and both affected sibships are homozygous;
    heterozygous relatives are unaffected for this phenotype. Consanguinity is not
    incidental here - it is how two private alleles came to be homozygous at all, and it
    is why the reported families come from populations where consanguineous marriage is
    common rather than from anywhere the gene is enriched.
  evidence:

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Discuss recurrence risk after establishing the causal recessive variants and parental genotypes. Carrier
    testing of relatives and reproductive options can be offered according to family preferences. Counseling
    must distinguish recessive alleles from the specific dominant DFNA21 allele.

  action_category: COUNSELING_INFORMATIONAL
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf

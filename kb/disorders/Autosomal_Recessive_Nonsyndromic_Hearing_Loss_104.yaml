  - target: Stereocilia Disorganisation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Early bundle abnormalities and deterioration during postnatal maturation.
    limitations: >-
      Human cochlear cellular measurements are unavailable; fidelity concerns the model-derived mechanism,
      not complete clinical equivalence.
    evidence:
    - reference: PMID:27269051
      reference_title: "Murine Fam65b forms ring-like structures at the base of stereocilia critical for mechanosensory hair cell function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Stereocilia of Fam65b-deficient murine hair cells start to develop, but mechanotransduction is affected
        and stereocilia deteriorate.
      explanation: >-
        The full-text time course shows early defects during maturation, rather than normal development followed

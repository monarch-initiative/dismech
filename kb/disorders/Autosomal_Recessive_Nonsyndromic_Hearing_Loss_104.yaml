- name: Vestibular End-Organ Dysfunction
  role: outcome
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Reported in one of the two families. The Tunisian siblings homozygous for p.Arg521*
    have vestibular dysfunction alongside their deafness, while the Turkish kindred with
    the splice allele had no balance problems.

    Marked PROVISIONAL because with two families and two alleles it is not possible to
    tell whether the difference is allele-specific, background-dependent, or an artefact
    of how carefully vestibular function was assessed in the earlier family. The mouse
    cannot arbitrate: it is deaf with normal vestibular function, which is curated as a
    model mismatch rather than as evidence against the human finding.

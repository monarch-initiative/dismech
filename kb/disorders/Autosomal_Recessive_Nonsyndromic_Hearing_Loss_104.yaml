- name: Misorientation of Developing Hair Bundles
  role: effector
  biological_scale: CELLULAR
  description: >-
    Ripor2-null cochleae have displaced kinocilia and increased deviations of hair-bundle orientation at E18.5
    and P5. Reduced MYH9 and acetylated tubulin accompany the phenotype, but neither was selectively rescued
    to establish its contribution to polarity.
  evidence:
  - reference: PMID:30280293
    reference_title: "Ripor2 is involved in auditory hair cell stereociliary bundle structure and orientation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we demonstrate that during the morphogenesis of the hair cell bundle, absence of Ripor2 affects
      the orientation of this key subcellular structure.
    explanation: >-
      Orientation and kinocilium-position defects are present at E18.5 and P5 in null mice.

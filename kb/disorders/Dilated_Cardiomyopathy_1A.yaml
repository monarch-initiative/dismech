  notes: >-
    No population-based prevalence estimate exists for the LMNA-specific form of
    dilated cardiomyopathy. What the literature reports instead is the share of
    dilated cardiomyopathy attributable to LMNA (roughly 5-10%, and 6.2% of
    familial DCM probands in the Norwegian national cohort); because that is a
    case fraction rather than a population rate, it is curated in
    genetic[].case_fractions and deliberately not encoded as rate_per_100000
    here.

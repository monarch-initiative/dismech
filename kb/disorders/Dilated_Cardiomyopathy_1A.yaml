    reference_title: Characterization and natural history of patients with LMNA-related dilated cardiomyopathy in the phase 3 REALM-DCM trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atrial fibrillation was present in 60% of patients; 79% of all patients had

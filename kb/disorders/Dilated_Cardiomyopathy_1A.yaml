    explanation: >-
      Independent contemporary trial cohort giving an atrial fibrillation
      prevalence of 60%, concordant with the FREQUENT band.
- category: Cardiac
  name: Ventricular Tachyarrhythmia
  frequency: FREQUENT
  description: >-
    Non-sustained and sustained ventricular tachycardia and ventricular
    fibrillation are the proximate cause of sudden death in this disease.
    Non-sustained VT is itself one of the independent predictors of subsequent
    malignant arrhythmia and is therefore actively sought on ambulatory
    monitoring in carriers.
  phenotype_term:
    preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of clinical manifestations increased broadly from index

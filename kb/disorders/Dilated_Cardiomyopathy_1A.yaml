- name: DNA Damage Response and cGAS-Driven Innate Immune Activation
  biological_scale: CELLULAR
  role: intermediate
  description: >-
    Beyond its structural role, lamin A/C participates in processing of
    transcription-associated topoisomerase lesions and repair of double-stranded
    DNA breaks. Envelope rupture and impaired repair release genomic DNA into the
    cytosol, where the sensor cyclic GMP-AMP synthase (cGAS) activates the DNA
    damage response and downstream STING/TBK1-IRF3 and NF-kB signalling, creating
    a proinflammatory myocardial milieu that drives cardiomyocyte apoptosis and
    fibrosis. Causality is established genetically: knocking out the cGAS-encoding
    gene in cardiomyocyte-specific Lmna-deleted mice prolongs survival and
    improves cardiac function.

- name: NCT02057341
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Phase 2 open-label study of ARRY-371797 in LMNA-related dilated
    cardiomyopathy. Twelve patients received 100 or 400 mg twice daily for 48
    weeks; six-minute walk distance improved at 12 weeks and NT-proBNP declined.
    This signal motivated the phase 3 trial that subsequently failed.
  target_phenotypes:
  - preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:36515663
    reference_title: "Efficacy and Safety of ARRY-371797 in LMNA-Related Dilated Cardiomyopathy: A Phase 2 Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve patients were enrolled; median (minimum, maximum) 6-minute walk test
      distance at baseline was 314 (246, 412) m.
    explanation: >-
      Documents the trial's size and baseline functional capacity. Classified
      PARTIAL because the small single-arm design limits the strength of the
      efficacy inference.
discussions:
- discussion_id: lmna_mechanical_vs_chromatin_primacy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is nuclear envelope mechanical rupture or lamina-chromatin untethering the
    primary driver of cardiomyocyte dysfunction in LMNA cardiomyopathy, and does
    the answer differ by allele class?
  attaches_to:
  - pathophysiology#Cardiomyocyte Nuclear Envelope Fragility and Rupture
  rationale: >-
    The two mechanistic hypotheses curated here are not merely different
    descriptions of the same process; they imply different therapeutic targets. If
    mechanical rupture is primary, reducing force transmission onto the nucleus
    (LINC-complex disruption, the rationale for AAV approaches in development) is
    the rational intervention. If lamina-chromatin untethering is primary, the
    target is transcriptional. The strongest available human-cell evidence argues
    against global compartmentation failure being primary, but it comes from a
    single haploinsufficient genotype in immature, mechanically unloaded
    iPSC-cardiomyocytes, which is precisely the condition under which the
    mechanical hypothesis would predict the chromatin arm to look unimportant. The
    allele-class question is untested: dominant-negative missense alleles that
    poison lamina assembly may weight the two arms differently from truncating
    alleles that simply halve lamin dose.
  proposed_experiments:
  - experiment_id: exp_lmna_loaded_isogenic_allelic_series
    name: Mechanically loaded isogenic allelic series
    description: >-
      Compare isogenic iPSC-cardiomyocyte lines carrying a truncating allele and a
      dominant-negative rod-domain missense allele under controlled cyclic
      mechanical load, measuring nuclear envelope rupture frequency, cGAS
      recruitment, MAPK activation and chromatin compartment segregation in the
      same cells, so the relative weight of the two arms is measured rather than
      inferred across studies.
  evidence:
  - reference: PMID:31395619
    reference_title: Chromatin compartment dynamics in a haploinsufficient model of cardiac laminopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in A-type nuclear lamins cause dilated cardiomyopathy, which is
      postulated to result from dysregulated gene expression due to changes in
      chromatin organization into active and inactive compartments.
    explanation: >-
      States the gene-regulatory hypothesis that this gap weighs against the
      mechanical hypothesis, framing the open question.
- discussion_id: lmna_mapk_mouse_to_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does MAPK stress-kinase activation, which is causal in the Lmna H222P mouse,
    actually drive disease progression in human LMNA cardiomyopathy?
  attaches_to:
  - pathophysiology#MAPK Stress-Kinase Cascade Activation
  rationale: >-
    This is an unusually clean example of a model-to-human mismatch, because the
    translational test was actually run. In the mouse, MAPK activation precedes
    detectable cardiomyopathy and pharmacological inhibition of the ERK arm delays
    ventricular dilatation. That rationale carried a selective p38alpha inhibitor
    into a phase 2 study with an encouraging functional signal and then into
    REALM-DCM, the first phase 3 disease-modifying trial in this disorder, which
    was stopped for futility with no difference from placebo on any outcome. The
    open question is whether the mismatch lies in the branch chosen (p38alpha
    rather than the ERK1/2 arm that the mouse rescue actually targeted), in the
    timing (the trial enrolled symptomatic patients with established disease,
    whereas the mouse evidence is about a pre-clinical window), or in the
    mechanism's relevance to the human heart at all. The node is retained as
    mechanistically supported but must not be curated as a validated human
    therapeutic target.
  proposed_experiments:
  - experiment_id: exp_lmna_human_myocardial_mapk_by_stage
    name: Human myocardial MAPK activation across disease stage
    description: >-
      Quantify ERK1/2, JNK and p38 activation in myocardium from LMNA variant
      carriers sampled across the disease course (genotype-positive with normal
      imaging, conduction-disease stage, and explanted end-stage hearts) to
      establish whether the mouse's pre-clinical activation window has a human
      counterpart that the symptomatic-patient trial design would have missed.
  evidence:
  - reference: PMID:38979608
    reference_title: "REALM-DCM: A Phase 3, Multinational, Randomized, Placebo-Controlled Trial of ARRY-371797 in Patients With Symptomatic LMNA-Related Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Findings from REALM-DCM demonstrated futility without safety concerns. An
      unmet treatment need remains among patients with LMNA-related dilated
      cardiomyopathy.
    explanation: >-
      The negative human trial result that creates this model-to-human mismatch,
      against a mouse rationale that was strong enough to reach phase 3.
- discussion_id: lmna_arrhythmia_ef_decoupling
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is arrhythmic risk in LMNA cardiomyopathy so weakly coupled to left
    ventricular ejection fraction?
  attaches_to:
  - pathophysiology#Arrhythmogenic Substrate and Malignant Ventricular Arrhythmia
  rationale: >-
    The decoupling of sudden death risk from systolic function is the single most
    clinically consequential feature of this disorder and the reason its device
    management departs from all other dilated cardiomyopathies, yet the mechanism
    is not established. Candidate explanations include the anatomical
    concentration of fibro-fatty replacement in and around the conduction system
    at the basal septum, producing a re-entrant substrate disproportionate to
    global contractile loss; and primary electrophysiological alteration of
    cardiomyocytes, for which the de-repression of the neuronal calcium channel
    gene CACNA1A in haploinsufficient patient cardiomyocytes is suggestive
    evidence. Distinguishing these matters because the first predicts that fibrosis
    imaging should refine risk prediction, while the second predicts that
    ion-channel-directed therapy might.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sudden cardiac death can occur, and in some instances is the presenting
      manifestation; sudden cardiac death may occur with minimal or no systolic
      dysfunction.
    explanation: >-
      Establishes the decoupling of arrhythmic risk from systolic function that
      this knowledge gap asks about.
  - reference: PMID:31395619
    reference_title: Chromatin compartment dynamics in a haploinsufficient model of cardiac laminopathy.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These regions exhibit up-regulation of multiple noncardiac genes including
      CACNA1A, encoding for neuronal P/Q-type calcium channels. Pharmacological
      inhibition of the resulting current partially mitigates the electrical
      alterations.
    explanation: >-
      Supports the primary-electrophysiological candidate explanation. Classified
      PARTIAL because it is an iPSC-cardiomyocyte finding for one genotype, not a
      demonstration that this drives arrhythmia in patients.

      Independent risk factors for MVA were nonsustained ventricular tachycardia,
      left ventricular ejection fraction <45% at the first clinical contact, male
      sex, and non-missense mutations (ins-del/truncating or mutations affecting
      splicing).
    explanation: >-
      Establishes the prognostic significance of the non-missense variant class,
      the genotype-level risk modifier in this disorder.
  - reference: PMID:23349452
    reference_title: "Genetic analysis in 418 index patients with idiopathic dilated cardiomyopathy: overview of 10 years' experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

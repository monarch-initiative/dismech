name: Dilated Cardiomyopathy 1A
creation_date: "2026-08-18T00:00:00Z"
synonyms:
- CMD1A
- CDCD1
- LMNA-related dilated cardiomyopathy
- LMNA familial isolated dilated cardiomyopathy
- familial dilated cardiomyopathy with conduction defect due to LMNA mutation
- cardiomyopathy, dilated, type 1A
- cardiac laminopathy
description: >-
  Dilated cardiomyopathy 1A (CMD1A) is the LMNA-related form of familial dilated
  cardiomyopathy. LMNA encodes lamin A and lamin C, the A-type intermediate
  filament proteins that polymerise into the nuclear lamina lining the inner
  nuclear membrane, where they provide mechanical support to the nucleus, tether
  peripheral heterochromatin, and couple the nucleoskeleton to the cytoskeleton.
  What distinguishes CMD1A from most other genetic dilated cardiomyopathies is
  the order in which the myocardium fails: conduction system disease and
  arrhythmia - sinus node dysfunction, progressive atrioventricular block, atrial
  fibrillation or flutter - typically precede, sometimes by many years, the
  ventricular dilation and systolic dysfunction that eventually follow. Malignant
  ventricular arrhythmia and sudden cardiac death can occur with minimal or no
  systolic dysfunction, so ICD decisions in this disease are driven by
  gene-specific risk models rather than by ejection fraction alone. Onset is
  usually in early-to-mid adulthood, penetrance is high, and progression to
  end-stage heart failure requiring transplantation is common. A skeletal
  myopathy with joint contractures and elevated creatine kinase occurs in part of
  the spectrum, reflecting the allelic overlap with Emery-Dreifuss muscular
  dystrophy and limb-girdle muscular dystrophy 1B. Inheritance is autosomal
  dominant.

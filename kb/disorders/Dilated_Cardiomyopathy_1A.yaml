      label: Reduced left ventricular ejection fraction
  evidence:
  - reference: PMID:38979608
    reference_title: "REALM-DCM: A Phase 3, Multinational, Randomized, Placebo-Controlled Trial of ARRY-371797 in Patients With Symptomatic LMNA-Related Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      REALM-DCM (NCT03439514) was a phase 3, randomized, double-blind,
      placebo-controlled trial in patients with symptomatic LMNA-related dilated
      cardiomyopathy.
    explanation: >-
      Identifies the trial registration, design, and study population.
  - reference: PMID:39145700
    reference_title: Characterization and natural history of patients with LMNA-related dilated cardiomyopathy in the phase 3 REALM-DCM trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Between 2018 and 2022, 77 patients took part in REALM-DCM. The median
      patient age was 53 years (range: 23-72), and 57% were male.
    explanation: >-
      Characterises the enrolled trial population, which doubles as the best
      contemporary phenotypic description of symptomatic CMD1A.
animal_models:
- name: Lmna H222P knock-in mouse
  species: Mouse
  genotype: Lmna p.H222P homozygous knock-in
  publication: PMID:15548545
  evidence:
  - reference: PMID:15548545
    reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We chose the LMNA H222P missense mutation identified in a family with
      autosomal dominant Emery-Dreifuss muscular dystrophy, one of the striated
      muscle-specific laminopathies, to create a faithful mouse model of this
      type of laminopathy.
    explanation: >-
      Describes the construction and intent of the model, establishing that it
      carries a human-derived LMNA missense allele.
  description: >-
    Knock-in of a human LMNA missense allele originally found in an autosomal
    dominant Emery-Dreifuss family. Homozygotes develop chamber dilation,
    hypokinesia and conduction defects with muscle degeneration, fibrosis,
    dislocated heterochromatin and Smad activation, and it is the model in which
    the MAPK and AKT-mTOR signalling arms of this disease were established.
  modeled_mechanisms:
  - target: Cardiac Conduction System Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the combined conduction-defect-plus-dilation cardiac phenotype
      that defines the human disease.
    limitations: >-
      The cardiac phenotype requires homozygosity, whereas human CMD1A is a
      heterozygous dominant disease, and H222P was ascertained in an
      Emery-Dreifuss family rather than a cardiomyopathy-predominant one.
    readouts:
    - name: Cardiac chamber dimension and conduction
      target: Cardiac Conduction System Degeneration
      direction: ALTERED
      interpretation: >-
        Chamber dilation with hypokinesia and conduction defects in the intact
        animal.
      evidence:
      - reference: PMID:15548545
        reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As for cardiac phenotype, they develop chamber dilation and hypokinesia
          with conduction defects.
        explanation: >-
          Reports the cardiac measurement behind this readout.
    evidence:
    - reference: PMID:15548545
      reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that LmnaH222P/H222P mice represent a good
        model for studying laminopathies affecting striated muscles as they
        develop a dystrophic condition of both skeletal and cardiac muscles
        similar to the human diseases.
      explanation: >-
        The authors' own assessment that the model is informative for human
        striated-muscle laminopathy.
  - target: MAPK Cascade Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model in which MAPK activation was shown to precede cardiomyopathy and
      in which AKT-mTOR hyperactivation with defective autophagy was identified
      and pharmacologically reversed.
    limitations: >-
      The therapeutic corollary did not translate: a p38 MAPK inhibitor developed
      on the strength of this signalling biology failed for futility in phase 3,
      so the model's predictive validity for human treatment response is
      unestablished.
    readouts:
    - name: Cardiac MAPK pathway activation
      target: MAPK Cascade Activation
      direction: INCREASED
      interpretation: >-
        MAPK cascade activity is raised in mutant hearts before clinical disease.
      evidence:
      - reference: PMID:17446932
        reference_title: Activation of MAPK pathways links LMNA mutations to cardiomyopathy in Emery-Dreifuss muscular dystrophy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Using real-time PCR, we showed that activation of MAPK pathways
          preceded clinical signs or detectable molecular markers of
          cardiomyopathy.
        explanation: >-
          Reports the transcriptional measurement and its timing.
    - name: Cardiac function under temsirolimus
      target: MAPK Cascade Activation
      direction: RESTORED
      interpretation: >-
        mTOR inhibition preserves cardiac function in the mutant, tying the
        signalling arm to the functional phenotype.
      evidence:
      - reference: PMID:22837537
        reference_title: Temsirolimus activates autophagy and ameliorates cardiomyopathy caused by lamin A/C gene mutation.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We show that the AKT-mammalian target of rapamycin pathway is
          hyperactivated in hearts of mice with cardiomyopathy caused by Lmna
          mutation and that in vivo administration of the rapamycin analog
          temsirolimus prevents deterioration of cardiac function.
        explanation: >-
          Reports both the pathway measurement and the rescue outcome.
    evidence:
    - reference: PMID:17446932
      reference_title: Activation of MAPK pathways links LMNA mutations to cardiomyopathy in Emery-Dreifuss muscular dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Activation of MAPK signaling by mutant A-type lamins could be a
        cornerstone in the development of heart disease in autosomal dominant
        Emery-Dreifuss muscular dystrophy.
      explanation: >-
        Supports treating this model as informative for the signalling node.
- name: Lamin A/C-null mouse
  species: Mouse
  genotype: Lmna knockout (Lmna-/-)
  publication: PMID:14755333
  evidence:
  - reference: PMID:14755333
    reference_title: Defects in nuclear structure and function promote dilated cardiomyopathy in lamin A/C-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report that lamin A/C-deficient (Lmna(-/-)) mice develop rapidly
      progressive dilated cardiomyopathy (DCM) characterized by left ventricular
      (LV) dilation and reduced systolic contraction.
    explanation: >-
      Establishes the model's genotype and its dilated cardiomyopathy phenotype.
  description: >-
    Complete loss of A-type lamins produces rapidly progressive dilated
    cardiomyopathy with grossly abnormal nuclei, fragmented heterochromatin, and
    detachment of the desmin network from the nuclear surface. It is the source
    of the defective-force-transmission model and of the observation that
    lamin-deficient cardiomyocytes cannot mount compensatory hypertrophy.
  modeled_mechanisms:
  - target: Cardiomyocyte Nuclear Envelope Fragility and Rupture
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates nuclear structural failure and loss of coupling between the
      nucleoskeleton and the cytoskeleton in cardiomyocytes.
    limitations: >-
      A homozygous null is a more extreme lesion than the heterozygous,
      often missense human genotype, and the mice develop disease far more
      rapidly than patients; the null therefore models loss of lamin function
      rather than the dominant-negative action of a mutant protein.
    readouts:
    - name: Cardiomyocyte nuclear morphology and desmin attachment
      target: Cardiomyocyte Nuclear Envelope Fragility and Rupture
      direction: ALTERED
      interpretation: >-
        Electron microscopy shows nuclear shape and size abnormalities with
        desmin filaments detached from the nuclear surface.
      evidence:
      - reference: PMID:14755333
        reference_title: Defects in nuclear structure and function promote dilated cardiomyopathy in lamin A/C-deficient mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Electron microscopy of Lmna(-/-) cardiomyocytes shows disorganization
          and detachment of desmin filaments from the nuclear surface with
          progressive disruption of the cytoskeletal desmin network.
        explanation: >-
          Reports the ultrastructural measurement behind this readout.
    evidence:
    - reference: PMID:14755333
      reference_title: Defects in nuclear structure and function promote dilated cardiomyopathy in lamin A/C-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We report that lamin A/C-deficient (Lmna(-/-)) mice develop rapidly
        progressive dilated cardiomyopathy (DCM) characterized by left
        ventricular (LV) dilation and reduced systolic contraction.
      explanation: >-
        Establishes that the model produces the disease phenotype of interest.
- name: Cardiomyocyte-restricted LMNA D300N mouse
  species: Mouse
  genotype: Tet-off bigenic cardiac-myocyte-specific LMNA p.D300N expression
  publication: PMID:30696354
  evidence:
  - reference: PMID:30696354
    reference_title: DNA Damage Response/TP53 Pathway Is Activated and Contributes to the Pathogenesis of Dilated Cardiomyopathy Associated With LMNA (Lamin A/C) Mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated a tet-off bigenic mice expressing either a WT (wild type) or a
      mutant LMNA (D300N) protein in cardiac myocytes.
    explanation: >-
      Describes the conditional, cardiomyocyte-restricted construction of the
      model.
  description: >-
    Doxycycline-suppressible expression of a mutant lamin restricted to cardiac
    myocytes, producing severe myocardial fibrosis, apoptosis, cardiac
    dysfunction and premature death, all preventable by switching expression off.
    Used to establish the DNA damage response/TP53 arm, which was then confirmed
    in human LMNA-DCM myocardium.
  modeled_mechanisms:
  - target: DNA Damage Response and TP53 Pathway Activation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The pathway identified in this model was independently confirmed by RNA
      sequencing of human LMNA-DCM hearts, and cardiomyocyte Tp53 deletion
      partially rescued the phenotype.
    limitations: >-
      D300N is a progeroid-syndrome-associated allele rather than a typical
      CMD1A variant, and the transgenic system uses supraphysiological
      cardiomyocyte-restricted expression rather than the heterozygous germline
      state.
    readouts:
    - name: Cardiac phenotype after cardiomyocyte Tp53 deletion
      target: DNA Damage Response and TP53 Pathway Activation
      direction: RESTORED
      interpretation: >-
        Removing TP53 partially reverses fibrosis, apoptosis and ventricular
        dysfunction, establishing pathway causality.
      evidence:
      - reference: PMID:30696354
        reference_title: DNA Damage Response/TP53 Pathway Is Activated and Contributes to the Pathogenesis of Dilated Cardiomyopathy Associated With LMNA (Lamin A/C) Mutations.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Deletion of Tp53 partially rescued myocardial fibrosis, apoptosis,
          proliferation of nonmyocyte cells, left ventricular dilatation and
          dysfunction, and slightly improved survival.
        explanation: >-
          Reports the genetic-rescue measurement behind this readout.
    evidence:
    - reference: PMID:30696354
      reference_title: DNA Damage Response/TP53 Pathway Is Activated and Contributes to the Pathogenesis of Dilated Cardiomyopathy Associated With LMNA (Lamin A/C) Mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        RNA sequencing of human hearts with DCM associated with defined LMNA
        pathogenic variants corroborated activation of the DNA damage
        response/TP53 pathway in the heart.
      explanation: >-
        The human-tissue confirmation that justifies the HIGH fidelity rating for
        this mechanism link.
experimental_models:
- name: Patient-derived LMNA-mutant iPSC cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cell-derived cardiomyocytes from carriers of an LMNA
    frameshift variant, compared against isogenic corrected controls. They
    display disturbed calcium handling producing single-cell arrhythmia and
    activated PDGF signalling, both reversed by PDGF pathway inhibition.
  modeled_mechanisms:
  - target: Aberrant Cardiomyocyte Calcium Handling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      A human cell system with isogenic controls that reproduces arrhythmogenesis
      cell-autonomously and identifies a druggable pathway.
    limitations: >-
      iPSC cardiomyocytes are immature relative to adult myocardium - rounder
      nuclei, a less developed cytoskeleton and no chronic mechanical loading -
      so they are a weak model for the nuclear-rupture arm of this disease even
      where they capture the signalling and calcium phenotypes. Single-cell
      arrhythmia in vitro is also not the same entity as clinical ventricular
      tachyarrhythmia.
    readouts:
    - name: Calcium handling and single-cell arrhythmia
      target: Aberrant Cardiomyocyte Calcium Handling
      direction: ALTERED
      interpretation: >-
        Electrophysiology shows aberrant calcium homeostasis generating
        arrhythmic events.
      evidence:
      - reference: PMID:31316208
        reference_title: Activation of PDGF pathway links LMNA mutation to dilated cardiomyopathy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Electrophysiological studies showed that the mutant iPSC-CMs displayed
          aberrant calcium homeostasis that led to arrhythmias at the single-cell
          level.
        explanation: >-
          Reports the electrophysiological measurement behind this readout.
    - name: Arrhythmic phenotype under PDGF pathway inhibition
      target: Aberrant Cardiomyocyte Calcium Handling
      direction: RESTORED
      interpretation: >-
        Blocking PDGF signalling abolishes the arrhythmic phenotype, making the
        pathway causal in this system.
      evidence:
      - reference: PMID:31316208
        reference_title: Activation of PDGF pathway links LMNA mutation to dilated cardiomyopathy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Conversely, pharmacological and molecular inhibition of the PDGF
          signalling pathway ameliorated the arrhythmic phenotypes of mutant
          iPSC-CMs in vitro.
        explanation: >-
          Reports the rescue measurement behind this readout.
    evidence:
    - reference: PMID:31316208
      reference_title: Activation of PDGF pathway links LMNA mutation to dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mechanistically, we show that the platelet-derived growth factor (PDGF)
        signalling pathway is activated in mutant iPSC-CMs compared to isogenic
        control iPSC-CMs.
      explanation: >-
        The isogenic comparison that makes this model informative for the
        signalling node.
discussions:
- discussion_id: lmna_dcm_dominant_mechanistic_arm
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the mechanistic arms downstream of the lamina defect - mechanical
    nuclear rupture, chromatin/LAD disorganisation, MAPK and AKT-mTOR signalling,
    DNA damage response/TP53, or PDGF signalling - carries the dominant causal
    weight in human CMD1A, and are they sequential or parallel?
  attaches_to:
  - "pathophysiology#MAPK Cascade Activation"
  - "pathophysiology#DUSP4-Mediated AKT-mTOR Activation with Impaired Autophagy"
  - "pathophysiology#Cardiomyocyte Nuclear Envelope Fragility and Rupture"
  - "pathophysiology#DNA Damage Response and TP53 Pathway Activation"
  rationale: >-
    Each arm is supported by a model-system rescue experiment, which is exactly
    what makes the question hard: temsirolimus, Tp53 deletion, autophagy/ER
    stress modulation and PDGF inhibition all partially rescue their respective
    models, so none is excluded and none is established as rate-limiting. The
    only human test of any arm - selective p38-alpha MAPK inhibition in REALM-DCM
    - failed for futility, which argues against the MAPK arm being sufficient as
    a therapeutic target in symptomatic disease but does not resolve its
    contribution to pathogenesis, nor rank the others. Curating these as parallel
    arms feeding a shared cardiomyocyte-loss node is therefore an honest
    representation of the current state rather than an evasion.
  evidence:
  - reference: PMID:38979608
    reference_title: "REALM-DCM: A Phase 3, Multinational, Randomized, Placebo-Controlled Trial of ARRY-371797 in Patients With Symptomatic LMNA-Related Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      REALM-DCM was terminated after a planned interim analysis suggested
      futility.
    explanation: >-
      The only human test of any single mechanistic arm failed, which is what
      leaves the relative causal weight of the arms open rather than settled by
      the model-system rescue experiments.
  - reference: PMID:22837537
    reference_title: Temsirolimus activates autophagy and ameliorates cardiomyopathy caused by lamin A/C gene mutation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Emerging evidence suggests that LMNA mutations cause disease by altering
      cell signaling pathways, but the specific mechanisms are poorly understood.
    explanation: >-
      States the gap directly. PARTIAL because it frames the open question rather
      than resolving it.
  proposed_experiments:
  - experiment_id: lmna_dcm_staged_arm_interruption
    name: Staged intervention in a single inducible cardiomyocyte model
    description: >-
      Use one inducible, cardiomyocyte-restricted mutant-lamin model to interrupt
      each arm separately and in combination at matched disease stages, with
      identical structural and functional endpoints, so the arms can be ranked
      within a single system rather than compared across models with different
      alleles, zygosities and expression levels.
- discussion_id: lmna_dcm_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the two workhorse model systems for this disease - homozygous mutant or
    null mice and iPSC-derived cardiomyocytes - reproduce the human heterozygous,
    adult-onset, mechanically loaded disease faithfully enough for their
    mechanistic conclusions to transfer?
  attaches_to:
  - "pathophysiology#Cardiomyocyte Nuclear Envelope Fragility and Rupture"
  rationale: >-
    Human CMD1A is a heterozygous dominant disease of adult, chronically loaded
    myocardium. The mouse models that generated most of the mechanism are
    homozygous - either null or knock-in - and develop disease over months rather
    than decades; the null in particular models absence of lamin A/C rather than
    the dominant-negative action of a mutant protein that human myocardial
    western blots suggest. iPSC cardiomyocytes are genotypically faithful and
    support isogenic comparison, but are developmentally immature and are not
    subjected to the sustained mechanical load that the mechanical-fragility
    model says is the proximate cause of nuclear failure - so the arm they are
    least able to test is the one with the strongest human ultrastructural
    support. The clinical consequence is not hypothetical: the one mechanism
    taken from these models into a phase 3 trial did not translate.
  evidence:
  - reference: PMID:38718107
    reference_title: Perinuclear damage from nuclear envelope deterioration elicits stress responses that contribute to LMNA cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      in mice, mutations in both alleles of Lmna are required for the disease
      penetrance, whereas in humans, the vast majority of LMNA cardiomyopathy is
      autosomal dominant.
    explanation: >-
      States the zygosity mismatch at the heart of this discussion directly,
      rather than leaving it to be inferred from a model's genotype.
  - reference: PMID:15548545
    reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At adulthood, male homozygous mice display reduced locomotion activity with
      abnormal stiff walking posture and all of them die by 9 months of age.
    explanation: >-
      A concrete instance of that mismatch: the knock-in phenotype is reported in
      homozygotes, whereas human CMD1A is heterozygous and adult-onset over
      decades rather than months.
  - reference: PMID:11897440
    reference_title: "Autosomal dominant dilated cardiomyopathy with atrioventricular block: a lamin A/C defect-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Western blot protein analyses of three hearts with different mutations
      showed an additional 30-kDa band, suggesting a degrading effect of mutated
      on wild-type protein.
    explanation: >-
      Human myocardial evidence for a dominant-negative action on wild-type
      protein, which a homozygous-null model by construction cannot represent.
  proposed_experiments:
  - experiment_id: lmna_dcm_heterozygous_knockin_load
    name: Heterozygous knock-in under physiological load
    description: >-
      Characterise heterozygous knock-in mice carrying a recurrent human CMD1A
      allele, with and without imposed haemodynamic load, and compare nuclear
      rupture frequency and signalling activation against homozygous animals and
      against human myocardial samples.
  - experiment_id: lmna_dcm_engineered_heart_tissue
    name: Maturation-matched engineered heart tissue
    description: >-
      Study patient and isogenic-control iPSC cardiomyocytes in
      maturation-promoting engineered heart tissue under chronic auxotonic load,
      testing whether nuclear rupture emerges once the mechanical environment is
      restored.

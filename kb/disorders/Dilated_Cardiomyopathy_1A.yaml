  - reference: PMID:29095976
    reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We clinically followed up 79 LMNA genotype-positive [age 42 ± 16 years,
      ejection fraction (EF) 45 ± 13%], including 44 (56%) with VT.
    explanation: >-
      Ventricular tachycardia in 56% of a followed genotype-positive cohort,
      concordant with the FREQUENT band.
- category: Cardiac
  name: Ventricular Fibrillation
  description: >-
    Ventricular fibrillation is the terminal rhythm in arrhythmic death in this
    disease and, with sustained ventricular tachycardia, is what a defibrillator
    is implanted to treat. It is curated separately from ventricular tachycardia
    because the risk models count resuscitated arrest and appropriate ICD therapy

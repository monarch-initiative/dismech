  phenotype_term:
    preferred_term: Ventricular fibrillation
    term:
      id: HP:0001663
      label: Ventricular fibrillation
  evidence:
  - reference: PMID:22281253
    reference_title: Risk factors for malignant ventricular arrhythmias in lamin a/c mutation carriers a European cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this multicenter cohort of 269 LMNA mutation carriers, we evaluated risk
      factors for MVA, defined as sudden cardiac death, resuscitation, and
      appropriate implantable cardioverter-defibrillator (ICD) treatment.
    explanation: >-
      Defines the malignant ventricular arrhythmia endpoint - resuscitated arrest
      and appropriate ICD therapy - which is the clinical footprint of
      ventricular fibrillation in these cohorts.
- category: Cardiac
  name: Sudden Cardiac Death
  description: >-
    Sudden arrhythmic death may be the presenting manifestation of CMD1A and can
    occur when systolic function is minimally impaired or normal. This decoupling
    from ejection fraction is the reason ICD implantation in LMNA carriers is
    considered at thresholds that would not trigger a device in non-genetic
    dilated cardiomyopathy.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death

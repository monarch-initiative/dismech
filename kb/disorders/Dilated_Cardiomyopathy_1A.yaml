diagnosis:
- name: LMNA Molecular Genetic Testing
  description: >-
    The diagnosis is established in a proband with suggestive cardiac findings by
    identification of a heterozygous pathogenic LMNA variant. Suspicion should be
    high when dilated cardiomyopathy is familial and accompanied by early
    conduction-system disease. Once a family-specific variant is known, targeted
    testing of at-risk relatives is the entry point to surveillance.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LMNA-related DCM is established in a proband with
      suggestive findings and a heterozygous pathogenic variant in LMNA identified
      by molecular genetic testing.
    explanation: >-
      GeneReviews states the diagnostic criterion directly.
- name: Cardiac Magnetic Resonance with Late Gadolinium Enhancement
  description: >-
    Late gadolinium enhancement identifies myocardial fibrosis in most carriers,
    often before significant ventricular dilation or ejection-fraction decline,
    and the extent of enhancement tracks conduction abnormality. This makes
    cardiac magnetic resonance useful for detecting disease in asymptomatic
    genotype-positive individuals rather than only characterizing established
    cardiomyopathy.
  evidence:
  - reference: PMID:21689390
    reference_title: Late gadolinium enhanced cardiovascular magnetic resonance of lamin A/C gene mutation related dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CMR is an accurate tool to determine the typical cardiac involvement in
      lamin A/C cardiomyopathy and may help to initiate early treatment in this
      malignant familiar form of DCM.
    explanation: >-
      States the diagnostic utility of cardiac magnetic resonance in this specific
      disorder.
- name: Serial Electrocardiography and Ambulatory Rhythm Monitoring
  description: >-
    Because electrical abnormalities precede structural disease, surveillance of
    genotype-positive individuals rests on electrocardiography and 24-48 hour
    rhythm monitoring together with measurement of left ventricular function.
    GeneReviews recommends at least annual cardiovascular evaluation once any
    electrocardiographic abnormality is present, and evaluation every one to two
    years in asymptomatic carriers.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with an LMNA pathogenic variant who are found to have any EKG
      abnormality should undergo a cardiovascular evaluation for disease
      progression (EKG, 24-48 hour rhythm monitoring, LV function measurement) at
      least annually.
    explanation: >-
      Specifies the surveillance modality and interval for genotype-positive
      individuals with electrocardiographic abnormality.
- name: Genotype-Based Arrhythmic Risk Stratification
  description: >-
    A validated risk prediction model (derived in 660 French registry patients and
    externally validated in 179 patients from other countries) estimates
    five-year risk of life-threatening ventricular tachyarrhythmia from male sex,
    non-missense LMNA variant, atrioventricular block, non-sustained ventricular
    tachycardia and left ventricular ejection fraction. It reclassifies a
    substantial share of patients relative to guideline-based selection and is the
    practical instrument for primary-prevention defibrillator decisions.
  evidence:
  - reference: PMID:31155932
    reference_title: Development and Validation of a New Risk Prediction Score for Life-Threatening Ventricular Tachyarrhythmias in Laminopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In comparison with the current standard of care, this risk prediction model
      for LTVTA in laminopathies significantly facilitated the choice of
      candidates for implantable cardioverter defibrillators.
    explanation: >-
      Establishes the validated risk model as an improvement over standard
      guideline-based candidate selection.
progression:
- phase: Electrical-Then-Structural Disease Course
  notes: >-
    CMD1A follows a characteristic staged course: an asymptomatic
    genotype-positive phase; a conduction-disease phase with electrocardiographic
    abnormality and preserved or near-preserved ventricular function; an arrhythmic
    phase in which malignant ventricular arrhythmia can occur despite limited
    structural disease; a structural phase with ventricular dilation and falling
    ejection fraction; and end-stage refractory heart failure. Onset is usually in
    the third to fourth decade. Penetrance in asymptomatic genotype-positive
    relatives is high and rapid, with a 9% annual incidence of newly documented
    cardiac phenotype.
  evidence:
  - reference: PMID:29095976
    reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asymptomatic LMNA genotype-positive family members (age 31 ± 15 years) had a
      9% annual incidence of a newly documented cardiac phenotype and 61% (19/31)
      of cardiac penetrance during 4.4 ± 2.9 years of follow-up.
    explanation: >-
      Quantifies the rate at which asymptomatic carriers convert to a clinical
      phenotype, the key parameter of this progression model.
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LMNA-related heart disease was associated with a high incidence of
      phenotypic progression and adverse arrhythmic and nonarrhythmic events over
      long-term follow-up. The index cardiac phenotype did not predict adverse
      events.
    explanation: >-
      Supports both the progressive character of the disease and the important
      negative finding that the presenting phenotype does not stratify outcome.
treatments:
- name: Implantable Cardioverter-Defibrillator
  description: >-
    The disease-defining treatment decision. Because arrhythmic risk is decoupled
    from systolic function, defibrillator rather than pacemaker therapy is
    recommended whenever a device indication arises in LMNA-related disease,
    including for bradyarrhythmia or heart block indications that would otherwise
    be met with a pacemaker alone. Candidate selection for primary prevention is
    guided by the validated laminopathy arrhythmic risk model rather than by the
    ejection-fraction thresholds used in other dilated cardiomyopathies.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable Cardioverter-Defibrillator Placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Arrhythmogenic Substrate and Malignant Ventricular Arrhythmia
    treatment_effect: INHIBITS
    description: >-
      The device does not modify the arrhythmogenic substrate; it terminates the
      resulting ventricular tachyarrhythmia and so prevents sudden cardiac death.
    evidence:
    - reference: PMID:20301717
      reference_title: LMNA-Related Dilated Cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Because risk for sudden cardiac death in LMNA-related DCM accompanies
        heart block and bradyarrhythmias, ICD use (rather than just pacemaker use)
        has been recommended for all indications.
      explanation: >-
        States the gene-specific recommendation to choose a defibrillator over a
        pacemaker, and the arrhythmic rationale for it.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic ventricular arrhythmias, ventricular tachycardia, ventricular
      fibrillation, and resuscitated sudden cardiac death are treated with an
      implantable cardioverter defibrillator (ICD) and drug therapy as needed.
    explanation: >-
      Establishes defibrillator therapy for the arrhythmic manifestations of this
      disorder.
  - reference: PMID:29175975
    reference_title: Lamin and the heart.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recognising lamin A/C heart disease is important because implantable
      cardioverter defibrillators need to be implanted early.
    explanation: >-
      Supports early rather than ejection-fraction-triggered device implantation.
      Evidence source is OTHER because this is a narrative review.
- name: Cardiac Pacing for Bradyarrhythmia
  description: >-
    Symptomatic bradyarrhythmia or significant heart block requires pacing. In
    LMNA-related disease the recommendation is to meet that indication with a
    defibrillator-capable device rather than a pacemaker alone, because the same
    patients carry a high concurrent risk of sudden death.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Pacemaker Placement
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_mechanisms:
  - target: Progressive Conduction System Disease
    treatment_effect: MODULATES
    description: >-
      Pacing substitutes for failed atrioventricular conduction; it does not alter
      the underlying fibrotic and lamin-driven disease process.
    evidence:
    - reference: PMID:20301717
      reference_title: LMNA-Related Dilated Cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        symptomatic bradyarrhythmias or significant heart block is treated with an
        electronic pacemaker
      explanation: >-
        States the pacing indication for the conduction-system phenotype.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because risk for sudden cardiac death in LMNA-related DCM accompanies heart
      block and bradyarrhythmias, ICD use (rather than just pacemaker use) has
      been recommended for all indications.
    explanation: >-
      Documents the important qualification that a pacing indication in this
      disorder should be met with a defibrillator-capable device.
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Symptomatic dilated cardiomyopathy is treated with conventional heart failure
    pharmacotherapy including ACE inhibitors and beta blockers. This is
    disease-modifying for the heart failure syndrome but does not address the
    lamin-specific arrhythmic risk, which is why it never substitutes for device
    decisions in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Ventricular Remodeling and Left Ventricular Systolic Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Neurohormonal blockade attenuates maladaptive ventricular remodeling, the
      shared final pathway of dilated cardiomyopathy.
    evidence:
    - reference: PMID:20301717
      reference_title: LMNA-Related Dilated Cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment of symptomatic DCM, including heart failure, is pharmacologic
        with ACE inhibitors, beta blockers, and other conventional approaches.
      explanation: >-
        States the pharmacologic regimen recommended for the heart failure
        manifestations of this disorder.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of symptomatic DCM, including heart failure, is pharmacologic with
      ACE inhibitors, beta blockers, and other conventional approaches.
    explanation: >-
      GeneReviews specifies the conventional heart failure pharmacotherapy.
- name: Atrial Fibrillation Management and Anticoagulation
  description: >-
    Chronic atrial fibrillation is managed with rhythm restoration, rate control
    and anticoagulation. Anticoagulation matters independently in this disorder
    because left ventricular mural thrombus with systemic embolism is a recognized
    presenting event.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant agent
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic atrial fibrillation is treated initially with attempts to restore
      normal sinus rhythm, anticoagulation, and rate control.
    explanation: >-
      States the management approach for the atrial arrhythmia component.
- name: Heart Transplantation
  description: >-
    Cardiac transplantation is the definitive therapy for refractory end-stage
    heart failure and is needed more often and at a younger age in CMD1A than in
    other dilated cardiomyopathies, with roughly a fifth of one national cohort
    transplanted over about eight years of follow-up.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Progressive Heart Failure and End-Stage Disease
    treatment_effect: MODULATES
    description: >-
      Transplantation replaces the failing organ; it is the endpoint of the
      disease course rather than a modifier of the underlying laminopathy, which
      remains present in all other tissues.
    evidence:
    - reference: PMID:29095976
      reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Heart transplantation was performed in 15 of 79 (19%) LMNA patients during
        7.8 ± 6.3 years of follow-up.
      explanation: >-
        Quantifies the frequency with which this endpoint is reached.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac transplantation or other advanced therapies may be considered for
      refractory disease in persons receiving comprehensive care from
      cardiovascular disease experts.
    explanation: >-
      States the indication for transplantation in refractory disease.
- name: ARRY-371797 (p38alpha MAPK Inhibitor)
  description: >-
    A selective oral p38alpha MAPK inhibitor developed directly from the
    model-organism finding that MAPK stress-kinase activation drives lamin
    cardiomyopathy. A phase 2 study in 12 patients reported improved six-minute
    walk distance and falling NT-proBNP, but the phase 3 REALM-DCM trial was
    stopped at a planned interim analysis for futility, with no significant
    difference from placebo on any outcome and no new safety findings. This entry
    is curated as a failed disease-modifying therapy rather than a recommended
    treatment: it is retained because the negative result is the key evidence that
    an unmet need remains, and because it is the clearest test to date of the MAPK
    arm of the mechanism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: MAPK Stress-Kinase Cascade Activation
    treatment_effect: INHIBITS
    description: >-
      Selective p38alpha inhibition targets the MAPK stress-kinase node. The
      mechanistic rationale is sound and target engagement was achieved, but the
      phase 3 trial did not translate this into clinical benefit.
    evidence:
    - reference: PMID:38979608
      reference_title: "REALM-DCM: A Phase 3, Multinational, Randomized, Placebo-Controlled Trial of ARRY-371797 in Patients With Symptomatic LMNA-Related Dilated Cardiomyopathy."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Findings from REALM-DCM demonstrated futility without safety concerns. An
        unmet treatment need remains among patients with LMNA-related dilated
        cardiomyopathy.
      explanation: >-
        Refutes clinical benefit from inhibiting this node in humans, despite the
        strong preclinical rationale. Recorded as REFUTE so the negative result is
        not lost.
  evidence:
  - reference: PMID:36515663
    reference_title: "Efficacy and Safety of ARRY-371797 in LMNA-Related Dilated Cardiomyopathy: A Phase 2 Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ARRY-371797 was well tolerated and resulted in potential increases in
      functional capacity and lower concentrations of cardiac biomarker NT-proBNP
      in patients with LMNA-related dilated cardiomyopathy.
    explanation: >-
      The phase 2 signal that motivated the phase 3 trial. Classified PARTIAL
      because it was a small single-arm study whose promise was not confirmed.
  - reference: PMID:38979608
    reference_title: "REALM-DCM: A Phase 3, Multinational, Randomized, Placebo-Controlled Trial of ARRY-371797 in Patients With Symptomatic LMNA-Related Dilated Cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      REALM-DCM was terminated after a planned interim analysis suggested futility.
    explanation: >-
      Records the definitive negative outcome of the phase 3 trial.
- name: Genetic Counseling and Cascade Family Screening
  description: >-
    Because penetrance is high, onset is in early adulthood and sudden death can
    be the presenting event, identifying at-risk relatives before they are
    symptomatic is a core part of management. Once a family-specific variant is
    known, targeted testing directs relatives either into surveillance or out of
    it; relatives who cannot be tested receive yearly cardiovascular evaluation
    regardless. Pregnancy is contraindicated in women with established dilated
    cardiomyopathy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In families with a known LMNA pathogenic variant, at-risk individuals for
      whom genetic testing is not possible should have yearly cardiovascular
      evaluation.
    explanation: >-
      Specifies the cascade-screening and surveillance obligation for at-risk
      relatives.
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy is contraindicated in women with DCM.
    explanation: >-
      Records the reproductive-safety warning from the GeneReviews management
      section.
animal_models:
- name: Lmna H222P knock-in mouse
  species: Mouse
  genotype: Lmna H222P/H222P homozygous knock-in
  publication: PMID:15548545
  description: >-
    The workhorse model of striated-muscle laminopathy, carrying a missense allele
    originally identified in an autosomal dominant Emery-Dreifuss family. Mice
    develop chamber dilation, hypokinesia and conduction defects together with
    skeletal muscle degeneration and fibrosis. Nearly all the mechanistic work
    implicating MAPK signalling, and the preclinical rationale for the p38 and ERK
    inhibitor programmes, rests on this model.
  evidence:
  - reference: PMID:15548545
    reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We chose the LMNA H222P missense mutation identified in a family with
      autosomal dominant Emery-Dreifuss muscular dystrophy, one of the striated
      muscle-specific laminopathies, to create a faithful mouse model of this type
      of laminopathy.
    explanation: >-
      Documents the provenance and design intent of the model.
  modeled_mechanisms:
  - target: Ventricular Remodeling and Left Ventricular Systolic Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the combined dilation, hypokinesia and conduction-defect
      phenotype of human striated-muscle laminopathy.
    limitations: >-
      The cardiac phenotype requires homozygosity for H222P, whereas human CMD1A
      is a heterozygous dominant disorder, and this allele derives from an
      Emery-Dreifuss family with prominent skeletal myopathy rather than from the
      cardiac-predominant rod-domain families that define CMD1A. Males are
      affected earlier and more severely than females, a sex effect not
      quantitatively matched to the human disorder.
    readouts:
    - name: Left ventricular chamber dimension and wall motion
      target: Ventricular Remodeling and Left Ventricular Systolic Dysfunction
      direction: ALTERED
      interpretation: >-
        Echocardiographic chamber dilation with hypokinesia, the structural
        correlate of the human remodeling node.
      evidence:
      - reference: PMID:15548545
        reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          As for cardiac phenotype, they develop chamber dilation and hypokinesia
          with conduction defects.
        explanation: >-
          Reports the cardiac structural and conduction measurements underlying
          this readout.
    evidence:
    - reference: PMID:15548545
      reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that LmnaH222P/H222P mice represent a good model
        for studying laminopathies affecting striated muscles as they develop a
        dystrophic condition of both skeletal and cardiac muscles similar to the
        human diseases.
      explanation: >-
        The authors' own statement that this model is informative for human
        striated-muscle laminopathy.
  - target: MAPK Stress-Kinase Cascade Activation
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      The model is where MAPK activation was shown to precede any clinical or
      molecular sign of cardiomyopathy, and where ERK inhibition was shown to
      delay ventricular dilatation.
    limitations: >-
      Pharmacological rescue in this model did not predict clinical benefit: the
      p38alpha inhibitor developed on this rationale failed for futility in phase
      3, so the model's predictive validity for therapy is demonstrably limited.
    readouts:
    - name: Cardiac MAPK pathway activation
      target: MAPK Stress-Kinase Cascade Activation
      direction: INCREASED
      interpretation: >-
        Transcriptional and phosphorylation evidence of ERK1/2, JNK and p38
        activation before overt cardiomyopathy.
      evidence:
      - reference: PMID:17446932
        reference_title: Activation of MAPK pathways links LMNA mutations to cardiomyopathy in Emery-Dreifuss muscular dystrophy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Using real-time PCR, we showed that activation of MAPK pathways preceded
          clinical signs or detectable molecular markers of cardiomyopathy.
        explanation: >-
          Reports the measurement and its timing relative to disease onset.
    evidence:
    - reference: PMID:18927124
      reference_title: Inhibition of extracellular signal-regulated kinase signaling to prevent cardiomyopathy caused by mutation in the gene encoding A-type lamins.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results emphasize the role of ERK activation in the development of
        cardiomyopathy caused by LMNA mutations.
      explanation: >-
        Establishes that the model supports causal interrogation of this node, not
        merely correlation.
- name: Lmna-null mouse
  species: Mouse
  genotype: Lmna -/- (A-type lamin null)
  publication: PMID:10579712
  description: >-
    The original loss-of-function model. Mice develop to term but show severely
    retarded postnatal growth with muscular dystrophy, ultrastructural nuclear
    envelope perturbation and emerin mislocalization in skeletal and cardiac
    muscle. It established the nuclear-envelope-integrity basis of striated muscle
    laminopathy.
  evidence:
  - reference: PMID:10579712
    reference_title: Loss of A-type lamin expression compromises nuclear envelope integrity leading to muscular dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that mice lacking A-type lamins develop to term with no overt
      abnormalities. However, their postnatal growth is severely retarded and is
      characterized by the appearance of muscular dystrophy.
    explanation: >-
      Describes the model's genotype and gross phenotype.
  modeled_mechanisms:
  - target: Cardiomyocyte Nuclear Envelope Fragility and Rupture
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates in vivo that loss of A-type lamins compromises nuclear envelope
      integrity specifically in cardiac and skeletal muscle.
    limitations: >-
      A complete null is not the human genotype: CMD1A is caused by heterozygous,
      mostly missense alleles acting through dominant-negative interference as
      well as haploinsufficiency, and the null mouse phenotype is dominated by
      growth failure and dystrophy rather than the conduction-disease-first
      cardiac course that defines the human disorder.
    readouts:
    - name: Nuclear envelope ultrastructure and emerin localization
      target: Cardiomyocyte Nuclear Envelope Fragility and Rupture
      direction: ALTERED
      interpretation: >-
        Ultrastructural envelope perturbation with mislocalized emerin, the
        structural correlate of the fragility node.
      evidence:
      - reference: PMID:10579712
        reference_title: Loss of A-type lamin expression compromises nuclear envelope integrity leading to muscular dystrophy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mice lacking the A-type lamins exhibit tissue-specific alterations to
          their nuclear envelope integrity and emerin distribution.
        explanation: >-
          Reports the ultrastructural measurement behind this readout.
    evidence:
    - reference: PMID:10579712
      reference_title: Loss of A-type lamin expression compromises nuclear envelope integrity leading to muscular dystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In skeletal and cardiac muscles, this is manifest as a dystrophic condition
        related to EDMD.
      explanation: >-
        Supports treating this model as informative for the cardiac and skeletal
        muscle consequences of A-type lamin loss.
- name: Cardiomyocyte-specific Lmna knockout mouse (Myh6-Cre:LmnaF/F)
  species: Mouse
  genotype: Myh6-Cre; Lmna flox/flox (cardiomyocyte-restricted Lmna deletion)
  publication: PMID:36644279
  description: >-
    A cardiomyocyte-restricted deletion producing premature death, dilated
    cardiomyopathy, myocardial fibrosis and apoptosis. It was used to establish
    the cGAS/DNA-damage-response arm causally, by crossing to a cGAS knockout.
  evidence:
  - reference: PMID:36644279
    reference_title: Genetic Ablation of the DNA Damage Response Pathway Attenuates Lamin-Associated Dilated Cardiomyopathy in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of the mouse Lmna gene in cardiac myocytes leads to premature death,
      DCM, myocardial fibrosis, and apoptosis.
    explanation: >-
      Describes the model's genotype and the cardiac phenotype it produces.
  modeled_mechanisms:
  - target: DNA Damage Response and cGAS-Driven Innate Immune Activation
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Genetic ablation of cGAS in this model prolonged survival, improved cardiac
      function and attenuated apoptosis and fibrosis, establishing the DNA damage
      response as causal rather than merely associated.
    limitations: >-
      Cardiomyocyte-restricted complete deletion is more severe than the human
      heterozygous state and removes the contribution of non-cardiomyocyte cell
      types; the rescue has not been tested in humans, and no cGAS/STING-directed
      therapy has entered clinical trials for this disorder.
    readouts:
    - name: Survival and cardiac function after cGAS ablation
      target: DNA Damage Response and cGAS-Driven Innate Immune Activation
      direction: RESTORED
      interpretation: >-
        Improvement in survival, cardiac function, heart failure markers, apoptosis
        and fibrosis on removing the cytosolic DNA sensor.
      evidence:
      - reference: PMID:36644279
        reference_title: Genetic Ablation of the DNA Damage Response Pathway Attenuates Lamin-Associated Dilated Cardiomyopathy in Mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Genetic blockade of the DDR pathway, upon knockout of the Mb21d1 gene
          encoding CGAS, prolonged survival, improved cardiac function, partially
          restored levels of molecular markers of heart failure, and attenuated
          myocardial apoptosis and fibrosis in the LMNA-deficient mice.
        explanation: >-
          Reports the rescue measurements underlying this readout.
    evidence:
    - reference: PMID:36644279
      reference_title: Genetic Ablation of the DNA Damage Response Pathway Attenuates Lamin-Associated Dilated Cardiomyopathy in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The findings indicate that targeting the CGAS/DDR pathway might be
        beneficial in the treatment of DCM caused by mutations in the LMNA gene.
      explanation: >-
        The authors' statement that this model is informative for the DNA damage
        response arm of human LMNA cardiomyopathy.
experimental_models:
- name: Lamin A/C haploinsufficient patient iPSC-derived cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human induced pluripotent stem cell-derived cardiomyocytes carrying a
    haploinsufficient lamin A/C mutation, compared against isogenic gene-corrected
    controls. Used for genome-wide chromosome conformation analysis, this system
    produced the important negative result that global chromatin compartmentation
    error is not the primary pathogenic mechanism.
  modeled_mechanisms:
  - target: Lamina-Chromatin Untethering and Transcriptional Dysregulation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      The strong form of the gene-regulatory hypothesis was tested and not
      supported: mutant cardiomyocytes showed marked electrophysiological and
      contractile alterations but only modest gene expression changes, with
      compartment differences confined to a few hotspots that did not account for
      most expression changes.
    limitations: >-
      iPSC-derived cardiomyocytes are immature relative to adult myocardium and
      lack the sustained mechanical loading that the mechanical-fragility model
      says is central, so a negative result here does not exclude a
      lamina-chromatin contribution in the loaded adult heart. The model is a
      single haploinsufficient genotype and does not represent dominant-negative
      missense alleles.
    readouts:
    - name: Genome-wide chromatin compartment segregation
      target: Lamina-Chromatin Untethering and Transcriptional Dysregulation
      direction: UNCHANGED
      interpretation: >-
        Compartmentation was largely preserved apart from a few escaping hotspots,
        arguing against global compartment failure as the driver.
      evidence:
      - reference: PMID:31395619
        reference_title: Chromatin compartment dynamics in a haploinsufficient model of cardiac laminopathy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          However, chromatin compartment changes do not explain most gene
          expression alterations in mutant hiPSC-CMs.
        explanation: >-
          Reports the measurement establishing that compartment change does not
          account for the transcriptional phenotype.
    evidence:
    - reference: PMID:31395619
      reference_title: Chromatin compartment dynamics in a haploinsufficient model of cardiac laminopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Thus, global errors in chromosomal compartmentation are not the primary
        pathogenic mechanism in heart failure due to lamin A/C haploinsufficiency.
      explanation: >-
        The authors' explicit negative conclusion, which is why this link is
        recorded as FAILS_TO_RECAPITULATE.

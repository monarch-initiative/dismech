    reference_title: Genetic Ablation of the DNA Damage Response Pathway Attenuates Lamin-Associated Dilated Cardiomyopathy in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The phenotype is associated with increased expression of the cytosolic DNA
      sensor cyclic GMP-AMP synthase (CGAS) and activation of the DNA damage
      response (DDR) pathway.
    explanation: >-
      Documents cGAS upregulation and DNA damage response activation in the
      LMNA-deficient heart.
  - reference: PMID:36644279
    reference_title: Genetic Ablation of the DNA Damage Response Pathway Attenuates Lamin-Associated Dilated Cardiomyopathy in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic blockade of the DDR pathway, upon knockout of the Mb21d1 gene
      encoding CGAS, prolonged survival, improved cardiac function, partially
      restored levels of molecular markers of heart failure, and attenuated
      myocardial apoptosis and fibrosis in the LMNA-deficient mice.
    explanation: >-
      Establishes the cGAS/DDR pathway as causal rather than merely correlated,
      by rescue on genetic ablation.

- name: Chromatin and Lamina-Associated Domain Disorganization
  biological_scale: MOLECULAR
  role: effector
  description: >-
    The lamina tethers peripheral heterochromatin, so a defective meshwork
    releases and redistributes it. Lamin A/C-null cardiomyocyte nuclei show
    central displacement and fragmentation of heterochromatin, and heterochromatin
    is dislocated in the hearts of H222P knock-in mice alongside activated Smad
    signalling. Loss of the correct chromatin-lamina arrangement is the presumed
    route by which a structural protein defect becomes a transcriptional one,
    including a failure to mount the compensatory hypertrophic gene programme that
    normally accompanies ventricular stress.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:14755333
    reference_title: Defects in nuclear structure and function promote dilated cardiomyopathy in lamin A/C-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lmna(-/-) LV myocyte nuclei have marked alterations of shape and size with
      central displacement and fragmentation of heterochromatin; these changes
      are present but less severe in left atrial nuclei.
    explanation: >-
      Directly documents loss of peripheral heterochromatin organisation in
      lamin-deficient cardiomyocytes, and its chamber-dependent gradient.
  - reference: PMID:14755333
    reference_title: Defects in nuclear structure and function promote dilated cardiomyopathy in lamin A/C-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Alterations in nuclear architecture are associated with defective nuclear
      function evidenced by decreased SREBP1 import, reduced PPARgamma
      expression, and a lack of hypertrophic gene activation.
    explanation: >-
      Links the architectural defect to a measurable transcriptional consequence,
      including failure of the compensatory hypertrophic programme.
  - reference: PMID:15548545
    reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histopathological analysis of the mice revealed muscle degeneration with
      fibrosis associated with dislocation of heterochromatin and activation of
      Smad signalling in heart and skeletal muscles.
    explanation: >-
      Reproduces heterochromatin dislocation in a knock-in missense model rather
      than a null, showing it is not merely an artefact of complete lamin loss.

genetic:
- name: LMNA
  notes: >-
    LMNA at 1q22 encodes lamins A and C by alternative splicing of a single
    transcript. Pathogenic variants causing CMD1A are heterozygous and distributed
    across the coding sequence without hotspot clustering. Missense variants
    predominate, with rod-domain missense changes classically producing the
    cardiac-predominant phenotype; nonsense, frameshift, splice-site and whole-gene
    deletion alleles also occur. The missense versus non-missense distinction is
    prognostically important rather than merely descriptive, since non-missense
    alleles independently predict malignant ventricular arrhythmia. LMNA is the
    leading or second-leading monogenic cause of dilated cardiomyopathy and
    ClinGen classifies the gene-disease relationship as Definitive.
  gene_term:
    preferred_term: LMNA
    term:
      id: hgnc:6636
      label: LMNA
  relationship_type: CAUSATIVE
  case_fractions:
  - population: Familial dilated cardiomyopathy probands, Norway
    case_fraction_percent: 6.2
    cohort_size: 561
    notes: >-
      Share of familial DCM probands carrying an LMNA variant in a national
      cohort with complete genetic-testing ascertainment.
    evidence:
    - reference: PMID:29095976
      reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of 561 unrelated familial DCM probands, 35 (6.2%) had an LMNA mutation.
      explanation: >-
        Directly quantifies the LMNA share of familial DCM probands.
  - population: Dilated cardiomyopathy (all-cause), review estimate
    case_fraction_percent: 10.0
    notes: >-

inheritance:
- name: Autosomal Dominant
  description: >-
    CMD1A is transmitted as an autosomal dominant trait; affected individuals are
    heterozygous for a pathogenic LMNA variant and each child of an affected
    person has a 50% chance of inheriting it. Penetrance is age-dependent and
    high, approaching 90% among genotype-positive individuals, but expressivity
    (which manifestation appears first, and when) is markedly variable even
    within a family.
  inheritance_term:

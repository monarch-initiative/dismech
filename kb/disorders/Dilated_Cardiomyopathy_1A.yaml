- name: Cardiomyocyte Nuclear Envelope Fragility and Rupture
  biological_scale: CELLULAR
  role: intermediate
  description: >-
    A lamina built from defective A-type lamins is mechanically weak. In the
    cardiomyocyte this matters more than in most cell types because the LINC
    complex couples the nuclear envelope directly to a cytoskeleton that
    contracts continuously, so actomyosin, microtubule and desmin-generated
    forces are transmitted onto a nucleus that cannot withstand them. The result
    is nuclear deformation and repeated transient envelope rupture, with
    mislocalization of inner-nuclear-membrane partners such as emerin. Loss of
    A-type lamins in mice produces exactly this ultrastructural signature in
    cardiac and skeletal muscle.

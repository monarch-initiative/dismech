mechanistic_hypotheses:
- hypothesis_group_id: lmna_mechanical_fragility_model
  hypothesis_label: Nuclear envelope mechanical fragility and rupture model
  status: CANONICAL
  description: >-
    The canonical model holds that defective A-type lamin polymerization leaves
    the cardiomyocyte nuclear lamina mechanically weak. Because the LINC complex
    transmits actomyosin, microtubule and desmin-generated force from a
    continuously contracting cytoskeleton directly onto the nuclear envelope, the
    weakened envelope undergoes repeated transient rupture. Rupture exposes
    genomic DNA to the cytosol, provoking DNA damage responses, cGAS/STING innate
    immune activation and MAPK stress-kinase signalling, which together drive
    cardiomyocyte death, fibrosis and remodeling. The strongest support is that
    MAPK activation precedes any detectable clinical or molecular sign of
    cardiomyopathy in the Lmna H222P mouse, and that blocking either the ERK arm
    or the cGAS-dependent DNA damage response improves cardiac function in mice.
- hypothesis_group_id: lmna_gene_regulatory_lad_model
  hypothesis_label: Lamina-chromatin (LAD) gene-regulatory model
  status: ALTERNATIVE
  description: >-
    The alternative model holds that A-type lamins act primarily as organizers of
    lamina-associated domains (LADs) of peripheral heterochromatin, and that LMNA
    variants cause disease by untethering chromatin and dysregulating the
    cardiomyocyte transcriptional program independently of acute mechanical
    rupture. This arm is deliberately recorded as ALTERNATIVE rather than
    co-canonical: genome-wide chromosome conformation analysis of
    haploinsufficient patient iPSC-cardiomyocytes found only a few escaping
    hotspots rather than global compartment failure, and the authors concluded
    that global compartmentation error is not the primary pathogenic mechanism.
    Localized escape (for example de-repression of the neuronal calcium channel
    gene CACNA1A) may still contribute to the electrophysiological phenotype.
pathophysiology:
- name: LMNA Variant and Defective A-Type Lamin Assembly
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous pathogenic LMNA variant impairs assembly of lamins A and C
    into the nuclear lamina meshwork lining the inner nuclear membrane. Variants
    are distributed across the whole coding sequence rather than clustering in
    hotspots, and include missense changes (predominant), nonsense, frameshift,
    canonical splice-site and whole-gene deletion alleles. Missense variants in
    the alpha-helical rod domain are the classic cause of the cardiac-predominant
    CMD1A phenotype, and both dominant-negative interference with lamin
    polymerization and simple haploinsufficiency are operative depending on the
    allele. The clinical relevance of the distinction is that non-missense
    (truncating/splice) alleles carry a materially higher arrhythmic risk.

references:
- reference: PMID:20301717
  title: LMNA-Related Dilated Cardiomyopathy
  tags:
  - GeneReviews
notes: >-
  Curated from a claude_code deep-research report (NEC preflight PASS against
  MONDO:0007269; LMNA mentioned 63 times, report OMIM 115200 matching the MONDO
  xref), the GeneReviews chapter PMID:20301717 as the mandatory phenotype
  baseline, and primary literature retrieved from PubMed. Two intended
  deep-research providers were unavailable during this session: falcon returned
  HTTP 402 (Edison account out of credits) and openscientist returned HTTP 401
  (the container environment held a stale key). The report cited "PMID:17672370"
  for Muchir et al. J Clin Invest 2007; that identifier actually resolves to an
  unrelated mammography paper and was flagged off topic by the report's own
  reference validation. The correct identifier, PMID:17446932, was located
  independently and is what this entry cites. The report also proposed HP:0011712
  for first-degree atrioventricular block; that term is Complete right bundle
  branch block, and the correct term HP:0011705 is used here.
  Skeletal-muscle involvement is curated deliberately narrowly. CMD1A is the
  cardiac-predominant node of the LMNA allelic series, and the founding families
  had no skeletal myopathy or contractures; the Emery-Dreifuss and limb-girdle
  presentations are separate entities and are not duplicated here.
  The ARRY-371797 treatment entry is retained despite the drug having failed,
  because the phase 3 futility result is the strongest evidence bearing on the
  MAPK arm of the mechanism and would be lost if only successful therapies were
  curated. It should not be read as a recommended treatment.

    explanation: >-
      Supports localized lamina-chromatin untethering in patient-derived
      cardiomyocytes. Classified PARTIAL because the same study limits the scope
      of the claim rather than fully endorsing a gene-regulatory primary
      mechanism.
  - reference: PMID:31395619
    reference_title: Chromatin compartment dynamics in a haploinsufficient model of cardiac laminopathy.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Thus, global errors in chromosomal compartmentation are not the primary
      pathogenic mechanism in heart failure due to lamin A/C haploinsufficiency.
    explanation: >-
      Explicitly refutes the strong form of the gene-regulatory hypothesis, which
      is why that hypothesis group is curated as ALTERNATIVE rather than
      co-canonical.

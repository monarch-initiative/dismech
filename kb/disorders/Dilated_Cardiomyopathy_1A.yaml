prevalence:
- population: Norwegian familial dilated cardiomyopathy probands
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the LMNA-specific form of
    dilated cardiomyopathy. The available figures are the share of dilated
    cardiomyopathy cohorts carrying an LMNA variant, which is a diagnostic yield
    rather than a population rate: 6.2% of unrelated familial DCM probands in
    Norway, and 8% of nuclear families in the US Familial Cardiomyopathy
    Registry. The yield rises sharply when atrioventricular block accompanies the
    cardiomyopathy.
  evidence:
  - reference: PMID:29095976
    reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 561 unrelated familial DCM probands, 35 (6.2%) had an LMNA mutation.
    explanation: >-
      Quantifies the LMNA share of familial dilated cardiomyopathy in a national
      referral cohort. PARTIAL because a diagnostic yield within a DCM cohort is
      not a population prevalence for CMD1A.
- population: Familial and sporadic dilated cardiomyopathy with atrioventricular block
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Enrichment figure rather than a population rate: among dilated
    cardiomyopathies presenting with atrioventricular block, a third carried an
    LMNA defect, and all such cases were familial and autosomal dominant.
  evidence:
  - reference: PMID:11897440
    reference_title: "Autosomal dominant dilated cardiomyopathy with atrioventricular block: a lamin A/C defect-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LMNA gene mutations account for 33% of the DCMs with AVB, all familial
      autosomal dominant.
    explanation: >-
      Establishes the diagnostic enrichment of LMNA variants in the
      conduction-disease subset of dilated cardiomyopathy.
inheritance:
- name: Autosomal Dominant
  description: >-
    CMD1A is transmitted as an autosomal dominant trait. Affected individuals are
    heterozygous for a pathogenic LMNA variant and each child has a 50% chance of
    inheriting it. Penetrance is age-dependent - young carriers may be entirely
    normal - but becomes high by mid-adulthood, and expressivity is variable both
    between and within families.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LMNA-related DCM is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews statement of the mode of inheritance.
  - reference: PMID:29095976
    reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asymptomatic LMNA genotype-positive family members (age 31 ± 15 years) had
      a 9% annual incidence of a newly documented cardiac phenotype and 61%
      (19/31) of cardiac penetrance during 4.4 ± 2.9 years of follow-up.
    explanation: >-
      Quantifies the age-dependent, incomplete-at-young-age but rapidly
      accumulating penetrance that governs family screening intervals.
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with LMNA-related DCM has a 50% chance of
      inheriting the pathogenic variant.
    explanation: >-
      Evidences the 50% per-child transmission risk stated in this block's
      description, which the mode-of-inheritance statement alone does not cover.
mechanistic_hypotheses:
- hypothesis_group_id: mechanical_nuclear_fragility_model
  hypothesis_label: Mechanical nuclear fragility model
  status: CANONICAL
  description: >-
    In this model the primary defect is structural. A mutant lamina is
    mechanically weak, so cardiomyocyte nuclei - uniquely subject to the
    repetitive strain of contraction - deform abnormally, bleb, and rupture, and
    the nucleoskeleton-to-cytoskeleton coupling that transmits force across the
    nuclear surface is lost. Cardiomyocyte dysfunction and death follow from that
    mechanical failure. The structural evidence is direct: focal disruptions,
    blebs, and nuclear pore clustering in patient myocardium, and detachment of
    the desmin network from the nuclear surface in lamin A/C-null mice.
- hypothesis_group_id: signalling_and_gene_expression_model
  hypothesis_label: Signalling and gene-expression dysregulation model
  status: ALTERNATIVE
  description: >-
    In this model the lamina's role as a signalling and chromatin platform is
    what matters. Mutant lamin A/C perturbs lamina-associated heterochromatin and
    activates intracellular cascades - ERK1/2 and p38 MAPK, AKT-mTOR with
    impaired autophagy, the DNA damage response and TP53, and PDGF receptor
    signalling - and it is this altered signalling and transcriptional output,
    not mechanical failure per se, that drives cardiomyocyte loss and fibrosis.
    The strongest support is temporal: MAPK activation is detectable in mutant
    mouse hearts before any clinical or molecular sign of cardiomyopathy, and
    pharmacological or genetic interruption of these cascades partially rescues
    the phenotype.
  notes: >-
    The two models are not mutually exclusive and are curated as parallel arms
    rather than competitors: nuclear rupture is itself a plausible upstream
    activator of the DNA damage response, and both arms converge on the same
    cardiomyocyte-loss and fibrosis nodes. They are separated here because the
    therapeutic implications differ, and because the failure of a p38 MAPK
    inhibitor in phase 3 (REALM-DCM) leaves the causal weight of the signalling
    arm in human disease unresolved.
pathophysiology:
- name: LMNA Variant and Nuclear Lamina Assembly Defect
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  role: trigger
  genetic_context:
    gene:
      preferred_term: LMNA
      term:
        id: hgnc:6636
        label: LMNA
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Applies to the missense alleles, which are modelled as co-assembling into
      and destabilising the lamina. Non-missense alleles are equally represented
      in CMD1A and behave differently in the clinic, with earlier conduction
      disease and higher arrhythmic risk; for those, haploinsufficiency through
      nonsense-mediated decay is the competing mechanism, and this entry does not
      claim a single functional mechanism across the whole allelic spectrum.
  description: >-
    A heterozygous pathogenic LMNA variant is the initiating lesion. LMNA encodes
    lamin A and lamin C by alternative splicing; both assemble into the nuclear
    lamina, a filamentous meshwork on the nucleoplasmic face of the inner nuclear
    membrane. Disease-associated variants are distributed across the gene with no
    single hotspot and include missense changes concentrated in the central
    alpha-helical rod domain as well as nonsense, frameshift and splice-affecting
    alleles. Missense alleles are thought to act largely by incorporating into
    and destabilising the meshwork (a dominant-negative effect), consistent with
    the reduced or absent nuclear lamin A/C immunostaining and the aberrant
    degradation product seen in patient myocardium; non-missense alleles behave
    differently in the clinic, conferring earlier conduction disease and higher
    arrhythmic risk.

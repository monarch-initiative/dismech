- name: DUSP4-Mediated AKT-mTOR Activation with Impaired Autophagy
  biological_scale: CELLULAR
  role: effector
  description: >-
    Downstream of the MAPK cascade, the AKT-mTOR axis is hyperactivated and
    macroautophagy is defective. DUSP4, induced by ERK1/2, is raised in LMNA
    cardiomyopathy hearts and its overexpression alone causes cardiac dysfunction
    through AKT-mTOR activation and impaired autophagy. Both halves of this node
    are pharmacologically reversible in mouse models: the rapalog temsirolimus
    restores autophagic flux and prevents functional deterioration, and modulating
    autophagy or ER stress in a separate cardiomyocyte-specific deletion model
    delays dysfunction and prolongs survival.

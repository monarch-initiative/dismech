- name: Intracardiac Thrombus Formation
  conforms_to: "thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation"
  biological_scale: TISSUE
  role: effector
  description: >-
    Two features of this disease converge on intracardiac stasis: atrial
    fibrillation arising from the diseased conduction system, and a dilated,
    hypokinetic left ventricle. Both supply the flow-stagnation limb of the
    Virchow triad, and a conventional fibrin-platelet thrombus forms on that
    substrate - as a left ventricular mural thrombus or in the fibrillating
    atrium. Embolus from a mural thrombus is recognised as one of the ways CMD1A
    first presents, and thromboembolic events are common enough in genotyped
    cohorts to differ measurably by variant position. Conformance is deliberately
    limited to the thrombus-formation node of the module: the downstream systemic
    embolization here is arterial and cardiac in origin, so it does not map to
    the module's venous-to-pulmonary embolic branch, and no local occlusion or
    ischemia is claimed.

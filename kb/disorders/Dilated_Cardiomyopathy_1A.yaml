  phase: PHASE_III
  status: TERMINATED
  description: >-
    REALM-DCM, a phase 3 multinational randomised placebo-controlled trial of the
    selective p38-alpha MAPK inhibitor ARRY-371797 in symptomatic LMNA-related
    dilated cardiomyopathy, with change in six-minute walk distance at week 24 as
    the primary outcome. Terminated for futility at a planned interim analysis
    without safety concern.
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  - preferred_term: Reduced left ventricular ejection fraction
    term:

- name: Lamina-Chromatin Untethering and Transcriptional Dysregulation
  biological_scale: MOLECULAR
  role: intermediate
  description: >-
    A-type lamins tether lamina-associated domains (LADs) of peripheral
    heterochromatin and help position nuclear pores. Defective lamins loosen this
    tethering, and in haploinsufficient patient iPSC-cardiomyocytes a small number
    of genomic regions escape segregation to the nuclear lamina and fail to be
    inactivated during cardiogenesis, de-repressing non-cardiac genes including
    CACNA1A (neuronal P/Q-type calcium channel). Pharmacological inhibition of the
    resulting current partially corrects the electrical phenotype. Importantly the
    same study found that most expression changes are NOT explained by compartment
    switching, so this node is curated as a contributing, localized mechanism
    rather than the primary driver.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746

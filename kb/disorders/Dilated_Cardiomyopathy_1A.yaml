- name: Cardiomyocyte Nuclear Envelope Fragility and Rupture
  biological_scale: CELLULAR
  role: effector
  description: >-
    A lamina built from mutant subunits cannot bear the mechanical load imposed
    on a cardiomyocyte nucleus by repetitive contraction. Patient myocardium
    shows focal disruptions of the nuclear membrane, bleb formation and clustered
    nuclear pores; lamin A/C-null mouse cardiomyocytes show grossly abnormal
    nuclear shape and size with displaced and fragmented heterochromatin, and the
    desmin intermediate filament network detaches from the nuclear surface, so
    force is no longer transmitted between nucleoskeleton and cytoskeleton.
    Deleting Lmna in adult cardiomyocytes reproduces the nuclear abnormalities
    and adds perinuclear Golgi dilation and fragmentation with CREB3-mediated
    stress signalling before any fall in cardiac function.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cellular_components:
  - preferred_term: Nuclear envelope
    term:
      id: GO:0005635
      label: nuclear envelope
    modifier: ABNORMAL
  locations:
  - preferred_term: Myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  biological_processes:
  - preferred_term: Nuclear envelope organization
    term:
      id: GO:0006998
      label: nuclear envelope organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:11897440
    reference_title: "Autosomal dominant dilated cardiomyopathy with atrioventricular block: a lamin A/C defect-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal disruptions, bleb formation and nuclear pore clustering were
      documented by electron microscopy of the myocyte nuclear membranes.
    explanation: >-
      Ultrastructural evidence of nuclear envelope failure in the myocardium of
      LMNA-mutation carriers, in human tissue rather than a model system.
  - reference: PMID:14755333
    reference_title: Defects in nuclear structure and function promote dilated cardiomyopathy in lamin A/C-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electron microscopy of Lmna(-/-) cardiomyocytes shows disorganization and
      detachment of desmin filaments from the nuclear surface with progressive
      disruption of the cytoskeletal desmin network.
    explanation: >-
      Establishes loss of nucleoskeleton-cytoskeleton coupling as the structural
      correlate of the mechanical model.
  - reference: PMID:14755333
    reference_title: Defects in nuclear structure and function promote dilated cardiomyopathy in lamin A/C-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings suggest a model in which the primary pathophysiological
      mechanism in Lmna(-/-) mice is defective force transmission resulting from
      disruption of lamin interactions with the muscle-specific desmin network
      and loss of cytoskeletal tension.
    explanation: >-
      States the mechanical force-transmission model this node represents.
  - reference: PMID:38718107
    reference_title: Perinuclear damage from nuclear envelope deterioration elicits stress responses that contribute to LMNA cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Before cardiac dysfunction, Lmna-deleted cardiomyocytes displayed nuclear
      abnormalities, Golgi dilation/fragmentation, and CREB3-mediated stress
      activation.
    explanation: >-
      Places the nuclear and perinuclear lesion upstream of measurable cardiac
      dysfunction in a cardiomyocyte-specific adult deletion model.
  - reference: PMID:37585285
    reference_title: Nuclear damage in LMNA mutant iPSC-derived cardiomyocytes is associated with impaired lamin localization to the nuclear envelope.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The LMNA mutation exhibiting the most severe nuclear deformities, R249Q,
      additionally caused reduced nuclear stiffness and increased nuclear
      fragility.
    explanation: >-
      The direct mechanical measurement behind the word "fragility" in this
      node's name, made in human patient-derived cardiomyocytes rather than
      inferred from mouse morphology.
  - reference: PMID:37585285
    reference_title: Nuclear damage in LMNA mutant iPSC-derived cardiomyocytes is associated with impaired lamin localization to the nuclear envelope.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, for all cell lines, the degree of nuclear abnormalities
      corresponded to the degree of Lamin A/C and Lamin B1 mislocalization from
      the nuclear envelope.
    explanation: >-
      Ties the severity of the nuclear phenotype quantitatively to the upstream
      lamina assembly defect across multiple patient lines.
  - reference: PMID:41073815
    reference_title: Microtubule forces drive nuclear damage in LMNA cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Microtubule disruption prevented nuclear damage and preserved cardiac
      function in lamin A/C deficiency.
    explanation: >-
      Identifies the specific force-generating structure responsible for the
      nuclear damage, and shows removing that force is cardioprotective - the
      intervention that makes mechanical loading causal rather than incidental.
  - reference: PMID:41073815
    reference_title: Microtubule forces drive nuclear damage in LMNA cardiomyopathy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The LINC complex was mostly dispensable for transferring contractile strain
      to the nucleus, and its disruption did not rescue elevated nuclear strain
      in lamin A/C-deficient cardiomyocytes.
    explanation: >-
      Refines the mechanical model by excluding the obvious candidate: LINC
      disruption is cardioprotective because it removes the perinuclear
      microtubule cage, not because it uncouples the cytoskeleton from the
      nucleus. PARTIAL because it constrains rather than supports the node.

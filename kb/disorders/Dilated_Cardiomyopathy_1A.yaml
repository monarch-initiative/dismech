- name: Arrhythmogenic Substrate and Malignant Ventricular Arrhythmia
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Fibrotic substrate, conduction delay and altered cardiomyocyte
    electrophysiology together generate non-sustained and sustained ventricular
    tachycardia, ventricular fibrillation and sudden cardiac death. The
    distinguishing feature of CMD1A is that this risk is only loosely coupled to
    systolic function: sudden cardiac death may occur with minimal or no systolic
    dysfunction, so the conventional ejection-fraction threshold used to select
    defibrillator candidates in other dilated cardiomyopathies under-protects
    these patients. Validated genotype-aware predictors of malignant arrhythmia
    are male sex, non-missense (truncating or splice-affecting) variants,
    atrioventricular block, non-sustained ventricular tachycardia and reduced
    ejection fraction.

      reference_title: Lamin and the heart.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Mutations in LMNA cause autosomal dominant severe heart disease, accounting
        for 10% of dilated cardiomyopathy (DCM).
      explanation: >-

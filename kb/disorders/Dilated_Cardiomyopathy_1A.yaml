- name: Myocardial and Conduction System Fibrosis
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  biological_scale: TISSUE
  role: intermediate
  description: >-
    Cardiomyocyte loss and inflammatory signalling are followed by interstitial
    and replacement fibrosis, with fibro-fatty replacement concentrated in and
    around the conduction system at the basal interventricular septum. This
    anatomical concentration is what links the molecular lesion to the
    characteristic early atrioventricular block, and it is detectable in vivo:
    late gadolinium enhancement on cardiac magnetic resonance shows myocardial
    fibrosis in the large majority of mutation carriers, and the extent of
    enhancement tracks both regional wall motion abnormality and conduction
    abnormality. Fibrosis is frequently present while the ventricle is still only
    mildly dilated, which is why CMR is used to identify disease before the
    ejection fraction falls.

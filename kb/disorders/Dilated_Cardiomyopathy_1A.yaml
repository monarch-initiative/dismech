  title: LMNA-Related Dilated Cardiomyopathy.
  tags:
  - GeneReviews
- reference: PMID:37622657
  title: 2023 ESC Guidelines for the management of cardiomyopathies.
notes: >-
  External identifiers for this concept are OMIM:115200 (CARDIOMYOPATHY, DILATED,
  1A; CMD1A) and ORPHA:300751. They are not carried in a `mappings:` block because
  the schema's DiseaseMappings class has slots only for ICD-10-CM, ICD-11
  foundation, MONDO and NCIT; both identifiers are already reachable as xrefs on
  MONDO:0007269.

  Curated from the GeneReviews chapter (PMID:20301717) as the phenotype baseline,
  plus primary clinical cohorts and mechanistic studies. Orphanet ORPHA:300751
  maps to this concept but the Orphadata bulk XML was not available in this
  environment, so no ORPHA-quoted evidence is included. The 2023 ESC
  cardiomyopathy guideline is listed as a top-level reference only: its PubMed
  record caches as metadata without abstract text, so no snippet-verified
  evidence item could be drawn from it, and the gene-specific ICD recommendation
  is instead evidenced from GeneReviews and the risk-model cohorts.

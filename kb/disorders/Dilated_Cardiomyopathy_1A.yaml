  - reference: PMID:22281253
    reference_title: Risk factors for malignant ventricular arrhythmias in lamin a/c mutation carriers a European cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a median follow-up period of 43 months (interquartile range: 17 to 101
      months), 48 (18%) persons experienced a first episode of MVA: 11 persons
      received successful cardiopulmonary resuscitation, 25 received appropriate
      ICD treatment, and 12 persons died suddenly.
    explanation: >-
      Quantifies malignant arrhythmic events, including 12 sudden deaths, in a
      269-carrier cohort over a median 43 months.
- category: Cardiac
  name: Dilated Cardiomyopathy
  frequency: FREQUENT
  description: >-
    Left ventricular enlargement with reduced systolic function is the defining
    structural phenotype, but unlike most genetic dilated cardiomyopathies it
    typically arrives after the electrical phenotype is established. Ventricular
    dilation is often described as mild relative to the degree of functional
    impairment.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LMNA-related dilated cardiomyopathy (DCM) is characterized by left
      ventricular enlargement and/or reduced systolic function preceded
      (sometimes by many years) by or accompanied by conduction system disease
      and/or arrhythmias.
    explanation: >-
      The defining clinical description, including the characteristic ordering
      relative to conduction disease.
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of clinical manifestations increased broadly from index
      evaluation to median follow-up: AVB, 46% to 57%; AA, 39% to 63%; VA, 16% to
      34%; and LVD, 44% to 57%.
    explanation: >-
      Left ventricular dysfunction in 44-57% of carriers supports the FREQUENT
      band (30-79%).
- category: Cardiac
  name: Reduced Left Ventricular Ejection Fraction
  frequency: FREQUENT
  description: >-
    Systolic impairment, conventionally an LVEF below 50%, is present in
    approximately 45% of carriers at genetic diagnosis and accumulates with age.
    An LVEF below 45% at first clinical contact is one of the independent
    predictors of malignant ventricular arrhythmia.
  phenotype_term:
    preferred_term: Reduced left ventricular ejection fraction
    term:
      id: HP:0012664
      label: Reduced left ventricular ejection fraction
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:29237675
    reference_title: Gene-Based Risk Stratification for Cardiac Disorders in LMNA Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 77 carriers, 71 (92%) were phenotypically affected and showed
      cardiac conduction disturbance (81%), low left ventricular ejection
      fraction (<50%; 45%), atrial arrhythmias (58%), and malignant ventricular
      arrhythmias (26%).
    explanation: >-
      Reports low ejection fraction in 45% of carriers, supporting the FREQUENT
      band (30-79%).
- category: Cardiac
  name: Myocardial Fibrosis
  frequency: FREQUENT
  description: >-
    Late gadolinium enhancement on cardiac magnetic resonance reveals replacement
    fibrosis in the majority of imaged variant carriers, usually in a
    non-ischaemic midmyocardial or subepicardial distribution. A minority show an
    apical transmural pseudo-infarct pattern, which in one series segregated with
    C-terminal immunoglobulin-like domain variants and higher arrhythmic and
    thromboembolic risk.
  phenotype_term:
    preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
  evidence:
  - reference: PMID:40689545
    reference_title: Variant-Specific Late Gadolinium Enhancement Patterns Influence Clinical Outcomes in LMNA-Related Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 72/116 (62%) LMNA variant-positive patients with cardiac magnetic
      resonance imaging data, LGE was observed in 40/72 (56%) cases. Most
      exhibited a nonischemic, midmyocardial or subepicardial pattern (73%), and
      6/40 (15%) showed a unique "pseudo-infarct" transmural pattern,
      predominantly affecting the apical segments.
    explanation: >-
      Gives both the 56% prevalence supporting the FREQUENT band and the
      distribution patterns described.
  - reference: PMID:21689390
    reference_title: Late gadolinium enhanced cardiovascular magnetic resonance of lamin A/C gene mutation related dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients had LV myocardial fibrosis in 88% of cases. Segmental wall motion
      abnormalities correlated strongly with the degree of enhancement.
      Myocardial enhancement was associated with conduction abnormalities.
    explanation: >-
      An independent, higher fibrosis prevalence in a small carrier series, and
      the observation that enhancement tracks with conduction abnormality - the
      tissue link between the fibrotic and electrical phenotypes.
- category: Cardiac
  name: Congestive Heart Failure
  description: >-
    Symptomatic heart failure with dyspnoea, fatigue and fluid overload develops
    as systolic function declines, and progresses to end-stage disease requiring
    transplantation or mechanical support in roughly a fifth of carriers followed
    long term.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      End-stage HF developed in 19% of patients, and 13% died.
    explanation: >-
      Quantifies progression to end-stage heart failure in a long-term
      multicentre cohort.
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LMNA-related DCM usually presents in early to mid-adulthood with
      symptomatic conduction system disease or arrhythmias, or with symptomatic
      DCM including heart failure or embolus from a left ventricular mural
      thrombus.
    explanation: >-
      Names symptomatic heart failure as one of the typical presenting syndromes.
- category: Cardiac
  name: Left Ventricular Mural Thrombus with Systemic Embolism
  description: >-
    Thrombus formation in the dilated, hypokinetic left ventricle - compounded by
    coexisting atrial fibrillation - can cause systemic embolism, and embolic
    presentation is recognised as one of the ways CMD1A first comes to attention.
  phenotype_term:
    preferred_term: Left ventricular thrombus
    term:
      id: HP:0040412
      label: Left ventricular thrombus
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LMNA-related DCM usually presents in early to mid-adulthood with
      symptomatic conduction system disease or arrhythmias, or with symptomatic
      DCM including heart failure or embolus from a left ventricular mural
      thrombus.
    explanation: >-
      Identifies left ventricular mural thrombus with embolism as a recognised
      presenting manifestation.
- category: Cardiac
  name: Thromboembolic Events
  description: >-
    Thromboembolism arises from atrial fibrillation and from left ventricular
    mural thrombus. In one cardiac magnetic resonance series, carriers of
    C-terminal immunoglobulin-like domain variants had a markedly higher rate of
    thromboembolic events despite less atrioventricular block and atrial
    fibrillation than other carriers.
  phenotype_term:
    preferred_term: Thromboembolism
    term:
      id: HP:0001907
      label: Thromboembolism
  evidence:
  - reference: PMID:40689545
    reference_title: Variant-Specific Late Gadolinium Enhancement Patterns Influence Clinical Outcomes in LMNA-Related Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with clinically manifest disease (76/116), those with
      IgD-localizing variants had a lower prevalence of atrioventricular block
      (25% versus 72%, P=0.002) and atrial fibrillation (50% versus 81%, P=0.019)
      but higher rates of thromboembolic events (42% versus 16%, P=0.038).
    explanation: >-
      Documents thromboembolic events in LMNA carriers and their variant-position
      dependence.
- category: Musculoskeletal
  name: Skeletal Muscle Involvement
  description: >-
    A subset of carriers has skeletal muscle disease, reflecting the allelic
    relationship of CMD1A with Emery-Dreifuss muscular dystrophy and limb-girdle
    muscular dystrophy 1B. Where present it typically takes a humeroperoneal or
    limb-girdle distribution with proximal weakness. Notably it is not obligate -
    in the founding CMD1A families no mutation carrier had joint contractures or
    skeletal myopathy - and its presence in a DCM proband is a strong clinical
    predictor of an LMNA variant.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:12628721
    reference_title: Natural history of dilated cardiomyopathy due to lamin A/C gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was significant phenotypic variability, but the presence of skeletal
      muscle involvement (p < 0.001), supraventricular arrhythmia (p = 0.003),
      conduction defects (p = 0.01), and "mildly" DCM (p = 0.006) were predictors
      of LMNA mutations.
    explanation: >-
      Establishes skeletal muscle involvement as part of the spectrum and as a
      statistically significant clinical predictor of LMNA mutation status.
  - reference: PMID:10580070
    reference_title: Missense mutations in the rod domain of the lamin A/C gene as causes of dilated cardiomyopathy and conduction-system disease.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No family members with mutations had either joint contractures or skeletal
      myopathy.
    explanation: >-
      Shows skeletal involvement is not obligate: in the founding CMD1A families
      it was entirely absent. PARTIAL because it bounds rather than supports the
      phenotype.
- category: Musculoskeletal
  name: Joint Contractures
  description: >-
    Curated as a boundary marker rather than an established CMD1A phenotype.
    Early joint contractures in a humeroperoneal distribution are the hallmark of
    the allelic Emery-Dreifuss phenotype, and carriers whose presentation
    overlaps it may have them; but they were explicitly absent in the founding
    CMD1A families, and that absence is what separated the
    cardiomyopathy-predominant presentation from autosomal dominant EDMD. No
    source in this entry documents contractures occurring in a
    cardiomyopathy-predominant LMNA carrier, so no frequency is assigned and both
    evidence items below bound the claim rather than support it.
  phenotype_term:
    preferred_term: Joint contracture
    term:
      id: HP:0034392
      label: Joint contracture
  evidence:
  - reference: PMID:10580070
    reference_title: Missense mutations in the rod domain of the lamin A/C gene as causes of dilated cardiomyopathy and conduction-system disease.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the head or tail domain of this gene cause Emery-Dreifuss
      muscular dystrophy, a childhood-onset disease characterized by joint
      contractures and in some cases by abnormalities of cardiac conduction
      during adulthood.
    explanation: >-
      Establishes contractures as the hallmark of the allelic Emery-Dreifuss
      phenotype. PARTIAL because the quote describes the allelic disorder, not
      CMD1A.
  - reference: PMID:10580070
    reference_title: Missense mutations in the rod domain of the lamin A/C gene as causes of dilated cardiomyopathy and conduction-system disease.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No family members with mutations had either joint contractures or skeletal
      myopathy.
    explanation: >-
      A negative finding in the founding CMD1A families, recorded as REFUTE
      because it argues against contractures being a feature of the
      cardiomyopathy-predominant presentation.

biochemical:
- name: Serum Creatine Kinase
  notes: >-
    Creatine kinase is normal in most carriers with pure cardiac disease but is
    mildly raised in some, particularly with lamin C tail-domain defects and in
    those with skeletal muscle involvement. It is a poor screening test in
    isolation: in a systematic series, raised creatine kinase in DCM without
    atrioventricular block did not identify any LMNA mutation carrier.
  biomarker_term:
    preferred_term: Elevated circulating creatine kinase concentration
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase concentration
  evidence:
  - reference: PMID:10580070
    reference_title: Missense mutations in the rod domain of the lamin A/C gene as causes of dilated cardiomyopathy and conduction-system disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum creatine kinase levels were normal in family members with mutations
      of the lamin rod but mildly elevated in some family members with a defect
      in the tail domain of lamin C.
    explanation: >-
      Documents the domain-dependent pattern of creatine kinase elevation across
      CMD1A families.
  - reference: PMID:11897440
    reference_title: "Autosomal dominant dilated cardiomyopathy with atrioventricular block: a lamin A/C defect-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased sCPK in patients with DCM without AVB is not a useful predictor
      of LMNA mutation.
    explanation: >-
      Bounds the diagnostic usefulness of creatine kinase as a stand-alone
      selector for LMNA testing.
genetic:
- name: LMNA
  notes: >-
    LMNA at 1q22 encodes lamin A and lamin C by alternative splicing of a single
    transcript. Pathogenic variants causing CMD1A are heterozygous and spread
    across the gene without a dominant hotspot: missense changes cluster in the
    central alpha-helical rod domain, and nonsense, frameshift, small indel and
    splice-affecting alleles are also common. Variant class carries clinical
    weight rather than just mechanistic interest - non-missense alleles are an
    independent predictor of malignant ventricular arrhythmia and are associated
    with earlier conduction disease and earlier systolic impairment than missense
    alleles. ClinGen classifies the LMNA-DCM relationship as Definitive.
  gene_term:
    preferred_term: LMNA
    term:
      id: hgnc:6636
      label: LMNA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:10580070
    reference_title: Missense mutations in the rod domain of the lamin A/C gene as causes of dilated cardiomyopathy and conduction-system disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic defects in distinct domains of the nuclear-envelope proteins lamin
      A and lamin C selectively cause dilated cardiomyopathy with
      conduction-system disease or autosomal dominant Emery-Dreifuss muscular
      dystrophy.
    explanation: >-
      Establishes LMNA as the causal gene and the domain-dependent split between
      the cardiomyopathy-predominant and muscular-dystrophy phenotypes.
  - reference: PMID:29237675
    reference_title: Gene-Based Risk Stratification for Cardiac Disorders in LMNA Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The onset of cardiac disorders indicated that subjects with truncation
      mutations had an earlier occurrence of cardiac conduction disturbance and
      low left ventricular ejection fraction, than those with missense mutations.
    explanation: >-
      Supports the genotype-phenotype gradient by variant class that drives
      risk stratification in this disease.
  - reference: PMID:11897440
    reference_title: "Autosomal dominant dilated cardiomyopathy with atrioventricular block: a lamin A/C defect-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Western blot protein analyses of three hearts with different mutations
      showed an additional 30-kDa band, suggesting a degrading effect of mutated
      on wild-type protein.
    explanation: >-
      Biochemical support for modelling the missense lesion as dominant-negative:
      mutant protein acting on wild-type rather than simple loss of one allele.
      The inference is hedged in the source and rests on three hearts, and the
      mutation set analysed included nonsense and frameshift alleles, so it does
      not establish the mechanism for the whole allelic spectrum.
  - reference: CGGV:assertion_132ea1ec-caa9-409a-8670-3edb2ec9c889-2025-05-30T160000.000Z
    reference_title: LMNA / dilated cardiomyopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LMNA | HGNC:6636 | dilated cardiomyopathy | MONDO:0005021 | AD | Definitive"
    explanation: >-
      ClinGen Dilated Cardiomyopathy Gene Curation Expert Panel assertion of
      Definitive gene-disease validity with autosomal dominant inheritance.
- name: TTN
  notes: >-
    A co-occurring titin variant acts as a modifier rather than an independent
    cause. In an extended family segregating LMNA p.K219T, the four members who
    also carried TTN p.L4855F required heart transplantation substantially
    younger than single heterozygotes, and their myocardium showed increased
    nuclear length, sarcomeric disorganisation and myonuclear clustering. This is
    one documented source of the intrafamilial variability that is otherwise
    unexplained in this disease.
  gene_term:
    preferred_term: TTN
    term:
      id: hgnc:12403
      label: TTN
  relationship_type: MODIFIER
  evidence:
  - reference: PMID:23463027
    reference_title: Doubly heterozygous LMNA and TTN mutations revealed by exome sequencing in a severe form of dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The age for heart transplantation was substantially less for
      LMNA:p.K219T/TTN:p.L4855F double heterozygotes than that for
      LMNA:p.K219T single heterozygotes.
    explanation: >-
      Establishes TTN as a severity modifier in an LMNA family, with an outcome
      measure (age at transplantation) rather than a surrogate.
  - reference: PMID:23463027
    reference_title: Doubly heterozygous LMNA and TTN mutations revealed by exome sequencing in a severe form of dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myocardial specimens of doubly heterozygote individuals showed increased
      nuclear length, sarcomeric disorganization, and myonuclear clustering
      compared with samples from single heterozygotes.
    explanation: >-
      Provides the tissue-level correlate of the modifier effect, linking it back
      to the nuclear phenotype of the primary lesion.
diagnosis:
- name: Twelve-Lead Electrocardiography
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  description: >-
    The first-line and often the earliest abnormal test. PR prolongation, higher
    degrees of atrioventricular block, sinus bradycardia and atrial fibrillation
    may be present years before any echocardiographic abnormality, which is why
    ECG anchors surveillance of asymptomatic carriers.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with an LMNA pathogenic variant who are found to have any EKG
      abnormality should undergo a cardiovascular evaluation for disease
      progression (EKG, 24-48 hour rhythm monitoring, LV function measurement) at
      least annually.
    explanation: >-
      Establishes the ECG as the trigger for intensified surveillance in
      GeneReviews management guidance.
- name: Echocardiography
  diagnosis_term:
    preferred_term: Echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Echocardiography measures chamber size and systolic function and is part of
    both the diagnostic workup and the one-to-two-yearly surveillance of
    asymptomatic carriers. It is less sensitive early in this disease than the
    ECG, because the electrical phenotype precedes structural change and the
    dilatation, when it appears, is often mild relative to the functional
    impairment.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asymptomatic individuals with a pathogenic LMNA variant should undergo
      cardiovascular evaluation (medical history, physical examination,
      echocardiogram, and EKG) every one to two years and/or whenever new
      symptoms arise.
    explanation: >-
      Places echocardiography in the GeneReviews surveillance protocol for
      asymptomatic carriers.
  - reference: PMID:21689390
    reference_title: Late gadolinium enhanced cardiovascular magnetic resonance of lamin A/C gene mutation related dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty-nine percent of our asymptomatic or mildly symptomatic patients
      showed mild ventricular dilatation, systolic failure or both in global
      ventricular analysis.
    explanation: >-
      Supports the sensitivity caveat: abnormalities in asymptomatic or mildly
      symptomatic carriers are mild and global, which is what limits
      echocardiography as an early detection tool. PARTIAL because the
      measurement was made by cardiac magnetic resonance, not echocardiography.
- name: Ambulatory Rhythm Monitoring
  diagnosis_term:
    preferred_term: Electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  description: >-
    Twenty-four to forty-eight hour monitoring detects non-sustained ventricular
    tachycardia, which is one of the independent predictors of malignant
    ventricular arrhythmia and therefore directly informs the ICD decision.
  evidence:
  - reference: PMID:22281253
    reference_title: Risk factors for malignant ventricular arrhythmias in lamin a/c mutation carriers a European cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independent risk factors for MVA were nonsustained ventricular tachycardia,
      left ventricular ejection fraction <45% at the first clinical contact, male
      sex, and non-missense mutations (ins-del/truncating or mutations affecting
      splicing).
    explanation: >-
      Non-sustained ventricular tachycardia is detectable only by rhythm
      monitoring and is one of the four predictors, making the test decision-relevant.
- name: Molecular Genetic Testing of LMNA
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis is established by identifying a heterozygous pathogenic LMNA
    variant in a proband with a compatible phenotype. In practice a
    cardiomyopathy multigene panel or exome sequencing is used rather than
    single-gene testing, given the genetic and phenotypic overlap with other
    conduction-disease cardiomyopathy genes. Once a familial variant is known,
    targeted testing of relatives becomes the screening tool.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LMNA-related DCM is established in a proband with
      suggestive findings and a heterozygous pathogenic variant in LMNA
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews statement of the diagnostic criterion.
- name: Cardiac Magnetic Resonance with Late Gadolinium Enhancement
  diagnosis_term:
    preferred_term: Magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Cardiac MRI detects replacement fibrosis in the majority of imaged carriers,
    typically midmyocardial or subepicardial, and the enhancement pattern carries
    prognostic and variant-specific information beyond simple fibrosis detection.
  evidence:
  - reference: PMID:40689545
    reference_title: Variant-Specific Late Gadolinium Enhancement Patterns Influence Clinical Outcomes in LMNA-Related Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LMNA missense variants localizing to IgD present a distinct apical
      pseudo-infarct LGE pattern associated with increased risk of ventricular
      arrhythmias and thromboembolic events
    explanation: >-
      Supports the prognostic and genotype-linked value of the late gadolinium
      enhancement pattern, not merely its presence.
  - reference: PMID:21689390
    reference_title: Late gadolinium enhanced cardiovascular magnetic resonance of lamin A/C gene mutation related dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac conduction abnormalities, mildly dilated LV and depressed systolic
      dysfunction are common in DCM caused by a lamin A/C gene mutation.
    explanation: >-
      Characterises the CMR phenotype, including the mild degree of dilatation
      relative to functional impairment that makes echocardiography alone
      insensitive early in this disease.
- name: LMNA-Risk VTA Score
  description: >-
    A validated multivariable model estimating five-year risk of life-threatening
    ventricular tachyarrhythmia from male sex, non-missense variant,
    first-degree or higher atrioventricular block, non-sustained ventricular
    tachycardia and left ventricular ejection fraction. It reclassifies a
    substantial fraction of patients relative to guideline-based ICD selection.
  evidence:
  - reference: PMID:31155932
    reference_title: Development and Validation of a New Risk Prediction Score for Life-Threatening Ventricular Tachyarrhythmias in Laminopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 5-year estimated risk threshold ≥7% predicted 96.2% of LTVTA and net
      reclassified 28.8% of patients with LTVTA in comparison with the
      guidelines-based approach.
    explanation: >-
      Reports the operating threshold and the net reclassification gain over
      guideline-based ICD selection.
imaging_findings:
- name: Midmyocardial and Subepicardial Late Gadolinium Enhancement
  modality: MRI
  imaging_finding_term:
    preferred_term: Myocardial late gadolinium enhancement
    term:
      id: HP:4000004
      label: Myocardial late gadolinium enhancement
  description: >-
    The characteristic imaging signature. Replacement fibrosis appears as late
    gadolinium enhancement in a non-ischaemic distribution - midmyocardial or
    subepicardial rather than subendocardial - and is present in most imaged
    carriers, including asymptomatic ones. Its extent correlates with segmental
    wall-motion abnormality and its presence is associated with conduction
    abnormality.
  located_in:
    preferred_term: Myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  frequency: FREQUENT
  evidence:
  - reference: PMID:40689545
    reference_title: Variant-Specific Late Gadolinium Enhancement Patterns Influence Clinical Outcomes in LMNA-Related Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 72/116 (62%) LMNA variant-positive patients with cardiac magnetic
      resonance imaging data, LGE was observed in 40/72 (56%) cases. Most
      exhibited a nonischemic, midmyocardial or subepicardial pattern (73%), and
      6/40 (15%) showed a unique "pseudo-infarct" transmural pattern,
      predominantly affecting the apical segments.
    explanation: >-
      Gives the 56% prevalence supporting the FREQUENT band and the dominant
      non-ischaemic midmyocardial/subepicardial distribution.
  - reference: PMID:21689390
    reference_title: Late gadolinium enhanced cardiovascular magnetic resonance of lamin A/C gene mutation related dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients had LV myocardial fibrosis in 88% of cases. Segmental wall motion
      abnormalities correlated strongly with the degree of enhancement.
      Myocardial enhancement was associated with conduction abnormalities.
    explanation: >-
      An independent series with a higher prevalence, and the correlations with
      wall motion and with conduction abnormality.
- name: Apical Transmural Pseudo-Infarct Enhancement Pattern
  modality: MRI
  imaging_finding_term:
    preferred_term: Myocardial late gadolinium enhancement
    term:
      id: HP:4000004
      label: Myocardial late gadolinium enhancement
  description: >-
    A minority pattern that matters because it is genotype-linked and
    prognostically adverse. Transmural enhancement predominantly in the apical
    segments, mimicking prior infarction, was seen only in carriers of
    C-terminal immunoglobulin-like domain missense variants, who had less
    atrioventricular block and atrial fibrillation than other carriers but more
    thromboembolic events and independently higher risk of sudden death or major
    ventricular arrhythmia.
  located_in:
    preferred_term: Myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:40689545
    reference_title: Variant-Specific Late Gadolinium Enhancement Patterns Influence Clinical Outcomes in LMNA-Related Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 6 patients with this distinct LGE pattern harbored C-terminal IgD
      (immunoglobulin-like domain) variants (p.Arg471His or p.Arg541His).
    explanation: >-
      Establishes the genotype restriction of this pattern. The 6/40 (15%) share
      of imaged enhancement supports the OCCASIONAL band.
  - reference: PMID:40689545
    reference_title: Variant-Specific Late Gadolinium Enhancement Patterns Influence Clinical Outcomes in LMNA-Related Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During a median follow-up of 37 months, IgD variant presence independently
      predicted sudden cardiac death/major ventricular arrhythmia (hazard ratio,
      2.391 [95% CI, 1.046-5.464]; P=0.039).
    explanation: >-
      The prognostic association that makes this pattern actionable rather than
      descriptive.

histopathology:
- name: Reduced or Absent Nuclear Lamin A/C Immunostaining
  description: >-
    Endomyocardial biopsy is not routine in this disease, but where myocardium
    has been examined the lamina is depleted: immunochemistry shows reduced or
    absent lamin A/C in myocyte nuclei, and electron microscopy shows focal
    membrane disruptions, blebs and clustered nuclear pores. These findings are
    the tissue-level correlate of the assembly defect and were absent in the
    disease and normal controls of the same series.
  evidence:
  - reference: PMID:11897440
    reference_title: "Autosomal dominant dilated cardiomyopathy with atrioventricular block: a lamin A/C defect-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LMNA expression of the myocyte nuclei was reduced or absent.
    explanation: >-
      The immunochemical finding in myocardium from LMNA-mutation carriers.
  - reference: PMID:11897440
    reference_title: "Autosomal dominant dilated cardiomyopathy with atrioventricular block: a lamin A/C defect-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of these changes and no mutations were found in the nine patients with
      DCM and increased sCPK or in the disease and normal controls.
    explanation: >-
      Establishes the specificity of the finding against both disease and normal
      controls in the same study.
- name: Myonuclear Elongation and Clustering with Sarcomeric Disorganisation
  description: >-
    Reported in myocardium from carriers of both an LMNA and a TTN variant,
    compared with LMNA single heterozygotes from the same family - so the finding
    tracks the modifier genotype rather than the disease as such.
  evidence:
  - reference: PMID:23463027
    reference_title: Doubly heterozygous LMNA and TTN mutations revealed by exome sequencing in a severe form of dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myocardial specimens of doubly heterozygote individuals showed increased
      nuclear length, sarcomeric disorganization, and myonuclear clustering
      compared with samples from single heterozygotes.
    explanation: >-
      The within-family histological comparison that ties these findings to the
      TTN modifier rather than to LMNA alone.

differential_diagnoses:
- name: Idiopathic Dilated Cardiomyopathy
  description: >-
    Non-genetic or unexplained dilated cardiomyopathy shares the structural
    phenotype but lacks the early, disproportionate conduction-system disease.
    The distinction matters because arrhythmic risk relative to ejection fraction
    is much higher in the LMNA form, so device decisions diverge.
  distinguishing_features:
  - >-
    Early and progressive atrioventricular block preceding ventricular dilation,
    family history of sudden death or pacemaker at a young age, and a pathogenic
    LMNA variant.
- name: Emery-Dreifuss Muscular Dystrophy
  description: >-
    The allelic LMNA disorder in which childhood-onset joint contractures and
    humeroperoneal weakness dominate and cardiac conduction disease appears in
    adulthood. CMD1A families may have no skeletal involvement at all.
  distinguishing_features:
  - >-
    Childhood-onset contractures and skeletal myopathy as the presenting problem,
    versus adult-onset conduction disease with normal muscles in CMD1A. X-linked
    EMD/emerin-related disease must also be excluded.
- name: Arrhythmogenic Right Ventricular Cardiomyopathy
  description: >-
    Also presents with ventricular arrhythmia out of proportion to systolic
    dysfunction, but the substrate is desmosomal and predominantly right
    ventricular. ClinGen classifies the LMNA-ARVC relationship as Limited, so an
    ARVC label should not be applied to an LMNA carrier on genetic grounds alone.
  distinguishing_features:
  - >-
    Right ventricular predominance, desmosomal gene variants (PKP2, DSP, DSG2),
    and characteristic depolarisation/repolarisation ECG criteria, versus the
    atrioventricular-block-first pattern of CMD1A.
- name: Cardiac Sarcoidosis
  description: >-
    The highest-stakes mimic, and the only acquired one on this list. Cardiac
    sarcoidosis presents with the same triad of atrioventricular block,
    ventricular arrhythmia and heart failure, with patchy non-ischaemic late
    gadolinium enhancement on cardiac magnetic resonance. Distinguishing them
    changes management in opposite directions - immunosuppression versus early
    defibrillator - and endomyocardial biopsy can be equivocal, so genetic
    testing belongs in the initial workup rather than after imaging has been
    relied on alone.
  distinguishing_features:
  - >-
    A pathogenic LMNA variant, and a family history of conduction disease,
    pacemaker or sudden death at a young age.
  - >-
    Extracardiac sarcoid involvement, non-caseating granulomas on biopsy, and
    FDG-PET uptake favour sarcoidosis; but isolated cardiac sarcoidosis occurs
    and imaging criteria alone do not separate the two.
  evidence:
  - reference: PMID:40225500
    reference_title: "Lamin AC Cardiomyopathy, the Next Masquerader: Laminopathy Mimicking Cardiac Sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic expression of lamin AC-dilated cardiomyopathy (LMNA-DCM) and
      cardiac sarcoidosis (CS) at times presents with similar clinical findings,
      including arrhythmia, conduction abnormalities, and heart failure.
    explanation: >-
      Establishes the clinical overlap that makes this a genuine differential
      rather than a theoretical one.
  - reference: PMID:40225500
    reference_title: "Lamin AC Cardiomyopathy, the Next Masquerader: Laminopathy Mimicking Cardiac Sarcoidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also highlighted is the need for extreme caution when endomyocardial
      biopsies are equivocal and there is sole reliance on cardiac imaging to
      establish diagnostic criteria.
    explanation: >-
      Supports the recommendation to resolve the differential genetically rather
      than by imaging, which is the practical consequence of the overlap.
- name: Other Conduction-Disease Cardiomyopathy Genes
  description: >-
    SCN5A, FLNC, DES, RBM20 and PLN variants can each produce dilated
    cardiomyopathy with arrhythmia or conduction disease, which is why panel
    rather than single-gene testing is standard.
  distinguishing_features:
  - >-
    Resolved by multigene panel or exome sequencing rather than by phenotype.
progression:
- phase: Asymptomatic Genotype-Positive Stage
  notes: >-
    Carriers identified by cascade testing may be entirely normal. Penetrance is
    age-dependent, but conversion is brisk once surveillance begins - roughly a
    9% annual incidence of a newly documented cardiac phenotype in asymptomatic
    family members with a mean age of 31.
  evidence:
  - reference: PMID:29095976
    reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asymptomatic LMNA genotype-positive family members (age 31 ± 15 years) had
      a 9% annual incidence of a newly documented cardiac phenotype and 61%
      (19/31) of cardiac penetrance during 4.4 ± 2.9 years of follow-up.
    explanation: >-
      Quantifies conversion from genotype-positive/phenotype-negative to
      clinically affected.
- phase: Electrical Stage
  notes: >-
    Conduction-system disease and atrial arrhythmia appear first and may be the
    only manifestation for years, with structural disease still absent or mild.
    This is the window in which arrhythmic risk stratification and pre-emptive
    device decisions are made.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LMNA-related dilated cardiomyopathy (DCM) is characterized by left
      ventricular enlargement and/or reduced systolic function preceded
      (sometimes by many years) by or accompanied by conduction system disease
      and/or arrhythmias.
    explanation: >-
      States the temporal precedence of the electrical over the structural
      phenotype.
- phase: Structural and Arrhythmic Progression
  notes: >-
    Every category of manifestation accumulates with follow-up rather than
    remaining static, and carriers who are structurally normal at first contact
    are not thereby safe: about a quarter develop new left ventricular
    dysfunction.
  evidence:
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of clinical manifestations increased broadly from index
      evaluation to median follow-up: AVB, 46% to 57%; AA, 39% to 63%; VA, 16% to
      34%; and LVD, 44% to 57%.
    explanation: >-
      Documents progression across all four manifestation categories over a
      median seven years.
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LMNA-related heart disease was associated with a high incidence of
      phenotypic progression and adverse arrhythmic and nonarrhythmic events over
      long-term follow-up. The index cardiac phenotype did not predict adverse
      events.
    explanation: >-
      Important negative finding: the presenting phenotype does not stratify
      outcome, so surveillance cannot be relaxed on the basis of a mild
      presentation.
- phase: End-Stage Disease
  notes: >-
    The disease ends in transplantation, mechanical support, or arrhythmic death.
    Roughly one in five carriers followed long term is transplanted or reaches
    end-stage heart failure, and survival is substantially worse than in
    non-LMNA dilated cardiomyopathy.
  evidence:
  - reference: PMID:12628721
    reference_title: Natural history of dilated cardiomyopathy due to lamin A/C gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LMNA mutation carriers had a significantly poorer cumulative survival
      compared with non-carrier DCM patients: event-free survival at the age of
      45 years was 31% versus 75% in non-carriers.
    explanation: >-
      Quantifies the survival penalty relative to other dilated cardiomyopathy.
environmental:
- name: Intense or competitive exercise
  description: >-
    Mechanical loading is the one modifiable input that the pathophysiology of
    this disease predicts should matter: nuclear damage in lamin A/C-deficient
    cardiomyocytes is generated by contraction-transmitted microtubule forces,
    so sustained high-intensity exertion is expected to accelerate it. Sports
    guidance treats lamin A/C as one of the specific genes for which permissive,
    surveillance-contingent recommendations do not apply, extending restriction
    even to genotype-positive, phenotype-negative carriers. The recommendation is
    precautionary and mechanism-derived; it has not been tested prospectively.
  exposure_term:
    preferred_term: exposure to strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  influences_mechanisms:
  - target: Cardiomyocyte Nuclear Envelope Fragility and Rupture
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Higher contractile workload increases the microtubule-transmitted force
      concentrated on a mechanically vulnerable nucleus. The link is inferred
      from the force-dependence of nuclear damage, not measured against an
      exercise exposure in patients.
    evidence:
    - reference: PMID:41073815
      reference_title: Microtubule forces drive nuclear damage in LMNA cardiomyopathy.
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: >-
        Computational modeling revealed that microtubule forces create local
        stress concentrations that damage lamin A/C-deficient nuclei.
      explanation: >-
        Establishes that nuclear damage is force-dependent, which is the
        mechanistic basis for expecting exertion to matter. PARTIAL because the
        study manipulates microtubules, not exercise, so the exposure itself is
        untested.
  evidence:
  - reference: PMID:36929832
    reference_title: "Sport and exercise in genotype positive (+) phenotype negative (-) individuals: current dilemmas and future perspectives."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The recommendations to engage in intensive exercise and competitive sports
      are usually contingent on annual clinical surveillance, except for
      pathogenic variants in specific genes, such as lamin A/C or plakophilin-2.
    explanation: >-
      Documents that lamin A/C is singled out as a gene for which the permissive,
      surveillance-contingent sports recommendation does not apply. PARTIAL and
      OTHER because this is expert review of guideline positions, not a study of
      exercise exposure in LMNA carriers.
  notes: >-
    No prospective trial has tested whether activity restriction alters
    progression in LMNA carriers; the openscientist deep-research run flagged
    this as an explicit evidence gap.

treatments:
- name: Implantable Cardioverter-Defibrillator
  description: >-
    The signature intervention in this disease. Because sudden death risk tracks
    the conduction and arrhythmic phenotype rather than ejection fraction, a
    defibrillator is preferred over a pacemaker for every pacing indication in an
    LMNA carrier, and implantation is considered at ejection fractions that would
    not warrant a device in non-genetic dilated cardiomyopathy. Candidate
    selection is guided by the gene-specific risk factors and the LMNA-risk VTA
    model rather than by an EF threshold alone.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Malignant Ventricular Arrhythmia
    treatment_effect: INHIBITS
    description: >-
      The device does not modify the arrhythmogenic substrate; it terminates the
      ventricular tachyarrhythmia arising on it, interrupting the path from
      substrate to sudden death.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because risk for sudden cardiac death in LMNA-related DCM accompanies heart
      block and bradyarrhythmias, ICD use (rather than just pacemaker use) has
      been recommended for all indications.
    explanation: >-
      The gene-specific device recommendation, stated in GeneReviews management
      guidance.
  - reference: PMID:22281253
    reference_title: Risk factors for malignant ventricular arrhythmias in lamin a/c mutation carriers a European cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carriers of LMNA mutations with a high risk of MVA can be identified using
      these risk factors. This facilitates selection of LMNA mutation carriers
      who are most likely to benefit from an ICD.
    explanation: >-
      Supports risk-factor-based rather than EF-based selection of ICD
      candidates.
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Implantable cardioverter-defibrillators were placed in 59% of patients for
      new LVD or AVB.
    explanation: >-
      Documents real-world device use and its indications in an LMNA cohort.
- name: Permanent Pacing
  description: >-
    Symptomatic bradyarrhythmia or high-grade heart block requires pacing. In
    practice this is delivered as part of a defibrillator system rather than a
    pacemaker alone, because the same patients carry a sudden-death risk that a
    pacemaker does not address.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Pacemaker placement
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_mechanisms:
  - target: Cardiac Conduction System Degeneration
    treatment_effect: BYPASSES
    description: >-
      Pacing substitutes for failed impulse generation and conduction; it does
      not slow the degeneration of the conduction tissue itself.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic supraventricular arrhythmias are usually treated with
      pharmacologic therapy or ablation; symptomatic bradyarrhythmias or
      significant heart block is treated with an electronic pacemaker.
    explanation: >-
      States the pacing indication in GeneReviews management guidance.
- name: Early Cardiac Resynchronization Therapy
  description: >-
    An emerging, weakly evidenced deviation from standard practice. Because
    LMNA carriers frequently need pacing before their QRS widens, and
    right-ventricular pacing itself is dyssynchronising, one small comparative
    series implanted CRT-D rather than a conventional device in carriers with a
    narrow QRS who already had a pacemaker or ICD indication. Over 7.2 years none
    of the five CRT patients reached the composite of transplantation, death from
    end-stage heart failure or ventricular tachycardia ablation, versus three of
    five without. With ten patients and no randomisation this is hypothesis
    generating, not practice defining.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Cardiac resynchronization therapy
    term:
      id: NCIT:C80436
      label: Cardiac Resynchronization Therapy
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Biventricular pacing is intended to avoid pacing-induced dyssynchrony and
      so slow the decline in ejection fraction, rather than to act on the lamina
      defect.
  evidence:
  - reference: PMID:38495409
    reference_title: The role of early cardiac resynchronization therapy implantation in dilated cardiomyopathy patients with narrow QRS carrying lamin A/C mutation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of ten LMNA DCM patients (age 51±10 years, QRS 96±14 msec, EF 55±7%) with
      indication for pacemaker or ICD implantation, five underwent early CRT-D
      implantation. After 7.2±4 years, three patients (60%) in the non-CRT group
      reached the primary outcome, compared to no patients in the CRT group
      (P=0.046).
    explanation: >-
      The comparative outcome data. PARTIAL because ten patients, non-randomised
      and retrospectively compared, cannot establish efficacy however suggestive
      the separation.
  notes: >-
    Not a guideline recommendation. Curated because it is the only reported
    attempt to modify this disease's course with device programming rather than
    drugs, and because the rationale - avoiding pacing-induced dyssynchrony in a
    population that is paced early - is specific to LMNA rather than generic
    heart failure practice.
- name: Catheter Ablation for Symptomatic Supraventricular Arrhythmia
  description: >-
    Symptomatic supraventricular arrhythmias are managed with antiarrhythmic
    drugs or ablation, and chronic atrial fibrillation is first addressed by
    attempting to restore sinus rhythm along with rate control and
    anticoagulation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac ablation
    term:
      id: NCIT:C100068
      label: Cardiac Ablation
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic supraventricular arrhythmias are usually treated with
      pharmacologic therapy or ablation; symptomatic bradyarrhythmias or
      significant heart block is treated with an electronic pacemaker.
    explanation: >-
      States the management of symptomatic supraventricular arrhythmia in
      GeneReviews management guidance.
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard heart failure therapy - ACE inhibitors or angiotensin receptor
    blockers, beta blockers, mineralocorticoid receptor antagonists, and
    contemporary additions such as sacubitril/valsartan and SGLT2 inhibitors - is
    applied as in other dilated cardiomyopathies. There is no LMNA-specific
    medical regimen, and the natural history data suggest medical therapy alone
    is insufficient in this genotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: SGLT2 inhibitor
      term:
        id: NCIT:C98083
        label: SGLT2 Inhibitor
    - preferred_term: sacubitril
      term:
        id: NCIT:C152281
        label: Sacubitril
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Neurohormonal blockade slows adverse remodeling and improves symptoms and
      survival in dilated cardiomyopathy generally; it is applied here for the
      same reason.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of symptomatic DCM, including heart failure, is pharmacologic
      with ACE inhibitors, beta blockers, and other conventional approaches.
    explanation: >-
      GeneReviews statement of the medical regimen used in this disease.
  notes: >-
    Rate-slowing agents (beta blockers, non-dihydropyridine calcium channel
    blockers) must be used with awareness of the underlying conduction disease;
    device backup is often already in place in this population for the
    independent sudden-death indication.

    No pathophysiology node conforms to
    `cardiomyopathy_maladaptive_remodeling#Neurohormonal Activation`, which is
    the module node these drugs actually act on. That is deliberate: no source in
    this entry evidences renin-angiotensin-aldosterone or sympathetic activation
    specifically in LMNA carriers, as distinct from dilated cardiomyopathy in
    general, so the amplifier node is left unclaimed rather than asserted by
    analogy. This link therefore attaches to the contractile-dysfunction node it
    is intended to slow.
- name: Anticoagulation
  description: >-
    Anticoagulation is indicated for atrial fibrillation and for left ventricular
    mural thrombus, both of which are common in this disease and both of which
    can present as systemic embolism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant agent
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  target_mechanisms:
  - target: Intracardiac Thrombus Formation
    treatment_effect: INHIBITS
    description: >-
      Anticoagulation acts on the coagulation arm of thrombus formation,
      preventing the mural or atrial thrombus rather than altering the stasis
      that predisposes to it.
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic atrial fibrillation is treated initially with attempts to restore
      normal sinus rhythm, anticoagulation, and rate control.
    explanation: >-
      States the anticoagulation indication for atrial fibrillation in this
      disease.
- name: Heart Transplantation
  description: >-
    Transplantation, and mechanical circulatory support as a bridge, is required
    for refractory heart failure and is needed frequently and at a young age in
    this population - about one in five carriers in longitudinal follow-up.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Progressive Heart Failure and End-Stage Disease
    treatment_effect: BYPASSES
    description: >-
      Replaces the failing organ; the systemic genetic defect persists but the
      target tissue is removed.
  evidence:
  - reference: PMID:29095976
    reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heart transplantation was performed in 15 of 79 (19%) LMNA patients during
      7.8 ± 6.3 years of follow-up.
    explanation: >-
      Quantifies transplantation frequency in a followed LMNA cohort.
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac transplantation or other advanced therapies may be considered for
      refractory disease in persons receiving comprehensive care from
      cardiovascular disease experts.
    explanation: >-
      States the indication for advanced therapy in GeneReviews management
      guidance.
- name: Cardiovascular Surveillance of Genotype-Positive Relatives
  description: >-
    Because the phenotype converts at roughly 9% per year and sudden death can be
    the first event, asymptomatic carriers are followed rather than reassured:
    history, examination, ECG and echocardiography every one to two years, moving
    to at least annual ECG, ambulatory monitoring and ventricular function
    assessment once any ECG abnormality appears, with immediate evaluation for
    new symptoms.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asymptomatic individuals with a pathogenic LMNA variant should undergo
      cardiovascular evaluation (medical history, physical examination,
      echocardiogram, and EKG) every one to two years and/or whenever new
      symptoms arise.
    explanation: >-
      The surveillance interval for asymptomatic carriers from GeneReviews.
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In families with a known LMNA pathogenic variant, at-risk individuals for
      whom genetic testing is not possible should have yearly cardiovascular
      evaluation.
    explanation: >-
      Covers at-risk relatives who cannot be genotyped, who are followed rather
      than discharged.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Autosomal dominant transmission with a 50% recurrence risk per child,
    age-dependent penetrance and variable expressivity make counselling central.
    Once a familial variant is identified, targeted testing of relatives directs
    who needs lifelong surveillance and who can be discharged. Pregnancy is
    contraindicated in women with established dilated cardiomyopathy, and at-risk
    women of unknown genotype should be evaluated and counselled ideally before
    conceiving.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To facilitate prompt diagnosis, targeted LMNA genetic testing when the
      family-specific pathogenic variant is known; otherwise regular surveillance
      with cardiovascular screening tests.
    explanation: >-
      States the cascade-testing strategy for relatives at risk.
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy is contraindicated in women with DCM. Pregnant women with DCM
      should be followed by a high-risk obstetrician.
    explanation: >-
      Records the reproductive safety warning from the GeneReviews management
      section, which belongs with counselling rather than with a drug.
- name: ARRY-371797 (p38 MAPK Inhibitor)
  description: >-
    The only disease-specific targeted therapy taken to phase 3 in CMD1A, built
    on the observation that mutant lamins activate p38 MAPK signalling. Phase 2
    data showed an improved six-minute walk distance sustained to 144 weeks, but
    the phase 3 REALM-DCM trial was stopped for futility at a planned interim
    analysis with no significant difference on any outcome at week 24 and no
    safety signal. It is recorded here as a negative result that constrains the
    signalling hypothesis, not as an available treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: MAPK Cascade Activation
    treatment_effect: INHIBITS
    description: >-
      Selective p38-alpha MAPK inhibition was intended to interrupt the MAPK arm
      of this node. The phase 3 failure means the intended mechanism was not
      shown to translate into clinical benefit.
    evidence:
    - reference: PMID:38979608
      reference_title: "REALM-DCM: A Phase 3, Multinational, Randomized, Placebo-Controlled Trial of ARRY-371797 in Patients With Symptomatic LMNA-Related Dilated Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In a phase 2 trial and long-term extension, the selective p38α MAPK
        (mitogen-activated protein kinase) inhibitor, ARRY-371797 (PF-07265803),
        was associated with an improved 6-minute walk test at 12 weeks, which was
        preserved over 144 weeks.
      explanation: >-
        Identifies the drug's molecular target as p38-alpha MAPK, which is what
        links it to this pathophysiology node.
  evidence:
  - reference: PMID:38979608
    reference_title: "REALM-DCM: A Phase 3, Multinational, Randomized, Placebo-Controlled Trial of ARRY-371797 in Patients With Symptomatic LMNA-Related Dilated Cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      REALM-DCM was terminated after a planned interim analysis suggested
      futility.
    explanation: >-
      The phase 3 trial of this agent was stopped for futility, so it refutes
      clinical efficacy in symptomatic LMNA-related dilated cardiomyopathy.
  - reference: PMID:38979608
    reference_title: "REALM-DCM: A Phase 3, Multinational, Randomized, Placebo-Controlled Trial of ARRY-371797 in Patients With Symptomatic LMNA-Related Dilated Cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No significant differences (P>0.05) between groups were observed in the
      change from baseline at week 24 for all outcomes
    explanation: >-
      The primary and secondary endpoint results underlying the futility
      determination.
  - reference: PMID:36114020
    reference_title: Long-Term Efficacy and Safety of ARRY-371797 (PF-07265803) in Patients With Lamin A/C-Related Dilated Cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ARRY-371797 (PF-07265803), a potent, selective, oral, small-molecule
      inhibitor of the p38α mitogen-activated protein kinase pathway, improved
      6-minute walk test (6MWT) distance in 12 patients with symptomatic
      LMNA-related DCM in a 48-week, open-label, phase 2 study.
    explanation: >-
      The open-label phase 2 signal that justified the phase 3 trial. PARTIAL
      because an uncontrolled 12-patient study on a walk-test endpoint is a weak
      efficacy claim, and the controlled phase 3 subsequently found no effect.
- name: LOXL2 Inhibition (Simtuzumab)
  description: >-
    A preclinical, not clinical, candidate. LOXL2 is upregulated in LMNA-mutant
    human iPSC cardiomyocytes, engineered heart tissue and mice, and the LOXL2
    antibody simtuzumab prevented cardiac dysfunction and fibrosis in the mouse
    model. There is no human trial in this disease, so this is recorded as a
    mechanism-derived candidate targeting the fibrotic arm rather than as
    therapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Cardiomyocyte Loss and Myocardial Fibrosis
    treatment_effect: INHIBITS
    description: >-
      Antibody blockade of LOXL2 interrupts the extracellular matrix
      cross-linking arm of the remodeling node.
    evidence:
    - reference: PMID:41841259
      reference_title: Simtuzumab Attenuates Loxl2-Mediated Extracellular Matrix Remodeling and Preserves Cardiac Function in LMNA Mutation-Induced Dilated Cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Treatment with Simtuzumab, a Loxl2 inhibitor, effectively prevented
        cardiac dysfunction and fibrosis in vivo.
      explanation: >-
        The in-vivo rescue linking LOXL2 inhibition to the fibrosis and
        dysfunction node.
  evidence:
  - reference: PMID:41841259
    reference_title: Simtuzumab Attenuates Loxl2-Mediated Extracellular Matrix Remodeling and Preserves Cardiac Function in LMNA Mutation-Induced Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptomic analysis revealed dysregulation of extracellular matrix
      remodeling and significant upregulation of Loxl2 in mutated
      hiPSC-cardiomyocytes, hiPSC-engineered heart tissues, and mice.
    explanation: >-
      Establishes the target's upregulation in the human-cell and mouse systems
      that motivated the intervention.
  notes: >-
    Preclinical only. No clinical trial of LOXL2 inhibition in LMNA-related
    dilated cardiomyopathy has been reported; simtuzumab failed in other
    fibrotic indications, so translation should not be assumed.

    `therapeutic_agent` is deliberately empty despite the agent being named.
    NCIT:C91735 (Simtuzumab) exists but is not reachable from the
    ChemicalEntityTerm dynamic-enum roots, so binding it fails term validation;
    CHEBI has no simtuzumab entry either. Leaving the slot unbound is preferred
    to forcing a less accurate agent term.

clinical_trials:

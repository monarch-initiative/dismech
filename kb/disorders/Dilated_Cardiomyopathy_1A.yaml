name: Dilated Cardiomyopathy 1A
creation_date: "2026-08-18T00:00:00Z"
synonyms:
- CMD1A
- CDCD1
- LMNA familial isolated dilated cardiomyopathy
- LMNA-related dilated cardiomyopathy
- familial dilated cardiomyopathy with conduction defect due to LMNA mutation
- cardiomyopathy, dilated, type 1A
description: >-
  Dilated cardiomyopathy 1A (CMD1A) is the LMNA-related form of familial dilated
  cardiomyopathy, caused by heterozygous pathogenic variants in LMNA, which
  encodes the A-type nuclear lamins A and C by alternative splicing of a single
  transcript. A-type lamins polymerize into the nuclear lamina underlying the
  inner nuclear membrane, where they confer nuclear mechanical stability, anchor
  the LINC complex that couples the nucleus to the contractile cytoskeleton, and
  tether peripheral heterochromatin. What distinguishes CMD1A from most other
  genetic dilated cardiomyopathies is its clinical sequence: progressive
  conduction system disease (PR prolongation, atrioventricular block, sinus node
  dysfunction) and atrial arrhythmia typically appear first, often years before
  left ventricular dilation and systolic dysfunction, and malignant ventricular
  arrhythmia and sudden cardiac death may occur while the ejection fraction is
  still only mildly impaired. This decoupling of arrhythmic risk from the degree
  of systolic dysfunction is the reason management is genotype-directed rather
  than ejection-fraction-directed, with implantable cardioverter-defibrillator
  rather than pacemaker therapy recommended when a pacing indication arises.
  Mechanistically the disorder is understood as convergence of a mechanical arm
  (a fragile nuclear envelope that ruptures under cytoskeletal force, provoking
  DNA damage, cGAS/STING innate-immune signalling and MAPK stress-kinase
  activation) and a gene-regulatory arm (disrupted lamina-chromatin tethering);
  the relative primacy of the two is an open question, and a genome-wide chromatin
  conformation study in patient iPSC-cardiomyocytes argued against global
  compartmentation error being the primary driver. CMD1A sits within a broad LMNA
  allelic series that also includes Emery-Dreifuss and limb-girdle muscular
  dystrophy, familial partial lipodystrophy, and Hutchinson-Gilford progeria;
  skeletal muscle involvement in CMD1A ranges from absent to a mild limb-girdle
  pattern with modest creatine kinase elevation. Prognosis is worse than for
  other common dilated cardiomyopathies, with roughly a fifth to a quarter of
  affected individuals progressing to heart transplantation, and the first phase 3
  disease-modifying trial (REALM-DCM, the p38alpha inhibitor ARRY-371797) was
  stopped for futility, so an unmet treatment need remains.

      Characterised by progressive conduction system disease, arrhythmia and
      systolic impairment, lamin A/C heart disease is more malignant than other
      common DCMs due to high event rates even when the left ventricular
      impairment is mild.
    explanation: >-
      Frames the excess arrhythmic risk relative to other dilated
      cardiomyopathies at mild degrees of ventricular impairment. Evidence source
      is OTHER because this is a narrative review.
  downstream:
  - target: Ventricular Remodeling and Left Ventricular Systolic Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Ventricular Remodeling and Left Ventricular Systolic Dysfunction
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Progressive cardiomyocyte loss, fibrosis and neurohormonal activation produce
    left ventricular chamber dilation with falling ejection fraction, the
    structural stage of the disease. Longitudinal cohort data show this stage
    accrues over follow-up rather than being present at diagnosis in most
    carriers: left ventricular dysfunction rose from 44% at index evaluation to
    57% at median follow-up in one multicenter series. The equivalent chamber
    dilation and hypokinesia with conduction defects is reproduced in the Lmna
    H222P knock-in mouse.
  locations:
  - preferred_term: Cardiac ventricle
    term:
      id: UBERON:0002082
      label: cardiac ventricle
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of clinical manifestations increased broadly from index
      evaluation to median follow-up: AVB, 46% to 57%; AA, 39% to 63%; VA, 16% to
      34%; and LVD, 44% to 57%.
    explanation: >-
      Quantifies progressive accrual of left ventricular dysfunction alongside the
      electrical manifestations over long-term follow-up.
  - reference: PMID:15548545
    reference_title: Mouse model carrying H222P-Lmna mutation develops muscular dystrophy and dilated cardiomyopathy similar to human striated muscle laminopathies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As for cardiac phenotype, they develop chamber dilation and hypokinesia
      with conduction defects.
    explanation: >-
      Model-organism recapitulation of the combined dilation, hypokinesia and
      conduction phenotype.
  downstream:
  - target: Progressive Heart Failure and End-Stage Disease
    causal_link_type: DIRECT
- name: Progressive Heart Failure and End-Stage Disease
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The terminal stage is refractory heart failure requiring advanced therapy.
    CMD1A reaches this endpoint more often and at a younger age than other dilated
    cardiomyopathies: roughly one fifth of genotype-positive patients in a national
    cohort underwent heart transplantation within about eight years of follow-up,
    and review-level series place the figure at about a quarter of symptomatic
    patients. Left ventricular mural thrombus with systemic embolism is an
    additional route to morbidity.
  evidence:
  - reference: PMID:29095976
    reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heart transplantation was performed in 15 of 79 (19%) LMNA patients during
      7.8 ± 6.3 years of follow-up.
    explanation: >-
      Quantifies progression to transplantation in a prospectively followed
      national LMNA cohort.
  - reference: PMID:37659618
    reference_title: "LMNA Cardiomyopathy: Important Considerations for the Heart Failure Clinician."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among symptomatic patients with LMNA-CM, approximately one-quarter of
      individuals progress to needing advanced heart failure therapies such as
      heart transplantation.
    explanation: >-
      Independent estimate of the proportion reaching advanced heart failure
      therapy.

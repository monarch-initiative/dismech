- name: MAPK Stress-Kinase Cascade Activation
  biological_scale: MOLECULAR
  role: intermediate
  description: >-
    Mutant A-type lamins activate the ERK1/2, JNK and p38 branches of the MAPK
    cascade in cardiomyocytes. The timing is the key evidence: in Lmna H222P
    knock-in mice, MAPK activation is detectable before clinical signs or even
    molecular markers of cardiomyopathy appear, placing it upstream of the
    phenotype rather than downstream of established heart failure. The same
    signature is seen in emerin-null mice, indicating a shared nuclear-envelope
    disease pathway. Systemic inhibition of ERK activation delays left ventricular
    dilatation in this model, and this line of reasoning is what motivated the
    p38alpha inhibitor clinical programme.

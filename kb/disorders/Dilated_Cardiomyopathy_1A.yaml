- category: Cardiac
  name: Atrial Fibrillation
  frequency: FREQUENT
  description: >-
    Atrial arrhythmia - most often atrial fibrillation, also flutter and other
    supraventricular tachycardias - is common and often early, carrying both a
    thromboembolic risk requiring anticoagulation and, in some carriers,
    progression to atrial standstill.
  phenotype_term:
    preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  evidence:
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.

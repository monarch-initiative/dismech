      recognised presenting manifestation rather than a late complication.
  - reference: PMID:40689545
    reference_title: Variant-Specific Late Gadolinium Enhancement Patterns Influence Clinical Outcomes in LMNA-Related Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with clinically manifest disease (76/116), those with
      IgD-localizing variants had a lower prevalence of atrioventricular block
      (25% versus 72%, P=0.002) and atrial fibrillation (50% versus 81%, P=0.019)
      but higher rates of thromboembolic events (42% versus 16%, P=0.038).
    explanation: >-
      Quantifies thromboembolic events in a genotyped cohort. Note the
      dissociation it reports: the higher-risk group had *less* atrial
      fibrillation, so atrial stasis cannot be the whole explanation and the
      ventricular contribution is doing real work.
- name: Progressive Heart Failure and End-Stage Disease
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  biological_scale: ORGANISM
  role: consequence
  description: >-
    One of the disease's two exits. Pump failure progresses to end-stage disease
    requiring mechanical support or transplantation in around a fifth of carriers
    followed long term, and survival is materially worse than in non-LMNA dilated
    cardiomyopathy: event-free survival at age 45 was 31% in carriers versus 75%
    in non-carrier DCM patients.
  locations:
  - preferred_term: Heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: Heart contraction
    term:
      id: GO:0060047
      label: heart contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12628721
    reference_title: Natural history of dilated cardiomyopathy due to lamin A/C gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LMNA mutation carriers had a significantly poorer cumulative survival
      compared with non-carrier DCM patients: event-free survival at the age of
      45 years was 31% versus 75% in non-carriers.
    explanation: >-
      Direct comparison establishing the worse natural history of LMNA-related
      DCM against other dilated cardiomyopathy.
  - reference: PMID:29095976
    reference_title: "Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for heart transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heart transplantation was performed in 15 of 79 (19%) LMNA patients during
      7.8 ± 6.3 years of follow-up.
    explanation: >-
      Quantifies the transplantation burden that defines this end state.
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      End-stage HF developed in 19% of patients, and 13% died.
    explanation: >-
      Independent cohort giving concordant end-stage heart failure and mortality
      figures.
- name: Sudden Cardiac Death
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The disease's other exit, and the one that can come first. Arrhythmic death
    may be the presenting event, before heart failure and sometimes before any
    detectable systolic impairment. Keeping it as a node distinct from the heart
    failure end state is what the pathograph needs in order to represent a
    disease in which the two exits are not sequential.
  locations:
  - preferred_term: Heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:20301717
    reference_title: LMNA-Related Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sudden cardiac death can occur, and in some instances is the presenting
      manifestation; sudden cardiac death may occur with minimal or no systolic
      dysfunction.
    explanation: >-
      Establishes that this exit is reachable without passing through the heart
      failure end state.
  - reference: PMID:22281253
    reference_title: Risk factors for malignant ventricular arrhythmias in lamin a/c mutation carriers a European cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a median follow-up period of 43 months (interquartile range: 17 to 101
      months), 48 (18%) persons experienced a first episode of MVA: 11 persons
      received successful cardiopulmonary resuscitation, 25 received appropriate
      ICD treatment, and 12 persons died suddenly.
    explanation: >-
      Quantifies malignant arrhythmic events, including 12 sudden deaths, in a
      269-carrier cohort over a median 43 months.

phenotypes:
- category: Cardiac
  name: Cardiac Conduction Abnormality
  frequency: VERY_FREQUENT
  description: >-
    Disease of the specialised conduction tissue is the earliest and most
    consistent manifestation, and in most carriers it precedes structural
    disease. It spans sinus node dysfunction and sinus bradycardia through
    first-, second- and third-degree atrioventricular block. Because the same
    lesion carries a high sudden-death risk, symptomatic block in a carrier is an
    indication for a defibrillator rather than a pacemaker alone.
  phenotype_term:
    preferred_term: Cardiac conduction abnormality
    term:
      id: HP:0031546
      label: Cardiac conduction abnormality
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:29237675
    reference_title: Gene-Based Risk Stratification for Cardiac Disorders in LMNA Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 77 carriers, 71 (92%) were phenotypically affected and showed
      cardiac conduction disturbance (81%), low left ventricular ejection
      fraction (<50%; 45%), atrial arrhythmias (58%), and malignant ventricular
      arrhythmias (26%).
    explanation: >-
      Reports conduction disturbance in 81% of genotyped carriers, supporting the
      VERY_FREQUENT band (80-99%). The figure sits just inside the band boundary
      and comes from a single 77-carrier cohort; the other cohort in this entry
      reports atrioventricular block alone at 46-57%, which is a narrower finding
      than "conduction abnormality" and is curated separately below.
  - reference: PMID:10580070
    reference_title: Missense mutations in the rod domain of the lamin A/C gene as causes of dilated cardiomyopathy and conduction-system disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each mutation caused heritable, progressive conduction-system disease
      (sinus bradycardia, atrioventricular conduction block, or atrial
      arrhythmias) and dilated cardiomyopathy.
    explanation: >-
      Supports the progressive clinical course qualifier and the range of
      conduction abnormalities seen.
- category: Cardiac
  name: Atrioventricular Block
  description: >-
    Progressive atrioventricular block, from PR prolongation through complete
    heart block, is the single most characteristic electrical finding. Its
    presence in a dilated cardiomyopathy proband substantially raises the
    pre-test probability of an LMNA variant, and it is one of the predictors in
    the validated arrhythmic risk model.
  phenotype_term:
    preferred_term: Atrioventricular block
    term:
      id: HP:0001678
      label: Atrioventricular block
    clinical_course: PROGRESSIVE
  diagnostic: true
  evidence:
  - reference: PMID:11897440
    reference_title: "Autosomal dominant dilated cardiomyopathy with atrioventricular block: a lamin A/C defect-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LMNA gene mutations account for 33% of the DCMs with AVB, all familial
      autosomal dominant.
    explanation: >-
      Supports the diagnostic value of atrioventricular block in selecting DCM
      patients for LMNA testing.
  - reference: PMID:27884249
    reference_title: Long-Term Arrhythmic and Nonarrhythmic Outcomes of Lamin A/C Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of clinical manifestations increased broadly from index
      evaluation to median follow-up: AVB, 46% to 57%; AA, 39% to 63%; VA, 16% to
      34%; and LVD, 44% to 57%.
    explanation: >-
      Documents both the prevalence of atrioventricular block and its progression
      over long-term follow-up.
- category: Cardiac
  name: Sinus Bradycardia and Sinus Node Dysfunction
  description: >-
    Sinus node disease with bradycardia is part of the early electrical
    phenotype and may be the first abnormality on a screening ECG in an otherwise
    asymptomatic carrier.
  phenotype_term:
    preferred_term: Sinus bradycardia
    term:
      id: HP:0001688
      label: Sinus bradycardia
  evidence:
  - reference: PMID:10580070
    reference_title: Missense mutations in the rod domain of the lamin A/C gene as causes of dilated cardiomyopathy and conduction-system disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each mutation caused heritable, progressive conduction-system disease
      (sinus bradycardia, atrioventricular conduction block, or atrial
      arrhythmias) and dilated cardiomyopathy.
    explanation: >-
      Names sinus bradycardia explicitly among the conduction-system

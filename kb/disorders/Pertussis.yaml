- accession: geo:GSE324217
  title: A dual role for PGLYRP1 in host defense and immune regulation during B. pertussis infection
  description: Bordetella pertussis, the etiologic agent of whooping cough, remains a serious public health concern despite widespread vaccination. Improved therapeutics and vaccines are urgently needed to treat and prevent pertussis disease. Host recognition of bacterial peptidoglycan (PGN), including B. pertussis extracellular PGN fragment tracheal cytotoxin (TCT), shapes the immune response to infection. Peptidoglycan recognition proteins (PGLYRPs) are a conserved family of innate immune molecules which bind bacterial PGN. While they function as immune signaling receptors in arthropods, PGLYRPs in mammals have thus far been primarily recognized for their bactericidal activity.

treatments:
- name: Azithromycin
  description: >
    Macrolide antibiotic that binds the 50S bacterial ribosome and inhibits protein
    synthesis; the conventional antibiotic for pertussis, primarily reducing
    transmissibility. Emerging macrolide-resistant B. pertussis in some regions can
    necessitate alternatives such as trimethoprim-sulfamethoxazole.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  target_mechanisms:
  - target: Bacterial Ribosomal Translation (Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin binds the 50S ribosome and arrests B. pertussis protein
      synthesis, clearing carriage and reducing transmission.
  evidence:
  - reference: DOI:10.3390/toxins14030187
    reference_title: "Novel Strategies to Inhibit Pertussis Toxin"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      antibiotics only reduce symptoms if administered in early stages, which
      rarely occurs due to a late diagnosis.
    explanation: >-
      Explains that macrolide antibiotics reduce symptoms only if given early
      (catarrhal stage); once the paroxysmal cough is established the benefit is
      largely limited to reducing transmission. Evidence source is OTHER as this is
      a review article.
- name: Pertussis Toxin Inhibitors (investigational)
  description: >
    Investigational host-directed and toxin-neutralizing strategies aimed at
    pertussis toxin — chaperone inhibitors, human peptides, small-molecule
    inhibitors, and humanized neutralizing antibodies — intended to address the
    toxin-driven symptoms (e.g., leukocytosis) for which no causative treatment
    currently exists.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Pertussis Toxin-Mediated Disruption of Host Gi Signaling
    treatment_effect: INHIBITS
    description: >-
      These agents inhibit or neutralize pertussis toxin, the AB5 exotoxin that
      ADP-ribosylates Gαi.
  evidence:
  - reference: DOI:10.3390/toxins14030187
    reference_title: "Novel Strategies to Inhibit Pertussis Toxin"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      chaperone inhibitors, human peptides, small molecule inhibitors, and
      humanized antibodies are discussed as novel strategies to inhibit PT.
    explanation: >-
      Review enumerating the novel pharmacological strategies under development to
      inhibit pertussis toxin. Evidence source is OTHER as this is a review of
      investigational strategies.
- name: Maternal Tdap Vaccination
  description: >
    Maternal acellular pertussis (Tdap/dTpa) vaccination during pregnancy
    (near the third trimester) protects young infants through transplacental
    transfer of pertussis-specific antibodies, bridging the vulnerable window
    before the infant primary series takes effect.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: maternal pertussis vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: DOI:10.1542/peds.2023-062664
    reference_title: "Maternal Pertussis Vaccination, Infant Immunization, and Risk of Pertussis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was associated with lower risk of infection among infants through 8 months
      of age.
    explanation: >-
      Population-based cohort of 279,418 mother-infant pairs showing maternal
      pertussis vaccination near 28 weeks' gestation lowered infant infection risk
      through 8 months of age. Evidence source is HUMAN_CLINICAL as this is a
      population-based cohort study.
- name: Pertussis Vaccination
  description: >
    Acellular pertussis vaccination (DTaP in infants/children, Tdap boosters
    including maternal immunization) is the key strategy for preventing severe
    pertussis, particularly in young infants.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:41963827
    reference_title: Clinical epidemiological characteristics and risk factors for severe pertussis in children in Xiamen.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      timely completion of the primary pertussis vaccination series in infants
      remains a key strategy for preventing severe pertussis
    explanation: >-
      The cohort concludes that timely primary pertussis vaccination is key to
      preventing severe disease. Evidence source is HUMAN_CLINICAL as this is a
      clinical cohort study.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: COMMON
  notes: >-
    A comprehensive review estimated ~16 million pertussis cases and 195,000 deaths
    globally in 2008, with sizeable outbreaks reported repeatedly since, and a
    shifting age profile in which older children and adolescents transmit to younger
    siblings. B. pertussis remains a leading cause of vaccine-preventable respiratory
    disease and is currently increasing worldwide (2023-2024 resurgence).
  evidence:
  - reference: PMID:27029594
    reference_title: "Pertussis: Microbiology, Disease, Treatment, and Prevention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in 2008, pertussis was associated with an estimated 16 million cases and
      195,000 deaths globally.
    explanation: >-
      Comprehensive review quantifying the global pertussis burden. Evidence source
      is OTHER as this is a review aggregating surveillance data.
  - reference: DOI:10.1128/cmr.00164-22
    reference_title: "Bordetella bronchiseptica and Bordetella pertussis: Similarities and Differences in Infection, Immuno-Modulation, and Vaccine Considerations"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These infections are restricted to humans and currently increasing worldwide.
    explanation: >-
      Establishes that human pertussis is currently increasing worldwide, supporting
      the resurgence context. Evidence source is OTHER as this is a review article.

- accession: geo:GSE310241
  title: Mucosal inflammation and pre-existing antibodies define protection and disease outcomes in human Bordetella pertussis challenge
  description: Whooping cough, caused by Bordetella pertussis (BP), persists despite widespread vaccination with acellular pertussis (aP) vaccines, which protect against disease but provide incomplete and short-lived immunity against infection and transmission. To define correlates of protection and mechanisms underlying symptom development, we characterized systemic and mucosal immune responses in a North American BP-controlled human infection model (CHIM). Healthy adults, primed in infancy with either whole-cell or aP vaccines, were intranasally challenged with escalating BP doses and classified as symptomatic, asymptomatic, or non-infected.

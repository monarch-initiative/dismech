pathophysiology:
- name: Heterozygous CTR9 Missense Variant
  description: A heterozygous germline missense variant in CTR9, de novo in most probands. The variants change residues in CTR9, the scaffold subunit of the PAF1 complex that binds RNA polymerase II.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: Germline, heterozygous, and de novo in most probands.
  genes:
  - *ctr9
  downstream:
  - target: Altered CTR9 Interactions Within the PAF1 Complex
    causal_link_type: DIRECT
    description: Structural modelling predicts that the variants disturb local CTR9 structure and its protein interactions, and two variants bound PAF1 more strongly than wild-type CTR9.
    evidence:
    - reference: PMID:35499524
      reference_title: "Heterozygous variants in CTR9, which encodes a major component of the PAF1 complex, are associated with a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: Three-dimensional modeling predicted a likely disruptive effect of the variants on local CTR9 structure and protein interaction.
      explanation: Modelling of the patient variants in the Pol II-DSIF-PAF-SPT6 and PAF1/CTR9 complex structures.
    - reference: PMID:35717577
      reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: A pull-down assay showed that the mutant CTR9 proteins had stronger affinities to the PAF1 protein than the wild-type protein.
      explanation: Two patient variants changed CTR9 binding to its PAF1C partner PAF1.
  evidence:
  - reference: PMID:35499524
    reference_title: "Heterozygous variants in CTR9, which encodes a major component of the PAF1 complex, are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe the clinical and molecular studies in 13 probands, harboring likely pathogenic CTR9 missense variants, collected through GeneMatcher.
    explanation: The disease-defining variants are heterozygous missense changes.
  - reference: PMID:35499524
    reference_title: "Heterozygous variants in CTR9, which encodes a major component of the PAF1 complex, are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For 11 CTR9 variants, de novo occurrence was shown.
    explanation: Most variants arose de novo.
- name: Altered CTR9 Interactions Within the PAF1 Complex
  description: CTR9 is the scaffold of the PAF1 complex (with PAF1, LEO1, CDC73 and RTF1), which associates with RNA polymerase II. The patient variants are predicted to disrupt CTR9's local structure and interactions, and the two variants tested bound PAF1 more strongly than wild-type protein. Mutant CTR9 interfered with endogenous ctr9 function in zebrafish, which is why ClinGen suggests a dominant-negative mechanism; this has not been tested further.
  biological_scale: MOLECULAR
  genes:
  - *ctr9
  molecular_functions:
  - preferred_term: CTR9/PAF1C binding to RNA polymerase II
    term:
      id: GO:0000993
      label: RNA polymerase II complex binding
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: PAF1 complex
    term:
      id: GO:0016593
      label: Cdc73/Paf1 complex
  downstream:
  - target: Impaired PAF1C-Coupled Transcription Elongation and Histone Methylation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: PAF1C couples RNA polymerase II elongation to H3K4 and H3K36 methylation. That the patient variants reduce these activities is inferred from the complex's function and from reduced H3K4me3 in the nervous system of Drosophila Ctr9 null mutants; it has not been measured for the patient variants, and patient fibroblasts showed no consistent change.
    evidence:
    - reference: PMID:35499524
      reference_title: "Heterozygous variants in CTR9, which encodes a major component of the PAF1 complex, are associated with a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We describe a neurodevelopmental disorder caused by (mainly) de novo variants in CTR9, likely affecting PAF1C function.
      directness: INDIRECT
      explanation: The authors conclude that the variants likely affect PAF1C function, without demonstrating which activity is lost.
    - reference: PMID:27520958
      reference_title: "Ctr9, a Key Component of the Paf1 Complex, Affects Proliferation and Terminal Differentiation in the Developing Drosophila Nervous System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We also found reduction of H3K4me3 modification in the embryonic nervous system.
      directness: INDIRECT
      explanation: Loss of Ctr9 in Drosophila reduces H3K4me3 in the embryonic nervous system; a null allele in a fly, not a patient missense variant.
  evidence:
  - reference: PMID:35717577
    reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A pull-down assay showed that the mutant CTR9 proteins had stronger affinities to the PAF1 protein than the wild-type protein.
    explanation: Altered binding of mutant CTR9 to PAF1.
  - reference: PMID:15632063
    reference_title: The parafibromin tumor suppressor protein is part of a human Paf1 complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: By purifying cellular parafibromin and characterizing its associated proteins, we have identified a human counterpart to the yeast Paf1 complex including homologs of Leo1, Paf1, and Ctr9.
    explanation: Establishes CTR9 as a subunit of the human PAF1 complex.
  - reference: CGGV:assertion_d392f595-9554-4bf9-8dfa-2baa71280565-2025-03-19T160000.000Z

    quote_role: REVIEW_SYNTHESIS
    explanation: ClinGen's reading of the functional evidence, with its caveat.
- name: Impaired PAF1C-Coupled Transcription Elongation and Histone Methylation
  description: The PAF1 complex associates with RNA polymerase II and promotes transcription elongation and transcription-coupled H3K4 and H3K36 methylation. Reduced PAF1C activity in the developing nervous system is the presumed link between the variants and abnormal brain development; it is inferred, not demonstrated for the patient variants.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: PAF1C-dependent transcription elongation by RNA polymerase II
    term:
      id: GO:0006368
      label: transcription elongation by RNA polymerase II
    modifier: DECREASED
  cellular_components:
  - preferred_term: PAF1 complex
    term:
      id: GO:0016593
      label: Cdc73/Paf1 complex
  downstream:
  - target: Abnormal Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of Ctr9 disturbs neurogenesis in Drosophila, with increased neuroblast numbers and nervous system overproliferation, and loss of ctr9 enlarges the telencephalon in zebrafish. Which PAF1C target genes mediate the effect is not known.
    evidence:
    - reference: PMID:27520958
      reference_title: "Ctr9, a Key Component of the Paf1 Complex, Affects Proliferation and Terminal Differentiation in the Developing Drosophila Nervous System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We observed a number of phenotypes in Ctr9 mutants, including increased neuroblast numbers, increased nervous system proliferation, as well as downregulation of many neuropeptide genes.
      directness: INDIRECT
      explanation: Ctr9 loss disturbs neural progenitor proliferation and neuronal differentiation in the fly.
    - reference: PMID:35717577
      reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Functional analyses using zebrafish showed that the knockout of the ctr9 gene caused motor defects and enlargement of the telencephalon, which is homologous to the mammalian cerebrum.
      directness: INDIRECT
      explanation: Loss of ctr9 in a vertebrate enlarges the forebrain.
  evidence:
  - reference: PMID:35499524
    reference_title: "Heterozygous variants in CTR9, which encodes a major component of the PAF1 complex, are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: It is involved in transcription-coupled histone modification through promoting H3K4 and H3K36 methylation.
    explanation: The normal function of CTR9 that the variants are presumed to impair.
  - reference: PMID:35717577
    reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: CTR9 is one of five genes that form the PAF1 complex, which binds to RNA polymerase II and plays critical roles in transcriptional elongation and transcription-coupled histone modifications including histones H3K4me3 and H3K36me3.
    explanation: The PAF1 complex functions in transcription elongation and transcription-coupled histone methylation.
  - reference: PMID:15632063
    reference_title: The parafibromin tumor suppressor protein is part of a human Paf1 complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Like the yeast complex, the parafibromin complex associates with the nonphosphorylated and Ser2 and Ser5 phosphorylated forms of the RNA polymerase II large subunit.
    explanation: The human PAF1 complex associates with RNA polymerase II.
- name: Abnormal Brain Development
  description: Disturbed development of the brain, the substrate of the cognitive, motor, speech and behavioural features. In zebrafish, loss of ctr9 or overexpression of patient-variant CTR9 enlarges the telencephalon, a counterpart of the macrocephaly seen in some patients. No human neuropathology or systematic brain imaging has been reported.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: brain development
    term:
      id: GO:0007420
      label: brain development
  locations:

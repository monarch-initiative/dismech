discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: ctr9_variant_functional_consequence
  prompt: Do the patient CTR9 missense variants reduce PAF1C-dependent transcription elongation or H3K4/H3K36 methylation in human neural cells, and do they act by loss of function or by dominant interference?
  rationale: The mechanism rests on structural modelling, a pull-down assay showing increased PAF1 binding for two variants, and zebrafish overexpression. H3K4/H3K36 methylation, mitochondrial quality and RNA-seq in fibroblasts from four patients did not show a consequence, and no neural cell model carrying a patient variant has been studied. ClinGen notes that the dominant-negative interpretation needs more functional work.
  attaches_to:
  - pathophysiology#Altered CTR9 Interactions Within the PAF1 Complex
  - pathophysiology#Impaired PAF1C-Coupled Transcription Elongation and Histone Methylation
  evidence:
  - reference: PMID:35499524
    reference_title: "Heterozygous variants in CTR9, which encodes a major component of the PAF1 complex, are associated with a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Additional studies in fibroblasts did not unveil the downstream functional consequences of the identified variants.
    explanation: The fibroblast studies were negative.
  - reference: CGGV:assertion_d392f595-9554-4bf9-8dfa-2baa71280565-2025-03-19T160000.000Z
    reference_title: "CTR9 / CTR9-related neurodevelopmental disorder (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mechanism of disease is suggested to be dominant negative (PMID: 35717577), but more functional studies are needed."
    explanation: ClinGen records the mechanism as unsettled.
  proposed_experiments:
  - experiment_id: ctr9_variant_neural_paf1c_activity
    name: PAF1C activity in neural cells carrying patient CTR9 variants
    description: Introduce recurrent patient variants (p.Pro25Arg, p.Glu376Lys) heterozygously into human induced pluripotent stem cells, differentiate them into neural progenitors and neurons, and compare PAF1C composition, RNA polymerase II elongation and H3K4me3/H3K36me3 profiles with isogenic controls and with heterozygous CTR9 null lines.
    readouts:
    - name: Genome-wide H3K4me3 and H3K36me3 over transcribed genes
      target: pathophysiology#Impaired PAF1C-Coupled Transcription Elongation and Histone Methylation
      direction: ALTERED
      interpretation: Shows whether the variants change PAF1C-coupled histone methylation in a disease-relevant cell type.
    would_support:
    - pathophysiology#Impaired PAF1C-Coupled Transcription Elongation and Histone Methylation
    supporting_outcome:
    - Variant lines show reduced elongation-coupled H3K4me3 or H3K36me3, more severe than heterozygous null lines if the variants act dominantly.
    refuting_outcome:
    - Variant neurons show no change in PAF1C composition, elongation or histone methylation, which would point to a different consequence of the variants.

  presence: Heterozygous missense variants, mostly de novo; ClinGen scores 17 unique missense variants in 20 probands, with p.Pro25Arg and p.Glu376Lys recurrent.
  notes: relationship_type is CAUSATIVE because the disease is defined by CTR9 variants; ClinGen's tier for the pair is Moderate, recorded in gene_disease_validity, and more probands are needed for a Strong or Definitive classification. CTR9 is highly constrained for missense and loss-of-function variation in gnomAD (missense Z 4.8, pLI 1, per the ClinGen summary). De novo truncating variants found in large autism and developmental-disorder cohorts were not scored by ClinGen because their contribution to the phenotype is unclear. Inherited germline truncating variants cause Wilms tumour predisposition without the neurodevelopmental phenotype and belong to a separate disease.

      reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In addition, the overexpression of human CTR9 mutant mRNA caused telencephalon enlargement in zebrafish larvae, suggesting that the human CTR9 mutant proteins interfered with normal endogenous CTR9 function.
      directness: INDIRECT
      explanation: Patient-variant CTR9 enlarges the zebrafish forebrain, the model counterpart of macrocephaly.
  - target: Motor Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: ctr9-knockout zebrafish have motor defects that patient-variant CTR9 fails to rescue.
    evidence:
    - reference: PMID:35717577
      reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The rescue experiment, in which the human CTR9 mutants were introduced into ctr9-knockout zebrafish, failed to maintain the swimming posture of the ctr9-knockout fish, suggesting that the human CTR9 mutant proteins do not function normally in vivo.
      directness: INDIRECT
      explanation: Motor defects in the fish model are not rescued by patient variants.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Intellectual disability is the core clinical consequence of the disturbed brain development; the cellular basis is not known.
    evidence:
    - reference: PMID:35717577
      reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We concluded that the two missense variants in CTR9 (p.(Glu15Asp) and p.(Pro25Arg)) cause a new syndrome involving macrocephaly, motor delay and intellectual disability through the loss of the normal function of CTR9 and the inhibition of the normal intrinsic CTR9 function of the contralateral allele.
      directness: INDIRECT
      explanation: The authors attribute macrocephaly, motor delay and intellectual disability to loss and inhibition of CTR9 function.

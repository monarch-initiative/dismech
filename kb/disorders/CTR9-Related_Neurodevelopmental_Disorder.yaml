    snippet: Functional analyses using zebrafish showed that the knockout of the ctr9 gene caused motor defects and enlargement of the telencephalon, which is homologous to the mammalian cerebrum.
    explanation: Abnormal forebrain development in a vertebrate ctr9 knockout.
  - reference: PMID:27520958
    reference_title: "Ctr9, a Key Component of the Paf1 Complex, Affects Proliferation and Terminal Differentiation in the Developing Drosophila Nervous System."

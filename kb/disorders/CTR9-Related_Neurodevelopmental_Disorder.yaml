      label: CTR9-related neurodevelopmental disorder
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: Primary disease term for this entry; MONDO defines it as the neurodevelopmental disorder caused by variation in CTR9, and the ClinGen gene-disease validity record uses the same term.
parents:
- Neurodevelopmental Disorder
description: An autosomal dominant neurodevelopmental disorder caused by heterozygous, mostly de novo missense variants in CTR9, which encodes a scaffold subunit of the PAF1 complex (PAF1C) that binds RNA polymerase II and couples transcription elongation to H3K4 and H3K36 methylation. Affected children have variable intellectual disability, motor and speech delay, hypotonia, joint hyperlaxity, coordination problems, tremor and autism spectrum disorder; macrocephaly, mild facial dysmorphism and cardiac anomalies are less frequent. The disorder was described in 2022 in a 13-proband series and a two-patient report, and ClinGen rates the gene-disease relationship Moderate. Structural modelling predicts that the variants disturb CTR9's local structure and its interactions within PAF1C, and two variants bound PAF1 more strongly than wild type and interfered with endogenous ctr9 function in zebrafish, which suggests a dominant-negative mechanism; studies in patient fibroblasts did not identify a downstream molecular consequence. Diagnosis is by exome sequencing. There is no disease-specific treatment.
notes: "Name. The MONDO and ClinGen label is \"CTR9-related neurodevelopmental disorder\"; it names the gene and covers exactly the disease the entry describes, so the entry takes it in title case with the gene symbol in HGNC case. MONDO records no synonyms and there is no OMIM phenotype entry. Lump or split. One gene, one MONDO term, no reported subtypes; a single disease entry. Germline CTR9 truncating variants also predispose to familial Wilms tumour (PMID:25099282) in carriers who do not have the neurodevelopmental phenotype. ClinGen curates that association separately, as a different phenotype and mechanism, and it is not part of this entry. GeneReviews. No GeneReviews chapter covers this disease: just check-genereviews --online, run on 2026-11-22 against the Bookshelf index snapshot of 2026-09-10 with a live PubMed search, returns only the Wilms Tumor Predisposition chapter (NBK1294) as a CTR9 candidate, and that chapter covers the separate tumour-predisposition disease. Phenotype baseline. Only the abstracts of the two defining papers (PMID:35499524, PMID:35717577) are available to the reference cache, so phenotype frequencies are not recorded: the 13-proband series reports its features only as common or less frequent in the abstract. The MONDO definition also lists fatigability, anxiety and aggressive behaviour, which come from the full text of the 2022 series and are not recorded here for lack of a quotable source. Mechanism. The chain from variant to altered PAF1C interactions rests on structural modelling and a pull-down assay; the step from there to abnormal brain development rests on zebrafish ctr9 knockout and mutant overexpression and on Drosophila Ctr9 mutants. Whether the patient variants actually reduce transcription elongation or H3K4/H3K36 methylation in human cells has not been shown, and the fibroblast studies were negative; this is recorded as a knowledge gap. No treatment is recorded because no source describes management specific to this disorder."

animal_models:
- name: ctr9 knockout zebrafish
  species: Zebrafish
  genotype: ctr9 knockout; also wild-type larvae overexpressing patient-variant human CTR9 mRNA
  publication: PMID:35717577
  description: ctr9-knockout zebrafish have motor defects and an enlarged telencephalon. Human CTR9 carrying p.(Glu15Asp) or p.(Pro25Arg) does not rescue the swimming posture of knockout fish, and overexpression of the mutant mRNA in wild-type larvae enlarges the telencephalon.
  modeled_mechanisms:
  - target: Abnormal Brain Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Knockout and mutant overexpression both enlarge the telencephalon, a counterpart of patient macrocephaly.
    limitations: The knockout is a complete loss of ctr9 rather than a heterozygous missense variant, and cognitive and social phenotypes cannot be assessed in larvae.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: Telencephalon size and swimming posture in larvae stand in for head size, motor development and intellectual function in children.
    evidence:
    - reference: PMID:35717577
      reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In addition, the overexpression of human CTR9 mutant mRNA caused telencephalon enlargement in zebrafish larvae, suggesting that the human CTR9 mutant proteins interfered with normal endogenous CTR9 function.
      explanation: Patient-variant CTR9 enlarges the zebrafish telencephalon.
  evidence:
  - reference: PMID:35717577
    reference_title: "De novo non-synonymous CTR9 variants are associated with motor delay and macrocephaly: human genetic and zebrafish experimental evidence."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Functional analyses using zebrafish showed that the knockout of the ctr9 gene caused motor defects and enlargement of the telencephalon, which is homologous to the mammalian cerebrum.
    explanation: Phenotype of the ctr9 knockout.
- name: Ctr9 mutant Drosophila
  species: Fruit fly
  genotype: Ctr9 loss-of-function mutant
  publication: PMID:27520958
  description: Ctr9 mutants die in late embryogenesis or early larval life and are partly rescued by re-expression of Ctr9 in the nervous system. They have increased neuroblast numbers, nervous system overproliferation, downregulated neuropeptide genes and reduced H3K4me3 in the embryonic nervous system.
  modeled_mechanisms:
  - target: Impaired PAF1C-Coupled Transcription Elongation and Histone Methylation
    relationship: MEASURES
    fidelity: LOW
    model_scale: ORGANISM
    description: H3K4me3 was measured in the embryonic nervous system of Ctr9 mutants.
    limitations: A homozygous loss-of-function allele in an invertebrate, not a heterozygous human missense variant.
    readouts:
    - name: H3K4me3 in the embryonic nervous system
      target: Impaired PAF1C-Coupled Transcription Elongation and Histone Methylation
      direction: DECREASED
      interpretation: Loss of Ctr9 reduces a PAF1C-dependent histone mark in neural tissue.
      evidence:
      - reference: PMID:27520958
        reference_title: "Ctr9, a Key Component of the Paf1 Complex, Affects Proliferation and Terminal Differentiation in the Developing Drosophila Nervous System."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We also found reduction of H3K4me3 modification in the embryonic nervous system.
        explanation: Reduced H3K4me3 in the Ctr9 mutant nervous system.
  - target: Abnormal Brain Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Abnormal neuroblast proliferation and neuronal terminal differentiation in Ctr9 mutants.
    limitations: A homozygous lethal loss-of-function allele in an invertebrate, whereas patients are heterozygous for missense variants; the fly nervous system has no cerebral cortex.
    evidence:
    - reference: PMID:27520958
      reference_title: "Ctr9, a Key Component of the Paf1 Complex, Affects Proliferation and Terminal Differentiation in the Developing Drosophila Nervous System."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We observed a number of phenotypes in Ctr9 mutants, including increased neuroblast numbers, increased nervous system proliferation, as well as downregulation of many neuropeptide genes.
      explanation: Disturbed nervous system development in the fly mutant.

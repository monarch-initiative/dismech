discussions:
- discussion_id: ppkwh_kank2_allele_specificity
  prompt: >-
    Why does KANK2 p.Ala670Val cause woolly hair and keratoderma, while other
    recessive KANK2 variants are reported with nephrotic syndrome and no skin
    phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#KANK2 Loss of Coactivator Sequestration
  rationale: >-
    The nephrotic-syndrome KANK2 variants were tested and did not disrupt the
    interaction with NCOA3 (SRC-3), whereas the skin variant is proposed to act
    through SRC sequestration. Whether the two phenotypes reflect separate
    functions of KANK2 is untested, and only one skin allele is known.
  evidence:
  - reference: PMID:25961457
    reference_title: "KANK deficiency leads to podocyte dysfunction and nephrotic syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      None of the KANK2 mutations identified in individuals with NS abrogated
      the interaction with NCOA3 (Supplemental Figure 9).
    explanation: >-
      Shows that the nephrotic-syndrome KANK2 alleles leave the
      coactivator interaction intact, which distinguishes them mechanistically
      from the keratoderma allele.
- discussion_id: ppkwh_unconfirmed_extracutaneous_features
  prompt: >-
    Are sensorineural hearing loss and maculopathy part of KANK2-related
    woolly hair-palmoplantar keratoderma syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#
  rationale: >-
    A single type IV case with these findings was diagnosed clinically and the
    report does not state that KANK2 was tested, so a separate disorder cannot
    be excluded.
  evidence:
  - reference: PMID:41818120
    reference_title: "Type 4 Woolly Hair-palmoplantar Keratoderma Syndrome with a Novel Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a 25-year-old woman with woolly hair, palmoplantar
      keratoderma without any cardiac morbidity. However, she had sensorineural
      hearing loss and maculopathy.
    explanation: >-
      Single case report of the extracutaneous findings in a clinically
      labelled type IV patient.

      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24671081
    reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two large consanguineous families with autosomal-recessive
      palmoplantar keratoderma and woolly hair, without cardiomyopathy and with
      no mutations in any known culprit gene.
    explanation: >-

treatments:
- name: Oral Acitretin with Topical Keratolytics
  description: >-
    Systemic retinoid therapy (acitretin 25 mg daily) combined with topical
    keratolytics, with liver function and lipid monitoring, was followed by
    marked improvement of the keratoderma within two months in one clinically
    diagnosed type IV patient. No KANK2-specific or controlled treatment data
    exist.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acitretin
      term:
        id: CHEBI:50172
        label: acitretin
  target_mechanisms:
  - target: Palmoplantar Keratoderma
  evidence:
  - reference: PMID:35283492
    reference_title: "Type 4 Woolly Hair-Palmoplantar Keratoderma Syndrome: A Rare Entity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkable improvement in palmoplantar keratoderma was noticed within 2
      months of oral acitretin therapy.
    explanation: >-
      Single-patient response to acitretin plus topical keratolytics. The
      patient was diagnosed clinically; KANK2 testing could not be done, so the
      response is not genotype-confirmed.

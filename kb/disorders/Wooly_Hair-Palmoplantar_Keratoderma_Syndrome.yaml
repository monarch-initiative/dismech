      hair-keratoderma phenotype.
pathophysiology:
- name: KANK2 Loss of Coactivator Sequestration
  description: >-
    The homozygous KANK2 p.Ala670Val missense variant alters SIP, an
    ankyrin-repeat protein that normally sequesters steroid receptor
    coactivators (SRCs) in the cytoplasm and so restrains transcriptional
    activation by steroid receptors, including the vitamin D receptor. The
    variant is predicted to abolish this sequestering ability; the precise
    molecular defect has not been demonstrated biochemically.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KANK2
    term:
      id: hgnc:29300
      label: KANK2
  molecular_functions:
  - preferred_term: protein sequestering activity
    term:
      id: GO:0140311
      label: protein sequestering activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24671081
    reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing, we identified a homozygous missense
      c.2009C>T mutation in KANK2 in the patients (p.Ala670Val).
    explanation: >-
      Identifies the initiating lesion, a homozygous KANK2 missense variant in
      affected family members.
  - reference: PMID:24671081
    reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      KANK2 encodes the steroid receptor coactivator (SRC)-interacting protein
      (SIP), an ankyrin repeat containing protein, which sequesters SRCs in the
      cytoplasm and controls transcription activation of steroid receptors,
      among others, also of the vitamin D receptor (VDR).
    explanation: >-
      States the normal cytoplasmic-sequestering function of SIP that the
      variant disrupts; this is the paper's summary of prior cell-based work,
      not its own result.
  - reference: PMID:24671081
    reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The mutation in KANK2 is predicted to abolish the sequestering abilities
      of SIP.
    explanation: >-
      Loss of sequestering function is a prediction for the A670V variant, not
      a direct biochemical measurement; the downstream cellular findings are
      the experimental support.
  downstream:
  - target: Nuclear Accumulation of SRC-2 and SRC-3 in Epidermal Basal Cells
    causal_link_type: DIRECT
    description: >-
      Loss of cytoplasmic retention by mutant SIP allows SRC-2 and SRC-3 to
      accumulate in the nucleus of basal keratinocytes.
    evidence:
    - reference: PMID:24671081
      reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Furthermore, SRC-2 and SRC-3, coactivators of VDR and important
        components of epidermal differentiation, are localised to the nucleus of
        epidermal basal cells in patients, in contrast to the cytoplasmic
        distribution in the heterozygous control.
      explanation: >-
        Homozygous patients show nuclear SRC-2/SRC-3 where a heterozygous
        control retains them in the cytoplasm, consistent with lost
        sequestration by the mutant protein.
- name: Nuclear Accumulation of SRC-2 and SRC-3 in Epidermal Basal Cells
  description: >-
    In patient epidermis the steroid receptor coactivators SRC-2 (NCOA2) and
    SRC-3 (NCOA3), coactivators of the vitamin D receptor that take part in
    epidermal differentiation, are nuclear in basal cells rather than
    cytoplasmic.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: basal cell of epidermis
    term:
      id: CL:0002187
      label: basal cell of epidermis
  biological_processes:
  - preferred_term: protein localization to nucleus
    term:
      id: GO:0034504
      label: protein localization to nucleus
    modifier: INCREASED
  evidence:
  - reference: PMID:24671081
    reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, SRC-2 and SRC-3, coactivators of VDR and important
      components of epidermal differentiation, are localised to the nucleus of
      epidermal basal cells in patients, in contrast to the cytoplasmic
      distribution in the heterozygous control.
    explanation: >-
      Direct observation of nuclear SRC-2/SRC-3 in patient basal epidermal
      cells.
  downstream:
  - target: Increased Vitamin D Receptor Transactivation in Keratinocytes
    causal_link_type: DIRECT
    description: >-
      Nuclear SRC-2 and SRC-3 act as VDR coactivators, so their nuclear
      availability increases vitamin D-induced VDR transcriptional activation.
    evidence:
    - reference: PMID:24671081
      reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Indeed, vitamin D-induced transactivation was increased in patient's
        keratinocytes.
      explanation: >-
        The paper presents increased VDR transactivation as the expected
        consequence of lost coactivator sequestration ("Indeed"); the link
        between the two observations is inferred from their co-occurrence in
        patient cells rather than shown by a rescue or knockdown experiment.
- name: Increased Vitamin D Receptor Transactivation in Keratinocytes
  description: >-
    Cultured patient keratinocytes show increased vitamin D-induced
    transactivation, indicating enhanced VDR-dependent transcription. The VDR
    target genes responsible for the skin and hair phenotype have not been
    identified.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: vitamin D receptor signaling pathway
    term:
      id: GO:0070561
      label: vitamin D receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:24671081
    reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Indeed, vitamin D-induced transactivation was increased in patient's
      keratinocytes.
    explanation: >-
      Measured in cultured keratinocytes from a patient.
  downstream:
  - target: Palmoplantar Keratoderma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated VDR-dependent epidermal transcription is proposed to
      underlie the palmoplantar hyperkeratosis; the intermediate
      differentiation targets are not known.
    evidence:
    - reference: PMID:24671081
      reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings provide evidence that keratoderma and woolly hair can be
        caused by a non-desmosomal mechanism and further underline the
        importance of VDR for normal hair and skin phenotypes.
      explanation: >-
        The authors attribute the keratoderma to the VDR-coactivator mechanism;
        the step from increased VDR transactivation to hyperkeratosis is their
        interpretation rather than a demonstrated causal experiment.
  - target: Woolly Hair
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered VDR signalling is proposed to affect hair-shaft formation;
      hair-follicle cells were not examined directly.
    evidence:
    - reference: PMID:24671081
      reference_title: "Mutation in KANK2, encoding a sequestering protein for steroid receptor coactivators, causes keratoderma and woolly hair."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings provide evidence that keratoderma and woolly hair can be
        caused by a non-desmosomal mechanism and further underline the
        importance of VDR for normal hair and skin phenotypes.
      explanation: >-
        The authors link the hair phenotype to VDR dysregulation by inference;
        no follicular cell assay was reported.

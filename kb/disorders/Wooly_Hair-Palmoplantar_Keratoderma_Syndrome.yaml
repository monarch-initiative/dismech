name: Wooly Hair-Palmoplantar Keratoderma Syndrome
creation_date: "2026-10-11T00:00:00Z"
category: Mendelian
description: >-
  Wooly hair-palmoplantar keratoderma syndrome (keratoderma with woolly hair
  type IV, PPKWH) is an autosomal recessive ectodermal disorder in which woolly
  scalp hair is combined with palmoplantar keratoderma, without the
  cardiomyopathy that defines the clinically overlapping desmosomal syndromes
  (Naxos disease, JUP; Carvajal syndrome, DSP). It was defined in two
  consanguineous families homozygous for the KANK2 missense variant
  c.2009C>T (p.Ala670Val). KANK2 encodes the steroid receptor
  coactivator-interacting protein (SIP), which holds steroid receptor
  coactivators in the cytoplasm; in patients, SRC-2 and SRC-3 are nuclear in
  basal epidermal cells and vitamin D receptor transactivation is increased in
  keratinocytes, making this a non-desmosomal cause of the hair-keratoderma
  combination.
disease_term:
  preferred_term: wooly hair-palmoplantar keratoderma syndrome
  term:
    id: MONDO:0014492
    label: wooly hair-palmoplantar keratoderma syndrome
synonyms:
- palmoplantar keratoderma and woolly hair
- PPKWH
- KWWH type IV
- keratoderma with woolly hair type IV
- keratoderma with wooly hair type IV
- woolly hair-palmoplantar hyperkeratosis syndrome
- wooly hair-palmoplantar hyperkeratosis syndrome
- type 4 woolly hair-palmoplantar keratoderma syndrome
parents:
- palmoplantar keratoderma
notes: >-
  No GeneReviews chapter covers this disease (checked with just
  check-genereviews --online against the entry name and synonyms). The
  molecularly confirmed literature is a single report of two consanguineous
  families (PMID:24671081). Later case reports labelled type IV
  (PMID:35283492, PMID:41818120) made the diagnosis clinically, without KANK2
  testing, so features first described in those cases (finger contractures,
  thickened nails, sensorineural hearing loss, maculopathy) are not recorded
  as phenotypes of this entry. The Orphanet record (ORPHA:420686) also lists
  leukonychia and sparse hair; it could not be cited because the Orphanet
  structured cache was not available to this curation.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:

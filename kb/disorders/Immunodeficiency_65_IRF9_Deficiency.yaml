name: Immunodeficiency 65 (IRF9 Deficiency)
creation_date: "2026-08-27T23:45:00Z"
category: Mendelian
description: >-
  Immunodeficiency 65 is an autosomal recessive inborn error of immunity caused
  by biallelic loss-of-function variants in IRF9, the DNA-binding subunit of the
  interferon-stimulated gene factor 3 (ISGF3) transcription factor complex. Type
  I and type III interferons signal through ISGF3, a trimer of STAT1, STAT2 and
  IRF9; without IRF9 the trimer cannot assemble, and the transcriptional
  programme those interferons induce collapses to a narrow residual subset. The
  clinical consequence is severe, sometimes life-threatening viral disease -
  influenza A pneumonitis in the index patient - against a background in which
  many other common viruses are still controlled. The defect is narrower than "no
  interferon response": STAT1 homodimers, the gamma-activated factor that
  transduces type II interferon, still form normally, so the disease is a
  selective failure of the ISGF3 arm rather than a global interferon
  unresponsiveness. A second, initially paradoxical arm of the phenotype is
  hyperinflammation and haemophagocytic lymphohistiocytosis. This is not a
  separate coincidence: ISGF3 loss suppresses but does not abolish signalling
  through the type I interferon receptor, and because it also fails to induce
  the negative regulator USP18, receptor signalling runs abnormally long and its
  late transcriptional output comes to resemble an interferon-gamma response.
  The same lesion therefore produces both too little antiviral defence and too
  much inflammation.
parents:
  - Inborn Error of Immunity
synonyms:
  - IMD65
  - IRF9 deficiency
  - ISGF3-gamma deficiency
  - p48 deficiency
disease_term:
  preferred_term: immunodeficiency 65, susceptibility to viral infections
  term:
    id: MONDO:0032848
    label: immunodeficiency 65, susceptibility to viral infections
notes: >-
  Evidence-base caveat, stated up front because it governs how every frequency
  and phenotype claim in this entry should be read. IMD65 has been reported in
  only a small number of kindreds. Per-phenotype frequencies cannot be computed
  from that denominator, so this entry deliberately carries no frequency values
  on its phenotypes rather than converting single-family observations into
  FrequencyEnum bands. Where a claim rests on one patient, the evidence
  explanation says so.

  Relationship to STAT2_Deficiency. kb/disorders/STAT2_Deficiency.yaml curates
  the sibling defect in the same ISGF3 complex. The two entries share the
  prolonged-IFNAR-signalling mechanism and cite the same source for it
  (PMID:35182547, which studied STAT1-, STAT2- and IRF9-deficient cells side by
  side). They are kept as separate entries because the causal gene differs; the
  shared node is stated in both rather than cross-referenced, following the
  project's non-DRY convention for conserved mechanisms.
inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Both reported genotypes are homozygous, one in a consanguineous kindred.
      Heterozygous carriers are unaffected.
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          She is homozygous for a loss-of-function IRF9 allele.
        explanation: >-
          Establishes the homozygous loss-of-function genotype in the index
          patient, consistent with autosomal recessive inheritance.
pathophysiology:
  - name: Biallelic IRF9 Loss of Function
    biological_scale: MOLECULAR
    description: >-
      Homozygous or compound heterozygous loss-of-function variants in IRF9
      abolish functional IRF9 protein. IRF9 is the DNA-binding component of
      ISGF3 and is not shared with any other interferon-responsive complex, so
      its loss removes exactly one signalling arm rather than degrading
      interferon signalling generally.
    genes:
      - preferred_term: IRF9
        term:
          id: hgnc:6131
          label: IRF9
    genetic_context:
      functional_impact_category: LOSS_OF_FUNCTION
      zygosity: HOMOZYGOUS
      variant_origin: GERMLINE
    downstream:
      - target: Failure of ISGF3 Trimer Assembly
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We report a 5-yr-old child with severe pulmonary influenza at 2 yr.
          She is homozygous for a loss-of-function IRF9 allele.
        explanation: >-
          The founding case report establishing biallelic IRF9 loss of function
          as the cause of this disease.
  - name: Failure of ISGF3 Trimer Assembly
    biological_scale: MOLECULAR
    description: >-
      Without IRF9 the STAT1/STAT2/IRF9 trimer cannot form in response to type I
      interferon, while STAT1 homodimers (gamma-activated factor, GAF) still
      assemble normally. This is the discriminating molecular finding on
      functional testing and the reason the immunodeficiency is selective: the
      type II interferon arm, which signals through GAF, is intact.
    protein_complexes:
      - preferred_term: ISGF3 complex
        term:
          id: GO:0070721
          label: ISGF3 complex
        modifier: DECREASED
    biological_processes:
      - preferred_term: type I interferon-mediated signaling pathway
        term:
          id: GO:0060337
          label: type I interferon-mediated signaling pathway
        modifier: DECREASED
    downstream:
      - target: Narrowed Interferon-Stimulated Gene Induction
      - target: Failure of USP18 Negative Feedback on Interferon Receptor Signalling
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Her cells activate gamma-activated factor (GAF) STAT1 homodimers but
          not IFN-stimulated gene factor 3 (ISGF3) trimers (STAT1/STAT2/IRF9) in
          response to IFN-α2b.
        explanation: >-
          States precisely the selective defect this node models: GAF forms,
          ISGF3 does not. Graded IN_VITRO because the complex-formation assay
          was performed on the patient's cells.
  - name: Narrowed Interferon-Stimulated Gene Induction
    biological_scale: CELLULAR
    description: >-
      The transcriptional response to type I interferon is much narrower than
      normal, though not absent - a residual subset of interferon-stimulated
      gene transcripts is still induced. That residue matters clinically: it is
      the most plausible reason the patient controls many common viruses
      normally and fails only against particular ones, and it is why this entry
      does not model the defect as an all-or-nothing loss of antiviral immunity.
    biological_processes:
      - preferred_term: response to type I interferon
        term:
          id: GO:0034340
          label: response to type I interferon
        modifier: DECREASED
    downstream:
      - target: Uncontrolled Replication of Respiratory Viruses
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The transcriptome induced by IFN-α2b in the patient's cells is much
          narrower than that of control cells; however, induction of a subset of
          IFN-stimulated gene transcripts remains detectable.
        explanation: >-
          Supports both halves of this node: the transcriptional response is
          narrowed, and a residual subset survives. The second clause is what
          the node's clinical interpretation rests on.
  - name: Uncontrolled Replication of Respiratory Viruses
    biological_scale: CELLULAR
    description: >-
      Patient cells fail to restrict influenza A virus, parainfluenza virus and
      respiratory syncytial virus in vitro, and the defect is rescued by
      wild-type IRF9 while silencing IRF9 in control cells reproduces it. That
      reciprocal experiment is what makes this a causal claim rather than an
      association.
    biological_processes:
      - preferred_term: defense response to virus
        term:
          id: GO:0051607
          label: defense response to virus
        modifier: DECREASED
    downstream:
      - target: Severe Viral Pneumonitis
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In vitro, the patient's cells do not control three respiratory
          viruses, influenza A virus (IAV), parainfluenza virus (PIV), and
          respiratory syncytial virus (RSV). These phenotypes are rescued by
          wild-type IRF9, whereas silencing IRF9 expression in control cells
          increases viral replication.
        explanation: >-
          Reports both the failure of viral control and the rescue-and-knockdown
          pair that establishes IRF9 as the responsible factor.
  - name: Severe Viral Pneumonitis
    biological_scale: ORGANISM
    description: >-
      The clinical endpoint of the antiviral arm: severe, sometimes
      life-threatening lower respiratory tract viral disease, presenting in the
      index patient as influenza A pneumonitis at two years of age. Notably the
      same child controlled respiratory viruses other than influenza A in vivo,
      so the in-vitro failure against PIV and RSV did not translate into
      clinical disease from those agents.
    downstream:
      - target: phenotypes#Severe Viral Pneumonia
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          However, the child has controlled various common viruses in vivo,
          including respiratory viruses other than IAV. Our findings show that
          human IRF9- and ISGF3-dependent type I and III IFN responsive pathways
          are essential for controlling IAV.
        explanation: >-
          Records the in-vivo/in-vitro discordance this node describes, and the
          authors' narrower conclusion that the pathway is essential
          specifically for influenza A control.
  - name: Failure of USP18 Negative Feedback on Interferon Receptor Signalling
    biological_scale: CELLULAR
    description: >-
      ISGF3 loss suppresses but does not abrogate type I interferon receptor
      signalling. Because USP18 and other negative regulators are themselves
      ISGF3-induced, their induction fails and receptor signalling becomes
      abnormally prolonged. This is the mechanistic bridge to the inflammatory
      arm and resolves what otherwise looks like a contradiction - a patient who
      cannot mount an interferon response yet suffers interferon-driven
      inflammation.
    biological_processes:
      - preferred_term: negative regulation of type I interferon-mediated signaling pathway
        term:
          id: GO:0060339
          label: negative regulation of type I interferon-mediated signaling pathway
        modifier: DECREASED
      - preferred_term: type I interferon-mediated signaling pathway
        term:
          id: GO:0060337
          label: type I interferon-mediated signaling pathway
        modifier: INCREASED
    downstream:
      - target: Interferon-Gamma-Like Late Transcriptional Output
    notes: >-
      The two process terms here say different things and are not in tension.
      GO:0060339 DECREASED is the substantive claim - the brake fails, because
      USP18 and the other negative regulators are themselves ISGF3-induced.
      GO:0060337 INCREASED records the consequence, that receptor-proximal
      signalling therefore runs long. Binding the negative-regulation term
      directly is what makes this coherent with the DECREASED modifier on
      GO:0060337 at the ISGF3 assembly node, where the claim is about
      ISGF3-dependent transcription rather than about signalling duration.
    evidence:
      - reference: PMID:35182547
        reference_title: "Aberrant inflammatory responses to type I interferon in STAT2 or IRF9 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Deficiency of any IFN-stimulated gene factor 3 component suppressed
          but did not abrogate IFN-I receptor signaling, which was abnormally
          prolonged, in keeping with insufficient induction of negative
          regulators such as ubiquitin-specific peptidase 18 (USP18).
        explanation: >-
          The direct statement of this node: signalling is suppressed but
          prolonged, and the reason is failed induction of USP18. Graded
          IN_VITRO because the kinetics were measured in patient primary cells
          and gene-edited iPSC-derived macrophages.
  - name: Interferon-Gamma-Like Late Transcriptional Output
    biological_scale: CELLULAR
    description: >-
      In IRF9- or STAT2-deficient cells the late transcriptional response to
      type I interferon comes to mimic the effect of interferon-gamma. This is a
      measured cellular switch, kept separate from the clinical syndrome
      downstream so that the hedge in the literature sits on the edge it
      actually qualifies rather than on the observation itself.
    biological_processes:
      - preferred_term: type I interferon-mediated signaling pathway
        term:
          id: GO:0060337
          label: type I interferon-mediated signaling pathway
        modifier: INCREASED
    downstream:
      - target: Hyperinflammation and Haemophagocytic Lymphohistiocytosis
    evidence:
      - reference: PMID:35182547
        reference_title: "Aberrant inflammatory responses to type I interferon in STAT2 or IRF9 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In cells lacking either STAT2 or IRF9, this late transcriptional
          response to IFN-α2b mimicked the effect of IFN-γ.
        explanation: >-
          The measured transcriptional switch this node models, stated without
          hedging because the measurement itself is not hedged.
  - name: Hyperinflammation and Haemophagocytic Lymphohistiocytosis
    biological_scale: ORGANISM
    description: >-
      The clinical inflammatory syndrome accompanying virus susceptibility.
      Modelled downstream of the transcriptional switch rather than bundled with
      it, because the causal link between the two is proposed rather than
      demonstrated - and that is a claim about this edge, not about either node.
    biological_processes:
      - preferred_term: inflammatory response
        term:
          id: GO:0006954
          label: inflammatory response
        modifier: INCREASED
    downstream:
      - target: phenotypes#Haemophagocytosis and Hyperinflammation
    evidence:
      - reference: PMID:35182547
        reference_title: "Aberrant inflammatory responses to type I interferon in STAT2 or IRF9 deficiency."
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: >-
          Aberrant IFN-α receptor signaling in STAT2- and IRF9-deficient cells
          switches the transcriptional output to a prolonged, IFN-γ-like
          response and likely contributes to clinically overt inflammation in
          these individuals.
        explanation: >-
          Graded PARTIAL because the authors write "likely contributes". Now
          that the transcriptional switch and the clinical syndrome are separate
          nodes, this hedge attaches to the edge between them, which is the
          claim that is actually uncertain.
      - reference: PMID:35182547
        reference_title: "Aberrant inflammatory responses to type I interferon in STAT2 or IRF9 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Inflammatory phenomena such as hyperinflammation or hemophagocytic
          lymphohistiocytosis are a frequent yet paradoxical accompaniment to
          virus susceptibility in patients with impairment of type I interferon
          (IFN-I) signaling caused by deficiency of signal transducer and
          activator of transcription 2 (STAT2) or IFN regulatory factor 9
          (IRF9).
        explanation: >-
          Establishes that the syndrome itself occurs in these patients, which
          is not hedged; only its attribution to the transcriptional switch is.
phenotypes:
  - name: Severe Viral Pneumonia
    category: Respiratory
    description: >-
      Life-threatening lower respiratory tract viral infection, presenting in
      the index patient as influenza A pneumonitis at two years of age requiring
      intensive care.
    phenotype_term:
      preferred_term: Pneumonia
      term:
        id: HP:0002090
        label: Pneumonia
      severity: SEVERE
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We report a 5-yr-old child with severe pulmonary influenza at 2 yr.
        explanation: >-
          The presenting phenotype in the index patient. No frequency is
          recorded because the published cohort is a handful of kindreds.
  - name: Haemophagocytosis and Hyperinflammation
    category: Hematologic
    description: >-
      Hyperinflammation and haemophagocytic lymphohistiocytosis occur alongside
      virus susceptibility. Described as a frequent accompaniment in patients
      with impaired type I interferon signalling from STAT2 or IRF9 deficiency.
    phenotype_term:
      preferred_term: Hemophagocytosis
      term:
        id: HP:0012156
        label: Hemophagocytosis
    evidence:
      - reference: PMID:35182547
        reference_title: "Aberrant inflammatory responses to type I interferon in STAT2 or IRF9 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Inflammatory phenomena such as hyperinflammation or hemophagocytic
          lymphohistiocytosis are a frequent yet paradoxical accompaniment to
          virus susceptibility in patients with impairment of type I interferon
          (IFN-I) signaling caused by deficiency of signal transducer and
          activator of transcription 2 (STAT2) or IFN regulatory factor 9
          (IRF9).
        explanation: >-
          States that the inflammatory phenotype accompanies virus
          susceptibility in IRF9 deficiency. Note the sentence groups IRF9 with
          STAT2, so it is evidence for the class rather than for IRF9 alone.
genetic:
  - name: IRF9
    relationship_type: CAUSATIVE
    gene_term:
      preferred_term: IRF9
      term:
        id: hgnc:6131
        label: IRF9
    notes: >-
      Gene identity is worth recording explicitly here. The deep-research report
      used to curate this entry gave the gene as HGNC:6398; that CURIE is KPNA5.
      IRF9 is hgnc:6131, which is also what the curation stub carried, and this
      entry uses the verified identifier.

      Two loss-of-function alleles are reported, both homozygous. The index
      patient carries c.991G>A, which alters the last nucleotide of exon 7; the
      second kindred, consanguineous, carries the splice-donor variant
      c.577+1G>T, causing exon 5 skipping and a premature stop. Only the first
      is quotable from a cached abstract, so only it carries an evidence item
      below; the second is recorded here in prose rather than as an unsourced
      structured claim.
    inheritance:
      - name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
    variants:
      - name: c.991G>A
        description: >-
          Homozygous in the index patient. Alters the last nucleotide of exon 7
          and abolishes ISGF3 activation and ISGF3-dependent interferon
          stimulated gene induction on stimulation with IFN-alpha2.
        clinical_significance: PATHOGENIC
        evidence:
          - reference: PMID:34702736
            reference_title: "Monoclonal antibody-mediated neutralization of SARS-CoV-2 in an IRF9-deficient child."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              We showed that the c.991G > A mutant IRF9 allele in the patient
              was loss-of-function, resulting in a lack of both ISGF-3
              activation and ISGF-3–dependent IFN stimulated gene (ISG)
              induction following the stimulation of the patient's cells with
              IFN-α2
            explanation: >-
              Names the variant and states its loss-of-function consequence at
              both the complex-assembly and gene-induction levels.
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our findings show that human IRF9- and ISGF3-dependent type I and III
          IFN responsive pathways are essential for controlling IAV.
        explanation: >-
          The authors' causal conclusion linking IRF9 loss to the failure of
          antiviral control that defines this disease.
discussions:
  - discussion_id: irf9_mouse_type_ii_ifn_divergence
    kind: HUMAN_MODEL_MISMATCH
    prompt: >-
      Why is type II interferon signalling intact in human IRF9 deficiency but
      impaired in the p48-null mouse, and does that divergence limit what the
      mouse can say about the human disease?
    attaches_to:
      - pathophysiology#Failure of ISGF3 Trimer Assembly
    rationale: >-
      The selectivity of the human defect is this entry's defining claim:
      patient cells form STAT1 homodimers normally, so the gamma-activated
      factor arm that transduces type II interferon still works, and the disease
      is an ISGF3 failure rather than a global interferon unresponsiveness. The
      p48-null mouse does not reproduce that boundary - in the mouse, the
      antiviral state induced by IFN-gamma is impaired too. Whether this
      reflects a species difference in how much type II interferon signalling
      depends on p48, a difference between a constitutive germline null and a
      hypomorphic human allele, or the difference between embryonic fibroblasts
      and the patient cell types assayed, is not resolved. Until it is, the
      mouse supports the ISG-induction node and cannot be used to argue about
      the selectivity.
    proposed_experiments:
      - experiment_id: irf9_gaf_formation_across_species_and_cell_types
        name: >-
          GAF formation and IFN-gamma-induced antiviral state in p48-null mouse
          and IRF9-null human cells, matched by cell type
        description: >-
          Assay STAT1 homodimer formation and the IFN-gamma-induced antiviral
          state side by side in p48-null mouse embryonic fibroblasts, p48-null
          mouse cells of a type matched to those assayed in patients, and
          IRF9-deficient human fibroblasts. The three-way comparison separates
          the candidate explanations the rationale names: if the mouse defect
          persists across cell types while the human one does not, it is a
          species difference; if it tracks cell type, the original discrepancy
          is an artefact of comparing embryonic fibroblasts with patient cells.
        would_support:
          - pathophysiology#Failure of ISGF3 Trimer Assembly
        supporting_outcome:
          - >-
            GAF formation and the IFN-gamma-induced antiviral state are intact
            in IRF9-null human cells but impaired in p48-null mouse cells of the
            same type, establishing a genuine species difference and confirming
            that the mouse cannot speak to the selectivity of the human defect.
        refuting_outcome:
          - >-
            The type II interferon defect in p48-null mouse cells disappears
            when a cell type matching the human assays is used, indicating the
            divergence is a comparison artefact rather than a species
            difference, and that the model may after all be informative about
            selectivity.
    evidence:
      - reference: PMID:9078371
        reference_title: >-
          Essential and non-redundant roles of p48 (ISGF3 gamma) and IRF-1 in
          both type I and type II interferon responses, as revealed by gene
          targeting studies.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We show that p48 plays an essential role in both type I and type II
          IFN responses
        explanation: >-
          The mouse half of the mismatch: p48 is required for both interferon
          responses in the mouse.
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Her cells activate gamma-activated factor (GAF) STAT1 homodimers but
          not IFN-stimulated gene factor 3 (ISGF3) trimers (STAT1/STAT2/IRF9) in
          response to IFN-α2b.
        explanation: >-
          The human half: GAF, the type II interferon transducer, forms
          normally in the patient's cells.
  - discussion_id: irf9_type_iii_ifn_contribution
    kind: KNOWLEDGE_GAP
    prompt: >-
      Does the type III interferon arm of the ISGF3 defect contribute
      independently to the IMD65 phenotype, or is the clinical disease entirely
      attributable to loss of type I interferon signalling?
    attaches_to:
      - pathophysiology#Failure of ISGF3 Trimer Assembly
    rationale: >-
      IRF9 loss disables ISGF3 downstream of both the type I and the type III
      interferon receptor, and the founding paper's conclusion names both
      pathways. But patients whose cells cannot respond to type III interferons
      because of inherited IL10RB deficiency have no overt viral disease, which
      argues that the type III arm is largely redundant in humans and that the
      IMD65 phenotype is driven by the type I loss. The entry therefore does not
      model a separate type III node, and this discussion records why that
      absence is a judgement rather than an oversight.
    evidence:
      - reference: PMID:38781720
        reference_title: "In search of a function for human type III interferons: insights from inherited and acquired deficits."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patients with cells that do not respond to type III IFNs due to
          inherited IL10RB deficiency display no overt viral disease
        explanation: >-
          The observation that motivates the gap: an isolated type III
          unresponsiveness produces no viral phenotype, so the type III
          component of the ISGF3 defect cannot be assumed to contribute.
      - reference: PMID:38781720
        reference_title: "In search of a function for human type III interferons: insights from inherited and acquired deficits."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Current findings thus suggest that type III IFNs are largely redundant
          in humans. The essential functions of human type III IFNs,
          particularly in antiviral defenses, remain to be discovered.
        explanation: >-
          States both the redundancy conclusion and that the question remains
          open, which is exactly the shape of this knowledge gap. Graded OTHER
          rather than HUMAN_CLINICAL because this sentence is the review's own
          synthesis across many patient series, not an observation from one.
prevalence:
  - population: Worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: NOT_YET_DOCUMENTED
    notes: >-
      No prevalence estimate exists. IMD65 has been reported in a small number
      of kindreds, and this record exists to make that denominator structured
      rather than leaving it only in the entry's top-level notes. It should not
      be read as an estimate of zero.
treatments:
  - name: Monoclonal Antibody Neutralization of SARS-CoV-2
    description: >-
      Casirivimab and imdevimab given to the IRF9-deficient index patient on day
      2 of symptomatic SARS-CoV-2 infection, with viraemia and clinical
      manifestations resolving by days 3 and 4. This is the one published
      treatment success specific to this genotype, and it is mechanistically the
      point of the entry: passive antibody neutralisation works precisely
      because it bypasses ISGF3 entirely, in a patient for whom interferon
      therapy was predicted to fail.
    therapeutic_modality: MONOCLONAL_ANTIBODY
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: monoclonal antibody
          term:
            id: NCIT:C20401
            label: Monoclonal Antibody
    target_mechanisms:
      - target: Uncontrolled Replication of Respiratory Viruses
        description: >-
          Acts on viral replication directly rather than on any node upstream of
          it, which is why it works in a patient whose interferon response
          cannot be restored.
    evidence:
      - reference: PMID:34702736
        reference_title: "Monoclonal antibody-mediated neutralization of SARS-CoV-2 in an IRF9-deficient child."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          She was viremic on day 2 and received casirivimab and imdevimab. Her
          clinical manifestations and viremia disappeared on days 3 and 4,
          respectively.
        explanation: >-
          The treatment and its observed effect in the index patient. This is a
          single case, which is why no efficacy claim beyond this patient is made.
      - reference: PMID:34702736
        reference_title: "Monoclonal antibody-mediated neutralization of SARS-CoV-2 in an IRF9-deficient child."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Antibody-mediated SARS-CoV-2 neutralization is, therefore, sufficient
          to overcome a deficiency of antiviral IFNs.
        explanation: >-
          The authors' mechanistic conclusion, which is what makes this
          treatment informative about the disease rather than only about the
          patient.
  - name: Prophylactic Immunoglobulin Replacement
    description: >-
      Intravenous immunoglobulin every three weeks, given to the index patient
      since her influenza episode. Reported alongside annual influenza
      vaccination as having considerably improved her clinical status, with no
      further severe viral illness. The two interventions were given together,
      so neither can be credited alone.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: intravenous immunoglobulin therapy
      term:
        id: NCIT:C121331
        label: Intravenous Immunoglobulin Therapy
    target_mechanisms:
      - target: Uncontrolled Replication of Respiratory Viruses
        description: >-
          Supplies neutralising antibody from interferon-competent donors,
          acting downstream of the signalling defect rather than correcting it.
    evidence:
      - reference: PMID:34702736
        reference_title: "Monoclonal antibody-mediated neutralization of SARS-CoV-2 in an IRF9-deficient child."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          She has since received prophylactic intravenous IgG every 3 wk and has
          been vaccinated annually against influenza, which has considerably
          improved her clinical status, as she has developed no other severe
          viral illness.
        explanation: >-
          Graded PARTIAL because the sentence attributes the improvement to
          immunoglobulin and annual influenza vaccination together. Reading it
          as support for immunoglobulin alone would be attributing a combined
          outcome to one arm of it, in a single patient.
diagnosis:
  - name: ISGF3 versus GAF Complex Formation Assay
    description: >-
      The confirmatory functional test, and the one that discriminates IRF9
      deficiency from a general interferon-signalling defect: patient cells fail
      to form ISGF3 trimers in response to type I interferon while forming STAT1
      homodimers (GAF) normally. A defect that abolished both would point
      elsewhere in the pathway.
    evidence:
      - reference: PMID:30143481
        reference_title: "Life-threatening influenza pneumonitis in a child with inherited IRF9 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Her cells activate gamma-activated factor (GAF) STAT1 homodimers but
          not IFN-stimulated gene factor 3 (ISGF3) trimers (STAT1/STAT2/IRF9) in
          response to IFN-α2b.
        explanation: >-
          The discriminating result itself, which is what makes this a
          diagnostic test rather than a research observation.
animal_models:
  - name: p48 (Irf9) knockout mouse
    species: Mouse
    genotype: p48 (Irf9) homozygous null by gene targeting
    publication: PMID:9078371
    description: >-
      Germline gene-targeted deletion of p48, the mouse IRF9 orthologue.
      Establishes the non-redundancy of the factor, but diverges from the human
      disease in a way that matters for how the entry can use it.
    modeled_mechanisms:
      - target: Narrowed Interferon-Stimulated Gene Induction
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: >-
          Interferon-inducible gene activation and establishment of the
          antiviral state are severely impaired, and ISRE-binding activity is
          absent in p48-null embryonic fibroblasts.
        limitations: >-
          The mouse phenotype is broader than the human one. In p48-null mice
          the antiviral state is impaired in response to IFN-gamma as well as
          IFN-alpha, whereas the human disease is a selective ISGF3 defect with
          GAF-dependent type II interferon signalling intact. The model
          therefore overstates the breadth of the human lesion, and should not
          be cited for the selectivity that this entry treats as definitional.
        readouts:
          - name: ISRE-binding activity in embryonic fibroblasts
            target: Narrowed Interferon-Stimulated Gene Induction
            direction: ABOLISHED
            interpretation: >-
              Direct measure of the DNA-binding step that ISGF3 performs and
              that IRF9 is required for.
            evidence:
              - reference: PMID:9078371
                reference_title: >-
                  Essential and non-redundant roles of p48 (ISGF3 gamma) and
                  IRF-1 in both type I and type II interferon responses, as
                  revealed by gene targeting studies.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  activation of IFN-inducible genes and establishment of the
                  antiviral state by IFN-alpha or -gamma are both severely
                  impaired, and ISRE-binding activities induced by both IFNs are
                  absent in the p48-negative embryonic fibroblasts (EFs)
                explanation: >-
                  Reports the abolished ISRE binding and impaired antiviral
                  state. The same sentence is also the source of the limitation
                  recorded on this link, since it names IFN-gamma alongside
                  IFN-alpha.
        evidence:
          - reference: PMID:9078371
            reference_title: >-
              Essential and non-redundant roles of p48 (ISGF3 gamma) and IRF-1
              in both type I and type II interferon responses, as revealed by
              gene targeting studies.
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              We show that p48 plays an essential role in both type I and type
              II IFN responses
            explanation: >-
              Supports treating the model as informative for the ISG-induction
              node, and simultaneously states the divergence from human
              biology that the limitations field records.

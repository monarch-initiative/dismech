name: Rhabdoid Tumor Predisposition Syndrome 2
creation_date: "2026-08-31T00:00:00Z"
description: >-
  Rhabdoid tumor predisposition syndrome 2 (RTPS2) is an autosomal dominant
  cancer predisposition caused by heterozygous germline loss-of-function
  variants in SMARCA4, the ATPase subunit that powers the SWI/SNF (BAF)
  chromatin remodelling complex. It is considerably rarer than the SMARCB1
  form and carries a broader tumour spectrum: alongside infantile rhabdoid
  tumours of the brain and kidney, carriers develop small cell carcinoma of
  the ovary, hypercalcemic type, a tumour of adolescents and young women now
  recognised as a rhabdoid tumour rather than a carcinoma. The later-onset
  ovarian risk means the surveillance window does not close at the end of
  early childhood, which distinguishes management from RTPS1.
category: Mendelian
parents:
- hereditary disease
synonyms:
- RTPS2
- SMARCA4 familial rhabdoid tumor
- familial rhabdoid tumor caused by mutation in SMARCA4
- rhabdoid tumor predisposition syndrome type 2
disease_term:
  preferred_term: rhabdoid tumor predisposition syndrome 2
  term:
    id: MONDO:0013224
    label: rhabdoid tumor predisposition syndrome 2
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    RTPS2 is transmitted as an autosomal dominant trait with incomplete
    penetrance. Unaffected transmitting carriers are described more often
    than in RTPS1, so an apparently negative family history does not exclude
    inheritance.
  evidence:
  - reference: PMID:24658002
    reference_title: "Germline and somatic SMARCA4 mutations characterize small cell carcinoma of the ovary, hypercalcemic type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After discovering segregating deleterious germline mutations in SMARCA4 in
      all three families, we tested DNA from a fourth affected family, which also
      carried a segregating SMARCA4 germline mutation.
    explanation: >-
      Demonstrates germline segregation of SMARCA4 alleles across four affected
      families.
pathophysiology:
- name: Germline SMARCA4 Loss-of-Function
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline loss-of-function SMARCA4 allele removes one copy
    of the catalytic ATPase subunit of the BAF complex in every cell.
  genes:
  - preferred_term: SMARCA4
    term:
      id: hgnc:11100
      label: SMARCA4
  evidence:
  - reference: PMID:20137775
    reference_title: "Germline nonsense mutation and somatic inactivation of SMARCA4/BRG1 in a family with rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified inactivation of another member of the SWI/SNF
      chromatin-remodeling complex, its ATPase subunit SMARCA4 (also known as
      BRG1), due to a SMARCA4/BRG1 germline mutation and loss of heterozygosity by
      uniparental disomy in the tumor cells of two sisters with rhabdoid tumors
      lacking SMARCB1 mutations.
    explanation: >-
      The original description of RTPS2, establishing germline SMARCA4 as a
      rhabdoid predisposition gene distinct from SMARCB1.
  downstream:
  - target: Somatic Inactivation of the Second SMARCA4 Allele
    description: >-
      The constitutional allele is carried by every cell, so one somatic second
      hit in a susceptible progenitor completes biallelic inactivation.
- name: Somatic Inactivation of the Second SMARCA4 Allele
  biological_scale: MOLECULAR
  description: >-
    A somatic second hit in the remaining allele completes biallelic
    inactivation and produces the loss of SMARCA4 protein expression that
    defines these tumours immunohistochemically.
  genes:
  - preferred_term: SMARCA4
    term:
      id: hgnc:11100
      label: SMARCA4
  evidence:
  - reference: PMID:24658002
    reference_title: "Germline and somatic SMARCA4 mutations characterize small cell carcinoma of the ovary, hypercalcemic type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the familial tumors sequenced harbored either a somatic mutation or loss
      of the wild-type allele.
    explanation: >-
      Confirms the two-hit pattern: every familial tumour lost its remaining
      wild-type SMARCA4 allele.
  - reference: PMID:24658002
    reference_title: "Germline and somatic SMARCA4 mutations characterize small cell carcinoma of the ovary, hypercalcemic type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical analysis of these cases and additional familial and
      non-familial cases showed loss of SMARCA4 (BRG1) protein in 38 of 40 tumors
      overall.
    explanation: >-
      Establishes loss of SMARCA4 protein as the immunohistochemical signature of
      these tumours.
  downstream:
  - target: Loss of BAF Complex ATPase Activity
    description: >-
      Biallelic inactivation removes the catalytic subunit, leaving an assembled
      but energetically inert complex.
- name: Loss of BAF Complex ATPase Activity
  biological_scale: MOLECULAR
  description: >-
    SMARCA4 supplies the ATP hydrolysis that drives nucleosome repositioning.
    Its loss leaves an assembled but catalytically dead complex, a different
    molecular lesion from the complex destabilisation seen when the SMARCB1
    core subunit is lost.
  downstream:
  - target: Failure of Enhancer-Mediated Differentiation
    description: >-
      Without ATP-dependent remodelling, lineage-specifying enhancers cannot be
      opened.
- name: Failure of Enhancer-Mediated Differentiation
  biological_scale: CELLULAR
  description: >-
    Without ATP-dependent remodelling, lineage-specifying enhancers cannot be
    opened, and progenitor cells remain undifferentiated and proliferative.
  downstream:
  - target: Rhabdoid Tumorigenesis
    description: >-
      Undifferentiated progenitors in the infant brain and kidney give rise to
      malignant rhabdoid tumours.
  - target: Ovarian Small Cell Carcinoma Hypercalcemic Type Development
    description: >-
      The same differentiation block in an ovarian progenitor of an adolescent
      or young adult produces small cell carcinoma of the ovary, hypercalcemic
      type, which is morphologically a rhabdoid tumour.
- name: Rhabdoid Tumorigenesis
  biological_scale: TISSUE
  description: >-
    The arrested progenitor gives rise to a malignant rhabdoid tumour of the
    central nervous system or kidney in infancy.
- name: Ovarian Small Cell Carcinoma Hypercalcemic Type Development
  biological_scale: TISSUE
  description: >-
    In adolescent and young adult females, biallelic SMARCA4 loss in an
    ovarian progenitor produces small cell carcinoma of the ovary,
    hypercalcemic type, morphologically and molecularly a rhabdoid tumour,
    typically accompanied by paraneoplastic hypercalcaemia.
phenotypes:
- category: Neoplastic
  name: Atypical Teratoid Rhabdoid Tumor
  description: >-
    Malignant rhabdoid tumour of the central nervous system driven by
    biallelic SMARCA4 loss. It is histologically indistinguishable from the
    SMARCB1-driven form but retains SMARCB1 staining, so SMARCA4
    immunohistochemistry is required to recognise it.
  phenotype_term:
    preferred_term: Atypical teratoid/rhabdoid tumor
    term:
      id: HP:0034401
      label: Atypical teratoid/rhabdoid tumor
    onset:
      onset_category: INFANTILE
- category: Neoplastic
  name: Rhabdoid Tumor of the Kidney
  description: >-
    Malignant rhabdoid tumour of the kidney, less frequent in RTPS2 than in
    RTPS1.
  phenotype_term:
    preferred_term: Rhabdoid tumor of the kidney
    term:
      id: HP:0034402
      label: Rhabdoid tumor of the kidney
- category: Neoplastic
  name: Small Cell Carcinoma of the Ovary Hypercalcemic Type
  description: >-
    An aggressive ovarian tumour of adolescents and young women, now
    understood as a rhabdoid tumour rather than a true carcinoma. It is the
    feature that most distinguishes RTPS2 from RTPS1 and extends the
    surveillance window well beyond early childhood.
  phenotype_term:
    preferred_term: Small cell carcinoma of the ovary, hypercalcemic type
    term:
      id: HP:0100615
      label: Ovarian neoplasm
  evidence:
  - reference: PMID:24658002
    reference_title: "Germline and somatic SMARCA4 mutations characterize small cell carcinoma of the ovary, hypercalcemic type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Small cell carcinoma of the ovary, hypercalcemic type (SCCOHT) is the most
      common undifferentiated ovarian malignancy in women under 40 years of age.
    explanation: >-
      Establishes the young-adult age distribution that extends the surveillance
      window beyond early childhood.
- category: Neoplastic
  name: Paraneoplastic Hypercalcemia
  description: >-
    Hypercalcaemia accompanies the majority of ovarian small cell carcinoma
    hypercalcemic type presentations and is frequently the finding that brings
    the tumour to attention.
  phenotype_term:
    preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
genetic:
- name: SMARCA4
  notes: >-
    Germline loss-of-function SMARCA4 alleles cause RTPS2. Tumours complete
    biallelic inactivation either by a somatic mutation or by loss of the
    wild-type allele, including loss of heterozygosity through uniparental
    disomy. Loss of SMARCA4 protein on immunohistochemistry is the practical
    diagnostic marker, since these tumours retain SMARCB1 staining and are
    otherwise indistinguishable from the SMARCB1-driven form.
  gene_term:
    preferred_term: SMARCA4
    term:
      id: hgnc:11100
      label: SMARCA4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:20137775
    reference_title: "Germline nonsense mutation and somatic inactivation of SMARCA4/BRG1 in a family with rhabdoid tumor predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMARCA4 is thus a second member of the SWI/SNF complex involved in cancer
      predisposition.
    explanation: >-
      States the finding that defines RTPS2 as a distinct entity from RTPS1.
  - reference: PMID:24658002
    reference_title: "Germline and somatic SMARCA4 mutations characterize small cell carcinoma of the ovary, hypercalcemic type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of cases with available DNA identified at least one germline or
      somatic deleterious SMARCA4 mutation in 30 of 32 cases.
    explanation: >-
      Quantifies how consistently SMARCA4 lesions are found in SCCOHT.
treatments:
- name: Germline SMARCA4 Testing and Genetic Counseling
  description: >-
    Germline SMARCA4 testing is indicated in rhabdoid tumours lacking a SMARCB1
    lesion and in SCCOHT at any age, since a germline finding changes
    surveillance for the patient and cascade testing for relatives. Because the
    ovarian risk runs into young adulthood, counselling differs from RTPS1.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24658002
    reference_title: "Germline and somatic SMARCA4 mutations characterize small cell carcinoma of the ovary, hypercalcemic type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings identify alterations in SMARCA4 as the major cause of SCCOHT,
      which could lead to improvements in genetic counseling and new treatment
      approaches.
    explanation: >-
      The source paper identifies improved genetic counselling as a direct
      consequence of recognising SMARCA4 as causal.

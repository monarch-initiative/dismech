name: Congenital High-molecular-weight Kininogen Deficiency
creation_date: "2026-11-13T09:00:00Z"
category: Mendelian
synonyms:
- high molecular weight kininogen deficiency
- HMWK deficiency
- HK deficiency
- kininogen deficiency
- Fitzgerald factor deficiency
- Williams trait
- Flaujeac trait
- Fujiwara trait
disease_term:
  preferred_term: congenital high-molecular-weight kininogen deficiency
  term:
    id: MONDO:0009234
    label: congenital high-molecular-weight kininogen deficiency
parents:
- Inherited blood coagulation disorder
- Coagulation protein disease
description: >-
  Congenital high-molecular-weight kininogen (HK) deficiency, OMIM 228960, is
  an autosomal recessive defect of the plasma contact system caused by
  biallelic truncating variants in KNG1. KNG1 encodes, by alternative
  splicing, both high-molecular-weight and low-molecular-weight kininogen. HK
  is not an enzyme: it is the cofactor that scaffolds prekallikrein and factor
  XI onto anionic surfaces and onto the endothelial receptor gC1qR, which is
  what allows factor XII to drive contact activation. Losing it therefore
  removes the contact arm of the intrinsic pathway, and that arm turns out to
  be dispensable for haemostasis in life, because physiological clotting is
  driven by tissue factor and factor VIIa. The result is a disease that is
  almost entirely a laboratory finding: an isolated, markedly prolonged
  activated partial thromboplastin time that corrects on mixing with normal
  plasma, with procoagulant HK activity under 1% and secondary reductions in
  prekallikrein and factor XI, in a person who is asymptomatic and has a
  normal life expectancy. The 2023 systematic review that assembled the
  literature found 48 cases in 41 families, ten deficiency-causing KNG1
  variants, all truncating, and estimated a prevalence near one case per eight
  million, slightly higher in people of African ancestry. The clinical risk is
  not the deficiency but the misreading of it: the prolonged aPTT and the
  secondary low prekallikrein and factor XI invite a diagnosis of a bleeding
  disorder, and from there unnecessary blood products or deferred surgery.
notes: >-
  Why this entry has almost no phenotypes. That is the finding, not a gap.
  The defining feature of severe HK deficiency is a dramatic laboratory
  abnormality with no clinical disease, and the entry is written to say so
  rather than to fill sections. The pathograph accordingly ends in laboratory
  phenotypes, and there is a branch node recording that haemostasis is
  explicitly preserved.
  KNG1 has two opposite phenotypes and only one of them is this disease.
  Every deficiency-causing allele reported so far is truncating. The one KNG1
  amino-acid substitution with a relevant phenotype instead causes
  bradykinin-mediated hereditary angioedema, which is a gain of pathway
  activity rather than a loss of function. A KNG1 variant on a report
  therefore does not by itself indicate this disease; the variant class does.
  That is recorded in the genetic notes and as a differential diagnosis.
  Reported thrombotic events are not recorded as phenotypes. Individual
  reports describe splenic infarction (PMID:24492696) and an association with
  acute granulocytic leukaemia (PMID:6573994) in deficient people. These are
  co-occurrences in a very small reported population, the systematic review's
  conclusion is that the condition is asymptomatic, and no causal claim is
  made in either report, so neither is recorded as a phenotype of the
  disease. The splenic infarction case is cited only for its variant.
  GeneReviews. No GeneReviews chapter covers this disease or KNG1. PubMed
  searches of the GeneReviews book for the disease name and for the gene
  symbol (`"kininogen"[TI] AND genereviews[book] NOT retired[TI]` and
  `KNG1[TIAB] AND genereviews[book] NOT retired[TI]`, run 2026-11-13) both
  returned zero records, and `just check-genereviews` reports NO_CHAPTER.
  The baseline is the 2023 systematic review (PMID:36700498) instead.
  Term binding. The deep-research report's term-validation section set
  needs_review and named three mislabelled CURIEs it had suggested for this
  entry: HP:0011897, offered as "Abnormal prekallikrein", is Increased total
  neutrophil count; HP:0004863, offered as "Abnormality of coagulation factor
  XI", is Compensated hemolytic anemia; and GO:0002542, offered as
  "bradykinin biosynthetic process", is Factor XII activation. None of the
  three is used. The correct terms, looked up in OLS at the time of writing,
  are HP:0034371 Decreased circulating prekallikrein concentration,
  HP:0001929 Reduced factor XI activity and GO:0002936 bradykinin
  biosynthetic process.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Two truncating KNG1 alleles, homozygous or compound heterozygous.
    Heterozygous carriers have roughly half-normal HK activity and a normal or
    near-normal aPTT, so they are not detected by the test that finds the
    homozygotes.
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe high-molecular-weight kininogen (HK) deficiency is a poorly studied autosomal recessive contact system defect caused by pathogenic, biallelic KNG1 variants."
    explanation: States the inheritance pattern and that the variants are biallelic.
  - reference: PMID:24492696
    reference_title: "A novel frameshift mutation in exon 4 causing a deficiency of high-molecular-weight kininogen in a patient with splenic infarction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, the HMWK activity was also reduced in the patient's three children, who exhibited the heterozygous \"TC\" insertion at c523-524 in exon 4."
    explanation: >-
      Heterozygous children with partially reduced activity, which is the
      carrier state of a recessive disorder.
genetic:
- name: KNG1
  gene_term:
    preferred_term: KNG1
    term:
      id: hgnc:6383
      label: KNG1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic truncating (nonsense, frameshift or splice) variants
  notes: >-
    Ten deficiency-causing KNG1 variants were known at the 2023 systematic
    review, and every one of them is truncating. This matters for
    interpretation rather than being a curiosity: the only KNG1 amino-acid
    substitution with a relevant phenotype causes hereditary angioedema
    instead, which is the opposite direction of effect. Truncating variants in
    the exons shared by both transcripts abolish low-molecular-weight
    kininogen as well. relationship_type is CAUSATIVE because ClinGen rates
    the KNG1 to this disease relationship Definitive (autosomal recessive,
    Hemostasis/Thrombosis GCEP); that assertion is recorded under
    gene_disease_validity.

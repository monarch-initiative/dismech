    description: >-
      A nonsense variant found homozygous in a large Chinese family. The
      67-year-old propositus was asymptomatic and came to attention only
      through an isolated prolonged aPTT; his procoagulant HK activity was
      under 1%, and prekallikrein activity was reduced in him and in two
      affected sisters.
    type: nonsense variant

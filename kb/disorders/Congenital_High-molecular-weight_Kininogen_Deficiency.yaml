pathophysiology:
- name: Biallelic Truncating KNG1 Variant
  description: >-
    Both KNG1 alleles carry a nonsense, frameshift or splice change producing
    a premature stop codon. The truncated product loses the C-terminal light
    chain, which is where both of HK's cofactor functions live.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline and biallelic, homozygous or compound heterozygous. zygosity is
      deliberately omitted rather than set to HOMOZYGOUS, because ZygosityEnum
      offers no biallelic value and either specific value would be wrong for
      some of the reported patients. Every
      reported deficiency-causing allele is truncating; the single reported
      missense allele of this gene causes a different disease.
  molecular_functions:
  - preferred_term: high-molecular-weight kininogen binding to the gC1qR contact-system receptor
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005102
      label: signaling receptor binding
  genes:
  - preferred_term: KNG1
    term:
      id: hgnc:6383
      label: KNG1
  downstream:
  - target: Absent Plasma High-Molecular-Weight Kininogen
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32185598
      reference_title: "Severe high-molecular-weight kininogen deficiency due to a homozygous c.1456C > T nonsense variant in a large Chinese family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The propositus had less than 1% HMWK procoagulant activity."
      explanation: The measured consequence of the homozygous nonsense allele in the index patient.
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten HK deficiency-causing variants (one new) were identified. All of them were truncating mutations"
    explanation: Establishes the allele class of the initiating lesion.
- name: Absent Plasma High-Molecular-Weight Kininogen
  description: >-
    Procoagulant HK activity falls below 1%. HK is a multidomain cystatin
    superfamily protein; its light chain carries domain 5, which binds anionic
    surfaces and the endothelial receptor gC1qR in a zinc-dependent way, and
    domain 6, which binds prekallikrein and factor XI. Truncation removes
    both, so the protein that remains cannot act as a cofactor even where it
    is present.
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  downstream:
  - target: Failure to Scaffold Prekallikrein and Factor XI on Anionic Surfaces
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31858768
      reference_title: "The First Korean Case of High-Molecular-Weight Kininogen Deficiency, With a Novel Variant, c.488delG, in the KNG1 Gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "non-enzymatic cofactor for kallikrein binding to negativelycharged phospholipids"
      explanation: >-
        States the cofactor role whose loss is the next step. The source runs
        two words together and is quoted as printed.
  evidence:
  - reference: PMID:40638675
    reference_title: "Structure and interactions of the proteins from the contact system."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "central to the function of both arms of the system as a substrate for plasma kallikrein and critical cofactor, which forms interactions with cell receptors and activators"
    explanation: The dual role of HK, as the cleaved substrate and as the scaffolding cofactor.
- name: Failure to Scaffold Prekallikrein and Factor XI on Anionic Surfaces
  description: >-
    Without HK, prekallikrein and factor XI are not carried to the activating
    surface. The physiological assembly runs through gC1qR, which clusters
    factor XII and HK into a higher-order ternary complex and so acts as a
    chaperone bringing the contact factors together; that clustering is the
    prelude to both bradykinin generation and intrinsic-pathway coagulation.
    With no HK there is no such complex.
  biological_scale: MOLECULAR
  node_class: SIGNALLING_REDUCED_FAILED
  biological_processes:
  - preferred_term: plasma kallikrein-kinin cascade
    modifier: DECREASED
    term:
      id: GO:0002353
      label: plasma kallikrein-kinin cascade
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: Secondary Reduction of Prekallikrein and Factor XI
    causal_link_type: DIRECT
  - target: Failure of Contact Activation of the Intrinsic Pathway
    causal_link_type: DIRECT
  - target: Reduced Bradykinin Generation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32559765
    reference_title: "Factor XII and kininogen asymmetric assembly with gC1qR/C1QBP/P32 is governed by allostery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gel filtration experiments reveal that gC1qR clusters FXII and HK into a higher-order 500-kDa ternary complex."
    explanation: The assembly step that requires HK and so cannot occur without it.
  - reference: PMID:32559765
    reference_title: "Factor XII and kininogen asymmetric assembly with gC1qR/C1QBP/P32 is governed by allostery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results support the conclusion that extracellular gC1qR can act as a chaperone to cluster contact factors, which may be a prelude for initiating the cascades that drive bradykinin generation and the intrinsic pathway of coagulation."
    explanation: >-
      Identifies the clustering step as upstream of both branches this entry
      draws from this node.
- name: Secondary Reduction of Prekallikrein and Factor XI
  description: >-
    Prekallikrein and factor XI circulate bound to HK. With no HK to carry
    them they are present at reduced plasma levels, which is a consequence of
    this disease rather than a second coagulation defect. The systematic
    review names this as the specific route to misdiagnosis, because a panel
    showing low prekallikrein and low factor XI next to a long aPTT reads
    like a different disorder.
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  downstream:
  - target: Decreased Circulating Prekallikrein
    causal_link_type: DIRECT
  - target: Reduced Factor XI Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with HK deficiency appeared asymptomatic and had decreased levels of prekallikrein and factor XI, which could lead to misdiagnosis."
    explanation: The secondary deficiencies and the clinical hazard they create.
  - reference: PMID:32185598
    reference_title: "Severe high-molecular-weight kininogen deficiency due to a homozygous c.1456C > T nonsense variant in a large Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prekallikrein (PK) activity was also reduced in the propositus and two of his younger sisters with severe HMWK deficiency."
    explanation: The secondary prekallikrein reduction measured in a family.
- name: Failure of Contact Activation of the Intrinsic Pathway
  description: >-
    The reciprocal activation of factor XII and prekallikrein on a surface,
    and the onward activation of factor XI, cannot proceed efficiently. This
    is what the activated partial thromboplastin time measures, so the assay
    is markedly prolonged. It corrects on 1:1 mixing with normal plasma,
    because the missing component is a factor and not an inhibitor, which is
    the step that separates this from an acquired inhibitor.
  biological_scale: MOLECULAR
  node_class: SIGNALLING_REDUCED_FAILED
  biological_processes:
  - preferred_term: blood coagulation, intrinsic pathway
    modifier: DECREASED
    term:
      id: GO:0007597
      label: blood coagulation, intrinsic pathway
  downstream:
  - target: Isolated Prolonged aPTT
    causal_link_type: DIRECT
  - target: Preserved Haemostasis
    causal_link_type: DIRECT
    description: >-
      The branch that makes this disease benign: the contact arm is not what
      physiological clotting runs on, so losing it costs nothing in vivo.
  evidence:
  - reference: PMID:31858768
    reference_title: "The First Korean Case of High-Molecular-Weight Kininogen Deficiency, With a Novel Variant, c.488delG, in the KNG1 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kallikrein activates factor XII, which then activates factor XI, leading to activation of the intrinsic coagulationpathway"
    explanation: >-
      The cascade whose first step requires HK. The source's own text runs two
      words together and is quoted as printed.
- name: Preserved Haemostasis
  description: >-
    Physiological clotting is driven by tissue factor and factor VIIa with
    thrombin feedback, not by contact activation, so the loss of the contact
    arm leaves haemostasis intact. This node exists to carry an explicitly
    negative finding: affected people do not bleed, and the absence of a
    bleeding phenotype is the clinically important fact about this disease
    rather than a gap in its curation.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with HK deficiency appeared asymptomatic"
    explanation: >-
      The clinical observation, in the largest assembled series, that
      haemostasis and health are unaffected.
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has an apparently good prognosis but is prone to misdiagnosis."
    explanation: The prognosis, and the hazard that replaces it.
- name: Reduced Bradykinin Generation
  description: >-
    The other arm of the contact system. Plasma kallikrein cleaves HK to
    release bradykinin, which acts on endothelial B1 and B2 receptors to
    produce vasodilation, increased vascular permeability and oedema. Without
    HK there is no substrate, so this arm is blunted. In mouse models that
    loss is protective rather than harmful, which is the observation behind
    the idea that the contact system is a safe antithrombotic drug target. No
    human phenotype is attributed to it here.
  biological_scale: MOLECULAR
  node_class: METABOLITE_DEPLETION
  biological_processes:
  - preferred_term: bradykinin biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0002936
      label: bradykinin biosynthetic process
  evidence:
  - reference: PMID:40638675
    reference_title: "Structure and interactions of the proteins from the contact system."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "central to the function of both arms of the system as a substrate for plasma kallikrein and critical cofactor, which forms interactions with cell receptors and activators"
    explanation: >-
      HK is the substrate plasma kallikrein cleaves, which is the step that
      generates bradykinin. With no HK there is no substrate, so this is what
      supports the node, rather than a quote describing what bradykinin does
      once made.
  - reference: PMID:42446942
    reference_title: "Bradykinin contributes to vasogenic edema in murine experimental cerebral malaria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BK-induced vasogenic edema contributes to human and murine CM"
    explanation: >-
      Secondary context, identifying the downstream effect of bradykinin that
      is absent in this deficiency. Not cited for a claim about this disease.
animal_models:
- name: Kng1-null mouse in experimental cerebral malaria
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Kng1-/-
  publication: PMID:42446942
  description: >-
    The HK-null mouse, used here in Plasmodium berghei ANKA experimental
    cerebral malaria. It is the model behind this entry's statement that
    losing HK is protective rather than harmful: Kng1-/- mice were
    significantly protected from neurologic deterioration and brain edema
    compared with wild-type, alongside bradykinin receptor knockouts, which is
    what places the protection on the bradykinin arm.
  genes:
  - preferred_term: Kng1
    term:
      id: MGI:1097705
      label: Kng1
  modeled_mechanisms:
  - target: Reduced Bradykinin Generation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Removes the bradykinin substrate in vivo and shows the consequence,
      which under a disease challenge is protection.
    limitations: >-
      The readout is a severe infectious challenge rather than anything an
      affected person experiences, so the model shows that the bradykinin arm
      is lost, not that any human phenotype follows from losing it.
    evidence:
    - reference: PMID:42446942
      reference_title: "Bradykinin contributes to vasogenic edema in murine experimental cerebral malaria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "HK-null (Kng1-/-), combined BK B1- and B2 receptor-null (Bdkrb1-/-Bdkrb2-/-), BK B2 receptor-null (Bdkrb2-/-), or BK B1 receptor-null (Bdkrb1-/-) mice were protected significantly from neurologic deterioration and brain edema compared with wild-type mice."
      explanation: >-
        HK-null mice protected to the same extent as bradykinin receptor
        knockouts, which attributes the protection to loss of the bradykinin
        arm rather than to something else about the gene.
  evidence:
  - reference: PMID:42446942
    reference_title: "Bradykinin contributes to vasogenic edema in murine experimental cerebral malaria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HK-null (Kng1-/-), combined BK B1- and B2 receptor-null (Bdkrb1-/-Bdkrb2-/-), BK B2 receptor-null (Bdkrb2-/-), or BK B1 receptor-null (Bdkrb1-/-) mice were protected significantly from neurologic deterioration and brain edema compared with wild-type mice."
    explanation: Establishes the model and its protected phenotype.
phenotypes:
- category: Laboratory
  name: Isolated Prolonged aPTT
  description: >-
    A markedly prolonged activated partial thromboplastin time with a normal
    prothrombin time, present from birth and correcting on 1:1 mixing with
    normal plasma. It is essentially the whole of the disease's presentation:
    in every reported case the deficiency was found during the work-up of an
    unexplained long aPTT rather than because of a symptom.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Prolonged partial thromboplastin time
    term:
      id: HP:0003645
      label: Prolonged partial thromboplastin time
  evidence:
  - reference: PMID:32185598
    reference_title: "Severe high-molecular-weight kininogen deficiency due to a homozygous c.1456C > T nonsense variant in a large Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 67-year-old asymptomatic male with an isolated prolonged activated partial thromboplastin time (aPTT) was recognized to have HMWK deficiency."
    explanation: >-
      The characteristic mode of discovery, in an asymptomatic man found at
      67 years of age.
- category: Laboratory
  name: Severely Reduced High-Molecular-Weight Kininogen Activity
  description: >-
    Procoagulant HK activity below 1% of normal, which is the defining
    laboratory criterion for the severe deficiency. Reported values include
    less than 1% and 0.9%.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: high-molecular-weight kininogen procoagulant activity below 1% of normal
    term:
      id: HP:0001928
      label: Abnormality of coagulation
    coarse_binding_basis: NO_HPO_TERM
  notes: >-
    HPO has no term for high-molecular-weight kininogen activity. An OLS
    search of HPO for "kininogen" returns nothing, and the nearest specific
    coagulation-factor terms are for other factors. The binding is therefore
    the coarse parent, with the analyte named in the phenotype name and
    description.
  evidence:
  - reference: PMID:32185598
    reference_title: "Severe high-molecular-weight kininogen deficiency due to a homozygous c.1456C > T nonsense variant in a large Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The propositus had less than 1% HMWK procoagulant activity."
    explanation: The measured deficit in an index case.
  - reference: PMID:24492696
    reference_title: "A novel frameshift mutation in exon 4 causing a deficiency of high-molecular-weight kininogen in a patient with splenic infarction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HMWK activity of the proband was markedly decreased (0.9%)."
    explanation: An independently reported value in the same range.
- category: Laboratory
  name: Decreased Circulating Prekallikrein
  description: >-
    A secondary reduction in plasma prekallikrein, because prekallikrein
    circulates bound to HK and is not retained without it. It is a
    consequence of the deficiency, not a second disorder, and is one half of
    the pattern that leads to misdiagnosis.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Decreased circulating prekallikrein concentration
    term:
      id: HP:0034371
      label: Decreased circulating prekallikrein concentration
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with HK deficiency appeared asymptomatic and had decreased levels of prekallikrein and factor XI, which could lead to misdiagnosis."
    explanation: The secondary prekallikrein reduction across the assembled series.
- category: Laboratory
  name: Reduced Factor XI Activity
  description: >-
    A secondary reduction in factor XI, for the same reason as the
    prekallikrein reduction: factor XI circulates bound to HK. This is the
    half of the pattern most likely to be mistaken for a real bleeding
    disorder, since factor XI deficiency is one.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Reduced factor XI activity
    term:
      id: HP:0001929
      label: Reduced factor XI activity
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had decreased levels of prekallikrein and factor XI, which could lead to misdiagnosis"
    explanation: The secondary factor XI reduction and the diagnostic hazard it creates.
diagnosis:
- name: Mixing Study and Specific Contact Factor Assays
  description: >-
    The work-up of an isolated prolonged aPTT: a 1:1 mix with normal plasma
    corrects the time, which excludes an inhibitor, and specific factor assays
    then identify which contact factor is missing. The distinction that
    matters is between the three benign contact deficiencies, of HK, of
    prekallikrein and of factor XII, and between all of them and factor XI
    deficiency, which does cause bleeding. Measuring HK activity directly is
    what settles it.
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activity and antigen levels of coagulation factors were determined."
    explanation: The assay approach used to characterise the cases in the systematic review.
- name: KNG1 Sequencing
  description: >-
    Sanger sequencing of KNG1, with KLKB1 sequenced alongside it to exclude
    prekallikrein deficiency, gives the precise diagnosis and allows family
    members to be tested.
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses of KNG1 and KLKB1 were performed by Sanger sequencing."
    explanation: The molecular method, including the gene sequenced to exclude the main differential.
  - reference: PMID:32185598
    reference_title: "Severe high-molecular-weight kininogen deficiency due to a homozygous c.1456C > T nonsense variant in a large Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing to identify the KGN1 mutation provides a precise diagnosis for the patient and other family members."
    explanation: >-
      The value of molecular confirmation for the proband and relatives. The
      gene symbol is misspelled in the source and is quoted as printed.
differential_diagnoses:
- name: Prekallikrein deficiency
  description: >-
    The closest differential. Also autosomal recessive, also a benign contact
    deficiency with an isolated prolonged aPTT and no bleeding, and HK
    deficiency lowers prekallikrein secondarily, so the two can look
    identical on a factor panel. The systematic review sequenced KLKB1
    alongside KNG1 for exactly this reason.
- name: Factor XII deficiency
  description: >-
    The third benign contact deficiency, with the same isolated prolonged
    aPTT and the same absence of bleeding. Distinguished by specific factor
    assay.
- name: Factor XI deficiency
  description: >-
    The one that is not benign. HK deficiency lowers factor XI secondarily,
    so a panel can suggest factor XI deficiency, which does cause bleeding
    and is treated. Getting this distinction wrong in the direction of
    over-treatment is the principal clinical risk of HK deficiency.
- name: KNG1-related hereditary angioedema
  description: >-
    The same gene, the opposite direction of effect. A KNG1 missense
    substitution causes bradykinin-mediated hereditary angioedema by
    increasing pathway activity, where the truncating alleles of this entry
    abolish it. A KNG1 variant on a report does not indicate which disease is
    present; the variant class does.
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas the only known HK amino acid substitution with a relevant phenotype instead causes hereditary angioedema"
    explanation: States the contrast between the two KNG1 phenotypes.
  - reference: PMID:39773511
    reference_title: "Advances in the Pathogenesis of Hereditary Angioedema."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "plasminogen,angiopoietin-1,kininogen,heparan sulfate 3-O-sulfotransferase 6,and myoferlin in HAE"
    explanation: >-
      A review of hereditary angioedema pathogenesis, cited because it lists
      kininogen among the genes in which pathogenic variants cause HAE, which
      is what makes this differential a question about the same gene. The
      source prints its list without spaces after the commas and is quoted as
      printed; the adjacent factor XII item is left out of the quote because
      the abstract spells it with a fullwidth Roman numeral.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: hk_deficiency_thrombotic_reports
  prompt: >-
    Are the thrombotic and ischaemic events reported in a few HK-deficient
    individuals, such as splenic infarction, related to the deficiency, or
    coincidental in a very small ascertained population?
  rationale: >-
    The question cannot be answered with 48 published cases, which is why
    this is recorded as a gap and not as a phenotype. Mechanistically the
    expectation points the other way: mouse Kng1 knockouts are protected from
    ischaemic stroke and from experimental cerebral malaria without a
    bleeding penalty, which is the basis for developing contact-system
    inhibitors as antithrombotics. A patient population that is protected in
    the model and has been reported with infarction is exactly the situation
    that needs a denominator. The review's authors say an international
    prekallikrein and HK deficiency registry is being established to fill
    this gap, which is the right instrument for it.
  attaches_to:
  - pathophysiology#Preserved Haemostasis
  - pathophysiology#Reduced Bradykinin Generation
  evidence:
  - reference: PMID:36700498
    reference_title: "Severe high-molecular-weight kininogen deficiency: clinical characteristics, deficiency-causing KNG1 variants, and estimated prevalence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our understanding of its clinical implications is still limited, and an international prekallikrein and HK deficiency registry is being established to fill this knowledge gap."
    explanation: The authors' own statement of the gap and of the instrument intended to close it.

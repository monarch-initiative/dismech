      explanation: Report of this allele. The gene symbol is misspelled in the source and is quoted as printed.
  - name: c.523_524insTC (p.Ser175Serfs)
    description: >-
      A two-base insertion in exon 4 producing a frameshift and a premature
      stop at residue 183. The homozygous proband had 0.9% HK activity; his
      three heterozygous children had partially reduced activity.
    type: frameshift variant
    gene:
      preferred_term: KNG1
      term:
        id: hgnc:6383
        label: KNG1
    evidence:
    - reference: PMID:24492696
      reference_title: "A novel frameshift mutation in exon 4 causing a deficiency of high-molecular-weight kininogen in a patient with splenic infarction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Direct sequencing of his HMWK gene showed a homozygous \"TC\" insertion at c523-524 in exon 4. This insertion led to an amino acid substitution, Ser175Ser, resulting in a frameshift mutation and a premature stop codon in amino acid 183."
      explanation: Report of this allele and its consequence at the protein level.

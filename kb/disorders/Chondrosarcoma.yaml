genetic:
- name: IDH1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: IDH1
    term:
      id: hgnc:5382
      label: IDH1
  subtype: Primary Central
  notes: >-
    Somatic IDH1 mutations are the commonest recurrent genetic event in
    conventional central chondrosarcoma. They are neomorphic rather than
    inactivating: the mutant enzyme generates the oncometabolite
    D-2-hydroxyglutarate, which is the mechanism modelled in the pathophysiology
    chain of this entry. No prognostic claim is attached to IDH status here: the
    sequencing cohort cited below found no survival difference by IDH mutation,
    and the multi-omics series cited on the IDH2 record reports the same.
  evidence:
  - reference: PMID:30296521
    reference_title: >-
      IDH mutation status in a series of 88 head and neck chondrosarcomas:
      different profile between tumors of the skull base and tumors involving
      the facial skeleton and the laryngotracheal tract.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Central conventional chondrosarcoma is the most common subtype and is
      associated with isocitrate dehydrogenase 1 and 2 (IDH1 and IDH2) gene
      mutations in 50% to 60% of cases.
    explanation: >-
      This human series establishes recurrent IDH1 mutation in central
      conventional chondrosarcoma and gives its frequency.
  - reference: PMID:37747813
    reference_title: >-
      Clinico-Genomic Profiling of Conventional and Dedifferentiated
      Chondrosarcomas Reveals TP53 Mutation to Be Associated with Worse
      Outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IDH1 and IDH2 mutations are prevalent in chondrosarcoma (50.5%), more
      common in chondrosarcomas arising in the extremities, associated with
      higher age at diagnosis, and more common in dedifferentiated
      chondrosarcomas compared with grades 1-3 conventional chondrosarcoma.
    explanation: >-
      An independent next-generation-sequencing cohort reproduces the IDH1/IDH2
      mutation frequency and reports its distribution across histologic grade.
  case_fractions:
  - population: >-
      93 patients with conventional or dedifferentiated chondrosarcoma with
      clinical next-generation sequencing data (MD Anderson)
    case_fraction_percent: 50.5
    cohort_size: 93
    notes: >-
      Reported jointly for IDH1 and IDH2; the study does not separate the two
      genes in this figure.
    evidence:
    - reference: PMID:37747813
      reference_title: >-
        Clinico-Genomic Profiling of Conventional and Dedifferentiated

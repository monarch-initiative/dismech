- accession: geo:GSE289237
  title: Effect of overexpression of HMGA2 in human chondrosarcoma SW1353 cell line overexpression and control cells.
  description: Chondrosarcoma (CHS) is a malignant bone tumour resistant to adjuvant treatment, with high-grade patients suffering an unfavorable prognosis. The high mobility group A2 (HMGA2) protein is a non‑histone architectural transcription factor influencing a variety of biological processes, including the cell cycle process, DNA damage repair process, apoptosis, senescence and epithelial‑mesenchymal transition. We here aimed to investigate the role of HMGA2 in CHS.

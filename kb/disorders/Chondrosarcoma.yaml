- accession: ega:EGAS00001007042
  title: Methylation-based classification of human mesenchymal chondrosarcoma
  description: We applied methylome and copy number profiling to a set of 45 well characterized MCS cases to evaluate their potential diagnostic value. Notably, the findings were reproducible also when analysing the round cell and cartilaginous component separately. Furthermore, four outliers were identified by methylome profiling for which the diagnosis had to be revised. Methylome profiling represents a sensitive, specific and reliable tool to support the diagnosis of MCS, particularly if only the round cell component is obtained in a biopsy and the diagnosis is not suspected. It can furthermore aid in confirming the diagnosis in case RNA sequencing for the HEY1::NCOA2 fusion transcript is not available.

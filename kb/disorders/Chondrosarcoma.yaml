  - reference: PMID:32208957
    reference_title: >-
      Phase I Study of the Mutant IDH1 Inhibitor Ivosidenib: Safety and Clinical
      Activity in Patients With Advanced Chondrosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

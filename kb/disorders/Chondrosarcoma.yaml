- accession: geo:GSE302248
  title: BCAT1 as a critical regulator of human chondrosarcoma progression and differentiation through enzymatic and non-enzymatic mechanisms
  description: Human chondrosarcoma is a malignant bone tumor with a poor prognosis due to its resistance to conventional therapies. In this study, we investigated the role of Branched-Chain Amino Acid Transaminase 1 (BCAT1) in chondrosarcoma pathogenesis. BCAT1 depletion impairs proliferation and tumorigenicity both in vitro and in vivo in a xenograft model, underscoring its oncogenic role. Transcriptome analyses revealed that BCAT1 suppresses the chondrocyte differentiation pathway by inhibiting the expression of SOX9, a master regulator of normal chondrogenesis, through epigenetic regulation.

- accession: geo:GSE299759
  title: An integrated clinical genomic and transcriptomic subgrouping of central chondrosarcoma
  description: Chondrosarcoma, a malignant cartilage-producing bone tumor, is the second most-common bone sarcoma. Chondrosarcomas are histologically graded, which is so far the best predictor of survival. Early mutations in isocitrate dehydrogenase (IDH)-1 and -2 genes are frequent, leading to the production of the oncometabolite D-2-hydroxyglutarate, which affects DNA methylation, resulting in a preferred chondrogenic differentiation over osteogenic differentiation of mesenchymal stem cells, which are currently considered the precursor cells of chondrosarcomas.

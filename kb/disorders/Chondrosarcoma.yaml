- name: EXT1
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  gene_term:
    preferred_term: EXT1
    term:
      id: hgnc:3512
      label: EXT1
  subtype: Secondary Peripheral
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Germline heterozygous EXT1 loss causes hereditary multiple osteochondromas,
    not chondrosarcoma directly; that disease is curated separately in
    kb/disorders/Hereditary_Multiple_Osteochondromas.yaml, which carries the
    germline arm and stops at the transformation threshold. Chondrosarcoma
    arises as secondary peripheral malignant transformation of an osteochondroma
    in a minority of carriers, so
    the relationship recorded here is RISK_FACTOR rather than CAUSATIVE: an EXT1
    variant is neither necessary (the commonest presentation in the cohorts cited
    in this entry is sporadic central conventional disease) nor sufficient (both
    lifetime transformation estimates quoted below are well under half). The two sources cited give
    different transformation estimates (0.5-5% and ~2%-10%); both are quoted
    rather than reconciled.
  evidence:
  - reference: PMID:20301413
    reference_title: "Hereditary Multiple Osteochondromas."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of HMO is established in a proband with characteristic
      radiographic findings of multiple osteochondromas and/or a heterozygous
      pathogenic variant in EXT1 or EXT2 identified on molecular genetic testing.
    explanation: >-
      GeneReviews establishes that germline EXT1 variants define hereditary
      multiple osteochondromas, the precursor condition rather than the sarcoma.
  - reference: PMID:20301413
    reference_title: "Hereditary Multiple Osteochondromas."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The risk for malignant transformation to osteochondrosarcoma increases with
      age, although the lifetime risk for malignant transformation is low
      (~2%-10%).
    explanation: >-
      Quantifies the incomplete penetrance of chondrosarcoma in EXT1/EXT2
      carriers, which is the basis for recording this as a risk relationship
      rather than a causative one.
  - reference: PMID:18271966
    reference_title: "Multiple osteochondromas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In almost 90% of MO patients germline mutations in the tumour suppressor
      genes EXT1 or EXT2 are found.
    explanation: >-
      Independent review giving the germline EXT1/EXT2 detection rate in the
      precursor condition.

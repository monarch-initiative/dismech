- name: Reduced Basal Autophagy
  biological_scale: CELLULAR
  description: >
    In cell lines EXOC6B promotes basal autophagy through AMPK activation and
    mTOR inhibition, and this autophagy is what lengthens the primary cilium.
    The portion of the protein beyond Tyr302, absent from the founding nonsense
    allele, is required for the effect. Reduced autophagy in patient cells has
    not been measured directly.
  biological_processes:
  - preferred_term: autophagy
    modifier: DECREASED
    term:
      id: GO:0006914
      label: autophagy
  evidence:
  - reference: PMID:42068746
    reference_title: "EXOC6B promotes cilial elongation via autophagy-dependent protein turnover."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of clinically reported mutations in EXOC6B gene showed that the
      region beyond amino acid Tyr302 is critical for interaction with ciliary
      proteins, induction of basal autophagy and cilia length enhancement.
    explanation: Ties the autophagy function to the region lost in a patient allele.
  downstream:
  - target: Impaired Primary Ciliogenesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - exoc6b_ciliopathy
    evidence:
    - reference: PMID:42068746

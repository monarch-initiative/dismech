name: Spondyloepimetaphyseal Dysplasia with Joint Laxity Type 3
creation_date: "2026-09-29T21:00:00Z"
category: Mendelian
description: >
  Spondyloepimetaphyseal dysplasia with joint laxity type 3 (SEMDJL3,
  EXOC6B-SEMD-JL) is an ultra-rare autosomal recessive skeletal dysplasia caused
  by biallelic loss-of-function variants in EXOC6B, which encodes a subunit of the
  octameric exocyst complex that tethers post-Golgi secretory vesicles to the
  plasma membrane. Its defining feature is multiple joint dislocations present at
  birth, always including the hips and knees, together with generalized joint
  laxity, genu valgum, postnatal growth deficiency, spinal deformity and slender
  fingers. Radiographs show delayed carpal and tarsal ossification, gracile short
  tubular bones, epiphyseal and metaphyseal dysplasia, slender ribs and a spondylar
  dysplasia with irregular end plates, lumbar interpedicular narrowing and modest
  platyspondyly. One reported individual also had intellectual disability with
  hydrocephalus and a thin corpus callosum.

  The mechanism is only partly characterised. Patient fibroblasts show loss of
  exocytosis and impaired primary ciliogenesis, and Exoc6b knockdown in a mouse
  prechondrocyte line attenuates Hedgehog signalling and disturbs chondrocyte
  differentiation markers, which has led the field to propose SEMDJL3 as a
  skeletal ciliopathy. How these cellular defects produce joint dislocation and
  the specific radiographic pattern has not been shown, and the entry records
  those steps as unknown intermediates. Management is orthopaedic and supportive.
synonyms:
- spondyloepimetaphyseal dysplasia with joint laxity, EXOC6b type
- SEMDJL3
- EXOC6B-related spondyloepimetaphyseal dysplasia with joint laxity
- EXOC6B-SEMD-JL
- SEMD-JL3

mechanistic_hypotheses:
- hypothesis_group_id: exoc6b_ciliopathy
  hypothesis_label: Skeletal Ciliopathy Model
  status: EMERGING
  description: >-
    Loss of EXOC6B impairs primary cilium formation, through loss of exocytosis
    and possibly loss of autophagy-driven cilium elongation, which attenuates
    cilium-dependent Hedgehog signalling in prechondrocytes and disturbs
    chondrocyte differentiation. The same cilium defect is proposed to explain
    the central nervous system anomalies in one patient. Evidence is from one
    patient fibroblast study, a knockdown mouse chondrogenic cell line and
    engineered human cell lines; there is no animal model.
  evidence:
  - reference: PMID:36150098
    reference_title: "Biallelic loss-of-function variants in EXOC6B are associated with impaired primary ciliogenesis and cause spondylo-epi-metaphyseal dysplasia with joint laxity type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SEMDJL3 with biallelic pathogenic variants in EXOC6B might represent yet
      another ciliopathy with central nervous system involvement and joint
      dislocations.
    explanation: The authors' statement of the ciliopathy model.
- hypothesis_group_id: exocyst_kif22_vesicle_transport
  hypothesis_label: Shared Vesicle-Transport Model with KIF22 SEMD-JL
  status: EMERGING
  description: >-
    The discoverers proposed that EXOC6B-related and KIF22-related SEMD-JL share a
    pathogenic mechanism because both proteins act on post-Golgi vesicle
    transport to the plasma membrane. This is inferred from clinical overlap and
    protein function, not from experiments.
  evidence:
  - reference: PMID:26669664
    reference_title: "A novel multiple joint dislocation syndrome associated with a homozygous nonsense variant in the EXOC6B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As transport of vesicles from the golgi apparatus to the plasma membrane
      occurs through kinesin motor proteins along microtubule tracks, the
      function of EXOC6B is linked to KIF22 suggesting a common pathogenic
      mechanism in skeletal dysplasias with joint laxity and dislocations.
    explanation: The source of the hypothesis.

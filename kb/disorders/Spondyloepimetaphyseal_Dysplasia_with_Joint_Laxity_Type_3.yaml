    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "EXOC6B-SEMD-JL is inherited in autosomal recessive manner."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:26669664
    reference_title: "A novel multiple joint dislocation syndrome associated with a homozygous nonsense variant in the EXOC6B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single-nucleotide polymorphism array analysis and whole-exome sequencing in
      the two affected siblings revealed a shared homozygous nonsense variant
    explanation: >-
      Homozygosity in affected sibs of a consanguineous couple, the founding
      family for recessive inheritance.

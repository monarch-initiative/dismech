discussions:
- discussion_id: semdjl3_joint_dislocation_mechanism_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    What connects loss of EXOC6B to congenital dislocation and laxity of the large
    joints?
  attaches_to:
  - pathophysiology#Impaired Exocyst-Mediated Exocytosis
  - phenotypes#Multiple joint dislocation
  - phenotypes#Generalized joint hypermobility
  rationale: >
    The only mechanistic statement bearing on the joints is the discoverers'
    suggestion of a shared vesicle-transport mechanism with KIF22 SEMD-JL, which is
    an inference from clinical overlap. The cellular studies examined fibroblasts,
    a mouse prechondrocyte line and HEK 293T cells; none examined ligament, joint
    capsule, tendon or growth-plate tissue, and there is no animal model. Reduced
    extracellular-matrix pathway activity in patient fibroblasts is a plausible
    lead for ligamentous laxity but has not been connected to it.
- discussion_id: semdjl3_ciliopathy_model_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is SEMDJL3 a skeletal ciliopathy, and does the cilium defect explain both the
    skeletal and the central nervous system findings?
  attaches_to:
  - pathophysiology#Impaired Primary Ciliogenesis
  - pathophysiology#Attenuated Hedgehog Signaling in Prechondrocytes
  - phenotypes#Intellectual disability
  rationale: >
    Impaired ciliogenesis has been shown in fibroblasts from one patient and in
    engineered cell lines, and Hedgehog attenuation only in a knockdown mouse
    prechondrocyte line. The central nervous system anomalies were seen in a single
    individual. Two routes from EXOC6B to the cilium have been proposed, loss of
    exocytosis and loss of autophagy-driven cilium elongation, and they have not
    been compared in the same system.
notes: >
  A GeneReviews chapter exists (PMID:37229238) and is the phenotype baseline for
  this entry; only its abstract is cached, so its phenotype tables were not
  available for frequency bands beyond the hip and knee dislocation statement.
  Campos-Xavier et al. 2018 ("Confirmation of spondylo-epi-metaphyseal dysplasia
  with joint laxity, EXOC6B type", PMID:30284759) reports a further family but has
  no abstract in PubMed, so it is not cited. The perplexity deep-research report
  attributes that family to PMID:36150098, which is the Simsek-Kiper 2022 series.

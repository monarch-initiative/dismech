inheritance:
- name: Autosomal Recessive
  description: >
    Biallelic EXOC6B variants, found as homozygous alleles in consanguineous
    families. Reported alleles include the nonsense variant p.(Tyr302*), the
    missense c.401T>G, a multi-exon intragenic deletion and a frameshift
    p.Gly632Metfs*11.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37229238

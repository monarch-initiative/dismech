genetic:
- name: EXOC6B
  notes: >
    EXOC6B (2p13.2) encodes exocyst complex component 6B (Sec15b). All reported
    pathogenic alleles are biallelic and predicted loss of function. A cell study
    reports that the region C-terminal to Tyr302, the residue truncated by the
    founding nonsense allele, is required for interaction with ciliary proteins.
  gene_term:
    preferred_term: EXOC6B
    term:
      id: hgnc:17085
      label: EXOC6B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:26669664
    reference_title: "A novel multiple joint dislocation syndrome associated with a homozygous nonsense variant in the EXOC6B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single-nucleotide polymorphism array analysis and whole-exome sequencing in
      the two affected siblings revealed a shared homozygous nonsense variant
    explanation: >-
      The founding report; the variant it names is the EXOC6B p.(Tyr302*)
      nonsense allele. The quote stops before the bracketed HGVS notation, which
      the snippet matcher strips.
  - reference: PMID:36150098
    reference_title: "Biallelic loss-of-function variants in EXOC6B are associated with impaired primary ciliogenesis and cause spondylo-epi-metaphyseal dysplasia with joint laxity type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we report two additional affected individuals from unrelated
      families with biallelic pathogenic variants,
      c.2122+15447_2197-59588del and c.401T>G in EXOC6B identified by exome
      sequencing.
    explanation: Independent families with different biallelic alleles confirm the gene-disease link.
  - reference: PMID:42231408
    reference_title: "From wheelchair to walking: first reported case in Saudi Arabia of transformative orthopedic surgery in a patient with spondyloepimetaphyseal dysplasia with joint laxity type 3 due to EXOC6B mutation-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-genome sequencing performed by Arcensus GmbH (Rostock, Germany) using
      the myLifeGenome™ platform identified a homozygous likely pathogenic
      frameshift variant in the EXOC6B gene (NM_015189.3: c.1894_1895insACTAT;
      p.Gly632Metfs*11), classified PVS1 and PM2 per ACMG/ClinGen criteria.
    explanation: A further homozygous truncating allele in an unrelated family.

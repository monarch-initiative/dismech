diagnosis:
- name: Clinical and radiographic assessment with molecular confirmation
  description: >
    The diagnosis rests on the characteristic clinical and radiographic picture
    together with biallelic pathogenic EXOC6B variants. Exome or genome
    sequencing has been the route to diagnosis in reported families, including
    detection of a large intragenic deletion.
  evidence:
  - reference: PMID:37229238
    reference_title: "EXOC6B-Related Spondyloepimetaphyseal Dysplasia with Joint Laxity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of EXOC6B-SEMD-JL is established in a proband with
      characteristic clinical and radiographic features and biallelic pathogenic
      variants in EXOC6B identified by molecular genetic testing.
    explanation: GeneReviews diagnostic criteria.
differential_diagnoses:
- name: SEMD with joint laxity, leptodactylic type (KIF22)
  description: >
    The closest phenocopy: multiple dislocations, joint laxity and leptodactyly,
    but inherited as an autosomal dominant disorder from recurrent KIF22 missense
    variants rather than biallelic EXOC6B loss of function.
  evidence:
  - reference: PMID:26669664
    reference_title: "A novel multiple joint dislocation syndrome associated with a homozygous nonsense variant in the EXOC6B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This condition has clinical overlap with autosomal dominantly inherited SEMD
      with joint laxity, leptodactylic type caused by recurrent missense variants
      in the kinesin family member 22 gene (KIF22).
    explanation: States the overlap and the genetic distinction.

- name: Medication and reproductive precautions
  description: >-
    Avoid oral estrogen because of severe hypertriglyceridemia and pancreatitis risk. Consider nonhormonal
    or progestin-only contraception; use transdermal estrogen if replacement is needed. Avoid niacin, which
    can worsen insulin resistance. Thiazolidinedione benefits in partial lipodystrophy should not be transferred
    to CGL without caution.
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Oral estrogens are contraindicated in lipodystrophy syndromes due to the risk of severe hypertriglyceridemia
      and acute pancreatitis.
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      If estrogen replacement is needed, transdermal estrogen should be used.
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:26239609
    reference_title: Congenital generalized lipodystrophies--new insights into metabolic dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Niacin exacerbates insulin resistance and should be avoided.
    explanation: >-
      Disease-specific clinical synthesis.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Thiazolidinediones may improve metabolic complications in partial lipodystrophy but should only be used
      with caution in generalized lipodystrophy.
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
- name: Specialist reproductive and pregnancy care
  description: >-
    Evaluate menstrual dysfunction and fertility, and coordinate high-risk pregnancy care for diabetes and
    triglycerides. Metreleptin continuation or withdrawal during pregnancy requires individualized specialist
    assessment because fetal data are limited and withdrawal may worsen metabolic disease.
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Pregnant patients should receive prenatal care from an obstetrician experienced in managing diabetes
      and a physician experienced in managing lipodystrophy.
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
- name: Psychological and developmental support
  description: >-
    Offer support for distress, body-image concerns and stigma; provide educational support when intellectual
    impairment is present. Reconstructive consultation may be appropriate for functional or appearance concerns.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:41713690
    reference_title: 'Clinical Guidelines for the Diagnosis and Management of Generalized and Partial Lipodystrophies: A Position Statement Endorsed by the Hellenic Endocrine Society.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Psychosocial support is essential due to the high burden of psychological distress and stigma.
    explanation: >-
      Current guideline position statement.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:26239609
    reference_title: Congenital generalized lipodystrophies--new insights into metabolic dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Special education might be necessary for individuals who also have an intellectual disability.
    explanation: >-
      Disease-specific clinical synthesis.
    quote_role: REVIEW_SYNTHESIS
- name: Genetic counseling and family testing
  description: >-
    Offer gene-specific recurrence counseling and testing of at-risk relatives. Discuss prenatal testing when
    familial variants are known. For PPARG, a single allele can cause partial lipodystrophy and should not
    automatically be treated as an asymptomatic carrier state.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301391
    reference_title: Berardinelli-Seip Congenital Lipodystrophy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Carrier testing for at-risk relatives and prenatal testing for pregnancies at increased risk are possible
      if the pathogenic variants in the family are known.
    explanation: >-
      Historical chapter recommendation with PPARG-specific qualification.
    quote_role: REVIEW_SYNTHESIS
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Investigational mibavademab
  description: >-
    Mibavademab (REGN4461) is an investigational leptin-receptor agonist antibody. Generalized-lipodystrophy
    phase II and switch studies are completed, and phase III LAGO is recruiting as of the September 2026 registry
    update. Trial inclusion of congenital disease does not establish efficacy in every CGL genotype.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  evidence:
  - reference: clinicaltrials:NCT06548100
    reference_title: A Single-Arm, Open-Label, Safety Study in Patients With Generalized Lipodystrophy Switching From Metreleptin to Mibavademab, A Leptin Receptor Agonist Antibody
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The aim of the study is to see how safe and tolerable mibavademab is when switching from treatment with
      metreleptin.
    explanation: >-
      Registry describes investigational use, not proven benefit.
  notes: >-
    The phase II registry has posted results. No results were posted for LAGO or the completed switch study
    at the October 2026 source check. Eligibility excludes certain significant cardiac conditions, so CGL4
    suitability requires protocol-specific assessment.
- name: Selected adjunctive diabetes therapies
  description: >-
    GLP-1 receptor agonists or SGLT2 inhibitors may be considered in selected patients by specialists. The
    2026 guideline discusses generalized and partial lipodystrophies together; it does not establish CGL-specific
    comparative efficacy.
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:41713690
    reference_title: 'Clinical Guidelines for the Diagnosis and Management of Generalized and Partial Lipodystrophies: A Position Statement Endorsed by the Hellenic Endocrine Society.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Adjunctive therapies, including glucagon-like peptide-1 receptor agonists and SGLT2 inhibitors, may offer
      additional metabolic benefit in selected cases.
    explanation: >-
      Guideline-level option across mixed lipodystrophy populations.
    quote_role: REVIEW_SYNTHESIS
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
diagnosis:
- name: Clinical lipodystrophy assessment
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  description: >-
    Recognize near-generalized lack of body fat from birth or infancy with metabolic findings. Document onset
    and depot distribution using examination and, where useful, DXA or MRI. CGL4 fat loss may progress in infancy;
    lack of obvious neonatal lipoatrophy does not exclude it.
  results: Generalized lack of body fat with extreme muscularity supports CGL.
  evidence:
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Patients with CGL have near-complete lack of fat starting at birth or infancy.
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
- name: CGL molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    A phenotype-guided panel including AGPAT2, BSCL2, CAV1, CAVIN1 and rare PPARG presentations can define
    the molecular subtype. Negative testing does not exclude a genetic lipodystrophy; broader sequencing may
    be appropriate.
  results: Biallelic pathogenic variants in a known CGL gene support molecular diagnosis.
  evidence:
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Genotyping may include limited candidate gene sequencing, a panel of candidate genes, or whole-exome/whole-genome
      sequencing.
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Because there is strong evidence for additional loci for genetic lipodystrophies, negative tests do not
      rule out a genetic condition.
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301391
    reference_title: Berardinelli-Seip Congenital Lipodystrophy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The diagnosis of BSCL is established in a proband with three major criteria or two major criteria plus
      two or more minor criteria and/or by the identification of biallelic pathogenic variants in AGPAT2 or
      BSCL2.
    explanation: >-
      Historical diagnostic framework; the current panel extends beyond the two genes in this retired chapter.
    quote_role: REVIEW_SYNTHESIS
- name: Metabolic workup and leptin interpretation
  description: >-
    Assess glucose, insulin, triglycerides, liver disease and leptin in the clinical context. Low leptin supports
    the endocrine phenotype and treatment assessment but is not a stand-alone diagnostic cutoff.
  evidence:
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Because serum leptin assays are not standardized and leptin concentrations in patients with lipodystrophy
      (especially partial forms) overlap the general population, leptin levels do not help in diagnosis but
      may help with the choice of therapies.
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS

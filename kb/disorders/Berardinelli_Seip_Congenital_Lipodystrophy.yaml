- name: PPARG pathogenic variants
  subtype: CGL-PPARG
  gene_term:
    preferred_term: PPARG
    term:
      id: hgnc:9236
      label: PPARG
  association: Rare biallelic pathogenic variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    description: >
      The generalized congenital presentation requires two PPARG variants. ClinGen
      curates PPARG-related lipodystrophy as semidominant overall, because the
      common presentation is autosomal dominant familial partial lipodystrophy and
      only the rare recessive cases are generalized and congenital.
    evidence:
    - reference: CGGV:assertion_b4c76c1c-7e8a-418f-ba62-b7eeb3c3d472-2024-08-14T160000.000Z
      reference_title: "PPARG / lipodystrophy (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "We have now curated the inheritance pattern for PPARG -related lipodystrophy as semidominant because, while most cases are autosomal dominant, very rarely a recessive mode of inheritance has been reported (Dyment et al, PMID:24980513; Gosseaume et al, PMID:36806620)."
      explanation: >-
        ClinGen's stated inheritance call, which is what makes the recessive
        generalized presentation a rare mode rather than the usual one.
  notes: >
    The index patient carried compound heterozygous PPARG variants c.413_416delAATG
    p.Glu138ValfsX168 and c.490C>T p.R164W. ClinGen's lumping decision keeps both
    PPARG diseases in a single gene-disease curation of lipodystrophy
    (MONDO:0006573) because the implicated variants overlap; dismech splits them by
    phenotype instead, with the dominant partial form on the Familial Partial
    Lipodystrophy entry and this recessive generalized form here.
  evidence:
  - reference: PMID:24980513
    reference_title: "Biallelic mutations at PPARG cause a congenital, generalized lipodystrophy similar to the Berardinelli-Seip syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She showed the hallmark features of a congenital, generalized lipodystrophy (CGL)."
    explanation: >-
      The biallelic PPARG proband is reported as showing the hallmark features of
      congenital generalized lipodystrophy.
    directness: DIRECT
  - reference: CGGV:assertion_b4c76c1c-7e8a-418f-ba62-b7eeb3c3d472-2024-08-14T160000.000Z
    reference_title: "PPARG / lipodystrophy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Specifically, PPARG has two associated diseases, namely the more commonly associated autosomal dominant familial partial lipodystrophy (OMIM:604367), and the more rarely associated autosomal recessive congenital, generalized lipodystrophy."
    explanation: >-
      ClinGen names the two PPARG diseases and assigns the autosomal recessive
      congenital generalized one, curated here, to the rarer of the two.
  - reference: CGGV:assertion_b4c76c1c-7e8a-418f-ba62-b7eeb3c3d472-2024-08-14T160000.000Z
    reference_title: "PPARG / lipodystrophy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "with most cases presenting as familial partial lipodystrophy and two cases with congenital, generalized lipodystrophy"
    explanation: >-
      Quantifies how rare this presentation is: two congenital generalized cases
      among the probands ClinGen curated.
treatments:
- name: Metreleptin replacement therapy
  description: >-
    Metreleptin with diet is a first-line therapy for metabolic and endocrine complications of generalized
    lipodystrophy. The final NIH open-label analysis included 45 congenital and 21 acquired cases; congenital-group
    changes at 12 months/last observation were −1.8 percentage points in HbA1c and −22.2% in triglycerides.
    Published NIH cohorts overlap. Treatment improves metabolism without restoring absent fat; pooled liver
    and glycemic effects are not CGL-specific estimates.
  therapeutic_modality: PROTEIN_REPLACEMENT
  evidence:
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In generalized lipodystrophy, metreleptin (with diet) is a first-line treatment for metabolic and endocrine
      abnormalities
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:29644599
    reference_title: Long-term effectiveness and safety of metreleptin in the treatment of patients with generalized lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In the full analysis set, reductions in mean HbA1c and fasting TGs, respectively, from baseline to month
      12/LOCF were numerically greater in patients with acquired GL (−2.9% and −53.5%) than in patients with
      congenital GL (−1.8% and −22.2%).
    explanation: >-
      Subtype-specific analysis from an uncontrolled integrated study, including imputation; not a randomized
      CGL-only treatment effect.
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Acute pancreatitis due to hypertriglyceridemia has occurred in patients who acutely discontinued or reduced
      metreleptin (47).
    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-

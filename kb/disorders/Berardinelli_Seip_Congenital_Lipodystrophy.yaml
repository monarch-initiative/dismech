differential_diagnoses:
- name: PCYT1A-related lipodystrophy with hepatic steatosis
  description: >-
    Biallelic PCYT1A deficiency is a related phosphatidylcholine-synthesis disorder. Two reported patients
    had severe hepatic disease and lipodystrophy, but one developed progressive limb fat loss at nine years,
    and neither showed the skeletal/retinal syndrome seen with other PCYT1A variants. This broader presentation
    is a diagnostic consideration rather than an additional numbered classical CGL subtype.
  distinguishing_features:
  - Severe early hepatic steatosis can precede progressive limb fat loss.
  - Short stature without the typical marked muscularity; phenotype varies across the PCYT1A spectrum.
  evidence:
  - reference: PMID:24889630
    reference_title: Mutations disrupting the Kennedy phosphatidylcholine pathway in humans with congenital lipodystrophy and fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      At age 9 y, progressive limb fat loss developed.
    explanation: >-
      Patient 2 does not have the classic neonatal generalized fat-loss chronology.
  - reference: PMID:24889630
    reference_title: Mutations disrupting the Kennedy phosphatidylcholine pathway in humans with congenital lipodystrophy and fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Her retinal assessment was normal and the skeletal survey did not reveal any features of spondylometaphyseal
      dysplasia.
    explanation: >-
      Patient 1 was reassessed after recognition of the separate PCYT1A skeletal-retinal phenotype.
- name: Familial Partial Lipodystrophy
  description: >-
    Partial inherited lipodystrophy typically preserves or increases fat in some depots. PPARG monoallelic
    disease usually belongs to this spectrum; rare biallelic CGL-like cases are represented here with explicit
    scope qualifications.
  distinguishing_features:
  - Regional rather than near-total fat loss, often apparent around puberty.
  evidence:
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Patients with FPLD have fat loss of the extremities typically occurring around puberty and can have a
      positive family history.
    explanation: >-
      Clinical diagnostic distinction.
    quote_role: REVIEW_SYNTHESIS
- name: Acquired generalized lipodystrophy
  description: >-
    Acquired disease often develops after an interval of normal fat distribution and may be associated with
    autoimmunity. Early infancy onset can occasionally complicate the distinction.
  distinguishing_features:
  - Prior normal fat distribution and associated autoimmunity favor acquired disease.
  evidence:
  - reference: PMID:27710244
    reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Review of photographs from infancy may distinguish CGL from AGL because infants typically show absent
      fat in CGL and normal fat in AGL.
    explanation: >-
      Clinical distinction is useful but not absolute.
    quote_role: REVIEW_SYNTHESIS

- name: CGL-PPARG
  display_name: PPARG-associated congenital generalized lipodystrophy
  description: >-
    A rare biallelic PPARG form of congenital generalized lipodystrophy. PPARG encodes the PPARgamma nuclear
    receptor that drives differentiation of preadipocytes into adipocytes. Monoallelic loss-of-function PPARG
    variants cause autosomal dominant familial partial lipodystrophy type 3, curated in the Familial Partial
    Lipodystrophy entry; the rare recessive cases have severe generalized or CGL-like lipoatrophy, with variable
    chronology and depot preservation. ClinGen therefore curates PPARG-related lipodystrophy as semidominant,
    and MONDO files this concept as a subclass of Berardinelli-Seip congenital lipodystrophy.
  subtype_term:
    preferred_term: PPARG-associated congenital generalized lipodystrophy
    term:
      id: MONDO:0979300
      label: PPARG-associated congenital generalized lipodystrophy
  genes:
  - preferred_term: PPARG
    term:
      id: hgnc:9236
      label: PPARG
  review_notes: >-
    This row rests on very few patients, and the sources do not agree that the phenotype is a pure generalized
    lipodystrophy. Dyment et al. (PMID:24980513) report their proband as showing the hallmark features of congenital
    generalized lipodystrophy, whereas Patni and Garg (PMID:26239609), reviewing the same case, record that
    she retained some facial adipose tissue, in contrast to a CGL phenotype, and that whether further biallelic
    patients show the same picture remains to be seen. ClinGen counts two congenital generalized lipodystrophy
    cases among at least 35 PPARG lipodystrophy probands. The 2024 PPARG review describes childhood fat loss
    progressing to upper limbs, back and abdomen in adulthood and includes facial involvement. The rare biallelic
    phenotype is therefore retained with explicit disagreement over distribution and chronology, rather than
    assuming every case has the classic neonatal near-total fat loss.
  evidence:
  - reference: PMID:24980513
    reference_title: "Biallelic mutations at PPARG cause a congenital, generalized lipodystrophy similar to the Berardinelli-Seip syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype and presence of two mutations suggests that biallelic mutations at PPARG cause a CGL similar to that observed with biallelic AGPAT2 or BSCL2 mutations."
    explanation: >-
      The report that places biallelic PPARG alongside AGPAT2 and BSCL2 as a cause of
      congenital generalized lipodystrophy, which is what makes this a subtype row on
      this entry rather than a separate disease.
    directness: DIRECT
  - reference: PMID:36806620
    reference_title: "Perinatal, metabolic, and reproductive features in PPARG-related lipodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They carried monoallelic PPARG variants except a homozygous patient with congenital generalized lipodystrophy."
    explanation: >-
      A second cohort in which the one homozygous patient, unlike the 25 heterozygous
      patients, had congenital generalized lipodystrophy.
    directness: DIRECT
  - reference: CGGV:assertion_b4c76c1c-7e8a-418f-ba62-b7eeb3c3d472-2024-08-14T160000.000Z
    reference_title: "PPARG / lipodystrophy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The occasional recessive cases typically feature early-onset, congenital generalized lipodystrophy, also known as Berardinelli-Seip syndrome, due to biallelic variants in PPARG (PMIDs:24980513, 36806620)."
    explanation: >-
      ClinGen's expert-panel narrative states that the recessive PPARG cases are
      early-onset congenital generalized lipodystrophy, i.e. this disease.
  - reference: PMID:26239609
    reference_title: Congenital generalized lipodystrophies--new insights into metabolic dysfunction.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, in contrast to a CGL phenotype, the patient had some facial adipose tissue."
    explanation: >-
      Cuts against the generalized characterization of this subtype: reviewing the
      index case, Patni and Garg record retained facial fat and judge the
      distribution not to be that of CGL. The row is kept with that qualification
      rather than as a settled generalized phenotype.
    directness: DIRECT
  - reference: PMID:39398333
    reference_title: "Familial partial lipodystrophy resulting from loss-of-function PPARγ pathogenic variants: phenotypic, clinical, and genetic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: >-
      It progressed to the upper limbs, back, and abdomen in adulthood, resembling the phenotypic pattern of
      generalized congenital lipodystrophies (CGL) (47).
    explanation: >-
      Review of the biallelic index case supports a CGL-like pattern but describes progression beyond infancy.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The congenital generalized presentation is recessive. When both parents carry the relevant pathogenic allele,
    each pregnancy has a 25% risk of the biallelic condition. Heterozygous PPARG alleles can cause partial
    lipodystrophy, so carrier counseling is gene- and allele-specific.
  evidence:
  - reference: ORPHA:528
    reference_title: "Congenital generalized lipodystrophy"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal recessive"
    explanation: Orphanet records autosomal recessive inheritance.
  - reference: PMID:11967537
    reference_title: AGPAT2 is mutated in congenital generalized lipodystrophy linked to chromosome 9q34.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital generalized lipodystrophy is an autosomal recessive disorder characterized by marked paucity
      of adipose tissue, extreme insulin resistance, hypertriglyceridemia, hepatic steatosis and early onset
      of diabetes.
    explanation: The AGPAT2 discovery study states the autosomal recessive inheritance pattern.
    directness: DIRECT
  - reference: PMID:20301391
    reference_title: Berardinelli-Seip Congenital Lipodystrophy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of
      being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      Historical AGPAT2/BSCL2-focused counseling; asymptomatic-carrier wording is not extended to PPARG.
    quote_role: REVIEW_SYNTHESIS

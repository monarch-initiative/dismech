histopathology:
- name: CGL4 dystrophic muscle and reduced caveolae
  subtype: CGL4
  description: >-
    Skeletal muscle can show dystrophic changes, abnormal caveolin localization and sparse caveolae. The extent
    of fibrosis, necrosis and caveolin protein depletion differs between reported cohorts; reduced membrane
    organization is more consistent than universal loss of caveolin abundance.
  evidence:
  - reference: PMID:19726876
    reference_title: Human PTRF mutations cause secondary deficiency of caveolins resulting in muscular dystrophy with generalized lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Skeletal muscle biopsies revealed chronic dystrophic changes, deficiency and mislocalization of all 3
      caveolin family members, and reduction of caveolae structure.
    explanation: >-
      Direct muscle biopsy findings in the Japanese CGL4 cohort.
  - reference: PMID:20300641
    reference_title: Fatal cardiac arrhythmia and long-QT syndrome in a new form of congenital generalized lipodystrophy with muscle rippling (CGL4) due to PTRF-CAVIN mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      PTRF-CAVIN protein was completely absent from fibroblasts and skeletal muscle, whereas the caveolin-1
      and caveolin-3 abundance was unchanged (Figure 4D and 4G).
    explanation: >-
      Contrasting protein abundance in a separate primary series.
- name: CGL4 intestinal smooth-muscle hypertrophy
  subtype: CGL4
  description: >-
    Massive smooth-muscle hypertrophy was demonstrated in a colonic specimen after ileus in one patient; this
    is not a finding measured in every case.
  evidence:
  - reference: PMID:20300641
    reference_title: Fatal cardiac arrhythmia and long-QT syndrome in a new form of congenital generalized lipodystrophy with muscle rippling (CGL4) due to PTRF-CAVIN mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      At 12 years of age, an acute ileus after appendectomy required a partial bowel resection and histology
      of the colon wall revealed massive smooth muscle hypertrophy.
    explanation: >-
      Patient bowel histology.
experimental_models:
- name: CAVIN1-deficient patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Patient-derived skin fibroblasts
  description: >-
    Patient fibroblasts had a greater than 97% reduction in caveolae. Wild-type CAVIN1 transfection restored
    peripheral punctate caveolar staining. The experiment supports cell-autonomous caveola formation, without
    demonstrating clinical rescue.
  modeled_mechanisms:
  - target: CAVIN1 caveola biogenesis defect
    relationship: RECAPITULATES
    model_scale: CELLULAR
    evidence:
    - &id008
      reference: PMID:20300641
      reference_title: Fatal cardiac arrhythmia and long-QT syndrome in a new form of congenital generalized lipodystrophy with muscle rippling (CGL4) due to PTRF-CAVIN mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        Morphometric analysis by transmission electron microscopy of the quantity of caveolae on the cell surface
        revealed a severe reduction by >97% in the patient's fibroblasts (Figure 7A and 7B).
      explanation: >-
        Patient fibroblast ultrastructure.
  evidence:
  - *id008
  - reference: PMID:20300641
    reference_title: Fatal cardiac arrhythmia and long-QT syndrome in a new form of congenital generalized lipodystrophy with muscle rippling (CGL4) due to PTRF-CAVIN mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      However, transfection of a construct into patient fibroblasts, which contained the full-length, wild-type
      PTRF-CAVIN gene cloned downstream of the eukaryotic CMV-promoter, reconstituted the punctate staining
      pattern at the cell periphery that corresponds to the caveolae (Figure 6E–6G).
    explanation: >-
      Rescue in cultured cells, not a clinical gene-therapy intervention.
- name: CAV1-deficient patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Skin fibroblasts from a new CGL3 index patient and the previously reported patient
  description: >-
    Fibroblasts lack caveolae and caveolin-1, caveolin-2 and cavin-1 protein expression, with impaired insulin
    responses, oxidative stress and premature senescence.
  modeled_mechanisms:
  - target: CAV1-dependent caveola loss
    relationship: RECAPITULATES
    model_scale: CELLULAR
    evidence:
    - *id009
  evidence:
  - reference: PMID:34643546
    reference_title: Biallelic CAV1 null variants induce congenital generalized lipodystrophy with achalasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Patients' fibroblasts also displayed insulin resistance, increased oxidative stress, and premature senescence.
    explanation: >-
      Direct cultured patient-cell findings.
- name: Bscl2-deficient adipogenic cultures
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Mouse embryonic fibroblasts and stromal vascular cells
  description: >-
    Knockout cultures retain early differentiation but fail terminal adipogenesis with excessive cAMP/PKA-dependent
    lipolysis. Lipolysis inhibitors largely rescue differentiation, whereas the tested PPARgamma agonist does
    not.
  modeled_mechanisms:
  - target: Unrestrained adipocyte lipolysis
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    evidence:
    - *id001
    limitations: >-
      Mouse-derived cells, not direct human adipocyte measurements.
  - target: Failure of terminal adipocyte differentiation
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    evidence:
    - *id001
    limitations: >-
      The model resolves a cell-level sequence rather than all human subtype effects.
  evidence:
  - reference: PMID:22269949
    reference_title: Berardinelli-seip congenital lipodystrophy 2/seipin is a cell-autonomous regulator of lipolysis essential for adipocyte differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Importantly, such defects in differentiation can be largely rescued by inhibitors of lipolysis but not
      by a gamma peroxisome proliferator-activated receptor (PPARγ) agonist.
    explanation: >-
      Experimental rescue does not establish clinical efficacy of a lipolysis inhibitor.

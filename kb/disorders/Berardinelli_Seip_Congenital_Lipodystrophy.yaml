    explanation: >-
      Multi-society clinical guidance; evidence is often consensus-based.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:29644599
    reference_title: Long-term effectiveness and safety of metreleptin in the treatment of patients with generalized lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The US label for metreleptin carries a boxed warning that T-cell lymphoma has been reported in patients
      with acquired GL, in those both treated and untreated with metreleptin.
    explanation: >-
      Publication discusses the acquired-disease risk and causal uncertainty.
    quote_role: BACKGROUND

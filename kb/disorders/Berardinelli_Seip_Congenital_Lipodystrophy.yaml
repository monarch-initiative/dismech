  genotype: Bscl2 homozygous knockout
  description: >-
    The model develops severe white-adipose lipodystrophy, insulin resistance and hepatic steatosis. Its fasting
    glucose and triglyceride behavior differs from human CGL2; reports of fasting reductions and postprandial
    hypertriglyceridemia should not be generalized to patients.
  modeled_mechanisms:
  - target: Generalized adipose tissue loss
    relationship: RECAPITULATES
    model_scale: TISSUE
    evidence:

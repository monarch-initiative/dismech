    treatment_effect: RESTORES
    description: >-
      Replacement of deficient leptin restores hormonal signaling without reversing the initiating adipose
      genetic defect.
    evidence:
    - reference: PMID:27710244
      reference_title: 'The Diagnosis and Management of Lipodystrophy Syndromes: A Multi-Society Practice Guideline.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        In generalized lipodystrophy, metreleptin (with diet) is a first-line treatment for metabolic and endocrine
        abnormalities
      explanation: >-
        Multi-society clinical guidance; evidence is often consensus-based.
      quote_role: REVIEW_SYNTHESIS
  notes: >-
    Monitor glucose closely and adjust insulin to avoid hypoglycemia. Avoid abrupt withdrawal because rebound
    hypertriglyceridemia and pancreatitis can occur. Loss of response may warrant assessment for neutralizing
    antibodies. Reported lymphoma risk is principally linked to acquired generalized lipodystrophy; these reports
    do not establish a CGL-specific causal lymphoma effect.
- name: Individualized nutritional management
  description: >-
    Use balanced macronutrients, restrict simple sugars and excessive fat, and preserve linear growth in children.
    Avoid overfeeding to achieve normal BMI because fat loss distorts body-composition targets. Very-low-fat
    intake is reserved for chylomicronemia-associated acute pancreatitis; infant feeding may require specialist
    medium-chain triglyceride formulations.
  therapeutic_modality: BEHAVIORAL
  evidence:

      directness: DIRECT
      snippet: >-
        Bscl2(-/-) mice develop severe lipodystrophy of white adipose tissue (WAT), dyslipidemia, insulin resistance,
        and hepatic steatosis.
      explanation: >-
        Primary knockout phenotype.
  evidence:

pathophysiology:
- name: AGPAT2 acylglycerol synthesis defect
  description: >-
    Loss of AGPAT2 impairs lysophosphatidic-acid acylation in adipocytes. This disrupts normal glycerolipid
    synthesis and adipogenesis. A global fall in phosphatidic acid is not assumed: compensatory hepatic pathways
    can increase particular phosphatidic-acid species in knockout mice.

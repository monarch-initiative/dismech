phenotypes:
- category: Ophthalmologic
  name: Developmental cataract
  description: >-
    Bilateral cataract present at birth or in infancy in most families; the
    R33C family had total cataract. In one family with a frameshift allele,
    affected males had onset by one year of age and affected females in
    adulthood.
  phenotype_term:
    preferred_term: Congenital cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  sequelae:
  - target: Nystagmus
    description: >-
      Dense bilateral opacity in infancy deprives the developing visual system
      of a formed image; nystagmus was the presenting complaint or a common
      finding in affected children.
  evidence:
  - reference: PMID:17893667
    reference_title: "A novel mutation in major intrinsic protein of the lens gene (MIP) underlies autosomal dominant cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To identify the causitive mutation in a five-generation family with autosomal dominant congenital total cataract."
    explanation: Congenital total cataract in the R33C family.
  - reference: PMID:38721506
    reference_title: "Novel MIP gene mutation causes autosomal-dominant congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two Chinese families with autosomal-dominant congenital cataract (ADCC) were recruited and underwent comprehensive eye examinations."

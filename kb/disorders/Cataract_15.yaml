name: Cataract 15
creation_date: "2026-10-28T22:22:32Z"
category: Mendelian
synonyms:
- CTRCT15
- cataract 15, multiple types
- MIP early-onset non-syndromic cataract
- MIP-related cataract
description: >-
  Non-syndromic early-onset cataract caused by heterozygous pathogenic variants
  in MIP, which encodes aquaporin 0 (AQP0), the major intrinsic membrane protein
  of lens fiber cells. AQP0 acts both as a water channel and as a fiber
  cell-to-cell adhesion molecule that keeps neighbouring fibers tightly packed.
  Inheritance is autosomal dominant, and a recurrent variant has also arisen de
  novo. Morphology varies between and within families: lamellar, polymorphic
  progressive punctate, nuclear, cortical, posterior or anterior polar,
  sutural, cerulean and total cataracts are all reported. Most missense and
  truncating alleles studied in cell systems produce a protein that fails to
  reach the plasma membrane and is retained in the endoplasmic reticulum, where
  several trap the wild-type protein in a dominant-negative manner; other
  alleles (R33C) traffic normally but lose adhesive function. Mouse Mip alleles
  (Lop, Cat-Fr, Hfi, Cat-Tohm, Nat) and the Aqp0 knockout reproduce dominant or
  semi-dominant cataract, showing that heterozygous loss of AQP0 is enough to
  disorganize fiber cell packing and scatter light, and that mistrafficked
  mutant AQP0 adds an endoplasmic reticulum stress and fiber cell degeneration
  component.

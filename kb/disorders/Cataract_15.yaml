genetic:
- name: MIP
  gene_term:
    preferred_term: MIP
    term:
      id: hgnc:7103
      label: MIP
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported heterozygous alleles include missense G29R, R33C, E134G, T138R,
    G165D, Y177C, R187C, P191R, G215D and R233K; frameshifts c.301delG
    (p.Ala101Profs*16), c.682_683delAA (p.K228fs) and a single-base deletion in
    codon 235 (Delta213 in functional work); nonsense Y219*; splice-site
    c.606+1G>A and IVS3-1G>A; and initiation codon c.2T>C. No ClinGen
    gene-disease validity record for MIP is cached in this repository.
  evidence:
  - reference: PMID:10802646
    reference_title: "Missense mutations in MIP underlie autosomal dominant 'polymorphic' and lamellar cataracts linked to 12q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the identification of the first mutations affecting the major intrinsic protein of the lens, MIP, encoded by the gene MIP on 12q14."
    explanation: First MIP alleles in human cataract families.
  - reference: PMID:17893667
    reference_title: "A novel mutation in major intrinsic protein of the lens gene (MIP) underlies autosomal dominant cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing the coding regions of MIP revealed a C>T transition at nucleotide 97 in exon 1 that caused a substitution of arginine (R) to cysteine (C) at codon 33 (p.R33C)."
    explanation: Linkage-supported R33C allele.
  - reference: PMID:16564824
    reference_title: "Novel single-base deletional mutation in major intrinsic protein (MIP) in autosomal dominant cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a novel single deletion of nucleotide (nt) 3223 (within codon 235) in exon four, causing a frameshift that alters 41 of 45 subsequent amino acids and creates a premature stop codon."
    explanation: C-terminal frameshift allele in an American family.
  - reference: PMID:19137077
    reference_title: "Identification of a novel splice-site mutation in MIP in a Chinese congenital cataract family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation screening of MIP identified a heterozygous G>A transition at the acceptor splice site of intron 3 (IVS3 -1 G>A), abolishing a BstSF I restriction site in one allele of all the affected individuals."
    explanation: Linkage-supported acceptor splice-site allele.
  - reference: PMID:24319327
    reference_title: "A novel donor splice-site mutation of major intrinsic protein gene associated with congenital cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RT-PCR analysis showed that the donor splice site mutation led to deletion of exon 3 in the mRNA encoded by the MIP gene."
    explanation: Minigene assay shows exon 3 skipping from the c.606+1G>A allele.
  - reference: PMID:38721506
    reference_title: "Novel MIP gene mutation causes autosomal-dominant congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel heterozygous mutation (c.85G>A; p.G29R) in the MIP gene was identified in the proband of one family."
    explanation: Recent panel-identified missense allele.
  - reference: PMID:32920712
    reference_title: "The relationship between major intrinsic protein genes and cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A total of 29 MIP gene mutations causing congenital cataract were obtained by searching these databases and analyzing the results of genetic mutation pathogenicity prediction software tools"
    explanation: Systematic review counting MIP alleles reported in congenital cataract to the end of 2019.
  - reference: PMID:32920712
    reference_title: "The relationship between major intrinsic protein genes and cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, there was no clear causality between lens morphology, phenotypes, and genotypes."
    explanation: No genotype-morphology correlation across MIP alleles, which supports a single entry without morphology subtypes.
animal_models:
- name: Mip Lop mouse
  species: Mouse
  genotype: Mip lens opacity (Lop) missense allele, heterozygous
  publication: PMID:8563764
  modeled_mechanisms:
  - target: AQP0 Mistrafficking and Endoplasmic Reticulum Retention
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The Lop substitution blocks AQP0 targeting to the fiber cell membrane, as many human missense alleles do in cells.
    limitations: >-
      Lop is not a human allele, and mistrafficking of the human alleles has
      been shown only in heterologous cells, not in patient lenses.
    evidence:
    - reference: PMID:8563764
      reference_title: "Mutations in the founder of the MIP gene family underlie cataract development in the mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The lens opacity mutation is an amino-acid substitution that inhibits targeting of MIP to the cell-membrane."
      explanation: Mistrafficking in vivo.
  - target: ER Stress and Lens Fiber Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Lop/+ lenses activate the unfolded protein response and lose central fiber cells.
    limitations: >-
      Mouse-only finding; unfolded protein response activation has not been
      examined in human MIP cataract lenses.
    evidence:
    - reference: PMID:27155571
      reference_title: "Lens ER-stress response during cataract development in Mip-mutant mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A pathway analysis of up-regulated genes in the Lop/+ lens (P7) was consistent with endoplasmic reticulum (ER)-stress and activation of the unfolded protein response (UPR)."
      explanation: Lens transcriptome of Lop/+ mice.
- name: Mip Cat-Fr mouse
  species: Mouse
  genotype: Mip transposon insertion producing an AQP0-LTR chimeric protein, heterozygous
  publication: PMID:11053241
  modeled_mechanisms:
  - target: Disorganized Lens Fiber Cell Architecture
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Heterozygous lenses scatter light and their core fibers fail to form concentric growth shells.
    limitations: The LTR substitution of the C-terminus has no exact human counterpart, though human C-terminal frameshifts are similar in kind.
    evidence:
    - reference: PMID:11053241
      reference_title: "Disruption of lens fiber cell architecture in mice expressing a chimeric AQP0-LTR protein."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous CatFr lenses were similar in size to wild-type but displayed abnormal regions of translucence and light scattering."
      explanation: Dominant opacity with disrupted fiber architecture.
- name: Aqp0 knockout mouse
  species: Mouse
  genotype: Aqp0 (Mip) gene-trap null allele, heterozygous and homozygous
  publication: PMID:11773604
  modeled_mechanisms:
  - target: Reduced Fiber Cell Membrane Water Permeability
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Lens water permeability falls with Aqp0 dose.
    evidence:
    - reference: PMID:11773604
      reference_title: "Optical dysfunction of the crystalline lens in aquaporin-0-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Osmotic water permeability values for Aqp0(+/-) and Aqp0(-/-) lenses were reduced to approximately 46% and approximately 20% of wild-type values, respectively, and the focusing power of Aqp0(+/-) lenses was significantly lower than that of wild type."
      explanation: Measured permeability loss.
  - target: Lens Light Scattering and Loss of Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Null lenses have polymorphic opacities by 3 weeks; heterozygotes develop opacity by about 24 weeks.
    limitations: >-
      A null allele models haploinsufficiency only; it lacks the
      dominant-negative and toxic effects of mistrafficked missense alleles,
      and heterozygous opacity is postnatal and late, whereas most patients
      have congenital cataract.
    evidence:
    - reference: PMID:11773604
      reference_title: "Optical dysfunction of the crystalline lens in aquaporin-0-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At 3 wk of age (postnatal day 21), lenses from null mice (Aqp0(-/-)) contained polymorphic opacities, whereas lenses from heterozygous mice (Aqp0(+/-)) were transparent and did not develop frank opacities until approximately 24 wk of age."
      explanation: Dose-dependent opacity timing.
- name: Mip Hfi mouse
  species: Mouse
  genotype: Mip 76-bp deletion causing exon 2 skipping, heterozygous and homozygous
  publication: PMID:11414759
  modeled_mechanisms:
  - target: ER Stress and Lens Fiber Cell Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Heterozygotes with normal wild-type Mip levels develop hydropic fibers, implying a toxic gain of function.
    limitations: The gain-of-function mechanism was inferred; endoplasmic reticulum stress markers were not measured in this model.
    evidence:
    - reference: PMID:11414759
      reference_title: "A 76-bp deletion in the Mip gene causes autosomal dominant cataract in Hfi mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hfi is a dominant cataract mutation where heterozygotes show hydropic lens fibers and homozygotes show total lens opacity."
      explanation: Dominant cataract in a Mip splicing mutant.
- name: Mip kfrs4 rat
  species: Rat
  genotype: Mip 5-bp insertion (kfrs4) truncating allele, homozygous and heterozygous, KFRS background
  publication: PMID:23226368
  modeled_mechanisms:
  - target: Disorganized Lens Fiber Cell Architecture
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Homozygous null rats develop nuclear cataract with disorganized, vacuolated fibers within one month.
    limitations: >-
      The allele is recessive: heterozygotes have reduced MIP but clear lenses
      to one year, unlike heterozygous Aqp0 knockout mice and dominant human
      alleles. The contrast is consistent with dominant human alleles acting
      through more than simple half dose.
    evidence:
    - reference: PMID:23226368
      reference_title: "A 5-bp insertion in Mip causes recessive congenital cataract in KFRS4/Kyo rats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although the lenses of kfrs4/kfrs4 homozygotes showed severely disorganised fibres and vacuolation, the lenses of kfrs4/+ heterozygotes appeared normal and similar to those of wild-type rats."
      explanation: Fiber disorganization with complete MIP loss, none in heterozygotes.
- name: Aqp0 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: Morpholino knockdown of aqp0a or aqp0b
  publication: PMID:20671274
  modeled_mechanisms:
  - target: Lens Light Scattering and Loss of Transparency
    relationship: RECAPITULATES
    fidelity: LOW
    description: Knockdown of either zebrafish paralog causes cataract.
    limitations: >-
      Zebrafish carry two AQP0 paralogs that split the single mammalian
      protein's functions, and transient morpholino knockdown does not model a
      heterozygous dominant allele.
    evidence:
    - reference: PMID:20671274
      reference_title: "Two distinct aquaporin 0s required for development and transparency of the zebrafish lens."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Morpholino knock-down of either gene alone led to cataract formation, indicating that both genes are necessary for normal lens development and transparency."
      explanation: Opacity after AQP0 knockdown.

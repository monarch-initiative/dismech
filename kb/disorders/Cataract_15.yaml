inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous MIP variants segregate with cataract in multigenerational
    families of British, Indian, American and Chinese origin; a recurrent
    variant has also arisen de novo.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:11001937
    reference_title: "Functional impairment of lens aquaporin in two families with dominantly inherited cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dominantly inherited cataracts with differing clinical features were found in two families carrying different point mutations in the gene encoding lens water channel protein AQP0 (major intrinsic protein, MIP)."
    explanation: The two founding MIP families show dominant inheritance.
  - reference: PMID:17893667
    reference_title: "A novel mutation in major intrinsic protein of the lens gene (MIP) underlies autosomal dominant cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation cosegregated with all affected individuals and was not observed in unaffected or in 100 normal unrelated individuals."
    explanation: Heterozygous R33C cosegregates with cataract in a five-generation family.
  - reference: PMID:21850180
    reference_title: "Cerulean cataract mapped to 12q13 and associated with a novel initiation codon mutation in MIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation was present in all patients with cerulean cataract but was not present in any of the 13 unaffected family members nor in 96 control individuals."
    explanation: Heterozygous initiation codon variant segregates with dominant cataract in a large family.
  - reference: PMID:36734406
    reference_title: "First implication of MIP in bilateral microphthalmia with persistent fetal vasculature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here a patient with an ocular phenotype consisting in non-syndromic bilateral PFV with cataract and microphthalmia, in whom a recurrent heterozygous de novo MIP disease-causing variant was detected after using a dedicated 119-ocular genes panel approach."
    explanation: A heterozygous MIP variant can arise de novo, consistent with dominant action.
pathophysiology:
- name: MIP Pathogenic Variant and AQP0 Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Reported alleles are mostly missense substitutions in the transmembrane and
    loop domains, plus frameshift, nonsense, splice-site and initiation codon
    variants. The first two alleles described (E134G, T138R) abolish water
    channel activity in Xenopus oocytes; a C-terminal R233K variant instead
    weakens calmodulin binding without affecting trafficking.
  genes:
  - preferred_term: MIP
    term:
      id: hgnc:7103
      label: MIP
  molecular_functions:
  - preferred_term: water channel activity
    term:
      id: GO:0015250
      label: water channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:10802646
    reference_title: "Missense mutations in MIP underlie autosomal dominant 'polymorphic' and lamellar cataracts linked to 12q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MIP is a member of the aquaporin family of membrane-bound water channels. The mutations identified are predicted to disturb water flux across the lens cell membrane."
    explanation: The first MIP cataract alleles were predicted to disturb AQP0 water transport.
  - reference: PMID:11001937
    reference_title: "Functional impairment of lens aquaporin in two families with dominantly inherited cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both substitutions cause loss of membrane water channel activity due to impaired trafficking of the mutant proteins to the oocyte plasma membrane."
    explanation: E134G and T138R lose water channel activity in the oocyte expression system.
  - reference: PMID:22662182
    reference_title: "The Arg233Lys AQP0 mutation disturbs aquaporin0-calmodulin interaction causing polymorphic congenital cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggested that R233K mutation did not affect the expression, location and trafficking of the protein but did influence the interaction between AQP0 and CaM."
    explanation: A C-terminal allele that disturbs calmodulin regulation of AQP0 rather than its trafficking.
  downstream:
  - target: AQP0 Mistrafficking and Endoplasmic Reticulum Retention
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23116563
      reference_title: "An MIP/AQP0 mutation with impaired trafficking and function underlies an autosomal dominant congenital lamellar cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In transfected HeLa cells, wild type AQP0 localized at the plasma membrane while AQP0-G165D was retained within the secretory pathway, and localized mainly within the endoplasmic reticulum."
      explanation: A patient missense allele is retained in the endoplasmic reticulum instead of reaching the membrane.
    - reference: PMID:25033405
      reference_title: "A novel MIP gene mutation analysis in a Chinese family affected with congenital progressive punctate cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The wild type (WT) and G215D mutant of MIP were transfected with green fluorescent protein (GFP) into Hela cells separately, and it was found that the G215D mutant was aberrantly located in the cytoplasm instead of in the plasma membrane."
      explanation: A second patient missense allele mislocalizes away from the plasma membrane.
  - target: Impaired AQP0-Mediated Fiber Cell Adhesion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24120416
      reference_title: "Functional characterization of an AQP0 missense mutation, R33C, that causes dominant congenital lens cataract, reveals impaired cell-to-cell adhesion."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, the cell-to-cell adhesion property of AQP0-R33C was significantly reduced (P < 0.001) compared to that of WT-AQP0, indicated by cell aggregation and cell-to-cell adhesion assays."
      explanation: R33C traffics normally and keeps water permeability but loses adhesive function.
- name: AQP0 Mistrafficking and Endoplasmic Reticulum Retention
  biological_scale: CELLULAR
  description: >-
    Many mutant AQP0 proteins are retained in the endoplasmic reticulum or
    cytoplasm. Co-expression studies with E134G, T138R, a C-terminal frameshift
    (Delta213) and Y219* show that the mutant hetero-oligomerizes with and traps
    wild-type AQP0, a dominant-negative effect that lowers membrane AQP0 below
    the half dose a null allele would leave. Mouse Lop and Cat-Fr mutant AQP0 is
    likewise mistargeted away from the fiber cell plasma membrane in vivo.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:11001937
    reference_title: "Functional impairment of lens aquaporin in two families with dominantly inherited cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "when E134G or T138R are co-expressed with wild-type AQP0 protein, the mutant proteins exhibit dominant negative behaviour"
    explanation: The founding missense alleles act dominant-negatively on wild-type AQP0 in oocytes.
  - reference: PMID:18501347
    reference_title: "Functional characterization of a human aquaporin 0 mutation that leads to a congenital dominant lens cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Co-localization studies suggest that the mutant AQP0 gained its dominant function by trapping the WT-AQP0 in the ER through hetero-oligomerization."
    explanation: A frameshift mutant traps wild-type AQP0 in the endoplasmic reticulum.
  - reference: PMID:25803033
    reference_title: "A novel nonsense mutation in the MIP gene linked to congenital posterior polar cataracts in a Chinese family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The dominant negative effect of the mutated protein on the wild-type protein interfered with the trafficking of wild-type protein to the cell membrane and both the mutant and wild-type protein were trapped in the cytoplasm."
    explanation: A nonsense allele (Y219*) traps co-expressed wild-type AQP0 in HEK293T cells.
  - reference: PMID:29947569
    reference_title: "A novel MIP mutation in a Chinese family with congenital cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Confocal microscopy imaging showed that WT MIP protein predominantly localized on the plasma membrane, the mutant protein was rich in the cytoplasm in Hela cells."
    explanation: The P191R patient allele is mislocalized to the cytoplasm.
  - reference: PMID:8563764
    reference_title: "Mutations in the founder of the MIP gene family underlie cataract development in the mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The lens opacity mutation is an amino-acid substitution that inhibits targeting of MIP to the cell-membrane."
    explanation: The mouse Lop missense allele blocks membrane targeting of AQP0.
  - reference: PMID:11053241
    reference_title: "Disruption of lens fiber cell architecture in mice expressing a chimeric AQP0-LTR protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, immunofluorescence microscopy revealed that AQP0-LTR was localized to intracellular membranes rather than to plasma membranes of lens fiber cells."
    explanation: Cat-Fr chimeric AQP0 is mislocalized in lens fiber cells in vivo.
  downstream:
  - target: Reduced Fiber Cell Membrane Water Permeability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18501347
      reference_title: "Functional characterization of a human aquaporin 0 mutation that leads to a congenital dominant lens cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Co-expression of WT-AQP0 with Delta213-AQP0 significantly lowered the P(w) (18+/-3 microm/s) compared to WT-AQP0."
      explanation: Trapping of wild-type protein by the mutant lowers membrane water permeability.
  - target: Impaired AQP0-Mediated Fiber Cell Adhesion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38153133
      reference_title: "A novel single-base deletional mutation of MIP impairs protein distribution and cell-to-cell adhesion in autosomal dominant cataracts in a Chinese family."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, the cell-to-cell adhesion capability and the cell-to-cell communication property were both significantly reduced for MIP-Ala101fs compared to the MIP-WT"
      explanation: A cytoplasm-trapped frameshift mutant also loses cell-to-cell adhesion.
  - target: ER Stress and Lens Fiber Cell Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18501347
      reference_title: "Functional characterization of a human aquaporin 0 mutation that leads to a congenital dominant lens cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cell death in the Delta213-AQP0 expressing cells was due to necrosis caused by the accumulation of Delta213-AQP0 protein in the ER in cytotoxic proportions."
      explanation: Accumulated mutant AQP0 in the endoplasmic reticulum is cytotoxic.
- name: Reduced Fiber Cell Membrane Water Permeability
  biological_scale: CELLULAR
  description: >-
    AQP0 is a relatively weak water channel but the dominant one in fiber cell
    membranes. Heterozygous Aqp0 knockout lenses keep about half, and null
    lenses about a fifth, of wild-type osmotic water permeability.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: water transport
    term:
      id: GO:0006833
      label: water transport
    modifier: DECREASED
  evidence:
  - reference: PMID:11773604
    reference_title: "Optical dysfunction of the crystalline lens in aquaporin-0-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Osmotic water permeability values for Aqp0(+/-) and Aqp0(-/-) lenses were reduced to approximately 46% and approximately 20% of wild-type values, respectively, and the focusing power of Aqp0(+/-) lenses was significantly lower than that of wild type."
    explanation: Graded loss of lens water permeability with Aqp0 dose in mice.
  - reference: PMID:23116563
    reference_title: "An MIP/AQP0 mutation with impaired trafficking and function underlies an autosomal dominant congenital lamellar cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unlike wild type AQP0, expression of AQP0-G165D in Xenopus oocytes did not facilitate swelling in hypotonic medium."
    explanation: A patient allele lacks water channel function in oocytes.
  downstream:
  - target: Lens Light Scattering and Loss of Transparency
    causal_link_type: DIRECT
    description: >-
      Contributory rather than sufficient. Restoring fiber cell water
      permeability with transgenic AQP1 in Aqp0-null lenses improves outer
      cortical transparency but does not prevent nuclear fiber disintegration,
      so the adhesion branch is also required.
    evidence:
    - reference: PMID:21511033
      reference_title: "Unique and analogous functions of aquaporin 0 for fiber cell architecture and ocular lens transparency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "TgAQP1(+/+)/AQP0(-/-) lenses showed improvement in transparency and lateral interdigitations in the outer cortex while inner cortex and nuclear fibers were severely disintegrated."
      explanation: Partial rescue of transparency by restoring water permeability alone.
    - reference: PMID:20599966
      reference_title: "Transgenic expression of AQP1 in the fiber cells of AQP0 knockout mouse: effects on lens transparency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Transgene AQP1 reduced the severity of lens cataract and prevented dramatic acceleration of cataractogenesis."
      explanation: Restoring water permeability lessens, but does not abolish, cataract in Aqp0-null mice.
- name: Impaired AQP0-Mediated Fiber Cell Adhesion
  biological_scale: CELLULAR
  description: >-
    Intact AQP0 mediates adhesion between apposed fiber cell membranes and
    keeps the extracellular space narrow. Loss of half the AQP0 dose in mice, or
    adhesion-defective patient alleles, reduce this adhesion.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  evidence:
  - reference: PMID:19857466
    reference_title: "Intact AQP0 performs cell-to-cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results reveal that AQP0 indeed can perform cell-to-cell adhesion."
    explanation: Direct demonstration of AQP0 adhesive function in adhesion-deficient L-cells.
  - reference: PMID:24120416
    reference_title: "Functional characterization of an AQP0 missense mutation, R33C, that causes dominant congenital lens cataract, reveals impaired cell-to-cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutant AQP0-R33C showed proper trafficking and membrane localization like WT-AQP0."
    explanation: R33C dissociates the adhesion defect from any trafficking defect.
  - reference: PMID:25229686
    reference_title: "Aquaporin 0 plays a pivotal role in refractive index gradient development in mammalian eye lens to prevent spherical aberration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "lens transparency, CTCA and compact packing of fiber cells were affected due to the loss of 50% AQP0 leading to larger extracellular space, more water content and SA, possibly due to alteration in RING."
    explanation: Heterozygous Aqp0 loss reduces fiber cell-to-cell adhesion in vivo.
  downstream:
  - target: Disorganized Lens Fiber Cell Architecture
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21511033
      reference_title: "Unique and analogous functions of aquaporin 0 for fiber cell architecture and ocular lens transparency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "AQP0 appears necessary for cell-to-cell adhesion and thereby to minimize light scattering since in the AQP0(-/-) and TgAQP1(+/+)/AQP0(-/-) lenses, fiber cell disorganization was evident."
      explanation: Loss of AQP0 adhesion, not water permeability, explains fiber disorganization.
    - reference: PMID:20599966
      reference_title: "Transgenic expression of AQP1 in the fiber cells of AQP0 knockout mouse: effects on lens transparency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, lens fiber cells showed deformities and lack of compact cellular architecture."
      explanation: Fiber architecture stays abnormal when only water permeability is restored.
- name: Disorganized Lens Fiber Cell Architecture
  biological_scale: TISSUE
  description: >-
    Aqp0-null lenses lack Y sutures, ordered packing and lateral
    interdigitations, and heterozygous lenses have widened extracellular space
    between fibers. In heterozygous Cat-Fr lenses, core fibers fail to form
    concentric growth shells.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:21511033
    reference_title: "Unique and analogous functions of aquaporin 0 for fiber cell architecture and ocular lens transparency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "AQP0(-/-) lenses were cataractous, lacked 'Y' sutures, ordered packing and well-defined lateral interdigitations."
    explanation: Ultrastructural loss of fiber cell order in Aqp0-null mice.
  - reference: PMID:25229686
    reference_title: "Aquaporin 0 plays a pivotal role in refractive index gradient development in mammalian eye lens to prevent spherical aberration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transmission and scanning electron micrographs of lenses of both mouse models showed increased extracellular space between fiber cells."
    explanation: Widened intercellular space in heterozygous Aqp0 knockout lenses.
  - reference: PMID:11053241
    reference_title: "Disruption of lens fiber cell architecture in mice expressing a chimeric AQP0-LTR protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Scanning electron microscopy further revealed that mature fiber cells within the core of the heterozygous CatFr lens failed to stratify into uniform, concentric growth shells"
    explanation: A dominant mistrafficked allele disrupts fiber cell stratification.
  downstream:
  - target: Lens Light Scattering and Loss of Transparency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21511033
      reference_title: "Unique and analogous functions of aquaporin 0 for fiber cell architecture and ocular lens transparency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Fiber cell AQP0 expression is required to maintain their organization, which is a requisite for lens transparency."
      explanation: Fiber organization maintained by AQP0 is required for transparency.
- name: ER Stress and Lens Fiber Cell Degeneration
  biological_scale: CELLULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    Mistrafficked mutant AQP0 adds a toxic component beyond loss of function.
    Lop/+ lenses activate the PERK-ATF4-DDIT3-CHAC1 branch of the unfolded
    protein response with glutathione depletion, free radical overproduction
    and calpain hyperactivation, and central fiber cells die. The Hfi and
    Cat-Tohm alleles act as dominant gain-of-function mutations, and the Nat
    allele causes fiber cell degeneration. This component is supported by mouse
    and cell data only; it has not been examined in patient lenses.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:27155571
    reference_title: "Lens ER-stress response during cataract development in Mip-mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data suggest that Lop/+ lenses undergo proteotoxic ER-stress induced cell-death resulting from prolonged activation of the Eif2ak3/Perk-Atf4-Ddit3-Chac1 branch of the UPR coupled with severe oxidative-stress."
    explanation: Transcriptome and histology of Lop/+ lenses show unfolded protein response and oxidative stress.
  - reference: PMID:12676560
    reference_title: "Bilateral congenital cataracts result from a gain-of-function mutation in the gene for aquaporin-0 in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The cataract phenotype of Cat(Tohm) is caused by a gain-of-function mutation in the mutated AQP0 protein and not by a loss-of-function mutation."
    explanation: Transgenic expression of the Cat-Tohm allele causes dose-dependent cataract.
  - reference: PMID:11414759
    reference_title: "A 76-bp deletion in the Mip gene causes autosomal dominant cataract in Hfi mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose that the cataract phenotype in the Hfi heterozygote mutant is due to a detrimental gain of function by the mutant Mip resulting in either cytotoxicity or disruption in processing of other proteins important for the lens."
    explanation: Hfi heterozygotes keep normal wild-type Mip levels yet develop cataract.
  downstream:
  - target: Lens Light Scattering and Loss of Transparency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28442635
      reference_title: "A novel missense mutation of Mip causes semi-dominant cataracts in the Nat mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The MipNat/Nat homozygotes exhibit congenital cataracts caused by the degeneration of lens fiber cells."
      explanation: Fiber cell degeneration produces congenital cataract in Nat mice.
- name: Lens Light Scattering and Loss of Transparency
  biological_scale: TISSUE
  conforms_to: cataract_lens_opacification#Loss of Lens Refractive Transparency and Light Scattering
  description: >-
    Disorganized, loosely packed and degenerating fibers scatter light and
    disturb the lens refractive index gradient, producing spherical aberration
    and reduced focusing power as well as frank opacity. In patients the
    distribution of opacity has been proposed to follow the distribution of
    AQP0 in the lens.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: maintenance of lens transparency
    term:
      id: GO:0036438
      label: maintenance of lens transparency
    modifier: DECREASED
  evidence:
  - reference: PMID:11773604
    reference_title: "Optical dysfunction of the crystalline lens in aquaporin-0-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings show that heterozygous loss of AQP0 is sufficient to trigger cataractogenesis in mice and suggest that this MIP is required for optimal focusing of the crystalline lens."
    explanation: Haploinsufficiency of Aqp0 is enough for opacity in mice.
  - reference: PMID:25229686
    reference_title: "Aquaporin 0 plays a pivotal role in refractive index gradient development in mammalian eye lens to prevent spherical aberration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knocking out of 50% of AQP0 protein caused light scattering, spherical aberration (SA) and cataract."
    explanation: Light scattering and spherical aberration in heterozygous Aqp0 knockout lenses.
  - reference: PMID:20671274
    reference_title: "Two distinct aquaporin 0s required for development and transparency of the zebrafish lens."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morpholino knock-down of either gene alone led to cataract formation, indicating that both genes are necessary for normal lens development and transparency."
    explanation: AQP0 is required for lens transparency in zebrafish as well as mouse.
  - reference: PMID:11090476
    reference_title: "Congenital progressive polymorphic cataract caused by a mutation in the major intrinsic protein of the lens, MIP (AQP0)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pattern of opacification appears to reflect the distribution of MIP in the lens."
    explanation: Clinical observation linking opacity distribution to AQP0 location.
  downstream:

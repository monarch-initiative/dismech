    snippet: "The child underwent surgery shortly afterwards for removal of the cataractous lenses and insertion of prostheses."
    explanation: Surgical lens removal with lens implants in a MIP proband.
notes: >-
  No GeneReviews chapter covers MIP-related cataract. The entry is a single
  Disease rather than a set of subtypes because the reported morphologies
  overlap within single families carrying one allele (lamellar punctate, polar,
  cortical and nuclear opacity in the polymorphic T138R family), and a
  systematic review found no genotype-morphology correlation. A truncating
  null Mip allele in rat is recessive (PMID:23226368), whereas the Aqp0
  knockout mouse shows late heterozygous opacity, so how much of human
  dominance is haploinsufficiency rather than dominant-negative trapping or
  toxicity of the mutant protein is not settled.

    explanation: >-
      ClinGen's gene validity row for MONDO:0008679, the class labelled Wilms tumor 1,
      graded Definitive under an autosomal dominant model by the Hereditary Cancer
      Gene Curation Expert Panel.
  - reference: CGGV:assertion_65010002-ff97-4dc0-a89f-6c77abf0982a-2020-07-30T205501.047Z
    reference_title: "WT1 / Wilms tumor 1 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therefore, we have split curations for WT1 into Wilms tumor type 1 and congenital malformation syndromes associated with variants in WT1."
    explanation: >-
      ClinGen's own lumping and splitting ruling: Wilms tumor type 1 is curated
      separately from the WT1 congenital malformation syndromes, which is why
      MONDO:0008679 is neither a subtype of this entry nor a duplicate of the WT1
      syndrome entries.
  - reference: PMID:32412586
    reference_title: "Recent advances in Wilms' tumor predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Here, we describe evidence implicating WT1, the 11p15 locus, and the recently identified genes CTR9, REST and TRIM28 in WT predisposition."
    explanation: >-
      Names the genes the current account of Wilms tumor predisposition covers.
      Read with the searches recorded in this record's notes, it is the basis for
      treating the POU6F2 attribution as unsupported.
  - reference: PMID:15459955
    reference_title: "Germline mutations of the POU6F2 gene in Wilms tumors with loss of heterozygosity on chromosome 7p14."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "our observations suggest that the gene is a tumor suppressor and is involved in hereditary predisposition to WT"
    explanation: >-
      Cited for the existence of the POU6F2 proposal, not for its truth. This is the
      only primary report behind MONDO's POU6F2 attribution, it rests on two germline
      substitutions in two patients, and its own conclusion is the hedge quoted here.
      Read with the searches recorded in this record's notes, the attribution is not
      supported, which is why no POU6F2 mechanism is curated in this entry.
  notes: >-
    Where the four classes reconciled against MONDO belong. Wilms tumor 1
    (MONDO:0008679) is autosomal dominant Wilms tumor predisposition from WT1 loss
    of function; the two ClinGen rows quoted above are why it is neither a subtype
    of this tumor nor a duplicate of the WT1 syndromes curated in the WT1 disorders
    family (kb/groupings/WT1_Disorders.yaml), and it belongs in its own
    entry. Wilms tumor 6 (MONDO:0014779, REST) and Wilms tumor 7 (MONDO:0979876,
    TRIM28) are established predisposition conditions. Wilms tumor 6 belongs in
    its own entry; Wilms tumor 7 is curated as its own entry,
    TRIM28-Related_Wilms_Tumor_Predisposition. The tumor side of both mechanisms
    is curated in this entry's pathophysiology and genetic sections. Wilms tumor 5 (MONDO:0011112) attributes
    Wilms tumor to POU6F2, and that attribution is thin: the PubMed query POU6F2
    AND Wilms returns four records in total, the most recent published in 2016; the
    ClinGen gene validity CSV downloaded on 2026-09-26 carries no POU6F2 row among
    its 3,685 assertions; and the 2020 review of Wilms tumor predisposition cited
    here covers WT1, the 11p15 locus, CTR9, REST and TRIM28 without POU6F2. POU6F2
    is therefore recorded as investigated and not supported rather than curated
    either as a condition or as a gene mechanism.
treatments:
- name: Surgical Resection
  description: >-
    Nephrectomy is the primary treatment for unilateral Wilms tumor. In North
    America (COG), upfront nephrectomy provides staging information and allows
    for immediate histologic diagnosis and molecular analysis. In Europe (SIOP),
    preoperative chemotherapy is given first. Both approaches achieve similar
    survival rates.
  target_mechanisms:
  - target: Wilms Tumor Outgrowth
    treatment_effect: INHIBITS
    description: >-
      Nephrectomy physically removes the primary tumor mass, eliminating
      the bulk of the malignant nephron progenitor-derived outgrowth.
    evidence:
    - reference: PMID:37385707
      reference_title: "Wilms Tumor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Advances in multimodal therapy including surgery, chemotherapy, and
        radiation therapy given according to risk stratification have allowed
        most patients to achieve survival rates in excess of 90%.
      explanation: >-
        Establishes surgery as a core component of curative multimodal therapy
        that removes the primary tumor and contributes to >90% survival,
        supporting nephrectomy's action on the tumor-outgrowth node.
  treatment_term:
    preferred_term: nephrectomy
    term:
      id: NCIT:C15284
      label: Nephrectomy
  evidence:
  - reference: PMID:33394739
    reference_title: "New approaches to risk stratification for Wilms tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The COG approach of upfront nephrectomy allows for immediate histologic
      diagnosis, molecular analysis, and accurate local staging assessment.
    explanation: >-
      Confirms the role of nephrectomy as primary surgical approach in COG trials.
  - reference: PMID:37385707
    reference_title: "Wilms Tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Advances in multimodal therapy including surgery, chemotherapy, and radiation
      therapy given according to risk stratification have allowed most patients to
      achieve survival rates in excess of 90%.
    explanation: >-
      Confirms the multimodal approach including surgery achieves >90% survival.
- name: Chemotherapy
  description: >-
    Actinomycin D and vincristine form the backbone of treatment for favorable
    histology tumors. Doxorubicin and other agents are added for higher-stage
    or anaplastic tumors. Cyclophosphamide and etoposide are added for the
    highest-risk patients.
  target_mechanisms:
  - target: Persistent Blastemal Progenitor State
    treatment_effect: INHIBITS
    description: >-
      Blastemal-predominant histology persisting after preoperative chemotherapy
      marks a chemoresistant, high-risk primitive progenitor state; it is targeted
      with intensified post-operative chemotherapy regimens (adding doxorubicin
      and, for higher stages, etoposide, cyclophosphamide, and carboplatin) to
      reduce relapse risk.
    evidence:
    - reference: PMID:25592561
      reference_title: "Outcome of localised blastemal-type Wilms tumour patients treated according to intensified treatment in the SIOP WT 2001 protocol, a report of the SIOP Renal Tumour Study Group (SIOP-RTSG)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Blastemal-type Wilms tumour (BT-WT) has been identified as a high risk
        histological subgroup in WT assessed after pre-nephrectomy chemotherapy
        in trials of the International Society of Paediatric Oncology (SIOP)
        Renal Tumour Study Group. Therefore, in SIOPWT2001, post-operative
        chemotherapy for BT-WT was intensified aiming to improve survival.
      explanation: >-
        The SIOP-RTSG report shows that the chemoresistant blastemal progenitor
        state is specifically targeted by intensified post-operative
        chemotherapy, the mechanism this treatment addresses.

- name: Selinexor
  description: >-
    Selinexor is an oral XPO1 inhibitor under clinical evaluation for recurrent
    or refractory Wilms tumor and other pediatric solid tumors.
  target_mechanisms:
  - target: Wilms Tumor Outgrowth
    treatment_effect: INHIBITS
    description: >-
      Selinexor blocks XPO1-mediated nuclear export, forcing nuclear
      accumulation of tumor suppressors (TP53, FOXO, RB) that restrict
      Wilms tumor cell proliferation and survival.
    evidence:
    - reference: clinicaltrials:NCT05985161
      reference_title: "A Multi-Center Phase II Study of Selinexor in Treating Recurrent or Refractory Wilms Tumor and Other Pediatric Solid Tumors"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The purpose of this study is to find out whether selinexor is an
        effective treatment for people who have a relapsed/refractory Wilms
        tumor, rhabdoid tumor, MPNST, BCOR-driven sarcoma, or another solid
        tumor that makes a higher than normal amount of XPO1
      explanation: >-
        The trial evaluates selinexor (an XPO1 inhibitor) against relapsed/
        refractory Wilms tumor overexpressing XPO1, supporting its action on the
        tumor-outgrowth node.

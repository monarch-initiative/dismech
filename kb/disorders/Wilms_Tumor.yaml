differential_diagnoses:
- name: Hereditary Wilms Tumor (Germline Predisposition)
  disease_term:
    preferred_term: hereditary Wilms tumor
    term:
      id: MONDO:0003321
      label: hereditary Wilms tumor
  description: >-
    A child presenting with what looks like sporadic Wilms tumor may instead have
    a constitutional Wilms tumor predisposition condition. The tumor itself is the
    same, so the distinction is not made on presentation; it changes contralateral
    kidney management, surveillance, and counselling of relatives. Reported shares
    run from about one in ten, counting the 21 predisposition genes named in the
    2019 exome study, to up to 15 per cent of all cases, and the predisposition
    gene set and the recurrent somatic driver set barely overlap. MONDO gives each
    of these conditions its own class under hereditary Wilms tumor; each is a
    Mendelian condition needing its own entry rather than a stratum of this one.
  distinguishing_features:
  - Synchronous bilateral or multifocal tumors, or a later contralateral primary.
  - A family history of Wilms tumor.
  - Epithelial or epithelial predominant histology with perilobar nephrogenic rests, which is the pattern of germline TRIM28 loss.
  - An extrarenal feature such as aniridia, a genitourinary anomaly, asymmetric overgrowth or nephropathy.
  evidence:
  - reference: PMID:32412586
    reference_title: "Recent advances in Wilms' tumor predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Wilms' tumor (WT), the most common childhood kidney cancer, develops in association with an underlying germline predisposition in up to 15% of cases."
    explanation: >-
      Gives the share of Wilms tumor arising on a constitutional predisposition.
  - reference: PMID:30885698
    reference_title: "Identification of new Wilms tumour predisposition genes: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The four new Wilms tumour predisposition genes identified-TRIM28, FBXW7, NYNRIN, and KDM3B-are involved in diverse biological processes and, together with the other 17 known Wilms tumour predisposition genes, account for about 10% of Wilms tumour cases."
    explanation: >-
      Quantifies the predisposition gene set and its contribution, from the largest
      Wilms tumor exome series.
  - reference: PMID:30885698
    reference_title: "Identification of new Wilms tumour predisposition genes: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overlap between these 21 constitutionally mutated predisposition genes and 20 genes somatically mutated in Wilms tumour is limited, consisting of only four genes."
    explanation: >-
      The mechanistic reason these conditions are not strata of the somatic tumor:
      the constitutional and somatic gene sets are largely disjoint.
  - reference: CGGV:assertion_65010002-ff97-4dc0-a89f-6c77abf0982a-2020-07-30T205501.047Z
    reference_title: "WT1 / Wilms tumor 1 (Definitive)"

notes: >-
  Scope boundary between this entry and the germline Wilms tumor predisposition
  conditions. This entry models the somatic embryonal renal tumor. MONDO files
  seven germline predisposition classes labelled Wilms tumor 1 through Wilms tumor
  7 under hereditary Wilms tumor (MONDO:0003321); four of them carry a causal gene
  in their OWL axioms, and Wilms tumor 2, 3 and 4 carry none. That class
  is a child of Wilms tumor and a sibling of kidney Wilms tumor (MONDO:0019004),
  so the seven are not molecular strata of this tumor, and design decisions 3a
  keeps a germline cancer predisposition condition in its own Mendelian entry
  separate from the tumor it predisposes to. Four of the seven were examined and
  are dispositioned in the hereditary Wilms tumor differential diagnosis record
  below: Wilms tumor 1 (MONDO:0008679, WT1), Wilms tumor 5 (MONDO:0011112,
  POU6F2), Wilms tumor 6 (MONDO:0014779, REST) and Wilms tumor 7 (MONDO:0979876,
  TRIM28). What this entry curates instead is how those genes behave inside the
  tumor, because a predisposing tumor suppressor lesion followed by a somatic
  second hit is a mechanism of the tumor itself.

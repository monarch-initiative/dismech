- name: Radiation Therapy
  description: >-
    Flank radiation is used for stage III tumors and higher. Whole abdominal
    radiation is used for tumor rupture or diffuse peritoneal contamination.
    Whole lung irradiation is used for pulmonary metastases that fail to
    respond completely to chemotherapy.
  target_mechanisms:
  - target: Wilms Tumor Outgrowth
    treatment_effect: INHIBITS
    description: >-
      Ionizing radiation induces DNA double-strand breaks in tumor cells,
      eliminating residual local and metastatic Wilms tumor burden not
      controlled by surgery or chemotherapy.
    evidence:
    - reference: PMID:32893998
      reference_title: "Wilms tumor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        focused on improving cure rates and minimizing toxicity by limiting the
        use of radiation and doxorubicin
      explanation: >-
        Confirms radiation therapy as an established local-control modality for
        Wilms tumor burden, used in a risk-adapted manner to preserve cure rates.

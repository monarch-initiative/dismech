biochemical:
- name: 2-Hydroxyglutarate Levels
  loinc_term:
    id: LOINC:79305-9
    label: D-2-hydroxyglutarate [Moles/volume] in Serum or Plasma
  notes: >-
    Bound the D-enantiomer-specific serum code, not a generic/racemic
    "2-hydroxyglutarate" code: IDH1/IDH2 neomorphic mutations specifically
    produce D-2-HG, while L-2-HG is the analyte of an unrelated metabolic
    disorder (L-2-hydroxyglutaric aciduria), so binding the racemic code
    would conflate two different biological entities under one identity.
    No bone-marrow-specific D2HG code was found for the "or bone marrow"
    half of this row's claim; the serum/plasma code is bound as the closest
    specimen match. No `interpretation_bands` are recorded: this row states
    only that levels are "markedly elevated," with no numeric cut-off.
    2-HG can be measured in serum or bone marrow and is markedly elevated in
    IDH-mutated AML. Levels correlate with disease burden and decrease with
    effective IDH inhibitor therapy. Serves as a pharmacodynamic biomarker.
- name: IDH1/IDH2 Mutation Testing
  loinc_term:
    id: LOINC:95772-0
    label: IDH1 and IDH2 genes targeted mutation analysis in Blood or Tissue by Molecular genetics method
  notes: >-
    Bound the combined IDH1+IDH2 targeted-analysis code: this row tests both
    genes together ("PCR-based assays or next-generation sequencing detect
    IDH1 R132 and IDH2 R140/R172 mutations") rather than naming either gene
    alone, and the code's own specimen scope ("Blood or Tissue") and method
    scope ("Molecular genetics method") match the row's lack of single-method
    or single-specimen commitment.
    PCR-based assays or next-generation sequencing detect IDH1 R132 and IDH2
    R140/R172 mutations. Testing is essential for therapy selection given
    the availability of targeted inhibitors.

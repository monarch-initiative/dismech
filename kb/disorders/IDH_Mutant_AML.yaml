  - preferred_term: IDH1
    term:
      id: hgnc:5382
      label: IDH1
  - preferred_term: IDH2
    term:
      id: hgnc:5383
      label: IDH2
  molecular_functions:
  - preferred_term: isocitrate dehydrogenase (NADP+) activity
    modifier: GAIN_OF_FUNCTION
    term:

treatments:
- name: Ivosidenib
  description: >-
    Selective oral mutant IDH1 inhibitor approved for newly diagnosed
    intensive-chemotherapy-ineligible (alone or combined with azacitidine) and
    relapsed or refractory IDH1-mutated AML. Restores myeloid differentiation
    by lowering intracellular 2-HG levels; differentiation syndrome is a
    clinically important adverse effect requiring prompt corticosteroid therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:

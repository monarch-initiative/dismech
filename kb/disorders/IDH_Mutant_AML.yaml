has_subtypes:
- name: IDH1-Mutated AML
  description: >-
    AML with somatic mutations in cytoplasmic IDH1, most commonly at residue
    R132. IDH1 mutations occur in 6-10% of AML cases, frequently co-occur with
    NPM1 and DNMT3A mutations, and are targetable with ivosidenib.
  evidence:
  - reference: PMID:21130701
    reference_title: "Leukemic IDH1 and IDH2 mutations result in a hypermethylation phenotype, disrupt TET2 function, and impair hematopoietic differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High throughput resequencing of IDH1 and IDH2 revealed IDH1 R132 mutations in 6.2% of patients and IDH2 mutations in 8.6% of patients (6.3% R140Q and 2.3% R172K)."
    explanation: Cohort resequencing defines the IDH1 R132-mutated AML stratum and its prevalence in de novo AML.
- name: IDH2-Mutated AML
  description: >-
    AML with somatic mutations in mitochondrial IDH2 at active-site arginine
    residues R140 (more common) or R172. IDH2 mutations occur in 8-12% of AML
    cases and are targetable with enasidenib.
  evidence:
  - reference: DOI:10.1182/blood-2018-08-869008
    reference_title: "Molecular remission and response patterns in patients with mutant-IDH2 acute myeloid leukemia treated with enasidenib"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 8% to 19% of patients with acute myeloid leukemia (AML) have isocitrate dehydrogenase-2 (IDH2) mutations, which occur at active site arginine residues R140 and R172."
    explanation: Defines the IDH2-mutated AML subtype, its active-site hotspots (R140 and R172), and its prevalence among AML patients.
pathophysiology:
- name: IDH Neomorphic Enzyme Activity
  description: >-
    Wild-type IDH1 and IDH2 convert isocitrate to alpha-ketoglutarate in the
    cytoplasm and mitochondria respectively. Heterozygous somatic mutations in
    IDH1 (R132) or IDH2 (R140, R172) confer a neomorphic enzyme activity that
    reduces alpha-ketoglutarate to the oncometabolite D-2-hydroxyglutarate
    (2-HG) in leukemic myeloblasts.
  biological_scale: MOLECULAR
  conforms_to: oncometabolite_dioxygenase_inhibition#Metabolic Enzyme Lesion (TCA Tumor Suppressor Loss or IDH Neomorphic Gain)
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: NEOMORPHIC

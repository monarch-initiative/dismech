      term:
        id: CHEBI:145430
        label: ivosidenib
  target_mechanisms:
  - target: IDH Neomorphic Enzyme Activity
    treatment_effect: INHIBITS
    description: Selectively inhibits mutant IDH1 catalytic production of D-2-HG
  - target: Differentiation Block
    treatment_effect: INHIBITS
    description: Depletion of 2-HG relieves epigenetic arrest and induces myeloid maturation
  evidence:

name: Acute Myeloid Leukemia, IDH-Mutated
creation_date: '2026-01-26T02:55:13Z'
description: >-
  IDH-mutated acute myeloid leukemia is characterized by somatic mutations in
  isocitrate dehydrogenase genes IDH1 (6-10% of AML) or IDH2 (8-12% of AML).
  These heterozygous active-site mutations confer neomorphic enzymatic activity,
  producing the oncometabolite D-2-hydroxyglutarate (2-HG) from
  alpha-ketoglutarate. Elevated 2-HG competitively inhibits
  alpha-ketoglutarate-dependent dioxygenases, causing genome-wide DNA and
  histone hypermethylation and a block in myeloid differentiation. Selective
  mutant IDH inhibitors (ivosidenib for IDH1, enasidenib for IDH2) restore
  hematopoietic differentiation by lowering intracellular 2-HG levels.
category: Neoplastic
categories:
- Hematologic Malignancy
- Acute Leukemia
- Molecularly Defined Cancer
- Metabolic Cancer
synonyms:
- IDH-mutated acute myeloid leukemia
- IDH-mutant acute myeloid leukemia
- IDH1/2-mutant acute myeloid leukemia
- AML with IDH1 or IDH2 mutation

  evidence:
  - reference: PMID:21130701
    reference_title: "Leukemic IDH1 and IDH2 mutations result in a hypermethylation phenotype, disrupt TET2 function, and impair hematopoietic differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common IDH1/2 mutations in AML and brain tumors, affecting R132 of IDH1 or R140 and R172 of IDH2, have the common feature of acquiring a neomorphic enzymatic activity catalyzing the NADPH-dependent reduction of α KG to R(−)-2-hydroxyglutarate (2HG) (Dang et al., 2009; Ward et al., 2010)."
    explanation: Establishes that leukemic IDH1 R132 and IDH2 R140/R172 mutations confer neomorphic NADPH-dependent reduction of alpha-ketoglutarate to D-2-HG.
  - reference: PMID:37526143
    reference_title: "The curious case of IDH mutant acute myeloid leukaemia: biochemistry and therapeutic approaches."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in isocitrate dehydrogenase (IDH) 1 and -2 increase the capacity of cancer cells to produce a normally scarce metabolite, D-2-hydroxyglutarate (2-HG), by several orders of magnitude."
    explanation: This abstract links IDH1/2 mutations to increased D-2-HG production, supporting the neomorphic IDH activity described.
  downstream:
  - target: 2-HG Accumulation
    description: Neomorphic reduction of alpha-ketoglutarate drives massive intracellular 2-HG production
- name: 2-HG Accumulation
  description: >-
    Mutant IDH enzymes produce the oncometabolite D-2-hydroxyglutarate at
    markedly increased levels, leading to millimolar accumulation in leukemic
    cells and serum.
  biological_scale: MOLECULAR
  conforms_to: oncometabolite_dioxygenase_inhibition#Oncometabolite Accumulation
  cell_types:
  - preferred_term: myeloblast
    term:
      id: CL:0000835
      label: myeloblast
  evidence:
  - reference: PMID:37526143
    reference_title: "The curious case of IDH mutant acute myeloid leukaemia: biochemistry and therapeutic approaches."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in isocitrate dehydrogenase (IDH) 1 and -2 increase the capacity of cancer cells to produce a normally scarce metabolite, D-2-hydroxyglutarate (2-HG), by several orders of magnitude."
    explanation: This review supports marked accumulation of the oncometabolite D-2-HG in IDH-mutant AML.
  downstream:
  - target: Dioxygenase Inhibition
    description: Accumulated 2-HG competitively occupies the alpha-ketoglutarate binding site of dioxygenases
- name: Dioxygenase Inhibition
  description: >-
    2-HG is structurally analogous to alpha-ketoglutarate and competitively
    inhibits alpha-ketoglutarate-dependent dioxygenases, including TET2 DNA
    demethylases and Jumonji-domain histone demethylases, disrupting normal
    epigenetic regulation.
  biological_scale: MOLECULAR
  conforms_to: oncometabolite_dioxygenase_inhibition#Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases
  evidence:
  - reference: PMID:37526143
    reference_title: "The curious case of IDH mutant acute myeloid leukaemia: biochemistry and therapeutic approaches."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "2-HG dysregulates a wide array of molecular pathways, among them a large family of dioxygenases that utilise the closely related metabolite α-ketoglutarate (α-KG) as an essential co-substrate."
    explanation: Review article confirms that 2-HG inhibits a broad family of alpha-ketoglutarate-dependent dioxygenases, the mechanistic basis of the IDH-mutant epigenetic phenotype.
  biological_processes:
  - preferred_term: DNA demethylation
    modifier: DECREASED
    term:
      id: GO:0141166
      label: chromosomal 5-methylcytosine DNA demethylation pathway
  downstream:
  - target: DNA Hypermethylation
    description: TET2 inhibition impairs active cytosine hydroxymethylation and causes aberrant DNA methylation
  - target: Histone Methylation Dysregulation
    description: Jumonji-domain histone demethylase inhibition alters chromatin methylation marks
- name: DNA Hypermethylation
  description: >-
    Inhibition of TET2 by 2-HG impairs the conversion of 5-methylcytosine to
    5-hydroxymethylcytosine, disrupting active DNA demethylation. This causes
    global promoter hypermethylation, silencing myeloid differentiation genes
    and contributing to the leukemic phenotype.
  biological_scale: MOLECULAR
  conforms_to: oncometabolite_dioxygenase_inhibition#Impaired Demethylation and Genome-Wide Hypermethylation
  evidence:
  - reference: PMID:21130701
    reference_title: "Leukemic IDH1 and IDH2 mutations result in a hypermethylation phenotype, disrupt TET2 function, and impair hematopoietic differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutational and epigenetic profiling of a large acute myeloid leukemia (AML) patient cohort revealed that IDH1/2-mutant AMLs display global DNA hypermethylation and a specific hypermethylation signature."
    explanation: Patient-cohort profiling establishes global DNA hypermethylation and a shared hypermethylator signature in IDH1/2-mutant AML.
  biological_processes:
  - preferred_term: chromosomal 5-methylcytosine DNA demethylation pathway
    modifier: DECREASED
    term:
      id: GO:0141166
      label: chromosomal 5-methylcytosine DNA demethylation pathway
  downstream:
  - target: Differentiation Block
    description: Epigenetic silencing of differentiation genes maintains the immature blast state
- name: Histone Methylation Dysregulation
  description: >-
    2-HG inhibits Jumonji-domain histone demethylases that remove methyl groups
    from lysine residues on histones. This causes accumulation of repressive
    histone marks and altered gene expression patterns contributing to
    leukemogenesis.
  biological_scale: MOLECULAR
  evidence:
  - reference: DOI:10.1182/blood-2018-08-869008
    reference_title: "Molecular remission and response patterns in patients with mutant-IDH2 acute myeloid leukemia treated with enasidenib"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IDH2 mutations produce an oncometabolite, 2-hydroxyglutarate (2-HG), which leads to DNA and histone hypermethylation and impaired hematopoietic differentiation."
    explanation: Links 2-HG production directly to histone hypermethylation alongside DNA hypermethylation and impaired hematopoietic differentiation.
  molecular_functions:
  - preferred_term: histone demethylase activity
    modifier: DECREASED
    term:
      id: GO:0032452
      label: histone demethylase activity
  downstream:
  - target: Differentiation Block
    description: Repressive histone hypermethylation cooperates with DNA hypermethylation to arrest myeloid maturation
- name: Differentiation Block
  description: >-
    The combined epigenetic effects of 2-HG on DNA methylation and histone
    modifications block normal myeloid differentiation, maintaining leukemic
    cells in an immature blast state that crowds out normal marrow
    hematopoiesis. Selective IDH inhibitors overcome this block and induce
    maturation of leukemic blasts.
  biological_scale: CELLULAR
  conforms_to: oncometabolite_dioxygenase_inhibition#Oncometabolite-Driven Tumorigenesis with Differentiation Block
  evidence:
  - reference: DOI:10.1038/s41408-021-00497-1
    reference_title: "Acute myeloid leukemia with IDH1 and IDH2 mutations: 2021 treatment algorithm"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These recurrent mutations in key metabolic enzymes lead to the production of the oncometabolite 2-hydroxyglutarate, which promotes leukemogenesis through a block in normal myeloid differentiation."
    explanation: Confirms that 2-HG drives leukemogenesis by arresting normal myeloid differentiation.
  - reference: PMID:21130701
    reference_title: "Leukemic IDH1 and IDH2 mutations result in a hypermethylation phenotype, disrupt TET2 function, and impair hematopoietic differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, either expression of mutant IDH1/2 or Tet2 depletion impaired hematopoietic differentiation and increased stem/progenitor cell marker expression, suggesting a shared proleukemogenic effect."
    explanation: Experimental expression of mutant IDH1/2 impairs hematopoietic differentiation and expands immature stem/progenitor cells.

prevalence:
- population: Live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 160.0
  notes: >-
    A commonly cited estimate is 1.6 per 1,000 live births (160 per 100,000).
    This is an ascertainment-sensitive estimate rather than a universal rate:
    improved postnatal detection of mild congenital lesions, including ASD,
    has materially increased reported prevalence over time.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atrial septal defect (ASD) is a common congenital heart defect, with an
      estimated birth prevalence of 1.6 per 1000 live births
    explanation: >-
      The review provides the numeric birth-prevalence estimate, normalized here
      to a rate per 100,000 live births.
  - reference: PMID:30783674
    reference_title: "Global birth prevalence of congenital heart defects 1970-2017: updated systematic review and meta-analysis of 260 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The change in prevalence of mild CHD lesions (ventricular septal defect,
      atrial septal defect and patent ductus arteriosus) together explained
      93.4% of the increased overall prevalence, consistent with a major role of
      improved postnatal detection of less severe lesions.
    explanation: >-
      This meta-analysis supports the explicit ascertainment caveat for the
      reported ASD birth prevalence.
progression:
- phase: Often asymptomatic childhood and adolescence
  age_range: Childhood through adolescence
  notes: >-
    An isolated secundum ASD may be clinically silent despite an established
    left-to-right shunt. This phase is not universal and does not imply that the
    shunt is hemodynamically insignificant.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with an isolated ASDII often remain asymptomatic during childhood
      and adolescence.
    explanation: >-
      The review directly supports an often-asymptomatic pediatric course for
      isolated secundum ASD.
- phase: Adult symptomatic presentation
  age_range: Commonly from the third or fourth decade
  notes: >-
    Exercise intolerance, fatigue, or a supraventricular tachyarrhythmia may be
    the first recognized manifestation. Timing varies with defect size,
    ventricular compliance, pulmonary vascular disease, and associated lesions.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, most will become symptomatic from the third or fourth decade, and
      life expectancy is reduced overall.
    explanation: >-
      The review directly describes the typical timing of symptomatic adult
      presentation in untreated isolated secundum ASD.
- phase: Right-heart failure in advanced volume overload
  notes: >-
    Persistent hemodynamically important shunting can progress from right-sided
    chamber dilation to ventricular dysfunction and right-sided heart failure.
  evidence:
  - reference: PMID:34535989
    reference_title: "Atrial septal defect in adulthood: a new paradigm for congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      time-related complications primarily arrhythmias, thromboembolism, right
      heart failure and, in a subset of patients, pulmonary arterial hypertension
      (PAH).
    explanation: >-
      This adult ASD review directly includes right-heart failure among
      time-related complications.
- phase: Pulmonary vascular disease and Eisenmenger physiology
  notes: >-
    A minority develop severe pulmonary arterial hypertension and eventual
    right-to-left shunt reversal. This is not an inevitable sequence and must be
    distinguished from the much more common right-heart volume-overload course.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe PAH, with possible progression to Eisenmenger physiology, ensues in
      a minority of patients.
    explanation: >-
      The review explicitly limits Eisenmenger progression to a minority of
      patients.
- phase: Post-closure residual risk
  notes: >-
    Closure unloads the right heart but does not erase established pulmonary
    vascular disease or atrial electrical remodeling. Risk is greatest with
    pre-existing pulmonary hypertension, dysrhythmia, or later repair, so
    surveillance remains individualized.
  evidence:
  - reference: PMID:30305954
    reference_title: Arrhythmias and conduction disorders associated with atrial septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arrhythmia incidence is decreased after ASD closure, but remains elevated
      compared to general population.
    explanation: >-
      Persistent excess arrhythmia risk after closure directly supports a
      post-closure residual-risk phase and ongoing individualized surveillance.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Small, hemodynamically insignificant defects may impose little functional
    burden, whereas persistent significant shunts can require catheter or
    surgical repair and lifelong congenital-cardiology follow-up and can lead to
    arrhythmia, thromboembolism, right-heart failure, or pulmonary arterial
    hypertension. The broad ASD/interatrial-communication umbrella therefore
    cannot be represented honestly by one low, moderate, or high tier.
  evidence:
  - reference: PMID:34535989
    reference_title: "Atrial septal defect in adulthood: a new paradigm for congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although considered a simple defect, challenges in optimal diagnostic and
      treatment options still exist due to great heterogeneity in terms of
      anatomy and time-related complications primarily arrhythmias,
      thromboembolism, right heart failure and, in a subset of patients,
      pulmonary arterial hypertension (PAH).
    explanation: >-
      The review directly supports variable burden across anatomy and time and
      identifies the principal sources of serious morbidity.
pathophysiology:
- name: Abnormal Atrial Septation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    ASD originates from abnormal formation or deficiency of the interatrial
    septum or from anatomically related interatrial communications. True septal
    defects are confined to the oval fossa region, while primum, sinus venosus,
    and coronary sinus communications have distinct morphologic origins but share
    atrial-level mixing physiology.

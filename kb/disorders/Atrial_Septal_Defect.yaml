discussions:
- discussion_id: asd-pah-closure-thresholds
  prompt: >-
    Which patients with ASD and elevated pulmonary vascular resistance benefit
    from pulmonary-arterial-hypertension therapy followed by closure, and which
    are harmed by eliminating a pressure-relieving interatrial communication?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pulmonary Vascular and Ventricular Complications
  - treatments#Transcatheter closure of secundum ASD
  rationale: >-
    This decision separates potentially reversible shunt-associated pulmonary
    hypertension from severe irreversible disease and Eisenmenger physiology.
    Existing observational studies use heterogeneous pulmonary-hypertension
    definitions, so a single pressure estimate is not an adequate closure rule.
  evidence:
  - reference: PMID:33328279
    reference_title: "Prevalence and outcomes of pulmonary hypertension after percutaneous closure of atrial septal defect: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Studies applied variable PH definitions.
    explanation: >-
      Heterogeneous definitions limit direct comparison and threshold inference
      across closure cohorts.
  - reference: PMID:33328279
    reference_title: "Prevalence and outcomes of pulmonary hypertension after percutaneous closure of atrial septal defect: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Larger, prospective studies with consistent PH definitions using the
      recommended measurement modality are warranted.
    explanation: >-
      The meta-analysis explicitly calls for prospective, consistently measured
      studies to resolve this management gap.
- discussion_id: asd-postclosure-surveillance-and-arrhythmia
  prompt: >-
    What surveillance schedule and rhythm strategy best prevent or detect late
    pulmonary hypertension, atrial arrhythmia, and device-related complications
    after ASD closure?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Atrial Electrical Remodeling
  - treatments#Transcatheter closure of secundum ASD
  rationale: >-
    Closure reduces shunt load but does not erase pre-existing atrial remodeling,
    and follow-up intensity varies with age at closure, residual lesions,
    pulmonary pressure, and rhythm history.
  evidence:
  - reference: PMID:30305954
    reference_title: Arrhythmias and conduction disorders associated with atrial septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arrhythmia incidence is decreased after ASD closure, but remains elevated
      compared to general population.
    explanation: >-
      Persistent excess rhythm risk after closure motivates surveillance and
      prevention research.
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, consensus regarding frequency and duration of follow-up after
      device closure is lacking.
    explanation: >-
      The review explicitly identifies uncertainty about post-device follow-up.
- discussion_id: asd-genetic-architecture
  prompt: >-
    What fraction of apparently isolated ASD is explained by rare Mendelian
    variants, polygenic susceptibility, or regulatory variation, and how should
    penetrance and extracardiac risk be incorporated into family counseling?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Abnormal Atrial Septation
  - genetic#NKX2-5
  - genetic#GATA4
  - genetic#TBX5
  - genetic#MYH6
  rationale: >-
    A few stable gene associations explain rare families or syndromic disease,
    but most secundum ASD is sporadic and a negative current panel cannot exclude
    a genetic contribution.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      most secundum ASDs occur sporadically
    explanation: >-
      This directly supports the gap between rare familial genes and the much
      larger sporadic population.
  - reference: PMID:38884726
    reference_title: Human Genetics of Atrial Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, it points to different pathways and gene networks relevant to
      the dysregulation of cardiomyogenesis and ASD pathogenesis.
    explanation: >-
      The current review supports a heterogeneous network architecture rather
      than one dominant ASD gene.

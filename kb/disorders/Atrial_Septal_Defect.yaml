    substitution reduces affinity for myosin while retaining actomyosin motor
    function. ClinGen has curated ACTC1 three times, against hypertrophic
    cardiomyopathy (Definitive), dilated cardiomyopathy (Moderate) and
    arrhythmogenic right ventricular cardiomyopathy (No Known Disease
    Relationship), but against no atrial-septal-defect or
    congenital-heart-disease term, in the ClinGen Gene-Disease Validity CSV
    snapshot committed in this repository (file creation date 2026-01-24).
  evidence:

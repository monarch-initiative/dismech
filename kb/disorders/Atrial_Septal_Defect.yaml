  evidence:
  - reference: PMID:22368625
    reference_title: Defining the morphologic phenotypes of atrial septal defects and interatrial communications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "True atrial septal defects are limited to deficiencies totally within the confines of the oval fossa and its antero-inferior rim."
    explanation: >-
      This anatomic review grounds true ASD in a deficiency of atrial septal
      tissue within the oval fossa region.
  - reference: PMID:22368625
    reference_title: Defining the morphologic phenotypes of atrial septal defects and interatrial communications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The unifying physiological feature of all these variants, whether their morphology is that of a defect within the area of the oval fossa, or an opening elsewhere within the atrium, is that mixing of the systemic and pulmonary blood occurs at atrial level."
    explanation: >-
      The review supports modeling ASD and related interatrial communications as
      atrial-level mixing lesions.
  - reference: PMID:15735645
    reference_title: Mutation in myosin heavy chain 6 causes atrial septal defect.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Morpholino knock-down of expression of the chick MYH6 homolog eliminates
      the formation of the atrial septum without overtly affecting atrial
      chamber formation.
    explanation: >-
      This developmental perturbation links a validated familial ASD gene to
      atrial-septum formation rather than only to a statistical association.
  - reference: PMID:17947298
    reference_title: Alpha-cardiac actin mutations produce atrial septal defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Morpholino (MO) knockdown of ACTC1 in chick embryos produces delayed looping and reduced atrial septa, supporting a developmental role for this protein.
    explanation: >-
      Sources the ACTC1 binding on this node: reducing the gene product in a
      developing heart leaves the atrial septum deficient.
  - reference: PMID:19762328
    reference_title: "A gain-of-function TBX20 mutation causes congenital atrial septal defects, patent foramen ovale and cardiac valve defects."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Ostium secundum atrial septal defects (ASDII) account for approximately 10% of all congenital heart defects (CHD), and mutations in cardiac transcription factors, including TBX20, were identified as an underlying cause for ASDII."
    explanation: >-
      Sources the TBX20 binding on this node and places it with the other
      cardiac transcription factors bound here. The sentence is from this
      report's own background rather than its results, hence the quote role.
  - reference: PMID:16287139

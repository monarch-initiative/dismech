diagnosis:
- name: Transthoracic echocardiography
  description: >-
    Transthoracic echocardiography is the primary diagnostic study for defining
    an atrial-level communication and assessing shunt direction, right-heart
    volume load, ventricular function, and estimated pulmonary pressure.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: >-
    Demonstrates interatrial communication, shunt direction, right-heart
    dilation, and estimates of pulmonary pressure.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transthoracic echocardiography (TTE) is the primary imaging modality for
      the diagnosis of an ASDII
    explanation: >-
      The review directly establishes TTE as the primary imaging study for
      diagnosis and hemodynamic assessment.
  - reference: PMID:30305948
    reference_title: Hemodynamic assessment of atrial septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most cases, hemodynamics can be estimated with echocardiography only."
    explanation: >-
      The hemodynamic review supports echocardiography as the usual method for
      estimating ASD physiology.
- name: Transesophageal and cross-sectional cardiac imaging
  description: >-
    TEE defines defect size and rims for device planning. Cardiac MRI clarifies
    morphology and quantifies ventricular volumes and function; cardiac CT is an
    alternative when MRI is contraindicated and is particularly useful for
    associated pulmonary venous anatomy.
  diagnosis_term:
    preferred_term: cardiac MRI
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  results: >-
    Defines the communication, septal rims, relation to valves and veins,
    associated pulmonary venous connections, and ventricular size and function.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      echocardiography (TEE) is required for determining the feasibility of
      transcatheter closure
    explanation: >-
      The review supports TEE for detailed device-closure anatomy and
      feasibility assessment.
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac magnetic resonance imaging (MRI) can help clarify the morphology
      of the defect
    explanation: >-
      This supports CMR for anatomy and quantitative ventricular assessment.
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac computed tomography (CT) provides an alternative in patients with
      contraindications to MRI
    explanation: >-
      The review supports cardiac CT as an alternative cross-sectional modality.
- name: Invasive hemodynamic assessment when pulmonary hypertension is suspected
  description: >-
    Cardiac catheterization is not routine for uncomplicated ASD. It is used to
    measure pulmonary vascular resistance and, when needed, test occlusion or
    vasoreactivity when pulmonary hypertension, ventricular dysfunction, or
    closure tolerability is uncertain.
  diagnosis_term:
    preferred_term: cardiac catheterization
    term:
      id: NCIT:C38044
      label: Cardiac Catheterization
  results: >-
    Directly measures pulmonary and systemic pressures, flow ratio, pulmonary
    vascular resistance, and hemodynamic response to temporary occlusion.
  evidence:
  - reference: PMID:30305948
    reference_title: Hemodynamic assessment of atrial septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic catheterization is usually not indicated unless there is
      suggestion of pulmonary hypertension on echocardiography.
    explanation: >-
      The review supports selective rather than routine invasive hemodynamic
      assessment.
  - reference: PMID:30305948
    reference_title: Hemodynamic assessment of atrial septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In older patients and/or in those with ventricular dysfunction,
      measurement of left heart pressures during temporary balloon occlusion is
      recommended prior to device closure as it may not be tolerated.
    explanation: >-
      This supports temporary occlusion testing in patients at risk of adverse
      filling-pressure changes after closure.
- name: Selective genetic evaluation
  description: >-
    Genetic evaluation is most relevant when ASD is familial, accompanied by
    conduction disease, or associated with extracardiac or syndromic features.
    A negative panel does not exclude ASD because most cases are not explained
    by a single established Mendelian gene.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    May identify a rare familial or syndromic etiology such as NKX2-5-, GATA4-,
    TBX5-, or MYH6-associated disease and inform counseling and family testing.
  evidence:
  - reference: PMID:38884726
    reference_title: Human Genetics of Atrial Septal Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although atrial septal defects (ASD) can be subdivided based on their
      anatomical location, an essential aspect of human genetics and genetic
      counseling is distinguishing between isolated and familiar cases without
      extracardiac features and syndromic cases with the co-occurrence of
      extracardiac abnormalities, such as developmental delay.
    explanation: >-
      The current human-genetics review supports selective etiologic evaluation
      framed around familial, isolated, and syndromic presentations.
treatments:
- name: Conservative surveillance for a hemodynamically insignificant ASD
  action_category: MONITORING
  description: >-
    Small defects without right-heart enlargement or another accepted closure
    indication are observed clinically and with periodic echocardiography.
    Surveillance is individualized rather than treating every anatomical
    communication as an indication for repair.
  treatment_term:
    preferred_term: clinical monitoring
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      insignificant ASDs do not require closure. Such patients should be followed
      conservatively
    explanation: >-
      The review directly supports conservative surveillance when a defect is
      hemodynamically insignificant.
- name: Transcatheter closure of secundum ASD
  action_category: THERAPEUTIC
  description: >-
    Device closure is generally preferred for hemodynamically significant
    secundum ASD when defect size, rims, and pulmonary vascular status are
    suitable. Severe irreversible pulmonary vascular disease or Eisenmenger
    physiology is a contraindication; uncertain pulmonary vascular or left
    ventricular physiology requires specialist invasive assessment before
    closure.
  treatment_term:
    preferred_term: transcatheter atrial septal defect closure
    term:
      id: NCIT:C148075
      label: Septal Defect Repair
  target_phenotypes:
  - preferred_term: Atrial septal defect
    term:
      id: HP:0001631
      label: Atrial septal defect
  - preferred_term: Left-to-right shunt
    term:
      id: HP:0012382
      label: Left-to-right shunt
  target_mechanisms:
  - target: Left-to-Right Shunting and Right Heart Volume Overload
    treatment_effect: INHIBITS
    description: >-
      Device occlusion terminates the atrial-level shunt and unloads the right
      heart when closure is physiologically appropriate.
    evidence:
    - reference: PMID:25884091
      reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ASDII results in right-sided volume unloading
      explanation: >-
        The review directly supports right-heart unloading after closure.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transcatheter and surgical techniques both provide valid options for ASDII closure, the former being the preferred method."
    explanation: >-
      This review supports transcatheter closure as the preferred closure method
      for suitable secundum ASD.
  - reference: PMID:15350172
    reference_title: Transcatheter closure of atrial septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A major reason for this is the lower morbidity of transcatheter closure procedures."
    explanation: >-
      This treatment review explains why transcatheter closure became preferred
      for many secundum ASDs.
- name: Surgical ASD repair
  action_category: THERAPEUTIC
  description: >-
    Surgical repair remains a valid closure strategy, especially when anatomy is
    unsuitable for device closure or when the defect is primum, sinus venosus, or
    coronary sinus type.
  treatment_term:
    preferred_term: surgical atrial septal defect repair
    term:
      id: NCIT:C148075
      label: Septal Defect Repair
  target_phenotypes:
  - preferred_term: Atrial septal defect
    term:
      id: HP:0001631
      label: Atrial septal defect
  - preferred_term: Left-to-right shunt
    term:
      id: HP:0012382
      label: Left-to-right shunt
  target_mechanisms:
  - target: Left-to-Right Shunting and Right Heart Volume Overload
    treatment_effect: INHIBITS
    description: >-
      Surgical closure terminates the interatrial shunt when device closure is
      anatomically unsuitable or when associated anatomy requires repair.
    evidence:
    - reference: PMID:25884091
      reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pericardial or synthetic patch closure is preferred over a direct suture,
        and generally completely terminates the shunt.
      explanation: >-
        The review directly supports surgical patch closure as a means of
        terminating the interatrial shunt.
  evidence:
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transcatheter and surgical techniques both provide valid options for ASDII closure, the former being the preferred method."
    explanation: >-
      The review supports surgery as a valid ASDII closure option, while noting
      that transcatheter closure is preferred when suitable.
  - reference: PMID:25884091
    reference_title: "Secundum atrial septal defect in adults: a practical review and recent developments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the exception of those with severe and irreversible PAH, closure is beneficial to, and thus indicated in all patients with significant shunts, regardless of age and symptoms."
    explanation: >-
      This supports closure of significant shunts and the pulmonary vascular
      contraindication that guides either surgical or transcatheter repair.
- name: Atrial tachyarrhythmia management
  action_category: THERAPEUTIC
  description: >-
    Established atrial tachyarrhythmias require rhythm-specific medical or
    procedural management. In selected patients, ablation before or at closure
    can be considered because defect closure alone does not reliably eliminate
    an established arrhythmogenic substrate.
  treatment_term:
    preferred_term: cardiac ablation
    term:
      id: NCIT:C100068
      label: Cardiac Ablation
  target_phenotypes:
  - preferred_term: Supraventricular arrhythmia
    term:
      id: HP:0005115
      label: Supraventricular arrhythmia
  target_mechanisms:
  - target: Atrial Electrical Remodeling
    treatment_effect: MODULATES
    description: >-
      Ablation interrupts the re-entrant or focal electrical circuits that
      manifest on the substrate of ASD-related atrial remodeling.
    evidence:
    - reference: PMID:34535989
      reference_title: "Atrial septal defect in adulthood: a new paradigm for congenital heart disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Atrial septal defects call for tertiary expertise where all options may
        be considered, namely catheter vs. surgical closure, consideration of
        pre-closure ablation for patients with atrial tachycardia and suitability
        for closure or/and targeted therapy for patients with PAH.
      explanation: >-
        The adult ASD review explicitly supports considering pre-closure
        ablation in patients with atrial tachycardia.
  evidence:
  - reference: PMID:30305954
    reference_title: Arrhythmias and conduction disorders associated with atrial septal defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Medical and procedural therapy for arrhythmias should consider type and
      timing of ASD repair.
    explanation: >-
      The arrhythmia review supports individualized medical and procedural rhythm
      management in relation to ASD anatomy and repair timing.
differential_diagnoses:
- name: Patent foramen ovale
  description: >-
    PFO is persistence of the fetal foramen-ovale flap communication rather than
    deficiency of atrial septal tissue. Saline contrast with a provocation that
    transiently raises right-atrial pressure and detailed septal imaging help
    distinguish its dynamic right-to-left passage from a hemodynamically
    significant secundum ASD.
  evidence:
  - reference: PMID:35225286
    reference_title: Echocardiographic Evaluation of Atrial Communications before Transcatheter Closure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The accuracy of PFO detection can be improved by using agitated saline
      together with maneuvers to transiently increase the right atrial (RA)
      pressure.
    explanation: >-
      This imaging review supports the provoked contrast-echocardiographic
      behavior that helps distinguish PFO from a persistent volume-loading ASD.
  - reference: PMID:35225286
    reference_title: Echocardiographic Evaluation of Atrial Communications before Transcatheter Closure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three dimensional TEE identifies further septal fenestrations and describes
      the dynamic morphology of ASD/PFO and atrial septal aneurysm.
    explanation: >-
      The review supports detailed TEE assessment of the distinct dynamic
      morphologies of ASD and PFO.
  - reference: PMID:31424787
    reference_title: "Anatomy, Thorax, Heart Foramen Ovale."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher pressure in the left atrium resulting from increased pulmonary
      venous flow from the lungs causes the septum primum of the interatrial
      septum to close the opening.
    explanation: >-
      This embryologic description supports PFO as persistence of the fetal
      flap-valve communication rather than an oval-fossa tissue deficiency.
- name: Atrioventricular septal defect
  description: >-
    An ostium-primum interatrial communication belongs morphologically to the
    atrioventricular septal defect spectrum because it occurs with a common
    atrioventricular junction. It must not be managed as an isolated oval-fossa
    secundum ASD even though both produce atrial-level shunting.
  evidence:
  - reference: PMID:22368625
    reference_title: Defining the morphologic phenotypes of atrial septal defects and interatrial communications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ostium primum defect, for example, has all the characteristics of an
      atrioventricular septal defect, existing only in the setting of a common
      atrioventricular junction.
    explanation: >-
      The morphology review directly establishes the primum-to-AVSD boundary.
- name: Congenital partial pulmonary venous return anomaly
  description: >-
    Partial anomalous pulmonary venous return can accompany a superior sinus
    venosus communication and adds its own right-heart volume load. Pulmonary
    venous connections therefore must be mapped rather than assuming an isolated
    oval-fossa ASD.
  evidence:
  - reference: clinicaltrials:NCT05865119
    reference_title: OPTImal Treatment of Sinus VENOSUS Defect - Efficacy and Safety of Transcatheter Correction Compared to Surgical Treatment in Patients With Sinus Venosus Defect
    supports: SUPPORT

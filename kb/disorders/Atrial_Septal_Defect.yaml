notes: >-
  This entry uses the clinically broad ASD umbrella but preserves morphology:
  true atrial septal tissue deficiency is confined to the oval fossa (secundum
  ASD), whereas primum, sinus venosus, and coronary-sinus lesions are distinct
  interatrial communications. Patent foramen ovale is excluded because it is
  persistence of a fetal flap-valve communication rather than deficiency of
  atrial septal tissue. Management recommendations are not interchangeable
  across these anatomies. Closure decisions require anatomy, right-heart size,
  shunt significance, pulmonary vascular resistance, and ventricular filling
  physiology; Eisenmenger physiology is a do-not-close state.

  The numbered MONDO ASD series is curated here as has_subtypes rows rather than
  as separate Disease entries, because they share this entry's
  atrial-level-shunt physiology, pathograph and management and none of them has a
  distinct first-line therapy or diagnostic pathway. Where a gene's phenotype is
  wider than an atrial septal defect, as with NKX2-5 and TBX5, the row records
  only its atrial-septal component.
  Enumerating the hierarchical descendants of MONDO:0006664 in OLS4 on 2026-09-25
  returned nine numbered members plus four anatomic types, Lutembacher syndrome
  and patent foramen ovale. Two of the numbered members are not curated as rows:
  atrial septal defect 1 (MONDO:0007172, OMIM 108800) carries no causal gene in
  MONDO and its MedGen concept 349495 describes generic secundum atrial septal
  defect, so it duplicates the Ostium secundum row rather than naming a distinct
  genetic form; and patent foramen ovale (MONDO:0020439) is excluded from this
  entry for the reason given above. Checked against the MONDO SQLite build on
  2026-09-25, three of the nine numbered members carry no RO:0004003
  has-material-basis-in-germline-mutation-in edge: ASD1, ASD2 and ASD9. The
  GATA4 and GATA6 assignments on the ASD2 and ASD9 rows therefore come from
  those terms' OMIM and MedGen records and from the primary reports cited on the
  rows, not from MONDO. TBX5-related Holt-Oram syndrome and the
  NKX2-5 conduction phenotype are syndromic entities in their own right and are
  represented here only by their atrial-septal component.

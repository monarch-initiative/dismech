    evidence_source: HUMAN_CLINICAL
    snippet: "The same heterozygous missense mutation (Ser184Asn) was identified in three patients, including one with tetralogy of Fallot and two with atrial septal defects."
    explanation: >-
      Sources the GATA6 binding on this node; two of the three carriers in this
      cohort had atrial septal defects.

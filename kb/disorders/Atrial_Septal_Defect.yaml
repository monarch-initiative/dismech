    Congenital Heart Disease Gene Curation Expert Panel grades TBX20 against the
    broader concept congenital heart disease (MONDO:0005453, autosomal dominant,
    SOP10) as Moderate, in assertion
    CGGV:assertion_67706e90-ac03-4b96-94e2-4a561ced4a41-2024-05-07T050000.000Z
    classified 2024-05-07; read from the ClinGen Gene-Disease Validity CSV
    snapshot committed in this repository (file creation date 2026-01-24). No
    ClinGen assertion exists against an atrial-septal-defect term.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In summary, the observation of these mutations in patients with septal defects indicates that CITED2 has a causative impact in the development of CHD in humans.
    explanation: >-
      Sources the CITED2 binding on this node against the septal-defect
      phenotype specifically.
  - reference: PMID:20631719

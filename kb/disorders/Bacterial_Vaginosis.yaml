name: Bacterial Vaginosis
creation_date: "2026-08-20T05:30:00Z"
category: Infectious Disease
disease_term:
  preferred_term: bacterial vaginosis
  term:
    id: MONDO:0005316
    label: bacterial vaginosis
synonyms:
- BV
- nonspecific vaginitis
- vaginal dysbiosis
- anaerobic vaginosis
parents:
- Female reproductive system disorder
- Bacterial infectious disease
description: >
  Bacterial vaginosis is a polymicrobial dysbiosis in which the lactobacillus-dominated
  vaginal community is replaced by a dense consortium of facultative and strict anaerobes
  - Gardnerella, Prevotella (Hoylesella), Fannyhessea/Atopobium, Mobiluncus and others -
  with loss of lactic acid production and a rise in vaginal pH. Three features make it
  mechanistically distinctive. First, no single organism satisfies Koch's postulates: the
  disease is a community state, and the same taxa are recoverable from women without
  disease, so the pathogenic unit is the consortium and its adherent biofilm rather than a
  pathogen. Second, the damage that matters is done to a barrier rather than to a tissue -
  bacterial sialidases and glycosidases strip the cervicovaginal mucus of its protective
  glycans, and the resulting loss of mucus adhesive function, not inflammation, is what
  raises the risk of HIV acquisition and of ascending infection in pregnancy. Third, the
  clinical problem is recurrence, not cure: first-line antimicrobials clear most episodes
  and more than half of women relapse within six months, and the two candidate
  explanations - survival of the adherent biofilm and reinfection from an untreated sexual
  partner - are clinically indistinguishable in an individual woman. A 2025 randomised
  trial of male-partner treatment that was stopped early for benefit is the strongest
  evidence yet that the second route is real.
references:
- reference: PMID:35118003
  title: "Bacterial Vaginosis: What Do We Currently Know?"
  findings:
  - statement: >
      Contemporary review of the vaginal microbiome, the community-state-type framework,
      the Amsel/Nugent diagnostic standards and first-line antimicrobial therapy.
  - statement: >
      States plainly that the etiology of the dysbiosis is unknown and that relapse after
      standard therapy approaches 50% at six months.
- reference: PMID:34470644
  title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
  findings:
  - statement: >
      Sets out the two competing accounts of recurrence - biofilm/BVAB persistence versus
      reinfection from an untreated partner - and the evidence for sexual exchange of
      BV-associated bacteria.
  - statement: >
      Notes that the two routes cannot be separated clinically because their presentation
      is identical.
- reference: PMID:40043236
  title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
  findings:
  - statement: >
      Open-label randomised trial (StepUp) stopped early by its DSMB because treating the
      woman alone was inferior to treating both partners.
- reference: PMID:16260520
  title: "Adherent biofilms in bacterial vaginosis."
  findings:
  - statement: >
      Vaginal biopsy FISH study identifying a confluent Gardnerella-dominated adherent
      biofilm as the structural feature specific to bacterial vaginosis.
- reference: PMID:31971984
  title: "The cervicovaginal mucus barrier to HIV-1 is diminished in bacterial vaginosis."
  findings:
  - statement: >
      HIV virion mobility is increased in cervicovaginal mucus from women with BV, and the
      defect is in the adhesive rather than the structural properties of the mucus.

infectious_agent:
- name: Gardnerella vaginalis
  description: >-
    A gram-variable, facultatively anaerobic member of the Bifidobacteriales. It is
    present in essentially all cases of BV and is the organism that forms the adherent
    biofilm, but it is also carried by a minority of asymptomatic women, so its presence
    is necessary rather than sufficient for the syndrome.
  infectious_agent_term:
    preferred_term: Gardnerella vaginalis
    term:
      id: NCBITaxon:2702
      label: Gardnerella vaginalis
  evidence:
  - reference: PMID:16260520
    reference_title: "Adherent biofilms in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only Gardnerella vaginalis developed a characteristic adherent biofilm that was specific for bacterial vaginosis"
    explanation: >-
      Identifies G. vaginalis as the biofilm-forming organism of the BV consortium.
  - reference: PMID:18390664
    reference_title: "Functional and phylogenetic characterization of Vaginolysin, the human-specific cytolysin from Gardnerella vaginalis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "is present in essentially all cases of BV but can also be detected in a minority of asymptomatic women"
    explanation: >-
      Cited as background rather than as a result: this is the authors' review of the
      clinical-epidemiological literature in their introduction, not an observation from
      their own in-vitro cytolysin experiments, and it is tagged OTHER for that reason. It
      supports listing G. vaginalis as an agent while recording that carriage alone does
      not constitute disease - the reason this entry treats the consortium, not a single
      organism, as the pathogenic unit.
- name: Prevotella timonensis
  description: >-
    An anaerobe of the BV consortium, reclassified as Hoylesella timonensis. It adheres to
    vaginal and endocervical epithelium as strongly as Gardnerella but provokes less of a
    proinflammatory epithelial response, and it carries an unusually large complement of
    mucus-degrading fucosidases and sialidases. It is curated here because the
    barrier-degrading arm of this entry is not a Gardnerella monopoly. The `term:` binds
    the current NCBI taxonomy name, Hoylesella timonensis; the literature cited here,
    including the 2024 papers, still writes Prevotella timonensis, which is retained as
    the preferred term.
  infectious_agent_term:
    preferred_term: Prevotella timonensis
    term:
      id: NCBITaxon:386414
      label: Hoylesella timonensis
  evidence:
  - reference: PMID:39162399
    reference_title: "Prevotella timonensis degrades the vaginal epithelial glycocalyx through high fucosidase and sialidase activities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that P. timonensis, but not P. bivia, strongly adheres to vaginal and endocervical cells to a similar level as G. vaginalis but did not elicit a comparable proinflammatory epithelial response."
    explanation: >-
      Establishes P. timonensis as an adherent member of the consortium with a distinct
      host-response profile from Gardnerella.

prevalence:
- population: Reproductive-aged women, worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 33000.0
  notes: >
    Approximately one third of reproductive-aged women, as stated in the StepUp trial
    report. This is a prevalence of the microbiological state (Nugent/Amsel-defined), not
    of symptomatic disease - roughly half of affected women report no symptoms - so it
    should not be read as a burden of clinical illness.
  evidence:
  - reference: PMID:40043236
    reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bacterial vaginosis affects one third of reproductive-aged women, and recurrence is common."
    explanation: >-
      Source for the one-in-three figure used as the worldwide point prevalence.
- population: Women of reproductive age, United States
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 32500.0
  rate_low: 15000.0
  rate_high: 50000.0
  notes: >
    The 15-50% range quoted by the LACTIN-V trial. The width of the range is itself
    informative: it reflects real variation by population and by diagnostic method
    (Amsel versus Nugent versus molecular assay) rather than measurement noise.
  evidence:
  - reference: PMID:32402161
    reference_title: "Randomized Trial of Lactin-V to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bacterial vaginosis affects 15 to 50% of women of reproductive age, and recurrence is common after treatment with an antibiotic agent."
    explanation: >-
      Source for the reproductive-age prevalence range recorded here.

pathophysiology:
- name: Loss of Lactobacillus Dominance and Vaginal Acidification
  biological_scale: TISSUE
  role: trigger
  description: >
    The initiating state change. A healthy premenopausal vagina is dominated by
    Lactobacillus species whose copious lactic acid holds the lumen below pH 4.5; in BV
    that community is replaced, lactic acid production falls and pH rises. Two points
    matter for everything downstream. The species identity is not interchangeable -
    L. crispatus-dominated communities are the most protective, whereas L. iners, which
    makes only the L-isomer of lactic acid, sits at an intermediate and unstable position
    and is the species most associated with transition into and relapse after BV. And the
    trigger itself is unexplained: what precipitates the shift in an individual woman is
    the central unanswered question of the field, curated as a knowledge gap below.
    `GO:0006885 regulation of pH` is deliberately not bound here: the pH claim this node
    makes is about the chemistry of the vaginal lumen, not about a cellular homeostatic
    process, and GO annotates the latter. The mechanism that produces the pH change is
    carried by the lactate term below, and the luminal measurement itself is curated as an
    Amsel criterion under `definitions`.
  biological_processes:
  - preferred_term: lactate biosynthetic process
    term:
      id: GO:0019249
      label: lactate biosynthetic process
    modifier: DECREASED
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  downstream:
  - target: Polymicrobial Anaerobic Overgrowth
    description: >-
      Relief of lactic-acid-mediated suppression permits expansion of facultative and
      strict anaerobes.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BV is the result of a disturbance in the vaginal ecosystem; i.e., a sudden replacement of Lactobacilli by anaerobic bacteria such as Gardnerella vaginalis, Atopobium vaginae, Ureaplasma urealyticum, Mycoplasma hominis, and others."
    explanation: >-
      States the defining community shift that this node encodes.
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under normal conditions, 70-90% of the vaginal bacterial species in healthy premenopausal women are Lactobacilli"
    explanation: >-
      Establishes the baseline lactobacillus dominance whose loss defines this node.
  - reference: PMID:37234911
    reference_title: "Lactobacillus iners and genital health: molecular clues to an enigmatic vaginal species."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lactobacillus iners is distinct from L. crispatus, L. gasseri, and L. jensenii by its high global prevalence in vaginal microbiomes, relatively small genome, production of only L-lactic acid, and inconsistent associations with genital health outcomes."
    explanation: >-
      Supports the claim that lactobacillus species identity, not merely lactobacillus
      presence, determines how protective this node's baseline state is.
  - reference: PMID:37234911
    reference_title: "Lactobacillus iners and genital health: molecular clues to an enigmatic vaginal species."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vaginal lactobacilli are recognized as important drivers of genital health including protection against bacterial vaginosis and sexually transmitted infections."
    explanation: >-
      Establishes the protective role whose loss initiates the chain.

- name: Polymicrobial Anaerobic Overgrowth
  biological_scale: TISSUE
  description: >
    Expansion of a dense, diverse consortium - Gardnerella spp., Prevotella (Hoylesella)
    spp., Fannyhessea (Atopobium) vaginae, Mobiluncus, Megasphaera, Sneathia and others -
    to concentrations orders of magnitude above baseline. This node is deliberately named
    for the community rather than for an organism: no single member reproduces the
    syndrome on inoculation, and each is recoverable from women without disease. Treating
    the consortium as the unit is what makes the broad anaerobic coverage of metronidazole
    and clindamycin the rational therapy, and it is why an organism-specific agent has
    never been developed.
  biological_processes:
  - preferred_term: response to bacterium
    term:
      id: GO:0009617
      label: response to bacterium
    modifier: INCREASED
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  downstream:
  - target: Biogenic Amine Production and Amplified Lactobacillus Suppression
    description: >-
      Anaerobic amino acid decarboxylation generates the biogenic amines that give BV its
      odour and further suppress the residual lactobacilli.
    causal_link_type: DIRECT
  - target: Epithelial Adhesion and Gardnerella-Dominated Adherent Biofilm
    description: >-
      Members of the expanded consortium adhere to the epithelium and organise into a
      structured biofilm.
    causal_link_type: DIRECT
  - target: Bacterial Sialidase and Glycosidase Degradation of the Mucus Barrier
    description: >-
      The consortium secretes the mucin-degrading enzyme activities that are elevated in
      BV vaginal fluid.
    causal_link_type: DIRECT
  - target: Anaerobe Ribosomal Translation (Clindamycin and Tetracycline Target)
    description: >-
      Sustained expansion of the consortium depends on bacterial protein synthesis, which
      is the molecular target exploited by the lincosamide arm of therapy.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34470644
    reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This non-optimal microbiological state involves a reduction in protective lactobacilli, and an increase in bacterial diversity and facultative and strict anaerobes, including Gardnerella spp., Atopobium vaginae, Prevotella spp., and others, referred to as BV-associated bacteria (BVAB)"
    explanation: >-
      Names the consortium taxa and frames BV as a community state rather than a
      single-organism infection.
  - reference: PMID:6600371
    reference_title: "Nonspecific vaginitis. Diagnostic criteria and microbial and epidemiologic associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clinical diagnosis of nonspecific vaginitis, based on simple office procedures, was correlated with both the presence and the concentration of Gardnerella vaginalis (Hemophilus vaginalis) in vaginal discharge, and with characteristic biochemical findings in vaginal discharge."
    explanation: >-
      The founding correlation between organism concentration - not mere presence - and
      clinical disease, which is the quantitative claim this node makes.

- name: Biogenic Amine Production and Amplified Lactobacillus Suppression
  biological_scale: MOLECULAR
  description: >
    Amino acid decarboxylation by the expanded anaerobes produces putrescine, cadaverine,
    tyramine and trimethylamine. These are usually treated as a symptom - they are what
    the whiff test detects and what patients describe as a fishy odour - but the
    measurements curated here make them a mechanism as well: they inhibit the growth of
    vaginal lactobacilli and independently reduce their lactic acid output. That closes a
    positive feedback loop back onto the trigger node, which is why the dysbiotic state is
    self-reinforcing rather than self-limiting, and it is the reason this node is curated
    separately from the odour phenotype it produces.
  biological_processes:
  - preferred_term: amine biosynthetic process
    term:
      id: GO:0009309
      label: amine biosynthetic process
    modifier: INCREASED
  chemical_entities:
  - preferred_term: putrescine
    term:
      id: CHEBI:17148
      label: putrescine
    modifier: INCREASED
  - preferred_term: cadaverine
    term:
      id: CHEBI:18127
      label: cadaverine
    modifier: INCREASED
  - preferred_term: trimethylamine
    term:
      id: CHEBI:18139
      label: trimethylamine
    modifier: INCREASED
  downstream:
  - target: Loss of Lactobacillus Dominance and Vaginal Acidification
    description: >-
      Biogenic amines slow lactobacillus growth and cut lactic acid production, feeding
      back on and entrenching the initiating state change.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33674429
    reference_title: "Biogenic Amines Increase the Odds of Bacterial Vaginosis and Affect the Growth of and Lactic Acid Production by Vaginal Lactobacillus spp."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increases in cadaverine, putrescine, and tyramine were associated with greater odds of women transitioning from L. crispatus-dominated vaginal microbiota to microbiota that have a paucity of Lactobacillus spp. and from Nugent scores of 0 to 3 to Nugent scores of 7 to 10, consistent with BV."
    explanation: >-
      The in vivo longitudinal association between rising biogenic amines and transition
      into BV, which is what licenses treating this node as upstream rather than merely
      concurrent.
  - reference: PMID:33674429
    reference_title: "Biogenic Amines Increase the Odds of Bacterial Vaginosis and Affect the Growth of and Lactic Acid Production by Vaginal Lactobacillus spp."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BAs were associated with reduced production of d- and l-lactic acid by vaginal Lactobacillus spp., and this effect was independent of their effect upon Lactobacillus species growth."
    explanation: >-
      The axenic-culture experiment establishing the feedback edge onto lactic acid
      production, and establishing it as separable from a simple growth effect.
  - reference: PMID:33674429
    reference_title: "Biogenic Amines Increase the Odds of Bacterial Vaginosis and Affect the Growth of and Lactic Acid Production by Vaginal Lactobacillus spp."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Exposure to putrescine lengthened the lag time and/or slowed the growth of all vaginal Lactobacillus spp. except L. jensenii 62G."
    explanation: >-
      Direct growth inhibition of lactobacilli by a BV-associated amine, with the single
      exception recorded rather than smoothed over.

- name: Epithelial Adhesion and Gardnerella-Dominated Adherent Biofilm
  biological_scale: TISSUE
  description: >
    Gardnerella adheres to the vaginal epithelium and forms a confluent, structured
    biofilm into which other consortium members are incorporated. This is the one
    structural feature that FISH on vaginal biopsies found specific to BV rather than
    merely more abundant in it, and it is the physical object that makes BV a persistent
    rather than an episodic condition: a sessile, matrix-embedded community tolerates
    antimicrobial exposure that clears planktonic organisms. Prevotella (Hoylesella)
    timonensis adheres comparably well, so adhesion is not a Gardnerella monopoly even
    though biofilm architecture appears to be.
  cell_types:
  - preferred_term: vaginal squamous epithelial cell
    term:
      id: CL:1001578
      label: vagina squamous cell
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
    modifier: INCREASED
  - preferred_term: cell adhesion involved in biofilm formation
    term:
      id: GO:0043708
      label: cell adhesion involved in biofilm formation
    modifier: INCREASED
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  downstream:
  - target: Exfoliation of Bacteria-Coated Epithelial Cells (Clue Cells)
    description: >-
      Adherent organisms are shed with the epithelial cells they coat, producing the clue
      cells seen on wet mount.
    causal_link_type: DIRECT
  - target: Vaginolysin-Mediated Epithelial Pore Formation and Signalling
    description: >-
      Close apposition of Gardnerella to the epithelium delivers its cholesterol-dependent
      cytolysin to the host cell membrane.
    causal_link_type: DIRECT
  - target: Biofilm Persistence After Antimicrobial Therapy
    description: >-
      The adherent biofilm is the proposed reservoir from which BV-associated bacteria
      re-emerge after a course of antibiotics.
    causal_link_type: DIRECT
    hypothesis_groups:
    - biofilm_persistence_relapse
  evidence:
  - reference: PMID:16260520
    reference_title: "Adherent biofilms in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A biofilm comprised of confluent G vaginalis with other bacterial groups incorporated in the adherent layer is a prominent feature of bacterial vaginosis."
    explanation: >-
      Describes the composite structure this node asserts - a Gardnerella scaffold with
      other taxa incorporated.
  - reference: PMID:16260520
    reference_title: "Adherent biofilms in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bacterial vaginosis was associated with greater occurrence and higher concentrations of a variety of bacterial groups. However, only Gardnerella vaginalis developed a characteristic adherent biofilm that was specific for bacterial vaginosis."
    explanation: >-
      Draws the distinction this node depends on: many taxa are more abundant, but only
      one forms a BV-specific adherent structure.
  - reference: PMID:39162399
    reference_title: "Prevotella timonensis degrades the vaginal epithelial glycocalyx through high fucosidase and sialidase activities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that P. timonensis, but not P. bivia, strongly adheres to vaginal and endocervical cells to a similar level as G. vaginalis but did not elicit a comparable proinflammatory epithelial response."
    explanation: >-
      The study's own adhesion assay establishes that adherence to vaginal and endocervical
      epithelium is a property of the consortium rather than of Gardnerella alone, and that
      it is not shared by every anaerobe (P. bivia does not adhere).

- name: Exfoliation of Bacteria-Coated Epithelial Cells (Clue Cells)
  biological_scale: CELLULAR
  description: >
    Squamous epithelial cells so heavily coated with adherent organisms that their borders
    are obscured are shed into the vaginal fluid. Immunofluorescence on clue cells
    identifies the adherent rods as Gardnerella rather than Mobiluncus, Bacteroides or
    Fusobacterium, which is the observation that ties the microscopic diagnostic sign to a
    specific adhesion mechanism rather than to generic anaerobic overgrowth. This node is
    curated as a cellular event, not as a diagnostic test; the test that reads it is
    curated under `definitions`.
  cell_types:
  - preferred_term: vaginal squamous epithelial cell
    term:
      id: CL:1001578
      label: vagina squamous cell
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  evidence:
  - reference: PMID:2668431
    reference_title: "Clue cells in bacterial vaginosis: immunofluorescent identification of the adherent gram-negative bacteria as Gardnerella vaginalis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clue cells are epithelial cells covered by adherent gram-negative rods, observed in vaginal smears from women with bacterial vaginosis."
    explanation: >-
      Defines the cellular object this node names.
  - reference: PMID:2668431
    reference_title: "Clue cells in bacterial vaginosis: immunofluorescent identification of the adherent gram-negative bacteria as Gardnerella vaginalis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gardnerella vaginalis was most often observed adhering to the surface of clue cells and was detected on the surface of exfoliated vaginal epithelial cells significantly more frequently and in higher numbers than were Mobiluncus, Bacteroides, and Fusobacterium, suggesting that this species of gram-negative bacteria is responsible for clue cell formation."
    explanation: >-
      Attributes clue cell formation specifically to Gardnerella adhesion, which is the
      causal claim on the incoming edge from the biofilm node.

- name: Vaginolysin-Mediated Epithelial Pore Formation and Signalling
  biological_scale: MOLECULAR
  description: >
    Gardnerella secretes vaginolysin, a cholesterol-dependent cytolysin whose receptor is
    human CD59. Two consequences matter and they are different in kind. At lytic
    concentrations the toxin kills; at sublytic concentrations - which is the physiological
    situation - it triggers rapid membrane blebbing, activates epithelial p38 MAPK and
    induces IL-8. The receptor dependence is the reason BV has no natural animal model:
    vaginolysin is human-specific because CD59 is, and transfecting human CD59 into
    non-human cells is what confers susceptibility. That constraint is curated as a
    human/model mismatch below rather than left implicit.
  biological_processes:
  - preferred_term: cytolysis
    term:
      id: GO:0019835
      label: cytolysis
    modifier: INCREASED
  - preferred_term: killing of cells of another organism
    term:
      id: GO:0031640
      label: killing of cells of another organism
    modifier: INCREASED
  cell_types:
  - preferred_term: vaginal squamous epithelial cell
    term:
      id: CL:1001578
      label: vagina squamous cell
  downstream:
  - target: Epithelial Barrier Disruption and Mucosal Immune Activation
    description: >-
      Sublytic pore formation drives p38 MAPK signalling and IL-8 release from the
      vaginal epithelium.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18390664
    reference_title: "Functional and phylogenetic characterization of Vaginolysin, the human-specific cytolysin from Gardnerella vaginalis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that G. vaginalis produces a toxin (vaginolysin [VLY]) that is a member of the cholesterol-dependent cytolysin (CDC) family, most closely related to intermedilysin from Streptococcus intermedius."
    explanation: >-
      Identifies the toxin and its family, the molecular claim of this node.
  - reference: PMID:18390664
    reference_title: "Functional and phylogenetic characterization of Vaginolysin, the human-specific cytolysin from Gardnerella vaginalis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition to causing erythrocyte lysis, VLY activates the conserved epithelial p38 mitogen-activated protein kinase pathway and induces interleukin-8 production by human epithelial cells."
    explanation: >-
      Establishes the sublytic signalling output that carries the outgoing edge to
      epithelial activation, distinct from frank lysis.
  - reference: PMID:24082080
    reference_title: "Vaginolysin drives epithelial ultrastructural responses to Gardnerella vaginalis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Binding of VLY to its human-specific receptor (hCD59) is required for bleb formation, as antibody inhibition of either toxin or hCD59 abrogates this response, and transfection of nonhuman cells (CHO-K1) with hCD59 renders them susceptible to toxin-induced membrane blebbing."
    explanation: >-
      The gain- and loss-of-function pair establishing hCD59 dependence, and with it the
      species restriction recorded in the human/model-mismatch discussion.
  - reference: PMID:24082080
    reference_title: "Vaginolysin drives epithelial ultrastructural responses to Gardnerella vaginalis."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "VLY-induced epithelial cell membrane blebbing in the vaginal mucosa may play a role in the pathogenesis of BV"
    explanation: >-
      The authors' own hedged statement of relevance to disease. Recorded as PARTIAL
      because the in vivo contribution of blebbing to BV pathogenesis is proposed, not
      demonstrated.

- name: Bacterial Sialidase and Glycosidase Degradation of the Mucus Barrier
  biological_scale: MOLECULAR
  description: >
    The consortium secretes sialidases, fucosidases, beta-galactosidase and
    beta-N-acetylhexosaminidase that strip terminal sugars from cervicovaginal mucins and
    from the epithelial glycocalyx. This is the arm of BV pathogenesis with the clearest
    line to hard clinical outcomes, and it has been misattributed for two decades:
    biochemical work focused on Gardnerella, but vaginal Prevotella species are now shown
    to be a major and globally conserved source of vaginal sialidase, with
    P. (Hoylesella) timonensis carrying both sialidases and an unusual complement of
    fucosidases. Notably, the same 1999 study that found sialidase, beta-galactosidase and
    beta-N-acetylhexosaminidase elevated in BV found no increase in O-glycanase,
    proteinase, sulphatase or whole-mucinase activity - the degradation is glycosidic and
    selective, not general proteolysis, and that distinction is preserved here rather than
    flattened into "mucinase activity".
  molecular_functions:
  - preferred_term: exo-alpha-sialidase activity
    term:
      id: GO:0004308
      label: exo-alpha-sialidase activity

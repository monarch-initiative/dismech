  target_phenotypes:
  - preferred_term: Thin homogeneous malodorous vaginal discharge
    term:
      id: HP:0034269
      label: Abnormal vaginal discharge
  evidence:
  - reference: clinicaltrials:NCT00229216
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The purpose of this study is to confirm the safety and efficacy of oral tinidazole for the treatment of bacterial vaginosis."
    explanation: >-
      Registry record establishing the trial's identity and objective.
- name: ACTRN12619000196145
  phase: PHASE_III
  status: COMPLETED
  description: >
    StepUp: open-label randomised controlled trial of treating male partners of women
    being treated for bacterial vaginosis, to reduce recurrence. Registered on ANZCTR and
    therefore keyed on its WHO ICTRP identifier rather than an NCT number; reported in
    2025 (PMID:40043236) after being stopped early by its data and safety monitoring
    board.
  evidence:
  - reference: ICTRP:ACTRN12619000196145
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Scientific title: Treating male partners of women with bacterial vaginosis (BV) to reduce recurrence: randomised controlled trial"
    explanation: >-
      WHO ICTRP registration record establishing the trial's identity and objective.
  - reference: ICTRP:ACTRN12619000196145
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Male partners randomised to the Intervention Group will receive oral MTZ 400mg tablets twice daily and topical 2% clindamycin cream to be applied to the glans penis and upper shaft (under the foreskin if uncircumcised) twice daily for 7 days."
    explanation: >-
      The registered intervention, matching the regimen curated under the partner
      treatment entry.

environmental:
- name: Intrauterine device use and non-barrier contraception
  description: >
    In the founding case-control series, clinical BV was correlated with current use of
    non-barrier contraceptive methods and particularly with an intrauterine device. The
    mechanism is not established - a foreign body in the endometrial cavity plausibly
    supports biofilm, but that is inference, not evidence - so this is curated as a
    predisposing exposure onto the trigger node rather than as a causal trigger.
  influences_mechanisms:
  - target: Loss of Lactobacillus Dominance and Vaginal Acidification
    environmental_effect: PREDISPOSES
    causal_link_type: UNKNOWN
    description: >-
      Associated with the dysbiotic community shift; the intervening steps are not
      identified.
    evidence:
    - reference: PMID:6600371
      reference_title: "Nonspecific vaginitis. Diagnostic criteria and microbial and epidemiologic associations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nonspecific vaginitis was also correlated with a history of sexual activity, a history of previous trichomoniasis, current use of nonbarrier contraceptive methods, and, particularly, use of an intrauterine device."
      explanation: >-
        The epidemiological association this exposure records.
  evidence:
  - reference: PMID:6600371
    reference_title: "Nonspecific vaginitis. Diagnostic criteria and microbial and epidemiologic associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "current use of nonbarrier contraceptive methods, and, particularly, use of an intrauterine device"
    explanation: >-
      Establishes that this exposure is a real correlate of the disease at all, which is
      the claim the entry itself makes; the mechanism link above carries the separate
      claim about which node it acts on. The correlation is from the study that
      established the modern case definition, so it is a founding observation rather than
      a later replication.
  notes: >-
    No `exposure_term` is bound. ECTO was searched for an intrauterine-device or
    contraception exposure term and none was found, and binding to a broader
    device-exposure concept would assert more than the source supports.
- name: Sexual activity with a regular untreated male partner
  description: >
    Sexual activity has been associated with BV since the original case definition, and
    BV-associated bacteria are demonstrably exchanged between partners. This entry
    separates the two claims the association can carry: exposure to a partner as a
    predisposing factor, curated here, and reinfection from a specific untreated partner
    as a mechanism of recurrence, curated as its own pathophysiology node with randomised
    support.
  influences_mechanisms:
  - target: Reinfection from an Untreated Sexual Partner
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Continued sexual contact with an untreated regular partner is the exposure route by
      which BV-associated bacteria are reacquired after treatment.
    evidence:
    - reference: PMID:34470644
      reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There is a robust body of evidence to support the exchange of bacteria between partners during sexual activity"
      explanation: >-
        Establishes partner-to-partner bacterial exchange as the exposure mechanism.
    - reference: PMID:6600371
      reference_title: "Nonspecific vaginitis. Diagnostic criteria and microbial and epidemiologic associations."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Nonspecific vaginitis was also correlated with a history of sexual activity"
      explanation: >-
        The original epidemiological correlation. PARTIAL because a history of sexual
        activity is not the same claim as reinfection from a specific current partner.
  evidence:
  - reference: PMID:40043236
    reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence of sexual exchange of bacterial vaginosis-associated organisms between partners suggests that male-partner treatment may increase the likelihood of cure."
    explanation: >-
      Establishes the exposure itself - an ongoing regular male sexual partner - as
      relevant to the disease, which is the entry-level claim. The randomised result that
      the exposure is modifiable is carried by the partner-treatment entry rather than
      asserted here.
  - reference: PMID:6600371
    reference_title: "Nonspecific vaginitis. Diagnostic criteria and microbial and epidemiologic associations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonspecific vaginitis was also correlated with a history of sexual activity"
    explanation: >-
      The founding epidemiological correlation, PARTIAL for the same reason as on the
      mechanism link: a history of sexual activity is a weaker exposure than an ongoing
      regular untreated partner.
  notes: >-
    No `exposure_term` is bound: ECTO was searched for a sexual-activity or
    sexual-intercourse exposure term and returned nothing suitable.

animal_models:
- name: Murine cervicovaginal colonisation with BV-associated anaerobes
  species: Mouse
  genotype: Wild type
  description: >
    Mice colonised with high-risk cervicovaginal taxa identified in the South African
    cohort. Used to test whether the association between a lactobacillus-deficient
    community and activated mucosal CD4+ T cells is causal rather than confounded, since
    that direction cannot be established observationally in women.
  publication: PMID:28087240
  modeled_mechanisms:
  - target: Epithelial Barrier Disruption and Mucosal Immune Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the target-cell recruitment arm of this node - high-risk bacteria
      increased activated genital CD4+ T cells - but not the node as a whole.
    limitations: >-
      The mouse has no lactobacillus-dominant vaginal community and no acidic vaginal
      lumen, so the community state whose loss defines this disease does not exist to be
      perturbed. The model can show that particular taxa activate mucosal T cells; it
      cannot model dysbiosis. It also cannot address the vaginolysin arm at all, because
      that toxin is restricted to human CD59.
    readouts:
    - name: Activated genital CD4+ T cell number
      target: Epithelial Barrier Disruption and Mucosal Immune Activation
      direction: INCREASED
      interpretation: >-
        Colonisation with high-risk taxa raises the number of activated mucosal CD4+ T
        cells, the HIV target-cell population this node supplies.
      evidence:
      - reference: PMID:28087240
        reference_title: "Lactobacillus-Deficient Cervicovaginal Bacterial Communities Are Associated with Increased HIV Acquisition in Young South African Women."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "high-risk bacteria increased numbers of activated genital CD4+ T cells in a murine model"
        explanation: >-
          Reports the measurement and its direction in the mouse.
    evidence:
    - reference: PMID:28087240
      reference_title: "Lactobacillus-Deficient Cervicovaginal Bacterial Communities Are Associated with Increased HIV Acquisition in Young South African Women."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We identified specific bacterial taxa linked with reduced (L. crispatus) or elevated (Prevotella, Sneathia, and other anaerobes) inflammation and HIV infection and found that high-risk bacteria increased numbers of activated genital CD4+ T cells in a murine model."
      explanation: >-
        Supports treating this model as informative for the immune-activation node, and
        names the taxa tested.

discussions:
- discussion_id: bv_initiating_event_unknown
  prompt: >-
    What precipitates the shift from a lactobacillus-dominant to a
    lactobacillus-deficient vaginal community in an individual woman?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Loss of Lactobacillus Dominance and Vaginal Acidification"
  rationale: >
    This entry curates a detailed chain downstream of the community shift and nothing
    upstream of it, because there is nothing to curate: the trigger node has no evidenced
    incoming edge other than two epidemiological exposures. Risk factors are known
    (sexual activity and intrauterine device use are the two cited here), but no
    sequence of events from a normal community to a BV community has been
    demonstrated. This matters practically, not just
    theoretically - every intervention in this entry acts after the shift has happened,
    and none prevents it.
  proposed_experiments:
  - experiment_id: bv_incident_transition_cohort
    name: Densely sampled prospective cohort through incident BV
    description: >
      Daily or near-daily self-sampling in a cohort of women with a stable
      L. crispatus-dominant community, with metagenomics, metabolomics (lactic acid
      isomers, biogenic amines), pH and behavioural diaries, powered on incident
      transitions rather than prevalent BV. The measurement that is missing is not another
      cross-sectional comparison of BV versus not-BV; it is the order of events across the
      transition.
    decision_criterion: >
      Whether a consistent temporal ordering (for example, amine rise preceding
      lactobacillus loss, or the reverse) is observed across incident transitions.
  evidence:
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The etiology of this dysbiosis remains unknown, but its health consequences are significant, including obstetrical complications, increased risk of sexually transmitted infections and urogenital infections."
    explanation: >-
      States the gap directly, alongside the consequences that make it worth closing.

- discussion_id: bv_recurrence_route_indistinguishable
  prompt: >-
    In a woman whose BV recurs after treatment, can relapse from a surviving biofilm be
    distinguished from reinfection by an untreated partner?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Recurrent Bacterial Vaginosis"
  - "pathophysiology#Biofilm Persistence After Antimicrobial Therapy"
  - "pathophysiology#Reinfection from an Untreated Sexual Partner"
  rationale: >
    Two curated hypothesis groups converge on the recurrence node and there is currently
    no assay that resolves which operated. The clinical presentation is identical,
    point-of-care tests cannot separate them, and next-generation sequencing has not
    identified a signature that distinguishes relapse from reacquisition. This is why the
    entry retains both routes rather than promoting one: the StepUp trial shows the
    reinfection route is real at a population level, which is a different claim from it
    being the route in any given woman.
  proposed_experiments:
  - experiment_id: bv_strain_resolved_recurrence_tracking
    name: Strain-resolved tracking of BV-associated bacteria across a treated episode
    description: >
      Deep metagenomic strain typing of the woman's pre-treatment community, her partner's
      penile and urethral community, and her post-treatment recurrent community. Relapse
      predicts recovery of the woman's own pre-treatment strains; reinfection predicts
      strains matching the partner's and not present in her pre-treatment sample.
    decision_criterion: >
      Whether recurrent-episode strains are shared with the woman's own pre-treatment
      community, with the partner's community, or with both.
  evidence:
  - reference: PMID:34470644
    reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frustratingly for both clinicians and patients, the contribution of reinfection and vaginal relapse cannot be separated, as the clinical presentation of both mechanisms of recurrence is identical."
    explanation: >-
      States the indistinguishability that defines this gap.

- discussion_id: bv_no_animal_model_vaginolysin_human_specific
  prompt: >-
    How much of BV pathogenesis can any animal model address, given that vaginolysin
    requires human CD59 and no animal has a lactobacillus-dominant acidic vagina?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Vaginolysin-Mediated Epithelial Pore Formation and Signalling"
  - "pathophysiology#Loss of Lactobacillus Dominance and Vaginal Acidification"
  rationale: >
    The species restriction here is not incidental, it is receptor-level: vaginolysin lyses
    cells only where human CD59 is present, and transfecting human CD59 into hamster cells
    is what makes them susceptible. Separately, the healthy state this disease departs from
    - a lactobacillus-dominant, lactic-acid-acidified vagina - is close to unique to humans,
    so there is no normal community for a model organism to lose. The consequence is that
    the murine work curated above can test one downstream arm (T-cell activation) and
    nothing else, and that essentially all mechanism in this entry rests on human samples
    and human cell lines. Reviews of BV have named the absence of a suitable animal model
    as a limiting factor for two decades.
  proposed_experiments:
  - experiment_id: bv_humanised_cd59_and_hydrogel_models
    name: Human-relevant model systems for the two blocked arms
    description: >
      For the toxin arm, a human-CD59 transgenic mouse or a human vaginal epithelial
      organ-chip perfused with defined consortia. For the community arm, a
      cervicovaginal-mucus hydrogel or organ-chip supporting stable L. crispatus dominance
      into which BV taxa can be introduced, giving a system in which the transition itself
      is observable.
    decision_criterion: >
      Whether either system reproduces vaginolysin-dependent epithelial responses and
      sialidase-mediated glycocalyx loss with human-like kinetics.
  evidence:
  - reference: PMID:18390664
    reference_title: "Functional and phylogenetic characterization of Vaginolysin, the human-specific cytolysin from Gardnerella vaginalis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mechanistic studies of BV and its adverse consequences have been limited by the absence of definitive diagnostic testing and a suitable animal model"
    explanation: >-
      Cited as background rather than as a result: this is the authors' statement about the
      state of the field in their introduction, not an outcome of their own experiments, so
      it is tagged OTHER. It names the model gap explicitly, in the same paper that
      establishes the receptor-level reason for it (quoted separately below from the
      companion study).
  - reference: PMID:24082080
    reference_title: "Vaginolysin drives epithelial ultrastructural responses to Gardnerella vaginalis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "transfection of nonhuman cells (CHO-K1) with hCD59 renders them susceptible to toxin-induced membrane blebbing"
    explanation: >-
      Demonstrates that human CD59 is the sufficient species determinant, which is what
      makes this a receptor-level rather than a generic model limitation.

- discussion_id: bv_asymptomatic_majority_and_screening
  prompt: >-
    If more than half of women meeting the case definition have no symptoms, and the
    barrier defect is present in asymptomatic disease, what is the right target population
    for treatment?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Loss of Cervicovaginal Mucus Adhesive Barrier Function"
  rationale: >
    Two curated findings sit awkwardly together. Asymptomatic BV is the majority of BV,
    and the HIV-relevant mucus barrier defect is present regardless of symptoms - which
    argues for screening. But the entry's own obstetric node records that
    screening-and-treatment has not reliably prevented preterm birth, and treatment does
    not durably restore an L. crispatus community. This is recorded as an open question
    rather than a knowledge gap because the missing item is a policy-relevant trial result,
    not a mechanism.
  evidence:
  - reference: PMID:31971984
    reference_title: "The cervicovaginal mucus barrier to HIV-1 is diminished in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HIV virions had significantly increased mobility in CVM from women with BV compared to CVM from women with Lactobacillus crispatus-dominant microbiota, regardless of whether symptoms were present"
    explanation: >-
      Establishes that the barrier defect does not depend on symptoms, which is what makes
      the target-population question live.
  - reference: PMID:34470644
    reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although up to half of BV-affected women do not experience symptoms"
    explanation: >-
      Establishes the size of the asymptomatic population at issue.

notes: >
  Scope. This entry models bacterial vaginosis as a community state, so no single
  organism is curated as "the" cause and no `genetic:` section is present - BV is not a
  Mendelian or susceptibility-gene disease and none of the cited work supports a host
  genetic arm. The 2026-08-25 completeness sweep did surface candidate-gene association
  studies (IL-1B, TNFA, TLR variants), but they are small, single-population and
  unreplicated, and no GWAS exists; the sweep's own recommendation was to leave the section
  absent rather than curate them, and that recommendation is followed here.

  What is deliberately absent. There is no aerobic vaginitis, desquamative inflammatory
  vaginitis, candidiasis or trichomoniasis content here; those are separate entities with
  different communities and different treatments. Metronidazole is not attached to the
  ribosomal-translation node because its nitroimidazole mechanism is unrelated to it.
  No `conforms_to` is claimed against `intracellular_pathogen_persistence`: the BV
  consortium is extracellular and biofilm-associated, and the cell-penetrance constraint
  that module encodes does not apply.

  Provenance. The entry was built directly from primary literature identified by PubMed
  search, and every snippet was checked against the cached reference before commit. A
  deep-research report was produced afterwards rather than before
  (`research/Bacterial_Vaginosis-deep-research-claude.md`, 2026-08-25) as a
  content-completeness sweep in response to PR review; it found the licensed-treatment gap
  that this revision closes, and its remaining recommendations - a host-MMP barrier arm,
  the preterm-birth association-versus-intervention controversy, the virulent-strain
  conceptual model of pathogenesis, and a molecular diagnostic definition - are recorded
  there as follow-ups and are deliberately not folded into this revision.

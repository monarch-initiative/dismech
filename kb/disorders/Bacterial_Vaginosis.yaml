- name: Loss of Cervicovaginal Mucus Adhesive Barrier Function
  biological_scale: TISSUE
  description: >
    Cervicovaginal mucus normally traps virions and particles. In BV that trapping fails:
    fluorescently labelled HIV virions move significantly faster through mucus from women
    with BV than through mucus from L. crispatus-dominant women, whether or not the woman
    has symptoms. The mechanistically important finding is *how* it fails - electron
    microscopy and nanoparticle work localise the defect to reduced adhesive interactions,
    with the physical pore structure of the gel intact. The barrier is not torn open; it
    stops being sticky. The same loss of trapping is seen with L. iners-dominant mucus,
    which is why treating BV to a Nugent-normal endpoint does not necessarily restore the
    barrier.
  locations:
  - preferred_term: mucus
    term:
      id: UBERON:0000912
      label: mucus
  - preferred_term: uterine cervix
    term:
      id: UBERON:0000002
      label: uterine cervix
  downstream:
  - target: Increased Susceptibility to HIV and Other Genital Tract Infections
    description: >-
      Loss of mucus trapping allows virions to reach the epithelium.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31971984
    reference_title: "The cervicovaginal mucus barrier to HIV-1 is diminished in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found that HIV virions had significantly increased mobility in CVM from women with BV compared to CVM from women with Lactobacillus crispatus-dominant microbiota, regardless of whether symptoms were present"
    explanation: >-
      The measurement this node is built on, including the point that the defect is
      present in asymptomatic BV.
  - reference: PMID:31971984
    reference_title: "The cervicovaginal mucus barrier to HIV-1 is diminished in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed using nanoparticles and scanning electron microscopy that the impaired barrier function was due to reduced adhesive barrier properties without an obvious degradation of the physical CVM pore structure."
    explanation: >-
      Localises the defect to adhesion rather than to structural breakdown - the
      distinction this node insists on.
  - reference: PMID:31971984
    reference_title: "The cervicovaginal mucus barrier to HIV-1 is diminished in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We further confirmed a similar increase in HIV mobility in CVM from women with Lactobacillus iners-dominant microbiota, the species most associated with transitions to BV and that persists after antibiotic treatment for BV."
    explanation: >-
      Supports the caveat that a post-treatment L. iners community does not restore the
      barrier, which is the therapeutic rationale for L. crispatus repletion.

- name: Epithelial Barrier Disruption and Mucosal Immune Activation
  biological_scale: TISSUE
  description: >
    Despite the "-osis" in its name, BV is not immunologically silent. Vaginal IL-1alpha
    and soluble E-cadherin - a biomarker of epithelial barrier disruption - are elevated,
    and a lactobacillus-deficient community is accompanied by increased numbers of
    activated mucosal CD4+ T cells. The causal reading is supported by intervention:
    repleting L. crispatus with a live biotherapeutic lowered both IL-1alpha and soluble
    E-cadherin, so the inflammatory state tracks the community rather than merely
    co-occurring with it. This node is what converts a microbiological state into an
    HIV-relevant one, because activated mucosal CD4+ T cells are the target cell.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  - preferred_term: vaginal squamous epithelial cell
    term:
      id: CL:1001578
      label: vagina squamous cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: T cell activation
    term:
      id: GO:0042110
      label: T cell activation
    modifier: INCREASED
  downstream:
  - target: Increased Susceptibility to HIV and Other Genital Tract Infections
    description: >-
      Recruitment and activation of mucosal CD4+ T cells supplies the target cells for
      HIV infection.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28087240
    reference_title: "Lactobacillus-Deficient Cervicovaginal Bacterial Communities Are Associated with Increased HIV Acquisition in Young South African Women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found that individuals with diverse genital bacterial communities dominated by anaerobes other than Gardnerella were at over 4-fold higher risk of acquiring HIV and had increased numbers of activated mucosal CD4+ T cells compared to those with Lactobacillus crispatus-dominant communities"
    explanation: >-
      Couples the activated-CD4 phenotype to prospective HIV acquisition in the same
      cohort, which is the pairing this node depends on.
  - reference: PMID:35659905
    reference_title: "Sustained effect of LACTIN-V (Lactobacillus crispatus CTV-05) on genital immunology following standard bacterial vaginosis treatment: results from a randomised, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bacterial vaginosis might increase HIV risk by eliciting genital inflammation and epithelial barrier disruption, whereas vaginal Lactobacillus crispatus is associated with immune quiescence and HIV protection."
    explanation: >-
      States the barrier-disruption and inflammation mechanism this node encodes.
  - reference: PMID:35659905
    reference_title: "Sustained effect of LACTIN-V (Lactobacillus crispatus CTV-05) on genital immunology following standard bacterial vaginosis treatment: results from a randomised, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary outcomes were vaginal levels of IL-1α and soluble E-cadherin at 24 weeks"
    explanation: >-
      Names the two immunological endpoints - vaginal IL-1alpha and soluble E-cadherin -
      that this node reports, as prespecified primary outcomes of a randomised trial
      rather than post-hoc observations.

- name: Increased Susceptibility to HIV and Other Genital Tract Infections
  biological_scale: ORGANISM
  description: >
    The consequence that dominates BV's public-health importance. Meta-analysis of
    incidence studies puts the relative risk of HIV acquisition at 1.6, and a prospective
    South African cohort found over four-fold higher risk for the most diverse
    lactobacillus-deficient communities. Two distinct mechanisms feed this node and are
    curated separately upstream: loss of mucus trapping (a physical barrier failure) and
    recruitment of activated mucosal CD4+ T cells (target-cell supply). The evidence is
    not uniform across every downstream infection, and one negative result is retained
    below rather than omitted: in a nested analysis of a chlamydia screening trial, a
    Gardnerella-dominated microbiome was not associated with subsequent clinically
    diagnosed pelvic inflammatory disease.
  biological_processes:
  - preferred_term: response to bacterium
    term:
      id: GO:0009617
      label: response to bacterium
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:18614873
    reference_title: "Bacterial vaginosis and HIV acquisition: a meta-analysis of published studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bacterial vaginosis was associated with an increased risk of HIV acquisition in HIV-incidence studies (relative risk = 1.6, 95% confidence interval: 1.2, 2.1)."
    explanation: >-
      The pooled incidence-study estimate quantifying this node.
  - reference: PMID:31971984
    reference_title: "The cervicovaginal mucus barrier to HIV-1 is diminished in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women with BV are at 60% increased risk for HIV acquisition and are 3-times more likely to transmit HIV to an uninfected partner."
    explanation: >-
      Adds the transmission direction, which the acquisition meta-analysis does not cover.
  - reference: PMID:35086915
    reference_title: "Vaginal microbiota in ethnically diverse young women who did or did not develop pelvic inflammatory disease: community-based prospective study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no association between a more diverse, G. vaginalis dominated microbiome and subsequent PID, although increased Shannon diversity was associated with black ethnicity (p=0.002) and bacterial vaginosis (diagnosed by Gram stain p<0.0001)."
    explanation: >-
      A prospective negative result against the specific claim that a BV-type microbiome
      predicts pelvic inflammatory disease. Retained as REFUTE because generalising this
      node from HIV to every ascending genital infection is exactly the inference it
      contradicts; the authors note the small number of PID cases.

- name: Ascending Infection and Adverse Pregnancy Outcomes
  biological_scale: ORGANISM
  description: >
    In pregnancy the same barrier failure permits organisms to reach the choriodecidual
    space, and BV detected early in pregnancy is associated with late miscarriage and
    preterm delivery independent of prior preterm birth. The enzyme measurement makes this
    more than an association: among women already in preterm labour with BV or
    intermediate flora, those with detectable vaginal sialidase had a higher rate of early
    preterm birth, which links the outcome to the specific molecular activity curated
    upstream rather than to the Nugent score alone. Screening-and-treatment trials have
    nonetheless been inconsistent, so this node records a mechanism and a risk
    association, not a demonstrated preventable fraction.
  locations:
  - preferred_term: uterine cervix
    term:
      id: UBERON:0000002
      label: uterine cervix
  evidence:
  - reference: PMID:8124116
    reference_title: "Abnormal bacterial colonisation of the genital tract and subsequent preterm delivery and late miscarriage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A further logistic analysis of data from women recruited before 16 weeks' gestation showed that preterm deliveries or late miscarriages occurred more often in women with bacterial vaginosis (12/77; 5.5; 2.3 to 13.3; P < 0.001)."
    explanation: >-
      Prospective cohort estimate for early-pregnancy BV and late miscarriage or preterm
      delivery.
  - reference: PMID:8124116
    reference_title: "Abnormal bacterial colonisation of the genital tract and subsequent preterm delivery and late miscarriage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late miscarriage and preterm delivery are associated with the presence of bacterial vaginosis in early pregnancy. This is independent of recognised risk factors such as previous preterm delivery."
    explanation: >-
      Establishes independence from the dominant confounder, prior preterm delivery.
  - reference: PMID:12388968
    reference_title: "Vaginal hydrolytic enzymes, immunoglobulin A against Gardnerella vaginalis toxin, and risk of early preterm birth among women in preterm labor with bacterial vaginosis or intermediate flora."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women in preterm labor with bacterial vaginosis or intermediate flora and detectable sialidase are at increased risk of early preterm birth."
    explanation: >-
      Ties the obstetric outcome to sialidase specifically, supporting the incoming edge
      from the glycosidase node rather than from BV status alone.
  - reference: PMID:12388968
    reference_title: "Vaginal hydrolytic enzymes, immunoglobulin A against Gardnerella vaginalis toxin, and risk of early preterm birth among women in preterm labor with bacterial vaginosis or intermediate flora."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolidase and anti-Gvh IgA did not predict early preterm birth."
    explanation: >-
      The discriminating negative from the same study: of the three markers tested only
      sialidase predicted the outcome, which is why this entry gives sialidase its own
      node and does not curate a prolidase or anti-vaginolysin-IgA arm.

- name: Biofilm Persistence After Antimicrobial Therapy
  biological_scale: TISSUE
  role: resistance_mechanism
  description: >
    The first of two competing accounts of why BV comes back. Metronidazole and
    clindamycin cure 70-85% of episodes within a month, yet more than half of women
    relapse within six months. On this account the adherent Gardnerella biofilm survives
    the antibiotic course and the BV-associated bacteria re-emerge from it - a relapse of
    the same community rather than a new acquisition. Note what this node does not claim:
    no assay currently distinguishes a surviving biofilm from a reacquired one in an
    individual woman, so this is an inference from the biofilm's demonstrated existence
    and known antimicrobial tolerance, not a measured event.
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
    modifier: INCREASED
  downstream:
  - target: Recurrent Bacterial Vaginosis
    description: >-
      Re-emergence of BV-associated bacteria from the surviving adherent layer.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - biofilm_persistence_relapse
  evidence:
  - reference: PMID:34470644
    reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The low rate of sustained cure highlights our limited understanding of the pathogenesis of BV recurrence, which has been attributed to possible persistence and re-emergence of BV-associated bacteria (BVAB) or a BV-associated biofilm following antimicrobials and/or reinfection occurring from sexual partners."
    explanation: >-
      States the persistence account and, in the same sentence, the competing reinfection
      account - which is why both are curated as hypothesis groups rather than one being
      asserted.
  - reference: PMID:34470644
    reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These regimens have similar efficacy and cure ~70–85% of women with BV within 1 month"
    explanation: >-
      Quantifies short-term cure, the denominator against which the relapse rate is the
      surprising figure.

- name: Reinfection from an Untreated Sexual Partner
  biological_scale: ORGANISM
  description: >
    The second account. BV-associated bacteria are exchanged between partners during sex,
    and on this reading a woman cured by antibiotics is reinoculated by an untreated
    regular partner. Six partner-treatment trials in the 1980s and 1990s were negative and
    the hypothesis fell out of favour; guidelines do not recommend partner treatment. The
    2025 StepUp randomised trial reopened it decisively - it was stopped early by its data
    and safety monitoring board because treating the woman alone was inferior to treating
    both partners, with 12-week recurrence 35% versus 63%. This node is therefore curated
    as a real causal route, not as a historical hypothesis, while the biofilm route is
    retained alongside it.
  downstream:
  - target: Recurrent Bacterial Vaginosis
    description: >-
      Reinoculation with BV-associated bacteria from an untreated partner re-establishes
      the dysbiotic community.
    causal_link_type: DIRECT
    hypothesis_groups:
    - sexual_reinfection
  evidence:
  - reference: PMID:40043236
    reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The trial was stopped by the data and safety monitoring board after 150 couples had completed the 12-week follow-up period because treatment of the woman only was inferior to treatment of both the woman and her male partner."
    explanation: >-
      The randomised evidence that an untreated partner is a causal contributor to
      recurrence - the strongest support for this node.
  - reference: PMID:40043236
    reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence of sexual exchange of bacterial vaginosis-associated organisms between partners suggests that male-partner treatment may increase the likelihood of cure."
    explanation: >-
      States the exchange mechanism this node encodes.
  - reference: PMID:34470644
    reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a robust body of evidence to support the exchange of bacteria between partners during sexual activity, and while the hypothesis that women treated for BV are subsequently reinfected with BVAB following sex with an untreated sexual partner is not new, failure of past partner treatment trials has eroded confidence in this concept."
    explanation: >-
      Records both the microbiological support for exchange and the trial history that
      had discredited it, written before the StepUp result.

- name: Recurrent Bacterial Vaginosis
  biological_scale: ORGANISM
  description: >
    Re-establishment of the dysbiotic community after apparently successful treatment -
    the outcome that defines the clinical problem, since short-term cure is not the
    difficulty. Both upstream routes converge here and neither can be excluded in an
    individual woman, because they present identically. That indistinguishability is not a
    curation shortcut; it is the field's stated position and is recorded as a knowledge
    gap below. The node is not a terminal state: a recurrent episode is diagnosed by the
    same Amsel and Nugent criteria as an incident one, so it re-enters the graph at the
    trigger node and the entry is a cycle rather than a chain. That is the structural
    reason short-term cure and sustained cure come apart.
  downstream:
  - target: Loss of Lactobacillus Dominance and Vaginal Acidification
    description: >-
      A recurrent episode is the re-established dysbiotic community state, not a separate
      endpoint - which is why an intervention that only clears anaerobes leaves the cycle
      intact, and why the one curated intervention acting on this node (LACTIN-V, which
      repopulates the niche) is also the only one shown to lower recurrence.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32402161
      reference_title: "Randomized Trial of Lactin-V to Prevent Recurrence of Bacterial Vaginosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The primary efficacy outcome was the percentage of participants who had recurrent bacterial vaginosis (defined by the presence of at least three Amsel criteria and a Nugent score of 4 to 10) at any follow-up visit up to and including the week 12 visit."
      explanation: >-
        Recurrence is operationalised as re-meeting the same diagnostic criteria as an
        incident case, which is what makes this edge a return to the trigger state rather
        than a new outcome.
    - reference: PMID:34470644
      reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Factors including persistence of a BV-associated biofilm, failure to recolonise the vagina with lactobacilli, reinfection from an untreated partner, and host genetic and/or immune factors may all play a role in recurrence"
      explanation: >-
        Names failure to restore lactobacillus dominance - the content of the target node -
        among the drivers of recurrence, closing the loop this edge asserts.
  evidence:
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard antibiotic therapy often fails, with an estimated relapse rate of 50% at six months follow-up"
    explanation: >-
      Quantifies the recurrence burden this node represents.
  - reference: PMID:32402161
    reference_title: "Randomized Trial of Lactin-V to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After treatment with an antibiotic agent, 20 to 75% of women have recurrent bacterial vaginosis within 3 months."
    explanation: >-
      An independent recurrence estimate over a shorter window, showing the range across
      populations and definitions.

- name: Anaerobe Ribosomal Translation (Clindamycin and Tetracycline Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >
    Protein synthesis in the BV consortium is the molecular target of clindamycin, the
    lincosamide alternative to metronidazole and the agent applied topically to the penile
    skin of male partners in the StepUp regimen. It is curated as its own node so that the
    clindamycin arm of therapy attaches to a mechanism rather than to the disease as a
    whole - metronidazole, whose nitroimidazole mechanism is reductive DNA damage in
    anaerobes, does not act here and is deliberately not attached to this node.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  evidence:
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prescription of antibiotics such as metronidazole, clindamycin, etc. is recommended."
    explanation: >-
      Establishes clindamycin as a recommended agent, which is what makes its ribosomal
      target a therapeutic vulnerability in this disease.
  - reference: PMID:40043236
    reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the male partner received oral and topical antimicrobial treatment (metronidazole 400-mg tablets and 2% clindamycin cream applied to penile skin, both twice daily for 7 days)"
    explanation: >-
      Documents the topical clindamycin component of the partner-treatment regimen that
      acts on this target.

mechanistic_hypotheses:
- hypothesis_group_id: biofilm_persistence_relapse
  hypothesis_label: Relapse from a surviving adherent biofilm
  status: CANONICAL
  description: >
    Recurrence is re-emergence of the original community from a Gardnerella-dominated
    adherent biofilm that tolerated the antibiotic course. Marked CANONICAL because the
    biofilm is directly demonstrated on vaginal biopsy and because it is the account most
    treatment development has been built around - not because it has been shown to be the
    operative route in any individual recurrence.
  evidence:
  - reference: PMID:16260520
    reference_title: "Adherent biofilms in bacterial vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A biofilm comprised of confluent G vaginalis with other bacterial groups incorporated in the adherent layer is a prominent feature of bacterial vaginosis."
    explanation: >-
      Establishes that the structure this hypothesis requires exists in vivo.
- hypothesis_group_id: sexual_reinfection
  hypothesis_label: Reinfection from an untreated sexual partner
  status: EMERGING
  description: >
    Recurrence is reacquisition of BV-associated bacteria from a regular untreated
    partner. Marked EMERGING rather than ALTERNATIVE: six earlier partner-treatment trials
    were negative and guidelines still do not recommend partner treatment, but the 2025
    StepUp randomised trial was stopped early for benefit, which is a stronger form of
    evidence than anything supporting the biofilm route. This status should be revisited
    when guidelines respond.
  evidence:
  - reference: PMID:40043236
    reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The addition of combined oral and topical antimicrobial therapy for male partners to treatment of women for bacterial vaginosis resulted in a lower rate of recurrence of bacterial vaginosis within 12 weeks than standard care."
    explanation: >-
      The randomised result on which this hypothesis's EMERGING status rests.


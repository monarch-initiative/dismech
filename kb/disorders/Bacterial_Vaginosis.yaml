    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "thin, white or yellow, homogeneous discharge"
    explanation: >-
      The discharge character as specified in the Amsel criteria used for trial entry.
  - reference: PMID:34470644
    reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is the symptoms themselves, including malodour and vaginal discharge, that cause significant distress to women and impact on their quality of life and relationships"
    explanation: >-
      Names malodour and discharge as the symptoms of the disease and their impact.
  - reference: PMID:6600371
    reference_title: "Nonspecific vaginitis. Diagnostic criteria and microbial and epidemiologic associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we diagnosed nonspecific vaginitis in up to 25 percent of our study population; asymptomatic disease was recognized in more than 50 percent of those with nonspecific vaginitis"
    explanation: >-
      Basis for the FREQUENT rather than VERY_FREQUENT band: more than half of women
      meeting the case definition had no symptoms at all, so symptomatic discharge is
      present in a minority-to-half of cases.
- name: Premature birth
  category: Clinical
  description: >
    Delivery before 37 weeks, and late miscarriage between 16 and 24 weeks, occur more
    often in women with BV detected early in pregnancy. Recorded as a phenotype of the
    disease in pregnancy, not of the disease in general.
  phenotype_term:
    preferred_term: Premature birth
    term:
      id: HP:0001622
      label: Premature birth
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:8124116
    reference_title: "Abnormal bacterial colonisation of the genital tract and subsequent preterm delivery and late miscarriage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple logistic analysis showed that there was an increased incidence of preterm delivery in women with a previous preterm delivery (9/24; odds ratio 25; 95% confidence interval 9 to 70; P < 0.001) and bacterial vaginosis (9/115; 2.8; 1.1 to 7.4; P = 0.04)."
    explanation: >-
      Gives the absolute count behind the OCCASIONAL band: 9 of 115 pregnant women with
      BV delivered preterm, which is within the 5-29% range for that frequency term.

definitions:
- name: Amsel clinical criteria
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  scope: >-
    Office diagnosis of bacterial vaginosis in symptomatic and asymptomatic
    reproductive-aged women.
  description: >
    Three of four bedside findings: thin white-to-yellow homogeneous discharge, more than
    20% clue cells on microscopy, vaginal fluid pH above 4.5, and a fishy odour on adding
    10% potassium hydroxide. The set is worth reading mechanistically rather than as a
    checklist - each item reports a different node of this entry: the discharge and clue
    cells report epithelial adhesion, the pH reports loss of lactic acid, and the whiff
    test reports biogenic amine production. It remains the entry criterion for
    contemporary randomised trials.
  attaches_to:
  - "pathophysiology#Loss of Lactobacillus Dominance and Vaginal Acidification"
  - "pathophysiology#Exfoliation of Bacteria-Coated Epithelial Cells (Clue Cells)"
  - "pathophysiology#Biogenic Amine Production and Amplified Lactobacillus Suppression"
  inclusion_criteria:
  - preferred_term: Thin, white or yellow, homogeneous vaginal discharge
  - preferred_term: More than 20% clue cells on microscopic examination
  - preferred_term: Vaginal fluid pH greater than 4.5
  - preferred_term: Fishy odour on addition of 10% potassium hydroxide (whiff test)
  evidence:
  - reference: PMID:6600371
    reference_title: "Nonspecific vaginitis. Diagnostic criteria and microbial and epidemiologic associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Practical diagnostic criteria for standard clinical use are proposed. Application of such criteria should assist in clinical management of nonspecific vaginitis and in further study of the microbiologic and biochemical correlates and the pathogenesis of this mild but quite prevalent disease."
    explanation: >-
      The originating publication proposing these criteria.
  - reference: PMID:32402161
    reference_title: "Randomized Trial of Lactin-V to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If a potentially eligible woman met at least three of four Amsel criteria (i.e., thin, white or yellow, homogeneous discharge; >20% clue cells on microscopic examination; vaginal fluid with a pH of >4.5; and release of a fishy odor when 10% potassium hydroxide is added to a vaginal specimen)"
    explanation: >-
      Enumerates all four items and the three-of-four threshold, as operationalised for
      trial entry.
- name: Nugent score (Gram stain)
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  scope: >-
    Standardised laboratory diagnosis of bacterial vaginosis from a Gram-stained vaginal
    smear; the reference standard for research and the comparator for molecular assays.
  description: >
    A 0-10 weighted count of three morphotypes on Gram stain - lactobacilli, small
    gram-variable or gram-negative rods (Gardnerella/Bacteroides), and curved gram-variable
    rods - with 7 or above read as BV. Its design principle is not diagnostic accuracy but
    reproducibility: morphotypes with poor intercentre agreement (gram-positive cocci) were
    deliberately dropped and the most reliable one (curved rods) weighted most heavily,
    raising intercentre correlation from 0.61 to 0.82. That is why it, rather than Amsel,
    became the research standard, and why the intermediate band 4-6 exists as a graded
    state rather than a diagnostic failure.
  attaches_to:
  - "pathophysiology#Loss of Lactobacillus Dominance and Vaginal Acidification"
  - "pathophysiology#Polymicrobial Anaerobic Overgrowth"
  evidence:
  - reference: PMID:1706728
    reference_title: "Reliability of diagnosing bacterial vaginosis is improved by a standardized method of gram stain interpretation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The scoring system (0 to 10) was described as a weighted combination of the following morphotypes: lactobacilli, Gardnerella vaginalis or bacteroides (small gram-variable rods or gram-negative rods), and curved gram-variable rods."
    explanation: >-
      Specifies the three scored morphotypes and the score range.
  - reference: PMID:1706728
    reference_title: "Reliability of diagnosing bacterial vaginosis is improved by a standardized method of gram stain interpretation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For comparison with the Spiegel criteria, a score of 7 or higher was considered indicative of bacterial vaginosis."
    explanation: >-
      Gives the diagnostic threshold.
  - reference: PMID:1706728
    reference_title: "Reliability of diagnosing bacterial vaginosis is improved by a standardized method of gram stain interpretation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The standardized score had improved intercenter reliability (r = 0.82) compared with the Spiegel criteria (r = 0.61)."
    explanation: >-
      Quantifies the reproducibility gain that is this score's reason for existing.
  notes: >-
    A contemporary review still describes the Nugent score as the gold-standard diagnostic
    tool despite its known limitations, which is why both it and the Amsel criteria are
    curated here rather than only one.

treatments:
- name: Metronidazole
  description: >
    First-line therapy, oral or as 0.75% intravaginal gel. A nitroimidazole prodrug
    reductively activated inside anaerobes, so its selectivity is for the metabolic
    environment of the consortium rather than for any BV organism specifically - which is
    exactly the property a polymicrobial dysbiosis needs. It cures most episodes and
    prevents few recurrences, and this entry attaches it to the overgrowth node only, not
    to the biofilm node, because clearing planktonic anaerobes is what it is shown to do.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  target_mechanisms:
  - target: Polymicrobial Anaerobic Overgrowth
    treatment_effect: INHIBITS
    description: >-
      Broad anaerobic coverage suppresses the expanded consortium, which is what produces
      the 70-85% one-month cure rate.
    evidence:
    - reference: PMID:34470644
      reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These regimens have similar efficacy and cure ~70–85% of women with BV within 1 month"
      explanation: >-
        Quantifies the effect of first-line therapy on the microbiological state, which is
        the claim this edge makes.
  evidence:
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prescription of antibiotics such as metronidazole, clindamycin, etc. is recommended."
    explanation: >-
      Establishes metronidazole as recommended therapy.
  - reference: PMID:32402161
    reference_title: "Randomized Trial of Lactin-V to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Potentially eligible women completed a standard 5-day course of vaginal 0.75% metronidazole within 30 days before the screening visit."
    explanation: >-
      Documents the standard intravaginal regimen and dose.

- name: Secnidazole
  description: >
    A 5-nitroimidazole given as a single 2 g oral dose of granules, FDA-approved for BV in
    2017. Mechanistically it is metronidazole's class-mate - the same reductive activation
    inside anaerobes - so it attaches to the same overgrowth node and not to the biofilm
    node. What it changes is exposure kinetics rather than target: a roughly 17-hour
    half-life against metronidazole's 8 hours is what makes one dose sufficient, which
    matters for a disease whose first-line regimens run 5 to 7 days and whose recurrence is
    partly a compliance problem. Superiority was shown against placebo rather than against
    metronidazole, so this entry does not claim it is more effective than first-line
    therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: secnidazole
      term:
        id: CHEBI:140628
        label: secnidazole
  target_mechanisms:
  - target: Polymicrobial Anaerobic Overgrowth
    treatment_effect: INHIBITS
    description: >-
      A single dose suppresses the expanded anaerobic consortium sufficiently to normalise
      discharge, the whiff test and clue-cell burden in about half of treated women.
    evidence:
    - reference: PMID:28867602
      reference_title: "A phase-3, double-blind, placebo-controlled study of the effectiveness and safety of single oral doses of secnidazole 2 g for the treatment of women with bacterial vaginosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Single-dose secnidazole 2 g was superior to placebo for the primary and all secondary efficacy measures in the modified intent-to-treat population, with clinical outcome responder rates of 53.3% (57/107) vs 19.3% (11/57; P < .001)."
      explanation: >-
        Quantifies the effect of a single secnidazole dose on the Amsel-defined
        microbiological state, which is the claim this edge makes.
  evidence:
  - reference: PMID:28867602
    reference_title: "A phase-3, double-blind, placebo-controlled study of the effectiveness and safety of single oral doses of secnidazole 2 g for the treatment of women with bacterial vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel single oral dose granule formulation of secnidazole 2 g, a 5-nitroimidazole with a longer half-life (∼17 hours) than metronidazole (∼8 hours), is being developed to treat bacterial vaginosis."
    explanation: >-
      States the pharmacokinetic difference from metronidazole that is the whole rationale
      for the single-dose regimen, and confirms the shared nitroimidazole class.

- name: Tinidazole
  description: >
    A second-generation 5-nitroimidazole, FDA-approved for BV and a CDC-recommended
    alternative regimen, given orally as 1 g daily for 5 days or 2 g daily for 2 days. Like
    secnidazole it shares metronidazole's reductive-activation mechanism and is attached to
    the overgrowth node only. It is curated here partly because its pivotal trial used the
    strict five-criterion FDA cure definition, which is why its reported cure rates (27-37%)
    look far worse than the 70-85% quoted for first-line regimens elsewhere in this entry -
    the difference is the endpoint, not the drug, and that discrepancy is itself worth
    recording in a disease whose literature mixes Amsel, Nugent and molecular definitions.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: tinidazole
      term:
        id: CHEBI:63627
        label: tinidazole
  target_mechanisms:
  - target: Polymicrobial Anaerobic Overgrowth
    treatment_effect: INHIBITS
    description: >-
      Both licensed oral regimens suppress the anaerobic consortium enough to clear all five
      FDA cure criteria in a significant minority of women, against a 5% placebo rate.
    evidence:
    - reference: PMID:17666604
      reference_title: "Effectiveness of two tinidazole regimens in treatment of bacterial vaginosis: a randomized controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Superior efficacy was demonstrated by tinidazole for the 1 g once daily for 5 days regimen (36.8% cured, P<.001, number needed to treat 3.2) and for the 2 g once daily for 2 days regimen (27.4% cured, P<.001, number needed to treat 4.5), when compared with placebo (5.1% cured) in the primary endpoint analysis."
      explanation: >-
        Placebo-controlled effect size for both licensed regimens against the consortium,
        which is the claim this edge makes.
  evidence:
  - reference: PMID:17666604
    reference_title: "Effectiveness of two tinidazole regimens in treatment of bacterial vaginosis: a randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both tinidazole regimens studied provided effective treatment for bacterial vaginosis."
    explanation: >-
      Establishes tinidazole as effective therapy for BV in a multicentre placebo-controlled
      trial.
  - reference: PMID:17666604
    reference_title: "Effectiveness of two tinidazole regimens in treatment of bacterial vaginosis: a randomized controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Using more traditional criteria for cure, efficacy was greater."
    explanation: >-
      Records the endpoint dependence explicitly: the same trial reports a higher cure rate
      under the conventional definition, so the 27-37% figures are not comparable with the
      70-85% quoted from Amsel-based series elsewhere in this entry.

- name: Dequalinium Chloride
  description: >
    A broad-spectrum quaternary-ammonium antiseptic given as a 10 mg vaginal tablet for six
    days, widely used in Europe and non-inferior to oral metronidazole in a phase 4
    double-dummy trial. It is curated as a distinct arm rather than as another antibiotic
    because it is not one: a membrane-active antiseptic exerts no selection pressure of the
    kind that drives nitroimidazole resistance, which is the stated reason the trial was
    run. It attaches to the same overgrowth node, since the evidence is a clinical cure
    rate and not a demonstration of action on the biofilm.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiseptic therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dequalinium chloride
      term:
        id: CHEBI:31466
        label: dequalinium chloride
  target_mechanisms:
  - target: Polymicrobial Anaerobic Overgrowth
    treatment_effect: INHIBITS
    description: >-
      Six days of intravaginal dequalinium chloride clears the Amsel-defined state as often
      as a seven-day oral metronidazole course.
    evidence:
    - reference: PMID:38696172
      reference_title: "Efficacy of Dequalinium Chloride vs Metronidazole for the Treatment of Bacterial Vaginosis: A Randomized Clinical Trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical cure rates at visit 1 were 64 of 69 (92.8%) for dequalinium chloride vs 69 of 74 (93.2%) for metronidazole in the intention-to-treat population"
      explanation: >-
        Head-to-head cure rates against the first-line comparator already curated here,
        supporting an equivalent effect on the consortium.
  evidence:
  - reference: PMID:38696172
    reference_title: "Efficacy of Dequalinium Chloride vs Metronidazole for the Treatment of Bacterial Vaginosis: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This randomized clinical trial showed that dequalinium chloride was not inferior to metronidazole for the treatment of BV."
    explanation: >-
      Establishes the non-inferiority conclusion that justifies curating a non-antibiotic
      alternative alongside the two first-line antimicrobials.
  - reference: PMID:38696172
    reference_title: "Efficacy of Dequalinium Chloride vs Metronidazole for the Treatment of Bacterial Vaginosis: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the increase in antibiotic resistance, effective nonantibiotic treatments for BV are needed."
    explanation: >-
      States the rationale for a non-antibiotic arm, which is why this treatment is curated
      separately rather than folded into the nitroimidazole group.

- name: Clindamycin
  description: >
    Lincosamide alternative to metronidazole, given as 2% intravaginal cream, and the
    topical component applied to penile skin in the StepUp partner-treatment regimen.
    Unlike metronidazole it has a defined molecular target in this entry - the bacterial
    ribosome - which is why it carries a module-conforming target node.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
  target_mechanisms:
  - target: Anaerobe Ribosomal Translation (Clindamycin and Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Clindamycin binds the 50S ribosomal subunit and blocks translation in the
      BV-associated anaerobes.
    evidence:
    - reference: PMID:40043236
      reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the male partner received oral and topical antimicrobial treatment (metronidazole 400-mg tablets and 2% clindamycin cream applied to penile skin, both twice daily for 7 days)"
      explanation: >-
        Documents the clindamycin exposure whose target this edge names.
  - target: Polymicrobial Anaerobic Overgrowth
    treatment_effect: INHIBITS
    description: >-
      Broad anaerobic coverage equivalent to metronidazole in short-term cure.
    evidence:
    - reference: PMID:34470644
      reference_title: "Bacterial vaginosis: drivers of recurrence and challenges and opportunities in partner treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These regimens have similar efficacy and cure ~70–85% of women with BV within 1 month"
      explanation: >-
        Establishes equivalence of the two first-line regimens against the consortium.
  evidence:
  - reference: PMID:35118003
    reference_title: "Bacterial Vaginosis: What Do We Currently Know?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prescription of antibiotics such as metronidazole, clindamycin, etc. is recommended."
    explanation: >-
      Establishes clindamycin as recommended therapy.

- name: LACTIN-V (Lactobacillus crispatus CTV-05 live biotherapeutic)
  description: >
    A vaginally applied live biotherapeutic containing a naturally occurring human vaginal
    strain of L. crispatus, given after a course of metronidazole. It is the only
    intervention curated here that acts on the trigger node rather than on the consortium:
    it does not kill anaerobes, it repopulates the niche. Recurrence at 12 weeks fell from
    45% to 30%, and a randomised immunology substudy showed lower vaginal IL-1alpha and
    soluble E-cadherin, so the effect reaches the epithelial-activation node as well as
    the community-state node.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: vaginal live biotherapeutic (Lactobacillus crispatus) administration
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Loss of Lactobacillus Dominance and Vaginal Acidification
    treatment_effect: RESTORES
    description: >-
      Exogenous L. crispatus colonises the vagina and re-establishes the protective
      lactobacillus-dominant community state that defines this node's healthy baseline.
    evidence:
    - reference: PMID:32402161
      reference_title: "Randomized Trial of Lactin-V to Prevent Recurrence of Bacterial Vaginosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At the 12-week visit, L. crispatus CTV-05 was detected in 79% of participants in the Lactin-V group."
      explanation: >-
        Demonstrates that the intervention achieves the colonisation this edge asserts,
        not merely the clinical endpoint.
  - target: Epithelial Barrier Disruption and Mucosal Immune Activation
    treatment_effect: INHIBITS
    description: >-
      Repletion with L. crispatus lowered vaginal IL-1alpha and soluble E-cadherin, the
      two prespecified markers of inflammation and barrier disruption at this node.
    evidence:
    - reference: PMID:35659905
      reference_title: "Sustained effect of LACTIN-V (Lactobacillus crispatus CTV-05) on genital immunology following standard bacterial vaginosis treatment: results from a randomised, placebo-controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The primary outcomes were vaginal levels of IL-1α and soluble E-cadherin at 24 weeks"
      explanation: >-
        Names the endpoints; the trial reported both significantly lower in the LACTIN-V
        arm, which is the basis for the INHIBITS direction on this edge.
  evidence:
  - reference: PMID:32402161
    reference_title: "Randomized Trial of Lactin-V to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of Lactin-V after treatment with vaginal metronidazole resulted in a significantly lower incidence of recurrence of bacterial vaginosis than placebo at 12 weeks."
    explanation: >-
      The primary efficacy result.
  - reference: PMID:32402161
    reference_title: "Randomized Trial of Lactin-V to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrence of bacterial vaginosis by week 12 occurred in 46 participants (30%) in the Lactin-V group and in 34 participants (45%) in the placebo group"
    explanation: >-
      The absolute recurrence rates behind that result.
  notes: >-
    `treatment_term` is bound to the generic NCIT Pharmacotherapy action because NCIT has
    no clinical-action term for administration of a live biotherapeutic product; the more
    specific intent is carried by `preferred_term`. No CHEBI or NCIT agent term exists for
    L. crispatus CTV-05, so `therapeutic_agent` is deliberately omitted rather than bound
    to something broader.

- name: Concurrent male-partner antimicrobial treatment
  description: >
    Treating the woman's regular male partner with 7 days of oral metronidazole plus 2%
    clindamycin cream applied to penile skin, alongside her own first-line therapy. This
    is the only intervention here aimed at the reinfection route rather than at the
    woman's own vaginal community, and it is a reversal: six trials in the 1980s-90s were
    negative and guidelines do not recommend it, but the 2025 StepUp trial was stopped
    early because withholding it was inferior. Curated as a treatment because the trial
    result is randomised and positive, with the guideline lag recorded in the notes.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
  target_mechanisms:
  - target: Reinfection from an Untreated Sexual Partner
    treatment_effect: INHIBITS
    description: >-
      Eradicating BV-associated bacteria carried by the partner removes the reinoculating
      source, cutting 12-week recurrence from 63% to 35%.
    evidence:
    - reference: PMID:40043236
      reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "recurrence occurred in 24 of 69 women (35%) in the partner-treatment group (recurrence rate, 1.6 per person-year; 95% confidence interval [CI], 1.1 to 2.4) and in 43 of 68 women (63%) in the control group"
      explanation: >-
        The randomised effect size on which this edge rests.
  evidence:
  - reference: PMID:40043236
    reference_title: "Male-Partner Treatment to Prevent Recurrence of Bacterial Vaginosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adverse events in treated men included nausea, headache, and metallic taste."
    explanation: >-
      Records the harms borne by a person who is not the patient, which is the specific
      ethical feature of this intervention.
  notes: >-
    Partner treatment was not recommended in guidelines at the time of the source review
    (PMID:34470644), which predates the StepUp result. The applicability of the trial is
    also bounded by its enrolment criterion - women in a monogamous relationship with a
    regular male partner - and should not be extended to other partnership contexts
    without evidence.


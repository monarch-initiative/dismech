    description: Sustained pumping consumes ATP and drives glycolysis to exhaustion.
- name: Erythrocyte Glycolytic Exhaustion
  biological_scale: CELLULAR
  description: >-
    The ATP demand of continual compensatory pumping overworks the only ATP
    source the red cell has, glycolysis. A metabolomic study of OHSt patients
    found glycolysis exhausted, with accumulation of ADP, pyruvate, lactate and
    malate, leaving the cell metabolically vulnerable. A branch consequence of
    the compensation.
  cell_types:

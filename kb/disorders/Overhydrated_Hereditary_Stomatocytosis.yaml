biochemical:
- name: Erythrocyte sodium and potassium content
  notes: >-
    Red cell cation content is abnormal, with markedly increased intracellular
    sodium and decreased potassium, the measurable signature of the cation leak.
  evidence:
  - reference: PMID:21849667
    reference_title: "Loss-of-function and gain-of-function phenotypes of stomatocytosis mutant RhAG F65S."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OHSt erythrocytes were osmotically fragile, with elevated Na and decreased K contents and increased cation channel-like activity."
    explanation: Reports the elevated-sodium, decreased-potassium red cell cation content.
- name: Erythrocyte 2,3-diphosphoglycerate
  notes: >-
    Red cell 2,3-diphosphoglycerate is reduced and ADP raised, attributed to the
    high rate of active cation pumping.
  evidence:
  - reference: PMID:420735
    reference_title: "Hereditary stomatocytosis: association of low 2,3-diphosphoglycerate with increased cation pumping by the red cell."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary stomatocytes contain 2-10-fold more cation pumps than normal and the increased active cation pumping may explain the high ADP, the low 2,3-diphosphoglycerate concentration and the increased oxygen affinity in this syndrome."
    explanation: States the reduced 2,3-DPG and its attribution to increased active cation pumping.
genetic:
- name: RHAG
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: RHAG
    term:
      id: hgnc:10006
      label: RHAG
  notes: >-
    Heterozygous RHAG missense substitutions cause OHSt by a gain-of-function
    cation-pore mechanism; this is the opposite direction to the biallelic
    loss-of-function RHAG defect of Rh-null (regulator type).
  variants:
  - name: Ile61Arg
    description: >-
      Conserved transmembrane substitution (c.182T>G), one of the two recurrent
      OHSt alleles; gain-of-function cation-pore effect.
    evidence:
    - reference: PMID:18931342
      reference_title: "The monovalent cation leak in overhydrated stomatocytic red blood cells results from amino acid substitutions in the Rh-associated glycoprotein."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DNA analysis revealed that the OHSt patients have 1 of 2 heterozygous mutations (t182g, t194c) in RHAG that lead to substitutions of 2 highly conserved amino acids (Ile61Arg, Phe65Ser)."
      explanation: Reports the Ile61Arg allele.
  - name: Phe65Ser
    description: >-
      Conserved transmembrane substitution (c.194T>C) studied functionally as a
      combined gain of cation conductance and loss of ammonia transport.
    evidence:
    - reference: PMID:21849667
      reference_title: "Loss-of-function and gain-of-function phenotypes of stomatocytosis mutant RhAG F65S."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Four patients with overhydrated cation leak stomatocytosis (OHSt) exhibited the heterozygous RhAG missense mutation F65S."
      explanation: Documents the F65S allele in OHSt patients.
  evidence:
  - reference: PMID:18931342
    reference_title: "The monovalent cation leak in overhydrated stomatocytic red blood cells results from amino acid substitutions in the Rh-associated glycoprotein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RhAG belongs to the ammonium transporter family of proteins that form pore-like structures."
    explanation: Establishes RhAG identity and the structural family behind the pore mechanism.

experimental_models:
- name: RhAG Xenopus laevis oocyte expression system
  experimental_model_type: OTHER
  description: >-
    Heterologous expression of wild-type and mutant RhAG in Xenopus oocytes
    demonstrated the gain of cation conductance: the mutant proteins induced a
    cation leak about six times greater than wild type.
  modeled_mechanisms:
  - target: RhAG Nonselective Cation Pore Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Reproduces the gain-of-function cation conductance of the mutant pore.
    limitations: >-
      Oocytes lack the red cell cytoskeleton and the Rh/ankyrin-R/band 3 membrane
      context, so the heterologous conductance is a boundary-reduced proxy for the
      erythrocyte membrane leak.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The oocyte system omits the erythrocyte cytoskeleton and the native Rh
        membrane complex in which RhAG normally sits, so cell-shape and
        deformability consequences are not observable in it.
    evidence:
    - reference: PMID:18931342
      reference_title: "The monovalent cation leak in overhydrated stomatocytic red blood cells results from amino acid substitutions in the Rh-associated glycoprotein."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "expression of the mutant RhAG proteins induced a leak about 6 times greater than that in wild type."
      explanation: Quantifies the heterologous cation leak recapitulated by the model.

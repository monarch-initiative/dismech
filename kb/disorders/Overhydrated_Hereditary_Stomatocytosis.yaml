diagnosis:
- name: Peripheral blood film and red cell indices
  description: >-
    Stomatocytes on the film with macrocytosis (high MCV) and low MCHC, plus
    reticulocytosis and raised unconjugated bilirubin, in a chronic haemolytic
    picture.
  evidence:
  - reference: PMID:29741259
    reference_title: "Primary red cell hydration disorders: Pathogenesis and diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inappropriate cation leak causes erythrocyte hydration disorders, hemolytic anemia, and characteristic red cell shape abnormalities named stomatocytosis"
    explanation: Describes the blood-film and haemolysis picture used diagnostically.
- name: Osmotic gradient ektacytometry
  description: >-
    Osmotic gradient ektacytometry measures osmotic resistance and hydration and
    is the key test separating the hydration disorders; the OHSt curve is
    markedly shifted. The temperature dependence of the cation leak is also
    informative.
  evidence:
  - reference: PMID:15071792
    reference_title: "The hereditary stomatocytoses: genetic disorders of the red cell membrane permeability to monovalent cations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The key test for diagnosis is osmotic gradient ektacytometry, which measures the osmotic resistance and hydration of the red blood cell; the curve depicting the temperature dependence of the cation leak is also important."
    explanation: States the role of ektacytometry and the temperature-dependence curve.
- name: Molecular genetic testing of RHAG
  description: Confirmatory sequencing of RHAG, usually within a hereditary haemolytic anaemia gene panel.
  evidence:
  - reference: PMID:29559519
    reference_title: "Overhydrated stomatocytosis associated with a complex RHAG genotype including a novel de novo mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted resequencing revealed two probably causative heterozygous mutations in RHAG (Leu336Ser and Ile149Met)"
    explanation: Illustrates RHAG sequencing as the confirmatory diagnostic step.
differential_diagnoses:
- name: Dehydrated hereditary stomatocytosis (xerocytosis)
  description: >-
    The mirror-image volume disorder with dehydrated rather than overhydrated
    cells, mainly from PIEZO1 or KCNN4; distinguished by ektacytometry and
    genetics.
  evidence:
  - reference: PMID:31308777
    reference_title: "Dehydrated hereditary stomatocytosis: clinical perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dehydrated hereditary stomatocytosis (DHSt) is a nonimmune congenital hemolytic disorder characterized by red blood cell (RBC) dehydration and lysis."
    explanation: Characterises the dehydrated sibling disorder distinguished from OHSt.
- name: Rh deficiency syndrome (Rh-null, regulator type)
  description: >-
    Recessive biallelic loss-of-function RHAG producing absence of the Rh complex
    and stomatocytic haemolysis; same gene, opposite mechanism.
  evidence:
  - reference: PMID:29713289
    reference_title: "The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The molecular basis of Rhnull (regulator type) is mutation in both alleles of RHAG, resulting in the absence of RhAG and its closely associated partner proteins from the RBC membrane."
    explanation: >-
      States the biallelic loss-of-function RHAG basis of Rh-null, the opposite-mechanism
      differential that shares this entry's gene.

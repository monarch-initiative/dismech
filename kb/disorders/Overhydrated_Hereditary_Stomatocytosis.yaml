    description: Net cation gain draws water osmotically into the cell.
- name: Compensatory Na/K-ATPase Hyperactivity
  biological_scale: MOLECULAR
  description: >-
    The Na,K-ATPase runs at greatly increased activity in an attempt to restore
    normal cation gradients against the leak, pumping far more than normal red
    cells. The compensation is insufficient to prevent the net gain and swelling.
  molecular_functions:

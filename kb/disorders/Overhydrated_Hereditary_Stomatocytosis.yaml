      label: erythrocyte
  evidence:
  - reference: PMID:18931342
    reference_title: "The monovalent cation leak in overhydrated stomatocytic red blood cells results from amino acid substitutions in the Rh-associated glycoprotein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA analysis revealed that the OHSt patients have 1 of 2 heterozygous mutations (t182g, t194c) in RHAG that lead to substitutions of 2 highly conserved amino acids (Ile61Arg, Phe65Ser)."
    explanation: Identifies the two recurrent heterozygous RHAG transmembrane substitutions this node names.
  - reference: PMID:29559519
    reference_title: "Overhydrated stomatocytosis associated with a complex RHAG genotype including a novel de novo mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overhydrated stomatocytosis is a rare autosomal dominant disorder known to cause variably severe haemolytic anaemia due to heterozygous mutations in the RHAG gene."
    explanation: Establishes heterozygous RHAG mutation as the dominant cause.
  downstream:
  - target: RhAG Nonselective Cation Pore Formation
    causal_link_type: DIRECT
    description: The substitution alters the channel so that it conducts cations.
  - target: Loss of RhAG Ammonia Transport
    causal_link_type: DIRECT
    description: The same substitution impairs the protein's native ammonia-transport function.
- name: RhAG Nonselective Cation Pore Formation
  biological_scale: MOLECULAR
  description: >-
    RhAG belongs to the ammonium-transporter family, whose members form
    pore-like structures. Molecular modelling on the homologous Nitrosomonas
    europaea Rh50 protein indicates that the OHSt substitutions widen the central
    channel and convert it into a non-selective cation pore, a qualitative gain
    of a conductance the wild-type protein does not normally provide.
  molecular_functions:
  - preferred_term: monovalent cation pore activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0008324
      label: monoatomic cation transmembrane transporter activity
  evidence:
  - reference: PMID:18931342
    reference_title: "The monovalent cation leak in overhydrated stomatocytic red blood cells results from amino acid substitutions in the Rh-associated glycoprotein."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We have modeled RhAG on the homologous Nitrosomonas europaea Rh50 protein and shown that these mutations are likely to lead to an opening of the pore."
    explanation: States the structural basis for conversion of RhAG into a cation pore.
  - reference: PMID:29713289
    reference_title: "The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Molecular modeling of the mutant RhAG suggests that the Phe65Ser mutation causes a significant widening of the central transport channel, converting it into a non-selective cation pore (Bruce et al., 2009)."
    explanation: Independent review statement of the pore-conversion mechanism.
  downstream:
  - target: Erythrocyte Monovalent Cation Leak
    causal_link_type: DIRECT
    description: The open pore admits a transmembrane leak of monovalent cations.
- name: Loss of RhAG Ammonia Transport
  biological_scale: MOLECULAR
  description: >-
    A parallel molecular consequence of the same substitution. In red cells RhAG
    acts as an ammonia channel, and the Phe65Ser mutation impairs that native
    transport even as it gains cation conductance. This is a loss-of-function for
    the protein's physiological substrate and is a branch consequence rather than
    part of the haemolytic chain.
  molecular_functions:
  - preferred_term: ammonium channel activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008519
      label: ammonium channel activity
  evidence:
  - reference: PMID:22012326
    reference_title: "Human RhAG ammonia channel is impaired by the Phe65Ser mutation in overhydrated stomatocytic red cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this dramatic decrease can be therefore related to the loss of function of the Phe65Ser-mutated RhAG monomer."
    explanation: Reports that the Phe65Ser mutation impairs RhAG ammonia transport.
  - reference: PMID:21849667
    reference_title: "Loss-of-function and gain-of-function phenotypes of stomatocytosis mutant RhAG F65S."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RhAG F65S exhibits gain-of-function phenotypes of increased cation conductance/permeability, and loss-of-function phenotypes of decreased and modified MA/MA(+) transport"
    explanation: Shows the dual gain-of-cation-conductance and loss-of-amine-transport behaviour of the mutant.
- name: Erythrocyte Monovalent Cation Leak
  biological_scale: CELLULAR
  description: >-
    Through the mutant pore the red cell membrane leaks monovalent cations. In
    OHSt this is the most severe leak of the hereditary stomatocytoses, up to
    about 40 times the normal basal rate at body temperature, and it increases
    linearly with temperature, consistent with a constitutively open cation
    channel.
  cell_types:

    reference_title: "Stomatin is mis-trafficked in the erythrocytes of overhydrated hereditary stomatocytosis, and is absent from normal primitive yolk sac-derived erythrocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The 32 kD lipid-raft-associated membrane protein 'stomatin' is deficient from the erythrocyte membrane in the Na+-K+ leaky haemolytic anaemia, overhydrated hereditary stomatocytosis (OHSt)."
    explanation: Documents the stomatin deficiency this node records.
  - reference: PMID:29713289
    reference_title: "The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially it appeared that the disease must be caused by the absence of this protein, however further investigation revealed that stomatin deficiency was a secondary effect of the disorder (Fricke et al., 2003). It is now known that the primary defect is mutation in RhAG."
    explanation: Establishes that stomatin deficiency is secondary and that RhAG is the primary defect, justifying the correlate framing.
- name: Net Erythrocyte Cation Gain
  biological_scale: CELLULAR
  description: >-
    Because sodium influx through the leak exceeds potassium efflux, the cell
    gains monovalent cations overall. Net intracellular cation content, not any
    single ion, sets erythrocyte volume, so a net gain commits the cell to
    swelling.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: sodium ion import across plasma membrane
    modifier: INCREASED
    term:
      id: GO:0098719

    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: SNV
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: gained monovalent cation channel activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005261
      label: monoatomic cation channel activity
  genes:
  - preferred_term: RHAG
    term:
      id: hgnc:10006
      label: RHAG
  cell_types:
  - preferred_term: erythrocyte
    term:

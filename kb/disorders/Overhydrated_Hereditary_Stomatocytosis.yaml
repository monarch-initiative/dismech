notes: >-
  Identifiers. MONDO:0008493; OMIM:185000; Orphanet:3203 (the schema has no OMIM
  or Orphanet mapping slot, so these are recorded here); MONDO's causal gene is
  RHAG (hgnc:10006), consistent with the curation.

  Scope and boundaries. OHSt is the RHAG gain-of-function, autosomal dominant
  member of the cation-leak hereditary stomatocytosis family. It is curated as a
  single disease at the named clinical-entity level; the two recurrent
  substitutions (Ile61Arg, Phe65Ser) are modelled as variants rather than
  subtypes because they share one mechanism, presentation and management.

  Deliberate boundary with Rh deficiency syndrome (Rh-null, regulator type),
  which is a separate entry. Both involve RHAG, but in opposite directions:
  Rh-null is biallelic loss of function that removes the Rh membrane complex and
  is recessive, whereas OHSt is a heterozygous gain-of-function that converts
  RhAG into a cation pore and is dominant. Reviews discuss the two together and
  MONDO places both under hereditary stomatocytosis; phenotype and prevalence
  data should not be read across between them.

  Deliberate boundary with dehydrated hereditary stomatocytosis (xerocytosis,
  mainly PIEZO1/KCNN4): that is the mirror-image volume disorder (cell
  dehydration, not overhydration) with different genes and is out of scope here.
  Milder overhydrated-type phenotypes linked to SLC4A1 (AE1/band 3) exist and
  are not covered by this RHAG entry.

  Stomatin. Reduced or absent erythrocyte stomatin (band 7.2b) is a classical
  laboratory correlate of OHSt but is a secondary effect, not the cause; it is
  modelled as a dead-end correlate node, not an upstream lesion.

  Provider note. Built from a thin claude_code deep-research report (three web
  searches, leads only); every claim here was verified against PubMed abstracts
  or the open-access Flatt and Bruce 2018 review full text fetched independently.
pathophysiology:
- name: RHAG Transmembrane Missense Substitution
  biological_scale: MOLECULAR
  description: >-
    The germline lesion. A heterozygous RHAG missense variant substitutes a
    highly conserved transmembrane residue of the Rh-associated glycoprotein.
    Two recurrent substitutions account for most reported families, Ile61Arg
    and Phe65Ser; further RHAG missense variants have been reported, and de novo
    occurrence is documented.

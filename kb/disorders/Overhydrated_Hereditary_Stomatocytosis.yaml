    evidence_source: HUMAN_CLINICAL
    snippet: "A girl of German origin with severe congenital hemolytic anemia was found to have overhydrated erythrocytes with markedly increased sodium and reduced potassium concentrations."
    explanation: Directly documents the raised-sodium, lowered-potassium cation profile.
  downstream:

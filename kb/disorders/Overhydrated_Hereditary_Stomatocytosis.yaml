    reference_title: "Disorders of erythrocyte volume homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythrocytes swell when the inward sodium leak exceeds the potassium leak out and shrink when the potassium leak out exceeds the inward sodium leak."
    explanation: States the net-cation-gain rule that makes OHSt an overhydrating leak.
  - reference: PMID:7230721
    reference_title: "Role of the spleen in congenital stomatocytosis associated with high sodium-low potassium erythrocytes."

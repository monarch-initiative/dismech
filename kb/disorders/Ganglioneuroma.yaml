    explanation: >-
      Retrospective series of 22 thoracic ganglioneuromas confirmed by surgery
      and pathology, collected from July 2002 to December 2010, in patients aged
      4 to 57 years (median 21). Of the 22 lesions, 19 lay in the posterior

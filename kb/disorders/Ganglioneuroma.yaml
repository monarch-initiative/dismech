  evidence:
  - reference: PMID:7376870
    reference_title: "Vasocative intestinal polypeptide (VIP)-producing ganglioneuroma in a child with chronic diarrhea."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a 2 1/2-year-old girl with persistent watery diarrhea a retroperitoneal tumour and lymph node composed of benign ganglioneuroma cells were found."
    explanation: >-
      Case report of a 2 1/2-year-old girl with persistent watery diarrhea in
      whom a retroperitoneal tumor and a lymph node made of benign
      ganglioneuroma cells were found; it records watery diarrhea in a child
      with ganglioneuroma. It is a single case, and the authors judged the
      histology compatible with an originally metastasizing neuroblastoma that
      had matured late.
  - reference: PMID:7376870
    reference_title: "Vasocative intestinal polypeptide (VIP)-producing ganglioneuroma in a child with chronic diarrhea."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postoperatively the VIP concentration was normalized, and the diarrhea ceased."
    explanation: >-
      In the same case report, the VIP concentration returned to normal after

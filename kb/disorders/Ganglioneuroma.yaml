    evidence_source: HUMAN_CLINICAL
    snippet: "Gross total resection (GTR) was achieved in 79% of patients with a 19% complication rate."
    explanation: >-
      In this UK CCLG retrospective series of 259 patients with non-metastatic
      ganglioneuroma or intermixed ganglioneuroblastoma (163 with
      ganglioneuroma), gross total resection was achieved in 79% of patients
      with a 19% complication rate. The abstract does not say whether the 19% is
      a share of all operated patients, of operations or of the gross total
      resections, does not grade the complications, and does not report them
      for ganglioneuroma separately.

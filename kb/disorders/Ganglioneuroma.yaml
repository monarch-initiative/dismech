- name: Primary tumor site
  description: >-
    In a single-institution series of 101 patients, tumors arose in the
    retroperitoneum (45.5%), the thoracic paraspinal or mediastinal region
    (32.7%), the presacral space (17.8%) and the cervical region (4%); that
    series does not report the adrenal gland as a separate site. In German
    trials of localized neuroblastic tumors in patients aged 21 years or
    younger, 51 of 161 ganglioneuromas (31.7%) were adrenal, 67 (41.6%)
    abdomino-pelvic and 43 (26.7%) thoraco-cervical. In a separate surgical
    series of 22 thoracic ganglioneuromas, 19 lay in the posterior mediastinum.

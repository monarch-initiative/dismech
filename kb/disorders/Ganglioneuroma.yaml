    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "To understand the contribution of AKT to human primary neuroblastic tumors, we performed immunohistochemistry (IHC) for phosphorylated AKT on a panel of human primary ganglioneuromas (including two ganglioneuroblastoma samples) and compared these results with those from human primary neuroblastomas using two-sided Fisher's exact tests. These data revealed that 10 of 11 ganglioneuromas (90.91%; 95% confidence interval ... expressed moderate to high levels of activated, phosphorylated AKT (Ser473), while only 1 of 15 poorly differentiated neuroblastomas (6.67%; 95% CI ... expressed detectable phosphorylated AKT (Ser473; P < 0.0001; Fig. 1)."
    explanation: >-
      Phosphorylated AKT (Ser473) was moderate to high in 10 of 11 tumors of the
      ganglioneuroma panel, against detectable staining in 1 of 15 poorly
      differentiated neuroblastomas (P < 0.0001); the ellipses skip the
      bracketed confidence intervals. The authors state that the panel included
      two ganglioneuroblastoma samples, so the 11 are not all ganglioneuromas.
      Total AKT was present in every tumor of the panel, so the difference lies
      in its phosphorylation. A section counted as positive
      when more than 25% of viable tumor cells stained.
  - reference: PMID:32728700
    reference_title: "Ganglioneuromas are driven by activated AKT and can be therapeutically targeted with mTOR inhibitors."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that phosphorylated mTOR (Ser2448) was expressed in 9 of 11 ganglioneuromas (81.82%; 95% CI ... but only in 5 of 15 poorly differentiated neuroblastomas (33.33%; 95% CI ... P = 0.0214; Fig. 1 B and Fig. S1 A). Similarly, phosphorylated S6 ribosomal protein (Ser235/236) was expressed in 10 of 11 ganglioneuromas (90.91%; 95% CI ... but only in 7 of 15 poorly differentiated neuroblastomas (46.67%; 95% CI ... P = 0.0362; Fig. 1 B and Fig. S1 B)."
    explanation: >-
      In the same panel, phosphorylated mTOR (Ser2448) was found in 9 of 11
      ganglioneuromas against 5 of 15 poorly differentiated neuroblastomas
      (P = 0.0214), and phosphorylated S6 ribosomal protein (Ser235/236) in 10
      of 11 against 7 of 15 (P = 0.0362); the ellipses skip the bracketed
      confidence intervals. This supports activation downstream of AKT, though
      both markers were also found in some neuroblastomas (5 and 7 of 15), and
      the 11 tumors include two ganglioneuroblastomas.
  - reference: PMID:32728700
    reference_title: "Ganglioneuromas are driven by activated AKT and can be therapeutically targeted with mTOR inhibitors."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Zebrafish transgenic for constitutively activated myr-Akt2 in the sympathetic nervous system were found to develop ganglioneuroma without progression to neuroblastoma. ... Mechanistically, myr-Akt2 overexpression induced sympathoadrenal lineage hyperplasia through increased cell proliferation, concurrent with activation of the AKT target mTOR."
    explanation: >-
      Transgenic zebrafish expressing a constitutively active, myristoylated
      murine Akt2 in the sympathetic nervous system developed ganglioneuroma in
      the interrenal gland, the fish counterpart of the adrenal gland, without
      progression to neuroblastoma; the transgene induced sympathoadrenal
      lineage hyperplasia through increased proliferation, with activation of
      mTOR. This shows that activated AKT is sufficient to produce a
      ganglioneuroma-like tumor in fish, which supports the pathway's
      relevance, not its activation in human tumors, so the support is
      indirect. The transgene is a forced, constitutively active kinase rather
      than a lesion found in patients, and the fish tumors had poor Schwannian
      stroma.
histopathology:
- name: Ganglion Cells in a Schwannian Stroma-Dominant Background
  finding_term:
    preferred_term: Schwannian stroma-dominant ganglioneuromatous tissue with mature or maturing ganglion cells
    term:
      id: NCIT:C42063
      label: Schwannian Stroma Predominant Component of the Tumor Volume
  description: >-
    Ganglion cells distributed singly or in small clusters in Schwannian stroma;
    in mature ganglioneuroma they are all completely mature, and in maturing
    ganglioneuroma mature and maturing ganglion cells are mixed. Completely
    mature ganglion cells are covered with satellite cells. Neurites produced by
    the ganglion cells are incorporated into the cytoplasm of Schwannian stromal
    cells, so naked neurites are not identified around the ganglion cells.
    Grossly the tumors are elastic, yellowish white, well circumscribed and
    encapsulated, although deeply seated tumors may grow into the surrounding
    fat, without prognostic significance. The INPC classifies ganglioneuroma as
    its Schwannian stroma-dominant category and always places it in the
    favorable histology group.
  diagnostic: true
  context: Tumor tissue classified by the INPC
  notes: >-
    NCIT:C3049 Ganglioneuroma names the neoplasm rather than a microscopic
    finding, so the finding is bound to the morphologic-finding term
    NCIT:C42063, a child of NCIT:C42062 Schwannian Stroma More than 50 Percent
    of the Tumor Volume, which the Ganglioneuroblastoma entry binds.
  evidence:
  - reference: PMID:41612478
    reference_title: "Pathology of peripheral neuroblastic tumors."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Tumors in this category represent the most mature form of pNTs. They are elastic and yellowish white, and free surfaces are well-circumscribed and encapsulated. However, infiltrative growth into the surrounding fatty tissue, without prognostic significance, may be observed in deeply seated GN. Tumor cells (ganglion cells) are distributed individually or making small clusters in Schwannian stroma (Fig. 2C). They are either completely mature (mature GN) or a mixture of mature and maturing ganglion cells (maturing GN). Completely mature ganglion cells are covered with satellite cells."
    explanation: >-
      In this 2026 pathology review these sentences open the paragraph headed
      'Ganglioneuroma (Schwannian stroma-dominant)', a heading the cached text
      drops; the quote itself refers to deeply seated GN, mature GN and maturing
      GN, and cites Fig. 2C, the ganglioneuroma panel. The review calls these
      tumors the most mature form of peripheral neuroblastic tumor and describes
      them as elastic, yellowish white, well circumscribed and encapsulated,
      with infiltration of the surrounding fat in deeply seated tumors that has
      no prognostic significance. It places the ganglion cells singly or in
      small clusters in Schwannian stroma, defines mature GN by completely
      mature ganglion cells and maturing GN by a mixture of mature and maturing
      ganglion cells, and states that completely mature ganglion cells are
      covered with satellite cells. This restates the INPC morphologic criteria
      rather than reporting case data.
  - reference: PMID:41612478
    reference_title: "Pathology of peripheral neuroblastic tumors."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Neurites produced by the ganglion cells are immediately incorporated in the cytoplasm of Schwannian stromal cells, so that naked neurites are not identified around the ganglion cells."
    explanation: >-
      This sentence comes from the 2026 review's paragraph headed
      'Ganglioneuroma (Schwannian stroma-dominant)' (the cached text drops the
      heading), directly after the definitions of mature and maturing GN, and
      the review's Fig. 2C ganglioneuroma legend says the same. Neurites
      produced by the ganglion cells are immediately incorporated in the
      cytoplasm of Schwannian stromal cells, so naked neurites are not
      identified around the ganglion cells. This restates an INPC morphologic
      criterion and reports no case data.
  - reference: PMID:10421272
    reference_title: "Terminology and morphologic criteria of neuroblastic tumors: recommendations by the International Neuroblastoma Pathology Committee."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on morphologic criteria defined in this article, NTs were classified into four categories and their subtypes: 1) neuroblastoma (Schwannian stroma-poor), undifferentiated, poorly differentiated, and differentiating; 2) ganglioneuroblastoma, intermixed (Schwannian stroma-rich); 3) ganglioneuroma (Schwannian stroma-dominant), maturing and mature; and 4) ganglioneuroblastoma, nodular (composite Schwannian stroma-richlstroma-dominant and stroma-poor)."
    explanation: >-
      The 1999 terminology paper of the International Neuroblastoma Pathology
      Committee, whose six member pathologists defined the morphologic criteria
      from a review of 227 cases, classifies neuroblastic tumors into four
      categories. Ganglioneuroma is the third, the Schwannian stroma-dominant
      category, with maturing and mature subtypes; neuroblastoma is the
      stroma-poor category and intermixed ganglioneuroblastoma the stroma-rich
      one. Nodular ganglioneuroblastoma is a composite of stroma-rich or
      stroma-dominant tissue with stroma-poor tissue, so ganglioneuroma is the
      only category whose label is stroma-dominant alone. The abstract prints the
      composite label as 'stroma-richlstroma-dominant', and the quote keeps that
      spelling. The abstract does not assign ganglioneuroma to a prognostic
      group; the classification itself is reported in the companion article
      (PMID:10421273).
  - reference: PMID:19530234
    reference_title: "Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma: a report from the CCG and COG."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "GNB-Intermixed (Schwannian stroma-rich) and GN (Schwannian stroma-dominant) tumors are always classified into the FH group."
    explanation: >-
      In the introduction of a Children's Cancer Group and Children's Oncology
      Group study of 552 ganglioneuroma and ganglioneuroblastoma cases, Okamatsu
      et al. restate the International Neuroblastoma Pathology Classification
      (INPC) rule: ganglioneuroma (Schwannian stroma-dominant) tumors, like
      intermixed ganglioneuroblastoma, are always classified into the Favorable
      Histology (FH) group. The sentence restates the INPC papers rather than
      reporting a result of this cohort.
- name: PHOX2B Immunoreactivity
  description: >-
    PHOX2B was expressed in every ganglioneuroma examined in two
    immunohistochemistry series: diffusely in all 65 peripheral neuroblastic
    tumors of a pediatric series, which included 10 ganglioneuromas, with less
    intensity in differentiating neuroblastoma, ganglioneuroblastoma and
    ganglioneuroma than in undifferentiated and poorly differentiated
    neuroblastoma, and in all 8 ganglioneuromas of a series of 77 autonomic
    nervous system tumors. A third series, which did not report ganglioneuromas
    separately, found PHOX2B in 92% of 76 peripheral neuroblastic tumors,
    including two of four adult cases, so the marker is not positive in every
    tumor of the family.
  notes: >-
    No finding term is bound: an OLS NCIT search for PHOX2B on 2026-10-28
    returned the gene (NCIT:C97724), its wild-type allele (NCIT:C97725), gene
    mutation (NCIT:C135016), the protein (NCIT:C97726 Paired Mesoderm Homeobox
    Protein 2B), an anti-PHOX2B CAR T-cell product (NCIT:C220615) and two
    predisposition terms (NCIT:C115225 Hereditary Neuroblastoma, NCIT:C179469
    Genetic Predisposition to Neuroblastoma), and no immunoreactivity finding.
    The two ganglioneuroma series do not say whether staining was nuclear or
    which ganglioneuroma cells stained. They disagree on pheochromocytoma and
    paraganglioma (all 23 positive in PMID:28986989; pheochromocytomas negative
    and 40% of paragangliomas positive in PMID:23715162), so PHOX2B is not used
    to separate ganglioneuroma from them.
  evidence:
  - reference: PMID:28986989
    reference_title: "Utility of Phox2b immunohistochemical stain in neural crest tumours and non-neural crest tumours in paediatric patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phox2b was expressed diffusely in pNT (n = 65 of 65), strongly in NB-UD and NB-PD and with less intensity in NB-D, GNB and GN."
    explanation: >-
      In this pediatric immunohistochemistry series, the 65 peripheral
      neuroblastic tumors (pNT) included 10 ganglioneuromas (GN), alongside
      undifferentiated (NB-UD), poorly differentiated (NB-PD) and
      differentiating (NB-D) neuroblastomas and ganglioneuroblastomas (GNB).
      Phox2b was expressed diffusely in all 65 pNT: strongly in NB-UD and NB-PD,
      and with less intensity in NB-D, GNB and GN. The sentence directly supports
      PHOX2B expression in ganglioneuroma, as in every pNT tested in this series,
      at lower intensity than in undifferentiated and poorly differentiated
      neuroblastoma. The abstract does not say whether the staining was nuclear
      or which ganglioneuroma cells stained, and the ganglioneuroma group is 10
      tumors.
  - reference: PMID:23715162
    reference_title: "A study of gata3 and phox2b expression in tumors of the autonomic nervous system."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phox2b expression was seen in all neuroblastomas, ganglioneuroblastomas, and ganglioneuromas and in 40% of paragangliomas, but pheochromocytomas and all other tumors were negative."
    explanation: >-
      Immunohistochemistry on 77 autonomic nervous system tumors, including 8
      ganglioneuromas, found Phox2b expression in every neuroblastoma,
      ganglioneuroblastoma and ganglioneuroma tested. This second series, by a
      different author group from PMID:28986989, supports PHOX2B expression in
      ganglioneuroma and in every neuroblastic tumor it examined. It reports no
      staining intensity, does not describe the staining as nuclear and gives no
      patient ages, and the ganglioneuroma group is 8 tumors. The sentence's
      paraganglioma and pheochromocytoma results are outside this finding.
  - reference: PMID:28640941
    reference_title: "PHOX2B reliably distinguishes neuroblastoma among small round blue cell tumours."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "PHOX2B was positive in 70 (92%) peripheral neuroblastic tumours, including 68 of 72 (94%) paediatric and two of four (50%) adult cases."
    explanation: >-
      In a series of 76 peripheral neuroblastic tumors (median age 2 years, four
      adults) stained with a rabbit monoclonal antibody, positivity was defined
      as nuclear immunoreactivity in at least 5% of cells, and PHOX2B was
      positive in 70 (92%), including 68 of 72 pediatric and two of four adult
      cases. The abstract does not report ganglioneuromas separately, so it
      bears on this finding only through the tumor family as a whole; it shows
      that PHOX2B is not positive in every peripheral neuroblastic tumor.
- name: Tyrosine Hydroxylase Immunoreactivity
  description: >-
    In a pediatric immunohistochemistry series, tyrosine hydroxylase staining
    was diffuse in every ganglioneuroma, as in all poorly differentiated and
    differentiating neuroblastomas and ganglioneuroblastomas, whereas nine of
    15 undifferentiated neuroblastomas and a nodule in a nodular
    ganglioneuroblastoma did not express it.
  notes: >-
    No finding term is bound: an OLS NCIT search for tyrosine hydroxylase on
    2026-10-28 returned the enzyme (NCIT:C127896 Tyrosine 3-Monooxygenase), the
    gene (NCIT:C127894) and its wild-type allele (NCIT:C127895), an inhibitor
    class (NCIT:C2155), a deficiency disorder (NCIT:C157158) and unrelated
    substances, and no immunoreactivity finding.
  evidence:
  - reference: PMID:28986989
    reference_title: "Utility of Phox2b immunohistochemical stain in neural crest tumours and non-neural crest tumours in paediatric patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse TH was seen in all NB-PD, NB-D, GNB and GN, but nine of 15 NB-UD and a nodule in GNBn did not express TH (n = 55 of 65)."
    explanation: >-
      In the same pediatric series, which included 10 ganglioneuromas (GN),
      diffuse tyrosine hydroxylase (TH) staining was seen in all poorly
      differentiated and differentiating neuroblastomas, ganglioneuroblastomas
      and ganglioneuromas, while nine of 15 undifferentiated neuroblastomas and
      a nodule in a nodular ganglioneuroblastoma did not express TH. The
      sentence directly supports diffuse TH staining in ganglioneuroma. The
      ganglioneuroma group is 10 tumors, and the abstract does not say which
      ganglioneuroma cells stained.
phenotypes:
- category: Abdominal
  name: Retroperitoneal Mass
  description: >-
    The retroperitoneum was the commonest site in a single-institution series,
    with 46 of 101 tumors (45.5%). In German trials of localized tumors in
    patients aged 21 years or younger, 51 of 161 ganglioneuromas (31.7%) were
    adrenal and 67 (41.6%) abdomino-pelvic; that series does not report a
    retroperitoneal category.
  phenotype_term:
    preferred_term: retroperitoneal mass
    term:
      id: HP:6000285
      label: Retroperitoneal mass
  evidence:
  - reference: PMID:42537227
    reference_title: "A comprehensive analysis of ganglioneuromas: a 30-year experience of 101 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumors most commonly arose in the retroperitoneum (n = 46, 45.5%), thoracic paraspinal/mediastinal region (n = 33, 32.7%), presacral space (n = 18, 17.8%), and cervical region (n = 4, 4%)."
    explanation: >-
      In this single-institution series of 101 patients the retroperitoneum
      was the commonest site, with 46 tumors (45.5%); a tumor arising there is
      a retroperitoneal mass. The abstract gives no separate adrenal category,
      and one institution's series is not a population estimate.
  - reference: PMID:27465021
    reference_title: "Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "| | GN (n = 162) | p1 | GNBI (n = 55) | GN / GNBI (n=217) | p 2 | NB / GNBN (n = 591) | | Localization | | | | | | | | Adrenal ... | 51/161 | 0.613* ... | 15/55 | 66/216 | 0.001 * ... | 256/591 | | 31.7 % | 27.3 % | 30.6 % | 43.3 % | | Abdomino-pelvic ... | 67/161 | | 21/55 | 88/216 | | 211/591 | | 41.6 % | | 38.2 % | 40.7% | | 35.7 % | | Thoraco-cervical ... | 43/161 | | 19/55 | 62/216 | | 123/591 | | 26.7 % | | 34.5 % | 28.7 % | | 20.8 % |"
    explanation: >-
      Table 1 of a retrospective study of localized neuroblastic tumors in
      patients aged 21 years or younger, registered in the German NB97 and
      NB2004 trials: in the ganglioneuroma (GN) column, 51 of 161 tumors (31.7%)
      were adrenal, 67 (41.6%) abdomino-pelvic and 43 (26.7%) thoraco-cervical.
      The table has no retroperitoneal category. Reading the adrenal and
      abdomino-pelvic rows as retroperitoneal masses assumes that those tumors
      lie behind the peritoneum, which the paper does not state, and the
      abdomino-pelvic row is not split into sites; the two rows are not added
      together here because the paper reports no combined figure. The 43
      thoraco-cervical tumors were not retroperitoneal.
- category: Thoracic
  name: Posterior Mediastinal Mass
  description: >-
    In a surgical series of 22 thoracic ganglioneuromas, 19 lay in the
    posterior mediastinum.
  phenotype_term:
    preferred_term: posterior mediastinal mass
    term:
      id: HP:0033829
      label: Posterior mediastinal mass
  evidence:
  - reference: PMID:22573298
    reference_title: "CT and MRI findings of thoracic ganglioneuroma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 22 lesions, 19 occurred in the posterior mediastinum, 2 in the lateral pleura and 1 in the right chest."
    explanation: >-
      Retrospective series of 22 thoracic ganglioneuromas confirmed by surgery
      and pathology, collected from July 2002 to December 2010, in patients aged
      4 to 57 years (median 21). Of the 22 lesions, 19 lay in the posterior
      mediastinum, 2 in the lateral pleura and 1 in the right chest. All 22
      were resected tumors, so the sentence places a posterior mediastinal mass
      directly. The 19 of 22 is a share of resected thoracic tumors in this
      series, not of all ganglioneuromas.
- category: Abdominal
  name: Pelvic Mass
  description: >-
    In a single-institution series of 101 patients, 18 tumors (17.8%) arose in

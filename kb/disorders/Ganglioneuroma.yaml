- category: Constitutional
  name: Pain
  frequency: FREQUENT
  description: >-
    In localized ganglioneuromas of patients aged 21 years or younger registered
    in the German neuroblastoma trials NB97 and NB2004, local clinics reported
    pain as the most frequent symptom leading to diagnosis (34.2%), ahead of a
    palpable tumor mass (9.3%) and reduced general condition (6.2%); pain led to
    diagnosis in 14.5% of intermixed ganglioneuroblastomas and 13.6% of
    neuroblastomas and nodular ganglioneuroblastomas. The figure is the share
    of patients whose diagnosis was prompted by pain, and the frequent band
    rests on this one cohort of young patients.
  phenotype_term:
    preferred_term: pain
    term:
      id: HP:0012531
      label: Pain
  evidence:
  - reference: PMID:27465021
    reference_title: "Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "As reported by local clinics, most frequent symptoms leading to diagnosis were pain (GN 34.2 %, GNBI 14.5 %, NB/GNBN 13.6 %, p < 0.001), palpable tumor mass (GN 9.3 %, GNBI 12.7 %, NB/GNBN 18.0 %, p = 0.022) and reduced general condition (GN 6.2 %, GNBI 7.3 %, NB/GNBN 15.8 %, p = 0.003)."
    explanation: >-
      In localized ganglioneuromas registered in the German neuroblastoma
      trials NB97 and NB2004, pain was the most frequent symptom leading to
      diagnosis (GN 34.2%), ahead of palpable tumor mass (9.3%) and reduced
      general condition (6.2%), as reported by local clinics. The figure is the
      share of GN patients whose diagnosis was prompted by pain, so it is a
      floor for pain at presentation rather than a full prevalence; at 34.2% it
      places Pain in the frequent band for this registry cohort of children and
      young people, and it does not say what causes the pain.
- category: Gastrointestinal
  name: Watery Diarrhea
  description: >-
    Watery diarrhea is described in case reports of young children with
    ganglioneuroma, attributed by the authors to vasoactive intestinal peptide

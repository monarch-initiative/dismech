name: Cornelia de Lange Syndrome 1
creation_date: "2026-09-05T00:00:00Z"
category: Genetic
synonyms:
- CDLS1
- NIPBL-related Cornelia de Lange syndrome
- Brachmann-de Lange syndrome
- typus degenerativus amstelodamensis
description: >
  Cornelia de Lange syndrome 1 (CdLS1; OMIM #122470) is the NIPBL-related form of
  the cohesinopathy, and the classic and most severe one. Heterozygous
  loss-of-function variants in NIPBL, which encodes the principal cohesin-loading
  factor, account for more than 60% of molecularly diagnosed CdLS. Nearly all cases
  are de novo and sporadic. The clinical picture is a recognizable craniofacial
  gestalt, pre- and postnatal growth restriction, upper-limb reduction defects,
  hirsutism, intellectual disability, and a neurobehavioural profile dominated by
  repetitive and self-injurious behaviour.

  The mechanism is transcriptional rather than mitotic, and that distinction is the
  substance of the entry rather than a nuance. NIPBL loads cohesin onto chromatin;
  halving its dosage reduces cohesin binding genome-wide, collapses cohesin-mediated
  chromatin loops, and impairs RNA polymerase II initiation and elongation. What
  results is not one broken pathway but thousands of individually modest expression
  changes, usually under 1.5-fold, whose collective action disrupts developmental
  programmes across limb, cardiac, diaphragmatic, craniofacial and central nervous
  system primordia. Sister-chromatid cohesion is largely spared, which is why CdLS
  is a developmental disorder rather than a chromosome-instability syndrome.

  This entry is scoped to the NIPBL form. The umbrella entry Cornelia_de_Lange_Syndrome
  (MONDO:0016033) curates the shared pan-cohesin mechanism, and
  Cornelia_de_Lange_Syndrome_4 (RAD21) is the precedent for splitting the per-gene
  forms into their own records. What belongs here rather than in the umbrella is
  what is specific to NIPBL: the dosage argument, the mosaicism that is selected
  against in blood, and the genotype comparison against SMC1A.

differential_diagnoses:
- name: Other cohesinopathy subtypes (SMC1A, SMC3, RAD21, HDAC8)
  description: >-
    The other CdLS genes account for roughly another 15% of cases. The distinction
    is not purely molecular: individuals with SMC1A variants have higher cognitive
    function and less self-injury than those with NIPBL variants, so the genotype
    carries prognostic information about the behavioural phenotype specifically.
  evidence:
  - reference: PMID:30295920
    reference_title: "Development, behaviour and autism in individuals with SMC1A variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with SMC1A variants show a higher cognitive level and less SIB than individuals with NIPBL variants"
    explanation: >-
      A direct genotype comparison, which is what makes this a clinically meaningful
      differential rather than a nosological one.
discussions:
- discussion_id: cdls1_collective_perturbation_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the collective-perturbation model actually established, or is it the most
    plausible remaining account once no single dominant target has been found?
  attaches_to:
  - pathophysiology#Collective Small Gene-Expression Perturbations
  rationale: >-
    The observation is solid: hundreds of genes change and nearly all the changes
    are under 1.5-fold. The inference that severe developmental defects result from
    their collective action is stated by its own authors as an intriguing
    possibility raised by the data, and no experiment has since shown that summing
    subthreshold perturbations produces the phenotype. The alternative that has not
    been excluded is that a small number of the changes are the pathogenic ones and
    the rest are downstream noise. This matters therapeutically: under the
    collective model there is nothing to target, and under the alternative there is.
  proposed_experiments:
  - experiment_id: cdls1_combinatorial_perturbation_zebrafish
    name: Combinatorial subthreshold perturbation in zebrafish
    description: >-
      Reproduce the individual expression changes seen in nipbl morphants, singly
      and in defined combinations, in wild-type embryos, and test whether organ
      defects appear only above some number of simultaneous perturbations. The
      zebrafish model was developed for exactly this quantitative question.
    readouts:
    - name: Heart and gut defect incidence by number of simultaneous perturbations
      target: pathophysiology#Collective Small Gene-Expression Perturbations
      direction: INCREASED
      interpretation: >-
        A dose-of-perturbations relationship would support the collective model; a
        step change on one perturbation would identify a dominant driver instead.
- discussion_id: cdls1_chd_frequency_discrepancy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the congenital heart defect frequency differ between an
    echocardiographic cohort (33.3%) and population registry data (45.6%), and what
    is the NIPBL-specific figure?
  attaches_to:
  - phenotypes#Congenital heart defect
  rationale: >-
    Both numbers are curated here rather than one being chosen, because the
    difference is informative. Registries ascertain through malformation and so
    over-represent severely affected cases; the echocardiographic cohort was
    consecutive and so should be closer to the true rate among diagnosed patients,
    but is smaller and single-centre. Neither is stratified by gene, so the
    NIPBL-specific cardiac frequency, which is what this entry would want, is
    unpublished. A curator reading either figure alone would be over-reading it.
notes: >-
  Curation decisions worth recording.

  Scope against the umbrella entry. kb/disorders/Cornelia_de_Lange_Syndrome.yaml
  holds MONDO:0016033 and curates the generic pan-cohesin chain with no
  has_subtypes block; Cornelia_de_Lange_Syndrome_4.yaml holds the RAD21 form as its
  own record. This entry follows that precedent and carries what is specific to
  NIPBL: the dosage argument, the blood-selected mosaicism, and the SMC1A
  comparison. The overlap with the umbrella's mechanism section is real and
  intentional, since conformance in dismech duplicates rather than inherits.

  The mechanism is transcriptional, and the entry says so structurally rather than
  only in prose. There is no sister-chromatid-cohesion node, because the sources
  are explicit that cohesion is largely spared and that gene activation is the
  cohesin function sensitive to NIPBL reduction. A reader looking for the canonical
  cohesin function will not find it here, and that absence is the claim.

  The collective-perturbation node is the weakest link and carries a knowledge gap
  saying so. Its own authors frame it as a possibility raised by the data.

  Both CHD frequencies are curated. See the second knowledge gap: choosing one
  would have hidden an ascertainment difference that a reader needs.

  One binding is coarser than the finding. The cohort measuring repetitive
  behaviour measured a broader construct than HPO's Motor stereotypy, which is the
  closest available term; preferred_term carries the measured concept.

animal_models:
- name: Nipbl+/- mouse
  species: Mouse
  genotype: Nipbl heterozygous null
  publication: PMID:28855971
  description: >-
    The heterozygous mouse carries only a modest transcript deficit, which is what
    makes it a dosage model rather than a knockout model, and it is the system in
    which the genome-wide cohesin-binding and expression work was done.
  modeled_mechanisms:
  - target: Genome-Wide Reduction in Cohesin Binding
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The measurement this node asserts was made in this model: reduced chromatin
      cohesin with gene activation, not cohesion, as the sensitive function.
    limitations: >-
      Mouse severity does not map onto the human spectrum, and the effect is strain
      dependent, so the model supports the molecular claim rather than the clinical
      one.
    evidence:
    - reference: PMID:28855971
      reference_title: "The effect of Nipped-B-like (Nipbl) haploinsufficiency on genome-wide cohesin binding and target gene expression: modeling Cornelia de Lange syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The results suggest that gene activation is the primary cohesin function sensitive to Nipbl reduction."
      explanation: >-
        The model's own conclusion, and the basis for this entry deliberately having
        no sister-chromatid-cohesion node.
- name: nipbl-deficient zebrafish
  species: Zebrafish
  genotype: nipbl morpholino knockdown
  publication: PMID:22039349
  description: >-
    The system in which the multi-organ developmental failure was traced back to
    gastrulation, which is what places the lesion early enough to account for heart
    and gut defects.
  modeled_mechanisms:
  - target: Disrupted Multi-Organ Developmental Programmes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the heart, gut and craniofacial arms of the developmental failure.
    limitations: >-
      A morpholino knockdown is a transient and dose-controlled reduction rather than
      a germline heterozygous variant, and the zebrafish lacks counterparts for the
      limb and cognitive features that define much of the human phenotype.
    evidence:
    - reference: PMID:27120001
      reference_title: Using mouse and zebrafish models to understand the etiology of developmental defects in Cornelia de Lange Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Studies of these vertebrate animal models have yielded novel insights into the developmental etiology and genes/gene pathways that contribute to CdLS-associated birth defects, particularly defects of the gut, heart, craniofacial structures, nervous system, and limbs."
      explanation: >-
        Names the organ systems these models inform, which is the scope of the node
        they are linked to.
diagnosis:
- name: Clinical features with NIPBL sequencing
  description: >-
    The primary diagnostic route: the recognisable gestalt together with a
    heterozygous pathogenic variant in one of the cohesin-pathway genes. This entry
    is the NIPBL form; the alternative-tissue route below is what follows when blood
    sequencing is negative in a phenotypically classical patient.
  presence: PRESENT
  evidence:
  - reference: PMID:20301283
    reference_title: "Cornelia de Lange Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of CdLS is established in a proband with suggestive clinical features and/or a heterozygous pathogenic variant in BRD4, MAU2, NIPBL, RAD21, or SMC3"
    explanation: >-
      GeneReviews states the diagnostic criterion, naming NIPBL among the genes.
- name: Alternative-tissue sequencing after negative blood testing
  description: >-
    The diagnostic consequence of mosaicism, and the practical point most likely to
    change what a clinician does. Somatic deleterious NIPBL variants are under
    negative selection in blood, so blood-based testing misses mosaic cases. In a
    phenotypically classical patient with negative blood testing, buccal swab or
    fibroblast sequencing should follow before NIPBL is excluded.
  presence: PRESENT
  evidence:
  - reference: PMID:34326454
    reference_title: "Clinical relevance of postzygotic mosaicism in Cornelia de Lange syndrome and purifying selection of NIPBL variants in blood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrate a negative selection against somatic deleterious NIPBL variants in blood."
    explanation: >-
      The finding that makes blood a poor tissue for this test, which is what the
      recommendation follows from.

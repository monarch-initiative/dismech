    reference_title: "Descriptive epidemiology of Cornelia de Lange syndrome in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found the prevalence of the classical form of CdLS to be 1.24/100,000 births or 1:81,000 births and estimated the overall CdLS prevalence at 1.6-2.2/100,000."
    explanation: The population-registry prevalence estimate for the classical phenotype.
inheritance:
- name: Autosomal dominant, almost always de novo
  description: >-
    Heterozygous NIPBL variants act dominantly. Nearly every constitutional case is
    de novo and sporadic, and neither maternal nor paternal age is a risk factor.
    Recurrence risk is low but not zero: parental germline mosaicism is the reason
    counselling cannot quote zero.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:18074387
    reference_title: "Descriptive epidemiology of Cornelia de Lange syndrome in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were sporadic."
    explanation: >-
      Registry-level confirmation that the disorder does not recur in families,
      which is what makes de novo origin the default assumption.
genetic:
- name: NIPBL
  gene_term:
    preferred_term: NIPBL
    term:
      id: hgnc:28862
      label: NIPBL
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  frequency: more than 60% of molecularly diagnosed CdLS
  notes: >-
    Truncating variants are generally more severe than missense, but the correlation
    is explicitly not absolute and should not be used to predict an individual's
    course. Postzygotic mosaicism is common and is under negative selection in
    blood, so a phenotypically classical patient with negative blood testing needs
    buccal or fibroblast sequencing before NIPBL is excluded.
  evidence:
  - reference: PMID:38735830
    reference_title: "Cornelia de Lange Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in NIPBL, which encodes a protein related to the cohesin complex, have been identified in more than 60% of patients, and pathogenic variants in other genes related to this complex in another 15%: SMC1A, SMC3, RAD21, and HDAC8."
    explanation: >-
      Establishes NIPBL as the major causal gene and gives the share of cases that
      defines type 1.
  - reference: PMID:16236812
    reference_title: "Genotype-phenotype correlations of 39 patients with Cornelia De Lange syndrome: the Dutch experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating mutations were generally found to cause a more severe phenotype but this correlation was not absolute."
    explanation: >-
      States the genotype-phenotype trend together with the caveat that limits its
      predictive use. Both halves of the sentence matter here.
  - reference: PMID:34326454
    reference_title: "Clinical relevance of postzygotic mosaicism in Cornelia de Lange syndrome and purifying selection of NIPBL variants in blood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unusual high prevalence of mosaicism in CdLS, occurring in 13.1% of patients with a positive molecular diagnosis."
    explanation: Quantifies postzygotic mosaicism among molecularly diagnosed patients.
pathophysiology:
- name: NIPBL Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    A heterozygous loss-of-function variant halves functional NIPBL, the cohesin
    loading factor. Mouse models expressing roughly 30-75% of normal transcript
    reproduce the syndrome, so the disorder is a dosage disorder rather than a
    null-allele one: there is no second hit and no threshold below which the
    phenotype appears.
  genes:
  - preferred_term: NIPBL
    term:
      id: hgnc:28862
      label: NIPBL
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:29995837
    reference_title: "Diagnosis and management of Cornelia de Lange syndrome: first international consensus statement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by variants in any one of seven genes, all of which have a structural"
    explanation: >-
      The consensus statement's framing of CdLS as a cohesin-complex disorder, which
      is the class this node's lesion sits in.
  downstream:
  - target: Genome-Wide Reduction in Cohesin Binding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28855971
      reference_title: "The effect of Nipped-B-like (Nipbl) haploinsufficiency on genome-wide cohesin binding and target gene expression: modeling Cornelia de Lange syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found a global decrease in cohesin binding, including at CCCTC-binding factor (CTCF) binding sites and repeat regions."
      explanation: >-
        A ChIP-seq measurement in Nipbl+/- mouse embryonic fibroblasts, which is what
        makes this an edge rather than two separately supported nodes.
- name: Genome-Wide Reduction in Cohesin Binding
  biological_scale: MOLECULAR
  description: >-
    Less loader means less chromatin-bound cohesin, at CTCF boundary sites and at
    repeats. Cohesin-bound genes are enriched for H3K4me3 at their promoters and are
    disproportionately downregulated, which points at gene activation rather than
    cohesion as the sensitive function.
  biological_processes:
  - preferred_term: cohesin loading onto chromatin
    term:
      id: GO:0034088
      label: maintenance of mitotic sister chromatid cohesion
    modifier: DECREASED
  evidence:
  - reference: PMID:28855971
    reference_title: "The effect of Nipped-B-like (Nipbl) haploinsufficiency on genome-wide cohesin binding and target gene expression: modeling Cornelia de Lange syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The results suggest that gene activation is the primary cohesin function sensitive to Nipbl reduction."
    explanation: >-
      The paper's own conclusion that the sensitive cohesin function is
      transcriptional, which is the claim this whole chain rests on.
  downstream:
  - target: Collapse of Cohesin-Mediated Chromatin Loops
    causal_link_type: DIRECT
- name: Collapse of Cohesin-Mediated Chromatin Loops
  biological_scale: MOLECULAR
  description: >-
    Reduced chromatin-bound cohesin weakens enhancer-promoter contacts and CTCF
    insulation. Acute NIPBL depletion in vivo diminishes chromatin loops rapidly,
    and the genes that depend most on NIPBL-supported conformation are cell-identity
    and developmental genes sitting near super-enhancers. That selectivity is what
    turns a globally acting chromatin factor into a developmental disorder.
  biological_processes:
  - preferred_term: chromatin looping
    term:
      id: GO:0140588
      label: chromatin looping
    modifier: DECREASED
  evidence:
  - reference: PMID:41699137
    reference_title: "Acute NIPBL depletion reveals in vivo dynamics of loop extrusion and its role in transcription activation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NIPBL specifically regulates cell identity genes by supporting a unique local genome conformation defined by greater spatial proximity to nearby super-enhancers and weaker transcription start site insulation of genomic contacts"
    explanation: >-
      Explains why loss of a general chromatin factor produces a developmental
      rather than a global phenotype.
  downstream:
  - target: Impaired RNA Polymerase II Transcription
    causal_link_type: DIRECT
- name: Impaired RNA Polymerase II Transcription
  biological_scale: MOLECULAR
  description: >-
    Transcription itself is impaired at both ends: initiation at promoters and
    elongation through gene bodies. This is measured in CdLS patient cells, not only
    in models.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:26581180
    reference_title: "Mutant cohesin affects RNA polymerase II regulation in Cornelia de Lange syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutant cohesin impairs both RNA polymerase II (Pol II) transcription initiation at promoters and elongation in the gene body"
    explanation: >-
      Locates the transcriptional lesion at two specific steps rather than asserting
      a general dysregulation.
  downstream:
  - target: Collective Small Gene-Expression Perturbations
    causal_link_type: DIRECT
- name: Collective Small Gene-Expression Perturbations
  biological_scale: CELLULAR
  description: >-
    The distinctive feature of this disease's mechanism, and the reason it resists
    the usual one-pathway account. Hundreds to thousands of genes change expression
    and nearly all the changes are modest, usually under 1.5-fold. No single
    perturbation is individually pathogenic; the phenotype is the sum. This is also
    why there is no obvious therapeutic target: there is no dominant node to
    correct.
  evidence:
  - reference: PMID:22039349
    reference_title: "Multifactorial origins of heart and gut defects in nipbl-deficient zebrafish, a model of Cornelia de Lange Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nearly all such changes are modest, however--usually less than 1.5-fold--raising the intriguing possibility that, in CdLS, severe developmental defects result from the collective action of many otherwise innocuous perturbations."
    explanation: >-
      States the collective-perturbation hypothesis in the terms this node curates
      it in, including that it remains a hypothesis.
  - reference: PMID:29348408
    reference_title: "NIPBL(+/-) haploinsufficiency reveals a constellation of transcriptome disruptions in the pluripotent and cardiac states."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "identified hundreds of mRNAs, pseudogenes, and non-coding RNAs with altered expression"
    explanation: >-
      Reproduces the many-small-changes signature in human iPSC-derived
      cardiomyocytes, which is disease-relevant tissue rather than a fibroblast
      proxy.
  downstream:
  - target: Disrupted Multi-Organ Developmental Programmes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from a distributed expression signature to specific organ
      malformations is asserted by the sources as an integration of demonstrated
      components rather than demonstrated end to end, so the edge is typed indirect.
- name: Disrupted Multi-Organ Developmental Programmes
  biological_scale: TISSUE
  description: >-
    Developmental programmes fail across limb bud, cardiac and left-right
    patterning, foregut and diaphragm, craniofacial structures and the central
    nervous system. In the zebrafish model the deregulation is detectable from
    gastrulation onwards in endodermal differentiation and left-right patterning
    genes, which places the lesion early enough to explain heart and gut defects.
  evidence:
  - reference: PMID:27120001
    reference_title: "Using mouse and zebrafish models to understand the etiology of developmental defects in Cornelia de Lange Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Studies of these vertebrate animal models have yielded novel insights into the developmental etiology and genes/gene pathways that contribute to CdLS-associated birth defects, particularly defects of the gut, heart, craniofacial structures, nervous system, and limbs."
    explanation: >-
      Names the specific organ systems whose developmental programmes fail, which is
      what this node asserts.
  downstream:
  - target: Upper-limb reduction defect
    causal_link_type: DIRECT
  - target: Congenital heart defect
    causal_link_type: DIRECT
  - target: Congenital diaphragmatic hernia
    causal_link_type: DIRECT
  - target: Intellectual disability
    causal_link_type: DIRECT
  - target: Cleft palate
    causal_link_type: DIRECT
  - target: Intrauterine growth retardation
    causal_link_type: DIRECT
phenotypes:
- category: Craniofacial
  name: Synophrys
  frequency: VERY_FREQUENT
  description: >-
    Part of the craniofacial gestalt that makes the syndrome clinically
    recognizable, together with arched eyebrows, long philtrum and thin down-turned
    lips.
  phenotype_term:
    preferred_term: Synophrys
    term:
      id: HP:0000664
      label: Synophrys
  diagnostic: true
  evidence:
  - reference: PMID:29995837
    reference_title: "Diagnosis and management of Cornelia de Lange syndrome: first international consensus statement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cornelia de Lange syndrome (CdLS) is an archetypical genetic syndrome that is characterized by intellectual disability, well-defined facial features, upper limb anomalies and atypical growth, among numerous other signs and symptoms."
    explanation: >-
      The consensus statement names well-defined facial features as one of the four
      cardinal characteristics, which is what makes the gestalt diagnostic rather
      than merely associated.
- category: Musculoskeletal
  name: Upper-limb reduction defect
  frequency: FREQUENT
  description: >-
    Limb defects are the commonest associated malformation in registry data, at
    73.1%, and were present in every case in one national series. Involvement is
    predominantly upper-limb and often asymmetric.
  phenotype_term:
    preferred_term: Forearm undergrowth
    term:
      id: HP:0009821
      label: Forearm undergrowth
  evidence:
  - reference: PMID:18074387
    reference_title: "Descriptive epidemiology of Cornelia de Lange syndrome in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent associated congenital malformations were limb defects (73.1%), congenital heart defects (45.6%), central nervous system malformations (40.2%), and cleft palate (21.7%)."
    explanation: >-
      Registry frequencies for the four commonest malformations, used as the source
      for this and three other phenotype bands in this entry.
- category: Cardiovascular
  name: Congenital heart defect
  frequency: FREQUENT
  description: >-
    Reported in 33.3% of an echocardiographic cohort and 45.6% in registry data. The
    discrepancy is real and probably reflects ascertainment: registries capture more
    severely malformed cases. Pulmonary stenosis is the single commonest lesion, and
    late mitral and tricuspid valve dysplasia appearing after age ten is the reason
    surveillance rather than a single neonatal echocardiogram is recommended.
  phenotype_term:
    preferred_term: Abnormal heart morphology
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:19449412
    reference_title: "Analysis of congenital heart defects in 87 consecutive patients with Brachmann-de Lange syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A cardiac anomaly was identified in 29/87 (33.3%) including 28 (32.2%) patients with a structural CHD, and an additional patient (1.2%) with isolated non-obstructive hypertrophic cardiomyopathy (HCM)."
    explanation: The prospective echocardiographic frequency, from consecutive patients.
- category: Cardiovascular
  name: Pulmonic stenosis
  frequency: FREQUENT
  description: >-
    The commonest single structural lesion, in 39% of those with a congenital heart
    defect.
  phenotype_term:
    preferred_term: Pulmonic stenosis
    term:
      id: HP:0001642
      label: Pulmonic stenosis
  evidence:
  - reference: PMID:19449412
    reference_title: "Analysis of congenital heart defects in 87 consecutive patients with Brachmann-de Lange syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall incidence of pulmonary stenosis was 39% (11/28)."
    explanation: Gives the lesion distribution within the cardiac subgroup.
- category: Respiratory
  name: Congenital diaphragmatic hernia
  frequency: OCCASIONAL
  description: >-
    Uncommon but the dominant driver of mortality. Infants with both CdLS and CDH
    fare markedly worse than infants with CDH alone: 76% mortality against 29%, with
    only a third undergoing repair. Of the seven who were repaired, five survived to
    discharge, which suggests surgical candidacy rather than the syndrome itself is
    the discriminator.
  phenotype_term:
    preferred_term: Congenital diaphragmatic hernia
    term:
      id: HP:0000776
      label: Congenital diaphragmatic hernia
  evidence:
  - reference: PMID:32762940
    reference_title: "Cornelia de Lange syndrome and congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mortality was 76% for CdLS patients compared with 29% for non-CdLS patients"
    explanation: The mortality comparison that makes CDH the principal prognostic lesion.

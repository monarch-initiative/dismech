discussions:
- discussion_id: cdls1_collective_perturbation_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the collective-perturbation model actually established, or is it the most
    plausible remaining account once no single dominant target has been found?
  attaches_to:
  - pathophysiology#Collective Small Gene-Expression Perturbations
  rationale: >-
    The observation is solid: hundreds of genes change and nearly all the changes
    are under 1.5-fold. The inference that severe developmental defects result from
    their collective action is stated by its own authors as an intriguing
    possibility raised by the data, and no experiment has since shown that summing
    subthreshold perturbations produces the phenotype. The alternative that has not
    been excluded is that a small number of the changes are the pathogenic ones and
    the rest are downstream noise. This matters therapeutically: under the
    collective model there is nothing to target, and under the alternative there is.
  proposed_experiments:
  - experiment_id: cdls1_combinatorial_perturbation_zebrafish
    name: Combinatorial subthreshold perturbation in zebrafish
    description: >-
      Reproduce the individual expression changes seen in nipbl morphants, singly
      and in defined combinations, in wild-type embryos, and test whether organ
      defects appear only above some number of simultaneous perturbations. The
      zebrafish model was developed for exactly this quantitative question.
    readouts:
    - name: Heart and gut defect incidence by number of simultaneous perturbations
      target: pathophysiology#Collective Small Gene-Expression Perturbations
      direction: INCREASED
      interpretation: >-
        A dose-of-perturbations relationship would support the collective model; a
        step change on one perturbation would identify a dominant driver instead.
- discussion_id: cdls1_chd_frequency_discrepancy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the congenital heart defect frequency differ between an
    echocardiographic cohort (33.3%) and population registry data (45.6%), and what
    is the NIPBL-specific figure?
  attaches_to:
  - phenotypes#Congenital heart defect
  rationale: >-
    Both numbers are curated here rather than one being chosen, because the
    difference is informative. Registries ascertain through malformation and so
    over-represent severely affected cases; the echocardiographic cohort was
    consecutive and so should be closer to the true rate among diagnosed patients,
    but is smaller and single-centre. Neither is stratified by gene, so the
    NIPBL-specific cardiac frequency, which is what this entry would want, is
    unpublished. A curator reading either figure alone would be over-reading it.
notes: >-
  Curation decisions worth recording.

  Scope against the umbrella entry. kb/disorders/Cornelia_de_Lange_Syndrome.yaml
  holds MONDO:0016033 and curates the generic pan-cohesin chain with no
  has_subtypes block; Cornelia_de_Lange_Syndrome_4.yaml holds the RAD21 form as its
  own record. This entry follows that precedent and carries what is specific to
  NIPBL: the dosage argument, the blood-selected mosaicism, and the SMC1A
  comparison. The overlap with the umbrella's mechanism section is real and
  intentional, since conformance in dismech duplicates rather than inherits.

  The mechanism is transcriptional, and the entry says so structurally rather than
  only in prose. There is no sister-chromatid-cohesion node, because the sources
  are explicit that cohesion is largely spared and that gene activation is the
  cohesin function sensitive to NIPBL reduction. A reader looking for the canonical
  cohesin function will not find it here, and that absence is the claim.

  The collective-perturbation node is the weakest link and carries a knowledge gap
  saying so. Its own authors frame it as a possibility raised by the data.

  Both CHD frequencies are curated. See the second knowledge gap: choosing one
  would have hidden an ascertainment difference that a reader needs.

  One binding is coarser than the finding. The cohort measuring repetitive
  behaviour measured a broader construct than HPO's Motor stereotypy, which is the
  closest available term; preferred_term carries the measured concept.

  How the treatments reach the pathograph. Both entries carry target_phenotypes
  rather than target_mechanisms, which is deliberate. dismech.graph draws a treats
  edge from a resolved target_phenotypes descriptor and a targets edge from a
  target_mechanisms link, so a treatment reaches the graph either way. Neither
  treatment here acts on a mechanism node: the gastrostomy bypasses feeding
  failure, and supportive management addresses the manifestations rather than the
  transcriptional lesion, which nothing in this disease treats. Asserting a
  target_mechanisms link into the chain would claim a mechanistic action neither
  intervention has.

  GeneReviews evidence is graded OTHER throughout, matching
  Cornelia_de_Lange_Syndrome_4, which grades the same reference that way in every
  item including its clinical-characteristics quote. The chapter states management
  recommendations, recurrence-risk counselling and diagnostic criteria as
  expert-authored guidance rather than reporting a cohort of its own, which is the
  case CLAUDE.md puts under OTHER. The international consensus statement's own
  sentence about being a consensus of experts is graded the same way for the same
  reason; the clinical findings quoted from that paper elsewhere stay
  HUMAN_CLINICAL.

  Frequency bands and their denominators. Two were wrong in the same way and are
  worth stating together, because the mistake is not arithmetic. Pulmonic stenosis
  was banded FREQUENT from 39%, which is its share of the 28 patients who had a
  structural cardiac defect, not of the 87-patient cohort; against the cohort it is
  11/87, about 13%. As curated it gave a lesion the same band as the category it
  sits inside. The prevalence record carried BAND_1_9_PER_1000000 beside its own
  rate_per_100000 of 1.24, which is a factor of ten out and disagreed with the
  umbrella entry on the same European registry figure. A band is a claim about the
  disease population, so the denominator of the number it is drawn from has to be
  checked before the band is set.

  - reference: PMID:18074387
    reference_title: "Descriptive epidemiology of Cornelia de Lange syndrome in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost 70% of patients, born after the 37th week of gestation, weighed <or=2,500 g."
    explanation: >-
      The registry's counted figure for growth restriction at birth. It is low birth
      weight rather than antenatally diagnosed growth restriction, and it counts
      only term births, so it is a floor for this phenotype rather than a
      measurement of it.

  Every frequency band in this entry was audited against the figure behind it, after
  a third instance of the denominator error survived a sweep run for the first two.
  Sixteen phenotypes, and the audit sorts them into four groups. Ten carry a band
  supported by a counted figure in a cited source and are unchanged: synophrys,
  upper-limb reduction defect, congenital heart defect, pulmonic stenosis,
  intellectual disability, self-injurious behavior, delayed gross motor development,
  abnormal brain morphology, cleft palate, and motor stereotypy, the last banded
  below a 100% figure for a broader construct. Three carry no band at all, because
  no cited source counts them: gastroesophageal reflux, congenital diaphragmatic
  hernia, and feeding difficulties, whose only figure counts gastrostomies rather
  than the phenotype. Two are banded from a number that is not a direct measurement
  and say so on the phenotype: intrauterine growth retardation, from a low
  birth-weight proxy restricted to term births, and hirsutism, whose only published
  figure is in a source not cached here. And one, delayed speech and language
  development, is lowered to the band containing the number quoted for it.

  Two of those counts come from a cohort selected for postzygotic mosaicism
  (synophrys eleven of eleven, intellectual disability ten of eleven), which is
  recorded on each rather than presented as an unselected prevalence. What the entry
  no longer does anywhere is band from a phrase naming a cardinal feature, from an
  intervention rate, or from a cause-of-death share.

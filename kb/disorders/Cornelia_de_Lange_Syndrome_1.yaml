  rate_denominator: LIVE_BIRTHS
  notes: >-
    Registry prevalence of the classical form, roughly 1 in 81,000 births, with an
    overall estimate of 1.6-2.2 per 100,000 once milder cases are included. This is
    a CdLS-wide figure, not a NIPBL-specific one; no registry stratifies by gene.

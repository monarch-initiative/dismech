- discussion_id: cmh15_model_allele_class_mismatch
  prompt: >-
    Can vinculin-deficiency models say anything about a disease proposed to act by
    gain of function?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Cardiomyocyte Force Transmission
  - animal_models#Cardiomyocyte-specific vinculin knockout mouse (cVclKO)
  - animal_models#Heterozygous vinculin knockout mouse (Vin+/-)
  rationale: >-
    Every in vivo vinculin model in existence removes protein: a cardiomyocyte
    null, a heterozygous null. They agree with each other and with human
    loss-of-function VCL variants in producing dilation, arrhythmia and sudden
    death rather than hypertrophy. The mechanism proposed for CMH15 is the
    opposite in kind - mutant metavinculin that fails to restrain vinculin and
    actively drives disordered actin assembly, which ClinGen reads as gain of
    function. So the models are informative about what vinculin does and
    uninformative about what a CMH15 allele does, and their failure to produce
    hypertrophy is weak evidence against the hypothesis rather than strong
    evidence against it. There is a second, smaller mismatch stacked on the first:
    metavinculin makes up a much larger share of the combined vinculin pool in
    human than in mouse heart, so any insert-specific effect is attenuated in
    mouse regardless of allele.
  evidence:
  - reference: PMID:17785437
    reference_title: Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we developed a mouse model with cardiac-myocyte-specific inactivation of the
      vinculin (Vcl) gene by using Cre-loxP technology
    explanation: >-
      Establishes the allele class of the principal in vivo model as an
      inactivation, which is the mismatch this discussion is about.
  - reference: CGGV:assertion_27365fd2-1203-4e2b-8830-3277e965d8bc-2023-05-10T160000.000Z
    reference_title: VCL / hypertrophic cardiomyopathy (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism for disease is believed to be gain-of-function, with mutants
      both failing to induce F-actin binding and promoting formation of large actin
      assemblies with linear bundles (PMID: 30844403).
    explanation: >-
      States the proposed human mechanism as gain of function, against which the
      loss-of-function models are mismatched.
  - reference: PMID:17785437
    reference_title: Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The amount of metavinculin expressed in human cardiac tissue appears greater
      than that in mouse
    explanation: >-
      Sources the second, smaller mismatch stacked on the allele-class one: an
      insert-specific effect is attenuated in mouse heart because metavinculin is a
      smaller share of the combined pool there than in human heart. Graded OTHER
      because the sentence is a review statement in the paper's introduction citing
      prior work, not a result of the study it appears in.
differential_diagnoses:
- name: VCL-related dilated cardiomyopathy
  disease_term:
    preferred_term: dilated cardiomyopathy
    term:
      id: MONDO:0005021
      label: dilated cardiomyopathy
  description: >-
    The same gene, and in the case of p.Arg975Trp the same substitution, with the
    opposite remodelling direction and a far stronger evidence base. Loss-of-function
    VCL variants are the well-supported class here, presenting in infancy with
    severe systolic dysfunction and dilation. This is the first alternative to
    consider when a VCL variant is found, because it is the interpretation the
    evidence supports.
  distinguishing_features:
  - Dilated, thin-walled left ventricle with reduced ejection fraction rather than hypertrophy with outflow obstruction
  - Typically truncating or frameshift VCL alleles rather than missense
  - Frequently infantile onset, with recovery of ventricular function by early childhood in most of a paediatric series - no counterpart in hypertrophic disease
  - ClinGen rates the gene-disease relationship Strong rather than Disputed
  evidence:
  - reference: PMID:37548861
    reference_title: Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case series identified a unique phenotype of HF with reduced ejection
      fraction at presentation that evolved to HF with recovered EF in over 80% of
      infant DCM cases with LOF VCL variants.
    explanation: >-
      Characterizes the VCL phenotype that is actually well supported, and its
      distinctive natural history, against which a hypertrophic attribution should
      be weighed.
- name: Sarcomeric (myofilament) hypertrophic cardiomyopathy
  disease_term:
    preferred_term: hypertrophic cardiomyopathy
    term:
      id: MONDO:0005045
      label: hypertrophic cardiomyopathy
  description: >-
    The overwhelmingly more likely explanation for hypertrophic cardiomyopathy in
    any given proband, and the diagnosis that should be pursued before a VCL
    variant is entertained. Only eight genes have definitive evidence for
    hypertrophic cardiomyopathy, all encoding sarcomeric proteins. Both CMH15
    probands were drawn from cohorts already screened negative for these, which is
    the only reason a VCL variant was looked for at all.
  distinguishing_features:
  - A pathogenic variant in MYBPC3, MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2 or MYL3
  - Reverse-curvature septal morphology rather than the sigmoidal contour reported for the Z-disc class
  - Myocyte disarray on histology
  evidence:
  - reference: PMID:30681346
    reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 33 HCM genes, only 8 (24%) were categorized as definitive ( MYBPC3, MYH7,
      TNNT2, TNNI3, TPM1, ACTC1, MYL2, and MYL3); 3 had moderate evidence ( CSRP3,
      TNNC1, and JPH2; 33%); and 22 (66%) had limited (n=16) or no evidence (n=6).
    explanation: >-
      Names the genes that do have definitive evidence, and by omission places VCL
      outside them.
- name: Obstructive hypertrophy of other cause, including aortic stenosis
  description: >-
    Included because of the specific trap this entity sets. Intercalated-disc
    depletion of vinculin and metavinculin was the histological finding used to
    corroborate the VCL attribution in both probands, and it turns out to be a
    feature of outflow obstruction rather than of VCL genotype: the same pattern
    appears in obstructive hypertrophic cardiomyopathy generally and in aortic
    stenosis, and is absent in dilated, hypertensive and pulmonary-hypertensive
    hearts. The finding therefore cannot be used to distinguish CMH15 from any
    other obstructive lesion, and should not be treated as a diagnostic marker.
  distinguishing_features:
  - None histologically - the intercalated-disc vinculin pattern is shared, which is the point of this entry
  - Aortic stenosis is distinguished by valve morphology and the level of the gradient on imaging, not by vinculin staining
  evidence:
  - reference: PMID:16949038
    reference_title: Obstructive hypertrophic cardiomyopathy is associated with reduced expression of vinculin in the intercalated disc.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tissue specimens derived from patients with obstructive HCM and aortic
      stenosis (AS) showed a universal defect of vinculin/metavinculin expression
      in the intercalated disc but preserved expression in the cardiac Z-disc
    explanation: >-
      Supports the claim this differential rests on: the staining pattern is shared
      between CMH15, obstructive hypertrophic cardiomyopathy without a VCL variant,
      and aortic stenosis, so it cannot distinguish them.
references:
- reference: PMID:20301725
  title: Nonsyndromic Hypertrophic Cardiomyopathy Overview.
  tags:
  - GeneReviews
notes: >-
  Curated deliberately as a disputed entity rather than as an established disease,
  and the shape of the record follows from that. The `genetic` block carries
  REFUTE evidence alongside its SUPPORT; the pathophysiology nodes upstream of the
  hypertrophy are HYPOTHETICAL or PROVISIONAL rather than ESTABLISHED; and the
  histopathology finding is recorded together with the paper that showed it is
  non-specific. Nothing here should be read as asserting that VCL causes
  hypertrophic cardiomyopathy.

  Why the entry exists at all, given the dispute. MONDO carries the term, OMIM
  carries the entity (613255), and VCL sits on commercial cardiomyopathy panels,
  so the attribution will keep being encountered whether or not it is curated.
  Recording it with its counter-evidence attached is more useful than leaving the
  concept to be met without any. ClinGen's own verdict is that more evidence is
  needed to support or entirely refute the relationship, so the honest state is
  open rather than closed. Should a future recuration move VCL to Refuted, the
  right response is to record that and keep the entry, not to delete it.

  Two evidential distinctions worth preserving through later edits. First, the
  metavinculin biochemistry and the human genetic attribution are separate claims
  with different support: the actin-bundling and severing work is solid in vitro
  and structurally rationalized, and none of the dispute touches it. Second, the
  intercalated-disc depletion is cited twice from PMID:16949038, once SUPPORT and
  once REFUTE, because that paper establishes the finding and destroys its
  specificity in the same study. Do not consolidate those into one item.

  On GeneReviews: PMID:20301725 (Nonsyndromic Hypertrophic Cardiomyopathy
  Overview) is the applicable chapter and is tagged in `references`, but its
  cached PubMed record contains only the chapter's purpose statement with no
  clinical-characteristics text, so no phenotype in this entry is sourced from it
  and no snippet is claimed against it. There is no VCL-specific GeneReviews
  chapter.

  No `datasets` block, and this is a decision rather than an omission. No GEO
  series names VCL, vinculin or metavinculin; what a dataset search surfaces is
  generic hypertrophic cardiomyopathy material, which resolves perfectly and is
  about a different population. Attaching that to an entity defined by a disputed
  VCL attribution would be the Named Entity Confusion the dataset-curation guidance
  warns about. If a VCL-specific series appears later, it is welcome here.

  Coverage gaps that are real rather than editorial. No prevalence figure can be
  given, and none should be invented. No treatment is genotype-directed, so the
  treatments block is deliberately thin and defers to the parent entry. No
  penetrance, age of onset, or progression data exist, because there is no
  pedigree - both probands were isolated cases from screening cohorts. No CMH15
  knock-in animal model exists; the two mouse models curated here both delete
  vinculin and are recorded with that mismatch made explicit.

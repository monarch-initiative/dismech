prevalence:
- population: Worldwide published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists, and none can be derived, because
    the gene-disease relationship is disputed. The entire published case base is
    two unrelated probands, both reported by one group in 2006 from Mayo Clinic
    hypertrophic cardiomyopathy cohorts that had already been screened negative
    for the common myofilament genes. The denominators are informative even though
    the numerator is not: one novel VCL missense variant in 228 genotype-negative
    probands, and three non-synonymous exon-19 variants across four patients among
    389 clinically diagnosed probands, of which one (R975W) was carried forward as
    causal. A separate Z-disc series from the same centre found VCL variants in 2
    of 239 myofilament-negative probands; whether those are the same two probands
    is not stated, and the cohorts overlap.
  evidence:
  - reference: CGGV:assertion_27365fd2-1203-4e2b-8830-3277e965d8bc-2023-05-10T160000.000Z
    reference_title: VCL / hypertrophic cardiomyopathy (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although variants in this gene have been reported in only two probands with
      hypertrophic cardiomyopathy, an association with dilated cardiomyopathy
      (DCM) has been assessed separately with a higher number or reported
      probands.
    explanation: >-
      ClinGen's own count of the published hypertrophic cardiomyopathy case base
      for VCL, which is what fixes this entity at the case-report tier.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CMH15 is catalogued as an autosomal dominant trait, and ClinGen curated the
    VCL-hypertrophic cardiomyopathy relationship under an autosomal dominant mode
    of inheritance. The assignment rests on the catalogue classification and on
    the dominant pattern established for VCL in dilated cardiomyopathy rather
    than on segregation in hypertrophic cardiomyopathy families: both reported
    probands were ascertained as isolated cases from screening cohorts, and no
    multi-generation hypertrophic cardiomyopathy pedigree segregating a VCL
    variant has been published.
  evidence:
  - reference: CGGV:assertion_27365fd2-1203-4e2b-8830-3277e965d8bc-2023-05-10T160000.000Z
    reference_title: VCL / hypertrophic cardiomyopathy (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| VCL | HGNC:12665 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Disputed | SOP9 | Hereditary Cardiovascular Disease Gene Curation Expert Panel | 2023-05-10T16:00:00.000Z |"
    explanation: >-
      Records the mode of inheritance under which the relationship was curated
      (AD) together with the Disputed classification, which is why the inheritance
      claim is catalogue-derived rather than pedigree-derived.
genetic:
- name: VCL
  presence: PRESENT
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  gene_term:
    preferred_term: VCL
    term:
      id: hgnc:12665
      label: VCL
  notes: >-
    VCL encodes vinculin and, through inclusion of the alternatively spliced exon
    19, the muscle-restricted isoform metavinculin. Two classes of variant have
    been attributed to hypertrophic cardiomyopathy, in different parts of the
    protein: p.Leu277Met in a region shared by both isoforms, and exon-19
    substitutions (p.Ala934Val, p.Pro943Ala, p.Arg975Trp) falling inside the
    68-residue metavinculin-specific insert. p.Arg975Trp is the best characterized
    and had already been reported in dilated cardiomyopathy, so one substitution
    has been assigned to both remodelling directions.

    relationship_type is DISPUTED, the enum value corresponding to ClinGen
    "Disputed" or "Refuted". CAUSATIVE would be wrong: it is defined as ClinGen
    Definitive or Strong, and a prose caveat under a CAUSATIVE value would not
    survive export, query, or any consumer that reads the structured field rather
    than this note. MONDO and OMIM do assert the entity; that assertion is carried
    by the entry existing and by disease_term, not by overstating this slot.
    ClinGen classifies VCL-hypertrophic cardiomyopathy as Disputed (Hereditary
    Cardiovascular Disease GCEP, 2023-05-10, changed from Limited) while rating
    VCL-dilated cardiomyopathy Strong (Dilated Cardiomyopathy GCEP, 2024-08-09).
    A VCL variant found in a cardiomyopathy proband is therefore interpretable for
    dilated cardiomyopathy and not for hypertrophic cardiomyopathy. See the REFUTE
    evidence below and the discussions section; do not cite this block as support
    for clinical reporting of a VCL variant in a hypertrophic cardiomyopathy case.
  evidence:
  - reference: PMID:16712796
    reference_title: A missense mutation in a ubiquitously expressed protein, vinculin, confers susceptibility to hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel missense mutation, L277M-VCL, involving a conserved residue was
      identified in a patient with severely obstructive, mid-ventricular
      hypertrophy. This mutation was not detected in 400 reference alleles.
    explanation: >-
      The primary report of the vinculin variant on which the entity's non-insert
      arm rests, with its contemporaneous control-allele screen.
  - reference: PMID:16236538
    reference_title: Identification of a metavinculin missense mutation, R975W, associated with both hypertrophic and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 3 non-synonymous single nucleotide polymorphisms (A934V, P943A, and
      R975W) were detected in 4 patients. One patient with severely obstructive,
      mid-ventricular and apical hypertrophy harbored the previously published
      DCM-associated mutation, R975W.
    explanation: >-
      Names the exon-19 variants found in the hypertrophic cohort and identifies
      the single proband whose variant was carried forward as causal.
  - reference: PMID:16236538
    reference_title: Identification of a metavinculin missense mutation, R975W, associated with both hypertrophic and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, this study demonstrates that the same fundamental mutation in
      humans can yield either cardiomyopathic phenotype, underscoring a critical
      role for modifier genes and/or environmental stressors in cardiac
      remodeling.
    explanation: >-
      States the allelism directly: one VCL substitution has been reported with
      both hypertrophic and dilated remodelling, so genotype alone does not
      specify which entity results.
  - reference: CGGV:assertion_2d46699a-5f8c-460d-9233-bec4e2ecf560-2024-08-09T160000.000Z
    reference_title: VCL / dilated cardiomyopathy (Strong)
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: "VCL | HGNC:12665 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong"
    explanation: >-
      NO_EVIDENCE because this record is about a different disease. It establishes
      the contrasting, well-supported VCL cardiac association against which this
      entity's disputed status should be read, and bears on this entry's claim only
      by contrast; it is not evidence that VCL causes hypertrophic cardiomyopathy.
  - reference: CGGV:assertion_27365fd2-1203-4e2b-8830-3277e965d8bc-2023-05-10T160000.000Z
    reference_title: VCL / hypertrophic cardiomyopathy (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Two missense variants from these initial publications have been reported in
      humans, but the frequency in gnomAD is above the cutoff for pathogenicity in
      this GCEP.
    explanation: >-
      Contradicts the causal claim directly: population frequency of the two
      reported variants is incompatible with them causing a rare dominant
      cardiomyopathy. This is the specific finding that moved the classification
      to Disputed.
  - reference: CGGV:assertion_27365fd2-1203-4e2b-8830-3277e965d8bc-2023-05-10T160000.000Z
    reference_title: VCL / hypertrophic cardiomyopathy (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      In summary, the evidence supporting the relationship between VCL and
      autosomal dominant hypertrophic cardiomyopathy has been disputed and no
      valid evidence remains to support the claim.
    explanation: >-
      The expert panel's summary verdict on the gene-disease relationship that
      defines this entity.
pathophysiology:
- name: VCL Missense Variant in Vinculin or the Metavinculin Insert
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proposed initiating lesion is a heterozygous germline missense
    substitution in VCL. Two locations have been implicated and they are not
    equivalent. p.Leu277Met lies in a region present in both vinculin and
    metavinculin, so it would perturb the ubiquitous protein as well as the
    cardiac isoform. p.Ala934Val, p.Pro943Ala and p.Arg975Trp lie inside the
    68-residue insert encoded by exon 19, which is present only in metavinculin,
    so their effect is restricted to cardiac and smooth muscle. Whether either
    class is pathogenic in hypertrophic cardiomyopathy is disputed, which is why
    this node and everything downstream of it are marked HYPOTHETICAL.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: MISSENSE
    functional_impact_category: GAIN_OF_FUNCTION
    notes: >-
      GAIN_OF_FUNCTION follows ClinGen's reading of the biochemical data: the
      mutant metavinculin tails do not simply lose their inhibitory function, they
      acquire the ability to drive formation of large disordered actin assemblies
      that neither wild-type isoform produces. Note that this is the mechanism
      proposed for the exon-19 insert variants; no functional characterization of
      p.Leu277Met has been published, so the category is extrapolated to that
      allele rather than measured for it.
  genes:
  - preferred_term: VCL
    term:
      id: hgnc:12665
      label: VCL
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Loss of Metavinculin Restraint on Vinculin-Mediated Actin Bundling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30844403
      reference_title: Cardiomyopathy Mutations in Metavinculin Disrupt Regulation of Vinculin-Induced F-Actin Assemblies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Sub-domain formation is destabilized by CM mutations, disrupting this
        inhibitory mechanism.
      explanation: >-
        States the causal step from the variant to loss of the inhibitory
        mechanism, which is the edge drawn here.
  evidence:
  - reference: CGGV:assertion_27365fd2-1203-4e2b-8830-3277e965d8bc-2023-05-10T160000.000Z
    reference_title: VCL / hypertrophic cardiomyopathy (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism for disease is believed to be gain-of-function, with mutants
      both failing to induce F-actin binding and promoting formation of large
      actin assemblies with linear bundles (PMID: 30844403).
    explanation: >-
      Records the proposed mechanism class for this node, and the hedge
      ("believed to be") that justifies the HYPOTHETICAL confidence.
- name: Loss of Metavinculin Restraint on Vinculin-Mediated Actin Bundling
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In the normal heart the two VCL isoforms are co-expressed at
    sub-stoichiometric ratio and do opposite things to actin. The vinculin tail
    binds F-actin and dimerizes to bundle filaments into thick fibers; the
    metavinculin tail binds F-actin the same way but cannot bundle it, severs
    filaments instead, and inhibits vinculin-mediated bundling. That inhibition
    requires a protruding sub-domain formed by the 68-residue insert, which
    sterically blocks vinculin tail dimerization. The cardiomyopathy variants
    destabilize the sub-domain, so the brake is released and mutant metavinculin
    no longer restrains vinculin.
  molecular_functions:
  - preferred_term: metavinculin-mediated actin filament severing
    term:
      id: GO:0003789
      label: actin filament severing activity
  biological_processes:
  - preferred_term: vinculin-mediated actin filament bundling
    term:
      id: GO:0051017
      label: actin filament bundle assembly
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Disordered F-Actin Assembly at the Membrane Anchor
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30844403
      reference_title: Cardiomyopathy Mutations in Metavinculin Disrupt Regulation of Vinculin-Induced F-Actin Assemblies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These CM mutants were found to weakly induce the formation of disordered
        F-actin assemblies. Notably, they fail to inhibit Vt-mediated F-actin
        bundling and instead promote formation of large assemblies embedded with
        linear bundles.
      explanation: >-
        Directly links the loss of inhibition to the disordered assemblies that
        the downstream node names.
  evidence:
  - reference: PMID:30844403
    reference_title: Cardiomyopathy Mutations in Metavinculin Disrupt Regulation of Vinculin-Induced F-Actin Assemblies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While MVt binds to F-actin in a similar manner to Vt, MVt is incapable of
      F-actin bundling and inhibits Vt-mediated F-actin bundling.
    explanation: >-
      Establishes the wild-type inhibitory relationship between the two isoform
      tails, which is what the variants disrupt.
  - reference: PMID:30844403
    reference_title: Cardiomyopathy Mutations in Metavinculin Disrupt Regulation of Vinculin-Induced F-Actin Assemblies.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Computational models of MVt bound to F-actin suggest that MVt undergoes a
      conformational change licensing the formation of a protruding sub-domain
      incorporating the insert, which sterically prevents dimerization and
      bundling of F-actin by Vt.
    explanation: >-
      Supplies the structural mechanism for the inhibition, and is graded
      COMPUTATIONAL because it is a modelling result rather than a measurement.
  - reference: PMID:22613835
    reference_title: The C-terminal tail domain of metavinculin, vinculin's splice variant, severs actin filaments.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unlike its splice variant, MVt did not bundle actin filaments. Instead, MVt
      promoted severing of actin filaments, most efficiently at substoichiometric
      concentrations.
    explanation: >-
      Independent demonstration of the severing activity that distinguishes the
      metavinculin tail from the vinculin tail.
  - reference: PMID:3129429
    reference_title: Diversity of vinculin/meta-vinculin in human tissues and cultivated cells. Expression of muscle specific variants of vinculin in human aorta smooth muscle cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      gamma-Isoform of vinculin and both alpha- and beta-isoforms of meta-vinculin
      were found in smooth (aorta wall and myometrium) and cardiac muscle, rather
      than in skeletal muscle, liver, foreskin fibroblasts, and macrophages.
    explanation: >-
      Establishes that metavinculin expression is restricted to cardiac and smooth
      muscle, which is why a variant confined to the metavinculin insert can yield
      a cardiac-specific phenotype from a ubiquitously transcribed gene.
- name: Disordered F-Actin Assembly at the Membrane Anchor
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    With the inhibitory brake released, the mutant tails produce large actin
    assemblies embedded with linear bundles rather than the regular bundled
    architecture vinculin normally builds. The actin network that couples the
    contractile apparatus to the membrane is therefore built wrongly, not merely
    built less.
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: ABNORMAL
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Disrupted Intercalated Disc and Costamere Anchorage
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30844403
    reference_title: Cardiomyopathy Mutations in Metavinculin Disrupt Regulation of Vinculin-Induced F-Actin Assemblies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings provide new mechanistic insights into the ability of
      metavinculin to tune actin organization by vinculin and suggest that
      dysregulation of this process by CM mutants could underlie their malfunction
      in disease.
    explanation: >-
      The authors' own statement of what the disordered assemblies are proposed to
      mean for disease, with the hedge preserved.
- name: Disrupted Intercalated Disc and Costamere Anchorage
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Vinculin and metavinculin are structural components of the junctions where
    cardiomyocyte actin is anchored: the intercalated disc, which couples adjacent
    myocytes end to end, and the costamere, which couples the myofibril laterally
    to the sarcolemma and extracellular matrix. Myectomy tissue from both reported
    probands showed vinculin and metavinculin markedly reduced at the intercalated
    disc with normal Z-disc staining, and the earlier metavinculin work had shown
    altered intercalated-disc organization in vivo. The specificity of that
    finding is the weak point of the chain rather than its existence; see the
    REFUTE evidence on this node.
  biological_processes:
  - preferred_term: adherens junction organization
    term:
      id: GO:0034332
      label: adherens junction organization
    modifier: ABNORMAL
  - preferred_term: cell-matrix adhesion
    term:
      id: GO:0007160
      label: cell-matrix adhesion
    modifier: ABNORMAL
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Impaired Cardiomyocyte Force Transmission
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16712796
    reference_title: A missense mutation in a ubiquitously expressed protein, vinculin, confers susceptibility to hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical analysis of the proband's myectomy specimen demonstrated
      markedly reduced vinculin levels in the intercalated discs.
    explanation: >-
      The human tissue observation in the vinculin proband on which this node
      rests.
  - reference: PMID:16236538
    reference_title: Identification of a metavinculin missense mutation, R975W, associated with both hypertrophic and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical analysis of the proband's myectomy specimen revealed a
      paucity of vinculin/metavinculin in the intercalated discs.
    explanation: >-
      The matching observation in the metavinculin proband, from a different
      variant class.
  - reference: PMID:16949038
    reference_title: Obstructive hypertrophic cardiomyopathy is associated with reduced expression of vinculin in the intercalated disc.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tissue specimens derived from patients with obstructive HCM and aortic
      stenosis (AS) showed a universal defect of vinculin/metavinculin expression
      in the intercalated disc but preserved expression in the cardiac Z-disc
    explanation: >-
      Refutes the inference that intercalated-disc vinculin depletion is caused by
      the VCL variant. The same pattern occurs in obstructive hypertrophic
      cardiomyopathy without a VCL variant and in aortic stenosis, so it tracks
      outflow obstruction and cannot corroborate a VCL-specific lesion.
- name: Impaired Cardiomyocyte Force Transmission
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Consequence of a mis-built actin-membrane anchor: contractile force generated
    by the sarcomere is transmitted less efficiently to neighbouring myocytes and
    to the extracellular matrix. That vinculin loss impairs myocyte mechanics is
    measured rather than assumed - vinculin-deficient mouse myocytes have reduced
    membrane cortical stiffness, wider myofilament lattice spacing and reduced
    systolic transverse strain in vivo, all before global ventricular dysfunction
    appears. What is not measured is the same for a CMH15 allele: those
    experiments use vinculin deletion, whereas the human variants proposed here
    are missense changes acting by gain of function, so the mechanical consequence
    is transferred across allele classes. The node is marked HYPOTHETICAL for that
    reason rather than for lack of any evidence.
  biological_processes:
  - preferred_term: cardiac muscle contraction
    term:
      id: GO:0060048
      label: cardiac muscle contraction
    modifier: ABNORMAL
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Maladaptive Left Ventricular Hypertrophy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23561539
    reference_title: Novel role for vinculin in ventricular myocyte mechanics and dysfunction.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MRI revealed significantly decreased systolic strains transverse to the
      myofiber axis in vivo, but no changes along the muscle fibers or in fiber
      tension in papillary muscles from heterozygous global Vcl null mice.
    explanation: >-
      Measures a mechanical deficit attributable to reduced vinculin, and locates
      it transverse to the fibre axis rather than in fibre tension. INDIRECT
      because the allele is a null, not a CMH15 missense variant.
  - reference: PMID:23561539
    reference_title: Novel role for vinculin in ventricular myocyte mechanics and dysfunction.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      AFM in Vcl heterozygous null mouse myocytes showed a significant decrease in
      membrane cortical stiffness.
    explanation: >-
      Gives the cell-mechanical correlate of losing the actin-membrane anchor,
      which is the property this node claims is degraded.
  - reference: PMID:37548861
    reference_title: Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vinculin links the actin cytoskeleton to the cell membrane which is critical
      in force transmission and is needed to maintain cardiomyocyte function
    explanation: >-
      States the force-transmission role this node depends on. INDIRECT: it is a
      background statement in a dilated cardiomyopathy case series, not a
      measurement in hypertrophic disease.
- name: Maladaptive Left Ventricular Hypertrophy
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The tissue-level endpoint: left ventricular hypertrophy which in the two
    reported probands was severely obstructive and mid-ventricular or apical in
    distribution. A separate series from the same centre found that hypertrophic
    cardiomyopathy attributable to Z-disc genes, VCL among them, carries a
    sigmoidal septal contour in most cases, in contrast to the reverse-curvature
    morphology typical of myofilament disease.
  downstream:
  - target: Dynamic Outflow Obstruction
    causal_link_type: DIRECT
  - target: Hypertrophic cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      The tissue lesion presenting as the clinical entity both probands were
      diagnosed with.
  - target: Apical hypertrophy
    causal_link_type: DIRECT
    description: >-
      Apical distribution of the hypertrophy, reported in the metavinculin proband.
  evidence:
  - reference: PMID:17097056
    reference_title: Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen of the 239 patients (5.4%) had one of 13 distinct HCM-associated
      Z-disc mutations involving residues highly conserved across species and
      absent in 600 reference alleles: LDB3 (6), ACTN2 (3), TCAP (1), CSRP3 (1),
      and VCL (2).
    explanation: >-
      Places VCL within the Z-disc class of hypertrophic cardiomyopathy and gives
      its share of that class in a myofilament-negative cohort.
  - reference: PMID:17097056
    reference_title: Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For this subset with Z-disc-associated HCM, the septal contour was sigmoidal
      in 11 (85%) and apical in 2 (15%). While Z-disc-HCM is uncommon, it is equal
      in prevalence to thin filament-HCM. In contrast to myofilament-HCM, Z-disc-HCM
      is associated preferentially with sigmoidal morphology.
    explanation: >-
      Characterizes the hypertrophy morphology of the Z-disc class as a whole.
      INDIRECT because the figures are for all thirteen Z-disc probands, of whom
      only two carried VCL variants, so the morphology is not resolved to VCL.
- name: Dynamic Outflow Obstruction
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Both reported probands had severely obstructive hypertrophy, mid-ventricular
    in one and mid-ventricular plus apical in the other. Obstruction is the point
    at which this chain rejoins ordinary hypertrophic cardiomyopathy physiology,
    and also the point at which the entity's key confound arises, since
    obstruction itself depletes intercalated-disc vinculin. Named for the
    haemodynamic mechanism rather than the finding, so that it stays distinct from
    the clinical phenotype of the same name: the pathograph matches target strings
    verbatim, and two nodes differing only in capitalization would render as two
    nodes for one concept.
  downstream:
  - target: Left ventricular outflow tract obstruction
    causal_link_type: DIRECT
    description: >-
      The clinical finding this mechanism presents as.
  - target: Disrupted Intercalated Disc and Costamere Anchorage
    causal_link_type: DIRECT
    description: >-
      Feedback edge. Obstruction reduces intercalated-disc vinculin and
      metavinculin independently of genotype, which is the alternative explanation
      for the probands' histology.
    evidence:
    - reference: PMID:16949038
      reference_title: Obstructive hypertrophic cardiomyopathy is associated with reduced expression of vinculin in the intercalated disc.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        obstructive disease substantially reduces the expression of vinculin
        preferentially in the intercalated disc.
      explanation: >-
        Supports drawing obstruction as a cause of the anchorage abnormality, which
        is the reverse of the direction the original reports assumed.
  evidence:
  - reference: PMID:16236538
    reference_title: Identification of a metavinculin missense mutation, R975W, associated with both hypertrophic and dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient with severely obstructive, mid-ventricular and apical hypertrophy
      harbored the previously published DCM-associated mutation, R975W.
    explanation: >-
      Documents obstruction and its distribution in the metavinculin proband.

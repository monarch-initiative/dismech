name: Hypertrophic Cardiomyopathy 15
creation_date: "2026-09-08T00:00:00Z"
synonyms:
- CMH15
- cardiomyopathy, familial hypertrophic, 15
- VCL-related hypertrophic cardiomyopathy
- metavinculin hypertrophic cardiomyopathy
description: >-
  Hypertrophic cardiomyopathy 15 (CMH15) is the VCL-attributed form of familial
  hypertrophic cardiomyopathy. VCL encodes two proteins from one gene: vinculin,
  expressed ubiquitously, and metavinculin, a splice isoform carrying a
  68-residue insert in the C-terminal tail encoded by exon 19 and restricted to
  cardiac and smooth muscle. Both localize to the sites where the actin
  cytoskeleton is anchored to the membrane, so the proposed lesion is one of
  force transmission and cytoskeletal anchorage rather than of the contractile
  apparatus itself. The vinculin tail binds F-actin and dimerizes to bundle
  filaments into thick fibers; the metavinculin tail binds F-actin but cannot
  bundle it, severs filaments instead, and inhibits vinculin-mediated bundling,
  so metavinculin acts as a tuner of vinculin's actin-organizing activity. The
  cardiomyopathy-associated insert variants destabilize the conformational
  sub-domain that mediates that inhibition: they neither bundle normally nor
  restrain vinculin, and instead promote large, disordered actin assemblies.
  Myectomy tissue from the two reported probands showed vinculin and
  metavinculin markedly reduced at the intercalated disc with preserved Z-disc
  staining, and both had severely obstructive mid-ventricular hypertrophy, with
  apical involvement in one of the two.

  The gene-disease relationship is disputed, and this entry is curated on that
  footing rather than as an established cause. ClinGen's Hereditary
  Cardiovascular Disease Gene Curation Expert Panel reclassified VCL-hypertrophic
  cardiomyopathy from Limited to Disputed in May 2023: only two probands were
  ever reported, both in 2006 from one group, and the two missense variants
  carried by them are more common in gnomAD than the panel's pathogenicity
  cutoff allows. The intercalated-disc depletion seen in those probands was
  subsequently found in obstructive hypertrophic cardiomyopathy and aortic
  stenosis generally, so it tracks outflow obstruction rather than VCL genotype
  and cannot serve as VCL-specific corroboration. VCL's well-supported cardiac
  association is with dilated cardiomyopathy, which ClinGen rates Strong, and the
  best-characterized variant, p.Arg975Trp, has been reported in both hypertrophic
  and dilated presentations. CMH15 should therefore be read as a molecularly
  plausible but clinically unconfirmed entity: the metavinculin biochemistry is
  solid, the human genetic evidence that it causes hypertrophic cardiomyopathy is
  not.
category: Mendelian

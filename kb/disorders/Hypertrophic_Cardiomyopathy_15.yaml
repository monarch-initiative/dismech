- category: Cardiovascular
  name: Sigmoidal septal contour
  phenotype_term:
    preferred_term: Left ventricular hypertrophy with sigmoidal septal contour
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
  description: >-
    Hypertrophic cardiomyopathy attributed to Z-disc genes, VCL among them, was
    preferentially sigmoidal in septal contour rather than showing the reverse
    curvature typical of myofilament disease. The finding is a property of the
    Z-disc class in that series and is not resolved to the two VCL probands within
    it, so it is recorded here as class-level context.

    It should be read against the primary reports rather than instead of them, and
    the two do not agree. That series graded 11 of 13 Z-disc probands sigmoidal and
    2 apical, while both VCL probands are described in their own reports as
    mid-ventricular, one with apical involvement. Same group, overlapping Mayo
    cohorts, so the two apical cases in the pooled series may well be the two VCL
    cases - in which case the sigmoidal majority is carried by the other four genes
    and does not describe VCL at all. Neither paper resolves this, and it is not
    resolvable from the published data.

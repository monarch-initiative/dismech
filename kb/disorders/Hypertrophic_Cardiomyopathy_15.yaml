histopathology:
- name: Reduced vinculin and metavinculin at the intercalated disc with preserved Z-disc staining
  description: >-
    Immunohistochemistry on the surgical myectomy specimens from both probands
    showed vinculin and metavinculin markedly reduced at the intercalated disc
    while Z-disc staining was normal. The compartment specificity is the
    informative part of the finding. Its attribution is not: the same pattern was
    subsequently found in obstructive hypertrophic cardiomyopathy without a VCL
    variant and in aortic stenosis, and was absent in dilated, hypertensive and
    pulmonary-hypertensive hearts, so it segregates with outflow obstruction and
    not with genotype.
  evidence:
  - reference: PMID:16949038
    reference_title: Obstructive hypertrophic cardiomyopathy is associated with reduced expression of vinculin in the intercalated disc.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microscopic examination of both myectomy specimens from patients bearing
      genetic defects in metavinculin and vinculin showed a marked reduction of
      vinculin/metavinculin expression in the intercalated disc, but normal
      expression in the Z-disc.
    explanation: >-
      The finding itself, stated for both probands together with its compartment
      specificity.
  - reference: PMID:16949038
    reference_title: Obstructive hypertrophic cardiomyopathy is associated with reduced expression of vinculin in the intercalated disc.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tissue specimens derived from patients with obstructive HCM and aortic
      stenosis (AS) showed a universal defect of vinculin/metavinculin expression
      in the intercalated disc but preserved expression in the cardiac Z-disc
    explanation: >-
      Refutes reading the finding as a marker of the VCL lesion. The identical
      pattern is universal in obstructive hypertrophic cardiomyopathy without a VCL
      variant, and in aortic stenosis, so it cannot corroborate a VCL-specific
      mechanism.
  - reference: PMID:16949038
    reference_title: Obstructive hypertrophic cardiomyopathy is associated with reduced expression of vinculin in the intercalated disc.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whereas tissue specimens derived from patients with either DCM, hypertensive
      heart disease (HTN), or pulmonary hypertension (PHTN) exhibited normal
      expression of vinculin/metavinculin in both the Z- and the intercalated disc
      despite being associated with hypertrophy.
    explanation: >-
      Supports the narrower claim that the finding is real and specific to a
      compartment and an aetiology: it is absent in dilated, hypertensive and
      pulmonary-hypertensive hearts, so it is not a generic consequence of
      hypertrophy. It is that same specificity to obstruction which makes it
      uninformative about genotype.
animal_models:
- name: Cardiomyocyte-specific vinculin knockout mouse (cVclKO)
  species: Mouse
  genotype: Vcl conditional null, cardiomyocyte-restricted Cre-loxP excision
  publication: PMID:17785437
  description: >-
    Cre-loxP deletion of Vcl in cardiomyocytes. Half the animals died suddenly
    before three months from ventricular tachycardia with preserved contractile
    function; survivors developed dilated cardiomyopathy and died before six
    months. Ultrastructure before dysfunction showed dissolution of the
    intercalated disc, reduced cadherin and beta-1D integrin, and connexin-43
    mislocalized to the lateral border.
  evidence:
  - reference: PMID:17785437
    reference_title: Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This is the first report of tissue-specific inactivation of the Vcl gene and
      shows that it is required for preservation of normal cell-cell and cell-matrix
      adhesive structures.
    explanation: >-
      Supports treating this model as informative for cardiomyocyte junctional
      biology, which is the ground on which it is linked to this entry's anchorage
      node.
  modeled_mechanisms:
  - target: Disrupted Intercalated Disc and Costamere Anchorage
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Establishes in vivo that removing cardiomyocyte vinculin dismantles exactly
      the junctions this node names, and that it does so before any contractile
      phenotype appears.
    limitations: >-
      A complete tissue-specific null, not a missense allele: it models absence of
      vinculin, whereas the CMH15 variants are proposed to act by gain of function
      through mutant metavinculin. Mouse hearts also express less metavinculin
      relative to vinculin than human hearts do, so an insert-specific effect is
      under-represented in this system.
    evidence:
    - reference: PMID:17785437
      reference_title: Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        ultrastructural analysis of cVclKO heart tissue showed abnormal adherens
        junctions with dissolution of the intercalated disc structure, expression
        of the junctional proteins cadherin and beta1D integrin were reduced, and
        the gap junction protein connexin 43 was mislocalized to the lateral
        myocyte border
      explanation: >-
        The junctional lesion this link claims the model reproduces, observed
        directly.
  - target: Maladaptive Left Ventricular Hypertrophy
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The most informative negative result for this entity. Losing cardiomyocyte
      vinculin in vivo produces arrhythmic sudden death and then a dilated
      ventricle. It does not produce hypertrophy.
    limitations: >-
      The failure is not decisive against a hypertrophic mechanism, because the
      allele is wrong for the question: a null cannot test a gain-of-function
      missense hypothesis, and the opposite remodelling direction is what
      loss-of-function VCL alleles produce in humans too. The result constrains
      what can be inferred from vinculin-deficiency models about hypertrophy, and
      no CMH15 knock-in mouse exists to answer the question properly.
    evidence:
    - reference: PMID:17785437
      reference_title: Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cVclKO mice that survived through the vulnerable period of sudden death
        developed dilated cardiomyopathy and died before 6 months of age.
      explanation: >-
        The model's cardiac endpoint is dilation, not hypertrophy, so it does not
        reproduce the phenotype this entity is defined by.
- name: Heterozygous vinculin knockout mouse (Vin+/-)
  species: Mouse
  genotype: Vcl heterozygous null
  publication: PMID:15331426
  description: >-
    Global heterozygous Vcl inactivation, giving roughly 58% less vinculin and 63%
    less metavinculin. These animals are grossly normal with normal baseline
    cardiac function, but carry abnormal electrocardiograms, abnormal intercalated
    discs, misaligned Z-lines, and decompensate when pressure-loaded by transverse
    aortic constriction.
  evidence:
  - reference: PMID:15331426
    reference_title: Heterozygous inactivation of the vinculin gene predisposes to stress-induced cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Decreased expression of vinculin/metavinculin leads to abnormal myocyte
      structure without baseline physiological evidence of cardiac dysfunction.
      These structural changes predispose to stress-induced cardiomyopathy.
    explanation: >-
      Supports treating this model as informative for the structural consequences of
      reduced vinculin and metavinculin dosage, which is why it is linked here.
  modeled_mechanisms:
  - target: Disrupted Intercalated Disc and Costamere Anchorage
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows that a partial reduction in vinculin and metavinculin, closer in degree
      to a heterozygous human genotype than a complete null, is already enough to
      disorganize the intercalated disc and the Z-line register.
    limitations: >-
      Reduced dosage of normal protein, whereas the CMH15 hypothesis is that mutant
      metavinculin is actively mis-functional; a 58% reduction does not test that.
      The phenotype is also latent until haemodynamic stress is applied.
    evidence:
    - reference: PMID:15331426
      reference_title: Heterozygous inactivation of the vinculin gene predisposes to stress-induced cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        normal basal cardiac function and histology but abnormal electrocardiograms,
        intercalated disks, and ICD-related protein distribution
      explanation: >-
        Junctional disorganization at partial vinculin dosage, with function still
        normal, which is the node's claim.
  - target: Impaired Cardiomyocyte Force Transmission
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Vin+/- hearts tolerate normal load but fail under acute pressure overload,
      which is the behaviour expected of a myocardium whose force-transmission
      apparatus has reduced reserve rather than reduced resting output.
    limitations: >-
      The readout is organ-level decompensation after aortic constriction, not a
      measurement of force transmission, so the mechanism is inferred from the
      stress response. PARTIALLY_RECAPITULATES because baseline function is normal:
      the model reproduces the vulnerability, not a resting deficit.
    evidence:
    - reference: PMID:15331426
      reference_title: Heterozygous inactivation of the vinculin gene predisposes to stress-induced cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        increased mortality following acute hemodynamic stress imposed by transverse
        aortic constriction (TAC); 4) cardiac dysfunction by 6 weeks post-TAC
      explanation: >-
        Documents the load-dependent failure that this link reads as reduced
        force-transmission reserve.
diagnosis:
- name: Clinical diagnosis of hypertrophic cardiomyopathy by echocardiography
  diagnosis_term:
    preferred_term: Echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    The diagnosis in both reported cases was a clinical one, made on imaging, with
    the VCL variant found afterwards by research sequencing of an already
    phenotyped cohort. Nothing about CMH15 changes how hypertrophic cardiomyopathy
    is recognized: wall thickness, the distribution of hypertrophy, and the
    presence and level of outflow obstruction are assessed exactly as in any other
    form. Where this entity does bear on imaging is in what to expect - both
    probands had severe obstruction at mid-ventricular level, one with apical
    involvement, and the wider Z-disc series was preferentially sigmoidal in septal
    contour rather than reverse-curvature.
  results: >-
    Left ventricular hypertrophy with severe outflow obstruction, mid-ventricular
    and in one case apical; sigmoidal septal contour reported for the Z-disc class
    that includes VCL.
  evidence:
  - reference: PMID:17097056
    reference_title: Echocardiographic-determined septal morphology in Z-disc hypertrophic cardiomyopathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blinded to the Z-disc genotype status, the septal contour was graded
      qualitatively using standard transthoracic echocardiography.
    explanation: >-
      Establishes the modality and the blinded grading behind the morphology claim.
      INDIRECT because the two VCL probands are pooled with eleven others.
- name: Genetic testing, and why VCL should not be reported for hypertrophic cardiomyopathy
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    This is the practically important entry on the whole record. VCL appears on
    many commercial cardiomyopathy panels, so a rare VCL missense variant will be
    found in hypertrophic cardiomyopathy probands and can be reported against
    OMIM's CMH15 entry. ClinGen's expert panel has classified that relationship as
    Disputed, having found that the two originally reported variants exceed the
    panel's gnomAD frequency ceiling for pathogenicity and that no new evidence has
    emerged since ClinGen's initial curation. A VCL variant is therefore not a molecular
    diagnosis of hypertrophic cardiomyopathy, must not be used for predictive
    testing or cascade screening in a hypertrophic family, and should not end the
    diagnostic search. The same variant found in a dilated presentation is a
    different matter, since ClinGen rates VCL-dilated cardiomyopathy Strong.
  results: >-
    A VCL variant in a hypertrophic cardiomyopathy proband is uninformative and
    should be treated as such; the finding does not establish a molecular
    diagnosis or support cascade testing.
  evidence:
  - reference: CGGV:assertion_27365fd2-1203-4e2b-8830-3277e965d8bc-2023-05-10T160000.000Z
    reference_title: VCL / hypertrophic cardiomyopathy (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This gene was noted to be a potential rare cause of HCM; however, no new
      evidence has emerged since the initial curation.
    explanation: >-
      The state of the evidence base, which is what makes a VCL finding
      uninterpretable in this setting.
  - reference: PMID:30681346
    reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of genes previously reported as causative of HCM and commonly
      included in diagnostic tests have limited or no evidence of disease
      association.
    explanation: >-
      Sets the general problem this entry is an instance of. INDIRECT because the
      abstract states the aggregate result without naming VCL; the gene-specific
      verdict is carried by the ClinGen record cited alongside it.
  - reference: PMID:30681346
    reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 4191 HCM variants in ClinVar, 31% were in genes with limited or no
      evidence of disease association.
    explanation: >-
      Quantifies how often variants in genes of this evidential class reach a
      public variant database, which is the reporting risk this entry warns about.
treatments:
- name: Septal myectomy for obstructive disease
  description: >-
    Both reported probands underwent surgical septal myectomy, which is how the
    tissue examined in the original studies was obtained. Management of CMH15 is
    the management of obstructive hypertrophic cardiomyopathy and is not
    genotype-directed: no VCL-specific therapy exists, none is in development, and
    the disputed status of the gene-disease relationship means the genotype should
    not influence treatment decisions at all.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: septal myectomy
    term:
      id: NCIT:C51591
      label: Myectomy
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  target_mechanisms:
  - target: Dynamic Outflow Obstruction
    description: >-
      Relieves the obstruction node directly by resecting the hypertrophied septum.
      It does not address anything upstream of it.
  evidence:
  - reference: PMID:16949038
    reference_title: Obstructive hypertrophic cardiomyopathy is associated with reduced expression of vinculin in the intercalated disc.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microscopic examination of both myectomy specimens from patients bearing
      genetic defects in metavinculin and vinculin showed a marked reduction of
      vinculin/metavinculin expression in the intercalated disc, but normal
      expression in the Z-disc.
    explanation: >-
      Records that both probands came to surgical myectomy - the tissue examined in
      that study is the myectomy specimen - which is the only treatment documented
      for either of them.
  notes: >-
    Sourced from the fact that both probands underwent the procedure, not from a
    trial or guideline recommendation for this entity, of which there are none.
    Indications, alternatives (alcohol septal ablation), and the medical therapy
    that precedes septal reduction are those of obstructive hypertrophic
    cardiomyopathy generally and are curated on the parent entry.
discussions:
- discussion_id: cmh15_gene_disease_validity_disputed
  prompt: >-
    Does VCL cause hypertrophic cardiomyopathy at all, or is CMH15 an entity built
    on two 2006 case reports that later evidence has undercut?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#VCL
  - pathophysiology#VCL Missense Variant in Vinculin or the Metavinculin Insert
  - disease#Hypertrophic Cardiomyopathy 15
  rationale: >-
    This is the entity's central open question and the reason every node upstream
    of the hypertrophy is marked HYPOTHETICAL or PROVISIONAL. The supporting case
    is two probands, both from one centre in 2006, both ascertained by sequencing
    a candidate gene in a myofilament-negative cohort, neither with segregation
    data. Three things have since worked against it. The two implicated variants
    are commoner in gnomAD than a rare dominant cardiomyopathy allele can be. The
    corroborating histology - vinculin depleted at the intercalated disc - was
    shown by the same group to occur in obstructive hypertrophic cardiomyopathy
    without a VCL variant and in aortic stenosis, so it marks obstruction rather
    than genotype. And the one variant carried forward as causal, p.Arg975Trp, had
    already been reported in dilated cardiomyopathy, which is the phenotype VCL is
    actually well supported for. ClinGen moved the classification from Limited to
    Disputed in 2023 and recorded that no new evidence had emerged since its own
    initial curation. Note that "initial curation" there is a ClinGen curation
    event, not the 2006 publications - the panel records an intervening HCM GCEP
    recuration on 04/06/21.

    Note what is not in dispute: metavinculin biochemistry. That the insert
    variants destabilize the inhibitory sub-domain and produce disordered actin
    assemblies is measured, reproducible, and structurally rationalized. The gap is
    between that biochemistry and the human hypertrophic phenotype, not within it.
    A mechanism can be real and still not be this disease's mechanism.
  proposed_experiments:
  - experiment_id: cmh15_knockin_mouse
    name: Metavinculin insert knock-in mouse carrying a CMH15 allele
    description: >-
      Generate a knock-in mouse carrying p.Arg975Trp or an equivalent exon-19
      insert substitution at the endogenous Vcl locus, and phenotype it for wall
      thickness, outflow gradient, chamber dimensions and intercalated-disc
      ultrastructure, unstressed and after pressure loading. Every existing mouse
      model deletes vinculin, so none of them can test a gain-of-function missense
      hypothesis, and the two that exist both produce dilation rather than
      hypertrophy. Mouse hearts express proportionally less metavinculin than human
      hearts, so a negative result would need that caveat attached.
    decision_criterion: >-
      Hypertrophy with outflow obstruction in the knock-in would supply the in vivo
      support the relationship has never had. A dilated or absent cardiac phenotype
      would align the allele with the loss-of-function models and further weaken
      the hypertrophic attribution.
    would_support:
    - pathophysiology#VCL Missense Variant in Vinculin or the Metavinculin Insert
    would_refute:
    - pathophysiology#VCL Missense Variant in Vinculin or the Metavinculin Insert
  - experiment_id: cmh15_case_control_burden
    name: Rare-variant burden of VCL exon 19 in large hypertrophic cardiomyopathy cohorts
    description: >-
      Test whether rare metavinculin-insert variants are enriched in
      sarcomere-negative hypertrophic cardiomyopathy probands relative to
      ancestry-matched population controls, in the large sequenced cohorts that did
      not exist in 2006. This is the direct answer to ClinGen's stated objection,
      which is a frequency argument, and burden analysis is the design that
      distinguishes a genuinely rare pathogenic allele class from a gene that is
      merely long and polymorphic.
    decision_criterion: >-
      Significant case excess of rare exon-19 variants would move the relationship
      off Disputed. No excess would settle it as a non-cause.
    would_refute:
    - genetic#VCL
  evidence:
  - reference: CGGV:assertion_27365fd2-1203-4e2b-8830-3277e965d8bc-2023-05-10T160000.000Z
    reference_title: VCL / hypertrophic cardiomyopathy (Disputed)

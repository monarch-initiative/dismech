phenotypes:
- name: Progressive cerebellar ataxia
  category: Neurological
  description: >-
    The defining feature. Gait instability is usually the presenting problem
    alongside dysarthria, and progression is slow enough to be measured in
    decades. Life span is typically not shortened, which is unusual among the
    dominant ataxias and shapes what management is for. Graded VERY_FREQUENT
    rather than OBLIGATE: non-ataxic presentations of a confirmed SCA8 expansion
    are documented, including dopamine-responsive parkinsonism, an ALS-like
    picture and isolated hemichorea, so the feature is not universal among
    affected carriers.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301445
    reference_title: Spinocerebellar Ataxia Type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCA8 is a slowly progressive ataxia with onset typically in the third to
      fifth decade but with a range from before age one year to after age 60
      years.
    explanation: >-
      Establishes both the defining phenotype and the extreme width of its onset
      range.
  - reference: PMID:20301445
    reference_title: Spinocerebellar Ataxia Type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL

diagnosis:
- name: Repeat-sizing molecular genetic testing
  description: >-
    Diagnosis rests on identifying a heterozygous abnormal (CTG-CAG)n expansion
    in the overlapping ATXN8OS/ATXN8 genes, in a proband with suggestive
    findings. The qualifier matters: because penetrance is reduced, the expansion
    establishes the diagnosis in the presence of a compatible phenotype, not on
    its own.
  evidence:
  - reference: PMID:20301445
    reference_title: Spinocerebellar Ataxia Type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SCA8 is established in a proband with suggestive findings
      and a heterozygous abnormal (CTG·CAG)n repeat expansion in the two
      overlapping genes ATXN8OS/ATXN8 identified by molecular genetic testing.
    explanation: >-
      States the diagnostic criterion including the requirement for suggestive
      clinical findings alongside the expansion.
- name: Brain MRI
  description: >-
    Supports rather than establishes the diagnosis. The expected pattern is
    global cerebellar atrophy with a preserved brainstem, which helps separate
    SCA8 from the dominant ataxias that show pontine or supratentorial change.
  evidence:
  - reference: PMID:33733696
    reference_title: >-
      Conventional MRI findings in hereditary degenerative ataxias: a pictorial
      review.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mild spinal cord atrophy can sometimes be present

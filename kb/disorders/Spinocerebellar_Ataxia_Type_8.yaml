- name: Cerebellar Purkinje and Deep Nuclear Circuit Dysfunction
  description: >-
    The convergence point. Purkinje cells are the sole output of the cerebellar
    cortex, and their firing is degraded here from two directions at once: loss
    of granular-layer inhibition from the RNA arm, and intranuclear polyglutamine
    inclusions from the protein arm. Progressive loss of cerebellar output
    produces the ataxia, the scanning dysarthria and the oculomotor signs, and
    the cell loss is visible on MRI as global cerebellar atrophy sparing the
    brainstem.

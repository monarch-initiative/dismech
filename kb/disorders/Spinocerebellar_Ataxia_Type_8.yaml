discussions:
- discussion_id: sca8_reduced_penetrance_basis
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a carrier of an ATXN8OS/ATXN8 repeat expansion
    develops SCA8, given that repeat size predicts neither penetrance nor age at
    onset?
  rationale: >-
    Reduced penetrance is not a footnote in SCA8; it is the reason a positive
    genetic test does not settle a diagnosis, and the reason counselling cannot
    give a family a usable risk figure. Repeat length, the obvious candidate
    explanation, does not do the work here that it does in the polyglutamine
    SCAs. Somatic instability, interruptions within the repeat tract, and
    modifiers of RAN translation such as eIF3F are all plausible, but nothing
    reviewed for this entry identifies the determinant.
  attaches_to:
  - inheritance#Autosomal dominant with reduced penetrance
  - pathophysiology#Bidirectional Transcription of the ATXN8OS/ATXN8 CTG-CAG Expansion
- discussion_id: sca8_which_arm_drives_human_disease
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Which of the three toxic products of the SCA8 expansion, CUG RNA, the
    polyglutamine protein, or the RAN polyalanine and polyserine proteins,
    actually drives the human phenotype, and in what proportion?
  rationale: >-
    All three arms exist in human tissue, so this is not a case of a mechanism
    seen only in mice. But the causal weighting comes almost entirely from mouse
    and cell work: the Mbnl1 genetic interaction and the eIF3F knockdown are the
    two interventional results, and both are in model systems. In humans the
    evidence is co-localisation of aggregate with damage, which cannot separate
    cause from correlate. This is recorded as HUMAN_MODEL_MISMATCH rather than
    KNOWLEDGE_GAP because the evidence is not absent; it exists and is good, but
    its translational weight for the human disease is the open question.
  attaches_to:
  - mechanistic_hypotheses#rna_gain_of_function
  - mechanistic_hypotheses#polyglutamine_protein_toxicity
  - mechanistic_hypotheses#ran_translation_toxicity
notes: >-
  Curated from a Perplexity deep-research report, used as a lead only. That
  report did carry machine-readable validation, and reading it first was
  decisive: term validation reported 19 of 43 checked labels naming a different
  term than the report claimed, so none of its CURIEs were reused. Three of its
  errors would have been silently wrong here: HP:0001270 offered as Dysarthria is
  Motor delay (the correct term is HP:0001260), HP:0002067 offered as pyramidal
  signs is Bradykinesia, and both gene identifiers were wrong (ATXN8 given as
  HGNC:13813, actually hgnc:32925; ATXN8OS given as HGNC:10610, actually
  hgnc:10561). Only 8 of the report's 21 citations were resolvable identifiers at
  all, and 5 of those 8 were judged on topic; the rest were web pages. Every
  reference here was resolved to a PMID, fetched into references_cache, and
  quoted from the fetched text.
review_notes: >-
  The three mechanistic hypotheses are deliberately kept parallel rather than
  ranked into one chain. Merging them would assert a causal weighting that the
  literature does not support, and the discussions entry records that weighting
  as the open question. MBNL1 is listed under genetic as MODIFIER on
  model-organism evidence only and should not be read as a human modifier gene.

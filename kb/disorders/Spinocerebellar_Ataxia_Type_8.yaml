inheritance:
- name: Autosomal dominant with reduced penetrance
  description: >-
    Autosomal dominant, but with penetrance reduced enough that it changes how
    the genetic test is interpreted rather than merely qualifying it. A
    transmitting parent may have no clinical manifestations at all, and a sibling
    who inherits the expansion may or may not develop disease. This is the single
    biggest practical difference between SCA8 and the polyglutamine SCAs, and it
    is why an expansion found incidentally in an asymptomatic person without a
    family history may be reported as uncertain rather than pathogenic.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:20301445
    reference_title: Spinocerebellar Ataxia Type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCA8 is inherited in an autosomal dominant manner with reduced penetrance.
    explanation: >-

progression:
- phase: Onset
  notes: >-
    Onset is typically in the third to fifth decade, but the reported range runs
    from before age one to after 60. Unlike the polyglutamine SCAs, repeat size
    is a poor predictor of when disease begins, which is why counselling cannot
    convert a repeat length into an expected age of onset.
  evidence:
  - reference: PMID:20301445
    reference_title: Spinocerebellar Ataxia Type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCA8 is a slowly progressive ataxia with onset typically in the third to
      fifth decade but with a range from before age one year to after age 60
      years.
    explanation: >-
      Gives the typical onset window and the full reported range.
- phase: Progression
  notes: >-
    Slow progression over decades, independent of the age at onset, without
    significant shortening of life span. Disability accumulates through mobility
    and communication rather than through a fatal endpoint.
  evidence:
  - reference: PMID:33733696
    reference_title: >-
      Conventional MRI findings in hereditary degenerative ataxias: a pictorial
      review.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progression is usually independent of the age of onset and may take
      decades, though it does not significantly shorten lifespan
    explanation: >-
      States both the tempo and its independence from onset age, which is the
      substance of this phase.

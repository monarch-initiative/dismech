animal_models:
- name: SCA8 BAC (CTG)116 expansion mouse
  species: Mouse
  genotype: >-
    Full-length human SCA8 (CTG·CAG) expansion transgene, (CTG)116, expressed
    from its endogenous promoter on a bacterial artificial chromosome; (CTG)11
    lines serve as the matched control
  publication: PMID:16804541
  description: >-
    The central experimental system for this disease. Because the transgene
    carries the whole locus under its own promoter, the model reproduces
    bidirectional transcription and therefore all three toxic species at once,
    which is what makes it usable for separating their contributions. The
    (CTG)116 versus (CTG)11 comparison is what establishes that the expansion
    itself is pathogenic rather than a linked marker. Nearly every interventional
    result this entry relies on - the Mbnl1 genetic interaction, the in vivo
    imaging of granular-layer inhibition, the polySerine white-matter pathology -
    comes from this model or its crosses.
  modeled_mechanisms:
  - target: Bidirectional Transcription of the ATXN8OS/ATXN8 CTG-CAG Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The transgene is the full-length human locus with its own promoter, so
      bidirectional transcription is reproduced rather than engineered.
    limitations: >-
      A transgenic copy on a mouse background, so copy number and chromatin
      context are not those of the human locus, and the mouse carries its own
      endogenous Atxn8os alleles alongside it.
    evidence:
    - reference: PMID:16804541
      reference_title: >-
        Bidirectional expression of CUG and CAG expansion transcripts and
        intranuclear polyglutamine inclusions in spinocerebellar ataxia type 8.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We now report a transgenic mouse model in which the full-length human
        SCA8 mutation is transcribed using its endogenous promoter.
      explanation: >-
        Establishes that the model carries the full-length human mutation under
        its own promoter, which is why it reproduces the bidirectional
        transcription node.
  - target: Loss of Cerebellar GABAergic Inhibition
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      In vivo imaging in expansion but not control lines shows the reduced
      cerebellar cortical inhibition this node describes.
    limitations: >-
      The inhibitory deficit is measured in mouse cerebellum; no equivalent
      measurement exists in human SCA8, so its translational weight is assumed
      rather than shown.
    readouts:
    - name: Cerebellar cortical inhibition on in vivo optical imaging
      target: Loss of Cerebellar GABAergic Inhibition
      direction: DECREASED
      interpretation: >-
        Direct functional readout of the inhibitory deficit attributed to GAT4
        upregulation.
      evidence:
      - reference: PMID:16804541
        reference_title: >-
          Bidirectional expression of CUG and CAG expansion transcripts and
          intranuclear polyglutamine inclusions in spinocerebellar ataxia type 8.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          (CTG)116 expansion, but not (CTG)11 control lines, develop a
          progressive neurological phenotype with in vivo imaging showing reduced
          cerebellar-cortical inhibition.
        explanation: >-
          Reports the measurement and its direction against a matched control
          line.
    evidence:
    - reference: PMID:19680539
      reference_title: RNA gain-of-function in spinocerebellar ataxia type 8.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In vivo optical imaging studies in SCA8 mice confirm that Gabt4
        upregulation is associated with the predicted loss of GABAergic
        inhibition within the granular cell layer.
      explanation: >-
        Attests that the model is informative for this node, by measuring the
        predicted inhibitory change in it.
  - target: CUG-Expansion RNA Foci and MBNL1 Sequestration
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Crossing the model onto an Mbnl1 null background worsens motor deficits.
      This is a perturbation of the node rather than a recapitulation of it: it
      manipulates MBNL1 availability to test whether sequestration matters, which
      is the experiment the whole RNA gain-of-function hypothesis rests on.
    limitations: >-
      Complete genetic loss of Mbnl1 is a much larger perturbation than the
      partial sequestration proposed in human disease, so it demonstrates that
      MBNL1 dose matters without calibrating how much sequestration occurs in
      patients.
    evidence:
    - reference: PMID:19680539
      reference_title: RNA gain-of-function in spinocerebellar ataxia type 8.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        loss of Mbnl1 enhances motor deficits in SCA8 mice
      explanation: >-
        The genetic interaction that makes this model informative for the
        sequestration node.
  - target: White Matter PolySerine Aggregation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model accumulates polySerine in white matter alongside human autopsy
      tissue. Marked partial because the human and mouse distributions of polySer
      and polyGln differ, so the model reproduces the phenomenon without
      reproducing its anatomy exactly.
    limitations: >-
      Distribution differences between mouse and human brains are reported by the
      same study, so the model should not be used to infer which human regions
      are affected.
    evidence:
    - reference: PMID:30206144
      reference_title: >-
        SCA8 RAN polySer protein preferentially accumulates in white matter
        regions and is regulated by eIF3F.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Distribution differences of polySer and polyGln proteins in SCA 8 BAC
        mouse and human autopsy brains.
      explanation: >-
        Names the distribution difference between model and human tissue, which
        is the reason this link is PARTIALLY_RECAPITULATES rather than
        RECAPITULATES.
  evidence:
  - reference: PMID:16804541
    reference_title: >-
      Bidirectional expression of CUG and CAG expansion transcripts and
      intranuclear polyglutamine inclusions in spinocerebellar ataxia type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The neurological phenotype in SCA8 BAC expansion but not BAC control lines
      demonstrates the pathogenicity of the (CTG-CAG)n expansion.
    explanation: >-
      The controlled comparison that makes this model informative for the disease
      rather than merely transgenic.

    snippet: >-
      Spinocerebellar ataxia type 8 (SCA8) is caused by a bidirectionally
      transcribed CTG·CAG expansion that results in the in vivo accumulation of
      CUG RNA foci, an ATG-initiated polyGln and a polyAla protein expressed by
      repeat-associated non-ATG (RAN) translation.
    explanation: >-
      Enumerates all three products of the one expansion, which is the structure
      this pathograph is built around.
  - reference: PMID:30206144

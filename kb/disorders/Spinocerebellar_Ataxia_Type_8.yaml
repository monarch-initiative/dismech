genetic:
- name: ATXN8OS
  notes: >-
    Long non-coding RNA gene whose transcript carries the CTG expansion in the
    CUG direction. Its product is the toxic RNA species, so the gene is causative
    without encoding a protein.
  gene_term:
    preferred_term: ATXN8OS
    term:
      id: hgnc:10561
      label: ATXN8OS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:20301445
    reference_title: Spinocerebellar Ataxia Type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a heterozygous abnormal (CTG·CAG)n repeat expansion in the two overlapping
      genes ATXN8OS/ATXN8 identified by molecular genetic testing
    explanation: >-
      Names the two overlapping genes carrying the diagnostic expansion.
- name: ATXN8
  notes: >-
    Protein-coding gene transcribed from the opposite strand across the same
    repeat, translated into the polyglutamine protein. Because ATXN8OS and ATXN8
    share one physical expansion, they cannot be tested or inherited separately;
    this entry lists both because they carry different mechanisms, not different
    mutations.
  gene_term:
    preferred_term: ATXN8
    term:
      id: hgnc:32925
      label: ATXN8
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:16804541
    reference_title: >-
      Bidirectional expression of CUG and CAG expansion transcripts and
      intranuclear polyglutamine inclusions in spinocerebellar ataxia type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      encoded on a previously unidentified antiparallel transcript (ataxin 8,
      ATXN8) spanning the repeat in the CAG direction
    explanation: >-
      Establishes ATXN8 as the antiparallel transcript over the same repeat,
      which is why it is a second causative gene rather than a second locus.
- name: ATXN8OS/ATXN8 repeat expansion size
  notes: >-
    Recorded as a property of the locus rather than as a separate gene entry.
    The original report sized patient expansions at 107-127 CTG repeats,
    comparable to adult-onset myotonic dystrophy. Wider ranges are quoted in
    review literature, but this entry records only the figure it can quote from a
    fetched primary source, because repeat size in SCA8 does not predict
    penetrance or onset age and an imprecise range invites over-reading.
  gene_term:
    preferred_term: ATXN8OS
    term:
      id: hgnc:10561
      label: ATXN8OS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:

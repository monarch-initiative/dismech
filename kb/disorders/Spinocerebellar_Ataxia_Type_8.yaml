    description: >-
      Faster clearance of GABA from the synaptic cleft reduces inhibitory tone.
- name: Loss of Cerebellar GABAergic Inhibition
  description: >-
    Inhibitory tone falls in the granular cell layer. This is where the molecular
    lesion becomes an electrophysiological one, and it was confirmed in vivo by
    optical imaging rather than predicted from the transporter's function alone.

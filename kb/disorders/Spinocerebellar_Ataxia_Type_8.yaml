- name: Polyglutamine ATXN8 Protein Accumulation
  description: >-
    The CAG-direction transcript is translated conventionally from an AUG start
    into a nearly pure polyglutamine tract, which forms 1C2-positive intranuclear
    inclusions in cerebellar Purkinje cells and brainstem neurons. This was
    discovered after SCA8 had already been characterised as a non-coding
    expansion disease, and it is why SCA8 is now described as involving toxic
    gain of function at both the protein and the RNA level rather than at one of
    them.

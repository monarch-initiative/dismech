- name: Repeat-Associated Non-ATG Translation of PolyAlanine and PolySerine
  description: >-
    The same expansion is translated from non-AUG start sites in more than one
    reading frame, producing homopolymeric proteins that no ordinary reading of
    the locus would predict: polyalanine, and later a polyserine product from the
    AGC frame. The polyserine burden increases with age and with disease
    severity. eIF3F was identified as a regulator of how much RAN protein
    accumulates, which is a rare handle on this class of mechanism.
  role: mechanism
  biological_scale: MOLECULAR

name: Spinocerebellar Ataxia Type 8
creation_date: "2026-09-01T13:40:11Z"
category: Mendelian
parents:
- Autosomal Dominant Cerebellar Ataxia
- Repeat Expansion Disorder
disease_term:
  preferred_term: spinocerebellar ataxia type 8
  term:
    id: MONDO:0012116
    label: spinocerebellar ataxia type 8
synonyms:
- SCA8
- ATXN8OS-related spinocerebellar ataxia
description: >-
  Spinocerebellar ataxia type 8 is a slowly progressive dominant cerebellar
  ataxia caused by a CTG-CAG repeat expansion at 13q21, where the ATXN8OS and
  ATXN8 genes overlap and are transcribed in opposite directions. It was the
  first dominant SCA shown not to be a translated polyglutamine expansion, and
  the mechanism has stayed unusual ever since: the same expanded repeat is read
  out in at least three chemically different ways at once. In the CUG direction
  it makes a non-coding RNA that forms nuclear foci and sequesters MBNL1,
  producing the missplicing signature familiar from myotonic dystrophy; in the
  CAG direction it is translated conventionally into a nearly pure polyglutamine
  protein that forms intranuclear inclusions; and in other reading frames it is
  translated without an AUG start codon at all, yielding polyalanine and
  polyserine proteins that accumulate in white matter. The entry keeps these as
  three separately labelled mechanistic hypotheses rather than merging them,
  because they are supported by different experiments and predict damage in
  different tissue compartments. Clinically the disease is dominated by gait
  ataxia and scanning dysarthria with onset typically in the third to fifth
  decade, though onset has been reported from infancy to the eighth decade. The
  feature that most distinguishes SCA8 from the polyglutamine SCAs is its
  markedly reduced penetrance: repeat size alone does not make a diagnosis.
mechanistic_hypotheses:
- hypothesis_group_id: rna_gain_of_function
  hypothesis_label: Toxic CUG-expansion RNA sequestering MBNL1
  status: CANONICAL
  description: >-
    The non-coding CUG-expansion transcript from ATXN8OS accumulates as
    ribonuclear foci that co-localise with MBNL1, depleting it from its normal
    splicing role. Supported by three independent lines of evidence in one study:
    foci that co-localise with MBNL1, a genetic interaction in which loss of
    Mbnl1 worsens motor deficits in SCA8 mice, and a specific downstream
    splicing and expression change (GAT4/Gabt4).
  evidence:
  - reference: PMID:19680539
    reference_title: RNA gain-of-function in spinocerebellar ataxia type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we present three lines of evidence that RNA gain-of-function plays a
      significant role in SCA8
    explanation: >-
      States the claim of this hypothesis group and that it rests on three
      separate lines of evidence rather than one observation.
- hypothesis_group_id: polyglutamine_protein_toxicity
  hypothesis_label: ATG-initiated polyglutamine ATXN8 protein toxicity
  status: CANONICAL
  description: >-
    The CAG-direction transcript from ATXN8 is conventionally translated into a
    nearly pure polyglutamine protein that forms 1C2-positive intranuclear
    inclusions in Purkinje and brainstem neurons, in both transgenic mice and
    human autopsy tissue. This is the mechanism SCA8 was originally thought to
    lack, and its discovery is why SCA8 is now described as having toxicity at
    both the RNA and protein levels.
  evidence:
  - reference: PMID:16804541
    reference_title: >-
      Bidirectional expression of CUG and CAG expansion transcripts and
      intranuclear polyglutamine inclusions in spinocerebellar ataxia type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      1C2-positive intranuclear inclusions in cerebellar Purkinje and brainstem
      neurons in SCA8 expansion mice and human SCA8 autopsy tissue result from
      translation of a polyglutamine protein, encoded on a previously
      unidentified antiparallel transcript (ataxin 8, ATXN8) spanning the repeat
      in the CAG direction.
    explanation: >-
      Establishes the polyglutamine protein, its origin on the antiparallel
      transcript, and its presence in human tissue as well as mice.
- hypothesis_group_id: ran_translation_toxicity
  hypothesis_label: Repeat-associated non-ATG translation of polyAla and polySer
  status: EMERGING
  description: >-
    The expansion is additionally translated without an AUG start codon in
    several reading frames, producing homopolymeric polyalanine and polyserine
    proteins. PolySer accumulates specifically in white matter, increases with
    age and disease severity, and co-localises with demyelination and axonal
    degeneration, a tissue distribution neither of the other two hypotheses
    predicts. Marked EMERGING rather than CANONICAL because the causal
    contribution of RAN products to the human phenotype rests on a smaller body
    of work than the RNA and polyglutamine arms.
  evidence:
  - reference: PMID:30206144
    reference_title: >-
      SCA8 RAN polySer protein preferentially accumulates in white matter regions
      and is regulated by eIF3F.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report a novel toxic SCA8 polySer protein which accumulates in white
      matter (WM) regions as aggregates that increase with age and disease
      severity.
    explanation: >-
      States the existence of the RAN polySer product and its relationship with
      age and severity, which is the substance of this hypothesis.
  - reference: PMID:30206144
    reference_title: >-
      SCA8 RAN polySer protein preferentially accumulates in white matter regions
      and is regulated by eIF3F.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although RAN proteins have been reported in a growing number of diseases,
      the mechanisms and role of RAN translation in disease are poorly
      understood.
    explanation: >-
      The authors' own statement of how settled this mechanism is, quoted as the
      justification for grading this hypothesis EMERGING rather than CANONICAL.
pathophysiology:
- name: Bidirectional Transcription of the ATXN8OS/ATXN8 CTG-CAG Expansion
  description: >-
    The germline lesion is an unstable CTG-CAG repeat expansion on chromosome
    13q21, in a region where ATXN8OS and the protein-coding ATXN8 overlap and are
    transcribed in opposite directions. The single expansion is therefore
    transcribed twice, in both senses, and everything downstream follows from
    that one fact: a CUG-repeat non-coding transcript from ATXN8OS and a
    CAG-repeat coding transcript from ATXN8. The repeat is highly unstable on
    transmission, tending to expand through the maternal line and contract
    through the paternal line, which is part of why the disease does not show the
    tidy repeat-size-to-onset relationship of the polyglutamine SCAs.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ATXN8OS
    term:
      id: hgnc:10561
      label: ATXN8OS
  - preferred_term: ATXN8
    term:
      id: hgnc:32925
      label: ATXN8
  evidence:
  - reference: PMID:10192387
    reference_title: >-
      An untranslated CTG expansion causes a novel form of spinocerebellar ataxia
      (SCA8).
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report that a non-coding CTG expansion causes a novel form of
      spinocerebellar ataxia (SCA8). This expansion, located on chromosome 13q21,
      was isolated directly from the genomic DNA of an ataxia patient
    explanation: >-
      The original identification of the causal expansion and its locus, from
      patient DNA rather than from a model system.
  - reference: PMID:16804541
    reference_title: >-
      Bidirectional expression of CUG and CAG expansion transcripts and
      intranuclear polyglutamine inclusions in spinocerebellar ataxia type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The neurological phenotype in SCA8 BAC expansion but not BAC control lines
      demonstrates the pathogenicity of the (CTG-CAG)n expansion.
    explanation: >-
      Establishes that the expansion itself is pathogenic rather than a linked
      marker, by contrasting expansion and control transgenic lines.
  - reference: PMID:20301445
    reference_title: Spinocerebellar Ataxia Type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The (CTG·CAG)n repeat expansion is highly unstable and almost always
      changes in size on transmission: the repeat expansion is more likely to
      become larger when maternally transmitted and more likely to contract with
      paternal transmission.
    explanation: >-
      Documents the transmission instability and its parent-of-origin bias, which
      this node records as a property of the lesion.
  downstream:
  - target: CUG-Expansion RNA Foci and MBNL1 Sequestration
    causal_link_type: DIRECT
    hypothesis_groups:
    - rna_gain_of_function
    description: >-
      Transcription in the CUG direction produces the non-coding expansion RNA
      that forms nuclear foci.
  - target: Polyglutamine ATXN8 Protein Accumulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - polyglutamine_protein_toxicity
    description: >-
      Transcription in the CAG direction produces a coding transcript that is
      conventionally translated into polyglutamine.
  - target: Repeat-Associated Non-ATG Translation of PolyAlanine and PolySerine
    causal_link_type: DIRECT
    hypothesis_groups:
    - ran_translation_toxicity
    description: >-
      The same expansion transcripts are additionally translated from non-AUG
      start sites in alternative reading frames.
- name: CUG-Expansion RNA Foci and MBNL1 Sequestration
  description: >-
    The non-coding CUG-expansion transcript accumulates as ribonuclear inclusions
    in the nuclei of selected neurons and glia, where it binds and sequesters
    MBNL1. This is the same class of RNA gain-of-function lesion that drives
    myotonic dystrophy type 1, arriving here through a repeat that is short by
    the standards of that disease. The genetic evidence is the strong part:
    removing Mbnl1 makes SCA8 mice worse, which is what a sequestration model
    predicts and a bystander model does not.
  role: mechanism
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:19680539
    reference_title: RNA gain-of-function in spinocerebellar ataxia type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CUG(exp) transcripts accumulate as ribonuclear inclusions that co-localize
      with MBNL1 in selected neurons in the brain
    explanation: >-
      Establishes both the foci and the co-localisation with MBNL1 that the
      sequestration claim rests on.
  - reference: PMID:19680539
    reference_title: RNA gain-of-function in spinocerebellar ataxia type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      loss of Mbnl1 enhances motor deficits in SCA8 mice
    explanation: >-
      Genetic interaction evidence that MBNL1 availability modifies the
      phenotype, which is what distinguishes sequestration from incidental
      co-localisation.
  downstream:
  - target: MBNL1-Dependent Missplicing of CNS Targets
    causal_link_type: DIRECT
    hypothesis_groups:
    - rna_gain_of_function
    description: >-
      MBNL1 depletion alters splicing of its CNS targets, of which GAT4/Gabt4 is
      the demonstrated example.
- name: MBNL1-Dependent Missplicing of CNS Targets
  description: >-
    With MBNL1 sequestered, the alternative splicing it normally regulates
    shifts across its CNS target set. This is the molecular consequence of
    sequestration and is separated from what any individual mis-spliced target
    then does, because the splicing shift is general while only one target has
    been traced through to a physiological effect.
  role: mechanism
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: RNA splicing
    modifier: ABNORMAL
    term:
      id: GO:0008380
      label: RNA splicing
  evidence:
  - reference: PMID:19680539
    reference_title: RNA gain-of-function in spinocerebellar ataxia type 8.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SCA8 CUG(exp) transcripts trigger splicing changes and increased expression
      of the CUGBP1-MBNL1 regulated CNS target, GABA-A transporter 4
      (GAT4/Gabt4)
    explanation: >-
      Establishes that the expansion transcripts alter splicing of MBNL1
      regulated CNS targets, which is the claim of this node.
  downstream:
  - target: GAT4 Upregulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - rna_gain_of_function
    description: >-
      Increased expression of the GABA-A transporter GAT4 is the one
      demonstrated consequence of the splicing shift.
- name: GAT4 Upregulation
  description: >-
    Expression of the GABA-A transporter GAT4/Gabt4 rises. It is picked out from
    the wider splicing shift because it is the single target whose consequence
    has been measured rather than inferred, and because a transporter that
    clears GABA from the synaptic cleft has an obvious and testable
    physiological prediction.
  role: mechanism
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:19680539
    reference_title: RNA gain-of-function in spinocerebellar ataxia type 8.
    supports: SUPPORT

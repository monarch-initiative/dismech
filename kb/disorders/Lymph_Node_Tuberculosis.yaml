    explanation: >-
      A review's figure for the share of US tuberculosis cases.
- population: Extrapulmonary tuberculosis cases
  measure_type: UNKNOWN
  notes: >-
    Tuberculous lymphadenitis is about 35% of extrapulmonary tuberculosis,
    with cervical nodes affected in 60-90%. Shares, not rates.
  evidence:
  - reference: PMID:37425548
    reference_title: "Revisiting Scrofula: An Entity Not to Forget in Migrants' Health."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Tuberculous lymphadenitis (TBL) constitutes nearly 35% of all EPTB cases
      and most frequently affects cervical lymph nodes (60%-90%), a condition
      historically known as scrofula
    explanation: >-
      A case report's introduction restating the share of extrapulmonary
      tuberculosis.
- population: Superficial lymph node biopsies, University of Nigeria Teaching Hospital, 2000-2014
  measure_type: UNKNOWN
  notes: >-
    Tuberculous lymphadenitis was 14.6% of superficial lymph node biopsies in
    a 15-year histopathology review. A share of biopsies, not a rate.
  evidence:
  - reference: PMID:27144076
    reference_title: "Tuberculous Lymphadenitis in South-Eastern Nigeria; A 15 Years Histopathologic Review (2000-2014)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      One hundred and seventy-two cases of TBLN were identified in this study
      constituting 14.6% (172/1,180) of SLNBs received at our Hospital's
      Morbid Anatomy Department during the 15 years period under review.
    explanation: >-
      Share of superficial node biopsies showing tuberculous lymphadenitis.
environmental:
- name: HIV infection and other immunosuppression
  exposure_term:
    preferred_term: HIV infection
    term:
      id: ECTO:3000289
      label: exposure to Human immunodeficiency virus
  description: >-
    HIV infection is common among patients with lymph node tuberculosis in
    much of Africa (73% pooled outside Ethiopia, 21% in Ethiopia) and makes
    the disease more widespread, more often systemic, more often accompanied
    by pulmonary tuberculosis and less likely to form typical granulomas.
    Paradoxical node enlargement is more frequent with HIV. In non-human
    primates, CD4 T-cell depletion and TNF neutralization trigger reactivation
    from latent nodal granulomas. The Ethiopian studies found no association
    between HIV and the high local rate of lymph node tuberculosis, so the
    strength of the association varies by setting.
  influences_mechanisms:
  - target: Reactivation of Latent Nodal Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of CD4 T cells or TNF lets latent bacilli in lymph node granulomas
      reactivate and spread.
    evidence:
    - reference: PMID:32790739
      reference_title: "Lymph nodes-The neglected battlefield in tuberculosis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        After latent TB reactivation is induced by HIV infection, CD4 T-cell
        depletion, or TNF neutralization, non-necrotizing granulomas form
        adjacent to established and often mineralized granulomas in the lymph
        nodes.
      explanation: >-
        A review figure legend drawing on human and macaque studies.
  evidence:
  - reference: PMID:31002716
    reference_title: "Epidemiology of tuberculous lymphadenitis in Africa: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sub-group analysis of TBLN/HIV co-infection by country/sub-region/
      showed that the pooled prevalence of HIV among TBLN in African countries
      other than Ethiopia was 73% whereas it was 21% in Ethiopia
    explanation: >-
      Pooled HIV co-infection among patients with lymph node tuberculosis in
      Africa.
  - reference: PMID:27144076
    reference_title: "Tuberculous Lymphadenitis in South-Eastern Nigeria; A 15 Years Histopathologic Review (2000-2014)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Twenty-eight cases of TBLN were clinically screened for HIV, 23 of which
      tested positive, representing 82.1% (23/28) of clinically screened
      cases.
    explanation: >-
      Most screened patients in a Nigerian biopsy series were HIV-positive.
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Also in HIV-positive patients the lymphadenopathies are more commonly
      seen as symmetrical and multiple contrasted with presentation with focal
      and asymmetrical lymphadenopathies of HIV-negative patients
    explanation: >-
      A review on how HIV changes the pattern of node involvement.
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Accompanying pulmonary tuberculosis is reported in 18%–42% of patients.
      The higher rate of pulmonary tuberculosis is seen in HIV-positive
      patients rather than HIV-negative patients
    explanation: >-
      A review on concurrent pulmonary disease and HIV.
  - reference: PMID:25886866
    reference_title: "Investigation of the high rates of extrapulmonary tuberculosis in Ethiopia reveals no single driving factor and minimal evidence for zoonotic transmission of Mycobacterium bovis infection."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      No major patient or bacterial strain factor could be identified as being
      responsible for the high rate of TBLN, and there was no association with
      HIV infection.
    explanation: >-
      In Ethiopia, HIV did not explain the high rate of lymph node
      tuberculosis, so the association is not universal.
- name: Ingestion of unpasteurized milk
  description: >-
    Drinking raw milk or eating raw meat was reported by 46% of patients in
    pooled African data, and M. bovis is acquired by this route. Current
    typing series find few M. bovis isolates, so the exposure explains only a
    small share of cases where milk is pasteurized or bovine tuberculosis is
    controlled.
  notes: >-
    Left without an exposure_term. ECTO was searched in OLS for "raw milk",
    "unpasteurized milk" and "cow milk"; the hits were exposure to cow milk
    (liquid) via ingestion (ECTO:0070204), which does not specify raw milk,
    and exposure to human milk (raw) via ingestion (ECTO:0070224), which is
    the wrong species.
  influences_mechanisms:
  - target: Oropharyngeal Entry of Ingested Mycobacterium bovis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Contaminated milk carries M. bovis to the oropharynx.
    evidence:
    - reference: PMID:25886866
      reference_title: "Investigation of the high rates of extrapulmonary tuberculosis in Ethiopia reveals no single driving factor and minimal evidence for zoonotic transmission of Mycobacterium bovis infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        M. bovis is primarily transmitted through consumption of contaminated
        milk and is often associated with TBLN
      explanation: >-
        A field study's introduction on the milk-borne route.
  evidence:
  - reference: PMID:31002716
    reference_title: "Epidemiology of tuberculous lymphadenitis in Africa: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The history of eating raw meat/drinking raw milk among TBLN cases in
      Africa was 46% (low quality of evidence).
    explanation: >-
      Pooled share of patients reporting raw milk or meat.
- name: Birth in or migration from a high-burden country
  description: >-
    In low-incidence countries most patients are young adults born in
    high-burden countries, presenting several years after arrival.
  evidence:
  - reference: PMID:16267410
    reference_title: "Peripheral tuberculous lymphadenitis: epidemiology, diagnosis, treatment, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Tuberculous lymphadenitis occurred predominantly in young, foreign-born

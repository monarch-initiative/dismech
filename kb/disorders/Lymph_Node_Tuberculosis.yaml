name: Lymph Node Tuberculosis
creation_date: "2026-11-27T23:10:15Z"
description: >-
  Lymph node tuberculosis (tuberculous lymphadenitis; scrofula when it affects
  the neck) is infection of lymph nodes by the Mycobacterium tuberculosis
  complex and the most common form of extrapulmonary tuberculosis in
  low-incidence countries. Bacilli reach the nodes in dendritic cells and
  macrophages draining a pulmonary or oropharyngeal focus, by later
  lymphohematogenous spread, or by reactivation of a latent nodal focus. M.
  tuberculosis causes almost all cases where isolates are typed; M. bovis,
  acquired from unpasteurized milk, is now a minor cause. Peripheral disease
  is usually a painless swelling of one group of cervical nodes, most often
  posterior triangle or supraclavicular, present for one to two months, and
  mainly affects young adults, women more than men, and in low-incidence
  countries migrants from high-burden ones. Mediastinal and hilar nodes are
  the main intrathoracic site, and abdominal (mesenteric, peripancreatic and
  periportal) nodes are also involved. Inside the node, granulomas disrupt
  and replace the nodal architecture and undergo caseous necrosis. Untreated
  disease passes through the five Jones-Campbell stages: discrete reactive
  nodes, matted nodes fixed by periadenitis, central softening with a cold
  abscess, a collar-stud abscess, and a draining sinus. Systemic symptoms are
  common in some high-burden series and uncommon in others, and are more
  frequent with HIV infection, which also makes node involvement more
  symmetrical and widespread. Diagnosis rests on fine-needle aspiration with
  cytology, acid-fast staining, Xpert MTB/RIF and culture, or on excisional
  biopsy, and nontuberculous mycobacterial lymphadenitis is the main
  differential in young children. Standard six-month chemotherapy cures most
  patients, but nodes respond slowly, residual nodes are common, and a
  paradoxical upgrading reaction (new or enlarging nodes, abscesses or
  sinuses) occurs in about a fifth of patients during or after treatment.
  Surgery is mainly used for diagnosis and for troublesome fluctuant or
  persistent nodes.
category: Infectious Disease
disease_term:
  preferred_term: lymph node tuberculosis
  term:
    id: MONDO:0005831
    label: lymph node tuberculosis
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0957461
      label: primary tuberculous lymphadenitis
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0957461 has no definition and no synonyms in MONDO; its only
      cross-references are GARD, MedGen, UMLS, an ICD-11 foundation entity and
      Orphanet:645807, and Orphanet has since obsoleted 645807, telling users
      to use primary extrapulmonary tuberculosis instead. Whichever sense of
      primary is meant (lymphadenitis as the first manifestation of a primary
      infection, or lymph node disease without a pulmonary focus), it is a
      narrower form of the lymph node tuberculosis this entry covers. No
      cited source describes a distinct mechanism, presentation, diagnostic
      pathway or treatment for it, so it is mapped here rather than curated
      as a separate entry or subtype.

transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The infection is acquired by inhaling airborne bacilli expelled by people
    with active pulmonary tuberculosis; the nodes are reached from the lung.
  evidence:
  - reference: PMID:32790739
    reference_title: "Lymph nodes-The neglected battlefield in tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infection begins when a person inhales aerosolized droplets containing
      Mtb.
    explanation: >-
      A review figure legend describing the airborne start of infection that
      leads to thoracic node involvement.
- name: Ingestion of unpasteurized milk (Mycobacterium bovis)
  description: >-
    M. bovis is acquired by drinking unpasteurized milk from infected cattle,
    and is associated with lymph node disease.
  evidence:
  - reference: PMID:25886866
    reference_title: "Investigation of the high rates of extrapulmonary tuberculosis in Ethiopia reveals no single driving factor and minimal evidence for zoonotic transmission of Mycobacterium bovis infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      M. bovis is primarily transmitted through consumption of contaminated
      milk and is often associated with TBLN
    explanation: >-
      A field study's introduction on the milk-borne route and its link to
      lymph node disease.

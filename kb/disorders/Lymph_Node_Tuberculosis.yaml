    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Tuberculin skin tests were positive in 94% of cases.
    explanation: >-
      TST positivity in 106 patients.
  - reference: PMID:33984332
    reference_title: Interferon-Gamma Release Assays Differentiate between Mycobacterium avium Complex and Tuberculous Lymphadenitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among MAC cases, 44 out of 74 (59.5%) had positive tuberculin skin test

      cases (P < .001)
    explanation: >-
      TST was positive in most children with MAC lymphadenitis too.
- name: Interferon-Gamma Release Assay
  description: >-
    In children with subacute or chronic cervical lymphadenitis, a positive
    IGRA strongly favours tuberculosis over Mycobacterium avium complex
    lymphadenitis, and is most useful when culture and PCR are negative.
  diagnosis_term:
    preferred_term: interferon-gamma release assay
    term:
      id: NCIT:C128363
      label: Interferon Gamma Release Assay
  evidence:
  - reference: PMID:33984332
    reference_title: Interferon-Gamma Release Assays Differentiate between Mycobacterium avium Complex and Tuberculous Lymphadenitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      IGRA results were positive in only 1 out of 32 (3.1%) patients with MAC
      who had undergone IGRA testing, compared with 21 out of 23 (91.3%) TB
      cases (P < .001).
    explanation: >-
      IGRA separated TB from MAC lymphadenitis in children.
- name: HIV Testing
  description: >-
    Every patient with suspected cervical tuberculous lymphadenitis should be
    tested for HIV, because co-infection changes the presentation, the
    histology and the risk of spread.
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Because of the co-infection risk of extrapulmonary forms of tuberculosis
      in HIV-positive patients, all patients with CTL suspects have to be
      tested for HIV
    explanation: >-
      A review's recommendation for HIV testing.
- name: Jones-Campbell clinical staging
  description: >-
    A five-stage clinical classification of untreated tuberculous
    lymphadenitis: (1) enlarged, firm, mobile, discrete nodes with reactive
    hyperplasia; (2) large rubbery nodes fixed by periadenitis; (3) central
    softening from abscess formation; (4) collar-stud abscess; (5) sinus
    tract. It describes the extent of local disease and is not a diagnostic
    criterion.
  evidence:
  - reference: PMID:38618370
    reference_title: Extrapulmonary Tuberculosis Presenting As Stage V Bilateral Cervical Lymphadenitis With Cortical Cerebral Watershed Infarct Along With Maxillary and Sphenoid Sinusitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Interestingly, Jones and Campbell have delineated five stages
      characterizing the progression of tuberculous lymphadenitis.
    explanation: >-
      A case report's discussion introducing the staging table.
differential_diagnoses:
- name: Nontuberculous mycobacterial lymphadenitis
  description: >-
    Cervicofacial lymphadenitis is the commonest manifestation of
    nontuberculous mycobacterial infection in young immunocompetent children,
    mostly due to Mycobacterium avium complex, and presents as a nontender
    neck mass that becomes violaceous and fluctuant and often fistulizes. It
    must be told apart because it is treated mainly by complete excision
    rather than antituberculous chemotherapy.
  distinguishing_features:
  - Young children, often under five, usually with submandibular or cervicofacial nodes
  - Negative interferon-gamma release assay, though the tuberculin skin test is often positive
  - Culture or PCR identifying a nontuberculous species such as M. avium complex or M. lentiflavum
  - Usually no chest radiograph abnormality or tuberculosis contact
  evidence:
  - reference: PMID:40023802
    reference_title: "A 28-Year Multicenter Cohort Study of Nontuberculous Mycobacterial Lymphadenitis in Children, Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Cervicofacial lymphadenitis is the most common clinical manifestation of
      NTM infection in young immunocompetent children
    explanation: >-
      A pediatric cohort's introduction on the main differential.
  - reference: PMID:40023802
    reference_title: "A 28-Year Multicenter Cohort Study of Nontuberculous Mycobacterial Lymphadenitis in Children, Spain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most common treatment strategy was complete surgical resection with
      (n = 80) or without (n = 88) antimicrobial drug treatment, followed by
      antimicrobial drugs alone (n = 76).
    explanation: >-
      Surgery was the main treatment of NTM lymphadenitis in children.
  - reference: PMID:20209720
    reference_title: Tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is also important to differentiate tuberculous from nontuberculous
      mycobacterial cervical lymphadenitis because their treatment protocols
      vary.
    explanation: >-
      A review on why the distinction matters.
  - reference: PMID:33984332
    reference_title: Interferon-Gamma Release Assays Differentiate between Mycobacterium avium Complex and Tuberculous Lymphadenitis in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In contrast to TST, IGRAs have high specificity, negative predictive
      value, and positive predictive value for TB lymphadenitis in children
      with subacute/chronic lymphadenopathy, and consequently can help to
      discriminate between TB and MAC disease.
    explanation: >-
      IGRA as the discriminating test in children.
- name: Sarcoidosis
  disease_term:
    preferred_term: sarcoidosis
    term:
      id: MONDO:0019338
      label: sarcoidosis
  description: >-
    Sarcoidosis is another granulomatous lymphadenitis to be considered in the
    differential diagnosis.
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In differential diagnosis of CTL, other granulomatous lymphadenitis
      should be considered such as non-tuberculous mycobacteria (including M.
      scrofulaceum, M. avium, and M. haemophilum), sarcoidosis, toxoplasmosis,
      tularemia, fungal disease, cat-scratch disease and neoplasms
    explanation: >-
      A review listing the granulomatous differentials.
- name: Cat-scratch disease
  disease_term:
    preferred_term: cat-scratch disease
    term:
      id: MONDO:0005692
      label: cat-scratch disease
  description: >-
    Bartonella lymphadenitis is a granulomatous regional lymphadenitis named in
    the differential diagnosis.
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In differential diagnosis of CTL, other granulomatous lymphadenitis
      should be considered such as non-tuberculous mycobacteria (including M.
      scrofulaceum, M. avium, and M. haemophilum), sarcoidosis, toxoplasmosis,
      tularemia, fungal disease, cat-scratch disease and neoplasms
    explanation: >-
      A review listing cat-scratch disease among the differentials.
- name: Lymphoma and metastatic neoplasm
  description: >-
    Neoplasms, including lymphoma and nodal metastases, are in the
    differential of a chronic painless neck mass and are a main reason for
    excisional biopsy when aspiration is not diagnostic.
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In differential diagnosis of CTL, other granulomatous lymphadenitis
      should be considered such as non-tuberculous mycobacteria (including M.
      scrofulaceum, M. avium, and M. haemophilum), sarcoidosis, toxoplasmosis,
      tularemia, fungal disease, cat-scratch disease and neoplasms
    explanation: >-
      A review listing neoplasms among the differentials.
treatments:
- name: Standard Six-Month Antituberculous Chemotherapy
  description: >-
    Isoniazid, rifampicin, pyrazinamide and ethambutol for two months, then
    isoniazid and rifampicin for four months, is the standard treatment. In
    trials, six months performed as well as nine months (British Thoracic
    Society trial; a Hong Kong thrice-weekly trial) and cured most children
    with extensive disease. Nodes respond more slowly than pulmonary disease,
    and in one small series with ultrasound follow-up only 63% had no
    residual node over 1 cm at six months, so some clinicians extend
    treatment; bilateral cervical nodes and low body mass index predicted a
    prolonged course. M. bovis is intrinsically resistant to pyrazinamide and
    may not respond to the standard first-line regimen, so speciation and
    susceptibility testing matter.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Mycobacterial Persistence in Lymph Nodes
    treatment_effect: INHIBITS
    description: >-
      Bactericidal drugs kill the bacilli in the node, though drug penetration
      into nodes is poorer than into lung.
    evidence:
    - reference: PMID:8290746
      reference_title: "Six months versus nine months chemotherapy for tuberculosis of lymph nodes: final results."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The 6 month Z2H6R6 regimen performs just as well as the 9 month
        regimens Z2H9R9 and E2H9R9 in patients with fully sensitive organisms,
        and has the additional benefits of convenience and reduced cost.
      explanation: >-
        Randomized trial in 157 patients who completed treatment.
  evidence:
  - reference: PMID:39054415
    reference_title: "Efficacy and tolerability of a 4-month ofloxacin-containing regimen compared to a 6-month regimen in the treatment of patients with superficial lymph node tuberculosis: a randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Tuberculosis (TB) lymphadenitis is the most common form of
      extra-pulmonary TB, and the treatment duration is six months.
    explanation: >-
      A trial's background statement of the standard duration.
  - reference: PMID:9051062
    reference_title: Prospective randomized study of thrice weekly six-month and nine-month chemotherapy for cervical tuberculous lymphadenopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There were no significant differences of both primary failure rate and
      5-year actuarial remission rate of the two regimens. The 6-month
      regimen is recommended as the initial treatment of tuberculous
      lymphadenopathy.
    explanation: >-
      A randomized trial in 91 patients with five-year follow-up.
  - reference: PMID:2205318
    reference_title: Short course chemotherapy for tuberculous lymphadenitis in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Tuberculous lymphadenitis in children can be successfully treated with a
      short course chemotherapy regimen of six months.
    explanation: >-
      An open trial in 168 children.
  - reference: PMID:21865192
    reference_title: Current diagnosis and management of peripheral tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antimycobacterial therapy remains the cornerstone of treatment, but
      response is slower than with pulmonary tuberculosis; persistent pain and
      swelling are common, and paradoxical upgrading reactions may occur in
      20% of patients.
    explanation: >-
      A review on the slow response.
  - reference: PMID:39399357
    reference_title: Cure Rates for Tuberculous Cervical Lymphadenopathy after 6-month or 9-month Anti-tuberculous Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among the 30 participants who completed 6-month treatment, 63.3% (n=19)
      were cured while 36.7% (n=11) had residual lymphadenopathy and extended
      to 9-month treatment.
    explanation: >-
      A small series defining cure as no node over 1 cm on ultrasound.
  - reference: PMID:18400607
    reference_title: Clinical features and predictors of a complicated treatment course in peripheral tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      For patients who present with bilateral cervical nodes and low body mass
      index, a prolonged treatment course to ensure disease control should be
      considered.
    explanation: >-
      The series' conclusion on who may need longer treatment.
  - reference: PMID:26388186
    reference_title: "Mycobacterium bovis cervical lymphadenitis: A representative case and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      M. bovis has universal resistance to pyrazinamide and thus may not
      respond to typical first line mycobacterial drugs and may require
      surgical intervention.
    explanation: >-
      A caveat for M. bovis disease.
- name: Nine-Month Rifampicin and Isoniazid Regimen
  description: >-
    The older regimen of nine months of rifampicin and isoniazid with
    ethambutol for the first two months. Randomized trials found no advantage
    over six months, and it is now used mainly when pyrazinamide cannot be
    given, as with M. bovis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Mycobacterial Persistence in Lymph Nodes
    treatment_effect: INHIBITS
    description: >-
      The drugs kill the bacilli in the node.
    evidence:
    - reference: PMID:8290746
      reference_title: "Six months versus nine months chemotherapy for tuberculosis of lymph nodes: final results."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        In follow-up from 9 to 30 months, there were no significant
        differences between the regimens in enlargement of existing nodes,
        development of new glands or sinuses, in the need for new operative
        procedures, or in the percentage with measurable nodes at 30 months.
      explanation: >-
        The nine-month arms performed like the six-month arm.
  evidence:
  - reference: PMID:2196725
    reference_title: The treatment of superficial tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Nine months of rifampicin and isoniazid, supplemented by ethambutol for
      the first 2 months, is the current treatment of choice for tuberculous
      lymphadenitis.
    explanation: >-
      A 1990 review giving the regimen then in use.
- name: Four-Month Ofloxacin-Containing Regimen
  description: >-
    An investigational regimen of rifampicin, isoniazid, pyrazinamide and
    ofloxacin daily for two months, then rifampicin, isoniazid and ofloxacin
    thrice weekly for two months. In one South Indian trial in HIV-negative
    adults with superficial disease it was non-inferior to the six-month
    regimen; it is not a guideline regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ofloxacin
      term:
        id: CHEBI:7731
        label: ofloxacin
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
  evidence:
  - reference: PMID:39054415
    reference_title: "Efficacy and tolerability of a 4-month ofloxacin-containing regimen compared to a 6-month regimen in the treatment of patients with superficial lymph node tuberculosis: a randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The 4-month ofloxacin containing regimen was found to be non-inferior
      and as safe as the 6-month thrice-weekly control regimen.
    explanation: >-
      A randomized trial in 302 patients.
- name: Corticosteroids for Paradoxical Reactions
  description: >-
    Corticosteroids are used for troublesome paradoxical reactions, but their
    role is controversial: in one series of 109 patients they did not shorten
    the reaction, and data in children are insufficient to define the best
    management. Antituberculous treatment is continued.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:15825042
    reference_title: Characterization and management of paradoxical upgrading reactions in HIV-uninfected patients with lymph node tuberculosis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We found no association between the use of steroids and the duration of
      reaction.
    explanation: >-
      Steroids did not shorten paradoxical reactions in this series.
  - reference: PMID:21865192
    reference_title: Current diagnosis and management of peripheral tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The role of steroids is controversial.

- population: Tuberculosis cases, United States
  measure_type: UNKNOWN
  notes: >-
    Peripheral tuberculous lymphadenitis is about 10% of tuberculosis cases in
    the United States. This is a share of tuberculosis cases, not a population
    rate, so no band is asserted.

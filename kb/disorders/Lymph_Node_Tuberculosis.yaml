      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Initial excision does not seem to affect outcome and surgical
        procedures should be reserved for the relief of discomfort caused by
        enlarged nodes or tense, fluctuant nodes.
      explanation: >-
        A review naming fluctuant nodes as an indication for a procedure.
  evidence:
  - reference: PMID:38618370
    reference_title: Extrapulmonary Tuberculosis Presenting As Stage V Bilateral Cervical Lymphadenitis With Cortical Cerebral Watershed Infarct Along With Maxillary and Sphenoid Sinusitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Per the national policy, he was offered incision and drainage of the
      infected lymph nodes, but he was unwilling to do so.
    explanation: >-
      Incision and drainage offered for stage 5 disease in a case report.

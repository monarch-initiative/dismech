      Fine needle aspiration was an essential step in the evaluation and
      diagnosis of tuberculous lymphadenitis.
    explanation: >-
      Fine-needle aspiration as the diagnostic step for peripheral nodes.
- name: Intrathoracic
  display_name: Mediastinal and hilar tuberculous lymphadenitis
  classification: anatomical_group
  description: >-
    Disease of mediastinal and hilar nodes, the main site of lymph node
    involvement in primary infection. The nodes are not palpable, and
    diagnosis needs endosonography-guided aspiration. About a third of
    patients have concurrent pulmonary tuberculosis, and caseating mediastinal
    nodes are the usual source of secondary esophageal tuberculosis.
  locations:
  - preferred_term: mediastinal lymph node
    term:
      id: UBERON:0002524
      label: mediastinal lymph node
  - preferred_term: thoracic lymph node
    term:
      id: UBERON:0007644
      label: thoracic lymph node
  evidence:
  - reference: PMID:38050909
    reference_title: "Clinical Course of Patients With Mediastinal Lymph Node Tuberculosis and Risk Factors for Paradoxical Responses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of 9,052 patients who underwent endosonography during the study period,
      158 were diagnosed with mediastinal LNTB. Of these, 55 (35%) and 41 (26%)
      concurrently had pulmonary tuberculosis and extrapulmonary tuberculosis
      other than mediastinal LNTB, respectively.
    explanation: >-
      Endosonographic diagnosis and concurrent disease in 158 patients.
  - reference: PMID:32790739
    reference_title: "Lymph nodes-The neglected battlefield in tuberculosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lymph nodes, particularly thoracic lymph nodes, are among the most
      common sites of extrapulmonary tuberculosis (TB).
    explanation: >-
      A review naming thoracic nodes as a common extrapulmonary site.
- name: Abdominal
  display_name: Abdominal tuberculous lymphadenopathy
  classification: anatomical_group
  description: >-
    Disease of mesenteric, peripancreatic, periportal and para-aortic nodes,
    the commonest form of abdominal tuberculosis and isolated in up to about
    half of patients with it. Abdominal pain is the main symptom. Diagnosis
    relies on CT, which shows necrotic nodes with rim enhancement, and on
    endoscopic ultrasound-guided or surgical tissue sampling, because
    ultrasound is limited by bowel gas.
  locations:
  - preferred_term: abdominal lymph node
    term:
      id: UBERON:0002507
      label: abdominal lymph node
  - preferred_term: mesenteric lymph node
    term:
      id: UBERON:0002509
      label: mesenteric lymph node
  evidence:
  - reference: PMID:41300955
    reference_title: "Clinical and CT Features of HIV-Negative and HIV-Positive Patients with Abdominal Tuberculous Lymphadenopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      ATBL usually presents as necrotic nodes in the mesenteric,
      peripancreatic, periportal, and upper para-aortic regions
    explanation: >-
      A CT series' introduction on the usual sites and appearance of
      abdominal nodal disease.
  - reference: PMID:41300955
    reference_title: "Clinical and CT Features of HIV-Negative and HIV-Positive Patients with Abdominal Tuberculous Lymphadenopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      ATBL is a common manifestation of abdominal tuberculosis (ATB); in up to
      55% of patients with ATB, ATBL presents as an isolated manifestation
      without other organ involvement
    explanation: >-
      A CT series' introduction restating how often nodal disease is the only
      abdominal site.

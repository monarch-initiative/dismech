    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      paradoxical deterioration of lymph node tuberculosis in human
      immunodeficiency virus-uninfected patients was common, occurring in 25
      (23%) of 109 patients after treatment had been given for a median of 46
      days (interquartile range, 21-139 days) and persisting for a median of
      67.5 days (interquartile range, 34-111 days).
    explanation: >-
      Frequency and timing of the reaction in 109 HIV-negative patients.

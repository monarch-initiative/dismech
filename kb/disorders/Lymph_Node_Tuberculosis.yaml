    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Most children were treated with corticosteroids, but data were
      insufficient to identify the optimal management strategy.
    explanation: >-
      Steroid use in children with paradoxical reactions.
- name: Surgical Excision of Affected Nodes
  description: >-
    Excision is not needed for cure in most patients and initial excision
    does not change outcome, so it is reserved for diagnosis, persistent
    painful or enlarging nodes, troublesome paradoxical reactions and
    drug-resistant disease. Some authors argue for initial excisional biopsy
    to combine diagnosis with removal of slowly responding nodes. Open
    biopsy carries a risk of complications.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: excision of tuberculous lymph nodes
    term:
      id: NCIT:C15275
      label: Lymphadenectomy
  target_mechanisms:
  - target: Caseous Necrosis of the Lymph Node
    treatment_effect: INHIBITS
    description: >-
      Removing the diseased node removes the necrotic, poorly penetrated focus.
    evidence:
    - reference: PMID:21865192
      reference_title: Current diagnosis and management of peripheral tuberculous lymphadenitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Initial excisional biopsy deserves consideration for both optimal
        diagnosis and management of the otherwise slow response to therapy.
      explanation: >-
        A review arguing excision speeds the slow nodal response.
  evidence:
  - reference: PMID:2196725
    reference_title: The treatment of superficial tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Initial excision does not seem to affect outcome and surgical procedures
      should be reserved for the relief of discomfort caused by enlarged nodes
      or tense, fluctuant nodes.
    explanation: >-
      A review on the limited role of surgery.
  - reference: PMID:34472036
    reference_title: Role of ultrasound in the diagnosis of cervical tuberculous lymphadenitis in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Surgical excision was recommended only in unusual circumstances, such as
      significant and persistent nodal discomfort, common and uncomfortable
      PUR, prolonged antibiotic therapy and/or corticosteroids and disease
      cause by drug-resistant organisms
    explanation: >-
      A pediatric series' discussion restating the indications.
  - reference: PMID:20209720
    reference_title: Tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgical therapy along with antituberculosis medication can be
      beneficial in selected patients.
    explanation: >-
      A review on surgery as an adjunct.
  - reference: PMID:29484929
    reference_title: "Cervical tuberculous lymphadenitis: diagnosis and demographics, a five-year case series in the UK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Open biopsy is potentially associated with complications but does not
      appear to increase chronic wound discharge rates in our series.
    explanation: >-
      The UK series on the risks of open biopsy.
- name: Aspiration or Incision and Drainage of Fluctuant Nodes
  description: >-
    Tense, fluctuant nodes and cold abscesses can be aspirated or drained for
    relief while chemotherapy continues.
  therapeutic_modality: SURGERY
  treatment_term:

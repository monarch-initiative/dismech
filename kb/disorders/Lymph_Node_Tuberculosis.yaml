- tuberculous adenitis
- scrofula
- cervical tuberculous lymphadenitis
- tuberculous lymphadenopathy
- lymph node TB
- primary tuberculous lymphadenitis
notes: >-
  The literature is retrospective single-centre series of 30 to about 200
  patients, a few randomized trials of regimen length, narrative reviews and
  a small number of meta-analyses. Lymph node mechanism is studied mostly in
  non-human primates and mice, and human data are mainly transcriptional
  profiles of excised cervical nodes; the human causal chain is inferred.
  Symptom frequencies vary widely between settings: 72% of a Taiwanese series
  and 39 of 51 patients in a UK series had no constitutional symptoms, while
  pooled African data give fever in 45%, night sweats in 55% and weight loss in
  62%, in a population in which about half of patients had HIV infection. For
  that reason no frequency is set on the systemic symptoms. Node-site
  frequencies are set from the African meta-analysis (cervical) and from
  histopathology and clinical series of peripheral disease, not from
  surgical-only or HIV-only series. The Jones-Campbell staging is taken from
  the table in a cited case report, because the 1962 paper that defined it has
  no abstract in PubMed. No HPO term exists for matted nodes, a collar-stud
  abscess or abdominal lymphadenopathy (searched in OLS as "matted", "cold
  abscess", "abdominal lymphadenopathy", "mesenteric lymphadenopathy" and
  "intra-abdominal lymphadenopathy"), so they are described rather than bound.
  Nontuberculous mycobacterial lymphadenitis has no dismech entry; the
  Mycobacterium avium complex disease stub is the nearest. MONDO's primary
  tuberculous lymphadenitis (MONDO:0957461) is recorded as a narrow mapping
  (see mappings) and its stub is removed. Seeded from PubMed searches and
  `research/Lymph_Node_Tuberculosis-deep-research-claude_code.md`.
review_notes: >-
  Deliberately lumped. All lymph node tuberculosis is kept in one entry
  whatever the infecting Mycobacterium tuberculosis complex organism, lineage
  or drug-resistance pattern. Typing series from Ethiopia, Mozambique and the
  deep-research run were searched for organism strata; M. bovis is a minor
  cause in current series, and its one documented difference, intrinsic
  pyrazinamide resistance, is recorded in the treatment description rather
  than as a stratum, because presentation and diagnosis are the same. The
  anatomical groups (peripheral, intrathoracic, abdominal) are recorded as
  subtypes because they differ in how tissue is obtained for diagnosis, not
  as separate entries; mediastinal disease is the root of the separately
  curated Esophageal_Tuberculosis entry.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacillus that causes almost all typed cases of
    lymph node tuberculosis, with the same lineages as pulmonary disease in the
    same region.
  evidence:
  - reference: PMID:26589993
    reference_title: "Mycobacterium tuberculosis causing tuberculous lymphadenitis in Maputo, Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      M. tuberculosis was the main etiological agent of TBLN in Maputo. M.
      tuberculosis genotypes were similar to the ones causing pulmonary TB,
      suggesting that in Maputo, cases of TBLN arise from the same source as
      pulmonary TB, rather than from an external zoonotic source.
    explanation: >-
      All 45 typed lymph node isolates in Maputo were M. tuberculosis.
  - reference: PMID:28919549
    reference_title: "The predominance of Ethiopian specific Mycobacterium tuberculosis families and minimal contribution of Mycobacterium bovis in tuberculous lymphadenitis patients in Southwest Ethiopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The majority of isolates (248; 81.6%) belonged to the Euro-American
      lineage (Lineage 4)
    explanation: >-
      Most of 304 lymph node isolates from Southwest Ethiopia were M.
      tuberculosis lineage 4.
- name: Mycobacterium bovis
  infectious_agent_term:
    preferred_term: Mycobacterium bovis
    term:
      id: NCBITaxon:1765
      label: Mycobacterium tuberculosis variant bovis
  description: >-
    The cattle-adapted member of the M. tuberculosis complex, acquired mainly
    from unpasteurized milk. It once caused a tenth to a fifth of lymph node
    tuberculosis in Europe and is a minor cause in current typing series. It
    is intrinsically resistant to pyrazinamide.
  evidence:
  - reference: PMID:31002716
    reference_title: "Epidemiology of tuberculous lymphadenitis in Africa: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In the past, it has been reported that 10–20% of all TBLN in Europe was
      caused by M. bovis, which was acquired from drinking unpasteurized milk
    explanation: >-
      A meta-analysis' discussion restating the historical European figure.
  - reference: PMID:28919549
    reference_title: "The predominance of Ethiopian specific Mycobacterium tuberculosis families and minimal contribution of Mycobacterium bovis in tuberculous lymphadenitis patients in Southwest Ethiopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      M. bovis was identified in only two (0.7%) TBLN cases.
    explanation: >-
      M. bovis in 2 of 304 lymph node isolates.
  - reference: PMID:26388186
    reference_title: "Mycobacterium bovis cervical lymphadenitis: A representative case and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycobacterium bovis is a tuberculosis causing bacterium that commonly
      presents with cervical lymphadenopathy.
    explanation: >-
      A case report and review naming cervical lymphadenopathy as the common
      presentation of M. bovis disease.
agent_life_cycle:
  description: >-
    M. tuberculosis passes between humans as airborne droplets and reaches the
    lymph nodes from the lung or, less often, the tonsils and adenoids. M.
    bovis is maintained in cattle and other domestic and wild animals and
    reaches humans mainly in contaminated milk.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Bos taurus
    role: reservoir of Mycobacterium bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:25886866
    reference_title: "Investigation of the high rates of extrapulmonary tuberculosis in Ethiopia reveals no single driving factor and minimal evidence for zoonotic transmission of Mycobacterium bovis infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The majority of all human TB cases are caused by Mycobacterium
      tuberculosis but the closely-related Mycobacterium bovis, the causative
      agent of TB in cattle and a range of domestic and wild animals, can also
      cause disease in humans.
    explanation: >-
      A field study's introduction naming cattle and other animals as hosts of
      M. bovis.
  - reference: PMID:26589993
    reference_title: "Mycobacterium tuberculosis causing tuberculous lymphadenitis in Maputo, Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Bovine TB is spread to humans, typically by ingestion of unpasteurized
      milk or contaminated meat, causing extrapulmonary TB
    explanation: >-
      A typing study's introduction on the zoonotic route.

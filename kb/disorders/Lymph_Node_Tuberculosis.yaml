- name: Paradoxical Upgrading Reaction During Treatment
  description: >-
    During or after adequate chemotherapy, existing nodes enlarge or new nodes,
    abscesses or sinuses appear without drug resistance or relapse. It occurs
    in about a fifth of adults with peripheral disease (23% of 109
    HIV-negative patients, after a median 46 days of treatment and lasting a
    median 67.5 days), in 17% of patients with mediastinal disease, and in
    about 9% of HIV-negative children with tuberculosis of any site. It is
    more common with HIV infection, and in mediastinal disease with age under
    55, lymphopenia and a larger node. After treatment ends, enlarging nodes
    usually contain granulomas without live bacilli and resolve without
    retreatment. It is attributed to the immune response to mycobacterial
    antigen released as bacilli are killed.
  biological_scale: TISSUE
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  evidence:
  - reference: PMID:15825042

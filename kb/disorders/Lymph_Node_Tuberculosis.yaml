    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Paradoxical expansion of adenopathy was seen in 20% of all patients and
      was more commonly noted in human immunodeficiency virus-seropositive
      patients.
    explanation: >-
      Frequency of the reaction and its link to HIV in 101 patients.

histopathology:
- name: Epithelioid granulomas with caseous necrosis
  description: >-
    Granulomatous inflammation with epithelioid cells, Langhans giant cells and
    caseous necrosis, sometimes with calcification. Necrosis or neutrophilic
    inflammation in the sample goes with a positive culture. Typical
    granulomas are less often seen with HIV infection.
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Langerhans giant cells, caseating necrosis, granulomatous inflammation
      and calcification can be seen in histopathological examination
    explanation: >-
      A review of the histological findings; the source writes Langerhans for
      Langhans.
  - reference: PMID:16267410
    reference_title: "Peripheral tuberculous lymphadenitis: epidemiology, diagnosis, treatment, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The presence of necrosis and/or neutrophilic inflammation in tissue
      samples correlated with culture positivity.
    explanation: >-
      Histological correlates of culture positivity.
- name: Acid-fast bacilli in nodal tissue
  description: >-
    Acid-fast bacilli are seen in a minority of tissue specimens and in about
    half or more of aspirates.
  evidence:
  - reference: PMID:27144076
    reference_title: "Tuberculous Lymphadenitis in South-Eastern Nigeria; A 15 Years Histopathologic Review (2000-2014)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Acid fast bacilli demonstration was positive in 15.1% (26/172) of cases
      using Ziehl-Neelsen stain.
    explanation: >-
      AFB in 15.1% of 172 biopsies.
progression:
- phase: Stage 1, discrete reactive nodes
  notes: >-
    Enlarged, firm, mobile, discrete nodes with non-specific reactive
    hyperplasia; often unnoticed because there are few other symptoms.
  evidence:
  - reference: PMID:38618370
    reference_title: Extrapulmonary Tuberculosis Presenting As Stage V Bilateral Cervical Lymphadenitis With Cortical Cerebral Watershed Infarct Along With Maxillary and Sphenoid Sinusitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Stage 1: Enlarged, firm, mobile, discrete nodes showing non-specific
      reactive hyperplasia
    explanation: >-
      The first Jones-Campbell stage.
- phase: Stage 2, matted nodes with periadenitis
  notes: >-
    Large rubbery nodes fixed to the surrounding tissue; more nodes are
    involved over weeks to months.
  evidence:
  - reference: PMID:38618370
    reference_title: Extrapulmonary Tuberculosis Presenting As Stage V Bilateral Cervical Lymphadenitis With Cortical Cerebral Watershed Infarct Along With Maxillary and Sphenoid Sinusitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Stage 2: Large rubbery nodes fixed to surrounding tissue owing to
      periadenitis
    explanation: >-
      The second Jones-Campbell stage.
- phase: Stages 3 and 4, cold abscess and collar-stud abscess
  notes: >-
    Central softening with abscess formation, then extension through the
    deep fascia as a collar-stud abscess.
  evidence:
  - reference: PMID:38618370
    reference_title: Extrapulmonary Tuberculosis Presenting As Stage V Bilateral Cervical Lymphadenitis With Cortical Cerebral Watershed Infarct Along With Maxillary and Sphenoid Sinusitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Stage 3: Central softening due to abscess formation
    explanation: >-
      The third Jones-Campbell stage.
- phase: Stage 5, sinus tract formation
  notes: >-
    The abscess discharges through the skin as a sinus.
  evidence:
  - reference: PMID:38618370
    reference_title: Extrapulmonary Tuberculosis Presenting As Stage V Bilateral Cervical Lymphadenitis With Cortical Cerebral Watershed Infarct Along With Maxillary and Sphenoid Sinusitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Stage 5: Sinus tract formation
    explanation: >-
      The fifth Jones-Campbell stage.
- phase: Treatment response, residual nodes and paradoxical reaction
  notes: >-
    Nodes regress slowly on chemotherapy; residual nodes remain in a tenth to
    a third of patients at the end of treatment, and new or enlarging nodes
    can appear during or after it without implying relapse.
  evidence:
  - reference: PMID:2196725
    reference_title: The treatment of superficial tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      At the end of chemotherapy 10% may be left with residual nodes. After
      chemotherapy nodes can enlarge or appear afresh, usually transiently.
      Such events do not imply relapse, nor does the persistence of nodes
      presage relapse.
    explanation: >-
      A review on residual and new nodes after treatment.
  - reference: PMID:2205318
    reference_title: Short course chemotherapy for tuberculous lymphadenitis in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Residual lymphadenopathy (exceeding 10 mm diameter) was present in 50
      (30%) patients at the end of treatment
    explanation: >-
      Residual nodes in 30% of 168 children at the end of six months.
clinical_burden:
  burden_level: LOW
  rationale: >-
    Lymph node tuberculosis alone is rarely fatal, and chemotherapy cures most
    patients, but nodes respond slowly, residual nodes, paradoxical reactions
    and sinuses are common, a tenth or more of patients in some series need
    prolonged treatment or relapse, and diagnosis is often delayed.
  evidence:
  - reference: PMID:16267410
    reference_title: "Peripheral tuberculous lymphadenitis: epidemiology, diagnosis, treatment, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Eighty-two percent received their entire therapy under direct
      observation, and response to antituberculous therapy was uniformly
      successful.
    explanation: >-
      All 101 treated patients responded.
  - reference: PMID:18400607
    reference_title: Clinical features and predictors of a complicated treatment course in peripheral tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fifty-six patients completed a 6-9 month course of therapy without
      relapse; 28 had a prolonged but complete treatment course, and 13
      relapsed within a mean of 8.5 months after treatment
    explanation: >-
      A complicated course in 41 of 97 patients, with low body mass index and
      bilateral cervical nodes as predictors.
diagnosis:
- name: Fine-Needle Aspiration Cytology
  description: >-
    Aspiration of an accessible node is the usual first step. Cytology shows
    epithelioid granulomas and caseous necrosis, with a reported sensitivity
    of 88% and specificity of 96%. The aspirate also goes for acid-fast
    staining, Xpert and culture; aspirate culture was positive in 62% in one
    series, so surgery is rarely needed first in immunocompetent adults.
    Granulomas are less often seen with HIV infection, so bacteriological
    confirmation matters there.
  diagnosis_term:
    preferred_term: fine-needle aspiration cytology
    term:
      id: NCIT:C15361
      label: Fine-Needle Aspiration
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The sensitivity and specificity of FNA cytology in the diagnosis of
      tuberculous lymphadenitis are 88% and 96%, respectively
    explanation: >-
      A review's figures for cytology.
  - reference: PMID:16267410
    reference_title: "Peripheral tuberculous lymphadenitis: epidemiology, diagnosis, treatment, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Given the high yield of positive cultures from fine needle aspirates,
      surgery was rarely indicated as an initial step in immunocompetent
      adults.
    explanation: >-
      The series' conclusion on aspiration before surgery.
  - reference: PMID:29484929
    reference_title: "Cervical tuberculous lymphadenitis: diagnosis and demographics, a five-year case series in the UK."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Diagnosis by fine-needle aspiration is as effective as open biopsy if
      fluid/pus is aspirated.
    explanation: >-
      The UK series' conclusion comparing aspiration with open biopsy.
- name: Acid-Fast Bacilli Staining
  description: >-
    Ziehl-Neelsen staining of aspirate or tissue is quick, cheap and specific
    but insensitive (46-78% on aspirates, lower on tissue), and concentrating
    the aspirate improves the yield.
  diagnosis_term:
    preferred_term: Ziehl-Neelsen staining for acid-fast bacilli
    term:
      id: NCIT:C23015
      label: Acid Fast Bacillae Staining Method
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ZN staining and microscopic evaluation is rapid, cheap and easy.
      Sensitivity ranges from 46–78% and the specificity is actually 100%
    explanation: >-
      A review's figures for AFB staining.
- name: Xpert MTB/RIF on Aspirate or Tissue
  description: >-
    Xpert MTB/RIF detects M. tuberculosis complex DNA and rifampicin
    resistance within hours. Pooled sensitivity is 85% and specificity 97%
    against a composite reference standard, and on aspirates sensitivity is
    87% against culture. Specificity against culture is lower (78%), partly
    because culture misses paucibacillary nodes.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF assay
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:40333873
    reference_title: "Exploring the accuracy of the Xpert MTB/RIF assay in detecting lymph node tuberculosis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The sensitivity and specificity of the Xpert MTB/RIF test were 85% and
      97%, respectively, against CRS and 85% and 78%, respectively, against
      culture.
    explanation: >-
      A diagnostic meta-analysis' pooled accuracy.
  - reference: PMID:40333873
    reference_title: "Exploring the accuracy of the Xpert MTB/RIF assay in detecting lymph node tuberculosis: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The aggregated sensitivity for Xpert MTB/RIF using FNA samples against
      culture was 87% (95% CI: 78–93%; I2: 90%), while the combined
      specificity was 77% (95% CI: 63–87%; I2: 95%)
    explanation: >-
      Pooled accuracy on aspirates.
- name: Mycobacterial Culture
  description: >-
    Culture of aspirate or tissue gives the definitive diagnosis and drug
    susceptibility, but is positive in only 10-69% and takes six to eight
    weeks, and a negative culture does not exclude the disease.
  diagnosis_term:
    preferred_term: mycobacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Isolation of mycobacterium by culture is possible in 10–69% of the
      cases
    explanation: >-
      A review's range of culture yield.
  - reference: PMID:21865192
    reference_title: Current diagnosis and management of peripheral tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Definitive diagnosis is by culture or nucleic amplification of
      Mycobacterium tuberculosis; demonstration of acid fast bacilli and
      granulomatous inflammation may be helpful.
    explanation: >-
      A review on what makes the diagnosis definitive.
- name: Excisional Lymph Node Biopsy
  description: >-
    Excision of a whole node gives the highest yield (about 80% sensitivity;
    granulomas in 88% and culture in 71% in one series) and is used when
    aspiration is negative or discordant with the clinical picture, or when
    lymphoma must be excluded.
  diagnosis_term:
    preferred_term: excisional lymph node biopsy
    term:
      id: NCIT:C51662
      label: Excisional Biopsy of Lymph Node
  evidence:
  - reference: PMID:21865192
    reference_title: Current diagnosis and management of peripheral tuberculous lymphadenitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Excisional biopsy has the highest sensitivity at 80%, but fine-needle
      aspiration is less invasive and may be useful, especially in
      immunocompromised hosts and in resource-limited settings.
    explanation: >-
      A review comparing biopsy with aspiration.
  - reference: PMID:16267410
    reference_title: "Peripheral tuberculous lymphadenitis: epidemiology, diagnosis, treatment, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Positive cultures for Mycobacterium tuberculosis were obtained from 62%
      of fine needle aspirate samples and 71% of excisional biopsies.
    explanation: >-
      Culture yield of aspirates and biopsies.
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Histopathologic examination and PCR of an excisional biopsy should be
      recommended only for patients in whom FNA-PCR is negative or when there
      is discrepancy with the clinical impression
    explanation: >-
      A review on when to biopsy.
- name: Endosonography-Guided Needle Aspiration of Mediastinal Nodes
  description: >-
    Endobronchial or endoscopic ultrasound-guided needle aspiration samples
    mediastinal nodes and has made intrathoracic lymph node tuberculosis much
    easier to diagnose.
  diagnosis_term:
    preferred_term: endobronchial ultrasound-guided transbronchial needle aspiration
    term:
      id: NCIT:C67286
      label: Ultrasound-Guided Transbronchial Needle Aspiration
  evidence:
  - reference: PMID:38050909
    reference_title: "Clinical Course of Patients With Mediastinal Lymph Node Tuberculosis and Risk Factors for Paradoxical Responses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Although diagnosis of mediastinal LNTB has become much easier with the
      development of endosonography, limited information is available.
    explanation: >-
      A mediastinal series' introduction on endosonographic diagnosis.
- name: Neck Ultrasound
  description: >-
    Ultrasound shows an absent hilum, a short-to-long axis ratio of at least
    0.5, unclear edges, necrosis, an echogenic thin layer, calcific strong
    echoes, perinodal edema, abscess and sinus, and a capsular or peripheral
    vascular pattern. It is used in children and to follow treatment.
  diagnosis_term:
    preferred_term: ultrasound imaging of the neck
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:34472036
    reference_title: Role of ultrasound in the diagnosis of cervical tuberculous lymphadenitis in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The ultrasonic signs of hilus absence, S/L ratio ≥ 0.5, unclear edge,
      necrosis, echogenic thin layer, strong echoes and capsular or peripheral
      vascularity may aid in the diagnosis of cervical tuberculous
      lymphadenitis.
    explanation: >-
      Ultrasound features in 348 nodes of 57 children.
- name: Computed Tomography
  description: >-
    CT shows the sites and extent of disease and three patterns: homogeneous
    nodes early, nodes with a necrotic centre and enhancing rim (the
    commonest), and fibrocalcified nodes after treatment. It is the preferred
    test for abdominal nodes, where ultrasound is limited by bowel gas.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:28058405
    reference_title: "Diagnostic challenges in cervical tuberculous lymphadenitis: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There are three patterns of nodal involvement in tuberculosis
      lymphadenitis on CT or MR images
    explanation: >-
      A review of the cross-sectional imaging patterns.
  - reference: PMID:41300955
    reference_title: "Clinical and CT Features of HIV-Negative and HIV-Positive Patients with Abdominal Tuberculous Lymphadenopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In this context, ultrasound is limited by bowel gas interference, while
      CT is the preferred modality for assessing the extent and
      characteristics of abdominal lymphadenopathy, despite its nonspecific
      findings
    explanation: >-
      A CT series' introduction on imaging abdominal nodes.
- name: Tuberculin Skin Test
  description: >-
    The tuberculin skin test is positive in almost all HIV-negative patients
    but does not separate tuberculous from nontuberculous mycobacterial
    lymphadenitis, which also gives positive results.
  diagnosis_term:
    preferred_term: tuberculin skin test
    term:
      id: NCIT:C85994

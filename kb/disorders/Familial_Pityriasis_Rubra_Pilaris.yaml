      reference_title: CARD14 Gain-of-Function Mutation Alone Is Sufficient to Drive IL-23/IL-17-Mediated Psoriasiform Skin Inflammation In Vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Disease pathogenesis was driven by the IL-23/IL-17 axis, and neutralization of IL-23p19, the key cytokine in maintaining T helper type 17 cell polarization, significantly reduced skin lesions and the expression of antimicrobial peptides and proinflammatory cytokines."

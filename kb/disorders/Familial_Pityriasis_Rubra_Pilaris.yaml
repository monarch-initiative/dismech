    reference_title: Altered replication stress response due to CARD14 mutations promotes recombination-induced revertant mosaicism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that heterozygous pathogenic CARD14 mutations causing autoinflammatory skin diseases, including psoriasis and pityriasis rubra pilaris, are repaired mainly via homologous recombination."
    explanation: >-
      Revertant patches in CARD14-mutant patients, including PRP, arise by homologous
      recombination.
  - reference: PMID:34004138
    reference_title: Altered replication stress response due to CARD14 mutations promotes recombination-induced revertant mosaicism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rather than altering the DNA damage response to exogenous stimuli, such as X-irradiation or etoposide treatment, mutant CARD14 increased DNA double-strand breaks under conditions of replication stress."
    explanation: >-
      The cellular mechanism proposed for the reversion events, from cultured cells.

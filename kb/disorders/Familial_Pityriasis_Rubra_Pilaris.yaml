    directness: INDIRECT
    snippet: "CARD14 activates nuclear factor kappa B (NF-kB), and compared with wild-type CARD14, the p.Gly117Ser and p.Glu138Ala substitutions were shown to lead to enhanced NF-kB activation and upregulation of a subset of psoriasis-associated genes in keratinocytes."
    explanation: >-

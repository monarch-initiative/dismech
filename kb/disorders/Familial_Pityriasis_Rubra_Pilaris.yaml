- name: Replication Stress-Driven Revertant Mosaicism
  biological_scale: CELLULAR
  description: >-
    In some patients, clinically normal skin patches arise in which the epidermis has
    lost the germline CARD14 mutation, mostly through copy-neutral loss of
    heterozygosity of 17q. Mutant CARD14 increases double-strand breaks under
    replication stress and suppresses new origin firing, favouring break-induced
    replication; this is a somatic compensatory branch, not part of the pathogenic
    chain, and is observed rather than therapeutically exploitable.
  cell_types:

pathophysiology:
- name: CARD14 Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense, in-frame deletion or splice-site variants clustered in the
    coiled-coil domain of CARD14 (CARMA2), the skin-restricted member of the CARMA
    scaffold family. The variants disrupt the autoinhibitory contact between the linker
    region and the CARD/coiled-coil domains, so that the mutant scaffold signals without
    an upstream stimulus. Gain of function is demonstrated biochemically for the
    psoriasis alleles p.Glu138Ala and p.Gly117Ser (the latter also a PRP allele) and
    inferred for the other PRP alleles from their position in the same domain and the
    NF-kappaB activation seen in patient skin.
  notes: >-
    GO:0035591 signaling adaptor activity is CARD14's QuickGO molecular-function
    annotation (Q9BXL6, IBA). The modifier is GAIN_OF_FUNCTION rather than INCREASED
    because the mutant scaffold has escaped its linker-region autoinhibition and
    signals independently of any upstream stimulus, a qualitative change in
    regulatory control.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Dominant, usually inherited but sometimes de novo; one homozygous p.Gly117Ser CAPE
      proband was more severely affected than her heterozygous relatives.

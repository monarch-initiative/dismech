    explanation: >-
      Skin-restricted expression places the lesion in keratinocytes.
  - reference: PMID:27071417
    reference_title: Psoriasis mutations disrupt CARD14 autoinhibition promoting BCL10-MALT1-dependent NF-κB activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "These alterations disrupted the inhibitory effect of the CARD14 linker region (LR) on NF-κB activation by facilitating BCL10 binding."
    explanation: >-
      Loss of linker-region autoinhibition shown for the psoriasis alleles p.Glu138Ala
      and p.Gly117Ser; the latter also causes type V PRP, and the PRP-specific alleles
      lie in the same coiled-coil region, so the mechanism is inferred for them.
  - reference: PMID:29980436
    reference_title: Gain-of-Function Mutation of Card14 Leads to Spontaneous Psoriasis-like Skin Inflammation through Enhanced Keratinocyte Response to IL-17A.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Here we showed that Card14E138A/+ and Card14ΔQ136/+ mice developed spontaneous psoriasis-like skin inflammation, which resulted from constitutively activated CARMA2 via self-aggregation leading to the enhanced activation of the IL-23-IL-17A cytokine axis."
    explanation: >-
      Constitutive self-aggregation of mutant CARMA2 in knock-in mice carrying
      psoriasis alleles from the same domain.
  downstream:
  - target: Constitutive CARD14-BCL10-MALT1 Complex Assembly
    causal_link_type: DIRECT
    description: >-
      With autoinhibition lost, the mutant scaffold binds BCL10 and recruits MALT1
      without any receptor stimulus.
    evidence:
    - reference: PMID:27071417
      reference_title: Psoriasis mutations disrupt CARD14 autoinhibition promoting BCL10-MALT1-dependent NF-κB activation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast with wild-type CARD14, CARD14(E138A) and CARD14(G117S) psoriasis mutants interacted constitutively with BCL10 and MALT1, and triggered BCL10- and MALT1-dependent activation of NF-κB in keratinocytes."
      explanation: >-
        Constitutive BCL10 and MALT1 binding by activating CARD14 alleles, including p.Gly117Ser.
  - target: Replication Stress-Driven Revertant Mosaicism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mutant CARD14 increases double-strand breaks under replication stress, which
      favours recombination-mediated loss of the mutant allele in epidermal clones.
    evidence:
    - reference: PMID:34004138
      reference_title: Altered replication stress response due to CARD14 mutations promotes recombination-induced revertant mosaicism.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Rather than altering the DNA damage response to exogenous stimuli, such as X-irradiation or etoposide treatment, mutant CARD14 increased DNA double-strand breaks under conditions of replication stress."
      explanation: >-
        The replication-stress lesion that feeds recombination-mediated reversion.
- name: Constitutive CARD14-BCL10-MALT1 Complex Assembly
  biological_scale: MOLECULAR
  description: >-
    Mutant CARD14 constitutively associates with BCL10 and the paracaspase MALT1 to
    form a CBM-type signalosome in keratinocytes, the counterpart of the
    CARD11-BCL10-MALT1 complex formed in lymphocytes after antigen-receptor
    stimulation. The complex engages IKK and also activates MALT1 protease activity,
    which cleaves negative regulators of NF-kappaB; MALT1 deficiency or inhibition
    blunts mutant CARD14 signalling in keratinocytes and in mice.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  cellular_components:
  - preferred_term: CARD14-BCL10-MALT1 (CBM) complex
    modifier: INCREASED
    term:
      id: GO:0032449
      label: CBM complex
  genes:

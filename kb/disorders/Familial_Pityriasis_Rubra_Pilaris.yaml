animal_models:
- name: Card14 C127S knock-in mouse (PRP allele)
  species: Mouse
  genotype: Card14 c.380G>C (p.Cys127Ser) knock-in, homozygous (heterozygotes show milder, transient disease)
  publication: PMID:39159782
  description: >-
    The first mouse carrying a PRP-causing human allele. Homozygotes develop generalized
    scaling, hair-follicle dilatation and plugging, palmoplantar hyperkeratosis,
    markedly increased transepidermal water loss, IL-36/inflammasome and IL-17-axis
    activation in the outer root sheath and interfollicular epidermis, and high neonatal
    mortality; anti-IL-17A improves inflammation but not barrier function. Heterozygotes,
    the genotype that matches patients, have mild transient disease.
  notes: >-
    The peer-reviewed report is PMID:39159782 (J Invest Dermatol 2025). The quoted
    sentences are from the authors' 2023 Research Square preprint of the same study
    (DOI:10.21203/rs.3.rs-2513325/v1), which reports the same allele, genotype and
    anti-IL-17A result.
  evidence:
  - reference: DOI:10.21203/rs.3.rs-2513325/v1
    reference_title: IL-17 axis is a significant driver of skin inflammation in Card14 mutant pityriasis rubra pilaris model mice
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We report the first mouse model of PRP to carry a homozygous knock-in mutation, c.380G>C (p.Cys127Ser) corresponding to a PRP-causative human mutation, in CARD14."
    explanation: >-
      Establishes the model: a knock-in of a human PRP-causing CARD14 allele.
  modeled_mechanisms:
  - target: Epidermal Hyperproliferation and Abnormal Cornification
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Follicular plugging, follicle dilatation and palmoplantar hyperkeratosis, the
      histological core of the human disease.
    limitations: >-
      The full phenotype requires homozygosity, whereas patients are heterozygous;
      heterozygous mice have only mild, self-resolving disease.
    evidence:
    - reference: DOI:10.21203/rs.3.rs-2513325/v1
      reference_title: IL-17 axis is a significant driver of skin inflammation in Card14 mutant pityriasis rubra pilaris model mice
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Card14C127S/C127S knock-in mice recapitulate key aspects of human PRP, including hair follicle dilatation, follicular plugs, and palmoplantar hyperkeratosis"
      explanation: >-
        The follicular and palmoplantar phenotype of the homozygous knock-in.
  - target: IL-23/IL-17 Axis Amplification
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      IL-17 axis activation in follicular and interfollicular epidermis, and clinical
      improvement with anti-IL-17A antibody.
    limitations: >-
      Anti-IL-17A improved inflammation but not transepidermal water loss, so
      inflammation and barrier dysfunction are separable in this model.
    evidence:
    - reference: DOI:10.21203/rs.3.rs-2513325/v1
      reference_title: IL-17 axis is a significant driver of skin inflammation in Card14 mutant pityriasis rubra pilaris model mice
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Administering anti-IL-17A neutralizing antibody significantly attenuates the skin symptoms in mutant mice."
      explanation: >-
        IL-17A dependence of the model's skin disease.
- name: Card14 delta-E138 knock-in mouse (psoriasis allele)
  species: Mouse
  genotype: Card14 p.Glu138del knock-in, heterozygous
  publication: PMID:29689250
  description: >-
    Heterozygous knock-in of a psoriasis-associated gain-of-function allele from the
    same coiled-coil region. Mice spontaneously develop chronic psoriasiform scaling,
    epidermal thickening, keratinocyte hyperproliferation and a neutrophil- and
    T-cell-rich infiltrate driven by the IL-23/IL-17 axis; IL-23p19 neutralisation
    reduces disease. Related Card14 E138A knock-ins show that the disease is
    keratinocyte-intrinsic and depends on the CBM complex.
  evidence:
  - reference: PMID:29689250
    reference_title: CARD14 Gain-of-Function Mutation Alone Is Sufficient to Drive IL-23/IL-17-Mediated Psoriasiform Skin Inflammation In Vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we report that heterozygous mice harboring a CARD14 gain-of-function mutation (Card14ΔE138) spontaneously develop a chronic psoriatic phenotype with characteristic scaling skin lesions, epidermal thickening, keratinocyte hyperproliferation, hyperkeratosis, and immune cell infiltration."
    explanation: >-
      Establishes the model: a heterozygous knock-in of a psoriasis-associated
      CARD14 gain-of-function allele with spontaneous skin disease.
  modeled_mechanisms:
  - target: IL-23/IL-17 Axis Amplification
    relationship: PARTIALLY_RECAPITULATES

treatments:
- name: Ustekinumab (IL-12/IL-23 p40 blockade)
  description: >-
    The best-documented therapy: near-complete clearance in 5 of 6 treated subjects in
    the 15-kindred series and in several familial PRP families, often after failure of
    retinoids, methotrexate and TNF inhibitors. Weight-based or more frequent dosing
    than the psoriasis label has been needed to maintain response.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ustekinumab
      term:
        id: NCIT:C84237
        label: Ustekinumab
  target_mechanisms:
  - target: IL-23/IL-17 Axis Amplification
    treatment_effect: INHIBITS
    description: Binds the shared p40 subunit of IL-12 and IL-23, removing the IL-23 signal that maintains the type 17 response.
    evidence:
    - reference: PMID:29477734
      reference_title: "CARD14-associated papulosquamous eruption: A spectrum including features of psoriasis and pityriasis rubra pilaris."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notable is the near complete response to ustekinumab in 5 of 6 subjects treated and partial response in the sixth (subject 5), who had the most severe phenotype and was also notably the heaviest and thus may have required a higher dosage."
      explanation: >-
        Clinical response to p40 blockade as evidence that the axis drives the disease.
  evidence:
  - reference: PMID:29477734
    reference_title: "CARD14-associated papulosquamous eruption: A spectrum including features of psoriasis and pityriasis rubra pilaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notable is the near complete response to ustekinumab in 5 of 6 subjects treated and partial response in the sixth (subject 5), who had the most severe phenotype and was also notably the heaviest and thus may have required a higher dosage."

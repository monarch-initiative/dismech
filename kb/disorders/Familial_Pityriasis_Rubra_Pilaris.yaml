    term:
      id: hgnc:6819
      label: MALT1
  evidence:
  - reference: PMID:27071417
    reference_title: Psoriasis mutations disrupt CARD14 autoinhibition promoting BCL10-MALT1-dependent NF-κB activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast with wild-type CARD14, CARD14(E138A) and CARD14(G117S) psoriasis mutants interacted constitutively with BCL10 and MALT1, and triggered BCL10- and MALT1-dependent activation of NF-κB in keratinocytes."
    explanation: >-
      Constitutive CBM assembly by mutant CARD14 in keratinocytes, including the
      p.Gly117Ser allele shared with type V PRP.
  - reference: PMID:27113748
    reference_title: The paracaspase MALT1 mediates CARD14-induced signaling in keratinocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, we demonstrate that CARD14 physically interacts with paracaspase MALT1 and activates MALT1 proteolytic activity and inflammatory gene expression, which are enhanced by psoriasis-associated CARD14 mutations."
    explanation: >-
      Physical CARD14-MALT1 interaction and MALT1 protease activation, enhanced by
      activating alleles.
  - reference: PMID:33419765
    reference_title: Intrinsic Abnormalities of Keratinocytes Initiate Skin Inflammation through the IL-23/T17 Axis in a MALT1-Dependent Manner.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Targeting CBM complex by conditional deletion of MALT1 or BCL10 in keratinocytes abrogated both the cutaneous and systemic inflammation of heterozygous Card14 E138A/+ mice."
    explanation: >-
      Genetic requirement for the keratinocyte CBM complex in a CARD14 knock-in model.
  downstream:
  - target: Keratinocyte NF-kappaB Hyperactivation
    causal_link_type: DIRECT
    description: >-
      The assembled CBM signalosome activates IKK, and MALT1 protease activity removes
      NF-kappaB inhibitors, giving sustained canonical NF-kappaB signalling.
    evidence:
    - reference: PMID:27071417
      reference_title: Psoriasis mutations disrupt CARD14 autoinhibition promoting BCL10-MALT1-dependent NF-κB activation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast with wild-type CARD14, CARD14(E138A) and CARD14(G117S) psoriasis mutants interacted constitutively with BCL10 and MALT1, and triggered BCL10- and MALT1-dependent activation of NF-κB in keratinocytes."
      explanation: >-
        NF-kappaB activation by mutant CARD14 requires BCL10 and MALT1.
- name: Keratinocyte NF-kappaB Hyperactivation
  biological_scale: CELLULAR
  description: >-
    Canonical NF-kappaB is constitutively active in CARD14-mutant keratinocytes, with
    nuclear p65 demonstrable in lesional familial PRP skin. ERK1/2 and p38 MAP kinase
    activation accompanies NF-kappaB and is needed for maximal target-gene induction.
    Because CARD14 also transduces IL-17A signalling through the ACT1-TRAF6 complex,
    mutant keratinocytes respond more strongly to the IL-17A that the downstream immune
    response produces, closing a feed-forward loop.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte

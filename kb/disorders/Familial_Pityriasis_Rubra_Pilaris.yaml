    same region that carries the PSORS2 psoriasis alleles; the two diseases are allelic
    and the same gene is curated as causative for PSORS2 familial psoriasis in the
    Psoriasis entry. ClinGen has not classified the CARD14-PRP pair, so no
    gene_disease_validity tier is recorded.

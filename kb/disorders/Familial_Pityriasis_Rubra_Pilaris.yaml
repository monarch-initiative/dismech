- name: Epidermal Hyperproliferation and Abnormal Cornification
  biological_scale: TISSUE
  description: >-
    Acanthosis with broad rete ridges, alternating vertical and horizontal
    orthokeratosis and parakeratosis (checkerboard pattern), hypergranulosis,
    follicular plugging and dilated papillary vessels, with a superficial lymphocytic
    infiltrate. The Card14 C127S knock-in mouse reproduces hair-follicle dilatation,
    follicular plugs and palmoplantar hyperkeratosis and shows reduced filaggrin
    expression with barrier dysfunction.

- name: Checkerboard parakeratosis with follicular plugging
  category: Histopathologic
  frequency: VERY_FREQUENT
  description: >-
    Alternating vertical and horizontal orthokeratosis and parakeratosis, acanthosis
    without acantholysis, dilated papillary vessels and, in some biopsies, follicular
    plugging; the pattern favours PRP over psoriasis and was found consistently in
    biopsies from genotyped patients.
  phenotype_term:
    preferred_term: Checkerboard parakeratosis
    term:
      id: HP:0001036
      label: Parakeratosis
  evidence:
  - reference: PMID:31849081
    reference_title: Histopathologic findings characteristic of CARD14-associated papulosquamous eruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesional skin biopsies from patients with CARD14-associated papulosquamous eruption consistently showed alternating checkerboard parakeratosis and orthokeratosis, acanthosis without acantholysis, and dilated vessels in the dermal papillae, with some cases also showing follicular plugging."
    explanation: >-
      The defining histopathology in genotyped patients.
  - reference: PMID:31849081
    reference_title: Histopathologic findings characteristic of CARD14-associated papulosquamous eruption.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CARD14-associated papulosquamous eruption has a range of findings, with a predominance of features typically associated with pityriasis rubra pilaris."
    explanation: >-
      The histology favours PRP over psoriasis.
progression:
- phase: Infantile onset
  age_range: Birth to 3 years (4 to 36 months in the gene-discovery kindreds; before 1 year in most CARD14 index cases)
  notes: >-
    Facial erythema and scale usually precede truncal and palmoplantar disease.
  evidence:
  - reference: PMID:29477734
    reference_title: "CARD14-associated papulosquamous eruption: A spectrum including features of psoriasis and pityriasis rubra pilaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the exception of 2 subjects, all had onset of their disease at or before one year of age."
    explanation: >-
      Onset timing in the 15-kindred series.
  - reference: PMID:34448248
    reference_title: "CARD14-associated papulosquamous eruption (CAPE) in pediatric patients: Three additional cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with CARD14 mutations can be distinguished from more common forms of psoriasis and acquired PRP by the early age of onset (primarily before 1 year of age), prominent facial involvement (cheeks, chin and ears), frequent family history of psoriasis or PRP, and limited response to conventional topical and systemic therapies for psoriasis or PRP."
    explanation: >-
      Early onset as a distinguishing feature of CARD14-related disease.
- phase: Chronic persistent course
  age_range: Childhood through adult life
  notes: >-
    Unlike classic adult (type I) PRP, which usually remits within a few years, the
    familial form persists lifelong without treatment, with flares during intercurrent
    infection; somatic revertant patches can appear but do not generalise.
  evidence:
  - reference: PMID:29477734
    reference_title: "CARD14-associated papulosquamous eruption: A spectrum including features of psoriasis and pityriasis rubra pilaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None has experienced remission of disease without treatment."
    explanation: >-
      No spontaneous remission in 15 kindreds.
  - reference: PMID:33431438
    reference_title: "Identification of a pathogenic CARD14 mutation in a 70-year-old woman with pityriasis rubra pilaris: when genetic diagnosis influences choice of treatment strategy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a case of lifelong PRP in a 70-year-old woman, where genetic testing revealed a heterozygote missense variant c.412G>A, p.(Glu138Lys) in CARD14."
    explanation: >-
      Lifelong persistence into the eighth decade.
diagnosis:
- name: CARD14 sequencing
  description: >-
    Sequencing of CARD14 coding exons and splice junctions (single-gene, keratinization
    panel or exome) in a child with early-onset papulosquamous disease, prominent facial
    involvement, a family history of PRP or psoriasis, and poor response to conventional
    therapy; deep sequencing of lesional skin can detect mosaic alleles missed in blood.
  diagnosis_term:
    preferred_term: CARD14 gene sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29477734
    reference_title: "CARD14-associated papulosquamous eruption: A spectrum including features of psoriasis and pityriasis rubra pilaris."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects with clinical features suggestive of CAPE should undergo CARD14 sequencing and may benefit from treatment with ustekinumab."
    explanation: >-
      Recommendation for CARD14 sequencing from the largest genotyped series.
  - reference: PMID:40433052
    reference_title: Clinical Characteristics of CARD14-Associated Papulosquamous Eruption and Evaluation of Therapeutic Efficacy of Secukinumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

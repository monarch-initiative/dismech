discussions:
- discussion_id: fprp_hom_mouse_vs_het_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the Card14 C127S knock-in mouse need homozygosity to show PRP-like
    disease, when every reported patient with the same allele is heterozygous, and
    does the heterozygous mouse's transient disease mean mouse skin buffers CARD14
    gain of function more effectively than human skin?
  rationale: >-
    The only PRP-allele model recapitulates follicular plugging and palmoplantar
    hyperkeratosis in homozygotes, with early mortality and barrier failure that have
    no human counterpart, while heterozygous mice resolve by 6-7 weeks. Mechanism
    claims drawn from the model (IL-36/inflammasome activation, barrier loss) may
    reflect the doubled allele dose rather than the human disease state.
  attaches_to:
  - pathophysiology#Epidermal Hyperproliferation and Abnormal Cornification
  - pathophysiology#IL-23/IL-17 Axis Amplification
  evidence:
  - reference: DOI:10.21203/rs.3.rs-2513325/v1
    reference_title: IL-17 axis is a significant driver of skin inflammation in Card14 mutant pityriasis rubra pilaris model mice
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We report the first mouse model of PRP to carry a homozygous knock-in mutation, c.380G>C (p.Cys127Ser) corresponding to a PRP-causative human mutation, in CARD14."
    explanation: >-
      The model that recapitulates PRP is homozygous for an allele that is
      heterozygous in every reported patient.
  - reference: PMID:27760266
    reference_title: Pityriasis Rubra Pilaris Type V as an Autoinflammatory Disease by CARD14 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2 de novo novel mutations (p.Cys127Ser and p.Gln136Leu), and another previously reported mutation (p.Gly117Ser)"
    explanation: >-
      The human p.Cys127Ser case was heterozygous and de novo.
  posed_by: dismech curation
  posed_date: "2026-10-23T00:00:00Z"
- discussion_id: fprp_allele_phenotype_prp_vs_psoriasis
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a CARD14 gain-of-function allele produces PRP-like,
    psoriasis-like or mixed disease, given that p.Gly117Ser causes both and that
    members of one kindred can carry the same allele with different phenotypes?
  rationale: >-
    The functional studies cited in this entry compare each CARD14 allele with wild
    type, not PRP alleles with psoriasis alleles, so they cannot say whether the two
    phenotypes differ biochemically; and none of them tests a modifier locus. Until a
    study does, the familial PRP and PSORS2 entries rest on clinical rather than
    mechanistic separation.
  attaches_to:
  - pathophysiology#CARD14 Gain-of-Function Variant
  - genetic#CARD14
  evidence:
  - reference: PMID:22703878
    reference_title: Familial pityriasis rubra pilaris is caused by mutations in CARD14.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present data demonstrate that autosomal-dominant PRP is allelic to familial psoriasis, which was recently shown to also be caused by mutations in CARD14."
    explanation: >-
      The allelism that makes the PRP-versus-psoriasis determinant an open question.
  - reference: PMID:27760266
    reference_title: Pityriasis Rubra Pilaris Type V as an Autoinflammatory Disease by CARD14 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "another previously reported mutation (p.Gly117Ser)"
    explanation: >-
      The PSORS2 psoriasis allele p.Gly117Ser recurring in a type V PRP patient.
  posed_by: dismech curation
  posed_date: "2026-10-23T00:00:00Z"

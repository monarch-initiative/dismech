name: Familial Pityriasis Rubra Pilaris
creation_date: "2026-10-13T12:00:00Z"
category: Mendelian
description: >-
  Familial pityriasis rubra pilaris is the autosomal dominant, CARD14-defined form of
  pityriasis rubra pilaris (PRP), corresponding to Griffiths type V (atypical juvenile)
  PRP and the PRP-like end of the CARD14-associated papulosquamous eruption (CAPE)
  spectrum. Heterozygous gain-of-function CARD14 variants, clustered in and around the
  coiled-coil domain, break the autoinhibition of the keratinocyte scaffold CARD14 so
  that it constitutively assembles with BCL10 and MALT1 and activates NF-kappaB. The
  resulting keratinocyte chemokine and cytokine output recruits and amplifies an
  IL-23/IL-17 response, producing infantile-onset follicular hyperkeratosis, orange-red
  scaling plaques with islands of sparing, prominent facial erythema and palmoplantar
  keratoderma that respond poorly to conventional psoriasis therapy but well to IL-12/23
  and IL-17A blockade. This entry is scoped to the CARD14-defined familial form. The
  sporadic clinical types of PRP (Griffiths types I-IV and the HIV-associated type VI)
  have no single conserved mechanism and are out of scope here; the broader concept
  pityriasis rubra pilaris (MONDO:0100017) is mapped only as a broad match. CARD14
  gain-of-function variants also cause PSORS2 familial psoriasis, which is curated in
  the Psoriasis entry and cross-referenced rather than duplicated.
disease_term:
  preferred_term: familial pityriasis rubra pilaris
  term:
    id: MONDO:0008251

  - reference: PMID:29980436
    reference_title: Gain-of-Function Mutation of Card14 Leads to Spontaneous Psoriasis-like Skin Inflammation through Enhanced Keratinocyte Response to IL-17A.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CARMA2, mainly expressed in keratinocytes, associates with the ACT1-TRAF6 signaling complex and mediates IL-17A-induced NF-κB and MAPK signaling pathway activation, which leads to expression of pro-inflammatory factors."
    explanation: >-
      CARD14 sits in the keratinocyte IL-17A pathway, so the mutant amplifies the
      cytokine response it initiates.
  downstream:
  - target: Keratinocyte Chemokine and Cytokine Production
    causal_link_type: DIRECT
    description: >-
      NF-kappaB drives transcription of CCL20, CXCL8, IL1B, IL36G and antimicrobial
      peptides in the mutant keratinocyte.
    evidence:
    - reference: PMID:22521418
      reference_title: PSORS2 is due to mutations in CARD14.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "CARD14 activates nuclear factor kappa B (NF-kB), and compared with wild-type CARD14, the p.Gly117Ser and p.Glu138Ala substitutions were shown to lead to enhanced NF-kB activation and upregulation of a subset of psoriasis-associated genes in keratinocytes."
      explanation: >-

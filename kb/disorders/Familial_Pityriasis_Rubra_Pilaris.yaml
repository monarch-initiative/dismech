- name: IL-17 blockade (secukinumab, ixekizumab, bimekizumab)
  description: >-
    Secukinumab gave 84.6%, 76.9% and 68.8% PASI improvement at 52 weeks in three
    genotyped children, and ixekizumab produced rapid clearance in genotyped type V
    patients, although one subject in the 15-kindred series had only a partial
    response to ixekizumab. Three adult CAPE patients reported in the literature
    improved on the IL-17A/F inhibitor bimekizumab. In the Card14 C127S mouse
    anti-IL-17A reduced inflammation without restoring barrier function.
  therapeutic_modality: MONOCLONAL_ANTIBODY

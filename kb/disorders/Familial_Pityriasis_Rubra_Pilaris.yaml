    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      The MONDO parent concept covers all six Griffiths clinical types of PRP; this
      entry covers only the CARD14-defined familial (type V) form.
synonyms:
- hereditary pityriasis rubra pilaris
- pityriasis rubra pilaris, familial type
- PRP type V (atypical juvenile)
- atypical juvenile pityriasis rubra pilaris
- CARD14-associated papulosquamous eruption, PRP-like
parents:
- Hereditary skin disorder
notes: >-
  Orphanet has no familial-specific PRP record, so no ORPHA: structured-source row is
  cited. ClinGen has not published a gene-disease validity assertion for CARD14 in
  pityriasis rubra pilaris, so gene_disease_validity is left absent rather than
  assigned. No GeneReviews chapter exists for this disease (offline Bookshelf index,
  2026-09-10 snapshot). The guselkumab, ixekizumab and secukinumab single-arm trials in
  adult PRP (NCT03975153, NCT03485976, NCT03342573) enrolled no participants with
  pathogenic CARD14 variants and are therefore not recorded as trials of this disease.
  Onset is infantile (4 to 36 months in the gene-discovery kindreds, before one year in
  most CARD14 index cases) and is recorded under progression; HP:0003593 Infantile onset
  is a clinical-course modifier outside the PhenotypeTerm enum and is not bound as a
  phenotype.

discussions:
- discussion_id: hh7_hypomorphic_homozygote_penetrance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#GNRHR
  - phenotypes#Hypogonadotropic Hypogonadism
  prompt: >-
    How often do people homozygous for Gln106Arg or Arg262Gln, or carrying the two together,
    have clinically recognized hypogonadotropic hypogonadism?
  rationale: >-
    Both alleles are partial loss-of-function variants and are classified pathogenic. In
    gnomAD v4.1 Gln106Arg has an allele frequency of 0.0035 with 10 homozygotes and Arg262Gln
    0.0015 with 7 homozygotes, in a resource that excludes people known to have severe
    paediatric disease but not adults with delayed puberty or infertility. The clinical
    reports of homozygous Gln106Arg are at the mild end: a man with normal testicular volume
    whose hypogonadism reversed, and a woman who conceived spontaneously. Penetrance of these
    genotypes has not been measured in an unselected population, so the risk to a person found
    to carry them, for example on carrier screening or in a sibling of a patient, is not known.
    The same uncertainty bears on reversal: recovery is reported mainly with these alleles,
    and it is unclear whether it reflects maturation of GnRH output that overcomes a partly
    working receptor.
  evidence:
  - reference: PMID:12057744
    reference_title: Spontaneous pregnancy in a patient who was homozygous for the Q106R mutation in the gonadotropin-releasing hormone receptor gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "who achieved a spontaneous pregnancy 3 months after oral contraceptive pill (OCP) withdrawal"
    explanation: A woman homozygous for Gln106Arg who ovulated and conceived without treatment.
  - reference: PMID:11397842
    reference_title: "The fertile eunuch variant of idiopathic hypogonadotropic hypogonadism: spontaneous reversal associated with a homozygous mutation in the gonadotropin-releasing hormone receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following cessation of hCG therapy, the patient demonstrated reversal of his hypogonadotropism as evidenced by normal adult male testosterone levels and the appearance of pulsatile luteinizing hormone secretion."
    explanation: Reversal in a man homozygous for Gln106Arg.
- discussion_id: hh7_monoallelic_variants
  kind: OPEN_QUESTION
  attaches_to:
  - mechanistic_hypotheses#dominant_negative_er_retention
  - pathophysiology#Dominant-Negative Retention of Wild-Type Receptor
  prompt: >-
    Do single heterozygous GNRHR variants contribute to GnRH deficiency, and if so is
    retention of the wild-type receptor by a misfolded mutant the mechanism?
  rationale: >-
    Heterozygous rare GNRHR variants are more frequent in patients with GnRH deficiency than
    in controls, and a heterozygous Arg262Gln was found in a woman with functional hypothalamic
    amenorrhea. In biallelic patients severity follows the genotype; in monoallelic patients it
    does not, which the authors of the largest series read as evidence for unidentified
    genetic or environmental cofactors. Misfolded mutants retain the wild-type receptor in
    transfected cells, which would be one way for a single allele to matter. Three
    observations argue against that as a general explanation: carriers of misfolding alleles
    and of a nonsense allele are unaffected in the reported families; Arg262Gln, the allele
    found in the amenorrhea study, is a coupling variant and is not reported to misfold; and
    the effect has only been shown at the expression levels of transfected cells.
  evidence:
  - reference: PMID:22745237
    reference_title: "When genetic load does not correlate with phenotypic spectrum: lessons from the GnRH receptor (GNRHR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of heterozygous rare sequence variants in GNRHR was significantly higher in probands vs. controls (P < 0.01)."
    explanation: Enrichment of heterozygous variants in patients.
  - reference: PMID:22745237
    reference_title: "When genetic load does not correlate with phenotypic spectrum: lessons from the GnRH receptor (GNRHR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these data indicate that as-yet-unidentified genetic and/or environmental factors may combine with singly mutated GNRHR alleles to produce reproductive phenotypes"
    explanation: The authors conclude that a single allele needs a cofactor.
  - reference: PMID:21247312
    reference_title: A genetic basis for functional hypothalamic amenorrhea.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one in the GnRH receptor gene GNRHR (R262Q)"
    explanation: A heterozygous Arg262Gln among women with functional hypothalamic amenorrhea.
- discussion_id: hh7_dominant_negative_species_difference
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Dominant-Negative Retention of Wild-Type Receptor
  - pathophysiology#GnRH Receptor Misfolding and Endoplasmic Reticulum Retention
  prompt: >-
    Can rodents be used to test whether a misfolded GnRH receptor mutant impairs the wild-type
    receptor in heterozygotes, given that the human receptor traffics less efficiently than
    rodent receptors?
  rationale: >-
    The human receptor carries Lys191, absent from rodents, which lowers its routing to the
    plasma membrane and makes human mutants more prone to retention. The dominant-negative
    effect occurs with human and mouse sequences in cells and not with rat. The E90K knock-in
    mouse is described as recessive, but whether heterozygous knock-in mice have reduced
    surface receptor or a subtle reproductive phenotype is not stated in the abstract of the
    report, and a mouse receptor without Lys191 may underestimate retention of the human
    wild-type receptor. A heterozygous effect in people could therefore be missed in the
    mouse.
  evidence:
  - reference: PMID:15886197
    reference_title: Parallel regulation of membrane trafficking and dominant-negative effects by misrouted gonadotropin-releasing hormone receptor mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "is compensated for by the primate-unique insertion of Lys(191) that, alone, dramatically decreases routing of the receptor"
    explanation: The primate-specific residue that lowers routing of the human receptor.

genetic:
- name: GNRHR
  notes: >-
    Encodes the gonadotropin-releasing hormone receptor. Biallelic loss-of-function variants
    cause the disease. No ClinGen gene-disease validity record for GNRHR is present in the
    committed ClinGen cache, so no validity tier is recorded. The two commonest disease
    alleles, Gln106Arg and Arg262Gln, are partial loss-of-function variants that are frequent
    enough in the general population to be found in homozygous adults in gnomAD; see the
    discussion on penetrance. Variants below are a selection with functional or structural
    information, not the full allelic series; ClinVar listed 63 pathogenic or likely
    pathogenic GNRHR variants on 2026-11-26.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GNRHR
    term:
      id: hgnc:4421
      label: GNRHR
  case_fractions:
  - population: Normosmic probands from kindreds with autosomal recessive idiopathic hypogonadotropic hypogonadism, one United States referral centre
    case_fraction_percent: 40.0
    cohort_size: 5
    notes: Two of five recessive normosmic kindreds. A very small denominator.
    evidence:
    - reference: PMID:11297587
      reference_title: "Prevalence, phenotypic spectrum, and modes of inheritance of gonadotropin-releasing hormone receptor mutations in idiopathic hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "establishing a GNRHR mutation frequency of 2 of 5 (40%) in patients with normosmic, autosomal recessive IHH"
      explanation: Share of recessive normosmic kindreds explained by GNRHR.
  - population: Sporadic normosmic idiopathic hypogonadotropic hypogonadism, one United States referral centre
    case_fraction_percent: 16.7
    cohort_size: 18
    evidence:
    - reference: PMID:11297587
      reference_title: "Prevalence, phenotypic spectrum, and modes of inheritance of gonadotropin-releasing hormone receptor mutations in idiopathic hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "indicating a prevalence of 3 of 18 (16.7%) in patients with sporadic IHH and a normal sense of smell"
      explanation: Share of sporadic normosmic probands explained by GNRHR.
  - population: Brazilian patients with normosmic isolated hypogonadotropic hypogonadism
    case_fraction_percent: 10.0
    cohort_size: 110
    evidence:
    - reference: PMID:25016926
      reference_title: Role of gonadotropin-releasing hormone receptor mutations in patients with a wide spectrum of pubertal delay.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eleven IHH patients (10%) carried biallelic GNRHR mutations."
      explanation: Share of normosmic patients with biallelic GNRHR variants in a Brazilian cohort.
  variants:
  - name: p.Gln106Arg
    synonyms:
    - Q106R
    - c.317A>G
    identifiers:
    - ClinVar:VCV000016023
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Partial loss of function through reduced GnRH affinity. Extracellular loop 1 (generic
      number 23.49). In the active pig structure the equivalent glutamine is 5.8 angstroms
      from GnRH and its side chain hydrogen-bonds to the backbone of extracellular loop 2;
      arginine there would put a positive charge at the mouth of the pocket, which GnRH enters
      with its own Arg8. The commonest disease allele: gnomAD v4.1 allele frequency 0.0035
      with 10 homozygotes. Homozygotes described clinically have mild disease, including the
      fertile eunuch form with later reversal and a woman with spontaneous pregnancy.
      ClinVar: pathogenic/likely pathogenic, multiple submitters.
    evidence:
    - reference: PMID:11397871
      reference_title: Two novel mutations in the gonadotropin-releasing hormone receptor gene in Brazilian patients with hypogonadotropic hypogonadism and normal olfaction.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "in vitro analysis indicated that the mutant receptor was able to bind GnRH, but with a reduced affinity"
      explanation: The functional defect of Gln106Arg, restated from the original characterization.
    - reference: PMID:11397842
      reference_title: "The fertile eunuch variant of idiopathic hypogonadotropic hypogonadism: spontaneous reversal associated with a homozygous mutation in the gonadotropin-releasing hormone receptor."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "associated with a homozygous mutation (Gln106Arg) in the GnRH-R"
      explanation: A homozygous man with the mild fertile eunuch form.
  - name: p.Arg262Gln
    synonyms:
    - R262Q
    - c.785G>A
    identifiers:
    - ClinVar:VCV000016024
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Partial loss of function through impaired coupling. Cytoplasmic end of helix 6 (6.30).
      In the inactive human structure Arg262 lies against Arg139 of the DRS motif; in the
      active pig structure the equivalent arginine is 5.2 angstroms from the Gq alpha subunit.
      Binding is retained and phospholipase C activation is reduced. gnomAD v4.1 allele
      frequency 0.0015 with 7 homozygotes. Usually found in compound heterozygosity with a
      more severe allele; overrepresented among patients whose hypogonadism reverses.
      ClinVar: pathogenic/likely pathogenic, multiple submitters.
    evidence:
    - reference: PMID:10022417
      reference_title: The same molecular defects of the gonadotropin-releasing hormone receptor determine a variable degree of hypogonadism in affected kindred.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When expressed in heterologous cells, both Gln106Arg and Ser217Arg mutations altered hormone binding, whereas the Arg262Gln mutation altered activation of phospholipase C."
      explanation: Arg262Gln alters effector activation, not binding.
    - reference: PMID:22724017
      reference_title: Reversible congenital hypogonadotropic hypogonadism in patients with CHD7, FGFR1 or GNRHR mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two reversal variants had a same GNRHR mutation (R262Q), which was accompanied by another GNRHR mutation (R139H or del309F)."
      explanation: Two men with Arg262Gln in trans with another allele whose hypogonadism reversed.
  - name: p.Arg139His
    synonyms:
    - R139H
    - c.416G>A
    identifiers:
    - ClinVar:VCV000016030
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function. The arginine of the DRS motif (3.50) at the cytoplasmic end
      of helix 3. In the inactive human structure it is salt-bridged to Asp138 and contacts
      Thr265 and Arg262 on helix 6; in the active pig structure the equivalent arginine is
      3.7 angstroms from Gq. Histidine cannot make both sets of contacts. gnomAD v4.1 allele
      frequency 0.00015, no homozygotes. Brazilian carriers share a haplotype. ClinVar:
      pathogenic, multiple submitters. Arg139Cys (ClinVar VCV001675193) is a second
      pathogenic allele at the same residue.
    evidence:
    - reference: PMID:11397871
      reference_title: Two novel mutations in the gonadotropin-releasing hormone receptor gene in Brazilian patients with hypogonadotropic hypogonadism and normal olfaction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Arg(139)His mutation completely eliminated detectable GnRH-binding activity and prevented GnRH-induced stimulation of inositol phosphate accumulation in vitro."
      explanation: No detectable binding or signalling.
    - reference: PMID:25016926
      reference_title: Role of gonadotropin-releasing hormone receptor mutations in patients with a wide spectrum of pubertal delay.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The founder effect study revealed that Brazilian patients carrying the p.R139H mutation shared the same haplotype."
      explanation: A founder haplotype for Arg139His in Brazil.
  - name: p.Glu90Lys
    synonyms:
    - E90K
    - c.268G>A
    identifiers:
    - ClinVar:VCV000016032
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function by misfolding and endoplasmic reticulum retention; fully
      rescuable by pharmacoperones in cells and in a knock-in mouse. Glu90 (2.53) is buried in
      the helix bundle (relative solvent accessibility 0.02 in the AlphaFold model). In the
      active pig structure its side chain hydrogen-bonds to Ser124 and the Met125 backbone on
      helix 3, in agreement with the mutagenesis study that excluded a salt bridge to Lys121.
      Lysine reverses the charge in a packed polar pocket between helices 2, 3 and 6.
      ClinVar: pathogenic/likely pathogenic, multiple submitters.
    evidence:
    - reference: PMID:11994356
      reference_title: "Molecular basis of hypogonadotropic hypogonadism: restoration of mutant (E(90)K) GnRH receptor function by a deletion at a distant site."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transient expression of the mutant E(90)K receptor in COS-7 cells resulted in a virtual abolition of GnRH agonist binding and agonist-stimulated phosphoinositide turnover"
      explanation: Near-total loss of binding and signalling in transfected cells.
    - reference: PMID:30476558
      reference_title: "Glu(2.53(90)) of the GnRH receptor is part of the conserved G protein-coupled receptor structure and does not form a salt-bridge with Lys(3.32(121))."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Models showed that congenital Glu2.53(90)Lys and Glu2.53(90)Asp mutations disrupt interactions with Ser3.35(124) and Trp6.48(280) respectively"
      explanation: Modelling places the defect in contacts between helices 2, 3 and 6.
  - name: p.Ala129Asp
    synonyms:
    - A129D
    - c.386C>A
    identifiers:
    - ClinVar:VCV000016026
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function. Ala129 (3.40) is in the middle of helix 3, fully buried
      (relative solvent accessibility 0.04), 15 angstroms from Gq and 11 angstroms from the
      ligand. An aspartate there puts a charge in the hydrophobic core of the bundle, which
      is expected to prevent folding. ClinVar: pathogenic, multiple submitters.
    evidence:
    - reference: PMID:10084584
      reference_title: Resistance of hypogonadic patients with mutated GnRH receptor genes to pulsatile GnRH administration.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This A129D mutation results in a complete loss of function, indicated by the lack of inositol triphosphate (TP3) 3 production by transfected Chinese hamster ovary (CHO) cells after GnRH stimulation."
      explanation: No inositol phosphate response in transfected cells.
  - name: p.Ser168Arg
    synonyms:
    - S168R
    - c.504T>A
    identifiers:
    - ClinVar:VCV000016028
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function, not rescuable by pharmacoperones. Ser168 (4.54) is on helix 4
      within the membrane; its hydroxyl hydrogen-bonds back to the helix backbone (Trp164,
      Ile165). Arginine places a charged side chain in the lipid-embedded part of the helix,
      a change the membrane does not accommodate. Absent from gnomAD v4.1. ClinVar:
      pathogenic, multiple submitters.
    evidence:
    - reference: PMID:10523035
      reference_title: Complete hypogonadotropic hypogonadism associated with a novel inactivating mutation of the gonadotropin-releasing hormone receptor.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When introduced into the complementary DNA coding for the GnRH-R, this mutation resulted in the complete loss of the receptor-mediated signaling response to GnRH."
      explanation: Complete loss of signalling.
    - reference: PMID:15105440
      reference_title: "Human loss-of-function gonadotropin-releasing hormone receptor mutants retain wild-type receptors in the endoplasmic reticulum: molecular basis of the dominant-negative effect."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutants hGnRHR(E90K), hGnRHR(L266R), and hGnRHR(S168R) were selected for study because they are known to be fully rescuable, partially rescuable, or nonrescuable (respectively) by a specific pharmacological chaperone."
      explanation: Places E90K, L266R and S168R on a scale from fully rescuable to not rescuable.
  - name: p.Ala171Thr
    synonyms:
    - A171T
    - c.511G>A
    identifiers:
    - ClinVar:VCV000016034
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function. Ala171 (4.57) is buried at the interface of helices 3 and 4
      (relative solvent accessibility 0.00). The original report modelled a new hydrogen bond
      from Thr171 to Tyr119 on helix 3 that would lock the two helices together. Ala171Val
      (ClinVar VCV003660422, likely pathogenic) at the same residue cannot make that bond,
      which suggests that added bulk at this packed position is enough to disrupt the
      receptor. ClinVar: pathogenic, multiple submitters.
    evidence:
    - reference: PMID:12679486
      reference_title: "Mutation Ala(171)Thr stabilizes the gonadotropin-releasing hormone receptor in its inactive conformation, causing familial hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Specific receptor binding of (125)I-labeled GnRH ligand was undetectable in Ala(171)Thr GnRH receptor-transfected cells."
      explanation: No detectable binding.
    - reference: PMID:12679486
      reference_title: "Mutation Ala(171)Thr stabilizes the gonadotropin-releasing hormone receptor in its inactive conformation, causing familial hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Molecular modeling and dynamic simulation of the Ala(171)Thr GnRH receptor suggests the introduction of a stable hydrogen bond between residue Thr(171) and Tyr(119) side-chains at a distance of 2 A."
      explanation: The modelled mechanism proposed by the original authors, made before any receptor structure existed.
  - name: p.Asn10Lys
    synonyms:
    - N10K
    - c.30T>A
    identifiers:
    - ClinVar:VCV000016031
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Partial loss of function through reduced affinity. Extracellular N-terminus. This
      residue is not resolved in 7BR3 or 9U4W and the AlphaFold model has pLDDT 33 here, so
      no structural reasoning is possible. The N-terminus does enter the binding site in the
      antagonist-bound crystal structure. gnomAD v4.1 allele frequency 0.00013 for c.30T>A.
      ClinVar: pathogenic/likely pathogenic, multiple submitters.
    evidence:
    - reference: PMID:11397871
      reference_title: Two novel mutations in the gonadotropin-releasing hormone receptor gene in Brazilian patients with hypogonadotropic hypogonadism and normal olfaction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Asn(10)Lys mutation in the extracellular amino-terminal domain of the receptor also reduced the affinity for GnRH in vitro."
      explanation: Reduced affinity in vitro.
  - name: p.Leu266Arg
    synonyms:
    - L266R
    - c.797T>G
    identifiers:
    - ClinVar:VCV001519153
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function by misfolding, partially rescuable by pharmacoperones.
      Leu266 (6.34) is on the buried face of the cytoplasmic half of helix 6 (relative solvent
      accessibility 0.08), 7 angstroms from Gq. Arginine introduces a charge into the packed
      interface between helices 5 and 6. ClinVar: pathogenic/likely pathogenic.
    evidence:
    - reference: PMID:11297587
      reference_title: "Prevalence, phenotypic spectrum, and modes of inheritance of gonadotropin-releasing hormone receptor mutations in idiopathic hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "COS-7 cells transiently transfected with complementary DNAs encoding the human GNRHR containing each of these four novel mutations failed to respond to GnRH agonist stimulation."
      explanation: One of four alleles (Thr32Ile, Cys200Tyr, Leu266Arg, Cys279Tyr) with no response to agonist.
  - name: p.Cys279Tyr
    synonyms:
    - C279Y
    - c.836G>A
    identifiers:
    - ClinVar:VCV001301193
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function. Cys279 (6.47) is the cysteine of the CWxP motif of helix 6,
      next to the Trp280 toggle residue and fully buried (relative solvent accessibility
      0.01). Tyrosine is too large for this position. ClinVar: pathogenic/likely pathogenic.
    evidence:
    - reference: PMID:11297587
      reference_title: "Prevalence, phenotypic spectrum, and modes of inheritance of gonadotropin-releasing hormone receptor mutations in idiopathic hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "COS-7 cells transiently transfected with complementary DNAs encoding the human GNRHR containing each of these four novel mutations failed to respond to GnRH agonist stimulation."
      explanation: One of four alleles with no response to agonist.
  - name: p.Cys200Tyr
    synonyms:
    - C200Y
    - c.599G>A
    identifiers:
    - ClinVar:VCV004967310
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function. Cys200 is in extracellular loop 2. Mutagenesis literature
      assigns it a disulfide bond to Cys14 of the N-terminus, in addition to the conserved
      Cys114-Cys196 bond; Cys14 is not resolved in 7BR3, so the bond cannot be confirmed
      on experimental coordinates. The AlphaFold model places the two sulfurs 2.0 angstroms
      apart, a disulfide, but with low confidence in that region (pLDDT 54 at Cys14), and
      the pig receptor of 9U4W has glycine at position 200. Loss of a disulfide that ties the N-terminus over the
      binding pocket would explain loss of function. ClinVar: pathogenic, single submitter.
    evidence:
    - reference: PMID:11297587
      reference_title: "Prevalence, phenotypic spectrum, and modes of inheritance of gonadotropin-releasing hormone receptor mutations in idiopathic hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "COS-7 cells transiently transfected with complementary DNAs encoding the human GNRHR containing each of these four novel mutations failed to respond to GnRH agonist stimulation."
      explanation: One of four alleles with no response to agonist.
  - name: p.Tyr283His
    synonyms:
    - Y283H
    - c.847T>C
    identifiers:
    - ClinVar:VCV002755816
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Complete loss of function. Tyr283 (6.51) lines the hormone pocket: 2.8 angstroms from
      GnRH in the active pig structure, where it contacts pGlu1, His2 and Trp3 of the hormone,
      and 3.1 angstroms from elagolix in the human structure. Tyr284Cys (6.52, ClinVar
      VCV000016025), the neighbouring residue and also a GnRH contact, is a partial
      loss-of-function allele. ClinVar: pathogenic/likely pathogenic.
    evidence:
    - reference: PMID:25016926
      reference_title: Role of gonadotropin-releasing hormone receptor mutations in patients with a wide spectrum of pubertal delay.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro analysis of novel variants (p.Y283H and p.V134G) demonstrated complete inactivation."
      explanation: Complete inactivation in vitro.
  - name: p.Pro282Arg
    synonyms:
    - P282R
    - c.845C>G
    variant_type: single nucleotide variant
    description: >-
      Loss of binding. Pro282 (6.50) is the proline of the CWxP motif that kinks helix 6, the
      helix that swings outward on activation. Arginine removes the kink-forming residue and
      adds a charge 4.5 angstroms from the ligand site. Pro282Leu at the same residue is in
      ClinVar as likely pathogenic (VCV001709893).
    evidence:
    - reference: PMID:22679506
      reference_title: Congenital hypogonadotropic hypogonadism due to GnRH receptor mutations in three brothers reveal sites affecting conformation and coupling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Pro282Arg mutant is unable to bind radiolabeled GnRH analogue."
      explanation: No binding of radiolabelled GnRH analogue.
  - name: p.Arg38Ter
    synonyms:
    - R38X
    - c.112C>T
    identifiers:
    - ClinVar:VCV004850479
    variant_type: single nucleotide variant
    type: nonsense
    clinical_significance: PATHOGENIC
    description: >-
      Null allele. The stop codon is at the start of helix 1, so no transmembrane domain is
      made. Homozygous patients have complete disease and heterozygous relatives are
      unaffected, which shows that half the normal gene dosage is enough. The missense allele
      Arg38Gln at the same residue (ClinVar VCV003004558, likely pathogenic) removes the
      arginine that pairs with Asp98 and contacts pGlu1 of GnRH.
    evidence:
    - reference: PMID:30947225
      reference_title: Whole Exome Sequencing Revealed a Novel Nonsense Variant in the GNRHR Gene Causing Normosmic Hypogonadotropic Hypogonadism in a Pakistani Family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis identified a novel nonsense mutation (chr4: g.68619942G>A, c.112C>T, p.Arg38*) in the gonadotropin-releasing hormone receptor gene (GNRHR) recessively co-segregating with nCHH in this family."
      explanation: A nonsense allele segregating recessively with the disease.

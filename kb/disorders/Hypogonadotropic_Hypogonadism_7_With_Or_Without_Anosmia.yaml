inheritance:
- name: Autosomal Recessive
  description: >-
    Affected individuals are homozygous or compound heterozygous for GNRHR loss-of-function
    variants. Heterozygous parents and siblings in the reported families are unaffected. One
    patient was homozygous through maternal uniparental isodisomy of chromosome 4. Rare
    heterozygous GNRHR variants are found more often in patients with GnRH deficiency than in
    controls, but without the genotype-phenotype relationship seen in biallelic patients; see
    the discussion on monoallelic variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10084584
    reference_title: Resistance of hypogonadic patients with mutated GnRH receptor genes to pulsatile GnRH administration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder was transmitted as an autosomal recessive trait."
    explanation: Three affected compound heterozygous siblings in a kindred with recessive transmission.
  - reference: PMID:10523035
    reference_title: Complete hypogonadotropic hypogonadism associated with a novel inactivating mutation of the gonadotropin-releasing hormone receptor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This novel mutation was present in the homozygous state in the patient, whereas it was in the heterozygous state in both phenotypically normal parents."
    explanation: Homozygous affected patient with unaffected heterozygous parents.
  - reference: PMID:30947225
    reference_title: Whole Exome Sequencing Revealed a Novel Nonsense Variant in the GNRHR Gene Causing Normosmic Hypogonadotropic Hypogonadism in a Pakistani Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the patients are homozygous and their parents are heterozygous carriers, while normal siblings are heterozygous carriers or wild-type for this mutation"
    explanation: A nonsense allele segregating recessively; heterozygous carriers of a null allele are unaffected.
mechanistic_hypotheses:
- hypothesis_group_id: recessive_loss_of_function
  hypothesis_label: Recessive loss of GnRH receptor function
  status: CANONICAL
  description: >-
    Both GNRHR alleles carry variants that reduce or abolish GnRH receptor signalling in the
    gonadotrope, through misfolding and intracellular retention, reduced GnRH binding, or
    failure to activate Gq/11. One normal allele is sufficient for puberty and fertility.
  evidence:
  - reference: PMID:22745237
    reference_title: "When genetic load does not correlate with phenotypic spectrum: lessons from the GnRH receptor (GNRHR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with GnRH deficiency and biallelic mutations in GNRHR, genetic burden defined by severity and dose is associated with clinical phenotype."
    explanation: In biallelic patients, the severity and number of loss-of-function alleles track the clinical severity.
- hypothesis_group_id: dominant_negative_er_retention
  hypothesis_label: Dominant-negative retention of the wild-type receptor by misfolded mutants
  status: ALTERNATIVE
  description: >-
    In transfected cells, misfolded human GnRH receptor mutants oligomerize with the wild-type
    receptor and hold it in the endoplasmic reticulum. If this happened in gonadotropes, a
    single misfolding allele could lower receptor function below half and contribute to
    disease in heterozygotes. Against it, heterozygous carriers of misfolding alleles in the
    reported families, including E90K, are clinically normal.
  evidence:
  - reference: PMID:15105440
    reference_title: "Human loss-of-function gonadotropin-releasing hormone receptor mutants retain wild-type receptors in the endoplasmic reticulum: molecular basis of the dominant-negative effect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the dominant-negative effect, which occurs for human (but not for rodent) GnRHR, results from WT receptor retention in the endoplasmic reticulum by mislocalized mutants"
    explanation: The effect and its mechanism as observed in co-transfected cells.
  - reference: PMID:11318785
    reference_title: A novel homozygous mutation in the second transmembrane domain of the gonadotrophin releasing hormone receptor gene.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Both parents and an unaffected brother were heterozygous carriers of one mutant allele"
    explanation: >-
      Heterozygous carriers of E90K, a mutant shown to retain the wild-type receptor in cells,
      are unaffected, so the effect is not sufficient to cause disease in carriers.
pathophysiology:
- name: Biallelic GNRHR Loss-of-Function Variants
  description: >-
    GNRHR encodes the type 1 GnRH receptor, a 328-residue class A G protein-coupled receptor of
    pituitary gonadotropes. It binds the decapeptide GnRH in a pocket formed by the N-terminal
    segment, the extracellular loops and transmembrane helices 2, 3, 5, 6 and 7, and activates
    Gq/11. Among mammalian receptors of this class it is unusual in having no cytoplasmic
    C-terminal tail and no helix 8, in carrying Asn at 2.50 and Asp at 7.49 (the reverse of the
    usual pair), and in having a DRS motif where most receptors have DRY. Disease alleles are
    mostly missense variants spread through the whole protein, with fewer nonsense, frameshift
    and splice variants. Missense alleles range from complete to partial loss of function.
    The gene is not constrained against loss of function in the population (gnomAD v4.1 LOEUF
    0.78, pLI 0.02, missense Z 0.35), as expected for a recessive disorder.

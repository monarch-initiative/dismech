- name: GnRH Receptor Misfolding and Endoplasmic Reticulum Retention
  description: >-
    The mutant receptor does not reach its native fold and is retained in the endoplasmic
    reticulum, so little or none arrives at the plasma membrane. This is the most common
    mechanism among tested missense alleles. The receptors are often intrinsically competent:
    small cell-permeant antagonists that bind the folding receptor (pharmacoperones) restore
    surface expression and signalling for most of them in cells, and for E90K in a knock-in
    mouse. The human receptor is close to the limit of what quality control accepts even when
    wild type, because of Lys191 in extracellular loop 2, a residue that the rat and mouse
    receptors lack and that lowers routing to the surface. On the structure, the alleles in this class change
    buried residues of the helix bundle (for example Glu90 at 2.53, Ala129 at 3.40, Ala171 at
    4.57, Leu266 at 6.34, Cys279 at 6.47 and Pro320 at 7.50), or put an arginine on a helix
    face inside the membrane (Ser168 at 4.54, Ser217 at 5.44).
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pituitary gonadotrope
    term:

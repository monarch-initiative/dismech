    Low testosterone or estradiol with low or inappropriately normal LH and FSH, and otherwise
    normal pituitary function. The LH response to GnRH is absent in complete forms and
    present in partial forms. The hormone profile does not distinguish GNRHR disease from
    other normosmic forms.

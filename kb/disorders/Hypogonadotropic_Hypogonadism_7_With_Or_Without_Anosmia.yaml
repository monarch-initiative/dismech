    explanation: >-
      Identifies positions 6.51 and 6.52 as hormone contacts in pig and frog receptors. The
      patient alleles Tyr283His and Tyr284Cys are at these positions in the human receptor;
      the link to the human alleles is by sequence alignment.
- name: Impaired Receptor Coupling to Gq/11
  description: >-
    Alleles at the cytoplasmic ends of helices 3 and 6 and in intracellular loop 2 leave the
    hormone pocket intact but prevent the active receptor from engaging Gq/11. Arg139 is the
    arginine of the DRS motif (3.50). In the inactive human structure it is paired with Asp138
    and contacts Thr265 and Arg262 on helix 6; in the active pig structure the equivalent
    arginine is 3.7 angstroms from the Gq alpha subunit. Arg262 (6.30) is 5.2 angstroms from
    Gq, next to Ala261, Lys264 and Thr265, which touch it, and Pro146 (34.50, intracellular
    loop 2) is 3.6 angstroms from it. Arg139His also abolishes
    measurable binding in cells, so this class overlaps with misfolding.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Gq/11 activation by the GnRH receptor
    modifier: DECREASED
    term:
      id: GO:0004968
      label: gonadotropin-releasing hormone receptor activity
  downstream:
  - target: Gonadotrope Resistance to GnRH
    description: A receptor that cannot activate Gq/11 gives no phospholipase C signal when GnRH binds.
    causal_link_type: DIRECT
    hypothesis_groups:
    - recessive_loss_of_function
  evidence:

name: Hypogonadotropic Hypogonadism 7 With or Without Anosmia
category: Mendelian
creation_date: "2026-11-26T21:23:57Z"
synonyms:
- HH7
- hypogonadotropic hypogonadism 7 without anosmia
- GNRHR hypogonadotropic hypogonadism
- GnRH receptor deficiency
- gonadotropin-releasing hormone resistance
- normosmic congenital hypogonadotropic hypogonadism due to GNRHR variants
description: >-
  An autosomal recessive form of congenital hypogonadotropic hypogonadism caused by biallelic
  loss-of-function variants in GNRHR. The gene encodes the gonadotropin-releasing hormone (GnRH)
  receptor, a G protein-coupled receptor on pituitary gonadotropes that couples through Gq/11
  to phospholipase C and drives synthesis and release of LH and FSH. The hypothalamus and its
  GnRH neurons are intact; the pituitary cannot read their signal, so the defect is GnRH
  resistance, not GnRH deficiency, and the sense of smell is normal.

  Disease alleles reduce receptor function in three ways that often combine: the receptor
  misfolds and is held in the endoplasmic reticulum, it reaches the surface but binds GnRH
  poorly, or it binds GnRH but does not activate Gq/11. The amount of function left sets the
  clinical picture. Two complete loss-of-function alleles give absent puberty, with micropenis
  and cryptorchidism in boys and primary amenorrhea in girls, and no response to pulsatile
  GnRH. Partial loss-of-function alleles, of which Gln106Arg and Arg262Gln are by far the most
  common, give a wide range from partial puberty to a mild form with normal testicular volume,
  and some of these patients recover gonadotropin secretion after treatment is stopped.

  Sex steroids induce and maintain secondary sex characteristics. Fertility is obtained with
  gonadotropins, which act downstream of the receptor; pulsatile GnRH works only in patients
  with residual receptor function and then at higher doses than usual.
disease_term:
  preferred_term: hypogonadotropic hypogonadism 7 with or without anosmia
  term:
    id: MONDO:0007794
    label: hypogonadotropic hypogonadism 7 with or without anosmia
parents:
- Hypogonadotropic hypogonadism
notes: >-
  Anosmia is not recorded as a phenotype. The MONDO label says "with or without anosmia"
  because OMIM names the whole numbered series that way, but the receptor acts in the pituitary,
  downstream of GnRH neuron migration, and the cohort that screened both normosmic and anosmic
  probands found GNRHR variants only in the normosmic ones (PMID:11297587). This is the reason
  `Kallmann_Syndrome` declines the term as a subtype.

  Residue positions for variants are given on the 328-residue canonical sequence (UniProt
  P30968) with GPCRdb generic numbers. Distances (minimum distance between non-hydrogen atoms) and contacts were computed for this entry from
  three coordinate sets: PDB 7BR3 (human receptor with the antagonist elagolix, inactive state,
  PMID:33082324), PDB 9U4W (pig receptor with GnRH and Gq, active state, PMID:40523184, mapped
  to human numbering by sequence alignment, 248 of 271 modelled residues identical) and the
  AlphaFold model AF-P30968-F1 (version 6). RCSB holds no experimental structure of the human
  receptor with an agonist or a G protein (searched by UniProt accession P30968 on 2026-11-26,
  one hit, 7BR3), so every statement about GnRH or Gq contacts rests on the pig receptor. The
  method, the script and the full table are in
  `docs/curation-notes/Hypogonadotropic_Hypogonadism_7-variant-structure-placement-2026-11-26.md`.
  Allele counts are from gnomAD v4.1 (queried 2026-11-26) and classifications from ClinVar
  (queried 2026-11-26).

  The committed ClinGen gene-disease validity cache has no GNRHR record, so no validity tier is
  recorded. The GeneReviews chapter that covers this disease, Isolated Gonadotropin-Releasing
  Hormone (GnRH) Deficiency (PMID:20301509), is written for the whole group of GnRH deficiency
  disorders; GNRHR-specific phenotype statements here are taken from GNRHR case series and
  cohorts, and the chapter is cited for features shared across the group and for management.
  PMID:9371856 and PMID:9425890, the two founding reports, have no abstract in PubMed and could
  not be quoted.

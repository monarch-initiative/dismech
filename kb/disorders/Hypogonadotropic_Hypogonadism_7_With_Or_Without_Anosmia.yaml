- name: Dominant-Negative Retention of Wild-Type Receptor
  description: >-
    A cell-culture finding recorded as an alternative model. Misfolded human mutants
    oligomerize with co-expressed wild-type receptor and keep it in the endoplasmic reticulum,
    and correcting the mutant's folding with a pharmacoperone releases both. The effect is seen
    with human and mouse receptor sequences and not with rat. It has not been shown in
    gonadotropes of heterozygous people, and carriers in the reported families are unaffected.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pituitary gonadotrope
    term:

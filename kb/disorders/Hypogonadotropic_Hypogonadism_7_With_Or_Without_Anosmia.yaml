- name: Reduced GnRH Binding Affinity
  description: >-
    Alleles in or beside the hormone pocket lower affinity for GnRH without abolishing it, so
    the dose-response curve shifts to the right and the receptor still signals at high GnRH
    concentrations. These are typically partial loss-of-function alleles. In the active-state
    pig receptor structure, the positions equivalent to human Arg38 (1.35), Tyr283 (6.51) and
    Tyr284 (6.52) are within 4 angstroms of GnRH and Gln174 (4.60) is at 4.1 angstroms; Arg38
    is also paired with Asp98 (2.61). Gln106 in extracellular loop 1 is 5.8 angstroms from the
    hormone, near it but not in contact, and hydrogen-bonds to the backbone of extracellular
    loop 2. The first 17 residues, which
    include Asn10, are not resolved in either experimental structure.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: gonadotropin-releasing hormone binding
    modifier: DECREASED
    term:
      id: GO:0051448
      label: gonadotropin-releasing hormone binding
  downstream:
  - target: Gonadotrope Resistance to GnRH
    description: Lower occupancy at physiological GnRH pulse amplitudes gives a smaller signal.

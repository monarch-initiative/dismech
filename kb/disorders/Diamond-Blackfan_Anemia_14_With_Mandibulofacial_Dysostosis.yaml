diagnosis:
- name: Complete blood count with red cell indices
  description: >-
    The entry point for the haematologic arm. A macrocytic anemia with
    preserved leukocytes and platelets is what raises DBA, and in this genotype
    a raised MCV was abnormal even in the affected male who was never anemic -
    so a normal haemoglobin does not exclude the diagnosis in a relative of a
    known carrier.
  diagnosis_term:
    preferred_term: complete blood count with red cell indices
    term:
      id: NCIT:C28133
      label: Blood Cell Count
  markers: Hemoglobin, mean corpuscular volume, reticulocyte count, leukocyte and platelet counts
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete blood counts several times a year, then one to two times per year once hemoglobin is stable; bone marrow aspirate/biopsy to evaluate morphology and cellularity only in the event of another cytopenia or a change in response to treatment."
    explanation: >-
      The GeneReviews surveillance recommendation for DBA, which is where the
      blood count sits in the diagnostic and follow-up pathway.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient never had overt anemia, but elevated mean corpuscular volume, eADA and hemoglobin F were consistent with DBA markers."
    explanation: >-
      The specific reason the indices matter here and not only the haemoglobin.
  - reference: PMID:23252420
    reference_title: "Erythrocyte adenosine deaminase: diagnostic value for Diamond-Blackfan anaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classical form of DBA has specific clinical and laboratory findings: presentation at age less than 1 year, macrocytic anaemia with no other significant cytopenias, reticulocytopenia, and normal bone marrow cellularity with a paucity of erythroid precursors (Diamond et al, 1976)."
    explanation: >-
      The classical DBA diagnostic criteria the blood count is read against.
      The proband met the age and anemia criteria; the cousin met none of them
      and was identified on the supporting biochemical markers instead.

- name: Erythrocyte adenosine deaminase activity
  description: >-
    eADA is the classic DBA biochemical marker and it is documented in a
    TSR2-mutant patient, not merely inherited from the class - the affected
    cousin had elevated eADA with a normal haemoglobin. NCIT has no term for an
    enzyme-activity assay reachable from Clinical Intervention or Procedure, so
    the binding is the parent laboratory-procedure term and the specificity is
    carried in `preferred_term`.
  diagnosis_term:
    preferred_term: erythrocyte adenosine deaminase activity assay
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  markers: Erythrocyte adenosine deaminase (eADA), hemoglobin F
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient never had overt anemia, but elevated mean corpuscular volume, eADA and hemoglobin F were consistent with DBA markers."
    explanation: >-
      Elevated eADA in a patient with the TSR2 variant, which is what makes
      this test applicable to this genotype specifically.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diamond-Blackfan anemia typically presents in early infancy with macrocytic anemia, elevated erythrocyte adenosine deaminase (eADA) and hemoglobin F, and less commonly associated physical findings such as short stature or thumb anomalies."
    explanation: >-
      Establishes eADA as a standard DBA marker, which is the reason it was
      measured in this family.
  - reference: PMID:23252420
    reference_title: "Erythrocyte adenosine deaminase: diagnostic value for Diamond-Blackfan anaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the diagnosis of DBA compared with non-DBA patients with other bone marrow failure syndromes, eADA had a sensitivity of 84%, specificity 95%, and positive and negative predictive values of 91%."
    explanation: >-
      The measured performance of the test against the differential that
      actually matters - other inherited bone marrow failure syndromes rather
      than healthy controls.
  - reference: PMID:23252420
    reference_title: "Erythrocyte adenosine deaminase: diagnostic value for Diamond-Blackfan anaemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "While eADA was an excellent confirmatory test for DBA, 16% of patients with classical clinical DBA had a normal eADA."
    explanation: >-
      Graded REFUTE against the proposition that a normal eADA excludes DBA.
      This matters for cascade testing in a TSR2 family: a carrier's normal
      eADA is not a negative result.
  - reference: PMID:23252420
    reference_title: "Erythrocyte adenosine deaminase: diagnostic value for Diamond-Blackfan anaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythrocyte ADA segregated with, as well as independent of, known DBA gene mutations."
    explanation: >-
      eADA does not track the genotype cleanly, which is the reason it cannot
      substitute for TSR2 sequencing in an at-risk relative.

- name: Molecular genetic testing of TSR2
  description: >-
    The diagnosis is molecular. TSR2 is not on the ribosomal-protein panels
    that most DBA testing starts from, so a boy with a mandibulofacial
    dysostosis and DBA markers whose RP panel is negative is the case in which
    TSR2 has to be looked at specifically - which is how the gene was found, by
    exome sequencing after the craniofacial genes came back negative.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  markers: Hemizygous TSR2 pathogenic variant in a male proband
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the molecular diagnosis can be established in a male proband by identification of a hemizygous pathogenic variant in GATA1 or TSR2 associated with X-linked DBA syndrome"
    explanation: >-
      States exactly what establishes the molecular diagnosis in this genotype.

- name: Exome sequencing
  description: >-
    The method by which the genotype was defined, and the practical route to it
    in a patient whose phenotype straddles two panels - a craniofacial one and
    a bone-marrow-failure one - neither of which contains TSR2.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combining exome analysis and Sanger sequencing, we identified likely pathogenic mutations in 5/6 families."
    explanation: >-
      The diagnostic yield of exome analysis across the six families with this
      combined phenotype, one of which is the TSR2 family.

- name: Bone marrow aspiration and biopsy
  description: >-
    Not a first-line test in DBA. GeneReviews restricts it to the appearance of
    a second cytopenia or a change in treatment response - that is, to the
    question of evolving marrow failure or a clonal disorder rather than to
    making the diagnosis.
  diagnosis_term:
    preferred_term: bone marrow aspirate and biopsy
    term:
      id: NCIT:C92958
      label: Bone Marrow Aspiration and Biopsy
  markers: Marrow morphology and cellularity; erythroid precursors
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete blood counts several times a year, then one to two times per year once hemoglobin is stable; bone marrow aspirate/biopsy to evaluate morphology and cellularity only in the event of another cytopenia or a change in response to treatment."
    explanation: >-
      States both the indication and the deliberate restriction of it.

differential_diagnoses:
- name: Treacher Collins syndrome
  description: >-
    The condition both affected males were thought to have on sight. It shares
    the zygomatic and mandibular hypoplasia, downslanted palpebral fissures,
    microtia and cleft palate, and it is also a ribosomopathy - the lesion is
    in RNA polymerase I transcription rather than in small-subunit assembly.
    The discriminator is haematologic: Treacher Collins does not cause a
    macrocytic anemia or raise eADA. A boy carrying both pictures is the case
    that should be sequenced beyond TCOF1, POLR1C and POLR1D.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most TCS patients have a heterozygous TCOF1 mutation, while heterozygous POLR1D and biallelic POLR1C mutations account for additional cases [Dauwerse et al., 2011]."
    explanation: >-
      The genes that have to be excluded before this differential is closed.

- name: Other mandibulofacial dysostoses
  description: >-
    Mandibulofacial dysostosis is a group, not a diagnosis. Nager and Miller
    syndromes and the mandibulofacial dysostoses with abnormal head size sit
    alongside Treacher Collins in it, and none of them carries the DBA
    haematologic markers.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treacher Collins syndrome belongs to the mandibulofacial dysostoses (MFD), a group of disorders including Nager syndrome, Miller syndrome and MFD with macrocephaly amongst others."
    explanation: >-
      Names the group and its members as the source states them.

- name: Diamond-Blackfan anemia 10 (RPS26)
  description: >-
    The nearest neighbour, and the one most easily conflated with this entry:
    RPS26 is the protein TSR2 escorts, and RPS26 variants produce the same
    combined DBA-plus-mandibulofacial picture. Two of the six families in the
    same report had RPS26 variants. The distinction is not phenotypic - it is
    the gene, and the inheritance that follows from it: RPS26 is autosomal and
    heterozygous, TSR2 is X-linked and hemizygous.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two mutations in unrelated families were seen in RPS26, the known DBA10 gene."
    explanation: >-
      Establishes that the same combined phenotype arises from RPS26 in other
      families.

- name: Diamond-Blackfan anemia with RPS28 variants
  description: >-
    The third genotype found in the same six-family series, from de novo
    variants at the RPS28 start codon. Also autosomal, also indistinguishable
    on the craniofacial phenotype alone.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo mutations affecting the RPS28 start codon were found in two unrelated probands, identifying RPS28 as a novel disease gene."
    explanation: The third gene in the same differential.

- name: GATA1-related X-linked Diamond-Blackfan anemia
  description: >-
    The other X-linked DBA. It presents the same segregation pattern in a
    pedigree - affected males, carrier mothers - so a family history cannot
    distinguish it from DBA14, and both genes have to be tested. GATA1 is a
    transcription-factor lesion rather than a ribosome-assembly one, and does
    not carry the mandibulofacial phenotype.
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GATA1- and TSR2-related DBA syndrome are inherited in an X-linked manner."
    explanation: >-
      Names the two X-linked DBA genes that share this segregation pattern.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    One kindred, two affected males, from the 2014 gene-discovery series of six
    families with combined DBA and mandibulofacial dysostosis. No further TSR2
    families were found in the literature searched for this entry, and no
    population rate has been estimated for this genotype. No rate is set: a
    case count is not a population rate.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In another family a likely pathogenic X-linked mutation affecting a highly conserved residue was found in TSR2, which encodes a direct binding partner of RPS26."
    explanation: >-
      The single family, out of six studied, in which the TSR2 variant was
      found.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Family 1, the probands are male cousins whose mothers are sisters."
    explanation: >-
      The two affected individuals, and that they are one kindred rather than
      two independent observations.

treatments:
- name: Corticosteroid Therapy
  description: >-
    First-line for the anemia, and effective in this genotype: the TSR2 proband
    was diagnosed at ten months and responded to steroids. GeneReviews
    recommends starting a trial at twelve months rather than earlier, to avoid
    steroid-induced growth deficiency during the first year.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Impaired Erythroid Progenitor Output
    description: >-
      Corticosteroids act on the erythroid failure rather than on the
      escortin lesion; how they do so is not established in DBA.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diamond-Blackfan anemia was diagnosed at age 10 months and responded to steroid treatment."
    explanation: >-
      Steroid response in the TSR2 proband - genotype-specific rather than
      class-level evidence for this treatment.
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corticosteroid treatment, recommended in children at age 12 months or older, improves the red blood cell count in approximately 60%-80% of affected individuals."
    explanation: >-
      The class-level response rate and the timing recommendation. INDIRECT: a
      statement about DBA as a whole, not about the TSR2 genotype.

- name: Red Cell Transfusion
  description: >-
    Chronic transfusion carries the child through the first year, before the
    steroid trial is started, and is the fallback for steroid non-responders.
    Its own principal complication is iron overload.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: red blood cell transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Macrocytic anemia
    description: >-
      Transfusion replaces the missing red cells; it does not act on any
      mechanism node upstream of the anemia.
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic transfusion with packed red blood cells is necessary during the first year of life to avoid steroid-induced growth deficiency."
    explanation: >-
      States the indication and the reason for the sequencing with steroids.
      INDIRECT: class-level DBA management, not TSR2-specific.

- name: Iron Chelation Therapy
  description: >-
    Required once a transfusion burden accumulates. GeneReviews sets the
    threshold at ten to twelve transfusions and singles out deferiprone as an
    agent to avoid in DBA because of neutropenia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deferasirox
      term:
        id: CHEBI:49005
        label: deferasirox
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Iron chelation therapy with deferasirox orally or desferrioxamine subcutaneously is recommended after ten to 12 transfusions."
    explanation: >-
      The agents and the threshold. INDIRECT: class-level DBA management.
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Deferiprone for the treatment of iron overload (which can cause neutropenia)"
    explanation: >-
      The agents-to-avoid statement behind the second half of this treatment's
      description, and the reason therapeutic_agent binds deferasirox rather
      than the chelator a reader might otherwise reach for. INDIRECT:
      class-level DBA management, not a TSR2-specific observation.

- name: Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative option for the haematologic arm, and the only treatment
    in this list that acts on the escortin lesion at all - by replacing the
    haematopoietic compartment with cells that do not carry the variant. It
    does nothing for the craniofacial phenotype, which is already established
    at birth.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Impaired Erythroid Progenitor Output
    description: >-
      Replaces the failing erythroid compartment with donor progenitors.
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation, the only curative therapy for the hematologic manifestations of DBA syndrome, is often recommended for those who are transfusion dependent or develop other cytopenias."
    explanation: >-
      The indication and the explicit limitation to the haematologic
      manifestations. INDIRECT: class-level DBA management.

- name: Craniofacial and Otologic Reconstructive Surgery
  description: >-
    Cleft palate repair and otoplasty in both affected males, tolerated well in
    each. Recorded because tolerance of anaesthesia and surgery is a real
    question in a marrow-failure syndrome, and both patients answer it in the
    same direction.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: craniofacial and otologic reconstructive surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A number of surgical procedures, including submucous cleft palate repair and otoplasties, were well tolerated."
    explanation: The proband's surgical course.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "He tolerated corrective surgical procedures well."
    explanation: The cousin's surgical course.

- name: Hearing Aids and Audiologic Rehabilitation
  description: >-
    Both affected males were fitted with hearing aids. The treatment term is
    the clinical action, with the device carried as a qualifier: NCIT's hearing
    aid concept is a device and is not reachable from Clinical Intervention or
    Procedure, so it cannot sit in the `term` slot.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting and audiologic rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Hearing impairment
    description: >-
      Amplification compensates for the conductive loss; it does not correct
      the canal or middle-ear anatomy.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss was treated with hearing aids."
    explanation: The management of the hearing loss in the affected cousin.

- name: Multidisciplinary Management of Congenital Malformations
  description: >-
    DBA is a malformation syndrome as well as an anemia, and the non-erythroid
    findings are managed by the relevant subspecialties rather than by the
    haematologist.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cleft lip/palate and ocular, skeletal, genitourinary, cardiac, and endocrine complications are best managed in collaboration with appropriate subspecialists."
    explanation: >-
      The management principle, stated for DBA as a class. Two of the listed
      categories - cleft palate and genitourinary - are represented in this
      kindred.

- name: Malignancy Surveillance
  description: >-
    Diamond-Blackfan anemia carries an increased risk of AML, myelodysplastic
    syndrome and solid tumours, and GeneReviews recommends four- to six-monthly
    clinical review with blood counts. Whether the TSR2 genotype carries that
    risk is unknown - see the `tsr2-cancer-risk` discussion - so this is
    recorded as management extrapolated from the class, which is what the
    single reported family's follow-up to ages 16 and 24 cannot confirm or
    refute.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cancer surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "DBA syndrome is associated with an increased risk for acute myelogenous leukemia, myelodysplastic syndrome, and solid tumors including osteogenic sarcoma."
    explanation: >-
      The risk the surveillance addresses. INDIRECT: stated for DBA as a class,
      with no TSR2-specific data.
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cancer surveillance includes history, physical examination, and blood counts every four to six months."
    explanation: >-
      The recommended interval and content. INDIRECT for the same reason.

- name: Genetic Counseling and Carrier Testing
  description: >-
    X-linked inheritance changes the counselling arithmetic relative to the
    autosomal dominant bulk of DBA: a carrier mother has a 50% transmission
    risk per pregnancy, sons who inherit are affected and daughters who inherit
    are usually not. Both affected males in this kindred had carrier mothers,
    and identification of female heterozygotes becomes possible once the
    familial variant is known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked DBA syndrome: If the mother of an affected male has a GATA1 or TSR2 pathogenic variant, the chance of transmitting it in each pregnancy is 50%: males who inherit the pathogenic variant will be affected; females who inherit the pathogenic variant will be heterozygotes and will usually not be affected."
    explanation: >-
      States the transmission risks for TSR2 specifically.

experimental_models:
- name: Humanized yeast expressing hTsr2 E64G
  experimental_model_type: OTHER
  description: >-
    A conditional PGAL1-TSR2 Saccharomyces cerevisiae strain in which yeast
    Tsr2 is repressed and the human protein - wild type or the DBA14 E64G
    variant - is supplied from a plasmid. This is the only system in which the
    human disease allele has been tested functionally, and it carries the whole
    weight of the functional argument for pathogenicity. Its readouts are
    growth, cytoplasmic accumulation of the immature 20S pre-rRNA, and direct
    binding of recombinant human Tsr2 to human eS26.
  organism:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:30201955
  modeled_mechanisms:
  - target: TSR2 Escortin Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The binding assays use recombinant human Tsr2 and human eS26, so for this
      node the model is not really yeast at all - it is human proteins in
      vitro, and it reproduces the molecular lesion directly.
    limitations: >-
      A binding measurement on purified proteins does not establish the
      intracellular consequence, and the assay was run across a salt series
      rather than at a physiological condition alone.
    readouts:
    - name: Binding of human eS26 to immobilised GST-hTsr2
      target: TSR2 Escortin Deficiency
      direction: DECREASED
      interpretation: >-
        The disease allele's cargo affinity is reduced relative to wild type.
      evidence:
      - reference: PMID:30201955
        reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Binding to human eS26 is weaker for hTsr2E64G mutant than the WT"
        explanation: The measurement itself, in the stated direction.
    - name: Far-UV circular dichroism spectra of wild-type and E64G human Tsr2
      target: TSR2 Escortin Deficiency
      direction: UNCHANGED
      interpretation: >-
        A deliberate negative result: secondary structure is unchanged, so the
        binding defect is not a folding defect.
      evidence:
      - reference: PMID:30201955
        reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This weaker interaction is not due to perturbed folding of hTsr2E64G since far-UV circular dichroism (CD) measurements revealed identical secondary structure content for mutant and WT proteins"
        explanation: >-
          Reports the unchanged secondary-structure content and draws the
          inference this readout records.
    evidence:
    - reference: PMID:30201955
      reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Notably, a Diamond-Blackfan anemia-associated Tsr2 mutant protein is impaired in binding to ESS, unveiling a critical role for this interaction in human hematopoiesis."
      explanation: >-
        The authors' own statement that the disease-associated protein is the
        one they characterised, which is what makes this model informative for
        this node.
  - target: Defective Small-Subunit Maturation and 18S rRNA Processing
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Yeast expressing the human disease allele grow poorly and accumulate
      immature 20S pre-rRNA in the cytoplasm, and excess eS26 rescues the
      growth defect - which is what ties the phenotype to eS26 supply rather
      than to some other consequence of expressing a human protein in yeast.
    limitations: >-
      The host is yeast, and the yeast Tsr2 is repressed rather than deleted,
      so the assay reads a humanized replacement under a heterologous promoter.
      The yeast intermediate is 20S pre-rRNA; the human counterpart is 18S-E,
      and no equivalent measurement has been made in a DBA14 patient cell.
      Yeast has neither erythropoiesis nor a pharyngeal arch, so the model
      cannot speak to either arm of the human phenotype.
    readouts:
    - name: Cytoplasmic 20S pre-rRNA by FISH
      target: Defective Small-Subunit Maturation and 18S rRNA Processing
      direction: INCREASED
      interpretation: >-
        Accumulation of the immature precursor in the cytoplasm is the standard
        readout of stalled small-subunit maturation.
      evidence:
      - reference: PMID:30201955
        reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Tsr2 DBA mutant cells (hTsr2E64G) accumulate immature 20S pre-rRNA in the cytoplasm."
        explanation: The measurement and its direction.
    - name: Growth of PGAL1-TSR2 cells expressing hTsr2E64G
      target: Defective Small-Subunit Maturation and 18S rRNA Processing
      direction: DECREASED
      interpretation: >-
        The organism-level correlate of the maturation defect in this system.
      evidence:
      - reference: PMID:30201955
        reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Yeast cells expressing hTsr2E64G were strongly growth impaired"
        explanation: The growth measurement.
    evidence:
    - reference: PMID:30201955
      reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Tsr2 DBA mutant cells (hTsr2E64G) accumulate immature 20S pre-rRNA in the cytoplasm."
      explanation: >-
        Establishes that the humanized strain reproduces a ribosome-maturation
        defect, which is why it is treated as informative for this node.
  - target: Deficient eS26 Incorporation into the Small Ribosomal Subunit
    relationship: RESCUES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The eS26-overexpression arm. Restoring eS26 supply corrects the growth
      defect caused by the human disease allele, which is the experiment that
      places eS26 insufficiency on the causal path rather than beside it.
    limitations: >-
      A rescue in yeast by overexpression says the pathway runs through eS26
      supply in that system; it does not show that eS26 is limiting in a human
      erythroid progenitor, and no human rescue experiment has been reported.
    readouts:
    - name: Growth of hTsr2E64G cells with eS26 overexpression
      target: Deficient eS26 Incorporation into the Small Ribosomal Subunit
      direction: RESTORED
      interpretation: >-
        Growth is restored by supplying the cargo, implicating cargo supply as
        the limiting step.
      evidence:
      - reference: PMID:30201955
        reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Overexpression of eS26 rescues from the impaired growth."
        explanation: The rescue result.
    evidence:
    - reference: PMID:30201955
      reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overexpression of eS26 rescues from the impaired growth."
      explanation: >-
        The rescue is what makes this system informative about eS26
        incorporation specifically rather than about TSR2 in general.

animal_models:
- name: Streaked hairlessness cattle (TSR2 exon 5 splice-site variant)
  species: Cattle
  genotype: TSR2 exon 5 5'-splice-junction point variant, X-linked
  publication: PMID:26203908
  genes:
  - preferred_term: TSR2
    term:
      id: hgnc:25455
      label: TSR2
  description: >-
    The only naturally occurring animal TSR2 variant on record: four related
    Pezzata Rossa cows across three generations with hairless streaks along the
    lines of Blaschko, caused by a splice variant producing two frameshifted
    transcripts. It is curated here because it is a truncating TSR2 allele in a
    mammal and therefore the closest thing to a null model of this gene - and
    because what it produces is a phenotype nobody has described in DBA14. The
    cows are female heterozygotes whose skin phenotype follows Blaschko's
    lines, which is the visible signature of X-inactivation mosaicism.
  modeled_mechanisms:
  - target: TSR2 Escortin Deficiency
    relationship: PERTURBS
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      A truncating variant that removes roughly a quarter of the protein
      perturbs TSR2 function. It is not curated as recapitulating the human
      disease: the allele class is different (truncating rather than a
      cargo-binding missense), the animals are heterozygous females rather than
      hemizygous males, and the phenotype is cutaneous.
    limitations: >-
      No haematologic or craniofacial assessment of the affected cows is
      reported, so the absence of a DBA-like phenotype in this model is
      unexamined rather than demonstrated - this cannot be read as a negative
      result. The animals are heterozygous with mosaic X-inactivation, which is
      a different genetic state from a hemizygous male. Bovine and human hair
      follicle biology also differ, and humans with DBA14 have no reported hair
      phenotype.
    readouts:
    - name: TSR2 transcripts in lesional skin
      target: TSR2 Escortin Deficiency
      direction: ALTERED
      interpretation: >-
        Both mutant transcripts are predominantly detected in the hairless
        skin, alongside the physiological ones - the mosaic pattern expected
        from an X-linked allele in a heterozygous female.
      evidence:
      - reference: PMID:26203908
        reference_title: "Hairless Streaks in Cattle Implicate TSR2 in Early Hair Follicle Formation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Interestingly, in addition to the presence of both physiological TSR2 transcripts, the two mutant transcripts were predominantly detected in the hairless skin of the affected cows."
        explanation: >-
          Records which transcripts are present where, and is the observation
          that ties the lesional skin to the mutant allele.
    evidence:
    - reference: PMID:26203908
      reference_title: "Hairless Streaks in Cattle Implicate TSR2 in Early Hair Follicle Formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A point mutation at the 5'-splice junction of exon 5 of the TSR2, 20S rRNA accumulation, homolog (S. cerevisiae), gene led to the production of two mutant transcripts, both of which contain a frameshift and generate a premature stop codon predicted to truncate approximately 25% of the protein."
      explanation: >-
        Establishes that the model carries a truncating TSR2 allele, which is
        what makes it a perturbation of this node.
    - reference: PMID:26203908
      reference_title: "Hairless Streaks in Cattle Implicate TSR2 in Early Hair Follicle Formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The non-syndromic hairlessness phenotype observed occurred across three generations of a single family and was compatible with an X-linked mode of inheritance."
      explanation: >-
        The phenotype and its X-linked segregation - and, in the word
        "non-syndromic", the reason this is a perturbation rather than a
        recapitulation.

discussions:
- discussion_id: tsr2-single-family
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is a single kindred with a single missense allele, plus functional work in
    a humanized yeast system, enough to call TSR2 a definitive DBA gene - and
    what would a second family change?
  attaches_to:
  - genetic#TSR2
  - pathophysiology#TSR2 Escortin Deficiency
  rationale: >-
    The whole entry rests on Family 1 of the 2014 series: two affected male
    cousins, one c.191A>G allele. The reporting authors called it "likely
    pathogenic" and wrote that functional studies were outside their purview.
    Those studies exist now and are strong - the human protein folds normally,
    binds eS26 weakly, fails to support growth in yeast, and is rescued by
    excess eS26 - but they establish that the allele is damaging, not that
    damaging TSR2 alleles cause this disease in the population.

    What is missing is genetic replication. A second unrelated family with an
    independent TSR2 allele and the same phenotype would settle it; so would a
    de novo variant in a sporadic case. Until then the honest reading is that
    the gene-disease relationship is supported mechanistically and by one
    segregating pedigree, which is what GeneReviews reflects when it introduces
    TSR2 with "rarely". This entry does not upgrade the authors' own hedge.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional studies of the newly identified and presumably disease causing genes would strengthen the evidence for pathogenicity, but is at this time out of our purview."
    explanation: >-
      The authors state the gap themselves at the time of the report.
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rarely, the molecular diagnosis can be established in a male proband by identification of a hemizygous pathogenic variant in GATA1 or TSR2 associated with X-linked DBA syndrome."
    explanation: >-
      GeneReviews accepts TSR2 as a diagnostic gene while marking it rare.
      INDIRECT: the sentence is about diagnostic practice, and is cited here
      for the qualifier it carries rather than for a claim about evidence
      strength.

- discussion_id: tsr2-craniofacial-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a defect in the escortin for one small-subunit ribosomal protein
    produce a mandibulofacial dysostosis, when most DBA genotypes do not?
  attaches_to:
  - pathophysiology#Abnormal Craniofacial Embryonic Development
  rationale: >-
    This is the load-bearing unexplained step in the pathograph. Ribosome
    biogenesis is required by every cell, and the great majority of DBA
    genotypes produce anemia with, at most, thumb and craniofacial anomalies of
    a different pattern. Here the craniofacial phenotype is a full
    mandibulofacial dysostosis and it is the finding that brought both patients
    to attention.

    Two things make it more than a curiosity. First, it is not TSR2-specific:
    the same 2014 series found the same combined phenotype in RPS26 and RPS28
    families, so whatever explains it is a property of small-subunit assembly
    rather than of the escortin. Second, the obvious analogy - cranial neural
    crest, the cell population implicated in Treacher Collins - has never been
    tested for any of these three genes. The gene-discovery paper goes no
    further than "abnormal embryologic development", and neither does this
    entry.

    What would move it: an eS26-deficiency model with a craniofacial readout,
    or single-cell work asking whether pharyngeal-arch progenitors are
    unusually sensitive to eS26 supply.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the phenotype combining features of TCS with DBA is genetically heterogeneous."
    explanation: >-
      Establishes that the combined phenotype is not tied to TSR2 alone, which
      is what makes this a question about small-subunit assembly rather than
      about the escortin.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each of the pathogenic variants identified is predicted to impede ribosome biogenesis, which in turn could result in altered cell growth and proliferation, causing abnormal embryologic development, defective erythropoiesis and reduced growth."
    explanation: >-
      The furthest the source goes, and the level at which the craniofacial
      node is stated. INDIRECT: the sentence is a prediction, not a result.

- discussion_id: tsr2-female-carriers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are heterozygous TSR2 carriers truly unaffected, or only unexamined - and
    could skewed X-inactivation produce a phenotype in a carrier female?
  attaches_to:
  - inheritance#X-linked recessive
  - genetic#TSR2
  rationale: >-
    The two carrier mothers in the reported kindred had neither the facial
    phenotype nor a history of DBA, and GeneReviews states that heterozygous
    females "will usually not be affected". "Usually" is doing work there, and
    nothing in the report says the mothers had a blood count or eADA measured -
    which matters, because the marker profile in this family was abnormal in a
    male who was never anemic. A carrier with a raised MCV and eADA would look
    entirely well.

    The mechanism is available. TSR2 is subject to X-inactivation rather than
    escaping it, so a carrier female is a mosaic of expressing and
    non-expressing cells and her phenotype should depend on the skew. The
    bovine TSR2 model is the visible demonstration of exactly this: the
    affected animals are heterozygous females whose hairless streaks follow
    Blaschko's lines, the classic pattern of X-inactivation mosaicism in skin.

    What would settle it: blood counts, red-cell indices and eADA in obligate
    carriers, read against their X-inactivation skew.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither had facial features suggestive of Treacher Collins syndrome, other malformation or a history of DBA."
    explanation: >-
      What is actually recorded about the two carrier mothers - absence of
      malformations and of a DBA history, not a normal laboratory workup.
  - reference: PMID:29022598
    reference_title: "Landscape of X chromosome inactivation across human tissues."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Examples of genes where the ASE-based assessment of XCI status match previously reported assignments (TSR2 , inactive; XIST, escape; ZBED1, escape)."
    explanation: >-
      Establishes that TSR2 is subject to X-inactivation rather than escaping
      it, which is what makes carrier females mosaic and makes skew a plausible
      modifier. INDIRECT: an allele-specific-expression survey across GTEx
      tissues, not an observation in a TSR2 carrier. Quoted with the source's
      own spacing before the comma, an artifact of the figure legend.
  - reference: PMID:26203908
    reference_title: "Hairless Streaks in Cattle Implicate TSR2 in Early Hair Follicle Formation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The stripes occurred in a consistent pattern resembling the lines of Blaschko."
    explanation: >-
      A heterozygous-female TSR2 phenotype following the pattern of
      X-inactivation mosaicism, in cattle. INDIRECT: a different species, a
      different allele class and a tissue with no human counterpart in this
      disease; cited as a demonstration that heterozygous TSR2 females can be
      affected at all.

- discussion_id: tsr2-bovine-model-mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The only naturally occurring animal TSR2 variant causes hair follicle
    dysplasia with no reported anemia or craniofacial anomaly, while the human
    variant causes anemia and mandibulofacial dysostosis with no reported hair
    phenotype. Is this a species difference, an allele-class difference, or
    simply two incompletely examined phenotypes?
  attaches_to:
  - animal_models#Streaked hairlessness cattle (TSR2 exon 5 splice-site variant)
  - pathophysiology#TSR2 Escortin Deficiency
  rationale: >-
    Evidence exists in the model and its translational validity is the open
    question, which is what distinguishes this from a plain knowledge gap.

    The confounds run in both directions and neither has been controlled. The
    bovine allele is truncating and the human allele is a cargo-binding
    missense, so they may not be the same lesion. The cows are heterozygous
    females with mosaic X-inactivation and the patients are hemizygous males,
    so they are not in the same genetic state. And crucially, neither phenotype
    was looked for in the other species: the cattle report describes no
    haematology, and the human report describes no hair abnormality. "Not
    reported" is not "absent", and this entry does not record the bovine model
    as failing to recapitulate the human disease for exactly that reason.

    A knock-in of the human E64G allele in a mammal, phenotyped for both blood
    and skin, would separate the three explanations. Absent that, the honest
    position is that TSR2 is a housekeeping escortin whose tissue-restricted
    phenotypes are unexplained in either species.
  evidence:
  - reference: PMID:26203908
    reference_title: "Hairless Streaks in Cattle Implicate TSR2 in Early Hair Follicle Formation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, by dissecting a naturally occurring mutation in a domestic animal species, we identified TSR2 as a regulator of hair follicle development."
    explanation: >-
      The model's own conclusion - a hair follicle function for TSR2, which is
      not a function this disease is known to involve.
  - reference: PMID:26203908
    reference_title: "Hairless Streaks in Cattle Implicate TSR2 in Early Hair Follicle Formation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The non-syndromic hairlessness phenotype observed occurred across three generations of a single family and was compatible with an X-linked mode of inheritance."
    explanation: >-
      The bovine phenotype is described as non-syndromic, which is the
      mismatch: the human phenotype is a multisystem syndrome.

- discussion_id: tsr2-stress-ribosome-role
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    TSR2 also removes and reinstalls eS26 on mature ribosomes as part of a
    reversible stress response. Does loss of that second function contribute to
    DBA14, or is the disease entirely a biogenesis defect?
  attaches_to:
  - pathophysiology#Impaired Escortin Handover of eS26
  rationale: >-
    The entry models TSR2 as a one-way delivery chaperone, because that is the
    function the disease allele was tested against. But the same protein has a
    second, later-described job: under sodium, sorbitol or pH stress it
    releases eS26 from fully assembled ribosomes to generate a distinct
    ribosome population, stores the freed protein, and reinstalls it when the
    stress passes. That is a regulated, reversible activity on mature
    ribosomes, not a biogenesis step.

    Whether the E64G allele impairs it is unknown - and it is not obvious that
    it would fail in the same direction, since a chaperone that binds eS26 too
    weakly might release it too readily as easily as fail to deliver it. The
    work is in yeast and the stresses are osmotic and pH, neither of which is
    an obvious feature of an erythroid progenitor's life. It is recorded here
    because if this activity does contribute, the pathograph's single
    biogenesis chain is the wrong shape rather than merely incomplete.
  evidence:
  - reference: PMID:35213229
    reference_title: "The chaperone Tsr2 regulates Rps26 release and reincorporation from mature ribosomes to enable a reversible, ribosome-mediated response to stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The chaperone Tsr2 releases Rps26 in the presence of high Na+ or pH in vitro and is required for Rps26 release in vivo."
    explanation: >-
      Establishes the second function - release from mature ribosomes - that
      this entry does not model.
  - reference: PMID:35213229
    reference_title: "The chaperone Tsr2 regulates Rps26 release and reincorporation from mature ribosomes to enable a reversible, ribosome-mediated response to stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Moreover, Tsr2 stores free Rps26 and promotes reincorporation of the protein, thereby repairing the subunit after the Na+ stress subsides."
    explanation: >-
      The reinstallation half of the cycle, which makes this a regulated
      activity rather than a variant of the delivery function already modelled.

- discussion_id: tsr2-cancer-risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does DBA14 carry the malignancy predisposition documented for
    Diamond-Blackfan anemia as a class, and should TSR2 carriers and patients
    be entered into DBA cancer surveillance?
  attaches_to:
  - treatments#Malignancy Surveillance
  - genetic#TSR2
  rationale: >-
    This is the question with the most direct consequence for a family carrying
    this variant, and it has no evidence either way.

    The class-level risk is real and substantial - AML, myelodysplastic
    syndrome and solid tumours including osteosarcoma - and GeneReviews sets a
    four- to six-monthly surveillance interval on that basis. But the DBA
    registries that generated those figures are built from the autosomal
    dominant ribosomal-protein genotypes. Nobody has reported a malignancy in a
    TSR2 patient, and nobody could: the entire cohort is two men, well at ages
    16 and 24 at last report.

    The mechanistic argument cuts both ways. If the cancer risk in DBA follows
    from chronic ribosomal stress and p53 signalling in the marrow, DBA14
    should share it, because it converges on the same eS26-deficient subunit.
    If it follows instead from the specific ribosomal protein lost, or from
    cumulative steroid and transfusion exposure, a mildly affected TSR2 patient
    may not. Extending surveillance is the conservative call and is what this
    entry records; asserting that the risk is established for this genotype
    would not be.
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "DBA syndrome is associated with an increased risk for acute myelogenous leukemia, myelodysplastic syndrome, and solid tumors including osteogenic sarcoma."
    explanation: >-
      The class-level risk being extrapolated. INDIRECT: no TSR2 patient is in
      the data behind it.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was in good health at age 24 years."
    explanation: >-
      The extent of the follow-up available for the genotype, and the reason
      the question cannot currently be answered from it.

notes: >-
  **Why this is a separate entry rather than a subtype of Diamond-Blackfan
  anemia.** The design register's test is a distinct MONDO identity plus a
  substantially independent mechanism, and DBA14 meets both.

  MONDO:0010493 is its own term - `is_a` MONDO:0015253, with its own OMIM
  (300946), DOID:0111897 and GARD identifiers - and it is the term this entry
  binds. On mechanism: MONDO:0015253 is anchored on ribosomal protein
  haploinsufficiency, and TSR2 is not a ribosomal protein. It is the escortin
  that delivers one, so the lesion sits upstream of that step, in the delivery
  rather than in the gene dose, and the disease allele is a cargo-binding
  missense in a correctly folded protein rather than the loss of one of two
  copies. The inheritance differs in kind rather than degree - X-linked
  recessive against MONDO:0015253's predominantly autosomal dominant
  transmission - which changes recurrence risk, carrier testing, and who in a
  pedigree needs assessment. And mandibulofacial dysostosis, the feature the
  MONDO term is named for, is not a feature of MONDO:0015253.

  The counter-argument is real and worth stating: DBA14 is a numbered DBA
  subtype, and the two concepts converge downstream on the same erythroid
  failure. That convergence is modelled explicitly here rather than hidden -
  `Deficient eS26 Incorporation into the Small Ribosomal Subunit` is the node
  at which the two mechanisms meet. What tipped the decision is that folding
  this into the parent concept would have required either flattening the
  escortin mechanism into a haploinsufficiency node, which is false, or running
  a parallel mechanism chain inside an entry whose framing is
  haploinsufficiency, which would make that entry harder to read for the great
  majority of DBA it actually describes.

  This entry does not contradict the parent concept's framing. GeneReviews
  already treats a hemizygous TSR2 variant as establishing a molecular
  diagnosis of DBA, and that same sentence is quoted here; this entry is the
  expansion of that pointer, not a correction of it.

  **What was searched and not found.** No ClinGen gene-disease validity
  assertion for TSR2 was available in the reference cache, so no ClinGen
  classification is cited and this entry makes no claim about ClinGen's view.
  No second family and no de novo case were found. PubMed searches for a
  Tsr2 mouse or zebrafish model returned nothing: every hit was either an
  unrelated thrombospondin type-1 repeat ("TSR2" domain) paper, the bovine
  study curated below, or a review. Accordingly there is no whole-organism
  vertebrate model of this gene, which is why the humanized yeast strain
  carries the entire functional argument.

  **Deep research.** One deep-research run was made, with the `claude_code`
  provider (`research/Diamond-Blackfan_Anemia_14_With_Mandibulofacial_Dysostosis-deep-research-claude_code.md`).
  Its preflight returns WARN because it cites OMIM 606164 alongside the correct
  300946; reading the report shows 606164 attached to a sibling entity it names
  explicitly, not to this disease, so the flag is not an identity mismatch.
  Three of its findings were not used. It asserts that no naturally occurring
  TSR2 disease exists in any non-human species, which the bovine report
  curated in `animal_models` contradicts. It attributes the humanized-yeast
  functional work to the 2014 gene-discovery paper, whose authors wrote that
  functional studies were outside their purview; that work is the 2018 paper
  and is cited as such here. And its suggested binding for elevated fetal
  haemoglobin resolves to a haemoglobin H term rather than a fetal haemoglobin
  one, so the HPO term was chosen independently. Its usable contributions were
  the eADA test-performance reference and the malignancy-surveillance question.

  **Named-entity hazards this entry navigated.** Three literatures collide on
  this disease and none of them is about it. Papers on RPS26 and DBA10 concern
  the cargo, not the escortin, and are cited here only where the quoted
  sentence is about TSR2 or about the shared pathway explicitly. The
  mandibulofacial dysostosis literature is dominated by TCOF1/POLR1 Treacher
  Collins and by EFTUD2 mandibulofacial dysostosis with microcephaly; both are
  carried as differential diagnoses and neither is used as evidence. And
  "TSR2" also names a thrombospondin type-1 repeat domain in a substantial
  matrix-biology literature, which is why every reference here was checked for
  the gene rather than matched on the string - that string match is what makes
  the model-organism search look productive when it is not.

inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  penetrance: UNKNOWN
  expressivity: VARIABLE
  description: >-
    TSR2 is on the X chromosome. In the one reported kindred the variant is
    hemizygous in the two affected male cousins and heterozygous in their
    unaffected mothers, and GeneReviews records TSR2-related DBA as X-linked
    with heterozygous females usually unaffected.

    `penetrance` is left UNKNOWN rather than called. Two affected hemizygotes
    is not a denominator: no unaffected hemizygous male has been reported, and
    with n=2 that is uninformative either way. The class-level statement for
    DBA as a whole is that penetrance is incomplete, but that is a statement
    about the autosomal dominant ribosomal-protein genotypes that make up the
    bulk of DBA and cannot be transferred to a hemizygous X-linked allele.

    `expressivity` is called VARIABLE on within-family evidence rather than on
    the class-level statement: the two cousins carry the same allele, and one
    was diagnosed with DBA at ten months and treated with steroids while the
    other never had overt anemia and showed only the laboratory markers. The
    craniofacial arm was present in both.
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "GATA1- and TSR2-related DBA syndrome are inherited in an X-linked manner."
    explanation: >-
      Names TSR2 as one of the two X-linked DBA genes.
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked DBA syndrome: If the mother of an affected male has a GATA1 or TSR2 pathogenic variant, the chance of transmitting it in each pregnancy is 50%: males who inherit the pathogenic variant will be affected; females who inherit the pathogenic variant will be heterozygotes and will usually not be affected."
    explanation: >-
      States the recessive X-linked transmission pattern for TSR2 specifically,
      including that heterozygous females are usually unaffected.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further, the gene is located on the X chromosome, consistent with phenotypic expression in the males only."
    explanation: >-
      The original report's own segregation argument in the index family.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diamond-Blackfan anemia was diagnosed at age 10 months and responded to steroid treatment."
    explanation: >-
      The proband's haematologic course. Cited here as one half of the
      within-family expressivity contrast; on its own it says nothing about
      variability, hence INDIRECT.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient never had overt anemia, but elevated mean corpuscular volume, eADA and hemoglobin F were consistent with DBA markers."
    explanation: >-
      The affected cousin, carrying the same allele, with no overt anemia. The
      other half of the expressivity contrast; INDIRECT for the same reason.

genetic:
- name: TSR2
  gene_term:
    preferred_term: TSR2
    term:
      id: hgnc:25455
      label: TSR2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: X-linked recessive
  association: >-
    A hemizygous missense variant in TSR2 is the reported cause of DBA14. TSR2
    encodes a 191-residue protein whose residues 11-92 form a WGG domain of
    then-unknown function; the disease allele changes a residue inside that
    domain. TSR2 is not a ribosomal protein - it is the direct binding partner
    and nuclear escortin of RPS26/eS26, whose own haploinsufficiency causes
    DBA10.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In another family a likely pathogenic X-linked mutation affecting a highly conserved residue was found in TSR2, which encodes a direct binding partner of RPS26."
    explanation: >-
      The gene-discovery statement, and the authors' own hedge - "likely
      pathogenic" - which this entry preserves rather than upgrading.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "cervisiae), encodes a 191 amino acid pre-RNA processing protein with amino acids 11 to 92 forming a WGG domain of unknown function."
    explanation: >-
      Establishes the gene product's size and the WGG domain the disease allele
      falls inside. Quoted from mid-sentence because the preceding clause
      carries the source's own misspelling of the yeast species name.
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "the molecular diagnosis can be established in a male proband by identification of a hemizygous pathogenic variant in GATA1 or TSR2 associated with X-linked DBA syndrome"
    explanation: >-
      Independent confirmation, in the DBA GeneReviews chapter, that a
      hemizygous TSR2 variant establishes a molecular diagnosis of DBA.
  - reference: PMID:37973818
    reference_title: "Perspectives of current understanding and therapeutics of Diamond-Blackfan anemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies also indicated that non-RP genes like GATA1, TSR2, are associated with DBA"
    explanation: >-
      A recent review naming TSR2 among the non-ribosomal-protein DBA genes.
      INDIRECT because it asserts the gene-disease association at the level of
      the DBA class rather than reporting a case or a functional result.
  variants:
  - name: c.191A>G (p.Glu64Gly)
    description: >-
      The single reported disease allele, hemizygous in both affected male
      cousins and heterozygous in their unaffected mothers. It changes a
      glutamate conserved from C. elegans to human inside the WGG domain. Later
      biochemistry showed the mutant protein folds normally but binds eS26
      weakly, so the allele is best read as a partial loss of the escortin's
      cargo-binding function rather than as a null.
    evidence:
    - reference: PMID:24942156
      reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "His mother is heterozygous for the mutation while his unaffected sister is wild type."
      explanation: >-
        Sanger confirmation of the segregation: carrier mother, wild-type
        unaffected sister.
    - reference: PMID:30201955
      reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Binding to human eS26 is weaker for hTsr2E64G mutant than the WT"
      explanation: >-
        Direct biochemical measurement of the allele's functional consequence
        on the human proteins.
    - reference: PMID:30201955
      reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "This weaker interaction is not due to perturbed folding of hTsr2E64G since far-UV circular dichroism (CD) measurements revealed identical secondary structure content for mutant and WT proteins"
      explanation: >-
        Excludes misfolding, which is what makes this a specific cargo-binding
        defect rather than a destabilised protein.

pathophysiology:
- name: TSR2 Escortin Deficiency
  biological_scale: MOLECULAR
  description: >-
    A hemizygous missense variant places a glycine where a conserved glutamate
    sits in the TSR2 WGG domain. The mutant protein is present and correctly
    folded; what it has lost is affinity for its cargo. The node is therefore
    named for a functional deficiency of the escortin, not for absence of the
    protein and not for reduced gene dosage - there is no second allele to be
    dosed, and the biochemistry shows a normally folded product.
  genes:
  - preferred_term: TSR2
    term:
      id: hgnc:25455
      label: TSR2
  downstream:
  - target: Impaired Escortin Handover of eS26
    description: >-
      Weakened cargo binding is the proximal cause of a failed handover.
  evidence:
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In another family a likely pathogenic X-linked mutation affecting a highly conserved residue was found in TSR2, which encodes a direct binding partner of RPS26."
    explanation: >-
      Establishes the lesion this node states: a variant at a conserved residue
      of the RPS26-binding protein.
  - reference: PMID:30201955
    reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "This weaker interaction is not due to perturbed folding of hTsr2E64G since far-UV circular dichroism (CD) measurements revealed identical secondary structure content for mutant and WT proteins"
    explanation: >-
      Supports naming the node a functional deficiency rather than an absence:
      the mutant protein is made and folds like the wild type.

- name: Impaired Escortin Handover of eS26
  biological_scale: MOLECULAR
  description: >-
    TSR2 does three things in sequence: it dissociates the importin:eS26
    complex on the nuclear side by a RanGTP-independent route, it binds and
    shields the released eS26 from proteolysis, and it delivers it to the 90S
    pre-ribosome. The disease allele is impaired at the binding step - it holds
    eS26 and the eukaryote-specific segment that recruits it less tightly -
    which puts every downstream step of the handover at risk. What has not been
    measured is which of the three steps fails first in a patient cell; the
    pathway description is from yeast and reconstituted human proteins.
  biological_processes:
  - preferred_term: ribosomal small subunit assembly
    modifier: DECREASED
    term:
      id: GO:0000028
      label: ribosomal small subunit assembly
  downstream:
  - target: Deficient eS26 Incorporation into the Small Ribosomal Subunit
    description: >-
      A cargo that is not handed over is not incorporated, and unprotected
      eS26 is a proteolysis substrate.
  evidence:
  - reference: PMID:25144938
    reference_title: "A RanGTP-independent mechanism allows ribosomal protein nuclear import for ribosome assembly."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Subsequently, Tsr2 binds the released eS26, shields it from proteolysis, and ensures its safe delivery to the 90S pre-ribosome."
    explanation: >-
      Defines the escortin function that this node reports as impaired.
  - reference: PMID:25144938
    reference_title: "A RanGTP-independent mechanism allows ribosomal protein nuclear import for ribosome assembly."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "In vitro studies revealed that Tsr2 efficiently dissociates importin:eS26 complexes via an atypical RanGTP-independent mechanism that terminates the import process."
    explanation: >-
      The first step of the handover, and the reason a chaperone rather than
      RanGTP terminates import for this particular cargo.
  - reference: PMID:30201955
    reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Notably, a Diamond-Blackfan anemia-associated Tsr2 mutant protein is impaired in binding to ESS, unveiling a critical role for this interaction in human hematopoiesis."
    explanation: >-
      Ties the disease allele specifically to failure of the recognition step
      that starts the handover.

- name: Deficient eS26 Incorporation into the Small Ribosomal Subunit
  biological_scale: MOLECULAR
  description: >-
    The consequence of a failed handover is a shortfall of eS26 on the
    assembling 40S subunit. This is the node at which DBA14 converges on
    DBA10: RPS26 haploinsufficiency reaches the same state by halving the
    supply of the protein, while TSR2 deficiency reaches it by failing to
    deliver a normal supply. That convergence is an inference from the two
    genes' shared biology and is not something anyone has measured in a DBA14
    patient cell.
  biological_processes:
  - preferred_term: ribosomal small subunit biogenesis
    modifier: DECREASED
    term:
      id: GO:0042274
      label: ribosomal small subunit biogenesis
  downstream:
  - target: Defective Small-Subunit Maturation and 18S rRNA Processing
    description: >-
      A subunit missing eS26 does not complete maturation on schedule.
  evidence:
  - reference: PMID:30201955
    reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Thus, ESS:Tsr2 interactions are critical to dissociate eS26 from the importin and to protect and target eS26 to the pre-ribosome in vivo."
    explanation: >-
      The authors' summary that the interaction the disease allele weakens is
      what targets eS26 to the pre-ribosome. INDIRECT because it is a
      conclusion drawn from yeast genetics rather than a measurement of eS26
      occupancy on human DBA14 ribosomes.
  - reference: PMID:30201955
    reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Overexpression of eS26 rescues from the impaired growth."
    explanation: >-
      The rescue arm, and the strongest available argument that the pathway
      from the TSR2 allele runs through eS26 supply rather than through some
      other TSR2 function: raising eS26 restores growth to cells expressing the
      human disease allele. INDIRECT because the experiment is in yeast.

- name: Defective Small-Subunit Maturation and 18S rRNA Processing
  biological_scale: CELLULAR
  description: >-
    Cells expressing the human disease allele accumulate immature 20S pre-rRNA
    in the cytoplasm, the classic readout of a stalled small-subunit maturation
    pathway, and grow poorly. In human cells the equivalent intermediate is the
    18S-E pre-rRNA; the measurement available for this allele is the yeast one,
    and this node states it at that level.
  biological_processes:
  - preferred_term: maturation of SSU-rRNA
    modifier: DECREASED
    term:
      id: GO:0030490
      label: maturation of SSU-rRNA
  downstream:
  - target: Ribosomal Stress Response
    description: >-
      Stalled subunit maturation is the canonical trigger of the ribosomal
      stress response in the ribosomopathies.
  - target: Impaired Erythroid Progenitor Output
    description: >-
      The erythroid arm of the phenotype. The step is asserted at the level the
      gene-discovery paper asserts it - defective erythropoiesis as a
      consequence of impeded ribosome biogenesis - not at the level of a
      measured erythroid defect in a DBA14 cell.
  - target: Abnormal Craniofacial Embryonic Development
    description: >-
      The craniofacial arm. Same standing as the erythroid edge: the source
      states abnormal embryologic development as a consequence of impeded
      ribosome biogenesis without identifying the cell population involved.
  evidence:
  - reference: PMID:30201955
    reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Tsr2 DBA mutant cells (hTsr2E64G) accumulate immature 20S pre-rRNA in the cytoplasm."
    explanation: >-
      The measured maturation defect caused by the human disease allele.
  - reference: PMID:30201955
    reference_title: "Molecular basis for disassembly of an importin:ribosomal protein complex by the escortin Tsr2."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Yeast cells expressing hTsr2E64G were strongly growth impaired"
    explanation: >-
      The growth phenotype accompanying the maturation defect, in the same
      humanized system.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each of the pathogenic variants identified is predicted to impede ribosome biogenesis, which in turn could result in altered cell growth and proliferation, causing abnormal embryologic development, defective erythropoiesis and reduced growth."
    explanation: >-
      The gene-discovery paper's own causal statement, and the basis for both
      downstream edges out of this node. INDIRECT and deliberately so: the
      authors write "predicted" and "could result", and this entry does not
      strengthen that.

- name: Ribosomal Stress Response
  biological_scale: CELLULAR
  description: >-
    Impaired ribosome biogenesis in DBA activates p53 and a set of associated
    responses - translational dysfunction, inflammation, imbalanced globin and
    heme synthesis, autophagy dysregulation - that converge on the erythroid
    compartment. This node is curated at the level of the DBA class. Nobody has
    measured p53 activation, or any of the rest of it, in a TSR2-mutant cell,
    so the node carries the class-level claim and says so rather than being
    dropped: it is the step that connects a general biogenesis defect to a
    selectively erythroid outcome, and leaving it out would make the pathograph
    look better evidenced than it is.
  downstream:
  - target: Impaired Erythroid Progenitor Output
    description: >-
      The route by which the ribosomal stress response is thought to produce
      the erythroid failure in DBA generally.
  evidence:
  - reference: PMID:37973818
    reference_title: "Perspectives of current understanding and therapeutics of Diamond-Blackfan anemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "P53 activation, translational dysfunction, inflammation, imbalanced globin/heme synthesis, and autophagy dysregulation were shown to contribute to disrupted erythropoiesis and impaired red blood cell production."
    explanation: >-
      Names the components of the response and its erythroid consequence.
      INDIRECT because the review states this for Diamond-Blackfan anemia as a
      class; no TSR2-specific measurement exists.

- name: Impaired Erythroid Progenitor Output
  biological_scale: CELLULAR
  description: >-
    Erythroid progenitors are the compartment that fails in DBA, producing a
    normochromic macrocytic anemia with reticulocytopenia while leukocytes and
    platelets are preserved. In the TSR2 kindred the severity of this node
    differs between the two carriers of the same allele: one required steroid
    treatment from ten months, the other never had overt anemia and showed only
    the biochemical markers.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030218
      label: erythrocyte differentiation
  downstream:
  - target: Macrocytic anemia
    description: The peripheral consequence of erythroid progenitor failure.
  - target: Increased mean corpuscular volume
    description: >-
      Stressed erythropoiesis produces larger red cells even where the
      haemoglobin is preserved, which is why this marker was abnormal in the
      cousin who was never anemic.
  - target: Elevated red cell adenosine deaminase activity
    description: >-
      The classic DBA biochemical marker, and one of the three abnormalities
      recorded in the non-anemic TSR2 carrier.
  - target: Persistence of hemoglobin F
    description: >-
      Fetal haemoglobin persistence as a marker of stressed erythropoiesis.
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "DBA syndrome is characterized by a profound normochromic and usually macrocytic anemia with normal leukocytes and platelets, congenital malformations in up to 50% of affected individuals, and growth deficiency in 30% of affected individuals."
    explanation: >-
      Establishes that the haematologic lesion of DBA is a selectively
      erythroid one. INDIRECT: a class-level statement about DBA, applied here
      to the TSR2 genotype.
  - reference: PMID:24942156
    reference_title: "Diamond-Blackfan anemia with mandibulofacial dystostosis is heterogeneous, including the novel DBA genes TSR2 and RPS28."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diamond-Blackfan anemia was diagnosed at age 10 months and responded to steroid treatment."
    explanation: >-
      The erythroid failure as observed in the TSR2 proband, including its
      steroid responsiveness.

- name: Abnormal Craniofacial Embryonic Development
  biological_scale: TISSUE
  description: >-
    Both affected males have a mandibulofacial dysostosis: derivatives of the
    first and second pharyngeal arches and the external ear are hypoplastic or
    absent. What produces it is unresolved. In Treacher Collins syndrome, the
    craniofacial ribosomopathy this phenotype most resembles, the lesion is
    referred to cranial neural crest; nothing analogous has been shown for
    TSR2, and this node deliberately stops at "abnormal embryologic
    development", the level the gene-discovery paper states. See the
    `tsr2-craniofacial-mechanism` discussion.

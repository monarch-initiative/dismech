name: Diamond-Blackfan Anemia 14 with Mandibulofacial Dysostosis
creation_date: "2026-09-07T23:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
  term:
    id: MONDO:0010493
    label: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
description: >
  Diamond-Blackfan anemia 14 with mandibulofacial dysostosis (DBA14; OMIM
  300946) is the X-linked form of Diamond-Blackfan anemia caused by a
  hemizygous variant in TSR2. It was defined in a single kindred of two
  affected male cousins who combined the craniofacial picture of a
  mandibulofacial dysostosis - bilateral microtia with absent external
  auditory canals, micrognathia, cleft palate, downslanted palpebral fissures
  and midfacial hypoplasia - with the erythroid phenotype of DBA.

  Its mechanistic interest is that the lesion is in the *delivery* of a
  ribosomal protein rather than in the protein itself. TSR2 is not a
  ribosomal protein: it is the dedicated escortin for eS26/RPS26, the small
  subunit protein whose own haploinsufficiency causes DBA10. TSR2 strips
  eS26 off its importin inside the nucleus by a RanGTP-independent route,
  shields the freed protein from proteolysis, and hands it to the 90S
  pre-ribosome. So where most DBA genotypes halve the dose of a structural
  ribosomal protein, DBA14 leaves the protein intact and disables its
  chaperone, converging on the same downstream defect - a small subunit
  assembled without enough eS26 - from a different starting point.

  The entry is curated at that level of confidence and no higher. The
  gene-disease association rests on one family with one missense allele
  (c.191A>G, p.Glu64Gly), and the authors who reported it said functional
  studies were beyond their scope. Those studies were done later, in a
  humanized yeast system: the human E64G protein folds normally but binds
  eS26 more weakly, and yeast expressing it grow poorly and accumulate
  immature 20S pre-rRNA in the cytoplasm, a defect that excess eS26 rescues.
  That is strong mechanistic support for pathogenicity; it is not a second
  family.

synonyms:
- DBA14
- Diamond-Blackfan anemia 14 with mandibulofacial dysostosis, X-linked recessive
- Diamond-Blackfan anemia caused by mutation in TSR2
- TSR2 Diamond-Blackfan anemia
- Diamond-Blackfan anaemia caused by mutation in TSR2


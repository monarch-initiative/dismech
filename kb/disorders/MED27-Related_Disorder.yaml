    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient phenotypes are highly homogeneous, including global developmental delay, intellectual disability, axial hypotonia with distal spasticity, dystonic movements, and cerebellar hypoplasia."
    explanation: Documents the homogeneous neurodevelopmental and cerebellar phenotype downstream of MED27 dysfunction.
  downstream:
  - target: Intellectual disability
    description: Disrupted neuronal developmental programs contribute to intellectual disability.
  - target: Distal spasticity
    description: Disrupted motor developmental programs contribute to axial hypotonia with distal spasticity.
  - target: Dystonia
    description: Disrupted basal ganglia/cerebellar circuits contribute to dystonic movements.
  - target: Cerebellar hypoplasia
    description: Impaired cerebellar development produces cerebellar hypoplasia.
  - target: Cataracts
    description: Disrupted lens developmental programs contribute to cataracts in severely affected individuals.

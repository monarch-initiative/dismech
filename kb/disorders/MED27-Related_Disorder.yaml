    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33443317
    reference_title: "MED27 Variants Cause Developmental Delay, Dystonia, and Cerebellar Hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of multiple patients with biallelic MED27 variants supports the critical role of MED27 in normal human neural development, particularly for the cerebellum."
    explanation: Establishes MED27's critical role in human neural (especially cerebellar) development.
  downstream:
  - target: Neurodevelopmental and cerebellar developmental dysregulation
    description: >-
      Core-Mediator dysfunction disrupts neurodevelopmental transcriptional programs, with
      particular impact on cerebellar development.
- name: Neurodevelopmental and cerebellar developmental dysregulation
  description: >
    Downstream of MED27 core-Mediator dysfunction, neurodevelopmental gene-expression programs
    are dysregulated, producing global developmental delay, intellectual disability, axial
    hypotonia with distal spasticity, dystonic movements, and cerebellar hypoplasia, with
    cataracts and seizures in severely affected individuals.

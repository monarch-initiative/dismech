name: MED27-Related Disorder
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- NEDSCAC
- Neurodevelopmental disorder with spasticity, cataracts, and cerebellar hypoplasia
- MED27-related developmental delay, dystonia and cerebellar hypoplasia
- Ponto-cerebello-lental degeneration
description: >
  MED27-related disorder (NEDSCAC) is a rare autosomal recessive neurodevelopmental disorder
  caused by biallelic variants in MED27, which encodes a subunit of the structural core of the
  Mediator transcriptional coactivator complex. The phenotype is highly homogeneous: global
  developmental delay, intellectual disability, axial hypotonia with distal spasticity, dystonic
  movements, and cerebellar hypoplasia, with congenital cataracts and seizures in severely
  affected individuals. Later international cohorts describe a variable ponto-cerebello-lental
  degeneration with movement disorders. Because MED27 acts in the constitutive core of Mediator
  rather than its dissociable kinase module, NEDSCAC is one of the recessive "core-module"
  MEDopathies, and MED27 appears particularly critical for cerebellar development.

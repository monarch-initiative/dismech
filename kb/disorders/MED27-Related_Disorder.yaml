name: MED27-Related Disorder
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- NEDSCAC
- Neurodevelopmental disorder with spasticity, cataracts, and cerebellar hypoplasia
- MED27-related developmental delay, dystonia and cerebellar hypoplasia
description: MED27-related disorder (NEDSCAC) is an autosomal recessive neurodevelopmental
  disorder caused by biallelic variants in MED27, which encodes subunit 27 of the Mediator transcriptional
  coactivator complex. Affected individuals present with global developmental delay, intellectual disability,
  axial hypotonia with distal spasticity, dystonic movements, and cerebellar hypoplasia, with seizures
  and cataracts in severely affected individuals and neuroimaging findings that can include pontine hypoplasia,
  basal ganglia signaling changes, and a 'hot cross bun' sign.

    explanation: Primary gene-disease report.
  - reference: PMID:33314088
    reference_title: "Biallelic mutations of CFAP58 are associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, whole-exome sequencing was conducted on 55 patients with MMAF, and biallelic mutations of CFAP58 were identified in two patients."
    explanation: Independent replication.
  - reference: PMID:40675161

  evidence:
  - reference: PMID:42799967
    reference_title: "CFAP58-deficient human sperm show radial spoke-doublet microtubule interface abnormalities and successful fertilization by ICSI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural analysis showed disruption of the \"9 + 2\" axoneme, loss of the central pair, and disorganization of accessory structures."
    explanation: Axonemal disruption and central pair loss in patient sperm.
  - reference: PMID:32791035
    reference_title: "Bi-allelic Loss-of-function Variants in CFAP58 Cause Flagellar Axoneme and Mitochondrial Sheath Defects and Asthenoteratozoospermia in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoblotting and immunofluorescence assays showed that the abundances of axoneme ultrastructure markers SPAG6 and SPEF2 and a mitochondrial sheath protein, HSP60, were significantly reduced in the spermatozoa from men harboring bi-allelic CFAP58 variants."
    explanation: Reduced axonemal and mitochondrial sheath markers in patient sperm.
  - reference: PMID:40675161

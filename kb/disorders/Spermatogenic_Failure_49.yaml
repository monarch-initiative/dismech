name: Spermatogenic Failure 49
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF49
- spermatogenic failure 49
- CFAP58-related multiple morphological abnormalities of the sperm flagella
- CFAP58-related asthenoteratozoospermia
description: >-
  Spermatogenic failure 49 (SPGF49) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in CFAP58 (formerly C10orf80
  or CCDC147), which encodes a testis-enriched cilia- and flagella-associated
  coiled-coil protein. CFAP58 runs along the whole sperm flagellum and is
  concentrated in the midpiece. Reported alleles are nonsense, frameshift and
  splice variants, and the protein is absent from patient sperm.

  Affected men have asthenoteratozoospermia with multiple morphological
  abnormalities of the sperm flagella (MMAF). Electron microscopy shows a
  disorganized 9+2 axoneme, frequent loss of the central pair, damaged radial
  spokes and malformed mitochondrial and fibrous sheaths; axonemal markers
  SPAG6 and SPEF2 and the mitochondrial sheath protein HSP60 are reduced in
  sperm. Whether CFAP58 acts primarily in central pair assembly or at the
  junction between radial spokes and doublet microtubules is not settled.
  Cfap58 knockout and patient-allele knock-in mice reproduce MMAF, and
  knockout mice also show manchette and sperm head-shaping defects. No
  respiratory or other ciliary disease has been reported in patients.
  Fertilization, pregnancy and live births have been achieved with
  intracytoplasmic sperm injection (ICSI).
disease_term:
  preferred_term: spermatogenic failure 49
  term:
    id: MONDO:0030868
    label: spermatogenic failure 49
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 619144. ClinGen has no
  gene-disease validity classification for CFAP58: the ClinGen gene-validity
  export snapshot of 2026-10-14 (data/clingen/gene_validity.csv) has no CFAP58
  row, and no GeneReviews chapter covers this disease (Bookshelf index
  snapshot 2026-09-10). Primary reports cited here (PMID:32791035,
  PMID:33314088, PMID:40675161, PMID:42799967) are cached as abstracts only;
  PMID:34089056 is full text. The genotype of each reported family is
  therefore not recorded variant by variant. A homozygous CFAP58 stop-gain
  (p.Gln454*) found in a consanguineous Argentinian patient with dysplasia of
  the fibrous sheath is relatively common in Ashkenazi Jewish gnomAD samples,
  and the authors left its causality open.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic CFAP58 variants, homozygous or compound
    heterozygous; homozygous variants have co-segregated with MMAF in
    consanguineous Pakistani families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:40675161
    reference_title: "A novel mutation in CFAP58 leads to MMAF in humans and mice by disrupting CP assembly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify a novel homozygous mutation in the CFAP58 gene (c.562C > T, p. R188*) that co-segregates with the multiple morphological abnormalities of the flagella (MMAF) phenotype in two unrelated consanguineous families from Pakistan."
    explanation: Recessive co-segregation in two consanguineous families.
  - reference: PMID:32791035
    reference_title: "Bi-allelic Loss-of-function Variants in CFAP58 Cause Flagellar Axoneme and Mitochondrial Sheath Defects and Asthenoteratozoospermia in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identified bi-allelic loss-of-function variants in CFAP58 by using whole-exome sequencing in five (5.6%) unrelated individuals from a cohort of 90 MMAF-affected Chinese men."
    explanation: Biallelic variants in five unrelated men.
pathophysiology:
- name: Loss of CFAP58 Protein in Sperm
  description: >-
    Biallelic truncating variants abolish CFAP58 in sperm. CFAP58 lies along
    the whole flagellum and is concentrated in the midpiece. It has no known
    enzymatic activity; human sperm studies place it at the connection between
    radial spokes and doublet microtubules, and mouse studies describe it as
    a stabilizer of intraflagellar and intramanchette transport cargo such as
    CCDC42. It is treated here as a structural component of the flagellum.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP58
    term:
      id: hgnc:26676
      label: CFAP58
  molecular_functions:
  - preferred_term: structural molecule activity
    modifier: DECREASED
    term:
      id: GO:0005198
      label: structural molecule activity
  cellular_components:
  - preferred_term: Sperm midpiece
    term:
      id: GO:0097225
      label: sperm midpiece
  downstream:
  - target: Sperm Axoneme Disorganization with Central Pair and Radial Spoke Defects
    causal_link_type: DIRECT
    description: Without CFAP58 the radial spokes are damaged and the axoneme, including the central pair, is not stably assembled.
    evidence:
    - reference: PMID:42799967
      reference_title: "CFAP58-deficient human sperm show radial spoke-doublet microtubule interface abnormalities and successful fertilization by ICSI."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mechanistically, CFAP58 may contribute to the structural connection between radial spokes (RS) and doublet microtubules (DMTs); its absence leads to RS damage and axonemal instability."
      explanation: Radial spoke damage and axonemal instability in CFAP58-deficient human sperm.
  - target: Sperm Mitochondrial Sheath Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mitochondrial sheath defects accompany the axonemal lesion; whether
      they follow from CFAP58's midpiece localization or from the failed
      axoneme is not known.
  evidence:
  - reference: PMID:33314088
    reference_title: "Biallelic mutations of CFAP58 are associated with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants are rare and pathogenic, and CFAP58 was absent in the CFAP58-mutated sperm."
    explanation: Protein absent from patient sperm.
  - reference: PMID:32791035
    reference_title: "Bi-allelic Loss-of-function Variants in CFAP58 Cause Flagellar Axoneme and Mitochondrial Sheath Defects and Asthenoteratozoospermia in Humans and Mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence assays showed that CFAP58 localized at the entire flagella of control sperm and predominantly concentrated in the mid-piece."
    explanation: Flagellar and midpiece localization in control sperm.
  - reference: PMID:38602507
    reference_title: "CFAP58 is involved in the sperm head shaping and flagellogenesis of cattle and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, it may be a transported cargo protein that plays a role in stabilizing other cargo proteins, such as CCDC42, in the intra-manchette transport/intra-flagellar transport pathway."
    explanation: Mouse evidence for a stabilizing, non-enzymatic role.
- name: Sperm Axoneme Disorganization with Central Pair and Radial Spoke Defects
  description: >-
    The 9+2 axoneme is disrupted, the central pair is frequently lost, radial
    spokes are damaged and accessory structures are disorganized. Central pair
    (SPAG6) and C1b projection (SPEF2) markers are reduced in sperm. One study
    of a patient allele in knock-in mice describes a failure of central pair
    assembly during spermiogenesis; another, in human sperm, places the
    primary lesion at the radial spoke-doublet interface.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Sperm
    term:
      id: CL:0000019
      label: sperm
  cellular_components:
  - preferred_term: Axonemal central apparatus

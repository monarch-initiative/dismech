animal_models:
- name: Cfap58 knockout mouse
  species: Mouse
  genotype: Cfap58-/- (CRISPR-Cas9 knockout), homozygous
  publication: PMID:32791035
  description: >-
    Male Cfap58 knockout mice are infertile with severe flagellar defects. A
    second knockout also showed abnormal manchette structure, misshapen sperm
    heads and increased sperm apoptosis.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The knockout reproduces the human flagellar phenotype and male infertility.
    limitations: >-
      Knockout mice also show manchette and head-shaping defects and sperm
      apoptosis that have not been described in patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Head shaping in mouse spermatids produces a hooked head, so the
        manchette-dependent head defect in knockout mice may not have a human
        counterpart; patient reports describe flagellar rather than head
        defects.
    evidence:
    - reference: PMID:32791035
      reference_title: "Bi-allelic Loss-of-function Variants in CFAP58 Cause Flagellar Axoneme and Mitochondrial Sheath Defects and Asthenoteratozoospermia in Humans and Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The male mice were infertile and presented with severe flagellar defects, consistent with the sperm phenotypes in MMAF-affected men."
      explanation: Knockout recapitulates human MMAF.
    - reference: PMID:38602507
      reference_title: "CFAP58 is involved in the sperm head shaping and flagellogenesis of cattle and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, by generating gene knockout mice, we found for the first time that the loss of Cfap58 not only causes severe defects in the sperm tail, but also affects the manchette structure, resulting in abnormal sperm head shaping."
      explanation: Second knockout with tail and head defects.
- name: Cfap58 p.R188* knock-in mouse
  species: Mouse
  genotype: Cfap58 M/M (homozygous knock-in mimicking the patient p.R188* allele)
  publication: PMID:40675161
  description: >-
    Mice homozygous for an allele mimicking the Pakistani patient stop-gain
    are infertile with MMAF and sperm axonemes lacking the central pair.
  modeled_mechanisms:
  - target: Sperm Axoneme Disorganization with Central Pair and Radial Spoke Defects
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The knock-in reproduces central pair loss and MMAF.
    limitations: >-
      The central pair assembly mechanism was shown in mice; a separate study
      of human sperm emphasizes the radial spoke-doublet interface, so which
      structure fails first is not settled.
    divergences:
    - divergence_type: CONTESTED_ASSUMPTION
      materiality: QUALIFYING
      description: >-
        The knock-in study frames central pair assembly as the primary lesion,
        while human sperm data attribute the axonemal instability to radial
        spoke damage at the doublet interface.
    evidence:
    - reference: PMID:40675161
      reference_title: "A novel mutation in CFAP58 leads to MMAF in humans and mice by disrupting CP assembly."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Cfap58M/M mice exhibited infertility and recapitulated the MMAF phenotype observed in human patients."
      explanation: The patient-allele mouse reproduces the human phenotype.
    - reference: PMID:40675161
      reference_title: "A novel mutation in CFAP58 leads to MMAF in humans and mice by disrupting CP assembly."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transmission electron microscopy (TEM) analysis revealed the absence of the central pair (CP) of microtubules in the axonemal structure of sperm flagella."
      explanation: Central pair loss in knock-in sperm.

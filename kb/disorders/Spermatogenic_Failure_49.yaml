    cohort benefited from ICSI, and a later series reported fertilization and
    pregnancy with CFAP58-deficient sperm despite profound axonemal defects.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar form and motility irrelevant to fertilization.
    evidence:
    - reference: PMID:42799967
      reference_title: "CFAP58-deficient human sperm show radial spoke-doublet microtubule interface abnormalities and successful fertilization by ICSI."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notably, despite profound structural defects, fertilization and pregnancy were successfully achieved through ICSI using CFAP58-deficient sperm."
      explanation: ICSI bypasses the flagellar defect.
  evidence:

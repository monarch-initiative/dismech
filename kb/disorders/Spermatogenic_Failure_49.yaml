    evidence_source: HUMAN_CLINICAL
    snippet: "We identify a novel homozygous mutation in the CFAP58 gene (c.562C > T, p. R188*) that co-segregates with the multiple morphological abnormalities of the flagella (MMAF) phenotype in two unrelated consanguineous families from Pakistan."

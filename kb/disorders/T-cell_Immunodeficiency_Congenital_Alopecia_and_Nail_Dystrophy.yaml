genetic:
- name: FOXN1
  gene_term:
    preferred_term: FOXN1
    term:
      id: hgnc:12765
      label: FOXN1
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function FOXN1 variants cause nude SCID. Reported alleles
    include the founder nonsense variant R255X (c.792C>T, exon 5), R320W, and
    S188fs. R255X accounts for most reported patients, all descending from a
    single 19th-century ancestral couple in Acerno, southern Italy; the same
    allele was later found in a Portuguese child of consanguineous parents.

    Scope note on other FOXN1 genotypes, which are NOT this disease. Monoallelic
    FOXN1 loss-of-function (FOXN1 haploinsufficiency, autosomal dominant,
    OMIM 600838) is ascertained through low TRECs at newborn screening and
    causes T-cell lymphopenia that improves with age, with normal or nearly
    normal hair and only subtle nail dystrophy (spoon nails), and generally no
    congenital athymia. Compound heterozygous hypomorphic genotypes can produce
    selective thymic hypoplasia with a T-/loB+NK+ SCID presentation and
    completely normal hair and nails. IUIS lists FOXN1 haploinsufficiency as its
    own row, distinct from the AR FOXN1 deficiency row that this entry curates.

    Historical note on the founding human report. Frank et al., Nature 1999
    (PMID:10206641, "Exposing the human nude phenotype") identified FOXN1 as the
    gene mutated in the human nude phenotype and is listed in the top-level
    references block. Its cached PubMed record carries no abstract text, so no
    exact-quote snippet can be drawn from it, and it is deliberately not used as
    an evidence item anywhere in this entry.
  evidence:
  - reference: PMID:28077132
    reference_title: "FOXN1 deficient nude severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nude severe combined immunodeficiency is a rare inherited disease caused
      by autosomal recessive loss-of-function mutations in FOXN1.
    explanation: >-
      Establishes FOXN1 as the causative gene and loss of function as the
      mechanism.
  - reference: PMID:15180707
    reference_title: "Ancestral founder mutation of the nude (FOXN1) gene in congenital severe combined immunodeficiency associated with alopecia in southern Italy population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first described human FOXN1 mutation was a C792T transition in exon 5
      resulting in the nonsense mutation R255X, and was detected in two probands
      originated from a small community in southern Italy.
    explanation: Identifies the prototype human allele and its geographic origin.
  - reference: PMID:15180707
    reference_title: "Ancestral founder mutation of the nude (FOXN1) gene in congenital severe combined immunodeficiency associated with alopecia in southern Italy population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three haplotypes identified, 3/R255X/3, 3/R255X/2 and 3/R255X/1, are
      consistent with a single ancestral origin for the mutation R255X.
    explanation: >-
      Haplotype analysis establishing R255X as a single ancestral founder
      allele.
- name: FOXN1 (heterozygous - distinct entity, not this disease)
  gene_term:
    preferred_term: FOXN1
    term:
      id: hgnc:12765
      label: FOXN1
  association: MODIFIER
  relationship_type: MODIFIER
  notes: >-
    Recorded for boundary clarity only. Monoallelic FOXN1 loss-of-function is a
    separate autosomal dominant entity (FOXN1 haploinsufficiency, OMIM 600838,
    its own IUIS row) and is NOT the disease curated here. It is included in
    this section so that a curator or reader encountering a heterozygous FOXN1
    result is not led to this entry by default. Its immunophenotype is milder
    and age-limited, and the ectodermal features are minimal.
  evidence:
  - reference: PMID:31447097
    reference_title: "Heterozygous FOXN1 Variants Cause Low TRECs and Severe T Cell Lymphopenia, Revealing a Crucial Role of FOXN1 in Supporting Early Thymopoiesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified several newborns with low levels of T cell receptor excision
      circles (TRECs) and T cell lymphopenia at birth, who carried heterozygous
      loss-of-function FOXN1 variants.
    explanation: >-
      Documents the heterozygous newborn-screening phenotype that defines the
      separate haploinsufficiency entity.
  - reference: PMID:31447097
    reference_title: "Heterozygous FOXN1 Variants Cause Low TRECs and Severe T Cell Lymphopenia, Revealing a Crucial Role of FOXN1 in Supporting Early Thymopoiesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Longitudinal analysis showed persistent T cell lymphopenia during infancy,
      often associated with nail dystrophy.
    explanation: >-
      Characterizes the milder, age-limited heterozygous phenotype, distinct
      from the congenital athymia of the recessive disease.
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital athymia is generally not present, and individuals have normal
      or almost normal appearing hair with only subtle nail dystrophy (spoon
      nails).
    explanation: >-
      The guideline states explicitly that heterozygous FOXN1 carriers lack the
      athymia and the ectodermal hallmarks that define this entry's disease.

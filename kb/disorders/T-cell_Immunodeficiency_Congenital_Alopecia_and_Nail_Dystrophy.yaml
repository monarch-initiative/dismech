      of absent thymus resulting in severe T-cell immunodeficiency, congenital
      alopecia universalis and nail dystrophy.
    explanation: >-
      States that the severe T-cell immunodeficiency is the consequence of the
      absent thymus.
  - reference: PMID:28077132
    reference_title: "FOXN1 deficient nude severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although B-cells are typically present in normal numbers, antibody
      production is compromised in the absence of T-cell help
    explanation: >-
      Documents the B+ immunophenotype and explains why preserved B-cell numbers
      do not confer functional humoral immunity.

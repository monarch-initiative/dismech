      explanation: >-
        States that the thymus is the organ supporting T-cell development, so
        its absence abolishes that process.
- name: Absent Thymopoiesis
  biological_scale: CELLULAR
  description: >-
    T-cell precursors arriving from the bone marrow have no thymic epithelial
    niche to interact with, so intrathymic T-cell differentiation does not
    occur. The hematopoietic stem cell compartment itself is normal - the block
    is entirely extrinsic to it.

- name: Immunoglobulin Replacement Therapy
  description: >-
    Immunoglobulin replacement compensates for the absent T-dependent antibody
    response. B cells are numerically normal in nude SCID, so the humoral defect
    is functional rather than quantitative; replacement addresses that
    functional gap and can be discontinued once thymic reconstitution restores
    T-cell help.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Profound T-Cell Lymphopenia
    treatment_effect: MODULATES
    description: >-
      Replacement immunoglobulin substitutes for the antibody responses the
      patient cannot mount without T-cell help. It compensates for a downstream
      consequence and does not alter the thymic lesion.
    evidence:
    - reference: PMID:20978268
      reference_title: "First use of thymus transplantation therapy for FOXN1 deficiency (nude/SCID): a report of 2 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both subjects developed antigen-specific proliferative responses and
        have discontinued immunoglobulin replacement.
      explanation: >-
        Shows that immunoglobulin replacement was the standing substitute for
        T-dependent antibody responses and became unnecessary once thymic
        function was restored.

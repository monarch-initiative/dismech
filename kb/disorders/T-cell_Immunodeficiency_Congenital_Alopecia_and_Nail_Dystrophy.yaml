- name: Infection Prophylaxis and Protective Isolation
  description: >-
    Supportive management that bridges the interval before and after definitive
    treatment: protective isolation in a laminar-flow room, prophylaxis against
    Pneumocystis jirovecii, fungal and viral infection, and anti-mycobacterial
    treatment for any infant already immunised with BCG. Live vaccines are
    contraindicated. Blood products, if required, must be CMV-negative,
    irradiated and leucocyte-depleted.

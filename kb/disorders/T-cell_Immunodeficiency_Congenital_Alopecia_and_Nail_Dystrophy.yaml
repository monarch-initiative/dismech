    reference_title: "FOXN1 compound heterozygous mutations cause selective thymic hypoplasia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on 2 patients with compound heterozygous mutations in forkhead
      box N1 (FOXN1), a transcription factor essential for thymic epithelial
      cell (TEC) differentiation.
    explanation: >-
      Identifies TEC differentiation as the FOXN1-dependent cellular process
      that fails.
  - reference: PMID:31566583
    reference_title: "FOXN1 compound heterozygous mutations cause selective thymic hypoplasia in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Characterization of the functional changes due to the Foxn1 mutations
      revealed a 5-amino acid segment at the end of the DNA-binding domain
      essential for the development of TECs but not keratinocytes.
    explanation: >-
      Functional dissection showing that distinct parts of the FOXN1 DNA-binding
      domain are required for the thymic and cutaneous arms, which is why
      hypomorphic genotypes can dissociate the two.
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the growth and differentiation of skin epithelial cells, including hair
      and nails
    explanation: >-
      In the thymic-defect guideline's FOXN1 section, this clause names the
      cutaneous half of the FOXN1-dependent epithelial program, alongside the
      thymic epithelial cells named in the preceding clause.
  downstream:
  - target: Athymia
    causal_link_type: DIRECT
    description: >-
      With no differentiated thymic epithelium there is no thymic organ to form;
      the result is congenital absence of a functional thymus.
    evidence:
    - reference: PMID:31447097
      reference_title: "Heterozygous FOXN1 Variants Cause Low TRECs and Severe T Cell Lymphopenia, Revealing a Crucial Role of FOXN1 in Supporting Early Thymopoiesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        FOXN1 deficiency leads to thymic aplasia, alopecia, and nail dystrophy,
        accounting for the nude/severe combined immunodeficiency (nu/SCID)
        phenotype in humans and mice.
      explanation: >-
        Links loss of the FOXN1-dependent thymic epithelium to thymic aplasia.
- name: Athymia
  biological_scale: TISSUE
  description: >-
    Congenital absence of a functional thymus. This is thymic aplasia proper -
    the organ never forms - as distinguished from the thymic hypoplasia seen in
    hematopoietic-intrinsic SCID, where an epithelial rudiment is present but is
    not populated by thymocytes.
  locations:

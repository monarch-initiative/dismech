  description: >-
    Nude SCID is caused by biallelic loss-of-function variants in FOXN1.
    Heterozygous carriers of the R255X founder allele are healthy with respect
    to the full triad, which is what allowed a 6.52% carrier frequency to
    persist in the Acerno pedigree.
  evidence:
  - reference: PMID:28077132
    reference_title: "FOXN1 deficient nude severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

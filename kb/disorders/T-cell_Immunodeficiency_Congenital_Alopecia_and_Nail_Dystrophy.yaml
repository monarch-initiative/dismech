name: T-cell Immunodeficiency, Congenital Alopecia, and Nail Dystrophy
creation_date: '2026-08-26T00:00:00Z'
category: Genetic
synonyms:
- nude SCID
- FOXN1 deficiency
- alymphoid cystic thymic dysgenesis
- winged-helix-nude
- winged helix deficiency
- severe T-cell immunodeficiency-congenital alopecia-nail dystrophy syndrome
description: >-
  Human nude SCID is an autosomal recessive inborn error of immunity caused by
  biallelic loss-of-function variants in FOXN1, the winged-helix (forkhead)
  transcription factor mutated at the nude locus of mice and rats. FOXN1 is
  expressed in thymic epithelium and in terminally differentiating skin
  epithelium, and its loss produces a single-gene lesion with two anatomically
  separate consequences. In the thymic anlage, thymic epithelial cells fail to
  differentiate, so no functional thymic microenvironment forms; the resulting
  athymia abolishes thymopoiesis and produces profound T-cell lymphopenia with
  numerically preserved B and NK cells, presenting in the first months of life
  as severe, recurrent, life-threatening infection. In the skin, loss of the
  same factor disrupts the growth-differentiation balance of keratinocytes in
  hair follicles and nail bed, producing congenital alopecia universalis and
  nail dystrophy (characteristically proximal arciform leukonychia and
  koilonychia). Because the defect is in thymic stroma rather than in
  hematopoietic stem cells, hematopoietic cell transplantation does not
  reconstitute thymopoiesis unless the graft itself carries mature donor T
  cells, and cultured thymus tissue implantation is the mechanism-directed
  treatment. The disease is ultra-rare; most reported patients descend from a
  single R255X founder pedigree in Acerno, southern Italy. Cross-references:
  OMIM:601705, Orphanet ORPHA:169095.

  Two adjacent FOXN1-related entities are deliberately NOT covered by this
  entry. (1) FOXN1 haploinsufficiency (OMIM 600838), an autosomal dominant
  condition in which heterozygous carriers are ascertained through low TRECs on
  newborn screening and show T-cell lymphopenia that improves with age, usually
  with normal or near-normal hair and only subtle nail dystrophy; IUIS lists it
  as a separate row from the AR disease. (2) Compound heterozygous hypomorphic
  FOXN1 genotypes, which can produce selective thymic hypoplasia with entirely
  normal hair and nails. Both are described in the genetic and notes sections
  here only to keep the boundary of this entry explicit.

- name: Profound T-Cell Lymphopenia
  biological_scale: ORGANISM
  description: >-
    The immunophenotype is T-negative with numerically preserved B and NK cells
    (T-B+NK+). B cells are present but antibody production is compromised
    because T-cell help is absent, so humoral as well as cellular immunity
    fails despite a normal B-cell count. This is why the entity is a combined
    immunodeficiency rather than a pure T-cell defect.

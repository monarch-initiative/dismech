      by autosomal recessive loss-of-function mutations in FOXN1.
    explanation: States the autosomal recessive, loss-of-function basis of the disease.
  - reference: PMID:8911612
    reference_title: "Congenital Alopecia and nail dystrophy associated with severe functional T-cell immunodeficiency in two sibs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on two sisters affected by congenital alopecia, nail dystrophy,
      and a severe T-cell immunodeficiency, presumably inherited as an
      autosomal-recessive disorder.
    explanation: >-
      The original clinical report of the syndrome in two affected sibs, from
      which autosomal recessive inheritance was inferred.
pathophysiology:
- name: FOXN1 Transcription Factor Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish FOXN1 transcription-factor
    activity. FOXN1 is a winged-helix (forkhead) DNA-binding transcription
    factor; the nonsense and frameshift alleles that cause human nude SCID
    remove or inactivate the DNA-binding domain, so the FOXN1 target gene
    program is not transcribed. This is the initiating lesion, and every
    downstream node - thymic and cutaneous alike - follows from the absence of
    this single transcriptional output rather than from any defect intrinsic to
    hematopoietic cells.
  genes:
  - preferred_term: FOXN1
    term:
      id: hgnc:12765
      label: FOXN1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline biallelic loss-of-function FOXN1 alleles; the prototype and most
      frequently reported allele is the nonsense variant R255X.
  molecular_functions:
  - preferred_term: FOXN1 winged-helix transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28077132
    reference_title: "FOXN1 deficient nude severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This gene encodes a transcription factor essential for the development of
      the thymus, the primary lymphoid organ that supports T-cell development
      and selection.
    explanation: >-
      Identifies FOXN1 as a transcription factor and establishes that its
      transcriptional output is what thymic development depends on.
  - reference: PMID:7969402
    reference_title: "New member of the winged-helix protein family disrupted in mouse and rat nude mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that one of the genes from this critical region, designated
      whn, encodes a new member of the winged-helix domain family of
      transcription factors, and that it is disrupted on mouse nu and rat rnuN
      alleles.
    explanation: >-
      Identifies the nude gene as a winged-helix transcription factor, the
      molecular identity of FOXN1 and the origin of the "winged-helix-nude"
      name.
  - reference: PMID:7969402
    reference_title: "New member of the winged-helix protein family disrupted in mouse and rat nude mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutant transcripts do not encode the characteristic DNA-binding domain,
      strongly suggesting that the whn gene is the nude gene.
    explanation: >-
      Establishes that the nude alleles act by removing the DNA-binding domain,
      i.e. by abolishing transcription-factor function.
  - reference: PMID:15180707
    reference_title: "Ancestral founder mutation of the nude (FOXN1) gene in congenital severe combined immunodeficiency associated with alopecia in southern Italy population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first described human FOXN1 mutation was a C792T transition in exon 5
      resulting in the nonsense mutation R255X, and was detected in two probands
      originated from a small community in southern Italy.
    explanation: >-
      Documents the prototype human loss-of-function allele as a nonsense
      mutation.
  downstream:
  - target: Failed Thymic Epithelial Cell Differentiation
    causal_link_type: DIRECT
    description: >-
      FOXN1 is the master regulator of thymic epithelial identity; without its
      transcriptional program the thymic epithelial compartment does not
      differentiate.
    evidence:
    - reference: PMID:31447097
      reference_title: "Heterozygous FOXN1 Variants Cause Low TRECs and Severe T Cell Lymphopenia, Revealing a Crucial Role of FOXN1 in Supporting Early Thymopoiesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FOXN1 is the master regulatory gene of thymic epithelium development."
      explanation: >-
        Directly links loss of FOXN1 to failure of the thymic epithelial
        compartment.
  - target: Impaired Keratinocyte Terminal Differentiation
    causal_link_type: DIRECT
    description: >-
      The same transcription factor is expressed in terminally differentiating
      skin epithelium, so its loss simultaneously disrupts the keratinocyte
      growth-differentiation balance in hair follicle and nail bed. This is the
      parallel, non-immunological arm of the same molecular lesion.
    evidence:
    - reference: PMID:28077132
      reference_title: "FOXN1 deficient nude severe combined immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the skin and its appendages FOXN1 is expressed in epithelial cells
        that have stopped proliferating and are in the process of terminal
        differentiation
      explanation: >-
        Establishes the cutaneous expression domain through which the same
        FOXN1 loss produces the ectodermal arm of the phenotype.
- name: Failed Thymic Epithelial Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    Without FOXN1, thymic epithelial cells fail to differentiate into the
    cortical and medullary subsets that constitute the thymic microenvironment.
    Cortical TECs normally mediate positive selection of T-cell precursors and
    medullary TECs negative selection; neither compartment forms. This is a
    stromal, non-hematopoietic defect, which is the single most important
    mechanistic fact about the disease for treatment selection.
  cell_types:
  - preferred_term: thymic epithelial cell
    term:
      id: CL:0002293
      label: epithelial cell of thymus
  - preferred_term: cortical thymic epithelial cell
    term:
      id: CL:0002364
      label: cortical thymic epithelial cell
  - preferred_term: medullary thymic epithelial cell

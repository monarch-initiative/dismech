treatments:
- name: Cultured Thymus Tissue Implantation
  description: >-
    Implantation of cultured allogeneic postnatal thymus tissue (obtained from
    infants undergoing corrective cardiac surgery) into the quadriceps muscle.
    This is the mechanism-directed treatment for nude SCID: because FOXN1 is
    expressed in thymic epithelium and not in hematopoietic cells, supplying a
    functional thymic stromal environment - rather than replacing the patient's
    own normal hematopoietic compartment - is what restores thymopoiesis. HLA
    matching is not required. Reconstitution is slow, typically taking six to
    twelve months, so supportive infection prophylaxis must bridge that
    interval. Autoimmunity, principally thyroid, is a recognised late
    complication.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cultured thymus tissue implantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_phenotypes:
  - preferred_term: Aplasia of the thymus
    term:
      id: HP:0005359
      label: Aplasia of the thymus
  - preferred_term: Decreased total T cell count
    term:
      id: HP:0005403
      label: Decreased total T cell count
  target_mechanisms:
  - target: Athymia
    treatment_effect: RESTORES
    description: >-
      The implant supplies the thymic epithelial microenvironment the patient
      never formed, directly addressing the athymia node rather than any
      hematopoietic step.
    evidence:
    - reference: PMID:28077132
      reference_title: "FOXN1 deficient nude severe combined immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Given that FOXN1 is expressed in TECs and not haematopoietic cells,
        establishing a functional thymic stromal environment is expected to
        provide more complete and long-lasting immune reconstitution
      explanation: >-
        States the mechanistic rationale for treating the stromal defect
        directly.
  - target: Absent Thymopoiesis
    treatment_effect: RESTORES
    description: >-
      Once a thymic microenvironment is present, host T-cell precursors undergo
      normal intrathymic development, producing naive T cells and TREC-positive
      recent thymic emigrants.
    evidence:
    - reference: PMID:20978268
      reference_title: "First use of thymus transplantation therapy for FOXN1 deficiency (nude/SCID): a report of 2 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In summary, thymus transplantation led to T-cell reconstitution and
        function in these FOXN1 deficient infants.
      explanation: >-
        Demonstrates restored thymopoiesis in the two FOXN1-deficient infants
        treated.
  evidence:
  - reference: PMID:20978268
    reference_title: "First use of thymus transplantation therapy for FOXN1 deficiency (nude/SCID): a report of 2 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two infants with FOXN1 deficiency were transplanted with cultured postnatal thymus tissue."
    explanation: >-
      The first application of cultured thymus tissue specifically in FOXN1
      deficiency.
  - reference: PMID:20978268
    reference_title: "First use of thymus transplantation therapy for FOXN1 deficiency (nude/SCID): a report of 2 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both subjects developed functional immunity. Subjects 1 and 2 have
      1053/mm(3) and 1232/mm(3) CD3(+) cells
    explanation: >-
      Quantifies the reconstituted T-cell compartment achieved in both treated
      FOXN1-deficient infants.
  - reference: PMID:34362576
    reference_title: "Experience with cultured thymus tissue in 105 children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with CTT led to development of naive T cells with a 1-year
      survival rate of 77% and a median follow-up time of 7.6 years.
    explanation: >-
      Provides the pooled efficacy and survival estimate across the full
      congenital-athymia cohort, which includes FOXN1 deficiency.
  - reference: PMID:34362576
    reference_title: "Experience with cultured thymus tissue in 105 children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune reconstitution sufficient to prevent infections and support
      survival typically develops 6 to12 months after administration of CTT.
    explanation: >-
      Establishes the months-long reconstitution interval that supportive care
      must bridge.
  - reference: PMID:20978268
    reference_title: "First use of thymus transplantation therapy for FOXN1 deficiency (nude/SCID): a report of 2 cases."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subject 2 developed autoimmune thyroid disease 1.6 years after transplantation."
    explanation: >-
      Supports this treatment's stated late complication: a directly observed
      case of post-implantation thyroid autoimmunity in one of the two treated
      FOXN1-deficient infants.
  notes: >-
    The IUIS/thymic-defect literature reports these outcomes for congenital
    athymia as a whole (complete DiGeorge, CHARGE, FOXN1 deficiency and others).
    The FOXN1-specific experience remains two published infants; the 105-child
    cohort figures are cohort-level, not FOXN1-specific, and are cited as such.
- name: Hematopoietic Cell Transplantation
  description: >-
    Allogeneic HCT does not correct the underlying lesion, because FOXN1 is
    expressed in thymic stroma and not in hematopoietic cells - transplanting
    normal stem cells into a patient with no thymus leaves them with nowhere to
    differentiate. Where HCT has helped in nude SCID, the benefit is attributed
    to mature donor T cells carried in the graft rather than to restored
    thymopoiesis, which is why the literature restricts it to HLA-matched
    genoidentical sibling donors, and why it is preferred chiefly when
    thymus tissue is unavailable or when rapid T-cell recovery is needed for a
    pre-existing systemic viral infection. Outcomes reported for athymia treated
    with HCT are poor.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:

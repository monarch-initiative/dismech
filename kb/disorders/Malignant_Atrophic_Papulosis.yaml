name: Malignant Atrophic Papulosis
creation_date: "2026-04-15T23:58:50Z"
updated_date: "2026-10-16T09:15:00Z"
description: >-
  Malignant atrophic papulosis is a rare obliterative vasculopathy with
  characteristic atrophic porcelain-white papules. Disease expression ranges
  from purely cutaneous lesions to lethal gastrointestinal, neurologic, and
  cardiopulmonary involvement.
category: Complex
disease_term:
  preferred_term: malignant atrophic papulosis
  term:
    id: MONDO:0011208
    label: malignant atrophic papulosis
synonyms:
- Degos disease
- Kohlmeier-Degos disease
- Köhlmeier-Degos disease
- atrophic papulosis
classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY
    notes: >-
      Invariably involves the skin with pathognomonic atrophic porcelain-white
      papules and can manifest as a purely cutaneous process.
    evidence:
    - reference: PMID:35588602
      reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It invariably involves the skin and can be a purely cutaneous process.
      explanation: >-
        Directly supports dermatologic classification as a universal feature of
        the disease.
  - classification_value: CARDIOVASCULAR
    notes: >-
      Obliterative thrombotic microvascular and fibrointimal arteriopathic
      vasculopathy that can progress to constrictive pericarditis and visceral
      ischemia.
    evidence:
    - reference: PMID:35588602
      reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Kohlmeier-Degos Disease is a unique thrombotic microvascular and
        arteriopathic vasculopathy that is highly selective in the organs it
        targets.
      explanation: >-
        Directly supports vascular and cardiovascular classification based on
        microvascular and arterial pathology.
prevalence:
- population: Global
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Extremely rare obliterative vasculopathy; population-level incidence and
    prevalence estimates are not established in the reviewed literature.
  evidence:
  - reference: PMID:38606375
    reference_title: "Malignant atrophic papulosis treated with eculizumab and hirudin: a fatal case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MAP is an extremely rare obliterative vasculopathy manifesting as benign
      cutaneous involvement or potentially malignant systemic involvement.
    explanation: >-
      Directly characterizes malignant atrophic papulosis as an extremely rare
      obliterative vasculopathy.
progression:
- phase: Onset
  age_range: Pediatric to young adulthood (reported presentations at 13 and 20 years)
  notes: >-
    Cutaneous lesions typically appear first, with reported presentations in
    childhood and young adulthood.
  evidence:
  - reference: PMID:41474865
    reference_title: "The Evolution in the Cutaneous and Gastrointestinal Pathology of Pediatric Kohlmeier-Degos Disease Under Combined Modality Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was a 13-year-old girl who presented with a few months history
      of depressed white macular skin lesions and abdominal pain.
    explanation: >-
      Documents pediatric onset at 13 years of age.
  - reference: PMID:38606375
    reference_title: "Malignant atrophic papulosis treated with eculizumab and hirudin: a fatal case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 20-year-old Chinese male appeared to have Widespread atrophic papules
      and plaques, intermittent abdominal pain, recurrent bowel perforation, and
      psoas abscess.
    explanation: >-
      Documents young adult presentation at 20 years of age.
- phase: Systemic and cardiopulmonary involvement
  age_range: Months to years after cutaneous onset (restrictive pericardial symptoms averaging 6 years after skin onset; reported presentations at ages 26, 46, and 58 years)
  notes: >-
    Systemic visceral involvement can occur months or years after the initial
    skin features; in constrictive pericarditis cases, restrictive symptoms
    developed within 12 months to 11 years (average 6 years in previously
    reported cases) following initial cutaneous presentation.
  evidence:
  - reference: PMID:36353773
    reference_title: "Atrophic Papulosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, systemic involvement can occur months or years after the initial
      skin features.
    explanation: >-
      Supports delayed progression from initial cutaneous lesions to systemic
      involvement over months or years.
  - reference: PMID:35588602
    reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The restrictive symptoms developed within 12 months, 2 years and 11 years
      following the initial skin presentation.
    explanation: >-
      Documents latency of 12 months, 2 years, and 11 years from initial skin
      presentation to restrictive pericardial symptoms in the three patients
      (ages 26, 46, and 58 years at pericarditis presentation).
  - reference: PMID:35588602
    reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are 6 other reported cases, 5 in men, with restrictive symptoms developing on average 6 years following the onset of skin disease and all with gastrointestinal involvement.
    explanation: >-
      Establishes an average 6-year interval from cutaneous onset to restrictive
      pericardial symptoms alongside gastrointestinal involvement in previously
      reported cases.
pathophysiology:
- name: Complement and interferon-mediated endothelial injury
  description: >-
    Complement activation and enhanced type I interferon signaling damage
    vascular endothelial cells and initiate the vasculopathic process.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:35588602
    reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was significant upregulation in type I interferon signaling in cases
      tested as revealed by the degree of staining for MXA, the surrogate type I
      interferon marker.
    explanation: >-
      This directly supports complement- and interferon-mediated endothelial
      injury as an initiating pathophysiologic event.
  - reference: PMID:41474865
    reference_title: "The Evolution in the Cutaneous and Gastrointestinal Pathology of Pediatric Kohlmeier-Degos Disease Under Combined Modality Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complement pathway activation and enhanced type I interferon signaling are
      held to be a critical impetus for the endothelial cell injury
    explanation: >-
      This supports the same initiating endothelial injury mechanism in a
      treated pediatric case with paired skin and intestinal biopsies.
  downstream:
  - target: Thrombotic microangiopathy and arteriolar occlusion
    description: Endothelial injury promotes intravascular thrombosis and fibrointimal arteriopathy.
  - target: Extravascular fibrosing reaction
    description: >-
      Excessive type I interferon signaling promotes influx of monocyte-derived
      dendritic cells and transdifferentiation into collagen-producing
      myofibroblasts, driving extravascular and serosal fibrosis independently
      of C5b-9-mediated microvascular thrombosis.
    evidence:
    - reference: PMID:35588602
      reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We propose that excessive type I interferon signaling results in the
        influx of monocyte derived dendritic cells with subsequent
        transdifferentiation into potent collagen producing myofibroblasts.
      explanation: >-
        Links heightened type I interferon signaling directly to monocyte-derived
        dendritic cell influx, myofibroblast transdifferentiation, and the
        extravascular fibrosing reaction.
- name: Thrombotic microangiopathy and arteriolar occlusion
  description: >-
    The disease evolves into a thrombotic microvascular and arteriopathic
    vasculopathy with microangiopathy, neointimal hyperplasia, and obliterative
    vascular occlusion.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:35588602
    reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a thrombogenic microangiopathy to a fibrointimal obliterative arteriopathy
      with an accompanying background of extravascular fibrosis
    explanation: >-
      This directly supports the occlusive microangiopathic and arteriopathic
      lesion that underlies downstream organ ischemia.
  - reference: PMID:41474865
    reference_title: "The Evolution in the Cutaneous and Gastrointestinal Pathology of Pediatric Kohlmeier-Degos Disease Under Combined Modality Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      endothelial cell necrosis and microvascular thrombosis and arteriolar and
      arterial neointimal hyperplasia with intimal fibrosis
    explanation: >-
      This provides direct pathologic evidence for thrombotic microangiopathy,
      arteriolar occlusion, and intimal fibrosis.
  downstream:
  - target: Papule
    description: Cutaneous microvascular occlusion produces the characteristic atrophic papules.
  - target: Telangiectasia
    description: Cutaneous microvascular injury and occlusion produce an erythematous or telangiectatic rim around the atrophic papular center.
  - target: Abdominal pain
    description: Mesenteric involvement can cause abdominal pain and bowel symptoms.
  - target: Intestinal ischemia
    description: Gastrointestinal microvascular occlusion can progress to ischemia and perforation.
  - target: Stroke
    description: Central nervous system infarction can occur from small-vessel occlusion.
  - target: Constrictive pericarditis
    description: Serosal and pericardial involvement can culminate in constrictive pericarditis.
- name: Extravascular fibrosing reaction
  description: >-
    An eculizumab-refractory extravascular fibrosing reaction driven by
    excessive type I interferon signaling, monocyte-derived dendritic cell
    influx, and CD34-negative myofibroblast transdifferentiation develops in
    affected tissues, contributing to serosal, pleural, and pericardial
    restriction.
  evidence:
  - reference: PMID:35588602
    reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one patient this complication developed despite receiving eculizumab, indicative that this extravascular fibrosing reaction was not complement mediated as opposed to the thrombotic microvascular component of the disease which is C5b-9 mediated.
    explanation: >-
      Demonstrates that the extravascular fibrosing reaction leading to
      constrictive pericarditis is non-complement-mediated and distinct from the
      C5b-9-mediated thrombotic microangiopathy.
  - reference: PMID:35588602
    reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that excessive type I interferon signaling results in the
      influx of monocyte derived dendritic cells with subsequent
      transdifferentiation into potent collagen producing myofibroblasts.
    explanation: >-
      Supports the type I interferon-driven monocyte-derived dendritic cell and
      myofibroblast pathway underlying extravascular fibrosis.
  - reference: PMID:41474865
    reference_title: "The Evolution in the Cutaneous and Gastrointestinal Pathology of Pediatric Kohlmeier-Degos Disease Under Combined Modality Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extravascular fibrosis with a loss in the expression of CD34 amid
      fibroblasts was observed
    explanation: This directly supports a fibrosing reaction in affected tissues.
  downstream:
  - target: Constrictive pericarditis
    description: Fibrosing serosal and pericardial remodeling leads to constrictive pericarditis and cardiopulmonary restriction.

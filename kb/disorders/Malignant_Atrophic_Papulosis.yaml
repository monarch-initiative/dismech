biochemical:
- name: Vascular C5b-9 complement deposition
  presence: Increased
  context: >-
    Extensive vascular C5b-9 (membrane attack complex) deposition in
    pretreatment skin and intestinal vasculature that resolves after
    complement-inhibiting therapy.
  notes: >-
    Terminal complement membrane attack complex (C5b-9) assessed by
    immunohistochemistry in microvascular endothelium; no specific NCIT
    biomarker term for C5b-9 / membrane attack complex is present in the
    ontology cache.
  evidence:
  - reference: PMID:41474865
    reference_title: "The Evolution in the Cutaneous and Gastrointestinal Pathology of Pediatric Kohlmeier-Degos Disease Under Combined Modality Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      extensive vascular C5b-9 deposition and enhanced type I interferon
      signaling in the skin and intestine
    explanation: >-
      Demonstrates extensive vascular C5b-9 deposition and heightened type I
      interferon signaling in affected tissues.
- name: Fibroblast CD34 expression
  biomarker_term:
    preferred_term: Hematopoietic Progenitor Cell Antigen CD34
    term:
      id: NCIT:C17280
      label: Hematopoietic Progenitor Cell Antigen CD34
  presence: Decreased
  context: >-
    Loss of CD34 expression among fibroblasts in areas of extravascular,
    pleural, and pericardial fibrosis.
  evidence:
  - reference: PMID:41474865
    reference_title: "The Evolution in the Cutaneous and Gastrointestinal Pathology of Pediatric Kohlmeier-Degos Disease Under Combined Modality Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extravascular fibrosis with a loss in the expression of CD34 amid
      fibroblasts was observed.
    explanation: >-
      Directly documents reduced fibroblast CD34 expression in fibrotic lesions.
  - reference: PMID:35588602
    reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A profibrogenic process resembling scleroderma was seen given the degree
      of smooth muscle actin staining along with a mirror image reduction in
      CD34 expression within the fibrotic pleura and pericardium.
    explanation: >-
      Confirms reduction of CD34 expression and increased smooth muscle actin
      staining in fibrotic pleura and pericardium.
- name: Myxovirus resistance protein A (MXA) type I interferon signature
  presence: Increased
  context: >-
    Surrogate tissue biomarker of upregulated type I interferon signaling in
    affected vessels and fibrotic serosa.
  notes: >-
    Interferon-induced GTP-binding protein Mx1 (MX1 / MxA) assessed by
    immunohistochemistry as a surrogate tissue marker of type I interferon
    signaling; no specific NCIT biomarker term for MX1 / MxA is present in the
    ontology cache.
  evidence:
  - reference: PMID:35588602
    reference_title: "Exploring the pathophysiologic basis of constrictive pericarditis of Kohlmeier Degos disease: A case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was significant upregulation in type I interferon signaling in cases
      tested as revealed by the degree of staining for MXA, the surrogate type I
      interferon marker.
    explanation: >-
      Establishes MXA staining as a surrogate marker of heightened type I
      interferon signaling in Kohlmeier-Degos disease.

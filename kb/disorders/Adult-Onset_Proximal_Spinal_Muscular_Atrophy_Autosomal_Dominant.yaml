- name: Autonomic and Unmyelinated Small-Fibre Degeneration
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    A parallel, non-motor arm of the same VAPB deficit: peripheral autonomic and
    other unmyelinated fibres degenerate. Sural nerve biopsy in a p.Pro56Ser
    family showed loss of nerve fibres with a marked unmyelinated-fibre
    predominance and collagen pockets on electron microscopy, and the
    sympathetic skin response was absent. This is curated as a distinct arm
    rather than as part of lower motor neuron degeneration because the affected
    fibres are not motor, and as PROVISIONAL because it rests on two families —
    the original Brazilian kindred and an unrelated Chinese one — rather than on
    the large molecularly confirmed series, which did not assess autonomic
    function.

    term:
      id: HP:0002505
      label: Loss of ambulation
  evidence:
  - reference: PMID:42166520
    reference_title: "Clinical characterization and natural history of ALS8/VAPB p.Pro56Ser: upper motor neurone signs, survival, and functional milestones in 78 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival was 21.9 years; times to wheelchair dependence and noninvasive
      ventilation were 7.0 and 10.0 years, respectively.
    explanation: >-
      Gives the median time to wheelchair dependence.
genetic:
- name: VAPB
  gene_term:
    preferred_term: VAPB
    term:
      id: hgnc:12649
      label: VAPB
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    VAPB (20q13.32) encodes VAMP-associated protein B/C, a type II integral
    membrane protein of the endoplasmic reticulum whose cytosolic MSP domain
    recruits FFAT-motif partners and so builds membrane contact sites between the
    ER and essentially every other cellular membrane. The recurrent disease
    allele is c.166C>T (p.Pro56Ser), which lies in the MSP domain.

    Two facts about this gene shape how a VAPB result should be read. First,
    p.Pro56Ser is not a set of independent observations: haplotype analysis of
    eight families of both Portuguese-Brazilian and African-Brazilian ancestry
    traces them all to one founding event about 23 generations ago, so the
    apparent recurrence of the allele is largely genealogy. Second, one allele
    does not equal one phenotype — the same p.Pro56Ser produces late-onset SMA,
    slowly progressive atypical ALS, and rapidly progressive typical ALS in
    different kindreds, and no modifier explaining that has been identified.

    Other VAPB variants (T46I, A145V, S160del) have been reported in ALS
    cohorts, but the Finkel-type SMA phenotype curated here is a p.Pro56Ser
    phenotype; nothing establishes that the other alleles produce it.
  evidence:
  - reference: PMID:15372378
    reference_title: "A mutation in the vesicle-trafficking protein VAPB causes late-onset spinal muscular atrophy and amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, the same mutation was identified in patients from six
      additional kindreds but with different clinical courses, such as ALS8,
      late-onset SMA, and typical severe ALS with rapid progression.
    explanation: >-
      Establishes gene-disease causation and, in the same sentence, the
      one-allele-many-phenotypes problem.
  - reference: PMID:16187141
    reference_title: "A common founder for amyotrophic lateral sclerosis type 8 (ALS8) in the Brazilian population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight families, comprising more than 1,500 individuals of whom about 200 are
      affected, are now known to carry this mutation.
    explanation: >-
      Gives the size of the known p.Pro56Ser population and its family structure.
  - reference: PMID:34440634
    reference_title: "The Link between VAPB Loss of Function and Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The VAP proteins are integral adaptor proteins of the endoplasmic reticulum
      (ER) membrane that recruit a myriad of interacting partners to the ER
      surface.
    explanation: >-
      States the normal molecular function of the affected protein.
  - reference: PMID:23446633
    reference_title: "Investigating the contribution of VAPB/ALS8 loss of function in amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In order to identify additional ALS-associated VAPB mutations, we screened
      the entire VAPB gene in a cohort of ALS patients and detected two mutations
      (A145V and S160Δ).
    explanation: >-
      Documents the additional VAPB alleles found in ALS cohorts, which are not
      the Finkel-type allele.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate exists. The largest
    enumeration is of the founder p.Pro56Ser population: eight families totalling
    more than 1,500 individuals of whom about 200 were affected, with a later
    clinical series assembling 78 molecularly confirmed patients from 57
    apparently unrelated families. These are pedigree counts, heavily enriched
    for Brazilian families of Portuguese ancestry, and cannot be converted into a
    population rate.
  evidence:
  - reference: PMID:16187141
    reference_title: "A common founder for amyotrophic lateral sclerosis type 8 (ALS8) in the Brazilian population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight families, comprising more than 1,500 individuals of whom about 200 are
      affected, are now known to carry this mutation.
    explanation: >-
      The affected-case enumeration behind the CASES_IN_LITERATURE measure.
  - reference: PMID:42166520
    reference_title: "Clinical characterization and natural history of ALS8/VAPB p.Pro56Ser: upper motor neurone signs, survival, and functional milestones in 78 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We retrospectively analyzed 78 patients with ALS8 confirmed via molecular
      testing or familial linkage analysis from 57 apparently unrelated families.
    explanation: >-
      The largest molecularly confirmed series, again a case count rather than a
      rate.
progression:
- phase: Slowly progressive ascending course
  age_range: onset in the fifth decade
  notes: >-
    Onset is insidious in the fifth decade, lumbar and proximal. Weakness
    ascends; wheelchair dependence follows at a median of 7 years and
    noninvasive ventilation at 10 years, but median survival is 21.9 years — an
    order of magnitude longer than typical ALS. Mortality is nonetheless
    elevated, with a standardized mortality ratio of 4.54. Upper motor neuron
    status does not affect survival.
  evidence:
  - reference: PMID:42166520
    reference_title: "Clinical characterization and natural history of ALS8/VAPB p.Pro56Ser: upper motor neurone signs, survival, and functional milestones in 78 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALS8 is a slowly progressive motor neurone disease with lumbar onset,
      ascending progression, and frequent but subtle UMN signs.
    explanation: >-
      The authors' own summary of the course.
  - reference: PMID:42166520
    reference_title: "Clinical characterization and natural history of ALS8/VAPB p.Pro56Ser: upper motor neurone signs, survival, and functional milestones in 78 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      UMN status did not affect survival (p = 0.312). The standardized mortality
      ratio was 4.54 (95% CI 2.77-7.01), supporting disease-related excess
      mortality.
    explanation: >-
      Quantifies excess mortality and shows the UMN/LMN split is not
      prognostically separating.
diagnosis:
- name: Electromyography showing chronic denervation and reinnervation
  description: >-
    Needle EMG establishes an anterior-horn-cell process: ongoing denervation
    with reinnervation, large motor unit potentials and reduced recruitment, with
    preserved sensory responses. This is what separates the disorder from a
    sensorimotor polyneuropathy and, together with the family history, what
    prompts genetic testing.
  evidence:
  - reference: PMID:16967488
    reference_title: "Expanding the phenotypes of the Pro56Ser VAPB mutation: proximal SMA with dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electromyography disclosed ongoing denervation and reinnervation.
    explanation: >-
      The characteristic electrodiagnostic finding.
  - reference: PMID:16967488
    reference_title: "Expanding the phenotypes of the Pro56Ser VAPB mutation: proximal SMA with dysautonomia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tone and tendon reflexes were decreased and a distal tremor was common.
      Sensation was preserved.
    explanation: >-
      Records the lower-motor-neuron exam with preserved sensation, which keeps
      the diagnosis in the motor neuronopathy column rather than a sensorimotor
      polyneuropathy.
- name: Molecular testing for VAPB in non-5q spinal muscular atrophy
  description: >-
    After SMN1 deletion has been excluded, VAPB is one of the genes on the
    non-5q SMA / hereditary motor neuropathy panel. Diagnostic yield in this
    group is modest and lowest in exactly the presentation this disorder
    produces — pure proximal weakness — so a negative panel does not close the
    question.
  evidence:
  - reference: PMID:37470033
    reference_title: "Phenotype Presentation and Molecular Diagnostic Yield in Non-5q Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic diagnostic yield was lowest in P-SMA (6/21, 28.6%) compared with
      PD-SMA (16/35, 45.7%) and SP-SMA (10/15, 66.7%).
    explanation: >-
      Quantifies the diagnostic difficulty of the pure proximal non-5q SMA
      presentation.
  - reference: PMID:37470033
    reference_title: "Phenotype Presentation and Molecular Diagnostic Yield in Non-5q Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-5q SMA is genetically heterogeneous, and neuropathy gene panels achieve
      a molecular diagnosis in one-third of the patients.
    explanation: >-
      States the overall panel yield in the differential category this disorder
      belongs to.
differential_diagnoses:
- name: 5q spinal muscular atrophy (SMN1-related)
  description: >-
    The disease the name most invites confusion with, and mechanistically
    unrelated: 5q SMA is autosomal recessive, caused by homozygous SMN1
    deletion, and modified by SMN2 copy number. It is also the one with approved
    SMN-directed therapies. Excluding the SMN1 deletion is the first step in
    evaluating an adult proximal SMA phenotype.
  evidence:
  - reference: PMID:37470033
    reference_title: "Phenotype Presentation and Molecular Diagnostic Yield in Non-5q Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinal muscular atrophy (SMA) is mainly caused by homozygous SMN1 gene
      deletions on 5q13.
    explanation: >-
      States the genetic basis of the disorder that must be excluded first.
- name: Amyotrophic lateral sclerosis
  description: >-
    Not a clean differential so much as a continuum: the same VAPB p.Pro56Ser
    allele produces late-onset SMA, atypical slowly progressive ALS, and
    rapidly progressive typical ALS in different kindreds, and most ALS8 patients
    eventually show subtle pyramidal signs. Distinguishing them matters
    prognostically — median survival here is 21.9 years — but the boundary is
    clinical, not molecular.
  evidence:
  - reference: PMID:15372378
    reference_title: "A mutation in the vesicle-trafficking protein VAPB causes late-onset spinal muscular atrophy and amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, the same mutation was identified in patients from six
      additional kindreds but with different clinical courses, such as ALS8,
      late-onset SMA, and typical severe ALS with rapid progression.
    explanation: >-
      Establishes that SMA and ALS presentations share the identical allele.
- name: Other non-5q spinal muscular atrophies and hereditary motor neuropathies
  description: >-
    BICD2, DYNC1H1, TRPV4, VCP, HSPB1, VRK1, DNAJB2, MORC2, ASAH1, HEXB and the
    androgen receptor (Kennedy disease) all produce adult proximal or
    proximal-distal motor neuronopathy phenotypes. In a French/UK series of 71
    non-5q SMA patients, BICD2 and DYNC1H1 were the commonest causes found.
  evidence:
  - reference: PMID:37470033
    reference_title: "Phenotype Presentation and Molecular Diagnostic Yield in Non-5q Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-two patients (45.1%) had a genetic diagnosis: BICD2 (n = 9), DYNC1H1
      (n = 7), TRPV4 (n = 4), VCP, HSBP1, AR (n = 2), VRK1, DNAJB2, MORC2, ASAH1,
      HEXB, and unexpectedly, COL6A3 (n = 1).
    explanation: >-
      Enumerates the genes competing for this clinical phenotype.
animal_models:
- name: Vapb P56S knock-in mouse
  species: Mouse
  genotype: Vapb p.Pro56Ser knock-in (heterozygous and homozygous)
  publication: PMID:26362257
  description: >-
    The most physiologic rodent model: the endogenous Vapb locus carries the
    P56S change, so expression level and tissue distribution are normal.
    Heterozygotes — the human genotype — show mild age-dependent motor deficits;
    homozygotes are worse, giving a dose-response consistent with the dominant
    human allele.
  modeled_mechanisms:
  - target: ER Stress and Unfolded Protein Response Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      ER stress and an autophagic response appear in motor neurons before
      behavioural deficits, at physiological expression level.
    limitations: >-
      The behavioural phenotype is mild and late; the model does not reproduce
      the severe weakness or the respiratory failure that ends the human disease,
      so it informs the initiating steps rather than the clinical endpoint.
    readouts:
    - name: ER stress markers in motor neurons
      target: ER Stress and Unfolded Protein Response Activation
      direction: INCREASED
      interpretation: >-
        Induction of ER stress precedes overt motor behavioural defects,
        positioning this node upstream in the chain.
      evidence:
      - reference: PMID:26362257
        reference_title: "Vapb/Amyotrophic lateral sclerosis 8 knock-in mice display slowly progressive motor behavior defects accompanying ER stress and autophagic response."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The mutant mice demonstrate induction of ER stress and autophagic
          response in motor neurons before obvious onset of behavioral defects,
          suggesting that these cellular biological defects might contribute to
          the initiation of the disease.
        explanation: >-
          The measurement behind this readout and its temporal ordering.
    evidence:
    - reference: PMID:26362257
      reference_title: "Vapb/Amyotrophic lateral sclerosis 8 knock-in mice display slowly progressive motor behavior defects accompanying ER stress and autophagic response."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous P56S Vapb knock-in mice show mild age-dependent defects in
        motor behaviors as characteristic features of the disease.
      explanation: >-
        Supports treating the heterozygous knock-in as informative for the human
        heterozygous disease.
  - target: ER-Derived Aggregation of Misfolded VAPB
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cytoplasmic inclusions containing P56S VAPB and ubiquitinated protein form
      selectively in motor neurons at physiological expression level — the
      counter-observation to the claim that aggregates are purely an
      overexpression artefact.
    limitations: >-
      Aggregation in mouse motor neurons does not settle whether aggregates form
      in human motor neurons, where the observation has not been made.
    evidence:
    - reference: PMID:26362257
      reference_title: "Vapb/Amyotrophic lateral sclerosis 8 knock-in mice display slowly progressive motor behavior defects accompanying ER stress and autophagic response."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Significantly, the knock-in mice demonstrate accumulation of P56S VAPB
        protein and ubiquitinated proteins in cytoplasmic inclusions, selectively
        in motor neurons.
      explanation: >-
        Documents aggregation without overexpression.
- name: Thy1.2 P56S VAPB transgenic mouse
  species: Mouse
  genotype: Thy1.2-driven pan-neuronal human VAPB p.Pro56Ser transgene
  publication: PMID:23771029
  description: >-
    Pan-neuronal overexpression of human P56S VAPB. Instructive precisely
    because its cell-type selectivity is the opposite of the human Finkel
    phenotype: corticospinal motor neurons are progressively lost while spinal
    motor neurons survive with functional impairment.
  modeled_mechanisms:
  - target: Lower Motor Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Spinal motor neurons show altered C-bouton morphology and impaired
      spontaneous rhythmic discharge, but do not die; the population that dies is
      the corticospinal one.
    limitations: >-
      The human disorder curated here is defined by lower motor neuron loss with
      no upper motor neuron signs. This model inverts that, and its transgene is
      overexpressed under a heterologous promoter, so it cannot be used to argue
      about which motor neuron population is vulnerable in patients.
    readouts:
    - name: Spinal motor neuron survival
      target: Lower Motor Neuron Degeneration
      direction: UNCHANGED
      interpretation: >-
        A negative result: spinal motor neuron number was preserved despite
        progressive corticospinal loss.
      evidence:
      - reference: PMID:23771029
        reference_title: "Amyotrophic lateral sclerosis-related VAPB P56S mutation differentially affects the function and survival of corticospinal and spinal motor neurons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          However, only a progressive loss of CSMNs but not SMNs was found in P56S
          VAPB Tg mice.
        explanation: >-
          The survival measurement behind this readout.
    evidence:
    - reference: PMID:23771029
      reference_title: "Amyotrophic lateral sclerosis-related VAPB P56S mutation differentially affects the function and survival of corticospinal and spinal motor neurons."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        While WT VAPB Tg mice did not exhibit any overt motor behavioral
        phenotypes, P56S VAPB Tg mice developed progressive hyperactivities and
        other motor abnormalities.
      explanation: >-
        Establishes an allele-specific motor phenotype while the accompanying
        limitation records why its cell-type pattern does not match the human
        disorder.
- name: Vapb knockout mouse
  species: Mouse
  genotype: Vapb null (complete loss of Vapb expression)
  publication: PMID:23446633
  description: >-
    A direct test of the haploinsufficiency hypothesis: if losing VAPB function
    were sufficient, a null mouse should develop motor neuron disease. It largely
    does not.
  modeled_mechanisms:
  - target: Lower Motor Neuron Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      Complete loss of Vapb produced only mild motor deficits after 18 months and
      left neuromuscular junctions innervated — no motor neuron disease.
    limitations: >-
      This is a null, not the human heterozygous missense genotype, and mouse
      lifespan may be too short for a disorder with a 45-year human onset. It
      therefore constrains rather than refutes the loss-of-function hypothesis:
      loss of VAPB function alone is insufficient in mouse, which is compatible
      with it being necessary but requiring the additional dominant-negative
      component.
    evidence:
    - reference: PMID:23446633
      reference_title: "Investigating the contribution of VAPB/ALS8 loss of function in amyotrophic lateral sclerosis."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice knocked-out for Vapb showed mild motor deficits after 18 months of age
        yet had innervated neuromuscular junctions (NMJs).
      explanation: >-
        The negative result: complete VAPB loss does not reproduce motor neuron
        degeneration or denervation in mouse.
experimental_models:
- name: ALS8 patient-derived iPSC motor neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Fibroblasts from p.Pro56Ser patients and their non-carrier siblings
    reprogrammed to iPSC and differentiated into motor neurons — the closest
    available human-cell model, with sibling controls.
  publication: PMID:21685205
  modeled_mechanisms:
  - target: Loss of Functional VAPB at ER Membrane Contact Sites
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      VAPB protein is reduced in patient-derived motor neurons relative to
      non-carrier siblings, at endogenous expression levels.
    limitations: >-
      iPSC-derived motor neurons are developmentally immature and cannot model a
      disorder whose onset is in the fifth decade; the reduction is a molecular
      readout, not a degeneration phenotype.
    readouts:
    - name: VAPB protein level in patient motor neurons
      target: Loss of Functional VAPB at ER Membrane Contact Sites
      direction: DECREASED
      interpretation: >-
        Reduced VAPB in human patient motor neurons, supporting a functional
        shortfall of the protein as the convergent effector.
      evidence:
      - reference: PMID:21685205
        reference_title: "Downregulation of VAPB expression in motor neurons derived from induced pluripotent stem cells of ALS8 patients."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We show for the first time that VAPB protein levels are reduced in
          ALS8-derived motor neurons but, in contrast to over-expression systems,
          cytoplasmic aggregates could not be identified.
        explanation: >-
          The measurement behind this readout, and its explicit contrast with
          overexpression systems.
discussions:
- discussion_id: vapb_p56s_one_allele_many_phenotypes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a single founder allele, VAPB p.Pro56Ser, produce late-onset Finkel
    SMA in some carriers, slowly progressive atypical ALS in others, and rapidly
    progressive typical ALS in a few?
  attaches_to:
  - "pathophysiology#VAPB p.Pro56Ser MSP-Domain Variant"
  - "pathophysiology#Lower Motor Neuron Degeneration"
  rationale: >-
    This is the central unresolved question for this entry, and it is unusually
    well posed because the founder effect removes allelic heterogeneity as an
    explanation: nearly all reported patients carry the same ancestral
    chromosome. The 2004 discovery paper already reported the three courses
    across seven kindreds, and the 2026 series of 78 patients quantified the
    split — 42% presenting as pure progressive muscular atrophy, of whom 30%
    later developed upper motor neuron signs. Whatever separates them is
    therefore modifier, environmental or stochastic, and none has been
    identified. Practically, this determines whether MONDO:0008453 names a
    disease or a presentation.
  evidence:
  - reference: PMID:42166520
    reference_title: "Clinical characterization and natural history of ALS8/VAPB p.Pro56Ser: upper motor neurone signs, survival, and functional milestones in 78 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At admission, 51% had spinal-onset ALS, 42% progressive muscular atrophy
      (PMA) and 6% flail leg; 30% of patients with PMA subsequently developed UMN
      signs.
    explanation: >-
      Quantifies the phenotypic split within one allele and the partial
      conversion between categories over time.
  - reference: ORPHA:209335
    reference_title: "Autosomal dominant adult-onset proximal spinal muscular atrophy"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare, genetic, motor neuron disease characterized by adulthood-onset of
      slowly progressive, proximal muscular weakness with fasciculations,
      amyotrophy, cramps, and absent/hypoactive reflexes, without bulbar or
      pyramidal involvement.
    explanation: >-
      Supplies the other half of the problem. Orphanet keeps this entity distinct
      from ALS8 by defining it as free of bulbar and pyramidal involvement, but
      the allele that causes it produces both in most carriers. The gap between
      the reference nosology and the molecular cohort is what makes it unclear
      whether MONDO:0008453 names a disease or a presentation.
  proposed_experiments:
  - experiment_id: exp_vapb_modifier_scan_within_founder_pedigree
    name: Genome-wide modifier scan within the founder pedigree
    description: >-
      Because carriers share one ancestral haplotype, a within-pedigree
      association of genome-wide genotype against presentation category (pure
      LMN versus UMN-positive) and age at onset isolates modifiers with the
      causal allele held constant — a design most Mendelian disorders cannot
      support.
  - experiment_id: exp_vapb_isogenic_motor_neuron_subtype_panel
    name: Isogenic corticospinal versus spinal motor neuron comparison
    description: >-
      Introduce p.Pro56Ser into isogenic iPSC lines differentiated separately to
      corticospinal-like and spinal motor neurons, and compare ER stress,
      contact-site integrity and survival, testing whether the corticospinal
      selectivity seen in the transgenic mouse is a property of the neuron
      subtype or of the transgene.
- discussion_id: vapb_aggregates_absent_at_physiological_expression
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the ER-derived VAPB aggregates that dominate the mechanistic literature
    actually form in human motor neurons carrying one p.Pro56Ser allele, or are
    they an artefact of overexpression?
  attaches_to:
  - "pathophysiology#ER-Derived Aggregation of Misfolded VAPB"
  rationale: >-
    The aggregation-and-sequestration model was built almost entirely in
    overexpression systems, where mutant VAPB reliably forms tubular ER clusters
    and drags in wild-type VAP. Three lines of evidence complicate transferring
    that to patients. Patient-derived iPSC motor neurons show reduced VAPB but no
    identifiable cytoplasmic aggregates. In transgenic mice the inclusions do not
    correlate with degeneration, disappear after axotomy, and behave as a
    reversible ERAD-linked quality-control compartment — possibly protective.
    Against that, physiological-level knock-in mice do form motor-neuron
    inclusions, so dose alone does not explain the discrepancy. The mismatch is
    not academic: it decides whether a therapy should clear aggregates or restore
    wild-type VAPB, and the two hypotheses in mechanistic_hypotheses point in
    opposite directions.
  evidence:
  - reference: PMID:21685205
    reference_title: "Downregulation of VAPB expression in motor neurons derived from induced pluripotent stem cells of ALS8 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest that optimal levels of VAPB may play a central role in
      the pathogenesis of ALS8, in agreement with the observed reduction of VAPB
      in sporadic ALS.
    explanation: >-
      The patient-cell result reframing the mechanism around VAPB levels rather
      than aggregates.
  - reference: PMID:24252306
    reference_title: "Amyotrophic lateral sclerosis (ALS)-associated VAPB-P56S inclusions represent an ER quality control compartment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The presence of these inclusions does not correlate with signs of axonal and
      neuronal degeneration, and axotomy leads to their gradual disappearance,
      indicating that they represent reversible structures.
    explanation: >-
      Uncouples inclusion burden from degeneration in the model where the
      inclusions are most conspicuous.
  proposed_experiments:
  - experiment_id: exp_vapb_aggregate_detection_in_patient_tissue
    name: Aggregate detection in ALS8 patient spinal cord
    description: >-
      Examine post-mortem anterior horn tissue from p.Pro56Ser patients for
      ER-derived VAPB inclusions and for wild-type VAPA/VAPB redistribution,
      against age-matched controls. This is the observation the whole
      dominant-negative model rests on and it has not been reported in human
      motor neurons.
- discussion_id: vapb_no_disease_modifying_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any disease-modifying treatment for VAPB-related SMA, and does the
    SMN-directed therapeutic success in 5q SMA transfer?
  attaches_to:
  - "pathophysiology#Loss of Functional VAPB at ER Membrane Contact Sites"
  rationale: >-
    This entry deliberately curates no `treatments` block. Management is
    supportive and multidisciplinary — rehabilitation, mobility aids, respiratory
    surveillance and noninvasive ventilation, nutritional and swallowing support,
    genetic counselling — and none of it is disease-modifying. The specific
    hazard worth naming is the shared "spinal muscular atrophy" label: nusinersen,
    risdiplam and onasemnogene abeparvovec raise SMN protein and are approved for
    SMN1-related 5q SMA. VAPB disease is non-5q and has normal SMN; those agents
    have no mechanistic route to it and must not be curated here as treatments.
    The 21.9-year median survival and the 7-year and 10-year milestones to
    wheelchair and ventilation are, at present, the substance of what can be
    offered: anticipatory management on a predictable timeline.
  proposed_experiments:
  - experiment_id: exp_vapb_wildtype_restoration_preclinical
    name: Test wild-type VAPB restoration in a physiological model
    description: >-
      If haploinsufficiency drives the disease, raising wild-type VAPB should
      rescue it. Test AAV-delivered or allele-selective upregulation of wild-type
      VAPB in the P56S knock-in mouse with motor behaviour, neuromuscular
      junction innervation and ER stress markers as endpoints — a design that
      also discriminates between this entry's two mechanistic hypotheses, since
      restoration should fail if the aggregate is the toxic species.
notes: >-
  Concept decision. This is curated as a `kb/disorders/` Disease. MONDO:0008453
  is a leaf term with one causal gene (VAPB), one OMIM entry (182980) and, in
  practice, one allele; it has no MONDO descendants and is not a union of
  distinct curated entities, so a Grouping would have nothing to unite. Nor is
  it a `has_subtypes` entry on an existing disease: the knowledge base has no
  VAPB/ALS8 parent entry, and it is not a subtype of `Spinal_Muscular_Atrophy`,
  which is anchored on SMN1/SMN2 and models the recessive 5q series. The
  pathograph here is reasonably conserved across reported kindreds, which is the
  test a disorder entry has to pass.

  Scope. This entry covers the pure lower motor neuron, proximal-onset end of
  VAPB p.Pro56Ser disease. It does not attempt to be an ALS8 entry. The honest
  position — and the one the evidence forces — is that the two labels do not
  partition the allele: 42% of molecularly confirmed patients present as pure
  progressive muscular atrophy, 30% of those later acquire upper motor neuron
  signs, and upper motor neuron status does not affect survival. The
  `Abnormal Pyramidal Signs` phenotype and the
  `vapb_p56s_one_allele_many_phenotypes` discussion are curated to record that
  boundary rather than to smuggle ALS into an SMA entry.

  Disagreement with Orphanet, deliberately left standing. Orphanet's definition
  of ORPHA:209335 — the exact-match cross-reference of MONDO:0008453 — defines
  the entity as proximal weakness "without bulbar or pyramidal involvement". The
  2026 series of 78 molecularly confirmed p.Pro56Ser carriers reports upper motor
  neuron signs in 53 of them and bulbar involvement in 21.8%. Both cannot be
  descriptions of the same set of patients. Rather than pick a winner, the
  `Abnormal Pyramidal Signs` and `Bulbar Involvement` phenotypes each carry the
  Orphanet definition as `supports: REFUTE`, so a reader sees a reference
  nosology and a genotype-defined cohort disagreeing about where the entity ends.
  Curating only the cohort would have made the entry look more settled than the
  field is.

  Founder effect. Do not read the eight-family, ~200-affected enumeration as
  eight independent confirmations of pathogenicity. Haplotype analysis places all
  of them, of both Portuguese-Brazilian and African-Brazilian ancestry, on one
  founding chromosome about 23 generations old. The p.Pro56Ser literature is
  therefore geographically and genealogically concentrated, and the Chinese
  kindred reported in 2020 is valuable precisely because it is not part of it.

  One phenotype deliberately left unwired. `Abnormal Pyramidal Signs` is the
  only phenotype with no causal in-edge, and that is the point: wiring it would
  require an upper motor neuron node, and this entry is scoped to the pure lower
  motor neuron end of the p.Pro56Ser spectrum. The only direct evidence for
  corticospinal degeneration is a transgenic mouse in which the corticospinal
  population is lost while spinal motor neurons survive — the opposite of the
  human Finkel phenotype — so a node built on it would import the ALS8 mechanism
  this entry declines to claim. The phenotype is curated because the signs are
  observed in most carriers; it is left unexplained because this entry does not
  have an honest mechanism for them.

  What is deliberately not curated. No `treatments` block, for the reason given
  in the `vapb_no_disease_modifying_therapy` discussion — supportive care exists
  but is neither disease-specific nor evidenced in this literature, and the
  SMN-directed drugs approved for 5q SMA do not apply. No `mechanistic_category`
  classification: `proteotoxic disease` would be the obvious tag, but this
  entry's own HUMAN_MODEL_MISMATCH discussion records that the aggregates may be
  protective and that haploinsufficiency may be the real driver, so asserting
  proteotoxicity as a classification would contradict the mechanism section. No `functional_impact_category`
  on the trigger node's genetic context, because choosing between
  DOMINANT_NEGATIVE and LOSS_OF_FUNCTION would silently resolve the open
  question recorded in `mechanistic_hypotheses`.

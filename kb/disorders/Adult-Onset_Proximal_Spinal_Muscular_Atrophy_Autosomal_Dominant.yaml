mechanistic_hypotheses:
- hypothesis_group_id: dominant_negative_aggregation
  hypothesis_label: Dominant-negative sequestration of wild-type VAP
  status: CANONICAL
  description: >-
    The historically dominant reading: mutant VAPB misfolds, forms ER-derived
    aggregates, and recruits the wild-type VAPA and VAPB products of the normal
    alleles into those aggregates, so that a heterozygote loses far more VAP
    function than the 50% a null allele would cost. This explains dominance
    without invoking a novel toxic activity, and it is directly demonstrated —
    but in overexpression systems.
  evidence:
  - reference: PMID:17804640
    reference_title: "Motor neuron disease-associated mutant vesicle-associated membrane protein-associated protein (VAP) B recruits wild-type VAPs into endoplasmic reticulum-derived tubular aggregates."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data support a model in which reduced levels of VAP family proteins
      result in decreased ER anchoring of lipid-binding proteins and cause motor
      neuron degeneration.
    explanation: >-
      States the sequestration model in the authors' own terms.
- hypothesis_group_id: vapb_haploinsufficiency
  hypothesis_label: Haploinsufficiency of the wild-type allele
  status: EMERGING
  description: >-
    The competing reading: at physiological expression a single mutant allele
    produces too little protein to sequester anything, aggregates are not seen in
    patient-derived cells, and what actually matters is that the wild-type allele
    alone cannot supply enough VAPB. On this account the disorder is a
    haploinsufficiency and the aggregates seen in overexpression systems are an
    artefact of dose. The two hypotheses are not mutually exclusive — both
    converge on the same central_effector node — but they imply opposite
    therapeutic strategies (clear the aggregate versus raise wild-type VAPB).
  evidence:
  - reference: PMID:34440634
    reference_title: "The Link between VAPB Loss of Function and Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Instead, loss-of-function of the single wild-type allele is required for
      pathological effects, and VAPB haploinsufficiency may be the main driver of
      the disease.
    explanation: >-
      States the haploinsufficiency hypothesis explicitly.
  - reference: PMID:23446633
    reference_title: "Investigating the contribution of VAPB/ALS8 loss of function in amyotrophic lateral sclerosis."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, Vapb loss of function weakens the motor system of vertebrate animal
      models but is on its own unable to lead to a complete ALS phenotype.
    explanation: >-
      Supports a loss-of-function contribution while showing it is not sufficient
      on its own — which is why this hypothesis is EMERGING rather than
      superseding the dominant-negative account.

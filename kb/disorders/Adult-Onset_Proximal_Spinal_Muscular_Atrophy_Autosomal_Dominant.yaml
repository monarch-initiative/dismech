  biological_scale: TISSUE
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    Failing motor neurons denervate their muscle fibres; surviving units sprout
    and reinnervate them, which is why electromyography in these patients shows
    ongoing denervation together with reinnervation rather than acute
    denervation alone. This compensation is what buys the disorder its decades-long
    course, and its eventual exhaustion is what produces clinically apparent
    weakness.

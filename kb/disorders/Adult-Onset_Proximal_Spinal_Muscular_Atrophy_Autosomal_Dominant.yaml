    causal_link_type: DIRECT
    description: >-
      Extension of the same anterior-horn process to brainstem lower motor
      neurons. Because it is the bulbar motor nucleus rather than the
      corticobulbar tract that fails, the resulting deficit is predominantly
      dysphonia rather than the spastic dysarthria of bulbar-onset ALS.

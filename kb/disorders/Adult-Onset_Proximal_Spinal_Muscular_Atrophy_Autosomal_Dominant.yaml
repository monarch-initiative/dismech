    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  - preferred_term: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  evidence:
  - reference: PMID:26362257
    reference_title: "Vapb/Amyotrophic lateral sclerosis 8 knock-in mice display slowly progressive motor behavior defects accompanying ER stress and autophagic response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutant mice demonstrate induction of ER stress and autophagic response
      in motor neurons before obvious onset of behavioral defects, suggesting that
      these cellular biological defects might contribute to the initiation of the
      disease.
    explanation: >-
      Places ER stress upstream of motor deficits at physiological expression
      levels.
  - reference: PMID:24271015
    reference_title: "The amyotrophic lateral sclerosis 8 protein, VAP, is required for ER protein quality control."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of Vap in flies shows various ERQC associated defects, including
      protein accumulation, ER expansion, and ER stress.
    explanation: >-
      Establishes that losing VAP function is by itself sufficient to produce ER
      stress, linking this node to the loss-of-function arm rather than only to
      aggregation.
  - reference: PMID:18555774
    reference_title: "The amyotrophic lateral sclerosis 8 protein VAPB is cleaved, secreted, and acts as a ligand for Eph receptors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The P58S mutation in VAP33 leads to a failure to secrete the MSP domain as
      well as ubiquitination, accumulation of inclusions in the endoplasmic
      reticulum, and an unfolded protein response.
    explanation: >-
      The Drosophila orthologue of the human variant produces ER inclusions and a
      UPR, and additionally fails to secrete the MSP domain — a distinct
      signalling loss noted here rather than curated as its own chain node
      because it is invertebrate-only evidence.
  downstream:
  - target: Lower Motor Neuron Degeneration
- name: Disrupted ER-Mitochondria Contact and Calcium Handling
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: PROVISIONAL
  description: >-
    VAPB is a mitochondria-associated-membrane protein that tethers ER to
    mitochondria by binding the outer-mitochondrial-membrane protein PTPIP51,
    and this contact is where calcium released from ER stores is taken up by
    mitochondria. p.Pro56Ser alters PTPIP51 binding and increases mitochondrial
    calcium uptake. PROVISIONAL rather than ESTABLISHED because the direct
    evidence comes from overexpression in cell lines and from yeast and
    mammalian model systems, not from VAPB-mutant human motor neurons.
  biological_processes:
  - preferred_term: mitochondrial calcium ion homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0051560
      label: mitochondrial calcium ion homeostasis
  evidence:
  - reference: PMID:22131369
    reference_title: "VAPB interacts with the mitochondrial protein PTPIP51 to regulate calcium homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we demonstrate that VAPBP56S has altered binding to PTPIP51 and
      increases Ca(2+) uptake by mitochondria following release from ER stores.
    explanation: >-
      Direct evidence that the disease allele changes the ER-mitochondria tether
      and its calcium function.
  - reference: PMID:24893131
    reference_title: "ER-mitochondria associations are regulated by the VAPB-PTPIP51 interaction and are disrupted by ALS/FTD-associated TDP-43."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that the ER-resident protein VAPB interacts with the
      mitochondrial protein tyrosine phosphatase-interacting protein-51 (PTPIP51)
      to regulate ER-mitochondria associations.
    explanation: >-
      Establishes the tethering function that the disease allele perturbs.
  - reference: PMID:39870504
    reference_title: "A role for mitochondria-ER crosstalk in amyotrophic lateral sclerosis 8 pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Inclusion formation was found to be a developmentally regulated process
      linked to mitochondrial damage that could be attenuated by reducing
      ER-mitochondrial contacts.
    explanation: >-
      Reverses the expected direction of the arrow: mitochondrial damage feeds
      back on inclusion formation through the same contacts, so this node is part
      of a loop rather than a one-way step.
  downstream:
  - target: Lower Motor Neuron Degeneration
- name: Impaired Autophagic Flux and RNA-Binding Protein Mislocalization
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: PROVISIONAL
  description: >-
    p.Pro56Ser disturbs both the initiation and the completion of autophagy,
    with autophagosomes failing to fuse with lysosomes. Aggregates accumulate
    together with LC3 and p62 and sequester RNA-binding proteins — phosphorylated
    TDP-43, FUS and Matrin 3 — into persistent stress granules, connecting this
    disorder to the wider TDP-43 proteinopathy of ALS. The human material is a
    single ALS8 index patient's muscle biopsy and fibroblasts, which is why the
    node is PROVISIONAL.
  biological_processes:
  - preferred_term: macroautophagy
    modifier: DECREASED
    term:
      id: GO:0016236
      label: macroautophagy
  evidence:
  - reference: PMID:33972508
    reference_title: "Pathomechanisms of ALS8: altered autophagy and defective RNA binding protein (RBP) homeostasis due to the VAPB P56S mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Detailed investigations of autophagic flux in cell culture models revealed
      that P56S-VAPB alters both initial and late steps of the autophagy pathway.
    explanation: >-
      Documents the autophagic-flux defect this node represents.
  - reference: PMID:33972508
    reference_title: "Pathomechanisms of ALS8: altered autophagy and defective RNA binding protein (RBP) homeostasis due to the VAPB P56S mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Autophagy and RBP homeostasis are interdependent, as demonstrated by the
      cytoplasmic mis-localisation of several RBPs including pTDP-43, FUS, Matrin
      3 which often sequestered with P56S-VAPB aggregates both in cell culture and
      in the muscle biopsy of the ALS8 patient.
    explanation: >-
      Links the autophagic defect to RNA-binding-protein mislocalization,
      including in human patient tissue.
  downstream:
  - target: Lower Motor Neuron Degeneration
- name: Lower Motor Neuron Degeneration
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "loss_of_proteostasis#Proteotoxic Cell Dysfunction and Neurodegeneration"
  description: >-
    Anterior-horn and brainstem lower motor neurons become dysfunctional and
    degenerate. Selectivity is striking and only partly explained: VAPB is
    abundant in motor neurons, and in the pan-neuronal transgenic mouse the
    corticospinal population is lost while spinal motor neurons instead show
    altered C-bouton morphology and impaired rhythmic discharge without frank
    loss. In humans the clinical picture at the Finkel end of the spectrum is
    purely lower motor neuron, whereas subtle pyramidal signs appear in a
    majority of ALS8 patients overall.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  evidence:
  - reference: PMID:23771029
    reference_title: "Amyotrophic lateral sclerosis-related VAPB P56S mutation differentially affects the function and survival of corticospinal and spinal motor neurons."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, only a progressive loss of CSMNs but not SMNs was found in P56S
      VAPB Tg mice.
    explanation: >-
      Supports motor neuron vulnerability while explicitly qualifying it: in this
      model the spinal motor neurons that define the human Finkel phenotype did
      not die.
  - reference: PMID:23771029
    reference_title: "Amyotrophic lateral sclerosis-related VAPB P56S mutation differentially affects the function and survival of corticospinal and spinal motor neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In SMNs, P56S VAPB promoted a rather selective translocation of VAPB protein
      onto the postsynaptic site of C-boutons that altered the morphology of
      C-boutons and impaired the spontaneous rhythmic discharges of SMNs.
    explanation: >-
      Gives the spinal motor neuron a dysfunction phenotype short of death,
      which is consistent with the very slow human course.
  - reference: PMID:26362257
    reference_title: "Vapb/Amyotrophic lateral sclerosis 8 knock-in mice display slowly progressive motor behavior defects accompanying ER stress and autophagic response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Significantly, the knock-in mice demonstrate accumulation of P56S VAPB
      protein and ubiquitinated proteins in cytoplasmic inclusions, selectively in
      motor neurons.
    explanation: >-
      Establishes motor neuron selectivity of the cellular pathology at
      physiological expression level.
  downstream:
  - target: Chronic Denervation and Reinnervation of Skeletal Muscle
  - target: Reduced Tendon Reflexes
    causal_link_type: DIRECT
    description: >-
      Loss of the efferent limb of the monosynaptic stretch reflex. This is why
      reflexes are reduced or absent rather than brisk, and it is the sign that
      keeps the bedside picture in the lower motor neuron column.

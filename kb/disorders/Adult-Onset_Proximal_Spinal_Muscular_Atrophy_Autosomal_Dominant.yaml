inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous VAPB p.Pro56Ser allele is sufficient. The disorder was
    mapped in a large Brazilian kindred and the same variant then found in six
    further kindreds; haplotype analysis across eight families of both
    Portuguese-Brazilian and African-Brazilian ancestry places the origin in a
    single founding event, so most of the world's reported patients share one
    ancestral chromosome rather than representing independent mutational events.
  evidence:
  - reference: PMID:15372378
    reference_title: "A mutation in the vesicle-trafficking protein VAPB causes late-onset spinal muscular atrophy and amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, the same mutation was identified in patients from six
      additional kindreds but with different clinical courses, such as ALS8,
      late-onset SMA, and typical severe ALS with rapid progression.
    explanation: >-
      Documents segregation of a single heterozygous allele across seven
      kindreds, including the late-onset SMA presentation this entry curates.
  - reference: PMID:16187141
    reference_title: "A common founder for amyotrophic lateral sclerosis type 8 (ALS8) in the Brazilian population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analysis shows a common founder for all families regardless of
      ancestry, with a founding event 23 generations ago (95% CI 13-39),
      consistent with the Portuguese colonization of Brazil.
    explanation: >-
      Establishes the founder origin, which is why allele counts across families
      cannot be treated as independent observations.
pathophysiology:
- name: VAPB p.Pro56Ser MSP-Domain Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous germline missense change substitutes serine for a conserved
    proline at residue 56 of VAPB, within the N-terminal major sperm protein
    (MSP) homology domain — the surface through which VAPB binds FFAT-motif
    partners and so recruits lipid-transfer and other proteins to the cytosolic
    face of the endoplasmic reticulum. Essentially every reported family carries
    this one allele, inherited from a common founder.
  genes:
  - preferred_term: VAPB
    term:
      id: hgnc:12649
      label: VAPB
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline missense variant in the MSP domain. The functional
      impact category is deliberately left unset: whether the dominant action is
      a toxic gain of function through aggregation and sequestration of the
      wild-type protein, or loss of function of the remaining wild-type allele,
      is the unresolved question recorded in this entry's mechanistic_hypotheses.
  evidence:
  - reference: PMID:15372378
    reference_title: "A mutation in the vesicle-trafficking protein VAPB causes late-onset spinal muscular atrophy and amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the finding of a novel missense mutation in the
      vesicle-associated membrane protein/synaptobrevin-associated membrane
      protein B (VAPB) gene in patients from this family.
    explanation: >-
      The original identification of the causal VAPB variant.
  - reference: PMID:17804640
    reference_title: "Motor neuron disease-associated mutant vesicle-associated membrane protein-associated protein (VAP) B recruits wild-type VAPs into endoplasmic reticulum-derived tubular aggregates."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A genetic mutation (P56S) in the conserved major sperm protein homology
      domain of VAPB has been linked to motor-neuron degeneration in affected
      amyotrophic lateral sclerosis (ALS) patients.
    explanation: >-
      Locates the variant in the conserved MSP homology domain, which is what
      makes the FFAT-binding surface the affected function.
  downstream:
  - target: ER-Derived Aggregation of Misfolded VAPB
  - target: Loss of Functional VAPB at ER Membrane Contact Sites
- name: ER-Derived Aggregation of Misfolded VAPB
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Mutant VAPB misfolds and self-associates into immobile, tubular ER-derived
    inclusions in motor neurons, dragging endogenous wild-type VAPA and VAPB into
    the same aggregates. The inclusions are not inert: they are decorated with
    ER-associated degradation machinery (p97/VCP, Derlin-1, BAP31) and behave as
    a quality-control compartment formed when misfolded VAPB exceeds ERAD
    capacity. Their pathogenic weight is contested — see the
    HUMAN_MODEL_MISMATCH discussion below, since patient-derived motor neurons
    expressing the allele at physiological level do not show them.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: protein folding
    modifier: ABNORMAL
    term:
      id: GO:0006457
      label: protein folding
  evidence:
  - reference: PMID:17804640
    reference_title: "Motor neuron disease-associated mutant vesicle-associated membrane protein-associated protein (VAP) B recruits wild-type VAPs into endoplasmic reticulum-derived tubular aggregates."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report that in the CNS, VAPB is abundant in motor neurons and that the
      P56S substitution causes aggregation of mutant VAPB in immobile tubular ER
      clusters, perturbs FFAT-motif binding, and traps endogenous VAP in mutant
      aggregates.
    explanation: >-
      Documents both the aggregation itself and the sequestration of wild-type
      VAP that underlies the dominant-negative reading of the mechanism.
  - reference: PMID:24252306
    reference_title: "Amyotrophic lateral sclerosis (ALS)-associated VAPB-P56S inclusions represent an ER quality control compartment."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The data indicate that the VAPB-P56S inclusions represent a novel reversible
      ER quality control compartment that is formed when the amount of mutant VAPB
      exceeds the capacity of the ERAD pathway and that isolates misfolded and
      aggregated VAPB from the rest of the ER.
    explanation: >-
      Characterizes the inclusions as an ERAD-linked quality-control compartment
      and, importantly, argues they may be protective rather than toxic —
      PARTIAL because it supports the existence of the node while qualifying its
      causal role.
  - reference: PMID:24252306
    reference_title: "Amyotrophic lateral sclerosis (ALS)-associated VAPB-P56S inclusions represent an ER quality control compartment."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The presence of these inclusions does not correlate with signs of axonal and
      neuronal degeneration, and axotomy leads to their gradual disappearance,
      indicating that they represent reversible structures.
    explanation: >-
      Directly refutes a simple aggregate-causes-degeneration reading in the
      transgenic mouse: inclusion burden and degeneration are uncoupled.
  downstream:
  - target: Loss of Functional VAPB at ER Membrane Contact Sites
  - target: ER Stress and Unfolded Protein Response Activation
- name: Loss of Functional VAPB at ER Membrane Contact Sites
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    However the aggregates are read, the functional consequence converges on too
    little working VAPB at the ER surface. The mutant protein is unstable and
    non-functional, and VAPB levels are reduced in patient-derived motor neurons
    and in ALS spinal cord. Because VAPB is the tether that recruits FFAT-motif
    partners to the ER, its shortfall degrades a whole family of contact-site
    functions at once: ER-to-Golgi transport, lipid exchange (with a
    characteristic rise in phosphatidylinositol-4-phosphate), phosphoinositide
    and calcium handling, and ER protein quality control.
  biological_processes:
  - preferred_term: intermembrane lipid transfer
    modifier: DECREASED
    term:
      id: GO:0120009
      label: intermembrane lipid transfer
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence:
  - reference: PMID:34440634
    reference_title: "The Link between VAPB Loss of Function and Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mutant protein is aggregation-prone, non-functional and unstable, and
      its expression from a single allele appears to be insufficient to support
      toxic gain-of-function effects within motor neurons.
    explanation: >-
      States the loss-of-function reading of the allele that this node
      represents.
  - reference: PMID:21685205
    reference_title: "Downregulation of VAPB expression in motor neurons derived from induced pluripotent stem cells of ALS8 patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show for the first time that VAPB protein levels are reduced in
      ALS8-derived motor neurons but, in contrast to over-expression systems,
      cytoplasmic aggregates could not be identified.
    explanation: >-
      Demonstrates reduced VAPB in patient-derived motor neurons — the direct
      human-cell evidence for this node, and simultaneously the observation that
      the aggregate node is not seen at physiological expression.
  - reference: PMID:18701194
    reference_title: "Vesicle associated membrane protein B (VAPB) is decreased in ALS spinal cord."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Expression of VAPB mRNA and protein was predominantly localised to large
      motor neurones further supporting the relevance of this finding to disease
      progression occurring in SALS.
    explanation: >-
      Localizes VAPB expression to large motor neurons in human spinal cord,
      which is why a VAPB shortfall is cell-type selective. Note this cohort is
      sporadic ALS, not VAPB-mutant disease.
  - reference: PMID:33461946
    reference_title: "Deregulation of phosphatidylinositol-4-phosphate in the development of amyotrophic lateral sclerosis 8."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One prominent function mediated by VAPB at these sites is lipid exchange,
      and a recurrent phenotype observed in all models investigating knockout or
      knockdown of VAPs is a significant increase in the levels of
      phosphatidylinositol-4-phosphate (PI4P).
    explanation: >-
      Names the lipid-exchange function lost and the PI4P readout that recurs
      across VAP-deficient models.
  downstream:
  - target: ER Stress and Unfolded Protein Response Activation
  - target: Disrupted ER-Mitochondria Contact and Calcium Handling
  - target: Impaired Autophagic Flux and RNA-Binding Protein Mislocalization
  - target: Autonomic and Unmyelinated Small-Fibre Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      VAPB is not motor-neuron-specific, so the same functional shortfall is
      the presumed cause of the autonomic and small-fibre arm. The intermediates
      are unknown: nothing in this literature explains why some carriers develop
      dysautonomia and most do not, and no cell-type-selective mechanism has
      been proposed.
- name: ER Stress and Unfolded Protein Response Activation
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss of VAPB-dependent ER quality control and accumulation of misfolded
    VAPB together activate the ER stress response in motor neurons. In
    physiological-level knock-in mice this is detectable before any behavioural
    deficit, which is what makes it a candidate initiating step rather than an
    end-stage epiphenomenon.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:

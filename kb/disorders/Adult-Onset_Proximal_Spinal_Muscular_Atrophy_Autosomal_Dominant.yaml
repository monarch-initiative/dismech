name: Adult-Onset Proximal Spinal Muscular Atrophy, Autosomal Dominant
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Adult-onset proximal spinal muscular atrophy, autosomal dominant — the Finkel
  type of late-onset SMA — is a dominantly inherited lower motor neuron disease
  caused by heterozygous variation in VAPB, in nearly every reported family the
  recurrent p.Pro56Ser allele. Onset is in mid-adult life with proximal,
  lumbar-predominant weakness and neurogenic muscle atrophy that ascends slowly
  over decades. VAPB is an integral endoplasmic reticulum adaptor that builds
  membrane contact sites between the ER and essentially every other organelle;
  p.Pro56Ser sits in its major sperm protein (MSP) domain and renders the
  protein unstable, aggregation-prone and non-functional.

  The entity's defining curatorial problem is that the same allele does not
  produce one disease. The 2004 discovery paper found p.Pro56Ser in seven
  kindreds presenting variously as late-onset SMA, as atypical slowly
  progressive ALS (ALS8), and as typical rapidly progressive ALS; a 2026 series
  of 78 molecularly confirmed patients found that 42% presented as pure lower
  motor neuron progressive muscular atrophy while a majority eventually showed
  subtle upper motor neuron signs. This entry is scoped to the pure lower motor
  neuron, proximal-onset end of that spectrum, and records the continuity with
  ALS8 explicitly rather than pretending to a clean boundary.
category: Mendelian

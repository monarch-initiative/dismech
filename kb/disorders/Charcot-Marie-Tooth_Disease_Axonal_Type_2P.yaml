genetic:
- name: LRSAM1
  notes: >-
    LRSAM1 encodes a RING-type E3 ubiquitin ligase. Dominant alleles include RING-domain missense substitutions,
    in-frame indels and truncating or elongating frameshifts; the original recessive splice allele removes
    the RING domain. Reduced penetrance occurs. French families included p.Gln698_Gln701del and p.Pro702_Gln711dup;
    a shared approximately 450-kb haplotype in four deletion-carrying families suggested a founder effect.
    LRR-dependent bacterial recognition and RING-dependent ubiquitination are normal-biological experimental
    findings, not evidence that infection causes CMT2P.
  gene_term:
    preferred_term: LRSAM1
    term:
      id: hgnc:25135
      label: LRSAM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:20865121
    reference_title: "Mutation in the gene encoding ubiquitin ligase LRSAM1 in patients with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous pathogenic variant was identified in the gene encoding leucine rich repeat and sterile alpha motif 1 (LRSAM1) by direct DNA sequencing of genes within the region in affected DNA samples."
    explanation: >-
      The gene-disease assertion in the paper that first made it.
  - reference: PMID:22012984
    reference_title: "A frameshift mutation in LRSAM1 is responsible for a dominant hereditary polyneuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data strongly support the hypothesis that LRSAM1 mutations can cause both dominant and recessive forms of CMT."
    explanation: >-
      Establishes that one gene accounts for both inheritance patterns, which is the basis for curating
      them as one disease.
  - reference: PMID:23245322
    reference_title: "The LRR and RING domain protein LRSAM1 is an E3 ligase crucial for ubiquitin-dependent autophagy of intracellular Salmonella Typhimurium."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these functions require LRSAM1's leucine-rich repeat and RING domains, respectively"
    explanation: >-
      Domain functions were demonstrated in antibacterial autophagy assays; this is background biology,
      not direct neuropathy causality.

    quote_role: BACKGROUND
  - reference: PMID:30996334
    reference_title: LRSAM1 variants and founder effect in French families with ataxic form of Charcot-Marie-Tooth type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identified 2 novel variants in LRSAM1 gene: a deletion of 4 amino acids, p.(Gln698_Gln701del), was found in 7 families and a duplication of a neighboring region of 10 amino acids, p.(Pro702_Gln711dup), in the remaining family.'
    explanation: >-
      Documents dominant in-frame alleles in the French families.
  - reference: PMID:30996334
    reference_title: LRSAM1 variants and founder effect in French families with ataxic form of Charcot-Marie-Tooth type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A common haplotype of ~450 kb suggesting a founder effect was noted around LRSAM1 in 4 families carrying the first variant.
    explanation: >-
      Founder evidence is restricted to four French families carrying the deletion.

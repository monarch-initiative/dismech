    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical and electrophysiological data confirm a late-onset axonal neuropathy with a predominance of sensorimotor impairment."
    explanation: >-
      Independent confirmation in the largest series, with electrophysiology
      establishing that the process is axonal rather than demyelinating.


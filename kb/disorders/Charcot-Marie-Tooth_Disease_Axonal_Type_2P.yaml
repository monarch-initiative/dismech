    for tested alleles, but other toxic or altered-interaction effects remain possible; NMD escape is
    not a universal explanation for dominant CMT2P.
  genes:
  - preferred_term: LRSAM1
    term:
      id: hgnc:25135
      label: LRSAM1
  genetic_context:

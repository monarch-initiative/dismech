inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most reported families have autosomal dominant inheritance due to a heterozygous RING-domain missense
    variant, in-frame indel or frameshift. Reduced penetrance and variable expressivity occur; lower-limb
    muscle MRI can reveal subclinical involvement in some carriers. Dominant-negative or other altered-protein
    effects are proposed, with functional consequences requiring allele-specific interpretation.
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority follows dominant inheritance, whereas recessive inheritance has been described for one variant."
    explanation: >-
      Establishes dominant inheritance as the usual pattern and recessive as the exception, which is why
      this block is listed first.
  - reference: PMID:33568173
    reference_title: "LRSAM1 and the RING domain: Charcot-Marie-Tooth disease and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asymptomatic individuals were identified in several pedigrees exemplifying the strong phenotypic variability of these patients requiring serial clinical evaluation to establish correct diagnosis"
    explanation: >-
      Documents incomplete penetrance and its practical consequence for diagnosis, which is what makes
      the dominant pattern hard to recognise in a small family.

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance was established in a consanguineous eastern Canadian kindred with
    a homozygous splice-acceptor variant. Patient RNA showed aberrant splicing and a frameshift, and immunoblotting
    failed to detect LRSAM1. This supports loss of function, but the original study did not demonstrate
    transcript degradation or distinguish rapid protein degradation from loss of antibody recognition.
  evidence:
  - reference: PMID:20865121
    reference_title: "Mutation in the gene encoding ubiquitin ligase LRSAM1 in patients with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied a large family from a rural eastern Canadian community, with multiple individuals suffering from a condition clinically most similar to autosomal recessive axonal CMT, or AR-CMT2."
    explanation: >-
      The founding recessive kindred and its clinical classification.
mechanistic_hypotheses:
- hypothesis_group_id: lrsam1_ubiquitylation_failure
  hypothesis_label: Loss of LRSAM1 Ubiquitin Ligase Activity
  status: CANONICAL
  description: >-
    LRSAM1 dysfunction is the established genetic basis of CMT2P. Impaired E2 interaction and ubiquitin-ligase
    activity were demonstrated for three dominant RING variants; the recessive splice allele is consistent
    with loss of function. The precise downstream process responsible for axonal degeneration is unresolved.
    This group links the genetic and biochemical lesion to axonal neuropathy without treating endosomal
    sorting as a proven intermediate.

- hypothesis_group_id: lrsam1_cellular_homeostasis
  hypothesis_label: Altered Protein Interactions and Intracellular Localization
  status: EMERGING
  description: >-
    Patient-derived and engineered cells show altered RNA-binding-protein interactions, reduced nuclear
    RNA-binding proteins, and abnormal localization of RING-mutant LRSAM1 and associated proteins. These
    observations suggest routes to neuronal dysfunction, but the causal contribution of each to human
    axonal degeneration remains unproven.
- hypothesis_group_id: lrsam1_cns_parkinsonism_extension
  hypothesis_label: Central Nervous System Extension to Late-Onset Parkinsonism
  status: EMERGING
  description: >-
    Parkinsonism with presynaptic dopaminergic deficits has been reported in a generation of the original
    Dutch family and in subsequent cases. Whether LRSAM1 contributes causally, and by what mechanism,
    remains unknown; familial ascertainment does not establish risk in all carriers.

pathophysiology:
- name: Pathogenic LRSAM1 Variants
  biological_scale: MOLECULAR
  description: >-
    Dominant CMT2P variants cluster in the C-terminal RING domain and include missense substitutions,
    in-frame deletions or duplications, and frameshifts. The original p.Leu708Argfs*28 allele replaces
    the C terminus and lengthens the protein by 12 residues. The recessive c.1913-1G>A splice-acceptor
    allele lies upstream of the RING domain and produces a frameshift that removes it. Nonsense-mediated
    decay is relevant to premature-stop alleles, not to every pathogenic variant class.
  genes:
  - preferred_term: LRSAM1
    term:
      id: hgnc:25135
      label: LRSAM1
  genetic_context:
    description: >-
      Germline LRSAM1 variants, heterozygous in dominant families and homozygous for the original recessive
      splice allele.
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to variable inheritance patterns and clustering of pathogenic variants in 3´-prime exons, interpretation of genetic variants in LRSAM1 is challenging."
    explanation: >-
      The positional clustering, and its practical consequence for variant interpretation.
  - reference: PMID:22012984
    reference_title: "A frameshift mutation in LRSAM1 is responsible for a dominant hereditary polyneuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This frameshift mutation (p.Leu708Argfx28) is located in the C-terminal RING finger motif of the encoded protein."
    explanation: >-
      Localises the founding dominant allele to the RING domain, which is the observation the whole domain-clustering
      story is built on.
  - reference: PMID:33568173
    reference_title: "LRSAM1 and the RING domain: Charcot-Marie-Tooth disease and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These tightly cluster in the C-terminal RING domain highlighting its importance in governing the CMT disease."
    explanation: >-
      Independent statement of the clustering from a review of the whole reported allelic series.
  - reference: PMID:30996334
    reference_title: LRSAM1 variants and founder effect in French families with ataxic form of Charcot-Marie-Tooth type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We identified 2 novel variants in LRSAM1 gene: a deletion of 4 amino acids, p.(Gln698_Gln701del), was found in 7 families and a duplication of a neighboring region of 10 amino acids, p.(Pro702_Gln711dup), in the remaining family.'
    explanation: >-
      Documents dominant in-frame alleles in the French families.
  downstream:
  - target: Recessive LRSAM1 Splice Defect
    description: >-

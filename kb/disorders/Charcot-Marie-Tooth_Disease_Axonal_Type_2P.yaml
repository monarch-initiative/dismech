    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dominant CMT2P is usually characterized by relatively mild, slowly progressive axonal neuropathy, mainly involving lower limbs, with age of onset between the second and fifth decades of life"
    explanation: >-
      Severity, tempo, distribution and onset window in one statement.
  - reference: PMID:33414056

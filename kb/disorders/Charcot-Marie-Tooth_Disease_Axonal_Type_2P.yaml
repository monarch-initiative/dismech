    reference_title: Pathogenic LRSAM1 RING Domain Variants Disrupt Intracellular Protein Localization in Charcot-Marie-Tooth Disease Type 2P.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Wild-type LRSAM1 was also observed in the lipid droplet fraction, whereas mutant LRSAM1 was absent.

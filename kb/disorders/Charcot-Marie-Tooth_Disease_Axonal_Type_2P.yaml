- name: Recessive LRSAM1 Splice Defect
  biological_scale: MOLECULAR
  description: >-
    The homozygous splice-acceptor variant activates an acceptor two bases into the exon, causing a frameshift
    and predicted truncation before the RING domain. Qualitative patient-blood RT-PCR showed transcript
    at roughly control intensity. Immunoblotting of patient lymphoblastoid cells detected no LRSAM1, but
    the authors considered both rapid degradation and failure of antibody recognition. Loss of function
    is inferred; complete protein absence and nonsense-mediated decay were not independently established.
  genes:

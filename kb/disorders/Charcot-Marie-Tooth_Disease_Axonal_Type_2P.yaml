genetic:
- name: LRSAM1
  notes: >
    The sole gene for this disorder, at 9q33.3, encoding a universally
    expressed RING-type E3 ubiquitin ligase also known as Tal. Its domain
    architecture divides the work: the leucine-rich repeat domain targets
    substrates and the RING domain catalyses ubiquitin transfer, which is why
    disease variants clustered in the RING-encoding exons abolish catalysis
    while leaving substrate binding intact. Outside this disease the same
    ligase is required for ubiquitin-dependent autophagy of intracellular
    Salmonella, which is where much of what is known about its substrate
    targeting comes from.
  gene_term:
    preferred_term: LRSAM1
    term:
      id: hgnc:25135
      label: LRSAM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:20865121
    reference_title: "Mutation in the gene encoding ubiquitin ligase LRSAM1 in patients with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous pathogenic variant was identified in the gene encoding leucine rich repeat and sterile alpha motif 1 (LRSAM1) by direct DNA sequencing of genes within the region in affected DNA samples."
    explanation: >-
      The gene-disease assertion in the paper that first made it.
  - reference: PMID:22012984
    reference_title: "A frameshift mutation in LRSAM1 is responsible for a dominant hereditary polyneuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data strongly support the hypothesis that LRSAM1 mutations can cause both dominant and recessive forms of CMT."
    explanation: >-
      Establishes that one gene accounts for both inheritance patterns, which
      is the basis for curating them as one disease.
  - reference: PMID:23245322
    reference_title: "The LRR and RING domain protein LRSAM1 is an E3 ligase crucial for ubiquitin-dependent autophagy of intracellular Salmonella Typhimurium."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these functions require LRSAM1's leucine-rich repeat and RING domains, respectively"
    explanation: >-
      The division of labour between the two domains, which is why a
      RING-domain variant removes catalysis without removing targeting.

animal_models:
- name: Lrsam1 mutant mouse
  species: Mouse
  genotype: Lrsam1 mutant, homozygous and heterozygous
  publication: PMID:23519028
  description: >
    The only animal model of this disease. Its value is not that it reproduces
    the neuropathy - it barely does - but that it separates vulnerability from
    degeneration: the axons are compromised without being lost, and a
    neurotoxic challenge reveals it.
  modeled_mechanisms:
  - target: Increased Vulnerability of Long Peripheral Axons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mutant mice show only a very mild age-related neuropathy on their own
      but degenerate readily on acrylamide challenge, which is the evidence
      that losing the ligase lowers the axonal threshold.
    limitations: >-
      The spontaneous phenotype is far milder than the human disease, so the
      model cannot report on the course or severity of CMT2P. It is a loss of
      function model and so cannot represent the dominant-negative mechanism
      that accounts for most human cases, and it does not show the
      parkinsonism reported in the dominant kindred.
    readouts:
    - name: Axon degeneration after acrylamide challenge
      target: Increased Vulnerability of Long Peripheral Axons
      direction: INCREASED
      interpretation: >-
        Heightened sensitivity to a known axonal neurotoxin, read as evidence
        that the mutant axons are already compromised.
      evidence:
      - reference: PMID:23519028
        reference_title: "Loss of the E3 ubiquitin ligase LRSAM1 sensitizes peripheral axons to degeneration in a mouse model of Charcot-Marie-Tooth disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Lrsam1 mutant mice are more sensitive to challenge with acrylamide, a neurotoxic agent that causes axon degeneration, indicating that the axons in the mutant mice are indeed compromised"
        explanation: The measurement and the authors' reading of it.
    evidence:
    - reference: PMID:23519028
      reference_title: "Loss of the E3 ubiquitin ligase LRSAM1 sensitizes peripheral axons to degeneration in a mouse model of Charcot-Marie-Tooth disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We have generated mouse mutations in Lrsam1 to create an animal model of this form of CMT (CMT2P)."
      explanation: >-
        States that the model was built as a model of this disease
        specifically.
  - target: Distal Muscle Weakness
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mice do not develop the human motor phenotype. Both homozygotes and
      heterozygotes have largely normal neuromuscular performance, with only a
      very mild neuropathy appearing with age.
    limitations: >-
      Species differences in axon length and lifespan are the obvious
      candidates, and the model is a loss of function while most human disease
      is dominant-negative, so the failure may reflect the wrong mechanism
      rather than the wrong species. Neither has been tested.
    evidence:
    - reference: PMID:23519028
      reference_title: "Loss of the E3 ubiquitin ligase LRSAM1 sensitizes peripheral axons to degeneration in a mouse model of Charcot-Marie-Tooth disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both homozygous and heterozygous mice have largely normal neuromuscular performance and only a very mild neuropathy phenotype with age."
      explanation: >-
        The negative result, quoted directly. It is the reason this link is
        FAILS_TO_RECAPITULATE rather than a weak positive.


- name: Neuropathic Pain Management
  description: >-
    The gap between what this entry says distinguishes CMT2P and what it
    offered clinically. Pain is prominent enough here that the largest series
    calls the disorder a cause of painful neuropathy specifically, and pain is
    treatable where the neuropathy is not.

    A caution on the evidence, because the sources sit at three different
    scopes and none is CMT2P-specific. That pain needs treating in CMT2 is
    stated by the CMT2 GeneReviews chapter. That pain is a major and
    inadequately managed problem across CMT is established in a patient cohort.
    The specific agent classes - tricyclic antidepressants, carbamazepine,
    gabapentin - are named only in the GeneReviews chapter for MFN2-related
    CMT2, a sibling subtype, as generic symptomatic management rather than
    anything MFN2-specific. No trial of any of these agents in CMT2P exists,
    and none is likely to. The agents are curated because a queryable treatment
    with no named agent is not useful to a clinician, and every item is graded
    INDIRECT with its scope stated.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gabapentin
      term:
        id: CHEBI:42797
        label: gabapentin
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
    - preferred_term: amitriptyline
      term:
        id: CHEBI:2666
        label: amitriptyline
  evidence:
  - reference: PMID:20301462
    reference_title: "Charcot-Marie-Tooth Neuropathy Type 2 - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "symptomatic treatment of pain, depression, sleep apnea, restless legs syndrome"
    explanation: >-
      The GeneReviews chapter for Charcot-Marie-Tooth neuropathy type 2, the
      group CMT2P belongs to, listing symptomatic treatment of pain in its
      management section. Correct in scope but it names no agents, which is why
      the two further items below are needed.
  - reference: PMID:36793224
    reference_title: "Patient Reported Outcomes Using Medical Cannabis for Managing Pain in Charcot-Marie-Tooth Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Chronic pain is a major problem for patients with Charcot-Marie-Tooth (CMT) disease."
    explanation: >-
      Establishes that the problem this treatment addresses is real and common
      across CMT, from a patient cohort rather than expert opinion. Graded
      INDIRECT because the cohort is CMT-wide rather than CMT2P.
  - reference: PMID:20301684
    reference_title: "MFN2 Hereditary Motor and Sensory Neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "treatment of neuropathic pain with tricyclic antidepressants or drugs such as carbamazepine or gabapentin"
    explanation: >-
      The only cached source naming agent classes for neuropathic pain in
      axonal CMT. Read the scope carefully before reusing it: this is the
      GeneReviews chapter for MFN2-related CMT2, a different subtype from
      CMT2P. It is cited because the recommendation it makes is generic
      symptomatic management of neuropathic pain in axonal CMT and carries
      nothing MFN2-specific, not because MFN2 disease is a proxy for this one.
      Graded INDIRECT for exactly that reason.

- name: Genetic Counselling
  description: >
    Counselling is unusually consequential here, because the mode of
    inheritance is a property of the variant rather than of the gene:
    recurrence risk depends on whether the family's premature termination
    codon escapes nonsense-mediated decay. Incomplete penetrance and
    asymptomatic carriers complicate family assessment further.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ACMG (American College of Medical Genetics and genomics) criteria should be carefully applied in variant interpretation, with special attention to premature termination codon-introducing variants and their location within the gene."
    explanation: >-
      The interpretive care this disease requires, which is the substance of
      what counselling has to convey to a family.

diagnosis:
- name: Nerve conduction studies and electromyography
  description: >
    Establishes that the neuropathy is axonal rather than demyelinating, which
    places the patient in CMT2 and narrows the gene panel. In CMT2P the
    electrophysiology confirms a late-onset axonal sensorimotor process.
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical and electrophysiological data confirm a late-onset axonal neuropathy with a predominance of sensorimotor impairment."
    explanation: >-
      Establishes the electrophysiological phenotype the test is looking for.

- name: Lower-limb muscle MRI
  description: >
    Detects fatty atrophy in carriers who are clinically unaffected. In a
    family with a known LRSAM1 variant this is what converts an ambiguous
    pedigree into a resolved one, and it is why the disease's penetrance
    cannot be assessed on clinical examination alone.
  evidence:
  - reference: PMID:27686364
    reference_title: "Charcot-Marie-Tooth disease type 2G redefined by a novel mutation in LRSAM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging (MRI) of lower-limb musculature systematically showed fatty atrophy in clinical and subclinical mutation carriers."
    explanation: >-
      The finding and its extension to subclinical carriers, which is what
      makes the test diagnostically useful beyond confirming clinical disease.

- name: LRSAM1 sequencing within a multigene neuropathy panel
  description: >
    Definitive diagnosis. The interpretive difficulty is specific and worth
    stating: because pathogenic variants cluster in the 3-prime exons, whether
    a premature termination codon escapes nonsense-mediated decay determines
    both pathogenicity assessment and the inheritance pattern to counsel on,
    and prediction is not always reliable.
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to variable inheritance patterns and clustering of pathogenic variants in 3´-prime exons, interpretation of genetic variants in LRSAM1 is challenging."
    explanation: >-
      States the interpretive problem that makes this more than a routine
      panel result.

discussions:
- discussion_id: lrsam1_substrate_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired TSG101-Dependent Endosomal Sorting
  prompt: >-
    Which LRSAM1 ubiquitylation substrates matter in peripheral axons, and how
    does losing their ubiquitylation cause axonal degeneration?
  rationale: >
    This is the weakest step in an otherwise well-measured chain. TSG101 is
    the only validated substrate, and the reviewers of this gene say so
    explicitly and call it a limit on understanding the protein's cellular
    role. Two results make the endosomal reading harder rather than easier:
    LRSAM1 sits in a post-Golgi perinuclear compartment with little overlap
    with endosome-to-lysosome trafficking machinery, and the p.Cys694Tyr
    allele leaves TSG101 protein levels unchanged in patient cells. Until
    axon-relevant substrates are mapped, the link between the biochemical
    lesion, which is well established, and the clinical phenotype, which is
    well described, is an inference across a gap.
  proposed_experiments:
  - experiment_id: lrsam1_neuronal_ubiquitylome
    name: Ubiquitylation proteomics in LRSAM1-deficient human neurons
    description: >-
      Compare the ubiquitylome of iPSC-derived motor and sensory neurons
      carrying dominant-negative and loss-of-function LRSAM1 alleles against
      isogenic controls, to identify substrates whose ubiquitylation depends
      on LRSAM1 in the cell type the disease affects.
    would_support:
    - pathophysiology#Impaired TSG101-Dependent Endosomal Sorting
    supporting_outcome:
    - >-
      TSG101 ubiquitylation is reduced in mutant neurons, together with other
      substrates in endosomal sorting, supporting the pathway as curated.
    refuting_outcome:
    - >-
      TSG101 ubiquitylation is unchanged while other, non-endosomal substrates
      lose ubiquitylation, which would move this node off the ESCRT pathway
      entirely.

- discussion_id: lrsam1_mouse_severity_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Lrsam1 mutant mouse
  - pathophysiology#Increased Vulnerability of Long Peripheral Axons
  prompt: >-
    Why does complete loss of Lrsam1 leave a mouse with almost no neuropathy
    while loss or dominant-negative disruption of LRSAM1 causes a progressive
    neuropathy in people?
  rationale: >
    The mismatch is large and it is not a detail: the mouse is the only animal
    model of this disease and its spontaneous phenotype is very mild in both
    homozygotes and heterozygotes. Two explanations are available and neither
    has been tested. The first is scale, since a mouse sciatic axon is short
    and a mouse lifespan is brief, and this is a length-dependent, late-onset
    degeneration. The second is mechanism, since the mouse models loss of
    function while most human disease is dominant-negative, so the model may
    simply not be modelling the human lesion. Which of the two it is
    determines whether the acrylamide-sensitisation result can be read as
    disease-relevant or only as a general vulnerability assay.
  proposed_experiments:
  - experiment_id: lrsam1_dominant_negative_knockin_mouse
    name: Knock-in mouse carrying a human dominant-negative LRSAM1 allele
    description: >-
      Introduce a human RING-domain frameshift such as p.Leu708Argfs*28 into
      the mouse germline and compare its spontaneous neuropathy with the
      existing Lrsam1 loss-of-function mutant, ageing both cohorts.
    would_support:
    - pathophysiology#Dominant-Negative Truncated RING-Domain Protein
    supporting_outcome:
    - >-
      The knock-in develops a spontaneous progressive neuropathy that the
      loss-of-function mutant does not, which would show the mild mouse
      phenotype reflects the wrong mechanism rather than the wrong species.
    refuting_outcome:
    - >-
      The knock-in is as mild as the existing mutant, which would point to
      axon length and lifespan as the reason and would mean no mouse can model
      this disease's course.

- discussion_id: lrsam1_parkinsonism_association
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Nigral Neuron Degeneration
  - mechanistic_hypotheses#lrsam1_cns_parkinsonism_extension
  prompt: >-
    Is late-onset parkinsonism part of the LRSAM1 phenotype, and if so what
    connects a peripheral-axon ligase defect to substantia nigra neurons?
  rationale: >
    The observation is striking - three of five affected members of one
    kindred, at ages 50 to 65 - and the authors are careful to call it
    speculation. Two things are unresolved. Whether the association is real
    needs systematic ascertainment across LRSAM1 cohorts rather than
    retrospective notice in the family where it was first seen, since
    Parkinson disease is common enough at those ages that a single pedigree
    cannot settle it. And if it is real, no mechanism exists: nothing links
    this ligase to nigral biology, although the broader ubiquitin-proteostasis
    theme it shares with neurodegeneration makes the idea plausible rather
    than arbitrary. This matters clinically because it determines whether
    LRSAM1 carriers should be watched for parkinsonian features at all.

prevalence:
- population: Published LRSAM1-related neuropathy cohorts
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Population prevalence is unknown. The French study identified 72 patients across eight families; a
    later series added 14 patients from 12 families. These are separate ascertained series, not a worldwide
    case total or an unbiased prevalence denominator.

name: Charcot-Marie-Tooth Disease Axonal Type 2P
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Charcot-Marie-Tooth disease axonal type 2P
  term:
    id: MONDO:0013753
    label: Charcot-Marie-Tooth disease axonal type 2P
description: >
  Charcot-Marie-Tooth disease axonal type 2P (CMT2P, OMIM #614436) is a rare
  axonal hereditary motor and sensory neuropathy caused by variants in
  LRSAM1, which encodes a RING-type E3 ubiquitin ligase. Clinically it is an
  ordinary length-dependent CMT2 phenotype, distinguished mainly by being
  mild, late in onset - typically the second to fifth decade - slowly
  progressive, lower-limb predominant, and unusually often painful. Its
  expressivity is wide enough that asymptomatic carriers exist and are
  detectable only on lower-limb muscle MRI.

  What makes CMT2P mechanistically interesting is not the neuropathy but the
  genetics. Pathogenic variants cluster in the 3-prime exons that encode the
  C-terminal RING domain, and that clustering has a consequence: whether a
  premature termination codon there triggers nonsense-mediated decay or
  escapes it decides the mode of inheritance. A variant whose transcript is
  degraded leaves no protein, so disease requires two alleles and is
  recessive. A variant whose transcript survives produces a truncated
  RING-domain protein that acts dominant-negatively on the ligase, so one
  allele suffices. The gene is therefore a worked example of variant position
  determining inheritance mode, and this entry curates the two routes as
  separate upstream nodes converging on one functional endpoint.

  That endpoint is measured directly. Biochemically, disease RING variants
  abolish the E2-E3 interaction that ubiquitin transfer depends on, so
  ubiquitylation activity is largely abrogated - while, notably, LRSAM1
  dimerisation and binding to its target TSG101 are preserved. The lesion is
  in catalysis, not in substrate recognition.

  Downstream of that the chain is weaker, and the entry says so. TSG101, an
  ESCRT-I component, remains the only well-validated LRSAM1 ubiquitylation
  target, and how impaired endosomal sorting kills the longest peripheral
  axons has not been demonstrated. The strongest evidence that axons are
  compromised at all is indirect: Lrsam1-mutant mice have almost no
  spontaneous neuropathy but degenerate readily when challenged with the
  axonal neurotoxin acrylamide.

  A separate and still preliminary strand is a central nervous system
  extension. Three of five affected members of the original dominant Dutch
  kindred developed parkinsonism between 50 and 65, many years after their
  neuropathy began. This entry curates that as an emerging hypothesis with
  its own hypothesis group, not as an established feature.

synonyms:
- CMT2P
- Charcot-Marie-Tooth disease, axonal, type 2P
- LRSAM1-related Charcot-Marie-Tooth disease
- CMT2G
- Charcot-Marie-Tooth disease type 2G

parents:
- Charcot-Marie-Tooth disease type 2
- Hereditary motor and sensory neuropathy

notes: >
  CMT2G and CMT2P are the same disease. A large pedigree had been classified
  as a distinct entity, CMT2G, on linkage grounds; re-mapping and sequencing
  identified LRSAM1 p.Cys694Tyr in it, which collapsed CMT2G into CMT2P. Both
  designations are carried as synonyms here so a search on either finds this
  entry.

  Why this entry has two inheritance blocks rather than two entries. Dominant
  and recessive CMT2P are one disease with one gene and one functional
  endpoint, differing in whether the mutant transcript survives
  nonsense-mediated decay. Splitting them would duplicate the whole pathograph
  to record a difference that is properly a property of the allele, so the two
  routes are curated as separate pathophysiology nodes converging on the same
  ubiquitylation-failure node, with an `inheritance` block for each pattern.

  A hallucinated identifier caught in preflight, recorded so it is not
  repeated. The openscientist deep-research report used for this entry
  proposed MONDO:0013749 as the term for CMT2P. That CURIE resolves, so it
  does not look like a fabrication, but it is `ventricular septal defect 3`.
  The report's own term-validation section flagged it, and the correct term,
  MONDO:0013753, came from the curation stub. The report's reference
  validation was otherwise clean (20 of 20 identifiers resolved, no quote
  failures), which is exactly the situation the term check exists for: clean
  citations tell you nothing about whether the ontology bindings are right.
  Two of its suggested NCIT treatment terms were wrong in the same way -
  NCIT:C15224 offered for "pain management" is `Nutrition Research, Fats`, and
  NCIT:C15633 offered for "genetic counseling" is `Cancer Pain Management` -
  and neither was used.

  What this entry deliberately does not claim. No phenotype carries a
  `frequency`: the literature is a set of pedigrees and small series, the
  largest being 14 patients from 12 families, and the cohorts include
  asymptomatic carriers ascertained by family testing, so any percentage would
  describe who was sequenced rather than the disease. The step from impaired
  TSG101 ubiquitylation to axon degeneration is marked as inferred in the node
  that asserts it, and the parkinsonism association is kept out of the
  canonical hypothesis group.


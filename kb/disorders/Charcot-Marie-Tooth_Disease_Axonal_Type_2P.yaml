name: Charcot-Marie-Tooth Disease Axonal Type 2P
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Charcot-Marie-Tooth disease axonal type 2P
  term:
    id: MONDO:0013753
    label: Charcot-Marie-Tooth disease axonal type 2P
description: >-
  Charcot-Marie-Tooth disease axonal type 2P (CMT2P) is an LRSAM1-related motor and sensory neuropathy
  with autosomal dominant or recessive inheritance. Distal weakness, amyotrophy, sensory loss and reduced
  reflexes usually progress slowly, predominantly in the lower limbs. Sensory ataxia and neuropathic pain
  can be prominent. Onset and severity vary, including early-onset families, subclinical adult carriers
  and occasional severe disability. Dominant alleles include missense variants, in-frame indels and frameshifts
  altering the C-terminal RING domain; the original recessive splice defect lies upstream of that domain.
  Impaired ubiquitin-ligase activity is supported by biochemical experiments, but the pathways connecting
  LRSAM1 dysfunction to human axonal degeneration remain unresolved. Altered RNA-binding-protein interactions
  and intracellular protein localization provide additional experimental mechanisms. Parkinsonism has
  been reported in several carriers, without an established causal relationship or penetrance estimate.

synonyms:
- CMT2P
- Charcot-Marie-Tooth disease, axonal, type 2P
- LRSAM1-related Charcot-Marie-Tooth disease
- CMT2G
- Charcot-Marie-Tooth disease type 2G

parents:
- Charcot-Marie-Tooth disease type 2
- Hereditary motor and sensory neuropathy

notes: >-
  CMT2G was reassigned to CMT2P after identification of LRSAM1 p.Cys694Tyr in the linked pedigree. Dominant
  and recessive inheritance represent allelic forms of the same LRSAM1-related neuropathy. Neither nonsense-mediated
  decay predictions nor variant location alone establish pathogenicity or inheritance. Published cohorts
  are family-ascertained and sometimes share founder alleles; their phenotype proportions are not population
  penetrance estimates. No LRSAM1-specific GeneReviews chapter was identified in the Bookshelf index;
  the current CMT overview supplies general clinical guidance, explicitly distinguished from CMT2P-specific
  observations.


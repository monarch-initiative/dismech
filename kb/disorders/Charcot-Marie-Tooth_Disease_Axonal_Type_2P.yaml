    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct analysis of RNA from patient blood demonstrated aberrant splicing of the affected exon, causing an obligatory frameshift and premature truncation of the protein."
    explanation: >-
      Transcript-level demonstration that the splice variant does what it is predicted to do, in patient

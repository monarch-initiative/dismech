- name: Nigrostriatal Dopaminergic Dysfunction
  biological_scale: CELLULAR
  description: >-
    Dopamine-transporter imaging supports presynaptic nigrostriatal dysfunction in reported LRSAM1 carriers
    with parkinsonism. Three of five affected relatives in one generation of the Dutch family developed
    Parkinson disease at ages 50-65, and subsequent cases include a 2025 report described as the seventh
    clinical description. These observations do not establish a causal LRSAM1 mechanism or general carrier
    risk; nigral neuronal loss has not been demonstrated histologically.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:26900582
    reference_title: "A LRSAM1 mutation links Charcot-Marie-Tooth type 2 to Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within one generation of the original Dutch family in which the dominant LRSAM1 mutation was identified, three of the five affected family members have developed Parkinson's disease between ages 50 and 65 years, many years after neuropathy onset."
    explanation: >-

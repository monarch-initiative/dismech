- name: Nigral Neuron Degeneration
  biological_scale: CELLULAR
  description: >
    An emerging and unexplained branch. Within one generation of the original
    dominant Dutch kindred, three of five affected members developed
    Parkinson disease between the ages of 50 and 65, many years after their
    neuropathy began. The authors propose that the parkinsonism is part of the
    LRSAM1 phenotype rather than coincidence, and say plainly that how the
    mutant protein affects substantia nigra neurons is unclear. Nothing
    connects the ligase to nigral biology, and the observation rests on one
    family plus scattered later cases, so this node exists to hold the
    association rather than to explain it.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:26900582
    reference_title: "A LRSAM1 mutation links Charcot-Marie-Tooth type 2 to Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within one generation of the original Dutch family in which the dominant LRSAM1 mutation was identified, three of the five affected family members have developed Parkinson's disease between ages 50 and 65 years, many years after neuropathy onset."
    explanation: >-
      The observation itself, with its numerator, denominator and timing,
      which is the entire human evidence base for this branch.
  - reference: PMID:26900582
    reference_title: "A LRSAM1 mutation links Charcot-Marie-Tooth type 2 to Parkinson's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "How the mutated Lrsam1 protein, which normally has E3 ubiquitin ligase activity and is expressed in the nervous system, impacts on substantia nigra neurons is unclear."
    explanation: >-
      The authors' own statement that the mechanism is unknown, which is why
      this node is HYPOTHETICAL and sits in a separate hypothesis group.
  - reference: PMID:40721190
    reference_title: "Further delineation of LRSAM1-related Charcot-Marie-Tooth type 2P with parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To the best of our knowledge, this is the seventh clinical description linking an LRSAM1 pathogenic variant and parkinsonism."
    explanation: >-
      Independent corroboration, and it changes how strong this association
      looks: seven descriptions rather than one kindred. This is the citation
      behind the phrase "scattered later cases" in this entry, which was
      previously asserted without one.
  - reference: PMID:40721190
    reference_title: "Further delineation of LRSAM1-related Charcot-Marie-Tooth type 2P with parkinsonism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "123 I-FP-CIT single-photon emission computed tomography revealed bilateral alteration of the presynaptic dopaminergic pathway, especially regarding the putamen."
    explanation: >-
      Imaging evidence of presynaptic dopaminergic loss in an LRSAM1 patient.
      It matters because it moves the claim from a clinical impression of
      parkinsonism to a demonstrated nigrostriatal deficit, which is what this
      node asserts.
  downstream:
  - target: Parkinsonism
    description: Clinical expression of nigral involvement.
    hypothesis_groups:
    - lrsam1_cns_parkinsonism_extension

phenotypes:
- category: Neurologic
  name: Distal Muscle Weakness
  description: >
    Length-dependent, lower limbs before and more than upper limbs, mild to
    moderate, and slowly progressive. Onset is usually between the second and
    fifth decades, which is late for CMT and is one of the features that makes
    the diagnosis easy to miss.
  phenotype_term:
    preferred_term: Distal muscle weakness

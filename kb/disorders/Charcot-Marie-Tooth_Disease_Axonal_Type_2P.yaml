prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate specific to CMT2P exists. The largest published
    series is 14 patients from 12 families; two systematic Dutch cohorts
    screened for LRSAM1 (107 sequenced across the whole coding region, 468
    across the RING-encoding exon alone) found the variants to be rare within
    CMT2 itself.
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations of LRSAM1 were identified as a rare cause and define the subgroup of axonal neuropathy CMT2P. We identified additional 14 patients out of 12 families."
    explanation: >-
      Establishes both the rarity of the cause and the size of the largest
      published series, which is the denominator this entry works from.
  - reference: PMID:28335037
    reference_title: "LRSAM1-mediated ubiquitylation is disrupted in axonal Charcot-Marie-Tooth disease 2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on our genetic analysis, the occurrence of pathogenic LRSAM1 mutations is estimated to be rare."
    explanation: >-
      A rarity estimate grounded in unbiased sequencing of two cohorts rather
      than in how many families happened to be reported.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    The majority pattern. A heterozygous variant in the 3-prime RING-encoding
    exons whose premature termination codon escapes nonsense-mediated decay
    yields a truncated protein that acts dominant-negatively, so one allele is
    enough. Penetrance is incomplete and expressivity wide: asymptomatic
    carriers occur in several pedigrees and may be identifiable only by
    lower-limb muscle MRI.
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority follows dominant inheritance, whereas recessive inheritance has been described for one variant."
    explanation: >-
      Establishes dominant inheritance as the usual pattern and recessive as
      the exception, which is why this block is listed first.
  - reference: PMID:33568173
    reference_title: "LRSAM1 and the RING domain: Charcot-Marie-Tooth disease and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asymptomatic individuals were identified in several pedigrees exemplifying the strong phenotypic variability of these patients requiring serial clinical evaluation to establish correct diagnosis"
    explanation: >-
      Documents incomplete penetrance and its practical consequence for
      diagnosis, which is what makes the dominant pattern hard to recognise in
      a small family.

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    The minority pattern, established in the large consanguineous eastern
    Canadian kindred in which LRSAM1 was first identified. A homozygous
    splice-acceptor variant causes aberrant splicing, an obligatory frameshift
    and premature truncation, and no detectable protein - so heterozygotes,
    retaining one working allele, are unaffected.
  evidence:
  - reference: PMID:20865121
    reference_title: "Mutation in the gene encoding ubiquitin ligase LRSAM1 in patients with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied a large family from a rural eastern Canadian community, with multiple individuals suffering from a condition clinically most similar to autosomal recessive axonal CMT, or AR-CMT2."
    explanation: >-
      The founding recessive kindred and its clinical classification.
  - reference: PMID:33568173
    reference_title: "LRSAM1 and the RING domain: Charcot-Marie-Tooth disease and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recessive CMT mutations lead to complete loss of LRSAM1, contrary to the heterozygous dominant variants."
    explanation: >-
      States the molecular difference between the two inheritance patterns,
      which is the reason they are two blocks and not two diseases.

mechanistic_hypotheses:
- hypothesis_group_id: lrsam1_ubiquitylation_failure
  hypothesis_label: Loss of LRSAM1 Ubiquitin Ligase Activity
  status: CANONICAL
  description: >-
    Both the recessive and the dominant allele classes end at the same place:
    LRSAM1 cannot transfer ubiquitin to its substrates, because either no
    protein is made or a truncated RING-domain protein poisons the residual
    activity. Loss of ubiquitylation impairs TSG101-dependent endosomal
    sorting and neuronal proteostasis, lowering the threshold at which the
    longest peripheral axons degenerate. CANONICAL because the human genetics,
    the in vitro ubiquitylation assays on three separate disease alleles, and
    the sensitised mouse axon all converge on it.

- hypothesis_group_id: lrsam1_cns_parkinsonism_extension
  hypothesis_label: Central Nervous System Extension to Late-Onset Parkinsonism
  status: EMERGING
  description: >-
    The same ligase defect may, decades later, affect substantia nigra
    neurons, producing parkinsonism on top of the neuropathy. The evidence is
    one kindred in which three of five affected members developed Parkinson
    disease between 50 and 65, plus scattered later cases. Nothing connects
    LRSAM1 to nigral biology mechanistically, and the authors themselves frame
    the association as speculation. EMERGING, and deliberately kept out of the
    canonical group so that the peripheral mechanism does not inherit its
    uncertainty.

pathophysiology:
- name: LRSAM1 RING-Domain Variants
  biological_scale: MOLECULAR
  description: >
    LRSAM1 encodes a universally expressed RING-type E3 ubiquitin ligase with
    an LRR-coiled-coil-SAM-PDZ-binding-RING architecture, in which the LRR
    domain selects substrates and the RING domain catalyses ubiquitin
    transfer. Pathogenic variants cluster tightly in the 3-prime exons
    encoding the C-terminal RING domain: a homozygous splice-acceptor variant
    in the founding recessive kindred, the dominant frameshift
    p.Leu708Argfs*28, and the missense alleles p.Pro707Leu and p.Cys694Tyr.
    Reported series add further alleles, most of them novel and most of them
    dominant.

    The clustering is not incidental. Because these variants sit near the end
    of the transcript, whether the premature termination codon they introduce
    is recognised by nonsense-mediated decay is genuinely uncertain in
    individual cases, which is what makes variant interpretation here
    difficult and what determines the inheritance pattern.
  genes:
  - preferred_term: LRSAM1
    term:
      id: hgnc:25135
      label: LRSAM1
  genetic_context:
    description: >-
      Germline LRSAM1 variants concentrated in the 3-prime RING-encoding
      exons, heterozygous in the dominant families and homozygous in the
      recessive kindred.
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to variable inheritance patterns and clustering of pathogenic variants in 3´-prime exons, interpretation of genetic variants in LRSAM1 is challenging."
    explanation: >-
      The positional clustering, and its practical consequence for variant
      interpretation.
  - reference: PMID:22012984
    reference_title: "A frameshift mutation in LRSAM1 is responsible for a dominant hereditary polyneuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This frameshift mutation (p.Leu708Argfx28) is located in the C-terminal RING finger motif of the encoded protein."
    explanation: >-
      Localises the founding dominant allele to the RING domain, which is the
      observation the whole domain-clustering story is built on.
  - reference: PMID:33568173
    reference_title: "LRSAM1 and the RING domain: Charcot-Marie-Tooth disease and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These tightly cluster in the C-terminal RING domain highlighting its importance in governing the CMT disease."
    explanation: >-
      Independent statement of the clustering from a review of the whole
      reported allelic series.
  downstream:
  - target: Nonsense-Mediated Decay and Complete Loss of LRSAM1 Protein
    description: >-
      The recessive route: the mutant transcript is degraded and no protein is
      made.
    hypothesis_groups:
    - lrsam1_ubiquitylation_failure
  - target: Dominant-Negative Truncated RING-Domain Protein
    description: >-
      The dominant route: the premature termination codon escapes
      nonsense-mediated decay and a truncated protein is made.
    hypothesis_groups:
    - lrsam1_ubiquitylation_failure

- name: Nonsense-Mediated Decay and Complete Loss of LRSAM1 Protein
  biological_scale: MOLECULAR
  description: >
    The recessive route. In the founding kindred a single base change converts
    an intronic acceptor splice site from AG to AA; the affected exon is
    mis-spliced, an obligatory frameshift truncates the protein, and western
    blotting of immortalised patient cells shows no detectable LRSAM1 at all.
    A carrier keeps one functioning allele and is unaffected, which is what
    makes this route recessive.
  genes:
  - preferred_term: LRSAM1
    term:
      id: hgnc:25135
      label: LRSAM1
    modifier: DECREASED
  genetic_context:
    description: >-
      Homozygous intronic splice-acceptor variant causing aberrant splicing
      and truncation, with no detectable protein product.
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:20865121
    reference_title: "Mutation in the gene encoding ubiquitin ligase LRSAM1 in patients with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct analysis of RNA from patient blood demonstrated aberrant splicing of the affected exon, causing an obligatory frameshift and premature truncation of the protein."
    explanation: >-
      Transcript-level demonstration that the splice variant does what it is
      predicted to do, in patient material rather than in a construct.
  - reference: PMID:20865121
    reference_title: "Mutation in the gene encoding ubiquitin ligase LRSAM1 in patients with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blotting of immortalized cells from a homozygous patient showed complete absence of detectable protein, consistent with the splice site defect."
    explanation: >-
      Protein-level confirmation that this route is a true null, which is what
      distinguishes it from the dominant-negative route.
  downstream:
  - target: Failure of E2-E3 Interaction and Loss of Ubiquitylation Activity
    description: No ligase present to transfer ubiquitin.
    hypothesis_groups:
    - lrsam1_ubiquitylation_failure

- name: Dominant-Negative Truncated RING-Domain Protein
  biological_scale: MOLECULAR
  description: >
    The dominant route, and the majority of reported disease. A premature
    termination codon in the 3-prime exons escapes nonsense-mediated decay, so
    a truncated RING-domain protein is made rather than degraded. That protein
    interferes with the ligase function of the normal allele's product, which
    is why a single altered copy is sufficient to cause disease. The same
    dominant-negative reading applies to the RING missense alleles, which make
    a full-length protein carrying an altered RING domain.
  genes:
  - preferred_term: LRSAM1
    term:
      id: hgnc:25135
      label: LRSAM1
  genetic_context:
    description: >-
      Heterozygous frameshift or missense variants in the C-terminal RING
      domain, producing a protein that escapes nonsense-mediated decay.
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data emphasize the importance of the C-terminal RING domain, which exerts a dominant-negative effect on protein function, whenever affected by an altered or truncated protein."
    explanation: >-
      The dominant-negative claim stated directly, and stated for both altered
      and truncated protein, which is why the missense alleles sit in this
      node too.
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants at the 3`end may or may not escape from nonsense-mediated decay, thereby defining the pattern of inheritance."
    explanation: >-
      The rule that separates this node from the recessive one: the same
      region produces either route depending on whether the transcript
      survives.
  downstream:
  - target: Failure of E2-E3 Interaction and Loss of Ubiquitylation Activity
    description: >-
      Truncated or altered RING domain poisons residual ligase activity.
    hypothesis_groups:
    - lrsam1_ubiquitylation_failure

- name: Failure of E2-E3 Interaction and Loss of Ubiquitylation Activity
  biological_scale: MOLECULAR
  description: >
    Where the two allelic routes converge, and the best-measured step in the
    disease. Three separate disease alleles - the p.Leu708Argfs frameshift and
    the missense alleles p.Pro707Leu and p.Cys694Tyr - were assayed and all
    showed in vitro ubiquitylation activity largely abrogated. The reason is
    specific: they lose the E2-E3 interaction that ubiquitin transfer requires.

    The negative result in the same experiment is what makes this node
    precise. LRSAM1 dimerisation and its binding to TSG101 were not disrupted,
    so the lesion is in catalysis rather than in assembly or substrate
    recognition. A therapeutic strategy aimed at restoring substrate binding
    would therefore be aimed at a step that is not broken.
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    modifier: DECREASED
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  biological_processes:
  - preferred_term: protein ubiquitination
    modifier: DECREASED
    term:
      id: GO:0016567
      label: protein ubiquitination
  evidence:
  - reference: PMID:28335037
    reference_title: "LRSAM1-mediated ubiquitylation is disrupted in axonal Charcot-Marie-Tooth disease 2P."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that loss of the E2-E3 interaction that is an essential prerequisite for supporting ubiquitylation of target substrates, underlies this reduced ubiquitylation capacity."
    explanation: >-
      Identifies the specific biochemical step that fails, rather than only
      reporting that activity is reduced.
  - reference: PMID:28335037
    reference_title: "LRSAM1-mediated ubiquitylation is disrupted in axonal Charcot-Marie-Tooth disease 2P."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, LRSAM1 dimerization and interaction with the bona fide target TSG101 were not disrupted."
    explanation: >-
      The negative control within the same experiment, which localises the
      defect to catalysis and rules out substrate recognition.
  - reference: PMID:28335037
    reference_title: "LRSAM1-mediated ubiquitylation is disrupted in axonal Charcot-Marie-Tooth disease 2P."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our study provides further support for the role of LRSAM1 in CMT and identifies LRSAM1-mediated ubiquitylation as a common determinant of disease-associated LRSAM1 mutations."
    explanation: >-
      States that this endpoint is common to the disease alleles tested, which
      is what licenses drawing both upstream routes into one node.
  downstream:
  - target: Impaired TSG101-Dependent Endosomal Sorting
    description: >-
      Loss of ubiquitylation of the one well-validated substrate.
    hypothesis_groups:
    - lrsam1_ubiquitylation_failure
  - target: Nigral Neuron Degeneration
    description: >-
      Proposed central extension of the same ligase defect, decades later. The
      edge is drawn so the parkinsonism branch is part of the graph rather than
      a disconnected component; its uncertainty is carried by the hypothesis
      group, which is EMERGING, and no mechanism linking this ligase to nigral
      neurons has been established.
    hypothesis_groups:
    - lrsam1_cns_parkinsonism_extension

- name: Impaired TSG101-Dependent Endosomal Sorting
  biological_scale: CELLULAR
  description: >
    The weakest link in the chain, and it is marked as such. TSG101, a
    component of the ESCRT-I complex, is the only well-validated LRSAM1
    ubiquitylation target; LRSAM1 was originally characterised as Tal, a
    Tsg101-specific E3 ligase regulating receptor endocytosis and retrovirus
    budding. Loss of that ubiquitylation is expected to perturb endosomal
    sorting and multivesicular-body traffic, and several other CMT gene
    products act in the same pathway, which is the argument for its relevance
    here.

    But the inference is not demonstrated in neurons. Two observations
    complicate it. In transfected cells LRSAM1 localises to a perinuclear
    compartment just beyond the Golgi and shows little colocalisation with
    endosome-to-lysosome trafficking machinery, which the authors take as a
    reason to consider other cellular mechanisms. And in patient lymphoblasts
    carrying p.Cys694Tyr, TSG101 protein levels were unchanged. This node is
    therefore curated as an inferred step, not an established one.
  cellular_components:
  - preferred_term: endosome
    term:
      id: GO:0005768
      label: endosome
  biological_processes:
  - preferred_term: endosome organization
    modifier: ABNORMAL
    term:
      id: GO:0007032
      label: endosome organization
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:15256501
    reference_title: "Tal, a Tsg101-specific E3 ubiquitin ligase, regulates receptor endocytosis and retrovirus budding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We report a novel protein, Tal (Tsg101-associated ligase), whose RING finger is necessary for multiple monoubiquitylation of Tsg101."
    explanation: >-
      Establishes the substrate relationship and that the RING finger is what
      carries it out. This is the paper that makes TSG101 the substrate the
      disease chain runs through, and LRSAM1 was named Tal in it.
  - reference: PMID:33568173
    reference_title: "LRSAM1 and the RING domain: Charcot-Marie-Tooth disease and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Strikingly, TSG101 remains the only known ubiquitination target hampering our mechanistic understanding of the role of LRSAM1 in the cell."
    explanation: >-
      States that the substrate list is a list of one, which is the reason
      this node is confident about the substrate and not about the pathway.
  - reference: PMID:23519028
    reference_title: "Loss of the E3 ubiquitin ligase LRSAM1 sensitizes peripheral axons to degeneration in a mouse model of Charcot-Marie-Tooth disease."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: "In transfected cells, LRSAM1 primarily localizes in a perinuclear compartment immediately beyond the Golgi and shows little colocalization with components of the endosome to lysosome trafficking pathway, suggesting that other cellular mechanisms also merit consideration."
    explanation: >-
      A localisation result that does not support the endosomal reading of
      this node. Graded NO_EVIDENCE rather than REFUTE because it bears on
      where the protein sits, not on whether TSG101 ubiquitylation matters,
      and the authors present it as a reason to look elsewhere rather than as
      a refutation.
  - reference: PMID:27686364
    reference_title: "Charcot-Marie-Tooth disease type 2G redefined by a novel mutation in LRSAM1."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: "we demonstrated in patients' lymphoblasts that the mutation does not influence overall protein levels of LRSAM1, nor of its ubiquitylation target TSG101"
    explanation: >-
      Patient-cell evidence that the disease allele does not change TSG101
      abundance. It does not settle whether TSG101 ubiquitylation state
      changes, so it is recorded as bearing on the node without contradicting
      it.
  downstream:
  - target: Increased Vulnerability of Long Peripheral Axons
    description: >-
      Perturbed neuronal proteostasis and membrane traffic, inferred rather
      than demonstrated in neurons.
    hypothesis_groups:
    - lrsam1_ubiquitylation_failure

- name: Increased Vulnerability of Long Peripheral Axons
  biological_scale: CELLULAR
  description: >
    The node that carries the length-dependence, and the one the mouse model
    speaks to most directly. Lrsam1 is abundantly expressed in peripheral
    motor and sensory neurons. Mutant mice, homozygous or heterozygous, have
    largely normal neuromuscular performance and only a very mild age-related
    neuropathy - so loss of the ligase is not sufficient to degenerate a mouse
    axon on its own. It does, however, lower the threshold: mutant mice are
    more sensitive than controls to acrylamide, a neurotoxin that causes axon
    degeneration, which the authors read as showing the axons are compromised.

    A transcriptomic observation points the same way from the human side.
    Patient cells carrying p.Cys694Tyr upregulate TNFRSF21, a key regulator of
    axonal degeneration, alongside the E3 ligase NEDD4L.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  locations:
  - preferred_term: peripheral nervous system
    term:
      id: UBERON:0000010
      label: peripheral nervous system
  evidence:
  - reference: PMID:23519028
    reference_title: "Loss of the E3 ubiquitin ligase LRSAM1 sensitizes peripheral axons to degeneration in a mouse model of Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lrsam1 mutant mice are more sensitive to challenge with acrylamide, a neurotoxic agent that causes axon degeneration, indicating that the axons in the mutant mice are indeed compromised"
    explanation: >-
      The sensitisation result, which is the primary evidence that losing
      LRSAM1 makes axons vulnerable rather than sick.
  - reference: PMID:23519028
    reference_title: "Loss of the E3 ubiquitin ligase LRSAM1 sensitizes peripheral axons to degeneration in a mouse model of Charcot-Marie-Tooth disease."
    supports: SUPPORT

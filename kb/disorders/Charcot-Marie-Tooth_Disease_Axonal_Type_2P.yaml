    fidelity: LOW
    description: >-
      Largely normal neuromuscular performance contrasts with symptomatic human distal weakness despite
      mild age-related nerve pathology.
    limitations: >-
      Differences in species, lifespan, axon length and allelic mechanism may contribute; their relative
      effects have not been established.
    evidence:
    - reference: PMID:23519028
      reference_title: "Loss of the E3 ubiquitin ligase LRSAM1 sensitizes peripheral axons to degeneration in a mouse model of Charcot-Marie-Tooth disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both homozygous and heterozygous mice have largely normal neuromuscular performance and only a very mild neuropathy phenotype with age."
      explanation: >-
        The negative result, quoted directly. It is the reason this link is FAILS_TO_RECAPITULATE rather
        than a weak positive.


- name: Increased Vulnerability of Long Peripheral Axons
  biological_scale: CELLULAR
  description: >-
    Human CMT2P is an axonal motor and sensory neuropathy. Lrsam1-mutant mice have largely normal neuromuscular
    performance with mild age-related motor axon loss, and show enhanced acrylamide-induced degeneration
    in the motor femoral branch. The sensory branch is acrylamide-sensitive without an additional Lrsam1
    genotype effect. These findings support compromised axonal maintenance, but do not establish a human
    toxic-exposure mechanism or explain every dominant allele. NEDD4L and TNFRSF21 transcript increases
    in p.Cys694Tyr lymphoblasts are ancillary observations, not proof of a causal axon-death pathway.

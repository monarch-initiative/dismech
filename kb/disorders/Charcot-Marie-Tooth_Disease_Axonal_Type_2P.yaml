- name: Disrupted LRSAM1 Interaction with RNA-Binding Proteins
  biological_scale: MOLECULAR
  description: >-
    The p.Cys694Arg variant disrupts LRSAM1 binding to FUS and G3BP1 in patient fibroblasts and engineered
    cells. These findings establish altered protein interactions in these systems; they do not establish
    a defect shared by all LRSAM1 alleles.
  evidence:
  - reference: PMID:27615052
    reference_title: A novel missense mutation of CMT2P alters transcription machinery.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: FUS antibodies pulled down LRSAM1 from nuclear proteins of normal fibroblasts but failed to pull down Cys694Arg LRSAM1 from fibroblasts of patients with CMT2P. A disruption of protein-protein interaction was also observed between Cys694Arg LRSAM1 and G3BP1
    explanation: >-
      Co-immunoprecipitation documents both interaction defects.
  downstream:
  - target: Reduced Nuclear RNA-Binding Proteins
    description: >-
      Loss of these interactions is associated with reduced nuclear RNA-binding proteins in Cys694Arg
      cells.
    hypothesis_groups:
    - lrsam1_cellular_homeostasis
- name: Reduced Nuclear RNA-Binding Proteins
  biological_scale: CELLULAR
  description: >-
    Cys694Arg patient fibroblasts have reduced nuclear FUS, G3BP1 and TDP43. TDP43 interacts with FUS,
    not directly with LRSAM1. Altered RNA processing is a proposed downstream consequence; causal mediation
    of axonal degeneration has not been established.
  evidence:
  - reference: PMID:27615052
    reference_title: A novel missense mutation of CMT2P alters transcription machinery.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These changes were associated with a decrease of nuclear FUS and G3BP1 levels in CMT2P fibroblasts

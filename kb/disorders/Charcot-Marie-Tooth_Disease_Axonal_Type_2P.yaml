- name: Perinuclear Aggregation of Mutant LRSAM1
  biological_scale: CELLULAR
  description: >-
    RING-mutant LRSAM1 formed perinuclear aggregates in acute overexpression models. The 2026 study also
    examined patient fibroblasts, but many assays used engineered cell lines, and the membrane-fractionation
    experiment used the artificial RING-dead C675A substitution. These results do not establish aggregate-driven
    degeneration in human nerves.

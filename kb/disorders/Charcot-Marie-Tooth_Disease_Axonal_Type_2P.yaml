diagnosis:
- name: Nerve conduction studies and electromyography
  description: >-
    Nerve conduction studies typically show reduced sensory and motor response amplitudes with normal
    or mildly reduced velocities. Needle EMG can demonstrate distal denervation. This supports an axonal
    neuropathy but does not identify LRSAM1 specifically.
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical and electrophysiological data confirm a late-onset axonal neuropathy with a predominance of sensorimotor impairment."
    explanation: >-
      Establishes the electrophysiological phenotype the test is looking for.

  - reference: PMID:27615052
    reference_title: A novel missense mutation of CMT2P alters transcription machinery.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sensory nerve action potential (SNAP) in legs was absent in all cases. SNAP amplitudes in arms were decreased in all cases.
    explanation: >-
      Findings in the six examined patients.
  - reference: PMID:27615052
    reference_title: A novel missense mutation of CMT2P alters transcription machinery.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: severely decreased amplitudes of compound muscle action potentials (CMAP) but showed completely normal conduction velocities in the ulnar nerves.
    explanation: >-
      Axonal motor electrophysiology in two described patients.
- name: Lower-limb muscle MRI
  description: >-
    Lower-limb muscle MRI demonstrated fatty atrophy in clinical and subclinical p.Cys694Tyr carriers.
    It can support assessment in a known family but is not a specific molecular diagnostic test.
  evidence:
  - reference: PMID:27686364
    reference_title: "Charcot-Marie-Tooth disease type 2G redefined by a novel mutation in LRSAM1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging (MRI) of lower-limb musculature systematically showed fatty atrophy in clinical and subclinical mutation carriers."
    explanation: >-
      The finding and its extension to subclinical carriers, which is what makes the test diagnostically
      useful beyond confirming clinical disease.

- name: LRSAM1 sequencing within a multigene neuropathy panel
  description: >-
    A pathogenic or likely pathogenic LRSAM1 variant consistent with the inheritance pattern and phenotype
    establishes the molecular diagnosis. Neuropathy panels should be checked for LRSAM1 coverage. Interpret
    missense, in-frame and premature-stop alleles with segregation and functional evidence; NMD prediction
    alone does not establish pathogenicity. A variant of uncertain significance is not diagnostic.
  evidence:
  - reference: PMID:33414056
    reference_title: "Location matters - Genotype-phenotype correlation in LRSAM1 mutations associated with rare Charcot-Marie-Tooth neuropathy CMT2P."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to variable inheritance patterns and clustering of pathogenic variants in 3´-prime exons, interpretation of genetic variants in LRSAM1 is challenging."
    explanation: >-
      States the interpretive problem that makes this more than a routine panel result.

  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Given the complexity of interpreting genetic test results and their implications for genetic counseling, health care providers should consider referral to a neurogenetics center or a genetic counselor specializing in neurogenetics
    explanation: >-
      Current CMT diagnostic guidance emphasizes expert interpretation.
    directness: INDIRECT
discussions:
- discussion_id: lrsam1_substrate_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired TSG101-Dependent Endosomal Sorting
  prompt: >-
    Which LRSAM1 ubiquitylation substrates matter in peripheral axons, and how does losing their ubiquitylation
    cause axonal degeneration?
  rationale: >-
    TSG101 ubiquitylation is established experimentally, but its causal role in axon degeneration is unresolved.
    RNA-binding-protein interactions and the 2026 protein-localization findings provide alternative routes.
    Endosomal, nuclear and lipid-droplet phenotypes need comparison in disease-relevant human neurons.
  proposed_experiments:
  - experiment_id: lrsam1_neuronal_ubiquitylome
    name: Ubiquitylation proteomics in LRSAM1-deficient human neurons
    description: >-
      Compare the ubiquitylome of iPSC-derived motor and sensory neurons carrying dominant-negative and
      loss-of-function LRSAM1 alleles against isogenic controls, to identify substrates whose ubiquitylation
      depends on LRSAM1 in the cell type the disease affects.
    would_support:
    - pathophysiology#Impaired TSG101-Dependent Endosomal Sorting
    supporting_outcome:
    - >-
      TSG101 ubiquitylation is reduced in mutant neurons, together with other substrates in endosomal
      sorting, supporting the pathway as curated.
    refuting_outcome:
    - >-
      Unchanged TSG101 ubiquitylation with reproducible defects in other substrates would weaken the proposed
      endosomal mechanism in the tested neurons.
- discussion_id: lrsam1_mouse_severity_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Lrsam1 mutant mouse
  - pathophysiology#Increased Vulnerability of Long Peripheral Axons
  prompt: >-
    Why does complete loss of Lrsam1 leave a mouse with almost no neuropathy while loss or dominant-negative
    disruption of LRSAM1 causes a progressive neuropathy in people?
  rationale: >-
    Gene-trap mice have mild spontaneous neuropathy and enhanced motor-axon vulnerability to challenge;
    zebrafish morphants instead show developmental defects. Allelic mechanism, species, lifespan and axon
    length may contribute to differences from human disease.
  proposed_experiments:
  - experiment_id: lrsam1_dominant_negative_knockin_mouse
    name: Knock-in mouse carrying a human dominant-negative LRSAM1 allele
    description: >-
      Introduce a human RING-domain frameshift such as p.Leu708Argfs*28 into the mouse germline and compare
      its spontaneous neuropathy with the existing Lrsam1 loss-of-function mutant, ageing both cohorts.
    would_support:
    - pathophysiology#Altered Dominant LRSAM1 RING-Domain Protein
    supporting_outcome:
    - >-
      Greater spontaneous neuropathy in the dominant-allele knock-in would support an allelic contribution
      to the model mismatch.
    refuting_outcome:
    - >-
      An equally mild knock-in phenotype would fail to support an allelic explanation in that model; it
      would not establish axon length or lifespan as the cause, or rule out all mouse models.
- discussion_id: lrsam1_parkinsonism_association
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Nigrostriatal Dopaminergic Dysfunction
  - mechanistic_hypotheses#lrsam1_cns_parkinsonism_extension
  prompt: >-
    Is late-onset parkinsonism part of the LRSAM1 phenotype, and if so what connects a peripheral-axon
    ligase defect to substantia nigra neurons?
  rationale: >-
    The original generation-specific Dutch cluster and subsequent cases justify systematic study, but
    do not establish an excess risk or a causal mechanism. Prospective ascertainment across LRSAM1 cohorts
    and comparison with age-matched controls are needed before treating parkinsonism as an expected disease
    feature.
experimental_models:
- name: Cys694Arg LRSAM1 in Lrsam1-null NSC34 cells
  experimental_model_type: CELL_LINE
  cell_source: Mouse motoneuron-like NSC34 line with CRISPR/Cas9 depletion of endogenous Lrsam1
  publication: PMID:27615052
  description: >-
    Reconstitution with human Cys694Arg LRSAM1 increased axonal beading relative to wild-type LRSAM1.
  modeled_mechanisms:
  - target: Increased Vulnerability of Long Peripheral Axons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mutant-expressing cells developed increased axonal beading.
    limitations: >-
      Engineered expression in a transformed mouse line does not reproduce the endogenous heterozygous
      human genotype or prove that RNA-binding-protein changes mediate degeneration.
    evidence:
    - reference: PMID:27615052
      reference_title: A novel missense mutation of CMT2P alters transcription machinery.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Percentage of abnormal axons was drastically increased in Cys694Arg cells, compared with that in wild-type cells
      explanation: >-
        Direct cell-model degeneration readout.

- name: Fenfluramine (Investigational for CDD)
  description: 'The 2026 AAN GEMZ conference abstract reports a positive phase 3 CDD result: median countable motor seizure frequency changed −47.6% with fenfluramine versus −2.8% with placebo in 86 participants in the modified intention-to-treat analysis. These are preliminary conference results, with full trial publication still needed for appraisal. The cached October 2025 US label covers Dravet and Lennox-Gastaut syndromes, not CDD. Valvular heart disease and pulmonary arterial hypertension require echocardiographic monitoring under the prescribing program.'

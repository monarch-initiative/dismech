genetic:
- name: CDKL5
  gene_term:
    preferred_term: CDKL5
    term:
      id: hgnc:11411
      label: CDKL5
  relationship_type: CAUSATIVE
  notes: >-
    Pathogenic coding missense, truncating, splice and structural variants can reduce CDKL5 abundance or function. Interpretation must use the brain-relevant transcript, including NM_001323289; variants near the C terminus and missense variants outside the kinase domain require particular care. Certain noncoding exon/5-prime UTR deletions reduce expression, but overlap alone does not establish pathogenicity. Female X-inactivation and postzygotic mosaicism modify severity. Kinase activity and scaffold functions need separate functional evaluation.
  evidence:
  - reference: PMID:38603524
    reference_title: "CDKL5 Deficiency Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the severity of the phenotype can vary depending on the type and position of the CDKL5 pathogenic variant, pattern of X-chromosome inactivation in females, and presence of postzygotic mosaicism"
    explanation: >-
      GeneReviews documents the genotype and X-inactivation determinants of CDD severity.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:39205479
    reference_title: Deletions in the CDKL5 5' untranslated region lead to CDKL5 deficiency disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: On internal variant reclassification, 5 of the 15 variants identified in this cohort only reached American College of Medical Genetics classification of variant of uncertain significance.
    explanation: The noncoding deletion series does not justify classifying every overlapping deletion as pathogenic.
diagnosis:
- name: CDKL5 Molecular Genetic Testing
  description: >-
    Diagnosis requires suggestive clinical findings and a pathogenic or likely pathogenic CDKL5 variant, heterozygous in females or hemizygous in males; mosaic cases also occur. A variant of uncertain significance alone does not establish the diagnosis. Epilepsy panels or genomic testing should assess coding variants, copy-number changes and relevant transcript coverage.
  evidence:
  - reference: PMID:38603524
    reference_title: "CDKL5 Deficiency Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of CDD is established in a female proband with suggestive clinical findings and a heterozygous CDKL5 pathogenic variant identified by molecular genetic testing."
    explanation: >-
      GeneReviews establishes molecular genetic testing for a CDKL5 pathogenic variant as the confirmatory diagnostic method.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK602610/?report=reader
    reference_title: CDKL5 Deficiency Disorder - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: variant of uncertain significance does not establish or rule out the diagnosis.
    explanation: Clinical variant interpretation is necessary; finding a rare sequence change is insufficient.
- name: Expanded Genomic and Mosaicism Assessment
  description: If initial testing is unrevealing, review CNV detection, depth for mosaicism, and coverage of the brain-relevant transcript and noncoding regions. Genome sequencing can detect some variants missed by exome or older targeted testing.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK602610/?report=reader
    reference_title: CDKL5 Deficiency Disorder - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Unlike exome sequencing, genome sequencing can identify variants outside of the coding region, large deletions, and rearrangements.
    explanation: GeneReviews identifies the additional variant classes assessable by genome sequencing.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK602610/?report=reader
    reference_title: CDKL5 Deficiency Disorder - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: the depth of sequencing may determine the yield of molecular diagnostic testing using these panels.
    explanation: Low-level mosaicism affects test sensitivity.
- name: Electroencephalographic Assessment
  description: EEG and, when needed, prolonged video EEG characterize evolving seizures and distinguish uncertain spells. Normal early EEG or absence of hypsarrhythmia does not exclude CDD.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK602610/?report=reader
    reference_title: CDKL5 Deficiency Disorder - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: EEG features may be normal in early infancy but subsequently evolve to abnormal background activity that can include a Lennox-Gastaut pattern.
    explanation: EEG appearance changes with age and is not by itself a definitive molecular diagnosis.
- name: Brain MRI
  description: MRI evaluates alternative causes and associated structural changes. Early scans can be normal, while later cortical or cerebellar atrophy is nonspecific.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK602610/?report=reader

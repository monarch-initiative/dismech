  downstream:
  - target: Neuronal Network Hyperexcitability
    description: Specific combinations of synaptic and channel changes can produce excessive firing and synchrony; this outcome depends on model and maturation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Neuronal Network Hyperexcitability
  description: Patient-derived cortical organoids dissociated for multielectrode-array assays show increased synchrony and firing during early network maturation. NGN2-induced neurons do not show the same phenotype, and later cortical cultures lose the clear genotype effect. Human epilepsy cannot be inferred from every culture readout.

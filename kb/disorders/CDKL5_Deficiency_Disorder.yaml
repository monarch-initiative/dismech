    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: CDKL5 undergoes liquid–liquid phase separation (LLPS) in vitro and in cultured neurons, forming cocondensates with PSD95.
    explanation: Reconstitution and cultured-neuron assays establish a scaffold mechanism distinct from substrate phosphorylation.
  role: mediator
  downstream:
  - target: Impaired Dendritic Spine Plasticity
    description: Altered condensate organization impairs Kalirin7 recruitment and activity-dependent spine remodeling.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Impaired Dendritic Spine Plasticity
  description: CDKL5-dependent postsynaptic organization supports Kalirin7 recruitment and activity-dependent spine enlargement. Experiments with LLPS-deficient constructs impair these processes; CA1 delivery of wild-type CDKL5 rescues slice long-term potentiation more effectively than the engineered phase-separation mutant.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:41706882
    reference_title: CDKL5 modulates the plasticity of excitatory synapses via liquid-liquid phase separation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT

discussions:
- discussion_id: gap_cdkl5_substrate_to_phenotype_causality
  prompt: >-
    Which CDKL5 phosphorylation substrate(s) and downstream event(s) are
    causally responsible for the epilepsy versus the developmental, movement,
    and visual features of CDD, and are the disease-relevant events the
    microtubule substrates (MAP1S, EB2, ARHGEF2) or activity-dependent synaptic
    targets?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of CDKL5 Kinase Activity in Neurons
  - pathophysiology#Impaired Dendritic Spine and Synapse Development
  rationale: >-
    CDKL5 phosphorylates a small set of neuronal substrates, with the
    best-established being the microtubule regulators MAP1S, EB2, and ARHGEF2,
    and additional evidence for activity-dependent (NMDAR-linked) synaptic
    roles. Which specific phospho-events drive which arm of the phenotype is
    unresolved. Because a substrate-replacement or downstream-target therapy
    would need to know which event to correct, mapping substrate to phenotype is
    a rate-limiting question for mechanism-based treatment, distinct from gene
    replacement of CDKL5 itself.
  evidence:
  - reference: PMID:30266824
    reference_title: "Chemical genetic identification of CDKL5 substrates reveals its role in neuronal microtubule dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EB2 phosphorylation is reduced in patient-derived human neurons."
    explanation: >-
      Establishes human-relevant CDKL5 substrates but does not resolve which
      phospho-event causes which clinical feature, which is the open question.
  proposed_experiments:
  - experiment_id: exp_cdkl5_substrate_phenotype_dissection
    name: Substrate-specific rescue in CDKL5-deficient human neurons
    description: >-
      In CDKL5-null patient iPSC-derived neurons and cortical organoids,
      selectively restore individual phospho-events (phosphomimetic substrates
      or substrate-targeted manipulation) and test which one normalizes network
      excitability versus dendritic and synaptic maturation readouts.
    experiment_type:
      preferred_term: substrate-specific rescue experiment
    readouts:
    - name: Network excitability versus maturation
      target: pathophysiology#Impaired Dendritic Spine and Synapse Development
      biological_processes:
      - preferred_term: Dendritic spine development
        term:
          id: GO:0060996
          label: dendritic spine development
        modifier: DECREASED
      assays:
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: CDKL5-corrected isogenic neurons
      description: Isogenic CDKL5-restored neurons as the normalization reference.
    decision_criterion: >-
      A substrate is implicated in a given phenotype arm if restoring only its
      phosphorylation normalizes that readout (excitability vs maturation) in
      CDKL5-null human neurons.
    would_support:
    - pathophysiology#Impaired Dendritic Spine and Synapse Development

- discussion_id: gap_cdkl5_reversibility_treatment_window
  prompt: >-
    Can restoring CDKL5 after symptom onset reverse established disease, and what
    is the developmental window during which CDKL5 gene-replacement or
    reactivation is effective in humans?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Dendritic Spine and Synapse Development
  - pathophysiology#Early-Onset Intractable Epilepsy
  rationale: >-
    Preclinical AAV9-delivered CDKL5 gene replacement restores substrate
    phosphorylation and reduces pathology and aberrant behavior in mouse models,
    raising the prospect of a disease-modifying therapy. Whether reintroducing
    CDKL5 after the early-postnatal period reverses established circuit and
    developmental deficits in humans, and how wide the therapeutic window is,
    remains unknown. This is decisive for the design and timing of the gene- and
    protein-replacement therapies now in development.
  evidence:
  - reference: PMID:39033321
    reference_title: "Preclinical studies of gene replacement therapy for CDKL5 deficiency disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CDKL5 is a serine/threonine kinase that is critical for axon outgrowth and dendritic morphogenesis as well as synapse formation, maturation, and maintenance."
    explanation: >-
      Frames CDKL5 as required for developmental processes largely completed
      early in life, which is why the reversibility window is the open question
      for gene-replacement therapy.
  proposed_experiments:
  - experiment_id: exp_cdkl5_reactivation_timing
    name: Timed CDKL5 reactivation in a conditional model
    description: >-
      Using a conditional CDKL5 reactivation model, restore CDKL5 at a graded
      set of ages spanning before and after symptom onset, and measure reversal
      of seizure susceptibility, visual evoked responses, and behavioral and

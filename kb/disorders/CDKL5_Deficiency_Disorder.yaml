- name: Disrupted Cortical Excitation-Inhibition Balance
  description: CDKL5 loss alters excitatory and inhibitory circuitry in a cell-type-, brain-region- and developmental-context-dependent manner. Interneuron-specific deletion can enhance excitatory transmission without reducing inhibition; other conditional models differ. A uniform shift toward excitation in every neuron is not established.
  biological_scale: TISSUE

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: ZTALMY is indicated for the treatment of seizures associated with cyclin-dependent kinase-like 5 (CDKL5) deficiency disorder (CDD) in patients 2 years of age and older.
    explanation: The August 2025 US prescribing information establishes the disease and age indication.
  - reference: PMID:35429480
    reference_title: 'Safety and efficacy of ganaxolone in patients with CDKL5 deficiency disorder: results from the double-blind phase of a randomised, placebo-controlled, phase 3 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Ganaxolone significantly reduced the frequency of CDD-associated seizures compared with placebo and was generally well tolerated.
    explanation: The prespecified primary outcome was major motor seizure frequency, not a percentage of patients responding.

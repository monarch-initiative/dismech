- name: Ketogenic Diet Therapy
  description: A supervised ketogenic diet can reduce seizures in some individuals with CDD, but response varies and long-term continuation is often limited. A monogenic-epilepsy meta-analysis reported no seizure freedom among 40 CDKL5 cases; this is not a universal ceiling, because individual reports document temporary or prolonged remission. A review statement of 50% seizure reduction does not mean 50% of patients responded.

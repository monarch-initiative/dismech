- name: NCT05558371
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: International CDKL5 clinical research network natural-history study; observational outcomes are distinct from intervention trials.
  notes: Recruitment status checked against ClinicalTrials.gov on 2026-10-01.
  evidence:
  - reference: clinicaltrials:NCT05558371
    reference_title: Multi-Site Validation of Biomarkers and Core Clinical Outcome Measures for Clinical Trials Readiness in CDKL5 Deficiency Disorder
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Pathogenic variants in the Cyclin-dependent kinase like 5 (CDKL5) gene cause CDKL5 deficiency disorder (CDD, MIM 300672, 105830), a severe developmental and epileptic encephalopathy associated with cognitive and motor impairments and cortical visual impairment. While capability for disease modifying therapies is accelerating, there is a critical barrier for clinical trial readiness that may result in failure of these therapies, not due to lack of efficacy but due to lack of validated outcome measures and biomarkers. The measures and biomarkers validated here will be adaptable to other developmental and epileptic encephalopathies.
    explanation: The registry summary establishes the study purpose; status was checked against the live structured registry record.
notes: CDD refers here to the loss-of-function developmental disorder; CDKL5 duplications or gain-of-function presentations may have a different clinical spectrum. Clinical severity and epilepsy course do not define established discrete subtypes. Early normal EEG or MRI does not exclude CDD. The ganaxolone full-text evidence URL is the accepted manuscript of PMID:35429480 in UCL Discovery, including supplemental eligibility and outcome tables; URL cache titles retain the generated source identifier. FDA label and AAN abstract URLs identify regulatory guidance and preliminary conference evidence respectively.
experimental_models:
- name: Patient-Derived Cortical Organoid Neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:40930428
  cell_source: Three patient/isogenic iPSC pairs, two male and one female, differentiated as guided cortical organoids and dissociated for assays
  description: Cortically specified cultures show early increases in firing and synchrony and reduced pEB2. Isogenic comparators came from mosaic or X-inactivation-defined clones; this is not a uniform CRISPR-corrected design. The network phenotype is clearest at days 17–28 and becomes inconsistent after day 30.
  modeled_mechanisms:
  - target: Neuronal Network Hyperexcitability
    description: Captures an early cortical network readout.
    evidence:
    - reference: PMID:40930428
      reference_title: Excitatory cortical neurons from CDKL5 deficiency disorder patient-derived organoids show early hyperexcitability not identified in neurogenin2 induced neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: patient-derived neurons from the organoid differentiation showed increased synchrony and weighted mean firing rate on the multielectrode array within the first month of network maturation
      explanation: MEA shows a time-limited network phenotype.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Dissociated culture activity is not clinical epilepsy; donor, clone, maturity and protocol influence the result.
    fidelity: MODERATE
- name: NGN2-Induced Patient Neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:40930428
  cell_source: Two male patient/isogenic iPSC pairs induced with NGN2
  description: pEB2 is reduced, but these cultures have poor cortical specification and show no detected network or neurite-length difference. They remain useful for selected biochemical readouts while failing to reproduce the cortical network phenotype under the tested conditions.
  modeled_mechanisms:
  - target: Neuronal Network Hyperexcitability
    description: The tested NGN2 cultures lack the observed cortical-network phenotype.
    evidence:
    - reference: PMID:40930428
      reference_title: Excitatory cortical neurons from CDKL5 deficiency disorder patient-derived organoids show early hyperexcitability not identified in neurogenin2 induced neurons.
      supports: NO_EVIDENCE
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Induced neurons showed no detectable differences between cases and isogenic controls in network activity using a multielectrode array
      explanation: A negative functional result limits this protocol for the linked mechanism.
    relationship: FAILS_TO_RECAPITULATE
    model_scale: CELLULAR
    limitations: Negative results concern this differentiation protocol and maturation window, not every possible use of NGN2 neurons.
    fidelity: LOW
  - target: Reduced EB2 Phosphorylation
    description: Provides a biochemical activity readout.
    evidence:
    - reference: PMID:40930428
      reference_title: Excitatory cortical neurons from CDKL5 deficiency disorder patient-derived organoids show early hyperexcitability not identified in neurogenin2 induced neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Patient-derived neurons from both differentiation paradigms had decreased phosphorylated EB2
      explanation: The phosphorylation deficit is shared despite differing electrophysiology.
    relationship: MEASURES
    model_scale: CELLULAR
    limitations: A biochemical phenotype alone does not establish network or clinical fidelity.
    fidelity: MODERATE
- name: R550Ter Patient iPSC Base-Editing Rescue
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:41963441
  cell_source: Female OR00005 mutant-active-X iPSCs, OR00006 wild-type-active-X comparator and selected ABE-corrected clones, differentiated with NGN2
  description: Adenine base editing corrected c.1648C>T in 2 of 24 selected iPSC colonies before neuronal differentiation. CDKL5 and pEB2 were restored with partial morphological and transcriptional rescue. Mutant neurons had longer, less-branched neurites. Eight predicted off-target sites were assayed; this does not establish genome-wide safety or editing of mature neurons.
  modeled_mechanisms:
  - target: Reduced EB2 Phosphorylation
    description: Genetic correction restores the substrate readout.
    evidence:
    - reference: PMID:41963441
      reference_title: Base editing restores CDKL5 expression and rescues neuronal deficits in a patient-derived model of CDKL5 deficiency disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: ABE-correction restored EB2 Ser223 phosphorylation to nearly Control levels
      explanation: Correction restores a validated biochemical endpoint.
    relationship: RESCUES
    model_scale: CELLULAR
    limitations: Clone/X-inactivation differences remain; no clinical seizure efficacy, postmitotic delivery or comprehensive off-target safety was tested.
    fidelity: MODERATE
- name: MAP1S Microtubule Dynamics and Rescue Assays
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:30266824
  cell_source: Embryonic wild-type and Cdkl5-null cortical neurons, plus recombinant binding assays
  description: EB3 imaging shows prolonged growth lifetime/distance; MAP1S knockdown rescues lifetime whereas EB2 knockdown does not. Putative MAP1S Ser786/812Asp phosphomimetics fail to reproduce phosphorylation-dependent dissociation.
  modeled_mechanisms:
  - target: Prolonged Dendritic Microtubule Growth
    description: Directly measures and manipulates dendritic growth dynamics.
    evidence:
    - reference: PMID:30266824
      reference_title: Chemical genetic identification of CDKL5 substrates reveals its role in neuronal microtubule dynamics.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: MAP1S knockdown rescued the increase in comet lifetime in Cdkl5 KO neurons, while EB2 knockdown had no effect
      explanation: Selective knockdown discriminates among candidate mediators.
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: Culture dynamics and TrkB transport do not by themselves establish human seizure or developmental causality.
    fidelity: MODERATE
- name: CLIP170-Dynactin and Cargo Transport Assays
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:40847610
  cell_source: CDKL5-depleted HeLa/COS7 cells and embryonic Cdkl5-null hippocampal cultures
  description: WT and kinase-dead A40V restore dynactin recruitment. Pregnenolone at 1 micromolar rescues complex association and cargo movement in culture; it is distinct from clinical ganaxolone treatment.
  modeled_mechanisms:
  - target: Impaired CLIP170-Dynactin Association
    description: Tests a kinase-independent structural function.
    evidence:
    - reference: PMID:40847610
      reference_title: CDKL5 regulates the initiation of retrograde axonal transport through CLIP170-dynactin complex formation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: the re-expression of both CDKL5-WT and CDKL5-A40V restored the localization of p150glued
      explanation: Kinase-dead rescue argues against assigning this result solely to catalytic loss.
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: Heterologous-cell complex assembly and embryonic neuron transport have not established clinical pregnenolone efficacy.
    fidelity: MODERATE
- name: Postsynaptic Condensate Reconstitution
  experimental_model_type: OTHER
  publication: PMID:41706882
  cell_source: Recombinant CDKL5 C-terminal fragments, transfected HEK293T cells and cultured hippocampal neurons
  description: Phase-separation, PSD95 binding and Kalirin7 recruitment assays test structural plasticity. K42R kinase-dead protein retains condensation. Engineered phase-separation-deficient mutants and individual patient-associated variants have different effects.
  modeled_mechanisms:
  - target: Altered Postsynaptic Condensate Organization
    description: Reconstitutes and perturbs condensate organization.
    evidence:
    - reference: PMID:41706882
      reference_title: CDKL5 modulates the plasticity of excitatory synapses via liquid-liquid phase separation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: CDKL5 undergoes liquid–liquid phase separation (LLPS) in vitro and in cultured neurons, forming cocondensates with PSD95.
      explanation: The assay measures condensate formation and recruitment.
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: Recombinant C-terminal fragments and overexpression do not establish that every CDD allele abolishes phase separation; clinical variant interpretation remains separate.
    fidelity: MODERATE
- name: Isogenic R59Ter Neuronal Phosphoproteomics
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:39136782
  cell_source: Male patient R59Ter neurons and CRISPR-corrected isogenic controls; orthogonal HEK293T validation
  description: Phosphoproteomic comparison nominated substrates; PPP1R35 Ser52 and GTF2I Ser674 were validated in heterologous assays. Endogenous neuronal antibody validation failed because of background, while GATAD2A and ZNF219 candidates were not equivalently confirmed. Their functional contribution to CDD remains unresolved.
  modeled_mechanisms:
  - target: Loss of CDKL5 Kinase Activity in Neurons
    description: Maps candidate downstream phosphorylation changes.
    evidence:
    - reference: PMID:39136782
      reference_title: Novel CDKL5 targets identified in human iPSC-derived neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: With this antibody we showed highest phosphorylation when GTF2I WT was co-expressed with CDKL5 WT, and phosphorylation levels were significantly lower when co-expressed with CDKL5 K42R
      explanation: The study combines neuronal phosphoproteomics with orthogonal substrate assays; downstream clinical causality is not established.
    relationship: MEASURES
    model_scale: CELLULAR
    limitations: Not every differential phosphosite is a direct substrate; function of the validated sites and relevance to clinical phenotypes remain open.
    fidelity: MODERATE
animal_models:
- name: Constitutive Cdkl5 Exon-4 Knockout
  species: Mus musculus
  genotype: Hemizygous males, homozygous females and heterozygous females
  publication: PMID:24838000
  description: The exon-4 deletion eliminates protein but leaves mutant RNA detectable. Adult mutants show compartment-specific arbor defects, abnormal visual responses and motor behaviors. Home-cage hypoactivity does not imply inability to move in a novel arena. Two-to-four-month-old males lacked spontaneous EEG seizures on the tested backgrounds.
  modeled_mechanisms:
  - target: Reduced Dendritic Arborization
    description: Reproduces selected adult neuronal morphology changes.
    evidence:
    - reference: PMID:24838000
      reference_title: Mapping pathological phenotypes in a mouse model of CDKL5 disorder.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Total length of apical dendritic arbors was significantly reduced
      explanation: Morphometry supports the specified neuronal readout.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: The phenotype depends on age and compartment; P20 basal arbors and other cultures need not reproduce adult apical-arbor findings.
    fidelity: MODERATE
  - target: Early-Onset Intractable Epilepsy
    description: Does not reproduce the severe early seizure syndrome in the tested adult males.
    evidence:
    - reference: PMID:24838000
      reference_title: Mapping pathological phenotypes in a mouse model of CDKL5 disorder.
      supports: NO_EVIDENCE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: did not reveal spontaneous epileptiform activity in hemizygous male Cdkl5 knockout mice
      explanation: The adult recording experiment provides a negative seizure result.
    relationship: FAILS_TO_RECAPITULATE
    model_scale: ORGANISM
    limitations: This does not extend to neonatal recordings, every conditional genotype, or older heterozygous females.
    fidelity: LOW
- name: Timed Endogenous Cdkl5 Restoration
  species: Mus musculus
  genotype: Cdkl5STOP/UBC-CreER and Cdkl5FLEX/CAGG-CreER males and heterozygous females
  publication: PMID:39855191
  description: Re-expression at six weeks reverses multiple behaviors and reduces later spasms in heterozygous females. Restoration at six months has less benefit, including no significant reduction of established female spasms and no male fear-memory rescue. Working-memory deficits persist. The STOP system leaks; the independent FLEX system controls that limitation.
  modeled_mechanisms:
  - target: Early-Onset Intractable Epilepsy
    description: Tests age-dependent rescue of the mouse seizure phenotype.
    evidence:
    - reference: PMID:39855191
      reference_title: Independent genetic strategies define the scope and limits of CDKL5 deficiency disorder reversal.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Seizure prevention is more effective with early intervention in heterozygous females but becomes limited after seizure onset.
      explanation: Timed rescue distinguishes prevention from reversal of established spasms.
    relationship: RESCUES
    model_scale: ORGANISM
    limitations: Older female spasms differ in timing from human infantile epilepsy; genetic recombination is not a clinically deliverable therapy, and early rescue does not abolish all spasms.
    fidelity: MODERATE
- name: CaV2.3 Ser15Ala Phosphosite Knock-In
  species: Mus musculus
  genotype: Homozygous and heterozygous Cacna1e Ser15Ala knock-in
  publication: PMID:38081835
  description: The phosphosite mutant prolongs channel currents and enhances cholinergic responses in slices, with partial, sex-dependent behavioral effects. Females have increased kainate susceptibility, but no spontaneous behavioral seizures were observed through forty weeks.
  modeled_mechanisms:
  - target: Prolonged CaV2.3 Current
    description: Tests one downstream phosphosite without deleting all CDKL5 functions.
    evidence:
    - reference: PMID:38081835
      reference_title: Epilepsy-linked kinase CDKL5 phosphorylates voltage-gated calcium channel Cav2.3, altering inactivation kinetics and neuronal excitability.
      supports: NO_EVIDENCE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We did not observe any spontaneous behavioural seizures in Cav2.3 S15A mice up to 40 weeks of age
      explanation: The channel mechanism has limited epilepsy fidelity despite electrophysiological changes.
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: The negative seizure result limits translation but does not refute the directly measured channel kinetics.
    fidelity: MODERATE
- name: Neonatal AAV9 CDKL5 Replacement
  species: Mus musculus
  genotype: Neonatal male Cdkl5 knockout treated with AAV9.Syn.hCDKL5
  publication: PMID:39033321
  description: Intracerebroventricular delivery improved distribution relative to intracisternal delivery. Higher doses restored pEB2 and improved selected behavioral outcomes when at least half of neurons were transduced; lower doses did not produce functional benefit.
  modeled_mechanisms:
  - target: Loss of CDKL5 Kinase Activity in Neurons
    description: Restores kinase output in a neonatal replacement model.
    evidence:
    - reference: PMID:39033321
      reference_title: Preclinical studies of gene replacement therapy for CDKL5 deficiency disorder.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: AAV9.Syn.hCDKL5 treatment increased phosphorylation of EB2, a bona fide CDKL5 substrate, demonstrating biological activity in vivo.
      explanation: The available abstract establishes biochemical rescue and dose-dependent functional effects.
    relationship: RESCUES
    model_scale: CELLULAR
    limitations: Assessment is limited to the available abstract after full-text retrieval failures; neonatal male delivery does not establish efficacy or safety in older mosaic females or humans.
    fidelity: MODERATE
- name: cdkl5sa21938 Zebrafish
  species: Danio rerio
  genotype: Homozygous nonsense mutant compared with wild-type siblings
  publication: PMID:40649845
  description: Whole-animal RNA-seq at five and thirty-five days shows changes in neuronal, skeletal, muscle and visual gene programs. Three-day Hb9:GFP motor neurons have reduced number and axon length. Transcript enrichment is not proof of direct substrate regulation or of the corresponding human symptom mechanism.
  modeled_mechanisms:
  - target: Reduced Functional CDKL5 Protein
    description: Perturbs the ortholog and measures broad transcriptional consequences.
    evidence:
    - reference: PMID:40649845
      reference_title: Transcriptomic Profiling of Zebrafish Mutant for cdkl5 Reveals Dysregulated Gene Expression Associated with Neuronal, Muscle, Visual and Skeletal Development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: cdkl5 was one of the genes found to be differentially expressed between the two groups at both stages of development.
      explanation: Reduced mutant transcript supports loss of ortholog function; protein abundance was not directly quantified here.
    relationship: PERTURBS
    model_scale: ORGANISM
    limitations: RNA comes from whole animals, not isolated brain. Tissue proportions and developmental stage can affect enrichment; early heart rate was unchanged despite cardiac pathway enrichment.
    fidelity: MODERATE
differential_diagnoses:
- name: Rett Syndrome
  disease_term:
    preferred_term: Rett syndrome
    term:

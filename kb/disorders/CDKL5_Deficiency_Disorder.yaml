    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We identified 15 females with deletions affecting the 5’ UTR region of CDKL5.
    explanation: The clinical series identifies noncoding deletions as a distinct physical alteration, with case-specific interpretation.
  role: trigger
  gene:
    preferred_term: CDKL5
    term:
      id: hgnc:11411
      label: CDKL5
  downstream:
  - target: Reduced CDKL5 Transcript Abundance
    description: Patient fibroblast RNA supports an expression consequence in three tested deletion carriers; the precise regulatory mechanism and neuronal effect remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced CDKL5 Transcript Abundance
  description: Fibroblasts from three individuals with noncoding deletions had reduced CDKL5 expression relative to controls. The major coding sequence can be preserved. These assays support a dosage effect but do not establish the same magnitude in neurons or pathogenicity of every 5-prime deletion.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:39205479
    reference_title: Deletions in the CDKL5 5' untranslated region lead to CDKL5 deficiency disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: RNA sequencing showed that all three variants were associated with reductions in CDKL5 mRNA levels (normalized expression levels of 25.6%, 17.5% and 56.7% for individuals 1, 2 and 3, respectively, relative to controls)
    explanation: RNA measurements in three patient fibroblast lines support reduced transcript abundance.
  role: mediator
  downstream:
  - target: Reduced Functional CDKL5 Protein
    description: Reduced transcript availability is expected to reduce protein production; protein and neuronal dosage require further validation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Functional CDKL5 Protein
  description: Loss of CDKL5 protein removes catalytic and structural functions. Protein depletion is directly established in knockout models and selected patient cell lines; not every pathogenic missense allele eliminates protein.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:

name: CDKL5 Deficiency Disorder
creation_date: "2026-07-17T00:00:00Z"
category: Mendelian
description: >-
  CDKL5 deficiency disorder (CDD) is an X-linked developmental and epileptic
  encephalopathy caused by loss-of-function variants in CDKL5, which encodes a
  serine/threonine protein kinase essential for neuronal maturation and synapse
  development. It is characterized by severe early-onset (usually first months
  of life), intractable epilepsy - frequently including epileptic spasms -
  together with profound developmental impairment, a complex movement disorder
  (chorea, dystonia, and stereotypies), cerebral (cortical) visual impairment,
  and autonomic disturbances. Females (heterozygous) are affected roughly four
  times as often as hemizygous males, but severity in both sexes can be
  equivalent and is modulated by variant type/position, X-chromosome
  inactivation, and postzygotic mosaicism. Nearly all cases are simplex, arising
  from a de novo CDKL5 variant.

discussions:
- discussion_id: gap_cdkl5_substrate_to_phenotype_causality
  prompt: >-
    Which catalytic substrates and kinase-independent scaffold functions account for distinct developmental, visual, movement and seizure outcomes, and which are suitable therapeutic targets?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of CDKL5 Kinase Activity in Neurons
  - pathophysiology#Impaired Dendritic Spine Plasticity
  rationale: >-
    EB2 and MAP1S have physiological phosphorylation evidence; ARHGEF2 remains less secure in vivo. CaV2.3 phosphosite experiments establish a context-dependent channel mechanism but do not reproduce spontaneous human epilepsy. Kinase-independent CLIP170/dynactin assembly and PSD95 condensate organization add distinct candidate pathways. Biomarker restoration, direct substrate validation and rescue of a disease-relevant phenotype are different claims.
  evidence:
  - reference: PMID:30266824
    reference_title: "Chemical genetic identification of CDKL5 substrates reveals its role in neuronal microtubule dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "EB2 phosphorylation is reduced in patient-derived human neurons."
    explanation: >-
      Establishes human-relevant CDKL5 substrates but does not resolve which phospho-event causes which clinical feature, which is the open question.
  - reference: PMID:30266824
    reference_title: Chemical genetic identification of CDKL5 substrates reveals its role in neuronal microtubule dynamics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: A putative phosphomimetic MAP1S-LC mutant did not act like phosphorylated MAP1S-LC
    explanation: A phosphomimetic cannot be assumed to reproduce actual phosphorylation.
  - reference: PMID:40847610
    reference_title: CDKL5 regulates the initiation of retrograde axonal transport through CLIP170-dynactin complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the re-expression of both CDKL5-WT and CDKL5-A40V restored the localization of p150glued
    explanation: Kinase-dead rescue supports a scaffold branch.
  proposed_experiments:
  - experiment_id: exp_cdkl5_substrate_phenotype_dissection
    name: Substrate-specific rescue in CDKL5-deficient human neurons
    description: >-
      Compare substrate-specific manipulations and scaffold-selective CDKL5 rescue in patient/isogenic cortically specified neurons. Verify each manipulation biochemically before measuring firing, synchrony and spine plasticity. MAP1S Ser786/812Asp previously failed to mimic phosphorylation, so it is not a validated rescue reagent. Include wild-type CDKL5, kinase-dead CDKL5, phosphorylation-deficient and scaffold-deficient controls, with matched protein abundance.
    experiment_type:
      preferred_term: substrate-specific rescue experiment
    readouts:
    - name: Network excitability versus maturation
      target: pathophysiology#Impaired Dendritic Spine Plasticity
      biological_processes:
      - preferred_term: Dendritic spine development
        term:
          id: GO:0060996
          label: dendritic spine development
        modifier: DECREASED
      assays:
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: CDKL5-corrected isogenic neurons
      description: Isogenic CDKL5-restored neurons as the normalization reference.
    - name: Biochemically validated substrate and scaffold controls
      description: Measure phosphorylation, binding and expression directly; compare matched kinase-dead and scaffold-deficient constructs rather than presuming any acidic substitution is a valid phosphomimetic.
    decision_criterion: >-
      A manipulation supports a causal contribution only if it restores the intended biochemical event and reproducibly improves a prespecified functional readout across independent donors and differentiations; rescue of pEB2 alone is insufficient.
    would_support:
    - pathophysiology#Impaired Dendritic Spine Plasticity
- discussion_id: gap_cdkl5_reversibility_treatment_window
  prompt: >-
    Can restoring CDKL5 after symptom onset reverse established disease, and what is the developmental window during which CDKL5 gene-replacement or reactivation is effective in humans?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Dendritic Spine Plasticity
  - pathophysiology#Early-Onset Intractable Epilepsy
  rationale: >-
    Post-developmental reversibility has already been demonstrated for several mouse phenotypes. Six-week endogenous restoration improves many behaviors and reduces later female spasms; six-month rescue is less effective, and working memory remains impaired. The unresolved questions are delivery, dose, mosaic coverage and human developmental timing, not whether any postnatal rescue is possible.
  evidence:
  - reference: PMID:39855191
    reference_title: Independent genetic strategies define the scope and limits of CDKL5 deficiency disorder reversal.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The working memory deficits present in both CDD models are not reversible regardless of the age of rescue or sex.
    explanation: The full study separates reversible domains from a persistent deficit.
  - reference: PMID:39855191
    reference_title: Independent genetic strategies define the scope and limits of CDKL5 deficiency disorder reversal.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Seizure prevention is more effective with early intervention in heterozygous females but becomes limited after seizure onset.
    explanation: Timing affects seizure rescue; mouse ages cannot be mapped directly to human treatment windows.
  proposed_experiments:
  - experiment_id: exp_cdkl5_reactivation_timing
    name: Delivery and mosaic-coverage comparison across treatment ages
    description: >-
      Extend the existing six-week versus six-month endogenous-restoration experiments using clinically relevant delivery, graded neuronal coverage and heterozygous female models. Compare established seizures, EEG, vision and prespecified behavioral endpoints, with vector dose and expression controlled. Include older symptomatic animals rather than interpreting neonatal prevention as reversal.
    experiment_type:
      preferred_term: timed gene-reactivation experiment
    readouts:
    - name: Reversal of deficits by restoration age
      target: pathophysiology#Early-Onset Intractable Epilepsy
      assays:
      - preferred_term: electroencephalography
      - preferred_term: behavioral assay
      direction: POSITIVE
    controls:
    - name: Never-reactivated and wild-type
      description: Matched never-reactivated mutants and wild-type controls.
    decision_criterion: >-
      An intervention supports translational reversibility only when functional benefit follows verified target engagement after symptom onset, persists longitudinally, and is separable from leaky recombination or nonspecific treatment effects.
    would_support:
    - pathophysiology#Impaired Dendritic Spine Plasticity
- discussion_id: gap_cdkl5_mouse_model_epilepsy_fidelity
  prompt: >-
    How do sex, mosaicism, age, cell-type-specific deletion and neuronal differentiation affect the epilepsy fidelity of CDKL5 models?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Network Hyperexcitability
  - pathophysiology#Early-Onset Intractable Epilepsy
  rationale: >-
    Adult constitutive-null males in early studies lacked spontaneous seizures, whereas older heterozygous females develop spasms and other seizure phenotypes. CaV2.3 phosphosite mice reproduce a selected channel defect without spontaneous epilepsy. Human cortical organoid-derived cultures show transient early hyperexcitability that is absent in NGN2-induced cultures. These comparisons define endpoint-specific model suitability rather than one universally valid or invalid CDD model.
  evidence:
  - reference: PMID:24838000
    reference_title: Mapping pathological phenotypes in a mouse model of CDKL5 disorder.
    supports: NO_EVIDENCE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: did not reveal spontaneous epileptiform activity in hemizygous male Cdkl5 knockout mice
    explanation: The negative result is age- and genotype-specific.
  - reference: PMID:39855191
    reference_title: Independent genetic strategies define the scope and limits of CDKL5 deficiency disorder reversal.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: female mice with heterozygous loss of Cdkl5 develop myoclonic and tonic-clonic seizures upon aging
    explanation: The later female phenotype prevents generalizing the adult male negative finding.
  - reference: PMID:40930428
    reference_title: Excitatory cortical neurons from CDKL5 deficiency disorder patient-derived organoids show early hyperexcitability not identified in neurogenin2 induced neurons.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Induced neurons showed no detectable differences between cases and isogenic controls in network activity using a multielectrode array
    explanation: A negative NGN2 result contrasts with the early cortical organoid-derived network phenotype.
  proposed_experiments:
  - experiment_id: exp_cdkl5_seizure_provocation_cross_model
    name: Seizure-susceptibility comparison across CDKL5 models
    description: >-
      Compare longitudinal spontaneous EEG, age-matched provoked seizure thresholds and independently measured cellular network activity across constitutive males, mosaic females, conditional knockouts and patient-derived cortical cultures. Analyze each endpoint within species and developmental stage; a culture cannot reproduce clinical seizure semiology.
    experiment_type:
      preferred_term: cross-model seizure-susceptibility experiment
    readouts:
    - name: Spontaneous and provoked epileptiform activity
      target: pathophysiology#Neuronal Network Hyperexcitability
      assays:
      - preferred_term: electroencephalography
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: Wild-type and isogenic-corrected systems
      description: Matched non-mutant references for each model system.
    decision_criterion: >-
      Validate a model for a specified endpoint when it reproducibly reproduces that endpoint with appropriate controls; distinguish spontaneous epilepsy, provoked susceptibility and cultured network activity, rather than requiring every model to reproduce the full human syndrome.
    would_support:
    - pathophysiology#Early-Onset Intractable Epilepsy
- discussion_id: gap_cdkl5_fever_association
  prompt: What explains the bidirectional association between fever and seizure frequency in CDD?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Early-Onset Intractable Epilepsy
  rationale: A retrospective Chinese survey reported decreased seizures during fever in 47/84 participants, increased seizures in 19/84 and little change in 18/84. Reporting and selection bias remain, and no mechanistic intervention was performed. This is an association requiring prospective study, not a recommendation to induce fever.
  evidence:
  - reference: PMID:42644218
    reference_title: Nationwide Survey of Association Between Fever and Epileptic Seizure in CDKL5 Deficiency Disorder Revealed Therapeutic Implications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Meanwhile, 19 (22.6%) experienced increased seizure frequency, and 18 (21.4%) showed insignificant change.
    explanation: The full text documents opposing responses, qualifying the abstract focus on reduction.

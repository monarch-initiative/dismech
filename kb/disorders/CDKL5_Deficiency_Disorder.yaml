- name: Increased Postsynaptic NMDA Receptor Abundance
  description: Forebrain GABAergic Cdkl5 deletion increases postsynaptic GluN1/GluN2B and CA1 miniature EPSC frequency without reducing miniature IPSCs. The molecular route from interneuron loss to postsynaptic receptor enrichment is unresolved; R59X knock-in mice show a partly different subunit pattern.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:

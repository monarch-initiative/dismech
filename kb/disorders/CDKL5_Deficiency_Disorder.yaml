- name: Individualized Antiseizure Medication
  description: Conventional antiseizure medications are selected according to seizure type, response and tolerability. Clobazam, lamotrigine, valproate and vigabatrin are used, but durable seizure control is often limited and there is no established universal treatment sequence. Caregiver-reported benefit and medication-use counts must not be interpreted as randomized responder rates. Polytherapy can add sedation and other adverse effects.

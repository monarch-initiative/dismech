    snippet: Whole-cell patch-clamp recordings of Cav2.3 Ba2+ currents revealed slower decay kinetics (inactivation τ) in S14A mutant channels
    explanation: Recombinant current measurements establish altered kinetics; slice responses show dependence on cholinergic stimulation.
  role: mediator
  downstream:

inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    CDD is X-linked. Approximately 99% of reported affected individuals are simplex, meaning the only known affected family member; this is not a measured 99% de novo rate. Most tested variants arise de novo, but transmission from an affected or apparently unaffected heterozygous mother and parental mosaicism are documented. X-inactivation and mosaicism modify expression; blood X-inactivation need not represent brain tissue. A heterozygous mother has a 50% chance of transmitting the variant in each pregnancy. Prenatal and preimplantation testing are possible once the familial variant is known.

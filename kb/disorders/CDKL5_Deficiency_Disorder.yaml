    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Dendritic Arborization
  description: Two-month-old knockout mice show reduced apical dendritic length and branching in cortical and hippocampal pyramidal neurons, with intermediate or bimodal effects in heterozygous females. Other ages, basal arbors and cultured neuronal protocols show smaller or absent effects.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:

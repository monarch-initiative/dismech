    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: loss of Cav2.3 phosphorylation leads to channel gain-of-function via slower inactivation and enhanced cholinergic stimulation
    explanation: Biochemical, recombinant-channel and mouse experiments connect the phosphosite to channel regulation.
  role: mediator
  downstream:
  - target: Prolonged CaV2.3 Current
    description: Loss of phosphorylation slows channel inactivation and changes muscarinic modulation.
    causal_link_type: DIRECT
- name: Prolonged CaV2.3 Current
  description: Unphosphorylated CaV2.3 has slower inactivation in recombinant channels. Phosphosite-mutant CA1 neurons show enhanced cholinergic depolarization and afterpotentials, while baseline firing and spontaneous excitatory currents are unchanged. This is a state-dependent excitability mechanism.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:

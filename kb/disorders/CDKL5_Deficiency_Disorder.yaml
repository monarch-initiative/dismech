    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Altered Postsynaptic Condensate Organization
  description: CDKL5 forms condensates with PSD95 through its intrinsically disordered region and terminal PDZ-binding motif. Kinase-dead CDKL5 retains condensation, while particular disease-associated variants alter capacity or material properties. C291Y and C30W have distinct effects, so loss of phase separation is not a universal allele mechanism.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:

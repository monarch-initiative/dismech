    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Substrate phosphorylations are greatly reduced in CDKL5 knockout mice, verifying these as physiological substrates."
    explanation: >-
      Chemical-genetic substrate mapping identified MAP1S, EB2, and ARHGEF2 as
      physiological CDKL5 substrates whose phosphorylation is lost when CDKL5 is

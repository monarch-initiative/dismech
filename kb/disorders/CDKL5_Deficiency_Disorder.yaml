inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    CDD is inherited in an X-linked manner. Approximately 99% of affected
    individuals are simplex cases resulting from a de novo (germline or, rarely,
    postzygotic) CDKL5 variant. Heterozygous females are at high risk of being
    affected; skewed X-chromosome inactivation and mosaicism produce variable
    expressivity.
  evidence:
  - reference: PMID:38603524
    reference_title: "CDKL5 Deficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDD is inherited in an X-linked manner."
    explanation: GeneReviews establishes the X-linked inheritance of CDD.
pathophysiology:
- name: CDKL5 Loss-of-Function Variant
  description: >-
    A de novo loss-of-function variant in CDKL5 (missense in the catalytic
    domain, truncating, or deletion) reduces or abolishes functional CDKL5
    protein. Because CDKL5 is X-linked, heterozygous females are mosaic for
    CDKL5 expression and hemizygous males lack a second allele. This node
    captures the single concept of the initiating genetic lesion.
  role: trigger
  gene:
    preferred_term: CDKL5
    term:
      id: hgnc:11411
      label: CDKL5
  molecular_functions:

    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: brain MRIs in 64% (n=14/22) of individuals were normal in the first year of life.
    explanation: The cited series demonstrates limited sensitivity of early MRI.
treatments:
- name: Ganaxolone (Ztalmy)
  description: Ganaxolone is a GABA-A receptor positive allosteric modulator approved in the United States for CDD-associated seizures from age two years. In the 17-week randomized Marigold trial, median major motor seizure frequency fell 30.7% versus 6.9% with placebo (101 randomized; 100 in seizure analyses). The ≥50% responder comparison was not statistically significant and no participant became seizure-free. Somnolence occurred in 36% versus 16%; dosing and interactions require specialist supervision. These findings do not establish disease modification or efficacy against every seizure type.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

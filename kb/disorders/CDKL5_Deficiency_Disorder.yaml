    reference_title: A Phase 2 Randomized, Double-Masked Placebo-Controlled Crossover Safety and Tolerability Study of Ataluren for Drug Resistant Epilepsy in Patients With Nonsense Mutation CDKL5 or Dravet Syndrome
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'This is a phase 2, crossover study of Ataluren for the treatment of nonsense mutation Dravet syndrome or cyclin-dependent kinase-like 5 (CDKL5) deficiency, resulting in drug-resistant epilepsy. Patients will receive 12 weeks of ataluren or placebo during each treatment period. Treatment Period 1 will be followed by a 4-week Washout Period. Based on ataluren PK and pharmacodynamic data, the 4-week washout period is deemed an appropriate length of time to eliminate any ataluren drug effects. Following the Washout Period, patients will crossover to receive the opposite treatment during Treatment Period 2 as follows: Patients receiving ataluren during Treatment Period 1 will receive placebo during Treatment Period 2. Patients receiving placebo during Treatment Period 1 will receive ataluren during Treatment Period 2.'
    explanation: The registry summary establishes the study purpose; status was checked against the live structured registry record.

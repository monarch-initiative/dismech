    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced substrate phosphorylation impairs the CDKL5-dependent programs for
      dendritic spine and synapse maturation.
- name: Impaired Dendritic Spine and Synapse Development
  description: >-
    CDKL5 activity is required for normal dendritic spine formation and synapse
    maturation; its loss produces abnormal spine density/morphology and
    synaptic connectivity. This node captures the single concept of the
    synaptic developmental defect that is the proximal cellular consequence.

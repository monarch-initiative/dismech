name: CDKL5 Deficiency Disorder
creation_date: "2026-07-17T00:00:00Z"
category: Mendelian
description: >-
  CDKL5 deficiency disorder (CDD) is an X-linked developmental and epileptic encephalopathy caused by pathogenic variants that reduce CDKL5 function. Severe seizures usually begin in early infancy, accompanied by developmental impairment, hypotonia, cerebral visual impairment, movement abnormalities, and sleep, gastrointestinal and autonomic problems. Rare individuals have milder development or no epilepsy. Females are diagnosed more often than males, but both sexes can be severely affected. Most affected individuals are simplex cases, commonly with a de novo variant; inherited variants and parental or postzygotic mosaicism also occur. CDKL5 has both kinase-dependent and kinase-independent neuronal functions.

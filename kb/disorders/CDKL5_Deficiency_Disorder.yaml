- name: Reduced CaV2.3 Phosphorylation
  description: CDKL5 directly phosphorylates CaV2.3 at human Ser14/mouse Ser15. Phosphorylation is reduced in knockout cortex and patient-derived neurons, although residual phosphorylation in knockout brain suggests other kinases can contribute.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL

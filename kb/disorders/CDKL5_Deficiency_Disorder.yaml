    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:38603524
    reference_title: "CDKL5 Deficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CDD is established in a female proband with suggestive clinical findings and a heterozygous CDKL5 pathogenic variant identified by molecular genetic testing."
    explanation: >-
      GeneReviews establishes the causative heterozygous CDKL5 pathogenic
      variant as the molecular basis of CDD.
  downstream:
  - target: Loss of CDKL5 Kinase Activity in Neurons
    causal_link_type: DIRECT
    description: >-
      Loss-of-function variants reduce the amount or catalytic activity of the
      CDKL5 serine/threonine kinase in neurons.
- name: Loss of CDKL5 Kinase Activity in Neurons
  description: >-
    CDKL5 is a serine/threonine protein kinase highly expressed in neurons.
    Reduced CDKL5 kinase activity lowers phosphorylation of its neuronal
    substrates. This node captures the single concept of the molecular enzymatic
    deficit.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Protein phosphorylation
    term:

  description: CDD was historically classified as an early-onset seizure variant of Rett syndrome, but it is a distinct molecular disorder. Developmental impairment and hand stereotypies can overlap.
  distinguishing_features:
  - Very early-onset seizures and cerebral visual impairment favor CDD over classic Rett syndrome.
  - Hand stereotypies in classic Rett syndrome are generally less distractible and may differ qualitatively from those in CDD.

- name: Impaired CLIP170-Dynactin Association
  description: CDKL5 depletion reduces interaction of CLIP170 with dynactin p150glued and recruitment to microtubule tips. Wild-type and kinase-dead A40V CDKL5 restore localization, supporting a structural function rather than proven phosphorylation of CLIP170.

- name: Cannabidiol
  description: Highly purified cannabidiol has preliminary CDD-specific evidence. In a prospective uncontrolled series of nine females, >50% seizure reduction occurred in 8/9 at three months, 6/9 at six months and 1/8 remaining participants at twelve months. Reported alertness or motor improvements were subjective and potentially confounded by reduction of other medications. Somnolence, rash and a mild transaminase elevation were reported. CDD-specific randomized efficacy is not established.

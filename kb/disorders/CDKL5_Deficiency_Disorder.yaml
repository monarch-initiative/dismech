pathophysiology:
- name: CDKL5 Loss-of-Function Variant
  description: Pathogenic coding or splice variants and deletions alter the CDKL5 gene. Some reduce protein abundance, while others impair catalytic or interaction properties without eliminating protein. Variants may be de novo, inherited or mosaic; loss of kinase activity does not by itself test every scaffold function.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:38603524
    reference_title: CDKL5 Deficiency Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The diagnosis of CDD is established in a female proband with suggestive clinical findings and a heterozygous CDKL5 pathogenic variant identified by molecular genetic testing.
    explanation: The molecular diagnosis establishes the initiating genetic cause, with variable downstream biochemical consequences.
  role: trigger
  gene:
    preferred_term: CDKL5
    term:
      id: hgnc:11411
      label: CDKL5
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Reduced Functional CDKL5 Protein
    description: Protein-truncating or destabilizing alleles can reduce functional protein abundance.
    causal_link_type: DIRECT
  - target: Loss of CDKL5 Kinase Activity in Neurons
    description: Catalytic-domain variants can reduce enzymatic activity even when protein remains present.
    causal_link_type: DIRECT
- name: CDKL5 Noncoding Exon Deletion
  description: Deletions involving noncoding exon 1 or alternative 5-prime exons can remove regulatory or transcript-start sequences. The 15-female series includes unresolved variants; promoter disruption, altered isoform usage and other regulatory effects must be distinguished from proven coding loss.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:

genetic:
- name: TRIP11
  association: Causal biallelic variant
  gene_term:
    preferred_term: TRIP11
    term:
      id: hgnc:12305
      label: TRIP11
  notes: >-
    Biallelic hypomorphic variants, most often a null allele in trans with a
    splice variant leaving residual GMAP-210 activity. Complete loss of the same
    gene causes achondrogenesis type 1A, so variant interpretation here must
    weigh residual function, not only pathogenicity.
  evidence:
  - reference: PMID:31903676
    reference_title: >-
      Pathogenic variants in the TRIP11 gene cause a skeletal dysplasia spectrum from odontochondrodysplasia to achondrogenesis 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two patients reported here represent the TRIP11 spectrum of skeletal dysplasia ranging from mild to lethal phenotypes, thereby enabling one to suggest a genotype-phenotype correlation in these diseases.
    explanation: >-
      Establishes the genotype-severity relationship across the TRIP11 allelic
      series.
  - reference: PMID:31903676
    reference_title: >-
      Pathogenic variants in the TRIP11 gene cause a skeletal dysplasia spectrum from odontochondrodysplasia to achondrogenesis 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is known that null mutations in TRIP11 disrupt Golgi function and cause a lethal skeletal dysplasia known as achondrogenesis type 1A (ACG1A)
    explanation: >-
      States the consequence of complete TRIP11 loss, the contrast on which
      variant interpretation rests.

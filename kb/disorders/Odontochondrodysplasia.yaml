- name: Spondylometaphyseal Dysplasia
  biological_scale: ORGANISM
  description: >-
    The expressed skeletal disease: platyspondyly and metaphyseal irregularity
    with short stature. Severity is wide - one reported adult has the mildest
    phenotype yet seen despite carrying two potentially null alleles, which the
    genotype-severity model does not currently explain.
  evidence:
  - reference: PMID:31903676
    reference_title: >-

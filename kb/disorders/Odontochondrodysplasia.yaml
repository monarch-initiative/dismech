- TRIP11-related odontochondrodysplasia
classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger,
      Ferreira, Mortier et al., PMID:36779427), Table 1 group 12
      "Spondylometaphyseal dysplasias (SMD)", row NOS 12-0020
      "Odontochondrodysplasia (ODCD), TRIP11-related" (MIM 184260, autosomal
      recessive). Achondrogenesis type 1A, the lethal null phenotype of the same
      gene, is listed in the nosology's severe spondylodysplastic group, so the
      TRIP11 allelic series spans two nosology groups by severity.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic hypomorphic TRIP11 variants. Most patients are compound
    heterozygous for a null allele and a splice variant; the splice allele is
    what leaves residual GMAP-210 activity and separates ODCD from the lethal
    null phenotype.
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that ODCD is caused by hypomorphic TRIP11 mutations, and we identify ODCD as the nonlethal counterpart to achondrogenesis 1A (ACG1A), the known null phenotype in humans.
    explanation: >-
      Establishes biallelic hypomorphic TRIP11 variants as the cause and places
      ODCD against the null phenotype.
  - reference: PMID:33746040
    reference_title: >-
      Description of four patients with TRIP11 variants expand the clinical spectrum of odontochondroplasia (ODCD) and demonstrate the existence of common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of ODCD patients are compound heterozygotes for TRIP11 variants, 12/14 have a null allele and a splice variant whilst one is homozygous for an in-frame splicing variant, with the splice variants resulting in residual GMAP activity and hypothesized to explain why they have ODCD and not ACG1A.
    explanation: >-
      Documents the recurrent null-plus-splice genotype and its proposed
      relationship to survival.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE

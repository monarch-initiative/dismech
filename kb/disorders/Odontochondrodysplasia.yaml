      The diagnostic triad on which the clinical diagnosis rests.
- name: TRIP11 sequencing with splice-variant interpretation
  description: >-
    Molecular confirmation. Interpretation must account for splice alleles that
    retain residual activity, since these are what place a patient in ODCD rather
    than achondrogenesis, and one recurrent nonsense allele has been shown by
    mRNA study to produce an in-frame deletion rather than a true null.
  results: >-
    Biallelic TRIP11 variants, typically a null allele with a splice variant.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33746040
    reference_title: >-
      Description of four patients with TRIP11 variants expand the clinical spectrum of odontochondroplasia (ODCD) and demonstrate the existence of common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The c.586C>T; p.(Gln196*) variant, previously shown by mRNA studies to result in p.Val105_Gln196del, is the most frequent variant, present in seven individuals from four families, three from different regions of the world, suggesting that it may be a variant hotspot.
    explanation: >-
      The worked example of a nonsense-looking allele whose real consequence is
      an in-frame deletion, which is why splice-aware interpretation matters.
differential_diagnoses:
- name: Achondrogenesis type 1A
  description: >-
    The lethal null phenotype of the same gene. Not so much a differential as
    the other end of one allelic series; distinguishing them is a matter of
    residual GMAP-210 activity, and the distinction is prenatal.
  distinguishing_features:
  - Perinatally lethal rather than survivable
  - Complete rather than partial loss of GMAP-210 function
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that ODCD is caused by hypomorphic TRIP11 mutations, and we identify ODCD as the nonlethal counterpart to achondrogenesis 1A (ACG1A), the known null phenotype in humans.
    explanation: >-
      States the relationship between the two disorders directly.
discussions:
- discussion_id: gap_odcd_null_alleles_mild_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a reported adult with two potentially null TRIP11 alleles have the
    mildest odontochondrodysplasia phenotype described, when the residual-activity
    model predicts the most severe?
  attaches_to:
  - pathophysiology#Hypomorphic TRIP11 Variants with Residual GMAP-210 Activity
  - pathophysiology#Cellular Achondrogenesis of the Growth Plate
  rationale: >-
    The whole genotype-severity account of the TRIP11 series rests on residual
    GMAP-210 activity: splice alleles leave some, nulls leave none, and that is
    offered as the reason patients have ODCD rather than achondrogenesis. One
    reported adult contradicts it directly. Either the alleles are not the nulls
    they appear to be - as already happened with the recurrent c.586C>T allele,
    which mRNA study showed produces an in-frame deletion - or something other
    than residual GMAP-210 abundance modifies severity. Resolving this would
    change how a TRIP11 genotype is counselled prenatally, which is the setting
    where the ODCD-versus-lethal distinction actually has to be made.
  evidence:
  - reference: PMID:33746040
    reference_title: >-
      Description of four patients with TRIP11 variants expand the clinical spectrum of odontochondroplasia (ODCD) and demonstrate the existence of common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, adult patient 4 has two potentially null alleles and it remains unknown why she has very mild clinical features.
    explanation: >-
      The reported counterexample, with the authors' own statement that it is
      unexplained.

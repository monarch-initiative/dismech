name: Odontochondrodysplasia
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Odontochondrodysplasia (ODCD) is an autosomal recessive spondylometaphyseal
  dysplasia combining vertebral and metaphyseal changes with dentinogenesis
  imperfecta. Described clinically in the 1990s, it stayed genetically
  unexplained for two decades until hypomorphic biallelic TRIP11 variants were
  identified in 2019 - the same gene whose complete loss causes the perinatally
  lethal achondrogenesis type 1A. ODCD is therefore best understood as the
  survivable end of a single TRIP11 allelic series, and the genotypes bear that
  out: most patients carry a null allele in trans with a splice variant that
  leaves residual GMAP-210 activity. TRIP11 encodes GMAP-210, a Golgi tether,
  and the proximal defect is Golgi-based rather than ciliary despite GMAP-210's
  interaction with the intraflagellar transport component IFT20. Residual
  GMAP-210 preserves Golgi integrity and bulk secretion but not glycan
  processing or proteoglycan secretion, and the chondrocyte maturation defect
  that follows is qualitatively the same as in achondrogenesis, differing in
  severity rather than in kind.
disease_term:
  preferred_term: odontochondrodysplasia
  term:

pathophysiology:
- name: Hypomorphic TRIP11 Variants with Residual GMAP-210 Activity
  biological_scale: MOLECULAR
  description: >-
    TRIP11 encodes GMAP-210, an essential tether protein of the Golgi apparatus.
    ODCD alleles reduce but do not abolish GMAP-210: a splice variant in trans
    with a null allele yields a low-abundance but partly functional protein. One
    recurrent allele, c.586C>T p.(Gln196*), is present in seven individuals from
    four families across different regions and behaves as a hotspot.
  genes:
  - preferred_term: TRIP11
    term:
      id: hgnc:12305
      label: TRIP11
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TRIP11 encodes Golgi-associated microtubule-binding protein 210 (GMAP-210), an essential tether protein of the Golgi apparatus that physically interacts with intraflagellar transport 20 (IFT20), a component of the ciliary intraflagellar transport complex B.
    explanation: >-
      Establishes the gene product and the two candidate compartments, Golgi and
      cilium, that the mechanism had to be assigned between.
  - reference: PMID:33746040
    reference_title: >-
      Description of four patients with TRIP11 variants expand the clinical spectrum of odontochondroplasia (ODCD) and demonstrate the existence of common variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The c.586C>T; p.(Gln196*) variant, previously shown by mRNA studies to result in p.Val105_Gln196del, is the most frequent variant, present in seven individuals from four families, three from different regions of the world, suggesting that it may be a variant hotspot.
    explanation: >-
      Source for the recurrent-allele observation recorded in this node.
  downstream:
  - target: Partial Golgi Dysfunction with Preserved Bulk Secretion
    description: >-
      Reduced GMAP-210 abundance is still enough to maintain Golgi architecture
      and global protein secretion, which is what distinguishes this node from
      the complete Golgi failure of the null phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In spite of reduced abundance, residual GMAP variants maintain partial Golgi integrity, normal global protein secretion, and subcellular distribution of IFT20 in ODCD.
      explanation: >-
        Patient-derived primary cell data establishing exactly what residual
        GMAP-210 preserves.
- name: Partial Golgi Dysfunction with Preserved Bulk Secretion
  biological_scale: CELLULAR
  description: >-
    The functional studies are unusually decisive about compartment: despite
    GMAP-210's physical interaction with IFT20 and the extraskeletal features
    that suggested a ciliopathy, patient-derived primary cells support a
    Golgi-based mechanism. Golgi integrity, global secretion and IFT20
    distribution are all preserved; what fails is glycan processing and the
    secretion of extracellular matrix proteoglycans.
  biological_processes:
  - preferred_term: Golgi organization
    modifier: ABNORMAL
    term:
      id: GO:0007030
      label: Golgi organization
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This association and extraskeletal disease manifestations in ODCD point to a cilium-dependent pathogenesis. However, our functional studies in patient-derived primary cells clearly support a Golgi-based disease mechanism.
    explanation: >-
      States the competing hypothesis and the experimental result that settles
      it in favour of the Golgi.
  downstream:
  - target: Aberrant Glycan Processing and Impaired Proteoglycan Secretion
    description: >-
      The specific Golgi functions lost are glycan processing and matrix
      proteoglycan export.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        ensuing from aberrant glycan processing and impaired extracellular matrix proteoglycan secretion by the Golgi apparatus
      explanation: >-
        Names the two Golgi functions whose loss carries the phenotype.
- name: Aberrant Glycan Processing and Impaired Proteoglycan Secretion
  biological_scale: CELLULAR
  description: >-
    Cartilage matrix depends on heavily glycosylated proteoglycans passing
    through the Golgi. When their processing and export fail, the chondrocyte
    cannot build a competent matrix.
  biological_processes:
  - preferred_term: proteoglycan biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ensuing from aberrant glycan processing and impaired extracellular matrix proteoglycan secretion by the Golgi apparatus
    explanation: >-
      Direct statement of the matrix-secretion defect this node represents.
  downstream:
  - target: Defective Dentine Matrix Deposition
    description: >-
      Odontoblasts secrete a heavily glycosylated collagenous matrix through the
      same Golgi route, so the dental arm branches here rather than downstream of
      the growth plate: odontoblasts are not chondrocytes, and dentine formation
      does not pass through endochondral ossification.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        ensuing from aberrant glycan processing and impaired extracellular matrix proteoglycan secretion by the Golgi apparatus
      explanation: >-
        Establishes the cell-general Golgi secretory lesion. That odontoblasts
        are affected by the same lesion is inferred from the dental phenotype
        travelling with the skeletal one, not separately demonstrated, which is
        why this is recorded as partial support.
  - target: Cellular Achondrogenesis of the Growth Plate
    description: >-
      Failure of matrix secretion produces the chondrocyte maturation defect that
      ODCD shares with achondrogenesis type 1A, at lower severity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30728324
      reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, a similar defect in chondrocyte maturation is observed in both disorders, which produces a cellular achondrogenesis phenotype of different severity
      explanation: >-
        Establishes the shared chondrocyte maturation defect and that the two
        disorders differ in degree rather than kind.
- name: Cellular Achondrogenesis of the Growth Plate
  biological_scale: TISSUE
  description: >-
    Impaired chondrocyte maturation in the growth plate, the tissue lesion shared
    across the TRIP11 allelic series. The amount of residual GMAP-210 activity
    sets where a patient falls on the severity axis, from lethal achondrogenesis
    to a mild adult ODCD phenotype.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: chondrocyte differentiation
    modifier: ABNORMAL
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  evidence:
  - reference: PMID:30728324
    reference_title: Hypomorphic mutations of TRIP11 cause odontochondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, a similar defect in chondrocyte maturation is observed in both disorders, which produces a cellular achondrogenesis phenotype of different severity
    explanation: >-
      The shared tissue-level lesion, and the severity gradient that defines the
      allelic series.
  downstream:
  - target: Spondylometaphyseal Dysplasia
    description: >-
      The growth-plate lesion produces the vertebral and metaphyseal changes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31903676
      reference_title: >-
        Pathogenic variants in the TRIP11 gene cause a skeletal dysplasia spectrum from odontochondrodysplasia to achondrogenesis 1A.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        hypomorphic mutations in that gene have been linked to odontochondrodysplasia (ODCD), a nonlethal skeletal dysplasia characterized by skeletal changes in the spine and in the metaphyseal regions, associated with dentinogenesis imperfecta
      explanation: >-
        Names the spinal and metaphyseal components that this edge produces.
- name: Defective Dentine Matrix Deposition
  biological_scale: TISSUE
  description: >-
    The odontoblast arm of the same Golgi secretory lesion. Dentine is a
    collagenous, proteoglycan-rich matrix laid down by odontoblasts, and its
    defective deposition is what produces the dentinogenesis imperfecta that
    names the disorder.
  biological_processes:
  - preferred_term: proteoglycan biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
  evidence:
  - reference: PMID:31903676
    reference_title: >-
      Pathogenic variants in the TRIP11 gene cause a skeletal dysplasia spectrum from odontochondrodysplasia to achondrogenesis 1A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypomorphic mutations in that gene have been linked to odontochondrodysplasia (ODCD), a nonlethal skeletal dysplasia characterized by skeletal changes in the spine and in the metaphyseal regions, associated with dentinogenesis imperfecta
    explanation: >-
      Establishes dentinogenesis imperfecta as a constant component of the
      disorder, alongside but distinct from the skeletal changes.
  downstream:
  - target: Dentinogenesis Imperfecta
    description: >-
      Defective dentine matrix produces the clinically expressed dental disease.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31903676
      reference_title: >-
        Pathogenic variants in the TRIP11 gene cause a skeletal dysplasia spectrum from odontochondrodysplasia to achondrogenesis 1A.
      supports: SUPPORT

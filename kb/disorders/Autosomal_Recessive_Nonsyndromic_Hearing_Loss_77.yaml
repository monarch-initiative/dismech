    explanation: >-
      The measurement itself, with its timing. INDIRECT for the human disease because the
      recordings are murine; the timing is what links it to the progressive human course.
  - reference: PMID:33707295
    reference_title: "Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The mechanotransduction defect observed in Loxhd1-mutant IHCs was not accompanied by a morphologic defect of the hair bundle or a reduction in TL number."
    explanation: >-
      The exclusion that makes this node specific: not a bundle malformation and not a tip-link
      deficiency. Recorded as SUPPORT because it supports this node's claim by ruling out the
      alternatives, and INDIRECT because that is an inference from a negative result.
  - reference: PMID:33707295
    reference_title: "Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells."
    supports: SUPPORT

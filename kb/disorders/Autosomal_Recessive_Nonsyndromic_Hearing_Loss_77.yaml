- name: Reduced Hair-Cell Mechanotransduction
  description: Mechanically evoked receptor currents decline in LOXHD1-mutant cochlear hair cells before gross bundle disruption. PLAT10 missense and targeted truncating mouse alleles retain near-control currents at P7 but show severe reduction at P11, with unchanged measured residual-current kinetics at P9. A complete Loxhd1 deletion already reduces currents at P7 and leaves small residual currents at P11. Tip links and selected tip-link proteins can remain present despite TMC1 mislocalization; their presence does not demonstrate an intact channel complex. Human onset and progression cannot be inferred directly from these postnatal mouse time points.

      that LOXHD1's repeats bind lipids and proteins is carried over from other PLAT-domain
      proteins rather than demonstrated for LOXHD1 - the authors' own hedge "in other proteins"
      is kept in the quote.
- name: Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
  description: >-
    The central mechanistic finding, and it is defined as much by what is normal as by what is
    not. Mutant inner hair cells have mechanotransduction currents at wild-type levels through
    the first postnatal week and severely reduced currents by postnatal day 11. Over the same
    interval the hair bundle stays morphologically normal, tip-link number is not reduced, and
    Harmonin and LHFPL5 - proteins of the upper and lower tip-link complexes - remain correctly
    localised.

    The authors' reading is that the transduction machinery is present but not activatable. That
    is a specific claim and it excludes the two obvious alternatives, which is why this entry
    states the exclusions rather than only the positive finding: this is not a bundle
    malformation and it is not a tip-link deficiency.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell

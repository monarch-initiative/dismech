name: Autosomal Recessive Nonsyndromic Hearing Loss 77
category: Mendelian
creation_date: "2026-08-30T22:05:00Z"
synonyms:
- DFNB77
- Deafness, autosomal recessive 77
- LOXHD1-related autosomal recessive nonsyndromic hearing loss
- Autosomal recessive nonsyndromic deafness 77
description: >-
  DFNB77 is autosomal recessive nonsyndromic hearing loss caused by biallelic variants in
  LOXHD1, a protein built almost entirely of PLAT (polycystin/lipoxygenase/alpha-toxin) repeats
  and distributed along the length of the hair-cell stereociliary membrane. It was identified by
  going the unusual direction - from a mouse mutant to a human family. The ENU-induced *samba*
  line was mapped to Loxhd1, and the human gene was then screened in deafness families, which is
  how DFNB77 was found.

  The mechanism is the interesting part, and it is specific enough to be worth stating precisely
  rather than as "hair cells degenerate". Stereociliary development is normal in mutant mice.
  The hair bundle is morphologically intact, tip links are present in normal numbers, and the
  upper and lower tip-link complex proteins Harmonin and LHFPL5 are still correctly localised.
  What fails is the mechanotransduction current itself, and only after a delay:
  mechanotransduction in mutant inner hair cells is at wild-type levels through the first
  postnatal week and severely affected by postnatal day 11, tracking the timing of LOXHD1's own
  arrival in the bundle. The machinery is present but not activatable. Hair cells then degenerate
  secondarily.

  That sequence - normal development, then transduction failure, then degeneration - is what
  makes DFNB77 a *progressive* hearing loss rather than a congenital-profound one, and it puts
  the disease in a small class. The founding report names LOXHD1, MYO3A and PJVK as the only
  human genes then linked to progressive autosomal recessive nonsyndromic hearing loss, and
  proposes age-dependent hair-cell failure as their common mechanism.

  Two further things are curated here because they are the sort of detail that gets flattened.
  LOXHD1 variants have been reported in auditory neuropathy spectrum disorder, with preserved
  cochlear microphonic and partial otoacoustic emissions - a presentation a curator expecting
  "sensorineural hearing loss" would not predict. And LOXHD1 is a recurring, non-trivial
  contributor to diagnostic yield in unselected hearing-loss cohorts, not a one-family curiosity.

  Two cohort studies since 2018 have also settled things that would otherwise be left as
  plausible inference, and both settled them negatively. Vestibular function is spared: a
  nine-family Dutch series found no evidence of vestibular involvement, and a screen of 8,074
  Japanese hearing-loss patients found no accompanying symptoms including vestibular
  dysfunction. That matters because LOXHD1 is expressed in vestibular as well as cochlear hair
  cells, so sparing is a finding rather than an absence of interest. And there is no
  genotype-phenotype correlation to be had: the Dutch series looked for one across fifteen
  variants and could not establish it, attributing the inter- and intrafamilial variation to
  modifiers or environment instead.

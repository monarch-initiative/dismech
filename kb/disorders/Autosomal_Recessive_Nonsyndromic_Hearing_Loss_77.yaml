    label: autosomal recessive nonsyndromic hearing loss 77
parents:
- Nonsyndromic Hearing Loss
notes: >-
  Evidence base. The founding report (PMID:19732867) pairs an ENU mouse mutant with a human
  deafness family and is the source of the gene-disease relationship. The mechanism is carried
  by a later study of two Loxhd1 mouse models (PMID:33707295) which is unusually informative
  because of what it rules out - bundle morphology, tip-link number, and tip-link complex
  protein localisation were all checked and all normal. Two cohort papers (PMID:34753855,
  PMID:36472766) supply the frequency and allelic-spectrum context, and one case series
  (PMID:35875410) supplies the auditory-neuropathy presentation.

  What the mouse can and cannot carry here. The mechanotransduction work is entirely murine, and
  the entry marks it INDIRECT wherever it supports a claim about the human disease. What makes
  it more than a model result is that the human gene was found *because* of the mouse: the same
  report that describes samba screened human deafness families on the strength of it and found
  DFNB77. The mouse is not a post-hoc model of a human disease; it is how the human disease was
  identified.

  Not curated here, deliberately. LOXHD1 also carries an association with Fuchs endothelial
  corneal dystrophy. That is a separate allelic phenotype in a different tissue, and no source
  cited here bears on it, so it is mentioned in the gene notes and nowhere else - it is not part
  of the DFNB77 phenotype and should not be inherited into this entry by association.

  No frequency is given for individual phenotypes as a percentage of DFNB77 patients, because no
  cohort of DFNB77 patients has been assembled. The frequencies below describe how often LOXHD1
  accounts for a solved case in unselected hearing-loss cohorts, which is a different quantity
  and is labelled as such.

  Deep research: an OpenScientist report was generated for this disease and is committed
  alongside the entry. It was used as a lead source only - every snippet below is anchored to a
  PMID fetched into `references_cache/` and read directly. It earned its place: the two cohort
  papers that carry the vestibular-sparing finding, the absent genotype-phenotype correlation,
  the Japanese recurrent allele and the Fuchs corneal dystrophy carrier screen (PMID:31547530,
  PMID:29676012) all reached this entry as leads from that report and were then read directly.

  Its own record: 20 of 23 ontology terms resolved, with `HP:0008550` unresolved - a
  confabulated identifier, not used here. `just preflight-dr` returned WARN rather than PASS,
  flagging "rival gene PLAT is mentioned 20 times". That is a false positive of the kind
  described in issue #9847: PLAT here is the polycystin/lipoxygenase/alpha-toxin *domain* that
  LOXHD1 is built from, not the plasminogen activator gene, and the same output line lists MET,
  which is mechanotransduction. The report is on topic.

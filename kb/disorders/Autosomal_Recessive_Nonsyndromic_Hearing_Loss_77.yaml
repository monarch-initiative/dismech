    explanation: The Japanese family directly supports high-frequency involvement.
- name: Tinnitus
  category: Auditory
  description: The Japanese cohort narrative reports tinnitus in six of 21 assessed individuals, while its patient table marks seven individuals positive. This discrepancy and the small ascertained sample prevent a reliable disease-frequency estimate.
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:31547530
    reference_title: Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 6 out of 21 patients (28.5%) complained of tinnitus, and none of vertigo.
    explanation: The denominator is respondents with this assessment, not all screened hearing-loss patients.
- name: Auditory Neuropathy Spectrum Disorder Presentation
  category: Auditory
  description: Two sisters had an auditory neuropathy spectrum presentation, with abnormal or absent synchronized brainstem responses despite detectable cochlear microphonics and limited early otoacoustic emissions. Their cousin had residual brainstem waveforms with progressive hearing loss. These electrophysiological findings are consistent with a presynaptic hair-cell disorder but do not establish the site of every lesion or a population frequency.
  phenotype_term:
    preferred_term: Auditory Neuropathy Pattern
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  evidence:
  - reference: PMID:35875410
    reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All three subjects had evidence of some, albeit few, functioning cochlear hair cells as revealed by the presence of a cochlear microphonic and/or partial otoacoustic emissions early in life.
    explanation: Three relatives retained some early cochlear responses; the paper specifically identifies the two sisters as presynaptic ANSD cases.
  - reference: PMID:35875410
    reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To our knowledge, this is the first association between LOXHD1 mutations and ANSD in two patients who have been successfully managed with cochlear implants.
    explanation: Establishes the association as novel at the time of reporting and records the management outcome, which is why this presentation matters clinically rather than only descriptively.
- name: Delayed Speech and Language Development
  category: Auditory
  description: Language delay can accompany early hearing loss and may improve with auditory and language habilitation. This is not evidence of an intrinsic global neurodevelopmental syndrome.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:35875410
    reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The assessment revealed significant delayed receptive and expressive language skills.
    explanation: A language assessment in the younger sister before implantation documented delay; later language development improved.
genetic:
- name: LOXHD1
  notes: LOXHD1 encodes a multi-PLAT-domain protein required for hair-cell mechanotransduction. Reported alleles include missense, nonsense, frameshift, canonical splice-site and synonymous splice-altering variants. Variants require assessment of phase, segregation, ancestry-matched frequency and functional evidence; in silico predictions alone do not establish pathogenicity. The recurrent c.4212+1G>A allele occurred on different haplotypes in the Japanese study, supporting recurrent origins rather than a demonstrated single founder. Its reported enrichment in Japanese cases does not establish absence from other populations. Fuchs endothelial corneal dystrophy is not an established consequence of DFNB77 carrier status.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: LOXHD1
    term:
      id: hgnc:26521
      label: LOXHD1
  evidence:
  - reference: PMID:19732867
    reference_title: Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Based on the studies in mice, we screened DNA from human families segregating deafness and identified a mutation in LOXHD1, which causes DFNB77
    explanation: The gene-disease relationship and, in the same sentence, the mouse-first route by which it was established.
  - reference: PMID:34753855
    reference_title: 'Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At the single-gene level, causative variants in GJB2 were the most common cause among autosomal-recessive genes (45%), followed by MYO15A and SLC26A4 (both 10%), TMPRSS3 and LOXHD1 (both 7%).
    explanation: Quantifies LOXHD1's share among autosomal recessive diagnoses in an unselected cohort, which is what establishes it as a routine contributor rather than a single-family gene.
  - reference: PMID:37441688
    reference_title: Systematic review of SLC4A11, ZEB1, LOXHD1, and AGBL1 variants in the development of Fuchs' endothelial corneal dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Our review of reported variants in LOXHD1 with respect to segregation in FECD families and data on LOXHD1 expression in corneal endothelium did not reveal any pathogenic variants.
    explanation: The systematic reassessment challenges the proposed Fuchs dystrophy association. This supports keeping that association uncertain rather than treating corneal dystrophy as a DFNB77 manifestation.
  variants:
  - name: c.4212+1G>A
    description: Recurrent splice-donor variant found in nine homozygous and nine compound heterozygous individuals in the 2019 Japanese LOXHD1-variant cohort. Differing haplotypes in six homozygotes favored recurrent origins. The paper also notes this allele in population databases outside Japan.
    evidence:
    - reference: PMID:31547530
      reference_title: Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A recurrent variant c.4212 + 1G > A, only reported in Japanese patients, was detected in 18 individuals. Haplotype analysis implied that this variation occurred in a mutational hot spot, and that multiple ancestors of Japanese population had this variation.
      explanation: The abstract describes the published patient reports then available; population restriction is not established. Haplotype results oppose a simple single-founder assumption.
  - name: p.D278Y and p.D1219E compound heterozygous pair
    description: Novel compound heterozygous LOXHD1 alleles reported in a Pakistani family with prelingual autosomal recessive nonsyndromic hearing loss. Both are missense changes at conserved residues.
    evidence:
    - reference: PMID:36472766
      reference_title: Biallelic mutations in pakistani families with autosomal recessive prelingual nonsyndromic hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The compound heterozygous mutations in LOXHD1 ([p.D278Y] + [p.D1219E])
      explanation: The abstract explicitly identifies the two LOXHD1 alleles; this does not represent six LOXHD1 families.
  - name: p.Arg1572Ter
    description: Homozygous nonsense variant in nine Ashkenazi Jewish patients with congenital non-progressive severe-to-profound hearing loss.
    evidence:
    - reference: PMID:21465660
      reference_title: A deleterious mutation in the LOXHD1 gene causes autosomal recessive hearing loss in Ashkenazi Jews.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a novel homozygous mutation of the LOXHD1 gene resulting in a premature stop codon (R1572X) in nine patients of Ashkenazi Jewish origin
      explanation: Direct genotype and clinical association.
  - name: c.5934C>T synonymous splice-altering variant
    description: A synonymous variant in a Dutch family activated a novel splice donor in a HEK293T minigene assay. The assay supports abnormal splicing rather than an amino-acid substitution mechanism.
    evidence:
    - reference: PMID:29676012
      reference_title: Further audiovestibular characterization of DFNB77, caused by deleterious variants in LOXHD1, and investigation into the involvement of Fuchs corneal dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'the c.5934C>T variant indeed abolished nor-

        mal splicing'
      explanation: The source reports altered minigene splicing through a novel donor; the line-break hyphen is preserved from the cached PDF.
  - name: p.Arg1494Ter and p.Glu1957Ter compound heterozygous pair
    description: Two Japanese siblings with moderate or severe loss had compound heterozygous truncating variants and stable hearing during the reported childhood follow-up.
    evidence:
    - reference: PMID:25792669
      reference_title: Mutations in LOXHD1 gene cause various types and severities of hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified compound heterozygous mutations; c.5869G>T, p.E1957X and c.4480C>T, p.R1494X in LOXHD1 gene in two patients of family number 963.
      explanation: Directly identifies the alleles and family.
  - name: p.Val1892Phe
    description: Reported in trans with c.4212+1G>A in two Japanese sisters. Predicted PLAT-domain distortion and reduced membrane affinity are computational hypotheses, not measured binding defects.
    evidence:
    - reference: PMID:26973026
      reference_title: Clinical characteristics of a Japanese family with hearing loss accompanied by compound heterozygous mutations in LOXHD1.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: Molecular modeling predicted that distorted structure of the PLAT domain in the p.V1892F mutant could lead to decreased affinity of the protein to lipid membrane resulting in hair cell dysfunction.
      explanation: SWISS-MODEL prediction; a direct lipid-binding defect was not measured.
prevalence:
- population: Japanese hearing-loss patients screened by massively parallel sequencing
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: The 2019 study identified 28 affected individuals from 25 families carrying LOXHD1 variants among 8,074 Japanese hearing-loss patients. This is an ascertained cohort, not a population prevalence estimate. Some variants were uncertain, segregation was incomplete in some families, and the authors questioned two relatively frequent missense alleles; 28 is therefore not an unqualified count of definitively solved probands.
  evidence:
  - reference: PMID:31547530
    reference_title: Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this study, genetic screening was conducted on 8074 Japanese hearing loss patients utilizing massively parallel DNA sequencing to identify individuals with LOXHD1 variants and to assess their phenotypes. A total of 28 affected individuals and 21 LOXHD1 variants were identified, among which 13 were novel variants.
    explanation: Screening denominator and reported LOXHD1-positive group; read alongside the study limitations on pathogenicity and phase.
- population: Hearing-impaired probands, age-balanced German diagnostic cohort
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: LOXHD1 accounted for three of 75 molecular diagnoses in a German diagnostic series of 305 hearing-impaired probands. The reported 7% refers to its share among autosomal recessive diagnoses, not population prevalence.
  evidence:
  - reference: PMID:34753855
    reference_title: 'Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A genetic diagnosis was established for 75 (25%) of the probands that involved 75 causal variants in 35 genes, including 16 novel causal variants and 9 medically significant variant reclassifications.
    explanation: The denominator for the yield figure - 25% of 305 probands solved.
  - reference: PMID:34753855
    reference_title: 'Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nearly one-quarter of the cases (23%; n = 17) were associated with variants in seven additional genes (TMPRSS3, COL4A3, LOXHD1, EDNRB, MYO6, TECTA, and USH2A).
    explanation: Places LOXHD1 in the second tier of contributing genes in that cohort.
  - reference: PMID:34753855
    reference_title: 'Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TMPRSS3, COL4A3, and LOXHD1 (each 4%; n = 3)
    explanation: The gene-specific count is three of 75 solved cases.
progression:
- phase: Onset
  age_range: prelingual to late onset
  notes: Onset ranges from congenital to later life in published cohorts. Delayed diagnosis does not necessarily establish delayed biological onset; a passed newborn screen followed by loss is more informative than absence of neonatal testing.
  evidence:
  - reference: PMID:34753855
    reference_title: 'Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four autosomal-recessive genes demonstrated an association with late hearing loss onset in single cases (TMPRSS3, GJB2, LOXHD1, and SLC26A4).
    explanation: The late-onset end of the reported range.
- phase: Established disease
  notes: Both stable and progressive courses occur. The Japanese cohort obtained serial audiograms in 14 individuals and reported deterioration rates of 0.1 to 9.3 dB/year in pure-tone average. These rates describe that observed subset rather than a universal trajectory. The Dutch series also analyzed longitudinal audiograms and found both stable and progressive hearing loss.
  evidence:
  - reference: PMID:31547530
    reference_title: Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The deterioration rate varied from 0.1 dB/year to 9.3 dB/year in PTA (mean rate: 3.5 dB/year).'
    explanation: Serial audiograms were available for 14 individuals; cohort selection and variant uncertainty limit generalization.
  - reference: PMID:25792669
    reference_title: Mutations in LOXHD1 gene cause various types and severities of hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His hearing was unchanged from 6 to 9 years old.
    explanation: A child with compound heterozygous truncating variants had stable measured hearing over this interval.
diagnosis:
- name: Hearing Loss Gene Panel or Exome Sequencing
  description: Molecular diagnosis uses a hearing-loss multigene panel or genomic testing, with assessment of variant pathogenicity, biallelic phase and segregation. The phenotype overlaps other genetic hearing losses. Panel yield depends on cohort selection and test coverage; the German study does not establish that a panel is always sufficient for DFNB77.
  evidence:
  - reference: PMID:34753855
    reference_title: 'Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A positive family history of autosomal-recessive inheritance in combination with early onset and higher grades of hearing loss significantly increased the solve rate up to 60%, while late onset and lower grades of hearing loss yielded significantly fewer diagnoses.
    explanation: The reported solve rate applies to a selected subgroup across hearing-loss genes, not a DFNB77-specific diagnostic sensitivity.
  - reference: PMID:34753855
    reference_title: 'Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Targeted hearing loss gene panel analysis proved to be an effective tool for ensuring an appropriate diagnostic yield in a routine clinical setting including the identification of novel variants and medically significant reclassifications.
    explanation: Supports panel sequencing as the routine diagnostic modality for this class of disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The identification of variant(s) of ... uncertain significance ... cannot be used to confirm or rule out the diagnosis.
    explanation: A pair of uncertain LOXHD1 variants is not equivalent to a confirmed molecular diagnosis.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A multigene hearing loss panel ... can often identify the cause of genetic hearing loss while limiting identification of pathogenic variants and variants of ... uncertain significance ... in genes that are irrelevant to the underlying
    explanation: General genetic hearing-loss guidance supports panel-based testing; genomic testing is an alternative depending on the clinical setting.
- name: Audiological Testing Including Otoacoustic Emissions and Cochlear Microphonic
  description: Audiometry, otoacoustic emissions, auditory brainstem responses and cochlear microphonic assessment characterize the hearing phenotype. Testing for preserved cochlear responses alongside disordered brainstem responses can identify an auditory-neuropathy pattern. Serial audiometry assesses progression without assuming that every patient will deteriorate.
  evidence:
  - reference: PMID:35875410
    reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They were assessed with a standard clinical test battery including distortion otoacoustic emissions, auditory brainstem responses and audiometry.
    explanation: The test battery used, and the one that made the ANSD presentation visible.
treatments:
- name: Hearing Aid Amplification
  description: Hearing aids provide amplification when residual hearing permits useful benefit. Fitting and follow-up should assess aided hearing and language development. In a reported LOXHD1 family, the cousin had aided thresholds in the mild range but persistent language delay, while two sisters had limited benefit and proceeded to cochlear implantation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Sensorineural Hearing Loss
    description: Improves access to sound without correcting the underlying mechanotransduction defect.
  evidence:
  - reference: PMID:35875410
    reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cousin proband was fitted with hearing aids at 6 months of age.
    explanation: The cousin received amplification; aided thresholds and speech reception improved, but language remained delayed.
  - reference: PMID:35875410
    reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although still delayed, he is currently making progress in terms of speech and language development and remains closely followed with a cochlear implant candidacy evaluation pending on the rate of language development and potential worsening of his hearing loss.
    explanation: An aided audiogram alone did not establish adequate language access; ongoing assessment was required.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Hearing aids (sound amplification), ... customized by an audiologist to the degree and frequency of hearing loss, can be used in individuals with mild-to-severe hearing loss.
    explanation: General genetic hearing-loss guidance supports individualized amplification, not a DFNB77-specific response rate.
- name: Cochlear Implantation
  description: Cochlear implantation can provide useful auditory and language outcomes in selected individuals with severe-to-profound LOXHD1-associated hearing loss. Benefit is reported in an Ashkenazi Jewish series, four assessed Japanese recipients, and two sisters with an auditory-neuropathy presentation. These small observational reports do not establish a universal response rate or a genotype-specific optimal implantation age.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Reduced Hair-Cell Mechanotransduction
    description: Electrical stimulation bypasses impaired hair-cell mechanotransduction. Secondary spiral-ganglion degeneration in mouse models does not establish a human timing threshold for implantation.
  evidence:
  - reference: PMID:35875410
    reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To our knowledge, this is the first association between LOXHD1 mutations and ANSD in two patients who have been successfully managed with cochlear implants.
    explanation: The reported outcome. Two patients is a small basis, and the entry does not present this as an established outcome rate for DFNB77 - only that implantation succeeded where it was tried and reported.
  - reference: PMID:21465660
    reference_title: A deleterious mutation in the LOXHD1 gene causes autosomal recessive hearing loss in Ashkenazi Jews.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: nine patients of Ashkenazi Jewish origin who had severe-profound congenital non-progressive ARNSHL and benefited from cochlear implants.
    explanation: The original clinical report supplies independent evidence of benefit.
  - reference: PMID:31547530
    reference_title: Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: all four cases for which we were able to obtain the results of the Japanese monosyllable word and sentence perception tests, showed over 90% correctness.
    explanation: Four of eight implant recipients had assessed outcomes; the paper reports these results six months after surgery. The full variant cohort includes uncertain genotypes.
  - reference: PMID:35875410
    reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A speech language evaluation at 2 years (16 months after CIs) demonstrated age appropriate receptive and expressive language skills.
    explanation: The younger implanted sister had age-appropriate language at this follow-up.
- name: Genetic Counseling
  description: Counseling addresses autosomal recessive inheritance, variant classification and phase, reproductive options, and the variable hearing-loss course. When both parents carry the relevant pathogenic LOXHD1 alleles, each pregnancy has a 25% chance of an affected child. Congenital stable and progressive courses are both documented; genotype alone does not reliably predict an individual trajectory.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be ... heterozygous ... autosomal recessive ... hearing loss-related ... pathogenic variant ... has at conception a 25% chance of having hearing loss
    explanation: General Mendelian counseling applies to confirmed biallelic DFNB77 when the parental carrier genotypes are established.
  - reference: PMID:21465660
    reference_title: A deleterious mutation in the LOXHD1 gene causes autosomal recessive hearing loss in Ashkenazi Jews.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: nine patients of Ashkenazi Jewish origin who had severe-profound congenital non-progressive ARNSHL and benefited from cochlear implants.
    explanation: Counseling must include the possibility of non-progressive hearing loss.
- name: Speech, Language and Communication Support
  description: Early, individualized language and communication support accompanies audiologic care. Speech-language services, educational accommodations and D/deaf and hard-of-hearing resources should be adapted to the child and family. Hearing thresholds alone do not establish language development.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Delayed Speech and Language Development
    description: Supports language access and development alongside auditory rehabilitation.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A speech-language therapist as well as a neuropsychologist/psychologist for children with hearing loss provides access to resources within the community to aid in speech and language and D/deaf and hard of hearing (DHH) identity development.
    explanation: General hearing-loss guidance supports language and communication services; no controlled DFNB77-specific intervention trial is implied.
animal_models:
- name: samba mouse (ENU-induced Loxhd1 mutant)
  species: Mouse
  genotype: Homozygous Loxhd1 samba p.Ile1342Asn (PLAT10)
  publication: PMID:19732867
  description: ENU-induced mouse allele that helped identify LOXHD1-related human hearing loss. It models loss of hair-cell function followed by degeneration, with allele-specific timing.
  modeled_mechanisms:
  - target: Progressive Hair-Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Hair-cell functional impairment precedes degeneration in the mouse. This is informative for the progressive subset of human disease but does not reproduce every congenital or stable clinical presentation.
    limitations: A mouse point allele standing in for a range of human variants. The correspondence of a particular human genotype's severity to the samba phenotype has not been established, and the human onset range is wide.
    readouts:
    - name: Hair-cell survival over age
      target: Progressive Hair-Cell Degeneration
      direction: DECREASED
      interpretation: The mouse temporal sequence supports functional impairment preceding cell loss; the human course is variable.
      evidence:
      - reference: PMID:19732867
        reference_title: Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Stereociliary development is unaffected in samba mice, but hair cell function is perturbed and hair cells eventually degenerate.
        explanation: Reports the histological and functional sequence behind this readout.
    evidence:
    - reference: PMID:19732867
      reference_title: Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We show that hearing loss in the ethylnitrosourea (ENU)-induced samba mouse line is caused by a mutation in Loxhd1.
      explanation: The original abstract identifies the causal Loxhd1 mutation in samba mice.
- name: Loxhd1 PLAT10 samba and T1308X mouse comparison
  species: Mouse
  genotype: Homozygous samba p.Ile1342Asn or engineered p.T1308X_P1420del
  publication: PMID:33707295
  description: 'Comparison of an ENU-derived missense allele with an engineered premature-stop/deletion allele. T1308X is not a complete null: nonsense-associated alternative splicing can preserve an open reading frame, and residual hearing is milder in some animals.'
  modeled_mechanisms:
  - target: Reduced Hair-Cell Mechanotransduction
    relationship: MEASURES
    fidelity: MODERATE
    description: Direct measurements show near-normal first-week inner-hair-cell mechanotransduction currents followed by severe impairment at P11. Gross bundle organization and tip links are preserved at these ages, despite modest shortening of lower stereociliary rows.
    limitations: Mouse timing and allele effects cannot be assumed for all human variants. Residual hearing in T1308X animals may reflect alternative splicing; nearby genetic modifiers were not excluded. Maintained Harmonin and LHFPL5 do not establish that all channel components remain normally localized.
    readouts:
    - name: Mechanotransduction current in inner hair cells at postnatal day 11
      target: Reduced Hair-Cell Mechanotransduction
      direction: DECREASED
      interpretation: The failing step, with a normal first postnatal week as the internal control that dates the onset.
      evidence:
      - reference: PMID:33707295
        reference_title: Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: While mechanotransduction currents in mutant inner hair cells (IHCs) were similar to wild-type levels in the first postnatal week, they were severely affected by postnatal day 11.
        explanation: Reports the electrophysiological measurement behind this readout.
    - name: Tip-link number and hair-bundle morphology
      target: Reduced Hair-Cell Mechanotransduction
      direction: UNCHANGED
      interpretation: Preserved gross organization and tip-link number argue against their loss as the proximate explanation, while allowing subtle structural changes and molecular mislocalization.
      evidence:

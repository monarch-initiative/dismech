    snippet: "we found that two proteins of the upper and lower TL protein complexes (Harmonin and LHFPL5) were maintained in the mutants, suggesting that the mechanotransduction machinery was present but not activatable"
    explanation: >-
      The strongest statement of this node's claim, with the authors' hedge "suggesting" kept in
      the quote. INDIRECT for the same reason as above.
- name: Progressive Hair-Cell Degeneration
  description: >-
    Hair cells that develop normally and then fail to transduce do not survive. In samba mice,
    stereociliary development is unaffected, hair-cell function is perturbed, and hair cells
    eventually degenerate. The ordering matters clinically: it is what makes the human hearing
    loss progressive rather than congenital and stable, and it is what defines the therapeutic
    window, if one ever exists, as the interval before degeneration.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  downstream:
  - target: Progressive Sensorineural Hearing Loss
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19732867
    reference_title: "Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Stereociliary development is unaffected in samba mice, but hair cell function is perturbed and hair cells eventually degenerate."
    explanation: >-
      States the whole sequence in one sentence - normal development, functional failure, then
      degeneration. INDIRECT for the human disease because the histology is murine.
- name: Progressive Sensorineural Hearing Loss
  description: >-
    The clinical endpoint. Hearing loss that is progressive rather than static, which the
    founding report places in a class of three genes - LOXHD1, MYO3A and PJVK - all of which are
    required for hair-cell function rather than for hair-cell development, and for which it
    proposes age-dependent hair-cell failure as the shared mechanism.
  biological_scale: ORGANISM
  downstream:
  - target: phenotypes#Progressive Sensorineural Hearing Impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19732867
    reference_title: "Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LOXHD1, MYO3a, and PJVK are the only human genes to date linked to progressive ARNSHL. These three genes are required for hair cell function, suggesting that age-dependent hair cell failure is a common mechanism for progressive ARNSHL."
    explanation: >-
      The clinical class this disease belongs to and the mechanism the authors propose for it,
      with their hedge "suggesting" preserved.
phenotypes:
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    The defining feature: sensorineural hearing loss that worsens over time rather than being
    static from birth. Progression is what distinguishes DFNB77 from most autosomal recessive
    nonsyndromic hearing loss, and it follows directly from the mechanism - hair cells that
    develop normally, lose transduction, and then degenerate.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:19732867
    reference_title: "Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we screened DNA from human families segregating deafness and identified a mutation in LOXHD1, which causes DFNB77, a progressive form of autosomal-recessive nonsyndromic hearing loss (ARNSHL)"
    explanation: Names the phenotype and its progressive character in the founding human family.
- name: Prelingual Onset Hearing Loss
  category: Auditory
  description: >-
    Early-onset presentation, reported in Pakistani families where LOXHD1 was among the genes
    solving prelingual-onset DFNB. Onset in DFNB77 is not uniform across reports - the German
    cohort found LOXHD1 among the genes associated with *late* hearing-loss onset in single
    cases - so both ends are recorded rather than a single onset being asserted.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Prelingual sensorineural hearing impairment
    term:
      id: HP:0000399
      label: Prelingual sensorineural hearing impairment
    onset:
      onset_category: CONGENITAL
  evidence:
  - reference: PMID:36472766
    reference_title: "Biallelic mutations in pakistani families with autosomal recessive prelingual nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified eight pathogenic or likely pathogenic mutations in LOXHD1, GJB2, SLC26A4, MYO15A, and TMC1 from six families."
    explanation: >-
      Places LOXHD1 among the genes solving prelingual-onset DFNB in this cohort, which is the
      basis for recording an early-onset presentation.
  - reference: PMID:34753855
    reference_title: "Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Four autosomal-recessive genes demonstrated an association with late hearing loss onset in single cases (TMPRSS3, GJB2, LOXHD1, and SLC26A4)."
    explanation: >-
      Refutes prelingual onset as an obligate feature: in an age-balanced cohort LOXHD1 also
      turned up among the late-onset diagnoses. Recorded against this phenotype rather than
      omitted, so a reader does not take early onset as a rule-out for late presentation.
- name: Auditory Neuropathy Spectrum Disorder Presentation
  category: Auditory
  description: >-
    A presentation that a "sensorineural hearing loss" label would not predict. Three related
    children with LOXHD1 variants had auditory neuropathy spectrum disorder, with a cochlear
    microphonic and/or partial otoacoustic emissions present early in life - meaning some
    cochlear hair-cell function survived while the auditory response was disordered. Two were
    successfully managed with cochlear implants.

    This is consistent with the mechanism rather than in tension with it: LOXHD1 mutant hair
    cells are present and structurally normal but not transducing, which is exactly the
    substrate for a preserved cochlear microphonic with a disordered response.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Auditory neuropathy spectrum disorder
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:35875410
    reference_title: "Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three subjects had evidence of some, albeit few, functioning cochlear hair cells as revealed by the presence of a cochlear microphonic and/or partial otoacoustic emissions early in life."
    explanation: >-
      The audiological finding that defines this presentation, and the one that shows residual
      hair-cell function. The HP binding is the parent term Sensorineural hearing impairment
      because HPO has no auditory-neuropathy-spectrum-disorder term reachable from the
      phenotype enum; the specificity is carried in `preferred_term`.
  - reference: PMID:35875410
    reference_title: "Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, this is the first association between LOXHD1 mutations and ANSD in two patients who have been successfully managed with cochlear implants."
    explanation: >-
      Establishes the association as novel at the time of reporting and records the management
      outcome, which is why this presentation matters clinically rather than only descriptively.
- name: Preserved Vestibular Function
  category: Auditory
  description: >-
    Vestibular function is spared, and this has been looked for rather than assumed. A
    nine-family Dutch series found no evidence for involvement of the vestibular system, and a
    screen of 8,074 Japanese hearing-loss patients found no accompanying symptoms including
    vestibular dysfunction among the 28 individuals with LOXHD1 variants.

    This is a curated absence, and the schema has no way to say so. `FrequencyEnum` has no
    EXCLUDED value (HP:0040285) and `Phenotype` has no negation slot, so this entry records the
    finding as a phenotype whose description and evidence both say it was sought and not found -
    which is honest but not queryable. See issue #10190. The binding is the vestibular-symptom
    term itself; a consumer reading only `phenotype_term` will get the opposite of the intended
    meaning, which is exactly the defect that issue is about.

    Why it is a finding and not a triviality: LOXHD1 is expressed in the hair cells of the
    vestibule as well as the cochlea, so the null expectation would be vestibular involvement.
  phenotype_term:
    preferred_term: Vestibular dysfunction - sought and not found in either published cohort
    term:
      id: HP:0001751
      label: Abnormal vestibular function
  evidence:
  - reference: PMID:29676012
    reference_title: "Further audiovestibular characterization of DFNB77, caused by deleterious variants in LOXHD1, and investigation into the involvement of Fuchs corneal dystrophy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence for involvement of the vestibular system."
    explanation: >-
      Refutes vestibular involvement in DFNB77, in a series assembled specifically to
      characterise the audiovestibular phenotype - so the negative comes from a study designed
      to find it if it were there.
  - reference: PMID:31547530
    reference_title: "Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No accompanying symptoms, including vestibular dysfunction, with hearing loss were detected in this study."
    explanation: >-
      Independent replication of the negative in a much larger screen, and the reason this is
      recorded as established rather than as a single series' observation.
  - reference: PMID:31547530
    reference_title: "Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants of the LOXHD1 gene, which are expressed in hair cells of the cochlea and vestibule, have been reported to cause a progressive form of autosomal recessive non-syndromic hereditary hearing loss, DFNB77."
    explanation: >-
      Establishes that LOXHD1 is expressed in vestibular hair cells, which is what makes the
      sparing a finding rather than an unremarkable absence. INDIRECT because it is the paper's
      background statement of expression, not its own measurement.
genetic:
- name: LOXHD1
  notes: >-
    Encodes a large protein composed entirely of fifteen PLAT
    (polycystin/lipoxygenase/alpha-toxin) repeats, distributed along the stereociliary membrane
    of mature hair cells. Both published mouse models carry mutations in the tenth PLAT repeat.

    The gene was found from the mouse, not from the human. The ENU-induced samba line was mapped
    to Loxhd1 first, and human deafness families were then screened on the strength of it - which
    is worth stating because it is the reverse of the usual order and it is why the mouse work
    carries more weight here than a post-hoc model normally would.

    LOXHD1 is not a rare-in-practice gene. In an age-balanced German cohort of 305
    hearing-impaired probands it was among seven genes accounting for 23% of solved cases, and
    among autosomal recessive genes it tied with TMPRSS3 at 7% of that group. Novel compound
    heterozygous alleles continue to be reported.

    Separately, heterozygous deleterious LOXHD1 missense variants have been associated with
    late-onset Fuchs endothelial corneal dystrophy. This is worth stating precisely rather than
    as a vague allelic caveat, because it has been tested: carriers within nine DFNB77 families
    were screened for FCD and none showed pre-clinical or clinical signs. So the reported
    heterozygous FCD association did not reproduce in DFNB77 carriers, and a DFNB77 family should
    not be counselled about corneal risk on the strength of it.

    Population structure. A recurrent splice variant c.4212+1G>A accounts for 18 of 28 affected
    individuals identified in a screen of 8,074 Japanese hearing-loss patients, and haplotype
    analysis indicates it arose at a mutational hot spot in multiple ancestors rather than
    descending from one founder - which is an unusual and specific finding, and the reason this
    is not described here as a founder allele.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: LOXHD1
    term:
      id: hgnc:26521
      label: LOXHD1
  evidence:
  - reference: PMID:19732867
    reference_title: "Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the studies in mice, we screened DNA from human families segregating deafness and identified a mutation in LOXHD1, which causes DFNB77"
    explanation: >-
      The gene-disease relationship and, in the same sentence, the mouse-first route by which it
      was established.
  - reference: PMID:34753855
    reference_title: "Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the single-gene level, causative variants in GJB2 were the most common cause among autosomal-recessive genes (45%), followed by MYO15A and SLC26A4 (both 10%), TMPRSS3 and LOXHD1 (both 7%)."
    explanation: >-
      Quantifies LOXHD1's share among autosomal recessive diagnoses in an unselected cohort,
      which is what establishes it as a routine contributor rather than a single-family gene.
  variants:
  - name: c.4212+1G>A
    description: >-
      Recurrent splice-donor variant found in 18 of 28 LOXHD1-positive individuals in a Japanese
      hearing-loss cohort and reported only in Japanese patients. Haplotype analysis indicates a
      mutational hot spot arising in multiple ancestors rather than a single founder event.
    evidence:
    - reference: PMID:31547530
      reference_title: "Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A recurrent variant c.4212 + 1G > A, only reported in Japanese patients, was detected in 18 individuals. Haplotype analysis implied that this variation occurred in a mutational hot spot, and that multiple ancestors of Japanese population had this variation."
      explanation: >-
        The allele, its frequency in that cohort, its population restriction, and the haplotype
        result that distinguishes a hot spot from a founder effect.
  - name: p.D278Y and p.D1219E compound heterozygous pair
    description: >-
      Novel compound heterozygous LOXHD1 alleles reported in a Pakistani family with prelingual
      autosomal recessive nonsyndromic hearing loss. Both are missense changes at conserved
      residues.
    evidence:
    - reference: PMID:36472766
      reference_title: "Biallelic mutations in pakistani families with autosomal recessive prelingual nonsyndromic hearing loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The four missense or start-loss mutations were located at well conserved residues, and most in silico analysis predicted their pathogenicity."
      explanation: >-
        Supports the conservation and predicted pathogenicity of the missense alleles reported in
        that cohort. The allele designations themselves are given in square-bracketed notation in
        the source sentence, which the reference validator strips, so they are carried in this
        variant's name and description instead.
prevalence:
- population: Japanese hearing-loss patients screened by massively parallel sequencing
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    The best denominator published for this disease: 28 affected individuals carrying 21 LOXHD1
    variants, from a screen of 8,074 Japanese hearing-loss patients. That is roughly 0.35% of an
    ascertained hearing-loss cohort, not a population prevalence, and it is not transferable to
    other ancestries - 18 of the 28 carry one recurrent splice variant seen only in Japanese
    patients. `measure_type` and `prevalence_class` are left UNKNOWN rather than converted into a
    rate, because a proportion of a disease-ascertained cohort is a different quantity from a
    population frequency and the schema has no measure type for it.
  evidence:
  - reference: PMID:31547530
    reference_title: "Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, genetic screening was conducted on 8074 Japanese hearing loss patients utilizing massively parallel DNA sequencing to identify individuals with LOXHD1 variants and to assess their phenotypes. A total of 28 affected individuals and 21 LOXHD1 variants were identified, among which 13 were novel variants."
    explanation: >-
      Numerator, denominator and variant count in one sentence - the only place in the DFNB77
      literature where all three are stated together.
- population: Hearing-impaired probands, age-balanced German diagnostic cohort
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    This record deliberately does not state a population prevalence for DFNB77, because none has
    been published. What is measurable is LOXHD1's share of *solved* cases in a hearing-loss
    cohort: 7% of autosomal recessive diagnoses in an age-balanced German cohort of 305 probands
    where a genetic diagnosis was established in 25% overall. That is a diagnostic-yield figure,
    not a disease frequency in the population, and the two must not be read as interchangeable -
    which is why `measure_type` and `prevalence_class` are left UNKNOWN rather than being filled
    with a number that would answer a different question.
  evidence:
  - reference: PMID:34753855
    reference_title: "Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genetic diagnosis was established for 75 (25%) of the probands that involved 75 causal variants in 35 genes, including 16 novel causal variants and 9 medically significant variant reclassifications."
    explanation: The denominator for the yield figure - 25% of 305 probands solved.
  - reference: PMID:34753855
    reference_title: "Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly one-quarter of the cases (23%; n = 17) were associated with variants in seven additional genes (TMPRSS3, COL4A3, LOXHD1, EDNRB, MYO6, TECTA, and USH2A)."
    explanation: Places LOXHD1 in the second tier of contributing genes in that cohort.
progression:
- phase: Onset
  age_range: prelingual to late onset
  notes: >-
    Onset is not consistent across reports and the entry does not pick one. Pakistani families
    with LOXHD1 among the solved genes had prelingual onset; the age-balanced German cohort found
    LOXHD1 among genes associated with late hearing-loss onset in single cases. The mouse data
    give a mechanistic reason to expect variability rather than a fixed onset: the defect appears
    when LOXHD1 reaches its normal level in the bundle, so anything that shifts residual protein
    function shifts the timing.
  evidence:
  - reference: PMID:34753855
    reference_title: "Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four autosomal-recessive genes demonstrated an association with late hearing loss onset in single cases (TMPRSS3, GJB2, LOXHD1, and SLC26A4)."
    explanation: The late-onset end of the reported range.
- phase: Established disease
  notes: >-
    Progressive. The founding report classifies DFNB77 as one of the few progressive forms of
    autosomal recessive nonsyndromic hearing loss, and the mouse mechanism supplies the reason:
    hair cells fail functionally and then degenerate, so hearing worsens with age rather than
    being fixed at its initial level. No longitudinal audiometric series for DFNB77 patients has
    been published, so the rate of progression is not characterised.
  evidence:
  - reference: PMID:19732867
    reference_title: "Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LOXHD1, MYO3a, and PJVK are the only human genes to date linked to progressive ARNSHL."
    explanation: Places DFNB77 in the progressive class of ARNSHL.
diagnosis:
- name: Hearing Loss Gene Panel or Exome Sequencing
  description: >-
    DFNB77 is nonsyndromic, so there is no clinical feature that points at LOXHD1 specifically;
    diagnosis is by sequencing. LOXHD1 is on contemporary hearing-loss panels and is a routine
    contributor to yield, so panel testing rather than exome is usually sufficient. Yield in an
    unselected cohort is strongly phenotype-dependent, which is worth knowing before ordering:
    early onset with a recessive family history and higher-grade loss reached 60%, while late
    onset and lower-grade loss yielded significantly fewer diagnoses.
  evidence:
  - reference: PMID:34753855
    reference_title: "Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A positive family history of autosomal-recessive inheritance in combination with early onset and higher grades of hearing loss significantly increased the solve rate up to 60%, while late onset and lower grades of hearing loss yielded significantly fewer diagnoses."
    explanation: >-
      The phenotype-dependence of diagnostic yield, which is the practical guidance a clinician
      needs before testing.
  - reference: PMID:34753855
    reference_title: "Diagnostic Yield of Targeted Hearing Loss Gene Panel Sequencing in a Large German Cohort With a Balanced Age Distribution from a Single Diagnostic Center: An Eight-year Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted hearing loss gene panel analysis proved to be an effective tool for ensuring an appropriate diagnostic yield in a routine clinical setting including the identification of novel variants and medically significant reclassifications."
    explanation: Supports panel sequencing as the routine diagnostic modality for this class of disease.
- name: Audiological Testing Including Otoacoustic Emissions and Cochlear Microphonic
  description: >-
    Standard audiometry plus otoacoustic emissions, auditory brainstem responses and cochlear
    microphonic. The reason to specify the full battery rather than audiometry alone is the
    auditory-neuropathy presentation: in the reported LOXHD1 ANSD children, a cochlear
    microphonic and partial otoacoustic emissions were present early in life, which is the
    finding that identifies ANSD and changes management. An audiogram alone would not have shown
    it.
  evidence:
  - reference: PMID:35875410
    reference_title: "Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They were assessed with a standard clinical test battery including distortion otoacoustic emissions, auditory brainstem responses and audiometry."
    explanation: The test battery used, and the one that made the ANSD presentation visible.
treatments:
- name: Cochlear Implantation
  description: >-
    Two of the three reported LOXHD1 auditory-neuropathy children were successfully managed with
    cochlear implants. This is a reasonable expectation on mechanism as well as on report: the
    lesion is at the hair-cell transduction step, upstream of the spiral ganglion and auditory
    nerve, so direct electrical stimulation bypasses it.

    Note the treatment term binds the clinical action, not the device. `NCIT:C157820` "Cochlear
    Implant" names the equipment and has no `NCIT:C25218` ancestor, so it cannot sit in a
    `TreatmentTerm`; it is attached as a qualifier instead, which keeps the device concept
    queryable.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
    description: >-
      Bypasses the failed step rather than correcting it. The implant stimulates the auditory
      nerve directly, so it does not depend on hair-cell transduction and is not affected by the
      progressive degeneration downstream of it.
  evidence:
  - reference: PMID:35875410
    reference_title: "Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, this is the first association between LOXHD1 mutations and ANSD in two patients who have been successfully managed with cochlear implants."
    explanation: >-
      The reported outcome. Two patients is a small basis, and the entry does not present this as
      an established outcome rate for DFNB77 - only that implantation succeeded where it was
      tried and reported.
- name: Genetic Counseling
  description: >-
    Autosomal recessive with a 25% recurrence risk. Counselling for DFNB77 has to carry the
    progression: unlike most autosomal recessive nonsyndromic hearing loss, this one worsens, so
    a child's initial audiogram is not their final one and follow-up audiometry is part of the
    plan rather than an optional extra.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19732867
    reference_title: "Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LOXHD1, MYO3a, and PJVK are the only human genes to date linked to progressive ARNSHL."
    explanation: >-
      The progression that counselling has to convey, and the reason DFNB77 is counselled
      differently from a static recessive hearing loss.
animal_models:
- name: samba mouse (ENU-induced Loxhd1 mutant)
  species: Mouse
  genotype: Loxhd1 ENU-induced point mutation (samba allele)
  publication: PMID:19732867
  description: >-
    The ENU-induced line from which the gene was identified. Its importance is not that it models
    a known human disease but that it found one: mapping samba to Loxhd1 is what prompted
    screening of human deafness families and led to DFNB77.
  modeled_mechanisms:
  - target: Progressive Hair-Cell Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the human sequence: normal stereociliary development, then perturbed hair-cell
      function, then hair-cell degeneration - matching the progressive rather than congenital
      character of the human hearing loss.
    limitations: >-
      A mouse point allele standing in for a range of human variants. The correspondence of a
      particular human genotype's severity to the samba phenotype has not been established, and
      the human onset range is wide.
    readouts:
    - name: Hair-cell survival over age
      target: Progressive Hair-Cell Degeneration
      direction: DECREASED
      interpretation: >-
        Degeneration follows functional failure rather than preceding it, which is the ordering
        the human progressive course requires.
      evidence:
      - reference: PMID:19732867
        reference_title: "Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Stereociliary development is unaffected in samba mice, but hair cell function is perturbed and hair cells eventually degenerate."
        explanation: Reports the histological and functional sequence behind this readout.
    evidence:
    - reference: PMID:19732867
      reference_title: "Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that hearing loss in the ethylnitrosourea (ENU)-induced samba mouse line is caused by a mutation in Loxhd1."
      explanation: >-
        Establishes the model's genotype and that its hearing loss is Loxhd1-caused, which is
        what licenses reading its phenotype as informative for the human gene.
- name: Loxhd1 mouse models with tenth PLAT-repeat mutations
  species: Mouse
  genotype: Two independent Loxhd1 alleles affecting the 10th PLAT repeat
  publication: PMID:33707295
  description: >-
    Two independent mouse lines used to localise the defect to mechanotransduction rather than to
    bundle structure. Both sexes were studied.
  modeled_mechanisms:
  - target: Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Direct electrophysiological measurement of the failing step, with the structural
      alternatives measured in the same animals and found normal.
    limitations: >-
      Murine, and the alleles are engineered rather than patient-derived. No human hair-cell
      recording exists for comparison and none is obtainable, so the mechanistic step in the
      human disease rests on this model.
    readouts:
    - name: Mechanotransduction current in inner hair cells at postnatal day 11
      target: Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
      direction: DECREASED
      interpretation: >-
        The failing step, with a normal first postnatal week as the internal control that dates
        the onset.
      evidence:
      - reference: PMID:33707295
        reference_title: "Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "While mechanotransduction currents in mutant inner hair cells (IHCs) were similar to wild-type levels in the first postnatal week, they were severely affected by postnatal day 11."
        explanation: Reports the electrophysiological measurement behind this readout.
    - name: Tip-link number and hair-bundle morphology
      target: Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
      direction: UNCHANGED
      interpretation: >-
        A negative result that is doing real work: it excludes a structural cause and is why this
        node is a transduction failure rather than a bundle defect.
      evidence:
      - reference: PMID:33707295
        reference_title: "Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The mechanotransduction defect observed in Loxhd1-mutant IHCs was not accompanied by a morphologic defect of the hair bundle or a reduction in TL number."
        explanation: Reports the structural measurements behind this readout.
    - name: Harmonin and LHFPL5 localisation in the hair bundle
      target: Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
      direction: UNCHANGED
      interpretation: >-
        Tip-link complex proteins remain where they belong, so the machinery is present. Together
        with the current measurement this is what supports "present but not activatable".
      evidence:
      - reference: PMID:33707295
        reference_title: "Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we found that two proteins of the upper and lower TL protein complexes (Harmonin and LHFPL5) were maintained in the mutants"
        explanation: Reports the immunolocalisation measurement behind this readout.
    evidence:
    - reference: PMID:33707295
      reference_title: "Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we identified the hearing loss-associated Loxhd1/DFNB77 gene as being required for the mechanotransduction process."
      explanation: >-
        Supports treating this model as informative for the transduction node, and names the human
        locus explicitly.
discussions:
- discussion_id: dfnb77_no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Severity and rate of progression in DFNB77 vary widely within families carrying the same
    variants. If the LOXHD1 genotype does not predict them, what does?
  attaches_to:
  - genetic#LOXHD1
  - phenotypes#Progressive Sensorineural Hearing Impairment
  - progression#Onset
  rationale: >-
    Two independent groups looked for a genotype-phenotype correlation and neither found one.

    Established: the hearing phenotype varies in severity and progression both between and
    within families; fifteen pathogenic variants across nine Dutch families gave no relationship
    between variant type or position and severity or progression; a Japanese cohort of 28
    individuals, 18 of them sharing one recurrent splice variant, likewise showed different
    progression rates. The intrafamilial part is the sharp end - siblings with identical
    genotypes diverge, so ancestry and allele are both controlled and the variation survives.

    Not established: the cause. Both groups reach for the same pair of candidates and neither
    tests them - the Dutch series hypothesises environmental factors or genetic modifiers, and
    the Japanese cohort speculates the same. No modifier locus has been proposed, and no
    environmental exposure has been examined. Noise exposure is the obvious candidate for a
    disease of progressive hair-cell degeneration and, as far as the sources cited here go,
    nobody has asked.

    This matters for counselling more than for mechanism. A family given a molecular diagnosis
    wants to know how bad it will get, and the honest answer is that the genotype does not say.
  evidence:
  - reference: PMID:29676012
    reference_title: "Further audiovestibular characterization of DFNB77, caused by deleterious variants in LOXHD1, and investigation into the involvement of Fuchs corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a clear correlation between the type or location of the variant and the severity or progression of HI could not be established. We hypothesize that environmental factors or genetic modifiers are responsible for phenotypic differences."
    explanation: >-
      The negative result and the authors' own untested explanation for it, quoted together
      because the hypothesis is doing no work until somebody tests it.
  - reference: PMID:31547530
    reference_title: "Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with LOXHD1 variations mostly showed early onset hearing loss and presented different progression rates. We speculated that the varying severities and progression rates of hearing loss are the result of environmental and/or other genetic factors."
    explanation: >-
      Independent replication of both the observation and the untested explanation, in a much
      larger cohort dominated by a single shared allele.
  proposed_experiments:
  - experiment_id: exp_dfnb77_modifier_and_exposure_study
    name: Modifier and noise-exposure study in the Japanese c.4212+1G>A cohort
    description: >-
      The 18 individuals homozygous or compound heterozygous for the same recurrent splice
      variant are an unusually clean natural experiment: allele held constant, ancestry largely
      held constant, phenotype varying. Genotype them for known hearing-loss modifier loci and
      collect lifetime noise-exposure and ototoxic-drug history, then test both against
      audiometric slope.
    would_support:
    - genetic#LOXHD1
    supporting_outcome:
    - >-
      Progression rate tracks a modifier locus or a measured exposure, converting an unexplained
      variance into a counselling-relevant and potentially modifiable factor.
    refuting_outcome:
    - >-
      Neither modifiers nor exposure explain the variance in a cohort sharing one allele,
      indicating the variability is stochastic at the level of hair-cell survival and that no
      prognostic statement is available at diagnosis.
- discussion_id: dfnb77_how_loxhd1_gates_transduction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    The mechanotransduction machinery is present and correctly localised in LOXHD1-mutant hair
    cells but does not conduct. What does LOXHD1 do that the assembled machinery needs?
  attaches_to:
  - pathophysiology#LOXHD1 Loss of Function in Stereocilia
  - pathophysiology#Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
  rationale: >-
    This is a well-posed gap rather than a general absence of knowledge, because the obvious
    answers have been tested and excluded.

    Established: LOXHD1 is fifteen PLAT repeats distributed along the stereociliary membrane; it
    arrives late in postnatal bundle development; mechanotransduction currents are normal in the
    first postnatal week and severely reduced by day 11, tracking that arrival; the hair bundle
    is morphologically normal; tip-link number is not reduced; Harmonin and LHFPL5 are correctly
    localised.

    Excluded by those measurements: a developmental bundle malformation, a tip-link deficiency,
    and a failure to assemble the tip-link protein complexes.

    Not established: the actual function. The only positional evidence is that PLAT repeats bind
    lipids and proteins *in other proteins* - which is an inference from domain class, not a
    demonstrated activity of LOXHD1, and the founding mechanism paper says so in those words. A
    membrane-lipid-organising role at the transduction site is the obvious candidate and is
    untested. So is a role in delivering or retaining a component not assayed in that study.

    The clinical reason this matters: if LOXHD1 maintains an activatable state rather than
    building the machinery, the machinery is intact in a patient's hair cells until they
    degenerate - which would define a window in which a small-molecule or gene-replacement
    approach has something left to act on. If instead LOXHD1 is needed to build something not
    yet measured, that window is narrower or absent.
  evidence:
  - reference: PMID:33707295
    reference_title: "Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "suggesting that the mechanotransduction machinery was present but not activatable"
    explanation: The statement of the gap - what is left unexplained once the alternatives are excluded.
  - reference: PMID:33707295
    reference_title: "Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This work identified a novel LOXHD1-dependent step in hair bundle development that is critical for mechanotransduction in mature hair cells as well as for normal hearing function in mice and humans."
    explanation: >-
      The authors name the missing step as novel and LOXHD1-dependent without characterising it,
      which is precisely the shape of this gap.
  proposed_experiments:
  - experiment_id: exp_dfnb77_loxhd1_interactome_and_lipid_binding
    name: What LOXHD1 binds at the stereociliary membrane
    description: >-
      Determine the lipid- and protein-binding partners of the LOXHD1 PLAT repeats at the
      stereociliary membrane - by proximity labelling in hair cells and by direct lipid-binding
      assays on the tenth repeat, the one both mouse alleles disrupt - and test whether the
      identified partners are mislocalised or lost in mutant bundles at postnatal day 11.
    would_support:
    - pathophysiology#Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
    supporting_outcome:
    - >-
      LOXHD1 is shown to organise a specific membrane lipid environment or retain a specific
      partner at the transduction site, and that environment or partner is disrupted in mutants -
      naming the LOXHD1-dependent step and identifying a target.
    refuting_outcome:
    - >-
      No consistent binding partner or lipid dependency is found and mutant bundles are
      indistinguishable from wild type on every measured axis, indicating the defect lies
      somewhere the current assays do not reach and that the mechanism curated here stops one
      step short of the lesion.

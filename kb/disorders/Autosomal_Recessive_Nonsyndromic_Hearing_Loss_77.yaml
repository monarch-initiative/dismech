    explanation: General Mendelian counseling applies to confirmed biallelic DFNB77 when the parental carrier genotypes are established.
pathophysiology:
- name: LOXHD1 Loss of Function in Stereocilia
  description: 'Biallelic pathogenic LOXHD1 variants impair a stereociliary protein containing up to fifteen PLAT repeats. The molecular consequence is allele dependent: missense variants need not remove the protein, and nonsense-associated alternative splicing can preserve part of its coding sequence in a mouse model. Epitope-tagged mouse LOXHD1 is enriched at the tips of the shorter, transducing stereocilia. Earlier staining along the stereociliary membrane used an antibody whose specificity could not be confirmed with a complete null control.'

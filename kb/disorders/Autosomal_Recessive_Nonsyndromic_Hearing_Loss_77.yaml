- name: TMC1 Mislocalization from Tip-Link Insertion Sites
  description: Remaining TMC1 molecules progressively redistribute away from the lower tip-link insertion along stereociliary shafts. This spatial separation limits transmission of sound-induced forces to the channels. LOXHD1 co-immunoprecipitates with TMC1, CIB2, LHFPL5 and PCDH15-CD2 in heterologous cells, but not with TMC2 or TMIE in the tested assays. These associations and mouse localization support a stabilizing connection; they do not establish the exact direct-binding topology or show that every human variant disrupts the same interaction.

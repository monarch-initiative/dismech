- name: Relative Vestibular Sparing
  description: Vestibular function has generally been preserved in assessed DFNB77 families, despite LOXHD1 expression in vestibular hair cells. The Dutch series found normal or mildly increased vestibular reactivity and some cVEMP asymmetry; the Japanese series reported no vertigo and normal formal vestibular testing in six individuals. These findings support relative clinical sparing, without proving a dose-dependent protective mechanism or excluding every vestibular abnormality.

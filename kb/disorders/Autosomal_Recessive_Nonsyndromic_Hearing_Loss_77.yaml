    label: autosomal recessive nonsyndromic hearing loss 77
parents:
- Nonsyndromic Hearing Loss
notes: DFNB77 is OMIM 613079; LOXHD1 is OMIM 613072. Human series show substantial variation even within families, and variant type or position alone has not reliably predicted an individual's course. Negative genotype-phenotype analyses in small cohorts do not establish that no correlation can exist. Vestibular function was generally preserved in the assessed cohorts; minor test variations and limited sampling prevent a universal absence claim. The proposed association of heterozygous LOXHD1 variants with Fuchs endothelial corneal dystrophy remains uncertain and should not be treated as an established DFNB77 manifestation. Cohort detection proportions are distinct from population prevalence, and reported LOXHD1-positive cohorts sometimes include variants of uncertain significance or incompletely established phase.
inheritance:

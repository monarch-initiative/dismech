- name: LOXHD1-associated hearing loss in Rottweilers
  species: Dog
  genotype: Homozygous LOXHD1 p.Gly1914Ala
  publication: PMID:33983508
  description: A naturally occurring recessive missense variant segregated with congenital or early-onset bilateral deafness in Rottweilers. Four affected littermates lacked auditory brainstem responses when tested.
  modeled_mechanisms:
  - target: Sensorineural Hearing Loss
    relationship: MEASURES
    fidelity: MODERATE
    description: A naturally occurring recessive missense variant segregated with congenital or early-onset bilateral deafness in Rottweilers. Four affected littermates lacked auditory brainstem responses when tested.
    limitations: Variant segregation and hearing tests support a large-animal model, but this study did not measure mechanotransduction or hair-cell histology in the genotyped dogs. Histological degeneration described in earlier ungenotyped Rottweilers cannot be attributed definitively to this allele. Progression from partial loss to deafness was inferred from owner reports and remains unconfirmed.
    evidence:
    - reference: PMID:33983508
      reference_title: Missense variant in LOXHD1 is associated with canine nonsyndromic hearing loss.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We observed complete segregation of the variant with hearing loss, as all four affected dogs were homozygous for the variant.
      explanation: The 585-dog cohort included four affected homozygotes; unaffected dogs were heterozygous or wild type.
    - reference: PMID:33983508
      reference_title: Missense variant in LOXHD1 is associated with canine nonsyndromic hearing loss.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Sensorineural bilateral deafness was diagnosed in four Rottweiler siblings (one female and three males) in a litter of ten puppies using brainstem auditory evoked response (BAER) testing.
      explanation: Direct electrophysiological evidence for the canine hearing phenotype.
discussions:
- discussion_id: dfnb77_no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which allele-specific, splicing, genetic or environmental factors explain variation in DFNB77 onset and course?
  attaches_to:
  - genetic#LOXHD1
  - phenotypes#Progressive Sensorineural Hearing Impairment
  - progression#Onset
  rationale: The Dutch and Japanese cohorts did not establish a simple relationship between variant class or position and severity or progression. Their limited sample sizes, follow-up differences, uncertain variants and heterogeneous compound genotypes constrain those negative findings. Intrafamilial variation is documented, but no specific human modifier has been established by these studies. Nonsense-associated alternative splicing was proposed to attenuate a mouse allele and is a candidate mechanism to test in human variants, not a demonstrated explanation for human variability.
  evidence:
  - reference: PMID:29676012
    reference_title: Further audiovestibular characterization of DFNB77, caused by deleterious variants in LOXHD1, and investigation into the involvement of Fuchs corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a clear correlation between the type or location of the variant and the severity or progression of HI could not be established. We hypothesize that environmental factors or genetic modifiers are responsible for phenotypic differences.
    explanation: The cohort found no clear correlation; environmental and genetic modifiers remain hypotheses.
  - reference: PMID:31547530
    reference_title: Mutational Spectrum and Clinical Features of Patients with LOXHD1 Variants Identified in an 8074 Hearing Loss Patient Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with LOXHD1 variations mostly showed early onset hearing loss and presented different progression rates. We speculated that the varying severities and progression rates of hearing loss are the result of environmental and/or other genetic factors.
    explanation: The Japanese variant cohort also showed variable progression, but did not test specific modifiers.
  proposed_experiments:
  - experiment_id: exp_dfnb77_modifier_and_exposure_study
    name: Modifier and noise-exposure study in the Japanese c.4212+1G>A cohort
    description: Study longitudinal hearing in individuals carrying c.4212+1G>A while explicitly accounting for the second allele, phase, age, treatment and follow-up. Test transcript consequences, candidate genetic modifiers and measured exposures using adequate comparison groups. Sharing one allele does not hold the whole genotype constant.
    would_support:
    - genetic#LOXHD1
    supporting_outcome:
    - Progression rate tracks a modifier locus or a measured exposure, converting an unexplained variance into a counselling-relevant and potentially modifiable factor.
    refuting_outcome:
    - No association would limit the tested hypotheses at the available power; it would not establish stochastic causation or the impossibility of prognosis.
- discussion_id: dfnb77_how_loxhd1_gates_transduction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which LOXHD1 interfaces and lipid interactions stabilize the TMC1-tip-link connection, and can restoring that connection recover mature hair-cell function?
  attaches_to:
  - pathophysiology#LOXHD1 Loss of Function in Stereocilia
  - pathophysiology#Reduced Hair-Cell Mechanotransduction
  rationale: The 2024 deletion and tagged-protein experiments establish that LOXHD1 maintains TMC1 near the lower tip-link insertion. Earlier preservation of Harmonin and LHFPL5 did not establish normal localization of every mechanotransduction component. Co-immunoprecipitation supports associations with TMC1, CIB2, LHFPL5 and PCDH15, but exact direct-binding interfaces and the contribution of membrane lipids remain unresolved. The p.Val1892Phe lipid-affinity proposal remains computational. Persistence of some mislocalized TMC1 motivates rescue experiments; a therapeutic window and effective gene replacement have not been demonstrated by these localization studies.
  evidence:
  - reference: PMID:39256406
    reference_title: LOXHD1 is indispensable for maintaining TMC1 auditory mechanosensitive channels at the site of force transmission.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The interaction between LOXHD1 and PCDH15 could occur through direct binding, indirect mediation via LHFPL5, or a combination of both mechanisms.
    explanation: The interaction topology remains a stated limitation of the proposed stabilizing model.
  - reference: PMID:26973026
    reference_title: Clinical characteristics of a Japanese family with hearing loss accompanied by compound heterozygous mutations in LOXHD1.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Molecular modeling predicted that distorted structure of the PLAT domain in the p.V1892F mutant could lead to decreased affinity of the protein to lipid membrane resulting in hair cell dysfunction.
    explanation: The one LOXHD1-specific prediction of a lipid-binding role, which is why this gap is described as lacking an experimental test rather than lacking a hypothesis. Graded COMPUTATIONAL, and the authors' hedge "could lead to" is kept in the quote.
  proposed_experiments:
  - experiment_id: exp_dfnb77_loxhd1_interactome_and_lipid_binding
    name: Map LOXHD1 interaction interfaces and test functional rescue
    description: Map individual PLAT-repeat protein and lipid interactions, then compare wild-type and disease-associated constructs in biochemical assays and Loxhd1-null hair cells. Measure TMC1 tip localization, MET currents and bundle survival after timed re-expression.
    would_support:
    - pathophysiology#Reduced Hair-Cell Mechanotransduction
    supporting_outcome:
    - Restored LOXHD1-dependent TMC1 positioning is accompanied by recovery of mechanotransduction, identifying a functional interaction and an experimentally supported rescue interval.
    refuting_outcome:
    - Restoring localization fails to restore currents, or particular binding-deficient constructs retain function, limiting the proposed mechanism. Negative results require adequate expression and assay sensitivity before excluding a role.

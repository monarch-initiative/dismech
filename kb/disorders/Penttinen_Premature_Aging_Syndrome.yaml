      P-AKT and P-STAT.
    explanation: >-
      Demonstrates constitutive PDGFRB phosphorylation and downstream P-AKT and
      P-STAT activation driven by the p.Val665Ala variant and their suppression
      by tyrosine kinase inhibitors.

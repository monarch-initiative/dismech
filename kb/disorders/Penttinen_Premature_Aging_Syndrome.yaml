    snippet: >-
      Exome sequencing of an affected individual identified a de novo c.1994T>C
      p.Val665Ala variant in PDGFRB, which encodes the platelet-derived growth
      factor receptor β. Three additional unrelated individuals with this
      condition were shown to have the identical variant in PDGFRB.
    explanation: >-
      Demonstrates molecular diagnosis of Penttinen syndrome via exome and
      targeted sequencing of PDGFRB.
  - reference: PMID:34894066
    reference_title: "Clinical and molecular response to dasatinib in an adult patient with Penttinen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing found a heterozygous variant c.1994T>A pVal665Ala in exon
      14 of PDGFRB. A diagnosis of PS was made and imatinib treatment was
      started with partial response.
    explanation: >-
      Demonstrates molecular confirmation of Penttinen syndrome by identifying
      heterozygous PDGFRB c.1994T>A (p.Val665Ala).

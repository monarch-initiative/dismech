diagnosis:
- name: PDGFRB Molecular Genetic Testing
  presence: PRESENT
  description: >-
    Definitive diagnosis is established by molecular genetic testing (exome or
    targeted sequencing) identifying a heterozygous gain-of-function pathogenic
    variant in PDGFRB, classically substitutions at codon 665 encoding

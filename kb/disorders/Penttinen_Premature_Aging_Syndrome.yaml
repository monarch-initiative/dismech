  term:
    id: MONDO:0011150
    label: acroosteolysis-keloid-like lesions-premature aging syndrome
description: >-
  Penttinen premature aging syndrome is an ultra-rare autosomal dominant
  connective tissue and skeletal disorder caused by heterozygous
  gain-of-function variants in PDGFRB, most characteristically recurrent
  substitutions encoding p.Val665Ala (reported as c.1994T>C and c.1994T>A).
  Affected individuals present in infancy or early childhood with a prematurely
  aged appearance, subcutaneous lipoatrophy, epidermal and dermal atrophy, thin
  sparse hair, proptosis, zygomatic (malar) hypoplasia, nodular hypertrophic
  scar-like or keloid-like skin lesions, progressive distal phalangeal
  acro-osteolysis of the hands and feet with brachydactyly, osteopenia, and
  disabling joint flexion contractures, while cognitive development is typically
  preserved. Targeted receptor tyrosine kinase inhibition with imatinib or
  dasatinib suppresses constitutive PDGFRB signaling and yields clinical
  improvement.

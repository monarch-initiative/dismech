        cause a spectrum of wasting and overgrowth disorders afflicting the
        skeleton and other connective tissues, but the cellular origin of these
        disorders remains unknown.
      explanation: >-
        Places PDGFRB gain-of-function syndromes including Penttinen syndrome
        among inherited disorders of connective tissue and bone.
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    Ultra-rare disorder within the spectrum of more than 50 reported individuals
    carrying germline activating PDGFRB variants across myofibromatosis, Kosaki
    overgrowth syndrome, and Penttinen syndrome.
  evidence:
  - reference: DOI:10.1002/ajmg.a.61615
    reference_title: "Activating variants in <scp><i>PDGFRB</i></scp> result in a spectrum of disorders responsive to imatinib monotherapy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 50 individuals with activating variants in the receptor tyrosine
      kinase PDGFRB have been reported, separated based on clinical features
      into solitary myofibromas, infantile myofibromatosis, Penttinen syndrome
      with premature aging and osteopenia, Kosaki overgrowth syndrome, and
      fusiform aneurysms.
    explanation: >-
      Documents the small global case literature across the entire germline
      activating PDGFRB disorder spectrum.

  term:
    id: MONDO:0011150
    label: acroosteolysis-keloid-like lesions-premature aging syndrome
description: >-
  Penttinen premature aging syndrome is an ultra-rare autosomal dominant
  connective tissue and skeletal disorder caused by heterozygous
  gain-of-function variants in PDGFRB, most characteristically the recurrent
  juxtamembrane/kinase-domain c.1994T>A (p.Val665Ala) substitution. Affected
  individuals present in infancy or early childhood with a prematurely aged
  facial and cutaneous appearance, dermal atrophy, nodular hypertrophic
  scar-like or keloid-like lesions, progressive acro-osteolysis with
  brachydactyly, osteopenia, and disabling joint flexion contractures, while
  cognitive development is preserved. Targeted receptor tyrosine kinase
  inhibition with imatinib or dasatinib suppresses constitutive PDGFRB signaling
  and yields clinical improvement.

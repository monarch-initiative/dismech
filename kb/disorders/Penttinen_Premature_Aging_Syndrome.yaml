  evidence:
  - reference: PMID:26279204
    reference_title: "A Point Mutation in PDGFRB Causes Autosomal-Dominant Penttinen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing of an affected individual identified a de novo c.1994T>C
      p.Val665Ala variant in PDGFRB, which encodes the platelet-derived growth
      factor receptor β. Three additional unrelated individuals with this
      condition were shown to have the identical variant in PDGFRB.
    explanation: >-
      Primary discovery cohort establishing recurrent de novo heterozygous
      autosomal dominant PDGFRB variants in Penttinen syndrome.
  - reference: PMID:34894066
    reference_title: "Clinical and molecular response to dasatinib in an adult patient with Penttinen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penttinen type of premature aging syndrome is an autosomal-dominant
      disorder that can be caused by the c.1994T>A pVal665Ala pathogenic variant
      in platelet-derived growth factor receptor-B (PDGFRB).
    explanation: >-
      Confirms autosomal dominant inheritance of Penttinen syndrome.
genetic:
- name: PDGFRB Gain-of-Function Mutations
  gene_term:
    preferred_term: PDGFRB
    term:
      id: hgnc:8804
      label: PDGFRB
  association: Causative
  features: >-
    Heterozygous gain-of-function missense mutations in PDGFRB, most commonly
    substitutions at codon 665 encoding p.Val665Ala in exon 14 (reported as
    c.1994T>C and c.1994T>A), cause ligand-independent receptor
    autophosphorylation and downstream STAT, PLCgamma, and AKT signaling; in
    vitro studies demonstrate stronger inhibition of p.Val665Ala by dasatinib
    than by imatinib.
  evidence:
  - reference: PMID:26279204
    reference_title: "A Point Mutation in PDGFRB Causes Autosomal-Dominant Penttinen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing of an affected individual identified a de novo c.1994T>C
      p.Val665Ala variant in PDGFRB, which encodes the platelet-derived growth
      factor receptor β. Three additional unrelated individuals with this
      condition were shown to have the identical variant in PDGFRB.
    explanation: >-
      Identifies the recurrent causative heterozygous c.1994T>C (p.Val665Ala)
      PDGFRB mutation across four unrelated probands with Penttinen syndrome.
  - reference: PMID:34894066
    reference_title: "Clinical and molecular response to dasatinib in an adult patient with Penttinen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penttinen type of premature aging syndrome is an autosomal-dominant
      disorder that can be caused by the c.1994T>A pVal665Ala pathogenic variant
      in platelet-derived growth factor receptor-B (PDGFRB).
    explanation: >-
      Documents an alternative nucleotide substitution (c.1994T>A) producing the
      recurrent pathogenic p.Val665Ala PDGFRB protein change.
  - reference: PMID:33449152
    reference_title: "PDGF receptor mutations in human diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      gain-of-function mutants are present in patients with fusiform aneurysms,
      Kosaki overgrowth syndrome or Penttinen premature aging syndrome.
    explanation: >-
      Confirms that germline PDGFRB mutations in Penttinen premature aging
      syndrome act through a gain-of-function mechanism.
pathophysiology:
- name: Constitutive PDGFRB Receptor Tyrosine Kinase Activation
  biological_scale: MOLECULAR
  description: >-
    Gain-of-function substitution (classically p.Val665Ala) in PDGFRB induces
    ligand-independent receptor autophosphorylation and constitutive activation
    of downstream intracellular signaling effectors including STAT3, PLCgamma1,
    and AKT pathways in connective-tissue and skeletal mesenchymal lineages.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Germline or de novo heterozygous activating missense variant in PDGFRB
      (characteristically c.1994T>C or c.1994T>A encoding p.Val665Ala).

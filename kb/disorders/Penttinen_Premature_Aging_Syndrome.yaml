treatments:
- name: Imatinib
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral receptor tyrosine kinase inhibitor targeting constitutively active
    PDGFRB; used as first-line targeted therapy in Penttinen syndrome with
    favorable or partial clinical responses in skin lesions and contractures.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: imatinib
      term:
        id: CHEBI:45783
        label: imatinib
  target_mechanisms:
  - target: Constitutive PDGFRB Receptor Tyrosine Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      Inhibits constitutively phosphorylated PDGFRB kinase activity and
      downstream AKT and STAT signaling.
  evidence:
  - reference: PMID:34894066
    reference_title: "Clinical and molecular response to dasatinib in an adult patient with Penttinen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imatinib, a receptor tyrosine kinase (RTK) inhibitor, has been used in
      Penttinen syndrome (PS) patients with good results.
    explanation: >-
      Documents clinical use and benefit of imatinib in Penttinen syndrome.
  - reference: DOI:10.1002/ajmg.a.61615
    reference_title: "Activating variants in <scp><i>PDGFRB</i></scp> result in a spectrum of disorders responsive to imatinib monotherapy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients were treated with imatinib and had robust and rapid
      response, including the first two reported infants with multicentric
      myofibromas treated with imatinib monotherapy and one with a recurrent
      p.Val665Ala (Penttinen) variant.
    explanation: >-
      Confirms rapid clinical response to imatinib monotherapy in a patient
      carrying the recurrent Penttinen PDGFRB p.Val665Ala variant.
- name: Dasatinib
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Second-generation tyrosine kinase inhibitor exhibiting greater in vitro
    potency than imatinib against the PDGFRB p.Val665Ala variant (suppressing
    P-PDGFRB, P-AKT, and P-STAT) and achieving improved clinical response when
    imatinib response plateaus.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: dasatinib
      term:
        id: CHEBI:49375
        label: dasatinib (anhydrous)
  target_mechanisms:
  - target: Constitutive PDGFRB Receptor Tyrosine Kinase Activation
    treatment_effect: INHIBITS
    description: >-
      Potently inhibits PDGFRB p.Val665Ala autophosphorylation and downstream
      AKT and STAT phosphorylation.
  evidence:
  - reference: PMID:34894066
    reference_title: "Clinical and molecular response to dasatinib in an adult patient with Penttinen syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      in vitro molecular studies with imatinib and dasatinib showed that the
      Val665Ala variant had greater sensitivity to dasatinib than imatinib. This
      was seen examining levels of P-PDGFRB directly and on downstream ligands
      P-AKT and P-STAT.
    explanation: >-
      Demonstrates superior in vitro inhibition of PDGFRB p.Val665Ala
      autophosphorylation and downstream P-AKT and P-STAT signaling by dasatinib
      compared with imatinib.
  - reference: PMID:34894066
    reference_title: "Clinical and molecular response to dasatinib in an adult patient with Penttinen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Improved clinical response was observed after treatment with dasatinib.
    explanation: >-
      Documents clinical improvement in an adult with Penttinen syndrome
      following treatment with dasatinib.
notes: >-
  Nosological scope: Johnston et al. (PMID:26279204) delineated Penttinen
  syndrome (recurrently driven by PDGFRB p.Val665Ala) as clinically distinct
  from allelic PDGFRB disorders including Kosaki overgrowth syndrome
  (p.Pro584Arg, characterized by skeletal overgrowth, myofibromas, and white
  matter lesions) and autosomal dominant infantile myofibromatosis, whereas
  later clinical series (DOI:10.1002/ajmg.a.61615) frame germline activating
  PDGFRB variants as a continuous spectrum of imatinib-responsive connective
  tissue and vascular disorders. DisMech retains Penttinen_Premature_Aging_Syndrome
  as a distinct MONDO:0011150 entry corresponding to the wasting/acro-osteolytic
  p.Val665Ala clinical entity.

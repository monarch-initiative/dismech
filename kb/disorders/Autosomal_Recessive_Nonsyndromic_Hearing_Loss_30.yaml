- name: Disordered Stereocilia and Hair Bundle Architecture
  description: >-
    Constitutive deletion of both Myo3a and Myo3b causes embryonic and neonatal bundle abnormalities, including
    excess stereocilia length and number, altered height grading and bundle rounding or closure. This developmental
    double knockout is not equivalent to human single-gene DFNB30. The Y137C single-gene knock-in develops
    fused or shortened stereocilia and abnormal tips with age, whereas nonsense knock-in bundles appeared normal
    at P8, six months and 8.5 months despite earlier hearing deficits. In P7-P8 double-null apical hair cells
    selected initially for near-normal bundle shape, OHC peak mechanotransduction current was approximately
    halved and IHC/OHC response sensitivity was reduced; adaptation kinetics were preserved. Detectable currents
    therefore do not establish normal transduction across cells, ages or human alleles.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: auditory hair cell
    term:

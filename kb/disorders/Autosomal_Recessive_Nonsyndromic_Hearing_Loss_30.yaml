- name: Myo3a/Myo3b double knockout mouse
  species: Mouse
  genotype: Myo3a(-/-)Myo3b(-/-) double knockout
  publication: PMID:26754646
  description: >-
    Not a model of DFNB30 but of class III myosin function generally: removing both paralogues
    produces profound deafness and a grossly abnormal hair bundle, and it is the source of the
    finding that these motors limit rather than only promote stereocilia elongation.

  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Nonsense, splice-site and missense alleles; the founding family's alleles are
      loss-of-function, and later missense alleles affect conserved motor- and kinase-domain
      residues.
  downstream:
  - target: Failure of Myosin IIIa Delivery to Stereocilia Tips
    description: >-
      Without a functional motor there is no tip-directed myosin IIIa, and the tip-localised
      pool is the functional form: in wild-type mice myosin IIIa localises to stereocilia tips
      and is absent from them in the knock-in mutant.
    causal_link_type: DIRECT
  - target: Congenital Profound Sensorineural Hearing Loss
    description: >-
      The severe end of the DFNB30 spectrum, reported with a kinase-domain ATP-binding-site
      allele and in a consanguineous family with congenital hearing loss. The link is drawn from
      the reported allele-phenotype pairings; the proposed mechanism - loss of kinase activity
      and autophosphorylation - is a modelling inference and is hedged as such.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:12032315
    reference_title: "From flies' eyes to our ears: mutations in a human class III myosin cause progressive nonsyndromic hearing loss DFNB30."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an extended Israeli family, nonsyndromic progressive hearing loss is caused by three different recessive, loss-of-function mutations in myosin IIIA."
    explanation: Establishes loss of myosin IIIA function as the initiating lesion in humans.
  - reference: PMID:34423747
    reference_title: Molecular insights into MYO3A kinase domain variants explain variability in both severity and progression of DFNB30 hearing impairment.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "Our results suggest that KD mutations could either cause a congenital profound form of HI, when particularly affecting the kinase activity and preventing the auto-phosphorylation of the motor, or a late onset and progressive form, when partially or completely inactivating the MYO3A protein."
    explanation: >-
      Molecular-dynamics and structural modelling of kinase-domain variants; it proposes the
      allele-class split recorded in this node's description and is graded COMPUTATIONAL and
      INDIRECT because the phenotype claim follows from modelling rather than from measurement
      in patients.
- name: Failure of Myosin IIIa Delivery to Stereocilia Tips
  description: >-
    Myosin IIIa is a plus-end-directed motor that accumulates at the tips of stereocilia, which
    is where the actin core is polymerised, and it carries cargo there - most clearly espin-1,
    an ankyrin-repeat espin isoform that binds actin monomers through a WH2 motif. Co-expressing
    myosin IIIa with espin-1 elongates filopodia about tenfold in COS-7 cells, and that
    elongation requires the transport step and the espin-1 WH2 activity, not merely the presence
    of both proteins.

    Loss of the motor therefore removes a tip-localised regulator of actin dynamics. The
    cargo-delivery account is incomplete on its own: in mice lacking both class III myosins,
    espin-1 was still properly targeted to stereocilia tips, so myosin IIIa is not the only route
    for espin-1 and the phenotype cannot be reduced to failed espin-1 delivery.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: stereocilium tip
    term:
      id: GO:0032426
      label: stereocilium tip
  downstream:
  - target: Disordered Stereocilia and Hair Bundle Architecture
    description: >-
      Removing a tip-localised motor that both transports actin regulators and constrains
      elongation leaves the bundle's length and grading unregulated.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19287378
    reference_title: Myosin IIIa boosts elongation of stereocilia by transporting espin 1 to the plus ends of actin filaments.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This extraordinary filopodia elongation results from the transport of espin 1 to the plus ends of F-actin by myosin IIIa and depends on espin 1 WH2 activity."
    explanation: >-
      Establishes tip-directed cargo transport as a function of myosin IIIa, in heterologous
      cells and organotypic hair-cell culture.
  - reference: PMID:21165622
    reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Myosin IIIA, with a unique N-terminal kinase domain and a C-terminal actin-binding domain, localizes to the tips of stereocilia in wild-type mice but is absent in the mutant."
    explanation: >-
      Shows directly that the disease allele abolishes the tip-localised pool; INDIRECT because
      the localisation was measured in the mouse knock-in rather than in patient tissue.
  - reference: PMID:26754646
    reference_title: Class III myosins shape the auditory hair bundles by limiting microvilli and stereocilia growth.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Surprisingly, espin-1 is properly targeted to Myo3a(-/-)Myo3b(-/-) stereocilia tips."
    explanation: >-
      Refutes the strong form of this node - that the defect is failed espin-1 delivery. Recorded
      here rather than omitted so the cargo-transport model is not read as settled.
- name: Disordered Stereocilia and Hair Bundle Architecture
  description: >-
    The hair bundle is an array of actin-cored stereocilia held at fixed, graded heights. Without
    class III myosin function the bundle is built wrongly: mice lacking both myosin IIIa and IIIb
    show abnormally tall and numerous microvilli or stereocilia, ungraded bundles, and bundle
    rounding and closure. The direction of that result is the opposite of what the espin-1
    transport model predicts on its own - the motors act to limit elongation and to shape the
    bundle, not simply to lengthen it.

    A single-gene Myo3a knock-in carrying a kinase-domain missense allele also shows structural
    abnormality of cochlear hair cell stereocilia, which is the closer model of the human
    recessive disease. Mechanoelectrical transduction currents themselves were robust with normal
    kinetics in the double mutants, so this is a bundle-architecture defect rather than a
    transduction-channel defect.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  cellular_components:
  - preferred_term: stereocilium
    term:
      id: GO:0032420
      label: stereocilium
  biological_processes:
  - preferred_term: auditory receptor cell stereocilium organization
    modifier: ABNORMAL
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
  downstream:
  - target: Progressive Hair Cell Degeneration
    description: >-
      Structurally abnormal bundles precede hair cell loss in both knock-in lines, where
      degeneration appears and then worsens with age.
    causal_link_type: DIRECT
  - target: Vertigo
    description: >-
      Speculative and recorded as such. Myosin IIIa localises at the stereocilia tips of
      vestibular as well as cochlear hair cells, which is the only mechanistic basis offered for
      the vestibular symptoms reported in a minority of patients; no vestibular testing supports
      it; the one DFNB30 patient given a formal vestibular examination was normal, and so is the
      knock-in mouse.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26754646
    reference_title: Class III myosins shape the auditory hair bundles by limiting microvilli and stereocilia growth.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "These include abnormally tall and numerous microvilli or stereocilia, ungraded stereocilia bundles, and bundle rounding and closure."
    explanation: >-
      The bundle-architecture phenotype of the class III myosin double mutant; INDIRECT because
      it is a mouse double knockout, whereas DFNB30 is a single-gene human disease.
  - reference: PMID:30123247
    reference_title: Knock-In Mice with Myo3a Y137C Mutation Displayed Progressive Hearing Loss and Hair Cell Degeneration in the Inner Ear.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We also found structural abnormality in the cochlear hair cell stereocilia."
    explanation: >-
      The same structural defect in a single-gene Myo3a knock-in, which is the closer model of
      human DFNB30.
- name: Progressive Hair Cell Degeneration
  description: >-
    Hair cells with abnormal bundles are not lost at birth; they are lost with age. In the
    knock-in mouse carrying the equivalent of the human nonsense allele, outer hair cells
    degenerate with age in a pattern that matches the progression of the hearing loss, and in the
    kinase-domain knock-in, degeneration is present at six months and more severe at twelve.
    This age-dependent cellular attrition is what makes DFNB30 a progressive rather than a static
    hearing loss.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  biological_processes:
  - preferred_term: sensory perception of sound
    modifier: DECREASED
    term:
      id: GO:0007605
      label: sensory perception of sound
  downstream:
  - target: Progressive Sensorineural Hearing Impairment
    description: >-
      Age-dependent loss of outer hair cells is the cellular correlate of the progressive
      threshold elevation seen in both mouse lines and reported in every characterised patient.
    causal_link_type: DIRECT
  - target: Postlingual Onset Hearing Loss
    description: >-
      Because the cellular loss is age-dependent rather than developmental, hearing is adequate
      through speech acquisition in the usual presentation and deteriorates afterwards.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: High-Frequency Predominant Audiometric Configuration
    description: >-
      The down-sloping audiogram reported in most patients is consistent with hair cell loss
      falling first on the high-frequency end of the cochlea. The audiometric configuration is
      the reported observation; the cochlear-gradient attribution is an inference and is not
      claimed as measured in DFNB30.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:21165622
    reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Outer hair cells of Myo3a(KI/KI) mice degenerate with age in a pattern consistent with their progressive hearing loss."
    explanation: >-
      Ties age-dependent outer hair cell loss to the progression of threshold elevation in the
      model carrying the human founding family's allele.
  - reference: PMID:30123247
    reference_title: Knock-In Mice with Myo3a Y137C Mutation Displayed Progressive Hearing Loss and Hair Cell Degeneration in the Inner Ear.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We observed degeneration in the inner ear hair cells of 6-month-old Myo3a mutant mice, and the degeneration became more severe at the age of 12 months."
    explanation: Independent replication of age-dependent hair cell loss in a second knock-in line.
phenotypes:
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    The defining feature. Hearing loss worsens over time rather than being fixed, and in the
    largest series every characterised patient was aware of progression at the time of genetic
    testing, with severity ranging from mild to profound.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  notes: >-
    Numerator/denominator: 8 of 8 clinically characterised patients in the Japanese series were
    aware of progression, which is the basis for the VERY_FREQUENT band. The founding Israeli
    family is described as progressive as a group rather than patient by patient.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of their HL varied from mild to profound, and all patients were aware of HL progression at the time of their genetic testing."
    explanation: The frequency-bearing statement behind the band, and the severity range.
  - reference: PMID:12032315
    reference_title: "From flies' eyes to our ears: mutations in a human class III myosin cause progressive nonsyndromic hearing loss DFNB30."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an extended Israeli family, nonsyndromic progressive hearing loss is caused by three different recessive, loss-of-function mutations in myosin IIIA."
    explanation: The founding description of the phenotype as nonsyndromic and progressive.
- name: Postlingual Onset Hearing Loss
  category: Auditory
  description: >-
    In the usual presentation, hearing is adequate through speech acquisition and deteriorates
    afterwards, with onset in the second or third decade. This is what distinguishes DFNB30 from
    the majority of autosomal recessive nonsyndromic hearing loss, which is prelingual.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  notes: >-
    Numerator/denominator: 8 of 8 clinically characterised patients in the Japanese series were
    post-lingual, with onset from 10 to 30 years. The band is held at FREQUENT rather than
    VERY_FREQUENT because congenital presentations are also on record elsewhere - a
    consanguineous Kazakh family and a kinase-domain ATP-binding-site allele - and the Japanese
    series is a single-ancestry cohort. The two presentations are curated as separate phenotypes
    rather than averaged into one band.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset age of their HL varied from 10 to 30 years old (mean age: 19.6 years old), and all of them presented with post-lingual deterioration in hearing."
    explanation: Numerator, onset range and post-lingual character in one sentence.
  - reference: PMID:27063751
    reference_title: Identification of a novel homozygous mutation in MYO3A in a Chinese family with DFNB30 non-syndromic hearing impairment.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we characterized a consanguineous Kazakh family with congenital hearing loss."
    explanation: >-
      Refutes post-lingual onset as an obligate feature of DFNB30: this family's hearing loss was
      congenital. Recorded against this phenotype so late onset is not read as a rule-out.
- name: Congenital Profound Sensorineural Hearing Loss
  category: Auditory
  description: >-
    The severe end of the spectrum: hearing loss present from birth and profound in degree,
    reported with a kinase-domain ATP-binding-site allele and in a consanguineous family with
    congenital onset. Whether this tracks a distinct allele class is proposed but not
    established.
  phenotype_term:
    preferred_term: Congenital profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
    onset:
      onset_category: CONGENITAL
  notes: >-
    No frequency band is given. The evidence is two families rather than a cohort, so any band
    would be manufactured from a denominator that does not exist.

    Term choice: HPO has no single post-coordinated term for *congenital* *profound* sensorineural
    hearing impairment, so the degree is bound (`HP:0011476`) and congenital onset is carried in
    the `onset` slot. `severity: SEVERE` was removed rather than kept alongside: severe (71-90 dB
    HL) and profound (>90 dB HL) are distinct audiometric bands and `SeverityEnum` has no
    `PROFOUND` value, so the qualifier asserted a milder degree than the phenotype and its source.

    The two cited sources do not support the same thing, and the split matters. PMID:34423747
    reports congenital *profound* hearing impairment segregating with the kinase-domain Lys50Arg
    allele - that sentence is where "profound" comes from. PMID:27063751 reports *congenital*
    hearing loss in the Kazakh family and does not grade it, so it supports the onset half of
    this phenotype and not the degree.
  evidence:
  - reference: PMID:34423747
    reference_title: Molecular insights into MYO3A kinase domain variants explain variability in both severity and progression of DFNB30 hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This Lys50Arg mutation segregated with congenital profound non-syndromic HI."
    explanation: >-
      The segregation observation in the reported family; graded HUMAN_CLINICAL because this
      sentence reports patients, unlike the same paper's modelling results.
  - reference: PMID:27063751
    reference_title: Identification of a novel homozygous mutation in MYO3A in a Chinese family with DFNB30 non-syndromic hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we characterized a consanguineous Kazakh family with congenital hearing loss."
    explanation: >-
      A second, independently reported congenital presentation. It supports the congenital onset
      only - this report does not grade the severity, so it is not a source for "profound".
- name: High-Frequency Predominant Audiometric Configuration
  category: Auditory
  description: >-
    The audiogram in most patients slopes downward, with the high frequencies worse affected; a
    minority have a flat configuration.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0001757
      label: High-frequency sensorineural hearing impairment
  notes: >-
    Numerator/denominator: down-sloping in 6 of 8 characterised patients, flat in the remaining
    2, which is 75% and sits in the FREQUENT band.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The types of HL were categorized as down-sloping in six, and flat in two patients."
    explanation: Numerator and denominator for the audiometric configuration.
- name: Vertigo
  category: Vestibular
  description: >-
    A minority of patients report vertigo. This is unresolved rather than established: no
    vestibular testing was obtained in the patients who reported it, and the mouse model of the
    human founding allele has normal vestibular function.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Vertigo
    term:
      id: HP:0002321
      label: Vertigo
  notes: >-
    Numerator/denominator: 2 of 8 characterised patients (25%), which sits in the OCCASIONAL
    band. The band records how often the symptom was reported, not how often vestibular
    dysfunction was demonstrated - it was not demonstrated in anyone, because the testing was
    not done in these patients. The one DFNB30 patient elsewhere in the literature who did
    receive a formal ocular-motor and vestibular examination was normal.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two individuals complained of vertigo, but the specifics are unknown."
    explanation: The numerator, with the authors' own caveat about what was not established.
  - reference: PMID:21165622
    reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "All of his ocular motor and vestibular examinations were normal, including eye movement testing, evaluation of spontaneous nystagmus with and without visual fixation, evaluation of dynamic VOR function, and positioning test for posterior and horizontal canal BPPV."
    explanation: >-
      The only formal vestibular assessment of a DFNB30 patient in the literature read here:
      subject IV:2 of the founding family, a 57-year-old profoundly deaf man homozygous for the
      nonsense allele, examined normally throughout. One patient is not a cohort, but it is a
      negative examination rather than an absence of complaint.
  - reference: PMID:21165622
    reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Myo3aKI/KImice were tested for vestibular abnormalities based on reaching response and forced swimming abilities and were normal (Supplementary Fig. 1)."
    explanation: >-
      The mouse carrying the equivalent of the human founding allele has no detectable vestibular
      deficit either, which cuts against vestibular involvement being part of the DFNB30
      mechanism.
genetic:
- name: MYO3A
  notes: >-
    Encodes myosin IIIa, a class III unconventional myosin: an N-terminal kinase domain that
    autophosphorylates, a motor head and neck, and a class-III-specific tail that binds actin.
    Expression in mammals is highly restricted, strongest in retina and cochlea, and the protein
    localises to the tips of the stereocilia of both cochlear and vestibular hair cells.

    Allelic spectrum. The founding family carried a nonsense allele plus two splice alleles;
    later reports add motor-domain and kinase-domain missense alleles. The Japanese series found
    eight possibly disease-causing variants, six of them novel, distributed across kinase, motor
    and tail domains, and looked for but did not find a genotype-phenotype correlation.

    Separately, a motor-domain missense allele has been reported to cause autosomal *dominant*
    nonsyndromic hearing loss, segregating in a family with post-lingual progressive deafness.
    That is an allelic disease with a different inheritance pattern, not part of DFNB30, and is
    recorded here so a MYO3A variant report is not automatically read as recessive.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MYO3A
    term:
      id: hgnc:7601
      label: MYO3A
  evidence:
  - reference: PMID:12032315
    reference_title: "From flies' eyes to our ears: mutations in a human class III myosin cause progressive nonsyndromic hearing loss DFNB30."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that normal hearing in humans requires myosin IIIA, the human homolog of NINAC."
    explanation: The gene-disease assertion in its founding form.
  - reference: PMID:12032315
    reference_title: "From flies' eyes to our ears: mutations in a human class III myosin cause progressive nonsyndromic hearing loss DFNB30."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of mammalian myosin IIIA is highly restricted, with the strongest expression in retina and cochlea."
    explanation: >-
      The expression pattern, which is why the gene is a plausible deafness gene and also why
      retinal involvement is a live question rather than an excluded one.
  - reference: PMID:26841241
    reference_title: MYO3A Causes Human Dominant Deafness and Interacts with Protocadherin 15-CD2 Isoform.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "In a family with post-lingual progressive non-syndromic deafness, whole-exome sequencing of genomic DNA from five hearing-impaired relatives revealed a single variant, p.Gly488Glu (rs145970949:G>A) in MYO3A, co-segregating with HL as an autosomal dominant trait."
    explanation: >-
      Graded NO_EVIDENCE with respect to DFNB30: this reports a dominant allelic disease, so it
      neither supports nor refutes the recessive entity, and it is cited only to keep the two
      apart.
prevalence:
- population: Japanese hearing-loss patients screened by massively parallel sequencing
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    9 probands with biallelic MYO3A variants out of 15,684 ascertained Japanese hearing-loss
    patients - 0.06% of a disease-ascertained cohort, which is a diagnostic yield and not a
    population prevalence. `measure_type` and `prevalence_class` are left UNKNOWN rather than
    converted to a rate, because the denominator is people who already have hearing loss. No
    population prevalence for DFNB30 has been published, and the entry does not invent one.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYO3A is a relatively rare causative gene, and the prevalence of MYO3A-associated HL among Japanese HL patients is 0.06% (9/15,684)."
    explanation: Numerator, denominator and proportion in one sentence.
- population: Cases reported in the literature worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Reported case counts are small. The 2025 series describes DFNB30 as having only 13 cases
    reported to that point, before adding its own nine probands.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MYO3A gene is a rare causative gene of ARNSHL (DFNB30), with only 13 cases reported to date"
    explanation: The published case count for the disease before this series.
progression:
- phase: Onset
  age_range: congenital to third decade
  notes: >-
    Onset is bimodal across the literature and this entry does not collapse it. The Japanese
    series gives 10-30 years with a mean of 19.6; congenital onset is reported in a
    consanguineous Kazakh family and with a kinase-domain ATP-binding-site allele.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset age of their HL varied from 10 to 30 years old (mean age: 19.6 years old), and all of them presented with post-lingual deterioration in hearing."
    explanation: The late-onset arm of the range.
  - reference: PMID:34423747
    reference_title: Molecular insights into MYO3A kinase domain variants explain variability in both severity and progression of DFNB30 hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This Lys50Arg mutation segregated with congenital profound non-syndromic HI."
    explanation: The congenital arm of the range.
- phase: Deterioration
  age_range: adulthood
  notes: >-
    Deterioration to severe-to-profound hearing loss is the expected trajectory in the reported
    series, which is the stated reason for recommending regular follow-up.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, most of the cases identified in this study and previous reports showed progressive HL, eventually progressing to severe-to-profound HL."
    explanation: States the trajectory across this series and prior reports.
treatments:
- name: Hearing Aid Amplification
  description: >-
    Acoustic amplification for the earlier, milder phase of the loss. It compensates for the
    threshold elevation produced by hair cell loss; it does not act on the MYO3A defect, and the
    cohort authors are explicit that quality of life still deteriorates despite it.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Progressive Sensorineural Hearing Impairment
    treatment_effect: MODULATES
    description: >-
      Symptomatic: amplification restores audibility without altering the underlying hair cell
      loss, so it is recorded against the phenotype rather than an upstream mechanism node.
    evidence:
    - reference: PMID:39858639
      reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, frequent follow-up and clinical intervention, including the provision of hearing aids and cochlear implantation, should be considered."
      explanation: The management recommendation for MYO3A-associated hearing loss.
  notes: >-
    NCIT has no clinical-action term for hearing aid use, so the bound action term is
    Rehabilitation and the device identity is carried as a `qualifiers` predicate-value pair -
    the device pattern described in CLAUDE.md, since NCIT:C183182 is not reachable from
    NCIT:C25218 and cannot sit in the `term:` slot.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients will have to adjust their lifestyles, and regardless of the provision of hearing aids and cochlear implantation, deterioration in their quality of life is inevitable."
    explanation: >-
      Records both that amplification is used and the authors' assessment of its limits - it does
      not arrest the disease.
- name: Cochlear Implantation
  description: >-
    Surgical placement of a cochlear implant once the loss reaches severe-to-profound degree.
    Like amplification it bypasses the failed hair cells rather than correcting the myosin IIIa
    defect.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Progressive Hair Cell Degeneration
    treatment_effect: BYPASSES
    description: >-
      An implant stimulates the cochlear nerve directly, which is why it works when hair cells
      have been lost - it bypasses the degenerating cells rather than rescuing them.
    evidence:
    - reference: PMID:39858639
      reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, frequent follow-up and clinical intervention, including the provision of hearing aids and cochlear implantation, should be considered."
      explanation: >-
        Places implantation in the management of this disease. Note the cited series did not
        report implant outcomes - its authors name that as future work - so this link records
        the indication and not a measured benefit in DFNB30.
  notes: >-
    Outcome data specific to MYO3A-associated hearing loss are absent: the largest series states
    that evaluating hearing aid and cochlear implant outcomes remains to be done. The treatment
    is recorded because it is the recommended intervention, not because its benefit has been
    measured in this genotype.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the evaluation of the outcomes of hearing aids or cochlear implantation will also be useful."
    explanation: >-
      The authors' own statement that outcome evaluation is outstanding, which is the honest
      grade for this treatment in DFNB30.
diagnosis:
- name: Age-appropriate audiometry
  description: >-
    Establishing that the loss is sensorineural and characterising its configuration. Because
    onset is usually in the second or third decade, most patients are testable by pure-tone
    audiometry; the paediatric presentations need behavioural or evoked-response methods instead.
    The configuration is diagnostically useful in itself - down-sloping in most patients, flat in
    a minority.
  diagnosis_term:
    preferred_term: audiometric assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Sensorineural loss, mild to profound, usually down-sloping.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pure-tone audiometry was used to assess hearing thresholds for patients aged 5 years and above, whereas auditory steady state response (ASSR), conditioned orientation response audiometry (COR: one type of the behavioral audiometry), or play audiometry were used for individuals under 5 years old."
    explanation: >-
      The audiometric methods used in the largest series, including the age threshold at which
      they switch.
  notes: >-
    The cited source does not report otoacoustic emissions or auditory brainstem response as part
    of its protocol beyond ASSR, so neither is claimed here even though both are standard in
    hearing-loss workups generally. NCIT has no clinical-action term for audiometry that is
    reachable from NCIT:C25218, so the bound term is the general Clinical Evaluation term and
    `preferred_term` carries the specificity.
- name: Serial audiometry to establish progression
  description: >-
    The feature that distinguishes DFNB30 from most autosomal recessive nonsyndromic hearing loss
    is that it gets worse, so a single audiogram is not enough - the diagnosis rests on a
    trajectory. Every clinically characterised patient in the largest series was aware of
    progression, and the correlation of threshold with age was visible across the cohort even
    though serial audiograms on individual patients were not available.
  diagnosis_term:
    preferred_term: serial audiometric follow-up
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Documented deterioration of thresholds over time, eventually to severe-to-profound loss.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A further prospective study will be useful in evaluating hearing deterioration through the use of the serial audiometric testing results from the same patient."
    explanation: >-
      The authors identify serial audiometry on the same patient as the measurement their study
      lacked, which is what makes it the diagnostic step worth naming.
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, most of the cases identified in this study and previous reports showed progressive HL, eventually progressing to severe-to-profound HL."
    explanation: The trajectory that serial audiometry is looking for.
- name: Massively parallel sequencing of a hearing-loss gene panel
  description: >-
    MYO3A is not a gene anybody reaches by clinical suspicion - the phenotype is nonsyndromic and
    the audiogram is unremarkable - so in practice the diagnosis is made by multi-gene panel or
    exome. In the largest series it came from a 158-gene panel covering nonsyndromic and syndromic
    hearing loss, with copy-number analysis run over the same read-depth data. Biallelic variants
    are required, and the phase matters.
  diagnosis_term:
    preferred_term: molecular analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic MYO3A variants - homozygous or compound heterozygous.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these subjects, we selected patients with biallelic MYO3A variants through MPS of 158 target genes."
    explanation: The testing modality and the biallelic requirement in one sentence.
- name: Variant interpretation under the ClinGen hearing-loss specification
  description: >-
    Interpretation is the step where a MYO3A result most often stalls, because the gene is rare
    enough that novel variants dominate. In the largest series six of eight variants were novel,
    four reached likely pathogenic and two remained variants of uncertain significance - so a
    negative-looking report may mean an uninterpretable variant rather than an absent one.
  diagnosis_term:
    preferred_term: variant classification
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Classification against ACMG/AMP criteria as specified for hearing loss; VUS outcomes are common.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenicity of identified variants was evaluated according to the American College of Medical Genetics (ACMG) standards and guidelines"
    explanation: >-
      The interpretation framework used. The cited sentence continues by naming the ClinGen
      Hearing Loss Clinical Domain Working Group Expert Specification, but that clause is quoted
      here without its bracketed reference markers, which the snippet validator strips - so the
      quote stops at the ACMG guidelines and the hearing-loss specialisation is stated in this
      explanation rather than being claimed as quoted text.
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the ACMG guidelines, four of these novel variants were categorized as likely pathogenic, and two as variants of uncertain significance."
    explanation: >-
      The yield of that framework on this gene, and the basis for warning that VUS outcomes are
      common here.
differential_diagnoses:
- name: Age-related hearing loss (presbycusis)
  description: >-
    The main differential in practice, and the reason DFNB30 is underdiagnosed. A down-sloping,
    progressive, post-lingual sensorineural loss beginning in the second or third decade is the
    audiometric shape of presbycusis arriving early; the distinguishing features are the age of
    onset and a family history, not the audiogram.
  distinguishing_features:
  - Onset in the second or third decade rather than in late middle age
  - Biallelic MYO3A variants on panel or exome testing
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the elucidation of HL causation becomes more challenging when related to late-onset HL, as multiple factors, such as presbycusis, idiopathic sudden SNHL, environmental risk factors, etc., can be involved."
    explanation: >-
      Names presbycusis and idiopathic sudden sensorineural hearing loss as the confounders for
      exactly the presentation DFNB30 produces.
- name: Idiopathic sudden sensorineural hearing loss
  description: >-
    Cited in the same breath as presbycusis as a confounder of late-onset hearing loss. The
    distinction should be straightforward on history - sudden versus gradual - but it is listed
    because the two are conflated in practice when a patient presents after a period of
    unrecognised deterioration.
  distinguishing_features:
  - Abrupt onset over hours to days rather than progressive deterioration over years
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the elucidation of HL causation becomes more challenging when related to late-onset HL, as multiple factors, such as presbycusis, idiopathic sudden SNHL, environmental risk factors, etc., can be involved."
    explanation: The same sentence names it as a competing explanation for late-onset hearing loss.
- name: Other autosomal recessive nonsyndromic hearing loss, principally GJB2, SLC26A4 and CDH23
  description: >-
    The genes that account for most autosomal recessive nonsyndromic hearing loss and that a panel
    will solve first. They are separated from DFNB30 by the panel result rather than clinically,
    which is the point: MYO3A is roughly 0.06% of an ascertained hearing-loss cohort against
    GJB2's 16%, so it is a diagnosis of exclusion within the panel.
  distinguishing_features:
  - Biallelic variants in the respective gene rather than in MYO3A
  - GJB2-related loss is typically prelingual, against the post-lingual onset usual in DFNB30
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major causative genes of ARSNHL in Japanese patients are GJB2 (16%), SLC26A4 (5%) and CDH23 (4%), and the detection of causative genes for HL has become significantly more achievable through the introduction of massively parallel DNA sequencing (MPS) analysis [5]."
    explanation: >-
      The relative contributions that make MYO3A a late candidate on any panel, in the same
      population where the MYO3A rate was measured.
- name: Autosomal dominant MYO3A-related hearing loss
  description: >-
    The same gene, a different disease. A motor-domain missense allele segregates as an autosomal
    dominant trait, so a MYO3A variant report does not by itself establish DFNB30 - the zygosity
    and the segregation do.
  distinguishing_features:
  - Heterozygous rather than biallelic MYO3A variant
  - Dominant segregation through the family rather than affected sibs of unaffected parents
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It should be noted that variations in the MYO3A gene had been thought to cause ARNSHL (DFNB30), but were reported as a genetic cause of autosomal dominant HL"
    explanation: >-
      States the allelic-disease problem directly: a MYO3A finding has to be resolved to one of
      two inheritance patterns before it names a disease.
animal_models:
- name: Myo3a knock-in mouse (human nonsense allele equivalent)
  species: Mouse
  genotype: Myo3a(KI/KI), knock-in of the mouse equivalent of the human MYO3A nonsense allele
  publication: PMID:21165622
  description: >-
    The closest available model of human DFNB30: it carries the mouse equivalent of the nonsense
    allele responsible for the most severe phenotype in the founding family, and it reproduces
    adult-onset progressive hearing loss with outer hair cell degeneration and normal vestibular
    function.
  modeled_mechanisms:
  - target: Progressive Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Age-dependent outer hair cell degeneration tracking progressive threshold elevation,
      produced by the mouse equivalent of a human DFNB30 allele.
    limitations: >-
      Mouse cochlear ageing is compressed relative to human, so the timing of degeneration
      cannot be transferred to human onset ages; and the model carries only the nonsense allele,
      not the missense alleles that produce the congenital profound human presentation.
    readouts:
    - name: Auditory brainstem response threshold
      target: Progressive Hair Cell Degeneration
      direction: ALTERED
      interpretation: >-
        Thresholds worsen with age, which is the functional correlate of the degeneration node.
      evidence:
      - reference: PMID:21165622
        reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Hearing loss, as measured by auditory brainstem response, is reduced and progresses significantly with age."
        explanation: The functional measurement behind this readout.
    - name: Outer hair cell survival
      target: Progressive Hair Cell Degeneration
      direction: DECREASED
      interpretation: Structural correlate of the degeneration node in this model.
      evidence:
      - reference: PMID:21165622
        reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Outer hair cells of Myo3a(KI/KI) mice degenerate with age in a pattern consistent with their progressive hearing loss."
        explanation: The histological measurement behind this readout.
    evidence:
    - reference: PMID:21165622
      reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The phenotype of the Myo3a(KI/KI) mouse parallels the phenotype of human DFNB30."
      explanation: The authors' own assessment that this model is informative for the human disease.
  - target: Failure of Myosin IIIa Delivery to Stereocilia Tips
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mutant protein is absent from stereocilia tips where wild-type myosin IIIa localises,
      which is the direct cellular readout of this node.
    limitations: >-
      Localisation was assayed in mouse cochlea; no equivalent measurement exists in human
      DFNB30 tissue.
    readouts:
    - name: Myosin IIIa immunolocalisation at stereocilia tips
      target: Failure of Myosin IIIa Delivery to Stereocilia Tips
      direction: ABOLISHED
      interpretation: Tip-localised myosin IIIa is lost in the mutant.
      evidence:
      - reference: PMID:21165622
        reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Myosin IIIA, with a unique N-terminal kinase domain and a C-terminal actin-binding domain, localizes to the tips of stereocilia in wild-type mice but is absent in the mutant."
        explanation: The localisation measurement behind this readout.
- name: Myo3a Y137C knock-in mouse
  species: Mouse
  genotype: Myo3a Y137C kinase-domain missense knock-in, generated by CRISPR/Cas9
  publication: PMID:30123247
  description: >-
    A second, independently generated knock-in carrying a kinase-domain missense allele. Hearing
    is normal at two months and thresholds are elevated from six months, with hair cell
    degeneration and stereocilia structural abnormality.
  modeled_mechanisms:
  - target: Disordered Stereocilia and Hair Bundle Architecture
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Structural abnormality of cochlear hair cell stereocilia in a single-gene Myo3a mutant.
    limitations: >-
      The stereocilia abnormality is described qualitatively rather than quantified, and Y137C
      is a mouse-engineered allele rather than one reported in a DFNB30 patient.
    readouts:
    - name: Cochlear hair cell stereocilia structure

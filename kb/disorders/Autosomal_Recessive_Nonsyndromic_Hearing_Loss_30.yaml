pathophysiology:
- name: MYO3A Loss of Function
  description: >-
    Biallelic loss-of-function variants remove or disable myosin IIIa. The founding family
    carried a nonsense allele truncating the C terminus of the motor head plus two splice
    alleles, and later families carry missense alleles in the motor and kinase domains. Myosin
    IIIa is a hybrid motor-signalling molecule: an N-terminal kinase domain that
    autophosphorylates and down-regulates the motor, a conserved head and neck, and a
    class-III-specific tail that binds actin and is required for tip targeting.

    The allele class matters for what follows. A computational study of kinase-domain variants
    proposes that abolishing kinase activity and autophosphorylation produces the congenital
    profound phenotype, while partial or complete inactivation of the protein produces the
    late-onset progressive one. That is a structural-modelling proposal rather than an
    established rule, and the largest patient series looked for a genotype-phenotype correlation
    and did not observe one.

name: Autosomal Recessive Nonsyndromic Hearing Loss 30
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- DFNB30
- Deafness, autosomal recessive 30
- MYO3A-associated hearing loss
- Autosomal recessive nonsyndromic deafness 30
description: >-
  DFNB30 is autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic pathogenic MYO3A
  variants. Myosin IIIa combines an N-terminal regulatory kinase, an actin-based motor and a cargo-binding
  tail and localizes to hair-cell stereocilia tips. Bilateral, progressive, high-frequency hearing loss was
  described in the founding Iraqi Jewish family; congenital profound presentations also occur. Onset and severity
  vary, and available families do not establish a universal genotype-phenotype rule. Mouse and cell studies
  implicate stereocilia regulation and maintenance, but failed espin-1 delivery, loss of tip localization and
  normal mechanotransduction are not established universal features of DFNB30. In a nonsense knock-in mouse,
  hearing deficits precede visible hair-cell degeneration. The MYO3A variants associated with dominant hearing
  loss require separate allele-specific interpretation.
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 30
  term:
    id: MONDO:0011774
    label: autosomal recessive nonsyndromic hearing loss 30
parents:
- Nonsyndromic Hearing Loss
notes: >-
  Human evidence consists of families and small referral cohorts. The 2025 Japanese series reported nine candidate
  probands among 15,684 hearing-loss patients, with clinical data for eight. Two genotypes include variants
  classified as uncertain, and family segregation was unavailable. Its proportions describe this selected series
  rather than phenotype frequencies in genetically confirmed DFNB30. Reported normal vision and balance in
  the founding family support its nonsyndromic characterization; these observations do not establish lifelong
  retinal protection. Vertigo reported in two Japanese probands remains uncertain because both carried a VUS
  and neither had characterized vestibular testing. Mouse and cell experiments inform the mechanisms, with
  explicit limits on transfer to patients.

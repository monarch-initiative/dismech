- Nonsyndromic Hearing Loss
notes: >-
  Identifiers. OMIM #607101 (DFNB30) and OMIM 606808 (MYO3A) are the OMIM keys for this concept.
  They are recorded in prose because the schema's `mappings` block carries `mondo_mappings` only
  and has no slot for an OMIM identifier.

  Evidence base and its shape. The human evidence for DFNB30 is thin and it is worth being
  explicit about how thin: the founding report (PMID:12032315) is one extended family, the
  second report (PMID:27063751) is one consanguineous family, and the largest series
  (PMID:39858639) is nine probands - which its authors describe as the largest group reported to
  date. Every frequency band in this entry that carries a number comes from that nine-proband
  series, with eight patients clinically characterised, so the denominators are small and are
  stated in the phenotype notes rather than hidden behind a band.

  Mechanism evidence is mostly non-human, and is graded that way. The espin-1 transport work
  (PMID:19287378) is cell culture and organotypic culture; the bundle-shaping work
  (PMID:26754646) and the two knock-in mouse lines (PMID:21165622, PMID:30123247) are mouse. The
  mouse work is unusually well matched to the human disease in one specific respect - the
  Myo3a knock-in carries the mouse equivalent of the human nonsense allele from the founding
  family, and it reproduces adult-onset progressive hearing loss with outer hair cell
  degeneration - so it is treated here as a strong model, but never as the sole support for a
  human phenotype.

  Two things this entry deliberately does not assert. First, it does not claim that DFNB30
  spares the retina. Myosin IIIa is expressed strongly in retina as well as cochlea
  (PMID:12032315) and the largest cohort states that MYO3A variations cause hearing loss without
  accompanying symptoms, but no source read here reports a systematic ophthalmological
  assessment of DFNB30 patients, so the entry records the nonsyndromic characterisation as it is
  written and stops there. Second, it does not resolve vestibular involvement. Two of eight
  patients in the Japanese series reported vertigo without vestibular testing; the one patient
  who was formally examined, and the knock-in mouse, were both normal. All three are recorded,
  including the disagreement.

  Bilaterality is not curated. The word "bilateral" appears in none of the nine cited references,
  so although DFNB30 is a recessive cochlear disease and bilateral involvement is what one would
  expect, the entry does not bind `HP:0008619` on that expectation. This is a gap in the sources,
  not an assertion of unilaterality.

  Deep research. A Falcon deep-research report is committed alongside this entry. It passed
  `just preflight-dr` against MONDO:0011774 with MYO3A mentioned 52 times, and its reference
  validation resolved 8 of 8 citations with a confabulation rate of 0. It was used as a lead
  source only: every snippet below is anchored to a PMID fetched into `references_cache/` and
  read directly. Where the report and the primary literature disagreed - the report presents the
  espin-1 transport account as the mechanism - this entry follows the primary literature and
  records the contradiction as a discussion.

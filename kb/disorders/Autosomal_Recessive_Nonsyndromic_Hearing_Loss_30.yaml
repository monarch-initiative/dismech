discussions:
- discussion_id: dfnb30_retinal_involvement_unassessed
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does DFNB30 involve the retina, and has anyone looked?
  attaches_to:
  - phenotypes#
  rationale: >-
    Myosin IIIa is expressed most strongly in retina and cochlea, and the fly ortholog NINAC is a
    photoreceptor protein whose loss causes progressive retinal degeneration - which is the
    comparison the founding paper itself draws. The disease is nonetheless classified as
    nonsyndromic, and the largest series states that MYO3A variations cause hearing loss without
    accompanying symptoms. No source read for this entry reports a systematic ophthalmological
    or electroretinographic assessment of DFNB30 patients, so "nonsyndromic" here rests on the
    absence of volunteered complaints rather than on a negative examination. The gap is worth
    recording because the expression pattern makes retinal involvement a specific, testable
    prediction rather than a generic possibility.
- discussion_id: dfnb30_espin1_transport_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the espin-1 cargo-transport model the mechanism of DFNB30, given that espin-1 still
    reaches stereocilia tips in mice lacking both class III myosins?
  attaches_to:
  - pathophysiology#Failure of Myosin IIIa Delivery to Stereocilia Tips
  rationale: >-
    The cargo-transport account comes from co-expression in COS-7 cells and organotypic culture,
    where myosin IIIa and espin-1 together elongate protrusions about tenfold and the effect
    depends on the transport step. In the intact double-mutant mouse ear, espin-1 was
    nonetheless properly targeted to stereocilia tips, and the bundle phenotype was excess rather
    than deficient elongation - the opposite direction. So the in-vitro mechanism does not
    transfer cleanly to the in-vivo one, and it is not known which account applies to the human
    disease. This is recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    evidence exists and points two ways, depending on the system.
- discussion_id: dfnb30_kinase_domain_genotype_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do MYO3A kinase-domain alleles really separate congenital profound from late-onset
    progressive hearing loss?
  attaches_to:
  - pathophysiology#MYO3A Loss of Function
  rationale: >-
    A structural-modelling study proposes exactly this split - kinase-dead alleles giving
    congenital profound disease, partial inactivation giving the late-onset progressive form -
    and it is the only mechanistic account on offer for the bimodal onset. But the largest
    patient series, with variants spread across kinase, motor and tail domains, looked for a
    genotype-phenotype correlation and did not observe one. Resolving this needs allele-resolved
    phenotyping across more families than currently exist, which is why the entry states the
    proposal and its contradiction rather than adopting either.

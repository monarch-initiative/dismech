    description: >-
      Reproduces disordered bundle architecture, but only when both class III myosins are
      removed - so it speaks to the pathway rather than to the human single-gene disease.
    limitations: >-
      DFNB30 patients have biallelic MYO3A variants with MYO3B intact, and the single-mutant
      comparison in this study shows that losing myosin IIIa postnatally on a Myo3b-null
      background leaves hearing normal. The bundle phenotype here therefore overstates what MYO3A
      loss alone produces.

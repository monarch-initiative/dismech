- name: Altered Myosin IIIa Function at Stereocilia Tips
  description: >-
    Myosin IIIa regulates actin protrusions at stereocilia tips. Espin-1 binding and transport were demonstrated
    in COS-7 cells and organotypic hair-cell cultures. The roughly tenfold filopodial elongation used kinase-deleted
    MYO3A with espin-1; wild-type MYO3A and kinase-dead K50R produced smaller effects. These construct-dependent
    results do not establish obligatory espin-1 delivery failure in DFNB30. Espin-1 still localized to tips
    in constitutive Myo3a/Myo3b double-null mouse hair cells. In the nonsense knock-in, C-terminal myosin IIIa
    immunoreactivity was absent, but the antibody epitope lies beyond the truncation; this assay cannot exclude
    an N-terminal truncated protein or establish loss of localization for every disease allele.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: stereocilium tip
    term:
      id: GO:0032426
      label: stereocilium tip
  downstream:
  - target: Disordered Stereocilia and Hair Bundle Architecture
    description: Loss or alteration of class III myosin regulation can disrupt bundle architecture in mice; timing and severity depend on allele, paralogue and developmental stage.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Cochlear Hearing Dysfunction
    description: An early functional deficit is supported by abnormal ABR thresholds before visible degeneration in the nonsense knock-in. The intervening cellular defect was not measured directly.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Progressive Hair Cell Degeneration
    description: Impaired myosin IIIa function is followed by hair-cell degeneration in knock-in mice; the molecular steps causing cell death remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

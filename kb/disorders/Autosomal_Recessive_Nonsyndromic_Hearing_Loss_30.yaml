name: Autosomal Recessive Nonsyndromic Hearing Loss 30
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- DFNB30
- Deafness, autosomal recessive 30
- MYO3A-associated hearing loss
- Autosomal recessive nonsyndromic deafness 30
description: >-
  DFNB30 is nonsyndromic sensorineural hearing loss caused by biallelic variants in MYO3A,
  which encodes myosin IIIa - a class III unconventional myosin with an N-terminal kinase
  domain, a motor head, and a tail that binds actin. It was the first human disease attributed
  to a class III myosin, found in an extended Israeli family in which eighteen affected
  relatives carried three different recessive loss-of-function alleles, and the same paper
  noted the evolutionary echo that made the finding interesting: the fly ortholog NINAC is
  required for normal vision, and mammalian myosin IIIa is expressed most strongly in retina
  and cochlea.

  The mechanism is a transport and shaping defect at the tips of hair-cell stereocilia rather
  than a mechanotransduction-channel defect. Myosin IIIa sits at stereocilia tips - the site of
  actin polymerisation - and carries espin-1 there; in heterologous cells the pair together
  elongate filopodia roughly tenfold, and that elongation depends on myosin IIIa doing the
  transporting. What the class III myosins do in the intact ear turns out to be more subtle
  than "make stereocilia longer": mice lacking both myosin IIIa and IIIb build abnormally tall
  and numerous stereocilia and microvilli with ungraded bundles, so the motors are also acting
  to *limit* elongation and to shape the bundle. Notably espin-1 still reached the tips in
  those double mutants, which means the espin-1 transport model cannot be the whole account.

  Clinically the usual DFNB30 presentation is late and progressive rather than congenital. In
  the largest series - nine probands out of 15,684 Japanese hearing-loss patients - onset was
  between 10 and 30 years, every patient was post-lingual, every patient was aware of
  progression, and the audiogram was down-sloping in six of eight. But a congenital profound
  presentation is also on record, in a consanguineous Kazakh family and with a kinase-domain
  ATP-binding-site allele, and a computational study of kinase-domain variants proposes that
  this is where the two ends of the phenotype come from: alleles that abolish kinase activity
  and autophosphorylation give the congenital profound form, while partial inactivation gives
  the late-onset progressive one. That proposal is modelling, not a validated genotype-phenotype
  rule, and the largest cohort explicitly looked for a genotype-phenotype correlation and did
  not find one.

  MYO3A is also reported in autosomal dominant hearing loss, through a motor-domain allele that
  cripples ATPase activity and motility. That is a separate allelic disease and is recorded here
  only as context, not as part of DFNB30.
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 30
  term:
    id: MONDO:0011774
    label: autosomal recessive nonsyndromic hearing loss 30

    snippet: The sensitivity of the MET response, measured by determining the maximum slope of the MET current-deflection relationship, was lower than that in controls for both IHCs and OHCs
    explanation: P7-P8 apical double-null recordings; preserved adaptation did not imply normal response sensitivity.
- name: Progressive Hair Cell Degeneration
  description: >-
    Age-dependent cochlear hair-cell loss occurs in two Myo3a knock-in lines. In the nonsense model, ABR deficits
    were significant at 2.5 months, but bundles appeared normally shaped through 8.5 months and degeneration
    was described at ten and seventeen months. Thus degeneration can contribute to later deterioration but
    does not explain the earliest measured deficit. In the Y137C model, hearing was normal at two months; hearing
    deficits, stereocilia abnormalities and hair-cell degeneration were present at six months and worsened
    at twelve months. Human cochlear tissue has not established this sequence directly.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: Cochlear Hearing Dysfunction
    description: Loss of cochlear hair cells reduces sensory capacity and can contribute to late hearing deterioration. It does not account for the earlier deficit in the nonsense knock-in.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an extended Israeli family, nonsyndromic progressive hearing loss is caused by three different recessive, loss-of-function mutations in myosin IIIA."
    explanation: Establishes loss of myosin IIIA function as the initiating lesion in humans.
  - reference: PMID:34423747
    reference_title: Molecular insights into MYO3A kinase domain variants explain variability in both severity and progression of DFNB30 hearing impairment.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "Our results suggest that KD mutations could either cause a congenital profound form of HI, when particularly affecting the kinase activity and preventing the auto-phosphorylation of the motor, or a late onset and progressive form, when partially or completely inactivating the MYO3A protein."
    explanation: >-
      Molecular-dynamics and structural modelling of kinase-domain variants; it proposes the
      allele-class split recorded in this node's description and is graded COMPUTATIONAL and
      INDIRECT because the phenotype claim follows from modelling rather than from measurement
      in patients.
  - reference: PMID:19287378
    reference_title: Myosin IIIa boosts elongation of stereocilia by transporting espin 1 to the plus ends of actin filaments.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Full-length myosin IIIa K50R localizes more efficiently to the tips of filopodia in COS-7 cells

inheritance:
- name: Autosomal recessive
  description: >-
    Recessive MYO3A-associated hearing loss occurs with homozygous or compound heterozygous pathogenic variants.
    The founding family came from the endogamous Jewish community of Mosul, Iraq; 18 affected relatives included
    seven homozygotes and eleven compound heterozygotes. Other families were consanguineous. Distinct MYO3A
    alleles can cause dominant hearing loss, so gene identity alone does not determine inheritance.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:12032315
    reference_title: "From flies' eyes to our ears: mutations in a human class III myosin cause progressive nonsyndromic hearing loss DFNB30."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 18 affected relatives in Family N, 7 are homozygous and 11 are compound heterozygous for pairs of mutant alleles."
    explanation: >-
      The founding family establishes recessive inheritance in both homozygous and compound
      heterozygous configurations.
  - reference: PMID:27063751
    reference_title: Identification of a novel homozygous mutation in MYO3A in a Chinese family with DFNB30 non-syndromic hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous mutation, MYO3A:c.1841C>T (p.S614F), was identified to be responsible for the disease."
    explanation: Independent confirmation of recessive inheritance in a consanguineous family.
pathophysiology:
- name: MYO3A Loss of Function
  description: >-
    Biallelic pathogenic MYO3A variants impair myosin IIIa function. The founding family carried a nonsense
    allele and two splice-acceptor alleles. Lymphoblast RNA showed exon 18 skipping for one splice allele and
    loss of stable message from the other; these are measured RNA effects outside the cochlea. Missense variants
    also occur in motor and kinase domains, but reduced kinase activity is not equivalent to loss of motor
    activity: experimentally engineered K50R retains motor activity and increases tip localization in COS-7
    cells. The clinical K50R report combined family segregation with structural modelling and earlier in-vitro
    evidence. Its proposed distinction between kinase-specific impairment and whole-protein dysfunction is
    not a validated general predictor of onset or severity.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYO3A
    term:
      id: hgnc:7601
      label: MYO3A
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Established truncating and splice alleles support loss of function; individual missense variants require
      allele-specific evidence and cannot all be assumed to abolish both kinase and motor activities.
  downstream:
  - target: Altered Myosin IIIa Function at Stereocilia Tips
    description: Variant-specific loss or alteration of myosin IIIa disrupts its regulation of stereocilia; the surviving protein and localization depend on the allele.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:

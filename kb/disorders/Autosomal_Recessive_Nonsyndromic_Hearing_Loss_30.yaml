genetic:
- name: MYO3A
  notes: >-
    MYO3A encodes a class III myosin with kinase, motor and tail domains. In the founding family, a nonsense
    allele and two splice alleles segregated as recessive disease; lymphoblast transcript assays supported
    exon skipping or unstable message for the splice variants. Between ages 25 and 50, nonsense homozygotes
    had poorer hearing than nonsense/splice compound heterozygotes, with similarly severe loss later in life.
    This is a within-family association, not a universal prediction for all alleles. The Japanese series identified
    eight candidate variants, two classified as uncertain (p.Glu770Lys and p.Ala238Thr), and lacked familial
    segregation. Its failure to find a correlation does not negate the earlier family-specific observation.
    Dominant MYO3A alleles require separate assessment; simple heterozygosity for an established recessive
    allele is not itself diagnostic of dominant hearing loss.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MYO3A
    term:
      id: hgnc:7601
      label: MYO3A
  evidence:
  - reference: PMID:12032315
    reference_title: "From flies' eyes to our ears: mutations in a human class III myosin cause progressive nonsyndromic hearing loss DFNB30."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that normal hearing in humans requires myosin IIIA, the human homolog of NINAC."
    explanation: The gene-disease assertion in its founding form.
  - reference: PMID:12032315
    reference_title: "From flies' eyes to our ears: mutations in a human class III myosin cause progressive nonsyndromic hearing loss DFNB30."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Between ages 25 and 50, hearing across all frequencies was significantly poorer among individuals homozygous for the nonsense mutation
    explanation: Within-family genotype association, comparing nonsense homozygotes with nonsense/splice compound heterozygotes.
  - reference: PMID:39858639
    reference_title: "The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As we were not able to conduct segregation analyses on the families of the probands due to a lack of peripheral blood samples, it is possible that the HL was due to other causes
    explanation: Authors explicitly acknowledge uncertain attribution in the Japanese candidate series.
prevalence:
- population: Japanese hearing-loss patients screened by massively parallel sequencing
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Nine candidate probands were identified among 15,684 Japanese hearing-loss patients (reported 0.06%). Two
    genotypes included a VUS and familial segregation was unavailable, so this is a candidate detection proportion
    in a referral cohort, not confirmed diagnostic yield or population prevalence. Eight probands had clinical
    data. Literature case summaries cannot be treated as a complete count of affected individuals: the founding
    family alone contained eighteen affected relatives.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYO3A is a relatively rare causative gene, and the prevalence of MYO3A-associated HL among Japanese HL patients is 0.06% (9/15,684)."
    explanation: Numerator, denominator and proportion in one sentence.
  - reference: PMID:39858639
    reference_title: "The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As we were not able to conduct segregation analyses on the families of the probands due to a lack of peripheral blood samples, it is possible that the HL was due to other causes
    explanation: Authors explicitly acknowledge uncertain attribution in the Japanese candidate series.
progression:
- phase: Onset
  age_range: congenital to third decade
  notes: >-
    Reported onset spans congenital hearing loss and postlingual onset. The Japanese candidate series reported
    10-30 years; small selected families do not demonstrate a bimodal population distribution.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset age of their HL varied from 10 to 30 years old (mean age: 19.6 years old), and all of them presented with post-lingual deterioration in hearing."
    explanation: The late-onset arm of the range.
  - reference: PMID:34423747
    reference_title: Molecular insights into MYO3A kinase domain variants explain variability in both severity and progression of DFNB30 hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This Lys50Arg mutation segregated with congenital profound non-syndromic HI."
    explanation: The congenital arm of the range.
- phase: Deterioration
  age_range: adulthood
  notes: >-
    Progression to severe or profound loss was observed in reported families and described in the Japanese
    series. Its cross-sectional age-threshold relationship and self-reported progression do not establish an
    individual deterioration rate or an inevitable outcome for every allele.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, most of the cases identified in this study and previous reports showed progressive HL, eventually progressing to severe-to-profound HL."
    explanation: States the trajectory across this series and prior reports.
treatments:
- name: Hearing Aid Amplification
  description: >-
    Hearing aids can improve access to sound when appropriate for measured hearing levels and communication
    goals. Acoustic amplification uses residual auditory function; it does not bypass hair cells or correct
    MYO3A dysfunction. The Japanese series recommends rehabilitation but does not measure DFNB30-specific hearing-aid
    outcomes.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: customized by an audiologist to the degree and frequency of hearing loss, can be used in individuals with mild-to-severe hearing loss.
    explanation: General hereditary-hearing-loss guidance, not a DFNB30 outcome study.
- name: Cochlear Implantation
  description: >-
    Cochlear implantation may be considered for severe-to-profound hearing loss after specialist assessment
    of candidacy and aided benefit. It electrically stimulates the auditory pathway, bypassing hair-cell transduction.
    The Japanese DFNB30 study recommends considering implantation but does not provide implant outcomes or
    prove preserved auditory-nerve function in every patient.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cochlear implantation can be considered in children with severe-to-profound hearing loss who are older than age nine months.
    explanation: General GeneReviews guidance; eligibility depends on individual clinical assessment.
  - reference: PMID:39858639
    reference_title: "The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In addition, the evaluation of the outcomes of hearing aids or cochlear implantation will also be useful.
    explanation: The authors identify treatment outcome measurement as future work.
- name: Genetic Counselling
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Provide nondirective counseling after molecular confirmation. Recurrence risk is conditional on established
    parental pathogenic genotypes, and testing relatives requires identification of the familial variants.
    Distinguish recessive DFNB30 from allele-specific dominant MYO3A-associated hearing loss.

  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for an autosomal recessive hearing loss-related pathogenic variant, each sib of the proband has at conception a 25% chance of having hearing loss, a 50% chance of having no hearing loss and being a carrier, and a 25% chance of having no hearing loss and not being a carrier.
    explanation: General recessive recurrence risk, conditional on established parental pathogenic variants.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Carrier testing for relatives who may have a hearing loss-related pathogenic variant requires prior identification of the pathogenic variants in the family.
    explanation: Prerequisite for informative family testing.
- name: Communication and language support
  description: Establish communication goals and provide appropriate language access, speech-language services and educational support. These are general measures for hearing loss, not evidence of a primary neurodevelopmental syndrome caused by MYO3A.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: On initial evaluation of individuals with hearing loss, the goals for communication must be established with a focus on equipping individuals with language and appropriate access to language.
    explanation: General hearing-loss management.
diagnosis:
- name: Age-appropriate audiometry
  description: >-
    Age-appropriate audiometry characterizes degree, configuration and sensorineural status. The Japanese cohort
    used pure-tone audiometry from age five and behavioral or evoked-response approaches in younger children.
    Audiogram shape alone does not establish MYO3A causation.
  diagnosis_term:
    preferred_term: audiometric assessment
    term:
      id: NCIT:C38036
      label: Audiometric Test
  results: Sensorineural loss, mild to profound, usually down-sloping.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pure-tone audiometry was used to assess hearing thresholds for patients aged 5 years and above, whereas auditory steady state response (ASSR), conditioned orientation response audiometry (COR: one type of the behavioral audiometry), or play audiometry were used for individuals under 5 years old."
    explanation: >-
      The audiometric methods used in the largest series, including the age threshold at which
      they switch.
- name: Serial audiometric follow-up
  description: >-
    Repeated audiometry documents change and guides rehabilitation. It is useful for monitoring suspected or
    confirmed progressive hearing loss, but serial deterioration is not a prerequisite for molecular diagnosis
    and congenital presentations occur.
  diagnosis_term:
    preferred_term: serial audiometric follow-up
    term:
      id: NCIT:C38036
      label: Audiometric Test
  results: Individual trajectory assessed over time; no validated DFNB30-specific deterioration rate.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Regular follow up is recommended for all individuals with genetic hearing loss in order to:'
    explanation: General management guidance supports continued audiologic assessment.
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A further prospective study will be useful in evaluating hearing deterioration through the use of the serial audiometric testing results from the same patient."
    explanation: >-
      The Japanese study lacked same-patient longitudinal audiometry; it recommends prospective measurement.
- name: Massively parallel sequencing of a hearing-loss gene panel
  description: >-
    A hearing-loss multigene panel or genomic testing can assess MYO3A alongside other hearing-loss genes.
    The Japanese study used a 158-gene panel and read-depth copy-number analysis. Interpretation requires pathogenicity
    assessment and, where possible, confirmation that two variants are in trans. MYO3A need not be tested only
    after excluding each more common gene.
  diagnosis_term:
    preferred_term: massively parallel sequencing of a targeted hearing-loss gene panel
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  results: Biallelic pathogenic or likely pathogenic MYO3A variants consistent with recessive inheritance support DFNB30; unresolved variants or phase require further assessment.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these subjects, we selected patients with biallelic MYO3A variants through MPS of 158 target genes."
    explanation: The testing modality and the biallelic requirement in one sentence.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: can often identify the cause of genetic hearing loss while limiting identification of pathogenic variants and variants of uncertain significance in genes that are irrelevant to the underlying phenotype.
    explanation: General guidance for hearing-loss panels.
- name: Variant interpretation under the ClinGen hearing-loss specification
  description: >-
    Variant classification, segregation and phase distinguish a molecular diagnosis from an uncertain candidate
    genotype. The Japanese series used ACMG/AMP criteria with hearing-loss specifications, but p.Glu770Lys
    and p.Ala238Thr remained uncertain and family segregation was unavailable. A VUS does not establish or
    exclude DFNB30; dominant MYO3A-associated hearing loss must also be considered for appropriate alleles
    and pedigrees.
  diagnosis_term:
    preferred_term: variant classification
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Allele-specific classification and inheritance assessment; uncertain genotypes remain unresolved.
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenicity of identified variants was evaluated according to the American College of Medical Genetics (ACMG) standards and guidelines"
    explanation: >-
      Study classification framework; Table 1 and segregation limitations must accompany its interpretation.
  - reference: PMID:39858639
    reference_title: "The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As we were not able to conduct segregation analyses on the families of the probands due to a lack of peripheral blood samples, it is possible that the HL was due to other causes
    explanation: Authors explicitly acknowledge uncertain attribution in the Japanese candidate series.
differential_diagnoses:
- name: Age-related hearing loss (presbycusis)
  description: >-
    Age-related hearing loss can overlap with later-recognized progressive sensorineural impairment. Age at
    onset, family history and molecular findings help distinguish inherited disease; the cited paper does not
    establish presbycusis as the main cause of DFNB30 underdiagnosis.
  distinguishing_features:
  - Onset in the second or third decade rather than in late middle age
  - Biallelic MYO3A variants on panel or exome testing
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the elucidation of HL causation becomes more challenging when related to late-onset HL, as multiple factors, such as presbycusis, idiopathic sudden SNHL, environmental risk factors, etc., can be involved."
    explanation: >-
      Names presbycusis and idiopathic sudden sensorineural hearing loss as the confounders for
      exactly the presentation DFNB30 produces.
- name: Idiopathic sudden sensorineural hearing loss
  description: >-
    The Japanese study lists idiopathic sudden sensorineural hearing loss among competing explanations for
    later-onset hearing loss. Clinical chronology helps distinguish abrupt loss from a progressive inherited
    course.
  distinguishing_features:
  - Abrupt onset over hours to days rather than progressive deterioration over years
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the elucidation of HL causation becomes more challenging when related to late-onset HL, as multiple factors, such as presbycusis, idiopathic sudden SNHL, environmental risk factors, etc., can be involved."
    explanation: The same sentence names it as a competing explanation for late-onset hearing loss.
- name: Other autosomal recessive nonsyndromic hearing loss, principally GJB2, SLC26A4 and CDH23
  description: >-
    Other hearing-loss genes can produce overlapping nonsyndromic presentations. Multigene testing evaluates
    these alternatives together; DFNB30 is not a diagnosis of exclusion after each common gene is tested.
  distinguishing_features:
  - Pathogenic variants and appropriate segregation in the causative gene
  - Onset and audiometric configuration overlap and cannot by themselves assign the gene
  evidence:
  - reference: PMID:39858639
    reference_title: The Prevalence and Clinical Characteristics of MYO3A-Associated Hearing Loss in 15,684 Hearing Loss Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major causative genes of ARSNHL in Japanese patients are GJB2 (16%), SLC26A4 (5%) and CDH23 (4%), and the detection of causative genes for HL has become significantly more achievable through the introduction of massively parallel DNA sequencing (MPS) analysis [5]."
    explanation: >-
      Cohort-specific contributions motivate multigene assessment, not a required sequence of gene exclusions.
- name: Autosomal dominant MYO3A-related hearing loss
  description: >-
    The same gene, a different disease. A motor-domain missense allele segregates as an autosomal
    dominant trait, so a MYO3A variant report does not by itself establish DFNB30 - the zygosity
    and the segregation do.
  distinguishing_features:
  - A variant with evidence supporting a dominant effect, rather than any heterozygous MYO3A finding
  - Segregation and allele-specific functional evidence supporting dominant inheritance
  evidence:
  - reference: PMID:26841241
    reference_title: MYO3A Causes Human Dominant Deafness and Interacts with Protocadherin 15-CD2 Isoform.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In a family with post-lingual progressive non-syndromic deafness, whole-exome sequencing of genomic DNA from five hearing-impaired relatives revealed a single variant, p.Gly488Glu (rs145970949:G>A) in MYO3A, co-segregating with HL as an autosomal dominant trait.
    explanation: Primary dominant-family report, distinct from recessive DFNB30.
animal_models:
- name: Myo3a knock-in mouse (human nonsense allele equivalent)
  species: Mouse
  genotype: Myo3a(KI/KI), knock-in of the mouse equivalent of the human MYO3A nonsense allele
  publication: PMID:21165622
  description: >-
    C57BL/6 knock-in of the human founding nonsense allele equivalent, compared with wild-type littermates.
    ABR deficits begin at 2.5 months and progress; bundles appear normally shaped through 8.5 months, followed
    by hair-cell degeneration at ten and seventeen months. Vestibular reaching and forced-swim tests were normal.
  modeled_mechanisms:
  - target: Progressive Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Later outer-hair-cell loss recapitulates a plausible contributor to progressive cochlear dysfunction;
      human tissue pathology is not available.
    limitations: >-
      The model carries one nonsense allele on a mouse background. Early hearing loss precedes visible degeneration,
      and mouse ages do not predict human onset. Outer-hair-cell counts used three animals per genotype; inner
      hair cells could not be counted consistently.
    readouts:
    - name: Outer hair cell survival
      target: Progressive Hair Cell Degeneration
      direction: DECREASED
      interpretation: Structural correlate of the degeneration node in this model.
      evidence:
      - reference: PMID:21165622
        reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Outer hair cells of Myo3a(KI/KI) mice degenerate with age in a pattern consistent with their progressive hearing loss."
        explanation: The histological measurement behind this readout.
    evidence:
    - reference: PMID:21165622
      reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The phenotype of the Myo3a(KI/KI) mouse parallels the phenotype of human DFNB30."
      explanation: The authors' own assessment that this model is informative for the human disease.
  - target: Altered Myosin IIIa Function at Stereocilia Tips
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Loss of C-terminal myosin IIIa staining after truncation.
    limitations: >-
      The antibody recognizes the C-terminal epitope removed by the mutation; it cannot exclude residual N-terminal
      protein.
    readouts:
    - name: C-terminal myosin IIIa immunoreactivity at stereocilia tips
      target: Altered Myosin IIIa Function at Stereocilia Tips
      direction: ABOLISHED
      interpretation: C-terminal staining is absent; complete absence or failed targeting of every mutant protein species is not demonstrated.
      evidence:
      - reference: PMID:21165622
        reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Myosin IIIA, with a unique N-terminal kinase domain and a C-terminal actin-binding domain, localizes to the tips of stereocilia in wild-type mice but is absent in the mutant."
        explanation: Epitope-dependent localization assay; interpreted with the methods.
    evidence:
    - reference: PMID:21165622
      reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: against a synthetic peptide (NPYDYRRLLRKTSQRQR) that matches the C-terminus sequence of the mouse myosin IIIA.
      explanation: The methods identify the epitope and its relevance to interpreting negative staining.
  - target: Cochlear Hearing Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Progressive functional hearing deficit with a human disease-allele equivalent.
    limitations: ABR is not a direct assay of the cellular cause of the early deficit.
    readouts:
    - name: Auditory brainstem response threshold
      target: Cochlear Hearing Dysfunction
      direction: INCREASED
      interpretation: >-
        ABR thresholds rise from 2.5 months, before visible hair-cell degeneration.
      evidence:
      - reference: PMID:21165622
        reference_title: A mouse model for human hearing loss DFNB30 due to loss of function of myosin IIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: In mutant mice, hearing loss is significant at 2.5 months and progresses first at high frequencies, then at all frequencies.
        explanation: Functional hearing deficit precedes visible degeneration.
- name: Myo3a Y137C knock-in mouse
  species: Mouse
  genotype: Myo3a Y137C kinase-domain missense knock-in, generated by CRISPR/Cas9
  publication: PMID:30123247
  description: >-
    CBA/CaJ kinase-domain Y137C knock-in made by CRISPR/Cas9. ABR thresholds were normal at two months and
    elevated at six and twelve months, when stereocilia abnormalities and hair-cell loss were present. A noise
    challenge at 4.5 months showed no significant genotype difference in threshold shifts under that protocol,
    so it does not establish increased noise susceptibility.
  modeled_mechanisms:
  - target: Disordered Stereocilia and Hair Bundle Architecture
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Structural abnormality of cochlear hair cell stereocilia in a single-gene Myo3a mutant.
    limitations: >-
      The CBA/CaJ mouse Y137C substitution was designed to model human Y129C, but the human family data were
      not shown in this paper. Stereocilia were intact at two months and abnormal at six and twelve months.
      Positive FM1-43 uptake is a proxy, not proof of normal mechanotransduction currents across age. The paper
      did not directly measure mutant kinase activity.
    readouts:
    - name: Cochlear hair cell stereocilia structure
      target: Disordered Stereocilia and Hair Bundle Architecture
      direction: ALTERED
      interpretation: Structural correlate of the bundle-architecture node.
      evidence:
      - reference: PMID:30123247
        reference_title: Knock-In Mice with Myo3a Y137C Mutation Displayed Progressive Hearing Loss and Hair Cell Degeneration in the Inner Ear.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We also found structural abnormality in the cochlear hair cell stereocilia."
        explanation: The structural measurement behind this readout.
    evidence:
    - reference: PMID:30123247
      reference_title: Knock-In Mice with Myo3a Y137C Mutation Displayed Progressive Hearing Loss and Hair Cell Degeneration in the Inner Ear.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results showed that Myo3a is essential for normal hearing by maintaining the intact structure of hair cell stereocilia, and the kinase domain plays a critical role in the normal functions of Myo3a."
      explanation: The authors' statement of what the model establishes about the mechanism.
- name: Myo3a/Myo3b double knockout mouse
  species: Mouse
  genotype: Myo3a(-/-)Myo3b(-/-) double knockout
  publication: PMID:26754646
  description: >-
    Not a model of DFNB30 but of class III myosin function generally: removing both paralogues
    produces profound deafness and a grossly abnormal hair bundle, and it is the source of the
    finding that these motors limit rather than only promote stereocilia elongation.
  modeled_mechanisms:
  - target: Disordered Stereocilia and Hair Bundle Architecture
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces disordered bundle architecture, but only when both class III myosins are
      removed - so it speaks to the pathway rather than to the human single-gene disease.
    limitations: >-
      Constitutive deletion of both paralogues causes a developmental phenotype distinct from human single-gene
      DFNB30. In the same study, Myo3a deletion beginning postnatally on a Myo3b-null background left ABR and
      DPOAE normal through six months, while postnatal Myo3a loss with Myo3b intact raised ABR thresholds.
      Timing and paralogue context therefore preclude a simple lifelong protective-compensation model.
    readouts:
    - name: Hair bundle morphology
      target: Disordered Stereocilia and Hair Bundle Architecture
      direction: ALTERED
      interpretation: >-
        Abnormally tall and numerous stereocilia with loss of height grading, in the double
        mutant.
      evidence:
      - reference: PMID:26754646
        reference_title: Class III myosins shape the auditory hair bundles by limiting microvilli and stereocilia growth.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These include abnormally tall and numerous microvilli or stereocilia, ungraded stereocilia bundles, and bundle rounding and closure."
        explanation: The morphological measurement behind this readout.
    evidence:
    - reference: PMID:26754646
      reference_title: Class III myosins shape the auditory hair bundles by limiting microvilli and stereocilia growth.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that Myo3a(-/-)Myo3b(-/-) mice lacking myosin IIIa and myosin IIIb are profoundly deaf, whereas Myo3a-cKO Myo3b(-/-) mice lacking myosin IIIb and losing myosin IIIa postnatally have normal hearing."
      explanation: >-
        The comparison that both establishes the double mutant's deafness and limits how far it
        can be read as a MYO3A model.
discussions:
- discussion_id: dfnb30_longitudinal_retinal_assessment
  kind: KNOWLEDGE_GAP
  prompt: >-
    How well has long-term retinal function been assessed in DFNB30?
  attaches_to:
  - phenotypes#
  rationale: >-
    The founding study explicitly reported normal vision and balance in affected relatives, and the Lys50Arg
    family report also described normal ocular and vestibular findings. These are positive reports of assessment,
    not merely absence of volunteered complaints. They do not establish systematic longitudinal electroretinography
    or lifelong absence of retinal disease; retinal expression alone does not establish a clinical retinal
    phenotype.
- discussion_id: dfnb30_espin1_transport_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the espin-1 cargo-transport model the mechanism of DFNB30, given that espin-1 still
    reaches stereocilia tips in mice lacking both class III myosins?
  attaches_to:
  - pathophysiology#Altered Myosin IIIa Function at Stereocilia Tips
  rationale: >-
    COS-7 and organotypic experiments demonstrate MYO3A/espin-1 interaction and construct-dependent protrusion
    elongation; the roughly tenfold effect used kinase-deleted MYO3A in COS-7 cells. Constitutive double-null
    mouse hair cells retained espin-1 tip localization and developed excessively long, poorly organized bundles.
    These model-to-model differences limit obligatory cargo-delivery failure as the mechanism in patients.
- discussion_id: dfnb30_kinase_domain_genotype_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do MYO3A kinase-domain alleles really separate congenital profound from late-onset
    progressive hearing loss?
  attaches_to:
  - pathophysiology#MYO3A Loss of Function
  rationale: >-
    Structural modelling proposes different consequences for kinase-specific impairment and wider protein dysfunction.
    The founding family showed a narrower genotype association between nonsense homozygotes and nonsense/splice
    compound heterozygotes, while the Japanese candidate series did not detect a correlation. These small and
    differently ascertained datasets neither validate a universal allele-domain rule nor establish a bimodal
    population onset distribution. Direct allele-resolved functional and longitudinal clinical evidence is
    needed.

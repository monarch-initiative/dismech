name: Pericarditis
creation_date: "2026-08-10T03:40:00Z"
category: Complex
disease_term:
  preferred_term: pericarditis
  term:
    id: MONDO:0005904
    label: pericarditis
description: >
  Inflammation of the pericardium, the fibroserous sac enclosing the heart. Two facts organise
  the entry. The first is that the pericardium has a narrow repertoire. Viral infection,
  tuberculosis, uraemia, cardiac surgery, myocardial infarction, radiotherapy, malignancy, and
  systemic autoimmune disease all converge on the same inflammatory response, which is why the
  clinical syndrome is nearly identical across causes and why the largest aetiological category
  in the developed world is idiopathic. The second is that the engine of recurrence is
  autoinflammatory rather than autoimmune. It runs on the innate immune system, on the NLRP3
  inflammasome and interleukin-1, not on adaptive immunity, and the demonstration is therapeutic
  rather than merely correlative. Withdrawing an interleukin-1 trap from patients in remission
  returned three-quarters of them to relapse within weeks while those who stayed on drug did not
  relapse. The same logic explains the trap that runs the other way. Corticosteroids, which
  suppress the adaptive arm and are the intuitive treatment for an inflamed serosa, are an
  independent risk factor for recurrence.
parents:
- pericardium disorder
- inflammatory disease

classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      Curated as cardiovascular because the affected structure and the haemodynamic consequences
      are cardiac. Its mechanism belongs to innate immunology, and the recurrent form is treated
      with drugs developed for hereditary periodic fever syndromes, so an immunological
      classification captures the biology better than the anatomy does.

has_subtypes:
- name: Acute pericarditis
  display_name: Acute pericarditis
  description: >
    A first episode, typically over days, self-limited in most patients treated with a
    non-steroidal anti-inflammatory drug and colchicine. Most cases in the developed world are
    idiopathic and presumed post-viral.
- name: Recurrent pericarditis
  display_name: Recurrent pericarditis
  description: >
    Relapse after a documented symptom-free interval, and the commonest complication of the
    disease rather than an unusual outcome. This is the mechanistically distinctive subtype,
    because it behaves like an autoinflammatory disease rather than like a resolving response to
    an injury, and because it is the population in which interleukin-1 blockade was tested and
    approved. A minority of these patients carry variants in genes that cause hereditary periodic
    fever syndromes. No subtype_term is bound here, because this subtype covers recurrence of any
    cause and is therefore broader than MONDO:0016662, which is bound to the idiopathic subtype
    below.
  evidence:
  - reference: PMID:21873705
    reference_title: "Colchicine for recurrent pericarditis (CORP): a randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrence is the most common complication of pericarditis, affecting 10% to 50% of patients."
    explanation: >-
      Establishes recurrence as the dominant complication rather than an uncommon one, which is
      what justifies curating it as a subtype and what makes prevention from the first episode
      the standard of care rather than a response to relapse.
- name: Recurrent pericarditis idiopathic
  display_name: Idiopathic recurrent pericarditis
  subtype_term:
    preferred_term: idiopathic recurrent pericarditis
    term:
      id: MONDO:0016662
      label: idiopathic recurrent pericarditis
  description: >
    The recurrent form with no identified cause, which is the population in which the
    autoinflammatory account was developed and in which the interleukin-1 blockade trials were
    run. It is bound to its own MONDO identifier because the genetic and therapeutic evidence in
    this entry is specific to it rather than to recurrence generally.
- name: Constrictive pericarditis
  display_name: Constrictive pericarditis
  subtype_term:
    preferred_term: constrictive pericarditis
    term:
      id: MONDO:0006711
      label: constrictive pericarditis
  description: >
    Fibrotic, sometimes calcified, non-compliant pericardium that restricts diastolic filling.
    It is the structural end state, but not always an irreversible one, since a transient form
    resolves with anti-inflammatory therapy. Risk of progression is strongly aetiology-dependent
    and is highest after tuberculous and purulent disease.
- name: Tuberculous pericarditis
  display_name: Tuberculous pericarditis
  subtype_term:
    preferred_term: pericardial tuberculosis
    term:
      id: MONDO:0005903
      label: pericardial tuberculosis
  description: >
    The dominant form in high-burden settings, particularly with HIV co-infection. It is
    separated as a subtype because its natural history differs from the idiopathic form in the
    respect that matters most, namely a much higher rate of progression to constriction, and
    because its treatment is antimicrobial rather than anti-inflammatory.

pathophysiology:
- name: Pericardial injury from a heterogeneous trigger
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Tissue Injury"
  description: >
    Viral infection, mycobacterial or pyogenic infection, uraemic toxin accumulation, myocardial
    or surgical injury, irradiation, malignant infiltration, or systemic autoimmune disease
    injures the pericardial mesothelium. The list is long and the downstream response is not,
    which is the central structural feature of this disease. Trigger identity determines the
    probability of progression to constriction and determines what treats the cause, but it
    barely determines the acute syndrome. Curating one trigger node rather than a separate
    chain per aetiology reflects that convergence.
  cell_types:
  - preferred_term: pericardial mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  locations:
  - preferred_term: pericardium
    term:
      id: UBERON:0002407
      label: pericardium
  downstream:
  - target: Inflammasome activation in pericardial tissue
    causal_link_type: DIRECT
    description: >
      Injured and stressed mesothelial cells and resident macrophages engage innate immune
      sensing, which is the first shared step of the response.

- name: Inflammasome activation in pericardial tissue
  biological_scale: CELLULAR
  description: >
    Innate immune sensing assembles the NLRP3 inflammasome in pericardial mesothelial cells and
    macrophages. This is the convergence point of the module, and it is established in human
    pericardial tissue rather than inferred from the drug response alone, with inflammasome
    components more strongly stained in patients with chronic pericarditis than in controls and
    the same activation reproduced in a mouse model of the disease.
  cell_types:
  - preferred_term: pericardial mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
    modifier: INCREASED
  locations:
  - preferred_term: pericardium
    term:
      id: UBERON:0002407
      label: pericardium
  evidence:
  - reference: PMID:33665514
    reference_title: "The Role of NLRP3 Inflammasome in Pericarditis: Potential for Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with pericarditis presented an intensification of the inflammasome activation compared with control subjects."
    explanation: >-
      Establishes inflammasome activation in human pericardial tissue rather than in a model
      system, which is what makes this node a curated mechanism rather than an inference from
      drug response.
  - reference: PMID:33665514
    reference_title: "The Role of NLRP3 Inflammasome in Pericarditis: Potential for Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "An intense activation of the inflammasome in pericarditis was demonstrated both in humans and in mice."
    explanation: >-
      Confirms the same activation in a mouse model, giving the cross-species convergence that
      supports it as the mechanism rather than an epiphenomenon of chronic tissue.
  downstream:
  - target: Interleukin-1 release and cytokine amplification
    causal_link_type: DIRECT
    description: >
      Assembled inflammasome cleaves pro-interleukin-1-beta to its active form and releases it.

- name: Interleukin-1 release and cytokine amplification
  biological_scale: MOLECULAR
  description: >
    Active interleukin-1 alpha and beta drive a nuclear-factor-kappa-B-dependent cascade of
    interleukin-6, tumour necrosis factor, and chemokines. Interleukin-1 also induces its own
    production, which is the property that turns an injury response into a self-sustaining loop
    and gives the disease its tendency to recur. This node is the drug target for the two agents
    that work in refractory disease.
  biological_processes:
  - preferred_term: positive regulation of interleukin-1 beta production
    term:
      id: GO:0032731
      label: positive regulation of interleukin-1 beta production
    modifier: INCREASED
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:33200890
    reference_title: "Phase 3 Trial of Interleukin-1 Trap Rilonacept in Recurrent Pericarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interleukin-1 has been implicated as a mediator of recurrent pericarditis."
    explanation: >-
      States the premise the trial was designed to test, and the trial result recorded on the
      treatment entry is what converts that premise into support for this node.
  downstream:
  - target: Acute pericardial inflammatory exudate
    causal_link_type: DIRECT
    description: >
      Cytokine signalling raises microvascular permeability and recruits leukocytes into the
      pericardium.
  - target: Autoinflammatory recurrence loop
    causal_link_type: DIRECT
    description: >
      Interleukin-1-driven induction of further interleukin-1 sustains the response beyond the
      original trigger in susceptible patients.

- name: Acute pericardial inflammatory exudate
  biological_scale: TISSUE
  description: >
    Neutrophils arrive first and are followed by lymphocytes and macrophages, microvascular
    permeability rises, and fibrin is deposited on the serosal surfaces. Every feature of the
    acute clinical syndrome comes from this node. The friction rub is the sound of
    fibrin-roughened layers moving on each other, the pain is irritation of the pain-sensitive
    parietal layer, the effusion is the permeability change, and the diffuse rather than
    territorial electrocardiographic change follows from the fact that the inflamed surface
    wraps the whole heart instead of following a coronary territory.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: pericardial sac
    term:
      id: UBERON:0002406
      label: pericardial sac
  downstream:
  - target: Pericardial effusion accumulation
    causal_link_type: DIRECT
    description: >
      Increased permeability and reduced lymphatic clearance let fluid collect in the pericardial
      space.
  - target: Fibrotic organization of the pericardium
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Persistent or severe inflammation may organise rather than resolve, with the probability
      depending strongly on the aetiology rather than on the acute severity.

- name: Autoinflammatory recurrence loop
  biological_scale: ORGANISM
  description: >
    In a substantial minority the inflammation does not settle after the trigger has gone, and
    the disease relapses after symptom-free intervals. The loop is innate rather than adaptive,
    and three independent lines of evidence say so. Interleukin-1 blockade suppresses it and
    withdrawal releases it. A minority of patients carry variants in the genes that cause
    hereditary periodic fever syndromes, and pericarditis is itself a recognised feature of those
    syndromes. And corticosteroids, which act mainly on the adaptive arm, make recurrence more
    likely rather than less. This node is why recurrent pericarditis is curated as its own
    subtype rather than as repetition of the acute one.
  evidence:
  - reference: PMID:33200890
    reference_title: "Phase 3 Trial of Interleukin-1 Trap Rilonacept in Recurrent Pericarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During this period, 2 of 30 patients (7%) in the rilonacept group had a pericarditis recurrence, as compared with 23 of 31 patients (74%) in the placebo group."
    explanation: >-
      A randomised-withdrawal design turns the recurrence rate into a direct measurement of how
      much of the ongoing disease depends on interleukin-1 signalling, which is the claim this
      node makes.
  - reference: PMID:35658515
    reference_title: "Pericarditis and Autoinflammation: A Clinical and Genetic Analysis of Patients With Idiopathic Recurrent Pericarditis and Monogenic Autoinflammatory Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Innate immune modulators, colchicine and anti-interleukin-1 agents, pioneered in monogenic autoinflammatory diseases, have demonstrated remarkable efficacy in trials, suggesting that autoinflammation may contribute to IRP."
    explanation: >-
      States the inference from drug response to mechanism that this node encodes, and names its
      provenance in the monogenic autoinflammatory diseases the drugs were developed for.
  - reference: PMID:35658515
    reference_title: "Pericarditis and Autoinflammation: A Clinical and Genetic Analysis of Patients With Idiopathic Recurrent Pericarditis and Monogenic Autoinflammatory Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pericarditis was observed in all examined monogenic autoinflammatory diseases (0.4%-3.7% of cases)."
    explanation: >-
      Runs the argument in the other direction. Pericarditis occurs in every monogenic
      interleukin-1-driven syndrome examined, which is what one expects if the pericardium is a
      characteristic target of an innate inflammatory loop.
  downstream:
  - target: Acute pericardial inflammatory exudate
    causal_link_type: DIRECT
    description: >
      Each relapse reproduces the acute inflammatory response without a new external trigger.

- name: Pericardial effusion accumulation
  biological_scale: ORGANISM
  description: >
    Fluid collects in a space that normally holds a few tens of millilitres. Whether it matters
    depends on the rate rather than the volume, because the parietal pericardium stretches slowly
    and a slowly accumulating effusion of a litre may be tolerated while a rapidly accumulating
    one of two hundred millilitres is not.
  locations:
  - preferred_term: pericardial sac
    term:
      id: UBERON:0002406
      label: pericardial sac
  downstream:
  - target: Cardiac tamponade
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Tamponade follows only when the intrapericardial pressure rises to the level of cardiac
      filling pressures, which depends on the rate of accumulation and the compliance of the sac.

- name: Cardiac tamponade
  biological_scale: ORGANISM
  description: >
    Intrapericardial pressure rises to equal and then exceed cardiac filling pressures, so the
    chambers cannot fill in diastole and cardiac output falls. The physiology is compressive
    rather than contractile, which is what it shares with constriction and with the obstructive
    shock of pulmonary embolism, and it produces the inspiratory fall in systolic pressure known
    as pulsus paradoxus through exaggerated ventricular interdependence within a fixed total
    volume.
  locations:
  - preferred_term: pericardial sac
    term:
      id: UBERON:0002406
      label: pericardial sac

- name: Fibrotic organization of the pericardium
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >
    Rather than resolving, the inflamed pericardium may organise, with fibroblast activation and
    excessive matrix deposition, sometimes proceeding to calcification. The likelihood is set by
    the aetiology and not by the noise of the acute episode, being low after idiopathic and viral
    disease and high after tuberculous and purulent disease. Radiation-associated fibrosis is the
    least tractable, since it can appear years after exposure and involves the myocardium and
    valves alongside the pericardium.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  locations:
  - preferred_term: pericardium
    term:
      id: UBERON:0002407
      label: pericardium
  downstream:
  - target: Constrictive physiology
    causal_link_type: DIRECT
    description: >
      A non-compliant pericardial shell sets a fixed limit on total cardiac volume.

- name: Constrictive physiology
  biological_scale: ORGANISM
  description: >
    A rigid pericardium caps total cardiac volume, so diastolic pressures equalise across
    chambers, filling stops abruptly in early diastole, and the ventricles compete for a fixed
    space. The result is a right-heart-failure syndrome with raised venous pressure, ascites,
    and oedema in a patient whose ventricular contraction is normal, which is the reason it is
    routinely mistaken for liver or renal disease. It is not necessarily irreversible. A
    transient form associated with ongoing inflammation resolves with anti-inflammatory therapy,
    so the choice between drugs and pericardiectomy turns on distinguishing active inflammation
    from established fibrosis.
  locations:
  - preferred_term: pericardium
    term:
      id: UBERON:0002407
      label: pericardium
  evidence:
  - reference: PMID:15505106
    reference_title: "Novel model of constrictive pericarditis associated with autoimmune heart disease in interferon-gamma-knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Comparison of IFN-gamma-KO and wild-type mice matched for the severity of myocardial disease further confirmed that pericarditis, and not myocarditis, was responsible for smaller LV volumes, reduced cardiac output, increased cardiac stiffness, and increased peak filling rate adjusted for end-diastolic volumes in KO mice."
    explanation: >-
      Attributes the constrictive haemodynamics specifically to the pericardial rather than the
      myocardial disease by matching for myocarditis severity, which is exactly the confound that
      makes the attribution hard in patients.

phenotypes:
- category: Symptom
  name: Pericarditic chest pain
  description: >
    Sharp retrosternal or left precordial pain, worse lying flat and on inspiration, relieved by
    sitting forward. The positional character is mechanical and follows from the inflamed
    parietal layer being loaded differently in different postures, which is what distinguishes it
    at the bedside from ischaemic pain.
  phenotype_term:
    preferred_term: Chest pain
    term:
      id: HP:0100749
      label: Chest pain
    temporality: ACUTE

- category: Sign
  name: Pericardial friction rub
  description: >
    A scratchy, often triphasic sound produced by fibrin-roughened pericardial layers moving over
    each other. It is close to specific for the diagnosis but intermittent and positional, so a
    single negative examination is uninformative.
  phenotype_term:
    preferred_term: Pericardial friction rub
    term:
      id: HP:0034788
      label: Pericardial friction rub

- category: Imaging
  name: Pericardial effusion
  description: >
    Fluid in the pericardial space on echocardiography or cross-sectional imaging, ranging from
    trace to tamponade-causing. Its presence supports the diagnosis but its absence does not
    exclude it, since dry pericarditis is common. No evidence item is attached and no frequency
    is asserted. The cohort figure available to this entry counts extrapericardial effusions,
    meaning pleural and peritoneal fluid, which is a different finding from the pericardial
    effusion this phenotype names.
  phenotype_term:
    preferred_term: Pericardial effusion
    term:
      id: HP:0001698
      label: Pericardial effusion

- category: Laboratory
  name: Widespread ST-segment elevation
  description: >
    Concave ST elevation across most electrocardiographic leads without reciprocal depression.
    It is a diagnostic criterion, and its geometry is the mechanism made visible. The inflamed
    surface wraps the whole heart rather than following a coronary territory, so the change is
    everywhere at once, which is what separates it at first contact from an infarction.
  phenotype_term:
    preferred_term: ST segment elevation
    term:
      id: HP:0012251
      label: ST segment elevation

- category: Laboratory
  name: PR-segment depression
  description: >
    Depression of the PR segment, attributed to inflammation of the atrial epicardium. It is the
    more specific of the two electrocardiographic findings and, unlike ST elevation, has no
    common ischaemic mimic.
  phenotype_term:
    preferred_term: PR segment depression
    term:
      id: HP:0031594
      label: PR segment depression

- category: Sign
  name: Cardiac tamponade
  description: >
    Haemodynamic compromise from pericardial fluid under pressure, with raised venous pressure,
    hypotension, and pulsus paradoxus. It is uncommon in idiopathic and viral disease and much
    more frequent in malignant, tuberculous, and purulent pericarditis, so its presence shifts
    the aetiological probabilities as well as demanding drainage.
  phenotype_term:
    preferred_term: Cardiac tamponade
    term:
      id: HP:0033415
      label: Cardiac tamponade
    severity: SEVERE

- category: Sign
  name: Pulsus paradoxus
  description: >
    An exaggerated inspiratory fall in systolic blood pressure. It is not paradoxical but an
    exaggeration of a normal phenomenon, arising because a fixed pericardial volume forces the
    ventricles to compete for filling during the inspiratory increase in right-sided venous
    return.
  phenotype_term:
    preferred_term: Pulsus paradoxus
    term:
      id: HP:6000046
      label: Pulsus paradoxus

- category: Cardiovascular
  name: Constrictive pericarditis
  description: >
    Restriction of diastolic filling by a non-compliant pericardium, presenting as right-heart
    failure with preserved ventricular contraction. It is the late structural complication and
    the one that determines whether surgery is needed.
  phenotype_term:
    preferred_term: Constrictive pericarditis
    term:
      id: HP:0002563
      label: Constrictive pericarditis
    clinical_course: PROGRESSIVE

- category: Laboratory
  name: Elevated C-reactive protein
  description: >
    A raised acute-phase reactant, present in the large majority of active episodes. It is used
    not only diagnostically but to time treatment, since normalisation guides both the duration
    of anti-inflammatory therapy and the return to physical activity.
  phenotype_term:
    preferred_term: Elevated circulating C-reactive protein concentration
    term:
      id: HP:0011227
      label: Elevated circulating C-reactive protein concentration
  evidence:
  - reference: PMID:35658515
    reference_title: "Pericarditis and Autoinflammation: A Clinical and Genetic Analysis of Patients With Idiopathic Recurrent Pericarditis and Monogenic Autoinflammatory Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IRP frequently manifested with systemic inflammation"
    explanation: >-
      Supports systemic inflammation as a frequent manifestation in an idiopathic recurrent
      pericarditis cohort. No frequency band is assigned and no proportion is quoted, because
      the numeric figure in the source is reported for a referral recurrent-disease population
      rather than for unselected acute pericarditis.

- category: Constitutional
  name: Fever
  description: >
    Low-grade fever is common, particularly in the idiopathic, viral, and autoinflammatory forms.
    High fever raises the possibility of purulent disease.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever

- category: Symptom
  name: Dyspnoea
  description: >
    Breathlessness, arising either from the pain limiting inspiration, or from a
    haemodynamically significant effusion, or from constrictive physiology. Its cause therefore
    differs by disease phase.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea

genetic:
- name: MEFV
  gene_term:
    preferred_term: MEFV
    term:
      id: hgnc:6998
      label: MEFV
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    Encodes pyrin, a regulator of inflammasome activation and the gene of familial Mediterranean
    fever. Rare deleterious variants are enriched in idiopathic recurrent pericarditis relative
    to ancestry-matched population controls. The association is the genetic counterpart of the
    therapeutic argument for an interleukin-1-driven mechanism, but it is based on small
    absolute numbers and a marginal significance level, and it should not be read as making
    recurrent pericarditis a forme fruste of familial Mediterranean fever.
  evidence:
  - reference: PMID:35658515
    reference_title: "Pericarditis and Autoinflammation: A Clinical and Genetic Analysis of Patients With Idiopathic Recurrent Pericarditis and Monogenic Autoinflammatory Diseases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Rare deleterious MEFV variants were more frequent in IRP than in ancestry-matched controls (allele frequency 9/200 versus 2932/129 200, P=0.040)."
    explanation: >-
      Establishes the enrichment and, in the same sentence, its fragility. Graded PARTIAL
      deliberately, because nine variant alleles and a p-value of 0.040 support an association
      worth recording without supporting a confident effect estimate.

- name: TNFRSF1A
  gene_term:
    preferred_term: TNFRSF1A
    term:
      id: hgnc:11916
      label: TNFRSF1A
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    Encodes the p55 tumour necrosis factor receptor and is the gene of tumour necrosis factor
    receptor-associated periodic syndrome. Variants have been reported in patients presenting
    with idiopathic recurrent acute pericarditis, which is why a recurrent pericarditis without
    an identified cause is a recognised route to a periodic fever syndrome diagnosis. The
    evidence cited here is a case report expanding the reported variant spectrum, not a cohort
    frequency estimate, and no proportion of cases is claimed.
  evidence:
  - reference: PMID:23745996
    reference_title: "Expanding spectrum of TNFRSF1A gene mutations among patients with idiopathic recurrent acute pericarditis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "IRAP patients carrying TNFRSF1A gene mutations have been recently described."
    explanation: >-
      Supports the existence of the association qualitatively. Graded PARTIAL because the report
      is a description of individual patients carrying rare variants and cannot support a
      frequency or an effect size.

biochemical:
- name: C-reactive protein
  notes: >
    The practical biomarker of the disease. Beyond supporting the diagnosis it is used to decide
    how long to treat and when to resume physical activity, so it functions as a treatment
    variable rather than only a diagnostic one.

- name: Cardiac troponin
  notes: >
    Elevated when the adjacent subepicardial myocardium is involved, defining the
    myopericarditis overlap. It signals extension of the same inflammation rather than a second
    disease.

environmental:
- name: Mediastinal irradiation
  exposure_term:
    preferred_term: exposure to ionizing radiation
    term:
      id: ECTO:7000047
      label: exposure to ionizing radiation
  description: >
    Radiotherapy to the mediastinum, historically for Hodgkin lymphoma and for breast cancer,
    causes both acute pericarditis and a delayed fibrosing constrictive disease that may appear
    years to decades later. It is curated separately from the other triggers because its outcome
    is the worst of any aetiology, with poor long-term survival after pericardiectomy, and
    because it is iatrogenic and therefore preventable by treatment planning.
  evidence:
  - reference: PMID:34547827
    reference_title: "Outcomes of pericardiectomy for constrictive pericarditis following mediastinal irradiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pericardiectomy for postradiation constrictive pericarditis has been reported to generally have unfavorable outcomes."
    explanation: >-
      A 100-patient cohort of pericardiectomy performed specifically for constrictive
      pericarditis following mediastinal irradiation establishes mediastinal irradiation as a
      recognized cause of pericardial disease.
  influences_mechanisms:
  - target: Pericardial injury from a heterogeneous trigger
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >
      Ionising radiation injures the pericardial mesothelium and microvasculature, entering the
      shared chain at the trigger node.
  - target: Fibrotic organization of the pericardium
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Radiation injury biases the pericardium towards fibrotic organisation rather than
      resolution, which is why constriction is the characteristic late outcome.
    evidence:
    - reference: PMID:34547827
      reference_title: "Outcomes of pericardiectomy for constrictive pericarditis following mediastinal irradiation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pericardiectomy performed for radiation-associated constrictive pericarditis has poor long-term outcomes."
      explanation: >-
        Establishes radiation-associated constriction as a distinct and worse entity than
        constriction from other causes, which is the basis for curating this exposure as acting
        on the fibrotic node rather than only on the trigger node.

- name: End-stage renal disease and uraemia
  description: >
    Accumulated uraemic solutes inflame the pericardium in advanced renal failure, and an
    analogous syndrome occurs in patients already on dialysis when dialysis is inadequate. It is
    the one aetiology whose first-line treatment is neither anti-inflammatory nor antimicrobial
    but removal of the causative solutes.
  evidence:
  - reference: PMID:28873222
    reference_title: "Uremic pericarditis, pericardial effusion, and constrictive pericarditis in end-stage renal disease: Insights and pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A rising prevalence of end-stage renal disease (ESRD) has led to a rise in ESRD-related pericardial syndromes, calling for a better understanding of its pathophysiology, diagnoses, and management."
    explanation: >-
      Establishes end-stage renal disease and its associated uraemia as a recognized cause of
      pericardial syndromes, including pericarditis.
  influences_mechanisms:
  - target: Pericardial injury from a heterogeneous trigger
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >
      Uraemic solute accumulation injures the pericardium directly, entering the shared chain at
      the trigger node.
    evidence:
    - reference: PMID:28873222
      reference_title: "Uremic pericarditis, pericardial effusion, and constrictive pericarditis in end-stage renal disease: Insights and pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Uremic pericarditis, the most common manifestation of uremic pericardial disease, is a contemporary problem that calls for intensive hemodialysis, anti-inflammatories, and often, drainage of large inflammatory pericardial effusions."
      explanation: >-
        Identifies uraemia as a distinct pericarditis aetiology and records that intensified
        dialysis is part of its treatment, which is the observation supporting a solute-driven
        trigger.

- name: Cardiac injury and surgery
  description: >
    Myocardial infarction, cardiac surgery, catheter procedures, device implantation, and chest
    trauma all produce a delayed pericarditis grouped as post-cardiac injury syndrome. The
    latency between the injury and the syndrome is the clue to its immune-mediated character,
    and it includes the entity long known as Dressler syndrome.
  evidence:
  - reference: PMID:38559602
    reference_title: "Post-cardiac injury syndrome: An evidence-based approach to diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All these conditions give rise to PCIS due to an inciting cardiac injury to pericardial or pleural mesothelial cells, leading to subsequent inflammation syndromes ranging from uncomplicated pericarditis to massive pleural effusion."
    explanation: >-
      Establishes that myocardial infarction, cardiac surgery, catheter procedures, device
      implantation, and chest trauma converge on a shared cardiac-injury trigger that causes
      pericarditis.
  influences_mechanisms:
  - target: Pericardial injury from a heterogeneous trigger
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >
      Mechanical or ischaemic injury to the heart exposes the pericardium to injured tissue and
      initiates the shared response after a latent period.
    evidence:
    - reference: PMID:38559602
      reference_title: "Post-cardiac injury syndrome: An evidence-based approach to diagnosis and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Post-cardiac injury syndrome (PCIS) is an umbrella term used for the post-pericardiotomy syndrome, post-myocardial infarction (MI) related pericarditis (Dressler syndrome), and post-traumatic pericarditis"
      explanation: >-
        Establishes that these distinct injuries are grouped as one syndrome, which is the
        clinical expression of the etiological convergence this entry models with a single
        trigger node.

treatments:
- name: Non-steroidal anti-inflammatory therapy
  description: >
    Aspirin or ibuprofen at anti-inflammatory doses, the first-line treatment for symptom control
    and for suppressing the acute inflammatory response. Aspirin is preferred after myocardial
    infarction, where other non-steroidal agents may interfere with infarct healing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Acute pericardial inflammatory exudate
    treatment_effect: INHIBITS
    description: >
      Prostaglandin synthesis inhibition reduces the vascular and nociceptive components of the
      acute inflammatory response.

- name: Colchicine
  description: >
    Added to anti-inflammatory therapy from the first episode, and the single best-evidenced
    intervention in the disease. Its effect is on recurrence rather than on the acute episode
    alone, which fits a drug acting on the inflammasome-driven loop rather than on the injury
    that started it. That it improves pericardial inflammation only partially in experimental
    models, while interleukin-1 blockade improves it substantially, is consistent with its
    clinical position as an agent that reduces recurrence without abolishing it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: colchicine
      term:
        id: CHEBI:23359
        label: colchicine
  target_mechanisms:
  - target: Autoinflammatory recurrence loop
    treatment_effect: INHIBITS
    description: >
      Colchicine suppresses inflammasome-dependent inflammation, which is the loop that drives
      recurrence rather than the acute injury response.
  evidence:
  - reference: PMID:23992557
    reference_title: "A randomized trial of colchicine for acute pericarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary outcome occurred in 20 patients (16.7%) in the colchicine group and 45 patients (37.5%) in the placebo group (relative risk reduction in the colchicine group, 0.56; 95% confidence interval, 0.30 to 0.72; number needed to treat, 4; P<0.001)."
    explanation: >-
      The double-blind trial in a first episode, establishing the reduction in incessant or
      recurrent pericarditis with a number needed to treat of four.
  - reference: PMID:21873705
    reference_title: "Colchicine for recurrent pericarditis (CORP): a randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 18 months, the recurrence rate was 24% in the colchicine group and 55% in the placebo group"
    explanation: >-
      Extends the benefit to patients who have already relapsed once, which is the population in
      which the recurrence loop is established rather than hypothetical.
  - reference: PMID:33665514
    reference_title: "The Role of NLRP3 Inflammasome in Pericarditis: Potential for Therapeutic Approaches."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Colchicine partially improved the pericardial inflammation."
    explanation: >-
      Supports the mechanistic account of colchicine as an incomplete inflammasome-directed
      agent, which is why it reduces rather than abolishes recurrence. Graded PARTIAL because
      the observation is in the mouse model and describes an incomplete effect.

- name: Corticosteroid therapy
  description: >
    Reserved as second-line, for patients who cannot take or do not respond to non-steroidal
    agents and colchicine, or whose pericarditis is part of a systemic autoimmune disease. The
    reason for the reservation is not toxicity alone. Corticosteroid use was an independent risk
    factor for recurrence in multivariable analysis of a randomised trial, so the intuitive
    treatment for an inflamed serosa makes the natural history worse. A plausible reading is that
    suppressing the adaptive arm does not touch the innate loop that drives relapse, and a
    separate cohort observation that steroid dependence tracks chronic pain suggests some of what
    appears to be steroid-dependent disease is not inflammatory at all.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Acute pericardial inflammatory exudate
    treatment_effect: INHIBITS
    description: >
      Corticosteroids suppress the acute inflammatory response, which is why they relieve
      symptoms quickly while leaving the recurrence loop intact.
  evidence:
  - reference: PMID:16186437
    reference_title: "Colchicine in addition to conventional therapy for acute pericarditis: results of the COlchicine for acute PEricarditis (COPE) trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "After multivariate analysis, corticosteroid use (OR 4.30, 95% CI 1.21 to 15.25; P=0.024) was an independent risk factor for recurrences."
    explanation: >-
      Refutes first-line corticosteroid use by showing it independently predicts recurrence.
      Curated as REFUTE against early use rather than against the drug class in the specific
      indications where it remains appropriate.
  - reference: PMID:35658515
    reference_title: "Pericarditis and Autoinflammation: A Clinical and Genetic Analysis of Patients With Idiopathic Recurrent Pericarditis and Monogenic Autoinflammatory Diseases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In this cohort of patients with IRP, corticosteroid dependence was common (39/136, 28.7%) and was associated with chronic pain"
    explanation: >-
      Supports the reading that corticosteroid dependence is entangled with chronic pain. Graded
      PARTIAL because an association in a referral cohort cannot establish the direction of that
      relationship.
  - reference: PMID:25178809
    reference_title: "Prednisolone and Mycobacterium indicus pranii in tuberculous pericarditis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Prednisolone therapy, as compared with placebo, was associated with significant reductions in the incidence of constrictive pericarditis (4.4% vs. 7.8%; hazard ratio, 0.56; 95% CI, 0.36 to 0.87; P=0.009) and hospitalization (20.7% vs. 25.2%; hazard ratio, 0.79; 95% CI, 0.63 to 0.99; P=0.04)."
    explanation: >-
      The result that runs opposite to the COPE finding above. In tuberculous disease adjunctive
      prednisolone reduced progression to constriction, where in idiopathic disease corticosteroid
      use independently predicted recurrence. Two opposite effects of one drug class in one
      clinical syndrome is the strongest curated evidence in this entry that the syndrome carries
      more than one mechanism. Graded PARTIAL because it is a secondary endpoint in a trial whose
      primary outcome was null.
  - reference: PMID:25178809
    reference_title: "Prednisolone and Mycobacterium indicus pranii in tuberculous pericarditis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with tuberculous pericarditis, neither prednisolone nor M. indicus pranii had a significant effect on the composite of death, cardiac tamponade requiring pericardiocentesis, or constrictive pericarditis."
    explanation: >-
      Refutes routine adjunctive corticosteroid use in tuberculous pericarditis on the trial's
      primary outcome, curated alongside the secondary benefit above so the entry records the
      whole result rather than the more convenient half of it.

- name: Rilonacept
  description: >
    A soluble interleukin-1 receptor fusion protein that traps both interleukin-1 alpha and
    interleukin-1 beta, given weekly by subcutaneous injection, and the first agent approved
    specifically for recurrent pericarditis. Its trial design is what makes it mechanistically
    informative. Patients were brought into remission on drug and then randomised to continue or
    withdraw, so the recurrence rate on placebo measures how much of the ongoing disease depends
    on interleukin-1 rather than how much a drug relieves symptoms.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rilonacept
      term:
        id: NCIT:C84137
        label: Rilonacept
  target_mechanisms:
  - target: Interleukin-1 release and cytokine amplification
    treatment_effect: INHIBITS
    description: >
      Trapping interleukin-1 alpha and beta interrupts the self-amplifying cytokine loop at the
      node that sustains it.
  evidence:
  - reference: PMID:33200890
    reference_title: "Phase 3 Trial of Interleukin-1 Trap Rilonacept in Recurrent Pericarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During this period, 2 of 30 patients (7%) in the rilonacept group had a pericarditis recurrence, as compared with 23 of 31 patients (74%) in the placebo group."
    explanation: >-
      The randomised-withdrawal result, which is both the efficacy evidence and the mechanistic
      evidence that the ongoing disease is interleukin-1 dependent.
  - reference: PMID:33200890
    reference_title: "Phase 3 Trial of Interleukin-1 Trap Rilonacept in Recurrent Pericarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the run-in period, the median time to resolution or near-resolution of pain was 5 days, and the median time to normalization of the CRP level was 7 days."
    explanation: >-
      Records the speed of response, which matters because a mechanism-directed agent acting on
      the driver should resolve both symptom and inflammatory marker rather than symptom alone.

- name: Anakinra
  description: >
    A recombinant interleukin-1 receptor antagonist, tested in the narrowest and most refractory
    population in this disease, namely patients with at least three previous recurrences who were
    both colchicine-resistant and corticosteroid-dependent. That these patients responded is the
    strongest argument that the refractory phenotype is interleukin-1 driven rather than simply
    severe.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: Interleukin-1 release and cytokine amplification
    treatment_effect: INHIBITS
    description: >
      Receptor antagonism blocks signalling by both interleukin-1 alpha and beta at the same node
      the interleukin-1 trap acts on, by a different molecular route.
  evidence:
  - reference: PMID:27825009
    reference_title: "Effect of Anakinra on Recurrent Pericarditis Among Patients With Colchicine Resistance and Corticosteroid Dependence: The AIRTRIP Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent pericarditis occurred in 9 of 10 patients (90%; incidence rate, 2.06% of patients per year) assigned to placebo and 2 of 11 patients (18.2%; incidence rate, 0.11% of patients per year) assigned to anakinra"
    explanation: >-
      Quantifies the effect in the colchicine-resistant, corticosteroid-dependent population,
      which is where the interleukin-1 hypothesis makes its riskiest prediction.
  - reference: PMID:27825009
    reference_title: "Effect of Anakinra on Recurrent Pericarditis Among Patients With Colchicine Resistance and Corticosteroid Dependence: The AIRTRIP Randomized Clinical Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In this preliminary study of patients with recurrent pericarditis with colchicine resistance and corticosteroid dependence, the use of anakinra compared with placebo reduced the risk of recurrence over a median of 14 months. Larger studies are needed to replicate these findings as well as to assess safety and longer-term efficacy."
    explanation: >-
      The authors' own qualification, curated so the entry records that this is a twenty-one
      patient trial rather than a definitive one. Graded PARTIAL for that reason.

- name: Antitubercular therapy
  description: >
    Standard multidrug antitubercular treatment, the aetiology-directed therapy for the
    tuberculous subtype and the only situation in this disease where killing an organism is the
    treatment. It is assumed as background standard of care in every arm of the trials conducted
    in this population, which is why the evidence here establishes it as the platform rather than
    testing it. The same trial's findings on adjunctive prednisolone are curated on the
    corticosteroid treatment entry, where they belong, since it was the corticosteroid and not
    the antitubercular therapy that was randomised.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Pericardial injury from a heterogeneous trigger
    treatment_effect: INHIBITS
    description: >
      Eradicating the organism removes the persistent stimulus driving the response, which is
      possible only where the trigger is an infection that can be killed.
  evidence:
  - reference: PMID:25178809
    reference_title: "Prednisolone and Mycobacterium indicus pranii in tuberculous pericarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tuberculous pericarditis is associated with high morbidity and mortality even if antituberculosis therapy is administered."
    explanation: >-
      Establishes antitubercular therapy as the background standard of care in this subtype, and
      simultaneously records that it is not sufficient, which is why adjunctive strategies were
      tested at all.

- name: Intensified haemodialysis
  description: >
    Increasing dialysis dose or initiating dialysis, the aetiology-directed treatment for uraemic
    and dialysis-associated pericarditis. It is the mechanistic counterpart of antitubercular
    therapy in a non-infectious setting, since both remove the persistent stimulus rather than
    suppressing the response to it, and it is the reason this aetiology is the one where an
    anti-inflammatory drug is not the first move.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  target_mechanisms:
  - target: Pericardial injury from a heterogeneous trigger
    treatment_effect: INHIBITS
    description: >
      Clearing the accumulated uraemic solutes removes the substance injuring the pericardium.
  evidence:
  - reference: PMID:28873222
    reference_title: "Uremic pericarditis, pericardial effusion, and constrictive pericarditis in end-stage renal disease: Insights and pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Uremic pericarditis, the most common manifestation of uremic pericardial disease, is a contemporary problem that calls for intensive hemodialysis, anti-inflammatories, and often, drainage of large inflammatory pericardial effusions."
    explanation: >-
      States intensive haemodialysis as a component of treatment in this aetiology, which is the
      claim this treatment entry makes.

- name: Pericardiocentesis
  description: >
    Drainage of pericardial fluid, required urgently for tamponade and used diagnostically for
    undiagnosed large effusions. It relieves the haemodynamic consequence without touching the
    inflammation that produced it.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Pericardiocentesis
    term:
      id: NCIT:C52010
      label: Pericardiocentesis
  target_mechanisms:
  - target: Cardiac tamponade
    treatment_effect: INHIBITS
    description: >
      Removing fluid lowers intrapericardial pressure below cardiac filling pressures and
      restores diastolic filling.

- name: Pericardiectomy
  description: >
    Surgical removal of the constricting pericardium, the definitive treatment for fixed
    constriction. Outcome depends heavily on aetiology, and radiation-associated constriction
    does worst, with around one in ten dying perioperatively and roughly a third alive at ten
    years. Those numbers are the argument for distinguishing reversible from fixed constriction
    before operating rather than after.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Pericardiectomy
    term:
      id: NCIT:C51643
      label: Pericardiectomy
  target_mechanisms:
  - target: Constrictive physiology
    treatment_effect: INHIBITS
    description: >
      Removing the rigid shell lifts the fixed limit on cardiac volume and allows diastolic
      filling to resume.
  evidence:
  - reference: PMID:34547827
    reference_title: "Outcomes of pericardiectomy for constrictive pericarditis following mediastinal irradiation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall operative mortality was 10.1% (n = 10)."
    explanation: >-
      Quantifies the perioperative risk in the radiation-associated group. Graded PARTIAL
      because it supports the operation being high-risk in this aetiology rather than supporting
      or refuting the operation in general.
  - reference: PMID:34547827
    reference_title: "Outcomes of pericardiectomy for constrictive pericarditis following mediastinal irradiation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall 1, 5-, and 10-years survival was 73.6%, 53.4%, and 32.1%, respectively."
    explanation: >-
      Records the long-term survival that makes radiation-associated constriction the worst
      surgical aetiology, which is the aetiology-dependence this entry curates.

experimental_models:
- name: Interferon-gamma knockout mouse constrictive pericarditis model
  description: >
    Cardiac myosin-induced experimental autoimmune myocarditis in interferon-gamma-deficient
    mice, which develop grossly visible pericarditis with pericardial inflammation and fibrosis
    and a haemodynamic phenotype reproducing human constriction, including the square-root sign
    on pressure tracing. Its value is that it solves an attribution problem. Because the model
    also produces myocarditis, the authors matched animals for myocardial disease severity and
    showed the constrictive haemodynamics tracked the pericardial disease and not the myocardial
    disease, which is the confound that makes restrictive and constrictive physiology hard to
    separate in patients. Its limitation is that constriction arises here from an autoimmune
    myocarditis protocol in a cytokine-deficient animal, which is not how human constriction
    arises.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Constrictive physiology
    description: >
      The model reproduces the constrictive haemodynamic phenotype and attributes it to the
      pericardial rather than the myocardial disease.
  - target: Fibrotic organization of the pericardium
    description: >
      Pericardial inflammation and fibrosis are the lesion that produces the phenotype in this
      model.
  publication: PMID:15505106
  evidence:
  - reference: PMID:15505106
    reference_title: "Novel model of constrictive pericarditis associated with autoimmune heart disease in interferon-gamma-knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Constrictive pericarditis represents a serious hemodynamic syndrome that may lead to heart failure. Studies of its pathophysiological mechanisms have been impeded by the lack of an animal model."
    explanation: >-
      States the gap this model was built to fill, which is also the reason mechanistic
      understanding of constriction lags behind that of the acute disease.
  - reference: PMID:15505106
    reference_title: "Novel model of constrictive pericarditis associated with autoimmune heart disease in interferon-gamma-knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This phenotype was not associated with the severity of myocarditis but correlated with the presence of grossly detectable adhesive pericarditis present only in the KO group and characterized by increased pericardial inflammation and fibrosis."
    explanation: >-
      The dissociation from myocarditis severity, which is what makes the model informative about
      pericardial rather than myocardial mechanism.

- name: Zymosan A intrapericardial injection mouse model
  description: >
    Intrapericardial injection of zymosan A, producing pericardial inflammation with inflammasome
    activation matching that seen in human pericardial tissue. It was used to test inflammasome
    blockers against colchicine, and it is the source of the observation that colchicine improves
    pericardial inflammation only partially where interleukin-1 directed agents improve it
    substantially.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Inflammasome activation in pericardial tissue
    description: >
      The model reproduces inflammasome activation in the pericardium and allows blockers to be
      compared against each other.
  publication: PMID:33665514
  evidence:
  - reference: PMID:33665514
    reference_title: "The Role of NLRP3 Inflammasome in Pericarditis: Potential for Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A mouse model of pericarditis was developed through the intrapericardial injection of zymosan A."
    explanation: >-
      Describes the model and its route of induction.
  - reference: PMID:33665514
    reference_title: "The Role of NLRP3 Inflammasome in Pericarditis: Potential for Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Among inflammasome blockers, NLRP3 inflammasome inhibitor, anakinra, and interleukin-1 trap were found to significantly improve pericardial alterations."
    explanation: >-
      Provides the preclinical counterpart of the two clinical trials curated on the treatment
      entries, testing the same pathway from the opposite direction.

diagnosis:
- name: Clinical diagnosis from pain, rub, electrocardiogram, and effusion
  description: >
    The diagnosis is made when at least two of four features are present, namely characteristic
    pericarditic chest pain, a friction rub, widespread ST-segment elevation or PR-segment
    depression, and a new or worsening pericardial effusion. No single feature is required, which
    reflects that each is intermittent or absent in a substantial fraction of cases.

- name: C-reactive protein guided treatment and activity decisions
  description: >
    The acute-phase response is used to time the taper of anti-inflammatory therapy and the
    return to exercise, rather than only to support the diagnosis. This is unusual among
    cardiovascular diseases and follows from inflammation being the disease rather than a marker
    of it.

- name: Cardiac magnetic resonance to distinguish reversible from fixed constriction
  description: >
    Pericardial late gadolinium enhancement identifies ongoing pericardial inflammation, which is
    what separates the transient constriction that resolves on anti-inflammatory therapy from
    fixed fibrocalcific disease requiring surgery. Given the operative mortality of
    pericardiectomy this distinction is the highest-stakes decision in the disease.

progression:
- phase: Acute episode
  notes: >
    Days to a few weeks. Most idiopathic and viral disease resolves with a non-steroidal
    anti-inflammatory drug and colchicine.

- phase: Recurrence
  notes: >
    Relapse after a symptom-free interval, the commonest complication. Its frequency is the
    reason colchicine is given from the first episode rather than after a first relapse.
  evidence:
  - reference: PMID:21873705
    reference_title: "Colchicine for recurrent pericarditis (CORP): a randomized trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrence is the most common complication of pericarditis, affecting 10% to 50% of patients."
    explanation: >-
      States the frequency and the position of recurrence as the dominant complication of the
      disease.

- phase: Refractory recurrent disease
  notes: >
    A subgroup becomes colchicine-resistant and corticosteroid-dependent, with substantial
    morbidity from both the disease and its treatment. This is the population in which
    interleukin-1 blockade was tested, and in which corticosteroid dependence was found to track
    chronic pain as well as inflammation.

- phase: Constriction
  notes: >
    Fibrotic organisation restricting diastolic filling, developing over months to years. Risk is
    aetiology-dependent, low after idiopathic and viral disease and much higher after tuberculous
    and purulent pericarditis. Radiation-associated constriction may appear years to decades
    after exposure and carries the worst surgical outcome.

differential_diagnoses:
- name: ST-elevation myocardial infarction
  description: >
    Shares chest pain and ST-segment elevation. The distinction is geometric. Pericarditis
    inflames a surface that wraps the whole heart and produces widespread concave elevation
    without reciprocal depression, whereas infarction follows one coronary territory. Getting it
    wrong in the direction of infarction leads to unnecessary catheterisation, and in the other
    direction to a missed occlusion.

- name: Restrictive cardiomyopathy
  description: >
    Shares the physiology of impaired diastolic filling with preserved contraction and is the
    hardest differential in constriction. The distinction matters absolutely, because
    pericardiectomy treats one and does nothing for the other, and it turns on ventricular
    interdependence, which is present when a rigid shell forces the ventricles to share a fixed
    volume and absent when the myocardium itself is stiff.

- name: Pulmonary embolism
  description: >
    Shares pleuritic chest pain, breathlessness, and, in the tamponade case, obstructive shock
    with raised venous pressure and a clear chest. Both impair ventricular filling rather than
    contraction.

- name: Myocarditis
  description: >
    Not so much a differential as an overlapping process, since the same inflammation extends
    into the subepicardial myocardium in a substantial minority and raises troponin. The overlap
    matters because myocardial involvement changes exercise advice and arrhythmia risk.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >
    No population occurrence figure is recorded, because no reference cited in this entry
    reports one. Pericarditis is common as a proportion of emergency presentations with chest
    pain, and tuberculous pericarditis dominates in high-burden settings, but quantifying either
    would require sources this entry does not cite.

discussions:
- discussion_id: why_do_corticosteroids_make_recurrence_more_likely
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Is the association between corticosteroid use and recurrence causal, and if so does it act by
    leaving the innate loop untouched, by prolonging viral persistence, or by selecting patients
    whose pain is not inflammatory?
  rationale: >
    The finding is robust enough to have changed guidelines, since corticosteroid use was an
    independent risk factor for recurrence in multivariable analysis of a randomised trial. Its
    interpretation is not settled. The mechanistic reading offered by this entry, that suppressing
    adaptive immunity does nothing to an innate interleukin-1 loop, is consistent with the drug
    response pattern but is not directly demonstrated. A competing reading is confounding by
    indication, since sicker patients receive steroids. A third possibility is raised by the
    observation that corticosteroid dependence in a recurrent-pericarditis cohort was associated
    with chronic pain, which would mean part of what is treated as steroid-dependent inflammatory
    disease is a pain syndrome that steroids cannot fix and that no anti-inflammatory endpoint
    will capture. These have different consequences for how refractory disease should be managed.
  attaches_to:
  - "pathophysiology#Autoinflammatory recurrence loop"
  evidence:
  - reference: PMID:16186437
    reference_title: "Colchicine in addition to conventional therapy for acute pericarditis: results of the COlchicine for acute PEricarditis (COPE) trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After multivariate analysis, corticosteroid use (OR 4.30, 95% CI 1.21 to 15.25; P=0.024) was an independent risk factor for recurrences."
    explanation: >-
      The observation the question is about. The wide confidence interval is itself part of why
      the effect size, and therefore its interpretation, remains open.
  - reference: PMID:35658515
    reference_title: "Pericarditis and Autoinflammation: A Clinical and Genetic Analysis of Patients With Idiopathic Recurrent Pericarditis and Monogenic Autoinflammatory Diseases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We also found that corticosteroid dependence in IRP is associated with chronic noninflammatory pain."
    explanation: >-
      Supports the third reading, that some steroid-dependent disease is not inflammatory.
      Graded PARTIAL because an association cannot establish which way the relationship runs.

- discussion_id: interleukin_1_blockade_controls_but_does_not_cure
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    What sustains the interleukin-1 loop between relapses, and is there a point at which
    interleukin-1 blockade can be stopped without the disease returning?
  rationale: >
    Both randomised trials of interleukin-1 blockade used a withdrawal design, and both showed
    the disease returning promptly when the drug was stopped. That is what establishes the
    mechanism, and it is also the problem, because it means the treatment is suppressive rather
    than curative and patients face indefinite injections. What holds the loop primed between
    clinically silent intervals is unknown. Candidate explanations include a persistent
    stimulus in the pericardium, an epigenetically trained innate immune state, and an
    underlying autoinflammatory genotype in the subset who carry one, but none has been shown to
    predict who can stop treatment.
  attaches_to:
  - "pathophysiology#Autoinflammatory recurrence loop"
  - "pathophysiology#Interleukin-1 release and cytokine amplification"
  evidence:
  - reference: PMID:27825009
    reference_title: "Effect of Anakinra on Recurrent Pericarditis Among Patients With Colchicine Resistance and Corticosteroid Dependence: The AIRTRIP Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median flare-free survival (time to flare) was 72 (interquartile range, 64-150) days after randomization in the placebo group and was not reached in the anakinra group (P <.001)."
    explanation: >-
      Shows the disease returning within about ten weeks of withdrawal, which is what makes
      indefinite treatment the current default and defines the gap.
  proposed_experiments:
  - experiment_id: exp_biomarker_guided_il1_withdrawal
    name: Biomarker-guided withdrawal of interleukin-1 blockade
    description: >
      In patients in sustained remission on interleukin-1 blockade, randomise withdrawal guided by
      pericardial late gadolinium enhancement and C-reactive protein against fixed-duration
      continuation, with autoinflammatory-gene genotype as a prespecified stratifier, to test
      whether residual pericardial inflammation or genotype identifies who can stop.

- discussion_id: constriction_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Does constrictive pericarditis produced by autoimmune myocarditis in a cytokine-deficient
    mouse model the fibrotic organisation that follows tuberculous, purulent, or radiation
    pericarditis in patients?
  rationale: >
    The only established animal model of constriction arises from cardiac-myosin-induced
    autoimmune myocarditis in interferon-gamma-knockout mice. It reproduces the haemodynamics
    convincingly and, by matching animals for myocarditis severity, it settles that the
    physiology is pericardial. But the route to it is a route human patients do not take. Human
    constriction follows chronic granulomatous infection, purulent infection, cardiac surgery, or
    irradiation, and the absence of interferon-gamma in the model is not incidental, since
    interferon-gamma is central to the Th1 response that drives tuberculous pericarditis, the
    commonest cause of constriction worldwide. A model that removes the cytokine most implicated
    in the dominant human aetiology may be modelling the phenotype rather than the mechanism.
    This is a fidelity question, not an absence of evidence, which is why it is recorded as a
    model mismatch rather than a knowledge gap.
  attaches_to:
  - "pathophysiology#Fibrotic organization of the pericardium"
  - "pathophysiology#Constrictive physiology"
  evidence:
  - reference: PMID:15505106
    reference_title: "Novel model of constrictive pericarditis associated with autoimmune heart disease in interferon-gamma-knockout mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Cardiac myosin-induced experimental autoimmune myocarditis in interferon (IFN)-gamma-knockout (KO) mice results in increased cardiac inflammation and development of severe grossly detectable pericarditis."
    explanation: >-
      States the route by which constriction is produced in the model, which is the route that
      differs from human aetiology. Graded PARTIAL because it supports the model existing without
      addressing its translational validity, which is the open question.
  proposed_experiments:
  - experiment_id: exp_infection_driven_constriction_model
    name: Infection-driven model of pericardial constriction
    description: >
      Develop and characterise a constriction model driven by intrapericardial mycobacterial
      antigen or by a purulent infectious challenge in immunocompetent animals, and compare its
      pericardial transcriptome and fibrotic architecture against both the interferon-gamma
      knockout model and human pericardiectomy specimens, to determine which model the human
      lesion resembles.

notes: >
  Scope. This entry curates pericarditis as one disease with a shared mechanism and multiple
  triggers, with tuberculous and constrictive disease as subtypes rather than separate entries.
  That reflects the convergence the entry argues for and matches the way MONDO treats
  pericarditis, which has constrictive and tuberculous pericarditis as separate descendant terms
  a future entry could take up.

  Module conformance. Two conformances are declared, both to the fibrotic response module, on the
  trigger node and on the fibrotic organisation node. A conformance to the granuloma formation
  module would be appropriate for the tuberculous subtype, since the pericardial lesion there is
  granulomatous and caseating, but this entry cites no evidence for the granulomatous histology
  and therefore does not assert it. That is a specific, tractable extension rather than a
  judgement that the module does not apply.

  Deep-research provenance. Curated from a claude_code deep-research report treated as leads only.
  The report was disciplined about its own uncertainty, explicitly flagging its ontology
  suggestions as unverified and naming several it could not confirm. That caution was warranted.
  Its MONDO suggestion, MONDO:0004770, is exophthalmos. HP:0025091 was offered for pulsus
  paradoxus and is Wrist sign, a Marfan feature. HP:0031653 was offered for pericardial friction
  rub and is Abnormal heart valve physiology. The correct bindings used here are MONDO:0005904,
  HP:6000046, and HP:0034788, together with HP:0033415 for cardiac tamponade and HP:0002563 for
  constrictive pericarditis, none of which the report supplied.

  A citation that does not support its claim. The report attributed a figure of about six percent
  of idiopathic recurrent pericarditis cohorts carrying TNFRSF1A variants to PMID:23745996. That
  paper is a case report describing two patients with rare variants and contains no cohort
  frequency. The gene is retained on the qualitative claim the paper does support, and no
  proportion is asserted anywhere in this entry. This is a different failure from a fabricated
  citation, and it is one that snippet verification cannot catch, because any snippet quoted from
  that paper would validate perfectly while supporting a different claim from the one it was
  attached to.

  A near miss of the same kind, caught in curation. The pericardial effusion phenotype was first
  drafted citing a cohort figure of fifty percent. That figure counts extrapericardial effusions,
  meaning pleural and peritoneal fluid, not the pericardial effusion the phenotype names. The
  evidence item was removed rather than reworded, and the phenotype now carries no frequency
  claim.

  NEC preflight returned SKIP, since MONDO records no causal gene for pericarditis. The manual
  fallback needs a note. The report's most frequently named genes are MEFV, TNFRSF1A, and NLRP3,
  and its OMIM identifiers are those of familial Mediterranean fever and the tumour necrosis
  factor receptor-associated periodic syndrome. Taken naively that pattern looks like a report
  about periodic fever syndromes rather than about pericarditis. It is not, because the
  autoinflammatory connection is a genuine and central feature of recurrent pericarditis, but the
  resemblance is close enough that this entry has been careful to take gene associations only
  from studies performed in pericarditis cohorts and not to import phenotypes, frequencies, or
  treatment claims from the periodic fever literature.

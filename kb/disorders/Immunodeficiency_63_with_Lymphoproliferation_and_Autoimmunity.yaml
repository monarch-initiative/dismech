  downstream:
  - target: Loss of Peripheral Tolerance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutant animals receiving WT Tregs neonatally exhibit almost complete
        restoration of conventional T cell distribution, IL-2Rβ receptor surface
        expression, and STAT5 signal transduction, while BMC animals exhibit only
        partial restoration.
      explanation: >-
        Supplying wild-type Tregs rescues the phenotype, which is a sufficiency
        test for this edge rather than a correlation between two measurements.
- name: NK Cell Maturation Defect
  biological_scale: CELLULAR
  description: >-
    The NK compartment is disturbed but not absent. The two index reports
    describe it differently -- one found NK cells retaining partial IL-2Rbeta
    expression and function, the other an expansion of CD56-bright NK cells with
    a lack of terminally differentiated cells -- and both differ from the mouse
    knockout, which has no NK cells at all.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0001779
      label: natural killer cell differentiation
  evidence:
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these siblings demonstrate an expansion of NK cells, particularly the
      CD56bright subset, and a lack of terminally differentiated NK cells
    explanation: >-
      This is a maturation arrest with expansion of the immature subset, not an
      absence of NK cells.
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By contrast, natural killer cells retained partial IL-2Rβ expression and
      function.
    explanation: >-
      The other index cohort reports partial retention of NK receptor expression
      and function, which is the finding the description above records as
      differing between the two reports.
  downstream:
  - target: Impaired Control of Cytomegalovirus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced NK-cell cytotoxic effector function
    description: >-
      NK cells are a principal effector against CMV, and CMV disease is one of
      the near-constant features of the syndrome.
    evidence:
    - reference: PMID:31040184
      reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        occurring in two infant siblings with a homozygous IL2RB mutation in the
        WSXWS motif, manifesting as multisystem autoimmunity and susceptibility to
        CMV infection
      explanation: >-
        CMV susceptibility is reported alongside the NK defect in the same
        patients. The intermediate step from NK maturation arrest to failed viral
        control is not separately measured in these patients, which is why the
        link is marked indirect.

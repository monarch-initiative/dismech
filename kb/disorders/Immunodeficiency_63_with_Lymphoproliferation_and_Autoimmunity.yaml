name: Immunodeficiency 63 with Lymphoproliferation and Autoimmunity
creation_date: "2026-08-31T15:10:00Z"
description: >-
  Immunodeficiency 63 with lymphoproliferation and autoimmunity is an autosomal
  recessive inborn error of immunity caused by biallelic variants in IL2RB,
  which encodes CD122, the beta chain shared by the interleukin-2 and
  interleukin-15 receptors. Because that one chain serves two cytokines with
  opposite jobs, its loss produces a disease that runs in two directions at
  once: regulatory T cells fail, giving autoantibodies, hypergammaglobulinaemia,
  enteropathy, dermatitis and lymphoproliferation, while NK-cell maturation is
  disturbed, giving cytomegalovirus disease. Haematopoietic stem cell transplant
  is the only reported treatment that addresses the receptor defect itself.
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 63 with lymphoproliferation and autoimmunity
  term:
    id: MONDO:0032782
    label: immunodeficiency 63 with lymphoproliferation and autoimmunity
synonyms:
- IMD63
- IL-2 receptor beta chain deficiency
- IL-2Rbeta deficiency
- CD122 deficiency
- IL2RB deficiency
parents:
- inborn error of immunity
- primary immune regulatory disorder
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both index reports describe homozygous IL2RB variants, in consanguineous
    families in one series and in two infant siblings in the other.
  evidence:
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report three homozygous mutations in the IL2RB gene of eight
      individuals from four consanguineous families that cause disease by
      distinct mechanisms.
    explanation: >-
      Homozygous variants segregating in consanguineous families establish the
      recessive mode.
  - reference: PMID:31068380
    reference_title: "IL2RB maintains immune harmony."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      independently report the first observations of autosomal recessive
      mutations in IL2RB, revealing a requirement for IL2RB in immunity and
      peripheral immune tolerance
    explanation: >-
      A commentary on both index papers states the inheritance pattern for the
      disease as a whole.
prevalence:
- population: Reported IL2RB literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The disease was defined in 2019 by two papers reporting ten patients between
    them: eight from four consanguineous families, and two infant siblings.
  evidence:
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report three homozygous mutations in the IL2RB gene of eight
      individuals from four consanguineous families that cause disease by
      distinct mechanisms.
    explanation: >-
      The size of the founding cohort supports an ultra-rare disorder counted in
      published cases.
progression:
- phase: Infantile onset
  notes: >-
    Presentation is in infancy with multisystem autoimmunity and viral
    susceptibility together, rather than with one and then the other.
  evidence:
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      occurring in two infant siblings with a homozygous IL2RB mutation in the
      WSXWS motif, manifesting as multisystem autoimmunity and susceptibility to
      CMV infection
    explanation: >-
      The index siblings present in infancy with both arms of the phenotype at
      once.
pathophysiology:
- name: IL2RB Loss of Function Reduces CD122 Surface Expression
  biological_scale: MOLECULAR
  description: >-
    Biallelic IL2RB variants reduce or abolish surface CD122. The mechanisms
    differ between alleles, and a recombinant system reproduced both the loss of
    surface expression and the loss of IL-2 binding.
  genes:
  - preferred_term: IL2RB
    term:
      id: hgnc:6009
      label: IL2RB
  evidence:
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IL-2Rβ loss of function was recapitulated in a recombinant system in which
      IL2RB mutations caused reduced surface expression and IL-2 binding.
    explanation: >-
      A reconstitution experiment establishes that the variants themselves cause
      the receptor defect, rather than the defect being a consequence of the
      patients' disease state.
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hypomorphic mutation results in diminished IL-2Rβ surface expression
      and dysregulated IL-2/15 signaling
    explanation: >-
      A hypomorphic allele reduces rather than abolishes surface expression,
      which is why the node is written as reduced expression rather than absence.
  downstream:
  - target: Failed IL-2 and IL-15 Signalling
    causal_link_type: DIRECT
    description: >-
      Without the shared beta chain, neither IL-2 nor IL-15 can signal normally.
    evidence:
    - reference: PMID:31040185
      reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient T lymphocytes lacked surface expression of IL-2Rβ and were unable
        to respond to IL-2 stimulation.
      explanation: >-
        The same cells that lack the receptor fail to respond to its ligand,
        which is the causal step this edge records.
- name: Failed IL-2 and IL-15 Signalling
  biological_scale: CELLULAR
  description: >-
    IL-2- and IL-15-dependent STAT5 signalling is impaired. The mouse knock-in
    model shows a second consequence that follows from the receptor not
    consuming its ligands: serum IL-2 and IL-15 rise.
  biological_processes:
  - preferred_term: interleukin-2-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038110
      label: interleukin-2-mediated signaling pathway
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:40570369
    reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our model recapitulates the human immune dysregulation phenotype, showing
      decreased mutant interleukin-2Rβ (IL-2Rβ) cell-surface expression, impaired
      IL-2/15-dependent STAT5 signaling, elevated serum IL-2/15 levels, expanded
      effector memory CD8+ T cells, and severely reduced regulatory T cells
      (Tregs).
    explanation: >-
      The mouse model names the signalling lesion (STAT5) and the downstream
      cellular consequences in one sentence.
  downstream:
  - target: Regulatory T Cell Deficiency
    causal_link_type: DIRECT
    description: >-
      Regulatory T cells depend on IL-2 for their development and maintenance,
      so they are the population that fails first.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings demonstrate that CD8+ T cells and Tregs have distinct
        IL-2/15 ligand/receptor ratios and signaling thresholds required for
        proper development/function, revealing mechanistic insights applicable to
        immunotherapy for autoimmunity.
      explanation: >-
        The differing signalling thresholds are the reason one receptor lesion
        hits Tregs harder than conventional T cells, which is what makes this
        edge, rather than a general immune failure, the right shape.
  - target: NK Cell Maturation Defect
    causal_link_type: DIRECT
    description: >-
      IL-15 signals through the same beta chain and drives NK-cell development
      and terminal differentiation.
    evidence:
    - reference: PMID:31040184
      reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, the early-onset autoimmunity and immunodeficiency are linked to
        functional deficits arising from altered IL-2Rβ expression and signaling
        in T and NK cells.
      explanation: >-
        The paper attributes the NK arm of the phenotype to the same receptor
        lesion.
  - target: Effector Memory CD8 T Cell Expansion
    causal_link_type: DIRECT
    description: >-
      With Treg restraint removed and IL-15 dysregulated, effector memory CD8 T
      cells expand.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        expanded effector memory CD8+ T cells, and severely reduced regulatory T
        cells (Tregs)
      explanation: >-
        Both cellular changes are reported together in the model carrying the
        receptor lesion.
- name: Regulatory T Cell Deficiency
  biological_scale: CELLULAR
  description: >-
    Regulatory T cells are severely reduced. In the mouse model this is the
    causally decisive population: transferring wild-type Tregs into mutant
    animals suppresses the autoimmunity without correcting the mutant Tregs
    themselves.
  cell_types:
  - preferred_term: regulatory T cell

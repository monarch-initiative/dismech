animal_models:
- name: Il2rb hypomorphic knock-in mouse
  species: Mouse
  genotype: Homologous knock-in of the human hypomorphic IL2RB mutation
  publication: PMID:40570369
  description: >-
    A knock-in carrying the homologous human hypomorphic mutation, built
    specifically because the conventional Il2rb knockout has no NK cells and so
    does not match the human disease.
  modeled_mechanisms:
  - target: Failed IL-2 and IL-15 Signalling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the reduced surface receptor, the impaired STAT5 signalling and
      the raised serum cytokine levels.
    limitations: >-
      Mouse and human differ in the NK compartment for this receptor, so the
      model is informative for the T-cell arm and much less so for the NK arm.
    readouts:
    - name: IL-2/15-dependent STAT5 signalling
      target: Failed IL-2 and IL-15 Signalling
      direction: DECREASED
      interpretation: >-
        Direct signalling readout of the node.
      evidence:
      - reference: PMID:40570369
        reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          impaired IL-2/15-dependent STAT5 signaling, elevated serum IL-2/15
          levels
        explanation: >-
          Both the signalling defect and its ligand-accumulation consequence are
          measured.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our model recapitulates the human immune dysregulation phenotype, showing
        decreased mutant interleukin-2Rβ (IL-2Rβ) cell-surface expression, impaired
        IL-2/15-dependent STAT5 signaling, elevated serum IL-2/15 levels, expanded
        effector memory CD8+ T cells, and severely reduced regulatory T cells
        (Tregs).
      explanation: >-
        The paper states that the model recapitulates the human phenotype and
        names the specific readouts.
  - target: Regulatory T Cell Deficiency
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Neonatal transfer of wild-type Tregs into mutant animals largely restores
      conventional T-cell distribution and STAT5 signalling, and suppresses
      autoimmunity, without affecting the endogenous mutant Tregs. This is the
      strongest causal evidence in the entry that Treg failure drives the
      autoimmune arm.
    limitations: >-
      The rescue is in mouse, and no equivalent Treg-directed intervention has
      been reported in a patient.
    readouts:
    - name: Autoimmunity and serum cytokine levels after wild-type Treg transfer
      target: Regulatory T Cell Deficiency
      direction: RESTORED
      interpretation: >-
        Supplying the missing population corrects the downstream phenotype.
      evidence:
      - reference: PMID:40570369
        reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Both approaches suppress abnormal serum cytokine levels and autoimmunity
          without affecting endogenous mutant Tregs.
        explanation: >-
          The rescue is specific: the endogenous mutant Tregs are unchanged, so
          the correction is attributable to the transferred wild-type cells.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using mixed bone marrow chimeras (BMCs) and wild-type (WT) Treg transfers,
        we distinguish receptor-intrinsic from receptor-extrinsic
        immunopathogenesis.
      explanation: >-
        The experimental design is built to separate the two possible causes,
        which is what makes it informative for this node.
  - target: NK Cell Maturation Defect
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The conventional Il2rb knockout mouse lacks NK cells entirely, whereas
      patients have NK cells that are present and in one report expanded. The
      mouse therefore does not model the human NK phenotype.
    limitations: >-
      This claim is about the conventional knockout, which the index human paper
      contrasts itself against; the hypomorphic knock-in paper reports T-cell
      mechanisms and does not resolve the NK discrepancy. Any inference from
      mouse NK biology to the patients' viral susceptibility is therefore
      unsafe.
    evidence:
    - reference: PMID:31040184
      reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, in contrast to the IL-2Rβ-/- animal model, which lacks NK cells,
        these siblings demonstrate an expansion of NK cells, particularly the
        CD56bright subset, and a lack of terminally differentiated NK cells
      explanation: >-
        The paper states the species discrepancy explicitly, in the direction
        this link records.
discussions:
- discussion_id: il2rb_nk_species_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the mouse Il2rb model tell us anything about the NK-cell arm of human
    IL-2Rbeta deficiency, given that the knockout mouse has no NK cells while
    patients have NK cells that are present and in one report expanded?
  attaches_to:
  - pathophysiology#NK Cell Maturation Defect
  - animal_models#Mouse
  rationale: >-
    The CMV susceptibility is the feature that makes this an immunodeficiency
    rather than a pure tolerance disorder, and NK cells are the presumed
    effector. But the model system that would be used to test that has the
    opposite NK phenotype. This is not a gap in evidence -- there is a mouse, and
    it is informative for the T-cell arm -- it is a question about whether the
    model transfers, which is why it is recorded as a mismatch rather than a
    knowledge gap.
  status: OPEN
  proposed_experiments:
  - experiment_id: il2rb_patient_nk_cytotoxicity
    name: Functional NK cytotoxicity and CMV control in patient cells
    description: >-
      Measure NK cytotoxic function and CMV-specific control directly in patient
      NK cells, rather than inferring it from the mouse or from the maturation
      phenotype.
    readouts:
    - name: NK-cell cytotoxicity against CMV-infected targets
      target: NK Cell Maturation Defect
      direction: DECREASED
      interpretation: >-
        Would establish that the maturation arrest translates into failed viral
        control in humans.
    would_support:
    - pathophysiology#Impaired Control of Cytomegalovirus
  evidence:
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in contrast to the IL-2Rβ-/- animal model, which lacks NK cells,
      these siblings demonstrate an expansion of NK cells, particularly the
      CD56bright subset, and a lack of terminally differentiated NK cells
    explanation: >-
      The mismatch is stated by the authors themselves.
- discussion_id: il2rb_nk_report_discrepancy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do the two index cohorts genuinely disagree about the NK compartment, or are
    they describing allele-specific differences?
  attaches_to:
  - pathophysiology#NK Cell Maturation Defect
  rationale: >-
    One cohort reports NK cells retaining partial IL-2Rbeta expression and
    function; the other reports an expansion of CD56-bright NK cells with absent
    terminal differentiation. Those are not the same observation, and with three
    alleles in one paper and one in the other, there is no way from the published
    data to tell an allele effect from a measurement difference. Curating either
    as the NK phenotype of the disease would overstate what is known.
  status: OPEN
notes: >-
  Two things about this entry are worth a reader's attention. First, the disease
  is one receptor lesion with two opposite consequences, so the pathograph
  branches rather than running as a chain -- an immunodeficiency and an
  autoimmune disorder in the same patient. Second, the strongest causal evidence
  in the entry is a mouse Treg-transfer rescue, while the strongest human
  evidence is a single transplanted patient. That asymmetry is deliberate and is
  recorded on the individual items rather than smoothed over.

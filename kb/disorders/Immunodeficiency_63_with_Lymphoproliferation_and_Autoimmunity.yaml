      expression of wild-type IL-2Rβ also increased the IL-2 responsiveness of
      patient T lymphocytes in vitro.
    explanation: >-
      A single transplanted patient improved. One patient is a weak basis for a
      treatment claim, which is why the description says so rather than
      generalising.

notes: >-
  Two things about this entry are worth a reader's attention. First, the disease
  is one receptor lesion with two opposite consequences, so the pathograph
  branches rather than running as a chain -- an immunodeficiency and an
  autoimmune disorder in the same patient. Second, the strongest causal evidence
  in the entry is a mouse Treg-transfer rescue, while the strongest human
  evidence is a single transplanted patient. That asymmetry is deliberate and is
  recorded on the individual items rather than smoothed over.

genetic:
- name: IL2RB
  gene_term:
    preferred_term: IL2RB
    term:
      id: hgnc:6009
      label: IL2RB
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Four alleles are reported and they fail in three different ways, which is
    what the index paper means by "distinct mechanisms": p.Leu77Pro misfolds and
    is sequestered intracellularly, p.Ser40Leu reaches the surface but cannot
    signal, p.Pro222_Gln225del disrupts the WSXWS motif and loses surface
    expression, and p.Gln96* truncates. The first three are hypomorphic and give
    the infantile immune-dysregulation phenotype; the truncating allele is
    perinatally lethal.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variants:
  - name: p.Leu77Pro
    description: >-
      Misfolded and intracellularly sequestered, so surface IL-2Rbeta is severely
      reduced, yet the mutant retains some signalling capacity where it does
      reach the surface.
    gene:
      preferred_term: IL2RB
      term:
        id: hgnc:6009
        label: IL2RB
    evidence:
    - reference: PMID:31068380
      reference_title: "IL2RB maintains immune harmony."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Leu77Pro mutant was intracellularly sequestered due to misfolding.
      explanation: >-
        Names the molecular mechanism for this allele: a trafficking defect, not
        a signalling-domain defect.
  - name: p.Ser40Leu
    description: >-
      Sits at a ligand-binding interface. Surface expression is only partially
      reduced, but the receptor cannot induce STAT5 phosphorylation, so this is a
      signalling defect rather than an expression defect.
    gene:
      preferred_term: IL2RB
      term:
        id: hgnc:6009
        label: IL2RB
    evidence:
    - reference: PMID:31068380
      reference_title: "IL2RB maintains immune harmony."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Ser40Leu mutant was only partially reduced, but this mutant could not
        induce STAT5 phosphorylation in reconstituted HEK-293T cells.
      explanation: >-
        Expression and function dissociate for this allele, which is why surface
        staining alone would not identify it.
  - name: p.Pro222_Gln225del
    description: >-
      A 9-bp in-frame deletion disrupting the conserved extracellular WSXWS
      motif, drastically reducing surface expression. This is the allele in the
      two index siblings and the one with five-year post-transplant follow-up.
    gene:
      preferred_term: IL2RB
      term:
        id: hgnc:6009
        label: IL2RB
    evidence:
    - reference: PMID:31068380
      reference_title: "IL2RB maintains immune harmony."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pro222_Gln225del) that disrupts the extracellular, highly conserved WSXWS
        motif.
      explanation: >-
        Identifies the allele found in the index siblings and locates it in the
        WSXWS motif. This item carries the structural claim only; the measured
        consequence for receptor surface expression is a separate claim in the
        item below.
    - reference: PMID:31068380
      reference_title: "IL2RB maintains immune harmony."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        As assessed by flow cytometry on patient lymphocytes, the IL2RB
        p.Pro222_Gln225del mutation drastically reduced IL-2Rβ surface
        expression.
      explanation: >-
        The measured consequence of the WSXWS deletion. Graded HUMAN_CLINICAL
        because the quoted sentence names its own method: flow cytometry on the
        patients' own lymphocytes, the same assay class as the Treg
        immunophenotyping item above. The HEK-293T reconstitution work in this
        paragraph belongs to p.Leu77Pro and p.Ser40Leu, not to this allele.
  - name: p.Gln96*
    description: >-
      A truncating allele, and the severe end of the spectrum: the kindred
      carrying it comprised two fetuses and a neonate who died of respiratory
      failure. Unlike the three hypomorphic alleles, this one is not compatible
      with the infantile immune-dysregulation presentation.
    gene:
      preferred_term: IL2RB
      term:
        id: hgnc:6009
        label: IL2RB
    evidence:
    - reference: PMID:31068380
      reference_title: "IL2RB maintains immune harmony."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Gln96* and consisted of two fetuses and a prematurely born neonate who
        died of respiratory failure shortly after delivery.
      explanation: >-
        Ties the truncating allele to the perinatally lethal phenotype.
  evidence:
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identify human interleukin-2 receptor (IL-2R) β chain (IL2RB) gene
      defects as a cause of life-threatening immune dysregulation.
    explanation: >-
      This is the gene-disease statement.
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the first human defect in IL-2Rβ, occurring in two infant
      siblings with a homozygous IL2RB mutation in the WSXWS motif
    explanation: >-
      An independent group reports the gene-disease relationship in the same
      year with a different allele.
phenotypes:
- category: Immunologic

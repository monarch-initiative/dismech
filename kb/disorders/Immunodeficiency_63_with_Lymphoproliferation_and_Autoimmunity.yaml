name: Immunodeficiency 63 with Lymphoproliferation and Autoimmunity
creation_date: "2026-08-31T15:10:00Z"
description: >-
  Immunodeficiency 63 with lymphoproliferation and autoimmunity is an autosomal
  recessive inborn error of immunity caused by biallelic variants in IL2RB,
  which encodes CD122, the beta chain shared by the interleukin-2 and
  interleukin-15 receptors. Because that one chain serves two cytokines with
  opposite jobs, its loss produces a disease that runs in two directions at
  once: regulatory T cells fail, giving autoantibodies, hypergammaglobulinaemia,
  enteropathy, dermatitis and lymphoproliferation, while NK-cell maturation is
  disturbed, giving cytomegalovirus disease. Haematopoietic stem cell transplant
  is the only reported treatment that addresses the receptor defect itself.
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 63 with lymphoproliferation and autoimmunity
  term:
    id: MONDO:0032782
    label: immunodeficiency 63 with lymphoproliferation and autoimmunity
synonyms:
- IMD63
- IL-2 receptor beta chain deficiency
- IL-2Rbeta deficiency
- CD122 deficiency
- IL2RB deficiency
parents:
- inborn error of immunity
- primary immune regulatory disorder
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both index reports describe homozygous IL2RB variants, in consanguineous
    families in one series and in two infant siblings in the other.
  evidence:
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report three homozygous mutations in the IL2RB gene of eight
      individuals from four consanguineous families that cause disease by
      distinct mechanisms.
    explanation: >-
      Homozygous variants segregating in consanguineous families establish the
      recessive mode.
  - reference: PMID:31068380
    reference_title: "IL2RB maintains immune harmony."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      independently report the first observations of autosomal recessive
      mutations in IL2RB, revealing a requirement for IL2RB in immunity and
      peripheral immune tolerance
    explanation: >-
      A commentary on both index papers states the inheritance pattern for the
      disease as a whole.
prevalence:
- population: Reported IL2RB literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The disease was defined in 2019 by two papers reporting ten patients between
    them: eight from four consanguineous families, and two infant siblings.
  evidence:
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report three homozygous mutations in the IL2RB gene of eight
      individuals from four consanguineous families that cause disease by
      distinct mechanisms.
    explanation: >-
      The size of the founding cohort supports an ultra-rare disorder counted in
      published cases.
progression:
- phase: Perinatal lethal presentation
  notes: >-
    The severe end of the allelic spectrum. The p.Gln96* truncating kindred
    comprised two fetuses and a prematurely born neonate who died of respiratory
    failure shortly after delivery, so a substantial fraction of reported
    affected individuals never reached the infantile presentation described
    below.
  evidence:
  - reference: PMID:31068380
    reference_title: "IL2RB maintains immune harmony."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gln96* and consisted of two fetuses and a prematurely born neonate who died
      of respiratory failure shortly after delivery.
    explanation: >-
      Describes the perinatally lethal kindred and its allele.
- phase: Infantile onset
  notes: >-
    Presentation is in infancy with multisystem autoimmunity and viral
    susceptibility together, rather than with one and then the other.
  evidence:
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      occurring in two infant siblings with a homozygous IL2RB mutation in the
      WSXWS motif, manifesting as multisystem autoimmunity and susceptibility to
      CMV infection
    explanation: >-
      The index siblings present in infancy with both arms of the phenotype at
      once.
pathophysiology:
- name: IL2RB Loss of Function Reduces CD122 Surface Expression
  biological_scale: MOLECULAR
  description: >-
    Biallelic IL2RB variants reduce or abolish surface CD122. The mechanisms
    differ between alleles, and a recombinant system reproduced both the loss of
    surface expression and the loss of IL-2 binding.
  genes:
  - preferred_term: IL2RB
    term:
      id: hgnc:6009
      label: IL2RB
  evidence:
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IL-2Rβ loss of function was recapitulated in a recombinant system in which
      IL2RB mutations caused reduced surface expression and IL-2 binding.
    explanation: >-
      A reconstitution experiment establishes that the variants themselves cause
      the receptor defect, rather than the defect being a consequence of the
      patients' disease state.
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hypomorphic mutation results in diminished IL-2Rβ surface expression
      and dysregulated IL-2/15 signaling
    explanation: >-
      A hypomorphic allele reduces rather than abolishes surface expression,
      which is why the node is written as reduced expression rather than absence.
  downstream:
  - target: Failed IL-2 and IL-15 Signalling
    causal_link_type: DIRECT
    description: >-
      Without the shared beta chain, neither IL-2 nor IL-15 can signal normally.
    evidence:
    - reference: PMID:31040185
      reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient T lymphocytes lacked surface expression of IL-2Rβ and were unable
        to respond to IL-2 stimulation.
      explanation: >-
        The same cells that lack the receptor fail to respond to its ligand,
        which is the causal step this edge records.
- name: Failed IL-2 and IL-15 Signalling
  biological_scale: CELLULAR
  description: >-
    IL-2- and IL-15-dependent STAT5 signalling is impaired. The mouse knock-in
    model shows a second consequence that follows from the receptor not
    consuming its ligands: serum IL-2 and IL-15 rise.
  biological_processes:
  - preferred_term: interleukin-2-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0038110
      label: interleukin-2-mediated signaling pathway
  - preferred_term: interleukin-15-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0035723
      label: interleukin-15-mediated signaling pathway
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:40570369
    reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our model recapitulates the human immune dysregulation phenotype, showing
      decreased mutant interleukin-2Rβ (IL-2Rβ) cell-surface expression, impaired
      IL-2/15-dependent STAT5 signaling, elevated serum IL-2/15 levels, expanded
      effector memory CD8+ T cells, and severely reduced regulatory T cells
      (Tregs).
    explanation: >-
      The mouse model names the signalling lesion (STAT5) and the downstream
      cellular consequences in one sentence.
  downstream:
  - target: Regulatory T Cell Deficiency
    causal_link_type: DIRECT
    description: >-
      Regulatory T cells depend on IL-2 for their development and maintenance,
      so they are the population that fails first.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings demonstrate that CD8+ T cells and Tregs have distinct
        IL-2/15 ligand/receptor ratios and signaling thresholds required for
        proper development/function, revealing mechanistic insights applicable to
        immunotherapy for autoimmunity.
      explanation: >-
        The differing signalling thresholds are the reason one receptor lesion
        hits Tregs harder than conventional T cells, which is what makes this
        edge, rather than a general immune failure, the right shape.
  - target: NK Cell Maturation Defect
    causal_link_type: DIRECT
    description: >-
      IL-15 signals through the same beta chain and drives NK-cell development
      and terminal differentiation.
    evidence:
    - reference: PMID:31040184
      reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, the early-onset autoimmunity and immunodeficiency are linked to
        functional deficits arising from altered IL-2Rβ expression and signaling
        in T and NK cells.
      explanation: >-
        The paper attributes the NK arm of the phenotype to the same receptor
        lesion.
  - target: Effector Memory CD8 T Cell Expansion
    causal_link_type: DIRECT
    description: >-
      With Treg restraint removed and IL-15 dysregulated, effector memory CD8 T
      cells expand.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        expanded effector memory CD8+ T cells, and severely reduced regulatory T
        cells (Tregs)
      explanation: >-
        Both cellular changes are reported together in the model carrying the
        receptor lesion.
- name: Regulatory T Cell Deficiency
  biological_scale: CELLULAR
  description: >-
    Regulatory T cells are severely reduced, measured directly by
    immunophenotyping in patients from both index cohorts. In the mouse model
    this is also the causally decisive population: transferring wild-type Tregs
    into mutant animals suppresses the autoimmunity without correcting the mutant
    Tregs themselves.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    modifier: DECREASED
    term:
      id: GO:0045066
      label: regulatory T cell differentiation
  evidence:
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the proportion of CD4+CD25+FOXP3+ T regs was decreased in the
      patient.
    explanation: >-
      Measured directly in the patient by immunophenotyping. The abstract's
      "anticipated reduction" wording understates what the paper's own results
      section reports.
  - reference: PMID:31068380
    reference_title: "IL2RB maintains immune harmony."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fittingly, the frequency of CD4+CD25+FoxP3+ regulatory T cells were clearly
      diminished in the two IL2RB-deficient patients examined.
    explanation: >-
      A second human measurement of the Treg reduction. Note this source
      (PMID:31068380) is a JEM Comment summarising both index papers, not a
      separate study, so it is a second reported measurement rather than an
      independent replication -- it draws on the same patients.
  - reference: PMID:40570369
    reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      expanded effector memory CD8+ T cells, and severely reduced regulatory T
      cells (Tregs)
    explanation: >-
      The Treg reduction is measured directly in the knock-in model.
  downstream:
  - target: Loss of Peripheral Tolerance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutant animals receiving WT Tregs neonatally exhibit almost complete
        restoration of conventional T cell distribution, IL-2Rβ receptor surface
        expression, and STAT5 signal transduction, while BMC animals exhibit only
        partial restoration.
      explanation: >-
        Supplying wild-type Tregs rescues the phenotype, which is a sufficiency
        test for this edge rather than a correlation between two measurements.
- name: NK Cell Maturation Defect
  biological_scale: CELLULAR
  description: >-
    NK cells are present and expanded, but developmentally immature. Across the
    p.Ser40Leu, p.Leu77Pro and p.Pro222_Gln225del alleles, peripheral NK numbers
    and frequencies were all increased, with elevated CD56-bright frequencies and
    negligible CD57. Cytotoxicity is preserved; the deficit is in differentiation
    and, selectively, in IL-2/IL-15-driven IFN-gamma production.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0001779
      label: natural killer cell differentiation
  evidence:
  - reference: PMID:31040184
    reference_title: "A novel human IL2RB mutation results in T and NK cell-driven immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these siblings demonstrate an expansion of NK cells, particularly the
      CD56bright subset, and a lack of terminally differentiated NK cells
    explanation: >-
      This is a maturation arrest with expansion of the immature subset, not an
      absence of NK cells.
  - reference: PMID:31068380
    reference_title: "IL2RB maintains immune harmony."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pro222_Gln225del mutations surprisingly all displayed increased peripheral
      blood NK cell numbers and frequencies.
    explanation: >-
      The expansion holds across three different alleles, so it is a property of
      the disease rather than of one family. The source is a Comment summarising
      the index papers, so this pools their patients rather than adding new ones.
  - reference: PMID:31068380
    reference_title: "IL2RB maintains immune harmony."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite preservation of NK cell numbers, IL2RB-deficient patients exhibited
      a more prominent immature NK cell phenotype, with elevated frequencies of
      CD56bright cells and negligible expression of the differentiation marker
      CD57.
    explanation: >-
      Numbers preserved, maturation arrested. This is the reading, from the JEM
      Comment that summarises both index papers, under which the two reports
      agree rather than conflict.
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By contrast, natural killer cells retained partial IL-2Rβ expression and
      function.
    explanation: >-
      Partial retention of receptor expression and function in NK cells, in
      contrast to the T-cell compartment where surface expression was absent.
  downstream:
  - target: Impaired Control of Cytomegalovirus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failed differentiation toward adaptive (memory-like) NK cells
    - selective resistance to IL-2/IL-15-driven IFN-gamma production
    description: >-
      Cytotoxicity is NOT the failing step. Patient NK cells degranulate and kill
      targets normally, and do so better after IL-2 or IL-15 priming. What fails
      is differentiation toward adaptive NK cells and, selectively, IFN-gamma
      production in response to IL-2/IL-15 while the IL-12/IL-18 route stays
      intact.
    evidence:
    - reference: PMID:31068380
      reference_title: "IL2RB maintains immune harmony."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, susceptibility to CMV in the IL2RB-deficient patients may be
        attributed to defects in NK cell differentiation toward adaptive NK cells
      explanation: >-
        Names the intermediate the commentary attributes the CMV susceptibility
        to. The same sentence goes on to note that the relative contribution of
        differentiated CD8+ T cells versus NK cells is hard to separate, which is
        why the link stays INDIRECT.
    - reference: PMID:31068380
      reference_title: "IL2RB maintains immune harmony."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Functionally, NK cells in the IL2RB-deficient patients were capable of
        degranulation and target cell killing, which was enhanced by IL-2 or
        IL-15 priming.
      explanation: >-
        Cited as REFUTE against the intuitive reading that the CMV susceptibility
        runs through lost NK cytotoxicity. It does not: killing is preserved and
        is even improved by priming.
    - reference: PMID:31068380
      reference_title: "IL2RB maintains immune harmony."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast, NK cells appeared to display a selective resistance to
        IFN-γ production through IL-2 or IL-15 stimulation, while responding
        normally to IL-12 and IL-18.
      explanation: >-
        Identifies the specific functional deficit, and its selectivity: only the
        IL-2/IL-15 route is affected, which is exactly what a shared beta-chain
        lesion predicts.

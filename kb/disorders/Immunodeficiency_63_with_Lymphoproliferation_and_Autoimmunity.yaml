diagnosis:
- name: Surface CD122 expression and IL-2 responsiveness on T cells
  description: >-
    The functional signature is loss of surface IL-2Rbeta on T lymphocytes with
    failure to respond to IL-2, alongside NK cells that retain at least partial
    receptor expression. That T-versus-NK dissociation is characteristic and is
    what distinguishes the defect from a general cytokine-receptor failure.
  evidence:
  - reference: PMID:31040185
    reference_title: "Human interleukin-2 receptor β mutations associated with defects in immunity and peripheral tolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient T lymphocytes lacked surface expression of IL-2Rβ and were unable
      to respond to IL-2 stimulation.
    explanation: >-
      The assay and its result in patients are stated directly.
differential_diagnoses:
- name: Other ALPS-like primary immune regulatory disorders
  description: >-
    IL2RB sits among the regulatory T-cell defects that produce an ALPS-like
    picture, alongside CTLA4, LRBA, STAT3 gain of function, IL2RA and DEF6.
    CTLA4 and LRBA account for roughly half of all ALPS-like cases, so they are
    the commoner alternatives; the CMV susceptibility is what points at IL2RB.
  evidence:
  - reference: PMID:34447369
    reference_title: "Primary Immune Regulatory Disorders With an Autoimmune Lymphoproliferative Syndrome-Like Phenotype: Immunologic Evaluation, Early Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      regulatory T-cells defects (CTLA4, LRBA, STAT3 GOF, IL2RA, IL2RB, DEF6)
    explanation: >-
      A systematic review groups IL2RB with the other Treg defects that present
      as ALPS-like disease.
treatments:

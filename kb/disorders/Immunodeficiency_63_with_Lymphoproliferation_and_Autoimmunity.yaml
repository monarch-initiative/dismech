- name: Impaired Control of Cytomegalovirus
  biological_scale: ORGANISM
  description: >-
    Cytomegalovirus disease is one of the near-constant clinical features, and
    it is the part of the phenotype that makes this an immunodeficiency rather
    than a pure immune dysregulation disorder.
  evidence:

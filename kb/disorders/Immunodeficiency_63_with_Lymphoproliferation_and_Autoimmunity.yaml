animal_models:
- name: Il2rb hypomorphic knock-in mouse
  species: Mouse
  genotype: Homologous knock-in of the human hypomorphic IL2RB mutation
  publication: PMID:40570369
  description: >-
    A knock-in carrying the homologous human hypomorphic mutation, built
    specifically because the conventional Il2rb knockout has no NK cells and so
    does not match the human disease.
  modeled_mechanisms:
  - target: Failed IL-2 and IL-15 Signalling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the reduced surface receptor, the impaired STAT5 signalling and
      the raised serum cytokine levels.
    limitations: >-
      Mouse and human differ in the NK compartment for this receptor, so the
      model is informative for the T-cell arm and much less so for the NK arm.
    readouts:
    - name: IL-2/15-dependent STAT5 signalling
      target: Failed IL-2 and IL-15 Signalling
      direction: DECREASED
      interpretation: >-
        Direct signalling readout of the node.
      evidence:
      - reference: PMID:40570369
        reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          impaired IL-2/15-dependent STAT5 signaling, elevated serum IL-2/15
          levels
        explanation: >-
          Both the signalling defect and its ligand-accumulation consequence are
          measured.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our model recapitulates the human immune dysregulation phenotype, showing
        decreased mutant interleukin-2Rβ (IL-2Rβ) cell-surface expression, impaired
        IL-2/15-dependent STAT5 signaling, elevated serum IL-2/15 levels, expanded
        effector memory CD8+ T cells, and severely reduced regulatory T cells
        (Tregs).
      explanation: >-
        The paper states that the model recapitulates the human phenotype and
        names the specific readouts.
  - target: Regulatory T Cell Deficiency
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Neonatal transfer of wild-type Tregs into mutant animals largely restores
      conventional T-cell distribution and STAT5 signalling, and suppresses
      autoimmunity, without affecting the endogenous mutant Tregs. This is the
      strongest causal evidence in the entry that Treg failure drives the
      autoimmune arm.
    limitations: >-
      The rescue is in mouse, and no equivalent Treg-directed intervention has
      been reported in a patient.
    readouts:
    - name: Autoimmunity and serum cytokine levels after wild-type Treg transfer
      target: Regulatory T Cell Deficiency
      direction: RESTORED
      interpretation: >-
        Supplying the missing population corrects the downstream phenotype.
      evidence:
      - reference: PMID:40570369
        reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Both approaches suppress abnormal serum cytokine levels and autoimmunity
          without affecting endogenous mutant Tregs.
        explanation: >-
          The rescue is specific: the endogenous mutant Tregs are unchanged, so
          the correction is attributable to the transferred wild-type cells.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using mixed bone marrow chimeras (BMCs) and wild-type (WT) Treg transfers,
        we distinguish receptor-intrinsic from receptor-extrinsic
        immunopathogenesis.
      explanation: >-
        The experimental design is built to separate the two possible causes,
        which is what makes it informative for this node.
  - target: NK Cell Maturation Defect
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The knock-in mouse's NK phenotype runs opposite to the human one. Patients
      accumulate immature CD56-bright NK cells; the mutant mice instead lose
      mature stage E (CD11b+CD27+) cells and accumulate the terminally
      differentiated cytotoxic (CD11b+CD27-) subset.
    limitations: >-
      Because the direction is inverted, nothing about the human NK maturation
      arrest, and therefore nothing about the CMV susceptibility it is thought to
      cause, can be tested in this model. The paper's authors say as much. The
      separate conventional Il2rb knockout, which has no NK cells at all, is a
      third and equally non-transferable phenotype; it is not curated here
      because this entry models only the knock-in.
    readouts:
    - name: NK maturation subsets in mutant mice versus patients
      target: NK Cell Maturation Defect
      direction: ALTERED
      interpretation: >-
        Mouse and human diverge in direction, not merely in degree.
      evidence:
      - reference: PMID:40570369
        reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Unlike the increase in immature CD56bright NK cells observed in humans,
          we observed decreased mature stage E (CD11b+CD27+) NK cells and an
          excess of mature/potent cytotoxic (CD11b+CD27−) cells
        explanation: >-
          The authors state the divergence themselves and give both directions.
    evidence:
    - reference: PMID:40570369
      reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        First, questions regarding the threshold requirement for NK cell
        development and function remain and are not easily explored using the
        Il2rb Mut model system.
      explanation: >-
        The paper names its own model's limitation for the NK compartment, which
        is what this FAILS_TO_RECAPITULATE link records.
discussions:
- discussion_id: il2rb_nk_species_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the Il2rb knock-in mouse tell us anything about the NK-cell arm of human
    IL-2Rbeta deficiency, given that its NK maturation phenotype runs in the
    opposite direction to the patients'?
  attaches_to:
  - pathophysiology#NK Cell Maturation Defect
  - animal_models#Mouse
  rationale: >-
    The CMV susceptibility is what makes this an immunodeficiency rather than a
    pure tolerance disorder, and failed differentiation toward adaptive NK cells
    is the proposed route. But the model that would test it diverges in
    direction: patients accumulate immature CD56-bright NK cells, while the
    mutant mice lose mature stage E cells and accumulate terminally
    differentiated cytotoxic ones. This is not a gap in evidence -- the mouse is
    informative, and decisive, for the T-cell arm -- it is a question about
    whether the model transfers, which is why it is a mismatch rather than a
    knowledge gap.
  status: OPEN
  proposed_experiments:
  - experiment_id: il2rb_patient_nk_cytotoxicity
    name: Functional NK cytotoxicity and CMV control in patient cells
    description: >-
      Measure adaptive NK differentiation and CMV-specific IFN-gamma responses
      directly in patient NK cells. Cytotoxicity is already known to be intact,
      so measuring it again would not discriminate.
    readouts:
    - name: Adaptive NK-cell differentiation and IFN-gamma response to CMV
      target: NK Cell Maturation Defect
      direction: DECREASED
      interpretation: >-
        Would establish that the maturation arrest, rather than a cytotoxicity
        deficit, is what translates into failed viral control in humans.
    would_support:
    - pathophysiology#Impaired Control of Cytomegalovirus
  evidence:
  - reference: PMID:40570369
    reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike the increase in immature CD56bright NK cells observed in humans, we
      observed decreased mature stage E (CD11b+CD27+) NK cells and an excess of
      mature/potent cytotoxic (CD11b+CD27−) cells
    explanation: >-
      The mismatch is stated by the model's own authors, with both directions
      given.
- discussion_id: il2rb_nk_threshold_requirement
  kind: KNOWLEDGE_GAP
  prompt: >-
    What level of IL-2Rbeta signalling does human NK development actually
    require, and how much residual signalling do the hypomorphic alleles leave?
  attaches_to:
  - pathophysiology#NK Cell Maturation Defect
  rationale: >-
    The human picture is consistent, not contested: NK numbers are preserved or
    raised across three alleles, maturation is arrested at the CD56-bright stage
    with negligible CD57, and cytotoxicity is intact. What is genuinely unknown
    is the dose-response -- how much receptor signal NK differentiation needs --
    and the paper that built the model to answer it says its model cannot. That
    puts the gap in the model system, not in the human data.
  status: OPEN
  evidence:
  - reference: PMID:40570369
    reference_title: "A hypomorphic Il2rb mutant mouse model recapitulates and reveals mechanisms of human T cell immune dysregulation in IL-2Rβ deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      First, questions regarding the threshold requirement for NK cell
      development and function remain and are not easily explored using the
      Il2rb Mut model system.
    explanation: >-
      The authors state the open question and why their own system cannot answer
      it.

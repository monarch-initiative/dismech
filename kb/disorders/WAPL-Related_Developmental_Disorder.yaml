animal_models:
- species: Mus musculus
  genotype: Wapl hypomorphic allelic series (approximately 50% and 25% residual Wapl expression)
  description: >-
    A graded Wapl-dosage mouse series is the in vivo arm of the defining study
    and is the source of the dosage-liability-threshold claim. Mice retaining
    about half of normal Wapl expression - the genotypic equivalent of a human
    heterozygote - show only mild growth and learning/memory deficits, which
    parallels the relatively mild human phenotype. Mice retaining only a quarter
    show birth defects and die after birth, placing the threshold for severe
    disease below the heterozygous level.

name: WAPL-Related Developmental Disorder
creation_date: "2026-07-12T21:00:00Z"
category: Mendelian
description: >-
  WAPL-related developmental disorder is a newly delineated cohesinopathy caused
  by heterozygous predicted-damaging variants in WAPL, the gene encoding the
  cohesin release factor WAPL (Wings apart-like protein homolog). Whereas prior
  cohesinopathies (e.g., Cornelia de Lange syndrome) arise from defects in
  cohesin structural subunits and cohesin loaders, WAPL-related disorder is the
  first Mendelian condition attributed to a cohesin release factor. Reduced WAPL
  dosage perturbs cohesin dynamics on chromatin, chromatin architecture, and
  developmental gene-expression programs, producing developmental delay,
  intellectual disability, and risk of other developmental anomalies. WAPL is
  also nominated as the phenotypic driver gene within the recurrent
  10q22.3q23.2 genomic-deletion disorder, which encompasses WAPL.
parents:
- Neurodevelopmental Disorder
- cohesinopathy
- syndromic intellectual disability
synonyms:
- WAPL-related disorder
- cohesin release factor deficiency
- WAPL haploinsufficiency
notes: >-
  No exact MONDO disease class was found in the local ontology release for the
  WAPL-related developmental disorder (the condition was delineated in 2026;
  PMID:42431198), so disease_term is intentionally omitted pending ontology
  coverage, following the precedent of other recently described single-gene
  neurodevelopmental disorders in this knowledge base
  (e.g., RAB5C-Related Neurodevelopmental Disorder with Macrocephaly).
  MONDO:0012315 (distal 10q deletion syndrome) is related but is not asserted
  as an exact mapping: the WAPL-encompassing genomic disorder is the
  interstitial 10q22.3q23.2 deletion rather than a distal/terminal 10q deletion.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The delineating cohort reported heterozygous predicted-damaging WAPL
    variants in affected individuals, consistent with an autosomal dominant,
    dosage-sensitive (haploinsufficiency) mechanism.
  evidence:
  - reference: PMID:42431198
    reference_title: >-
      Clinical, in vitro, and in vivo evidence of WAPL as a
      cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2
      genomic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      phenotyping individuals with heterozygous predicted damaging variants in
      WAPL (n = 27), PDS5A (n = 8), and PDS5B (n = 8)
    explanation: >-
      Affected individuals carried heterozygous predicted-damaging WAPL
      variants, supporting autosomal dominant inheritance.
pathophysiology:
- name: WAPL cohesin release factor deficiency
  description: >-
    WAPL is a cohesin release (unloading) factor that, with its binding partners
    PDS5A and PDS5B, controls the residence time of cohesin on chromatin.
    Heterozygous damaging WAPL variants reduce functional WAPL dosage, the first
    Mendelian disorder attributed to a cohesin release factor rather than a
    cohesin subunit or loader.
  genes:
  - preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL
  biological_processes:
  - preferred_term: sister chromatid cohesion
    term:
      id: GO:0007062
      label: sister chromatid cohesion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42431198
    reference_title: >-
      Clinical, in vitro, and in vivo evidence of WAPL as a
      cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2
      genomic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genes encoding cohesin and cohesin loaders have been associated with
      Mendelian disorders, whereas genes encoding cohesin release factors,
      including WAPL and its binding partners PDS5A and PDS5B, have not.
    explanation: >-
      Establishes WAPL as a cohesin release factor and frames its deficiency as
      a previously unrecognized cohesinopathy mechanism.
  - reference: PMID:42431198
    reference_title: >-
      Clinical, in vitro, and in vivo evidence of WAPL as a
      cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2
      genomic disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In summary, we delineated a genetic condition caused by cohesin release
      factor deficiency, nominated WAPL as a driver gene within a genomic
      disorder region, and further illuminated dosage sensitivity of human
      cohesin.
    explanation: >-
      Summarizes the disorder as a cohesin-release-factor deficiency with
      demonstrated dosage sensitivity.
  downstream:
  - target: Altered chromatin architecture and transcriptional dysregulation
    causal_link_type: DIRECT
    description: >-
      Reduced WAPL dosage alters cohesin dynamics on chromatin, perturbing
      chromatin architecture and developmental gene-expression programs.
- name: Altered chromatin architecture and transcriptional dysregulation
  description: >-
    WAPL haploinsufficiency alters cohesin residence and chromatin loop
    architecture, dysregulating gene expression. In WAPL-edited and
    10q-deletion human induced pluripotent stem cells and induced neurons,
    transcriptomic profiling identified significant overlap between the WAPL
    haploinsufficiency and 10q deletion differentially expressed genes,
    supporting WAPL as a transcriptional driver within the deletion region.
  genes:
  - preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42431198
    reference_title: >-
      Clinical, in vitro, and in vivo evidence of WAPL as a
      cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2
      genomic disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptomics identified significant overlap between WAPL
      haploinsufficiency and 10q deletion differentially expressed genes.
    explanation: >-
      iPSC/induced-neuron transcriptomics show WAPL haploinsufficiency
      reproduces the 10q deletion transcriptional signature, linking WAPL dosage
      to gene-expression dysregulation.
  - reference: PMID:42431198
    reference_title: >-
      Clinical, in vitro, and in vivo evidence of WAPL as a
      cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2
      genomic disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We used CRISPR to generate truncating variants in WAPL and 10q deletion or
      duplication in human induced pluripotent stem cells (iPSCs) and induced
      neurons.
    explanation: >-
      Describes the human cellular models (CRISPR-edited iPSCs and induced
      neurons) used to interrogate WAPL dosage effects on transcription.
  downstream:
  - target: Impaired neurodevelopment
    causal_link_type: DIRECT
    description: >-
      Transcriptional dysregulation from reduced WAPL dosage impairs
      neurodevelopmental gene-expression programs.
- name: Impaired neurodevelopment
  description: >-
    Reduced WAPL dosage impairs neurodevelopment in a dosage-dependent manner.
    A mouse allelic series revealed a dosage-liability threshold: mice with 50%
    Wapl expression had mild growth and learning/memory deficits, whereas mice
    with 25% residual Wapl showed birth defects and postnatal lethality,
    indicating a threshold below the level of heterozygosity.
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42431198
    reference_title: >-
      Clinical, in vitro, and in vivo evidence of WAPL as a
      cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2
      genomic disorder.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with 50% Wapl expression exhibited mild deficits of growth and
      learning/memory, whereas those with 25% residual Wapl displayed birth
      defects and postnatal lethality, revealing a dosage liability threshold
      below the level of heterozygosity.
    explanation: >-
      Mouse dosage series establishes a graded, dosage-dependent
      neurodevelopmental and growth liability, with a threshold below
      heterozygosity.
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
    description: >-
      Impaired neurodevelopment from reduced WAPL dosage manifests clinically as
      global developmental delay in affected individuals.
  - target: Intellectual disability
    causal_link_type: DIRECT
    description: >-
      Impaired neurodevelopment from reduced WAPL dosage manifests clinically as
      intellectual disability in affected individuals.

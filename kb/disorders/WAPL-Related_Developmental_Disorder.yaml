- name: Sub-Heterozygous Wapl Dosage Liability Threshold
  biological_scale: ORGANISM
  description: >-
    A mouse allelic series shows that the phenotypic liability of Wapl loss is
    steeply dose dependent and that the threshold for severe disease lies below
    the heterozygous level. Animals retaining 50% Wapl expression have only mild
    growth and learning/memory deficits, whereas animals retaining 25% have
    birth defects and die postnatally. This node explains why human
    heterozygotes have a comparatively mild, survivable neurodevelopmental
    phenotype rather than a lethal one, and predicts that human biallelic or
    severely hypomorphic WAPL genotypes would not be viable. It is
    model-organism evidence and is paired with a HUMAN_MODEL_MISMATCH discussion
    below.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with 50% Wapl expression exhibited mild deficits of growth and
      learning/memory, whereas those with 25% residual Wapl displayed birth
      defects and postnatal lethality, revealing a dosage liability threshold
      below the level of heterozygosity.
    explanation: >-
      Reports the dosage series and the explicit inference of a liability
      threshold below heterozygosity.
  downstream:

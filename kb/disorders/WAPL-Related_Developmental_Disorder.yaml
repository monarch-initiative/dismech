    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data indicate that Wapl is required to unlock cohesin from a
      particular state in which it is stably bound to chromatin.
    explanation: >-
      Establishes the molecular function that is reduced in this disorder:
      WAPL-dependent release of cohesin from chromatin.
  - reference: PMID:17113138

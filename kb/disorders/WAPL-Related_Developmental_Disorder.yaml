name: WAPL-Related Developmental Disorder
creation_date: "2026-07-12T21:00:00Z"
category: Mendelian
description: >-
  WAPL-related developmental disorder is a recently delineated, ultra-rare
  neurodevelopmental condition caused by heterozygous damaging variants in WAPL,
  the gene encoding cohesin's DNA release (unloading) factor. Cohesin is a
  ring-shaped complex that organises the genome into chromatin loops and
  topologically associating domains; loading of cohesin onto DNA by NIPBL/MAU2
  and release of cohesin from DNA by WAPL together set the residence time of
  cohesin on chromatin and hence the size and dynamics of loops. Genes encoding
  cohesin subunits and the cohesin loader had already been associated with the
  cohesinopathies (most prominently Cornelia de Lange syndrome), but until 2026
  no cohesin release factor had been linked to a Mendelian disease. Phenotyping
  of 27 individuals with heterozygous predicted damaging WAPL variants defined a
  disorder whose core is developmental delay and intellectual disability, with an
  additional risk of other developmental anomalies. The same work nominated WAPL
  as a phenotypic driver gene inside the recurrent, low-copy-repeat-mediated
  10q22.3q23.2 deletion region, on the basis of clinical similarity between the
  two groups and of overlapping transcriptomic consequences of WAPL
  haploinsufficiency and 10q deletion in isogenic human iPSCs and induced
  neurons. Mouse dosage series place the liability threshold below
  heterozygosity: 50% Wapl expression produces mild growth and learning/memory
  deficits, whereas 25% residual Wapl produces birth defects and postnatal
  lethality.
notes: >-
  Scope and naming. This entry is the monogenic WAPL entity. The recurrent
  10q22.3q23.2 (LCR3-4) deletion is curated here as a contiguous-gene subtype
  rather than as a separate disease page, because the defining publication
  (PMID:42431198) nominates WAPL as the phenotypic driver within that interval
  and the two presentations are argued to be mechanistically continuous. Claims
  that are specific to the deletion and that the source literature attributes to
  other genes in the interval (for example congenital breast aplasia, for which
  PMID:21248748 proposes NRG3, and cardiac defects, for which it proposes BMPR1A
  and GRID1) are curated on the deletion subtype and are explicitly NOT
  attributed to WAPL.

  Named-entity-confusion preflight. No MONDO term exists for the monogenic
  WAPL-related disorder. `runoak -i sqlite:obo:mondo search "l~WAPL"` returns no
  hits, so `disease_term` is deliberately omitted pending ontology coverage
  rather than being back-filled with a near-miss term. In particular
  MONDO:0012830 (chromosome 10q23 deletion syndrome / 10q22.3q23.3 microdeletion
  syndrome; Orphanet:276413, OMIM:612242) is NOT used as the `disease_term`,
  because it denotes the contiguous-gene deletion entity and not the single-gene
  disorder; it is recorded instead as a `skos:relatedMatch` mapping and as the
  subtype grounding. MONDO:0017180 is the reciprocal duplication syndrome and is
  out of scope here.

  Evidence limits. PMID:42431198 was published online ahead of print on
  2026-07-10 and is cached as abstract only (`content_type: abstract_only`). The
  same study is, however, openly available as a medRxiv preprint
  (DOI:10.64898/2026.02.23.26346364, posted 2026-02-28, recorded as the "Update
  of" record in the PubMed entry), which is cached here as full text and is the
  source of every per-feature count in this entry. Phenotype `frequency:` bands
  for the sequence-variant subtype are derived from that preprint's denominator
  of 25 phenotyped individuals (of 27 ascertained), not from the 27-individual
  headline figure, and each band cites the count that supports it per
  docs/frequency-evidence-guidelines.md.

  What the preprint does NOT provide is case-level data: it states that Table 1,
  Table S4, Fig. 2 and Fig. S12 have had age, sex, phenotype and photographs
  removed per medRxiv guidelines. Detailed variant-level curation (`variants:`)
  and facial-gestalt findings therefore still await the peer-reviewed full text
  and remain tracked as an open discussion below, as does the PDS5A/PDS5B
  question.

  Cytoband coordinates. Both `10q22.3q23.2` and `10q22.3q23.3` appear in this
  entry, and the inconsistency is inherited from the sources rather than
  introduced here. PMID:21248748 describes the whole surveyed interval as
  `10q22.3q23.3` while placing the recurrent LCR3-4 rearrangements at
  `10q22.3q23.2`; MONDO:0012830 and Orphanet:276413 name the entity with the
  wider `10q22.3q23.3` label; the 2026 WAPL study uses `10q22.3q23.2` for the
  recurrent LCR3-4 deletion it studies. This entry uses `10q22.3q23.2` for the
  recurrent LCR3-4 deletion itself and retains `10q22.3q23.3` only where it is
  the name of an external record. The two are not competing claims about
  different deletions.

  Deliberate non-claims. (1) PDS5A and PDS5B are curated with
  `relationship_type: UNKNOWN`; the source explicitly states that neither
  cohort-based statistics nor subject phenotyping associated these genes with
  specific phenotypes, so they are recorded as investigated-but-unconfirmed
  rather than as disease genes. (2) No disease-modifying or WAPL-specific
  therapy has been reported, and generic developmental supportive care is not
  sourced to any WAPL publication. The sole management entry is active digestive
  surveillance explicitly recommended for the BMPR1A-containing deletion
  subtype; it does not apply to isolated WAPL variants. (3) The
  mouse dosage-threshold result is curated as MODEL_ORGANISM evidence and is
  paired with a HUMAN_MODEL_MISMATCH discussion, because the human cohort is
  entirely heterozygous and the severe (25% residual Wapl) arm has no human
  counterpart.

  Structured sources. No ORPHA, ClinGen gene-disease validity, or ClinGen dosage
  record exists for WAPL *as a monogenic disease gene* at curation time; that
  gene-disease relationship rests entirely on the 2026 primary report. This is
  narrower than an absence of Orphanet coverage for the whole entry: ORPHA:276413
  does exist for the contiguous-gene 10q deletion subtype (= MONDO:0012830,
  OMIM:612242) and carries a phenotype table with frequency bands that would
  enrich that subtype. It is not cited here only because the pinned Orphadata
  snapshot in `data/orphadata/MANIFEST.yaml` no longer matches upstream -
  `just refresh-orphadata` fails with a checksum mismatch on `en_product1.xml` -
  so `references_cache/ORPHA_276413.md` cannot be generated without re-pinning
  the snapshot, which is a repo-wide change out of scope for this entry. Mining
  ORPHA:276413 for the deletion-subtype phenotypes is tracked as an open
  discussion below.

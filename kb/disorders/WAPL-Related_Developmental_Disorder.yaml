      candidates rather than demonstrating causation.
  - reference: PMID:31561016
    reference_title: "Patients with 10q22.3q23.1 recurrent deletion syndrome are at risk for juvenile polyposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More specifically, point mutations and structural abnormalities in BMPR1A

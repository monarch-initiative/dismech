- name: WAPL Deficiency
  biological_scale: MOLECULAR
  description: >-
    The convergence point of the two lesions: reduced WAPL dosage after a
    deletion or protein-truncating variant, and predicted impaired function for
    damaging missense variants. The isogenic experiment directly establishes
    haploinsufficiency only for engineered frameshift and deletion models; the
    functional effect of each clinical missense allele remains unresolved.
  gene:
    preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptomics identified significant overlap between WAPL
      haploinsufficiency and 10q deletion differentially expressed genes.
    explanation: >-
      Names WAPL haploinsufficiency as the engineered loss-of-function state and
      shows that it recapitulates the transcriptional consequence of the whole deletion.
  downstream:
  - target: Impaired Cohesin Release from Chromatin
    causal_link_type: DIRECT
    description: >-
      Halving WAPL dosage reduces the cohesin-unloading activity available to
      remove cohesin rings from DNA.
    evidence:
    - reference: PMID:17113138
      reference_title: "Wapl controls the dynamic association of cohesin with chromatin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our data indicate that Wapl is required to unlock cohesin from a
        particular state in which it is stably bound to chromatin.
      explanation: Establishes the release function impaired when WAPL is deficient.
- name: Impaired Cohesin Release from Chromatin
  biological_scale: MOLECULAR
  description: >-
    WAPL is cohesin's DNA release factor: it opens the exit gate at the
    SMC3-RAD21 interface and unlocks cohesin from a state in which it is stably
    bound to chromatin. Loss of WAPL activity abolishes cohesin turnover, so
    cohesin remains loaded and its residence time on DNA increases. This is the
    core biochemical consequence expected from WAPL deficiency and is
    established from cell-biological loss-of-function work that predates the
    clinical entity. Direct release assays have not been reported for every
    clinical missense allele.
  molecular_functions:
  - preferred_term: cohesin unloader activity
    term:
      id: GO:0140670
      label: cohesin unloader activity
    modifier: DECREASED
  cellular_components:

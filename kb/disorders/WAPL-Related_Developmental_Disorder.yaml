- population: Worldwide reported literature (10q22.3q23.2 deletion subtype)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The recurrent LCR3-4 deletion is explicitly described as rare in the
    delineating cohort study, which assembled only eight deletions (five of them
    the recurrent LCR3-4 type) alongside six duplications.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genomic architecture of the 10q22q23 region is characterised by two
      low-copy repeats (LCRs3 and 4), and deletions in this region appear to be
      rare.
    explanation: >-
      States directly that deletions of this interval are rare, and gives the
      LCR architecture that makes them recurrent.

animal_models:
- name: Wapl hypomorphic mouse dosage series
  species: Mus musculus
  genotype: Wapl hypomorphic allelic series (approximately 50% and 25% residual Wapl expression)
  description: >-
    A graded Wapl-dosage mouse series is the in vivo arm of the defining study
    and is the source of the dosage-liability-threshold claim. Mice retaining
    about half of normal Wapl expression show mild growth and learning/memory
    deficits. Mice retaining only a quarter show birth defects and die after
    birth. Translation of that mouse dose-response to humans remains explicitly
    unresolved in the HUMAN_MODEL_MISMATCH discussion.
  genes:
  - preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with 50% Wapl expression exhibited mild deficits of growth and
      learning/memory, whereas those with 25% residual Wapl displayed birth
      defects and postnatal lethality, revealing a dosage liability threshold
      below the level of heterozygosity.
    explanation: >-
      Describes the model, both dosage arms, and the threshold inference.

- name: Recurrent 10q22.3q23.2 Deletion
  biological_scale: MOLECULAR
  subtypes:
  - 10q Deletion
  description: >-
    Non-allelic homologous recombination between the paralogous low-copy repeats
    LCR3 and LCR4 removes a multi-megabase interval of 10q22.3q23.2 containing
    roughly 30 genes, WAPL among them. The deletion is the historical entry
    point to this disorder: it was recognised as a genomic disorder associated
    with cognitive and behavioural abnormalities two decades before the driver
    gene was identified.
  genes:
  - preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL
  mechanism_confidence: ESTABLISHED
  evidence:

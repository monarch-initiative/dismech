      cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2
      genomic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarities between individuals with damaging WAPL variants and those
      with large, recurrent 10q22.3q23.2 (10q) deletions encompassing WAPL
      nominate WAPL as a driver gene within this genomic disorder region.
    explanation: >-
      Nominates WAPL as the phenotypic driver gene of the recurrent 10q22.3q23.2
      genomic-deletion disorder.
discussions:
- discussion_id: gap_wapl_pds5a_pds5b_association
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the WAPL binding partners PDS5A and PDS5B independently associated with a
    specific Mendelian phenotype, and if so, how do their phenotypic spectra
    relate to WAPL-related disorder?
  attaches_to:
  - pathophysiology#WAPL cohesin release factor deficiency
  rationale: >-
    The delineating study also phenotyped individuals with PDS5A (n=8) and PDS5B
    (n=8) variants. Although these individuals had features of developmental
    disorders, neither cohort-based statistics nor subject phenotyping
    associated PDS5A or PDS5B with a specific phenotype, leaving their status as
    cohesinopathy genes unresolved.
  evidence:
  - reference: PMID:42431198
    reference_title: >-
      Clinical, in vitro, and in vivo evidence of WAPL as a
      cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2
      genomic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While individuals with PDS5A or PDS5B variants exhibited features of
      developmental disorders, neither cohort-based statistics nor subject
      phenotyping associated these genes with specific phenotypes.
    explanation: >-
      Documents that PDS5A/PDS5B remain unconfirmed as disease genes despite
      developmental features, defining an open knowledge gap.

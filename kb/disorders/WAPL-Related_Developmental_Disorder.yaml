  notes: >-
    No population-based prevalence estimate exists for the monogenic disorder,
    which was first delineated in 2026. The only defensible measure is the
    published case count: 27 individuals with heterozygous predicted damaging
    WAPL sequence variants in the defining report.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      phenotyping individuals with heterozygous predicted damaging variants in
      WAPL (n = 27)
    explanation: >-
      Provides the published worldwide case count for the sequence-variant

has_subtypes:
- name: WAPL Variant
  display_name: WAPL sequence-variant subtype (heterozygous damaging WAPL variant)
  description: >-
    Individuals with a heterozygous predicted damaging sequence variant in WAPL
    and no deletion of the surrounding 10q22.3q23.2 interval. This is the
    subtype that establishes WAPL as a Mendelian disease gene; 27 such
    individuals were phenotyped in the defining report.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We explored the relevance of cohesin release factors in Mendelian disease
      by phenotyping individuals with heterozygous predicted damaging variants
      in WAPL (n = 27), PDS5A (n = 8), and PDS5B (n = 8)
    explanation: >-
      Defines the sequence-variant cohort and its size, and states that the
      variants are heterozygous.
- name: 10q Deletion
  display_name: 10q22.3q23.2 contiguous-gene deletion subtype (WAPL-containing)
  subtype_term:
    preferred_term: 10q22.3q23.2 recurrent deletion syndrome
    term:
      id: MONDO:0012830
      label: chromosome 10q23 deletion syndrome
  description: >-
    Individuals with a large recurrent deletion of 10q22.3q23.2, generated by
    non-allelic homologous recombination between the flanking low-copy repeats
    LCR3 and LCR4, which removes WAPL together with roughly 30 neighbouring
    genes. Clinically this subtype adds features that the source literature
    attributes to other genes in the interval (cardiac defects, congenital
    breast aplasia, cerebellar anomalies, macrocephaly) on top of the
    developmental delay shared with the sequence-variant subtype.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similarities between individuals with damaging WAPL variants and those
      with large, recurrent 10q22.3q23.2 (10q) deletions encompassing WAPL
      nominate WAPL as a driver gene within this genomic disorder region.
    explanation: >-
      Establishes the deletion group as clinically overlapping with, and
      mechanistically linked to, the monogenic WAPL group.
  - reference: PMID:17436248
    reference_title: "Recurrent 10q22-q23 deletions: a genomic disorder on 10q associated with cognitive and behavioral abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data provide evidence that the 10q22-q23 genomic region harbors one or
      more genes important for cognitive and behavioral development and that
      recurrent deletions affecting this interval define a novel genomic
      disorder.
    explanation: >-
      Original delineation of the recurrent 10q22-q23 deletion as a genomic
      disorder, i.e. the entity within which WAPL was later nominated as driver.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    All reported affected individuals carry a single damaging WAPL allele:
    either a heterozygous sequence variant or a heterozygous deletion of the
    10q22.3q23.2 interval containing WAPL. The mechanism is therefore
    haploinsufficiency acting in an autosomal dominant manner. Mouse data
    indicate a dosage-liability threshold that sits below 50% expression, which
    is consistent with the comparatively mild phenotype seen in human
    heterozygotes.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      phenotyping individuals with heterozygous predicted damaging variants in
      WAPL (n = 27)
    explanation: >-
      States that the disease-associated WAPL genotype in the human cohort is
      heterozygous, i.e. a monoallelic (dominant) mechanism.

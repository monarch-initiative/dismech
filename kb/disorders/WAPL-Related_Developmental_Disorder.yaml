- name: Extended Chromatin Loops and Altered Genome Folding
  biological_scale: MOLECULAR
  description: >-
    Cohesin structures interphase chromosomes by processively enlarging chromatin
    loops until it is stopped at CTCF sites or released by WAPL. When WAPL
    activity is reduced, loops extend well beyond their normal length, cohesin
    accumulates in axial vermicelli-like positions, interactions between
    neighbouring topologically associating domains increase, and loops form
    between incorrectly oriented CTCF sites. The three-dimensional genome
    therefore folds abnormally.
  biological_processes:
  - preferred_term: chromatin looping
    term:

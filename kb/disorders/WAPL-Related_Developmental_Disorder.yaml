genetic:
- name: WAPL
  gene_term:
    preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL
  presence: Present
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous predicted damaging WAPL variants, and heterozygous deletion of
    WAPL within the recurrent 10q22.3q23.2 interval, cause a developmental
    disorder characterised by developmental delay and intellectual disability.
    WAPL encodes cohesin's DNA release factor; this is the first cohesin release
    factor to be associated with Mendelian disease.
  notes: >-
    No ClinGen Gene-Disease Validity assertion and no ClinGen dosage curation
    were available for WAPL as a disease gene at the time of curation, so the
    gene-disease relationship is supported by primary literature alone. Detailed
    allele-level curation awaits the full text of PMID:42431198.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we delineated a genetic condition caused by cohesin release
      factor deficiency, nominated WAPL as a driver gene within a genomic
      disorder region, and further illuminated dosage sensitivity of human
      cohesin.
    explanation: >-
      The authors' own summary of the gene-disease claim.

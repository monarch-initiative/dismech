- name: Recurrent 10q22.3q23.2 Deletion
  biological_scale: MOLECULAR
  subtypes:
  - 10q Deletion
  description: >-
    Non-allelic homologous recombination between the paralogous low-copy repeats
    LCR3 and LCR4 removes a multi-megabase interval of 10q22.3q23.2 containing
    roughly 30 genes, WAPL among them. The deletion is the historical entry
    point to this disorder: it was recognised as a genomic disorder associated
    with cognitive and behavioural abnormalities two decades before the driver
    gene was identified.
  genes:
  - preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:17436248
    reference_title: "Recurrent 10q22-q23 deletions: a genomic disorder on 10q associated with cognitive and behavioral abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in the other two families, the breakpoints are within paralogous LCRs,
      removing approximately 7.2 Mb and 32 genes
    explanation: >-
      Documents the low-copy-repeat-mediated recurrent breakpoints and the
      contiguous-gene extent of the deletion.
  downstream:
  - target: WAPL Deficiency
    causal_link_type: DIRECT
    description: >-
      The deletion removes one copy of WAPL, producing the same reduced-dosage
      state as a damaging sequence variant. Clinical similarity between the two
      groups is the basis of the driver-gene nomination. Note that the deletion
      also removes roughly 30 other genes, so it is not reducible to this edge -
      the deletion-only features curated on the 10q Deletion subtype are
      attributed elsewhere in the interval.
    evidence:
    - reference: PMID:42431198
      reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Similarities between individuals with damaging WAPL variants and those
        with large, recurrent 10q22.3q23.2 (10q) deletions encompassing WAPL
        nominate WAPL as a driver gene within this genomic disorder region.
      explanation: >-
        States the inference that connects the contiguous-gene deletion to the
        monogenic lesion.
  - target: Contiguous Loss of Neighbouring Genes
    causal_link_type: DIRECT
    description: >-
      The same LCR3-4 event removes roughly 30 other genes, so the deletion has
      a second, WAPL-independent arm. This edge exists so that the
      deletion-only features are routed through the pathograph rather than
      attributed by prose alone.
    evidence:
    - reference: PMID:17436248
      reference_title: "Recurrent 10q22-q23 deletions: a genomic disorder on 10q associated with cognitive and behavioral abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        in the other two families, the breakpoints are within paralogous LCRs,
        removing approximately 7.2 Mb and 32 genes
      explanation: Directly supports simultaneous loss of the neighbouring-gene interval.
- name: Contiguous Loss of Neighbouring Genes
  biological_scale: MOLECULAR
  subtypes:
  - 10q Deletion
  description: >-
    The WAPL-independent arm of the contiguous-gene deletion. Alongside WAPL,
    the LCR3-4 interval carries roughly 30 genes, and the deletion literature
    proposes specific candidates for the deletion-only features: NRG3 for
    congenital breast aplasia, on the basis of its role in early mammary gland
    development in mice; and BMPR1A and GRID1 for the cardiac defects, on the
    basis of their association with cardiac structure and function. These
    candidate attributions are the reason those phenotypes are curated on the
    10q Deletion subtype and explicitly NOT on WAPL. Note that cardiac
    malformation also occurs in WAPL sequence-variant carriers who have no
    deletion, so the cardiac phenotype is likely to have contributions from both
    arms; breast aplasia has no sequence-variant counterpart.

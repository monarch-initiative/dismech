diagnosis:
- name: Exome or genome sequencing for WAPL sequence variants
  description: >-
    The sequence-variant subtype is ascertained by exome or genome sequencing
    identifying a heterozygous predicted damaging WAPL variant. Because the
    disorder was only delineated in 2026, WAPL will not be on older
    intellectual-disability gene panels, and reanalysis of prior negative exomes
    is a reasonable route to diagnosis.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      phenotyping individuals with heterozygous predicted damaging variants in
      WAPL (n = 27)
    explanation: >-
      Establishes that the diagnostic finding is a heterozygous predicted
      damaging WAPL sequence variant.
- name: Chromosomal microarray for the recurrent 10q22.3q23.2 deletion
  description: >-
    The contiguous-gene subtype is detected by chromosomal microarray as a
    recurrent copy-number loss between the low-copy repeats LCR3 and LCR4.
    Because the breakpoints are LCR-mediated, the deletion is recurrent and of
    reproducible size, which is what makes it a classical genomic disorder.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five deletions and three duplications occur between LCRs3 and 4, whereas
      three deletions and three duplications have unique breakpoints.
    explanation: >-
      Documents the recurrent LCR3-4 breakpoint architecture that microarray
      detection relies on.
differential_diagnoses:
- name: Cornelia de Lange Syndrome
  description: >-
    The archetypal cohesinopathy, caused mainly by NIPBL (the cohesin loader)
    and by cohesin subunit genes. It sits on the opposite side of the same
    cohesin cycle from WAPL: loading versus release. The defining WAPL study was
    conducted in part through a Cornelia de Lange Syndrome and Related Disorders
    clinic, and WAPL-related disorder should be considered in individuals
    evaluated for, but not molecularly confirmed as, CdLS.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genes encoding cohesin and cohesin loaders have been associated with
      Mendelian disorders, whereas genes encoding cohesin release factors,
      including WAPL and its binding partners PDS5A and PDS5B, have not.
    explanation: >-
      Places WAPL-related disorder beside the already-known cohesin and
      cohesin-loader disorders, of which Cornelia de Lange syndrome is the
      prototype.
- name: 10q22.3q23.3 microduplication syndrome
  description: >-
    The reciprocal duplication of the same LCR3-4 interval. It has its own MONDO
    identity (MONDO:0017180) and a distinct, more variably penetrant
    presentation - speech and motor delay with a broad forehead, deep-set eyes,
    upslanting palpebral fissures, a smooth philtrum and a thin upper lip - and
    duplications have also been found in healthy family members. It is a
    different dosage direction and is deliberately not modelled as a subtype
    here.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duplications between LCRs3 and 4 are associated with variable phenotypic
      penetrance.
    explanation: >-
      Distinguishes the reciprocal duplication by its variable penetrance.

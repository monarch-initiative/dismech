treatments:
- name: Digestive surveillance for 10q deletion carriers
  action_category: MONITORING
  description: >-
    Active digestive surveillance is recommended for carriers of the recurrent
    10q22.3q23.1/10q22.3q23.2 deletion because the interval includes BMPR1A and
    a reported adult developed severe juvenile polyposis. The manifestation
    being surveilled for is the hamartomatous polyposis curated in the
    `phenotypes` section (HP:0004390); this is detection, not treatment, so the
    action carries no `target_phenotypes` link. This recommendation applies to
    the contiguous-deletion subtype, not to isolated WAPL variants; the source
    does not specify a surveillance modality or interval.
  treatment_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:31561016
    reference_title: "Patients with 10q22.3q23.1 recurrent deletion syndrome are at risk for juvenile polyposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This observation highlights the importance of an active digestive
      surveillance of patients with 10q22.3q23.1 deletion.
    explanation: Directly supports surveillance limited to deletion carriers.
differential_diagnoses:
- name: Cornelia de Lange Syndrome
  description: >-
    The archetypal cohesinopathy, caused mainly by NIPBL (the cohesin loader)
    and by cohesin subunit genes. It sits on the opposite side of the same
    cohesin cycle from WAPL: loading versus release. The methylation results and
    opposing mouse dosage effects support keeping the entities distinct rather
    than treating WAPL deficiency as an untyped Cornelia de Lange syndrome.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genes encoding cohesin and cohesin loaders have been associated with
      Mendelian disorders, whereas genes encoding cohesin release factors,
      including WAPL and its binding partners PDS5A and PDS5B, have not.
    explanation: >-
      Places WAPL-related disorder beside the already-known cohesin and
      cohesin-loader disorders, of which Cornelia de Lange syndrome is the
      prototype.
  - reference: PMID:36449618
    reference_title: "Decreasing Wapl dosage partially corrects embryonic growth and brain transcriptome phenotypes in Nipbl(+/-) embryos."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Since WAPL and NIPBL have opposite effects on cohesin's association with
      DNA, we asked whether decreasing Wapl dosage could correct phenotypes seen
      in Nipbl+/- mice. Gene expression and embryonic growth are partially
      corrected, but perinatal lethality is not.
    explanation: >-
      Establishes the relationship between the two disorders as genuinely
      antagonistic rather than merely adjacent: lowering Wapl partially rescues
      the CdLS model. That the rescue is only partial - perinatal lethality
      persists - is why the two remain distinct entities and why this is a
      differential rather than a shared mechanism. Note the counterintuitive
      direction: reduced WAPL is the lesion in this disorder but a partial
      corrective in the loader disorder.
  notes: >-
    The methylation episignature is the practical discriminator: the
    cohesin-release-factor profiles do not mimic the overall CdLS methylation
    pattern, so an EpiSign result cannot be read as simply "a cohesinopathy".
- name: 10q22.3q23.3 microduplication syndrome
  description: >-
    The reciprocal duplication of the same LCR3-4 interval. It has its own MONDO
    identity (MONDO:0017180) and a distinct, more variably penetrant
    presentation - speech and motor delay with a broad forehead, deep-set eyes,
    upslanting palpebral fissures, a smooth philtrum and a thin upper lip - and
    duplications have also been found in healthy family members. It is a
    different dosage direction and is deliberately not modelled as a subtype
    here.
  evidence:
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Duplications between LCRs3 and 4 are associated with variable phenotypic
      penetrance.
    explanation: >-
      Distinguishes the reciprocal duplication by its variable penetrance.
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probands had speech and/or motor delays and dysmorphisms including a broad
      forehead, deep-set eyes, upslanting palpebral fissures, a smooth philtrum
      and a thin upper lip.
    explanation: Supports the detailed reciprocal-duplication phenotype used in the differential.

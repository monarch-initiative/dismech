diagnosis:
- name: Molecular identification of a damaging WAPL sequence variant
  description: >-
    The sequence-variant subtype is defined by a heterozygous predicted damaging
    WAPL variant. The cited cohort does not establish a preferred clinical assay
    or validated variant-classification algorithm, so no specific sequencing
    platform is asserted here.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      phenotyping individuals with heterozygous predicted damaging variants in
      WAPL (n = 27)
    explanation: >-
      Establishes that the diagnostic finding is a heterozygous predicted
      damaging WAPL sequence variant.
- name: Chromosomal microarray for the recurrent 10q22.3q23.2 deletion
  description: >-
    The contiguous-gene subtype is detected by chromosomal microarray as a
    recurrent copy-number loss between the low-copy repeats LCR3 and LCR4.
    Because the breakpoints are LCR-mediated, the deletion is recurrent and of
    reproducible size, which is what makes it a classical genomic disorder.
  evidence:
  - reference: DOI:10.64898/2026.02.23.26346364
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a novel cohesinopathy gene and phenotypic driver of 10q22.3q23.2 genomic disorder (medRxiv preprint)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We screened our cross-disorder rare copy number variant (rCNV) microarray
      dataset ... Our analysis identified 41 carriers of the canonical ...
      10q22.3q23.2 deletion
    explanation: >-
      Directly documents detection of the canonical deletion in a microarray dataset.
- name: Investigational DNA methylation episignature analysis
  description: >-
    EpiSign analysis of peripheral blood DNA identified a cohesin release factor
    deficiency-associated methylation episignature, and a second signature
    combining WAPL sequence-variant and 10q deletion samples. Both classifiers
    showed high specificity against other episignature disorders, including
    Cornelia de Lange syndrome, whose overall methylation pattern these profiles
    do NOT mimic - so the episignature is not simply a cohesinopathy readout.
    The small research analyses do not establish a clinically validated
    diagnostic assay. The important bound is that the study did not find a
    methylation signature for WAPL sequence variants alone (the
    left-out sample clustered with cases in 0 of 8 leave-one-out iterations of
    that analysis). This assay therefore cannot currently be used to
    reclassify an isolated WAPL variant of uncertain significance; the reported
    profiles apply only to the combined and release-factor-wide research
    groupings.
  evidence:
  - reference: DOI:10.64898/2026.02.23.26346364
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a novel cohesinopathy gene and phenotypic driver of 10q22.3q23.2 genomic disorder (medRxiv preprint)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified an overall cohesin release factor deficiency -associated DNA
    explanation: >-
      Establishes that a methylation episignature exists for cohesin release
      factor deficiency as a group. The sentence is split across a page-layout
      line break in the source, so its continuation is quoted as the next
      evidence item rather than joined here.
  - reference: DOI:10.64898/2026.02.23.26346364
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a novel cohesinopathy gene and phenotypic driver of 10q22.3q23.2 genomic disorder (medRxiv preprint)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      methylation signature and a DNA methylation signature combining WAPL SNV
      and 10q del
    explanation: >-
      Completes the preceding quote and establishes the second, combined
      sequence-variant-plus-deletion signature.
  - reference: DOI:10.64898/2026.02.23.26346364
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a novel cohesinopathy gene and phenotypic driver of 10q22.3q23.2 genomic disorder (medRxiv preprint)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We did not identify a DNA methylation signature for WAPL SNVs alone.
    explanation: >-

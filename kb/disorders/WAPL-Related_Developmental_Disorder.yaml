  notes: >-
    WAPL encodes a cohesin release factor. Heterozygous predicted-damaging WAPL
    variants cause the WAPL-related developmental disorder, and WAPL is
    nominated as the phenotypic driver gene within the recurrent 10q22.3q23.2
    deletion region that encompasses it. A mouse dosage series demonstrates
    dosage sensitivity, with a liability threshold below the level of
    heterozygosity.
  evidence:
  - reference: PMID:42431198

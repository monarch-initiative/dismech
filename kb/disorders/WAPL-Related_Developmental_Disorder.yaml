    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we delineated a genetic condition caused by cohesin release
      factor deficiency, nominated WAPL as a driver gene within a genomic
      disorder region, and further illuminated dosage sensitivity of human
      cohesin.
    explanation: >-
      The authors' own summary of the gene-disease claim.

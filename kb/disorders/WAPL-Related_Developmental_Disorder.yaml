    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in the other two families, the breakpoints are within paralogous LCRs,
      removing approximately 7.2 Mb and 32 genes
    explanation: >-
      Documents the low-copy-repeat-mediated recurrent breakpoints and the
      contiguous-gene extent of the deletion.
  downstream:
  - target: WAPL Haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      The deletion removes one copy of WAPL, producing the same reduced-dosage
      state as a damaging sequence variant. Clinical similarity between the two
      groups is the basis of the driver-gene nomination. Note that the deletion
      also removes roughly 30 other genes, so it is not reducible to this edge -
      the deletion-only features curated on the 10q Deletion subtype are
      attributed elsewhere in the interval.
    evidence:
    - reference: PMID:42431198
      reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Similarities between individuals with damaging WAPL variants and those
        with large, recurrent 10q22.3q23.2 (10q) deletions encompassing WAPL
        nominate WAPL as a driver gene within this genomic disorder region.
      explanation: >-
        States the inference that connects the contiguous-gene deletion to the
        monogenic lesion.
- name: WAPL Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    The convergence point of the two lesions: a single functional WAPL allele
    and roughly half the normal amount of cohesin release factor. This is the
    state that the isogenic iPSC transcriptomic experiment engineers directly,
    and the state whose mouse equivalent (50% Wapl expression) produces mild
    growth and learning/memory deficits.
  gene:
    preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcriptomics identified significant overlap between WAPL
      haploinsufficiency and 10q deletion differentially expressed genes.
    explanation: >-
      Names WAPL haploinsufficiency as the engineered state and shows that it
      recapitulates the transcriptional consequence of the whole deletion.
  downstream:
  - target: Impaired Cohesin Release from Chromatin
    causal_link_type: DIRECT
    description: >-
      Halving WAPL dosage reduces the cohesin-unloading activity available to
      remove cohesin rings from DNA.
- name: Impaired Cohesin Release from Chromatin
  biological_scale: MOLECULAR
  description: >-
    WAPL is cohesin's DNA release factor: it opens the exit gate at the
    SMC3-RAD21 interface and unlocks cohesin from a state in which it is stably
    bound to chromatin. Loss of WAPL activity abolishes cohesin turnover, so
    cohesin remains loaded and its residence time on DNA increases. This is the
    core biochemical consequence of WAPL haploinsufficiency and is established
    from cell-biological loss-of-function work that predates the clinical
    entity.
  molecular_functions:
  - preferred_term: cohesin unloader activity
    term:
      id: GO:0140670
      label: cohesin unloader activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: cohesin complex
    term:
      id: GO:0008278
      label: cohesin complex
  biological_processes:
  - preferred_term: sister chromatid cohesion
    term:
      id: GO:0007062
      label: sister chromatid cohesion
    modifier: ABNORMAL
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:17113138
    reference_title: "Wapl controls the dynamic association of cohesin with chromatin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data indicate that Wapl is required to unlock cohesin from a
      particular state in which it is stably bound to chromatin.
    explanation: >-
      Establishes the molecular function that is reduced in this disorder:
      WAPL-dependent release of cohesin from chromatin.
  - reference: PMID:17113138
    reference_title: "Wapl controls the dynamic association of cohesin with chromatin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Wapl depletion also increases the residence time of cohesin on chromatin
      in interphase.
    explanation: >-
      Shows the direct consequence of reduced WAPL activity in interphase, the
      cell-cycle phase relevant to transcriptional regulation in developing
      tissue.
  downstream:
  - target: Extended Chromatin Loops and Altered Genome Folding
    causal_link_type: DIRECT
    description: >-
      Because cohesin is not released, loop extrusion continues past its normal
      stopping points and loops become longer.
- name: Extended Chromatin Loops and Altered Genome Folding
  biological_scale: MOLECULAR
  description: >-
    Cohesin structures interphase chromosomes by processively enlarging chromatin
    loops until it is stopped at CTCF sites or released by WAPL. When WAPL
    activity is reduced, loops extend well beyond their normal length, cohesin
    accumulates in axial vermicelli-like positions, interactions between
    neighbouring topologically associating domains increase, and loops form
    between incorrectly oriented CTCF sites. The three-dimensional genome
    therefore folds abnormally.
  biological_processes:
  - preferred_term: chromatin looping
    term:
      id: GO:0140588
      label: chromatin looping
    modifier: ABNORMAL
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:28475897
    reference_title: "The Cohesin Release Factor WAPL Restricts Chromatin Loop Extension."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      WAPL restricts this loop extension and also prevents looping between
      incorrectly oriented CTCF sites.
    explanation: >-
      States the normal restraining function of WAPL on loop length and CTCF
      directionality, whose loss defines this node.
  - reference: PMID:28475897
    reference_title: "The Cohesin Release Factor WAPL Restricts Chromatin Loop Extension."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      WAPL deficiency led to the extension of chromatin loops and strongly
      increased interaction frequencies between nearby TADs
    explanation: >-
      Direct experimental demonstration in WAPL-knockout human cells that loops
      lengthen and inter-TAD insulation is degraded.
  - reference: PMID:29217591
    reference_title: "Topologically associating domains and chromatin loops depend on cohesin and are regulated by CTCF, WAPL, and PDS5 proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the absence of WAPL and PDS5 proteins, cohesin forms extended loops,
      presumably by passing CTCF sites, accumulates in axial chromosomal
      positions (vermicelli), and condenses chromosomes.
    explanation: >-
      Independent replication of the extended-loop phenotype, and the link to
      the PDS5 binding partners that are the other two cohesin release factor
      genes examined in the clinical study.
  downstream:
  - target: Transcriptional Dysregulation
    causal_link_type: DIRECT
    description: >-
      Aberrant loop and TAD structure changes which enhancers can reach which
      promoters, altering gene expression.
- name: Transcriptional Dysregulation
  biological_scale: CELLULAR
  description: >-
    Cohesin shapes gene expression through three-dimensional chromosome folding,
    so a folding defect is read out as a transcriptional one. In isogenic human
    iPSCs and induced neurons, CRISPR-engineered WAPL truncating variants and
    engineered 10q deletion produced significantly overlapping sets of
    differentially expressed genes - the direct molecular evidence that the
    monogenic and contiguous-gene lesions converge on a shared transcriptional
    consequence in a neural lineage.
  biological_processes:

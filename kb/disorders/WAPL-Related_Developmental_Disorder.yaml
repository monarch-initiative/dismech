  description: >-
    The proximal lesion of the sequence-variant subtype: a single heterozygous
    predicted damaging variant in WAPL, with the surrounding 10q22.3q23.2
    interval intact. This is the genotype that isolates WAPL from the other
    genes in the deletion interval and so establishes it as a Mendelian disease
    gene in its own right.
  gene:
    preferred_term: WAPL
    term:
      id: hgnc:23293
      label: WAPL

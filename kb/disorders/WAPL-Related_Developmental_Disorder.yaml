    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For congenital breast aplasia, the NRG3 gene, known to be involved in
      early mammary gland development in mice, is a putative candidate gene.
    explanation: >-
      Names NRG3 as the candidate for the breast-aplasia feature, which is what
      keeps that phenotype off WAPL.
  - reference: PMID:21248748
    reference_title: "The phenotype of recurrent 10q22q23 deletions and duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For cardiac defects, BMPR1A and GRID1 are putative candidate genes because
      of their association with cardiac structure and function.
    explanation: >-
      Names BMPR1A and GRID1 as the candidates for the cardiac feature. Recorded

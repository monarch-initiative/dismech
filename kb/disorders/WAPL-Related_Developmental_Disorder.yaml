- discussion_id: wapl_pds5a_pds5b_validity
  prompt: >-
    Are PDS5A and PDS5B Mendelian disease genes, and if so what phenotypes do
    they cause?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Cohesin Release from Chromatin
  rationale: >-
    PDS5A and PDS5B are WAPL's binding partners and, with WAPL, control chromatin
    loop length, so they are strong biological candidates for a parallel
    disorder. Eight individuals with damaging variants in each were phenotyped
    and did show features of developmental disorders, yet neither cohort
    statistics nor phenotyping produced a specific association. It is therefore
    unresolved whether these are genuine but low-penetrance or heterogeneous
    disease genes, whether the cohorts were simply too small, or whether the
    variants are tolerated.

    The preprint full text has since been read, and it does not resolve the
    question - but it does sharpen it in two ways, so this gap is no longer
    "waiting on the full text". First, the negative result is not that the
    carriers were unaffected: every PDS5A/PDS5B subject had neurodevelopmental
    and/or neurological features, and what failed was the coalescence of those
    features into a defined syndrome. Second, PDS5A and PDS5B truncating
    variants were pooled with WAPL in Analysis 1 of the methylation work, and
    that combined analysis did yield a cohesin-release-factor-deficiency
    episignature - which is suggestive of a shared molecular consequence, but
    cannot be attributed to PDS5A/PDS5B individually from a pooled classifier.
    Neither observation changes relationship_type: UNKNOWN, which remains the
    correct call.
  proposed_experiments:
  - experiment_id: exp_pds5_matchmaking_cohort
    name: Powered PDS5A and PDS5B variant cohort with repeated association statistics
    description: >-
      Assemble larger international PDS5A and PDS5B variant cohorts through
      matchmaking platforms and repeat the phenotype-association statistics with
      adequate power.
  - experiment_id: exp_pds5_isogenic_ipsc_transcriptomics
    name: Isogenic PDS5A/PDS5B iPSC and induced-neuron transcriptomic comparison
    description: >-
      Apply the same isogenic iPSC and induced-neuron CRISPR and transcriptomic
      pipeline used for WAPL to PDS5A and PDS5B knockouts, and test whether
      their differentially expressed gene sets overlap the WAPL signature.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While individuals with PDS5A or PDS5B variants exhibited features of
      developmental disorders, neither cohort-based statistics nor subject
      phenotyping associated these genes with specific phenotypes.
    explanation: >-
      States the unresolved association directly.
  - reference: DOI:10.64898/2026.02.23.26346364
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a novel cohesinopathy gene and phenotypic driver of 10q22.3q23.2 genomic disorder (medRxiv preprint)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      every subject had neurodevelopmental and/or neurological features
    explanation: >-
      Shows the carriers were not unaffected, which is what makes this a genuine
      open question rather than a negative result. PARTIAL because it supports
      the existence of a phenotype while leaving the gene-disease association
      unresolved.
  - reference: DOI:10.64898/2026.02.23.26346364
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a novel cohesinopathy gene and phenotypic driver of 10q22.3q23.2 genomic disorder (medRxiv preprint)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis 1 combined truncating variants
    explanation: >-
      Records that PDS5A and PDS5B were pooled with WAPL in the episignature
      analysis that succeeded, so the positive methylation result cannot be
      apportioned to them individually.
  - reference: PMID:34070827
    reference_title: "PDS5A and PDS5B in Cohesin Function and Human Disease."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PDS5 deficiency did not affect mice’s brains, showing that their role in
      the cohesin complex does not affect the development of the CNS
    explanation: >-
      The strongest evidence against PDS5A/PDS5B being neurodevelopmental
      disease genes, and a genuine counterweight to the biological-candidacy
      argument: unlike Wapl heterozygotes, Pds5 knockout mice have no reported
      brain phenotype, though they do have cardiac, palatal and skeletal
      defects. Fenced as MODEL_ORGANISM, and note the review also records that
      the two published Pds5 mouse models disagree with each other on
      redundancy and embryonic lethality, so this is not a settled negative.
- discussion_id: wapl_mouse_dosage_threshold_translation
  prompt: >-
    Does the mouse Wapl dosage-liability threshold, which lies below
    heterozygosity, actually describe the human dose-response, and does it
    predict that severely hypomorphic or biallelic human WAPL genotypes are
    non-viable?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: >-
    The dosage-series evidence is retained in the animal model rather than as a
    human causal-graph node because it exists only in mouse. Every reported human
    is heterozygous, so the 25%-residual arm - birth defects and postnatal
    lethality - has no human counterpart and its translational validity is
    untested. The mismatch is mechanistically meaningful in two directions: if
    the human curve is shifted, apparently mild human heterozygotes could still
    harbour subclinical cohesin-folding defects; and if it holds, human
    sub-heterozygous WAPL genotypes would be expected to present as pregnancy
    loss or lethal congenital anomaly rather than as this neurodevelopmental
    disorder, which would systematically hide them from neurodevelopmental
    cohorts.
  proposed_experiments:
  - experiment_id: exp_wapl_perinatal_loss_cohort_search
    name: Search perinatal-loss and lethal-anomaly cohorts for sub-heterozygous WAPL genotypes
    description: >-
      Search prenatal and perinatal-loss and lethal-congenital-anomaly
      sequencing cohorts for biallelic or severely hypomorphic WAPL genotypes,
      which the mouse data predict should exist there and nowhere else.
  - experiment_id: exp_wapl_human_residual_dosage_assay
    name: Residual WAPL protein and cohesin residence time in human heterozygote cells
    description: >-
      Quantify residual WAPL protein and cohesin residence time in cells from
      human heterozygotes and relate them to phenotype severity, to place human
      carriers on the mouse dose-response curve directly.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with 50% Wapl expression exhibited mild deficits of growth and
      learning/memory, whereas those with 25% residual Wapl displayed birth
      defects and postnatal lethality, revealing a dosage liability threshold
      below the level of heterozygosity.
    explanation: >-
      The model-organism result whose human translation is the open question.
- discussion_id: wapl_mondo_term_request
  prompt: >-
    Should a MONDO term be requested for the monogenic WAPL-related
    developmental disorder, distinct from MONDO:0012830 (the contiguous-gene 10q
    deletion)?
  kind: CURATION_TODO
  status: OPEN
  rationale: >-
    `disease_term` is currently omitted because no MONDO class exists for the
    monogenic entity. MONDO:0012830 is deliberately not reused, since conflating
    a single-gene disorder with the deletion syndrome that contains it is
    exactly the named-entity-confusion failure mode the curation SOP warns
    about. Once the full text and additional cases are published, a MONDO
    new-term request would let this entry carry a proper `disease_term` and
    would let the deletion/sequence-variant distinction be represented in the
    ontology rather than only in dismech.
  evidence:
  - reference: PMID:42431198
    reference_title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we delineated a genetic condition caused by cohesin release
      factor deficiency, nominated WAPL as a driver gene within a genomic
      disorder region, and further illuminated dosage sensitivity of human
      cohesin.
    explanation: >-
      The publication delineating a distinct genetic condition, which is the
      basis on which a new MONDO class would be requested.
references:
- reference: PMID:42431198
  title: "Clinical, in vitro, and in vivo evidence of WAPL as a cohesinopathy-associated gene and phenotypic driver of 10q22.3q23.2 genomic disorder."
  findings:
  - statement: >-
      Defining publication. Phenotypes 27 individuals with heterozygous damaging
      WAPL variants (plus 8 each with PDS5A and PDS5B variants), delineates a
      WAPL-related disorder of developmental delay and intellectual disability,
      nominates WAPL as the driver gene of the recurrent 10q22.3q23.2 deletion
      via overlapping iPSC and induced-neuron transcriptomes, and defines a
      mouse Wapl dosage-liability threshold below heterozygosity.
- reference: DOI:10.64898/2026.02.23.26346364
  title: "Clinical, in vitro, and in vivo evidence of WAPL as a novel cohesinopathy gene and phenotypic driver of 10q22.3q23.2 genomic disorder (medRxiv preprint)."
  findings:
  - statement: >-
      medRxiv preprint of the defining publication (PMID:42431198), posted
      2026-02-28 and openly available in full text. Supplies the per-feature
      counts the ahead-of-print abstract omits - of 25 phenotyped individuals,
      21 have mild-moderate developmental delay/intellectual disability, 15
      craniofacial dysmorphism, 14 neurological features, 11 behavioral
      features, 7 cardiac findings and 4 clubfoot - and reports the EpiSign
      DNA methylation analysis, which found a cohesin-release-factor-deficiency
      episignature and a combined WAPL-SNV-plus-10q-deletion signature but no
      signature for WAPL sequence variants alone. Case-level data in Table 1,
      Table S4, Fig. 2 and Fig. S12 are redacted per medRxiv guidelines, so
      variant-level and facial-gestalt curation is still blocked.
- reference: PMID:17113138
  title: "Wapl controls the dynamic association of cohesin with chromatin."
  findings:
  - statement: >-
      Identifies WAPL as the factor required to unlock cohesin from its stably
      chromatin-bound state; WAPL depletion increases cohesin residence time on
      chromatin in interphase.
- reference: PMID:28475897
  title: "The Cohesin Release Factor WAPL Restricts Chromatin Loop Extension."
  findings:
  - statement: >-
      WAPL-knockout human cells show extended chromatin loops, increased contact
      between neighbouring TADs, and looping between incorrectly oriented CTCF
      sites, establishing WAPL as the brake on cohesin loop extrusion.
- reference: PMID:29217591
  title: "Topologically associating domains and chromatin loops depend on cohesin and are regulated by CTCF, WAPL, and PDS5 proteins."
  findings:
  - statement: >-
      Independent demonstration that WAPL and its PDS5 binding partners set loop
      length, with vermicelli-like axial cohesin accumulation on their loss;
      supplies the mechanistic rationale for treating PDS5A and PDS5B as
      candidate genes.
- reference: PMID:17436248
  title: "Recurrent 10q22-q23 deletions: a genomic disorder on 10q associated with cognitive and behavioral abnormalities."
  findings:
  - statement: >-
      Original delineation of the recurrent LCR-mediated 10q22-q23 deletion as a
      genomic disorder associated with cognitive impairment, autism,
      hyperactivity and possible psychiatric disease.
- reference: PMID:21248748
  title: "The phenotype of recurrent 10q22q23 deletions and duplications."
  findings:
  - statement: >-
      Clinical and molecular characterisation of eight deletions and six
      duplications of 10q22.3q23.3; LCR3-4 deletion carriers had
      speech-predominant developmental delay, macrocephaly, mild facial
      dysmorphism, cerebellar anomalies, cardiac defects and congenital breast
      aplasia, with NRG3 proposed for breast aplasia and BMPR1A/GRID1 for
      cardiac defects.
review_notes: >-
  The 2026 REVIEW retained the deliberate distinction between the monogenic
  WAPL sequence-variant entity and the WAPL-containing recurrent deletion while
  auditing every subtype-specific count against its actual denominator. Broad
  rCNV counts are now bound to the same broad HPO terms rather than used as
  frequency evidence for narrower structural phenotypes. All DOI-preprint
  snippets skipped by the standard prefix-aware validator were independently
  checked against the cached full text. The causal graph now gives every edge
  claim-level evidence, treats the folding-to-transcription and
  transcription-to-neurodevelopment routes as emerging hypotheses, and does not
  generalize engineered frameshift haploinsufficiency to every clinical missense
  allele. The mouse dosage threshold remains an animal-model result and a
  HUMAN_MODEL_MISMATCH question, not a human lethality prediction. Active
  digestive surveillance is included only for the BMPR1A-containing deletion
  subtype. Case-level variants, a monogenic MONDO term, and the uncached
  Orphanet phenotype tail remain explicit open curation items rather than
  unsupported assertions.

genetic:
- name: MYOC
  association: Causative
  notes: Primary open-angle glaucoma
  evidence:
  - reference: PMID:37217093
    reference_title: "Myocilin misfolding and glaucoma: A 20-year update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in the gene MYOC account for approximately 5% of cases of primary open angle glaucoma (POAG)."
    explanation: >
      Establishes MYOC as a causative gene for POAG, accounting for a
      significant proportion of cases. Tagged OTHER: this is a narrative review
      restating an established figure rather than reporting primary data.
  - reference: PMID:37217093
    reference_title: "Myocilin misfolding and glaucoma: A 20-year update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While myocilin is expressed in numerous tissues, mutant myocilin is only associated with disease in the anterior segment of the eye, in the trabecular meshwork."
    explanation: >
      Demonstrates tissue-specific pathogenicity of MYOC mutations in the
      trabecular meshwork of the eye. Tagged OTHER for the same reason as the
      companion item — review synthesis, not primary observation.
- name: OPTN
  association: Causative
  notes: >
    Primarily normal-tension glaucoma. Typed Causative rather than Risk Factor
    because OPTN E50K is generally treated as a dominant causative variant
    rather than a susceptibility allele, which is the more standard reading of
    this gene.

    The NTG-specific source this note previously said was still needed has now
    been supplied: PMID:16043855 reports that all 11 E50K-carrying patients in
    the Moorfields series had normal-tension glaucoma, with quantified normal
    presenting and peak diurnal pressures.

    The full mechanism lives in its own entry, `OPTN-related Open Angle
    Glaucoma` (MONDO:0100553) - the OPTN-TBK1 misfolding lesion, the block in
    autophagic flux and mitophagy in retinal ganglion cells, and the clinical
    course. It is deliberately NOT re-derived here: this umbrella entry keeps
    the generic IOP-driven trabecular-outflow account of adult POAG, which is
    the arm that does NOT apply to the OPTN entity.
  evidence:
  - reference: PMID:26302410
    reference_title: "Defects in autophagy caused by glaucoma-associated mutations in optineurin."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Certain mutations in optineurin (gene OPTN) are associated with primary open angle glaucoma."
    explanation: >
      Regraded to PARTIAL: the snippet establishes an association between OPTN
      mutations and primary open-angle glaucoma, but says nothing about
      normal-tension glaucoma, which is the scope this entry records, and
      "associated with" does not by itself settle causative-versus-risk-allele
      typing. Tagged IN_VITRO — the study characterizes autophagy defects in
      cultured cells expressing mutant optineurin.
  - reference: PMID:16043855
    reference_title: "Clinical features and course of patients with glaucoma with the E50K mutation in the optineurin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 11 subjects had normal tension glaucoma (NTG), with presenting and highest IOP of 15.3 +/- 3.0 and 16.5 +/- 2.5 mm Hg (+/-SD) on diurnal testing."
    explanation: >
      Supplies the normal-tension-glaucoma-specific association that the note
      on this entry previously recorded as an outstanding gap: every E50K
      carrier in this clinical series had NTG, at quantified normal pressures.
  - reference: PMID:26302410
    reference_title: "Defects in autophagy caused by glaucoma-associated mutations in optineurin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, an optimum level of optineurin-mediated autophagy is crucial for survival of retinal cells, and impaired autophagy is likely to contribute to glaucoma pathogenesis."
    explanation: >
      Explains how OPTN variants contribute to glaucoma through dysregulated
      autophagy in retinal cells. This is the paper's own mechanistic
      conclusion, so SUPPORT stands; the cell-based experimental basis is
      recorded by the IN_VITRO tag.

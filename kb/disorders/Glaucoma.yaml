environmental:
- name: Age
  notes: Major risk factor, increases after 40
  evidence:
  - reference: PMID:2056646
    reference_title: "Racial variations in the prevalence of primary open-angle glaucoma. The Baltimore Eye Survey"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Rates among blacks ranged from 1.23% in those aged 40 through 49 years to 11.26% in those 80 years or older"
    explanation: "Population-based survey of 5,308 participants, showing a roughly nine-fold prevalence gradient across the age range sampled. PARTIAL for two reasons: the survey enrols only from age 40, so it cannot evidence 40 as a threshold, and its subject is racial variation rather than age."
- name: Family History
  notes: First-degree relatives at ~4-7x increased risk (siblings RR 3.8, parents
    RR 6.3, children RR 6.8)
  evidence:
  - reference: PMID:20858511
    reference_title: "Using the Utah Population Database to assess familial risk of primary open angle glaucoma"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "siblings (RR=3.76 (95% CI 2.66-5.31)), parents (RR=6.25 (95% CI 3.94-9.9)) and children (RR=6.77 (95% CI 3.39-13.5))"
    explanation: "Case-control analysis over 1M linked records. The note previously said 4-9x; the measured first-degree relative risks are 3.8-6.8, so the range has been corrected to what the citation supports."
- name: African Ancestry
  notes: Higher prevalence and severity
  evidence:
  - reference: PMID:24974815
    reference_title: "Global prevalence of glaucoma and projections of glaucoma burden through 2040: a systematic review and meta-analysis"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "people of African ancestry were more likely to have POAG than people of European ancestry (OR, 2.80; 95% CrI, 1.83-4.06)"
    explanation: "Meta-analysis of 50 population-based studies, adjusted for age, gender, habitation type and study year. PARTIAL because it evidences the prevalence half of this annotation but not the severity half."
- name: Myopia
  notes: Risk factor for open-angle glaucoma
  evidence:
  - reference: PMID:34648776
    reference_title: "Degree of Myopia and Glaucoma Risk: A Dose-Response Meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For each unit (1-D) increase in myopia, the risk of glaucoma increases by approximately 20%"
    explanation: "Dose-response meta-analysis over 514,265 individuals; the risk accelerates nonlinearly beyond about -6 D, reaching OR 4.14 for high myopia."

  title: Comparative shotgun proteomics of aqueous humor for cataract, glaucoma and pseudoexfoliation eye disorders.
  description: The aim of this work was to characterize proteome of aqueous humor from subjects with various eye conditions such as cataract, glaucoma and pseudoexfoliation syndrome by high-resolution chromate-mass-spectrometry. Twenty nine human aqueous humor samples were processed by shotgun proteomics. Data was searched using MaxQuant package. Totally, 263 protein groups were identified. Label-free quantitation reported some differentially expressed proteins in aqueous humor proteome for the aforementioned eye diseases.

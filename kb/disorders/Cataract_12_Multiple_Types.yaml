    snippet: "Myopia, observed in 10 out of 12 cataract patients and significantly higher than that in unaffected offspring and siblings (1 out of 8), was independently mapped to a 61.2 cM (59 Mb) region between D3S3606 and D3S1262 on 3q21.3-q27.2 with maximum lod score of 3.79."

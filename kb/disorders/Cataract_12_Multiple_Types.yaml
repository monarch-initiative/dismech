genetic:
- name: BFSP2
  gene_term:
    preferred_term: BFSP2
    term:
      id: hgnc:1041
      label: BFSP2
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported dominant alleles (NM_003571): c.697_699del p.(Glu233del) in exon 3,
    recurrent in unrelated families from the United States and China;
    c.859C>T p.(Arg287Trp) in exon 4 (juvenile-onset family, one adult carrier
    without confirmed cataract); c.1091G>A p.(Arg339His) in exon 5; and
    c.335G>A p.(Gly112Glu). c.265C>T p.(Arg89Trp), in the head domain, was
    classed as a variant of uncertain significance with possible reduced
    penetrance in an Australian family and is not counted here. The recessive
    Saudi allele is described only as a likely null mutation in the abstract.
    No ClinGen gene-disease validity assertion for BFSP2 was found in the
    repository's ClinGen cache.
  evidence:
  - reference: PMID:10739768
    reference_title: "Autosomal-dominant congenital cataract associated with a deletion mutation in the human beaded filament protein gene BFSP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By sequencing the coding regions of BFSP2, we found that a deletion mutation, DeltaE233, is associated with cataracts in this family."
    explanation: First BFSP2 cataract allele.
  - reference: PMID:10729115
    reference_title: "A juvenile-onset, progressive cataract locus on chromosome 3q21-q22 is associated with a missense mutation in the beaded filament structural protein-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We predicted that this led to a nonconservative R287W substitution in exon 4 that cosegregated with cataracts."
    explanation: R287W cosegregating in the juvenile-onset family.
  - reference: PMID:10729115
    reference_title: "A juvenile-onset, progressive cataract locus on chromosome 3q21-q22 is associated with a missense mutation in the beaded filament structural protein-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This individual's symptoms suggest that this mutation is not fully penetrant or that the age-at-onset spectrum in this family is quite broad."
    explanation: Possible incomplete penetrance of R287W.
  - reference: PMID:15570218
    reference_title: "Clinical description and genome wide linkage study of Y-sutural cataract and myopia in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of the beaded filament structural protein 2 (BFSP2) gene identified a previously described c.697_699delGAA (E233del) mutation which was present in all individuals with Y-sutural cataract but not in unaffected individuals and controls."
    explanation: Recurrent E233del in an unrelated Chinese family.
  - reference: PMID:18958306
    reference_title: "A new mutation in BFSP2 (G1091A) causes autosomal dominant congenital lamellar cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing the beaded filament structural protein 2 (BFSP2) gene revealed a G>A transversion in exon 5, which caused a conservative substitution of Arg to His at codon 339 (P.R339H)."
    explanation: R339H in a dominant lamellar cataract family.
  - reference: PMID:24654948
    reference_title: "A novel p.G112E mutation in BFSP2 associated with autosomal dominant pulverulent cataract with sutural opacities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct candidate gene sequencing revealed a heterozygous c. 335 G>A variation in the beaded filament structural protein 2(BFSP2) gene, which resulted in the replacement of a highly conserved glycine by glutamic at codon 112 (p. G112E)."
    explanation: G112E cosegregating in a dominant family.
  - reference: PMID:39994538
    reference_title: "Identification of mutations associated with congenital cataracts in nineteen Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant BFSP2: exon3: c.697_699del in family 4 was classified as LP and has been reported to segregate with disease in multiple affected family members"
    explanation: E233del classified likely pathogenic in a further family.
  - reference: PMID:36161833
    reference_title: "Pathogenic genetic variants identified in Australian families with paediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family CQLD130, the BFSP2 p.(Arg89Trp) variant was observed in four affected individuals and a child who was unaffected as the 10 years old at last examination, but not yet old enough to be confirmed as unaffected for a childhood onset disease"
    explanation: Head-domain variant of uncertain significance with possible reduced penetrance.
animal_models:
- name: Bfsp2 (CP49) targeted knockout mouse
  species: Mouse
  genotype: Bfsp2 exon 1 targeted deletion, homozygous
  publication: PMID:12454043
  modeled_mechanisms:
  - target: Lens Light Scattering and Loss of Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Null lenses lose beaded filaments and develop slowly worsening light
      scattering visible by slit lamp, after normal early fiber cell
      differentiation.
    limitations: >-
      Models only a null genotype, which in humans is recessive; the dominant
      rod-domain alleles are not modelled. Opacity is subtle, and one
      independent knockout was judged not to have cataract.
    evidence:
    - reference: PMID:12454043
      reference_title: "Targeted genomic deletion of the lens-specific intermediate filament protein CP49."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Direct examination of lenses showed no obvious loss of lens clarity, but slit lamp examination revealed the emergence of opacification in even the youngest animals."
      explanation: Subtle opacification in knockout lenses.
    - reference: PMID:12573667
      reference_title: "Knockout of the intermediate filament protein CP49 destabilises the lens fibre cell cytoskeleton and decreases lens optical quality, but does not induce cataract."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The first was that no cataract was observed despite the fact that the beaded filaments of the lens fibre cells had been disrupted."
      explanation: Independent knockout shows the opacity stops short of frank cataract.
  - target: Beaded Filament Assembly Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: CP49 protein is absent and filensin protein is reduced, so no beaded filaments form.
    evidence:
    - reference: PMID:12454043
      reference_title: "Targeted genomic deletion of the lens-specific intermediate filament protein CP49."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transcription and translation of CP49 were successfully negated in knockout animals."
      explanation: Complete CP49 loss in the knockout.
- name: 129 and FVB/N strain natural Bfsp2 deletion mouse
  species: Mouse
  genotype: Homozygous 6.3 kb Bfsp2 deletion removing the exon 2 splice acceptor (129, CBA, 101 and FVB/N strains)
  publication: PMID:14985306
  modeled_mechanisms:
  - target: Beaded Filament Assembly Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The strains lack CP49 and beaded filaments and behave as functional CP49 knockouts.
    evidence:
    - reference: PMID:14985306
      reference_title: "Characterization of a mutation in the lens-specific CP49 in the 129 strain of mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, the 129 strain of mouse behaves as a functional CP49 knockout."
      explanation: Natural null allele phenocopies the targeted knockout.
    - reference: PMID:17065509
      reference_title: "Inbred FVB/N mice are mutant at the cp49/Bfsp2 locus and lack beaded filament proteins in the lens."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immunofluorescence demonstrated that FVB/N mice do not have detectable CP49 or filensin protein in the lens, whereas C57BL/6 mice have the expected protein distribution."
      explanation: The same deletion in FVB/N mice removes both beaded filament proteins.
  - target: Lens Light Scattering and Loss of Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Slowly emerging, progressive loss of optical clarity with age.
    limitations: >-
      A null allele on mixed or inbred backgrounds, and widely used as an
      embryonic stem cell source, so it can confound other lens knockouts; it
      does not model the dominant human alleles.
    evidence:
    - reference: PMID:14985306
      reference_title: "Characterization of a mutation in the lens-specific CP49 in the 129 strain of mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Electron microscopy showed the absence of beaded filaments, whereas slit lamp microscopy showed a slowly emerging and progressive loss of optical clarity."
      explanation: Progressive loss of clarity in the natural mutant.
diagnosis:
- name: Cataract gene panel or exome sequencing
  description: >-
    Morphology overlaps with other inherited cataracts, so diagnosis rests on
    sequencing known cataract genes with Sanger confirmation and segregation
    testing; the recent BFSP2 families were found this way.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29914532
    reference_title: "Clinical and genetic characteristics of Chinese patients with familial or sporadic pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next-generation sequencing provides significant diagnostic information for pediatric cataract cases, especially when considering sporadic and subtle syndromal cases."
    explanation: Panel sequencing study that identified a BFSP2 E233del family.
  - reference: PMID:39994538
    reference_title: "Identification of mutations associated with congenital cataracts in nineteen Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All probands were initially screened by whole-exome sequencing(WES), and then validated by co-segregation analysis using Sanger sequencing."
    explanation: Exome sequencing with segregation identified a BFSP2 family.
treatments:
- name: Cataract Surgery
  description: >-
    Lens extraction, with intraocular lens implantation where appropriate, is
    the treatment for visually significant opacity; affected members of BFSP2
    families have had surgery from early childhood to age 50. No
    BFSP2-specific therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Developmental cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  - preferred_term: Juvenile cataract
    term:
      id: HP:0001118
      label: Juvenile cataract
  evidence:
  - reference: PMID:10739768
    reference_title: "Autosomal-dominant congenital cataract associated with a deletion mutation in the human beaded filament protein gene BFSP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The acuity declined to 20/50 in the right eye; cataract surgery with intraocular lens implantation restored the acuity to 20/25."
    explanation: Surgery restored acuity in an E233del patient.
  - reference: PMID:10729115
    reference_title: "A juvenile-onset, progressive cataract locus on chromosome 3q21-q22 is associated with a missense mutation in the beaded filament structural protein-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ages for cataract surgery were 12–50 years."
    explanation: Surgical ages in the juvenile-onset R287W family.
  - reference: PMID:31317088
    reference_title: "Updates on managements of pediatric cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This review article suggests that lens opacity obscuring the red reflex in preverbal children and visual acuity of less than 20/40 is an absolute indication for lens aspiration."
    explanation: >-
      General pediatric cataract surgical indication; not specific to BFSP2,
      which has no gene-specific management.
notes: >-
  No GeneReviews chapter covers BFSP2-related cataract. The MONDO definition
  names heterozygous mutation only; the recessive Saudi family is included here
  because it has the same gene and lens-limited phenotype. Myopia is included as
  a phenotype from a single family and is not established as a BFSP2 feature.
  The mouse strains 129, CBA, 101 and FVB/N carry a natural Bfsp2 null allele,
  so lens phenotypes of knockouts made on these backgrounds can include a CP49
  contribution.

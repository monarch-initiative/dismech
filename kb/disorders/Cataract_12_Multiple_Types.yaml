    reference_title: "Targeted genomic deletion of the lens-specific intermediate filament protein CP49."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The absence of CP49 causes a subtle loss of optical clarity in the ocular lens, a loss that worsens with age."
    explanation: Targeted CP49 knockout develops progressive opacification.
  - reference: PMID:12573667
    reference_title: "Knockout of the intermediate filament protein CP49 destabilises the lens fibre cell cytoskeleton and decreases lens optical quality, but does not induce cataract."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Light scatter and the lens optical properties had, however, deteriorated in the CP49 knockout lenses compared to litter mate controls."

    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Only one of the three E233del BFSP2 pedigrees has been reported to exhibit myopia, albeit mild (53), and in that family pedigree, there was no evidence supporting the idea that myopia was caused by changes in lens morphology."

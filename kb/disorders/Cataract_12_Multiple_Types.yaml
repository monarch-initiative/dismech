name: Cataract 12 Multiple Types
creation_date: "2026-10-30T12:00:00Z"
category: Mendelian
synonyms:
- CTRCT12
- cataract 12, multiple types
- BFSP2-related cataract
- phakinin-related cataract
- CP49-related cataract
description: >-
  Non-syndromic cataract caused by pathogenic variants in BFSP2, which encodes
  phakinin (CP49), one of the two lens-specific intermediate filament proteins
  that co-assemble with BFSP1 (filensin) into the beaded filament of lens fiber
  cells. Most families show autosomal dominant inheritance of heterozygous
  missense or in-frame deletion alleles, most of them in the central rod domain;
  the recurrent in-frame deletion p.Glu233del has been found in several
  unrelated families in the United States and China. Morphology varies between
  and within families: congenital nuclear, sutural (often Y-sutural),
  pulverulent, spokelike cortical, lamellar, posterior polar radial or total
  cataract, and a juvenile-onset progressive form in which the lens is clear at
  birth. Myopia co-segregated with Y-sutural cataract in one family. One
  consanguineous family has a likely null allele causing autosomal recessive
  diffuse cortical cataract with unaffected heterozygous carriers. Mice lacking
  CP49, either by targeted deletion or through the natural Bfsp2 deletion
  carried by 129 and FVB/N strains, form no beaded filaments and lose lens
  optical quality progressively with age.
disease_term:
  preferred_term: cataract 12 multiple types
  term:
    id: MONDO:0012701
    label: cataract 12 multiple types
parents:
- Early-onset non-syndromic cataract
inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous BFSP2 variants segregate with cataract in multigenerational
    families from the United States and China, with linkage to 3q21-q22 in the
    families that were mapped. Penetrance may be incomplete: one adult R287W
    carrier had no confirmed cataract.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:10739768
    reference_title: "Autosomal-dominant congenital cataract associated with a deletion mutation in the human beaded filament protein gene BFSP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elsewhere, in family ADCC-3, we mapped an autosomal-dominant cataract gene to chromosome 3q21-q22, near the gene that encodes a lens-specific beaded filament protein gene, BFSP2."
    explanation: Dominant family ADCC-3, in which the BFSP2 E233del allele was found.
  - reference: PMID:10729115
    reference_title: "A juvenile-onset, progressive cataract locus on chromosome 3q21-q22 is associated with a missense mutation in the beaded filament structural protein-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomewide linkage analysis in a multigenerational pedigree, segregating for autosomal dominant juvenile-onset cataracts, identified a locus in chromosome region 3q21.2-q22.3."
    explanation: Dominant juvenile-onset family carrying BFSP2 R287W.
  - reference: PMID:17982427
    reference_title: "The E233del mutation in BFSP2 causes a progressive autosomal dominant congenital cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-point linkage analysis mapped this autosomal dominant congenital cataract (ADCC) locus to D3S1292 in 3q22.1 with a LOD score Zmax=3.99 (theta=0.00)."
    explanation: Independent dominant Chinese family linked to the BFSP2 region.
  - reference: PMID:18958306
    reference_title: "A new mutation in BFSP2 (G1091A) causes autosomal dominant congenital lamellar cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation cosegregated with the disease phenotype in all affected individuals and was not observed in the unaffected family members or in 100 normal, unrelated individuals."
    explanation: Four-generation dominant family carrying R339H.
- name: Autosomal Recessive
  description: >-
    A likely null BFSP2 allele causes recessive diffuse cortical cataract in a
    consanguineous Saudi family; heterozygous carriers are unaffected. This
    family is not covered by the MONDO definition, which names heterozygous
    mutation only.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21836522
    reference_title: "Novel recessive BFSP2 and PITX3 mutations: insights into mutational mechanisms from consanguineous populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that BFSP2 and PITX3, hitherto known to cause eye defects only in a dominant fashion, can also present recessively."
    explanation: Recessive BFSP2 family identified by homozygosity mapping.
  - reference: PMID:26622071
    reference_title: "Phenotypes of Recessive Pediatric Cataract in a Cohort of Children with Identified Homozygous Gene Mutations (An American Ophthalmological Society Thesis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifteen different homozygous recessive gene mutations were identified in the 26 consanguineous families; two genes and five families are novel to this study."
    explanation: >-
      Saudi recessive cataract series that includes one family with a homozygous
      BFSP2 mutation; from the same group as PMID:21836522, so it may describe
      the same family.
pathophysiology:
- name: Heterozygous Dominant BFSP2 Variants
  biological_scale: MOLECULAR
  description: >-
    Dominant alleles cluster in the alpha-helical central rod domain, which
    mediates coiled-coil dimerization: R287W, the recurrent in-frame E233del
    and R339H; G112E lies near the head-rod boundary. E233 and R287 are
    conserved across species and among intermediate filament proteins, and
    deleting E233 is predicted to shift the heptad repeat phase. Because a
    likely null allele causes no cataract in heterozygous carriers, the dominant
    alleles are thought to act by a mechanism other than haploinsufficiency;
    no functional study of a human BFSP2 allele was found.
  genes:
  - preferred_term: BFSP2
    term:
      id: hgnc:1041
      label: BFSP2
  molecular_functions:
  - preferred_term: structural constituent of eye lens
    term:
      id: GO:0005212
      label: structural constituent of eye lens
    modifier: DECREASED
  evidence:
  - reference: PMID:10729115
    reference_title: "A juvenile-onset, progressive cataract locus on chromosome 3q21-q22 is associated with a missense mutation in the beaded filament structural protein-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation alters an evolutionarily conserved arginine residue in the central rod domain of the intermediate filament."
    explanation: R287W changes a conserved rod-domain residue.
  - reference: PMID:10739768
    reference_title: "Autosomal-dominant congenital cataract associated with a deletion mutation in the human beaded filament protein gene BFSP2."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Deletion of residue E233 would result in a phase shift in the 1,4 periodicity and would perturb an otherwise highly conserved property among IF proteins."
    explanation: Sequence-alignment argument that E233del disrupts the coiled-coil heptad repeat.
  - reference: PMID:21836522
    reference_title: "Novel recessive BFSP2 and PITX3 mutations: insights into mutational mechanisms from consanguineous populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The likely null nature of both mutations and lack of manifestation in heterozygotes strongly argues for a mechanism other than loss of function in the previously reported dominant mutations in these two genes."
    explanation: Unaffected carriers of a null allele argue against haploinsufficiency for the dominant alleles.
  downstream:
  - target: Beaded Filament Assembly Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17490642
      reference_title: "Insights into the beaded filament of the eye lens."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "Deletion of the residue E233 would be expected to completely alter the heptad repeat for CP49 (BFSP2) and be equally disruptive for beaded filament assembly."
      explanation: >-
        Review prediction that E233del disrupts beaded filament assembly; this
        has not been tested experimentally for any human BFSP2 allele.
- name: Biallelic BFSP2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The recessive allele in the Saudi family is described as likely null.
    Targeted or natural Bfsp2 null alleles in mice abolish CP49 protein and the
    beaded filament, which is the closest model for this genotype.
  genes:
  - preferred_term: BFSP2
    term:
      id: hgnc:1041
      label: BFSP2
  molecular_functions:
  - preferred_term: structural constituent of eye lens
    term:
      id: GO:0005212
      label: structural constituent of eye lens
    modifier: DECREASED
  evidence:
  - reference: PMID:21836522
    reference_title: "Novel recessive BFSP2 and PITX3 mutations: insights into mutational mechanisms from consanguineous populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one family, a novel BFSP2 mutation causes autosomal recessive diffuse cortical cataract with scattered lens opacities"
    explanation: Recessive BFSP2 family with a likely null allele.
  downstream:
  - target: Beaded Filament Assembly Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14985306
      reference_title: "Characterization of a mutation in the lens-specific CP49 in the 129 strain of mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The 129/SvJ and 129/OLa strains of mice harbor a mutation that sharply reduces CP49 mRNA levels and essentially eliminates both CP49 and the beaded filament."
      explanation: Natural mouse Bfsp2 null allele eliminates the beaded filament; inferred for the human null allele.
- name: Beaded Filament Assembly Failure
  biological_scale: CELLULAR
  description: >-
    Phakinin and filensin cannot form filaments alone and co-assemble into the
    beaded filament. Without CP49, filensin protein falls although its mRNA is
    unchanged, and no beaded filaments form in fiber cells.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: DECREASED
  evidence:
  - reference: PMID:19587458
    reference_title: "Functions of the intermediate filament cytoskeleton in the eye lens."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Neither BFSP1 nor BFSP2 appear capable of assembling alone into IFs in vitro"
    explanation: Review of in vitro assembly showing the two proteins must co-assemble.
  - reference: PMID:15777782
    reference_title: "Seeing is believing! The optical properties of the eye lens are dependent upon a functional intermediate filament cytoskeleton."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Whilst CP49 is completely tailless, filensin has a rather short rod domain and extremely large C-terminal tail domain. In vitro, CP49 and filensin do not form IFs on their own."
    explanation: Review noting that CP49 lacks a tail domain and cannot form filaments without filensin.
  - reference: PMID:12454043
    reference_title: "Targeted genomic deletion of the lens-specific intermediate filament protein CP49."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Filensin levels were sharply reduced, although filensin mRNA levels appeared unchanged."
    explanation: CP49 knockout lowers its assembly partner at the protein level.
  - reference: PMID:14667833
    reference_title: "Bfsp2 mutation found in mouse 129 strains causes the loss of CP49 and induces vimentin-dependent changes in the lens fibre cell cytoskeleton."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Electron microscopy of the lens cytoskeleton from 129S2/SvPas revealed similar morphological changes in the cytoskeleton as compared to the CP49 knockout, with beaded and intermediate filaments being apparently replaced by poorly defined filament-like material."
    explanation: Loss of beaded filaments in CP49-null fiber cells.
  downstream:
  - target: Loss of Fiber Cell Architecture and Long-Range Order
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18326727
      reference_title: "Resisting the effects of aging: a function for the fiber cell beaded filament."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The beaded filament is not required for the generation of the differentiated fiber cell phenotype but is required to maintain that differentiated state and the long range order that characterizes the lens at the tissue level."
      explanation: Phakosin (CP49) and filensin knockout lenses lose fiber cell order after differentiation.
- name: Loss of Fiber Cell Architecture and Long-Range Order
  biological_scale: TISSUE
  description: >-
    In CP49-null lenses fiber cells differentiate and elongate normally, then
    lose their shape, membrane organization and long-range stacking as they
    mature. The lenses are also smaller and less stiff than wild type. The
    Y-shaped sutural opacity of E233del families is thought to reflect a change
    in the internal cellular organization of the lens.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:18326727
    reference_title: "Resisting the effects of aging: a function for the fiber cell beaded filament."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In phakosin and filensin knockout mice, initial lens development and the early phases of fiber cell differentiation proceed in a manner largely indistinguishable from that of wild type."
    explanation: Early fiber cell differentiation is intact without CP49.
  - reference: PMID:18326727
    reference_title: "Resisting the effects of aging: a function for the fiber cell beaded filament."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Subsequent to those stages, however, fiber cells undergo loss of the differentiated fiber cell phenotype and loss of the long-range stacking that characterizes fiber cells and that has been considered essential for clarity."
    explanation: Later loss of fiber cell shape and stacking in the knockouts.
  - reference: PMID:12573667
    reference_title: "Knockout of the intermediate filament protein CP49 destabilises the lens fibre cell cytoskeleton and decreases lens optical quality, but does not induce cataract."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These changes were accompanied by dramatic changes in plasma membrane organisation of the fibre cells as revealed by detailed morphological examinations"
    explanation: Independent CP49 knockout with altered fiber cell membrane organization.
  - reference: PMID:21345981
    reference_title: "Intermediate filaments regulate tissue size and stiffness in the murine lens."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The absence of these filaments resulted in lenses that were smaller, and exhibited a higher ratio of lens:lens nucleus size."
    explanation: Congenic CP49 knockout lenses are smaller with altered nucleus proportion.
  - reference: PMID:19587458
    reference_title: "Functions of the intermediate filament cytoskeleton in the eye lens."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The Y-shaped cataract for the E233del mutation in BFSP2 (Figure 5) has its origins in changes to the internal cellular organization of the lens (Figure 1)."
    explanation: Review linking the human E233del sutural phenotype to altered lens cell organization.
  downstream:
  - target: Lens Light Scattering and Loss of Transparency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34087204
      reference_title: "Deletion of beaded filament proteins or the C-terminal end of Aquaporin 0 causes analogous abnormal distortion aberrations in mouse lens."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study reveals that loss of single or both beaded filament proteins significantly affect lens refractive index gradient, transparency and focusing ability in an age-dependent manner"
      explanation: CP49 knockout lenses lose transparency and focusing ability with age.
- name: Lens Light Scattering and Loss of Transparency
  biological_scale: TISSUE
  conforms_to: cataract_lens_opacification#Loss of Lens Refractive Transparency and Light Scattering
  description: >-
    CP49-null mouse lenses are clear at birth and develop slowly progressive
    light scattering and loss of optical quality; one knockout line was judged
    not to form a frank cataract. In patients this corresponds to congenital,
    juvenile or progressive lens opacity of variable morphology.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: maintenance of lens transparency
    term:
      id: GO:0036438
      label: maintenance of lens transparency
    modifier: DECREASED
  evidence:

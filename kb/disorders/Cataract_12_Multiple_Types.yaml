    snippet: "The progressive nature of the increased light scatter and cataract development for the mouse Bfsp1 and Bfsp2 knockouts (52, 74) and the human cataracts caused by BFSP1 (56) and BFSP2 (49, 53, 54) mutations suggest that there is an aging element to the beaded filament contribution to the optical properties of the lens."
    explanation: Review linking mouse knockout light scatter with the progressive human BFSP2 cataracts.

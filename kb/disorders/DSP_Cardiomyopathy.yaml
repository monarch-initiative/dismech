    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DSP cardiomyopathy is a distinct form of arrhythmogenic cardiomyopathy characterized by episodic myocardial injury, left ventricular fibrosis that precedes systolic dysfunction, and a high incidence of ventricular arrhythmias."
    explanation: The cohort-level summary names episodic myocardial injury as a defining feature of DSP cardiomyopathy.
  downstream:
  - target: Fibrofatty Myocardial Replacement
  - target: Myocarditis-like Hot Phases
    description: >-
      Myocyte injury and the inflammatory response it provokes present
      clinically as episodic myocarditis-like hot phases.
    evidence:
    - reference: PMID:32372669
      reference_title: "Desmoplakin Cardiomyopathy, a Fibrotic and Inflammatory Form of Cardiomyopathy Distinct From Typical Dilated or Arrhythmogenic Right Ventricular Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 4 DSP cases with 18F-fluorodeoxyglucose positron emission tomography scans, acute LV myocardial injury was associated with myocardial inflammation misdiagnosed initially as cardiac sarcoidosis or myocarditis."
      explanation: Links acute myocardial injury to myocardial inflammation that mimics myocarditis.
  - target: Episodic Chest Pain
    description: >-
      Each episode of acute myocardial injury presents with chest pain and
      troponin release despite normal coronary arteries.
    evidence:

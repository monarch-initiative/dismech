      reference_title: "Desmoplakin Cardiomyopathy, a Fibrotic and Inflammatory Form of Cardiomyopathy Distinct From Typical Dilated or Arrhythmogenic Right Ventricular Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Episodes of acute myocardial injury (chest pain with troponin elevation and normal coronary angiography) occurred in 15% of patients with DSP and were strongly associated with LV late gadolinium enhancement (90%)"
      explanation: Defines the injury episodes by chest pain with troponin elevation.

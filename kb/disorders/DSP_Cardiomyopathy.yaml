pathophysiology:
- name: Desmoplakin Haploinsufficiency — Desmosomal Disruption
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    Desmoplakin is the most abundant protein in desmosomes, linking the
    transmembranous desmosomal cadherins to the intermediate filament network.
    Heterozygous truncating variants in DSP lead to haploinsufficiency,
    weakening the desmosomal complex in cardiomyocytes. The left ventricle
    is frequently involved early, distinguishing DSP cardiomyopathy from
    classic right-dominant ARVC.
  genes:
  - preferred_term: DSP
    term:
      id: hgnc:3052
      label: DSP
  molecular_functions:
  - preferred_term: structural constituent of cytoskeleton
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
  biological_processes:
  - preferred_term: Desmosome organization
    term:
      id: GO:0002934
      label: desmosome organization
    modifier: DECREASED
  - preferred_term: Cell-cell junction assembly
    term:
      id: GO:0007043
      label: cell-cell junction assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:40600431
    reference_title: "Desmoplakin cardiomyopathy: recent updates in natural history and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiomyopathy caused by pathogenic variants in the desmoplakin
      gene has recently emerged as an entity distinct from other genetic
      cardiomyopathies.
    explanation: >-
      Recent review establishing DSP cardiomyopathy as a distinct entity.
  - reference: PMID:17372169
    reference_title: "Clinical and genetic characterization of families with arrhythmogenic right ventricular dysplasia/cardiomyopathy provides novel insights into patterns of disease expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognition of disease variants with early and/or predominant LV
      involvement supports adoption of the broader term arrhythmogenic
      cardiomyopathy.
    explanation: >-
      Key paper establishing left-dominant pattern in desmoplakin disease.
  - reference: PMID:17372169
    reference_title: "Clinical and genetic characterization of families with arrhythmogenic right ventricular dysplasia/cardiomyopathy provides novel insights into patterns of disease expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LV involvement in arrhythmogenic right ventricular
      dysplasia/cardiomyopathy may precede the onset of significant right
      ventricular dysfunction.
    explanation: >-
      Left ventricular involvement can precede right ventricular dysfunction,
      supporting the early and predominant LV involvement that distinguishes
      DSP cardiomyopathy from classic right-dominant ARVC.
  downstream:
  - target: Cardiomyocyte Detachment and Myocyte Death
  - target: Mild Cutaneous Findings
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      DSP desmosomal disruption can also manifest as variably present cutaneous
      findings in heterozygous carriers.
  - target: Curly Hair
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Desmoplakin is also a component of hair follicle and epidermal
      desmosomes; haploinsufficiency is associated with curly hair in a large
      fraction of carriers.
    evidence:
    - reference: PMID:32372669
      reference_title: "Desmoplakin Cardiomyopathy, a Fibrotic and Inflammatory Form of Cardiomyopathy Distinct From Typical Dilated or Arrhythmogenic Right Ventricular Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Curly hair and/or thick skin on the palms or soles (palmoplantar keratoderma) was commonly present in DSP patients (54/98, 55%) but not in PKP2 patients (1/46, 2%)."
      explanation: Reports curly hair and/or keratoderma in 55% of DSP carriers.
- name: Cardiomyocyte Detachment and Myocyte Death
  description: >-
    Desmosomal disruption impairs mechanical coupling between cardiomyocytes,
    leading to cell detachment and myocyte death under mechanical stress.
    This triggers an inflammatory response and progressive loss of functional
    myocardium.

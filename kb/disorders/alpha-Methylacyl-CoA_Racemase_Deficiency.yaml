genetic:
- name: AMACR
  notes: >-
    Encodes alpha-methylacyl-CoA racemase. Worth knowing when searching: this symbol is far
    more prominent in the prostate-cancer literature, where the protein is the P504S
    immunohistochemical marker, than in the peroxisomal-disease literature. That is a
    Named Entity Confusion hazard for anyone mining datasets or papers by gene symbol, and
    none of the evidence in this entry comes from that body of work.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: AMACR
    term:
      id: hgnc:451
      label: AMACR
  variants:
  - name: c.154T>C
    description: >-
      p.Ser52Pro. Recurrent: homozygous in three of the twelve cohort patients and present on
      one allele in two of the three compound heterozygotes. It is one of only two AMACR
      lesions that had been reported before this cohort, which is why it is the allele most
      often named in secondary sources - but the entry does not claim it is the commonest,
      since c.364C>T is homozygous in the same number of patients here.
    evidence:
    - reference: PMID:39313810
      reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "three patients were homozygous for the c.154T > C (p.Ser52Pro) variant"
      explanation: Names the variant and the number of homozygous carriers in the cohort.
    - reference: PMID:39313810
      reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Only the c.154T > C (p.Ser52Pro) variant and chromosome 5p13.3 deletion have been previously reported"
      explanation: >-
        Establishes that this allele is one of the two previously known lesions, which is what
        makes it prominent in secondary sources rather than more frequent.
  - name: c.364C>T
    description: >-
      p.His122Tyr. Equally recurrent - homozygous in three cohort patients, the same number as
      c.154T>C, and present on one allele of a compound heterozygote. Unlike c.154T>C it had
      not been reported before this cohort, so it is absent from the secondary sources that
      name Ser52Pro as the characteristic allele.
    evidence:
    - reference: PMID:39313810
      reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three patients were homozygous for the c.364 C > T (p.His122Tyr) variant"
      explanation: Names the variant and its homozygous carrier count.
    - reference: PMID:39313810
      reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Only the c.154T > C (p.Ser52Pro) variant and chromosome 5p13.3 deletion have been previously reported"
      explanation: >-
        Establishes by exclusion that c.364C>T was novel to this cohort, which is why it is
        under-represented in secondary descriptions of the allele spectrum.
  - name: 5p13.3 deletion
    description: >-
      A whole-gene lesion rather than a point variant: a chromosome 5p13.3 deletion spanning
      five genes including AMACR, homozygous in two siblings. A distinct mechanism class -
      the enzyme is absent rather than misfolded or catalytically dead - and it is the reason
      this entry leaves allele_type and zygosity unset on the pathophysiology node. The
      contiguous-gene span also means phenotype in these siblings cannot be attributed to
      AMACR alone; the index sibling came to attention through oculocutaneous albinism.
    evidence:
    - reference: PMID:39313810
      reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two siblings had a deletion of the AMACR gene due to chromosome 5p13.3 deletion and three patient had compound heterozygous variants"
      explanation: >-
        Names the deletion, its two carriers, and the compound heterozygotes - the sentence
        that establishes the cohort is not uniformly homozygous for point variants.
    - reference: PMID:39313810
      reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "a homozygous deletion of chromosome 5p13.3 encompassing five genes, including the AMACR gene"
      explanation: >-
        Establishes the contiguous-gene span. Graded PARTIAL for the variant claim because it
        describes the ascertainment of one sibling rather than the allele's frequency.

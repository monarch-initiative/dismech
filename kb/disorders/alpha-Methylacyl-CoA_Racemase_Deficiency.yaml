mappings:
  mondo_mappings:
  - term:
      id: MONDO:0008967
      label: congenital bile acid synthesis defect 4
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      Recorded as narrowMatch, not exactMatch. MONDO:0008967 names the disorder from its bile
      acid synthesis defect, and that concept is already curated in this KB as the `BASD Type
      4` subtype of `Inborn_Disorder_of_Bile_Acid_Synthesis`. This entry is broader: it covers
      the same enzyme defect but models both substrate streams, including the pristanic acid
      arm that produces the adult neurological disease and is not a bile acid phenotype at
      all. The two records are complementary rather than duplicative - the bile acid entry
      places the disorder among the bile acid synthesis defects, this one models the whole
      enzyme deficiency. "Congenital bile acid synthesis defect 4" is deliberately not listed
      under `synonyms:` for the same reason - a bare synonym asserts identity, which is exactly
      what narrowMatch declines to assert.

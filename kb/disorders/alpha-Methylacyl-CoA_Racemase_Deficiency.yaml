- name: Retinitis Pigmentosa
  category: Ophthalmologic
  description: >-
    Present in one of the two original adult patients, where it suggested Refsum disease -
    both disorders accumulate phytanic acid, so the retinopathy is a shared consequence rather
    than a coincidental overlap. The natural-history cohort found it in 5 of 9 adults at a
    median age of 45, and it is typically the *first* manifestation: the median delay from
    diagnosing retinitis pigmentosa to diagnosing AMACR deficiency was 24 years, with a range
    to 33. That number is the single most actionable fact in this entry - an unexplained adult
    retinitis pigmentosa is a reason to measure pristanic acid.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Pigmentary retinopathy
    term:
      id: HP:0000580
      label: Pigmentary retinopathy
  evidence:
  - reference: PMID:10655068
    reference_title: "Mutations in the gene encoding peroxisomal alpha-methylacyl-CoA racemase cause adult-onset sensory motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient also had pigmentary retinopathy, suggesting Refsum disease"
    explanation: Documents the retinopathy and the differential it prompted.
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency"

environmental:
- name: Dietary phytol and phytanic acid intake
  description: >-
    Pristanic acid derives from dietary phytol, largely via phytanic acid in dairy fat and
    ruminant meat, so the substrate driving the neurological arm of this disease is eaten
    rather than made. Dietary modification is recommended on that basis. The mouse model makes
    the dependence unusually explicit: Amacr-null mice are clinically normal on standard chow
    and die within 36 weeks on phytol-enriched chow, so in that model the genotype alone is
    not sufficient to produce disease.
  exposure_term:
    preferred_term: dietary intake of phytol and phytanic acid
  review_notes: >-
    ECTO was searched for phytol, phytanic acid and branched-chain fatty acid dietary exposure
    terms and has none. The nearest candidates (ECTO:2000068 exposure to dietary intervention,
    ECTO:2000116 exposure to dietary fat or oil intake avoidance) name a different thing -
    an intervention or an avoidance, not an intake of this substrate - so the exposure is left
    with a free-text preferred_term rather than bound to a term that would misstate it.
  influences_mechanisms:
  - target: Pristanic and Phytanic Acid Accumulation
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Dietary phytol is the source of the pristanic and phytanic acid that accumulate behind
      the enzymatic block, so intake sets the size of the accumulating pool.
    evidence:
    - reference: PMID:26248199
      reference_title: "Phytol is lethal for Amacr-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Pristanic and phytanic acids accumulated in livers of Amacr-/- mice after a phytol diet."
      explanation: Direct demonstration that dietary phytol drives accumulation of these metabolites when AMACR is absent.
  evidence:
  - reference: PMID:35428665
    reference_title: "Late onset AMACR deficiency with metabolic stroke-like episodes and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pristanic acid levels were highly elevated and dietary modification was recommended."
    explanation: Human clinical basis for treating dietary intake as a modifiable factor in this disease.
progression:
- phase: Childhood
  notes: >-
    Elevated liver transaminases as the single presenting sign, with no brain MRI
    abnormalities. Children may be entirely asymptomatic and found incidentally.
  evidence:
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three included children had elevated liver transaminases as single presenting sign and showed no brain MRI abnormalities."
    explanation: Defines the childhood phase and its restriction to the hepatic arm.
- phase: Adult neurological phase
  age_range: after age 40
  notes: >-
    Retinitis pigmentosa typically precedes everything else, by a median of 24 years. Then,
    after 40, neuropathy, ataxia and cognitive decline appear in previously cognitively normal
    adults, with a characteristic thalamic and brainstem MRI pattern. Median age at diagnosis
    in the cohort was 56.
  evidence:
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMACR deficiency can be considered as an adult slowly progressive disease with a predominant neurological phenotype."
    explanation: The cohort's overall characterisation of the disease course.
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe a cohort of 12 patients (9 adults and 3 children) with genetically confirmed AMACR deficiency (median age at diagnosis 56 years, range 3-69)"
    explanation: Gives the age at diagnosis, which is late and reflects the diagnostic delay.
diagnosis:
- name: Plasma Peroxisomal Metabolite Panel
  description: >-
    VLCFA, bile acid intermediates, phytanic and pristanic acid. The review's explicit
    recommendation is to run this panel in every child with persistently elevated liver
    enzymes - which is a low threshold, and deliberately so, because none of these analytes is
    on a routine metabolic screen and the disease is otherwise found only by sequencing.
  evidence:
  - reference: PMID:41766008
    reference_title: "Alpha-methylacyl-CoA racemase (AMACR) deficiency: report on novel patient and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend to perform serum/plasma peroxisomal metabolites, including VLCFA, bile acids intermediates and phitanic and pristanic acid, in every children with persistently elevated liver enzymes"
    explanation: >-
      The review's diagnostic recommendation, quoted verbatim including its typographical
      error in "phitanic", since the snippet must match the cached source exactly.
- name: Genome or Exome Sequencing
  description: >-
    In practice the diagnosis has repeatedly arrived by sequencing rather than by metabolic
    suspicion. In the oldest reported patient the diagnosis "remained elusive" through eight
    years of investigation, including a negative mitochondrial workup, until whole genome
    sequencing.
  evidence:
  - reference: PMID:35428665
    reference_title: "Late onset AMACR deficiency with metabolic stroke-like episodes and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis remained elusive until whole genome sequencing revealed AMACR deficiency."
    explanation: Documents sequencing as the step that actually produced the diagnosis after prolonged investigation.
treatments:
- name: Cholic Acid Replacement
  description: >-
    Bile acid replacement suppresses production of the toxic C27 intermediates and supplies
    the mature bile acid the pathway cannot make. The prospective trial including six AMACR
    patients gives an unusually clear age-split result: children tolerated it, allowing higher
    doses, and normalised their transaminases, whereas adults had more side effects - chiefly
    diarrhoea - and their transaminases had been normal throughout, so the authors concluded
    the balance shifts negatively in adults. Pristanic acid did not respond in either group.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholic acid
      term:
        id: CHEBI:16359
        label: cholic acid
  evidence:
  - reference: PMID:40643170
    reference_title: "Effectiveness and Safety of Personalized Cholic Acid Treatment in Patients With Bile Acid Synthesis Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children's transaminase levels normalized during treatment, while adults' levels remained normal throughout."
    explanation: The paediatric biochemical benefit that supports treatment in children.
  - reference: PMID:40643170
    reference_title: "Effectiveness and Safety of Personalized Cholic Acid Treatment in Patients With Bile Acid Synthesis Defects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In adults, however, the balance shifts negatively, with side effects outweighing the (biochemical) benefits."
    explanation: >-
      Graded PARTIAL because it supports the treatment for one population while explicitly
      arguing against it in another - the age split is the finding, not a caveat on it.
  notes: >-
    One adult developed hepatocellular carcinoma during the trial. On first drafting I recorded
    this as an unexplained adverse event; the 12-patient natural-history cohort makes clear it
    is better read as a disease risk - that cohort also reports an HCC, present at the time of
    diagnosis, and concludes patients need active monitoring for liver fibrosis, cirrhosis and
    hepatocellular carcinoma. It is kept here so a reader weighing the therapy sees it, but it
    belongs to the disease rather than to the drug.
- name: Dietary Phytol and Phytanic Acid Restriction
  description: >-
    Recommended on the basis of markedly elevated pristanic acid, and mechanistically
    supported by the mouse, where phytol intake is the difference between a normal animal and
    a lethal disease. No trial has tested it in patients, and pristanic acid did not fall on
    cholic acid, so this is the arm of the disease that bile acid replacement does not reach.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:35428665
    reference_title: "Late onset AMACR deficiency with metabolic stroke-like episodes and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pristanic acid levels were highly elevated and dietary modification was recommended."
    explanation: The clinical recommendation; note it is a recommendation, not a tested outcome.
animal_models:
- name: Amacr-null mouse on phytol-enriched diet
  species: Mouse
  genotype: Amacr homozygous null
  publication: PMID:26248199
  description: >-
    The unusual feature of this model is that the genotype alone is not a disease. Amacr-null
    mice are clinically symptomless on standard laboratory chow; the phenotype has to be
    provoked with dietary phytol, after which all null animals died within 36 weeks while
    wild-types survived. It is therefore a model of the gene-environment interaction rather
    than of the gene, and it is the cleanest available demonstration that the substrate load
    driving this disease is dietary.
  modeled_mechanisms:
  - target: Pristanic and Phytanic Acid Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Pristanic and phytanic acid accumulate in Amacr-null mouse liver on a phytol diet,
      reproducing the human metabolite profile.
    limitations: >-
      Accumulation requires dietary provocation. On standard chow the null mouse does not
      accumulate enough to be ill, whereas patients on an ordinary human diet do - so the
      quantitative relationship between intake and accumulation differs between species even
      though the qualitative mechanism transfers.
    readouts:
    - name: Hepatic pristanic and phytanic acid content
      target: Pristanic and Phytanic Acid Accumulation
      direction: INCREASED
      interpretation: Direct biochemical correlate of the accumulation node in this model.
      evidence:
      - reference: PMID:26248199
        reference_title: "Phytol is lethal for Amacr-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Pristanic and phytanic acids accumulated in livers of Amacr-/- mice after a phytol diet."
        explanation: Reports the metabolite measurement behind this readout.
    evidence:
    - reference: PMID:26248199
      reference_title: "Phytol is lethal for Amacr-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All Amacr-/- mice died within 36weeks on a phytol diet, while wild-type mice survived."
      explanation: >-
        Establishes that the model is informative for this node, and that the effect is
        genotype-dependent rather than a diet effect.
  - target: Hepatic Injury and Cholestasis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Phytol-fed Amacr-null mice develop liver failure as the main cause of death, with
      inflammation, fibrosis, necrosis, Kupffer cell proliferation and fatty change on
      histology, plus confirmatory serum changes.
    limitations: >-
      The mouse liver phenotype is fulminant and fatal within 36 weeks under dietary
      provocation; the human childhood phenotype is usually raised transaminases in a child
      who may be otherwise asymptomatic. Severity and tempo differ substantially even though
      the target organ agrees.
    readouts:
    - name: Hepatic histology
      target: Hepatic Injury and Cholestasis
      direction: ALTERED
      interpretation: Structural correlate of the hepatic node in this model.
      evidence:
      - reference: PMID:26248199
        reference_title: "Phytol is lethal for Amacr-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histological analysis of liver showed inflammation, fibrotic and necrotic changes, Kupffer cell proliferation and fatty changes in hepatocytes, and serum analysis confirmed the hepatic disease."
        explanation: Reports the histological findings behind this readout.
    evidence:
    - reference: PMID:26248199
      reference_title: "Phytol is lethal for Amacr-deficient mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Liver failure was the main cause of death accompanied by kidney and brain abnormalities."
      explanation: >-
        Supports the model as informative for hepatic involvement while showing a severity that
        the human childhood phenotype does not match.
  - target: Sensorimotor Peripheral Neuropathy
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The defining human adult phenotype is a sensorimotor neuropathy. The phytol-fed
      Amacr-null mouse dies of liver failure; the reported extrahepatic findings are kidney and
      brain abnormalities, and no peripheral neuropathy is described. The model does not
      reproduce the phenotype the disease was originally defined by.
    limitations: >-
      Because the mouse dies of hepatic failure within 36 weeks of provocation, it may simply
      not survive long enough for a chronic neuropathy to develop - so this is a failure to
      demonstrate the phenotype under the only conditions that make the mouse ill, not proof
      that murine nerve is spared. Either way, this model cannot currently be used to study the
      neuropathy or to test interventions against it.
    evidence:
    - reference: PMID:26248199
      reference_title: "Phytol is lethal for Amacr-deficient mice."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Liver failure was the main cause of death accompanied by kidney and brain abnormalities."
      explanation: >-
        Refutes the proposition that this model is informative for the neuropathy node: the
        reported phenotype is hepatic, renal and cerebral, with the peripheral nerve
        involvement that defines the human adult disease absent from the account.
discussions:
- discussion_id: amacr_dietary_load_vs_genotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is the Amacr-null mouse healthy on a normal diet when patients on an ordinary human
    diet develop progressive disease, and does that difference mean dietary restriction should
    be expected to work in patients?
  attaches_to:
  - pathophysiology#Pristanic and Phytanic Acid Accumulation
  - environmental#Dietary phytol and phytanic acid intake
  - treatments#Dietary Phytol and Phytanic Acid Restriction
  rationale: >-
    The mouse and the human disagree on whether the genotype alone is sufficient. Amacr-null
    mice are clinically symptomless on standard chow and need phytol provocation to become
    ill; patients eating an ordinary diet accumulate pristanic acid and develop neuropathy,
    hepatic disease or encephalopathy without any special exposure.

    The obvious reading is a dose difference - laboratory chow is low in phytol relative to a
    human diet containing dairy fat and ruminant meat - and if that reading is right, dietary
    restriction should be able to move patients toward the healthy end of the same curve. That
    is the reasoning behind recommending dietary modification, and it is currently an inference
    from the mouse rather than a tested result in patients.

    But the alternative readings have not been excluded: mice may handle branched-chain fatty
    acids through routes humans lack, or the human disease may depend on a lifetime of
    accumulation that a 36-week mouse experiment cannot represent. The cholic acid trial is a
    relevant negative here - pristanic acid fluctuated and stayed elevated under a treatment
    that corrected the bile acid arm, showing that this arm is not incidentally controlled by
    treating the other one.

    This is recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because evidence exists
    in both species and they diverge on the sufficiency of the genotype; the open question is
    what that divergence means for humans.
  proposed_experiments:
  - experiment_id: exp_amacr_dietary_restriction_trial
    name: Prospective dietary phytanic acid restriction with pristanic acid monitoring
    description: >-
      Measure plasma pristanic acid and clinical neurological status in AMACR-deficient
      patients before and during a defined phytanic acid restricted diet, of the kind already
      used in Refsum disease, to test directly whether the mouse's dose-dependence holds in
      humans.
    would_support:

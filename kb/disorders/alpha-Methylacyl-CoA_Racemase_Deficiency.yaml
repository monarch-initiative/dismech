inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic AMACR variants. The original report identified two different disease-causing
    mutations across three patients, with functional confirmation by expression in E. coli.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10655068
    reference_title: "Mutations in the gene encoding peroxisomal alpha-methylacyl-CoA racemase cause adult-onset sensory motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of AMACR cDNA from the patients identified two different mutations that are likely to cause disease, based on analysis in Escherichia coli."
    explanation: Original identification of the causal mutations, with heterologous expression as functional support.
  - reference: PMID:41766008
    reference_title: "Alpha-methylacyl-CoA racemase (AMACR) deficiency: report on novel patient and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alpha-methylacyl-CoA racemase (AMACR) deficiency is an autosomal recessive disorder of peroxisomal β-oxidation of branched-chain fatty acids and C27-bile acids."
    explanation: Recent review confirming the inheritance mode and the two substrate classes.
pathophysiology:
- name: AMACR Racemase Loss of Function
  description: >-
    Biallelic AMACR variants abolish alpha-methylacyl-CoA racemase activity. The enzyme
    interconverts the (R)- and (S)-stereoisomers at the 2-methyl (or 25-methyl) position of
    branched-chain acyl-CoA esters. Peroxisomal beta-oxidation is stereospecific and accepts
    only the (S)-form, so the racemase is an obligatory gate rather than an accessory step -
    which is why a single enzyme loss blocks two unrelated substrate streams.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Biallelic, but not uniformly homozygous point variants: of the 12 cohort patients,
      three were compound heterozygous and two siblings carried a whole-gene deletion from a
      5p13.3 chromosomal deletion. ZygosityEnum is single-valued and has no "biallelic"
      member, and allele_type: VARIANT would not describe the deletion patients, so both
      slots are deliberately left unset rather than narrowed to the majority case.
  genes:
  - preferred_term: AMACR
    term:
      id: hgnc:451
      label: AMACR
  molecular_functions:
  - preferred_term: alpha-methylacyl-CoA racemase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008111
      label: alpha-methylacyl-CoA racemase activity
  locations:
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  downstream:
  - target: Blocked Peroxisomal Beta-Oxidation of Branched-Chain Substrates
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10655068
    reference_title: "Mutations in the gene encoding peroxisomal alpha-methylacyl-CoA racemase cause adult-onset sensory motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This enzyme is responsible for the conversion of pristanoyl-CoA and C27-bile acyl-CoAs to their (S)-stereoisomers, which are the only stereoisomers that can be degraded via peroxisomal beta-oxidation."
    explanation: >-
      States the enzymatic function and, critically, the stereospecificity of the downstream
      pathway - the reason loss of a racemase is a hard block rather than a slowdown.
- name: Blocked Peroxisomal Beta-Oxidation of Branched-Chain Substrates
  description: >-
    With no (S)-stereoisomer available, peroxisomal beta-oxidation of 2-methyl-branched
    substrates stops. The block is upstream of two independent downstream streams that share
    nothing but this enzyme.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    modifier: DECREASED
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  downstream:
  - target: Pristanic and Phytanic Acid Accumulation
    causal_link_type: DIRECT
  - target: C27-Bile Acid Intermediate Accumulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26248199
    reference_title: "Phytol is lethal for Amacr-deficient mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "α-Methylacyl-CoA racemase (Amacr) catalyzes the racemization of the 25-methyl group in C27-intermediates in bile acid synthesis and in methyl-branched fatty acids such as pristanic acid, a metabolite derived from phytol."
    explanation: >-
      States both substrate streams explicitly. Graded OTHER because this is the paper's
      background statement of enzymology rather than a result of its mouse experiments.
- name: Pristanic and Phytanic Acid Accumulation
  description: >-
    Pristanic acid accumulates, with phytanic acid alongside it. Both derive from dietary
    phytol, so this arm of the disease is the one with an exogenous input - which is what makes
    dietary restriction plausible as therapy and what the mouse model demonstrates most
    sharply.
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: pristanic acid
    term:
      id: CHEBI:51340
      label: pristanic acid
  - preferred_term: phytanic acid
    term:
      id: CHEBI:16285
      label: phytanic acid
  downstream:
  - target: Peripheral Nerve Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Relapsing Encephalopathy and Stroke-Like Episodes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinal Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:10655068
    reference_title: "Mutations in the gene encoding peroxisomal alpha-methylacyl-CoA racemase cause adult-onset sensory motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here three patients with elevated plasma concentrations of pristanic acid (a branched-chain fatty acid) and C27-bile-acid intermediates."
    explanation: Establishes the accumulating metabolites in the original patients.
  - reference: PMID:26248199
    reference_title: "Phytol is lethal for Amacr-deficient mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "patients with Amacr deficiency accumulate C27-bile acid intermediates, pristanic and phytanic acid and display sensorimotor neuropathy, seizures and relapsing encephalopathy"
    explanation: Links the accumulating metabolites to the neurological phenotype.
- name: C27-Bile Acid Intermediate Accumulation
  description: >-
    DHCA and THCA, the C27 precursors of the mature C24 bile acids, cannot be shortened and
    accumulate, along with a C29-dicarboxylic acid. The accumulating intermediates are
    hepatotoxic and mature bile acid synthesis is deficient, which is the basis both for the
    liver phenotype and for treating with cholic acid.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: bile acid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006699
      label: bile acid biosynthetic process
  downstream:
  - target: Hepatic Injury and Cholestasis
    causal_link_type: DIRECT
  - target: phenotypes#Gallstones
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Deficient mature C24 bile acid synthesis alters biliary composition, which is the
      established route to gallstone formation. The intermediate step is known in general bile
      acid physiology but has not been measured in AMACR deficiency specifically.
  evidence:
  - reference: PMID:40643170
    reference_title: "Effectiveness and Safety of Personalized Cholic Acid Treatment in Patients With Bile Acid Synthesis Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated C27-bile acid intermediates, C29-dicarboxylic acid, and pristanic acid were observed in all AMACR patients."
    explanation: >-
      Documents the accumulating species in every AMACR patient in a prospective treatment
      cohort, including the C29-dicarboxylic acid.
- name: Retinal Photoreceptor Degeneration
  description: >-
    The retinal arm, which the natural-history cohort makes the leading adult presentation:
    retinitis pigmentosa in 5 of 9 adults, at a median age of 45, typically decades before the
    neurological features. Modelled downstream of the phytanic/pristanic accumulation because
    the same accumulation causes retinopathy in Refsum disease - but the mechanism has not
    been demonstrated in AMACR deficiency specifically, hence the unknown intermediates.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  downstream:
  - target: phenotypes#Retinitis Pigmentosa
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 5/9 adult patients, retinitis pigmentosa was detected at a median age of 45 years (range 30-61)."
    explanation: Establishes the retinal lesion and its frequency in the adult cohort.
  - reference: PMID:10655068
    reference_title: "Mutations in the gene encoding peroxisomal alpha-methylacyl-CoA racemase cause adult-onset sensory motor neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient also had pigmentary retinopathy, suggesting Refsum disease"
    explanation: >-
      Graded PARTIAL: it evidences the retinopathy and the Refsum parallel that motivates
      placing this node downstream of phytanic acid accumulation, without demonstrating the
      mechanism in AMACR deficiency.
- name: Progressive Liver Fibrosis and Cirrhosis
  description: >-
    Chronic hepatic injury progressing to fibrosis and cirrhosis, and the substrate on which
    hepatocellular carcinoma arises. The cohort authors treat this as a surveillance
    obligation rather than an incidental association, which is why it is modelled as its own
    node rather than folded into the acute hepatic injury above it.
  biological_scale: TISSUE
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: phenotypes#Hepatic Fibrosis
    causal_link_type: DIRECT
  - target: phenotypes#Hepatocellular Carcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is a risk of liver fibrosis/cirrhosis and hepatocellular carcinoma in these patients, requiring active monitoring"
    explanation: >-
      Establishes the fibrosis-cirrhosis-HCC sequence and the surveillance conclusion drawn
      from it.
- name: Hepatic Injury and Cholestasis
  description: >-
    The childhood presentation. Persistently elevated liver enzymes, with or without
    cholestatic jaundice, and coagulopathy - which in a child is the combination the review
    argues should trigger measurement of peroxisomal metabolites. Some children are otherwise
    entirely asymptomatic and come to attention only through incidental blood tests.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Progressive Liver Fibrosis and Cirrhosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: phenotypes#Elevated Hepatic Transaminases
    causal_link_type: DIRECT
  - target: phenotypes#Cholestatic Jaundice
    causal_link_type: DIRECT
  - target: phenotypes#Coagulopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:41766008
    reference_title: "Alpha-methylacyl-CoA racemase (AMACR) deficiency: report on novel patient and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since its first report in 2000, several children were diagnosed via molecular analyses, mostly due to elevated liver enzymes."
    explanation: Establishes raised liver enzymes as the usual route to diagnosis in childhood.
- name: Peripheral Nerve Axonal Degeneration
  description: >-
    The tissue-level lesion behind the classic adult presentation. It is a diagnostic mimic:
    of the first two adult patients, one had pigmentary retinopathy suggesting Refsum disease
    and the other upper motor neuron signs suggesting adrenomyeloneuropathy - and both of
    those differentials are themselves disorders of branched-chain fatty acid handling, so the
    confusion is mechanistically principled rather than superficial.
  biological_scale: TISSUE
  downstream:
  - target: phenotypes#Sensorimotor Peripheral Neuropathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10655068
    reference_title: "Mutations in the gene encoding peroxisomal alpha-methylacyl-CoA racemase cause adult-onset sensory motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the patients suffered from adult-onset sensory motor neuropathy. One patient also had pigmentary retinopathy, suggesting Refsum disease, whereas the other patient had upper motor neuron signs in the legs, suggesting adrenomyeloneuropathy."
    explanation: The original clinical description, including both mimicked diagnoses.
- name: Relapsing Encephalopathy and Stroke-Like Episodes
  downstream:
  - target: phenotypes#Seizure
    causal_link_type: DIRECT
  - target: phenotypes#Ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: phenotypes#Cognitive Decline
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: phenotypes#Thalamic and Brainstem MRI Abnormality
    causal_link_type: DIRECT
  description: >-
    Episodic neurological decompensation - dysphasia, headache, sensory disturbance - that
    resembles neither migraine nor epilepsy nor TIA, and which in the oldest reported patient
    was investigated for mitochondrial disease for eight years before whole genome sequencing
    gave the answer. Escalation to febrile encephalopathy with coma is described.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:35428665
    reference_title: "Late onset AMACR deficiency with metabolic stroke-like episodes and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A female in her seventh decade presented with episodes of dysphasia, headache and sensory disturbance inconsistent with migraine, epilepsy or transient ischaemic attack."
    explanation: Describes the stroke-like episodes and the differentials they defeat.
  - reference: PMID:35428665
    reference_title: "Late onset AMACR deficiency with metabolic stroke-like episodes and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After eight years of symptoms, she developed a febrile encephalopathy with hemispheric dysfunction, focal convulsive seizures and coma."
    explanation: Documents the severe end of the episodic phenotype and the length of the diagnostic delay.
phenotypes:
- name: Elevated Hepatic Transaminases
  category: Hepatic
  description: >-
    Persistently raised liver enzymes, the commonest route to diagnosis in childhood and
    sometimes the only abnormality.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Elevated circulating hepatic transaminase concentration
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:41766008
    reference_title: "Alpha-methylacyl-CoA racemase (AMACR) deficiency: report on novel patient and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "several children were diagnosed via molecular analyses, mostly due to elevated liver enzymes"
    explanation: Names raised liver enzymes as the predominant presenting abnormality in childhood.
- name: Cholestatic Jaundice
  category: Hepatic
  description: >-
    Cholestatic jaundice in the childhood presentation. Explicitly qualified as "with or
    without" in the review's diagnostic recommendation, so it is not obligate.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Cholestasis
    term:
      id: HP:0001396
      label: Cholestasis
  evidence:
  - reference: PMID:41766008
    reference_title: "Alpha-methylacyl-CoA racemase (AMACR) deficiency: report on novel patient and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in every children with persistently elevated liver enzymes, especially with coagulopathy and with or without cholestatic jaundice"
    explanation: >-
      Names cholestatic jaundice in the presenting picture while marking it optional, which is
      why the frequency is OCCASIONAL rather than FREQUENT.
- name: Coagulopathy
  category: Hematologic
  description: >-
    Coagulopathy, reflecting impaired fat-soluble vitamin K absorption from deficient mature
    bile acid synthesis. Singled out by the review as the feature that should raise suspicion
    alongside raised transaminases.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Coagulopathy
    term:
      id: HP:0003256
      label: Abnormality of the coagulation cascade
  evidence:
  - reference: PMID:41766008
    reference_title: "Alpha-methylacyl-CoA racemase (AMACR) deficiency: report on novel patient and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "especially with coagulopathy and with or without cholestatic jaundice"
    explanation: Names coagulopathy as a suspicion-raising feature of the childhood presentation.
- name: Hepatic Fibrosis
  category: Hepatobiliary
  description: >-
    Liver fibrosis in 1 of 12 cohort patients, under a surveillance programme in which all
    patients had regular abdominal ultrasound and most had FibroScan - so this is a screened
    rate rather than a clinically apparent one. None of the three children showed fibrosis,
    consistent with it being a consequence of chronic rather than acute hepatic injury.
    Cirrhosis is modelled at the mechanism node but is deliberately not curated as a phenotype:
    the cohort reports the fibrosis-cirrhosis-HCC risk as a surveillance rationale, and no
    cohort patient is reported as cirrhotic.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Hepatic fibrosis
    term:
      id: HP:0001395
      label: Hepatic fibrosis
  evidence:
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient was diagnosed with liver fibrosis (patient 3), while all patients underwent regular abdominal ultrasounds and in most cases FibroScan"
    explanation: >-
      Gives both the count and the ascertainment method, which is what makes 1/12 a screened
      rate rather than a clinical one.
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "none of them had a history of cholestasis or showed any signs of clinically evident liver disease or fibrosis"
    explanation: >-
      The paediatric negative. Records that the three children were fibrosis-free despite
      elevated transaminases, which is the age dependence this phenotype's description states.
- name: Gallstones
  category: Hepatobiliary
  description: >-
    Cholelithiasis in 2 of 12 patients, both requiring cholecystectomy - at around age 40 and,
    strikingly, age 15. Expected given deficient mature bile acid synthesis, and worth
    modelling because juvenile cholelithiasis is an unusual enough finding to be a diagnostic
    prompt on its own.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Cholelithiasis
    term:
      id: HP:0001081
      label: Cholelithiasis
  evidence:
  - reference: PMID:39313810
    reference_title: "Redefining the phenotype of alpha-methylacyl-CoA racemase (AMACR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients had a history of cholecystectomy due to gallstones (patient 4 and 6, respectively around age 40 and 15 years)."
    explanation: Gives the count and both ages, including the juvenile case.
- name: Glucosuria
  category: Renal
  description: >-
    Glucosuria, reported as an incidental finding alongside elevated liver enzymes in an
    otherwise asymptomatic child. A single case, and recorded as such - it is not established
    as a feature of the disorder, but it is part of how the mildest presentations come to
    attention.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Glycosuria
    term:
      id: HP:0003076
      label: Glycosuria
  evidence:
  - reference: PMID:41766008
    reference_title: "Alpha-methylacyl-CoA racemase (AMACR) deficiency: report on novel patient and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present an early-onset form of AMACR deficiency in clinically asymptomatic child who was diagnosed upon incidental findings of elevated liver enzymes and glucosuria."
    explanation: >-
      Graded PARTIAL: a single incidental observation in one child, reported as expanding the
      biochemical spectrum rather than as an established feature.
- name: Sensorimotor Peripheral Neuropathy
  category: Neurologic
  description: The defining adult phenotype, adult-onset and sensorimotor.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830

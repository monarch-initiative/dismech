name: Alpha-Methylacyl-CoA Racemase Deficiency
category: Mendelian
creation_date: "2026-08-28T11:45:00Z"
synonyms:
- AMACR deficiency
- Alpha-methylacyl-CoA racemase deficiency
- AMACRD
- Racemase deficiency
description: >-
  Alpha-methylacyl-CoA racemase deficiency is an autosomal recessive peroxisomal disorder
  caused by biallelic AMACR variants. AMACR does one thing: it converts the (R)-stereoisomers
  of 2-methyl-branched acyl-CoAs to the (S)-form. That matters because (S) is the only
  stereoisomer peroxisomal beta-oxidation can degrade, so losing the racemase blocks the
  breakdown of two chemically unrelated substrate classes at once - pristanoyl-CoA, from the
  dietary phytol/phytanic acid pathway, and the C27-bile acid intermediates DHCA and THCA.

  One enzyme, two substrate streams, and the entry is organised around that split because the
  clinical presentations follow it. The bile-acid stream gives the childhood picture: raised
  liver enzymes, sometimes cholestatic jaundice and coagulopathy, in children who may be
  otherwise asymptomatic and found incidentally. The pristanic-acid stream gives the adult
  picture: sensorimotor neuropathy, seizures, relapsing encephalopathy and stroke-like
  episodes, with onset reported as late as the seventh decade. These are the same disease and
  the same enzyme, not two disorders, which is why they are curated as one entry.

  Two things make this disease easy to miss. It is a mimic - of the two adult patients in the
  original report, one was suspected of Refsum disease and the other of adrenomyeloneuropathy,
  while the third patient was a child without neuropathy - and the biochemical markers are not
  on a standard metabolic panel, so the diagnosis has repeatedly come from
  genome sequencing after years of investigation. Fewer than about twenty cases were described
  in the first two decades after the 2000 report.

  A caution on searching this gene: AMACR is far better known as a prostate-cancer
  immunohistochemistry marker (P504S) than as a disease gene, so a literature or dataset
  search on the symbol returns mostly oncology. That is the Named Entity Confusion hazard for
  this entry, and nothing in it is sourced from that literature.

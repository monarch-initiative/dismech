    explanation: The ClinicalTrials.gov record establishes the intervention, genetically activated APDS population, and lymphadenopathy target.
  - reference: PMID:36399712
    reference_title: "A randomized, placebo-controlled phase 3 trial of the PI3Kδ inhibitor leniolisib for activated PI3Kδ syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, 31 patients with APDS aged ≥12 years were enrolled in a global, phase 3, triple-blinded trial and randomized 2:1 to receive 70 mg leniolisib or placebo twice daily for 12 weeks."
    explanation: The peer-reviewed pivotal trial confirms phase 3 design, enrollment, dose, and treatment duration.
- name: NCT05438407
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Active, non-recruiting open-label phase 3 pediatric leniolisib study in
    patients aged four to 11 years, followed by a long-term extension; status
    recorded from ClinicalTrials.gov on 2026-07-19.
  evidence:
  - reference: clinicaltrials:NCT05438407
    reference_title: "An Open-label, Single Arm Study of the Safety, Pharmacokinetics, Pharmacodynamics, and Efficacy of Leniolisib in Pediatric Patients Aged 4 to 11 Years With Activated Phosphoinositide 3-Kinase Delta Syndrome Followed by an Open-label Long-term Extension"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a 2-part, prospective, open-label, single arm, multicenter study to evaluate the safety, tolerability, pharmacokinetics (PK), pharmacodynamics (PDx), and efficacy of leniolisib in at least 15 pediatric patients (aged 4 to 11 years) with activated phosphoinositide 3-kinase delta (PI3Kδ) syndrome (APDS)."
    explanation: The registry record establishes the pediatric age range, intervention, design, and outcome domains.
- name: NCT05693129
  phase: PHASE_III

  notes: >-
    Heterozygous variants in the p85alpha regulatory subunit cause APDS2 by
    relieving normal inhibition of PI3Kdelta. Exon 11 splice-site mutations
    leading to p.434-475 deletion are the major recurrent APDS2 lesions.
  evidence:
  - reference: PMID:31111319
    reference_title: "Clinical, Immunological, and Genetic Features in Patients with Activated PI3Kδ Syndrome (APDS): a Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Activated phosphoinositide 3-kinase delta syndrome (APDS) is a novel primary immunodeficiency (PID) caused by heterozygous gain of function mutations in PI3Kδ catalytic p110δ (PIK3CD) or regulatory p85α (PIK3R1) subunits leading to APDS1 and APDS2, respectively."
    explanation: Systematic review identifies PIK3R1 as the causative gene for APDS2.
  - reference: PMID:31111319
    reference_title: "Clinical, Immunological, and Genetic Features in Patients with Activated PI3Kδ Syndrome (APDS): a Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The c.3061 G>A (p. E1021K) mutation in APDS1 with 85% frequency and c.1425+1 G> (A, C, T) (p.434-475del) mutation in APDS2 with 79% frequency were hotspot mutations."
    explanation: Defines the dominant recurrent APDS2 splice hotspot.
treatments:
- name: Immunoglobulin replacement therapy
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Intravenous or subcutaneous immunoglobulin replacement is commonly used as
    supportive therapy for antibody deficiency and prevention of recurrent
    bacterial infections.
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:31111319
    reference_title: "Clinical, Immunological, and Genetic Features in Patients with Activated PI3Kδ Syndrome (APDS): a Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The majority of APDS patients were placed on long-term immunoglobulin replacement therapy."
    explanation: Systematic review supports immunoglobulin replacement as standard-of-care supportive treatment.
- name: Sirolimus
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    mTOR inhibition with sirolimus is an off-label pathway-directed option for
    lymphoproliferation or organomegaly when leniolisib is unavailable. Registry
    responses were strongest for lymphoproliferation and less consistent for
    bowel inflammation and cytopenias. Headache, anorexia, renal toxicity,
    aphthous ulcers, and liver toxicity led to treatment interruption in some
    registry participants.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_phenotypes:
  - preferred_term: lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  target_mechanisms:
  - target: PI3K-delta pathway hyperactivation
    treatment_effect: INHIBITS
    description: Sirolimus inhibits the downstream mTOR arm of the hyperactive PI3K-delta-AKT-mTOR pathway.
    evidence:
    - reference: PMID:38148368
      reference_title: "Modulating the PI3K Signalling Pathway in Activated PI3K Delta Syndrome: a Clinical Perspective."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The mTOR inhibitor sirolimus has been used effectively for some clinical manifestations of this condition, however the arrival of specific PI3Kδ inhibitor leniolisib has shown promising early results and may provide a more targeted approach."
      explanation: The review explicitly identifies sirolimus as an mTOR inhibitor used in APDS.
  evidence:
  - reference: PMID:29599784
    reference_title: "Disease Evolution and Response to Rapamycin in Activated Phosphoinositide 3-Kinase δ Syndrome: The European Society for Immunodeficiencies-Activated Phosphoinositide 3-Kinase δ Syndrome Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphoproliferation showed the best response (8 complete, 11 partial, 6 no remission), while bowel inflammation (3 complete, 3 partial, 9 no remission) and cytopenia (3 complete, 2 partial, 9 no remission) responded less well."
    explanation: Registry outcomes define the main clinical benefit and the limitations of rapamycin treatment.
  - reference: PMID:38148368
    reference_title: "Modulating the PI3K Signalling Pathway in Activated PI3K Delta Syndrome: a Clinical Perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mTOR inhibitor sirolimus has been used effectively for some clinical manifestations of this condition, however the arrival of specific PI3Kδ inhibitor leniolisib has shown promising early results and may provide a more targeted approach."
    explanation: Review supports sirolimus as an established pathway-directed treatment for selected APDS manifestations.
  - reference: PMID:29599784
    reference_title: "Disease Evolution and Response to Rapamycin in Activated Phosphoinositide 3-Kinase δ Syndrome: The European Society for Immunodeficiencies-Activated Phosphoinositide 3-Kinase δ Syndrome Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients (No. 7, 13) suffered from side effects (severe headaches, anorexia, renal toxicity) that led to the complete interruption of the treatment, whereas in three cases, the therapy was paused because of side effects (aphthous ulcers, liver toxicity, renal toxicity) but could be started again."
    explanation: Registry treatment data document clinically meaningful sirolimus toxicity and treatment interruption.
- name: Leniolisib
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Selective oral PI3Kdelta inhibition directly targets the causal signaling
    lesion in APDS and is recommended as first-line therapy for significant
    lymphoproliferative disease. The current U.S. label indicates Joenja for
    adults and pediatric patients 12 years and older; 70 mg twice daily is the
    recommended dose for patients weighing at least 45 kg, with no recommended
    dose below 45 kg. The current label warns of postmarketing hypersensitivity,
    including anaphylaxis. In the pivotal 12-week phase 3 trial, both lymph-node
    size and naive-B-cell coprimary outcomes improved versus placebo.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: leniolisib
      term:
        id: CHEBI:229649
        label: leniolisib
  target_phenotypes:
  - preferred_term: lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  target_mechanisms:
  - target: PI3K-delta pathway hyperactivation
    treatment_effect: INHIBITS
    description: Leniolisib selectively inhibits the causal hyperactive PI3K-delta signaling node.
    evidence:
    - reference: PMID:36399712
      reference_title: "A randomized, placebo-controlled phase 3 trial of the PI3Kδ inhibitor leniolisib for activated PI3Kδ syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hyperactive PI3Kδ signaling causes APDS and is selectively targeted with leniolisib, an oral, small molecule inhibitor of PI3Kδ."
      explanation: The pivotal trial directly states the drug-target relationship.
  evidence:
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/217759s005lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/217759s005lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "JOENJA is a kinase inhibitor indicated for the treatment of activated phosphoinositide 3-kinase delta (PI3Kδ) syndrome (APDS) in adult and pediatric patients 12 years of age and older."
    explanation: The May 2025 U.S. prescribing information establishes the current labeled APDS indication and age threshold.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/217759s005lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/217759s005lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The recommended dosage of JOENJA in adult and pediatric patients 12 years of age and older weighing 45 kg or greater is 70 mg administered orally twice daily approximately 12 hours apart, with or without food. There is no recommended dosage for patients weighing less than 45 kg."
    explanation: The current label supplies the weight-qualified dosing recommendation and explicitly states the lack of a recommended dose below 45 kg.
  - reference: PMID:39899769
    reference_title: "Activated PI3K Delta Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Leniolisib, a selective PI3K delta (PI3Kδ) inhibitor, has shown promise in clinical trials by directly targeting the overactive PI3Kδ signaling pathway, a hallmark of the condition, and is therefore recommended as a first-line treatment of significant lymphoproliferative disease, including lymphadenopathy and splenomegaly."
    explanation: Current GeneReviews recommends leniolisib as first-line treatment for significant lymphoproliferation.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/217759s005lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/217759s005lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypersensitivity reaction(s), including anaphylaxis, have been reported in postmarketing setting. If a clinically significant hypersensitivity reaction occurs, discontinue JOENJA and institute appropriate therapy [see Adverse Reactions (6.2)]."
    explanation: The May 2025 prescribing information adds the postmarketing hypersensitivity and anaphylaxis warning.
  - reference: PMID:36399712
    reference_title: "A randomized, placebo-controlled phase 3 trial of the PI3Kδ inhibitor leniolisib for activated PI3Kδ syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, leniolisib was well tolerated and significant improvement over placebo was notable in the coprimary endpoints, reducing lymphadenopathy and increasing the percentage of naïve B cells, reflecting a favorable impact on the immune dysregulation and deficiency seen in patients with APDS."
    explanation: Randomized phase 3 evidence demonstrates improvement in both coprimary outcomes and acceptable short-term tolerability.
  - reference: PMID:28972011
    reference_title: "Effective \"activated PI3Kδ syndrome\"-targeted therapy with the PI3Kδ inhibitor leniolisib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 12 weeks of treatment, all patients showed amelioration of lymphoproliferation with lymph node sizes and spleen volumes reduced by 39% (mean; range, 26%-57%) and 40% (mean; range, 13%-65%), respectively."
    explanation: Early interventional study shows direct clinical improvement in APDS lymphoproliferation with leniolisib.
  - reference: PMID:39561927
    reference_title: "A randomised, placebo-controlled, phase III trial of leniolisib in activated phosphoinositide 3-kinase delta (PI3Kδ) syndrome (APDS): Adolescent and adult subgroup analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a 12-week phase III randomised placebo-controlled trial, leniolisib, a selective PI3Kδ inhibitor, was well-tolerated and met both co-primary endpoints (change from Baseline in log10-transformed sum of product of diameters of index lymph nodes and percentage of naïve/total B cells at Day 85)."
    explanation: Phase III trial evidence confirms leniolisib efficacy on both lymphadenopathy and naive-B-cell restoration.
- name: Hematopoietic stem cell transplantation
  action_category: THERAPEUTIC
  therapeutic_modality: CELL_THERAPY
  description: >-
    Allogeneic hematopoietic stem cell transplantation is reserved for severe
    or treatment-refractory disease, including progressive organ damage,
    refractory infection, or immune dysregulation. In an international cohort,
    two-year overall survival was 86% and graft-failure-free survival was 68%;
    graft instability and poor graft function remain important limitations.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_phenotypes:
  - preferred_term: combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  evidence:
  - reference: PMID:34033842
    reference_title: "International retrospective study of allogeneic hematopoietic cell transplantation for activated PI3K-delta syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With median follow-up of 2.3 years, 2-year overall and graft failure-free survival probabilities were 86% and 68%, respectively, and did not differ significantly by APDS1 versus APDS2, donor type, or conditioning intensity."
    explanation: The largest international HCT cohort provides balanced survival and graft-failure-free outcome estimates.
  - reference: PMID:34033842
    reference_title: "International retrospective study of allogeneic hematopoietic cell transplantation for activated PI3K-delta syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Graft failure, graft instability, and poor graft function requiring unplanned donor cell infusion were major barriers to successful HCT."
    explanation: The cohort directly identifies major limitations that qualify the potentially curative role of HCT.
  - reference: PMID:39899769
    reference_title: "Activated PI3K Delta Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Allogenic hematopoietic stem cell transplant (HSCT) is reserved for individuals with severe or treatment-refractory APDS, including progressive organ damage, recurrent refractory infections, or severe immune dysregulation unresponsive to pharmacologic therapy."
    explanation: Current GeneReviews defines the clinical circumstances in which HSCT is reserved across APDS1 and APDS2.
- name: Antibiotic prophylaxis
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Long-term prophylactic antibiotics are used in patients with recurrent
    bacterial sinopulmonary infections to reduce infectious burden alongside
    immunoglobulin replacement therapy.
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_phenotypes:
  - preferred_term: recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:39899769
    reference_title: "Activated PI3K Delta Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Supportive care: Regular intravenous or subcutaneous immunoglobulin replacement therapy to prevent recurrent bacterial infections and improve immune function; long-term prophylactic antibiotics can be considered to reduce the frequency of bacterial infections; individuals with recurrent herpes simplex or herpes zoster virus can receive prophylactic acyclovir or valganciclovir."
    explanation: Current GeneReviews supports long-term antibacterial prophylaxis as an option within APDS supportive care.
- name: Multisystem, viral, and malignancy surveillance
  action_category: MONITORING
  description: >-
    Longitudinal follow-up should assess infections and herpesvirus burden,
    immune function, lymphoproliferation and blood counts, autoimmunity,
    respiratory function, and gastrointestinal/liver status at least annually.
    GeneReviews also recommends chest CT or MRI every three to five years and
    baseline then periodic liver ultrasonography. Persistent or changing
    lymphadenopathy warrants clinical evaluation because benign
    lymphoproliferation can be difficult to distinguish from lymphoma.
  treatment_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:39899769
    reference_title: "Activated PI3K Delta Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Surveillance: Annually assess infection risk (blood/sputum cultures for EBV, CMV, and HSV), immune function (immunoglobulin levels, CD4+, CD8+, B-cell subsets, response to vaccines), lymphoproliferative status (CBC, B-cell counts), autoimmunity (ANA screen, TSH, TPO), respiratory function (including pulmonary function tests), and gastrointestinal status (liver function tests); CT or MRI of the chest every three to five years; colonoscopy symptomatically as needed; liver ultrasound at baseline and every two to three years; psychiatric assessments as needed."
    explanation: Current GeneReviews provides a structured multisystem surveillance schedule including viral, lymphoproliferative, pulmonary, and liver monitoring.
  - reference: PMID:29599784
    reference_title: "Disease Evolution and Response to Rapamycin in Activated Phosphoinositide 3-Kinase δ Syndrome: The European Society for Immunodeficiencies-Activated Phosphoinositide 3-Kinase δ Syndrome Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Benign lymphoproliferation may be difficult to distinguish from malignant disease, the risk of which is increased in APDS patients."
    explanation: Registry evidence supports careful reassessment of lymphoproliferation for malignant transformation.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Molecular diagnosis is established by identifying a heterozygous pathogenic
    gain-of-function variant in PIK3CD (APDS1) or a heterozygous pathogenic
    loss-of-function variant in PIK3R1 (APDS2). Panel-based or exome sequencing
    is appropriate given the clinical overlap with common variable
    immunodeficiency, hyper-IgM syndrome, and combined immunodeficiency. PTEN
    loss-of-function APDS-like immunodeficiency is a related but out-of-scope
    entity for this APDS1/APDS2 entry.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Heterozygous pathogenic gain-of-function PIK3CD variant (APDS1) or loss-of-function PIK3R1 variant (APDS2)
  evidence:
  - reference: PMID:39899769
    reference_title: "Activated PI3K Delta Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The clinical diagnosis of APDS can be established in a proband based on suggestive clinical findings, or the molecular diagnosis can be established in a proband with suggestive findings and a heterozygous pathogenic variant in PIK3CD (for APDS1) or PIK3R1 (for APDS2) identified by molecular genetic testing."
    explanation: Current GeneReviews defines molecular APDS diagnosis using PIK3CD for APDS1 and PIK3R1 for APDS2, without including PTEN in the APDS subtype definition.
  - reference: PMID:31111319
    reference_title: "Clinical, Immunological, and Genetic Features in Patients with Activated PI3Kδ Syndrome (APDS): a Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It should be suspected in patients with history of recurrent respiratory infections, lymphoproliferation, and raised IgM levels."
    explanation: Systematic review identifies the cardinal clinical triggers that should prompt PIK3CD/PIK3R1 genetic testing.
- name: Serum immunoglobulin profiling
  description: >-
    Serum immunoglobulin levels are abnormal in most patients. The most common pattern
    is elevated IgM with low IgG and IgA, but subclass deficiency, selective IgA
    deficiency, and hypogammaglobulinaemia are also described. Normal immunoglobulin
    levels do not exclude the diagnosis.
  diagnosis_term:
    preferred_term: serum immunoglobulin measurement
    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  results: Elevated IgM with low IgG or IgA in most patients; pattern varies
  markers: IgM, IgG, IgA
  evidence:
  - reference: PMID:29599784
    reference_title: "Disease Evolution and Response to Rapamycin in Activated Phosphoinositide 3-Kinase δ Syndrome: The European Society for Immunodeficiencies-Activated Phosphoinositide 3-Kinase δ Syndrome Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunologically, hypogammaglobulinemia with increased IgM levels was frequent."
    explanation: The combined APDS1/APDS2 registry supports a frequent hyper-IgM/hypogammaglobulinemia pattern without generalizing APDS1-only percentages.
  - reference: PMID:34422726
    reference_title: "Disorders Related to PI3Kδ Hyperactivation: Characterizing the Clinical and Immunological Features of Activated PI3-Kinase Delta Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A hyper IgM-like pattern is the most common immunoglobulin profile reported (low IgG, low IgA and high IgM). This is explained by the fact that PI3Kδ signalling pathways are involved in immunoglobulin class switching (25) with class switched memory B cells reduced in APDS."
    explanation: Review explains the immunological basis for the hyper-IgM pattern and notes that normal levels do not exclude APDS.
- name: Lymphocyte subset analysis
  description: >-
    Flow cytometric quantification of lymphocyte subsets typically reveals B cell
    lymphopenia, CD4+ T cell reduction with an inverted CD4/CD8 ratio, and expanded
    transitional B cells with reduced class-switched memory B cells. Extended
    phenotyping supports the diagnosis and reflects underlying immune dysregulation.
  diagnosis_term:
    preferred_term: lymphocyte subset flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  results: B cell lymphopenia; reduced CD4+ T cells; inverted CD4/CD8 ratio; expanded transitional B cells; reduced class-switched memory B cells
  evidence:
  - reference: PMID:34422726
    reference_title: "Disorders Related to PI3Kδ Hyperactivation: Characterizing the Clinical and Immunological Features of Activated PI3-Kinase Delta Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lymphocyte subset testing typically reveals B cell lymphopenia, CD4+ T cell reduction, with an inverted CD4/CD8 ratio."
    explanation: Review summarizes the characteristic lymphocyte subset pattern as a key diagnostic feature of APDS.
- name: Vaccine response assessment
  description: >-
    Measurement of specific antibody responses to pneumococcal polysaccharide and
    protein-conjugate vaccines reveals impaired humoral immunity in the majority of
    patients with APDS, analogous to other combined immunodeficiencies.
  diagnosis_term:
    preferred_term: vaccine-specific antibody measurement
    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  results: Impaired polysaccharide and/or conjugate vaccine responses
  evidence:
  - reference: PMID:34422726
    reference_title: "Disorders Related to PI3Kδ Hyperactivation: Characterizing the Clinical and Immunological Features of Activated PI3-Kinase Delta Syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vaccine responses are often impaired (3, 16). Defective anti-polysaccharide vaccine responses were detected in 52 of 58 patients (90%) and defective anti-peptide antibody responses in 14 of 42 (33%) (15)."
    explanation: Review documents near-universal impairment of vaccine responses in APDS, supporting their use as a diagnostic marker.
- name: Thoracic CT imaging
  description: >-
    High-resolution CT of the thorax can show mosaic attenuation reflecting
    small-airway disease and established bronchiectasis. The 90% estimate for
    mosaic attenuation comes from an APDS1 cohort, whereas bronchiectasis is
    documented in combined APDS1/APDS2 registry data. CT is relevant to staging
    airway injury and pulmonary surveillance.
  diagnosis_term:
    preferred_term: high-resolution thoracic computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: Mosaic attenuation (well quantified in APDS1) and/or bronchiectasis
  evidence:
  - reference: PMID:27555459
    reference_title: "Clinical spectrum and features of activated phosphoinositide 3-kinase δ syndrome: A large patient cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thoracic imaging revealed high rates of mosaic attenuation (90%) and bronchiectasis (60%)."
    explanation: The APDS1 cohort documents mosaic attenuation and bronchiectasis; its percentages are not generalized to APDS2.
  - reference: PMID:29599784
    reference_title: "Disease Evolution and Response to Rapamycin in Activated Phosphoinositide 3-Kinase δ Syndrome: The European Society for Immunodeficiencies-Activated Phosphoinositide 3-Kinase δ Syndrome Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The registry data confirmed the previously described (5, 6) high incidence of bronchiectasis (28 patients out of the 55 who underwent a CT-scan), which was documented early in life (age range: 2–39 years; mean: 11.2 years)."
    explanation: Combined APDS1/APDS2 registry CT data establish bronchiectasis across the operational disease scope.
- name: Enhanced phospho-AKT in circulating B cells
  description: >-
    Flow cytometric measurement of AKT phosphorylation at Ser473 in CD19+ peripheral
    blood B cells is a supportive functional biomarker of PI3K-delta
    hyperactivation. Enhanced pAKT, particularly in CD10+ immature B cells, may
    help distinguish PI3K-pathway hyperactivation from common variable
    immunodeficiency and CD40L-related hyper-IgM syndrome, but the assay remains
    incompletely validated. Because this functional abnormality can also occur
    in PTEN-related APDS-like immunodeficiency, it complements but does not
    replace subtype-defining molecular testing.
  diagnosis_term:
    preferred_term: phospho-AKT flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  results: Elevated phospho-AKT (Ser473) in CD19+ B cells, most pronounced in CD10+ immature B cells; normalized by p110delta inhibitor
  evidence:
  - reference: PMID:29675019
    reference_title: "Enhanced AKT Phosphorylation of Circulating B Cells in Patients With Activated PI3Kδ Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that the enhanced pAKT in circulating B cells may be useful for the discrimination of APDS1, APDS2, and APDS-L from other antibody deficiencies."
    explanation: Functional flow cytometry distinguishes PI3K-pathway hyperactivation from other antibody deficiencies but does not by itself separate APDS1/2 from PTEN-related APDS-like disease.
clinical_trials:

progression:
- phase: Early disease
  age_range: Infancy through childhood
  notes: >-
    Recurrent respiratory infections typically appear first, followed by
    chronic lymphoproliferation and then gastrointestinal manifestations and
    cytopenias.
  evidence:
  - reference: PMID:29599784
    reference_title: "Disease Evolution and Response to Rapamycin in Activated Phosphoinositide 3-Kinase δ Syndrome: The European Society for Immunodeficiencies-Activated Phosphoinositide 3-Kinase δ Syndrome Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of disease evolution in the first 68 patients pinpoints the early occurrence of recurrent respiratory infections followed by chronic lymphoproliferation, gastrointestinal manifestations, and cytopenias."
    explanation: The combined APDS1/APDS2 registry establishes the usual sequence of early and later manifestations.
- phase: Variable later course
  age_range: Childhood through adulthood
  notes: >-
    Most manifestations develop by age 15, but APDS has variable penetrance and
    timing, including documented adult-onset and asymptomatic courses.
  evidence:
  - reference: PMID:29599784
    reference_title: "Disease Evolution and Response to Rapamycin in Activated Phosphoinositide 3-Kinase δ Syndrome: The European Society for Immunodeficiencies-Activated Phosphoinositide 3-Kinase δ Syndrome Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although most manifestations occur by age 15, adult-onset and asymptomatic courses were documented."
    explanation: Registry natural-history data qualify the typical pediatric course with late-onset and asymptomatic presentations.
pathophysiology:
- name: PI3K-delta pathway hyperactivation
  description: >-
    Germline gain-of-function variants in the PIK3CD catalytic subunit (APDS1)
    or loss-of-function variants in the inhibitory PIK3R1 regulatory subunit
    (APDS2) create constitutive PI3K-delta signaling with increased downstream
    AKT and mTOR activity. Persistent pathway activation disrupts lymphocyte
    homeostasis and underlies the precision-medicine rationale for PI3K-delta
    inhibition.
  genes:

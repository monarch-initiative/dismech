description: >-
  Activated PI3K-delta syndrome (APDS) is a rare autosomal dominant combined
  immunodeficiency comprising APDS1, caused by heterozygous gain-of-function
  variants in PIK3CD, and APDS2, caused by heterozygous loss-of-function
  variants in PIK3R1. Both mechanisms produce net hyperactivation of
  PI3K-delta-AKT-mTOR signaling. The resulting immune dysregulation drives
  recurrent sinopulmonary infection, non-neoplastic lymphoproliferation,
  hyper-IgM humoral abnormalities, reduced switched-memory B cells,
  herpesvirus susceptibility, autoimmunity, and progressive airway damage
  including bronchiectasis. PTEN loss-of-function immunodeficiency is described
  as APDS-like (APDS-L) in some literature but is not included in this entry's
  APDS1/APDS2 subtype scope.

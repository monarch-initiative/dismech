  phase: PHASE_III
  status: COMPLETED
  description: >-
    Completed phase 2/3 leniolisib program with an open-label dose-finding part
    followed by a randomized blinded placebo-controlled efficacy and safety
    part in genetically confirmed APDS. The schema records the highest
    confirmatory phase because the ClinicalTrials.gov record lists both phase 2
    and phase 3.
  target_phenotypes:
  - preferred_term: lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: clinicaltrials:NCT02435173
    reference_title: "An Open-label, Non-randomized, Within-patient Dose-finding Study Followed by a Randomized, Subject, Investigator and Sponsor Blinded Placebo Controlled Study to Assess the Efficacy and Safety of CDZ173 (Leniolisib) in Patients With APDS/PASLI (Activated Phosphoinositide 3-kinase Delta Syndrome/ p110δ-activating Mutation Causing Senescent T Cells, Lymphadenopathy and Immunodeficiency)"

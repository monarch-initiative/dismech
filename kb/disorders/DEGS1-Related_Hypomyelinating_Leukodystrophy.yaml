discussions:
- discussion_id: degs1_gain_versus_loss
  prompt: >-
    Is the disease driven by toxic accumulation of dihydroceramide and its
    atypical derivatives, or by loss of ceramide and its downstream
    sphingolipids?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Dihydroceramide Accumulation
  - pathophysiology#Reduced Ceramide and Downstream Sphingolipids
  - pathophysiology#Formation of Atypical Sphingoid Base SPB 18:1(14Z)
  - mechanistic_hypotheses#degs1_dihydroceramide_accumulation_hypomyelination
  rationale: >-
    Losing DEGS1 does two things at once: it raises the substrate
    dihydroceramide and lowers the product ceramide and everything made from it.
    Which side is pathogenic decides what a therapy should do. The
    accumulation case is strong in the models: epistasis in Drosophila shows
    that knocking down the upstream ceramide synthase schlank rescues the glial
    ER phenotype, meaning it is dihydroceramide in the ER that drives it, and in
    neurons dihydroceramide itself mislocalises Rac1 to produce oxidative
    stress. The preclinical zebrafish rescue works the same way, by lowering
    dihydroceramide rather than restoring ceramide. But ceramide, sphingosine,
    sphingosine-1-phosphate and hexosylceramides all fall too, and these are
    signalling and membrane lipids with their own roles in myelin, so a
    contribution from product loss is not excluded. The atypical Delta-14
    sphingoid base is a third candidate toxin, called potentially neurotoxic,
    but its toxicity in vivo has not been shown. The question matters because an
    upstream ceramide-synthase inhibitor helps only if accumulation is the
    driver; if product loss matters, it could make that arm worse.
  proposed_experiments:
  - experiment_id: exp_degs1_substrate_reduction_vs_ceramide_rescue
    name: Separate substrate reduction from ceramide restoration
    description: >-
      In a DEGS1-null oligodendrocyte or other cell-autonomous glial model, compare
      ceramide-synthase inhibition (lowers dihydroceramide without restoring
      ceramide) against exogenous ceramide or a bypass that restores downstream
      sphingolipids, and score myelination markers and oxidative stress. If only
      substrate reduction rescues, accumulation is the driver.
    would_support:
    - mechanistic_hypotheses#degs1_dihydroceramide_accumulation_hypomyelination
  evidence:
  - reference: PMID:40864161
    reference_title: Loss of dihydroceramide desaturase drives neurodegeneration by disrupting endoplasmic reticulum and lipid droplet homeostasis in glial cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNAi knockdown of the upstream ceramide synthase schlank in glia of ifc
      mutants rescues ER expansion, suggesting dihydroceramide accumulation in
      the ER drives this phenotype
    explanation: Epistasis evidence for the accumulation side.
  - reference: PMID:31186544
    reference_title: DEGS1 variant causes neurological disorder.
    supports: SUPPORT

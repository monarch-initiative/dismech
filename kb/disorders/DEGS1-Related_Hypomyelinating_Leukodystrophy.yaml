- discussion_id: degs1_glia_versus_neuron_primary
  prompt: >-
    Is the human disease primarily a glial (oligodendrocyte) disorder with
    neuronal loss as a consequence, or does DEGS1 loss injure neurons directly?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Glial ER Expansion and Lipid-Droplet Depletion
  - pathophysiology#Neuronal Rac1-NOX Oxidative Stress
  - pathophysiology#Neurodegeneration
  - mechanistic_hypotheses#degs1_glia_primary_neurodegeneration
  rationale: >-
    The name says leukodystrophy, which implies a myelin and therefore glial
    disease, and the fly work supports that: ifc is expressed mainly in glia,
    and knocking it down in glia but not neurons kills neurons. But the same
    field also shows a cell-autonomous neuronal mechanism, where dihydroceramide
    mislocalises Rac1 and drives NOX oxidative stress in photoreceptors and in a
    human neuronal line. Both can be true, in different compartments, and the
    human disease has both hypomyelination and progressive thalamic and
    cerebellar atrophy. Which is primary bears on whether an
    oligodendrocyte-directed therapy would be enough or whether neurons also
    need protecting. No human tissue study resolves the order of events.
  evidence:
  - reference: PMID:40864161
    reference_title: Loss of dihydroceramide desaturase drives neurodegeneration by disrupting endoplasmic reticulum and lipid droplet homeostasis in glial cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our work identifies glia as the primary site of disease progression in
      HLD-18
    explanation: The glia-primary position.
  - reference: PMID:33852856
    reference_title: Dihydroceramide desaturase regulates the compartmentalization of Rac1 for neuronal oxidative stress.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      DEGS1/ifc regulates Rac1 compartmentalization in neuronal cells
    explanation: A cell-autonomous neuronal mechanism, weighing against glia-only.
- discussion_id: degs1_model_translational_validity
  prompt: >-
    How faithfully do the invertebrate and larval models capture a human
    vertebrate myelination disease, given that none has characterised CNS myelin
    in a mammal?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Zebrafish
  - animal_models#Fruit fly
  - pathophysiology#CNS Hypomyelination
  rationale: >-
    The mechanism rests on a Drosophila model with no myelin, where glial
    ensheathment stands in for myelination, and on a transient zebrafish
    morpholino knockdown scored at the larval stage, whose phenotypes are not
    always reproduced in stable mutants. The biochemistry transfers well across
    species, but the central claim, that the sphingolipid imbalance causes
    mammalian oligodendrocyte myelin failure, has not been shown in a mammalian
    model with characterised CNS myelin. A conditional oligodendrocyte Degs1
    mouse would test it directly and is the obvious missing experiment.
  proposed_experiments:
  - experiment_id: exp_degs1_oligodendrocyte_cko_mouse
    name: Oligodendrocyte-specific Degs1 conditional knockout mouse
    description: >-
      Delete Degs1 in the oligodendrocyte lineage and score myelination,
      dihydroceramide/ceramide ratio, and neurological phenotype against
      littermate controls, with and without upstream ceramide-synthase
      inhibition. Mammalian CNS hypomyelination from an oligodendrocyte-autonomous
      deletion would close the translational gap.
    would_support:
    - mechanistic_hypotheses#degs1_dihydroceramide_accumulation_hypomyelination
  evidence:
  - reference: PMID:40864161
    reference_title: Loss of dihydroceramide desaturase drives neurodegeneration by disrupting endoplasmic reticulum and lipid droplet homeostasis in glial cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of ifc causes massive dihydroceramide accumulation and severe
      morphological defects in cortex glia, including endoplasmic reticulum (ER)
      expansion, failure of neuronal ensheathment, and lipid droplet depletion.
    explanation: The fly uses ensheathment, not myelin, as the readout.
  - reference: PMID:30620337
    reference_title: Loss of the sphingolipid desaturase DEGS1 causes hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we used a knockdown approach for disease modeling in Danio rerio
    explanation: The zebrafish model is a transient larval knockdown.
- discussion_id: degs1_genotype_severity
  prompt: >-
    Do residual-activity (partial loss-of-function) alleles cause milder disease
    than null alleles, enough to count as a genotype-phenotype correlation?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - genetic#DEGS1
  - phenotypes#Global developmental delay
  rationale: >-
    The hint is consistent: p.Asn255Ser and p.Leu175Gln keep about 12% of
    wild-type activity, the p.Ala280Val patient (about 20% residual) survived to
    at least 22, and the mildest founding patient was a compound heterozygote
    carrying a residual-activity allele. Against a clean correlation, the
    Grinberg family shows notable variability between relatives carrying the
    same variant, so genotype is not the whole story. Establishing it would need
    a larger cohort with paired in vitro activity and standardised severity
    scoring, which no study has done. It matters for counselling and for
    predicting who might benefit most from a substrate-reduction therapy.
  evidence:
  - reference: PMID:38342436
    reference_title: Loss of function and reduced levels of sphingolipid desaturase DEGS1 variants are both relevant in disease mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro desaturase activity was lost by many variants except L175Q and
      N255S, which maintain a catalytic efficiency close to 12% of the WT enzyme.
    explanation: Identifies the residual-activity alleles.
  - reference: PMID:41404352
    reference_title: "DEGS1-Related Hypomyelinating Leukodystrophy: Four Individuals From Same Family and Review of Literature."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is notable variability in severity between them as well as with
      other 33 previously reported individuals, including 2 with the same
      pathogenic variant
    explanation: Same-genotype variability argues against a clean correlation.

name: DEGS1-Related Hypomyelinating Leukodystrophy
creation_date: "2026-11-09T00:42:39Z"
category: Mendelian
description: >-
  Autosomal recessive, early-onset hypomyelinating leukodystrophy (HLD18)
  caused by biallelic loss-of-function variants in DEGS1, which encodes the
  sphingolipid Delta-4-desaturase that performs the final step of de novo
  ceramide synthesis, converting dihydroceramide to ceramide. Loss of the
  enzyme makes dihydroceramide and other dihydrosphingolipids accumulate, with
  a raised dihydroceramide/ceramide ratio, and the sphingolipid imbalance
  impairs oligodendrocyte and Schwann-cell myelination. Children present in
  infancy with nystagmus, motor arrest, dystonia, spasticity and failure to
  thrive; MRI shows cerebral hypomyelination, a thin corpus callosum, and
  progressive thalamic and cerebellar atrophy. A demyelinating peripheral
  neuropathy occurs in a subset. There is no disease-modifying therapy. ClinGen
  rates DEGS1 Definitive for this disease.
disease_term:
  preferred_term: leukodystrophy, hypomyelinating, 18
  term:

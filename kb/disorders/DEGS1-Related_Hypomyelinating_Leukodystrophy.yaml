genetic:
- name: DEGS1
  gene_term:
    preferred_term: DEGS1
    term:
      id: hgnc:13709
      label: DEGS1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic germline variants at 1q42.11: missense, nonsense, frameshift,
    splice-site, and whole- or partial-gene deletions. The recurrent
    p.(Asn255Ser) allele (also written p.N219S on another isoform) appeared in 3
    of the 13 founding families and keeps about 12% of wild-type activity, as
    does p.Leu175Gln; these partial-activity alleles associate with milder
    disease. Deletion testing is recommended because the gene has no MLPA assay
    and single-exon or whole-gene deletions in trans with a point variant are
    missed by sequencing alone. The atypical base SPB 18:1(14Z) and the in vitro
    desaturase assay help classify variants of uncertain significance.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN

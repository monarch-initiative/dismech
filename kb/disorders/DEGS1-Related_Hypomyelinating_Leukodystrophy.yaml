        label: DEGS1
  evidence:
  - reference: PMID:30620337
    reference_title: Loss of the sphingolipid desaturase DEGS1 causes hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have used whole-exome sequencing in patients with undetermined
      leukoencephalopathies to uncover the endoplasmic reticulum lipid
      desaturase DEGS1 as the causative gene in 19 patients from 13 unrelated
      families
    explanation: The gene discovery.
  - reference: PMID:38342436
    reference_title: Loss of function and reduced levels of sphingolipid desaturase DEGS1 variants are both relevant in disease mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that loss of function and reduced protein levels are both
      relevant in disease pathogenesis
    explanation: Functional classification of the variant mechanism.
  downstream:

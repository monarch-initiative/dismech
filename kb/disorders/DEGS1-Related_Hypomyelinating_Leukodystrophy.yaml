- name: Mitochondria-Associated ER Membrane Dysfunction
  biological_scale: CELLULAR
  description: >-
    DEGS1 is a MAM-resident enzyme, and its loss gives a hyperfused
    mitochondrial network, impaired sterol O-acyltransferase activity with fewer
    cholesteryl esters, abnormal lipid-droplet biogenesis, and more
    mitochondrial superoxide, shown in patient fibroblasts and muscle. Its link
    to myelin failure is an inference.
  cell_types:

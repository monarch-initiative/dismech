notes: >-
  The entry name follows the gene-related form established by the MONDO EXACT
  synonym "DEGS1-related hypomyelinating leukodystrophy", the Grinberg 2026
  title, and ClinGen; the MONDO label is kept in synonyms. No GeneReviews or
  StatPearls chapter covers this disease (check-genereviews NO_CHAPTER), so the
  phenotype baseline is taken from the Pant 2019 founding cohort of 19 patients,
  the Karsai 2019 and Dolgin 2019 reports, and the Grinberg 2026 four-patient
  family and literature review (33 patients to date). Mechanism steps shown only
  in model systems (Drosophila, zebrafish, patient fibroblasts) are marked as
  such on their edges.
mechanistic_hypotheses:
- hypothesis_group_id: degs1_dihydroceramide_accumulation_hypomyelination
  hypothesis_label: DEGS1 Loss / Dihydroceramide Accumulation / Hypomyelination Model
  status: CANONICAL
  description: >-
    Loss of DEGS1 Delta-4-desaturase activity blocks the last step of de novo
    ceramide synthesis, so dihydroceramide and other dihydrosphingolipids
    accumulate while ceramide and its downstream products fall. The altered
    sphingolipid pool impairs oligodendrocyte and Schwann-cell membrane biology
    and produces CNS hypomyelination with variable peripheral demyelination.
    Whether the disease is driven by dihydroceramide gain or by loss of ceramide
    and its products is not resolved (see discussion degs1_gain_versus_loss).
  evidence:
  - reference: PMID:30620337
    reference_title: Loss of the sphingolipid desaturase DEGS1 causes hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This enzyme converts dihydroceramide (DhCer) into ceramide (Cer) in the
      final step of the de novo biosynthesis pathway. We detected a marked
      increase of the substrate DhCer and DhCer/Cer ratios in patients'
      fibroblasts and muscle.
    explanation: The founding study establishes the enzyme step and the substrate build-up.
- hypothesis_group_id: degs1_glia_primary_neurodegeneration
  hypothesis_label: Glia-Primary Disease Driving Neuronal Loss
  status: EMERGING
  description: >-
    Model-organism work places the primary lesion in glia rather than neurons:
    the Drosophila DEGS1 homolog ifc is expressed mainly in glia, and knocking
    it down in glia but not neurons drives neuronal death. If this holds in
    humans, oligodendrocyte and other glial dysfunction would be upstream of the
    neurodegeneration seen as thalamic and cerebellar atrophy.
  evidence:
  - reference: PMID:40864161
    reference_title: Loss of dihydroceramide desaturase drives neurodegeneration by disrupting endoplasmic reticulum and lipid droplet homeostasis in glial cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNAi knockdown of ifc in glia but not neurons drives neuronal cell death,
      suggesting that ifc function in glia promotes neuronal survival.
    explanation: The fly genetics that motivate a glia-primary model.
pathophysiology:
- name: Biallelic DEGS1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous germline DEGS1 variants (missense,
    nonsense, frameshift, splice, and whole- or partial-gene deletions). Most
    variants abolish activity in vitro and lower protein levels by 40-80%;
    N255S and L175Q keep about 12% of wild-type activity.

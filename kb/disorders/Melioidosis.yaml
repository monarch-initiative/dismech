- name: Actin-based motility and cell-to-cell spread
  description: >-
    In the cytosol, B. pseudomallei uses the autotransporter BimA to polymerise
    host actin into a propulsive tail, driving intracellular motility and
    protrusion into neighbouring cells for direct cell-to-cell spread that avoids
    the extracellular environment.
  biological_processes:
  - preferred_term: actin nucleation
    term:
      id: GO:0045010
      label: actin nucleation
    modifier: INCREASED
  evidence:
  - reference: PMID:30968000
    reference_title: "Burkholderia pseudomallei BimC Is Required for Actin-Based Motility, Intracellular Survival, and Virulence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BimA is required for actin-based motility through its direct interaction with actin, and by mediating actin polymerization at a single pole of the bacterium to promote movement both within and between cells"
    explanation: BimA-driven polar actin polymerisation is directly demonstrated as the mechanism of intracellular and intercellular motility.
  - reference: PMID:16714590
    reference_title: "Identification of Burkholderia pseudomallei genes required for the intracellular life cycle and in vivo virulence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "actin tails and membrane protrusions, leading to direct cell-to-cell spreading"
    explanation: Actin tail formation and membrane protrusions mediate direct cell-to-cell spread.
  downstream:
  - target: Multinucleated giant cell formation
    causal_link_type: DIRECT
    description: Cell-to-cell spread drives membrane fusion and multinucleated giant cell formation.
- name: Multinucleated giant cell formation
  description: >-
    Cell-to-cell spread drives fusion of infected host cells into multinucleated
    giant cells (MNGCs), a characteristic in vitro cytopathic signature of B.
    pseudomallei that promotes intercellular dissemination while shielding
    bacteria from humoral immunity.
  biological_processes:
  - preferred_term: syncytium formation by cell-cell fusion
    term:
      id: GO:0000768
      label: syncytium formation by cell-cell fusion
    modifier: INCREASED
  evidence:
  - reference: PMID:30968000
    reference_title: "Burkholderia pseudomallei BimC Is Required for Actin-Based Motility, Intracellular Survival, and Virulence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "inability to form multi-nucleated giant cells in J774.1 cells"
    explanation: Loss of cell-to-cell spread ablates multinucleated giant cell formation, tying MNGC formation to the actin-motility/spread machinery.
  - reference: PMID:36814569
    reference_title: "Phenotypic and genetic alterations of Burkholderia pseudomallei in patients during relapse and persistent infections."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "multinucleated giant cell (MNGC) formation efficiency and intracellular multiplication"
    explanation: MNGC formation is studied as a defining intracellular phenotype of clinical B. pseudomallei isolates.
  downstream:

- name: Fever
  description: >-
    Fever is a characteristic presenting symptom of melioidosis.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:42220795
    reference_title: "Melioidosis Presenting As a Chronic Splenic Abscess: A Diagnostic Challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "occupational exposure as a farmer, who presented with chronic fever"
    explanation: Fever is a characteristic presenting symptom, illustrated here in a culture-confirmed case.
- name: Neurological melioidosis
  description: >-
    Neurological melioidosis (brain abscess and brainstem encephalomyelitis) is
    an uncommon but distinctive and severe manifestation.
  phenotype_term:
    preferred_term: Neurological melioidosis
    term:
      id: HP:0002383
      label: Infectious encephalitis
  frequency: VERY_RARE
  evidence:
  - reference: PMID:21152057
    reference_title: "The epidemiology and clinical spectrum of melioidosis: 540 cases from the 20 year Darwin prospective study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "neurological melioidosis in 14 (3%)"
    explanation: >-
      Neurological melioidosis was the primary presentation in 3% of the Darwin
      cohort; the HP term Infectious encephalitis is the closest available parent
      for the encephalomyelitis/CNS-abscess spectrum.
environmental:
- name: Diabetes mellitus
  description: >-
    Diabetes mellitus is the single most important risk factor for melioidosis,
    present in roughly half of cases and greatly increasing susceptibility.
  influences_mechanisms:
  - target: Innate immune activation and sepsis
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Diabetes impairs neutrophil/innate immune defence, so an inoculum a healthy
      host would clear instead establishes invasive, frequently septic infection.
    evidence:
    - reference: PMID:29388572
      reference_title: "Melioidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diabetes mellitus is a major risk factor for melioidosis"
      explanation: The review identifies diabetes as the dominant host risk factor for melioidosis.
    - reference: PMID:21152057
      reference_title: "The epidemiology and clinical spectrum of melioidosis: 540 cases from the 20 year Darwin prospective study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Risk factors for melioidosis included diabetes"
      explanation: Diabetes was the leading risk factor in the prospective Darwin cohort.
  evidence:
  - reference: PMID:29388572
    reference_title: "Melioidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetes mellitus is a major risk factor for melioidosis"
    explanation: Establishes diabetes mellitus as a major predisposing condition.
- name: Chronic kidney disease
  description: >-
    Chronic kidney disease is a recognised predisposing comorbidity, associated
    with impaired neutrophil chemotaxis and bacterial killing.
  influences_mechanisms:
  - target: Innate immune activation and sepsis
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Renal disease is an established host predisposing factor for invasive
      melioidosis.
    evidence:
    - reference: PMID:40608717
      reference_title: "Diabetic foot osteomyelitis caused by Burkholderia pseudomallei: first case report from Türkiye and a review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diabetes mellitus, renal disease, alcoholism, liver cirrhosis, and thalassemia are known predisposing factors"
      explanation: Renal disease is listed among the established predisposing conditions for melioidosis.
  evidence:
  - reference: PMID:40608717
    reference_title: "Diabetic foot osteomyelitis caused by Burkholderia pseudomallei: first case report from Türkiye and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetes mellitus, renal disease, alcoholism, liver cirrhosis, and thalassemia are known predisposing factors"
    explanation: Establishes chronic kidney disease as an established predisposing condition for melioidosis.

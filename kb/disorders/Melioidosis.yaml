name: Melioidosis
creation_date: "2026-08-08T00:00:00Z"
category: Infectious Disease
parents:
- Bacterial Infection
synonyms:
- Whitmore disease
- Whitmore's disease
- Burkholderia pseudomallei infection
- Nightcliff gardener's disease
description: >-
  Melioidosis is a frequently severe infection caused by the environmental
  Gram-negative bacterium Burkholderia pseudomallei, a facultative intracellular
  saprophyte of soil and surface water in tropical regions (notably Southeast
  Asia and northern Australia). Infection is acquired through percutaneous
  inoculation, inhalation, or ingestion of contaminated soil and water and
  produces a highly protean illness ranging from acute fulminant pneumonia and
  septicaemia to localised abscesses (lung, liver, spleen, prostate, skin and
  soft tissue), septic arthritis and osteomyelitis, and neurological disease.
  Diabetes mellitus is the dominant risk factor. B. pseudomallei is intrinsically
  resistant to many antibiotics, and treatment requires a prolonged two-stage
  regimen: an intravenous intensive phase (ceftazidime or a carbapenem) followed
  by months of oral eradication therapy (trimethoprim-sulfamethoxazole) to
  prevent relapse from persistent intracellular organisms.

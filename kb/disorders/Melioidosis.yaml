    evidence_source: IN_VITRO
    snippet: "unable to escape from endocytic vesicles after invasion but still multiplied within the vacuoles"
    explanation: A Bsa type III secretion system mutant fails to escape the endocytic vacuole, identifying T3SS-3-mediated phagosomal escape as required for the cytosolic intracellular life cycle.
  - reference: PMID:29388572

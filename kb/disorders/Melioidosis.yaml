- name: Chronic lung disease
  description: >-
    Chronic lung disease is a common comorbidity in melioidosis cohorts (26% in
    the Darwin prospective study) and predisposes to pulmonary and invasive
    disease.
  influences_mechanisms:
  - target: Innate immune activation and sepsis
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Chronic lung disease is an established host predisposing factor for
      melioidosis.
    evidence:
    - reference: PMID:21152057
      reference_title: "The epidemiology and clinical spectrum of melioidosis: 540 cases from the 20 year Darwin prospective study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "chronic lung disease (26%) and chronic renal disease (12%)"
      explanation: Chronic lung disease was present in 26% of the Darwin cohort, more than chronic renal disease.
  evidence:
  - reference: PMID:21152057
    reference_title: "The epidemiology and clinical spectrum of melioidosis: 540 cases from the 20 year Darwin prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chronic lung disease (26%) and chronic renal disease (12%)"
    explanation: Chronic lung disease was the most common pre-existing comorbidity after diabetes in the Darwin prospective cohort.
- name: Soil and surface water exposure
  description: >-
    Occupational and recreational contact with contaminated soil and surface
    water, especially during the monsoon/rainy season in endemic regions, is the
    principal route of exposure.
  influences_mechanisms:
  - target: Environmental host entry
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Contact with contaminated soil and water is the route by which B.
      pseudomallei enters the host.
    evidence:
    - reference: PMID:26877885
      reference_title: "Predicted global distribution of Burkholderia pseudomallei and burden of melioidosis."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Burkholderia pseudomallei, a highly pathogenic bacterium that causes melioidosis, is commonly found in soil"
      explanation: Soil is the environmental reservoir contacted during exposure events.
    - reference: PMID:21152057
      reference_title: "The epidemiology and clinical spectrum of melioidosis: 540 cases from the 20 year Darwin prospective study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "436 (81%) presented during the monsoonal wet season"
      explanation: The strong wet-season predominance reflects exposure to water-saturated contaminated soil.
  evidence:
  - reference: PMID:26877885
    reference_title: "Predicted global distribution of Burkholderia pseudomallei and burden of melioidosis."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "commonly found in soil in Southeast Asia and Northern"
    explanation: Contaminated soil is the environmental source of exposure.
diagnosis:
- name: Culture of Burkholderia pseudomallei
  description: >-
    Isolation of B. pseudomallei by culture from blood, sputum, pus, or other
    clinical samples is the diagnostic gold standard. Because the organism can be
    misidentified or dismissed as a contaminant (and is a Tier-1 select agent),
    the microbiology laboratory is central to diagnosis.
  diagnosis_term:
    preferred_term: Microbial Culture Procedure
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  results: Growth of B. pseudomallei from a clinical specimen confirms melioidosis.
  evidence:
  - reference: PMID:16547571
    reference_title: "Clinical guideline for diagnosis and management of melioidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis depends heavily on the clinical microbiology laboratory for culture"
    explanation: The clinical guideline establishes culture as the mainstay of diagnosis.
  - reference: PMID:16547571
    reference_title: "Clinical guideline for diagnosis and management of melioidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "is easily cultured from blood, sputum and other clinical samples"
    explanation: B. pseudomallei is readily cultured from routine clinical specimens.
- name: Serological testing
  description: >-
    Serological tests can support a diagnosis of melioidosis but are not
    definitive on their own, and are limited by high background seropositivity in
    endemic populations.
  diagnosis_term:
    preferred_term: serological testing
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: A positive serology supports but does not confirm melioidosis.
  evidence:
  - reference: PMID:16547571
    reference_title: "Clinical guideline for diagnosis and management of melioidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Serological tests can help to support a diagnosis of melioidosis, but by themselves do not provide a definitive diagnosis"
    explanation: The clinical guideline positions serology as supportive but not definitive.
treatments:
- name: Intensive-phase ceftazidime or carbapenem therapy
  description: >-
    Intravenous ceftazidime, meropenem, or imipenem for at least 10-14 days
    (longer for deep-seated infection) is the intensive-phase treatment for acute
    melioidosis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftazidime
      term:
        id: CHEBI:3508
        label: ceftazidime
    - preferred_term: meropenem
      term:
        id: CHEBI:43968
        label: meropenem
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: B. pseudomallei Peptidoglycan Cross-Linking (Beta-Lactam Target)
    description: >-
      Ceftazidime and carbapenems acylate B. pseudomallei PBP transpeptidases,
      blocking peptidoglycan cross-linking.
    evidence:
    - reference: PMID:16547571
      reference_title: "Clinical guideline for diagnosis and management of melioidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "intravenous Ceftazidime or Meropenem for several weeks"
      explanation: The intensive phase uses the cell-wall-active beta-lactams ceftazidime and meropenem.
  evidence:
  - reference: PMID:16547571
    reference_title: "Clinical guideline for diagnosis and management of melioidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recommended antibiotic treatment for severe infection is either intravenous Ceftazidime or Meropenem for several weeks"
    explanation: Guideline-recommended intensive-phase therapy for severe melioidosis.
  - reference: PMID:41264536
    reference_title: "Melioidosis presenting as hepatosplenic abscesses: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "intravenous meropenem or ceftazidime followed by oral"
    explanation: A clinical series confirms the intravenous meropenem/ceftazidime intensive phase in practice.
- name: Eradication-phase trimethoprim-sulfamethoxazole
  description: >-
    Oral trimethoprim-sulfamethoxazole (co-trimoxazole) for 3-6 months after the
    intensive phase eradicates persistent organisms and prevents relapse.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trimethoprim
      term:
        id: CHEBI:45924
        label: trimethoprim
    - preferred_term: sulfamethoxazole
      term:
        id: CHEBI:9332
        label: sulfamethoxazole
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: B. pseudomallei Tetrahydrofolate Synthesis (TMP-SMX Target)
    description: >-
      TMP-SMX blocks DHPS and DHFR in the B. pseudomallei folate pathway.
    evidence:
    - reference: PMID:16547571
      reference_title: "Clinical guideline for diagnosis and management of melioidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "oral treatment with a combination of trimethoprim-sulphamethoxazole and doxycycline"
      explanation: The eradication phase is anchored by oral co-trimoxazole, the antifolate combination.
  - target: Intracellular persistence and eradication-phase requirement
    description: >-
      Cell-penetrant co-trimoxazole reaches persistent intracellular organisms
      during the prolonged eradication phase.
    evidence:
    - reference: PMID:36814569
      reference_title: "Phenotypic and genetic alterations of Burkholderia pseudomallei in patients during relapse and persistent infections."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment of melioidosis requires prolonged antibiotic therapy"
      explanation: The prolonged oral eradication phase is required to clear persistent intracellular organisms and prevent relapse.
  evidence:
  - reference: PMID:16547571
    reference_title: "Clinical guideline for diagnosis and management of melioidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "rigorous treatment of severe infection with the correct antibiotics in two stages; acute and eradication"
    explanation: The two-stage acute/eradication structure is the guideline-standard approach, of which oral TMP-SMX is the eradication component.
- name: Eradication-phase doxycycline
  description: >-
    Oral doxycycline is used in the eradication phase in combination with
    trimethoprim-sulfamethoxazole (and as an alternative agent). As a
    cell-penetrant tetracycline it reaches persistent intracellular organisms.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Intracellular persistence and eradication-phase requirement
    description: >-
      Cell-penetrant doxycycline reaches persistent intracellular organisms
      during the prolonged eradication phase.
    evidence:
    - reference: PMID:16547571
      reference_title: "Clinical guideline for diagnosis and management of melioidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "oral treatment with a combination of trimethoprim-sulphamethoxazole and doxycycline"
      explanation: Doxycycline is used with co-trimoxazole in the oral eradication phase.
  evidence:
  - reference: PMID:16547571
    reference_title: "Clinical guideline for diagnosis and management of melioidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "oral treatment with a combination of trimethoprim-sulphamethoxazole and doxycycline"
    explanation: Doxycycline is a component of the oral eradication regimen for melioidosis.

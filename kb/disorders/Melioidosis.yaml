- name: B. pseudomallei Peptidoglycan Cross-Linking (Beta-Lactam Target)
  description: >-
    B. pseudomallei depends on penicillin-binding-protein transpeptidases to
    cross-link peptidoglycan during cell-wall synthesis. Ceftazidime and the
    carbapenems (meropenem, imipenem) acylate these PBPs and anchor the
    intravenous intensive phase of therapy.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: peptidoglycan biosynthetic process
    term:
      id: GO:0009252
      label: peptidoglycan biosynthetic process
  evidence:
  - reference: PMID:16547571
    reference_title: "Clinical guideline for diagnosis and management of melioidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recommended antibiotic treatment for severe infection is either intravenous Ceftazidime or Meropenem for several weeks"
    explanation: Ceftazidime and meropenem, the intensive-phase agents, are cell-wall-active beta-lactams acting on PBP transpeptidases.
- name: B. pseudomallei Tetrahydrofolate Synthesis (TMP-SMX Target)
  description: >-
    Trimethoprim-sulfamethoxazole, the backbone of the oral eradication phase,
    blocks the B. pseudomallei folate pathway at two enzymes: sulfamethoxazole
    inhibits dihydropteroate synthase (DHPS) and trimethoprim inhibits
    dihydrofolate reductase (DHFR), giving synergistic sequential blockade.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_folate_synthesis_inhibition#Bacterial Tetrahydrofolate Synthesis (Antifolate Target)"
  biological_processes:
  - preferred_term: tetrahydrofolate biosynthetic process
    term:
      id: GO:0046654
      label: tetrahydrofolate biosynthetic process
  evidence:
  - reference: PMID:23627736
    reference_title: "Sulfa and trimethoprim-like drugs - antimetabolites acting as carbonic anhydrase, dihydropteroate synthase and dihydrofolate reductase inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "dihydropteroate synthase (DHPS) and dihydrofolate reductase"
    explanation: Establishes DHPS and DHFR (the sulfamethoxazole and trimethoprim targets) as the enzymes of bacterial folate synthesis this node represents.
  - reference: PMID:16547571
    reference_title: "Clinical guideline for diagnosis and management of melioidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "oral treatment with a combination of trimethoprim-sulphamethoxazole and doxycycline"
    explanation: TMP-SMX (the DHFR/DHPS-targeting combination) anchors eradication-phase therapy for melioidosis.
- name: Intracellular persistence and eradication-phase requirement
  description: >-
    Unlike classic obligate intracellular pathogens, B. pseudomallei is fully
    susceptible to the cell-wall-active beta-lactams (ceftazidime, carbapenems)
    that anchor the acute intensive phase. Its facultative intracellular
    persistence instead gates the second, eradication phase: because surviving
    intracellular organisms drive relapse and recrudescence, cure requires months
    of oral therapy with cell-penetrant agents (trimethoprim-sulfamethoxazole,
    with doxycycline as an alternative) that reach the intracellular niche.
  role: therapeutic_vulnerability
  conforms_to: "intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials"
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
    modifier: INCREASED
  evidence:
  - reference: PMID:36814569
    reference_title: "Phenotypic and genetic alterations of Burkholderia pseudomallei in patients during relapse and persistent infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of melioidosis requires prolonged antibiotic therapy"
    explanation: Prolonged therapy is required because intracellular B. pseudomallei drives relapse and persistent infection.
  - reference: PMID:21152057
    reference_title: "The epidemiology and clinical spectrum of melioidosis: 540 cases from the 20 year Darwin prospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent melioidosis occurred in 29, mostly attributed to poor adherence to therapy"
    explanation: Recurrence tracks with inadequate eradication-phase therapy, the clinical rationale for the prolonged oral phase.
- name: Intrinsic antibiotic resistance
  description: >-
    B. pseudomallei is intrinsically resistant to many antibiotic classes
    (aminoglycosides, penicillins, polymyxins, macrolides), in large part through
    multidrug efflux pumps of the resistance-nodulation-cell-division (RND)
    family such as AmrAB-OprA. This intrinsic resistance narrows effective therapy
    to ceftazidime, the carbapenems, and co-trimoxazole.
  role: intrinsic_resistance
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
    modifier: INCREASED
  evidence:
  - reference: PMID:34181473
    reference_title: "Conservation of Resistance-Nodulation-Cell Division Efflux Pump-Mediated Antibiotic Resistance in Burkholderia cepacia Complex and Burkholderia pseudomallei Complex Species."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Dominant intrinsic and acquired multidrug resistance mechanisms are efflux mediated by pumps of the resistance-nodulation-cell division (RND) family"
    explanation: RND-family efflux pumps are a dominant intrinsic multidrug-resistance mechanism in the B. pseudomallei complex, narrowing effective therapy. Evidence source is COMPUTATIONAL as the paper infers pump conservation from comparative bioinformatic analysis.
  downstream:
  - target: B. pseudomallei Peptidoglycan Cross-Linking (Beta-Lactam Target)
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Intrinsic resistance excludes most first-line antibiotics, leaving
      ceftazidime and the carbapenems as the viable PBP-directed options — the
      reason those specific agents, not penicillins, anchor the intensive phase.

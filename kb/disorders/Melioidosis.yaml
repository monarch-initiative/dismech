    causal_link_type: DIRECT
    description: Following entry, B. pseudomallei invades host cells and escapes into the cytosol.
- name: Intracellular invasion and phagosomal escape
  description: >-
    B. pseudomallei invades epithelial and phagocytic cells and uses a type III
    secretion system (T3SS-3/Bsa) to escape the endocytic vacuole into the host
    cytosol, where it replicates as a facultative intracellular pathogen.

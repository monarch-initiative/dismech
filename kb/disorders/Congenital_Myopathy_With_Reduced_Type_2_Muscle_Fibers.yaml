    Invasive neonatal endotracheal ventilation followed by tracheostomy-based
    intermittent positive-pressure ventilation (BiPAP) or non-invasive CPAP
    supports respiratory insufficiency, with gradual weaning to partial daytime
    independence reported in surviving children.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Mechanical Ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Respiratory insufficiency due to muscle weakness

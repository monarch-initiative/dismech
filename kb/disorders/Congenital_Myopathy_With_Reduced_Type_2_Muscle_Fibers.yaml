diagnosis:
- name: Muscle biopsy
  diagnosis_term:
    preferred_term: Muscle Biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  description: >-
    Muscle biopsy shows selective type 2 fiber smallness/atrophy with type 1
    predominance, often in a floret pattern, and is the histopathological entry
    point to diagnosis.
  evidence:
  - reference: PMID:40488356
    reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy revealed dystrophic-like or myopathic changes, with notable smallness of fast-twitch type II fibres, often arranged around larger type I fibres, drawing a floret pattern"
    explanation: The characteristic biopsy histopathology is the diagnostic entry point.
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome sequencing identifies biallelic MYL1 variants; RNA analysis of patient
    muscle confirms the splicing consequence of intronic or splice variants.
  evidence:
  - reference: PMID:41568526
    reference_title: Novel MYL1 Intron Variant With Expanded Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNA analysis of patient muscle demonstrated aberrant splicing, with inclusion of 19 bp from intron 4 in most transcripts, resulting in a frameshift and premature stop codon"
    explanation: RNA analysis confirms the pathogenic splicing effect, the molecular route for deep-intronic variants.
- name: Electromyography
  diagnosis_term:
    preferred_term: Electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  description: >-
    Electromyography demonstrates myopathic motor unit potentials (low amplitude
    and short duration) with preserved peripheral nerve conduction and normal
    repetitive nerve stimulation, helping distinguish MYL1-related congenital
    myopathy from neurogenic weakness and congenital myasthenic syndromes.
  evidence:
  - reference: PMID:40488356
    reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies and repetitive nerve stimulation at 3 Hz were normal; low-amplitude and short-duration motor unit potentials, consistent with a myopathy, were found in the electromyography."
    explanation: Electromyography confirms a primary myopathic pattern with normal nerve conduction and neuromuscular junction testing.

discussions:
- discussion_id: upper_limb_sparing_fast_fiber
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why are the fast-twitch-rich proximal upper limbs relatively spared when the
    disease primarily impairs fast (type 2) fibers?
  attaches_to:
  - pathophysiology#Paucity and Atrophy of Type 2 Muscle Fibers
  rationale: >-
    An affected individual retained upper-limb and hand strength relative to the
    lower limbs, which is paradoxical if the lesion were a uniform loss of
    fast-fiber function, and suggests region-specific modifiers or fiber-type
    composition effects not captured by the current model.
  evidence:
  - reference: PMID:40488356
    reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "preserved strength in the upper limbs and hands compared to the lower limbs"
    explanation: Documents the relative upper-limb sparing that motivates the open question.


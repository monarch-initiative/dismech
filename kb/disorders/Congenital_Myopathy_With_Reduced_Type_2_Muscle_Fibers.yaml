name: Congenital Myopathy With Reduced Type 2 Muscle Fibers
creation_date: "2026-10-31T19:20:00Z"
category: Mendelian
synonyms:
- MYL1-related congenital myopathy
- Congenital myopathy 14
- CMYP14
- CMYO14
- myopathy, congenital, with fast-twitch (type II) fiber atrophy
notes: >-
  No GeneReviews chapter covers this disease or its causal gene MYL1 (checked
  with just check-genereviews --online and PubMed genereviews[book], October
  2026); the entry is built on primary literature. OMIM MIM 618414 (CMYP14).
disease_term:
  preferred_term: congenital myopathy with reduced type 2 muscle fibers
  term:
    id: MONDO:0034109
    label: congenital myopathy with reduced type 2 muscle fibers
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound-heterozygous) loss-of-function variants in
    MYL1 cause this congenital myopathy; several reported families were
    consanguineous with homozygous variants.
  evidence:
  - reference: PMID:41568526
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital myopathy-14 (CMYO14) is an ultrarare autosomal recessive disorder caused by biallelic variants in MYL1"
    explanation: States the autosomal recessive, biallelic inheritance of MYL1-related congenital myopathy.

genetic:
- name: MYL1
  gene_term:
    preferred_term: MYL1
    term:
      id: hgnc:7582
      label: MYL1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    MYL1 encodes the fast-skeletal-muscle myosin essential (alkali) light chain
    (ELC; MLC1f/MLC3f). Biallelic loss-of-function variants abolish or severely
    reduce the fast-fiber essential light chain, disrupting type 2 (fast-twitch)
    fiber development and function.
  evidence:
  - reference: PMID:30215711
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified variants in the gene (MYL1) encoding the skeletal muscle fast-twitch specific myosin essential light chain (ELC) in both probands"
    explanation: Identifies MYL1, encoding the fast-twitch myosin essential light chain, as the causal gene.
  variants:
  - name: c.479-2A>G
    description: >-
      Homozygous essential splice acceptor variant predicted to cause skipping
      of exon 5, identified in the first reported proband.
    evidence:
    - reference: PMID:30215711
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous essential splice acceptor variant (c.479-2A > G"
      explanation: Reports the homozygous splice-acceptor variant in the first proband.
  - name: c.488T>G p.(Met163Arg)
    description: >-
      Homozygous missense substitution predicted to impede binding to the IQ
      domain of myosin heavy chain and to destabilize the protein.
    evidence:
    - reference: PMID:30215711
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a homozygous missense substitution (c.488T>G, p.(Met163Arg)) was identified in Proband 2"
      explanation: Reports the homozygous missense variant in the second proband.

pathophysiology:
- name: Biallelic MYL1 Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: MYL1
      term:
        id: hgnc:7582
        label: MYL1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Homozygous or compound-heterozygous loss-of-function variants in MYL1
    (splice, nonsense, frameshift, or destabilizing missense) abolish or severely
    reduce production of the fast-skeletal myosin essential light chain.
  downstream:
  - target: Deficiency of Fast-Skeletal Myosin Essential Light Chain
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30215711
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MYL1 was markedly reduced in skeletal muscle from both probands, suggesting that the missense substitution likely results in an unstable protein"
      explanation: Shows that the pathogenic variants result in markedly reduced MYL1 protein in patient muscle.
- name: Deficiency of Fast-Skeletal Myosin Essential Light Chain
  biological_scale: MOLECULAR
  description: >-
    Loss of the MLC1f/MLC3f essential/alkali light chain destabilizes the fast
    myosin motor complex, impairing assembly and function of type 2 fiber
    sarcomeric myosin.
  biological_processes:
  - preferred_term: striated muscle myosin thick filament assembly
    modifier: DECREASED
    term:
      id: GO:0071688
      label: striated muscle myosin thick filament assembly
  downstream:
  - target: Impaired Fast (Type 2) Fiber Myosin Function
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40488356
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MYL1-related congenital myopathy is an ultra-rare and severe condition, associated with a deficiency of essential/alkali light myosin and impaired development of fast-twitch type II muscle fibres"
      explanation: Links essential/alkali light myosin deficiency to impaired fast-twitch type II fiber development.
    - reference: PMID:8413589
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "removal of light chains from myosin reduces the velocity of actin filaments from 8.8 microns s-1 to 0.8 microns s-1 without significantly decreasing the ATPase activity"
      explanation: In-vitro motility shows the myosin essential/alkali light chain is required for normal actin sliding velocity, the biophysical basis for impaired fast-fiber myosin function when the light chain is lost.
- name: Impaired Fast (Type 2) Fiber Myosin Function
  biological_scale: CELLULAR
  description: >-
    Fast-twitch (type 2) muscle fibers, which depend on the fast myosin essential
    light chain, fail to assemble a functional contractile apparatus, undergo
    aberrant myofibrillogenesis, and express developmental myosin.
  cell_types:
  - preferred_term: fast muscle cell
    term:
      id: CL:0000190
      label: fast muscle cell
  biological_processes:
  - preferred_term: myofibril assembly
    modifier: DECREASED
    term:
      id: GO:0030239
      label: myofibril assembly
  - preferred_term: skeletal muscle fiber development
    modifier: DECREASED
    term:
      id: GO:0048741
      label: skeletal muscle fiber development
  downstream:
  - target: Paucity and Atrophy of Type 2 Muscle Fibers
    causal_link_type: DIRECT
- name: Paucity and Atrophy of Type 2 Muscle Fibers
  biological_scale: TISSUE
  description: >-
    Muscle biopsy shows selective smallness, hypotrophy, atrophy, or near-absence
    of fast-twitch type 2 fibers with type 1 fiber predominance, often with small
    type II fibers arranged around larger type I fibers in a floret pattern.
  cell_types:
  - preferred_term: fast muscle cell
    term:
      id: CL:0000190
      label: fast muscle cell
  evidence:
  - reference: PMID:30215711
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "muscle biopsy showing selective atrophy/hypotrophy or absence of type II myofibres"
    explanation: Describes the selective type II (fast-twitch) fiber atrophy/absence that defines the biopsy phenotype.
  - reference: PMID:40488356
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy revealed dystrophic-like or myopathic changes, with notable smallness of fast-twitch type II fibres, often arranged around larger type I fibres, drawing a floret pattern"
    explanation: Describes the characteristic floret-pattern small type II fibers on biopsy.
  downstream:
  - target: Type 2 muscle fiber atrophy
    causal_link_type: DIRECT
  - target: Congenital Skeletal Muscle Weakness
    causal_link_type: DIRECT
- name: Congenital Skeletal Muscle Weakness
  biological_scale: ORGANISM
  description: >-
    Loss of functional fast-twitch musculature manifests as severe congenital
    hypotonia and generalized weakness, with respiratory insufficiency and
    feeding difficulties frequently requiring ventilatory and nutritional
    support.
  biological_processes:
  - preferred_term: skeletal muscle contraction
    modifier: DECREASED
    term:
      id: GO:0003009
      label: skeletal muscle contraction
  evidence:
  - reference: PMID:40488356
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both individuals showed a very severe congenital myopathy, characterised by congenital hypotonia and weakness, requiring ventilatory and nutritional assistance"
    explanation: Reports the severe congenital hypotonia and weakness with respiratory and feeding involvement.
  downstream:
  - target: Neonatal hypotonia
    causal_link_type: DIRECT
  - target: Generalized muscle weakness
    causal_link_type: DIRECT
  - target: Respiratory insufficiency
    causal_link_type: DIRECT
  - target: Feeding difficulties
    causal_link_type: DIRECT


genetic:
- name: MYL1
  gene_term:
    preferred_term: MYL1
    term:
      id: hgnc:7582
      label: MYL1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    MYL1 encodes the fast-skeletal-muscle myosin essential (alkali) light chain
    (ELC; MLC1f/MLC3f). Biallelic loss-of-function variants (splice, nonsense,
    frameshift, deep-intronic splice-altering, and destabilizing missense)
    abolish or severely reduce the fast-fiber essential light chain, disrupting
    type 2 (fast-twitch) fiber development and function.
  evidence:
  - reference: PMID:30215711
    reference_title: Bi-allelic mutations in MYL1 cause a severe congenital myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified variants in the gene (MYL1) encoding the skeletal muscle fast-twitch specific myosin essential light chain (ELC) in both probands"
    explanation: Identifies MYL1, encoding the fast-twitch myosin essential light chain, as the causal gene.
  variants:
  - name: c.479-2A>G
    description: >-
      Homozygous essential splice acceptor variant predicted to cause skipping
      of exon 5, identified in the first reported proband.
    evidence:
    - reference: PMID:30215711
      reference_title: Bi-allelic mutations in MYL1 cause a severe congenital myopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous essential splice acceptor variant (c.479-2A > G"
      explanation: Reports the homozygous splice-acceptor variant in the first proband.
  - name: c.488T>G p.(Met163Arg)
    description: >-
      Homozygous missense substitution predicted to impede binding to the IQ
      domain of myosin heavy chain and to destabilize the protein.
    evidence:
    - reference: PMID:30215711
      reference_title: Bi-allelic mutations in MYL1 cause a severe congenital myopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a homozygous missense substitution (c.488T>G, p.(Met163Arg)) was identified in Proband 2"
      explanation: Reports the homozygous missense variant in the second proband.
  - name: c.334C>T p.(Gln112Ter) and c.478+1G>A
    description: >-
      Compound-heterozygous nonsense plus essential splice-donor variants
      (Individual 1 of the 2025 series), both leading to premature stop codons.
    evidence:
    - reference: PMID:40488356
      reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the two compound heterozygous MYL1 (NM_079420.3) variants c.334C > T (p.Gln112Ter) and c.478 + 1G > A"
      explanation: Reports the compound-heterozygous nonsense and splice variants in Individual 1.
  - name: c.543del p.(Cys181Ter)
    description: >-
      Homozygous frameshift variant leading to a premature stop codon
      (Individual 2 of the 2025 series).
    evidence:
    - reference: PMID:40488356
      reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a homozygous MYL1 variant c.543del (p.Cys181Ter) in Individual 2"
      explanation: Reports the homozygous frameshift variant in Individual 2.
  - name: c.479-25T>C
    description: >-
      Homozygous deep-intronic splice variant; patient-muscle RNA showed
      aberrant splicing with 19-bp intron-4 inclusion causing a frameshift and
      premature stop codon.
    evidence:
    - reference: PMID:41568526
      reference_title: Novel MYL1 Intron Variant With Expanded Phenotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RNA analysis of patient muscle demonstrated aberrant splicing, with inclusion of 19 bp from intron 4 in most transcripts, resulting in a frameshift and premature stop codon"
      explanation: RNA analysis confirms the deep-intronic variant disrupts splicing, producing a frameshift and premature stop.

pathophysiology:
- name: Biallelic MYL1 Loss of Function
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYL1
    term:
      id: hgnc:7582
      label: MYL1
  genetic_context:
    gene:

    reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By the age of 6 months, multiple attempts to discontinue invasive mechanical ventilation were unsuccessful, leading to the placement of a tracheostomy for intermittent respiratory support with BiPAP."
    explanation: Documents invasive mechanical ventilation and long-term BiPAP respiratory support for congenital respiratory muscle insufficiency.
- name: Enteral tube feeding

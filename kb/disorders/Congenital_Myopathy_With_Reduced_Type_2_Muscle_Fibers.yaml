    reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These fibres expressed developmental myosin and exhibited features of aberrant myofibrillogenesis. Type I myofibres exhibited correct sarcomere alignment, but like the small fast-twitch fibres, both showed distorted cell organelles, vacuolar aggregates and membranous debris, indicating autophagic impairment."
    explanation: Biopsy immunofluorescence and electron microscopy demonstrate arrested fast-fiber myofibrillogenesis with persistent developmental myosin alongside organelle and autophagic abnormalities.
  downstream:

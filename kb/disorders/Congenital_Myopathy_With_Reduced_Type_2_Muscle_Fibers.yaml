name: MYL1-Related Congenital Myopathy
creation_date: "2026-10-31T19:20:00Z"
category: Mendelian
description: >-
  MYL1-related congenital myopathy (congenital myopathy 14; CMYP14) is an
  ultra-rare autosomal recessive neuromuscular disorder caused by biallelic
  loss-of-function variants in MYL1, which encodes the fast-skeletal-muscle
  myosin essential (alkali) light chain (MLC1f/MLC3f). Deficiency of the
  fast-fiber essential light chain impairs assembly and contractile function of
  fast-twitch type 2 myofibrils, leading to arrested myofibrillogenesis with
  persistent developmental myosin expression and selective smallness, atrophy,
  or paucity of type 2 muscle fibers, characteristically arranged in a floret
  pattern around larger type 1 fibers. Affected individuals present
  antenatally and in the neonatal period with reduced fetal movements,
  polyhydramnios, severe generalized hypotonia, facial and bulbar weakness,
  areflexia, and respiratory insufficiency requiring mechanical ventilation and
  enteral nutritional support, whereas cardiac muscle is spared.
synonyms:
- congenital myopathy with reduced type 2 muscle fibers
- Congenital myopathy 14
- CMYP14
- CMYO14
- myopathy, congenital, with fast-twitch (type II) fiber atrophy
parents:
- Congenital myopathy
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Neuromuscular congenital myopathy affecting fast-twitch skeletal muscle
      fibers with neonatal hypotonia, generalized muscle weakness, and
      respiratory insufficiency.
    evidence:
    - reference: PMID:40488356
      reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MYL1-related congenital myopathy is an ultra-rare and severe condition, associated with a deficiency of essential/alkali light myosin and impaired development of fast-twitch type II muscle fibres."
      explanation: Establishes MYL1-related congenital myopathy as a severe congenital skeletal muscle disorder.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Monogenic autosomal recessive sarcomeric myopathy caused by biallelic
      germline variants in MYL1.
    evidence:
    - reference: PMID:41568526
      reference_title: Novel MYL1 Intron Variant With Expanded Phenotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Congenital myopathy-14 (CMYO14) is an ultrarare autosomal recessive disorder caused by biallelic variants in MYL1"
      explanation: Confirms the monogenic autosomal recessive etiology due to biallelic MYL1 variants.
notes: >-
  No GeneReviews chapter covers this disease or its causal gene MYL1 (checked
  with just check-genereviews --online and PubMed genereviews[book], October
  2026); the entry is built on primary literature. OMIM MIM 618414 (CMYP14).
  Fewer than about six affected individuals have been reported, so phenotype
  frequencies are taken from the four-patient summary table in PMID:40488356
  and are approximate. Cardiac involvement is characteristically absent (cardiac
  examination and ECG normal; no cardiomyopathy), consistent with MYL1 being a
  fast-skeletal-muscle-specific light chain.

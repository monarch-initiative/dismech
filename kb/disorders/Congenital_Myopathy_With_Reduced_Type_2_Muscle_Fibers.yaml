  molecular_functions:
  - preferred_term: structural constituent of muscle
    modifier: DECREASED
    term:
      id: GO:0008307
      label: structural constituent of muscle
  description: >-
    Homozygous or compound-heterozygous loss-of-function variants in MYL1
    (splice, nonsense, frameshift, deep-intronic splice-altering, or
    destabilizing missense) abolish or severely reduce production of the
    fast-skeletal myosin essential light chain, the structural light-chain
    component of fast-fiber myosin.
  evidence:
  - reference: PMID:30215711
    reference_title: Bi-allelic mutations in MYL1 cause a severe congenital myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYL1 was markedly reduced in skeletal muscle from both probands, suggesting that the missense substitution likely results in an unstable protein."
    explanation: Demonstrates markedly reduced MYL1 protein abundance in patient skeletal muscle across biallelic MYL1 genotypes.
  - reference: PMID:40488356
    reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Individual 1, immunofluorescence staining for MYL1 revealed a proportion of fibres with reduced fluorescence intensity, with some fibres completely lacking MYL1 expression (Figure 4E). In contrast, Individual 2 showed a complete absence of MYL1 expression in all myofibres"
    explanation: Confirms partial to complete loss of MYL1 protein expression in myofibers of individuals carrying biallelic loss-of-function variants.
  downstream:
  - target: Deficiency of Fast-Skeletal Myosin Essential Light Chain
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30215711
      reference_title: Bi-allelic mutations in MYL1 cause a severe congenital myopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MYL1 was markedly reduced in skeletal muscle from both probands, suggesting that the missense substitution likely results in an unstable protein"
      explanation: Shows that the pathogenic variants result in markedly reduced MYL1 protein in patient muscle.
- name: Deficiency of Fast-Skeletal Myosin Essential Light Chain
  biological_scale: MOLECULAR
  description: >-
    Loss of the MLC1f/MLC3f essential/alkali light chain destabilizes the fast
    myosin motor complex, impairing assembly and function of type 2 fiber
    sarcomeric myosin.
  cell_types:
  - preferred_term: fast muscle cell
    term:
      id: CL:0000190
      label: fast muscle cell
  biological_processes:
  - preferred_term: striated muscle myosin thick filament assembly
    modifier: DECREASED
    term:
      id: GO:0071688
      label: striated muscle myosin thick filament assembly
  evidence:
  - reference: PMID:30215711
    reference_title: Bi-allelic mutations in MYL1 cause a severe congenital myopathy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Protein modelling of the p.(Met163Arg) substitution predicted it might impede intermolecular interactions that facilitate binding to the IQ domain of myosin heavy chain, thus likely impacting on the structure and functioning of the myosin motor."
    explanation: Structural modeling links loss or destabilization of MYL1 to impaired binding at the myosin heavy chain IQ domain and compromised myosin motor assembly.
  - reference: PMID:8413589
    reference_title: Skeletal muscle myosin light chains are essential for physiological speeds of shortening.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "even though the light chains are not essential for enzymatic activity, light-chain/heavy-chain interactions play an important part in the conversion of chemical energy into movement."
    explanation: Reconstitution studies establish that alkali/essential light chain interaction with the myosin heavy chain neck is required for physiological mechanical transduction.
  downstream:
  - target: Impaired Fast (Type 2) Fiber Myosin Function
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40488356
      reference_title: "MYL1-Related Congenital Myopathy: Clinical, Genetic and Pathological Insights."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MYL1-related congenital myopathy is an ultra-rare and severe condition, associated with a deficiency of essential/alkali light myosin and impaired development of fast-twitch type II muscle fibres"
      explanation: Links essential/alkali light myosin deficiency to impaired fast-twitch type II fiber development.
    - reference: PMID:8413589
      reference_title: Skeletal muscle myosin light chains are essential for physiological speeds of shortening.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "removal of light chains from myosin reduces the velocity of actin filaments from 8.8 microns s-1 to 0.8 microns s-1 without significantly decreasing the ATPase activity"
      explanation: In-vitro motility shows the myosin essential/alkali light chain is required for normal actin sliding velocity, the biophysical basis for impaired fast-fiber myosin function when the light chain is lost.
- name: Impaired Fast (Type 2) Fiber Myosin Function
  biological_scale: CELLULAR
  description: >-
    Fast-twitch (type 2) muscle fibers, which depend on the fast myosin essential
    light chain, fail to assemble a functional contractile apparatus, undergo
    aberrant myofibrillogenesis, and express developmental myosin.
  cell_types:
  - preferred_term: fast muscle cell
    term:
      id: CL:0000190

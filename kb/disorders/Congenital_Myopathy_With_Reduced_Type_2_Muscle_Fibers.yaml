prevalence:
- population: Worldwide (reported cases in the literature)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare; only a handful of affected individuals with biallelic MYL1
    variants had been reported at the time of curation.
  evidence:
  - reference: PMID:41568526
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital myopathy-14 (CMYO14) is an ultrarare autosomal recessive disorder caused by biallelic variants in MYL1, with only four patients reported to date"
    explanation: States the ultra-rare status and small number of reported cases.

treatments:
- name: Supportive care (respiratory and nutritional support)
  description: >-
    Management is supportive, centered on ventilatory support for respiratory
    insufficiency and nutritional support for feeding difficulties; no
    disease-specific therapy exists.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40488356
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterised by congenital hypotonia and weakness, requiring ventilatory and nutritional assistance"
    explanation: Affected individuals require ventilatory and nutritional support, the mainstay of management.

animal_models:
- name: myl1 knockdown zebrafish
  species: Zebrafish
  description: >-
    Morpholino knockdown of myl1 in zebrafish produces abnormal morphology,
    disrupted muscle structure, and impaired touch-evoked escape responses,
    confirming the fast-twitch essential light chain is critical for myofibre
    development and function.
  modeled_mechanisms:
  - target: Impaired Fast (Type 2) Fiber Myosin Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Loss of myl1 disrupts fast-fiber muscle structure and function, modeling
      the human fast-fiber defect.
    limitations: >-
      Transient morpholino knockdown in a non-mammalian embryo; fiber-type
      specialization and the chronic human disease course are not fully
      recapitulated.
    evidence:
    - reference: PMID:30215711
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knock down of myl1 in zebrafish resulted in abnormal morphology, disrupted muscle structure and impaired touch-evoked escape responses"
      explanation: Zebrafish myl1 knockdown recapitulates disrupted muscle structure and function.

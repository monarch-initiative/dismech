discussions:
- discussion_id: gap_agat_epilepsy_spectrum
  prompt: >-
    Is epilepsy a reproducible AGAT deficiency manifestation, and if so, how do
    low cerebral creatine, structural brain changes, and inhibitory
    neurotransmission contribute?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cerebral Creatine Depletion
  - phenotypes#Seizure
  rationale: >-
    GeneReviews summarized the original 16 reported individuals as having no
    epilepsy, whereas two 2025 studies reported focal, sensory, febrile, and
    temperature-related seizures. The new series are small and do not establish
    prevalence, a causal mechanism, or a seizure-specific creatine response.
  evidence:
  - reference: PMID:20301745
    reference_title: Creatine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AGAT deficiency has been reported in 16 individuals; none have had epilepsy or movement disorders.
    explanation: The historical cohort boundary did not include epilepsy.
  - reference: PMID:40674085
    reference_title: "Epilepsy expands the phenotype of L-arginine:glycine amidinotransferase deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study presents the first cases of epilepsy in AGAT deficiency, suggesting its prevalence may be underestimated.
    explanation: New cases support spectrum expansion while leaving prevalence and mechanism unresolved.
- discussion_id: gap_agat_pregnancy_creatine_requirements
  prompt: >-
    How should creatine dose and biochemical targets be adjusted during
    pregnancy in people with AGAT deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Pregnancy-specific creatine monitoring
  rationale: >-
    The only detailed pregnancy report found declining maternal creatine and
    adjusted the dose, but a single case cannot define universal targets or
    prove that earlier or higher dosing changes fetal growth.
  evidence:
  - reference: PMID:32883247
    reference_title: "Increased creatine demand during pregnancy in Arginine: Glycine Amidino-Transferase deficiency: a case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From these data, however, it cannot be stated if a higher Cr dose or an earlier supplementation would have avoided the slight growth delay observed in the fetus.
    explanation: The authors explicitly identify the limits of the single-case dosing inference.

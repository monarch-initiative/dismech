name: AGAT Deficiency
category: Mendelian
creation_date: '2026-05-03T00:00:00Z'
synonyms:
- L-arginine:glycine amidinotransferase deficiency
- Arginine:glycine amidinotransferase deficiency
- GATM deficiency
- Cerebral creatine deficiency syndrome type 3
- CCDS3
description: >-
  AGAT deficiency is an autosomal recessive cerebral creatine biosynthesis
  disorder caused by biallelic loss-of-function pathogenic variants in GATM,
  which encodes L-arginine:glycine amidinotransferase. Reduced AGAT activity
  lowers guanidinoacetate and endogenous creatine synthesis, producing low
  guanidinoacetate and creatine in body fluids and reduced cerebral creatine on
  proton magnetic resonance spectroscopy. The clinical spectrum is dominated
  by developmental, cognitive, speech-language, and skeletal-muscle
  manifestations. AGAT deficiency is highly responsive to oral creatine
  monohydrate, particularly when treatment begins early.

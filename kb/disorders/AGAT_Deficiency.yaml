    reference_title: "Laboratory diagnosis of creatine deficiency syndromes: a technical standard and guideline of the American College of Medical Genetics and Genomics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several laboratory methods are available for preliminary and confirmatory diagnosis of these conditions, including measurement of creatine and related metabolites in biofluids using liquid chromatography-tandem mass spectrometry or gas chromatography-mass spectrometry, enzyme activity assays in cultured cells, and DNA sequence analysis.
    explanation: The ACMG laboratory guideline supports metabolite testing as part of preliminary and confirmatory diagnosis.
- name: Brain proton magnetic resonance spectroscopy
  description: >-
    Proton MRS evaluates the cerebral creatine peak. An absent or markedly
    reduced peak supports a cerebral creatine deficiency syndrome but must be
    interpreted with metabolite and molecular results.
  markers: Cerebral creatine peak
  results: Absent or markedly reduced cerebral creatine supports a cerebral creatine deficiency syndrome.
  evidence:
  - reference: PMID:36856349
    reference_title: "Creatine Deficiency Disorders: Phenotypes, Genotypes, Diagnosis, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic investigations such as targeted next-generation sequencing panel or exome sequencing can also identify these disorders; however, metabolite measurements and creatine in proton magnetic resonance spectroscopy are crucial to confirm the diagnosis.
    explanation: The review supports MRS as a key confirmatory component when combined with metabolite testing.
- name: Molecular confirmation of biallelic GATM variants
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: MAXO:0000127
      label: genetic testing
  description: >-
    Targeted next-generation sequencing panels or exome sequencing can identify
    biallelic pathogenic GATM variants.
  results: Biallelic pathogenic GATM variants establish the molecular diagnosis in a compatible phenotype.
  evidence:
  - reference: PMID:20301745
    reference_title: Creatine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of a CDD is established in a proband with suggestive findings and biallelic pathogenic variants in GAMT or GATM or a hemizygous or heterozygous pathogenic variant in SLC6A8 identified by molecular genetic testing.
    explanation: GeneReviews directly supports molecular confirmation with biallelic GATM variants.
  - reference: PMID:36856349
    reference_title: "Creatine Deficiency Disorders: Phenotypes, Genotypes, Diagnosis, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic investigations such as targeted next-generation sequencing panel or exome sequencing can also identify these disorders; however, metabolite measurements and creatine in proton magnetic resonance spectroscopy are crucial to confirm the diagnosis.
    explanation: The review supports panel or exome sequencing while retaining biochemical and MRS confirmation.
- name: AGAT enzyme activity assay in cultured cells
  description: >-
    A validated cultured-cell enzyme assay can provide functional confirmation
    when molecular findings require clarification.
  markers: AGAT enzymatic activity
  results: Absent or markedly reduced AGAT activity supports a functional GATM defect.
  evidence:
  - reference: PMID:22386973
    reference_title: Developmental progress and creatine restoration upon long-term creatine supplementation of a patient with arginine:glycine amidinotransferase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AGAT activity was not detectable in lymphoblasts and RNA analysis revealed a truncated mRNA (r.289_484del196) that is degraded via Nonsense Mediated Decay.
    explanation: Patient lymphoblasts provide direct functional confirmation.
differential_diagnoses:
- name: Guanidinoacetate methyltransferase deficiency
  disease_term:
    preferred_term: guanidinoacetate methyltransferase deficiency
    term:
      id: MONDO:0012999
      label: guanidinoacetate methyltransferase deficiency
  description: >-
    GAMT deficiency also causes low cerebral and body-fluid creatine, but
    guanidinoacetate is elevated rather than low and epilepsy is much more
    characteristic.
  distinguishing_features:
  - Elevated guanidinoacetate with low creatine in GAMT deficiency
  - Low guanidinoacetate with low creatine in AGAT deficiency
  evidence:
  - reference: PMID:36856349
    reference_title: "Creatine Deficiency Disorders: Phenotypes, Genotypes, Diagnosis, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis can be suspected by elevated guanidinoacetate and low creatine levels in body fluids in guanidinoacetate methyltransferase deficiency, low guanidinoacetate and low creatine levels in body fluids in l-arginine:glycine amidinotransferase deficiency, and elevated creatine-to-creatinine ratio in urine in creatine transporter deficiency in males as well as absent or significantly decreased creatine level in brain proton magnetic resonance spectroscopy.
    explanation: The review directly contrasts the biochemical patterns.
- name: Creatine transporter deficiency
  disease_term:
    preferred_term: creatine transporter deficiency
    term:
      id: MONDO:0010305
      label: creatine transporter deficiency
  description: >-
    SLC6A8-related creatine transporter deficiency shares low cerebral creatine
    and neurodevelopmental features but typically shows an elevated urinary
    creatine-to-creatinine ratio in affected males rather than low
    guanidinoacetate.
  distinguishing_features:
  - X-linked SLC6A8 inheritance
  - Elevated urinary creatine-to-creatinine ratio in affected males
  - Low guanidinoacetate is characteristic of AGAT deficiency
  evidence:
  - reference: PMID:36856349
    reference_title: "Creatine Deficiency Disorders: Phenotypes, Genotypes, Diagnosis, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hemizygous pathogenic variant in males and heterozygous pathogenic variant in females in SLC6A8 result in creatine transporter deficiency.
    explanation: This supports the X-linked molecular distinction.
  - reference: PMID:36856349
    reference_title: "Creatine Deficiency Disorders: Phenotypes, Genotypes, Diagnosis, and Treatment Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis can be suspected by elevated guanidinoacetate and low creatine levels in body fluids in guanidinoacetate methyltransferase deficiency, low guanidinoacetate and low creatine levels in body fluids in l-arginine:glycine amidinotransferase deficiency, and elevated creatine-to-creatinine ratio in urine in creatine transporter deficiency in males as well as absent or significantly decreased creatine level in brain proton magnetic resonance spectroscopy.
    explanation: The biochemical comparison distinguishes the transporter disorder from AGAT deficiency.
- name: Autosomal dominant GATM-associated renal Fanconi syndrome
  description: >-
    Monoallelic GATM variants cause a distinct renal tubular and kidney failure
    disorder. This must not be conflated with biallelic loss-of-function AGAT
    deficiency.
  distinguishing_features:
  - Autosomal dominant monoallelic GATM missense variants
  - Renal Fanconi syndrome and progressive kidney failure
  evidence:
  - reference: PMID:29654216
    reference_title: Glycine Amidinotransferase (GATM), Renal Fanconi Syndrome, and Kidney Failure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The renal disease in these patients resulted from monoallelic mutations in the gene encoding glycine amidinotransferase (GATM), a renal proximal tubular enzyme in the creatine biosynthetic pathway that is otherwise associated with a recessive disorder of creatine deficiency.
    explanation: The renal study directly separates the monoallelic renal disorder from recessive creatine deficiency.

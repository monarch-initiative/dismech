biochemical:
- name: AGAT enzyme activity in cultured cells
  presence: DECREASED
  context: >-
    Absent or markedly reduced AGAT activity in a validated cultured-cell assay
    can functionally confirm the GATM defect.
  readouts:
  - target: GATM Loss and Reduced AGAT Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reduced enzyme activity directly reports the proximal molecular defect.
    evidence:
    - reference: PMID:22386973
      reference_title: Developmental progress and creatine restoration upon long-term creatine supplementation of a patient with arginine:glycine amidinotransferase deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        AGAT activity was not detectable in lymphoblasts and RNA analysis revealed a truncated mRNA (r.289_484del196) that is degraded via Nonsense Mediated Decay.
      explanation: Patient lymphoblasts directly demonstrate the diagnostic enzyme-activity readout.
  evidence:
  - reference: PMID:22386973

progression:
- phase: Infancy presentation
  notes: >-
    Onset is generally in infancy. In the international cohort, the
    post-neonatally diagnosed patients had intellectual disability or
    developmental delay, and half also had myopathy or proximal weakness.
  evidence:
  - reference: ORPHA:35704
    reference_title: L-Arginine:glycine amidinotransferase deficiency
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Infancy"
    explanation: Orphanet records infancy as the age of onset.
  - reference: PMID:26490222
    reference_title: "Arginine:glycine amidinotransferase (AGAT) deficiency: Clinical features and long term outcomes in 16 patients diagnosed worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      16 patients from 8 families of 8 different ethnic backgrounds were included. 1 patient was asymptomatic when diagnosed at age 3 weeks. 15 patients diagnosed between 16 months and 25 years of life had intellectual disability/developmental delay (IDD). 8 patients also had myopathy/proximal muscle weakness.
    explanation: The largest published cohort defines the observed untreated or later-diagnosed presentation.
- phase: Early-treated or presymptomatic course
  notes: >-
    Diagnosis in the neonatal period or early infancy permits treatment before
    fixed neurodevelopmental impairment. The small published cohort supports
    normal later development in two children treated from infancy.
  evidence:
  - reference: PMID:26490222
    reference_title: "Arginine:glycine amidinotransferase (AGAT) deficiency: Clinical features and long term outcomes in 16 patients diagnosed worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 patients treated since age 4 and 16 months had normal cognitive and behavioral development at age 10 and 11 years.
    explanation: Two early-treated children had normal cognitive and behavioral development at long follow-up.
- phase: Later-treated course
  notes: >-
    Creatine treatment can restore cerebral creatine and improve myopathy after
    later diagnosis, while cognitive recovery is generally incomplete.
  evidence:
  - reference: PMID:28148286
    reference_title: Fifteen-year follow-up of Italian families affected by arginine glycine amidinotransferase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early treatment prevents adverse developmental outcome, while patients diagnosed and treated at an older age showed partial but significant cognitive recovery with clear improvements in adaptive functioning.
    explanation: Long-term follow-up separates prevention with early treatment from partial recovery after later treatment.
mechanistic_hypotheses:
- hypothesis_group_id: agat_creatine_biosynthesis_model
  hypothesis_label: GATM Loss and Creatine Biosynthesis Failure Model
  status: CANONICAL
  description: >-
    Biallelic loss-of-function GATM variants reduce AGAT catalytic activity,
    lowering production of guanidinoacetate and endogenous creatine and thereby
    depleting cerebral creatine.
  evidence:
  - reference: PMID:27233232
    reference_title: Arginine-Glycine Amidinotransferase Deficiency and Functional Characterization of Missense Variants in GATM.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found seven missense variants retaining 0% of wild-type GATM activity indicating putative pathogenicity.
    explanation: Variant functional assays establish loss of AGAT activity.
  - reference: PMID:26490222
    reference_title: "Arginine:glycine amidinotransferase (AGAT) deficiency: Clinical features and long term outcomes in 16 patients diagnosed worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common biochemical denominators were low/undetectable guanidinoacetate (GAA) concentrations in urine and plasma, and low/undetectable cerebral creatine levels.
    explanation: Human cohort biochemistry establishes the characteristic downstream metabolite pattern.
- hypothesis_group_id: cerebral_creatine_energy_buffering_model
  hypothesis_label: Cerebral Creatine Depletion and Energy-Buffering Model
  status: EMERGING
  description: >-
    Cerebral creatine depletion is directly measured, and creatine is central
    to phosphocreatine-mediated ATP buffering. Treatment timing and response
    support a contribution to neurodevelopmental impairment, but the proposed
    energy-buffering intermediate has not been directly measured in human AGAT
    brain tissue.
  evidence:
  - reference: PMID:32883247
    reference_title: "Increased creatine demand during pregnancy in Arginine: Glycine Amidino-Transferase deficiency: a case report."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Cr, an amino acid derivative, is one of the most important sources of energy due to its primary function as both a spatial and temporal energy buffer. By way of the phosphorylated analogue phosphocreatine (PCr) and creatine kinase (CK) it transfers high energy groups from mitochondria to sites of consumption and regenerates ATP from ADP.
    explanation: This supports the general biochemical interpretation, not direct demonstration in affected human brain.
  - reference: PMID:28148286
    reference_title: Fifteen-year follow-up of Italian families affected by arginine glycine amidinotransferase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consecutive MRS examinations have confirmed that Cr depletion in AGAT-d patients is reversible under Cr supplementation.
    explanation: Treatment-linked MRS recovery supports relevance of the measured depletion without proving the inferred intermediate.
- hypothesis_group_id: systemic_creatine_myopathy_model
  hypothesis_label: Systemic Creatine Deficiency and Myopathy Model
  status: EMERGING
  description: >-
    Proximal weakness and myopathy co-occur with the low-creatine biochemical
    state and improve with oral creatine. Human studies did not directly measure
    restoration of a skeletal-muscle creatine pool, so that intermediate is not
    asserted as established.
  evidence:
  - reference: PMID:23770102
    reference_title: Creatine deficiency syndrome. A treatable myopathy due to arginine-glycine amidinotransferase (AGAT) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen months after beginning the treatment with oral creatine monohydrate 200mg/kg/day, then 400mg/kg/day, there was a dramatic improvement in muscle strength with Gowers sign disappearance in both patients, and a mild improvement in language and cognitive functions.
    explanation: Clinical treatment response supports a creatine-responsive muscle branch.
- hypothesis_group_id: agat_epilepsy_model
  hypothesis_label: Emerging AGAT-Associated Epilepsy Model
  status: EMERGING
  description: >-
    Focal and temperature-related seizures were reported in small 2025 series.
    Low brain creatine and altered inhibitory neurotransmission are proposed,
    but the mechanism and any seizure-specific effect of creatine treatment
    remain unresolved.
  evidence:
  - reference: PMID:40674085
    reference_title: "Epilepsy expands the phenotype of L-arginine:glycine amidinotransferase deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Definitive conclusions on the role of creatine supplementation in epilepsy associated with AGAT deficiency cannot be drawn, as it was not modified after seizure onset in the first proband and introduced only after seizure control in the second.
    explanation: The clinical report explicitly preserves uncertainty about treatment and causal mechanism.

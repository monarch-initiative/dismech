      The developmental delay, intellectual disability, and behavior problems are managed with an individualized education and therapy program; epilepsy and movement disorder are treated by the appropriate specialist in a standard manner.
    explanation: GeneReviews supports consequence-directed developmental and neurologic care.
- name: Creatine treatment surveillance
  action_category: MONITORING
  description: >-
    Periodically assess cerebral creatine by in vivo proton MRS, measure kidney
    function annually, and perform developmental and neurologic assessment at
    each clinic visit. Monitor weight and symptoms of nephrolithiasis during
    high-dose creatine treatment.
  evidence:
  - reference: PMID:20301745
    reference_title: Creatine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In those treated with creatine monohydrate, periodic determination of cerebral creatine level by in vivo 1H-MRS and annual measurement of kidney function to detect possible creatine-associated nephropathy is warranted. Developmental and neurologic assessments are recommended at each clinic visit.
    explanation: GeneReviews defines longitudinal MRS, renal, developmental, and neurologic surveillance.
  - reference: PMID:28148286
    reference_title: Fifteen-year follow-up of Italian families affected by arginine glycine amidinotransferase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cr treatment is considered safe and well tolerated but side effects, including weight gain and kidney stones, have been reported.
    explanation: Long-term follow-up supports monitoring for weight gain and nephrolithiasis.
- name: Testing of at-risk newborn relatives
  action_category: SCREENING
  description: >-
    Biochemical or familial-variant testing of at-risk neonates enables
    presymptomatic diagnosis and early treatment.
  evidence:
  - reference: PMID:20301745
    reference_title: Creatine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Early diagnosis of neonates at risk for a CDD by biochemical or molecular genetic testing allows for early diagnosis and treatment.
    explanation: GeneReviews supports prompt testing of at-risk neonates.
- name: Genetic counseling and reproductive planning
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counsel families about autosomal recessive recurrence, carrier testing, and
    prenatal or preimplantation testing after familial variants are known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
  evidence:
  - reference: PMID:20301745
    reference_title: Creatine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If both parents are known to be heterozygous for a GAMT or GATM pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: GeneReviews provides the autosomal recessive recurrence risks used in counseling.
- name: Pregnancy-specific creatine monitoring
  action_category: MONITORING
  description: >-
    A single reported pregnancy showed falling maternal urine and plasma
    creatine and dose adjustment. Pregnancy may increase creatine requirements;
    maternal metabolites and fetal growth should be followed with metabolic and
    obstetric specialist input, without assuming that every pregnancy requires
    dose escalation.
  evidence:
  - reference: PMID:32883247
    reference_title: "Increased creatine demand during pregnancy in Arginine: Glycine Amidino-Transferase deficiency: a case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical monitoring of Cr in biological fluids of the mother revealed a decline of the Cr concentrations, in particular in the urine sample, requiring prompt correction of the Cr dose.
    explanation: One case supports individualized biochemical monitoring and dose review during pregnancy.

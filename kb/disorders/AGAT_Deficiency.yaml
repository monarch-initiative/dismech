treatments:
- name: Oral creatine monohydrate supplementation
  action_category: THERAPEUTIC
  description: >-
    Oral creatine monohydrate bypasses impaired endogenous synthesis and is the
    disease-directed therapy. Published cohorts used 100–800 mg/kg/day, but this
    is an observed range rather than a universal prescription; dosing should be
    individualized by a metabolic specialist. Early treatment can prevent
    adverse developmental outcome, while later treatment can restore cerebral
    creatine, improve myopathy, and yield partial adaptive or cognitive gains.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: MAXO:0000106
      label: nutritional supplementation
    therapeutic_agent:
    - preferred_term: creatine
      term:
        id: CHEBI:16919
        label: creatine
  target_mechanisms:
  - target: Cerebral Creatine Depletion
    treatment_effect: RESTORES
    description: Oral creatine replenishes the measured cerebral creatine pool.
    evidence:
    - reference: PMID:28148286
      reference_title: Fifteen-year follow-up of Italian families affected by arginine glycine amidinotransferase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Consecutive MRS examinations have confirmed that Cr depletion in AGAT-d patients is reversible under Cr supplementation.
      explanation: Serial MRS directly supports restoration of cerebral creatine.
  target_phenotypes:
  - preferred_term: Reduced brain creatine level by MRS
    term:
      id: HP:0025051
      label: Reduced brain creatine level by MRS
  - preferred_term: Muscle weakness
    term:
      id: HP:0001324
      label: Muscle weakness
  - preferred_term: Myopathy
    term:
      id: HP:0003198
      label: Myopathy
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:20301745
    reference_title: Creatine Deficiency Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GAMT deficiency and AGAT deficiency are treated with oral creatine monohydrate to replenish cerebral creatine levels.
    explanation: GeneReviews identifies oral creatine as disease-directed treatment.
  - reference: PMID:26490222
    reference_title: "Arginine:glycine amidinotransferase (AGAT) deficiency: Clinical features and long term outcomes in 16 patients diagnosed worldwide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with creatine monohydrate (100-800 mg/kg/day) resulted in almost complete restoration of brain creatine levels and significant improvement of myopathy.
    explanation: Cohort data support the published dosing range and major biochemical and muscle responses.
  - reference: PMID:28148286
    reference_title: Fifteen-year follow-up of Italian families affected by arginine glycine amidinotransferase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early treatment prevents adverse developmental outcome, while patients diagnosed and treated at an older age showed partial but significant cognitive recovery with clear improvements in adaptive functioning.
    explanation: Long-term follow-up supports the importance of timing and residual benefit after later treatment.

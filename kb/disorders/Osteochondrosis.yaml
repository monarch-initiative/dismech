  presence: Possible
  description: >
    Household secondhand smoke exposure is a significant, dose-associated risk
    factor for Legg-Calve-Perthes disease in a prospective case-control study;
    proposed to represent an "unknown industrial factor" acting on the same
    ischemic mechanism as the articular family (e.g., via vasoconstriction or
    impaired microcirculation), though a firm mechanistic link is not
    established. No ECTO term for secondhand/environmental tobacco smoke
    exposure was found in the local cache or via a targeted OAK search at
    curation time.

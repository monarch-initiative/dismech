name: Osteochondrosis
creation_date: "2026-08-26T00:00:00Z"
category: Complex
description: >
  Osteochondrosis is a group of disorders of growing bone in which disturbance
  of endochondral ossification at an epiphysis or apophysis leads to necrosis,
  fragmentation, and subsequent repair/remodeling. MONDO places the term as a
  child of osteonecrosis (osteochondrosis "not specified as adult or juvenile,
  of unspecified site"), but the classical (Siffert) nosology in fact splits
  the family into three mechanistically distinct groups, which this entry
  models as three separate pathophysiology chains rather than one lumped
  cascade: (1) an articular/epiphyseal group in which cartilage-canal vessel
  failure causes true ischemic chondronecrosis (Legg-Calve-Perthes disease,
  Kohler disease, Freiberg infraction, and osteochondritis dissecans); (2) a
  non-articular apophyseal group driven by repetitive tensile traction at a
  tendon insertion, not primary ischemia (Osgood-Schlatter disease, Sever
  disease); and (3) a physeal/endplate group driven by compressive
  growth-cartilage failure at the vertebral ring apophysis (Scheuermann
  kyphosis). Only the first group is truly ischemic/necrotic; the apophyseal
  and physeal groups are grouped with osteochondrosis by clinical convention
  (shared growing-bone, self-limited-then-remodeling phenotype) rather than by
  a shared vascular mechanism. Kohler disease is already curated as its own
  dismech entry (kb/disorders/Osteochondritis_of_Tarsal_Metatarsal_Bone.yaml,
  MONDO:0016086) and is cross-referenced here by name rather than duplicated.
disease_term:
  preferred_term: osteochondrosis
  term:
    id: MONDO:0018381
    label: osteochondrosis
parents:
- Osteonecrosis
- Bone disease
synonyms:
- Osteochondrosis not specified as adult or juvenile, of unspecified site
- Juvenile osteochondrosis
- Osteochondroses
has_subtypes:
- name: Legg-Calve-Perthes Disease
  display_name: Legg-Calve-Perthes Disease (Femoral Head)
  subtype_term:
    preferred_term: Legg-Calve-Perthes disease
    term:
      id: MONDO:0007885
      label: Legg-Calve-Perthes disease
  description: >
    Idiopathic juvenile osteonecrosis of the femoral head, the prototypical and
    most-studied member of the articular/epiphyseal osteochondrosis family.
    Reported prevalence ranges from 0.4 to 29.0 per 100,000 children under 15
    years of age, with a peak incidence between 4 and 8 years and a male
    predominance. Etiology remains debated: mechanically induced ischemia of
    the capital femoral epiphysis is the best-supported theory, with additional
    evidence for a thrombotic/coagulation component and, rarely, a Mendelian
    type II collagenopathy phenocopy (COL2A1).
  evidence:
  - reference: PMID:30918798
    reference_title: "Aetiology of Legg-Calve-Perthes disease: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its prevalence is set to be between 0.4/100000 to 29.0/100000 children less than 15 years of age with a peak of incidence in children aged from 4 years to 8 years."
    explanation: >
      Systematic review reporting the population prevalence range and peak
      age of onset for Legg-Calve-Perthes disease.
- name: Osgood-Schlatter Disease
  display_name: Osgood-Schlatter Disease (Tibial Tuberosity)
  subtype_term:
    preferred_term: Osgood-Schlatter disease
    term:
      id: MONDO:0004241
      label: Osgood-Schlatter disease
  description: >
    Traction apophysitis of the tibial tuberosity, the prototypical member of
    the non-articular apophyseal osteochondrosis family. It is the most common
    knee osteochondrosis in sport-practicing children and adolescents, with
    reported prevalence around 9.8% and bilateral involvement in 20-30% of
    affected individuals. Onset coincides with appearance of the tibial
    tuberosity secondary ossification center and is linked to sports with an
    explosive/jumping component; the mechanism is repetitive tensile traction
    at the patellar tendon insertion rather than primary ischemia.
  evidence:
  - reference: PMID:35740763
    reference_title: "The Etiology and Risk Factors of Osgood-Schlatter Disease: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of OD is 9.8%, and it can be bilateral in 20–30% of patients"
    explanation: >
      Systematic review reporting population prevalence and rate of bilateral
      involvement for Osgood-Schlatter disease.
- name: Sever Disease
  display_name: Sever Disease (Calcaneal Apophysis)
  subtype_term:
    preferred_term: Sever disease (calcaneal apophysitis)
  description: >
    Traction apophysitis of the calcaneal apophysis at the Achilles tendon
    insertion, the second member of the non-articular apophyseal family. No
    MONDO term currently exists for this concept (OLS/Ontobee search returns
    no MONDO hit), so this subtype is modeled with a free-text
    `subtype_term.preferred_term` only. It is a common cause of heel pain in
    children and young athletes aged 8 to 15 with immature skeletons, arising
    from repetitive microtrauma to the secondary ossification center by
    traction of the Achilles tendon insertion, often compounded by
    triceps-surae tightness from a growth-rate mismatch between bone and
    muscle-tendon length.
  evidence:
  - reference: PMID:28722957
    reference_title: "Sever Disease (Calcaneal Apophysitis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sever disease results from repetitive microtrauma to the secondary ossification center by traction of the Achilles tendon insertion on the calcaneus."
    explanation: >
      Establishes the traction-apophysitis mechanism and anatomic site for
      Sever disease.
- name: Kohler Disease
  display_name: Kohler Disease (Navicular)
  subtype_term:
    preferred_term: osteochondritis of tarsal/metatarsal bone
    term:
      id: MONDO:0016086
      label: osteochondritis of tarsal/metatarsal bone
  description: >
    Ischemic osteochondrosis of the tarsal navicular, a member of the
    articular/epiphyseal family. Curated as its own dismech entry — see
    kb/disorders/Osteochondritis_of_Tarsal_Metatarsal_Bone.yaml for full
    phenotype, evidence, and treatment content (which also disambiguates it
    from adult Muller-Weiss disease and from Freiberg disease). Included here
    only for completeness of the site-based osteochondrosis subtype list; not
    duplicated.
  review_notes: >
    No new evidence added on this subtype; content lives entirely in the
    linked standalone entry to avoid duplication.
- name: Freiberg Infraction
  display_name: Freiberg Infraction (Second Metatarsal Head)
  subtype_term:
    preferred_term: Freiberg infraction
    term:
      id: MONDO:0023188
      label: Freiberg disease
  description: >
    Ischemic osteochondrosis of the second metatarsal head, a member of the
    articular/epiphyseal family. It is the fourth most common form of primary
    osteochondrosis, with a strong predilection for adolescent athletic
    females, though it has been reported across a wide age range. Like other
    members of the articular family it is generally self-limited when treated
    early, resolving with nonoperative management.
  evidence:
  - reference: PMID:30685014
    reference_title: "Freiberg Disease and Avascular Necrosis of the Metatarsal Heads."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Freiberg disease is characterized as osteochondrosis of the second metatarsal head. It is the fourth most common form of primary osteochondrosis with a significant predilection to the adolescent athletic female population"
    explanation: >
      Defines the anatomic site and relative frequency/demographic
      predilection of Freiberg disease among the primary osteochondroses.
- name: Scheuermann Kyphosis
  display_name: Scheuermann Kyphosis (Vertebral Ring Apophyses)
  subtype_term:
    preferred_term: Scheuermann kyphosis
    term:
      id: MONDO:0008410
      label: Scheuermann disease
  description: >
    Structural thoracic kyphosis of the physeal/endplate osteochondrosis
    family, diagnosed radiographically by Sorensen's criteria (at least three
    consecutive vertebrae wedged by five degrees or more at the apex of the
    deformity). Population prevalence is approximately 2.8% (2.1% in women,
    3.6% in men), and a Danish twin-registry study estimated heritability at
    74%, indicating a major genetic contribution distinct from the primarily
    biomechanical apophyseal family. Unlike Legg-Calve-Perthes disease,
    Osgood-Schlatter disease, and Sever disease, this subtype is not driven by
    vascular ischemia or tendon traction but by compressive failure of the
    cartilaginous vertebral endplate and ring apophysis.
  evidence:
  - reference: PMID:17015588
    reference_title: "Prevalence, concordance, and heritability of Scheuermann kyphosis based on a study of twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the overall prevalence of Scheuermann disease was 2.8%, with a prevalence of 2.1% among women and 3.6% among men"
    explanation: >
      Danish Twin Registry study establishing population prevalence and sex
      distribution of Scheuermann kyphosis.
  - reference: PMID:17015588
    reference_title: "Prevalence, concordance, and heritability of Scheuermann kyphosis based on a study of twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These differences were significant (p < 0.01). Heritability was 74%."
    explanation: >
      Reports the heritability estimate that distinguishes Scheuermann
      kyphosis from the mechanically-dominant apophyseal osteochondroses.
- name: Osteochondritis Dissecans
  display_name: Osteochondritis Dissecans (Articular Surface)
  subtype_term:
    preferred_term: osteochondritis dissecans
    term:
      id: MONDO:0017178
      label: osteochondritis dissecans
  description: >
    Acquired focal lesion of subchondral bone and overlying articular
    cartilage, most commonly of the knee, elbow, or ankle, that can progress
    to a detached osteochondral fragment (loose body) and secondary
    osteoarthritis. Experimental (foal) and human cadaveric/CT-histology
    studies support the same ischemic-chondronecrosis mechanism as the rest of
    the articular osteochondrosis family: failure of epiphyseal cartilage-canal
    blood supply causes focal chondronecrosis and a delay in endochondral
    ossification (osteochondrosis), which can subsequently progress to
    pathological cartilage fracture (osteochondritis dissecans).
  review_notes: >
    Deliberate divergence from current MONDO structure, recorded per the
    curation-brief guidance on issue #8963: in MONDO, osteochondritis
    dissecans (MONDO:0017178) is classified under MONDO:0018383 "osteonecrosis
    of genetic origin" rather than as a direct child of MONDO:0018381
    "osteochondrosis". This entry follows the modern experimental/translational
    literature (PMID:23428601, PMID:30248503), which places OCD/JOCD squarely
    in the ischemic-cartilage-canal osteochondrosis family alongside Perthes,
    Kohler, and Freiberg disease, and models it here as a site-general
    has_subtypes member rather than following MONDO's genetic-osteonecrosis
    placement. A MONDO ticket to reconsider this placement may be warranted but
    is out of scope for this entry.
  evidence:
  - reference: PMID:34109940
    reference_title: "Osteochondritis Dissecans: Current Understanding of Epidemiology, Etiology, Management, and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteochondritis dissecans occurs most frequently in the active pediatric and young adult populations, commonly affecting the knee, elbow, or ankle, and may lead to premature osteoarthritis."
    explanation: >
      Establishes the demographic pattern, anatomic sites, and long-term
      consequence (premature osteoarthritis) of osteochondritis dissecans.
  - reference: PMID:34109940
    reference_title: "Osteochondritis Dissecans: Current Understanding of Epidemiology, Etiology, Management, and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "various etiopathogenetic theories are being investigated, including local ischemia, aberrant endochondral ossification of the secondary subarticular physis, repetitive microtrauma, and genetic predisposition"
    explanation: >
      Confirms local ischemia and aberrant endochondral ossification as
      leading etiopathogenetic theories for osteochondritis dissecans,
      consistent with the articular osteochondrosis mechanism.
pathophysiology:
- name: Cartilage-Canal Ischemic Chondronecrosis
  biological_scale: CELLULAR
  subtypes:
  - Legg-Calve-Perthes Disease
  - Kohler Disease
  - Freiberg Infraction
  - Osteochondritis Dissecans
  description: >
    In the articular/epiphyseal osteochondrosis family, blood vessels running
    through cartilage canals supply the secondary (epiphyseal) ossification
    center during growth. Focal failure or transection of these vessels causes
    ischemic necrosis of chondrocytes and vascular endothelium in the
    epiphyseal cartilage, before any bone is yet mineralized at that site. This
    mechanism was reproduced experimentally by surgically transecting
    cartilage-canal vessels in foals, and morphologically identical lesions
    (confirmed by histology to represent cartilage-canal blood-supply failure
    and ischemic chondronecrosis) were subsequently identified at the
    predilection sites for juvenile osteochondritis dissecans in human
    pediatric knee specimens.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: Growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: Blood vessel development (cartilage-canal vasculature)
    term:
      id: GO:0001568
      label: blood vessel development
  locations:
  - preferred_term: Epiphyseal cartilage canal
    term:
      id: UBERON:0001437
      label: epiphysis
  - preferred_term: Subchondral region of epiphysis
    term:
      id: UBERON:0035878
      label: subchondral region of epiphysis
  evidence:
  - reference: PMID:23428601
    reference_title: "Transection of vessels in epiphyseal cartilage canals leads to osteochondrosis and osteochondrosis dissecans in the femoro-patellar joint of foals; a potential model of juvenile osteochondritis dissecans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transection of blood vessels within epiphyseal cartilage canals resulted in necrosis of vessels and chondrocytes, i.e., ischaemic chondronecrosis, in foals."
    explanation: >
      Causal experimental evidence (surgical vessel transection) directly
      demonstrating that cartilage-canal vascular failure produces ischemic
      chondronecrosis, the initiating lesion of the articular osteochondrosis
      family.
  - reference: PMID:30248503
    reference_title: "Juvenile osteochondritis dissecans of the knee is a result of failure of the blood supply to growth cartilage and osteochondrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Changes identical to osteochondrosis in animals were detected at predilection sites for JOCD in children, and confirmed to represent failure of the cartilage canal blood supply and ischemic chondronecrosis in histological sections."
    explanation: >
      Human pediatric CT/histology study translating the animal-model
      ischemic-chondronecrosis mechanism to human juvenile osteochondritis
      dissecans predilection sites.
  downstream:
  - target: Delayed Endochondral Ossification and Necrotic Fragmentation
    description: >
      Ischemic chondronecrosis produces a focal delay in endochondral
      ossification at the affected site; if loading continues before
      ossification and repair catch up, the necrotic/weakened cartilage-bone
      interface is prone to structural collapse and fragmentation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23428601
      reference_title: "Transection of vessels in epiphyseal cartilage canals leads to osteochondrosis and osteochondrosis dissecans in the femoro-patellar joint of foals; a potential model of juvenile osteochondritis dissecans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Areas of ischaemic chondronecrosis were associated with a focal delay in enchondral ossification (OC) in foals examined 21 days or more after transection, and pathological cartilage fracture (OCD) in one foal examined 42 days after transection."
      explanation: >
        Direct causal-experiment evidence for the temporal sequence
        ischemic chondronecrosis -> delayed ossification (osteochondrosis) ->
        cartilage fracture (osteochondritis dissecans).
- name: Delayed Endochondral Ossification and Necrotic Fragmentation
  biological_scale: TISSUE
  subtypes:
  - Legg-Calve-Perthes Disease
  - Kohler Disease
  - Freiberg Infraction
  - Osteochondritis Dissecans
  description: >
    The necrotic, unossified cartilage/subchondral bone segment fails to bear
    load normally. Continued mechanical loading of the affected epiphysis or
    subarticular bone (e.g., the immature femoral head in Perthes disease, or
    the second metatarsal head in Freiberg infraction) leads to increased bone
    resorption relative to delayed new bone formation, producing structural
    weakening, collapse, sclerosis, flattening, and fragmentation on imaging.
    In the most severe articular presentations this culminates in pathological
    cartilage fracture and, in osteochondritis dissecans, a detached
    osteochondral fragment (loose body).
  biological_processes:
  - preferred_term: Delayed endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
  - preferred_term: Bone resorption
    term:
      id: GO:0045453
      label: bone resorption
  evidence:
  - reference: PMID:22488623
    reference_title: "Pathophysiology and new strategies for the treatment of Legg-Calve-Perthes disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the immature femoral head is mechanically weakened following ischemic necrosis. Increased bone resorption and delayed new bone formation, in combination with continued mechanical loading of the hip, contribute to the pathogenesis of the femoral head deformity."
    explanation: >
      Establishes the resorption/formation imbalance and role of continued
      mechanical loading in producing structural deformity after ischemic
      necrosis, generalizing across the articular osteochondrosis family.
  - reference: PMID:34109940
    reference_title: "Osteochondritis Dissecans: Current Understanding of Epidemiology, Etiology, Management, and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment largely depends on skeletal maturity and lesion stability, defined by the presence or absence of articular cartilage fracture and subchondral bone separation, as determined by imaging and arthroscopy"
    explanation: >
      Confirms cartilage fracture and subchondral bone separation as the
      structural endpoints that distinguish stable from unstable
      osteochondritis dissecans lesions.
  downstream:
  - target: Revascularization and Remodeling under Mechanical Load
    description: >
      Necrotic tissue is progressively removed and replaced by vascularized
      granulation tissue and new bone (creeping substitution), which under
      continued mechanical load can restore structural integrity or, if
      loading outpaces repair, leave residual deformity.
    causal_link_type: DIRECT
- name: Revascularization and Remodeling under Mechanical Load
  biological_scale: TISSUE
  subtypes:
  - Legg-Calve-Perthes Disease
  - Kohler Disease
  - Freiberg Infraction
  description: >
    The articular osteochondrosis family is characteristically self-limited:
    revascularization delivers chondroclasts/osteoclasts and granulation
    tissue that remove necrotic tissue while new bone formation proceeds,
    under the influence of ongoing mechanical loading of the growing epiphysis.
    Outcome depends on the balance between repair and load — a spherical,
    congruent joint surface if repair keeps pace, or residual flattening/
    deformity and premature secondary osteoarthritis if mechanical failure
    outpaces repair.
  biological_processes:
  - preferred_term: Sprouting angiogenesis
    term:
      id: GO:0002040
      label: sprouting angiogenesis
  - preferred_term: Bone remodeling
    term:
      id: GO:0046849
      label: bone remodeling
  evidence:
  - reference: PMID:30248503
    reference_title: "Juvenile osteochondritis dissecans of the knee is a result of failure of the blood supply to growth cartilage and osteochondrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intra-cartilaginous secondary responses comprising proliferation of adjacent chondrocytes and vessels were detected in six and two lesions, whereas intra-osseous responses including accumulation of chondroclasts and formation of granulation tissue occurred in 10 and six lesions, respectively."
    explanation: >
      Human histological evidence for the revascularization/repair response
      (chondrocyte and vessel proliferation, chondroclast accumulation,
      granulation tissue formation) that follows ischemic chondronecrosis.
  - reference: PMID:30685014
    reference_title: "Freiberg Disease and Avascular Necrosis of the Metatarsal Heads."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If treated early, osteochondroses such as Freiberg disease are essentially self-limiting, often resolving with nonoperative management."
    explanation: >
      Supports the self-limited, load-dependent repair course that
      characterizes the articular osteochondrosis family when caught early.
- name: Repetitive Traction Apophysitis
  biological_scale: TISSUE
  subtypes:
  - Osgood-Schlatter Disease
  - Sever Disease
  description: >
    In the non-articular apophyseal osteochondrosis family, the mechanism is
    NOT primary ischemia. A traction apophysis is a secondary ossification
    center at a tendon insertion (the tibial tuberosity for the patellar
    tendon in Osgood-Schlatter disease; the calcaneal apophysis for the
    Achilles tendon in Sever disease). Repetitive, forceful traction from
    running/jumping sports during a rapid growth spurt — often compounded by
    relative muscle-tendon tightness outpacing bone growth — causes chronic
    microtrauma, inflammation, and disordered ossification at the unfused
    apophysis, distinct from the ischemic mechanism of the articular family.
  biological_processes:
  - preferred_term: Response to mechanical stimulus (tendon traction)
    term:
      id: GO:0009612
      label: response to mechanical stimulus
  - preferred_term: Endochondral ossification (secondary ossification center)
    term:
      id: GO:0001958
      label: endochondral ossification
  locations:
  - preferred_term: Tibial tuberosity
    term:
      id: UBERON:7500062
      label: tibial tuberosity
  - preferred_term: Calcaneal apophysis
    term:
      id: UBERON:0001450
      label: calcaneus
  - preferred_term: Calcaneal (Achilles) tendon insertion
    term:
      id: UBERON:0003701
      label: calcaneal tendon
  evidence:
  - reference: PMID:35740763
    reference_title: "The Etiology and Risk Factors of Osgood-Schlatter Disease: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It often results from acute or chronic overload during sports activity, causing inflammation of the patellar tendon insertion on the tibial tuberosity"
    explanation: >
      Establishes the traction/overload mechanism, distinct from ischemia, at
      the tibial tuberosity apophysis in Osgood-Schlatter disease.
  - reference: PMID:28722957
    reference_title: "Sever Disease (Calcaneal Apophysitis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition frequently coincides with triceps surae shortening, which stems from the difference in growth rates between bone and muscle."
    explanation: >
      Establishes the growth-rate-mismatch/tightness contributor to traction
      apophysitis at the calcaneal apophysis in Sever disease.
  downstream:
  - target: Apophyseal Pain, Prominence, and Fragmentation
    description: >
      Chronic traction produces local pain, swelling, and, radiographically,
      irregularity or fragmentation of the apophysis, without the true
      ischemic necrosis seen in the articular family.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35742062
      reference_title: "Osgood-Schlatter Disease: Appearance, Diagnosis and Treatment: A Narrative Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Osgood-Schlatter disease is the most common osteochondritis of the lower limb in sport-practicing children and adolescents."
      explanation: >
        Confirms the clinical burden and lower-limb site of this apophyseal
        family member as manifest disease (pain/prominence), which the review
        goes on to link to sport-related mechanical loading.
- name: Apophyseal Pain, Prominence, and Fragmentation
  biological_scale: TISSUE
  subtypes:
  - Osgood-Schlatter Disease
  - Sever Disease
  description: >
    The end-stage clinical/radiographic phenotype of traction apophysitis:
    localized pain and swelling that worsen with activity and improve with
    rest, sometimes with a palpable bony prominence, and self-resolution once
    the apophysis fuses at the end of skeletal growth.
  evidence:
  - reference: PMID:28722957
    reference_title: "Sever Disease (Calcaneal Apophysitis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients affected by Sever disease usually report pain resolution during periods of rest or when the growth plate fully closes."
    explanation: >
      Confirms the self-limited, growth-plate-fusion-dependent resolution
      pattern characteristic of the apophyseal osteochondrosis family.
- name: Compressive Vertebral Endplate Growth Failure
  biological_scale: TISSUE
  subtypes:
  - Scheuermann Kyphosis
  description: >
    In the physeal/endplate osteochondrosis family, excessive mechanical
    (compressive) loading impairs growth of the cartilaginous vertebral
    endplate and ring apophysis at the thoracic spine, distinct from both the
    ischemic mechanism of the articular family and the tensile-traction
    mechanism of the apophyseal family. This is associated with Schmorl's node
    formation (nucleus pulposus herniation through a weakened endplate),
    disruption of the ring apophysis, and compromised intervertebral disc
    integrity. A shortened sternum has also been proposed to increase
    anterior compressive force on the vertebral endplates, though this
    remains a single-study hypothesis.
  biological_processes:
  - preferred_term: Growth plate cartilage development (vertebral endplate)
    term:
      id: GO:0003417
      label: growth plate cartilage development
  - preferred_term: Response to mechanical stimulus (compressive loading)
    term:
      id: GO:0009612
      label: response to mechanical stimulus
  locations:
  - preferred_term: Vertebral ring apophysis / endplate
    term:
      id: UBERON:0002347
      label: thoracic vertebra
  - preferred_term: Vertebral growth plate cartilage
    term:
      id: UBERON:0004129
      label: growth plate cartilage
  evidence:
  - reference: PMID:41594596
    reference_title: "Insights into the Pathophysiology of Scheuermann's Kyphosis: From Structural Deformities to Genetic Predisposition and Underlying Signalling Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "excessive mechanical loading as a major contributor to defective growth of the cartilaginous vertebral endplate. This is associated with the formation of Schmorl's nodes, disruption of the ring apophysis, and compromised intervertebral disc integrity"
    explanation: >
      Current review establishing compressive mechanical loading of the
      cartilaginous vertebral endplate, rather than ischemia or tendon
      traction, as the physeal-family mechanism.
  - reference: PMID:18165737
    reference_title: "The role of sternum in the etiopathogenesis of Scheuermann disease of the thoracic spine."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the smaller length of sternum than the normal has a possible correlation with the appearance of Scheuermann disease. Probably the smaller length of sternum increases the compressive forces on the vertebral endplates anteriorly, allowing uneven growth of the vertebral bodies with wedging."
    explanation: >
      Single cohort study (10,057 screened students) proposing a specific
      biomechanical contributor (short sternum) to endplate compressive

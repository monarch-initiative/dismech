discussions:
- discussion_id: osteochondrosis_animal_ischemia_human_translation
  prompt: >-
    Does the ischemic-chondronecrosis mechanism, reproduced causally in foals
    and other model organisms, generalize to all sites and severities of human
    articular osteochondrosis, or only to the specific predilection sites and
    ages examined so far?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cartilage-Canal Ischemic Chondronecrosis
  rationale: >-
    The causal experiment for cartilage-canal vessel failure -> ischemic
    chondronecrosis -> osteochondrosis -> osteochondrosis dissecans was
    performed by surgically transecting vessels in the femoro-patellar joint
    of foals (PMID:23428601), an equine model with different growth-plate
    biology, cartilage-canal anatomy, and loading regime than the pediatric
    human knee/hip/foot. The strongest human bridging evidence
    (PMID:30248503) is limited to CT/histology of pediatric knee predilection
    sites in cadaveric/postmortem specimens (13 children, 1 month to 11 years
    old), not living-patient longitudinal data, and to the knee specifically
    rather than the hip (Perthes), navicular (Kohler), or metatarsal head
    (Freiberg) sites also attributed to this mechanism.
  proposed_experiments:
  - experiment_id: exp_osteochondrosis_multisite_human_histology
    name: Multi-site human cartilage-canal histology across the articular
      osteochondrosis family
    description: >-
      Extend the pediatric-knee CT/histology approach (PMID:30248503) to
      cadaveric or surgical specimens from the femoral head, tarsal navicular,
      and second metatarsal head predilection sites, at ages spanning the
      typical clinical onset for Perthes, Kohler, and Freiberg disease
      respectively, to test whether the same ischemic-chondronecrosis
      signature is present at each site.
  evidence:
  - reference: PMID:23428601
    reference_title: "Transection of vessels in epiphyseal cartilage canals leads to osteochondrosis and osteochondrosis dissecans in the femoro-patellar joint of foals; a potential model of juvenile osteochondritis dissecans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There are several similarities between OCD in animals and JOCD in children. It should be investigated whether JOCD also occurs due to a focal failure in the cartilage canal blood supply, followed by ischaemic chondronecrosis."
    explanation: >-
      The authors themselves frame the human translation as a question still
      to be investigated at the time of publication, not an established fact.
- discussion_id: perthes_etiology_undetermined
  prompt: >-
    Is mechanically induced ischemia sufficient to explain Legg-Calve-Perthes
    disease, or does the disease require an additional predisposing factor
    (thrombophilic, genetic, or environmental) in most cases?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cartilage-Canal Ischemic Chondronecrosis
  rationale: >-
    A systematic review of 64 articles on LCPD etiology found no single
    decisive theory: mechanically induced ischemia is the best-supported, twin
    studies argue against a major role for common genetic factors, and a
    congenital or acquired predisposition cannot be excluded. This entry
    therefore models the thrombophilia (F5/F2), Mendelian COL2A1 phenocopy,
    and secondhand-smoke environmental associations as contributing risk
    factors rather than as components of a single confirmed causal chain.
  evidence:
  - reference: PMID:30918798
    reference_title: "Aetiology of Legg-Calve-Perthes disease: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several hypotheses have been researched, but none of them was found decisive."
    explanation: >-
      States directly that no single etiologic hypothesis for LCPD has been
      established as decisive.
review_notes: >
  Curated for issue #8963 (CURATE_ROOT_WITH_SUBTYPES, MONDO:0018381). Modeled
  as a Disease with has_subtypes by site, per the issue's explicit instruction,
  rather than as a Grouping, even though the three constituent mechanistic
  families (articular/ischemic, apophyseal/traction, physeal/compressive) are
  not unified by a single shared mechanism — this is recorded structurally by
  giving each family its own top-level pathophysiology chain tagged with the
  relevant `subtypes:` rather than chaining all subtypes downstream of one
  ischemic cascade. Kohler disease (MONDO:0016086) is linked by name, not
  duplicated, per its existing standalone entry
  (Osteochondritis_of_Tarsal_Metatarsal_Bone.yaml), which already declares
  `parents: [Osteochondrosis, Pediatric Foot Disease]`. Osteochondritis
  dissecans (MONDO:0017178) is included as a has_subtypes member per the issue,
  which is a deliberate divergence from MONDO's own parent assignment (child of
  MONDO:0018383 osteonecrosis of genetic origin, not of MONDO:0018381
  osteochondrosis); see that subtype's own `review_notes`. Sever disease has no
  MONDO term (confirmed absent by OAK search at curation time) and is modeled
  with a free-text `subtype_term`. Kienbock disease, Panner disease, Thiemann
  disease, Sinding-Larsen-Johansson disease, and medial condensing osteitis of
  the clavicle are additional MONDO children of osteochondrosis not named in
  the curation issue and are intentionally out of scope for this entry.
  MONDO:0010130 (dihydropyrimidine dehydrogenase deficiency), also listed as an
  OLS hierarchical child of MONDO:0018381 in upstream research, appears to be a
  MONDO placement error (it is an unrelated pyrimidine-catabolism disorder,
  already curated separately as Dihydropyrimidine_Dehydrogenase_Deficiency.yaml)
  and is excluded here rather than propagated. ORPHA:399319 (the Orphanet
  group-of-disorders entry for osteochondrosis) was confirmed not present in
  references_cache/ and not fetchable as a leaf-disorder evidence source, so no
  ORPHA: evidence was cited; all evidence in this entry is PMID-sourced.

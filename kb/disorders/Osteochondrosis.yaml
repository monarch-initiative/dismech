    snippet: "A significant association was noted between living with a smoker and Legg-Calvé-Perthes disease as well as between increasing smoke exposure and increased risk of developing Legg-Calvé-Perthes disease."
    explanation: >
      Establishes that household second-hand smoke exposure is itself a
      documented exposure in this disease, with a dose-response relationship.
      This attests the exposure entry; the separate evidence on the
      influences_mechanisms link attests the claim that it acts on the
      ischemic chondronecrosis node.
  influences_mechanisms:

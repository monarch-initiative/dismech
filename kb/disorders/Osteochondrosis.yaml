- name: Surgical Excision, Fixation, or Retroarticular Drilling
  description: >
    Unstable osteochondritis dissecans lesions (with articular cartilage
    fracture or subchondral bone separation) that fail conservative
    management in skeletally immature patients are managed operatively;
    treatment choice depends on skeletal maturity and lesion stability.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment largely depends on skeletal maturity and lesion stability, defined by the presence or absence of articular cartilage fracture and subchondral bone separation, as determined by imaging and arthroscopy, and is typically nonoperative for stable lesions in skeletally immature patients and operative for those who have had failure of conservative management or have unstable lesions."
    explanation: >
      Establishes the maturity/stability-dependent decision between

- name: Allogeneic hematopoietic stem cell transplantation
  description: >-
    The only established intervention that removes the dominant allele's product
    from erythropoiesis, by replacing the patient's hematopoietic compartment
    with a donor one. The asymmetry worth stating plainly is with gene addition:
    beti-cel and the other lentiviral gene-addition therapies work by supplying
    extra copies of a functional beta-globin gene, which corrects chain
    imbalance in a recessive disease where the problem is too little normal beta
    chain. In dominant beta-thalassemia the problem is the presence of a
    hyperunstable chain that precipitates, so adding functional copies leaves
    the toxic product being made. Allogeneic replacement and allele-directed
    editing address this subtype in a way gene addition structurally cannot.
    Recorded here because of that reasoning rather than because transplant is
    commonly done in a disease this mild: the balance of curative benefit
    against transplant-related mortality is quite different in an
    intermedia-band phenotype than in transfusion-dependent disease.

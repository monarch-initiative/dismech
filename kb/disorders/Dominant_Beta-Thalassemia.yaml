    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the molecular basis of dominantly inherited beta-thalassemia in four families has revealed different mutations involving exon 3 of the beta-globin gene.
    explanation: >-
      Localises the causative variants to exon 3 across four independent
      families, which is the observation the whole mechanism rests on.
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In four unrelated families of Czech and Slovak origin two nonsense dominant beta-thalassaemic alleles (CD 121 (G-T); CD 112 (T-A)) and in one family simple substitution in codon 115 (GCC-GAC) or alpha 2 beta 2 115 (G17) Ala-Asp HB-Hradec Králové were identified.
    explanation: >-
      Independent replication of the exon-3 allele class in a different
      population, including two previously undescribed codons.
- name: Heme-Bound Globin Precipitation into Protease-Resistant Inclusion Bodies
  biological_scale: MOLECULAR
  description: >-
    The abnormal chain is long enough and stable enough to bind heme, and the
    resulting heme-bound aggregate resists proteolysis. This is the step that
    separates dominant from recessive disease, and the original authors state it
    as such: what differs between the two is the length and stability of the
    translated product and whether it can bind heme and aggregate.
  biological_processes:

      For β-thalassemia major, hematopoietic stem cell transplantation (HSCT), cord blood transplantation from a related donor, or autologous HSCT with gene therapy.
    explanation: >-
      Establishes HSCT as the targeted, potentially curative option in
      beta-thalassemia, and in the same breath names autologous HSCT with gene
      therapy as its alternative - which is the distinction this entry turns on.
      Indirect three times over: the chapter describes the recessive disease,
      this sentence prescribes for the major rather than the intermedia
      severity band that dominant beta-thalassemia occupies, and no transplant
      series exists in the dominant form at all.
diagnosis:
- name: HBB sequencing with attention to exon 3
  description: >-
    Sequence HBB. The interpretive step is what matters: an exon-3 nonsense,
    frameshift or destabilising missense allele in a symptomatic heterozygote is
    the diagnosis, and it should not be dismissed as a carrier finding because
    only one allele is affected.
  results: >-
    A single heterozygous HBB exon-3 variant predicted to yield a translated,
    unstable beta-globin chain.
  evidence:
  - reference: PMID:1971109
    reference_title: Molecular basis for dominantly inherited inclusion body beta-thalassemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the molecular basis of dominantly inherited beta-thalassemia in four families has revealed different mutations involving exon 3 of the beta-globin gene.
    explanation: >-
      The localisation that directs where to look and how to read the result.
- name: Heinz body preparation
  description: >-
    A supravital stain for inclusion bodies. Cheap, and specifically informative
    in this disorder because the inclusions are the mechanism rather than an
    incidental finding. Inclusions have been seen in nucleated erythroid cells
    as well as mature red cells.
  results: >-
    Heinz bodies in peripheral erythrocytes, and in nucleated erythroid cells.
  evidence:
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heinz bodies were detected in erythrocytes of the peripheral blood in two families.
    explanation: >-
      The finding this test looks for, documented in two of the reported
      families.
- name: Hemoglobin analysis and stability testing, read with their failure modes
  description: >-
    Hemoglobin analysis (isoelectric focusing, HPLC) and an isopropanol or heat
    stability test are the standard workup for a suspected unstable variant, and
    in this disorder both can be negative in a patient who has it. The chain is
    degraded so fast that it may never accumulate to a detectable quantity, and
    stability testing loses sensitivity as the lysate ages. A negative result
    therefore does not exclude the diagnosis and should not be allowed to stop
    the workup before HBB is sequenced. This is the practical reason the
    recessive diagnostic algorithm, which rests on quantifying HbA, HbA2 and HbF
    on hemoglobin analysis, does not transfer to the dominant form.
  results: >-
    Frequently negative or only weakly positive. A severely unstable chain may
    be undetectable by isoelectric focusing and HPLC, and stability tests may be
    positive only in freshly prepared lysates.
  evidence:
  - reference: PMID:7693620
    reference_title: Hb Hradec Kralove (Hb HK) or alpha 2 beta 2 115(G17)Ala-->Asp, a severely
      unstable hemoglobin variant resulting in a dominant beta-thalassemia trait in a
      Czech family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this beta chain is severely unstable and could not be identified either as chain or as hemoglobin variant by isoelectrofocusing and various high performance liquid chromatography methods
    explanation: >-
      Documents the negative-result failure mode directly: in a molecularly
      confirmed case, neither isoelectric focusing nor HPLC detected the
      variant. This is why a normal hemoglobin analysis does not exclude the
      diagnosis.
  - reference: PMID:7693620
    reference_title: Hb Hradec Kralove (Hb HK) or alpha 2 beta 2 115(G17)Ala-->Asp, a severely
      unstable hemoglobin variant resulting in a dominant beta-thalassemia trait in a
      Czech family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stability tests were mildly positive in freshly prepared lysates, but an unstable hemoglobin could not be detected in older lysates with these methods
    explanation: >-
      States the pre-analytical dependence explicitly - the same test on the
      same patients gave a positive result on fresh lysate and a negative one on
      aged lysate, which is the caveat this entry exists to record.
differential_diagnoses:
- name: Beta thalassemia
  description: >-
    The recessive disease, and the one this is most likely to be recorded as.
    The discriminator is not severity but the state of the other allele: a
    symptomatic patient with a single HBB variant and a normal second allele has
    the dominant disorder. A thalassemia-intermedia phenotype does not by itself
    distinguish them, because the dominant form produces one too.
  disease_term:
    preferred_term: beta thalassemia
    term:
      id: MONDO:0019402
      label: beta thalassemia
  distinguishing_features:
  - Symptomatic in the heterozygous state
  - Exon-3 variants producing a translated, hyperunstable chain rather than reduced beta-globin output
  - Heinz bodies
  - No malaria-related population clustering
  evidence:
  - reference: PMID:34957901
    reference_title: "Dominant β-Thalassemia Phenotype Caused by Hb Dieppe (HBB: c.383A>G): Another Case Report."
    supports: SUPPORT

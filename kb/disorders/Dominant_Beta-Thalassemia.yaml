inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single mutant allele suffices. This is the defining feature and it is
    mechanistic: the allele makes a toxic product rather than failing to make a
    working one, so the normal allele cannot compensate.
  evidence:
  - reference: PMID:34957901
    reference_title: "Dominant β-Thalassemia Phenotype Caused by Hb Dieppe (HBB: c.383A>G): Another Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous or compound heterozygous mutations of the β-globin gene lead to β-thalassemia (β-thal) major (β-TM) or β-thal intermedia (β-TI), whereas heterozygotes usually show microcytosis with negligible or no hemolysis. Certain missense mutations in exon 3, however, produce unstable globins causing a dominant β-thal phenotype or hemolytic anemia in heterozygotes.
    explanation: >-
      States the contrast that defines the entity - ordinary heterozygotes are
      near-silent, these are not - and locates the responsible variants in exon
      3.
  - reference: PMID:34957901
    reference_title: "Dominant β-Thalassemia Phenotype Caused by Hb Dieppe (HBB: c.383A>G): Another Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with a dominant β-thal phenotype in two generations of a Chinese family.
    explanation: >-
      Documents dominant transmission across two generations, which is what
      distinguishes inheritance from a de novo severe allele.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate exists and the disorder is reported family by family. A
    1994 survey of exon-3 nonsense alleles counted twelve families known
    worldwide, four of them Czech or Slovak. That regional concentration is not
    a founder effect in the usual sense - the authors attribute it to the
    absence of malaria-related positive selection that would otherwise have
    spread such alleles, which makes dominant alleles visible wherever they
    arise rather than concentrated where malaria was.
  evidence:
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A relatively high incidence of dominant beta-thal. mutations in the Czech and Slovak Republic (4 of 12 families known world wide with a nonsense beta-thal. mutation in the 3rd exon) is explained by the absence of selective preference of these mutations in malaria infested areas as a result of serious clinical manifestations in heterozygotes.
    explanation: >-
      Gives both the worldwide case count for this allele class and the
      selection argument that explains its pan-ethnic distribution.
pathophysiology:
- name: Heterozygous HBB Exon 3 Variant Producing a Hyperunstable Beta-Globin Chain
  biological_scale: MOLECULAR
  description: >-
    Missense, nonsense or frameshift changes in exon 3 of HBB. Exon 3 matters
    specifically: a premature stop there escapes nonsense-mediated decay, so the
    transcript is translated instead of degraded, and the cell makes an abnormal
    chain rather than simply making less. Elongating frameshift alleles behave
    the same way.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
  genes:
  - preferred_term: HBB
    term:
      id: hgnc:4827
      label: HBB
  downstream:
  - target: Heme-Bound Globin Precipitation into Protease-Resistant Inclusion Bodies
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:1971109
    reference_title: Molecular basis for dominantly inherited inclusion body beta-thalassemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the molecular basis of dominantly inherited beta-thalassemia in four families has revealed different mutations involving exon 3 of the beta-globin gene.
    explanation: >-
      Localises the causative variants to exon 3 across four independent
      families, which is the observation the whole mechanism rests on.
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In four unrelated families of Czech and Slovak origin two nonsense dominant beta-thalassaemic alleles (CD 121 (G-T); CD 112 (T-A)) and in one family simple substitution in codon 115 (GCC-GAC) or alpha 2 beta 2 115 (G17) Ala-Asp HB-Hradec Králové were identified.
    explanation: >-
      Independent replication of the exon-3 allele class in a different
      population, including two previously undescribed codons.
- name: Heme-Bound Globin Precipitation into Protease-Resistant Inclusion Bodies
  biological_scale: MOLECULAR
  description: >-
    The abnormal chain is long enough and stable enough to bind heme, and the
    resulting heme-bound aggregate resists proteolysis. This is the step that
    separates dominant from recessive disease, and the original authors state it
    as such: what differs between the two is the length and stability of the
    translated product and whether it can bind heme and aggregate.
  biological_processes:
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  cellular_components:
  - preferred_term: inclusion body
    term:
      id: GO:0016234
      label: inclusion body
  downstream:
  - target: Excess Unpaired Alpha-Globin
    causal_link_type: DIRECT
  - target: Failure of Erythroid Protein Quality Control
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:1971109
    reference_title: Molecular basis for dominantly inherited inclusion body beta-thalassemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is suggested that the phenotypic difference between this condition and the more common recessive forms of beta-thalassemia lies mainly in the length and stability of the abnormal translation products that are synthesized and, in particular, whether they are capable of binding heme and producing aggregations that are relatively resistant to proteolytic degradation.
    explanation: >-
      The mechanistic claim that defines the disorder, quoted in full including
      the authors' hedge "It is suggested", which is the strength they gave it.
- name: Excess Unpaired Alpha-Globin
  biological_scale: MOLECULAR
  description: >-
    Defective beta-globin leaves alpha chains without a partner. Alpha
    haemoglobin stabilising protein normally chaperones free alpha-globin, but
    the excess overwhelms it and the unpaired alpha chains precipitate too - so
    the erythroblast carries two aggregating species, not one. This is also why
    co-inherited alpha-thalassemia is protective: fewer alpha chains means less
    imbalance.
  downstream:
  - target: Failure of Erythroid Protein Quality Control
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25724329
    reference_title: "[Role of alpha-hemoglobin molecular chaperone in the hemoglobin formation and clinical expression of some hemoglobinopathies]."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      AHSP protects the free α-Hb chains in maintaining it in the soluble state.
    explanation: >-
      The basis for this node's claim that AHSP is what keeps surplus alpha
      chains soluble, and therefore for the claim that the pool can be
      overwhelmed. Note what the snippet does and does not establish: it states
      AHSP's protective function, not that the chaperone is saturated in this
      disorder. The saturation step is an inference from the chain excess, and
      the entry's second knowledge gap is about exactly that unmeasured step.
      Indirect: background biochemistry rather than a measurement in
      dominant beta-thalassemia.
  - reference: PMID:22427201
    reference_title: Integrated protein quality-control pathways regulate free α-globin in murine β-thalassemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we investigated how these pathways are used in β-thalassemia, a common hemoglobinopathy in which β-globin gene mutations cause the accumulation and precipitation of cytotoxic α-globin subunits.
    explanation: >-
      States the unpaired-alpha mechanism. Indirect: the study is in
      beta-thalassemic mice and the disorder modelled is the common recessive
      one, so this describes the shared alpha-globin arm rather than the
      dominant-specific lesion.
  - reference: PMID:24432801
    reference_title: "Hb Grand Junction (HBB: c.348_349delinsG; p.His117IlefsX42): a new hyperunstable hemoglobin variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients also have a 3.7 kb deletion on one α gene, leading to a decreased imbalance between α and β chain formation, and subsequently a milder phenotype than that seen in other hyperunstable Hb variants.
    explanation: >-
      A natural experiment in two patients: removing one alpha gene softens the
      phenotype, which is what the chain-imbalance arm predicts.
- name: Failure of Erythroid Protein Quality Control
  biological_scale: CELLULAR
  description: >-
    Erythroid precursors do try to clear the aggregates - free alpha-globin is
    polyubiquitinated and proteasomally degraded, proteasome subunits are
    coordinately induced through Nrf1, and autophagy is recruited as a
    compensatory route. Dominance is what happens when that machinery is
    outrun. This is the sense in which the disorder belongs with the
    protein-aggregation diseases rather than with the quantitative
    haemoglobinopathies.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  - preferred_term: autophagy
    modifier: INCREASED
    term:
      id: GO:0006914
      label: autophagy
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  downstream:
  - target: Oxidative Injury of Erythroblasts and Erythrocytes
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22427201
    reference_title: Integrated protein quality-control pathways regulate free α-globin in murine β-thalassemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In β-thalassemic erythrocyte precursors, free α-globin was polyubiquitinated and degraded by the proteasome. These cells exhibited enhanced proteasome activity, and transcriptional profiling revealed coordinated induction of most proteasome subunits that was mediated by the stress-response transcription factor Nrf1.
    explanation: >-
      Demonstrates the quality-control response this node describes. Indirect:
      murine beta-thalassemia, and the substrate studied is free alpha-globin
      rather than the unstable beta chain specific to the dominant disorder.
  - reference: PMID:22427201
    reference_title: Integrated protein quality-control pathways regulate free α-globin in murine β-thalassemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, β-thalassemia fits into the broader framework of protein-aggregation disorders that use PQC pathways as cell-protective mechanisms.
    explanation: >-
      The authors' own framing of beta-thalassemia as a protein-aggregation
      disorder, which is the classification this entry adopts. Indirect for the
      same reason.
- name: Oxidative Injury of Erythroblasts and Erythrocytes
  biological_scale: CELLULAR
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Oxidative and Membrane Injury"
  description: >-
    Precipitated globin carries heme with it, and heme-driven redox chemistry
    damages membranes. The injury lands in two places at once: on erythroblasts
    in the marrow, which die and so produce ineffective erythropoiesis, and on
    circulating red cells, which are marked for splenic removal.
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Ineffective Erythropoiesis
    causal_link_type: DIRECT
  - target: Splenic Destruction of Inclusion-Bearing Erythrocytes
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29180398
    reference_title: "Inhibition of heme oxygenase ameliorates anemia and reduces iron overload in a β-thalassemia mouse model."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unpaired globin chains, with heme attached to them, accumulate in thalassemic erythroblasts causing oxidative stress and the premature cell death.
    explanation: >-
      States the oxidative chemistry this node asserts, and states it of the
      erythroblast, which is where the node places it. Indirect: a mouse-model
      review of beta-thalassemia generally, not of a dominant allele.
  - reference: PMID:1971109
    reference_title: Molecular basis for dominantly inherited inclusion body beta-thalassemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whether they are capable of binding heme and producing aggregations that are relatively resistant to proteolytic degradation
    explanation: >-
      Records that the aggregates carry heme, which is the premise for oxidative
      injury. Indirect: the paper establishes heme binding and protease
      resistance, not the downstream oxidative chemistry.
- name: Ineffective Erythropoiesis
  biological_scale: TISSUE
  description: >-
    Erythroblasts laden with inclusions die before maturing, so the marrow works
    hard and delivers few cells. Together with the peripheral hemolysis this
    produces the thalassemia-intermedia picture, and it drives the compensatory
    increase in intestinal iron absorption behind secondary iron overload.
  biological_processes:
  - preferred_term: erythrocyte maturation
    modifier: DECREASED
    term:
      id: GO:0043249
      label: erythrocyte maturation
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  downstream:
  - target: Anemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29180398
    reference_title: "Inhibition of heme oxygenase ameliorates anemia and reduces iron overload in a β-thalassemia mouse model."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The underlying basis of thalassemia pathology is the premature apoptotic destruction of erythroblasts causing ineffective erythropoiesis.
    explanation: >-
      Names the erythroblast apoptosis that makes erythropoiesis ineffective,
      which is the claim this node makes. Indirect: a mouse-model review of
      beta-thalassemia generally, not of a dominant allele.
  - reference: PMID:142356
    reference_title: An ultrastructural study of the red pulp of the spleen and the liver in unstable hemoglobin hemolytic anemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to experimental Heinz body anemia in animals, Heinz bodies were present even in the nucleated cells.
    explanation: >-
      The observation that inclusions are present in nucleated erythroid cells,
      i.e. in precursors rather than only in mature red cells, which is what
      makes marrow-level injury credible. Indirect: an ultrastructural
      observation, not a measurement of erythropoietic efficiency, and made in a
      patient with an unstable haemoglobin rather than a genotyped dominant
      beta-thalassemia.
- name: Splenic Destruction of Inclusion-Bearing Erythrocytes
  biological_scale: TISSUE
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  description: >-
    Red cells carrying Heinz bodies are removed by the spleen, predominantly by
    whole-cell phagocytosis by cordal macrophages in the red pulp, with a lesser
    contribution from intravascular hemolysis in the splenic microvasculature.
    The liver contributes little. This localisation is what makes splenectomy a
    rational intervention rather than an empirical one.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  downstream:

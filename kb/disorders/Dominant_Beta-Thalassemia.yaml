inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single mutant allele suffices. This is the defining feature and it is
    mechanistic: the allele makes a toxic product rather than failing to make a
    working one, so the normal allele cannot compensate.
  evidence:
  - reference: PMID:34957901
    reference_title: "Dominant β-Thalassemia Phenotype Caused by Hb Dieppe (HBB: c.383A>G): Another Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous or compound heterozygous mutations of the β-globin gene lead to β-thalassemia (β-thal) major (β-TM) or β-thal intermedia (β-TI), whereas heterozygotes usually show microcytosis with negligible or no hemolysis. Certain missense mutations in exon 3, however, produce unstable globins causing a dominant β-thal phenotype or hemolytic anemia in heterozygotes.
    explanation: >-
      States the contrast that defines the entity - ordinary heterozygotes are
      near-silent, these are not - and locates the responsible variants in exon
      3.
  - reference: PMID:34957901
    reference_title: "Dominant β-Thalassemia Phenotype Caused by Hb Dieppe (HBB: c.383A>G): Another Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with a dominant β-thal phenotype in two generations of a Chinese family.
    explanation: >-
      Documents dominant transmission across two generations, which is what
      distinguishes inheritance from a de novo severe allele.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate exists and the disorder is reported family by family. A
    1994 survey of exon-3 nonsense alleles counted twelve families known
    worldwide, four of them Czech or Slovak. That regional concentration is not
    a founder effect in the usual sense - the authors attribute it to the
    absence of malaria-related positive selection that would otherwise have
    spread such alleles, which makes dominant alleles visible wherever they
    arise rather than concentrated where malaria was.
  evidence:
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A relatively high incidence of dominant beta-thal. mutations in the Czech and Slovak Republic (4 of 12 families known world wide with a nonsense beta-thal. mutation in the 3rd exon) is explained by the absence of selective preference of these mutations in malaria infested areas as a result of serious clinical manifestations in heterozygotes.
    explanation: >-
      Gives both the worldwide case count for this allele class and the
      selection argument that explains its pan-ethnic distribution.
pathophysiology:
- name: Heterozygous HBB Exon 3 Variant Producing a Hyperunstable Beta-Globin Chain
  biological_scale: MOLECULAR
  description: >-
    Missense, nonsense or frameshift changes in exon 3 of HBB. Exon 3 matters
    specifically: a premature stop there escapes nonsense-mediated decay, so the
    transcript is translated instead of degraded, and the cell makes an abnormal
    chain rather than simply making less. Elongating frameshift alleles behave
    the same way.

name: Dominant Beta-Thalassemia
creation_date: "2026-09-11T11:40:00Z"
category: Mendelian
synonyms:
- inclusion body beta-thalassemia
- thalassemia-beta, dominant inclusion-body
- hyperunstable hemoglobinopathy
- dyserythropoietic anemia, congenital, Irish or Weatherall type
description: >-
  Dominant beta-thalassemia is a hemoglobinopathy in which a single mutant HBB
  allele produces overt disease in a heterozygote. That is the whole point of
  the entry, and it is the opposite of how beta-thalassemia usually behaves: in
  the common recessive forms a heterozygote has microcytosis and little or no
  hemolysis, because one working allele is enough.

  The difference is not severity, it is mechanism. Ordinary beta-thalassemia is
  a quantitative deficit - less beta-globin is made, alpha chains are left
  unpartnered, and the disease follows from the imbalance. Here the mutant
  allele is translated into a hyperunstable beta-globin chain that still binds
  heme, precipitates into protease-resistant inclusion bodies, and escapes the
  erythroid quality-control machinery that would normally clear it. The mutant
  product is itself the insult. Most causative variants sit in exon 3, which is
  where a nonsense or frameshift change escapes nonsense-mediated decay and so
  gets translated rather than degraded.

  The consequence is a proteostasis disease of the erythron dressed as a
  thalassemia: inclusion-laden erythroblasts die in the marrow, inclusion-laden
  red cells are pulled out by splenic macrophages, and the patient has a
  thalassemia-intermedia picture with hemolysis, reticulocytosis, splenomegaly
  and secondary iron overload.

  One epidemiological consequence follows directly from the dominance and is
  worth stating, because it inverts the usual expectation for a
  haemoglobinopathy: because heterozygotes are symptomatic, these alleles get no
  malaria-related selective advantage, so the disorder occurs pan-ethnically as
  isolated families and de novo cases rather than clustering in historically
  malaria-endemic populations.

  dismech curates the recessive disease separately as Beta_Thalassemia. These
  are kept apart because the pathographs differ at the first step, not because
  of severity banding - see notes.

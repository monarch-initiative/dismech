biochemical:
- name: Fetal hemoglobin
  presence: Increased
  context: >-
    Raised HbF is a compensatory response to the globin-chain imbalance and is
    the one hemoglobin-analysis abnormality that is reliably present here, in
    contrast to the variant chain itself, which is often undetectable. It is
    also the quantity hydroxyurea is given to raise, so it is both a marker of
    the disorder and the readout for that treatment.
  biomarker_term:
    preferred_term: hemoglobin F measurement
    term:
      id: NCIT:C92262
      label: Hemoglobin F Measurement
  readouts:
  - target: Excess Unpaired Alpha-Globin
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Gamma chains pair with alpha chains that would otherwise be unpaired, so a
      rise in HbF partially offsets the alpha-globin excess rather than simply
      accompanying it.
  notes: >-
    HbA2 is not modelled. The recessive diagnostic algorithm quantifies HbA,
    HbA2 and HbF together, but no source cited by this entry reports an HbA2
    value in a dominant-allele heterozygote specifically, and carrying the
    recessive figures across would assert something about this disorder that has
    not been measured in it.
  evidence:
  - reference: PMID:7693620
    reference_title: Hb Hradec Kralove (Hb HK) or alpha 2 beta 2 115(G17)Ala-->Asp, a severely
      unstable hemoglobin variant resulting in a dominant beta-thalassemia trait in a
      Czech family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both subjects had a marked increase in fetal hemoglobin synthesis.
    explanation: >-
      Reports raised fetal hemoglobin in both molecularly confirmed
      dominant-allele heterozygotes of this family. Two patients, so this
      establishes the direction rather than a frequency or a reference interval.

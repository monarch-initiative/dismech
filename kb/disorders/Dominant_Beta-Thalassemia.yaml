    explanation: >-
      The outcome and the mechanism together. Indirect: a single patient with an
      unstable haemoglobin, and the splenectomy response is reported in service
      of the mechanistic argument rather than as a treatment study.
- name: Supportive transfusion and iron chelation
  description: >-
    Standard thalassemia supportive care where anemia warrants it, with
    chelation for the secondary iron overload that follows both transfusion and
    the increased intestinal absorption driven by ineffective erythropoiesis. No
    dominant-specific evidence exists; the management framework is borrowed from
    beta-thalassemia generally.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic manifestation of beta-thal. intermedia was revealed in three families with CD 121 (G-T) and in a family with a mutation in CD 112, but the phenotypic manifestations differed markedly in individual subjects.
    explanation: >-
      Establishes the severity band that supportive care is calibrated to.
      Indirect: a phenotype description, not a treatment evaluation.
diagnosis:
- name: HBB sequencing with attention to exon 3
  description: >-
    Sequence HBB. The interpretive step is what matters: an exon-3 nonsense,
    frameshift or destabilising missense allele in a symptomatic heterozygote is
    the diagnosis, and it should not be dismissed as a carrier finding because
    only one allele is affected.
  results: >-
    A single heterozygous HBB exon-3 variant predicted to yield a translated,
    unstable beta-globin chain.
  evidence:
  - reference: PMID:1971109
    reference_title: Molecular basis for dominantly inherited inclusion body beta-thalassemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the molecular basis of dominantly inherited beta-thalassemia in four families has revealed different mutations involving exon 3 of the beta-globin gene.
    explanation: >-
      The localisation that directs where to look and how to read the result.
- name: Heinz body preparation
  description: >-
    A supravital stain for inclusion bodies. Cheap, and specifically informative
    in this disorder because the inclusions are the mechanism rather than an
    incidental finding. Inclusions have been seen in nucleated erythroid cells
    as well as mature red cells.
  results: >-
    Heinz bodies in peripheral erythrocytes, and in nucleated erythroid cells.
  evidence:
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heinz bodies were detected in erythrocytes of the peripheral blood in two families.
    explanation: >-
      The finding this test looks for, documented in two of the reported
      families.
differential_diagnoses:
- name: Beta thalassemia
  description: >-
    The recessive disease, and the one this is most likely to be recorded as.
    The discriminator is not severity but the state of the other allele: a
    symptomatic patient with a single HBB variant and a normal second allele has
    the dominant disorder. A thalassemia-intermedia phenotype does not by itself
    distinguish them, because the dominant form produces one too.
  disease_term:
    preferred_term: beta thalassemia
    term:
      id: MONDO:0019402
      label: beta thalassemia
  distinguishing_features:
  - Symptomatic in the heterozygous state
  - Exon-3 variants producing a translated, hyperunstable chain rather than reduced beta-globin output
  - Heinz bodies
  - No malaria-related population clustering
  evidence:
  - reference: PMID:34957901
    reference_title: "Dominant β-Thalassemia Phenotype Caused by Hb Dieppe (HBB: c.383A>G): Another Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous or compound heterozygous mutations of the β-globin gene lead to β-thalassemia (β-thal) major (β-TM) or β-thal intermedia (β-TI), whereas heterozygotes usually show microcytosis with negligible or no hemolysis.
    explanation: >-
      States the recessive comparator's genotype-phenotype relationship, which
      is what the dominant disorder violates.
  - reference: PMID:34957901
    reference_title: "Dominant β-Thalassemia Phenotype Caused by Hb Dieppe (HBB: c.383A>G): Another Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physicians should be alerted to this mechanism of β-thal considering its relative rarity.
    explanation: >-
      The authors' own warning that the mechanism is missed, which is the reason
      this differential is stated first.
discussions:
- discussion_id: gap_dominant_beta_thal_within_family_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do relatives carrying the same dominant HBB allele differ markedly in
    severity, when the known modifiers have been looked for and do not account
    for it?
  attaches_to:
  - genetic#HBB
  - phenotypes#Anemia
  - pathophysiology#Excess Unpaired Alpha-Globin
  rationale: >-
    This is a gap with a negative result behind it rather than an unasked
    question. Reported families show marked phenotypic differences between
    individuals carrying an identical allele, and the authors who described them
    went looking: they examined the alpha genes and the beta-globin promoter and
    could not explain the deviations. Co-inherited alpha-thalassemia is a real
    modifier - two patients with a 3.7 kb alpha deletion had a milder course
    than other hyperunstable variants - but it plainly does not account for
    everything, since it was among the things checked. What remains untested is
    whether variation in the erythroid quality-control capacity itself
    modifies severity: the proteasome and autophagy response to free globin has
    been characterised in mouse, and dominance is defined by that response being
    outrun, so inter-individual differences in it are a candidate nobody has
    measured. With a disorder reported family by family, a pooled cohort with
    alpha genotype, HbF loci and an erythroid proteostasis readout would be the
    study, and it does not exist.
- discussion_id: gap_dominant_beta_thal_mechanism_studied_in_the_wrong_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the proteostasis mechanism, characterised almost entirely in recessive
    beta-thalassemia and for free alpha-globin, actually describe what happens
    to the unstable beta chain that defines the dominant disorder?
  attaches_to:
  - pathophysiology#Failure of Erythroid Protein Quality Control
  - pathophysiology#Heme-Bound Globin Precipitation into Protease-Resistant Inclusion Bodies
  rationale: >-
    The quality-control node in this entry is supported by work in beta-thalassemic
    mice, and the substrate in that work is free alpha-globin - the species that
    accumulates in the common recessive disease. The dominant disorder has a
    second, different aggregating species: the mutant beta chain itself, which
    the founding human work describes as heme-bound and relatively resistant to
    proteolysis. Whether the ubiquitin-proteasome and autophagy routes that
    clear free alpha-globin also handle a hyperunstable beta chain, or whether
    its protease resistance is precisely what defeats them, has not been tested.
    The distinction is not academic: it decides whether proteostasis-directed
    approaches that address alpha-globin excess would help here at all, or
    whether the dominant allele's product is the one species those pathways
    cannot clear. No study has compared clearance of a hyperunstable beta chain
    with clearance of free alpha-globin in the same erythroid system.
notes: >-
  Why this is a separate entry from Beta_Thalassemia rather than a severity
  band on it.

  The two differ at the first step of the pathograph. In the recessive disease
  the lesion is quantitative - less beta-globin, an alpha/beta imbalance, and
  disease following from the imbalance - and a heterozygote is near-silent
  because one allele suffices. Here the mutant allele is translated into a
  hyperunstable chain that binds heme, aggregates, resists proteolysis, and
  poisons the erythroblast, so the disease is dominant and the normal allele
  cannot rescue it. The two entries converge downstream, at oxidative injury and
  splenic destruction, which is why both conform to the same
  hemolytic_anemia_erythrocyte_destruction module nodes. They diverge where it
  counts.

  On the evidence, and this is the honest limitation of the entry: the
  mechanistic depth is borrowed. The steps specific to the dominant disorder -
  exon-3 localisation, heme-bound protease-resistant aggregation, dominant
  transmission, Heinz bodies - rest on small human family studies, several of
  them decades old, and are curated as HUMAN_CLINICAL without a directness
  qualifier. Everything downstream of aggregation carries directness: INDIRECT,
  because it comes either from murine recessive beta-thalassemia or from a
  single patient with a different unstable haemoglobin. The
  quality-control node in particular describes experiments on free alpha-globin,
  not on the unstable beta chain that defines this disease, which is the subject
  of the second knowledge-gap discussion.

  The deep-research report cited OMIM 141900 for this disorder. That is the HBB
  gene entry; MONDO:0011381 xrefs the phenotype entry OMIM 603902, which is what
  preflight-dr flagged. The disease identity is otherwise correct - causal gene
  HBB, is_a beta thalassemia, synonym "inclusion body beta-thalassemia" - so the
  report was used, with the OMIM discrepancy noted rather than propagated.

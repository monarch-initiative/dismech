      label: Hemolytic anemia
  evidence:
  - reference: PMID:142356
    reference_title: An ultrastructural study of the red pulp of the spleen and the liver in unstable hemoglobin hemolytic anemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

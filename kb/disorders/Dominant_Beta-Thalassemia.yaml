    causal_link_type: DIRECT
  - target: Splenomegaly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:142356
    reference_title: An ultrastructural study of the red pulp of the spleen and the liver in unstable hemoglobin hemolytic anemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two major mechanisms of destruction of Heinz body-containing red cells were noted. One was phagocytosis of these cells in toto by cordal macrophages. The other mechanism though less significant quantitatively, was intravascular hemolysis of injured red cells in the splenic microvasculature.
    explanation: >-
      Direct ultrastructural observation of the two destruction routes and their
      relative weight. Indirect for this entry because the patient studied had a
      new unstable haemoglobin variant with Heinz-body haemolysis rather than a
      genotyped dominant beta-thalassemia allele; the mechanism is the shared
      one.
  - reference: PMID:142356
    reference_title: An ultrastructural study of the red pulp of the spleen and the liver in unstable hemoglobin hemolytic anemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These morphological findings, together with almost complete recovery from hemolysis following splenectomy, indicated that Heinz body-containing red cells were removed from the circulation predominantly by the spleen.
    explanation: >-
      Pairs the morphology with the splenectomy response, which is the closest
      thing to a causal test available for this step.
phenotypes:
- name: Secondary iron overload
  category: Hematologic
  description: >-
    Iron accumulation arising from two independent routes: transfusion where it
    is given, and increased intestinal absorption driven by ineffective
    erythropoiesis regardless of transfusion. The second route is why this is
    expected even in individuals transfused rarely or never, and it is what
    makes chelation a treatment in its own right here rather than an adjunct to
    transfusion.
  phenotype_term:
    preferred_term: Abnormality of iron homeostasis
    term:
      id: HP:0011031
      label: Abnormality of iron homeostasis
  evidence:
  - reference: PMID:20301599
    reference_title: Beta-Thalassemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with β-thalassemia intermedia are at risk for iron overload secondary to increased intestinal absorption of iron as a result of dysregulation of iron metabolism caused by ineffective erythropoiesis.
    explanation: >-
      States the transfusion-independent mechanism and attributes it to
      ineffective erythropoiesis, which this entry models as a pathophysiology
      node. Indirect: GeneReviews describes recessive beta-thalassemia, and this
      sentence addresses the intermedia severity band rather than the dominant
      genotype.
- name: Reticulocytosis
  category: Hematologic
  description: >-
    The marrow's compensatory response to peripheral destruction, and part of
    what makes this a compensated hemolytic picture rather than a pure
    production failure.
  phenotype_term:
    preferred_term: Reticulocytosis
    term:
      id: HP:0001923
      label: Reticulocytosis
  evidence:
  - reference: PMID:7693620
    reference_title: "Hb Hradec Kralove (Hb HK) or alpha 2 beta 2 115(G17)Ala-->Asp, a severely unstable hemoglobin variant resulting in a dominant beta-thalassemia trait in a Czech family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Its presence results in a dominant type of beta-thalassemia in the two heterozygotes, with moderate anemia, reticulocytosis, nucleated red cells, target cells, and other red cell changes, Heinz body formation, and splenomegaly
    explanation: >-
      Reported directly in the two heterozygotes carrying the dominant allele.
      The same sentence carries the anemia, the Heinz bodies and the
      splenomegaly, so it describes this entry's core clinical picture in one
      place.
- name: Hemolytic anemia
  category: Hematologic
  diagnostic: true
  description: >-
    Moderate hemolysis with reticulocytosis, producing a thalassemia-intermedia
    picture. Its presence in a heterozygote is precisely what should prompt the
    diagnosis, since an ordinary beta-thalassemia carrier has microcytosis and
    little or no hemolysis.
  phenotype_term:
    preferred_term: Hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  evidence:
  - reference: PMID:34957901
    reference_title: "Dominant β-Thalassemia Phenotype Caused by Hb Dieppe (HBB: c.383A>G): Another Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Certain missense mutations in exon 3, however, produce unstable globins causing a dominant β-thal phenotype or hemolytic anemia in heterozygotes.
    explanation: >-
      Names hemolytic anemia as the heterozygote phenotype, against the
      near-silent carrier state of the recessive disease.
- name: Anemia
  category: Hematologic
  description: >-
    The combined result of ineffective erythropoiesis in the marrow and
    peripheral hemolysis. Severity is variable even within a family carrying one
    allele, which is a substantive finding rather than a hedge.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  evidence:
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic manifestation of beta-thal. intermedia was revealed in three families with CD 121 (G-T) and in a family with a mutation in CD 112, but the phenotypic manifestations differed markedly in individual subjects.

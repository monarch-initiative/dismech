genetic:
- name: HBB
  association: Causal heterozygous variant
  gene_term:
    preferred_term: HBB
    term:
      id: hgnc:4827
      label: HBB
  frequency: The only gene; the disorder is defined by a specific class of HBB allele.
  notes: >-
    What distinguishes a dominant HBB allele from an ordinary one is where it
    sits and what it produces, not how damaging it looks. Exon 3 is the
    location that matters, because a premature stop there escapes
    nonsense-mediated decay and gets translated; the same change in exon 1 or 2
    would be degraded and behave recessively. Reported alleles include nonsense
    changes at codons 112 and 121, missense changes such as Hb Dieppe and Hb
    Hradec Kralove, and elongating frameshifts such as Hb Grand Junction.

    Two practical consequences. A variant-effect predictor that scores a
    nonsense allele as more damaging than a missense one gets the inheritance
    backwards here. And an apparently de novo case is entirely expected: one of
    the Czech families' haplotypes suggested de novo origin, and because these
    alleles carry no malaria advantage they do not persist in populations.

    Modifier genotype is worth asking about. Co-inherited alpha-thalassemia
    reduces the chain imbalance and softens the phenotype, which has been seen
    directly in patients carrying a 3.7 kb alpha deletion alongside a
    hyperunstable beta variant.
  evidence:
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The haplotype in one of the families suggests a de novo origin of the mutation in CD 121.
    explanation: >-
      Supports expecting de novo alleles rather than treating a negative family
      history as evidence against the diagnosis.
  - reference: PMID:8184583
    reference_title: "[Dominant beta-thalassemia alleles in the Czech and Slovak population (beta-thalassemia mutations in 112(T-A) and 121(G-T) codons and the unstable Hradec Králové hemoglobin or alpha 2 beta 2 115 (G17) Ala-Asp)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An exact explanation of phenotypic deviations in patients with the same mutation even within the same family were not obtained even in studies of alpha genes and the promoter area of the beta gene.
    explanation: >-
      A negative result worth curating: the authors looked for the modifiers
      that would explain within-family variability, at the alpha genes and the
      beta promoter, and did not find them. The alpha-thalassemia modifier is
      real but does not account for everything.
  - reference: PMID:24432801
    reference_title: "Hb Grand Junction (HBB: c.348_349delinsG; p.His117IlefsX42): a new hyperunstable hemoglobin variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two Hispanic adolescents with a new unstable Hb variant (HBB: c.348_349delinsG; p.His117IlefsX42), resulting from a frameshift mutation at codons 115/116 of the β-globin gene.
    explanation: >-
      Adds the elongating-frameshift allele class, and the pan-ethnic
      distribution the selection argument predicts.
treatments:
- name: Splenectomy
  description: >-
    The intervention with the clearest mechanistic rationale in this disorder,
    because the spleen is demonstrably where inclusion-bearing red cells are
    destroyed. Near-complete recovery from hemolysis after splenectomy has been
    documented. It is not without cost - asplenia carries lifelong infection
    risk - so this records the rationale, not a recommendation to operate.

name: Platelet-type Bleeding Disorder 20
creation_date: "2026-08-26T16:00:00Z"
category: Mendelian
disease_term:
  preferred_term: platelet-type bleeding disorder 20
  term:
    id: MONDO:0014830
    label: platelet-type bleeding disorder 20
synonyms:
- BDPLT20
- SLFN14-related thrombocytopenia
- SLFN14-related macrothrombocytopenia
description: >-
  An autosomal dominant inherited thrombocytopenia caused by heterozygous variants in
  SLFN14, which encodes a ribosome-associated endoribonuclease. Patients have moderate
  thrombocytopenia with enlarged platelets, reduced dense granules and impaired ATP
  secretion, and a lifelong mucocutaneous bleeding tendency that is more troublesome than
  the modest laboratory abnormalities predict.

  The entry is organised around one fact that makes this disease unusual: the defect is in
  RNA turnover, not in any platelet receptor, granule protein or cytoskeletal component.
  SLFN14 sits on the ribosome and cleaves RNA. Megakaryocytes and erythroid precursors are
  where it is expressed, and a megakaryocyte in the act of shedding platelets is unusually
  dependent on getting ribosome and transcript turnover right - so a general defect in RNA
  handling lands on this one lineage and produces a bleeding disorder.

  Two things are curated here as unresolved rather than smoothed over.

  The first is the molecular mechanism, which has two incompatible accounts in the
  literature and no adjudicating experiment. On the older account the AAA-domain variants
  misfold, are degraded, and drag down the wild-type protein with them - a dominant
  negative that works by loss of SLFN14 activity. On the newer account the variants do not
  simply lose activity but redirect it, shifting the enzyme's preference from ribosomal RNA
  towards type II tRNAs and stalling translation. These predict opposite things about what
  a therapy should do, so the entry curates both as competing hypotheses and tags the
  causal edges accordingly.

  The second is that the obvious mouse model does not work. A knockin carrying the mouse
  equivalent of the commonest patient variant is not a bleeding model at all - it is an
  erythroid one. A later conditional knockout restricted to the megakaryocyte lineage does
  reproduce the bleeding phenotype. Both are curated, with the failure recorded as a
  failure.

parents:
- Inherited Thrombocytopenia
- Inherited Platelet Function Disorder

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate exists. The founding report identified 12 patients from 3
    unrelated families within a 36-patient thrombocytopenia cohort recruited to a national
    platelet-genotyping study; subsequent reports have added single families. The disease
    is defined from case series rather than from any population sample.
  evidence:
  - reference: PMID:26280575
    reference_title: "SLFN14 mutations underlie thrombocytopenia with excessive bleeding and platelet secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed platelet phenotyping and whole-exome sequencing (WES) on all patients
      and identified mutations in schlafen 14 (SLFN14) in 12 patients from 3 unrelated
      families.
    explanation: >-
      The size of the founding cohort and how it was ascertained, which is what bounds any
      statement about how common this disease is.

pathophysiology:

- name: Heterozygous SLFN14 Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A single SLFN14 allele carries a missense variant. The reported variants cluster
    tightly: K218E, K219N and V220D lie in three consecutive residues of the AAA domain,
    and R223W sits four residues further along, so the recurrent lesion is a small patch of
    the RNA-binding cleft rather than a scatter across the protein.

    Later reports have added variants in the C-terminal helicase domain, which is a
    different part of the protein and appears to act differently; those are noted on the
    gene entry rather than folded into this node.
  genetic_context:
    gene:
      preferred_term: SLFN14
      term:
        id: hgnc:32689
        label: SLFN14
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous missense variants segregating dominantly. Deliberately carries no
      `functional_impact_category`: the two competing mechanistic accounts below disagree
      on whether these alleles are loss-of-function or neomorphic, and choosing a value
      here would silently settle a question the literature has not.
  downstream:
  - target: Reduced SLFN14 Protein Abundance
    causal_link_type: DIRECT
    hypothesis_groups:
    - dominant_negative_degradation
    description: >-
      On the dominant-negative account, the substituted residues destabilise the fold and
      the protein is degraded post-translationally.
  - target: Redirected Endoribonuclease Substrate Specificity
    causal_link_type: DIRECT
    hypothesis_groups:
    - redirected_substrate_specificity
    description: >-
      On the altered-specificity account, the same substitutions sit in the RNA-binding
      cleft and change which RNAs the enzyme prefers rather than abolishing activity.
  evidence:
  - reference: PMID:26280575
    reference_title: "SLFN14 mutations underlie thrombocytopenia with excessive bleeding and platelet secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three heterozygous missense mutations were identified in affected family members and
      predicted to encode substitutions (K218E, K219N, and V220D) within an ATPase-AAA-4,
      GTP/ATP-binding region of SLFN14.
    explanation: >-
      The founding variants and the domain they fall in.
  - reference: PMID:42213791
    reference_title: "Type II tRNA cleavage by SLFN14 endoribonuclease variants linked to inherited thrombocytopenia drives global translational repression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      most IT-associated SLFN14 mutations, including K218E, K219N/E, V220D, and R223W,
      cluster within the RNA-binding cleft of the RNase domain
    explanation: >-
      Locates the recurrent variants structurally, which is the observation both
      mechanistic accounts start from.

- name: Reduced SLFN14 Protein Abundance
  role: mechanism
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    SLFN14 protein is markedly reduced in patient platelets and in cells transfected with
    the mutant construct. The reduction is post-translational: the variants partially
    misfold and are degraded, and because the mutant protein also oligomerises, the
    wild-type product made from the normal allele is dragged down with it. That is the
    proposed basis of dominance.

    Curated as ESTABLISHED because the measurement itself - less protein in patient
    platelets - is reproduced across reports. What is contested is whether losing protein
    is the whole story, which is the point of the competing node below.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  downstream:
  - target: Dysregulated Ribosomal RNA Turnover
    causal_link_type: DIRECT
    hypothesis_groups:
    - dominant_negative_degradation
    description: >-
      Less enzyme on the ribosome means less of the rRNA degradation it normally performs.
  evidence:
  - reference: PMID:26280575
    reference_title: "SLFN14 mutations underlie thrombocytopenia with excessive bleeding and platelet secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endogenous SLFN14 expression was reduced in platelets from all patients, and mutant
      SLFN14 expression was markedly decreased compared with that of WT SLFN14 when
      overexpressed in transfected cells.
    explanation: >-
      The reduction measured in patients and reproduced in transfected cells.
  - reference: PMID:29678925
    reference_title: "Role of the novel endoribonuclease SLFN14 and its disease-causing mutations in ribosomal degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared to SLFN14 WT, expression of mutants is dramatically reduced as a result of
      post-translational degradation due to partial misfolding of the protein.
    explanation: >-
      Identifies the mechanism of the reduction as misfolding and degradation rather than
      reduced transcription.
  - reference: PMID:29678925
    reference_title: "Role of the novel endoribonuclease SLFN14 and its disease-causing mutations in ribosomal degradation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These findings could explain the dominant negative effect of heterozygous mutation on
      SLFN14 expression in patients' platelets.
    explanation: >-
      PARTIAL because the source frames the dominant-negative reading as an explanation its
      data could support rather than one it demonstrates.

- name: Redirected Endoribonuclease Substrate Specificity
  role: mechanism
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The competing account. Rather than simply having less enzyme, patient variants have an
    enzyme that prefers different substrates: depletion of type II tRNAs is enhanced while
    cleavage of ribosomal RNA is reduced. That is a change in what the enzyme does, not
    only in how much of it there is.

    The distinction matters because the two accounts point opposite ways therapeutically.
    If the lesion is loss of SLFN14, restoring or stabilising the protein is the goal. If
    the lesion is redirected activity, restoring the protein would deliver more of the
    wrong enzymatic activity, and inhibiting it would be closer to right.

    PROVISIONAL: the work is in an overexpression cell system rather than in
    megakaryocytes or patient cells, and no experiment has yet distinguished the two
    accounts in the lineage that actually fails.
  molecular_functions:
  - preferred_term: RNA endonuclease activity
    term:
      id: GO:0004521
      label: RNA endonuclease activity
    modifier: ABNORMAL
  downstream:
  - target: Dysregulated Ribosomal RNA Turnover
    causal_link_type: DIRECT
    hypothesis_groups:
    - redirected_substrate_specificity
    description: >-
      Reduced rRNA cleavage is part of the same substrate shift, so this account reaches
      the shared downstream node too - by a different route and with the opposite sign on
      the tRNA arm.
  evidence:
  - reference: PMID:42213791
    reference_title: "Type II tRNA cleavage by SLFN14 endoribonuclease variants linked to inherited thrombocytopenia drives global translational repression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IT-linked mutations alter SLFN14 RNA substrate specificity, enhancing depletion of
      type II tRNAs while reducing rRNA cleavage.
    explanation: >-
      The substrate shift itself, which is the whole of this node's claim.
  - reference: PMID:42213791
    reference_title: "Type II tRNA cleavage by SLFN14 endoribonuclease variants linked to inherited thrombocytopenia drives global translational repression."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Most IT-associated mutations in the RNase domain reduce RNA cleavage activity in
      vitro
    explanation: >-
      PARTIAL and cited deliberately against this node: the same paper records the prior
      in-vitro consensus that these mutations reduce activity, which is what the
      dominant-negative account rests on.

- name: Dysregulated Ribosomal RNA Turnover
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Whichever route reaches it, the shared consequence is that RNA turnover on the ribosome
    is no longer normal in this lineage. Patient platelets and mature megakaryocytes show
    signs of ribosomal RNA degradation, and the observation is lineage- and
    stage-restricted - it is absent from undifferentiated megakaryocytic cells and from
    granulocytes, which is the clearest evidence that the defect only bites where SLFN14
    normally works hardest.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  cellular_components:
  - preferred_term: ribosome
    term:
      id: GO:0005840
      label: ribosome
  biological_processes:
  - preferred_term: rRNA catabolic process
    term:
      id: GO:0016075
      label: rRNA catabolic process
    modifier: ABNORMAL
  - preferred_term: tRNA decay
    term:
      id: GO:0016078
      label: tRNA decay
    modifier: ABNORMAL
  downstream:
  - target: Impaired Megakaryocyte Maturation and Proplatelet Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Typed with unknown intermediates deliberately. That disordered ribosomal RNA turnover
      precedes the megakaryocyte defect is established by the staging of the observations,
      but which transcripts fail to be made, and why proplatelet formation specifically is
      the step that breaks, has not been shown.
  evidence:
  - reference: PMID:36790527
    reference_title: "Ribosome dysfunction underlies SLFN14-related thrombocytopenia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      SLFN14-defective platelets and mature MK showed signs of rRNA degradation; however,
      this was absent in undifferentiated imMKCL cells and granulocytes.
    explanation: >-
      Both halves matter: the rRNA abnormality, and its restriction to mature cells of this
      lineage, which is what makes it a plausible explanation for a lineage-specific disease.
  - reference: PMID:29678925
    reference_title: "Role of the novel endoribonuclease SLFN14 and its disease-causing mutations in ribosomal degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that all SLFN14 variants colocalize with ribosomes and mediate rRNA
      endonucleolytic degradation.
    explanation: >-
      Places the enzyme and its variants on the ribosome, which is the physical basis for
      this node.
  - reference: PMID:42213791
    reference_title: "Type II tRNA cleavage by SLFN14 endoribonuclease variants linked to inherited thrombocytopenia drives global translational repression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This shift promotes ribosome stalling at codons decoded by type II tRNAs, triggering
      global translational arrest, stress signaling, and cell death.
    explanation: >-
      The translational consequence proposed by the altered-specificity account, which is
      why this node names tRNA decay alongside rRNA turnover.

- name: Impaired Megakaryocyte Maturation and Proplatelet Formation
  role: effector
  biological_scale: CELLULAR
  description: >-
    The cellular step at which the disease becomes a platelet disease. Megakaryocytes
    cultured from patients make fewer proplatelets, and the ones they make are shorter and
    less branched - a defect in the physical act of shedding platelets rather than in
    megakaryocyte number alone. Engineered megakaryocytic lines carrying the commonest
    patient variant reproduce it, together with disordered mitochondrial organisation.
  cell_types:
  - preferred_term: megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  biological_processes:
  - preferred_term: platelet formation
    term:
      id: GO:0030220
      label: platelet formation
    modifier: DECREASED
  - preferred_term: megakaryocyte differentiation
    term:
      id: GO:0030219
      label: megakaryocyte differentiation
    modifier: ABNORMAL
  downstream:
  - target: Macrothrombocytopenia
    causal_link_type: DIRECT
    description: >-
      Fewer and abnormally formed proplatelets yield fewer, larger circulating platelets.
  - target: Platelet Dense Granule Deficiency
    causal_link_type: DIRECT
    description: >-
      Platelets shed from a megakaryocyte that matured abnormally carry an abnormal granule
      complement.
  evidence:
  - reference: PMID:36790527
    reference_title: "Ribosome dysfunction underlies SLFN14-related thrombocytopenia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Megakaryocyte (MK) cultures from patients produce less proplatelets with shorter
      elongation and reduced ramification of their shafts.
    explanation: >-
      The proplatelet defect measured in patient-derived megakaryocytes, in the specific
      terms this node claims.
  - reference: PMID:36790527
    reference_title: "Ribosome dysfunction underlies SLFN14-related thrombocytopenia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MK derived from heterozygous and homozygous SLFN14 K219N imMKCL and stem cells of
      blood from patients mainly presented with a defect in proplatelet formation and
      mitochondrial organization.
    explanation: >-
      Reproduces the defect in an engineered line carrying the patient variant, which
      controls for patient background.

- name: Macrothrombocytopenia
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Moderately reduced platelet count with enlarged platelets. The combination is the
    diagnostic signature, and its moderate degree is part of why the disease is easy to
    under-rate: the count alone does not predict how much these patients bleed.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  downstream:
  - target: Mucocutaneous Bleeding Diathesis
    causal_link_type: DIRECT
    description: >-
      Fewer circulating platelets contribute to impaired primary haemostasis, alongside the
      secretion defect.
  evidence:
  - reference: PMID:26280575
    reference_title: "SLFN14 mutations underlie thrombocytopenia with excessive bleeding and platelet secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients harboring SLFN14 mutations displayed an analogous phenotype that consisted
      of moderate thrombocytopenia, enlarged platelets, decreased ATP secretion, and a
      dominant inheritance pattern.
    explanation: >-
      The full phenotype as first described, including the two components of this node and
      the inheritance pattern.

- name: Platelet Dense Granule Deficiency
  role: effector
  biological_scale: CELLULAR
  description: >-
    Electron microscopy shows fewer dense granules in patient platelets, and the deficit
    tracks with the measured loss of ATP secretion on lumiaggregometry - so this is a
    storage-pool defect with a matching functional readout rather than an isolated
    morphological observation.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet degranulation
    term:
      id: GO:0002576
      label: platelet degranulation
    modifier: DECREASED
  downstream:
  - target: Mucocutaneous Bleeding Diathesis
    causal_link_type: DIRECT
    description: >-
      Failure of dense-granule release removes the ADP- and ATP-dependent amplification
      that recruits further platelets to a forming plug.
  evidence:
  - reference: PMID:26280575
    reference_title: "SLFN14 mutations underlie thrombocytopenia with excessive bleeding and platelet secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electron microscopy revealed a reduced number of dense granules in affected patients
      platelets, correlating with a decreased ATP secretion observed in lumiaggregometry
      studies.
    explanation: >-
      The structural deficit and the functional correlate reported together, which is what
      this node asserts.
  - reference: PMID:40794453
    reference_title: "Platelet-specific SLFN14 deletion causes macrothrombocytopenia and platelet dysfunction through dysregulated megakaryocyte and platelet gene expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial functional investigation of the patients with SLFN14 mutations (V220D, K218E,
      and K219N) revealed mild macrothrombocytopenia; platelet function defects in response
      to adenosine diphosphate (ADP), collagen, and protease-activated receptor 1 (PAR1)
      peptide; and decreased adenosine triphosphate (ATP) secretion
    explanation: >-
      The agonist-specific aggregation defects alongside the secretion defect, restating the
      patient phenotype from a later review of the same families.

- name: Mucocutaneous Bleeding Diathesis
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: bruising, epistaxis, gum bleeding, heavy menstrual bleeding and
    excessive bleeding after trauma, dental work or delivery.

    Its most striking feature is disproportion. Every patient in the founding families had
    an obvious bleeding tendency while the laboratory abnormalities - platelet count,
    aggregation, secretion - were only mildly deranged. A normal-looking platelet panel
    does not exclude this diagnosis.
  evidence:
  - reference: PMID:36790527
    reference_title: "Ribosome dysfunction underlies SLFN14-related thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Obvious bleeding tendencies were reported in all patients whereas laboratory testing
      showed mild defects in platelet aggregation and adenosine triphosphate (ATP)
      secretion, and platelet counts that were mildly reduced.
    explanation: >-
      States the disproportion between symptoms and laboratory findings directly, which is
      the clinically load-bearing part of this node.

mechanistic_hypotheses:

- hypothesis_group_id: dominant_negative_degradation
  hypothesis_label: Dominant-negative loss of SLFN14 through misfolding and degradation
  status: CANONICAL
  description: >-
    The variants destabilise the protein, which is degraded post-translationally; because
    SLFN14 oligomerises, mutant subunits also reduce the wild-type pool, giving dominance
    from what is fundamentally a loss of enzyme. This is the older account and the one the
    measured reduction of SLFN14 in patient platelets most directly supports.
  evidence:
  - reference: PMID:29678925
    reference_title: "Role of the novel endoribonuclease SLFN14 and its disease-causing mutations in ribosomal degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared to SLFN14 WT, expression of mutants is dramatically reduced as a result of
      post-translational degradation due to partial misfolding of the protein.
    explanation: >-
      The degradation mechanism this hypothesis rests on.

- hypothesis_group_id: redirected_substrate_specificity
  hypothesis_label: Redirected endoribonuclease specificity towards type II tRNAs
  status: EMERGING
  description: >-
    The variants do not merely reduce activity but change which RNAs are cleaved, driving
    type II tRNA depletion, ribosome stalling and translational arrest. On this account the
    disease is caused by an activity the mutant enzyme has, not by one it lacks - which
    inverts the therapeutic goal.
  evidence:
  - reference: PMID:42213791
    reference_title: "Type II tRNA cleavage by SLFN14 endoribonuclease variants linked to inherited thrombocytopenia drives global translational repression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IT-linked mutations alter SLFN14 RNA substrate specificity, enhancing depletion of
      type II tRNAs while reducing rRNA cleavage.
    explanation: >-
      The substrate shift that defines this hypothesis.


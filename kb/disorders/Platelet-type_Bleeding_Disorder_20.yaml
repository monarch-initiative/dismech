genetic:

- name: SLFN14
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SLFN14
    term:
      id: hgnc:32689
      label: SLFN14
  association: >-
    Heterozygous SLFN14 variants cause this disease. The gene was established by exome
    sequencing of a national platelet-genotyping cohort, which found variants in 12
    patients across 3 unrelated families with a shared and distinctive platelet phenotype -
    a strong founding design, because the families were ascertained on bleeding rather than
    on the gene.

    The variant spectrum is unusually concentrated. K218E, K219N and V220D occupy three
    consecutive residues; R223W is four residues away. All four sit in the RNA-binding
    cleft of the RNase domain. Variants have since been reported in the C-terminal helicase
    domain, which is a different region and appears to produce its effects by a different
    route; whether helicase-domain disease is the same entity as AAA-domain disease is not
    settled, and this entry does not assume it is.

    SLFN14 is expressed in megakaryocyte and erythroid precursors, which is what makes a
    general RNA-handling enzyme into a lineage-restricted disease gene.
  evidence:
  - reference: PMID:26280575
    reference_title: "SLFN14 mutations underlie thrombocytopenia with excessive bleeding and platelet secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed platelet phenotyping and whole-exome sequencing (WES) on all patients
      and identified mutations in schlafen 14 (SLFN14) in 12 patients from 3 unrelated
      families.
    explanation: >-
      The gene-disease claim and the design that supports it.
  - reference: PMID:42213791
    reference_title: "Type II tRNA cleavage by SLFN14 endoribonuclease variants linked to inherited thrombocytopenia drives global translational repression."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SLFN14 is predominantly expressed in hematopoietic lineages, especially megakaryocyte
      (MK) and erythroid precursors
    explanation: >-
      The expression pattern that explains why a ubiquitous biochemical function produces a
      platelet-restricted disease.

inheritance:

- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single variant allele is sufficient, with dominant segregation in all three founding
    families. The mechanism of dominance is exactly what the two competing hypotheses
    disagree about: interference with the wild-type product on one account, an acquired
    activity on the other.
  evidence:
  - reference: PMID:42213791
    reference_title: "Type II tRNA cleavage by SLFN14 endoribonuclease variants linked to inherited thrombocytopenia drives global translational repression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous missense mutations in SLFN14 cause an autosomal dominant form of IT,
      characterized by defective platelet function and excessive bleeding
    explanation: >-
      States the inheritance pattern and the phenotype it transmits.

animal_models:

- name: Megakaryocyte- and platelet-specific Slfn14 conditional knockout mouse (Slfn14 PF4-Cre)
  species: Mouse
  genotype: Slfn14 exons 2-3 deleted under PF4-Cre (megakaryocyte/platelet lineage)
  publication: PMID:40794453
  description: >-
    A conditional knockout restricting Slfn14 deletion to the megakaryocyte and platelet
    lineage. It was built after the global knockin failed to model the human disease, and
    it succeeds where that model did not: these mice bleed.
  modeled_mechanisms:
  - target: Mucocutaneous Bleeding Diathesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the bleeding phenotype with impaired platelet responses and delayed
      thrombus formation in vivo.
    limitations: >-
      A lineage-restricted complete knockout, whereas patients are heterozygous for missense
      alleles in every cell. It therefore models the consequence of losing SLFN14 in
      megakaryocytes, which is the dominant-negative account's prediction, and cannot speak
      to the altered-specificity account at all - a mutant enzyme with redirected activity
      is not the same thing as no enzyme.
    readouts:
    - name: Bleeding tendency and thrombus formation by intravital imaging
      target: Mucocutaneous Bleeding Diathesis
      direction: INCREASED
      interpretation: >-
        Increased bleeding and delayed thrombus formation relative to Cre-negative
        littermates.
      evidence:
      - reference: PMID:40794453
        reference_title: "Platelet-specific SLFN14 deletion causes macrothrombocytopenia and platelet dysfunction through dysregulated megakaryocyte and platelet gene expression."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Slfn14 PF4-Cre+ platelets displayed reduced platelet signaling to thrombin,
          reduced thrombin formation, increased bleeding tendency, and delayed thrombus
          formation as assessed by intravital imaging.
        explanation: >-
          The in vivo bleeding and thrombus measurements behind this readout.
    evidence:
    - reference: PMID:40794453
      reference_title: "Platelet-specific SLFN14 deletion causes macrothrombocytopenia and platelet dysfunction through dysregulated megakaryocyte and platelet gene expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Slfn14 PF4-Cre+ platelets displayed reduced platelet signaling to thrombin, reduced
        thrombin formation, increased bleeding tendency, and delayed thrombus formation as
        assessed by intravital imaging.
      explanation: >-
        Supports treating this mouse as informative for the human bleeding phenotype.
  - target: Impaired Megakaryocyte Maturation and Proplatelet Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Fewer megakaryocytes in situ in the bone marrow, consistent with the megakaryocyte
      defect seen in patient-derived cultures.
    limitations: >-
      The mouse readout is megakaryocyte number in marrow; the human readout is proplatelet
      morphology in culture. They point the same way but are not the same measurement.
    readouts:
    - name: Bone marrow megakaryocyte number in situ
      target: Impaired Megakaryocyte Maturation and Proplatelet Formation
      direction: DECREASED
      interpretation: >-
        Fewer megakaryocytes present in situ compared with control marrow.
      evidence:
      - reference: PMID:40794453
        reference_title: "Platelet-specific SLFN14 deletion causes macrothrombocytopenia and platelet dysfunction through dysregulated megakaryocyte and platelet gene expression."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Moreover, fewer in situ bone marrow MKs were present compared with controls.
        explanation: >-
          The marrow measurement behind this readout.
    evidence:
    - reference: PMID:40794453
      reference_title: "Platelet-specific SLFN14 deletion causes macrothrombocytopenia and platelet dysfunction through dysregulated megakaryocyte and platelet gene expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, fewer in situ bone marrow MKs were present compared with controls.
      explanation: >-
        Supports the model as informative for the megakaryocyte node.

- name: Global Slfn14 K208N knockin mouse
  species: Mouse
  genotype: Slfn14 K208N knockin (mouse homologue of human K219N), global
  publication: PMID:40794453
  description: >-
    The obvious model - a knockin of the mouse equivalent of the commonest patient variant,
    in every cell, matching the human genotype in kind. It does not model the human disease.
    Homozygotes have an erythroid phenotype with microcytic erythrocytosis and die in utero;
    heterozygotes have anaemia and splenomegaly. The platelet and bleeding phenotype that
    defines the human condition is absent.

    Curated because a negative result of this size constrains how the rest of the model
    evidence should be read, and because it is the reason the conditional knockout above
    exists.
  modeled_mechanisms:
  - target: Mucocutaneous Bleeding Diathesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The genotype-matched model produces an erythroid disease rather than a bleeding
      disease.
    limitations: >-
      The divergence is attributed to species differences in which lineage depends most on
      SLFN14, but that explanation has not been tested. Until it is, the mouse cannot be
      used to argue either for or against a mechanism of the human bleeding phenotype, and
      no therapeutic inference should be drawn from it.
    evidence:
    - reference: PMID:40794453
      reference_title: "Platelet-specific SLFN14 deletion causes macrothrombocytopenia and platelet dysfunction through dysregulated megakaryocyte and platelet gene expression."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Unlike the human SLFN14 K219N mutation, mice did not present with a major bleeding
        or platelet defect
      explanation: >-
        REFUTE against the proposition that this model reproduces the human phenotype, which
        is what FAILS_TO_RECAPITULATE asserts.
    - reference: PMID:40794453
      reference_title: "Platelet-specific SLFN14 deletion causes macrothrombocytopenia and platelet dysfunction through dysregulated megakaryocyte and platelet gene expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The data showed that homozygous Slfn14 K208N resulted in a largely erythrocyte
        phenotype with microcytic erythrocytosis, with homozygous embryonic lethality beyond
        day 16.5 in utero.
      explanation: >-
        What the model produces instead, which is the substance of the mismatch.

diagnosis:

- name: Platelet Function Testing with Lumiaggregometry
  description: >-
    Aggregation and ATP-release testing is what separates this disease from an isolated
    thrombocytopenia. The pattern is reduced aggregation to ADP, collagen and PAR1 peptide
    together with reduced ATP secretion; electron microscopy showing a reduced dense-granule
    count supports it. The abnormalities are mild, so a normal-looking screen in a patient
    who bleeds should not close the question.
  evidence:
  - reference: PMID:26280575
    reference_title: "SLFN14 mutations underlie thrombocytopenia with excessive bleeding and platelet secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electron microscopy revealed a reduced number of dense granules in affected patients
      platelets, correlating with a decreased ATP secretion observed in lumiaggregometry
      studies.
    explanation: >-
      The two tests and the fact that their results correspond, which is what makes the pair
      diagnostically useful.

- name: Exome or Platelet-Disorder Panel Sequencing
  description: >-
    The disease was found by exome sequencing of a bleeding cohort and is diagnosed the same
    way. SLFN14 belongs on inherited-thrombocytopenia panels; the phenotype is not
    distinctive enough at the bedside to prompt single-gene testing.
  evidence:
  - reference: PMID:26280575
    reference_title: "SLFN14 mutations underlie thrombocytopenia with excessive bleeding and platelet secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed platelet phenotyping and whole-exome sequencing (WES) on all patients
      and identified mutations in schlafen 14 (SLFN14) in 12 patients from 3 unrelated
      families.
    explanation: >-
      The diagnostic route that established the disease and remains the one that finds it.

treatments:

- name: Antifibrinolytic Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Tranexamic acid for mucosal bleeding and menorrhagia, on the general principle for
    inherited platelet function disorders that stabilising a formed clot compensates for a
    platelet that cannot amplify plug formation. No SLFN14-specific outcome data exist.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Mucocutaneous Bleeding Diathesis
    description: >-
      Acts on the clinical endpoint by preventing clot lysis. It does nothing about the
      granule or megakaryocyte defects upstream.
  notes: >-
    Carries no evidence item deliberately. The cited SLFN14 literature reports no treatment
    outcomes; this is standard practice for the disease class, and attaching a quote from a
    paper about a different disorder would misrepresent it.

- name: Platelet Transfusion
  therapeutic_modality: CELL_THERAPY
  description: >-
    Reserved for major bleeding or surgical cover, as in other inherited platelet function
    disorders. Repeated transfusion carries alloimmunisation risk, which is the usual reason
    to prefer antifibrinolytics for mucosal bleeding.
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Platelet Dense Granule Deficiency
    description: >-
      Supplies platelets with a normal granule complement, bypassing rather than correcting
      the patient's own secretion defect.
  notes: >-
    No evidence item, for the same reason as above: no SLFN14-specific transfusion outcome
    data are published.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal dominant inheritance with a 50% recurrence risk per pregnancy. Two points are
    worth raising specifically: bleeding severity is not predicted by the platelet count, and
    an apparently de novo case does not exclude parental transmission, since gonosomal
    mosaicism has been reported in this gene.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42213791
    reference_title: "Type II tRNA cleavage by SLFN14 endoribonuclease variants linked to inherited thrombocytopenia drives global translational repression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous missense mutations in SLFN14 cause an autosomal dominant form of IT,
      characterized by defective platelet function and excessive bleeding
    explanation: >-
      The inheritance pattern that sets the recurrence risk counselling is based on.

discussions:

- discussion_id: controversy_lof_versus_neomorph
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced SLFN14 Protein Abundance
  - pathophysiology#Redirected Endoribonuclease Substrate Specificity
  - mechanistic_hypotheses#dominant_negative_degradation
  - mechanistic_hypotheses#redirected_substrate_specificity
  prompt: >-
    Do SLFN14 variants cause disease by removing enzyme activity, or by redirecting it onto
    the wrong substrates?
  rationale: >-
    Both accounts are supported by real data and they are not compatible.

    The loss account has the more direct clinical observation behind it: SLFN14 protein is
    markedly reduced in patient platelets, the reduction is explained by misfolding and
    post-translational degradation, and oligomerisation gives a route to dominance. Most
    disease-associated RNase-domain mutations reduce cleavage activity in vitro.

    The redirection account explains something the loss account does not. If the lesion were
    simply less enzyme, a heterozygote with roughly half-normal activity should be mildly
    affected in proportion; instead these variants shift which RNAs are cleaved, deplete
    type II tRNAs, stall ribosomes and trigger cell death - an active injury rather than a
    shortfall.

    The distinction is not academic. If the disease is loss of SLFN14, a therapy should
    restore or stabilise the protein. If it is redirected activity, restoring the protein
    delivers more of the harmful activity and inhibition is the rational goal. A therapeutic
    programme cannot be designed until this is settled.

    Neither body of work has been done in megakaryocytes. The degradation studies used
    transfected cell lines; the substrate-specificity study used HEK293T overexpression. The
    lineage where the disease actually happens has not been used to test either.
  proposed_experiments:
  - experiment_id: slfn14_mechanism_discrimination_in_mk
    name: Substrate profiling and rescue in patient-genotype megakaryocytes
    description: >-
      In megakaryocytic lines carrying a patient variant at the endogenous locus, measure
      SLFN14 protein level and profile tRNA and rRNA cleavage in the same cells, then test
      two interventions against proplatelet formation: raising wild-type SLFN14, and
      inhibiting SLFN14 catalytic activity.
    would_support:
    - mechanistic_hypotheses#redirected_substrate_specificity
    would_refute:
    - mechanistic_hypotheses#dominant_negative_degradation
    supporting_outcome:
    - >-
      Type II tRNAs are selectively depleted in patient-genotype megakaryocytes and
      catalytic inhibition rescues proplatelet formation while adding wild-type protein does
      not, which would establish redirected activity as the operative mechanism.
    refuting_outcome:
    - >-
      Adding wild-type SLFN14 rescues proplatelet formation and no selective tRNA depletion
      is detectable, which would support simple dominant-negative loss and retire the
      redirection account for this lineage.

- discussion_id: mismatch_mouse_lineage
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Global Slfn14 K208N knockin mouse
  - pathophysiology#Impaired Megakaryocyte Maturation and Proplatelet Formation
  prompt: >-
    Why does a knockin of the mouse equivalent of the commonest patient variant produce an
    erythroid disease in mice and a platelet disease in humans?
  rationale: >-
    This is a mismatch rather than a gap: the model exists, the result is clear, and it
    disagrees with the patients. Homozygous K208N mice have microcytic erythrocytosis and die
    in utero; heterozygotes have anaemia and splenomegaly. Neither shows the bleeding or
    platelet defect that defines the human disease.

    SLFN14 is expressed in both megakaryocyte and erythroid precursors, so a shift in which
    of the two is rate-limiting between species is a plausible explanation - and it is only
    that. It has not been tested.

    It matters for how the rest of the model evidence is read. The conditional knockout that
    does reproduce bleeding was made by deleting the gene in the megakaryocyte lineage, which
    guarantees a megakaryocyte phenotype by construction. It shows what losing SLFN14 in
    megakaryocytes does; it does not show that the patient variants do that.
  proposed_experiments:
  - experiment_id: slfn14_lineage_dependence_cross_species
    name: Comparative lineage dependence on SLFN14 in mouse and human progenitors
    description: >-
      Quantify SLFN14 expression and the consequences of its loss in matched megakaryocyte
      and erythroid progenitors from mouse and human, and test whether the mouse erythroid
      phenotype converts to a platelet phenotype when the human expression ratio is imposed.
    would_support:
    - pathophysiology#Impaired Megakaryocyte Maturation and Proplatelet Formation
    supporting_outcome:
    - >-
      Mouse erythroid progenitors depend on SLFN14 more than their human counterparts while
      the megakaryocyte dependence is reversed, which would make the mismatch a species
      artefact and leave the human megakaryocyte mechanism transferable.
    refuting_outcome:
    - >-
      Lineage dependence is comparable across species, which would point instead to the
      variant acting differently on the mouse protein and would undercut using any mouse
      model to reason about the human variants.

notes: >-
  Scope and naming. This entry is the OMIM-numbered entity BDPLT20, also written in the
  literature as SLFN14-related thrombocytopenia. It is one of the numbered platelet-type
  bleeding disorders, and is curated as its own entry following the convention already
  established in this knowledge base for that series.

  Domain heterogeneity. The AAA/RNase-domain variants described here are the well
  characterised ones. Helicase-domain variants have since been reported and appear to affect
  different downstream pathways; whether they represent the same disease is unresolved, and
  this entry deliberately does not extend its mechanism nodes to cover them.

  What SLFN14 does elsewhere. SLFN14 is also an interferon-inducible antiviral RNase acting
  against several viruses. That is a function of the normal protein in other cell types and
  has no established bearing on this disease; it is noted because a literature search on the
  gene returns a great deal of virology that is not about bleeding.

  Term binding. No HPO term expresses reduced platelet dense-granule number as such, so that
  finding is curated through the ATP-secretion term, which is the functional readout the
  source reports alongside it.


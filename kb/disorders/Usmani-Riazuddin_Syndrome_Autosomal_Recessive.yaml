pathophysiology:
- name: Biallelic AP1G1 Missense Substitution
  description: >-
    Both AP1G1 alleles carry a missense substitution. In silico analysis and 3D
    protein modelling predicted altered AP1-gamma-1 folding for the missense variants,
    and altered AP1-gamma-1 levels were observed in heterologous cells, so the protein
    is made but is not normal.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: AP1G1
    term:
      id: hgnc:555
      label: AP1G1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Recorded as PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION. The zebrafish
      rescue failure is a loss-of-function readout, but the same alleles retain normal
      interaction with the other AP-1 subunits, so the protein is not simply absent or
      non-functional - it assembles and then misroutes. A full LOSS_OF_FUNCTION
      grading would assert more than the functional data show.
  biological_processes:
  - preferred_term: protein folding
    modifier: ABNORMAL
    term:
      id: GO:0006457
      label: protein folding
  downstream:
  - target: Assembled AP-1 Complex With Perturbed Endosome Recycling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In silico analysis and 3D protein modeling simulation predicted alteration of AP1γ1 protein folding for missense variants, which was consistent with the observed altered AP1γ1 levels in heterologous cells."
    explanation: >-
      The folding prediction, graded COMPUTATIONAL because the quoted claim is a
      modelling result. Note the sentence also reports a heterologous-cell measurement
      described as consistent with it; that measurement is in vitro and the sentence
      mixes the two, which is why the grading follows the leading claim and the
      explanation says so.
- name: Assembled AP-1 Complex With Perturbed Endosome Recycling
  description: >-
    The defining node of this entry. The recessively inherited missense variants show
    no apparent impact on the interaction of AP1-gamma-1 with the other subunits of
    the AP-1 complex, and instead affect the endosome recycling pathway. The complex
    forms; what fails is what it does on the recycling arm.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  protein_complexes:
  - preferred_term: AP-1 adaptor complex
    term:
      id: GO:0030121
      label: AP-1 adaptor complex
  cellular_components:
  - preferred_term: recycling endosome
    term:
      id: GO:0055037
      label: recycling endosome
  biological_processes:
  - preferred_term: endocytic recycling
    modifier: DECREASED
    term:
      id: GO:0032456
      label: endocytic recycling
  downstream:
  - target: Impaired Polarized Delivery of Somatodendritic Membrane Proteins
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies of the recessively inherited missense variants revealed no apparent impact on the interaction of AP1γ1 with other subunits of the AP-1 complex but rather showed to affect the endosome recycling pathway."
    explanation: >-
      The single most important sentence for this entry. It is specifically about the
      recessively inherited variants, it rules out a complex-assembly defect, and it
      names the pathway that is affected instead.
- name: Impaired Polarized Delivery of Somatodendritic Membrane Proteins
  description: >-
    AP-1 mediates selective intracellular vesicular trafficking and the polarized
    localization of somatodendritic proteins in neurons. A recycling defect in that
    machinery is expected to mis-place membrane proteins in the neuronal
    somatodendritic compartment.

    This node is an inference, and is marked PROVISIONAL for that reason. What is
    established is that AP-1 does this job and that these alleles disturb endosome
    recycling; what has not been measured in a neuron carrying a recessive AP1G1
    genotype is the mis-delivery itself.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: intracellular protein transport
    modifier: DECREASED
    term:
      id: GO:0006886
      label: intracellular protein transport
  downstream:
  - target: Disrupted Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Adaptor protein (AP) complexes mediate selective intracellular vesicular trafficking and polarized localization of somatodendritic proteins in neurons."
    explanation: >-
      The statement of what AP complexes do in neurons. It is the opening sentence of
      the paper's background and is not a finding of this study, so it is graded
      BACKGROUND; it is graded OTHER because it describes established cell biology
      rather than a study of any particular design, and INDIRECT because the claim it
      is cited for - that these alleles impair that delivery - follows from it only by
      an inference step.
- name: Disrupted Neurodevelopment
  description: >-
    The convergence node onto the clinical phenotype. Loss of ap1g1 in zebrafish
    produces severe morphological defects and lethality, rescued by wild-type but not
    mutant human AP1G1 mRNA, which is the organism-level evidence that this gene's
    function is required for normal development.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knocking out ap1g1 in zebrafish leads to severe morphological defect and lethality, which was significantly rescued by injection of wild-type AP1G1 mRNA and not by transcripts encoding the missense variants."
    explanation: >-
      The rescue experiment. Note carefully what it does and does not show: the
      missense transcripts fail to rescue a null, which establishes that they are
      hypofunctional, but the assay is a null background, not a biallelic missense
      background, so it does not reproduce the human recessive genotype.

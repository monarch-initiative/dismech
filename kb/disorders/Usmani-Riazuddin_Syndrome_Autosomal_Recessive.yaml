name: Usmani-Riazuddin Syndrome, Autosomal Recessive
category: Mendelian
creation_date: "2026-09-22T13:30:00Z"
synonyms:
- USRISR
- AP1G1-related autosomal recessive neurodevelopmental disorder
description: >-
  The autosomal recessive AP1G1-related neurodevelopmental disorder (USRISR, OMIM
  619548), caused by biallelic missense variants in AP1G1, which encodes the gamma-1
  adaptin subunit of the heterotetrameric clathrin adaptor protein complex 1 (AP-1).
  It was delineated in the same 2021 series that defined the dominant form, in two
  families carrying p.Pro246His and p.Met369Val, with mild to severe intellectual
  disability, developmental delay and epilepsy.

  **The recessive missense proteins still build the complex.** This is the finding
  that separates this entry from its dominant sibling rather than merely restating
  the inheritance pattern. Functional study of the recessively inherited missense
  variants found no apparent impact on the interaction of AP1-gamma-1 with the other
  AP-1 subunits, and instead showed an effect on the endosome recycling pathway. So
  the lesion is not failure to assemble AP-1; it is an assembled complex that
  mis-handles cargo on the recycling arm.

  Contrast the dominant form, whose reported allele classes include frameshift,
  splice-site and whole-gene deletion alongside missense, and where the disease can
  therefore be reached by simply having less gamma-1 adaptin. A pure
  haploinsufficiency route is not available to a recessive missense genotype: both
  copies encode a protein that is made and incorporated.

  **The zebrafish rescue is the functional argument that these alleles are
  pathogenic.** Knocking out ap1g1 in zebrafish is severely deleterious and lethal,
  and the phenotype is significantly rescued by wild-type AP1G1 mRNA but not by
  transcripts encoding the missense variants. That is a loss-of-function readout for
  alleles whose defect is not loss of complex assembly.

  **Whether this should be one disease with the dominant form is genuinely open**,
  and is recorded in `discussions` rather than settled here. The founding cohort
  delineated both forms in one series, and the follow-up literature describes the
  dominant and recessive forms as having overlapping clinical features. What keeps
  them apart in this knowledge base is that MONDO carries them as siblings with
  distinct OMIM numbers, and that the molecular lesions reported for each are
  different in kind.

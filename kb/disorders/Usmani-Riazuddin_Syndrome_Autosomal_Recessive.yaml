animal_models:
- name: ap1g1 knockout zebrafish
  species: Zebrafish
  genotype: ap1g1 knockout
  publication: PMID:34102099
  description: >-
    Loss of ap1g1 in zebrafish is severely deleterious and lethal. The model is used
    here as a rescue assay rather than as a phenocopy: wild-type human AP1G1 mRNA
    rescues, and transcripts carrying the disease missense variants do not.
  modeled_mechanisms:
  - target: Disrupted Neurodevelopment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Establishes that ap1g1 function is required for normal development and that the
      human missense alleles cannot supply it.
    limitations: >-
      The assay is rescue of a null, not a model of the human recessive state. A human
      USRISR patient has two missense alleles making assembled, partly functional
      complex; the fish has none, and then receives mutant mRNA. So it shows the
      alleles are hypofunctional relative to wild type, and says nothing about the
      residual function that biallelic missense leaves. It also cannot report the
      human phenotype: lethality at an early developmental stage is not intellectual
      disability or epilepsy.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantity is rescue of morphological defect and lethality in a
        null background. The quantity the node needs is impairment of neurodevelopment
        in the presence of two hypomorphic alleles. Rescue failure stands in for that.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The readout phenotype is early embryonic morphology and lethality in a fish.
        The human phenotype is intellectual disability, developmental delay and
        epilepsy, none of which this assay can observe.
    readouts:
    - name: Rescue of ap1g1-null morphology and lethality by human AP1G1 mRNA
      target: Disrupted Neurodevelopment
      direction: RESTORED
      interpretation: >-
        Wild-type transcript restores the phenotype; disease missense transcripts do
        not, which grades those alleles as hypofunctional.
      evidence:
      - reference: PMID:34102099
        reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "significantly rescued by injection of wild-type AP1G1 mRNA and not by transcripts encoding the missense variants"
        explanation: >-
          The rescue result itself.
  evidence:
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knocking out ap1g1 in zebrafish leads to severe morphological defect and lethality"
    explanation: >-
      Establishes that the gene is required in the model organism, which is the
      precondition for using it as a rescue assay.
discussions:
- discussion_id: usrisr_usrisd_one_entity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are the autosomal dominant and autosomal recessive AP1G1 disorders one disease
    with two inheritance routes, or two diseases?
  attaches_to:
  - pathophysiology#Assembled AP-1 Complex With Perturbed Endosome Recycling
  - disease#Usmani-Riazuddin Syndrome, Autosomal Recessive
  rationale: >-
    This entry is curated as a separate Disease, and the reasons are not
    overwhelming. They should be visible to whoever revisits this.

    For separation: MONDO carries MONDO:0859174 and MONDO:0859196 as siblings under
    hereditary disease with no umbrella term between them; OMIM gives them distinct
    numbers, 619467 and 619548; and the reported molecular lesions differ in kind. The
    dominant allele classes include frameshift, splice-site and whole-gene deletion, so
    that form is reachable by reduced dosage. The recessive alleles are missense that
    still assemble into AP-1 and perturb endosome recycling. Those are different
    statements about the protein, not different amounts of the same one.

    For merging: the founding series delineated both forms together in one cohort and
    did not separate the phenotype by inheritance mode - the "mild to severe ID,
    epilepsy, and developmental delay" description covers all eleven families - and the
    follow-up literature calls the dominant and recessive forms clinically overlapping.
    A reader is entitled to ask what a clinician would do differently.

    The evidence that would settle it is a direct functional comparison. If a dominant
    missense allele and a recessive missense allele are put through the same
    complex-assembly and endosome-recycling assays and behave differently, the split is
    mechanistic. If they behave the same and the inheritance difference is only
    penetrance or dosage, the merge is right - and would then need a new umbrella
    MONDO term or a mappings.mondo_mappings anchor, not reuse of one child term as the
    other's parent.
  proposed_experiments:
  - experiment_id: ap1g1_dominant_vs_recessive_allele_comparison
    name: Side-by-side assay of dominant and recessive AP1G1 missense alleles
    description: >-
      Run representative dominant missense alleles and the two recessive alleles
      through the same two assays used in the founding study: co-immunoprecipitation
      for AP-1 subunit interaction, and the endosome recycling assay. The founding
      study reported the recessive alleles' behaviour in both; the comparison it does
      not report is the dominant alleles run alongside them under identical conditions.
    perturbations:
    - name: Expression of dominant versus recessive AP1G1 missense alleles
      target: pathophysiology#Assembled AP-1 Complex With Perturbed Endosome Recycling
    readouts:
    - name: AP-1 subunit co-immunoprecipitation and endosome recycling rate
      target: pathophysiology#Assembled AP-1 Complex With Perturbed Endosome Recycling
      direction: ALTERED
      interpretation: >-
        Dominant alleles disrupting subunit interaction while recessive alleles do not
        would support two mechanisms and keep the entries separate; both classes
        sparing interaction and impairing recycling equally would support one entity.
    would_support:
    - pathophysiology#Assembled AP-1 Complex With Perturbed Endosome Recycling
    supporting_outcome:
    - >-
      Dominant and recessive missense alleles differ in AP-1 subunit interaction, with
      only the dominant class disrupting complex assembly.
    refuting_outcome:
    - >-
      Both allele classes spare subunit interaction and impair endosome recycling to
      a comparable degree, leaving inheritance mode as the only difference.
notes: >-
  Entry scope and the sibling entry. This curates the AUTOSOMAL RECESSIVE form only
  (MONDO:0859196, OMIM 619548). The dominant form is curated separately as
  kb/disorders/Usmani-Riazuddin_Syndrome_Autosomal_Dominant.yaml (MONDO:0859174, OMIM
  619467). That entry's own `notes` records the ontology check behind treating the two
  as siblings rather than parent and child, and its `discussions` carries the
  ad_ar_one_entity question; this entry carries the same question from the recessive
  side rather than duplicating the ontology argument.

  No GeneReviews chapter exists for this disorder. Verified offline against the
  committed Bookshelf index, cache/bookshelf/genereviews.csv: grep for
  "Usmani", "Riazuddin", "AP1G1" and "adaptinopathy" returns no chapter.
  `just check-genereviews` on this file reports NO_CHAPTER for both collections.

  No mechanism module was applied, following the same search the dominant entry
  records: `just list-modules` and a grep of kb/modules/ for clathrin, adaptin, AP-1,
  trans-Golgi, endosome and vesicle sorting turn up nothing describing AP-1-dependent
  cargo selection or endocytic recycling. `conforms_to` is left unset rather than
  forced onto a module about a different trafficking step.

  Snippet brackets. The founding paper writes its allele list as `c.737C>A
  [p.Pro246His] and c.1105A>G [p.Met369Val]`. `linkml-reference-validator` strips
  bracketed spans from the snippet but not from the cached text, so a verbatim quote
  spanning that list cannot match; the two evidence items that would naturally carry
  it quote neighbouring sentences instead and say so in their `explanation`. The HGVS
  case is dismech#10192 and this instance is recorded there rather than worked around
  by adding a `literal_bracket_patterns` entry in a curation PR.

  Deep-research reconciliation, and what could not be carried across. The committed
  OpenScientist report (research/Usmani-Riazuddin_Syndrome_Autosomal_Recessive-deep-research-openscientist.md)
  supplies three quantitative facts that this entry does NOT record, each for the same
  reason: dismech evidence needs an exact quote from a cited reference, and none of
  these has a publication that states it.

  - The per-phenotype FREQUENCIES for the recessive patients specifically (n = 3: speech
    delay, global developmental delay, intellectual disability, hypotonia and spasticity
    each 3/3; seizure and aggressive behavior each 2/3; hypertelorism, agenesis of the
    corpus callosum, posteriorly rotated and low-set ears each 1/3). These are HPOA
    annotations of OMIM:619548. No cached reference states a denominator for the
    recessive patients - PMID:34102099's abstract describes the phenotype across all
    eleven families without separating by inheritance mode - so the phenotypes below
    carry no frequency.

    An earlier draft of this note went further and said the phenotypes themselves could
    not be curated because no sentence stated them. That was WRONG, and review caught
    it: PMID:41226632, which this entry already cites, states hypotonia, speech delay,
    aggressive behaviour and spasticity in its introduction, in a paper that explicitly
    frames the dominant and recessive forms as clinically overlapping. Four phenotypes
    are now curated from that sentence with quote_role BACKGROUND, and the "variably
    associated" ones are quoted from the clause that says so rather than from the
    common-signs clause. What is genuinely missing is only the frequency.
  - gnomAD constraint: pLI 1.0, observed/expected LoF 0.065, LOEUF about 0.12, LoF Z
    8.26, missense Z 3.42. Not recorded, because no cached publication quotes them.
    kb/disorders/TCF20-Associated_Neurodevelopmental_Disorder.yaml hit the same wall
    from the other side and records it in its own notes: it curates pLI because a paper
    happened to state it, and leaves LOEUF uncurated because none did.
  - The ClinVar classification distribution for AP1G1 (5 pathogenic, 3 likely
    pathogenic, 28 uncertain, 3 likely benign), which is the clearest available summary
    of how settled this gene's variant interpretation is.

  Recorded here rather than silently dropped, and raised on dismech#10273.

  A further case report, PMID:38665048, describes a novel AP1G1 variant under the
  USRISR name and is deliberately NOT cited as evidence in this entry: the variant it
  reports, p.Leu657Val, is de novo, so the case belongs to the dominant form despite the
  title. It is noted here so a later curator does not read the title and add it.

  Evidence concentration. Almost every claim in this entry traces to one publication,
  PMID:34102099, because it is the only study that reports functional work on the
  recessive alleles specifically. PMID:41226632 is cited for the overlapping-features
  observation but its own functional work is on a dominant de novo allele and is not
  used as evidence for recessive mechanism. That concentration is a real limitation of
  the entry and not an artefact of curation effort.
review_notes: >-
  entry_type decision: DISEASE. The stub left this open between DISEASE, GROUPING and a
  merge into a new umbrella entry, and asked for it to be settled before curating.

  GROUPING is ruled out on definition: a dismech Grouping is an explicit curated union
  of existing diseases, subtypes or nested groupings, and USRISR is a single OMIM
  entity with two reported alleles in two families. There is nothing to take a union
  over.

  A merge with the dominant form is the live alternative and is not ruled out - it is
  recorded as an open discussion with the experiment that would settle it. It is not
  taken now for three reasons: MONDO and OMIM both separate them; the reported
  molecular lesions differ in kind rather than degree; and a merge would require a new
  umbrella MONDO term or a mappings anchor, which is a change to make deliberately
  rather than as a side effect of a curation pass.

  Evidence discipline. The `Impaired Polarized Delivery of Somatodendritic Membrane
  Proteins` node carries mechanism_confidence PROVISIONAL and its single evidence item
  is graded BACKGROUND, OTHER and INDIRECT together. That triple is deliberate: the
  quoted sentence is true, is from the paper's introduction, describes general AP
  complex biology, and supports this node only through an inference. Grading it
  HUMAN_CLINICAL or PRIMARY_RESULT would have made a background statement look like a
  measurement in this disease.

  The zebrafish model is recorded as PARTIALLY_RECAPITULATES with two typed
  divergences rather than as a clean model. The assay is rescue of a null by mutant
  mRNA, which is not the human biallelic-missense state, and its readout is embryonic
  lethality, which is not the human phenotype. Both are stated in `limitations` and
  typed in `divergences` rather than compressed into the fidelity tier.

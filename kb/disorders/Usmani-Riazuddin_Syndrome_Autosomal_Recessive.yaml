diagnosis:
- name: Exome or genome sequencing
  description: >-
    There is no biochemical or imaging marker for this disorder. Every published
    proband was ascertained by exome sequencing with ACMG variant interpretation, and
    the recessive form additionally requires confirming that the two variants are in
    trans.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34102099
    reference_title: "De novo and bi-allelic variants in AP1G1 cause neurodevelopmental disorder with developmental delay, intellectual disability, and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that de novo and bi-allelic variants in AP1G1 are associated with neurodevelopmental disorder in diverse populations."
    explanation: >-
      The disorder is defined by its genotype, so sequencing is the diagnostic test
      rather than a confirmatory one.
- name: Copy-number analysis where sequencing is uninformative
  diagnosis_term:
    preferred_term: whole genome sequencing for copy-number detection
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  description: >-
    Genome sequencing has produced an AP1G1 Usmani-Riazuddin diagnosis in a patient
    whose aetiology was still uncertain after gene panel testing and array CGH, by
    detecting and characterising a copy-number variant those methods missed. This
    matters more for a recessive disorder than a dominant one: a deletion in trans
    with a sequence variant can make a heterozygote look homozygous or look negative,
    depending on the assay.
  evidence:
  - reference: PMID:38840441
    reference_title: "Whole genome sequencing for copy number variant detection to improve diagnosis and management of rare diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resulting in genetic diagnoses of PRKN-related Parkinson disease, TAOK1-related neurodevelopmental disorder, and AP1G1-related Usmani-Riazuddin syndrome."
    explanation: >-
      Records that a Usmani-Riazuddin diagnosis was reached by genome sequencing for
      copy-number detection after panel testing and array CGH were uninformative. Note
      the paper does not state which AP1G1 form that patient had.

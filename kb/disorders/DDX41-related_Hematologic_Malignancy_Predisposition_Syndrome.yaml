- name: Myeloid Transformation
  biological_scale: CELLULAR
  description: >-
    DDX41-mutated MDS and AML are typically normal-karyotype, hypocellular and
    low-blast with few cooperating mutations; progression from MDS to AML is
    rapid in carriers of truncating alleles. Cooperating TP53, ASXL1, TET2
    and DNMT3A mutations occur but did not alter outcome in the largest
    series.

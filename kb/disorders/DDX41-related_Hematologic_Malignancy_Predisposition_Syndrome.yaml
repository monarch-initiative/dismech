    term:
      id: hgnc:18674
      label: DDX41
  molecular_functions:
  - preferred_term: DEAD-box RNA helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
    modifier: DECREASED
  evidence:
  - reference: "CGGV:assertion_e3db8214-a39d-408d-a3c2-7b4e817b1cc1-2020-07-30T202935.621Z"
    reference_title: "DDX41 / DDX41-related hematologic malignancy predisposition syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The DDX41 gene encodes a DEAD-box RNA helicase"
    explanation: >-
      ClinGen summary naming the molecular function whose dosage the germline
      truncating alleles reduce.
  - reference: PMID:25920683
    reference_title: "Inherited and Somatic Defects in DDX41 in Myeloid Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe an adult familial acute myeloid leukemia (AML) syndrome caused by germline mutations in the DEAD/H-box helicase gene DDX41."
    explanation: Index description of the germline syndrome.
  - reference: PMID:30963592
    reference_title: "DDX41 mutations in myeloid neoplasms are associated with male gender, TP53 mutations and high-risk disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of presumed germline mutations were upstream of the Helicase 2 domain (93%) and involved loss of the start codon (30%)."
    explanation: Positional distribution of germline alleles, consistent with loss of function.
  - reference: PMID:38937548
    reference_title: "DDX41 haploinsufficiency causes inefficient hematopoiesis under stress and cooperates with p53 mutations to cause hematologic malignancy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Under normal steady-state conditions, there was minimal effect on lifelong hematopoiesis, resulting in a mild yet persistent reduction in red blood cell counts."
    explanation: Hematopoietic-specific Ddx41 heterozygous mice show a mild steady-state erythroid effect.
  downstream:
  - target: Impaired snoRNA Processing and Ribosome Biogenesis
    description: >-
      Reduced DDX41 dosage limits intronic snoRNA processing and downstream
      rRNA modification and ribosome assembly.
  - target: Splicing-Coupled R-Loop Accumulation and Replication Stress
    description: >-
      Loss of DDX41 at 5' splice sites uncouples splicing from RNA polymerase
      II pausing, leaving R-loops that collide with replication forks.
  - target: Somatic Second-Hit DDX41 Mutation
    description: >-
      Carrier marrow acquires a somatic mutation in the remaining DDX41
      allele far more often than DDX41 wild-type marrow does.
  - target: Lymphoma
    description: >-
      Carriers have an excess of lymphoma. No mechanism specific to the
      lymphoid lineage has been established, so this edge records the
      epidemiological predisposition only.
  - target: Multiple Myeloma
    description: >-
      Epidemiological predisposition only; no plasma-cell-specific mechanism
      has been established.
  - target: Chronic Lymphocytic Leukemia
    description: >-
      Epidemiological predisposition only; no lineage-specific mechanism has
      been established.
  - target: Acute Lymphoblastic Leukemia
    description: >-
      Epidemiological predisposition only; no lineage-specific mechanism has
      been established.
- name: Impaired snoRNA Processing and Ribosome Biogenesis
  biological_scale: MOLECULAR
  description: >-
    DDX41 is required to process intronic small nucleolar RNAs. In
    DDX41-deficient mouse progenitors, unprocessed snoRNA host transcripts
    accumulate, mature H/ACA snoRNAs fall, rRNA pseudouridylation and
    processing are impaired, and protein synthesis drops. The defect is
    marked with biallelic loss and subtle with one allele.
  biological_processes:
  - preferred_term: snoRNA processing
    term:
      id: GO:0043144
      label: sno(s)RNA processing
    modifier: DECREASED
  - preferred_term: ribosome biogenesis
    term:
      id: GO:0042254
      label: ribosome biogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:34473945
    reference_title: "Germline DDX41 mutations cause ineffective hematopoiesis and myelodysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, DDX41 is essential for small nucleolar RNA (snoRNA) processing, ribosome assembly, and protein synthesis."
    explanation: Mouse Ddx41 mutant hematopoietic cells define the snoRNA-ribosome function.
  - reference: PMID:27174803
    reference_title: "Biological implications of somatic DDX41 p.R525H mutation in acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Data from cord blood cells and leukemia cell lines suggest a role for DDX41 in preribosomal RNA processing, in which the expression of the p.R525H mutant causes a certain ribosomopathy phenotype in hematopoietic cells by suppressing MDM2-mediated RB degradation, thus triggering the inhibition of E2F activity."
    explanation: Independent cell-based evidence linking DDX41 and the R525H allele to pre-rRNA processing.
  downstream:
  - target: Ineffective Erythropoiesis and Marrow Dysplasia
    description: >-
      Erythroid progenitors, with the highest translational demand, are the
      most sensitive to the ribosome defect.
- name: Splicing-Coupled R-Loop Accumulation and Replication Stress
  biological_scale: MOLECULAR
  description: >-
    DDX41 binds 5' splice sites and coordinates splicing with transcriptional
    elongation. Its loss prevents splicing-coupled RNA polymerase II pausing,
    allowing R-loops to accumulate and collide with replication forks. Cells
    enter mitosis with under-replicated DNA and form micronuclei.
  biological_processes:
  - preferred_term: mRNA splicing
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  - preferred_term: R-loop resolution
    term:
      id: GO:0062176
      label: R-loop processing
    modifier: DECREASED
  evidence:
  - reference: PMID:36229594
    reference_title: "DDX41 coordinates RNA splicing and transcriptional elongation to prevent DNA replication stress in hematopoietic cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we demonstrate that loss of DDX41 function impairs efficient RNA splicing, resulting in DNA replication stress with excess R-loop formation."
    explanation: Cell-based demonstration of the splicing to R-loop to replication-stress chain.
  - reference: PMID:25920683
    reference_title: "Inherited and Somatic Defects in DDX41 in Myeloid Neoplasms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DDX41 lesions caused altered pre-mRNA splicing and RNA processing."
    explanation: The index report's functional experiments already linked DDX41 lesions to splicing defects.
  downstream:
  - target: Erythroid Genome Instability
    description: >-
      Under-replicated DNA carried into mitosis produces micronuclei and DNA
      damage.
- name: Erythroid Genome Instability
  biological_scale: CELLULAR
  description: >-
    DDX41 also binds and resolves G-quadruplexes on the erythroid genome;
    myeloid-neoplasm-associated DDX41 mutants do this poorly. G-quadruplex
    accumulation and replication stress produce DNA damage and an
    ATM/ATR-dependent cell-cycle arrest in erythroid progenitors.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:40764304
    reference_title: "DDX41 resolves G-quadruplexes to maintain erythroid genome integrity and prevent cGAS-mediated cell death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DDX41 directly binds to and resolves G4, which is significantly compromised in MN-associated DDX41 mutants."
    explanation: Biochemical evidence that disease alleles impair G-quadruplex resolution.
  - reference: PMID:36229594
    reference_title: "DDX41 coordinates RNA splicing and transcriptional elongation to prevent DNA replication stress in hematopoietic cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although the degree of DNA replication stress acquired in S phase is small, cells undergo mitosis with under-replicated DNA being remained, resulting in micronuclei formation and significant DNA damage, thus leading to impaired cell proliferation and genomic instability."
    explanation: Links the replication-stress node to micronuclei and genome instability.
  - reference: PMID:33763998
    reference_title: "Ddx41 inhibition of DNA damage signaling permits erythroid progenitor expansion in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We delineated that the DNA damage response is activated in mutant cells resulting in an Ataxiatelangiectasia mutated (ATM) and Ataxia-telangiectasia and Rad3-related (ATR)-triggered cell cycle arrest."
    explanation: Zebrafish ddx41 mutants show an ATM/ATR-mediated arrest in erythroid progenitors.
  downstream:
  - target: cGAS-STING Activation in Hematopoietic Progenitors
    description: >-
      Micronuclear and damaged DNA engages the cytosolic cGAS sensor.
  - target: p53-Dependent Hematopoietic Stress Response
    description: >-
      DNA damage and ribosomal stress activate p53 target genes in erythroid
      progenitors.
  - target: Ineffective Erythropoiesis and Marrow Dysplasia
    description: >-
      Cell-cycle arrest of damaged erythroid progenitors reduces red cell
      output.
- name: cGAS-STING Activation in Hematopoietic Progenitors
  conforms_to: "cgas_sting_pathway_activation#Cytosolic DNA Accumulation and cGAS-Dependent cGAMP Synthesis"
  biological_scale: CELLULAR
  description: >-
    Genome instability in DDX41-deficient hematopoietic cells activates
    cGAS-STING, and in the hematopoietic-specific knockout mouse this, rather
    than p53, accounts for lethality. Lymphoblastoid lines and blood from
    germline carriers show altered inflammation-associated proteins, but
    whether cGAS-STING signaling is raised in heterozygous human marrow has
    not been shown.
  biological_processes:
  - preferred_term: cGAS/STING signaling pathway
    term:
      id: GO:0140896
      label: cGAS/STING signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:40764304
    reference_title: "DDX41 resolves G-quadruplexes to maintain erythroid genome integrity and prevent cGAS-mediated cell death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In parallel, genome instability also activates the cGas-Sting pathway, impairing survival, as cGas deficiency rescues the lethality of hematopoietic-specific Ddx41 knockout mice."
    explanation: Genetic rescue in mice places cGAS downstream of DDX41 loss.
  - reference: PMID:39945023
    reference_title: "Overall cancer risk in people with deleterious germline DDX41 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Finally, both lymphoblastoid cell lines and primary peripheral blood from individuals with germline DDX41LoF variants exhibited differential levels of inflammation-associated proteins."
    explanation: >-
      Human carrier material shows inflammatory dysregulation; this does not
      by itself show that cGAS-STING is the source.
  downstream:
  - target: Ineffective Erythropoiesis and Marrow Dysplasia
    description: >-
      cGAS-STING-mediated cell death of DDX41-deficient progenitors
      contributes to reduced hematopoietic output.
- name: p53-Dependent Hematopoietic Stress Response
  biological_scale: CELLULAR
  description: >-
    Transplant stress of Ddx41 heterozygous marrow upregulates p53 targets in
    erythroid progenitors and impairs HSPC fitness. Halving p53 restores
    fitness but lets transformed clones emerge, so p53 activation both
    constrains and selects.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: p53-mediated intrinsic apoptosis
    term:
      id: GO:0072332
      label: intrinsic apoptotic signaling pathway by p53 class mediator
    modifier: INCREASED
  evidence:
  - reference: PMID:38937548
    reference_title: "DDX41 haploinsufficiency causes inefficient hematopoiesis under stress and cooperates with p53 mutations to cause hematologic malignancy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, stress induced by transplantation of the Ddx41+/- BM resulted in hematopoietic stem/progenitor cell (HSPC) defects and onset of hematopoietic failure upon aging."
    explanation: Heterozygous Ddx41 marrow fails under replicative stress and with age.
  - reference: PMID:38937548
    reference_title: "DDX41 haploinsufficiency causes inefficient hematopoiesis under stress and cooperates with p53 mutations to cause hematologic malignancy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The reduction in p53 expression rescued the fitness defects in HSPC caused by Ddx41 heterozygosity. However, the combined Ddx41 and Trp53 mutant mice were prone to developing hematologic malignancies that resemble human myelodysplastic syndrome and acute myeloid leukemia."
    explanation: p53 loss both rescues fitness and permits MDS/AML-like disease.
  downstream:
  - target: Ineffective Erythropoiesis and Marrow Dysplasia
    description: >-
      p53-driven arrest and apoptosis of stressed progenitors lowers output.
  - target: Myeloid Transformation
    description: >-
      Clones that escape p53-mediated restraint, for example through TP53
      mutation, are selected toward transformation.
- name: Ineffective Erythropoiesis and Marrow Dysplasia
  biological_scale: TISSUE
  description: >-
    Carriers develop mild dysplasia, small hypolobated megakaryocytes and red
    cell macrocytosis long before malignancy, and often a hypocellular marrow
    with cytopenias. Biallelic DDX41-mutant progenitors die by apoptosis, and
    in chimeric mice a minor biallelic clone worsens cytopenias in
    heterozygous marrow.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    term:
      id: GO:0030218
      label: erythrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:39945023
    reference_title: "Overall cancer risk in people with deleterious germline DDX41 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 43 families with germline DDX41LoF variants, bone marrow (BM) biopsies in those without (N=8) or with malignancies (N=21) revealed mild dysplasia in peripheral blood (57%) and BM (88%), long before the average age of DDX41-related HM onset."
    explanation: Baseline dysplasia in carriers before malignancy.
  - reference: PMID:33763998
    reference_title: "Ddx41 inhibition of DNA damage signaling permits erythroid progenitor expansion in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrated that loss of ddx41 leads to anemia caused by diminished proliferation and defective differentiation of erythroid progenitors."
    explanation: Zebrafish model of the erythroid defect.
  - reference: PMID:34473945
    reference_title: "Germline DDX41 mutations cause ineffective hematopoiesis and myelodysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice chimeric for monoallelic DDX41 mutant BM cells and a minor population of biallelic mutant BM cells develop hematopoietic defects at a younger age, suggesting that biallelic DDX41 mutant cells are disease modifying in the context of monoallelic DDX41 mutant BM."
    explanation: A minor biallelic clone aggravates ineffective hematopoiesis in heterozygous marrow.
  downstream:
  - target: Increased Mean Corpuscular Volume
    description: Disordered erythropoiesis produces macrocytic red cells.
  - target: Megakaryocyte Hypolobulation
    description: Dysplastic megakaryopoiesis is a common baseline marrow finding in carriers.
  - target: Macrocytic Anemia
    description: Ineffective erythropoiesis produces macrocytic anemia, the most common presenting cytopenia.
  - target: Thrombocytopenia
    description: Ineffective megakaryopoiesis reduces platelet output.
  - target: Neutropenia
    description: Reduced effective myeloid output lowers the neutrophil count.
  - target: Pancytopenia
    description: Multilineage failure of effective hematopoiesis produces pancytopenia.
  - target: Aplastic Anemia
    description: Severe progenitor loss presents as aplastic anemia in some carriers.
  - target: Bone Marrow Hypocellularity
    description: Progenitor loss leaves a hypocellular marrow.
  - target: Myelodysplastic Syndrome
    description: >-
      Age-dependent dyshematopoiesis of heterozygous marrow, worsened by
      biallelic subclones, progresses to MDS.
- name: Somatic Second-Hit DDX41 Mutation
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  biological_scale: MOLECULAR
  description: >-
    Roughly 50 to 96 percent of germline carriers with a myeloid neoplasm
    carry a somatic DDX41 variant in trans, overwhelmingly the helicase-motif
    VI missense p.R525H. This is a hypomorphic or altered-function allele,
    not a null, and its variant allele fraction is usually low (median about
    10 percent), so the biallelic cells are typically a minority subclone at
    diagnosis. Somatic DDX41 mutation is rare in DDX41 wild-type myeloid
    neoplasms.
  genetic_context:
    variant_origin: SOMATIC
    allelic_hit_role: SECOND_HIT

genetic:
- name: DDX41
  gene_term:
    preferred_term: DDX41
    term:
      id: hgnc:18674
      label: DDX41
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_e3db8214-a39d-408d-a3c2-7b4e817b1cc1-2020-07-30T202935.621Z
    evidence:
    - reference: CGGV:assertion_e3db8214-a39d-408d-a3c2-7b4e817b1cc1-2020-07-30T202935.621Z
      reference_title: "DDX41 / DDX41-related hematologic malignancy predisposition syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DDX41 | HGNC:18674 | DDX41-related hematologic malignancy predisposition syndrome | MONDO:0014809 | AD | Definitive"
      explanation: ClinGen Hereditary Cancer GCEP classifies DDX41 for this MONDO term as Definitive (AD).
  notes: >-
    Germline alleles are predominantly truncating (frameshift, nonsense,
    start-loss) and cluster upstream of the second helicase domain; missense
    and splice alleles also occur, and variants of uncertain significance are
    common and behave clinically like pathogenic ones in at least one series.
    The allele spectrum is population-specific: p.D140fs and p.M1? predominate
    in white cohorts, p.A500fs in Japanese and p.V152G in Korean patients.
    Germline carriers account for about 2.4 percent of unselected adult
    MDS/AML in a French series and about 80 percent of known germline
    predisposition to adult myeloid neoplasms in a Japanese series.
  evidence:
  - reference: "CGGV:assertion_e3db8214-a39d-408d-a3c2-7b4e817b1cc1-2020-07-30T202935.621Z"
    reference_title: "DDX41 / DDX41-related hematologic malignancy predisposition syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most commonly seen DDX41 variants are frameshifts, resulting in premature termination of the protein, suggesting loss of function or haploinsufficiency is the mechanism of tumorigenesis for this disorder"
    explanation: ClinGen summary of the allele spectrum and disease mechanism.
  - reference: PMID:36322930
    reference_title: "Germ line DDX41 mutations define a unique subtype of myeloid neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P/LP DDX41 germ line variants explained ∼80% of known germ line predisposition to MNs in adults."
    explanation: DDX41 is the dominant adult myeloid predisposition gene in the Japanese series.
  - reference: PMID:31484648
    reference_title: "Germline DDX41 mutations define a significant entity within adult MDS/AML patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We focused on the 33 patients having causal variants, representing 2.4% of our cohort."
    explanation: Fraction of unselected adult MDS/AML explained by causal germline DDX41 variants.
  - reference: PMID:40040251
    reference_title: "Prevalence of cytopenia(s) and somatic variants in patients with DDX41 mutant germline predisposition syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our mostly white cohort, p.Met1? was most common, followed by p.Asp140fs*2, and none of our patients had p.Ala500fs (most common in Japanese patients) or p.Val152Gly (most common in Korean patients)."
    explanation: Population-specific allele spectrum.
  - reference: PMID:37199125
    reference_title: "Clinical and molecular correlates of somatic and germline DDX41 variants in patients and families with myeloid neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comparable molecular profiles and clinical outcomes among DDX41path and DDX41VUS patients highlights the need for a comprehensive DDX41 variant interrogation/classification system"
    explanation: VUS carriers resemble pathogenic-variant carriers clinically, complicating classification.
  variants:
  - name: p.V152G
    description: Germline DDX41 missense variant; the most common germline allele in a Korean cohort.
    population_effects:
    - population: Korean patients with ICUS, MDS or AML
      ancestry_terms:
      - preferred_term: Korean
        term:
          id: HANCESTRO:0022
          label: Korean
      ancestry_basis: NOT_STATED
      comparator_stratum: Japanese and other populations
      effect_differences:
      - ALLELE_FREQUENCY
      cohort_size: 457
      description: >-
        p.V152G was the most frequent germline allele in Korean patients and
        was not found in Japanese or other populations.
      evidence:
      - reference: PMID:33626862
        reference_title: "Unique ethnic features of DDX41 mutations in patients with idiopathic cytopenia of undetermined significance, myelodysplastic syndrome, or acute myeloid leukemia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "p.V152G was only found in Koreans and not in Japanese or other ethnic populations"
        explanation: The source states the population restriction of this allele.
  - name: p.R525H
    description: >-
      Somatic helicase-motif VI missense variant acquired in trans in the
      myeloid clone of germline carriers; the dominant somatic second hit.
      Not a germline predisposition allele in this syndrome.
    evidence:
    - reference: PMID:27174803
      reference_title: "Biological implications of somatic DDX41 p.R525H mutation in acute myeloid leukemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The acquired mutation in DDX41 is highly concentrated at c.G1574A (p.R525H) in the conserved motif VI located at the C-terminus of the helicase core domain where ATP interacts and is hydrolyzed."
      explanation: Locates the recurrent somatic allele in the ATP-hydrolysis motif.
diagnosis:
- name: Germline DDX41 testing after tumor profiling
  diagnosis_term:
    preferred_term: germline genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    A DDX41 variant at about 50 percent allele fraction on a myeloid tumor
    panel, particularly with a low-fraction R525H in trans, should prompt
    germline confirmation on non-hematopoietic tissue. Family history is
    absent in most probands, so ascertainment relies on tumor sequencing.
  results: >-
    A heterozygous germline pathogenic DDX41 variant establishes the
    diagnosis.
  evidence:
  - reference: PMID:34723452
    reference_title: "DDX41-Associated Familial Myelodysplastic Syndrome and Acute Myeloid Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of DDX41-associated familial MDS/AML is established in a proband with suggestive findings and a heterozygous germline pathogenic variant in DDX41 identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:30963592
    reference_title: "DDX41 mutations in myeloid neoplasms are associated with male gender, TP53 mutations and high-risk disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings support the recognition of myeloid neoplasms with DDX41 mutation as unique, need for germline confirmation, and further assessment of family members."
    explanation: Tumor-panel series arguing for germline confirmation and cascade testing.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation with Donor DDX41 Genotyping
  description: >-
    Transplant evaluation early in the course of malignancy, with DDX41
    genotyping of any related donor. Outcomes after HSCT were not worse than
    in DDX41 wild-type matched controls, but seven cases of donor-cell
    leukemia arising from carrier related donors have been reported.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Myeloid Transformation
    description: >-
      Replaces the germline-mutant hematopoietic compartment, removing the
      substrate for further clonal evolution.
  evidence:
  - reference: PMID:34723452
    reference_title: "DDX41-Associated Familial Myelodysplastic Syndrome and Acute Myeloid Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment: Standard neoplasm-specific therapy; allogeneic hematopoietic stem cell transplant evaluation early in the course of hematologic malignancy if appropriate based on the age of the individual, malignancy, and health status – including identification of potential related donors for genetic counseling and genotyping."
    explanation: GeneReviews treatment recommendation, including donor genotyping.
  - reference: PMID:40924929
    reference_title: "Allogeneic hematopoietic stem cell transplantation in patients with germ line DDX41 mutated myeloid malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the familial nature of the disease, we specifically examined patients who relapsed after HSCT with a related donor and identified 7 cases of DDX41mut donor cell leukemia."
    explanation: Donor-cell leukemia from carrier related donors.
  - reference: PMID:40924929
    reference_title: "Allogeneic hematopoietic stem cell transplantation in patients with germ line DDX41 mutated myeloid malignancies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, HSCT in patients with DDX41mut AML was not associated with an increased risk for toxicity. However, we observed a potential for later relapse, which could potentially be mitigated by selecting related donors based on DDX41 status."
    explanation: No excess transplant toxicity; donor selection by DDX41 status recommended.
  - reference: PMID:35443031
    reference_title: "Prognostic impact of DDX41 germline mutations in intensively treated acute myeloid leukemia patients: an ALFA-FILO study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT in first complete remission was associated with prolonged relapse-free survival (hazard ratio, 0.43; 95% confidence interval, 0.21-0.88; P = .02) but not with longer overall survival (hazard ratio, 0.77; 95% confidence interval, 0.35-1.68; P = .5)."
    explanation: Transplant in CR1 improved relapse-free but not overall survival.
- name: Intensive Chemotherapy
  description: >-
    Germline-DDX41 AML has a higher complete remission rate with intensive
    induction than intermediate/adverse-risk DDX41 wild-type AML, but
    relapses accumulate after the first year.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: intensive induction chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Myeloid Transformation
    description: Cytoreduction of the transformed clone.
  evidence:
  - reference: PMID:35443031
    reference_title: "Prognostic impact of DDX41 germline mutations in intensively treated acute myeloid leukemia patients: an ALFA-FILO study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DDX41MutGL patients displayed higher complete remission rates (94% vs 69%; P < .0001)"
    explanation: Higher CR rate than comparator DDX41 wild-type AML.
- name: Hypomethylating Agent Therapy
  description: >-
    Azacitidine produced a high response rate in higher-risk DDX41 MDS/AML;
    an 8-year-old with MDS-EB-2 reached remission on azacitidine with
    venetoclax before cord blood transplant.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: hypomethylating agent therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azacitidine
      term:
        id: CHEBI:2038
        label: 5-azacytidine
  target_mechanisms:
  - target: Myeloid Transformation
    description: Cytoreduction and differentiation of the transformed clone.
  evidence:
  - reference: PMID:31484648
    reference_title: "Germline DDX41 mutations define a significant entity within adult MDS/AML patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-risk DDX41 MDS/AML patients treated with intensive chemotherapy (n = 9) or azacitidine (n = 11) had an overall response rate of 100% or 73%, respectively, with a median overall survival of 5.2 years."
    explanation: Response rates to intensive chemotherapy and azacitidine.
  - reference: PMID:42363987
    reference_title: "Allogeneic hematopoietic stem cell transplantation for a pediatric case of myelodysplastic syndrome with germline DDX41 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An 8-year-old female patient achieved bone marrow remission with azacitidine and venetoclax"
    explanation: Single pediatric case report.
- name: Lenalidomide for Transfusion-Dependent Anemia
  description: >-
    In the index report, identical twins with germline p.I396T and somatic
    R525H MDS were treated successfully with lenalidomide for
    transfusion-dependent anemia. This is a two-patient observation, not a
    tested indication.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

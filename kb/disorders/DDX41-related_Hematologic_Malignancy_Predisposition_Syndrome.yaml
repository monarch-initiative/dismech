      term:
        id: CHEBI:63791
        label: lenalidomide
  evidence:
  - reference: PMID:25920683
    reference_title: "Inherited and Somatic Defects in DDX41 in Myeloid Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both were successfully treated with lenalidomide for transfusion-dependent anemia."
    explanation: Two-patient report of lenalidomide response.
- name: Carrier Surveillance
  description: >-
    GeneReviews advises a CBC with differential every 6 to 12 months and
    annual clinical review, with consideration of a baseline marrow. A French
    penetrance study proposes yearly CBC from age 50 but notes female cases
    before 50. A baseline marrow is recommended so that pre-existing
    low-grade dysplasia is not later read as MDS. No pediatric surveillance
    regimen is defined, consistent with the negligible risk before 40.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Ineffective Erythropoiesis and Marrow Dysplasia
    description: >-
      Serial counts and baseline marrow detect progression of
      dyshematopoiesis toward MDS.
  evidence:
  - reference: PMID:34723452
    reference_title: "DDX41-Associated Familial Myelodysplastic Syndrome and Acute Myeloid Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Surveillance: Complete blood count with differential every six to 12 months or more frequently as clinically indicated; annual clinical examination for constitutional signs and symptoms of MDS/AML (e.g., fatigue, infections, bleeding, and skin changes)."
    explanation: GeneReviews surveillance schedule.
  - reference: PMID:41044237
    reference_title: "Myeloid neoplasms risks for germline DDX41 pathogenic variants carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on these findings, we suggest yearly complete blood count from the age of 50 for DDX41 PV carriers. Of note, we observed cases before the age of 50 in females, which could suggest sex-differentiated monitoring."
    explanation: Age-based surveillance proposal from the penetrance study.
  - reference: PMID:39945023
    reference_title: "Overall cancer risk in people with deleterious germline DDX41 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we recommend baseline BM biopsies in people with germline DDX41LoF alleles to avoid over-diagnosis of myelodysplastic syndromes."
    explanation: Rationale for a baseline marrow.
animal_models:
- name: Hematopoietic Ddx41 heterozygous and biallelic mutant mice
  species: Mouse
  genotype: Ddx41 floxed frameshift-mimicking allele with conditional R525H knock-in (Ddx41 +/-, KI/+, KI/-)
  publication: PMID:34473945
  description: >-
    Inducible hematopoietic deletion of one Ddx41 allele, alone or with an
    R525H knock-in on the other allele, and chimeras mixing monoallelic and
    biallelic marrow.
  modeled_mechanisms:
  - target: Impaired snoRNA Processing and Ribosome Biogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Biallelic mutant progenitors show snoRNA processing and ribosome defects.
    limitations: >-
      The defect is marked only with biallelic loss; heterozygous HSPCs did
      not show significant snoRNA or protein-synthesis defects, so the model
      does not establish this mechanism for the germline state alone.
    evidence:
    - reference: PMID:34473945
      reference_title: "Germline DDX41 mutations cause ineffective hematopoiesis and myelodysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, DDX41 is essential for small nucleolar RNA (snoRNA) processing, ribosome assembly, and protein synthesis."
      explanation: Model-level evidence for the molecular node.
  - target: Myelodysplastic Syndrome
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: A subset of aged monoallelic mice develop MDS features.
    limitations: >-
      Only a subset of aged mice are affected and the model uses
      transplanted marrow, not a constitutional allele.
    evidence:
    - reference: PMID:34473945
      reference_title: "Germline DDX41 mutations cause ineffective hematopoiesis and myelodysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although monoallelic DDX41 mutations do not affect hematopoiesis in young mice, a subset of aged mice develops features of MDS."
      explanation: Age-dependent MDS-like phenotype in heterozygous mice.
- name: Hematopoietic Ddx41 heterozygous mice with and without Trp53 heterozygosity
  species: Mouse
  genotype: Ddx41 +/f;Vav-iCre (hematopoietic Ddx41 heterozygous), alone or with Trp53 heterozygous deletion
  publication: PMID:38937548
  description: >-
    Hematopoietic-specific deletion of one Ddx41 allele, the closest model of
    the human germline state, studied at steady state, after competitive
    transplantation, and combined with Trp53 heterozygosity.
  modeled_mechanisms:
  - target: p53-Dependent Hematopoietic Stress Response
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Transplant stress exposes HSPC fitness defects with p53 target
      upregulation, and Trp53 reduction rescues fitness.
    limitations: >-
      Heterozygosity is restricted to hematopoietic cells and the phenotype
      appears mainly after transplantation stress, which is not equivalent to
      natural human aging.
    evidence:
    - reference: PMID:38937548
      reference_title: "DDX41 haploinsufficiency causes inefficient hematopoiesis under stress and cooperates with p53 mutations to cause hematologic malignancy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The reduction in p53 expression rescued the fitness defects in HSPC caused by Ddx41 heterozygosity."
      explanation: Genetic rescue places p53 activity downstream of Ddx41 heterozygosity.
  - target: Myeloid Transformation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Combined Ddx41 and Trp53 heterozygous mice develop MDS/AML-like malignancies.
    limitations: >-
      Transformation needed an engineered Trp53 lesion; Ddx41 heterozygosity
      alone did not produce overt malignancy, and Trp53 loss is only one of the
      cooperating events seen in patients.
    evidence:
    - reference: PMID:38937548
      reference_title: "DDX41 haploinsufficiency causes inefficient hematopoiesis under stress and cooperates with p53 mutations to cause hematologic malignancy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, the combined Ddx41 and Trp53 mutant mice were prone to developing hematologic malignancies that resemble human myelodysplastic syndrome and acute myeloid leukemia."
      explanation: Cooperating-lesion model of transformation.
- name: Zebrafish ddx41 loss-of-function mutant
  species: Zebrafish
  genotype: ddx41 sa14887 homozygous
  publication: PMID:33763998
  description: >-
    Homozygous ddx41 loss-of-function zebrafish develop anemia from defective
    erythroid progenitor expansion and differentiation.
  modeled_mechanisms:
  - target: Erythroid Genome Instability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Mutant erythroid progenitors activate an ATM/ATR DNA damage response and arrest.
    limitations: >-
      The model is homozygous and developmental, so it reflects complete loss
      in embryonic erythropoiesis rather than the human heterozygous germline
      state and its decades-long latency.
    evidence:
    - reference: PMID:33763998
      reference_title: "Ddx41 inhibition of DNA damage signaling permits erythroid progenitor expansion in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We delineated that the DNA damage response is activated in mutant cells resulting in an Ataxiatelangiectasia mutated (ATM) and Ataxia-telangiectasia and Rad3-related (ATR)-triggered cell cycle arrest."
      explanation: Direct model evidence for the DNA damage node.
  - target: Ineffective Erythropoiesis and Marrow Dysplasia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: ddx41 mutants are anemic from impaired erythroid progenitor proliferation and differentiation.
    limitations: >-
      Embryonic anemia from complete ddx41 loss; marrow dysplasia and the
      other lineages affected in human carriers are not modeled.
    evidence:
    - reference: PMID:33763998
      reference_title: "Ddx41 inhibition of DNA damage signaling permits erythroid progenitor expansion in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrated that loss of ddx41 leads to anemia caused by diminished proliferation and defective differentiation of erythroid progenitors."
      explanation: Erythroid-progenitor defect underlying the anemia.
discussions:
- discussion_id: controversy_ddx41_r525h_driver_or_minor_clone
  prompt: >-
    Is the somatic DDX41 R525H second hit the clonal driver of transformation,
    or a minor disease-modifying subclone acting on heterozygous marrow?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Somatic Second-Hit DDX41 Mutation
  rationale: >-
    French AML clonal inference proposes R525H as the main driver of
    progression, whereas a meta-analysis of published patient data finds a
    median R525H allele fraction near 10 percent, and in mice biallelic
    progenitors are at a competitive disadvantage and act mainly by
    worsening cytopenias. This is why the entry conforms to the second-hit
    node of the germline two-hit module but not to its biallelic-inactivation
    node, which asserts a selective growth advantage for the doubly mutant
    cell.
  evidence:
  - reference: PMID:35443031
    reference_title: "Prognostic impact of DDX41 germline mutations in intensively treated acute myeloid leukemia patients: an ALFA-FILO study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second somatic DDX41 mutation (DDX41MutSom) was found in 82% of patients, and clonal architecture inference suggested that it could be the main driver for AML progression."
    explanation: Driver interpretation.
  - reference: PMID:34473945
    reference_title: "Germline DDX41 mutations cause ineffective hematopoiesis and myelodysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although a somatic DDX41 mutation is typically acquired in DDX41-mutant germline patients, our mouse model data suggest that a biallelic DDX41-mutant BM subclone will have a competitive disadvantage."
    explanation: Minor-clone interpretation.
- discussion_id: gap_ddx41_solid_tumor_risk
  prompt: >-
    Do germline DDX41 loss-of-function variants raise solid tumor risk, and
    if so by what mechanism?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#
  rationale: >-
    One family series reports solid tumors with 24 percent penetrance by 75,
    but no somatic DDX41 second hit in 15 solid tumors, and a third of
    solid-tumor-rich pedigrees carried a second germline cancer-predisposition
    variant. Solid tumors are therefore not recorded as a phenotype of this
    entry; the authors raise inflammatory dysfunction as a possible modifier.
  evidence:
  - reference: PMID:39945023
    reference_title: "Overall cancer risk in people with deleterious germline DDX41 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A variety of solid tumors were also observed in our cohort, with 24% penetrance by age 75. Although acquired DDX41 mutations are common in HM, we failed to identify such alleles in solid tumors arising in those with germline DDX41LoF variants (N=15), suggesting an alternative mechanism driving solid tumor development."
    explanation: Solid-tumor penetrance without a DDX41 second hit.
  - reference: PMID:39945023
    reference_title: "Overall cancer risk in people with deleterious germline DDX41 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, 33% of pedigrees in which ≥15% of first-degree relatives including the proband were diagnosed with a solid tumor had second germline deleterious variants in other cancer-predisposition genes, likely serving as primary cancer drivers."
    explanation: Confounding by second germline predisposition variants.
- discussion_id: gap_ddx41_biallelic_germline_retinal_dystrophy
  prompt: >-
    Biallelic germline DDX41 variants have been reported, in a preprint, to
    cause Leber congenital amaurosis or early-onset severe retinal dystrophy.
    Is this a separate autosomal recessive disease, and do heterozygous
    parents carry the hematologic risk?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#DDX41-related Hematologic Malignancy Predisposition Syndrome
  rationale: >-
    The retinal phenotype is biallelic, congenital or early-childhood onset,
    and not reported with hematologic malignancy, so it is not lumped into
    this autosomal dominant entry. An OLS search of the mondo ontology for
    "DDX41" returned no MONDO disease term other than MONDO:0014809. The evidence is a non-peer-reviewed
    preprint. One of the retinal alleles, p.I396T, is the same germline
    allele reported heterozygous in the index MDS twins, which makes the
    carrier-parent question concrete.
  evidence:
  - reference: PMID:41646732
    reference_title: "Biallelic germline variants in the hematologic malignancy predisposition gene DDX41 cause retinal dystrophy through dysregulation of retinal homeostasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified eight families of patients with LCA/EOSRD carrying biallelic combination of six germline variants in"
    explanation: Preprint report of biallelic germline DDX41 in retinal dystrophy.
  - reference: PMID:25920683
    reference_title: "Inherited and Somatic Defects in DDX41 in Myeloid Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both twins showed a germline DDX41 variant (c.T1187C; p.I396T"
    explanation: The same p.I396T allele is a heterozygous germline MDS allele in the index report.
references:
- reference: PMID:34723452
  title: "DDX41-Associated Familial Myelodysplastic Syndrome and Acute Myeloid Leukemia."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      GeneReviews chapter NBK574843 is the phenotype baseline for this
      entry: myeloid and lymphoid neoplasm spectrum, adult-onset cytopenias
      and macrocytosis, diagnosis, treatment with donor genotyping,
      surveillance and autosomal dominant counseling. Only the abstract is
      cached, so only abstract text is quoted.
notes: >-
  Lump/split: curated as one DISEASE entry at the gene level, matching the
  MONDO term and the ClinGen Definitive AD assertion for MONDO:0014809. The
  myeloid neoplasms that arise in carriers are kept as phenotypes, not
  merged into the somatic Acute_Myeloid_Leukemia or Myelodysplastic_Syndrome
  entries. Biallelic germline DDX41 retinal dystrophy is excluded (see
  discussions). Pediatric framing is deliberately minimal: risk is
  negligible before 40 and pediatric myeloid neoplasm with germline DDX41
  is reported as extremely rare.

phenotypes:
- category: Neoplastic
  name: Myelodysplastic Syndrome
  description: >-
    The most common outcome. Median age at diagnosis is about 70 years, with
    a male excess. Most carriers have normal counts until malignancy, but a
    substantial minority have documented cytopenia years earlier. Baseline
    dysplasia in unaffected carriers means MDS should not be diagnosed on
    morphology alone without a prior baseline.
  phenotype_term:
    preferred_term: Myelodysplasia
    term:
      id: HP:0002863
      label: Myelodysplasia
    onset:
      onset_category: LATE
  evidence:
  - reference: PMID:34723452
    reference_title: "DDX41-Associated Familial Myelodysplastic Syndrome and Acute Myeloid Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most common myeloid neoplasms include MDS, AML, and therapy-related myeloid neoplasms."
    explanation: GeneReviews names MDS as a principal neoplasm.
  - reference: PMID:31484648
    reference_title: "Germline DDX41 mutations define a significant entity within adult MDS/AML patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 9 patients (27%) had a family history of hematological malignancy, and 15 (46%) had a personal history of cytopenia years before MDS/AML diagnosis."
    explanation: Most probands lack a family history; antecedent cytopenia is common.
  - reference: PMID:39945023
    reference_title: "Overall cancer risk in people with deleterious germline DDX41 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we recommend baseline BM biopsies in people with germline DDX41LoF alleles to avoid over-diagnosis of myelodysplastic syndromes."
    explanation: Baseline dysplasia confounds MDS diagnosis in carriers.
  - reference: PMID:33626862
    reference_title: "Unique ethnic features of DDX41 mutations in patients with idiopathic cytopenia of undetermined significance, myelodysplastic syndrome, or acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the four ICUS patients with germline DDX41 mutations progressed to MDS."
    explanation: Cytopenia without dysplasia progresses to MDS in carriers.
- category: Neoplastic
  name: Acute Myeloid Leukemia
  description: >-
    AML in carriers is typically in the seventh decade, male-predominant,
    leukopenic, low-blast and normal-karyotype. It accounts for about 5
    percent of intensively treated adult AML in a French cooperative group.
    Onset in the index pedigree ranged from 44 to 70 years.
  phenotype_term:
    preferred_term: Acute myeloid leukemia
    term:
      id: HP:0004808
      label: Acute myeloid leukemia
    onset:
      onset_category: LATE
  evidence:
  - reference: PMID:35443031
    reference_title: "Prognostic impact of DDX41 germline mutations in intensively treated acute myeloid leukemia patients: an ALFA-FILO study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with DDX41MutGL AML were mostly male (75%), in their seventh decade, and with low leukocyte count (median, 2 × 109/L), low bone marrow blast infiltration (median, 33%), normal cytogenetics (75%), and few additional somatic mutations (median, 2)."
    explanation: Clinical profile of germline-DDX41 AML in 191 patients.
  - reference: PMID:25920683
    reference_title: "Inherited and Somatic Defects in DDX41 in Myeloid Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at disease onset ranged from 44–70 years."
    explanation: Age range in the index AML/MDS pedigree.
- category: Neoplastic
  name: Chronic Myelomonocytic Leukemia
  description: >-
    Less common than MDS and AML; one CMML among 34 DDX41-mutated myeloid
    neoplasms in a referral series that mixed germline and somatic-only cases.
  phenotype_term:
    preferred_term: Chronic myelomonocytic leukemia
    term:
      id: HP:0012325

name: DDX41-related Hematologic Malignancy Predisposition Syndrome
creation_date: "2026-10-13T18:57:44Z"
description: >-
  Autosomal dominant predisposition to hematologic malignancy caused by a
  heterozygous germline loss-of-function variant in DDX41, a DEAD-box RNA
  helicase. Unlike RUNX1, GATA2 or CEBPA predisposition, the malignancies are
  late-onset: risk of a myeloid neoplasm is negligible before age 40 and rises
  steeply thereafter, the median age at myelodysplastic syndrome or acute
  myeloid leukemia diagnosis is in the seventh decade, and men are affected
  several-fold more often than women. Most carriers have no recognized family
  history, so the syndrome is usually found by germline confirmation of a
  DDX41 variant on a myeloid tumor panel. Germline alleles are mostly
  truncating or start-loss and population-specific; the malignant clone
  typically acquires a somatic missense variant, most often p.R525H in the
  helicase domain, on the other allele. Disease is characteristically
  hypocellular, normal-karyotype and low-blast, often preceded by years of
  cytopenia, and responds well to intensive chemotherapy or hypomethylating
  agents but relapses late. Lymphoid neoplasms are also over-represented.
  Pediatric presentation is exceptional. Related-donor selection for
  allogeneic transplant requires DDX41 genotyping because donor-cell leukemia
  from carrier relatives has been documented.
category: Mendelian
parents:
- hereditary neoplastic syndrome
synonyms:
- DDX41-associated familial myelodysplastic syndrome and acute myeloid leukemia
- DDX41 hereditary neoplastic syndrome
- myeloid neoplasm with germline DDX41 variant
- MPLPF

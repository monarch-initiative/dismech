inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Heterozygous germline DDX41 pathogenic variants segregate as an autosomal
    dominant trait with incomplete, strongly age-dependent penetrance. Two
    cohort estimates differ by design: in a Japanese case-control and
    first-degree-relative study, myeloid neoplasm risk was negligible before
    40 and reached 49 percent by 90 years; in French relatives ascertained
    through an affected proband, the genotype-restricted likelihood estimate
    was 19.5 percent by 70 years with a very wide confidence interval. In
    genotype-first population cohorts (UK Biobank, Geisinger DiscovEHR),
    about 1 in 19 to 1 in 39 heterozygotes had a recorded hematologic
    malignancy over available follow-up, a lower figure reflecting unselected
    ascertainment and limited follow-up rather than lifetime risk.
    Transmitting parents are frequently unaffected.
  evidence:
  - reference: PMID:34723452
    reference_title: "DDX41-Associated Familial Myelodysplastic Syndrome and Acute Myeloid Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DDX41-associated familial MDS/AML is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:34723452
    reference_title: "DDX41-Associated Familial Myelodysplastic Syndrome and Acute Myeloid Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The heterozygous parent may or may not have developed a hematologic malignancy."
    explanation: GeneReviews records non-penetrance in transmitting parents.
  - reference: PMID:36322930
    reference_title: "Germ line DDX41 mutations define a unique subtype of myeloid neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P/LP DDX41 variants conferred a large risk of developing MNs, which was negligible until 40 years of age but rapidly increased to 49% by 90 years of age."
    explanation: Age-dependent penetrance estimate from the Japanese cohort.
  - reference: PMID:41044237
    reference_title: "Myeloid neoplasms risks for germline DDX41 pathogenic variants carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative risk of MN at 70 years for DDX41 PV carriers was estimated at 19.5%"
    explanation: >-
      Independent penetrance estimate in genotyped relatives of French probands;
      lower than the Japanese figure, and measured at a younger age cut-off.
  - reference: PMID:39501104
    reference_title: "Genome-first determination of the prevalence and penetrance of eight germline myeloid malignancy predisposition genes: a study of two population-based cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DDX41 heterozygotes were prevalent in the population (1:576–870), with high likelihood to develop a hematological malignancy (1:19–1:39), and had an increased overall all-cause mortality."
    explanation: >-
      Genotype-first estimate free of family or clinic ascertainment; a
      record-based observed proportion, not lifetime penetrance.
pathophysiology:
- name: Germline DDX41 Heterozygous Loss of Function
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A constitutional heterozygous DDX41 variant, most often frameshift,
    nonsense or start-loss and located upstream of the second helicase
    domain, halves DDX41 dosage in every cell. In hematopoietic-specific
    heterozygous mice this has little steady-state effect beyond a mild
    persistent reduction in red cell counts, but HSPC fitness fails under
    replicative stress and with age.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allelic_hit_role: FIRST_HIT
    functional_impact_category: LOSS_OF_FUNCTION

    reference_title: "Germ line DDX41 mutations define a unique subtype of myeloid neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with myelodysplastic syndromes (MDS) along with a DDX41-mutation rapidly progressed to acute myeloid leukemia (AML), which was however, confined to those having truncating variants."
    explanation: Allele-class-dependent progression from MDS to AML.
  - reference: PMID:31484648
    reference_title: "Germline DDX41 mutations define a significant entity within adult MDS/AML patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients had a normal karyotype (85%), and the most frequent somatic alteration was a second DDX41 mutation (79%)."
    explanation: Characteristic normal-karyotype disease with the second DDX41 hit as the main co-mutation.

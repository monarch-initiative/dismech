  - reference: PMID:25920683
    reference_title: "Inherited and Somatic Defects in DDX41 in Myeloid Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 50% of patients with germline DDX41 mutations also acquired the somatic mutation, while 0.8% patients with wild-type (WT) DDX41 acquired a somatic DDX41 mutation"
    explanation: Somatic DDX41 mutation is strongly enriched in germline carriers.
  - reference: PMID:25920683
    reference_title: "Inherited and Somatic Defects in DDX41 in Myeloid Neoplasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The additional somatic mutations were always acquired in the remaining WT allele"
    explanation: The somatic hit lies in trans to the germline allele.
  - reference: PMID:30963592
    reference_title: "DDX41 mutations in myeloid neoplasms are associated with male gender, TP53 mutations and high-risk disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of somatic mutations were within the Helicase 2 domain (78%), with the missense mutation p.R525H being most common (67%)."
    explanation: R525H dominates the somatic spectrum.
  - reference: PMID:35443031
    reference_title: "Prognostic impact of DDX41 germline mutations in intensively treated acute myeloid leukemia patients: an ALFA-FILO study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second somatic DDX41 mutation (DDX41MutSom) was found in 82% of patients, and clonal architecture inference suggested that it could be the main driver for AML progression."
    explanation: High frequency of the second hit in germline-carrier AML.
  - reference: PMID:33626862
    reference_title: "Unique ethnic features of DDX41 mutations in patients with idiopathic cytopenia of undetermined significance, myelodysplastic syndrome, or acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline DDX41 mutations with causality were identified in 28 (6.1%) patients, of whom 27 (96.4%) had somatic mutations in the other position of DDX41."
    explanation: Near-universal second hit in a Korean ICUS/MDS/AML cohort.
  - reference: PMID:34473945
    reference_title: "Germline DDX41 mutations cause ineffective hematopoiesis and myelodysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the variant allele frequency (VAF) of the acquired R525H mutation is ~10% (median frequency) at diagnosis, indicative that <20% of the BM cells possess biallelic DDX41 mutations in patients with objective disease"
    explanation: Meta-analysis of published patient data showing the second hit is usually subclonal.
  - reference: PMID:40764304
    reference_title: "DDX41 resolves G-quadruplexes to maintain erythroid genome integrity and prevent cGAS-mediated cell death."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings are consistent with this report, as we also observed impaired G4 unwinding activity of the R525H mutant in our FRET-based assays"
    explanation: >-

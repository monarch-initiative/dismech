genetic:
- name: TMEM165
  gene_term:
    preferred_term: TMEM165
    term:
      id: hgnc:30760
      label: TMEM165
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Also known as TPARL. Two mechanistic classes of allele are published. The
    deep intronic c.792+182G>A variant, found homozygous in three Georgian
    Jewish patients, activates a cryptic splice donor and almost abolishes
    full-length protein; these patients have the full skeletal phenotype. The
    missense alleles (p.Arg126His, p.Arg126Cys, p.Gly304Arg, p.Glu108Gly,
    p.Ala310Pro) reduce protein stability, shift the protein toward lysosomes
    (Arg126) or disrupt the conserved E-phi-G-D-[KR]-[TS] cation-binding motif
    (Glu108; Gly304 indirectly). The original report's summary states that
    the missense-allele patients were milder and lacked the skeletal
    phenotype, but its own case descriptions separate them: the p.Arg126His
    homozygote (case 4) had no clear skeletal anomalies, while the
    p.Arg126Cys/p.Gly304Arg compound heterozygote (case 5) had osteoporosis,
    vertebral dysplasia and kyphoscoliosis. Later missense patients
    (p.Ala310Pro) had a predominant bone phenotype, so the genotype-phenotype
    relationship is not settled.
  variants:
  - name: c.792+182G>A (deep intronic, cryptic splice donor)
    description: >-
      Homozygous in the founding sibling pair and one unrelated patient of the
      same origin. Activates a cryptic donor, replacing exon 4 with a 117 bp
      intronic sequence; the aberrant transcript is degraded and full-length
      protein is barely detectable.
    evidence:
    - reference: PMID:22683087
      reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation activates a cryptic splice donor site, which leads to two different
        transcripts: the wild-type one and an additional one resulting in the replacement of exon 4
        with a 117 bp intronic sequence"
      explanation: The splice consequence of the variant, established on patient cDNA.
  - name: c.377G>A p.(Arg126His) and c.376C>T p.(Arg126Cys)
    description: >-
      Two substitutions of the same conserved arginine, found homozygous
      (Arg126His, consanguineous Turkish family) and compound heterozygous with
      p.Gly304Arg (Arg126Cys).
    evidence:
    - reference: PMID:22683087
      reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "P4 is homozygous for the G>A transition at position c.377, and P5 is compound
        heterozygous for the C>T transition at position 376 and the G>A transition at position 910."
      explanation: The homozygous Arg126His genotype and the compound heterozygous Arg126Cys/Gly304Arg
        genotype, at nucleotide level.
  - name: c.323A>G p.(Glu108Gly)
    description: >-
      Homozygous in two siblings of a consanguineous family, both of whom died
      in infancy; the second had nephrotic syndrome and congenital heart
      defects. The substitution sits in the conserved cytosolic ELGDK motif and
      significantly reduces transport activity.
    evidence:
    - reference: PMID:26238249
      reference_title: "TMEM165 Deficiency: Postnatal Changes in Glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequence analysis of TMEM165 showed homozygosity for the missense mutation c.323 A>G
        (p.E108G) in exon 2."
      explanation: The genotype of the E108G patient.
    - reference: PMID:32047108
      reference_title: The human Golgi protein TMEM165 transports calcium and manganese in yeast and bacterial
        cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that a mutation leading to a E108G substitution within the conserved UPF0016
        family motif significantly reduces TMEM165 activity."
      explanation: Functional evidence that the allele is hypomorphic for transport.
  - name: c.928G>C p.(Ala310Pro)
    description: >-
      Homozygous in one patient diagnosed at two months with a predominant bone
      phenotype; the protein is functional but unstable.
    evidence:
    - reference: PMID:38013006
      reference_title: Efficacy of oral manganese and D-galactose therapy in a patient bearing a novel TMEM165
        variant.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The unreported homozygous missense c.928G>C; p.Ala310Pro variant leading to a
        functional but unstable protein was identified."
      explanation: The genotype and its protein-level consequence.
  evidence:
  - reference: PMID:22683087
    reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our cohort of unsolved CDG-II cases, we found another individual with the same
      mutation and two unrelated individuals with missense mutations in TMEM165."
    explanation: Independent families carrying TMEM165 variants, which is what establishes the
      gene-disease relationship beyond the founding pedigree.
  - reference: PMID:22683087
    reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the individuals harboring missense mutations have a milder disease and
      lack the skeletal phenotype."
    explanation: The founding report's summary of its two missense-allele patients. Its own case
      descriptions qualify it (case 5 had skeletal abnormalities; see the Osteoporosis and
      Kyphoscoliosis phenotypes), so this is kept as the authors' generalisation, not as an
      established genotype-phenotype rule.
pathophysiology:
- name: TMEM165 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. The deep intronic splice variant leaves only traces
    of full-length TMEM165, and the missense variants reduce protein stability,
    mislocalise the protein, or disrupt its cation-binding motif. The common
    outcome is too little functional TMEM165 in the trans-Golgi, where it
    normally colocalises with beta-1,4-galactosyltransferase.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

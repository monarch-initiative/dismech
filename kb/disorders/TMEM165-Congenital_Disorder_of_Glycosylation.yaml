  - target: Truncation of Mucin-Type O-Glycans
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Truncated mucin-type O-glycans, corrected by Mn2+ but not galactose.
    limitations: >-
      The patient O-glycan data are inconsistent between reports, so it is not
      settled how representative this is.
    evidence:
    - reference: PMID:35693943
      reference_title: Differential Effects of D-Galactose Supplementation on Golgi Glycosylation
        Defects in TMEM165 Deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Interestingly, a similar VVL staining was observed in TMEM165 KO HEK cells (Supplementary
        Figure S1A), demonstrating the significant presence of truncated O-linked mucin type glycans in
        TMEM165-deficient cells."
      explanation: The O-glycan phenotype of the model.
discussions:
- discussion_id: tmem165_genotype_skeletal_phenotype
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Spondyloepimetaphyseal dysplasia
  - genetic#TMEM165
  prompt: >-
    Does the skeletal dysplasia depend on the TMEM165 allele, and why?
  rationale: >-
    The founding report's summary says the missense-allele patients lack the
    skeletal phenotype, yet its own case 5 (p.Arg126Cys/p.Gly304Arg) had
    osteoporosis, vertebral and rib dysplasia and kyphoscoliosis, while case 4
    (p.Arg126His homozygous) had no clear skeletal anomalies. The report also
    could not exclude a defect in a neighbouring gene on the founder
    haplotype. Later evidence argues against that explanation: TMEM165
    knockout chondrocytic cells reproduce a growth-plate-like defect, the
    zebrafish knockdown affects cartilage, and the p.Ala310Pro missense
    patient has a predominant bone phenotype. Whether residual protein
    function or localisation (the Arg126 variants shift TMEM165 toward
    lysosomes) sets skeletal severity remains open with fewer than ten
    patients.
- discussion_id: tmem165_manganese_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Combined Oral Manganese and D-Galactose Therapy
  prompt: >-
    Is oral manganese safe and effective enough to become standard therapy,
    and does it reach the skeletal (glycosaminoglycan) arm of the disease in
    patients?
  rationale: >-
    Galactose corrects only N-glycosylation, while Mn2+ corrects N-, O- and
    glycosaminoglycan glycosylation in cells and in one treated patient. The
    glycosaminoglycan defect is the one linked to the skeletal phenotype, so
    the choice of therapy matters most there. Manganese is potentially toxic,
    the patients measured had normal blood manganese, and there is a single
    treated patient without skeletal outcome data.
notes: >-
  No GeneReviews chapter covers TMEM165-CDG (check-genereviews reports
  NO_CHAPTER against the name and all synonyms). Phenotype frequencies are
  left unset except where a source states a proportion across its patients,
  because the published cohort is fewer than ten individuals, most phenotypes
  come from one three-patient series of a single genotype, and several
  features (nephrotic syndrome, congenital heart defects) come from one family
  with a different genotype.

  Cardiomyopathy is not curated as a phenotype. A 2025 review (PMID:41583011)
  discusses TMEM165 in the context of congenital cardiomyopathies, but it
  describes heart defects in TMEM165-CDG patients generally and does not
  report a cardiomyopathy in any patient; the structural defects (VSD, PDA,
  PFO) are curated from the primary case reports instead.

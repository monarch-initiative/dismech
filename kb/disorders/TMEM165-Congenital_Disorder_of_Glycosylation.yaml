animal_models:
- name: Zebrafish tmem165 morphant
  species: Danio rerio
  genotype: tmem165 morpholino knockdown
  publication: PMID:25609749
  description: >-
    Morpholino knockdown of tmem165 in zebrafish embryos causes craniofacial
    cartilage malformation with fewer chondrocytes, reduced chondroitin
    sulfate staining, altered chondrocyte and osteoblast differentiation
    markers, and altered N-glycan processing. Co-injection of wild-type mRNA
    partly rescues the cartilage phenotype.
  modeled_mechanisms:
  - target: Premature Chondrocyte Maturation and Hypertrophy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces a cartilage developmental defect with altered chondrocyte and osteoblast
      differentiation.
    limitations: >-
      Transient morpholino knockdown in embryos observed to 4 days post
      fertilisation, not a stable mutant; the craniofacial cartilages scored
      are not the long-bone growth plates affected in patients, and the
      zebrafish finding is fewer chondrocytes rather than the premature
      hypertrophy seen in mammalian chondrocytic cells.
    evidence:
    - reference: PMID:25609749
      reference_title: Abnormal cartilage development and altered N-glycosylation in Tmem165-deficient
        zebrafish mirrors the phenotypes associated with TMEM165-CDG.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inhibition of tmem165 expression in developing zebrafish embryos caused craniofacial
        abnormalities, largely attributable to fewer chondrocytes."
      explanation: The cartilage phenotype of the model.
  - target: Hypogalactosylation and Hyposialylation of N-Glycans
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: N-glycan changes in morphants parallel some of the patients' serum glycan changes.
    limitations: >-
      Whole-embryo glycome rather than serum glycoproteins, and the authors
      describe the parallel as partial.
    evidence:
    - reference: PMID:25609749
      reference_title: Abnormal cartilage development and altered N-glycosylation in Tmem165-deficient
        zebrafish mirrors the phenotypes associated with TMEM165-CDG.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Glycomic analysis of tmem165 morphants also revealed altered initiation, processing and
        extension of N-glycans, paralleling some of the glycosylation changes noted in human patients."
      explanation: The glycan phenotype of the model.
- name: Mammary-specific Tmem165 knockout mouse
  species: Mus musculus
  genotype: Tmem165 floxed allele deleted by WAP-Cre in milk-producing alveolar epithelial cells
  publication: PMID:30622138
  description: >-
    About 85% loss of TMEM165 in the lactating mammary gland reduces lactose
    synthesis and pup growth, and lowers milk Ca2+ and Mn2+ relative to
    protein. The only mammalian in vivo model; it addresses Golgi cation supply
    in a secretory epithelium, not the skeletal or neurological disease.
  modeled_mechanisms:
  - target: Golgi Manganese Insufficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Shows in vivo that TMEM165 supplies Ca2+ and Mn2+ to the Golgi of a secretory cell.
    limitations: >-
      Tissue-restricted, adult, lactation-specific deletion. Golgi Mn2+ is
      inferred from milk mineral content, and the outcome studied (lactose
      synthesis) has no counterpart in the human disease.
    evidence:
    - reference: PMID:30622138
      reference_title: Milk biosynthesis requires the Golgi cation exchanger TMEM165.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "When normalized to total protein levels, only calcium and manganese levels were
        significantly lower in the milk from TMEM165-deficient dams than control dams."
      explanation: The in vivo cation readout.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As shown in Figure 5B, an extremely low level of full-length TMEM165 was detected in
      affected individuals with the truncating mutation."
    explanation: Protein-level consequence of the splice variant, measured in patient fibroblasts.
  - reference: PMID:22683087
    reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, only 25% of the immunoreactivity was recovered in case 4 with the missense
      mutation, suggesting that the mutant protein is also unstable"
    explanation: The missense allele also lowers the amount of TMEM165, so both allele classes
      converge on deficiency.
  - reference: PMID:22683087
    reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that TMEM165 is present in the late Golgi (trans) rather than in
      the early Golgi (cis and median)."
    explanation: Places the protein in the compartment where terminal galactosylation and
      sialylation happen.
  downstream:
  - target: Loss of Golgi Calcium and Manganese Import
    causal_link_type: DIRECT
    description: Less functional TMEM165 means less Ca2+/Mn2+-proton exchange across the Golgi
      membrane.
    evidence:
    - reference: PMID:32047108
      reference_title: The human Golgi protein TMEM165 transports calcium and manganese in yeast and bacterial
        cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that a mutation leading to a E108G substitution within the conserved UPF0016
        family motif significantly reduces TMEM165 activity."
      explanation: A patient allele measured directly in a transport assay, linking the lesion to the
        loss of transport activity.
  - target: Golgi Structural Disorganisation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Patient fibroblasts have a dilated Golgi and fragmented trans-Golgi network; the
      route from TMEM165 loss to this morphology is not established.
- name: Loss of Golgi Calcium and Manganese Import
  biological_scale: MOLECULAR
  description: >-
    TMEM165 and its yeast orthologue Gdt1p are secondary transporters that
    import Ca2+ and Mn2+ into the Golgi lumen in exchange for protons. Direct
    transport of both cations by human TMEM165 was shown in yeast and bacterial
    expression systems, and Gdt1p has a higher affinity for Ca2+ than for Mn2+.
    Loss of TMEM165 removes this import route.
  molecular_functions:
  - preferred_term: manganese ion transmembrane transporter activity
    modifier: DECREASED
    term:
      id: GO:0005384
      label: manganese ion transmembrane transporter activity
  - preferred_term: calcium:proton antiporter activity
    modifier: DECREASED
    term:
      id: GO:0015369
      label: calcium:proton antiporter activity
  cellular_components:
  - preferred_term: Golgi membrane
    term:
      id: GO:0000139
      label: Golgi membrane
  evidence:
  - reference: PMID:32047108
    reference_title: The human Golgi protein TMEM165 transports calcium and manganese in yeast and bacterial
      cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using bacterial cells loaded with the fluorescent Fura-2 probe, we further obtained
      direct biochemical evidence that TMEM165 mediates Ca2+ and Mn2+ influxes."
    explanation: Direct transport measurement for the human protein.
  - reference: PMID:27075443
    reference_title: Yeast Gdt1 is a Golgi-localized calcium transporter required for stress-induced
      calcium signaling and protein glycosylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed a Ca(2+) uptake activity in cells expressing GDT1, which was dependent on
      the external pH, indicating that Gdt1p may act as a Ca(2+)/H(+) antiporter."
    explanation: The pH dependence of transport by the yeast orthologue is the basis for describing
      the family as cation/proton antiporters.
  - reference: PMID:29632074
    reference_title: The yeast protein Gdt1p transports Mn(2+) ions and thereby regulates manganese
      homeostasis in the Golgi.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using Mn2+-induced quenching of Fura-2-emitted fluorescence, we observed that Gdt1p
      mediates Mn2+ influx, in addition to its previously reported regulation of Ca2+ influx."
    explanation: Direct Mn2+ transport by the yeast orthologue, measured in Lactococcus lactis.
  downstream:
  - target: Golgi Manganese Insufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27008884
      reference_title: Glycosylation abnormalities in Gdt1p/TMEM165 deficient cells result from a defect
        in Golgi manganese homeostasis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This study not only provides novel insights into the molecular causes of glycosylation
        defects observed in TMEM165-deficient cells but also suggest that TMEM165 is a key determinant
        for the regulation of Golgi Mn(2+) homeostasis."
      explanation: Places TMEM165 upstream of Golgi Mn2+ homeostasis in TMEM165-depleted mammalian
        cells and gdt1-null yeast.
  - target: Golgi Calcium and pH Imbalance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23569283
      reference_title: Newly characterized Golgi-localized family of proteins is involved in calcium
        and pH homeostasis in yeast and human cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, defects in TMEM165 affected both Ca(2+) and pH homeostasis."
      explanation: Loss of TMEM165 perturbs both Golgi-relevant Ca2+ handling and pH.
- name: Golgi Manganese Insufficiency
  biological_scale: CELLULAR
  description: >-
    The Golgi lumen is left short of Mn2+, the cofactor of the
    beta-1,4-galactosyltransferases, GalNAc transferases and the
    glycosaminoglycan chain-elongating enzymes. This is the node the rest of
    the glycosylation chain turns on, and it is supported by rescue: adding
    Mn2+ to TMEM165-deficient mammalian cells or gdt1-null yeast restores
    glycosylation. Blood manganese was normal in the two patients measured, so
    the deficit is compartmental rather than systemic. SERCA2 can partly
    supply Golgi Mn2+ when TMEM165 is absent.
  biological_processes:
  - preferred_term: Golgi manganese ion homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0030026
      label: intracellular manganese ion homeostasis
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:27008884
    reference_title: Glycosylation abnormalities in Gdt1p/TMEM165 deficient cells result from a defect
      in Golgi manganese homeostasis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We discovered that in both yeasts and mammalian Gdt1p/TMEM165-deficient cells, Mn(2+)
      supplementation could restore a normal glycosylation."
    explanation: Rescue by the missing cofactor is the main evidence that Mn2+ shortage, not another
      Golgi defect, drives the glycosylation phenotype.
  - reference: PMID:39002685
    reference_title: Insights into molecular and cellular functions of the Golgi calcium/manganese-proton
      antiporter TMEM165.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Impaired glycosylation of TMEM165-CDG arises from a lack of Mn2+ within the Golgi.
      Nevertheless, Mn2+ insufficiency in the Golgi is compensated by the activity of the ATPase
      SERCA2."
    explanation: The review's synthesis of the mechanism, including partial compensation by SERCA2.
  - reference: PMID:28323990
    reference_title: Galactose Supplementation in Patients With TMEM165-CDG Rescues the Glycosylation
      Defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Manganese levels were normal in blood samples."
    explanation: Blood Mn2+ was normal in the two patients, consistent with a Golgi-compartment rather
      than whole-body deficit.
  downstream:
  - target: Impaired Manganese-Dependent Golgi Glycosyltransferase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28323990
      reference_title: Galactose Supplementation in Patients With TMEM165-CDG Rescues the Glycosylation
        Defects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "This indicated that a lack of TMEM165 impairs the function of β-1,4-galactosyltransferase,
        a Mn2+ Golgi-dependent glycosyltransferase required for the biosynthesis of sialylated complex
        N-glycan structures"
      explanation: Links TMEM165 loss to the Mn2+-dependent galactosyltransferase step specifically;
        the sentence summarises the group's earlier knockout-cell glycan analysis in the paper's
        introduction.

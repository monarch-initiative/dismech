- name: Type II transferrin isoform profile
  category: Biochemical
  description: >-
    Increased tri-, di-, mono- and asialotransferrin with decreased tetra- and
    higher sialylated forms on serum transferrin isoelectric focusing, present
    in every reported patient and already on the first day of life in the
    patient followed from birth.

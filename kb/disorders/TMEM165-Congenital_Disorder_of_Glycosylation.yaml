name: TMEM165-Congenital Disorder of Glycosylation
creation_date: "2026-09-28T20:00:00Z"
category: Mendelian
disease_term:
  preferred_term: TMEM165-congenital disorder of glycosylation
  term:
    id: MONDO:0013870
    label: TMEM165-congenital disorder of glycosylation
description: >-
  An autosomal recessive congenital disorder of glycosylation, historically
  CDG-IIk, caused by biallelic variants in TMEM165. The gene encodes a
  multi-pass Golgi membrane protein of the UPF0016 family that moves Ca2+ and
  Mn2+ into the Golgi lumen in exchange for protons. It is not a glycosylation
  enzyme: the disease belongs to the group of CDGs caused by loss of a protein
  that maintains the Golgi ionic environment, and the glycosylation defect is
  secondary to Golgi Mn2+ insufficiency, Mn2+ being the cofactor of the
  beta-1,4-galactosyltransferases and several other Golgi glycosyltransferases.

  The glycan consequence is broad. N-glycans lose galactose and, with it, the
  sialic acid that caps galactose (a type 2 transferrin pattern); mucin-type
  O-glycans, glycosphingolipids and the glycosaminoglycan chains of
  chondroitin- and heparan-sulfate proteoglycans are also affected. The
  glycosaminoglycan defect is the best-supported route to the skeletal
  phenotype, which is what distinguishes this CDG clinically: a
  spondylo-epi-metaphyseal dysplasia with osteoporosis and severe postnatal
  growth failure, alongside psychomotor retardation, hypotonia, joint laxity,
  hepatosplenomegaly, raised transaminases and creatine kinase, reduced
  coagulation factors, recurrent unexplained fever and partial growth hormone
  deficiency. Missense-allele patients can be milder, and the founding
  report's p.Arg126His homozygote had no clear skeletal anomalies, although
  the compound heterozygous p.Arg126Cys/p.Gly304Arg patient in the same
  report did have skeletal abnormalities. A homozygous E108G infant died of
  complications of nephrotic syndrome and renal failure at five months.

  Fewer than ten patients are published. Oral D-galactose partially corrects
  N-glycosylation in patients; in cells, Mn2+ corrects all glycosylation
  classes, and combined Mn2+ and D-galactose therapy has been reported in one
  patient.

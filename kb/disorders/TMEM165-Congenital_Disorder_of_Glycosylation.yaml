- name: Apolipoprotein C-III isoform shift
  biomarker_term:
    preferred_term: cathodal shift on serum apolipoprotein C-III isoelectric focusing
  presence: VARIABLE
  notes: >-
    Decreased monosialo- and increased asialo-apoC-III, the serum marker of a
    mucin-type O-glycosylation defect. Present in the three patients of the
    2013 clinical report, but the founding report described a normal apoC-III
    profile. The HPO search `runoak -i ols:hp search "apolipoprotein C-III"`
    returns only HP:0033112 (Elevated circulating apolipoprotein C-III
    concentration), a concentration rather than an isoform term, so the marker
    is left unbound.
  evidence:
  - reference: PMID:23430531
    reference_title: Bone Dysplasia as a Key Feature in Three Patients with a Novel Congenital Disorder
      of Glycosylation (CDG) Type II Due to a Deep Intronic Splice Mutation in TMEM165.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IEF of apolipoprotein C-III shows a decrease of the monosialo-apo C-III and an increase of
      the asialo-apo C-III"
    explanation: The isoform shift itself.
  - reference: PMID:22683087
    reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "These results are consistent with the normal ApoC-III profile and prove the absence of an
      O-glycan defect."
    explanation: A normal apoC-III profile in the founding report, so the marker is not constant.
diagnosis:
- name: Serum transferrin isoelectric focusing
  description: >-
    First-line screen; shows a type 2 pattern in every reported patient,
    including on the first day of life.
  evidence:
  - reference: PMID:22683087
    reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CDG-II in these cases was established by standard sTf-IEF showing a
      marked increase of asialotransferrin, monosialotransferrin, disialotransferrin, and
      trisialotransferrin in all cases"
    explanation: The screening test by which the original patients were identified.
- name: Serum apolipoprotein C-III isoelectric focusing
  description: >-
    Detects the accompanying O-glycosylation defect and so distinguishes a
    combined N- and O-glycosylation defect from a pure N-glycan processing
    defect; it was normal in the founding report, so a normal result does not
    exclude the disease.
  evidence:
  - reference: PMID:23430531
    reference_title: Bone Dysplasia as a Key Feature in Three Patients with a Novel Congenital Disorder
      of Glycosylation (CDG) Type II Due to a Deep Intronic Splice Mutation in TMEM165.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic work-up revealed a type 2 serum transferrin isoelectrofocusing (IEF) pattern
      and a cathodal shift on apolipoprotein C-III IEF pointing to a combined N- and O-glycosylation
      defect."
    explanation: The combined screen used in the clinical series.
- name: Molecular genetic testing of TMEM165 including deep intronic sequence
  description: >-
    Confirms biallelic variants, and has been used prenatally in a family with
    a known variant. The recurrent c.792+182G>A variant lies deep in intron 4,
    outside the exons and flanking splice sites that exome sequencing covers;
    the founding authors state that exome sequencing would not have found it.
  evidence:
  - reference: PMID:22683087
    reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the causal mutation in the index family would never have been identified if the affected
      individuals' samples had been directly subjected to exome sequencing."
    explanation: The authors' own statement that exome sequencing would have missed the causal variant.
  - reference: PMID:26238249
    reference_title: "TMEM165 Deficiency: Postnatal Changes in Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this context, material for genetic analysis was obtained and sequencing of TMEM165
      showed homozygosity for the same mutation as previously found in the sibling."
    explanation: Prenatal molecular diagnosis from amniotic fluid in a family with a known variant.
treatments:
- name: Oral D-Galactose Supplementation
  description: >-
    Oral D-galactose, escalated from 0.5 to 1.5 g/kg/day (maximum 50 g/day)
    over 18 weeks in two c.792+182G>A patients. Well tolerated. Improved
    transferrin sialylation and serum N-glycan galactosylation, APTT,
    antithrombin, IGF-1, IGFBP3 and ALT in one or both patients; no effect on
    creatine kinase, TSH or cholesterol, and 1 g/kg/day was as good as 1.5.
    In cells galactose corrects N-glycosylation but not O-glycosylation or
    glycosaminoglycan synthesis, so it bypasses only the galactosylation step.
  treatment_term:
    preferred_term: oral D-galactose supplementation
    term:
      id: NCIT:C15447
      label: Dietary Intervention
    therapeutic_agent:
    - preferred_term: D-galactose
      term:
        id: CHEBI:12936
        label: D-galactose
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: daily
  dosing_interval_days: 1
  target_mechanisms:
  - target: Hypogalactosylation and Hyposialylation of N-Glycans
    treatment_effect: BYPASSES
    description: Raises galactose substrate supply so the Mn2+-limited galactosyltransferases
      complete more N-glycans; does not act on the O-glycan or glycosaminoglycan arms.
  target_phenotypes:
  - preferred_term: Type II transferrin isoform profile
    term:
      id: HP:0012301
      label: Type II transferrin isoform profile
  - preferred_term: coagulation factor deficiency
    term:
      id: HP:0001928
      label: Abnormality of coagulation
  evidence:
  - reference: PMID:28323990
    reference_title: Galactose Supplementation in Patients With TMEM165-CDG Rescues the Glycosylation
      Defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We then demonstrated that oral galactose supplementation in patients with TMEM165-deficient
      CDG improved biochemical and clinical parameters, including a substantial increase in the
      negatively charged transferrin isoforms, and a decrease in hypogalactosylated total N-glycan
      structures, endocrine function, and coagulation parameters."
    explanation: The clinical result in two patients.
  - reference: PMID:28323990
    reference_title: Galactose Supplementation in Patients With TMEM165-CDG Rescues the Glycosylation
      Defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "d-Galactose intake was increased in increments, as follows: weeks 0 to 6, 0.5 g/kg/d; weeks
      7 to 12, 1.0 g/kg/d; weeks 13 to 18, 1.5 g/kg/d."
    explanation: The dosing schedule recorded in the description.
  - reference: PMID:35693943
    reference_title: Differential Effects of D-Galactose Supplementation on Golgi Glycosylation Defects
      in TMEM165 Deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whereas MnCl2 supplementation unambiguously fully rescues the N- and O-linked as well as
      GAG glycosylations in TMEM165-deficient cells, D-Gal supplementation only rescues the N-linked
      glycosylation, without any effects on the other Golgi-related glycosylation types."
    explanation: The limit of galactose therapy in cells; it leaves the O-glycan and glycosaminoglycan
      defects, and the latter is the one linked to the skeletal phenotype.
- name: Combined Oral Manganese and D-Galactose Therapy
  description: >-
    Combined oral Mn2+ and D-galactose, first given to one p.Ala310Pro patient.
    It suppressed the N-, O- and glycosaminoglycan hypoglycosylation and
    improved biochemical parameters and gastrointestinal symptoms. Single
    patient; an earlier study withheld manganese because blood manganese was
    normal and because of potential toxicity.
  treatment_term:
    preferred_term: oral manganese and D-galactose supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: manganese
      term:
        id: CHEBI:29035
        label: manganese(2+)
    - preferred_term: D-galactose
      term:
        id: CHEBI:12936
        label: D-galactose
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Golgi Manganese Insufficiency
    treatment_effect: RESTORES
    description: Supplies the missing cofactor, which in cells corrects every glycosylation class
      affected.
  evidence:
  - reference: PMID:38013006
    reference_title: Efficacy of oral manganese and D-galactose therapy in a patient bearing a novel TMEM165
      variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We administered for the first time a combined D-Gal and Mn2+ therapy to the patient. This
      fully suppressed the N-; O- and GAG hypoglycosylation."
    explanation: The single-patient result.
  - reference: PMID:28323990
    reference_title: Galactose Supplementation in Patients With TMEM165-CDG Rescues the Glycosylation

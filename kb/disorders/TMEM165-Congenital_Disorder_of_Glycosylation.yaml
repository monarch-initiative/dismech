    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CDG-II in these cases was established by standard sTf-IEF showing a
      marked increase of asialotransferrin, monosialotransferrin, disialotransferrin, and
      trisialotransferrin in all cases"
    explanation: Present in all five patients of the founding series, which carries the frequency.
  - reference: PMID:26238249
    reference_title: "TMEM165 Deficiency: Postnatal Changes in Glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isoelectric focusing (IEF) of transferrin showed a pathological pattern with increased
      amounts of tri-, di-, and monosialotransferrin already in the first blood sample taken 3 min
      after birth."
    explanation: Also present in the E108G patient, from birth.
- name: Global developmental delay
  category: Neurodevelopmental
  description: >-
    Psychomotor retardation, moderate in the c.792+182G>A patients (sitting at
    9 months, walking at 2 years) and severe in patient 3 of that series, who
    at 6 years could not sit unsupported. The p.Arg126His patient functioned at
    a 4-year level at age 9.
  phenotype_term:
    preferred_term: psychomotor retardation
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:23430531
    reference_title: Bone Dysplasia as a Key Feature in Three Patients with a Novel Congenital Disorder
      of Glycosylation (CDG) Type II Due to a Deep Intronic Splice Mutation in TMEM165.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common clinical features include moderate psychomotor retardation, feeding problems (in
      infancy), facial dysmorphism with low-set ears, hypotonia, joint hyperlaxity, hepatosplenomegaly,
      osteoporosis, and spondylo-, epi- and metaphyseal dysplasia aggravating with age."
    explanation: The features common to all three c.792+182G>A patients; shared by several phenotype
      entries below.
  - reference: PMID:22683087
    reference_title: TMEM165 deficiency causes a congenital disorder of glycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of 9 years, his psychomotor level is that of a 4-year-old."
    explanation: Developmental delay also in a missense-allele patient without skeletal involvement.

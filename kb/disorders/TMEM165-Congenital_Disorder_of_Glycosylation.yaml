  description: >-
    The earlier functional model: TMEM165 as a Golgi Ca2+/H+ antiporter whose
    loss perturbs Golgi Ca2+ stores and pH. The disturbance is measured, but
    its contribution to the glycosylation defect is proposed rather than
    shown, and the later Mn2+-rescue data place most of that defect on the
    manganese arm. Kept as a separate branch so the two models are not merged.
  biological_processes:

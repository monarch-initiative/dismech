- name: Impaired Manganese-Dependent Golgi Glycosyltransferase Activity
  biological_scale: MOLECULAR
  description: >-
    Without enough luminal Mn2+, the Mn2+-dependent Golgi glycosyltransferases
    underperform. The best characterised is beta-1,4-galactosyltransferase
    (N-acetyllactosamine synthase), but GalNAc transfer onto glycolipids and
    the polymerising enzymes of glycosaminoglycan chains are also cofactor
    limited. The enzymes themselves are intact, which is why Mn2+ or, for the
    galactosylation step only, extra galactose substrate can rescue.
  molecular_functions:
  - preferred_term: beta-1,4-galactosyltransferase activity
    modifier: DECREASED

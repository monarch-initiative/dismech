pathophysiology:
- name: Heterozygous KCND3 Variants
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: ESTABLISHED
  description: >-
    One KCND3 allele carries a missense variant or small in-frame
    insertion/deletion in the Kv4.3 subunit. Recurrent alleles include an
    in-frame deletion p.F227del (SCA22, Chinese and French families) and
    missense changes such as p.T352P (SCA19), p.T377M, p.M373I, p.S390N,
    p.G345V and p.V338E. The position of the variant does not map cleanly onto
    a single clinical form, but early-onset neurodevelopmental presentations
    tend to carry the more disruptive alleles.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Usually inherited; de novo variants are reported in severe early-onset
      cases. Most alleles reduce Kv4.3 current and act dominant-negatively on
      the wild-type subunit; a minority are gain-of-function, so no single
      functional category covers the allelic series and none is recorded.
  genes:
  - preferred_term: KCND3
    term:
      id: hgnc:6239
      label: KCND3
  evidence:
  - reference: PMID:23280837
    reference_title: "Mutations in KCND3 cause spinocerebellar ataxia type 22."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified heterozygous mutations in the voltage-gated potassium channel Kv4.3-encoding gene KCND3: an in-frame 3-nucleotide deletion c.679_681delTTC p.F227del in both the Chinese and French pedigrees, and a missense mutation c.1034G>T p.G345V in the Ashkenazi Jewish family."
    explanation: Identifies the founding SCA22 variants in KCND3.
  - reference: PMID:23280838
    reference_title: "Mutations in potassium channel kcnd3 cause spinocerebellar ataxia type 19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected a T352P mutation in the third extracellular loop of the voltage-gated potassium channel KCND3 that cosegregated with the disease phenotype in our original family."
    explanation: Identifies the founding SCA19 variant in the same gene.
  downstream:
  - target: Reduced Kv4.3 A-Type Potassium Current
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23280838
      reference_title: "Mutations in potassium channel kcnd3 cause spinocerebellar ataxia type 19."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ectopic expression of all mutant proteins in HeLa cells revealed retention in the endoplasmic reticulum and enhanced protein instability, in contrast to wild-type Kv4.3 that was localized on the plasma membrane."
      explanation: The mutant subunits fail to reach the plasma membrane.
- name: Reduced Kv4.3 A-Type Potassium Current
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss-of-function KCND3 variants reduce the A-type transient outward
    potassium current. The mutant subunits are retained in the endoplasmic
    reticulum and Golgi, are under-glycosylated and short-lived, and when
    co-expressed with wild-type subunits they suppress the trafficking,
    surface expression and current of the wild-type channel in a dominant
    manner. The regulatory subunit KChIP2 can partially rescue membrane
    localisation of some mutants.

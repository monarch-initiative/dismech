    evidence_source: IN_VITRO
    snippet: "We provide evidence that SCA19/22-mutant Kv4.3 exerts a dominant negative effect on the trafficking and surface expression of wild-type Kv4.3 in the absence of its regulatory subunit, KChIP2."
    explanation: The mutant subunit dominantly suppresses the wild-type channel.

- name: Purkinje Cell Firing Dysfunction
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Kv4.3 shapes the A-type potassium current that regulates firing of
    cerebellar Purkinje cells, where the channel is highly expressed. Loss of
    this current and the dominant negative suppression of wild-type Kv4.3
    alter Purkinje cell excitability, which is proposed to drive the
    subsequent Purkinje cell loss.

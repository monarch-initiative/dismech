  mechanism_confidence: ESTABLISHED
  description: >-
    Misfolded Kv4.3 subunits retained in the ER and Golgi activate the
    unfolded protein response. In the F227del knock-in mouse, damage to the
    Golgi is the earliest cerebellar manifestation, and in SCA19/22 patient
    iPSC-derived neurons ER protein-processing genes are enriched and ATF4
    and CHOP are induced, driving apoptosis.

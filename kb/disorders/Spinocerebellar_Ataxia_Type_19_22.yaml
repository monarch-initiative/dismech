name: Spinocerebellar Ataxia Type 19/22
creation_date: "2026-11-12T00:00:00Z"
category: Mendelian
synonyms:
- SCA19/22
- SCA19
- SCA22
- spinocerebellar ataxia type 19
- spinocerebellar ataxia type 22
- KCND3-related spinocerebellar ataxia
description: >-
  Spinocerebellar ataxia type 19/22 (SCA19/22) is an autosomal dominant
  cerebellar disorder caused by heterozygous missense and small in-frame
  variants in KCND3, which encodes Kv4.3, the pore-forming subunit of the
  A-type transient outward potassium current in cerebellar Purkinje cells.
  SCA19 (a Dutch family) and SCA22 (a Chinese family) were mapped separately
  to the same region of chromosome 1 and shown in 2012 to be the same gene.
  Most disease variants cause loss of function: the mutant subunits misfold,
  are retained in the endoplasmic reticulum and Golgi, are degraded faster,
  and suppress the trafficking and current of co-assembled wild-type subunits
  by a dominant negative effect. Patient autopsy cerebellum shows Purkinje
  cell degeneration with Kv4.3 accumulating in the soma. Onset ranges from
  infancy to the ninth decade. Late-onset disease is a very slowly
  progressive, often pure cerebellar ataxia with cerebellar atrophy, saccadic
  pursuit and gaze-evoked nystagmus, and variably mild cognitive impairment,
  parkinsonism, pyramidal signs, myoclonus and peripheral neuropathy.
  Early-onset disease presents with developmental delay, intellectual
  disability and epilepsy before or alongside ataxia. A Kcnd3 F227del
  knock-in mouse reproduces ataxia and Purkinje cell degeneration while a
  Kcnd3 knockout does not, supporting a dominant negative or toxic action of
  the mutant protein rather than simple haploinsufficiency. Treatment is
  supportive.

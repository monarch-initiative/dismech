    explanation: Axonal polyneuropathy in five late-onset patients.
has_subtypes:
- name: Late-onset form
  display_name: Juvenile-adult onset form
  description: >-
    Onset in juvenile to adult life (second to ninth decade) with a slowly
    progressive, often pure cerebellar ataxia. Cognitive decline, peripheral
    neuropathy, parkinsonism and other movement disorders may be added.
  evidence:
  - reference: PMID:32823520
    reference_title: "KCND3-Related Neurological Disorders: From Old to Emerging Clinical Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Late-onset patients show a pure slowly progressive cerebellar ataxia with possible cognitive decline, peripheral neuropathy, parkinsonism, and other movement disorders."
    explanation: Defines the late-onset clinical form.
- name: Early-onset form
  display_name: Infantile-childhood onset form
  description: >-
    Onset in infancy or childhood with neurodevelopmental disorder or epilepsy
    preceding the cerebellar signs; movement disorders may emerge later.
  evidence:
  - reference: PMID:32823520
    reference_title: "KCND3-Related Neurological Disorders: From Old to Emerging Clinical Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with early onset forms present with neurodevelopmental disorder or epilepsy preceding the onset of cerebellar signs. Movement disorders can emerge later in the disease course in half of them."
    explanation: Defines the early-onset clinical form.
genetic:
- name: KCND3
  gene_term:
    preferred_term: KCND3
    term:
      id: hgnc:6239
      label: KCND3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous missense and small in-frame KCND3 variants cause SCA19/22.
    Most are loss-of-function and dominant-negative; a minority are
    gain-of-function. De novo variants occur in severe early-onset cases.
  evidence:
  - reference: PMID:23280837
    reference_title: "Mutations in KCND3 cause spinocerebellar ataxia type 22."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data identify the cause of SCA19/22 in patients of diverse ethnic origins as mutations in KCND3."
    explanation: Establishes KCND3 as the SCA19/22 gene.
  - reference: PMID:26189493
    reference_title: "First de novo KCND3 mutation causes severe Kv4.3 channel dysfunction leading to early onset cerebellar ataxia, intellectual disability, oral apraxia and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a de novo KCND3 mutation causing the most marked change in Kv4.3's channel properties reported so far, which correlated with a severe and unique spinocerebellar ataxia (SCA) type 19/22 disease phenotype."
    explanation: Documents a de novo allele in a severe early-onset case.
  notes: >-
    No ClinGen gene-disease validity record for KCND3 and SCA19/22 is cached
    in references_cache; ClinGen has classified KCND3 only for Brugada
    syndrome 1 (Disputed), a different disease, so gene_disease_validity is
    left empty.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SCA19/22 is inherited in an autosomal dominant manner; de novo variants
    occur in severe early-onset cases.
  evidence:
  - reference: PMID:40293501
    reference_title: "Restoration of Shal/K(V)4 proteostasis and motor function in a Drosophila model of spinocerebellar ataxia type 19/22."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "the autosomal dominant neurodegenerative disease spinocerebellar ataxia type 19/22 (SCA19/22)"
    explanation: States the autosomal dominant inheritance.
prevalence:
- population: Dominant ataxia cohorts (Europe, East Asia)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    No population prevalence is published. KCND3 was found in 4 of 412
    repeat-negative dominant cerebellar ataxia index cases in a European panel
    study; only 68 patients were reviewed worldwide as of 2020.
  evidence:
  - reference: PMID:28444220
    reference_title: "A panel study on patients with dominant cerebellar ataxia highlights the frequency of channelopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently mutated were channel genes [CACNA1A (n = 16), KCND3 (n = 4), KCNC3 (n = 2) and KCNA1 (n = 2)]."
    explanation: KCND3 in 4 of 412 dominant ataxia index cases.
progression:
- phase: Late-onset form
  notes: >-
    Very slowly progressive; some patients are bedridden or wheelchair-bound
    only after 30-50 years of disease, and SARA scores progress by a fraction
    of a point per year.
  evidence:
  - reference: PMID:32823520
    reference_title: "KCND3-Related Neurological Disorders: From Old to Emerging Clinical Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The course of ataxia in late-onset patients was usually slowly progressive, with patients bedridden or wheelchaired after 30–50 years of the disease"
    explanation: Very slow progression in the late-onset form.
- phase: Early-onset form
  notes: >-
    Less predictable in age of onset, severity and progression rate, with
    neurodevelopmental disorder and epilepsy preceding or accompanying ataxia.
  evidence:
  - reference: PMID:32823520
    reference_title: "KCND3-Related Neurological Disorders: From Old to Emerging Clinical Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In early-onset patients, ataxia had a less predictable course in terms of age of onset, severity, and progression rate"
    explanation: Variable course in the early-onset form.

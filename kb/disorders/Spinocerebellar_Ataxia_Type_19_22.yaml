diagnosis:
- name: KCND3 molecular genetic testing
  description: >-
    Diagnosis rests on a dominant cerebellar ataxia with cerebellar atrophy,
    after exclusion of the common repeat-expansion SCAs, plus a heterozygous
    pathogenic KCND3 variant.
  evidence:
  - reference: PMID:28444220
    reference_title: "A panel study on patients with dominant cerebellar ataxia highlights the frequency of channelopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After exclusion of CAG/polyglutamine expansions in spinocerebellar ataxia genes in 412 index cases with dominantly inherited cerebellar ataxias, we aimed to establish the relative frequencies of mutations in other genes"
    explanation: KCND3 is found on panel testing after excluding repeat expansions.
animal_models:
- name: Kcnd3 F227del knock-in mouse
  species: Mouse
  genotype: Kcnd3 F227del knock-in (heterozygous KI/+ and homozygous KI/KI)
  description: >-
    Early-onset motor coordination and balance defects mirroring SCA22
    patients, with Purkinje cell degeneration, a minor Purkinje cell loss,
    cerebellar neuroinflammation, and ER/Golgi retention of the mutant
    protein with unfolded protein response activation. Knockout mice have no
    ataxia, identifying F227del as dominant-negative.
  publication: PMID:39562497
  modeled_mechanisms:
  - target: Purkinje Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces Purkinje cell degeneration and the ataxic phenotype.
    limitations: >-
      A single recurrent in-frame allele; the clearest Purkinje cell loss and
      ER stress are seen in homozygous mice, whereas patients are
      heterozygous.
    evidence:
    - reference: PMID:39562497
      reference_title: "A dominant negative Kcnd3 F227del mutation in mice causes spinocerebellar ataxia type 22 (SCA22) by impairing ER and Golgi functioning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the heterozygous mice exhibited an early onset of defects in motor coordination and balance which mirror those of SCA22 patients."
      explanation: The heterozygous model reproduces the patient motor phenotype.
  - target: Endoplasmic Reticulum Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: The model in which ER/Golgi retention and the UPR were shown.
    limitations: >-
      The earliest lesion is Golgi damage; whether the same sequence occurs in
      human Purkinje cells is not established.
    evidence:
    - reference: PMID:39562497
      reference_title: "A dominant negative Kcnd3 F227del mutation in mice causes spinocerebellar ataxia type 22 (SCA22) by impairing ER and Golgi functioning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the mutant protein is retained by the endoplasmic reticulum and Golgi, leading to activation of the unfolded protein response and a severe trafficking defect that affects its membrane destination."
      explanation: Establishes the ER-stress mechanism in vivo.
- name: Drosophila Shal/Kv4 SCA19/22 model
  species: Fruit fly
  genotype: Knockdown of endogenous Shal (Kv4 ortholog) with transgenic human KV4.3 wild-type or SCA19/22 mutant
  description: >-
    Shal knockdown gives locomotor impairment, ommatidial degeneration and
    reduced brain cortex thickness, rescued by human KV4.3; SCA19/22 mutant
    KV4.3 disrupts endogenous Shal proteostasis, and chaperone (HSC70/HSP83)
    overexpression corrects the deficits.
  publication: PMID:40293501
  modeled_mechanisms:
  - target: Reduced Kv4.3 A-Type Potassium Current
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Models the dominant-negative loss of Kv4/Shal function and its rescue.
    limitations: >-
      Invertebrate nervous system with the Shal ortholog; the cerebellar
      Purkinje cell context is absent, and the readouts are locomotor and
      ommatidial rather than ataxic.
    evidence:
    - reference: PMID:40293501
      reference_title: "Restoration of Shal/K(V)4 proteostasis and motor function in a Drosophila model of spinocerebellar ataxia type 19/22."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transgenic expression of SCA19/22-causing human KV4.3 mutants resulted in notable disruption of endogenous Shal proteostasis, locomotor function, and ommatidia morphology in Drosophila."
      explanation: The mutant disrupts Kv4 proteostasis and motor function in vivo.
experimental_models:
- name: SCA19/22 patient iPSC-derived neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Neurons differentiated from induced pluripotent stem cells of patients
    carrying the T377M KCND3 variant, showing reduced Kv4.3, enrichment of ER
    protein-processing genes, and induction of ATF4 and CHOP.
  publication: PMID:35813061
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Stress
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Patient-derived neurons show ER stress and apoptosis markers.
    limitations: >-
      A single variant (T377M); iPSC-derived neurons are immature and not
      Purkinje cells.
    evidence:
    - reference: PMID:35813061
      reference_title: "Rare KCND3 Loss-of-Function Mutation Associated With the SCA19/22."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "protein processing in the endoplasmic reticulum was significantly enriched in SCA19/22-iPS-derived neurons and was closely related to endoplasmic reticulum stress (ERS) and apoptosis."
      explanation: Patient neurons recapitulate ER stress and apoptosis.
differential_diagnoses:
- name: Spinocerebellar ataxia 13
  description: >-
    KCNC3 encodes the Kv3.3 Purkinje-cell potassium channel and causes a
    dominant ataxia with overlapping slowly progressive course; the two
    potassium-channel SCAs are screened together in repeat-negative dominant
    ataxia.
  evidence:
  - reference: PMID:28444220
    reference_title: "A panel study on patients with dominant cerebellar ataxia highlights the frequency of channelopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently mutated were channel genes [CACNA1A (n = 16), KCND3 (n = 4), KCNC3 (n = 2) and KCNA1 (n = 2)]."
    explanation: KCNC3 (SCA13) is a sibling channelopathy in the same panel.
notes: >-
  Previously carried only as the SCA19-22 has_subtypes row of
  Autosomal_Dominant_Cerebellar_Ataxia_Type_I, which now points here with
  curated_in. SCA19 and SCA22 were described in separate families and shown in
  2012 to be allelic (both KCND3); MONDO carries them under one term,
  MONDO:0011819. The allelic series is functionally mixed: most variants are
  loss-of-function and dominant-negative, but rare gain-of-function alleles
  (p.L450F, p.V392I) also cause the ataxia phenotype, so no single
  functional_impact_category is asserted on the lesion node. No dedicated
  GeneReviews chapter exists for SCA19/22 (only the Hereditary Ataxia
  Overview, NBK1138), so the phenotype baseline is taken from the 68-patient
  KCND3 clinical review (PMID:32823520).

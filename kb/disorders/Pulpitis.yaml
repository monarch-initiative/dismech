        of eradicating microbes or substantially reducing the microbial load from the root
        canal and preventing re-infection by orthograde root filling.
      explanation: >-
        Describes root canal treatment as removal of the root canal infection behind apical
        periodontitis.
  - target: Pulp Necrosis

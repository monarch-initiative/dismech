  - reference: PMID:31145805
    reference_title: Antibiotic use for irreversible pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      illustrates that there is insufficient evidence to determine whether antibiotics reduce
      pain or not compared to not having antibiotics
    explanation: >-
      The Cochrane review, based on one 40-participant trial, found insufficient evidence
      that antibiotics relieve the pain of irreversible pulpitis; it neither shows nor excludes

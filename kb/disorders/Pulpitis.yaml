      label: Fever
  evidence:
  - reference: PMID:31668170
    reference_title: >-
      Evidence-based clinical practice guideline on antibiotic use for the urgent management
      of pulpal- and periapical-related dental pain and intraoral swelling: A report from
      the American Dental Association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The expert panel suggests not prescribing antibiotics for immunocompetent adult patients
      with symptomatic irreversible pulpitis with or without symptomatic apical periodontitis,
      pulp necrosis and symptomatic apical periodontitis, or pulp necrosis and localized acute
      apical abscess in settings where definitive, conservative dental treatment is available
      due to potentially negligible benefits and likely large harms associated with their
      use.
    explanation: >-
      Guideline recommendation against antibiotics for pulpitis and localized periapical disease

  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Shielded by enamel and dentine, they are the first line of cells to get in contact with
      toxins and compounds of oral bacteria once the mineralized matrices have started to
      break down, with caries being the most prevalent cause, followed by dental trauma.
    explanation: >-
      Names caries, then dental trauma, as the commonest ways bacterial products reach the
      odontoblast layer.
- name: Odontoblast Pathogen Recognition
  biological_scale: CELLULAR
  description: >-
    Odontoblasts lining the pulp chamber are the first cells to meet bacterial products. They
    express Toll-like receptors, upregulate TLR2 beneath carious lesions, and signal through
    NF-kB and p38 MAPK to release cytokines and chemokines.
  locations:
  - preferred_term: dental pulp
    term:
      id: UBERON:0001754
      label: dental pulp
  cell_types:
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: Pulpal Leukocyte Recruitment and Cytokine Release
    causal_link_type: DIRECT
    description: >-
      TLR2 and NOD2 signalling produces the cytokines and chemokines that recruit immune cells
      to the pulp-dentine border.
    evidence:
    - reference: PMID:33540711
      reference_title: >-
        Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Antigen binding to TLR2 and the cytosolic NOD2 leads to the activation of nuclear
        factor-κB (NF-κB) and p38 mitogen-activated protein kinase (MPK) signaling, resulting
        in the production of proinflammatory cytokines and chemokines, which can recruit dendritic
        cells
      explanation: >-
        Links odontoblast TLR2 signalling to cytokine and chemokine release and immune-cell
        recruitment.
  - target: Tertiary Dentine Formation
    causal_link_type: DIRECT
    description: >-
      Under mild stimulation odontoblasts increase their secretory activity and lay down reactionary
      dentine.
    evidence:
    - reference: PMID:33540711

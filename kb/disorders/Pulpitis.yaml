    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This indicates that full pulpotomy is not suitable in approximately 25% of the patients
      presenting with symptoms of irreversible pulpitis
    explanation: >-
      Caveat: about a quarter of teeth randomized to pulpotomy needed root canal treatment
      because bleeding could not be controlled.
  - reference: PMID:31668170
    reference_title: >-

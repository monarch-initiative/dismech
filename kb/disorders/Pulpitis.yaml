    explanation: States that crown fracture can expose the pulp to oral microorganisms.
  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Inflammatory reactions in the dental pulp have been described and extensively studied

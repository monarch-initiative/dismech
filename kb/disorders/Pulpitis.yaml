animal_models:
- name: Rat LPS-induced experimental pulpitis
  species: Rat
  genotype: wild type
  description: >-
    Experimental pulpitis induced by applying bacterial lipopolysaccharide to rat dental pulp.
    Pro-inflammatory cytokine and chemokine genes are induced within 3 hours and leukocytes
    accumulate within a further 6 hours.
  modeled_mechanisms:
  - target: Pulpal Leukocyte Recruitment and Cytokine Release
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the early cytokine induction and leukocyte influx of pulpal inflammation.
    limitations: >-
      A single acute LPS challenge to a healthy rat pulp, without a caries biofilm, dentinal
      tubule route or chronic course, so it models the early inflammatory response rather
      than human caries-driven pulpitis.
    evidence:
    - reference: PMID:33540711
      reference_title: >-
        Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In experimentally induced pulpitis in rats, IL6, IL-1β, TNF-α, CCL2, CXCL1, CXCL2,
        also MMP9 and inducible nitric oxide synthetase (iNOS) gene expression were significantly
        upregulated only 3 h after stimulation with lipopolysaccharide (LPS), and a significant
        local increase of leukocytes was evident 6 h later
      explanation: >-
        Animal-model timing of cytokine induction and leukocyte influx after bacterial stimulation
        of the pulp.
  evidence:
  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In experimentally induced pulpitis in rats, IL6, IL-1β, TNF-α, CCL2, CXCL1, CXCL2, also
      MMP9 and inducible nitric oxide synthetase (iNOS) gene expression were significantly
      upregulated only 3 h after stimulation with lipopolysaccharide (LPS), and a significant
      local increase of leukocytes was evident 6 h later
    explanation: >-
      Animal-model timing of cytokine induction and leukocyte influx after bacterial stimulation
      of the pulp.
progression:
- phase: Reversible pulpitis
  description: >-
    Inflammation beneath a deep carious lesion, with provoked pain that stops when the stimulus
    is removed. The pulp heals if the cause is removed.
  evidence:
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      As soon as the caries biofilm destroys enamel and reaches dentin, subtle inflammatory
      changes are already evident near the pulp border adjacent to the affected dentinal tubules
    explanation: >-
      Places the start of pulpal inflammation at the point where the caries biofilm reaches
      dentin, before the pulp is exposed.
  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pathogen removal by therapeutic intervention can result in the resolution of inflammation,
      the elimination of remaining toxins, the secretion of anti-inflammatory signals and
      the production of tertiary dentine
    explanation: >-
      States that removing the bacterial insult lets pulpal inflammation resolve, which is
      what defines the reversible stage.
- phase: Irreversible pulpitis
  description: >-
    Once the lesion reaches the pulp and bacteria invade it, removing the caries no longer
    lets the pulp heal. It may be symptomatic, with spontaneous or lingering pain, or asymptomatic.
  evidence:
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      At this point, pulpitis is regarded as irreversible in the sense that only removal of
      the cause (caries) does not suffice to promote pulp healing
    explanation: >-
      Defines irreversible pulpitis as the stage at which removing the caries no longer lets
      the pulp heal.
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The condition is not always painful; actually, irreversible pulpitis is usually asymptomatic
    explanation: >-
      States that irreversible pulpitis is often painless, which is the basis of the asymptomatic
      irreversible pulpitis category.
- phase: Pulp necrosis
  description: Untreated, the inflamed pulp dies and the root canal system becomes infected.
  evidence:
  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Still, without therapeutic intervention, a deep carious lesion may lead to tissue necrosis,
      which allows bacteria to populate the root canal system and invade the periradicular
      bone via the apical foramen at the root tip.
    explanation: >-
      Describes the sequence from untreated deep caries to pulp necrosis, root canal infection
      and spread to periradicular bone.
- phase: Apical periodontitis
  description: >-
    Infection spreading from the root canal causes periapical inflammation and bone resorption,
    and may form an acute apical abscess, sometimes with systemic involvement.
  evidence:
  - reference: PMID:31668170
    reference_title: >-
      Evidence-based clinical practice guideline on antibiotic use for the urgent management
      of pulpal- and periapical-related dental pain and intraoral swelling: A report from
      the American Dental Association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Progressive pulp inflammation in the apical region (i.e. symptomatic apical periodontitis)
      may result in necrotic pulp (i.e. pulp necrosis and symptomatic apical periodontitis).
    explanation: >-
      Describes progression from pulp inflammation to pulp necrosis with apical periodontitis.
  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Apical periodontitis is caused by an infection of the dental pulp that extends to the
      root pulp and leads to its necrosis
    explanation: >-
      Names pulp infection with necrosis of the root pulp as the cause of apical periodontitis.

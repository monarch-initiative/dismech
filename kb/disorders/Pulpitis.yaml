name: Pulpitis
creation_date: '2026-11-28T15:18:24Z'
category: Infectious Disease
description: >-
  Pulpitis is inflammation of the dental pulp. It is usually caused by bacteria of a deep
  carious lesion whose products, and then the bacteria themselves, reach the pulp through
  dentinal tubules; crown fracture and operative dental procedures are less common causes.
  Odontoblasts at the pulp-dentine border sense bacterial products and start an innate inflammatory
  response, and pulpal sensory nerves add neurogenic inflammation and pain. Clinically it
  is graded as reversible pulpitis, where the pulp heals once the cause is removed, or irreversible
  pulpitis, symptomatic or asymptomatic, where it cannot. Untreated irreversible pulpitis
  progresses to pulp necrosis, infection of the root canal and apical periodontitis. MONDO
  places the term under both dental pulp disorder and bacterial infectious disease; the bacterial
  cause is a polymicrobial caries community rather than one pathogen, and the dental caries
  itself is curated separately (Dental_Caries).
synonyms:
- Inflammation of dental pulp
- Dental pulp inflammation
disease_term:
  preferred_term: Pulpitis
  term:
    id: MONDO:0006937
    label: pulpitis
parents:
- Dental Pulp Disorder
- Bacterial Infectious Disease
- Inflammatory Disease
notes: >-
  Literature and binding caveats. No population prevalence or incidence of pulpitis was found
  in the sources consulted; the available figures come from clinic samples, so no prevalence
  record is given. HPO has no term for toothache, so the pain phenotypes are bound to HP:0012531
  Pain, with the distinguishing features (provoked, lingering, spontaneous, referred) in preferred_term
  and description. Loss of local-anaesthetic efficacy in inflamed mandibular teeth is recorded
  under treatment rather than as a phenotype, because HPO has no term for it. Irreversible
  pulpitis is often painless (asymptomatic irreversible pulpitis), so pain frequencies are
  not set. Pulp necrosis (MONDO:0001326) and apical periodontitis (MONDO:0004508) have their
  own MONDO terms; they are modelled here as later progression phases and pathophysiology
  nodes, not as subtypes. No mechanism module in kb/modules fitted closely enough to declare
  conforms_to: the apical granuloma is granulation tissue rather than the epithelioid granuloma
  of the granuloma_formation module. Systemic antibiotics are not recommended for pulpitis
  itself.
review_notes: >-
  Deliberately lumped. The bacterial agents are recorded as a polymicrobial caries consortium
  at genus level, and no taxon is given a separate subtype: the sequencing studies cited (PMID:27135405,
  PMID:40085030, PMID:30803537) report community-level differences between reversible, symptomatic
  and asymptomatic irreversible pulpitis and call the taxa candidate pathogens, and no source
  reports a genus-specific difference in presentation, diagnosis, treatment or prognosis.
  Only genera named in a cited abstract are bound. The clinical strata that do differ in treatment
  (reversible versus irreversible pulpitis) are recorded as has_subtypes instead.
infectious_agent:
- name: Lactobacillus
  description: >-
    The most abundant genus in the deepest caries layer over exposed pulps with symptomatic
    irreversible pulpitis, dominating about half of the lesions sampled.
  infectious_agent_term:
    preferred_term: Lactobacillus
    term:
      id: NCBITaxon:1578
      label: Lactobacillus
  evidence:
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      As for genera, Lactobacillus accounted for 42.3% of the sequences, followed by Olsenella
      (13.7%), Pseudoramibacter (10.7%) and Streptococcus (5.5%).
    explanation: >-
      Names the dominant genera in the deepest caries layer over exposed pulps in ten teeth
      with symptomatic irreversible pulpitis.
  - reference: PMID:27135405

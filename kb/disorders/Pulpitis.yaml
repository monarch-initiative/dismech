transmission:
- name: Endogenous spread of the caries biofilm through dentine
  description: >-
    Pulpitis is not transmitted between people. The bacteria are the patient's own oral flora,
    organised as the caries biofilm, which demineralizes enamel and dentine and reaches the
    pulp along dentinal tubules. Acquisition of the cariogenic flora itself is covered in
    the Dental_Caries entry.
  evidence:
  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Teeth are susceptible to damage, most commonly to caries, where microorganisms from
      the oral cavity degrade the mineralized tissues of enamel and dentine and invade the
      soft connective tissue at the core, the dental pulp.
    explanation: >-
      Describes the route by which oral microorganisms reach the pulp: through the enamel
      and dentine destroyed by caries.
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      As soon as the caries biofilm destroys enamel and reaches dentin, subtle inflammatory
      changes are already evident near the pulp border adjacent to the affected dentinal tubules
    explanation: >-
      Places the start of pulpal inflammation at the point where the caries biofilm reaches
      dentin, before the pulp is exposed.
- name: Direct exposure of the pulp by trauma
  description: >-
    A crown fracture can open the pulp chamber to the oral cavity and let oral microorganisms
    enter without a carious lesion.
  evidence:
  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Whereas carious lesions are the most common cause for inflammatory reactions, traumatic
      impact, for example, after crown fractures, may also expose the pulp to the oral cavity
      and thus enable microorganisms to access the pulp chamber.
    explanation: States that crown fracture can expose the pulp to oral microorganisms.
has_subtypes:
- name: Reversible Pulpitis
  description: >-
    Inflammation that resolves once the cause, usually caries, is removed. Pain is provoked
    by cold or heat and stops when the stimulus is removed; bacteria have not entered the
    pulp tissue. Managed with vital pulp therapy.
  evidence:
  - reference: PMID:33540711
    reference_title: >-
      Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pathogen removal by therapeutic intervention can result in the resolution of inflammation,
      the elimination of remaining toxins, the secretion of anti-inflammatory signals and
      the production of tertiary dentine
    explanation: >-
      States that removing the bacterial insult lets pulpal inflammation resolve, which is
      what defines the reversible stage.
  - reference: PMID:25312886
    reference_title: Correlation between clinical and histologic pulp diagnoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Infection advancing to the pulp tissue was a common finding in teeth with irreversible
      pulpitis but was never observed in normal/reversibly inflamed pulps.
    explanation: >-
      Histobacteriology separating irreversible pulpitis, with bacteria in the pulp tissue,
      from reversible pulpitis, without them.
  - reference: PMID:30803537
    reference_title: >-
      Microbiome of Deep Dentinal Caries from Reversible Pulpitis to Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      reversible pulpitis with only cold-evoked pain (CRP; n = 17), reversible pulpitis with
      both cold/heat-evoked pain (CHRP; n = 24)
    explanation: >-
      Teeth with reversible pulpitis were recruited on the basis of cold-evoked, or cold-
      and heat-evoked, pain.
- name: Symptomatic Irreversible Pulpitis
  display_name: Symptomatic Irreversible Pulpitis (SIP)
  description: >-
    A vital, inflamed pulp that cannot heal, with spontaneous pain, thermal pain that lingers
    after the stimulus, or referred pain.
  evidence:
  - reference: PMID:31668170
    reference_title: >-
      Evidence-based clinical practice guideline on antibiotic use for the urgent management
      of pulpal- and periapical-related dental pain and intraoral swelling: A report from
      the American Dental Association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Symptomatic irreversible pulpitis is characterized by spontaneous pain that may linger
      with thermal changes due to vital inflamed pulp that is incapable of healing
    explanation: >-
      The guideline's definition of symptomatic irreversible pulpitis, taken from the American
      Association of Endodontists.
  - reference: PMID:40533920
    reference_title: 'Vital Pulp Therapy in Permanent Teeth: A Systematic Review and Meta-Analyses.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Teeth exhibiting symptomatic irreversible pulpitis (SIP) were defined as exhibiting
      spontaneous unprovoked pain, lingering thermal pain, or referred pain, and may have
      periapical pathosis/involvement or not.
    explanation: >-
      Defines symptomatic irreversible pulpitis by spontaneous, lingering thermal or referred
      pain.
- name: Asymptomatic Irreversible Pulpitis
  display_name: Asymptomatic Irreversible Pulpitis (AIP)
  description: >-
    A vital pulp inflamed beyond healing, usually beneath deep caries or a carious exposure,
    without clinical symptoms. Inflammatory markers are raised in the pulp although the tooth
    is painless, and the overlying caries microbiota differs from that of symptomatic teeth.
  evidence:
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The condition is not always painful; actually, irreversible pulpitis is usually asymptomatic
    explanation: >-
      States that irreversible pulpitis is often painless, which is the basis of the asymptomatic
      irreversible pulpitis category.
  - reference: PMID:41747365
    reference_title: >-
      Inflammatory Biomarkers in Irreversible Pulpitis and Pulp Necrosis: A Systematic Review
      and Meta-Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Asymptomatic IP (AIP) also exhibited significantly increased TNF-α despite the absence
      of clinical symptoms.
    explanation: >-
      Shows that asymptomatic irreversible pulpitis is inflamed at the molecular level although
      painless.
  - reference: PMID:40085030
    reference_title: >-
      Comparative analysis of deep dentinal caries microbiota in teeth with normal pulp, reversible
      pulpitis, symptomatic and asymptomatic irreversible pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      AIP was characterized by higher alpha diversity and a greater abundance of gram-negative
      bacteria, with Propionibacterium and Prevotella_7 identified as bacteria associated
      with AIP pathogenesis.
    explanation: >-
      Reports that the caries microbiota over teeth with asymptomatic irreversible pulpitis
      differs from that over symptomatic teeth.
pathophysiology:
- name: Cariogenic Biofilm Penetration of Dentine
  role: trigger
  biological_scale: TISSUE
  description: >-
    A deep carious lesion advances through dentine towards the pulp. Bacterial products diffuse
    down the dentinal tubules ahead of the bacteria, and pulpal inflammation starts before
    the pulp is exposed, increasing as the lesion deepens. Caries is the commonest cause of
    pulpitis (see Dental_Caries).
  locations:
  - preferred_term: dentine
    term:
      id: UBERON:0001751
      label: dentine
  downstream:
  - target: Odontoblast Pathogen Recognition
    causal_link_type: DIRECT
    description: >-
      Lipoteichoic acid of the Gram-positive caries flora is sensed by TLR2 on odontoblasts.
    evidence:
    - reference: PMID:33540711
      reference_title: >-
        Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Carious lesions are predominantly caused by Gram-positive bacteria; their cell wall
        component LTA is recognized by TLR2 engagement.
      explanation: >-
        Identifies TLR2 recognition of Gram-positive lipoteichoic acid as the sensing step
        at the pulp-dentine border. The underlying studies are mostly in vitro.
  - target: Pulpal Neurogenic Inflammation
    causal_link_type: DIRECT
    description: Early in caries progression, pulpal sensory afferents release neuropeptides.
    evidence:
    - reference: PMID:33540711
      reference_title: >-
        Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        During the initial phase of caries progression, the above-mentioned protective outward
        flow of liquid in the dentinal tubules can be increased as a result of elevated intrapulpal
        pressure after the release of neuropeptides by intra-pulpal sensory afferent nerve
        fibers
      explanation: >-
        Places neuropeptide release from pulpal afferents early in caries progression, raising
        intrapulpal pressure.
  - target: Bacterial Invasion of Pulp Tissue
    causal_link_type: DIRECT
    description: >-
      When the lesion reaches the pulp, the caries biofilm is in direct contact with pulp
      tissue.
    evidence:
    - reference: PMID:27135405
      reference_title: >-
        Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible
        Pulpitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        When the pulp tissue is frankly exposed to the caries biofilm, a severe inflammatory
        reaction develops, often resulting in localized abscesses.
      explanation: >-
        Describes direct bacterial contact with the pulp after carious exposure as the step
        that produces severe inflammation and localized pulpal abscesses.
  - target: Carious Teeth
    causal_link_type: DIRECT
    description: The advancing lesion is clinically visible as deep caries.
  evidence:
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Caries is the major cause of pulp inflammation
    explanation: >-
      States that caries is the principal cause of pulpitis. Quoted from the study's introduction,
      which summarises earlier work.
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      As soon as the caries biofilm destroys enamel and reaches dentin, subtle inflammatory
      changes are already evident near the pulp border adjacent to the affected dentinal tubules
    explanation: >-
      Places the start of pulpal inflammation at the point where the caries biofilm reaches
      dentin, before the pulp is exposed.
  - reference: PMID:27135405
    reference_title: >-
      Microbiome of Deep Dentinal Caries Lesions in Teeth with Symptomatic Irreversible Pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      As the caries lesion progresses deep in dentin and towards to the pulp, the severity
      of pulp inflammation increases
    explanation: Links the depth of the carious lesion to the severity of pulp inflammation.
  - reference: PMID:31668170
    reference_title: >-
      Evidence-based clinical practice guideline on antibiotic use for the urgent management
      of pulpal- and periapical-related dental pain and intraoral swelling: A report from
      the American Dental Association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Bacteria associated with caries can cause symptomatic irreversible pulpitis, an inflammation
      of the pulpal tissue.
    explanation: >-
      States the caries-bacteria cause of symptomatic irreversible pulpitis. Background statement
      of the guideline.

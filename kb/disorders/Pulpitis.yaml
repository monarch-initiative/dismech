clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Irreversible pulpitis causes acute, intense pain and is one of the commonest reasons for
    emergency dental care. It is not usually life-threatening, but untreated pulp necrosis
    can lead to an acute apical abscess with systemic involvement, and inappropriate antibiotic
    prescribing for toothache carries its own harms.
  evidence:
  - reference: PMID:31145805
    reference_title: Antibiotic use for irreversible pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Irreversible pulpitis, which is characterised by acute and intense pain, is one of the
      most frequent reasons that patients attend for emergency dental care.
    explanation: >-
      Background statement of the Cochrane review on the burden of irreversible pulpitis in
      emergency dental care.
  - reference: PMID:31668170
    reference_title: >-
      Evidence-based clinical practice guideline on antibiotic use for the urgent management
      of pulpal- and periapical-related dental pain and intraoral swelling: A report from
      the American Dental Association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Acute apical abscess with systemic involvement is characterized by necrotic pulp with
      spontaneous pain, with or without mastication and/or percussion or palpation, with formation
      of purulent material, swelling, evidence of fascial space or local lymph node involvement,
      fever, and/or malaise.
    explanation: >-
      Defines the spreading abscess with fever and malaise that can follow pulp necrosis.
diagnosis:
- name: Clinical pulp diagnosis by AAE categories
  description: >-
    The pulp is assigned to normal pulp, reversible pulpitis, symptomatic irreversible pulpitis
    or asymptomatic irreversible pulpitis from the pain history and clinical tests, following
    the American Association of Endodontists' diagnostic terminology. The clinical categories
    agree with histology in most teeth (96.6% for normal or reversible, 84.4% for irreversible
    pulpitis), but clinical pulp diagnosis remains imperfect. Asymptomatic irreversible pulpitis
    is identified by the depth of the lesion or a carious exposure rather than by pain.
  diagnosis_term:
    preferred_term: dental examination
    term:
      id: NCIT:C158323
      label: Dental Examination
  evidence:
  - reference: PMID:40085030
    reference_title: >-
      Comparative analysis of deep dentinal caries microbiota in teeth with normal pulp, reversible
      pulpitis, symptomatic and asymptomatic irreversible pulpitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      categorized into NP (n = 27), RP (n = 27), SIP (n = 27), and AIP (n = 27), according
      to the American Association of Endodontists' diagnostic criteria
    explanation: >-
      Uses the American Association of Endodontists' clinical categories of reversible, symptomatic
      irreversible and asymptomatic irreversible pulpitis.
  - reference: PMID:25312886
    reference_title: Correlation between clinical and histologic pulp diagnoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The clinical diagnosis of normal pulp/reversible pulpitis matched the histologic diagnosis
      in 57 of 59 (96.6%) teeth. Correspondence of the clinical and histologic diagnosis of
      irreversible pulpitis occurred in 27 of 32 (84.4%) cases.
    explanation: >-
      Shows that the clinical reversible/irreversible categories agree with histology in most
      teeth.
  - reference: PMID:25312886
    reference_title: Correlation between clinical and histologic pulp diagnoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This means that the classification of pulp conditions as normal pulps, reversible pulpitis,
      and irreversible pulpitis has high chances of guiding the correct therapy in the large
      majority of cases.
    explanation: >-
      Supports the clinical reversible/irreversible classification as a guide to treatment.
  - reference: PMID:25312886
    reference_title: Correlation between clinical and histologic pulp diagnoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, there is still a need for refined and improved means for reliable pulp diagnosis.

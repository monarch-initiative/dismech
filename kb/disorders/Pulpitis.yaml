  - reference: PMID:42426147
    reference_title: >-
      The effectiveness of pulpotomy in mature permanent posterior teeth with irreversible
      pulpitis: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At the primary 12-month timepoint, pooled success was 0.92 (95% CI 0.89-0.95) for FP
      and 0.89 (0.81-0.95) for PP.
    explanation: >-
      Pooled 12-month success of full and partial pulpotomy in mature posterior teeth with
      irreversible pulpitis.
  - reference: PMID:42426147
    reference_title: >-
      The effectiveness of pulpotomy in mature permanent posterior teeth with irreversible
      pulpitis: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Given the low-to-very-low certainty of evidence, these findings warrant caution, and
      adequately powered trials with longer follow-up are needed.
    explanation: Caveat on the certainty of the pulpotomy evidence.
  - reference: PMID:39325552
    reference_title: >-
      The short-term postoperative pain and impact upon quality of life of pulpotomy and root
      canal treatment, in teeth with symptoms of irreversible pulpitis: A randomized controlled
      clinical trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the treatment of IP, pulpotomy is as effective as RCT in reducing post-operative
      pain, and improving QoL and HRQoL, teeth displaying uncontrollable bleeding and periapical
      radiolucencies detected using CBCT are associated with more intense postoperative pain
      and lower QoL.
    explanation: >-
      Randomized trial result that full pulpotomy and root canal treatment relieve the pain
      of irreversible pulpitis equally.
  - reference: PMID:39325552
    reference_title: >-
      The short-term postoperative pain and impact upon quality of life of pulpotomy and root

      reference_title: >-
        The effectiveness of pulpotomy in mature permanent posterior teeth with irreversible
        pulpitis: a systematic review and meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Full pulpotomy (FP) involves the removal of the coronal pulp to the level of the root

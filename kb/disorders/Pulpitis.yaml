  - reference: PMID:29709297
    reference_title: >-
      Effect of Nonsteroidal Anti-inflammatory Drug as an Oral Premedication on the Anesthetic
      Success of Inferior Alveolar Nerve Block in Treatment of Irreversible Pulpitis: A Systematic
      Review with Meta-analysis and Trial Sequential Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Dose-dependent ibuprofen >400 mg/d (RR = 1.85; 95% CI, 1.39-2.45) was shown to be effective;
      however, ibuprofen ≤400 mg/d showed no association (RR = 1.78; 95% CI, 0.90-3.55).
    explanation: >-
      Shows that the benefit of ibuprofen premedication was seen above 400 mg per day only.
  - reference: PMID:30295006
    reference_title: >-
      Effect of ibuprofen on the efficacy of inferior alveolar nerve block in patients with
      irreversible pulpitis: A meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Administering ibuprofen before anaesthesia increased the success rate of injectable
      anaesthesia (RR = 1.79; 95% confidence interval (CI) 1.32-2.42; P = 0.0002) even in
      cases of symptomatic irreversible pulpitis
    explanation: >-
      A second meta-analysis confirming that ibuprofen before the nerve block increases anaesthetic
      success.
- name: Interim Analgesia with Ibuprofen and Acetaminophen
  description: >-
    Ibuprofen 400-600 mg with acetaminophen 1000 mg is the preferred interim analgesic for
    pulpal pain until definitive dental treatment, and is less harmful than opioid-containing
    medicines. There is insufficient evidence that antibiotics relieve the pain of irreversible
    pulpitis, and the ADA guideline advises against using them for it.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ibuprofen
      term:
        id: CHEBI:5855
        label: ibuprofen
    - preferred_term: acetaminophen

- name: Local Anaesthesia by Inferior Alveolar Nerve Block
  description: >-
    Effective local anaesthesia is needed to treat inflamed mandibular teeth. The inferior
    alveolar nerve block succeeds much less often in irreversible pulpitis than in an uninflamed
    pulp (about 30% against 70%; 14-39% for the block alone across trials), so supplemental
    buccal infiltration is often added, and oral NSAID premedication raises success.
  treatment_term:
    preferred_term: local anesthesia
    term:
      id: NCIT:C81260
      label: Local Anesthesia Procedure
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:29709297
    reference_title: >-
      Effect of Nonsteroidal Anti-inflammatory Drug as an Oral Premedication on the Anesthetic
      Success of Inferior Alveolar Nerve Block in Treatment of Irreversible Pulpitis: A Systematic
      Review with Meta-analysis and Trial Sequential Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Successful anesthesia with an inferior alveolar nerve block (IANB) is imperative for
      treating patients with irreversible pulpitis in mandibular teeth.
    explanation: >-
      States the need for effective inferior alveolar nerve block anaesthesia in mandibular
      teeth with irreversible pulpitis.
  - reference: PMID:26069400
    reference_title: >-
      Anesthetic success of supplemental infiltration in mandibular molars with irreversible
      pulpitis: A systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Success rate of IANB in an uninflamed pulp was reported to be 70% compared with 30%
      in patients with irreversible pulpitis.
    explanation: >-
      Background figures from earlier studies showing that the inferior alveolar nerve block
      succeeds far less often in irreversible pulpitis.
  - reference: PMID:26069400
    reference_title: >-
      Anesthetic success of supplemental infiltration in mandibular molars with irreversible
      pulpitis: A systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Inferior alveolar nerve block alone gave 14-39% success rate.
    explanation: >-
      Systematic-review result: across included trials the block alone achieved 14-39% anaesthetic
      success in mandibular molars with irreversible pulpitis.
  - reference: PMID:26069400
    reference_title: >-
      Anesthetic success of supplemental infiltration in mandibular molars with irreversible
      pulpitis: A systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: With SI the local anesthetic significantly increased the success rate 50-65%.
    explanation: Supplemental buccal infiltration added to the block raised anaesthetic success.
  - reference: PMID:29709297
    reference_title: >-
      Effect of Nonsteroidal Anti-inflammatory Drug as an Oral Premedication on the Anesthetic
      Success of Inferior Alveolar Nerve Block in Treatment of Irreversible Pulpitis: A Systematic
      Review with Meta-analysis and Trial Sequential Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Oral premedication with NSAIDs and ibuprofen (>400 mg/d) increased the anesthetic success
      of IANBs in patients with irreversible pulpitis.
    explanation: >-
      Meta-analysis of 13 randomized trials showing that NSAID premedication raises nerve-block
      success.
- name: NSAID Premedication Before Nerve Block
  description: >-
    Oral NSAIDs given before the inferior alveolar nerve block increase anaesthetic success
    in irreversible pulpitis; for ibuprofen the benefit was seen at doses above 400 mg per
    day.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ibuprofen
      term:
        id: CHEBI:5855
        label: ibuprofen
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:29709297
    reference_title: >-

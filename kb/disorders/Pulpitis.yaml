- name: Systemic Antibiotics Restricted to Systemic Involvement
  description: >-
    Antibiotics are not recommended for symptomatic irreversible pulpitis, or for localized
    periapical disease where dental treatment is available, because benefit is negligible
    and harms (adverse events, resistance, C. difficile infection) are likely. They are indicated
    alongside definitive treatment when there is systemic involvement such as fever and malaise;
    amoxicillin or penicillin VK is used as a delayed prescription when definitive treatment
    of pulp necrosis with apical periodontitis cannot be provided.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
    - preferred_term: penicillin VK
      term:
        id: CHEBI:27446

- name: Pulpal inflammatory biomarkers (investigational)
  description: >-
    Cytokines (TNF-alpha, IL-6, IL-8) and neuropeptides (substance P, CGRP) in pulp tissue
    or pulpal blood are raised in irreversible pulpitis and might reflect pulp status better
    than clinical signs. They are research tools without validated cut-offs.
  evidence:
  - reference: PMID:41747365
    reference_title: >-
      Inflammatory Biomarkers in Irreversible Pulpitis and Pulp Necrosis: A Systematic Review
      and Meta-Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Symptomatic IP (SIP) showed significantly elevated TNF-α, IL-2, IL-6, IL-8, Substance
      P, CGRP, and catalase compared to healthy pulp.
    explanation: >-
      Pooled human data showing raised cytokines and neuropeptides in the pulp of teeth with
      symptomatic irreversible pulpitis.
  - reference: PMID:41747365
    reference_title: >-
      Inflammatory Biomarkers in Irreversible Pulpitis and Pulp Necrosis: A Systematic Review
      and Meta-Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Molecular biomarkers may better reflect pulp status than clinical signs.
    explanation: >-
      The authors' conclusion that molecular markers could refine clinical pulp diagnosis.
treatments:
- name: Selective Caries Removal with Indirect Pulp Capping
  description: >-
    For deep caries with reversible pulpitis, carious dentine is removed selectively so that
    the pulp is not exposed, and a liner is placed over the remaining dentine. This removes
    the bacterial insult while keeping the pulp covered.
  treatment_term:
    preferred_term: indirect pulp capping
    term:
      id: NCIT:C52576
      label: Indirect Pulp Cap
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Cariogenic Biofilm Penetration of Dentine
    description: Removes the infected dentine that drives the pulpal response.
    evidence:
    - reference: PMID:33540711
      reference_title: >-
        Inflammatory Response Mechanisms of the Dentine-Pulp Complex and the Periapical Tissues.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Pathogen removal by therapeutic intervention can result in the resolution of inflammation,
        the elimination of remaining toxins, the secretion of anti-inflammatory signals and
        the production of tertiary dentine
      explanation: >-
        States that removing the bacterial insult lets pulpal inflammation resolve, which
        is what defines the reversible stage.
  evidence:
  - reference: PMID:40533920
    reference_title: 'Vital Pulp Therapy in Permanent Teeth: A Systematic Review and Meta-Analyses.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Selective caries removal minimized pulp exposures in teeth with deep caries diagnosed
      with NP/RP.
    explanation: Supports selective caries removal for deep caries with reversible pulpitis.
  - reference: PMID:40533920
    reference_title: 'Vital Pulp Therapy in Permanent Teeth: A Systematic Review and Meta-Analyses.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All vital pulp therapy methods are successful for teeth diagnosed with normal pulp/reversible
      pulpitis.
    explanation: Supports indirect and direct pulp capping and pulpotomy for reversible pulpitis.
  - reference: PMID:40533920
    reference_title: 'Vital Pulp Therapy in Permanent Teeth: A Systematic Review and Meta-Analyses.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      IPT (94 percent) versus DPC (87 percent) success at 36 months was not significantly
      different when calcium silicate cement (CS) was used for DPC in teeth diagnosed with
      NP/RP (P=0.10).
    explanation: >-
      Gives 36-month success of indirect and direct pulp capping in reversible pulpitis.

- name: Pulpotomy
  description: >-
    Removal of the inflamed coronal pulp, partial or full, leaving the radicular pulp vital
    under a calcium silicate cement. It is an alternative to root canal treatment in irreversible
    pulpitis: a full pulpotomy is recommended once pulpal bleeding is controlled. It is not
    suitable for about a quarter of teeth, in which bleeding cannot be controlled, and the
    certainty of the evidence is low.

histopathology:
- name: Bacteria within pulp tissue
  description: >-
    On histobacteriological examination, bacteria advancing into the pulp tissue are a common
    finding in irreversible pulpitis and are absent from normal or reversibly inflamed pulps.
  subtype: Symptomatic Irreversible Pulpitis
  evidence:
  - reference: PMID:25312886
    reference_title: Correlation between clinical and histologic pulp diagnoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Infection advancing to the pulp tissue was a common finding in teeth with irreversible
      pulpitis but was never observed in normal/reversibly inflamed pulps.
    explanation: >-
      Histobacteriology separating irreversible pulpitis, with bacteria in the pulp tissue,
      from reversible pulpitis, without them.
- name: Apical granuloma or radicular cyst
  description: >-
    The periapical lesion that follows pulp necrosis is most often an apical granuloma and
    less often a radicular cyst; both are inflammatory.

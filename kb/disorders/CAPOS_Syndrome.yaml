    residual form, the most consistent persisting deficit. Onset is usually
    between 6 months and 5 years. Generated by the Persistent Multimodal
    Neurological Deficit pathophysiology node. The HPO binding uses the general
    Ataxia term because the acute CAPOS episode is not adequately described by
    either the progressive or the nonprogressive cerebellar ataxia subterms -
    the course is stepwise.

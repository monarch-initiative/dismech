    snippet: "The α3 isoform is required as a rescue pump, after repeated action potentials, with a distribution predominantly in neurons of the central nervous system."
    explanation: >-
      Establishes the general alpha-3 rescue-pump role that CAPOS shares with the
      rest of the ATP1A3-related spectrum. This is general ATP1A3 biology rather
      than a CAPOS-specific observation.
  - reference: PMID:29184165
    reference_title: "ATP1A3 mutations can cause progressive auditory neuropathy: a new gene of auditory synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NKAα3 is known to play an important role in the rapid restoration of increased intracellular Na+ concentration after high neuronal activity in the nervous system"
    explanation: >-
      States the recovery-after-firing role of alpha-3 in a paper whose CAPOS
      probands carry p.E818K. The statement is general ATP1A3 biology cited in a

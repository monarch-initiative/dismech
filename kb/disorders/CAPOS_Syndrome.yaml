    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study shows that an allelic mutation in ATP1A3 produces CAPOS syndrome."
    explanation: >-
      Establishes ATP1A3 as the causative gene for CAPOS, distinct from the
      previously known ATP1A3 phenotypes.
  - reference: PMID:24468074
    reference_title: A novel recurrent mutation in ATP1A3 causes CAPOS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

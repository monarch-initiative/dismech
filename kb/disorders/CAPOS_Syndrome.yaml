- name: Febrile Illness
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Fever — usually an intercurrent childhood infection — is the near-universal
    precipitant of CAPOS episodes. In the discovery cohort every episode in
    every affected individual across three families was triggered by a febrile
    illness, and the same association holds in subsequent series. Pregnancy and
    the peripartum period have also been reported as a trigger, and hearing loss
    in particular can step-change after a febrile event. This makes fever an
    explicit, modelled node rather than background context, and gives CAPOS the
    same trigger-unmasked channelopathy architecture seen in fever-unmasked
    Brugada syndrome and in fever-exacerbated Timothy syndrome.
  biological_processes:
  - preferred_term: response to temperature stimulus
    term:
      id: GO:0009266
      label: response to temperature stimulus
    modifier: INCREASED
  evidence:

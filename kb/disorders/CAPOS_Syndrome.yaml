inheritance:
- name: Autosomal dominant ATP1A3 p.Glu818Lys
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: About half of individuals with CAPOS syndrome
  expressivity: VARIABLE
  description: >-
    CAPOS syndrome is inherited in an autosomal dominant manner within the
    broader ATP1A3-related disorder spectrum. Multigenerational transmission is
    well documented (the original 1996 family, and later three-generation
    pedigrees), and roughly half of probands instead carry an apparently de
    novo variant. Each child of an affected individual has a 50% risk of
    inheriting the variant. Expressivity is highly variable and age-dependent:
    the same p.Glu818Lys allele can produce classic multisystem CAPOS, an
    incomplete phenotype without pes cavus (CAOS), or an
    auditory-neuropathy-predominant presentation in which neurological signs
    are subtle or emerge only years later.

- name: Impaired Neuronal Ion Gradient Restoration
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    The alpha-3 isoform is the neuron-enriched "rescue" pump responsible for
    rapidly restoring intracellular Na+ concentration and resting membrane
    potential after bursts of high-frequency firing. With reduced alpha-3
    capacity, neurons recover their transmembrane electrochemical gradients too
    slowly after activity, so membrane potential, excitability, and synaptic
    transmission become unreliable in exactly those cell populations that fire
    at high rates — cerebellar, auditory-afferent, visual, and brainstem
    neurons. This is a functional deficit of recovery rather than a structural
    lesion, which is why baseline function can be near normal and imaging is
    frequently unremarkable.

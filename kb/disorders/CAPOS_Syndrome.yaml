- name: Optic Nerve and Retinal Ganglion Cell Degeneration
  biological_scale: CELLULAR
  role: effector
  description: >-
    Progressive bilateral optic atrophy is one of the two most consistent
    persistent features of CAPOS (with areflexia), present in every affected
    individual in the discovery cohort. It is typically accompanied by pallor of
    the optic discs, reduced visual acuity that can reach profound impairment,
    and nystagmus. The retinofugal projection is a long, high-firing,
    energetically demanding pathway of the kind expected to be vulnerable to
    reduced alpha-3 pump capacity, but no CAPOS-specific retinal or optic-nerve
    pathology study exists, so the cellular mechanism is inferred rather than
    demonstrated.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:36192182
      reference_title: The Phenotypic Continuum of ATP1A3-Related Disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ATP1A3 is associated with a broad spectrum of predominantly neurologic disorders, which continues to expand beyond the initially defined phenotypes of alternating hemiplegia of childhood, rapid-onset dystonia parkinsonism, and cerebellar ataxia, areflexia, pes cavus, optic atrophy, sensorineural hearing loss syndrome."
      explanation: >-
        Places CAPOS within the predominantly neurologic ATP1A3-related disorder
        spectrum, supporting the NEUROLOGIC Harrison's Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:25895915
      reference_title: "CAOS-Episodic Cerebellar Ataxia, Areflexia, Optic Atrophy, and Sensorineural Hearing Loss: A Third Allelic Disorder of the ATP1A3 Gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings substantiate this variant as the cause of a unique inherited autosomal dominant neurologic syndrome that constitutes a third allelic disease of the ATP1A3 gene."
      explanation: >-
        Establishes CAPOS as a Mendelian, autosomal dominant single-gene
        disorder, supporting the genetics Part alongside the neurologic Part.
  - classification_value: DISORDER_OF_EAR
    evidence:
    - reference: PMID:29305691
      reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we demonstrate for the first time evidence for auditory neuropathy in CAPOS syndrome, which may reflect impaired propagation of electrical impulses along the spiral ganglion neurons."
      explanation: >-
        A defining and management-relevant component of CAPOS is a specific
        cochlear-nerve (auditory neuropathy) hearing disorder, supporting the
        ear Part.
  channelopathy_category:
    classification_value: neurological channelopathy
    notes: >-
      ATP1A3 encodes an electrogenic ion pump (Na+/K+-ATPase alpha-3) rather than
      a classical ion channel, but dismech and the clinical literature both group
      ATP1A3-related disorders with the neurological channelopathies because the
      primary lesion is failure of neuronal transmembrane ion-gradient
      maintenance and excitability control. The allelic entry
      Alternating_Hemiplegia_of_Childhood is likewise classified as a
      channelopathy in this knowledge base.
inheritance:
- name: Autosomal dominant, roughly half de novo and half inherited
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: About half of individuals with CAPOS
  description: >-
    CAPOS is inherited in an autosomal dominant manner. Unlike the more severe
    allelic phenotype alternating hemiplegia of childhood, in which the variant
    is usually de novo, roughly half of individuals with CAPOS inherit the
    p.Glu818Lys variant from an affected (sometimes mildly or belatedly
    recognised) parent, and roughly half have an apparently de novo variant.
    Multigenerational transmission was central to the original gene discovery,
    which found the identical variant segregating in three independent families.
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATP1A3-related disorder – including the four historically defined phenotypes of AHC, CAPOS syndrome, RECA/FIPWE, and RDP – is inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews states autosomal dominant inheritance explicitly for the
      CAPOS phenotype within the ATP1A3-related disorder spectrum.
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About half of individuals with a relatively less severe ATP1A3-related phenotype (e.g., CAPOS syndrome or RDP) have the disorder as the result of a pathogenic variant inherited from an affected parent; about half of individuals have an apparently de novo pathogenic variant."
    explanation: >-
      Directly supports the roughly 50/50 inherited-versus-de-novo split that
      distinguishes CAPOS counselling from AHC counselling.
  - reference: PMID:24468074
    reference_title: A novel recurrent mutation in ATP1A3 causes CAPOS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We undertook genetic analysis of three affected families to identify the cause of dominantly-inherited CAPOS (cerebellar ataxia, areflexia, pes cavus, optic atrophy and sensorineural hearing loss) syndrome."
    explanation: >-
      The gene-discovery study was built on dominantly inherited multiplex
      families, supporting familial autosomal dominant transmission.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate exists for CAPOS. The
    literature is case-series only: 22 patients were reported by 2017, rising to
    25 with the addition of one Spanish family, and subsequent reports remain
    single families or small cohorts. A rate_per_100000 value is deliberately
    omitted rather than back-calculated from a case count, because the
    denominator is unknown and ascertainment is driven by targeted ATP1A3
    sequencing.
  evidence:
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CAPOS syndrome (cerebellar ataxia, areflexia, pes cavus, optic atrophy, and sensorineural hearing loss) is a rare disease that has been reported in 22 patients so far."
    explanation: >-
      A systematic literature review quantifies the total reported case count,
      the only occurrence measure available for CAPOS.
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 25 Individuals with CAPOS syndrome have been reported, including our family."
    explanation: >-
      Confirms the cumulative published-case denominator, supporting the
      ULTRA_RARE prevalence class and the CASES_IN_LITERATURE measure type.
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present four patients from the seventh and eighth family identified worldwide, provide a critical review of all patients published thus far, and speculate about the pathophysiologic processes underlying the acute neurological manifestations."
    explanation: >-
      Reporting the seventh and eighth families worldwide independently
      corroborates that CAPOS is countable at the level of individual families.

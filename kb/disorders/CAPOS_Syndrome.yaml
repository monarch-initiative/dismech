    snippet: "The individuals presented here experienced one to three paroxysmal, short-lasting episodes in childhood with cerebellar symptoms and signs, hypotonia, ophthalmoparesis, motor weakness, areflexia, and/or lethargy that were consistently associated with febrile illness."
    explanation: >-

- name: Auditory Neuropathy with Preserved Outer Hair Cell Function
  role: effector
  biological_scale: TISSUE
  description: >-
    The CAPOS hearing loss is mechanistically a neural, not a sensory, lesion.
    Cochlear outer hair cell activity is preserved, demonstrated by intact
    otoacoustic emissions and cochlear microphonic potentials, while auditory
    brainstem responses are grossly abnormal, indicating neural dyssynchrony in
    the cochlear nerve. Speech perception, especially in noise, is
    disproportionately poor relative to the pure-tone audiogram. This is the
    classic auditory neuropathy spectrum disorder profile and it is why
    conventional amplification performs badly and why cochlear implantation
    became the management question. This node generates the Sensorineural
    hearing impairment and Abnormal auditory evoked potentials phenotypes.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  evidence:
  - reference: PMID:29305691
    reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show for the first time that cochlear outer hair cell activity was preserved as shown by the presence of otoacoustic emissions and cochlear microphonic potentials, but the auditory brainstem responses were grossly abnormal, likely reflecting neural dyssynchrony."
    explanation: >-
      The defining audiological demonstration that CAPOS hearing loss spares the
      hair cells and localises to the auditory nerve.
  - reference: PMID:29305691
    reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor speech perception was observed, especially in noise, which was beyond the hearing level obtained in the pure tone audiograms in several of the patients presented here."
    explanation: >-
      Supports the auditory-neuropathy signature of speech perception worse than
      predicted by the pure-tone audiogram.
  - reference: PMID:34692702
    reference_title: "Auditory Neuropathy as the Initial Phenotype for Patients With ATP1A3 c.2452 G > A: Genotype-Phenotype Study and CI Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four subjects with AN were identified to share a de novo variant, p.E818K in the ATP1A3 gene."
    explanation: >-
      Independent cohort confirming the same variant as a cause of auditory
      neuropathy, including as the presenting phenotype.
  notes: >-
    This node is the reason CAPOS does NOT declare conforms_to against
    kb/modules/sensorineural_hair_cell_loss.yaml. That module's central effector
    is "Hair Cell Mechanotransduction Failure and Death"; CAPOS demonstrably
    preserves outer hair cell function, so asserting conformance would invert
    the module's mechanism. See the top-level notes for the full lump/split and
    conformance reasoning.
mechanistic_hypotheses:
- hypothesis_group_id: fever_triggered_pump_reserve_failure
  hypothesis_label: Fever exhausts a marginal neuronal alpha-3 pump reserve
  status: EMERGING
  description: >-
    Hypothesis: in a heterozygous p.Glu818Lys carrier the residual wild-type
    alpha-3 Na+/K+-ATPase provides just enough pumping capacity for baseline
    neuronal activity, and febrile illness raises metabolic and firing demand
    past that margin in the most pump-dependent neurons, producing acute failure
    of ion-gradient restoration and hence the stereotyped febrile
    ataxia/encephalopathy episode. This would explain why fever is a
    near-obligate trigger, why episodes are self-limited once the fever resolves,
    and why some deficit is nonetheless retained. It predicts that aggressive
    antipyresis should reduce episode frequency or severity, and that mutant
    pump function measured at febrile temperature should be disproportionately
    impaired relative to wild type.
  evidence:
  - reference: PMID:30409907
    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "which together with the reduced Na+ affinity of the cytoplasmic-facing sites precluded proper pump activation under physiological conditions"
    explanation: >-
      Establishes a marginal/failing pump at baseline physiological conditions,
      which is the premise of the reserve hypothesis; the study did not test
      febrile temperature, so this is PARTIAL support for the fever-specific
      claim.
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "that were consistently associated with febrile illness"
    explanation: >-
      Consistent clinical fever association supports the trigger relationship
      but does not itself establish the pump-reserve mechanism, hence PARTIAL.

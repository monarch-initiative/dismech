- name: Peripheral Reflex Arc Dysfunction
  biological_scale: TISSUE
  role: effector
  description: >-
    Generalized areflexia is one of the most penetrant CAPOS signs and can be
    the only detectable neurological abnormality in mildly affected carriers.
    Its substrate is unsettled: the original 1996 description explicitly noted
    areflexia in the absence of a demonstrable peripheral neuropathy, yet a
    sural nerve biopsy in one long-followed patient in the discovery cohort was
    consistent with a mild axonal neuropathy. Pes cavus, present in a minority
    of patients, is the chronic structural consequence usually attributed to
    long-standing intrinsic-versus-extrinsic foot muscle imbalance in this
    setting.

    modifier: DECREASED
  evidence:
  - reference: PMID:30409907
    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "which together with the reduced Na+ affinity of the cytoplasmic-facing sites precluded proper pump activation under physiological conditions"
    explanation: >-
      Failure of pump activation under physiological conditions is precisely the
      inability to restore ion gradients that this node asserts. Evidence source
      is IN_VITRO (heterologous expression electrophysiology).
  - reference: PMID:29305691
    reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we demonstrate for the first time evidence for auditory neuropathy in CAPOS syndrome, which may reflect impaired propagation of electrical impulses along the spiral ganglion neurons."
    explanation: >-
      Human audiological evidence that the CAPOS lesion in the auditory system
      is impaired impulse propagation in spiral ganglion neurons, one of the
      vulnerable cell types named in this node.
  notes: >-
    The cerebellar Purkinje cell, spiral ganglion neuron, retinal ganglion cell
    and dorsal root ganglion neuron are listed here as the anatomically implied
    substrates of the CAPOS lesion distribution (cerebellar ataxia, auditory
    neuropathy, optic atrophy, areflexia). Direct human cell-type-resolved
    demonstration of alpha-3 pump failure exists only for the spiral ganglion
    arm (auditory neuropathy electrophysiology); the other three are inferred
    from the clinical lesion pattern. See the
    capos_allelic_lesion_selectivity KNOWLEDGE_GAP discussion entry.
  downstream:
  - target: Febrile Illness Unmasking of Pump Reserve Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fever_triggered_pump_reserve_failure
- name: Febrile Illness Unmasking of Pump Reserve Failure
  role: trigger
  biological_scale: ORGANISM
  description: >-
    The mechanistic signature of CAPOS is that neurological decompensation is
    provoked, essentially without exception, by febrile illness; pregnancy and
    the immediate postpartum period are the one reported non-febrile trigger
    (see notes). The proposed mechanism is a reserve failure: a heterozygous
    carrier retains enough
    wild-type alpha-3 pump to meet baseline demand, but fever raises metabolic
    and firing demand on exactly the neurons whose pump reserve is already
    exhausted, tipping them into a state in which ion gradients cannot be
    maintained. This makes fever a mechanistically privileged trigger rather
    than a non-specific stressor, and it is the reason aggressive antipyresis is
    treated as disease-modifying rather than merely symptomatic. The trigger
    dependence also explains the episodic, punctuated natural history: patients
    typically have only one to three episodes in a lifetime, each aligned to a
    febrile illness.
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CAPOS syndrome presents in infancy or childhood (usually ages 6 months to 5 years) with cerebellar ataxia during or after a fever."
    explanation: >-
      GeneReviews defines the presentation as fever-associated cerebellar
      ataxia, establishing febrile illness as the defining trigger.
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The individuals presented here experienced one to three paroxysmal, short-lasting episodes in childhood with cerebellar symptoms and signs, hypotonia, ophthalmoparesis, motor weakness, areflexia, and/or lethargy that were consistently associated with febrile illness."
    explanation: >-
      Directly supports both the consistent febrile association and the
      characteristic low episode count.
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients typically present at an early age with an acute-onset fever-induced episode of ataxia frequently associated with encephalopathy and weakness."
    explanation: >-
      Systematic review confirms fever-induced onset as the typical CAPOS
      presentation.
  - reference: PMID:29090527
    reference_title: Novel pregnancy-triggered episodes of CAPOS syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "one of the affected individuals experienced markedly worsening features during her three pregnancies and in the immediate postpartum period, a potential element of the natural history of CAPOS previously unreported"
    explanation: >-
      A single p.Glu818Lys-confirmed pedigree reports pregnancy and the
      postpartum period as a non-febrile decompensation trigger, so the fever
      dependence modelled by this node is PARTIAL rather than absolute. This
      does not by itself establish a shared mechanism with the febrile trigger
      - it is a single-family observation - so the node's fever-reserve
      hypothesis is retained as the primary model with this as a documented
      exception rather than a competing hypothesis.
  notes: >-
    The reserve-failure interpretation of why fever specifically triggers CAPOS
    decompensation is a mechanistic hypothesis, not a demonstrated result; no
    study has measured alpha-3 pump function at febrile temperature in a
    patient-derived neuronal system. The clinical fever-episode association
    itself is well established. The hypothesis is registered under
    mechanistic_hypotheses as fever_triggered_pump_reserve_failure. This node is
    wired into the main pathograph (upstream: Impaired Neuronal Transmembrane
    Ion Gradient Restoration; downstream: Acute Febrile Encephalopathy and
    Cerebellar Decompensation) rather than left as a free-standing trigger.
    NON-FEBRILE TRIGGER. PMID:29090527 reports one p.Glu818Lys-confirmed
    individual whose ataxia, vision, and hearing worsened stepwise during all
    three pregnancies and the immediate postpartum period, with the authors
    recommending ATP1A3 testing be considered for cerebellar ataxia triggered
    by "febrile illness, or pregnancy and delivery". This is a single family,
    so it is curated as a caveat on this node (PARTIAL evidence above) rather
    than as a second trigger node - there is no independent pregnancy-cohort
    replication and no proposed mechanism distinguishing it from a
    physiological-stress variant of the same pump-reserve failure.
  downstream:
  - target: Acute Febrile Encephalopathy and Cerebellar Decompensation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fever_triggered_pump_reserve_failure
- name: Acute Febrile Encephalopathy and Cerebellar Decompensation
  role: effector
  biological_scale: ORGANISM
  description: >-
    The acute episode is a combined encephalopathy and cerebellar syndrome:
    hypotonia and flaccidity, nystagmus and strabismus, ophthalmoparesis,
    dysarthria or anarthria, motor weakness, lethargy, and in severe cases loss
    of consciousness or coma. It is this acute phase, not a chronic
    degenerative process, that carries the clinical risk and that is the target
    of acute management. It is the node that generates the acute-episode
    phenotypes curated below (Encephalopathy, Hypotonia, Nystagmus, Strabismus,
    Ophthalmoparesis, Dysarthria, Lethargy, Episodic ataxia).
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The acute febrile encephalopathy may include hypotonia, flaccidity, nystagmus, strabismus, dysarthria/anarthria, lethargy, loss of consciousness, and even coma."
    explanation: >-
      Enumerates the components of the acute decompensation event modelled by
      this node.
  downstream:
  - target: Incomplete Recovery and Stepwise Deficit Accrual
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Incomplete Recovery and Stepwise Deficit Accrual
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    This is the node that makes CAPOS mechanistically distinctive. After each
    febrile episode the patient recovers considerably over days to weeks, but
    not completely: a residuum of ataxia and of the other cardinal deficits
    persists. Because episodes are few, the natural history is better described
    as stepwise than as a steady slope - though the cited sources establish
    incomplete recovery and slow subsequent progression rather than a formally
    quantified step function. Modelling this as its own node separates the
    reversible acute physiology (which antipyresis and trigger avoidance can
    address) from the irreversible accrued deficit (which they cannot).
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Usually, considerable recovery occurs within days to weeks; however, persistence of some degree of ataxia and other manifestations is typical."
    explanation: >-
      Directly supports the incomplete-recovery pattern that defines this node.
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They usually present one to three episodes. The acute symptoms improve within days, but most patients show slow progression afterward."
    explanation: >-
      Supports both the small episode count and the residual slow progression
      that together produce the stepwise course.
  downstream:
  - target: Persistent Multimodal Neurological Deficit
    causal_link_type: DIRECT
  - target: Auditory Neuropathy with Preserved Outer Hair Cell Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Persistent Multimodal Neurological Deficit
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The accrued residuum is the CAPOS acronym itself: persistent cerebellar
    ataxia, generalised areflexia, pes cavus foot deformity, optic atrophy with
    visual impairment, and auditory-neuropathy-type sensorineural hearing loss.
    The peripheral components (areflexia, pes cavus) reflect the dorsal root
    ganglion and peripheral sensory involvement that separates CAPOS from the
    purely central allelic ATP1A3 phenotypes. This node generates the persistent
    phenotypes curated below (Cerebellar ataxia, Areflexia, Pes cavus, Optic
    atrophy).

diagnosis:
- name: ATP1A3 targeted sequencing after a fever-induced ataxia episode
  description: >-
    Because CAPOS is genetically homogeneous for c.2452G>A, targeted ATP1A3
    sequencing is a high-yield first-line molecular test in the right clinical
    context: a child with paroxysmal fever-induced ataxia, or an adult with a
    stationary or slowly progressive childhood-onset cerebellar syndrome
    combined with areflexia, pes cavus, visual impairment and/or sensorineural
    hearing loss.
  presence: >-
    Detection of a heterozygous ATP1A3 c.2452G>A (p.Glu818Lys) variant confirms
    the diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted sequencing of the ATP1A3 gene is recommended in children exhibiting paroxysmal, fever-induced ataxia and in adults with a more or less stationary or slowly progressive cerebellar syndrome since childhood accompanied by mixed combinations of areflexia, pes cavus, profound visual impairment, and/or sensorineural hearing loss."
    explanation: >-
      An explicit recommendation for targeted ATP1A3 sequencing in exactly the
      two clinical scenarios described by this diagnostic entry.
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ATP1A3-related disorder is established in a proband with suggestive findings and a heterozygous pathogenic variant in ATP1A3 identified by molecular genetic testing."
    explanation: >-
      GeneReviews defines the clinical-plus-molecular diagnostic standard for
      the ATP1A3-related disorder spectrum, including CAPOS.
- name: Audiological testing for auditory neuropathy (OAE/CM with ABR)
  description: >-
    Otoacoustic emissions and cochlear microphonic testing paired with auditory
    brainstem response testing is the diagnostic manoeuvre that identifies the
    CAPOS hearing loss as an auditory neuropathy: preserved OAE/CM with grossly
    abnormal ABR. This is not just a phenotyping detail - it directs
    rehabilitation away from conventional hearing aids and is why speech
    perception must be assessed separately from the pure-tone audiogram.
  presence: >-
    Preserved otoacoustic emissions and cochlear microphonic potentials with
    grossly abnormal auditory brainstem responses.
  diagnosis_term:
    preferred_term: evoked response audiometry (OAE/CM plus ABR)
    term:
      id: NCIT:C85857
      label: Evoked Response Audiometry
  evidence:
  - reference: PMID:29305691
    reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this retrospective analysis of audiological data, we show for the first time that cochlear outer hair cell activity was preserved as shown by the presence of otoacoustic emissions and cochlear microphonic potentials, but the auditory brainstem responses were grossly abnormal, likely reflecting neural dyssynchrony."
    explanation: >-
      Defines the exact audiological test combination and result pattern that
      establishes auditory neuropathy in CAPOS.
  - reference: PMID:29305691
    reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This has implications for diagnosis and patient management."
    explanation: >-
      The authors themselves frame the auditory neuropathy finding as
      diagnostically and managerially consequential.
- name: Brain MRI to assess cerebellar structure
  description: >-
    Brain MRI is used to exclude alternative causes of acute childhood ataxia
    (acute disseminated encephalomyelitis, posterior fossa tumour, stroke) and
    to document any cerebellar atrophy. MRI findings in CAPOS are variable and
    frequently unremarkable; mild cerebellar atrophy has been reported. A normal
    MRI does not argue against the diagnosis.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:36484864
    reference_title: "ATP1A3-related phenotypes in Chinese children: AHC, CAPOS, and RECA."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the brain MRI indicated mild cerebellar atrophy"
    explanation: >-
      A single CAPOS patient in a cohort study showed mild cerebellar atrophy;
      support is PARTIAL because this is one case and MRI findings across
      reported CAPOS patients are inconsistent.
- name: Baseline and periodic electrocardiography
  description: >-
    A resting 12-lead ECG at diagnosis, and on identification of an at-risk
    relative by cascade testing, is warranted because ATP1A3-related disorders
    carry cardiac conduction abnormalities alongside the neurological phenotype.
    GeneReviews explicitly frames clarification of the genetic status of at-risk
    relatives as the step that identifies who should be evaluated for cardiac
    conduction abnormalities, and the multicentre cardiac cohort found resting
    ECG abnormalities in two of its three CAPOS patients. This is an
    ATP1A3-spectrum recommendation: no CAPOS-specific surveillance interval has
    been published, so none is stated here.
  presence: >-
    Resting ECG abnormalities, including conduction delay, in a majority of the
    small published CAPOS cardiac series.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:32913013
    reference_title: "Cardiac phenotype in ATP1A3-related syndromes: A multicenter cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resting ECG abnormalities were found in 52 of 87 (60%) with AHC, 2 of 3 (67%) with CAPOS, and 6 of 9 (67%) with RDP."
    explanation: >-
      Establishes that resting ECG is informative in CAPOS, in the only
      systematic cardiac study of the ATP1A3 spectrum.
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clarification of the genetic status of apparently asymptomatic older and younger at-risk relatives is appropriate to identify as early as possible those who should be evaluated for cardiac conduction abnormalities"
    explanation: >-
      GeneReviews ties cascade genetic testing to cardiac evaluation. The
      statement is made for ATP1A3-related disorder as a whole, of which CAPOS
      is one of the four named phenotypes, rather than for CAPOS specifically.
differential_diagnoses:
- name: Alternating hemiplegia of childhood
  disease_term:
    preferred_term: alternating hemiplegia of childhood
    term:
      id: MONDO:0016241
      label: alternating hemiplegia of childhood
  description: >-
    The best-known allelic ATP1A3 disorder and the most important entity to keep
    distinct from CAPOS. AHC is defined by recurrent paroxysmal hemiplegic
    episodes beginning before 18 months with remission during sleep, and it does
    not encompass the hearing or visual impairment that define CAPOS. AHC is
    also usually de novo and caused by a different, heterogeneous set of ATP1A3
    variants (D801N, E815K, G947R predominating), not by p.Glu818Lys. Note the
    E815K/E818K near-collision in residue numbering - a named-entity-confusion
    trap when reading the ATP1A3 literature.
  evidence:
  - reference: PMID:29305691
    reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Allelic mutations cause the neurological diseases rapid dystonia Parkinsonism and alternating hemiplegia of childhood, disorders which do not encompass hearing or visual impairment."
    explanation: >-
      States the discriminating feature: the allelic disorders lack the hearing
      and visual impairment that define CAPOS.
- name: Rapid-onset dystonia-parkinsonism
  disease_term:
    preferred_term: rapid-onset dystonia-parkinsonism
    term:
      id: MONDO:0007496
      label: dystonia 12
  description: >-
    The third classical ATP1A3 phenotype (DYT12). Presents from 18 months to
    adulthood with abrupt-onset, usually stress-triggered, bulbar-predominant
    generalised dystonia and parkinsonism. Like AHC it lacks the CAPOS
    sensory-organ involvement, and the movement-disorder predominance is
    extrapyramidal rather than cerebellar.
  evidence:
  - reference: PMID:25895915
    reference_title: "CAOS-Episodic Cerebellar Ataxia, Areflexia, Optic Atrophy, and Sensorineural Hearing Loss: A Third Allelic Disorder of the ATP1A3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation in the family described here differs categorically from these diseases in age of onset, clinical course, cerebellar over extrapyramidal movement disorder predominance, and peripheral nervous system involvement."
    explanation: >-
      Explicitly contrasts CAPOS with rapid-onset dystonia-parkinsonism and AHC
      on age of onset, course, cerebellar-versus-extrapyramidal predominance and
      peripheral involvement.
- name: Relapsing encephalopathy with cerebellar ataxia (RECA/FIPWE)
  description: >-
    The closest CAPOS mimic and the hardest differential, because RECA/FIPWE is
    also an ATP1A3 disorder defined by fever-induced episodes of ataxia and
    encephalopathy in early childhood. RECA is associated with variants at
    ATP1A3 residue Arg756, not Glu818, and lacks the fixed optic atrophy,
    auditory neuropathy, areflexia and pes cavus that make up the CAPOS
    residuum. Molecular testing, not the acute episode phenotype, separates them.
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RECA/FIPWE primarily presents with fever-induced episodes (infancy to age 5 years); however, first episodes can occur occasionally in young adults during illnesses such as mononucleosis."
    explanation: >-
      Establishes RECA/FIPWE as a separately named fever-induced ATP1A3
      phenotype overlapping the CAPOS acute presentation window.
- name: Acute post-infectious cerebellar ataxia
  disease_term:
    preferred_term: acute post-infectious cerebellar ataxia
    term:
      id: MONDO:0850107
      label: postinfectious cerebellitis
  description: >-
    The commonest cause of acute ataxia after a febrile illness in a young
    child, and the diagnosis CAPOS is most often mistaken for at first
    presentation. It is typically monophasic with full recovery and no
    accompanying optic atrophy, hearing loss, areflexia or pes cavus. The
    presence of any of the fixed CAPOS features, or a second episode, or an
    affected parent, should prompt ATP1A3 testing.
  evidence:
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted sequencing of the ATP1A3 gene is recommended in children exhibiting paroxysmal, fever-induced ataxia"
    explanation: >-
      Supports the recommendation to test ATP1A3 in the fever-induced childhood
      ataxia population, i.e. the population that otherwise receives an acute
      post-infectious cerebellar ataxia label. Support is PARTIAL because the
      source does not itself contrast the two entities.
treatments:
- name: Aggressive fever management and febrile-trigger avoidance
  description: >-
    Because febrile illness is the near-obligate trigger for the episodes that
    accrue permanent deficit, early and aggressive antipyresis during
    intercurrent illness, prompt treatment of infections, and general avoidance
    of the physical, environmental and metabolic stressors known to provoke
    ATP1A3-related episodes are treated as preventive rather than merely
    symptomatic measures. This is the one intervention that is directly
    mechanism-linked in CAPOS. Its efficacy in reducing episode frequency has
    not been formally trialled - the rationale is mechanistic plus the
    consistency of the fever association.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Febrile Illness Unmasking of Pump Reserve Failure
    treatment_effect: INHIBITS
    description: >-
      Antipyresis and trigger avoidance act on the febrile-unmasking node itself,
      upstream of the acute decompensation and therefore upstream of the
      irreversible stepwise deficit accrual.
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals who are heterozygous for an ATP1A3 pathogenic variant should avoid the known triggers for manifestations and/or episodes"
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid recommendation, the
      authoritative source for trigger avoidance in ATP1A3-related disorder.
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that both siblings were assessed before the first acute-onset episode contributes to the description of early symptoms and signs of the disease, which could aid early diagnosis and management before the onset of acute episodes."
    explanation: >-
      Supports the value of pre-episode identification so that trigger
      management can be instituted; PARTIAL because the source describes the
      opportunity rather than demonstrating benefit.
- name: Acetazolamide episode prophylaxis
  description: >-
    Acetazolamide, borrowed from the episodic ataxias, has been tried as
    prophylaxis against CAPOS episodes. The evidence is genuinely conflicting
    and should not be presented as established: two patients in one series had
    no further episodes after starting acetazolamide, while a separate cohort
    reported no fluctuation benefit in its CAPOS patient. The originating
    authors themselves say further study is required.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetazolamide
      term:
        id: CHEBI:27690
        label: acetazolamide
  evidence:
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "After initiation of acetazolamide in two patients, no further episodes occurred."
    explanation: >-
      Uncontrolled observation in two patients; PARTIAL because episodes are
      naturally infrequent (one to three per lifetime) so absence of further
      episodes is weak evidence of benefit.
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "acetazolamide may be considered in patients with CAPOS syndrome to prevent or attenuate bouts of ataxia, but this requires further study."
    explanation: >-
      The authors explicitly flag the recommendation as tentative and requiring
      further study.
  - reference: PMID:36484864
    reference_title: "ATP1A3-related phenotypes in Chinese children: AHC, CAPOS, and RECA."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No fluctuation was noted after using Acetazolamide."
    explanation: >-
      A separate cohort's CAPOS patient showed no response to acetazolamide,
      directly counterbalancing the positive series and justifying the
      conflicting-evidence framing.
- name: Cochlear implantation for auditory neuropathy
  description: >-
    Conventional hearing aids perform poorly in CAPOS because the lesion is
    neural dyssynchrony rather than loss of cochlear amplification. A cochlear
    implant is the rehabilitative option, but outcomes reported to date are
    inconsistent: one series reported preliminary speech-perception improvement
    and another reported a poor result in an implanted p.E818K patient. Counsel
    accordingly rather than promising benefit. therapeutic_modality is DEVICE
    because the therapy is an implanted prosthesis; the treatment_term records
    the surgical action by which it is delivered, since NCIT's Cochlear Implant
    concept (NCIT:C157820) is a Medical Device and is therefore not reachable
    from the Clinical Intervention or Procedure root that treatment_term is
    bound to.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:29305691
    reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Auditory neuropathy is difficult to treat with conventional hearing aids, but preliminary improvement in speech perception in some patients suggests that cochlear implantation may be effective in CAPOS patients."
    explanation: >-
      Supports the poor performance of conventional amplification and offers
      preliminary, explicitly hedged support for cochlear implantation.
  - reference: PMID:34692702
    reference_title: "Auditory Neuropathy as the Initial Phenotype for Patients With ATP1A3 c.2452 G > A: Genotype-Phenotype Study and CI Management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient 2 underwent CI on his left ear, and the result was poor."
    explanation: >-
      Documents a poor cochlear implantation outcome in a genotype-confirmed
      p.E818K patient, the counterweight to the optimistic report.
  - reference: PMID:34692702
    reference_title: "Auditory Neuropathy as the Initial Phenotype for Patients With ATP1A3 c.2452 G > A: Genotype-Phenotype Study and CI Management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study further demonstrates the significance of genetic testing for this specific mutation for identifying the special subtype of AN with somewhat favorable CI outcome"
    explanation: >-
      The same study nonetheless concludes the genotype identifies an auditory
      neuropathy subtype with a somewhat favourable implantation outcome,
      capturing the genuine uncertainty in the field.
  - reference: PMID:29184165
    reference_title: "ATP1A3 mutations can cause progressive auditory neuropathy: a new gene of auditory synaptopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on this, cochlear implantation (CI) was performed in the first proband, leading to remarkable benefits."
    explanation: >-
      A third, independent p.Glu818Lys-confirmed case with a favourable CI
      outcome, adding to the optimistic side of the mixed evidence base. Rated
      PARTIAL because the proband presented with isolated progressive auditory
      neuropathy and only subclinical areflexia rather than full CAPOS, so the
      outcome is not confirmed in a syndromic CAPOS patient.
- name: Multidisciplinary supportive and rehabilitative care
  description: >-
    There is no disease-modifying therapy for CAPOS. Management is supportive
    and multidisciplinary: physical therapy and mobility support for ataxia and
    pes cavus, low-vision support for optic atrophy, speech and language
    therapy for dysarthria, and orthopaedic assessment of the foot deformity,
    coordinated across neurology, ophthalmology, audiology, rehabilitation and
    genetics.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for ATP1A3-related disorder. Supportive treatment to improve quality of life, maximize function, and reduce complications is recommended."
    explanation: >-
      GeneReviews establishes supportive care as the standard of management for
      ATP1A3-related disorder including CAPOS.
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This ideally involves multidisciplinary care by specialists in neurology, developmental pediatrics, orthopedics, physical medicine and rehabilitation, speech-language therapy, psychology, mental health, ophthalmology, social work, and medical genetics."
    explanation: >-
      Specifies the multidisciplinary composition of supportive care recommended
      by GeneReviews.
- name: Genetic counselling and predictive testing
  description: >-
    Autosomal dominant transmission with a 50% recurrence risk per child, and a
    roughly even split between inherited and de novo variants, make genetic
    counselling central. Parental testing is important because a mildly affected
    parent may be recognised only after the child is diagnosed - several
    published families were ascertained this way. Once the familial variant is
    known, predictive and prenatal/preimplantation testing are possible.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with ATP1A3-related disorder has a 50% chance of inheriting the pathogenic variant. Once the ATP1A3 pathogenic variant has been identified in an affected family member, predictive testing for at-risk relatives and prenatal/preimplantation genetic testing are possible."
    explanation: >-
      Establishes the recurrence risk and the availability of predictive and
      prenatal testing that this counselling entry describes.
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe three new patients, a woman and her two sons diagnosed with CAPOS syndrome."
    explanation: >-
      Illustrates the multigenerational ascertainment pattern (affected mother
      plus two affected sons) that makes family-wide evaluation important.
definitions:
- name: Fever-associated acute ataxia case-finding query for undiagnosed CAPOS
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: MECHANISTIC_HYPOTHESIS
  validation_status:
    status: PROPOSED
    rationale: >-
      No published computable phenotype exists for CAPOS and none has been
      evaluated against a genotyped gold standard. The query is proposed here on
      the basis of the fever-triggered pump-reserve-failure hypothesis: if fever
      is the mechanistically privileged trigger, then the EHR signature of an
      undiagnosed CAPOS carrier is an acute ataxia or acute encephalopathy
      encounter temporally locked to a documented febrile illness in a young
      child, with subsequent coded optic atrophy, sensorineural hearing loss or
      areflexia. Expected yield is very low in absolute terms given the disease's
      rarity, so validation would need a genotype-linked biobank of substantial
      size (All of Us, UK Biobank, eMERGE) and would most usefully be run as an
      ATP1A3-spectrum query rather than a CAPOS-specific one.
  attaches_to:
  - pathophysiology#Febrile Illness Unmasking of Pump Reserve Failure
  - pathophysiology#Incomplete Recovery and Stepwise Deficit Accrual
  description: >-
    EHR/OMOP case-finding query: identify children with an acute ataxia or acute
    encephalopathy encounter occurring during or immediately after a documented
    febrile illness, who subsequently acquire codes for optic atrophy,
    sensorineural hearing loss or areflexia, as candidates for undiagnosed
    ATP1A3 p.Glu818Lys CAPOS warranting targeted sequencing. The discriminating
    feature versus the far commoner acute post-infectious cerebellar ataxia is
    the later accrual of fixed sensory-organ deficits rather than full recovery.
    Directly analogous in structure to the Brugada_Syndrome fever-unmasking
    query, but with derivation_basis MECHANISTIC_HYPOTHESIS rather than
    ESTABLISHED_CRITERIA because the fever-to-decompensation mechanism in CAPOS
    is hypothesised (pump reserve failure) rather than demonstrated.
  scope: >-
    EHR/OMOP case-finding for undiagnosed CAPOS/ATP1A3-spectrum carriers;
    predicated on the unvalidated fever_triggered_pump_reserve_failure
    hypothesis.
  criteria_sets:
  - name: Fever-locked acute ataxia with later fixed sensory-organ deficit
    description: >-
      An acute ataxia or acute encephalopathy encounter in a child aged roughly
      6 months to 5 years, temporally coincident with a documented febrile
      illness, followed at any later time by a code for optic atrophy,
      sensorineural hearing loss or areflexia.
    inclusion_criteria:
    - preferred_term: Documented febrile illness
      description: Fever or febrile-illness diagnosis code serving as the index exposure.
    - preferred_term: Acute ataxia or acute encephalopathy encounter
      description: >-
        Acute-onset ataxia or encephalopathy coded during or within days of the
        febrile episode.
    - preferred_term: Later fixed sensory-organ or reflex deficit
      description: >-
        A subsequent code for optic atrophy, sensorineural hearing loss, or
        areflexia, marking incomplete recovery rather than the monophasic full
        recovery of post-infectious cerebellar ataxia.
    exclusion_criteria:
    - preferred_term: Established alternative cause of acute ataxia
      description: >-
        Posterior fossa tumour, stroke, acute disseminated encephalomyelitis,
        intoxication, or an already-established ATP1A3 or other genetic
        diagnosis.
  evidence:
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted sequencing of the ATP1A3 gene is recommended in children exhibiting paroxysmal, fever-induced ataxia and in adults with a more or less stationary or slowly progressive cerebellar syndrome since childhood accompanied by mixed combinations of areflexia, pes cavus, profound visual impairment, and/or sensorineural hearing loss."
    explanation: >-
      Supplies the clinical logic the query operationalises: fever-induced
      ataxia plus fixed sensory-organ deficits should trigger ATP1A3 testing.
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The acute symptoms improve within days, but most patients show slow progression afterward."
    explanation: >-
      Supports the discriminating element of the query - incomplete recovery
      with later accrual of deficit - versus monophasic post-infectious ataxia.
  notes: >-
    Counterpart to the Brugada_Syndrome fever-unmasking query
    (ESTABLISHED_CRITERIA) and the Timothy_Syndrome fever_exacerbated_cav1.2
    query (MECHANISTIC_HYPOTHESIS). CAPOS sits with Timothy: the fever
    association is clinically certain but the mechanism by which fever
    precipitates decompensation is hypothesised, and the computable phenotype
    itself is untested. See docs/hypothesis-based-phenotype-algorithms.md.
discussions:
- discussion_id: capos_degeneration_vs_dysfunction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the persistent deficit in CAPOS reflect actual neuronal loss
    (degeneration) or persistent functional impairment of surviving neurons?
  attaches_to:
  - pathophysiology#Incomplete Recovery and Stepwise Deficit Accrual
  rationale: >-
    This is the central unresolved mechanistic question in CAPOS and it
    determines whether the disorder belongs with the neurodegenerations at all.
    The clinical picture - stepwise accrual of fixed deficit after discrete
    febrile events, with considerable interval recovery - is equally compatible
    with (a) each episode killing a tranche of vulnerable neurons, or (b) each
    episode leaving surviving neurons in a persistently deranged but living
    state. Neuroimaging does not settle it: MRI is frequently unremarkable and
    only mild cerebellar atrophy has been reported, in isolated cases. No
    neuropathological study of a CAPOS brain has been published, and no
    longitudinal quantitative imaging cohort exists. The answer has direct
    therapeutic consequences, because a functional lesion is in principle
    reversible while neuronal loss is not. This gap is also the reason CAPOS
    does not declare conformance to the cerebellar_purkinje_degeneration module.
  proposed_experiments:
  - experiment_id: capos_longitudinal_structural_imaging
    name: Longitudinal cerebellar volumetry and retinal OCT around febrile episodes
    description: >-
      Longitudinal volumetric MRI of the cerebellum and quantitative optical
      coherence tomography of the retinal nerve fibre layer in genotyped CAPOS
      patients, timed around febrile episodes, to test whether fixed structural
      loss accrues stepwise at each episode.
    would_support:
    - >-
      Stepwise loss of cerebellar volume and retinal nerve fibre layer thickness
      time-locked to episodes would support true neuronal loss.
    would_refute:
    - >-
      Stable structural measures despite accrued clinical deficit would support
      persistent functional impairment of surviving neurons.
  - experiment_id: capos_ipsc_febrile_challenge
    name: Patient-derived iPSC neuron febrile-temperature challenge
    description: >-
      Patient-derived iPSC neurons (cerebellar and sensory) carrying
      p.Glu818Lys, challenged at febrile temperature, assayed for both acute
      ion-gradient failure and subsequent cell death versus persistent
      functional derangement in survivors.
    would_support:
    - >-
      Measurable cell death after febrile-temperature challenge would support
      the degeneration model.
    would_refute:
    - >-
      Survival with persistent electrophysiological derangement and no excess
      death would support the functional-impairment model.
  evidence:
  - reference: PMID:36484864
    reference_title: "ATP1A3-related phenotypes in Chinese children: AHC, CAPOS, and RECA."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the brain MRI indicated mild cerebellar atrophy"
    explanation: >-
      The only structural evidence bearing on the question is a single case with
      mild cerebellar atrophy, which is insufficient to establish or exclude
      neurodegeneration.
- discussion_id: capos_allelic_lesion_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the single recurrent p.Glu818Lys allele produce the specific CAPOS
    lesion set (cerebellum, auditory nerve, optic nerve, dorsal root ganglion)
    while other ATP1A3 alleles in the same gene produce entirely different
    lesion sets?
  attaches_to:
  - pathophysiology#Impaired Neuronal Transmembrane Ion Gradient Restoration
  rationale: >-
    ATP1A3 is expressed broadly across neurons, yet allelic variants partition
    into strikingly discrete syndromes: p.Glu818Lys gives CAPOS with sensory
    organ and peripheral involvement, Arg756 variants give RECA, and a different
    heterogeneous set gives AHC or rapid-onset dystonia-parkinsonism. The
    biophysical characterisation of E818K explains that the pump fails, but not
    why the failure selects cerebellar, auditory, optic and dorsal root ganglion
    neurons specifically. Candidate explanations - regional differences in
    alpha-3 dependence, in firing rate and metabolic load, in compensating
    alpha-1 expression, or in the specific kinetic parameter each variant
    perturbs - have not been tested against each other. Resolving this would
    turn ATP1A3 genotype-phenotype correlation from empirical pattern-matching
    into prediction.
  proposed_experiments:
  - experiment_id: capos_celltype_pump_dependence
    name: Cell-type-resolved alpha-3 pump dependence profiling
    description: >-
      Cell-type-resolved measurement of alpha-3 versus alpha-1 pump dependence
      and firing-rate-dependent sodium load across cerebellar Purkinje, spiral
      ganglion, retinal ganglion and dorsal root ganglion neurons, correlated
      with each variant's specific kinetic defect.
    would_support:
    - >-
      A match between the CAPOS lesion set and the neurons with highest alpha-3
      dependence and lowest alpha-1 compensation would support a
      dependence-based selectivity model.
  - experiment_id: capos_comparative_variant_electrophysiology
    name: Head-to-head electrophysiology of E818K, R756H and AHC variants
    description: >-
      Comparative electrophysiological profiling of E818K, R756H and the common
      AHC variants in a single common expression system, testing whether the
      distinct clinical lesion sets track distinct kinetic signatures rather
      than overall pump activity.
    would_support:
    - >-
      Variant-specific kinetic signatures that predict the clinical lesion set
      would support parameter-specific rather than dose-dependent selectivity.
  evidence:
  - reference: PMID:36192182
    reference_title: The Phenotypic Continuum of ATP1A3-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common variants are associated with well-defined phenotypes, while more rare variants often result in very rare symptom correlations, such as are seen in our study."
    explanation: >-
      Documents the variant-specific phenotype partitioning that this knowledge
      gap asks the mechanism for.
- discussion_id: capos_invitro_febrile_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do heterologous-expression measurements of E818K pump kinetics, made at
    standard assay temperature in oocytes and cell lines, predict alpha-3 pump
    behaviour in human neurons at febrile temperature?
  attaches_to:
  - pathophysiology#Febrile Illness Unmasking of Pump Reserve Failure
  rationale: >-
    The entire mechanistic case for CAPOS rests on heterologous-expression
    electrophysiology and biochemistry: reduced sodium affinity, accelerated
    E1P-to-E2P transition, weakened voltage dependence, and failure of pump
    activation under "physiological conditions". But those conditions are the
    assay's physiological conditions, not a febrile human neuron's. The
    fever-trigger phenomenon - the single most characteristic clinical fact
    about CAPOS - has never been reproduced in any model system, and no study
    has measured mutant pump function across the normothermic-to-febrile
    temperature range. This is not an absence of evidence but a translational
    validity gap: strong in-vitro evidence exists, and its applicability to the
    defining in-vivo phenomenon is the open question.
  proposed_experiments:
  - experiment_id: capos_temperature_ramp_electrophysiology
    name: E818K pump characterisation across the febrile temperature range
    description: >-
      Repeat the E818K two-electrode voltage-clamp and biochemical
      characterisation across a 37 to 41 degrees Celsius range to test whether
      the mutant pump's deficit is disproportionately temperature-sensitive
      relative to wild type.
    would_support:
    - >-
      Disproportionate loss of mutant pump activity as temperature rises would
      support the fever-unmasking reserve-failure hypothesis.
    would_refute:
    - >-
      Parallel temperature responses in mutant and wild type would argue the
      fever trigger acts through some other route, such as systemic metabolic
      or inflammatory demand.
  - experiment_id: capos_knockin_fever_challenge
    name: E818K knock-in animal model fever challenge
    description: >-
      Establish a knock-in animal model carrying the orthologous E818K allele
      and test whether experimentally induced fever provokes an acute ataxic
      episode with incomplete recovery, which would be the first in-vivo
      recapitulation of the CAPOS trigger.
    would_support:
    - >-
      Fever-provoked ataxia with incomplete recovery in the knock-in would
      establish in-vivo validity of the mechanism.
    would_refute:
    - >-
      Absence of any fever-provoked phenotype despite the orthologous allele
      would indicate a human-specific determinant not captured by the model.
  evidence:
  - reference: PMID:30409907
    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Here, using biochemical and electrophysiological approaches, we examined the functional characteristics of E818K, as well as of E818Q and E818A mutants."
    explanation: >-
      Confirms the mechanistic evidence base is biochemical and
      heterologous-expression electrophysiology, establishing the model system
      whose translational validity at febrile temperature is unresolved.
references:
- reference: PMID:20301294
  title: "ATP1A3-Related Disorder."
  tags:
  - GeneReviews
notes: >-
  LUMP-VS-SPLIT REASONING. CAPOS is curated as its own dismech entry rather than
  being folded into an ATP1A3-related disorder umbrella, and rather than being
  merged with the existing Alternating_Hemiplegia_of_Childhood entry, for three
  reasons. (1) Genotype: CAPOS is essentially monoallelic - every reported
  patient carries c.2452G>A p.Glu818Lys - whereas AHC and rapid-onset
  dystonia-parkinsonism arise from large heterogeneous variant sets. (2)
  Phenotype: the original CAOS report states that CAPOS "differs categorically"
  from the allelic disorders in age of onset, clinical course, cerebellar over
  extrapyramidal movement disorder predominance, and peripheral nervous system
  involvement; the sensory-organ involvement (optic atrophy, auditory
  neuropathy) is explicitly absent from AHC and RDP. (3) Mechanism: the
  fever-triggered, stepwise, incompletely-reversible decompensation pattern is
  the mechanistic signature modelled in the pathophysiology chain here and is
  not shared with AHC's sleep-remitting hemiplegic attacks. Counterweight, kept
  visible rather than suppressed: GeneReviews states these phenotypes "exist on
  a spectrum and should be regarded as classifications of convenience", and the
  phenotypic-continuum literature shows many ATP1A3 patients do not fit any
  named syndrome. The split is therefore a pragmatic curation decision at the
  level of a well-defined recurrent-allele syndrome, not a claim that the
  ATP1A3 phenotypes are biologically discontinuous. A future
  ATP1A3_Related_Disorders grouping in kb/groupings/ (grouping_basis
  SHARED_GENE_FAMILY plus SHARED_MECHANISM) would be the right structure to
  express both the split entries and their continuity; it is not created here.

  MODULE CONFORMANCE - deliberately declined for both candidate modules.
  (a) sensorineural_hair_cell_loss: NOT declared. That module's chain runs
  through "Hair Cell Mechanotransduction Failure and Death" as its central
  effector, with spiral ganglion degeneration as a downstream consequence of
  hair cell loss and lost endocochlear amplification. CAPOS inverts this: outer
  hair cell activity is demonstrably preserved (otoacoustic emissions and
  cochlear microphonic potentials intact) and the lesion is primary neural
  dyssynchrony in the auditory nerve. Declaring conformance would assert a
  mechanism the CAPOS evidence specifically excludes. The Auditory Neuropathy
  with Preserved Outer Hair Cell Function node captures the true mechanism
  instead. (b) cerebellar_purkinje_degeneration: NOT declared. That module's
  central effector is "Purkinje Neuron Degeneration" - apoptotic neuronal loss
  with cerebellar atrophy and gliosis - reached via calcium and proteostasis
  dysregulation. CAPOS has no published neuropathology, MRI is frequently
  unremarkable, and the only reported structural change is mild cerebellar
  atrophy in a single case; the ataxia is episodic and substantially reversible
  within each episode, which is not the module's degenerative phenotype. Whether
  CAPOS eventually qualifies is exactly the capos_degeneration_vs_dysfunction
  KNOWLEDGE_GAP discussion above; conformance should be revisited if neuronal
  loss is demonstrated.

  PATHOGRAPH SHAPE. The pathophysiology graph is a single connected component
  with no orphan nodes: pump dysfunction to impaired ion-gradient restoration to
  febrile unmasking to acute decompensation to incomplete recovery, which then
  branches to the persistent multimodal deficit and to the auditory neuropathy
  node. Every curated phenotype names the node that generates it in its
  description; the only phenotype not tied to a node is Dystonia, which the
  source itself reports only as a "possibly related" sequela and which is
  therefore recorded with PARTIAL support rather than wired into the graph.

  DEEP RESEARCH. The initial curation was built directly from primary
  literature identified via NCBI E-utilities PubMed search, with the
  GeneReviews ATP1A3-Related Disorder chapter (PMID:20301294) as the mandatory
  phenotype baseline, because `just research-disorder` exits non-zero when the
  target disorder file does not yet exist in kb/disorders/. That deviation has
  now been closed: `just research-disorder claude_code CAPOS_Syndrome` was
  re-run on 2026-08-01 once the file existed, completed successfully, and its
  artifact is committed as
  research/CAPOS_Syndrome-deep-research-claude_code.md plus its .citations.md
  sidecar. The chicken-and-egg failure is therefore a workflow-ordering bug in
  the recipe, not a provider failure.

  DEEP RESEARCH CROSS-CHECK - what was taken and what was refused. The report
  was treated as leads, not ground truth. Filled from it: Abnormal EKG
  (HP:0003115) with the CAPOS-specific 2/3 resting-ECG figure and the
  channelopathy-equivalent risk statement from the multicentre cardiac cohort
  PMID:32913013, plus a matching baseline-electrocardiography diagnosis entry;
  hemiplegic migraine (PMID:26453127); and confirmation of the frequency
  arithmetic independently derived here from the Demos Table 1 rows. Refused:
  (a) the report proposes HP:0031815 as "Auditory neuropathy" - HP:0031815 is
  actually *Abnormal oral physiology*, verified with OAK, and was discarded;
  (b) the report proposes HP:0002083 for migraine with aura - HP:0002083 is
  actually *Migraine without aura*; (c) quotations the report marked [P]
  (possibly paraphrased through a summarising fetch layer) were not used at
  all - every snippet in this entry is verbatim against a cached reference.

  AUDITORY NEUROPATHY HAS NO HPO TERM. Searched 2026-08-01 with OAK against
  sqlite:obo:hp: `t~auditory neuropathy`, `t~auditory synaptopathy`,
  `t~dyssynchrony`, `l^Auditory`, `l~cochlear nerve`, and `t~neuropathy`
  filtered for auditory/cochlear/acoustic/eighth. No class for auditory
  neuropathy or auditory neuropathy spectrum disorder exists. Candidates
  audited and rejected: HP:0011396 Abnormality of the cochlear nerve and
  HP:0034585 Cochlear nerve hypoplasia are both descendants of HP:0011391
  Abnormal inner ear nerve *morphology*, whereas the CAPOS lesion is functional
  dyssynchrony in a structurally normal nerve; HP:0025112 Auditory sensitivity
  and HP:5200410 Auditory agnosia are unrelated. HP:0006958 Abnormal auditory
  evoked potentials, already used here, remains the correct binding, and the
  mechanism itself is carried by the Auditory Neuropathy with Preserved Outer
  Hair Cell Function pathophysiology node. This is an HPO gap, not a curation
  gap.

  FREQUENCY BANDS - what was and was not assigned. Bands are assigned only
  where a denominator is quotable. Three come from Demos Table 1, whose title
  ("Clinical features of 10 patients from three families with CAPOS syndrome")
  is quoted as its own evidence item so the denominator is read off the paper
  rather than derived: pes cavus 3/10 = 30% (FREQUENT, at the band's lower
  boundary) and seizures 1/10 = 10% (OCCASIONAL). One comes from
  PMID:32913013, which states both numerator and denominator in the sentence
  quoted: resting ECG abnormality 2/3 = 67% (FREQUENT), with the three-patient
  CAPOS arm stated in the explanation. Deliberately NOT banded: cerebellar
  ataxia, areflexia, optic atrophy and sensorineural hearing loss are 10/10 in
  the same Demos table, but that cohort was ascertained on those very features,
  so 100% would report the case definition rather than a frequency; and
  Wolff-Parkinson-White is 1/10 with no asserted mechanism, which is too thin
  to band.

  REMAINING NARROWING, STATED EXPLICITLY. The following surfaced in the
  cross-check and were deliberately left out of this entry rather than curated
  thinly. (i) Blindness (HP:0000618, 2/10 in the HPO annotation set) is
  subsumed here by Visual impairment with a PROGRESSIVE clinical_course; the
  HPO annotation counts themselves were not used as evidence because they are
  a derived annotation product rather than a quotable primary source.
  (ii) Dysphagia and cognitive dysfunction are real Demos Table 1 rows but
  their +/- strings are broken across a page-extraction artifact in the cached
  full text, so no clean verbatim row can be quoted and no honest count can be
  made; the cognitive-dysfunction footnote in any case describes "low average
  to average IQ and reduced attention skills", which does not support an
  intellectual-disability term. (iii) Peripheral axonal neuropathy is in
  genuine tension with the original description's areflexia-without-neuropathy
  claim; that is a mechanistic question rather than a phenotype to add, and it
  belongs with the areflexia discussion. (iv) The cardiac work for the sibling
  Alternating_Hemiplegia_of_Childhood entry, and any surveillance-interval
  treatment entry, remained with issue #7648 when this entry was created -
  since done, in PR #7794.

  ISSUE #7648 SECOND PASS (unused sources). Four of the five previously-unused
  sources named in the issue were reviewed and, where the claim was clean and
  quotable, incorporated: PMID:8733056 (Nicolaides 1996, the original
  description) now backs the areflexia-without-neuropathy claim on the
  Areflexia phenotype; PMID:38821025 (Kaneshiro 2024) adds the ABR/ASSR
  dissociation mechanism to Abnormal auditory evoked potentials;
  PMID:29090527 (Chang 2018) adds pregnancy/postpartum as a documented
  non-febrile trigger exception on the Febrile Illness Unmasking node, rated
  PARTIAL because it is a single family; PMID:29184165 (Han 2017) adds a
  third, independent favourable-CI-outcome case, rated PARTIAL because that
  proband had isolated auditory neuropathy rather than full CAPOS. ORPHA:1171
  was not added - Orphadata bulk XML is not present in this environment
  (`just refresh-orphadata` was not run) and the entry's existing prevalence
  block already has PMID-sourced support, so this was left rather than
  fetched with an unreviewed bulk download.

  NEC PREFLIGHT. MONDO:0011038 was verified with OAK before curation:
  OMIM:601338, Orphanet:1171, is_a MONDO:0700002 ATP1A3-associated neurological
  disorder. The ATP1A3 spectrum is a high named-entity-confusion risk class -
  AHC, RDP/DYT12, CAPOS and RECA/FIPWE are allelic but distinct - and residue
  numbering is a specific trap, since the common AHC variant p.Glu815Lys (E815K)
  is three residues from the CAPOS p.Glu818Lys (E818K). Every genotype claim in
  this entry is anchored to the c.2452G>A nucleotide coordinate as well as the
  protein change.

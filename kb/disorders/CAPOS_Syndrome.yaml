name: CAPOS Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  CAPOS syndrome (cerebellar ataxia, areflexia, pes cavus, optic atrophy and
  sensorineural hearing loss) is an ultra-rare autosomal dominant neurological
  disorder caused, in essentially every reported patient, by the single
  recurrent ATP1A3 missense variant c.2452G>A (p.Glu818Lys). ATP1A3 encodes the
  neuron-specific alpha-3 subunit of the Na+/K+-ATPase; the p.Glu818Lys
  substitution cripples sodium handling at the pump's third (sodium-specific)
  ion-binding site so that the pump cannot be properly activated under
  physiological conditions. The clinical hallmark is a small number (typically
  one to three) of febrile-illness-triggered episodes of acute cerebellar ataxia
  and encephalopathy in infancy or early childhood, each followed by
  considerable but incomplete recovery, leaving a stepwise-accrued residuum of
  ataxia, areflexia, optic atrophy, auditory-neuropathy-type hearing loss and
  pes cavus.

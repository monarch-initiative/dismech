mechanistic_hypotheses:
- hypothesis_group_id: febrile_pump_reserve_failure
  hypothesis_label: Febrile metabolic and firing demand exceeds the reduced alpha-3 pump reserve
  status: EMERGING
  description: >-
    The proposed explanation for why CAPOS episodes are precipitated by fever:
    p.Glu818Lys leaves enough residual Na+/K+-ATPase alpha-3 activity for
    baseline function but with little reserve, so the increased neuronal firing
    and metabolic demand of a febrile illness outstrips the pump's capacity to
    restore transmembrane Na+/K+ gradients, producing transient network failure
    in cerebellar, brainstem, auditory, and visual pathways. In-vitro
    biophysics shows that the mutant pump cannot be properly activated under
    physiological conditions, and clinical series consistently tie episodes to
    fever, but no experiment has directly tested temperature dependence of the
    E818K pump or of E818K neurons, so the causal step from pyrexia to network
    failure remains inferential.
  evidence:
  - reference: PMID:30409907
    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "the CAPOS mutation caused a weaker voltage dependence of the pumping rate and a stronger inhibition by cytoplasmic K+ than the WT enzyme, which together with the reduced Na+ affinity of the cytoplasmic-facing sites precluded proper pump activation under physiological conditions"
    explanation: >-
      Provides the biophysical basis for a marginal pump reserve, but does not
      itself test the effect of raised temperature.
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "speculate about the pathophysiologic processes underlying the acute neurological manifestations"
    explanation: >-
      The authors themselves frame the mechanism of the acute febrile episodes as
      speculative, supporting an EMERGING rather than CANONICAL status.
pathophysiology:
- name: ATP1A3 p.Glu818Lys Na+/K+-ATPase Alpha-3 Dysfunction
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A single recurrent heterozygous missense substitution, ATP1A3 c.2452G>A
    (p.Glu818Lys), replaces a glutamate with a lysine in the neuron-specific
    alpha-3 catalytic subunit of the plasma-membrane Na+/K+-ATPase. Glu-818
    participates in a hydrogen-bonding/salt-bridge network that supports the
    Na+-specific ion-binding site III, and its substitution lowers apparent Na+
    affinity at both cytoplasmic- and extracellular-facing sites (about 30-fold
    at the extracellular sites) while leaving K+ activation, ATP affinity, and
    proton leak essentially normal. The net effect is a pump that cannot be
    properly activated under physiological ionic and voltage conditions.

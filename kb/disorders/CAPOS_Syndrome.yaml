differential_diagnoses:
- name: Alternating hemiplegia of childhood
  disease_term:
    preferred_term: alternating hemiplegia of childhood
    term:
      id: MONDO:0016241
      label: alternating hemiplegia of childhood
  description: >-
    The best-known ATP1A3-related phenotype. AHC shares the ATP1A3 gene, the
    paroxysmal trigger-sensitive attack architecture, and autosomal dominant
    inheritance, but is caused by different alleles (recurrently p.Asp801Asn and
    p.Glu815Lys), begins before 18 months with hemiplegic attacks that remit in
    sleep, and characteristically lacks the hearing and visual involvement that
    define CAPOS.
  distinguishing_features:
  - AHC attacks are hemiplegic/dystonic and remit during sleep; CAPOS episodes are ataxic-encephalopathic and fever-locked.
  - Sensorineural hearing loss and optic atrophy are core to CAPOS and typically absent in AHC.
  - AHC alleles differ from the single recurrent CAPOS allele p.Glu818Lys.
  evidence:
  - reference: PMID:29184165
    reference_title: "ATP1A3 mutations can cause progressive auditory neuropathy: a new gene of auditory synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Different variants of this gene have been reported to cause RDP and AHC, without the companion of hearing or visual disturbance"
    explanation: >-
      States the key discriminating feature — hearing and visual involvement are
      CAPOS-specific within the ATP1A3 spectrum.
- name: Rapid-onset dystonia-parkinsonism
  disease_term:
    preferred_term: rapid-onset dystonia-parkinsonism
    term:
      id: MONDO:0007496
      label: dystonia 12
  description: >-
    The third classical ATP1A3 phenotype. RDP presents between 18 months and
    older adulthood with abrupt-onset, usually bulbar-predominant generalized
    dystonia after a stress trigger, and, like AHC, lacks the auditory and
    visual features of CAPOS.
  distinguishing_features:
  - RDP is dominated by fixed dystonia and parkinsonism rather than ataxia.
  - RDP triggers are typically physical or emotional stress rather than specifically fever.
  - Hearing loss and optic atrophy are not features of RDP.
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RDP presents in individuals ages 18 months to 60 years and older with dystonia that is typically of abrupt onset over hours to several weeks, though some individuals report gradual onset over the course of months."
    explanation: GeneReviews describes the RDP presentation that distinguishes it from CAPOS.
  - reference: PMID:29184165
    reference_title: "ATP1A3 mutations can cause progressive auditory neuropathy: a new gene of auditory synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Different variants of this gene have been reported to cause RDP and AHC, without the companion of hearing or visual disturbance"
    explanation: Confirms the absence of auditory/visual involvement in RDP.
- name: Episodic ataxia type 2
  disease_term:
    preferred_term: episodic ataxia type 2
    term:
      id: MONDO:0007163
      label: episodic ataxia type 2
  description: >-
    A dominant CACNA1A channelopathy with recurrent attacks of ataxia and
    interictal nystagmus that, like CAPOS, is often acetazolamide-responsive.
    It lacks optic atrophy and auditory neuropathy, and its attacks are
    typically stress- or exertion-related rather than fever-locked.
  distinguishing_features:
  - Episodic ataxia type 2 lacks optic atrophy and auditory neuropathy.
  - CAPOS attacks are consistently fever-triggered and few in number (usually one to three lifetime episodes).
  evidence:
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar to some other types of episodic ataxia, acetazolamide may be considered in patients with CAPOS syndrome to prevent or attenuate bouts of ataxia, but this requires further study."
    explanation: >-
      Explicitly frames CAPOS alongside the episodic ataxias, which is why they
      belong in the differential; the quote supports the overlap, not the
      distinguishing features.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    There is no disease-modifying therapy for CAPOS. Management is supportive
    and coordinated across neurology, developmental paediatrics, orthopaedics,
    physical medicine and rehabilitation, speech-language therapy, psychology,
    ophthalmology, audiology, social work, and medical genetics, with regularly
    scheduled surveillance for new manifestations.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for ATP1A3-related disorder. Supportive treatment to improve quality of life, maximize function, and reduce complications is recommended."
    explanation: GeneReviews establishes supportive care as the standard of management.
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This ideally involves multidisciplinary care by specialists in neurology, developmental pediatrics, orthopedics, physical medicine and rehabilitation, speech-language therapy, psychology, mental health, ophthalmology, social work, and medical genetics."
    explanation: Specifies the multidisciplinary composition of supportive care.
- name: Trigger avoidance and prompt fever management
  description: >-
    Because febrile illness is the near-universal precipitant of CAPOS episodes,
    prompt antipyresis and hydration during intercurrent illness, and avoidance
    of overheating, are standard advice. GeneReviews lists an explicit
    agents/circumstances-to-avoid set for ATP1A3 heterozygotes covering
    physical, psychological, emotional, and environmental stress (including
    heat), strenuous exercise, and excessive alcohol. This is biologically
    motivated tertiary prevention; no trial has shown that it prevents permanent
    deficits.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Febrile Illness
    treatment_effect: INHIBITS
    description: >-
      Reducing febrile and other physiological stress is intended to remove the
      trigger that precipitates acute decompensation.
  evidence:
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals who are heterozygous for an ATP1A3 pathogenic variant should avoid the known triggers for manifestations and/or episodes that include physical, psychological (e.g., missed meals, sleep deprivation), and emotional stress (e.g., excitement, fear); environmental stress (e.g., bright sunlight or fluorescent lighting, heat/cold, excessive noise, crowds); excessive or atypically strenuous exercise; and excessive use of alcohol."
    explanation: >-
      The GeneReviews agents/circumstances-to-avoid section, quoted verbatim, is
      the source of the trigger-avoidance advice.
  - reference: PMID:38821025
    reference_title: Childhood fever and hearing loss associated with CAPOS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CAPOS syndrome involves a characteristic episode in which neuropathy develops after a fever in childhood"
    explanation: Establishes fever as the trigger that this intervention targets.
- name: Acetazolamide prophylaxis
  description: >-
    Acetazolamide has been used off-label to prevent or attenuate CAPOS

  relationship_type: CAUSATIVE
  notes: >-
    ATP1A3 encodes the neuron-specific alpha-3 catalytic subunit of the
    Na+/K+-ATPase. CAPOS is genetically homogeneous to a degree that is unusual
    even among Mendelian disorders: essentially every reported patient carries
    the same heterozygous missense change, c.2452G>A (p.Glu818Lys). This is a
    striking genotype-phenotype restriction, because the same gene produces
    clinically distinct allelic disorders (alternating hemiplegia of childhood,
    rapid-onset dystonia-parkinsonism, RECA/FIPWE) through a large and
    heterogeneous set of other variants.
  evidence:

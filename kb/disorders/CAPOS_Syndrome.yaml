    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that these amino acid substitutions reduce the apparent Na+ affinity at the cytoplasmic-facing sites of the pump protein"
    explanation: >-
      Direct biochemical demonstration of reduced cytoplasmic Na+ affinity.
      Evidence source is IN_VITRO because the measurements are biochemical
      assays and heterologous-expression (Xenopus oocyte) electrophysiology,
      not in vivo animal work.
  - reference: PMID:30409907
    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the CAPOS mutation caused a weaker voltage dependence of the pumping rate and a stronger inhibition by cytoplasmic K+ than the WT enzyme, which together with the reduced Na+ affinity of the cytoplasmic-facing sites precluded proper pump activation under physiological conditions."
    explanation: >-
      The central functional finding: the mutant pump cannot be properly
      activated under physiological conditions. Evidence source is IN_VITRO
      because this is heterologous-expression electrophysiology in an
      expression system, not an in vivo animal model.

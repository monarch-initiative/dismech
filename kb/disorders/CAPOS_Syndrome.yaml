    explanation: >-
      Independent heterologous-expression study localising the defect to the
      sodium-specific third ion-binding site; IN_VITRO because the assay is a
      heterologous expression system.
  downstream:
  - target: Impaired Neuronal Transmembrane Ion Gradient Restoration
    causal_link_type: DIRECT
- name: Impaired Neuronal Transmembrane Ion Gradient Restoration
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Because the alpha-3 pump can no longer be properly activated, neurons that
    depend on it fail to restore the Na+ and K+ gradients that were spent during
    activity. The alpha-3 isoform is the high-turnover, activity-recruited
    neuronal pump, so the deficit is expressed as an inability to reset the
    membrane after firing rather than as a resting-potential collapse. Neurons
    with high sustained firing rates and long, energetically expensive axons are
    disproportionately affected, which is the cell-biological basis of the
    otherwise puzzling CAPOS lesion distribution: cerebellar Purkinje and
    cerebellar circuit neurons, spiral ganglion neurons of the auditory nerve,
    retinal ganglion cells projecting through the optic nerve, and dorsal root
    ganglion sensory neurons.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:

    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CAPOS syndrome presents in infancy or childhood (usually ages 6 months to 5 years) with cerebellar ataxia during or after a fever."
    explanation: >-
      GeneReviews makes the febrile precipitant part of the defining CAPOS
      presentation.
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: SUPPORT

name: CAPOS Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  CAPOS syndrome (cerebellar ataxia, areflexia, pes cavus, optic atrophy, and
  sensorineural hearing loss) is an ultra-rare autosomal dominant neurological
  disorder caused by a single recurrent heterozygous ATP1A3 variant,
  c.2452G>A (p.Glu818Lys), in the neuron-specific alpha-3 subunit of the
  Na+/K+-ATPase. It presents in infancy or early childhood with acute ataxic
  encephalopathy episodes triggered during or after febrile illness. Recovery
  from each episode is usually substantial but incomplete, leaving persistent
  and often slowly progressive cerebellar ataxia, generalized areflexia,
  optic atrophy, and hearing loss. The hearing loss is characteristically an
  auditory neuropathy — cochlear outer hair cell function (otoacoustic
  emissions, cochlear microphonics) is preserved while auditory brainstem
  responses are grossly abnormal — placing the auditory lesion at the inner
  hair cell/afferent synapse and spiral ganglion rather than in the hair cells
  themselves. CAPOS sits within the ATP1A3-related disorder spectrum alongside
  alternating hemiplegia of childhood (AHC), rapid-onset dystonia-parkinsonism
  (RDP), and relapsing encephalopathy with cerebellar ataxia (RECA/FIPWE), but
  is distinguished by the p.Glu818Lys allele and by the combination of
  auditory and visual involvement that the other phenotypes lack.

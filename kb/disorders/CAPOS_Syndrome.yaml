  - reference: PMID:30409907
    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The electrophysiological measurements indicated a more conspicuous, ∼30-fold reduction of apparent Na+ affinity for the extracellular-facing sites in the CAPOS mutant, which was related to an accelerated transition between the phosphoenzyme intermediates E1P and E2P."
    explanation: >-
      Quantifies, for the CAPOS allele specifically, the ion-handling defect that

- name: Febrile Decompensation of Neuronal Excitability
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    During febrile illness the combination of a marginal alpha-3 pump reserve
    and increased neuronal firing and metabolic demand is proposed to tip
    high-firing neuronal populations into acute failure of Na+/K+ gradient
    recovery, with depolarization, unreliable action-potential generation, and
    loss of synaptic timing fidelity across cerebellar, brainstem, auditory,
    and oculomotor circuits. The step from pyrexia to network failure has not
    been directly demonstrated for E818K in vivo and is therefore curated as
    an emerging mechanistic hypothesis.

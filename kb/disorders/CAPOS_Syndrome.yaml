pathophysiology:
- name: ATP1A3 p.Glu818Lys Na+/K+-ATPase Alpha-3 Pump Dysfunction
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The heterozygous ATP1A3 p.Glu818Lys substitution acts on the alpha-3
    catalytic subunit of the Na+/K+-ATPase, the isoform expressed selectively in
    neurons. Glu818 participates in a hydrogen-bonding and salt-bridge network
    that positions the residues coordinating Na+ at ion-binding site III, the
    sodium-specific site. The charge-reversing substitution lowers apparent Na+
    affinity at both the cytoplasmic-facing and (far more markedly) the
    extracellular-facing sites, accelerates the E1P-to-E2P phosphoenzyme
    transition, flattens the voltage dependence of pumping and increases
    inhibition by cytoplasmic K+. The K+ arm of the cycle and the ATP/E1-E2
    equilibrium are spared, and proton-leak currents are not increased, so this
    is a specific sodium-handling defect rather than a generalised loss of pump
    protein or a leak channelopathy.

  prevalence_class: ULTRA_RARE
  notes: >-
    Only case-count data exist. Twenty-five individuals had been reported by
    2017; the tenth family and 27th patient were reported the same year, and
    later reviews put the worldwide total below 100. No population-based
    prevalence or incidence estimate has been published, so no rate per 100,000
    is recorded.
  evidence:

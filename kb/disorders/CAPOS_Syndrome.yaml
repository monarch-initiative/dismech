- name: Cochlear implantation
  description: >-
    Cochlear implantation bypasses the inner hair cell/afferent synapse and
    stimulates spiral ganglion neurons directly, which is the mechanistic
    rationale for its use in CAPOS auditory neuropathy. Outcomes are
    heterogeneous: two Korean auditory-synaptopathy implantees reached 90-94%
    speech recognition at three months, whereas one Chinese CAPOS implantee did
    poorly. Because ATP1A3 is also expressed in the spiral ganglion, ongoing
    ganglion-cell dysfunction could erode benefit over time, so long-term
    follow-up is advised and candidacy counselling should be individualized.
  treatment_term:
    preferred_term: cochlear implantation

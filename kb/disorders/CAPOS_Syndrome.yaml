- name: Auditory Synaptopathy and Spiral Ganglion Dysfunction
  biological_scale: CELLULAR
  role: effector
  description: >-
    The CAPOS auditory lesion is retro-hair-cell. Alpha-3 is expressed
    abundantly in the membranes of type I afferent terminals contacting inner
    hair cells, in spiral ganglion somata, and in medial efferent terminals at
    outer hair cells, but not in the stria vascularis that generates the
    endocochlear potential. Consistent with this, CAPOS patients retain
    otoacoustic emissions and cochlear microphonic potentials — evidence of
    intact outer hair cell mechanics — while auditory brainstem responses are
    grossly abnormal, reflecting desynchronized neural firing. Speech perception
    is disproportionately poor relative to pure-tone thresholds, especially in
    noise. This is auditory neuropathy/synaptopathy, and it is the reason
    conventional amplification often disappoints while cochlear implantation,
    which stimulates the spiral ganglion directly, can help.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  locations:

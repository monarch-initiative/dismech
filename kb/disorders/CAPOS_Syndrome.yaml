- name: Cumulative Cerebellar Dysfunction
  biological_scale: TISSUE
  role: effector
  description: >-
    Persistent cerebellar ataxia is present in essentially all reported CAPOS
    patients and typically progresses slowly after the acute episodes stop.
    Structural cerebellar atrophy is reported in some patients but is far from
    universal — many have normal brain MRI — so the residual ataxia is better
    understood as chronic cerebellar network dysfunction with variable, usually
    mild, secondary atrophy rather than as a primary degenerative
    Purkinje-cell disease. Dystonia, myoclonus, and emotional/behavioral change
    are described as additional persisting sequelae.

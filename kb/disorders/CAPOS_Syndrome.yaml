discussions:
- discussion_id: capos_fever_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How, mechanistically, does raised body temperature convert a marginally
    functional ATP1A3 p.Glu818Lys Na+/K+-ATPase into acute multifocal neuronal
    network failure?
  attaches_to:
  - pathophysiology#Febrile Decompensation of Neuronal Excitability
  rationale: >-
    Fever is the defining precipitant of CAPOS episodes, yet the published
    biophysics of E818K was performed at standard assay conditions and never
    tested temperature dependence, and no CAPOS/E818K-specific animal or iPSC
    neuron model exists. The whole fever-to-episode step is therefore inferred.
    Resolving it matters clinically: it would determine whether aggressive
    antipyresis is genuinely disease-modifying or merely symptomatic, and it
    would identify the pump-reserve parameter that a future therapy should
    target.
  proposed_experiments:
  - experiment_id: exp_capos_temperature_clamped_pump_electrophysiology
    name: Temperature-clamped E818K pump electrophysiology
    description: >-
      Measure E818K versus wild-type alpha-3 pump current, apparent Na+
      affinity, and E1P/E2P transition kinetics across the physiological-to-
      febrile temperature range to test whether pump reserve collapses at
      febrile temperatures.
  - experiment_id: exp_capos_e818k_knockin_mouse_hyperthermia
    name: E818K knock-in mouse with induced hyperthermia
    description: >-
      Generate an Atp1a3 E818K knock-in mouse and assess ataxia, auditory
      brainstem responses, otoacoustic emissions, and optic nerve integrity with
      and without induced hyperthermia, to test whether fever is sufficient to
      precipitate the CAPOS episode phenotype.
  - experiment_id: exp_capos_ipsc_neuron_thermal_stress
    name: Patient-derived iPSC neuron thermal-stress assay
    description: >-
      Differentiate patient-derived induced pluripotent stem cells into
      cerebellar and auditory neurons and apply thermal stress with intracellular
      Na+ imaging and multi-electrode-array recording to test activity-dependent
      gradient-recovery failure in human cells.
  evidence:
  - reference: PMID:34612482
    reference_title: Genetically altered animal models for ATP1A3-related disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The molecular mechanisms through which mutations in ATP1A3 result in a broad range of neurological symptoms are poorly understood."
    explanation: >-
      A dedicated review of ATP1A3 animal models states that the mechanisms
      remain poorly understood, supporting this as a genuine knowledge gap.
  - reference: PMID:30409907
    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Here, using biochemical and electrophysiological approaches, we examined the functional characteristics of E818K, as well as of E818Q and E818A mutants."
    explanation: >-
      The definitive E818K biophysical study characterizes ion handling but does
      not address temperature dependence.
- discussion_id: capos_areflexia_substrate
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is CAPOS areflexia caused by a peripheral axonal neuropathy, or by a central
    or synaptic failure within an anatomically intact reflex arc?
  attaches_to:
  - pathophysiology#Peripheral Reflex Arc Dysfunction
  rationale: >-
    The original 1996 description explicitly recorded areflexia in the absence
    of a peripheral neuropathy, and ATP1A3 alpha-3 is characterized as
    distributed predominantly in central nervous system neurons, which argues
    against a primary peripheral nerve lesion. Yet pes cavus is classically a
    marker of chronic peripheral neuropathy, and nerve biopsy in a long-followed
    member of the discovery cohort showed axonal changes. Resolving this
    determines whether nerve conduction studies have a diagnostic role in CAPOS
    and whether the cavus deformity should be modelled as a neuropathic
    consequence.
  proposed_experiments:
  - experiment_id: exp_capos_cohort_nerve_conduction_studies
    name: Cohort-wide nerve conduction and quantitative sensory testing
    description: >-
      Perform systematic nerve conduction studies and quantitative sensory
      testing across a genotyped CAPOS cohort to determine how often a
      measurable peripheral neuropathy accompanies the areflexia.
  - experiment_id: exp_capos_peripheral_nerve_imaging
    name: Peripheral nerve imaging in areflexic CAPOS patients
    description: >-
      Use nerve ultrasound or MR neurography to assess peripheral nerve
      structure and cross-sectional area in areflexic CAPOS patients versus
      controls.
  evidence:
  - reference: PMID:8733056
    reference_title: "Cerebellar ataxia, areflexia, pes cavus, optic atrophy, and sensorineural hearing loss (CAPOS): a new syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients have areflexia (in the absence of a peripheral neuropathy), a pes cavus deformity, and show varying degrees of severity."
    explanation: >-
      The original description asserts areflexia without demonstrable peripheral
      neuropathy, which is the crux of the question.
  - reference: PMID:33868146
    reference_title: "ATP1A3-Related Disorders: An Ever-Expanding Clinical Spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The α3 isoform is required as a rescue pump, after repeated action potentials, with a distribution predominantly in neurons of the central nervous system."
    explanation: >-
      The predominantly central distribution of alpha-3 argues against a primary
      peripheral nerve lesion, but does not exclude one.
notes: >-
  Module conformance was evaluated and deliberately NOT asserted for either
  candidate module.

  (1) `sensorineural_hair_cell_loss` — rejected. Its central effector node is
  "Hair Cell Mechanotransduction Failure and Death" and its effector node
  bundles "Cochlear Amplification Loss and Spiral Ganglion Neuron
  Degeneration". CAPOS hearing loss is the mechanistic opposite at the hair
  cell: otoacoustic emissions and cochlear microphonic potentials are
  preserved, demonstrating intact outer hair cell mechanics and intact cochlear
  amplification, while the auditory brainstem response is grossly abnormal
  (PMID:29305691). The lesion sits at the inner hair cell/type I afferent
  synapse and the spiral ganglion — auditory synaptopathy/neuropathy, not hair
  cell loss. Declaring conformance would assert a hair-cell-death mechanism
  that the CAPOS literature specifically excludes. If a conserved "auditory
  neuropathy / cochlear synaptopathy" module is ever created (the
  retro-hair-cell counterpart, shared with OTOF- and OPA1-related disease),
  CAPOS would be a strong conformer.

  (2) `cerebellar_purkinje_degeneration` — rejected. Its central effector is
  "Purkinje Neuron Degeneration", reached via "Purkinje Cell Calcium and
  Proteostasis Dysregulation". No CAPOS study demonstrates Purkinje cell loss
  or a calcium/proteostasis cascade; cerebellar atrophy is reported in only a
  minority (PMID:36484864 describes mild atrophy in one patient) and brain MRI
  is frequently normal. CAPOS ataxia is better characterized as episodic and
  residual cerebellar network dysfunction from a pump-recovery deficit than as
  a progressive Purkinje degeneration, so conformance would overstate the
  evidence.

  Named Entity Confusion guard: ATP1A3 causes a series of allelic disorders
  (AHC, RDP, RECA/FIPWE, polymicrogyria) and CAPOS-specific literature is
  sparse, so every phenotype and mechanism claim here was sourced to a
  publication that is explicitly about CAPOS or about the p.Glu818Lys allele.
  Where a statement is general ATP1A3 biology (the alpha-3 rescue-pump role;
  the cochlear expression pattern of NKA alpha-3), the evidence explanation
  says so. Note the near-collision between the CAPOS allele p.Glu818Lys and the
  distinct AHC allele p.Glu815Lys.

  Deep research: an Edison/Falcon run
  (research/CAPOS_Syndrome-deep-research-falcon.md, 12 citations, largely
  derived from two papers) was read in full and used only as a lead generator.
  Three of its suggestions were verified as wrong and discarded: it gave the
  HGNC ID as HGNC:806 (correct is hgnc:801); it proposed "auditory neuropathy
  HP:0031869", which is actually Recurrent joint dislocation; and it proposed
  "episodic ataxia HP:0001250", which is actually Seizure (episodic ataxia is
  HP:0002131). Every PMID, snippet, and ontology term in this entry was
  independently re-verified against the cached abstract or OAK. The Falcon run
  did usefully surface Han et al. 2017 (PMID:29184165), which is now a core
  source for the auditory-synaptopathy mechanism.

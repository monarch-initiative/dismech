genetic:
- name: ATP1A3
  gene_term:
    preferred_term: ATP1A3
    term:
      id: hgnc:801
      label: ATP1A3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: >-
    Essentially all reported CAPOS patients carry the same ATP1A3 allele,
    c.2452G>A (p.Glu818Lys); CAPOS is genetically homogeneous.
  notes: >-
    ATP1A3 (chromosome 19q13.2) encodes the neuron-specific catalytic alpha-3
    subunit of the Na+/K+-ATPase. Different ATP1A3 alleles cause alternating
    hemiplegia of childhood (recurrently p.Asp801Asn and p.Glu815Lys),
    rapid-onset dystonia-parkinsonism, and RECA/FIPWE; p.Glu818Lys is
    essentially private to the CAPOS phenotype and is a recurrent mutational
    hotspot rather than a founder allele, having arisen de novo in multiple
    ancestries. Note the near-collision between the CAPOS allele p.Glu818Lys and
    the distinct AHC allele p.Glu815Lys.
  evidence:
  - reference: PMID:24468074
    reference_title: A novel recurrent mutation in ATP1A3 causes CAPOS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found an identical heterozygous missense mutation, c.2452G > A (p.(Glu818Lys)), in the Na⁺/K⁺ ATPase α₃(ATP1A3) gene in the proband and his affected sister and mother, but not in either unaffected maternal grandparent, in the first family."
    explanation: >-
      Establishes ATP1A3 p.Glu818Lys as the CAPOS variant with familial
      segregation in the original 1996 family and two others.
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases, the mutation c.2452G>A (p.Glu818Lys) in the ATP1A3 gene was identified."
    explanation: >-
      A systematic review of all patients reported to 2017 confirms complete
      genetic homogeneity.
  - reference: PMID:29090527
    reference_title: Novel pregnancy-triggered episodes of CAPOS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All identified patients have the same heterozygous missense variant c.2452G>A (p.Glu818Lys) in the ATP1A3 gene"
    explanation: Independent confirmation of the single recurrent CAPOS allele.
  - reference: PMID:29184165
    reference_title: "ATP1A3 mutations can cause progressive auditory neuropathy: a new gene of auditory synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High mutability of this residue, as shown by frequent de novo occurrence of p.E818K (c.2452 G > A) of ATP1A3 both in Caucasians31 and in Koreans, indicates that the effect of this mutational hotspot is not limited to certain populations but would rather be global."
    explanation: >-
      Supports recurrent de novo occurrence across ancestries (mutational hotspot,
      not founder effect).
variants:
- name: ATP1A3 c.2452G>A (p.Glu818Lys)
  description: >-
    The single recurrent heterozygous missense variant that causes CAPOS
    syndrome (NM_152296, ENST00000302102; chromosome 19q13.2). It substitutes a
    positively charged lysine for a negatively charged glutamate in the
    C-terminal cation-transporting domain of Na+/K+-ATPase alpha-3, disrupting
    the hydrogen-bonding/salt-bridge network around Na+-binding site III. It has
    been absent from all large control sets tested, arises de novo in roughly
    half of probands, and is recurrent across European, Korean, Chinese, and
    Japanese ancestries.
  gene:
    preferred_term: ATP1A3
    term:
      id: hgnc:801
      label: ATP1A3
  clinical_significance: PATHOGENIC
  synonyms:
  - p.E818K
  - E818K
  - c.2452G>A
  evidence:
  - reference: PMID:24468074
    reference_title: A novel recurrent mutation in ATP1A3 causes CAPOS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation was not found in more than 3600 chromosomes from unaffected individuals."
    explanation: >-
      Absence from a large control set supports pathogenicity of the CAPOS
      variant.
  - reference: PMID:29184165
    reference_title: "ATP1A3 mutations can cause progressive auditory neuropathy: a new gene of auditory synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant has not been detected in the Exome Aggregation Consortium (ExAC; 121,412 alleles) and the Korean Reference Genome Database (KRGDB; 1,244 alleles)."
    explanation: Independent population-database absence supporting pathogenicity.
  - reference: PMID:30409907
    reference_title: "Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that these amino acid substitutions reduce the apparent Na+ affinity at the cytoplasmic-facing sites of the pump protein"
    explanation: Functional evidence of a deleterious effect on pump ion handling.
diagnosis:
- name: Targeted ATP1A3 sequencing for c.2452G>A
  presence: >-
    Detection of the heterozygous ATP1A3 c.2452G>A (p.Glu818Lys) variant
    confirms CAPOS syndrome.
  description: >-
    Because CAPOS is genetically homogeneous, targeted sequencing of ATP1A3 (or
    of the single c.2452G>A position) is highly efficient in a child with
    fever-induced paroxysmal ataxia, and in adults with a longstanding
    cerebellar syndrome plus areflexia, pes cavus, visual impairment, and/or
    sensorineural hearing loss.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:27091223
    reference_title: "The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A (p.Glu818Lys) Mutation in the ATP1A3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted sequencing of the ATP1A3 gene is recommended in children exhibiting paroxysmal, fever-induced ataxia and in adults with a more or less stationary or slowly progressive cerebellar syndrome since childhood accompanied by mixed combinations of areflexia, pes cavus, profound visual impairment, and/or sensorineural hearing loss."
    explanation: An explicit testing recommendation with the clinical trigger criteria.
  - reference: PMID:20301294
    reference_title: "ATP1A3-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ATP1A3-related disorder is established in a proband with suggestive findings and a heterozygous pathogenic variant in ATP1A3 identified by molecular genetic testing."
    explanation: GeneReviews states the clinical-plus-molecular diagnostic standard.
- name: Audiological testing with otoacoustic emissions and auditory brainstem response
  presence: >-
    Preserved otoacoustic emissions/cochlear microphonics with grossly abnormal
    or absent auditory brainstem responses identifies auditory neuropathy and
    should prompt ATP1A3 testing in the right clinical context.
  description: >-
    The OAE/ABR dissociation both localizes the lesion and directly changes
    management, because conventional hearing aids underperform in auditory
    neuropathy while cochlear implantation bypasses the affected synapse.
    Auditory steady-state responses may track the pure-tone audiogram better
    than the ABR.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:29305691
    reference_title: The CAPOS mutation in ATP1A3 alters Na/K-ATPase function and results in auditory neuropathy which has implications for management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this retrospective analysis of audiological data, we show for the first time that cochlear outer hair cell activity was preserved as shown by the presence of otoacoustic emissions and cochlear microphonic potentials, but the auditory brainstem responses were grossly abnormal, likely reflecting neural dyssynchrony."
    explanation: Defines the diagnostic audiological signature of CAPOS.
  - reference: PMID:38821025
    reference_title: Childhood fever and hearing loss associated with CAPOS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Auditory stead-state response (ASSR) produced relatively consistent results compared to pure-tone audiometry."
    explanation: Supports adding auditory steady-state response when the ABR is uninformative.
- name: Neurological examination for areflexia in at-risk relatives
  presence: >-
    Generalized areflexia, sometimes with mild instability, may be detectable
    before the first acute episode and in otherwise asymptomatic carriers.
  description: >-
    Careful reflex, gait, foot-morphology, ophthalmological, and audiological
    examination of relatives can establish the diagnosis before the first
    febrile episode, or reveal that an apparently non-syndromic auditory
    neuropathy is in fact CAPOS.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:28483396
    reference_title: Early Diagnosis of CAPOS Syndrome Before Acute-Onset Ataxia-Review of the Literature and a New Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that both siblings were assessed before the first acute-onset episode contributes to the description of early symptoms and signs of the disease, which could aid early diagnosis and management before the onset of acute episodes."
    explanation: Supports pre-episode clinical detection in at-risk relatives.
  - reference: PMID:29184165
    reference_title: "ATP1A3 mutations can cause progressive auditory neuropathy: a new gene of auditory synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This subject would have been classified as non-syndromic without a comprehensive neurologic examination by an expert."
    explanation: >-

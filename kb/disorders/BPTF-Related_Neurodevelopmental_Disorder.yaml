treatments:
- name: Supportive and Developmental Therapy
  description: >-
    There is no disease-modifying therapy for NEDDFL. Management is supportive
    and centres on early intervention: speech and language therapy (given the
    disproportionate speech delay), physical and occupational therapy for motor
    delay and hypotonia, educational support, nutritional support for poor
    weight gain and feeding difficulty, and periodic monitoring for scoliosis
    and ophthalmologic problems.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  - preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While it is unclear how significant the degree of scoliosis was within
      individuals, careful examination and monitoring for this clinical finding
      are also recommended.
    explanation: >-
      Supports the surveillance component of supportive management. No trial
      evidence exists for developmental therapy in NEDDFL specifically, so this
      is recorded as PARTIAL.

- name: Recombinant Human Growth Hormone
  description: >-
    Recombinant human growth hormone (somatropin, rhGH) has been used in NEDDFL
    children with short stature and documented growth hormone deficiency on
    arginine and levodopa stimulation testing. In the first reported use, one
    child gained 25.6 cm (+1.63 SD) over 3.5 years of treatment. Evidence is
    limited to two uncontrolled case reports and rhGH should not be regarded as
    an established standard of care in NEDDFL.
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant human growth hormone (somatropin)
      term:
        id: NCIT:C837
        label: Somatropin
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:36153657
    reference_title: "The effect of growth hormone treatment in children with novel BPTF gene variants: A report of two cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both children had short stature and responded to recombinant human growth
      hormone (rhGH) treatment - the first report of this therapy in NEDDFL
      patients.
    explanation: >-
      First and, to date, principal report of growth hormone therapy in NEDDFL.
  - reference: PMID:36153657
    reference_title: "The effect of growth hormone treatment in children with novel BPTF gene variants: A report of two cases and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The salutary effect of rhGH in the NEDDFL is documented.
    explanation: >-
      Authors' summary conclusion; PARTIAL because the evidence base is two
      uncontrolled cases with no comparator.

- name: Antiseizure Medication
  description: >-
    Levetiracetam is the most widely used antiseizure medication in
    BPTF-related epilepsy and reduced seizure frequency in two-thirds of treated
    individuals. Drug-resistant epilepsy is uncommon (27% of those with
    epilepsy); other agents used in the reported series include sodium valproate
    and lamotrigine, and one individual required vagal nerve stimulator
    placement.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:38936258
    reference_title: "Epilepsy as a Novel Phenotype of BPTF-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Levetiracetam was widely used and reduced seizure frequency in 67% of the
      cases.
    explanation: >-
      Direct evidence of levetiracetam effectiveness in BPTF-related epilepsy.

- name: Cyclical Vomiting Syndrome Therapy
  description: >-
    Acute treatment of cyclical vomiting episodes with ondansetron or
    domperidone, and prophylaxis with cyproheptadine, domperidone, or
    levetiracetam combined with lamotrigine, were all associated with clinical
    benefit in the reported BPTF series. Evidence is observational and from a
    single 15-individual questionnaire study.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ondansetron
      term:
        id: CHEBI:7773
        label: Ondansetron
    - preferred_term: cyproheptadine
      term:
        id: CHEBI:4046
        label: cyproheptadine
  target_phenotypes:
  - preferred_term: Episodic vomiting
    term:
      id: HP:0002572
      label: Episodic vomiting
  evidence:
  - reference: PMID:40614698
    reference_title: "Cyclical Vomiting Syndrome in Individuals With BPTF Haploinsufficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute therapy (ondansetron or domperidone) was administered in 42.8% of
      cases, and prophylactic therapy was provided in 57.1% of cases with
      cyproheptadine, levetiracetam combined with lamotrigine, and domperidone;
      all therapies were associated with clinical benefit.
    explanation: >-
      Observational report of benefit from acute and prophylactic CVS therapy;
      uncontrolled, hence PARTIAL.

- name: Genetic Counseling
  description: >-
    Genetic counseling should address the autosomal dominant inheritance, the
    50% recurrence risk for an affected parent, the possibility that an
    apparently de novo variant is inherited from a mildly affected parent (four
    such families are documented), the residual recurrence risk from parental
    germline mosaicism after an apparently de novo variant, and the variable
    expressivity of the disorder.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study has also uncovered four cases of inherited BPTF variants,
      providing some insight into the penetrance and expressivity of NEDDFL.
    explanation: >-
      Documented inherited variants are the basis for counseling about parental
      testing and recurrence risk.

animal_models:
- name: Bptf forebrain-conditional knockout mouse
  species: Mus musculus
  genotype: Emx1-Cre forebrain-conditional Bptf knockout (Bptf cKO)
  category: Conditional knockout mouse model of NEDDFL
  description: >-
    Forebrain-specific Bptf knockout mice, generated explicitly to model NEDDFL
    (PMID:35604347). They are born at normal Mendelian ratios and survive to
    adulthood but are smaller, with severe cortical hypoplasia, prolonged
    progenitor cell cycle length, increased cell death, disrupted cortical
    lamination with reduced deep-layer neurons, and impaired acquisition of
    distinct neuronal fates.
  notes: >-
    Interpretive caveat beyond the per-link limitations: ablation of Smarca1
    (the SNF2L ATPase partner of BPTF within NURF) produces mice with ENLARGED
    brains, the direct contrast of the NEDDFL microcephaly, so the two NURF
    subunits cannot be treated as interchangeable when modelling this disorder.
    That discordance is the basis of the `bptf_vs_smarca1_dosage_paradox`
    knowledge gap.
  modeled_mechanisms:
  - target: Neural Progenitor Cell-Cycle Prolongation and Apoptosis
    relationship: RECAPITULATES
    description: >-
      The model directly demonstrates the cellular mechanism this node asserts:
      prolonged progenitor cell cycle length and increased programmed cell death
      reducing neuronal output from the progenitor pool.
    readouts:
    - name: Progenitor cell cycle length
      target: Neural Progenitor Cell-Cycle Prolongation and Apoptosis
      direction: INCREASED
      description: >-
        Cell cycle length of cortical neural progenitors in Bptf cKO versus
        littermate control forebrain.
      interpretation: >-
        Lengthened cycle time is the measured basis for the reduced neuronal
        output asserted by this node.
    - name: Progenitor cell death incidence
      target: Neural Progenitor Cell-Cycle Prolongation and Apoptosis
      direction: INCREASED
      biological_processes:
      - preferred_term: apoptotic process
        term:
          id: GO:0006915
          label: apoptotic process
      description: >-
        Incidence of programmed cell death among cortical progenitors in Bptf
        cKO versus control.
      interpretation: >-
        Raised cell death compounds the cycle-length effect in depleting the
        progenitor pool.
    evidence:
    - reference: PMID:35604347
      reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Prolonged progenitor cell cycle length and a high incidence of cell death
        reduced the neuronal output.
      explanation: >-
        States the progenitor cell-cycle and apoptosis phenotype that this node
        asserts.
  - target: Cortical Hypoplasia and Disrupted Lamination
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces both facets of the node: severe cortical hypoplasia, and
      disrupted lamination with reduced deep-layer neurons and impaired
      acquisition of distinct cortical cell fates.
    readouts:
    - name: Deep-layer neuron proportion
      target: Cortical Hypoplasia and Disrupted Lamination
      direction: DECREASED
      description: >-
        Proportion of deep-layer neurons within the cortical plate of Bptf cKO
        versus control.
      interpretation: >-
        A reduced deep-layer fraction is the quantitative signature of the
        disrupted lamination this node asserts.
    - name: Ctip2-positive neuronal fate acquisition
      target: Cortical Hypoplasia and Disrupted Lamination
      direction: DECREASED
      biological_processes:
      - preferred_term: cerebral cortex neuron differentiation
        term:
          id: GO:0021895
          label: cerebral cortex neuron differentiation
      description: >-
        Acquisition of distinct cortical identities, indexed by Ctip2-positive
        neurons, in Bptf cKO versus control.
      interpretation: >-
        Impaired fate acquisition distinguishes a maturation defect from simple
        cell loss.
    limitations: >-
      The model is a homozygous conditional null restricted to the forebrain,
      not a heterozygous haploinsufficiency model, and heterozygous animals were
      reported to have little to no phenotype. Its severe cortical hypoplasia is
      therefore a complete-loss phenotype whose quantitative relationship to the
      human half-dosage disease is unresolved. This is the substance of the
      `bptf_mouse_homozygous_vs_human_haploinsufficiency` HUMAN_MODEL_MISMATCH
      discussion, which attaches to this same node.
    evidence:
    - reference: PMID:35604347
      reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cortical lamination was also disrupted with reduced proportions of deep
        layer neurons, and neuronal maturation defects that impaired the
        acquisition of distinct cell fates
      explanation: >-
        Documents the laminar and cell-fate facets of the node that the model
        reproduces.
  evidence:
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To model the NEDDFL syndrome, we generated forebrain-specific Bptf
      knockout (Bptf conditional Knockout (cKO)) mice.
    explanation: >-
      Establishes the model's purpose and construction.
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, ablation of Smarca1 resulted in mice with enlarged brains, a
      direct contrast to the phenotype of NEDDFL patients.
    explanation: >-
      Records the SMARCA1 discordance that limits inference from NURF ATPase
      knockouts to BPTF haploinsufficiency.

- name: bptf CRISPR F0 crispant zebrafish
  species: Danio rerio
  genotype: CRISPR-Cas9 bptf F0 crispant
  category: CRISPR F0 knockout zebrafish model
  description: >-
    CRISPR-Cas9 knockout of zebrafish bptf produces F0 mutant larvae with
    significantly reduced head size, increased apoptosis by TUNEL staining, and
    a substantially increased ceratohyal angle indicating abnormal craniofacial
    patterning (PMID:28942966). This model recapitulates both the microcephaly
    and the craniofacial dimensions of NEDDFL.
  modeled_mechanisms:
  - target: Postnatal Microcephaly and Growth Restriction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced head size in bptf F0 larvae is the cross-species correlate of the
      human microcephaly.
    readouts:
    - name: Larval head size
      target: Postnatal Microcephaly and Growth Restriction
      direction: DECREASED
      description: >-
        Head size of bptf F0 crispant larvae versus control larvae.
      interpretation: >-
        Significantly reduced head size is the model's microcephaly readout; it
        indexes reduced brain growth but not the postnatal timing of the human
        phenotype.
    limitations: >-
      Only partially recapitulates the human node. The zebrafish readout is
      larval head size in a complete loss-of-function crispant, so it captures
      reduced brain growth but not the defining postnatal (secondary) timing of
      the human microcephaly, and it says nothing about the accompanying somatic
      growth restriction, short stature, or growth hormone deficiency.
    evidence:
    - reference: PMID:28942966
      reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using CRISPR-Cas9 genome editing of bptf in zebrafish to induce a loss of
        gene function, we observed a significant reduction in head size of F0
        mutants compared to control larvae.
      explanation: >-
        Reduced head size is the model's microcephaly readout; PARTIAL because
        larval head size does not capture the postnatal timing or the somatic
        growth arm of the human node.
  - target: Disrupted Craniofacial and Limb Patterning
    relationship: RECAPITULATES
    description: >-
      Increased ceratohyal angle is an established quantitative readout of
      disrupted craniofacial patterning, and is the direct experimental support
      for the craniofacial arm of this node.
    readouts:
    - name: Ceratohyal angle
      target: Disrupted Craniofacial and Limb Patterning
      direction: INCREASED
      description: >-
        Angle of the ceratohyal cartilage of the craniofacial skeleton in bptf
        F0 crispants versus controls.
      interpretation: >-
        A substantially widened ceratohyal angle is the established quantitative
        index of abnormal craniofacial patterning in zebrafish.
    limitations: >-
      Supports the craniofacial arm only. No model has yet demonstrated the
      distal limb arm of this node, which is why the node is marked PROVISIONAL.
    evidence:
    - reference: PMID:28942966
      reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we observed a substantial increase of the ceratohyal angle of the
        craniofacial skeleton in bptf F0 mutants, indicating abnormal craniofacial
        patterning
      explanation: >-
        Direct experimental demonstration of disrupted craniofacial patterning on
        bptf loss.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using CRISPR-Cas9 genome editing of bptf in zebrafish to induce a loss of
      gene function, we observed a significant reduction in head size of F0
      mutants compared to control larvae.
    explanation: >-
      Establishes the zebrafish model and its microcephaly readout.

- name: Constitutive Bptf-null mouse embryo
  species: Mus musculus
  genotype: Constitutive Bptf-null (gene-trap) embryo
  category: Constitutive null mouse embryo
  description: >-
    Constitutive Bptf mouse mutants manifest growth defects at the
    post-implantation stage and are resorbed by E8.5, failing to establish a
    functional distal visceral endoderm (PMID:18974875). This establishes Bptf
    as essential for early mammalian development and is the basis for the
    anterior-posterior axis role cited in the human disease literature.
  modeled_mechanisms:
  - target: BPTF Haploinsufficiency
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Establishes that Bptf dosage is developmentally critical in a mammal,
      which is the premise that makes a 50% reduction a credible human disease
      mechanism.
    readouts:
    - name: Post-implantation embryonic survival
      target: BPTF Haploinsufficiency
      direction: DECREASED
      description: >-
        Survival of constitutive Bptf-null embryos, which show post-implantation
        growth defects and are resorbed by E8.5.
      interpretation: >-
        Complete loss is embryonic-lethal, establishing Bptf as dosage-critical;
        it does not measure the heterozygous state this node describes.
    limitations: >-
      Low fidelity to the human node. This is a constitutive homozygous null
      causing embryonic lethality by E8.5, two dosage steps away from the human
      heterozygous, viable, postnatally manifesting disorder. It demonstrates
      gene essentiality, not the consequences of haploinsufficiency, and no
      heterozygous phenotype is reported.
    evidence:
    - reference: PMID:18974875
      reference_title: "Essential role of chromatin remodeling protein Bptf in early mouse embryos and embryonic stem cells."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Bptf mutants manifest growth defects at the post-implantation stage and
        are reabsorbed by E8.5.
      explanation: >-
        Demonstrates embryonic essentiality of Bptf; PARTIAL with respect to the
        haploinsufficiency node because the genotype is a homozygous null.
  evidence:
  - reference: PMID:18974875
    reference_title: "Essential role of chromatin remodeling protein Bptf in early mouse embryos and embryonic stem cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Bptf mutants manifest growth defects at the post-implantation stage and
      are reabsorbed by E8.5.
    explanation: >-
      Establishes the embryonic essentiality of Bptf that makes heterozygous
      dosage reduction plausible as a human disease mechanism.
diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    First-line testing for unexplained syndromic developmental delay or
    intellectual disability. Trio exome sequencing (or genome sequencing, which
    combines sequence and structural-variant detection) with copy-number calling
    is the highest-yield route to a NEDDFL diagnosis, and is how most reported
    individuals were ascertained. Trio design matters here because the majority
    of pathogenic BPTF variants are de novo, and parental testing is what
    distinguishes a de novo variant from the transmitted alleles documented in
    four families.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular testing results from exome sequencing, chromosomal microarray,
      or next‐generation sequencing panel were submitted by patients'
      healthcare providers
    explanation: >-
      Documents the diagnostic modalities through which the 26-individual
      expansion cohort was actually ascertained.
  - reference: PMID:40415676
    reference_title: "Effects of the Missense Variants on Complete Phenotype and Splicing Variant on Severe Growth Retardation in the BPTF Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BPTF gene variants were detected using whole-exome sequencing. Family
      segregation analysis was performed using sanger sequencing.
    explanation: >-
      Independent series confirming exome sequencing as the detection method,
      with Sanger segregation analysis in the family.
  - reference: PMID:36153657
    reference_title: "The effect of growth hormone treatment in children with novel BPTF gene variants: A report of two cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The exome sequencing was performed in two probands. Sanger sequencing was
      used to confirm the identified variants both in probands and their parents.
    explanation: >-
      Shows the standard workflow of exome discovery plus Sanger confirmation in
      proband and parents.

- name: Chromosomal Microarray for 17q24.2 Copy-Number Variants
  description: >-
    Chromosomal microarray remains informative because a meaningful share of the
    reported allelic spectrum is copy-number: single-exon and whole-gene BPTF
    deletions, larger 17q24.2 deletions, and a chromosomal translocation
    disrupting the gene. Microarray was part of the ascertainment of the
    founding and expansion cohorts. A larger 17q24.2 deletion should be
    interpreted as a potential contiguous-gene event rather than attributed to
    BPTF alone.
  diagnosis_term:
    preferred_term: chromosomal microarray (array comparative genomic hybridization)
    term:
      id: NCIT:C18084
      label: Comparative Genomic Hybridization
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report eight loss-of-function and two missense variants (eight de novo
      and two of unknown origin) in BPTF on 17q24.2
    explanation: >-
      Establishes the 17q24.2 locus that copy-number testing must cover.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular testing results from exome sequencing, chromosomal microarray,
      or next‐generation sequencing panel were submitted by patients'
      healthcare providers
    explanation: >-
      Confirms chromosomal microarray as one of the modalities that identified
      individuals in the expansion cohort.

- name: ACMG/AMP Variant Interpretation with Parental Testing
  description: >-
    Diagnosis requires a compatible phenotype plus a BPTF variant classified
    under ACMG/AMP criteria, supported by parental testing, phenotype match,
    population frequency, and predicted loss of function. In the expansion
    cohort, 20 variants were classified as 11 pathogenic, 7 likely pathogenic,
    and 2 VUS. Truncating and copy-number alleles are straightforward because
    loss of function is the established mechanism; missense alleles are the hard
    case and a missense VUS alone does not establish the diagnosis. That caution
    is not merely theoretical: severely affected missense carriers have since
    been reported (PMID:40415676), so a missense VUS can be neither dismissed
    nor accepted on phenotype severity alone.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants were interpreted as pathogenic (11), likely pathogenic (7), or VUS
      (2) based on the current ACMG criteria.
    explanation: >-
      Documents ACMG/AMP classification as the interpretation framework and the
      residual VUS rate.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is anticipated that the finding of missense variants in BPTF may present
      a diagnostic challenge for practitioners, particularly in individuals with
      mild phenotypes
    explanation: >-
      The authors flag missense variants as the principal interpretation
      difficulty, supporting the caution that a missense VUS alone is not
      diagnostic.
  notes: >-
    Explicit negatives, recorded so their absence is not mistaken for a curation
    gap. (1) There are no formal consensus diagnostic criteria for NEDDFL;
    diagnosis is a compatible phenotype plus molecular confirmation. (2) There is
    no diagnostic biochemical, enzymatic, imaging, or circulating biomarker - a
    normal brain MRI in particular does not exclude the diagnosis, since most
    imaged individuals in the expansion cohort had normal studies. (3) No
    validated functional assay and no DNA-methylation episignature has been
    established for BPTF, despite NEDDFL being a chromatinopathy where an
    episignature might be expected; RNA sequencing and proteomics for resolving
    difficult variants remain investigational. (4) No newborn or general
    population screening exists; cascade testing is appropriate once a familial
    pathogenic variant is known.

differential_diagnoses:
- name: Neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies (ZMIZ1)
  disease_term:
    preferred_term: NEDDFSA
    term:
      id: MONDO:0032855
      label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
  description: >-
    A separate autosomal dominant neurodevelopmental entity caused by
    heterozygous ZMIZ1 variants. Its MONDO label differs from this disorder's by
    a single word ("skeletal" versus "limb"), which makes it the single highest
    named-entity-confusion risk for NEDDFL in any label- or text-based search.
  distinguishing_features:
  - >-
    Molecular: ZMIZ1 versus BPTF (hgnc:3581). The gene is the only reliable
    discriminator; confirm the causative gene before importing any cohort data
    published under either "dysmorphic facies and distal ... anomalies" phrasing.
  - >-
    Nomenclature: the near-identical labels are the hazard, not the phenotypes.
    Both are dominant neurodevelopmental syndromes with dysmorphism and distal
    appendicular findings.
  notes: >-
    No literature evidence item is attached here deliberately: the point of this
    record is the identity distinction, which is established by the MONDO/OMIM
    identifiers themselves rather than by a phenotype claim. Adding a ZMIZ1
    cohort citation to a BPTF entry would reintroduce exactly the confusion this
    record exists to prevent.

- name: OTUD6B-related intellectual developmental disorder with dysmorphic facies, seizures and distal limb anomalies
  disease_term:
    preferred_term: IDDFSDA
    term:
      id: MONDO:0044319
      label: intellectual developmental disorder with dysmorphic facies, seizures, and distal limb anomalies
  description: >-
    An ultra-rare autosomal recessive multisystem disorder caused by biallelic
    OTUD6B variants (OMIM:617452), a ubiquitin-proteasome-system disorder of
    development. It shares the "dysmorphic facies ... and distal limb anomalies"
    phrasing with NEDDFL and overlaps clinically (developmental delay,
    microcephaly, dysmorphism, distal limb findings), but is mechanistically and
    genetically distinct.
  distinguishing_features:
  - >-
    Inheritance: biallelic and autosomal recessive (OTUD6B) versus heterozygous
    and autosomal dominant, typically de novo (BPTF). The inheritance mode alone
    separates them in almost every family.
  - >-
    Mechanism: impaired 26S proteasome assembly and reduced chymotrypsin-like
    proteasome activity (OTUD6B) versus impaired NURF ATP-dependent chromatin
    remodeling (BPTF).
  - >-
    Seizures are a defining, near-universal feature of the OTUD6B disorder and
    are named in its label, whereas in NEDDFL epilepsy occurs in a minority
    (about 19%) and was absent from the original clinical description.
  notes: >-
    The dismech OTUD6B entry carries the reciprocal NEC guardrail and
    deliberately excludes PMID:33522091 from all of its claims because that
    paper describes NEDDFL. The exclusion is honoured in the opposite direction
    here: no OTUD6B-specific citation is used anywhere in this BPTF entry.
  evidence:
  - reference: PMID:38936258
    reference_title: "Epilepsy as a Novel Phenotype of BPTF-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy was not included in the initial descriptions of NEDDFL, but
      emerging evidence indicates that epileptic seizures occur in some affected
      individuals.
    explanation: >-
      Supports the distinguishing feature that seizures are a late-recognized,
      minority finding in NEDDFL, unlike the OTUD6B disorder in which seizures
      are part of the disease name and the defining phenotype.

- name: Silver-Russell syndrome
  description: >-
    A clinical phenocopy hazard rather than a nomenclature hazard: the
    combination of small-for-gestational-age birth, poor postnatal growth,
    a small triangular face, and feeding difficulty can prompt an initial
    diagnosis of Silver-Russell syndrome in a child later found to have BPTF
    disruption. At least one adult carried the Silver-Russell label for 35 years
    before BPTF disruption was identified.
  distinguishing_features:
  - >-
    NEDDFL has postnatal (secondary) microcephaly, whereas relative macrocephaly
    for body size is characteristic of Silver-Russell syndrome.
  - >-
    NEDDFL has prominent speech delay and intellectual disability; cognition is
    typically preserved or only mildly affected in Silver-Russell syndrome.
  - >-
    Silver-Russell syndrome is most often caused by 11p15 loss of methylation or
    maternal uniparental disomy of chromosome 7, neither of which involves BPTF.
  notes: >-
    Recorded on the basis of the published case title (PMID:30633344,
    "Neurodevelopmental disorder with dysmorphic facies and distal limb
    anomalies syndrome due to disruption of BPTF in a 35-year-old man initially
    diagnosed with Silver-Russell syndrome"). No evidence item is attached
    because no abstract text is available for that reference in the reference
    cache, and dismech policy forbids quoting text that cannot be verified
    against a cached source.

discussions:
- discussion_id: bptf_vs_smarca1_dosage_paradox
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does BPTF haploinsufficiency cause microcephaly when loss of its NURF
    ATPase partner SMARCA1/SNF2L causes brain overgrowth?
  attaches_to:
  - pathophysiology#Impaired NURF Chromatin-Remodeling Activity
  rationale: >-
    The simplest model of NEDDFL is that reduced BPTF impairs NURF, and impaired
    NURF impairs cortical neurogenesis. That model predicts that removing the
    NURF catalytic ATPase should phenocopy BPTF loss. It does not: Smarca1-null
    mice have enlarged brains, the direct opposite of the NEDDFL phenotype. This
    means either that BPTF has NURF-independent functions in the developing
    cortex, or that the two subunits have opposing dosage effects on the same
    complex, or that SNF2H-containing complexes compensate for Smarca1 loss but
    not for Bptf loss. Which of these is true determines whether NURF is
    actually the right therapeutic target concept for NEDDFL.
  proposed_experiments:
  - experiment_id: bptf_smarca1_side_by_side_cortex
    name: Side-by-side cortical comparison of Bptf and Smarca1 conditional knockouts
    description: >-
      Compare cortical transcriptomes and progenitor kinetics side by side in
      forebrain-conditional Bptf and Smarca1 knockouts on the same genetic
      background, to determine whether the dysregulated gene sets overlap or
      diverge.
  - experiment_id: bptf_snf2l_cooccupancy_map
    name: BPTF and SNF2L chromatin co-occupancy mapping in cortical progenitors
    description: >-
      Map BPTF chromatin occupancy in cortical progenitors and ask what fraction
      of BPTF-bound sites are also SNF2L-bound, to quantify the size of the
      NURF-independent BPTF binding compartment.
  - experiment_id: bptf_myc_axis_microcephaly_test
    name: Test whether the BPTF-MYC axis accounts for the Bptf-specific microcephaly
    description: >-
      Test whether the NURF-independent BPTF interactome, including the MYC
      cofactor axis identified by RNA-seq binding-site enrichment, accounts for
      the microcephaly that Smarca1 loss fails to reproduce.
  evidence:
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, ablation of Smarca1 resulted in mice with enlarged brains, a
      direct contrast to the phenotype of NEDDFL patients.
    explanation: >-
      This is the observation that creates the gap: the NURF ATPase knockout
      gives the opposite brain-size phenotype to BPTF loss.

- discussion_id: bptf_mouse_homozygous_vs_human_haploinsufficiency
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the homozygous forebrain-conditional Bptf knockout mouse faithfully
    model human BPTF haploinsufficiency, given that heterozygous animals show
    little to no phenotype?
  attaches_to:
  - pathophysiology#Cortical Hypoplasia and Disrupted Lamination
  rationale: >-
    Human NEDDFL is a heterozygous, dosage-sensitivity disorder: one null allele
    produces microcephaly, intellectual disability, and speech delay. The
    principal mouse model is a homozygous conditional null restricted to the
    forebrain, and heterozygous mice were reported to have little to no
    phenotype. The mouse's severe cortical hypoplasia is therefore a
    complete-loss phenotype, not a half-dosage phenotype, and the cellular
    mechanism it reveals (prolonged progenitor cell cycle, increased apoptosis,
    lamination failure) may be quantitatively or qualitatively different from
    what a 50% reduction produces in a human cortex. The species difference in
    dosage sensitivity is itself the open question. This is a translational
    validity problem, not an absence of evidence, hence HUMAN_MODEL_MISMATCH
    rather than KNOWLEDGE_GAP.
  proposed_experiments:
  - experiment_id: bptf_het_mouse_deep_phenotyping
    name: Deep cortical phenotyping of Bptf heterozygous mice
    description: >-
      Phenotype Bptf heterozygous mice quantitatively for cortical volume,
      laminar composition, and progenitor kinetics rather than by gross
      inspection, to establish whether a subtle half-dosage phenotype exists.
  - experiment_id: bptf_het_ipsc_cortical_organoid
    name: Isogenic heterozygous BPTF-null human cortical organoids
    description: >-
      Derive isogenic human iPSC lines carrying patient BPTF null alleles in the
      heterozygous state and assay cortical organoid size, progenitor cell cycle
      length, and deep-layer neuron output against isogenic controls.
  - experiment_id: bptf_dosage_response_cross_species
    name: Cross-species BPTF dosage-response comparison
    description: >-
      Compare BPTF dosage-response curves for NURF assembly and target-gene
      expression between mouse and human cortical progenitors, to test whether
      the human system is simply steeper.
  evidence:
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To model the NEDDFL syndrome, we generated forebrain-specific Bptf
      knockout (Bptf conditional Knockout (cKO)) mice.
    explanation: >-
      Identifies the model whose homozygous conditional-null design is the
      source of the mismatch with the human heterozygous disorder.

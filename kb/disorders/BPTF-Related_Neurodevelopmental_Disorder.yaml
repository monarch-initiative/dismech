    be FREQUENT. The conservative strict-criteria band is recorded here. Note
    also that the series was recruited with a focus on gastrointestinal
    symptoms, so ascertainment may inflate the fraction.
  evidence:
  - reference: PMID:40614698
    reference_title: "Cyclical Vomiting Syndrome in Individuals With BPTF Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 15 individuals with likely pathogenic/pathogenic BPTF variants

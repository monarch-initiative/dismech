inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    NEDDFL results from a heterozygous loss-of-function allele of BPTF; the gene
    is dosage-sensitive and a single null allele is sufficient to cause disease.
    Most reported variants arose de novo, but transmission from a mildly
    affected parent has been documented in four families, establishing autosomal
    dominant inheritance with variable expressivity rather than exclusively
    de novo occurrence. Transmitting parents range from isolated microcephaly
    without reported developmental delay, through learning disability with
    independent adult function, to a phenotype comparable to that of the
    proband. Penetrance has not been quantified.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report eight loss-of-function and two missense variants (eight de novo
      and two of unknown origin) in BPTF on 17q24.2
    explanation: >-
      Establishes heterozygous, predominantly de novo variation at a single
      locus as the molecular basis, consistent with autosomal dominant
      inheritance.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study has also uncovered four cases of inherited BPTF variants,
      providing some insight into the penetrance and expressivity of NEDDFL.
    explanation: >-
      Documented parent-to-child transmission confirms dominant inheritance and
      demonstrates that the disorder is not exclusively de novo.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histories reported in these patients and the presence of inherited
      pathogenic variants in BPTF do suggest a pattern of variable expressivity
      in NEDDFL.
    explanation: >-
      Directly supports the recorded VARIABLE expressivity of the dominant
      allele.

genetic:
- name: BPTF
  gene_term:
    preferred_term: BPTF
    term:
      id: hgnc:3581
      label: BPTF
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Heterozygous loss-of-function variants in BPTF (17q24.2) are the sole known
    cause of NEDDFL, acting through an autosomal dominant, haploinsufficiency
    mechanism. The reported allelic spectrum is dominated by truncating/null
    alleles (frameshift, nonsense, splice-site, whole-gene and single-exon
    copy-number deletions, and a translocation disrupting the gene); a minority
    of missense alleles has been reported, historically associated with milder
    phenotypes although recent reports include severely affected missense
    carriers.
  notes: >-
    `variant_origin: GERMLINE` is deliberate and covers both arms of the
    reported allelic spectrum. The majority of variants are de novo, but four
    families with transmission from a non-mosaic affected parent are documented
    (PMID:33522091 reports 14 de novo and four inherited among 20 variants), so
    tagging the gene entry `DE_NOVO` would contradict the inherited arm recorded
    in `association`, in the disease-level `inheritance` block, and in the
    Genetic Counseling treatment. GERMLINE is true of every constitutional
    variant in both arms; the de novo/inherited split is quantified with its own
    cited evidence rather than compressed into this enum.

    Variant nomenclature in the literature uses the NM_004459.6 transcript
    (some later reports use NM_182641.4). No recurrent hotspot variant has been
    described; reported variants are distributed throughout the gene. Somatic
    BPTF alterations reported in cancer biology are a distinct literature and
    must not be conflated with the constitutional disorder.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report eight loss-of-function and two missense variants (eight de novo
      and two of unknown origin) in BPTF on 17q24.2
    explanation: >-
      Establishes BPTF at 17q24.2 as the causative locus and shows the
      loss-of-function-dominant allelic spectrum.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our analysis identified 20 novel, distinct variants in BPTF (Table 1)
      distributed throughout the gene (Figure 1), including 14 de novo and four
      inherited.
    explanation: >-
      Confirms the absence of a mutational hotspot and quantifies the de novo
      versus inherited split.
  - reference: PMID:40415676
    reference_title: "Effects of the Missense Variants on Complete Phenotype and Splicing Variant on Severe Growth Retardation in the BPTF Gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected two novel missense variants in patients presenting all
      phenotypic characteristics of the BPTF-related NEDDFL syndrome severely,
      including severe ID, distinctive facial features, and anomalies of the
      hands and feet.
    explanation: >-
      Qualifies the historical assumption that missense alleles are uniformly
      mild; this is a small four-case series, hence PARTIAL.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only 36 individuals had been reported when PMID:36153657 was written (2022);
    subsequent series (PMID:38936258, PMID:40614698, PMID:40415676) have added
    further individuals, but the total remains in the low hundreds at most. No
    population-based prevalence estimate exists.
  evidence:
  - reference: PMID:36153657
    reference_title: "The effect of growth hormone treatment in children with novel BPTF gene variants: A report of two cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, there are only 36 cases reported in the literature, and patients
      mainly presented with a developmental delay, language delay, and
      microcephaly.
    explanation: >-
      Provides the published case count underpinning the ultra-rare
      classification.
  - reference: PMID:40415676
    reference_title: "Effects of the Missense Variants on Complete Phenotype and Splicing Variant on Severe Growth Retardation in the BPTF Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurodevelopmental disorder with dysmorphic facies and distal limb
      anomalies (NEDDFL, OMIM no #617755) is an ultra-rare syndrome associated
      with heterozygous pathogenic variants in the BPTF gene.
    explanation: >-
      Independent characterization of the disorder as ultra-rare.

pathophysiology:
- name: BPTF Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous loss-of-function allele of BPTF at 17q24.2 (frameshift,
    nonsense, splice-site, exonic or whole-gene deletion, or gene-disrupting
    translocation) halves functional BPTF protein dosage. BPTF is
    dosage-sensitive: unlike many chromatin genes, one null allele produces overt
    human disease, and BPTF is the NURF-exclusive subunit, so its loss cannot be
    compensated by the other ISWI complexes that share the SNF2L/SNF2H ATPases.
  gene:
    preferred_term: BPTF
    term:
      id: hgnc:3581
      label: BPTF
  downstream:
  - target: Impaired NURF Chromatin-Remodeling Activity
    causal_link_type: DIRECT
    description: >-
      Reduced BPTF protein lowers the amount of assembled, chromatin-engaged
      NURF and its recruitment of the SNF2L ATPase to target promoters.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our data demonstrate the pathogenic role of BPTF haploinsufficiency in
      syndromic neurodevelopmental anomalies and extend the clinical spectrum
      of human disorders caused by ablation of chromatin remodeling complexes
    explanation: >-
      States haploinsufficiency as the disease mechanism.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency of BPTF in humans leads to the clinical entity known as
      neurodevelopmental disorder with dysmorphic facies and distal limb
      anomalies (NEDDFL, MIM#617755).
    explanation: >-
      Links reduced BPTF dosage directly to the named clinical entity.

- name: Impaired NURF Chromatin-Remodeling Activity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    BPTF is the largest subunit of NURF, an ISWI-family ATP-dependent
    chromatin-remodeling complex containing the SNF2L/SMARCA1 ATPase. BPTF reads
    active-chromatin marks - H3K4me3 through its PHD finger and H4K16ac through
    its bromodomain - and this reading is what tethers NURF to active promoters
    and delivers the SNF2L ATPase there for nucleosome sliding. When BPTF is
    reduced, NURF occupancy at H3K4me3-marked promoters falls and ATP-dependent
    nucleosome repositioning at those promoters is impaired.
  biological_processes:
  - preferred_term: ATP-dependent chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: DECREASED
  molecular_functions:
  - preferred_term: BPTF PHD finger reading of H3K4me3
    term:
      id: GO:0140002
      label: histone H3K4me3 reader activity
    modifier: DECREASED
  - preferred_term: NURF nucleosome sliding
    term:
      id: GO:0140750
      label: nucleosome array spacer activity
    modifier: DECREASED
  downstream:
  - target: Dysregulated Developmental Gene Transcription
    causal_link_type: DIRECT
    description: >-
      Loss of NURF-mediated nucleosome remodeling at developmental promoters
      changes the transcriptional output of those genes.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bromodomain PHD finger transcription factor (BPTF) is the largest subunit
      of nucleosome remodeling factor (NURF), a member of the ISWI
      chromatin-remodeling complex.
    explanation: >-
      Establishes BPTF's identity as the largest NURF subunit within the ISWI
      family.
  - reference: PMID:16728976
    reference_title: "A PHD finger of NURF couples histone H3 lysine 4 trimethylation with chromatin remodelling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that a plant homeodomain (PHD) finger of nucleosome
      remodelling factor (NURF), an ISWI-containing ATP-dependent
      chromatin-remodelling complex, mediates a direct preferential association
      with H3K4me3 tails.
    explanation: >-
      Defines the molecular reader function of the BPTF PHD finger that is lost
      when BPTF dosage falls.
  - reference: PMID:16728976
    reference_title: "A PHD finger of NURF couples histone H3 lysine 4 trimethylation with chromatin remodelling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of H3K4me3 causes partial release of the NURF subunit, BPTF
      (bromodomain and PHD finger transcription factor), from chromatin and
      defective recruitment of the associated ATPase, SNF2L (also known as ISWI
      and SMARCA1), to the HOXC8 promoter.
    explanation: >-
      Demonstrates the mechanistic coupling between BPTF chromatin engagement
      and delivery of the SNF2L remodeling ATPase to a developmental promoter.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BPTF in particular facilitates this interaction by the preferential
      binding of its plant homeodomain (PHD) finger to the tails of the
      trimethylated lysine 4 of histone H3 (H3K4me3) and binding of its
      bromodomain to the acetylated lysine 16 of histone H4 (H4K16ac)
    explanation: >-
      Records both reader modules of BPTF in the disease-specific literature.

- name: Dysregulated Developmental Gene Transcription
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    NURF target genes are enriched for developmental regulators. Loss of BPTF
    misregulates homeobox/HOX transcription factors, SMAD-pathway targets, and
    fate-determining transcription factors; dysregulated genes in the Bptf
    conditional-knockout mouse cortex are enriched for MYC binding sites, MYC
    being a known BPTF transcriptional cofactor. The consequence is not global
    transcriptional collapse but loss of correct spatial and temporal control of
    a developmental gene program.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  - preferred_term: anterior/posterior pattern specification
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
    modifier: ABNORMAL
  downstream:
  - target: Neural Progenitor Cell-Cycle Prolongation and Apoptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Misexpression of fate-determining transcription factors and
      apoptotic-signaling pathway genes impairs progenitor proliferation and
      survival.
  - target: Disrupted Craniofacial and Limb Patterning
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of correct HOX/homeobox spatial patterning perturbs craniofacial and
      distal limb morphogenesis.
  evidence:
  - reference: PMID:16728976
    reference_title: "A PHD finger of NURF couples histone H3 lysine 4 trimethylation with chromatin remodelling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of BPTF in Xenopus embryos mimics WDR5 loss-of-function phenotypes,
      and compromises spatial control of Hox gene expression.
    explanation: >-
      Directly demonstrates that BPTF loss dysregulates spatial developmental
      gene expression in a vertebrate embryo.
  - reference: PMID:18974875
    reference_title: "Essential role of chromatin remodeling protein Bptf in early mouse embryos and embryonic stem cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Microarray analysis at early stages of differentiation has identified
      Bptf-dependent gene targets including homeobox transcriptions factors and
      genes essential for the development of ectoderm, mesoderm, and both
      definitive and visceral endoderm.
    explanation: >-
      Identifies homeobox transcription factors and germ-layer developmental
      genes as the transcriptional targets that depend on Bptf.
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNAseq and pathway analysis identified altered expression of
      fate-determining transcription factors and the biological pathways
      involved in neural development, apoptotic signaling and amino acid
      biosynthesis.
    explanation: >-
      In the disease-specific forebrain Bptf knockout, the transcriptional
      consequence is misexpression of fate-determining transcription factors and
      neural-development/apoptosis pathways.
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dysregulated genes were enriched for MYC Proto-Oncogene, BHLH
      Transcription Factor (Myc)-binding sites, a known BPTF transcriptional
      cofactor.
    explanation: >-
      Identifies the MYC cofactor axis as a route by which BPTF loss
      redistributes transcriptional output.

- name: Neural Progenitor Cell-Cycle Prolongation and Apoptosis
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    In the developing forebrain, loss of Bptf prolongs neural progenitor cell
    cycle length and raises the incidence of programmed cell death, so fewer
    neurons are produced from the progenitor pool. Independently, CRISPR
    knockout of bptf in zebrafish increases apoptosis (TUNEL) in the developing
    head. Reduced neuronal output from a depleted and slow-cycling progenitor
    pool is the proximate cellular cause of the reduced brain size.
  cell_types:
  - preferred_term: cortical neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  - preferred_term: cell cycle
    term:
      id: GO:0007049
      label: cell cycle
    modifier: ABNORMAL
  downstream:
  - target: Cortical Hypoplasia and Disrupted Lamination
    causal_link_type: DIRECT
    description: >-
      Reduced neuronal output from a slow-cycling, apoptosis-prone progenitor
      pool yields a hypoplastic cortex.
  evidence:
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Prolonged progenitor cell cycle length and a high incidence of cell death
      reduced the neuronal output.
    explanation: >-
      Direct statement of the cellular mechanism in the disease-specific
      forebrain-conditional Bptf knockout mouse.
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      showed a significant increase in cell death in F0 mutants compared to
      controls
    explanation: >-
      Independent, cross-species (zebrafish) confirmation that bptf loss
      increases apoptosis during neurodevelopment.

- name: Cortical Hypoplasia and Disrupted Lamination
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced neuronal output produces severe cortical hypoplasia with a disrupted
    laminar architecture: the proportion of deep-layer neurons is reduced and
    neuronal maturation defects impair the acquisition of distinct cortical cell
    fates such as Ctip2-positive identity. This is the tissue-level substrate of
    the postnatal microcephaly and the mild structural brain abnormalities seen
    on human MRI.
  cell_types:
  - preferred_term: cortical projection neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: ABNORMAL
  - preferred_term: cerebral cortex neuron differentiation
    term:
      id: GO:0021895
      label: cerebral cortex neuron differentiation
    modifier: DECREASED
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  downstream:
  - target: Postnatal Microcephaly and Growth Restriction
    causal_link_type: DIRECT
  - target: Neurodevelopmental Impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A hypoplastic, mislaminated cortex with impaired neuronal fate acquisition
      underlies the cognitive, language, and motor phenotype.
  - target: Structural Brain Abnormality
    causal_link_type: DIRECT
    description: >-
      The hypoplastic, mislaminated cortex is what the mild non-specific
      structural changes on human brain MRI depict.
  - target: Epilepsy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A cortex built with reduced deep-layer neurons and impaired fate
      acquisition is an epileptogenic substrate, consistent with developmental
      delay preceding seizure onset. The circuit-level route from mislamination
      to seizures has not been established in NEDDFL, hence unknown
      intermediates.
  - target: EEG Abnormality
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same abnormal cortex produces interictal epileptiform discharges in
      individuals who never have clinical seizures.
  evidence:
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The Bptf cKO mice were born in normal Mendelian ratios, survived to
      adulthood but were smaller in size with severe cortical hypoplasia.
    explanation: >-
      Establishes cortical hypoplasia with reduced body size as the tissue-level
      phenotype of forebrain Bptf loss.
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cortical lamination was also disrupted with reduced proportions of deep
      layer neurons, and neuronal maturation defects that impaired the
      acquisition of distinct cell fates
    explanation: >-
      Documents the laminar and cell-fate component of the cortical phenotype.

- name: Disrupted Craniofacial and Limb Patterning
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Loss of BPTF-dependent spatial control of homeobox gene expression perturbs
    morphogenesis of the craniofacial skeleton and the distal limb. In zebrafish
    bptf F0 mutants the ceratohyal angle of the craniofacial skeleton is
    substantially increased, an established readout of abnormal craniofacial
    patterning. In humans the corresponding findings are the mild dysmorphic
    facial gestalt and the distal limb anomalies (cutaneous toe syndactyly,
    sandal gap, fifth-finger clinodactyly) that name the syndrome. The mechanism
    connecting BPTF dosage to the specific human limb findings has not been
    directly demonstrated and is inferred from the patterning role of NURF, so
    this node is marked PROVISIONAL.
  biological_processes:
  - preferred_term: embryonic skeletal system morphogenesis
    term:
      id: GO:0048704
      label: embryonic skeletal system morphogenesis
    modifier: ABNORMAL
  - preferred_term: embryonic limb morphogenesis
    term:
      id: GO:0030326
      label: embryonic limb morphogenesis
    modifier: ABNORMAL
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  downstream:
  - target: Dysmorphic Facial Features
    causal_link_type: DIRECT
    description: >-
      Disrupted cranial neural crest patterning of the facial skeleton is
      expressed as the mild recognizable facial gestalt.
  - target: Distal Limb Anomalies
    causal_link_type: DIRECT
    description: >-
      The same patterning perturbation in the autopod is expressed as the mild
      hand and foot anomalies that name the syndrome. Inherits this node's
      PROVISIONAL status: the limb arm is inferred from the patterning role of
      NURF and has not been directly demonstrated.
  notes: >-
    No causal edge is drawn from this node to Neurodevelopmental Impairment.
    The dysmorphic and distal limb findings co-segregate with the
    neurodevelopmental phenotype as parallel outputs of one upstream lesion;
    they do not cause it. Both branches are already reachable from
    Dysregulated Developmental Gene Transcription, so the pathograph loses no
    connectivity by omitting an edge that the evidence does not support.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we observed a substantial increase of the ceratohyal angle of the
      craniofacial skeleton in bptf F0 mutants, indicating abnormal craniofacial
      patterning
    explanation: >-
      Experimental demonstration that bptf loss disrupts craniofacial
      patterning, the model-organism correlate of the human dysmorphic facies.
  - reference: PMID:16728976
    reference_title: "A PHD finger of NURF couples histone H3 lysine 4 trimethylation with chromatin remodelling."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      NURF-mediated ATP-dependent chromatin remodelling is directly coupled to
      H3K4 trimethylation to maintain Hox gene expression patterns during
      development
    explanation: >-
      Supplies the HOX-patterning link that makes limb and craniofacial
      patterning a plausible consequence of BPTF loss; indirect with respect to
      the human limb findings, hence PARTIAL.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanism for these abnormalities is less clear, though it is presumed
      that they are also derived from abnormal signaling during embryogenesis
      similar to the distal limb defects commonly described in these patients.
    explanation: >-
      The disease literature itself states the developmental-patterning
      inference is presumptive, which is why this node is PROVISIONAL.

- name: Postnatal Microcephaly and Growth Restriction
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced brain growth manifests as postnatal (secondary) microcephaly rather
    than congenital microcephaly in most individuals: head circumference is
    frequently normal at birth and falls below the third percentile over
    infancy and childhood. Reduced somatic growth accompanies it, with poor
    weight gain, malnutrition, and short stature; a subset has documented
    growth hormone deficiency.
  downstream:
  - target: Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced brain volume co-occurs with, and is a biomarker of, the underlying
      neurodevelopmental deficit.
  - target: Postnatal Microcephaly
    causal_link_type: DIRECT
    description: >-
      Reduced postnatal brain growth is measured clinically as a head
      circumference falling below the third percentile after birth.
  - target: Short Stature
    causal_link_type: DIRECT
    description: >-
      The somatic arm of the growth restriction presents as height below the
      third percentile, with growth hormone deficiency documented in a subset.
  - target: Poor Weight Gain and Malnutrition
    causal_link_type: DIRECT
    description: >-
      The same growth restriction presents as poor weight gain and moderate to
      severe malnutrition, compounded by the feeding difficulty.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      who manifest variable degrees of developmental delay/intellectual
      disability (10/10), speech delay (10/10), postnatal microcephaly (7/9),
      and dysmorphic features (9/10)
    explanation: >-
      Establishes the postnatal (rather than congenital) timing of the
      microcephaly in the founding cohort.
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using CRISPR-Cas9 genome editing of bptf in zebrafish to induce a loss of
      gene function, we observed a significant reduction in head size of F0
      mutants compared to control larvae.
    explanation: >-
      Model-organism recapitulation of reduced head size on bptf loss.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the time of their most recent clinical assessment, 5/20 (25%)
      individuals exhibited short stature for age and 10/19 (53%) individuals
      had decreased weight for age
    explanation: >-
      Quantifies the somatic growth restriction that accompanies the
      microcephaly.

- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The organism-level clinical output: global developmental delay and
    intellectual disability with disproportionate speech and language delay,
    motor delay, and hypotonia, spanning a wide severity range from severe
    impairment to mild learning difficulty compatible with independent adult
    life. In a minority, cortical excitability is sufficiently disturbed to
    produce early-childhood-onset epilepsy or isolated interictal epileptiform
    discharges; developmental delay precedes seizure onset, indicating that the
    epilepsy is a consequence of the abnormal cortex rather than its cause.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: DIRECT
    description: >-
      The impairment presents first as delayed attainment of milestones across
      all developmental domains.
  - target: Intellectual Disability
    causal_link_type: DIRECT
    description: >-
      The developmental delay matures into persisting cognitive impairment.
  - target: Delayed Speech and Language Development
    causal_link_type: DIRECT
    description: >-
      Speech and language are disproportionately affected relative to other
      domains, making this the most consistent single manifestation.
  - target: Motor Delay
    causal_link_type: DIRECT
    description: >-
      Gross and fine motor milestones are delayed alongside the cognitive and
      language domains.
  - target: Hypotonia
    causal_link_type: DIRECT
    description: >-
      Reduced muscle tone in infancy is part of the same impairment and
      contributes to the motor delay and feeding difficulty.
  notes: >-
    Phenotypes deliberately left unwired. Cyclical Vomiting Syndrome, the
    ophthalmologic group (Ophthalmologic Abnormalities, Exotropia, Myopia), and
    the axial/maturational skeletal findings (Scoliosis, Delayed Bone Age) are
    recorded clinically but have no established mechanistic route from any node
    in this pathograph, so no causal edge is asserted for them. The source
    literature is explicit that the skeletal mechanism "is less clear", and
    nothing connects BPTF dosage to cyclical vomiting or to the ocular findings
    beyond co-occurrence in the same individuals. Wiring them would manufacture
    causal claims the evidence does not carry; the same reasoning applied to the
    craniofacial/limb-to-neurodevelopment edge removed earlier in this entry.

    The remaining unwired phenotypes are unwired because they roll up under a
    parent that is wired, not because they lack a mechanism. Bulbous Nasal Tip,
    Prominent Nasal Bridge and Pointed Chin are sub-features of the wired
    Dysmorphic Facial Features; Sandal Gap and Fifth-Finger Clinodactyly are
    sub-features of the wired Distal Limb Anomalies; and Feeding Difficulties is
    already attributed to hypotonia in the Hypotonia edge description above.
    Between this paragraph and the previous one, every phenotype in this entry
    that carries no incoming causal edge is accounted for.
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common features included DD and/or ID (23/26, 88%), speech delay (22/26,
      85%), head circumference less than the third percentile for age (11/26,
      42%), motor delay (18/26, 69%), hypotonia (10/26, 38%), and dysmorphic
      features (20/26, 77%).
    explanation: >-
      Quantifies the organism-level clinical output across the largest
      single-study cohort.
  - reference: PMID:38936258
    reference_title: "Epilepsy as a Novel Phenotype of BPTF-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      developmental delay preceding seizure onset
    explanation: >-
      Establishes the temporal ordering that makes epilepsy a downstream
      consequence of the abnormal cortex rather than a driver of the
      developmental delay.


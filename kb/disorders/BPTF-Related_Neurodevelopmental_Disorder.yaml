- category: Skeletal
  name: Distal Limb Anomalies
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Distal limb anomalies (hands and feet)
    term:
      id: HP:0011297
      label: Abnormal digit morphology
  description: >-
    Mild anomalies of the hands and feet are one of the two features that name
    the syndrome. The recurrent findings are cutaneous 2-3 toe syndactyly,
    sandal gap, and fifth-finger clinodactyly; a subset also has limb-length
    discrepancy.
  notes: >-
    Frequency band from PMID:33522091, which reports skeletal abnormalities in
    50% (13/26) of the cohort -> FREQUENT. That denominator covers all skeletal
    findings (scoliosis and delayed bone age as well as distal limb anomalies);
    the pooled table in PMID:36153657 gives a higher 23/28 (82%) for skeletal
    abnormalities, but on a partial denominator, so the more conservative
    whole-cohort 50% is used. The individual distal-limb findings are curated as
    separate phenotypes below without bands, because they are reported only as
    raw counts within the skeletal-abnormality subgroup.

    Term-binding note: this is a deliberately group-level record, so it binds
    the parent term HP:0011297 Abnormal digit morphology rather than the
    specific HP:0010621 Cutaneous syndactyly of toes. Binding a specific child
    while carrying a frequency derived from an all-skeletal-findings denominator
    would over-claim that 50% of individuals have toe syndactyly specifically.
    The specific findings are curated separately below (Sandal Gap,
    Fifth-Finger Clinodactyly) and alongside (Scoliosis, Delayed Bone Age), so
    no specificity is lost.
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we also identified the presence of skeletal abnormalities in 50% (13/26)
      of individuals
    explanation: >-
      Supplies the whole-cohort skeletal-abnormality fraction underpinning the
      FREQUENT band.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to DDs, microcephaly, and distal limb defects, our cohort
      exhibited an increased frequency of ophthalmologic abnormalities, poor
      weight gain/poor feeding, and cutaneous syndactyly of the toes.
    explanation: >-
      Names cutaneous syndactyly of the toes as a recurrent distal limb finding.
  - reference: PMID:40415676

- name: Cortical Hypoplasia
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Forebrain-conditional Bptf-null mice have reduced cortical size from birth. Gross anatomy did not
    progressively worsen with age. This provides a developmental model for reduced brain growth, but most
    imaged individuals in the human expansion cohort had normal MRI and the remaining changes were heterogeneous.
    Mouse cortical hypoplasia cannot be equated with every human MRI abnormality or with a demonstrated
    cause of human epilepsy.
  cell_types:

    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we observed a substantial increase of the ceratohyal angle of the
      craniofacial skeleton in bptf F0 mutants, indicating abnormal craniofacial
      patterning
    explanation: >-
      Experimental demonstration that bptf loss disrupts craniofacial
      patterning, the model-organism correlate of the human dysmorphic facies.
  - reference: PMID:16728976
    reference_title: "A PHD finger of NURF couples histone H3 lysine 4 trimethylation with chromatin remodelling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NURF-mediated ATP-dependent chromatin remodelling is directly coupled to
      H3K4 trimethylation to maintain Hox gene expression patterns during
      development
    explanation: >-
      Supplies the HOX-patterning link that makes limb and craniofacial
      patterning a plausible consequence of BPTF loss; indirect with respect to
      the human limb findings, whose specific molecular route remains unproven.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanism for these abnormalities is less clear, though it is presumed
      that they are also derived from abnormal signaling during embryogenesis
      similar to the distal limb defects commonly described in these patients.
    explanation: >-
      The disease literature itself states the developmental-patterning
      inference is presumptive, which is why this node is PROVISIONAL.

- name: Reduced Brain Growth
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Microcephaly in BPTF-related disease can be congenital or emerge after birth. Reduced larval head
    size after zebrafish bptf disruption and cortical hypoplasia in conditional-null mice support a developmental
    contribution, but the exact cellular route in human heterozygous disease is unresolved. Microcephaly
    and neurodevelopmental impairment may share upstream causes; reduced head size does not itself establish
    the cause of cognitive impairment.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced brain growth provides a candidate basis for small head circumference across congenital
      and postnatal presentations; the precise human cellular mechanism remains unresolved.
  - target: Postnatal Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced postnatal brain growth is a plausible basis for secondary microcephaly documented in the
      founding cohort. This timing-specific phenotype is a subset of the general microcephaly finding.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      who manifest variable degrees of developmental delay/intellectual
      disability (10/10), speech delay (10/10), postnatal microcephaly (7/9),
      and dysmorphic features (9/10)
    explanation: >-
      Establishes the postnatal (rather than congenital) timing of the
      microcephaly in the founding cohort.
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using CRISPR-Cas9 genome editing of bptf in zebrafish to induce a loss of
      gene function, we observed a significant reduction in head size of F0
      mutants compared to control larvae.
    explanation: >-
      Model-organism recapitulation of reduced head size on bptf loss.
- name: Somatic Growth Impairment
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Short stature, low weight and feeding difficulty occur variably in human BPTF-related disease. Growth
    hormone deficiency was documented in two treated boys, but is not established as the explanation for
    all growth impairment. The connection between chromatin dysregulation and somatic growth remains uncertain
    and is separate from the brain-growth mechanism.
  downstream:
  - target: Short Stature
    causal_link_type: DIRECT
  - target: Poor Weight Gain and Malnutrition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Feeding difficulty and other factors may contribute; low weight alone does not establish growth
      velocity or a single causal pathway.
  - target: Decreased Body Weight
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Somatic growth impairment can present as low weight for age. The cohort measurements establish
      this association without identifying the relative contributions of feeding or endocrine factors.
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the time of their most recent clinical assessment, 5/20 (25%)
      individuals exhibited short stature for age and 10/19 (53%) individuals
      had decreased weight for age
    explanation: >-
      Quantifies the somatic growth restriction that accompanies the
      microcephaly.

- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Human BPTF-related disease includes developmental delay, intellectual disability, speech/language
    delay, motor delay and hypotonia with variable expressivity. Some individuals function independently
    as adults. Developmental delay commonly precedes seizures, but this does not prove a specific cortical
    lesion or exclude additional developmental effects from epilepsy.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: DIRECT
    description: >-
      The impairment presents first as delayed attainment of milestones across
      all developmental domains.
  - target: Intellectual Disability
    causal_link_type: DIRECT
    description: >-
      Intellectual disability occurs in some affected individuals; global developmental delay does not
      invariably imply later intellectual disability.
  - target: Delayed Speech and Language Development
    causal_link_type: DIRECT
    description: >-
      Speech and language are disproportionately affected relative to other
      domains, making this the most consistent single manifestation.
  - target: Motor Delay
    causal_link_type: DIRECT
    description: >-
      Gross and fine motor milestones are delayed alongside the cognitive and
      language domains.
  - target: Hypotonia
    causal_link_type: DIRECT
    description: >-
      Hypotonia accompanies the neurodevelopmental phenotype; its specific causal route is unresolved.
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common features included DD and/or ID (23/26, 88%), speech delay (22/26,
      85%), head circumference less than the third percentile for age (11/26,
      42%), motor delay (18/26, 69%), hypotonia (10/26, 38%), and dysmorphic
      features (20/26, 77%).
    explanation: >-
      Quantifies the organism-level clinical output across the largest
      single-study cohort.
  - reference: PMID:38936258
    reference_title: "Epilepsy as a Novel Phenotype of BPTF-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      developmental delay preceding seizure onset
    explanation: >-
      Reports temporal ordering of developmental delay and seizures without establishing a cortical lesion
      or a causal relationship.


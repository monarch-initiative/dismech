- name: P19 Bptf-knockdown Smad-response reporter model
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Mus musculus
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_source: Mouse P19 embryonal carcinoma cell line
  culture_system: siRNA knockdown with Smad-binding-element or activin-response-element luciferase reporters
  publication: PMID:18974875
  description: >-
    Bptf knockdown reduces TGF-beta- and activin-responsive reporter transcription in P19 cells. Reporter
    activation remains impaired when the pathway is driven with constitutively active receptor and Smad
    constructs, supporting a nuclear co-regulatory role.
  modeled_mechanisms:
  - target: Dysregulated Developmental Gene Transcription
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Tests a specific transcriptional consequence of Bptf depletion.
    readouts:
    - name: Smad-response reporter activity
      target: Dysregulated Developmental Gene Transcription
      direction: DECREASED
      description: >-
        Luciferase output falls after Bptf siRNA under ligand stimulation or constitutive receptor/Smad
        activation.
    limitations: >-
      Transformed mouse cells with artificial reporters do not establish this pathway as the cause of
      human neurodevelopmental or gastrointestinal features.
    evidence:
    - reference: PMID:18974875
      reference_title: Essential role of chromatin remodeling protein Bptf in early mouse embryos and embryonic stem cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Under conditions of Bptf knockdown, we observed a significant reduction in luciferase activity
        from both reporters
      explanation: >-
        Bptf knockdown reduced both minimal Smad-binding-element and activin-response-element reporter
        activity in P19 cells.
    - reference: PMID:18974875
      reference_title: Essential role of chromatin remodeling protein Bptf in early mouse embryos and embryonic stem cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Knockdown of Bptf in P19 cells renders SBE Smad responsive elements unresponsive to constitutively
        activated Smad transcription factors.
      explanation: >-
        Reporter impairment persists with constitutive receptor/Smad activation, consistent with a downstream
        transcriptional requirement.

    term:
      id: HP:0002572
      label: Episodic vomiting
  evidence:
  - reference: PMID:40614698
    reference_title: "Cyclical Vomiting Syndrome in Individuals With BPTF Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute therapy (ondansetron or domperidone) was administered in 42.8% of
      cases, and prophylactic therapy was provided in 57.1% of cases with
      cyproheptadine, levetiracetam combined with lamotrigine, and domperidone;
      all therapies were associated with clinical benefit.
    explanation: >-
      Observational report of benefit from acute and prophylactic CVS therapy;
      the uncontrolled series does not separate treatment effects from other influences on symptoms.

- name: Genetic Counseling
  description: >-
    Counseling addresses autosomal dominant inheritance and variable expressivity. A heterozygous parent
    has a 50% probability of transmitting the variant in each pregnancy; this is not a quantified probability
    of a particular clinical severity. Parental testing can identify inherited variants in mildly affected
    relatives. An apparently de novo result leaves a residual recurrence risk from possible parental germline
    mosaicism.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study has also uncovered four cases of inherited BPTF variants,
      providing some insight into the penetrance and expressivity of NEDDFL.
    explanation: >-
      Documented inherited variants are the basis for counseling about parental
      testing and recurrence risk.


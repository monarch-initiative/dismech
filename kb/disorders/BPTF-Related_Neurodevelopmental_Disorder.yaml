    snippet: >-
      We identified a novel heterozygous non‐coding variant in the BPTF (NM_182641.4): c.2812+1G>C through
      WES. This splice‐site variant is likely to disrupt normal splicing of the BPTF gene, which could
      result in abnormal mRNA processing and produce a non‐functional or truncated protein.
    explanation: >-
      Distinguishes the physical donor-site substitution from its predicted RNA consequence.

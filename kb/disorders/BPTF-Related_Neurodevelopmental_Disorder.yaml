- category: Gastrointestinal
  name: Cyclical Vomiting Syndrome
  phenotype_term:
    preferred_term: Episodic vomiting
    term:
      id: HP:0002572
      label: Episodic vomiting
    temporality: RECURRENT
  description: >-
    Stereotyped, recurrent episodes of vomiting, typically lasting under an
    hour, with a median onset around age 3 years and common triggers of poor
    sleep and fever. Formally diagnosed as cyclical vomiting syndrome by ICHD-3
    criteria in 20% of one prospectively questioned series, with a further 27%
    meeting at least three of the criteria. Episodes are a substantial source of
    family burden.
  notes: >-
    Three of 15 individuals met full ICHD-3 CVS criteria, and four additional individuals met at least
    three criteria. The study recruited families with or without gastrointestinal symptoms. The 20% CVS
    proportion is from this small questionnaire cohort and is not the frequency of all episodic vomiting.
  evidence:
  - reference: PMID:40614698
    reference_title: "Cyclical Vomiting Syndrome in Individuals With BPTF Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 15 individuals with likely pathogenic/pathogenic BPTF variants
      (median age: 8.8 years). Three individuals (20%) were diagnosed with CVS,
      and an additional four individuals (26.7%) met at least three of the
      ICHD-3 criteria for CVS.
    explanation: >-
      Distinguishes the three confirmed CVS cases from four additional individuals with recurrent vomiting
      meeting partial criteria.
  - reference: PMID:40614698
    reference_title: "Cyclical Vomiting Syndrome in Individuals With BPTF Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study broadens the syndromic phenotype associated with BPTF
      haploinsufficiency, highlighting CVS as a core feature.
    explanation: >-
      The authors propose CVS as part of the syndrome; the small observational series establishes an association
      rather than proving causality for each episode.


- name: Delayed Neural Progenitor Cell-Cycle Exit
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In forebrain-conditional Bptf-null mice, fewer EdU-labeled cells exited the cell cycle over 24 hours.
    A prolonged cycle was inferred from this assay, rather than directly timed. Radial glial abundance,
    S-phase fractions and mitotic-marker counts were largely unchanged, while intermediate progenitor
    abundance was modestly reduced. These complete-loss mouse findings have not been demonstrated in patient
    neural progenitors.
  cell_types:
  - preferred_term: cortical neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cell cycle
    term:
      id: GO:0007049
      label: cell cycle
    modifier: ABNORMAL
  downstream:
  - target: Cortical Hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered progenitor differentiation may reduce neuronal output in the conditional-null mouse. The
      study does not show a general cell-cycle arrest.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9558838/
    reference_title: Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Taken together, the cortical progenitor cells of the ... cKO mice show no blocks in the cell cycle with similar cell proportions in the S- and M-phase to the control samples. However, fewer cells exited the cell cycle in a 24-h period suggesting that cell cycle length was prolonged, which could account for the slight reduction in IPC number.
    explanation: >-
      Separates the measured cell-cycle exit fraction from the inferred cycle length and preserves negative
      proliferation findings.
- name: Increased Neuronal Apoptosis
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Forebrain Bptf conditional-null mice show increased cleaved-caspase-3 staining chiefly in the intermediate
    zone and cortical plate, with ventricular-zone levels largely unchanged at E15.5. The spatial pattern
    implicates newly postmitotic neurons undergoing differentiation or migration, rather than proving
    generalized progenitor apoptosis. Increased phagocytic microglia accompany postnatal cell death. This
    is a model-derived candidate mechanism for human disease.
  cell_types:

treatments:
- name: Supportive and Developmental Therapy
  description: >-
    There is no disease-modifying therapy for NEDDFL. Management is supportive
    and centres on early intervention: speech and language therapy (given the
    disproportionate speech delay), physical and occupational therapy for motor
    delay and hypotonia, educational support, nutritional support for poor
    weight gain and feeding difficulty, and periodic monitoring for scoliosis
    and ophthalmologic problems.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  - preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While it is unclear how significant the degree of scoliosis was within
      individuals, careful examination and monitoring for this clinical finding
      are also recommended.
    explanation: >-
      Supports scoliosis surveillance. The quoted recommendation does not evaluate developmental
      therapies or establish their syndrome-specific efficacy.

- name: Recombinant Human Growth Hormone
  description: >-
    Two boys with short stature and growth hormone deficiency on stimulation testing received rhGH in
    the 2023 report. One gained 25.6 cm (+1.63 SD) over 3.5 years; the other gained 2.9 cm (+0.18 SD)
    over four months before treatment stopped for financial reasons. These uncontrolled observations do
    not establish long-term efficacy, safety or benefit in individuals without growth hormone deficiency.
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant human growth hormone (somatropin)
      term:
        id: NCIT:C837
        label: Somatropin
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:36153657
    reference_title: "The effect of growth hormone treatment in children with novel BPTF gene variants: A report of two cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both children had short stature and responded to recombinant human growth
      hormone (rhGH) treatment - the first report of this therapy in NEDDFL
      patients.
    explanation: >-
      First and, to date, principal report of growth hormone therapy in NEDDFL.
  - reference: PMID:36153657
    reference_title: "The effect of growth hormone treatment in children with novel BPTF gene variants: A report of two cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The salutary effect of rhGH in the NEDDFL is documented.
    explanation: >-
      Authors' summary conclusion from two uncontrolled cases with no comparator; this does not
      establish a general treatment effect or long-term safety.

- name: Antiseizure Medication
  description: >-
    Levetiracetam was commonly used in the selected BPTF electroclinical series and was associated with
    reduced seizure frequency in 67% of treated cases as reported by the authors. This observational result
    is not a comparative efficacy estimate. Valproate and vagus nerve stimulation were also reported in
    the 2021 cohort. The 27% drug-resistance figure describes the selected electroclinical series and
    should not be read as a rate among all individuals with NEDDFL.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:38936258
    reference_title: "Epilepsy as a Novel Phenotype of BPTF-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Levetiracetam was widely used and reduced seizure frequency in 67% of the
      cases.
    explanation: >-
      Reports an observational treatment response in selected patients, without a randomized comparison.

- name: Cyclical Vomiting Syndrome Therapy
  description: >-
    Acute treatment of cyclical vomiting episodes with ondansetron or
    domperidone, and prophylaxis with cyproheptadine, domperidone, or
    levetiracetam combined with lamotrigine, were all associated with clinical
    benefit in the reported BPTF series. Evidence is observational and from a
    single 15-individual questionnaire study.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ondansetron
      term:
        id: CHEBI:7773
        label: Ondansetron
    - preferred_term: cyproheptadine
      term:
        id: CHEBI:4046
        label: cyproheptadine
  target_phenotypes:

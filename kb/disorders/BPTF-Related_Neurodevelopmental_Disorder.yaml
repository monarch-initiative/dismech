      label: embryonic limb morphogenesis
    modifier: ABNORMAL
  downstream:
  - target: Dysmorphic Facial Features
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A candidate developmental connection based on co-occurring human findings and experimental craniofacial
      abnormalities; the human causal route is unproven.
  - target: Distal Limb Anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

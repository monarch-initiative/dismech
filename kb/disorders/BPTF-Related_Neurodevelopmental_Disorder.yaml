- name: Impaired Cortical Neuron Fate Specification
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Complete forebrain Bptf loss changes layer-specific neuronal marker expression and distribution. Ctip2-high
    layer V cells are reduced, whereas Ctip2-low cells increase in upper layers; total Ctip2 protein and
    transcript levels are not markedly reduced. Birth-dating does not show fewer EdU/Ctip2-colabeled cells,
    supporting impaired regulation and maturation rather than simply absent production of this neuronal
    class. These findings do not establish cortical mislamination in human heterozygous disease.
  cell_types:
  - preferred_term: cortical projection neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cerebral cortex neuron differentiation

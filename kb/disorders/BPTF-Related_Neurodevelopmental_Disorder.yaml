- name: Disrupted Craniofacial and Limb Patterning
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Zebrafish bptf disruption increases the ceratohyal cartilage angle, supporting a role in craniofacial
    development. The specific cellular lineage and molecular route to human facial or distal limb findings
    have not been demonstrated. A shared developmental-patterning disturbance is proposed, rather than
    an established migratory neural-crest defect or a measured human HOX-expression mechanism.
  biological_processes:
  - preferred_term: embryonic skeletal system morphogenesis
    term:
      id: GO:0048704
      label: embryonic skeletal system morphogenesis
    modifier: ABNORMAL
  - preferred_term: embryonic limb morphogenesis
    term:

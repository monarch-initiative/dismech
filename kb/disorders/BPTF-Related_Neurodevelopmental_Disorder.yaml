experimental_models:
- name: Bptf-null mouse embryonic stem cells and rescued embryoid bodies
  experimental_model_type: OTHER
  organism:
    preferred_term: Mus musculus
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_source: Engineered mouse embryonic stem-cell lines derived from CJ7 cells
  cell_types:
  - preferred_term: embryonic stem cell
    term:
      id: CL:0002322
      label: embryonic stem cell
  culture_system: Embryonic stem-cell culture, LIF withdrawal or retinoic-acid differentiation, and nine-day embryoid-body differentiation
  conditions:
  - Wild type
  - Biallelic Bptf exon-2 deletion
  - Retargeted Bptf rescue allele
  publication: PMID:18974875
  description: >-
    Bptf-null embryonic stem cells remain viable but differentiate abnormally. Embryoid bodies fail to
    form a normal outer endodermal layer and show impaired lineage-marker induction, rescued by retargeting
    a functional Bptf allele. Microarray experiments under LIF maintenance, LIF withdrawal and retinoic-acid
    differentiation show context-dependent activation and repression, including derepression of Hox clusters.
    Activin experiments preserve Smad2 phosphorylation but impair selected target-gene induction and Snf2h/l
    enhancer recruitment.
  modeled_mechanisms:
  - target: Dysregulated Developmental Gene Transcription
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly measures Bptf-dependent transcription during differentiation and ligand stimulation.
    readouts:
    - name: Lineage-marker induction after Bptf restoration
      target: Dysregulated Developmental Gene Transcription
      direction: RESTORED
      description: >-
        Mesodermal and endodermal transcriptional responses during embryoid-body differentiation recover
        after retargeting a functional allele.
    - name: Activin-responsive target-gene induction
      target: Dysregulated Developmental Gene Transcription
      direction: DECREASED
      description: >-
        Cer1, Gsc and T induction is impaired in Bptf-null cells despite retained Smad2 phosphorylation.
    limitations: >-
      Complete-loss mouse stem cells and early embryonic differentiation are not patient-derived heterozygous

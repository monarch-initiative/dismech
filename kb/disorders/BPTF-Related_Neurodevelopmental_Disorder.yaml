animal_models:
- name: Bptf forebrain-conditional knockout mouse
  species: Mus musculus
  genotype: Emx1-Cre forebrain-conditional Bptf knockout (Bptf cKO)
  category: Conditional knockout mouse model of NEDDFL
  description: >-
    Forebrain-specific Bptf knockout generated with Emx1-Cre causes severe cortical hypoplasia, increased
    death of newly postmitotic neurons and altered cortical neuronal marker distribution. A reduced 24-hour
    cell-cycle exit fraction suggests delayed differentiation or a longer cycle; cycle length was not
    directly timed. Brain weight is reduced at birth, whereas body weight diverges after birth. The mice
    survive to adulthood, with largely nonprogressive gross anatomy; normal home-cage appearance is not
    a formal behavioral or seizure assessment.
  notes: >-
    The larger-brain Smarca1 comparator in the original study is the exon-6 deletion allele producing
    internally truncated protein. Later complete-null experiments showed near-normal cortical size and
    support compensation by SMARCA5. These allele-specific effects limit use of an ATPase perturbation
    as a substitute for BPTF loss. Conditional heterozygotes also showed increased cleaved-caspase-3 staining
    at P7, so the study does not establish complete absence of heterozygous effects.
  modeled_mechanisms:
  - target: Delayed Neural Progenitor Cell-Cycle Exit
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Measures this candidate mechanism in a complete forebrain conditional knockout.
    readouts:
    - name: Fraction of labeled cells exiting the cycle over 24 hours
      target: Delayed Neural Progenitor Cell-Cycle Exit
      direction: DECREASED
      description: >-
        EdU-positive, Ki67-negative fraction after an E14.5 pulse and E15.5 harvest.
      interpretation: >-
        Reduced cycle exit supports delayed differentiation or longer cycle duration; cycle length itself
        was inferred.
    limitations: >-
      The complete tissue-specific knockout differs from human heterozygous BPTF disease. Human confirmation
      is lacking.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9558838/
      reference_title: Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Taken together, the cortical progenitor cells of the ... cKO mice show no blocks in the cell cycle with similar cell proportions in the S- and M-phase to the control samples. However, fewer cells exited the cell cycle in a 24-h period suggesting that cell cycle length was prolonged, which could account for the slight reduction in IPC number.
      explanation: >-
        Separates the measured cell-cycle exit fraction from the inferred cycle length and preserves negative
        proliferation findings.
  - target: Increased Neuronal Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Measures this candidate mechanism in a complete forebrain conditional knockout.
    readouts:
    - name: Cell death in intermediate zone and cortical plate
      target: Increased Neuronal Apoptosis
      direction: INCREASED
      biological_processes:
      - preferred_term: apoptotic process
        term:
          id: GO:0006915
          label: apoptotic process
      description: >-
        Cleaved-caspase-3 staining in differentiating neuronal regions; ventricular-zone levels were largely
        unchanged at E15.5.
      interpretation: >-
        The spatial distribution implicates newly postmitotic neurons rather than proving generalized
        progenitor death.
    limitations: >-
      The complete tissue-specific knockout differs from human heterozygous BPTF disease. Human confirmation
      is lacking.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9558838/
      reference_title: Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We conclude from this data that a high incidence of cell death is a major contributor to the reduction in cortical size and that this occurs as the neurons become postmitotic, initiate their terminal differentiation program, and migrate toward their final laminar position.
      explanation: >-
        Localizes the major cell-death contribution to differentiating neurons in the conditional-null
        model.
  - target: Impaired Cortical Neuron Fate Specification
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Measures this candidate mechanism in a complete forebrain conditional knockout.
    readouts:
    - name: Ctip2-high layer V neuron proportion
      target: Impaired Cortical Neuron Fate Specification
      direction: DECREASED
      description: >-
        Ctip2-high layer V cell counts are markedly reduced, with changes in Ctip2-low cell distribution
        across layers.
      interpretation: >-
        Layer-specific marker counts reflect altered identity or maturation as well as possible changes
        in cell number; they are not a direct birth-rate measurement.
    - name: Layer-specific Ctip2 regulation
      target: Impaired Cortical Neuron Fate Specification
      direction: ALTERED
      biological_processes:
      - preferred_term: cerebral cortex neuron differentiation
        term:
          id: GO:0021895
          label: cerebral cortex neuron differentiation
      description: >-
        Ctip2 expression and layer distribution change despite preserved bulk Ctip2 protein and transcript
        levels and no reduction in birth-dated EdU/Ctip2-colabeled cells.
      interpretation: >-
        The combination supports abnormal terminal differentiation and marker regulation rather than absence
        of this neuronal class.
    limitations: >-
      The complete tissue-specific knockout differs from human heterozygous BPTF disease. Human confirmation
      is lacking.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9558838/
      reference_title: Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Immunoblots suggested the overall levels of Ctip2 were not markedly different than in the control extracts
      explanation: >-
        Preserves the negative bulk-protein result despite altered layer-specific Ctip2 staining.
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9558838/
      reference_title: Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: suggesting that these cells are specified but have impaired Ctip2 regulation that alters lamination and terminal expression levels.
      explanation: >-
        Interpretation of the birth-dating experiment; the neuron class is not simply absent at birth.
  - target: Cortical Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced cortical size is directly observed in the conditional-null model.
    readouts:
    - name: Cortical size
      target: Cortical Hypoplasia
      direction: DECREASED
      description: >-
        Histological cortical size and forebrain weight are reduced relative to controls.
      interpretation: >-
        Direct model evidence for tissue hypoplasia, without establishing the same anatomical lesion in
        every human case.
    limitations: >-
      Complete forebrain loss differs from human heterozygous BPTF variants. Human MRI abnormalities are
      heterogeneous.
    evidence:
    - reference: PMID:35604347
      reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The Bptf cKO mice were born in normal Mendelian ratios, survived to
        adulthood but were smaller in size with severe cortical hypoplasia.
      explanation: >-
        Establishes cortical hypoplasia with reduced body size as the tissue-level
        phenotype of forebrain Bptf loss.
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9558838/
      reference_title: Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The gross morphology of the hypoplastic forebrain remained identical to the P12 mice as the mice aged
      explanation: >-
        Supports a developmental, grossly nonprogressive anatomical phenotype in the model.
  evidence:
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To model the NEDDFL syndrome, we generated forebrain-specific Bptf
      knockout (Bptf conditional Knockout (cKO)) mice.
    explanation: >-
      Establishes the model's purpose and construction.
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, ablation of Smarca1 resulted in mice with enlarged brains, a
      direct contrast to the phenotype of NEDDFL patients.
    explanation: >-
      The original paper summarizes the enlarged-brain comparator; the subsequent study distinguishes
      the exon-6 deletion allele from a complete Smarca1 null.

- name: bptf CRISPR F0 crispant zebrafish
  species: Danio rerio
  genotype: CRISPR-Cas9 bptf F0 crispant
  category: CRISPR F0 knockout zebrafish model
  description: >-
    CRISPR-Cas9 knockout of zebrafish bptf produces F0 mutant larvae with
    significantly reduced head size, increased apoptosis by TUNEL staining, and
    a substantially increased ceratohyal angle indicating abnormal craniofacial
    patterning (PMID:28942966). This model recapitulates both the microcephaly
    and the craniofacial dimensions of NEDDFL.
  modeled_mechanisms:
  - target: Reduced Brain Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced head size in bptf F0 larvae is the cross-species correlate of the
      human microcephaly.
    readouts:
    - name: Larval head size
      target: Reduced Brain Growth
      direction: DECREASED
      description: >-
        Head size of bptf F0 crispant larvae versus control larvae.
      interpretation: >-
        Significantly reduced head size is the model's microcephaly readout; it
        indexes reduced brain growth but not the postnatal timing of the human
        phenotype.
    limitations: >-
      F0 crispants are mosaic genome-edited larvae. Reduced head size does not establish human postnatal
      timing or a defined heterozygous dosage response.
    evidence:
    - reference: PMID:28942966
      reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using CRISPR-Cas9 genome editing of bptf in zebrafish to induce a loss of
        gene function, we observed a significant reduction in head size of F0
        mutants compared to control larvae.
      explanation: >-
        Reduced larval head size supports a developmental role for bptf but does not capture the
        postnatal timing of some human microcephaly presentations or quantify human heterozygous effects.
  - target: Disrupted Craniofacial and Limb Patterning
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Increased ceratohyal angle is an established quantitative readout of
      disrupted craniofacial patterning, and is the direct experimental support
      for the craniofacial arm of this node.
    readouts:
    - name: Ceratohyal angle
      target: Disrupted Craniofacial and Limb Patterning
      direction: INCREASED
      description: >-
        Angle of the ceratohyal cartilage of the craniofacial skeleton in bptf
        F0 crispants versus controls.
      interpretation: >-
        A substantially widened ceratohyal angle is the established quantitative
        index of abnormal craniofacial patterning in zebrafish.
    limitations: >-
      Supports the craniofacial arm only. No model has yet demonstrated the
      distal limb arm of this node, which is why the node is marked PROVISIONAL.
    evidence:
    - reference: PMID:28942966
      reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we observed a substantial increase of the ceratohyal angle of the
        craniofacial skeleton in bptf F0 mutants, indicating abnormal craniofacial
        patterning
      explanation: >-
        Direct experimental demonstration of disrupted craniofacial patterning on
        bptf loss.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using CRISPR-Cas9 genome editing of bptf in zebrafish to induce a loss of
      gene function, we observed a significant reduction in head size of F0
      mutants compared to control larvae.
    explanation: >-
      Establishes the zebrafish model and its microcephaly readout.

- name: Constitutive Bptf-null mouse embryo
  species: Mus musculus
  genotype: Homozygous Bptf gene-trap or exon-2 deletion; equivalent early embryonic phenotypes
  category: Constitutive null mouse embryo
  description: >-
    Gene-trap and exon-2-deletion homozygotes develop postimplantation growth defects, fail to establish
    a functional distal/anterior visceral endoderm and primitive streak, and are resorbed by E8.5. Mitotic-marker
    staining is reduced without a generalized increase in TUNEL staining. These findings establish early
    embryonic gene essentiality, not the phenotype of human heterozygous disease.
  modeled_mechanisms:
  - target: BPTF Haploinsufficiency
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Perturbs Bptf through complete loss, providing an essentiality comparison for the human heterozygous
      disorder. It does not quantify a heterozygous dose-response relationship.
    readouts:
    - name: Post-implantation embryonic survival
      target: BPTF Haploinsufficiency
      direction: DECREASED
      description: >-
        Survival of constitutive Bptf-null embryos, which show post-implantation
        growth defects and are resorbed by E8.5.
      interpretation: >-
        Complete-loss embryonic lethality demonstrates essentiality and cannot establish the consequences
        of a heterozygous variant.
    limitations: >-
      Both alleles are disrupted, whereas affected humans typically carry one pathogenic allele. The study
      also reports a maternal effect on embryo survival in gene-trap heterozygous females, without preferential
      loss of heterozygous offspring; this is distinct from a demonstrated heterozygous neurodevelopmental
      phenotype.
    evidence:
    - reference: PMID:18974875
      reference_title: "Essential role of chromatin remodeling protein Bptf in early mouse embryos and embryonic stem cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Bptf mutants manifest growth defects at the post-implantation stage and
        are reabsorbed by E8.5.
      explanation: >-
        Demonstrates embryonic essentiality after complete Bptf loss, without measuring human haploinsufficiency.
  evidence:
  - reference: PMID:18974875
    reference_title: "Essential role of chromatin remodeling protein Bptf in early mouse embryos and embryonic stem cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Bptf mutants manifest growth defects at the post-implantation stage and
      are reabsorbed by E8.5.
    explanation: >-
      Demonstrates embryonic essentiality after complete Bptf loss, without measuring human haploinsufficiency.
diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    Exome sequencing, neurodevelopmental gene panels and copy-number testing have identified affected
    individuals. Parental testing distinguishes de novo from inherited variants and informs interpretation.
    The cited case series document ascertainment methods rather than establishing a syndrome-specific
    diagnostic yield comparison or first-line guideline.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular testing results from exome sequencing, chromosomal microarray,
      or next‐generation sequencing panel were submitted by patients'
      healthcare providers
    explanation: >-
      Documents the diagnostic modalities through which the 26-individual
      expansion cohort was actually ascertained.
  - reference: PMID:40415676
    reference_title: "Effects of the Missense Variants on Complete Phenotype and Splicing Variant on Severe Growth Retardation in the BPTF Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BPTF gene variants were detected using whole-exome sequencing. Family
      segregation analysis was performed using sanger sequencing.
    explanation: >-
      Independent series confirming exome sequencing as the detection method,
      with Sanger segregation analysis in the family.
  - reference: PMID:36153657
    reference_title: "The effect of growth hormone treatment in children with novel BPTF gene variants: A report of two cases and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The exome sequencing was performed in two probands. Sanger sequencing was
      used to confirm the identified variants both in probands and their parents.
    explanation: >-
      Shows the standard workflow of exome discovery plus Sanger confirmation in
      proband and parents.

- name: Chromosomal Microarray for 17q24.2 Copy-Number Variants
  description: >-
    Chromosomal microarray can detect BPTF-containing deletions, subject to assay resolution. Larger 17q24.2
    deletions require assessment of other affected genes. Balanced gene-disrupting rearrangements require
    appropriate structural-variant testing and cannot be excluded by a normal microarray.
  diagnosis_term:
    preferred_term: chromosomal microarray (array comparative genomic hybridization)
    term:
      id: NCIT:C18084
      label: Comparative Genomic Hybridization
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report eight loss-of-function and two missense variants (eight de novo
      and two of unknown origin) in BPTF on 17q24.2
    explanation: >-
      Establishes the 17q24.2 locus that copy-number testing must cover.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular testing results from exome sequencing, chromosomal microarray,
      or next‐generation sequencing panel were submitted by patients'
      healthcare providers
    explanation: >-
      Confirms chromosomal microarray as one of the modalities that identified
      individuals in the expansion cohort.

- name: ACMG/AMP Variant Interpretation with Parental Testing
  description: >-
    A molecular diagnosis requires a pathogenic or likely pathogenic BPTF variant interpreted with phenotype,
    inheritance, population frequency, transcript context and the expected effect of the allele. The 2021
    cohort reported 11 pathogenic, seven likely pathogenic and two uncertain variants. A VUS alone does
    not establish the diagnosis. The two missense variants in the 2025 report were also VUS, despite severe
    findings in carriers, illustrating why phenotype severity alone cannot establish pathogenicity. Truncating
    and copy-number alleles likewise require appropriate interpretation.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants were interpreted as pathogenic (11), likely pathogenic (7), or VUS
      (2) based on the current ACMG criteria.
    explanation: >-
      Documents ACMG/AMP classification as the interpretation framework and the
      residual VUS rate.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is anticipated that the finding of missense variants in BPTF may present
      a diagnostic challenge for practitioners, particularly in individuals with
      mild phenotypes
    explanation: >-
      The authors flag missense variants as the principal interpretation
      difficulty, supporting the caution that a missense VUS alone is not
      diagnostic.
  notes: >-
    Explicit negatives, recorded so their absence is not mistaken for a curation
    gap. (1) There are no formal consensus diagnostic criteria for NEDDFL;
    diagnosis is a compatible phenotype plus molecular confirmation. (2) There is
    no diagnostic biochemical, enzymatic, imaging, or circulating biomarker - a
    normal brain MRI in particular does not exclude the diagnosis, since most
    imaged individuals in the expansion cohort had normal studies. (3) No
    validated functional assay and no DNA-methylation episignature has been
    established for BPTF, despite NEDDFL being a chromatinopathy where an
    episignature might be expected; RNA sequencing and proteomics for resolving
    difficult variants remain investigational. (4) No newborn or general
    population screening exists; cascade testing is appropriate once a familial
    pathogenic variant is known.

differential_diagnoses:
- name: Neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies (ZMIZ1)
  disease_term:
    preferred_term: NEDDFSA
    term:
      id: MONDO:0032855
      label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
  description: >-
    A separate autosomal dominant neurodevelopmental entity caused by
    heterozygous ZMIZ1 variants. Its MONDO label differs from this disorder's by
    a single word ("skeletal" versus "limb"), which makes it the single highest
    named-entity-confusion risk for NEDDFL in any label- or text-based search.
  distinguishing_features:
  - >-
    Molecular: ZMIZ1 versus BPTF (hgnc:3581). The gene is the only reliable
    discriminator; confirm the causative gene before importing any cohort data
    published under either "dysmorphic facies and distal ... anomalies" phrasing.
  - >-
    Nomenclature: the near-identical labels are the hazard, not the phenotypes.
    Both are dominant neurodevelopmental syndromes with dysmorphism and distal
    appendicular findings.
  notes: >-
    No literature evidence item is attached here deliberately: the point of this
    record is the identity distinction, which is established by the MONDO/OMIM
    identifiers themselves rather than by a phenotype claim. Adding a ZMIZ1
    cohort citation to a BPTF entry would reintroduce exactly the confusion this
    record exists to prevent.

- name: OTUD6B-related intellectual developmental disorder with dysmorphic facies, seizures and distal limb anomalies
  disease_term:
    preferred_term: IDDFSDA
    term:
      id: MONDO:0044319
      label: intellectual developmental disorder with dysmorphic facies, seizures, and distal limb anomalies
  description: >-
    An ultra-rare autosomal recessive multisystem disorder caused by biallelic
    OTUD6B variants (OMIM:617452), a ubiquitin-proteasome-system disorder of
    development. It shares the "dysmorphic facies ... and distal limb anomalies"
    phrasing with NEDDFL and overlaps clinically (developmental delay,
    microcephaly, dysmorphism, distal limb findings), but is mechanistically and
    genetically distinct.
  distinguishing_features:
  - >-
    Inheritance: biallelic and autosomal recessive (OTUD6B) versus heterozygous
    and autosomal dominant, typically de novo (BPTF). The inheritance mode alone
    separates them in almost every family.
  - >-
    Mechanism: impaired 26S proteasome assembly and reduced chymotrypsin-like
    proteasome activity (OTUD6B) versus impaired NURF ATP-dependent chromatin
    remodeling (BPTF).
  - >-
    Seizures are a defining, near-universal feature of the OTUD6B disorder and
    are named in its label, whereas in NEDDFL epilepsy occurs in a minority
    (about 19%) and was absent from the original clinical description.
  notes: >-
    The dismech OTUD6B entry carries the reciprocal NEC guardrail and
    deliberately excludes PMID:33522091 from all of its claims because that
    paper describes NEDDFL. The exclusion is honoured in the opposite direction
    here: no OTUD6B-specific citation is used anywhere in this BPTF entry.
  evidence:
  - reference: PMID:38936258
    reference_title: "Epilepsy as a Novel Phenotype of BPTF-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy was not included in the initial descriptions of NEDDFL, but
      emerging evidence indicates that epileptic seizures occur in some affected
      individuals.
    explanation: >-
      Supports the distinguishing feature that seizures are a late-recognized,
      minority finding in NEDDFL, unlike the OTUD6B disorder in which seizures
      are part of the disease name and the defining phenotype.

- name: Silver-Russell syndrome
  description: >-
    A clinical phenocopy hazard rather than a nomenclature hazard: the
    combination of small-for-gestational-age birth, poor postnatal growth,
    a small triangular face, and feeding difficulty can prompt an initial
    diagnosis of Silver-Russell syndrome in a child later found to have BPTF
    disruption. At least one adult carried the Silver-Russell label for 35 years
    before BPTF disruption was identified.
  distinguishing_features:
  - >-
    NEDDFL has postnatal (secondary) microcephaly, whereas relative macrocephaly
    for body size is characteristic of Silver-Russell syndrome.
  - >-
    NEDDFL has prominent speech delay and intellectual disability; cognition is
    typically preserved or only mildly affected in Silver-Russell syndrome.
  - >-
    Silver-Russell syndrome is most often caused by 11p15 loss of methylation or
    maternal uniparental disomy of chromosome 7, neither of which involves BPTF.
  notes: >-
    Recorded on the basis of the published case title (PMID:30633344,
    "Neurodevelopmental disorder with dysmorphic facies and distal limb
    anomalies syndrome due to disruption of BPTF in a 35-year-old man initially
    diagnosed with Silver-Russell syndrome"). No evidence item is attached
    because no abstract text is available for that reference in the reference
    cache, and dismech policy forbids quoting text that cannot be verified
    against a cached source.

discussions:
- discussion_id: bptf_vs_smarca1_dosage_paradox
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How do developmental NURF subunit composition and compensation determine the consequences of heterozygous
    BPTF loss in human cortex?
  attaches_to:
  - pathophysiology#Impaired NURF Chromatin-Remodeling Activity
  rationale: >-
    The original brain-size contrast was based on Smarca1 exon-6 deletion mice that express an internally
    truncated protein, rather than a complete null. The 2025 study found near-normal cortical size after
    complete Smarca1 loss and severe hypoplasia in Bptf conditional knockouts; double mutants were no
    more severe than Bptf loss alone. These results support a model of ATPase compensation and variant-dependent
    interference. Compensation was tested biochemically in cerebellar CERF complexes because specific
    BPTF antibodies were unavailable, so NURF subunit switching in cortex remains partly inferred. Its
    quantitative relationship to human BPTF heterozygosity remains unresolved.
  proposed_experiments:
  - experiment_id: bptf_smarca1_side_by_side_cortex
    name: Side-by-side cortical comparison of Bptf and Smarca1 conditional knockouts
    description: >-
      Compare heterozygous Bptf loss with complete and internally truncated Smarca1 alleles in matched
      cortical cell systems, measuring NURF composition, target expression and neuronal differentiation.
      Existing mouse single/double-knockout comparisons provide the complete-loss baseline.
  - experiment_id: bptf_snf2l_cooccupancy_map
    name: BPTF and SNF2L chromatin co-occupancy mapping in cortical progenitors
    description: >-
      Map BPTF chromatin occupancy in cortical progenitors and ask what fraction
      of BPTF-bound sites are also SNF2L-bound, to quantify the size of the
      NURF-independent BPTF binding compartment.
  - experiment_id: bptf_myc_axis_microcephaly_test
    name: Test whether the BPTF-MYC axis accounts for the Bptf-specific microcephaly
    description: >-
      Test whether the NURF-independent BPTF interactome, including the MYC
      cofactor axis identified by RNA-seq binding-site enrichment, accounts for
      the microcephaly that Smarca1 loss fails to reproduce.
  evidence:
  - reference: PMID:41213919
    reference_title: Pathogenic variants in SMARCA1 cause an X-linked neurodevelopmental disorder modulated by NURF complex composition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Taken together, these data reveal that proper cortical development requires NURF, and that Smarca5 fully compensates when Smarca1 is completely ablated (no difference in brain size in Smarca1 KO) but not when some SMARCA1 protein is produced (e.g. Smarca1ex6del mice).
    explanation: >-
      Distinguishes complete Smarca1 loss from the internally truncated allele underlying the earlier
      macrocephaly contrast.
  - reference: PMID:41213919
    reference_title: Pathogenic variants in SMARCA1 cause an X-linked neurodevelopmental disorder modulated by NURF complex composition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'The switch to the cerebellum and analysis of the CERF complex was chosen for three reasons: (1) the lack of commercially available antibodies specific to BPTF for analysis of the NURF complex; (2) the Smarca5 cKO and Smarca1ex6del mutant animals show similar differential effects on cerebellar size to those observed in the neocortex; and (3) the CERF complex is enriched in the cerebellum27,37.'
    explanation: >-
      The biochemical experiment measures CERF composition in cerebellum, so it is indirect evidence for
      cortical NURF switching.
- discussion_id: bptf_mouse_homozygous_vs_human_haploinsufficiency
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which cortical consequences of complete forebrain Bptf loss also occur in heterozygous mouse or human
    neural systems?
  attaches_to:
  - pathophysiology#Cortical Hypoplasia
  rationale: >-
    Human disease usually involves heterozygous BPTF variants, whereas the major cortical model deletes
    both alleles in the Emx1 domain. Gross heterozygous effects are limited, but increased cleaved-caspase-3
    staining at P7 was reported, so absence of all heterozygous phenotypes is not established. Conditional-null
    findings include reduced cell-cycle exit, neuronal apoptosis and altered layer-specific neuronal marker
    regulation. Their magnitude and relationship to human disease remain unresolved, and actual protein
    dosage should be measured rather than assumed to fall by exactly half.
  proposed_experiments:
  - experiment_id: bptf_het_mouse_deep_phenotyping
    name: Deep cortical phenotyping of Bptf heterozygous mice
    description: >-
      Quantify cortical volume, neuronal marker distribution, apoptosis and progenitor cycle exit in heterozygous
      mice, with direct Bptf protein measurements and age-matched controls.
  - experiment_id: bptf_het_ipsc_cortical_organoid
    name: Isogenic heterozygous BPTF-null human cortical organoids
    description: >-
      Derive isogenic human iPSC lines carrying patient BPTF null alleles in the
      heterozygous state and assay cortical organoid size, progenitor cell cycle
      length, and deep-layer neuron output against isogenic controls.
  - experiment_id: bptf_dosage_response_cross_species
    name: Cross-species BPTF dosage-response comparison
    description: >-
      Compare BPTF dosage-response curves for NURF assembly and target-gene
      expression between mouse and human cortical progenitors, to test whether
      the human system is simply steeper.
  evidence:
  - reference: PMID:35604347
    reference_title: "Generation of a mouse model of the neurodevelopmental disorder with dysmorphic facies and distal limb anomalies syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To model the NEDDFL syndrome, we generated forebrain-specific Bptf
      knockout (Bptf conditional Knockout (cKO)) mice.
    explanation: >-
      Identifies the model whose homozygous conditional-null design is the
      source of the mismatch with the human heterozygous disorder.

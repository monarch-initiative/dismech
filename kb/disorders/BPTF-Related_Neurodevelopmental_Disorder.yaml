- category: Neurologic
  name: Epilepsy
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
    onset:
      onset_category: CHILDHOOD
  description: >-
    Epilepsy has been reported with onset from 10 months to 7 years (median 4 years) in an electroclinically
    ascertained series of 11 individuals. Eight had epilepsy, one had a single unprovoked seizure and
    two had interictal epileptiform discharges only. The EEG background was well organized, with generalized
    interictal abnormalities in about half. Developmental delay preceded seizures; this timing does not
    establish a cortical lamination defect or exclude later effects of seizures on development. Drug resistance
    was reported as 27% in the selected series, not as a population rate.
  notes: >-
    The 2024 authors report epilepsy in 19% of known subjects; this is a literature-based proportion,
    distinct from the selected eleven-person electroclinical series. The 2021 cohort includes four individuals
    with clinical seizures and two with EEG abnormalities only, rather than six confirmed epilepsy cases.
  evidence:
  - reference: PMID:38936258
    reference_title: "Epilepsy as a Novel Phenotype of BPTF-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early-childhood-onset epilepsy occurs in 19% of subjects, all presenting
      with a well-organized EEG background associated with generalized
      interictal epileptiform abnormalities in half of these cases. Drug
      resistance is rare.
    explanation: >-
      Supplies both the 19% frequency underpinning the OCCASIONAL band and the
      electroclinical characterization.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, however, we identified six individuals with a history of clinical
      seizures and/or abnormal electroencephalograms (manuscript in
      preparation).
    explanation: >-
      Independent cohort confirming seizures as part of the NEDDFL spectrum and
      noting they were previously unreported.


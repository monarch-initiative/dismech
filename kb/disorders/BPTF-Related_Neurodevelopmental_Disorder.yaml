name: BPTF-Related Neurodevelopmental Disorder
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
synonyms:
- NEDDFL
- neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
- BPTF haploinsufficiency
description: >-
  Neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
  (NEDDFL, MONDO:0060596, OMIM:617755) is an ultra-rare autosomal dominant
  syndrome caused by heterozygous loss-of-function variants in BPTF (hgnc:3581)
  at 17q24.2. BPTF encodes the bromodomain PHD finger transcription factor, the
  largest and NURF-exclusive subunit of the nucleosome remodeling factor (NURF),
  an ISWI-family ATP-dependent chromatin-remodeling complex whose catalytic
  ATPase is SNF2L/SMARCA1. BPTF reads the activating chromatin marks H3K4me3
  (via its PHD finger) and H4K16ac (via its bromodomain) and thereby couples
  those marks to ATP-dependent nucleosome sliding at developmental gene
  promoters. Because BPTF is dosage-sensitive, a single null allele is
  sufficient to produce disease. The clinical core is developmental
  delay/intellectual disability with disproportionate speech and language delay,
  postnatal (secondary) microcephaly, poor growth, a mild but recognizable
  dysmorphic facial gestalt (prominent or bulbous nasal tip, prominent nasal
  bridge, pointed chin), and mild distal limb anomalies of the hands and feet
  (cutaneous 2-3 toe syndactyly, sandal gap, fifth-finger clinodactyly).
  Phenotypic expansion since the 2017 founding cohort has added ophthalmologic
  abnormalities, scoliosis and other skeletal findings, mild structural brain
  abnormalities, early-childhood-onset epilepsy, and cyclical vomiting syndrome.
  Most variants arise de novo, but transmitted alleles from mildly affected
  parents establish variable expressivity. Management is supportive; there is no
  disease-modifying therapy.
notes: >-
  Named-entity-confusion (NEC) guardrail. This entry is anchored strictly on
  MONDO:0060596 / OMIM:617755 / BPTF (hgnc:3581), confirmed by the MONDO
  `RO:0004003` gene-association relation returned by
  `runoak -i sqlite:obo:mondo info MONDO:0060596 -O obo` (relationship:
  RO:0004003 HGNC:3581 ! BPTF; xref: OMIM:617755; xref: Orphanet:686482). NEDDFL
  sits inside a large series of near-identically-named "neurodevelopmental
  disorder with ..." OMIM entities, so every citation used here was checked to
  name BPTF specifically. Three neighbours are deliberately kept separate and
  are recorded under `differential_diagnoses`. (1) MONDO:0032855
  "neurodevelopmental disorder with dysmorphic facies and distal SKELETAL
  anomalies" (NEDDFSA, ZMIZ1, OMIM:618659) differs from this disorder's label by
  one word; it is a different gene and a different MONDO entity. (2)
  MONDO:0044319 "intellectual developmental disorder with dysmorphic facies,
  seizures and distal limb anomalies" (IDDFSDA, OTUD6B, OMIM:617452) is
  autosomal recessive and biallelic, whereas NEDDFL is autosomal dominant and
  typically de novo; the dismech OTUD6B entry carries the reciprocal guardrail
  and deliberately excludes PMID:33522091 (a NEDDFL cohort) from all of its
  claims, citing it only on its BPTF differential record. That PMID is a
  legitimate primary source here and is used extensively. (3) Silver-Russell
  syndrome has been an initial clinical diagnosis in at least one adult later
  found to have BPTF disruption (PMID:30633344), which is a phenocopy hazard
  rather than a nomenclature hazard.

  Frequency discipline. The primary band source is PMID:33522091, the
  26-individual phenotypic expansion cohort, whose reported fractions are quoted
  verbatim as evidence on each phenotype. A larger pooled table exists
  (PMID:36153657 summarises all 38 individuals reported through 2022: DD/ID
  34/38 89%, speech/language delay 33/38 87%, skeletal abnormalities 23/28 82%,
  ophthalmological anomalies 17/30 57%, malnutrition 18/33 55%, brain anomalies
  11/22 50%, microcephaly 18/37 49%, hypotonia 15/38 39%, short stature 12/34
  35%). Those pooled numbers are recorded here in prose only and are NOT used as
  evidence snippets, because the reference validator can currently verify only
  the abstract of PMID:36153657 and that table is in the article body; the one
  band that rests on PMID:36153657 (short stature, 35%) uses a sentence that is
  in its abstract. Where a feature has an explicit published percentage in a
  dedicated study (epilepsy 19% in PMID:38936258, cyclical vomiting 20% in
  PMID:40614698) that study's denominator is used. Where no usable denominator
  exists the band is omitted rather than guessed. Caveat: all denominators
  derive from small, ascertainment-biased clinical cohorts of an ultra-rare
  disorder, and several counts are reported only for the subset of individuals
  in whom the feature was assessed.

  Deep research. A Falcon (Edison Scientific) deep-research run was performed
  (research/BPTF-Related_Neurodevelopmental_Disorder-deep-research-falcon.md,
  21 citations, 5/5 verifiable references, 0% confabulation rate reported by the
  provider's own validator). Its causal model and phenotype summary agreed with
  the primary literature read independently here, and it introduced no PMID that
  is not already cited in this entry, so it was used only as corroboration. Its
  own caveat that a MONDO accession "could not be verified from the retrieved
  primary literature" is why the MONDO binding here comes from a direct OAK
  lookup rather than from the report. No GeneReviews chapter exists for BPTF or
  NEDDFL (PubMed searches for "BPTF GeneReviews" and "NEDDFL GeneReviews"
  returned no results), so the GeneReviews phenotype baseline step does not
  apply to this entry.

  Term-binding note. The supportive-care and genetic-counseling treatments use
  NCIT intervention terms (NCIT:C15747 Supportive Care, NCIT:C15240 Genetic
  Counseling) rather than the MAXO terms suggested in CLAUDE.md
  (MAXO:0000950, MAXO:0000079). MAXO terms are not reachable from the
  NCIT:C25218 root that the `TreatmentActionTerm` dynamic enum expands from and
  fail `just validate-terms-file`; the same substitution is documented in the
  Progressive_Familial_Intrahepatic_Cholestasis entry. Please do not "correct"
  these back to MAXO.

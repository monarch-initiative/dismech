name: BPTF-Related Neurodevelopmental Disorder
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
synonyms:
- NEDDFL
- neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
- BPTF haploinsufficiency
description: >-
  Neurodevelopmental disorder with dysmorphic facies and distal limb anomalies (NEDDFL, MONDO:0060596,
  OMIM:617755) is an ultra-rare autosomal dominant syndrome caused by heterozygous loss-of-function variants
  in BPTF (hgnc:3581) at 17q24.2. BPTF encodes the bromodomain PHD finger transcription factor, the largest
  and NURF-exclusive subunit of the nucleosome remodeling factor (NURF), an ISWI-family ATP-dependent
  chromatin-remodeling complex whose catalytic ATPase can be SMARCA1/SNF2L or SMARCA5/SNF2H. BPTF reads
  the activating chromatin marks H3K4me3 (via its PHD finger) and H4K16ac (via its bromodomain) and thereby
  couples those marks to ATP-dependent nucleosome sliding at developmental gene promoters. Because BPTF
  is dosage-sensitive, a single null allele is sufficient to produce disease. The clinical core is developmental
  delay/intellectual disability with disproportionate speech and language delay, postnatal (secondary)
  microcephaly, poor growth, a mild but recognizable dysmorphic facial gestalt (prominent or bulbous nasal
  tip, prominent nasal bridge, pointed chin), and mild distal limb anomalies of the hands and feet (cutaneous
  2-3 toe syndactyly, sandal gap, fifth-finger clinodactyly). Phenotypic expansion since the 2017 founding
  cohort has added ophthalmologic abnormalities, scoliosis and other skeletal findings, mild structural
  brain abnormalities, early-childhood-onset epilepsy, and cyclical vomiting syndrome. Most variants arise
  de novo, but transmitted alleles from mildly affected parents establish variable expressivity. Management
  is supportive; there is no disease-modifying therapy.
notes: >-
  Published frequencies derive from small, clinically ascertained cohorts with incomplete assessments
  and overlapping participants. Counts for composite findings, such as developmental delay and/or intellectual
  disability, do not estimate each component separately. Congenital and postnatal microcephaly both occur.
  Clinical findings in carriers of variants of uncertain significance require interpretation separately
  from established BPTF loss-of-function disease.

pathophysiology:
- name: BPTF Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous pathogenic loss-of-function variants reduce functional BPTF dosage. The clinical and
    genetic evidence supports haploinsufficiency, but it does not establish an identical 50% protein reduction
    for every allele or tissue. BPTF is shared by NURF complexes containing either SMARCA1 or SMARCA5;
    the consequences of human heterozygosity cannot be equated with complete Bptf loss in mouse forebrain.
  gene:
    preferred_term: BPTF
    term:
      id: hgnc:3581
      label: BPTF
  downstream:
  - target: Impaired NURF Chromatin-Remodeling Activity
    causal_link_type: DIRECT
    description: >-
      Reduced functional BPTF is expected to impair NURF-dependent chromatin regulation; the amount of
      assembled complex in patient neural cells has not been quantified in the cited studies.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our data demonstrate the pathogenic role of BPTF haploinsufficiency in
      syndromic neurodevelopmental anomalies and extend the clinical spectrum
      of human disorders caused by ablation of chromatin remodeling complexes
    explanation: >-
      States haploinsufficiency as the disease mechanism.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency of BPTF in humans leads to the clinical entity known as
      neurodevelopmental disorder with dysmorphic facies and distal limb
      anomalies (NEDDFL, MIM#617755).
    explanation: >-
      Links reduced BPTF dosage directly to the named clinical entity.

- name: Impaired NURF Chromatin-Remodeling Activity
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    BPTF is the chromatin-reader subunit of NURF, which can contain SMARCA1/SNF2L or SMARCA5/SNF2H. Its
    PHD finger recognizes H3K4me3 and its bromodomain recognizes acetylated histones. Biochemical evidence
    links histone recognition to NURF recruitment and remodeling. The 2006 recruitment experiment depleted
    H3K4me3 rather than modeling a heterozygous patient BPTF allele. Mouse genetic comparisons support
    different developmental roles and compensatory capacities of the NURF ATPases; direct NURF subunit
    exchange in human BPTF-haploinsufficient cortex remains unmeasured.
  biological_processes:
  - preferred_term: ATP-dependent chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: DECREASED
  molecular_functions:
  - preferred_term: BPTF PHD finger reading of H3K4me3
    term:
      id: GO:0140002
      label: histone H3K4me3 reader activity
    modifier: DECREASED
  - preferred_term: NURF nucleosome sliding
    term:
      id: GO:0140750
      label: nucleosome array spacer activity
    modifier: DECREASED
  downstream:
  - target: Dysregulated Developmental Gene Transcription
    causal_link_type: DIRECT
    description: >-
      Loss of NURF-mediated nucleosome remodeling at developmental promoters
      changes the transcriptional output of those genes.
  evidence:
  - reference: PMID:28942966
    reference_title: "Haploinsufficiency of the Chromatin Remodeler BPTF Causes Syndromic Developmental and Speech Delay, Postnatal Microcephaly, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bromodomain PHD finger transcription factor (BPTF) is the largest subunit
      of nucleosome remodeling factor (NURF), a member of the ISWI
      chromatin-remodeling complex.
    explanation: >-
      Establishes BPTF's identity as the largest NURF subunit within the ISWI
      family.
  - reference: PMID:16728976
    reference_title: "A PHD finger of NURF couples histone H3 lysine 4 trimethylation with chromatin remodelling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that a plant homeodomain (PHD) finger of nucleosome
      remodelling factor (NURF), an ISWI-containing ATP-dependent
      chromatin-remodelling complex, mediates a direct preferential association
      with H3K4me3 tails.
    explanation: >-
      Defines the molecular reader function of the BPTF PHD finger that is lost
      when BPTF dosage falls.
  - reference: PMID:16728976
    reference_title: "A PHD finger of NURF couples histone H3 lysine 4 trimethylation with chromatin remodelling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of H3K4me3 causes partial release of the NURF subunit, BPTF
      (bromodomain and PHD finger transcription factor), from chromatin and
      defective recruitment of the associated ATPase, SNF2L (also known as ISWI
      and SMARCA1), to the HOXC8 promoter.
    explanation: >-
      Demonstrates the mechanistic coupling between BPTF chromatin engagement
      and delivery of the SNF2L remodeling ATPase to a developmental promoter.
  - reference: PMID:33522091
    reference_title: "Phenotypic expansion of the BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BPTF in particular facilitates this interaction by the preferential
      binding of its plant homeodomain (PHD) finger to the tails of the
      trimethylated lysine 4 of histone H3 (H3K4me3) and binding of its
      bromodomain to the acetylated lysine 16 of histone H4 (H4K16ac)
    explanation: >-
      Records both reader modules of BPTF in the disease-specific literature.

  - reference: PMID:41213919
    reference_title: Pathogenic variants in SMARCA1 cause an X-linked neurodevelopmental disorder modulated by NURF complex composition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Moreover, all combinations of double mutants (Smarca1/Smarca5 dKO, Smarca5/Smarca1ex6del, and Smarca5/Bptf dKO) resulted in a phenotype no more severe than the Bptf mutants alone (Fig. 8A).
    explanation: >-
      Mouse genetic comparisons support a central role for Bptf-containing remodeling complexes in cortical
      growth. These are complete or combined loss models, not measurements of human heterozygous complex
      activity.
- name: Dysregulated Developmental Gene Transcription
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Bptf loss alters developmental gene expression in experimental systems. In conditional-null cortex,
    transcriptomic changes include neuronal fate regulators and stress-response pathways. MYC-binding-site
    enrichment is computational and does not demonstrate BPTF/MYC occupancy or a causal interaction in
    patient neurons. Postnatal bulk expression differences also reflect changed cell populations, including
    microglia. Embryonic stem-cell experiments additionally show context-dependent activation and repression
    of developmental genes and impaired Smad-responsive transcription despite preserved Smad2 phosphorylation.
    These findings are model-specific, not a demonstrated universal failure of upstream TGF-beta signaling.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  downstream:

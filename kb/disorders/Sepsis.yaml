name: Sepsis
creation_date: "2026-08-17T12:00:00Z"
category: Complex
categories:
- Infectious Disease
- Critical Illness
synonyms:
- Septicaemia
- Septicemia
description: >-
  Sepsis is life-threatening organ dysfunction caused by a dysregulated host
  response to infection. It is a syndrome rather than a single etiology: many
  different pathogens and infection sites converge on a common host program in
  which innate immune activation, endothelial injury, and coagulation activation
  become mutually amplifying. The resulting microcirculatory failure and
  cellular bioenergetic failure produce dysfunction across multiple organ
  systems. A concurrent, and often protracted, immunosuppressive arm leaves
  survivors of the initial insult unable to clear the primary infection and
  vulnerable to secondary infection. Septic shock is the subset with profound
  circulatory, cellular, and metabolic abnormalities and substantially higher
  mortality.
parents:
- infectious disease
disease_term:
  preferred_term: Sepsis
  term:
    id: MONDO:1040015
    label: infectious disease with sepsis
notes: >-
  Ontology gap recorded at curation time (2026-08-17): MONDO has no generic
  "sepsis" disease class. The nearest anchor reachable from MONDO:0000001 is
  MONDO:1040015 "infectious disease with sepsis", whose textual definition is
  the Sepsis-3 definition, so it is used here as the entry anchor. MONDO also
  has no human "septic shock" class - only MONDO:1014822 "septic shock,
  non-human animal" - which is why the septic shock subtype below carries no
  subtype_term. HP:0100806 "Sepsis" exists as a phenotype but is not a disease
  anchor. Both gaps are candidates for a MONDO new-term request. A third gap
  sits on the treatment side: NCIT has no clinical-action term for source
  control, so that treatment is bound to the generic Therapeutic Procedure
  term rather than to any one of its instances.
has_subtypes:
- name: Septic shock
  display_name: Septic Shock
  classification: severity
  description: >-
    The subset of sepsis in which circulatory, cellular, and metabolic
    abnormalities are profound enough to substantially increase mortality,
    clinically identified by a vasopressor requirement to maintain mean arterial
    pressure of 65 mm Hg or greater together with a serum lactate above
    2 mmol/L in the absence of hypovolemia. No MONDO term for human septic shock
    exists, so no subtype_term is bound.
  evidence:
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Septic shock should be defined as a subset of sepsis in which particularly
      profound circulatory, cellular, and metabolic abnormalities are associated
      with a greater risk of mortality than with sepsis alone.
    explanation: >-
      The international consensus statement defines septic shock as a severity
      subset of sepsis, which is how it is modeled here.
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with septic shock can be clinically identified by a vasopressor
      requirement to maintain a mean arterial pressure of 65 mm Hg or greater
      and serum lactate level greater than 2 mmol/L (>18 mg/dL) in the absence
      of hypovolemia.
    explanation: >-
      Supplies the operational clinical criteria quoted in the subtype
      description.
- name: Neonatal sepsis
  display_name: Neonatal Sepsis
  classification: age_group
  subtype_term:
    preferred_term: neonatal sepsis
    term:
      id: MONDO:0700217
      label: neonatal sepsis
  description: >-
    Sepsis in infants younger than 28 days, in whom immature innate and adaptive
    immunity, distinct pathogen spectra, and different presenting physiology
    warrant a separate subtype.
  review_notes: >-
    Curated as a placeholder subtype from the MONDO class only. The
    neonatal-specific immunological and epidemiological mechanism has not yet
    been curated with dedicated evidence.
mechanistic_hypotheses:
- hypothesis_group_id: thromboinflammatory_microcirculatory_model
  hypothesis_label: Thromboinflammatory Microcirculatory Failure Model
  status: CANONICAL
  description: >-
    Pathogen- and damage-associated molecular patterns drive dysregulated innate
    immune activation. Activated leukocytes, platelets, and endothelium engage
    in reciprocal amplification, degrading the endothelial glycocalyx, raising
    permeability, and activating coagulation while suppressing fibrinolysis. The
    resulting thromboinflammation obstructs and dysregulates the
    microcirculation, causing tissue hypoperfusion and organ dysfunction.
  evidence:
  - reference: PMID:37221630
    reference_title: "The pathophysiology, diagnosis, and management of sepsis-associated disseminated intravascular coagulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiology of sepsis-associated DIC is multifactorial, and in
      addition to coagulation activation with suppressed fibrinolysis, multiple
      inflammatory responses are initiated by activated leukocytes, platelets,
      and vascular endothelial cells as part of thromboinflammation.
    explanation: >-
      States the coupled coagulation-inflammation mechanism that this hypothesis
      group organizes the main causal graph around.
  - reference: PMID:32101446
    reference_title: Endothelial Responses in Sepsis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, glycocalyx damage and vascular tone dysfunction impair
      microcirculatory blood flow, leading to organ injury and, potentially,
      life-threatening organ failure.
    explanation: >-
      Links the endothelial arm of the model to microcirculatory failure and
      organ dysfunction.
- hypothesis_group_id: bioenergetic_failure_model
  hypothesis_label: Oxidative Stress and Mitochondrial Bioenergetic Failure Model
  status: ALTERNATIVE
  description: >-
    An alternative, non-exclusive account holds that organ dysfunction in sepsis
    is driven less by perfusion failure than by a cellular inability to use
    oxygen. Overwhelming reactive species production with failure of antioxidant
    systems produces mitochondrial injury, so that organs fail despite adequate
    delivery of oxygen. This is offered as a complementary rather than competing
    mechanism, and it predicts that restoring macrocirculatory flow alone will
    not reverse organ dysfunction.
  evidence:
  - reference: PMID:24690420
    reference_title: "Sepsis, mitochondrial failure and multiple organ dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The loss of the redox balance, together with a systemic inflammatory
      response during sepsis, can lead to progressive and irreversible
      mitochondrial failure, energy depletion, hypoxia, septic shock, severe
      sepsis, multiple organ dysfunction and death of the patient.
    explanation: >-
      States the redox/mitochondrial route to multiple organ dysfunction that
      defines this hypothesis group.
  notes: >-
    The two hypothesis groups are curated as complementary. No evidence here
    establishes the relative contribution of microcirculatory versus
    bioenergetic failure to organ dysfunction in an individual patient, and the
    causal edges are annotated accordingly rather than ranked.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 648.0
  rate_low: 515.0
  rate_high: 833.0
  notes: >-
    Derived from the GBD 2017 estimate of 48.9 million (95% UI 38.9-62.9)
    incident sepsis cases worldwide against a 2017 world population of
    approximately 7.55 billion. The source reports absolute counts, not a rate;
    the per-100,000 figures are this derivation and should be re-derived rather
    than quoted as published.
  evidence:
  - reference: PMID:31954465
    reference_title: "Global, regional, and national sepsis incidence and mortality, 1990-2017: analysis for the Global Burden of Disease Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2017, an estimated 48·9 million (95% uncertainty interval [UI]
      38·9-62·9) incident cases of sepsis were recorded worldwide and 11·0
      million (10·1-12·0) sepsis-related deaths were reported
    explanation: >-
      The GBD analysis supplies the global incident-case count from which the
      normalized rate in this record is derived.
pathophysiology:
- name: Invasive Infection and Pattern Recognition
  description: >-
    A bacterial, viral, or fungal infection at any site - most often lung,
    abdomen, urinary tract, or bloodstream - releases pathogen-associated
    molecular patterns that engage host pattern-recognition receptors. Tissue
    injury at the site of infection adds damage-associated molecular patterns to
    the same sensing machinery. The identity of the pathogen is not what makes
    the syndrome; the host response to it is.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Toll-like receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
  downstream:
  - target: Dysregulated Innate Immune Activation
    causal_link_type: DIRECT
    hypothesis_groups:
    - thromboinflammatory_microcirculatory_model
    description: >-
      Pattern recognition initiates the host response whose dysregulation, not
      the infection itself, defines sepsis.
    evidence:
    - reference: PMID:26903338
      reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sepsis should be defined as life-threatening organ dysfunction caused by
        a dysregulated host response to infection.
      explanation: >-
        The consensus definition places the dysregulated host response, not the
        pathogen, causally between infection and organ dysfunction.
  evidence:
  - reference: PMID:24232462
    reference_title: "Sepsis-induced immunosuppression: from cellular dysfunctions to immunotherapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sepsis - which is a severe life-threatening infection with organ
      dysfunction - initiates a complex interplay of host pro-inflammatory and
      anti-inflammatory processes.
    explanation: >-
      Establishes infection as the initiating event of the host program modeled
      by the rest of this graph.
- name: Dysregulated Innate Immune Activation
  description: >-
    Innate immune cells mount a proinflammatory program with cytokine and
    chemokine release, complement activation, neutrophil recruitment, and
    reactive oxygen species production. In sepsis this response is not merely
    large but unbalanced: hyperinflammation and immune suppression run
    concurrently rather than sequentially, which is why the syndrome resists
    treatment framed as either simple inflammation or simple immunodeficiency.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: Positive regulation of inflammatory response
    modifier: INCREASED
    term:
      id: GO:0050729
      label: positive regulation of inflammatory response
  - preferred_term: Reactive oxygen species metabolic process
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  - preferred_term: Neutrophil extracellular trap formation
    modifier: INCREASED
    term:
      id: GO:0140645
      label: neutrophil extracellular trap formation
  downstream:
  - target: Endothelial Activation and Glycocalyx Degradation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - thromboinflammatory_microcirculatory_model
    description: >-
      Inflammatory mediators and activated leukocytes drive the endothelium into
      a proinflammatory, proadhesive, procoagulant state.
    evidence:
    - reference: PMID:32101446
      reference_title: Endothelial Responses in Sepsis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        During sepsis, ECs shift toward a proapoptotic, proinflammatory,
        proadhesive, and procoagulant phenotype.
      explanation: >-
        Directly states the endothelial phenotype switch that this edge asserts
        occurs downstream of innate immune activation.
  - target: Sepsis-Induced Immunosuppression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The anti-inflammatory arm of the same host program, running concurrently,
      produces a protracted immunosuppressed state in patients whose sepsis does
      not resolve.
    evidence:
    - reference: PMID:24232462
      reference_title: "Sepsis-induced immunosuppression: from cellular dysfunctions to immunotherapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with unresolved, prolonged sepsis enter a phase of
        immunosuppression that is characterized by a failure to eradicate the
        primary infection, the acquisition of lethal secondary infections and/or
        the reactivation of numerous latent viruses.
      explanation: >-
        Supports the immunosuppressive arm as a downstream consequence of the
        same dysregulated host response.
  - target: Mitochondrial Dysfunction and Bioenergetic Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - bioenergetic_failure_model
    description: >-
      Reactive species generated by the inflammatory response overwhelm
      antioxidant capacity and injure mitochondria.
    evidence:
    - reference: PMID:24690420
      reference_title: "Sepsis, mitochondrial failure and multiple organ dysfunction."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        One of the pivotal factors in these processes is the increase of
        reactive species accompanied by the failure of the antioxidant systems,
        leading to a state of irreversible oxidative stress and mitochondrial
        failure.
      explanation: >-
        States the oxidative route from the inflammatory response to
        mitochondrial failure that this edge represents.
  evidence:
  - reference: PMID:34758337
    reference_title: The immunology of sepsis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This recently implemented definition does not capture the heterogeneity or
      the underlying pathophysiology of the syndrome, which is characterized by
      concurrent unbalanced hyperinflammation and immune suppression.
    explanation: >-
      Supports modeling the innate response as concurrently hyperinflammatory
      and immunosuppressive rather than as a single inflammatory phase.
  - reference: PMID:34758337
    reference_title: The immunology of sepsis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NETosis during sepsis can be detrimental through various mechanisms,
      including induction of intravascular thrombosis and multiple organ failure
    explanation: >-
      Supports curating neutrophil extracellular trap formation on this node:
      the same neutrophil effector that traps bacteria becomes injurious in
      sepsis, and the review names intravascular thrombosis and organ failure as
      its consequences, which are the two nodes downstream of this one.
- name: Endothelial Activation and Glycocalyx Degradation
  description: >-
    The endothelium, acting as a nonconventional immune organ, switches to a
    proapoptotic, proinflammatory, proadhesive, and procoagulant phenotype.
    Shedding of the glycocalyx exposes adhesion molecules and procoagulant
    surface, increases permeability with interstitial fluid loss, and impairs
    vasomotor regulation.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Response to cytokine
    modifier: INCREASED
    term:
      id: GO:0034097
      label: response to cytokine
  downstream:
  - target: Thromboinflammation and Sepsis-Induced Coagulopathy
    causal_link_type: DIRECT
    hypothesis_groups:
    - thromboinflammatory_microcirculatory_model
    description: >-
      The procoagulant endothelial surface, together with activated leukocytes
      and platelets, drives coagulation activation with suppressed fibrinolysis.
    evidence:
    - reference: PMID:37221630
      reference_title: "The pathophysiology, diagnosis, and management of sepsis-associated disseminated intravascular coagulation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The pathophysiology of sepsis-associated DIC is multifactorial, and in
        addition to coagulation activation with suppressed fibrinolysis,
        multiple inflammatory responses are initiated by activated leukocytes,
        platelets, and vascular endothelial cells as part of thromboinflammation.
      explanation: >-
        Names endothelial cells among the drivers of the thromboinflammatory
        state this edge points to.
  - target: Microcirculatory Dysfunction and Tissue Hypoperfusion
    causal_link_type: DIRECT
    hypothesis_groups:
    - thromboinflammatory_microcirculatory_model
    description: >-
      Glycocalyx damage and loss of vascular tone regulation directly impair
      microcirculatory blood flow.
    evidence:
    - reference: PMID:32101446
      reference_title: Endothelial Responses in Sepsis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In addition, glycocalyx damage and vascular tone dysfunction impair
        microcirculatory blood flow, leading to organ injury and, potentially,
        life-threatening organ failure.
      explanation: >-
        Directly asserts the glycocalyx-to-microcirculation causal step modeled
        by this edge.
  evidence:
  - reference: PMID:32101446
    reference_title: Endothelial Responses in Sepsis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Endothelial cells (ECs) are vascular, nonconventional immune cells that
      play a major role in the systemic response after bacterial infection to
      limit its dissemination.
    explanation: >-
      Supports treating the endothelium as an active immune participant rather
      than a passive barrier in this node.
- name: Thromboinflammation and Sepsis-Induced Coagulopathy
  description: >-
    Coagulation activation with suppressed fibrinolysis produces widespread
    microvascular fibrin deposition and platelet consumption. This ranges from
    the compensated sepsis-induced coagulopathy stage, detectable with platelet
    count, prothrombin time-INR, and SOFA score, to overt disseminated
    intravascular coagulation as an end-stage consumptive state.
  conforms_to: "thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation"
  role: mediator
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: Blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  - preferred_term: Fibrin clot formation
    modifier: INCREASED
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
  downstream:
  - target: Microcirculatory Dysfunction and Tissue Hypoperfusion
    causal_link_type: DIRECT
    hypothesis_groups:
    - thromboinflammatory_microcirculatory_model
    description: >-
      Microvascular fibrin deposition obstructs capillary flow and compounds the
      perfusion defect caused by endothelial dysfunction.
    evidence:
    - reference: PMID:37221630
      reference_title: "The pathophysiology, diagnosis, and management of sepsis-associated disseminated intravascular coagulation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        However, DIC is not merely a decompensated coagulation disorder, but
        also includes early stages with systemic activation in coagulation.
      explanation: >-
        Supports systemic coagulation activation as an early, ongoing process
        rather than only a terminal event. The abstract does not quantify the
        flow-obstruction contribution, so the microcirculatory consequence is
        inferred rather than stated here.
  evidence:
  - reference: PMID:37221630
    reference_title: "The pathophysiology, diagnosis, and management of sepsis-associated disseminated intravascular coagulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accordingly, the ISTH introduced SIC criteria in 2019 that are easy to
      use and require only platelet count, prothrombin time-international
      normalized ratio, and Sequential Organ Failure Assessment Score.
    explanation: >-
      Supports the compensated sepsis-induced coagulopathy stage described in
      this node and names its operational measures.
  - reference: PMID:37221630
    reference_title: "The pathophysiology, diagnosis, and management of sepsis-associated disseminated intravascular coagulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Activated monocytes express tissue factor (TF) and phosphatidylserine (PS)
      on the surface, which initiate coagulation cascades.
    explanation: >-
      Names tissue-factor-initiated coagulation as the entry into the cascade,
      which is the step the thrombogenesis module node this entry conforms to
      describes generically and which sepsis specializes to monocyte tissue
      factor.
  - reference: PMID:37221630
    reference_title: "The pathophysiology, diagnosis, and management of sepsis-associated disseminated intravascular coagulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among the coagulation factors, thrombin is a critical mediator that
      regulates inflammation and coagulation
    explanation: >-
      Identifies thrombin as the central mediator of this node, which is what
      makes it a conformer of the module's thrombin-driven fibrin formation
      node rather than only a generic coagulation abnormality.
- name: Microcirculatory Dysfunction and Tissue Hypoperfusion
  description: >-
    Loss of capillary density, heterogeneous flow, and increased permeability
    uncouple regional perfusion from systemic hemodynamics. Tissue oxygen
    delivery falls even when cardiac output and arterial pressure are restored,
    which is the physiological reason macrocirculatory resuscitation alone does
    not reliably reverse organ dysfunction.
  role: mediator
  biological_scale: TISSUE
  downstream:
  - target: Multiple Organ Dysfunction
    causal_link_type: DIRECT
    hypothesis_groups:
    - thromboinflammatory_microcirculatory_model
    description: >-
      Sustained hypoperfusion of multiple vascular beds produces the organ
      dysfunction that defines sepsis.
    evidence:
    - reference: PMID:32101446
      reference_title: Endothelial Responses in Sepsis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In addition, glycocalyx damage and vascular tone dysfunction impair
        microcirculatory blood flow, leading to organ injury and, potentially,
        life-threatening organ failure.
      explanation: >-
        Explicitly carries microcirculatory impairment through to organ injury
        and organ failure.
  - target: Sepsis-Associated Acute Kidney Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - thromboinflammatory_microcirculatory_model
    description: >-
      The kidney is among the earliest and most frequently injured organs, with
      microcirculatory dysfunction one of the proposed pathogenic routes.
    evidence:
    - reference: PMID:33752856
      reference_title: Sepsis-Associated Acute Kidney Injury.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Possible pathogenic mechanisms to explain S-AKI include microcirculatory
        dysfunction, a dysregulated inflammatory response, and cellular
        metabolic reprogramming.
      explanation: >-
        Names microcirculatory dysfunction as a pathogenic mechanism of
        sepsis-associated AKI; the source's own hedging is preserved in the node
        description.
- name: Mitochondrial Dysfunction and Bioenergetic Failure
  description: >-
    Irreversible oxidative stress injures mitochondria, so that cells cannot
    generate ATP even where oxygen is delivered. This cytopathic-hypoxia arm is
    curated as an alternative, complementary route to organ dysfunction rather
    than as a step in the microcirculatory chain.
  role: mediator
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Multiple Organ Dysfunction
    causal_link_type: DIRECT
    hypothesis_groups:
    - bioenergetic_failure_model
    description: >-
      Energy depletion at the cellular level produces organ dysfunction
      independently of, and additively to, perfusion failure.
    evidence:
    - reference: PMID:24690420
      reference_title: "Sepsis, mitochondrial failure and multiple organ dysfunction."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The loss of the redox balance, together with a systemic inflammatory
        response during sepsis, can lead to progressive and irreversible
        mitochondrial failure, energy depletion, hypoxia, septic shock, severe
        sepsis, multiple organ dysfunction and death of the patient.
      explanation: >-
        Directly asserts the mitochondrial-failure-to-multiple-organ-dysfunction
        step this edge represents.
  evidence:
  - reference: PMID:24690420
    reference_title: "Sepsis, mitochondrial failure and multiple organ dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of this review is to consider the state of oxidative stress,
      failure of the antioxidant systems and mitochondrial failure as the main
      physiopathological mechanisms leading to multiple organ dysfunction during
      sepsis.
    explanation: >-
      States the review's framing of oxidative stress and mitochondrial failure
      as mechanisms of organ dysfunction, which is what this node captures.
- name: Sepsis-Associated Acute Kidney Injury
  description: >-
    Acute kidney injury develops in roughly two thirds of patients with septic
    shock and is often present before medical attention is sought, making it an
    early sepsis-defining event rather than a late complication. It is curated
    as a distinct node because its mechanism is only partly the shared
    perfusion defect.
  role: outcome
  biological_scale: ORGANISM
  downstream:
  - target: Multiple Organ Dysfunction
    causal_link_type: DIRECT
    description: >-
      Renal dysfunction is one component of, and a major contributor to
      mortality within, the multiple organ dysfunction that defines sepsis.
    evidence:
    - reference: PMID:33752856
      reference_title: Sepsis-Associated Acute Kidney Injury.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sepsis-associated acute kidney injury (S-AKI) is a common and
        life-threatening complication in hospitalized and critically ill
        patients.
      explanation: >-
        Establishes S-AKI as a common, life-threatening organ-level complication
        of sepsis.
  evidence:
  - reference: PMID:33752856
    reference_title: Sepsis-Associated Acute Kidney Injury.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiology of S-AKI remains incompletely understood, so most
      therapies remain reactive and nonspecific.
    explanation: >-
      The source's explicit statement of incomplete mechanistic understanding is
      preserved rather than curated away.
- name: Sepsis-Induced Immunosuppression
  description: >-
    Patients whose sepsis does not resolve enter a protracted immunosuppressed
    state marked by failure to clear the primary infection, acquisition of
    secondary infections, and reactivation of latent viruses. This arm accounts
    for much of the late mortality and is the rationale for immune-stimulating
    rather than anti-inflammatory therapy in selected patients.
  role: outcome
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: Apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:24232462
    reference_title: "Sepsis-induced immunosuppression: from cellular dysfunctions to immunotherapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The immunosuppressive phase of sepsis is multifactorial and features
      defects in both innate and adaptive immunity, including apoptotic
      depletion of immune effector cells, increased numbers of regulatory T
      cells, decreased expression of positive co-stimulatory molecules,
      increased expression of negative co-stimulatory molecules, increased
      numbers of myeloid-derived suppressor cells and T cell exhaustion.
    explanation: >-
      Supports both the lymphocyte-apoptosis annotation and the multifactorial
      immune-defect description of this node.
- name: Multiple Organ Dysfunction
  description: >-
    Concurrent dysfunction across respiratory, renal, hepatic, coagulation,
    cardiovascular, and neurological systems, operationalized clinically as an
    increase in the Sequential Organ Failure Assessment score. Organ dysfunction
    is not a complication of sepsis but the element that distinguishes sepsis
    from uncomplicated infection.
  role: outcome
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:29937192
    reference_title: Sepsis and septic shock.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sepsis is now defined as infection with organ dysfunction. This definition
      codifies organ dysfunction using the Sequential Organ Failure Assessment
      score.
    explanation: >-
      States that organ dysfunction is definitional for sepsis and names the
      instrument used to operationalize it.
phenotypes:
- category: Constitutional
  name: Fever
  description: >-
    Fever is the common presenting sign of the infection that initiates sepsis,
    though hypothermia occurs and neither is required for the diagnosis under
    Sepsis-3.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
    temporality: ACUTE
- category: Cardiovascular
  name: Hypotension
  description: >-
    Vasodilation, capillary leak, and myocardial depression lower arterial
    pressure; a vasopressor requirement to maintain a mean arterial pressure of
    at least 65 mm Hg is part of the clinical identification of septic shock.
  phenotype_term:
    preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
    temporality: ACUTE
  evidence:
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with septic shock can be clinically identified by a vasopressor
      requirement to maintain a mean arterial pressure of 65 mm Hg or greater
      and serum lactate level greater than 2 mmol/L (>18 mg/dL) in the absence
      of hypovolemia.
    explanation: >-
      Supports vasopressor-dependent hypotension as a defining clinical feature
      of the septic shock subset.
- category: Cardiovascular
  name: Shock
  subtype: Septic shock
  description: >-
    Circulatory failure with profound cellular and metabolic derangement,
    associated with hospital mortality above 40%.
  phenotype_term:
    preferred_term: Shock
    term:
      id: HP:0031273
      label: Shock
    temporality: ACUTE
    severity: SEVERE
  evidence:
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This combination is associated with hospital mortality rates greater than
      40%.
    explanation: >-
      Supplies the mortality figure quoted in this phenotype's description.
- category: Cardiovascular
  name: Tachycardia
  description: >-
    Compensatory tachycardia accompanies vasodilation and reduced effective
    circulating volume.
  phenotype_term:
    preferred_term: Tachycardia
    term:
      id: HP:0001649
      label: Tachycardia
    temporality: ACUTE
- category: Respiratory
  name: Tachypnea
  description: >-
    A respiratory rate of 22/min or greater is one of the three quickSOFA
    criteria used to identify patients with suspected infection who are more
    likely to have poor outcomes.
  phenotype_term:
    preferred_term: Tachypnea
    term:
      id: HP:0002789
      label: Tachypnea
    temporality: ACUTE
  evidence:
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      they have at least 2 of the following clinical criteria that together
      constitute a new bedside clinical score termed quickSOFA (qSOFA):
      respiratory rate of 22/min or greater, altered mentation, or systolic
      blood pressure of 100 mm Hg or less.
    explanation: >-
      Names tachypnea at the stated threshold as a qSOFA criterion.
- category: Respiratory
  name: Sepsis-Induced Hypoxemic Respiratory Failure
  description: >-
    Acute hypoxemic respiratory failure is the respiratory arm of the organ
    dysfunction that defines sepsis, and the lung is the organ system the
    Multiple Organ Dysfunction node names first. It arises both from pulmonary
    sources of sepsis such as pneumonia and from non-pulmonary infection
    progressing to ARDS, and it is the organ dysfunction the Surviving Sepsis
    Campaign guideline addresses with the largest number of separate
    recommendations (oxygen targets, high-flow nasal oxygen, and tidal-volume
    strategy with and without ARDS).
  phenotype_term:
    preferred_term: Sepsis-induced hypoxemic respiratory failure
    term:
      id: HP:0002878
      label: Respiratory failure
    temporality: ACUTE
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute hypoxemic respiratory failure can result from causes of sepsis such
      as pneumonia or non-pulmonary infections resulting in ARDS.
    explanation: >-
      States that acute hypoxemic respiratory failure follows from sepsis by
      both the pulmonary and the non-pulmonary route, which is the claim this
      phenotype's description makes.
- category: Neurological
  name: Encephalopathy
  description: >-
    Altered mentation is a qSOFA criterion and a common manifestation of sepsis;
    it reflects diffuse cerebral dysfunction rather than a focal lesion.
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
    temporality: ACUTE
  evidence:
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      they have at least 2 of the following clinical criteria that together
      constitute a new bedside clinical score termed quickSOFA (qSOFA):
      respiratory rate of 22/min or greater, altered mentation, or systolic
      blood pressure of 100 mm Hg or less.
    explanation: >-
      Names altered mentation as a qSOFA criterion, which is what this phenotype
      records.
- category: Renal
  name: Acute kidney injury
  description: >-
    Acute kidney injury develops in about two thirds of patients with septic
    shock and frequently precedes presentation.
  phenotype_term:
    preferred_term: Acute kidney injury
    term:
      id: HP:0001919
      label: Acute kidney injury
    temporality: ACUTE
  evidence:
  - reference: PMID:33752856
    reference_title: Sepsis-Associated Acute Kidney Injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute kidney injury (AKI) develops in about two thirds of patients with
      septic shock,5,6 and in half of them, AKI develops before presenting to
      the emergency department.
    explanation: >-
      Supplies both the frequency and the early-onset claim in this phenotype's
      description.
- category: Renal
  name: Oliguria
  description: >-
    Falling urine output is one of the two ways sepsis-associated acute kidney
    injury declares itself, alongside a rising serum creatinine, and it is the
    one visible at the bedside without a laboratory result.
  phenotype_term:
    preferred_term: Oliguria
    term:
      id: HP:0100520
      label: Oliguria
    temporality: ACUTE
  evidence:
  - reference: PMID:33752856
    reference_title: Sepsis-Associated Acute Kidney Injury.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      it is reasonable to define S-AKI as a clinical syndrome characterized by
      an abrupt deterioration of renal function manifested by an increase in
      sCr, oliguria, or both, in the presence of sepsis without other meaningful
      explaining factors.
    explanation: >-
      Names oliguria as one of the two manifestations by which sepsis-associated
      acute kidney injury is defined. The review proposes this working
      definition in the absence of a consensus one, which is why it is cited for
      the manifestation rather than for a frequency.
- category: Hematologic
  name: Thrombocytopenia
  description: >-
    Platelet consumption in thromboinflammation lowers the platelet count, which
    is one of the three components of the ISTH sepsis-induced coagulopathy
    score.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
    temporality: ACUTE
  evidence:
  - reference: PMID:37221630
    reference_title: "The pathophysiology, diagnosis, and management of sepsis-associated disseminated intravascular coagulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accordingly, the ISTH introduced SIC criteria in 2019 that are easy to
      use and require only platelet count, prothrombin time-international
      normalized ratio, and Sequential Organ Failure Assessment Score.
    explanation: >-
      Confirms platelet count as a scored component of sepsis-induced
      coagulopathy, the basis for curating thrombocytopenia here.
- category: Hematologic
  name: Disseminated intravascular coagulation
  description: >-
    Overt DIC is the end-stage consumptive coagulopathy of sepsis; the earlier
    compensated stage is captured by the sepsis-induced coagulopathy criteria.
  phenotype_term:
    preferred_term: Disseminated intravascular coagulation
    term:
      id: HP:0005521
      label: Disseminated intravascular coagulation
    temporality: ACUTE
  evidence:
  - reference: PMID:37221630
    reference_title: "The pathophysiology, diagnosis, and management of sepsis-associated disseminated intravascular coagulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since then, DIC has been understood as the end-stage consumptive
      coagulopathy and not the therapeutic target.
    explanation: >-
      States the end-stage consumptive framing used in this phenotype's
      description.
biochemical:
- name: Serum lactate
  presence: INCREASED
  context: >-
    A serum lactate above 2 mmol/L in the absence of hypovolemia, together with
    a vasopressor requirement, is part of the clinical identification of septic
    shock. Lactate is a severity and perfusion marker, not a diagnostic test for
    sepsis.
  biomarker_term:
    preferred_term: lactate
    term:
      id: CHEBI:24996
      label: lactate
  evidence:
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with septic shock can be clinically identified by a vasopressor
      requirement to maintain a mean arterial pressure of 65 mm Hg or greater
      and serum lactate level greater than 2 mmol/L (>18 mg/dL) in the absence
      of hypovolemia.
    explanation: >-
      Supplies the threshold and the interpretive context recorded here.
diagnosis:
- name: Organ dysfunction scoring (SOFA)
  description: >-
    Sepsis is diagnosed by demonstrating organ dysfunction in a patient with
    suspected infection, and the Sequential Organ Failure Assessment score is
    the instrument that operationalizes it. An acute rise of 2 points or more
    is the Sepsis-3 threshold. The score is a characterization of the patient
    rather than a management tool, and its components require laboratory
    results, so it does not capture dysfunction the moment it begins.
  diagnosis_term:
    preferred_term: organ dysfunction scoring
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    An acute increase of 2 or more SOFA points in a patient with suspected
    infection, graded by organ system.
  markers: PaO2, platelet count, creatinine level, bilirubin level
  evidence:
  - reference: PMID:29937192
    reference_title: Sepsis and septic shock.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This definition codifies organ dysfunction using the Sequential Organ
      Failure Assessment score.
    explanation: >-
      Names SOFA as the instrument by which the definitional element of sepsis
      is established.
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The score grades abnormality by organ system and accounts for clinical
      interventions.
    explanation: >-
      Describes what the score measures, which is the basis for the organ
      systems listed in the markers field.
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, laboratory variables, namely, PaO2, platelet count, creatinine
      level, and bilirubin level, are needed for full computation.
    explanation: >-
      Names the four laboratory variables recorded in the markers field, and is
      the basis for the description's caveat that the score cannot capture
      dysfunction the moment it begins.
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A higher SOFA score is associated with an increased probability of
      mortality
    explanation: >-
      Supports the score's prognostic use, which is why it is the instrument the
      consensus definition chose.
- name: Bedside screening (qSOFA and other screening tools)
  description: >-
    qSOFA (respiratory rate 22/min or greater, altered mentation, systolic blood
    pressure 100 mm Hg or less) identifies infected patients more likely to
    have poor outcomes. It is curated here with its limitation attached: the
    2021 guideline recommends against using it as a single screening tool
    because it is specific but not sensitive, and a positive qSOFA should raise
    suspicion rather than rule sepsis in or out.
  diagnosis_term:
    preferred_term: bedside sepsis screening
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Two or more of the three qSOFA criteria in a patient with suspected
    infection.
  evidence:
  - reference: PMID:26903338
    reference_title: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      they have at least 2 of the following clinical criteria that together
      constitute a new bedside clinical score termed quickSOFA (qSOFA):
      respiratory rate of 22/min or greater, altered mentation, or systolic
      blood pressure of 100 mm Hg or less.
    explanation: >-
      Supplies the three criteria and the two-of-three threshold recorded here.
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We recommend against using qSOFA compared to SIRS, NEWS, or MEWS as a
      single screening tool for sepsis or septic shock
    explanation: >-
      Recommendation 2, which is the limitation this entry records. It is the
      reason qSOFA is curated as a bedside alert rather than as the diagnostic
      test.
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is wide variation in diagnostic accuracy of these tools with most
      having poor predictive values
    explanation: >-
      Generalizes the limitation beyond qSOFA to the screening tools as a class,
      which is why no screening instrument is curated here as diagnostic.
- name: Microbiologic cultures before antimicrobials
  description: >-
    Blood and site-appropriate cultures taken before the first antimicrobial
    dose are what identify the organism and allow the empiric regimen to be
    narrowed. The guideline makes the ordering conditional rather than
    absolute, on the condition that obtaining them causes no substantial delay
    to antimicrobial therapy.
  diagnosis_term:
    preferred_term: microbial culture procedure
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  results: >-
    Isolation of a causative organism with susceptibility testing, or no growth.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      routine microbiologic cultures (including blood) should be obtained
      before starting antimicrobial therapy in patients with suspected sepsis
      and septic shock
    explanation: >-
      States the practice and its ordering relative to antimicrobial therapy.
      The guideline attaches the delay qualifier in the same passage.
- name: Serum lactate measurement
  description: >-
    Lactate is measured in suspected sepsis as an adjunct that shifts the
    pre-test probability and marks severity. It is not a diagnostic test: the
    guideline states plainly that lactate alone can neither rule the diagnosis
    in nor out.
  diagnosis_term:
    preferred_term: lactic acid measurement
    term:
      id: NCIT:C79450
      label: Lactic Acid Measurement
  results: >-
    Elevated serum lactate, with cutoffs in the reported studies ranging from
    1.6 to 2.5 mmol/L; above 2 mmol/L is part of the septic shock criteria.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For adults suspected of having sepsis, we suggest measuring blood lactate
    explanation: >-
      Recommendation 3, the guideline statement that lactate should be measured
      in suspected sepsis.
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, lactate alone is neither sensitive nor specific enough to
      rule-in or rule-out the diagnosis on its own.
    explanation: >-
      States the limitation that keeps this curated as an adjunctive
      measurement rather than a diagnostic test.
- name: Continued search for an alternative diagnosis
  description: >-
    There is no confirmatory test for sepsis, and a third or more of patients
    initially diagnosed with it turn out to have something else. The guideline
    therefore makes continued re-evaluation part of the diagnostic process
    rather than an afterthought, with empiric antimicrobials stopped when an
    alternative cause is demonstrated or strongly suspected.
  diagnosis_term:
    preferred_term: differential diagnosis
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment
  results: >-
    Either continued treatment as sepsis, or an alternative diagnosis with
    empiric antimicrobials discontinued.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For adults with suspected sepsis or septic shock but unconfirmed
      infection, we recommend continuously re-evaluating and searching for
      alternative diagnoses and discontinuing empiric antimicrobials if an
      alternative cause of illness is demonstrated or strongly suspected
    explanation: >-
      Recommendation 11, which is the practice this entry records.
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Since there is no "gold standard" test to diagnose sepsis, the bedside
      provider cannot have a differential diagnosis of sepsis alone in a patient
      with organ dysfunction.
    explanation: >-
      States the absence of a confirmatory test, which is the reason this is a
      diagnostic step at all.
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Indeed, a third or more of patients initially diagnosed with sepsis turn
      out to have non-infectious conditions
    explanation: >-
      Supplies the misdiagnosis figure quoted in this entry's description.
treatments:
- name: Immediate Antimicrobial Therapy
  description: >-
    Prompt administration of appropriate antimicrobials is the intervention
    directed at the initiating infection. Guidelines recommend immediate
    administration for confirmed or very likely sepsis, and a rapid assessment
    of infectious versus non-infectious causes when sepsis is only possible and
    shock is absent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-infective agent
      term:
        id: NCIT:C254
        label: Anti-Infective Agent
  target_mechanisms:
  - target: Invasive Infection and Pattern Recognition
    treatment_effect: INHIBITS
    description: >-
      Antimicrobial therapy reduces pathogen burden and therefore the PAMP load
      driving the host response, acting at the trigger node of the graph.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we recommend administering antimicrobials immediately, ideally within
      1 h of recognition
    explanation: >-
      Recommendation 12 states the immediacy of antimicrobial administration
      directly, rather than leaving it to be inferred from sepsis being an
      emergency.
- name: Source Control of the Infectious Focus
  description: >-
    Drainage of an abscess, debridement of infected necrotic tissue, or removal
    of an infected device is the second intervention directed at the initiating
    infection. The guideline recommends rapidly identifying or excluding an
    anatomical focus that requires emergent source control, and implementing it
    as soon as medically and logistically practical.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: source control intervention
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Invasive Infection and Pattern Recognition
    treatment_effect: INHIBITS
    description: >-
      Removing or draining the focus eliminates the source of the pathogen- and
      damage-associated molecular patterns that drive the host response, acting
      on the same trigger node as antimicrobial therapy by a different route.
    evidence:
    - reference: PMID:34599691
      reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Clinical experience suggests that without adequate source control, many
        severe presentations will not stabilise or improve despite rapid
        resuscitation and provision of appropriate antimicrobials.
      explanation: >-
        States that antimicrobials and resuscitation do not substitute for
        source control, which is why this intervention is curated as acting on
        the trigger node in its own right rather than as part of antimicrobial
        therapy.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Source control may include drainage of an abscess, debriding infected
      necrotic tissue, removal of a potentially infected device
    explanation: >-
      Enumerates the interventions this treatment covers, which is what the
      generic NCIT action term cannot express.
  notes: >-
    NCIT has no clinical-action term for source control as a concept, so the
    generic Therapeutic Procedure term is used. Its instances are heterogeneous
    by design - percutaneous drainage, open debridement, and device removal are
    all source control - and binding any one of them (for example Drainage,
    NCIT:C50434) would name a single instance as though it were the category.
    The guideline gives no recommended timeframe: it states that the supporting
    studies suggest 6 to 12 hours but that the data are too limited to
    recommend a window.
- name: Crystalloid Fluid Resuscitation
  description: >-
    Intravenous crystalloid is the first-line resuscitation fluid for
    sepsis-induced hypoperfusion or septic shock, with at least 30 mL/kg
    suggested within the first three hours. This addresses the macrocirculatory
    deficit and does not by itself correct microcirculatory or bioenergetic
    failure.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fluid therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Microcirculatory Dysfunction and Tissue Hypoperfusion
    treatment_effect: INHIBITS
    description: >-
      Volume expansion targets the hypoperfusion node, though the guideline
      grades the specific volume recommendation weakly.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the use of crystalloids as first-line fluid for resuscitation in sepsis
      and septic shock
    explanation: >-
      States the guideline's first-line fluid choice recorded in this treatment.
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients with sepsis induced hypoperfusion or septic shock we suggest
      that at least 30 mL/kg of intravenous (IV) crystalloid fluid should be
      given within the first 3 h of resuscitation
    explanation: >-
      Supplies the volume and timing. The guideline itself grades this a weak
      recommendation on low-quality evidence.
- name: Norepinephrine Vasopressor Support
  description: >-
    Norepinephrine is the first-line vasopressor for septic shock, restoring
    mean arterial pressure when fluid resuscitation alone is insufficient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: norepinephrine
      term:
        id: CHEBI:33569
        label: noradrenaline
  target_mechanisms:
  - target: Microcirculatory Dysfunction and Tissue Hypoperfusion
    treatment_effect: INHIBITS
    description: >-
      Vasopressor support restores perfusion pressure across vascular beds
      whose tone regulation has been lost.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      strong recommendation for norepinephrine as the first-line agent
    explanation: >-
      States the guideline panel's first-line vasopressor recommendation
      recorded here.
- name: Vasopressin as Second-Line Vasopressor
  description: >-
    For septic shock on norepinephrine with an inadequate mean arterial
    pressure, the guideline suggests adding vasopressin rather than escalating
    the norepinephrine dose. Unlike the catecholamines it is not titrated to
    response but given at a fixed dose, and it raises pressure through V1
    receptors on vascular smooth muscle rather than through adrenergic
    receptors.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vasopressin
      term:
        id: CHEBI:34543
        label: argipressin
  target_mechanisms:
  - target: Microcirculatory Dysfunction and Tissue Hypoperfusion
    treatment_effect: INHIBITS
    description: >-
      Vasopressin restores perfusion pressure by a non-adrenergic route, which
      is what makes it an addition to norepinephrine rather than a substitute
      for a higher dose of it.
    evidence:
    - reference: PMID:34599691
      reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        binding of V1 receptors on vascular smooth muscle resulting in increased
        arterial blood pressure
      explanation: >-
        States the receptor mechanism by which this treatment acts on the
        perfusion node, and the one that distinguishes it from norepinephrine.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For adults with septic shock on norepinephrine with inadequate MAP levels,
      we suggest adding vasopressin instead of escalating the dose of
      norepinephrine
    explanation: >-
      Recommendation 38, which states the escalation step this treatment
      records. The guideline grades it weak on moderate-quality evidence.
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unlike most vasopressors, vasopressin is not titrated to response, but it
      is usually administered at a fixed dose of 0.03 units/min for the
      treatment of septic shock.
    explanation: >-
      Supports the fixed-dose administration described here, which is what
      separates it from the titrated catecholamines.
- name: Low-Dose IV Hydrocortisone
  description: >-
    For septic shock with an ongoing vasopressor requirement the guideline
    suggests IV corticosteroids, in practice hydrocortisone 200 mg/day in
    divided doses. This is the intervention aimed at the dysregulated
    inflammatory arm of the host response rather than at perfusion or at the
    pathogen. The evidence behind it is faster shock resolution and more
    vasopressor-free days, without a clear effect on mortality, and the optimal
    dose, timing, and duration remain unsettled.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrocortisone
      term:
        id: NCIT:C555
        label: Therapeutic Hydrocortisone
  target_mechanisms:
  - target: Dysregulated Innate Immune Activation
    treatment_effect: INHIBITS
    description: >-
      Glucocorticoid therapy is directed at the dysregulated inflammatory arm of
      the host response, and is the only intervention curated here that acts on
      that node. The cited evidence is clinical, being shock resolution and
      vasopressor-free days, and does not measure the activity of this node
      directly. The link therefore records where the drug is understood to act,
      not a demonstrated change in the node.
  evidence:
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The optimal dose, timing of initiation, and duration of corticosteroids
      remain uncertain; recent RCTs used 200 mg per day of IV hydrocortisone in
      divided doses
    explanation: >-
      Supplies both the dose recorded in this treatment and the guideline's own
      statement that dose, timing, and duration are unsettled.
  - reference: PMID:34599691
    reference_title: "Surviving sepsis campaign: international guidelines for management of sepsis and septic shock 2021."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A meta-analysis conducted for this guideline revision (Supplementary
      Appendix 5) found an increase vasopressor-free days (MD 1.5 days; 95% CI
      0.8- 3.11 days)
    explanation: >-
      Gives the effect size the weak recommendation rests on. The guideline
      reports the same analysis finding increased neuromuscular weakness and no
      clear mortality effect, which is why the description does not claim a
      survival benefit.
  - reference: PMID:34758337
    reference_title: The immunology of sepsis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a recent re-analysis of the aforementioned VANISH trial provided further
      evidence that corticosteroid exposure may be associated with increased
      mortality among adult septic shock endotype A patients
    explanation: >-
      Supports the heterogeneity caveat recorded in this treatment's notes. The
      average effect the guideline's recommendation rests on need not be the
      effect in a given transcriptomic endotype.
  notes: >-
    The benefit is not uniform across patients. Transcriptomic septic shock
    endotypes differ in their response, and a re-analysis of the VANISH trial
    associated corticosteroid exposure with increased mortality in one of them.
    This is curated as an open caveat on a guideline-recommended therapy, not as
    a contraindication: the endotypes are research instruments derived from
    leukocyte transcriptomes and are not measured at the bedside, so there is no
    way to act on the finding in an individual patient.
discussions:
- discussion_id: disc_sepsis_grp78_cancer_susceptibility
  prompt: >-
    Does tumor-microenvironment-driven GRP78 dysregulation causally increase
    sepsis susceptibility, severity, or mortality in patients with cancer, over
    and above the recognized contributions of neutropenia, mucosal barrier
    injury, and immunosuppressive antineoplastic therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Invasive Infection and Pattern Recognition
  - pathophysiology#Sepsis-Induced Immunosuppression
  rationale: >-
    Patients with a history of cancer carry a large excess risk of acquiring and
    dying from sepsis, and sepsis and cancer are independently known to share
    immune defects, which makes a cancer-specific susceptibility mechanism
    biologically plausible. A 2026 narrative review proposes GRP78/HSPA5
    dysregulation as that mechanism, acting both as a pathogen entry cofactor
    and as a secreted immunosuppressive signal. The proposal is explicitly
    hypothesis-level: the review states that no clinical cohort study has
    established a causal link, and that its argument rests on in vitro work,
    animal models, and non-oncologic sepsis cohorts. It is therefore curated
    here as an open gap attached to the trigger and immunosuppression nodes,
    rather than as a curated causal edge, a GRP78 pathophysiology node, or a
    separate cancer-associated sepsis disease entry - any of which would assert
    more than the evidence supports.
  proposed_experiments:
  - experiment_id: exp_sepsis_grp78_oncology_cohort
    name: Oncology-specific prospective cohort of circulating GRP78 and sepsis outcome
    description: >-
      Measure circulating GRP78 at cancer diagnosis and at infection onset in a
      prospective oncology cohort, and test whether it predicts sepsis
      incidence, severity, and mortality after adjustment for neutropenia,
      mucositis, recent cytotoxic therapy, and tumor stage. This is the study
      the source review identifies as absent.
  evidence:
  - reference: PMID:42429070
    reference_title: "GRP78 dysregulation: A proposed molecular mechanism linking the tumor microenvironment to sepsis susceptibility in patients with cancer (Review)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, no clinical cohort study has directly established a causal link
      between GRP78 dysregulation and sepsis incidence or mortality in patients
      with cancer.
    explanation: >-
      The review's own statement that the causal link is unestablished is the
      primary justification for curating this as a KNOWLEDGE_GAP rather than as
      a mechanism.
  - reference: PMID:16778259
    reference_title: The epidemiology of sepsis in patients with malignancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with a history of cancer are at increased risk for acquiring and
      subsequently dying from sepsis, compared to the general population,
      although incidence and fatality rates are decreasing over time.
    explanation: >-
      Establishes that the excess sepsis risk in cancer is real, which is what
      makes the unexplained mechanistic residue worth tracking as a gap.
  - reference: PMID:24232462
    reference_title: "Sepsis-induced immunosuppression: from cellular dysfunctions to immunotherapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surprisingly, cancer and sepsis share many immune defects, and the
      remarkable success of new immunotherapeutics in cancer has highlighted the
      potential for this new approach in sepsis.
    explanation: >-
      Independent support that cancer and sepsis share immune-defect biology,
      which is the general premise the GRP78 hypothesis tries to make specific.
  notes: >-
    Opened in response to issue #6274. The scope question there offered four
    options; this discussion implements the conservative one. A conserved
    GRP78 sepsis mechanism module and a distinct Cancer-Associated Sepsis
    disease entry were both considered and deferred, because a module asserts
    a recurrent, evidenced mechanism and the source explicitly disclaims that
    evidence. If an oncology-specific cohort establishes the link, the natural
    home is a comorbidity entry over Sepsis and the relevant cancer entries.
- discussion_id: disc_sepsis_microcirculatory_vs_bioenergetic
  prompt: >-
    In an individual patient with sepsis, what determines the relative
    contribution of microcirculatory perfusion failure versus mitochondrial
    bioenergetic failure to organ dysfunction, and can the two be distinguished
    at the bedside well enough to select therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Microcirculatory Dysfunction and Tissue Hypoperfusion
  - pathophysiology#Mitochondrial Dysfunction and Bioenergetic Failure
  rationale: >-
    Both routes to multiple organ dysfunction are curated here with supporting
    evidence, and they are not mutually exclusive. Neither source quantifies the
    relative contribution, and there is no validated bedside measure that
    separates a perfusion-limited from an oxygen-utilization-limited patient.
    This matters therapeutically: resuscitation strategies target the former,
    and would not be expected to reverse the latter.
  evidence:
  - reference: PMID:24690420
    reference_title: "Sepsis, mitochondrial failure and multiple organ dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Knowledge of the molecular processes associated with the development of
      oxidative stress should facilitate the development of effective therapies
      and better prognosis for patients with sepsis and organ dysfunction.
    explanation: >-
      The review frames effective bioenergetically-targeted therapy as a future
      prospect, which is the unresolved half of this question. The sentence
      supports the gap by implication rather than stating it.

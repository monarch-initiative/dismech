datasets:
- accession: geo:GSE317056
  title: Sex disparity in systemic sclerosis-associated pulmonary fibrosis.
  description: Systemic sclerosis (SSc) is a fibrotic disease with high mortality and SSc-associated pulmonary fibrosis (SSc-PF) as the leading cause of death. SSc shows a significant sex disparity with a sex ratio of 1:3 men to women, yet SSc-PF is more severe in men. This study investigates gene expression differences between men and women with SSc-PF. Whole lung tissues from healthy donors and SSc-PF patients of both sexes were analyzed by RNA sequencing. Selected genes were validated by quantitative polymerase chain reaction (qPCR) and Western blotting analyses.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 24
  publication: PMID:42196343
  notes: Identified by GEO DataSets index search for Systemic Sclerosis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE311858
  title: RUNX1 is Expressed in a Subpopulation of Dermal Fibroblasts and is Associated with Disease Severity of Systemic Sclerosis
  description: The activation of Runt-related transcription factor 1 (RUNX1) in fibroblasts has been implicated in wound healing and fibrosis; however, the role of RUNX1 in the fibrotic progression of the autoimmune disease systemic sclerosis (SSc) is not known. Leveraging gene expression, genome-wide DNA methylation, and single-cell resolution data of SSc skin and fibroblast, we analyzed the impact of RUNX1 dysregulation in SSc dermal fibrosis. RUNX1 function was subsequently assessed using siRNA, pharmacologic inhibition, and CRISPR knockout in 2D and 3D fibroblasts cultures.

- accession: dbgap:phs000357
  title: Genome-Wide Association Study in Systemic Sclerosis
  description:  The Scleroderma Family Registry and DNA Repository (Registry) was initially developed as a registry and bio-specimen repository of patients with systemic sclerosis (scleroderma), family members and unaffected healthy controls. A case-control design was later adopted due to the lack of availability of many parents in this adult-onset disease, which precluded a linkage approach. In addition to collecting demographic data, the registry included the collection of disease-pertinent, cross-sectional, clinical information from medical records of affected participants.

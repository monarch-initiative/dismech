- accession: geo:GSE332819
  title: Longitudinal CITE-seq analysis in juvenile-onset systemic sclerosis monocytes following autologous stem cell transplant
  description: Juvenile systemic sclerosis (jSSc) is a rare and severe autoimmune disease marked by skin fibrosis and damage to multiple organ systems. This study implements autologous stem cell transplantation (ASCT), a newly available treatment protocol which aims to restore immune homeostasis, in this case amongst jSSc patients. Here, we analyze peripheral blood mononuclear cells (PBMCs) from 3 jSSc patients prior to ASCT and 6, 12, and 24 months post treatment. These samples were then sequenced and tagged with antibodies using cellular indexing of transcriptomes and epitopes (CITE-seq).

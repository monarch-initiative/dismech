- accession: massive:MSV000084800
  title: Ubiquitin Proteomics Analysis of Systemic Sclerosis Lung Fibroblasts with or without KLHL42 knockdown
  description: 'Systemic scleroderma (SSc) is an autoimmune disease which results in fibrotic production in the lung. Resultant SSC-pulmonary fibrosis is the main cause of mortality among SSc patients. From high throughput RNAi screening, we uncovered the ubiquitin E3 ligase KLHL42 as a potential pro-fibrotic mediator of TGFb-dependent fibrotic signaling in primary SSc lung fibroblasts. In this analysis, we sought to uncover putative substrates for KLHL42 by comparing SSc lung fibroblasts with control or KLHL42 siRNA prior to TGFb-treatment, lysis, and TUBE precipitation.'

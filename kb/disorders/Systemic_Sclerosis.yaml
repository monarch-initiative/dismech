- accession: ega:EGAS00001002751
  title: Antisense long non-coding RNAs are deregulated in skin tissue of patients with systemic sclerosis
  description: Systemic sclerosis (SSc) is an autoimmune disease characterized by fibrosis of skin and multiple organs of which the pathogenesis is poorly understood. Here we studied differentially expressed coding and non-coding genes in relation to SSc pathogenesis with a specific focus on antisense non-coding RNAs. Skin biopsy-derived RNAs from fourteen early SSc patients and six healthy individuals were sequenced with ion-torrent and analysed using DEseq2. Overall, 4901 genes with a fold change >1.5 and a false discovery rate < 5% were detected in patients versus controls. Upregulated genes clustered in immunological, cell adhesion and keratin-related processes.

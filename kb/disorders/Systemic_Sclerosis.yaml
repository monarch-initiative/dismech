biochemical:
- name: Anti-Scl-70 (Anti-Topoisomerase I)
  presence: Elevated
  context: Associated with diffuse cutaneous SSc and ILD
- name: Anti-Centromere Antibodies
  presence: Elevated
  context: Associated with limited cutaneous SSc
- name: Anti-RNA Polymerase III
  presence: Elevated
  context: Associated with rapidly progressive skin disease and renal crisis
- name: Forced Vital Capacity
  presence: Decreased with restrictive interstitial lung involvement; preserved or improved with effective antifibrotic response.
  context: >-
    Pulmonary function test readout used to measure restrictive ventilatory
    impairment and treatment response in systemic sclerosis-associated ILD.
  biomarker_term:
    preferred_term: Forced Vital Capacity
    term:
      id: NCIT:C111361
      label: Forced Vital Capacity
  synonyms:
  - FVC
  readouts:
  - target: Systemic Sclerosis-Associated Interstitial Lung Disease
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: NEGATIVE
    endpoint_context: PHARMACODYNAMIC
    regulatory_endpoint_refs:
    - FDA-SE-adult-noncancer-111
    interpretation: >-
      Higher or less-declining FVC indicates less progressive restrictive lung
      impairment from SSc-associated ILD; treatment-induced slowing of FVC
      decline reports pharmacodynamic slowing of ILD progression.
    evidence:
    - reference: PMID:31112379
      reference_title: "Nintedanib for Systemic Sclerosis-Associated Interstitial Lung Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among patients with ILD associated with systemic sclerosis, the annual
        rate of decline in FVC was lower with nintedanib than with placebo;
      explanation: >-
        SENSCIS supports FVC decline as the pulmonary-function response readout
        for nintedanib in SSc-associated ILD.
  evidence:
  - reference: PMID:31112379
    reference_title: "Nintedanib for Systemic Sclerosis-Associated Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary end point was the annual rate of decline in forced vital
      capacity (FVC), assessed over a 52-week period.
    explanation: >-
      SENSCIS used annual FVC decline as the primary endpoint in
      systemic-sclerosis-associated ILD.

name: Hepatocellular Carcinoma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Hepatocellular carcinoma (HCC) is the most common primary liver malignancy, typically
  arising
  in the setting of chronic liver disease and cirrhosis. Major risk factors include
  chronic
  hepatitis B or C infection, alcohol-related liver disease, and metabolic dysfunction-associated
  steatotic liver disease (MASLD/NAFLD). HCC pathogenesis involves multiple molecular
  pathways
  including WNT/beta-catenin, TP53, telomere maintenance, and chromatin remodeling.
  The
  combination of atezolizumab (anti-PD-L1) plus bevacizumab (anti-VEGF) has established
  immunotherapy as first-line treatment for advanced HCC, based on the IMbrave150
  trial.
categories:
- Gastrointestinal Cancer
- Hepatobiliary Cancer
- Liver Cancer
parents:
- liver carcinoma
has_subtypes:
- name: Viral Hepatitis-Associated HCC
  description: >-
    HCC arising in the context of chronic hepatitis B or C infection. HBV can be directly
    oncogenic through viral integration, while HCV promotes HCC primarily through
    cirrhosis
    and chronic inflammation.
- name: Alcohol-Related HCC
  description: >-
    HCC arising in alcohol-related liver disease and cirrhosis. Associated with specific
    molecular features and generally presents at more advanced stage.
- name: MASLD-Associated HCC
  description: >-
    HCC arising in metabolic dysfunction-associated steatotic liver disease (formerly
    NAFLD/NASH).
    Increasingly common subtype that can occur even without cirrhosis. May have distinct
    immune microenvironment features affecting immunotherapy response.
- name: Fibrolamellar HCC
  description: >-
    Rare variant occurring in younger patients without cirrhosis. Characterized by
    DNAJB1-PRKACA
    fusion. Distinct clinical behavior and treatment considerations.
  mappings:
    ncit_mappings:
    - term:
        id: NCIT:C4131
        label: Fibrolamellar Carcinoma
      mapping_predicate: skos:closeMatch
      mapping_source: NCIT
      mapping_justification: NCIT provides a closely aligned fibrolamellar carcinoma term for this HCC subtype.
mechanistic_hypotheses:
- hypothesis_group_id: rpp40_rnase_p_pretrna_mtor_myc_bridge
  hypothesis_label: RNase P Pre-tRNA Processing as the RPP40-mTOR/MYC Bridge
  status: EMERGING
  description: >-
    Elevated RPP40 may sustain mTOR/MYC output in established hepatocellular
    carcinoma specifically because its contribution to RNase P preserves
    5-prime pre-tRNA maturation and translational capacity. This narrow model
    predicts that an RNase P/pre-tRNA defect after acute RPP40 loss precedes
    signaling decline and is phenocopied by an RNase-P-specific perturbation.
    RPP40 is also shared with RNase MRP, however, and independent HCC evidence
    linking RPP40 to ribosomal-RNA and ribosomal-gene expression makes an
    RNase MRP/pre-rRNA or broader ribosome-biogenesis route a direct competitor.
    Neither published HCC study establishes the proposed RNase P ordering.
  evidence:
  - reference: PMID:42424930
    reference_title: RPP40, a subunit of Ribonuclease P, facilitates hepatocellular carcinoma proliferation by activating the mTOR/MYC signaling.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis showed that RPP40 expression was markedly upregulated in HCC
      tissues compared to adjacent normal tissues. High RPP40 expression
      correlated with poorer clinical outcomes, even among patients with
      matched histological grade or pathological stage.
    explanation: >-
      Multi-dataset human-tumor associations support expression and prognostic
      correlation, but they do not establish whether RPP40 is a driver,
      dependency, or consequence of proliferative state.
  - reference: PMID:42424930
    reference_title: RPP40, a subunit of Ribonuclease P, facilitates hepatocellular carcinoma proliferation by activating the mTOR/MYC signaling.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      RPP40 suppression attenuated cellular migration and proliferation, whereas
      its overexpression enhanced these malignant phenotypes both in vitro and
      in vivo.
    explanation: >-
      This item classifies the cell-culture component of the mixed result. The
      Huh-7 and HepG2 perturbations support an RPP40-dependent malignant
      phenotype in vitro, but did not test pre-tRNA maturation or RNase-P
      specificity.
  - reference: PMID:42424930
    reference_title: RPP40, a subunit of Ribonuclease P, facilitates hepatocellular carcinoma proliferation by activating the mTOR/MYC signaling.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RPP40 suppression attenuated cellular migration and proliferation, whereas
      its overexpression enhanced these malignant phenotypes both in vitro and
      in vivo.
    explanation: >-
      This separately classifies the subcutaneous mouse-xenograft component of
      the mixed result. It supports an in-vivo model phenotype but neither
      human-tumor causality nor an RNase-P/pre-tRNA mechanism.
  - reference: PMID:42424930
    reference_title: RPP40, a subunit of Ribonuclease P, facilitates hepatocellular carcinoma proliferation by activating the mTOR/MYC signaling.
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      The mTOR/MYC signaling pathway was pinpointed as the key pathway regulated
      by RPP40 in HCC.
    explanation: >-
      The integrated pathway analysis nominates mTOR/MYC downstream of RPP40,
      but the abstract does not establish the intervening RNA-processing branch.
  notes: >-
    This hypothesis is intentionally not wired as a causal pathograph edge.
    Evidence supports the flanking RPP40 and mTOR/MYC observations, not the
    proposed RNase-P/pre-tRNA bridge.
pathophysiology:
- name: Chronic Liver Injury and Cirrhosis
  conforms_to: "tumor_promoting_inflammation#Chronic Inflammatory Stimulus"
  description: >-
    Most HCC arises in the context of chronic liver disease and cirrhosis. Persistent
    hepatocyte death and regeneration in an inflammatory environment promotes accumulation
    of genetic alterations. Cirrhosis itself is a premalignant condition with ongoing
    oxidative stress and genomic instability.
  evidence:
  - reference: PMID:41567639
    reference_title: "Identification of novel germline and somatic mutations associated with hepatocellular carcinoma by next-generation sequencing."
    supports: PARTIAL
    snippet: HCC typically arises in patients with chronic liver disease, including hepatitis, cirrhosis, and non-alcoholic fatty liver diseases.
    explanation: This abstract states that HCC commonly arises in chronic liver disease and cirrhosis, supporting the mechanism described.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Telomere Dysfunction and Genomic Instability
    description: Repeated hepatocyte division leads to telomere shortening
  - target: Accumulation of Driver Mutations
    description: Chronic regeneration promotes mutation accumulation
- name: Telomere Dysfunction and Genomic Instability
  conforms_to: "enabling_replicative_immortality#Replicative Senescence and Crisis Barrier"
  description: >-
    Chronic hepatocyte proliferation leads to telomere shortening, causing genomic
    instability.
    TERT promoter mutations, which are the most common HCC mutations, reactivate telomerase
    to enable unlimited replication. This creates a checkpoint bypass allowing survival
    of genetically unstable cells.
  biological_processes:
  - preferred_term: telomere maintenance
    modifier: ABNORMAL
    term:
      id: GO:0000723
      label: telomere maintenance
  downstream:
  - target: WNT/Beta-Catenin Pathway Activation
    description: Genomic instability promotes acquisition of pathway-activating mutations
- name: Accumulation of Driver Mutations
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    Multiple driver genes are recurrently mutated in HCC, including TERT promoter
    (60%),
    TP53 (30%), CTNNB1 (30%), AXIN1 (10%), and ARID1A (10%). These mutations affect
    telomere maintenance, cell cycle control, WNT signaling, and chromatin remodeling.
  biological_processes:
  - preferred_term: DNA repair
    modifier: DECREASED
    term:
      id: GO:0006281
      label: DNA repair
  downstream:
  - target: PI3K/AKT/mTOR Pathway Activation
    description: Somatic and expression-level pathway changes select for oncogenic growth signaling.
- name: WNT/Beta-Catenin Pathway Activation
  description: >-
    Activating mutations in CTNNB1 (beta-catenin) or inactivating mutations in AXIN1
    lead to constitutive WNT pathway activation. This drives cell proliferation and
    is
    associated with a distinct molecular subclass of HCC with specific clinical features
    including cholestasis and immune exclusion.
  biological_processes:
  - preferred_term: Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  downstream:
  - target: Enhanced Hepatocyte Proliferation
    description: WNT signaling drives cell proliferation and stemness
- name: MLKL-Mediated Mitochondrial Dysfunction and Metabolic Reprogramming
  description: >-
    In MASLD-associated HCC, elevated hepatocyte MLKL suppresses the mitochondrial fusion
    protein MFN2 independent of necroptosis activation. MFN2 suppression impairs mitochondrial
    dynamics and oxidative phosphorylation capacity, driving a compensatory shift toward
    aerobic glycolysis (Warburg effect). This metabolic reprogramming enhances tumor stemness
    and proliferation, with MLKL inhibition shown to reduce proliferation, restore mitochondrial
    respiration, and suppress HCC xenograft growth.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  molecular_functions:
  - preferred_term: protein tyrosine kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
  biological_processes:
  - preferred_term: mitochondrial organization
    modifier: DECREASED
    term:
      id: GO:0007005
      label: mitochondrion organization
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: glycolytic process
    modifier: INCREASED
    term:
      id: GO:0006096
      label: glycolytic process
  evidence:
  - reference: PMID:42549799
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      WD suppressed the mitochondrial fusion protein and tumor suppressor MFN2, whereas
      MLKL deficiency restored MFN2 expression post-translationally. In HCC cells, MLKL
      deletion reduced proliferation, improved mitochondrial respiration, and decreased glycolysis;
      these effects were reversed by MFN2 deletion.
    explanation: >-
      Demonstrates that MLKL suppresses MFN2, impairs mitochondrial respiration, and increases
      glycolysis, with these phenotypes dependent on MFN2 downregulation in both transgenic
      mouse HCC model and HCC cell lines.
  - reference: PMID:42549799
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated MLKL expression in human HCC correlated with poorer overall survival.
    explanation: >-
      Human HCC tissue data directly links elevated MLKL to adverse clinical outcomes,
      supporting MLKL as a functionally significant driver in human disease.
  - reference: PMID:42549799
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The human MLKL inhibitor necrosulfonamide (NSA) suppressed HepG2 xenograft growth.
    explanation: >-
      Demonstrates therapeutic potential of MLKL inhibition in HCC cells, providing a
      mechanistic link between MLKL activity and tumor growth.
  downstream:
  - target: Enhanced Hepatocyte Proliferation
    description: MLKL-driven metabolic reprogramming and impaired mitochondrial function promote tumor stemness and proliferation
- name: PI3K/AKT/mTOR Pathway Activation
  description: >-
    PI3K/AKT/mTOR signaling is a recurrent oncogenic axis in HCC. PI3K/Akt
    activation is reported in 40-60% of HCC tissue, and dysregulated
    pathway-associated genes and upstream receptor inputs increase AKT/TOR
    signaling, supporting hepatocyte survival, anabolic growth, proliferation, and
    immune infiltration patterns relevant to targeted therapy and immunotherapy
    response.
  biological_processes:
  - preferred_term: TOR signaling
    modifier: INCREASED
    term:
      id: GO:0031929
      label: TOR signaling
  - preferred_term: phosphatidylinositol-mediated signaling
    modifier: INCREASED
    term:
      id: GO:0048015
      label: phosphatidylinositol-mediated signaling
  evidence:
  - reference: PMID:29984212
    reference_title: Role of Wnt/β-catenin signaling in hepatocellular carcinoma, pathogenesis, and clinical significance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The signaling pathways known to be activated in HCC tissue include the Wnt/β-catenin pathway (up to 50% of HCC), the phosphatidylinositol-3-kinase and protein kinase B (PI3K/Akt) pathway (40–60% of HCC), the Myc pathway (30–60%), the Hedgehog pathway (50–60%), and the MET pathway (30–40%).
    explanation: This review summarizes human HCC tissue data and supports recurrent PI3K/Akt activation in a large fraction of HCC.
  - reference: PMID:35592706
    reference_title: "PI3K/AKT/mTOR Pathway-Associated Genes Reveal a Putative Prognostic Signature Correlated with Immune Infiltration in Hepatocellular Carcinoma."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: The dysregulated PI3K/AKT/mTOR pathway acts as the main regulator of tumorigenesis in hepatocellular carcinoma (HCC).
    explanation: >-
      This bioinformatic HCC cohort analysis directly supports PI3K/AKT/mTOR
      dysregulation as an oncogenic signaling axis and links pathway-associated
      gene signatures to immune infiltration.
  downstream:
  - target: Enhanced Hepatocyte Proliferation
    description: PI3K/AKT/mTOR activation promotes tumor-cell growth and survival signaling.
  - target: Immune Evasion and Immunosuppressive Microenvironment
    description: Pathway-associated signatures correlate with immune infiltration and checkpoint expression.
  - target: Aerobic Glycolysis and Metabolic Reprogramming
    description: >-
      Oncogenic PI3K/AKT/mTOR signaling drives the anabolic, glycolytic
      reprogramming modeled by the deregulated-cellular-energetics module.
- name: TP53 Pathway Inactivation
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    TP53 mutations are common in HCC, particularly in HBV-associated and aflatoxin-associated
    tumors. Loss of p53 function removes a critical checkpoint, allowing survival
    of cells
    with DNA damage and promoting genomic instability.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
- name: Enhanced Hepatocyte Proliferation
  conforms_to: "sustaining_proliferative_signaling#Growth-Factor-Independent Proliferation"
  description: >-
    Combined effects of telomerase reactivation, cell cycle checkpoint loss, and
    mitogenic signaling drive uncontrolled hepatocyte proliferation and tumor growth.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
- name: Angiogenesis and VEGF Signaling
  conforms_to: "tumor_angiogenesis#Angiogenic Switch and VEGF-Driven Neovascularization"
  description: >-
    HCC is a highly vascular tumor dependent on angiogenesis. VEGF signaling promotes
    new blood vessel formation supplying the tumor. VEGF also has immunosuppressive
    effects, contributing to the immune-excluded microenvironment. This provides the
    rationale for anti-VEGF therapy in combination with immunotherapy.
  evidence:
  - reference: PMID:19637355
    reference_title: "Vascular endothelial growth factor in the management of hepatocellular carcinoma: a review of literature."
    supports: SUPPORT
    snippet: "Hepatocellular carcinoma (HCC) is a highly vascular tumor, and angiogenesis is believed to play a considerable role in its development and progression."
    explanation: "Abstract notes HCC is highly vascular and angiogenesis plays a major role, supporting this mechanism."
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  downstream:
  - target: Immune Evasion and Immunosuppressive Microenvironment
    description: VEGF-mediated immunosuppression contributes to T cell exclusion and checkpoint upregulation
- name: Immune Evasion and Immunosuppressive Microenvironment
  conforms_to: "immune_checkpoint_blockade#Adaptive Immune Resistance"
  description: >-
    HCC develops in a chronically inflamed liver with an inherently
    immunosuppressive microenvironment. Tumor cells upregulate PD-L1,
    VEGF-mediated immunosuppression excludes effector T cells, and
    recruitment of regulatory T cells, myeloid-derived suppressor cells,
    and tumor-associated macrophages creates an immune-tolerant niche.
    The combination of anti-PD-L1 with anti-VEGF addresses both the
    checkpoint-mediated and VEGF-mediated immunosuppression.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: Negative Regulation of T Cell Mediated Immunity
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
    modifier: INCREASED
  evidence:
  - reference: PMID:32158599
    reference_title: "Current Status and Future Direction of Immunotherapy in Hepatocellular Carcinoma: What Do the Data Suggest?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The HCC tumor microenvironment is characterized by a dysfunction of
      the immune system through multiple mechanisms, including accumulation
      of various immunosuppressive factors, recruitment of regulatory T cells
      and myeloid-derived suppressor cells, and induction of T cell exhaustion
      accompanied with the interaction between immune checkpoint ligands and
      receptors.
    explanation: >-
      Review specifically describes HCC's immunosuppressive microenvironment
      including Treg and MDSC recruitment, T cell exhaustion, and checkpoint
      ligand-receptor interactions — directly supporting all claims in this
      node about HCC immune evasion mechanisms.
- name: Aerobic Glycolysis and Metabolic Reprogramming
  conforms_to: "deregulated_cellular_energetics#Aerobic Glycolysis (Warburg Effect)"
  biological_scale: CELLULAR
  description: >-
    HCC cells reprogram metabolism from oxidative phosphorylation to aerobic glycolysis
    (Warburg effect), enabling rapid ATP regeneration and providing carbon intermediates
    for biosynthesis. This metabolic shift is driven by oncogenic signaling (PI3K/AKT,
    MYC) and supports the high proliferative rate of hepatocellular carcinomas. The
    mechanism linking mitochondrial acetyl-CoA homeostasis to pyruvate transport and
    glycolytic switching remains incompletely characterized.
  biological_processes:
  - preferred_term: Glycolytic Process
    modifier: INCREASED
    term:
      id: GO:0006096
      label: glycolytic process
  evidence:
  - reference: PMID:19460998
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      most cancer cells produce large amounts of lactate regardless of the
      availability of oxygen
    explanation: >-
      Directly states the Warburg phenotype this node models — lactate production
      despite adequate oxygen. This is the same on-claim evidence the module's
      central-effector node carries. Evidence source is OTHER because this is a
      review article.
  - reference: PMID:42520527
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, ACAA2 downregulation reduces mitochondrial acetyl-CoA levels, thereby decreasing mitochondrial pyruvate carrier 1 (MPC1) acetylation and accelerating its proteasomal degradation, which ultimately impairs mitochondrial pyruvate transport to promote glycolysis and cell proliferation.
    explanation: >-
      HCC-specific specialization of the generic module claim: work in HCC-derived
      lines shows loss of mitochondrial pyruvate transport driving the glycolytic
      shift, and links that shift directly to proliferation.
  downstream:
  - target: Enhanced Hepatocyte Proliferation
    description: >-
      The glycolytic shift supplies the ATP and biosynthetic carbon that sustain
      the high proliferative rate; PMID:42520527 reports impaired mitochondrial
      pyruvate transport promoting glycolysis and cell proliferation together.

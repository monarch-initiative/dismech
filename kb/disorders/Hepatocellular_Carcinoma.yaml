    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: WES
  publication: PMID:22561517
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Hepatocellular Carcinoma"); description-level mentions were not accepted. EGA study_type: Exome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001000325
  title: Whole genome sequencing of hepatocellular carcinoma tumors and their matched noncancerous liver tissues and the background germline
  description: We performed whole-genome sequencing on multifocal hepatocellular carcinoma tumors and their matched noncancerous liver tissues and the background germline. We found that the noncancerous liver tissues presented varying degrees of genomic alterations that were associated with the background liver diseases. Most of the genomic alterations in the metastatic tumors were inherited from the primary tumor and a small number developed de novo. Few genomic alterations were shared between the multicentric tumors with the exception of the alterations that also existed in the noncancerous liver tissue.

datasets:
- accession: ega:EGAS00001000217
  title: Exome-sequencing identifies new oncogenes and tumor suppressor genes recurrently altered in hepatocellular carcinoma
  description: Hepatocellular carcinoma (HCC) is the most common primary liver malignancy. High-resolution copy number analysis of 125 tumors of which 24 were subjected to whole-exome sequencing identified 135 homozygous deletions and 994 somatic gene mutations with predicted functional consequences. We identified new recurrent alterations in 4 genes (ARID1A, RPS6KA3, NFE2L2 and IRF2) not previously described in HCC. Functional analyses demonstrated tumor suppressor properties for IRF2 whose inactivation, exclusively found in hepatitis B virus related tumors, leads to impaired TP53 function.
  organism:

- discussion_id: gap_acaa2_mpc1_acetylation_pyruvate_transport
  prompt: >-
    Does ACAA2-dependent mitochondrial acetyl-CoA homeostasis regulate metabolic
    switching from oxidative phosphorylation to aerobic glycolysis in HCC specifically
    through MPC1 protein acetylation and proteasomal stability, or do alternative
    mechanisms of acetyl-CoA-dependent regulation (histone acetylation, other protein
    targets, non-acetylation sensing) dominate?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Aerobic Glycolysis and Metabolic Reprogramming
  rationale: >-
    PMID:42520527 demonstrates that ACAA2 downregulation reduces mitochondrial acetyl-CoA,
    leading to MPC1 acetylation loss, MPC1 proteasomal degradation, and impaired pyruvate
    transport with consequent glycolytic shift. However, the paper does not directly
    measure acetyl-CoA-dependent protein acetylation stoichiometry, does not use
    acetylation-site-specific MPC1 mutations to establish acetylation as mechanistically
    sufficient, and does not test proteasomal inhibitors or direct acetyl-CoA supplementation.
    Alternative explanations remain open: direct allosteric effects of acetyl-CoA on MPC1,
    ACAA2-FAO support for histone acetylation and epigenetic reprogramming upstream of
    MPC1, acetylation of autophagy or mitochondrial chaperone machinery affecting MPC1
    indirectly, and competing acetyl-CoA sources (glutaminolysis, pyruvate carboxylase)
    that may bypass this pathway.
  proposed_experiments:
  - experiment_id: exp_acaa2_acetyl_coa_mpc1_acetylation_causality
    name: Acetyl-CoA and MPC1 acetylation-site mechanism
    description: >-
      Test acetylation-site sufficiency by combining acute ACAA2 depletion, direct
      acetyl-CoA pathway manipulation (ACS2 inhibition, pyruvate carboxylase inhibition),
      and MPC1 acetylation-site mutation (K99R or identified sites) in HCC-derived lines
      (Huh-7, Hep3B). Measure MPC1 acetylation stoichiometry via mass-spec or
      acetyl-lysine blots, MPC1 protein stability (pulse-chase or proteasomal inhibition),
      pyruvate oxidation (13C-pyruvate tracing), and glycolytic flux (ATP, ECAR, lactate)
      to validate the proposed chain. Use catalytically defective ACAA2 variants to
      distinguish FAO-dependent acetyl-CoA from other ACAA2 functions.
    experiment_type:
      preferred_term: protein acetylation and metabolic switching mechanism study
    model_systems:
    - name: HCC-derived cell lines with metabolic tracing
      description: >-
        Huh-7 and Hep3B lines with 13C-pyruvate tracing to distinguish pyruvate
        oxidation, glycolytic lactate, alanine synthesis, and anaplerosis under
        perturbation.
  evidence:
  - reference: PMID:42520527
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      While acetyl-CoA acts as a pivotal metabolic molecule involved in protein acetylation, whether ACAA2 regulates metabolic reprogramming through acetyl-CoA-mediated mitochondrial protein acetylation remains unclear.
    explanation: >-
      Authors explicitly identify the unresolved role of acetyl-CoA-mediated protein
      acetylation in ACAA2-dependent metabolic switching, the core of this gap.
  - reference: PMID:42520527
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Mounting evidence indicates that metabolic reprogramming contributes substantially to tumor development by promoting cancer cell proliferation and metastasis. However, the underlying mechanisms remain incompletely understood.
    explanation: >-
      Establishes the broader mechanistic gap in HCC metabolic reprogramming that
      this ACAA2-acetyl-CoA-MPC1-pyruvate axis helps address.

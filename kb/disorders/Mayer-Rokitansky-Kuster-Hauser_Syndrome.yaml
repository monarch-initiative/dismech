name: Mayer-Rokitansky-Kuster-Hauser_Syndrome
creation_date: '2026-09-07T18:00:00Z'
category: Congenital
synonyms:
- MRKH
- MRKH syndrome
- Mayer-Rokitansky-Küster-Hauser syndrome
- Rokitansky syndrome
- Müllerian aplasia
- Müllerian agenesis
- congenital absence of the uterus and vagina
- vaginal agenesis
- MURCS association
description: >-
  Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome is congenital aplasia of the
  uterus, cervix and upper two-thirds of the vagina in a person with a 46,XX
  karyotype, normal external genitalia and normal ovarian endocrine function.
  The lesion is developmental and prenatal: the paramesonephric (Müllerian)
  ducts either never form or fail to elongate and fuse between about the fifth
  and eighth week of gestation, so the structures they would have produced are
  absent at birth and there is no postnatal disease process at all. What the
  patient experiences is the consequence of an event that finished before
  birth.

  Mechanistically the entry is built around a single distinction that explains
  most of the clinical picture: the Müllerian ducts and the ovaries have
  different embryonic origins. The ducts arise from the intermediate mesoderm
  of the urogenital ridge; the ovary arises from the gonadal ridge and is
  spared. Ovarian steroidogenesis is therefore normal, puberty proceeds
  normally, and the only presenting sign is primary amenorrhea — which is why
  the diagnosis is characteristically made in adolescence rather than at birth.
  The same sparing has a second, less obvious consequence: endometrium retained
  inside a rudimentary uterine bud is exposed to normal cyclic ovarian steroids,
  so it cycles, and in a closed remnant that produces catamenial pain,
  haematometra and a strikingly elevated risk of endometriosis.

  The shared intermediate-mesoderm origin also explains the extragenital
  anomalies that define type II (MURCS). The nephric duct and the Müllerian
  duct develop side by side under an overlapping transcriptional program, so
  the genes implicated in MRKH syndrome — GREB1L, PAX8, HNF1B, LHX1 — are the
  genes of kidney development, and roughly a third of patients have a renal
  malformation. TBX6, at the recurrently deleted 16p11.2 locus, sits instead in
  paraxial mesoderm and somite patterning, which is the axial-skeletal arm of
  the same story.

  The entry is deliberately honest about how little of the etiology is settled.
  Recurrent copy-number variants account for about 10% of patients; GREB1L and
  PAX8 have segregating-pedigree and cohort-enrichment evidence and are curated
  as causative; most other candidates are not. Sporadic occurrence dominates
  and monozygotic twins are repeatedly discordant, so a purely germline
  monogenic account cannot be complete, and the alternative (somatic, mosaic,
  epigenetic or environmental) is curated as an ALTERNATIVE hypothesis rather
  than dismissed. The historical anti-Müllerian hormone overexpression
  hypothesis is retained as DEPRECATED with the negative evidence attached,
  because it is the one etiological question the field has actually closed.

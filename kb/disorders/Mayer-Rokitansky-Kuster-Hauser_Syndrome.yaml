    modifier: DECREASED
  evidence:
  - reference: PMID:36282544
    reference_title: "Functional genomics analysis identifies loss of HNF1B function as a cause of Mayer-Rokitansky-Küster-Hauser syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We ablated Hnf1b specifically in the epithelium of the Müllerian ducts in
      mice and found that this caused hypoplastic development of the uterus, as
      well as kidney anomalies, closely mirroring the MRKH type II phenotype.
    explanation: >-
      Places the lesion in Müllerian duct epithelium specifically, and shows it
      reproduces the human type II combination.
  - reference: PMID:36282544
    reference_title: "Functional genomics analysis identifies loss of HNF1B function as a cause of Mayer-Rokitansky-Küster-Hauser syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using single-cell RNA sequencing of uterine tissue in the Hnf1b-ablated
      embryos, we analyzed the molecules and pathways downstream of Hnf1b,
      revealing a dysregulation of processes associated with cell proliferation,
      migration and differentiation.
    explanation: >-
      Direct basis for the three cellular processes annotated on this node.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lhx1-null female mice have normal ovaries but lack their reproductive
      tract, which results from a disruption of MD elongation and epithelium
      formation
    explanation: >-
      Second gene reaching the same cellular failure, and the model that
      reproduces the ovary-spared dissociation seen in patients.
  downstream:

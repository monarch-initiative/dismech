- name: Failure of Müllerian Duct Epithelial Proliferation and Elongation
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    The cellular step. The Müllerian duct is an epithelial tube that must
    proliferate, migrate caudally along the Wolffian duct and differentiate on a
    fixed schedule. Conditional ablation of Hnf1b in Müllerian duct epithelium
    in mice produces a hypoplastic uterus with renal anomalies — an MRKH type II
    phenocopy — and single-cell RNA sequencing of the ablated embryonic uterus
    shows dysregulation of proliferation, migration and differentiation
    programmes rather than one discrete pathway. Lhx1-null females likewise lack
    a reproductive tract through a failure of duct elongation and epithelium
    formation, with normal ovaries, which is exactly the human dissociation.
  locations:
  - preferred_term: Müllerian duct epithelium
    term:
      id: UBERON:0003890
      label: Mullerian duct

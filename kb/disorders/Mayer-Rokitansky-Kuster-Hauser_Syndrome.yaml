    reference_title: "Prevalence and patient characteristics of Mayer-Rokitansky-Küster-Hauser syndrome: a nationwide registry-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typical MRKH syndrome and atypical MRKH syndrome/Müllerian duct aplasia,
      Renal aplasia, and Cervicothoracic Somite dysplasia association were

- name: Absolute Uterine Factor Infertility
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The terminal consequence, and the one that defines the therapeutic problem.
    Absolute uterine factor infertility is infertility from anatomical absence
    of a uterus or presence of a non-functional one; MRKH syndrome is its
    congenital form, alongside acquired causes such as hysterectomy for
    malignancy or obstetric haemorrhage. Ovarian function being intact, the
    gametes are available and the deficit is purely gestational — which is
    precisely why uterus transplantation works here and why it was first
    performed in this disease.
  evidence:
  - reference: PMID:25301505
    reference_title: "Livebirth after uterus transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Uterus transplantation is the first available treatment for absolute
      uterine infertility, which is caused by absence of the uterus or the
      presence of a non-functional uterus.
    explanation: >-
      Defines the condition this node names and situates MRKH syndrome within it.
  downstream:
  - target: Female infertility
    causal_link_type: DIRECT
    description: >-
      The clinical phenotype corresponding to this node.

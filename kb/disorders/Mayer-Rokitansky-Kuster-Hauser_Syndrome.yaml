    explanation: >-
      Nationwide registry-validated cohort quantifying the type 1 / type 2 split
      and naming MURCS as part of the type 2 group.
inheritance:
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic occurrence
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Most cases occur with no family history of MRKH syndrome or of the
    associated renal and uterovaginal anomalies, and monozygotic twin pairs
    discordant for the syndrome have been reported repeatedly. Sporadic
    occurrence is therefore the rule rather than the exception. It is important
    not to read this as evidence against a genetic cause: absolute uterine
    factor infertility blocks mother-to-daughter transmission, so a dominant
    allele cannot accumulate in pedigrees the way it would in a fertile
    disorder, and the familial signal is structurally suppressed.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      several reports of discordant monozygotic twin pairs
    explanation: >-
      Monozygotic discordance is the observation that most directly supports
      non-inherited causation in at least some patients.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the disease nature of MRKH syndrome implies absolute infertility,
      hindering mother-to-offspring inheritance of a genetic cause, which may
      cause an underestimation of the genetic component of MRKH syndrome from
      family histories
    explanation: >-
      Supports the caveat that apparent sporadicity is partly an artefact of the
      disease blocking its own vertical transmission.
- name: Autosomal dominant with incomplete penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    In the minority of families with recurrence, the pattern is autosomal
    dominant with incomplete penetrance and sex-limited expressivity: male
    carriers may show isolated renal agenesis, or nothing, while female carriers
    may show uterovaginal aplasia, an isolated renal anomaly, or no phenotype at
    all. This is the pattern the older literature called hereditary urogenital
    adysplasia, and GREB1L is the gene that has since been shown to segregate in
    it. Sex-limited expressivity has also been demonstrated directly for PAX8,
    where paternal transmission was confirmed in three cases.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing analysis in this family identified a segregating
      missense variant in GREB1L, supporting GREB1L variants as a novel
      monogenic cause of MRKH syndrome associated with incomplete penetrance and
      sex-limited expressivity
    explanation: >-
      Three-generation pedigree evidence for the dominant, incompletely
      penetrant, sex-limited pattern this block records.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In three cases with available parental DNA, paternal inheritance was
      confirmed, showing a sex-limited expressivity of infertility.
    explanation: >-
      Independent demonstration of sex-limited expressivity, at a second locus.
mechanistic_hypotheses:
- hypothesis_group_id: md_developmental_arrest
  hypothesis_label: Failure of paramesonephric duct formation, elongation or fusion between weeks 5 and 8
  status: CANONICAL
  description: >-
    The accepted account, and the only one that is not in dispute. The
    paramesonephric ducts form at about the fifth week as bilateral
    invaginations of the coelomic epithelium of the urogenital ridge, elongate
    caudally along the Wolffian ducts to reach the urogenital sinus, and from
    week 8 fuse caudally to build the uterus, cervix and upper vagina. MRKH
    syndrome is the failure of that sequence — either the ducts never form, or
    they form and do not complete elongation and fusion. Everything downstream
    is anatomical absence rather than tissue damage, which is why the syndrome
    has no progressive course and no active lesion to treat.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 5 weeks post gestation, bilateral invaginations of the coelomic
      epithelium of the urogenital ridges begin to form the MDs which extend
      caudally, guided by the Wolffian ducts, to reach the urogenital sinus in
      the midline
    explanation: >-
      Establishes the normal developmental sequence and its timing, which is the
      process this hypothesis says fails.
  - reference: PMID:29266078
    reference_title: "ACOG Committee Opinion No. 728: Müllerian Agenesis: Diagnosis, Management, And Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Müllerian agenesis is caused by embryologic underdevelopment of the
      müllerian duct, with resultant agenesis or atresia of the vagina, uterus,
      or both.
    explanation: >-
      Professional-society statement of the same causal claim.
- hypothesis_group_id: mesodermal_transcriptional_program
  hypothesis_label: Heterogeneous monogenic loss of a shared intermediate/paraxial mesoderm transcriptional program
  status: EMERGING
  description: >-
    The genetic account with the strongest current support. Rather than one MRKH
    gene, a set of transcriptional regulators of intermediate and paraxial
    mesoderm — GREB1L, PAX8, HNF1B, LHX1, TBX6 — each account for a small share
    of patients, with the same haploinsufficiency-like dosage logic and the same
    dominant, incompletely penetrant, sex-limited pattern. The hypothesis
    predicts the observed comorbidity structure directly: these are kidney
    development genes, so type II with renal malformation is what a lesion in
    them looks like, and TBX6 in paraxial mesoderm is the axial-skeletal arm.
    It is curated EMERGING rather than CANONICAL because recurrent copy-number
    variants explain only about 10% of patients and the sequence-variant genes
    together explain a further minority, so the program is demonstrated but
    nowhere near complete.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, genes involved in the development of mesoderm and its derived
      structures are relevant candidates in the etiology of MRKH syndrome.
    explanation: >-
      States the lineage-based reasoning on which this hypothesis rests.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      epidemiological evidence of rare variant enrichment in larger cohorts, and
      functional evidence from knock-out mice, suggest GREB1L as a major
      causative gene in MRKH syndrome.
    explanation: >-
      The single best-supported gene in the program, with pedigree, cohort and
      mouse evidence converging.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, recurrent chromosomal imbalances in MRKH syndrome still only
      apply to a minor fraction of patients (around 10%).
    explanation: >-
      Bounds how much of the disease this program currently explains, which is
      why the hypothesis is EMERGING rather than CANONICAL. Cited as indirect
      because it quantifies the CNV share specifically, not the whole program.
- hypothesis_group_id: nonmendelian_somatic_or_environmental
  hypothesis_label: Somatic, mosaic, epigenetic or environmental disruption of duct development
  status: ALTERNATIVE
  description: >-
    A germline-monogenic account cannot cover the disease as observed:
    occurrence is overwhelmingly sporadic, monozygotic twins are repeatedly
    discordant, and recurrence after surrogate pregnancy has generally not been
    seen. Those observations are what a post-zygotic somatic or mosaic variant,
    a tissue-restricted epigenetic change, or an environmental insult during the
    fifth-to-eighth week would predict. Investigators have accordingly looked
    for somatic variation and differential methylation in surgically removed
    uterine remnants. The hypothesis is curated ALTERNATIVE rather than
    EMERGING because it is so far supported by the pattern of inheritance
    failing to fit, not by a positive finding: reported epigenetic results have
    been inconsistent, and no environmental exposure has firm evidence.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most cases of MRKH syndrome appear isolated with no clear indications of a
      familial/genetic trait (5, 30). In addition, several reports of discordant
      monozygotic twin pairs (5, 31–35) and patient-reported outcomes of most
      surrogate pregnancies also support non-Mendelian causes
    explanation: >-
      The inheritance-pattern argument for this hypothesis. Indirect because it
      argues from the absence of a Mendelian signal rather than from a
      demonstrated somatic or environmental lesion.
  - reference: PMID:41616459
    reference_title: "The genetic background of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: A systematic review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Findings on epigenetic regulation show variability, with no consistent
      patterns of specific gene upregulation or downregulation.
    explanation: >-
      A 97-study systematic review finds no reproducible epigenetic signature,
      which counts against the epigenetic arm of this hypothesis specifically
      and is the reason it is not curated as EMERGING.
- hypothesis_group_id: amh_overexpression
  hypothesis_label: Ectopic anti-Müllerian hormone or AMHR2 activity drives Müllerian regression in a 46,XX fetus
  status: DEPRECATED
  description: >-
    The first serious etiological hypothesis, and the one question in MRKH
    syndrome that the field has actually closed. Because anti-Müllerian hormone
    physiologically regresses the Müllerian ducts in male embryos, ectopic AMH
    activity or an activating receptor change was an obvious candidate for
    Müllerian absence in a 46,XX fetus. Candidate-gene studies of AMH and AMHR2
    did not support it, and it is retained here as DEPRECATED — with the
    negative evidence attached — rather than deleted, because it is what
    distinguishes MRKH syndrome mechanistically from the 46,XY differential
    diagnoses in which absent Müllerian structures really are AMH-driven.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of these studies had negative results and provided limited evidence
      for genetic factors in MRKH syndrome. This included investigations of AMH
      and AMHR2, encoding anti-Müllerian hormone and its receptor, respectively,
      involved in physiological MD regression in males
    explanation: >-
      Names AMH and AMHR2 among the candidate genes whose investigation returned
      negative results, which is the basis for deprecating this hypothesis.
pathophysiology:
- name: Loss of Mesodermal Developmental Transcription Factor Dosage
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    In the genetically explained minority of patients, the initiating lesion is
    reduced dosage or activity of a transcriptional regulator of intermediate
    and paraxial mesoderm. The recurrently deleted 17q12 interval removes both
    LHX1 and HNF1B; 16p11.2 removes TBX6; sequence variants have been reported
    in GREB1L, PAX8, HNF1B, LHX1 and TBX6. These are not a pathway in the
    signalling sense but a set of regulators acting on the same embryonic
    lineage, which is why loss of any one of them can reach the same anatomical
    endpoint. GREB1L is thought to act in retinoic acid signalling, though its
    protein is poorly characterised, and for the monoallelic missense variants
    that dominate the human reports the molecular consequence is still unknown.

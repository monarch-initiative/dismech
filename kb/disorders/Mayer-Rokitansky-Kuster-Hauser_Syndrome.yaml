has_subtypes:
- name: Type 1
  display_name: Type 1 (isolated uterovaginal aplasia)
  subtype_term:
    preferred_term: MRKH syndrome type 1
    term:
      id: MONDO:0010173
      label: Mayer-Rokitansky-Kuster-Hauser syndrome type 1
  description: >-
    Uterovaginal aplasia with no extragenital malformation. This is the form the
    four original describing authors reported, and the more common of the two.
    Rudimentary uterine buds on the pelvic sidewalls, joined by a midline
    fibrous band, are the typical anatomy.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRKH syndrome may present as an isolated anomaly (type I) or in
      association with extragenital malformations (type II), typically involving
      the kidneys, skeleton, and heart
    explanation: >-
      States the two-way clinical classification that these subtypes encode.
- name: Type 2
  display_name: Type 2 (with extragenital malformations; MURCS association)
  subtype_term:
    preferred_term: MRKH syndrome type 2
    term:
      id: MONDO:0010989
      label: Mayer-Rokitansky-Küster-Hauser syndrome type 2
  description: >-
    Uterovaginal aplasia together with at least one extragenital malformation —
    most often renal, next most often axial skeletal, and less commonly cardiac
    or auditory. The MURCS acronym (Müllerian duct aplasia, renal aplasia,
    cervicothoracic somite dysplasia) names the severe end of this subtype and
    is subsumed within it rather than being curated separately. Complete absence
    of one Müllerian duct with ipsilateral renal agenesis is the characteristic
    anatomy, which is the anatomical signature of a shared lineage failure
    rather than of two independent malformations.
  genes:
  - preferred_term: GREB1L
    term:
      id: hgnc:31042
      label: GREB1L
  - preferred_term: HNF1B
    term:
      id: hgnc:11630
      label: HNF1B

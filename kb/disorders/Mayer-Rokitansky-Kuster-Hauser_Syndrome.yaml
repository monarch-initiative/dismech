- name: Müllerian Duct Aplasia
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The defining lesion: the paramesonephric ducts are absent or aplastic, so
    the uterus, cervix and upper two-thirds of the vagina are never built. The
    lower vagina, which derives from the urogenital sinus rather than from the
    ducts, is present — which is why the anatomy is a short blind-ending pouch
    rather than complete vaginal absence. The Fallopian tubes, also
    duct-derived, are correspondingly rudimentary or absent, and their absence
    is thought to explain the characteristically lateral, more cranial position
    of the ovaries.
  locations:
  - preferred_term: Müllerian duct

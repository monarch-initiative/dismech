diagnosis:
- name: Pelvic magnetic resonance imaging
  diagnosis_term:
    preferred_term: pelvic MRI of the internal genitalia
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    The reference standard. MRI confirms uterovaginal agenesis, distinguishes
    rudimentary uterine buds from complete absence, and — the clinically
    decisive part — shows whether a bud contains endometrium, which is what
    determines the risk of catamenial pain, haematometra and endometriosis and
    therefore whether the remnant should be removed. It also images the kidneys
    and can show extragenital anomalies in the same study.
  evidence:
  - reference: PMID:40246293
    reference_title: "Prevalence of endometriosis in Mayer-Rokitansky-Küster-Hauser syndrome variants: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recent advent of high-resolution ultrasonography and magnetic
      resonance imaging (MRI) allowed the reliable preoperative identification
      of FE concealed within UR
    explanation: >-
      Establishes that imaging now answers the functional-endometrium question
      preoperatively, which is the diagnostic value this record claims.
- name: Pelvic ultrasonography
  diagnosis_term:
    preferred_term: transabdominal or transperineal pelvic ultrasonography
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  description: >-
    First-line imaging, showing an absent uterus with two present ovaries. It
    also excludes the mimics that matter most: an imperforate hymen or
    transverse vaginal septum will show a proximal vaginal canal and often
    haematocolpos, which uterovaginal agenesis will not — a distinction with
    real consequences, since operating on the wrong one is harmful.
  evidence:
  - reference: PMID:22906151
    reference_title: "Malformations in a cohort of 284 women with Mayer-Rokitansky-Küster-Hauser syndrome (MRKH)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      290 women with MRKH syndrome were clinically evaluated with using clinical
      examinations, abdominal and perineal/rectal ultrasound, MRI, and
      laparoscopy.
    explanation: >-
      Documents the diagnostic sequence in which ultrasound is used for this
      syndrome.
- name: Renal imaging
  diagnosis_term:
    preferred_term: renal ultrasonography or MRI
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  description: >-
    Screening for renal malformation in every patient, not only the symptomatic
    ones. A third of patients have a renal anomaly and most are asymptomatic; in
    the Danish cohort a third of patients had no urinary tract imaging at all,
    so under-ascertainment is the documented failure mode here.
  evidence:
  - reference: PMID:22906151
    reference_title: "Malformations in a cohort of 284 women with Mayer-Rokitansky-Küster-Hauser syndrome (MRKH)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is therefore recommended that all patients with genital malformations
      should be evaluated for renal abnormalities.
    explanation: >-
      The recommendation this record implements, from the cohort that motivates
      it.
- name: Karyotype
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  description: >-
    Confirms 46,XX, and its real purpose is to separate this syndrome from the
    46,XY differential diagnoses that share a blind vagina and absent uterus —
    complete androgen insensitivity syndrome and 17-hydroxylase/17,20-lyase
    deficiency. It is diagnostically confirmatory rather than
    aetiologically informative.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients are characterized by having a normal female karyotype
      (46,XX), normal external genitalia, and normal pubertal development of
      secondary sex characteristics (thelarche and pubarche)
    explanation: >-
      The karyotype finding this test establishes, which is part of the case
      definition.
- name: Chromosomal microarray
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  description: >-
    Optional rather than obligate. It detects the recurrent 17q12, 16p11.2,
    22q11 and 1q21.1 imbalances, but those together account for only about 10%
    of patients and interpreting them is not straightforward — so a negative
    result excludes very little and a positive one often needs careful
    counselling rather than delivering a clean answer.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, recurrent chromosomal imbalances in MRKH syndrome still only
      apply to a minor fraction of patients (around 10%).
    explanation: >-
      Quantifies the diagnostic yield, which is the basis for treating this test
      as optional.
treatments:
- name: Progressive Vaginal Dilation
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: progressive self-dilation of the vaginal dimple (Frank method)
    term:
      id: NCIT:C93165
      label: Vaginal Dilation Therapy
  description: >-
    First-line therapy for vaginal agenesis and has been the ACOG
    recommendation since 2002. Progressive dilators are applied to the vaginal
    apex for 10 to 30 minutes, one to three times daily. Anatomic and functional
    success is reached by 90-96% of patients, at a low complication rate and low
    cost, and comparative studies generally find dilation non-inferior to
    surgery. Two points are easy to lose. First, the method works because the
    residual pouch is lined with native vaginal mucosa, which surgical grafts do
    not reproduce — and that mucosal lining also supplies a normal vaginal
    microbiota, which matters if uterus transplantation is later contemplated.
    Second, success depends on maturity, motivation and supervised therapeutic
    education rather than on the device; poor compliance is the main mode of
    failure, and it is a legitimate outcome for a patient to choose no treatment
    at all.
  target_mechanisms:
  - target: Cervical and Upper Vaginal Atresia with a Blind Vaginal Pouch
    treatment_effect: RESTORES
    description: >-
      Mechanical elongation of the sinus-derived pouch addresses the vaginal
      arm of the lesion. It does nothing for the uterine arm, and does not treat
      infertility.
  evidence:
  - reference: PMID:29266078
    reference_title: "ACOG Committee Opinion No. 728: Müllerian Agenesis: Diagnosis, Management, And Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsurgical vaginal elongation by dilation should be the first-line
      approach. When well-counseled and emotionally prepared, almost all
      patients (90-96%) will be able to achieve anatomic and functional success
      by primary vaginal dilation.
    explanation: >-
      Establishes both the first-line status and the success rate quoted here.
- name: Vaginoplasty
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: vaginoplasty for vaginal agenesis
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Reserved for patients in whom dilation has failed. Several techniques exist
    — laparoscopic Vecchietti traction, McIndoe split-skin graft, Davydov
    peritoneal graft, Williams vulvovaginoplasty, bowel graft, and more recently
    cultured autologous vulvar tissue and tissue-engineered constructs — and no
    comparative trial establishes one as best; most centres see too few patients
    to acquire more than one technique, which is itself a source of publication
    and reporting bias in the outcome literature. The point that most changes
    patient expectations is that surgery does not remove the need for dilation:
    post-operative dilation is still required to prevent strictures. NCIT has no
    clinical-action term for vaginoplasty, so the binding is the generic
    Surgical Procedure with the specificity carried in the preferred term.
  target_mechanisms:
  - target: Cervical and Upper Vaginal Atresia with a Blind Vaginal Pouch
    treatment_effect: RESTORES
    description: >-
      Surgical creation of a neovaginal canal in the space between bladder and
      rectum, substituting for the absent duct-derived segment.
  evidence:
  - reference: PMID:29266078
    reference_title: "ACOG Committee Opinion No. 728: Müllerian Agenesis: Diagnosis, Management, And Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cases in which surgical intervention is required, referrals to centers
      with expertise in this area should be considered because few surgeons have
      extensive experience in construction of the neovagina
    explanation: >-
      Supports both the second-line positioning and the centre-volume caveat.
- name: Uterus Transplantation
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: uterus transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  description: >-
    The first and still the only treatment for the infertility itself, as
    distinct from the anatomy. A living-donor uterus transplant in a 35-year-old
    woman with MRKH syndrome in Gothenburg in 2013 led to menstruation 43 days
    after transplantation, pregnancy after a single embryo transfer a year
    later, and a livebirth in September 2014. Three episodes of mild rejection
    were reversed with corticosteroids; delivery was by caesarean section at 31
    weeks and 5 days for pre-eclampsia. The mechanistic logic is that in this
    syndrome the deficit is purely gestational — ovaries and oocytes are normal
    — so replacing the uterus restores gestational, genetic and legal
    motherhood together, which neither surrogacy nor adoption does. It requires
    IVF beforehand and immunosuppression throughout pregnancy, so it is a
    serious intervention rather than a routine option.
  target_mechanisms:
  - target: Absolute Uterine Factor Infertility
    treatment_effect: RESTORES
    description: >-
      Supplies the missing organ, which is the only mechanism by which this node
      can be addressed.
  evidence:
  - reference: PMID:25301505
    reference_title: "Livebirth after uterus transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2013, a 35-year-old woman with congenital absence of the uterus
      (Rokitansky syndrome) underwent transplantation of the uterus in
      Sahlgrenska University Hospital, Gothenburg, Sweden.
    explanation: >-
      Establishes that the index case of this treatment was a patient with this
      syndrome.
  - reference: PMID:25301505
    reference_title: "Livebirth after uterus transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the first livebirth after uterus transplantation. This report
      is a proof-of-concept for uterus transplantation as a treatment for
      uterine factor infertility.
    explanation: >-
      The outcome that makes this a treatment rather than a proposal.
- name: In Vitro Fertilization with a Gestational Carrier
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: in vitro fertilization with gestational surrogacy
    term:
      id: NCIT:C16580
      label: In Vitro Fertilization
  description: >-
    IVF using the patient's own oocytes with embryo transfer to a gestational
    carrier, which yields genetic but not gestational motherhood. It has been
    the established route to biological parenthood since the mid-1990s and is
    effective, but it is prohibited in many jurisdictions on ethical, religious
    or legal grounds, so availability is a matter of geography rather than of
    medicine. One consequence worth recording: because surrogacy bypasses the
    infertility that otherwise blocks vertical transmission, mother-to-daughter
    recurrence of MRKH syndrome after surrogacy has now been reported, which is
    why recurrence-risk counselling is becoming a real part of care rather than
    a theoretical one.
  target_mechanisms:
  - target: Absolute Uterine Factor Infertility
    treatment_effect: BYPASSES
    description: >-
      Bypasses rather than corrects the missing organ, by gestating the
      patient's genetic embryo elsewhere.
  evidence:
  - reference: PMID:29266078
    reference_title: "ACOG Committee Opinion No. 728: Müllerian Agenesis: Diagnosis, Management, And Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assisted reproductive techniques with use of a gestational carrier
      (surrogate) have been shown to be successful for women with müllerian
      agenesis.
    explanation: >-
      Establishes efficacy of this route in this population.
- name: Psychological Counselling and Peer Support
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: psychological counselling and support
    term:
      id: NCIT:C15308
      label: Psychotherapy
  description: >-
    Not adjunctive. The diagnosis arrives in adolescence and simultaneously
    delivers infertility, a threat to female identity, and the prospect of
    coital difficulty; measured psychological distress is higher than in
    comparison women, and qualitative work identifies hindered independence,
    feeling different, difficulty managing intimacy and threatened female
    identity as the recurring themes. Group programmes reduce distress, and
    every patient should be offered counselling and encouraged to connect with a
    peer support group. Counselling also gates the anatomical treatments:
    dilation depends on maturity and motivation, so counselling precedes it
    rather than following it.
  target_mechanisms:
  - target: Absolute Uterine Factor Infertility
    treatment_effect: MODULATES
    description: >-
      Addresses the psychological consequences of this node, which no
      anatomical or reproductive intervention removes.
  evidence:
  - reference: PMID:29266078
    reference_title: "ACOG Committee Opinion No. 728: Müllerian Agenesis: Diagnosis, Management, And Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The psychologic effect of the diagnosis of müllerian agenesis should not
      be underestimated. All patients with müllerian agenesis should be offered
      counseling and encouraged to connect with peer support groups.
    explanation: >-
      Professional-society statement that counselling and peer support are part
      of standard care here.
- name: Laparoscopic Excision of Symptomatic Uterine Remnants
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: laparoscopic excision of a uterine remnant
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Indicated where a rudimentary bud contains functional endometrium and is
    causing catamenial pain or haematometra, and it is the one operation in this
    syndrome that treats an active lesion rather than an absence. Since MRI now
    identifies concealed functional endometrium preoperatively, the decision can
    be made on imaging rather than at diagnostic laparoscopy. Given that
    endometriosis risk tracks functional endometrium in a remnant at an odds
    ratio of about 12, removing the symptomatic remnant plausibly addresses the
    source of that risk as well as the pain — though the entry does not claim a
    demonstrated reduction in endometriosis incidence, which has not been shown.
  target_mechanisms:
  - target: Retained Cycling Endometrium in Uterine Remnants
    treatment_effect: INHIBITS
    description: >-
      Removes the cycling tissue, which is the substrate of the node.
  evidence:
  - reference: PMID:40246293
    reference_title: "Prevalence of endometriosis in Mayer-Rokitansky-Küster-Hauser syndrome variants: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significantly increased risk of endometriosis was observed in MRKHSFE+
      patients compared with MRKHSFE- patients (overall odds ratio estimate was
      12.0; 95% CI, 5.1-28.3%).
    explanation: >-
      Quantifies the risk attached to the tissue this operation removes. It does
      not itself evidence that excision lowers that risk.
- name: Genetic Counselling
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counselling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Increasingly relevant rather than routine. A detailed family history
    covering both MRKH syndrome and associated renal or uterovaginal anomalies
    in relatives is the single highest-yield step, since subtle anomalies in
    asymptomatic relatives may need imaging to find. Where a variant in GREB1L,
    PAX8 or HNF1B is identified, counselling covers recurrence risk with
    incomplete penetrance and sex-limited expressivity, and at-risk relatives
    can be tested. Two cautions belong in the same conversation: most reported
    variants remain of uncertain significance, and the recurrence question is
    only actionable at all because surrogacy and transplantation have made
    genetic parenthood possible.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in the current state of knowledge, many reported variants
      associated with MRKH syndrome are still to be considered as variants of
      uncertain significance, which warrant cautious interpretations and
      counseling in clinical care.
    explanation: >-
      Supports the caution this record places on genetic counselling in this
      syndrome.
differential_diagnoses:
- name: WNT4-related Müllerian aplasia with hyperandrogenism
  description: >-
    The closest genetic mimic and deliberately not curated as part of this
    entry. WNT4 was the first gene with firm monogenic evidence for Müllerian
    agenesis, but the phenotype it causes includes clinical and biochemical
    hyperandrogenism, which classic MRKH syndrome does not, and it is generally
    treated as a separate entity (OMIM 158330). Larger MRKH cohorts have found
    no WNT4 variants. The separation matters practically: virilization in a
    patient with Müllerian agenesis should redirect the genetic workup rather
    than be filed as atypical MRKH syndrome.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MD agenesis caused by WNT4 variants is associated with clinical and
      biochemical hyperandrogenism, representing a phenotype distinct from MRKH
      syndrome in general
    explanation: >-
      States the discriminating feature and the reason for treating this as a
      separate entity.
  - reference: PMID:15317892
    reference_title: "A WNT4 mutation associated with Müllerian-duct regression and virilization in a 46,XX woman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An 18-year-old woman presented with primary amenorrhea and an absence of
      müllerian-derived structures, unilateral renal agenesis, and clinical
      signs of androgen excess--a phenotype resembling the
      Mayer-Rokitansky-Küster-Hauser syndrome and remarkably similar to that of
      female Wnt4-knockout mice.
    explanation: >-
      The index case, which shows how closely this entity mimics MRKH syndrome
      and that androgen excess is the feature that separates them.
- name: Complete androgen insensitivity syndrome
  description: >-
    Shares the presentation almost exactly: normal female appearance, breast
    development, a blind-ending vagina and an absent uterus, presenting as
    primary amenorrhea. The mechanism is the opposite — a 46,XY individual whose
    testes produce anti-Müllerian hormone, so the Müllerian structures regress
    normally rather than failing to form, and whose androgen receptor is
    non-functional. Sparse pubic hair and karyotype separate them.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hauser and colleagues described that sex-chromatin analysis could aid the
      differentiation of MRKH syndrome from Turner syndrome and defined MRKH
      syndrome (at the time termed 'Mayer-Rokitansky-Küster syndrome') to
      include normal female chromosomes
    explanation: >-
      Cited indirectly: it establishes that karyotype is definitional for this
      syndrome and was introduced precisely to separate it from a karyotypic
      mimic, which is the same logic that separates it from 46,XY causes.
- name: Imperforate hymen or transverse vaginal septum
  description: >-
    An obstructive anomaly with a normal uterus, mistaken for vaginal agenesis
    when only the introitus is examined. Ultrasound resolves it by showing a
    proximal vaginal canal and often haematocolpos. This is the differential
    with the most direct consequence of being got wrong in either direction:
    incising a blind pouch in a patient with agenesis achieves nothing and
    risks urethral or rectal injury, while leaving an obstruction undrained
    allows retrograde disease.
  evidence:
  - reference: PMID:22906151
    reference_title: "Malformations in a cohort of 284 women with Mayer-Rokitansky-Küster-Hauser syndrome (MRKH)."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      290 women with MRKH syndrome were clinically evaluated with using clinical
      examinations, abdominal and perineal/rectal ultrasound, MRI, and
      laparoscopy.
    explanation: >-
      Cited indirectly: it documents that imaging rather than examination alone
      is what establishes the diagnosis, which is the step that separates
      agenesis from an obstructive anomaly.
- name: Unstimulated prepubertal or hypoestrogenic uterus
  description: >-
    A uterus that has never been exposed to estrogen — in 46,XX or 45,X ovarian
    insufficiency, or simply in a prepubertal child imaged incidentally — can be
    reported as absent. Exogenous estrogen induces uterine development in these
    patients, which proves the uterus was present and unstimulated rather than
    agenetic. Prepubertal pelvic imaging in particular should not be used to
    diagnose agenesis.
  evidence:
  - reference: PMID:29266078
    reference_title: "ACOG Committee Opinion No. 728: Müllerian Agenesis: Diagnosis, Management, And Treatment."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most important steps in the effective management of müllerian agenesis
      are correct diagnosis of the underlying condition, evaluation for
      associated congenital anomalies, and psychosocial counseling
    explanation: >-
      Cited indirectly: it places correct diagnosis of the underlying condition
      first among management steps, which is the general principle this
      differential applies, without naming the hypoestrogenic mimic itself.
discussions:
- discussion_id: mrkh_unexplained_etiology
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Mesodermal Developmental Transcription Factor Dosage
  - mechanistic_hypotheses#mesodermal_transcriptional_program
  prompt: >-
    What causes MRKH syndrome in the large majority of patients who have no
    recurrent copy-number variant and no variant in a known candidate gene?
  rationale: >-
    Recurrent chromosomal imbalances account for around 10% of patients, and the
    sequence-variant genes with real evidence — GREB1L, PAX8, HNF1B — add a
    further minority. The initiating node of this entry is therefore
    unpopulated for most patients, which is unusual for a curated dismech
    entry: the canonical hypothesis about what fails developmentally is secure,
    while the hypothesis about why it fails covers a small fraction of cases.
    The gap is not simply "more sequencing needed": sporadic occurrence and
    repeated monozygotic discordance mean a germline monogenic explanation
    cannot cover the whole disease however deeply cohorts are sequenced, so the
    somatic, mosaic, epigenetic and environmental alternatives have to be tested
    on their own terms. Reported epigenetic findings are so far inconsistent.
  proposed_experiments:
  - experiment_id: exp_mrkh_discordant_twin_somatic_variation
    name: Somatic variant and methylation profiling of uterine remnant tissue in discordant monozygotic twins
    description: >-
      Deep sequencing and methylation profiling of surgically removed uterine
      remnant tissue from monozygotic twins discordant for MRKH syndrome,
      against matched blood from both twins, to test whether a post-zygotic
      somatic or epigenetic lesion restricted to the affected twin's urogenital
      tissue explains the discordance. Interpretation is limited by a caveat the
      field has already identified: gene expression in adult remnant tissue may
      not represent embryonic expression, so a negative result would not exclude
      a developmental epigenetic mechanism.
    would_support:
    - mechanistic_hypotheses#nonmendelian_somatic_or_environmental
    would_refute:
    - mechanistic_hypotheses#mesodermal_transcriptional_program
    supporting_outcome:
    - >-
      A somatic variant or differentially methylated region present in the
      affected twin's remnant tissue and absent from both twins' blood and from
      the unaffected twin.
    refuting_outcome:
    - >-
      No tissue-restricted somatic or epigenetic difference, with a shared
      germline variant in a mesodermal developmental regulator found instead in
      both twins.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, recurrent chromosomal imbalances in MRKH syndrome still only
      apply to a minor fraction of patients (around 10%).
    explanation: >-
      Quantifies the size of the gap this discussion records.
- discussion_id: mrkh_tbx6_monoallelic_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Paraxial Mesoderm and Somite Patterning Failure
  - genetic#TBX6
  prompt: >-
    Does the compound-inheritance gene dosage model established for TBX6 in
    congenital scoliosis apply to MRKH syndrome, given that no second
    hypomorphic allele has been found in MRKH patients?
  rationale: >-
    This is a model-fidelity problem rather than an absence of evidence, which
    is why it is recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP.
    Evidence for TBX6 exists on both sides: rare variants are enriched in a
    large MRKH cohort and several are loss-of-function in assays, and the
    16p11.2 deletion is recurrent. The mechanism borrowed to explain it comes
    from congenital scoliosis at the same locus, where disease requires a null
    allele plus a particular hypomorphic allele in trans. That second allele has
    not been found in MRKH syndrome. So either the Müllerian phenotype has a
    lower dosage threshold than the axial-skeletal one, or a different
    modifier is involved, or the monoallelic variants are not causal at all —
    and the review states plainly that no clear biological mechanism has been
    established. This entry therefore draws the TBX6 route to the skeletal node
    as indirect and records the gene as SUSCEPTIBILITY rather than CAUSATIVE.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As of now, no clear biological mechanism for monoallelic TBX6 variants
      causing MRKH syndrome has been established, which challenges
      interpretation and warrants further studies.
    explanation: >-
      States the mismatch this discussion records.
- discussion_id: mrkh_endometriosis_without_functional_endometrium
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Retained Cycling Endometrium in Uterine Remnants
  - phenotypes#Endometriosis
  prompt: >-
    What accounts for endometriosis in the MRKH patients who have no functional
    endometrium and no uterine remnant at all?
  rationale: >-
    The meta-analysis that ties endometriosis in this syndrome to functional
    endometrium in a remnant is strong — 32.0% versus 1.5%, odds ratio 12.0 —
    and it substantially rehabilitates retrograde menstruation as the mechanism
    in a population long cited as the counter-example to it. But it does not go
    to zero. Seven of 71 patients with endometriosis had no demonstrable
    functional endometrium and no remnant. Those cases cannot be explained by
    retrograde menstruation from a remnant, and they are the residue that keeps
    coelomic metaplasia or embryonic-remnant origins in play. The question is
    worth keeping open rather than treating the meta-analysis as settling the
    theory, because this population is one of the few in which the two competing
    origins can be separated by ascertaining a single anatomical variable.
  evidence:
  - reference: PMID:40246293
    reference_title: "Prevalence of endometriosis in Mayer-Rokitansky-Küster-Hauser syndrome variants: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 71 MRKHS patients with endometriosis, 64 had coexisting FE, and
      only seven had no evidence of FE within UR or did not have UR.
    explanation: >-
      The residual cases that motivate this question.
notes: >-
  Scope and lump/split. The stub for this concept was UNDECIDED. It is curated
  as a single DISEASE entry with MONDO's own two children as `has_subtypes`,
  rather than as two entries or a grouping, for three reasons. The MONDO term
  itself is written as a spectrum with type 1 and type 2 as its classification.
  The two types share one mechanism entirely — the same Müllerian duct failure,
  the same anatomy, the same treatment pathway — and differ only in whether the
  shared mesodermal lineage failure extended beyond the duct, which this entry
  models as extra branches off one causal graph rather than as a second disease.
  And the boundary between them is set by how hard anyone looked: renal imaging
  reclassifies type 1 as type 2, one cohort had no urinary tract imaging in a
  third of its patients, and systematic ear assessment finds abnormalities at
  roughly twice the routinely reported rate. A classification whose boundary
  moves with ascertainment intensity is a subtype axis, not a split.

  MURCS is deliberately not a separate entry or subtype. It names the severe end
  of type 2 and is grouped into it in current usage; giving it its own record
  would assert a boundary that the literature reports as a continuum.

  Ontology gaps encountered. Two phenotypes could not be bound precisely.
  Catamenial (cyclic) abdominal pain and cryptomenorrhoea have no HPO term, so
  the phenotype is bound to `HP:0002027` Abdominal pain with
  `temporality: RECURRENT` and the cyclic character carried in
  `preferred_term`; haematometra likewise has no HPO term and is described in
  prose rather than given a phenotype record of its own. On the treatment side,
  NCIT has no clinical-action term for vaginoplasty, so that treatment binds the
  generic `NCIT:C15329` Surgical Procedure. These are recorded as unbound rather
  than bound to something approximate.

  What this entry does not carry. No ICD-10-CM or Orphanet mapping block: the
  relevant codes (ICD-10 Q51.0/Q52.0, ORPHA 3109) are named in the source
  literature but neither prefix could be validated offline from the committed
  caches in this session, and an unvalidated mapping is worse than none. No
  `biochemical` section, because the point about laboratory values here is that
  they are normal — gonadotropins, estradiol and androgens all in the normal
  female range — and a marker record asserting normality would misrepresent
  what is known. One caveat on that: biochemical hyperandrogenaemia without
  clinical signs has been reported in about half of patients in a single study,
  which the source review flags as requiring validation; it is left out for that
  reason and because it would confuse the WNT4 differential, where
  hyperandrogenism is the discriminating feature.

  Evidence base. Ten references, all cached: two current genetics reviews
  (PMID:38699388, PMID:41616459), the functional-genomics HNF1B paper that
  produced the first type 2 mouse model (PMID:36282544), the comprehensive
  clinical review (PMID:32819397), the ACOG committee opinion (PMID:29266078),
  the Danish nationwide prevalence cohort (PMID:27609979), the 284-woman
  malformation cohort (PMID:22906151), the endometriosis meta-analysis
  (PMID:40246293), the index uterus transplantation livebirth report
  (PMID:25301505), and the index WNT4 case report (PMID:15317892) cited on the
  differential it defines. Snippets were taken preferentially from clean full-text XML
  and structured abstracts; the two quotations from PMID:32819397 avoid the
  hyphenated line breaks that PDF extraction introduces elsewhere in that file.

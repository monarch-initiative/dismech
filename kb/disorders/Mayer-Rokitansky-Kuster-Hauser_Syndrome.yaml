- name: Retained Cycling Endometrium in Uterine Remnants
  biological_scale: TISSUE
  role: amplifier
  description: >-
    Where a rudimentary bud contains functional endometrium and has no outflow
    tract, that endometrium proliferates and sheds into a closed cavity. The
    clinical result is catamenial abdominal pain and, when enough blood
    accumulates, haematometra. The same cryptic menstruation is the best
    available explanation for endometriosis in a woman with no uterus: a
    systematic review and meta-analysis of 666 patients in whom the presence or
    absence of functional endometrium was actually verified found endometriosis
    in 32.0% of those with functional endometrium versus 1.5% of those without,
    an odds ratio of 12.0. That is a strong argument for retrograde
    menstruation from the remnant, and it is worth noting for what it does to a
    long-standing objection: MRKH syndrome has often been cited as a case of
    endometriosis without menstruation, and once functional endometrium is
    ascertained rather than assumed absent, most of the cases turn out to have a
    menstruating source. The residual 1.5% is not explained by this mechanism.
  locations:
  - preferred_term: uterus
    term:
      id: UBERON:0000995
      label: uterus

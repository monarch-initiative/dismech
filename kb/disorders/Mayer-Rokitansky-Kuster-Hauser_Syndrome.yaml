- name: Spared Gonadal Ridge Lineage with Normal Ovarian Steroidogenesis
  biological_scale: ORGANISM
  role: mediator
  description: >-
    The ovaries do not derive from the Müllerian ducts, so the lesion does not
    touch them: adnexa are normal in the large majority of patients, and
    gonadotropins, estradiol and androgens are in the normal female range. Two
    consequences follow, and between them they account for most of how the
    syndrome presents. First, puberty is normal — thelarche, pubarche and growth
    all proceed — so nothing is apparent until menses fail to arrive, which is
    why the median age at referral is in the late teens rather than at birth.
    Second, any endometrium retained in a uterine bud is exposed to ordinary
    cyclic ovarian steroids and therefore cycles. This node is included as a
    mechanistic mediator rather than as an incidental normal finding precisely
    because that second consequence is what generates the cyclic pain,
    haematometra and endometriosis arm of the disease.

genetic:
- name: GREB1L
  gene_term:
    preferred_term: GREB1L
    term:
      id: hgnc:31042
      label: GREB1L
  association: Causative
  relationship_type: CAUSATIVE
  frequency: variants in about 8% of sporadic patients in one series
  notes: >-
    The best-supported gene in the syndrome, and the only one described as a
    major causative gene. It came into the field from the other end: GREB1L
    variants were identified in 2017 as a dominant cause of congenital anomalies
    of the kidney and urinary tract, and some of the affected female fetuses
    also had uterovaginal malformations. A three-generation family with four
    cases of renal agenesis, two of them adult female cousins with type II MRKH
    syndrome, then yielded a segregating missense variant. Homozygous Greb1l
    knock-out mice lack kidneys, Wolffian ducts and Müllerian ducts. The gap in
    the account is at the molecular end: human variants are monoallelic and
    mostly missense, and how such a variant produces the phenotype is unknown.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      epidemiological evidence of rare variant enrichment in larger cohorts, and
      functional evidence from knock-out mice, suggest GREB1L as a major
      causative gene in MRKH syndrome.
    explanation: >-
      The review's own summary judgement on this gene, based on pedigree,
      cohort-enrichment and mouse evidence together.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous knock-out of Greb1l in mice has been shown to cause absence of
      the kidneys, Wolffian ducts, and Müllerian ducts
    explanation: >-
      Mouse loss of function reproduces the combined renal and Müllerian
      phenotype, which is the functional half of the causality argument.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the pathogenic mechanism of how these missense variants cause MRKH
      syndrome is still unknown requiring further functional analysis
    explanation: >-
      Records the limit of the account: the human allele class is monoallelic
      missense and its mechanism is unresolved, so the mouse null is not a
      complete model of it.
- name: PAX8
  gene_term:
    preferred_term: PAX8
    term:
      id: hgnc:8622
      label: PAX8
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Established by a mutational burden analysis across 442 cases and 941
    controls that found enrichment of predicted loss-of-function variants, with
    replication and functional support for two of five missense variants tested.
    PAX8 was already a monogenic cause of congenital hypothyroidism from thyroid
    dysgenesis, and reverse-phenotyping of female congenital hypothyroidism
    cases found uterovaginal aplasia in one — so MRKH syndrome is a
    female-restricted arm of an existing pleiotropic gene, which the authors
    name CH-MRKHS. Paternal transmission confirmed in three cases is the
    cleanest available demonstration of sex-limited expressivity in this
    syndrome, since an unaffected father cannot be explained by reduced
    penetrance alone.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among cases, they found enrichment for predicted loss-of-function variants
      in PAX8.
    explanation: >-
      Case-control enrichment is the primary evidence for this gene.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This confirms MRKH syndrome as a part of the PAX8 disease spectrum in
      females
    explanation: >-
      States the pleiotropy claim this record encodes.
- name: HNF1B
  gene_term:
    preferred_term: HNF1B
    term:
      id: hgnc:11630
      label: HNF1B
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Implicated twice over: it lies in the recurrently deleted 17q12 interval,
    and it carries independent sequence-variant evidence. The oldest observation
    is from a 1999 Norwegian MODY5 family in which two of four female variant
    carriers had uterovaginal agenesis. The mechanistic case was closed
    experimentally in 2023 by conditional ablation of Hnf1b in Müllerian duct
    epithelium, which produced a hypoplastic uterus with renal anomalies — the
    first mouse model of MRKH type II — and showed that HNF1B acts here
    independently of LHX1 at the same locus.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, two of four female variant carriers also had uterovaginal
      agenesis, supporting MRKH syndrome as part of the HNF1B disease spectrum
    explanation: >-
      Human pedigree evidence, from a family ascertained for diabetes rather
      than for a genital anomaly.
  - reference: PMID:36282544
    reference_title: "Functional genomics analysis identifies loss of HNF1B function as a cause of Mayer-Rokitansky-Küster-Hauser syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, we establish that loss of Hnf1b function leads to an MRKH phenotype
      and generate the first mouse model of MRKH syndrome type II.
    explanation: >-
      Tissue-specific ablation establishes causality rather than association for
      this gene.
- name: LHX1
  gene_term:
    preferred_term: LHX1
    term:
      id: hgnc:6593
      label: LHX1
  association: Candidate gene at the 17q12 locus; sequence variants disputed
  relationship_type: DISPUTED
  notes: >-
    The other candidate in the 17q12 interval, and the one with the cleaner
    animal evidence but the weaker human evidence. Lhx1-null females have normal
    ovaries and no reproductive tract, from failure of duct elongation and
    epithelium formation — the exact human dissociation. But mutational analysis
    of larger patient cohorts has not found LHX1 sequence variants, so single
    nucleotide variation in this gene is not a major cause even though deletion
    of the interval containing it is recurrent. It is curated DISPUTED for that
    reason: the gene is plausibly a contributor to the 17q12 deletion phenotype
    while not being an independent monogenic cause.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lhx1-null female mice have normal ovaries but lack their reproductive
      tract, which results from a disruption of MD elongation and epithelium
      formation
    explanation: >-
      The animal evidence in favour of a role for this gene.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LHX1 mutational analysis of larger cohorts did not report any variants,
      suggesting that sequence variants of LHX1 are no major cause of MRKH
      syndrome
    explanation: >-
      Negative cohort evidence against LHX1 sequence variation as a monogenic
      cause, which is why the relationship is recorded as DISPUTED.
- name: TBX6
  gene_term:
    preferred_term: TBX6
    term:
      id: hgnc:11605
      label: TBX6
  association: Susceptibility at the recurrent 16p11.2 deletion locus
  relationship_type: SUSCEPTIBILITY
  notes: >-
    The candidate gene at 16p11.2, the second commonest recurrent deletion in
    the syndrome. Rare TBX6 variants are enriched in a large patient cohort and
    seven of thirteen missense variants tested showed loss of function, so the
    genetic association is real. The mechanistic story is not. At this locus,
    congenital scoliosis requires a null allele plus a specific hypomorphic
    allele in trans, and no such second risk allele has been found in MRKH
    syndrome — leaving monoallelic variants with no established route to the
    phenotype. Recorded as SUSCEPTIBILITY rather than CAUSATIVE for exactly
    that reason.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ma et al. reported 16 rare TBX6 variants enriched in a large MRKH syndrome
      patient cohort compared to controls.
    explanation: >-
      Case-control enrichment supporting a genuine association with this gene.
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in contrast to null alleles associated with scoliosis, no second
      risk alleles were reported in MRKH syndrome
    explanation: >-
      The compound-inheritance model that explains TBX6 in scoliosis does not
      transfer, which argues against a simple causative reading here.
- name: WNT9B
  gene_term:
    preferred_term: WNT9B
    term:
      id: hgnc:12779
      label: WNT9B
  association: Candidate gene; variants of uncertain significance
  relationship_type: UNKNOWN
  notes: >-
    A strong biological candidate with unresolved human genetics. Wnt9b is
    expressed in Wolffian duct epithelium and provides the signals guiding
    Müllerian duct elongation, and Wnt9b knock-down in mice causes uterovaginal
    and renal agenesis. Nine sequence variants have been reported in type I
    patients, but other studies found none, and the functional consequence of
    the reported variants has not been established.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Wnt9b is expressed in the Wolffian duct epithelium providing signals
      guiding MD elongation
    explanation: >-
      Establishes the biological candidacy, which is what this record rests on
      in the absence of settled human genetics.
- name: RBM8A
  gene_term:
    preferred_term: RBM8A
    term:
      id: hgnc:9905
      label: RBM8A
  association: Proposed candidate gene at the 1q21.1 locus; causality not established
  relationship_type: UNKNOWN
  notes: >-
    The proposed candidate within variable-sized 1q21.1 deletions reported in
    the syndrome. The same region causes thrombocytopenia-absent radius syndrome
    in compound heterozygosity with non-coding polymorphisms in trans, and TAR
    syndrome has been reported once alongside MRKH syndrome. Causality is
    explicitly not established, and the record exists so that the locus is
    findable rather than to assert a gene-disease relationship.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The possible causal role of 1q21.1 deletions/RBM8A gene variants in MRKH
      syndrome is, however, still unclear warranting further studies to
      establish causality.
    explanation: >-
      Graded NO_EVIDENCE because the cited review states the causal question is
      unresolved: it neither supports nor refutes a gene-disease relationship
      for RBM8A.

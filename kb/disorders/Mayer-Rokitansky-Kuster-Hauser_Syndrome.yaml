- name: Shared Intermediate Mesoderm Lineage Failure
  biological_scale: TISSUE
  role: consequence
  description: >-
    The renal arm of type II, and the strongest structural argument that MRKH
    syndrome is a lineage disorder rather than an organ-specific one. The
    nephric duct and the Müllerian duct develop side by side out of the
    intermediate mesoderm, the Müllerian duct elongates guided by the Wolffian
    duct, and the transcriptional regulators implicated in the syndrome are the
    regulators of kidney development. Around 30% of patients accordingly have a
    renal malformation, unilateral renal agenesis being about half of those.
    The clinching detail is laterality: absence of one Müllerian duct is often
    accompanied by absence of the ipsilateral kidney, which is what a single
    unilateral lineage failure predicts and what two independent malformations
    would not.

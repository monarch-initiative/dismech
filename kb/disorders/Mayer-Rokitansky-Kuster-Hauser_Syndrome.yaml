- name: Paraxial Mesoderm and Somite Patterning Failure
  biological_scale: TISSUE
  role: consequence
  description: >-
    The skeletal arm of type II, and the reason the MURCS acronym names
    cervicothoracic somite dysplasia alongside Müllerian and renal aplasia.
    Paraxial mesoderm forms the axial skeleton, TBX6 patterns it, and the
    16p11.2 deletion that removes TBX6 is one of the recurrent copy-number
    variants in this syndrome — the same locus is independently associated with
    congenital scoliosis. Skeletal anomalies are the second most frequent
    extragenital finding and involve the axial skeleton preferentially. This
    node is nonetheless the weakest link in the entry's causal chain: the
    scoliosis association at this locus follows a compound inheritance dosage
    model requiring a second hypomorphic allele, no such second allele has been
    found in MRKH syndrome, and no biological mechanism has been established for
    the monoallelic TBX6 variants reported here.

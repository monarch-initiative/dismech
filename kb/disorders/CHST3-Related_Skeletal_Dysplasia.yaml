biochemical:
- name: Reduced 6-O-Sulfated Chondroitin Sulfate in Dermal Fibroblasts
  notes: >
    Analysis of chondroitin sulfate proteoglycans from patient dermal
    fibroblasts shows markedly decreased 6-O-sulfation with a compensatory
    increase in 4-O-sulfation. This reciprocal shift is the functional signature
    of CHST3 deficiency and distinguishes it from SLC26A2/DTDST deficiency,
    where sulfation is globally reduced. It is mechanistically informative but
    is not an established, widely available clinical assay.
  specificity: >-
    The 6-O-down / 4-O-up pattern is specific for CHST3 deficiency among the
    proteoglycan-sulfation skeletal dysplasias.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:18513679
    reference_title: "Congenital joint dislocations caused by carbohydrate sulfotransferase 3 deficiency in recessive Larsen syndrome and humero-spinal dysostosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of chondroitin sulfate proteoglycans in dermal fibroblasts showed
      markedly decreased 6-O-sulfation but enhanced 4-O-sulfation, confirming
      functional impairment of CHST3 and distinguishing them from diastrophic
      dysplasia sulphate transporter (DTDST)-deficient cells.
    explanation: >-
      Establishes the fibroblast biochemical signature and its discriminatory
      value.
  - reference: PMID:18698629
    reference_title: "Spondyloepiphyseal dysplasia, Omani type: further definition of the phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts and urine obtained from affected patients demonstrated
      negligible levels of 6-O-sulfated GalNAc residue in CS.
    explanation: >-
      Independent confirmation of near-absent 6-O-sulfated GalNAc in patient
      fibroblasts and urine.
- name: Urinary Chondroitin Sulfate Undersulfation
  notes: >
    Anion-exchange HPLC of urinary chondroitin sulfate shows marked
    undersulfation, with reduced 6-O-sulfated disaccharide and an increase in
    the nonsulfated unit.
  evidence:
  - reference: PMID:15215498
    reference_title: "Loss of chondroitin 6-O-sulfotransferase-1 function results in severe human chondrodysplasia with progressive spinal involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the patient's urine shows marked undersulfation of CS, in
      particular reduction in 6-O-sulfated disaccharide and an increase in the
      nonsulfated unit.
    explanation: >-
      Demonstrates that the sulfation defect is detectable in urine.
progression:
- phase: Prenatal and neonatal
  notes: >
    Growth restriction begins before birth. Affected infants present at birth
    with dislocation of the knees, hips and/or radial heads, club feet, and
    reduced birth length. The initial diagnostic label has historically been
    Larsen syndrome, humero-spinal dysostosis, or chondrodysplasia with multiple
    dislocations.
  evidence:
  - reference: PMID:20830804
    reference_title: "Phenotypic features of carbohydrate sulfotransferase 3 (CHST3) deficiency in 24 patients: congenital dislocations and vertebral changes as principal diagnostic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that CHST3 deficiency presents at birth with congenital
      dislocations of knees, hips, and elbows, and is often diagnosed initially
      as Larsen syndrome, humero-spinal dysostosis, or chondrodysplasia with
      dislocations.
    explanation: >-
      Defines the neonatal presentation and its historical diagnostic labels.
- phase: Childhood
  notes: >
    Kyphosis, and occasionally scoliosis, develop during childhood with slight
    shortening of the trunk. Spondyloepiphyseal radiographic changes become
    progressively more evident.
  evidence:
  - reference: PMID:21882400
    reference_title: "Chondrodysplasia with Congenital Joint Dislocations, CHST3-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kyphosis and occasionally scoliosis with slight shortening of the trunk
      develop in childhood.
    explanation: >-
      GeneReviews places spinal deformity onset in childhood.
- phase: Adolescence and adulthood
  notes: >
    Joint pain, contractures and restricted movement dominate, with premature
    arthrosis and severe spinal involvement. Vertebral compression fracture has
    been documented. Intellect and vision remain normal.
  evidence:
  - reference: PMID:36729370
    reference_title: "A Chinese case of CHST3-related skeletal dysplasia and a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband complained of aggravated joint pain and had a compression
      fracture of L2 during his second decade.
    explanation: >-
      Illustrates the adolescent/adult course with aggravating pain and
      vertebral fracture.
diagnosis:
- name: Molecular genetic testing of CHST3
  description: >
    The diagnosis is established by identification of biallelic pathogenic CHST3
    variants in a proband with characteristic clinical and radiographic
    features. In practice this is a skeletal dysplasia gene panel or exome
    sequencing; single-gene testing is appropriate when the phenotype is typical
    or a familial variant is known.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:21882400
    reference_title: "Chondrodysplasia with Congenital Joint Dislocations, CHST3-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CDCJD-CHST3 is established in a proband with
      characteristic clinical and radiographic features and biallelic pathogenic
      variants in CHST3 identified by molecular genetic testing.
    explanation: >-
      GeneReviews states the diagnostic standard.
- name: Skeletal radiography
  description: >
    Radiographic evaluation is central to raising the diagnosis. Changes of the
    lumbar vertebrae are the most useful clue; bifid distal humeri with radial
    head subluxation are proposed as a further diagnostic key. Carpal bone age
    is normal and facial flattening is absent, which help separate CHST3
    deficiency from other multiple-dislocation dysplasias.
  evidence:
  - reference: PMID:20830804
    reference_title: "Phenotypic features of carbohydrate sulfotransferase 3 (CHST3) deficiency in 24 patients: congenital dislocations and vertebral changes as principal diagnostic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most useful radiographic clues were the changes of the lumbar
      vertebrae.
    explanation: >-
      Identifies the highest-yield radiographic feature.
  - reference: PMID:37183573
    reference_title: "CHST3-related skeletal dysplasia in 14 patients: Identification of 8 novel variants and further expansion of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bifid distal ends of humeri which can be considered a diagnostic key in
      patients with CHST3 variants
    explanation: >-
      Adds a second high-specificity radiographic sign.
- name: Echocardiography
  description: >
    Echocardiography is recommended at diagnosis and repeated on cardiology
    advice (roughly every five years if initially normal) because of heart valve
    dysplasia, which is usually minor but has been reported to be lethal in some
    patients.
  evidence:
  - reference: PMID:21882400
    reference_title: "Chondrodysplasia with Congenital Joint Dislocations, CHST3-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      if normal at the time of diagnosis, echocardiogram should be repeated per
      cardiologist or every five years
    explanation: >-
      GeneReviews surveillance recommendation.
  - reference: PMID:37183573
    reference_title: "CHST3-related skeletal dysplasia in 14 patients: Identification of 8 novel variants and further expansion of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      highlights the importance of performing echocardiography in patients
      harboring CHST3 variants
    explanation: >-
      Independent recommendation for echocardiographic evaluation.
differential_diagnoses:
- name: Larsen syndrome (FLNB-associated, autosomal dominant)
  description: >
    Dominant Larsen syndrome caused by heterozygous FLNB variants shares
    multiple congenital large-joint dislocations with CHST3 deficiency, and many
    CHST3 patients were initially given this label. The two are mechanistically
    unrelated: FLNB Larsen is an actin-crosslinking filamin defect, CHST3
    deficiency is a proteoglycan-sulfation defect.
  disease_term:
    preferred_term: Larsen syndrome
    term:
      id: MONDO:0007875
      label: Larsen syndrome
  distinguishing_features:
  - Autosomal dominant inheritance with FLNB variants, versus autosomal recessive CHST3 variants.
  - Characteristic vertebral changes, normal carpal bone age and absence of facial flattening favour CHST3 deficiency.
  - Fibroblast chondroitin sulfate analysis shows the 6-O-down / 4-O-up shift only in CHST3 deficiency.
  evidence:
  - reference: PMID:20830804
    reference_title: "Phenotypic features of carbohydrate sulfotransferase 3 (CHST3) deficiency in 24 patients: congenital dislocations and vertebral changes as principal diagnostic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical and radiographic pattern (joint dislocations, vertebral
      changes, normal carpal age, lack of facial flattening, and recessive
      inheritance) is characteristic and distinguishes CHST3 deficiency from
      other disorders with congenital dislocations such as filamin B-associated
      dominant Larsen syndrome and Desbuquois syndrome.
    explanation: >-
      Explicit statement of the discriminating features versus FLNB Larsen
      syndrome.
- name: Desbuquois dysplasia
  description: >
    Desbuquois dysplasia (CANT1, XYLT1) also presents with multiple joint
    dislocations, short stature and a proteoglycan-biosynthesis defect, and one
    CHST3 patient in the 24-patient series had been given this diagnosis before
    molecular testing.
  disease_term:
    preferred_term: Desbuquois dysplasia
    term:
      id: MONDO:0015426
      label: Desbuquois dysplasia
  distinguishing_features:
  - Advanced (accelerated) carpal ossification is typical of Desbuquois dysplasia; carpal bone age is normal in CHST3 deficiency.
  - Facial flattening is characteristic of Desbuquois dysplasia and absent in CHST3 deficiency.
  evidence:
  - reference: PMID:20830804
    reference_title: "Phenotypic features of carbohydrate sulfotransferase 3 (CHST3) deficiency in 24 patients: congenital dislocations and vertebral changes as principal diagnostic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      normal carpal age, lack of facial flattening, and recessive inheritance
    explanation: >-
      Names the discriminating radiographic and facial features versus
      Desbuquois syndrome.
- name: Diastrophic dysplasia (SLC26A2/DTDST deficiency)
  description: >
    Diastrophic dysplasia is the other classic proteoglycan-undersulfation
    skeletal dysplasia and is the closest biochemical mimic. It results from
    defective sulfate transport rather than a specific sulfotransferase
    deficiency.
  disease_term:
    preferred_term: diastrophic dysplasia
    term:
      id: MONDO:0009107
      label: diastrophic dysplasia
  distinguishing_features:
  - DTDST-deficient cells show globally reduced sulfation; CHST3-deficient cells show selectively reduced 6-O-sulfation with enhanced 4-O-sulfation.
  evidence:
  - reference: PMID:18513679
    reference_title: "Congenital joint dislocations caused by carbohydrate sulfotransferase 3 deficiency in recessive Larsen syndrome and humero-spinal dysostosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      markedly decreased 6-O-sulfation but enhanced 4-O-sulfation, confirming
      functional impairment of CHST3 and distinguishing them from diastrophic
      dysplasia sulphate transporter (DTDST)-deficient cells
    explanation: >-
      Biochemical discrimination between the two sulfation disorders.
treatments:
- name: Orthopedic Surgical Correction of Dislocated Joints
  description: >
    Surgical correction and stabilization of the abnormal joints is the only
    disease-directed treatment modality available. Correction is often only
    partially successful and multiple procedures are typically needed. There is
    no approved enzyme replacement, small-molecule, gene, RNA or cell therapy
    for CHST3-related skeletal dysplasia.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Large joint dislocations
    term:
      id: HP:0005008
      label: Large joint dislocations
  evidence:
  - reference: PMID:21882400
    reference_title: "Chondrodysplasia with Congenital Joint Dislocations, CHST3-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical correction of the abnormal joints is the only treatment modality;
      however, surgical correction is often only partially successful and
      multiple procedures are needed.
    explanation: >-
      GeneReviews management statement, including the caveat on limited efficacy.
- name: Occipitocervical Fusion for Atlantoaxial Instability
  description: >
    Cervical spinal fusion is indicated when atlantoaxial instability threatens
    the vertebral arteries or spinal cord. In the reported case complicated by
    posterior circulation stroke, occipitocervical fusion produced neurological
    improvement and return to independent ambulation at one-year follow-up.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: spinal fusion
    term:
      id: NCIT:C157986
      label: Spinal Fusion
  target_phenotypes:
  - preferred_term: Atlantoaxial instability
    term:
      id: HP:0003467
      label: Atlantoaxial instability
  evidence:
  - reference: PMID:33625031
    reference_title: "Posterior Circulation Stroke due to Atlantoaxial Instability in CHST3-Related Skeletal Dysplasia: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Occipitocervical fusion yielded good clinical results with the 1-year
      follow-up.
    explanation: >-
      Single-case evidence for surgical benefit; not generalizable to routine
      management.
- name: Physical Therapy
  description: >
    Physical therapy is used for general mobility support, but GeneReviews
    explicitly notes that it has not been effective for the joint manifestations
    of this disorder. It is recorded here with that negative qualification so
    the entry does not overstate benefit.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:21882400
    reference_title: "Chondrodysplasia with Congenital Joint Dislocations, CHST3-Related."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physical therapy has not been effective.
    explanation: >-
      GeneReviews explicitly refutes efficacy of physical therapy for the joint
      manifestations of this disorder.
- name: Joint-Protective Activity Modification
  description: >
    High-impact activity (for example jogging) and obesity should be avoided
    because of the intrinsically abnormal joint cartilage and the progressive
    degenerative course.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:21882400
    reference_title: "Chondrodysplasia with Congenital Joint Dislocations, CHST3-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Activities with a high impact on joints
      (e.g., jogging) and obesity.
    explanation: >-
      GeneReviews Agents/Circumstances to Avoid recommendation.
- name: Multidisciplinary Surveillance
  description: >
    Ongoing joint and spine evaluation by an orthopedist experienced in skeletal
    dysplasia, radiographs as recommended, cardiology follow-up with periodic
    echocardiography, and annual dental review.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:

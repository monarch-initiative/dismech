- name: Genetic Counseling
  description: >
    Autosomal recessive recurrence counseling (25% affected, 50% carrier, 25%
    unaffected non-carrier per pregnancy for heterozygous parents), carrier
    testing for at-risk relatives, and prenatal or preimplantation genetic
    testing once the familial CHST3 variants are known.
  therapeutic_modality: OTHER
  treatment_term:

      label: Supportive Care
  evidence:
  - reference: PMID:21882400
    reference_title: "Chondrodysplasia with Congenital Joint Dislocations, CHST3-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical joint and spine evaluation with orthopedist with experience in

name: CHST3-Related Skeletal Dysplasia
creation_date: '2026-08-01T06:20:00Z'
category: Mendelian
description: >
  CHST3-related skeletal dysplasia (chondrodysplasia with congenital joint
  dislocations, CHST3-related; spondyloepiphyseal dysplasia with congenital
  joint dislocations, SEDCJD) is an autosomal recessive disorder of cartilage
  proteoglycan sulfation caused by biallelic loss-of-function variants in
  CHST3, which encodes carbohydrate sulfotransferase 3 (chondroitin
  6-O-sulfotransferase-1, C6ST-1). C6ST-1 is a Golgi enzyme that transfers
  sulfate from PAPS to the C-6 position of N-acetylgalactosamine in chondroitin.
  Its loss produces a generalized, cartilage-relevant defect of chondroitin
  sulfate 6-O-sulfation with compensatory 4-O-sulfation, altering the physical
  and signalling properties of proteoglycans in growth-plate, epiphyseal,
  articular and vertebral cartilage. The clinical result is short stature of
  prenatal onset, congenital dislocation of the large joints (knees, hips and
  radial heads), club feet, limitation of range of motion of all large joints,
  and kyphosis or kyphoscoliosis that develops in childhood and progresses.
  Minor heart valve dysplasia occurs in a minority; intellect and vision are
  normal. Three historically separate diagnoses — autosomal recessive Larsen
  syndrome, humero-spinal dysostosis, and spondyloepiphyseal dysplasia Omani
  type — were unified by molecular analysis and are now recognized as one
  CHST3 phenotypic spectrum, distinct from FLNB-associated dominant Larsen
  syndrome.
synonyms:
- Chondrodysplasia with congenital joint dislocations, CHST3-related
- Spondyloepiphyseal dysplasia with congenital joint dislocations
- SEDCJD
- Chondrodysplasia with multiple dislocations
- Humero-spinal dysostosis
- Larsen syndrome, autosomal recessive type
- Spondyloepiphyseal dysplasia, Omani type
- CHST3 deficiency

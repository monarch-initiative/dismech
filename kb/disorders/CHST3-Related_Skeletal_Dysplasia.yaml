inheritance:
- name: Autosomal Recessive
  description: >
    Biallelic (homozygous or compound heterozygous) CHST3 variants are required;
    heterozygous carriers are unaffected. Consanguinity is a frequent
    ascertainment context, and homozygous variants predominate in reported
    series. Expressivity is variable, including intrafamilial variability
    between siblings carrying the same homozygous CHST3 genotype.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:21882400
    reference_title: "Chondrodysplasia with Congenital Joint Dislocations, CHST3-Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CDCJD-CHST3 is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews states the mode of inheritance directly.
  - reference: PMID:20830804
    reference_title: "Phenotypic features of carbohydrate sulfotransferase 3 (CHST3) deficiency in 24 patients: congenital dislocations and vertebral changes as principal diagnostic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-four different CHST3 mutations were identified; 16 patients had
      homozygous mutations.
    explanation: >-
      Predominance of homozygous genotypes in a 24-patient series is consistent
      with recessive inheritance, largely in consanguineous families.
  - reference: PMID:23918704
    reference_title: "Two Somali half-siblings with CHST3-related chondrodysplasia illustrating the phenotypic spectrum and intrafamilial variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report of a Somali family with CHST3-related chondrodysplasia
      illustrates the intrafamilial variability in phenotypic expression of this
      rare disorder.
    explanation: >-
      Documents variable expressivity between relatives sharing the same
      genotype.
classifications:
  isds_skeletal_category:
  - classification_value: sulphation_disorders
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 4 "Sulphation
      disorders group"; listed as "Chondrodysplasia with congenital joint
      dislocations, CHST3 type (recessive Larsen syndrome)".
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No validated prevalence, incidence or carrier-frequency estimate exists.
    Published experience consists of small series; the largest to date describe
    24 patients in 23 families (Unger 2010) and 14 patients in 11 Egyptian
    families (Otaify 2023). The 2010 series explicitly notes the condition is
    under-recognized rather than quantifying it. Orphanet epidemiology
    (ORPHA:263463) was not cited because the pinned Orphadata snapshot could not
    be verified against its manifest checksum at curation time.
  evidence:
  - reference: PMID:20830804
    reference_title: "Phenotypic features of carbohydrate sulfotransferase 3 (CHST3) deficiency in 24 patients: congenital dislocations and vertebral changes as principal diagnostic features."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of CHST3 deficiency seems to be higher than assumed so far.
    explanation: >-
      Supports an ultra-rare but under-ascertained disorder; it does not provide
      a numeric rate, so only the qualitative class is asserted.
genetic:
- name: CHST3
  gene_term:
    preferred_term: CHST3
    term:
      id: hgnc:1971
      label: CHST3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    CHST3 (10q22.1, NM_004273.5) encodes carbohydrate sulfotransferase 3 /
    chondroitin 6-O-sulfotransferase-1, a Golgi type II membrane
    sulfotransferase. Reported pathogenic alleles span missense, nonsense,
    frameshift and splice-site classes and cluster in the sulfotransferase
    domain; missense alleles affecting the PAPS-binding site abolish activity,
    while some missense alleles are hypomorphic.
  evidence:
  - reference: PMID:15215498
    reference_title: "Loss of chondroitin 6-O-sulfotransferase-1 function results in severe human chondrodysplasia with progressive spinal involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced candidate genes from the region and identified a missense
      mutation in the chondroitin 6-O-sulfotransferase (C6ST-1) gene (CHST3)
    explanation: >-
      Original gene identification by linkage mapping in two consanguineous
      Omani families.
  - reference: PMID:18513679
    reference_title: "Congenital joint dislocations caused by carbohydrate sulfotransferase 3 deficiency in recessive Larsen syndrome and humero-spinal dysostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report eight CHST3 mutations in six unrelated individuals who presented
      at birth with congenital joint dislocations.
    explanation: >-
      Establishes CHST3 as the cause of the congenital-dislocation phenotype in
      unrelated probands previously labelled recessive Larsen syndrome or
      humero-spinal dysostosis.
  - reference: PMID:37876363
    reference_title: "Indian patients with CHST3-related chondrodysplasia with congenital joint dislocations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All these variants are located on sulfotransferase domain of CHST3 protein
      and were classified as pathogenic/ likely pathogenic.
    explanation: >-
      Supports clustering of pathogenic alleles in the sulfotransferase domain.
  variants:
  - name: "CHST3 p.Arg304Gln (R304Q)"
    description: >-
      Homozygous missense variant in the conserved 3'-phosphoadenosine
      5'-phosphosulfate (PAPS) cosubstrate binding site, identified in two large
      consanguineous Omani families with spondyloepiphyseal dysplasia Omani
      type. Recombinant enzyme assays show complete loss of C6ST-1 activity.
    gene:
      preferred_term: CHST3
      term:
        id: hgnc:1971
        label: CHST3
    evidence:
    - reference: PMID:15215498
      reference_title: "Loss of chondroitin 6-O-sulfotransferase-1 function results in severe human chondrodysplasia with progressive spinal involvement."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We used recombinant C6ST-1 to show that the identified missense mutation
        completely abolishes C6ST-1 activity.
      explanation: >-
        Functional assay demonstrating that R304Q is a complete loss-of-function
        allele.
  - name: "CHST3 p.Thr141Met (T141M)"
    description: >-
      Homozygous missense variant in exon 3 identified in a Turkish family with
      Omani-type spondyloepiphyseal dysplasia and cardiac valve involvement. In
      contrast to R304Q this allele is hypomorphic, retaining roughly a quarter
      of wild-type sulfotransferase activity.
    gene:
      preferred_term: CHST3
      term:
        id: hgnc:1971
        label: CHST3
    evidence:
    - reference: PMID:19320654
      reference_title: "Omani-type spondyloepiphyseal dysplasia with cardiac involvement caused by a missense mutation in CHST3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using recombinant C6ST-1, we showed that the identified missense
        mutation results in a reduction of C6ST-1 activity to 24-29% of the wild
        type protein.
      explanation: >-
        Quantifies residual enzyme activity, documenting a hypomorphic allele
        class distinct from complete loss of function.
  - name: "CHST3 c.776T>C"
    description: >-
      Recurrent missense variant reported predominantly in Turkish patients,
      suggesting a population-specific recurrent or founder allele.
    gene:
      preferred_term: CHST3
      term:
        id: hgnc:1971
        label: CHST3
    evidence:
    - reference: PMID:32639237
      reference_title: "Recurrent c.776T>C mutation in CHST3 with four other novel mutations and a literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Biallelic CHST3 c.776T>C mutations are most frequent mutation in CHST3
        and have been reported predominantly in Turkish patients
      explanation: >-
        Documents a recurrent allele with a genotype-ethnicity association.
pathophysiology:
- name: Biallelic CHST3 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic pathogenic CHST3 variants abolish or severely reduce the activity
    of carbohydrate sulfotransferase 3 (chondroitin 6-O-sulfotransferase-1), a
    Golgi enzyme that transfers sulfate from PAPS to the C-6 position of
    N-acetylgalactosamine residues in chondroitin. Missense alleles in the
    PAPS-binding site abolish activity outright; other alleles are hypomorphic
    and retain partial activity, which may contribute to the observed
    phenotypic breadth.
  genes:
  - preferred_term: CHST3
    term:
      id: hgnc:1971
      label: CHST3
  molecular_functions:
  - preferred_term: chondroitin 6-O-sulfotransferase-1 activity
    term:
      id: GO:0008459
      label: chondroitin 6-sulfotransferase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:15215498
    reference_title: "Loss of chondroitin 6-O-sulfotransferase-1 function results in severe human chondrodysplasia with progressive spinal involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We used recombinant C6ST-1 to show that the identified missense mutation
      completely abolishes C6ST-1 activity.
    explanation: >-
      Direct enzymatic demonstration that the disease allele eliminates C6ST-1
      catalytic function.
  - reference: PMID:16720579
    reference_title: "N-linked oligosaccharides on chondroitin 6-sulfotransferase-1 are required for production of the active enzyme, Golgi localization, and sulfotransferase activity toward keratan sulfate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Wild-type recombinant C6ST-1 showed a typical Golgi localization
    explanation: >-
      Establishes the Golgi as the subcellular compartment in which C6ST-1 acts.
  downstream:
  - target: Deficient Chondroitin 6-O-Sulfation
    description: >-
      Loss of enzyme activity directly removes the 6-O-sulfation step of
      chondroitin sulfate chain maturation.
    causal_link_type: DIRECT
- name: Deficient Chondroitin 6-O-Sulfation
  biological_scale: MOLECULAR
  description: >
    Absent or reduced C6ST-1 activity produces a specific but generalized defect
    of chondroitin sulfate chain sulfation: 6-O-sulfated disaccharides are
    markedly depleted while 4-O-sulfated disaccharides are relatively increased,
    with appearance of a disulfated 4,6-species that is undetectable in
    controls. The defect is demonstrable in patient dermal fibroblasts and in
    urine, and distinguishes CHST3 deficiency from the global undersulfation of
    SLC26A2 (DTDST) deficiency.
  chemical_entities:
  - preferred_term: chondroitin sulfate
    term:
      id: CHEBI:37397
      label: chondroitin sulfate
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: chondroitin sulfate proteoglycan biosynthesis
    term:
      id: GO:0050650
      label: chondroitin sulfate proteoglycan biosynthetic process
    modifier: ABNORMAL
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:18513679
    reference_title: "Congenital joint dislocations caused by carbohydrate sulfotransferase 3 deficiency in recessive Larsen syndrome and humero-spinal dysostosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of chondroitin sulfate proteoglycans in dermal fibroblasts showed
      markedly decreased 6-O-sulfation but enhanced 4-O-sulfation, confirming
      functional impairment of CHST3 and distinguishing them from diastrophic
      dysplasia sulphate transporter (DTDST)-deficient cells.
    explanation: >-
      Documents the reciprocal 6-O-/4-O-sulfation shift and its diagnostic
      specificity versus DTDST deficiency.
  - reference: PMID:15215498
    reference_title: "Loss of chondroitin 6-O-sulfotransferase-1 function results in severe human chondrodysplasia with progressive spinal involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that the mutation in CHST3 described here causes a
      specific but generalized defect of CS chain sulfation resulting in
      chondrodysplasia with major involvement of the spine.
    explanation: >-
      States the causal link from the sulfation defect to chondrodysplasia with
      predominant spinal involvement.
  downstream:
  - target: Altered Cartilage Proteoglycan Matrix
    description: >-
      Undersulfated chondroitin sulfate chains alter the charge density and
      interaction profile of cartilage proteoglycans.
    causal_link_type: DIRECT
- name: Altered Cartilage Proteoglycan Matrix
  biological_scale: CELLULAR
  description: >
    Chondroitin sulfate chains carried on cartilage proteoglycans determine the
    fixed charge density, hydration and growth-factor-binding behaviour of the
    extracellular matrix. Loss of 6-O-sulfation alters these physical and
    signalling properties, degrading the ability of chondrocytes to build a
    competent proteoglycan-rich matrix in hyaline, articular, epiphyseal and
    vertebral cartilage.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  chemical_entities:
  - preferred_term: chondroitin sulfate proteoglycan
    term:
      id: CHEBI:26349
      label: chondroitin sulfate proteoglycan
    modifier: ABNORMAL
  locations:
  - preferred_term: articular cartilage
    term:
      id: UBERON:0010996
      label: articular cartilage of joint
  evidence:
  - reference: PMID:18698629
    reference_title: "Spondyloepiphyseal dysplasia, Omani type: further definition of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This enzyme mediates the sulfation of proteoglycans, particularly
      chondroitin sulfate (CS), in the extracellular matrix of cartilage.
    explanation: >-
      Places the enzymatic defect in the cartilage extracellular matrix
      compartment.
  - reference: PMID:37545696
    reference_title: "Carbohydrate sulfotransferases: a review of emerging diagnostic and prognostic applications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Carbohydrate sulfotransferases (CHST) catalyse the biosynthesis of
      proteoglycans that enable physical interactions and signalling between
      different neighbouring cells in physiological and pathological states.
    explanation: >-
      Review evidence that CHST-dependent proteoglycan sulfation underlies
      cell-matrix physical interaction and signalling.
  downstream:
  - target: Growth Plate and Epiphyseal Cartilage Dysplasia
    description: >-
      A defective proteoglycan matrix impairs the organization and biomechanical
      competence of growth-plate and epiphyseal cartilage.
    causal_link_type: DIRECT
- name: Growth Plate and Epiphyseal Cartilage Dysplasia
  biological_scale: TISSUE
  description: >
    Impaired matrix assembly in growth-plate, epiphyseal and vertebral cartilage
    produces prenatal-onset growth deficiency, epiphyseal dysplasia, flared
    metaphyses, and characteristic vertebral changes (lumbar vertebral clefting
    and widened interpedicular distances early; platyspondyly and progressive
    spinal deformity later). Radiographic vertebral change is the most useful
    diagnostic clue.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage development
    term:
      id: GO:0003417
      label: growth plate cartilage development
    modifier: ABNORMAL
  locations:
  - preferred_term: growth plate cartilage
    term:
      id: UBERON:0004129
      label: growth plate cartilage
  evidence:
  - reference: PMID:20830804
    reference_title: "Phenotypic features of carbohydrate sulfotransferase 3 (CHST3) deficiency in 24 patients: congenital dislocations and vertebral changes as principal diagnostic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most useful radiographic clues were the changes of the lumbar
      vertebrae.
    explanation: >-
      Identifies vertebral cartilage/bone change as the cardinal radiographic
      manifestation of the underlying cartilage dysplasia.
  - reference: PMID:37183573
    reference_title: "CHST3-related skeletal dysplasia in 14 patients: Identification of 8 novel variants and further expansion of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had spondyloepiphyseal changes that were progressive with age
    explanation: >-
      Documents progressive spondyloepiphyseal involvement in a 14-patient
      series.
  downstream:
  - target: Primary Joint Dysplasia with Congenital Dislocation
    description: >-
      Malformed articular surfaces, rather than simple ligamentous laxity,
      produce dislocation of the large joints at birth.
    causal_link_type: DIRECT
  - target: Progressive Articular and Spinal Degeneration
    description: >-
      An intrinsically abnormal cartilage matrix degenerates under normal
      mechanical loading over years, with abnormal joint alignment adding
      chronic aberrant loading.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Chronic aberrant mechanical loading of dysplastic, undersulfated articular and intervertebral cartilage
- name: Primary Joint Dysplasia with Congenital Dislocation
  biological_scale: TISSUE
  description: >
    Dislocation of the knees, hips and radial heads is present at birth and is
    interpreted as primary dysplasia of the joint structures themselves rather
    than generalized ligamentous laxity — the joint surfaces and distal humeri
    are radiographically malformed (bifid distal humerus with radial head
    subluxation). Club feet accompany the dislocations.
  locations:
  - preferred_term: knee joint
    term:
      id: UBERON:0001485
      label: knee joint
  evidence:
  - reference: PMID:18513679
    reference_title: "Congenital joint dislocations caused by carbohydrate sulfotransferase 3 deficiency in recessive Larsen syndrome and humero-spinal dysostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      their clinical features included congenital dislocation of the knees,
      elbow joint dysplasia with subluxation and limited extension, hip
      dysplasia or dislocation, clubfoot, short stature, and kyphoscoliosis
      developing in late childhood
    explanation: >-
      Describes the congenital dislocation pattern together with the elbow joint
      dysplasia that indicates a structural rather than purely ligamentous
      lesion.
  - reference: PMID:37183573
    reference_title: "CHST3-related skeletal dysplasia in 14 patients: Identification of 8 novel variants and further expansion of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bifid distal ends of humeri which can be considered a diagnostic key in
      patients with CHST3 variants
    explanation: >-
      Structural malformation of the distal humerus supports primary joint
      dysplasia as the basis of the radial-head dislocation.
- name: Progressive Articular and Spinal Degeneration
  biological_scale: ORGANISM
  description: >
    Beyond the congenital malformation, the abnormal matrix degenerates
    progressively: joint pain, premature arthrosis, contractures and increasing
    limitation of range of motion accumulate, and kyphosis or kyphoscoliosis
    develops in late childhood and worsens. This progressive arm, not the
    neonatal dislocations, drives most long-term disability.
  evidence:
  - reference: PMID:20830804
    reference_title: "Phenotypic features of carbohydrate sulfotransferase 3 (CHST3) deficiency in 24 patients: congenital dislocations and vertebral changes as principal diagnostic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      short stature, and progressive kyphosis developing in late childhood
    explanation: >-
      Documents the progressive spinal course after the congenital presentation.
  - reference: PMID:36729370
    reference_title: "A Chinese case of CHST3-related skeletal dysplasia and a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive joint pain and movement restriction are the main
      characteristics of CHST3-related skeletal dysplasia.
    explanation: >-
      Systematic review of published cases identifies progressive arthropathy as
      the dominant clinical feature.
  - reference: PMID:19320654
    reference_title: "Omani-type spondyloepiphyseal dysplasia with cardiac involvement caused by a missense mutation in CHST3."

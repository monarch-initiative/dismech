discussions:
- discussion_id: chst3_sulfation_to_joint_dysplasia_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Growth Plate and Epiphyseal Cartilage Dysplasia
  prompt: >-
    How does loss of chondroitin 6-O-sulfation cause dysplasia of the joint
    surface and growth plate, rather than merely undersulfated matrix?
  rationale: >-
    The biochemical lesion (6-O-sulfation loss with compensatory 4-O-sulfation)
    and the clinical outcome (primary joint dysplasia with congenital
    dislocation) are both well documented, but the intervening cell-biological
    step is not. No CHST3-specific growth-plate study, patient-derived
    chondrocyte or cartilage organoid model, or quantitative Chst3-null skeletal
    phenotype has been published; all direct functional evidence comes from
    dermal fibroblasts and recombinant enzyme assays, which cannot reproduce the
    biomechanical environment of cartilage.
  proposed_experiments:
  - experiment_id: chst3_mouse_growth_plate_phenotyping
    name: Quantitative skeletal phenotyping of Chst3-null and knock-in mice
    description: >-
      Quantitative growth-plate, epiphyseal, articular and intervertebral-disc
      phenotyping of Chst3-null and patient-variant knock-in mice, including
      disaccharide composition analysis of cartilage.
  - experiment_id: chst3_ipsc_chondrocyte_organoid
    name: Patient iPSC-derived chondrocytes and cartilage organoids
    description: >-
      Differentiate patient iPSCs into chondrocytes and cartilage organoids and
      measure chondroitin disaccharide composition, matrix assembly and matrix
      mechanics, with wild-type CHST3 rescue as the causal control.
- discussion_id: chst3_natural_history_epidemiology_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Progressive Articular and Spinal Degeneration
  prompt: >-
    What is the natural history, prevalence and genotype-phenotype structure of
    CHST3-related skeletal dysplasia at population scale?
  rationale: >-
    Published evidence consists of small retrospective series. No prospective
    natural-history registry, validated phenotype frequency, prevalence or
    carrier-frequency estimate, standardized functional endpoint, or
    patient-reported outcome measure exists, and a systematic review of the
    published cases found no apparent genotype-phenotype correlation despite the
    coexistence of null and hypomorphic alleles.
  proposed_experiments:
  - experiment_id: chst3_natural_history_registry
    name: Prospective multicentre CHST3 natural-history registry
    description: >-
      Enroll molecularly confirmed patients with standardized radiographic,
      functional and patient-reported endpoints to derive phenotype frequencies,
      progression rates and genotype-phenotype relationships.
  - experiment_id: chst3_carrier_frequency_estimate
    name: Population carrier-frequency estimation for pathogenic CHST3 alleles
    description: >-
      Estimate cumulative pathogenic CHST3 allele frequency from large
      population sequencing datasets to derive an expected birth prevalence.
  evidence:
  - reference: PMID:36729370
    reference_title: "A Chinese case of CHST3-related skeletal dysplasia and a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no apparent genotype-phenotype correlation in this disorder.
    explanation: >-
      Systematic review finding that motivates the genotype-phenotype arm of
      this knowledge gap.
notes: >
  Curation scope notes. (1) The three historical eponymic diagnoses (autosomal
  recessive Larsen syndrome, humero-spinal dysostosis, spondyloepiphyseal
  dysplasia Omani type) are modeled as synonyms of a single spectrum rather than
  as subtypes, following Hermanns 2008 (PMID:18513679) and Unger 2010
  (PMID:20830804), which showed the clinical features are similar across the
  historical labels and that they form one phenotypic spectrum. (2)
  Craniosynostosis has been reported in association with CHST3-related skeletal
  dysplasia (PMID:24300290) but that report is indexed in PubMed without an
  abstract, so no snippet-verifiable evidence item could be created and the
  phenotype is intentionally omitted. (3) Orphanet (ORPHA:263463) epidemiology
  was not cited because the pinned Orphadata snapshot failed its manifest
  checksum at curation time; regenerating the cache would have introduced
  unverified drift. (4) Progressive intervertebral disc degeneration, vertebral
  fusion, lumbar vertebral clefting and widened interpedicular distances are
  described in full texts and in the deep-research report but not in any
  abstract that could be quoted, so they appear in prose only. (5) CHST3 also
  sulfates keratan sulfate in vitro (PMID:16720579); no keratan sulfate
  phenotype has been established in patients, so this is not modeled as a
  disease mechanism.

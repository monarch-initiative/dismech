    reference_title: "History and prospects of Nagashima-type palmoplantar keratosis, the most common palmoplantar keratoderma in east Asian populations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

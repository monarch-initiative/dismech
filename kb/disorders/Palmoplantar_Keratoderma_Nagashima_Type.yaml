    explanation: Onset in the first year of life.
  - reference: PMID:27666198
    reference_title: "Nagashima-type palmoplantar keratosis in a Chinese Han population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age of onset was ~3 months (Table I)."
    explanation: Mean onset age in a Chinese series.
- phase: Stable lifelong course
  notes: The hyperkeratosis stays mild and does not progress, in contrast to mal de Meleda.
  evidence:
  - reference: PMID:24207119

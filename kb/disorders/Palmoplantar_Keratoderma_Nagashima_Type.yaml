discussions:
- discussion_id: nppk_hyperkeratosis_erythema_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Diffuse palmoplantar hyperkeratosis
  - phenotypes#Palmoplantar erythema
  - pathophysiology#Plantar Bacterial Dysbiosis
  prompt: >-
    How does the SERPINB7-legumain barrier defect produce palmoplantar redness
    and hyperkeratosis, and what drives the plantar dysbiosis?
  rationale: >-
    The barrier defect explains the water sign, but no study connects it to
    the redness and hyperkeratosis that define the disease, or to the odor and
    fungal susceptibility; a 2025 review states these mechanisms remain
    poorly understood (PMID:39749860). The legumain work is done on mouse
    body skin and cultured keratinocytes, so whether the same steps occur in
    palmoplantar epidermis is also open. Hyperhidrosis and the barrier defect
    are both candidate causes of the dysbiosis, and neither has been tested.
  proposed_experiments:
  - experiment_id: nppk_lesional_legumain_and_glycosylation
    name: Legumain activity and O-GalNAc glycosylation in patient palmoplantar skin
    description: >-
      Measure legumain activity, O-GalNAc glycosylation and tight junction
      proteins in lesional palmoplantar biopsies from NPPK patients and
      site-matched controls, before and after topical legumain inhibition
      where available.
    would_support:
    - pathophysiology#Legumain Overactivation
    - pathophysiology#Impaired Keratinocyte Protein O-GalNAc Glycosylation
    supporting_outcome:
    - Lesional skin shows raised legumain activity and reduced O-GalNAc glycosylation compared with control palmoplantar skin.
    refuting_outcome:
    - Legumain activity and glycosylation are normal in lesional palmoplantar skin.
- discussion_id: nppk_differentiation_model_patient_conflict
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Reduced Epidermal Differentiation
  prompt: >-
    SERPINB7 loss reduces differentiation in a three-dimensional human
    epidermal model, yet patient skin shows no major differentiation defect.
    Is reduced differentiation part of NPPK in patients?
  rationale: >-
    The model result (PMID:38909841) and the patient staining for loricrin,
    involucrin and filaggrin (PMID:24207119) disagree. If differentiation is
    intact in patients, the barrier defect arises through the legumain,
    glycosylation and cytoskeletal steps alone, and the differentiation node
    describes the culture system rather than the disease. The patient study
    examined three markers by immunostaining, so a subtle or region-specific
    defect is not excluded.
  proposed_experiments:
  - experiment_id: nppk_lesional_differentiation_profiling
    name: Quantitative differentiation profiling of lesional palmoplantar skin
    description: >-

    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperkeratosis in NPPK is mild and nonprogressive, differentiating NPPK clinically from Mal de Meleda."
    explanation: The course is nonprogressive.
pathophysiology:
- name: Biallelic SERPINB7 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift and splice variants, including the East Asian founder
    c.796C>T (p.Arg266*) and a Chinese deep intronic founder variant that
    inserts a pseudo-exon, all truncate SERPINB7 before its reactive site.
  genes:
  - preferred_term: SERPINB7
    term:
      id: hgnc:13902
      label: SERPINB7
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:24207119
    reference_title: "Mutations in SERPINB7, encoding a member of the serine protease inhibitor superfamily, cause Nagashima-type palmoplantar keratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a major causative mutation of c.796C>T (p.Arg266(∗)) as a founder mutation in Japanese and Chinese populations."
    explanation: Identifies the founder nonsense variant.
  - reference: PMID:40579253
    reference_title: "A deep intronic founder variant in the SERPINB7 gene causing aberrant splicing is a potential therapeutic target for Nagashima-type palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A deep intronic SERPINB7 variant was identified in six NPPK patients, leading to pseudo-exon inclusion and the production of a truncated, dysfunctional SERPINB7 protein."
    explanation: A second class of truncating variant.
  downstream:
  - target: Loss of SERPINB7 Protease Inhibitory Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24207119
      reference_title: "Mutations in SERPINB7, encoding a member of the serine protease inhibitor superfamily, cause Nagashima-type palmoplantar keratosis."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: "All of the identified mutants are predicted to cause premature termination upstream of the reactive site, which inhibits the proteases, suggesting a complete loss of the protease inhibitory activity of SERPINB7 in NPPK skin."
      explanation: The loss of inhibitory activity is inferred from where the variants truncate the protein, not measured.

genetic:
- name: SERPINB7
  gene_term:
    preferred_term: SERPINB7
    term:
      id: hgnc:13902
      label: SERPINB7
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    SERPINB7 (18q21.33) encodes megsin, a clade B intracellular serpin. Several
    founder alleles circulate in East Asia; in a Chinese cohort of 380 tested
    patients with palmoplantar keratoderma, 80% carried a SERPINB7 hotspot
    variant.
  evidence:
  - reference: PMID:24207119
    reference_title: "Mutations in SERPINB7, encoding a member of the serine protease inhibitor superfamily, cause Nagashima-type palmoplantar keratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome and/or Sanger sequencing analyses of 13 unrelated NPPK individuals and identified biallelic putative loss-of-function mutations in SERPINB7, which encodes a cytoplasmic member of the serine protease inhibitor superfamily."
    explanation: Identification of the causal gene.
  - reference: PMID:42384829
    reference_title: "Large-Scale Cohort Study on the Genetic and Phenotypic Findings of Palmoplantar Keratodermas in the Chinese Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 80% (304/380) patients, hotspot variants in SERPINB7 were identified, with c.796C>T (77%) and c.522_523insT (16%) being the most frequent."
    explanation: SERPINB7 explains most hereditary palmoplantar keratoderma in a large Chinese cohort.
  variants:

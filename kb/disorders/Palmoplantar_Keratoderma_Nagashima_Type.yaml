inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic SERPINB7 variants. Because founder
    alleles are common in East Asia, an affected parent can have an affected
    child with a carrier partner, giving a pseudodominant pattern.
  evidence:
  - reference: PMID:24773080
    reference_title: "Highly prevalent SERPINB7 founder mutation causes pseudodominant inheritance pattern in Nagashima-type palmoplantar keratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all the families, the NPPK trait was inherited in an autosomal recessive manner; in one of the families, there was pseudodominant inheritance, which had not been described in NPPK."
    explanation: Recessive inheritance in ten Japanese families, with one pseudodominant pedigree.
  - reference: PMID:24207119
    reference_title: "Mutations in SERPINB7, encoding a member of the serine protease inhibitor superfamily, cause Nagashima-type palmoplantar keratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed whole-exome and/or Sanger sequencing analyses of 13 unrelated NPPK individuals and identified biallelic putative loss-of-function mutations in SERPINB7, which encodes a cytoplasmic member of the serine protease inhibitor superfamily."
    explanation: Biallelic variants in all 13 index patients.

treatments:
- name: Topical gentamicin ointment
  description: >-
    Aminoglycoside ointment applied to palms and soles, intended to make
    ribosomes read through premature stop codons such as p.Arg266* and
    restore full-length SERPINB7. In a double-blind, vehicle-controlled
    half-side study it improved hyperkeratosis, desquamation and quality of
    life but not erythema. In an open-label pediatric half-side study it also
    improved erythema and maceration, but not hyperhidrosis or odor.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  target_phenotypes:
  - preferred_term: Diffuse palmoplantar hyperkeratosis
    term:
      id: HP:0007447
      label: Diffuse palmoplantar hyperkeratosis
  target_mechanisms:
  - target: Biallelic SERPINB7 Loss-of-Function Variants
    treatment_effect: BYPASSES
    description: Readthrough of the premature stop codon is meant to bypass the nonsense allele and restore protein.
    evidence:
    - reference: PMID:33554268
      reference_title: "Effect of Gentamicin Ointment in Patients with Nagashima-type Palmoplantar Keratosis: A Double-blind Vehicle-controlled Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Nonsense suppression therapy has been studied for more than 20 years, and aims to suppress the termination of translation caused by premature termination codons (PTCs) and restore protein function (11)."
      explanation: States the rationale for readthrough therapy; restoration of SERPINB7 in patient skin was not measured.
  evidence:
  - reference: PMID:33554268
    reference_title: "Effect of Gentamicin Ointment in Patients with Nagashima-type Palmoplantar Keratosis: A Double-blind Vehicle-controlled Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with the control vehicle, gentamicin ointment significantly improved hyperkeratosis, desquamation, and quality of life, based on VAS and DLQI scores."
    explanation: Controlled evidence of benefit on hyperkeratosis.
  - reference: PMID:33554268
    reference_title: "Effect of Gentamicin Ointment in Patients with Nagashima-type Palmoplantar Keratosis: A Double-blind Vehicle-controlled Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No difference was found in the effect on erythema between gentamicin and vehicle."
    explanation: No effect on erythema in the adult trial.
  - reference: PMID:37736370
    reference_title: "Application of topical gentamicin ointment in the treatment of Nagashima-type palmoplantar keratosis in children with a nonsense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral comparisons showed that gentamicin ointment significantly improved hyperkeratosis, erythema, maceration, and desquamation, but not hyperhidrosis and odor, indicating that gentamicin ointment is a promising therapeutic option for children with NPPK."
    explanation: Benefit in children, without effect on hyperhidrosis or odor.

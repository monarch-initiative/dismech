genetic:
- name: FH
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: FH
    term:
      id: hgnc:3700
      label: FH
  notes: >-
    Fumaric aciduria is caused by biallelic (homozygous or compound
    heterozygous) pathogenic variants in FH, which encodes fumarate hydratase.
    No ClinGen Gene-Disease Validity (CGGV) record for the FH-fumaric aciduria
    pair was present in the local structured cache at curation time, so no
    gene_disease_validity assertion is recorded.
  variants:
  - name: A308T
    description: >-
      Missense variant (p.Ala308Thr) at the fumarase intersubunit interface,
      associated with fumarate hydratase deficiency. Biochemical characterization
      showed severely diminished activity due to defective oligomerization, with
      the enzyme forming homodimers rather than homotetramers.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29456767
      reference_title: Biochemical Characterization of Two Clinically-Relevant Human Fumarase Variants Defective for Oligomerization.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We conclude that A308T and H318Y render human fumarase enzymatically
        inactive via defective oligomerization.
      explanation: >-
        A308T, an FHD-associated variant, inactivates fumarase via defective
        oligomerization.
  - name: c.1431_1433dupAAA
    description: >-
      Recurrent in-frame duplication reported in fumaric aciduria; also carried
      in heterozygous form by a parent who had cutaneous leiomyoma, illustrating
      the heterozygote tumor-predisposition boundary.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23612258
      reference_title: Mild clinical presentation and prolonged survival of a patient with fumarase deficiency due to the combination of a known and a novel mutation in FH gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Interestingly his father who was heterozygous for the c.1431_1433dupAAA
        mutation in the FH gene had cutaneous leiomyoma.
      explanation: >-
        Documents the c.1431_1433dupAAA variant and the heterozygous-carrier
        leiomyoma link.
  evidence:
  - reference: PMID:21560188
    reference_title: Clinical and biochemical heterogeneity associated with fumarase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fumarase deficiency (FD), caused by biallelic alteration of the Fumarase
      Hydratase gene (FH), and a rare metabolic disorder that affects the Krebs
      cycle, causes severe neurological impairment and fumaric aciduria.
    explanation: >-
      Establishes FH as the causal gene, altered biallelically.

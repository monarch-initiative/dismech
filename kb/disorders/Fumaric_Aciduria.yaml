    Human and mouse fumarate-hydratase-deficient cell lines used to dissect the
    effect of FH loss on mitochondrial metabolism, showing decreased respiration
    and combined respiratory chain complex I and II dysfunction.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: >-
    The source study uses both human and mouse FH-deficient cell lines. Only the
    human organism (NCBITaxon:9606) is bound here; the mouse component is recorded
    in the description and the modeled-mechanism limitations rather than as a
    second organism binding.
  publication: PMID:29069586
  modeled_mechanisms:
  - target: Impaired Mitochondrial Respiration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      FH-deficient cell lines reproduce decreased respiration and combined
      respiratory chain dysfunction downstream of fumarate accumulation.
    limitations: >-
      The models are cancer-derived and mouse cell lines studied in the context
      of FH-deficient tumorigenesis rather than the neuronal tissue affected in
      the recessive neurometabolic disease, so translational fidelity to the
      developing human brain is uncertain.
    evidence:
    - reference: PMID:29069586
      reference_title: Fumarate Hydratase Loss Causes Combined Respiratory Chain Defects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that human and mouse FH-deficient cells exhibit decreased
        respiration, accompanied by a varying degree of dysfunction of
        respiratory chain (RC) complex I and II.
      explanation: >-
        Establishes the cell models as informative for the impaired-respiration
        node.
  evidence:
  - reference: PMID:29069586
    reference_title: Fumarate Hydratase Loss Causes Combined Respiratory Chain Defects.
    supports: SUPPORT
    evidence_source: IN_VITRO

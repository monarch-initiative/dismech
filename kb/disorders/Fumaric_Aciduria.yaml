    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of the Krebs
      (tricarboxylic acid) cycle". Fumarate hydratase deficiency is a defect of a
      constituent TCA-cycle enzyme.

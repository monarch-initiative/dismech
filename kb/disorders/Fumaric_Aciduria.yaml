discussions:
- discussion_id: fumarate_oncometabolite_vs_energy_deficit
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the oncometabolite activity of accumulated fumarate (inhibition of
    alpha-ketoglutarate-dependent dioxygenases, pseudohypoxia via HIF
    stabilization) contribute to the neurological and developmental phenotype of
    recessive fumaric aciduria, or is the phenotype driven by energy-metabolism
    failure alone?
  attaches_to:
  - pathophysiology#Fumarate Accumulation
  rationale: >-
    Fumarate is a well-established oncometabolite in heterozygous FH-related
    tumorigenesis, but its contribution to the recessive neurometabolic phenotype
    is unresolved. In one study the nuclear translocation of HIF-1alpha in
    patient fibroblasts was similar to controls, arguing against pseudohypoxic
    signaling as the driver in those cells, yet the developing brain was not
    assessed.
  evidence:
  - reference: PMID:21560188
    reference_title: Clinical and biochemical heterogeneity associated with fumarase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nuclear translocation of hypoxia-inducible factor (HIF)-1alpha (HIF1A)
      in cultured fibroblasts was similar to controls.
    explanation: >-
      Normal HIF-1alpha translocation in patient fibroblasts leaves the
      contribution of fumarate's pseudohypoxic activity to the neurological
      phenotype unresolved.
notes: >-
  This entry is the autosomal recessive metabolic disease (fumarate hydratase
  deficiency / fumarase deficiency, MONDO:0011730, OMIM 606812, Orphanet 24),
  curated as a single DISEASE: biallelic loss-of-function FH variants cause
  fumarase deficiency, TCA-cycle interruption, fumarate accumulation and a severe
  neonatal/infantile encephalopathy. It is distinct from Hereditary Leiomyomatosis
  and Renal Cell Cancer (HLRCC, MONDO:0007888), the autosomal dominant FH
  tumor-predisposition syndrome caused by heterozygous FH variants, which has its
  own dismech entry. The two share the FH gene but have separate GeneReviews
  chapters (this recessive disease is covered by the Fumarate Hydratase
  Deficiency chapter, PMID:20301679; HLRCC has its own chapter) and are
  clinically and genetically distinct; the boundary is explicit in the
  literature, where heterozygous relatives of affected children carry an
  increased HLRCC risk. The GeneReviews chapter was used as the mandatory
  phenotype baseline. Dysmorphic facial features and polycythemia are recorded as
  phenotypes but left unconnected in the pathograph because no mechanistic link to
  the energy-metabolism defect is established in the sources.

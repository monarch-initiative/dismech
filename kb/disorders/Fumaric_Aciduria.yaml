name: Fumaric Aciduria
creation_date: "2026-10-16T00:00:00Z"
description: >-
  Fumaric aciduria (fumarate hydratase deficiency, fumarase deficiency) is a rare
  autosomal recessive mitochondrial neurometabolic disorder caused by biallelic
  loss-of-function variants in FH. Deficient fumarate hydratase (fumarase)
  activity interrupts the tricarboxylic acid cycle at the hydration of fumarate
  to L-malate, so fumarate accumulates and is excreted in urine. The dominant
  clinical picture is a severe neonatal and early-infantile encephalopathy with
  poor feeding, poor weight gain, hypotonia, lethargy, seizures, profound
  developmental impairment, dysmorphic facial features, and frequent cerebral
  malformations including polymicrogyria. It is distinct from the autosomal
  dominant FH tumor-predisposition syndrome (hereditary leiomyomatosis and renal
  cell cancer), which is caused by heterozygous FH variants.
category: Metabolic Disorder
categories:
- Inborn Error of Metabolism
- Mitochondrial Disorder
- Organic Aciduria
parents:
- hereditary disease
- metabolic disorder

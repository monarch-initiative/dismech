name: Premature Ovarian Failure 20
creation_date: "2026-10-19T21:06:18Z"
category: Mendelian
synonyms:
- POF20
- MSH4-related primary ovarian insufficiency
- MSH4-related premature ovarian insufficiency
description: >-
  Premature ovarian failure 20 (POF20; OMIM 619938) is an autosomal recessive
  form of primary ovarian insufficiency caused by biallelic loss-of-function
  variants in MSH4 (MutS homolog 4). MSH4 is a meiosis-specific MutS homolog
  that heterodimerizes with MSH5 to form the MutS-gamma complex, which binds and
  stabilizes recombination intermediates during meiotic prophase I, promotes
  homologous chromosome synapsis, and acts with MLH1 at sites that mature into
  crossovers. Reported pathogenic alleles are splice-site, nonsense, frameshift,
  and missense variants, several of which remove or perturb the conserved
  C-terminal ATPase domain (Walker B motif and MutS signature). Biallelic loss
  is thought to cause oocyte meiotic failure and depletion of the ovarian
  follicle pool, presenting as amenorrhea (most often secondary) and
  infertility in 46,XX individuals; milder presentations with diminished
  ovarian reserve and poor oocyte quality have also been reported. Affected
  brothers in the same families have non-obstructive azoospermia with meiotic
  arrest, which MONDO classifies separately as spermatogenic failure 2.
disease_term:
  preferred_term: premature ovarian failure 20
  term:
    id: MONDO:0030975
    label: premature ovarian failure 20
parents:
- Primary Ovarian Insufficiency
- Meiotic Disorder
notes: >-
  Scope: this entry covers the 46,XX ovarian phenotype of biallelic MSH4
  variants, matching MONDO:0030975. The 46,XY phenotype of the same genotype,
  non-obstructive azoospermia with meiotic arrest, is spermatogenic failure 2
  (MONDO:0007161), which is a separate stub in the curation queue and is not
  lumped here. Several families segregate both phenotypes, so the two entries
  share a mechanism (the meiotic_prophase_failure module) and differ in the
  gonadal consequence. A POI patient carrying one heterozygous variant in each
  of MSH4 and MSH5 has been reported (PMID:36793102); that digenic genotype is
  not part of this recessive entry. No POF20-specific prevalence figure was
  found; MSH4 contributes a small fraction of genetically solved POI.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry homozygous or compound-heterozygous MSH4
    variants; heterozygous parents are unaffected.
  evidence:
  - reference: PMID:28541421
    reference_title: "A homozygous donor splice-site mutation in the meiotic gene MSH4 causes primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing of members of a Colombian family affected by POI
      allowed us to identify a novel homozygous donor splice-site mutation in
      the meiotic gene MSH4 (MutS Homolog 4). The variant followed a strict
      mendelian segregation within the family
    explanation: >-
      Homozygous MSH4 variant segregating with POI in the founding family.
  - reference: PMID:38175272
    reference_title: "A novel homozygote nonsense variant of MSH4 leads to primary ovarian insufficiency and non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was also observed that all affected members had homozygous mutations,
      while their parents were heterozygous and the fertile sister had no
      mutant allele, corresponding to autosomal recessive inheritance.
    explanation: >-
      Segregation of a homozygous MSH4 nonsense variant with gonadal failure,
      with unaffected heterozygous parents.
genetic:
- name: MSH4
  gene_term:
    preferred_term: MSH4
    term:
      id: hgnc:7327
      label: MSH4
  association: Causal
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function MSH4 variants. Reported alleles include a donor
    splice-site variant that skips exon 17 and deletes the Walker B motif
    (p.Ile743_Lys785del), the missense p.Ser754Leu in the MutS signature motif,
    the nonsense c.118C>T at residue 40, and the frameshift c.2220_2223del
    found in trans with p.Thr792Ala (PMID:36793102, which names it p.M740fs)
    or with the nonsense p.Arg910Ter. PMID:37620942 reports what appears to
    be the same four-base deletion as c.2222_2225delAAGA (p.Lys741Argfs*2),
    also with p.Thr792Ala; the two names are kept as the sources give them.
  evidence:
  - reference: PMID:28541421
    reference_title: "A homozygous donor splice-site mutation in the meiotic gene MSH4 causes primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study describes the first MSH4 mutation associated with POI and
      increases the number of meiotic/DNA repair genes formally implicated as
      being responsible for this condition.
    explanation: >-
      First report establishing MSH4 as a POI gene.
  - reference: PMID:42386447
    reference_title: "MSH4 and MSH5 variants in premature ovarian insufficiency: A literature review and case study."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic MSH4 variants are well-established causes of POI and
      non-obstructive azoospermia (NOA), with MSH4 recognised as a
      high-evidence gene on clinical panels.
    explanation: >-
      Review summarizing the accumulated case evidence that biallelic MSH4
      variants cause POI.
  - reference: PMID:36099812
    reference_title: "Genetic landscape of a large cohort of Primary Ovarian Insufficiency: New genes and pathways and implications for personalized medicine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We confirmed the causal role of BRCA2, FANCM, BNC1, ERCC6, MSH4, BMPR1A,
      BMPR1B, BMPR2, ESR2, CAV1, SPIDR, RCBTB1 and ATG7 previously reported in
      isolated patients/families.
    explanation: >-
      A large POI cohort independently confirms MSH4 as a POI gene.
  - reference: PMID:36373164
    reference_title: "Genetic screening in patients with ovarian dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The splice-site variants in SYCE1 and MSH4 affected canonical splicing
      isoforms, leading to missing protein domains or premature termination.
    explanation: >-
      An independent family with an MSH4 splice-site variant in an ovarian
      dysfunction exome cohort.
  variants:
  - name: Exon 17 donor splice-site variant (p.Ile743_Lys785del)
    description: >-
      Homozygous donor splice-site variant in a Colombian family; exon 17
      skipping removes the Walker B motif of the ATPase domain.
    evidence:
    - reference: PMID:28541421
      reference_title: "A homozygous donor splice-site mutation in the meiotic gene MSH4 causes primary ovarian insufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Exon trapping experiments showed that the splice-site mutation induced
        skipping of exon 17. At the protein level, the mutation
        p.Ile743_Lys785del is predicted to lead to the ablation of the highly
        conserved Walker B motif of the ATP-binding domain, thus inactivating
        MSH4.
      explanation: >-
        Functional splicing assay showing loss of the Walker B motif.
  - name: p.Ser754Leu
    description: >-
      Homozygous missense in the MutS signature motif adjacent to the Walker B
      motif, found in a consanguineous Iranian family with both POI and NOA.
    evidence:
    - reference: PMID:33448284
      reference_title: "Rare missense variant in MSH4 associated with primary gonadal failure in both 46, XX and 46, XY individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with primary ovarian insufficiency (POI) and non-obstructive
        azoospermia (NOA) were homozygous for the rare missense variant p.
        S754L located in the highly conserved MSH4 MutS signature motif of the
        ATPase domain.
      explanation: >-
        Homozygous missense variant in the ATPase domain segregating with POI.
  - name: c.118C>T
    description: >-
      Homozygous nonsense variant creating a stop codon at residue 40, in an
      Iranian family with affected siblings of both sexes.
    evidence:
    - reference: PMID:38175272
      reference_title: "A novel homozygote nonsense variant of MSH4 leads to primary ovarian insufficiency and non-obstructive azoospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        WES analysis of the proband uncovered a novel homozygote nonsense
        variant, namely c.118C>T in MSH4. This variant resulted in the
        occurrence of a premature stop codon in residue 40 of MSH4.
      explanation: >-
        Early truncating MSH4 allele.
  - name: c.2220_2223del (p.M740fs) with p.T792A
    description: >-
      Compound heterozygous genotype in a woman with menarche at 19 and POI
      diagnosed at 31, with the two alleles inherited from different parents.
    evidence:
    - reference: PMID:36793102
      reference_title: "Next-generation sequencing of 500 POI patients identified novel responsible monogenic and oligogenic variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A compound heterozygous variant in MSH4 (p.M740fs and p.T792A) was
        identified in POI-63, who had spontaneous menarche at 19 years of age
        and diagnosed with POI at 31 years old. The compound heterozygous
        variant was confirmed to be inherited paternally and maternally,
        respectively
      explanation: >-
        Biallelic MSH4 variants in trans in a POI patient, with young adult
        onset.
pathophysiology:
- name: MSH4 Loss of Function
  description: >-
    Biallelic MSH4 variants remove or disrupt the MSH4 protein, most often in
    its C-terminal ATPase domain, inactivating the MSH4-MSH5 (MutS-gamma)
    heterodimer that recognizes and stabilizes Holliday junction recombination
    intermediates in meiotic prophase I.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MSH4
    term:
      id: hgnc:7327
      label: MSH4
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28541421
    reference_title: "A homozygous donor splice-site mutation in the meiotic gene MSH4 causes primary ovarian insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Exon trapping experiments showed that the splice-site mutation induced
      skipping of exon 17.
    explanation: >-
      Splicing assay of the founding allele; the resulting in-frame deletion
      removes the Walker B ATPase motif, which the authors predict
      inactivates MSH4.
  - reference: PMID:33448284
    reference_title: "Rare missense variant in MSH4 associated with primary gonadal failure in both 46, XX and 46, XY individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Along with its heterodimer partner MSH5, it is responsible for
      double-strand Holliday junction recognition and stabilization, to ensure
      accurate chromosome segregation during meiosis.
    explanation: >-
      States the normal MutS-gamma function that the disease alleles remove.
  - reference: PMID:30467025
    reference_title: "MutS\u03B3-Induced DNA Conformational Changes Provide Insights into Its Role in Meiotic Recombination."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Similar to the human protein, Sc Msh4-Msh5 exhibits the highest affinity
      for the HJ with a Kd < 0.4 nM in solution.
    explanation: >-
      Purified yeast MutS-gamma binds Holliday junctions most tightly, as the
      human complex does; the structural role is inferred for human MSH4.
  downstream:
  - target: Defective Homolog Synapsis and Meiotic Recombination
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10809667
      reference_title: "MutS homolog 4 localization to meiotic chromosomes is required for chromosome pairing during meiosis in male and female mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although meiosis is initiated in Msh4 mutant male and female mice, as
        indicated by the chromosomal localization of RAD51 and COR1 during
        leptonema/zygonema, the chromosomes fail to undergo normal pairing.
      explanation: >-
        Loss of Msh4 in mice prevents normal homolog pairing after meiotic
        entry.
- name: Defective Homolog Synapsis and Meiotic Recombination
  conforms_to: "meiotic_prophase_failure#Homologous Recombination Repair of Meiotic DNA Breaks"
  description: >-
    Without MutS-gamma, homologous chromosomes fail to pair and synapse
    normally, and recombination intermediates are not channelled into
    MLH1-marked crossovers.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:
  - preferred_term: homologous chromosome pairing at meiosis
    term:
      id: GO:0007129
      label: homologous chromosome pairing at meiosis
    modifier: DECREASED
  - preferred_term: synaptonemal complex assembly
    term:
      id: GO:0007130
      label: synaptonemal complex assembly
    modifier: DECREASED
  - preferred_term: reciprocal meiotic recombination
    term:
      id: GO:0007131
      label: reciprocal meiotic recombination
    modifier: DECREASED
  evidence:
  - reference: PMID:10809667
    reference_title: "MutS homolog 4 localization to meiotic chromosomes is required for chromosome pairing during meiosis in male and female mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results show that MSH4 localization on chromosomes during the early
      stages of meiosis is essential for normal chromosome synapsis in prophase
      I and that it acts in the same pathway as MSH5.
    explanation: >-
      Mouse genetics place MSH4 upstream of synapsis, in the MSH5 pathway.
  - reference: PMID:10928988
    reference_title: "MSH4 acts in conjunction with MLH1 during mammalian meiosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest that MSH4 is first required for chromosome synapsis
      and that this MutS homologue is involved later with MLH1 in meiotic
      reciprocal recombination.
    explanation: >-
      MSH4 interacts with MLH1 and colocalizes with it on synaptonemal
      complexes, linking MSH4 to crossover formation.
  downstream:
  - target: Meiotic Arrest and Germ Cell Loss
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34755185
      reference_title: "Bi-allelic variants in DNA mismatch repair proteins MutS Homolog MSH4 and MSH5 cause infertility in both sexes."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        γH2AX staining revealed an arrest in early prophase of meiosis I in
        individuals with pathogenic MSH4 or MSH5 variants.
      explanation: >-
        Testicular tissue from human MSH4-variant carriers shows arrest in
        early meiotic prophase I. Fetal ovarian tissue is not accessible to the
        same analysis, so the oocyte arrest is inferred from this male finding
        and from the mouse.
- name: Meiotic Arrest and Germ Cell Loss
  conforms_to: "meiotic_prophase_failure#Pachytene Checkpoint Arrest and Germ Cell Apoptosis"
  description: >-
    Germ cells that cannot complete synapsis and recombination arrest in
    meiotic prophase I and are eliminated, so functional gametes are not
    produced in either sex.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: germ cell
    term:
      id: CL:0000586
      label: germ cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:10809667
    reference_title: "MutS homolog 4 localization to meiotic chromosomes is required for chromosome pairing during meiosis in male and female mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Disruption of the Msh4 gene in mice results in male and female sterility
      due to meiotic failure.
    explanation: >-
      Msh4-null mice of both sexes are sterile from meiotic failure.
  - reference: PMID:10809667
    reference_title: "MutS homolog 4 localization to meiotic chromosomes is required for chromosome pairing during meiosis in male and female mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The failure of pairing in these oocytes correlated with an induction of
      apoptosis, resulting in the almost complete obliteration of germ cell
      numbers within the ovaries of Msh4−/− females by day 4 pp
    explanation: >-
      In female knockout mice, unpaired oocytes undergo apoptosis and are
      almost all lost within days of birth.
  downstream:
  - target: Ovarian Follicle Depletion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10809667
      reference_title: "MutS homolog 4 localization to meiotic chromosomes is required for chromosome pairing during meiosis in male and female mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        As in the case of Msh5−/− females, the loss of the oocyte pool resulted
        in the disruption of ovarian development and the complete loss of
        ovarian structures in the adult Msh4−/− female.
      explanation: >-
        Oocyte loss leads to loss of ovarian structures in the mouse.

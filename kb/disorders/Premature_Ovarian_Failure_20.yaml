      description: >-
        Mouse oocytes are lost perinatally, so the model cannot show the
        years of residual ovarian function seen in women before POI.
    evidence:
    - reference: PMID:10809667
      reference_title: "MutS homolog 4 localization to meiotic chromosomes is required for chromosome pairing during meiosis in male and female mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Such ovarian dysgenesis after germ cell loss is specific to mice
        lacking MSH5 and MSH4, as other mutations that result in germ cell
        depletion do not give rise to such a severe alteration in ovarian

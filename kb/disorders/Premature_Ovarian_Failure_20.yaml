  - target: Ovarian Follicle Depletion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Female knockouts lose the oocyte pool and then the ovary itself.
    limitations: >-
      The mouse loses nearly all oocytes within days of birth and has no adult
      ovarian structure, whereas affected women usually have a spontaneous
      menarche and lose ovarian function in young adulthood. The authors
      describe this ovarian dysgenesis as specific to Msh4 and Msh5 knockout
      mice.
    divergences:

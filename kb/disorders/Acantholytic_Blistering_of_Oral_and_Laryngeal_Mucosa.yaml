- name: Feeding difficulties
  category: Gastrointestinal
  description: >-
    Painful oral lesions are expected to limit oral intake; in the mouse
    model this produces runting once pups depend on oral feeding.
  notes: >-
    Inferred from runting in the Dsg3-null mouse. Feeding difficulty has not
    been documented in quotable text from any human report.
  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:9166409
    reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We presume that these lesions interfered with oral intake, as these
      mice, which were born with normal weights, became runts once they relied
      on oral intake for food.
    explanation: >-
      Oral lesions in Dsg3-null mice impair feeding, causing runting.

diagnosis:
- name: Genetic confirmation and exclusion of autoimmune pemphigus
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    The mucosal lesion resembles pemphigus vulgaris, so the diagnosis rests on
    finding biallelic DSG3 loss-of-function variants in a patient without
    evidence of autoimmunity. One reported allele is a homozygous 49.6 kb
    deletion at 18q12.1, a copy-number loss that sequence-only testing may
    not detect.
  results: >-
    Biallelic DSG3 loss of function without evidence of autoimmune disease.
  evidence:
  - reference: PMID:37850634
    reference_title: "Homozygous deletion of the DSG3 terminal exon associated with acantholytic blistering of the oral and laryngeal mucosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis explains the mucosal phenotype of a pemphigus-like
      disorder without evidence of autoimmune dysfunction. The exclusion of an
      autoimmune basis has management implications.
    explanation: >-
      Genetic diagnosis distinguishes ABOLM from autoimmune pemphigus, which
      the authors note changes management.

genetic:
- name: DSG3
  gene_term:
    preferred_term: DSG3
    term:
      id: hgnc:3050
      label: DSG3
  relationship_type: CAUSATIVE
  association: Biallelic loss-of-function variants
  variants:
  - name: Homozygous 49.6 kb 18q12.1 deletion including the last exon of DSG3
    description: >-
      Homozygous deletion removing the terminal exon of DSG3 and also
      involving DSG2, found in dizygotic twins; heterozygous parents were
      unaffected and no cardiac phenotype was present at the time of report.
    evidence:
    - reference: PMID:37850634
      reference_title: "Homozygous deletion of the DSG3 terminal exon associated with acantholytic blistering of the oral and laryngeal mucosa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The deletion also involved the DSG2 gene, which is associated with
        arrhythmogenic right ventricular dysplasia (ARVD). The affected
        siblings and heterozygous parents do not show any cardiac phenotype at
        this time.
      explanation: >-
        Records the extension of the deletion into DSG2 and the absence of a
        cardiac phenotype at report.
  notes: >-
    Three DSG3 alleles have been reported in ABOLM: a homozygous nonsense
    variant (PMID:30528827, no quotable text in the cache), a homozygous
    terminal-exon deletion (PMID:37850634), and a homozygous missense variant
    (PMID:42684697). No ClinGen gene-disease validity record for DSG3 is
    present in the committed ClinGen ingest (kb/genes/ingest).

animal_models:
- name: Dsg3 targeted null mouse
  species: Mouse
  genotype: Dsg3 -/-
  publication: PMID:9166409
  description: >-
    Targeted disruption of Dsg3 produces oral mucosal erosions with suprabasal
    acantholysis, runting from impaired feeding, and telogen hair loss. The
    balding (bal) mutant is allelic.
  modeled_mechanisms:
  - target: Suprabasal Acantholysis of Oral and Laryngeal Mucosa
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The null mouse reproduces pemphigus-like suprabasal acantholysis of the
      oral mucosa.
    limitations: >-
      Laryngeal and respiratory involvement, the predominant feature in one
      human family, was not assessed, and the telogen hair loss of the mouse
      has not been described in patients.
    evidence:
    - reference: PMID:9166409
      reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Indeed, oropharyngeal biopsies showed erosions with histology typical
        of PV, including suprabasilar acantholysis and "tombstoning" of basal
        cells.
      explanation: Supports the model as informative for the mucosal lesion node.
  - target: Loss of Desmoglein 3 Mediated Keratinocyte Adhesion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The same adhesion loss occurs between the cells around the telogen club
      hair and the outer root sheath, producing cyclical hair loss.
    limitations: >-
      Hair loss has not been described in the human reports, so this arm of
      the model shows the adhesion defect in a tissue not known to be affected
      in patients.
    evidence:
    - reference: PMID:9701552
      reference_title: "Desmoglein 3 anchors telogen hair in the follicle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histology of hair follicles in early telogen, just before clinical hair
        loss occurred, showed loss of cell adhesion (acantholysis) between the
        cells surrounding the telogen club and the basal layer of the outer
        root sheath epithelium.
      explanation: >-
        Shows loss of Dsg3-dependent keratinocyte adhesion in a second tissue
        of the null mouse.


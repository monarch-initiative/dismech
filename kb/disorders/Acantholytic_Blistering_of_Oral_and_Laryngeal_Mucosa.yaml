    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis explains the mucosal phenotype of a pemphigus-like
      disorder without evidence of autoimmune dysfunction.
    explanation: >-
      The pemphigus-like mucosal phenotype in patients implies the oral
      erosions that characterize mucosal pemphigus; the sentence does not
      name erosions itself.
  - reference: PMID:9166409
    reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Similarly, the major lesions in DSG3 −/− mice were oral mucous membrane
      erosions.
    explanation: >-
      Oral mucosal erosions are the principal lesion of the Dsg3-null mouse.


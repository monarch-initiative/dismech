notes: >-
  No GeneReviews or StatPearls chapter names this disease (checked with
  `just check-genereviews` against the Bookshelf index snapshot of
  2026-09-10, using the synonyms listed above). The first report (Kim et al.
  2018, PMID:30528827) is a Journal of Investigative Dermatology research
  letter with no PubMed abstract; fetches by PMID and by DOI on 2026-10-20
  returned no quotable text, so it is listed under references without a
  snippet. The neonatal case originally reported as a persistent autoimmune
  disorder (PMID:10023908) was later reclassified as DSG3-related genetic
  disease (PMID:42684697); that earlier record also cached with no quotable
  text and is not cited as evidence. The 2026 report (PMID:42684697) cached
  with only a one-sentence summary, so its missense variant and oesophageal
  involvement are recorded from its title rather than quoted. No
  disease-specific treatment has been reported, so the entry carries no
  treatments section.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous for a DSG3 loss-of-function allele;
    heterozygous parents are unaffected.
  evidence:
  - reference: PMID:37850634
    reference_title: "Homozygous deletion of the DSG3 terminal exon associated with acantholytic blistering of the oral and laryngeal mucosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is only the second report in the literature of this unusual
      autosomal recessive blistering disorder.
    explanation: >-
      States the autosomal recessive mode of inheritance of ABOLM in the second
      reported family.
pathophysiology:
- name: Biallelic DSG3 Loss of Function
  conforms_to: "desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade"
  description: >-
    Biallelic DSG3 variants remove desmoglein 3 from the desmosomes of
    stratified squamous epithelia. Reported alleles are a homozygous nonsense
    variant, a homozygous 49.6 kb deletion at 18q12.1 that removes the last
    exon of DSG3 and also involves DSG2, and a homozygous missense variant.
    This is the structural-gene route of the desmosomal adhesion failure
    module: the protein that IgG autoantibodies block in pemphigus vulgaris is
    here genetically absent.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DSG3
    term:
      id: hgnc:3050
      label: DSG3
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  molecular_functions:
  - preferred_term: desmoglein 3 cell-cell adhesion mediator activity
    term:
      id: GO:0098632
      label: cell-cell adhesion mediator activity
    modifier: ABSENT
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:37850634
    reference_title: "Homozygous deletion of the DSG3 terminal exon associated with acantholytic blistering of the oral and laryngeal mucosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a novel homozygous 49.6 kb deletion of chromosome 18q12.1
      involving the last exon of DSG3 in dizygotic twins with phenotype
      consistent with acantholytic blistering of the oral and laryngeal mucosa
      (ABOLM).
    explanation: >-
      Documents a homozygous DSG3 deletion as the genetic lesion in an ABOLM
      family.
  - reference: PMID:37850634
    reference_title: "Homozygous deletion of the DSG3 terminal exon associated with acantholytic blistering of the oral and laryngeal mucosa."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional studies would further clarify how deletions resulting in loss
      of function of DSG3 may cause the reported phenotypes of DSG3-related
      ABOLM.
    explanation: >-
      Frames the deletion as a DSG3 loss-of-function allele, while noting that
      its functional consequence was not directly tested.
  - reference: PMID:9166409
    reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      DSG3 -/- mice had no DSG3 mRNA by RNase protection assay and no Dsg3
      protein by immunofluorescence (IF) and immunoblots.
    explanation: >-
      The null mouse establishes the molecular state this node describes,
      complete absence of desmoglein 3, as a model of the human biallelic
      loss-of-function genotype.
  - reference: PMID:10021453
    reference_title: "Explanations for the clinical and microscopic localization of lesions in pemphigus foliaceus and vulgaris."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These studies suggest that pemphigus autoantibodies inhibit the adhesive
      function of desmoglein proteins, and demonstrate that either Dsg1 or
      Dsg3 alone is sufficient to maintain keratinocyte adhesion.
    explanation: >-
      Establishes the cell-cell adhesion function of desmoglein 3 that is
      absent when both DSG3 alleles are lost.
  downstream:
  - target: Loss of Desmoglein 3 Mediated Keratinocyte Adhesion
    causal_link_type: DIRECT
    description: >-
      Without desmoglein 3, desmosomes of basal and immediate suprabasal
      keratinocytes cannot hold neighbouring cells together.
    evidence:
    - reference: PMID:9166409
      reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate the critical importance of Dsg3 for adhesion
        in deep stratified squamous epithelia and suggest that pemphigus
        autoantibodies might interfere directly with such a function.
      explanation: >-
        Genetic ablation of Dsg3 in mice shows that its loss is sufficient to
        abolish adhesion in deep stratified squamous epithelia.

- name: Loss of Desmoglein 3 Mediated Keratinocyte Adhesion
  conforms_to: "desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion"
  description: >-
    Desmoglein 3 is expressed in the basal and immediate suprabasal layers of
    stratified squamous epithelia. Its absence leaves desmosomes at that level
    unable to resist mechanical load, and cells separate at the cell membrane.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: oral mucosa squamous cell
    term:
      id: CL:1001576
      label: oral mucosa squamous cell
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  evidence:
  - reference: PMID:9166409
    reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings demonstrate that Dsg3 is critical for cell adhesion in the
      basal and immediate suprabasilar keratinocytes, especially in the oral
      mucous membrane, thereby showing a differentiation- and tissue-specific
      adhesion function of one of the desmogleins.
    explanation: >-
      Places the adhesion defect in basal and immediate suprabasal
      keratinocytes, with the oral mucosa most dependent on desmoglein 3.
  - reference: PMID:12485423
    reference_title: "Loss of cell adhesion in Dsg3bal-Pas mice with homozygous deletion mutation (2079del14) in the desmoglein 3 gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collectively, these data showed that the perturbation of desmoglein 3
      found in the Dsg3bal-Pas mice resulted in disadhesion of keratinocytes
      manifested with blistering phenotype.
    explanation: >-
      A spontaneous truncating Dsg3 allele in mice independently reproduces
      keratinocyte disadhesion, so the effect is not specific to one
      engineered allele.
  downstream:
  - target: Suprabasal Acantholysis of Oral and Laryngeal Mucosa
    causal_link_type: DIRECT
    description: >-
      Under mechanical load, non-adherent suprabasal cells detach from the
      basal layer, producing intraepithelial clefts and blisters.
    evidence:
    - reference: PMID:9166409
      reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Accordingly, the acantholytic cleft was formed as a result of
        separation of basal cells from suprabasal cells and from each other at
        the cell membranes.
      explanation: >-
        Shows that the adhesion loss produces acantholytic clefting at the
        basal-suprabasal level in Dsg3-null epithelium.

- name: Insufficient Desmoglein 1 Compensation in Squamous Mucosa
  description: >-
    Desmoglein 1 can substitute for desmoglein 3 where it is expressed at
    sufficient levels. In epidermis it is abundant, but in oral and other
    squamous mucosa it is expressed at much lower levels than desmoglein 3.
    The lack of compensation explains why loss of desmoglein 3 presents as a
    mucosal rather than a cutaneous disease. This node is inferred from
    pemphigus and mouse genetic studies; desmoglein 1 expression has not been
    measured in ABOLM patient tissue.
  role: modifier
  biological_scale: TISSUE
  cell_types:
  - preferred_term: oral mucosa squamous cell
    term:
      id: CL:1001576
      label: oral mucosa squamous cell
  locations:
  - preferred_term: oral mucosa
    term:
      id: UBERON:0003343
      label: mucosa of oral region
  evidence:
  - reference: PMID:9424092
    reference_title: "Lack of mucosal involvement in pemphigus foliaceus may be due to low expression of desmoglein 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In the mucosal extract, the Dsg1 band was much weaker than Dsg3, whereas
      in the epidermal extract the Dsg1 band was stronger than Dsg3.
    explanation: >-
      Immunoblots of human tissue extracts measure the low desmoglein 1 to
      desmoglein 3 ratio of squamous mucosa, which leaves mucosa dependent on desmoglein 3.
  - reference: PMID:12164920
    reference_title: "Expression of desmoglein 1 compensates for genetic loss of desmoglein 3 in keratinocyte adhesion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These studies show that desmoglein-1 can compensate for loss of
      desmoglein-3-mediated adhesion, and provide genetic evidence confirming
      the desmoglein compensation hypothesis.
    explanation: >-
      Genetic evidence that desmoglein 1 rescues adhesion after genetic loss of
      desmoglein 3, so the tissue distribution of desmoglein 1 sets where DSG3
      deficiency causes lesions.
  - reference: PMID:12164920
    reference_title: "Expression of desmoglein 1 compensates for genetic loss of desmoglein 3 in keratinocyte adhesion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, DSG3-/-TG+ mice showed similar low weights, because the
      transgene, although expressed in skin, was not well expressed in oral
      mucous membranes.
    explanation: >-
      Where desmoglein 1 is not supplied (oral mucosa), the consequence of
      oral blistering persists despite rescue elsewhere.
  downstream:
  - target: Suprabasal Acantholysis of Oral and Laryngeal Mucosa
    causal_link_type: DIRECT
    description: >-
      Without adequate desmoglein 1, mucosal keratinocytes have no second
      desmoglein to maintain adhesion after desmoglein 3 is lost.
    evidence:
    - reference: PMID:10021453
      reference_title: "Explanations for the clinical and microscopic localization of lesions in pemphigus foliaceus and vulgaris."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, the anti-desmoglein antibody profiles in pemphigus sera and the
        normal tissue distributions of Dsg1 and Dsg3 determine the sites of
        blister formation.
      explanation: >-
        Establishes in pemphigus models that the tissue distribution of the two
        desmogleins determines where blisters form when one is lost; applied
        here to genetic rather than antibody-mediated loss.

- name: Suprabasal Acantholysis of Oral and Laryngeal Mucosa
  conforms_to: "desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent Tissues"
  description: >-
    Suprabasal acantholysis with a "row of tombstones" basal layer, the
    histology of pemphigus vulgaris, develops in the oral, oropharyngeal and
    laryngeal mucosa and can extend to the lower respiratory and oesophageal
    mucosa. Ruptured blisters leave erosions that limit feeding.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: oral mucosa squamous cell
    term:
      id: CL:1001576
      label: oral mucosa squamous cell
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  locations:
  - preferred_term: oral mucosa
    term:
      id: UBERON:0003343
      label: mucosa of oral region
  - preferred_term: laryngeal mucosa
    term:
      id: UBERON:0001824
      label: mucosa of larynx
  evidence:
  - reference: PMID:9166409
    reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Indeed, oropharyngeal biopsies showed erosions with histology typical of
      PV, including suprabasilar acantholysis and "tombstoning" of basal
      cells.
    explanation: >-
      Dsg3-null mice develop oropharyngeal suprabasal acantholysis with
      tombstoning, the tissue lesion of this node.
  - reference: PMID:37850634
    reference_title: "Homozygous deletion of the DSG3 terminal exon associated with acantholytic blistering of the oral and laryngeal mucosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis explains the mucosal phenotype of a pemphigus-like
      disorder without evidence of autoimmune dysfunction.
    explanation: >-
      In patients the mucosal lesion is pemphigus-like but occurs without
      autoimmunity, consistent with a genetic rather than antibody-mediated
      loss of desmoglein 3.
  downstream:
  - target: Oral mucosal blisters
  - target: Erosion of oral mucosa
  - target: Laryngeal mucosal friability
  - target: Acantholysis
  - target: Suprabasal cleavage
  - target: Feeding difficulties

phenotypes:
- name: Oral mucosal blisters
  category: Mucosal
  description: >-
    Blisters of the oral mucosa, the defining feature named in the disease
    label.
  notes: >-
    The only quotable human statement is indirect (a pemphigus-like mucosal
    phenotype); the blistering itself is documented in quotable text only in
    the Dsg3-null and bal mice. The two human reports whose titles name oral
    blistering (PMID:30528827, PMID:42684697) cached with no quotable text.
  phenotype_term:
    preferred_term: Oral mucosal blisters
    term:
      id: HP:0200097
      label: Oral mucosal blisters
  evidence:
  - reference: PMID:37850634
    reference_title: "Homozygous deletion of the DSG3 terminal exon associated with acantholytic blistering of the oral and laryngeal mucosa."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis explains the mucosal phenotype of a pemphigus-like
      disorder without evidence of autoimmune dysfunction.
    explanation: >-
      In patients with biallelic DSG3 loss the mucosal phenotype is
      pemphigus-like; oral mucosal blistering is the characteristic mucosal
      lesion of pemphigus, so this supports the phenotype by inference rather
      than by naming blisters.
  - reference: PMID:9166409
    reference_title: "Targeted disruption of the pemphigus vulgaris antigen (desmoglein 3) gene in mice causes loss of keratinocyte cell adhesion with a phenotype similar to pemphigus vulgaris."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histological analysis revealed the presence of suprabasilar blisters on
      the tongue of bal/bal mice, indistinguishable from those found in our
      DSG3 −/− mice
    explanation: >-
      Oral (tongue) suprabasilar blisters occur in both the engineered
      Dsg3-null mouse and the spontaneous bal allele.


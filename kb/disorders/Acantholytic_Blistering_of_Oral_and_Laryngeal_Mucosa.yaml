name: Acantholytic Blistering of Oral and Laryngeal Mucosa
creation_date: "2026-10-20T23:30:00Z"
category: Mendelian
synonyms:
- blistering, acantholytic, of oral and laryngeal mucosa
- ABOLM
- DSG3-related acantholytic blistering of the oral and laryngeal mucosa
description: >-
  Acantholytic blistering of the oral and laryngeal mucosa (ABOLM; OMIM 619226)
  is a very rare autosomal recessive mucosal blistering disorder caused by
  biallelic loss-of-function variants in DSG3, which encodes the desmosomal
  cadherin desmoglein 3. It is the genetic counterpart of the mucosal form of
  pemphigus vulgaris: the protein that pemphigus autoantibodies block is
  instead absent, so the disease reproduces a pemphigus-like mucosal
  phenotype without evidence of autoimmunity. The restriction to mucosa
  follows from the desmoglein compensation principle: in squamous mucosa
  desmoglein 1 is expressed at much lower levels than desmoglein 3 and cannot
  replace it, whereas in epidermis desmoglein 1 maintains adhesion. Only a
  few families have been reported, carrying a homozygous nonsense variant, a
  homozygous deletion of the DSG3 terminal exon, and a homozygous missense
  variant.
parents:
- Desmosomal Disease
- Inherited Mucosal Blistering Disorder
disease_term:
  preferred_term: blistering, acantholytic, of oral and laryngeal mucosa
  term:
    id: MONDO:0030986
    label: blistering, acantholytic, of oral and laryngeal mucosa
classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY

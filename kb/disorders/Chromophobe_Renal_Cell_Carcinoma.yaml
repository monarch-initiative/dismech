discussions:
- discussion_id: chrcc_whole_chromosome_loss_mechanism
  prompt: >-
    What mechanism generates the specific, recurrent loss of chromosomes 1, 2,
    6, 10, 13, 17 and 21 in chromophobe renal cell carcinoma, and why does this
    tumor tolerate massive aneuploidy without a mutator phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Recurrent Whole-Chromosome Loss
  - pathophysiology#Distal Nephron Intercalated Cell Origin
  rationale: >-
    The chromosome-loss signature is the defining and near-pathognomonic feature
    of chRCC, yet no genome-maintenance defect, replication-stress lesion or
    checkpoint failure has been identified as its cause. This is why the entry
    does not declare conformance to the genome_instability_mutation module: that
    module's central node models chromosomal instability arising from defective
    repair and failed surveillance with an accompanying elevated mutation rate,
    and chRCC has the aneuploidy without the mutator phenotype - roughly seven
    chromosome losses against roughly thirty-one exonic somatic mutations. The
    question is mechanistically important because extensive chromosome loss
    normally imposes proteotoxic stress and impairs proliferation, so whatever
    permits chRCC to tolerate it is likely to be a genuine feature of the
    disease rather than an incidental one.
  proposed_experiments:
  - experiment_id: exp_chrcc_single_cell_copy_number_reconstruction
    name: Single-cell copy-number reconstruction of chRCC and normal intercalated cells
    description: >-
      Determine whether the chromosome losses arise in a single catastrophic
      mis-segregation event or accumulate sequentially, and whether normal or
      premalignant intercalated cells show any baseline segregation fragility.
  - experiment_id: exp_chrcc_proteostasis_profiling_aneuploidy
    name: Proteostasis profiling of aneuploid chRCC cells
    description: >-
      Test whether chRCC cells show the proteotoxic stress response expected of

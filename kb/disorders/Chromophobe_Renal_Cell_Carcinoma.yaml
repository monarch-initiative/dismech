    explanation: Directly states the proportion of RCC accounted for by chRCC.
pathophysiology:
- name: Distal Nephron Intercalated Cell Origin
  biological_scale: CELLULAR
  description: >-
    chRCC arises from the intercalated cells of the distal nephron and collecting
    duct. This is the single fact from which most of the rest of chRCC biology
    follows: the intercalated cell is mitochondria-rich, which anticipates the
    tumor's oxidative metabolic phenotype, and it is also the presumed cell of
    origin of renal oncocytoma, which is why the two tumors overlap so heavily on
    morphology and immunophenotype. Clear cell and papillary RCC instead arise
    from the proximal tubule.
  cell_types:
  - preferred_term: kidney collecting duct intercalated cell
    term:
      id: CL:1001432
      label: kidney collecting duct intercalated cell
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Recurrent Whole-Chromosome Loss
    description: >-
      The intercalated cell of origin acquires the characteristic pattern of
      whole-chromosome losses.
  - target: Mitochondrial Accumulation and Oxidative Metabolic Phenotype
    description: >-
      The mitochondria-rich character of the cell of origin is retained and
      amplified in the tumor.
  evidence:
  - reference: PMID:25155756
    reference_title: "The somatic genomic landscape of chromophobe renal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The result is consistent that ChRCC originates from the distal nephron compared with other kidney cancers with more proximal origins."
    explanation: >-
      TCGA multi-platform characterization of 66 tumors establishes the distal
      nephron origin of chRCC in contrast to the proximal origin of other renal
      cancers.
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ChRCCs are considered to originate from the intercalated cell of distal tubules with two main morphological variants, classic and eosinophilic."
    explanation: >-
      Independent review confirming the intercalated-cell origin at the
      cell-type level of granularity curated on this node.
- name: Recurrent Whole-Chromosome Loss
  biological_scale: CELLULAR
  description: >-
    The genomic hallmark of chRCC is the combined loss of entire chromosomes 1,
    2, 6, 10, 13, 17 and 21, present in 70-93% of tumors and specific enough to
    be used diagnostically against renal oncocytoma. What makes this pattern
    mechanistically unusual is its company: chRCC carries roughly seven
    chromosome losses alongside only about thirty exonic somatic mutations, so
    the dominant oncogenic signal is copy-number rather than point mutation.
    Roughly 40% of tumors have no identified driver mutation in any known
    oncogene or tumor suppressor, which implicates the aneuploidy itself as a
    primary transforming event. The upstream cause of the loss pattern is not
    established.
  biological_processes:
  - preferred_term: chromosome segregation
    modifier: DECREASED
    term:
      id: GO:0007059
      label: chromosome segregation
  downstream:
  - target: TP53 Tumor Suppressor Inactivation
    description: >-
      Chromosome 17 loss removes one TP53 allele, contributing to the
      inactivation of the p53 axis.
  - target: mTORC1 Pathway Hyperactivation
    description: >-
      Chromosome 10 loss removes one PTEN allele, contributing to release of the
      brake on PI3K-AKT-mTOR signaling.
  - target: Indolent Chromophobe Tumor Growth
    description: >-
      The aneuploid genome supports outgrowth of the transformed clone.
  evidence:
  - reference: PMID:7519827
    reference_title: "Specific loss of chromosomes 1, 2, 6, 10, 13, 17, and 21 in chromophobe renal cell carcinomas revealed by comparative genomic hybridization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that a specific combination of multiple chromosomal losses characterizes chromophobe renal cell carcinomas and may help to differentiate them unequivocally from other types of kidney cancer."
    explanation: >-
      The original comparative genomic hybridization study establishing the
      specific multi-chromosome loss signature as characteristic of chRCC.
  - reference: PMID:19445733
    reference_title: "High-resolution DNA copy number and gene expression analyses distinguish chromophobe renal cell carcinomas and renal oncocytomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have confirmed the high specificity of monosomies of chromosomes 1, 2, 6, 10, 13, 17 and 21 in 70-93% of the chRCCs"
    explanation: >-
      SNP-array analysis of 30 chRCCs quantifies the frequency of each
      characteristic monosomy, supporting the 70-93% figure curated here.
  - reference: PMID:28614790
    reference_title: "Genomic landscape and evolution of metastatic chromophobe renal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromophobe renal cell carcinoma (chRCC) typically shows ~7 chromosome losses (1, 2, 6, 10, 13, 17, and 21) and ~31 exonic somatic mutations, yet carries ~5%-10% metastatic incidence."
    explanation: >-
      Directly quantifies the defining juxtaposition of extensive chromosome
      loss with a low exonic mutation burden that this node models.
- name: TP53 Tumor Suppressor Inactivation
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  description: >-
    TP53 is the most frequently mutated gene in chRCC. Mutation is enriched in
    higher-grade and metastatic tumors, where it reaches 58%, against roughly a
    third of unselected cases. Loss of p53-mediated transcriptional control
    removes the DNA-damage and apoptotic checkpoint that would otherwise
    constrain a cell carrying this degree of aneuploidy.
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  downstream:
  - target: Sarcomatoid Dedifferentiation
    description: >-
      p53-axis loss is enriched in the aggressive, dedifferentiated subset.
  - target: Indolent Chromophobe Tumor Growth
    description: >-
      Loss of checkpoint control permits proliferation of the transformed clone.
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53 and PTEN are the two most frequently mutated genes in ChRCCs."
    explanation: >-
      Establishes TP53 as the leading recurrently mutated gene in chRCC.
  - reference: PMID:28614790
    reference_title: "Genomic landscape and evolution of metastatic chromophobe renal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53 mutations (58%), PTEN mutations (24%), and imbalanced chromosome duplication (ICD, duplication of ≥ 3 chromosomes) (25%) were enriched in M-chRCC."
    explanation: >-
      Quantifies TP53 mutation frequency in metastatic chRCC and its enrichment
      relative to non-metastatic disease.
- name: mTORC1 Pathway Hyperactivation
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  biological_scale: MOLECULAR
  description: >-
    Several independent lesions converge on constitutive mTORC1 signaling in
    chRCC: somatic PTEN loss (the second most frequently mutated gene, and 24%
    in metastatic tumors), somatic mutation of MTOR, TSC1, TSC2 or NRAS, and -
    in the hereditary setting - germline FLCN loss. This convergence is what
    makes mTOR inhibition the mechanistically motivated systemic option in
    chRCC, in contrast to the VEGF-directed strategies that follow from
    VHL-HIF biology in clear cell RCC.
  biological_processes:
  - preferred_term: TORC1 signaling
    modifier: INCREASED
    term:
      id: GO:0038202
      label: TORC1 signaling
  - preferred_term: TOR signaling
    modifier: INCREASED
    term:
      id: GO:0031929
      label: TOR signaling
  downstream:
  - target: Indolent Chromophobe Tumor Growth
    description: >-
      Constitutive mTORC1 output drives anabolic growth and proliferation.
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53 and PTEN are the two most frequently mutated genes in ChRCCs."
    explanation: >-
      Supports PTEN as a leading recurrently mutated gene in chRCC. Marked
      PARTIAL because the review states the mutation frequency but does not
      itself demonstrate the downstream mTORC1 hyperactivation modeled here.
  - reference: PMID:28614790
    reference_title: "Genomic landscape and evolution of metastatic chromophobe renal cell carcinoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that TP53 mutations (58%), PTEN mutations (24%), and imbalanced chromosome duplication (ICD, duplication of ≥ 3 chromosomes) (25%) were enriched in M-chRCC."
    explanation: >-
      Quantifies PTEN mutation in metastatic chRCC. PARTIAL for the same reason:
      it establishes the lesion, not the pathway-activation readout.
- name: TERT Promoter Structural Rearrangement and Telomerase Reactivation
  conforms_to: "enabling_replicative_immortality#Telomere Maintenance Reactivation"
  biological_scale: MOLECULAR
  description: >-
    chRCC reactivates telomerase by a mechanism distinct from the point
    mutations and amplifications that dominate other cancers: recurrent genomic
    rearrangements place structural breakpoints within the TERT promoter region,
    juxtaposing it with strong enhancers. The result is markedly elevated TERT
    expression accompanied by localized hypermutation (kataegis) at the
    breakpoint. This is the enhancer-hijacking route to replicative immortality.
  biological_processes:
  - preferred_term: telomere maintenance via telomerase
    modifier: INCREASED
    term:
      id: GO:0007004
      label: telomere maintenance via telomerase
  downstream:
  - target: Indolent Chromophobe Tumor Growth
    description: >-
      Telomerase reactivation removes the replicative limit on the tumor clone.
  evidence:
  - reference: PMID:25155756
    reference_title: "The somatic genomic landscape of chromophobe renal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic rearrangements lead to recurrent structural breakpoints within TERT promoter region, which correlates with highly elevated TERT expression and manifestation of kataegis, representing a mechanism of TERT upregulation in cancer distinct from previously observed amplifications and point mutations."
    explanation: >-
      TCGA whole-genome sequencing establishes the structural-rearrangement
      route to TERT upregulation in chRCC and explicitly contrasts it with the
      amplification and point-mutation mechanisms seen elsewhere.
- name: Mitochondrial Accumulation and Oxidative Metabolic Phenotype
  biological_scale: CELLULAR
  description: >-
    chRCC cells accumulate mitochondria and show near-universal upregulation of
    Krebs cycle and electron transport chain genes relative to normal kidney,
    together with the highest expression of mitochondrially encoded genes among
    RCC subtypes. Somatic mitochondrial DNA mutations, including frameshifting
    changes in complex I subunit genes, are found in the majority of tumors.
    This is a genuinely distinct metabolic state, not a variant of the
    glycolytic Warburg shift that characterizes VHL-mutant clear cell RCC, and
    it is why this entry does not conform to the aerobic-glycolysis node of the
    deregulated_cellular_energetics module. Whether the mtDNA mutations are
    drivers or passengers of this phenotype remains unresolved.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: INCREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Indolent Chromophobe Tumor Growth
    description: >-
      Oxidative metabolism sustains the bioenergetic demands of the tumor.
  evidence:
  - reference: PMID:25155756
    reference_title: "The somatic genomic landscape of chromophobe renal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined mtDNA and gene expression analysis implicates changes in mitochondrial function as a component of the disease biology, while suggesting alternative roles for mtDNA mutations in cancers relying on oxidative phosphorylation."
    explanation: >-
      TCGA analysis directly implicates altered mitochondrial function in chRCC
      biology and identifies the tumor as one relying on oxidative
      phosphorylation rather than glycolysis.
  - reference: PMID:12353267
    reference_title: "Somatic mitochondrial DNA mutations in human chromophobe renal cell carcinomas."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 6 somatic nucleotide changes in 5 out of the 8 chromophobe RCCs."
    explanation: >-
      Whole-mitochondrial-genome sequencing establishes that somatic mtDNA
      mutations occur in the majority of chRCCs. Marked PARTIAL because the same
      study explicitly declines to attribute a causal role to them.
- name: Indolent Chromophobe Tumor Growth
  biological_scale: TISSUE
  description: >-
    The convergent result is a solitary, well-circumscribed renal cortical tumor
    that is frequently large at diagnosis yet behaves as a tumor of low malignant
    potential, with 5-year survival reported between 78% and 100%. The
    dissociation between tumor size and metastatic risk distinguishes chRCC from
    clear cell RCC and underlies its favorable prognosis.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Sarcomatoid Dedifferentiation
    description: >-
      A minority of tumors undergo high-grade dedifferentiation.
  evidence:
  - reference: PMID:18813125
    reference_title: "Chromophobe renal cell carcinoma: histomorphologic characteristics and evaluation of conventional pathologic prognostic parameters in 145 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The aggregate literature suggests that chromophobe renal cell carcinoma (RCC) is biologically a tumor of low malignant potential with reported 5-year and 10-year survival rates of 78% to 100% and 80% to 90%, respectively."
    explanation: >-
      Establishes the low-malignant-potential behavior and the survival range
      curated on this node.
- name: Sarcomatoid Dedifferentiation
  biological_scale: TISSUE
  description: >-
    A minority of chRCC undergoes sarcomatoid (spindle-cell) transformation.
    This is the principal adverse prognostic event in the disease and converts an
    otherwise indolent tumor into aggressive, systemic-therapy-requiring disease.
    Unlike the conventional tumor, sarcomatoid chRCC is associated with
    chromosomal gains rather than the characteristic loss pattern.
  downstream:
  - target: Metastatic Dissemination
    description: >-
      Dedifferentiated tumors account for a disproportionate share of metastatic
      chRCC.
  evidence:
  - reference: PMID:18813125
    reference_title: "Chromophobe renal cell carcinoma: histomorphologic characteristics and evaluation of conventional pathologic prognostic parameters in 145 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sarcomatoid change was present in 12/145 (8%) tumors."
    explanation: >-
      Quantifies the frequency of sarcomatoid change in a 145-case
      clinicopathologic series.
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chromosomal gains are known to be associated with sarcomatoid ChRCCs"
    explanation: >-
      Supports the distinct copy-number profile of sarcomatoid chRCC relative to
      the loss-dominated conventional tumor.
- name: Metastatic Dissemination
  biological_scale: ORGANISM
  description: >-
    Between 5% and 10% of chRCC ultimately metastasizes. Metastatic tumors are
    genomically distinguishable from non-metastatic ones by enrichment for TP53
    mutation, PTEN mutation and imbalanced chromosome duplication - the
    duplication of three or more chromosomes on top of the baseline loss
    pattern - and the presence of these features in a primary tumor is
    associated with worse survival.
  evidence:
  - reference: PMID:28614790
    reference_title: "Genomic landscape and evolution of metastatic chromophobe renal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our study provides genomic insights into the metastatic progression of chRCC and identifies TP53 mutations, PTEN mutations, and ICD as high-risk features"
    explanation: >-
      Identifies the three genomic features that distinguish metastatic from
      non-metastatic chRCC, which is what this node models.
histopathology:
- name: Chromophobe Renal Cell Carcinoma
  finding_term:
    preferred_term: Chromophobe Renal Cell Carcinoma
    term:
      id: NCIT:C4146
      label: Chromophobe Renal Cell Carcinoma
  frequency: VERY_FREQUENT
  description: >-
    Large polygonal cells with pale, finely reticulated cytoplasm, sharply
    defined plant-cell-like membranes, perinuclear halos and irregular
    raisinoid nuclear contours. Two morphologic variants are recognized,
    classic and eosinophilic.
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ChRCCs are considered to originate from the intercalated cell of distal tubules with two main morphological variants, classic and eosinophilic."
    explanation: >-
      Establishes the two-variant morphologic classification of chRCC.
- name: CD117 and CK7 Immunoprofile
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    CD117 (KIT) positivity together with CK7 expression is the workhorse
    immunohistochemical panel for confirming chRCC and excluding its mimics.
    CK7 is diffuse and uniform in the classic variant but rare or patchy in the
    eosinophilic variant, which is precisely why the eosinophilic variant is
    difficult to separate from oncocytoma.
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Along with positive CD117 expression, classic ChRCCs generally express diffuse and uniform CK7, while eosinophilic variant demonstrates more heterogeneous CK7 expression (rare or patchy)."
    explanation: >-
      States the CD117/CK7 immunoprofile and its variant-dependent pattern.
- name: Sarcomatoid Differentiation
  finding_term:
    preferred_term: Sarcomatoid Features
    term:
      id: NCIT:C39694
      label: Sarcomatoid Features
  frequency: OCCASIONAL
  description: >-
    Spindle-cell dedifferentiation, present in roughly 8% of resected tumors and
    the strongest adverse morphologic prognostic feature in chRCC.
  evidence:
  - reference: PMID:18813125
    reference_title: "Chromophobe renal cell carcinoma: histomorphologic characteristics and evaluation of conventional pathologic prognostic parameters in 145 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sarcomatoid change was present in 12/145 (8%) tumors."
    explanation: >-
      Provides the frequency of sarcomatoid change underpinning the OCCASIONAL
      band assigned here (8% falls in the 5-29% range).
imaging_findings:
- name: Spoke-Wheel Enhancement with Central Scar
  modality: CT
  description: >-
    A central stellate scar with spoke-wheel-pattern enhancement on
    contrast-enhanced CT is a recognized but minority finding in chRCC, reported
    in roughly a quarter of cases. It is not specific: the same appearance is
    classically associated with renal oncocytoma, which is chRCC's principal
    benign mimic, so it cannot substitute for tissue diagnosis.
  evidence:
  - reference: PMID:15479284
    reference_title: "Spoke-wheel-like enhancement as an important imaging finding of chromophobe cell renal carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enhanced CT scans showed a spoke-wheel-like enhancement with a central scar in 3 patients (27%)."
    explanation: >-
      Quantifies the frequency of the spoke-wheel enhancement pattern in a
      retrospective imaging series of chRCC.
phenotypes:
- category: Genitourinary
  name: Renal Mass
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    chRCC presents as a solid renal cortical mass, usually solitary and
    unilateral in sporadic disease and typically detected incidentally on
    imaging performed for another indication. Tumors are frequently large at
    diagnosis, averaging 8 cm, without this implying the aggressive behavior
    that size would predict in clear cell RCC.
  phenotype_term:
    preferred_term: Renal cell carcinoma
    term:
      id: HP:0005584
      label: Renal cell carcinoma
    onset:
      onset_category: ADULT
      mean_age_years: 59.0
      min_age_years: 27.0
      max_age_years: 82.0
      notes: >-
        Mean age and range from a 145-case surgical series. chRCC is an
        adult-onset tumor, on average somewhat younger than clear cell RCC.
  evidence:
  - reference: PMID:18813125
    reference_title: "Chromophobe renal cell carcinoma: histomorphologic characteristics and evaluation of conventional pathologic prognostic parameters in 145 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most tumors were well circumscribed and averaged 8.0 cm (range, 1.0 to 30.0 cm); multifocality and bilaterality were present in 8% and 3% of patients."
    explanation: >-
      Characterizes the renal mass in a 145-case series: well circumscribed,
      large, and usually unifocal and unilateral.
  - reference: PMID:18813125
    reference_title: "Chromophobe renal cell carcinoma: histomorphologic characteristics and evaluation of conventional pathologic prognostic parameters in 145 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of the patients was 59 years (range, 27 to 82)"
    explanation: >-
      Provides the mean age and age range underlying the adult-onset annotation
      on this phenotype.
- category: Genitourinary
  name: Hematuria
  description: >-
    Gross or microscopic hematuria may occur, typically with larger or locally
    advanced tumors invading the collecting system. It forms part of the classic
    but now uncommon triad with flank pain and a palpable mass.
  phenotype_term:
    preferred_term: Hematuria
    term:
      id: HP:0000790
      label: Hematuria
- category: Genitourinary
  name: Flank Pain
  description: >-
    Flank pain is a presenting feature of larger or locally advanced tumors
    rather than of the incidentally detected small renal mass that now accounts
    for most diagnoses.
  phenotype_term:
    preferred_term: Flank pain

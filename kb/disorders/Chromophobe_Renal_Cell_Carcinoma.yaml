      - reference: PMID:26083655
        reference_title: "Disruption of tubular Flcn expression as a mouse model for renal tumor induction."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Treatment of knockout mice with the mTOR inhibitor rapamycin for 10 months led to the suppression of tumor growth."
        explanation: >-
          Reports the rapamycin rescue measurement underlying this readout.
    evidence:
    - reference: PMID:26083655
      reference_title: "Disruption of tubular Flcn expression as a mouse model for renal tumor induction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mTOR and TGF-β signalings were upregulated in Flcn-deficient tumors, and these two activated pathways may synergetically cause renal tumorigenesis."
      explanation: >-
        Establishes mTOR pathway upregulation in the model's tumors, supporting
        its use as an informative model for this mechanism node.
  - target: Indolent Chromophobe Tumor Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The model generates chromophobe RCC as the predominant histology in
      younger mice, so it reproduces the tumor type, but not the genomic route
      by which humans reach it.
    limitations: >-
      Two mismatches matter. The knockout is targeted to the proximal tubule,
      whereas human chRCC arises from distal nephron intercalated cells. And the
      model reproduces none of the defining sporadic genomics - the
      whole-chromosome loss signature, TP53 mutation, or TERT promoter
      rearrangement. Histology in older knockout mice shifts to papillary RCC,
      so the chromophobe phenotype is also age-dependent.
    readouts:
    - name: Predominant renal tumor histology in mice under one year
      target: Indolent Chromophobe Tumor Growth
      direction: INCREASED
      interpretation: >-
        Chromophobe RCC is the dominant tumor histology in the model at younger

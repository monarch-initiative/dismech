        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Although the majority of the tumors were chromophobe renal cell carcinomas in affected mice under 1 year of age, papillary renal cell carcinomas predominated in the kidneys of older knockout mice."
        explanation: >-
          Reports both the chromophobe-predominant histology in younger mice and

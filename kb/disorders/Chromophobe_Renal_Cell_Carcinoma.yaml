diagnosis:
- name: Renal mass biopsy or nephrectomy specimen
  description: >-
    chRCC is a tissue diagnosis. Core-needle biopsy or the nephrectomy specimen
    is the definitive material, because no blood or urine biomarker is specific
    for the tumor and imaging cannot reliably separate it from oncocytoma.
  diagnosis_term:
    preferred_term: kidney biopsy
    term:
      id: NCIT:C51699
      label: Kidney Biopsy
- name: CD117 and CK7 immunohistochemistry
  description: >-
    The confirmatory immunohistochemical panel. CD117 (KIT) positivity with
    diffuse uniform CK7 supports classic chRCC and argues against oncocytoma
    (CK7 focal or negative) and clear cell RCC (CD117 negative). The panel is
    least decisive for the eosinophilic variant, where CK7 is rare or patchy.
  diagnosis_term:
    preferred_term: immunohistochemistry staining method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Along with positive CD117 expression, classic ChRCCs generally express diffuse and uniform CK7, while eosinophilic variant demonstrates more heterogeneous CK7 expression (rare or patchy)."
    explanation: >-
      States the CD117/CK7 panel and the variant-dependent CK7 pattern that
      determines how decisive it is.
- name: Copy-number testing for the characteristic chromosome losses
  description: >-
    Cytogenetic or copy-number array testing for the combined loss of
    chromosomes 1, 2, 6, 10, 13, 17 and 21 resolves histologically ambiguous
    oncocytic renal tumors, since renal oncocytoma does not carry this pattern.
  diagnosis_term:
    preferred_term: cytogenetic analysis
    term:
      id: NCIT:C18280
      label: Cytogenetic Analysis
  evidence:
  - reference: PMID:19445733
    reference_title: "High-resolution DNA copy number and gene expression analyses distinguish chromophobe renal cell carcinomas and renal oncocytomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, detection of these chromosomal changes can be used for the accurate diagnosis in routine histology."
    explanation: >-
      Explicitly proposes copy-number detection as a routine diagnostic aid for
      separating chRCC from renal oncocytoma.
- name: Germline FLCN testing
  description: >-
    Germline FLCN testing should be considered when chRCC is bilateral or
    multifocal, presents at a young age, shows hybrid oncocytic/chromophobe
    histology, or occurs with fibrofolliculomas or spontaneous pneumothorax -
    the clinical picture of Birt-Hogg-Dube syndrome.
  diagnosis_term:

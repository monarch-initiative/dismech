inheritance:
- name: Autosomal Dominant
  description: >-
    Applies only to the hereditary minority. Sporadic chRCC is a somatically
    driven malignancy with no Mendelian inheritance pattern; the autosomal
    dominant mode applies to the FLCN-mediated Birt-Hogg-Dube predisposition.
treatments:
- name: Nephrectomy
  description: >-
    Surgical resection is the primary and usually curative treatment for
    localized chRCC. Partial nephrectomy is preferred where technically
    feasible, and is strongly favored in Birt-Hogg-Dube syndrome, where further
    tumors are expected over the patient's lifetime and renal function must be
    preserved across repeated operations.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:39196544
    reference_title: "Renal Cell Carcinoma: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment options for RCC confined to the kidney include surgical resection with partial or radical nephrectomy"
    explanation: >-
      Establishes partial or radical nephrectomy as first-line treatment for
      kidney-confined renal cell carcinoma.
- name: mTOR Inhibitor Therapy
  target_mechanisms:
  - target: mTORC1 Pathway Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      Everolimus inhibits mTORC1, the node on which chRCC's recurrent PTEN,
      MTOR, TSC1, TSC2 and NRAS lesions converge. This is the
      mechanism-matched systemic option in chRCC, in contrast to the
      VEGF-directed therapy motivated by VHL-HIF biology in clear cell RCC.
  description: >-
    Everolimus is used in advanced and metastatic chRCC on the rationale that
    the tumor's recurrent lesions converge on mTORC1. Supporting evidence is
    indirect: the randomized ASPEN trial in non-clear cell RCC favored sunitinib
    overall while reporting treatment-effect heterogeneity across histologic
    subtypes, and no adequately powered randomized trial has tested mTOR
    inhibition in chRCC specifically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  evidence:
  - reference: PMID:26794930
    reference_title: "Everolimus versus sunitinib for patients with metastatic non-clear cell renal cell carcinoma (ASPEN): a multicentre, open-label, randomised phase 2 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "one subtype (chromophobe) in which everolimus was associated with a longer median progression-free survival than that of sunitinib."
    explanation: >-
      The chromophobe-specific result from the only randomized comparison in
      this setting. Marked PARTIAL because it is a subgroup finding within a
      trial whose overall result favored sunitinib, not a powered
      chRCC-specific comparison.
  - reference: PMID:26794930
    reference_title: "Everolimus versus sunitinib for patients with metastatic non-clear cell renal cell carcinoma (ASPEN): a multicentre, open-label, randomised phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chromophobe renal cell carcinoma is often found to have activating mutations in the PI3K-mTOR pathway and preclinical sensitivity to rapamycin analogues"
    explanation: >-
      States the mechanistic rationale this treatment is curated on - that chRCC
      carries PI3K-mTOR pathway activation and shows preclinical sensitivity to
      rapamycin analogues.
  - reference: PMID:31335987
    reference_title: "PTEN expression and mutations in TSC1, TSC2 and MTOR are associated with response to rapalogs in patients with renal cell carcinoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "partial response was more frequent in cases with mTOR pathway mutations than in those without mutations"
    explanation: >-
      Links mTOR pathway mutation status to rapalog response in renal cell
      carcinoma, supporting the biomarker rationale. PARTIAL because the cohort
      is renal cell carcinoma broadly rather than chRCC specifically.
- name: VEGFR Tyrosine Kinase Inhibitor Therapy
  description: >-
    VEGFR tyrosine kinase inhibitors such as sunitinib and cabozantinib are used
    in advanced chRCC largely by extrapolation from non-clear cell RCC
    guidelines. The mechanistic rationale is weaker here than in clear cell RCC:
    chRCC lacks the VHL-HIF-VEGF axis that makes clear cell tumors
    hypervascular, and responses are correspondingly less predictable.
  therapeutic_modality: SMALL_MOLECULE

genetic:
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: Somatic inactivating mutations
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    The most frequently mutated gene in chRCC. Reported in roughly a third of
    unselected TCGA cases and 58% of metastatic tumors, where it is one of three
    genomic high-risk features.
  evidence:
  - reference: PMID:28614790
    reference_title: "Genomic landscape and evolution of metastatic chromophobe renal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53 mutations (58%), PTEN mutations (24%), and imbalanced chromosome duplication (ICD, duplication of ≥ 3 chromosomes) (25%) were enriched in M-chRCC."
    explanation: >-
      Quantifies somatic TP53 mutation frequency in metastatic chRCC.
- name: PTEN
  gene_term:
    preferred_term: PTEN
    term:
      id: hgnc:9588
      label: PTEN
  association: Somatic loss-of-function mutations
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    The second most frequently mutated gene in chRCC, and the somatic
    counterpart of the germline PTEN loss that predisposes to renal cell
    carcinoma in Cowden syndrome. PTEN loss releases the brake on PI3K-AKT-mTOR
    signaling and is one of three genomic high-risk features in metastatic
    disease.
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TP53 and PTEN are the two most frequently mutated genes in ChRCCs."
    explanation: >-
      Establishes PTEN as one of the two leading recurrently mutated genes.
- name: TERT
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  association: Somatic promoter structural rearrangement
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Upregulated in chRCC by structural rearrangement of the promoter region
    rather than by the promoter point mutations or amplifications seen in other
    tumor types. The breakpoints are accompanied by localized hypermutation
    (kataegis).
  evidence:
  - reference: PMID:25155756
    reference_title: "The somatic genomic landscape of chromophobe renal cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genomic rearrangements lead to recurrent structural breakpoints within TERT promoter region, which correlates with highly elevated TERT expression and manifestation of kataegis"
    explanation: >-
      Establishes the structural-rearrangement mechanism of TERT upregulation
      that distinguishes chRCC from other cancers.
- name: FLCN
  gene_term:
    preferred_term: FLCN
    term:
      id: hgnc:27310
      label: FLCN
  association: Germline loss-of-function mutations causing Birt-Hogg-Dube syndrome
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE

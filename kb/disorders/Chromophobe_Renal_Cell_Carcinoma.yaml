    explanation: >-
      Supports using the renal tumor histology as the trigger for pursuing a BHD
      diagnosis. Marked PARTIAL because the paper addresses pathologic
      recognition rather than germline testing criteria directly.
differential_diagnoses:
- name: Renal oncocytoma
  disease_term:
    preferred_term: kidney oncocytoma
    term:
      id: MONDO:0003825
      label: kidney oncocytoma
  description: >-
    The principal benign mimic and the reason chRCC diagnosis matters. Both
    tumors are thought to arise from intercalated cells, both may show a central
    scar with spoke-wheel enhancement on CT, and the eosinophilic variant of
    chRCC closely resembles oncocytoma on morphology alone.
  distinguishing_features:
  - >-
    chRCC shows the characteristic combined loss of chromosomes 1, 2, 6, 10, 13,
    17 and 21, which renal oncocytoma lacks; copy-number testing is diagnostic
    in morphologically ambiguous cases.
  - >-
    CK7 is diffuse and uniform in classic chRCC but only focal or negative in
    oncocytoma. This discriminator weakens for the eosinophilic variant of
    chRCC, where CK7 expression is rare or patchy.
  evidence:
  - reference: PMID:19445733
    reference_title: "High-resolution DNA copy number and gene expression analyses distinguish chromophobe renal cell carcinomas and renal oncocytomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified loss of chromosome 2, 10, 13, 17 and 21 as discriminating alteration between chromophobe RCCs and ROs. Therefore, detection of these chromosomal changes can be used for the accurate diagnosis in routine histology."
    explanation: >-
      Establishes the specific copy-number changes that discriminate chRCC from
      renal oncocytoma and their use for routine diagnosis.
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major challenge in the differential diagnosis of ChRCCs includes considerations around the eosinophilic variant (of ChRCCs), where it may share overlapping features with oncocytoma"
    explanation: >-
      Identifies oncocytoma as the principal differential, particularly for the
      eosinophilic variant.
- name: Emerging oncocytic renal tumor entities
  description: >-
    Low-grade oncocytic tumor and eosinophilic solid and cystic RCC are recently
    recognized entities that overlap morphologically with both oncocytoma and
    eosinophilic chRCC, further complicating the oncocytic renal tumor
    differential.
  distinguishing_features:
  - >-
    These entities lack the chRCC whole-chromosome loss signature and carry
    their own immunophenotypic and molecular profiles.
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "it may share overlapping features with oncocytoma or other recent emergent oncocytic tumors"
    explanation: >-
      Supports the existence of newly recognized oncocytic tumor entities in the
      chRCC differential. Marked PARTIAL because the quoted abstract text names
      the category generally rather than the individual entities.
animal_models:
- name: Kidney-specific Flcn knockout mouse
  species: Mouse
  genotype: Conditional Flcn knockout targeted to the renal proximal tubule
  genes:

- discussion_id: chrcc_hypodiploidy_versus_gains
  prompt: >-
    Is the hypodiploid model of chromophobe renal cell carcinoma still accurate,
    given that later studies have documented frequent chromosomal gains
    alongside the classic loss pattern?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Recurrent Whole-Chromosome Loss
  - pathophysiology#Sarcomatoid Dedifferentiation
  rationale: >-
    The long-standing description of chRCC as a hypodiploid tumor comes from
    comparative genomic hybridization studies of the 1990s. Higher-resolution
    methods have since shown a more complex and heterogeneous picture in which
    chromosomal gains are also frequent, and gains are specifically associated
    with sarcomatoid tumors and with metastatic progression through imbalanced
    chromosome duplication. Whether hypodiploidy remains the right summary of
    chRCC genomics, or is better treated as the baseline state on which
    later gains are superimposed during progression, is unsettled and matters
    for how the diagnostic copy-number test is interpreted in aggressive tumors.
  evidence:
  - reference: PMID:33021507
    reference_title: "Comprehensive Review of Numerical Chromosomal Aberrations in Chromophobe Renal Cell Carcinoma Including Its Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was thought for many years that ChRCC exhibits a hypodiploid genome. Recent studies using advanced molecular genetics techniques have shown more complex and heterogenous pattern with frequent chromosomal gains."
    explanation: >-
      Directly states the revision of the hypodiploid model that this discussion
      records as unsettled.
- discussion_id: chrcc_mtdna_driver_or_passenger
  prompt: >-
    Are the somatic mitochondrial DNA mutations found in most chromophobe renal
    cell carcinomas drivers of the tumor's oxidative phenotype, or passengers of
    its mitochondria-rich cell of origin?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mitochondrial Accumulation and Oxidative Metabolic Phenotype
  rationale: >-
    Somatic mtDNA mutations, including frameshifting changes in complex I
    subunit genes, are present in the majority of chRCCs, and the tumor shows
    the highest mitochondrial gene expression among RCC subtypes. But the
    intercalated cell of origin is itself mitochondria-rich, so an oxidative
    phenotype is the expected inheritance rather than necessarily an acquired
    one. The original sequencing study explicitly declined to assign a causal
    role. Resolving this matters therapeutically, because targeting
    mitochondrial metabolism has been proposed as a chRCC-specific vulnerability
    and that proposal presumes a driver role.
  evidence:
  - reference: PMID:12353267
    reference_title: "Somatic mitochondrial DNA mutations in human chromophobe renal cell carcinomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although somatic mtDNA mutations are found in chromophobe RCCs, their role in the maintenance of tumor cell phenotype or in tumorigenesis remains to be elucidated."
    explanation: >-
      The source study states the open question directly, which is what this
      discussion records.

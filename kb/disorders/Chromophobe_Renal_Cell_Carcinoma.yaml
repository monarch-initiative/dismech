name: Chromophobe Renal Cell Carcinoma
creation_date: "2026-08-15T00:00:00Z"
category: Cancer
description: >-
  Chromophobe renal cell carcinoma (chRCC) is the third most common renal cell
  carcinoma subtype, accounting for roughly 5-7% of renal cell carcinomas. It is
  mechanistically distinct from clear cell RCC at almost every level. It arises
  from the intercalated cells of the distal nephron rather than the proximal
  tubule, and it is not driven by VHL loss or HIF stabilization. Its defining
  molecular feature is the combined loss of whole chromosomes 1, 2, 6, 10, 13,
  17 and 21 on a background of a strikingly low point-mutation burden - roughly
  seven chromosome losses against roughly thirty exonic somatic mutations.
  Recurrent point mutations converge on TP53 and on the PTEN-TSC-MTOR axis, and
  telomerase is reactivated by structural rearrangement of the TERT promoter
  rather than by the promoter point mutations seen in other cancers. The tumor
  cell is packed with mitochondria and retains an oxidative,
  electron-transport-chain-dependent metabolic phenotype - the opposite of the
  glycolytic Warburg shift that characterizes VHL-mutant clear cell RCC. Most
  chRCC behaves as a tumor of low malignant potential and is cured by
  nephrectomy; sarcomatoid dedifferentiation identifies the aggressive minority.
  Because the VHL-HIF-VEGF axis that defines clear cell RCC is absent, the
  antiangiogenic and checkpoint strategies built on it are a poor mechanistic
  fit, and mTOR inhibition is the better-motivated systemic option.
categories:
- Genitourinary Cancer
- Solid Tumor
parents:
- renal cell carcinoma
synonyms:
- chromophobe renal cell carcinoma
- chromophobe cell renal carcinoma
- chromophobe carcinoma of kidney
- chromophobe renal cell adenocarcinoma
- ChRCC
has_subtypes:
- name: Classic
  display_name: Classic (pale cell) variant
  subtype_term:
    preferred_term: Classic Variant of Chromophobe Renal Cell Carcinoma
    term:
      id: NCIT:C27888
      label: Classic Variant of Chromophobe Renal Cell Carcinoma
  description: >-
    Composed predominantly of large polygonal cells with pale, finely
    reticulated cytoplasm, sharply drawn cell membranes and perinuclear halos.
    The classic variant expresses CK7 diffusely and uniformly and carries the
    full complement of characteristic whole-chromosome losses.
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "classic ChRCCs generally express diffuse and uniform CK7, while eosinophilic variant demonstrates more heterogeneous CK7 expression (rare or patchy)"
    explanation: >-
      Distinguishes the classic from the eosinophilic variant by CK7 staining
      pattern, supporting the two-variant morphologic split curated here.
- name: Eosinophilic
  display_name: Eosinophilic variant
  subtype_term:
    preferred_term: Eosinophilic Variant of Chromophobe Renal Cell Carcinoma
    term:
      id: NCIT:C27889
      label: Eosinophilic Variant of Chromophobe Renal Cell Carcinoma
  description: >-
    Composed predominantly of cells with granular eosinophilic cytoplasm,
    closely mimicking renal oncocytoma and the emerging oncocytic renal tumor
    entities. CK7 expression is patchy or rare rather than diffuse, which is the
    principal source of diagnostic difficulty in oncocytic renal tumors.
  evidence:
  - reference: PMID:35198391
    reference_title: "Chromophobe renal cell carcinoma: Novel molecular insights and clinicopathologic updates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major challenge in the differential diagnosis of ChRCCs includes considerations around the eosinophilic variant (of ChRCCs), where it may share overlapping features with oncocytoma"
    explanation: >-
      States the diagnostic overlap between the eosinophilic variant and
      oncocytoma that defines this subtype's clinical significance.
- name: BHD-associated
  display_name: Birt-Hogg-Dube syndrome-associated chRCC
  subtype_term:
    preferred_term: Chromophobe Renal Cell Carcinoma Associated with Birt-Hogg-Dube Syndrome
    term:
      id: NCIT:C155951
      label: Chromophobe Renal Cell Carcinoma Associated with Birt-Hogg-Dube Syndrome
  description: >-
    chRCC arising in carriers of a germline FLCN loss-of-function variant.
    Tumors are characteristically multiple and bilateral, present at a younger
    age, and frequently take the form of hybrid oncocytic/chromophobe tumors
    rather than pure chRCC. Nephron-sparing surgery is prioritized because
    further tumors are expected over the patient's lifetime.
  genes:
  - preferred_term: FLCN
    term:
      id: hgnc:27310
      label: FLCN
  evidence:
  - reference: PMID:12459621
    reference_title: "Renal tumors in the Birt-Hogg-Dubé syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resected tumors consisted predominantly of chromophobe renal cell carcinomas (44 of 130, 34%) or of hybrid oncocytic neoplasms that had areas reminiscent of chromophobe renal cell carcinoma and oncocytoma (65 of 130, 50%)."
    explanation: >-
      Systematic pathologic review of 130 BHD renal tumors establishes chRCC and
      hybrid oncocytic/chromophobe tumors as the dominant histologies of this
      hereditary subtype.

    term:
      id: hgnc:27310
      label: FLCN
  publication: PMID:26083655
  description: >-
    Kidney-specific disruption of mouse Flcn produces renal cysts followed by
    early-onset, highly penetrant renal neoplasia in which chromophobe RCC is
    the predominant histology in mice under one year of age. mTOR and TGF-beta
    signaling are upregulated in the resulting tumors, and ten months of
    rapamycin treatment suppresses tumor growth - the preclinical basis for
    mTOR inhibition in FLCN-driven renal tumors.
  modeled_mechanisms:
  - target: mTORC1 Pathway Hyperactivation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Flcn loss activates mTOR signaling in the mouse kidney, reproducing the
      pathway state that PTEN, MTOR, TSC1, TSC2 and FLCN lesions converge on in
      human chRCC.
    limitations: >-
      The model routes to mTORC1 activation exclusively through FLCN loss, so it
      represents the hereditary Birt-Hogg-Dube arm rather than the somatic PTEN
      and MTOR-pathway mutations that drive sporadic disease.
    readouts:
    - name: Renal tumor growth under rapamycin treatment
      target: mTORC1 Pathway Hyperactivation
      direction: DECREASED
      interpretation: >-
        Pharmacologic mTOR inhibition suppresses tumor growth, confirming the
        tumors depend on the mTOR signaling state modeled by this node.

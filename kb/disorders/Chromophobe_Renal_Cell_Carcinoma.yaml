    - preferred_term: cabozantinib
      term:
        id: CHEBI:72317
        label: cabozantinib
  evidence:
  - reference: PMID:26794930
    reference_title: "Everolimus versus sunitinib for patients with metastatic non-clear cell renal cell carcinoma (ASPEN): a multicentre, open-label, randomised phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with metastatic non-clear cell renal cell carcinoma, sunitinib improved progression-free survival compared with everolimus."
    explanation: >-
      The randomized trial's primary conclusion supports sunitinib in metastatic

has_subtypes:
- name: Neonatal onset
  description: >-
    The least frequent and generally most severe presentation, beginning at
    birth with feeding difficulty, tone abnormality, and seizures.
- name: Infantile onset
  description: >-
    The most common presentation, beginning in the first two years with
    neurodevelopmental delay or regression, hypotonia, movement disorder, and
    episodic neurologic deterioration.
- name: Late onset
  description: >-
    A childhood-onset, more slowly progressive presentation dominated by
    movement disorder, sometimes paroxysmal dystonia, and variable cognitive
    impairment.
progression:
- phase: Neonatal presentation
  subtype: Neonatal onset
  age_range: Birth to 29 days
  notes: >-
    Neonatal-onset disease is the least frequent presentation and carries a
    high risk of childhood death; survivors may have severe developmental,
    growth, seizure, and movement-disorder morbidity.
  evidence:
  - reference: PMID:41264763
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neonatal onset, the least frequent phenotype, is characterized by
      hypotonia, seizures, and feeding difficulties at birth. There is a high
      risk of death in childhood, and individuals that survive typically have
      developmental delay, seizures, poor weight gain, and growth deficiency
      and develop a movement disorder.
    explanation: GeneReviews defines the neonatal presentation and its severe course.
- phase: Infantile presentation
  subtype: Infantile onset
  age_range: 1 month to 2 years
  notes: >-
    Infantile onset is the most common presentation and commonly combines
    developmental regression, hypotonia, feeding or vomiting symptoms,
    seizures, movement disorder, and episodic neurologic deterioration.
  evidence:
  - reference: PMID:41264763
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infantile onset is the most common phenotype, presenting in the first two
      years of life with feeding difficulties, vomiting, developmental delay
      with regression, hypotonia, seizures, movement disorder, microcephaly,
      vision impairment, and episodes of neurologic deterioration.
    explanation: GeneReviews defines the infantile presentation and its principal manifestations.
- phase: Later-onset progressive movement disorder
  subtype: Late onset
  age_range: Childhood
  notes: >-
    Later-onset disease is usually more slowly progressive and has greater
    reported survival, although the number of observed patients remains small.
  evidence:
  - reference: PMID:41264763
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Late onset is the second most common phenotype, presenting in childhood
      as a slowly progressive disease with significant movement disorder with
      or without paroxysmal dystonia, variable cognitive impairment, and high
      survivability.
    explanation: GeneReviews describes the later-onset movement-disorder phenotype.
- phase: Illness-associated metabolic-neurologic decompensation
  notes: >-
    Intercurrent illness or another catabolic stress can precipitate acute
    encephalopathy or neurologic deterioration. In a pooled, literature-derived
    series of 40 largely Leigh-spectrum cases, a precipitating cause was
    reported in 18 (45%).
  evidence:
  - reference: PMID:33762937
    reference_title: "Cinical, Metabolic, and Genetic Analysis and Follow-Up of Eight Patients With HIBCH Mutations Presenting With Leigh/Leigh-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Precipitating cause 6 (75%) 12 (38%) 18 (45%)"
    explanation: The pooled case table quantifies reported precipitating events.
  - reference: DOI:10.1159/000508728
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency in a Turkish Child with a Novel HIBCH Gene Mutation and Literature Review
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent metabolic attacks with intercurrent illness"
    explanation: The clinical review identifies intercurrent illness as a trigger for recurrent attacks.
- phase: Variable survival and long-term disability
  notes: >-
    Outcome ranges from survival into adulthood to early death. A pooled,
    literature-ascertained series reported 7 deaths among 40 cases (18%), while
    a geographically restricted eight-person Bahrain cohort sharing one
    homozygous variant reported severe disability and sepsis-related mortality.
  evidence:
  - reference: PMID:33762937
    reference_title: "Cinical, Metabolic, and Genetic Analysis and Follow-Up of Eight Patients With HIBCH Mutations Presenting With Leigh/Leigh-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Death cases 0 7 (22%) 7 (18%)"
    explanation: The pooled table reports death in 7 of 40 literature-derived cases.
  - reference: DOI:10.24911/jbcgenetics.183-1722167696
    reference_title: "Characterization of 3-Hydroxyisobutyryl-Coa Hydrolase (HIBCH) Deficiency in Bahrain: A Retrospective Cohort Study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite clinical interventions, 5 of 8 patients exhibited severe, persistent developmental delay, and 3 patients succumbed to sepsis."
    explanation: This establishes severe outcome in one small, genetically homogeneous regional cohort.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_hibch_reactive_metabolite_model
  hypothesis_label: Canonical HIBCH Reactive-Metabolite Model
  status: CANONICAL
  description: >-
    Loss of HIBCH activity blocks hydrolysis of 3-hydroxyisobutyryl-CoA.
    Accumulated valine-pathway intermediates are associated with
    3-hydroxyisobutyrylcarnitine and methacrylyl-CoA-derived thiol conjugates.
    Reactive intermediate toxicity is proposed to impair mitochondrial proteins
    and energy metabolism, but the causal steps and the reason for selective
    basal-ganglia vulnerability are not fully established in humans.
  evidence:
  - reference: PMID:26163321
    reference_title: "Metabolite studies in HIBCH and ECHS1 defects: Implications for screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine metabolite investigations also showed increases in
      3-hydroxyisobutyryl carnitine, 2,3-dihydroxy-2-methylbutyrate and several
      metabolites indicating accumulation and subsequent metabolism of
      methacrylyl-CoA and acryloyl-CoA.
    explanation: Human metabolite studies support accumulation of valine-derived intermediates.
  - reference: PMID:24299452
    reference_title: HIBCH mutations can cause Leigh-like disease with combined deficiency of multiple mitochondrial respiratory chain enzymes and pyruvate dehydrogenase.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index case had deficiencies of multiple RC enzymes and PDHc in
      skeletal muscle and fibroblasts respectively, but these were normal in his
      younger brother.
    explanation: Human secondary mitochondrial abnormalities support part of the model but their sibling discordance shows that they are not required.
- hypothesis_group_id: emerging_hibch_lysine_methacrylation_model
  hypothesis_label: Emerging Lysine Methacrylation Model
  status: EMERGING
  description: >-
    Cell, patient-fibroblast, and Drosophila experiments implicate ectopic
    protein lysine methacrylation in mitochondrial morphology and respiratory
    defects. This is an emerging preclinical mechanism and does not establish a
    human therapy.
  evidence:
  - reference: PMID:40056416
    reference_title: Ectopic protein lysine methacrylation contributes to defects caused by loss of HIBCH or ECHS1.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts from patients with HIBCH or ECHS1 mutations show similar
      mitochondrial changes and elevated Kmea, which are significantly reversed
      by administering N-acetyl-L-cysteine to reduce Kmea levels.
    explanation: Patient fibroblasts support an in-vitro methacrylation phenotype and experimental rescue.
  - reference: PMID:40056416
    reference_title: Ectopic protein lysine methacrylation contributes to defects caused by loss of HIBCH or ECHS1.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reducing Kmea modification partially rescues mitochondrial morphology
      changes in cells and eye degeneration in flies.
    explanation: Rescue in flies is preclinical and cannot be interpreted as clinical efficacy.

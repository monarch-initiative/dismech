name: 3-hydroxyisobutyryl-CoA hydrolase deficiency
creation_date: "2026-04-15T00:00:00Z"
category: Mendelian
description: >-
  3-hydroxyisobutyryl-CoA hydrolase (HIBCH) deficiency is an autosomal
  recessive disorder of mitochondrial valine catabolism caused by biallelic
  pathogenic HIBCH variants. The clinical spectrum ranges from severe neonatal
  or infantile neurodegeneration with metabolic decompensation and Leigh-like
  basal-ganglia injury to later-onset progressive movement disorder.

      The diagnosis of HIBCH deficiency is established in a proband with
      characteristic clinical, laboratory, and brain imaging findings and
      biallelic pathogenic variants in HIBCH identified by molecular genetic
      testing.
    explanation: GeneReviews identifies molecular detection of biallelic pathogenic variants as confirmatory.
  - reference: PMID:33762937
    reference_title: "Cinical, Metabolic, and Genetic Analysis and Follow-Up of Eight Patients With HIBCH Mutations Presenting With Leigh/Leigh-Like Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the targeted NGS testing is costly, and it can not identify possible
      pathogenic variants in deep intron regions and larger
      deletions/duplications.
    explanation: The cohort report identifies relevant limitations of targeted sequencing.
- name: Supportive biochemical testing
  description: >-
    Plasma or dried-blood-spot acylcarnitines and urine organic-acid or
    specialized thiol-conjugate testing can provide biochemical clues. Normal
    C4-OH or routine metabolites do not exclude the disease, and
    nonchromatographic C4-OH is not specific.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Specific 3-hydroxyisobutyrylcarnitine, SCPC/SCPCM species, or
    2,3-dihydroxy-2-methylbutyrate can support suspicion but require molecular
    confirmation.
  evidence:
  - reference: PMID:26163321
    reference_title: "Metabolite studies in HIBCH and ECHS1 defects: Implications for screening."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, we observed normal hydroxy-C4 carnitine levels in one out of two
      dried blood spots collected after the neonatal period.
    explanation: Normal C4-OH can occur after the neonatal period.
  - reference: PMID:26163321
    reference_title: "Metabolite studies in HIBCH and ECHS1 defects: Implications for screening."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased hydroxy-C4 carnitine is therefore not speciﬁc for HIBCHD"
    explanation: The metabolite study directly states the C4-OH specificity limitation.
- name: HIBCH enzyme assay in cultured fibroblasts
  description: >-
    Specialized measurement of HIBCH activity in cultured skin fibroblasts can
    provide functional confirmation when molecular or biochemical findings are
    uncertain.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Markedly decreased or absent HIBCH activity supports the diagnosis.
  evidence:
  - reference: PMID:24299452
    reference_title: HIBCH mutations can cause Leigh-like disease with combined deficiency of multiple mitochondrial respiratory chain enzymes and pyruvate dehydrogenase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblast HIBCH activity was below detectable limits in both patients"
    explanation: Direct fibroblast testing established the functional enzyme defect in affected siblings.
- name: Brain MRI
  description: >-
    Brain MRI characterizes the Leigh-like pattern, especially bilateral
    pallidal or broader basal-ganglia lesions, but the imaging pattern is
    supportive rather than specific or confirmatory.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Bilateral basal-ganglia lesions support a Leigh-spectrum presentation and direct etiologic testing.
  evidence:
  - reference: DOI:10.1038/s41439-023-00251-y
    reference_title: Leigh-like syndrome with progressive cerebellar atrophy caused by novel HIBCH variants
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain magnetic resonance imaging (MRI) shows bilateral lesions in the basal ganglia with/without brainstem involvement."
    explanation: The report summarizes the characteristic but nonspecific imaging pattern.
differential_diagnoses:
- name: ECHS1 deficiency
  disease_term:
    preferred_term: mitochondrial short-chain Enoyl-CoA hydratase 1 deficiency
    term:
      id: MONDO:0014563
      label: mitochondrial short-chain Enoyl-Coa hydratase 1 deficiency
  description: >-
    ECHS1 acts immediately upstream of HIBCH and can be clinically and
    biochemically very similar. Chromatographic detection of increased
    3-hydroxyisobutyrylcarnitine favors HIBCH deficiency, whereas many other
    urine intermediates overlap.
  distinguishing_features:
  - Increased specific 3-hydroxyisobutyrylcarnitine supports HIBCH deficiency over ECHS1 deficiency.
  - SCPC, SCPCM, and 2,3-dihydroxy-2-methylbutyrate can occur in both disorders.
  evidence:
  - reference: PMID:26163321
    reference_title: "Metabolite studies in HIBCH and ECHS1 defects: Implications for screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the exception of 3-hydroxyisobutyryl carnitine, the metabolite
      abnormalities were essentially the same as those observed in patients
      with ECHS1 mutations
    explanation: The metabolite study supplies a direct biochemical discriminator.
- name: Primary pyruvate dehydrogenase deficiency
  disease_term:
    preferred_term: pyruvate dehydrogenase deficiency
    term:
      id: MONDO:0019169
      label: pyruvate dehydrogenase deficiency
  description: >-
    HIBCH deficiency can present with secondary PDH-complex deficiency and a
    Leigh-like phenotype. Molecular and HIBCH-specific biochemical testing
    distinguish the secondary finding from a primary PDH disorder.
  evidence:
  - reference: PMID:24299452
    reference_title: HIBCH mutations can cause Leigh-like disease with combined deficiency of multiple mitochondrial respiratory chain enzymes and pyruvate dehydrogenase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HIBCH deficiency, a disorder of valine catabolism, is a novel cause of
      the multiple mitochondrial dysfunctions syndrome, and should be considered
      in the differential diagnosis of patients presenting with multiple RC
      deficiencies and/or pyruvate dehydrogenase deficiency.
    explanation: The sibling study explicitly identifies the PDH/respiratory-chain diagnostic context.
- name: Other Leigh syndrome spectrum etiologies
  disease_term:
    preferred_term: Leigh syndrome
    term:
      id: MONDO:0009723
      label: Leigh syndrome
  description: >-
    Leigh syndrome is a presentation umbrella that HIBCH deficiency can cause,
    rather than a mutually exclusive diagnosis. Other mitochondrial and nuclear
    etiologies must be distinguished through molecular testing and
    disease-specific biochemical clues.
  evidence:
  - reference: PMID:33762937
    reference_title: "Cinical, Metabolic, and Genetic Analysis and Follow-Up of Eight Patients With HIBCH Mutations Presenting With Leigh/Leigh-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Applying next-generation sequencing, we identified eight patients with
      HIBCH mutations from our cohort of 181 cases of genetically diagnosed
      Leigh/Leigh-like syndrome.
    explanation: HIBCH deficiency was identified as one molecular cause within a Leigh/Leigh-like cohort.
- name: Propionic and methylmalonic acidemias
  description: >-
    Propionate-pathway disorders can share 2,3-dihydroxy-2-methylbutyrate and
    acryloyl-CoA-related metabolites. SCPC/SCPCM patterns, acylcarnitines,
    organic acids, and molecular testing distinguish these disorders.
  evidence:
  - reference: PMID:26163321
    reference_title: "Metabolite studies in HIBCH and ECHS1 defects: Implications for screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The metabolites derived from acryloyl-CoA were also increased in patients
      with inborn errors of propionyl-CoA metabolism
    explanation: The metabolite study documents overlap with propionyl-CoA disorders.
  - reference: PMID:37309295
    reference_title: "Acyl-CoA dehydrogenase substrate promiscuity: Challenges and opportunities for development of substrate reduction therapy in disorders of valine and isoleucine metabolism."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Toxicity of accumulating substrates is a significant problem in several
      disorders of valine and isoleucine degradation notably short-chain
      enoyl-CoA hydratase (ECHS1 or crotonase) deficiency,
      3-hydroxyisobutyryl-CoA hydrolase (HIBCH) deficiency, propionic acidemia
      (PA), and methylmalonic aciduria (MMA).
    explanation: The review places HIBCH, ECHS1, propionic acidemia, and methylmalonic aciduria in an overlapping metabolic context.
treatments:
- name: Valine-restricted diet
  therapeutic_modality: BEHAVIORAL
  description: >-
    Valine restriction is the expert-recommended targeted dietary approach,
    intended to reduce substrate flux into the impaired pathway. Evidence is
    limited to small uncontrolled reports and expert experience; no consensus
    protocol, controlled efficacy estimate, or universal age-specific valine
    target is established.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Reactive valine-derived intermediate accumulation
    treatment_effect: INHIBITS
    description: Reduced valine intake is intended to decrease formation of reactive valine-derived intermediates.
    evidence:
    - reference: PMID:41264763
      reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MANAGEMENT: Targeted therapy: Valine-restricted diet."
      explanation: GeneReviews identifies valine restriction as mechanism-targeted care.
  evidence:
  - reference: PMID:41264763
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MANAGEMENT: Targeted therapy: Valine-restricted diet. As seen in other
      metabolic disorders, treatment using special formulas (medical food) can
      be implemented successfully via oral route in individuals diagnosed
      within the first few months of life.
    explanation: GeneReviews describes practical implementation while not supplying a controlled efficacy estimate.
  - reference: PMID:33762937
    reference_title: "Cinical, Metabolic, and Genetic Analysis and Follow-Up of Eight Patients With HIBCH Mutations Presenting With Leigh/Leigh-Like Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is currently no consensus on HIBCH deﬁciency treatment approaches.
      A low-valine, carbohydrate-rich diet may be effective
    explanation: The clinical cohort explicitly identifies lack of consensus and uses cautious efficacy language.
- name: Prevention of catabolism
  description: >-
    Avoidance of prolonged fasting and individualized sick-day planning are
    intended to reduce catabolic stress. Acute illness management should be
    directed by a metabolic specialist; the cached evidence does not define a
    validated universal emergency protocol.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Illness-associated acute neurometabolic decompensation
    treatment_effect: INHIBITS
    description: Preventing catabolism is intended to reduce illness-associated decompensation risk.
  evidence:
  - reference: PMID:41264763
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "prevent catabolism"
    explanation: GeneReviews includes prevention of catabolism among management precautions.
- name: Symptom-directed supportive care
  description: >-
    Multidisciplinary care addresses development, feeding, spasticity,
    epilepsy, movement disorder, vision, hearing, mobility, and family support.
    These interventions treat manifestations rather than the enzymatic defect.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41264763
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive care: Developmental and educational support; feeding therapy
      with gastrostomy tube as needed; standard treatments for spasticity and
      epilepsy; treatment of movement disorder per movement disorder
      specialist; management of ocular issues per ophthalmologist with low
      vision services as needed
    explanation: GeneReviews defines concrete multidisciplinary supportive care.
- name: Avoidance of selected mitochondrial and dietary stressors
  description: >-
    GeneReviews conditionally advises avoiding sodium valproate when possible
    because of secondary mitochondrial abnormalities, careful anesthesia use,
    and avoidance of prolonged propofol. It more directly advises against
    ketogenic or modified Atkins diets and lists triheptanoin as
    contraindicated; these are expert precautions rather than comparative-trial
    findings.
  treatment_term:
    preferred_term: medical action avoidance
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  evidence:
  - reference: PMID:41264763
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Due to secondary mitochondrial abnormalities it may be beneficial to
      avoid sodium valproate if possible; consider anesthesia use carefully;
      avoid prolonged propofol use
    explanation: GeneReviews uses conditional wording for valproate and peri-anesthetic precautions.
  - reference: PMID:41264763
    reference_title: 3-Hydroxyisobutyryl-CoA Hydrolase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ketogenic / modified Atkins diets should be avoided due to potential side
      effects; triheptanoin is contraindicated due to the potential increase in
      propionyl-CoA
    explanation: GeneReviews provides the stronger diet and triheptanoin avoidance language.
discussions:
- discussion_id: gap_hibch_reactive_metabolite_mechanism
  prompt: >-
    Which methacrylyl-CoA-derived protein modifications drive human neural
    injury, and why are secondary PDH and respiratory-chain defects variable?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reactive valine-derived intermediate accumulation
  - pathophysiology#Variable secondary PDH and respiratory-chain dysfunction
  rationale: >-
    Human metabolites support reactive-intermediate accumulation, but thiol
    adduction, glutathione depletion, lysine methacrylation, mitochondrial
    dysfunction, and selective basal-ganglia vulnerability have not been joined
    into a validated human causal chain.
  evidence:
  - reference: PMID:24299452
    reference_title: HIBCH mutations can cause Leigh-like disease with combined deficiency of multiple mitochondrial respiratory chain enzymes and pyruvate dehydrogenase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index case had deficiencies of multiple RC enzymes and PDHc in
      skeletal muscle and fibroblasts respectively, but these were normal in his
      younger brother.
    explanation: Affected siblings demonstrate variable secondary mitochondrial findings.
  - reference: PMID:40056416
    reference_title: Ectopic protein lysine methacrylation contributes to defects caused by loss of HIBCH or ECHS1.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We propose that ectopic Kmea modification mediates the defects caused by HIBCH- or ECHS1-deficiency."
    explanation: The newest methacrylation model remains an experimental proposal.
- discussion_id: gap_hibch_valine_restriction
  prompt: >-
    What valine targets, age at initiation, monitoring strategy, and nutritional
    safeguards provide meaningful long-term clinical benefit?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Valine-restricted diet
  rationale: >-
    Valine restriction is mechanism-directed and recommended by experts, but
    published outcomes are uncontrolled, regimens vary, and natural history is
    heterogeneous.
  evidence:
  - reference: PMID:33762937
    reference_title: "Cinical, Metabolic, and Genetic Analysis and Follow-Up of Eight Patients With HIBCH Mutations Presenting With Leigh/Leigh-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is currently no consensus on HIBCH deﬁciency treatment approaches."
    explanation: The cohort review directly identifies the sparse and heterogeneous treatment evidence.
- discussion_id: gap_hibch_biomarker_and_screening_validation
  prompt: >-
    Can isomer-resolved C4-OH, SCPC/SCPCM species, or a combined panel achieve
    adequate sensitivity and specificity for diagnosis or newborn screening?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#3-hydroxyisobutyrylcarnitine (C4-OH)
  - biochemical#Urinary S-(2-carboxypropyl)cysteine and its carnitine ester
  - biochemical#Urinary S-(2-carboxypropyl)cysteamine
  - diagnosis#Supportive biochemical testing
  rationale: >-
    C4-OH is neither universal nor specific without isomer separation, while
    promising thiol-conjugate markers have very small selected denominators and
    require specialized methods. Screening thresholds and clinical benefit are
    not validated.
  evidence:
  - reference: PMID:26163321
    reference_title: "Metabolite studies in HIBCH and ECHS1 defects: Implications for screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased hydroxy-C4 carnitine is therefore not speciﬁc for HIBCHD"
    explanation: The paper identifies both the limitation and a candidate combined approach.
  - reference: PMID:33762937
    reference_title: "Cinical, Metabolic, and Genetic Analysis and Follow-Up of Eight Patients With HIBCH Mutations Presenting With Leigh/Leigh-Like Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "SCPCM seems to be more speci ﬁc for disease diagnosis, but more samples are needed for veriﬁcation."
    explanation: The clinical series explicitly calls for more marker validation.
- discussion_id: interpretation_hibch_variant_location_survival
  prompt: >-
    Can variant position or residual HIBCH activity reliably predict severity
    and survival?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - genetic#HIBCH pathogenic variants
  - progression#Variable survival and long-term disability
  rationale: >-
    A combined ECHS1/HIBCH natural-history analysis reported a survival
    association with HIBCH variant location, but the ultra-rare sample and
    retrospective ascertainment do not support deterministic counseling.
  evidence:
  - reference: DOI:10.1002/jimd.12288
    reference_title: "Delineating the neurological phenotype in children with defects in the <scp><i>ECHS1</i></scp> or <scp><i>HIBCH</i></scp> gene"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among all 89 cases, we observed a longer survival in HIBCH compared to SCEH patients, and in HIBCH patients carrying homozygous mutations on the protein surface compared to those with variants inside/near the catalytic region."
    explanation: The study reports an exploratory variant-location survival association.

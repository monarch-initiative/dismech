      cases" estimate that a single family series supported.
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of a congenital foveopathy with no impact on visual acuity is a major criterion to distinguish SSBP1 cases and orient the appropriate genetic analysis"
    explanation: >-
      States both the diagnostic value of the sign and, explicitly, that it does

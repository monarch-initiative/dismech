    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty-five percent of patients had pigmentary changes on fundus photography"
    explanation: The frequency across the largest published denominator.
  - reference: PMID:31298765
    reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
    supports: SUPPORT

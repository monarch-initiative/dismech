prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Sixty patients with missense SSBP1 variants had been published as of 2023.
    A count of reported cases, not a population rate; no epidemiological
    estimate exists. The count is also an underestimate of carriers, since 11%
    of carriers are asymptomatic and would not come to ascertainment.
  evidence:
  - reference: PMID:37259171
    reference_title: "Maternal mosaicism in SSBP1 causing optic atrophy with retinal degeneration: implications for genetic counseling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 60 published patients with missense SSBP1 variants, optic atrophy was present in 95% of them"
    explanation: The published patient count that this record reports.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous missense variants segregating in multigeneration families, with
    incomplete penetrance. The dominant mechanism is interference with a
    multimeric complex rather than haploinsufficiency, which is what the
    functional work argues.
  evidence:
  - reference: PMID:31550237
    reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified heterozygous missense mutations in single-strand binding protein 1 (SSBP1) in 5 unrelated families"
    explanation: Establishes the heterozygous missense architecture across five independent families.
  - reference: PMID:31298765
    reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which is consistent with the segregation pattern observed in 2 multigeneration families studied"
    explanation: Independent segregation evidence for dominant transmission.
- name: Incomplete penetrance
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  description: >-
    Three of 27 carriers of the recurrent p.Arg38Gln variant were asymptomatic.
    Incomplete penetrance is shared with OPA1-related dominant optic atrophy.
  evidence:
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three SSBP1-patients were asymptomatic, 10 had isolated DOA, and 12 had a combined DOA plus foveopathy."
    explanation: >-
      The penetrance denominator, and the breakdown of the phenotype within a
      single-variant cohort.
pathophysiology:
- name: Heterozygous SSBP1 Missense Variant
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is a heterozygous missense change in SSBP1. The reported
    variants cluster functionally rather than randomly: p.Arg38Gln and
    p.Arg107Gln both replace arginines within a basic patch essential for
    single-stranded DNA binding, so the loss of positive charge is the shared
    consequence. A third variant, p.Ser141Asn, has also been reported.
  genes:
  - preferred_term: SSBP1
    term:
      id: hgnc:11317
      label: SSBP1
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31298765
    reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We defined a new ADOA locus on 7q33-q35 and identified 3 different missense variants in SSBP1"
    explanation: >-
      The allelic series. The quote stops before the variant list because the
      reference validator strips bracketed spans such as [p.(Arg38Gln)] before
      matching, so a snippet spanning them cannot verify; the three protein
      changes are named in this node's description instead.
  - reference: PMID:31298765
    reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The mutated arginine residues are part of a basic patch that is essential for single-strand DNA binding."
    explanation: >-
      Locates the two recurrent variants in a functionally defined region, which
      is what makes the allelic clustering mechanistically interpretable.
  downstream:
  - target: Destabilised SSBP1 Dimer and Tetramer Assembly
    causal_link_type: DIRECT
    description: >-
      The substituted residues sit at the dimer interface and in the DNA-binding
      region, so the immediate consequence is on assembly of the functional
      multimer.
- name: Destabilised SSBP1 Dimer and Tetramer Assembly
  biological_scale: MOLECULAR
  description: >-
    SSBP1 works as a multimer. A revised crystal structure determined alongside
    the founding clinical report showed that both recurrent mutations affect
    dimer interactions and are predicted to distort the DNA-binding region, and
    patient fibroblasts confirmed that the R38Q variant destabilises dimer and
    tetramer formation.

    This node carries the dominant-negative claim, and it is the right place for
    it: a variant subunit that poisons a shared multimer explains dominance,
    whereas simple loss of one allele's product would not. The zebrafish work
    supports the same conclusion from the opposite direction - injecting mutant
    mRNA reproduced the effect of knocking the endogenous transcript down, which
    is the signature of interference rather than of insufficiency.
  molecular_functions:
  - preferred_term: single-stranded DNA binding
    modifier: DECREASED
    term:
      id: GO:0003697
      label: single-stranded DNA binding
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31550237
    reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Structural analysis suggested that both mutations affect dimer interactions and presumably distort the DNA-binding region."
    explanation: >-
      The structural basis, quoted with the authors' own hedging ("suggested",
      "presumably") intact.
  - reference: PMID:31550237
    reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we validated that the R38Q variant destabilizes SSBP1 dimer/tetramer formation, affects mtDNA replication, and induces mtDNA depletion"
    explanation: >-
      Experimental confirmation in patient fibroblasts, and the observation that
      chains this node to the two below it.
  - reference: PMID:31298765
    reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A similar effect was achieved when mutated mRNAs were administered."
    explanation: >-
      Mutant mRNA phenocopies knockdown in zebrafish, which is the functional
      signature of a dominant-negative rather than a haploinsufficient allele.
  downstream:
  - target: Impaired Mitochondrial DNA Replication
    causal_link_type: DIRECT
    description: >-
      A destabilised multimer with reduced affinity for single-stranded DNA
      cannot support replication normally.
- name: Impaired Mitochondrial DNA Replication
  biological_scale: MOLECULAR
  description: >-
    SSBP1 coats and protects the single-stranded template at the mitochondrial
    replication fork, and is described as a crucial component of the mtDNA
    replication machinery. Patient fibroblasts carrying R38Q show impaired
    replication directly.
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    modifier: DECREASED
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31550237
    reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "affects mtDNA replication, and induces mtDNA depletion"
    explanation: The replication defect measured in patient cells, and its immediate consequence.
  downstream:
  - target: Mitochondrial DNA Depletion
    causal_link_type: DIRECT
    description: Failure to replicate the mitochondrial genome reduces its copy number.
- name: Mitochondrial DNA Depletion
  biological_scale: CELLULAR
  description: >-
    Reduced mtDNA copy number in patient cells. This places SSBP1 disease within
    the mtDNA maintenance disorders, whose other members generally cause severe
    multisystem neurological disease.

    A proposed reconciliation exists and is worth stating rather than treating
    the tissue distribution as simply unexplained: severity may be proportional
    to residual mtDNA levels, with different variants having different effects
    on tetramer abundance and activity and so producing a gradient of depletion,
    against a threshold that must be exceeded in an organ for it to be affected.
    On that account the predominantly ocular presentation of p.Arg38Gln is the
    mild end of one continuum rather than a categorically different disease from
    the syndromic alleles. The proposal has not been tested by measuring
    depletion across tissues.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31550237
    reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the R38Q variant destabilizes SSBP1 dimer/tetramer formation, affects mtDNA replication, and induces mtDNA depletion"
    explanation: >-
      Demonstrates depletion as the cellular endpoint, and shows the whole chain
      from multimer destabilisation through replication failure to depletion
      measured in one experiment on patient-derived cells.
  - reference: PMID:31550237
    reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in genes encoding components of the mitochondrial DNA (mtDNA) replication machinery cause mtDNA depletion syndromes (MDSs), which associate ocular features with severe neurological syndromes."
    explanation: Places the disease in its mechanistic class.
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the severity of the SSBP1-related diseases might be proportional to the residual mtDNA levels in patients"
    explanation: >-
      The proposed dose-response account of why alleles differ in how much of
      the body they affect, quoted with the authors' "might" intact.
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSBP1 variants could have different consequences on tetramer abundance and activity, which would lead to a gradient of mtDNA depletion"
    explanation: >-
      Ties the proposed severity gradient back to the tetramer-assembly node,
      making it a testable extension of this entry's mechanism rather than a
      separate hypothesis.
  downstream:
  - target: Retinal Ganglion Cell Vulnerability and Optic Nerve Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Why depletion should injure retinal ganglion cells preferentially, rather
      than tissues with comparable or higher energy demand, is not established.
  - target: Foveal Photoreceptor Maldevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The foveal defect appears congenital and does not progress, so it is
      curated as a developmental rather than a degenerative consequence.
- name: Retinal Ganglion Cell Vulnerability and Optic Nerve Degeneration
  biological_scale: TISSUE
  description: >-
    Loss of retinal ganglion cells and their axons is the constant feature of
    the disease. Zebrafish knockdown of endogenous ssbp1 compromises
    differentiation of retinal ganglion cells, which argues that the cell type's
    vulnerability is developmental as well as degenerative, and identifies the
    ganglion cell as the directly affected cell rather than an innocent
    downstream casualty of optic nerve disease.
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31298765
    reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Antisense-mediated knockdown of endogenous ssbp1 messenger RNA (mRNA) in zebrafish resulted in compromised differentiation of retinal ganglion cells."
    explanation: >-
      Identifies the retinal ganglion cell as the cell type whose development
      depends on ssbp1, in vivo.
  - reference: PMID:31550237
    reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals presented optic atrophy, associated with foveopathy in half of the cases."
    explanation: Optic atrophy as the invariant clinical feature across the founding families.
- name: Foveal Photoreceptor Maldevelopment
  biological_scale: TISSUE
  description: >-
    A congenital foveopathy, seen as a small defect of the ellipsoid and
    interdigitation lines on macular OCT. Two observations make this
    developmental rather than degenerative, and both are load-bearing: the
    appearance is the same in all patients regardless of age, and it has no
    measurable effect on visual acuity. A progressive photoreceptor process
    would be expected to worsen with age and to cost acuity; this does neither.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The foveopathy, with a tiny defect of the ellipsoid and interdigitation lines, was similar in all patients, independent of age."
    explanation: >-
      Age-independence is the observation that argues for a developmental rather
      than a degenerative lesion.
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no significant statistical differences in terms of visual acuity and SD-OCT measurements between patients with isolated DOA"
    explanation: >-
      The foveopathy does not cost acuity, which is why it is curated as a
      diagnostic marker rather than as a component of the visual disability.
  downstream:
  - target: Late-Onset Rod-Cone Dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Whether the congenital foveal lesion and the late photoreceptor
      degeneration are the same process on different timescales, or two
      independent consequences, is not established.
- name: Late-Onset Rod-Cone Dystrophy
  biological_scale: TISSUE
  description: >-
    A minority of patients develop progressive rod-cone dystrophy in later life,
    with severe visual impairment. In the largest single-variant series this was
    two patients, both over 50. It is the one part of the ocular phenotype that
    is unambiguously progressive, and it is the reason the disease name carries
    "retinal abnormalities" as well as optic atrophy.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients over 50 years of age developed a progressive rod-cone dystrophy, leading to severe visual impairment."
    explanation: >-
      The frequency and age dependence of the progressive retinal component,
      with its denominator of 27 given elsewhere in the same series.
genetic:
- name: SSBP1
  gene_term:
    preferred_term: SSBP1
    term:
      id: hgnc:11317
      label: SSBP1
  relationship_type: CAUSATIVE
  notes: >-
    SSBP1 encodes the mitochondrial single-stranded DNA-binding protein, a
    component of the mtDNA replication machinery that works as a multimer. The
    recurrent p.Arg38Gln allele accounts for most reported patients and was the
    variant characterised in the largest phenotype series.

    Germline mosaicism has been documented in an unaffected transmitting mother,
    which is directly relevant to counselling: an apparently de novo variant in
    this gene cannot be assumed to carry negligible recurrence risk for
    subsequent pregnancies.
  variants:
  - name: p.Arg38Gln
    description: >-
      NM_001256510.1:c.113G>A. The recurrent allele, and the one for which
      functional and phenotypic data are most complete: it destabilises dimer and
      tetramer formation in patient fibroblasts, and it is the variant carried by
      the 27-patient series that defined the foveopathy.
    clinical_significance: PATHOGENIC
    functional_effects:
    - type: dominant-negative
      description: >-
        Replaces an arginine in the basic patch required for single-stranded DNA
        binding and destabilises the multimer. Dominance is attributed to
        interference with the shared complex rather than to loss of one allele's
        product.
    evidence:
    - reference: PMID:31550237
      reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using patient fibroblasts, we validated that the R38Q variant destabilizes SSBP1 dimer/tetramer formation"
      explanation: The functional characterisation of this specific allele in patient-derived cells.
  - name: p.Arg107Gln
    description: >-
      NM_001256510.1:c.320G>A. The second recurrent allele, affecting the other
      arginine of the same basic patch, and shown by structural analysis to
      affect dimer interactions in the same way.
    clinical_significance: PATHOGENIC
    functional_effects:
    - type: dominant-negative
      description: >-
        Loss of a positive charge in the single-stranded DNA-binding patch, with
        the same predicted effect on dimer interactions as p.Arg38Gln.
    evidence:
    - reference: PMID:31298765
      reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The loss of a positive charge at these positions is very likely to lower the affinity of SSBP1 for single-strand DNA."
      explanation: >-
        The predicted biophysical consequence shared by both recurrent arginine
        substitutions, quoted with its hedge intact.
  evidence:
  - reference: PMID:31550237
    reference_title: Dominant mutations in mtDNA maintenance gene SSBP1 cause optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study showing that mutations in SSBP1 cause a form of dominant optic atrophy frequently accompanied with foveopathy brings insights into mtDNA maintenance disorders."
    explanation: The authors' causal conclusion for the gene-disease relationship.
  - reference: PMID:37259171
    reference_title: "Maternal mosaicism in SSBP1 causing optic atrophy with retinal degeneration: implications for genetic counseling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OPA13 is caused by heterozygous mutation in the SSBP1 gene, associated with variable mitochondrial dysfunctions."
    explanation: Independent confirmation of the gene-disease relationship and its dominant mode.
phenotypes:

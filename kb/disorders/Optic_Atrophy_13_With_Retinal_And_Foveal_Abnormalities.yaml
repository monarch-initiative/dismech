name: Optic Atrophy 13 With Retinal and Foveal Abnormalities
creation_date: "2026-08-30T03:20:00Z"
category: Mendelian
disease_term:
  preferred_term: optic atrophy 13 with retinal and foveal abnormalities
  term:
    id: MONDO:0008135
    label: optic atrophy 13 with retinal and foveal abnormalities
description: >-
  An autosomal dominant optic neuropathy caused by heterozygous missense
  variants in SSBP1, which encodes the mitochondrial single-stranded
  DNA-binding protein. Optic atrophy is the constant feature; about half of
  affected individuals additionally have a congenital foveopathy, and a minority
  develop progressive rod-cone dystrophy in later life.

  The clinical picture overlaps closely with the far commoner OPA1-related
  dominant optic atrophy, and the practical value of recognising it is that the
  foveopathy distinguishes the two. That foveopathy is a diagnostic sign rather
  than a functional burden: visual acuity does not differ measurably between
  patients who have it and patients who do not.

  The disease is not uniformly confined to the eye, and it is important not to
  read it that way. Purely ocular disease is a property of the recurrent
  p.Arg38Gln allele rather than of SSBP1 disease in general: other missense
  variants produce syndromic presentations, and hypothyroidism and renal
  disorder including renal failure are documented in patients carrying other
  alleles. This entry curates both p.Arg38Gln and p.Arg107Gln, so the
  extra-ocular features belong here.
synonyms:
- OPA13
- SSBP1-related dominant optic atrophy
- optic atrophy with retinal and foveal abnormalities
- SSBP1-related optic atrophy and foveopathy
parents:
- optic atrophy
- mitochondrial DNA maintenance disorder
notes: >-
  On the mechanism question. It is tempting to ask whether this disease is
  caused by mtDNA depletion, by a dominant-negative effect on the SSBP1
  tetramer, or by impaired single-stranded DNA binding, and to treat those as
  competing hypotheses. On the published evidence they are not alternatives but
  successive steps in one chain: the missense changes destabilise dimer and
  tetramer formation and distort the DNA-binding region, that impairs mtDNA
  replication, and depletion follows. The pathophysiology below is written as
  that chain, with the dominant-negative claim attached to the step it actually
  describes rather than to the disease as a whole.

  On phenotype scope. An earlier version of this entry described the disease as
  "largely eye-restricted" and built its tissue-selectivity discussion on that
  premise. That was too strong. The ocular restriction is specific to
  p.Arg38Gln; other SSBP1 missense variants give syndromic presentations, and
  extra-ocular features (hypothyroidism, renal failure) are documented. The
  entry now curates those features and states the allele dependence.

  Two further features should not be smoothed over when extending this entry.
  Penetrance is incomplete - three of 27 variant carriers in the largest
  single-variant series were asymptomatic - so an unaffected carrier is an
  expected observation and not evidence against pathogenicity. And germline
  mosaicism has been reported in an unaffected transmitting mother, which
  changes recurrence-risk counselling and is the reason a "de novo" variant in
  this gene should not be counselled as carrying negligible recurrence risk.

diagnosis:
- name: High-resolution foveal OCT and wide-field autofluorescence at first visit
  description: >-
    The recommendation that follows from the foveopathy being both
    discriminating and asymptomatic: it will not appear in the history, so it
    has to be looked for. The source recommends high-resolution OCT centred on
    the fovea plus large-field autofluorescence in every patient with dominant
    optic atrophy, at first visit and during follow-up, to separate SSBP1 from
    OPA1 cases.
  evidence:
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it should then be recommended to systematically perform high resolution OCT scans centered on the fovea and large-field autofluorescence frames in all patients with DOA at their first visit and during follow-up to separate SSBP1 cases from OPA1 cases"
    explanation: The imaging protocol recommended for distinguishing the two diseases.
- name: Genetic analysis in family surveys
  description: >-
    With 11% of carriers asymptomatic, clinical examination alone will
    misclassify family members. Genetic analysis is required for correct
    counselling rather than being an optional confirmation.
  evidence:
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with 11% of asymptomatic carriers, genetic analysis is required in SSBP1 family surveys to guarantee correct genetic counselling"
    explanation: >-
      States the penetrance figure and the counselling consequence that follows
      from it.

differential_diagnoses:
- name: OPA1-related dominant optic atrophy
  description: >-
    The main differential and the far commoner disease. The two share early
    childhood onset, incomplete penetrance, and the optic atrophy itself. The
    discriminator is the congenital foveopathy on macular OCT, which is present
    in about half of SSBP1 patients and absent in OPA1 disease - and which is
    worth looking for precisely because it costs nothing in acuity and so will
    not announce itself in the visual history.
  evidence:
  - reference: PMID:34548540
    reference_title: Characterization of SSBP1-related optic atrophy and foveopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSBP1-related DOA shares similarities with OPA1-related DOA with an incomplete penetrance and an early childhood visual impairment."
    explanation: States the overlap that makes the two hard to separate clinically.
animal_models:
- name: ssbp1 knockdown and mutant-mRNA zebrafish
  species: Zebrafish
  genotype: antisense knockdown of endogenous ssbp1; mutant human SSBP1 mRNA administration
  publication: PMID:31298765
  description: >-
    A two-armed zebrafish experiment rather than a single model. One arm knocks
    the endogenous transcript down; the other administers mutant mRNA. Comparing
    them is what makes the design informative about mechanism rather than only
    about requirement.
  modeled_mechanisms:
  - target: Retinal Ganglion Cell Vulnerability and Optic Nerve Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockdown compromises retinal ganglion cell differentiation, identifying
      the cell type affected in patients as one whose development requires
      ssbp1. Graded PARTIALLY_RECAPITULATES rather than RECAPITULATES because
      the model reproduces involvement of the right cell type by the wrong
      route: failure of differentiation in an embryo, against degeneration of a
      differentiated cell in a child.
    limitations: >-
      A developmental readout in a fish embryo against a childhood-onset human
      optic neuropathy; the assay reports failure of differentiation rather than
      degeneration of a differentiated cell, and the two need not share a
      mechanism. Antisense knockdown in zebrafish also carries well-known
      off-target liabilities that the report does not address with a genetic
      mutant.
    readouts:
    - name: Retinal ganglion cell differentiation
      target: Retinal Ganglion Cell Vulnerability and Optic Nerve Degeneration
      direction: DECREASED
      interpretation: Establishes an in vivo requirement for ssbp1 in the affected cell type.
      evidence:
      - reference: PMID:31298765
        reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Antisense-mediated knockdown of endogenous ssbp1 messenger RNA (mRNA) in zebrafish resulted in compromised differentiation of retinal ganglion cells."
        explanation: The knockdown readout.
    evidence:
    - reference: PMID:31298765
      reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings point toward an essential role of ssbp1 in retinal development"
      explanation: The authors' conclusion for the model's relevance to the affected tissue.
  - target: Destabilised SSBP1 Dimer and Tetramer Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Administering mutant mRNA reproduces the effect of removing the endogenous
      transcript. That equivalence is the model's real contribution: it is what
      distinguishes a dominant-negative allele from a null, and it is difficult
      to establish in patient cells that carry only one copy of the variant.
    limitations: >-
      Overexpression of injected mRNA is not a physiological dose, so the
      experiment shows that the mutant protein CAN interfere rather than that
      interference is what happens at endogenous levels in humans.
    readouts:
    - name: Retinal ganglion cell differentiation after mutant mRNA administration
      target: Destabilised SSBP1 Dimer and Tetramer Assembly
      direction: DECREASED
      interpretation: >-
        Mutant mRNA phenocopies knockdown, the functional signature of
        dominant-negative interference.
      evidence:
      - reference: PMID:31298765
        reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A similar effect was achieved when mutated mRNAs were administered."
        explanation: The mutant-mRNA arm and its equivalence to knockdown.
    evidence:
    - reference: PMID:31298765
      reference_title: SSBP1 mutations in dominant optic atrophy with variable retinal degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the dominant-negative nature of the identified human variants"
      explanation: The mechanistic conclusion this arm of the experiment supports.
discussions:
- discussion_id: ssbp1_tissue_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the tissue distribution of SSBP1 disease set by how much mtDNA depletion
    each allele causes, as has been proposed, or by something specific to
    retinal ganglion cells?
  attaches_to:
  - pathophysiology#Mitochondrial DNA Depletion
  - pathophysiology#Retinal Ganglion Cell Vulnerability and Optic Nerve Degeneration
  rationale: >-
    An earlier version of this discussion asked why SSBP1 disease is
    eye-restricted when other mtDNA depletion syndromes are multisystem. That
    premise was too strong and has been corrected in the entry: the ocular
    restriction belongs to p.Arg38Gln, other missense alleles give syndromic
    presentations, and hypothyroidism and renal failure are documented.

    The sharper question is what sets the difference between alleles. A dosage
    account has been proposed - that severity tracks residual mtDNA levels, that
    variants differ in their effect on tetramer abundance and activity, and that
    an organ is affected only once depletion passes a threshold in it. That
    would make p.Arg38Gln the mild end of a continuum rather than a different
    kind of lesion, and it is attractive because it connects the clinical
    gradient directly to the tetramer-assembly node this entry already curates.

    It is untested. No study has measured mtDNA copy number across tissues of
    differing clinical involvement in the same carrier, or compared depletion
    between alleles. The competing account - that retinal ganglion cells are
    selectively vulnerable to mitochondrial dysfunction because of their
    unmyelinated prelaminar axon segment, as argued for OPA1 and Leber
    hereditary optic neuropathy - predicts that depletion is uniform and the
    tissue response is not. The two make different predictions and one
    measurement separates them.
  proposed_experiments:
  - experiment_id: exp_ssbp1_tissue_mtdna_copy_number
    name: Cross-tissue mtDNA copy number in SSBP1 variant carriers
    description: >-
      Compare mtDNA copy number and replication intermediates across tissues of
      differing clinical involvement in the same SSBP1 carriers - fibroblast,
      blood, muscle, and where available post-mortem retina and optic nerve -
      and compare p.Arg38Gln carriers against carriers of syndromic alleles, to
      test whether depletion is uniform with selective tissue tolerance or
      tracks allele severity as the dosage account predicts.
    would_support:
    - pathophysiology#Mitochondrial DNA Depletion
    supporting_outcome:
    - >-
      Depletion is comparable across tissues and differs between alleles in
      proportion to clinical severity, supporting the proposed dosage-threshold
      account and locating tissue selectivity in differential tolerance.
    refuting_outcome:
    - >-
      Depletion does not differ between alleles, or is confined to ocular
      tissue, refuting the dosage account and pointing instead to a
      tissue-specific requirement for SSBP1.
- discussion_id: ssbp1_foveopathy_versus_late_retinal_degeneration
  kind: OPEN_QUESTION
  prompt: >-
    Are the congenital foveopathy and the late-onset rod-cone dystrophy two
    expressions of one photoreceptor process, or independent consequences?
  attaches_to:
  - pathophysiology#Foveal Photoreceptor Maldevelopment
  - pathophysiology#Late-Onset Rod-Cone Dystrophy
  rationale: >-
    The two behave quite differently. The foveopathy is the same at every age
    and costs no acuity, which is the profile of a developmental lesion that
    then stays put. The rod-cone dystrophy appears after 50 and is severe, which
    is the profile of a degeneration. Whether the first predisposes to the
    second, or the two are separate readouts of the same underlying photoreceptor
    compromise on different timescales, is unresolved - and the cohorts are far
    too small and too cross-sectional to answer it.

    It matters for prognosis. If the foveopathy marks patients who will later
    degenerate, it becomes a prognostic sign as well as a diagnostic one; if not,
    it should continue to be reported to families as the reassuring finding it
    currently appears to be.
  proposed_experiments:
  - experiment_id: exp_ssbp1_longitudinal_retinal_imaging
    name: Longitudinal retinal imaging of SSBP1 carriers into later life
    description: >-
      Follow a cohort of SSBP1 variant carriers with serial macular OCT and
      autofluorescence into and beyond the sixth decade, and test whether the
      presence of congenital foveopathy predicts subsequent rod-cone dystrophy.
    would_support:
    - pathophysiology#Late-Onset Rod-Cone Dystrophy
    supporting_outcome:
    - >-
      Rod-cone dystrophy develops preferentially in carriers with congenital
      foveopathy, supporting one photoreceptor process with two temporal phases
      and making the foveopathy prognostic.
    refuting_outcome:
    - >-
      Late rod-cone dystrophy occurs independently of foveopathy status,
      supporting two separate consequences and preserving the foveopathy as a
      purely diagnostic sign.

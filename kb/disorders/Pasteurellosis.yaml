name: Pasteurellosis
creation_date: "2026-09-25T17:57:49Z"
category: Infectious Disease
disease_term:
  preferred_term: pasteurellosis
  term:
    id: MONDO:0005901
    label: pasteurellosis
description: >-
  Pasteurellosis is a zoonotic bacterial infection caused by Pasteurella species,
  especially Pasteurella multocida, that most often follows cat or dog bites and
  scratches but can also cause respiratory and invasive systemic disease after
  non-bite animal exposure.
parents:
- bacterial infectious disease
synonyms:
- Pasteurella infection
- Pasteurella multocida infection
infectious_agent:
- name: Pasteurella species
  infectious_agent_term:
    preferred_term: Pasteurella
    term:
      id: NCBITaxon:745
      label: Pasteurella
  description: >-
    Pasteurella are small Gram-negative coccobacilli of animal oral and
    respiratory flora; P. multocida is the major human pathogen, with P. canis
    and P. multocida subspecies recovered from infected dog and cat bites.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pasteurella multocida, a small, gram-negative coccobacillus , is part of the normal oral flora of many animals, including the dog and cat."
    explanation: Identifies P. multocida as a Pasteurella coccobacillus resident in dog and cat oral flora.
  - reference: PMID:9887159
    reference_title: "Bacteriologic analysis of infected dog and cat bites. Emergency Medicine Animal Bite Infection Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pasteurella species were the most frequent isolates from both dog bites
      (50 percent) and cat bites (75 percent). Pasteurella canis was the most
      common isolate of dog bites, and Past. multocida subspecies multocida and
      septica were the most common isolates of cat bites.
    explanation: Supports the broader Pasteurella genus as the bite-wound source, not P. multocida alone.
transmission:
- name: Animal bite, scratch, and secretion exposure
  description: >-
    Dog and cat oral flora are inoculated into soft tissue through bites and
    scratches, while non-bite disease can follow inhalation of contaminated
    animal secretions.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common infections caused by P. multocida are local wound
      infections following animal bites or scratches . Cats are the source of
      infection in 60 to 80% of cases and dogs in the great majority of the
      remainder.
    explanation: Supports cat- and dog-associated bites and scratches as the dominant route for local pasteurellosis.
  - reference: PMID:9097378
    reference_title: "Pasteurella multocida pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Human infection can also occur after non-bite animal exposure, usually via inhalation of contaminated secretions."
    explanation: Supports respiratory exposure to contaminated animal secretions as a non-bite transmission route.
pathophysiology:
- name: Capsule-Mediated Innate Immune Evasion
  biological_scale: CELLULAR
  description: >-
    The P. multocida polysaccharide capsule lets inoculated organisms avoid
    phagocytosis and resist complement killing, the innate-evasion step that
    permits local proliferation.
  biological_processes:
  - preferred_term: capsule-mediated evasion of host phagocytosis and complement
    modifier: INCREASED
    term:
      id: GO:0141043
      label: symbiont-mediated evasion of host innate immune response
  downstream:
  - target: Local Pasteurella Proliferation at the Bite Site
    causal_link_type: DIRECT
    description: Innate-immune evasion permits the organism to proliferate at the inoculation site.
  evidence:
  - reference: PMID:17107417
    reference_title: "Pasteurella multocida pathogenesis: 125 years after Pasteur."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The capsule is clearly involved in bacterial avoidance
      of phagocytosis and resistance to complement
    explanation: The capsule evades phagocytosis and complement, the innate-evasion virulence step.
- name: Lipopolysaccharide-Mediated Host Survival
  biological_scale: MOLECULAR
  description: >-
    Complete P. multocida lipopolysaccharide is required for bacterial survival
    in host tissue, a virulence determinant distinct from the capsule.
  downstream:
  - target: Local Pasteurella Proliferation at the Bite Site
    causal_link_type: DIRECT
    description: LPS-dependent survival supports persistence and proliferation in tissue.
  evidence:
  - reference: PMID:17107417
    reference_title: "Pasteurella multocida pathogenesis: 125 years after Pasteur."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      complete
      lipopolysaccharide is critical for bacterial survival in the host
    explanation: Complete LPS is required for survival in host tissue, a virulence factor separate from the capsule.
- name: Local Pasteurella Proliferation at the Bite Site
  biological_scale: TISSUE
  description: >-
    Pasteurella inoculated from a cat or dog bite or scratch proliferates in
    skin and subcutaneous tissue, driving an acute neutrophilic inflammatory
    response and purulent wound infection.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: acute inflammatory response to the wound infection
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Cellulitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Local proliferation produces rapidly spreading cellulitis.
  - target: Abscess
    causal_link_type: DIRECT
    description: Local suppuration produces abscess formation, a common local complication.
  - target: Contiguous Deep Soft-Tissue Extension
    causal_link_type: DIRECT
    description: Untreated wound infection extends contiguously to tendon sheath, joint, and bone.
  - target: Bloodstream Invasion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Bite-associated infection can become bacteremic, less often than non-bite
      infection.
    evidence:
    - reference: PMID:26356688
      reference_title: "Clinical Features and Outcomes of Pasteurella multocida Infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        more frequently bacteremic (37% vs 4%, respectively, P = 0.001)
      explanation: >-
        Bite-associated infections are bacteremic in 4% of cases (versus 37% for
        non-bite infections), so the bite route does reach the bloodstream.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Local infections are characterized by the rapid appearance of erythema,
      warmth, tenderness, and frequently purulent drainage. The most common local
      complications are abscess formation and tenosynovitis.
    explanation: Links Pasteurella wound infection to rapidly progressive local inflammatory skin and soft-tissue disease.
  - reference: PMID:9887159
    reference_title: "Bacteriologic analysis of infected dog and cat bites. Emergency Medicine Animal Bite Infection Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSIONS: Infected dog and cat bites have a complex microbiologic mix that usually includes pasteurella species"
    explanation: Supports Pasteurella as a frequent bacterial component of infected bite wounds.
- name: Contiguous Deep Soft-Tissue Extension
  biological_scale: TISSUE
  description: >-
    Untreated Pasteurella wound infection spreads from skin and subcutaneous
    tissue into the tendon sheath, joint, and bone, producing the serious local
    complications of the disease.
  downstream:
  - target: Tenosynovitis
    causal_link_type: DIRECT
    description: Contiguous extension into a tendon sheath produces tenosynovitis.
  - target: Septic arthritis
    causal_link_type: DIRECT
    description: Contiguous extension into a joint produces septic arthritis.
  - target: Osteomyelitis
    causal_link_type: DIRECT
    description: Contiguous extension into bone produces osteomyelitis.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Serious local complications include septic arthritis proximal to bites or
      scratches, osteomyelitis resulting from direct inoculation or extension of
      cellulitis, and the combination of septic arthritis and osteomyelitis, most
      commonly involving a finger or hand after a cat bite.
    explanation: Names the deep soft-tissue and bone complications of contiguous Pasteurella wound extension.
- name: Respiratory Tract Infection
  biological_scale: TISSUE
  description: >-
    Non-bite inhalational exposure seeds the respiratory tract, most often in
    elderly hosts with chronic lung disease (COPD, bronchiectasis) or malignancy,
    producing pneumonia and its suppurative complications.
  downstream:
  - target: Pneumonia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Respiratory seeding produces pneumonia.
  - target: Lung abscess
    causal_link_type: DIRECT
    description: Suppurative progression produces lung abscess.
  - target: Empyema
    causal_link_type: DIRECT
    description: Pleural extension produces empyema.
  evidence:
  - reference: PMID:9097378
    reference_title: "Pasteurella multocida pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most patients with Pasteurella pulmonary infection are elderly with
      underlying lung disease, either COPD, bronchiectasis, or malignancy. The
      spectrum of disease includes pneumonia, tracheobronchitis, lung abscess,
      and empyema.
    explanation: Supports respiratory pasteurellosis in predisposed patients with underlying lung disease.
- name: Bloodstream Invasion
  biological_scale: ORGANISM
  description: >-
    In hosts with liver dysfunction, severe comorbidity, or immune impairment,
    Pasteurella invades the bloodstream, producing bacteremia and metastatic
    invasive infection including meningitis.
  downstream:
  - target: Bacteremia
    causal_link_type: DIRECT
    description: Bloodstream invasion produces bacteremia.
  - target: Meningitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Bacteremic seeding of the meninges produces meningitis.
  evidence:
  - reference: PMID:26356688
    reference_title: "Clinical Features and Outcomes of Pasteurella multocida Infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      P multocida infections not associated with an animal bite were often
      associated with bacteremia, severe comorbidity(ies), immune-incompetent
      states, the need for ICU management, and were associated with substantial
      mortality.
    explanation: Supports severe bacteremic systemic disease in non-bite Pasteurella infections.
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      predilection for causing bacteremia in patients with liver dysfunction,
      septic arthritis in damaged joints, meningitis in the very young or elderly,
      and pulmonary colonization or invasion in patients with underlying
      respiratory tract abnormalities.
    explanation: Records the host risk factors (liver dysfunction, damaged joints, age extremes, lung disease) that predispose to invasive Pasteurella disease.

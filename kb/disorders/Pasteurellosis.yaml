name: Pasteurellosis
creation_date: "2026-09-25T17:57:49Z"
category: Infectious Disease
disease_term:
  preferred_term: pasteurellosis
  term:
    id: MONDO:0005901
    label: pasteurellosis
description: >-
  Pasteurellosis is a zoonotic bacterial infection caused by Pasteurella species,
  especially Pasteurella multocida, that most often follows cat or dog bites and
  scratches but can also cause respiratory and invasive systemic disease after
  non-bite animal exposure.
parents:
- bacterial infectious disease
synonyms:
- Pasteurella infection
- Pasteurella multocida infection
infectious_agent:
- name: Pasteurella species
  infectious_agent_term:
    preferred_term: Pasteurella
    term:
      id: NCBITaxon:745
      label: Pasteurella
  description: >-
    Pasteurella are small Gram-negative coccobacilli of animal oral and
    respiratory flora; P. multocida is the major human pathogen, with P. canis
    and P. multocida subspecies recovered from infected dog and cat bites.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pasteurella multocida, a small, gram-negative coccobacillus , is part of the normal oral flora of many animals, including the dog and cat."
    explanation: Identifies P. multocida as a Pasteurella coccobacillus resident in dog and cat oral flora.
  - reference: PMID:9887159
    reference_title: "Bacteriologic analysis of infected dog and cat bites. Emergency Medicine Animal Bite Infection Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pasteurella species were the most frequent isolates from both dog bites
      (50 percent) and cat bites (75 percent). Pasteurella canis was the most
      common isolate of dog bites, and Past. multocida subspecies multocida and
      septica were the most common isolates of cat bites.
    explanation: Supports the broader Pasteurella genus as the bite-wound source, not P. multocida alone.
transmission:
- name: Animal bite, scratch, and secretion exposure
  description: >-
    Dog and cat oral flora are inoculated into soft tissue through bites and
    scratches, while non-bite disease can follow inhalation of contaminated
    animal secretions.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most common infections caused by P. multocida are local wound
      infections following animal bites or scratches . Cats are the source of
      infection in 60 to 80% of cases and dogs in the great majority of the
      remainder.
    explanation: Supports cat- and dog-associated bites and scratches as the dominant route for local pasteurellosis.
  - reference: PMID:9097378
    reference_title: "Pasteurella multocida pneumonia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Human infection can also occur after non-bite animal exposure, usually via inhalation of contaminated secretions."
    explanation: Supports respiratory exposure to contaminated animal secretions as a non-bite transmission route.
pathophysiology:
- name: Bite-associated soft tissue infection
  description: >-
    Pasteurella inoculated from a cat or dog bite or scratch proliferates in
    skin and subcutaneous tissue, rapidly producing cellulitis and purulent wound
    infection that can extend contiguously to tendon sheaths, joints, or bone.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Local infections are characterized by the rapid appearance of erythema,
      warmth, tenderness, and frequently purulent drainage. The most common local
      complications are abscess formation and tenosynovitis.
    explanation: Links Pasteurella wound infection to rapidly progressive local inflammatory skin and soft-tissue disease.
  - reference: PMID:9887159
    reference_title: "Bacteriologic analysis of infected dog and cat bites. Emergency Medicine Animal Bite Infection Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSIONS: Infected dog and cat bites have a complex microbiologic mix that usually includes pasteurella species"
    explanation: Supports Pasteurella as a frequent bacterial component of infected bite wounds.
- name: Respiratory and systemic opportunistic infection
  description: >-
    Non-bite animal exposure can seed the respiratory tract of hosts with chronic
    lung disease or disseminate systemically in hosts with comorbidity or immune
    impairment, producing bacteremia, meningitis, and other invasive infections.
  evidence:
  - reference: PMID:9097378
    reference_title: "Pasteurella multocida pneumonia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most patients with Pasteurella pulmonary infection are elderly with
      underlying lung disease, either COPD, bronchiectasis, or malignancy. The
      spectrum of disease includes pneumonia, tracheobronchitis, lung abscess,
      and empyema.
    explanation: Supports respiratory pasteurellosis in predisposed patients with underlying lung disease.
  - reference: PMID:26356688
    reference_title: "Clinical Features and Outcomes of Pasteurella multocida Infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      P multocida infections not associated with an animal bite were often
      associated with bacteremia, severe comorbidity(ies), immune-incompetent
      states, the need for ICU management, and were associated with substantial
      mortality.
    explanation: Supports severe bacteremic systemic disease in non-bite Pasteurella infections.
- name: Capsule and lipopolysaccharide-mediated host survival
  description: >-
    P. multocida capsule limits phagocytosis and complement killing, while
    complete lipopolysaccharide supports bacterial survival in host tissue.
  evidence:
  - reference: PMID:17107417
    reference_title: "Pasteurella multocida pathogenesis: 125 years after Pasteur."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Key virulence factors identified to date include capsule and
      lipopolysaccharide. The capsule is clearly involved in bacterial avoidance
      of phagocytosis and resistance to complement, while complete
      lipopolysaccharide is critical for bacterial survival in the host.
    explanation: Supports capsule and LPS as core P. multocida virulence factors for evading innate host clearance.
phenotypes:
- name: Cellulitis
  phenotype_term:
    preferred_term: Cellulitis
    term:
      id: HP:0100658
      label: Cellulitis
  description: Rapid cellulitis is the characteristic local presentation after Pasteurella-contaminated animal bites or scratches.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Local infections are characterized by the rapid appearance of erythema,
      warmth, tenderness, and frequently purulent drainage.
    explanation: Supports acute inflammatory cellulitis-like soft-tissue infection as the common local presentation.
- name: Pneumonia
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  description: Pasteurella can cause pneumonia after non-bite animal exposure, especially in older patients with chronic lung disease.
  evidence:
  - reference: PMID:9097378
    reference_title: "Pasteurella multocida pneumonia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The spectrum of disease includes pneumonia, tracheobronchitis, lung abscess, and empyema."
    explanation: Identifies pneumonia within the Pasteurella respiratory disease spectrum.
- name: Bacteremia
  phenotype_term:
    preferred_term: Bacteremia
    term:
      id: HP:0031864
      label: Bacteremia
  description: Bacteremia occurs as an invasive systemic manifestation, particularly in non-bite infections with major comorbidity.
  evidence:
  - reference: PMID:26356688
    reference_title: "Clinical Features and Outcomes of Pasteurella multocida Infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      P multocida infections not associated with an animal bite were often
      associated with bacteremia, severe comorbidity(ies), immune-incompetent
      states, the need for ICU management, and were associated with substantial
      mortality.
    explanation: Supports bacteremia as a systemic manifestation of non-bite P. multocida infection.
- name: Meningitis
  phenotype_term:
    preferred_term: Meningitis
    term:
      id: HP:0001287
      label: Meningitis
  description: Meningitis is a recognized invasive manifestation of systemic P. multocida infection.
  evidence:
  - reference: PMID:6371440
    reference_title: "Pasteurella multocida infections. Report of 34 cases and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "P. multocida is recognized as a pathogen in a variety of systemic infections including bacteremia, meningitis, brain abscess, spontaneous bacterial peritonitis, and intra-abdominal abscess."
    explanation: Supports meningitis as one of the invasive systemic infection sites.
treatments:
- name: Antibiotic therapy
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  description: >-
    Penicillin is a preferred agent for Pasteurella infections, doxycycline is an
    effective alternative against P. multocida, and beta-lactam/beta-lactamase
    inhibitor therapy covers the polymicrobial flora of infected bite wounds.
  evidence:
  - reference: PMID:9097378
    reference_title: "Pasteurella multocida pneumonia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The preferred drug for the treatment of Pasteurella infections is penicillin. Alternately, doxycycline is highly effective against P multocida."
    explanation: Supports antimicrobial therapy for Pasteurella infection and avoids the report's invalid drug-specific NCIT bindings.
  - reference: PMID:9887159
    reference_title: "Bacteriologic analysis of infected dog and cat bites. Emergency Medicine Animal Bite Infection Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were most often treated with a combination of a beta-lactam
      antibiotic and a beta-lactamase inhibitor, which, on the basis of the
      microbiologic findings, was appropriate therapy.
    explanation: Supports beta-lactam/beta-lactamase inhibitor therapy as appropriate for Pasteurella-containing infected dog and cat bites.

treatments:
- name: Antibiotic therapy
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: penicillin
      term:
        id: CHEBI:17334
        label: penicillin
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
    - preferred_term: clavulanic acid
      term:
        id: CHEBI:48947
        label: clavulanic acid
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Local Pasteurella Proliferation at the Bite Site
    treatment_effect: INHIBITS
    description: >-
      Antibiotic therapy clears the proliferating organism at the infection
      focus, preventing contiguous extension and systemic invasion.
    evidence:
    - reference: PMID:9097378
      reference_title: "Pasteurella multocida pneumonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The preferred drug for the treatment of Pasteurella infections is penicillin. Alternately, doxycycline is highly effective against P multocida."
      explanation: Names penicillin and doxycycline as effective agents against the infection.
  - target: Respiratory Tract Infection
    treatment_effect: INHIBITS
    description: >-
      Antibiotic therapy treats respiratory Pasteurella infection; the
      penicillin/doxycycline recommendation comes from the pneumonia review.
    evidence:
    - reference: PMID:9097378
      reference_title: "Pasteurella multocida pneumonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The preferred drug for the treatment of Pasteurella infections is penicillin. Alternately, doxycycline is highly effective against P multocida."
      explanation: The pneumonia review names penicillin and doxycycline as the agents for Pasteurella infection.
  - target: Bloodstream Invasion
    treatment_effect: INHIBITS
    description: >-
      Antibiotic therapy clears the bloodstream infection, the invasive form
      that carries the disease's mortality.
    evidence:
    - reference: PMID:9097378
      reference_title: "Pasteurella multocida pneumonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The preferred drug for the treatment of Pasteurella infections is penicillin. Alternately, doxycycline is highly effective against P multocida."
      explanation: Penicillin and doxycycline are the effective agents against invasive Pasteurella infection.
  description: >-
    Penicillin is a preferred agent for Pasteurella infections, doxycycline is an
    effective alternative against P. multocida, and beta-lactam/beta-lactamase
    inhibitor therapy covers the polymicrobial flora of infected bite wounds.
  evidence:
  - reference: PMID:9097378
    reference_title: "Pasteurella multocida pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The preferred drug for the treatment of Pasteurella infections is penicillin. Alternately, doxycycline is highly effective against P multocida."
    explanation: Supports antimicrobial therapy for Pasteurella infection and avoids the report's invalid drug-specific NCIT bindings.
  - reference: PMID:9887159
    reference_title: "Bacteriologic analysis of infected dog and cat bites. Emergency Medicine Animal Bite Infection Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were most often treated with a combination of a beta-lactam
      antibiotic and a beta-lactamase inhibitor, which, on the basis of the
      microbiologic findings, was appropriate therapy.
    explanation: Supports beta-lactam/beta-lactamase inhibitor therapy as appropriate for Pasteurella-containing infected dog and cat bites.

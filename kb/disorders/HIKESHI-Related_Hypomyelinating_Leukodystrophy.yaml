environmental:
- name: Febrile illness
  description: >-
    Fever during intercurrent infection is the recognised trigger of acute
    deterioration and death. It does not cause the leukodystrophy; it exposes
    the cellular inability to protect the nucleus during heat stress. Patient
    iPSCs heated to a febrile-range temperature show an abnormal heat-shock
    response.
  notes: >-
    No exposure_term is bound. ECTO searches (`runoak -i sqlite:obo:ecto search`)
    for `l~fever` returned only exposure to African swine fever virus and to
    yellow fever virus, `l~hyperthermia` returned nothing, and `l~temperature`
    returned only ambient-temperature terms such as ECTO:1000007 exposure to high
    temperature environment, which describes external heat rather than an
    endogenous fever.
  evidence:
  - reference: PMID:34111619
    reference_title: "Further Delineation of the Clinical and Pathologic Features of HIKESHI-Related Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe morbidity or death during febrile illness occurred in five of the nine affected individuals."
    explanation: Febrile illness is associated with severe morbidity or death.
  influences_mechanisms:
  - target: Unrepaired Heat-Induced Nuclear Damage
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fever imposes the heat stress that HIKESHI-deficient cells cannot buffer.
      Shown as an abnormal heat-shock response in patient iPSCs at a
      febrile-range temperature; not demonstrated in patients.
    evidence:
    - reference: PMID:40649816
      reference_title: "A Novel Pathogenic Variant Identified in HIKESHI-Related Hypomyelinating Leukodystrophy Disrupts Heat Shock Response in iPSCs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results confirmed an abnormal and possibly exaggerated HS response in HHL cells, correlating with the sensitivity of HHL patients to febrile illness."
      explanation: Links the cellular heat-stress defect to the clinical fever sensitivity.
diagnosis:
- name: Brain MRI
  description: >-
    Brain MRI shows diffuse hypomyelination and a thin corpus callosum, and
    prompts genetic testing for a hypomyelinating leukodystrophy.
  evidence:
  - reference: PMID:34111619
    reference_title: "Further Delineation of the Clinical and Pathologic Features of HIKESHI-Related Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance images of seven patients were analyzed and demonstrated diffuse hypomyelination and thin corpus callosum."
    explanation: The MRI pattern that leads to the diagnosis.
- name: Molecular genetic testing for biallelic HIKESHI variants
  description: >-
    Diagnosis is confirmed by identifying biallelic pathogenic HIKESHI variants
    by exome or genome sequencing; in Ashkenazi Jewish patients the founder
    allele p.(Val54Leu) is expected. Fibroblast assays of HIKESHI protein and
    heat-induced HSP70 nuclear import have been used to resolve a variant of
    uncertain significance.
  evidence:
  - reference: PMID:38922739
    reference_title: "A novel missense variant in HIKESHI: Clinical phenotype, in vitro functional testing, and potential for gene therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These functional data establish that the patient's variant is a pathogenic loss-of-function mutation, thus confirming a diagnosis of hypomyelinating leukodystrophy 13"
    explanation: Functional testing confirmed the molecular diagnosis.
treatments:
- name: Supportive care with fever prevention and early febrile management
  description: >-
    There is no disease-modifying therapy. Management is symptomatic, and focuses
    on preventing febrile episodes and intervening early during febrile illness
    with hemodynamic stabilisation and anti-inflammatory treatment, including
    high-dose steroids depending on clinical status.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40649816
    reference_title: "A Novel Pathogenic Variant Identified in HIKESHI-Related Hypomyelinating Leukodystrophy Disrupts Heat Shock Response in iPSCs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, in addition to symptomatic care, clinical management is focused on preventing febrile episodes and early intervention during febrile illness with hemodynamic stabilization and anti-inflammatory medications including high dose steroids depending on the clinical status."
    explanation: Describes current clinical management.
  target_mechanisms:
  - target: Acute deterioration during febrile illness
    description: Fever prevention and early intervention aim to limit fever-triggered decompensation.
- name: HIKESHI gene replacement (preclinical)
  description: >-
    Vector-mediated re-expression of HIKESHI restored heat-induced nuclear
    import of HSP70 in patient fibroblasts. Not tested in animals or patients.
  therapeutic_modality: GENE_THERAPY

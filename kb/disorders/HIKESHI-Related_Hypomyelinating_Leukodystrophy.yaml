pathophysiology:
- name: Biallelic HIKESHI Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic HIKESHI missense variants leave little or no HIKESHI protein.
    HIKESHI is undetectable in fibroblasts homozygous for p.(Val54Leu),
    p.(Cys4Ser) or p.(Phe2Val), and patient iPSCs have markedly reduced HIKESHI
    after heat shock. Structural modelling places p.(Cys4Ser) and p.(Val54Leu) in
    the hydrophobic pockets of the N-terminal domain of the asymmetric homodimer,
    where they destabilise the protein. Proteasome inhibition partly restores the
    mutant protein in patient-derived cells, consistent with proteasomal
    degradation of an unstable protein.
  genetic_context:
    gene:
      preferred_term: HIKESHI
      term:
        id: hgnc:26938
        label: HIKESHI
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:26545878
    reference_title: "Leukoencephalopathy and early death associated with an Ashkenazi-Jewish founder mutation in the Hikeshi gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation was associated with undetectable level of Hikeshi in the patients' fibroblasts"
    explanation: The founder allele leaves no detectable HIKESHI in patient cells.
  - reference: PMID:28000699
    reference_title: "Absence of Hikeshi, a nuclear transporter for heat-shock protein HSP70, causes infantile hypomyelinating leukoencephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Structural modeling and protein analyses revealed that modified interactions inside Hikeshi's hydrophobic pockets induce protein instability."
    explanation: The p.(Cys4Ser) allele acts through protein instability.
  - reference: PMID:38922739
    reference_title: "A novel missense variant in HIKESHI: Clinical phenotype, in vitro functional testing, and potential for gene therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These functional data establish that the patient's variant is a pathogenic loss-of-function mutation"
    explanation: Functional testing classifies p.(Phe2Val) as loss of function.
  downstream:
  - target: Impaired Nuclear Import of HSP70
    causal_link_type: DIRECT
    description: >-
      Without HIKESHI, the ATP-bound HSP70s cannot be carried through the nuclear
      pore; re-expressing wild-type HIKESHI restores import in patient cells.
    evidence:
    - reference: PMID:26545878
      reference_title: "Leukoencephalopathy and early death associated with an Ashkenazi-Jewish founder mutation in the Hikeshi gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "lack of nuclear HSP70 during heat shock stress, a phenomenon which was reversed upon the introduction of normal human Hikeshi to the patients cells."
      explanation: Rescue by wild-type HIKESHI ties the import defect to loss of HIKESHI itself.
    - reference: PMID:38922739
      reference_title: "A novel missense variant in HIKESHI: Clinical phenotype, in vitro functional testing, and potential for gene therapy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "When patient fibroblasts were provided exogenous HIKESHI, the transfected proband's cells showed restored heat-induced nuclear translocalization of HSP70 under conditions of heat stress."
      explanation: Independent rescue with a second allele.
- name: Impaired Nuclear Import of HSP70
  biological_scale: CELLULAR
  description: >-
    HIKESHI is the carrier for nuclear import of the HSP70 chaperones
    (HSPA1A/HSPA1B/HSPA8). It binds FG-nucleoporins and translocates through the
    nuclear pore on its own, carrying the ATP form of HSP70. Its loss abolishes
    heat-induced nuclear accumulation of HSP70 and also lowers nuclear HSP70 in
    unstressed cells.
  biological_processes:
  - preferred_term: protein import into nucleus
    modifier: DECREASED
    term:
      id: GO:0006606
      label: protein import into nucleus
  evidence:
  - reference: PMID:22541429
    reference_title: "Hikeshi, a nuclear import carrier for Hsp70s, protects cells from heat shock-induced nuclear damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In reconstituted transport, Hikeshi supports the nuclear import of the ATP form of Hsp70s, but not the ADP form"
    explanation: Defines HIKESHI as the nuclear import carrier for ATP-bound HSP70.
  - reference: PMID:35580988
    reference_title: "Lack of Hikeshi activates HSF1 activity under normal conditions and disturbs the heat-shock response."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that Hikeshi regulates the nucleocytoplasmic distribution of HSP70 not only under heat-shock conditions but also under nonstressed conditions."
    explanation: Extends the import defect to unstressed cells.
  - reference: PMID:40649816
    reference_title: "A Novel Pathogenic Variant Identified in HIKESHI-Related Hypomyelinating Leukodystrophy Disrupts Heat Shock Response in iPSCs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HHL-iPSCs had impaired HSP70 translocation to the nucleus."
    explanation: Shows the import defect in patient-derived iPSCs.
  downstream:
  - target: Loss of Nuclear HSP70 Protection of SOX10
    causal_link_type: DIRECT
    description: >-
      During oligodendrocyte differentiation HIKESHI carries HSP70 into the
      nucleus, where HSP70 binds SOX10 and protects it from degradation.
    evidence:
    - reference: PMID:37865085
      reference_title: "Nuclear import carrier Hikeshi cooperates with HSP70 to promote murine oligodendrocyte differentiation and CNS myelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hikeshi is required for nuclear translocation of HSP70s upon differentiation."
      explanation: Places HIKESHI-dependent HSP70 import upstream of the differentiation programme.
  - target: Dysregulated HSF1 Heat-Shock Response
    causal_link_type: DIRECT
    description: >-
      Nuclear HSP70 restrains HSF1, so its loss raises HSF1 activity at baseline
      and disturbs the response to heat shock.
    evidence:
    - reference: PMID:35580988
      reference_title: "Lack of Hikeshi activates HSF1 activity under normal conditions and disturbs the heat-shock response."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Depletion of Hikeshi induces a reduction in nuclear HSP70 and up-regulation of the mRNA expression of genes regulated by HSF1 under nonstressed conditions."
      explanation: Links reduced nuclear HSP70 to HSF1 target-gene up-regulation.
  - target: Unrepaired Heat-Induced Nuclear Damage
    causal_link_type: DIRECT
    description: >-
      Nuclear HSP70 counteracts heat-induced damage inside the nucleus; without
      HIKESHI it cannot get there.
    evidence:
    - reference: PMID:22541429
      reference_title: "Hikeshi, a nuclear import carrier for Hsp70s, protects cells from heat shock-induced nuclear damage."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Nuclear Hsp70s rescue the effect of Hikeshi depletion at least in part. Thus, Hsp70s counteract heat shock-induced damage by acting inside of the nucleus."
      explanation: Rescue by nuclear HSP70 shows the damage results from the import defect.
- name: Loss of Nuclear HSP70 Protection of SOX10
  biological_scale: MOLECULAR
  description: >-
    In the nucleus HSP70 binds SOX10, the transcription factor that drives
    oligodendrocyte differentiation and myelin gene expression, and protects it
    from FBXW7-mediated ubiquitination and degradation. Without HIKESHI-dependent
    import this protection is lost. Shown in mouse oligodendrocytes; not yet
    tested in human cells.
  evidence:
  - reference: PMID:37865085
    reference_title: "Nuclear import carrier Hikeshi cooperates with HSP70 to promote murine oligodendrocyte differentiation and CNS myelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, HSP70s interacted with SOX10 in the nucleus and protected it from E3 ligase FBXW7-mediated ubiquitination degradation."
    explanation: Identifies SOX10 stabilisation as the nuclear HSP70 function relevant to myelination.
  downstream:
  - target: Oligodendrocyte Differentiation Arrest
    causal_link_type: DIRECT
    description: >-
      SOX10 is required for oligodendrocyte terminal differentiation, so its
      destabilisation arrests maturation.
    evidence:
    - reference: PMID:37865085

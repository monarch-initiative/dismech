  - reference: PMID:38922739
    reference_title: "A novel missense variant in HIKESHI: Clinical phenotype, in vitro functional testing, and potential for gene therapy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "vector-mediated gene replacement may be an effective treatment approach for patients with this disorder"
    explanation: Preclinical rescue in patient cells.
  target_mechanisms:
  - target: Impaired Nuclear Import of HSP70
    description: Restoring HIKESHI restores HSP70 nuclear import in patient fibroblasts.
- name: Proteasome inhibitors (preclinical)
  description: >-
    Carfilzomib and marizomib partly restored HIKESHI protein and HSP70 nuclear
    localisation in patient iPSC-derived oligodendrocyte cultures and rescued
    Olig2-positive cell numbers and myelination; later or longer treatment was
    toxic. Not tested in animals or patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

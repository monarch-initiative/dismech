      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nuclear-localized HSP70 promotes murine oligodendrocyte differentiation and remyelination after white matter injury."
      explanation: Nuclear HSP70 is required for oligodendrocyte differentiation in mouse.

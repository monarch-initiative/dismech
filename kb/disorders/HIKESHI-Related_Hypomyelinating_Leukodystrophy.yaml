- name: Unrepaired Heat-Induced Nuclear Damage
  biological_scale: CELLULAR
  description: >-
    Without nuclear HSP70, cells exposed to heat cannot reverse heat-induced
    nuclear phenotypes and lose viability. The case-series authors propose that
    this unprotected state during fever underlies the acute deterioration and
    sudden deaths of patients; that link has not been tested directly.
  biological_processes:
  - preferred_term: cellular response to heat
    modifier: DECREASED
    term:
      id: GO:0034605
      label: cellular response to heat
  evidence:
  - reference: PMID:22541429
    reference_title: "Hikeshi, a nuclear import carrier for Hsp70s, protects cells from heat shock-induced nuclear damage."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In living cells, depletion of Hikeshi inhibits heat shock-induced nuclear import of Hsp70s, reduces cell viability after heat shock stress, and significantly delays the attenuation and reversion of multiple heat shock-induced nuclear phenotypes."
    explanation: Direct cellular evidence that Hikeshi loss leaves heat-induced nuclear damage unrepaired.
  downstream:
  - target: Acute deterioration during febrile illness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed by the case-series authors; inferred from cell biology and the
      clinical association with fever, not demonstrated in patients.
    evidence:
    - reference: PMID:26545878
      reference_title: "Leukoencephalopathy and early death associated with an Ashkenazi-Jewish founder mutation in the Hikeshi gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is likely that in the absence of Hikeshi, HSP70 cannot attenuate the multiple heat shock induced nuclear phenotypes, leaving the cells unprotected during heat shock stress."
      explanation: The authors' proposed link between the cellular defect and the fever-associated decompensation.
  - target: Sudden death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The founding report speculates that the fever-associated deaths follow
      from the heat-stress defect; the proximate mechanism (cardiac, immune or
      neurological) is unknown.
    evidence:
    - reference: PMID:26545878
      reference_title: "Leukoencephalopathy and early death associated with an Ashkenazi-Jewish founder mutation in the Hikeshi gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We speculate that the sudden death of three of the six patients following a short febrile illness and the life-threatening myo-pericarditis in the fourth are the result of excess extra-nuclear HSP70 level which initiates cytokine release or provide target for natural killer cells."
      explanation: The authors' explicitly speculative mechanism for the fever-associated deaths.

name: HIKESHI-Related Hypomyelinating Leukodystrophy
creation_date: "2026-11-23T00:00:00Z"
category: Mendelian
description: >-
  HIKESHI-related hypomyelinating leukodystrophy (hypomyelinating leukodystrophy
  13, HLD13, MIM 616881) is an autosomal recessive infantile-onset
  hypomyelinating leukodystrophy caused by biallelic loss-of-function variants in
  HIKESHI (formerly C11orf73). HIKESHI encodes a small, evolutionarily conserved
  carrier that imports the ATP-bound form of the HSP70 chaperones into the nucleus
  through the nuclear pore, a pathway that operates most strongly under heat
  stress. Affected children present in the first year of life with axial
  hypotonia, feeding difficulties and poor growth, nystagmus and global
  developmental delay; the hypotonia evolves into a progressive spastic and
  dystonic quadriplegia with hyperreflexia and clonus, and optic atrophy and
  acquired microcephaly are common. Brain MRI shows diffuse hypomyelination with a
  thin corpus callosum, and autopsy shows a near-total absence of CNS myelin with
  relative preservation of axons. The distinguishing clinical feature is a severe
  vulnerability to febrile illness: about half of the reported patients died
  suddenly, in childhood, during or after a febrile illness, in several cases with
  cardiogenic shock or myopericarditis. Most patients are Ashkenazi Jewish and
  homozygous for the founder allele c.160G>C p.(Val54Leu), whose carrier
  frequency in that population is about 1 in 200; private alleles have been
  reported in Finnish, Afghan and Christian Arab families.

  The mechanism is loss of HIKESHI protein. Every characterised allele leaves
  little or no detectable HIKESHI in patient cells, and patient fibroblasts and
  iPSCs fail to move HSP70 into the nucleus during heat shock, a defect reversed
  by re-expressing wild-type HIKESHI. Two consequences are documented. In the
  oligodendrocyte lineage, nuclear HSP70 is needed during differentiation, where
  in mouse it binds and stabilises the master myelination transcription factor
  SOX10; Hikeshi-deficient mice show oligodendrocyte maturation arrest and CNS
  hypomyelination, and patient iPSC-derived oligodendrocyte cultures have fewer
  Olig2-positive cells and aberrant myelination. Under heat stress, cells lacking
  HIKESHI cannot use nuclear HSP70 to reverse heat-induced nuclear damage, lose
  viability, and show a dysregulated HSF1 heat-shock response; this is the
  proposed, still inferred, explanation for the fever-associated deterioration
  and deaths. There is no disease-modifying therapy. Management is supportive and
  focuses on preventing and treating febrile episodes early. Gene replacement and
  proteasome inhibitors that rescue the unstable mutant protein are preclinical.
notes: >-
  Entity anchoring. MONDO:0014813 is gene-anchored (`uv run runoak -i
  sqlite:obo:mondo info MONDO:0014813 -O obo` returns `intersection_of:
  RO:0004003 HGNC:26938 ! HIKESHI` and `xref: OMIM:616881`), and hgnc:26938 was
  confirmed as HIKESHI with `uv run runoak -i sqlite:obo:hgnc info hgnc:26938`.
  The entry name follows the gene-related form used in the titles of
  PMID:34111619 and PMID:40649816; the MONDO label and the series name are kept
  as synonyms.

  No GeneReviews chapter covers HIKESHI or HLD13 (the committed Bookshelf index
  `cache/bookshelf/genereviews.csv` has no title containing HIKESHI, and its only
  titles containing "hypomyelinat" are the vanishing white matter and
  hypomyelination with congenital cataract chapters). The phenotype baseline is
  taken from the primary case series: PMID:26545878 (six Ashkenazi Jewish
  patients, the founding report), PMID:34111619 (nine patients including two
  previously reported, with an autopsy), PMID:28000699 (Finnish patient,
  p.Cys4Ser), PMID:38922739 (p.Phe2Val) and PMID:40649816 (p.Pro78Ser, with a
  literature summary of 16 patients).

  Mutant-protein gain of function (not curated as a node). In a mouse
  oligodendroglial cell line the p.Cys4Ser mutant protein localised to
  lysosomes, gained a de novo interaction with filamin A and blocked
  morphological differentiation (PMID:33535532). Every patient-cell study
  instead finds the mutant protein absent or near-absent, so this single
  overexpression result is recorded here rather than as a pathophysiology node.

  The fever-associated deaths are attributed to the heat-stress defect by the
  case-series authors, who describe it as speculation (PMID:26545878); no study
  has shown the link directly in patients or in an animal model, which is why
  the edges into the deterioration and sudden-death phenotypes are graded
  INDIRECT.

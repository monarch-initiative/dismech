        label: salinosporamide A
  evidence:
  - reference: PMID:42875792
    reference_title: "Proteasome inhibitors rescue hypomyelination in iPSC based model of HIKESHI-associated leukodystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PI treatment also rescued Olig2+ cell numbers, myelination, and cell morphology abnormalities."
    explanation: Preclinical rescue in patient-derived oligodendrocyte cultures.
  target_mechanisms:
  - target: Biallelic HIKESHI Loss of Function
    description: Blocking proteasomal degradation partly restores the unstable mutant protein.
animal_models:
- name: Hikeshi-deficient mouse
  species: Mouse
  genotype: Hikeshi knockout (including oligodendrocyte-lineage conditional deletion)
  publication: PMID:37865085
  description: >-
    Hikeshi-deficient mice show oligodendrocyte maturation arrest and CNS
    hypomyelination, reproducing the human myelin phenotype. Whether they
    reproduce fever-associated death is not reported.
  modeled_mechanisms:
  - target: Oligodendrocyte Differentiation Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Oligodendrocyte maturation arrest in Hikeshi-deficient mice.
    limitations: >-
      A null allele rather than the human missense alleles, in mouse; the
      fever-sensitivity arm of the human disease is not modelled.
    evidence:
    - reference: PMID:37865085
      reference_title: "Nuclear import carrier Hikeshi cooperates with HSP70 to promote murine oligodendrocyte differentiation and CNS myelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deficiency of Hikeshi, which is observed in inherited leukodystrophy patients, resulted in murine oligodendrocyte maturation arrest."
      explanation: Supports the mouse as informative for the differentiation-arrest node.

name: Pinta
creation_date: '2026-01-26T15:40:02Z'
category: Infectious Disease
description: >-
  Pinta is a chronic, non-venereal treponematosis caused by Treponema carateum
  and transmitted by direct skin-to-skin contact in warm, humid rural areas of
  Latin America. Alone among the four human treponematoses it is confined to
  the skin: it produces no bone, cartilage, cardiovascular or neurological
  disease. Infection begins as an itchy, scaly papule or plaque at the
  inoculation site, disseminates within the skin as long-lived secondary
  lesions ("pintids"), and ends in the dyschromic and achromic patches that
  give the disease its name. A single intramuscular injection of penicillin
  cures every stage, but the late pigmentary change is largely irreversible,
  so the disability pinta leaves behind is cosmetic and social rather than
  systemic.

  Two features make pinta the outlier of its group. Its agent is the only one
  of the four not classified as a Treponema pallidum subspecies - not because
  it is known to be more distant, but because T. carateum has never been
  cultivated or sequenced, so the genomic comparison that settled the other
  three has never been possible. And because the treponemes are serologically
  indistinguishable, a pinta diagnosis rests on lesion morphology plus
  residence in a historically endemic area; the serology alone cannot separate
  it from syphilis.
synonyms:
- mal del pinto
- carate
- mal de pinta
disease_term:
  term:
    id: MONDO:0000979
    label: pinta disease
  preferred_term: Pinta
parents:
- Bacterial Infection

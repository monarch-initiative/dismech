      tinea versicolor, vitiligo, melasma, and leprosy, are often in the
      differential diagnosis of pinta
    explanation: Names vitiligo as a differential for pinta.
- name: Melasma
  description: Acquired hyperpigmentation that overlaps with the dyschromic phase of pinta.
  distinguishing_features:
  - Symmetric facial distribution
  - Association with pregnancy or sun exposure
  - Non-reactive treponemal serology
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disorders associated with dyspigmentation, such as
      tinea versicolor, vitiligo, melasma, and leprosy, are often in the
      differential diagnosis of pinta
    explanation: Names melasma as a differential for pinta.
- name: Leprosy
  description: >-
    Hypopigmented patches of tuberculoid leprosy are the most consequential
    mimic, since the two share endemic settings and both are treatable
    infections.
  distinguishing_features:
  - Sensory loss within the hypopigmented patch, which does not occur in pinta
  - Peripheral nerve thickening
  - Acid-fast bacilli on slit-skin smear
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disorders associated with dyspigmentation, such as
      tinea versicolor, vitiligo, melasma, and leprosy, are often in the
      differential diagnosis of pinta
    explanation: Names leprosy as a differential for pinta.
treatments:
- name: Penicillin injection
  description: >-
    A single intramuscular injection of long-acting benzathine penicillin
    cures every stage of pinta and renders the lesions non-infectious within a
    day. It does not restore the pigment lost in late disease, so treatment
    ends transmission and halts progression without undoing the disfigurement
    that is the disease's lasting burden.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
    description: >-
      Penicillin acylates the treponemal PBP transpeptidase, blocking
      peptidoglycan cross-linking and killing the organism.
  evidence:
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All stages of pinta are treatable with a single intramuscular injection of penicillin."
    explanation: The abstract states that penicillin injection treats pinta.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "which renders the lesions noninfectious in less than 24 hours"
    explanation: Quantifies how quickly treatment ends infectiousness.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although early pinta lesions heal within several months after penicillin
      administration, this treatment cannot reverse the skin changes of late
      pinta that can stigmatize those who were infected.
    explanation: >-
      Establishes the limit of cure - early lesions heal, late pigmentary
      change does not - which is why this entry treats the residual
      disfigurement as an outcome rather than as treatment failure.
notes: >-
  Curation gaps and boundary notes.

  Why the agent is bound at species rank. T. carateum is bound to
  NCBITaxon:3712027 rather than to a T. pallidum subspecies node, matching the
  literature's own position: the separate species rank is retained because the
  organism has never been cultivated or sequenced, so the genomic comparison
  that assigned pertenue and endemicum to subspecies rank has never been
  performed on it. This entry therefore asserts neither that T. carateum is a
  distinct species nor that it is a T. pallidum subspecies. Any future entry
  should treat a change in that classification as new evidence rather than as
  a correction.

  No azithromycin treatment is recorded. Single-dose oral azithromycin
  underpins the WHO yaws eradication strategy and is curated on the Yaws
  entry, but the sources reviewed here document only penicillin for pinta.
  Adding azithromycin by analogy with yaws would be an inference, not a
  citation, so it is deliberately absent.

  No clinical trials, datasets, animal models or computational models. Pinta
  has no modern trial literature, no sequenced isolate, and no model system -
  a direct consequence of the organism being non-cultivable and the disease
  being close to disappearance. These sections are absent because the evidence
  does not exist, not because they were not searched.

  Frequency bands are mostly unset. Only the two pigmentary phenotypes carry
  FREQUENT; the rest are left without a frequency because the available
  literature describes the lesions qualitatively and reports no case-series
  denominators for pinta.

  Hyperpigmentation is a narrower reading of a broader source term. The
  sources report "dyschromia", which covers both directions of pigmentary
  change. HP has no single term for mixed dyschromia at this granularity, so
  both directions are recorded separately and the explanation on the
  hyperpigmentation item records that it derives from the broader word.

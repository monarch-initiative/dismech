histopathology:
- name: Basal-cell melanin loss with liquefaction degeneration
  description: >-
    The early lesion shows loss of melanin from basal keratinocytes together
    with liquefaction degeneration of the basal layer.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the early lesion, there is loss of melanin in basal cells and liquefaction degeneration."
    explanation: The histological description of the early pinta lesion.
- name: Epidermal atrophy with dermal melanophages
  description: >-
    The late lesion shows a thinned epidermis and abundant melanin-laden
    macrophages in the dermis.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT

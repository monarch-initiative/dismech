infectious_agent:
- name: Treponema carateum
  description: >-
    A non-cultivable spirochete, morphologically and serologically identical to
    the three Treponema pallidum subspecies that cause syphilis, yaws and
    bejel. It is the only agent of the four still carried as a separate
    species, because the absence of isolates has prevented the whole-genome
    comparison used to assign the others to subspecies rank.
  infectious_agent_term:
    preferred_term: Treponema carateum
    term:
      id: NCBITaxon:3712027
      label: Treponema carateum
  evidence:
  - reference: PMID:24396138
    reference_title: "The endemic treponematoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "T. pallidum subsp. pertenue, T. pallidum subsp. endemicum, and T. carateum are the agents of the endemic treponematoses yaws, bejel (or endemic syphilis), and pinta, respectively."
    explanation: The abstract identifies T. carateum as the agent of pinta.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The etiological agent of pinta, Treponema carateum, cannot be
      distinguished morphologically or serologically from the not-yet-cultivable
      Treponema pallidum subspecies that cause venereal syphilis, yaws, and
      bejel.
    explanation: >-
      Supports both the identity of the agent and the morphologic and
      serologic indistinguishability that makes pinta a diagnosis of clinical
      and epidemiologic context rather than of laboratory confirmation.
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      is not currently classified as a T. pallidum subspecies since our
      molecular knowledge at this time is insufficient to warrant such a
      classification
    explanation: >-
      States why T. carateum retains separate species rank. The claim is about
      absent evidence, not demonstrated distance, which is why this entry does
      not assert a subspecies relationship in either direction.
transmission:
- name: Direct skin-to-skin contact
  description: >-
    Non-venereal transmission by direct contact with an infectious skin lesion,
    favoured by the warm, humid conditions that keep lesions moist and
    infectious. There is no sexual, congenital or vector-borne route.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yaws and pinta are found in warm, moist climates, mainly in forested
      tropical regions, and are transmitted by direct skin-to-skin contact.
    explanation: Directly states the transmission route and the climatic setting that supports it.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the endemic treponematoses are transmitted by nonsexual, direct
      skin-to-skin contact with infectious lesions
    explanation: >-
      States the route explicitly as non-sexual, which is the contrast with
      syphilis that this entry's transmission section turns on.
prevalence:
- population: Rural Panama, 1980s survey
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 20000.0
  notes: >-
    20% of the surveyed population with active or inactive disease. A local
    survey in a historically hyperendemic setting, not a national figure, and
    four decades old - it bounds how intense transmission once was rather than
    describing current burden.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A survey in Panama in the 1980s noted evidence of active or inactive
      pinta among 20% of the population
    explanation: Reports the surveyed prevalence figure and that it counts both active and inactive disease.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      clinical evidence of pinta was discovered in 20% of the examined
      inhabitants of a remote village in Panama
    explanation: >-
      Independently reports the same survey and locates it precisely to a
      single remote village, which is why this figure is recorded as a local
      rather than a national rate.
- population: Latin America, current
  measure_type: POINT_PREVALENCE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No current figure exists. Pinta has no active surveillance programme, and
    unlike yaws it is not covered by a WHO eradication campaign that would
    generate case counts.
  evidence:
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the current prevalence of pinta is unknown due to the lack of surveillance data"
    explanation: States directly that no current prevalence estimate is available.
epidemiology:
- name: Formerly endemic across tropical Latin America
  description: >-
    Pinta was endemic across Mexico, Central America and northern South
    America, and persisted longest in remote forested communities. It is now
    rare, with residual foci reported in remote regions of Mexico and among
    Amazonian communities in Brazil, Colombia and Peru.
  factors:
  - rural and remote residence
  - warm humid tropical climate
  - poverty and limited health-system access
  evidence:
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The World Health Organization lists 15 countries in Latin America where pinta was previously endemic."
    explanation: Establishes the historical geographic extent.
  - reference: DOI:10.15585/mmwr.rr7301a1
    reference_title: "CDC Laboratory Recommendations for Syphilis Testing, United States, 2024"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treponema carateum infection results in pinta which, although rare, is
      found in tropical areas of Latin America
    explanation: Confirms current rarity and the continuing Latin American distribution.
stages:
- name: Primary pinta
  description: >-
    An itchy, scaly papule or plaque appears at the inoculation site, usually
    on an exposed extremity, and enlarges to more than 10 cm. Unlike the
    primary lesion of yaws it does not ulcerate.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the pinta primary lesion is an itchy, scaly papule or plaque that expands
      to greater than 10 cm but does not ulcerate
    explanation: Defines the primary lesion and its distinguishing absence of ulceration.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The primary stage is characterized by the presence of one or several
      papules or erythematous scaly plaques that develop about 3 weeks after
      infection.
    explanation: Gives the incubation interval and the papular or plaque form of the primary lesion.
- name: Secondary pinta
  description: >-
    Disseminated skin lesions (pintids) appear months after the primary lesion
    and remain active and infectious for years, developing progressive
    pigmentary change. Dissemination stays within the skin.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In pinta, lesions remain active and infectious for many years
    explanation: >-
      Supports the defining feature of the secondary stage - lesions that
      persist and stay transmissible rather than resolving as secondary yaws
      lesions do.
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "pinta is a noninvasive condition causing only local dermal lesions."
    explanation: >-
      Supports that dissemination remains confined to the skin, in contrast to
      the bone and cartilage involvement of secondary yaws and bejel.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The secondary stage usually appears several months after the initial
      manifestations of the primary stage.
    explanation: Gives the interval between the primary and secondary stages.
- name: Late pinta
  description: >-
    Years after infection the lesions become dyschromic and then achromic,
    accompanied by cutaneous atrophy. The depigmentation persists after cure.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Epidermal atrophy and the presence of many melanophages in the dermis are
      typical findings of late-stage pinta
    explanation: Defines the histological signature of the late stage.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The late (tertiary) stage usually develops 2–5 years after initial
      infection and is characterized by pigmentary abnormalities
    explanation: Gives the interval to late disease and names its defining pigmentary character.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      resulting in a mottled appearance of the skin, which can persist
      lifelong
    explanation: >-
      Supports the lifelong persistence of the pigmentary change, which is the
      basis for treating pinta's disability as cosmetic and permanent rather
      than as active infection.
pathophysiology:
- name: Cutaneous Treponemal Inoculation
  biological_scale: TISSUE
  description: >-
    Direct contact with an infectious lesion introduces Treponema carateum into
    the skin, where it replicates locally and produces the primary scaly papule
    or plaque. The inoculation site is typically an exposed extremity.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Intradermal Treponemal Dissemination
    description: Untreated primary infection spreads within the skin to produce secondary lesions.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0002283
      reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In pinta, lesions remain active and infectious for many years
      explanation: Supports progression from the primary lesion to persistent disseminated disease.
  - target: Skin plaque
    description: Local replication produces an expanding scaly plaque at the inoculation site.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0002283
      reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the pinta primary lesion is an itchy, scaly papule or plaque that expands
        to greater than 10 cm but does not ulcerate
      explanation: Links the inoculation mechanism to its primary cutaneous lesion.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yaws and pinta are found in warm, moist climates, mainly in forested
      tropical regions, and are transmitted by direct skin-to-skin contact.
    explanation: Establishes skin contact as the route by which the organism reaches the inoculation site.
- name: Intradermal Treponemal Dissemination
  biological_scale: TISSUE
  description: >-
    The organism spreads within the skin to produce disseminated secondary
    lesions that remain viable and transmissible for years. Dissemination is
    confined to the dermis and epidermis: pinta produces none of the bone,
    cartilage, cardiovascular or neurological involvement seen in the other
    treponematoses, and this skin-limited tropism is the single feature that
    most distinguishes it from yaws, bejel and syphilis.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Melanocyte Injury and Basal Melanin Loss
    description: Persistent intradermal infection drives the pigmentary lesion of pinta.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0002283
      reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In the early lesion, there is loss of melanin in basal cells and liquefaction degeneration."
      explanation: Identifies basal-cell melanin loss as the earliest pigmentary consequence of skin infection.
  - target: Skin rash
    description: Dissemination within the skin produces the generalized secondary eruption.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0002283
      reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In pinta, lesions remain active and infectious for many years
      explanation: Links dissemination to the persistent secondary lesions.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "pinta is a noninvasive condition causing only local dermal lesions."
    explanation: >-
      Supports the skin-limited tropism this node asserts, in contrast with the
      moderately invasive course of yaws and bejel.
- name: Melanocyte Injury and Basal Melanin Loss
  biological_scale: CELLULAR
  description: >-
    In early lesions the basal layer loses melanin and undergoes liquefaction
    degeneration, the cellular event that converts a treponemal skin infection
    into a pigmentary disease. This is what makes pinta unique among the
    treponematoses: the organism's lasting damage is to the pigmentary
    apparatus of the epidermis rather than to tissue architecture.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  biological_processes:
  - preferred_term: melanin biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0042438
      label: melanin biosynthetic process
  downstream:
  - target: Hypopigmentation of the skin
    description: Loss of basal-layer melanin produces the hypochromic and achromic lesions.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0002283
      reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In the early lesion, there is loss of melanin in basal cells and liquefaction degeneration."
      explanation: Directly links basal melanin loss to the depigmented phenotype.
  - target: Dermal Melanophage Accumulation and Epidermal Atrophy
    description: Melanin released from injured basal cells is taken up by dermal macrophages.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0002283
      reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Epidermal atrophy and the presence of many melanophages in the dermis are
        typical findings of late-stage pinta
      explanation: Supports progression from early basal-layer injury to the late melanophage-rich lesion.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the early lesion, there is loss of melanin in basal cells and liquefaction degeneration."
    explanation: >-
      The histological description of the early lesion, which is the direct
      evidence for melanocyte-level injury.
- name: Dermal Melanophage Accumulation and Epidermal Atrophy
  biological_scale: TISSUE
  description: >-
    Late lesions show epidermal atrophy and numerous melanin-laden macrophages
    in the dermis. Because the pigment has been relocated from the epidermis
    into dermal melanophages rather than merely lost, the dyschromia is
    structural, which is why depigmentation persists after the infection is
    cured and treatment restores infectivity status but not appearance.
  cell_types:
  - preferred_term: melanophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Diffuse skin atrophy
    description: Late lesions thin the epidermis.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0002283
      reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Epidermal atrophy and the presence of many melanophages in the dermis are
        typical findings of late-stage pinta
      explanation: Directly links the late-stage lesion to cutaneous atrophy.
  - target: Hypopigmented skin patches
    description: Pigment relocation into the dermis leaves persistent achromic patches.
    evidence:
    - reference: DOI:10.1371/journal.pntd.0002283
      reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "leading to extensive depigmentation and acral dyschromia"
      explanation: Supports the late achromic and dyschromic outcome of this node.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Epidermal atrophy and the presence of many melanophages in the dermis are
      typical findings of late-stage pinta
    explanation: The histological definition of the late-stage lesion this node represents.
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although early pinta lesions heal within several months after penicillin
      administration, this treatment cannot reverse the skin changes of late
      pinta that can stigmatize those who were infected.
    explanation: >-
      Supports this node's central claim that the late pigmentary lesion is
      structural rather than active infection: curing the organism does not
      undo it.
- name: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
  description: >-
    Treponema carateum maintains its peptidoglycan cell wall by penicillin-binding
    protein (PBP) transpeptidase cross-linking. This essential, bacteria-specific
    reaction is the target of the penicillin used to treat pinta: beta-lactam
    acylation of the PBP active site halts cross-linking and is treponemicidal,
    which is why a single penicillin injection cures all stages.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  evidence:
  - reference: PMID:22203377
    reference_title: "From the regulation of peptidoglycan synthesis to bacterial growth and morphology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      although glycan chain polymerization occurs in the absence of
      transpeptidation (for example, in the presence of penicillin), efficient
      transpeptidation requires ongoing GTase reactions
    explanation: >-
      Establishes that beta-lactams (penicillin) act by blocking PBP
      transpeptidation, the cross-linking step this node represents. Evidence
      source is OTHER as this is a review article.

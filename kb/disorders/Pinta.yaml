- name: Absence of ulceration
  description: >-
    Unlike yaws, pinta lesions do not ulcerate. This is a negative finding that
    distinguishes the two on biopsy as well as clinically.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In pinta, there is no ulcer formation comparable to that in yaws"
    explanation: States the absence of ulceration that separates pinta from yaws histologically.
diagnosis:
- name: Clinical and epidemiologic diagnosis
  description: >-
    Diagnosis rests on compatible lesion morphology together with residence in,
    or origin from, a historically endemic area, plus exclusion of the
    dyspigmentation mimics. Serology confirms treponemal infection but cannot
    name which treponematosis it is.
  evidence:
  - reference: PMID:26304920
    reference_title: "Pinta: Latin America's Forgotten Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      U.S. physicians should consider pinta in the differential diagnosis of
      skin diseases in children and adolescents who come from areas where pinta
      was previously endemic and have a positive reaction in serological tests
      for syphilis.
    explanation: >-
      Describes the actual diagnostic pathway - endemic-area origin plus
      reactive syphilis serology plus compatible skin disease.
- name: Treponemal and nontreponemal serology
  description: >-
    The same tests used for syphilis (RPR or VDRL, confirmed by TPHA, TPPA or
    FTA-Abs) are used for pinta. Their central limitation is that they are
    positive in every treponematosis, so a reactive result establishes
    treponemal infection but not which one.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      treponemal tests TPHA, TPPA, and FTA-Abs are more specific, but remain
      positive for life
    explanation: Names the confirmatory treponemal tests used across the endemic treponematoses.
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      serological tests cannot distinguish between endemic treponematoses
      infections and syphilis
    explanation: >-
      States the limitation that makes serology non-diagnostic for pinta
      specifically and forces reliance on clinical and epidemiologic context.
differential_diagnoses:
- name: Tinea versicolor
  description: A common tropical dyspigmentation that mimics the dyschromic lesions of pinta.
  distinguishing_features:
  - Superficial scale demonstrating hyphae and spores on potassium hydroxide microscopy
  - Non-reactive treponemal serology
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Disorders associated with dyspigmentation, such as
      tinea versicolor, vitiligo, melasma, and leprosy, are often in the
      differential diagnosis of pinta
    explanation: Names tinea versicolor as a differential for pinta.
- name: Vitiligo
  description: >-
    Acquired depigmented macules that closely resemble the achromic patches of
    late pinta.
  distinguishing_features:
  - No preceding papular or plaque stage
  - No endemic exposure history
  - Non-reactive treponemal serology
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT

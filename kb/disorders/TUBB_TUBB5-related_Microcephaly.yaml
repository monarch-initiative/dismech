- discussion_id: gap_tubb_tubb5_natural_history_and_phenotype_breadth
  prompt: >-
    What is the full natural-history and phenotype range for TUBB/TUBB5-related
    microcephaly beyond the three original cases and small tubulinopathy cohort
    counts?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Global Developmental Delay / Intellectual Disability
  - phenotypes#Polymicrogyria-like Cortical Dysplasia / Simplified Gyral Pattern
  rationale: >-
    The entry is supported by a strong founding case series and model mechanism,
    but TUBB/TUBB5-specific longitudinal outcomes, seizure frequency, genotype-
    phenotype correlations, and variant-class effects remain much thinner than
    for TUBA1A or TUBB2B. Two 2025-2026 reports narrow the gap without closing
    it: a Korean beta-tubulinopathy cohort places TUBB alongside the other
    beta-tubulin genes in a series of only twelve patients across five genes,
    and a single family shows complete penetrance with markedly variable
    expressivity - including a transmitting mother judged healthy until MRI -
    which means published TUBB case counts are a floor, not an estimate.
  evidence:
  - reference: PMID:41152456
    reference_title: "Expanding genetic and clinical spectra of β-tubulinopathies: A Korean study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten pathogenic or likely pathogenic missense variants were identified in
      five β-tubulin genes (TUBB2A, TUBB2B, TUBB3, TUBB4A, and TUBB5).
    explanation: >-
      Shows that even a contemporary multi-gene cohort contributes only a
      handful of TUBB/TUBB5 patients, so gene-specific natural history remains
      underpowered.
  - reference: PMID:42015805
    reference_title: "Tubulinopathy Case Series: Marked Intrafamilial Phenotypic Variability Associated With a Novel Missense TUBB Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant showed complete penetrance but markedly variable expressivity,
      contributing to the broad clinical spectrum associated with TUBB-related
      disorders.
    explanation: >-
      Documents complete penetrance with markedly variable expressivity within a
      single family, the specific reason gene-level severity cannot yet be
      predicted from genotype.
  - reference: PMID:42015805
    reference_title: "Tubulinopathy Case Series: Marked Intrafamilial Phenotypic Variability Associated With a Novel Missense TUBB Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After identification of the TUBB variant in both siblings and a presumably
      healthy mother, maternal MRI also demonstrated features consistent with
      tubulinopathy.
    explanation: >-
      A transmitting parent considered healthy was found on imaging to be
      affected, showing that ascertainment by severe presentation systematically
      undercounts the mild end of the TUBB phenotype range.
- discussion_id: gap_tubb_tubb5_notch_arm_human_translatability
  prompt: >-
    Does the Notch-dependent block of neural progenitor differentiation seen in
    tubb5-null zebrafish operate in human TUBB-related microcephaly, and is it
    pharmacologically reversible in a human model?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Notch-Dependent Block of Neural Progenitor Differentiation
  - pathophysiology#Microcephaly and Structural Brain Abnormalities
  rationale: >-
    The zebrafish arm is mechanistically attractive because it is reversible:
    gamma-secretase inhibition with DAPT rescued both developmental and
    locomotor deficits. But three features do not transfer automatically to the
    human disease. First, the fish model is a homozygous knockout, whereas human
    disease alleles are heterozygous missense variants whose mechanism has been
    shown to be gain-of-function rather than loss-of-function - a null and a
    dose-dependent gain-of-function allele need not converge on the same
    downstream pathway. Second, the mammalian mechanism established to date is
    p53-associated apoptosis of upper-layer neurons, which removes neurons that
    were made, while the Notch arm prevents them being made; whether both operate
    in humans, or whether one is species-specific, is untested. Third, DAPT
    rescue in a larval fish says nothing about a therapeutic window in a human
    brain whose malformation is established prenatally. Resolving this requires a
    human neural model carrying a patient TUBB missense allele.
  evidence:
  - reference: PMID:42241496
    reference_title: tubb5 knockout in zebrafish causes neurodevelopmental defects via notch pathways.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      DAPT treatment rescued both developmental and locomotor deficits tubb5
      knockout zebrafish.
    explanation: >-
      The pharmacological rescue that makes this arm interesting, and the result
      whose translatability to human TUBB missense disease is the open question.
  - reference: PMID:41309602
    reference_title: Mutations in the β-tubulin TUBB impair ciliogenesis and are associated with ciliopathy-like phenotypes.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we demonstrate that the disease mechanism is not
      haploinsufficiency and that other patient mutations in TUBB affect cilia
      formation, putting forward defective ciliogenesis as a contributing
      pathogenic factor in a subset of tubulinopathy patients.
    explanation: >-
      Establishes that human TUBB disease is not a loss-of-function mechanism,
      which is precisely why a homozygous-null zebrafish phenotype cannot be
      assumed to model it.
notes: >-
  Entry created from cortical-malformation epic 4098 (issue 4086), seeded from
  Romero, Bahi-Buisson & Francis 2018 and refined with Falcon deep research.
  The primary literature uses TUBB5; HGNC now resolves TUBB5 to current symbol
  TUBB (HGNC:20778), so this entry preserves both names in the title while using
  TUBB as the gene term. The disease is not lumped with generic primary
  microcephaly or generic tubulinopathy because its coherent skeleton combines
  beta-tubulin heterodimer/microtubule dysfunction with a progenitor cell-cycle,
  spindle, p53-apoptosis, and upper-layer neuron-output branch. It conforms
  mainly to the neural progenitor centrosome-spindle dysfunction module, with a
  secondary conformance to the microtubule-dependent neuronal migration module
  for the migration/cortical dysgyria branch. The Falcon report found no direct
  TUBB/TUBB5 organoid or iPSC disease model; the organoid experiment is included
  as a human/model mismatch knowledge gap, not as existing disease evidence.

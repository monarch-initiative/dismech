- name: Notch-Dependent Block of Neural Progenitor Differentiation
  biological_scale: CELLULAR
  description: >-
    In a zebrafish tubb5 knockout, loss of the beta-tubulin isotype upregulates
    the Notch effectors notch1a and her5, which hold neural progenitors in an
    undifferentiated state: neurogenin1- and huc-positive neurons are reduced
    while sox2-positive cells increase. Pharmacological Notch inhibition with
    DAPT rescues the developmental and locomotor deficits, so the arm is
    reversible in that model. This is curated as a separate branch from the
    p53-apoptosis arm because it removes neurons by failing to make them rather
    than by killing them, and the two have different therapeutic implications.
    The evidence is zebrafish-only; see the
    gap_tubb_tubb5_notch_arm_human_translatability discussion.
  cell_types:

animal_models:
- name: tubb5 knockout zebrafish (CRISPR/Cas9)
  species: Zebrafish
  genotype: tubb5 homozygous CRISPR/Cas9 knockout
  publication: PMID:42241496
  description: >-
    A CRISPR/Cas9 tubb5-null zebrafish. Homozygotes die within two weeks
    post-fertilization with developmental delay, craniofacial malformation,
    uncoordinated movement, reduced locomotor activity, impaired photomotor
    response and increased seizure susceptibility. The model's distinctive
    contribution is a reversible mechanism: tubb5 loss derepresses Notch
    effectors that hold neural progenitors undifferentiated, and gamma-secretase
    inhibition rescues the phenotype.
  modeled_mechanisms:
  - target: Notch-Dependent Block of Neural Progenitor Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model is the sole source of evidence for this node: it establishes the
      Notch-dependent differentiation block and shows it is pharmacologically
      reversible.
    limitations: >-
      A homozygous null, whereas human disease alleles are heterozygous missense
      variants shown to act by gain-of-function rather than loss-of-function; a
      null and a dose-dependent gain-of-function allele need not converge on the
      same downstream pathway. Zebrafish larval neurodevelopment also lacks the
      expanded outer subventricular zone of human cortex.
    readouts:
    - name: Notch effector transcript levels (notch1a, her5)
      target: Notch-Dependent Block of Neural Progenitor Differentiation
      direction: INCREASED
      interpretation: >-
        Transcriptomic signature of Notch derepression in tubb5-null larvae.
      biological_processes:
      - preferred_term: Notch signaling pathway
        term:
          id: GO:0007219
          label: Notch signaling pathway
        modifier: INCREASED
      evidence:
      - reference: PMID:42241496
        reference_title: tubb5 knockout in zebrafish causes neurodevelopmental defects via notch pathways.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Transcriptome analysis revealed that tubb5 knockout larvae showed
          upregulated expression of notch1a and her5, which inhibit neural
          progenitor differentiation.
        explanation: Reports the measured direction of change for this readout.
    - name: Differentiated neuron versus progenitor marker counts
      target: Notch-Dependent Block of Neural Progenitor Differentiation
      direction: DECREASED
      interpretation: >-
        Fewer neurogenin1/huc-positive differentiated neurons with more
        sox2-positive progenitors - the cellular readout of the block.
      evidence:
      - reference: PMID:42241496
        reference_title: tubb5 knockout in zebrafish causes neurodevelopmental defects via notch pathways.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Whole-mount in situ hybridization demonstrated decreased neurogenin1
          and huc positive neurons, while sox2 positive neurons were increased in
          tubb5 mutants, indicating disrupted neural progenitor differentiation.
        explanation: Reports the in situ measurement behind this readout.
    - name: Developmental and locomotor phenotype under gamma-secretase inhibition
      target: Notch-Dependent Block of Neural Progenitor Differentiation
      direction: RESTORED
      interpretation: >-
        DAPT rescue establishes that the differentiation block is Notch-dependent
        and reversible in this model.
      evidence:
      - reference: PMID:42241496
        reference_title: tubb5 knockout in zebrafish causes neurodevelopmental defects via notch pathways.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          DAPT treatment rescued both developmental and locomotor deficits tubb5
          knockout zebrafish.
        explanation: The rescue arm of the model, measured as developmental and locomotor recovery.
    evidence:
    - reference: PMID:42241496
      reference_title: tubb5 knockout in zebrafish causes neurodevelopmental defects via notch pathways.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This study demonstrates that tubb5 regulates neural progenitor
        differentiation via the Notch signaling pathway
      explanation: >-
        Supports treating this model as informative for the Notch-dependent
        differentiation node.
  - target: Microcephaly and Structural Brain Abnormalities
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces a broadly abnormal neurodevelopmental phenotype - developmental
      delay, craniofacial malformation, uncoordinated movement and increased
      seizure susceptibility - but not the defining human readout.
    limitations: >-
      No microcephaly, cortical dysgyria or basal ganglia dysmorphism is
      reported: zebrafish have no gyrencephalic cortex and no upper-layer
      neocortical neurons for the human mechanism to act on. Homozygotes are
      lethal within two weeks post-fertilization, so there is no adult course to
      compare with the human natural history.
    readouts:
    - name: Larval seizure susceptibility and locomotor activity
      target: Microcephaly and Structural Brain Abnormalities
      direction: ALTERED
      interpretation: >-
        A functional neurodevelopmental readout standing in for the human
        epilepsy and motor phenotype, not for the malformation itself.
      evidence:
      - reference: PMID:42241496
        reference_title: tubb5 knockout in zebrafish causes neurodevelopmental defects via notch pathways.
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Homozygous mutants were lethality within two weeks post-fertilization
          along with developmental delay, craniofacial malformations,
          uncoordinated movement and increased seizure susceptibility.
        explanation: >-
          Reports the phenotypes actually measured, which cover the functional
          but not the structural side of the human presentation.
    evidence:
    - reference: PMID:42241496
      reference_title: tubb5 knockout in zebrafish causes neurodevelopmental defects via notch pathways.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutations in TUBB5 cause complex cortical dysplasia with other brain
        malformations. However, the pathogenic mechanisms underlying TUBB5
        mutations remain incompletely understood.
      explanation: >-
        The model is offered as a mechanism-discovery system for TUBB5 disease;
        it is recorded here as only partially recapitulating the human
        malformation phenotype.

discussions:
- discussion_id: gap_tubb_tubb5_human_organoid_translatability
  prompt: >-
    Are the progenitor cell-cycle, spindle-orientation, apoptosis, and migration
    defects observed in mouse Tubb5 models conserved in human radial glia,
    outer-radial-glia-like cells, and cortical organoids carrying pathogenic
    TUBB/TUBB5 variants?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progenitor Cell-Cycle and Spindle Dysfunction
  - pathophysiology#p53-Associated Apoptosis and Progenitor Pool Distortion
  - pathophysiology#Impaired Neurogenic Division and Migration
  rationale: >-
    The strongest mechanistic evidence is mouse based, while the Falcon report
    did not identify a direct TUBB/TUBB5 human iPSC or organoid disease model.
    Human cortical expansion depends on outer radial glia and OSVZ biology, so
    a human organoid/iPSC test is needed before assuming the mouse progenitor
    apoptosis branch fully explains the human microcephaly phenotype.
  evidence:
  - reference: PMID:26903504
    reference_title: Mutations in the murine homologue of TUBB5 cause microcephaly by perturbing cell cycle progression and inducing p53-associated apoptosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cause TUBB5-associated microcephaly by exploiting two new mouse models
    explanation: >-
      Identifies the main mechanistic evidence source as mouse models, which
      motivates a human/model translatability gap.
  - reference: PMID:28111201
    reference_title: Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recent work has uncovered critical cellular and molecular differences
      between cortical development in humans and mice, further underscoring the
      need to develop human model systems.
    explanation: >-
      Supports organoid/iPSC testing when mouse cortical-development mechanisms
      are being translated to human disease.

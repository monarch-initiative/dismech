pathophysiology:
- name: Altered TUBB/TUBB5 Beta-Tubulin Function
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
  description: >-
    Pathogenic variants in the beta-tubulin isotype historically named TUBB5
    alter chaperone-dependent tubulin heterodimer assembly and microtubule
    function. The upstream lesion is not simply a generic microcephaly label:
    different missense variants perturb the beta-tubulin folding/assembly
    machinery in different ways and feed both progenitor cell-cycle and neuronal
    migration branches.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Reported disease alleles are heterozygous de novo missense substitutions.
      Haploinsufficiency has been tested directly and excluded: TUBB-haploid
      hTERT-RPE1 cells ciliate normally, and the G308S, E108K and E401K patient
      variants only produce their ciliation defect when overexpressed in
      wild-type cells - the signature of a gain-of-function rather than a
      loss-of-function allele. GAIN_OF_FUNCTION is therefore recorded here
      instead of the DOMINANT_NEGATIVE category used for TUBA1A and TUBB3.
      Curators should note the qualification the same work makes: E401K may act
      through a dual mechanism, with loss-of-function effects contributing to
      microcephaly while gain-of-function effects drive defective neuronal
      positioning, so this category describes the best-resolved ciliation and
      positioning arm rather than every phenotype of every allele.

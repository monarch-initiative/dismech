mechanistic_hypotheses:
- hypothesis_group_id: coq8a_complex_stabilization_model
  hypothesis_label: COQ8A Loss and Coenzyme Q Biosynthesis-Complex Model
  status: CANONICAL
  description: >-
    COQ8A is an atypical mitochondrial ATPase rather than a conventional
    protein kinase. Disease-associated loss impairs stabilization of the
    coenzyme Q biosynthesis complex, lowers coenzyme Q10, and limits
    coenzyme-Q-dependent respiratory-chain electron transfer.
  evidence:
  - reference: PMID:27499294
    reference_title: Cerebellar Ataxia and Coenzyme Q Deficiency through Loss of Unorthodox Kinase Activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      COQ8A and yeast Coq8p specifically stabilize a CoQ biosynthesis complex
      through unorthodox PKL functions.
    explanation: Cross-species biochemical work establishes the core COQ8A complex-stabilization function.
  - reference: PMID:26866375
    reference_title: AarF Domain Containing Kinase 3 (ADCK3) Mutant Cells Display Signs of Oxidative Stress, Defects in Mitochondrial Homeostasis and Lysosomal Accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ADCK3 deficiency decreased cellular CoQ10 content.
    explanation: Patient-cell work directly establishes coenzyme Q10 depletion downstream of COQ8A deficiency.
- hypothesis_group_id: coq8a_cerebellar_vulnerability_model
  hypothesis_label: Purkinje-Cell Bioenergetic Vulnerability Model
  status: EMERGING
  description: >-
    Coenzyme-Q-dependent energy failure is proposed to create selective
    cerebellar vulnerability. Coq8a-null mice develop Purkinje-cell dysfunction
    and progressive ataxia, but why the cerebellum is preferentially affected
    in humans remains unresolved.
  evidence:
  - reference: PMID:27499294
    reference_title: Cerebellar Ataxia and Coenzyme Q Deficiency through Loss of Unorthodox Kinase Activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice lacking COQ8A develop a slowly progressive cerebellar ataxia linked
      to Purkinje cell dysfunction and mild exercise intolerance, recapitulating ARCA2.
    explanation: The knockout mouse supports Purkinje-cell dysfunction but does not fully explain human selective vulnerability.
- hypothesis_group_id: oxidative_lysosomal_stress_model
  hypothesis_label: Oxidative, Mitochondrial, and Lysosomal Stress Model
  status: EMERGING
  description: >-
    COQ8A-deficient patient cells show oxidative stress, altered mitochondrial
    homeostasis, and increased lysosomal content. These are reproducible
    cellular consequences, but their order and causal contribution to
    neurodegeneration have not been established in patients.
  evidence:
  - reference: PMID:26866375
    reference_title: AarF Domain Containing Kinase 3 (ADCK3) Mutant Cells Display Signs of Oxidative Stress, Defects in Mitochondrial Homeostasis and Lysosomal Accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cell lines derived from ARCA-2 patients display signs of oxidative stress,
      defects in mitochondrial homeostasis and increases in lysosomal content.
    explanation: Patient-derived cells nominate this stress pathway without proving it causes the neurologic syndrome.

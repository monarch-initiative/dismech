discussions:
- discussion_id: coq8a_selective_cerebellar_vulnerability
  prompt: >-
    Why does a ubiquitous coenzyme-Q biosynthesis defect preferentially injure
    cerebellar circuits, especially Purkinje cells?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Cerebellar Neurodegeneration
  rationale: >-
    The primary CoQ10 deficit and mouse Purkinje-cell dysfunction are
    established, but the relevant human neural cell state, metabolic threshold,
    and contribution of oxidative or lysosomal stress remain unresolved.
  evidence:
  - reference: PMID:26866375
    reference_title: AarF Domain Containing Kinase 3 (ADCK3) Mutant Cells Display Signs of Oxidative Stress, Defects in Mitochondrial Homeostasis and Lysosomal Accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      why mutations in this gene lead to human disease is poorly understood.
    explanation: The patient-cell study explicitly identifies the unresolved disease mechanism.
- discussion_id: coq8a_treatment_response_variability
  prompt: >-
    Which dose, formulation, treatment window, and biomarker predict neurologic
    response to coenzyme Q10?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Coenzyme Q10 supplementation
  rationale: >-
    Observational response is near 50%, small longitudinal cohorts lack
    controls, and individual bioenergetic imaging responses differ. A
    randomized COQ8A-specific trial and validated pharmacodynamic biomarkers
    are still absent.
  evidence:
  - reference: PMID:35642996
    reference_title: The cerebellar bioenergetic state predicts treatment response in COQ8A-related ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      oral Q10 supplementation but the benefit is debated.
    explanation: The imaging study frames variable response as an unresolved therapeutic problem.
- discussion_id: improved_coq10_delivery
  prompt: >-
    Can formulations that improve tissue and mitochondrial delivery outperform
    oral nutraceutical coenzyme Q10 in COQ8A disease?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - experimental_models#COQ8A patient-fibroblast intervention model
  rationale: >-
    BPM31510 enriched CoQ10 in COQ8A fibroblasts and peripheral murine tissues,
    but it has not demonstrated brain exposure or clinical efficacy in
    COQ8A-ataxia.
  evidence:
  - reference: PMID:41931022
    reference_title: BPM31510 Increases the CoQ Pool in Chemically Induced CoQ-Deficient Cells, CoQ-Deficient Patient Fibroblasts, and in Metabolically Active Murine Tissues.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      BPM31510 outperformed nutraceutical formulations in enriching CoQ10 levels.
    explanation: The in-vitro delivery result motivates, but does not establish, therapeutic translation.
notes: >-
  This file represents the COQ8A/ADCK3-specific MONDO disease, not the full
  genetically heterogeneous primary coenzyme Q10 deficiency group curated in
  Primary_Coenzyme_Q10_Deficiency.yaml. The canonical chain is biallelic COQ8A
  dysfunction, reduced CoQ10, and impaired respiratory-chain function.
  Oxidative stress, lysosomal accumulation, systemic manifestations, and
  selective human cerebellar vulnerability should not be collapsed into one
  fully proven downstream mechanism. CoQ10 supplementation is biologically
  plausible and may help, especially when started early, but published evidence
  remains observational and response is variable.
review_notes: >-
  Full review completed 2026-07-23. The scope was reconciled to MONDO:0012784,
  Orphanet ORPHA:139485, the 59-patient multicenter natural-history cohort, and
  the broader Primary_Coenzyme_Q10_Deficiency entry. ClinicalTrials.gov API
  searches for COQ8A, ADCK3, the full disease name, and primary coenzyme Q10
  deficiency found no COQ8A-specific interventional trial; the direct CoRDS
  rare-disease registry NCT01793168 and the broader mitochondrial registry
  NCT05554835 were retained as observational resources. NCBI GEO searches for
  COQ8A, ADCK3, and disease-name combinations found no disease-specific public
  accession; ADCK3 hits were unrelated cancer or CAR-T perturbation datasets,
  so datasets remains empty. The review incorporated 2024 status-epilepticus
  and treatment-response reports and 2026 pediatric supplementation,
  ketogenic-fasting, formulation-delivery, and MELAS-mimic reports while
  labeling single-case and preclinical findings explicitly.

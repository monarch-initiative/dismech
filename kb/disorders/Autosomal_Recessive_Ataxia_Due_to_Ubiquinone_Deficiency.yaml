name: Autosomal Recessive Ataxia Due to Ubiquinone Deficiency
creation_date: "2026-04-23T00:00:00Z"
description: >-
  Autosomal recessive ataxia due to ubiquinone deficiency is the
  COQ8A-related form of primary coenzyme Q10 deficiency, also called
  COQ8A-ataxia, ARCA2, SCAR9, or primary coenzyme Q10 deficiency-4. Biallelic
  pathogenic COQ8A variants impair the atypical mitochondrial ATPase that
  stabilizes the coenzyme Q biosynthesis complex, lowering coenzyme Q10 and
  compromising respiratory-chain electron transfer. The core phenotype is
  childhood-onset, slowly progressive cerebellar ataxia with cerebellar
  atrophy, but onset can range into adulthood and the spectrum includes
  cognitive impairment, epilepsy, dystonia, myoclonus, tremor, and myopathic
  features. Oral coenzyme Q10 is mechanistically rational and observational
  cohorts report improvement in some patients, but response is variable and no
  randomized COQ8A-specific efficacy trial has established an optimal dose or
  formulation.
category: Mendelian
synonyms:
- COQ8A-ataxia
- ADCK3-related ataxia
- autosomal recessive cerebellar ataxia type 2
- ARCA2
- autosomal recessive spinocerebellar ataxia type 9
- SCAR9

- name: Mitochondrial epilepsy and stroke-like syndromes
  description: >-
    COQ8A deficiency can present with refractory seizures, cortical MRI
    abnormalities, lactic acidosis, and stroke-like episodes that resemble
    MELAS or POLG-related disease.
  distinguishing_features:
  - Nuclear biallelic COQ8A variants establish the diagnosis rather than a primary mitochondrial-DNA MELAS genotype.
  - Cerebellar ataxia and atrophy may precede the epilepsy syndrome.

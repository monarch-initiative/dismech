clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Most patients have slowly progressive mild-to-moderate ataxia over years
    or decades, but epilepsy, cognitive impairment, movement disorders, muscle
    weakness, and occasional severe encephalopathic or cardiomyopathic courses
    can substantially impair mobility and independence.
  evidence:
  - reference: DOI:10.1002/ana.25751
    reference_title: "Clinico‐Genetic, Imaging and Molecular Delineation of <scp><i>COQ8A</i></scp>‐Ataxia: A Multicenter Study of 59 Patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cross‐sectional (n = 34) and longitudinal (n = 7) assessments
      consistently indicated mild‐to‐moderate progression of ataxia (SARA:
      0.45/year).
    explanation: The largest systematic cohort quantifies the usual rate and severity of progression.

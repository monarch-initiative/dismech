name: Mendelian Susceptibility To Mycobacterial Diseases Due To Complete IL12B Deficiency
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
synonyms:
- IL-12p40 deficiency
- Complete IL-12p40 deficiency
- IL-12B deficiency
- MSMD due to complete IL12B deficiency
- Immunodeficiency 29, mycobacteriosis
- IMD29
description: >
  Mendelian susceptibility to mycobacterial disease (MSMD) due to complete IL-12p40
  deficiency is an autosomal recessive inborn error of immunity caused by biallelic
  loss-of-function variants in IL12B, the gene encoding the p40 subunit. It presents as
  MSMD: a selective predisposition to clinical disease caused by weakly virulent
  mycobacteria, in particular the Bacille Calmette-Guerin (BCG) vaccine strain and
  environmental non-tuberculous mycobacteria, together with non-typhoidal salmonellosis,
  in individuals with otherwise unremarkable routine immunological testing.

  Almost every genetic etiology of MSMD converges on interferon gamma (IFN-gamma):
  each either impairs the production of the cytokine or the cellular response to it.
  IL-12p40 deficiency sits firmly in the production arm, and its molecular logic is the
  shared-subunit one. The p40 chain encoded by IL12B is not specific to interleukin-12:
  it pairs with p35 (IL12A) to form the IL-12p70 heterodimer and with p19 (IL23A) to
  form IL-23. A complete p40 defect therefore abolishes both cytokines at once. Loss of
  IL-12p70 removes the dominant signal that drives NK and T lymphocytes to produce
  IFN-gamma, so IFN-gamma-dependent activation of macrophages fails and intramacrophagic
  mycobacteria and Salmonella replicate unchecked. Loss of IL-23 additionally impairs the
  IL-23-dependent IL-17 axis, which is why a minority of patients also develop chronic
  mucocutaneous candidiasis.

  It was the first human disease shown to result from a cytokine gene defect, reported by
  Altare and colleagues in 1998 in a child with disseminated BCG and Salmonella
  enteritidis infection. The largest cohort, 49 patients from 30 kindreds, established the
  clinical picture: childhood-onset BCG disease (disseminated or regional), recurrent
  non-typhoidal salmonellosis, high but incomplete clinical penetrance, and a poor
  prognosis with mortality approaching one third of patients. Almost all reported alleles
  are private founder mutations concentrated in consanguineous populations of the Middle
  East, North Africa, and South Asia. The condition is clinically nearly indistinguishable
  from IL-12 receptor beta-1 (IL-12Rbeta1) deficiency, its downstream counterpart on the
  same signalling axis. Because the lesion is in cytokine production rather than in the
  response to IFN-gamma, recombinant IFN-gamma is a mechanistically rational adjunct to
  antimycobacterial chemotherapy — the therapeutic dividing line within MSMD.

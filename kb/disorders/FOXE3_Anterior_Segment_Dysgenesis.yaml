- name: FOXE3 Molecular Genetic Testing
  description: >-
    Direct sequencing of the single-exon FOXE3 coding region or multigene
    anterior-segment/exome sequencing with copy-number evaluation identifies
    dominant C-terminal extension alleles and recessive biallelic truncating or
    forkhead-domain missense variants.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34046667
    reference_title: "Comprehensive phenotypic and functional analysis of dominant and recessive FOXE3 alleles in ocular developmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FOXE3 coding region (NM_012186.3) was examined by direct DNA sequencing of PCR products, using overlapping primer pairs (Supplementary Material, Table S3) as described (11), or via exome sequencing (47,48)."
    explanation: >-
      Documents targeted FOXE3 sequencing and exome sequencing for molecular
      diagnosis.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we identify new recessive FOXE3 mutations causative for microphthalmia, sclerocornea, primary aphakia, and glaucoma"
      explanation: Supports glaucoma as part of the recessive FOXE3 anterior segment phenotype.
diagnosis:
- name: Ocular Ultrasonography
  description: >-
    Because dense congenital corneal opacity or total sclerocornea often
    precludes direct slit-lamp visualization of the anterior chamber, lens, and
    posterior segment, A-scan/B-scan ocular ultrasonography and ultrasound
    biomicroscopy (UBM) are used to assess anterior chamber depth, iridocorneal
    or keratolenticular adhesions, primary aphakia, microphthalmia, and optic
    disc coloboma.
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:34046667
    reference_title: "Comprehensive phenotypic and functional analysis of dominant and recessive FOXE3 alleles in ocular developmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given dense corneal opacities, full clinical assessment of FOXE3 defects requires alternative imaging modalities, such as ultrasound, optical coherence tomography (OCT), or magnetic resonance imaging (MRI) to diagnose; thus, the complete spectrum of FOXE3 ocular defects in many affected individuals may not be fully identified."
    explanation: >-
      Establishes ocular ultrasonography among the imaging modalities required
      when dense corneal opacity obscures intraocular structures in FOXE3
      disease.
  - reference: PMID:20664696
    reference_title: "Homozygous FOXE3 mutations cause non-syndromic, bilateral, total sclerocornea, aphakia, microphthalmia and optic disc coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI or ultrasonography confirmed that the patients with sclerocornea were also aphakic, had microphthalmia and some had optic disc coloboma."
    explanation: >-
      Confirms ocular ultrasonography for detecting aphakia, microphthalmia, and
      optic disc coloboma behind total sclerocornea.
  - reference: PMID:38256667
    reference_title: "General Treatment and Ophthalmic Management of Peters' Anomaly."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In such cases, anterior segment optical coherence tomography (AS-OCT) and ultrasound biomicroscopy (UBM) become crucial to the confirmation of the diagnosis and the performance of a preoperative assessment of the structures within the anterior chamber, chamber angle, corneal thickness, adhesion, aniridia, or aphakia measurement"
    explanation: >-
      Documents ultrasound biomicroscopy for structural confirmation and
      aphakia assessment when severe corneal opacity prevents anterior-chamber
      inspection.
- name: Ocular Magnetic Resonance Imaging
  description: >-
    Orbital and ocular magnetic resonance imaging (MRI) evaluates globe size,
    lens absence (primary aphakia), and posterior-segment or optic-nerve
    malformations when dense bilateral sclerocornea or corneal opacity blocks
    optical examination.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:34046667
    reference_title: "Comprehensive phenotypic and functional analysis of dominant and recessive FOXE3 alleles in ocular developmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given dense corneal opacities, full clinical assessment of FOXE3 defects requires alternative imaging modalities, such as ultrasound, optical coherence tomography (OCT), or magnetic resonance imaging (MRI) to diagnose; thus, the complete spectrum of FOXE3 ocular defects in many affected individuals may not be fully identified."
    explanation: >-
      Identifies MRI as an alternative diagnostic imaging modality needed to
      characterize intraocular defects behind dense FOXE3 corneal opacities.
  - reference: PMID:20664696
    reference_title: "Homozygous FOXE3 mutations cause non-syndromic, bilateral, total sclerocornea, aphakia, microphthalmia and optic disc coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI or ultrasonography confirmed that the patients with sclerocornea were also aphakic, had microphthalmia and some had optic disc coloboma."
    explanation: >-
      Demonstrates orbital/ocular MRI confirming aphakia, microphthalmia, and

  evidence:
  - reference: PMID:38256667
    reference_title: "General Treatment and Ophthalmic Management of Peters' Anomaly."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In such cases, anterior segment optical coherence tomography (AS-OCT) and ultrasound biomicroscopy (UBM) become crucial to the confirmation of the diagnosis and the performance of a preoperative assessment of the structures within the anterior chamber, chamber angle, corneal thickness, adhesion, aniridia, or aphakia measurement"
    explanation: >-
      AS-OCT confirms anterior segment structural defects and guides surgical

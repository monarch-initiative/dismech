pathophysiology:
- name: Failed Lens Placode Induction and Differentiation
  biological_scale: CELLULAR
  conforms_to: "anterior_segment_dysgenesis#Anterior Segment Developmental Regulator Defect"
  description: >
    FOXE3 is a forkhead transcription factor expressed exclusively in the anterior
    lens epithelium. It is a downstream target of PAX6 and RX and acts as one of
    the earliest integrators of FGF, BMP, and WNT signaling pathways that
    cooperate to induce lens formation and regulate lens epithelial-to-fiber
    differentiation. Biallelic loss-of-function alleles abolish or severely reduce
    FOXE3 activity early in embryogenesis (4th-5th week), arresting lens placode
    development and causing primary aphakia, whereas heterozygous C-terminal
    extension alleles impair protein stability, DNA binding, nuclear localization,
    and transcriptional activity with dominant-negative behavior that disrupts lens
    differentiation and causes congenital cataract with variable anterior segment
    anomalies. Because the lens serves as an organizer for anterior segment
    morphogenesis, primary lens failure or dysgenesis leads to secondary
    malformation of iris, cornea, and anterior chamber structures.
  genes:
  - preferred_term: FOXE3
    term:
      id: hgnc:3808
      label: FOXE3
  genetic_context:
    variant_origin: GERMLINE
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  cell_types:
  - preferred_term: Lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  locations:
  - preferred_term: lens
    term:
      id: UBERON:0000965
      label: lens of camera-type eye
  biological_processes:
  - preferred_term: Lens development
    modifier: ABNORMAL
    term:
      id: GO:0002088
      label: lens development in camera-type eye
  - preferred_term: Lens fiber cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0070306
      label: lens fiber cell differentiation
  evidence:
  - reference: PMID:10890982
    reference_title: "Forkhead Foxe3 maps to the dysgenetic lens locus and is critical in lens development and differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "During development Foxe3 is expressed in all undifferentiated lens tissues, and is turned off upon fiber cell differentiation"

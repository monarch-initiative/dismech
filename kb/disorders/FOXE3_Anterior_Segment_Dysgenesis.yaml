    Lens opacification present at birth or early childhood. In dominant FOXE3
    mutations, cataracts can be cerulean type, nuclear, or cortical.
  phenotype_term:
    preferred_term: Congenital cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:

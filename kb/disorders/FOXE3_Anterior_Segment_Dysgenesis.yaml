has_subtypes:
- name: Congenital Cataract
  display_name: Congenital Cataract (Dominant, Extension Alleles)
  subtype_term:
    preferred_term: cataract 34, multiple types
    term:
      id: MONDO:0013067
      label: cataract 34 multiple types
  genes:
  - preferred_term: FOXE3
    term:
      id: hgnc:3808
      label: FOXE3
  description: >
    Autosomal dominant form, corresponding to MONDO:0013067 (cataract 34, multiple
    types; OMIM:612968), caused by heterozygous FOXE3 alleles that extend the
    protein past its native stop codon. Phenotypes are highly variable and include
    congenital cataract (cerulean type and early onset nuclear/cortical cataract),
    Peters anomaly, iris colobomas, and other anterior segment defects. Penetrance
    is high with variable expressivity, and in the largest reported dominant series
    eye size was normal in most individuals even though a minority had
    microphthalmia, aphakia or sclerocornea more typical of recessive disease.
  evidence:
  - reference: PMID:19708017
    reference_title: "Seeing clearly: the dominant and recessive nature of FOXE3 in eye developmental anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the dominant mutations were penetrant, they gave rise to highly variable phenotypes including iris and chorioretinal colobomas, Peters' anomaly, and isolated cataract (cerulean type and early onset adult nuclear and cortical cataract)"
    explanation: "Describes the variable phenotypic spectrum of dominant FOXE3 mutations including cataracts and anterior segment anomalies."
  - reference: PMID:20806047
    reference_title: "Identification of dominant FOXE3 and PAX6 mutations in patients with congenital cataract and aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel dominant mutation at the stop codon of FOXE3, c.959G>C (p.X320SerextX72), was identified in a patient with congenital cataract"
    explanation: "Identifies a dominant non-stop FOXE3 mutation causing congenital cataract."
  - reference: PMID:34046667
    reference_title: "Comprehensive phenotypic and functional analysis of dominant and recessive FOXE3 alleles in ocular developmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In dominant pedigrees, caused by extension variants, normal eye size (96%), cataracts (99%) and variable anterior segment anomalies were seen in most, but some individuals had microphthalmia, aphakia or sclerocornea, more typical of recessive disease."
    explanation: "Supports this subtype's composition - cataract with variable anterior segment anomalies in a normal-sized eye - and the overlap with recessive disease that the description records."
  - reference: PMID:11159941
    reference_title: "Mutations in the human forkhead transcription factor FOXE3 associated with anterior segment ocular dysgenesis and cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An insertion of G in the coding region of the FOXE3 gene that occurred 15 nucleotides upstream of the stop codon was identified in a family with anterior segment ocular dysgenesis and cataracts."
    explanation: "The original dominant FOXE3 family, and the report OMIM indexes as the basis of the cataract 34 / anterior segment dysgenesis 2 designation this subtype is bound to."
- name: Primary Aphakia
  display_name: Primary Aphakia (Recessive, Complete LOF)
  subtype_term:
    preferred_term: congenital primary aphakia
    term:
      id: MONDO:0012456
      label: congenital primary aphakia
  genes:
  - preferred_term: FOXE3
    term:
      id: hgnc:3808
      label: FOXE3
  description: >
    Autosomal recessive form, corresponding to MONDO:0012456 (congenital primary
    aphakia, also labelled anterior segment dysgenesis 2 or ASGD2; OMIM:610256), caused by
    biallelic FOXE3 loss-of-function alleles. Characterized by bilateral congenital absence of
    the lens (aphakia) with secondary aplasia of the anterior segment, sclerocornea,
    microphthalmia, and in some cases optic disc coloboma. Results from early
    developmental arrest of the lens placode around the 4th-5th week of embryogenesis.
  evidence:
  - reference: PMID:16826526
    reference_title: "Homozygous nonsense mutation in the FOXE3 gene as a cause of congenital primary aphakia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital primary aphakia (CPA) is a rare developmental disorder characterized by the absence of lens, the development of which is normally induced during the 4th-5th wk of human embryogenesis"
    explanation: "First identification of FOXE3 as the causative gene for congenital primary aphakia in humans."
  - reference: PMID:20664696
    reference_title: "Homozygous FOXE3 mutations cause non-syndromic, bilateral, total sclerocornea, aphakia, microphthalmia and optic disc coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI or ultrasonography confirmed that the patients with sclerocornea were also aphakic, had microphthalmia and some had optic disc coloboma"
    explanation: "Confirms the full recessive phenotype including sclerocornea, aphakia, microphthalmia, and optic disc coloboma."
  - reference: PMID:34046667
    reference_title: "Comprehensive phenotypic and functional analysis of dominant and recessive FOXE3 alleles in ocular developmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most families with recessive alleles, composed of truncating and forkhead-domain missense variants, had severe corneal opacity (90%; sclerocornea in 47%), aphakia (83%) and microphthalmia (80%), but some had milder features including isolated cataract."
    explanation: "Quantifies the recessive triad of corneal opacity, aphakia and microphthalmia across sixteen families, and records that a minority present with isolated cataract instead."
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Heterozygous FOXE3 mutations can cause anterior segment dysgenesis with
    dominant inheritance. Phenotypes are highly variable, ranging from isolated
    congenital cataract to Peters anomaly and colobomas. Penetrance is high with
    variable expressivity, and the dominant and recessive phenotypic ranges overlap
    rather than forming two discrete clinical classes.
  evidence:
  - reference: PMID:19708017
    reference_title: "Seeing clearly: the dominant and recessive nature of FOXE3 in eye developmental anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report two further novel heterozygous mutations segregating in a dominant fashion in two different families"
    explanation: "Identifies dominant FOXE3 mutations segregating in families with variable anterior segment phenotypes."
  - reference: PMID:11980846
    reference_title: "Foxe3 haploinsufficiency in mice: a model for Peters' anomaly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Haploinsufficiency of Foxe3 in a mouse model causes anterior segment dysgenesis similar to Peters' anomaly"
    explanation: "Mouse model demonstrates that Foxe3 haploinsufficiency recapitulates dominant anterior segment dysgenesis."
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Homozygous loss-of-function FOXE3 mutations cause complete failure of lens
    development resulting in congenital primary aphakia. This severe recessive form
    has been identified in multiple consanguineous families from Pakistan, Madagascar,
    and Mexico. Heterozygous carriers in these families are unaffected.
  evidence:
  - reference: PMID:16826526
    reference_title: "Homozygous nonsense mutation in the FOXE3 gene as a cause of congenital primary aphakia in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a null mutation in the FOXE3 gene segregates and, in the homozygous state, produces the mutant phenotype in this family"
    explanation: "Demonstrates autosomal recessive inheritance of congenital primary aphakia caused by homozygous FOXE3 null mutation."
  - reference: PMID:20361012
    reference_title: "A mutation in the FOXE3 gene causes congenital primary aphakia in an autosomal recessive consanguineous Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FOXE3 is responsible for the early developmental arrest of the lens placode, and the complete loss of a functional FOXE3 protein results in primary aphakia"
    explanation: "Confirms autosomal recessive inheritance of FOXE3-related primary aphakia in an independent family."
genetic:
- name: FOXE3
  features: Forkhead transcription factor essential for lens development; mutations range from partial to complete loss of function
  gene_term:
    preferred_term: FOXE3
    term:
      id: hgnc:3808
      label: FOXE3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_d9cf89fb-ebb9-4c38-8b8c-97d9ce5af270-2023-07-20T160000.000Z
    evidence:
    - reference: CGGV:assertion_d9cf89fb-ebb9-4c38-8b8c-97d9ce5af270-2023-07-20T160000.000Z
      reference_title: "FOXE3 / anterior segment dysgenesis (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "FOXE3 | HGNC:3808 | anterior segment dysgenesis | MONDO:0019503 | SD | Definitive"
      explanation: ClinGen gene-disease validity row recording the Definitive classification for this entry's disease_term.
  notes: >
    FOXE3 encodes a forkhead domain transcription factor expressed exclusively in
    the lens anterior epithelium during eye development. It is a critical downstream
    target of PAX6 and RX, and one of the earliest integrators of signaling pathways
    required for lens formation. The two allele classes are functionally distinct
    rather than two points on one dosage curve. Dominant alleles are predominantly
    C-terminal extension variants that append a novel tail past the native stop
    codon, and in the largest functional survey they were severely impaired in
    protein stability, DNA binding, nuclear localization and transcriptional activity
    and behaved as dominant negatives; recessive alleles (truncating and
    forkhead-domain missense) showed variable effects across the same assays.
    Heterozygous forkhead-domain missense variants are also reported, so the dominant
    class is not exclusively extension alleles.
  evidence:
  - reference: PMID:10890982
    reference_title: "Forkhead Foxe3 maps to the dysgenetic lens locus and is critical in lens development and differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "During development Foxe3 is expressed in all undifferentiated lens tissues, and is turned off upon fiber cell differentiation"
    explanation: "Original discovery that Foxe3 maps to the dysgenetic lens locus and is critical for lens development."
  - reference: PMID:17344231
    reference_title: "Foxe view of lens development and disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Foxe3 had been shown to play a crucial role in vertebrate lens formation and this gene is one of the earliest integrators of several signaling pathways that cooperate to form a lens"
    explanation: "Review confirming FOXE3 as a central integrator of lens developmental signaling."
  - reference: PMID:34046667
    reference_title: "Comprehensive phenotypic and functional analysis of dominant and recessive FOXE3 alleles in ocular developmental disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies identified variable effects on the protein stability, DNA binding, nuclear localization and transcriptional activity for recessive FOXE3 variants, whereas dominant alleles showed severe impairment in all areas and dominant-negative characteristics."
    explanation: "The functional basis for the notes' claim that the dominant alleles behave as dominant negatives rather than by simple haploinsufficiency."
  - reference: PMID:34046667
    reference_title: "Comprehensive phenotypic and functional analysis of dominant and recessive FOXE3 alleles in ocular developmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of new and previously reported genetic and clinical data demonstrated a broad phenotypic range with an overlap between recessive and dominant disease."
    explanation: "Supports treating the two allele classes as one gene-defined spectrum with overlapping presentations, which is why both subtypes sit in a single entry."
  - reference: CGGV:assertion_d9cf89fb-ebb9-4c38-8b8c-97d9ce5af270-2023-07-20T160000.000Z
    reference_title: "FOXE3 / anterior segment dysgenesis (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FOXE3 | HGNC:3808 | anterior segment dysgenesis | MONDO:0019503 | SD | Definitive"
    explanation: >-
      ClinGen's current assertion (CCID:009236, Glaucoma and Neuro-Ophthalmology
      GCEP, approved 2023-07-20) classifies FOXE3-related anterior segment
      dysgenesis as Definitive with semidominant inheritance, lumping anterior
      segment dysgenesis 2 and cataract 34 into one entity.

      evidence_source: IN_VITRO
      snippet: "Consistently, similar levels of endogenous ATP6V1B2 were also found in primary fibroblasts obtained from affected (B2A332V, B2Q376K, and B2R485P) and control individuals (Figure S3)."
      explanation: Establishes that the primary patient-fibroblast series included p.Arg485Pro.

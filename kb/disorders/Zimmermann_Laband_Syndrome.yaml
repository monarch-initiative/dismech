diagnosis:
- name: Clinical syndrome recognition
  description: >
    Clinical recognition is based on the combination of gingival fibromatosis,
    coarse facial appearance, hypertrichosis, neurodevelopmental involvement,
    and distal nail or phalangeal abnormalities.
  diagnosis_term:
    preferred_term: examination by clinical professional
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:25915598
    reference_title: Mutations in KCNH1 and ATP6V1B2 cause Zimmermann-Laband syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Zimmermann-Laband syndrome (ZLS) is a developmental disorder characterized by facial dysmorphism with gingival enlargement, intellectual disability, hypoplasia or aplasia of nails and terminal phalanges, and hypertrichosis."
    explanation: The molecular genetics paper summarizes the core clinical-recognition pattern.
- name: Molecular genetic testing
  description: >
    Sequencing can identify pathogenic variants in KCNH1, KCNN3, or ATP6V1B2
    and distinguish ZLS from overlapping potassium-channel dysmorphism syndromes.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39087232
    reference_title: "Clinical and genetic evaluations of Zimmermann-Laband syndrome with gingival fibromatosis: a rare case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel pathogenic variant in the KCNH1 gene was identified using whole-exome sequencing to substantiate our preliminary diagnosis."
    explanation: Whole-exome sequencing confirmed a KCNH1 pathogenic variant after clinical suspicion of ZLS.
  - reference: PMID:25915598
    reference_title: Mutations in KCNH1 and ATP6V1B2 cause Zimmermann-Laband syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified a recurrent de novo missense change in ATP6V1B2, encoding the B2 subunit of the multimeric vacuolar H(+) ATPase, in two individuals with ZLS."
    explanation: Supports ATP6V1B2 testing in molecular confirmation of ZLS2.
  - reference: PMID:31155282
    reference_title: Gain-of-Function Mutations in KCNN3 Encoding the Small-Conductance Ca(2+)-Activated K(+) Channel SK3 Cause Zimmermann-Laband Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report de novo missense variants in KCNN3 in three individuals with typical clinical features of ZLS."
    explanation: Supports KCNN3 testing in molecular confirmation of ZLS3.
differential_diagnoses:
- name: Temple-Baraitser syndrome
  description: >
    Temple-Baraitser syndrome and ZLS1 share KCNH1 gain-of-function variants,
    intellectual disability, epilepsy, facial dysmorphism, and nail anomalies.
    Gingival enlargement and hypertrichosis favor the ZLS gestalt, whereas
    broad thumbs and great toes with absent or hypoplastic nails favor TBS;
    phenotype overlap can make molecular results more informative than labels.
  disease_term:
    preferred_term: Temple-Baraitser syndrome
    term:
      id: MONDO:0012735
      label: Temple-Baraitser syndrome
  distinguishing_features:
  - Gingival enlargement and hypertrichosis favor Zimmermann-Laband syndrome.
  - Broad thumbs and great toes with absent or hypoplastic nails favor Temple-Baraitser syndrome.
  - KCNH1-related phenotypes overlap and may not satisfy either classic gestalt.
  evidence:
  - reference: PMID:26264464
    reference_title: "'Splitting versus lumping': Temple-Baraitser and Zimmermann-Laband Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TMBTS is characterized by intellectual disability (ID), epilepsy, dysmorphic facial features, broad thumbs and great toes with absent/hypoplastic nails. ZLS is characterized by facial dysmorphism including coarsening of the face and a large nose, gingival enlargement, ID, hypoplasia of terminal phalanges and nails and hypertrichosis."
    explanation: States the overlapping and distinguishing clinical features of TBS and ZLS.
- name: KCNK4-related FHEIG syndrome
  description: >
    KCNK4 gain-of-function disease overlaps ZLS through facial dysmorphism,
    hypertrichosis, epilepsy, intellectual disability, and gingival overgrowth.
    Molecular testing distinguishes KCNK4-related FHEIG from the three ZLS
    molecular subtypes.
  disease_term:
    preferred_term: facial dysmorphism, hypertrichosis, epilepsy, intellectual/developmental delay, and gingival overgrowth syndrome
    term:
      id: MONDO:0032714
      label: facial dysmorphism, hypertrichosis, epilepsy, intellectual/developmental delay, and gingival overgrowth syndrome
  distinguishing_features:
  - A pathogenic KCNK4 variant supports FHEIG rather than ZLS1, ZLS2, or ZLS3.
  evidence:
  - reference: PMID:33594261
    reference_title: "Syndromic disorders caused by gain-of-function variants in KCNH1, KCNK4, and KCNN3-a subgroup of K(+) channelopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest to combine the phenotypes and define a new subgroup of potassium channelopathies caused by increased K+ conductance, referred to as syndromic neurodevelopmental K+ channelopathies due to dominant variants in KCNH1, KCNK4, or KCNN3."
    explanation: Establishes KCNK4 disease as a close syndromic potassium-channelopathy mimic.
- name: Dominant deafness-onychodystrophy syndrome
  description: >
    ATP6V1B2-associated dominant deafness-onychodystrophy (DDOD) syndrome is an
    allelic differential within the same dominant V-ATPase clinical continuum.
    Sensorineural deafness and onychodystrophy with digital anomalies
    predominate in DDOD, whereas gingival hypertrophy and hypertrichosis are
    more characteristic of ZLS2.
  disease_term:
    preferred_term: autosomal dominant deafness - onychodystrophy syndrome
    term:
      id: MONDO:0007420
      label: autosomal dominant deafness - onychodystrophy syndrome
  distinguishing_features:
  - Predominant sensorineural deafness, onychodystrophy, and characteristic digital anomalies favor DDOD.
  - Gingival hypertrophy and hypertrichosis favor ZLS2 because they are not usually reported in DDOD or DOORS.
  - ATP6V1B2 genotype and the broader phenotype should be interpreted as a continuum rather than as an absolute boundary.
  evidence:
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, individuals with DDOD syndrome primarily share sensorineural deafness and onychodystrophy with digital anomalies characterized by bulbous fingertips of digits, and finger-like thumbs/triphalangeal thumb."
    explanation: Directly states the predominant DDOD distinguishing features.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial features of DOORS syndrome have a significant overlap with ZLS, a condition also associated with organomegaly, gingival hypertrophy, and hypertrichosis, which are not usually reported in DDOD and DOORS syndromes."
    explanation: Supports gingival hypertrophy and hypertrichosis, but not coarse facies, as ZLS-favoring distinctions.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present findings further support these observations, documenting the presence of a phenotypic continuum among these disorders."
    explanation: Supports interpreting DDOD and ZLS2 as a clinical continuum rather than an absolute boundary.
- name: DOORS syndrome
  description: >
    DOORS syndrome overlaps ATP6V1B2-related ZLS2 through deafness, nail and
    distal-phalangeal abnormalities, neurodevelopmental impairment, and
    seizures. Osteodystrophy and the deafness-onychodystrophy-neurologic
    constellation favor DOORS, while gingival hypertrophy and hypertrichosis
    favor ZLS2. The cited ATP6V1B2 study places these presentations on a
    clinically variable continuum.
  disease_term:
    preferred_term: DOORS syndrome
    term:
      id: MONDO:0009079
      label: DOORS syndrome
  distinguishing_features:
  - Sensorineural hearing loss, onychodystrophy, distal digital abnormalities, osteodystrophy, and seizures favor DOORS syndrome.
  - Gingival hypertrophy and hypertrichosis favor ZLS2 because they are not usually reported in DDOD or DOORS.
  - The broader phenotype should be interpreted as a continuum rather than as an absolute boundary.
  evidence:
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOORS syndrome shares sensorineural hearing loss, onychodystrophy, and digital abnormalities (i.e., triphalangeal thumb and hypoplastic/absent distal phalanges) with DDOD syndrome."
    explanation: Directly states the shared DOORS distinguishing features.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteodystrophy is reported in most cases as well as a neurodevelopmental/neurological involvement, which includes seizures."
    explanation: Directly supports osteodystrophy and seizures as DOORS-favoring features.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial features of DOORS syndrome have a significant overlap with ZLS, a condition also associated with organomegaly, gingival hypertrophy, and hypertrichosis, which are not usually reported in DDOD and DOORS syndromes."
    explanation: Supports gingival hypertrophy and hypertrichosis, but not coarse facies, as ZLS-favoring distinctions.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present findings further support these observations, documenting the presence of a phenotypic continuum among these disorders."
    explanation: Supports treating DOORS-like and ZLS2 presentations as a variable continuum.
treatments:
- name: Gingivectomy and gingivoplasty for gingival fibromatosis
  description: >
    Surgical removal and reshaping of hyperplastic gingiva can expose teeth,
    improve occlusion, restore dental function, and improve oral aesthetics.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gingivectomy
    term:
      id: NCIT:C82090
      label: Gingivectomy
  target_phenotypes:
  - preferred_term: gingival fibromatosis
    term:
      id: HP:0000169
      label: Gingival fibromatosis
  - preferred_term: delayed eruption of teeth
    term:
      id: HP:0000684
      label: Delayed eruption of teeth
  evidence:
  - reference: PMID:39087232
    reference_title: "Clinical and genetic evaluations of Zimmermann-Laband syndrome with gingival fibromatosis: a rare case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gingivectomy and gingivoplasty were performed under general anesthesia. After surgery, the gingival appearance improved significantly, and the masticatory function of the teeth was restored."
    explanation: A ZLS case report documents functional improvement after gingivectomy and gingivoplasty.
  - reference: PMID:40604848
    reference_title: "Syndromic gingival fibromatosis associated with pathogenic variation in the voltage-gated potassium channel gene KCNH1: a case report and proposed treatment protocol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case illustrates the need for appropriate and early gingivoplasty to prevent teeth impaction and restore dental function."
    explanation: The proposed protocol supports early gingivoplasty for gingival fibromatosis-associated tooth impaction and dental dysfunction.
  - reference: PMID:40425216
    reference_title: Surgical management of hereditary gingival fibromatosis associated with Zimmermann-Laband syndrome using conventional, electrocautery and diode laser gingivectomy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this case report, the surgical management of HGF associated with the Zimmermann-Laband syndrome was successfully carried out using three different methods: conventional gingivectomy, electrocautery and diode laser gingivectomy."
    explanation: Independently documents successful gingivectomy approaches in ZLS-associated gingival fibromatosis.
- name: Myofunctional and speech-language oral therapy
  description: >
    Myofunctional and speech-language therapy may support biting, chewing, and
    tongue-function rehabilitation before or alongside gingivoplasty.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  evidence:
  - reference: PMID:40604848
    reference_title: "Syndromic gingival fibromatosis associated with pathogenic variation in the voltage-gated potassium channel gene KCNH1: a case report and proposed treatment protocol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first step of oral treatment consisted of myofunctional and speech/language therapy to stimulate biting and chewing. It also helped with the rehabilitation of proper tongue function."
    explanation: The case protocol supports supportive oral therapy to improve biting, chewing, and tongue function.
notes: >
  Orphanet records autosomal recessive inheritance, but molecular literature
  supports de novo or autosomal-dominant inheritance for KCNH1 and KCNN3-related
  disease. This entry follows the molecularly solved, dominant potassium-channel
  and ATP6V1B2 genetic heterogeneity while retaining the ORPHA structured record
  for phenotype coverage. Temple-Baraitser syndrome and KCNK4-related FHEIG
  syndrome overlap clinically with ZLS and may be considered in differential
  diagnosis.

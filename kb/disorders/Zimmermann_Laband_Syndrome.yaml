      snippet: "Notably, a marked increase in the size and number of lysosomes in cells endogenously expressing each of the tested B2 and C1 mutants was observed by immunofluorescence analysis and western blot analyses (Figures 2C and 2D), as observed in lysosomal storage disorders."
      explanation: The tested series included p.Arg485Pro patient fibroblasts and showed increased lysosome size and number; intermediates from hyperacidification remain unresolved.

      term: {id: hgnc:854, label: ATP6V1B2}
    allele_type: missense
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >
      The recurrent ZLS2 allele p.Arg485Pro was tested in primary patient
      fibroblasts and is included among the dominant ATP6V1B2 substitutions
      that increased V-ATPase proton-pump activity.
  biological_processes:
  - preferred_term: vacuolar acidification
    term: {id: GO:0007035, label: vacuolar acidification}
    modifier: INCREASED
  molecular_functions:
  - preferred_term: proton transmembrane transporter activity
    term: {id: GO:0015078, label: proton transmembrane transporter activity}
    modifier: INCREASED
  evidence:
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We investigated the functional consequences of the identified ATP6V1B2 and ATP6V1C1 variants, together with the p.Arg485Pro change in ATP6V1B2"

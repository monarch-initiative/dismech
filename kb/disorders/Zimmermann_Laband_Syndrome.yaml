- name: ATP6V1B2 p.Arg485Pro hyperactive V-ATPase
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >
    The recurrent de novo ATP6V1B2 p.Arg485Pro ZLS2 substitution produces a
    hyperactive vacuolar H+ ATPase state in patient-derived fibroblasts, with
    increased proton-pumping activity and lysosomal acidification. This
    experimentally demonstrated gain of function supersedes the earlier
    computational complex-assembly prediction as the proximal mechanism.
  role: trigger
  subtypes: [ZLS2]
  genes:
  - preferred_term: ATP6V1B2
    term: {id: hgnc:854, label: ATP6V1B2}
  cell_types:

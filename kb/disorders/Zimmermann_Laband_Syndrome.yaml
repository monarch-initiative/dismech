name: Zimmermann-Laband Syndrome
category: Mendelian
creation_date: "2026-05-09T21:19:51Z"
synonyms:
- Laband syndrome
- Gingival fibromatosis-hepatosplenomegaly-other anomalies syndrome
- ZLS
description: >
  Zimmermann-Laband syndrome is a rare multiple congenital anomalies and
  neurodevelopmental disorder characterized by gingival fibromatosis, coarse
  facial appearance, hypertrichosis, intellectual disability, and hypoplastic or
  absent nails or terminal phalanges. It is genetically heterogeneous, with
  pathogenic variants in KCNH1, KCNN3, and ATP6V1B2 reported in affected
  individuals.
disease_term:
  preferred_term: Zimmermann-Laband syndrome
  term:
    id: MONDO:0000200
    label: Zimmermann-Laband syndrome
has_subtypes:
- name: ZLS1
  display_name: Zimmermann-Laband syndrome type 1 (KCNH1-related)
  description: >
    KCNH1-related ZLS is caused by heterozygous gain-of-function missense
    variants in the Kv10.1 voltage-gated potassium channel.
  subtype_term:
    preferred_term: Zimmermann-Laband syndrome 1
    term:
      id: MONDO:0024526
      label: Zimmermann-Laband syndrome 1
  genes:
  - preferred_term: KCNH1
    term:
      id: hgnc:6250
      label: KCNH1
  evidence:
  - reference: PMID:25915598
    reference_title: Mutations in KCNH1 and ATP6V1B2 cause Zimmermann-Laband syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report that heterozygous missense mutations in KCNH1 account for a considerable proportion of ZLS."
    explanation: Establishes the KCNH1-related molecular subtype.
  - reference: PMID:25915598
    reference_title: Mutations in KCNH1 and ATP6V1B2 cause Zimmermann-Laband syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data support a gain-of-function effect for all ZLS-associated KCNH1 mutants."
    explanation: Functional studies support the gain-of-function wording for the KCNH1-related subtype.
- name: ZLS2
  display_name: Zimmermann-Laband syndrome type 2 (ATP6V1B2-related)
  description: >
    ATP6V1B2-related ZLS is caused by de novo monoallelic variants affecting the
    B2 subunit of the vacuolar proton ATPase. Functional studies of p.Arg485Pro
    and other tested dominant ATP6V1B2 substitutions support increased V-ATPase
    activity, while clinical expression spans a ZLS-DDOD-DOORS continuum.
  subtype_term:
    preferred_term: Zimmermann-Laband syndrome 2
    term:
      id: MONDO:0014646
      label: Zimmermann-Laband syndrome 2
  genes:
  - preferred_term: ATP6V1B2
    term:
      id: hgnc:854
      label: ATP6V1B2
  evidence:
  - reference: PMID:25915598
    reference_title: Mutations in KCNH1 and ATP6V1B2 cause Zimmermann-Laband syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified a recurrent de novo missense change in ATP6V1B2, encoding the B2 subunit of the multimeric vacuolar H(+) ATPase, in two individuals with ZLS."
    explanation: Establishes the ATP6V1B2-related molecular subtype.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We investigated the functional consequences of the identified ATP6V1B2 and ATP6V1C1 variants, together with the p.Arg485Pro change in ATP6V1B2"
    explanation: Establishes that p.Arg485Pro was included in the functional series.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed a significant higher acidity of lysosomes in all patients’ cell lines compared with control cells, indicating a hyperactive behavior of the proton pumps assembling the mutant B2/C1 subunits."
    explanation: The p.Arg485Pro line was among the tested patient lines showing hyperactive proton pumping and lysosomal hyperacidification.
- name: ZLS3
  display_name: Zimmermann-Laband syndrome type 3 (KCNN3-related)
  description: >
    KCNN3-related ZLS is caused by de novo gain-of-function missense variants
    in the SK3 calcium-activated potassium channel.
  subtype_term:
    preferred_term: Zimmermann-Laband syndrome 3
    term:
      id: MONDO:0032854
      label: Zimmermann-Laband syndrome 3
  genes:
  - preferred_term: KCNN3
    term:
      id: hgnc:6292
      label: KCNN3
  evidence:
  - reference: PMID:31155282
    reference_title: Gain-of-Function Mutations in KCNN3 Encoding the Small-Conductance Ca(2+)-Activated K(+) Channel SK3 Cause Zimmermann-Laband Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report de novo missense variants in KCNN3 in three individuals with typical clinical features of ZLS."
    explanation: Establishes the KCNN3-related molecular subtype.
  - reference: PMID:31155282
    reference_title: Gain-of-Function Mutations in KCNN3 Encoding the Small-Conductance Ca(2+)-Activated K(+) Channel SK3 Cause Zimmermann-Laband Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patch-clamp whole-cell recordings of KCNN3 channel-expressing CHO cells demonstrated that disease-associated mutations result in gain of function of the mutant channels, characterized by increased Ca2+ sensitivity leading to faster and more complete activation of KCNN3 mutant channels."
    explanation: Functional studies support the gain-of-function wording for the KCNN3-related subtype.

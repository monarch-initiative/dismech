    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that NDUFAF3 is a genuine mitochondrial complex I assembly protein that interacts
      with complex I subunits.
    explanation: >-
      The functional characterisation in the founding report, which is what makes this a
      mechanism rather than a statistical association.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists, and no population-based denominator of any kind has been
    published for this gene. The literature accessible to this curation describes at least nine
    individuals: five from three families in the 2009 founding report, one with Leigh syndrome
    in 2017, one with cavitating leukoencephalopathy in 2018, one with dystonia and a
    neurodevelopmental disorder in 2023, and at least one further individual in a 2025 Indian
    childhood-onset dystonia series that names NDUFAF3 as a newly contributed gene without
    stating how many of its 22 individuals carried it. The count is a floor rather than a total.
    The 2023 report's tally of "seven patients reported to date" is the one figure in the
    literature stated as a series total, and is quoted below.
  evidence:
  - reference: PMID:37572574
    reference_title: Expanding the phenotypic and biochemical spectrum of NDUFAF3-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seven patients reported to date exhibited severe neurologic symptoms and lactic
      acidosis, followed by a fatal course and death during infancy in most cases.
    explanation: The only stated series total in the NDUFAF3 literature, as of 2023.
experimental_models:
- name: NDUFAF3 patient fibroblast complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from patients, complemented with wild-type NDUFAF3. This is the experiment that
    made NDUFAF3 a disease gene: baculovirus-delivered NDUFAF3-GFP in the founding report, and
    an independent complementation in the Leigh-syndrome patient's fibroblasts nine years later.
    There is no NDUFAF3 mouse, and no patient tissue beyond the muscle and fibroblast samples of
    the published cases.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency
    relationship: RESCUES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Supplying wild-type NDUFAF3 to the patient's own cells is what localises the enzyme
      deficiency to this gene rather than to a coincidental variant, and it was the basis on
      which the founding alleles were called pathogenic.
    limitations: >-
      Fibroblasts are not neurons, and the affected tissues - basal ganglia, brainstem, white
      matter - have never been studied in this disease. The rescue establishes causality; it
      says nothing about why those structures fail, nor about the threshold of residual complex
      I activity a neuron tolerates. The 2023 patient's fibroblasts show only a mild activity
      reduction alongside a severe complexome defect, which is a direct demonstration that the
      fibroblast activity assay can under-read this disease.
    evidence:
    - reference: PMID:19463981
      reference_title: "Mutations in NDUFAF3 (C3ORF60), encoding an NDUFAF4 (C6ORF66)-interacting complex I assembly protein, cause fatal neonatal mitochondrial disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All patients harbored mutations in the NDUFAF3 (C3ORF60) gene, of which the pathogenic
        nature was assessed by NDUFAF3-GFP baculovirus complementation in fibroblasts.
      explanation: The complementation assay and the delivery method used in the founding report.
    - reference: PMID:27986404
      reference_title: Mutations in mitochondrial complex I assembly factor NDUFAF3 cause Leigh syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In a patient presenting with Leigh syndrome, which has hitherto not been described as a
        clinical feature of NDUFAF3 deficiency, we identified a novel homozygous variant and
        confirmed its pathogenicity in patient fibroblasts studies.
      explanation: >-
        The clause that pathogenicity was confirmed in patient fibroblast studies is the second,
        independent complementation - nine years after the founding report and in a patient with
        a different allele - which is what makes this model informative rather than a single
        result. Graded HUMAN_CLINICAL because this sentence is the report's patient-level
        identification statement and is graded that way at its other two uses in this file; the
        publication mixes a clinical case with fibroblast work, and one quoted sentence carries
        one grading.
- name: NDUFAF3 knockdown in cultured human cells
  experimental_model_type: CELL_LINE
  description: >-
    Transient and stable siRNA knockdown of NDUFAF3 in cultured human cells, used to ask what
    the assembly factor does rather than to model a patient allele. It produced the ND1
    stability result, and it is the only place in the NDUFAF3 literature where a second
    manipulation - knockdown of the m-AAA protease - is layered on top to test the mechanism.
  modeled_mechanisms:
  - target: Rapid Proteolytic Turnover of Newly Synthesized ND1
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Depleting NDUFAF3 abolishes complex I assembly and shortens the half-life of newly
      synthesised ND1 fourfold, and knocking down the protease restores it.
    limitations: >-
      Knockdown is not a patient genotype. Every reported human allele is missense, in-frame,
      splice-site or initiation-codon rather than a null, and the missense alleles may leave
      partial function, so the magnitude of the ND1 effect in knockdown cells is an upper bound
      on what happens in a patient. The cells are also not an affected tissue.
    readouts:
    - name: ND1 half-life in pulse-chase after NDUFAF3 knockdown
      target: Rapid Proteolytic Turnover of Newly Synthesized ND1
      direction: DECREASED
      interpretation: >-
        A fourfold shorter chase half-life, which fully accounts for the reduced pulse labelling
        and is what distinguishes degradation from failed synthesis.
      evidence:
      - reference: PMID:22653752
        reference_title: Early complex I assembly defects result in rapid turnover of the ND1 subunit.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Pulse-chase experiments in cells knocked down for NDUFAF3 showed that the half-life of
          ND1 in the chase was reduced 4-fold, fully accounting for the decrease in pulse
          labeling.
        explanation: The measurement behind this readout, with its magnitude.
    evidence:
    - reference: PMID:22653752
      reference_title: Early complex I assembly defects result in rapid turnover of the ND1 subunit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transient, short-term knock-down of the m-AAA protease AGF3L2 in cells that had been
        depleted of any of the early CI assembly factors completely rescued the ND1 labeling
        phenotype, confirming that it is not a synthesis defect, but rather results from rapid
        proteolysis of newly synthesized ND1.
      explanation: >-
        The second manipulation, which is what makes this model informative about mechanism
        rather than only about consequence.
animal_models:
- name: Drosophila NDUFAF3 and NDUFAF4 disruption
  species: Drosophila melanogaster
  genotype: RNAi disruption of the Drosophila NDUFAF3 or NDUFAF4 orthologue in flight muscle
  publication: PMID:34386730
  genes:
  - preferred_term: NDUFAF3
    term:
      id: hgnc:29918
      label: NDUFAF3
  description: >-
    Genetic disruption of either assembly factor in Drosophila, used to dissect what the two do
    and how they relate. It is not a disease model - no fly phenotype is matched to a human one
    here - and it is curated because it is the only in vivo work bearing on the mechanism node,
    and because it tests the NDUFAF3 and NDUFAF4 relationship that the human work could only
    infer.
  modeled_mechanisms:
  - target: Stalled Complex I Assembly with Depleted Q- and P-Module Subunits
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Losing either factor impairs biogenesis of the Q-, N- and PP-b-modules. Forced expression
      of NDUFAF4 rescues the Q-module defect caused by loss of NDUFAF3, which is direct in vivo
      evidence that the two act in one pathway, and raises the possibility that some NDUFAF3
      missense alleles could be rescued by raising NDUFAF4.
    limitations: >-
      Drosophila, and no human variant is modelled - the manipulation is RNAi knockdown of the
      fly orthologue, not knock-in of a patient allele. The module nomenclature also does not
      map cleanly onto the human patient data: the fly work reports impaired Q-, N- and PP-b
      module biogenesis, while the patient gels show Q- and P-module subunits depleted together
      with early membrane-arm sub-assemblies accumulating. Both place the lesion early; neither
      settles the order of events.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Complex I assembly-factor composition and module boundaries are conserved between fly
        and human but not identical, and the fly experiment measures the consequence of
        depleting the factor rather than of carrying a patient missense or splice-site allele.
    evidence:
    - reference: PMID:34386730
      reference_title: Dissecting the concordant and disparate roles of NDUFAF3 and NDUFAF4 in mitochondrial complex I biogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Notably, forced expression of NDUFAF4 rescues the biogenesis defects in the Q-module and
        some aspects of the defects in the PP-b-module of CI when NDUFAF3 is disrupted.
      explanation: >-
        The epistasis result, which is the part of this model that the human fibroblast work
        could not provide.
    - reference: PMID:34386730
      reference_title: Dissecting the concordant and disparate roles of NDUFAF3 and NDUFAF4 in mitochondrial complex I biogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Altogether, our studies furnish new fundamental insights into the mechanism by which
        NDUFAF3 and NDUFAF4 regulate CI assembly and raises the possibility that certain point
        mutations in NDUFAF3 may be rescued by overexpression of NDUFAF4.
      explanation: >-
        The therapeutic inference the authors themselves draw, recorded here rather than under
        treatments because nothing has been tried in a patient or in a mammal.
diagnosis:
- name: Exome or mitochondrial gene panel sequencing
  description: >-
    Every reported patient was diagnosed by sequencing. The founding families were found by
    homozygosity mapping plus candidate gene sequencing, the Leigh-syndrome and
    leukoencephalopathy patients by exome sequencing, and the 2023 patient by trio exome
    sequencing. NDUFAF3 belongs on a nuclear-gene Leigh syndrome spectrum panel and, on the 2025
    series, on a childhood-onset complex dystonia panel as well.
  evidence:
  - reference: PMID:29344937
    reference_title: NDUFAF3 variants that disrupt mitochondrial complex I assembly may associate with cavitating leukoencephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing identified compound heterozygous variations in NDUFAF3, involved in
      the assembly of mitochondrial complex I (c.342_343insGTG:p.117Valdup, c.505C > A:p.Pro169Thr).
    explanation: The diagnostic route and the genotype it produced in one patient.
  - reference: PMID:37572574
    reference_title: Expanding the phenotypic and biochemical spectrum of NDUFAF3-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trio-exome sequencing revealed compound-heterozygosity for a pathogenic splice-site and a
      likely pathogenic missense variant in NDUFAF3.
    explanation: The diagnostic route in the most recently reported single patient.
- name: Complex I enzymology in muscle or fibroblasts
  description: >-
    Spectrophotometric respiratory chain enzyme assay. The practical caution this disease
    carries is that the fibroblast assay can under-read it: the patient with the mildest
    clinical phenotype had a relatively mild fibroblast complex I reduction alongside a severe
    complexome defect, while the muscle assay in the leukoencephalopathy patient gave 17 to 21
    percent of control. A near-normal fibroblast result should not exclude the diagnosis when
    the genotype or the imaging points to it.
  evidence:
  - reference: PMID:37572574
    reference_title: Expanding the phenotypic and biochemical spectrum of NDUFAF3-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Spectrophotometric analysis of fibroblast-derived mitochondria demonstrated a relatively
      mild reduction of CI activity.
    explanation: >-
      The mild fibroblast result that sits alongside a severe complexome defect in the same
      patient, which is the basis of the caution stated here.
- name: Complexome profiling or blue-native gel analysis of complex I assembly
  description: >-
    Native-gel or complexome analysis of patient fibroblasts. It is what distinguishes an
    assembly-factor defect from a loss of enzyme activity, and in this disease it is more
    sensitive than the activity assay: it shows the depleted Q- and P-module subunits, the
    reduced NDUFAF3 protein itself, and the early membrane-arm sub-assemblies stalled on the
    MCIA complex.
  evidence:
  - reference: PMID:29344937
    reference_title: NDUFAF3 variants that disrupt mitochondrial complex I assembly may associate with cavitating leukoencephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two-dimensional, blue-native polyacrylamide gel electrophoresis (PAGE) and sodium dodecyl
      sulfate-PAGE revealed reductions in Q-module (NDUFS2, NDUFS3, and NDUFA9) and P-module
      (NDUFB10 and NDUFB11) subunits, indicating disruption of mitochondrial complex I assembly.
    explanation: The native-gel result and what it shows about the assembly block.
  - reference: PMID:37572574
    reference_title: Expanding the phenotypic and biochemical spectrum of NDUFAF3-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Complexome analyses revealed severely reduced NDUFAF3 as well as CI in patient fibroblasts.
    explanation: >-
      The complexome result in the patient whose activity assay was only mildly abnormal, which
      is why this is listed as a distinct and more sensitive test.
discussions:
- discussion_id: mc1dn18_why_some_children_survive
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "genetic#NDUFAF3"
  - "pathophysiology#Isolated Complex I Deficiency"
  prompt: >-
    Why do most children with biallelic NDUFAF3 variants die in infancy while a few survive into
    the second decade with a movement disorder, and can a genotype or a biochemical measurement
    predict which?
  rationale: >-
    Prognosis is the question a family asks at diagnosis and the one this gene cannot currently
    answer. Most of the first seven reported patients died in infancy of severe neurological
    disease with lactic acidosis. Two later patients did not: a girl still alive at one year
    after a cavitating leukoencephalopathic crisis, and a child reported at ten with a
    neurodevelopmental disorder, dystonia and only a mild fibroblast complex I reduction. A 2025
    series then added NDUFAF3 to the genes causing childhood-onset complex dystonia, which
    implies further survivors.

    Two candidate explanations are available and neither has been tested. The first is residual
    function: every reported allele is missense, in-frame, splice-site or initiation-codon
    rather than a clean null, so different genotypes may leave different amounts of working
    assembly factor. The 2023 patient's biochemistry is consistent with that, in that the
    activity reduction is mild where the complexome defect is severe. The second is that
    fibroblast biochemistry simply does not track the neurological outcome, in which case the
    apparent correlation in that one patient is a coincidence and the assay is measuring the
    wrong tissue.

    Distinguishing them matters clinically. If residual assembly-factor function predicts
    survival, a quantitative complexome measurement becomes a prognostic test at diagnosis. If
    it does not, it stays a diagnostic test only, and families should be counselled from the
    genotype and the clinical course rather than from the enzymology.
  proposed_experiments:
  - experiment_id: mc1dn18_residual_function_vs_outcome
    name: Residual NDUFAF3 abundance and complex I assembly across the reported allelic series
    description: >-
      Express each reported NDUFAF3 allele on a common null background and measure steady-state
      NDUFAF3 abundance, ND1 stability, assembly-intermediate distribution by complexome
      profiling, and complex I activity, then compare the ranking against the clinical course of
      the patient each allele came from. The allelic series is small enough to do exhaustively.
    would_support:
    - "pathophysiology#Isolated Complex I Deficiency"
    supporting_outcome:
    - >-
      Residual assembly-factor abundance and complex I assembly ranking with clinical severity
      across alleles would establish residual function as the variable behind the survival
      difference, and make the complexome measurement prognostic.
    refuting_outcome:
    - >-
      Comparable residual function across alleles from patients with very different outcomes
      would refute the residual-function explanation and point instead to modifiers,
      tissue-specific thresholds, or ascertainment as the reason the survivors look different.
  evidence:
  - reference: PMID:37572574
    reference_title: Expanding the phenotypic and biochemical spectrum of NDUFAF3-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seven patients reported to date exhibited severe neurologic symptoms and lactic
      acidosis, followed by a fatal course and death during infancy in most cases.
    explanation: The severe pole against which the surviving patients are the anomaly.
  - reference: PMID:37572574
    reference_title: Expanding the phenotypic and biochemical spectrum of NDUFAF3-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Spectrophotometric analysis of fibroblast-derived mitochondria demonstrated a relatively
      mild reduction of CI activity.
    explanation: >-
      The biochemical observation in the mildest patient that makes the residual-function
      explanation worth testing rather than merely plausible.
notes: >-
  Scope decision: curated as a DISEASE, standalone. dismech curates the MC1DN series as per-gene
  entries - nineteen numbered types are already standalone files in kb/disorders/ - and MC1DN18
  is the NDUFAF3 member of that series. It is a MONDO leaf: MONDO:0032623 has one parent,
  MONDO:0100223 (mitochondrial complex I deficiency, nuclear type), which is an ontology
  grouping of the numbered series rather than a dismech entry, and no descendants. It is not a
  subtype of any curated entry. The stub is deleted by this change.

  The one real lump/split tension is with ClinGen rather than with MONDO, and it is not resolved
  here. The ClinGen Mitochondrial Disease Gene Curation Expert Panel states that various names
  have been given to the constellation of features seen in NDUFAF3-related disease and that it
  has therefore lumped the phenotype into one entity, curating the gene against "mitochondrial
  disease" (MONDO:0044970). dismech splits the same biology per gene, so MC1DN18 and the ClinGen
  assertion are the same claim at two granularities. The assertion is cited here as gene-disease
  validity evidence, which it is at either granularity; nothing in this entry depends on
  treating MONDO:0044970 as this disease's term.

  On the module and the grouping. PR #12492 proposes a complex_i_deficiency module and a
  Mitochondrial Complex I Deficiency grouping for issue #9864, and is open and deliberately held
  pending a human ruling on the MC1DN nosology. Neither kb/modules/complex_i_deficiency.yaml nor
  kb/groupings/Mitochondrial_Complex_I_Deficiency.yaml exists on main at the time of writing, so
  this entry conforms to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress,
  which is what all nineteen existing MC1DN entries do. If #12492 merges, this entry's Isolated
  Complex I Deficiency node should be repointed at the complex I module, and MC1DN18 added as a
  further grouping member.

  On GeneReviews. There is no GeneReviews chapter for MC1DN18 or for NDUFAF3; this was checked
  offline against the committed Bookshelf index, which covers all 958 PubMed-indexed GeneReviews
  chapters, and the check returns NO_CHAPTER. PMID:26425749 ("Nuclear Gene-Encoded Leigh
  Syndrome Spectrum Overview") is the applicable overview chapter and is tagged in the top-level
  references block. It is deliberately not cited as evidence anywhere: the cached PubMed record
  contains only the chapter's statement of purpose, with no clinical content and no mention of
  NDUFAF3, so quoting it would produce a snippet that supports nothing. The same call was made
  in the MC1DN22 entry.

  On Orphanet. MONDO:0032623 carries no ORPHA cross-reference - its database cross-references
  are DOID:0112070, GARD:0016325, MEDGEN:1648321, OMIM:618240 and UMLS:C4748790, read from the
  OLS MONDO record - so there is no ORPHA record for this entity to cite. Orphanet covers the
  biology under its broader isolated complex I deficiency concept, which is a different
  granularity and would not support a claim about MC1DN18 specifically.

  What is deliberately not curated, and why. There is no treatments block: no treatment,
  supplement or trial has been reported for NDUFAF3 disease in the literature this curation
  could reach, and listing a generic mitochondrial cocktail without a source naming this gene
  would be exactly the unverifiable claim the evidence policy exists to prevent. The one
  therapeutic idea in the literature - that raising NDUFAF4 might rescue some NDUFAF3 missense
  alleles - is the authors' own inference from a Drosophila experiment, and is recorded on that
  animal model rather than promoted to a treatment. There is no biochemical block with reference
  ranges: lactate is curated as phenotypes because that is how the sources report it, and no
  reference interval has been published for this disease. There is no histopathology block: no
  post-mortem neuropathology has been reported for any NDUFAF3 patient. There is no datasets
  block and no clinical trial.

  On the denominators, which are small enough that every band should be read as a tally. At
  least nine individuals have been reported. Frequency bands here rest on two different kinds of
  source and the difference matters: Lactic Acidosis, Encephalopathy and Death in Infancy come
  from the 2023 report's summary of the first seven patients, while Developmental Regression,
  Hypotonia, Myoclonic Seizure and Optic Atrophy come from a single clause in the ClinGen
  expert-panel narrative that lists features without counts. The second group carries no
  numerator at all. Their notes say so individually; the band is a statement that the panel
  considers the feature characteristic, not a measured rate.

  Optic Atrophy is the weakest claim in the entry and is flagged in its own notes. It rests on
  that one expert-panel clause; none of the four primary reports whose abstracts are cached
  mentions vision. It is kept because the panel reviewed full texts this curation could not
  reach, and dropping a feature a formal expert panel lists would be a worse error than
  recording it with its single source stated.

  On what the accessible sources are, and what that costs. All four primary clinical reports are
  cached as abstract-only records, so every clinical claim here comes from an abstract or from
  the ClinGen narrative. That is a real limit. Individual patient descriptions, exact ages at
  death, the neonatal examination findings, developmental detail, and the ophthalmological
  findings behind the panel's optic-atrophy clause are all in full texts this curation did not
  have. Where a feature is named without a patient count, that is why. The deep-research report
  committed with this entry surfaces several such details from OMIM's clinical synopsis -
  macrocephaly, wide anterior fontanelle, weak cry, poor feeding, hypertonia, death by six
  months - and none of them is curated here, because OMIM is not a citable reference source in
  this repository and no cached primary source states them. The same report attributes ataxia,
  dysarthria, dysphonia, failure to thrive, emesis and abnormal muscle cristae to the 2023
  patient; none of these appears in that paper's cached abstract, so they are named here as
  full-text detail this curation could not verify rather than curated as phenotypes.

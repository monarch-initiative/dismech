  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    NDUFAF3 (HGNC:29918, "NADH:ubiquinone oxidoreductase complex assembly factor 3") is at
    3p21.31. Its previous symbol is C3orf60, which is the name under which the gene was
    described in 2009 and the name used in the older assembly literature; the HGNC record also
    lists the aliases MGC10527, DKFZP564J0123, E3-3 and 2P1.

    The ClinGen Mitochondrial Disease Gene Curation Expert Panel classified the gene-disease
    relationship as Definitive on 7 March 2022 under SOP8, on case-level and experimental data
    from three publications plus model-organism support. Note what the assertion is against:
    ClinGen curated NDUFAF3 to "mitochondrial disease" (MONDO:0044970), not to MC1DN18, having
    deliberately lumped the NDUFAF3 phenotype into one disease entity. That is a different
    granularity decision from the one this entry makes, and it is recorded rather than resolved.
  evidence:
  - reference: CGGV:assertion_fbdf3ba5-37d8-447d-888b-2762701bab49-2022-03-07T050000.000Z
    reference_title: NDUFAF3 / mitochondrial disease (Definitive)

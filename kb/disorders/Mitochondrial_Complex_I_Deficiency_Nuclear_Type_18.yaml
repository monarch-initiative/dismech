- name: Loss of NDUFAF3 from Early Complex I Assembly Intermediates
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFAF3's place in complex I biogenesis is on the earliest assembly intermediates. It
    co-immunoprecipitates with NDUFAF4 and with the matrix-arm subunits NDUFS2, NDUFA9 and
    NDUFS3 in a roughly 400 kDa intermediate that also contains the mitochondrially encoded ND1
    subunit. Losing it therefore removes a component from the step at which the nuclear-encoded
    matrix arm and the mtDNA-encoded membrane arm are first brought together.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  locations:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  downstream:
  - target: Rapid Proteolytic Turnover of Newly Synthesized ND1
    causal_link_type: DIRECT
    description: >-
      Without the assembly factor the newly made ND1 subunit is not captured into a stable
      intermediate, and the quality-control protease removes it.
    evidence:
    - reference: PMID:22653752
      reference_title: Early complex I assembly defects result in rapid turnover of the ND1 subunit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Pulse-chase experiments in cells knocked down for NDUFAF3 showed that the half-life of
        ND1 in the chase was reduced 4-fold, fully accounting for the decrease in pulse
        labeling.
      explanation: >-
        The measured consequence of removing NDUFAF3 specifically, and the quantity that makes
        it a stability rather than a synthesis defect.
  - target: Stalled Complex I Assembly with Depleted Q- and P-Module Subunits
    causal_link_type: DIRECT
    description: >-
      The intermediate NDUFAF3 normally marks does not progress, so the subunits that depend on
      it do not accumulate into the holoenzyme.
    evidence:
    - reference: PMID:27986404
      reference_title: Mutations in mitochondrial complex I assembly factor NDUFAF3 cause Leigh syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, we present an analysis of complex I assembly routes representative of each
        functional module and, thereby, link NDUFAF3 to a specific step in complex I assembly.
      explanation: >-
        The module-resolved assembly analysis that places the block at a defined step rather
        than describing a general failure.
  evidence:
  - reference: PMID:22653752
    reference_title: Early complex I assembly defects result in rapid turnover of the ND1 subunit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NDUFAF3 co-immunoprecipitated with NDUFAF4, and three matrix arm structural subunits
      (NDUFS2, NDUFA9, NDUFS3) that are found in a 400 kDa assembly intermediate containing ND1.
    explanation: >-
      What NDUFAF3 is physically part of, which is what this node is about, and the partner set
      that is lost with it.
  - reference: PMID:19463981
    reference_title: "Mutations in NDUFAF3 (C3ORF60), encoding an NDUFAF4 (C6ORF66)-interacting complex I assembly protein, cause fatal neonatal mitochondrial disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we show that NDUFAF3 tightly interacts with NDUFAF4 (C6ORF66), a protein
      previously implicated in complex I deficiency.
    explanation: >-
      The NDUFAF3-NDUFAF4 association, which is why the NDUFAF4 disease (MC1DN15) and this one
      share an assembly lesion.
- name: Rapid Proteolytic Turnover of Newly Synthesized ND1
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    ND1 is translated normally but destroyed shortly afterwards. Short-term knockdown of the
    m-AAA protease in cells depleted of NDUFAF3 completely restores ND1 labelling, which is
    what identifies the loss as proteolysis of an unprotected subunit rather than a failure to
    make it. The effect belongs to the early assembly factors specifically: knockdown of the
    late assembly factor NDUFAF2 does not produce it.
  biological_processes:
  - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
    modifier: INCREASED
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
  downstream:
  - target: Stalled Complex I Assembly with Depleted Q- and P-Module Subunits
    causal_link_type: DIRECT
    description: >-
      ND1 is the subunit around which the holoenzyme nucleates, so destroying it removes the
      seed for the rest of the assembly.
    evidence:
    - reference: PMID:22653752
      reference_title: Early complex I assembly defects result in rapid turnover of the ND1 subunit.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These data suggest that the four early CI assembly factors have non-redundant functions
        in the assembly of a module that docks and stabilizes newly synthesized ND1, nucleating
        assembly of the holoenzyme.
      explanation: >-
        The authors' own statement of what losing the ND1-stabilising step does to the rest of
        assembly.
  evidence:
  - reference: PMID:22653752
    reference_title: Early complex I assembly defects result in rapid turnover of the ND1 subunit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transient, short-term knock-down of the m-AAA protease AGF3L2 in cells that had been
      depleted of any of the early CI assembly factors completely rescued the ND1 labeling
      phenotype, confirming that it is not a synthesis defect, but rather results from rapid
      proteolysis of newly synthesized ND1.
    explanation: >-
      The protease-knockdown rescue that identifies the mechanism as proteolysis, and names the
      protease responsible.
  notes: >-
    Curated as its own node rather than folded into the assembly block because the experiment
    separates two things that look identical on a native gel: a subunit that is never made and
    a subunit that is made and then degraded. It also names a protease, which is the only point
    in this pathograph where a candidate pharmacological handle exists. Note that the quoted
    sentence spells the protease "AGF3L2"; the gene symbol is AFG3L2, and the snippet is quoted
    as the source printed it rather than corrected.
- name: Stalled Complex I Assembly with Depleted Q- and P-Module Subunits
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The holoenzyme does not complete. Two-dimensional blue-native and denaturing gels from the
    leukoencephalopathy patient show matrix-arm Q-module subunits (NDUFS2, NDUFS3, NDUFA9) and
    membrane-arm P-module subunits (NDUFB10, NDUFB11) reduced together, so the block is not
    confined to one module. Complexome profiling of the 2023 patient shows what piles up behind
    it: early membrane-arm sub-assemblies still bound to the MCIA complex. The same profiling
    reports a second, unusual species in that patient - free monomeric complex I still holding
    the MCIA complex and other assembly factors - so the holoenzyme that does form has not
    released its assembly machinery.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
    description: >-
      Assembly that never completes leaves too little holoenzyme, and the deficiency is
      isolated because the other respiratory chain complexes are not reported as reduced.
    evidence:
    - reference: PMID:29344937
      reference_title: NDUFAF3 variants that disrupt mitochondrial complex I assembly may associate with cavitating leukoencephalopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The respiratory enzyme activity of complex I was reduced to 17% to 21% in skeletal muscle.
      explanation: The enzyme deficiency that the assembly block produces, measured in affected tissue.
  evidence:
  - reference: PMID:29344937
    reference_title: NDUFAF3 variants that disrupt mitochondrial complex I assembly may associate with cavitating leukoencephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two-dimensional, blue-native polyacrylamide gel electrophoresis (PAGE) and sodium dodecyl
      sulfate-PAGE revealed reductions in Q-module (NDUFS2, NDUFS3, and NDUFA9) and P-module
      (NDUFB10 and NDUFB11) subunits, indicating disruption of mitochondrial complex I assembly.
    explanation: >-
      The subunit-level description of the block in a patient, and the evidence that it spans
      both arms of the enzyme.
  - reference: PMID:37572574
    reference_title: Expanding the phenotypic and biochemical spectrum of NDUFAF3-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Accumulation of early sub-assemblies of the membrane arm of CI associated with
      mitochondrial complex I intermediate assembly (MCIA) complex was observed.
    explanation: >-
      What accumulates behind the block, which is the complement of the subunit depletion and
      identifies the stage at which assembly stops.
  - reference: PMID:37572574
    reference_title: Expanding the phenotypic and biochemical spectrum of NDUFAF3-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The most striking additional findings were both the unusual occurrence of free monomeric

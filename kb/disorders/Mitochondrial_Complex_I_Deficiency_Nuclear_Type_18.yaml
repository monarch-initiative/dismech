- name: Decreased Activity of Mitochondrial Complex I
  category: Metabolic
  description: >-
    The defining biochemical finding, measured in skeletal muscle in the leukoencephalopathy
    patient and in cultured fibroblast mitochondria in the 2023 patient. The deficiency is
    isolated: the other respiratory chain complexes are not reported as reduced.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Decreased activity of mitochondrial complex I
    term:

    snippet: >-
      We performed homozygosity mapping and gene sequencing to identify the genetic defect in
      five complex I-deficient patients from three different families.
    explanation: The recessive study design by which the gene was found, in three separate families.
pathophysiology:
- name: Biallelic NDUFAF3 Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Two damaged copies of NDUFAF3 (C3ORF60), which encodes a mitochondrial complex I assembly
    factor. The reported alleles span several mutation classes. The ClinGen expert-panel
    curation scored six variants across the first three reports: four missense changes, one
    initiation-codon change and one in-frame duplication. The leukoencephalopathy patient
    carries the in-frame duplication c.342_343insGTG p.117Valdup in trans with the missense
    c.505C>A p.Pro169Thr; the 2023 patient carries a splice-site variant in trans with a
    missense variant. No clean null allele has been reported.

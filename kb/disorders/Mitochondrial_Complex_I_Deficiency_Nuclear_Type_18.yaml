name: Mitochondrial Complex I Deficiency, Nuclear Type 18
creation_date: "2026-09-24T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 18
  term:
    id: MONDO:0032623
    label: mitochondrial complex I deficiency, nuclear type 18
description: >-
  Mitochondrial complex I deficiency nuclear type 18 (MC1DN18) is the isolated complex I
  deficiency caused by biallelic variants in NDUFAF3. NDUFAF3 is not a subunit of the enzyme.
  It is a matrix assembly factor, described as the uncharacterised open reading frame C3ORF60,
  that binds the earliest complex I assembly intermediates and works in tight physical
  association with a second assembly factor, NDUFAF4.

  The lesion has a specific and well-characterised shape. NDUFAF3 sits on a roughly 400 kDa
  intermediate that also carries the matrix-arm subunits NDUFS2, NDUFA9 and NDUFS3 together
  with the mitochondrially encoded ND1 subunit. When NDUFAF3 is depleted, newly synthesised
  ND1 is no longer protected and is destroyed by the m-AAA protease, and the intermediate that
  would have nucleated the holoenzyme never forms. Gels from patient tissue show the
  consequence from both ends: Q-module and P-module subunits are depleted together, and early
  membrane-arm sub-assemblies bound to the mitochondrial complex I intermediate assembly (MCIA)
  complex pile up behind the block.

  Clinically this is, in most reported children, a lethal disease of infancy. The gene was
  found in 2009 in five complex I deficient patients from three families with severe neonatal
  lactic acidosis, and by 2023 the seven patients described up to that point had had severe
  neurological disease and lactic acidosis with a fatal course in infancy in most cases. Two
  later reports establish that the range is wider: a one-year-old girl who presented after a
  respiratory infection with cavitating leukoencephalopathy, and a ten-year-old with a
  neurodevelopmental disorder, progressive exercise intolerance, dystonia and basal ganglia
  abnormalities whose fibroblast complex I activity was only mildly reduced. Leigh syndrome was
  added to the spectrum in 2017.

  Pediatric framing is not incidental here. Presentation is in the neonatal period or early
  childhood; the severe pole is measured in months and is what dominates counselling at
  diagnosis; and the milder pole is defined entirely by what happens to a child who survives
  infancy. No disease-modifying treatment has been reported for this gene.

  notes: >-
    OBLIGATE because it is the entity's defining criterion and every reported patient was
    ascertained through it or shown to have it, which also means it carries no information about
    penetrance. Not wired into the pathograph: it restates the Isolated Complex I Deficiency
    pathophysiology node, and an edge between a node and its own restatement is the
    self-referential collapse check-entity-refs exists to catch. It is recorded as a phenotype
    so that the claim carries its HP binding.
  evidence:

genetic:
- name: ALG9
  association: Biallelic loss-of-function variants
  features: >-
    Reported ALG9-CDG variants include missense alleles in liveborn patients and
    a homozygous c.1173+2T>A splice variant in fetal-lethal
    Gillessen-Kaesbach-Nishimura skeletal dysplasia. These observations establish
    a phenotypic range from liveborn multisystem disease to prenatal lethality,
    but the small number of families does not establish a variant-class severity
    correlation.
  gene_term:
    preferred_term: ALG9
    term:
      id: hgnc:15672
      label: ALG9
  evidence:
  - reference: PMID:15148656
    reference_title: "Identification and functional analysis of a defect in the human ALG9 gene: definition of congenital disorder of glycosylation type IL."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous point-mutation 1567G-->A (amino acid substitution E523K) was
      detected in the ALG9 gene.
    explanation: >-
      The defining ALG9-CDG report identifies a homozygous ALG9 variant in the
      affected patient.
  - reference: PMID:25966638
    reference_title: "A novel phenotype in N-glycosylation disorders: Gillessen-Kaesbach-Nishimura skeletal dysplasia due to pathogenic variants in ALG9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected patients were shown to have a novel homozygous splice variant
      NM_024740.2: c.1173+2T>A in the ALG9 gene, encoding
      alpha-1,2-mannosyltransferase, involved in the formation of the
      lipid-linked oligosaccharide precursor of N-glycosylation.
    explanation: >-
      The fetal series directly links homozygous ALG9 splice variants to the
      severe prenatal form.
diagnosis:
- name: Serum transferrin isoelectric focusing
  description: >-
    Transferrin isoelectric focusing is a nonspecific biochemical screen that
    can detect a type I CDG hypoglycosylation pattern but cannot distinguish
    ALG9-CDG from other type I congenital disorders of glycosylation.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: MAXO:0000003
      label: diagnostic procedure
  results: A type I CDG transferrin pattern that requires etiologic follow-up.
  evidence:
  - reference: PMID:15945070
    reference_title: "CDG-IL: an infant with a novel mutation in the ALG9 gene and additional phenotypic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypoglycosylation was confirmed by the typical CDG type 1 pattern of serum
      transferrin analyzed by isoelectric focusing.
    explanation: >-
      This directly supports the type I transferrin pattern as a biochemical
      screening result; it does not establish the ALG9 subtype.
- name: ALG9 molecular genetic testing
  description: >-
    Molecular diagnosis requires two pathogenic or likely pathogenic ALG9
    variants affecting opposite alleles (in trans), interpreted with the
    biochemical and clinical findings.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: MAXO:0000533
      label: molecular genetic testing
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: ALG9
        term:
          id: hgnc:15672
          label: ALG9
  results: Biallelic pathogenic or likely pathogenic ALG9 variants in trans.
  evidence:
  - reference: PMID:15945070
    reference_title: "CDG-IL: an infant with a novel mutation in the ALG9 gene and additional phenotypic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A defect in the ALG9 enzyme was suggested by the accumulation of the
      DolPP-GlcNAc2Man6 and DolPP-GlcNAc2Man8 in the patient's fibroblasts and
      confirmed by mutation analysis: the patient is homozygous for the ALG9
      mutation p.Y286C.
    explanation: >-
      A confirmed affected individual was homozygous for an ALG9 variant,
      illustrating biallelic molecular confirmation.
- name: Glycan profiling
  description: >-
    Glycan profiling can corroborate an abnormal type I glycosylation pattern,
    but it is a biochemical characterization method and cannot by itself
    establish biallelic ALG9 etiology.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: MAXO:0000003
      label: diagnostic procedure
  results: Abnormal glycan profile consistent with a type I glycosylation defect.
  evidence:
  - reference: PMID:28932688
    reference_title: "ALG9-CDG: New clinical case and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The metabolic work-up included analysis of a transferrin isoelectric
      focusing, which showed a type 1 pattern. This was confirmed by glycan
      profiling
    explanation: >-
      The case report supports glycan profiling as confirmation of the
      biochemical pattern, not as a method for identifying an ALG9 genotype.
biochemical:
- name: Type I carbohydrate-deficient transferrin pattern
  presence: ABNORMAL
  context: >-
    ALG9-CDG produces a type I CDG transferrin pattern from impaired synthesis
    or transfer of lipid-linked oligosaccharide precursors.
  biomarker_term:
    preferred_term: N-glycan
    term:
      id: CHEBI:59520
      label: N-glycan
  readouts:
  - target: Protein hypoglycosylation
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A type I carbohydrate-deficient transferrin pattern directly reports
      hypoglycosylation of a serum glycoprotein; it is not ALG9-specific.
    evidence:
    - reference: PMID:15945070
      reference_title: "CDG-IL: an infant with a novel mutation in the ALG9 gene and additional phenotypic features."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hypoglycosylation was confirmed by the typical CDG type 1 pattern of
        serum transferrin analyzed by isoelectric focusing.
      explanation: >-
        The patient-level transferrin pattern is an indirect readout of the
        upstream lipid-linked-oligosaccharide defect and is not ALG9-specific.
  evidence:
  - reference: PMID:15945070
    reference_title: "CDG-IL: an infant with a novel mutation in the ALG9 gene and additional phenotypic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypoglycosylation was confirmed by the typical CDG type 1 pattern of serum
      transferrin analyzed by isoelectric focusing.
    explanation: >-
      This is the reported biochemical diagnostic signature in a confirmed
      ALG9-CDG patient.
- name: Accumulated DolPP-GlcNAc2Man6 and DolPP-GlcNAc2Man8
  presence: ABNORMAL
  context: >-
    Patient cells accumulate truncated lipid-linked oligosaccharides upstream
    of the ALG9-dependent mannosyltransferase steps.
  biomarker_term:
    preferred_term: N-glycan
    term:
      id: CHEBI:59520
      label: N-glycan
  readouts:
  - target: ALG9 alpha-1,2-mannosyltransferase deficiency
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Accumulation of DolPP-GlcNAc2Man6 and DolPP-GlcNAc2Man8 reports the
      ALG9-dependent mannosyltransferase block in lipid-linked oligosaccharide
      assembly.
    evidence:
    - reference: PMID:15148656
      reference_title: "Identification and functional analysis of a defect in the human ALG9 gene: definition of congenital disorder of glycosylation type IL."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using this approach, we have found, in a patient with CDG, a deficiency
        of the ALG9 alpha 1,2 mannosyltransferase enzyme, which causes an
        accumulation of lipid-linked-GlcNAc(2)Man(6) and -GlcNAc(2)Man(8)
        structures
      explanation: >-
        The cultured-cell biochemical study directly links accumulation of the
        two truncated intermediates to ALG9 enzyme deficiency.
  evidence:
  - reference: PMID:15148656
    reference_title: "Identification and functional analysis of a defect in the human ALG9 gene: definition of congenital disorder of glycosylation type IL."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using this approach, we have found, in a patient with CDG, a deficiency of
      the ALG9 alpha 1,2 mannosyltransferase enzyme, which causes an
      accumulation of lipid-linked-GlcNAc(2)Man(6) and -GlcNAc(2)Man(8)
      structures, which was paralleled by the transfer of incomplete
      oligosaccharides precursors to protein.
    explanation: >-
      The defining biochemical report directly describes the accumulated
      DolPP-linked oligosaccharide species.

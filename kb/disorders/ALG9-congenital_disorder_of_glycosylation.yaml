mechanistic_hypotheses:
- hypothesis_group_id: canonical_alg9_cdg_model
  hypothesis_label: Canonical ALG9-CDG Precursor Assembly and Protein Hypoglycosylation Model
  status: CANONICAL
  description: >-
    Biallelic ALG9 loss of function reduces ER alpha-1,2-mannosyltransferase
    activity, causing Man6GlcNAc2-PP-dolichol and Man8GlcNAc2-PP-dolichol
    intermediates to accumulate. Transfer of incomplete oligosaccharides to
    proteins produces protein hypoglycosylation and a type I transferrin pattern,
    followed by multisystem disease through incompletely resolved client-protein
    and tissue-specific intermediates.
  evidence:
  - reference: PMID:15148656
    reference_title: "Identification and functional analysis of a defect in the human ALG9 gene: definition of congenital disorder of glycosylation type IL."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using this approach, we have found, in a patient with CDG, a deficiency of
      the ALG9 alpha 1,2 mannosyltransferase enzyme, which causes an
      accumulation of lipid-linked-GlcNAc(2)Man(6) and -GlcNAc(2)Man(8)
      structures, which was paralleled by the transfer of incomplete
      oligosaccharides precursors to protein.
    explanation: >-
      Patient-derived biochemical studies directly support the enzyme defect,
      accumulated precursor species, and transfer of incomplete glycans that
      define the canonical model.
  - reference: PMID:15945070
    reference_title: "CDG-IL: an infant with a novel mutation in the ALG9 gene and additional phenotypic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypoglycosylation was confirmed by the typical CDG type 1 pattern of serum
      transferrin analyzed by isoelectric focusing.
    explanation: >-
      The patient transferrin result supports protein hypoglycosylation as the
      central biochemical lesion downstream of the ALG9 precursor defect.
- hypothesis_group_id: emerging_er_quality_control_degradation_model
  hypothesis_label: Emerging ER Glycoprotein Quality-Control and Degradation Model
  status: EMERGING
  description: >-
    Glycoproteins bearing the truncated Man6GlcNAc2 and Man8GlcNAc2 structures
    can enter the ER glucosylation-deglucosylation quality-control cycle, while
    misfolded glycoproteins are degraded more rapidly in patient cells. This is
    a bounded cellular-response hypothesis: the in-vitro finding is established,
    but whether enhanced degradation materially contributes to human ALG9-CDG
    manifestations has not been demonstrated.
  evidence:
  - reference: PMID:19451548
    reference_title: Quality control of glycoproteins bearing truncated glycans in an ALG9-defective (CDG-IL) patient.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also showed that in comparison with control cells, patient's cells
      degraded misfolded glycoproteins at an increasing rate. The
      Man(8)GlcNAc(2) isomer C on the patient's glycoproteins was found to
      promote the degradation of misfolded glycoproteins.
    explanation: >-
      The patient-cell experiment directly supports enhanced degradation of
      misfolded glycoproteins, without establishing its clinical contribution.

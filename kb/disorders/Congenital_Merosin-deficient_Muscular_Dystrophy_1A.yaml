genetic:
- name: LAMA2
  gene_term:
    preferred_term: LAMA2
    term:
      id: hgnc:6482
      label: LAMA2
  relationship_type: CAUSATIVE
  notes: >-
    LAMA2 at 6q22-q23 encodes the laminin alpha-2 chain. Biallelic loss of function is the sole
    established cause of this disease. Over 300 pathogenic variants are reported, and the allele
    class is prognostically meaningful: nonsense, frameshift and whole-exon deletion alleles
    dominate the congenital severe form, whereas missense and leaky splice alleles that leave
    residual protein cluster at the limb-girdle end. Variants affecting the C-terminal LG domains
    are additionally associated with brain malformation, which is mechanistically coherent
    because the LG module is the receptor-binding end of the molecule in both muscle and brain.
  evidence:
  - reference: PMID:7550355
    reference_title: "Mutations in the laminin alpha 2-chain gene (LAMA2) cause merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore investigated LAMA2 for the presence of disease-causing mutations in laminin alpha 2 chain-deficient CMD families and now report splice site and nonsense mutations in two families leading presumably to a truncated laminin alpha 2 protein."
    explanation: The report that established LAMA2 as the causal gene.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The top three high-frequency disease-causing variants in Han Chinese patients were c.7147C > T (p.R2383*), exon 4 deletion, and c.5156_5159del (p.K1719Rfs*5)."
    explanation: >-
      Records the recurrent Han Chinese alleles. Population-specific recurrence matters
      for testing strategy - a targeted assay is only worth building where an allele
      actually recurs.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Copy number variations were identified in 26.4% of survivors and 50.0% of nonsurvivors, suggesting that copy number variations were associated with lower rate of survival (p = 0.029)."
    explanation: >-
      The one prognostic genetic association in this disease rather than a merely
      descriptive one: copy-number variants are over-represented among non-survivors.
      Quoted with the authors' own hedge ("suggesting") intact - it is a single-cohort
      association at p = 0.029, not an established rule.
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A new brazilian possible founder variant was found in 11 patients (21,15%) (c.1255del; p. Ile419Leufs*4)."
    explanation: >-
      A second population-specific recurrent allele, in a different cohort, quoted with
      the authors' own "possible founder" hedge rather than asserted as established.
  - reference: PMID:32457577
    reference_title: "A Family of Laminin α2 Chain-Deficient Mouse Mutants: Advancing the Research on LAMA2-CMD."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "which result in a large clinical heterogeneity of the disease"
    explanation: Supports the link between the size of the LAMA2 allelic spectrum and the clinical heterogeneity described here.
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a relation between gene variants affecting the laminin-α2 LG-domain and the presence of brain malformation (P = 0.016)."
    explanation: Establishes the LG-domain genotype correlation with cortical malformation recorded in these notes.
  case_fractions:
  - population: Han Chinese LAMA2-related muscular dystrophy cohort
    case_fraction_percent: 56.9
    cohort_size: 116
    notes: >-
      Share of congenital-form patients carrying a nonsense variant, contrasted with 21.4% in the
      limb-girdle subtype. Recorded as an allele-class share within the gene, not as a share of
      cases attributable to the gene, which is 100% by definition for a monogenic disease.
    evidence:
    - reference: PMID:34281576
      reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nonsense variants were more frequent in LAMA2-CMD (56.9%, 66/116) than in LGMDR23 (21.4%, 3/14), while missense disease-causing variants were more frequent in LGMDR23 (71.4%, 10/14) than in LAMA2-CMD (12.9%, 15/116)."
      explanation: Gives the nonsense-allele share in the congenital-form group recorded here.
diagnosis:
- name: LAMA2 molecular genetic testing
  presence: PRESENT
  description: >-
    Identification of biallelic pathogenic LAMA2 variants establishes the diagnosis.
    Next-generation sequencing has largely displaced the biopsy-first pathway, but copy-number
    analysis matters: single and multi-exon deletions account for a substantial minority of
    alleles and are missed by sequencing alone. Functional splice assessment can clarify
    suspected splice-altering variants: the Swiss cohort confirmed aberrant splicing for
    c.4960-17C>A. This variant-level evidence does not establish a universal RNA-sequencing
    workflow, preferred tissue, or diagnostic yield after single-allele detection.
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of LAMA2 muscular dystrophy is established in a proband with suggestive findings and biallelic (homozygous or compound heterozygous) pathogenic variants in LAMA2 identified by molecular genetic testing."
    explanation: States the molecular diagnostic criterion.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Next-generation sequencing (NGS) has greatly improved diagnostic abilities for LAMA2-RD, and the majority of patients with merosin deficiency carry recessive pathogenic variants in the LAMA2 gene."
    explanation: Supports the primacy of sequencing in the current diagnostic pathway.
  - reference: PMID:39213089
    reference_title: A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular
      Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We confirmed aberrant splicing for the c.4960-17C > A variant (see Figure S1 and Table
      S1).
    explanation: The Swiss clinical study reports functional confirmation for a specific intronic
      variant. It supports an adjunctive splice assessment, not the broader report-proposed RNA sequencing
      or RT-PCR algorithm for every unresolved patient.
- name: Muscle biopsy merosin immunostaining
  presence: PRESENT
  description: >-
    Absent or reduced laminin alpha-2 immunostaining on muscle, on a dystrophic background. It
    remains useful for grading complete versus partial deficiency, but the residual-protein
    reading is not reliable enough to predict phenotype in an individual patient, and skin biopsy
    can substitute where complete deficiency is suspected.
  evidence:
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the amount of merosin in muscle biopsy does not enable a clear prediction of clinical phenotype"
    explanation: States the prognostic limitation of the immunostain that this entry records.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Absence of laminin alpha 2 at the epidermal and adnexal basement membranes and intradermal sensory nerves can be demonstrated in skin biopsies, particularly in cases of complete laminin alpha 2 deficiency"
    explanation: Supports skin biopsy as an alternative demonstration of the protein deficiency.
- name: Brain MRI white matter signal
  presence: PRESENT
  description: >-
    Diffuse periventricular and subcortical T2 hyperintensity is close to universal beyond six
    months and is often the finding that redirects an undiagnosed floppy infant towards LAMA2.
    Below six months it may be absent, so a normal early MRI does not exclude the diagnosis.
    Re-reading the MRI specifically for cortical malformation is worthwhile: it is frequently
    missed on the initial report.
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Characteristic brain white matter (WM) hypointensity on T1 magnetic resonance imaging (MRI), and increased T2 signal in the periventricular and subcortical WM, are invariably observed in most patients older than 6 months"
    explanation: Establishes the MRI finding and its age threshold.
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "shows the importance of reviewing the brain MRI of patients with LAMA2-RD"
    explanation: Supports the recommendation to re-review the MRI for cortical malformation.
- name: Motor nerve conduction study
  presence: PRESENT
  description: >-
    Slowed motor conduction supports merosin deficiency over other congenital muscular
    dystrophies. It is supportive rather than decisive: some cohorts report normal studies, and
    it is not needed once genetic testing is available.
  evidence:
  - reference: PMID:8576559
    reference_title: "Demyelinating peripheral neuropathy in merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All but two of the 10 merosin-deficient cases had reduced motor nerve conduction, whereas all the merosin-positive cases had normal results."
    explanation: Establishes the discriminating value of the study between merosin-deficient and merosin-positive congenital muscular dystrophy.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological nerve conduction studies were done in three patients (two with motor and sensory measurements, one patient with only sensory measurement) and were reported as being normal."
    explanation: Records a cohort in which the studies were normal, which is why this test is described as supportive rather than decisive.
progression:
- phase: Neonatal and infantile
  notes: >-
    Onset is at or within days of birth in three quarters of congenital-form patients: profound
    hypotonia, weak cry, poor spontaneous movement, sometimes neonatal feeding or respiratory
    difficulty. The mouse data suggest the pathology is already well established by this point,
    with apoptotic fibres from postnatal day 1 and full dystrophic architecture by day 4, which
    is the argument for intervening as early as diagnosis permits.
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset symptoms in LAMA2-CMD were variable combinations of severe muscle weakness (n = 114), hypotonia (n = 114), weak cry (n = 48), neonatal feeding difficulty (n = 30), neonatal respiratory difficulty (n = 9)."
    explanation: Enumerates the presenting features of this phase in a 116-patient congenital-form cohort.
  - reference: PMID:31586140
    reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therapeutic tests in the dy3K/dy3K mouse model should therefore be initiated shortly after birth, but should also take into account timing and correlation between regenerative and pathogenic events."
    explanation: The authors' own inference about intervention timing from the perinatal onset of pathology.
- phase: Early and middle childhood
  notes: >-
    Motor milestones are attained late and incompletely: head control by about six months and
    independent sitting by about eleven months in most, but ambulation in fewer than a fifth.
    Contractures accumulate steadily and scoliosis appears in the non-ambulant, typically after
    six years. Motor regression, when it happens, clusters in the six-to-nine-year window and
    tracks the contracture phase rather than a separate loss of strength.
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor regression in LAMA2-CMD mainly occurred concurrently with rapid progression of contractures during 6-9 years old."
    explanation: Times the regression window and links it to contracture progression.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Progressive scoliosis is common after 6 years of age, leading to a surgical correction in most patients."
    explanation: Times the onset of scoliosis and its surgical burden to this phase.
- phase: Adolescence and respiratory decline
  notes: >-
    The dominant events of the second decade are respiratory and nutritional. Forced vital
    capacity falls at about 2.9% predicted per year, nocturnal non-invasive ventilation is started
    at a median of around twelve years, and gastrostomy at around eleven. Spinal surgery is
    common. Cardiac abnormalities, mostly subclinical, are increasingly detected.
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two CD required nocturnal noninvasive ventilation (median age 11.7 years)."
    explanation: Dates the ventilatory transition that defines this phase.
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen CD and one PD patient required gastrostomy insertion for failure to thrive and/or unsafe swallow (median age 10.9 years)."
    explanation: Dates the nutritional transition in the same cohort.
- phase: Survival and cause of death
  notes: >-
    Mortality is driven by respiratory infection rather than by cardiac or neurological disease.
    About 30% of early-onset patients die within the first decade in one review's summary; in a
    tertiary cohort seven of 42 complete-deficiency patients died at a median of 12 years, and in
    a 130-patient national cohort 24 died, mostly of severe pneumonia. Survival into adulthood is
    routine in the partial-deficiency subtype.
  evidence:
  - reference: PMID:31308722
    reference_title: "Current understanding and treatment of cardiac and skeletal muscle pathology in laminin-α2 chain-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most common cause of death in early-onset LAMA2 MD is respiratory tract infection, with 30% of them dying within the first decade of life."
    explanation: Gives both the leading cause of death and a first-decade mortality figure.
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven CD patients died at median age 12 years."
    explanation: Gives median age at death in a well-characterised complete-deficiency cohort.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying therapy, so management is anticipatory surveillance plus
    intervention at defined thresholds, delivered by a coordinated team. The surveillance list is
    long because the complications are: nutrition and swallow safety, neurologic status,
    pulmonary function, cognition and education, mobility, cardiac rhythm and function, vision,
    and bone quality. The life-span cohort authors recommend ECG, Holter monitoring and
    echocardiography, recurrent bone mineral density assessment, and vitamin D/calcium
    supplementation. These are surveillance and supportive-care recommendations, not measured
    disease-modifying treatment effects.
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is recommended that multidisciplinary care be provided by specialists in neurology, gastroenterology, nutrition, orthopedics, occupational and physical therapy, speech and language therapy, education, psychiatry, pulmonary medicine, cardiology, ophthalmology, and social work."
    explanation: GeneReviews states the multidisciplinary management recommendation this treatment records.
  - reference: PMID:37476021
    reference_title: 'LAMA2-Related Muscular Dystrophy Across the Life Span: A Cross-sectional Study.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: We advise cardiac surveillance by regular screening of patients with ECG, Holter monitor,
      and echocardiography with advanced techniques for early detection and treatment of cardiac manifestations.
    explanation: The authors recommend cardiac screening after their mixed-age LAMA2 cohort assessment.
      This is clinical guidance, not a trial demonstrating surveillance efficacy.
  - reference: PMID:37476021
    reference_title: 'LAMA2-Related Muscular Dystrophy Across the Life Span: A Cross-sectional Study.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Based on the low bone quality, we further recommend recurrent bone mineral density assessment
      and optimization of bone quality through vitamin D and calcium suppletion.
    explanation: The recommendation follows cohort densitometry and fragility-fracture findings. The
      study did not test supplementation as a disease-modifying treatment or determine a congenital-only
      screening interval.

- name: Non-Invasive Ventilation
  description: >-
    Nocturnal non-invasive ventilation for restrictive respiratory failure, started at a median
    of around twelve years in the complete-deficiency form. Long-term invasive ventilation or
    tracheostomy is uncommon in paediatric practice; invasive support is generally reserved for
    short periods during intercurrent infection.
  treatment_term:
    preferred_term: nocturnal non-invasive ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Respiratory Muscle Weakness and Reduced Chest Wall Compliance
    treatment_effect: BYPASSES
    description: >-
      Ventilatory support substitutes for the failing respiratory pump rather than acting on the
      muscle lesion, and it does not slow the decline in vital capacity.
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two CD required nocturnal noninvasive ventilation (median age 11.7 years)."
    explanation: Documents the use and timing of nocturnal non-invasive ventilation in this population.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While invasive ventilation might become necessary for short periods and typically during times of respiratory infections, long-term use of invasive ventilation or use of ventilation via a tracheostomy is rare in pediatric LAMA2-RD patients."
    explanation: Supports the preference for non-invasive over invasive long-term support.
- name: Gastrostomy Feeding
  description: Gastrostomy supports nutrition when oral intake is inadequate or swallowing is
    unsafe. Nineteen complete-deficiency and one partial-deficiency UK patients received a tube;
    the observed median age was five years, versus a 10.9-year time-to-event estimate. A selected
    feeding series reported improved weight gain and fewer chest infections after placement.
    Tube feeding does not guarantee normal growth or eliminate all aspiration risk.
  treatment_term:
    preferred_term: gastrostomy tube placement
    term:
      id: NCIT:C157864
      label: Gastrostomy Tube Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen CD and one PD patient required gastrostomy insertion for failure to thrive and/or unsafe swallow (median age 10.9 years)."
    explanation: The quoted 10.9 years is a time-to-event estimate; the observed median gastrostomy
      age was five years. Gastrostomy requirement does not measure all feeding impairment.
  - reference: PMID:10332004
    reference_title: Feeding problems in merosin deficient congenital muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As a result of the study five children had a gastrostomy, which stopped the chest
      infections and improved weight gain.
    explanation: Within-series improvement supports feeding-related morbidity; it is not a controlled
      treatment effect.
- name: Physical Therapy and Contracture Management
  description: >-
    Stretching, splinting, orthoses and positioning to slow contracture and preserve what function
    exists. Given that contracture is driven by early fibrogenesis and accumulates linearly, this
    is a rate-limiting intervention rather than a preventive one.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Endomysial Fibrosis and Replacement of Muscle
    treatment_effect: MODULATES
    description: >-
      Mechanical stretching opposes the shortening produced by fibrotic replacement without
      addressing the matrix deposition itself.
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is recommended that multidisciplinary care be provided by specialists in neurology, gastroenterology, nutrition, orthopedics, occupational and physical therapy, speech and language therapy, education, psychiatry, pulmonary medicine, cardiology, ophthalmology, and social work."
    explanation: GeneReviews includes physical and occupational therapy in the recommended management team.
- name: Scoliosis Surgery
  description: >-
    Posterior spinal instrumentation and fusion for progressive scoliosis, needed by a
    substantial minority of non-ambulant patients: nine of 33 with scoliosis in one cohort and
    five of ten in another. It is a seating and comfort intervention as much as a respiratory one.
  treatment_term:
    preferred_term: spinal fusion for neuromuscular scoliosis
    term:
      id: NCIT:C157986
      label: Spinal Fusion
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-two CD and one PD patient developed scoliosis, nine underwent spinal surgery."
    explanation: Gives the proportion of scoliotic patients proceeding to surgery.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our cohort five out of ten patients with CMD needed a surgical intervention for their severe scoliosis."
    explanation: Independent cohort corroboration of the surgical rate.
- name: Antiepileptic Drug Therapy
  description: >-
    Seizures in this disease are usually controlled with first-line antiepileptic drugs where
    there is no underlying cortical anomaly. Where a cortical malformation is present, drug
    resistance is reported, so the imaging finding has direct therapeutic implications.
  treatment_term:
    preferred_term: antiepileptic drug therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Epilepsy should be monitored for and usually can be controlled with first-line antiepileptic drugs."
    explanation: States the recommendation and the expected response.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One had continuous spike-waves during sleep (CSWS) and one had drug-resistant frequent focal seizures with impaired awareness (cortical malformation in one patient)."
    explanation: Documents the drug-resistant subgroup associated with cortical malformation.
- name: Genetic Counseling
  description: >-
    Autosomal recessive counselling with a 25% recurrence risk per pregnancy. Once the familial
    variants are known, carrier testing, prenatal and preimplantation genetic testing become
    available, which matters in a disease with no treatment and a severe natural history.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Once the LAMA2 pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives and prenatal and preimplantation genetic testing are possible."
    explanation: States the reproductive options this counselling delivers.
- name: Omigapil
  description: >-
    An anti-apoptotic small molecule that inhibits the GAPDH-Siah1-mediated death pathway. It is
    the only therapeutic small molecule to have reached a clinical trial in this disease. In dyW
    and dy2J mice it inhibits muscle apoptosis, reduces weight loss and skeletal deformity,
    increases locomotor activity and delays mortality. The human study (CALLISTO, NCT01805024)
    was a phase 1 open-label pharmacokinetic and safety study over twelve weeks in 20 patients
    with LAMA2- or COL6-related dystrophy; it met its primary endpoint, but it was neither
    designed nor powered to show clinical benefit, and none was observed. This is an unapproved
    investigational agent and is recorded here as the state of the therapeutic pipeline, not as
    available care.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omigapil
      term:
        id: NCIT:C97362
        label: Omigapil
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    treatment_effect: INHIBITS
    description: >-
      Inhibiting GAPDH-Siah1-mediated apoptosis reduces myofibre death in the mouse. Whether this
      translates to humans is unresolved: the only human trial was a pharmacokinetic study.
    evidence:
    - reference: PMID:19759319
      reference_title: "Omigapil ameliorates the pathology of muscle dystrophy caused by laminin-alpha2 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Specifically, we demonstrate that treatment with omigapil inhibits apoptosis in muscle, reduces body weight loss and skeletal deformation, increases locomotive activity, and protects from early mortality."
      explanation: Demonstrates the anti-apoptotic effect on the target node and the downstream functional benefit in the mouse.
  evidence:
  - reference: PMID:19759319
    reference_title: "Omigapil ameliorates the pathology of muscle dystrophy caused by laminin-alpha2 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate that the proapoptotic glyceraldehyde-3-phosphate dehydrogenase (GAPDH)-Siah1-CBP/p300-p53 pathway is activated in a mouse model for MDC1A."
    explanation: Establishes that the pathway omigapil inhibits is actually engaged in the disease model.
  - reference: PMID:38915423
    reference_title: "Phase 1 Open-Label Study of Omigapil in Patients With LAMA2- or COL6-Related Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In general, omigapil was safe and well tolerated."
    explanation: The safety result of the only human trial.
  - reference: PMID:38915423
    reference_title: "Phase 1 Open-Label Study of Omigapil in Patients With LAMA2- or COL6-Related Dystrophy."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "No consistent changes were seen in the disease-relevant clinical assessments during the duration of the study."
    explanation: The small phase 1 safety/pharmacokinetic study was not designed to establish
      efficacy; absence of consistent clinical change is not evidence of a definitive lack of
      treatment benefit.
  notes: >-
    Investigational only. No regulatory approval exists for omigapil in any indication.
- name: Avoidance of Succinylcholine and Statins
  description: >-
    A drug-safety measure rather than a therapy, and the one item on this list that changes
    management in an emergency department. Succinylcholine during anaesthetic induction risks
    hyperkalaemia and cardiac conduction abnormalities in this population; statins risk further
    muscle damage. Both should be recorded on an alert document.
  treatment_term:
    preferred_term: avoidance of contraindicated agents
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Succinylcholine in induction of anesthesia because of risk of hyperkalemia and cardiac conduction abnormalities; statins, cholesterol-lowering medications, because of the risk of muscle damage."
    explanation: The GeneReviews Agents/Circumstances to Avoid list, quoted verbatim.
clinical_trials:
- name: NCT01805024
  phase: PHASE_I
  status: COMPLETED
  description: CALLISTO, an ascending multiple-dose cohort study of omigapil in children and
    adolescents with congenital muscular dystrophy, establishing pharmacokinetics at three dose
    levels with safety and tolerability assessment. Twenty patients (ten LAMA2-related, ten
    COL6-related) were enrolled at the NIH. The trial met its primary pharmacokinetic endpoint;
    disease-relevant clinical assessments showed no consistent change over the twelve-week exposure,
    a period and design not intended to establish efficacy.
  target_phenotypes:
  - preferred_term: Axial muscle weakness
    term:
      id: HP:0003327
      label: Axial muscle weakness
  - preferred_term: Restrictive ventilatory defect
    term:
      id: HP:0002091
      label: Restrictive ventilatory defect
  evidence:
  - reference: clinicaltrials:NCT01805024

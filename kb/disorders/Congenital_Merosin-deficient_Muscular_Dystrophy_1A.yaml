name: Congenital Merosin-deficient Muscular Dystrophy 1A
creation_date: "2026-09-05T18:30:00Z"
category: Mendelian
description: >-
  MDC1A is what happens when a muscle fibre loses its anchor to the sheet of extracellular
  matrix it is built against. Biallelic loss-of-function variants in LAMA2 remove the laminin
  alpha-2 chain, historically called merosin, and with it the laminin-211 heterotrimer that is
  the dominant laminin of the skeletal-muscle basal lamina. Laminin-211 is not a passive filler.
  Its short arms polymerise into the basal lamina lattice while its C-terminal LG domains bind
  two sarcolemmal receptors at once, alpha-dystroglycan through the LG4-LG5 pair and integrin
  alpha-7-beta-1 through LG1-LG3, so the same molecule carries the mechanical load of contraction
  across the membrane and licenses the adhesion-dependent survival signalling that keeps the
  fibre alive. Delete it and both functions fail together.

  That double loss is why the disease looks the way it does. Myofibres detach and tear under
  ordinary contraction, and the survival signal that would normally hold them through the injury
  is gone, so they die by apoptosis rather than surviving as damaged cells. Regeneration is
  attempted and is abortive, because the satellite-cell response also depends on the laminin
  substrate it is trying to rebuild against. What fills the space instead is inflammatory
  infiltrate and then endomysial connective tissue, and this happens strikingly early: in the
  most severe mouse model, apoptotic fibres are present on the first postnatal day and full
  dystrophic architecture by day four. The clinical counterpart is a child who is hypotonic and
  weak from birth, whose contractures begin before the weakness is even fully declared, and who
  in most series never walks.

  Laminin-211 is also the basal-lamina laminin of the Schwann cell and is deposited by astrocyte
  endfeet at the glia limitans and the blood-brain barrier, so the disease is not confined to
  muscle. A demyelinating sensorimotor neuropathy with slowed motor conduction is a consistent
  finding, although in humans it contributes little to the weakness. Diffuse T2 white-matter
  hyperintensity on brain MRI is close to universal after about six months and is a diagnostic
  anchor rather than a symptom; cognition is usually preserved. A minority carry something more
  serious: focal breaches of the glia limitans permitting neuronal overmigration, which surfaces
  radiologically as cobblestone malformation or occipital polymicrogyria and clinically as
  epilepsy and intellectual disability. That branch correlates with variants hitting the LG
  domains, which is the same protein module that binds dystroglycan in muscle.

  The residual-protein rule organises the spectrum. Complete deficiency, typically from biallelic
  truncating variants, gives the congenital severe phenotype curated here; partial deficiency,
  more often from missense or leaky splice alleles, gives a later-onset limb-girdle disease
  (LGMDR23) in which independent ambulation is achieved. These are one allelic series with one
  mechanism at different doses, so they are curated as subtypes of this entry rather than as
  separate diseases. The rule is a tendency and not a law: complete deficiency with a mild course
  is reported, and merosin staining does not predict phenotype reliably enough to be used
  prognostically.

  There is no approved disease-modifying therapy. Care is multidisciplinary and anticipatory,
  built around non-invasive ventilation, gastrostomy, contracture and scoliosis management, and
  cardiac surveillance. The one interventional trial to date, of the anti-apoptotic compound
  omigapil, was a phase 1 pharmacokinetic and safety study and was not powered for efficacy. What
  makes the preclinical picture unusually hopeful is that several mechanistically distinct
  interventions, from blocking apoptosis through inhibiting autophagy, restoring the dystroglycan
  link with an engineered linker protein, overexpressing integrin alpha-7, and upregulating the
  paralogous laminin-alpha1, each extend survival in laminin-alpha2-null mice, which says the
  downstream cascade is attackable at several points and not only at the gene.

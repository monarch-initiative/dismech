    supports: SUPPORT
    evidence_source: OTHER
    snippet: A progressive limitation of extraocular movements, in particular of upward gaze,
      is noted as early as at 2 years of age, with clear ophthalmoparesis in the horizontal
      and upwards direction becoming more evident by the end of the first decade.
    explanation: The review describes progression and onset in childhood.
- name: Hyperintensity of cerebral white matter on MRI
  category: Neurologic
  frequency: VERY_FREQUENT
  description: Diffuse periventricular and subcortical T2/FLAIR hyperintensity is very frequent
    after infancy but can be absent or subtle in young infants and some milder cases. Clear
    abnormalities were observed from three months in the Swiss cohort. Signal change is an imaging
    readout of increased white-matter water content; it does not itself prove demyelination
    or predict intellectual disability.
  phenotype_term:
    preferred_term: Hyperintensity of cerebral white matter on MRI
    term:
      id: HP:0030890
      label: Hyperintensity of cerebral white matter on MRI
  reports_on:

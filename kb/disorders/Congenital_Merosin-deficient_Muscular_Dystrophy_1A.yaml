genetic:
- name: LAMA2
  gene_term:
    preferred_term: LAMA2
    term:
      id: hgnc:6482
      label: LAMA2
  relationship_type: CAUSATIVE
  notes: >-
    LAMA2 at 6q22-q23 encodes the laminin alpha-2 chain. Biallelic loss of function is the sole
    established cause of this disease. Over 300 pathogenic variants are reported, and the allele
    class is prognostically meaningful: nonsense, frameshift and whole-exon deletion alleles
    dominate the congenital severe form, whereas missense and leaky splice alleles that leave
    residual protein cluster at the limb-girdle end. Variants affecting the C-terminal LG domains
    are additionally associated with brain malformation, which is mechanistically coherent
    because the LG module is the receptor-binding end of the molecule in both muscle and brain.
  evidence:
  - reference: PMID:7550355
    reference_title: "Mutations in the laminin alpha 2-chain gene (LAMA2) cause merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore investigated LAMA2 for the presence of disease-causing mutations in laminin alpha 2 chain-deficient CMD families and now report splice site and nonsense mutations in two families leading presumably to a truncated laminin alpha 2 protein."
    explanation: The report that established LAMA2 as the causal gene.
  - reference: PMID:32457577
    reference_title: "A Family of Laminin α2 Chain-Deficient Mouse Mutants: Advancing the Research on LAMA2-CMD."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "which result in a large clinical heterogeneity of the disease"
    explanation: Supports the link between the size of the LAMA2 allelic spectrum and the clinical heterogeneity described here.
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was a relation between gene variants affecting the laminin-α2 LG-domain and the presence of brain malformation (P = 0.016)."
    explanation: Establishes the LG-domain genotype correlation with cortical malformation recorded in these notes.
  case_fractions:
  - population: Han Chinese LAMA2-related muscular dystrophy cohort
    case_fraction_percent: 56.9
    cohort_size: 116
    notes: >-
      Share of congenital-form patients carrying a nonsense variant, contrasted with 21.4% in the
      limb-girdle subtype. Recorded as an allele-class share within the gene, not as a share of
      cases attributable to the gene, which is 100% by definition for a monogenic disease.
    evidence:
    - reference: PMID:34281576
      reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nonsense variants were more frequent in LAMA2-CMD (56.9%, 66/116) than in LGMDR23 (21.4%, 3/14), while missense disease-causing variants were more frequent in LGMDR23 (71.4%, 10/14) than in LAMA2-CMD (12.9%, 15/116)."
      explanation: Gives the nonsense-allele share in the congenital-form group recorded here.
diagnosis:
- name: LAMA2 molecular genetic testing
  presence: PRESENT
  description: >-
    Identification of biallelic pathogenic LAMA2 variants establishes the diagnosis.
    Next-generation sequencing has largely displaced the biopsy-first pathway, but copy-number
    analysis matters: single and multi-exon deletions account for a substantial minority of
    alleles and are missed by sequencing alone.
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of LAMA2 muscular dystrophy is established in a proband with suggestive findings and biallelic (homozygous or compound heterozygous) pathogenic variants in LAMA2 identified by molecular genetic testing."
    explanation: States the molecular diagnostic criterion.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next-generation sequencing (NGS) has greatly improved diagnostic abilities for LAMA2-RD, and the majority of patients with merosin deficiency carry recessive pathogenic variants in the LAMA2 gene."
    explanation: Supports the primacy of sequencing in the current diagnostic pathway.
- name: Muscle biopsy merosin immunostaining
  presence: PRESENT
  description: >-
    Absent or reduced laminin alpha-2 immunostaining on muscle, on a dystrophic background. It
    remains useful for grading complete versus partial deficiency, but the residual-protein
    reading is not reliable enough to predict phenotype in an individual patient, and skin biopsy
    can substitute where complete deficiency is suspected.
  evidence:
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the amount of merosin in muscle biopsy does not enable a clear prediction of clinical phenotype"
    explanation: States the prognostic limitation of the immunostain that this entry records.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Absence of laminin alpha 2 at the epidermal and adnexal basement membranes and intradermal sensory nerves can be demonstrated in skin biopsies, particularly in cases of complete laminin alpha 2 deficiency"
    explanation: Supports skin biopsy as an alternative demonstration of the protein deficiency.
- name: Brain MRI white matter signal
  presence: PRESENT
  description: >-
    Diffuse periventricular and subcortical T2 hyperintensity is close to universal beyond six
    months and is often the finding that redirects an undiagnosed floppy infant towards LAMA2.
    Below six months it may be absent, so a normal early MRI does not exclude the diagnosis.
    Re-reading the MRI specifically for cortical malformation is worthwhile: it is frequently
    missed on the initial report.
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Characteristic brain white matter (WM) hypointensity on T1 magnetic resonance imaging (MRI), and increased T2 signal in the periventricular and subcortical WM, are invariably observed in most patients older than 6 months"
    explanation: Establishes the MRI finding and its age threshold.
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "shows the importance of reviewing the brain MRI of patients with LAMA2-RD"
    explanation: Supports the recommendation to re-review the MRI for cortical malformation.
- name: Motor nerve conduction study
  presence: PRESENT
  description: >-
    Slowed motor conduction supports merosin deficiency over other congenital muscular
    dystrophies. It is supportive rather than decisive: some cohorts report normal studies, and
    it is not needed once genetic testing is available.
  evidence:
  - reference: PMID:8576559
    reference_title: "Demyelinating peripheral neuropathy in merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All but two of the 10 merosin-deficient cases had reduced motor nerve conduction, whereas all the merosin-positive cases had normal results."
    explanation: Establishes the discriminating value of the study between merosin-deficient and merosin-positive congenital muscular dystrophy.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological nerve conduction studies were done in three patients (two with motor and sensory measurements, one patient with only sensory measurement) and were reported as being normal."
    explanation: Records a cohort in which the studies were normal, which is why this test is described as supportive rather than decisive.
progression:
- phase: Neonatal and infantile
  notes: >-
    Onset is at or within days of birth in three quarters of congenital-form patients: profound
    hypotonia, weak cry, poor spontaneous movement, sometimes neonatal feeding or respiratory
    difficulty. The mouse data suggest the pathology is already well established by this point,
    with apoptotic fibres from postnatal day 1 and full dystrophic architecture by day 4, which
    is the argument for intervening as early as diagnosis permits.
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset symptoms in LAMA2-CMD were variable combinations of severe muscle weakness (n = 114), hypotonia (n = 114), weak cry (n = 48), neonatal feeding difficulty (n = 30), neonatal respiratory difficulty (n = 9)."
    explanation: Enumerates the presenting features of this phase in a 116-patient congenital-form cohort.
  - reference: PMID:31586140
    reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therapeutic tests in the dy3K/dy3K mouse model should therefore be initiated shortly after birth, but should also take into account timing and correlation between regenerative and pathogenic events."
    explanation: The authors' own inference about intervention timing from the perinatal onset of pathology.
- phase: Early and middle childhood
  notes: >-
    Motor milestones are attained late and incompletely: head control by about six months and
    independent sitting by about eleven months in most, but ambulation in fewer than a fifth.
    Contractures accumulate steadily and scoliosis appears in the non-ambulant, typically after
    six years. Motor regression, when it happens, clusters in the six-to-nine-year window and
    tracks the contracture phase rather than a separate loss of strength.
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor regression in LAMA2-CMD mainly occurred concurrently with rapid progression of contractures during 6-9 years old."
    explanation: Times the regression window and links it to contracture progression.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive scoliosis is common after 6 years of age, leading to a surgical correction in most patients."
    explanation: Times the onset of scoliosis and its surgical burden to this phase.
- phase: Adolescence and respiratory decline
  notes: >-
    The dominant events of the second decade are respiratory and nutritional. Forced vital
    capacity falls at about 2.9% predicted per year, nocturnal non-invasive ventilation is started
    at a median of around twelve years, and gastrostomy at around eleven. Spinal surgery is
    common. Cardiac abnormalities, mostly subclinical, are increasingly detected.
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two CD required nocturnal noninvasive ventilation (median age 11.7 years)."
    explanation: Dates the ventilatory transition that defines this phase.
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen CD and one PD patient required gastrostomy insertion for failure to thrive and/or unsafe swallow (median age 10.9 years)."
    explanation: Dates the nutritional transition in the same cohort.
- phase: Survival and cause of death
  notes: >-
    Mortality is driven by respiratory infection rather than by cardiac or neurological disease.
    About 30% of early-onset patients die within the first decade in one review's summary; in a
    tertiary cohort seven of 42 complete-deficiency patients died at a median of 12 years, and in
    a 130-patient national cohort 24 died, mostly of severe pneumonia. Survival into adulthood is
    routine in the partial-deficiency subtype.
  evidence:
  - reference: PMID:31308722
    reference_title: "Current understanding and treatment of cardiac and skeletal muscle pathology in laminin-α2 chain-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common cause of death in early-onset LAMA2 MD is respiratory tract infection, with 30% of them dying within the first decade of life."
    explanation: Gives both the leading cause of death and a first-decade mortality figure.
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven CD patients died at median age 12 years."
    explanation: Gives median age at death in a well-characterised complete-deficiency cohort.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying therapy, so management is anticipatory surveillance plus
    intervention at defined thresholds, delivered by a coordinated team. The surveillance list is
    long because the complications are: nutrition and swallow safety, neurologic status,
    pulmonary function, cognition and education, mobility, cardiac rhythm and function, vision,
    and, newly, bone quality.
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is recommended that multidisciplinary care be provided by specialists in neurology, gastroenterology, nutrition, orthopedics, occupational and physical therapy, speech and language therapy, education, psychiatry, pulmonary medicine, cardiology, ophthalmology, and social work."
    explanation: GeneReviews states the multidisciplinary management recommendation this treatment records.
  - reference: PMID:37476021
    reference_title: "LAMA2-Related Muscular Dystrophy Across the Life Span: A Cross-sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the results of this cross-sectional study and current standards of care for congenital muscular dystrophies, we advise routine cardiorespiratory follow-up and optimization of bone quality."
    explanation: Adds the cardiorespiratory and bone-health surveillance elements to the standard package.
- name: Non-Invasive Ventilation
  description: >-
    Nocturnal non-invasive ventilation for restrictive respiratory failure, started at a median
    of around twelve years in the complete-deficiency form. Long-term invasive ventilation or
    tracheostomy is uncommon in paediatric practice; invasive support is generally reserved for
    short periods during intercurrent infection.
  treatment_term:
    preferred_term: nocturnal non-invasive ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Progressive Weakness, Contracture and Restrictive Respiratory Failure
    treatment_effect: BYPASSES
    description: >-
      Ventilatory support substitutes for the failing respiratory pump rather than acting on the
      muscle lesion, and it does not slow the decline in vital capacity.
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two CD required nocturnal noninvasive ventilation (median age 11.7 years)."
    explanation: Documents the use and timing of nocturnal non-invasive ventilation in this population.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While invasive ventilation might become necessary for short periods and typically during times of respiratory infections, long-term use of invasive ventilation or use of ventilation via a tracheostomy is rare in pediatric LAMA2-RD patients."
    explanation: Supports the preference for non-invasive over invasive long-term support.
- name: Gastrostomy Feeding
  description: >-
    Gastrostomy for failure to thrive or unsafe swallow, required by roughly 40% of
    complete-deficiency patients at a median of about eleven years. It secures the airway from
    aspiration and simplifies caloric delivery, but it does not reliably normalise weight: most
    tube-fed patients in one registry remained below the third BMI centile.
  treatment_term:
    preferred_term: gastrostomy tube placement
    term:
      id: NCIT:C157864
      label: Gastrostomy Tube Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen CD and one PD patient required gastrostomy insertion for failure to thrive and/or unsafe swallow (median age 10.9 years)."
    explanation: States the indication, frequency and timing of gastrostomy.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our cohort 9/18 or 64% of the CMD patients had a BMI < P3, even if they had a feeding tube."
    explanation: Supports the caveat that tube feeding does not reliably correct undernutrition.
- name: Physical Therapy and Contracture Management
  description: >-
    Stretching, splinting, orthoses and positioning to slow contracture and preserve what function
    exists. Given that contracture is driven by early fibrogenesis and accumulates linearly, this
    is a rate-limiting intervention rather than a preventive one.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Endomysial Fibrosis and Replacement of Muscle
    treatment_effect: MODULATES
    description: >-
      Mechanical stretching opposes the shortening produced by fibrotic replacement without
      addressing the matrix deposition itself.
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is recommended that multidisciplinary care be provided by specialists in neurology, gastroenterology, nutrition, orthopedics, occupational and physical therapy, speech and language therapy, education, psychiatry, pulmonary medicine, cardiology, ophthalmology, and social work."
    explanation: GeneReviews includes physical and occupational therapy in the recommended management team.
- name: Scoliosis Surgery
  description: >-
    Posterior spinal instrumentation and fusion for progressive scoliosis, needed by a
    substantial minority of non-ambulant patients: nine of 33 with scoliosis in one cohort and
    five of ten in another. It is a seating and comfort intervention as much as a respiratory one.
  treatment_term:
    preferred_term: spinal fusion for neuromuscular scoliosis
    term:
      id: NCIT:C157986
      label: Spinal Fusion
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-two CD and one PD patient developed scoliosis, nine underwent spinal surgery."
    explanation: Gives the proportion of scoliotic patients proceeding to surgery.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our cohort five out of ten patients with CMD needed a surgical intervention for their severe scoliosis."
    explanation: Independent cohort corroboration of the surgical rate.
- name: Antiepileptic Drug Therapy
  description: >-
    Seizures in this disease are usually controlled with first-line antiepileptic drugs where
    there is no underlying cortical anomaly. Where a cortical malformation is present, drug
    resistance is reported, so the imaging finding has direct therapeutic implications.
  treatment_term:
    preferred_term: antiepileptic drug therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy should be monitored for and usually can be controlled with first-line antiepileptic drugs."
    explanation: States the recommendation and the expected response.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One had continuous spike-waves during sleep (CSWS) and one had drug-resistant frequent focal seizures with impaired awareness (cortical malformation in one patient)."
    explanation: Documents the drug-resistant subgroup associated with cortical malformation.
- name: Genetic Counseling
  description: >-
    Autosomal recessive counselling with a 25% recurrence risk per pregnancy. Once the familial
    variants are known, carrier testing, prenatal and preimplantation genetic testing become
    available, which matters in a disease with no treatment and a severe natural history.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Once the LAMA2 pathogenic variants have been identified in an affected family member, carrier testing for at-risk relatives and prenatal and preimplantation genetic testing are possible."
    explanation: States the reproductive options this counselling delivers.
- name: Omigapil
  description: >-
    An anti-apoptotic small molecule that inhibits the GAPDH-Siah1-mediated death pathway. It is
    the only therapeutic small molecule to have reached a clinical trial in this disease. In dyW
    and dy2J mice it inhibits muscle apoptosis, reduces weight loss and skeletal deformity,
    increases locomotor activity and delays mortality. The human study (CALLISTO, NCT01805024)
    was a phase 1 open-label pharmacokinetic and safety study over twelve weeks in 20 patients
    with LAMA2- or COL6-related dystrophy; it met its primary endpoint, but it was neither
    designed nor powered to show clinical benefit, and none was observed. This is an unapproved
    investigational agent and is recorded here as the state of the therapeutic pipeline, not as
    available care.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omigapil
      term:
        id: NCIT:C97362
        label: Omigapil
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    treatment_effect: INHIBITS
    description: >-
      Inhibiting GAPDH-Siah1-mediated apoptosis reduces myofibre death in the mouse. Whether this
      translates to humans is unresolved: the only human trial was a pharmacokinetic study.
    evidence:
    - reference: PMID:19759319
      reference_title: "Omigapil ameliorates the pathology of muscle dystrophy caused by laminin-alpha2 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Specifically, we demonstrate that treatment with omigapil inhibits apoptosis in muscle, reduces body weight loss and skeletal deformation, increases locomotive activity, and protects from early mortality."
      explanation: Demonstrates the anti-apoptotic effect on the target node and the downstream functional benefit in the mouse.
  evidence:
  - reference: PMID:19759319
    reference_title: "Omigapil ameliorates the pathology of muscle dystrophy caused by laminin-alpha2 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate that the proapoptotic glyceraldehyde-3-phosphate dehydrogenase (GAPDH)-Siah1-CBP/p300-p53 pathway is activated in a mouse model for MDC1A."
    explanation: Establishes that the pathway omigapil inhibits is actually engaged in the disease model.
  - reference: PMID:38915423
    reference_title: "Phase 1 Open-Label Study of Omigapil in Patients With LAMA2- or COL6-Related Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In general, omigapil was safe and well tolerated."
    explanation: The safety result of the only human trial.
  - reference: PMID:38915423
    reference_title: "Phase 1 Open-Label Study of Omigapil in Patients With LAMA2- or COL6-Related Dystrophy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No consistent changes were seen in the disease-relevant clinical assessments during the duration of the study."
    explanation: Recorded as REFUTE against any reading of this treatment as clinically effective. The study was a phase 1 pharmacokinetic and safety trial, so the absence of change is uninformative about efficacy rather than evidence against it; the item exists to stop the preclinical result being read as a human one.
  notes: >-
    Investigational only. No regulatory approval exists for omigapil in any indication.
- name: Avoidance of Succinylcholine and Statins
  description: >-
    A drug-safety measure rather than a therapy, and the one item on this list that changes
    management in an emergency department. Succinylcholine during anaesthetic induction risks
    hyperkalaemia and cardiac conduction abnormalities in this population; statins risk further
    muscle damage. Both should be recorded on an alert document.
  treatment_term:
    preferred_term: avoidance of contraindicated agents
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Succinylcholine in induction of anesthesia because of risk of hyperkalemia and cardiac conduction abnormalities; statins, cholesterol-lowering medications, because of the risk of muscle damage."
    explanation: The GeneReviews Agents/Circumstances to Avoid list, quoted verbatim.
clinical_trials:
- name: NCT01805024
  phase: PHASE_I
  status: COMPLETED
  description: >-
    CALLISTO, an ascending multiple-dose cohort study of omigapil in children and adolescents
    with congenital muscular dystrophy, establishing pharmacokinetics at three dose levels with
    safety and tolerability assessment. Twenty patients (ten LAMA2-related, ten COL6-related)
    were enrolled at the NIH. The trial met its primary pharmacokinetic endpoint; disease-relevant
    clinical assessments showed no consistent change over the twelve-week exposure, which the
    design could not have detected.
  target_phenotypes:
  - preferred_term: Axial muscle weakness
    term:
      id: HP:0003327
      label: Axial muscle weakness
  - preferred_term: Restrictive ventilatory defect
    term:
      id: HP:0002091
      label: Restrictive ventilatory defect
  evidence:
  - reference: clinicaltrials:NCT01805024
    reference_title: "Congenital Muscular Dystrophy Ascending Multiple Dose Cohort Study Analyzing Pharmacokinetics at Three Dose Levels In Children and Adolescents With Assessment of Safety and Tolerability of Omigapil (CALLISTO)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of the study is to establish the pharmacokinetic profile of omigapil in paediatric and adolescent patients with CMD and to evaluate the safety and tolerability of omigapil."
    explanation: The registry record's own statement of the trial's objective.
  - reference: PMID:38915423
    reference_title: "Phase 1 Open-Label Study of Omigapil in Patients With LAMA2- or COL6-Related Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study represents the thus far only clinical trial of a therapeutic small molecule for LAMA2-RD and COL6-RD, completed with an adaptive trial design to arrive at dose adjustments."
    explanation: Establishes the trial's standing as the only interventional small-molecule study in this disease.
animal_models:
- name: dy3K/dy3K laminin alpha2 null mouse
  species: Mouse
  genotype: Lama2 targeted null (dy3K), homozygous
  publication: PMID:31586140
  description: >-
    The complete-null mouse and the most severe of the family, dying by about three weeks. Its
    value is temporal resolution rather than fidelity of course: it is the model in which the
    sequence of early events has been mapped, showing apoptosis at postnatal day 1, full
    dystrophic architecture with inflammation and matrix deposition by day 4, peak deterioration
    at day 7, and severe involvement of the masticatory muscles that plausibly underlies the
    malnutrition and death.
  evidence:
  - reference: PMID:31586140
    reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we unveil the first pathogenic events and characterise the disease development in a mouse model for LAMA2-CMD (dy3K/dy3K), by analysing muscles at perinatal, neonatal and postnatal stages."
    explanation: Establishes the model and the developmental-timing question it was used to answer.
  modeled_mechanisms:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the apoptotic and necrotic myofibre death of the human disease and dates its
      onset to the first postnatal day.
    limitations: >-
      The murine course is compressed into three weeks against a human course of decades, so the
      model reports the sequence of events faithfully but not their timescale. The masticatory
      involvement that dominates mortality here has no clear human counterpart as a cause of
      death.
    readouts:
    - name: Apoptotic muscle fibres at postnatal day 1
      target: Myofibre Degeneration, Necrosis and Apoptosis
      direction: INCREASED
      interpretation: Dates the onset of the apoptotic component of fibre loss.
      evidence:
      - reference: PMID:31586140
        reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that apoptotic muscle fibres were present as early as postnatal day 1."
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:31586140
      reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Other typical dystrophic hallmarks (muscle degeneration, inflammation, and extensive production of the extracellular matrix proteins) were clearly evident already at postnatal day 4, and the highest degree of muscle deterioration was reached by day 7."
      explanation: Supports treating this model as informative for the degeneration node by showing it reproduces the full dystrophic picture.
  - target: Dysregulated Muscle Proteostasis and Autophagy
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Autophagy-related gene expression is raised in dy3K/dy3K muscle, and the same upregulation
      was confirmed in human MDC1A muscle, so the model is not merely analogous here.
    limitations: >-
      The therapeutic inference rests on systemic 3-methyladenine, a non-selective
      phosphoinositide 3-kinase inhibitor, so the rescue is not a clean test of autophagy alone.
    readouts:
    - name: Autophagy-related gene expression in dystrophic muscle
      target: Dysregulated Muscle Proteostasis and Autophagy
      direction: INCREASED
      interpretation: Molecular correlate of the enhanced autophagic flux this node asserts.
      evidence:
      - reference: PMID:21920942
        reference_title: "Autophagy is increased in laminin α2 chain-deficient muscle and its inhibition improves muscle morphology in a mouse model of MDC1A."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Using the dy(3K)/dy(3K) mouse model of laminin α2 chain deficiency and MDC1A patient muscle, we show here that expression of autophagy-related genes is upregulated in laminin α2 chain-deficient muscle."
        explanation: Reports the measurement in both mouse and human muscle.
    evidence:
    - reference: PMID:21920942
      reference_title: "Autophagy is increased in laminin α2 chain-deficient muscle and its inhibition improves muscle morphology in a mouse model of MDC1A."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, we found that autophagy inhibition significantly improves the dystrophic dy(3K)/dy(3K) phenotype."
      explanation: The intervention result that makes this model informative for the autophagy node.
- name: dyW/dyW laminin alpha2-deficient mouse
  species: Mouse
  genotype: Lama2 targeted mutation (dyW), homozygous, expressing a truncated laminin alpha2
  publication: PMID:15578095
  description: >-
    The workhorse preclinical model, expressing a small amount of truncated protein and surviving
    long enough for intervention studies. Most of the therapeutic hypotheses in this disease were
    tested here first: Bax deletion and Bcl-2 overexpression, omigapil, integrin alpha-7
    overexpression, and the mini-agrin linker. That four mechanistically unrelated interventions
    each extend survival in the same animal is the strongest single argument that the downstream
    cascade is attackable.
  evidence:
  - reference: PMID:15578095
    reference_title: "Inhibition of apoptosis improves outcome in a model of congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To examine the significance of apoptosis in CMD1A pathogenesis, we determined whether pathogenesis in laminin-alpha2-deficient (Lama2(-/-)) mice could be ameliorated by inhibiting apoptosis"
    explanation: Establishes the model and the interventional use it is cited for here.
  modeled_mechanisms:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Apoptotic fibre death is present and is causally load-bearing: removing Bax or
      overexpressing Bcl-2 each produce a severalfold lifespan increase, and Bax inactivation also
      improves growth, histology and contractures.
    limitations: >-
      dyW mice express a truncated laminin alpha2 fragment rather than being a complete null, so
      the genotype corresponds to a severe hypomorph rather than to the biallelic-null human
      genotype it is usually taken to model.
    readouts:
    - name: Lifespan under Bax inactivation or Bcl-2 overexpression
      target: Myofibre Degeneration, Necrosis and Apoptosis
      direction: RESTORED
      interpretation: Rescue readout establishing apoptosis as a causal contributor rather than an epiphenomenon.
      evidence:
      - reference: PMID:15578095
        reference_title: "Inhibition of apoptosis improves outcome in a model of congenital muscular dystrophy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that both of these genetic interventions produced a several-fold increase in the lifespan of Lama2(-/-) mice."
        explanation: Reports the survival measurement behind this readout.
    evidence:
    - reference: PMID:15578095
      reference_title: "Inhibition of apoptosis improves outcome in a model of congenital muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Bax inactivation also improved postnatal growth rate and myofiber histology and decreased fixed contractures of Lama2(-/-) mice."
      explanation: Shows the rescue extends to histology and contracture, not survival alone.
  - target: Failure of Basal Lamina to Sarcolemma Receptor Coupling
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Used as the test bed for restoring the coupling directly. Transgenic mini-agrin, which binds
      dystroglycan but not integrin alpha-7-beta-1, and a perlecan-derived chimeric protein each
      ameliorate the disease, including when expression is started late. Separately, transgenic
      integrin alpha-7 overexpression restores sarcolemmal alpha-7-beta-1 and improves pathology
      and life expectancy. Together these attack the two arms of the lost linkage independently.
    limitations: >-
      Both are transgenic overexpression experiments in the mouse, not deliverable therapies, and
      neither restores laminin-211 itself. The mini-agrin construct rebuilds only the dystroglycan
      arm and the integrin transgene only the integrin arm, so neither is a complete substitution.
    readouts:
    - name: Lifespan and health under mini-agrin or perlecan-chimera expression
      target: Failure of Basal Lamina to Sarcolemma Receptor Coupling
      direction: RESTORED
      interpretation: Rescue by re-linking the basement membrane to dystroglycan, which is the specific coupling this node reports as lost.
      evidence:
      - reference: PMID:17389231
        reference_title: "Linker molecules between laminins and dystroglycan ameliorate laminin-alpha2-deficient muscular dystrophy at all disease stages."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Now we show that late-onset expression of mini-agrin still prolongs life span and improves overall health, although not to the same extent as early expression."
        explanation: Reports the survival and health measurement behind this readout, including its dependence on timing.
    evidence:
    - reference: PMID:17389231
      reference_title: "Linker molecules between laminins and dystroglycan ameliorate laminin-alpha2-deficient muscular dystrophy at all disease stages."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These experiments are conceptual proof that linking the basement membrane to dystroglycan by specifically designed molecules or by endogenous ligands, could be a means to counteract MDC1A at a progressed stage of the disease, and thus opens new possibilities for the development of treatment options for this muscular dystrophy."
      explanation: The authors' own statement that the rescue works by restoring the matrix-to-dystroglycan link, which is what makes this model informative for the coupling node.
    - reference: PMID:21652631
      reference_title: "Transgenic overexpression of the α7 integrin reduces muscle pathology and improves viability in the dy(W) mouse model of merosin-deficient congenital muscular dystrophy type 1A."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Enhanced expression of the α7 integrin restored sarcolemmal localization of the α7β1 integrin to laminin-α2-deficient myofibers, changed the composition of the muscle extracellular matrix, reduced muscle pathology, maintained muscle strength and function and improved the life expectancy of dy(W⁻/⁻) mice."
      explanation: Establishes the integrin arm of the same rescue, independently of the dystroglycan arm.
- name: dy2J/dy2J splice-mutant mouse
  species: Mouse
  genotype: Lama2 dy2J splice-site mutation, homozygous
  publication: PMID:31341277
  description: >-
    A partial-deficiency model, carrying a splice mutation that yields a truncated but partly
    functional protein, with a milder and longer course. It is the natural model for the
    limb-girdle subtype and the one in which reversibility has been shown: CRISPR-dCas9
    upregulation of the paralogous Lama1 improved and partly reversed established fibrosis and
    hindlimb paralysis when started in symptomatic animals, against the prior expectation that
    fibrotic change is irreversible.
  evidence:
  - reference: PMID:31341277
    reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We modulate expression of Lama1 in the dy2j/dy2j mouse model of MDC1A using an adeno-associated virus (AAV9) carrying a catalytically inactive Cas9 (dCas9), VP64 transactivators and single-guide RNAs that target the Lama1 promoter."
    explanation: Establishes the model and the intervention it was used to test.
  modeled_mechanisms:
  - target: Endomysial Fibrosis and Replacement of Muscle
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Upregulating the paralogous laminin-alpha1 prevented fibrosis and paralysis when given
      pre-symptomatically, and improved and partly reversed both when given after they were
      established.
    limitations: >-
      The rescue is by a paralogous laminin substituting for the missing one, not by restoring
      laminin-alpha2, so it tests the reversibility of the downstream fibrosis rather than the
      correction of the primary lesion. dy2J is a partial-deficiency allele, so the result speaks
      most directly to the milder end of the human spectrum. A companion study in a
      complete-deletion model found high-dose mortality and non-sustained expression, which the
      dy2J experiment did not surface.
    readouts:
    - name: Muscle fibrosis and hindlimb paralysis after Lama1 upregulation
      target: Endomysial Fibrosis and Replacement of Muscle
      direction: RESTORED
      interpretation: Reversal of established fibrotic change, which is the claim this link records.
      evidence:
      - reference: PMID:31341277
        reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, we show that dystrophic features and disease progression were improved and reversed when the treatment was initiated in symptomatic dy2j/dy2j mice with apparent hindlimb paralysis and muscle fibrosis."
        explanation: Reports the reversal measurement behind this readout.
    evidence:
    - reference: PMID:31341277
      reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "When pre-symptomatic mice were treated, Lama1 was upregulated in skeletal muscles and peripheral nerves, which prevented muscle fibrosis and paralysis."
      explanation: Establishes the preventive arm of the rescue alongside the reversal arm.
    - reference: PMID:38777118
      reference_title: "Lama1 upregulation prolongs the lifespan of the dy(H)/dy(H) mouse model of LAMA2-related congenital muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, we reveal the limitations of LAMA1 upregulation, including high-dose mortality and non-sustained expression, which require further optimization in future studies."
      explanation: The independent limitation recorded against this strategy, from a different Lama2 model.
- name: lama2 mutant zebrafish
  species: Zebrafish
  genotype: lama2 loss of function
  publication: PMID:31754462
  description: >-
    An optically accessible model whose contribution is direct observation rather than
    therapeutics. Live tracking of individual fibres showed that detachment is not immediately
    lethal, since detached fibres retain sarcolemmal integrity and attempt reattachment,
    extension and fusion before dying, which reframed the disease as having a window in which a
    detached fibre can be re-functionalised.
  evidence:
  - reference: PMID:31754462
    reference_title: "Cellular rescue in a zebrafish model of congenital muscular dystrophy type 1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a process we show can be achieved by muscle specific or systemic Laminin delivery"
    explanation: States the rescue the model demonstrates, which is what establishes it as an interventional as well as an observational system.
  modeled_mechanisms:
  - target: Contraction-Induced Myofibre Detachment and Mechanical Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces myofibre detachment from the basal lamina and, uniquely, allows it to be watched
      in a living animal fibre by fibre.
    limitations: >-
      Zebrafish larval muscle is anatomically and mechanically unlike mammalian limb muscle, and
      the observations are made over hours in a larva rather than over years in a child, so the
      delay between detachment and death cannot be assumed to have the same duration in humans.
    readouts:
    - name: Sarcolemmal integrity and remodelling of detached fibres
      target: Contraction-Induced Myofibre Detachment and Mechanical Injury
      direction: ALTERED
      interpretation: Direct observation of the detachment event and of what the fibre does afterwards.
      evidence:
      - reference: PMID:31754462
        reference_title: "Cellular rescue in a zebrafish model of congenital muscular dystrophy type 1A."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here we show, via live tracking of individual muscle fibres, that dystrophic myofibres in the zebrafish model of MDC1A maintain sarcolemmal integrity and undergo dynamic remodelling behaviours post detachment, including focal sarcolemmal reattachment, cell extension and hyper-fusion with surrounding myoblasts."
        explanation: Reports the live-imaging measurement behind this readout.

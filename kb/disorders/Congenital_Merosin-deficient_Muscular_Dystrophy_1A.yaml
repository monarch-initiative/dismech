- name: Ophthalmoparesis
  category: Ophthalmologic
  frequency: FREQUENT
  description: Progressive partial limitation of extraocular movements, particularly upward
    gaze, may become evident from early childhood. Eighteen of 42 complete-deficiency UK patients
    had ophthalmoparesis; complete paralysis is not established.
  phenotype_term:
    preferred_term: Ophthalmoparesis
    term:
      id: HP:0000597
      label: Ophthalmoparesis
  evidence:

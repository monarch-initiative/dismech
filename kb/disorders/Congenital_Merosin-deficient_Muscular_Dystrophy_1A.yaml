epidemiology:
- name: Share of congenital muscular dystrophy
  description: >-
    LAMA2-related congenital muscular dystrophy is one of the most common congenital muscular
    dystrophies worldwide, though the share varies by population: around a third to a half of
    congenital muscular dystrophy in the sources aggregated by one large cohort study, roughly
    30% in Europe against 6% in Japan in another review's figures.
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAMA2-CMD is one of the most common congenital muscular dystrophies (CMDs) in the world, accounting for 36.4%-48% of CMD patients"
    explanation: Gives the aggregate share of congenital muscular dystrophy.
  - reference: PMID:31308722
    reference_title: "Current understanding and treatment of cardiac and skeletal muscle pathology in laminin-α2 chain-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Early-onset LAMA2 MD is the most common form of congenital muscular dystrophy (CMD) globally, affecting about 30% of the CMD patients in Europe and 6% of the patients in Japan."
    explanation: Gives the between-population variation in that share.
- name: Geographic variation in reported prevalence
  description: >-
    Published prevalence estimates for LAMA2-related dystrophy span nearly twenty-fold between
    countries, from 0.14 to 2.5 per 100,000. This is far more likely to reflect ascertainment and
    registry completeness than a real biological gradient, and it is the reason this entry records
    a coarse prevalence band rather than treating any point estimate as authoritative.
  evidence:
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reported prevalence varies widely between 0.14 : 100 000 (Italy) and 2.5 : 100 000 (Sweden)"
    explanation: States the range of published estimates that motivates the caution recorded here.
- name: Share of limb-girdle muscular dystrophy
  description: >-
    At the milder end, partial merosin deficiency (LGMDR23) is a small but real share of the
    limb-girdle population, 2.3% in a Danish series, which is the practical argument for
    checking merosin status in unexplained limb-girdle weakness with white-matter change.
  evidence:
  - reference: PMID:31308722
    reference_title: "Current understanding and treatment of cardiac and skeletal muscle pathology in laminin-α2 chain-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One study in Denmark revealed that late-onset LAMA2 MD accounts for 2.3% of the limb girdle-type muscular dystrophy cases."
    explanation: Gives the share of limb-girdle muscular dystrophy attributable to partial merosin deficiency.
differential_diagnoses:
- name: Merosin-positive congenital muscular dystrophy
  description: >-
    The historical first fork: congenital muscular dystrophy with preserved merosin staining.
    Motor nerve conduction is normal and brain white matter is typically normal, so the two
    supportive tests that are abnormal in MDC1A are the ones that separate them.
  evidence:
  - reference: PMID:8576559
    reference_title: "Demyelinating peripheral neuropathy in merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All but two of the 10 merosin-deficient cases had reduced motor nerve conduction, whereas all the merosin-positive cases had normal results."
    explanation: Shows the electrophysiological separation between the merosin-deficient and merosin-positive groups.
- name: Dystroglycanopathies with brain malformation
  description: >-
    Fukuyama congenital muscular dystrophy, muscle-eye-brain disease and Walker-Warburg syndrome
    also produce congenital muscular dystrophy with cobblestone cortex, and they converge on the
    same pial basement membrane failure, but from the receptor side, through defective
    alpha-dystroglycan glycosylation, rather than from the ligand side. MDC1A was classically
    distinguished as the congenital muscular dystrophy without structural CNS involvement, which
    is now known to be only mostly true.
  evidence:
  - reference: PMID:32827036
    reference_title: "Cobblestone Malformation in LAMA2 Congenital Muscular Dystrophy (MDC1A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is the most common cause of what was originally called classical, or occidental, CMD without structural involvement of the central nervous system (CNS) in distinction to CMDs with CNS involvement (Fukuyama CMD, muscle-eye-brain disease, and Walker-Warburg syndrome)"
    explanation: States the classical nosological distinction and names the dystroglycanopathies it separates MDC1A from.
- name: Limb-girdle muscular dystrophies
  description: >-
    For the partial-deficiency subtype the differential is the limb-girdle group generally.
    Partial merosin deficiency has been misdiagnosed as Duchenne and as unclassified limb-girdle
    dystrophy for years before slowed nerve conduction and white-matter change on MRI redirected
    the workup, which is the practical reason to check merosin in that setting.
  evidence:
  - reference: PMID:9829280
    reference_title: "Laminin alpha 2-chain gene mutations in two siblings presenting with limb-girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Partial laminin alpha 2 deficiency should be considered in the differential diagnosis of limb-girdle muscular dystrophy."
    explanation: States the recommendation this differential records.
  - reference: PMID:9131648
    reference_title: "Late onset muscular dystrophy with cerebral white matter changes due to partial merosin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Merosin status should be assessed in patients with late-onset limb girdle muscular dystrophy."
    explanation: Independent statement of the same recommendation from a separate late-onset family.
notes: >-
  Scope and lumping. This entry covers the whole LAMA2 allelic series, with complete deficiency
  (the congenital severe form the MONDO term names) and partial deficiency (LGMDR23) curated as
  `has_subtypes` rather than as separate entries. They share one gene, one protein, one
  mechanism and one pathograph, differing in the dose of residual laminin alpha-2, so splitting
  them would duplicate the entire mechanism section to express a quantitative difference. Where a
  statement in this file is not marked with a `subtype`, read it as describing complete
  deficiency, which is the phenotype the MONDO term names and the one the literature calls MDC1A.
  Note that `stubs/Muscular_Dystrophy_Limb-girdle_Autosomal_Recessive_23.yaml` remains an open
  stub at the time of writing; whoever picks it up should read it against this entry's partial
  deficiency subtype before creating a second entry for the same allelic series.

  Where the residual-protein rule breaks. The complete-versus-partial rule is a strong tendency,
  not a law, and the literature contains its own counterexamples. Complete laminin alpha-2
  deficiency with a mild course has been reported, including a homozygous stop-codon patient
  described as having a mild evolution; and merosin quantity on biopsy is explicitly stated not
  to predict phenotype in an individual. Seizures cut against the gradient outright, being
  reported in 35.7% of the milder LGMDR23 group against 9.5% of the congenital group in the same
  cohort. So do not treat the biopsy stain as prognostic, and do not assume the CNS features
  scale with the muscle ones.

  Two independent CNS lesions, not one. The near-universal white-matter signal change and the
  minority cortical malformation have different mechanisms, different frequencies and different
  clinical weight, and they are curated as separate pathophysiology branches for that reason. The
  white-matter change is attributed to increased water content following loss of laminin from
  perivascular basement membranes; it is essentially always present and essentially always silent.
  The cortical malformation follows a focal breach of the glia limitans, is present in around a
  fifth, and is what carries the epilepsy and intellectual disability. Conflating them would
  predict cognitive impairment in nearly every patient, which is the opposite of what is observed.

  Module conformance. Three conformances are declared. `fibrotic_response#Excessive ECM
  Deposition` on the endomysial fibrosis node is straightforward.
  `pial_basement_membrane_radial_glial_endfoot_failure#Pial Basement Membrane Assembly Failure` is
  the interesting one: that module's other conformers reach the same pial boundary failure through
  defective alpha-dystroglycan glycosylation, and this entry reaches it from the opposite side of
  the same bond by removing the laminin ligand, which is exactly the generic-to-specific
  substitution conformance is for. `schwann_cell_myelin_maintenance#Dysmyelination and Segmental
  Demyelination of Peripheral Nerve` is declared on the outcome node rather than the trigger node,
  and the reason is recorded in that node's own `notes`.

  What is not curated here. Muscle MRI shows a characteristic pattern with relative sparing of
  sartorius and gracilis, and muscle ultrasound echogenicity is proposed as an outcome measure;
  neither is recorded as an `imaging_findings` block because the entry's diagnostic weight sits on
  brain MRI and genetic testing. Serum and urine biomarker work exists but is exploratory and has
  no established analyte, so no `biochemical` block is curated rather than one built on a
  candidate. No `environmental` entry is curated: this is a fully penetrant Mendelian disorder and
  no exposure has been reported to modify it.

  Therapeutic landscape. Nothing is approved. The preclinical picture is unusual in that several
  mechanistically distinct interventions, namely Bcl-2 family manipulation, GAPDH-Siah1
  inhibition, autophagy inhibition, engineered dystroglycan linkers, integrin alpha-7
  overexpression, and laminin-alpha1 upregulation, each extend survival in laminin-alpha2-deficient
  mice. Read positively, that says the cascade is attackable at many points. Read cautiously, it
  says the mouse is easy to rescue, and the single completed human trial was a phase 1
  pharmacokinetic study that showed no clinical change over twelve weeks and was not designed to.

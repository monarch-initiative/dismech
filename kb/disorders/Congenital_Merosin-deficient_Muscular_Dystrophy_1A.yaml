- name: Intellectual disability
  category: Neurologic
  frequency: OCCASIONAL
  description: Intellectual disability affects a minority and is associated with cortical malformations
    in some cohorts. The Brazilian series reported 8/52 affected, including seven nonambulant
    patients and one ambulant patient with autism. Normal cognition is compatible with marked
    white-matter signal change or even cobblestone pathology; not every cohort used formal cognitive
    testing.

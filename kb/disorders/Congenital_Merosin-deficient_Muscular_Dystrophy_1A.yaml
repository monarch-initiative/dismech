    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "10 patients (19.2%) presented with cortical malformations (polymicrogyria, lissencephaly-pachygyria, and cobblestone)"

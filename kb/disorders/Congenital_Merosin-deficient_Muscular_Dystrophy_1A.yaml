    reference_title: 'LAMA2-related muscular dystrophy: Natural history of a large pediatric
      cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Facial weakness and ophtalmoparesis were observed in 21 and 18 CD patients, respectively,
      but in no PD.
    explanation: Direct complete-deficiency cohort evidence supports partial ocular paresis
      and the FREQUENT band.

name: Congenital Merosin-deficient Muscular Dystrophy 1A
creation_date: "2026-09-05T18:30:00Z"
category: Mendelian
description: 'MDC1A is the severe congenital end of LAMA2-related muscular dystrophy. Biallelic
  pathogenic LAMA2 variants impair laminin alpha-2, a component of laminin-211 in muscle, peripheral
  nerve and CNS basement membranes. Loss of basal-lamina anchorage and laminin-dependent signalling
  makes muscle fibres vulnerable to injury; degeneration, altered protein turnover, impaired
  repair and fibrosis contribute to weakness and contractures. Human infant muscle histology
  demonstrates early degeneration, while the timing and contributions of apoptosis, inflammation
  and autophagy are most directly tested in animal and cell models. Regeneration is impaired
  rather than universally absent, and some injured fibres survive or recover in models.

  Severe early hypotonia and axial/proximal weakness delay motor development and usually prevent
  independent walking. Progressive contractures, spinal deformity, respiratory muscle weakness
  and impaired feeding add substantial morbidity. Clinical cohorts distinguish the congenital
  phenotype from complete merosin deficiency: these categories overlap strongly but are not
  interchangeable. Partial deficiency can accompany an early severe phenotype, and occasional
  patients classified as completely deficient walk independently. Young children may gain skills
  before later functional decline.

  Peripheral myelin abnormalities and motor conduction slowing are variable and generally contribute
  less to human weakness than in mouse models. White-matter MRI signal changes are very frequent
  after infancy and may appear by three months. Increased white-matter water content is supported
  by human MR spectroscopy; a vascular basement-membrane mechanism remains a hypothesis, and
  diffuse human demyelination is not established by the MRI appearance. Cortical neuronal migration
  abnormalities can contribute to seizures and intellectual disability in a subset, but neither
  clinical consequence is inevitable and seizures can occur without a visible cortical malformation.

  This entry focuses on congenital MDC1A, with explicitly identified observations from the broader
  partial-deficiency and limb-girdle LAMA2 spectrum. Residual protein is associated with severity
  but does not reliably predict an individual''s trajectory. Care addresses respiratory, nutritional,
  orthopedic and cardiac complications; preclinical therapeutic effects and the phase 1 omigapil
  safety study do not establish clinical disease-modifying efficacy.'

- name: Increased Cerebral White Matter Water Content
  biological_scale: TISSUE
  description: MR spectroscopy and diffusion imaging in nine children with merosin-deficient
    CMD support increased free water in affected cerebral white matter. A leaky perivascular
    basement membrane is a proposed upstream explanation; the MRI signal alone does not demonstrate
    demyelination. Human autopsy can show marked MRI abnormalities without white-matter histopathology.

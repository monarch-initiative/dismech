    explanation: Documents occipital polymicrogyria with focal seizures in a patient with a homozygous LAMA2 stop-codon variant.
- name: Seizures
  category: Neurologic
  frequency: OCCASIONAL
  description: Seizures include focal epilepsy and febrile seizures. In the Chinese clinical
    congenital group 9/116 had epilepsy and two had febrile seizures, yielding the reported
    11/116 (9.5%) seizure figure; the LGMDR23 group had three epilepsy and two febrile-seizure

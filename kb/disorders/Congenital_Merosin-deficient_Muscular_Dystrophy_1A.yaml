- name: Loss of Myocardial Laminin-211 Support
  biological_scale: TISSUE
  description: Laminin-211 is a myocardial extracellular-matrix component. Its deficiency is
    a proposed contributor to the ventricular dysfunction observed in some patients, but cardiac
    model phenotypes vary and the human pathway has not been directly established.

  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Dysmyelination and Segmental Demyelination of Peripheral Nerve"
  description: Peripheral myelin abnormalities accompany some cases, with variable motor conduction
    slowing. A mildly affected partial-deficiency patient had biopsy evidence of abnormal myelinogenesis;
    that case cannot define every severe congenital neuropathy. Human functional contribution
    is usually limited compared with the marked peripheral nerve phenotype of some mouse models.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: myelination in peripheral nervous system
    term:
      id: GO:0022011
      label: myelination in peripheral nervous system
    modifier: DECREASED
  locations:
  - preferred_term: peripheral nervous system
    term:
      id: UBERON:0000010
      label: peripheral nervous system
  notes: >-
    Conformance is declared against the dysmyelination node of `schwann_cell_myelin_maintenance`
    rather than against its trigger node, deliberately. That module scopes its trigger to
    Schwann-cell myelin gene dosage and structural lesions (PMP22, MPZ, GJB1, EGR2, the CMT4
    trafficking genes); the lesion here is an extracellular matrix ligand the Schwann cell
    secretes for its own basal lamina, which is not one of them. What conforms is the
    tissue-level outcome, dysmyelinated peripheral nerve with a remodeling signature and
    conduction slowing, and it conforms with the module's own scope boundary intact, since the
    primary lesion is Schwann-cell-derived rather than an immune attack from outside the cell.
  evidence:

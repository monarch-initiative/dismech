classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      A congenital muscular dystrophy: the primary clinical home is the neuromuscular-disease
      chapters of the neurologic Part.
    evidence:
    - reference: PMID:32848593
      reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Complete merosin deficiency is typically associated with a more severe congenital muscular dystrophy (CMD), clinically manifested by hypotonia and weakness at birth, the development of contractures of large joints, and progressive respiratory involvement."
      explanation: Characterises the entity as a congenital muscular dystrophy, which places it in the neuromuscular chapters.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A single-gene autosomal recessive disorder whose severity is graded by residual protein,
      so the Mendelian axis is a substantive second home rather than a formality.
    evidence:
    - reference: PMID:22675738
      reference_title: "LAMA2 Muscular Dystrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "LAMA2-MD is inherited in an autosomal recessive manner."
      explanation: GeneReviews states the Mendelian inheritance mode that motivates this Part.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic LAMA2 variants, homozygous or compound heterozygous. Truncating alleles
    predominate in the congenital severe form; missense alleles are over-represented in the
    milder limb-girdle form, which is the molecular basis of the complete/partial deficiency
    split.
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of LAMA2 muscular dystrophy is established in a proband with suggestive findings and biallelic (homozygous or compound heterozygous) pathogenic variants in LAMA2 identified by molecular genetic testing."
    explanation: States the biallelic requirement that defines the recessive mode.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonsense variants were more frequent in LAMA2-CMD (56.9%, 66/116) than in LGMDR23 (21.4%, 3/14), while missense disease-causing variants were more frequent in LGMDR23 (71.4%, 10/14) than in LAMA2-CMD (12.9%, 15/116)."
    explanation: Quantifies the allele-class skew between the congenital and limb-girdle ends of the same recessive series.
prevalence:
- population: Worldwide, children
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.8
  notes: >-
    Reported as approximately 4 in 500,000 children, which normalises to 0.8 per 100,000. This
    is a review's summary figure rather than a registry count, and published estimates for
    LAMA2-related dystrophy as a whole span roughly an order of magnitude between countries, so
    the coarse band carries more weight than the point value.
  evidence:
  - reference: PMID:31308722
    reference_title: "Current understanding and treatment of cardiac and skeletal muscle pathology in laminin-α2 chain-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAMA2 MD is the most common congenital muscular dystrophy, affecting approximately 4 in 500,000 children."
    explanation: Gives the population rate normalised into this record.
- population: Switzerland, ages 0-23 years
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.8
  notes: >-
    A registry-denominator minimum rather than an ascertained rate: the numerator is patients
    enrolled in the Swiss Registry for Neuromuscular Disorders, so unenrolled cases are missed
    and the authors state the figure as a floor. It covers LAMA2-related dystrophy as a whole,
    of which the congenital severe form curated here was 14 of 18 patients.
  evidence:
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, the prevalence of LAMA2-RD in Switzerland for the age group 0-23 years is at least 17/2 123 128 = 0.8 : 100 000."
    explanation: States the registry-based minimum prevalence recorded here.
- population: Congenital muscular dystrophy cohorts, worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Share of the congenital muscular dystrophy population rather than a population rate. Recorded
    because it is the figure most often quoted for this disease and is easily mistaken for one.
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAMA2-CMD is one of the most common congenital muscular dystrophies (CMDs) in the world, accounting for 36.4%-48% of CMD patients"
    explanation: Gives the proportion of congenital muscular dystrophy attributable to this entity.
has_subtypes:
- name: Complete deficiency
  display_name: Complete merosin deficiency (congenital severe form, MDC1A)
  description: >-
    Absent laminin alpha-2 on muscle immunostaining, usually from biallelic truncating variants.
    Neonatal or early-infantile onset with profound hypotonia, and independent ambulation is
    almost never achieved. This is the phenotype the entry's MONDO term names, and the default
    reading of any unqualified statement in this file.
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle atrophy and severe weakness typically prevent independent ambulation."
    explanation: States the defining functional consequence of the complete-deficiency phenotype.
- name: Partial deficiency
  display_name: Partial merosin deficiency (late-onset limb-girdle form, LGMDR23)
  description: >-
    Reduced but detectable laminin alpha-2, more often from missense or leaky splice alleles.
    Onset from childhood to adulthood with limb-girdle weakness, rigid spine and contractures;
    independent ambulation is typically achieved and often retained for decades. Curated as a
    subtype rather than a separate entry because it is the same lesion at a different dose:
    one allelic series, one mechanism, graded by residual protein.
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Partial merosin deficiency is mostly manifested by later onset limb-girdle weakness and joint contractures so that independent ambulation is typically achieved."
    explanation: Defines the partial-deficiency phenotype and its ambulatory outcome.
  - reference: PMID:9829280
    reference_title: "Laminin alpha 2-chain gene mutations in two siblings presenting with limb-girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm that mutations of the LAMA2 gene that do not completely disrupt the production of the protein can give rise to phenotypes considerably milder than classical merosin-deficient congenital muscular dystrophy."
    explanation: Establishes the residual-protein rule that makes this a graded subtype of the same disease rather than a distinct entity.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All LGMDR23 patients achieved independent ambulation at median age of 18.0 months (range 13.0-20.0 months)."
    explanation: Quantifies the ambulatory outcome that separates this subtype from complete deficiency.
pathophysiology:
- name: Biallelic LAMA2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of LAMA2, at 6q22-q23, remove or truncate the laminin alpha-2 chain.
    Most congenital-severe alleles are premature termination codons or exon deletions; missense
    alleles that leave residual protein are enriched at the milder end of the spectrum. Because
    laminin-211 is an obligate alpha2-beta1-gamma1 heterotrimer, loss of the single alpha-2
    chain removes the assembled trimer rather than merely weakening it.
  genes:
  - preferred_term: LAMA2
    term:
      id: hgnc:6482
      label: LAMA2
  downstream:
  - target: Loss of Laminin-211 from the Muscle Basal Lamina
    causal_link_type: DIRECT
    description: >-
      The alpha-2 chain is the isoform-defining subunit of laminin-211, so a null allele pair
      removes the trimer from every basement membrane that depends on it.
    evidence:
    - reference: PMID:31341277
      reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MDC1A is caused by mutations in LAMA2 that lead to nonfunctional laminin-α2, which compromises the stability of muscle fibres and the myelination of peripheral nerves."
      explanation: States the step from LAMA2 mutation to nonfunctional laminin-alpha-2 and thence to loss of fibre stability, which is this edge.
  - target: Loss of Laminin-211 from the Schwann Cell Basal Lamina
    causal_link_type: DIRECT
    description: >-
      The same null genotype removes laminin-211 from Schwann cell basal laminae, where the
      alpha-2 chain is likewise the predominant laminin alpha subunit.
  - target: Loss of Laminin-211 at the Glia Limitans and CNS Vascular Basement Membranes
    causal_link_type: DIRECT
    description: >-
      Laminin alpha-2 is deposited by astrocyte endfeet, so a systemic null genotype withdraws
      it from the pial and perivascular basement membranes of the brain as well.
  evidence:
  - reference: PMID:7550355
    reference_title: "Mutations in the laminin alpha 2-chain gene (LAMA2) cause merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore investigated LAMA2 for the presence of disease-causing mutations in laminin alpha 2 chain-deficient CMD families and now report splice site and nonsense mutations in two families leading presumably to a truncated laminin alpha 2 protein."
    explanation: The original report establishing LAMA2 as the mutated gene and truncation as the allele class.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The top three high-frequency disease-causing variants in Han Chinese patients were c.7147C > T (p.R2383*), exon 4 deletion, and c.5156_5159del (p.K1719Rfs*5)."
    explanation: Shows that the recurrent alleles in a large cohort are nonsense, whole-exon deletion and frameshift, that is, loss-of-function classes.
- name: Loss of Laminin-211 from the Muscle Basal Lamina
  biological_scale: MOLECULAR
  description: >-
    Laminin-211 is the predominant laminin of the skeletal-muscle basement membrane. Without the
    alpha-2 chain the basal lamina loses both its principal polymerising alpha subunit and the
    long-arm LG module that tethers the lattice to the fibre surface, so the sheet is destabilised
    and its cell-facing end is unanchored.
  cellular_components:
  - preferred_term: muscle fibre basal lamina
    term:
      id: GO:0005604
      label: basement membrane
  molecular_functions:
  - preferred_term: laminin-211 as a basement-membrane structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: DECREASED
  downstream:
  - target: Failure of Basal Lamina to Sarcolemma Receptor Coupling
    causal_link_type: DIRECT
    description: >-
      The receptors remain in the membrane but their ligand is gone, so the linkage fails from
      the matrix side.
  evidence:
  - reference: PMID:31308722
    reference_title: "Current understanding and treatment of cardiac and skeletal muscle pathology in laminin-α2 chain-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laminin-211 is an extracellular matrix protein that functions to stabilize the basement membrane and muscle fibers during contraction."
    explanation: States the structural role of laminin-211 in the muscle basement membrane that this node reports as lost.
- name: Failure of Basal Lamina to Sarcolemma Receptor Coupling
  biological_scale: MOLECULAR
  description: >-
    The mechanistically decisive step. Laminin-211 engages two independent sarcolemmal receptor
    systems through its C-terminal globular region: the LG4-LG5 pair binds the matriglycan of
    alpha-dystroglycan, which connects through beta-dystroglycan to dystrophin and the
    subsarcolemmal actin cytoskeleton, while LG1-LG3 bind integrin alpha-7-beta-1. Both linkages
    are lost together, and integrin alpha-7-beta-1 is additionally reduced at the sarcolemma as
    a secondary consequence. What is lost is therefore not one bond but the entire
    matrix-to-cytoskeleton bridge, in both its mechanical and its signalling capacity.
  molecular_functions:
  - preferred_term: laminin-211 binding by alpha-dystroglycan and integrin alpha-7-beta-1
    term:
      id: GO:0043236
      label: laminin binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: myofibre adhesion to the basal lamina
    term:
      id: GO:0031589
      label: cell-substrate adhesion
    modifier: DECREASED
  downstream:
  - target: Contraction-Induced Myofibre Detachment and Mechanical Injury
    causal_link_type: DIRECT
    description: >-
      With the mechanical arm of the bridge gone, contractile force is no longer transmitted
      across an intact linkage and the fibre pulls away from its matrix.
  - target: Loss of Laminin-Dependent Survival Signalling
    causal_link_type: DIRECT
    description: >-
      The same receptors carry adhesion-dependent survival signalling, so the signalling arm
      fails at the same moment as the mechanical one.
  evidence:
  - reference: PMID:21798088
    reference_title: "Skeletal muscle laminin and MDC1A: pathogenesis and treatment strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "By binding to the cell surface receptors dystroglycan and integrin α7β1, laminin-211 is believed to protect the muscle fiber from damage under the constant stress of contractions, and to influence signal transmission events."
    explanation: States both arms of the linkage, mechanical protection and signal transmission, that this node reports as jointly lost.
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the LG domain (LG), which binds to the glycosylated residues of α-dystroglycan and to the integrins"
    explanation: Identifies the LG module as the receptor-binding domain, which is the structural basis for the coupling described here.
  - reference: PMID:32827036
    reference_title: "Cobblestone Malformation in LAMA2 Congenital Muscular Dystrophy (MDC1A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This results in a loss of the stabilizing connection to the DGC, leading to a loss of structural integrity and function of various cells, including myocytes and Schwann cells"
    explanation: States the loss of the dystroglycan-complex connection following failure of merosin to serve as a matriglycan acceptor, which is the dystroglycan arm of this node.
  - reference: PMID:21652631
    reference_title: "Transgenic overexpression of the α7 integrin reduces muscle pathology and improves viability in the dy(W) mouse model of merosin-deficient congenital muscular dystrophy type 1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MDC1A patients exhibit reduced α7β1 integrin; however, it is unclear how the secondary loss of α7β1 integrin contributes to MDC1A disease progression."
    explanation: Documents the secondary reduction of the integrin receptor in patients, which compounds the loss of its ligand.
- name: Contraction-Induced Myofibre Detachment and Mechanical Injury
  biological_scale: CELLULAR
  description: >-
    Every contraction now loads an unanchored membrane. Fibres detach from their basal lamina and
    are mechanically injured. Live imaging in the zebrafish lama2 mutant shows the detachment
    itself is not immediately lethal: detached fibres keep sarcolemmal integrity and attempt
    focal reattachment, extension and fusion with neighbouring myoblasts before entering the
    death programme. That delay is the therapeutic window the model was built to demonstrate.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    causal_link_type: DIRECT
    description: >-
      Repeated detachment and tearing is the injury that the dying fibres are dying of.
  evidence:
  - reference: PMID:31754462
    reference_title: "Cellular rescue in a zebrafish model of congenital muscular dystrophy type 1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show, via live tracking of individual muscle fibres, that dystrophic myofibres in the zebrafish model of MDC1A maintain sarcolemmal integrity and undergo dynamic remodelling behaviours post detachment, including focal sarcolemmal reattachment, cell extension and hyper-fusion with surrounding myoblasts."
    explanation: Directly observes myofibre detachment in a laminin-deficient animal and characterises what the fibre does next.
- name: Loss of Laminin-Dependent Survival Signalling
  biological_scale: CELLULAR
  description: >-
    Separately from the mechanical failure, merosin is a survival ligand. In culture,
    merosin-deficient myoblasts fuse but form unstable myotubes, and adding merosin back, but not
    laminin-111, restores stability by preventing apoptosis. So a laminin-alpha-2-null fibre is
    not merely a fibre under mechanical strain; it is a fibre deprived of the adhesion signal
    that normally licenses its survival.
  biological_processes:
  - preferred_term: myofibre apoptosis
    term:
      id: GO:0010657
      label: muscle cell apoptotic process
    modifier: INCREASED
  downstream:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    causal_link_type: DIRECT
    description: >-
      Withdrawal of the survival signal is what converts an injured fibre into a dying one.
  evidence:
  - reference: PMID:8830776
    reference_title: "Merosin and laminin in myogenesis; specific requirement for merosin in myotube stability and survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, merosin appears to promote myotube stability by preventing apoptosis."
    explanation: States the anti-apoptotic function of merosin whose loss this node describes.
  - reference: PMID:8830776
    reference_title: "Merosin and laminin in myogenesis; specific requirement for merosin in myotube stability and survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Exogenous merosin converted these myotubes to a stable phenotype, while laminin had no effect."
    explanation: Shows the requirement is specific to merosin rather than to laminin generally, which is why loss of the alpha-2 chain cannot be covered by other laminins.
- name: Myofibre Degeneration, Necrosis and Apoptosis
  biological_scale: CELLULAR
  description: >-
    Fibres die by both necrosis and apoptosis, and the apoptotic component is unusually
    prominent for a muscular dystrophy, prominent enough to be a therapeutic target in its own
    right. In the dy3K/dy3K null mouse, apoptotic fibres are already present at postnatal day 1,
    before any other dystrophic hallmark. That two Bcl-2-family manipulations, and separately a
    GAPDH-Siah1 pathway inhibitor, each extend survival severalfold makes apoptosis causal here
    rather than incidental.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: muscle cell apoptotic process
    term:
      id: GO:0010657
      label: muscle cell apoptotic process
    modifier: INCREASED
  downstream:
  - target: Abortive Muscle Regeneration
    causal_link_type: DIRECT
    description: >-
      Fibre death is the injury that calls the satellite-cell response into action.
  - target: Inflammatory Cell Recruitment
    causal_link_type: DIRECT
    description: >-
      Degenerating and necrotic fibres recruit macrophages, and the infiltrate appears within
      days of birth in the null mouse.
  - target: Dysregulated Muscle Proteostasis and Autophagy
    causal_link_type: DIRECT
    description: >-
      The degradative systems are upregulated in the dystrophic muscle rather than being
      independently deranged.
  evidence:
  - reference: PMID:31586140
    reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that apoptotic muscle fibres were present as early as postnatal day 1."
    explanation: Places myofibre apoptosis at the earliest detectable point of the disease in the complete-null model.
  - reference: PMID:15578095
    reference_title: "Inhibition of apoptosis improves outcome in a model of congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laminin-alpha2-deficient skeletal muscles in both humans and mice show signs of muscle cell death by apoptosis."
    explanation: Establishes that the apoptotic component is present in human muscle and not only in the mouse.
  - reference: PMID:31586140
    reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Typical hallmarks of LAMA2-CMD dystrophic muscle biopsy include: degenerating/regenerating muscle fibres, muscle fibre atrophy, necrosis and apoptosis of muscle cells, early inflammation and extensive connective tissue infiltration"
    explanation: Lists the coexisting necrotic and apoptotic death together with the downstream inflammation and fibrosis this node feeds.
- name: Dysregulated Muscle Proteostasis and Autophagy
  biological_scale: CELLULAR
  description: >-
    A branch rather than a link in the main chain, but a load-bearing one. Autophagy-related
    gene expression is raised in both dy3K/dy3K mouse and human MDC1A muscle, and pharmacological
    autophagy inhibition improves the mouse phenotype. The enhanced autophagic flux is therefore
    pathogenic here, not compensatory, which is the opposite of its reading in several other
    myopathies and is the reason the node is curated separately rather than folded into
    degeneration.
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: INCREASED
  downstream:
  - target: Muscle Atrophy and Loss of Muscle Mass
    causal_link_type: DIRECT
    description: >-
      Excess autophagic and proteasomal degradation removes muscle protein; inhibiting autophagy
      increases muscle mass in the model.
    evidence:
    - reference: PMID:21920942
      reference_title: "Autophagy is increased in laminin α2 chain-deficient muscle and its inhibition improves muscle morphology in a mouse model of MDC1A."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In particular, we show that systemic injection of 3-methyladenine (3-MA) reduces muscle fibrosis, atrophy, apoptosis and increases muscle regeneration and muscle mass."
      explanation: Blocking autophagy reverses the atrophy, which is the intervention evidence for this edge.
  evidence:
  - reference: PMID:21920942
    reference_title: "Autophagy is increased in laminin α2 chain-deficient muscle and its inhibition improves muscle morphology in a mouse model of MDC1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using the dy(3K)/dy(3K) mouse model of laminin α2 chain deficiency and MDC1A patient muscle, we show here that expression of autophagy-related genes is upregulated in laminin α2 chain-deficient muscle."
    explanation: Establishes the upregulation in both the mouse model and human patient muscle.
- name: Abortive Muscle Regeneration
  biological_scale: CELLULAR
  description: >-
    Satellite cells are activated and regeneration is attempted, but it does not keep pace and
    does not restore the tissue. Part of the reason is circular: the regenerative response itself
    depends on the laminin substrate that is missing, and supplying laminin to a lama2-deficient
    animal stimulates muscle-stem-cell-mediated repair. So this is not simple exhaustion of a
    normal repair programme but a repair programme running without one of its own required
    inputs.
  cell_types:
  - preferred_term: skeletal muscle satellite cell
    term:
      id: CL:0000594
      label: skeletal muscle satellite cell
  biological_processes:
  - preferred_term: skeletal muscle tissue regeneration
    term:
      id: GO:0043403
      label: skeletal muscle tissue regeneration
    modifier: DECREASED
  downstream:
  - target: Endomysial Fibrosis and Replacement of Muscle
    causal_link_type: DIRECT
    description: >-
      What regeneration fails to replace is replaced by connective tissue instead.
  - target: Muscle Atrophy and Loss of Muscle Mass
    causal_link_type: DIRECT
    description: >-
      Cumulative fibre loss without replacement is what the atrophy consists of.
  evidence:
  - reference: PMID:31754462
    reference_title: "Cellular rescue in a zebrafish model of congenital muscular dystrophy type 1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further reveal that Laminin also acts as a pro-regenerative factor that stimulates muscle stem cell-mediated repair in lama2-deficient animals in vivo."
    explanation: Shows the regenerative deficit is itself laminin-dependent, which is the specific claim this node makes.
  - reference: PMID:35203715
    reference_title: "Oxidative Stress, Inflammation and Connexin Hemichannels in Muscular Dystrophies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Consequently, MDC1A-causing mutations in the LAMA2 gene lead to a defective muscle repair associated with chronic inflammation, fibrosis, and muscle atrophy"
    explanation: States the defective-repair-to-fibrosis-and-atrophy sequence that this node and its downstream targets describe.
- name: Inflammatory Cell Recruitment
  biological_scale: TISSUE
  description: >-
    Macrophage infiltration begins early and persists into adulthood in the dyW mouse, with
    NF-kB activation and pro-inflammatory cytokine expression that themselves inhibit myogenesis.
    Inflammation here is therefore both a consequence of fibre death and a brake on the repair
    that would otherwise offset it.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Endomysial Fibrosis and Replacement of Muscle
    causal_link_type: DIRECT
    description: >-
      Chronic infiltrate is the standard driver of mesenchymal activation and matrix deposition
      in injured muscle.
  evidence:
  - reference: PMID:35203715
    reference_title: "Oxidative Stress, Inflammation and Connexin Hemichannels in Muscular Dystrophies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In DyW mice, a murine model of laminin-deficient muscular dystrophy, merosin-deficient skeletal muscles exhibit high macrophage infiltration from early ages to adulthood."
    explanation: Documents the early and sustained macrophage infiltration this node reports.
  - reference: PMID:31586140
    reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Other typical dystrophic hallmarks (muscle degeneration, inflammation, and extensive production of the extracellular matrix proteins) were clearly evident already at postnatal day 4, and the highest degree of muscle deterioration was reached by day 7."
    explanation: Times the inflammatory infiltrate and matrix production to the first postnatal week in the complete-null model.
- name: Endomysial Fibrosis and Replacement of Muscle
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    Myofibroblast transdifferentiation and excessive endomysial matrix deposition replace lost
    muscle. Increased endomysial connective tissue is one of the defining biopsy findings of the
    congenital muscular dystrophies and was part of the original morphological definition. What
    is distinctive in MDC1A is how early it begins: fibrogenesis precedes and drives the
    contractures rather than following them, which is why joint contractures can be a presenting
    symptom in an infant.
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  downstream:
  - target: Progressive Weakness, Contracture and Restrictive Respiratory Failure
    causal_link_type: DIRECT
    description: >-
      Fibrotic replacement of muscle is what fixes the joints and stiffens the chest wall.
  evidence:
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathophysiologically, early fibrogenesis results in severe and early contractures of joints and loss of muscle tissue by myofibroblast transdifferentiation"
    explanation: States both the myofibroblast mechanism and the causal precedence of fibrosis over contracture that this node asserts.
  - reference: PMID:7550355
    reference_title: "Mutations in the laminin alpha 2-chain gene (LAMA2) cause merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological changes seen in muscle biopsies consist of large variations in muscle fibre size, a few necrotic and regenerating fibres and a marked increase in endomysial collagen tissue."
    explanation: Records the endomysial collagen increase as a defining biopsy feature of this disease group.
- name: Muscle Atrophy and Loss of Muscle Mass
  biological_scale: TISSUE
  description: >-
    The net result of fibre death, failed regeneration and excess degradation. It is not uniform:
    axial and proximal muscles bear the brunt, distal muscle function is relatively spared, and
    the masticatory muscles are severely affected in the null mouse in a way that plausibly
    contributes to the feeding failure.
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Progressive Weakness, Contracture and Restrictive Respiratory Failure
    causal_link_type: DIRECT
    description: >-
      Loss of contractile tissue is the immediate substrate of the weakness.
  evidence:
  - reference: PMID:37476021
    reference_title: "LAMA2-Related Muscular Dystrophy Across the Life Span: A Cross-sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean MFM-20/32 score was 42.0% ± 29.4%, with domain 1 (standing and transfers) being severely affected and domain 3 (distal muscle function) relatively spared."
    explanation: Documents the axial-proximal predominance and distal sparing that this node records as the distribution of muscle loss.
- name: Progressive Weakness, Contracture and Restrictive Respiratory Failure
  biological_scale: ORGANISM
  description: >-
    The organism-level convergence of the muscle arm. Weakness is present from birth and the
    functional trajectory is dominated less by further loss of strength than by the contractures
    and spinal deformity that accumulate on top of it: elbow flexor contracture increases
    linearly with age, and motor regression in the congenital form clusters with the rapid
    contracture phase between six and nine years. Restrictive respiratory failure follows the
    same fibrotic-stiffening logic applied to the chest wall and declines at about 2.9% of
    predicted forced vital capacity per year.
  downstream:
  - target: Inability to walk
    causal_link_type: DIRECT
    description: >-
      Weakness and fixed contracture together are what prevent independent ambulation being
      achieved in the congenital form.
  - target: Recurrent respiratory infections
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Restrictive ventilatory failure plus a weak cough and aspiration risk is the substrate for
      recurrent chest infection, which is the leading cause of death.
  evidence:
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD subjects showed a 2.9% linear annual decline in forced vital capacity % predicted."
    explanation: Quantifies the restrictive respiratory decline recorded in this node.
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed a linear increase in elbow flexor contractures in CD subjects."
    explanation: Documents the progressive contracture component of this convergence node.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor regression in LAMA2-CMD mainly occurred concurrently with rapid progression of contractures during 6-9 years old."
    explanation: Ties functional regression to the contracture phase rather than to independent further weakening.
- name: Loss of Laminin-211 from the Schwann Cell Basal Lamina
  biological_scale: MOLECULAR
  description: >-
    Laminin-211 is the predominant basal-lamina laminin of the Schwann cell as well as of the
    myofibre, and Schwann-cell laminin-dystroglycan and laminin-integrin signalling is what
    drives radial axonal sorting and the onset of myelination. Losing it is therefore a
    developmental myelination lesion, not a myelin-maintenance one.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  downstream:
  - target: Peripheral Dysmyelination and Conduction Slowing
    causal_link_type: DIRECT
    description: >-
      Without its basal-lamina ligand the Schwann cell cannot build normal compact myelin.
  evidence:
  - reference: PMID:8576559
    reference_title: "Demyelinating peripheral neuropathy in merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because the alpha 2 subunit is also expressed in S-merosin, found in Schwann cells, we have investigated whether peripheral nerve function is also affected in these patients."
    explanation: Establishes Schwann-cell expression of the alpha-2 chain, which is what this node reports as lost.
  - reference: PMID:31341277
    reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MDC1A is caused by mutations in LAMA2 that lead to nonfunctional laminin-α2, which compromises the stability of muscle fibres and the myelination of peripheral nerves."
    explanation: States the peripheral-nerve myelination arm alongside the muscle arm.
- name: Peripheral Dysmyelination and Conduction Slowing
  biological_scale: TISSUE
  conforms_to: "schwann_cell_myelin_maintenance#Dysmyelination and Segmental Demyelination of Peripheral Nerve"
  description: >-
    Motor nerve conduction velocity is slowed in almost every completely merosin-deficient
    patient and normal in merosin-positive congenital muscular dystrophy, which is a clean
    genotype-linked separation. Nerve histology shows short internodes, enlarged nodes, excessive
    variability of myelin thickness, tomacula and uncompacted myelin without segmental
    demyelination or onion bulbs, which is the picture of myelin that was built wrongly rather
    than myelin that was built and then lost. Clinically the neuropathy is mild and adds little
    to the weakness in humans, in contrast to the mouse, where it is a substantial contributor.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: myelination in peripheral nervous system
    term:
      id: GO:0022011
      label: myelination in peripheral nervous system
    modifier: DECREASED
  locations:
  - preferred_term: peripheral nervous system
    term:
      id: UBERON:0000010
      label: peripheral nervous system
  notes: >-
    Conformance is declared against the dysmyelination node of `schwann_cell_myelin_maintenance`
    rather than against its trigger node, deliberately. That module scopes its trigger to
    Schwann-cell myelin gene dosage and structural lesions (PMP22, MPZ, GJB1, EGR2, the CMT4
    trafficking genes); the lesion here is an extracellular matrix ligand the Schwann cell
    secretes for its own basal lamina, which is not one of them. What conforms is the
    tissue-level outcome, dysmyelinated peripheral nerve with a remodeling signature and
    conduction slowing, and it conforms with the module's own scope boundary intact, since the
    primary lesion is Schwann-cell-derived rather than an immune attack from outside the cell.
  evidence:
  - reference: PMID:8576559
    reference_title: "Demyelinating peripheral neuropathy in merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All but two of the 10 merosin-deficient cases had reduced motor nerve conduction, whereas all the merosin-positive cases had normal results."
    explanation: Ties the conduction slowing specifically to merosin deficiency rather than to congenital muscular dystrophy in general.
  - reference: PMID:12661054
    reference_title: "Dysmyelinating sensory-motor neuropathy in merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve biopsy showed reduction of large myelinated fibers, short internodes, enlarged nodes, excessive variability of myelin thickness, tomacula, and uncompacted myelin, but no evidence of segmental demyelination, naked axons, or onion bulbs."
    explanation: Gives the histological signature that distinguishes dysmyelination from acquired demyelination in this disease.
  - reference: PMID:12661054
    reference_title: "Dysmyelinating sensory-motor neuropathy in merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, in congenital muscular dystrophy, merosin expression may be dissociated in different tissues, and the neuropathy is sensory-motor and due to abnormal myelinogenesis."
    explanation: States that the lesion is abnormal myelinogenesis, which is the developmental reading this node takes.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild, sensorimotor demyelinating neuropathy is commonly observed, but its contribution to muscle weakness is considered to be minimal in the human, while it plays a substantial role in mouse models of lama2 deficiency"
    explanation: Records the human-versus-mouse divergence in the neuropathy's functional weight, which the node reports.
- name: Loss of Laminin-211 at the Glia Limitans and CNS Vascular Basement Membranes
  biological_scale: MOLECULAR
  description: >-
    In the brain the alpha-2 chain is contributed by astrocyte foot processes at the glia
    limitans and the blood-brain barrier. Its loss therefore destabilises two distinct CNS
    basement-membrane compartments: the perivascular one, whose failure is the leading
    explanation for the white-matter signal change, and the pial one, whose failure permits
    cortical overmigration.
  cell_types:
  - preferred_term: astrocyte endfoot at the glia limitans
    term:
      id: CL:0000127
      label: astrocyte
  cellular_components:
  - preferred_term: CNS basement membrane
    term:
      id: GO:0005604
      label: basement membrane
  downstream:
  - target: Cerebral White Matter Signal Abnormality
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Attributed to increased white-matter water content following loss of laminin from the
      perivascular basement membrane. The causal intermediates in humans are not directly
      demonstrated, which is why the link is recorded with unknown intermediates rather than as
      a direct one.
  - target: Pial Basement Membrane Assembly Failure
    causal_link_type: DIRECT
    description: >-
      The glia limitans is a laminin-dependent basement membrane, so withdrawal of its principal
      alpha chain is an assembly defect.
  evidence:
  - reference: PMID:32827036
    reference_title: "Cobblestone Malformation in LAMA2 Congenital Muscular Dystrophy (MDC1A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the brain, laminin α2 is expressed by astrocyte foot processes at the glia limitans and blood-brain barrier"
    explanation: Establishes the two CNS compartments in which the alpha-2 chain is deposited and therefore lost.
- name: Cerebral White Matter Signal Abnormality
  biological_scale: TISSUE
  description: >-
    Diffuse T2 and FLAIR hyperintensity of the periventricular and subcortical white matter,
    with T1 hypointensity, present in essentially all patients beyond about six months of age
    and attributed to increased water content rather than to demyelination. It is a defining
    diagnostic feature and largely a silent one: most patients with it have normal cognition,
    and it is the accompanying cortical malformation, not the white-matter change, that tracks
    with epilepsy and intellectual disability. Below six months the finding may be absent or
    read only as delayed myelination, which is a real diagnostic trap in the neonate.
  locations:
  - preferred_term: cerebral hemisphere white matter
    term:
      id: UBERON:0002437
      label: cerebral hemisphere white matter
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Characteristic brain white matter (WM) hypointensity on T1 magnetic resonance imaging (MRI), and increased T2 signal in the periventricular and subcortical WM, are invariably observed in most patients older than 6 months"
    explanation: Gives both the imaging signature and the age dependence recorded in this node.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI shows typical periventricular and subcortical white matter changes, which are thought to be due to increased water content"
    explanation: States the increased-water-content mechanism this node attributes the signal change to.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three MRIs from children aged below 6 months, the typical white matter changes were not yet visible but delayed myelination was observed."
    explanation: Documents the neonatal diagnostic trap this node warns about.
- name: Pial Basement Membrane Assembly Failure
  biological_scale: TISSUE
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Pial Basement Membrane Assembly Failure"
  description: >-
    In a minority of patients the pial basement membrane is not merely thinner but focally
    breached. Autopsy of an MDC1A brain showed focal disruptions of the glia limitans with
    abnormal cortical lamination and arrested cerebellar granule cell migration, the classic
    substrate of a cobblestone malformation, here arising from loss of a structural laminin
    rather than from defective dystroglycan glycosylation. The module conformance is exact in
    mechanism: this entry substitutes an absent laminin ligand where the dystroglycanopathies
    substitute an unglycosylated receptor, and both converge on the same boundary failure.
  biological_processes:
  - preferred_term: pial basement membrane assembly
    term:
      id: GO:0070831
      label: basement membrane assembly
    modifier: DECREASED
  downstream:
  - target: Cortical Malformation and Epileptogenesis
    causal_link_type: DIRECT
    description: >-
      A breached glia limitans permits neurons and glia to overmigrate past the cortical surface,
      producing the cobblestone and polymicrogyric cortex.
  evidence:
  - reference: PMID:32827036
    reference_title: "Cobblestone Malformation in LAMA2 Congenital Muscular Dystrophy (MDC1A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain histopathology included focal disruptions of the glia limitans associated with abnormal cerebral cortical lamination or arrested cerebellar granule cell migration."
    explanation: Directly demonstrates the pial boundary breach and its migration consequence in human MDC1A neuropathology.
- name: Cortical Malformation and Epileptogenesis
  biological_scale: TISSUE
  description: >-
    Cobblestone malformation, polymicrogyria and lissencephaly-pachygyria occur in roughly a
    fifth of LAMA2-related dystrophy patients, most severely in the occipital and
    parieto-occipital lobes. This is the branch that carries the disease's cognitive and
    epileptic burden: cortical malformation, epilepsy and intellectual disability travel
    together, correlate with more severe motor phenotype, and were absent from every ambulant
    patient in the Brazilian cohort. Genotypically they cluster on variants affecting the LG
    domains, the same module that binds dystroglycan in muscle, which is a satisfying
    convergence between the two arms of the disease.
  downstream:
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The leading account of seizures in this disease is abnormal neuronal firing from deficient
      cortical migration, but that account is explicitly a hypothesis, and seizures also occur
      without a demonstrable cortical anomaly, so the intermediates are not established.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Intellectual disability co-segregates with cortical malformation rather than with the
      white-matter change, but most patients with malformation are not intellectually disabled,
      so the link is an association whose intermediates are unknown.
  evidence:
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cortical malformations, epilepsy and intellectual disability are more frequent among LAMA2-RD patients than previously reported and correlate with motor function severity and the presence of variants affecting the laminin-α2 LG domain."
    explanation: Establishes both the co-occurrence of the three CNS features and the LG-domain genotype correlation this node reports.
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNS manifestations correlated with a more severe motor phenotype and none of the patients able to walk presented with cortical malformation or epilepsy."
    explanation: Records the separation between the ambulant and non-ambulant groups that makes this branch phenotype-linked rather than universal.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most consistent hypothesis regarding the etiology of these seizures is abnormal neuronal firing due to deficient neuronal migration in specific areas of the cortex"
    explanation: States the proposed mechanism linking cortical migration failure to seizures, and marks it as a hypothesis, which is why the downstream edge records unknown intermediates.
phenotypes:
- name: Neonatal hypotonia
  category: Neuromuscular
  frequency: VERY_FREQUENT
  description: >-
    Profound generalised hypotonia from birth, with poor spontaneous movement and often a weak
    cry. It is the presenting sign in the great majority of congenital-form patients and appears
    within the first week of life in about three quarters.
  phenotype_term:
    preferred_term: Neonatal hypotonia
    term:
      id: HP:0001319
      label: Neonatal hypotonia
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MDC1A is typically characterized by neonatal profound hypotonia, poor spontaneous movements, and respiratory failure."
    explanation: GeneReviews names neonatal profound hypotonia as a defining manifestation.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early symptoms appeared within the first week of life in 75.9% (88/116) of LAMA2-CMD patients."
    explanation: Quantifies the neonatal onset supporting the VERY_FREQUENT band.
- name: Axial and proximal muscle weakness
  category: Neuromuscular
  frequency: VERY_FREQUENT
  description: >-
    Severe weakness with an axial and proximal predominance and relative sparing of distal
    function, which is the distribution that distinguishes the functional profile from a
    length-dependent neuropathy.
  phenotype_term:
    preferred_term: Axial muscle weakness
    term:
      id: HP:0003327
      label: Axial muscle weakness
  reports_on:
  - target: Muscle Atrophy and Loss of Muscle Mass
    relationship: READOUT_OF
  evidence:
  - reference: PMID:37476021
    reference_title: "LAMA2-Related Muscular Dystrophy Across the Life Span: A Cross-sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Axial and proximal muscle weakness was most pronounced."
    explanation: States the weakness distribution directly.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical hallmarks are early-onset severe hypotonia, axial weakness, inability to achieve independent ambulation, and elevated creatine kinase (CK) levels, commonly >1,000 IU/L"
    explanation: Lists axial weakness among the defining clinical hallmarks.
- name: Inability to walk
  category: Neuromuscular
  frequency: VERY_FREQUENT
  subtype: Complete deficiency
  description: >-
    In the complete-deficiency form, independent ambulation is usually never achieved. Where it
    is, it is late and often lost again: in a 130-patient cohort only 18.4% of congenital-form
    patients walked independently, at a median of 27 months, against 100% of the limb-girdle
    subtype at a median of 18 months.
  phenotype_term:
    preferred_term: Inability to walk
    term:
      id: HP:0002540
      label: Inability to walk
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Head control, independent sitting and ambulation were achieved in 76.3%, 92.6% and 18.4% of LAMA2-CMD patients at median ages of 6.0 months (range 2.0-36.0 months), 11.0 months (range 6.0-36.0 months), and 27.0 months (range 18.0-84.0 months), respectively."
    explanation: Gives the proportion achieving ambulation, which is the quantitative basis for the frequency band.
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One CD and two PD subjects achieved independent ambulation."
    explanation: In a 46-patient cohort with 42 complete-deficiency patients, only one walked, corroborating the band.
- name: Delayed gross motor development
  category: Neuromuscular
  frequency: VERY_FREQUENT
  description: >-
    Motor milestones are delayed or never attained. Head control and independent sitting are
    achieved by most, but late; ambulation usually is not.
  phenotype_term:

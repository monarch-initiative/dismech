classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      A congenital muscular dystrophy: the primary clinical home is the neuromuscular-disease
      chapters of the neurologic Part.
    evidence:
    - reference: PMID:32848593
      reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Complete merosin deficiency is typically associated with a more severe congenital muscular dystrophy (CMD), clinically manifested by hypotonia and weakness at birth, the development of contractures of large joints, and progressive respiratory involvement."
      explanation: Characterises the entity as a congenital muscular dystrophy, which places it in the neuromuscular chapters.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A single-gene autosomal recessive disorder whose severity is graded by residual protein,
      so the Mendelian axis is a substantive second home rather than a formality.
    evidence:
    - reference: PMID:22675738
      reference_title: "LAMA2 Muscular Dystrophy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "LAMA2-MD is inherited in an autosomal recessive manner."
      explanation: GeneReviews states the Mendelian inheritance mode that motivates this Part.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic LAMA2 variants, homozygous or compound heterozygous. Truncating alleles
    predominate in the congenital severe form; missense alleles are over-represented in the
    milder limb-girdle form, which is the molecular basis of the complete/partial deficiency
    split.
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of LAMA2 muscular dystrophy is established in a proband with suggestive findings and biallelic (homozygous or compound heterozygous) pathogenic variants in LAMA2 identified by molecular genetic testing."
    explanation: States the biallelic requirement that defines the recessive mode.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonsense variants were more frequent in LAMA2-CMD (56.9%, 66/116) than in LGMDR23 (21.4%, 3/14), while missense disease-causing variants were more frequent in LGMDR23 (71.4%, 10/14) than in LAMA2-CMD (12.9%, 15/116)."
    explanation: Quantifies the allele-class skew between the congenital and limb-girdle ends of the same recessive series.
prevalence:
- population: Worldwide, children
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.8
  notes: >-
    Reported as approximately 4 in 500,000 children, which normalises to 0.8 per 100,000. This
    is a review's summary figure rather than a registry count, and published estimates for
    LAMA2-related dystrophy as a whole span roughly an order of magnitude between countries, so
    the coarse band carries more weight than the point value.
  evidence:
  - reference: PMID:31308722
    reference_title: "Current understanding and treatment of cardiac and skeletal muscle pathology in laminin-α2 chain-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LAMA2 MD is the most common congenital muscular dystrophy, affecting approximately 4 in 500,000 children."
    explanation: Gives the population rate normalised into this record.
- population: Switzerland, ages 0-23 years
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.8
  notes: >-
    A registry-denominator minimum rather than an ascertained rate: the numerator is patients
    enrolled in the Swiss Registry for Neuromuscular Disorders, so unenrolled cases are missed
    and the authors state the figure as a floor. It covers LAMA2-related dystrophy as a whole,
    of which the congenital severe form curated here was 14 of 18 patients.
  evidence:
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, the prevalence of LAMA2-RD in Switzerland for the age group 0-23 years is at least 17/2 123 128 = 0.8 : 100 000."
    explanation: States the registry-based minimum prevalence recorded here.
- population: Congenital muscular dystrophy cohorts, worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Share of the congenital muscular dystrophy population rather than a population rate. Recorded
    because it is the figure most often quoted for this disease and is easily mistaken for one.
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAMA2-CMD is one of the most common congenital muscular dystrophies (CMDs) in the world, accounting for 36.4%-48% of CMD patients"
    explanation: Gives the proportion of congenital muscular dystrophy attributable to this entity.

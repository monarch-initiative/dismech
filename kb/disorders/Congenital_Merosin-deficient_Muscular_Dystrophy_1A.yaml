    snippet: "Brain histopathology included focal disruptions of the glia limitans associated with abnormal cerebral cortical lamination or arrested cerebellar granule cell migration."
    explanation: Directly demonstrates the pial boundary breach and its migration consequence in human MDC1A neuropathology.
- name: Aberrant Cortical Neuronal Migration
  biological_scale: TISSUE
  description: Loss of pial boundary integrity permits abnormal cortical neuronal migration
    and lamination. Human pathology supports this route to cobblestone malformation and related
    cortical abnormalities. The authors propose that such abnormalities can underlie seizures
    or intellectual disability in a subset, but one autopsied patient had normal cognition and
    no seizures despite cobblestone pathology. Seizures also occur without a visible cortical
    anomaly.

animal_models:
- name: dy3K/dy3K laminin alpha2 null mouse
  species: Mouse
  genotype: Lama2 targeted null (dy3K), homozygous
  publication: PMID:31586140
  description: >-
    The complete-null mouse and the most severe of the family, dying by about three weeks. Its
    value is temporal resolution rather than fidelity of course: it is the model in which the
    sequence of early events has been mapped, showing apoptosis at postnatal day 1, full
    dystrophic architecture with inflammation and matrix deposition by day 4, peak deterioration
    at day 7, and severe involvement of the masticatory muscles that plausibly underlies the
    malnutrition and death.
  evidence:
  - reference: PMID:31586140
    reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we unveil the first pathogenic events and characterise the disease development in a mouse model for LAMA2-CMD (dy3K/dy3K), by analysing muscles at perinatal, neonatal and postnatal stages."
    explanation: Establishes the model and the developmental-timing question it was used to answer.
  modeled_mechanisms:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the apoptotic and necrotic myofibre death of the human disease and dates its
      onset to the first postnatal day.
    limitations: >-
      The murine course is compressed into three weeks against a human course of decades, so the
      model reports the sequence of events faithfully but not their timescale. The masticatory
      involvement that dominates mortality here has no clear human counterpart as a cause of
      death.
    readouts:
    - name: Apoptotic muscle fibres at postnatal day 1
      target: Myofibre Degeneration, Necrosis and Apoptosis
      direction: INCREASED
      interpretation: Dates the onset of the apoptotic component of fibre loss.
      evidence:
      - reference: PMID:31586140
        reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that apoptotic muscle fibres were present as early as postnatal day 1."
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:31586140
      reference_title: "Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K) mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Other typical dystrophic hallmarks (muscle degeneration, inflammation, and extensive production of the extracellular matrix proteins) were clearly evident already at postnatal day 4, and the highest degree of muscle deterioration was reached by day 7."
      explanation: Supports treating this model as informative for the degeneration node by showing it reproduces the full dystrophic picture.
  - target: Dysregulated Muscle Proteostasis and Autophagy
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Autophagy-related gene expression is raised in dy3K/dy3K muscle, and the same upregulation
      was confirmed in human MDC1A muscle, so the model is not merely analogous here.
    limitations: >-
      The therapeutic inference rests on systemic 3-methyladenine, a non-selective
      phosphoinositide 3-kinase inhibitor, so the rescue is not a clean test of autophagy alone.
    readouts:
    - name: Autophagy-related gene expression in dystrophic muscle
      target: Dysregulated Muscle Proteostasis and Autophagy
      direction: INCREASED
      interpretation: Molecular correlate of the enhanced autophagic flux this node asserts.
      evidence:
      - reference: PMID:21920942
        reference_title: "Autophagy is increased in laminin α2 chain-deficient muscle and its inhibition improves muscle morphology in a mouse model of MDC1A."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "Using the dy(3K)/dy(3K) mouse model of laminin α2 chain deficiency and MDC1A patient muscle, we show here that expression of autophagy-related genes is upregulated in laminin α2 chain-deficient muscle."
        explanation: Reports the measurement in both mouse and human muscle.
    evidence:
    - reference: PMID:21920942
      reference_title: "Autophagy is increased in laminin α2 chain-deficient muscle and its inhibition improves muscle morphology in a mouse model of MDC1A."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, we found that autophagy inhibition significantly improves the dystrophic dy(3K)/dy(3K) phenotype."
      explanation: The intervention result that makes this model informative for the autophagy node.
- name: dyW/dyW laminin alpha2-deficient mouse
  species: Mouse
  genotype: Lama2 targeted mutation (dyW), homozygous, expressing a truncated laminin alpha2
  publication: PMID:15578095
  description: >-
    The workhorse preclinical model, expressing a small amount of truncated protein and surviving
    long enough for intervention studies. Most of the therapeutic hypotheses in this disease were
    tested here first: Bax deletion and Bcl-2 overexpression, omigapil, integrin alpha-7
    overexpression, and the mini-agrin linker. That four mechanistically unrelated interventions
    each extend survival in the same animal is the strongest single argument that the downstream
    cascade is attackable.
  evidence:
  - reference: PMID:15578095
    reference_title: "Inhibition of apoptosis improves outcome in a model of congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To examine the significance of apoptosis in CMD1A pathogenesis, we determined whether pathogenesis in laminin-alpha2-deficient (Lama2(-/-)) mice could be ameliorated by inhibiting apoptosis"
    explanation: Establishes the model and the interventional use it is cited for here.
  modeled_mechanisms:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Apoptotic fibre death is present and is causally load-bearing: removing Bax or
      overexpressing Bcl-2 each produce a severalfold lifespan increase, and Bax inactivation also
      improves growth, histology and contractures.
    limitations: >-
      dyW mice express a truncated laminin alpha2 fragment rather than being a complete null, so
      the genotype corresponds to a severe hypomorph rather than to the biallelic-null human
      genotype it is usually taken to model.
    readouts:
    - name: Lifespan under Bax inactivation or Bcl-2 overexpression
      target: Myofibre Degeneration, Necrosis and Apoptosis
      direction: RESTORED
      interpretation: Rescue readout establishing apoptosis as a causal contributor rather than an epiphenomenon.
      evidence:
      - reference: PMID:15578095
        reference_title: "Inhibition of apoptosis improves outcome in a model of congenital muscular dystrophy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that both of these genetic interventions produced a several-fold increase in the lifespan of Lama2(-/-) mice."
        explanation: Reports the survival measurement behind this readout.
    evidence:
    - reference: PMID:15578095
      reference_title: "Inhibition of apoptosis improves outcome in a model of congenital muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Bax inactivation also improved postnatal growth rate and myofiber histology and decreased fixed contractures of Lama2(-/-) mice."
      explanation: Shows the rescue extends to histology and contracture, not survival alone.
  - target: Failure of Basal Lamina to Sarcolemma Receptor Coupling
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Used as the test bed for restoring the coupling directly. Transgenic mini-agrin, which binds
      dystroglycan but not integrin alpha-7-beta-1, and a perlecan-derived chimeric protein each
      ameliorate the disease, including when expression is started late. Separately, transgenic
      integrin alpha-7 overexpression restores sarcolemmal alpha-7-beta-1 and improves pathology
      and life expectancy. Together these attack the two arms of the lost linkage independently.
    limitations: >-
      Both are transgenic overexpression experiments in the mouse, not deliverable therapies, and
      neither restores laminin-211 itself. The mini-agrin construct rebuilds only the dystroglycan
      arm and the integrin transgene only the integrin arm, so neither is a complete substitution.
    readouts:
    - name: Lifespan and health under mini-agrin or perlecan-chimera expression
      target: Failure of Basal Lamina to Sarcolemma Receptor Coupling
      direction: RESTORED
      interpretation: Rescue by re-linking the basement membrane to dystroglycan, which is the specific coupling this node reports as lost.
      evidence:
      - reference: PMID:17389231
        reference_title: "Linker molecules between laminins and dystroglycan ameliorate laminin-alpha2-deficient muscular dystrophy at all disease stages."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Now we show that late-onset expression of mini-agrin still prolongs life span and improves overall health, although not to the same extent as early expression."
        explanation: Reports the survival and health measurement behind this readout, including its dependence on timing.
    evidence:
    - reference: PMID:17389231
      reference_title: "Linker molecules between laminins and dystroglycan ameliorate laminin-alpha2-deficient muscular dystrophy at all disease stages."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These experiments are conceptual proof that linking the basement membrane to dystroglycan by specifically designed molecules or by endogenous ligands, could be a means to counteract MDC1A at a progressed stage of the disease, and thus opens new possibilities for the development of treatment options for this muscular dystrophy."
      explanation: The authors' own statement that the rescue works by restoring the matrix-to-dystroglycan link, which is what makes this model informative for the coupling node.
    - reference: PMID:21652631
      reference_title: "Transgenic overexpression of the α7 integrin reduces muscle pathology and improves viability in the dy(W) mouse model of merosin-deficient congenital muscular dystrophy type 1A."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Enhanced expression of the α7 integrin restored sarcolemmal localization of the α7β1 integrin to laminin-α2-deficient myofibers, changed the composition of the muscle extracellular matrix, reduced muscle pathology, maintained muscle strength and function and improved the life expectancy of dy(W⁻/⁻) mice."
      explanation: Establishes the integrin arm of the same rescue, independently of the dystroglycan arm.
- name: dy2J/dy2J splice-mutant mouse
  species: Mouse
  genotype: Lama2 dy2J splice-site mutation, homozygous
  publication: PMID:31341277
  description: >-
    A partial-deficiency model, carrying a splice mutation that yields a truncated but partly
    functional protein, with a milder and longer course. It is the natural model for the
    limb-girdle subtype and the one in which reversibility has been shown: CRISPR-dCas9
    upregulation of the paralogous Lama1 improved and partly reversed established fibrosis and
    hindlimb paralysis when started in symptomatic animals, against the prior expectation that
    fibrotic change is irreversible.
  evidence:
  - reference: PMID:31341277
    reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We modulate expression of Lama1 in the dy2j/dy2j mouse model of MDC1A using an adeno-associated virus (AAV9) carrying a catalytically inactive Cas9 (dCas9), VP64 transactivators and single-guide RNAs that target the Lama1 promoter."
    explanation: Establishes the model and the intervention it was used to test.
  modeled_mechanisms:
  - target: Endomysial Fibrosis and Replacement of Muscle
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Upregulating the paralogous laminin-alpha1 prevented fibrosis and paralysis when given
      pre-symptomatically, and improved and partly reversed both when given after they were
      established.
    limitations: >-
      The rescue is by a paralogous laminin substituting for the missing one, not by restoring
      laminin-alpha2, so it tests the reversibility of the downstream fibrosis rather than the
      correction of the primary lesion. dy2J is a partial-deficiency allele, so the result speaks
      most directly to the milder end of the human spectrum. A companion study in a
      complete-deletion model found high-dose mortality and non-sustained expression, which the
      dy2J experiment did not surface.
    readouts:
    - name: Muscle fibrosis and hindlimb paralysis after Lama1 upregulation
      target: Endomysial Fibrosis and Replacement of Muscle
      direction: RESTORED
      interpretation: Reversal of established fibrotic change, which is the claim this link records.
      evidence:
      - reference: PMID:31341277
        reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, we show that dystrophic features and disease progression were improved and reversed when the treatment was initiated in symptomatic dy2j/dy2j mice with apparent hindlimb paralysis and muscle fibrosis."
        explanation: Reports the reversal measurement behind this readout.
    evidence:
    - reference: PMID:31341277
      reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "When pre-symptomatic mice were treated, Lama1 was upregulated in skeletal muscles and peripheral nerves, which prevented muscle fibrosis and paralysis."
      explanation: Establishes the preventive arm of the rescue alongside the reversal arm.
    - reference: PMID:38777118
      reference_title: "Lama1 upregulation prolongs the lifespan of the dy(H)/dy(H) mouse model of LAMA2-related congenital muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, we reveal the limitations of LAMA1 upregulation, including high-dose mortality and non-sustained expression, which require further optimization in future studies."
      explanation: The independent limitation recorded against this strategy, from a different Lama2 model.
- name: lama2 mutant zebrafish
  species: Zebrafish
  genotype: lama2 loss of function
  publication: PMID:31754462
  description: >-
    An optically accessible model used for live fibre tracking and mechanistic perturbation.
    Live tracking of individual fibres showed that detachment is not immediately
    lethal, since detached fibres retain sarcolemmal integrity and attempt reattachment,
    extension and fusion before dying, which reframed the disease as having a window in which a
    detached fibre can be re-functionalised.
  evidence:
  - reference: PMID:31754462
    reference_title: "Cellular rescue in a zebrafish model of congenital muscular dystrophy type 1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a process we show can be achieved by muscle specific or systemic Laminin delivery"
    explanation: States the rescue the model demonstrates, which is what establishes it as an interventional as well as an observational system.
  modeled_mechanisms:
  - target: Contraction-Induced Myofibre Detachment and Mechanical Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces myofibre detachment from the basal lamina and, uniquely, allows it to be watched
      in a living animal fibre by fibre.
    limitations: >-
      Zebrafish larval muscle is anatomically and mechanically unlike mammalian limb muscle, and
      the observations are made over hours in a larva rather than over years in a child, so the
      delay between detachment and death cannot be assumed to have the same duration in humans.
      In the separate Candyfloss BTS experiment, contraction inhibition began before spontaneous
      movement and also impaired normal muscle development. Washout was followed by structural
      damage in mutants and partial force recovery in siblings; this does not establish that
      immobilization benefits human MDC1A.
    readouts:
    - name: Sarcolemmal integrity and remodelling of detached fibres
      target: Contraction-Induced Myofibre Detachment and Mechanical Injury
      direction: ALTERED
      interpretation: Direct observation of the detachment event and of what the fibre does afterwards.
      evidence:
      - reference: PMID:31754462
        reference_title: "Cellular rescue in a zebrafish model of congenital muscular dystrophy type 1A."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here we show, via live tracking of individual muscle fibres, that dystrophic myofibres in the zebrafish model of MDC1A maintain sarcolemmal integrity and undergo dynamic remodelling behaviours post detachment, including focal sarcolemmal reattachment, cell extension and hyper-fusion with surrounding myoblasts."
        explanation: Reports the live-imaging measurement behind this readout.
    - name: Structural damage after contraction inhibition and washout
      target: Contraction-Induced Myofibre Detachment and Mechanical Injury
      direction: ALTERED
      interpretation: Early BTS exposure reduces structural damage; after one day of washout,
        Candyfloss mutants develop patchy birefringence defects and remain weaker than siblings.
        Normal-sibling force only partly recovers. This is a larval perturbation result, not
        evidence that immobilization restores normal muscle function in patients.
      evidence:
      - reference: PMID:26536238
        reference_title: Immobilization of Dystrophin and Laminin α2-Chain Deficient Zebrafish Larvae
          In Vivo Prevents the Development of Muscular Dystrophy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: In contrast, the Caf larvae at 5dpf were weaker than their siblings (right diagram, Panel
          D, Fig 5) and developed structural changes with patchy alterations in birefringence (Panel C,
          Fig 5). These data suggest that active movement improves the mechanical function after BTS immobilization
          in the Caf sibling group, but also introduces structural changes in the Caf mutants.
        explanation: The washout arm supports renewed activity-associated damage in the laminin-alpha2-deficient
          Candyfloss strain. Sapje dystrophin mutants behaved differently after washout; strain activity
          and mutation-specific susceptibility may both contribute.

    reference_title: Current understanding and treatment of cardiac and skeletal muscle pathology
      in laminin-α2 chain-deficient congenital muscular dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: As laminin-211 is a major component of the myocardial ECM, it is likely that its
      loss will have important implications for cardiac physiology.
    explanation: The review proposes a myocardial ECM mechanism; the intermediate cause of human
      ventricular dysfunction remains uncertain.

    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Characteristic brain white matter (WM) hypointensity on T1 magnetic resonance imaging (MRI), and increased T2 signal in the periventricular and subcortical WM, are invariably observed in most patients older than 6 months"
    explanation: Establishes the imaging finding and its near-universal presence beyond six months, supporting the VERY_FREQUENT band.
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The youngest age at which MRI showed clear white matter changes was 3 months."
    explanation: Records the earliest age at which the finding was demonstrable in this cohort.
- name: Cobblestone cortical malformation
  category: Neurologic
  description: Cobblestone cortical malformation is variably visible on MRI, often parieto-occipital.
    Six of 12 re-reviewed Swiss scans showed it, whereas a Brazilian series found one among
    52 patients. These differently assessed cohorts do not establish a single population frequency.
    Human autopsy demonstrated subtle malformation despite structurally unremarkable clinical
    MRI.
  phenotype_term:
    preferred_term: Cobblestone cortical malformation
    term:
      id: HP:0007260
      label: Type II lissencephaly
  evidence:
  - reference: PMID:39213089
    reference_title: "A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 7 patients, additional cortical abnormalities were found: parieto-occipital cobblestone malformation (six patients) and/or polymicrogyria (three patients)."
    explanation: Documents the cobblestone malformation and its parieto-occipital distribution.
  - reference: PMID:32827036
    reference_title: "Cobblestone Malformation in LAMA2 Congenital Muscular Dystrophy (MDC1A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These cases demonstrate that cobblestone malformation may be an important manifestation of the brain pathology in MDC1A and can be present even when patients have a structurally normal brain MRI."
    explanation: Selected human cases show that clinical MRI can miss subtle cobblestone pathology,
      without quantifying its frequency in unselected MDC1A.
- name: Polymicrogyria
  category: Neurologic
  description: Polymicrogyria is often occipital but can involve temporal or frontal cortex.
    It may overlap radiologically with cobblestone malformation. The 19.2% Brazilian figure
    concerns all cortical malformations, not polymicrogyria alone; an individual with extensive
    occipital malformation developed focal epilepsy and regression.
  phenotype_term:
    preferred_term: Polymicrogyria
    term:
      id: HP:0002126
      label: Polymicrogyria
  evidence:

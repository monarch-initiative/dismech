phenotypes:
- name: Neonatal hypotonia
  category: Neuromuscular
  description: Profound hypotonia can be present neonatally, with reduced spontaneous movements
    and weak cry. Early-onset hypotonia is a hallmark, but the proportion with any symptom in
    the first week does not separately measure neonatal hypotonia.
  phenotype_term:
    preferred_term: Neonatal hypotonia
    term:
      id: HP:0001319
      label: Neonatal hypotonia
  evidence:
  - reference: PMID:22675738
    reference_title: "LAMA2 Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MDC1A is typically characterized by neonatal profound hypotonia, poor spontaneous movements, and respiratory failure."
    explanation: GeneReviews names neonatal profound hypotonia as a defining manifestation.
- name: Axial muscle weakness
  category: Neuromuscular
  frequency: VERY_FREQUENT
  description: Severe axial weakness, including head and trunk flexors, is prominent in congenital
    disease; proximal limb weakness is recorded separately.
  phenotype_term:
    preferred_term: Axial muscle weakness
    term:
      id: HP:0003327
      label: Axial muscle weakness
  evidence:
  - reference: PMID:37476021
    reference_title: "LAMA2-Related Muscular Dystrophy Across the Life Span: A Cross-sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Axial and proximal muscle weakness was most pronounced."
    explanation: States the weakness distribution directly.
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical hallmarks are early-onset severe hypotonia, axial weakness, inability to achieve independent ambulation, and elevated creatine kinase (CK) levels, commonly >1,000 IU/L"
    explanation: Lists axial weakness among the defining clinical hallmarks.
  sequelae:
  - target: Inability to walk
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Severe axial and proximal weakness can prevent independent ambulation.
    evidence:
    - reference: PMID:32848593
      reference_title: 'LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers,
        and Clinical Trial Readiness.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Muscle atrophy and severe weakness typically prevent independent ambulation.
      explanation: The clinical review explicitly links muscle loss and weakness to failure
        of walking.
  - target: Delayed gross motor development
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The congenital motor deficit delays acquisition of postural and locomotor milestones.
  - target: Hyperlordosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Severe neck flexor weakness can lead to cervical lordosis in adolescence; this
      explains a specific component of the broader lordosis phenotype.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK97333/
      reference_title: LAMA2 Muscular Dystrophy - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: OTHER
      snippet: This weakness may progress to a severe cervical lordosis in late adolescence,
        affecting the capacity to swallow and increasing the risk of food aspiration.
      explanation: The preceding chapter sentence identifies neck flexor weakness; the consequence
        is specifically cervical lordosis.
- name: Inability to walk
  category: Neuromuscular
  frequency: VERY_FREQUENT
  subtype: Complete deficiency
  description: Independent walking was attained by only 1 of 42 patients classified as completely
    merosin deficient in the UK cohort. In the Chinese clinical LAMA2-CMD cohort, 18 of 98 patients
    older than 18 months walked independently; those clinical categories are not identical to
    complete deficiency. Walking may subsequently be lost.
  phenotype_term:
    preferred_term: Inability to walk
    term:
      id: HP:0002540
      label: Inability to walk
  evidence:
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Head control, independent sitting and ambulation were achieved in 76.3%, 92.6% and 18.4% of LAMA2-CMD patients at median ages of 6.0 months (range 2.0-36.0 months), 11.0 months (range 6.0-36.0 months), and 27.0 months (range 18.0-84.0 months), respectively."
    explanation: The walking denominator is 98 clinical LAMA2-CMD patients older than 18 months,
      not all 116 CMD patients or an immunostaining-defined complete-deficiency group.
  - reference: PMID:32910545
    reference_title: "LAMA2-related muscular dystrophy: Natural history of a large pediatric cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One CD and two PD subjects achieved independent ambulation."
    explanation: One of 42 patients classified as completely deficient attained independent
      walking; classification was not based on biopsy in every participant.

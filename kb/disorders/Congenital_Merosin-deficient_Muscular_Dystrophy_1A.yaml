    explanation: Records the human-versus-mouse divergence in the neuropathy's functional weight, which the node reports.
- name: Loss of Laminin-211 at the Glia Limitans and CNS Vascular Basement Membranes
  biological_scale: MOLECULAR
  description: >-
    In the brain the alpha-2 chain is contributed by astrocyte foot processes at the glia
    limitans and the blood-brain barrier. Its loss therefore destabilises two distinct CNS
    basement-membrane compartments: the perivascular one, whose failure is the leading
    explanation for the white-matter signal change, and the pial one, whose failure permits
    cortical overmigration.
  cell_types:
  - preferred_term: astrocyte endfoot at the glia limitans
    term:
      id: CL:0000127
      label: astrocyte
  cellular_components:
  - preferred_term: CNS basement membrane
    term:
      id: GO:0005604
      label: basement membrane
  downstream:
  - target: Increased Cerebral White Matter Water Content
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Increased white-matter water is attributed provisionally to impaired blood-brain
      barrier filtration after laminin-alpha2 loss. Human MR measurements support increased
      water, while the permeability mechanism remains a hypothesis and alternative myelin-related
      contributions are unresolved.
    evidence:
    - reference: PMID:37182895
      reference_title: Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2
        Related Dystrophy - a Genotype/Phenotype Correlation.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: One hypothesis is that white matter contains increased water content due to impaired
        selective filtration of blood-brain barrier caused by laminin-α2 deficiency [24, 34].
      explanation: This is the authors’ mechanistic hypothesis, not a direct human permeability
        experiment.
  - target: Pial Basement Membrane Assembly Failure
    causal_link_type: DIRECT
    description: >-
      The glia limitans is a laminin-dependent basement membrane, so withdrawal of its principal

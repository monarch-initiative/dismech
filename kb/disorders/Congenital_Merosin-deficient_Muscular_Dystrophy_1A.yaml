has_subtypes:
- name: Complete deficiency
  display_name: Complete deficiency of merosin
  description: Absent laminin alpha-2 on muscle immunostaining, usually associated with a severe
    congenital phenotype and failure to achieve independent walking. Some cohorts classify deficiency
    using genotype or clinical information when biopsy is unavailable. Complete deficiency and
    congenital clinical onset are correlated but not identical categories; rare ambulant exceptions
    occur.
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Muscle atrophy and severe weakness typically prevent independent ambulation."
    explanation: States the defining functional consequence of the complete-deficiency phenotype.
- name: Partial deficiency
  display_name: Partial deficiency of merosin
  description: 'Reduced but detectable laminin alpha-2 is often associated with a milder limb-girdle
    presentation and retained ambulation. Partial deficiency is not synonymous with late onset:
    congenital, severe presentations also occur. Cohorts classified by clinical onset or walking
    ability cannot be read as immunostaining-defined subgroups.'
  evidence:
  - reference: PMID:32848593
    reference_title: "LAMA2-Related Dystrophies: Clinical Phenotypes, Disease Biomarkers, and Clinical Trial Readiness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Partial merosin deficiency is mostly manifested by later onset limb-girdle weakness and joint contractures so that independent ambulation is typically achieved."
    explanation: Defines the partial-deficiency phenotype and its ambulatory outcome.
  - reference: PMID:9829280
    reference_title: "Laminin alpha 2-chain gene mutations in two siblings presenting with limb-girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm that mutations of the LAMA2 gene that do not completely disrupt the production of the protein can give rise to phenotypes considerably milder than classical merosin-deficient congenital muscular dystrophy."
    explanation: Establishes the residual-protein rule that makes this a graded subtype of the same disease rather than a distinct entity.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All LGMDR23 patients achieved independent ambulation at median age of 18.0 months (range 13.0-20.0 months)."
    explanation: All clinically classified LGMDR23 patients in this cohort walked independently;
      this is not a direct estimate for every patient with partial merosin staining.
pathophysiology:
- name: Biallelic LAMA2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of LAMA2, at 6q22-q23, remove or truncate the laminin alpha-2 chain.
    Most congenital-severe alleles are premature termination codons or exon deletions; missense
    alleles that leave residual protein are enriched at the milder end of the spectrum. Because
    laminin-211 is an obligate alpha2-beta1-gamma1 heterotrimer, loss of the single alpha-2
    chain removes the assembled trimer rather than merely weakening it.
  genes:
  - preferred_term: LAMA2
    term:
      id: hgnc:6482
      label: LAMA2
  downstream:
  - target: Loss of Laminin-211 from the Muscle Basal Lamina
    causal_link_type: DIRECT
    description: >-
      The alpha-2 chain is the isoform-defining subunit of laminin-211, so a null allele pair
      removes the trimer from every basement membrane that depends on it.
    evidence:
    - reference: PMID:31341277
      reference_title: "A mutation-independent approach for muscular dystrophy via upregulation of a modifier gene."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MDC1A is caused by mutations in LAMA2 that lead to nonfunctional laminin-α2, which compromises the stability of muscle fibres and the myelination of peripheral nerves."
      explanation: States the step from LAMA2 mutation to nonfunctional laminin-alpha-2 and thence to loss of fibre stability, which is this edge.
  - target: Loss of Laminin-211 from the Schwann Cell Basal Lamina
    causal_link_type: DIRECT
    description: >-
      The same null genotype removes laminin-211 from Schwann cell basal laminae, where the
      alpha-2 chain is likewise the predominant laminin alpha subunit.
  - target: Loss of Laminin-211 at the Glia Limitans and CNS Vascular Basement Membranes
    causal_link_type: DIRECT
    description: >-
      Laminin alpha-2 is deposited by astrocyte endfeet, so a systemic null genotype withdraws
      it from the pial and perivascular basement membranes of the brain as well.
  - target: Dysregulated Muscle Proteostasis and Autophagy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Laminin-alpha2 deficiency alters muscle proteostasis in experimental models;
      the intervening signalling and human causal contribution remain incompletely established.
    evidence:
    - reference: PMID:21920942
      reference_title: Autophagy is increased in laminin α2 chain-deficient muscle and its inhibition
        improves muscle morphology in a mouse model of MDC1A.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Using the dy(3K)/dy(3K) mouse model of laminin α2 chain deficiency and MDC1A
        patient muscle, we show here that expression of autophagy-related genes is upregulated
        in laminin α2 chain-deficient muscle.
      explanation: The quoted claim combines human tissue and mouse expression data; the interventional
        causal evidence is separately assigned to the mouse model.
  - target: Impaired Muscle Regeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of cell-autonomously secreted laminin-alpha2 slows myogenic precursor
      proliferation in engineered human cells and delays regeneration in muscle stem-cell-specific
      mouse knockouts.
    evidence:
    - reference: PMID:41309582
      reference_title: Loss of cell-autonomously secreted laminin-α2 drives muscle stem cell
        dysfunction in LAMA2-related muscular dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This indicated that deletion of LAMA2 in human myogenic precursor cells is sufficient
        to slow cell-cycle progression.
      explanation: Engineered LAMA2 knockout in healthy-donor iPSC-derived myogenic precursors,
        not patient cells, establishes a culture-level proliferative defect.
  - target: Loss of Myocardial Laminin-211 Support
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Systemic LAMA2 deficiency affects laminin-alpha2-dependent myocardial matrix;
      the cardiac physiological consequence is provisional.
    evidence:
    - reference: PMID:31308722
      reference_title: Current understanding and treatment of cardiac and skeletal muscle pathology
        in laminin-α2 chain-deficient congenital muscular dystrophy.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: As laminin-211 is a major component of the myocardial ECM, it is likely that
        its loss will have important implications for cardiac physiology.
      explanation: The review proposes a myocardial ECM mechanism; the intermediate cause of
        human ventricular dysfunction remains uncertain.
  evidence:
  - reference: PMID:7550355
    reference_title: "Mutations in the laminin alpha 2-chain gene (LAMA2) cause merosin-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore investigated LAMA2 for the presence of disease-causing mutations in laminin alpha 2 chain-deficient CMD families and now report splice site and nonsense mutations in two families leading presumably to a truncated laminin alpha 2 protein."
    explanation: The original report establishing LAMA2 as the mutated gene and truncation as the allele class.
  - reference: PMID:34281576
    reference_title: "Natural history and genetic study of LAMA2-related muscular dystrophy in a large Chinese cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The top three high-frequency disease-causing variants in Han Chinese patients were c.7147C > T (p.R2383*), exon 4 deletion, and c.5156_5159del (p.K1719Rfs*5)."
    explanation: Shows that the recurrent alleles in a large cohort are nonsense, whole-exon deletion and frameshift, that is, loss-of-function classes.
- name: Loss of Laminin-211 from the Muscle Basal Lamina
  biological_scale: MOLECULAR
  description: >-
    Laminin-211 is the predominant laminin of the skeletal-muscle basement membrane. Without the
    alpha-2 chain the basal lamina loses both its principal polymerising alpha subunit and the
    long-arm LG module that tethers the lattice to the fibre surface, so the sheet is destabilised
    and its cell-facing end is unanchored.
  cellular_components:
  - preferred_term: muscle fibre basal lamina
    term:
      id: GO:0005604
      label: basement membrane
  molecular_functions:
  - preferred_term: laminin-211 as a basement-membrane structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: DECREASED
  downstream:
  - target: Failure of Basal Lamina to Sarcolemma Receptor Coupling
    causal_link_type: DIRECT
    description: >-
      The receptors remain in the membrane but their ligand is gone, so the linkage fails from
      the matrix side.
  evidence:
  - reference: PMID:31308722
    reference_title: "Current understanding and treatment of cardiac and skeletal muscle pathology in laminin-α2 chain-deficient congenital muscular dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Laminin-211 is an extracellular matrix protein that functions to stabilize the basement membrane and muscle fibers during contraction."
    explanation: States the structural role of laminin-211 in the muscle basement membrane that this node reports as lost.
- name: Failure of Basal Lamina to Sarcolemma Receptor Coupling
  biological_scale: MOLECULAR
  description: Laminin-211 connects basal lamina with sarcolemmal dystroglycan and integrin
    alpha-7-beta-1 receptor systems. Its loss weakens matrix-to-cytoskeletal anchorage and adhesion-dependent
    signalling; receptor abundance and compensating laminin expression can also change. Loss
    of laminin-211 does not mean that every extracellular-matrix attachment is absent.
  molecular_functions:
  - preferred_term: laminin-211 binding by alpha-dystroglycan and integrin alpha-7-beta-1
    term:
      id: GO:0043236
      label: laminin binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: myofibre adhesion to the basal lamina
    term:
      id: GO:0031589
      label: cell-substrate adhesion
    modifier: DECREASED
  downstream:
  - target: Contraction-Induced Myofibre Detachment and Mechanical Injury
    causal_link_type: DIRECT
    description: >-
      With the mechanical arm of the bridge gone, contractile force is no longer transmitted
      across an intact linkage and the fibre pulls away from its matrix.
  - target: Loss of Laminin-Dependent Survival Signalling
    causal_link_type: DIRECT
    description: >-
      The same receptors carry adhesion-dependent survival signalling, so the signalling arm
      fails at the same moment as the mechanical one.
  evidence:
  - reference: PMID:21798088
    reference_title: "Skeletal muscle laminin and MDC1A: pathogenesis and treatment strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "By binding to the cell surface receptors dystroglycan and integrin α7β1, laminin-211 is believed to protect the muscle fiber from damage under the constant stress of contractions, and to influence signal transmission events."
    explanation: States both arms of the linkage, mechanical protection and signal transmission, that this node reports as jointly lost.
  - reference: PMID:37182895
    reference_title: "Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the LG domain (LG), which binds to the glycosylated residues of α-dystroglycan and to the integrins"
    explanation: Identifies the LG module as the receptor-binding domain, which is the structural basis for the coupling described here.
  - reference: PMID:32827036
    reference_title: "Cobblestone Malformation in LAMA2 Congenital Muscular Dystrophy (MDC1A)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This results in a loss of the stabilizing connection to the DGC, leading to a loss of structural integrity and function of various cells, including myocytes and Schwann cells"
    explanation: States the loss of the dystroglycan-complex connection following failure of merosin to serve as a matriglycan acceptor, which is the dystroglycan arm of this node.
  - reference: PMID:21652631
    reference_title: "Transgenic overexpression of the α7 integrin reduces muscle pathology and improves viability in the dy(W) mouse model of merosin-deficient congenital muscular dystrophy type 1A."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MDC1A patients exhibit reduced α7β1 integrin; however, it is unclear how the secondary loss of α7β1 integrin contributes to MDC1A disease progression."
    explanation: This abstract background statement summarizes secondary integrin reduction
      in patients; the experiment itself tested integrin overexpression in mice.
- name: Contraction-Induced Myofibre Detachment and Mechanical Injury
  biological_scale: CELLULAR
  description: Loss of laminin-dependent anchorage permits contraction-associated fibre detachment
    and injury. In lama2-deficient zebrafish, detached fibres retain membrane integrity and
    many survive or reattach; detachment is not synonymous with immediate cell death. Early
    pharmacological inhibition of contraction reduces larval structural damage but also impairs
    force development in mutants and controls. Damage reappears after washout in Candyfloss
    mutants, supporting activity-dependent injury without demonstrating human therapeutic benefit.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of anchorage increases vulnerability to degeneration, but not every detached
      fibre dies. The timing and route differ between experimental models and are not directly
      tracked in human muscle.
    evidence:
    - reference: PMID:31308722
      reference_title: Current understanding and treatment of cardiac and skeletal muscle pathology
        in laminin-α2 chain-deficient congenital muscular dystrophy.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: When the laminin-α2 chain is defective or absent, muscle fibers experience mechanical
        stress and become susceptible to tearing and fragmentation, resulting in tissue injury
        and degeneration.
      explanation: The review supports mechanical vulnerability leading to degeneration; zebrafish
        survival data limit any deterministic reading.
  evidence:
  - reference: PMID:31754462
    reference_title: "Cellular rescue in a zebrafish model of congenital muscular dystrophy type 1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show, via live tracking of individual muscle fibres, that dystrophic myofibres in the zebrafish model of MDC1A maintain sarcolemmal integrity and undergo dynamic remodelling behaviours post detachment, including focal sarcolemmal reattachment, cell extension and hyper-fusion with surrounding myoblasts."
    explanation: Directly observes myofibre detachment in a laminin-deficient animal and characterises what the fibre does next.
  - reference: PMID:26536238
    reference_title: Immobilization of Dystrophin and Laminin α2-Chain Deficient Zebrafish Larvae
      In Vivo Prevents the Development of Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: A key finding of this study is that the BTS immobilization reduced the muscle damage
      occurring in freely moving Sap and Caf larvae. Although BTS treatment generally weakened muscle
      function, as discussed above, it also abolished the difference in force between the mutated
      larvae and their normal siblings.
    explanation: BTS exposure from 18 hours to 4 days post-fertilization reduced structural damage
      in Candyfloss lama2 mutants and Sapje dystrophin mutants. Force was also reduced in both mutants
      and normal siblings, so structural protection is not restoration of normal contractile function.
  - reference: PMID:26536238
    reference_title: Immobilization of Dystrophin and Laminin α2-Chain Deficient Zebrafish Larvae
      In Vivo Prevents the Development of Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We thus consider BTS to abolish contraction in the larvae via direct effects on the contractile
      system, without interfering with motor nerves, muscle activation or imposing external constraints.
    explanation: The authors interpret this actin-myosin inhibitor as mechanical silencing through
      the contractile apparatus, not motor-nerve paralysis or external restraint. The experiment supports
      activity-dependent injury in larvae without establishing membrane rupture, a specific human
      effect size, or clinical benefit from immobilization.
- name: Loss of Laminin-Dependent Survival Signalling
  biological_scale: CELLULAR
  description: Merosin promoted stability and prevented apoptosis in cultured human rhabdomyosarcoma
    and mouse C2C12 myogenic cell lines. These were not patient-derived myoblasts. The assay
    supports a survival-signalling function but does not establish that other laminins can never
    compensate in vivo.
  biological_processes:
  - preferred_term: myofibre apoptosis
    term:
      id: GO:0010657
      label: muscle cell apoptotic process
    modifier: INCREASED
  downstream:
  - target: Myofibre Degeneration, Necrosis and Apoptosis
    causal_link_type: DIRECT
    description: Loss of laminin-dependent survival signalling can promote myotube apoptosis
      in culture; translation to its quantitative contribution to human fibre loss remains uncertain.
  evidence:
  - reference: PMID:8830776
    reference_title: "Merosin and laminin in myogenesis; specific requirement for merosin in myotube stability and survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, merosin appears to promote myotube stability by preventing apoptosis."
    explanation: States the anti-apoptotic function of merosin whose loss this node describes.
  - reference: PMID:8830776
    reference_title: "Merosin and laminin in myogenesis; specific requirement for merosin in myotube stability and survival."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Exogenous merosin converted these myotubes to a stable phenotype, while laminin had no effect."
    explanation: Merosin rescued myotube stability in the tested cell lines; the negative laminin
      comparison is assay-specific, not a universal prohibition on paralog compensation.
- name: Myofibre Degeneration, Necrosis and Apoptosis
  biological_scale: CELLULAR
  description: >-
    Fibres die by both necrosis and apoptosis, and the apoptotic component is unusually
    prominent for a muscular dystrophy, prominent enough to be a therapeutic target in its own
    right. In the dy3K/dy3K null mouse, apoptotic fibres are already present at postnatal day 1,
    before any other dystrophic hallmark. That two Bcl-2-family manipulations, and separately a
    GAPDH-Siah1 pathway inhibitor, each extend survival severalfold makes apoptosis causal here
    rather than incidental.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: muscle cell apoptotic process
    term:
      id: GO:0010657
      label: muscle cell apoptotic process
    modifier: INCREASED
  downstream:
  - target: Inflammatory Cell Recruitment
    causal_link_type: DIRECT
    description: Degenerating and necrotic fibres recruit macrophages, and the infiltrate appears
      within days of birth in the null mouse.
  - target: Impaired mastication
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Dystrophic injury of masticatory muscles is a plausible contributor to impaired
      chewing. The tissue distribution and nutritional effect are supported in dy3K mice, while
      the quantitative contribution to human feeding difficulty remains uncertain.
    evidence:
    - reference: PMID:31586140
      reference_title: Early skeletal muscle pathology and disease progress in the dy(3K)/dy(3K)
        mouse model of congenital muscular dystrophy with laminin α2 chain-deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We found that masticatory muscles were severely affected in dy3K/dy3K mice and
        this may be an underlying cause of their malnutrition, which contributes to death around
        day 21.
      explanation: Severe masticatory muscle injury is directly observed in dy3K mice; the authors

discussions:
- kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Ophthalmoparesis
  - phenotypes#Macroglossia
  - phenotypes#Gastroesophageal reflux
  - phenotypes#Reduced bone mineral density
  - phenotypes#Spinal rigidity
  - phenotypes#Neck rigidity
  - phenotypes#Hip dislocation
  - phenotypes#Pectus excavatum
  - phenotypes#Pectus carinatum
  - phenotypes#Weak cry
  discussion_id: mdc1a-gap-1
  prompt: Residual clinical attribution and model translation
  notes: The clinical findings are documented, but the reviewed sources do not establish a specific
    upstream causal route for each. Extraocular muscle involvement differs between mouse models
    and human ophthalmoparesis; tongue enlargement is not explained by a demonstrated tissue
    mechanism. Low bone density may have several determinants, and the cohort did not establish
    immobility as its sole cause. Reflux, neck and spine rigidity, hip and chest deformities,
    and weak cry have incompletely resolved contributions from muscle injury, fibrosis, posture
    or other factors. A qualified model-supported masticatory injury pathway is represented,
    but it does not establish the relative human contribution of muscle weakness, contracture
    and tongue enlargement. Supported oral-phase, nutritional and respiratory consequences are
    represented separately.
- kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Pontine hypoplasia
  - phenotypes#Enlarged cisterna magna
  - phenotypes#Blake pouch cyst
  evidence:
  - reference: PMID:39213089
    reference_title: A Multicenter Cross-Sectional Study of the Swiss Cohort of LAMA2-Related
      Muscular Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three out of four patients with epilepsy showed structural abnormalities on brain
      MRI (pontine hypoplasia = 3, Blake’s pouch cyst = 1, and mega cisterna magna = 1) but
      these abnormalities are not associated with epilepsy; only two of the patients had cortical
      malformations.
    explanation: The authors distinguish posterior-fossa/brainstem abnormalities from potentially
      epileptogenic cortical lesions.
  discussion_id: mdc1a-gap-2
  prompt: Posterior fossa developmental abnormalities
  notes: Pontine hypoplasia and posterior-fossa configuration abnormalities are documented in
    the Swiss imaging cohort, but their specific developmental connection to LAMA2 loss was
    not established. Cortical overmigration cannot automatically be extended to these anatomically
    distinct findings. A case-specific cyst-to-hydrocephalus relation is represented; these
    findings are not assumed to explain seizures.

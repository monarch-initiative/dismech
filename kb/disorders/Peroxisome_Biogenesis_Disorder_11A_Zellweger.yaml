genetic:
- name: PEX13
  gene_term:
    preferred_term: PEX13
    term:
      id: hgnc:8855
      label: PEX13
  relationship_type: CAUSATIVE
  notes: >-
    The complementation group 13 (group H) gene, encoding the SH3-domain docking peroxin.
    PEX13 is one of the rarest causes of Zellweger spectrum disease - roughly twenty
    variants reported worldwide - so the allelic spectrum is small and genotype-phenotype
    correlation is correspondingly weaker than at PEX1 or PEX12. A recurrent p.Arg294Trp
    allele accounts for three of the five families in the largest reported series. Note
    that the first patient assigned to this group presented at the milder, NALD end rather
    than with classical Zellweger syndrome, so the locus was defined by a phenotype closer
    to 11B than to the 11A presentation this entry curates.

    The published alleles sort into three functional tiers rather than two: null alleles
    (p.Trp234Ter, the whole-gene deletion, the 14-bp frameshift) leave no docking complex at
    all; SH3-domain missense alleles that break self-association (p.Trp313Gly) leave a complex
    that is present but non-functional for PTS1 import; and hypomorphic or
    temperature-sensitive missense alleles (p.Ile326Thr, p.Arg294Trp) leave residual import.
    The first two tiers present as 11A, the third as 11B.
  evidence:
  - reference: PMID:10441568
    reference_title: PEX13 is mutated in complementation group 13 of the peroxisome-biogenesis
      disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PEX13 encodes a peroxisomal membrane protein with a cytoplasmically exposed SH3
      domain, and we find that expression of human PEX13 restores peroxisomal matrix-protein
      import in cells from patient PBD222.
    explanation: The functional complementation result that identified the gene, and the
      statement of its molecular role.
  - reference: PMID:35854306
    reference_title: Genotype-phenotype correlations and disease mechanisms in PEX13-related
      Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three out of five families carried a recurrent p.Arg294Trp non-synonymous variant.
    explanation: Identifies the recurrent allele in the largest PEX13 series.
  - reference: PMID:37962062
    reference_title: "Severe Zellweger spectrum disorder due to a novel missense variant
      in the PEX13 gene: A case report and the literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PEX13 gene variants are rare causes of ZSDs, with only 21 cases reported
      worldwide and none in China.
    explanation: Quantifies how few PEX13 cases exist, which is why the allelic spectrum is
      thin.
  - reference: PMID:19449432
    reference_title: "Zellweger syndrome caused by PEX13 deficiency: report of two novel
      mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in PEX13, which encodes peroxisomal membrane protein PEX13, are among
      the least common causes of peroxisomal biogenesis disorders with only three mutations
      reported so far.
    explanation: Records how sparse the allelic spectrum was when the classical-Zellweger
      PEX13 cases were first described.

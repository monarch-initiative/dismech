- name: Pexophagy of Import-Incompetent Peroxisomes
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Losing PEX13 does not only stop peroxisomes being filled - it appears to mark them for
    destruction. In edited cells and in zebrafish, PEX13 loss causes ubiquitinated PEX5 to
    accumulate on the peroxisomal membrane and peroxisome-derived reactive oxygen species to
    rise, and together those two signals induce pexophagy of peroxisomes that would otherwise
    be healthy. If it operates in patients it would compound the import block, because the
    residual organelle population is being cleared as well as being left empty - which is
    consistent with the reduced peroxisome number found in PEX13 patient fibroblasts.

    Curated as PROVISIONAL, not ESTABLISHED: the mechanism is demonstrated in cell lines and
    zebrafish, and no measurement in a PEX13 patient ties pexophagy to any clinical feature.
  biological_processes:
  - preferred_term: autophagy of peroxisome
    modifier: INCREASED
    term:
      id: GO:0030242
      label: autophagy of peroxisome
  - preferred_term: protein ubiquitination
    modifier: INCREASED
    term:
      id: GO:0016567
      label: protein ubiquitination
  evidence:

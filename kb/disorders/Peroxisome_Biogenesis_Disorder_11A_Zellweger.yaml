    reference_title: PEX13 prevents pexophagy by regulating ubiquitinated PEX5 and peroxisomal
      ROS.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we found that PEX13, a component of the peroxisomal matrix import system, is
      required to prevent the degradation of otherwise healthy peroxisomes
    explanation: The core finding - PEX13 restrains pexophagy, so its loss releases it. Graded
      MODEL_ORGANISM because this headline claim rests on the zebrafish arm as well as the cell
      lines; the cell-line mechanism is quoted separately below as IN_VITRO, which is the split
      a mixed-source paper calls for.
  - reference: PMID:36541703
    reference_title: PEX13 prevents pexophagy by regulating ubiquitinated PEX5 and peroxisomal
      ROS.

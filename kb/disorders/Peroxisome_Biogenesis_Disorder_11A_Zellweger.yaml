    PEX13 patient muscle and fibroblasts show respiratory-chain abnormalities and
    mislocalised mitochondria alongside the peroxisomal defect, and Pex13-null cerebellar
    neurons show mitochondrial dysfunction with elevated reactive oxygen species. Whether
    this is a driver of the neuronal loss or a downstream consequence of it is the open
    question; it is curated as PROVISIONAL because the observations are consistent across
    human tissue and mouse neurons but the causal direction has not been tested.

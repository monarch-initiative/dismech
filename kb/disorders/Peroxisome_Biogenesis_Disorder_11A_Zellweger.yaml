- name: Plasmalogen Deficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Ether phospholipid synthesis begins in the peroxisome, so plasmalogens - major
    constituents of myelin - and DHA are not made. This is the deficiency half of the
    signature and the one most plausibly linked to the white-matter disease. In the
    brain-restricted PEX13 mouse it is the half that is present: plasmalogens fall while
    VLCFA stay normal, which dissociates the two arms of the biochemical lesion.
  biological_processes:

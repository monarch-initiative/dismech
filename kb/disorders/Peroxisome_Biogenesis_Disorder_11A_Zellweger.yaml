    Zellweger spectrum disease technically feasible, which matters most for the severe form
    because its window for any intervention is shortest.
  evidence:
  - reference: PMID:28677031
    reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as
      diagnostic markers for Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Implementation of C26:0-lysoPC measurement in the diagnostic work-up when
      suspecting a ZSD is advised.
    explanation: The authors' recommendation that establishes this analyte as a routine marker
      for the disease group.
  readouts:
  - target: Accumulation of Very-Long-Chain and Branched-Chain Fatty Acids
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Elevated dried-blood-spot C26:0-lysoPC reports peroxisomal beta-oxidation
      failure.
    evidence:
    - reference: PMID:28677031
      reference_title: Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as
        diagnostic markers for Zellweger spectrum disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Elevated C26:0-lysoPC levels (>72 nmol/L) were found in 86/91 ZSD DBS
      explanation: Quantifies the sensitivity of this readout against the block it reports.
- name: Plasmalogens
  presence: Decreased
  biomarker_term:
    preferred_term: ether lipid
    term:
      id: CHEBI:64611
      label: ether lipid
  context: >-
    Erythrocyte plasmalogens are low because ether lipid synthesis begins in the peroxisome.
    This is the deficiency half of the signature and moves in the opposite direction to the
    VLCFA markers, which is what distinguishes a biogenesis defect from an isolated
    beta-oxidation enzyme defect.
  readouts:
  - target: Plasmalogen Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reduced plasmalogens report failed peroxisomal ether lipid synthesis.
    evidence:
    - reference: PMID:12897163
      reference_title: Pex13 inactivation in the mouse disrupts peroxisome biogenesis and
        leads to a Zellweger syndrome phenotype.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Biochemical analyses of tissue and cultured skin fibroblasts from these animals
        indicated severe impairment of peroxisomal fatty acid oxidation and plasmalogen
        synthesis.
      explanation: PARTIAL because the measurement is in the Pex13-null mouse rather than in
        PEX13 patients; it shows both directions of the signature in one animal.
diagnosis:
- name: Plasma Very-Long-Chain Fatty Acid Profile
  description: >-
    The first-line biochemical test. Elevated C26:0 with abnormal C24/C22 and C26/C22 ratios
    points at a peroxisomal disorder before any gene is sequenced.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of ZSD is established in a proband with the suggestive clinical and
      biochemical findings above by identification of biallelic pathogenic variants in one of
      the 13 known ZSD-PEX genes.
    explanation: GeneReviews Diagnosis places biochemical findings ahead of molecular
      confirmation in the diagnostic sequence.
- name: Molecular Genetic Testing of the ZSD-PEX Genes
  description: >-
    Confirmation requires biallelic variants in one of the ZSD-PEX genes; assignment to
    PEX13 is what makes the entry PBD11 rather than another group. Because PEX13 is a rare
    cause, it is usually reached by exome sequencing rather than by targeted testing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: by identification of biallelic pathogenic variants in one of the 13 known ZSD-PEX
      genes
    explanation: States the molecular criterion.
  - reference: PMID:37962062
    reference_title: "Severe Zellweger spectrum disorder due to a novel missense variant
      in the PEX13 gene: A case report and the literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: identified by whole exome sequencing and validated by Sanger sequencing
    explanation: Shows the testing route by which a rare PEX13 case is actually reached.
- name: Complementation Analysis in Cultured Fibroblasts
  description: >-
    The historical assignment method, and still informative where sequencing is
    uninterpretable: patient fibroblasts are fused with reference cell lines and the group
    is read off from which fusion restores peroxisomal import. This is how group H/13 was
    defined before PEX13 was cloned.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:19449432
    reference_title: "Zellweger syndrome caused by PEX13 deficiency: report of two novel
      mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report on two infants whose clinical and biochemical profile was
      consistent with classical Zellweger syndrome and whose complementation analysis assigned
      them both to group H of peroxisomal biogenesis disorders.
    explanation: Shows complementation analysis assigning classical Zellweger patients to the
      PEX13 group.
treatments:
- name: Supportive and Symptomatic Management
  therapeutic_modality: OTHER
  description: >-
    There is no treatment for the biogenesis defect. Management is entirely symptomatic -
    gastrostomy feeding, anti-seizure medication, hearing aids, cataract surgery, fat-soluble
    vitamin and cholic acid supplementation, adrenal replacement. None of it restores
    peroxisomal import, and the congenital brain malformation is fixed before birth.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Severe Neurodevelopmental Impairment
    treatment_effect: MODULATES
    description: >-
      Addresses consequences - nutrition, seizures, sensory deficits - without acting on
      peroxisome biogenesis.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment of manifestations: The focus is on symptomatic therapy and may include
      gastrostomy to provide adequate calories, hearing aids, cataract removal, glasses to
      correct refractive errors, supplementation of fat-soluble vitamins, and cholic acid
      supplementation"
    explanation: GeneReviews Management states that treatment is symptomatic and enumerates
      the measures.
- name: Cholic Acid
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral cholic acid restores feedback inhibition of endogenous bile acid synthesis, so the
    hepatotoxic C27 intermediates that peroxisome-deficient hepatocytes cannot process stop
    accumulating. It is the only FDA-approved therapy for Zellweger spectrum disease and the
    only intervention in this entry that acts on a curated mechanism node rather than on a
    consequence. The trial evidence is spectrum-wide; no PEX13 patient has been reported on
    it, so its use here is by extension from the shared biochemical lesion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholic acid
      term:
        id: CHEBI:16359
        label: cholic acid
  target_mechanisms:
  - target: Accumulation of Very-Long-Chain and Branched-Chain Fatty Acids
    treatment_effect: INHIBITS
    description: >-
      Suppresses synthesis of the atypical C27 bile-acid intermediates that accumulate because
      peroxisomal side-chain shortening is blocked. It does not restore peroxisomal import, so
      the other accumulating substrates are unaffected.
  - target: Progressive Hepatic Injury
    treatment_effect: INHIBITS
    description: >-
      Removing the hepatotoxic intermediates is what improves the liver chemistry.
  evidence:
  - reference: PMID:28644367
    reference_title: Oral Cholic Acid Is Efficacious and Well Tolerated in Patients With Bile
      Acid Synthesis and Zellweger Spectrum Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cholic acid significantly improved urine bile acid metabolite scores (P <
      0.0001) and serum aspartate aminotransferase and alanine aminotransferase (P < 0.0001)
      in patients with SED and ZSD.
    explanation: PARTIAL because the trial enrolled the Zellweger spectrum as a whole rather
      than PEX13 patients; the fall in atypical urinary bile acids is the direct readout of
      the targeted mechanism and the transaminase fall is the hepatic consequence.
  - reference: PMID:27469511
    reference_title: Cholic acid therapy in Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In patients with advanced liver disease (n = 4), cholic acid treatment resulted
      in increased levels of plasma transaminases, bilirubin and cholic acid with only a minor
      reduction in bile acid intermediates.
    explanation: The safety caveat that qualifies the treatment - in the patients with the
      worst liver disease the drug worsened liver chemistry rather than improving it. PARTIAL
      because it supports the caution, not the efficacy claim.
  - reference: PMID:27469511
    reference_title: Cholic acid therapy in Zellweger spectrum disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, caution is needed in patients with advanced liver disease due to possible
      hepatotoxic effects.
    explanation: The authors' own conclusion, recorded here as the agents-to-use-with-care
      statement for this treatment.
- name: Adrenal Replacement Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Glucocorticoid replacement where adrenal insufficiency is documented. GeneReviews asks for
    ACTH and cortisol by age one and annually thereafter, because the insufficiency is often
    subclinical when it starts. The screening and the treating are deliberately separate steps:
    cortisone carries its own harms - growth suppression, osteoporosis - so the recommendation
    is to screen everyone and treat only those with a demonstrated insufficiency on Synacthen
    testing, not to supplement on suspicion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrocortisone
      term:
        id: CHEBI:17650
        label: cortisol
  target_mechanisms:
  - target: Adrenocortical Insufficiency
    treatment_effect: RESTORES
    description: >-
      Replaces the missing hormone output; it does not correct the VLCFA accumulation that
      impaired steroidogenesis.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: adrenal replacement therapy; vitamin D supplementation and consideration of
      bisphosphonates for osteopenia
    explanation: GeneReviews Management lists adrenal replacement among the symptomatic
      measures.
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: only patients with a true insufficiency (i.e. altered Synacthen test) should be
      treated
    explanation: The treat-only-if-confirmed rule, which exists because the supplementation
      itself causes growth suppression and osteoporosis. Symmetric to the cholic-acid caution
      above - both are treatments whose harm is documented alongside their benefit.
- name: Anti-Seizure Medication
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Seizure control in an epilepsy that arises from a fixed cortical malformation, so the
    aim is symptomatic control rather than modification of the underlying lesion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_mechanisms:
  - target: Impaired Neuronal Migration and Neurogenesis
    treatment_effect: MODULATES
    description: >-
      Suppresses seizures arising from the cortical malformation. The malformation itself is
      fixed before birth and is not modified.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: anti-seizure medication, early intervention services for developmental delay and
      intellectual disability
    explanation: GeneReviews Management lists anti-seizure medication.
- name: Docosahexaenoic Acid Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    DHA is one of the lipids peroxisome-deficient cells cannot make, so replacing it is a
    mechanistically obvious idea. It does not work. A randomised, double-blind,
    placebo-controlled trial in peroxisome assembly disorders found no benefit in biochemistry,
    electroretinogram or growth. It is curated here as a refuted therapy rather than omitted,
    because the rationale is intuitive enough that it keeps being proposed. It carries no
    `target_mechanisms` link deliberately: every available `treatment_effect` value asserts an
    effect on the node, and the trial's finding is that there is none.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: docosahexaenoic acid
      term:
        id: CHEBI:28125
        label: all-cis-docosa-4,7,10,13,16,19-hexaenoic acid
  evidence:
  - reference: PMID:20805528
    reference_title: "Docosahexaenoic acid therapy in peroxisomal diseases: results of a
      double-blind, randomized trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: There was no difference in the outcomes between the treated and untreated groups
      in biochemical function, electroretinogram, or growth.
    explanation: The primary result refuting DHA supplementation as a therapy for peroxisome
      assembly disorders.
  - reference: PMID:20805528
    reference_title: "Docosahexaenoic acid therapy in peroxisomal diseases: results of a
      double-blind, randomized trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: This interventional study provides Class II evidence that DHA supplementation did
      not improve the visual function or growth of treated individuals with peroxisome assembly
      disorders during an average of 1 year of follow-up in patients aged 1 to 144 months.
    explanation: The formal evidence grading, which is what makes this a settled negative rather
      than an underpowered one.
clinical_trials:
- name: NCT01668186
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    The principal longitudinal natural-history study of the peroxisome biogenesis disorders,
    prospectively following patients internationally and banking clinical, biochemical and
    genetic data. It is observational, so it carries no phase; it is listed because for a
    disease with roughly twenty reported patients worldwide, the registry is the only route to
    a described natural history.
  evidence:
  - reference: clinicaltrials:NCT01668186
    reference_title: Longitudinal Natural History Study of Patients With Peroxisome Biogenesis
      Disorders (PBD)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In spite of advancements in peroxisome biology, the pathophysiology remains
      unknown, the spectrum of phenotypes poorly characterized and the natural history not yet
      systematically reported.
    explanation: The study's own statement of the gap it exists to fill, which is the same gap
      this entry runs into for PEX13 specifically.
animal_models:
- name: Pex13-null mouse (ubiquitous Cre)
  species: Mouse
  genotype: Pex13 conditional (loxP) allele, ubiquitous Cre-mediated inactivation, homozygous
  publication: PMID:12897163
  description: >-
    The definitive whole-animal model of this disease: the orthologous gene, disrupted in
    every tissue. Unlike the Pex2-null mouse curated on the PBD3A entry, this is a same-gene
    model rather than a paralogous one.
  evidence:
  - reference: PMID:12897163
    reference_title: Pex13 inactivation in the mouse disrupts peroxisome biogenesis and leads
      to a Zellweger syndrome phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Thus, Pex13(-/-) mice reproduce many of the features of Zellweger syndrome and
      PEX13 deficiency in humans.
    explanation: The authors' own summary judgement that this model represents human PEX13
      deficiency, which is what licenses its use across the nodes below.
  modeled_mechanisms:
  - target: Failure of PTS1 and PTS2 Receptor Docking
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the import block for both cargo classes, confirming that the docking peroxin
      is required for PTS1 and PTS2 routes alike.
    limitations: >-
      The model is a null. Most human PEX13 alleles - including the recurrent p.Arg294Trp -
      are missense and may retain partial docking function, so the null does not model the
      residual-function biology that separates 11A from 11B.
    readouts:
    - name: Import of PTS1- and PTS2-tagged matrix proteins
      target: Failure of PTS1 and PTS2 Receptor Docking
      direction: DECREASED
      interpretation: Loss of import for both targeting-signal classes is the direct readout of
        a failed docking complex.
      evidence:
      - reference: PMID:12897163
        reference_title: Pex13 inactivation in the mouse disrupts peroxisome biogenesis and
          leads to a Zellweger syndrome phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: These animals lacked morphologically intact peroxisomes and showed deficient
          import of matrix proteins containing either type 1 or type 2 targeting signals.
        explanation: The direct measurement of the import defect in the model.
    evidence:
    - reference: PMID:12897163
      reference_title: Pex13 inactivation in the mouse disrupts peroxisome biogenesis and leads
        to a Zellweger syndrome phenotype.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In humans, mutations in the PEX13 gene, which encodes a peroxisomal membrane
        protein necessary for peroxisomal protein import, can lead to a Zellweger phenotype.
      explanation: States the human disease the model was built to represent.
  - target: Severe Neurodevelopmental Impairment
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the clinical syndrome, including the perinatal lethality that defines the
      severe end of the spectrum.
    limitations: >-
      Death is neonatal, so the postnatal course seen in longer-surviving human infants -
      the sensory loss, the progressive white-matter disease, the developmental regression -
      cannot be observed in this model. The brain-restricted conditional was made for that
      reason.
    readouts:
    - name: Perinatal clinical phenotype and survival
      target: Severe Neurodevelopmental Impairment
      direction: DECREASED
      interpretation: Growth restriction, hypotonia, feeding failure and neonatal death
        recapitulate the severe human presentation.
      evidence:
      - reference: PMID:12897163
        reference_title: Pex13 inactivation in the mouse disrupts peroxisome biogenesis and
          leads to a Zellweger syndrome phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: The mutant pups exhibited many of the clinical features of Zellweger syndrome
          patients, including intrauterine growth retardation, severe hypotonia, failure to
          feed, and neonatal death.
        explanation: The observed clinical phenotype of the model.
  - target: Impaired Neuronal Migration and Neurogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cortical migration defect that is otherwise inferred from human
      neuropathology.
    limitations: >-
      Mouse cortical development is lissencephalic, so the polymicrogyria seen in human ZSD
      has no direct counterpart; disordered lamination is the closest available readout.
    readouts:
    - name: Cortical lamination
      target: Impaired Neuronal Migration and Neurogenesis
      direction: ALTERED
      interpretation: Disordered lamination is the expected signature of arrested radial
        migration.
      evidence:
      - reference: PMID:12897163
        reference_title: Pex13 inactivation in the mouse disrupts peroxisome biogenesis and
          leads to a Zellweger syndrome phenotype.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: The brains of these animals showed disordered lamination in the cerebral
          cortex, consistent with a neuronal migration defect.
        explanation: The histological result establishing the migration defect in vivo.
- name: Brain-restricted Pex13 conditional mouse (Nestin-Cre)
  species: Mouse
  genotype: Pex13 conditional (loxP) allele, brain-restricted Cre-mediated inactivation
  publication: PMID:20959636
  description: >-
    Built to escape the neonatal lethality of the ubiquitous null. Most animals survive to
    about 35 days, which opens the postnatal cerebellar and glial phenotype to study. It is
    also the model that dissociates the two arms of the biochemical lesion.
  evidence:
  - reference: PMID:20959636
    reference_title: "PEX13 deficiency in mouse brain as a model of Zellweger syndrome:
      abnormal cerebellum formation, reactive gliosis and oxidative stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Thus, PEX13-deficient mice provide a valuable animal model for investigating the
      molecular basis and treatment of ZS cerebellar pathology.
    explanation: PARTIAL because the authors scope the model's value to cerebellar pathology
      specifically, not to the systemic disease.
  - reference: PMID:20959636
    reference_title: "PEX13 deficiency in mouse brain as a model of Zellweger syndrome:
      abnormal cerebellum formation, reactive gliosis and oxidative stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: PEX13 brain mutants survive into the postnatal period, with the majority dying by
      35 days, and with survival inversely related to litter size and weaning body weight.
    explanation: Establishes the survival window that makes this model usable for postnatal
      phenotypes the ubiquitous null cannot reach.
  modeled_mechanisms:
  - target: Impaired Neuronal Migration and Neurogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces impaired cerebellar development - fissure and cortical layer formation,
      granule cell migration, Purkinje cell layer development - with astrogliosis and
      microgliosis, and separately impaired proliferation and maturation of neural
      progenitors from E12.5.
    limitations: >-
      Peroxisomal function is intact outside the brain, so this model cannot address the
      hepatic, adrenal or renal disease, and the systemic metabolic milieu of a real patient
      is absent. Notably VLCFA are normal in the mutant brain, so any phenotype here is
      attributable to the plasmalogen arm and to local peroxisomal failure rather than to
      circulating VLCFA.
    readouts:
    - name: Cerebellar layer formation and granule cell migration
      target: Impaired Neuronal Migration and Neurogenesis
      direction: ALTERED
      interpretation: Disrupted cerebellar cytoarchitecture reports failed migration and
        maturation in a peroxisome-deficient brain.
      evidence:
      - reference: PMID:20959636
        reference_title: "PEX13 deficiency in mouse brain as a model of Zellweger syndrome:
          abnormal cerebellum formation, reactive gliosis and oxidative stress."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: PEX13 brain mutants exhibit defects in reflex and motor development that
          correlate with impaired cerebellar fissure and cortical layer formation, granule
          cell migration and Purkinje cell layer development.
        explanation: The cerebellar developmental phenotype measured in the model.
    - name: Neural progenitor proliferation and maturation
      target: Impaired Neuronal Migration and Neurogenesis
      direction: DECREASED
      interpretation: Reduced progenitor output is an earlier lesion than migration failure
        alone and helps explain the brain anatomy.
      evidence:
      - reference: PMID:29187321
        reference_title: Impaired neurogenesis and associated gliosis in mouse brain with
          PEX13 deficiency.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: we show a significant reduction in proliferation, migration, differentiation,
          and maturation of neural progenitors in embryonic E12.5 through to P3 animals
        explanation: The neurogenesis measurement in the same brain-restricted model.
    evidence:
    - reference: PMID:29187321
      reference_title: Impaired neurogenesis and associated gliosis in mouse brain with PEX13
        deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Here we used mice with brain-restricted inactivation of the peroxisome
        biogenesis gene PEX13 to model the pathophysiological features of ZS
      explanation: States the model's purpose and scope.
  - target: Secondary Mitochondrial Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cerebellar neurons from this line show mitochondrial dysfunction with elevated reactive
      oxygen species and MnSOD, together with increased apoptosis. The same line also shows an
      expanded and morphologically altered mitochondrial population in the intact brain, with
      oxidative damage to neuronal lipid and DNA, so the finding is not confined to culture.
    limitations: >-
      What the model does not settle is direction. Antioxidant treatment rescues mitochondrial
      superoxide and membrane depolarization in PEX13-deficient fibroblasts, but that rescue has
      not been run in neurons and carries no survival endpoint, so nothing yet shows that
      correcting the mitochondrial phenotype prevents the neuronal death.
    readouts:
    - name: Reactive oxygen species and MnSOD in cultured cerebellar neurons
      target: Secondary Mitochondrial Dysfunction
      direction: INCREASED
      interpretation: Elevated ROS and the compensatory MnSOD rise report mitochondrial
        oxidative stress in peroxisome-deficient neurons.
      evidence:
      - reference: PMID:20959636
        reference_title: "PEX13 deficiency in mouse brain as a model of Zellweger syndrome:
          abnormal cerebellum formation, reactive gliosis and oxidative stress."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: cultured cerebellar neurons from E19 PEX13-null mice exhibit elevated levels
          of reactive oxygen species and mitochondrial superoxide dismutase-2 (MnSOD), and show
          enhanced apoptosis together with mitochondrial dysfunction
        explanation: The direct measurement of mitochondrial dysfunction and oxidative stress
          in the model.
    - name: Brain mitochondrial population and neuronal oxidative damage
      target: Secondary Mitochondrial Dysfunction
      direction: ALTERED
      interpretation: An expanded, morphologically modified mitochondrial population with lipid
        and DNA oxidation products reports the phenotype in the intact brain rather than in
        culture.
      evidence:
      - reference: PMID:27514574
        reference_title: Mitochondrial changes and oxidative stress in a mouse model of
          Zellweger syndrome neuropathogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Using a mouse model of ZS with brain-restricted deficiency of the peroxisome
          biogenesis protein PEX13, we demonstrated an expanded and morphologically modified
          brain mitochondrial population.
        explanation: The in vivo measurement, in the same brain-restricted line.
      - reference: PMID:27514574
        reference_title: Mitochondrial changes and oxidative stress in a mouse model of
          Zellweger syndrome neuropathogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Significant oxidative damage to neurons in brain was indicated by products of
          lipid and DNA oxidation.
        explanation: The oxidative-damage endpoint measured in brain tissue.
  - target: Plasmalogen Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Plasmalogens fall in the mutant brain, so the deficiency arm is reproduced.
    limitations: >-
      Only one arm of the biochemical signature is present - VLCFA are normal - so this model
      reproduces the plasmalogen lesion without the accumulation lesion that accompanies it in
      patients.
    readouts:
    - name: Brain plasmalogen content
      target: Plasmalogen Deficiency
      direction: DECREASED
      interpretation: Reduced brain plasmalogen reports failed peroxisomal ether lipid
        synthesis in situ.
      evidence:
      - reference: PMID:20959636
        reference_title: "PEX13 deficiency in mouse brain as a model of Zellweger syndrome:
          abnormal cerebellum formation, reactive gliosis and oxidative stress."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The impact on peroxisomal metabolism in the mutant brain is mixed: plasmalogen
          content is reduced, but very-long-chain fatty acids are normal."
        explanation: Reports both the reproduced arm and the missing one.
discussions:
- discussion_id: pbd11a_docking_versus_recycling
  kind: INTERPRETATION
  attaches_to:
  - pathophysiology#Failure of PTS1 and PTS2 Receptor Docking
  - pathophysiology#Disrupted PEX13-PEX14 Docking Complex
  prompt: Does it matter mechanistically that PEX13 fails at docking rather than at receptor
    recycling?
  rationale: >-
    The KB now curates four PEX loci, and three of them - PEX1, PEX6, PEX12 - break the same
    half of the import cycle: the receptor docks and unloads, but is not exported back to the
    cytosol for reuse. PEX13 breaks the other half. The clinical convergence is nearly
    complete, which is the honest headline: a child with PBD11A is not distinguishable at the
    bedside from a child with PBD3A, and the biochemical screen does not separate them either.

    Two things do differ, and both are cell-biological rather than clinical. First, cargo
    selectivity: disrupting PEX13 self-association blocks PTS1 import specifically while
    leaving PTS2 routes and the PEX13-PEX14 interaction intact, so particular PEX13 alleles
    can produce a partial import defect of a kind the retrotranslocation mutants do not.
    Second, the fate of PEX5. In a recycling defect PEX5 accumulates at or in the membrane; in
    a docking defect it should not arrive there at all. That difference has not been used
    diagnostically and is recorded here as a mechanistic distinction rather than a clinical one.
  evidence:
  - reference: PMID:23716570
    reference_title: Functional analysis of PEX13 mutation in a Zellweger syndrome spectrum
      patient reveals novel homooligomerization of PEX13 and its role in human peroxisome
      biogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We demonstrate that the import of PTS1 (peroxisomal targeting signal 1) proteins
      is specifically disrupted when homooligomerization of PEX13 is interrupted.
    explanation: The cargo-selectivity result that distinguishes a docking-step lesion from a
      recycling-step one.
- discussion_id: pbd11a_mitochondrial_causal_direction
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Secondary Mitochondrial Dysfunction
  prompt: Is the mitochondrial abnormality in PEX13 deficiency a driver of neuronal loss or a
    consequence of it?
  rationale: >-
    Mitochondrial mislocalisation and respiratory-chain abnormality are documented in PEX13
    patient muscle and fibroblasts, and Pex13-null cerebellar neurons show mitochondrial
    dysfunction with elevated ROS and increased apoptosis. Both observations are correlative.
    Peroxisomes and mitochondria share fission machinery and their beta-oxidation pathways are
    metabolically coupled, so a causal link is plausible in either direction, and dying neurons
    have abnormal mitochondria for reasons that have nothing to do with peroxisomes. The
    question matters because it is the only node in this entry that suggests a druggable
    target: if mitochondrial oxidative stress drives the neuronal loss, antioxidant or
    mitochondrially targeted intervention has a rationale, whereas if it is downstream it does
    not.

    Part of that experiment has been done. Antioxidant treatment rescues mitochondrial superoxide
    and membrane depolarization in PEX13-deficient mouse fibroblasts, and the mitochondrial
    phenotype is present in the intact brain and not only in culture. What is missing is the
    combination that would settle direction: the same rescue in a neuron, read out against cell
    survival rather than against the mitochondrial measurements themselves. A correctable
    phenotype in a fibroblast says nothing about whether correcting it keeps a neuron alive.
  proposed_experiments:
  - experiment_id: pbd11a_mito_rescue
    name: Antioxidant rescue in PEX13-deficient neurons, read out on survival
    description: >-
      Repeat the antioxidant rescue already reported in PEX13-deficient fibroblasts, but in
      cerebellar neurons from brain-restricted Pex13 mutants, and make the primary endpoint
      apoptosis and survival rather than superoxide or membrane potential. Untreated mutant and
      wild-type neurons as controls.
    would_support:
    - pathophysiology#Secondary Mitochondrial Dysfunction
    supporting_outcome:
    - >-
      Reduced apoptosis in treated mutant neurons, approaching wild-type rates, would place
      mitochondrial oxidative stress upstream of the neuronal death.
    refuting_outcome:
    - >-
      Apoptosis unchanged despite normalised ROS would place the mitochondrial abnormality
      downstream of, or parallel to, the lethal lesion.
- discussion_id: pbd11a_pexophagy_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Pexophagy of Import-Incompetent Peroxisomes
  prompt: Does the pexophagy released by PEX13 loss contribute to disease in patients, or is it
    a property of edited cell lines and zebrafish?
  rationale: >-
    The mechanism is clean where it has been measured: PEX13 loss lets ubiquitinated PEX5
    accumulate and peroxisomal reactive oxygen species rise, and the two together drive
    otherwise healthy peroxisomes into autophagic degradation. It was shown by gene editing and
    quantitative microscopy in cultured cells and in a zebrafish model, and PEX13 protein level
    is itself downregulated during amino acid starvation as part of normal pexophagy induction.

    The gap is between that and a patient. The one human observation that points the same way -
    a reduced peroxisome count in PEX13 patient fibroblasts - is equally compatible with
    impaired organelle proliferation, and nothing has measured autophagic flux in patient
    material. This matters because the two readings imply opposite therapeutic logic. If excess
    pexophagy is clearing a residual peroxisome population that still has partial function, then
    inhibiting autophagy preserves it, which is the rationale behind trials of
    hydroxychloroquine in other peroxisome biogenesis disorders. If the peroxisomes being
    cleared are import-dead anyway, preserving them achieves nothing. Note that those trials
    exclude PEX13, so the question has not been asked at this locus even indirectly.
  evidence:
  - reference: PMID:36541703
    reference_title: PEX13 prevents pexophagy by regulating ubiquitinated PEX5 and peroxisomal
      ROS.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Using gene editing and quantitative fluorescence microscopy on culture cells and a
      zebrafish model system, we found that PEX13, a component of the peroxisomal matrix import
      system, is required to prevent the degradation of otherwise healthy peroxisomes.
    explanation: Graded MODEL_ORGANISM because the sentence names a zebrafish model, which is
      in vivo animal data, and that is the more probative half for a translational-validity
      question; the cell-line half of the same paper is cited separately as IN_VITRO on the
      pathophysiology node. PARTIAL because it names exactly the systems the finding rests on,
      which is the mismatch this discussion records.
- discussion_id: pbd11a_ab_boundary
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#PEX13
  - disease#
  prompt: What separates PBD11A from PBD11B, given how few PEX13 patients exist?
  rationale: >-
    At PEX1 and PEX12 the A/B severity split tracks residual function reasonably well, and
    there are enough patients to see the correlation. At PEX13 there are not. Roughly twenty
    variants are reported worldwide, and the assignment of a given case to 11A or 11B rests on
    the clinical description rather than on a measured level of residual import. Variant class
    does not settle it either: a homozygous missense allele produced a severe, fatal
    presentation, while the first patient assigned to this complementation group at all -
    the one from whom the locus was defined - had neonatal adrenoleukodystrophy, the milder
    phenotype. The boundary this entry sits on is therefore a clinical convention with thin
    genotypic support, and should be read that way.
  evidence:
  - reference: PMID:10441568
    reference_title: PEX13 is mutated in complementation group 13 of the peroxisome-biogenesis
      disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we characterize the sole representative of complementation group 13 of the
      PBDs, a patient with NALD (patient PBD222)."
    explanation: The founding case of this complementation group presented at the milder end,
      not with classical Zellweger syndrome.
  - reference: PMID:10441568
    reference_title: PEX13 is mutated in complementation group 13 of the peroxisome-biogenesis
      disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, residual matrix-protein import can be detected in cells from patient
      PBD222, consistent with the relatively mild phenotypes of the patient.
    explanation: Ties the milder phenotype to measurable residual import, which is the axis the
      A/B split is meant to capture but is rarely measured.
  - reference: PMID:10332040
    reference_title: Nonsense and temperature-sensitive mutations in PEX13 are the cause of
      complementation group H of peroxisome biogenesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A more mildly affected NALD patient (H-01), whose fibroblasts showed the
      temperature-sensitive (TS) phenotype, was homozygous for a missense mutation in the SH3
      domain of Pex13p, I326T.
    explanation: The mild half of the only reported pair of PEX13 patients contrasted directly
      by allele, and the one case where the residual-function basis of the split was measured
      rather than inferred.

notes: >-
  Scope and naming. Two numbering systems collide on this disease and neither is a severity
  grade. "11" is the OMIM PEX-series index for PEX13; "13" and "H" are the two complementation
  groups assigned by cell fusion in different laboratories before the gene was cloned. The A/B
  suffix is the severity split, and this entry curates the A end. The KB now holds Peroxisome
  Biogenesis Disorder 1B (PEX1), 3A (PEX12), 4B (PEX6) and 11A (PEX13), spanning two severity
  tiers across four peroxins - three of which act in receptor recycling and one, this one, in
  docking.

  Why this is not a duplicate of PBD3A. The two entries share their downstream half almost
  exactly, because import failure converges regardless of which step broke. They differ in the
  upstream three nodes: PEX12 is a RING-finger subunit of the retrotranslocation channel that
  exports PEX5, while PEX13 is the SH3 docking peroxin that receives it. The pathograph reflects
  that, and the interpretation discussion states what does and does not follow from the
  distinction.

  GeneReviews. The chapter is written for the Zellweger spectrum as a whole rather than for
  PEX13, so evidence items quoting it are graded PARTIAL wherever the quoted sentence is
  spectrum-wide rather than reported in a PEX13 case. All four sections are mined.

  Evidence thinness. PEX13 is among the rarest ZSD genes - about twenty variants worldwide -
  so several human phenotype claims rest on a single molecularly confirmed case report rather
  than on a cohort. Where the only available evidence is from the Pex13-null mouse it is graded
  MODEL_ORGANISM and PARTIAL, and no human phenotype in this entry rests on mouse evidence alone.

  Bracketed quotes. The GeneReviews snippet for epiphyseal stippling stops short of the site it
  describes because the sentence embeds "[chondrodysplasia punctata]" and "patella[e]", and the
  reference validator strips bracketed text, so a span crossing a bracket cannot match the cache.

  Deep research. Generated by `just research-disorder falcon` with `--fallback`; falcon was not
  configured in this environment, so the run fell back to `claude_code` and the report is
  `research/Peroxisome_Biogenesis_Disorder_11A_Zellweger-deep-research-claude_code.md`
  (`fell_back: true`, `requested_provider: falcon` in its frontmatter). Its reference validation
  is clean - 49/49 resolved, none off topic. Its term validation flagged no unresolved CURIEs,
  but several of the identifiers it offered are named as different terms by the ontology, and
  two of those would have been substantive errors if copied: HP:0034512, offered for elevated
  VLCFA, is *Transitional-cell carcinoma of the ureter*, and HP:0000934, offered for
  chondrodysplasia punctata, is *Chondrocalcinosis*. Neither is bound here; epiphyseal stippling
  uses HP:0010655 instead.

  Pexophagy. An earlier draft of this entry left PEX13's autophagy role out on the grounds that
  nothing connected it to the disease. Review of the claim issue surfaced PMID:36541703, which
  does connect it: PEX13 *loss* - the disease lesion, not an engineered gain - releases pexophagy
  through ubiquitinated PEX5 and peroxisomal reactive oxygen species, in edited cells and in
  zebrafish. It is curated as a PROVISIONAL node with a HUMAN_MODEL_MISMATCH discussion rather
  than as an established mechanism, because no measurement in a patient ties it to a clinical
  feature. The earlier virophagy/pexophagy paper (PMID:27827795) is not cited as evidence; it
  concerns PEX13's role in selective autophagy generally rather than the consequence of losing it.

  Phenotypes left out, and the standard applied. Review suggested apnea, elevated hepatic
  transaminases and lissencephaly, all of which appear in the HPO annotation set for
  OMIM:614883. That annotation set is not a source this KB can quote from, so each was checked
  against the cached references instead. Elevated transaminases has a spectrum-wide sentence in
  PMID:26627182 and is now curated, graded PARTIAL on the same footing as Adrenal Insufficiency.
  Apnea and lissencephaly have no such sentence in any cached reference and remain out; they are
  real candidates and should be added when a citable source is found, rather than bound to a
  snippet that does not say them. The threshold is therefore the same across all of these -
  a quotable sentence, spectrum-wide accepted with PARTIAL - rather than stricter for some than
  others, which an earlier version of this note did not make clear.

  Not curated. The research report surfaced NCT03856866, a hydroxychloroquine trial built on the
  pexophagy rationale above, as a candidate treatment; reading the registration shows it is
  restricted to peroxisome biogenesis disorders caused by PEX1, PEX6 or PEX26, so it does not
  belong on a PEX13 entry and is not curated here.

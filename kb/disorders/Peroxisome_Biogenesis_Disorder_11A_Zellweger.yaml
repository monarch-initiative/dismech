name: Peroxisome Biogenesis Disorder 11A (Zellweger)
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 11A is the severe, Zellweger-end presentation of
  PEX13 deficiency - historically complementation group 13 (also called group H) of
  the peroxisome biogenesis disorders. PEX13 is an integral peroxisomal membrane
  protein whose cytosolically exposed SH3 domain binds the PTS1 receptor PEX5, and
  which partners PEX14 to form the docking complex: the point on the membrane at
  which a loaded matrix-protein receptor first arrives.

  That places PEX13 at a different step of the import cycle from the PEX genes the KB
  already curates. PEX12, with its paralogues PEX2 and PEX10, forms the RING-finger
  retrotranslocation channel that ubiquitinates PEX5 and exports it back to the
  cytosol; PEX1 and PEX6 are the AAA-ATPases that power that export. Those are all
  recycling defects - the receptor docks and unloads, but is never returned for
  another round. PEX13 fails earlier: the receptor cannot dock in the first place.
  The downstream consequence converges - matrix protein import collapses and the cell
  is left with peroxisomal membrane compartments containing no matrix enzymes - which
  is why the clinical picture is shared across the spectrum even though the molecular
  lesions are not.

  The biochemical signature is therefore the general biogenesis one, running in two
  directions at once: very-long-chain fatty acids, phytanic and pristanic acid,
  pipecolic acid and C27 bile-acid intermediates accumulate because nothing degrades
  them, while plasmalogens and DHA are missing because nothing synthesises them. Both
  halves injure the developing brain, the liver and the adrenal cortex, producing the
  cerebro-hepato-renal presentation Zellweger described.

  Two features are relatively specific to this locus. Import failure at the docking
  step is not uniform across cargo classes - disrupting PEX13 self-association
  selectively blocks PTS1 import while leaving the PEX13-PEX14 interaction intact -
  and patient fibroblasts and muscle show mitochondrial mislocalisation and
  respiratory-chain abnormalities alongside the peroxisomal defect, which has raised
  secondary mitochondrial dysfunction as a contributing mechanism rather than a
  bystander finding. PEX13 is among the rarest causes of Zellweger spectrum disease,
  with roughly twenty variants reported worldwide.

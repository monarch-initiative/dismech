      spans the whole of PEX13, while the other had an out-of-frame deletion of 14 bp.
    explanation: Documents complete loss of the locus and a frameshift allele in infants
      with classical Zellweger syndrome, the presentation this entry curates.
  - reference: PMID:37962062

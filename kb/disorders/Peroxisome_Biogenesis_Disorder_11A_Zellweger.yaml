- name: Failure of PTS1 and PTS2 Receptor Docking
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    PEX5 carries PTS1-tagged matrix enzymes and PEX7 carries PTS2-tagged ones; both must
    dock at the membrane before their cargo can be translocated. The PEX13 SH3 domain is
    the PEX5 docking site, so losing it stalls the cycle before unloading rather than
    after it. Both cargo classes are affected in vivo, but they are not equally sensitive:
    interrupting PEX13 homooligomerisation specifically disrupts PTS1 import.
  biological_processes:
  - preferred_term: protein import into peroxisome matrix, docking
    modifier: DECREASED
    term:
      id: GO:0016560
      label: protein import into peroxisome matrix, docking
  downstream:

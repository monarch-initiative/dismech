      peroxisome biogenesis disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: PEX13 protein has an SH3 docking site that binds to the PTS-1 receptor.
    explanation: States the molecular role that makes PEX13 a docking-step rather than a
      recycling-step peroxin.
  - reference: PMID:23716570
    reference_title: Functional analysis of PEX13 mutation in a Zellweger syndrome spectrum
      patient reveals novel homooligomerization of PEX13 and its role in human peroxisome
      biogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We demonstrate that the import of PTS1 (peroxisomal targeting signal 1) proteins
      is specifically disrupted when homooligomerization of PEX13 is interrupted.
    explanation: Establishes the cargo-class selectivity of the docking defect.
  - reference: PMID:12897163
    reference_title: Pex13 inactivation in the mouse disrupts peroxisome biogenesis and leads
      to a Zellweger syndrome phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These animals lacked morphologically intact peroxisomes and showed deficient
      import of matrix proteins containing either type 1 or type 2 targeting signals.
    explanation: Complete loss of Pex13 in vivo blocks both cargo classes, so the selectivity
      above is a property of particular alleles rather than of the gene.
- name: Collapse of Peroxisomal Matrix Protein Import
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Matrix enzymes never reach the organelle. The membrane compartment still forms - the
    "peroxisomal ghost" - which is the morphological signature distinguishing a biogenesis
    defect from a single enzyme deficiency. In PEX13 patient fibroblasts the residual
    peroxisome population is both reduced in number and abnormal in PEX13 content.

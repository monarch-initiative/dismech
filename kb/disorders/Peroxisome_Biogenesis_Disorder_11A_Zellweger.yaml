- name: Impaired Neuronal Migration and Neurogenesis
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Neuronal precursors fail to proliferate, migrate and mature normally during fetal
    brain development, producing a congenital malformation rather than a purely
    degenerative lesion. Because the lesion forms before birth, it is not reversible by
    any postnatal intervention. The PEX13 mouse adds cerebellar detail to the cortical
    picture - impaired granule cell migration and Purkinje layer formation - with
    astrogliosis and microgliosis as prominent accompaniments.
  cell_types:

pathophysiology:
- name: Biallelic PEX13 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Variants on both PEX13 alleles. The reported allelic spectrum spans whole-gene
    deletion, frameshift, nonsense and missense alleles. Where an allele sits along the
    protein matters more than its class: p.Trp234Ter truncates before the third
    transmembrane helix and the entire SH3 domain and gives classical Zellweger syndrome,
    while p.Ile326Thr, a temperature-sensitive missense change inside the SH3 domain,
    gives the milder NALD presentation. Missense is therefore not a mild class here - the
    p.Ala165Pro allele is also lethal in infancy.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: SH3 domain binding
    modifier: DECREASED
    term:

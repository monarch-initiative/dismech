      label: GTPase activity
  evidence:
  - reference: PMID:29075935
    reference_title: Novel GFM2 variants associated with early-onset neurological presentations of mitochondrial disease and impaired expression of OXPHOS subunits.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The level of mtEFG2 protein in skeletal muscle from Patient 1 was
      approximately 52% of controls
    explanation: Patient muscle carries about half the normal amount of mtEFG2.
  - reference: PPR:PPR1243461
    reference_title: In vitro splice-switching oligonucleotide rescues aberrant  <i>GFM2</i>  pseudoexon inclusion and restores mitochondrial activity
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together with reduced mtEFG2 protein levels on western blot, the findings
      supported a loss-of-function mechanism.
    explanation: >-
      Nonsense-mediated decay of the pseudoexon transcript and reduced mtEFG2
      protein in patient fibroblasts support loss of function (2026 preprint).
  - reference: PMID:26016410
    reference_title: Compound heterozygous GFM2 mutations with Leigh syndrome complicated by arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      causing aberrant splicing with premature stop codons (p.Gly50Glufs*4 and
      p.Ala677Leufs*2, respectively)
    explanation: Both alleles of the second family are predicted null alleles.
  - reference: PMID:34127662
    reference_title: Distinct mechanisms of the human mitoribosome recycling and antibiotic resistance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, FA has almost no effect on the GTPase activity of either
      EF-G1mt or EF-G2mt even up to 10 mM FA.
    explanation: Purified EF-G2mt has measurable GTPase activity, assayed here for fusidic acid sensitivity.
  - reference: PMID:34127662
    reference_title: Distinct mechanisms of the human mitoribosome recycling and antibiotic resistance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      dissociation of the mammalian 55S mitoribosomes does not require
      EF-G2mt-dependent GTP hydrolysis, which is only needed for the release of
      EF-G2mt from the dissociated large subunit
    explanation: What the GTPase activity is used for during recycling, restated from earlier biochemistry.
  downstream:
  - target: Impaired Mitochondrial Ribosome Recycling
    causal_link_type: DIRECT
    description: Less mtEFG2 leaves fewer post-termination mitoribosomes split into subunits.
- name: Impaired Mitochondrial Ribosome Recycling
  biological_scale: MOLECULAR
  description: >-
    In human mitochondria the two roles of bacterial EF-G are divided between
    paralogues: mtEFG1 catalyses only translocation during elongation, and
    mtEFG2, with the mitochondrial ribosome recycling factor, dissociates the
    55S mitoribosome into its subunits after termination. Loss of mtEFG2 is
    therefore expected to leave post-termination ribosomes unsplit and fewer
    subunits free to start new rounds of translation. Recycling itself has not
    been measured in patient cells; this step rests on the biochemistry and
    structures of the factor.
  biological_processes:
  - preferred_term: ribosome recycling
    modifier: DECREASED
    term:
      id: GO:0032790
      label: ribosome disassembly
  evidence:
  - reference: PMID:19716793
    reference_title: EF-G2mt is an exclusive recycling factor in mammalian mitochondrial protein synthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      EF-G1mt specifically catalyzes translocation, whereas EF-G2mt mediates
      ribosome recycling with human mitochondrial RRF but lacks translocation
      activity.
    explanation: Reconstituted human mitochondrial factors assign ribosome recycling to EF-G2mt alone.
  - reference: PMID:33878294
    reference_title: Structural basis of translation termination, rescue, and recycling in mammalian mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we present structural models detailing the process of
      mitochondrial ribosome recycling to explain how a dedicated elongation
      factor, mitochondrial EFG2 (mtEFG2), has specialized for cooperation with
      the mitochondrial ribosome recycling factor to dissociate the
      mitoribosomal subunits at the end of the translation process.
    explanation: Cryo-EM structures of mtEFG2 acting with the recycling factor to split the mitoribosome.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    description: >-
      Without recycled subunits, fewer mitoribosomes are available to
      translate the thirteen mitochondrial DNA-encoded subunits.
    evidence:
    - reference: PMID:29075935
      reference_title: Novel GFM2 variants associated with early-onset neurological presentations of mitochondrial disease and impaired expression of OXPHOS subunits.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        while mtEFG2 functions at the termination step of translation to
        disassemble the mitoribosome and allow subsequent cycles of
        mitochondrial protein synthesis
      explanation: Recycling is what allows the next cycle of mitochondrial protein synthesis.
- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits"
  description: >-
    Steady-state levels of mitochondrial DNA-encoded subunits of complexes I,
    III and IV fall in patient fibroblasts and muscle. Pulse labelling in
    growing fibroblasts of two patients did not detect less incorporation of
    label into new mitochondrial DNA-encoded polypeptides; the authors note
    that a recycling defect need not slow amino acid incorporation into
    nascent chains, and the fibroblast defect in one of the two was mild.
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:29075935
    reference_title: Novel GFM2 variants associated with early-onset neurological presentations of mitochondrial disease and impaired expression of OXPHOS subunits.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, a clear decrease in steady-state levels of NDUFB8 (complex I),
      CYTB and CORE2 (complex III) and COXI and COXII (complex IV) was observed
      in the fibroblasts of Patient 2 compared to controls
    explanation: Mitochondrial DNA-encoded subunits are reduced in patient fibroblasts.
  - reference: PPR:PPR1243461
    reference_title: In vitro splice-switching oligonucleotide rescues aberrant  <i>GFM2</i>  pseudoexon inclusion and restores mitochondrial activity
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Enzymatic analysis of affected fibroblasts showed reduced activity of the
      mtDNA-dependent complex IV subunit COX, with preservation of the
      nuclear-encoded complex II enzyme succinate dehydrogenase and the control
      enzyme citrate synthase, consistent with impaired mitochondrial
      translation.
    explanation: >-
      A defect confined to the mitochondrially encoded enzyme, with the
      nuclear-encoded complex II spared, points to mitochondrial translation
      (2026 preprint).
  - reference: PMID:29075935
    reference_title: Novel GFM2 variants associated with early-onset neurological presentations of mitochondrial disease and impaired expression of OXPHOS subunits.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      In the case of both Patient 1 and Patient 2, there does not appear to be
      any effect on the incorporation of ... methionine/cysteine into newly
      synthesised mitochondrial DNA-encoded proteins
    explanation: >-
      A metabolic labelling assay in growing patient fibroblasts showed no
      reduction in synthesis rate, so reduced synthesis has not been shown
      directly; the ellipsis bridges the isotope label in square brackets.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
    description: >-
      Fewer mitochondrial DNA-encoded subunits leave complexes I, III and IV
      short of subunits, while the wholly nuclear-encoded complex II is
      spared.

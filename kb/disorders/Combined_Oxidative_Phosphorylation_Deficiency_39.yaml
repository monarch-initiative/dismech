      snippet: >-
        The identified c.T2032A variant in family 650 changes p.D576E, but this
        variant also occurs in a conserved predicted splice site at the acceptor
        for exon 17 and is predicted to destroy the splice acceptor function
      explanation: The founding allele and its predicted splicing effect.
  - name: c.206+4A>G and c.2029-1G>A
    description: >-
      Compound heterozygous in two Japanese sisters with Leigh syndrome and
      arthrogryposis multiplex congenita; both alleles cause aberrant splicing

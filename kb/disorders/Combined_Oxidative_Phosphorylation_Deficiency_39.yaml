      term:
        id: CHEBI:17126
        label: carnitine
    - preferred_term: thiamine
      term:
        id: CHEBI:18385
        label: thiamine(1+)
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  evidence:
  - reference: PMID:38283147
    reference_title: "Expanding the genetic spectrum of mitochondrial diseases in Tunisia: novel variants revealed by whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, P1 received carnitine, thiamine, and coenzyme Q10, but these
      did not significantly improve her condition.
    explanation: The one reported trial of cofactors, without benefit.
experimental_models:
- name: Patient fibroblasts with the GFM2 pseudoexon allele treated with a splice-switching oligonucleotide
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PPR:PPR1243461
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  description: >-
    Skin fibroblasts from the patient compound heterozygous for the intronic
    duplication and p.Pro732Leu, transfected with a splice-switching
    oligonucleotide against the aberrant intron-pseudoexon junction. The
    oligonucleotide restores normal splicing from the duplication allele,
    raises mtEFG2 protein and returns cytochrome c oxidase activity to the
    control range. The work is in a 2026 preprint.
  modeled_mechanisms:
  - target: Impaired Mitochondrial Translation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Correcting the splicing of one allele restores mtEFG2 and complex IV activity in patient cells.
    limitations: >-
      Allele-specific and in vitro only: fibroblasts are mildly affected
      compared with muscle or brain, the rescue was measured 72 hours after
      transfection, and no in vivo delivery was tested.
    evidence:
    - reference: PPR:PPR1243461
      reference_title: In vitro splice-switching oligonucleotide rescues aberrant  <i>GFM2</i>  pseudoexon inclusion and restores mitochondrial activity
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        A SSO targeting the aberrant intron-pseudoexon junction nearly abolished
        pseudoexon inclusion, restored correctly spliced GFM2 transcript from
        the duplication-containing allele, increased mtEFG2 protein levels, and
        significantly improved COX activity.
      explanation: Splice correction rescues the biochemical defect in patient cells.
references:
- reference: PMID:26425749
  title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview.
  tags:
  - GeneReviews
notes: >-
  No GeneReviews chapter is specific to GFM2; the Nuclear Gene-Encoded Leigh
  Syndrome Spectrum Overview is in the Overview format and carries no clinical
  characteristics, so the phenotypes here come from the case reports
  (PMID:22700954, PMID:26016410, PMID:29075935, PMID:38283147) and a 2026
  preprint (PPR:PPR1243461). GFM2 was also among the nuclear genes found in a
  series of 219 Russian patients with Leigh syndrome (PMID:36675121), which
  does not describe those patients individually. Feature frequencies are not
  given because no source pools the reported patients.

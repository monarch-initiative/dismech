      explanation: The homozygous p.Arg190Gln patient.
  - name: c.275A>C, p.Tyr92Ser
    description: >-
      Homozygous in a Syrian girl; the tyrosine is conserved from humans to
      yeast.
    evidence:
    - reference: PMID:29075935
      reference_title: Novel GFM2 variants associated with early-onset neurological presentations of mitochondrial disease and impaired expression of OXPHOS subunits.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        WES of Patient 2 revealed a homozygous c.275A>C variant in exon 5 of
        GFM2, predicted to cause a tyrosine to serine missense change at residue
        92 (p.(Tyr92Ser))
      explanation: The homozygous p.Tyr92Ser patient.
  - name: c.2029-741_2029-521dup with c.2195C>T, p.Pro732Leu
    description: >-
      A 221-nucleotide intronic duplication, missed by exome sequencing, that
      activates an 87-nucleotide pseudoexon with a premature stop codon, in
      trans to a missense allele, in an infant with suspected Leigh syndrome.
    evidence:
    - reference: PPR:PPR1243461
      reference_title: In vitro splice-switching oligonucleotide rescues aberrant  <i>GFM2</i>  pseudoexon inclusion and restores mitochondrial activity
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole genome sequencing identified a paternally-inherited GFM2 missense
        variant, NM_032380.5:c.2195C>T p.(Pro732Leu), in trans to a
        maternally-inherited 221-nucleotide intronic duplication,
        NM_032380.5:c.2029-741_2029-521dup.
      explanation: The deep intronic allele and its missense partner (2026 preprint).
  evidence:
  - reference: PMID:22700954
    reference_title: Exome sequencing can improve diagnosis and alter patient management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a mutation in GFM2 in a family with microcephaly,
      simplified gyral pattern, and insulin-dependent diabetes
    explanation: The first family, found by exome sequencing within a region of homozygosity.
  - reference: PMID:26016410
    reference_title: Compound heterozygous GFM2 mutations with Leigh syndrome complicated by arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that GFM2 mutations could be causative of a
      phenotype of Leigh syndrome with arthrogryposis multiplex congenita.
    explanation: A second family, two affected sisters.
  - reference: PMID:29075935
    reference_title: Novel GFM2 variants associated with early-onset neurological presentations of mitochondrial disease and impaired expression of OXPHOS subunits.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data demonstrate the effects of defective mtEFG2 function, caused
      by previously unreported variants, confirming pathogenicity and expanding
      the clinical phenotypes associated with GFM2 variants.
    explanation: Two further unrelated patients with biochemical support for pathogenicity.
  - reference: PPR:PPR1243461
    reference_title: In vitro splice-switching oligonucleotide rescues aberrant  <i>GFM2</i>  pseudoexon inclusion and restores mitochondrial activity
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A SSO targeting the aberrant intron-pseudoexon junction nearly abolished
      pseudoexon inclusion, restored correctly spliced GFM2 transcript from the
      duplication-containing allele, increased mtEFG2 protein levels, and
      significantly improved COX activity.
    explanation: >-
      Correcting the splicing defect in patient fibroblasts restores mtEFG2 and
      complex IV activity, functional evidence that the allele causes the
      biochemical defect (2026 preprint, not yet peer reviewed).
pathophysiology:
- name: GFM2 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_translation_deficiency#Mitochondrial Translation Machinery Lesion"
  description: >-
    Biallelic GFM2 variants remove or reduce mtEFG2 protein. Splice-site,
    frameshift and pseudoexon-creating alleles give transcripts with premature
    stop codons, and patient muscle or fibroblasts carry about half, or almost
    none, of the normal amount of mtEFG2. mtEFG2 is a translational GTPase;
    its GTP-bound form splits the mitoribosome, and GTP hydrolysis is needed
    for its own release from the large subunit rather than for the splitting
    itself.
  genes:
  - preferred_term: GFM2
    term:
      id: hgnc:29682
      label: GFM2
  genetic_context:

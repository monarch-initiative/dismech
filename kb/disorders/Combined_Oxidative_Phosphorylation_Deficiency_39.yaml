    and IV defect in his fibroblasts, reduced cytochrome c oxidase with normal
    succinate dehydrogenase in fibroblasts of another patient, and reduced
    oxidative phosphorylation in fibroblasts of a third family.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119

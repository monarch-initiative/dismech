name: Combined Oxidative Phosphorylation Deficiency 39
creation_date: "2026-11-27T13:40:20Z"
category: Mendelian
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 39
  term:
    id: MONDO:0032726
    label: combined oxidative phosphorylation deficiency 39
synonyms:
- COXPD39
parents:
- Combined Oxidative Phosphorylation Deficiency
- Mitochondrial Disease
description: >-
  Combined oxidative phosphorylation deficiency 39 (COXPD39) is an autosomal
  recessive mitochondrial disorder caused by biallelic variants in GFM2, which
  encodes mitochondrial elongation factor G2 (mtEFG2, also called EF-G2mt or
  RRF2mt). Despite its name, mtEFG2 has no translocation activity: together
  with the mitochondrial ribosome recycling factor it splits the 55S
  mitoribosome into its subunits after translation termination, so that they
  can start new rounds of mitochondrial protein synthesis. Loss of mtEFG2
  lowers the steady-state levels of mitochondrial DNA-encoded respiratory
  chain subunits and the activity of complex IV, more in muscle than in
  fibroblasts.

  Patients from six families have been described in case reports. They
  present in infancy or early childhood with global developmental delay, often
  followed by regression, with dystonia, axial hypotonia and limb spasticity,
  seizures, nystagmus, elevated blood and cerebrospinal fluid lactate, and
  bilateral basal ganglia lesions with cerebral white matter involvement on
  MRI, a Leigh or Leigh-like picture. Single families have in addition shown
  microcephaly with a simplified gyral pattern and insulin-dependent diabetes,
  or arthrogryposis multiplex congenita with optic atrophy and progressive
  cerebellar atrophy.

genetic:
- name: GFM2
  gene_term:
    preferred_term: GFM2
    term:
      id: hgnc:29682
      label: GFM2
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  association: >-
    Biallelic GFM2 variants cause the disease. Six families are reported, with
    segregation in each, reduced mtEFG2 protein in patient muscle and
    fibroblasts, and in one family restoration of complex IV activity when the
    splicing defect was corrected in patient fibroblasts.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:29075935
      reference_title: Novel GFM2 variants associated with early-onset neurological presentations of mitochondrial disease and impaired expression of OXPHOS subunits.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sanger sequencing of familial samples confirmed the segregation of
        bi-allelic GFM2 variants with disease
      explanation: Recessive segregation of homozygous and compound heterozygous GFM2 variants.
  notes: >-
    The relationship is typed UNKNOWN rather than CAUSATIVE, which this schema
    reserves for Definitive or Strong gene-disease validity: ClinGen rates
    GFM2 Moderate (autosomal recessive) for Leigh syndrome (MONDO:0009723), a
    different MONDO disease from this entry's term, so no tier is recorded in
    gene_disease_validity, and the published evidence is six families. The
    allele spectrum is mostly splice-altering or truncating (c.206+4A>G and
    c.2029-1G>A, c.636delA, a deep intronic duplication that activates a
    pseudoexon, and c.1728T>A at a splice acceptor) together with missense
    variants (p.Tyr92Ser, p.Arg190Gln, p.Pro732Leu); the recurrent
    p.Arg190Gln was classified of uncertain significance in its homozygous
    Tunisian carrier. A deep intronic allele was missed by exome sequencing and
    found by genome sequencing.
  variants:
  - name: c.1728T>A, p.Asp576Glu
    description: >-
      Homozygous in the first reported family, with microcephaly, a simplified
      gyral pattern and insulin-dependent diabetes. Reported as c.T2032A; it

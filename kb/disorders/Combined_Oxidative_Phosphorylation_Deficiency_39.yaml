diagnosis:
- name: Exome or genome sequencing for biallelic GFM2 variants
  description: >-
    The diagnosis is molecular. Raised lactate, bilateral basal ganglia lesions
    and a complex IV or combined respiratory chain defect on muscle or
    fibroblast studies suggest a mitochondrial translation disorder, but none
    is specific to GFM2. Genome sequencing with RNA studies found a deep
    intronic allele in a patient whose exome was unrevealing.
  evidence:
  - reference: PPR:PPR1243461
    reference_title: In vitro splice-switching oligonucleotide rescues aberrant  <i>GFM2</i>  pseudoexon inclusion and restores mitochondrial activity
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings demonstrate the value of integrated genome and transcriptome
      analysis for exome-negative mitochondrial disease
    explanation: Genome and RNA analysis resolved an exome-negative case (2026 preprint).
  - reference: PMID:29075935
    reference_title: Novel GFM2 variants associated with early-onset neurological presentations of mitochondrial disease and impaired expression of OXPHOS subunits.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present here two unrelated patients harbouring different and
      previously unreported compound heterozygous (c.569G>A, p.(Arg190Gln);
      c.636delA, p.(Glu213Argfs*3)) and homozygous (c.275A>C, p.(Tyr92Ser))
      recessive variants in GFM2 identified by whole exome sequencing (WES)
    explanation: Exome sequencing identified the variants in both patients.
treatments:
- name: Symptomatic management including antiseizure medication
  description: >-
    No disease-modifying therapy exists. Management is symptomatic. In one
    patient valproic acid caused tremor and drowsiness and carbamazepine
    controlled the seizures; valproate is generally used with caution in
    mitochondrial disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
  target_mechanisms:
  - target: Seizure
    description: Controls seizures; it does not address the translation defect.
  evidence:
  - reference: PMID:38283147
    reference_title: "Expanding the genetic spectrum of mitochondrial diseases in Tunisia: novel variants revealed by whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures were initially treated with valproic acid, resulting in the
      appearance of tremors and drowsiness. As a result, the treatment was
      switched to carbamazepine, which successfully controlled the epilepsy.
    explanation: A single-patient observation, not a comparison of treatments.
- name: Mitochondrial cofactor supplementation
  description: >-
    Carnitine, thiamine and coenzyme Q10 were given to one patient without
    significant improvement. No controlled data exist.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:

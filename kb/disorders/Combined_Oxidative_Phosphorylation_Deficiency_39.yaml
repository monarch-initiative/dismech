      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genomic investigation confirmed the presence of compound heterozygous
        GFM2 mutations (c.206+4A>G and c.2029-1G>A) in both siblings, causing
        aberrant splicing with premature stop codons
      explanation: The two splice alleles and their consequence.
  - name: c.569G>A, p.Arg190Gln
    description: >-
      Compound heterozygous with the frameshift c.636delA in a British boy, and
      homozygous in a Tunisian girl with earlier onset, seizures and nystagmus.
    evidence:
    - reference: PMID:38283147
      reference_title: "Expanding the genetic spectrum of mitochondrial diseases in Tunisia: novel variants revealed by whole-exome sequencing."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        P1 carried a homozygous variant c.569G>A in the GFM2 gene (MIM * 606544),

pathophysiology:
- name: HMX1 Loss of Function
  description: >-
    Biallelic HMX1 variants remove or disable the homeodomain of this transcription factor. The original
    family carries a homozygous 26-nucleotide deletion in exon 1 that truncates the protein before the
    homeodomain; later families carry a homozygous homeodomain missense (p.Gln217Pro) that is expressed but
    functionally impaired, and homozygous nonsense or frameshift alleles (p.Glu163*, p.Ala85Argfs*53).
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HMX1
    term:
      id: hgnc:5017
      label: HMX1
  molecular_functions:
  - preferred_term: HMX1 homeodomain DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24945320
    reference_title: A dimerized HMX1 inhibits EPHA6/epha4b in mouse and zebrafish retinas.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "HMX1 is a homeobox-containing transcription factor implicated in eye development and responsible for the oculo-auricular syndrome of Schorderet-Munier-Franceschetti."
    explanation: >-
      Identifies HMX1 as a homeobox transcription factor, supporting the bound DNA-binding transcription
      factor activity that the homeodomain-truncating and homeodomain-missense alleles remove or impair.
  - reference: PMID:18423520
    reference_title: Mutation in the human homeobox gene NKX5-3 causes an oculo-auricular syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage analysis and mutation screening revealed in the first exon of the NKX5-3 gene a homozygous 26 nucleotide deletion, generating a truncating protein that lacked the complete homeodomain."
    explanation: The founding family's allele is predicted to produce a protein lacking the DNA-binding homeodomain.

- name: Progressive Rod-Cone Photoreceptor Degeneration
  description: >-
    Electroretinography first shows generalized rod more than cone dysfunction, followed by rapid loss of
    both rod and cone function, giving a progressive rod-cone dystrophy that begins in infancy. Abnormalities
    of the retinal pigment epithelium are also described. Whether this degeneration is a consequence of
    the developmental retinal defect or a separate requirement for HMX1 in mature photoreceptors is not
    known.
  biological_scale: TISSUE
  cell_types:

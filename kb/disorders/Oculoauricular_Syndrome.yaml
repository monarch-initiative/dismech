- name: Ocular Anterior Segment, Lens and Optic Fissure Maldevelopment
  description: >-
    Developmental malformation of the anterior segment and lens, and incomplete closure of the optic fissure,
    produce anterior segment dysgenesis, congenital cataract and colobomas. The authors of the second family's
    report propose an HMX1 role in the lens and retina developmental pathway and in the optic fissure closure
    gene network; the cellular mechanism is not established. Microcornea and posterior synechiae are not
    linked from this node because no cited source states the link directly; the chorioretinal and optic disc
    colobomas are linked by the same optic fissure closure proposal as the iris coloboma.

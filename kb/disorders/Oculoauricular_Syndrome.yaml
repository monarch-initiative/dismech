genetic:
- name: HMX1
  gene_term:
    preferred_term: HMX1
    term:
      id: hgnc:5017
      label: HMX1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ebf66ec9-77a4-4e48-83a4-970639ad5373-2021-05-06T160000.000Z
    evidence:
    - reference: CGGV:assertion_ebf66ec9-77a4-4e48-83a4-970639ad5373-2021-05-06T160000.000Z
      reference_title: HMX1 / oculoauricular syndrome (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HMX1 | HGNC:5017 | oculoauricular syndrome | MONDO:0012802 | AR | Definitive"
      explanation: ClinGen Retina GCEP classifies HMX1-oculoauricular syndrome (AR) as Definitive.
  notes: >-
    HMX1 was formerly named NKX5-3. Every reported allele is homozygous in a consanguineous family. A fourth
    family (two siblings with a homozygous nonsense variant, PMID:35946463) is known here only through ClinGen's
    summary because the PubMed record has no abstract. A fifth family was reported in an Egyptian
    microphthalmia/anophthalmia exome cohort (PMID:41953648); its variant is not given in the abstract.
  variants:
  - name: NKX5-3 26-nucleotide deletion in exon 1
    description: >-
      Homozygous 26-nucleotide deletion in exon 1 in the original consanguineous family (three affected
      members), producing a truncated protein without the homeodomain.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:18423520
      reference_title: Mutation in the human homeobox gene NKX5-3 causes an oculo-auricular syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Linkage analysis and mutation screening revealed in the first exon of the NKX5-3 gene a homozygous 26 nucleotide deletion, generating a truncating protein that lacked the complete homeodomain."
      explanation: Defines the founding allele.
  - name: HMX1 c.650A>C p.(Gln217Pro)
    description: Homozygous homeodomain missense in the second family; protein is expressed but functionally impaired.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25574057
      reference_title: "Abrogation of HMX1 function causes rare oculoauricular syndrome associated with congenital cataract, anterior segment dysgenesis, and retinal dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analyses identified a homozygous c.650A>C; p.(Gln217Pro) missense mutation within the highly conserved homeodomain of the H6 family homeobox 1 (HMX1) gene."
      explanation: Defines the second family's allele.
  - name: HMX1 c.487G>T p.(Glu163Ter)
    description: Homozygous nonsense variant in exon 2 in the third family; the parents are heterozygous.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29140751
      reference_title: "Further delineation of the oculoauricular syndrome phenotype: A new family with a novel truncating HMX1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutation analysis revealed a novel homozygous nonsense mutation c.487G>T in the second exon of the HMX1 that predicted to introduce a premature stop codon at position 163 (p.E163*)."
      explanation: Defines the third family's allele.
  - name: HMX1 c.233_251dup p.(Ala85Argfs*53)
    description: >-
      Homozygous frameshift duplication (NM_018942.3) in a girl of first-degree consanguineous parents,
      confirmed by Sanger sequencing, with heterozygous parents and sibling.
    evidence:
    - reference: PMID:41735262
      reference_title: "Oculo-auricular syndrome caused by a novel HMX1 frameshift variant: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Clinical exome sequencing identified a novel homozygous frameshift variant in HMX1 (NM_018942.3:c.233_251dup, p.Ala85Argfs *53), which was confirmed by Sanger sequencing."
      explanation: Defines the 2026 case's allele; the abstract does not state an ACMG class, so none is recorded.
  evidence:
  - reference: PMID:29140751
    reference_title: "Further delineation of the oculoauricular syndrome phenotype: A new family with a novel truncating HMX1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Biallelic HMX1 mutations cause a very rare autosomal recessive genetic disorder termed as oculoauricular syndrome (OAS) because it is characterized only by the combination of eye and ear anomalies."
    explanation: States the gene-disease relationship.
  - reference: CGGV:assertion_ebf66ec9-77a4-4e48-83a4-970639ad5373-2021-05-06T160000.000Z
    reference_title: HMX1 / oculoauricular syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, a 4th family, with two affected siblings, both with a homozygous nonsense variant, was identified (PMID: 35946463)."
    explanation: Records the fourth family, whose own PubMed record has no quotable abstract.
diagnosis:
- name: Ophthalmological and Electroretinographic Assessment
  description: >-
    Slit-lamp and fundus examination document the congenital malformations (microcornea, anterior segment
    dysgenesis, cataract, colobomas), and serial full-field electroretinography documents the rod-cone
    dystrophy, which starts as rod more than cone dysfunction and progresses. Fundus photography and
    Goldmann perimetry were used in the 12-year follow-up. NCIT has no electroretinography term reachable
    by OLS search (runoak -i ols:ncit search "electroretinogram" and search "Electroretinography" returned
    nothing), so the eye examination term is bound.
  diagnosis_term:
    preferred_term: ophthalmologic examination with full-field electroretinography
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:21417677
    reference_title: Retinal dystrophy in the oculo-auricular syndrome due to HMX1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To report on the clinical and electrophysiological findings in a patient with oculo-auricular syndrome due to HMX1 mutation, with a follow-up of 12 years."
    explanation: Clinical and electrophysiological assessment is how the retinal phenotype of the disorder was characterized.
  - reference: PMID:21417677
    reference_title: Retinal dystrophy in the oculo-auricular syndrome due to HMX1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial ERG tracings revealed generalized rod more than cone dysfunction. Thereafter, a rapid deterioration in rod and cone function was detected on follow up ERGs."
    explanation: Serial full-field ERG reveals and tracks the rod-cone dysfunction.
  - reference: PMID:25574057
    reference_title: "Abrogation of HMX1 function causes rare oculoauricular syndrome associated with congenital cataract, anterior segment dysgenesis, and retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two individuals from a consanguineous family underwent comprehensive clinical phenotyping and electrodiagnostic testing (EDT)."
    explanation: The second family's phenotype was defined by comprehensive clinical phenotyping and electrodiagnostic testing.
- name: Molecular Genetic Testing for HMX1
  description: >-
    Molecular diagnosis rests on finding biallelic HMX1 variants, confirmed by Sanger sequencing and
    parental segregation. Recent cases were identified by exome
    sequencing (including a clinical exome) with Sanger confirmation and parental segregation; the earlier
    families were found by linkage analysis or microarray followed by candidate-gene sequencing.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:41953648
    reference_title: "Exploring the molecular basis of microphthalmia and anophthalmia: Insights from an Egyptian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients underwent a thorough clinical examination, ophthalmological assessment, and genetic testing including conventional karyotyping and exome sequencing (ES)."
    explanation: Exome sequencing of a microphthalmia/anophthalmia cohort identified the fifth oculoauricular syndrome family.
  - reference: PMID:41735262
    reference_title: "Oculo-auricular syndrome caused by a novel HMX1 frameshift variant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical exome sequencing identified a novel homozygous frameshift variant in HMX1 (NM_018942.3:c.233_251dup, p.Ala85Argfs *53), which was confirmed by Sanger sequencing."
    explanation: Clinical exome sequencing with Sanger confirmation established the diagnosis in the 2026 case.
  - reference: PMID:25574057
    reference_title: "Abrogation of HMX1 function causes rare oculoauricular syndrome associated with congenital cataract, anterior segment dysgenesis, and retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide microarray analysis and Sanger sequencing of the candidate gene were used to identify the likely causal variant."
    explanation: In the second family the HMX1 variant was found by microarray-guided candidate-gene Sanger sequencing.

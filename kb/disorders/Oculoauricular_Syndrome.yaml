- name: Dysregulation of HMX1 Transcriptional Targets
  description: >-
    HMX1 dimerizes through its SD1 domain and homeodomain, needs the homeodomain for nuclear localization,
    and represses EPHA6, a retinal axon-guidance gene; in zebrafish it also regulates uhrf1 in the cranial
    region. How dysregulation of these targets produces the human eye and ear malformations has not been
    shown, so this node has no downstream edge.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:24945320
    reference_title: A dimerized HMX1 inhibits EPHA6/epha4b in mouse and zebrafish retinas.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we demonstrated that HMX1 dimerized and that the SD1 and homeodomains are required for this function."
    explanation: Dimerization, which the homeodomain-disrupting alleles would affect, requires the SD1 and homeodomains.
  - reference: PMID:24945320
    reference_title: A dimerized HMX1 inhibits EPHA6/epha4b in mouse and zebrafish retinas.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also identified that EPHA6, a gene implicated in retinal axon guidance, is one of its targets in eye development and showed that a dimerized HMX1 is needed to inhibit EPHA6 expression."
    explanation: Identifies EPHA6 as a repressed HMX1 target in the developing retina.
- name: Impaired Retinal Development
  description: >-

- name: Defective Pinna Morphogenesis
  description: >-
    Abnormal shaping of the external ear produces the cleft or absent lobule and dysplastic, protruding
    pinnae; hearing is typically normal. HMX1 is expressed in branchial arch mesenchyme, from which the pinna
    develops. In the dumbo rat, deletion of a distant enhancer removes Hmx1 only from neural-crest-derived
    craniofacial mesenchyme and still produces the ear malformation, indicating that mesenchymal HMX1 is what
    the pinna requires; in human disease the coding alleles remove HMX1 in all tissues. Only the dysplastic
    pinna phenotype is linked, because no cited source states which specific lobule or helix defect follows
    from the morphogenesis defect.
  biological_scale: TISSUE

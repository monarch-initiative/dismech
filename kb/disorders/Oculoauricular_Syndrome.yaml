name: Oculoauricular Syndrome
creation_date: "2026-10-15T14:36:39Z"
category: Mendelian
description: >-
  Oculoauricular syndrome (Schorderet-Munier-Franceschetti syndrome) is an ultra-rare autosomal recessive
  developmental disorder caused by biallelic loss-of-function variants in HMX1, a homeodomain transcription
  factor gene at 4p16.1. Affected individuals have congenital eye malformations (microphthalmia, microcornea,
  anterior segment dysgenesis, congenital cataract, and iris, chorioretinal or optic disc coloboma), an
  early-onset progressive rod-cone dystrophy, and malformation of the external ear, most characteristically
  a cleft or absent ear lobule with dysplastic, protruding pinnae. Hearing is typically preserved. The
  published human evidence consists of a handful of consanguineous families, each with a different homozygous
  truncating or homeodomain missense allele; mouse (dumbo, misplaced ears) and rat (dumbo) Hmx1 mutants and
  zebrafish hmx1 knockdown reproduce the ear and small-eye components.

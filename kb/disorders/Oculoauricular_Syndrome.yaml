animal_models:
- name: Hmx1 dumbo and misplaced ears mouse
  species: Mouse
  genotype: Hmx1 dmbo/dmbo (ENU nonsense in exon 1) or Hmx1 mpe/mpe (spontaneous)
  publication: PMID:19379485
  description: >-
    Homozygous loss-of-function Hmx1 mice with ventrolaterally displaced, enlarged ear pinnae, microphthalmia
    in most adults, reduced body mass, subtle cranial bone changes, and about 40% perinatal semilethality with
    exencephaly.
  modeled_mechanisms:
  - target: Defective Pinna Morphogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Coding loss-of-function alleles produce an external ear malformation.
    limitations: >-
      Mouse pinna malformation is a displacement and shape change; the human lobule cleft or aplasia has no
      described mouse counterpart.
    evidence:
    - reference: PMID:19379485
      reference_title: Mouse H6 Homeobox 1 (Hmx1) mutations cause cranial abnormalities and reduced body mass.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutants exhibit enlarged ear pinnae with a distinctive ventrolateral shift."
      explanation: The mutant ear phenotype.
    - reference: PMID:19379485
      reference_title: Mouse H6 Homeobox 1 (Hmx1) mutations cause cranial abnormalities and reduced body mass.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, these mutant Hmx1 alleles represent the first mouse models of a recently-discovered Oculo-Auricular syndrome caused by mutation of the orthologous human gene."
      explanation: The authors present these alleles as models of the human syndrome.
  - target: Impaired Retinal Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Most adult mutants are microphthalmic.
    limitations: >-
      Only microphthalmia is reported; the human cataract, anterior segment dysgenesis, coloboma and rod-cone
      dystrophy are not described, and the semilethality with exencephaly is not a human feature.
    evidence:
    - reference: PMID:19379485
      reference_title: Mouse H6 Homeobox 1 (Hmx1) mutations cause cranial abnormalities and reduced body mass.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Most dumbo adults were microphthalmic."
      explanation: Small-eye phenotype in the mouse model.
- name: Hmx1 dumbo rat
  species: Rat
  genotype: dmbo/dmbo (5777-bp deletion of a conserved enhancer about 80 kb downstream of Hmx1)
  publication: PMID:22736458
  description: >-
    A regulatory allele that removes Hmx1 expression from neural-crest-derived craniofacial mesenchyme while
    sparing retinal expression; neonates show ear and eye phenotypes similar to dumbo mice. Because the
    lesion is noncoding, it models HMX1 regulatory ear malformation more closely than the human coding
    alleles of oculoauricular syndrome.
  modeled_mechanisms:
  - target: Defective Pinna Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Tissue-restricted loss of Hmx1 in craniofacial mesenchyme with ear malformation.
    limitations: >-
      Noncoding regulatory deletion rather than a coding loss-of-function allele; retinal Hmx1 is preserved,
      so it does not model the retinal dystrophy.
    evidence:
    - reference: PMID:22736458
      reference_title: "Deletion of a conserved regulatory element required for Hmx1 expression in craniofacial mesenchyme in the dumbo rat: a newly identified cause of congenital ear malformation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that the rat dumbo phenotype is likely to result from loss of function of an ultraconserved enhancer specifically regulating Hmx1 expression in neural-crest-derived CM."
      explanation: The rat ear phenotype arises from mesenchyme-restricted loss of Hmx1 expression.
- name: Zebrafish hmx1 morphant
  species: Zebrafish
  genotype: hmx1 morpholino knockdown
  publication: PMID:23068565
  description: >-
    Morpholino knockdown of hmx1 produces microphthalmia, delayed retinal progenitor cell-cycle exit,
    retarded retinal differentiation and increased cell death in the retina and brain.
  modeled_mechanisms:
  - target: Impaired Retinal Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Knockdown reproduces microphthalmia with a retinal differentiation defect.
    limitations: >-
      Transient morpholino knockdown in embryos; morpholino off-target effects are possible, the fish has no
      pinna, and the progressive photoreceptor degeneration is not modeled.
    evidence:
    - reference: PMID:23068565
      reference_title: Zebrafish hmx1 promotes retinogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of hmx1 led to microphthalmia."
      explanation: Small-eye phenotype on hmx1 knockdown.
notes: >-
  MONDO places this disease under syndromic microphthalmia (MONDO:0016073) and records HMX1 as its causal gene
  (RO:0004003). The offline GeneReviews index has no chapter for it. It is distinct from
  oculo-auriculo-vertebral spectrum (Goldenhar syndrome). PMID:35946463 (fourth family) and PMID:30055074
  were cached with no abstract text on the fetches made for this entry, so they are listed under references
  but not quoted; the fourth family is cited through ClinGen's summary. In the third family a short mandibular
  ramus was reported in both the proband and his heterozygous father, so craniofacial findings from that
  report are not recorded as disease phenotypes.

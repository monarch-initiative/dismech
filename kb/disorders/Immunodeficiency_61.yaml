    explanation: >-
      States the X-linked recessive mode and the loss-of-function mechanism for
      the founding kindred.
  - reference: PMID:42375371
    reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "segregation analysis was limited to maternal testing, and extended family studies were unavailable, precluding a more comprehensive assessment of inheritance patterns and possible mosaicism"
    explanation: >-

discussions:
- discussion_id: imd61_cin85_positive_versus_negative_regulator
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is CIN85 a positive or a negative regulator of B cell receptor signalling?
    The human deletion and the cell-line knockdown point in opposite directions.
  attaches_to:
  - "pathophysiology#Impaired B Cell Receptor Effector Signalling"
  rationale: >-
    Two well-executed bodies of work disagree about the sign of CIN85's effect.
    In humans lacking CIN85, and in reconstitution experiments lacking the
    SLP65-CIN85 complex, BCR effector responses are IMPAIRED - NF-kB and CD86 in
    patients, calcium and NF-kB in cells - which is a positive, transducer role.
    But CIN85 knockdown in B cell lines and primary B cells ENHANCES BCR-induced
    survival and growth and increases expression of BcLxL, A1, cyclin D2 and myc,
    consistent with a negative regulatory role exercised through Cbl-mediated
    ubiquitination and degradation of Syk. Both cannot be the whole story. The
    plausible reconciliations - that acute knockdown and germline absence are not
    the same perturbation, that CIN85 isoforms differ, or that the transducer and
    Cbl-adaptor functions are separable and read out on different timescales -
    are untested. This matters for the disease entry because it determines
    whether the pathograph's central node is correctly signed, and no entry in
    this family should assert a single unified CIN85 function.
  proposed_experiments:
  - experiment_id: exp_imd61_acute_versus_germline_cin85_loss
    name: Side-by-side acute knockdown versus germline null in the same B cell background
    description: >-
      Compare degenerate CIN85 knockdown, inducible degron-mediated acute
      depletion, and stable germline knockout in one isogenic human B cell line,
      reading out Syk ubiquitination and phosphorylation, calcium flux, NF-kB
      activation, CD86 upregulation, survival and proliferation in parallel. This
      would test directly whether the opposing published phenotypes are an
      artefact of perturbation kinetics rather than a genuine dual function.
  evidence:
  - reference: PMID:22262777
    reference_title: "CIN85 is required for Cbl-mediated regulation of antigen receptor signaling in human B cells."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "CIN85 knockdown in primary B cells enhanced BCR-induced survival and growth, and increased the expression of BcLxL, A1, cyclin D2, and myc"
    explanation: >-
      The result that runs opposite to the disease model: losing CIN85 ENHANCES
      rather than impairs BCR-driven responses in this system. Recorded as REFUTE
      against a simple "CIN85 is required for BCR signalling" reading.
  - reference: PMID:22262777
    reference_title: "CIN85 is required for Cbl-mediated regulation of antigen receptor signaling in human B cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CIN85 increased c-Cbl phosphorylation and inhibited BCR-induced calcium flux and phosphorylation of Syk and PLC"
    explanation: >-
      Gives the mechanism of the negative-regulatory arm - Cbl-dependent
      suppression of proximal BCR signalling. The quote stops before the Greek
      gamma in PLCgamma2, which is not a stable substring.
  - reference: PMID:29636373
    reference_title: "Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "B lymphocytes showed intrinsic defects in distinct effector pathways of the B cell antigen receptor"
    explanation: >-
      The human result on the other side of the disagreement: absence of CIN85
      impairs, rather than enhances, BCR effector pathways.
- discussion_id: imd61_nosology_not_an_agammaglobulinemia
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should MONDO:0010296 remain classified under agammaglobulinemia, given that
    the disease it names is a selective antibody-response defect with normal
    B cell development?
  attaches_to:
  - "pathophysiology#Defective Antibody Production by Intrinsically Impaired B Cells"
  rationale: >-
    The entity carries the legacy names AGMX2, XLA2 and "agammaglobulinemia,
    X-linked, type 2", and MONDO places MONDO:0010296 under
    MONDO:0015977 agammaglobulinemia. The disease as characterised does not match
    that placement: in the founding report all immune cell compartments developed
    normally and the defect was intrinsic to B cell effector function, and the
    subsequently reported features are impaired specific antibody responses and
    altered memory B cell subsets rather than absent immunoglobulin. Classifying
    it as an agammaglobulinemia invites confusion with BTK-related X-linked
    agammaglobulinemia, which is a different gene, a different mechanism, and a
    different B cell phenotype. This is recorded as a curation-facing question
    rather than acted on unilaterally, because reclassifying a MONDO concept is
    not a disorder entry's job.
  proposed_experiments:
  - experiment_id: exp_imd61_immunophenotype_reconciliation
    name: Standardised immunophenotyping of all reported SH3KBP1 patients
    description: >-
      Apply one standardised B cell immunophenotyping panel - total, transitional,
      naive, memory and switched-memory B cells, plus serum immunoglobulin
      isotypes and specific antibody responses to protein and polysaccharide
      vaccines - across all reported SH3KBP1 patients, to settle whether the
      entity is an agammaglobulinemia, a specific antibody deficiency, or a
      memory B cell disorder, and to reconcile the reported discrepancy in B cell
      counts.
  evidence:
  - reference: PMID:29636373
    reference_title: "Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of CIN85, all immune cell compartments developed normally"
    explanation: >-
      Normal development of all immune compartments is inconsistent with an
      agammaglobulinemia classification.
  - reference: PMID:42375371
    reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired humoral immune responses, reduced B-cell counts"
    explanation: >-
      The one report of reduced B cell counts, which is the discrepancy the
      proposed immunophenotyping would resolve. PARTIAL because this patient's
      variant is of uncertain significance.
notes: >-
  Gene anchor. MONDO:0010296 records no causal-gene relationship, so the stub had
  no `genes:` block. Following its xrefs, MedGen (MEDGEN:337462, from OMIM
  #300310) associates the concept with SH3KBP1 (gene_id 30011) at Xp22.12, and
  that is the anchor used here. As with the sibling immunodeficiency entry
  curated in this tranche, the missing MONDO relationship is worth reporting
  upstream.


  Evidence base. This is one of the thinnest gene-disease relationships in the
  knowledge base: two affected brothers, one later patient with a partial
  deletion of uncertain significance, and no ClinGen gene-disease validity
  assertion in the cached ClinGen snapshot. The mechanistic literature is by
  contrast strong and independent of the patients - the SLP65-CIN85 transducer
  module has been characterised biochemically, structurally and by studies of
  phase separation in cell systems - so the entry is deliberately
  mechanism-heavy and clinically cautious rather than the reverse.


  Features NOT curated, and why. MedGen/HPO annotate this concept with obesity,
  recurrent sinusitis, recurrent otitis media, decreased circulating IgM, and
  decreased circulating IgG2 and IgG4. Those annotations derive from the OMIM
  clinical synopsis of the founding report, whose PubMed record caches as
  abstract only and contains none of those statements, and no ORPHA record for
  Orphanet:696945 could be built because `just refresh-orphadata` currently fails
  on a manifest checksum mismatch and the bulk XML is absent. Rather than cite an
  abstract for facts it does not contain, they are named here as verifiable leads
  for a curator with full-text or Orphanet access. The IgG subclass pattern in
  particular would be worth promoting: selective IgG2/IgG4 deficiency with normal
  B cell numbers is a much more specific description of this entity than
  "antibody deficiency", and would strengthen the argument in the nosology
  discussion.


  Quoting mechanics. Several snippets stop short of a Greek character - "NF-" for
  NF-kappaB, "PLC" for PLCgamma2 - because the cached records render those
  symbols in a form that is not a stable matching substring. Where that clipped a
  claim, the claim is carried in the surrounding description and the reason is
  stated in the evidence explanation.


  No `datasets:` block. No SH3KBP1-immunodeficiency-specific accession was
  identified, and searching the gene alone surfaces the large CIN85 cancer and
  EGFR-trafficking literature instead - the Named Entity Confusion hazard the
  dataset SOP warns about.

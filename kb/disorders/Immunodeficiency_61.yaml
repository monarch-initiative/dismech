    reference_title: "Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results reveal nonredundant functions of CIN85 for humoral immune responses."
    explanation: >-
      States that the humoral response specifically depends on CIN85.
  - reference: PMID:42375371
    reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "defective antibody production, altered memory B-cell subsets"
    explanation: >-
      Names the two humoral abnormalities this node represents.
  downstream:
  - target: Recurrent bacterial infections
    causal_link_type: DIRECT
    description: >-
      Failure of specific antibody responses leaves the patient susceptible to
      encapsulated and other bacterial pathogens.
    evidence:
    - reference: PMID:42375371
      reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "defective antibody production, altered memory B-cell subsets, and susceptibility to recurrent bacterial infections"
      explanation: >-
        Links the antibody defect directly to recurrent bacterial infection.
  - target: Recurrent respiratory infections
    causal_link_type: DIRECT
    description: >-
      The respiratory tract is the site at which antibody deficiency
      characteristically manifests, and recurrent respiratory infection from
      infancy was the presenting problem in the later reported case.
    evidence:
    - reference: PMID:42375371
      reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
      supports: PARTIAL

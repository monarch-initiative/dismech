    snippet: "we report on primary antibody deficiency in patients harboring a germline deletion within the CIN85 gene on the X chromosome"
    explanation: >-
      Establishes a germline X-chromosome deletion as the cause in the founding
      patients.
  - reference: PMID:42375371
    reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
    supports: SUPPORT

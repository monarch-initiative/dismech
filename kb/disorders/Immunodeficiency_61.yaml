      X-linked transmission.
pathophysiology:
- name: SH3KBP1 (CIN85) Loss-of-Function Deletion
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A germline deletion within SH3KBP1 on the X chromosome, hemizygous in
    affected males. CIN85 is ubiquitously expressed and multifunctional, and
    before this report nothing was known about its role in humans - the only in
    vivo data were conditional mouse mutants ablating distinct CIN85 isoforms in
    brain and B lymphocytes. The human deletion is therefore the experiment that
    established which of CIN85's many proposed functions are non-redundant.
  genes:
  - preferred_term: SH3KBP1
    term:
      id: hgnc:13867
      label: SH3KBP1
  genetic_context:
    gene:
      preferred_term: SH3KBP1
      term:
        id: hgnc:13867
        label: SH3KBP1
    allele_type: intragenic deletion
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Hemizygous germline deletion within SH3KBP1 in affected males, described by
      a later report as a loss-of-function variant. LOSS_OF_FUNCTION rather than
      PARTIAL_LOSS_OF_FUNCTION because the founding study frames its findings as
      "in the absence of CIN85" and reads the resulting defects as revealing
      non-redundant CIN85 functions.
    notes: >-
      `variant_origin` is left unset: the cached sources do not report parental
      testing for the founding brothers, and in the later case segregation was
      limited to maternal testing with mosaicism explicitly not excluded.
  evidence:
  - reference: PMID:29636373
    reference_title: "Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report on primary antibody deficiency in patients harboring a germline deletion within the CIN85 gene on the X chromosome"
    explanation: >-
      Identifies the causal lesion and the resulting clinical category.
  - reference: PMID:29636373
    reference_title: "Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "limited information exists about the in vivo roles of CIN85, because only conditional mouse mutants with cell type-specific ablation of distinct CIN85 isoforms in brain and B lymphocytes have been generated so far. No information is available about the roles of CIN85 in humans."
    explanation: >-
      Establishes the state of knowledge this deletion resolved, and incidentally
      records that brain is one of the two compartments in which CIN85 had been
      conditionally ablated in mice.
  downstream:
  - target: Loss of the Preformed SLP65-CIN85 Transducer Module
    causal_link_type: DIRECT
    description: >-
      Without CIN85 there is no trimeric adaptor to oligomerise SLP65, so the
      constitutive transducer module cannot form.
    evidence:
    - reference: PMID:21822214
      reference_title: "The B-cell antigen receptor signals through a preformed transducer module of SLP65 and CIN85."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "a stimulation-independent and constant association of SLP65 with the Cbl-interacting protein of 85 kDa (CIN85) was requisite for SLP65 phosphorylation and its inducible plasma membrane translocation"
      explanation: >-
        Establishes that the constitutive SLP65-CIN85 association is required for
        SLP65 to be phosphorylated and to reach the membrane, which is the
        function lost when CIN85 is absent.
- name: Loss of the Preformed SLP65-CIN85 Transducer Module
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    CIN85 trimerises through a C-terminal coiled-coil domain, and the nine SH3
    domains of a trimer bind multiple SLP65 molecules, each of which recruits
    further CIN85 trimers - a self-perpetuating oligomerisation that concentrates
    the effector rather than merely connecting two proteins to each other. The
    resulting complex is held in cytoplasmic granules formed by tripartite phase
    separation of SLP65, CIN85 and lipid vesicles. Its purpose is READINESS: the
    module exists in the RESTING B cell so that signalling can begin immediately
    on receptor engagement. The mechanistic point the disease makes is that a
    signalling cascade can fail not because a component is missing from the
    pathway but because too few copies of it are pre-concentrated in the right
    place.
  biological_processes:
  - preferred_term: B cell receptor signaling pathway
    term:
      id: GO:0050853
      label: B cell receptor signaling pathway
    modifier: DECREASED
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:27353366
    reference_title: "The adaptor protein CIN85 assembles intracellular signaling clusters for B cell activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in B lymphocytes, CIN85 functions to oligomerize SLP-65, which is the central effector protein of the B cell receptor (BCR). Therefore, CIN85 trimerizes through a carboxyl-terminal, coiled-coil domain."
    explanation: >-
      States CIN85's actual function in B cells - oligomerising the central BCR
      effector - and the structural basis for it.
  - reference: PMID:27353366
    reference_title: "The adaptor protein CIN85 assembles intracellular signaling clusters for B cell activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Formation of this oligomeric signaling complex in resting B cells rendered the cells poised for the efficient initiation of intracellular signaling upon BCR stimulation."
    explanation: >-
      Establishes the readiness function of the complex in the resting cell,
      which is what the disease removes.
  - reference: PMID:27353366
    reference_title: "The adaptor protein CIN85 assembles intracellular signaling clusters for B cell activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the functionality of signaling cascades does not rely solely on the qualitative linkage of their various components but requires a critical number of effectors to become concentrated in signaling complexes"
    explanation: >-
      The generalisable mechanistic claim this node embodies: signalling can fail
      on effector concentration rather than on pathway membership.
  - reference: PMID:32051419
    reference_title: "Tripartite phase separation of two signal effectors with vesicles priming B cell responsiveness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "effective B cell activation requires tripartite phase separation of SLP65, CIN85, and lipid vesicles into droplets via vesicle binding of SLP65 and promiscuous interactions between nine SH3 domains of the trimeric CIN85 and the proline-rich motifs (PRMs) of SLP65"
    explanation: >-
      Gives the physical basis of the granules - phase separation involving the
      nine SH3 domains of trimeric CIN85 - and states that effective B cell
      activation requires it.
  downstream:
  - target: Impaired B Cell Receptor Effector Signalling
    causal_link_type: DIRECT
    description: >-
      Without the module, SLP65 is neither phosphorylated nor translocated, and
      the downstream effector arms fail.
    evidence:
    - reference: PMID:21822214
      reference_title: "The B-cell antigen receptor signals through a preformed transducer module of SLP65 and CIN85."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In the absence of a steady SLP65/CIN85 complex, BCR-induced Ca(2+) and NF-"
      explanation: >-
        Directly measures the loss of calcium and NF-kappaB responses when the
        constitutive complex is absent. The quote stops at "NF-" because the
        cached text renders kappaB with a Greek character that is not a stable
        matching substring.
- name: Impaired B Cell Receptor Effector Signalling
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    The failure is SELECTIVE, and that selectivity is the disease's defining
    feature. In the patients' B cells, distinct effector pathways of the B cell
    antigen receptor were defective - most notably NF-kB activation and
    upregulation of CD86 on the cell surface - while the cells themselves
    developed and persisted normally. In the cell-line and reconstitution models
    the same lesion abrogates BCR-induced calcium and NF-kB responses. What is
    lost is the capacity of a B cell to translate receptor engagement into an
    effector programme, not the B cell itself.
  biological_processes:
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: DECREASED
  - preferred_term: B cell receptor signaling pathway
    term:
      id: GO:0050853
      label: B cell receptor signaling pathway
    modifier: DECREASED
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:29636373
    reference_title: "Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of CIN85, all immune cell compartments developed normally, but B lymphocytes showed intrinsic defects in distinct effector pathways of the B cell antigen receptor, most notably NF-"
    explanation: >-
      The central human observation: normal development of every immune
      compartment, with an intrinsic and selective B cell effector defect. The
      quote stops at "NF-" because the cached text renders kappaB with a Greek
      character that is not a stable substring.
  - reference: PMID:29636373
    reference_title: "Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "B activation and up-regulation of CD86 expression on the cell surface. These results reveal nonredundant functions of CIN85 for humoral immune responses."
    explanation: >-
      Names the second affected effector arm, CD86 upregulation, and states the
      authors' conclusion that these CIN85 functions are non-redundant. The quote
      begins mid-word for the reason given on the preceding evidence item.
  downstream:
  - target: Defective Antibody Production by Intrinsically Impaired B Cells
    causal_link_type: DIRECT
    description: >-
      A B cell that cannot execute the BCR effector programme cannot mount an
      effective antibody response, even though it is present in normal numbers.
    evidence:
    - reference: PMID:42375371
      reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SH3KBP1 deficiency, currently classified as Immunodeficiency 61 (IMD61), has recently been associated with impaired BCR signaling, defective antibody production, altered memory B-cell subsets, and susceptibility to recurrent bacterial infections"
      explanation: >-
        States the chain from impaired BCR signalling to defective antibody
        production, altered memory B cell subsets and infection susceptibility.
- name: Defective Antibody Production by Intrinsically Impaired B Cells
  biological_scale: CELLULAR
  role: effector
  description: >-
    The humoral response fails at the level of what B cells DO rather than
    whether they exist. Reported consequences include defective antibody
    production and altered memory B cell subsets. This is where the entity's
    legacy naming misleads: a disease called "agammaglobulinemia, X-linked, type
    2" in which every immune compartment develops normally is not an
    agammaglobulinemia.
  cell_types:

        Marked PARTIAL because this patient carries a partial SH3KBP1 deletion
        classified as a variant of uncertain significance.
- name: Neurodevelopmental Involvement
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Neurodevelopmental features have accompanied the immune phenotype in every
    reported individual: attention-deficit/hyperactivity disorder and mild
    cognitive impairment in the two brothers, and autism spectrum disorder with
    developmental delay in the later case. Whether this reflects a genuine
    second function of CIN85 or ascertainment in patients who reached genetics
    services for developmental reasons is not established. Two things make it
    worth curating rather than dismissing: CIN85 is ubiquitously expressed and
    brain was one of only two compartments in which it had been conditionally
    ablated in mice before the human report; and in the later case the deletion
    also spanned neighbouring genes, so a contiguous-gene effect cannot be
    excluded. The causal link is therefore typed as having unknown intermediates
    and its evidence marked PARTIAL throughout.
  evidence:
  - reference: PMID:42375371
    reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "both patients also presented with neurodevelopmental manifestations, including attention-deficit/hyperactivity disorder (ADHD) and mild cognitive impairment"
    explanation: >-
      Documents neurodevelopmental features in the founding brothers. Marked
      PARTIAL because it is reported second-hand in a later paper rather than
      quoted from the primary description.
  - reference: PMID:42375371
    reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support a possible contribution of SH3KBP1 to shared immunological and neurodevelopmental pathways; however, its pathogenic role has not yet been definitively established."
    explanation: >-
      The authors' own hedged statement of the immune-neurodevelopmental link,
      preserved rather than strengthened.
  downstream:
  - target: Attention deficit hyperactivity disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      ADHD was reported in both founding brothers. No mechanism connecting CIN85
      loss to it has been proposed.
    evidence:
    - reference: PMID:42375371
      reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "neurodevelopmental manifestations, including attention-deficit/hyperactivity disorder (ADHD) and mild cognitive impairment"
      explanation: >-
        Documents ADHD among the neurodevelopmental features.

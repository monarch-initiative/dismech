- name: Genetic Testing and Counseling
  description: >-
    Both reported lesions are deletions, one intragenic and one a partial
    deletion detected by chromosomal microarray - so a copy-number-aware assay is
    required and a sequencing-only panel can miss the diagnosis. Counseling must
    convey the state of the evidence honestly: with two affected individuals
    reported and the only subsequent variant classified as of uncertain
    significance, an SH3KBP1 finding is not a settled diagnosis, and predictive
    interpretation in relatives should be correspondingly cautious.

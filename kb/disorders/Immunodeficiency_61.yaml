treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    The standard management of a primary antibody deficiency is to supply the
    antibody the patient cannot make. No trial or case series has evaluated
    immunoglobulin replacement in SH3KBP1 deficiency specifically - with two
    reported patients, none could exist - so this is the class-level standard of
    care for inborn errors of immunity with impaired antibody production,
    recorded as such rather than as disease-specific evidence.
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Defective Antibody Production by Intrinsically Impaired B Cells
    treatment_effect: BYPASSES
    description: >-
      Replacement immunoglobulin substitutes for the antibody the patient's B
      cells fail to produce. It bypasses the defect; it does not repair the
      signalling module, and it does not restore the patient's own specific
      antibody responses.

inheritance:
- name: X-linked recessive inheritance
  description: >-
    SH3KBP1 lies at Xp22.12, and the reported affected individuals are
    hemizygous males - two brothers in the founding report, and a boy with a
    partial deletion in a later case. Segregation is incompletely characterised:
    in the later case, testing was limited to the mother and extended family
    studies were unavailable, so mosaicism could not be excluded.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance

name: Immunodeficiency 61
creation_date: "2026-08-25T00:00:00Z"
category: Mendelian
synonyms:
- IMD61
- AGMX2
- agammaglobulinemia, X-linked, type 2
- XLA2
- CIN85 deficiency
- SH3KBP1-related X-linked antibody deficiency
description: >-
  Immunodeficiency-61 is an X-linked recessive primary ANTIBODY deficiency caused
  by loss of CIN85, the Cbl-interacting protein of 85 kDa encoded by SH3KBP1 at
  Xp22.12. CIN85 is not a signalling enzyme; it is a trimeric adaptor whose nine
  SH3 domains oligomerise SLP65, the central scaffold of the B cell antigen
  receptor. That SLP65-CIN85 association is CONSTITUTIVE rather than
  stimulus-induced: in a resting B cell the two proteins already sit together in
  cytoplasmic granules formed by phase separation with lipid vesicles, and this
  preformed transducer module is what allows a B cell to respond efficiently the
  moment its receptor is engaged. Without CIN85 the module cannot assemble,
  SLP65 phosphorylation and membrane translocation fail, and selected BCR
  effector arms - NF-kB activation and CD86 upregulation in the human patients,
  calcium and NF-kB responses in the cell models - do not fire.


  The clinical consequence is narrower than the disease's legacy names suggest.
  In the reported patients all immune cell compartments developed normally and
  the defect is intrinsic to the B cell's effector response, not to B cell
  production - so despite the synonyms AGMX2, XLA2 and "agammaglobulinemia,
  X-linked, type 2", and despite MONDO placing this concept under
  agammaglobulinemia, these patients do not have agammaglobulinemia. Recurrent
  bacterial infection of the respiratory tract with impaired specific antibody
  responses and altered memory B cell subsets is the phenotype.


  EVIDENCE BASE IS VERY THIN, and the entry is written accordingly. Two affected
  individuals - brothers - have been reported. A third, later case carried only
  a PARTIAL SH3KBP1 deletion classified as a variant of uncertain significance,
  and its authors state plainly that a causal relationship remains unproven. No
  ClinGen gene-disease validity assertion for SH3KBP1 was found in the cached
  ClinGen snapshot. Nothing here should be read as an established, clinically
  actionable gene-disease relationship.

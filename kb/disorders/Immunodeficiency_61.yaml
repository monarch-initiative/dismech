genetic:
- name: SH3KBP1 loss-of-function deletion
  gene_term:
    preferred_term: SH3KBP1
    term:
      id: hgnc:13867
      label: SH3KBP1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    SH3KBP1 (CIN85) at Xp22.12 is the gene MedGen and OMIM associate with IMD61;
    MONDO:0010296 itself records no causal-gene relationship, so the anchor here
    comes from OMIM/MedGen, and that MONDO gap is worth reporting upstream.
    Evidence strength should be stated plainly rather than implied: only two
    affected individuals - brothers - have been reported with loss-of-function
    SH3KBP1 variants, and the one subsequent case carries a partial deletion
    classified as a variant of uncertain significance whose authors state that a
    causal relationship remains unproven. No ClinGen gene-disease validity
    assertion for SH3KBP1 was present in the cached ClinGen snapshot.
    `relationship_type` is nonetheless CAUSATIVE rather than DISPUTED because
    the founding report demonstrated the mechanism functionally in patient cells
    and no publication disputes the relationship; the limitation is quantity of
    evidence, not conflict within it.
  variants:
  - name: Germline intragenic SH3KBP1 deletion (founding kindred)
    description: >-
      A germline deletion within the CIN85 gene on the X chromosome, hemizygous
      in two affected brothers, described by a later report as loss of function.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29636373
      reference_title: "Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients harboring a germline deletion within the CIN85 gene on the X chromosome"
      explanation: >-
        Describes the founding lesion.
  - name: Partial hemizygous Xp22.12 deletion involving SH3KBP1 (later case)
    description: >-
      A hemizygous deletion at Xp22.12 partially involving SH3KBP1, detected by
      chromosomal microarray and classified as a variant of uncertain
      significance. The deleted interval also spans neighbouring genes, so a
      contiguous-gene contribution cannot be excluded, and no functional studies
      were performed.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:42375371
      reference_title: "Case Report: MECP2 and SH3KBP1 variants associated with autism spectrum disorder and immune dysregulation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "a hemizygous deletion at Xp22.12 partially involving the SH3KBP1 gene was detected and classified as a variant of uncertain significance (VUS)"

- name: Resolution of White Matter Edema
  biological_scale: TISSUE
  description: >-
    White matter signal abnormality and swelling normalize or greatly improve over the first years, cysts and
    near-cystic rarefaction decrease, head circumference frequently returns into the normal range, and the early motor
    delay resolves. The proposed explanation is that a partial reduction of GlialCAM and MLC1 function matters while the
    perivascular astrocyte complex is being assembled in early postnatal life and ceases to matter once it is in place,
    so the same genotype is pathogenic in an infant and tolerated in an adult. This node is a mechanism claim about the
    course and is not established; the MRI observations beneath it are.

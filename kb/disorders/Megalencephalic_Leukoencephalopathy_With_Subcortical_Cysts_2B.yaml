experimental_models:
- name: GlialCAM dominance assay in HeLa cells and primary astrocytes
  experimental_model_type: CELL_LINE
  publication: PMID:31960914
  description: >-
    Stoichiometric co-expression of untagged mutant or wild-type GlialCAM with flag-tagged wild-type GlialCAM, scoring
    the proportion of cells with flag-tagged protein at cell-cell junctions. This is the assay that separates a dominant
    from a recessive GLIALCAM allele, with the recessive p.Arg92Gln allele as the internal negative control.
  modeled_mechanisms:
  - target: Dominant Interference With Wild-Type GlialCAM Trafficking
    relationship: MEASURES
    fidelity: MODERATE
    limitations: >-
      Heterologous cells co-transfected with MLC1 to maximize junctional GlialCAM, and the readout is the percentage of
      cells with junctional signal rather than a measurement in astrocyte endfeet. Transfected expression levels are not
      those of a heterozygous patient.
    evidence:
    - reference: PMID:31960914
      reference_title: Structural basis for the dominant or recessive character of GLIALCAM mutations found in leukodystrophies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        To systematically analyze the dominant behaviour of MLC2B mutations, we developed a simple test to determine
        whether a mutation was acting as dominant in terms of altered trafficking of the WT protein.
      explanation: The assay's own statement of what it measures, which is the claim of this mechanism node.
discussions:
- discussion_id: mlc2b_why_does_it_remit
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does the white matter edema of MLC2B resolve, when the same lesion produced by biallelic GLIALCAM variants
    progresses?
  attaches_to:
  - pathophysiology#Resolution of White Matter Edema
  - progression#Remission
  rationale: >-
    The remission is the defining feature of the disease and has no established mechanism. The leading account, that a
    partial reduction of GlialCAM and MLC1 function matters only while the perivascular astrocyte complex is being
    assembled, is offered as speculation by its authors and has not been tested: nobody has measured regulatory volume
    decrease, junctional MLC1 or brain water across development in cells or animals carrying a single dominant allele.
    The one heterozygous knock-in followed over months shows the lesion regressing in the anterior commissure while it
    increases in the cerebellum, so the model does not settle it either.
  proposed_experiments:
  - experiment_id: mlc2b_developmental_volume_regulation_time_course
    name: Developmental time course of volume regulation in heterozygous dominant knock-in astrocytes
    description: >-
      Measure regulatory volume decrease, junctional MLC1 and ClC-2, and brain water content in Glialcam(+/R92W) or
      Glialcam(+/G89S) mice across the postnatal window in which the perivascular complex forms and again in adults,
      against wild-type and Glialcam-null littermates.
    would_support:
    - pathophysiology#Resolution of White Matter Edema
    supporting_outcome:
    - >-
      A volume-regulation and junctional-protein deficit that is present during the early postnatal window and has
      closed by adulthood in the heterozygote, while the null animal's deficit persists.
    refuting_outcome:
    - >-
      An equal deficit at both ages in the heterozygote, which would put the remission somewhere other than in a
      developmental window of GlialCAM dependence.
  evidence:
  - reference: PMID:33551753
    reference_title: "Megalencephalic Leukoencephalopathy: Insights Into Pathophysiology and Perspectives for Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      With this model, it has been speculated that dominant MLC2B mutations may lead to a minor reduction of
      GlialCAM/MLC1 function, which might be pathogenic in humans only at the early stages of life.
    explanation: The hypothesis, stated as speculation, which is the state of the answer to this question.
  - reference: PMID:34723793
    reference_title: Megalencephalic leukoencephalopathy with subcortical cysts is a developmental disorder of the gliovascular unit.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During postnatal development (from P5 to P15 in the mouse), MLC1 forms a membrane complex with GlialCAM (another
      astrocytic transmembrane protein) at the junctions between perivascular astrocytic processes.
    explanation: >-
      Establishes that the complex this disease disturbs is assembled in a defined postnatal window, which is what makes
      the developmental-window account plausible; the work was done in Mlc1-null mice, not in a dominant GLIALCAM model.
- discussion_id: mlc2b_autism_excess
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why are intellectual disability and autistic features more common in MLC2B, whose white matter lesion resolves, than
    in the classic forms whose lesion persists?
  attaches_to:
  - pathophysiology#Disrupted GlialCAM Interactome in Developing Astrocytes
  - phenotypes#Autistic Behavior
  - phenotypes#Intellectual Disability
  rationale: >-
    The developmental phenotype runs opposite to the white matter phenotype, which is hard to explain if both follow
    from the same endfoot defect. Candidate routes exist, including GlialCAM's role in astrocyte territory and gap
    junction coupling and the loss of association with Connexin 43 and KCNQ2 shown for dominant variants in developing
    mouse cortex, but none has been connected to the cognitive or behavioural phenotype, and the frequency figures
    themselves come from clinician-reported rather than instrument-based assessment.
  evidence:
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therefore, while motor symptoms are invariably milder in remitting MLC, the occurrence of autistic features is
      higher. The basis for this difference is not understood.
    explanation: States the gap, in the review that is the current synthesis for this disease.
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As formal, standardized assessment of motor and cognitive development, autistic features, behavioral problems, and
      current cognitive function was not feasible, these items were subjectively assessed by physicians and caretakers or
      derived from medical records.
    explanation: The cohort's own statement of how the behavioural items were ascertained, which bounds the frequencies.
- discussion_id: mlc2b_no_human_tissue
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the tissue-level mechanisms of this disease, inferred from mice, hold in a patient heterozygous for a dominant
    GLIALCAM variant?
  attaches_to:
  - pathophysiology#Loss of Junctional MLC1 and ClC-2 at Astrocyte Endfeet
  - pathophysiology#Intramyelinic Edema and Myelin Vacuolation
  rationale: >-
    Brain tissue from patients with GLIALCAM-related MLC is unavailable, and the disease is mild enough that it is
    unlikely to become available. So every tissue-level node here rests on model systems whose fidelity is in question
    at exactly the point that matters: the two heterozygous knock-ins show white matter vacuoles but no MRI abnormality,
    the one patient brain studied in any form of MLC carried an MLC1 variant and had preserved GlialCAM at junctions,
    and the measurements that bound the dominant allele's residual chaperone activity were made in homozygous animals
    whose genotype no patient has. This is not an absence of evidence but a translational question about the evidence
    there is.
  proposed_experiments:
  - experiment_id: mlc2b_patient_ipsc_astrocyte_model
    name: Patient-derived astrocyte model of a dominant GLIALCAM allele
    description: >-
      Differentiate astrocytes from induced pluripotent stem cells of a patient heterozygous for p.Arg92Trp and an
      isogenic corrected control, and measure junctional GlialCAM, MLC1 and ClC-2 and regulatory volume decrease.
    would_support:
    - pathophysiology#Loss of Junctional MLC1 and ClC-2 at Astrocyte Endfeet
    supporting_outcome:
    - >-
      Reduced junctional MLC1 and ClC-2 and impaired volume recovery in the patient astrocytes, corrected in the
      isogenic control, in human cells carrying one dominant allele at its native locus and expression level.
    refuting_outcome:
    - >-
      Junctional MLC1 and ClC-2 and volume recovery indistinguishable from the corrected control, which would put the
      human mechanism elsewhere than the endfoot complex.
  evidence:
  - reference: PMID:28695146
    reference_title: "Megalencephalic leukoencephalopathy with cysts: the Glialcam-null mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: Brain tissue of MLC patients is extremely scarce for MLC1 mutations and unavailable for GLIALCAM mutations.
    explanation: States the absence of human tissue for any GLIALCAM-related form of MLC, this one included.
  - reference: PMID:21624973
    reference_title: Molecular mechanisms of MLC1 and GLIALCAM mutations in megalencephalic leukoencephalopathy with subcortical cysts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the amount of GlialCAM and its localization were nearly unaffected, indicating that MLC1 is not necessary
      for GlialCAM expression or targeting.
    explanation: >-
      The one post-mortem MLC brain studied, an MLC1 case, in which GlialCAM was preserved; an illustration that mouse
      findings in this pathway need not transfer to human tissue.
  - reference: PMID:31372844
    reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      No MRI abnormality was observed during the entire period in GlialcamArg92Trp/+ and wild-type mice (data not shown).
    explanation: >-
      The heterozygous knock-in does not reproduce the imaging phenotype that defines the human disease, which is the
      specific mismatch this discussion records.
mechanistic_hypotheses:
- hypothesis_group_id: developmental_window_for_glialcam_function
  hypothesis_label: >-
    The partial loss of GlialCAM function matters only while the perivascular astrocyte complex is being assembled
  status: EMERGING
  description: >-
    The proposed explanation of the remission. One wild-type allele is expressed and the mutant protein keeps part of
    its chaperone activity, so the reduction of junctional GlialCAM, MLC1 and ClC-2 is partial; the suggestion is that
    this partial reduction is enough to cause white matter edema while the MLC1-GlialCAM complex is being established at
    perivascular astrocyte junctions in early postnatal life, and not enough to matter once it is established. It stays
    a hypothesis because it was put forward as speculation from the knock-in mouse, because no measurement of volume
    regulation or junctional protein has been made across development in a cell or animal with a single dominant allele,
    and because the one heterozygous knock-in followed longitudinally shows regression in one tract alongside
    progression in another.
  evidence:
  - reference: PMID:33551753
    reference_title: "Megalencephalic Leukoencephalopathy: Insights Into Pathophysiology and Perspectives for Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In agreement with the reversibility of the phenotype observed in MLC2B patients in adult stages, a decreased
      GlialCAM/MLC1 function may not be so pathogenic in adults as it is in infants
    explanation: The hypothesis in the words of the review that states it.
  - reference: PMID:24647135
    reference_title: Disrupting MLC1 and GlialCAM and ClC-2 interactions in leukodystrophy entails glial chloride channel dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Hence, GlialCAM stabilizes MLC1 and the G89S mutant partially retains this stabilizing effect.
    explanation: The partial, rather than complete, loss of function that the hypothesis starts from.
- hypothesis_group_id: glialcam_developmental_astrocyte_function
  hypothesis_label: >-
    A developmental function of GlialCAM outside the endfoot complex produces the intellectual disability and autistic
    features
  status: EMERGING
  description: >-
    A candidate account of the part of the phenotype that does not remit. GlialCAM controls astrocyte territory,
    branching and gap junction coupling in mouse cortex, and dominant variants expressed in astrocytes of the developing
    mouse cortex redistribute the protein and lose association with Connexin 43, ClC-2 and the potassium channel KCNQ2.
    Since autistic features are commoner here than in the classic forms whose white matter lesion is worse, a route
    separate from the endfoot volume-regulation complex is attractive. It stays a hypothesis because the interactome and
    coupling work used viral overexpression or conditional knockout rather than a patient genotype, because no study has
    connected any of these changes to a cognitive or behavioural outcome, and because the human frequencies rest on
    clinician-reported assessment.
  evidence:
  - reference: PMID:42649352
    reference_title: Pathogenic Variants in HEPACAM Alter Protein Localization and Interactome in Astrocytes of the Developing Mouse Cortex.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HEPACAM encodes hepatic and glial cell adhesion molecule (hepaCAM), also known as GlialCAM, an astrocyte-enriched
      transmembrane protein with important roles in astrocyte territory establishment, gap junction coupling, branching
      organization, synaptic function, and development of the gliovascular unit.
    explanation: The developmental functions of GlialCAM this hypothesis appeals to.
  - reference: PMID:42649352
    reference_title: Pathogenic Variants in HEPACAM Alter Protein Localization and Interactome in Astrocytes of the Developing Mouse Cortex.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, we identified the epilepsy-associate potassium channel KCNQ2 as a novel hepaCAM interaction partner and
      found reduced association between KCNQ2 and pathogenic variants.
    explanation: >-
      A specific interaction lost by the dominant variants in developing astrocytes; the step from it to the human
      phenotype is not made.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It suggests that dominant GLIALCAM variants disrupt a function of GlialCAM that is separate from its role in
      astrocyte endfeet.
    explanation: The inference that motivates this hypothesis, drawn by the variant update from the autism frequencies.

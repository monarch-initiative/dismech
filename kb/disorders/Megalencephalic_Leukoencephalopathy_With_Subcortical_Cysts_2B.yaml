name: Megalencephalic Leukoencephalopathy With Subcortical Cysts 2B
creation_date: "2026-10-31T14:00:00Z"
category: Mendelian
description: >-
  Autosomal dominant, remitting form of megalencephalic leukoencephalopathy with subcortical cysts (MLC), caused by a
  single heterozygous missense variant in the first immunoglobulin (IgV) domain of HEPACAM, which encodes the astrocyte
  adhesion molecule GlialCAM. Unlike the recessive alleles that cause classic MLC2A, these alleles act on the wild-type
  protein: co-expressed with wild-type GlialCAM they reduce its delivery to astrocyte-astrocyte junctions, and with it
  the junctional pool of MLC1 and of the ClC-2 chloride channel. The alleles fall into two structural groups, those that
  disrupt GlialCAM cis dimerization within one cell (p.Gly89Ser, p.Gly89Asp, p.Arg92Trp) and those that disrupt trans
  interaction between apposed cells (p.Gln56Pro, p.Ser59Asn, p.Asp128Asn). In the first year of life the clinical and
  MRI picture resembles classic MLC, with macrocephaly and diffusely swollen, abnormal cerebral white matter, but the
  course then diverges: white matter signal and swelling normalize or greatly improve, motor function is preserved and
  no neurological regression occurs, and head circumference often falls back into the normal range. The residual burden
  is developmental rather than degenerative, with stable intellectual disability in about a quarter of patients and
  autistic features more common than in classic MLC; seizures are much less frequent. Many patients inherit the variant
  from a parent whose only finding was transient macrocephaly in infancy, and some carriers are never diagnosed, so
  penetrance is incomplete. Why the edema resolves is unresolved; the leading account is that the partial reduction of
  GlialCAM and MLC1 function matters only while the perivascular astrocyte complex is being built.

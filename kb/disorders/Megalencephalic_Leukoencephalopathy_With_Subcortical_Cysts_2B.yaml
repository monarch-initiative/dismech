environmental:
- name: Head trauma
  description: >-
    GeneReviews advises against contact sports for MLC as a whole. The trauma-provoked deterioration behind that advice
    is documented in classic MLC, where minor head trauma can provoke seizures, transient motor regression and loss of
    consciousness; no such event has been reported in a patient with a single dominant HEPACAM variant, so the
    recommendation reaches this disease through the shared management guidance rather than through its own evidence.
    This entry therefore declares no mechanism link.
  notes: >-
    No exposure_term is bound. ECTO has no exposure class for physical injury; the searches run for the MLC1 entry are
    recorded there and were not repeated.
  evidence:
  - reference: PMID:20301707
    reference_title: Megalencephalic Leukoencephalopathy with Subcortical Cysts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Contact sports and other activities associated with a high risk of head trauma should be avoided.
    explanation: >-
      GeneReviews management recommendation, written for MLC as a whole and so covering this form; it is advice rather
      than an observation in a patient with a dominant variant.
animal_models:
- name: Glialcam G89S heterozygous knock-in mouse
  species: Mouse
  genotype: Glialcam(+/G89S), reported as Glialcam(+/dn)
  publication: PMID:24647135
  description: >-
    Knock-in of the dominant patient allele G89S. Only the heterozygote matches the human genotype, and it shows an
    intermediate picture, with MLC1 diffusely distributed in the cerebellar molecular layer, only a little left along
    Bergmann glia processes, ClC-2 retained in Bergmann glia somata, and the mildest myelin vacuolation of all the lines
    studied. The homozygote, to which no patient corresponds, has the full mislocalization phenotype and cerebellar
    vacuoles, and shows that the mutant protein keeps part of its ability to stabilize MLC1.
  modeled_mechanisms:
  - target: Dominant Interference With Wild-Type GlialCAM Trafficking
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Reported localization changes were read from immunolabelling of Bergmann glia and endfeet rather than from a
      quantitative trafficking assay, and the dominant effect on the wild-type allele's product cannot be separated from
      the mutant protein's own mislocalization in this animal. Most of the characterization is of the homozygote, whose
      genotype no patient has.
    evidence:
    - reference: PMID:31960914
      reference_title: Structural basis for the dominant or recessive character of GLIALCAM mutations found in leukodystrophies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        This mutation affected the targeting of the protein to cell–cell junctions in Bergmann glia, showed vacuoles in
        the cerebellum in homozygous mice and the heterozygous mice for this mutation showed also a partially altered
        GlialCAM localization.
      explanation: >-
        Summary of the knock-in results by a later paper from the same field; the heterozygote, which is the patient
        genotype, has a partial trafficking phenotype.
  - target: Loss of Junctional MLC1 and ClC-2 at Astrocyte Endfeet
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      The protein measurements behind this were made in homozygous animals, so they bound the mutant protein's residual
      chaperone activity rather than the heterozygous state of a patient.
    evidence:
    - reference: PMID:24647135
      reference_title: Disrupting MLC1 and GlialCAM and ClC-2 interactions in leukodystrophy entails glial chloride channel dysfunction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Hence, GlialCAM stabilizes MLC1 and the G89S mutant partially retains this stabilizing effect.
      explanation: >-
        The dominant allele reduces rather than abolishes the MLC1 pool, which is the partial loss this disease's
        mechanism rests on.
- name: Glialcam Arg92Trp heterozygous knock-in mouse
  species: Mouse
  genotype: Glialcam(+/R92W)
  publication: PMID:31372844
  description: >-
    CRISPR knock-in of the recurrent dominant patient allele in the single copy patients carry. White matter vacuolation
    appears in the anterior commissure within the first month and then declines over following months, which is the
    animal counterpart of the human remission, while cerebellar vacuolation appears at 3 months and increases. Glialcam
    immunofluorescence is reduced but no clear mislocalization was seen. No MRI abnormality was detected at any age.
  modeled_mechanisms:
  - target: Intramyelinic Edema and Myelin Vacuolation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Vacuolation was scored in the anterior commissure and cerebellum, not in the cerebral hemispheric white matter
      that dominates in patients, and no MRI change was found at any time point, so the imaging phenotype that defines
      the human disease is absent. Only histology and immunofluorescence were reported; there were no behavioural or
      volume-regulation measurements.
    evidence:
    - reference: PMID:31372844
      reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Vacuoles were detected in the anterior commissural WM in GlialcamArg92Trp/+ and GlialcamLys68Met/Thr132Asn mice
        at 1 month, indicating that the pathological change started from the infant period, consistent with findings in
        human patients.
      explanation: The lesion in a mouse heterozygous for the recurrent dominant patient allele, at the human age of onset.
  - target: Resolution of White Matter Edema
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      The regression was seen in the anterior commissure while cerebellar vacuolation increased over the same months, so
      the model does not remit as a whole; and because the mouse never shows an MRI abnormality, it cannot report the
      radiological normalization that defines remission in patients.
    evidence:
    - reference: PMID:31372844
      reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thereafter, the vacuoles showed a decreased tendency at subsequent time points, a similar phenomenon observed in
        the corpus callosum of Glialcam-null mice
      explanation: >-
        Regression of the lesion in the heterozygous knock-in; the authors note the same happens in the null mouse,
        whose human counterpart does not remit, which is why fidelity is LOW.
- name: AAV-expressed dominant hepaCAM variants in developing mouse cortical astrocytes
  species: Mouse
  genotype: Wild type, transduced with AAV-PHP.eB expressing human hepaCAM G89S, Q56P or D128N under the gfaABC1D promoter
  publication: PMID:42649352
  description: >-
    Viral expression of one dominant allele from each structural group in astrocytes of the developing mouse cortex,
    with proximity-based proteomics. All three redistribute hepaCAM across the astrocyte, reduce co-localization with
    Connexin 43 and change the interactome, including loss of association with ClC-2 and with KCNQ2.

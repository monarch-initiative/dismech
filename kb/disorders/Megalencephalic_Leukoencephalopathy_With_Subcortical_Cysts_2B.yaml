phenotypes:
- category: Neurological
  name: Macrocephaly
  description: >-
    The presenting sign, as in every form of MLC, developing in the first year of life. It often does not persist:
    secondary normocephaly was particularly common in this form, and in one family the head circumference of the carrier
    mother and uncle had returned into the normal range by adulthood.

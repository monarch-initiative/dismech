  - target: Disrupted GlialCAM Interactome in Developing Astrocytes
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Overexpression on top of the endogenous mouse protein rather than a knock-in at the native locus, so the
      stoichiometry is not that of a patient; the authors note that the effect on endogenous hepaCAM distribution at

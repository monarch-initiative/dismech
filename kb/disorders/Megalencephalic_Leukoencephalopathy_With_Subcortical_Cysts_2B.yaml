genetic:
- name: HEPACAM
  gene_term:
    preferred_term: HEPACAM
    term:
      id: hgnc:26361
      label: HEPACAM
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The literature calls the protein GlialCAM or hepaCAM and usually the gene GLIALCAM; the HGNC symbol is HEPACAM. Of
    the 29 GLIALCAM variants reported in MLC patients, 11 act dominantly and cause this disease, all in exon 2 and all
    missense except one single-codon deletion. GeneReviews states the molecular criterion for improving MLC as a
    heterozygous gain-of-function HEPACAM variant; the functional studies describe these alleles as reducing delivery of
    the wild-type protein to junctions, which is why the pathophysiology records the impact as dominant negative rather
    than as a gain of function. Patients carrying a dominant variant on one allele together with a recessive variant on
    the other have classic MLC, not this disease.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_3da28582-9929-4fcd-8c77-13dc1705b168-2023-01-12T190000.000Z
    evidence:
    - reference: CGGV:assertion_3da28582-9929-4fcd-8c77-13dc1705b168-2023-01-12T190000.000Z
      reference_title: "HEPACAM / megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting, with or without intellectual disability (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HEPACAM | HGNC:26361 | megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting, with or without intellectual disability | MONDO:0013491 | AD | Definitive"
      explanation: ClinGen classifies the HEPACAM to MLC2B relationship, autosomal dominant, as definitive.
  evidence:
  - reference: PMID:21419380
    reference_title: "Mutant GlialCAM causes megalencephalic leukoencephalopathy with subcortical cysts, benign familial macrocephaly, and macrocephaly with retardation and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dominant HEPACAM mutations can cause either macrocephaly and mental retardation with or without autism or benign
      familial macrocephaly.
    explanation: Identification of dominant HEPACAM variants and the phenotypes they produce.
  - reference: CGGV:assertion_3da28582-9929-4fcd-8c77-13dc1705b168-2023-01-12T190000.000Z
    reference_title: "HEPACAM / megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting, with or without intellectual disability (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Seven unique variants, including 6 missense and 1 ins/del mutations that have been reported in 22 probands and 3
      affected siblings with improving MLC phenotypes in three publications
    explanation: The genetic evidence ClinGen counted for this gene-disease pair.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For GLIALCAM variants, there is a clear genotype-phenotype correlation: Dominant variants lead to remitting MLC
      when present in heterozygous form.
    explanation: The genotype to phenotype rule that separates this disease from MLC2A.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some patients from the ALC database have a dominant variant on one allele and a recessive variant on the second
      allele. These patients have classic MLC.
    explanation: Grounds the caveat in this record's notes about compound genotypes.
  variants:
  - name: p.Arg92Trp (c.274C>T)
    description: >-
      The recurrent dominant allele, accounting for four of the five MLC2B patients in a Chinese series. It sits in the
      cis dimerization segment, loses interaction with wild-type GlialCAM and reduces the wild-type protein's junctional
      localization. The same residue carries the recessive MLC2A allele p.Arg92Gln.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:31372844
      reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The mutation c.274C>T (p.Arg92Trp) accounted for four of the five patients with MLC2B.
      explanation: Recurrence of the allele in a clinical series.
    - reference: PMID:31960914
      reference_title: Structural basis for the dominant or recessive character of GLIALCAM mutations found in leukodystrophies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        whereas GlialCAM containing two different types of MLC2B mutations (p.R92W and p.D128N) reduced the localization
        of flag-tagged GlialCAM at cell–cell junctions
      explanation: The dominant effect of this allele on the wild-type protein.
  - name: p.Gly89Ser (c.265G>A)
    description: >-
      Dominant cis-interface allele with incorrect junctional localization and impaired homo-oligomerization. It is the
      allele knocked into the Glialcam(dn) mouse line, which with the p.Arg92Trp knock-in is one of only two in vivo
      models of a dominant GLIALCAM variant.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38487253
      reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
      supports: SUPPORT
      evidence_source: IN_VITRO

notes: >-
  The GeneReviews chapter covers every form of MLC together and calls this one improving MLC. Nearly all of the
  MLC2B-specific clinical figures below come from the 2018 international cross-sectional cohort (PMID:29661901), which
  held 38 MLC2B patients beside 187 with MLC1 and 17 with MLC2A, so a figure quoted from that paper for MLC2B is a
  figure for that cohort rather than a population estimate. Where a frequency is reported only for the pooled MLC
  cohort, the evidence item says so. No brain tissue from a patient with GLIALCAM-related MLC has been studied, so every
  tissue-level mechanism node rests on knock-in and knockout mice and on cultured cells; of those models only the
  heterozygous Glialcam knock-ins carry a dominant allele in the single copy that patients have. GeneReviews states the
  diagnostic molecular criterion for improving MLC as a heterozygous gain-of-function HEPACAM variant, while the
  functional literature describes the same alleles as interfering with trafficking of the wild-type protein; the
  mechanism nodes follow the functional experiments and record the impact as dominant negative. The remission itself is
  carried as a pathophysiology node and in the progression phases rather than as a phenotype, because HPO has no term
  for the resolution of a finding.
pathophysiology:
- name: Heterozygous Dominant GLIALCAM IgV Variant
  biological_scale: MOLECULAR
  description: >-
    A single heterozygous missense variant in exon 2 of HEPACAM, encoding the first immunoglobulin (IgV) domain of
    GlialCAM, is the whole genetic lesion; the second allele is wild type. Eleven of the 29 GLIALCAM variants known from
    MLC patients act dominantly, all of them in exon 2 and all missense except one single-codon deletion. The variant is
    inherited from a parent in about four fifths of cases and arises de novo in the rest. The recurrent allele is
    p.Arg92Trp, and the same residue also carries the recessive MLC2A allele p.Arg92Gln, so the amino acid substituted
    rather than the position decides the mode of inheritance.

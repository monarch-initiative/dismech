        show incorrect junctional localization and impaired homo-oligomerization
      explanation: Variant table row for this allele.
    - reference: PMID:24647135
      reference_title: Disrupting MLC1 and GlialCAM and ClC-2 interactions in leukodystrophy entails glial chloride channel dysfunction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: This mutation (G89S) is found in MLC patients with dominant disease
      explanation: The allele chosen for the knock-in mouse, and its dominant status.
  - name: p.Asp128Asn (c.382G>A)
    description: >-
      Dominant trans-interface allele. It keeps normal interaction with wild-type GlialCAM yet still reduces the
      wild-type protein's junctional targeting, and it introduces a new N-glycosylation site.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:31960914
      reference_title: Structural basis for the dominant or recessive character of GLIALCAM mutations found in leukodystrophies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Dominant mutants p.S59N and p.D128N introduce new glycosylation sites in GlialCAM.
      explanation: The structural consequence of this allele and of p.Ser59Asn.
  - name: p.Gln56Pro (c.167A>C)
    description: >-
      Dominant trans-interface allele found in a patient whose MRI and clinical parameters improved; it mislocalizes
      GlialCAM and its partners while still activating ClC-2 like the wild-type protein. The variant update classifies
      it as of unknown significance.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:24202401
      reference_title: Expanding the spectrum of megalencephalic leukoencephalopathy with subcortical cysts in two patients with GLIALCAM mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The first patient has MLC2B disease, as shown by the improvement in MRI and clinical parameters. In this case,
        we identified a novel GLIALCAM mutation (p.Q56P) which affected the localization of GlialCAM and its associated
        subunits, however activating ClC-2 function as the wild-type protein.
      explanation: The patient and the functional characterization of the allele.
    - reference: PMID:38487253
      reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        | 2 | c.167A>C | p.(Gln56Pro) | Missense | Variant of unknown significance | Arnedo et al. (2014b)
      explanation: Grounds the uncertain classification recorded here rather than a pathogenic one.
  - name: p.Arg92Pro (c.275G>C)
    description: >-
      Dominant allele first reported in a Chinese patient with MLC2B who had autism and absent language, inherited from
      a mother with transient macrocephaly.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:31372844
      reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        while Pt4 had a novel variant c.275G>C(p.Arg92Pro) (Fig. S3), which has not been reported before
      explanation: First report of the allele, in a patient diagnosed with MLC2B.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  de_novo_rate: Approximately 20% of individuals, per GeneReviews.
  description: >-
    A single heterozygous HEPACAM variant causes the disease, inherited from a parent in about four fifths of cases and
    de novo in the rest. The transmitting parent is typically macrocephalic, sometimes only transiently in infancy, and
    some carriers are not diagnosed at all, so penetrance is incomplete and expressivity variable.
  evidence:
  - reference: PMID:20301707
    reference_title: Megalencephalic Leukoencephalopathy with Subcortical Cysts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Improving MLC most commonly occurs as an autosomal dominant disorder caused by an inherited or de novo pathogenic
      variant in HEPACAM.
    explanation: GeneReviews genetic counseling statement for this disease.
  - reference: PMID:20301707
    reference_title: Megalencephalic Leukoencephalopathy with Subcortical Cysts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Approximately 20% of individuals with heterozygous HEPACAM-related improving MLC have the disorder as a result of
      a de novo pathogenic variant. Each child of an individual with heterozygous HEPACAM-related improving MLC has a
      50% chance of inheriting the pathogenic variant.
    explanation: Source of the de novo rate recorded here, and the recurrence risk.
  - reference: PMID:21419380
    reference_title: "Mutant GlialCAM causes megalencephalic leukoencephalopathy with subcortical cysts, benign familial macrocephaly, and macrocephaly with retardation and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most parents with a single mutation had macrocephaly, indicating dominant inheritance.
    explanation: The segregation observation that established dominant inheritance for these alleles.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This indicates either reduced penetrance of the variants (meaning that some individuals with a dominant variant do
      not have a disease), or it means that the remitting MLC phenotype can be so mild in some individuals that it
      remains undiagnosed.
    explanation: >-
      Grounds the INCOMPLETE penetrance value, and records that the alternative reading is ascertainment rather than
      true non-penetrance.
  - reference: PMID:32335882
    reference_title: "[Analysis of a child with megalencephalic leukoencephalopathy with subcortical cyst type 2B caused by HEPACAM variant]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant has derived from her asymptomatic mother, which suggested incomplete penetrance of the MLC2B.
    explanation: A worked instance of transmission from an unaffected carrier parent.
progression:
- phase: Infantile presentation
  age_range: First year of life
  notes: >-
    Macrocephaly develops in the first year and is the presenting sign. The MRI at this stage is that of classic MLC,
    with diffuse signal abnormality and swelling of the cerebral white matter and anterior temporal subcortical cysts or
    near-cystic rarefaction, so the disease cannot be told from classic MLC on the early clinical picture alone. Two
    features already point to this form before any improvement: normal signal of the posterior limb of the internal
    capsule, already present before the age of two in just over half of patients, and cerebellar white matter that is
    never abnormal.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In MRIs obtained in the early disease stage, absence of signal abnormalities of the posterior limb of the internal
      capsule and cerebellar white matter and presence of only rarefied subcortical white matter instead of true
      subcortical cysts were suggestive of MLC2B.
    explanation: The early-stage MRI features that identify this form before the course declares itself.
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in 54% of patients with MLC2B, in whom the MRI was obtained before the age of 2 years, the signal of the internal
      capsule was already normal
    explanation: Proportion with the normal internal capsule signal in the first two years.
- phase: Remission
  age_range: Early childhood onwards
  notes: >-
    White matter signal abnormality and swelling normalize or greatly improve, cystic white matter decreases although
    some cysts or near-cysts usually persist, head circumference frequently returns to the normal range, and the early
    motor delay resolves. No patient has a decline of motor function and all remain ambulatory. This is the phase that
    defines the disease and separates it from MLC2A, where the same early picture is followed by motor deterioration
    from a median age of about 5 years.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the patients with MLC2B had a decline of motor function; in 34% (10/29), some clumsiness remained.
    explanation: Absence of motor decline in the cohort's 38 MLC2B patients, with the residual finding.
  - reference: PMID:31372844
    reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical manifestations of the patient with MLC2A (Pt6) progressed with regression, whereas the course of the five
      MLC2B patients remained stable or improved.
    explanation: The two HEPACAM forms diverging within one series followed over years.
  - reference: PMID:20517947
    reference_title: Megalencephalic leukoencephalopathy with cysts without MLC1 defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other 8 showed major MRI improvement. They lacked motor decline. Five had normal intelligence; 3 displayed
      cognitive deficiency.
    explanation: >-
      The series that delineated this phenotype before the gene was known, and the first statement of its cognitive
      range.
- phase: Residual developmental outcome
  age_range: Childhood into adulthood
  notes: >-
    What remains is developmental rather than degenerative: stable cognitive impairment in about a quarter of patients,
    autistic features in a similar proportion, clumsiness in about a third, and infrequent epilepsy. Cognitive decline
    does not occur. Long-term follow-up is limited, and one MLC2B patient in the 2018 cohort died at 3 years of
    suspected sudden unexpected death in epilepsy, so a benign course is not the same as a risk-free one.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gross motor function and dexterity were generally well-preserved in patients with MLC2B and communication function
      to a lesser degree.
    explanation: The outcome profile, with communication the weaker domain.
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One deceased male patient with MLC2A and 1 deceased male patient with MLC2B were suspected of SUDEP at ages 23 and
      3 years, respectively.
    explanation: The single death among the 38 MLC2B patients of the cohort.
prevalence:
- population: Genetically confirmed MLC patients in the Amsterdam leukoencephalopathy database, 1991-2017
  measure_type: CASES_IN_LITERATURE
  notes: >-
    38 of 242 genetically confirmed MLC patients had MLC2B, making it the second most common genetic form of MLC after
    MLC1 and more than twice as common as the allelic recessive form MLC2A. No population prevalence or incidence has
    been published, and the variant update notes that some carriers remain undiagnosed, so any count from a referral
    database is a lower bound.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In total, 242 patients with MLC, of whom 187 had MLC1, 17 had MLC2A, and 38 had MLC2B, were included.
    explanation: Relative size of the MLC2B group in the largest published MLC cohort.
- population: Genetically confirmed MLC patients from eight Italian centres
  measure_type: CASES_IN_LITERATURE
  notes: >-
    6 of 33 patients in the largest Italian cohort carried a heterozygous HEPACAM variant, and all of them had the
    improving phenotype, which is consistent with the Amsterdam proportion.
  evidence:
  - reference: PMID:41483250
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a multicenter Italian experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-seven harbored biallelic MLC1 variants (23 distinct mutations, including three novel variants), while six
      had three distinct heterozygous HEPACAM variants.
    explanation: Independent cohort count of the heterozygous HEPACAM group.
diagnosis:
- name: Brain MRI
  description: >-
    The early MRI establishes MLC and cannot by itself separate this form from the classic forms, but three features
    point to it: normal signal of the posterior limb of the internal capsule, normal cerebellar white matter, and
    near-cystic rarefaction of subcortical white matter rather than true cysts. A follow-up scan showing normalization
    or marked improvement of the white matter is what confirms the remitting course.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In MRIs obtained in the early disease stage, absence of signal abnormalities of the posterior limb of the internal
      capsule and cerebellar white matter and presence of only rarefied subcortical white matter instead of true
      subcortical cysts were suggestive of MLC2B.
    explanation: The discriminating early MRI features, from a systematic review of first scans.
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This knowledge can be applied to direct genetic testing in patients suspected of the remitting phenotype.
    explanation: The authors' own statement of how these MRI features are used, which is to direct the molecular test.
- name: Molecular Genetic Testing
  description: >-
    The diagnosis rests on a single heterozygous pathogenic HEPACAM variant. Because the dominant alleles cluster in
    exon 2 and the recurrent one is p.Arg92Trp, a GLIALCAM result has to be read with the mode of inheritance in mind: a
    second variant on the other allele makes the disease classic MLC rather than this one. Testing the parents matters
    both for counseling and for interpretation, since the transmitting parent is often only transiently macrocephalic.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301707
    reference_title: Megalencephalic Leukoencephalopathy with Subcortical Cysts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of improving MLC is established in individuals with suggestive clinical findings and a heterozygous
      gain-of-function variant in HEPACAM or biallelic pathogenic variants in AQP4 identified by molecular genetic
      testing.
    explanation: >-
      GeneReviews molecular criterion for this disease. It calls the variant class gain-of-function, which the
      functional literature describes instead as interference with the wild-type protein.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some patients from the ALC database have a dominant variant on one allele and a recessive variant on the second
      allele. These patients have classic MLC.
    explanation: Why a GLIALCAM result must be read with the second allele in view.
differential_diagnoses:
- name: Megalencephalic leukoencephalopathy with subcortical cysts 2A
  disease_term:
    preferred_term: megalencephalic leukoencephalopathy with subcortical cysts 2A
    term:
      id: MONDO:0013490
      label: megalencephalic leukoencephalopathy with subcortical cysts 2A
  description: >-
    The allelic recessive disorder, caused by biallelic HEPACAM variants. The early picture is the same, but motor
    deterioration begins at a median age of about 5 years, the MRI abnormalities persist or worsen, most patients have
    seizures and cognitive decline follows, and autistic behaviour has not been reported. A dominant variant on one
    allele with a recessive variant on the other also gives the classic phenotype.
  distinguishing_features:
  - Two HEPACAM variants rather than one, so parents are unaffected heterozygotes.
  - Motor deterioration with loss of independent walking, where this disease has no motor decline.
  - Persisting or worsening white matter abnormalities, and true subcortical cysts in almost all patients.
  - Delayed-onset cognitive decline in almost half of patients, against stable impairment here.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with MLC2B invariably had a milder phenotype with preservation of motor function, while intellectual
      disability and autism were relatively frequent.
    explanation: The cohort's direct contrast between this disease and the classic forms.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The small patient group with biallelic recessive variants in GLIALCAM has classic MLC and the associated disease
      is also known as MLC2A (OMIM# 613925).
    explanation: Definition of the allelic recessive disorder.
  - reference: PMID:31372844
    reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      autistic behavior was frequently found in patients with MLC2B and rare in patients with MLC1; thus far, autistic
      behavior has not been reported in patients with MLC2A
    explanation: Grounds the autism contrast in this differential, as of that series.
- name: Megalencephalic leukoencephalopathy with subcortical cysts 1
  disease_term:
    preferred_term: megalencephalic leukoencephalopathy with subcortical cysts 1
    term:
      id: MONDO:0024555
      label: megalencephalic leukoencephalopathy with subcortical cysts 1
  description: >-
    Recessive MLC1-related disease, the commonest genetic form of MLC and clinically identical to MLC2A. Radiological
    improvement is rare rather than absent in MLC1, so a remitting course is suggestive of this disease but does not
    prove it: two of 187 MLC1 patients in the 2018 cohort also improved.
  distinguishing_features:
  - Biallelic MLC1 rather than heterozygous HEPACAM variants.
  - Classic deteriorating course with loss of ambulation and cognitive decline.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Radiologic improvement was observed in all patients with MLC2B and also in 2 patients with MLC1.
    explanation: Radiological improvement is near-specific to this disease but not exclusive to it.
- name: 11q24 deletion including GLIALCAM
  description: >-
    Hemizygosity for GLIALCAM, as part of a terminal 11q deletion causing Jacobsen syndrome, produces MLC-like white
    matter abnormalities that are themselves remitting. The surrounding multisystem phenotype, and a copy number rather
    than a single-nucleotide result, separate it from this disease.
  distinguishing_features:
  - A terminal 11q deletion rather than a heterozygous HEPACAM missense variant.
  - White matter abnormalities are not present in every patient with the deletion.
  evidence:
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This suggests that hemizygosity for GLIALCAM may lead to a clinical phenotype similar to remitting MLC.
    explanation: The variant update's reading of the published 11q24 deletion patients.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, the MRI phenotype in Jacobsen syndrome is remitting (similar to what is seen in remitting MLC; see
      Figure 5 for an example from the ALC database).
    explanation: The remitting radiological course in the deletion patients, which is what makes this a differential.
  - reference: PMID:32507665
    reference_title: White matter abnormality in Jacobsen syndrome assessed by serial MRI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings of the present study suggested that WMA in JS are due to chronic white matter edema associated with
      HEPACAM/GlialCAM deletion and show gradual improvement over time, as seen in some MLC2B patients.
    explanation: >-
      Serial MRI in one Jacobsen patient, from 9 months to 2.5 years, with the authors' attribution of the improving
      white matter change to the deleted HEPACAM allele; a primary source for this differential.

    explanation: The developmental-window account of the remission, stated as speculation by the authors.
  - reference: PMID:33551753
    reference_title: "Megalencephalic Leukoencephalopathy: Insights Into Pathophysiology and Perspectives for Therapy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In agreement with the reversibility of the phenotype observed in MLC2B patients in adult stages, a decreased
      GlialCAM/MLC1 function may not be so pathogenic in adults as it is in infants
    explanation: The age dependence this node asserts, as the review frames it.
- name: Disrupted GlialCAM Interactome in Developing Astrocytes
  biological_scale: CELLULAR
  description: >-
    A candidate second route, outside the endfoot volume-regulation complex, for the developmental part of the
    phenotype. In astrocytes of the developing mouse cortex, dominant hepaCAM variants from both structural groups
    redistribute the protein across the cell and change its interaction partners, with less association with Connexin 43
    and ClC-2 and with the potassium channel KCNQ2. GlialCAM also controls astrocyte territory, branching and gap
    junction coupling in mouse cortex. Intellectual disability and autistic features are more frequent in this disease
    than in classic MLC, which fits a function of GlialCAM separate from its endfoot role, but no study has connected
    any of these changes to the cognitive or behavioural phenotype.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  cellular_components:
  - preferred_term: cell-cell junction
    term:

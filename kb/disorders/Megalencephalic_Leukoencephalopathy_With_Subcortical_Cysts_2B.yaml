- name: Impaired Astrocyte Volume Regulation
  biological_scale: CELLULAR
  description: >-
    With less MLC1 and ClC-2 at the endfoot membrane, astrocytes activate the volume-regulated anion current poorly and
    recover less well from swelling, which is the cellular defect common to every genetic form of MLC. No study has
    measured regulatory volume decrease in cells carrying a single dominant GLIALCAM allele, so this node is carried
    over from MLC1-related and GlialCAM knock-down work and is expected to be milder here. How much of the disease this
    node carries is open: deleting the essential VRAC pore subunit LRRC8A from astrocytes leaves volume recovery normal
    in situ and produces no white matter edema, so a deficit of VRAC conductance by itself is not what produces the
    lesion.

    explanation: A further interaction lost by the dominant variants, in the same mouse experiments.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It suggests that dominant GLIALCAM variants disrupt a function of GlialCAM that is separate from its role in

    reference_title: "Loop recognition and copper-mediated disulfide reduction underpin metal site assembly of CuA in human cytochrome oxidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Sco1 is a metallochaperone that selectively transfers Cu(I) ions based on loop recognition, whereas Sco2 is a copper-dependent thiol reductase of the cysteine ligands in the oxidase."
    explanation: Reconstitution with purified proteins assigns SCO2 the thiol-reductase activity bound on this node and the copper transfer to SCO1.
  - reference: CGGV:assertion_011dd1c7-94bb-4a70-8b95-cc25432a5ea2-2019-03-28T154245.471Z
    reference_title: "SCO2 / Leigh syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER

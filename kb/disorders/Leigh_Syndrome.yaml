  - reference: PMID:20301352
    reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sodium valproate, medications that cause acidosis, and dichloroacetate
      should be avoided or used with caution;
    explanation: >-
      GeneReviews specifies agents to avoid in the Leigh syndrome spectrum, including
      sodium valproate and dichloroacetate.
  - reference: PMID:42411141
    reference_title: >-
      Perianesthetic Complications in Genetic Mitochondrial Disease: A Review of Case Reports.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall complication rate was significantly higher in VA versus TIVA
      cases (42% vs. 18%, Fisher's exact p-value p = 0.0022), as was rate of severe
      complications (p = 0.01). Encephalomyelopathies, including LS, were
      overrepresented among cases resulting in death.
    explanation: >-
      Comprehensive review of 148 anesthesia case reports in genetic mitochondrial
      diseases shows volatile anesthetic agents carry significantly higher complication
      risk than total intravenous anesthesia. Leigh syndrome patients were overrepresented
      among fatal outcomes, supporting the need for careful anesthetic selection and
      perioperative monitoring.

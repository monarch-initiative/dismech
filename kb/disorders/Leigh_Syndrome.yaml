    reference_title: Mitochondrial DNA-Associated Leigh Syndrome Spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain stem dysfunction may manifest with respiratory symptoms, swallowing

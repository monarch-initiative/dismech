inheritance:
- name: Maternal mitochondrial inheritance
  description: >-
    Leigh syndrome caused by mtDNA-encoded variants -- most commonly MT-ATP6
    m.8993T>G/T>C -- is transmitted down the maternal line as maternally
    inherited Leigh syndrome (MILS). Severity tracks the heteroplasmy level,
    which segregates unpredictably between siblings through the mitochondrial
    bottleneck.
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  evidence:
  - reference: PMID:16525806
    reference_title: "NARP-MILS syndrome caused by 8993 T>G mitochondrial DNA mutation: a clinical, genetic and neuropathological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 8993 T>G mutation in mitochondrial DNA has been associated with
      variable syndromes of differing severity ranging from maternally inherited
      Leigh's syndrome (MILS) to neuropathy
    explanation: >-
      Identifies the MT-ATP6 m.8993 form of Leigh syndrome as maternally
      inherited, the mode that applies to the mtDNA-encoded causes.
- name: Autosomal recessive
  description: >-
    Most nuclear-encoded Leigh syndrome is autosomal recessive, requiring
    biallelic loss-of-function variants in an OXPHOS structural subunit
    (NDUFS4, NDUFV1) or an assembly/translation factor (SURF1, LRPPRC). This
    is the largest inheritance class by gene count.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23829769
    reference_title: "SURF1 deficiency: a multi-centre natural history study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SURF1 deficiency is a recessively inherited
    explanation: >-
      Establishes recessive inheritance for SURF1, the commonest nuclear cause
      of complex IV-deficient Leigh syndrome.
- name: X-linked
  description: >-
    A minority of Leigh syndrome is X-linked, caused by variants in PDHA1
    (pyruvate dehydrogenase E1-alpha) or the complex I subunit NDUFA1.
    Heterozygous females can be affected through skewed X-inactivation, so the
    pedigree does not always look male-limited.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:38497591
    reference_title: Manifestations of X-linked pyruvate dehydrogenase complex deficiency in female PDHA1 carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyruvate dehydrogenase complex deficiency is in up to 90% caused by
      pathogenic variants in the X-linked PDHA1 gene.
    explanation: >-
      Locates the dominant cause of pyruvate dehydrogenase deficiency, a
      recognized Leigh syndrome etiology in this entry, on the X chromosome.
pathophysiology:
- name: Oxidative phosphorylation deficiency
  description: >-
    The unifying biochemical lesion in Leigh syndrome is impaired mitochondrial
    oxidative phosphorylation, reducing ATP synthesis in tissues with high
    energy demand. Causative defects converge on the respiratory chain
    complexes (most often complex I), complex IV, ATP synthase (complex V), or
    upstream pyruvate oxidation.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  - preferred_term: proton motive force-driven mitochondrial ATP synthesis
    modifier: DECREASED
    term:
      id: GO:0042776
      label: proton motive force-driven mitochondrial ATP synthesis
  chemical_entities:
  - preferred_term: ATP
    modifier: DECREASED
    term:
      id: CHEBI:15422
      label: ATP
  evidence:
  - reference: PMID:26506407
    reference_title: 'Leigh syndrome: One disorder, more than 75 monogenic causes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Leigh syndrome is the most common pediatric presentation of mitochondrial disease.
    explanation: >-
      This review establishes Leigh syndrome as the prototypical pediatric mitochondrial
      (oxidative phosphorylation) disorder.
  - reference: PMID:26506407
    reference_title: 'Leigh syndrome: One disorder, more than 75 monogenic causes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This neurodegenerative disorder is genetically heterogeneous, and to date
      pathogenic mutations in >75 genes have been identified, encoded by 2
      genomes (mitochondrial and nuclear).
    explanation: >-
      Supports the convergence of >75 mitochondrial and nuclear genes on a shared
      defect of mitochondrial energy generation.
  downstream:
  - target: Lactic acidosis
    causal_link_type: DIRECT
    description: >-
      Impaired pyruvate oxidation and respiratory-chain flux shift metabolism
      toward anaerobic glycolysis, raising lactate.
  - target: Energy-dependent neuronal vulnerability
    causal_link_type: DIRECT
    description: >-
      Energy failure preferentially injures metabolically active neurons of the
      basal ganglia and brainstem.
- name: Complex I deficiency
  description: >-
    Isolated deficiency of NADH:ubiquinone oxidoreductase (respiratory chain
    complex I) is the single most common biochemical cause of Leigh syndrome,
    arising from mtDNA MT-ND subunit variants or nuclear NDUFS/NDUFV/NDUFA
    subunit and assembly-factor defects.

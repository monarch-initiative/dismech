- name: LRPPRC Loss and Mitochondrial mRNA Instability
  description: >-
    LRPPRC, with its partner SLIRP, binds mitochondrial mRNAs and stabilizes
    them, promoting their polyadenylation and translation. Pathogenic LRPPRC
    variants, including the French-Canadian founder missense A354V, reduce
    the protein's intrinsic RNA binding, so the mtDNA-encoded transcripts of
    cytochrome c oxidase subunits are not maintained and complex IV becomes
    deficient. LRPPRC is not part of cytochrome c oxidase, so it is kept off
    the complex IV node.
  genes:
  - preferred_term: LRPPRC
    term:
      id: hgnc:15714
      label: LRPPRC
  molecular_functions:
  - preferred_term: mitochondrial mRNA binding
    modifier: DECREASED
    term:
      id: GO:0003729
      label: mRNA binding
  evidence:
  - reference: PMID:42688402
    reference_title: "SLIRP differentially modulates RNA binding of pathogenic LRPPRC variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The LRPPRC/SLIRP complex is a key post-transcriptional regulator of mitochondrial gene expression, stabilizing mitochondrial mRNAs and promoting their polyadenylation and translation."
    explanation: States LRPPRC's normal function, binding and stabilizing mitochondrial mRNAs.
  - reference: PMID:42688402
    reference_title: "SLIRP differentially modulates RNA binding of pathogenic LRPPRC variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "All three mutations reduced intrinsic RNA binding, with R1276_K1300del showing no detectable interaction in the absence of SLIRP."
    explanation: Pathogenic LRPPRC variants, A354V among them, reduce RNA binding, the activity this node marks as decreased.
  downstream:
  - target: Complex IV (cytochrome c oxidase) deficiency
    causal_link_type: DIRECT
    description: Loss of LRPPRC-dependent mRNA stability lowers synthesis of the mtDNA-encoded cytochrome c oxidase subunits.
    evidence:
    - reference: PMID:42688402
      reference_title: "SLIRP differentially modulates RNA binding of pathogenic LRPPRC variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "Mutations in LRPPRC cause mitochondrial disorders, including Leigh syndrome French-Canadian type (LSFC), primarily affecting oxidative phosphorylation."
      explanation: Links LRPPRC mutations to Leigh syndrome French-Canadian type through an oxidative phosphorylation defect.
- name: SCO2 Loss and Defective CuA Site Maturation
  description: >-
    SCO2 is an inner-membrane, copper-binding thiol-disulfide oxidoreductase of the
    complex IV copper delivery pathway: it reduces the cysteine ligands of the COX2
    CuA site so that SCO1 can transfer copper. Biallelic SCO2 loss-of-function
    variants leave COX2 unmetallated and impair complex IV assembly, giving brain
    cytochrome c oxidase deficiency in the Leigh syndrome spectrum. SCO2 carries no
    cytochrome-c oxidase activity of its own.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SCO2
    term:
      id: hgnc:10604
      label: SCO2
  molecular_functions:

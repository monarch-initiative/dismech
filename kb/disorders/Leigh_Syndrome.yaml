    snippet: "More than 33 unique variants predicted to cause a loss of or reduced function of the protein have been reported in ClinVar, suggesting homozygous loss of function is the mechanism of disease for this gene."
    explanation: ClinGen's expert panel summarises loss of SCO2 function as the disease mechanism in Leigh syndrome spectrum.
  downstream:
  - target: Complex IV (cytochrome c oxidase) deficiency

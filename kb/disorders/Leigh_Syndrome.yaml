    description: Failed CuA maturation of COX2 stalls complex IV assembly and lowers brain cytochrome c oxidase activity.
    evidence:
    - reference: CGGV:assertion_011dd1c7-94bb-4a70-8b95-cc25432a5ea2-2019-03-28T154245.471Z

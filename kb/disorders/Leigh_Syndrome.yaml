name: Leigh Syndrome
creation_date: '2026-05-30T00:00:00Z'
description: >-
  Leigh syndrome (subacute necrotizing encephalomyelopathy) is a genetically
  heterogeneous mitochondrial disorder of cellular energy metabolism. It is the
  most common pediatric presentation of mitochondrial disease and is defined
  neuropathologically by bilateral, symmetric necrotic lesions of the basal
  ganglia, thalamus, and brainstem. The shared biochemical defect is impaired
  oxidative phosphorylation/ATP production, most frequently from isolated
  complex I deficiency, complex IV (cytochrome c oxidase) deficiency, MT-ATP6
  (complex V) dysfunction, or pyruvate dehydrogenase complex deficiency. More
  than 75 causative genes are known across the mitochondrial and nuclear
  genomes. Onset is typically in infancy or early childhood with psychomotor
  regression, hypotonia, brainstem and basal-ganglia dysfunction, and lactic
  acidosis.
category: Mendelian
parents:
- hereditary disease
- mitochondrial disease
disease_term:
  preferred_term: Leigh syndrome
  term:
    id: MONDO:0009723
    label: Leigh syndrome
notes: >-
  This is an umbrella entry and the `genetic:` block is deliberately not a
  complete gene list. The review cited on the NDUFV1 record counts more than
  75 monogenic causes across two genomes, and enumerating them here would
  produce a flat list that says nothing about mechanism - the thing this entry
  exists to model. The six genes curated instead are chosen so that each of the
  entry's biochemical nodes has at least one worked exemplar: NDUFS4 and NDUFV1
  at complex I, SURF1 and LRPPRC at complex IV, MT-ATP6 at complex V, and PDHA1
  at pyruvate dehydrogenase. They also span the three inheritance modes the
  entry declares - autosomal recessive, maternal mitochondrial, and X-linked.
  Genes whose lesion is a defined clinical entity of its own are curated in
  their own entries rather than here; `SURF1-Related_Leigh_Syndrome.yaml` and
  the `Mitochondrial_Complex_I_Deficiency_Nuclear_Type_*` series are the
  existing examples.

  One asymmetry is intentional and worth naming: MT-ND5 is bound in the complex
  I node's `genes:` list as an mtDNA-encoded subunit exemplar but has no
  `genetic:` record, because this entry curates MT-ATP6 as its worked mtDNA
  cause and a second mtDNA record would duplicate that argument without adding
  a mechanism.

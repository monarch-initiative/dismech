- name: Pulmonary Endothelial Metabolic Dysfunction
  description: >
    In pulmonary artery endothelial cells BOLA3 deficiency, whether by knockdown or by
    naturally occurring patient variants, impairs Fe-S integrity and lipoate-dependent
    2-oxoacid dehydrogenases, reprogrammes glycolysis and respiration, downregulates glycine
    cleavage protein H to raise intracellular glycine, and increases endothelial
    proliferation, survival and vasoconstriction while reducing angiogenic potential;
    endothelial BOLA3 knockdown in mice produces pulmonary hypertension that glycine
    supplementation reverses.

notes: >
  Curated as a per-gene Disease entry (stub entry_type decision: DISEASE) alongside MMDS1
  (NFU1) and MMDS5 (ISCA1); the shared lipoate-deficiency chain is duplicated in each entry
  rather than merged, consistent with MMDS9B and the open MMDS4/MMDS6 PRs. Sources: the
  discovery and early clinical papers (PMID:21944046, PMID:22562699, PMID:24334290), case
  reports and series (PMID:29501406, PMID:29654549, PMID:30302924, PMID:40273865),
  structural/biochemical studies (PMID:34063696, PMID:37511493, PMID:33693876, PMID:31486956,
  PMID:37823603, PMID:28803783), the endothelial pulmonary hypertension study (PMID:30759996)
  and the systematic review (PMID:34440194). Several snippets end at a propositional main
  clause because the rest of the sentence carries bracketed Fe-S notation, which the snippet
  matcher strips from the quote but not from the cache. The pulmonary endothelial node does
  not declare module conformance: the BOLA3 endothelial mechanism is metabolic (lipoate
  and glycine) rather than the BMP and nitric-oxide axis that the
  pulmonary_vascular_remodeling entry node is defined by. The Edison/falcon
  deep-research report completed after the first draft and passed preflight; every reference
  in its list was already cited, so it added no new sources. No GeneReviews chapter
  exists for BOLA3-related MMDS.

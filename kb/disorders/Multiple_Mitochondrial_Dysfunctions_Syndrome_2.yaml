  - reference: PMID:34440194
    reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 18 reported patients from 14 families worldwide, only 8 variants were identified (Figure 3)."
    explanation: Patient and family count as of the 2021 systematic review.
  - reference: PMID:34063696
    reference_title: "Molecular Basis of Multiple Mitochondrial Dysfunctions Syndrome 2 Caused by CYS59TYR BOLA3 Mutation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Six missense and six non-sense disease-causing variants in BOLA3 have been identified to date in patients affected by MMDS2"
    explanation: Variant count as of 2021.
  - reference: PMID:40273865
    reference_title: "Role of BOLA3 in the mitochondrial Fe-S cluster clarified by metabolomic analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristics, clinical course, and biochemical data of eight Japanese patients with BOLA3 pathogenic variants were collected."
    explanation: Recent national series.
progression:
- phase: Infantile onset with regression and early death
  notes: >-
    After a period of normal development, infants present at a few months of age with
    developmental regression, feeding impairment, hypotonia, seizures and cardiomyopathy;
    rapidly progressive white matter disease follows and no homozygous truncating case has
    survived beyond the first year.
  evidence:
  - reference: PMID:29501406
    reference_title: "An infant case of diffuse cerebrospinal lesions and cardiomyopathy caused by a BOLA3 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 6-month-old girl with no remarkable family or past medical history until 1 month prior presented with developmental regression and feeding impairment."
    explanation: Typical onset.
  - reference: PMID:29501406
    reference_title: "An infant case of diffuse cerebrospinal lesions and cardiomyopathy caused by a BOLA3 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No reported case of a homozygous BOLA3 gene mutation has survived past 1 year of life."
    explanation: Survival in the severe form.
- phase: Milder course with clinical recovery (hypomorphic alleles)
  notes: >-
    A compound heterozygote for p.Arg46* and p.Cys59Tyr presented at 18 months with acute
    hemiplegia and regression, then recovered clinically over four years with partial
    resolution of MRI abnormalities and normal respiratory chain activities in tissues.
  evidence:
  - reference: PMID:29654549
    reference_title: "Severe Leukoencephalopathy with Clinical Recovery Caused by Recessive BOLA3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented at 18 months with acute hemiplegia and cognitive regression without obvious trigger. This was followed by clinical recovery over 4 years."
    explanation: Documents the recovering phenotype.
genetic:
- name: BOLA3
  gene_term:
    preferred_term: BOLA3
    term:
      id: hgnc:24415
      label: BOLA3
  relationship_type: CAUSATIVE
  notes: >
    Biallelic BOLA3 (2p13.1) variants cause MMDS2; the disease is caused by loss of the
    mitochondrial isoform 1, which alone rescues patient fibroblasts. Truncating alleles
    (c.123dupA p.Glu42Argfs*13, p.Arg46*) and missense alleles at cluster-ligand or
    partner-binding residues (p.His96Arg, p.Ile67Asn, p.Cys59Tyr) are reported; structural
    studies show that His96Arg and Ile67Asn abolish a functional BOLA3-[2Fe-2S]-GLRX5
    heterocomplex, whereas Cys59Tyr perturbs but does not abolish cluster binding, matching
    its milder phenotype.
  variants:
  - name: c.123dupA (p.Glu42Argfs*13)
    description: Frameshift duplication identified in the second family of the original mapping study; produces a premature stop.
    type: frameshift
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:21944046
      reference_title: "Mutations in iron-sulfur cluster scaffold genes NFU1 and BOLA3 cause a fatal deficiency of multiple respiratory chain and 2-oxoacid dehydrogenase enzymes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A single base-pair duplication c.123dupA was identified in BOLA3 in the second family, causing a frame shift that produces a premature stop codon (p.Glu42Argfs(∗)13)."
      explanation: Original identification.
  - name: c.287A>G (p.His96Arg)
    description: >
      Homozygous missense at a conserved [2Fe-2S] ligand residue, associated with a severe
      phenotype of leukodystrophy with hypertrophic cardiomyopathy and death at 10 months;
      the mutant still binds GLRX5 but forms an aberrant heterocomplex unable to assemble a
      [4Fe-4S] cluster on NFU1.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37511493
      reference_title: "Understanding the Molecular Basis of the Multiple Mitochondrial Dysfunctions Syndrome 2: The Disease-Causing His96Arg Mutation of BOLA3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Size exclusion chromatography, NMR, UV-visible, circular dichroism, and EPR spectroscopy characterization have shown that the His96Arg mutation does not impair the interaction of BOLA3 with its protein partner GLRX5, but leads to the formation of an aberrant"
      explanation: Molecular mechanism of the severe allele.
    - reference: PMID:29501406
      reference_title: "An infant case of diffuse cerebrospinal lesions and cardiomyopathy caused by a BOLA3 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous H96R (c. 287 A > G) mutation was identified in the BOLA3 gene."
      explanation: Clinical report of the homozygous variant.
  - name: c.176G>A (p.Cys59Tyr)
    description: >
      Novel missense allele, compound heterozygous with p.Arg46*, in the patient with
      clinical recovery; it perturbs the cluster-binding region without abolishing cluster
      binding on the heterocomplex and promotes an aberrant apo complex.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29654549
      reference_title: "Severe Leukoencephalopathy with Clinical Recovery Caused by Recessive BOLA3 Mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "WGS identified compound heterozygous variants in BOLA3: one previously reported (c.136C>T, p.Arg46*) and one novel variant (c.176G>A, p.Cys59Tyr)."
      explanation: Identification of the allele.
    - reference: PMID:34063696
      reference_title: "Molecular Basis of Multiple Mitochondrial Dysfunctions Syndrome 2 Caused by CYS59TYR BOLA3 Mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "tyrosine 59 did not replace cysteine 59 as iron-sulfur cluster ligand; and (3) the mutation promoted the formation of an aberrant apo C59Y BOLA3-GLRX5 complex."
      explanation: Molecular basis of the milder allele.
  - name: p.Ile67Asn
    description: Missense allele that impairs binding of BOLA3 to GLRX5 and prevents formation of the bridged heterocomplex without gross structural change.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33693876
      reference_title: "Biochemical impact of a disease-causing Ile67Asn substitution on BOLA3 protein."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our investigations reveal that the Ile67Asn substitution impairs the ability of BOLA3 to bind its physiological partner GLRX5, resulting in a failure to form the"
      explanation: Mechanism of the allele.
  - name: p.Arg99Trp
    description: >
      Homozygous missense variant whose two reported carriers survived longer, to about 12
      years, without cardiomyopathy; the informative outlier for variable expressivity.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34440194
      reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is noteworthy that both patients carrying the homozygous variant Arg99Trp presented a milder phenotype than the others"
      explanation: Milder phenotype of the Arg99Trp homozygotes.

name: Multiple Mitochondrial Dysfunctions Syndrome 2
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- MMDS2
- Multiple mitochondrial dysfunctions syndrome 2 with hyperglycinemia
- BOLA3 deficiency
- BOLA3-related multiple mitochondrial dysfunctions syndrome
- BOLA3-associated variant non-ketotic hyperglycinemia
description: >
  Multiple mitochondrial dysfunctions syndrome 2 (MMDS2; OMIM #614299) is an autosomal
  recessive disorder of mitochondrial iron-sulfur (Fe-S) cluster biogenesis caused by
  biallelic variants in BOLA3. Mitochondrial BOLA3 forms a [2Fe-2S]-bridged heterocomplex
  with the monothiol glutaredoxin GLRX5, and this GLRX5-BOLA3 node feeds [4Fe-4S] cluster
  assembly on NFU1 and supplies the mitoribosome; BOLA3 is also required for NFU1 stability.
  Loss of BOLA3 therefore impairs maturation of the same [4Fe-4S] targets as NFU1 deficiency,
  lipoic acid synthase and respiratory chain complexes I and II, while sparing aconitase, so
  that lipoate-dependent enzymes (pyruvate dehydrogenase, 2-oxoglutarate, 2-oxoadipate and
  branched-chain ketoacid dehydrogenases, glycine cleavage system) fail together with
  OXPHOS. The biochemical signature is lactic acidosis with non-ketotic hyperglycinemia and
  reduced protein lipoylation; the clinical picture is an infantile-onset leukodystrophy with
  developmental regression after a period of normal development, optic atrophy, seizures and,
  distinctively among the MMDS forms, hypertrophic or dilated cardiomyopathy, with death
  usually in the first years. Rare hypomorphic alleles (p.Cys59Tyr compound heterozygosity)
  produce a leukoencephalopathy with clinical recovery. Endothelial BOLA3 deficiency also
  promotes pulmonary hypertension through glycine and metabolic dysregulation. Treatment is
  supportive.

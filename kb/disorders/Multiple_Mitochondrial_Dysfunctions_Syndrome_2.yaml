pathophysiology:
- name: Biallelic BOLA3 Loss of Function
  description: >
    Pathogenic variants abolish mitochondrial BOLA3 (isoform 1) or disrupt its ability to
    form a [2Fe-2S]-bridged heterocomplex with GLRX5, either by preventing GLRX5 binding
    (p.Ile67Asn) or by producing an aberrant complex that cannot pass its cluster onward
    (p.His96Arg, p.Cys59Tyr). Holo BOLA3 can also form a cluster-carrying homodimer.
  biological_scale: MOLECULAR
  downstream:
  - target: Failure of the GLRX5-BOLA3 Node in 4Fe-4S Cluster Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37511493
      reference_title: "Understanding the Molecular Basis of the Multiple Mitochondrial Dysfunctions Syndrome 2: The Disease-Causing His96Arg Mutation of BOLA3."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Size exclusion chromatography, NMR, UV-visible, circular dichroism, and EPR spectroscopy characterization have shown that the His96Arg mutation does not impair the interaction of BOLA3 with its protein partner GLRX5"
      explanation: The His96Arg mutant still binds GLRX5 but forms an aberrant heterocomplex that no longer assembles a cluster on NFU1; the rest of the sentence carries bracketed cluster notation that the snippet matcher cannot match.
  evidence:
  - reference: PMID:33693876
    reference_title: "Biochemical impact of a disease-causing Ile67Asn substitution on BOLA3 protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our investigations reveal that the Ile67Asn substitution impairs the ability of BOLA3 to bind its physiological partner GLRX5"
    explanation: Ile67Asn disrupts the BOLA3-GLRX5 carrier complex, the intermediary that delivers clusters to downstream targets.
  - reference: PMID:31486956
    reference_title: "Reconstitution, characterization, and [2Fe-2S] cluster exchange reactivity of a holo human BOLA3 homodimer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Herein we describe procedures to isolate and characterize the human holo BOLA3 protein in terms of Fe-S cluster binding and trafficking and demonstrate that human BOLA3 can form a functional homodimer capable of engaging in Fe-S cluster transfer."
    explanation: BOLA3 as a cluster-trafficking protein.
- name: Failure of the GLRX5-BOLA3 Node in 4Fe-4S Cluster Assembly
  description: >
    The GLRX5-BOLA3 heterocomplex delivers [2Fe-2S] clusters for [4Fe-4S] assembly on NFU1
    and to the mitoribosome; BOLA3 is also needed for NFU1 stability. Loss of BOLA3 therefore
    impairs the NFU1-dependent targets, lipoic acid synthase and respiratory chain complexes
    I and II, while aconitase is spared, and attenuates mitochondrial protein synthesis.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    modifier: DECREASED
  downstream:

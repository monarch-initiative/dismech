    evidence:
    - reference: PMID:22562699
      reference_title: "Homozygous missense mutation in BOLA3 causes multiple mitochondrial dysfunctions syndrome in two siblings."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results suggest that BOLA3 plays a crucial role in the biogenesis of iron-sulfur clusters necessary for proper function of respiratory chain and 2-oxoacid dehydrogenase complexes."
      explanation: BOLA3 loss impairs both lipoate-dependent and respiratory-chain targets.
  - target: Respiratory Chain Complex I and II Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40273865

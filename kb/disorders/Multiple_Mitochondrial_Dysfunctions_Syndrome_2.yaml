discussions:
- discussion_id: mmds2_bola3_molecular_role
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic BOLA3 Loss of Function
  prompt: >
    What is the precise molecular role of BOLA3 in [4Fe-4S] cluster biogenesis, and does it
    act as a GLRX5-bridged [2Fe-2S] carrier to NFU1, as a stabiliser of NFU1, or as a
    homodimeric cluster carrier in its own right?
  rationale: >
    The exact function of BOLA3 is still described as not completely understood: the
    BOLA3-GLRX5 heterocomplex is the favoured intermediary, a holo BOLA3 homodimer also
    transfers clusters, and patient fibroblast profiling shows NFU1 depends on BOLA3 for
    stability. Which of these accounts for the disease is unresolved.
  evidence:
  - reference: PMID:37511493
    reference_title: "Understanding the Molecular Basis of the Multiple Mitochondrial Dysfunctions Syndrome 2: The Disease-Causing His96Arg Mutation of BOLA3."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a protein with a not yet completely understood role in iron-sulfur (Fe-S) cluster biogenesis, but essential for the maturation of mitochondrial"
    explanation: Explicit statement of the gap.
- discussion_id: mmds2_no_systemic_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Bioenergetic Failure in Brain and Heart
  prompt: >
    Does any whole-organism model reproduce the infantile leukodystrophy and cardiomyopathy
    of BOLA3 deficiency, given that the only in vivo work is an adult endothelial knockdown
    modelling pulmonary hypertension?
  rationale: >
    The endothelial knockdown mouse captures a vascular phenotype that is not the dominant
    clinical problem in patients, and no constitutive or CNS/cardiac Bola3 model has been
    reported, so the human white-matter and myocardial disease rests on patient tissue and
    fibroblast data alone.
  evidence:
  - reference: PMID:30759996

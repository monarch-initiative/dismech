  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. Eighteen patients from 14 families had been reported worldwide by 2021,
    carrying six missense and six nonsense disease-causing BOLA3 variants; a 2025 Japanese
    series added eight patients.

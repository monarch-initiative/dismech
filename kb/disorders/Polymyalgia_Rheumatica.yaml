pathophysiology:
- name: Age-Associated Inflammatory Susceptibility
  biological_scale: ORGANISM
  description: >-
    Polymyalgia rheumatica is essentially confined to people aged 50 and over,
    and is one of the most common inflammatory rheumatic diseases in that age
    group. Age is therefore not merely an epidemiological association but the
    permissive condition for the disease, which is why it sits at the head of the
    causal chain. It shares this age restriction, and much of its
    immunopathophysiology, with giant cell arteritis and rheumatoid arthritis.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:41107118
    reference_title: "Understanding the immunopathophysiology of polymyalgia rheumatica: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polymyalgia rheumatica (PMR) is one of the most common inflammatory rheumatic diseases in people aged ≥50 years"
    explanation: >-
      Establishes the restriction of the disease to older adults, the permissive
      condition this node describes.
  - reference: PMID:41107118
    reference_title: "Understanding the immunopathophysiology of polymyalgia rheumatica: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is closely interlinked with giant cell arteritis (GCA) (potentially considered the GCA-PMR spectrum) and rheumatoid arthritis and shares a common immunopathophysiology with both."
    explanation: >-
      Records the shared immunopathophysiology with GCA and rheumatoid arthritis,
      which is why this entry relates to, rather than duplicates, the existing
      giant cell arteritis entry.
  downstream:
  - target: Bursal Macrophage and Synoviocyte Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Bursal Macrophage and Synoviocyte Activation
  biological_scale: CELLULAR
  description: >-
    Immunohistological study of subacromial bursal biopsies places the cellular
    lesion in the bursa rather than in muscle. Macrophages and fibroblast-like
    synoviocytes accumulate there, and proinflammatory cytokines including IL-1,
    IL-6, IL-17 and TNF-alpha activate the synoviocytes. This is the point at
    which a systemic age-associated susceptibility becomes a localised,
    biopsy-visible inflammatory lesion in specific peri-articular structures.
  cell_types:
  - preferred_term: fibroblast-like synoviocyte
    term:
      id: CL:0000214
      label: synovial cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: subacromial bursa
    term:
      id: UBERON:0003668
      label: synovial bursa
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:41107118
    reference_title: "Understanding the immunopathophysiology of polymyalgia rheumatica: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistological studies using biopsies from subacromial bursae have indicated that various cytokines and cells, including macrophages, interleukin-6 (IL-6), and fibroblast-like synoviocytes (FLS), play an integral role in the immunopathophysiology of PMR."
    explanation: >-
      Directly localises the cellular lesion to the subacromial bursa and names
      the participating cell types on biopsy evidence.
  downstream:
  - target: IL-6 Amplification Loop
    causal_link_type: DIRECT
- name: IL-6 Amplification Loop
  biological_scale: MOLECULAR
  description: >-
    The cytokine circuit is self-reinforcing rather than linear. Proinflammatory
    cytokines activate fibroblast-like synoviocytes, which then secrete IL-6,
    and that IL-6 in turn promotes further synoviocyte proliferation. This
    feed-forward structure explains why the disease is sustained rather than
    self-limiting, and why interrupting IL-6 receptor signalling is
    disproportionately effective compared with blocking any single upstream
    cytokine.
  cell_types:
  - preferred_term: fibroblast-like synoviocyte
    term:
      id: CL:0000214
      label: synovial cell
  biological_processes:
  - preferred_term: positive regulation of interleukin-6 production
    term:
      id: GO:0032755
      label: positive regulation of interleukin-6 production
    modifier: INCREASED
  evidence:
  - reference: PMID:41107118
    reference_title: "Understanding the immunopathophysiology of polymyalgia rheumatica: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proinflammatory cytokines, including IL-1, IL-6, IL-17, and tumour necrosis factor-alpha, activate FLS which then secrete IL-6 that can further promote FLS proliferation."
    explanation: >-
      Describes the feed-forward IL-6/synoviocyte loop that this node asserts.
  - reference: PMID:41107118
    reference_title: "Understanding the immunopathophysiology of polymyalgia rheumatica: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the diverse roles of IL-6 in the immunopathophysiology of PMR, targeted molecular therapies such as IL-6 receptor inhibitors offer promising alternatives for disease management"
    explanation: >-
      The therapeutic rationale for IL-6 receptor blockade rests on IL-6 being
      central to the loop, supporting this node's position in the mechanism.
    directness: INDIRECT
  downstream:
  - target: Peri-Articular Bursitis and Tenosynovitis
    causal_link_type: DIRECT
  - target: Systemic Acute-Phase Response
    causal_link_type: DIRECT
  - target: IL-6-Mediated Constitutional Symptoms
    causal_link_type: DIRECT
- name: Peri-Articular Bursitis and Tenosynovitis
  biological_scale: TISSUE
  description: >-
    The anatomical substrate of the girdle pain, established by ultrasound, MRI
    and PET rather than by muscle pathology. The consistent findings are
    bilateral subacromial bursitis, biceps long-head tenosynovitis and
    trochanteric bursitis, with interspinous bursitis on MRI and PET. This node
    is why the disease presents as shoulder and hip girdle pain and stiffness
    despite normal muscle, and it is the direct generator of the musculoskeletal
    phenotype.
  locations:
  - preferred_term: subacromial and trochanteric synovial bursa
    term:
      id: UBERON:0003668
      label: synovial bursa
  - preferred_term: shoulder joint
    term:
      id: UBERON:0016884
      label: shoulder joint
  evidence:
  - reference: PMID:21565899
    reference_title: "Imaging of polymyalgia rheumatica: indications on its pathogenesis, diagnosis and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral subacromial bursitis, biceps long head tenosynovitis and trochanteric bursitis were particularly consistent findings."
    explanation: >-
      Systematic imaging review establishing the specific peri-articular lesions
      that constitute the anatomical substrate of the disease.
  - reference: PMID:37832573
    reference_title: "Polymyalgia rheumatica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging has helped to identify the pathological substrate of polymyalgia rheumatica"
    explanation: >-
      Confirms that imaging, rather than muscle pathology, defines the
      pathological substrate.
  downstream:
  - target: Shoulder and Hip Girdle Pain
    causal_link_type: DIRECT
  - target: Morning Stiffness
    causal_link_type: DIRECT
- name: Systemic Acute-Phase Response
  biological_scale: ORGANISM
  description: >-
    IL-6 released from inflamed bursae drives hepatic acute-phase protein
    synthesis, so erythrocyte sedimentation rate and C-reactive protein are
    typically elevated. This is a useful but imperfect disease marker: acute
    phase reactants rise less during flares in treated patients, and can rise for
    unrelated reasons, which is part of why assessing disease activity is
    difficult.
  biological_processes:
  - preferred_term: interleukin-6 production
    term:
      id: GO:0032635
      label: interleukin-6 production
    modifier: INCREASED
  evidence:
  - reference: PMID:41107118
    reference_title: "Understanding the immunopathophysiology of polymyalgia rheumatica: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activation of synoviocytes in bursae may result in bursitis which can lead to a high concentration of acute-phase reactants and systemic inflammation."
    explanation: >-
      Links bursal synoviocyte activation to the systemic acute-phase response,
      which is the causal step this node records.
  - reference: PMID:37832573
    reference_title: "Polymyalgia rheumatica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevation of acute phase reactants is common due to the inflammatory nature of the disease."
    explanation: >-
      Confirms elevated acute-phase reactants as a common feature attributable
      to the inflammatory process.
  downstream:
  - target: Elevated Acute-Phase Reactants
    causal_link_type: DIRECT
- name: IL-6-Mediated Constitutional Symptoms
  biological_scale: ORGANISM
  description: >-
    Beyond driving inflammation, IL-6 acts on the hypothalamic-pituitary-adrenal
    axis and on peripheral and central pain pathways, producing sleep
    disturbance, mood disturbance, pain amplification and fatigue. This is a
    separate causal route from the bursal lesion and explains symptoms that pain
    from bursitis alone would not account for — worth modelling separately
    because it predicts that IL-6 blockade should improve fatigue and mood, not
    only joint symptoms.
  biological_processes:
  - preferred_term: interleukin-6 production
    term:
      id: GO:0032635
      label: interleukin-6 production
    modifier: INCREASED
  evidence:
  - reference: PMID:41107118
    reference_title: "Understanding the immunopathophysiology of polymyalgia rheumatica: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL-6 also plays a role in sleep disturbances, mood disorders, pain, and fatigue; it is often seen in PMR, via disruption of the hypothalamic-pituitary-adrenal axis, and actions on the peripheral and central pain pathways."
    explanation: >-
      Directly states the IL-6-mediated route to constitutional symptoms via the
      HPA axis and pain pathways.
  downstream:
  - target: Fatigue
    causal_link_type: DIRECT

name: Polymyalgia Rheumatica
creation_date: "2026-09-04T03:05:00Z"
category: Inflammatory Disorder
description: >-
  Polymyalgia rheumatica is one of the most common inflammatory rheumatic
  diseases of people over 50, presenting with neck pain, bilateral shoulder and
  hip girdle pain, and prominent morning stiffness, together with a systemic
  acute-phase response. Despite the name, the lesion is not in muscle: imaging
  and bursal biopsy place it in peri-articular synovial structures, consistently
  showing bilateral subacromial bursitis, biceps long-head tenosynovitis and
  trochanteric bursitis. Macrophages and fibroblast-like synoviocytes in these
  bursae drive an IL-6-centred cytokine loop, in which IL-1, IL-6, IL-17 and
  TNF-alpha activate synoviocytes that themselves secrete IL-6 and proliferate
  further. IL-6 accounts for much of what patients actually experience beyond
  pain — fatigue, sleep disturbance and low mood — through effects on the
  hypothalamic-pituitary-adrenal axis and on peripheral and central pain
  pathways. There is no specific diagnostic test, so diagnosis rests on
  exclusion. Glucocorticoids induce remission in most patients but more than half
  cannot taper off them, which is the clinical problem that IL-6 receptor
  blockade with tocilizumab or sarilumab addresses.
disease_term:
  preferred_term: polymyalgia rheumatica
  term:
    id: MONDO:0019735
    label: polymyalgia rheumatica
synonyms:
- PMR
- rhizomelic pseudopolyarthritis
parents:
- Inflammatory Rheumatic Diseases
notes: >-
  Curated as a Disease in its own right rather than as part of
  Giant_Cell_Arteritis, which is already curated. The two are closely
  interlinked — some authors treat them as a single GCA-PMR spectrum, they share
  immunopathophysiology, and both respond to IL-6 receptor blockade — but they
  are not the same entry. PMR occurs far more often in isolation, its lesion is
  peri-articular bursitis and synovitis rather than large-vessel vasculitis, and
  it carries none of the vision-loss risk that makes GCA an ophthalmic emergency.
  The existing Giant_Cell_Arteritis entry already mentions polymyalgia rheumatica
  as an associated feature; those mentions are correct and were left alone. A
  comorbidity record is probably the right place to express the overlap
  quantitatively, and is not attempted here.

  The name is a historical misnomer worth flagging for anyone curating from it:
  "myalgia" implies muscle disease, but muscle histology and enzymes are normal
  and the imaging substrate is peri-articular. Do not bind muscle-pathology
  terms to the pathophysiology nodes on the strength of the disease name.

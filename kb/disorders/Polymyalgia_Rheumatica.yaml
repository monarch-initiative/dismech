clinical_burden:
  burden_level: MODERATE
  rationale: >-
    An unusual burden profile: the disease does not clearly shorten life or
    damage organs, but materially degrades quality of life, and much of the
    long-term harm comes from prolonged glucocorticoid exposure rather than from
    the disease itself.
  evidence:
  - reference: PMID:37832573
    reference_title: "Polymyalgia rheumatica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although polymyalgia rheumatica does not clearly impair survival or organ function, it can have a detrimental effect on quality of life."
    explanation: >-
      States the dissociation between preserved survival and impaired quality of
      life that defines the burden of this disease.
  - reference: PMID:41107118
    reference_title: "Understanding the immunopathophysiology of polymyalgia rheumatica: implications for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ">50% of patients cannot successfully taper GCs, and long-term treatment is associated with considerable GC-related adverse events"
    explanation: >-
      Quantifies the treatment-derived component of the burden, which is the
      main driver of long-term harm.
progression:
- phase: Relapse on glucocorticoid tapering
  notes: >-
    Glucocorticoids induce remission in most patients, but relapse on tapering is
    the rule rather than the exception, and more than half never taper off
    successfully. This is the central clinical problem of the disease and the
    rationale for steroid-sparing therapy.
  evidence:
  - reference: PMID:37832573
    reference_title: "Polymyalgia rheumatica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "when tapered, relapses occur in 40-60% of those affected and side-effects are common"
    explanation: >-
      Quantifies the relapse rate on tapering, defining this phase of the
      disease course.
diagnosis:
- name: Diagnosis of exclusion
  description: >-
    There is no specific diagnostic test. Diagnosis requires excluding other
    conditions presenting similarly, with imaging used to support the clinical
    diagnosis and to detect coexistent giant cell arteritis. Assessing disease
    activity is separately difficult, because pain from common comorbidities such
    as osteoarthritis and tendinopathy returns as glucocorticoids are reduced and
    can be mistaken for relapse.
  evidence:
  - reference: PMID:37832573
    reference_title: "Polymyalgia rheumatica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since there are no specific diagnostic tests, diagnosis requires the exclusion of other diseases with similar presentations."
    explanation: >-
      Establishes the exclusionary basis of diagnosis.
  - reference: PMID:37832573
    reference_title: "Polymyalgia rheumatica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is increasingly used to support clinical diagnosis or to detect coexistent giant cell arteritis"
    explanation: >-
      Records the role of imaging in supporting diagnosis and in detecting
      coexistent giant cell arteritis.
treatments:
- name: Glucocorticoid Therapy
  description: >-
    Oral prednisone at 12.5-25 mg daily induces remission in most patients and
    remains the standard of care, with subsequent tapering. Its limitation is not
    efficacy but durability and toxicity: relapse on tapering affects 40-60%,
    more than half of patients never come off, and cumulative exposure causes
    substantial adverse effects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: NCIT:C770
        label: Prednisone
  target_mechanisms:
  - target: Bursal Macrophage and Synoviocyte Activation
    description: >-
      Broad, non-specific suppression of the bursal inflammatory infiltrate,
      which is why response is rapid but relapse follows withdrawal.
    evidence:
    - reference: PMID:37832573
      reference_title: "Polymyalgia rheumatica."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Glucocorticoids at 12·5-25·0 mg prednisone per day are effective in inducing remission in most individuals"
      explanation: >-
        Establishes glucocorticoid efficacy at inducing remission of the
        inflammatory process.
  target_phenotypes:
  - preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  - preferred_term: Joint stiffness
    term:
      id: HP:0001387
      label: Joint stiffness
  evidence:
  - reference: PMID:26359488
    reference_title: "2015 Recommendations for the management of polymyalgia rheumatica: a European League Against Rheumatism/American College of Rheumatology collaborative initiative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment strategies such as initial glucocorticoid (GC) doses and subsequent tapering regimens"
    explanation: >-
      International EULAR/ACR recommendations cover initial glucocorticoid dosing
      and tapering as the core treatment strategy.
- name: IL-6 Receptor Blockade
  description: >-
    Tocilizumab, an IL-6 receptor inhibitor, targets the amplification loop
    directly rather than suppressing inflammation broadly. In new-onset disease
    with rapid steroid tapering it tripled the rate of glucocorticoid-free
    remission, delayed relapse and lowered cumulative steroid dose. Sarilumab has
    also shown efficacy. This is the mechanistically motivated therapy: it
    predicts, and delivers, steroid sparing rather than merely additional
    anti-inflammatory effect.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: IL-6 Amplification Loop
    description: >-
      Blocking the IL-6 receptor interrupts the feed-forward loop in which
      synoviocyte-derived IL-6 drives further synoviocyte proliferation.
    evidence:
    - reference: PMID:35210264
      reference_title: "Tocilizumab in patients with new onset polymyalgia rheumatica (PMR-SPARE): a phase 2/3 randomised controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Glucocorticoid-free remission at week 16 was achieved in 12 out of 19 patients on tocilizumab (63.2%) and 2 out of 17 patients receiving placebo (11.8%, p=0.002)"
      explanation: >-
        Randomised evidence that IL-6 receptor blockade induces
        glucocorticoid-free remission, supporting the IL-6 loop as the operative
        mechanism.
  target_phenotypes:
  - preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  evidence:
  - reference: PMID:35210264
    reference_title: "Tocilizumab in patients with new onset polymyalgia rheumatica (PMR-SPARE): a phase 2/3 randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with new onset polymyalgia rheumatica undergoing rapid glucocorticoid tapering, tocilizumab was superior to placebo regarding sustained glucocorticoid-free remission, time to relapse and cumulative glucocorticoid dose."
    explanation: >-
      Trial conclusion establishing tocilizumab's steroid-sparing benefit across
      three endpoints.
  - reference: PMID:37832573
    reference_title: "Polymyalgia rheumatica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "tocilizumab and sarilumab have shown efficacy in randomised controlled trials and additional targeted therapies are emerging"
    explanation: >-
      Confirms randomised-trial efficacy for both IL-6 receptor inhibitors used
      in this disease.

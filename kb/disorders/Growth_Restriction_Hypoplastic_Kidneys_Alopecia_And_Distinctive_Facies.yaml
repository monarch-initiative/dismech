- name: Renal Supportive Care
  description: >-
    Management of the renal insufficiency arising from hypoplastic kidneys is the
    intervention that would change the course, since uremia is a named cause of death in
    this disease. No treatment of any kind is described in either published report - no
    dialysis, no transplantation, no outcome - so this record states the target rather than
    an experience, and no treatment_effect is claimed.

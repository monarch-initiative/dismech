    explanation: The only survival data published for this disease.
diagnosis:
- name: Exome or genome sequencing, with ZPR1 c.587T>C prioritised by ancestry
  description: >-
    Both reported families reached the diagnosis by exome sequencing. The practical point is
    narrower than "sequence the child": a single founder allele accounts for every published
    case, so in an infant of Middle Rio Grande Valley or New Mexican Hispanic ancestry
    presenting with congenital alopecia and hypoplastic kidneys, ZPR1 c.587T>C is a targeted
    test rather than a discovery exercise. Congenital alopecia together with renal
    hypoplasia is the pairing that should raise it; neither feature alone is specific.

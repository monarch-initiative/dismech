    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Severe Congenital Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hydrocephalus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Genital Hypoplasia
    causal_link_type: DIRECT
  - target: Progressive Non-Cirrhotic Liver Disease with Portal Hypertension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal Glucose Homeostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Growth Hormone Resistance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:15767679
    reference_title: "ZPR1 is essential for survival and is required for localization of the survival motor neurons (SMN) protein to Cajal bodies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that Zpr1-/- mice die during early embryonic development, with reduced proliferation and increased apoptosis."
    explanation: >-
      The proliferation deficit at the level of a developing organism. The mouse is a
      complete null and dies before organogenesis, so it demonstrates the consequence of
      losing ZPR1 without modelling the human course.
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide genetic and molecular evidence that a homozygous missense mutation in ZPR1 is associated with a rare and recognizable multisystem syndrome."
    explanation: >-
      The authors' own summary linking the molecular finding to a multisystem clinical
      picture, which is the claim this node stands for.
phenotypes:
- name: Pre- and Postnatal Growth Restriction
  category: Growth
  description: >-
    Growth restriction beginning before birth and continuing after it, in every reported
    patient. The 2026 siblings are described as severely growth restricted. No centiles or
    measurements are given in either abstract, and with six children in total no frequency
    band is recorded.
  phenotype_term:
    preferred_term: Intrauterine growth retardation
    term:
      id: HP:0001511
      label: Intrauterine growth retardation
  notes: >-
    Curated as one record covering both the prenatal and postnatal components because the
    two reports describe them together. The postnatal component is separately bindable to
    HP:0008897 (Postnatal growth retardation) if a later report gives it its own
    description.
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel autosomal recessive disorder characterized by pre- and postnatal growth restriction with microcephaly, distinctive craniofacial features, congenital alopecia, hypoplastic kidneys with renal insufficiency, global developmental delay, severe congenital sensorineural hearing loss, early mortality, hydrocephalus, and genital hypoplasia was observed in 4 children from 3 families of New Mexican Hispanic heritage."
    explanation: >-
      The founding clinical description. It is the source for this and for eight further
      phenotype records in this entry, which is why it is quoted repeatedly.
  - reference: PMID:40776660
    reference_title: "Congenital Alopecia, Hypoplastic Kidneys, Growth Restriction, Growth Hormone Resistance, and Liver Fibrosis: Confirmation of a New Syndrome Caused by Biallelic Variants in ZPR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two female siblings, a 13-month-old and a newborn, with multiple anomalies including hypoplastic kidneys, severe growth restriction, facial dysmorphism, and alopecia, both found to be homozygous for the c.587 T>C variant in ZPR1."
    explanation: >-
      Independent replication in two further children, with the severity qualifier the first
      report does not give.
- name: Microcephaly
  category: Neurological
  description: >-
    Small head circumference, reported as part of the growth restriction in the founding
    cohort. Whether it is congenital or acquired, and whether head circumference falls
    faster than length and weight, is not stated.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel autosomal recessive disorder characterized by pre- and postnatal growth restriction with microcephaly, distinctive craniofacial features, congenital alopecia, hypoplastic kidneys with renal insufficiency, global developmental delay, severe congenital sensorineural hearing loss, early mortality, hydrocephalus, and genital hypoplasia was observed in 4 children from 3 families of New Mexican Hispanic heritage."
    explanation: The founding clinical description, which lists microcephaly with the growth restriction.
- name: Hypoplastic Kidneys with Renal Insufficiency
  category: Renal
  description: >-
    Small kidneys with impaired function, present in the founding cohort and again in the
    2026 siblings - the one feature both reports place first. It is also the feature that
    kills: three of the first four children died before three years of age, of uremia and
    or sepsis.
  phenotype_term:
    preferred_term: Renal hypoplasia
    term:
      id: HP:0000089
      label: Renal hypoplasia
  sequelae:
  - target: Renal Insufficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel autosomal recessive disorder characterized by pre- and postnatal growth restriction with microcephaly, distinctive craniofacial features, congenital alopecia, hypoplastic kidneys with renal insufficiency, global developmental delay, severe congenital sensorineural hearing loss, early mortality, hydrocephalus, and genital hypoplasia was observed in 4 children from 3 families of New Mexican Hispanic heritage."
    explanation: The founding clinical description, naming both the hypoplasia and the resulting insufficiency.
  - reference: PMID:40776660
    reference_title: "Congenital Alopecia, Hypoplastic Kidneys, Growth Restriction, Growth Hormone Resistance, and Liver Fibrosis: Confirmation of a New Syndrome Caused by Biallelic Variants in ZPR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two female siblings, a 13-month-old and a newborn, with multiple anomalies including hypoplastic kidneys, severe growth restriction, facial dysmorphism, and alopecia, both found to be homozygous for the c.587 T>C variant in ZPR1."
    explanation: Replication of the renal finding in two further children.
- name: Renal Insufficiency
  category: Renal
  description: >-
    Impaired kidney function arising from the hypoplastic kidneys, and the proximate cause
    of death in the children who died of uremia. Curated as its own record so that the
    hypoplasia can be distinguished from its functional consequence, and so that mortality
    hangs off the functional record rather than off the structural one.
  phenotype_term:
    preferred_term: Renal insufficiency
    term:
      id: HP:0000083
      label: Renal insufficiency
    clinical_course: PROGRESSIVE
  sequelae:
  - target: Death in Early Childhood
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the children died before 3 years of age from uremia and/or sepsis."
    explanation: >-
      The outcome that makes renal insufficiency the load-bearing feature of this syndrome
      rather than one item on a list. Uremia is named as a cause of death.
- name: Death in Early Childhood
  category: Outcome
  description: >-
    Three of the first four reported children died before three years of age, of uremia
    and/or sepsis. The 2026 siblings were 13 months old and a newborn at report, so they
    contribute no survival information. Six children is far too small a denominator for a
    mortality rate and none is recorded.
  phenotype_term:
    preferred_term: Death in early childhood
  notes: >-
    Left unbound deliberately. HP:0003819 (Death in childhood) is the right concept, but it
    sits in the HPO Mortality/Aging branch rather than under HP:0000118 (Phenotypic
    abnormality), so it is not a member of the PhenotypeTerm dynamic enum and binding it
    fails term validation. The same is true of HP:0001522 (Death in infancy). Other entries
    in this repository handle it the same way - see
    Autosomal_Recessive_Spondylometaphyseal_Dysplasia_Megarbane_Type. The mortality is also
    recorded in `progression`.

    Numerator and denominator: 3 of the 4 children in the founding cohort, before age 3. The
    two children in the 2026 report were alive at publication and are not counted either
    way, so no frequency band is recorded.
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the children died before 3 years of age from uremia and/or sepsis."
    explanation: The mortality observation, with both stated causes.
- name: Congenital Alopecia
  category: Dermatological
  description: >-
    Absence of hair from birth, present in the founding cohort and in both 2026 siblings.
    Neither report describes whether eyebrows and lashes are involved, or whether the
    follicles are absent or present but inactive, so the record is bound to the general
    HPO term rather than to a congenital-total subtype the sources do not establish.
  phenotype_term:
    preferred_term: Congenital alopecia
    term:
      id: HP:0001596
      label: Alopecia
  notes: >-
    HP:0005597 (Congenital alopecia totalis) would be the closer label but asserts totality,
    which neither abstract states. Following the ontology term contract, the specificity is
    carried in preferred_term instead of manufacturing a narrower ontology match.

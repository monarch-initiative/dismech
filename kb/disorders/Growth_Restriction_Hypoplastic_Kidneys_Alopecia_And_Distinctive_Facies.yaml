inheritance:
- name: Autosomal recessive
  description: >-
    Homozygosity for ZPR1 c.587T>C (p.Ile196Thr) in every reported patient, with the
    heterozygous state established in the parents of one family and homozygosity excluded in
    her unaffected siblings. The 2026 report identifies the allele as a founder variant of
    the Middle Rio Grande Valley, which is consistent with the homozygosity being
    identity-by-descent rather than the product of separate mutational events.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a second family, the identical variant was shown to be heterozygous in the affected individual's parents and not homozygous in any of her unaffected siblings."
    explanation: >-
      The segregation pattern that establishes recessive inheritance: carrier parents,
      no homozygous unaffected sibling.
  - reference: PMID:40776660
    reference_title: "Congenital Alopecia, Hypoplastic Kidneys, Growth Restriction, Growth Hormone Resistance, and Liver Fibrosis: Confirmation of a New Syndrome Caused by Biallelic Variants in ZPR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report confirms that homozygosity for c.587 T>C in ZPR1 underlies a novel genetic syndrome with autosomal recessive inheritance and that c.587 T>C is a founder variant for ZPR1 disorder in the Middle Rio Grande Valley."
    explanation: >-
      Independent confirmation of the inheritance mode, and the founder-variant finding that
      explains why one allele accounts for every reported case.
pathophysiology:
- name: ZPR1 p.Ile196Thr Homozygous Founder Variant
  description: >-
    ZPR1 c.587T>C (p.Ile196Thr), homozygous, in every reported patient. Structural modelling
    places the substituted isoleucine in the hydrophobic core of the protein, which predicts
    a folding rather than an interaction defect. This is the only ZPR1 allele reported in
    human disease: there is no truncating variant, no second missense change, and no
    compound heterozygote, so the genotype-phenotype relationship of the gene as a whole is
    unknown.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ZPR1
    term:
      id: hgnc:13051
      label: ZPR1
  downstream:
  - target: Absence of ZPR1 Protein
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of the surviving individual identified a homozygous c.587T>C (p.Ile196Thr) mutation in ZPR1 Zinc Finger (ZPR1) that segregated appropriately in her family."
    explanation: The identification of the allele in the index family.
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Structural modeling reveals that p.Ile196Thr disrupts the hydrophobic core of ZPR1."
    explanation: >-
      The predicted structural consequence. Graded COMPUTATIONAL because it is a modelling
      result, not a measurement - the measured consequence is the protein's absence,
      recorded on the next node.
- name: Absence of ZPR1 Protein
  description: >-
    Patient fibroblasts contain no detectable ZPR1. That is a stronger result than the
    missense genotype would suggest and it is the single most important fact about this
    disease's mechanism: a core-destabilising substitution that leaves no protein behind
    makes the allele functionally null, at least in fibroblasts, and licenses reading the
    ZPR1-deficiency literature as relevant.

    The caveat is that fibroblasts are the only human tissue examined. Whether kidney, hair
    follicle, cochlea or brain also lack the protein entirely, or retain some, has not been
    tested, and a residual amount somewhere would matter - complete ZPR1 loss is embryonic
    lethal in mouse, and these children were liveborn.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Cell Cycle Arrest in G1
    causal_link_type: DIRECT
  - target: Disrupted Subnuclear Localization of SMN and NPAT
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblast cells showed no detectable levels of ZPR1 and the cells showed a defect in cell cycle progression where a significant number of cells remained arrested in the G1 phase."
    explanation: >-
      Both the absence of protein and the cellular consequence, measured in cells from an
      affected child.
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ZPR1 is a ubiquitously expressed, highly conserved protein postulated to transmit proliferative signals from the cell membrane to the nucleus."
    explanation: >-
      What the lost protein is for, and why losing it everywhere produces a syndrome rather
      than an organ-specific disease. Graded OTHER because the sentence is the report's
      summary of prior work, and "postulated" is the authors' own hedge.
- name: Disrupted Subnuclear Localization of SMN and NPAT
  description: >-
    ZPR1 moves into the nucleus during S phase and concentrates with the survival motor
    neurons protein and the histone gene-specific transcription factor NPAT in subnuclear
    foci, including Cajal bodies sitting on histone gene clusters. Without ZPR1, both
    proteins lose that localisation and histone gene expression falls.

    This node is imported from ZPR1-deficiency work in cell lines and in Zpr1-null mouse
    embryos, not from patients. No patient tissue has been examined for SMN or NPAT
    localisation, so the node describes what ZPR1 loss does rather than what was observed in
    this disease.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: Cajal body
    term:
      id: GO:0015030
      label: Cajal body
  downstream:
  - target: Cell Cycle Arrest in G1
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:17068332
    reference_title: "Deficiency of the zinc finger protein ZPR1 causes defects in transcription and cell cycle progression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, ZPR1 redistributes to the nucleus during S phase and ZPR1 exhibits prominent co-localization with the survival motor neurons protein and the histone gene-specific transcription factor NPAT in subnuclear foci, including Cajal bodies that associate with histone gene clusters."
    explanation: The normal localisation that is lost, and the compartment it is lost from.
  - reference: PMID:17068332
    reference_title: "Deficiency of the zinc finger protein ZPR1 causes defects in transcription and cell cycle progression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These changes in subnuclear architecture and cell cycle progression may be caused by transcriptional defects in ZPR1-deficient cells, including decreased histone gene expression."
    explanation: >-
      The proposed intermediate between the localisation defect and the arrest, which is why
      the outgoing edge is INDIRECT_KNOWN_INTERMEDIATES. The authors write "may be caused",
      and the entry does not upgrade that.
  - reference: PMID:15767679
    reference_title: "ZPR1 is essential for survival and is required for localization of the survival motor neurons (SMN) protein to Cajal bodies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we report that targeted ablation of the Zpr1 gene in mice disrupts the subcellular localization of both SMN and spliceosomal snRNPs."
    explanation: >-
      The same localisation defect in a whole animal rather than a cell line, which is what
      makes it a property of ZPR1 loss rather than of one culture system.
- name: Cell Cycle Arrest in G1
  description: >-
    ZPR1-deficient cells stop cycling. In patient fibroblasts a significant fraction is
    arrested in G1; in experimental ZPR1 deficiency the block is broader, halting S phase
    progression and arresting cells in G1 and G2 both. The patient measurement is the one
    this entry treats as the disease phenotype; the experimental one shows the arrest is not
    an artefact of one cell line.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell cycle G1/S phase transition
    term:
      id: GO:0044843
      label: cell cycle G1/S phase transition
    modifier: DECREASED
  downstream:
  - target: Reduced Cell Proliferation in Developing Tissues
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblast cells showed no detectable levels of ZPR1 and the cells showed a defect in cell cycle progression where a significant number of cells remained arrested in the G1 phase."
    explanation: >-
      The arrest as measured in cells from an affected child, which is what makes this node
      a finding in the disease rather than an inference from the gene.
  - reference: PMID:17068332
    reference_title: "Deficiency of the zinc finger protein ZPR1 causes defects in transcription and cell cycle progression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZPR1 deficiency causes disruption of survival motor neurons and NPAT localization within the nucleus, blocks S phase progression, and arrests cells in both the G(1) and G(2) phases of the cell cycle."
    explanation: >-
      The experimental version of the same arrest. Note it is broader than the patient
      finding - G2 as well as G1 - which is recorded rather than harmonised away.
- name: Reduced Cell Proliferation in Developing Tissues
  description: >-
    The organism-level step: a ubiquitously expressed protein required for cell cycle
    progression is absent, so tissues that must proliferate in order to form do not reach
    their normal size or number. This is the node that accounts for the breadth of the
    syndrome - growth, head circumference, kidney, hair, ear and genital development are
    affected together because the constraint is on proliferation itself rather than on any
    organ's own programme.

    Direct evidence in humans is limited to the fibroblast arrest above; the proliferation
    deficit itself is demonstrated in the Zpr1-null mouse embryo, which shows reduced
    proliferation with increased apoptosis and dies early in development. No affected human
    tissue has been examined histologically.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  downstream:
  - target: Pre- and Postnatal Growth Restriction
    causal_link_type: DIRECT
  - target: Microcephaly
    causal_link_type: DIRECT
  - target: Hypoplastic Kidneys with Renal Insufficiency

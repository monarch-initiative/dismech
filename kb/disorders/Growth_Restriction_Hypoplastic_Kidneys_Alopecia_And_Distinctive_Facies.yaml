name: Growth Restriction Hypoplastic Kidneys Alopecia And Distinctive Facies
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- GKAF
- ZPR1-related multisystem syndrome
- growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
description: >-
  A lethal autosomal recessive multisystem syndrome caused by biallelic ZPR1 variants, known
  from six children in five families and from a single allele. Its descriptive name is the
  list of the features the first report used to recognise it: pre- and postnatal growth
  restriction with microcephaly, distinctive craniofacial features, congenital alopecia, and
  hypoplastic kidneys with renal insufficiency, together with global developmental delay,
  severe congenital sensorineural hearing loss, hydrocephalus and genital hypoplasia. Three
  of the first four children died before three years of age, of uremia or sepsis.

  Every reported patient is homozygous for the same change, ZPR1 c.587T>C (p.Ile196Thr).
  The 2018 report found it in four children from three families of New Mexican Hispanic
  heritage; the 2026 report found it again in two sisters and identified it as a founder
  variant of the Middle Rio Grande Valley. No second allele exists, so nothing is known
  about the allelic spectrum, and the phenotype described here is the phenotype of one
  variant rather than of the gene.

  The mechanism is a general proliferation defect rather than an organ-specific one, which
  is what a syndrome touching growth, brain, kidney, hair, ear and gonad at once should
  look like. The missense change sits in the hydrophobic core of the protein by structural
  modelling, and patient fibroblasts carry no detectable ZPR1 at all - so the allele
  behaves as a null in the one tissue anybody has looked at. Cells lacking ZPR1 arrest in
  G1. Independent work on ZPR1 deficiency in other systems places that arrest downstream of
  disrupted subnuclear organisation, with the survival-motor-neuron protein and the
  histone-gene transcription factor NPAT losing their normal localisation and histone gene
  expression falling.

  That connection to the SMN protein is the strange part of this disease and is curated as
  an open question rather than smoothed over. Almost the entire ZPR1 literature is about
  spinal muscular atrophy: ZPR1 binds SMN, is downregulated in SMA patients, is a candidate
  SMA modifier, and Zpr1-deficient mice develop axonal pathology and neurodegeneration.
  None of that is what the human ZPR1 syndrome looks like. No reported patient has a motor
  neuron disease.

  The 2026 siblings added three features to the phenotype that a growth-restriction syndrome
  would not have predicted: abnormal glucose homeostasis, growth hormone resistance, and
  progressive liver disease with decompensated portal hypertension and oesophageal varices
  in the absence of cirrhosis. The phenotype is therefore still opening rather than closed.

- name: Genetic Counselling
  description: >-
    Recessive counselling with a 25 percent recurrence risk for a carrier couple. What is
    specific here is that a single founder allele explains every published case in a defined
    region, which makes targeted carrier testing of extended family and of the wider Middle
    Rio Grande Valley population a coherent proposition rather than a theoretical one. It
    also means prenatal or preimplantation testing is a single-variant assay.

progression:
- phase: Infancy and early childhood
  age_range: birth to 3 years
  notes: >-
    The disease is present at birth - growth restriction, alopecia, hearing loss and renal
    hypoplasia are all congenital - and the course is dominated by renal failure. Three of
    the four children in the founding cohort died before three years of age, of uremia
    and/or sepsis. The 2026 siblings, aged 13 months and newborn at report, extend the
    phenotype into liver and endocrine involvement without yet extending the known survival.

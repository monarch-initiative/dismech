animal_models:
- name: Zpr1 knockout mouse
  species: Mouse
  genotype: Zpr1 -/- (complete null)
  publication: PMID:15767679
  description: >-
    The complete null, and the reason ZPR1 is described as essential. Zpr1-/- embryos die
    early in development with reduced proliferation and increased apoptosis, and they lose
    the normal subnuclear localisation of SMN and of spliceosomal snRNPs.

    Its relationship to the human disease is asymmetric: it demonstrates that losing ZPR1
    stops cells proliferating in a developing organism, which is the mechanism this entry
    curates, while dying too early to model any of the syndrome's organ features.
  genes:
  - preferred_term: ZPR1
    term:
      id: hgnc:13051
      label: ZPR1
  modeled_mechanisms:
  - target: Reduced Cell Proliferation in Developing Tissues
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      This is where the proliferation claim comes from. It cannot be measured in an affected
      child - no patient tissue has been examined histologically - so the mouse is not
      corroborating a human observation, it is the experiment.
    limitations: >-
      The mouse is a complete germline null and dies during early embryonic development;
      the human allele is a homozygous missense change and the children were liveborn and
      lived months to years. So the mouse establishes the direction of the effect while
      necessarily overstating its degree, and it cannot speak to any organ phenotype because
      it dies before organogenesis. Fidelity is MODERATE rather than HIGH for that reason.
    readouts:
    - name: Embryonic cell proliferation and apoptosis
      target: Reduced Cell Proliferation in Developing Tissues
      direction: DECREASED
      interpretation: >-
        Proliferation falls and apoptosis rises in the null embryo, which is the cellular
        deficit this node stands for.
      evidence:
      - reference: PMID:15767679
        reference_title: "ZPR1 is essential for survival and is required for localization of the survival motor neurons (SMN) protein to Cajal bodies."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that Zpr1-/- mice die during early embryonic development, with reduced proliferation and increased apoptosis."
        explanation: The measurement behind this readout, and the lethality that bounds what the model can show.
    evidence:
    - reference: PMID:15767679
      reference_title: "ZPR1 is essential for survival and is required for localization of the survival motor neurons (SMN) protein to Cajal bodies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that Zpr1-/- mice die during early embryonic development, with reduced proliferation and increased apoptosis."
      explanation: Why this line is informative for a node about proliferation in developing tissue.
  - target: Disrupted Subnuclear Localization of SMN and NPAT
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The localisation defect shown in a whole animal rather than a cell line, which is what
      establishes it as a property of ZPR1 loss rather than of one culture system.
    limitations: >-
      Measured for SMN and spliceosomal snRNPs in the mouse; NPAT localisation was shown
      separately in cultured cells, so no single system has shown both. And no patient tissue
      has been examined for either, so the node has no human observation behind it at all.
    readouts:
    - name: Subcellular localization of SMN and spliceosomal snRNPs
      target: Disrupted Subnuclear Localization of SMN and NPAT
      direction: ALTERED
      interpretation: >-
        SMN fails to reach Cajal bodies and gems, and cytoplasmic snRNP is reduced, in cells
        from null embryos.
      evidence:
      - reference: PMID:15767679
        reference_title: "ZPR1 is essential for survival and is required for localization of the survival motor neurons (SMN) protein to Cajal bodies."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here we report that targeted ablation of the Zpr1 gene in mice disrupts the subcellular localization of both SMN and spliceosomal snRNPs."
        explanation: The localisation measurement behind this readout.
    evidence:
    - reference: PMID:15767679
      reference_title: "ZPR1 is essential for survival and is required for localization of the survival motor neurons (SMN) protein to Cajal bodies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we report that targeted ablation of the Zpr1 gene in mice disrupts the subcellular localization of both SMN and spliceosomal snRNPs."
      explanation: Why this line is informative for the localisation node.
- name: Zpr1 heterozygous null mouse
  species: Mouse
  genotype: Zpr1 +/- (ZPR1-deficient, viable)
  publication: PMID:16648254
  description: >-
    The viable ZPR1-deficient mouse, and the one that produces a postnatal phenotype. It
    develops axonal pathology and neurodegeneration, and it was made and studied to test
    ZPR1 as a modifier of spinal muscular atrophy rather than as a model of any human ZPR1
    syndrome.

    It is included here precisely because its phenotype does not match the human disease.
    A curator reaching for "the ZPR1 mouse" will find a neurodegeneration model, and no
    reported patient with this syndrome has a motor neuron disease.
  genes:
  - preferred_term: ZPR1
    term:
      id: hgnc:13051
      label: ZPR1
  modeled_mechanisms:
  - target: Global Developmental Delay
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The only neurological phenotype reported in patients is global developmental delay,
      characterised over a few months to a few years of life. The mouse's phenotype is
      axonal pathology and neurodegeneration - a different kind of neurological disease, and
      one that no report of this syndrome describes.
    limitations: >-
      The mismatch may be about dose rather than about biology: the mouse is heterozygous
      and retains one working allele, while the patients have no detectable protein in the
      tissue examined, so the two are not the same lesion and the comparison is not
      controlled. It may equally be that early death from renal failure precludes a
      neurodegenerative phenotype ever being observed in patients, or that nobody has looked
      - no neuropathology, nerve conduction study or electromyogram is reported for any
      affected child. Recorded as FAILS_TO_RECAPITULATE because the published phenotypes do
      not correspond, not because degeneration has been excluded in patients.
    evidence:
    - reference: PMID:16648254
      reference_title: "Deficiency of the zinc finger protein ZPR1 causes neurodegeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We report that ZPR1-deficient mice exhibit axonal pathology and neurodegeneration."
      explanation: The mouse phenotype, which is what does not correspond to the human one.
    - reference: PMID:29851065
      reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel autosomal recessive disorder characterized by pre- and postnatal growth restriction with microcephaly, distinctive craniofacial features, congenital alopecia, hypoplastic kidneys with renal insufficiency, global developmental delay, severe congenital sensorineural hearing loss, early mortality, hydrocephalus, and genital hypoplasia was observed in 4 children from 3 families of New Mexican Hispanic heritage."
      explanation: >-
        The human side of the mismatch: the full published phenotype list, in which the
        neurological findings are developmental delay and hydrocephalus, not degeneration.
discussions:
- discussion_id: zpr1_smn_axis_versus_the_human_syndrome
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Nearly all ZPR1 biology comes from spinal muscular atrophy research - SMN binding, Cajal
    body localisation, ZPR1 as an SMA modifier, neurodegeneration in ZPR1-deficient mice.
    None of the six reported children with the human ZPR1 syndrome has a motor neuron
    disease. How much of that literature applies?
  attaches_to:
  - animal_models#Zpr1 heterozygous null mouse
  - pathophysiology#Disrupted Subnuclear Localization of SMN and NPAT
  - genetic#ZPR1
  rationale: >-
    This is the interpretive problem the entry is built around. The mechanistic nodes
    between "no ZPR1 protein" and "cells stop cycling" are all imported from work whose
    purpose was to explain spinal muscular atrophy, and the phenotype they were developed to
    explain is not the phenotype these children have.

    What transfers cleanly is the cell-autonomous part. ZPR1 deficiency arrests the cell
    cycle in cultured cells, and patient fibroblasts show the same G1 arrest - that is the
    one place where the experimental literature and a human measurement agree, and it is why
    the proliferation chain is curated as the mechanism.

    What does not transfer is the neurological reading. The viable ZPR1-deficient mouse
    develops axonal pathology and neurodegeneration; the children have global developmental
    delay and hydrocephalus, with no reported motor neuron involvement. Three possibilities
    are open and nothing published distinguishes them. The mouse is heterozygous and the
    children have no detectable protein, so the lesions differ in dose and possibly in kind.
    Or the children died too early - three before age three, of renal failure - for a
    degenerative phenotype to declare itself. Or nobody has looked: no neuropathology, nerve
    conduction study or electromyogram is reported for any affected child.

    The consequence for this entry is deliberate. The SMN and Cajal body node is kept,
    because it is the best-supported account of how ZPR1 loss reaches the cell cycle, but it
    carries only model and cell-line evidence and its outgoing edge is
    INDIRECT_KNOWN_INTERMEDIATES. No neurodegeneration phenotype is curated, and the mouse
    link to developmental delay is recorded as FAILS_TO_RECAPITULATE rather than quietly
    omitted.
  evidence:
  - reference: PMID:16648254
    reference_title: "Deficiency of the zinc finger protein ZPR1 causes neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data identify ZPR1 deficiency as a contributing factor in neurodegenerative disorders."
    explanation: >-
      The conclusion the mouse literature reached about ZPR1, which is the frame a reader
      will arrive with and which this disease does not fit.
  - reference: PMID:15767679
    reference_title: "ZPR1 is essential for survival and is required for localization of the survival motor neurons (SMN) protein to Cajal bodies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These effects of Zpr1 gene disruption were confirmed and extended in studies of cultured motor neuron-like cells using small interfering RNA-mediated Zpr1 gene suppression; ZPR1 deficiency caused growth cone retraction, axonal defects, and apoptosis."
    explanation: >-
      The neuronal phenotype of ZPR1 loss in culture. Graded IN_VITRO because the sentence
      reports the cultured-cell arm of that study, not the mouse arm.
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblast cells showed no detectable levels of ZPR1 and the cells showed a defect in cell cycle progression where a significant number of cells remained arrested in the G1 phase."
    explanation: >-
      The part that does transfer: the same cell cycle arrest, measured in a patient's own
      cells rather than in an experimental deficiency.
- discussion_id: zpr1_single_allele_single_population
  kind: KNOWLEDGE_GAP
  prompt: >-
    Every reported patient is homozygous for one founder allele in one region. Is this the
    phenotype of the gene, or the phenotype of p.Ile196Thr?
  attaches_to:
  - pathophysiology#ZPR1 p.Ile196Thr Homozygous Founder Variant
  - genetic#ZPR1
  - prevalence#Middle Rio Grande Valley, New Mexico (Hispanic ancestry)
  rationale: >-
    Six children, five families, one variant, one region. Nothing published separates the
    gene's disease from this allele's disease, and the two could differ substantially.

    The specific reason to expect they might: p.Ile196Thr is a missense change that leaves no
    detectable protein in fibroblasts, but complete ZPR1 loss is embryonic lethal in mouse
    and these children were liveborn and lived months to years. Either the mouse and human
    requirements differ, or some ZPR1 remains in tissues nobody has assayed. If the latter,
    the syndrome is a hypomorph's phenotype, a true null would be lethal in humans too, and
    no other loss-of-function allele will ever be found in a living patient - which would
    also explain why nine years of clinical sequencing has produced no second allele.

    What would resolve it is a second independent allele, or a quantitative assay of
    residual ZPR1 in a tissue other than skin. Neither exists.

    A practical consequence follows for anyone reading a ZPR1 variant in a diagnostic
    laboratory: outside this founder population there is no evidence base for interpreting
    one, and the gene has no ClinGen gene-disease validity classification - it does not
    appear in the ClinGen Gene-Disease Validity CSV at all.
  evidence:
  - reference: PMID:40776660
    reference_title: "Congenital Alopecia, Hypoplastic Kidneys, Growth Restriction, Growth Hormone Resistance, and Liver Fibrosis: Confirmation of a New Syndrome Caused by Biallelic Variants in ZPR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report confirms that homozygosity for c.587 T>C in ZPR1 underlies a novel genetic syndrome with autosomal recessive inheritance and that c.587 T>C is a founder variant for ZPR1 disorder in the Middle Rio Grande Valley."
    explanation: >-
      The founder-variant finding. It is what makes the replication meaningful and what makes
      it insufficient to generalise from - both families share an ancestral allele.
  - reference: PMID:15767679
    reference_title: "ZPR1 is essential for survival and is required for localization of the survival motor neurons (SMN) protein to Cajal bodies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that Zpr1-/- mice die during early embryonic development, with reduced proliferation and increased apoptosis."
    explanation: >-
      The lethality that makes a true human null implausible in a liveborn child, and so
      makes the hypomorph reading worth stating.

genetic:
- name: ZPR1
  notes: >-
    ZPR1 encodes a ubiquitously expressed, highly conserved zinc finger protein that
    shuttles between cytoplasm and nucleus with the cell cycle, entering the nucleus in S
    phase and concentrating with the survival motor neurons protein and NPAT in Cajal
    bodies. It sits in the cytoplasm of quiescent cells and moves to the nucleus on mitogen
    stimulation, and its interaction with translation elongation factor 1-alpha was shown -
    in yeast genetics and in mammalian cells - to contribute to normal proliferation. That
    is the basis for the long-standing description of ZPR1 as transmitting proliferative
    signals from the cell membrane to the nucleus.

    One human disease allele is known: c.587T>C (p.Ile196Thr), homozygous in all six
    reported patients and a founder variant of the Middle Rio Grande Valley. It is a
    missense change that behaves as a null in patient fibroblasts, where no ZPR1 protein is
    detectable.

    Nearly all published ZPR1 biology comes from spinal muscular atrophy research rather
    than from this syndrome: ZPR1 interacts with SMN complexes, is downregulated in SMA
    patients, and has been proposed as an SMA modifier. Whether any of that mechanism is
    what makes these children ill is unresolved, and is curated as a knowledge gap rather
    than assumed.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ZPR1
    term:
      id: hgnc:13051
      label: ZPR1
  evidence:
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ZPR1 is a ubiquitously expressed, highly conserved protein postulated to transmit proliferative signals from the cell membrane to the nucleus."
    explanation: What the gene product does, as summarised by the report that tied it to this disease.
  - reference: PMID:40776660
    reference_title: "Congenital Alopecia, Hypoplastic Kidneys, Growth Restriction, Growth Hormone Resistance, and Liver Fibrosis: Confirmation of a New Syndrome Caused by Biallelic Variants in ZPR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report confirms that homozygosity for c.587 T>C in ZPR1 underlies a novel genetic syndrome with autosomal recessive inheritance and that c.587 T>C is a founder variant for ZPR1 disorder in the Middle Rio Grande Valley."
    explanation: >-
      The gene-disease confirmation from an independent group, and the founder-variant
      finding that explains the single-allele spectrum.
  - reference: PMID:9852145
    reference_title: "Interaction of ZPR1 with translation elongation factor-1alpha in proliferating cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The zinc finger protein ZPR1 is present in the cytoplasm of quiescent mammalian cells and translocates to the nucleus upon treatment with mitogens, including epidermal growth factor (EGF)."
    explanation: >-
      The mitogen-responsive shuttling that the "proliferative signal" description rests on,
      measured in mammalian cells.
  - reference: PMID:9852145
    reference_title: "Interaction of ZPR1 with translation elongation factor-1alpha in proliferating cells."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We conclude that ZPR1 is essential for cell viability and that its interaction with eEF-1alpha contributes to normal cellular proliferation."
    explanation: >-
      The essentiality and proliferation conclusion, from the study that identified the
      eEF-1alpha interaction. Graded OTHER because the sentence concludes across a yeast
      genetic arm and a mammalian cell arm, and yeast genetics fits neither MODEL_ORGANISM
      (no animal) nor IN_VITRO (a whole organism) cleanly.
  - reference: PMID:16648254
    reference_title: "Deficiency of the zinc finger protein ZPR1 causes neurodegeneration."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One potential modifier gene is represented by ZPR1, which is down-regulated in patients with SMA and encodes a zinc finger protein that interacts with complexes formed by SMN."
    explanation: >-
      The SMA framing that dominates the ZPR1 literature, stated by that literature itself.
      Graded OTHER because the sentence is this paper's summary of prior work rather than a
      result it reports.
prevalence:
- population: Middle Rio Grande Valley, New Mexico (Hispanic ancestry)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six children in five families across two reports: four children from three families of
    New Mexican Hispanic heritage in 2018, and two sisters in 2026. All are homozygous for
    the same founder allele and all trace to the same region, so the disease is
    geographically concentrated rather than uniformly ultra-rare. No carrier frequency has
    been published, and none of the reports estimates a prevalence, so ULTRA_RARE is a
    qualitative band and no rate_per_100000 is recorded.
  evidence:
  - reference: PMID:40776660
    reference_title: "Congenital Alopecia, Hypoplastic Kidneys, Growth Restriction, Growth Hormone Resistance, and Liver Fibrosis: Confirmation of a New Syndrome Caused by Biallelic Variants in ZPR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report confirms that homozygosity for c.587 T>C in ZPR1 underlies a novel genetic syndrome with autosomal recessive inheritance and that c.587 T>C is a founder variant for ZPR1 disorder in the Middle Rio Grande Valley."
    explanation: >-
      The founder-variant finding, which is what makes ancestry and geography the right
      population stratifier here rather than "worldwide".
  - reference: PMID:29851065
    reference_title: "A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct craniofacial features, alopecia, and hypoplastic kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel autosomal recessive disorder characterized by pre- and postnatal growth restriction with microcephaly, distinctive craniofacial features, congenital alopecia, hypoplastic kidneys with renal insufficiency, global developmental delay, severe congenital sensorineural hearing loss, early mortality, hydrocephalus, and genital hypoplasia was observed in 4 children from 3 families of New Mexican Hispanic heritage."

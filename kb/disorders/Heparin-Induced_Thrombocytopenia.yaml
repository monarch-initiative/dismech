pathophysiology:
- name: Heparin Exposure and PF4-Heparin Neoepitope Formation
  description: >-
    Heparin is a polyanion; platelet factor 4 (PF4, CXCL4) is a small
    positively charged tetramer stored in platelet alpha-granules. When the two
    meet at the right stoichiometric ratio they assemble into ultralarge
    multimolecular complexes, and the conformational change this imposes on PF4
    exposes epitopes that the immune system has never seen. The antigen is
    therefore neither the drug nor a self protein but a complex of the two -
    which is why the disease is an adverse drug reaction with the mechanics of
    autoimmunity.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: PF4
    term:
      id: hgnc:8861
      label: PF4
  evidence:
  - reference: PMID:30482768
    reference_title: 'American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Heparin-induced thrombocytopenia (HIT) is an adverse drug reaction
      mediated by platelet-activating antibodies that target complexes of
      platelet factor 4 and heparin.
    explanation: >-
      Identifies the PF4-heparin complex as the antibody target, which is what
      this node represents. Evidence source is OTHER because this is a
      guideline.
  - reference: PMID:10073268
    reference_title: 'Heparin-induced thrombocytopenia: a ten-year retrospective.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HIT is caused by IgG antibodies that recognize complexes of heparin and
      platelet factor 4
    explanation: >-
      States that the antigen recognized is the heparin-PF4 complex rather than
      either component alone. Evidence source is OTHER because this is a review.
  downstream:
  - target: Anti-PF4/Heparin IgG Antibody Response
    causal_link_type: DIRECT
    description: >-
      The exposed neoepitope is immunogenic and elicits a specific antibody
      response.
    evidence:
    - reference: PMID:30482768
      reference_title: 'American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Heparin-induced thrombocytopenia (HIT) is an adverse drug reaction
        mediated by platelet-activating antibodies that target complexes of
        platelet factor 4 and heparin.
      explanation: >-
        Links the complex directly to the antibodies it elicits. Evidence source
        is OTHER because this is a guideline.

- name: Anti-PF4/Heparin IgG Antibody Response
  description: >-
    Antibodies against the PF4-heparin neoepitope appear rapidly, typically
    within five to ten days of first exposure, and the pathogenic isotype is
    IgG. Two features distinguish this from a conventional secondary immune
    response: it does not require prior sensitization to reach IgG, and it is
    transient, with antibodies typically becoming undetectable over weeks to
    months. Only a minority of antibodies that bind the complex can activate
    platelets, which is the single most important fact for interpreting a
    positive immunoassay.
  biological_scale: MOLECULAR
  role: mediator
  biological_processes:
  - preferred_term: Immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  evidence:
  - reference: PMID:10073268
    reference_title: 'Heparin-induced thrombocytopenia: a ten-year retrospective.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HIT is caused by IgG antibodies that recognize complexes of heparin and
      platelet factor 4, leading to platelet activation via platelet Fc gamma
      IIa receptors.
    explanation: >-
      Names IgG as the pathogenic isotype and states the effector route it uses.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:28374939
    reference_title: 'Diagnostic accuracy of IgG-specific versus polyspecific enzyme-linked immunoassays in heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgG-specific assays confer superior diagnostic accuracy compared with
      polyspecific assays.
    explanation: >-
      Meta-analytic support for IgG being the isotype that matters, which is why
      IgG-specific testing outperforms assays that also detect IgA and IgM.
  downstream:
  - target: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
    causal_link_type: DIRECT
    description: >-
      IgG bound to surface PF4-heparin complexes presents its Fc portion to
      platelet Fc receptors.
    evidence:
    - reference: PMID:10073268
      reference_title: 'Heparin-induced thrombocytopenia: a ten-year retrospective.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        HIT is caused by IgG antibodies that recognize complexes of heparin and
        platelet factor 4, leading to platelet activation via platelet Fc gamma
        IIa receptors.
      explanation: >-
        States the causal step from antibody binding to FcgammaRIIA-mediated
        platelet activation. Evidence source is OTHER because this is a review.
  - target: Heparin-Independent Platelet Activation in Autoimmune HIT
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In a subset of patients the antibodies acquire the ability to activate
      platelets without heparin present.
    evidence:
    - reference: PMID:28846826

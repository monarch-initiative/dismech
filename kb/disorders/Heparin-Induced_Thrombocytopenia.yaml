- name: Explosive Thrombin Generation
  description: >-
    Platelet microparticles, monocyte tissue factor, and an activated
    endothelial surface converge on massive thrombin generation. This is the
    hinge of the entire disease: it is what converts a syndrome named for a low
    platelet count into one of the most intensely prothrombotic states in
    medicine, and it is why the therapeutic answer is a thrombin inhibitor
    rather than platelet support.
  biological_scale: MOLECULAR
  role: central_effector
  conforms_to: "thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation"

      complication curated downstream. Evidence source is OTHER because this is
      a review article.
  downstream:
  - target: Thrombotic Occlusion and Ischemic Tissue Injury
    causal_link_type: DIRECT
    description: >-
      Thrombi occlude vessels and produce downstream ischemia.
    evidence:
    - reference: PMID:12912723
      reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The prospectively defined, primary efficacy end point was a composite of

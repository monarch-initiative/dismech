      snippet: >-
        Autoimmune heparin-induced thrombocytopenia (aHIT) indicates the
        presence in patients of anti-platelet factor 4 (PF4)-polyanion
        antibodies that are able to activate platelets strongly even in the
        absence of heparin (heparin-independent platelet activation).
      explanation: >-

name: Heparin-Induced Thrombocytopenia
description: >-
  Heparin-induced thrombocytopenia (HIT) is a drug-induced, immune-mediated
  prothrombotic disorder in which IgG antibodies against platelet factor 4
  complexed with heparin cross-link FcgammaRIIA on platelets, driving platelet
  activation, microparticle release, monocyte tissue-factor expression, and
  explosive thrombin generation. Its defining paradox is that the falling
  platelet count is a marker of consumption by activation, not of bleeding
  risk: patients with HIT clot rather than bleed, and the thrombotic hazard
  persists after heparin is stopped. Almost every clinical rule that governs
  its management - substitute a non-heparin anticoagulant rather than simply
  withdrawing heparin, do not give warfarin alone, do not transfuse platelets
  reflexively - is a direct consequence of that inversion.
creation_date: "2026-08-16T01:45:00Z"
disease_term:
  preferred_term: heparin-induced thrombocytopenia
  term:
    id: MONDO:0018048
    label: heparin-induced thrombocytopenia
synonyms:
- HIT
- Heparin-induced thrombocytopenia type 2
- Heparin-associated thrombocytopenia
- Immune heparin-induced thrombocytopenia
notes: >-
  This entry curates the immune-mediated disorder, which MONDO:0018048 lists
  under the synonym "heparin-induced thrombocytopenia type 2". The historical
  "type 1" label denotes a benign, non-immune, transient dip in platelet count
  from direct heparin-platelet interaction; it is a different phenomenon with
  no antibody, no thrombotic risk, and no indication to stop heparin, and it is
  deliberately out of scope here. Because the numbered pair and the acronym
  "HIT" are both ambiguous, every claim in this entry is anchored to the
  immune, antibody-mediated disease.


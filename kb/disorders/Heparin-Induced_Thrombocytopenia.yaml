- name: Accelerated Platelet Consumption and Thrombocytopenia
  description: >-
    Platelets that have been activated and opsonized by immune complexes are
    cleared from the circulation, and the count typically falls by more than
    half from its peak. The fall is usually moderate rather than profound, and
    that matters diagnostically: a platelet count of 20 x 10^9/L or below is
    atypical and should raise the possibility of autoimmune HIT with associated
    consumptive coagulopathy. Critically, this thrombocytopenia is a marker of
    consumption by activation, not a bleeding lesion.
  biological_scale: ORGANISM
  role: outcome
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:22990018
    reference_title: 'Predictive value of the 4Ts scoring system for heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 4Ts is a pretest clinical scoring system for heparin-induced
      thrombocytopenia (HIT).
    explanation: >-
      The scoring system named here is built on the magnitude and timing of the
      platelet fall, establishing thrombocytopenia as the measured clinical
      readout of this node.
  - reference: PMID:28846826
    reference_title: Autoimmune heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical syndromes associated with aHIT include: delayed-onset HIT,
      persisting HIT, spontaneous HIT syndrome, fondaparinux-associated HIT,
      heparin 'flush'-induced HIT, and severe HIT (platelet count of < 20 × 109
       L-1 ) with associated disseminated intravascular coagulation (DIC).
    explanation: >-
      Documents that a profoundly low count is a feature of the autoimmune
      subset with consumptive coagulopathy rather than of typical HIT, the
      diagnostic caveat curated in this description. The quote spans the whole
      sentence deliberately: its head names aHIT and its tail carries the
      coagulopathy, and the explanation depends on both.

- name: Venous and Arterial Thrombosis
  description: >-
    Thrombosis is the outcome that kills in HIT, and it occurs on both sides of
    the circulation - deep venous thrombosis and pulmonary embolism most often,
    but also limb artery occlusion, myocardial infarction, and stroke. The
    combination is unusual: most prothrombotic states favour one vascular bed.
    The risk is not abolished by stopping heparin, which is the single most
    consequential clinical fact about this disease, because the antibodies and
    the thrombin they generate persist after the drug is withdrawn.
  biological_scale: TISSUE
  role: outcome
  conforms_to: "thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation"
  evidence:
  - reference: PMID:30482768
    reference_title: 'American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

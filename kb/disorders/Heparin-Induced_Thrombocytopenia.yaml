- name: Procoagulant Platelet Microparticle Release
  description: >-
    Activated platelets shed submicron membrane vesicles that expose anionic
    phospholipid and assemble coagulation factor complexes on their surface.
    These microparticles carry the procoagulant activity of a platelet without
    being counted as one, which is part of why the measured platelet count and
    the thrombotic risk move in opposite directions in this disease.
  biological_scale: CELLULAR
  role: amplifier

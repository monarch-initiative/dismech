  evidence:
  - reference: PMID:28846826
    reference_title: Autoimmune heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune heparin-induced thrombocytopenia (aHIT) indicates the presence
      in patients of anti-platelet factor 4 (PF4)-polyanion antibodies that are
      able to activate platelets strongly even in the absence of heparin
      (heparin-independent platelet activation).
    explanation: >-
      Defines heparin-independent platelet activation, the property that
      distinguishes this branch.
  - reference: PMID:28846826
    reference_title: Autoimmune heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serum-induced platelet activation is inhibited at high heparin
      concentrations (10-100 IU mL-1 heparin). Furthermore, upon serial
      dilution, aHIT serum will usually show heparin-dependent platelet
      activation.
    explanation: >-
      Documents the laboratory behaviour curated here, which is what makes these
      antibodies a variant of the same species rather than a separate entity.
  - reference: PMID:28846826
    reference_title: Autoimmune heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical syndromes associated with aHIT include: delayed-onset HIT,
      persisting HIT, spontaneous HIT syndrome, fondaparinux-associated HIT,
      heparin 'flush'-induced HIT
    explanation: >-
      Enumerates the clinical presentations this branch produces, including the
      ones that occur after or without heparin exposure.
  downstream:
  - target: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
    causal_link_type: DIRECT
    description: >-
      The autoimmune variant converges on the same FcgammaRIIA effector step,
      which is why it produces the same disease with a different time course.
    evidence:
    - reference: PMID:28846826
      reference_title: Autoimmune heparin-induced thrombocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        as seen with serum obtained from patients with otherwise typical
        heparin-induced thrombocytopenia (HIT), serum-induced platelet
        activation is inhibited at high heparin concentrations
      explanation: >-
        States that aHIT sera behave like typical HIT sera in the platelet
        activation assay, supporting convergence on the same effector step.

phenotypes:
- category: Hematologic
  name: Thrombocytopenia
  description: >-
    A fall in platelet count, characteristically to 50% or less of the peak
    value, beginning five to ten days after heparin exposure. It is the sign
    the disease is named for and the entry point to every diagnostic algorithm -
    but it is a marker of platelet consumption by activation, not a bleeding
    lesion.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:15985543
    reference_title: 'Risk for heparin-induced thrombocytopenia with unfractionated and low-molecular-weight heparin thromboprophylaxis: a meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HIT was defined as a decrease in platelets to less than 50% or to less
      than 100 x 10(9)/L and positive laboratory HIT assay.
    explanation: >-
      Gives the quantitative platelet-fall criterion used to define the disease
      in the incidence literature.

- category: Vascular
  name: Deep Venous Thrombosis
  description: >-
    Venous thromboembolism is the most common thrombotic manifestation. It may
    be present at diagnosis or develop after heparin has been stopped, which is
    why withdrawal alone is inadequate management.
  phenotype_term:
    preferred_term: Deep venous thrombosis
    term:
      id: HP:0002625
      label: Deep venous thrombosis
  evidence:
  - reference: PMID:10073268
    reference_title: 'Heparin-induced thrombocytopenia: a ten-year retrospective.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This syndrome occurs when acquired protein C deficiency during warfarin
      treatment of HIT and deep venous thrombosis leads to the inability to
      regulate thrombin generation in the microvasculature.
    explanation: >-
      Documents deep venous thrombosis as a manifestation of HIT in the setting
      where the warfarin complication arises. Evidence source is OTHER because
      this is a review article.

- category: Vascular
  name: Pulmonary Embolism
  description: >-
    Embolization of venous thrombus to the pulmonary arteries, a major cause of
    death in HIT.
  phenotype_term:
    preferred_term: Pulmonary embolism
    term:
      id: HP:0002204
      label: Pulmonary embolism
  evidence:
  - reference: PMID:30482768
    reference_title: 'American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients are at markedly increased risk of thromboembolism.
    explanation: >-
      Establishes thromboembolic risk, of which pulmonary embolism is the
      principal fatal form. Evidence source is OTHER because this is a guideline.
  notes: >-
    No frequency band is asserted. Thromboembolism is described as markedly
    increased in the cited guideline, but no cached abstract in this curation
    pass gives a proportion for pulmonary embolism specifically.

- category: Vascular
  name: Limb Gangrene
  description: >-
    Progressive necrosis of a limb, classically venous limb gangrene in which
    the deep veins are thrombosed while the arterial supply remains patent. In
    HIT this is most characteristically precipitated by warfarin given during
    active disease. Amputation is folded in here as the surgical consequence of
    this phenotype rather than curated separately: it is severe enough to sit
    alongside death and new thrombosis in the composite endpoint of HIT
    treatment trials, but it is a treatment outcome rather than a distinct
    disease manifestation, and HPO has no therapeutic-amputation term to bind
    it to.
  phenotype_term:
    preferred_term: Gangrene
    term:
      id: HP:0100758
      label: Gangrene
  evidence:
  - reference: PMID:10073268
    reference_title: 'Heparin-induced thrombocytopenia: a ten-year retrospective.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      including the newly recognized syndrome of warfarin-induced venous limb
      gangrene
    explanation: >-
      Names the syndrome directly. Evidence source is OTHER because this is a
      review article.
  - reference: PMID:12912723
    reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prospectively defined, primary efficacy end point was a composite of
      all-cause death, all-cause amputation, or new thrombosis in 37 days.
    explanation: >-
      Amputation sits alongside death and new thrombosis as a prespecified trial
      endpoint, establishing limb loss as a recognized consequence of the
      gangrene curated here.

- category: Neurologic
  name: Cerebral Venous Sinus Thrombosis
  description: >-
    Thrombosis of the dural venous sinuses. Uncommon in typical HIT but a
    recognized presentation of the autoimmune and spontaneous variants, where it
    may be the event that brings the patient to attention.
  phenotype_term:
    preferred_term: Cerebral venous sinus thrombosis
    term:
      id: HP:0033724
      label: Cerebral venous sinus thrombosis
  evidence:
  - reference: PMID:30284726
    reference_title: 'Autoimmune heparin-induced thrombocytopenia of delayed onset: a clinical challenge.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven days after discharge, she was readmitted because of a cerebral sinus
      vein thrombosis and severe thrombocytopenia.
    explanation: >-
      Documents cerebral sinus vein thrombosis as the presenting event in a case
      of delayed-onset autoimmune HIT.

- category: Vascular
  name: Arterial Thrombosis
  description: >-
    Arterial events - stroke, myocardial infarction, and limb artery occlusion -
    occur alongside venous thrombosis, and some patients have both. This
    combination is what makes HIT unusual: most prothrombotic states favour one
    side of the circulation, and a syndrome that produces both points at a
    mechanism acting on platelets and thrombin generation rather than on stasis
    or a single vascular bed.
  phenotype_term:
    preferred_term: Arterial thrombosis
    term:
      id: HP:0004420
      label: Arterial thrombosis
  evidence:
  - reference: PMID:37959386
    reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      to arterial thrombosis (strokes, myocardial infarction, and limb artery
      thrombosis), with some patients having both venous and arterial thrombosis
    explanation: >-
      Enumerates the arterial events and records that venous and arterial
      thrombosis co-occur in the same patients. Evidence source is OTHER because
      this is a review article.
  - reference: PMID:36669155
    reference_title: Vaccine-induced immune thrombotic thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the remaining patients present with symptoms resulting from deep venous
      thrombosis, pulmonary embolism, and arterial thrombosis, including stroke
      and myocardial infarction
    explanation: >-
      Independent confirmation of the same arterial spectrum in the anti-PF4
      disease family. Evidence source is OTHER because this is a review article.
  notes: >-
    No frequency band is asserted. Arterial events are consistently described as
    a prominent part of the thrombotic spectrum, but no cached abstract in this
    curation pass gives a proportion for arterial thrombosis specifically.

- category: Dermatologic
  name: Skin Necrosis at Heparin Injection Sites
  description: >-
    Necrotic skin lesions developing at or distant from subcutaneous heparin
    injection sites. Its diagnostic weight is out of proportion to its
    frequency: it is a bedside sign that can appear with anti-PF4/heparin
    antibodies present, and it may occur without the severe platelet fall that
    would otherwise prompt suspicion - so it can be the first and only clue.
  phenotype_term:
    preferred_term: Cutaneous necrosis
    term:
      id: HP:0033126
      label: Cutaneous necrosis
  evidence:
  - reference: PMID:15570433
    reference_title: Low molecular weight heparin-induced skin necrosis-a systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin necrosis occurred locally and distant from the injection site.
      Heparin-induced antibodies were frequently observed (positive 9/11
      articles, negative 2/11).
    explanation: >-
      Documents both the distribution of the lesions and their frequent
      association with heparin-induced antibodies, which is what links this sign
      to the disease rather than to local injection trauma.
  - reference: PMID:15570433
    reference_title: Low molecular weight heparin-induced skin necrosis-a systematic review.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin necrosis caused by LMWH is a rare and probably under-reported
      complication.
    explanation: >-
      Recorded as PARTIAL because it bounds the finding: the sign is rare, so
      its absence carries no weight even though its presence is informative.

diagnosis:
- name: 4Ts pretest probability score
  description: >-
    A four-domain clinical score - degree of thrombocytopenia, timing of the
    platelet fall, thrombosis or other sequelae, and absence of other causes -
    used before laboratory testing. Its value is overwhelmingly in exclusion: a
    low score essentially rules the disease out, while intermediate and high
    scores are far less informative and demand laboratory confirmation. Guidance
    is to use the score rather than clinical gestalt, and to withhold both
    testing and empiric treatment when the score is low.
  evidence:
  - reference: PMID:22990018
    reference_title: 'Predictive value of the 4Ts scoring system for heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The negative predictive value of a low probability 4Ts score was 0.998
      (95% CI, 0.970-1.000) and remained high irrespective of the party
      responsible for scoring, the prevalence of HIT, or the composition of the
      study population.
    explanation: >-
      Quantifies the exclusionary power of a low score and its robustness across
      settings.
  - reference: PMID:22990018
    reference_title: 'Predictive value of the 4Ts scoring system for heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The positive predictive value of an intermediate and high probability 4Ts
      score was 0.14 (0.09-0.22) and 0.64 (0.40-0.82), respectively.
    explanation: >-
      Recorded as PARTIAL because it documents the score's weakness rather than
      its strength: a high score is right only about two-thirds of the time, and
      an intermediate score is usually wrong.
  - reference: PMID:30482768
    reference_title: 'American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Strong recommendations include use of the 4Ts score rather than a gestalt
      approach for estimating the pretest probability of HIT and avoidance of
      HIT laboratory testing and empiric treatment of HIT in patients with a
      low-probability 4Ts score.
    explanation: >-
      Records the guideline's strong recommendation for the score and against
      testing or treating at low probability. Evidence source is OTHER because
      this is a guideline document.

- name: IgG-specific anti-PF4/heparin immunoassay
  description: >-
    An enzyme immunoassay for antibodies against PF4-heparin complexes. The
    assay's central limitation is mechanistic: it detects binding, while the
    disease requires platelet activation, and most binding antibodies are not
    pathogenic. Restricting detection to IgG - the isotype that engages
    FcgammaRIIA - improves specificity for exactly that reason, which is why
    IgG-specific assays outperform polyspecific ones that also capture IgA and
    IgM.
  evidence:
  - reference: PMID:28374939
    reference_title: 'Diagnostic accuracy of IgG-specific versus polyspecific enzyme-linked immunoassays in heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgG-specific assays confer superior diagnostic accuracy compared with
      polyspecific assays. These results further support recommendations in
      favor of IgG-specific testing.
    explanation: >-
      Meta-analytic support for IgG-specific over polyspecific immunoassay,
      which is the mechanistically expected result given that IgG is the isotype
      that cross-links FcgammaRIIA.
  - reference: PMID:28374939
    reference_title: 'Diagnostic accuracy of IgG-specific versus polyspecific enzyme-linked immunoassays in heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunoassay specificity varies in heparin-induced thrombocytopenia (HIT)
      testing.
    explanation: >-
      States the specificity problem that makes a positive immunoassay
      insufficient on its own.

- name: Functional platelet activation assay
  description: >-
    A functional test - serotonin release assay or heparin-induced platelet
    activation test - that measures whether the patient's serum actually
    activates platelets, and does so in the heparin-dependent pattern. It is the
    reference standard precisely because it interrogates the pathogenic property
    rather than mere binding, and it is what distinguishes autoimmune HIT, where
    activation persists without heparin but is still inhibited at high heparin
    concentrations.
  evidence:
  - reference: PMID:30284726
    reference_title: 'Autoimmune heparin-induced thrombocytopenia of delayed onset: a clinical challenge.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune HIT was confirmed by functional heparin-induced platelet (PLT)
      activation test.
    explanation: >-
      Documents the functional assay as the confirmatory test, including for the
      autoimmune variant.
  - reference: PMID:28846826
    reference_title: Autoimmune heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      serum-induced platelet activation is inhibited at high heparin
      concentrations (10-100 IU mL-1 heparin).
    explanation: >-
      Describes the high-heparin inhibition pattern that the functional assay
      reads out and that distinguishes these antibodies.

treatments:
- name: Cessation of All Heparin Exposure
  description: >-
    Withdrawal of every source of heparin, including flushes and coated
    catheters, removes the antigen and stops further immune complex formation.
    It is necessary and it is not sufficient: the antibodies already present
    continue to activate platelets and generate thrombin, so a patient managed
    by withdrawal alone remains at high thrombotic risk. This is the single most
    common management error the mechanism predicts, and the reason substitution
    rather than simple cessation is the standard.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  target_mechanisms:
  - target: Heparin Exposure and PF4-Heparin Neoepitope Formation
    treatment_effect: INHIBITS
    description: >-
      Removing heparin removes one half of the antigenic complex, preventing
      further neoepitope formation.
    evidence:
    - reference: PMID:12912723
      reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Heparin-induced thrombocytopenia (HIT) is an intensely prothrombotic
        syndrome managed by discontinuation of heparin therapy and substitution
        of an alternative inhibitor of thrombin.
      explanation: >-
        States discontinuation as the first management step while making the
        substitution requirement explicit in the same sentence.

- name: Argatroban
  description: >-
    A direct thrombin inhibitor given intravenously, and the treatment whose
    evidence base in HIT is strongest. It acts at the node that actually causes
    the harm - thrombin generation - rather than at the platelet count. In a
    prospective multicentre study against historical controls it reduced the
    composite of death, amputation, and new thrombosis, with the benefit
    concentrated in new thrombosis and thrombotic death, and without an excess
    of bleeding. Hepatically cleared, so it is the practical choice in renal
    impairment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: argatroban
      term:
        id: NCIT:C28833
        label: Argatroban
  target_mechanisms:
  - target: Explosive Thrombin Generation
    treatment_effect: INHIBITS
    description: >-
      Direct inhibition of thrombin interrupts the effector step that converts
      immune platelet activation into thrombosis.
    evidence:
    - reference: PMID:12912723
      reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe our experience with argatroban, a direct thrombin inhibitor,
        in patients with HIT or HIT with thrombosis (HITTS).
      explanation: >-
        Identifies the drug's molecular target as thrombin, matching the
        mechanism node this link occupies.
  evidence:
  - reference: PMID:12912723
    reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the HIT arm, the composite end point was significantly reduced in
      argatroban-treated patients vs controls (28.0% vs 38.8%; P =.04).
    explanation: >-
      Quantifies the reduction in the composite outcome against historical
      controls.
  - reference: PMID:12912723
    reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Argatroban therapy also significantly reduced new thrombosis in HIT and
      HITTS and death due to thrombosis in HITTS.
    explanation: >-
      Localizes the benefit to the thrombotic endpoints, which is what the
      mechanism predicts.
  - reference: PMID:12912723
    reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no significant between-group differences in all-cause death or
      amputation.
    explanation: >-
      Recorded as PARTIAL because it bounds the claim: the composite improved
      and thrombosis fell, but neither death from any cause nor amputation did.
      Curating this treatment without that limit would overstate the evidence.

- name: Non-Heparin Anticoagulant Substitution
  description: >-
    The general principle behind the specific drugs: once HIT is suspected, an
    alternative anticoagulant must replace heparin rather than merely follow it.
    Guidelines treat the choice among argatroban, bivalirudin, danaparoid,
    fondaparinux, and direct oral anticoagulants as conditional, reflecting
    genuine uncertainty about comparative efficacy rather than equivalence
    established by trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: bivalirudin
      term:
        id: NCIT:C47415
        label: Bivalirudin
    - preferred_term: fondaparinux
      term:
        id: NCIT:C73142
        label: Fondaparinux
    - preferred_term: danaparoid
      term:
        id: NCIT:C200706
        label: Danaparoid
  target_mechanisms:
  - target: Explosive Thrombin Generation
    treatment_effect: INHIBITS
    description: >-
      All of the alternatives act on thrombin generation, directly or through
      factor Xa, without supplying the PF4-binding polyanion that drives the
      disease.
    evidence:
    - reference: PMID:30482768
      reference_title: 'American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Conditional recommendations include the choice among non-heparin
        anticoagulants (argatroban, bivalirudin, danaparoid, fondaparinux,
        direct oral anticoagulants) for treatment of acute HIT.
      explanation: >-
        Enumerates the recommended alternatives for acute HIT. Evidence source
        is OTHER because this is a guideline document.
  evidence:
  - reference: PMID:30482768
    reference_title: 'American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia.'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Conditional recommendations include the choice among non-heparin
      anticoagulants (argatroban, bivalirudin, danaparoid, fondaparinux, direct
      oral anticoagulants) for treatment of acute HIT.
    explanation: >-
      Recorded as PARTIAL because the recommendation is explicitly conditional:
      the guideline endorses substitution but does not establish which agent is
      superior. Evidence source is OTHER because this is a guideline.
  notes: >-
    Fondaparinux occupies an unusual position: it is a recommended treatment
    option and has also been reported, rarely, to cause HIT. That is not a
    contradiction so much as a reminder that the antigen is a polyanion-PF4
    complex rather than heparin specifically.

- name: Deferral of Vitamin K Antagonist Until Platelet Recovery
  description: >-
    Withholding warfarin during the acute phase, and overlapping it with a
    non-heparin anticoagulant once the platelet count has recovered, is an
    intervention in its own right rather than an omission. Its target is the
    iatrogenic node: warfarin depletes protein C faster than the procoagulant
    factors, and in a patient with unrestrained thrombin generation that
    imbalance can produce venous limb gangrene. Deferral removes that
    precipitant.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: warfarin
      term:
        id: NCIT:C1658
        label: Warfarin Sodium
  target_mechanisms:
  - target: Warfarin-Induced Protein C Depletion and Microvascular Thrombosis
    treatment_effect: INHIBITS
    description: >-
      Not giving warfarin while thrombin generation is unrestrained prevents
      the acquired protein C deficiency that causes venous limb gangrene.
    evidence:
    - reference: PMID:10073268
      reference_title: 'Heparin-induced thrombocytopenia: a ten-year retrospective.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This syndrome occurs when acquired protein C deficiency during warfarin
        treatment of HIT and deep venous thrombosis leads to the inability to
        regulate thrombin generation in the microvasculature.
      explanation: >-
        Identifies warfarin administration during active HIT as the precipitant,
        which is precisely what deferral removes. Evidence source is OTHER
        because this is a review article.
  notes: >-
    Modeled as a treatment rather than left as a contraindication note because
    the deferral is an active decision with a specific mechanistic target. The
    schema has no slot for a contraindication, and recording this only as prose
    would leave the entry's most counterintuitive clinical rule unattached to
    the node that explains it.

- name: High-Dose Intravenous Immunoglobulin
  description: >-
    High-dose IVIG saturates and competitively blocks FcgammaRIIA, interrupting
    antibody-induced platelet activation at the receptor rather than downstream
    at thrombin. It is reserved for autoimmune HIT, and the reason is
    mechanistic: in aHIT the antibodies activate platelets without heparin, so
    stopping heparin does not de-escalate the process and something must act on
    the effector step itself. Therapeutic plasma exchange is the fallback when
    IVIG fails.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
    treatment_effect: INHIBITS
    description: >-
      IVIG interrupts antibody-induced platelet activation, acting at the
      central effector node rather than on the coagulation output.
    evidence:
    - reference: PMID:37959386
      reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        high-dose intravenous immunoglobulin (IVIG) may be indicated to
        interrupt aHIT-induced platelet activation
      explanation: >-
        States that IVIG acts by interrupting platelet activation, the node this
        link targets. Evidence source is OTHER because this is a review.
  evidence:
  - reference: PMID:37959386
    reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      unlike classic HIT, heparin cessation does not result in de-escalation of
      antibody-induced hemostasis activation
    explanation: >-
      Supplies the mechanistic reason a receptor-level intervention is needed in
      autoimmune HIT specifically. Evidence source is OTHER because this is a
      review article.
  - reference: PMID:37959386
    reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      therapeutic plasma exchange may be required if high-dose IVIG is
      ineffective
    explanation: >-
      Recorded as PARTIAL because it bounds the treatment: IVIG can fail, and a
      second-line option is needed. Evidence source is OTHER because this is a
      review.
  notes: >-
    The same source records a caveat that cuts against the standard
    direct-thrombin-inhibitor approach in this subset: aHIT patients are at risk
    of DTI treatment failure, both through APTT confounding by concurrent DIC
    and because DTIs inhibit thrombin-induced protein C activation. That is a
    genuine mechanistic tension between two curated treatments and is recorded
    as a discussion rather than resolved here.

- name: Direct Oral Anticoagulants
  description: >-
    Rivaroxaban and apixaban are among the non-heparin agents guidelines endorse
    for acute HIT. They are attractive because they need no parenteral access or
    APTT titration - which also removes the APTT-confounding problem that
    threatens direct thrombin inhibitor dosing in the autoimmune subset. The
    recommendation is conditional rather than strong, and they sit here as one
    option among several rather than as a preferred agent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticoagulation therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
    therapeutic_agent:
    - preferred_term: rivaroxaban
      term:
        id: NCIT:C77995
        label: Rivaroxaban
    - preferred_term: apixaban
      term:
        id: NCIT:C61308
        label: Apixaban
  target_mechanisms:
  - target: Explosive Thrombin Generation
    treatment_effect: INHIBITS
    description: >-
      Direct factor Xa inhibition suppresses thrombin generation without
      supplying a PF4-binding polyanion.
    evidence:
    - reference: PMID:30482768
      reference_title: >-
        American Society of Hematology 2018 guidelines for management of venous
        thromboembolism: heparin-induced thrombocytopenia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Conditional recommendations include the choice among non-heparin
        anticoagulants (argatroban, bivalirudin, danaparoid, fondaparinux,
        direct oral anticoagulants) for treatment of acute HIT.
      explanation: >-
        Lists direct oral anticoagulants among the endorsed non-heparin options.
        Evidence source is OTHER because this is a guideline document.
  evidence:
  - reference: PMID:30482768
    reference_title: >-
      American Society of Hematology 2018 guidelines for management of venous
      thromboembolism: heparin-induced thrombocytopenia.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Conditional recommendations include the choice among non-heparin
      anticoagulants (argatroban, bivalirudin, danaparoid, fondaparinux, direct
      oral anticoagulants) for treatment of acute HIT.
    explanation: >-
      Recorded as PARTIAL because the endorsement is explicitly conditional and
      does not establish these agents as preferred. Evidence source is OTHER
      because this is a guideline.

- name: Therapeutic Plasma Exchange
  description: >-
    Removal of circulating pathogenic antibody by apheresis, used as rescue in
    autoimmune HIT when high-dose IVIG fails. It is the only curated
    intervention that acts on the antibody itself rather than on the receptor it
    engages or the thrombin it generates, which is why it remains available when
    the receptor-level and coagulation-level approaches have both been tried.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: Anti-PF4/Heparin IgG Antibody Response
    treatment_effect: INHIBITS
    description: >-
      Apheresis depletes circulating anti-PF4/heparin IgG, acting upstream of
      every other treatment in this entry.
    evidence:
    - reference: PMID:37959386
      reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        therapeutic plasma exchange may be required if high-dose IVIG is
        ineffective
      explanation: >-
        Positions plasma exchange as the rescue after receptor-level therapy
        fails. Evidence source is OTHER because this is a review article.
  evidence:
  - reference: PMID:37959386
    reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Special treatment approaches are required.
    explanation: >-
      Recorded as PARTIAL because it establishes that the autoimmune subset
      needs different management without providing comparative efficacy data for
      plasma exchange specifically. Evidence source is OTHER because this is a
      review.

differential_diagnoses:
- name: Non-Immune Heparin-Associated Thrombocytopenia
  description: >-
    The entity historically called HIT type 1: a mild, early, transient fall in
    platelet count caused by direct heparin-platelet interaction, without
    antibodies and without thrombotic risk. It recovers while heparin continues
    and requires no change in management. Confusing the two leads to the
    opposite error in each direction - unnecessary anticoagulant switching, or a
    missed prothrombotic emergency.
  distinguishing_features:
  - No anti-PF4/heparin antibodies and a negative functional assay
  - Early onset, mild fall, and spontaneous recovery despite continued heparin
  - No associated thrombotic risk
  evidence:
  - reference: PMID:30482768
    reference_title: 'American Society of Hematology 2018 guidelines for management of venous thromboembolism: heparin-induced thrombocytopenia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Heparin-induced thrombocytopenia (HIT) is an adverse drug reaction
      mediated by platelet-activating antibodies that target complexes of
      platelet factor 4 and heparin.
    explanation: >-
      Defines the immune disease by its platelet-activating antibodies, the
      feature the non-immune entity lacks. Evidence source is OTHER because this
      is a guideline.

- name: Vaccine-Induced Immune Thrombotic Thrombocytopenia
  description: >-
    The closest mechanistic relative: anti-PF4 antibodies, thrombocytopenia, and
    severe thrombosis with a striking predilection for cerebral and splanchnic
    vessels, arising after adenoviral-vector vaccination rather than heparin
    exposure. The resemblance was what allowed the mechanism to be identified
    and the management - IVIG and non-heparin anticoagulants - to be transferred
    directly from HIT. It is a differential and a validation of the mechanism at
    the same time.
  distinguishing_features:
  - Follows adenoviral vector vaccination rather than heparin exposure
  - Cerebral venous sinus and splanchnic vein thrombosis are characteristic sites
  - Anti-PF4 antibodies present without heparin in the complex
  evidence:
  - reference: PMID:36669155
    reference_title: Vaccine-induced immune thrombotic thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      previously healthy recipients who developed severe thrombosis (often
      cerebral and/or splanchnic vasculature) and thrombocytopenia typically
      after adenoviral vector-based vaccination were identified
    explanation: >-
      Describes the presentation and vascular distribution that distinguish VITT
      from typical HIT. Evidence source is OTHER because this is a review.
  - reference: PMID:36669155
    reference_title: Vaccine-induced immune thrombotic thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Similarities between this syndrome, vaccine-induced immune thrombotic
      thrombocytopenia (VITT), and heparin-induced thrombocytopenia prompted
      recognition of the role of antiplatelet factor 4 (PF4) antibodies and
      management strategies based on IV immunoglobulin and nonheparin
      anticoagulants, which improved outcome.
    explanation: >-
      Documents that the shared anti-PF4 mechanism let HIT-derived management
      transfer to VITT, the reason these two entities belong together in a
      differential. Evidence source is OTHER because this is a review.

- name: Disseminated Intravascular Coagulation
  description: >-
    Consumptive coagulopathy with thrombocytopenia and thrombosis from another
    cause. The relationship is not purely exclusionary: severe autoimmune HIT
    can present with overt DIC, so finding DIC does not rule HIT out, and the
    resulting prolonged APTT can cause systematic underdosing of
    APTT-adjusted direct thrombin inhibitors.
  distinguishing_features:
  - Absence of anti-PF4/heparin antibodies and a negative functional assay
  - An alternative precipitant such as sepsis, trauma, or malignancy
  - May coexist with, rather than exclude, severe autoimmune HIT
  evidence:
  - reference: PMID:37959386
    reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      patients with unusually severe HIT (e.g., multi-site or microvascular
      thrombosis, overt disseminated intravascular coagulation [DIC])
    explanation: >-
      Documents that overt DIC occurs within severe autoimmune HIT, which is why
      this differential is a coexistence problem rather than a clean exclusion.
      Evidence source is OTHER because this is a review article.

prevalence:
- population: >-
    Surgical and medical patients receiving unfractionated heparin
    thromboprophylaxis, meta-analysis of 15 studies
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2600.0
  notes: >-
    2.6% absolute risk with unfractionated heparin, expressed here as 2,600 per
    100,000 exposed. This is a risk among exposed patients over a treatment
    course, not a population prevalence, and should not be compared with
    population rates. Most contributing studies were in patients after
    orthopedic surgery.
  evidence:
  - reference: PMID:15985543
    reference_title: 'Risk for heparin-induced thrombocytopenia with unfractionated and low-molecular-weight heparin thromboprophylaxis: a meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inverse variance-weighted average that determined the absolute risk
      for HIT with LMWH was 0.2%, and with UFH the risk was 2.6%.
    explanation: >-
      Gives the absolute risk figures for both heparin types in a
      meta-analysis of 7,287 patients.

- population: >-
    Surgical and medical patients receiving low-molecular-weight heparin
    thromboprophylaxis, meta-analysis of 15 studies
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 200.0
  notes: >-
    0.2% absolute risk with low-molecular-weight heparin, roughly a thirteenth
    of the unfractionated-heparin risk. The difference is mechanistically
    coherent: shorter, less highly charged chains form the ultralarge PF4
    complexes less efficiently.
  evidence:
  - reference: PMID:15985543
    reference_title: 'Risk for heparin-induced thrombocytopenia with unfractionated and low-molecular-weight heparin thromboprophylaxis: a meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three analyses were performed using a random effects model and favored the
      use of LMWH
    explanation: >-
      States the direction of the comparison, that the pooled analyses favoured
      low-molecular-weight heparin.
  - reference: PMID:15985543
    reference_title: 'Risk for heparin-induced thrombocytopenia with unfractionated and low-molecular-weight heparin thromboprophylaxis: a meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inverse variance-weighted average that determined the absolute risk
      for HIT with LMWH was 0.2%, and with UFH the risk was 2.6%.
    explanation: >-
      Supplies the low-molecular-weight heparin risk figure recorded here.

progression:
- phase: Typical onset, thrombotic window, and antibody waning
  notes: >-
    The platelet fall characteristically begins five to ten days after heparin
    exposure, earlier on re-exposure within about a hundred days because
    circulating antibody may persist. The thrombotic hazard does not end when
    heparin stops; it continues while pathogenic antibody remains, which is why
    alternative anticoagulation is continued rather than the drug simply
    withdrawn. Antibodies are transient over weeks to months, so a patient with
    a remote history is not permanently heparin-ineligible. The autoimmune
    variant breaks this timetable in both directions - beginning after
    withdrawal, or persisting for weeks.


    Outcome is poor when the disease is not recognized. In the untreated
    historical control arm of the argatroban study the composite of death,
    amputation, and new thrombosis reached 38.8% in HIT and 56.5% in HIT with
    thrombosis at 37 days, and the entry's treatment section is built around
    reducing exactly that composite.
  evidence:
  - reference: PMID:30284726
    reference_title: 'Autoimmune heparin-induced thrombocytopenia of delayed onset: a clinical challenge.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heparin-induced thrombocytopenia (HIT) usually appears at 5 to 10 days
      after initiation of heparin. Autoimmune HIT can arise after
      discontinuation of heparin treatment (delayed-onset HIT) or without any
      preceding heparin exposure (spontaneous HIT syndrome).
    explanation: >-
      Gives both the typical onset window and the two ways the autoimmune
      variant departs from it.
  - reference: PMID:12912723
    reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the HITTS arm, the composite end point occurred in 41.5% of
      argatroban-treated patients vs 56.5% of controls (P =.07).
    explanation: >-
      Supplies the historical-control outcome rate quoted in these notes,
      quantifying how the disease behaves without effective anticoagulation.

environmental:
- name: Therapeutic heparin exposure
  description: >-
    The exposure that defines the disease. Unfractionated heparin carries
    roughly thirteen times the risk of low-molecular-weight heparin, and even
    catheter flushes have been implicated in the autoimmune variant. This is a
    case where the environmental factor is a drug the patient was given for a
    good reason, which is what makes the entry a toxicity mechanism rather than
    an exposure hazard.
  influences_mechanisms:
  - target: Heparin Exposure and PF4-Heparin Neoepitope Formation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Administered heparin is one of the two components of the antigenic
      complex, so exposure is the initiating event of the whole cascade.
    evidence:
    - reference: PMID:15985543
      reference_title: 'Risk for heparin-induced thrombocytopenia with unfractionated and low-molecular-weight heparin thromboprophylaxis: a meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Heparin-induced thrombocytopenia (HIT) is an uncommon but potentially
        devastating complication of anticoagulation with unfractionated heparin
        (UFH) or low-molecular-weight heparin (LMWH).
      explanation: >-
        Establishes heparin administration as the exposure that causes the
        disease, in both of its forms.
  evidence:
  - reference: PMID:15985543
    reference_title: 'Risk for heparin-induced thrombocytopenia with unfractionated and low-molecular-weight heparin thromboprophylaxis: a meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inverse variance-weighted average that determined the absolute risk
      for HIT with LMWH was 0.2%, and with UFH the risk was 2.6%.
    explanation: >-
      Quantifies the exposure-dependent risk difference between the two heparin
      preparations.
  notes: >-
    No `exposure_term:` is bound. ECTO was not searched exhaustively in this
    curation pass, and per the term-annotation guidance no term is preferable to
    a poorly fitting one; a therapeutic-drug exposure of this kind is not
    obviously covered by the environmental-exposure branches ECTO is built
    around.

animal_models:
- name: FcgammaRIIA/hPF4 double-transgenic mouse challenged with KKO and heparin
  description: >-
    Mice engineered to express both human platelet FcgammaRIIA and human PF4,
    then injected with KKO - a monoclonal antibody specific for hPF4/heparin
    complexes - followed by heparin. The design is a direct test of the entry's
    central causal claim, because the two transgenes are precisely the two human
    components the pathograph asserts are required. Single-transgene controls
    receiving the same challenge do not develop the disease, so the model
    establishes not merely that the pathway is sufficient but that both
    components are necessary. Wild-type mice cannot develop HIT at all: mouse
    platelets lack FcgammaRIIA, which is itself an argument that the human
    receptor is the effector.
  species: Mouse
  genotype: Transgenic for human FcgammaRIIA and human PF4
  publication: PMID:11588041
  evidence:
  - reference: PMID:11588041
    reference_title: >-
      Heparin-induced thrombocytopenia/thrombosis in a transgenic mouse model
      requires human platelet factor 4 and platelet activation through
      FcgammaRIIA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This is the first mouse model of HIT to recapitulate the salient features
      of the human disease and demonstrates that FcgammaRIIA and hPF4 are both
      necessary and sufficient to replicate HIT/HITT in an animal model.
    explanation: >-
      States the model's central result - that the two components the pathograph
      turns on are both necessary and sufficient - which is what makes this
      model informative for the entry rather than merely illustrative.
  modeled_mechanisms:
  - target: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Disease requires the human FcgammaRIIA transgene: animals transgenic for
      hPF4 alone do not develop it despite receiving the same antibody and
      heparin challenge. This is the in vivo demonstration that the receptor
      step is causal rather than correlative.
    limitations: >-
      A humanised construct rather than a native disease. Both key components are
      transgenes on a mouse background, expression levels need not match human
      platelets, and the immune arm is bypassed entirely - a monoclonal antibody
      is injected rather than raised, so the model tests the effector limb and
      says nothing about why only some patients mount a pathogenic antibody
      response. That question is the subject of a curated knowledge gap in this
      entry.
    readouts:
    - name: Requirement for the FcgammaRIIA transgene to reproduce disease
      target: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
      direction: ABOLISHED
      interpretation: >-
        Absence of disease in single-transgene controls isolates the receptor as
        a necessary component.
      evidence:
      - reference: PMID:11588041
        reference_title: >-
          Heparin-induced thrombocytopenia/thrombosis in a transgenic mouse model
          requires human platelet factor 4 and platelet activation through
          FcgammaRIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The FcgammaRIIA/hPF4 mice and controls, transgenic for either
          FcgammaRIIA or hPF4, were injected with KKO, a mouse monoclonal
          antibody specific for hPF4/heparin complexes, and then received heparin
          (20 U/d).
        explanation: >-
          Describes the single-transgene control design that makes the necessity
          claim interpretable.
  - target: Accelerated Platelet Consumption and Thrombocytopenia
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Double-transgenic animals given KKO and heparin develop a profound
      platelet fall that single-transgene controls do not.
    limitations: >-
      The platelet nadir is deeper than typical human HIT, where the fall is
      usually moderate; the model is driven by a bolus of a high-avidity
      monoclonal antibody rather than by a polyclonal response of mixed
      pathogenicity, which is the very heterogeneity that makes the human
      disease hard to diagnose.
    readouts:
    - name: Nadir platelet count relative to baseline
      target: Accelerated Platelet Consumption and Thrombocytopenia
      direction: DECREASED
      interpretation: >-
        The magnitude and control-dependence of the platelet fall are the
        model's primary quantitative readout.
      evidence:
      - reference: PMID:11588041
        reference_title: >-
          Heparin-induced thrombocytopenia/thrombosis in a transgenic mouse model
          requires human platelet factor 4 and platelet activation through
          FcgammaRIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Nadir platelet counts for KKO/heparin-treated FcgammaRIIA/hPF4 mice
          were 80% below baseline values, significantly different (P <.001) from
          similarly treated controls.
        explanation: >-
          Quantifies the platelet fall and its statistical separation from
          controls.
  - target: Venous and Arterial Thrombosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      At higher heparin doses the animals develop shock and fibrin-rich thrombi
      in multiple organs, reproducing the thrombotic arm of the disease.
    limitations: >-
      Recorded as PARTIALLY_RECAPITULATES because the reported thrombosis is
      disseminated and multi-organ, closer to a shock syndrome than to the
      discrete deep venous, pulmonary, and limb-artery events that dominate human
      HIT, and it required a heparin dose two and a half times that used for the
      thrombocytopenia readout.
    readouts:
    - name: Fibrin-rich thrombi in multiple organs
      target: Venous and Arterial Thrombosis
      direction: INCREASED
      interpretation: >-
        Histological thrombus formation is the model's structural correlate of
        the thrombotic node.
      evidence:
      - reference: PMID:11588041
        reference_title: >-
          Heparin-induced thrombocytopenia/thrombosis in a transgenic mouse model
          requires human platelet factor 4 and platelet activation through
          FcgammaRIIA.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          FcgammaRIIA/hPF4 mice injected with KKO and 50 U/d heparin developed
          shock and showed fibrin-rich thrombi in multiple organs, including
          thrombosis in the pulmonary vasculature.
        explanation: >-
          Reports the thrombotic findings and the higher heparin dose required
          to produce them.

discussions:
- discussion_id: hit_dti_failure_in_autoimmune_subset
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - "pathophysiology#Explosive Thrombin Generation"
  - "pathophysiology#Heparin-Independent Platelet Activation in Autoimmune HIT"
  prompt: >-
    Are APTT-adjusted direct thrombin inhibitors the right treatment for
    autoimmune HIT, given that the same mechanism makes them both harder to dose
    and potentially counterproductive in that subset?
  rationale: >-
    Two curated treatments in this entry pull against each other in the
    autoimmune subset, and the tension is mechanistic rather than merely
    practical. Direct thrombin inhibitors are the standard answer to HIT because
    thrombin generation is the effector node. But in aHIT two problems arise
    from the same biology. First, aHIT frequently comes with overt DIC, and DIC
    prolongs the APTT; because argatroban and bivalirudin are dosed to APTT, the
    prolongation causes systematic underdosing or interruption of the very drug
    the patient needs. Second, thrombin activates protein C, so inhibiting
    thrombin also suppresses the endogenous anticoagulant arm - the same
    protein C axis whose depletion causes venous limb gangrene when warfarin is
    given. The consequence is that the strongest evidence base in HIT
    (argatroban, from a prospective study against historical controls) was not
    generated in the subset where it is most likely to fail, and it is not
    settled what should replace it. IVIG addresses the receptor rather than
    thrombin, but it can fail too.
  evidence:
  - reference: PMID:37959386
    reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      aHIT patients are at risk for treatment failure with (activated partial
      thromboplastin time [APTT]-adjusted) direct thrombin inhibitor (DTI)
      therapy (argatroban, bivalirudin), either because of APTT confounding
      (where aHIT-associated DIC and resulting APTT prolongation lead to
      systematic underdosing/interruption of DTI therapy)
    explanation: >-
      States both the treatment-failure risk and the APTT-confounding mechanism
      by which direct thrombin inhibitors are underdosed in autoimmune HIT.
      Evidence source is OTHER because this is a review article.
  - reference: PMID:37959386
    reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      or because DTI inhibits thrombin-induced protein C activation
    explanation: >-
      Supplies the second, more mechanistically interesting reason: thrombin
      inhibition also suppresses protein C activation, connecting this
      controversy to the warfarin-gangrene node. Evidence source is OTHER
      because this is a review.
  - reference: PMID:12912723
    reference_title: Argatroban anticoagulation in patients with heparin-induced thrombocytopenia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this multicenter, nonrandomized prospective study, 418 patients with
      HIT were administered intravenous argatroban, 2 micro g/kg per minute,
      adjusted to maintain the activated partial thromboplastin time at 1.5 to 3
      times the baseline value for a mean of 5 to 7 days.
    explanation: >-
      Documents that the pivotal argatroban evidence used exactly the
      APTT-adjusted dosing that is confounded in aHIT. Recorded as PARTIAL
      because it establishes the scope limitation rather than supporting or
      refuting the treatment.

- discussion_id: hit_immunoassay_activation_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Anti-PF4/Heparin IgG Antibody Response"
  - "pathophysiology#FcgammaRIIA-Mediated Platelet Activation by Immune Complexes"
  prompt: >-
    What distinguishes an anti-PF4/heparin IgG antibody that activates platelets
    from one that binds the same antigen and does nothing?
  rationale: >-
    This is the gap that makes HIT hard to diagnose, and it sits precisely
    between two curated nodes. Antibodies against PF4-heparin complexes are
    common after heparin exposure; disease is not. The immunoassay detects
    binding and is therefore poorly specific, while the functional assay detects
    activation and is the reference standard but is technically demanding and
    not widely available. Restricting the immunoassay to IgG helps, which is
    consistent with FcgammaRIIA being the effector receptor, but it does not
    close the gap - most IgG-positive patients still do not have the disease.
    What is missing is a molecular account of the pathogenic property itself:
    which epitopes, what avidity or stoichiometry, what degree of complex
    clustering is required to cross-link FcgammaRIIA productively. Without it,
    no binding assay can be made specific, and the field is left with a
    reference standard that most laboratories cannot run.
  proposed_experiments:
  - experiment_id: hit_pathogenic_epitope_determinants
    name: Structural and functional dissection of platelet-activating versus non-activating anti-PF4 antibodies
    description: >-
      Isolate paired activating and non-activating monoclonal antibodies from
      patients with and without clinical HIT, map their epitopes on the
      PF4-polyanion complex, and relate epitope location, avidity, and complex
      stoichiometry to FcgammaRIIA cross-linking efficiency in a functional
      platelet activation readout.
    readouts:
    - name: Platelet activation by epitope-defined monoclonal anti-PF4 antibodies
      target: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
      direction: INCREASED
      interpretation: >-
        A structural correlate that separates activating from non-activating
        antibodies would allow a binding assay to be engineered for the
        pathogenic property rather than for the antigen.
      evidence:
      - reference: PMID:28374939
        reference_title: 'Diagnostic accuracy of IgG-specific versus polyspecific enzyme-linked immunoassays in heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Immunoassay specificity varies in heparin-induced thrombocytopenia
          (HIT) testing.
        explanation: >-
          The specificity problem this experiment is designed to resolve.
    evidence:
    - reference: PMID:28374939
      reference_title: 'Diagnostic accuracy of IgG-specific versus polyspecific enzyme-linked immunoassays in heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This meta-analysis examined 9 studies that tested samples by both IgG and
        polyspecific methods.
      explanation: >-
        The existing evidence base is comparative assay accuracy across isotypes;
        this experiment is proposed because that approach has reached its limit
        without a molecular account of which antibodies activate platelets.
    - reference: PMID:37959386
      reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Most HIT laboratories do not test for aHIT antibodies, contributing to
        aHIT under-recognition.
      explanation: >-
        Motivates the experiment further: the reference standard is not widely
        performed, so a binding assay engineered for the pathogenic property
        would have disproportionate practical value. Evidence source is OTHER
        because this is a review article.
  evidence:
  - reference: PMID:28374939
    reference_title: 'Diagnostic accuracy of IgG-specific versus polyspecific enzyme-linked immunoassays in heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are conflicting data on whether the IgG-specific or polyspecific
      antiplatelet factor 4/heparin (PF4/H) enzyme-linked immunosorbent assay
      (ELISA) is preferred for the laboratory diagnosis of heparin-induced
      thrombocytopenia (HIT).
    explanation: >-
      Documents unresolved disagreement about how best to detect the antibodies,
      a symptom of the underlying gap in knowing which ones matter.
  - reference: PMID:22990018
    reference_title: 'Predictive value of the 4Ts scoring system for heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The positive predictive value of an intermediate and high probability 4Ts
      score was 0.14 (0.09-0.22) and 0.64 (0.40-0.82), respectively.
    explanation: >-
      Shows how poorly even a high clinical pretest probability predicts the
      disease, which is what forces reliance on assays whose specificity is
      itself limited by this gap.

- discussion_id: hit_ahit_under_recognition
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Heparin-Independent Platelet Activation in Autoimmune HIT"
  prompt: >-
    How common is autoimmune HIT, and how many cases of delayed-onset,
    persisting, or spontaneous disease are being missed because the confirmatory
    test is not performed?
  rationale: >-
    The autoimmune variant is defined by a laboratory property - platelet
    activation without heparin - that most HIT laboratories do not test for.
    That makes its true frequency unknowable from current practice, and creates
    a specific ascertainment trap: the patients most likely to be missed are
    those whose disease begins or persists after heparin has been stopped, which
    is exactly the group in whom the diagnosis is least likely to be
    entertained. The under-recognition is therefore not random with respect to
    severity, and any incidence figure for aHIT drawn from routine practice is a
    lower bound of unknown tightness.
  evidence:
  - reference: PMID:37959386
    reference_title: Autoimmune Heparin-Induced Thrombocytopenia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most HIT laboratories do not test for aHIT antibodies, contributing to
      aHIT under-recognition.
    explanation: >-
      States the testing gap and its consequence directly. Evidence source is
      OTHER because this is a review article.
  - reference: PMID:30284726
    reference_title: 'Autoimmune heparin-induced thrombocytopenia of delayed onset: a clinical challenge.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intracranial bleeding and brain infarction caused her death.
    explanation: >-
      A fatal outcome in a delayed-onset case, illustrating the severity of the
      presentations most likely to be missed.

- discussion_id: hit_no_validated_genetic_determinant
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Anti-PF4/Heparin IgG Antibody Response"
  - "pathophysiology#FcgammaRIIA-Mediated Platelet Activation by Immune Complexes"
  prompt: >-
    Why do only a minority of heparin-exposed patients mount a pathogenic
    anti-PF4/heparin response, and is any of that susceptibility inherited?
  rationale: >-
    This entry carries no `genetic:` section, and the omission is deliberate
    rather than an oversight. Candidate loci exist and are biologically
    plausible - FCGR2A, which encodes the very receptor the central effector
    node turns on, plus TDAG8, HLA-DR, and a replicated chromosome 5 signal from
    a genome-wide association study - but genetic studies have not consistently
    identified risk alleles for HIT, for antibody production, or for its
    thromboembolic complications. Curating any of these as a risk gene would
    assert more than the evidence supports; the honest curation is that the
    absence of a validated determinant is itself the finding. The obstacles are
    structural rather than merely a matter of sample size: true HIT is scarce,
    misclassification is easy because the immunoassay is poorly specific, and
    the environmental exposure varies in type, dose, and duration. The
    consequence is that no pre-exposure test can currently identify who will
    develop HIT, which is the practical liability that accompanies every heparin
    prescription. Note also that the animal model curated in this entry cannot
    address the question at all: it bypasses the immune arm by injecting a
    monoclonal antibody rather than raising one.
  proposed_experiments:
  - experiment_id: hit_powered_multiethnic_genetic_study
    name: Adequately powered multiethnic genetic study with laboratory-confirmed HIT
    description: >-
      Assemble a multiethnic cohort with functional-assay-confirmed HIT rather
      than immunoassay-positive suspicion, capture heparin type, dose, and
      duration per patient, and analyse serologic and thromboembolic outcomes
      separately, since the same allele need not govern antibody formation and
      thrombosis.
    readouts:
    - name: Replicated association between a host variant and functionally confirmed HIT
      target: Anti-PF4/Heparin IgG Antibody Response
      direction: INCREASED
      interpretation: >-
        A determinant that survives laboratory confirmation and replication
        would convert an unpredictable adverse drug reaction into a screenable
        one.
      evidence:
      - reference: PMID:30398086
        reference_title: "Pharmacogenetics to prevent heparin-induced thrombocytopenia: what do we know?"
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          There is a need for well-powered, multiethnic studies with laboratory
          confirmation of HIT, detailed patient- and drug-specific data, and
          inclusion of both serologic and thromboembolic outcomes.
        explanation: >-
          The study design this experiment restates, taken from the review that
          identifies the gap. Evidence source is OTHER because this is a review.
    evidence:
    - reference: PMID:29934777
      reference_title: >-
        Targeted resequencing of a locus for heparin-induced thrombocytopenia on
        chromosome 5 identified in a genome-wide association study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We conducted a genome-wide association study in 96 suspected HIT cases
        and 96 controls to explore the genetic predisposition for HIT within a
        case-control pharmacovigilance study followed by replication in
        additional 86 cases and 86 controls from the same study.
      explanation: >-
        Illustrates the scale of existing genetic studies - fewer than 200 cases
        - which is the power limitation this experiment is designed to overcome.
  evidence:
  - reference: PMID:30398086
    reference_title: "Pharmacogenetics to prevent heparin-induced thrombocytopenia: what do we know?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic studies have not consistently identified risk alleles for HIT, the
      production of platelet factor 4/heparin antibodies or the thromboembolic
      complications of HIT.
    explanation: >-
      The direct statement that no consistent risk allele exists, which is why
      this entry curates no genetic section. Evidence source is OTHER because
      this is a review article.
  - reference: PMID:30398086
    reference_title: "Pharmacogenetics to prevent heparin-induced thrombocytopenia: what do we know?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genes implicated in HIT and platelet factor 4/heparin antibody levels
      include FCGR2A, TDAG8, HLA-DR and others.
    explanation: >-
      Names the candidate loci, including FCGR2A and HLA-DR, so the gap records
      what has been proposed rather than merely that something is missing.
      Evidence source is OTHER because this is a review.
  - reference: PMID:30398086
    reference_title: "Pharmacogenetics to prevent heparin-induced thrombocytopenia: what do we know?"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Compelling evidence also suggests that the FCGR2A H131R polymorphism is
      associated with HIT-related thrombosis.
    explanation: >-
      Recorded as PARTIAL because it points the other way from the review's own
      overall conclusion: one specific association is described as compelling
      even though the field has not converged. Preserving that tension is the
      point of curating this as an open gap rather than resolving it.
  - reference: PMID:29934777
    reference_title: >-
      Targeted resequencing of a locus for heparin-induced thrombocytopenia on
      chromosome 5 identified in a genome-wide association study.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One single nucleotide polymorphism (SNP, rs1433265, P = 6.5 × 10-5, odds
      ratio (OR) 2.79) from 16 identified SNPs was successfully replicated
    explanation: >-
      A replicated signal exists, which is why the gap is framed as unresolved
      rather than negative. Recorded as PARTIAL because a single replicated SNP
      in a small study does not amount to a validated determinant.


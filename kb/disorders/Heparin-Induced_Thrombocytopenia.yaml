- name: Thrombotic Occlusion and Ischemic Tissue Injury
  description: >-
    Occlusion of a vessel by thrombus deprives the tissue it supplies. In HIT
    the consequences range from pulmonary embolism to limb ischemia requiring
    amputation, which is why limb loss appears alongside death and new
    thrombosis in the composite endpoints of HIT treatment trials.
  biological_scale: TISSUE
  role: outcome
  conforms_to: "thrombogenesis#Thrombotic Vascular Occlusion and Ischemic Tissue Injury"
  evidence:

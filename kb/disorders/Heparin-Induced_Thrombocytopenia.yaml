      all-cause death, all-cause amputation, or new thrombosis in 37 days.
    explanation: >-
      Establishes amputation as a recognized outcome of the disease, the
      ischemic tissue injury this node represents.

- name: Warfarin-Induced Protein C Depletion and Microvascular Thrombosis
  description: >-
    Warfarin lowers protein C, a short-half-life vitamin-K-dependent natural
    anticoagulant, faster than it lowers the procoagulant factors it is given to
    suppress. In an ordinary patient this transient imbalance is tolerated. In a
    patient with active HIT, whose thrombin generation is already unrestrained,
    the loss of protein C removes the last brake on microvascular thrombin and
    can produce venous limb gangrene - progressive necrosis of a limb whose
    large veins are thrombosed but whose arteries remain patent. This is an
    iatrogenic node: the pathology is created by the treatment, and it is the
    mechanistic reason warfarin is contraindicated until platelet recovery and
    adequate alternative anticoagulation.
  biological_scale: ORGANISM
  role: outcome
  genes:
  - preferred_term: PROC
    term:
      id: hgnc:9451
      label: PROC
  evidence:
  - reference: PMID:10073268
    reference_title: 'Heparin-induced thrombocytopenia: a ten-year retrospective.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This syndrome occurs when acquired protein C deficiency during warfarin
      treatment of HIT and deep venous thrombosis leads to the inability to
      regulate thrombin generation in the microvasculature.
    explanation: >-
      States the complete mechanism curated at this node - warfarin-induced
      protein C deficiency, failure to regulate microvascular thrombin, and the
      resulting syndrome. Evidence source is OTHER because this is a review.
  - reference: PMID:10073268
    reference_title: 'Heparin-induced thrombocytopenia: a ten-year retrospective.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      including the newly recognized syndrome of warfarin-induced venous limb
      gangrene
    explanation: >-
      Names the clinical syndrome this node produces. Evidence source is OTHER
      because this is a review article.

- name: Heparin-Independent Platelet Activation in Autoimmune HIT
  description: >-
    In a distinct subset, the antibodies activate platelets strongly without any
    heparin present. This changes the disease's behaviour in ways that matter
    clinically: it can begin or worsen after heparin has already been stopped
    (delayed-onset HIT), persist for weeks, or arise with no heparin exposure at
    all (spontaneous HIT syndrome). The laboratory signature is characteristic
    rather than absent - these sera still show the classic inhibition of platelet
    activation at high heparin concentrations, and on serial dilution usually
    reveal heparin-dependent activation, so the antibodies are a variant of the
    same species rather than a different one.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  role: mediator

name: Streptococcal Toxic Shock Syndrome
creation_date: "2026-09-25T14:53:15Z"
category: Infectious Disease
description: >-
  Streptococcal toxic shock syndrome is the Streptococcus pyogenes arm of toxic
  shock syndrome: a severe invasive group A streptococcal infection, often a
  necrotizing soft-tissue infection, produces streptococcal superantigens that
  drive systemic T-cell activation, cytokine release, arterial hypotension, and
  multisystem organ dysfunction.
disease_term:
  preferred_term: streptococcal toxic-shock syndrome
  term:
    id: MONDO:0020544
    label: streptococcal toxic-shock syndrome
parents:
- Toxic Shock Syndrome
synonyms:
- Streptococcal toxic shock syndrome
- Streptococcal TSS
- STSS
prevalence:
- population: 10 US states, invasive group A streptococcal disease (2013-2022)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    Denominator context only, deliberately carrying no numeric rate. Population-based
    Active Bacterial Core surveillance recorded invasive group A streptococcal disease
    rising from 3.6 to 8.2 per 100,000 between 2013 and 2022. Streptococcal TSS is a
    subset of that population, so those figures are not an STSS incidence and are left
    out of `rate_per_100000`.
  evidence:
  - reference: PMID:40193120
    reference_title: "Invasive Group A Streptococcal Infections in 10 US States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incidence rose from 3.6 per 100 000 persons in 2013 to 8.2 per 100 000 persons in
      2022 (P < .001 for trend).
    explanation: >-
      Quantifies the rising incidence of invasive GAS disease. The record intentionally
      leaves the numeric incidence fields empty because the source measures all
      invasive GAS disease rather than streptococcal toxic shock syndrome specifically.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Toxic shock syndrome (TSS) is a rare, life-threatening, toxin-mediated
        infectious process linked, in the vast majority of cases, to toxin-producing
        strains of Staphylococcus aureus or Streptococcus pyogenes.
      explanation: >-
        The review identifies streptococcal TSS as a bacterial toxin-mediated
        infectious process caused by toxin-producing S. pyogenes strains.
infectious_agent:
- name: Streptococcus pyogenes
  infectious_agent_term:
    preferred_term: Streptococcus pyogenes
    term:
      id: NCBITaxon:1314
      label: Streptococcus pyogenes
  description: >-
    Group A Streptococcus causes streptococcal toxic shock syndrome, typically in the
    setting of documented invasive infection such as necrotizing fasciitis, where the
    organism is frequently recovered from a normally sterile site.
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Streptococcal TSS is linked to a severe group A streptococcal infection and,
      most frequently, to a necrotizing soft tissue infection.
    explanation: >-
      Identifies Streptococcus pyogenes as the causative organism of the streptococcal
      form, arising from invasive infection.
pathophysiology:
- name: Necrotizing Group A Streptococcal Soft-Tissue Infection
  description: >-
    Invasive S. pyogenes infection of deep soft tissue, most often necrotizing
    fasciitis and sometimes myositis or gangrene, provides the local focus from which
    streptococcal superantigens are elaborated.
  biological_scale: TISSUE
  downstream:
  - target: Streptococcal Superantigen Exotoxin Production
    description: >-
      Invasive necrotizing infection creates the bacterial tissue focus that produces
      streptococcal pyrogenic exotoxins.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Streptococcal TSS is linked to a severe group A streptococcal infection and,
        most frequently, to a necrotizing soft tissue infection.
      explanation: >-
        Links streptococcal TSS to severe invasive GAS infection, commonly as a
        necrotizing soft-tissue focus.
  - target: Myositis
    description: >-
      Myositis is one form of deep soft-tissue necrosis in the STSS case definition.
    causal_link_type: DIRECT
  - target: Necrotizing Soft Tissue Infection
    description: >-
      Necrotizing fasciitis is the dominant clinical manifestation of the invasive
      soft-tissue focus.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Streptococcal TSS is linked to a severe group A streptococcal infection and,
      most frequently, to a necrotizing soft tissue infection.
    explanation: >-
      Directly places streptococcal toxic shock syndrome in the setting of severe,
      invasive GAS infection and most often necrotizing soft-tissue infection.
- name: Streptococcal Superantigen Exotoxin Production
  description: >-
    Toxigenic S. pyogenes strains secrete streptococcal pyrogenic exotoxins A, B and C
    together with streptococcal superantigen A at the invasive infection focus.
  biological_scale: MOLECULAR
  downstream:
  - target: Superantigen-Mediated MHC Class II and TCR Vbeta Cross-Linking
    description: >-
      Secreted streptococcal superantigen reaches host antigen-presenting cells and T
      cells at the soft-tissue focus and systemically.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Superantigenic exotoxins are able to induce unconventional activation of T cells
        by antigen-presenting cells (APCs).
      explanation: >-
        States that the secreted exotoxins act by engaging antigen-presenting cells and
        T cells, which is the transition this edge encodes.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: ABNORMAL
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main described superantigenic exotoxins are toxic shock syndrome toxin-1
      (TSST-1) and enterotoxins for Staphylococcus aureus and Streptococcal pyrogenic
      exotoxins (SpE) A, B, and C and streptococcal superantigen A (SsA) for
      Streptococcus pyogenes.
    explanation: >-
      Enumerates the streptococcal superantigen exotoxins produced by S. pyogenes,
      which is the content of this node.
- name: Hypertoxigenic M1UK emm1 Streptococcus pyogenes Lineage
  description: >-
    The emerging M1UK emm1 S. pyogenes lineage produces markedly more streptococcal
    pyrogenic exotoxin A than the pandemic M1global lineage. It is therefore modelled
    as a bacterial modifier of the superantigen-production step rather than as a
    necessary cause of streptococcal toxic shock syndrome.
  biological_scale: MOLECULAR
  role: modifier
  downstream:
  - target: Streptococcal Superantigen Exotoxin Production
    causal_link_type: DIRECT
    description: >-
      M1UK isolates upregulate SpeA relative to M1global isolates, increasing
      superantigen output by the infecting clone.
    evidence:
    - reference: PMID:31519541
      reference_title: "Emergence of dominant toxigenic M1T1 Streptococcus pyogenes clone during increased scarlet fever activity in England: a population-based molecular epidemiological study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Median SpeA protein concentration in supernatant was nine-times higher among
        M1UK isolates
      explanation: >-
        Population-based molecular epidemiology tying the emergent emm1 M1UK clone to
        increased secretion of the SpeA streptococcal superantigen.
  evidence:
  - reference: PMID:31519541
    reference_title: "Emergence of dominant toxigenic M1T1 Streptococcus pyogenes clone during increased scarlet fever activity in England: a population-based molecular epidemiological study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A dominant new emm1 S pyogenes lineage characterised by increased SpeA production
      has emerged during increased S pyogenes activity in England.
    explanation: >-
      Establishes M1UK as an emm1 S. pyogenes lineage characterized by increased SpeA
      superantigen production.
- name: Superantigen-Mediated MHC Class II and TCR Vbeta Cross-Linking
  description: >-
    The streptococcal superantigen binds MHC class II on antigen-presenting cells
    outside the conventional peptide-binding groove and simultaneously engages the
    variable beta domain of the T cell receptor. This bridges the two cells without
    antigen processing or MHC restriction.
  biological_scale: MOLECULAR
  downstream:
  - target: Massive Polyclonal T Cell Activation
    description: >-
      Cross-linking delivers an activating signal to every T cell carrying a responsive
      Vbeta element.
    evidence:
    - reference: PMID:19393958
      reference_title: "Gram-positive toxic shock syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TSS results from the ability of bacterial toxins to act as superantigens,
        stimulating immune-cell expansion and rampant cytokine expression in a manner
        that bypasses normal MHC-restricted antigen processing.
      explanation: >-
        Links the non-MHC-restricted binding mode directly to immune-cell expansion,
        which is the step this edge encodes.
  cell_types:
  - preferred_term: professional antigen presenting cell
    term:
      id: CL:0000145
      label: professional antigen presenting cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  cellular_components:
  - preferred_term: MHC class II protein complex
    term:
      id: GO:0042613
      label: MHC class II protein complex
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TSS results from the ability of bacterial toxins to act as superantigens,
      stimulating immune-cell expansion and rampant cytokine expression in a manner
      that bypasses normal MHC-restricted antigen processing.
    explanation: >-
      States the defining superantigen property this node represents: activation that
      bypasses conventional MHC-restricted antigen processing.
  - reference: PMID:14620152
    reference_title: "Association of human leukocyte antigen with outcomes of infectious diseases: the streptococcal experience."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Certain class II haplotypes present the streptococcal superantigens in a way that
      results in responses, whereas others present the same superantigens in a way that
      elicits very potent inflammatory responses that can lead to organ failure and
      shock.
    explanation: >-
      Review of host genetic studies connecting HLA class II superantigen presentation
      to the inflammatory-response severity that distinguishes non-severe invasive GAS
      from shock and organ failure.
- name: Massive Polyclonal T Cell Activation
  description: >-
    Because activation is Vbeta-restricted rather than antigen-specific, a very large
    fraction of the circulating T cell repertoire is activated simultaneously.
  biological_scale: CELLULAR
  downstream:
  - target: Systemic Cytokine Storm
    description: >-
      Activated T cells and accessory monocytes/macrophages release proinflammatory
      cytokines.
    evidence:
    - reference: PMID:19393958
      reference_title: "Gram-positive toxic shock syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A repetitive cycle of cell stimulation and cytokine release results in a
        cytokine avalanche that causes tissue damage, disseminated intravascular
        coagulation, and organ dysfunction.
      explanation: >-
        Describes activated-cell stimulation feeding forward into the cytokine
        avalanche, which is the transition this edge encodes.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bacterial superantigenic exotoxins induces unconventional polyclonal lymphocyte
      activation, which leads to rapid shock, multiple organ failure syndrome, and
      death.
    explanation: >-
      Directly supports unconventional polyclonal lymphocyte activation as the step
      linking superantigen exposure to shock and organ failure.
- name: Systemic Cytokine Storm
  description: >-
    Simultaneous activation of T cells and antigen-presenting cells produces an
    overwhelming, self-amplifying release of proinflammatory cytokines including TNF,
    IL-1beta, IL-2 and IFN-gamma.
  biological_scale: ORGANISM
  downstream:
  - target: Endothelial Injury and Capillary Leak
    description: >-
      Circulating cytokines act on vascular endothelium to increase permeability.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This results in a massive release of proinflammatory cytokines, with clinical
        signs, such as capillary leakage, arterial hypotension, organ failure, and
        coagulation activation, usually being reported in this setting
      explanation: >-
        Places capillary leakage downstream of the proinflammatory cytokine release,
        which is the transition this edge encodes.
  - target: Diffuse Macular Erythroderma
    description: >-
      Systemic inflammatory signaling produces the generalized erythematous macular
      rash counted in the case definition.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Palmoplantar Desquamation
    description: >-
      Diffuse cutaneous inflammation can be followed by convalescent desquamation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Disseminated Intravascular Coagulation
    description: >-
      The cytokine cascade activates coagulation, producing disseminated intravascular
      coagulation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Distributive Shock and Multi-Organ Dysfunction
    description: >-
      Cytokine-driven tissue damage and coagulation activation contribute directly to
      organ dysfunction.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bacterial superantigenic exotoxins induces unconventional polyclonal lymphocyte
        activation, which leads to rapid shock, multiple organ failure syndrome, and
        death.
      explanation: >-
        Connects the superantigen-driven activation cascade to rapid shock and multiple
        organ failure, the endpoint this edge reaches.
  biological_processes:

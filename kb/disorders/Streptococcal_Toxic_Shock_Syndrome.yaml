    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Streptococcal TSS is linked to a severe group A streptococcal infection and,
      most frequently, to a necrotizing soft tissue infection.
    explanation: >-
      Supports culturing the invasive infection focus to document S. pyogenes in
      streptococcal TSS.
treatments:
- name: Surgical source control
  description: >-
    Emergent surgical exploration and debridement removes infected and necrotic soft
    tissue that is elaborating streptococcal superantigen.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Streptococcal Superantigen Exotoxin Production
    description: >-
      Debriding necrotic tissue eliminates the invasive focus in which streptococcal
      superantigen is being produced.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        source control and eradication of toxin production
      explanation: >-
        Pairs source control directly with eradication of toxin production, the
        mechanism node this treatment targets.
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of TSS is a medical emergency and relies on early detection, immediate
      resuscitation, source control and eradication of toxin production, bactericidal
      antibiotic treatment, and protein synthesis inhibiting antibiotic administration.
    explanation: >-
      Lists source control and eradication of toxin production as core components of
      emergency TSS management.

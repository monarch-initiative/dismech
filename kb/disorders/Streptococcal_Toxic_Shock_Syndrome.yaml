discussions:
- discussion_id: ivig_mortality_benefit_stss
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does adjunctive intravenous immunoglobulin reduce mortality in streptococcal toxic
    shock syndrome?
  attaches_to:
  - pathophysiology#Superantigen-Mediated MHC Class II and TCR Vbeta Cross-Linking
  rationale: >-
    The mechanistic rationale is strong and specific: pooled donor immunoglobulin should
    neutralize circulating superantigen and so interrupt the MHC class II/TCR bridging
    step this entry models as the initiating molecular event. The clinical evidence does
    not settle the question. A systematic review and meta-analysis restricted to
    clindamycin-treated streptococcal TSS reported mortality falling from 33.7% to 15.7%
    with consistency across one randomized and four non-randomized studies, whereas a
    Japanese nationwide observational study of 481 patients with invasive group A
    streptococcal infection found no effect on in-hospital mortality after adjustment or
    after propensity-score matching. The treatment entry therefore carries both a
    SUPPORT and a REFUTE evidence item rather than a single adjudicated verdict.
  evidence:
  - reference: PMID:37586661
    reference_title: "Effectiveness of intravenous immunoglobulin therapy for invasive group A Streptococcus infection: A Japanese nationwide observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, these overall findings should not be extrapolated to streptococcal toxic
      shock syndrome as the effect of IVIG therapy in this condition remains uncertain.
    explanation: >-
      The null-result authors themselves state that the effect in streptococcal TSS
      remains uncertain, which is the open question recorded here.
animal_models:
- name: HLA-transgenic SpeC-expressing GAS mouse model
  species: Mouse (Mus musculus)
  genotype: HLA-transgenic mice infected with a SpeC-expressing lethal GAS isolate
  description: >-
    HLA-transgenic mice infected with a clinically lethal S. pyogenes isolate
    expressing streptococcal pyrogenic exotoxin C model superantigen-permissive toxic
    shock-like disease and show that SpeC and streptococcal M protein act cooperatively.
  associated_phenotypes:
  - Toxic shock-like syndrome
  - High bacterial burden
  - Circulating inflammatory cytokines
  modeled_mechanisms:
  - target: Streptococcal Superantigen Exotoxin Production
    relationship: PERTURBS
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The model uses a lethal GAS isolate expressing SpeC and tests the dependence of
      toxic shock-like disease on a specific streptococcal superantigen.
    evidence:
    - reference: PMID:31517054
      reference_title: "Antibodies to the conserved region of the M protein and a streptococcal superantigen cooperatively resolve toxic shock-like syndrome in HLA-humanized mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We modelled these in HLA-transgenic mice infected with a clinically lethal
        isolate expressing Streptococcal pyrogenic exotoxin (Spe) C and demonstrate
        that both SpeC and streptococcal M protein, acting cooperatively, are required
        for disease.
      explanation: >-
        Directly establishes the HLA-transgenic SpeC-expressing infection as a model of
        streptococcal toxic shock-like disease and tests superantigen dependence.
  - target: Massive Polyclonal T Cell Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Human HLA transgene expression supplies the MHC class II context required for
      mice to mount a superantigen-driven cytokine response to GAS.
    limitations: >-
      The HLA transgene is a humanized sensitization step; non-humanized inbred mice
      are intrinsically refractory to superantigen-mediated responses, so the model
      captures the HLA-permissive branch rather than baseline murine immunity.
    evidence:
    - reference: PMID:33079368
      reference_title: "Systems Genetics Approaches in Mouse Models of Group A Streptococcal Necrotizing Soft-Tissue Infections."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Inbred mice are innately refractive to SAg-mediated responses.
      explanation: >-
        Explains why HLA class II humanization is required for a mouse model to
        recapitulate the superantigen branch of streptococcal toxic shock.
  evidence:
  - reference: PMID:31517054
    reference_title: "Antibodies to the conserved region of the M protein and a streptococcal superantigen cooperatively resolve toxic shock-like syndrome in HLA-humanized mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Vaccination with a conserved M protein peptide, J8, protects against STSS by
      causing a dramatic reduction in bacterial burden associated with the absence of
      SpeC and inflammatory cytokines in the blood.
    explanation: >-
      Shows the model reproduces a SpeC-associated inflammatory blood-cytokine readout
      that resolves when conserved M-protein immunity clears the infection.

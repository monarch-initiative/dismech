      label: cytokine production
  - preferred_term: tumor necrosis factor production
    modifier: INCREASED
    term:
      id: GO:0032640
      label: tumor necrosis factor production
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A repetitive cycle of cell stimulation and cytokine release results in a cytokine
      avalanche that causes tissue damage, disseminated intravascular coagulation, and
      organ dysfunction.
    explanation: >-
      Describes the self-amplifying cytokine cascade and links it to the tissue damage,
      coagulopathy and organ dysfunction this node feeds.
- name: Endothelial Injury and Capillary Leak
  description: >-
    Cytokine-driven endothelial activation causes loss of vascular barrier function,
    plasma extravasation into the interstitium, hypoalbuminemia and loss of effective
    intravascular volume.
  biological_scale: TISSUE
  downstream:
  - target: Distributive Shock and Multi-Organ Dysfunction
    description: >-
      Capillary leak plus cytokine-mediated vasodilation produces refractory
      hypotension.
    evidence:
    - reference: PMID:38247655
      reference_title: "Toxic Shock Syndrome: A Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This results in a massive release of proinflammatory cytokines, with clinical
        signs, such as capillary leakage, arterial hypotension, organ failure, and
        coagulation activation, usually being reported in this setting
      explanation: >-
        Reports capillary leakage together with arterial hypotension and organ failure,
        supporting the progression from leak to shock this edge encodes.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043114
      label: regulation of vascular permeability
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This results in a massive release of proinflammatory cytokines, with clinical
      signs, such as capillary leakage, arterial hypotension, organ failure, and
      coagulation activation, usually being reported in this setting
    explanation: >-
      Links the cytokine release directly to capillary leakage and arterial
      hypotension, the content of this node and the next.
- name: Distributive Shock and Multi-Organ Dysfunction
  description: >-
    Refractory hypotension with tissue hypoperfusion, together with direct
    cytokine-mediated injury and coagulation activation, produces the multisystem
    failure that defines the syndrome: acute kidney injury, hepatic dysfunction,
    disseminated intravascular coagulation, rhabdomyolysis, acute respiratory distress,
    and soft-tissue necrosis.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Hypotension
    description: >-
      Distributive shock is recorded clinically as acute arterial hypotension.
    causal_link_type: DIRECT
  - target: Acute Kidney Injury
    description: >-
      Tissue hypoperfusion and cytokine-mediated injury produce acute renal
      dysfunction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated Transaminases
    description: >-
      Tissue hypoperfusion and cytokine-mediated injury produce hepatic dysfunction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Acute Respiratory Distress Syndrome
    description: >-
      Systemic shock and capillary leak produce acute pulmonary dysfunction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Toxic shock syndrome (TSS) is an acute, multi-system, toxin-mediated illness,
      often resulting in multi-organ failure.
    explanation: >-
      Supports multi-organ failure as the terminal manifestation of the toxin-mediated
      cascade.
- name: Bacterial Ribosomal Translation (Clindamycin/Linezolid Target)
  description: >-
    S. pyogenes depends on 70S-ribosome translation. Clindamycin, a lincosamide, and
    linezolid, an oxazolidinone, bind the 50S subunit and arrest bacterial protein
    synthesis. In STSS this target is pursued not primarily for bacterial killing,
    which the beta-lactam provides, but because the superantigens are themselves
    translated products.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific therapy focuses on early identification of the illness, source control,
      and administration on antimicrobial agents including drugs capable of suppressing
      toxin production (eg, clindamycin, linezolid).
    explanation: >-
      Identifies clindamycin and linezolid, both ribosome-targeting protein synthesis
      inhibitors, as the specific agents used in TSS therapy.
- name: Suppression of Streptococcal Superantigen Synthesis
  description: >-
    Because the streptococcal pyrogenic exotoxins are secreted proteins, a
    ribosome-targeting antibiotic suppresses their production independently of
    bacterial killing. This anti-toxin rationale is why clindamycin is added to a
    bactericidal beta-lactam in streptococcal TSS rather than used as a substitute for
    it.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Suppression of Toxin and Exoprotein Synthesis"
  biological_processes:
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:19393958
    reference_title: "Gram-positive toxic shock syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific therapy focuses on early identification of the illness, source control,
      and administration on antimicrobial agents including drugs capable of suppressing
      toxin production (eg, clindamycin, linezolid).
    explanation: >-
      Explicitly frames clindamycin and linezolid as agents capable of suppressing
      toxin production, which is the step this node represents.
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of TSS is a medical emergency and relies on early detection, immediate
      resuscitation, source control and eradication of toxin production, bactericidal
      antibiotic treatment, and protein synthesis inhibiting antibiotic administration.
    explanation: >-
      Separates eradication of toxin production and protein-synthesis-inhibiting
      therapy from bactericidal therapy, matching the distinction between this node and
      the peptidoglycan cross-linking node.
- name: Ribosomal Target Resistance in Group A Streptococcus
  description: >-
    The anti-toxin rationale for adjunctive clindamycin is contingent on the organism
    remaining susceptible to it. Ribosomal-target resistance, principally erm-mediated
    rRNA methylation, is rising sharply in invasive group A Streptococcus: isolates
    non-susceptible to macrolides and clindamycin went from 12.7% to 33.1% over a
    decade of US surveillance.
  biological_scale: MOLECULAR
  role: adaptive_escape
  conforms_to: "bacterial_protein_synthesis_inhibition#Ribosomal Target Resistance"
  biological_processes:
  - preferred_term: response to antibiotic
    modifier: INCREASED
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:40193120
    reference_title: "Invasive Group A Streptococcal Infections in 10 US States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among tested isolates, those nonsusceptible to macrolides and clindamycin
      increased from 12.7% in 2013 to 33.1% in 2022.
    explanation: >-
      Population-based surveillance quantifying the rise in clindamycin
      non-susceptibility among invasive group A streptococcal isolates, the resistance
      step this node represents.
- name: Bacterial Peptidoglycan Cross-Linking (Penicillin Target)
  description: >-
    S. pyogenes builds the peptidoglycan cell wall by penicillin-binding protein
    transpeptidase cross-linking. Penicillin acylates the PBP active site, halts
    cross-linking, and kills the organism.
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  evidence:
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of TSS is a medical emergency and relies on early detection, immediate
      resuscitation, source control and eradication of toxin production, bactericidal
      antibiotic treatment, and protein synthesis inhibiting antibiotic administration.
    explanation: >-
      Establishes bactericidal antibiotic treatment as a distinct required component of
      TSS management; the penicillin PBP target is the step this node represents.
phenotypes:
- category: Cardiovascular
  name: Hypotension
  description: >-
    Shock with hypotension is the core hemodynamic criterion in streptococcal toxic
    shock syndrome.
  phenotype_term:
    preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
    temporality: ACUTE
  diagnostic: true
  evidence:
  - reference: PMID:36456018
    reference_title: "Prognostic factors for streptococcal toxic shock syndrome: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical evidence of STSS included hypotension and at least two of the following:
      renal impairment, coagulopathy, liver function abnormality, acute respiratory
      distress syndrome, generalised erythematous macular rash (with desquamation),
      soft-tissue necrosis (including necrotising fasciitis, myositis or gangrene) or
      meningitis.
    explanation: >-
      Hypotension is named directly in the STSS case-ascertainment criteria.
  - reference: PMID:38247655
    reference_title: "Toxic Shock Syndrome: A Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This results in a massive release of proinflammatory cytokines, with clinical
      signs, such as capillary leakage, arterial hypotension, organ failure, and
      coagulation activation, usually being reported in this setting
    explanation: >-
      Connects arterial hypotension mechanistically to the cytokine release cascade.

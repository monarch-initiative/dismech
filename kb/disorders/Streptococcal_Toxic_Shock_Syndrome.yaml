definitions:
- name: Working Group case definition for streptococcal toxic shock syndrome
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Streptococcal toxic shock syndrome case definitions require hypotension plus at
    least two categories of organ involvement among renal impairment, coagulopathy,
    liver function abnormality, acute respiratory distress syndrome, generalized
    erythematous macular rash with or without desquamation, soft-tissue necrosis, and
    meningitis, in the setting of invasive group A streptococcal infection.
  evidence:
  - reference: PMID:36456018
    reference_title: "Prognostic factors for streptococcal toxic shock syndrome: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical evidence of STSS included hypotension and at least two of the following:
      renal impairment, coagulopathy, liver function abnormality, acute respiratory
      distress syndrome, generalised erythematous macular rash (with desquamation),
      soft-tissue necrosis (including necrotising fasciitis, myositis or gangrene) or
      meningitis.
    explanation: >-
      Enumerates the hypotension and multisystem-organ criteria used to ascertain
      streptococcal toxic shock syndrome cases.
diagnosis:
- name: Culture of the suspected focus and sterile sites
  description: >-
    Blood and wound cultures are obtained to recover S. pyogenes from the invasive
    infection focus. Recovery from a normally sterile site confirms the syndrome when
    the compatible shock and organ-failure criteria are present.
  diagnosis_term:

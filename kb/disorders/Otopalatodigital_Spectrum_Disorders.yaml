genetic:
- name: FLNA Gain-of-Function Missense Variants
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: FLNA
    term:
      id: hgnc:3754
      label: FLNA
  inheritance:
  - name: X-linked Dominant
    inheritance_term:
      preferred_term: X-linked dominant inheritance
      term:
        id: HP:0001423
        label: X-linked dominant inheritance
  features: >-
    Gain-of-function missense mutations clustered in the actin-binding
    domain and rod domain repeats 3, 10, and 14/15. Several mutations are
    recurrent. Males with OPD2 and MNS mutations typically have perinatal
    lethality. Penetrance in males is complete.
  evidence:
  - reference: PMID:12612583
    reference_title: "Localized mutations in the gene encoding the cytoskeletal protein filamin A cause diverse malformations in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified localized mutations in FLNA that conserve the reading
      frame and lead to a broad range of congenital malformations
    explanation: >-
      Defines the gain-of-function mutation spectrum for OPD spectrum.
  - reference: PMID:19773341
    reference_title: "Skeletal dysplasias due to filamin A mutations result from a gain-of-function mechanism distinct from allelic neurological disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data provide the first biochemical evidence for a
      gain-of-function mechanism for the OPD disorders, and
      mechanistically distinguishes them from the loss-of-function
      phenotypes that manifest as disorders of neuronal migration.
    explanation: >-
      Biochemical confirmation of gain-of-function mechanism,
      distinguishing from PVNH loss-of-function.
  - reference: PMID:20301567
    reference_title: "FLNA-Related Otopalatodigital Spectrum Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance in males with an FLNA pathogenic variant leading to an
      FLNA-OPD spectrum disorder is complete
    explanation: >-
      GeneReviews confirms complete penetrance in males.
diagnosis:
- name: Clinical, Radiographic, and Family-History Diagnosis
  description: >-
    FLNA-related otopalatodigital spectrum disorders are usually established by
    characteristic clinical and radiographic features together with a family
    history consistent with X-linked inheritance. Male and female probands can
    both be diagnosed this way, with severity varying by sex and subtype.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:20301567
    reference_title: "FLNA-Related Otopalatodigital Spectrum Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of an FLNA-OPD spectrum disorder is established in a male
      proband with characteristic clinical and radiographic features and a family
      history consistent with X-linked inheritance.
    explanation: >-
      GeneReviews defines the usual diagnostic basis for affected male probands.
  - reference: PMID:20301567
    reference_title: "FLNA-Related Otopalatodigital Spectrum Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of an FLNA-OPD spectrum disorder is usually established in a
      female proband with characteristic clinical and radiographic features and a
      family history consistent with X-linked inheritance.
    explanation: >-
      GeneReviews defines the usual diagnostic basis for affected female
      probands.
- name: Molecular Genetic Confirmation
  description: >-
    Molecular genetic testing can confirm an FLNA-OPD spectrum disorder when the
    clinical, radiographic, or family-history pattern is inconclusive. A
    hemizygous pathogenic FLNA variant confirms diagnosis in a male proband, and
    a heterozygous pathogenic FLNA variant confirms diagnosis in a female
    proband.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301567
    reference_title: "FLNA-Related Otopalatodigital Spectrum Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a hemizygous pathogenic variant in FLNA by molecular
      genetic testing can confirm the diagnosis if clinical features,
      radiographic features, and/or family history are inconclusive.
    explanation: >-
      GeneReviews supports hemizygous FLNA variant detection as confirmatory in
      male probands when other diagnostic features are inconclusive.
  - reference: PMID:20301567
    reference_title: "FLNA-Related Otopalatodigital Spectrum Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a heterozygous pathogenic variant in FLNA by molecular
      genetic testing can confirm the diagnosis if clinical features,
      radiographic features, and/or family history are inconclusive.
    explanation: >-
      GeneReviews supports heterozygous FLNA variant detection as confirmatory
      in female probands when other diagnostic features are inconclusive.

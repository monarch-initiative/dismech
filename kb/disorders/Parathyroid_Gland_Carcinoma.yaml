    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional recurrent mutations in genes such as MEN1 and PRUNE2, alterations in cell cycle regulators such as CCND1 and EZH2, and disruptions in signalling pathways including PI3K/AKT/mTOR have been identified."
    explanation: >-
      Sources the additional recurrent lesions this entry's description names. They
      are not curated as separate genetic records; the sentence is cited so the
      claim is not unsupported prose.
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline CDC73 mutations are present in up to 25% of seemingly sporadic PC cases"
    explanation: >-
      A fact about this disease rather than about the excluded HPT-JT syndrome: a
      quarter of apparently sporadic cases carry a germline lesion, which is why
      germline testing is recommended without a family history. The pathophysiology
      node records SOMATIC because that is the transforming event in the tumour,
      not because the germline arm is absent.

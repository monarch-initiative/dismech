name: Parathyroid Gland Carcinoma
creation_date: "2026-10-09T00:00:00Z"
category: Cancer
categories:
- Endocrine Cancer
- Endocrine Neoplasm
synonyms:
- parathyroid carcinoma
- parathyroid gland cancer
- parathyroid adenocarcinoma
- PRTC
- malignant neoplasm of parathyroid gland
disease_term:
  preferred_term: parathyroid gland carcinoma
  term:
    id: MONDO:0012004
    label: parathyroid gland carcinoma
parents:
- malignant tumor of parathyroid gland
notes: >-
  Granularity. Curated at the histologic-entity level, which design decisions
  section 3a makes the default for a new cancer entry. MONDO:0012004 is a true
  leaf with no children, and none of its three parents - malignant tumor of
  parathyroid gland, adenocarcinoma, hereditary disease - is bound as any entry's
  disease_term, so nothing competes for the concept.

  The differential is the disease. Distinguishing carcinoma from benign parathyroid
  neoplasia is the central diagnostic problem here, not a footnote, and the 2022
  WHO classification resolves it histologically rather than cytologically: carcinoma
  requires angioinvasion, lymphatic invasion, perineural invasion, local malignant
  invasion into adjacent structures, or documented metastasis. Those criteria are
  curated in the diagnosis section rather than paraphrased here.

  Nomenclature note, because the older term is still in wide use and appears in
  sources cited here. The 2022 WHO classification "no longer endorses the use of
  'atypical parathyroid adenoma'", replacing it with atypical parathyroid tumour,
  a neoplasm of uncertain malignant potential. This entry uses the current term,
  and where a cited study predates the change its own wording is preserved inside
  the quoted snippet.

  Do not reuse the deep-research report in research/ without checking it. Three of
  its citations are real PMIDs for the wrong papers, and its own validator caught
  only one. PMID:36949199 is listed in its reference table as "Genomic and
  transcriptomic profiling reveal molecular characteristics of parathyroid
  carcinoma" and cited for a WT1 biomarker claim; the paper is "RHOJ controls
  EMT-associated resistance to chemotherapy", a mouse skin squamous cell carcinoma
  study with no parathyroid content. PMID:38198197 is cited as a strain-dependent
  Cdc73 mouse paper and is an adolescent idiopathic scoliosis bracing trial; this
  is the one the validator flagged. PMID:539600 is cited for parathyroid carcinoma
  accounting for 4.3% of radiation-associated hyperparathyroidism, and that paper
  states the opposite - that parathyroid carcinoma has not been reported in
  irradiated patients. The report's own reference_validation block also records
  quotes_valid 0 of 2 with PMID:42577903 named, so quotes attributed to that paper
  in the report are unreliable; the two sentences cited from it here were taken from
  the cache instead. Four of its ontology bindings are wrong and are listed in the
  calcimimetic treatment's review_notes and in the skeletal phenotype's explanation.

  Relationship to the curated neighbours. Parathyroid_Hyperplasia.yaml binds
  MONDO:0006354 and is a distinct, non-competing entity; note that the same WHO
  revision narrows "parathyroid hyperplasia" largely to secondary hyperplasia of
  chronic renal failure, which is a question for that entry rather than this one.
  Multiple_Endocrine_Neoplasia_Type_1 and Type_2 are curated and mention carcinoma
  nowhere. Hyperparathyroidism-jaw tumour syndrome, the germline CDC73
  predisposition in which parathyroid carcinoma arises, is absent from kb/;
  section 3a keeps germline predisposition syndromes separate from the somatic
  cancers they predispose to, so it is recorded here as a gap rather than absorbed.

  Deliberate omissions. The metastatic sites are unbound because no cited reference
  names an organ. Osteitis fibrosa cystica is described in the literature but not
  bound: the only term the deep-research report offered for it was wrong, and no
  cited source here names the lesion. There is no mappings block, because the
  report's identifier table disagrees with MONDO's own xrefs in more than one place
  and was not trusted.
classifications:
  icdo_morphology:
    classification_value: Adenocarcinoma
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
description: >-
  Parathyroid gland carcinoma is a rare, aggressive malignancy of the parathyroid
  chief cell, accounting for roughly 1% of primary hyperparathyroidism. It presents
  not as an incidental mass but through the hormone it secretes: autonomous
  parathyroid hormone output drives severe hypercalcaemia with its renal and
  skeletal consequences, and a palpable neck mass is often present. Biallelic
  inactivation of CDC73, which encodes the tumour suppressor parafibromin, is the
  characteristic molecular lesion and is implicated in up to 75% of familial and
  sporadic cases; loss of nuclear parafibromin on immunohistochemistry is the
  practical correlate. Recurrent changes in MEN1, CCND1 and EZH2 and in the
  PI3K/AKT/mTOR axis have also been described. Diagnosis rests on histological
  evidence of invasion rather than on cytological atypia, which is why the
  distinction from benign parathyroid neoplasia is difficult and why the 2022 WHO
  criteria are explicit. Complete en bloc resection at first operation is the only
  treatment with curative intent; local recurrence is common while distant metastasis is rare, and
  medical therapy is directed at the hypercalcaemia rather than at the tumour.
pathophysiology:
- name: CDC73 Biallelic Inactivation
  biological_scale: MOLECULAR
  description: >-
    The characteristic lesion. Germline and somatic mutation of the tumour
    suppressor CDC73 is implicated in up to 75% of familial and sporadic cases,
    and mutation frequency separates carcinoma from benign parathyroid neoplasia:
    60% of carcinomas in one cohort against 14% of atypical tumours and 6% of
    typical adenomas.
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: CDC73
    term:
      id: hgnc:16783
      label: CDC73
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  molecular_functions:
  - preferred_term: parafibromin binding to RNA polymerase II within the PAF1 complex
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000993
      label: RNA polymerase II complex binding
  downstream:
  - target: Loss of Nuclear Parafibromin
    causal_link_type: DIRECT
    description: Inactivation of the gene removes its protein product from the nucleus.
  evidence:
  - reference: PMID:42694707
    reference_title: "Parathyroid carcinoma: epidemiology and genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline and somatic mutations in the tumour suppressor gene CDC73 (encoding parafibromin) are implicated in up to 75% of familial and sporadic PC cases."
    explanation: >-
      Establishes CDC73 as the dominant lesion and names its protein product.
  - reference: PMID:22987117
    reference_title: "CDC73 mutations and parafibromin immunohistochemistry in parathyroid tumors: clinical correlations in a single-centre patient cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations of CDC73 were observed in 9/15 (60 %) CA, 2/14 (14 %) AA, and 1/17 (6 %) TA tumors."
    explanation: >-
      Quantifies the mutation frequency across carcinoma, atypical and typical
      tumours in one cohort, which is what makes the lesion discriminating rather
      than merely present.
  - reference: PMID:42196524
    reference_title: "Parathyroid Carcinoma: From Molecular Pathogenesis and Diagnostic Biomarkers to Targeted Therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the biallelic inactivation of CDC73"
    explanation: >-
      Sources the biallelic character of the lesion, which this node is named for
      and which the frequency sentences above do not establish.
  - reference: PMID:15923622
    reference_title: The HRPT2 tumor suppressor gene product parafibromin associates with human PAF1 and RNA polymerase II.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It also associates with modified forms of the large subunit of RNA polymerase II"
    explanation: >-
      Establishes the molecular function bound on this node. Parafibromin was shown
      to interact with the PAF1 complex components and with RNA polymerase II, which
      is the activity CDC73 inactivation removes.
  - reference: PMID:15923622
    reference_title: The HRPT2 tumor suppressor gene product parafibromin associates with human PAF1 and RNA polymerase II.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These interactions depend on a C-terminal domain of parafibromin, which is deleted in ca. 80% of clinically relevant mutations."
    explanation: >-
      Ties the lost interaction directly to the mutations that cause disease, which
      is what makes the molecular function the right level to bind here rather than
      a general transcription process.
- name: Loss of Nuclear Parafibromin
  biological_scale: MOLECULAR
  description: >-
    Absence of nuclear parafibromin immunoreactivity is the practical correlate of
    the genetic lesion, and the 2022 WHO classification gives the finding its own
    designation, parafibromin-deficient parathyroid neoplasm. The operating
    characteristics are asymmetric and the sources disagree on the specificity: one
    series reports 58% sensitivity with 100% specificity and loss confined to
    malignant tumours, while an earlier cohort found loss in 3 of 17 typical
    adenomas. The defensible reading is insensitive but highly specific, which is
    why a negative result does not exclude carcinoma and why diagnosis rests on the
    WHO invasion criteria rather than on this stain.
  downstream:
  - target: Autonomous Chief Cell Proliferation
    causal_link_type: DIRECT
    description: >-
      Loss of the tumour suppressor releases the restraint on chief cell
      proliferation.
  evidence:
  - reference: PMID:22987117
    reference_title: "CDC73 mutations and parafibromin immunohistochemistry in parathyroid tumors: clinical correlations in a single-centre patient cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Absence of parafibromin nuclear staining was noted in 8/12 (67 %) CA, 2/13 (15 %) AA, and 3/17 (18 %) TA tumors."
    explanation: >-
      Quantifies loss of nuclear staining across the three tumour classes.
  - reference: PMID:22987117
    reference_title: "CDC73 mutations and parafibromin immunohistochemistry in parathyroid tumors: clinical correlations in a single-centre patient cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular screening and IHC are both useful tools in the differential diagnosis of parathyroid tumors, but both have limited sensitivity and specificity."
    explanation: >-
      Supports the limitation this node states.
  - reference: PMID:35654240
    reference_title: Diagnostic significance of parafibromin expression in parathyroid carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the sensitivity of parafibromin staining is 58%, and the specificity is 100%."
    explanation: >-
      The operating characteristics, which the cohort above describes only in general
      terms. This is what makes the finding insensitive but highly specific rather
      than simply unreliable.
  - reference: PMID:35654240
    reference_title: Diagnostic significance of parafibromin expression in parathyroid carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The loss of parafibromin expression only occurred in malignant tumors, including all carcinomas with metastasis (17/17)"
    explanation: >-
      Specificity evidence that disagrees with the single cohort cited above, where
      3 of 17 typical adenomas also lost staining. Both are recorded rather than one
      being chosen - see this node's description.
- name: Autonomous Chief Cell Proliferation
  biological_scale: CELLULAR
  description: >-
    A clonal population of parathyroid chief cells proliferates without normal
    restraint. In the Cdc73 mouse models this is directly measurable, with
    proliferation rates more than fourfold those of wild-type parathyroid glands.
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  biological_processes:
  - preferred_term: unrestrained chief cell proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Unrestrained Parathyroid Hormone Secretion
    causal_link_type: DIRECT
  - target: Palpable neck mass
    causal_link_type: DIRECT
    description: Tumour growth produces the palpable mass.
  - target: Local Invasive Growth
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28288139
    reference_title: "Mice deleted for cell division cycle 73 gene develop parathyroid and uterine tumours: model for the hyperparathyroidism-jaw tumour syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Parathyroid tumours in Cdc73+/-, Cdc73+/L/PTH-Cre and Cdc73L/L/PTH-Cre mice had significantly increased proliferation, with rates >fourfold higher than that in parathyroid glands of wild-type littermates (P<0.0001)."
    explanation: >-
      Direct measurement of the proliferative consequence of Cdc73 loss in
      parathyroid tissue.
  - reference: PMID:15923622
    reference_title: The HRPT2 tumor suppressor gene product parafibromin associates with human PAF1 and RNA polymerase II.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNAi-induced downregulation of parafibromin promotes entry into S phase, implying a role for parafibromin as an inhibitor of cell cycle progression."
    explanation: >-
      The in vitro counterpart of the mouse proliferation result, and the step that
      connects the lost molecular function to unrestrained proliferation.
- name: Unrestrained Parathyroid Hormone Secretion
  biological_scale: ORGANISM
  description: >-
    The tumour secretes parathyroid hormone without feedback restraint, and this is
    what produces the clinical disease. The hormonal output, not tumour bulk, is the
    proximate cause of the presenting illness and of death in advanced disease.
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  biological_processes:
  - preferred_term: autonomous parathyroid hormone secretion
    modifier: INCREASED
    term:
      id: GO:0035898
      label: parathyroid hormone secretion
  downstream:
  - target: Hypercalcemia
    causal_link_type: DIRECT
  - target: Elevated circulating parathyroid hormone level
    causal_link_type: DIRECT
  - target: Renal disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Renal end-organ disease follows the sustained hypercalcaemia rather than the
      hormone directly.
  - target: Skeletal disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Skeletal disease follows sustained PTH excess acting on bone.
  evidence:
  - reference: PMID:42694707
    reference_title: "Parathyroid carcinoma: epidemiology and genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PC is mostly characterized by severe hypercalcaemia, due to tumoral parathyroid hormone (PTH) over-secretion and a high rate of local recurrence and metastasis, making early diagnosis and surgical treatment crucial."
    explanation: >-
      Attributes the hypercalcaemia to tumoral PTH over-secretion, which is the
      causal step this node asserts.
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mortality is usually from complications of hypercalcemia and not due to tumor burden"
    explanation: >-
      Sources this node's claim that hormonal output rather than tumour bulk is the
      proximate cause of death.
  - reference: PMID:28288139
    reference_title: "Mice deleted for cell division cycle 73 gene develop parathyroid and uterine tumours: model for the hyperparathyroidism-jaw tumour syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cdc73+/-, Cdc73+/L/PTH-Cre and Cdc73L/L/PTH-Cre mice had higher mean serum calcium concentrations than wild-type littermates, and Cdc73+/- mice also had increased mean serum parathyroid hormone (PTH) concentrations."
    explanation: >-
      The model reproduces both the hormonal output and the resulting
      hypercalcaemia downstream of the same genetic lesion.
- name: Local Invasive Growth
  biological_scale: TISSUE
  description: >-
    Invasion is the definitional event: it is what makes the tumour a carcinoma
    rather than an atypical parathyroid tumour, which is why diagnosis depends on
    histology of the resected specimen and not on cytology. Local recurrence is
    common after resection.
  downstream:
  - target: Distant Metastasis
    causal_link_type: DIRECT
    description: >-
      A minority of invasive tumours go on to metastasise distantly.
  evidence:
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PC is usually indolent and slowly progressive, with low rates of lymph node (<5%) and systemic metastasis (<2%)"
    explanation: >-
      Separates the two behaviours this node and its downstream node assert: local
      recurrence is frequent, distant metastasis is not.
- name: Distant Metastasis
  biological_scale: ORGANISM
  description: >-
    Distant metastasis occurs in a small minority, under 2% in the SEER-based
    series, which is why this is modelled downstream of invasion rather than
    alongside it.
  evidence:
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PC is usually indolent and slowly progressive, with low rates of lymph node (<5%) and systemic metastasis (<2%)"
    explanation: >-
      Quantifies distant metastasis as rare. The metastatic sites are deliberately
      not bound, because no reference cited in this entry names an organ.
- name: Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: casr_positive_allosteric_modulation#Calcimimetic Occupancy of the Parathyroid Calcium-Sensing Receptor
  description: >-
    Cinacalcet sensitises the calcium-sensing receptor retained by the carcinoma cells, suppressing their parathyroid hormone output and controlling the hypercalcaemia that dominates the clinical picture. It does not treat the tumour. The relation to the nodes above is control of hormone excess, not causation, so this node asserts no downstream edge.
  molecular_functions:
  - preferred_term: calcium-sensing receptor activity
    modifier: INCREASED
    term:
      id: GO:0004930
      label: G protein-coupled receptor activity
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  locations:
  - preferred_term: parathyroid gland
    term:
      id: UBERON:0001132
      label: parathyroid gland
  genes:
  - preferred_term: CASR
    term:
      id: hgnc:1514
      label: CASR
  evidence:
  - reference: PMID:29534286
    reference_title: "Clinical Pharmacokinetics and Pharmacodynamics of Etelcalcetide, a Novel Calcimimetic for Treatment of Secondary Hyperparathyroidism in Patients With Chronic Kidney Disease on Hemodialysis."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Etelcalcetide binds the calcium-sensing receptor and increases its sensitivity
      to extracellular calcium, thereby decreasing secretion of parathyroid hormone (PTH)
      by chief cells
    explanation: States the receptor occupancy and sensitisation this node represents,
      and names the chief cell it acts on.
  - reference: PMID:29047366
    reference_title: 'The use of cinacalcet hinders the diagnosis of parathyroid carcinoma in a chronic
      dialysis patient: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: BACKGROUND
    snippet: Cinacalcet can also suppress PTH secretion due to parathyroid carcinoma in the same way as
      it does for parathyroid hyperplasia in the uremic condition
    explanation: This disease's own source, stating that the suppression works in parathyroid carcinoma
      as it does in uraemic hyperplasia.

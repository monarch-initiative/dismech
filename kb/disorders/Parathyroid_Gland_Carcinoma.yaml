diagnosis:
- name: Histological criteria for malignancy
  description: >-
    Diagnosis is histological and rests on evidence of invasion, not on cytological
    atypia. This is the criterion that separates carcinoma from atypical parathyroid
    tumour, and it is why complete submission of the specimen matters.
  evidence:
  - reference: PMID:35175514
    reference_title: Overview of the 2022 WHO Classification of Parathyroid Tumors.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The histological definition of parathyroid carcinoma still requires one of the following findings: (i) angioinvasion (vascular invasion) characterized by tumor invading through a vessel wall and associated thrombus, or intravascular tumor cells admixed with thrombus, (ii) lymphatic invasion, (iii) perineural (intraneural) invasion, (iv) local malignant invasion into adjacent anatomic structures, or (v) histologically/cytologically documented metastatic disease."
    explanation: >-
      The WHO diagnostic criteria verbatim. Graded OTHER because a classification
      consensus is not a primary study.
- name: Parafibromin immunohistochemistry
  description: >-
    Loss of nuclear parafibromin supports the diagnosis and now carries its own WHO
    designation, but it is an adjunct rather than a defining criterion.
  evidence:
  - reference: PMID:35175514
    reference_title: Overview of the 2022 WHO Classification of Parathyroid Tumors.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The concept of parafibromin deficiency has been expanded upon and term \"parafibromin deficient parathyroid neoplasm\" is applied to a parathyroid neoplasm showing complete absence of nuclear parafibromin immunoreactivity."
    explanation: Defines the designation and the finding it rests on.

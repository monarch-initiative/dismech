progression:
- phase: Course after resection
  notes: >-
    Recurrence dominates the natural history. In a 50-year single-centre series
    recurrence occurred in just over half of cases and disease persisted in a
    further tenth, which is consistent with the 25-80% recurrence range reported
    elsewhere and with the low rate of distant metastasis.
  evidence:
  - reference: PMID:42485575
    reference_title: "Prognostic factors and survival in parathyroid carcinoma: a 50-year single-center cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease recurrence occurred in 16 (53.3%) cases, with disease persistence in three (10.0%)."
    explanation: >-
      Quantifies recurrence and persistence in a long-running cohort, which is the
      course this phase records.
animal_models:
- name: Cdc73 conventional and parathyroid-specific knockout mouse
  species: Mouse
  genotype: Cdc73+/-, Cdc73+/L/PTH-Cre and Cdc73L/L/PTH-Cre
  publication: PMID:28288139
  description: >-
    Conventional and parathyroid-specific Cdc73 knockout mice, aged to 18-21 months,
    generated as models of the hyperparathyroidism-jaw tumour syndrome.
  modeled_mechanisms:
  - target: Autonomous Chief Cell Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces Cdc73-driven parathyroid proliferation with raised serum calcium
      and PTH, which is the proximal mechanism this entry asserts.
    limitations: >-
      The tumours that develop are described as consistent with atypical parathyroid
      adenomas, not carcinoma, so the model captures the proliferative and hormonal
      arm of the mechanism and not the invasive behaviour that defines the human
      malignancy. It is a model of the germline HPT-JT lesion rather than of
      sporadic somatic disease, and the mice develop uterine neoplasms that are not
      part of this entry.
    evidence:
    - reference: PMID:28288139
      reference_title: "Mice deleted for cell division cycle 73 gene develop parathyroid and uterine tumours: model for the hyperparathyroidism-jaw tumour syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cdc73+/-, Cdc73+/L/PTH-Cre and Cdc73L/L/PTH-Cre mice developed parathyroid tumours, which had nuclear pleomorphism, fibrous septation and increased galectin-3 expression, consistent with atypical parathyroid adenomas, from 9 months of age."
      explanation: >-
        States both what the model reproduces and, in the same sentence, the ceiling
        on its fidelity: the lesions are atypical adenomas rather than carcinoma.
histopathology:
- name: Invasive growth patterns
  description: >-
    The diagnostic findings are patterns of invasion - capsular, vascular and
    perineural - rather than cytological features, which is why the diagnosis is
    made on the resected specimen and why complete submission matters.
  evidence:
  - reference: PMID:42577903
    reference_title: Critical Insights into Parathyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Definitive diagnosis relies on histopathologic features such as capsular, vascular, or perineural invasion."
    explanation: >-
      States the histopathological basis of diagnosis, which the WHO criteria in
      the diagnosis section enumerate.
- name: Adenocarcinoma, not otherwise specified
  description: >-
    Essentially all registry-coded cases are adenocarcinoma NOS, so morphological
    subtyping plays no practical role in this disease.
  evidence:
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "607 (99.7%) cases were adenocarcinoma not otherwise specified (NOS)"
    explanation: >-
      Registry morphology distribution, which is why no histological subtypes are
      curated.
treatments:
- name: En Bloc Surgical Resection
  description: >-
    Complete resection at the first operation is the only treatment with curative
    intent, which is why early recognition matters: the diagnosis is usually made
    on the specimen, so the decision to operate adequately precedes it.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: en bloc resection of the parathyroid tumour
    term:
      id: NCIT:C139567
      label: En Bloc Resection
  target_mechanisms:
  - target: Local Invasive Growth
    description: Removes the invasive tumour and its local extension.
  evidence:
  - reference: PMID:42694707
    reference_title: "Parathyroid carcinoma: epidemiology and genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "PC is mostly characterized by severe hypercalcaemia, due to tumoral parathyroid hormone (PTH) over-secretion and a high rate of local recurrence and metastasis, making early diagnosis and surgical treatment crucial."
    explanation: >-
      Supporting context on the importance of early surgery. Graded INDIRECT because
      the sentence says nothing about extent of resection or curative intent, which
      the next item carries directly.
  - reference: PMID:41878704
    reference_title: Treating microsatellite unstable metastatic parathyroid carcinoma with anti-PD1 therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete resection of malignancy is the only curative treatment, and to date, there is no effective systemic therapy for advanced disease."
    explanation: >-
      Sources the claim this entry's description makes, that resection is the only
      treatment with curative intent, and in the same sentence the absence of
      effective systemic therapy.
- name: Calcimimetic Control of Hypercalcaemia
  description: >-
    Cinacalcet increases the sensitivity of the calcium-sensing receptor and is used
    to control the hypercalcaemia rather than to treat the tumour. This is the
    characteristic shape of medical therapy in this disease: directed at the
    hormonal consequence, not at the malignancy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: calcimimetic therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cinacalcet
      term:
        id: CHEBI:48390
        label: cinacalcet
  target_mechanisms:
  - target: Hypercalcemia
    description: >-
      Acts on the calcium-sensing receptor to lower serum calcium, downstream of
      the PTH output rather than on the tumour.
  - target: Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors
    treatment_effect: ACTIVATES
    description: >-
      Cinacalcet acts as a positive allosteric modulator at the calcium-sensing receptor still expressed by the malignant parathyroid tissue, which is the receptor-level action this node represents.
    evidence:
    - reference: PMID:29680147
      reference_title: "Discovery and Development of Calcimimetic and Calcilytic Compounds."
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: Calcimimetics are agonists or positive allosteric modulators of the CaR
      explanation: Establishes that this drug class acts as a positive allosteric modulator
        at the receptor this node represents.
  evidence:
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are effective in reducing serum calcium levels by at least 1 mg/dl in 62% of patients with PC"
    explanation: >-
      Quantifies the calcium-lowering effect of calcimimetic therapy in this disease.
  - reference: PMID:30641523
    reference_title: Parathyroid Carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the tumor is no more resectable, medical treatment of hypercalcemia has a pivotal role in the management of these patients."
    explanation: >-
      Establishes the role of medical therapy as control of the hypercalcaemia once
      resection is no longer possible, which is the framing this treatment takes.
  review_notes: >-
    The deep-research report's bindings for this drug class were wrong - it gave
    NCIT:C65509 for "Cinacalcet Hydrochloride", which is Eletriptan, and
    NCIT:C65214 for "Denosumab", which is Acotiamide - so none of its treatment
    section was used. The bindings here were resolved against OLS instead.
- name: Intravenous Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates lower serum calcium by inhibiting mobilisation of
    calcium from bone. Zoledronate is reported as the more effective agent in the
    hypercalcaemia of this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiresorptive therapy for hypercalcaemia
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Hypercalcemia
    description: >-
      Blocks the skeletal release of calcium that the PTH excess drives, acting on
      the consequence rather than on the tumour.
  evidence:
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intravenous bisphosphonates, including zolendronate and pamidronate, are effective in treating hypercalcemia by inhibiting the mobilization of calcium from the bone into the circulation."
    explanation: >-
      States the effect and the mechanism by which it acts on the hypercalcaemia.
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Zoledronate is more effective than other IV bisphosphonates in hypercalcemia associated with PC"
    explanation: >-
      Agent-level comparison specific to this disease, which is why zoledronic acid
      is the bound agent.
- name: Denosumab
  description: >-
    An anti-RANKL monoclonal antibody used for hypercalcaemia refractory to other
    measures, acting by blocking osteoclast formation, function and survival.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: antiresorptive therapy for refractory hypercalcaemia
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: denosumab
      term:
        id: NCIT:C61313
        label: Denosumab
  target_mechanisms:
  - target: Hypercalcemia
    description: >-
      Blocks osteoclast-mediated bone resorption, lowering serum calcium.
  evidence:
  - reference: PMID:35326576
    reference_title: "Parathyroid Carcinoma: Incidence, Survival Analysis, and Management: A Study from the SEER Database and Insights into Future Therapeutic Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "has been used to treat refractory hypercalcemia associated with PC"
    explanation: >-
      Establishes the indication in this disease, specifically for refractory
      hypercalcaemia.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline and somatic mutations in the tumour suppressor gene CDC73 (encoding parafibromin) are implicated in up to 75% of familial and sporadic PC cases."
    explanation: Frequency and dual germline/somatic character of the lesion.
  - reference: PMID:42694707

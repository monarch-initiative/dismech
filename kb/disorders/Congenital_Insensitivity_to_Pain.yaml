name: Congenital Insensitivity to Pain
creation_date: "2026-04-16T19:22:23Z"
category: Mendelian
synonyms:
- CIP
- congenital analgesia
- congenital painlessness
description: >-
  Congenital insensitivity to pain (CIP) is curated here as a phenotype-grouping
  and navigation entry for rare Mendelian disorders with lifelong absence of
  protective pain perception from birth. The grouped disorders fall into three
  broad mechanism classes: developmental nociceptor disorders involving PRDM12
  and the NGF-TRKA axis, nociceptor channelopathies involving SCN9A and SCN11A,
  and transcriptional deregulation within surviving nociceptors in the autosomal
  dominant ZFHX2 (Marsili) type, where there is no peripheral neuropathy at all.
  This page intentionally captures only the shared phenotype frame,
  high-value distinguishing features, and a minimal connected pathograph rather
  than asserting a single fully unified disease mechanism.
disease_term:
  preferred_term: congenital insensitivity to pain
  term:
    id: MONDO:1060232
    label: congenital insensitivity to pain
mappings:
  mondo_mappings:
  - term:
      id: MONDO:1060232
      label: congenital insensitivity to pain
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier for this entry. MONDO defines the term as "A rare
      hereditary sensory and autonomic neuropathy characterized by the inability
      to perceive physical pain from birth", which is exactly this entry's scope.
      Its gene-bearing children are the five subtypes this entry already curated
      (NTRK1, NGF, SCN9A, SCN11A, PRDM12) together with the ZFHX2 Marsili type
      added in the same pass.
  - term:
      id: MONDO:0015364
      label: hereditary sensory and autonomic neuropathy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      The previous `disease_term` binding of this entry, retained as a broader
      cross-reference. It is the MONDO parent of the exact term above and
      subsumes the sensory and autonomic neuropathies that are not congenital
      insensitivity to pain, which this entry does not cover.
notes: >-
  GeneReviews baseline: two chapters cover this entry's scope and are now listed
  in `references:` - the `Congenital Insensitivity to Pain Overview`
  (PMID:29419974), which matches this entry's name exactly, and
  `NTRK1 Congenital Insensitivity to Pain with Anhidrosis` (PMID:20301726) for
  the HSAN IV branch. Neither is quoted as evidence: only their abstracts are
  cached, and the overview's abstract is a statement of the chapter's purpose
  rather than a finding, so there is no propositional sentence in the cached
  text to quote. They are recorded as the baseline this entry should be mined
  against when full text becomes available.

  MONDO anchor. An earlier revision of this entry recorded that no MONDO term
  for "congenital insensitivity to pain" existed and anchored to the broader
  hereditary sensory and autonomic neuropathy parent instead. That is no longer
  the case: `runoak -i ols:mondo search 'congenital insensitivity to pain'`
  returns `MONDO:1060232 congenital insensitivity to pain` as its first hit, and
  `MONDO:1060232` is now this entry's `disease_term`. The previous anchor
  `MONDO:0015364` is kept as a `skos:broadMatch` cross-reference. Subtype-specific
  mechanistic and management detail should still ultimately live in dedicated
  child entries.

  Series completeness under the exact term. `MONDO:1060232` has eight
  hierarchical descendants. Six are curated here as `has_subtypes` rows:
  `MONDO:0009746` (HSAN IV, NTRK1), `MONDO:0012092` (HSAN V, NGF),
  `MONDO:0009459` (SCN9A channelopathy-associated CIP), `MONDO:0014244`
  (HSAN VII, SCN11A), `MONDO:0014662` (CIP-hypohidrosis, PRDM12) and
  `MONDO:0958106` (Marsili type, ZFHX2). The remaining two carry no causal gene
  in MONDO and are not curated: `MONDO:0016319` congenital insensitivity to pain
  with hyperhidrosis and `MONDO:0018682` congenital insensitivity to pain with
  severe intellectual disability. Each is named after an additional clinical
  feature rather than a gene, and each is xrefed only to Orphanet and MedGen with
  no OMIM entry, so there is no gene for this pass to wire; they are recorded
  here so the gap is visible rather than silent.

  Genes moved out by the re-anchoring. The previous broad anchor pulled in a
  RETREG1 `genetic:` record whose own notes said it should move rather than be
  duplicated if this entry were ever re-anchored on a true
  congenital-insensitivity-to-pain class. RETREG1 is the HSAN2B gene and is
  already curated at the right granularity as an HSAN2B `has_subtypes` row with
  its own `genetic:` record on Hereditary Sensory and Autonomic Neuropathy Type 2,
  so the record here has been removed rather than rewritten. The ClinGen
  assertion it carried is made against `MONDO:0015364`, which is now only a
  `skos:broadMatch` cross-reference on this entry.

  Diseases the previous broad anchor also reached, and why they are not curated
  here. Cold-induced sweating syndrome 1 (`MONDO:0010091`, CRLF1) and 2
  (`MONDO:0012467`, CLCF1), PERCHING syndrome (`MONDO:0014890`, KLHL7),
  hereditary sensory and autonomic neuropathy type 1A (`MONDO:0008086`, SPTLC1)
  and hereditary sensory neuropathy type 1F (`MONDO:0014286`, ATL3) are all
  hierarchical descendants of `MONDO:0015364`; none is a descendant of
  `MONDO:1060232`, and none is congenital insensitivity to pain. MONDO files the
  first three under `MONDO:0015526 cold-induced sweating syndrome`, and defines
  CISS1 as "a severe disorder characterized by muscular contractions at birth,
  intermittent hyperthermia, facial abnormalities and camptodactyly" — a
  phenotype that does not include absence of pain. PERCHING is a multisystem
  KLHL7 syndrome whose MONDO definition enumerates postural, palatal, ocular,
  respiratory, contractural, growth and feeding features, and it has an open
  stub (`stubs/PERCHING_Syndrome.yaml`) rather than a home here; MONDO's placement
  of it under cold-induced sweating syndrome is itself worth checking upstream.
  HSAN1A and HSN1F both sit under `MONDO:0018213 hereditary sensory and autonomic
  neuropathy type 1`, a separate series this KB curates in its own entries:
  HSAN1A is already curated as Hereditary Sensory and Autonomic Neuropathy
  Type 1A on `MONDO:0008086`, and HSN1F belongs beside the other HSN1 atlastin
  form, Hereditary Sensory Neuropathy Type 1D (ATL1).
review_notes: >-
  This revision intentionally hard-trims the prior umbrella into a navigation
  entry: the shared phenotype frame is retained, the pathophysiology nodes are
  now atomic and connected, and subtype-specific distinguishing findings are
  captured without pretending that all grouped branches constitute one cleanly
  unified disease entity.

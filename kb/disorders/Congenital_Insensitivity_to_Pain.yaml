- name: ZFHX2
  gene_term:
    preferred_term: ZFHX2
    term:
      id: hgnc:20152
      label: ZFHX2
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: Marsili type
  notes: >-
    Zinc finger homeobox 2, a transcriptional regulator expressed in small
    diameter sensory neurons. A single heterozygous missense variant changing a
    conserved arginine within a homeodomain segregates with pain insensitivity in
    the reported family; mice carrying the orthologous change and Zfhx2 null mice
    both show pain-sensitivity deficits. The human evidence is one family, so this
    record rests on segregation plus two mouse models rather than on independent
    human replication.
  evidence:
  - reference: PMID:29253101
    reference_title: A novel human pain insensitivity disorder caused by a point mutation in ZFHX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel point mutation in ZFHX2, encoding a putative transcription factor expressed in small diameter sensory neurons, was identified by whole exome sequencing that segregates with the pain insensitivity."
    explanation: >-
      The human genetic evidence: a ZFHX2 point mutation segregating with the
      pain-insensitive phenotype, in a gene expressed in small diameter sensory
      neurons.
  - reference: PMID:29253101
    reference_title: A novel human pain insensitivity disorder caused by a point mutation in ZFHX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation is predicted to change an evolutionarily highly conserved arginine residue 1913 to a lysine within a homeodomain."
    explanation: >-
      Identifies the variant as a homeodomain arginine substitution, the basis for
      treating it as a change in ZFHX2's transcriptional function.
  - reference: PMID:29253101
    reference_title: A novel human pain insensitivity disorder caused by a point mutation in ZFHX2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Bacterial artificial chromosome (BAC) transgenic mice bearing the orthologous murine p.R1907K mutation, as well as Zfhx2 null mutant mice, have significant deficits in pain sensitivity."
    explanation: >-
      Two independent mouse genotypes reproduce the pain-sensitivity deficit,
      which is the non-human support this single-family association rests on.
pathophysiology:
- name: Impaired nociceptor specification
  description: >-
    PRDM12-related CIP begins as a developmental failure to impose nociceptor
    identity and precursor differentiation.

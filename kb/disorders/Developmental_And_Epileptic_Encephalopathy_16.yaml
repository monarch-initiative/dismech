  - name: Postnatal Micro-Exon Isoform Switch
    description: >-
      A striking, and so far mouse-only, explanation for why DEE16 seizures begin
      after birth rather than in utero. The S324Tfs*3 truncating variant sits in
      an alternatively spliced micro-exon that is only incorporated into TBC1D24
      postnatally. Before that developmental splicing switch, homozygous mutant
      mice make predominantly the shorter wild-type isoform that omits the
      micro-exon and are unaffected; seizures begin abruptly at postnatal day 15,
      exactly when the switch occurs. Whether this timing mechanism generalizes
      to human DEE16 variants outside the micro-exon is unknown.
    biological_scale: MOLECULAR
    cell_types:
      - preferred_term: Neuron
        term:
          id: CL:0000540
          label: neuron
    evidence:
      - reference: PMID:30602030
        reference_title: "The phenotypic landscape of a Tbc1d24 mutant mouse includes convulsive seizures resembling human early infantile epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "S324Tfs*3 homozygotes show an abrupt onset of seizures at P15 that \ncorrelates with a developmental switch to utilization of the micro-exon."
        explanation: >-
          Ties seizure onset timing to the postnatal micro-exon splicing switch,
          the claim this node makes.
      - reference: PMID:30602030
        reference_title: "The phenotypic landscape of a Tbc1d24 mutant mouse includes convulsive seizures resembling human early infantile epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "During \nembryonic and early postnatal development, S324Tfs*3 homozygotes produce \npredominantly the shorter wild-type TBC1D24 protein isoform that omits the \nmicro-exon."
        explanation: >-
          Explains the pre-switch reprieve: the mutant allele produces functional
          protein until the micro-exon is used.
    downstream:
      - target: Neuronal Hyperexcitability and Hypersynchrony
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: >-
          Once the micro-exon is incorporated, functional TBC1D24 is lost and
          seizures begin.
        intermediate_mechanisms:
          - loss of functional TBC1D24 protein

  - name: Postsynaptic Dendritic Spine Loss
    description: >-
      TBC1D24 is not only presynaptic. It is also present at the postsynaptic
      side of excitatory synapses, where inhibiting ARF6 is what maintains
      dendritic spines. Knocking it down in adult mouse hippocampus causes spine
      loss with contextual fear memory deficits, hyperactivity, and increased
      anxiety, and a knock-in of the disease-associated F251L substitution
      produces increased neuronal excitability, spontaneous seizures, and
      premature death in homozygotes. This arm matters because it makes the
      cognitive impairment of DEE16 partly independent of the seizures rather
      than purely their consequence.
    biological_scale: CELLULAR
    cell_types:
      - preferred_term: Hippocampal excitatory neuron
        term:
          id: CL:0000540
          label: neuron
    cellular_components:
      - preferred_term: Dendritic spine
        term:
          id: GO:0043197
          label: dendritic spine
    evidence:
      - reference: PMID:32004315
        reference_title: "The epilepsy and intellectual disability-associated protein TBC1D24 regulates the maintenance of excitatory synapses and animal behaviors."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we report that TBC1D24 is present at the postsynaptic sites of excitatory synapses, where it is required for the maintenance of dendritic spines through inhibition of the small GTPase ARF6"
        explanation: >-
          Establishes the postsynaptic localization and the ARF6-dependent spine
          maintenance function this node describes.
      - reference: PMID:32004315
        reference_title: "The epilepsy and intellectual disability-associated protein TBC1D24 regulates the maintenance of excitatory synapses and animal behaviors."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice subjected to viral-mediated knockdown of TBC1D24 in the adult hippocampus display dendritic spine loss, deficits in contextual fear memory, as well as abnormal behaviors including hyperactivity and increased anxiety."
        explanation: >-
          Measures the spine loss and its behavioural consequences after
          TBC1D24 knockdown.
    downstream:
      - target: Aberrant Cortical Circuit Formation
        causal_link_type: DIRECT
      - target: Neuronal Hyperexcitability and Hypersynchrony
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
          - excitatory synapse loss
        evidence:
          - reference: PMID:32004315
            reference_title: "The epilepsy and intellectual disability-associated protein TBC1D24 regulates the maintenance of excitatory synapses and animal behaviors."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "We further generate the F251L knock-in mice, and the homozygous mutants show increased neuronal excitability, spontaneous seizure and pre-mature death."
            explanation: >-
              A disease-associated allele acting through this postsynaptic
              function produces the hyperexcitability this edge asserts.

  - name: Aberrant Cortical Circuit Formation
    description: >-
      The combined migration, maturation, and axon-specification defects yield a
      neocortex whose circuitry never assembled correctly. This is the substrate
      on which the presynaptic release defect acts, and it accounts for the
      developmental impairment being present from the outset rather than being
      purely a consequence of seizures.
    biological_scale: TISSUE
    locations:
      - preferred_term: Cerebral cortex
        term:
          id: UBERON:0000956
          label: cerebral cortex
    evidence:
      - reference: PMID:23526554
        reference_title: "Novel compound heterozygous mutations in TBC1D24 cause familial malignant migrating partial seizures of infancy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Mutations severely impaired TBC1D24 expression and function, which is critical for maturation of neuronal circuits."
        explanation: >-
          States that the DEE16-causing variants impair a function required for
          neuronal circuit maturation.
    downstream:
      - target: Neuronal Hyperexcitability and Hypersynchrony
        causal_link_type: DIRECT
      - target: Global developmental delay
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
          - malformed cortical circuitry
        evidence:
          - reference: PMID:35350397
            reference_title: "Synaptopathies in Developmental and Epileptic Encephalopathies: A Focus on Pre-synaptic Dysfunction."
            supports: SUPPORT
            evidence_source: OTHER
            snippet: "In those patients presenting with pre-existing DD, the effect of the epileptic activity causes a worsening of the developmental consequences arising directly from the genetic mutation"
            explanation: >-
              States the two-source model of developmental impairment in DEE that
              this edge and the entry as a whole assert: the genetic lesion
              impairs development directly, and seizures compound it.
      - target: Developmental regression
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
          - malformed cortical circuitry
          - recurrent seizures

  - name: Neuronal Hyperexcitability and Hypersynchrony
    description: >-
      Excitation and inhibition are pushed out of balance by the combination of a
      malformed cortical network and unstable presynaptic release, producing
      hypersynchronous discharges. In DEE16 these discharges characteristically
      fail to stay put: they migrate from one cortical region to another, giving
      the prolonged unilateral clonic activity that wanders between arm, leg, and
      face, and the ictal pattern of epilepsy of infancy with migrating focal
      seizures.
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    locations:
      - preferred_term: Cerebral cortex
        term:
          id: UBERON:0000956
          label: cerebral cortex
    biological_processes:
      - preferred_term: modulation of chemical synaptic transmission
        term:
          id: GO:0050804
          label: modulation of chemical synaptic transmission
        modifier: ABNORMAL
    evidence:
      - reference: PMID:20727515
        reference_title: "TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "unveiled the involvement of ARF6-dependent molecular pathway in brain hyperexcitability and seizures"
        explanation: >-
          Connects the TBC1D24-ARF6 axis to brain hyperexcitability, the state
          this node describes.
    downstream:
      - target: Migrating focal seizures
        causal_link_type: DIRECT

        causal_link_type: DIRECT
      - target: Cerebellar atrophy
        causal_link_type: DIRECT
      - target: Delayed myelination
        causal_link_type: DIRECT

phenotypes:
  - name: Migrating focal seizures
    category: Neurological
    description: >-
      The defining electroclinical signature of the severe TBC1D24 phenotype:
      focal seizures whose ictal discharge migrates from one cortical region to
      another, historically called malignant migrating partial seizures of
      infancy (MMPSI) and now epilepsy of infancy with migrating focal seizures
      (EIMFS).
    phenotype_term:
      preferred_term: Migrating focal seizure
      term:
        id: HP:0032786
        label: Migrating focal seizure
    evidence:
      - reference: PMID:25719194
        reference_title: "TBC1D24-Related Disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "developmental and epileptic encephalopathy (DEE), including epilepsy of infancy \nwith migrating focal seizures (EIMFS)"
        explanation: >-
          GeneReviews places EIMFS within the DEE phenotype of the TBC1D24
          spectrum.
      - reference: PMID:23526554
        reference_title: "Novel compound heterozygous mutations in TBC1D24 cause familial malignant migrating partial seizures of infancy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Here, we describe a familial form of MMPSI due to mutation in TBC1D24, revealing a devastating epileptic phenotype associated with TBC1D24 dysfunction."
        explanation: >-
          The index report establishing the migrating-seizure phenotype as
          TBC1D24-caused.

  - name: Focal clonic seizures
    category: Neurological
    description: >-
      Prolonged unilateral clonic activity of an arm, leg, or face, often lasting
      far beyond an ordinary seizure and shifting body part as the discharge
      migrates.
    phenotype_term:
      preferred_term: Focal clonic seizure
      term:
        id: HP:0002266
        label: Focal clonic seizure
    evidence:
      - reference: PMID:27502353
        reference_title: "Electroclinical phenotypes and outcomes in TBC1D24-related epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "All patients had seizure semiologies consisting of prolonged, unilateral, focal clonic activity of the arm, leg or face, in addition to generalized clonic or myoclonic seizures."
        explanation: >-
          Describes the focal clonic semiology in all four patients of the
          TBC1D24 drug-resistant epilepsy series.

  - name: Myoclonic seizures
    category: Neurological
    description: >-
      Myoclonic or clonic seizures are the commonest seizure type across the
      TBC1D24 spectrum and occur in DEE16 alongside the focal seizures, often in
      prolonged clusters and often unresponsive to medication.
    phenotype_term:
      preferred_term: Myoclonic seizure
      term:
        id: HP:0032794
        label: Myoclonic seizure
    frequency: FREQUENT
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Myoclonic or clonic seizures were the most frequent seizure types (29/48, 60%), often unresponsive to medication."
        explanation: >-
          Quantifies myoclonic/clonic seizures at 60% of the 48-patient TBC1D24
          cohort, supporting FREQUENT.

  - name: Epilepsia partialis continua
    category: Neurological
    description: >-
      Continuous focal motor seizure activity, recorded as an ictal EEG pattern in
      TBC1D24-related drug-resistant epilepsy.
    phenotype_term:
      preferred_term: Epilepsia partialis continua
      term:
        id: HP:0012847
        label: Epilepsia partialis continua
    evidence:
      - reference: PMID:27502353
        reference_title: "Electroclinical phenotypes and outcomes in TBC1D24-related epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Ictal EEG characteristics included epilepsia partialis continua, epilepsy of infancy with migrating focal seizures, and other focal seizures with indiscrete interictal-ictal transitions."
        explanation: >-
          Lists epilepsia partialis continua among the ictal EEG patterns in the
          TBC1D24 series.

  - name: Super-refractory status epilepticus
    category: Neurological
    description: >-
      Status epilepticus that continues or recurs despite 24 hours of anaesthesia.
      Prolonged seizures or status of some kind occur in the large majority of
      patients across the TBC1D24 spectrum, and are frequently precipitated by
      fever or intercurrent infection.
    phenotype_term:
      preferred_term: Super-refractory status epilepticus
      term:
        id: HP:0032868
        label: Super-refractory status epilepticus
    evidence:
      - reference: PMID:27502353
        reference_title: "Electroclinical phenotypes and outcomes in TBC1D24-related epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Two seemingly unrelated Navajo patients with identical variations experienced super-refractory status epilepticus at 9 months of age, with one achieving resolution with ketogenic diet therapy."
        explanation: >-
          Documents super-refractory status epilepticus in TBC1D24-related
          epilepsy, including its response to ketogenic diet in one patient.
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Thirty-eight (79%) individuals had had status epilepticus, either convulsive or nonconvulsive, or prolonged seizures (>5 minutes). In 19 patients, seizures or status episodes were precipitated by fever or infections."
        explanation: >-
          Quantifies status epilepticus across the cohort and identifies fever and
          infection as precipitants.

  - name: Infantile spasms
    category: Neurological
    description: >-
      Epileptic spasms occur within the wide seizure repertoire of the TBC1D24
      spectrum, alongside the focal and myoclonic types that dominate.
    phenotype_term:
      preferred_term: Infantile spasms
      term:
        id: HP:0012469
        label: Infantile spasms
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Seizure types included infantile spasms and febrile convulsive, myoclonic, clonic, tonic, absence, tonic-clonic with or without apparent focal onset, and focal seizures with retained or impaired awareness."
        explanation: >-
          Lists infantile spasms among the seizure types observed in the
          TBC1D24 cohort.

  - name: Febrile seizures
    category: Neurological
    description: >-
      Fever and intercurrent infection are the commonest precipitants of seizures
      and status in this gene. Other reported triggers are unusually varied for an
      epilepsy - fatigue, drowsiness, acoustic or light stimulation, repetitive
      movement, feeding, constipation, and a delayed medication dose - which is
      consistent with an activity-dependent presynaptic lesion rather than a
      fixed structural focus.
    phenotype_term:
      preferred_term: Febrile seizure (within the age range of 3 months to 6 years)
      term:
        id: HP:0002373
        label: Febrile seizure (within the age range of 3 months to 6 years)
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In 19 patients, seizures or status episodes were precipitated by fever or infections."
        explanation: >-
          Quantifies fever and infection as seizure precipitants in 19 of the 48
          patients.
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In some patients, they were triggered by fatigue, drowsiness, intense and persistent stimulation (acoustic stimuli or variations in light intensity), repetitive movements, feeding, febrile episodes, constipation, or delayed medication."
        explanation: >-
          Enumerates the broader set of activity- and state-dependent triggers
          described in this phenotype.

  - name: Drug-resistant epilepsy
    category: Neurological
    description: >-
      Seizures fail to come under control with adequate trials of appropriate
      antiseizure medications. Drug resistance is the norm in the DEE16 end of
      the spectrum and is what distinguishes it from the drug-responsive
      TBC1D24 phenotypes.
    phenotype_term:
      preferred_term: Seizure
      term:
        id: HP:0001250
        label: Seizure
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "At least one such mutation occurred in 17 patients. Of these, 15 had drug-resistant epilepsy and 8 of them died by the age of 7 years."
        explanation: >-
          In the loss-of-function subgroup that corresponds to DEE16, 15 of 17
          patients had drug-resistant epilepsy, supporting VERY_FREQUENT.
      - reference: PMID:27502353
        reference_title: "Electroclinical phenotypes and outcomes in TBC1D24-related epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We report four patients with novel variants of TBC1D24 demonstrating drug-resistant focal epilepsy, developmental delays, and head growth deceleration."
        explanation: >-
          Independent series reporting drug-resistant focal epilepsy in
          TBC1D24-related disease.

  - name: Multifocal epileptiform EEG abnormality
    category: Neurological
    description: >-
      Interictal EEG shows background slowing with multifocal paroxysmal
      abnormalities, consistent with the multifocal cortical origin of the
      migrating seizures.
    phenotype_term:
      preferred_term: Multifocal epileptiform discharges
      term:
        id: HP:0010841
        label: Multifocal epileptiform discharges
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Various features, including slow background activity and multifocal paroxysmal abnormalities, were described in 35 patients."
        explanation: >-
          Documents multifocal paroxysmal EEG abnormalities in 35 of the 48
          patients.

  - name: Global developmental delay
    category: Neurological
    description: >-
      Development is delayed from the outset in DEE16 rather than being lost only
      after seizures begin, reflecting the prenatal migration and axon-formation
      defect. Severity across the TBC1D24 spectrum ranges from mild to profound;
      the DEE16 end is at the severe extreme.
    phenotype_term:
      preferred_term: Global developmental delay
      term:
        id: HP:0001263
        label: Global developmental delay
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Thirty-nine individuals had intellectual disability or developmental delay, from mild to profound."
        explanation: >-
          39 of 48 patients had intellectual disability or developmental delay,
          supporting VERY_FREQUENT.
      - reference: PMID:27502353
        reference_title: "Electroclinical phenotypes and outcomes in TBC1D24-related epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Our series suggests that TBC1D24-related epilepsy can manifest with hypotonia, developmental delays, and a variety of focal-onset seizures prone to electroclinical dissociation."
        explanation: >-
          Independent series reporting developmental delay with the focal-onset
          seizure phenotype.

  - name: Developmental regression
    category: Neurological
    description: >-
      Loss of previously acquired milestones. The MONDO concept definition for
      DEE16 names delayed or regressed psychomotor development as a defining
      feature alongside early seizure onset.
    phenotype_term:
      preferred_term: Developmental regression
      term:
        id: HP:0002376
        label: Developmental regression
    evidence:
      - reference: PMID:23526554
        reference_title: "Novel compound heterozygous mutations in TBC1D24 cause familial malignant migrating partial seizures of infancy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Early-onset epileptic encephalopathies (EOEEs) are a group of rare devastating epileptic syndromes of infancy characterized by severe drug-resistant seizures and electroencephalographic abnormalities."
        explanation: >-
          Frames the syndrome class DEE16 belongs to. Note this snippet supports
          the encephalopathy framing rather than regression specifically; the
          regression claim rests on the MONDO concept definition, which is not a
          citable reference.
    notes: >-
      Regression is asserted by the MONDO definition of MONDO:0014133 ("delayed
      or regression of psychomotor development") but is not separately quantified
      in the cohort literature cached here. Left as an unquantified phenotype
      rather than assigned a frequency.

  - name: Hypotonia
    category: Neurological
    description: >-
      Muscle hypotonia is the most frequent neurologic sign across the TBC1D24
      spectrum.
    phenotype_term:
      preferred_term: Hypotonia
      term:
        id: HP:0001252
        label: Hypotonia
    frequency: FREQUENT
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The most frequent neurologic sign was muscle hypotonia."
        explanation: >-
          Identifies hypotonia as the commonest neurologic sign in the 48-patient
          cohort.
      - reference: PMID:27502353
        reference_title: "Electroclinical phenotypes and outcomes in TBC1D24-related epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "TBC1D24-related epilepsy can manifest with hypotonia, developmental delays, and a variety of focal-onset seizures"
        explanation: >-
          Independent confirmation of hypotonia in the TBC1D24 epilepsy
          phenotype.

  - name: Progressive microcephaly
    category: Neurological
    description: >-
      Head growth decelerates after birth rather than the head being small at
      birth, consistent with a postnatal failure of brain growth rather than a
      primary microcephaly.
    phenotype_term:
      preferred_term: Progressive microcephaly
      term:
        id: HP:0000253
        label: Progressive microcephaly
    evidence:

name: Developmental And Epileptic Encephalopathy 16
creation_date: "2026-09-07T00:00:00Z"
category: Mendelian
description: >-
  The severe end of the TBC1D24 spectrum. A baby with biallelic loss-of-function
  variants in TBC1D24 begins seizing in the first weeks or months of life, often
  with prolonged unilateral clonic activity that wanders from one body part to
  another as the discharge migrates across the cortex, the picture that used to be
  called malignant migrating partial seizures of infancy and is now epilepsy of
  infancy with migrating focal seizures. The seizures do not respond to drugs,
  status epilepticus is the rule rather than the exception, development stalls or
  regresses, and a substantial minority of children die in early childhood.

  What makes the entry interesting is that the same gene also causes a
  self-limiting infantile myoclonic epilepsy in people with normal intelligence,
  and non-syndromic deafness with no epilepsy at all. TBC1D24 is a presynaptic
  protein with two functional halves: a TBC domain whose phosphoinositide-binding
  pocket anchors it to the presynaptic membrane and regulates ARF6-dependent
  vesicle traffic, and a TLDc domain that confers resistance to oxidative
  stress. Truncating variants, which abolish both, sit at the severe end
  where DEE16 lives; the correlation is real but loose, and neurite-outgrowth
  assays show the variants causing the worst disease are not always the ones that
  disrupt the protein most in a dish. The disorder is therefore both a
  synaptopathy and a neurodevelopmental one: the same trafficking lesion that
  destabilizes mature neurotransmission also derails radial migration and axon
  specification before birth.
parents:
  - Genetic Developmental and Epileptic Encephalopathy
  - Epilepsy
  - Neurodevelopmental Disorder

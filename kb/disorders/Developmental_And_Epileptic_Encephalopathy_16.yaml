discussions:
  - discussion_id: dee16_genotype_phenotype_discordance
    kind: KNOWLEDGE_GAP
    prompt: >-
      Why does the same TBC1D24 loss-of-function lesion produce a devastating
      early-infantile encephalopathy in one family and a self-limiting myoclonic
      epilepsy with normal intellect in another?
    attaches_to:
      - pathophysiology#Biallelic TBC1D24 Loss of Function
      - genetic#TBC1D24
    rationale: >-
      Truncating variants correlate with the severe end, but the correlation is
      loose and does not run through the obvious mechanism. Neurite-outgrowth
      assays found that the variants causing the most severe clinical disease are
      not the ones that most disrupt the protein in culture, so residual protein
      function measured that way does not explain the phenotypic split. Something
      else - domain-specific effects, isoform usage, modifiers, or an assay that
      does not capture the relevant function - is doing the work. Until it is
      identified, DEE16 cannot be predicted from genotype at the bedside.

  - discussion_id: dee16_microexon_switch_human_validity
    kind: HUMAN_MODEL_MISMATCH
    prompt: >-
      Does the postnatal micro-exon splicing switch that times seizure onset in
      the S324Tfs*3 mouse operate in human DEE16, including in patients whose
      variants lie outside that micro-exon?
    attaches_to:
      - pathophysiology#Postnatal Micro-Exon Isoform Switch
      - animal_models#Mouse
    rationale: >-
      The mouse gives an unusually clean mechanistic account of why seizures
      start when they do: before the developmental splicing switch the mutant
      allele still yields functional protein. But the account is allele-specific
      by construction, since it depends on the variant sitting inside the
      micro-exon. Human DEE16 variants are distributed across the coding
      sequence, and no human neuronal system has been shown to undergo the same
      switch. So the model may be explaining the timing of one variant rather
      than the timing of the disease.
    proposed_experiments:
      - experiment_id: dee16_human_microexon_timecourse
        name: Micro-exon isoform quantification in human neurons across development
        description: >-
          Quantify micro-exon-containing versus micro-exon-skipping TBC1D24
          transcripts in human iPSC-derived cortical neurons across
          differentiation, and in post-mortem human cortex across the first year
          of life, to test whether the developmental switch occurs in humans.
        would_support:
          - pathophysiology#Postnatal Micro-Exon Isoform Switch
        supporting_outcome:
          - >-
            Micro-exon-containing transcripts rise sharply during a defined
            postnatal window in human neurons, mirroring the mouse P15 switch.
        refuting_outcome:
          - >-
            Micro-exon inclusion is constitutive or absent across human
            development, indicating the timing mechanism is mouse-specific.

  - discussion_id: dee16_tldc_oxidative_contribution
    kind: KNOWLEDGE_GAP
    prompt: >-
      Does loss of TLDc-domain oxidative stress protection contribute to the
      progressive atrophy in DEE16, or is the atrophy entirely accounted for by
      the developmental lesion and seizure-related injury?
    attaches_to:
      - pathophysiology#TLDc Domain Dysfunction
      - pathophysiology#Progressive Cerebral and Cerebellar Atrophy
    rationale: >-
      The question has moved but is not closed. Reading across from other TLDc
      proteins turned out to be unsafe: the V-ATPase regulation OXR1 and NCOA7
      perform was not reproduced for the TBC1D24 domain. The 2024 KIBRA
      interaction gives the domain a specific partner and a mechanism, and the
      humanized fly gives it a redox-sensor role with antioxidant rescue. But
      both results come from missense alleles, one of which causes a
      self-limiting Rolandic epilepsy, while DEE16 is enriched for truncating
      alleles that delete the domain outright. Nothing has measured oxidative
      injury or KIBRA-pathway disruption in DEE16 patient neurons or brain
      tissue. This matters practically: if oxidative injury contributes, it is
      the one arm of the mechanism with an obvious pharmacological handle, since
      the trafficking lesion is not currently druggable.
    proposed_experiments:
      - experiment_id: dee16_antioxidant_rescue_in_dee16_alleles
        name: Antioxidant rescue tested against DEE16 truncating alleles
        description: >-
          Repeat the N-acetylcysteine-amide and alpha-tocopherol rescue in
          patient-derived DEE16 neurons and in a model carrying a truncating
          allele, rather than the mild G501R missense allele, measuring synaptic
          vesicle trafficking and oxidative-stress markers.
        would_support:
          - pathophysiology#TLDc Domain Dysfunction
        supporting_outcome:
          - >-
            Antioxidant treatment restores vesicle trafficking in DEE16 neurons
            carrying truncating alleles, making the redox arm relevant to the
            severe phenotype and pointing at a treatable step.
        refuting_outcome:
          - >-
            No rescue in truncating-allele neurons, indicating the redox
            mechanism is specific to TLDc missense alleles and does not explain
            DEE16.

notes: >-
  Relationship to the other TBC1D24 entries in this knowledge base. DOORS
  syndrome, myoclonic epilepsy in infancy, DFNB93, and DFNA65 are separate
  entries for separate MONDO concepts in the same gene's spectrum; GeneReviews
  treats all of them as one continuum. DEE16 is kept separate because MONDO
  keeps it separate (MONDO:0014133, OMIM:615338) and because the phenotype
  distinctions are clinically load-bearing: drug resistance, early death, and
  the migrating focal seizure pattern do not occur at the mild end.

  A consequence of that continuum, and a caveat on every cohort figure in this
  entry: the large TBC1D24 series pool all epilepsy phenotypes, so frequencies
  quoted from PMID:27281533 describe the whole spectrum, not DEE16 alone. Where
  the paper reports a loss-of-function subgroup separately, that subgroup is
  cited instead, since it maps onto DEE16 much more closely than the full cohort
  does.

  Prevalence is deliberately absent. No population estimate exists for DEE16 as
  a distinct entity; the published denominators are TBC1D24 patient series
  ascertained through epilepsy gene panels, which cannot support a rate.

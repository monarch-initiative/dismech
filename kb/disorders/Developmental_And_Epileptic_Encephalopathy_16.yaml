        causal_link_type: DIRECT
      - target: Febrile seizures
        causal_link_type: DIRECT
      - target: Super-refractory status epilepticus
        causal_link_type: DIRECT
      - target: Multifocal epileptiform EEG abnormality
        causal_link_type: DIRECT
      - target: Death in childhood
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
          - refractory status epilepticus
          - respiratory failure and intercurrent infection

  - name: Progressive Cerebral and Cerebellar Atrophy
    description: >-
      Cerebral or cerebellar atrophy, delayed myelination, and in some patients
      hippocampal sclerosis develop over time. Whether this reflects the
      underlying neurodevelopmental lesion, cumulative seizure-related injury,
      loss of TLDc-dependent oxidative stress resistance, or all three is
      unresolved; the imaging findings did not correlate with phenotype or
      prognosis in the largest cohort.
    biological_scale: TISSUE
    locations:
      - preferred_term: Brain
        term:
          id: UBERON:0000955
          label: brain
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Neuroimaging revealed cerebral or cerebellar atrophy in 16 patients. Five patients had delayed myelination; 3 others had hippocampal sclerosis."
        explanation: >-
          Documents the atrophy, myelination delay, and hippocampal sclerosis
          this node describes, in the 48-patient TBC1D24 cohort.
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: NO_EVIDENCE
        evidence_source: HUMAN_CLINICAL
        snippet: "There was no specific association among neuroimaging findings, phenotypic features, or prognosis."
        explanation: >-
          Records that the cohort found no imaging-phenotype correlation, so
          these findings are not used here to grade severity.
    downstream:

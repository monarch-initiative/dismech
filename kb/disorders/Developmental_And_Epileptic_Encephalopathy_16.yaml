progression:
  - phase: Early-infantile seizure onset
    notes: >-
      Seizures begin in the first weeks to months of life. Across the whole
      TBC1D24 spectrum mean onset is 7 months with a wide range; the DEE16 end
      sits at the early extreme of that distribution, within weeks of birth.
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The average age at seizure onset was 7 months (range from within 1 hour after birth to 8 years; SD 15 months)."
        explanation: >-
          Gives the age-at-onset distribution across the TBC1D24 spectrum within
          which DEE16 is the early extreme.

  - phase: Drug-resistant course with recurrent status epilepticus
    notes: >-
      Seizures fail to respond to sequential antiseizure medications; prolonged
      seizures and status epilepticus recur, frequently triggered by fever or
      intercurrent infection.
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In 30 patients, epilepsy was drug-resistant24; 18 patients responded well to treatment."
        explanation: >-
          Records drug resistance in the majority of the TBC1D24 cohort.

  - phase: Early death or profound disability
    notes: >-
      Children either die in early childhood, most within the first seven years,
      or survive with profound developmental impairment.
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "TBC1D24-related epilepsy syndromes show marked phenotypic pleiotropy, with multisystem involvement and severity spectrum ranging from isolated deafness (not studied here), benign myoclonic epilepsy restricted to childhood with complete seizure control and normal intellect, to early-onset epileptic encephalopathy with severe developmental delay and early death."
        explanation: >-
          Places the early-onset epileptic encephalopathy phenotype, DEE16, at
          the severe-developmental-delay-and-early-death end of the spectrum.

animal_models:
  - name: Tbc1d24 S324Tfs*3 knock-in mouse
    species: Mouse
    genotype: Tbc1d24 S324Tfs*3 homozygous (CRISPR-Cas9 knock-in)
    description: >-
      A CRISPR-engineered mouse carrying the exact equivalent of a human
      truncating TBC1D24 variant associated with early infantile epileptic
      encephalopathy. Hearing and vestibular function are normal, so the model
      isolates the epilepsy phenotype from the deafness phenotypes of the same
      gene.
    publication: PMID:30602030
    modeled_mechanisms:
      - target: Neuronal Hyperexcitability and Hypersynchrony
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: >-
          Homozygotes show abrupt-onset spontaneous seizures recapitulating human
          EIEE, from the human-equivalent allele.
        limitations: >-
          The onset timing depends on a micro-exon splicing switch specific to
          this allele's position, so the model's developmental course may not
          generalize to DEE16 variants elsewhere in the gene. Seizure semiology in
          the mouse is convulsive rather than the migrating focal pattern that
          characterizes human DEE16.
        readouts:
          - name: Spontaneous seizure onset at postnatal day 15
            target: Neuronal Hyperexcitability and Hypersynchrony
            direction: INCREASED
            interpretation: >-
              Abrupt appearance of spontaneous seizures in homozygotes, absent
              before P15.
            evidence:
              - reference: PMID:30602030
                reference_title: "The phenotypic landscape of a Tbc1d24 mutant mouse includes convulsive seizures resembling human early infantile epileptic encephalopathy."
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: "Homozygous S324Tfs*3 mice have normal auditory and vestibular functions \nbut show an abrupt onset of spontaneous seizures at postnatal day 15 \nrecapitulating human EIEE."
                explanation: >-
                  Reports the seizure measurement and its direction in the model.
        evidence:
          - reference: PMID:30602030
            reference_title: "The phenotypic landscape of a Tbc1d24 mutant mouse includes convulsive seizures resembling human early infantile epileptic encephalopathy."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "Using CRISPR-Cas9 genome editing, we engineered a mouse with a \npremature translation stop codon equivalent to human S324Tfs*3, a recessive \nmutation of TBC1D24 associated with early infantile epileptic encephalopathy \n(EIEE)."
            explanation: >-
              Establishes that the model carries the human EIEE-associated allele,
              which is what makes it informative for this node.
      - target: Postnatal Micro-Exon Isoform Switch
        relationship: RECAPITULATES
        fidelity: HIGH
        model_scale: MOLECULAR
        description: >-
          The model is the sole source of evidence for the micro-exon switch
          mechanism; the node exists because of it.
        limitations: >-
          The switch has not been demonstrated in human neurons, and it can only
          apply to human variants that fall within the same micro-exon.
        evidence:
          - reference: PMID:30602030
            reference_title: "The phenotypic landscape of a Tbc1d24 mutant mouse includes convulsive seizures resembling human early infantile epileptic encephalopathy."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "The S324Tfs*3 variant is located in an alternatively \nspliced micro-exon encoding six perfectly conserved amino acids incorporated \npostnatally into TBC1D24 protein due to a micro-exon utilization switch."
            explanation: >-
              Describes the micro-exon mechanism the model demonstrates.

  - name: Drosophila skywalker phosphoinositide-pocket mutants
    species: Fruit fly
    genotype: skywalker (sky) alleles carrying human-equivalent TBC1D24 pocket mutations
    description: >-
      Flies carrying the fly orthologue's equivalent of the most prevalent human
      TBC1D24 pocket variants. The value of the model is the rescue arm: the
      defects are reversed by genetically raising synaptic PI(4,5)P2, which
      establishes the lipid interaction as the causal node rather than a
      correlate.
    publication: PMID:27669036
    modeled_mechanisms:
      - target: Loss of Phosphoinositide-Dependent Presynaptic Membrane Anchoring
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: >-
          Pathogenic pocket mutations abolish lipid binding and release the
          protein's membrane anchoring in presynaptic terminals.
        limitations: >-
          Drosophila Skywalker is an orthologue, not the human protein, and the
          fly has no TLDc-domain-dependent phenotype to compare. The seizure
          phenotype in flies is not the migrating focal seizure of human DEE16.
        readouts:
          - name: Synaptic-vesicle trafficking and seizure defects, PI(4,5)P2 rescue
            target: Loss of Phosphoinositide-Dependent Presynaptic Membrane Anchoring
            direction: RESTORED
            interpretation: >-
              Defects caused by pocket mutations are reversed when synaptic
              PI(4,5)P2 is raised, establishing the lipid interaction as causal.
            evidence:
              - reference: PMID:27669036
                reference_title: "Skywalker-TBC1D24 has a lipid-binding pocket mutated in epilepsy and required for synaptic function."
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: "these defects are reversed by genetically increasing synaptic PI(4,5)P2 concentrations through synaptojanin mutations"
                explanation: >-
                  Reports the rescue measurement behind this readout.
        evidence:
          - reference: PMID:27669036
            reference_title: "Skywalker-TBC1D24 has a lipid-binding pocket mutated in epilepsy and required for synaptic function."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "the pathogenic mutations cause severe neurological defects in flies, including impaired synaptic-vesicle trafficking and seizures"
            explanation: >-
              Supports treating the fly pocket mutants as informative for the
              human membrane-anchoring lesion.

  - name: Tbc1d24 F251L knock-in mouse
    species: Mouse
    genotype: Tbc1d24 F251L knock-in (homozygous and heterozygous)
    description: >-
      A knock-in of a disease-associated missense substitution that destabilizes
      the protein. Homozygotes seize spontaneously and die prematurely;
      heterozygotes survive to adulthood but have dendritic spine defects and
      impaired memory, which is the cleanest available separation of the
      cognitive phenotype from the seizure phenotype in this gene.
    publication: PMID:32004315
    modeled_mechanisms:
      - target: Postsynaptic Dendritic Spine Loss
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: >-
          The heterozygous arm isolates spine loss and memory impairment without
          the confound of ongoing seizures.
        limitations: >-
          F251L is a missense allele in the TBC domain; DEE16 is enriched for
          truncating alleles, so the model tests a protein-destabilization
          mechanism rather than complete loss. Heterozygous mice model a carrier
          state, not the biallelic human genotype.
        readouts:
          - name: Dendritic spine density and contextual fear memory
            target: Postsynaptic Dendritic Spine Loss
            direction: DECREASED
            interpretation: >-
              Spine defects and impaired memory in heterozygotes surviving to
              adulthood.
            evidence:
              - reference: PMID:32004315
                reference_title: "The epilepsy and intellectual disability-associated protein TBC1D24 regulates the maintenance of excitatory synapses and animal behaviors."
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: "the heterozygous F251L knock-in mice survive into adulthood but display dendritic spine defects and impaired memory"
                explanation: >-
                  Reports the spine and memory measurements behind this readout.
        evidence:
          - reference: PMID:32004315
            reference_title: "The epilepsy and intellectual disability-associated protein TBC1D24 regulates the maintenance of excitatory synapses and animal behaviors."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "we show that the protein stability of TBC1D24 is diminished by the disease-associated missense mutation that leads to F251L amino acid substitution"
            explanation: >-
              Establishes that the modelled allele acts by destabilizing the
              protein, which is what makes it informative for a loss-of-function
              node.
      - target: Neuronal Hyperexcitability and Hypersynchrony
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        limitations: >-
          Spontaneous seizures in the homozygote are not shown to be the
          migrating focal seizures that characterize human DEE16, and the allele
          is missense rather than truncating.
        evidence:
          - reference: PMID:32004315
            reference_title: "The epilepsy and intellectual disability-associated protein TBC1D24 regulates the maintenance of excitatory synapses and animal behaviors."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "the homozygous mutants show increased neuronal excitability, spontaneous seizure and pre-mature death"
            explanation: >-
              Supports treating the homozygous knock-in as informative for the
              hyperexcitability node.

  - name: Humanized TBC1D24 G501R Drosophila (TLDc allele)
    species: Fruit fly
    genotype: Drosophila neuronally expressing human TBC1D24 p.Gly501Arg
    description: >-
      A fly expressing the human protein carrying a TLDc-domain variant. The
      informative arm is pharmacological: the activity-induced trafficking and
      locomotor defects are reversed by N-acetylcysteine amide or
      alpha-tocopherol, which is the only antioxidant-rescue result in this
      gene and the strongest argument that the TLDc domain acts as a redox
      sensor.
    publication: PMID:31257402
    modeled_mechanisms:
      - target: TLDc Domain Dysfunction
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: MOLECULAR
        description: >-
          Models the consequence of a TLDc missense variant, with an antioxidant
          rescue that identifies the pathway.
        limitations: >-
          G501R causes Rolandic epilepsy with exercise-induced dystonia in
          humans, a self-limiting phenotype at the opposite end of the spectrum
          from DEE16. The fly is a heterologous expression system, and the
          antioxidant rescue has not been tested against a DEE16 allele or in any
          human system. The result is a therapeutic lead for the gene, not
          evidence about DEE16 treatment.
        readouts:
          - name: Synaptic vesicle trafficking and sustained activity under antioxidant treatment
            target: TLDc Domain Dysfunction
            direction: RESTORED
            interpretation: >-
              Antioxidant treatment restores trafficking and behavioural activity
              in the mutant, implicating oxidative stress as the mediating step.
            evidence:
              - reference: PMID:31257402
                reference_title: "TBC1D24-TLDc-related epilepsy exercise-induced dystonia: rescue by antioxidants in a disease model."
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: "which is rescued by treating TBC1D24G501R mutant animals with antioxidants N-acetylcysteine amide or alpha-tocopherol as indicated by restored synaptic vesicle trafficking levels and sustained behavioural activity"
                explanation: >-
                  Reports the rescue measurement and its direction.
        evidence:
          - reference: PMID:31257402
            reference_title: "TBC1D24-TLDc-related epilepsy exercise-induced dystonia: rescue by antioxidants in a disease model."
            supports: SUPPORT
            directness: INDIRECT
            evidence_source: MODEL_ORGANISM
            snippet: "The neuronal phenotypes of the TBC1D24G501R mutation are consistent with exacerbated oxidative stress sensitivity"
            explanation: >-
              Supports treating this fly as informative for TLDc-domain
              dysfunction. Indirect for DEE16 because the modelled allele causes a
              mild human phenotype.

experimental_models:
  - name: Patient-derived iPSC cortical neurons (severe vs mild TBC1D24 phenotype)
    experimental_model_type: IPSC_DERIVED_MODEL
    description: >-
      Reprogrammed neurons from a patient with severe developmental
      encephalopathy compared against neurons from a patient with mild
      early-onset epilepsy. The comparison is the point: the axon-formation
      defect is present only in the severe line, so it is a candidate cellular
      correlate of what separates DEE16 from the mild end of the same gene's
      spectrum.
    modeled_mechanisms:
      - target: Axonal Specification and Growth-Cone Endocytosis Failure
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: >-
          Human neurons carrying patient TBC1D24 variants reproduce the axon
          formation defect, and do so in a severity-dependent way.
        limitations: >-
          Two patient lines with no isogenic control, so the difference between
          them cannot be attributed to the variants alone. iPSC-derived neurons
          are developmentally immature and lack the cortical circuit context in
          which the human phenotype arises.
        readouts:
          - name: Axon formation in patient-derived neurons
            target: Axonal Specification and Growth-Cone Endocytosis Failure
            direction: DECREASED
            interpretation: >-
              Axon formation is impaired in the severe-phenotype line and
              unaffected in the mild-phenotype line.
            evidence:
              - reference: PMID:30858606
                reference_title: "TBC1D24 regulates axonal outgrowth and membrane trafficking at the growth cone in rodent and human neurons."
                supports: SUPPORT
                evidence_source: IN_VITRO
                snippet: "Reprogrammed neurons from a patient with severe developmental encephalopathy show significant axon formation defect that were absent from reprogrammed neurons of a patient with mild early onset epilepsy."
                explanation: >-
                  Reports the axon-formation measurement and its direction in
                  each line.
        evidence:
          - reference: PMID:30858606
            reference_title: "TBC1D24 regulates axonal outgrowth and membrane trafficking at the growth cone in rodent and human neurons."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "Our data reveal that alterations of membrane trafficking at the growth cone induced by TBC1D24 loss of function cause axonal and excitability defects."
            explanation: >-
              Supports treating these human neurons as informative for the axonal
              node.

treatments:
  - name: Antiseizure pharmacotherapy
    description: >-
      Symptomatic pharmacologic management of seizures. No regimen is established
      for DEE16 and seizures are usually drug-resistant; across the wider TBC1D24
      spectrum individual patients have responded to zonisamide, topiramate,
      valproate, or phenobarbital, but those responders sit at the milder end.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: anticonvulsant agent therapy
      term:
        id: NCIT:C64172
        label: Anticonvulsant Therapy
    target_mechanisms:
      - target: Neuronal Hyperexcitability and Hypersynchrony
        description: >-
          Antiseizure medications act on the hyperexcitable network rather than on
          the TBC1D24 trafficking lesion upstream of it, which is one reason
          control is so often incomplete.
    evidence:
      - reference: PMID:25719194
        reference_title: "TBC1D24-Related Disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "symptomatic \npharmacologic management for seizures"
        explanation: >-
          GeneReviews recommends symptomatic pharmacologic seizure management for
          TBC1D24-related disorders.
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "In 30 patients, epilepsy was drug-resistant24; 18 patients responded well to treatment."
        explanation: >-
          Refutes any claim of reliable pharmacologic control: the majority of the
          cohort was drug-resistant, and the responders were concentrated at the
          mild end of the spectrum rather than in DEE16.

  - name: Ketogenic diet therapy
    description: >-
      Reported to resolve super-refractory status epilepticus in one patient with
      TBC1D24-related drug-resistant epilepsy. This is a single case, not a
      trial, and is curated as a lead worth trying in refractory status rather
      than as established therapy.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: ketogenic diet therapy
      term:
        id: NCIT:C15447
        label: Dietary Intervention
    target_mechanisms:
      - target: Super-refractory status epilepticus
        description: >-
          Applied to break refractory status rather than to correct the
          underlying trafficking lesion.
    evidence:
      - reference: PMID:27502353
        reference_title: "Electroclinical phenotypes and outcomes in TBC1D24-related epilepsy."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: HUMAN_CLINICAL
        snippet: "Two seemingly unrelated Navajo patients with identical variations experienced super-refractory status epilepticus at 9 months of age, with one achieving resolution with ketogenic diet therapy."
        explanation: >-
          A single patient's response supports the diet as a candidate for
          refractory status; one of two patients with the same variant responded,
          so the inference to general efficacy is indirect.

  - name: Early intervention therapies
    description: >-
      Early educational intervention with physical, occupational, and speech
      therapy for the developmental delay, which is present from the outset
      rather than only after seizures begin.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: physical, occupational and speech therapy
      term:
        id: NCIT:C15315
        label: Rehabilitation
    target_mechanisms:
      - target: Global developmental delay
        description: >-
          Supportive rather than disease-modifying; it addresses function, not the
          cortical circuit lesion.
    evidence:
      - reference: PMID:25719194
        reference_title: "TBC1D24-Related Disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "early educational intervention and physical, \noccupational, and speech therapy for developmental delay"
        explanation: >-
          GeneReviews recommends this bundle of early interventions for
          developmental delay in TBC1D24-related disorders.

  - name: Genetic counseling
    description: >-
      Counseling for the 25% autosomal recessive recurrence risk. Once both
      familial variants are identified, prenatal and preimplantation genetic
      testing are available, and testing at-risk sibs allows seizures to be

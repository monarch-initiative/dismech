inheritance:
  - name: Autosomal recessive inheritance
    description: >-
      DEE16 requires biallelic (homozygous or compound heterozygous) TBC1D24
      pathogenic variants, and a separate autosomal dominant TBC1D24 phenotype
      exists that causes non-syndromic hearing loss rather than epilepsy.
      Carriers are conventionally described as asymptomatic, but that is not
      settled: seizures have been reported in heterozygous carriers, and the
      mouse work argues haploinsufficiency is clinically significant. Both
      positions are cited below.
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
      - reference: PMID:25719194
        reference_title: "TBC1D24-Related Disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The diagnosis of a TBC1D24-related disorder is established in \nan individual with suggestive findings biallelic TBC1D24 pathogenic variants \nwhen the mode of inheritance is autosomal recessive (i.e., DOORS syndrome, FIME, \nPME, EPRPDC, DEE, and DFNB)"
        explanation: >-
          GeneReviews states that the DEE phenotype in the TBC1D24 spectrum is
          established by biallelic variants under autosomal recessive inheritance.
      - reference: PMID:25719194
        reference_title: "TBC1D24-Related Disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Heterozygotes \n(carriers) are typically asymptomatic."
        explanation: >-
          The conventional position on carriers, stated by GeneReviews.
      - reference: PMID:30335140
        reference_title: "The epilepsy-associated protein TBC1D24 is required for normal development, survival and vesicle trafficking in mammalian neurons."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "Importantly, heterozygous TBC1D24 mutation carriers have also been reported with seizures, suggesting that haploinsufficiency for TBC1D24 is significant clinically."
        explanation: >-
          Contradicts the blanket claim that carriers are asymptomatic, and is
          the reason this entry does not assert it.
genetic:
  - name: TBC1D24
    notes: >-
      TBC1D24 (16p13.3) encodes a Rab-GTPase-activating-protein-domain protein
      that also carries a TLDc domain. It is most highly expressed in cerebral
      cortex and hippocampus. Biallelic pathogenic variants cause the whole
      TBC1D24 disease continuum; DEE16 sits at its severe extreme.
    gene_term:
      preferred_term: TBC1D24
      term:
        id: hgnc:29203
        label: TBC1D24
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    evidence:
      - reference: PMID:23526554
        reference_title: "Novel compound heterozygous mutations in TBC1D24 cause familial malignant migrating partial seizures of infancy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We identified two inherited novel mutations in TBC1D24 in two affected siblings."
        explanation: >-
          Establishes biallelic TBC1D24 variants as the cause of the severe
          early-onset epileptic encephalopathy phenotype that defines DEE16. The
          functional-assay half of this paper is cited separately, on the
          cortical-circuit node, so each item carries a single evidence_source.
      - reference: PMID:20727515
        reference_title: "TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In situ hybridization analysis revealed that Tbc1d24 is mainly expressed at the level of the cerebral cortex and the hippocampus."
        explanation: >-
          Localizes TBC1D24 expression to the cortical and hippocampal regions
          from which the seizures of DEE16 arise.
    variants:
      - name: Truncating (frameshift, nonsense, splice-site) TBC1D24 variants
        description: >-
          Predicted loss-of-function alleles concentrate at the severe end of the
          TBC1D24 spectrum, where DEE16 lies. The correlation is a trend rather
          than a rule: variant position and in-vitro severity do not cleanly
          predict the clinical phenotype.
        gene:
          preferred_term: TBC1D24
          term:
            id: hgnc:29203
            label: TBC1D24
        evidence:
          - reference: PMID:27281533
            reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: "We noted an unfavorable outcome associated with frameshift, nonsense, or splice-site mutations, indicating that loss of function produces more severe disease. At least one such mutation occurred in 17 patients. Of these, 15 had drug-resistant epilepsy and 8 of them died by the age of 7 years."
            explanation: >-
              Directly links loss-of-function alleles to drug resistance and
              early death, the outcome profile of DEE16.
          - reference: PMID:27281533
            reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
            supports: REFUTE
            evidence_source: IN_VITRO
            snippet: "Neuronal outgrowth assays showed that some TBC1D24 mutations, associated with the most severe TBC1D24-associated disorders, are not necessarily the most disruptive to this gene function."
            explanation: >-
              Contradicts a simple dose-of-residual-function model: the variants
              causing the most severe clinical disease are not the ones that most
              disrupt neurite outgrowth in vitro.
pathophysiology:
  - name: Biallelic TBC1D24 Loss of Function
    description: >-
      Both TBC1D24 alleles carry pathogenic variants, most severely truncating
      ones, that reduce or abolish protein expression and function. The protein
      has two separable functional modules that are lost together: a TBC
      (Rab-GAP) domain containing a cationic phosphoinositide-binding pocket, and
      a C-terminal TLDc domain implicated in oxidative-stress resistance.
    biological_scale: MOLECULAR
    cell_types:
      - preferred_term: Neuron
        term:
          id: CL:0000540
          label: neuron
    molecular_functions:
      - preferred_term: GTPase activator activity
        term:
          id: GO:0005096
          label: GTPase activator activity
        modifier: DECREASED
    evidence:
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "TBC1D24 encodes a protein containing a Tre2/Bub2/Cdc16 (TBC) domain, shared by Rab GTPase-activating proteins (Rab-GAPs)."
        explanation: >-
          Identifies the Rab-GAP TBC domain that biallelic pathogenic variants
          disrupt.
      - reference: PMID:27281533
        reference_title: "TBC1D24 genotype-phenotype correlation: Epilepsies and other neurologic features."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The protein also contains a TLDc domain, putatively involved in oxidative stress resistance."
        explanation: >-
          Establishes the second functional module lost when the protein is
          truncated.
    downstream:
      - target: Loss of Phosphoinositide-Dependent Presynaptic Membrane Anchoring
        causal_link_type: DIRECT
        description: >-
          The most prevalent patient variants fall in the TBC domain's cationic
          pocket and abolish its binding to PI(4)P/PI(4,5)P2.
        evidence:
          - reference: PMID:27669036
            reference_title: "Skywalker-TBC1D24 has a lipid-binding pocket mutated in epilepsy and required for synaptic function."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "The most prevalent patient mutations affect the phosphoinositide-binding pocket and inhibit lipid binding."
            explanation: >-
              States that pathogenic variants act by abolishing phosphoinositide
              binding, which is the step this edge asserts.
      - target: Impaired ARF6-Dependent Membrane Trafficking
        causal_link_type: DIRECT
        description: >-
          TBC1D24 binds and restrains ARF6; losing the protein releases that
          restraint.
        evidence:
          - reference: PMID:20727515
            reference_title: "TBC1D24, an ARF6-interacting protein, is mutated in familial infantile myoclonic epilepsy."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "By coimmunoprecipitation assay we found that TBC1D24 binds ARF6, a Ras-related family of small GTPases regulating exo-endocytosis dynamics."
            explanation: >-
              Establishes the physical TBC1D24-ARF6 interaction that this edge
              claims is lost.
      - target: TLDc Domain Dysfunction
        causal_link_type: DIRECT
        description: >-
          Truncating variants remove or disrupt the C-terminal TLDc domain, whose
          structural integrity is required for its neuroprotective activity.
        evidence:
          - reference: PMID:26668325
            reference_title: "The Evolutionarily Conserved Tre2/Bub2/Cdc16 (TBC), Lysin Motif (LysM), Domain Catalytic (TLDc) Domain Is Neuroprotective against Oxidative Stress."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "Our data demonstrate that the integrity of the TLDc domain is essential for conferring neuroprotection"
            explanation: >-
              Shows that disrupting the TLDc domain, as truncating TBC1D24
              variants do, removes its neuroprotective function.

  - name: Loss of Phosphoinositide-Dependent Presynaptic Membrane Anchoring
    description: >-
      The TBC domain's cationic pocket binds phosphoinositides phosphorylated at
      the 4 and 5 positions, and that lipid binding is what tethers the protein
      within the presynaptic terminal and restricts its diffusion. Pathogenic
      variants in the pocket abolish binding, releasing the protein from the
      presynaptic membrane. In Drosophila the resulting synaptic-vesicle
      trafficking defect and seizure phenotype are rescued by raising synaptic
      PI(4,5)P2, which makes the lipid interaction causal rather than incidental.
    biological_scale: MOLECULAR
    conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
    cell_types:
      - preferred_term: Neuron
        term:
          id: CL:0000540
          label: neuron
    molecular_functions:
      - preferred_term: phosphatidylinositol-4,5-bisphosphate binding
        term:
          id: GO:0005546
          label: phosphatidylinositol-4,5-bisphosphate binding
        modifier: DECREASED
    cellular_components:
      - preferred_term: Synapse
        term:
          id: GO:0045202
          label: synapse
    evidence:
      - reference: PMID:27669036
        reference_title: "Skywalker-TBC1D24 has a lipid-binding pocket mutated in epilepsy and required for synaptic function."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We solved the crystal structure of the TBC domain of the Drosophila ortholog Skywalker, revealing an unanticipated cationic pocket conserved among TBC1D24 homologs. Cocrystallization and biochemistry showed that this pocket binds phosphoinositides phosphorylated at the 4 and 5 positions."
        explanation: >-
          Structural and biochemical demonstration of the phosphoinositide-binding
          pocket whose loss this node describes.
    downstream:
      - target: Impaired Synaptic Vesicle Endocytosis and Recycling
        causal_link_type: DIRECT
        description: >-
          Pocket variants produce synaptic-vesicle trafficking failure that is
          reversed by restoring synaptic PI(4,5)P2.
        evidence:
          - reference: PMID:27669036
            reference_title: "Skywalker-TBC1D24 has a lipid-binding pocket mutated in epilepsy and required for synaptic function."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "the pathogenic mutations cause severe neurological defects in flies, including impaired synaptic-vesicle trafficking and seizures, and these defects are reversed by genetically increasing synaptic PI(4,5)P2 concentrations through synaptojanin mutations"
            explanation: >-
              Establishes the causal step from loss of lipid binding to
              synaptic-vesicle trafficking failure, with a rescue experiment.

  - name: Impaired ARF6-Dependent Membrane Trafficking
    description: >-
      TBC1D24 normally prevents ARF6 activation. Without it, ARF6-dependent
      membrane exchange between the plasma membrane and endocytic compartments is
      dysregulated. This is the developmental arm of the mechanism: the same
      dysregulation that disturbs mature vesicle traffic also drives the
      migration and axon-specification defects below, and dominant-negative ARF6
      rescues them.
    biological_scale: MOLECULAR
    cell_types:
      - preferred_term: Neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: regulation of ARF protein signal transduction
        term:
          id: GO:0032012
          label: regulation of ARF protein signal transduction
        modifier: ABNORMAL
    evidence:
      - reference: PMID:24469796
        reference_title: "TBC1D24 regulates neuronal migration and maturation through modulation of the ARF6-dependent pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We show that in vivo, overexpression of the dominant-negative form of ARF6 rescues the neuronal migration and dendritic outgrowth defects induced by TBC1D24 knockdown, suggesting that TBC1D24 prevents ARF6 activation."
        explanation: >-
          Rescue by dominant-negative ARF6 establishes that TBC1D24 loss acts
          through unrestrained ARF6 activation.
    downstream:
      - target: Delayed Radial Migration and Arrested Neuronal Maturation
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:24469796
            reference_title: "TBC1D24 regulates neuronal migration and maturation through modulation of the ARF6-dependent pathway."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "in utero TBC1D24 knockdown in the rat developing neocortex affects the multipolar-bipolar transition of neurons leading to delayed radial migration"
            explanation: >-
              Directly links loss of TBC1D24 to the radial-migration delay this
              edge asserts.
      - target: Postsynaptic Dendritic Spine Loss
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:32004315
            reference_title: "The epilepsy and intellectual disability-associated protein TBC1D24 regulates the maintenance of excitatory synapses and animal behaviors."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "it is required for the maintenance of dendritic spines through inhibition of the small GTPase ARF6"
            explanation: >-
              States that spine maintenance runs through ARF6 inhibition, which
              is the mechanism this edge claims.
      - target: Axonal Specification and Growth-Cone Endocytosis Failure
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:30858606
            reference_title: "TBC1D24 regulates axonal outgrowth and membrane trafficking at the growth cone in rodent and human neurons."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: "The axonal phenotype was accompanied by an impairment of endocytosis at the growth cone and an altered activation of the TBC1D24 molecular partner ADP ribosylation factor 6."
            explanation: >-
              Ties the axonal and growth-cone endocytic defect to altered ARF6
              activation, the mechanism this edge runs through.

  - name: TLDc Domain Dysfunction
    description: >-
      The C-terminal TLDc domain is the half of TBC1D24 whose job is least
      settled, and the literature pulls in two directions. The domain family
      (OXR1, NCOA7) confers resistance to oxidative stress, and a humanized
      Drosophila model of a TLDc missense allele shows activity-induced
      vesicle-trafficking and locomotor defects that antioxidants reverse,
      supporting a reactive-oxygen-species sensor that sets synaptic vesicle
      trafficking rates. But no interaction was detected between the purified
      TBC1D24 TLDc domain and the V-ATPase that other TLDc proteins regulate, so
      the family analogy does not transfer wholesale, and a 2024 screen instead
      identified the scaffold protein KIBRA as the specific partner of this
      domain, with two recessive epilepsy-associated TLDc variants disrupting the
      binding.

      Two caveats matter for DEE16 specifically. The antioxidant-rescue work
      comes from a mild allele causing Rolandic epilepsy with exercise-induced
      dystonia, not from DEE16 patients. The KIBRA work tests two missense
      variants, whereas DEE16 is enriched for truncating alleles that remove the
      domain outright. So this arm is real biology whose contribution to the
      severe phenotype is inferred rather than measured.
    biological_scale: MOLECULAR
    cell_types:
      - preferred_term: Hippocampal neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: response to oxidative stress
        term:
          id: GO:0006979
          label: response to oxidative stress
        modifier: DECREASED
    evidence:
      - reference: PMID:39214300
        reference_title: "Interaction between the TBC1D24 TLDc domain and the KIBRA C2 domain is disrupted by two epilepsy-associated TBC1D24 missense variants."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "As two epilepsy-associated recessive variants (Gly511Arg and Ala515Val) in the TLDc domain of human TBC1D24 disrupt the interaction with the human KIBRA C2 domain, this study reveals a pathogenic mechanism of TBC1D24-associated epilepsy, linking the TBC1D24 and KIBRA pathways."
        explanation: >-
          Identifies a specific molecular consequence of TLDc-domain variants,
          giving this node a mechanism rather than an analogy.
      - reference: PMID:31257402
        reference_title: "TBC1D24-TLDc-related epilepsy exercise-induced dystonia: rescue by antioxidants in a disease model."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "We propose that the TBC1D24/Sky TLDc domain is a reactive oxygen species sensor mediating synaptic vesicle trafficking rates that, when dysfunctional, causes a movement disorder in patients and flies."
        explanation: >-
          Supports the redox-sensor role of the domain, but from a fly model of a
          mild human allele, so the inference to DEE16 runs through the shared
          domain rather than through the phenotype.
      - reference: PMID:39214300
        reference_title: "Interaction between the TBC1D24 TLDc domain and the KIBRA C2 domain is disrupted by two epilepsy-associated TBC1D24 missense variants."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "no interaction was detected between mouse V-ATPase and the purified TLDc domain of TBC1D24 and MTOR associated protein, eak-7 homolog (MEAK7) (21), leaving the function of the TLDc domain of TBC1D24 unresolved (24)"
        explanation: >-
          Contradicts reading across from other TLDc proteins to TBC1D24: the
          V-ATPase regulation that OXR1 and NCOA7 perform was not reproduced for
          this domain, and the authors call its function unresolved.
      - reference: PMID:26668325
        reference_title: "The Evolutionarily Conserved Tre2/Bub2/Cdc16 (TBC), Lysin Motif (LysM), Domain Catalytic (TLDc) Domain Is Neuroprotective against Oxidative Stress."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: IN_VITRO
        snippet: "TBC1D24, a protein mutated in a range of disorders characterized by seizures, hearing loss, and neurodegeneration"
        explanation: >-
          Places TBC1D24 within the TLDc family whose domain integrity the same
          study shows is required for neuroprotection. The inference to TBC1D24's
          own domain is by family membership, not direct measurement.
    downstream:
      - target: Impaired Synaptic Vesicle Endocytosis and Recycling
        causal_link_type: DIRECT
        description: >-
          If the domain is a redox sensor setting vesicle trafficking rates, its
          loss feeds the same presynaptic failure the TBC domain lesion produces,
          which would explain why both domains yield overlapping phenotypes.
        evidence:
          - reference: PMID:31257402
            reference_title: "TBC1D24-TLDc-related epilepsy exercise-induced dystonia: rescue by antioxidants in a disease model."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: "we demonstrated that the TBC1D24G501R TLDc mutation causes activity-induced locomotion and synaptic vesicle trafficking defects, while TBC1D24R360H is benign"
            explanation: >-
              Shows a TLDc-domain variant producing synaptic vesicle trafficking
              defects, the step this edge asserts.
      - target: Progressive Cerebral and Cerebellar Atrophy
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          Reduced oxidative-stress resistance is a plausible contributor to the
          progressive atrophy seen on neuroimaging, but no study has measured
          oxidative injury in DEE16 brain tissue.

  - name: Delayed Radial Migration and Arrested Neuronal Maturation
    description: >-
      TBC1D24-deficient neurons fail the multipolar-to-bipolar transition,
      migrate late through the developing neocortex, and retain immature
      morphological and functional properties once they arrive. The cortex that
      results is populated by neurons that never fully matured, which is the
      developmental half of "developmental and epileptic encephalopathy".
    biological_scale: CELLULAR
    cell_types:
      - preferred_term: Cortical projection neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: cerebral cortex radially oriented cell migration
        term:
          id: GO:0021799
          label: cerebral cortex radially oriented cell migration
        modifier: DECREASED
      - preferred_term: cell morphogenesis involved in neuron differentiation
        term:
          id: GO:0048667
          label: cell morphogenesis involved in neuron differentiation
        modifier: ABNORMAL
    evidence:
      - reference: PMID:24469796
        reference_title: "TBC1D24 regulates neuronal migration and maturation through modulation of the ARF6-dependent pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Furthermore, we find that TBC1D24-knockdown neurons display an abnormal maturation and retain immature morphofunctional properties."
        explanation: >-
          Direct evidence for the arrested-maturation half of this node.
    downstream:
      - target: Aberrant Cortical Circuit Formation
        causal_link_type: DIRECT
        description: >-
          Neurons that migrate late and stay immature assemble into malformed
          circuits.

  - name: Axonal Specification and Growth-Cone Endocytosis Failure
    description: >-
      Knockdown of TBC1D24 in cortical neurons disrupts axon specification, axon
      initial segment maturation, and action potential firing, alongside failed
      endocytosis at the growth cone; in vivo it impairs callosal projections.
      Critically for DEE16, the severity of this defect tracks the clinical
      severity in patient-derived neurons: iPSC neurons from a patient with
      severe developmental encephalopathy show the axon defect, while neurons
      from a patient with mild early-onset epilepsy do not.
    biological_scale: CELLULAR
    cell_types:
      - preferred_term: Neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: axonogenesis
        term:
          id: GO:0007409
          label: axonogenesis
        modifier: DECREASED
    evidence:
      - reference: PMID:30858606
        reference_title: "TBC1D24 regulates axonal outgrowth and membrane trafficking at the growth cone in rodent and human neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In rat cortical primary neurons silenced for TBC1D24, we found defects in axonal specification, the maturation of axonal initial segment and action potential firing."
        explanation: >-
          Direct evidence for the axonal and excitability defect this node names.
      - reference: PMID:30858606
        reference_title: "TBC1D24 regulates axonal outgrowth and membrane trafficking at the growth cone in rodent and human neurons."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Reprogrammed neurons from a patient with severe developmental encephalopathy show significant axon formation defect that were absent from reprogrammed neurons of a patient with mild early onset epilepsy."
        explanation: >-
          Human patient-derived evidence that the axonal phenotype is specific to
          the severe (DEE) end of the spectrum rather than to TBC1D24 loss
          generally.
    downstream:
      - target: Aberrant Cortical Circuit Formation
        causal_link_type: DIRECT
      - target: Neuronal Hyperexcitability and Hypersynchrony
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
          - axon initial segment maturation failure
          - altered action potential firing

  - name: Impaired Synaptic Vesicle Endocytosis and Recycling
    description: >-
      TBC1D24 is associated with clathrin-coated vesicles and synapses of
      hippocampal neurons. Losing it impairs presynaptic endocytosis and the
      regeneration of release-ready vesicles, destabilizing neurotransmission at
      the terminals of an already malformed cortical network.
    biological_scale: CELLULAR
    conforms_to: "synaptic_vesicle_cycle#Impaired Synaptic Vesicle Endocytosis and Recycling"
    cell_types:
      - preferred_term: Hippocampal neuron
        term:

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: cDNA analyses from A.I.1 T cells showed that the mutant allele mRNA was degraded >95%, consistent with nonsense-mediated decay
      explanation: Nonsense-mediated decay was measured in patient T cells.
  - name: p.Cys35Ter
    description: An early truncating allele with no detectable protein in transfected CHO cells.
    evidence:
    - reference: PMID:25329329

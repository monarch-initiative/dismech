name: CTLA4 Haploinsufficiency
synonyms:
- CHAI
- CTLA-4 haploinsufficiency with autoimmune infiltration disease
- CTLA4 insufficiency
- ALPS type V
- Autoimmune lymphoproliferative syndrome type 5
- Immune dysregulation with autoimmunity, immunodeficiency, and lymphoproliferation
creation_date: '2026-04-12T17:04:40Z'
category: Mendelian
description: CTLA4 haploinsufficiency, also called CHAI or CTLA4 insufficiency, is an autosomal dominant inborn error of immunity caused by heterozygous germline CTLA4 variants. Reduced CTLA4 abundance or defective protein function impairs regulatory T-cell control of CD80/CD86-dependent costimulation. Variable immune dysregulation includes hypogammaglobulinemia, lymphoproliferation, autoimmune cytopenias, enteropathy, lung disease and lymphocytic infiltration of other organs. Clinical penetrance is incomplete; functional defects can occur in apparently unaffected carriers. Missense alleles may impair dimerization, surface availability or ligand capture even when total protein staining is preserved.
disease_term:
  preferred_term: CTLA4 haploinsufficiency
  term:
    id: MONDO:0014493
    label: autoimmune lymphoproliferative syndrome due to CTLA4 haploinsufficiency
parents:
- Primary Immunodeficiency
- Autoimmune Disorder
- Lymphoproliferative Disorder
classifications:
  iuis_category:
    classification_value: immune dysregulation
    notes: IUIS 2022 phenotypic classification Table 4 (diseases of immune dysregulation); CTLA4 haploinsufficiency (CHAI) is a checkpoint dysregulation IEI.
    evidence:
    - reference: PMID:35748970
      reference_title: 'Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: CTLA4 haploinsufficiency (ALPS-V) CTLA4 AD 123890
      explanation: The CTLA4 row appears in Table 4, diseases of immune dysregulation, and specifies autosomal dominant inheritance.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: CTLA4 haploinsufficiency is inherited as an autosomal dominant disorder with marked phenotypic variability and incomplete penetrance. Disease can arise through familial transmission or de novo heterozygous variants, and some mutation carriers remain clinically unaffected despite measurable CTLA-4 pathway dysfunction.
  evidence:
  - reference: PMID:25329329
    reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We studied a large family in which five individuals presented with a complex, autosomal dominant immune dysregulation syndrome characterized by hypogammaglobulinemia, recurrent infections and multiple autoimmune clinical features.
    explanation: The discovery cohort establishes autosomal dominant inheritance for the syndrome caused by heterozygous CTLA4 mutations.
  - reference: PMID:25213377
    reference_title: Immune dysregulation in human subjects with heterozygous germline mutations in CTLA4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified germline heterozygous mutations in CTLA4 in subjects with severe immune dysregulation from four unrelated families.
    explanation: Independent families with heterozygous germline CTLA4 variants confirm a dominant loss-of-function disease mechanism.
  - reference: PMID:29729943
    reference_title: Phenotype, penetrance, and treatment of 133 cytotoxic T-lymphocyte antigen 4-insufficient subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In total, ninety of the 133 CTLA4 mutation carriers (67.6%) were considered affected, as they had sought medical attention for disease-related symptoms.
    explanation: The 2018 ascertained carrier cohort demonstrates incomplete clinical penetrance; the fraction is not a lifetime population estimate.
  - reference: PMID:29729943
    reference_title: Phenotype, penetrance, and treatment of 133 cytotoxic T-lymphocyte antigen 4-insufficient subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in seven affected carriers had occurred de novo.
    explanation: Both inherited and de novo pathogenic variants occur.
prevalence:
- population: Published CTLA4 haploinsufficiency cases in 2021 systematic review
  prevalence_class: UNKNOWN
  notes: A 2021 systematic review assembled 222 published CTLA4-haploinsufficiency patients within 101 eligible studies covering both CTLA4 and LRBA disorders. This historical literature count does not estimate population prevalence. Later cohorts overlap earlier reports and should not be summed.
  evidence:
  - reference: PMID:33788257
    reference_title: 'Comprehensive comparison between 222 CTLA-4 haploinsufficiency and 212 LRBA deficiency patients: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall, 434 (222 CHAI and 212 LATAIE) patients were found in 101 eligible studies.
    explanation: The review gives a dated published-case count, not a population denominator or a current total.
  measure_type: CASES_IN_LITERATURE
genetic:
- name: CTLA4
  gene_term:
    preferred_term: CTLA4
    term:
      id: hgnc:2505
      label: CTLA4
  association: CAUSATIVE
  features: Heterozygous germline loss-of-function variants cause disease. Truncating and splice variants can reduce membrane CTLA4 abundance, whereas missense variants can impair dimerization or ligand capture. Variant location does not reliably predict clinical severity or penetrance. Large 2q33 deletions can include neighboring CD28 and ICOS and require separate interpretation.
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:25329329
    reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a heterozygous nonsense mutation in exon 1 of CTLA4. Screening of 71 unrelated patients with comparable clinical phenotypes identified five additional families (nine individuals) with previously undescribed splice site and missense mutations in CTLA4.
    explanation: This cohort study defines the mutational spectrum, showing that multiple heterozygous CTLA4 variant classes can cause the syndrome.
  - reference: PMID:31396201
    reference_title: Preponderance of CTLA4 Variation Associated With Autosomal Dominant Immune Dysregulation in the MYPPPY Motif.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This variant lay within the highly conserved MYPPPY motif of CTLA-4: a critical structural determinant of ligand binding, which is also bound by the anti-CTLA-4 monoclonal antibody ipilimumab.'
    explanation: The case identifies a variant in the conserved ligand-binding motif; direct functional assays of this patient’s allele were not performed in this report.
  - reference: PMID:25213377
    reference_title: Immune dysregulation in human subjects with heterozygous germline mutations in CTLA4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified germline heterozygous mutations in CTLA4 in subjects with severe immune dysregulation from four unrelated families.
    explanation: Confirms CTLA4 as the causal gene and anchors the disease as a heterozygous germline loss-of-function disorder.
  - reference: CGGV:assertion_e79675bd-3eef-4925-b4ef-3b7c48734f30-2020-12-15T050000.000Z
    reference_title: CTLA4 / autoimmune lymphoproliferative syndrome due to CTLA4 haploinsufficiency (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: CTLA4 | HGNC:2505 | autoimmune lymphoproliferative syndrome due to CTLA4 haploinsufficiency | MONDO:0014493 | AD | Definitive
    explanation: ClinGen classifies the CTLA4-autoimmune lymphoproliferative syndrome due to CTLA4 haploinsufficiency gene-disease relationship as definitive with autosomal dominant inheritance.
  - reference: PMID:29729943
    reference_title: Phenotype, penetrance, and treatment of 133 cytotoxic T-lymphocyte antigen 4-insufficient subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: An association between genotype and onset, penetrance, or disease phenotype was not observed.
    explanation: The large carrier cohort did not establish a genotype-phenotype correlation.

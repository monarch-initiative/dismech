      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: we found no protein expression in cells transfected with the C35* (Family A) mutant
      explanation: Transfection excludes productive rescue by a nearby alternative start codon under these assay conditions.
  - name: p.Arg70Trp
    description: An extracellular-domain missense allele with preserved expressed protein but reduced ligand uptake.
    evidence:
    - reference: PMID:25329329
      reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO

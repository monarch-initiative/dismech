  - target: Excess Effector T Cell Activation
    treatment_effect: INHIBITS
    description: Soluble CTLA4-Ig binds the shared CD80/CD86 ligands and limits costimulation.
    evidence:
    - reference: PMID:36262801
      reference_title: 'The ABACHAI clinical trial protocol: Safety and efficacy of abatacept (s.c.) in patients with CTLA-4 insufficiency or LRBA deficiency: A non controlled phase 2 clinical trial.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Abatacept inhibits the CD80/86:CD28 co-stimulatory pathway by high affinity binding of the CTLA-4 domain to CD80 and CD86
      explanation: The protocol describes the pharmacologic rationale.
  notes: The trial reported five severe infections in three participants, with no EBV or CMV reactivation during the study. This does not eliminate infection risk or negate reactivation reported in earlier immunosuppressed cohorts.

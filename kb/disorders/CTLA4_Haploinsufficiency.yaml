      explanation: The CHO assay shows impaired uptake for this allele.
  - name: p.Thr124Pro
    description: An extracellular-domain missense allele with impaired soluble CD80 uptake; protein notation is retained because nucleotide coordinates differ between cited reports.
    evidence:
    - reference: PMID:25329329
      reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Cells transfected with either T124P and R70W mutants were impaired in their ability to take up soluble CD80-Ig

- name: Abatacept
  description: CTLA4-Ig binds CD80/CD86 and limits CD28-dependent costimulation. Retrospective cohorts and small case series report benefit, especially for enteropathy and lymphoproliferation. The 2026 ABACHAI single-arm trial enrolled 18 adults with CTLA4 insufficiency and two with LRBA deficiency; pooled results showed improvement in lymphoproliferation and immune activation, but insufficient control of cytopenias and renal involvement. Responses are organ dependent and the trial did not provide a randomized comparator.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: Abatacept
      term:
        id: NCIT:C28898
        label: Abatacept
  evidence:
  - reference: PMID:42763023
    reference_title: ABACHAI - Safety and efficacy of abatacept (s.c.) in patients with CTLA4 insufficiency or LRBA deficiency, a phase II clinical trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Twenty patients were enrolled (18 with CTLA-4 insufficiency and 2 with LRBA deficiency).
    explanation: Trial outcomes pool two genetic disorders and should not be presented as a CTLA4-only effect estimate.
  - reference: PMID:42763023
    reference_title: ABACHAI - Safety and efficacy of abatacept (s.c.) in patients with CTLA4 insufficiency or LRBA deficiency, a phase II clinical trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Abatacept reduced lymphoproliferation and immune activation and improved patient-reported quality of life and gastrointestinal symptom quality. Cytopenias and renal involvement were not sufficiently controlled.
    explanation: The prospective study documents both benefit and important limits.
  - reference: PMID:35935971
    reference_title: 'Cytotoxic T Lymphocyte Antigen 4 Haploinsufficiency Presenting As Refractory Celiac-Like Disease: Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: They are both now in complete clinical and endoscopic remission on abatacept.
    explanation: Two pediatric-onset enteropathy cases achieved remission; this is uncontrolled case evidence.
  - reference: PMID:42763023
    reference_title: ABACHAI - Safety and efficacy of abatacept (s.c.) in patients with CTLA4 insufficiency or LRBA deficiency, a phase II clinical trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three patients had five severe infections during treatment (incidence rate 0.27 per patient-year), comparable to the year preceding enrolment. No EBV or CMV reactivations occurred.
    explanation: The safety finding is limited to the trial population and observation period.
  therapeutic_modality: PROTEIN_REPLACEMENT

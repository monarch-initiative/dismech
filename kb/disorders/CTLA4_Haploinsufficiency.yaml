    evidence_source: HUMAN_CLINICAL
    snippet: Hypogammaglobulinemia was present in 84% (65/77), with low IgM in 30, low IgG in 42, and low IgA in 53 affected mutation carriers
    explanation: The measured subgroup supports the frequency; it is not the fraction of all variant carriers.

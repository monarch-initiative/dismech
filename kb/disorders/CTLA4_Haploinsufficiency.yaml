      explanation: Ligand uptake relative to CTLA4 expression distinguishes this functional defect.
  - name: p.Tyr139Cys
    description: A de novo MYPPPY-motif variant reported in a child with autoimmune hepatitis and polyarthritis.
    evidence:
    - reference: PMID:31396201
      reference_title: Preponderance of CTLA4 Variation Associated With Autosomal Dominant Immune Dysregulation in the MYPPPY Motif.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'This variant lay within the highly conserved MYPPPY motif of CTLA-4: a critical structural determinant of ligand binding, which is also bound by the anti-CTLA-4 monoclonal antibody ipilimumab.'
      explanation: The clinical report locates the variant in a functional motif; it did not directly assay this patient’s mutant protein.
    - reference: PMID:31396201
      reference_title: Preponderance of CTLA4 Variation Associated With Autosomal Dominant Immune Dysregulation in the MYPPPY Motif.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This variant was absent from both biological parents
      explanation: Parental sequencing established de novo occurrence.
  - name: NM_005214.5:c.167T>G (p.Phe56Cys)
    description: An inherited allele with incomplete penetrance. HEK293T assays show reduced dimerization, surface expression and CD80/CD86 binding despite preserved total protein.
    evidence:
    - reference: PMID:42577265
      reference_title: Novel pathogenic CTLA4 missense variant associated with autoimmune enteropathy and systemic immune dysregulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: ectopic expression of the CTLA4 p.Phe56Cys variant rather than the wild-type CTLA4 in HEK293T cells resulted in reduced CTLA4 dimerization under non-reducing sodium dodecyl sulfate-polyacrylamide gel electrophoresis (SDS-PAGE) conditions
      explanation: The 2026 functional study supports a dimerization defect for this allele.
  - name: c.457+2T>C
    description: An inherited splice-site variant in a patient with refractory celiac-like enteropathy and reduced CTLA4 expression in memory Tregs.
    evidence:
    - reference: PMID:35935971
      reference_title: 'Cytotoxic T Lymphocyte Antigen 4 Haploinsufficiency Presenting As Refractory Celiac-Like Disease: Case Report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Research-based whole-exome sequencing was pursued at this time and confirmed previously unreported heterozygous CTLA4 mutation (c. 457 + 2T > C), suggestive of CTLA4 haploinsufficiency.
      explanation: Sequencing identified the allele; associated reduced protein expression supports functional insufficiency without a demonstrated RNA-splicing assay.
    - reference: PMID:35935971
      reference_title: 'Cytotoxic T Lymphocyte Antigen 4 Haploinsufficiency Presenting As Refractory Celiac-Like Disease: Case Report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: it was confirmed that the disease-causing mutation was inherited from the patient’s father
      explanation: Family testing established paternal inheritance.
  - name: c.71_72del (p.Leu24ProfsTer35)
    description: A de novo early frameshift in a second refractory celiac-like enteropathy case, with absent detectable CTLA4 in memory Tregs.
    evidence:
    - reference: PMID:35935971
      reference_title: 'Cytotoxic T Lymphocyte Antigen 4 Haploinsufficiency Presenting As Refractory Celiac-Like Disease: Case Report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A previously unreported de novo heterozygous variant in CTLA4 in exon 1, c71_72del (p.Leu24Profs*35) was identified
      explanation: The case report documents de novo occurrence and subsequently confirms deficient CTLA4 staining.
  - name: p.Phe179CysfsTer29
    description: A frameshift allele for which Treg CTLA4 expression was comparable to controls but CD80 uptake was impaired.
    evidence:
    - reference: url:https://orbi.uliege.be/bitstream/2268/308264/1/PIIS0091674921008915.pdf
      reference_title: https://orbi.uliege.be/bitstream/2268/308264/1/PIIS0091674921008915.pdf
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Although Treg cells with the variant p.F179Cfs*29 had normal CTLA-4 expression, the frequency of CD80 uptake in Treg cells was as reduced as in 3 additional deleterious variants
      explanation: Full text of Egg et al., Therapeutic options for CTLA-4 insufficiency (PMID:34111452). This allele illustrates functional insufficiency despite preserved staining.
pathophysiology:
- name: Reduced CTLA4 protein abundance
  biological_scale: MOLECULAR
  description: Many truncating or splice alleles reduce the abundance of membrane-associated CTLA4. Nonsense-mediated decay is demonstrated for p.Arg51Ter; splice defects can reduce full-length transcript while preserving soluble CTLA4. This quantitative mechanism does not describe every missense allele.
  gene:
    preferred_term: CTLA4
    term:
      id: hgnc:2505
      label: CTLA4
  evidence:
  - reference: PMID:25213377
    reference_title: Immune dysregulation in human subjects with heterozygous germline mutations in CTLA4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Affected patients had reduced CTLA-4 protein and mRNA expression in sorted Treg cells relative to healthy donors; this reduction persisted after activation
    explanation: Patient Tregs demonstrate a quantitative CTLA4 defect that persists after activation.
  downstream:
  - target: Deficient CTLA4 ligand capture
    description: Reduced available receptor limits CTLA4-dependent ligand capture.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25329329
      reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Whereas Treg cells were generally present at elevated numbers in these individuals, their suppressive function, CTLA-4 ligand binding and transendocytosis of CD80 were impaired.
      explanation: Carrier Tregs show impaired ligand removal as well as suppression.
- name: Impaired CTLA4 dimerization
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: The p.Phe56Cys allele reduces disulfide-linked CTLA4 dimerization in transfected HEK293T cells. Total protein was preserved while surface abundance and ligand binding decreased. The relative contributions of dimerization, folding and trafficking remain unresolved; this is an allele-specific mechanism.
  gene:
    preferred_term: CTLA4
    term:
      id: hgnc:2505
      label: CTLA4
  evidence:
  - reference: PMID:42577265
    reference_title: Novel pathogenic CTLA4 missense variant associated with autoimmune enteropathy and systemic immune dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ectopic expression of the CTLA4 p.Phe56Cys variant rather than the wild-type CTLA4 in HEK293T cells resulted in reduced CTLA4 dimerization under non-reducing sodium dodecyl sulfate-polyacrylamide gel electrophoresis (SDS-PAGE) conditions
    explanation: Non-reducing immunoblots support defective dimerization for this allele in an overexpression system.
  downstream:
  - target: Deficient CTLA4 ligand capture
    description: Dimerization-defective p.Phe56Cys also reduces surface CTLA4 and CD80/CD86 binding; an isolated affinity change was not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

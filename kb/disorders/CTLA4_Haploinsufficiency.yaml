datasets:
- accession: dbgap:phs000797
  title: CTLA4 haploinsufficiency and immune dysregulation
  description: We identified germline heterozygous mutations in  CTLA4  in members of four families with severe immune dysregulation. Human  CTLA4  haploinsufficiency caused dysregulation of FoxP3+ regulatory T (Treg) cells and lymphocytic infiltration of target organs, mimicking  Ctla4  homozygous mice. Patients also exhibited a B cell phenotype, with progressive loss of B cells and accumulation of autoreactive CD21 lo  B cells. This study demonstrates a critical quantitative role for CTLA-4 in human immune homeostasis.
  notes: Human family sequencing study underlying the discovery of germline CTLA4-associated immune dysregulation. Individual-level genomic data are subject to repository access controls.
notes: CTLA4 insufficiency encompasses both quantitative haploinsufficiency and defective function of expressed protein. Clinical cohorts are overlapping and variably ascertained; their case counts and treatment responses should not be pooled as independent observations. Current functional assays can detect pathway defects in asymptomatic carriers and do not by themselves establish future clinical penetrance. The ORBi PDF is the author postprint of Egg et al., Therapeutic options for CTLA-4 insufficiency (PMID:34111452; DOI:10.1016/j.jaci.2021.04.039). It provides the full-text treatment and functional-assay evidence for that publication, not an independent study.
discussions:
- discussion_id: ctla4-cell-intrinsic-effects
  kind: CONTROVERSY
  status: OPEN
  prompt: Which abnormalities require intrinsic CTLA4 function in conventional T cells or B cells, rather than loss of Treg-mediated restraint?
  attaches_to:
  - pathophysiology#Excess Effector T Cell Activation
  rationale: The founding studies agree on deficient Treg suppression but differ in conventional T-cell hyperproliferation and detectable B-cell CTLA4. Mixed PBMC assays cannot isolate cell-intrinsic effects, and B-cell apoptosis and autoreactivity do not establish their initiating mechanism.
  evidence:
  - reference: PMID:25213377
    reference_title: Immune dysregulation in human subjects with heterozygous germline mutations in CTLA4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CTLA-4–deficient patient T cells were hyperproliferative, with an increased percentage expressing CD25 in response to T cell receptor stimulation
    explanation: Stimulated patient cultures show excess activation; this experiment alone does not establish a conventional T-cell-intrinsic defect.
  - reference: PMID:25329329
    reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we did not observe any obvious alterations in conventional T cell proliferation (data not shown).
    explanation: The independent discovery study did not reproduce the proposed conventional T-cell phenotype under its assay conditions.
  - reference: PMID:25329329
    reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we were unable to detect CTLA-4 expression on B cells in the conditions we tested
    explanation: B-cell CTLA4 detection differed between the founding studies.
- discussion_id: ctla4-murine-dose-response
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why does heterozygous CTLA4 deficiency produce human disease while heterozygous mice lack an obvious comparable phenotype?
  rationale: Complete Ctla4 loss or lymphopenic adoptive-transfer models demonstrate checkpoint dependence but do not reproduce the dosage and incomplete penetrance of human heterozygosity.
  evidence:
  - reference: PMID:25213377
    reference_title: Immune dysregulation in human subjects with heterozygous germline mutations in CTLA4.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In contrast, heterozygous Ctla4 deficiency in mice shows no obvious phenotype
    explanation: The discovery study explicitly identifies the species and dosage mismatch.
diagnosis:
- name: Molecular diagnosis with variant interpretation
  description: Sequence CTLA4 in patients with compatible immune dysregulation, including CVID-like disease or refractory enteropathy. Interpret novel variants with functional evidence and consider alternative checkpoint disorders such as LRBA and DEF6 deficiency.
  evidence:
  - reference: PMID:35935971
    reference_title: 'Cytotoxic T Lymphocyte Antigen 4 Haploinsufficiency Presenting As Refractory Celiac-Like Disease: Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Celiac disease cannot be distinguished from enteropathy secondary to CTLA4 deficiency solely by histopathology and, therefore, genetic testing is essential to identify this as an etiology of refractory celiac-like disease.
    explanation: The case series supports molecular investigation when clinical and histologic findings overlap.
- name: CTLA4 expression in memory regulatory T cells
  description: Flow cytometry of CD45RA-negative Foxp3-positive memory Tregs provides a more informative comparison than total CD4 cells. Reduced staining supports a defect but normal staining does not exclude functional CTLA4 insufficiency.
  evidence:
  - reference: PMID:28159733
    reference_title: Identifying functional defects in patients with immune dysregulation due to LRBA and CTLA-4 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Assessing total CTLA-4 expression levels was found to be optimal when restricting analysis to the CD45RA-Foxp3+ fraction.
    explanation: The assay study identifies the most informative cell subset.
  - reference: url:https://orbi.uliege.be/bitstream/2268/308264/1/PIIS0091674921008915.pdf
    reference_title: https://orbi.uliege.be/bitstream/2268/308264/1/PIIS0091674921008915.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Although Treg cells with the variant p.F179Cfs*29 had normal CTLA-4 expression, the frequency of CD80 uptake in Treg cells was as reduced as in 3 additional deleterious variants
    explanation: Full text of Egg et al., Therapeutic options for CTLA-4 insufficiency (PMID:34111452). A patient-cell assay shows why expression alone can miss a functional defect.
- name: Functional ligand uptake and transendocytosis
  description: Measure uptake of CD80/CD86 ligands to evaluate functional impact, including variants with preserved antibody staining. Soluble ligand uptake integrates trafficking and binding; cell-to-cell assays directly assess transendocytosis. Neither assay alone predicts clinical penetrance.
  evidence:
  - reference: PMID:28159733
    reference_title: Identifying functional defects in patients with immune dysregulation due to LRBA and CTLA-4 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Finally, we developed a functionally orientated assay to measure ligand uptake by CTLA-4, which is sensitive to ligand-binding or -trafficking mutations, that would otherwise be difficult to detect and that is appropriate for testing novel mutations in CTLA-4 pathway genes.
    explanation: The functional assay detects defects missed by abundance measurements.
- name: Immunoglobulins and lymphocyte subsets
  description: Assess serum immunoglobulins, antibody responses and lymphocyte subsets, including circulating B cells, switched memory cells and CD21-low cells. Interpret results in relation to immunosuppressive treatment and organ inflammation.
  evidence:
  - reference: PMID:29729943
    reference_title: Phenotype, penetrance, and treatment of 133 cytotoxic T-lymphocyte antigen 4-insufficient subjects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: B cell subsets showed a decrease in switched memory B cells (23/30) and consecutively a relative increase in naïve B cells (14/29).
    explanation: The cohort identifies characteristic immunophenotypic abnormalities.
- name: Organ evaluation and exclusion of competing causes
  description: Investigate gastrointestinal, pulmonary or neurologic symptoms with appropriate imaging, functional assessment, endoscopy or biopsy. Distinguish immune infiltration from infection and malignancy before attributing lesions to CTLA4 insufficiency.
  evidence:
  - reference: PMID:35935971
    reference_title: 'Cytotoxic T Lymphocyte Antigen 4 Haploinsufficiency Presenting As Refractory Celiac-Like Disease: Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: exclusion of infectious etiologies of chronic diarrhea is a critical component of evaluation.
    explanation: The GI report emphasizes excluding chronic infection.
  - reference: url:https://orbi.uliege.be/bitstream/2268/308264/1/PIIS0091674921008915.pdf
    reference_title: https://orbi.uliege.be/bitstream/2268/308264/1/PIIS0091674921008915.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Hepatomegaly, splenomegaly, or regional lymphadeno pathy should be carefully monitored, and if malignancy is suspected, a biopsy should be performed.
    explanation: Full text of Egg et al., Therapeutic options for CTLA-4 insufficiency (PMID:34111452). The expert protocol recommends evaluating suspicious lymphoproliferation rather than assuming it is benign.
clinical_trials:
- name: DRKS00017736
  phase: PHASE_II
  status: COMPLETED
  description: ABACHAI was an open-label, uncontrolled phase IIa study of weekly subcutaneous abatacept for 12 months in adults with CTLA4 insufficiency or LRBA deficiency. The 2026 publication reports 20 participants, including 18 with CTLA4 insufficiency. Infection control was the primary endpoint; organ response and quality of life were secondary endpoints.
  evidence:
  - reference: ICTRP:DRKS00017736
    reference_title: Safety and Efficacy of abatacept (s.c.) in patients with CTLA4 insufficiency or LRBA deficiency
    supports: SUPPORT
    evidence_source: OTHER
    snippet: '| Phase | 2 |'
    explanation: The official registry specifies phase II.
  - reference: ICTRP:DRKS00017736
    reference_title: Safety and Efficacy of abatacept (s.c.) in patients with CTLA4 insufficiency or LRBA deficiency
    supports: SUPPORT
    evidence_source: OTHER
    snippet: '| Date of completion | 28/06/2023 |'
    explanation: The registry records study completion.
  - reference: PMID:42763023
    reference_title: ABACHAI - Safety and efficacy of abatacept (s.c.) in patients with CTLA4 insufficiency or LRBA deficiency, a phase II clinical trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The primary endpoint was safety, defined as the number of episodes of failed infection control. Secondary endpoints included additional safety parameters, efficacy outcomes, and patient-reported quality of life.
    explanation: The results paper specifies the endpoint hierarchy.
experimental_models:
- name: CHO cells expressing CTLA4 variants
  experimental_model_type: CELL_LINE
  description: CHO cells expressing individual CTLA4 alleles measure protein abundance and soluble CD80 uptake without co-expression of the human wild-type allele.
  publication: PMID:25329329
  modeled_mechanisms:
  - target: Deficient CTLA4 ligand capture
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: Variant overexpression without the wild-type allele does not reproduce human heterozygosity; uptake includes trafficking and binding.
  evidence:
  - reference: PMID:25329329
    reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Full-length CTLA4 protein was detected in cells transfected with the CTLA4 mutants R70W (Family C) and T124P
    explanation: The transfected-cell system separates expressed protein from deficient uptake.
- name: Patient Treg suppression coculture
  experimental_model_type: CO_CULTURE
  description: Patient-derived Tregs are combined with healthy responder T cells and dendritic cells under ligand-dependent stimulation.
  publication: PMID:25329329
  modeled_mechanisms:
  - target: Impaired regulatory T-cell suppression
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Assay conditions do not reproduce the full multicellular disease.
  evidence:
  - reference: PMID:25329329
    reference_title: Autosomal dominant immune dysregulation syndrome in humans with CTLA4 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Treg cells from individuals with CTLA4 heterozygous mutations were unable to suppress CD4+ T cell proliferation as compared to healthy CTLA4+/+ controls
    explanation: The coculture directly measures CTLA4-dependent regulatory suppression.
- name: CTLA4 knockdown and rescue in human lymphocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: CTLA4 knockdown in healthy PBMCs and wild-type expression or CTLA4-Ig treatment in patient cultures test the relationship between checkpoint abundance and proliferation.
  publication: PMID:25213377
  modeled_mechanisms:
  - target: Excess Effector T Cell Activation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Mixed lymphocyte cultures do not isolate an intrinsic conventional T-cell defect; independent studies did not reproduce that interpretation.
  evidence:
  - reference: PMID:25213377
    reference_title: Immune dysregulation in human subjects with heterozygous germline mutations in CTLA4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: overexpression of wild-type CTLA-4 in patient T cells suppressed the hyperproliferation
    explanation: Restoration reverses the measured proliferation phenotype.
- name: HEK293T Phe56Cys functional assays
  experimental_model_type: CELL_LINE
  description: Transfected HEK293T cells compare disulfide-linked dimerization, total and surface CTLA4, and soluble CD80/CD86 binding.
  publication: PMID:42577265
  modeled_mechanisms:
  - target: Impaired CTLA4 dimerization
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: Ectopic expression in kidney-derived cells omits the heterozygous Treg context.
  - target: Deficient CTLA4 ligand capture
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: Binding measurements are confounded by reduced surface expression and do not isolate affinity.
  evidence:
  - reference: PMID:42577265
    reference_title: Novel pathogenic CTLA4 missense variant associated with autoimmune enteropathy and systemic immune dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ectopic expression of the CTLA4 p.Phe56Cys variant rather than the wild-type CTLA4 in HEK293T cells resulted in reduced CTLA4 dimerization under non-reducing sodium dodecyl sulfate-polyacrylamide gel electrophoresis (SDS-PAGE) conditions (which allows visualization of disulfide bond-dependent dimers, see Methods)
    explanation: The assay demonstrates reduced dimerization in an ectopic expression system.
- name: Gene-edited patient T cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: CRISPR-Cas9 and AAV6-directed homology repair at the first CTLA4 intron restore regulated CTLA4 expression and ligand transendocytosis in patient-derived T cells. This is preclinical rescue, not evidence of clinical benefit.
  publication: PMID:36288278
  modeled_mechanisms:
  - target: Reduced CD80/CD86 transendocytosis
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: In-vitro correction does not establish the required corrected-cell fraction, durable clinical efficacy or long-term safety.
  evidence:
  - reference: PMID:36288278
    reference_title: Therapeutic gene editing of T cells to correct CTLA-4 insufficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Gene editing of T cells isolated from three patients with CTLA-4 insufficiency also restored CTLA-4 protein expression and rescued transendocytosis of CD80 and CD86 in vitro.
    explanation: Three patient-derived cellular preparations showed restoration of function.
animal_models:
- name: Gene-corrected Ctla4-null T cells transferred into Rag2-null mice
  species: Mouse
  genotype: Rag2-null recipients of edited or control Ctla4-null donor T cells
  description: Edited donor T cells persist and prevent lymphoid enlargement and cardiac infiltration during a four-week adoptive-transfer experiment. This is correction of transferred cells, not germline correction of the recipient animal.
  publication: PMID:36288278
  modeled_mechanisms:
  - target: Non-malignant lymphoproliferation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: Lymphopenic recipients of Ctla4-null cells differ from heterozygous human disease; follow-up lasted four weeks.
  - target: Lymphocytic Tissue Infiltration
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: The measured tissue outcome was cardiac infiltration, not the complete human multiorgan spectrum.
  evidence:
  - reference: PMID:36288278
    reference_title: Therapeutic gene editing of T cells to correct CTLA-4 insufficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Murine CTLA4-/- T cells were edited (gRNA 5, HDR donor 5) or mock edited and then adoptively transferred into adult Rag2-/- mice without conditioning.
    explanation: The study defines the donor-cell and recipient genotypes.
  - reference: PMID:36288278
    reference_title: Therapeutic gene editing of T cells to correct CTLA-4 insufficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: only mice from groups that had received mock-edited or GFP- T cells showed elevated cardiac tissue infiltration
    explanation: The edited-cell recipients were protected from the measured cardiac inflammatory phenotype.
biochemical:
- name: Soluble interleukin-2 receptor
  notes: A nonspecific marker of immune activation, used longitudinally in some CTLA4 cases. Improvement under treatment is not a validated diagnostic threshold or a substitute for clinical assessment.
  evidence:
  - reference: PMID:35935971
    reference_title: 'Cytotoxic T Lymphocyte Antigen 4 Haploinsufficiency Presenting As Refractory Celiac-Like Disease: Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Soluble IL-2 receptor (i.e., CD25) levels, which were characteristically high at the patient’s diagnosis of CTLA4 haploinsufficiency (9), were monitored on abatacept and trended downward to normal range.
    explanation: A treated case provides longitudinal marker observations.
- name: CTLA4 mRNA expression
  notes: Investigational marker studied in small mixed CTLA4/LRBA and melanoma groups. Treated and untreated groups comprised different individuals, and healthy comparator analyses included asymptomatic carriers. The data do not demonstrate within-patient normalization or a validated severity predictor.
  evidence:
  - reference: PMID:31156616
    reference_title: CTLA4 Message Reflects Pathway Disruption in Monogenic Disorders and Under Therapeutic Blockade.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients in the NT and Aba groups represent different individuals in each group.
    explanation: The study design precludes interpreting the group comparison as longitudinal treatment response.
  - reference: PMID:31156616
    reference_title: CTLA4 Message Reflects Pathway Disruption in Monogenic Disorders and Under Therapeutic Blockade.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Future studies evaluating larger patient cohorts are required to further expand this finding and potentially uncover a reliable biomarker for clinical management of these disorders.
    explanation: The authors regard the proposed biomarker as unvalidated.

      treatment of genitourinary anomalies per nephrologist and/or urologist
    explanation: >-
      A management instruction, so it presupposes the anomalies rather than reporting
      them. Graded PARTIAL for that reason: it corroborates that they occur and says
      nothing about which anomalies or how often.

biochemical:
- name: Plasma lathosterol
  presence: Increased
  context: >-
    The diagnostic analyte. Because the disease is not clinically distinctive at its
    mild end, it is missed unless plasma sterols are measured or SC5D is sequenced.
  biomarker_term:
    preferred_term: lathosterol
    term:
      id: CHEBI:17168
      label: 5alpha-cholest-7-en-3beta-ol
  readouts:
  - target: Lathosterol Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Plasma lathosterol reports the enzymatic block directly, as the substrate
      immediately upstream of it.
    evidence:
    - reference: PMID:30097991
      reference_title: "Lathosterolosis: A Relatively Mild Case with Cataracts and Learning Difficulties."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The diagnosis will be missed unless plasma sterols are analysed or relevant
        genes sequenced.
      explanation: >-
        States why this readout is diagnostically necessary rather than merely
        confirmatory.

- name: Plasma total cholesterol
  presence: Normal
  context: >-
    Recorded because it is a negative result that does real work. The entry places
    lathosterolosis one enzymatic step upstream of Smith-Lemli-Opitz syndrome and
    attributes the malformation arm to a cholesterol shortfall, which invites the
    reading that plasma cholesterol should be low. It is not. Total cholesterol was
    normal in the patient whose sterol profile is reported in full, alongside the
    normal 7-dehydrocholesterol that separates this disease from SLOS biochemically.
    The cholesterol claim in the pathophysiology is therefore a developmental and
    cellular one - the sterol available to hedgehog signalling in the embryo - and not
    a claim about a measurable plasma concentration in the patient in front of you.
  evidence:
  - reference: PMID:33204591
    reference_title: "Successful treatment of lathosterolosis: A rare defect in cholesterol biosynthesis-A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal 7‐dehydrocholesterol, total cholesterol, and elevated 8(9)‐cholestenol levels"
    explanation: >-
      The only fully reported sterol profile in the literature. Read against the same
      sentence's elevated lathosterol, it gives the biochemical shape of the disease:
      the precursor piles up while the product stays in range. The normal
      7-dehydrocholesterol in the same list is what distinguishes it from SLOS, where
      that sterol is the one that accumulates.

genetic:
- name: SC5D
  gene_term:
    preferred_term: SC5D
    term:
      id: hgnc:10547
      label: SC5D
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic variants, predominantly missense. Reported alleles include R29Q, G211D,
    Y46S, P160R, D210E and L219S. D210E is a conservative substitution reported in two
    patients who both had relatively mild disease, consistent with residual activity.
    The one reported allele that cannot encode a functional enzyme is the nonsense
    variant Q72*, carried in trans with the missense N71I by a patient whose FibroScan
    read 15.6 kPa against a paediatric normal of 2.5 to 8.5. It anchors the severe end
    of the same residual-activity argument that D210E anchors at the mild end. No
    patient homozygous for a null has been reported, which is consistent with the
    Sc5d-null mouse being stillborn.
  evidence:
  - reference: PMID:33204591
    reference_title: "Successful treatment of lathosterolosis: A rare defect in cholesterol biosynthesis-A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A missense variant, NM_006918.4 (SC5D):c.212A>T;p.(Asn71Ile) and a nonsense
      variant, NM_006918.4(SC5D):c.214C>T; p.(Gln72*) were identified in exon 3 of the
      SC5D gene.
    explanation: >-
      Identifies the one reported allele that is a true null. The entry's
      genotype-phenotype reading rests on residual activity, so an allele with none is
      the informative extreme.
  - reference: PMID:30097991
    reference_title: "Lathosterolosis: A Relatively Mild Case with Cataracts and Learning Difficulties."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation leads to a relatively conservative amino acid substitution,
      consistent with some residual enzyme activity.
    explanation: >-
      Links a specific allele's chemistry to the milder phenotype, which is the
      genotype-phenotype logic available in a disease with this few patients.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33204591
    reference_title: "Successful treatment of lathosterolosis: A rare defect in cholesterol biosynthesis-A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Lathosterolosis is a rare autosomal recessive disorder of cholesterol biosynthesis.
    explanation: States the inheritance pattern.
  - reference: PMID:38060690
    reference_title: Lathosterolosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      each sib of an affected individual has at conception a 25% chance of being
      affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being
      unaffected and not a carrier
    explanation: >-
      The GeneReviews Genetic Counseling transmission risks, which the inheritance mode
      alone does not give.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six cases described as of the 2020 report, with the authors noting that milder forms
    are likely to have been missed. A handful of further cases have been reported since.
  evidence:
  - reference: PMID:33204591
    reference_title: "Successful treatment of lathosterolosis: A rare defect in cholesterol biosynthesis-A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only six cases have been described in the literature, but it is possible that a
      number of patients with milder forms of the condition might have been missed.
    explanation: >-
      Gives the case count and, usefully, the authors' own caveat about ascertainment.

treatments:
- name: Avoidance of Hepatotoxic Agents
  description: >-
    GeneReviews lists hepatotoxic medications and chemicals as agents to avoid. This
    carries more weight in this disease than the generic version of the advice: the
    hepatic arm is the dominant morbidity driver, it is the arm liver transplantation
    addresses, and the entry's only pharmacotherapy is a statin - so protecting the
    liver is a management instruction about the same organ the treatment plan turns on.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Progressive Liver Disease
    treatment_effect: MODULATES
    description: >-
      Avoids additional hepatocellular injury on top of the sterol-driven disease; it
      does not act on the biosynthetic block.
  evidence:
  - reference: PMID:38060690
    reference_title: Lathosterolosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Medications and chemicals that are hepatotoxic
    explanation: The GeneReviews agents-and-circumstances-to-avoid instruction.

- name: Simvastatin
  description: >-
    Inhibits HMG-CoA reductase upstream of the block, reducing flux into the pathway and
    so lowering the accumulated lathosterol. It does not restore the missing enzyme, and
    reported benefit is inconsistent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: simvastatin
      term:
        id: CHEBI:9150
        label: simvastatin
  target_mechanisms:
  - target: Lathosterol Accumulation
    treatment_effect: INHIBITS
    description: >-
      Reducing proximal cholesterol synthesis lowers the substrate that accumulates
      behind the block.
  - target: Progressive Liver Disease
    treatment_effect: MODULATES
    description: >-
      Improvement in transaminases and fibrosis grade followed the fall in plasma
      lathosterol in the treated patient.
  evidence:
  - reference: PMID:33204591
    reference_title: "Successful treatment of lathosterolosis: A rare defect in cholesterol biosynthesis-A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Simvastatin treatment resulted in lowering of plasma lathosterol levels,
      improvement in transaminitis, and liver fibrosis grade, suggesting that children
      with this condition should be actively treated in order to prevent progression of
      liver disease.
    explanation: >-
      The single most substantive treatment observation available: a biochemical
      response coupled to a histological one.
  - reference: PMID:30097991
    reference_title: "Lathosterolosis: A Relatively Mild Case with Cataracts and Learning Difficulties."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Our patient's family did not notice any benefit from treatment with simvastatin.
    explanation: >-
      A contrary observation in a different patient, curated as REFUTE so the entry does
      not present the treatment as uniformly effective.

- name: Surveillance Schedule
  description: >-
    GeneReviews sets a monitoring plan that is unusually specific for a disease with
    this few patients, and its shape follows the mechanism: the ophthalmologic and
    hepatic arms are both progressive and both actionable, so each gets an interval.
    Developmental milestones at every visit; annual ophthalmology; liver enzymes at
    every visit with ultrasound and FibroScan every six months; and a plasma sterol
    profile before starting simvastatin and every one to two months on it. That last
    interval is the one that carries mechanistic weight - it monitors the substrate
    behind the block, because the clinical endpoint the statin is meant to change has
    never been established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no target_mechanisms. Surveillance detects the arms of the
    disease, it does not act on them, and the available treatment_effect values all
    assert a causal action on the target.
  evidence:
  - reference: PMID:38060690
    reference_title: Lathosterolosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      annual ophthalmology evaluation; liver enzymes at each visit; liver imaging
      including ultrasound and FibroScan® every six months or per hepatologist;
      plasma sterol profile before initiating simvastatin and every one to two months
      while on therapy
    explanation: >-
      The GeneReviews Surveillance section verbatim, giving each interval rather than a
      general instruction to follow up.

- name: Liver Transplantation
  description: >-
    Named alongside simvastatin as a potential targeted therapy. It addresses the
    hepatic arm definitively by replacing the affected organ, while doing nothing for
    the malformation or storage arms - which is consistent with the entry's reading
    that those arms have different biochemical causes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Progressive Liver Disease
    treatment_effect: MODULATES
    description: Replaces the organ in which the hepatic arm manifests.
  evidence:
  - reference: PMID:38060690
    reference_title: "Lathosterolosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Potential targeted therapies include simvastatin (the safety and/or efficacy of
      simvastatin has not been proven in lathosterolosis) and liver transplantation.
    explanation: >-
      The GeneReviews Management section naming both targeted options, and stating
      plainly that simvastatin is unproven.

diagnosis:
- name: Plasma sterol analysis with SC5D confirmation
  description: >-
    Elevated plasma lathosterol establishes the biochemical diagnosis; biallelic SC5D
    variants confirm it. Either is sufficient per GeneReviews, which matters because
    the biochemical route is what catches the mild cases whose clinical picture is
    non-specific.
  evidence:
  - reference: PMID:38060690
    reference_title: "Lathosterolosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of lathosterolosis is established in a proband by identification of
      elevated lathosterol on plasma sterol analysis and/or biallelic pathogenic
      variants in SC5D by molecular genetic testing.
    explanation: The GeneReviews diagnostic criterion, giving both routes.

experimental_models:
- name: SC5D-knockout HepG2 cell line
  experimental_model_type: CELL_LINE
  description: >-
    One of three cholesterol-synthesis enzyme knockouts made in the same hepatocyte
    background, which allows the consequences of accumulating different sterols to be
    compared while holding the pathway and cell type constant.
  publication: PMID:39262789
  modeled_mechanisms:
  - target: Lathosterol Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces lathosterol accumulation in a hepatocyte background and shows it
      produces a distinct transcriptional response from the accumulation of other
      sterols in the same pathway.
    limitations: >-
      A transformed hepatoma line with a complete knockout, so it models neither the
      hypomorphic alleles patients carry nor the developmental context in which the
      malformations arise.
    evidence:
    - reference: PMID:39262789
      reference_title: "Knockouts of CYP51A1, DHCR24, or SC5D from cholesterol synthesis reveal pathways modulated by sterol intermediates."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Surprisingly, KOs of CYP51, DHCR24, and SC5D shared only 9% of differentially
        expressed genes.
      explanation: >-
        Shows that which sterol accumulates, not merely that cholesterol synthesis is
        blocked, determines the cellular response - the point the model exists to make.

animal_models:
- name: Sc5d-null mouse
  species: Mouse
  genotype: Sc5d -/-
  publication: PMID:12812989
  description: >-
    Stillborn with craniofacial and limb patterning defects, and the experiment that
    attributes the malformations to cholesterol deficiency rather than to lathosterol
    accumulation.
  modeled_mechanisms:
  - target: Progressive Liver Disease
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model is silent on the hepatic arm, and not because the liver was normal -
      because the animals never lived to have one assessed.
    limitations: >-
      Homozygous nulls are stillborn, so hepatic fibrosis, cirrhosis and the response
      to lowering plasma lathosterol cannot be observed in this model at all. A complete
      null is also a more severe lesion than the missense alleles patients carry, and no
      patient homozygous for a null has been reported - so the lethality may itself be
      the mouse reproducing something true, rather than a failure of the model.
    evidence:
    - reference: PMID:12812989
      reference_title: "Lathosterolosis: an inborn error of human and murine cholesterol synthesis due to lathosterol 5-desaturase deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Sc5d (-/-) pups were stillborn, had elevated lathosterol and decreased
        cholesterol levels
      explanation: >-
        Establishes the perinatal lethality that makes the postnatal arm unobservable
        here. It is the substantive basis for the negative claim, as
        FAILS_TO_RECAPITULATE requires.

  - target: Impaired Hedgehog Signalling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the malformation pattern and localizes its cause to the cholesterol
      shortfall.
    limitations: >-
      Homozygous nulls are stillborn, so the model cannot address the postnatal course,
      the hepatic disease, or the cataracts that dominate the milder human phenotype;
      and a complete null is a more severe lesion than the missense alleles patients
      carry.
    evidence:
    - reference: PMID:12812989
      reference_title: "Lathosterolosis: an inborn error of human and murine cholesterol synthesis due to lathosterol 5-desaturase deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Many of the malformations found in Sc5d (-/-) mice are consistent with impaired
        hedgehog signaling, and appear to be a result of decreased cholesterol rather
        than increased lathosterol.
      explanation: >-
        The comparison that makes this model informative for the mechanism rather than
        merely phenotypically similar.

discussions:
- discussion_id: lath_which_biochemical_lesion
  kind: INTERPRETATION
  prompt: >-
    Which of the two biochemical consequences - cholesterol deficiency or lathosterol
    accumulation - causes which part of the phenotype?
  attaches_to:
  - pathophysiology#Deficient Sterol C5-Desaturase Activity
  rationale: >-
    A biosynthetic block produces both a shortage and a surplus, and lathosterolosis is
    unusual in giving evidence that they act on different arms. The Sc5d-null mouse
    attributes the malformations to decreased cholesterol rather than increased
    lathosterol. The storage picture points the other way: it is not a general feature
    of cholesterol synthesis defects, it tracks with the most severe biochemical
    defects, and the hepatic disease improved when plasma lathosterol was lowered
    without the enzyme being restored. The entry models these as separate hypothesis
    groups rather than collapsing them, because a treatment that lowers flux would be
    expected to help the accumulation arm and do nothing for the cholesterol arm - which
    is testable and matters clinically.

- discussion_id: lath_mouse_lethality_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The Sc5d-null mouse dies before birth. Can a model that never lives a postnatal day
    speak to a disease whose dominant morbidity - liver disease and cataracts - is
    postnatal?
  attaches_to:
  - animal_models#Sc5d-null mouse
  - pathophysiology#Impaired Hedgehog Signalling
  - pathophysiology#Progressive Liver Disease
  rationale: >-
    The mismatch is not a weakness of the mouse, it is a statement about which arm of
    the disease each system can see. Homozygous nulls are stillborn with craniofacial
    and limb patterning defects, which is exactly the window in which the malformation
    arm is decided, and the model earns its place by attributing those defects to
    decreased cholesterol rather than to accumulated lathosterol. But the same
    lethality means it cannot report on the hepatic course, the cataracts, or the
    response to simvastatin, and those are what patients present with and what
    treatment targets.

    The allele is also more severe than the human lesion. Every reported patient
    carries at least one missense allele with some residual activity; no patient
    homozygous for a null has been described. So the mouse models a genotype that may
    not be compatible with human live birth either, which is a further reason its
    silence on the postnatal course is uninformative rather than reassuring.

    The practical consequence for this entry: the mouse supports the cholesterol-driven
    malformation hypothesis and must not be read as evidence about the accumulation
    arm, which is where the entry's two hypothesis groups differ.
  proposed_experiments:
  - experiment_id: lath_hypomorph_mouse
    name: Hypomorphic Sc5d allelic series carried to adulthood
    description: >-
      Knock in a patient missense allele such as D210E or N71I, alone and in trans with
      the null, and follow survivors postnatally for hepatic histology, transaminases,
      lens opacity and plasma sterols. The point is to obtain any model that survives
      the birth the null does not.
    decision_criterion: >-
      Whether a hypomorph with residual activity survives to adulthood and develops
      liver disease and cataracts.
    would_support:
    - pathophysiology#Progressive Liver Disease
    - mechanistic_hypotheses#lath_accumulation_drives_storage
    supporting_outcome:
    - >-
      Survivors developing progressive hepatic fibrosis and lens opacity would give the
      postnatal arm a model for the first time, and would let the statin question be
      asked as an intervention rather than inferred from two case reports.
    would_refute:
    - mechanistic_hypotheses#lath_accumulation_drives_storage
    refuting_outcome:
    - >-
      Survivors with normal liver and lenses despite elevated lathosterol would argue
      the hepatic arm depends on something other than sterol accumulation alone, and
      would weaken the accumulation hypothesis group.

- discussion_id: lath_statin_benefit_conflict
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does simvastatin change outcome in lathosterolosis, or only the sterol numbers?
  attaches_to:
  - treatments#Simvastatin
  rationale: >-
    Two reports disagree. In one, simvastatin lowered plasma lathosterol and was
    accompanied by improvement in transaminases and in fibrosis grade on repeat
    imaging. In another, the family noticed no benefit. Both are single patients, the
    endpoints are not the same, and the second reports absence of perceived benefit
    rather than a measured non-response - so the two are not strictly contradictory.
    With fewer than a dozen patients worldwide a trial is not realistic, which makes
    consistent sterol and liver endpoints across reported cases the only practical route
    to an answer.

    GeneReviews does not adjudicate between the two reports but states the field's
    position plainly: simvastatin is a potential targeted therapy whose safety and
    efficacy have not been proven in this disease. It nonetheless recommends a plasma
    sterol profile before starting and every one to two months on therapy - which is the
    practical shape of the uncertainty, monitoring a biochemical surrogate because the
    clinical endpoint is not established.

notes: >-
  GeneReviews. PMID:38060690 is a dedicated lathosterolosis chapter and is tagged and
  mined across all four sections. The first version of this entry missed it entirely -
  the deep-research report cited the bookshelf ID but not a PMID, and I did not search
  for one. It supplies the diagnostic criterion, liver transplantation as a second
  targeted therapy, the digit anomalies, and the statement that simvastatin's safety
  and efficacy are unproven here.

  Relationship to Smith-Lemli-Opitz syndrome. SC5D acts one step before DHCR7, and
  kb/disorders/Smith-Lemli-Opitz_syndrome.yaml is already curated. The two share the
  hedgehog mechanism and much of the malformation pattern, which is why lathosterolosis
  was initially described as atypical SLOS. They differ in the storage component, which
  is a feature of lathosterolosis and not of SLOS.

  Named Entity Confusion. The preflight passed for this report, with DHCR7 mentioned
  only five times against SC5D's thirty-three. Sentences describing SLOS were still used
  only for pathway context; no SLOS observation is cited here as a lathosterolosis
  finding.

  Ontology correction. The research report offered CHEBI:16833 for lathosterol. That
  term is neurosporene, a carotenoid. The correct term is CHEBI:17168
  (5alpha-cholest-7-en-3beta-ol), whose canonical label is the systematic name rather
  than the common one, so preferred_term carries "lathosterol" for display.

  Evidence for a disease with this few patients. Frequencies are graded against a
  literature of roughly a dozen cases and should be read as "reported in most described
  patients", not as cohort statistics. The prevalence record is deliberately
  CASES_IN_LITERATURE rather than a rate.

name: Lathosterolosis
description: >-
  Lathosterolosis is an ultra-rare autosomal recessive disorder of cholesterol
  biosynthesis caused by biallelic variants in SC5D, which encodes sterol C5-desaturase
  (3-beta-hydroxysteroid-delta-5-desaturase). The enzyme converts lathosterol to
  7-dehydrocholesterol in the penultimate step of cholesterol synthesis, one step
  upstream of the DHCR7 reaction whose loss causes Smith-Lemli-Opitz syndrome. Blocking
  it both starves the cell of cholesterol and causes lathosterol to accumulate, and the
  disease combines two things that rarely appear together: a congenital malformation
  syndrome attributable to impaired hedgehog signalling, and an intracellular lysosomal
  storage picture. Fewer than a dozen patients have been reported, spanning a lethal
  fetal presentation to a mild adult phenotype of cataracts and learning difficulty.

pathophysiology:
- name: Biallelic SC5D Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous SC5D variants. Reported alleles are
    predominantly missense, and residual activity tracks with severity across the small
    reported cohort.
  evidence:
  - reference: PMID:12189593
    reference_title: "Lathosterolosis, a novel multiple-malformation/mental retardation syndrome due to deficiency of 3beta-hydroxysteroid-delta5-desaturase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of the SC5D gene in the patient's DNA, showing the presence of
      two missense mutations (R29Q and G211D), confirmed that the patient is affected
      by a novel defect of cholesterol biosynthesis.
    explanation: The original molecular confirmation of the disease gene.
  downstream:
  - target: Deficient Sterol C5-Desaturase Activity
    causal_link_type: DIRECT
    description: The variants reduce activity of the encoded desaturase.

- name: Deficient Sterol C5-Desaturase Activity
  biological_scale: MOLECULAR
  description: >-
    The conversion of lathosterol to 7-dehydrocholesterol, the penultimate step of
    cholesterol synthesis, is blocked.
  molecular_functions:
  - preferred_term: C-5 sterol desaturase activity
    modifier: DECREASED
    term:
      id: GO:0000248
      label: C-5 sterol desaturase activity
  biological_processes:
  - preferred_term: cholesterol biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
  evidence:
  - reference: PMID:12189593
    reference_title: "Lathosterolosis, a novel multiple-malformation/mental retardation syndrome due to deficiency of 3beta-hydroxysteroid-delta5-desaturase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The biosynthesis of cholesterol in the patient's fibroblasts was defective,
      showing a block in the conversion of lathosterol into 7-dehydrocholesterol.
    explanation: Demonstrates the enzymatic block directly in patient fibroblasts.
  downstream:
  - target: Lathosterol Accumulation
    causal_link_type: DIRECT
    description: Substrate upstream of the block accumulates.
  - target: Cholesterol Deficiency
    causal_link_type: DIRECT
    description: Flux to the end product falls.

- name: Lathosterol Accumulation
  biological_scale: MOLECULAR
  description: >-
    Plasma and tissue lathosterol rise, in the reported mild case to more than tenfold
    above the upper limit of the control range. Accumulation is the diagnostic signature
    and appears to drive the storage arm of the disease specifically.
  evidence:
  - reference: PMID:30097991
    reference_title: "Lathosterolosis: A Relatively Mild Case with Cataracts and Learning Difficulties."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The plasma lathosterol concentration was markedly raised at 219.8 μmol/L (control
      range 0.53-16.0), confirming the diagnosis.
    explanation: Quantifies the accumulation against a stated control range.
  downstream:
  - target: Lysosomal Lamellar Inclusion Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - lath_accumulation_drives_storage
    description: >-
      The storage picture tracks with the most severe biochemical defects, suggesting it
      follows accumulation rather than cholesterol shortage.
  - target: Progressive Liver Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lowering lathosterol pharmacologically improved transaminases and fibrosis grade
      in one patient, which is the observation that implicates accumulation in the
      hepatic arm.

- name: Cholesterol Deficiency
  biological_scale: MOLECULAR
  description: >-
    Cellular cholesterol falls. In the mouse knockout this, rather than the accumulated
    precursor, is what accounts for the malformation phenotype.
  cellular_components: []
  evidence:
  - reference: PMID:12812989
    reference_title: "Lathosterolosis: an inborn error of human and murine cholesterol synthesis due to lathosterol 5-desaturase deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sc5d (-/-) pups were stillborn, had elevated lathosterol and decreased cholesterol
      levels, had craniofacial defects including cleft palate and micrognathia, and limb
      patterning defects.
    explanation: Establishes both the biochemical changes and the malformation phenotype.
  downstream:
  - target: Impaired Hedgehog Signalling
    causal_link_type: DIRECT
    hypothesis_groups:
    - lath_cholesterol_deficit_drives_malformation
    description: >-
      Sonic hedgehog requires covalent cholesterol modification, so a cholesterol
      shortfall impairs the morphogen pathway.

- name: Impaired Hedgehog Signalling
  biological_scale: CELLULAR
  description: >-
    The route by which a biosynthetic block becomes a malformation syndrome rather than
    a purely degenerative disease. This is the mechanism shared with Smith-Lemli-Opitz
    and the other post-squalene defects.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:12812989
    reference_title: "Lathosterolosis: an inborn error of human and murine cholesterol synthesis due to lathosterol 5-desaturase deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Many of the malformations found in Sc5d (-/-) mice are consistent with impaired
      hedgehog signaling, and appear to be a result of decreased cholesterol rather than
      increased lathosterol.
    explanation: >-
      Attributes the malformations to the pathway and, importantly, adjudicates between
      the two candidate biochemical causes.
  downstream:
  - target: Congenital Malformation Pattern
    causal_link_type: DIRECT
    description: Disrupted morphogen signalling produces the craniofacial and limb anomalies.

- name: Lysosomal Lamellar Inclusion Formation
  biological_scale: CELLULAR
  description: >-
    Lamellar inclusions on electron microscopy, with a mucolipidosis-like appearance on
    light microscopy in the most severely affected. This storage component is what makes
    lathosterolosis unusual among the cholesterol biosynthesis defects.
  evidence:
  - reference: PMID:12812989
    reference_title: "Lathosterolosis: an inborn error of human and murine cholesterol synthesis due to lathosterol 5-desaturase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An unique aspect of the lathosterolosis phenotype is the combination of a
      malformation syndrome with an intracellular storage defect.
    explanation: States the combination that distinguishes this disease from its neighbours.

- name: Congenital Malformation Pattern
  biological_scale: ORGANISM
  description: >-
    A recognisable pattern involving the axial and appendicular skeleton, liver, central
    nervous and urogenital systems.
  evidence:
  - reference: PMID:17853487
    reference_title: "Clinical phenotype of lathosterolosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LS phenotype appears to be characterized by the distinctive association of a
      recognizable pattern of congenital anomalies, involving axial and appendicular
      skeleton, liver, central nervous and urogenital systems, and lysosomal storage.
    explanation: Defines the malformation pattern and couples it to the storage finding.

- name: Progressive Liver Disease
  biological_scale: TISSUE
  description: >-
    Ranges from normal liver function tests through transaminitis to portal fibrosis and
    cirrhosis. It is the arm that responds to lowering the accumulated sterol.
  evidence:
  - reference: PMID:33204591
    reference_title: "Successful treatment of lathosterolosis: A rare defect in cholesterol biosynthesis-A case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver involvement is variable and can range from normal liver function tests to
      portal fibrosis and cirrhosis.
    explanation: Describes the range of hepatic involvement across reported cases.

mechanistic_hypotheses:
- hypothesis_group_id: lath_cholesterol_deficit_drives_malformation
  hypothesis_label: Cholesterol deficiency drives the malformation arm
  status: CANONICAL
  description: >-
    The malformations follow from insufficient cholesterol for hedgehog morphogen
    modification. The Sc5d-null mouse supports this over the alternative directly,
    reporting that the defects appear to result from decreased cholesterol rather than
    increased lathosterol.

- hypothesis_group_id: lath_accumulation_drives_storage
  hypothesis_label: Lathosterol accumulation drives the storage and hepatic arms
  status: ALTERNATIVE
  description: >-
    The lysosomal storage picture is not a general feature of cholesterol biosynthesis
    defects, and within lathosterolosis it tracks with the most severe biochemical
    defects rather than with cholesterol shortage. The hepatic response to lowering
    plasma lathosterol points the same way. Modeled as a separate group because the two
    arms of this disease appear to have different biochemical causes, which is unusual
    and worth keeping visible.


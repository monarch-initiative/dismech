    explanation: >-
      Gives a class-level population prevalence figure for the corneal dystrophies.

pathophysiology:
- name: Layer-Restricted Corneal Deposition or Cellular Failure
  biological_scale: TISSUE
  role: trigger
  description: >-
    Each dystrophy begins with an inherited defect expressed in one corneal layer, and
    the layer determines both the mechanism and the syndrome. In the epithelial,
    epithelial-stromal and stromal categories the lesion causes abnormal material to
    accumulate — mutant TGFBI protein in the epithelial-stromal group, abnormally
    sulphated keratan sulphate in macular dystrophy, cholesterol and phospholipid in
    Schnyder dystrophy. The endothelial category works differently: the corneal
    endothelium does not regenerate and functions as a dehydrating pump, so its
    progressive failure admits fluid into the stroma instead of depositing anything.
    Curating these as one node reflects a shared consequence, not a shared molecular
    mechanism.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  genes:
  - preferred_term: TGFBI
    term:
      id: hgnc:11771
      label: TGFBI
  - preferred_term: CHST6
    term:
      id: hgnc:6938
      label: CHST6
  - preferred_term: UBIAD1
    term:
      id: hgnc:30791
      label: UBIAD1
  - preferred_term: SLC4A11
    term:
      id: hgnc:16438
      label: SLC4A11
  - preferred_term: MCOLN1
    term:
      id: hgnc:13356
      label: MCOLN1
  - preferred_term: PRDX3
    term:
      id: hgnc:9354
      label: PRDX3
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lisch epithelial corneal dystrophy, previously reported as X-linked, has been discovered to be autosomal dominant ( MCOLN1 mutations, chromosome 19)."
    explanation: >-
      Source for the MCOLN1 gene binding on this node. MCOLN1 and PRDX3 are carried here
      rather than on layer-specific nodes because the layer is known for each entity
      (epithelium for Lisch dystrophy, deep stroma for PPPCD) while the mechanism by
      which either gene produces its deposit is not, so a dedicated mechanism node would
      assert more than any source states.
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pre-Descemet corneal dystrophies include category 1, autosomal dominant, punctiform and polychromatic pre-Descemet corneal dystrophy (PPPCD) ( PRDX3 mutations, chromosome 10)."
    explanation: >-
      Source for the PRDX3 gene binding on this node, and for treating PPPCD as an
      established entity rather than a category 4 candidate.
  - reference: PMID:25564336
    reference_title: IC3D classification of corneal dystrophies--edition 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the basis of revisiting the cellular origin of corneal dystrophy, a modified anatomic classification is proposed consisting of (1) epithelial and subepithelial dystrophies, (2) epithelial-stromal TGFBI dystrophies, (3) stromal dystrophies, and (4) endothelial dystrophies."
    explanation: >-
      States the four-category anatomic classification and, critically, that it was
      derived by revisiting the cellular origin of each dystrophy — which is what makes
      the corneal layer the organising principle rather than a descriptive convenience.
  downstream:
  - target: Loss of Corneal Transparency
    causal_link_type: DIRECT
    description: >-
      Deposited material scatters light directly; endothelial pump failure does so
      indirectly by allowing the stroma to imbibe fluid and lose its ordered collagen
      spacing. Either route degrades the cornea's optical function.
    evidence:
    - reference: PMID:38359414
      reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Deposition of opaque substances in epithelial, subepithelial, epithelial-stromal TGFBI or stromal corneal dystrophies may also result in vision reduction. Visual loss may also occur in endothelial corneal dystrophies because of corneal epithelial or stromal edema consequent to endothelial dysfunction."
      explanation: >-
        Covers both arms of this edge separately: deposited opaque material reduces
        vision in the epithelial, epithelial-stromal TGFBI and stromal categories, while
        in the endothelial category visual loss instead follows epithelial or stromal
        edema consequent to endothelial dysfunction.

- name: Loss of Corneal Transparency
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The convergent node. Corneal transparency depends on regular collagen fibril
    spacing, a deturgesced stroma and an intact smooth epithelium; every dystrophy
    degrades at least one of these. The result is corneal opacity, with or without
    stromal oedema depending on whether the endothelium is the affected layer.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deposition of opaque substances in epithelial, subepithelial, epithelial-stromal TGFBI or stromal corneal dystrophies may also result in vision reduction. Visual loss may also occur in endothelial corneal dystrophies because of corneal epithelial or stromal edema consequent to endothelial dysfunction."
    explanation: >-
      Establishes that loss of vision is the shared endpoint of both routes into this
      node — opaque deposition in three categories, and edema from endothelial
      dysfunction in the fourth.
  downstream:
  - target: Progressive Visual Impairment Requiring Surgical Restoration
    causal_link_type: DIRECT
    description: >-
      Once opacity or oedema crosses the visual axis, optical correction cannot
      compensate and restoring vision requires physically removing or replacing the
      affected layer.
    evidence:
    - reference: PMID:28583694
      reference_title: Corneal dystrophies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Anterior lamellar or endothelial keratoplasty are now preferred to penetrating keratoplasty, although the latter still remains the only possible option in some cases."
      explanation: >-
        Supports the layer-selective half of this claim: restoring vision means
        replacing the affected layer, and lamellar or endothelial keratoplasty is now
        preferred over penetrating keratoplasty for that reason.

- name: Progressive Visual Impairment Requiring Surgical Restoration
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint. Management escalates from lubricants, hyperosmotic agents and
    bandage contact lenses, through phototherapeutic or lamellar keratectomy, to
    keratoplasty. Because the dystrophies are layer-restricted, layer-selective grafts
    (anterior lamellar for anterior disease, endothelial keratoplasty for endothelial
    disease) are now preferred over penetrating keratoplasty — the anatomic
    classification maps directly onto the choice of operation. Recurrence in the graft
    is possible because the genetic defect persists in the host.
  evidence:
  - reference: PMID:28583694
    reference_title: Corneal dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anterior lamellar or endothelial keratoplasty are now preferred to penetrating keratoplasty, although the latter still remains the only possible option in some cases."
    explanation: >-
      Documents the preference for lamellar and endothelial keratoplasty over
      penetrating keratoplasty, while noting the latter remains necessary in some cases.

- name: Cornea-Specific Keratin Filament Fragility
  biological_scale: CELLULAR
  role: trigger
  description: >-
    The Meesmann mechanism. The intermediate filament cytoskeleton of the corneal
    epithelium is built from the cornea-specific pair K3 and K12; a heterozygous
    substitution in either, falling in a conserved keratin helix boundary motif, leaves the
    anterior epithelium mechanically fragile. A dominant-negative effect on the filament is
    the hypothesis the gene report set out to test, and is presented there as such rather
    than demonstrated. This is the same class of lesion that produces keratinocyte fragility
    phenotypes in skin keratins, restricted here to the one tissue where K3 and K12 are
    expressed.
  cell_types:
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  cellular_components:
  - preferred_term: keratin filament
    term:
      id: GO:0045095
      label: keratin filament
  locations:
  - preferred_term: corneal epithelium
    term:
      id: UBERON:0001772
      label: corneal epithelium
  genes:
  - preferred_term: KRT12
    term:
      id: hgnc:6414
      label: KRT12
  - preferred_term: KRT3
    term:
      id: hgnc:6440
      label: KRT3
  evidence:
  - reference: PMID:9171831
    reference_title: "Mutations in cornea-specific keratin K3 or K12 genes cause Meesmann's corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meesmann's corneal dystrophy (MCD) is an autosomal dominant disorder causing fragility of the anterior corneal epithelium, where K3 and K12 are specifically expressed."
    explanation: >-
      Establishes the node's three claims together: the affected layer is the anterior
      corneal epithelium, the lesion is fragility, and the two keratins are expressed
      specifically there.
  - reference: PMID:9171831
    reference_title: "Mutations in cornea-specific keratin K3 or K12 genes cause Meesmann's corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations occur in the highly conserved keratin helix boundary motifs, where dominant mutations in other keratins have been found to severely compromise cytoskeletal function, leading to keratinocyte fragility phenotypes."
    explanation: >-
      Supports the dominant-negative reading and the comparison with skin keratin
      fragility disorders, which is the argument for a cytoskeletal rather than a
      depositional mechanism.
  downstream:
  - target: Recurrent Corneal Erosions
    causal_link_type: DIRECT
    description: >-
      A mechanically fragile epithelium separates from its bed under ordinary shear,
      which is why the epithelial category presents with episodic erosion rather than
      with progressive opacity.
    evidence:
    - reference: PMID:9171831
      reference_title: "Mutations in cornea-specific keratin K3 or K12 genes cause Meesmann's corneal dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Meesmann's corneal dystrophy (MCD) is an autosomal dominant disorder causing fragility of the anterior corneal epithelium, where K3 and K12 are specifically expressed."
      explanation: >-
        Names epithelial fragility as the disorder's defining lesion; recurrent erosion
        is that fragility expressed clinically.

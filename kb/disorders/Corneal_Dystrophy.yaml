- Hereditary eye disease

has_subtypes:
- name: Epithelial and Subepithelial
  display_name: Epithelial and Subepithelial Dystrophies
  classification: anatomic
  description: >-
    IC3D anatomic category 1. Dystrophies of the corneal epithelium, its basement
    membrane and Bowman layer — epithelial basement membrane dystrophy, Meesmann
    corneal dystrophy (KRT12/KRT3), Lisch epithelial corneal dystrophy, gelatinous
    drop-like corneal dystrophy and the epithelial recurrent erosion dystrophies,
    which include a COL17A1-associated category 1 entity. Recurrent erosion is the
    characteristic symptom of this layer. No dismech entry yet.
  subtype_term:
    preferred_term: epithelial and subepithelial corneal dystrophy
    term:
      id: MONDO:0000763
      label: epithelial and subepithelial corneal dystrophy
  children:
  - MECD1
  - MECD2
  - GDLD
  - ERED
  - LECD
- name: Epithelial-Stromal TGFBI
  display_name: Epithelial-Stromal TGFBI Dystrophies
  classification: genetic
  description: >-
    IC3D anatomic category 2, and the one category defined by its gene. Allelic TGFBI
    variants produce Reis-Bucklers, Thiel-Behnke, lattice and granular corneal
    dystrophies, whose deposits span the epithelial basement membrane and anterior
    stroma. Fully curated in `TGFBI_Corneal_Dystrophies.yaml`.
  subtype_term:
    preferred_term: epithelial-stromal TGFBI dystrophy
    term:
      id: MONDO:0000764
      label: epithelial-stromal TGFBI dystrophy
  genes:
  - preferred_term: TGFBI
    term:
      id: hgnc:11771
      label: TGFBI
- name: Stromal
  display_name: Stromal Dystrophies
  classification: anatomic
  description: >-
    IC3D anatomic category 3. Dystrophies in which abnormal material accumulates within
    the corneal stroma without a TGFBI basis — macular corneal dystrophy (CHST6,
    autosomal recessive), Schnyder corneal dystrophy (UBIAD1, corneal cholesterol and
    phospholipid deposition), fleck, congenital stromal and central cloudy dystrophy of
    Francois. Curated in `Stromal_Corneal_Dystrophy.yaml`, with Schnyder held separately
    in `Schnyder_Corneal_Dystrophy.yaml`.
  subtype_term:
    preferred_term: stromal corneal dystrophy
    term:
      id: MONDO:0020213
      label: stromal corneal dystrophy
  children:
  - FCD
- name: Endothelial
  display_name: Endothelial Dystrophies
  classification: anatomic
  description: >-
    IC3D anatomic category 4. Dystrophies of the corneal endothelium and Descemet
    membrane — Fuchs endothelial corneal dystrophy, posterior polymorphous corneal
    dystrophy, congenital hereditary endothelial dystrophy (SLC4A11) and X-linked
    endothelial corneal dystrophy. Mechanistically distinct from the other three
    categories: the endothelium is a non-regenerating pump, so its failure causes
    stromal oedema and loss of transparency rather than deposition of abnormal
    material. Curated in `Fuchs_Endothelial_Corneal_Dystrophy.yaml` and
    `Posterior_Polymorphous_Corneal_Dystrophy.yaml`.
  subtype_term:
    preferred_term: corneal endothelial dystrophy
    term:
      id: MONDO:0000766
      label: corneal endothelial dystrophy
  children:
  - CHED
- name: MECD1
  display_name: Meesmann corneal dystrophy 1 (KRT12)
  classification: entity
  description: >-
    Meesmann corneal dystrophy, the KRT12 form. Autosomal dominant fragility of the
    anterior corneal epithelium. KRT12 encodes one of the two cornea-specific keratins of
    the epithelial intermediate filament cytoskeleton, and the disease-causing substitutions
    fall in the conserved keratin helix boundary motifs where dominant mutations in other
    keratins are known to compromise cytoskeletal function.
  subtype_term:
    preferred_term: corneal dystrophy, Meesmann, 1
    term:
      id: MONDO:0020791
      label: corneal dystrophy, Meesmann, 1
  genes:
  - preferred_term: KRT12
    term:
      id: hgnc:6414
      label: KRT12
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9171831
    reference_title: "Mutations in cornea-specific keratin K3 or K12 genes cause Meesmann's corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous missense mutations in K3 (E509K) and in K12 (V143L; R135T) completely co-segregated with MCD in the families and were not found in 100 normal unrelated chromosomes."
    explanation: >-
      Co-segregation of a K12 missense variant with Meesmann corneal dystrophy, absent
      from 100 control chromosomes, is the original evidence that KRT12 causes this
      entity.
- name: MECD2
  display_name: Meesmann corneal dystrophy 2 (KRT3)
  classification: entity
  description: >-
    Meesmann corneal dystrophy, the KRT3 form. KRT3 and KRT12 are the two
    cornea-specific keratins of the epithelial intermediate filament cytoskeleton, and the
    original gene report found the Meesmann phenotype segregating with either locus in
    different pedigrees — so the same disease arises from a variant in either gene. KRT3
    sits in the type-II keratin cluster on chromosome 12 and KRT12 in the type-I cluster on
    chromosome 17.
  subtype_term:
    preferred_term: corneal dystrophy, Meesmann, 2
    term:
      id: MONDO:0032904
      label: corneal dystrophy, Meesmann, 2
  genes:
  - preferred_term: KRT3
    term:
      id: hgnc:6440
      label: KRT3
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9171831
    reference_title: "Mutations in cornea-specific keratin K3 or K12 genes cause Meesmann's corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "K3 was mapped to the type-II keratin gene cluster on 12q; and K12 to the type-I keratin cluster on 17q using radiation hybrids."
    explanation: >-
      Places KRT3 and KRT12 in the type-II and type-I keratin clusters respectively,
      which is the basis for treating MECD1 and MECD2 as two loci for one phenotype
      rather than two diseases.
  - reference: PMID:9171831
    reference_title: "Mutations in cornea-specific keratin K3 or K12 genes cause Meesmann's corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we also showed that the phenotype segregated with either the K12 or the K3 locus in two Northern Irish pedigrees"
    explanation: >-
      Segregation with either locus in different pedigrees is the evidence that one
      phenotype has two loci, which is what MECD1 and MECD2 record.
- name: GDLD
  display_name: Gelatinous drop-like corneal dystrophy (TACSTD2)
  classification: entity
  description: >-
    Autosomal recessive severe corneal amyloidosis leading to blindness. Three of the four
    variants in the original gene report are nonsense and one a frameshift, so the mechanism
    is loss of the encoded protein; raised, yellowish-grey gelatinous masses severely impair
    visual acuity by the third decade and lamellar keratoplasty is required in most
    patients. It is the only recessive entity among the epithelial and subepithelial rows
    curated here.
  subtype_term:
    preferred_term: gelatinous drop-like corneal dystrophy
    term:
      id: MONDO:0008777
      label: gelatinous drop-like corneal dystrophy
  genes:
  - preferred_term: TACSTD2
    term:
      id: hgnc:11530
      label: TACSTD2
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10192395
    reference_title: Identification of the gene responsible for gelatinous drop-like corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report DNA sequencing, cDNA cloning and mutational analyses of four deleterious mutations (Q118X, 632delA, Q207X and S170X) in M1S1 (formerly TROP2 and GA733-1), encoding a gastrointestinal tumour-associated antigen."
    explanation: >-
      Original identification of the GDLD gene. Note the paper names it M1S1, which is
      HGNC's previous symbol for TACSTD2 (hgnc:11530); three of the four reported
      variants are nonsense and one a frameshift, so the mechanism is loss of protein.
  - reference: PMID:10192395
    reference_title: Identification of the gene responsible for gelatinous drop-like corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By the third decade, raised, yellowish-grey, gelatinous masses severely impair visual acuity, and lamellar keratoplasty is required for most patients."
    explanation: >-
      Source for the appearance of the deposits, the decade by which acuity is severely
      impaired, and the need for lamellar keratoplasty in most patients.
- name: ERED
  display_name: Epithelial recurrent erosion dystrophy (COL17A1)
  classification: entity
  description: >-
    Autosomal dominant recurrent breakdown of the corneal epithelium from childhood in the
    absence of an associated disease. IC3D edition 3 lists the COL17A1-associated form as
    category 1 and records that its signs and symptoms are similar to the category 4
    entities Franceschetti corneal dystrophy, dystrophia Smolandiensis and dystrophia
    Helsinglandica. Biallelic COL17A1 loss instead causes junctional epidermolysis
    bullosa, so the dominant corneal phenotype is not simply a milder allelic dose.
  subtype_term:
    preferred_term: epithelial recurrent erosion dystrophy
    term:
      id: MONDO:0007381
      label: epithelial recurrent erosion dystrophy
  genes:
  - preferred_term: COL17A1
    term:
      id: hgnc:2194
      label: COL17A1
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epithelial recurrent erosion dystrophies now include epithelial recurrent erosion dystrophy, category 1 ( COL17A1 mutations, chromosome 10)."
    explanation: >-
      IC3D edition 3 assigns the COL17A1-associated ERED evidence category 1, which is
      what makes it eligible as a curated entity here under this entry's stated rule of
      excluding category 3 and 4 entities.
  - reference: PMID:25676728
    reference_title: "Mutations in collagen, type XVII, alpha 1 (COL17A1) cause epithelial recurrent erosion dystrophy (ERED)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings implicate presumed gain-of-function COL17A1 mutations causing dominantly inherited ERED and improve understanding of the underlying pathology."
    explanation: >-
      States both the gene and the authors' reading of the allelic mechanism as
      presumed gain of function, which is why dominant ERED is not the heterozygous
      state of recessive junctional epidermolysis bullosa.
- name: LECD
  display_name: Lisch epithelial corneal dystrophy (MCOLN1)
  classification: entity
  description: >-
    Long reported as X-linked; IC3D edition 3 records that it has since been shown to be
    autosomal dominant with MCOLN1 variants on chromosome 19. The clinical description is
    taken from the bound MONDO term's own definition: feather-shaped opacities and microcysts
    in the corneal epithelium arranged in a band-shaped and sometimes whorled pattern,
    occasionally with impaired vision. MCOLN1 encodes mucolipin TRP cation channel 1
    (HGNC:13356), whose biallelic loss causes mucolipidosis IV — a separate disease, and the
    only MCOLN1 relationship ClinGen has curated; how the corneal phenotype arises is not
    established, and no mechanism is asserted here.
  subtype_term:
    preferred_term: Lisch epithelial corneal dystrophy
    term:
      id: MONDO:0010425
      label: Lisch epithelial corneal dystrophy
  genes:
  - preferred_term: MCOLN1
    term:
      id: hgnc:13356
      label: MCOLN1
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lisch epithelial corneal dystrophy, previously reported as X-linked, has been discovered to be autosomal dominant ( MCOLN1 mutations, chromosome 19)."
    explanation: >-
      Sole source for both the gene and the correction of the inheritance mode. MONDO
      still carries "corneal dystrophy, Lisch epithelial, X-linked dominant" as a
      synonym of MONDO:0010425 while recording the MCOLN1 edge, so the ontology
      currently asserts both readings at once.
  review_notes: >-
    The MCOLN1 attribution was checked rather than assumed. MCOLN1 is at 19p13.2
    (HGNC:13356, retrieved 2026-09-24), an autosome, which contradicts MONDO's retained
    X-linked synonym; ClinGen curates MCOLN1 only against mucolipidosis type IV
    (Definitive, AR) and has no corneal-dystrophy assertion. IC3D edition 3 resolves
    the contradiction in favour of autosomal dominant MCOLN1, so the gene edge is
    supported and the stale synonym is the defect.
- name: CHED
  display_name: Congenital hereditary endothelial dystrophy (SLC4A11)
  classification: entity
  description: >-
    Autosomal recessive congenital failure of the corneal endothelium, presenting with
    corneal opacification and nystagmus; the bound MONDO term's definition adds a diffuse
    ground-glass appearance of the corneas and marked corneal thickening from birth.
    SLC4A11 encodes a membrane-bound sodium-borate cotransporter; the reported
    variants act by blocking membrane targeting or through nonsense-mediated decay, so
    the mechanism is loss of endothelial solute transport rather than deposition of
    abnormal material. Formerly called CHED2, after the dissolution of autosomal
    dominant CHED1.
  subtype_term:
    preferred_term: congenital hereditary endothelial dystrophy of cornea
    term:
      id: MONDO:0009019
      label: congenital hereditary endothelial dystrophy of cornea
  genes:
  - preferred_term: SLC4A11
    term:
      id: hgnc:16438
      label: SLC4A11
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:16767101
    reference_title: Mutations in sodium-borate cotransporter SLC4A11 cause recessive congenital hereditary endothelial dystrophy (CHED2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe seven different mutations in the SLC4A11 gene in ten families with autosomal recessive CHED."
    explanation: >-
      Seven variants across ten independent recessive CHED families is the original and
      still the principal evidence for the gene and for the recessive mode.
- name: FCD
  display_name: Fleck corneal dystrophy (PIKFYVE)
  classification: entity
  description: >-
    Autosomal dominant scattering of numerous small white flecks through all layers of the
    corneal stroma. The bound MONDO term's definition characterises the opacities as
    asymptomatic and non-progressive with no effect on visual acuity, which is why this row
    carries no link to visual impairment. PIKFYVE (reported as PIP5K3 when the gene was
    identified) controls the
    morphogenesis and function of multivesicular bodies and the sorting of peripheral
    endosomes; the gene report states that the histological and clinical characteristics of
    affected patients are consistent with that endosomal sorting role, which is as far as
    the mechanistic claim goes.
  subtype_term:
    preferred_term: fleck corneal dystrophy
    term:
      id: MONDO:0007376
      label: fleck corneal dystrophy
  genes:
  - preferred_term: PIKFYVE
    term:
      id: hgnc:23785
      label: PIKFYVE
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15902656
    reference_title: Mutations in PIP5K3 are associated with François-Neetens mouchetée fleck corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing analysis disclosed missense, frameshift, and/or protein-truncating mutations in 8 of 10 families with CFD that were studied"
    explanation: >-
      Variants in eight of ten fleck-dystrophy families establish the gene. The paper
      calls it PIP5K3, which HGNC records as the previous symbol for PIKFYVE
      (hgnc:23785).
- name: PPPCD
  display_name: Punctiform and polychromatic pre-Descemet corneal dystrophy (PRDX3)
  classification: entity
  description: >-
    Autosomal dominant punctate polychromatic opacities immediately anterior to Descemet
    membrane, typically asymptomatic, caused by PRDX3 variants. IC3D edition 3 groups it
    with the pre-Descemet corneal dystrophies and grades it category 1, distinguishing it
    phenotypically from the category 4 entity pre-Descemet corneal dystrophy, which
    dismech curates separately in `Pre-descemet_Corneal_Dystrophy.yaml`. PRDX3 encodes
    peroxiredoxin 3 (HGNC:9354); how variants in it produce deep stromal deposits is not
    established, and no mechanism is asserted here.
  subtype_term:
    preferred_term: corneal dystrophy, punctiform and polychromatic pre-descemet
    term:
      id: MONDO:0859248
      label: corneal dystrophy, punctiform and polychromatic pre-descemet
  genes:
  - preferred_term: PRDX3
    term:
      id: hgnc:9354
      label: PRDX3
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pre-Descemet corneal dystrophies include category 1, autosomal dominant, punctiform and polychromatic pre-Descemet corneal dystrophy (PPPCD) ( PRDX3 mutations, chromosome 10)."
    explanation: >-
      Gives the gene, the dominant mode and the category 1 evidence grade in one
      sentence, and separates PPPCD from the category 4 pre-Descemet entity.
  review_notes: >-
    Not listed as a child of any of the four anatomic categories here. MONDO files
    MONDO:0859248 as a direct child of MONDO:0018102 rather than under stromal or
    pre-Descemet corneal dystrophy, while IC3D edition 3 groups PPPCD with the
    pre-Descemet dystrophies; rather than pick one, the row is left unparented and the
    discrepancy recorded.


discussions:
- discussion_id: ic3d_evidence_category_is_part_of_the_classification
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Layer-Restricted Corneal Deposition or Cellular Failure"
  prompt: >-
    How should dismech represent an entity whose status as a distinct disease is itself
    graded by the source classification?
  rationale: >-
    IC3D assigns every corneal dystrophy an evidence category from 1 (well characterised
    clinically, histopathologically and genetically) to 4 (a suspected entity that may
    not be distinct), and revises those grades between editions. Entities have been
    dissolved on review — autosomal dominant CHED (CHED1) was found insufficiently
    distinct and reassigned to posterior polymorphous corneal dystrophy — and others
    have been promoted as genes were identified. dismech has no slot for "the source
    classification doubts this is a real disease", so an IC3D category 4 entity and a
    category 1 entity would be curated identically. This matters because MONDO carries
    descendants of `MONDO:0018102` that correspond to entities IC3D has since
    downgraded or merged, and curating them as subtypes would assert more confidence
    than the source does. No category 3 or 4 entity is curated as a subtype here.
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The new information was used to update the anatomic classification and each of the 22 standardized templates including the level of evidence for being a corneal dystrophy"
    explanation: >-
      Establishes that the evidence grade is a maintained part of each entity's
      standardized template, not an informal aside.
  - reference: PMID:25564336
    reference_title: IC3D classification of corneal dystrophies--edition 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The so-called autosomal dominant inherited CHED (formerly CHED1) is insufficiently distinct to continue to be considered a unique corneal dystrophy."
    explanation: >-
      A worked instance of an entity being dissolved on review — the concrete case that
      makes this a curation problem rather than a theoretical one.

- discussion_id: mondo_files_two_non_dystrophies_under_this_family
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "has_subtypes#"
  prompt: >-
    Should a disease that MONDO classifies as a corneal dystrophy, but that the source
    classification for corneal dystrophies does not recognise as one, be curated as a
    subtype here?
  rationale: >-
    Two descendants of MONDO:0018102 are curated neither as entity rows here nor as
    children of any anatomic category, and the reason is the same for both: the
    authoritative classification of the corneal dystrophies does not contain them.

    MONDO:0007848 autosomal dominant keratitis is a direct child of MONDO:0018102 with a
    PAX6 causal gene edge. Its reported features include corneal vascularization and
    foveal hypoplasia, neither of which is a corneal dystrophy finding — IC3D defines the
    dystrophies as non-inflammatory and cornea-restricted — and the gene-identification
    paper places it with the PAX6 anterior segment malformations rather than with the
    dystrophies. ClinGen curates PAX6 only as PAX6-related ocular dysgenesis (Definitive,
    autosomal dominant), and dismech's PAX6 home is Aniridia.yaml. Ruling: out of scope
    for this family; the concept belongs with the PAX6 ocular dysgenesis spectrum.

    MONDO:0014089 corneal intraepithelial dyskeratosis-palmoplantar
    hyperkeratosis-laryngeal dyskeratosis syndrome is filed by MONDO under MONDO:0020212
    superficial corneal dystrophy with an NLRP1 causal gene edge. It is a multisystem
    NLRP1 inflammasome disorder with palmoplantar and laryngeal involvement, and the
    corneal finding is one feature of a syndrome rather than an isolated dystrophy. The
    cached full text of IC3D edition 3 (PMID:38359414) contains no occurrence of
    "dyskeratosis" or of "NLRP1". Ruling: out of scope for this family; it would need its
    own entry as an NLRP1-related autoinflammatory syndrome, which dismech does not yet
    have.

    Both rulings are disagreements with MONDO's placement rather than with its gene
    edges, which are themselves well supported.
  evidence:
  - reference: PMID:7668281
    reference_title: Mutation of the PAX6 gene in patients with autosomal dominant keratitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant keratitis (ADK) is an eye disorder chiefly characterized by corneal opacification and vascularization and by foveal hypoplasia."
    explanation: >-
      The features that put autosomal dominant keratitis outside the corneal dystrophy
      definition: corneal vascularization, and a retinal malformation.
  - reference: PMID:7668281
    reference_title: Mutation of the PAX6 gene in patients with autosomal dominant keratitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The finding that mutations in PAX6 underlie ADK, along with a recent report that mutations in PAX6 also underlie Peters anomaly, implicates PAX6 broadly in human anterior segment malformations."
    explanation: >-
      The gene-identification paper's own placement of the disease, with Peters anomaly
      among the PAX6 anterior segment malformations rather than among the dystrophies.
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The new information was used to update the anatomic classification and each of the 22 standardized templates including the level of evidence for being a corneal dystrophy"
    explanation: >-
      Establishes that IC3D edition 3 enumerates the corneal dystrophies as a closed set
      of 22 templated entities, which is what makes an absence from it informative rather
      than merely an omission.
notes: >
  Scope. A thin root over an already-populated subtree. It binds MONDO:0018102 and
  carries the IC3D anatomic axis, the shared route to loss of corneal transparency, and
  the layer-to-operation correspondence once. Entity-level mechanism, genetics and
  management stay in the existing entries.

  Subtype axis. `has_subtypes` follows the IC3D four-category anatomic classification,
  and each category is bound to the MONDO term that denotes it — MONDO happens to carry
  intermediate terms matching three of the four categories exactly, and
  `MONDO:0000766` corneal endothelial dystrophy for the fourth. Three of the four
  categories already have curated dismech entries.

  Second axis: gene-defined entities. Eight IC3D entities are now carried as
  `classification: entity` rows beside the four anatomic categories, each bound to its
  own MONDO term and its causal gene. They are not a second, competing partition: the
  anatomic rows name them through `children`, so MECD1, MECD2, GDLD, ERED and LECD sit
  under the epithelial and subepithelial category, FCD under stromal, and CHED under
  endothelial. PPPCD is deliberately left unparented — MONDO files `MONDO:0859248` as a
  direct child of `MONDO:0018102` while IC3D groups PPPCD with the pre-Descemet
  dystrophies, and the row records that rather than resolving it. The entities chosen are
  those whose gene is established and which have no dismech entry of their own; the
  epithelial and subepithelial category still has no dedicated file, and these five rows
  are what stands in for one.

  Genes reach the pathograph, and by layer. Five mechanism nodes carry the layer-specific
  lesions — keratin filament fragility (KRT12, KRT3), basement membrane adhesion failure
  (COL17A1), subepithelial amyloid deposition (TACSTD2), corneal stromal endosomal sorting
  (PIKFYVE) and endothelial sodium-borate cotransport failure (SLC4A11) — rather than one
  flat gene list, because in this family the layer is the mechanism. They run in parallel
  with the family-level trigger node, which states the shared shape and carries the IC3D
  classification evidence; the five state what actually goes wrong in each layer. MCOLN1
  and PRDX3 are bound on the family-level node instead, because for Lisch dystrophy and
  PPPCD the affected layer is known and the mechanism is not.

  No disease-level `genetic:` section. A flat per-gene list at this level would assert a
  single genetic architecture for a family that has four, and each gene's detail belongs
  either to its entity row here or to the child entry that owns the entity.

  Unlisted siblings checked. All 57 distinct descendants of MONDO:0018102 were enumerated
  through the ontology hierarchy and each queried for a causal gene edge, rather than only
  the ten concepts named in the gap list. Three further
  descendants carry one. `MONDO:0007097` Finnish type amyloidosis (GSN) is already curated as
  its own entry and held in the `Hereditary_Systemic_Amyloidoses` grouping — it is a systemic
  amyloidosis whose corneal lattice is one feature, so it is correctly not a member of this
  family's subtype list. `MONDO:0012401` congenital stromal corneal dystrophy (DCN) is
  curated as the `CSCD` subtype of `Stromal_Corneal_Dystrophy.yaml`. `MONDO:0007375`
  epithelial basement membrane dystrophy (TGFBI) is bound nowhere in dismech and is the one
  real remaining gap in this subtree; it is not added here because its natural home is
  `TGFBI_Corneal_Dystrophies.yaml`, whose subtype list it is missing from, and because most
  cases of that dystrophy are not familial. `MONDO:0010426` X-linked endothelial corneal
  dystrophy has no gene edge and no dismech binding.

  MONDO carries a fifth intermediate that overlaps the IC3D categories. `MONDO:0020212`
  superficial corneal dystrophy is a direct child of `MONDO:0018102` holding twelve
  descendants that mostly also sit under the epithelial and subepithelial or epithelial-stromal
  TGFBI categories, and `MONDO:0007381` epithelial recurrent erosion dystrophy sits under it
  alone — so ERED is not reachable from `MONDO:0000763`, the term bound to the epithelial and
  subepithelial category here. The ERED row is nevertheless listed as a child of that category
  because IC3D places it there. `MONDO:0020214` posterior corneal dystrophy overlaps
  `MONDO:0000766` in the same way.

  Two concepts MONDO files under corneal dystrophy that are not curated here.
  `MONDO:0007848` autosomal dominant keratitis (PAX6) and `MONDO:0014089` corneal
  intraepithelial dyskeratosis-palmoplantar hyperkeratosis-laryngeal dyskeratosis
  syndrome (NLRP1) are both descendants of `MONDO:0018102`, and neither appears anywhere
  in IC3D edition 3 — searching the cached full text of PMID:38359414 for "keratitis"
  returns only a reference title from 1890, and for "dyskeratosis" and "NLRP1" returns
  nothing at all. See the `mondo_files_two_non_dystrophies_under_this_family` discussion.

  Honest limit on the shared pathograph. The endothelial category reaches loss of
  transparency by a mechanistically different route from the other three — pump failure
  and stromal oedema rather than deposition of abnormal material. The trigger node says
  so explicitly rather than papering over it with a single "abnormal accumulation"
  claim. If that divergence later proves to warrant separate chains, the endothelial
  arm is the natural place to split.

  Not curated. No treatments section: management is layer- and severity-driven and is
  described at the consequence node, and the specific agents are not dystrophy-specific.
  IC3D category 3 and 4 entities are deliberately excluded from `has_subtypes`; see the
  `ic3d_evidence_category_is_part_of_the_classification` discussion.

name: Corneal Dystrophy
creation_date: '2026-08-19T12:00:00Z'
category: Mendelian
description: >
  Corneal dystrophy is the family of inherited, usually bilateral and progressive
  corneal opacifications that arise without inflammation or a preceding external
  insult. Abnormal material accumulates in, or the cells of, one layer of the cornea,
  and because the cornea's optical function depends on transparency, almost any such
  deposit eventually costs vision. Presentation ranges from lifelong asymptomatic
  opacity found on examination to recurrent corneal erosions with pain and photophobia,
  to progressive visual loss requiring keratoplasty.

  The family is organised by the corneal layer of origin. The International Committee
  for Classification of Corneal Dystrophies (IC3D) groups them into four anatomic
  categories: epithelial and subepithelial dystrophies, epithelial-stromal TGFBI
  dystrophies, stromal dystrophies, and endothelial dystrophies. The
  epithelial-stromal TGFBI group is the one category defined by a gene rather than
  purely by depth — allelic variants of TGFBI produce granular, lattice and
  Reis-Bucklers phenotypes that classical anatomic classification had scattered across
  layers, and pulling them together was the substantive change of the modern scheme.

  IC3D also grades each entity by how well established it is as a genuine dystrophy,
  from category 1 (well characterised clinically, histopathologically and genetically)
  down to category 4 (a suspected but not confirmed entity). That evidence grade is
  part of the classification rather than a commentary on it, and several long-standing
  named dystrophies have been reclassified or dissolved between editions.

  This root entry carries only the family-level material — the anatomic axis, the
  evidence-grading convention, and the shared route from layer-specific deposition to
  loss of corneal transparency. Entity-level detail is not re-derived here: see
  `TGFBI_Corneal_Dystrophies.yaml`, `Stromal_Corneal_Dystrophy.yaml`,
  `Fuchs_Endothelial_Corneal_Dystrophy.yaml`,
  `Posterior_Polymorphous_Corneal_Dystrophy.yaml` and
  `Schnyder_Corneal_Dystrophy.yaml`.
disease_term:
  preferred_term: corneal dystrophy
  term:
    id: MONDO:0018102
    label: corneal dystrophy
synonyms:
- hereditary corneal dystrophy
- corneal dystrophies
categories:
- Ophthalmic Disorder
- Hereditary Eye Disease
parents:
- Corneal disease
- Hereditary eye disease

has_subtypes:
- name: Epithelial and Subepithelial
  display_name: Epithelial and Subepithelial Dystrophies
  classification: anatomic
  description: >-
    IC3D anatomic category 1. Dystrophies of the corneal epithelium, its basement
    membrane and Bowman layer — epithelial basement membrane dystrophy, Meesmann
    corneal dystrophy (KRT12/KRT3), Lisch epithelial corneal dystrophy, gelatinous
    drop-like corneal dystrophy and the epithelial recurrent erosion dystrophies,
    which include a COL17A1-associated category 1 entity. Recurrent erosion is the
    characteristic symptom of this layer. No dismech entry yet.
  subtype_term:
    preferred_term: epithelial and subepithelial corneal dystrophy
    term:
      id: MONDO:0000763
      label: epithelial and subepithelial corneal dystrophy
- name: Epithelial-Stromal TGFBI
  display_name: Epithelial-Stromal TGFBI Dystrophies
  classification: genetic
  description: >-
    IC3D anatomic category 2, and the one category defined by its gene. Allelic TGFBI
    variants produce Reis-Bucklers, Thiel-Behnke, lattice and granular corneal
    dystrophies, whose deposits span the epithelial basement membrane and anterior
    stroma. Fully curated in `TGFBI_Corneal_Dystrophies.yaml`.
  subtype_term:
    preferred_term: epithelial-stromal TGFBI dystrophy
    term:
      id: MONDO:0000764
      label: epithelial-stromal TGFBI dystrophy
  genes:
  - preferred_term: TGFBI
    term:
      id: hgnc:11771
      label: TGFBI
- name: Stromal
  display_name: Stromal Dystrophies
  classification: anatomic
  description: >-
    IC3D anatomic category 3. Dystrophies in which abnormal material accumulates within
    the corneal stroma without a TGFBI basis — macular corneal dystrophy (CHST6,
    autosomal recessive), Schnyder corneal dystrophy (UBIAD1, corneal cholesterol and
    phospholipid deposition), fleck, congenital stromal and central cloudy dystrophy of
    Francois. Curated in `Stromal_Corneal_Dystrophy.yaml`, with Schnyder held separately
    in `Schnyder_Corneal_Dystrophy.yaml`.
  subtype_term:
    preferred_term: stromal corneal dystrophy
    term:
      id: MONDO:0020213
      label: stromal corneal dystrophy
- name: Endothelial
  display_name: Endothelial Dystrophies
  classification: anatomic
  description: >-
    IC3D anatomic category 4. Dystrophies of the corneal endothelium and Descemet
    membrane — Fuchs endothelial corneal dystrophy, posterior polymorphous corneal
    dystrophy, congenital hereditary endothelial dystrophy (SLC4A11) and X-linked
    endothelial corneal dystrophy. Mechanistically distinct from the other three
    categories: the endothelium is a non-regenerating pump, so its failure causes
    stromal oedema and loss of transparency rather than deposition of abnormal
    material. Curated in `Fuchs_Endothelial_Corneal_Dystrophy.yaml` and
    `Posterior_Polymorphous_Corneal_Dystrophy.yaml`.
  subtype_term:
    preferred_term: corneal endothelial dystrophy
    term:
      id: MONDO:0000766
      label: corneal endothelial dystrophy

prevalence:
- population: General population
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 90.0
  notes: >-
    Reported as approximately 0.09% of the population, normalised here to 90 per
    100,000. Covers the corneal dystrophies as a class; individual entities range from
    relatively common (epithelial basement membrane dystrophy, Fuchs) to fewer than a
    dozen reported families.
  evidence:
  - reference: PMID:28583694
    reference_title: Corneal dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corneal dystrophies affect approximately 0.09% of the population."
    explanation: >-
      Gives a class-level population prevalence figure for the corneal dystrophies.

pathophysiology:
- name: Layer-Restricted Corneal Deposition or Cellular Failure
  biological_scale: TISSUE
  role: trigger
  description: >-
    Each dystrophy begins with an inherited defect expressed in one corneal layer, and
    the layer determines both the mechanism and the syndrome. In the epithelial,
    epithelial-stromal and stromal categories the lesion causes abnormal material to
    accumulate — mutant TGFBI protein in the epithelial-stromal group, abnormally
    sulphated keratan sulphate in macular dystrophy, cholesterol and phospholipid in
    Schnyder dystrophy. The endothelial category works differently: the corneal
    endothelium does not regenerate and functions as a dehydrating pump, so its
    progressive failure admits fluid into the stroma instead of depositing anything.
    Curating these as one node reflects a shared consequence, not a shared molecular
    mechanism.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  genes:
  - preferred_term: TGFBI
    term:
      id: hgnc:11771
      label: TGFBI
  - preferred_term: CHST6
    term:
      id: hgnc:6938
      label: CHST6
  - preferred_term: UBIAD1
    term:
      id: hgnc:30791
      label: UBIAD1
  - preferred_term: SLC4A11
    term:
      id: hgnc:16438
      label: SLC4A11
  evidence:
  - reference: PMID:25564336
    reference_title: IC3D classification of corneal dystrophies--edition 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the basis of revisiting the cellular origin of corneal dystrophy, a modified anatomic classification is proposed consisting of (1) epithelial and subepithelial dystrophies, (2) epithelial-stromal TGFBI dystrophies, (3) stromal dystrophies, and (4) endothelial dystrophies."
    explanation: >-
      States the four-category anatomic classification and, critically, that it was
      derived by revisiting the cellular origin of each dystrophy — which is what makes
      the corneal layer the organising principle rather than a descriptive convenience.
  downstream:
  - target: Loss of Corneal Transparency
    causal_link_type: DIRECT
    description: >-
      Deposited material scatters light directly; endothelial pump failure does so
      indirectly by allowing the stroma to imbibe fluid and lose its ordered collagen
      spacing. Either route degrades the cornea's optical function.
    evidence:
    - reference: PMID:38359414
      reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Deposition of opaque substances in epithelial, subepithelial, epithelial-stromal TGFBI or stromal corneal dystrophies may also result in vision reduction. Visual loss may also occur in endothelial corneal dystrophies because of corneal epithelial or stromal edema consequent to endothelial dysfunction."
      explanation: >-
        Covers both arms of this edge separately: deposited opaque material reduces
        vision in the epithelial, epithelial-stromal TGFBI and stromal categories, while
        in the endothelial category visual loss instead follows epithelial or stromal
        edema consequent to endothelial dysfunction.

- name: Loss of Corneal Transparency
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The convergent node. Corneal transparency depends on regular collagen fibril
    spacing, a deturgesced stroma and an intact smooth epithelium; every dystrophy
    degrades at least one of these. The result is corneal opacity, with or without
    stromal oedema depending on whether the endothelium is the affected layer.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deposition of opaque substances in epithelial, subepithelial, epithelial-stromal TGFBI or stromal corneal dystrophies may also result in vision reduction. Visual loss may also occur in endothelial corneal dystrophies because of corneal epithelial or stromal edema consequent to endothelial dysfunction."
    explanation: >-
      Establishes that loss of vision is the shared endpoint of both routes into this
      node — opaque deposition in three categories, and edema from endothelial
      dysfunction in the fourth.
  downstream:
  - target: Progressive Visual Impairment Requiring Surgical Restoration
    causal_link_type: DIRECT
    description: >-
      Once opacity or oedema crosses the visual axis, optical correction cannot
      compensate and restoring vision requires physically removing or replacing the
      affected layer.
    evidence:
    - reference: PMID:28583694
      reference_title: Corneal dystrophies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Anterior lamellar or endothelial keratoplasty are now preferred to penetrating keratoplasty, although the latter still remains the only possible option in some cases."
      explanation: >-
        Supports the layer-selective half of this claim: restoring vision means
        replacing the affected layer, and lamellar or endothelial keratoplasty is now
        preferred over penetrating keratoplasty for that reason.

- name: Progressive Visual Impairment Requiring Surgical Restoration
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint. Management escalates from lubricants, hyperosmotic agents and
    bandage contact lenses, through phototherapeutic or lamellar keratectomy, to
    keratoplasty. Because the dystrophies are layer-restricted, layer-selective grafts
    (anterior lamellar for anterior disease, endothelial keratoplasty for endothelial
    disease) are now preferred over penetrating keratoplasty — the anatomic
    classification maps directly onto the choice of operation. Recurrence in the graft
    is possible because the genetic defect persists in the host.
  evidence:
  - reference: PMID:28583694
    reference_title: Corneal dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anterior lamellar or endothelial keratoplasty are now preferred to penetrating keratoplasty, although the latter still remains the only possible option in some cases."
    explanation: >-
      Documents the preference for lamellar and endothelial keratoplasty over
      penetrating keratoplasty, while noting the latter remains necessary in some cases.


discussions:
- discussion_id: ic3d_evidence_category_is_part_of_the_classification
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Layer-Restricted Corneal Deposition or Cellular Failure"
  prompt: >-
    How should dismech represent an entity whose status as a distinct disease is itself
    graded by the source classification?
  rationale: >-
    IC3D assigns every corneal dystrophy an evidence category from 1 (well characterised
    clinically, histopathologically and genetically) to 4 (a suspected entity that may
    not be distinct), and revises those grades between editions. Entities have been
    dissolved on review — autosomal dominant CHED (CHED1) was found insufficiently
    distinct and reassigned to posterior polymorphous corneal dystrophy — and others
    have been promoted as genes were identified. dismech has no slot for "the source
    classification doubts this is a real disease", so an IC3D category 4 entity and a
    category 1 entity would be curated identically. This matters because MONDO carries
    descendants of `MONDO:0018102` that correspond to entities IC3D has since
    downgraded or merged, and curating them as subtypes would assert more confidence
    than the source does. No category 3 or 4 entity is curated as a subtype here.
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The new information was used to update the anatomic classification and each of the 22 standardized templates including the level of evidence for being a corneal dystrophy"
    explanation: >-
      Establishes that the evidence grade is a maintained part of each entity's
      standardized template, not an informal aside.
  - reference: PMID:25564336
    reference_title: IC3D classification of corneal dystrophies--edition 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The so-called autosomal dominant inherited CHED (formerly CHED1) is insufficiently distinct to continue to be considered a unique corneal dystrophy."
    explanation: >-
      A worked instance of an entity being dissolved on review — the concrete case that
      makes this a curation problem rather than a theoretical one.

notes: >
  Scope. A thin root over an already-populated subtree. It binds MONDO:0018102 and
  carries the IC3D anatomic axis, the shared route to loss of corneal transparency, and
  the layer-to-operation correspondence once. Entity-level mechanism, genetics and
  management stay in the existing entries.

  Subtype axis. `has_subtypes` follows the IC3D four-category anatomic classification,
  and each category is bound to the MONDO term that denotes it — MONDO happens to carry
  intermediate terms matching three of the four categories exactly, and
  `MONDO:0000766` corneal endothelial dystrophy for the fourth. Three of the four
  categories already have curated dismech entries.

  Honest limit on the shared pathograph. The endothelial category reaches loss of
  transparency by a mechanistically different route from the other three — pump failure
  and stromal oedema rather than deposition of abnormal material. The trigger node says
  so explicitly rather than papering over it with a single "abnormal accumulation"
  claim. If that divergence later proves to warrant separate chains, the endothelial
  arm is the natural place to split.

  Not curated. No treatments section: management is layer- and severity-driven and is
  described at the consequence node, and the specific agents are not dystrophy-specific.
  IC3D category 3 and 4 entities are deliberately excluded from `has_subtypes`; see the
  `ic3d_evidence_category_is_part_of_the_classification` discussion.

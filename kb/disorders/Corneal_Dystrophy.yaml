    yellowish-grey gelatinous masses that severely impair acuity by the third decade. The
    truncated protein itself aggregates in the perinuclear region of the cell that makes it,
    where the normal protein is distributed diffusely through the cytoplasm — so the
    intracellular aggregate and the subepithelial amyloid deposit are recorded as two
    observations rather than collapsed into one process.

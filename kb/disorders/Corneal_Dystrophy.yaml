- name: Subepithelial Corneal Amyloid Deposition
  biological_scale: TISSUE
  role: trigger
  description: >-
    The gelatinous drop-like mechanism. Three nonsense variants and one frameshift in
    TACSTD2 (reported as M1S1) were found in the original gene study, so the mechanism is

diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    A multigene panel including ATF6, CNGA3, CNGB3, GNAT2, PDE6C, and PDE6H,
    or comprehensive genomic testing, confirms the molecular diagnosis and
    distinguishes ATF6-related disease from the phototransduction-gene forms
    of achromatopsia.
  results: >-
    Identification of biallelic pathogenic ATF6 variants confirms the
    diagnosis.
  evidence:
  - reference: "url:https://www.ncbi.nlm.nih.gov/books/NBK1418/"
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "establishes the molecular diagnosis"
    explanation: GeneReviews specifies the multigene panel approach for molecular diagnosis of achromatopsia including ATF6.
- name: Electroretinography
  diagnosis_term:
    preferred_term: electroretinography
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Full-field ERG is the diagnostic cornerstone, and is also used to
    distinguish the classic achromatopsia (cone-only involvement) from the
    cone-rod dystrophy (combined cone and rod involvement) ATF6 phenotypes.
  results: >-
    Absent or markedly diminished photopic responses confirm cone
    dysfunction; additional scotopic response reduction indicates the
    cone-rod dystrophy subtype rather than classic achromatopsia.
  evidence:
  - reference: PMID:28812650
    reference_title: "Autosomal recessive cone-rod dystrophy can be caused by mutations in the ATF6 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "extinguished cone responses but also decreased rod responses"
    explanation: ERG differentiates the cone-rod dystrophy subtype from classic achromatopsia by showing combined rod/cone loss.
- name: Optical coherence tomography
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  description: >-
    OCT characterizes the severity of foveal hypoplasia and residual cone
    structure, which is more severely reduced in ATF6-related disease than
    in the phototransduction-gene forms of achromatopsia.
  results: >-
    Absence of the ellipsoid-zone band within the foveal region or a
    hyporeflective zone is seen in essentially all ATF6-related cases.
  evidence:
  - reference: PMID:31237654
    reference_title: "Characterization of Retinal Structure in ATF6-Associated Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Absence of the EZ band within the foveal region (grade 3) or appearance of a hyporeflective zone (grade 4) was seen in all subjects"
    explanation: Quantifies the severe, near-universal OCT abnormality in ATF6-related disease.
treatments:
- name: Supportive care and monitoring
  description: >-
    Management is currently entirely supportive: dark or special-filter
    glasses or red-tinted contact lenses to reduce photophobia, low-vision
    aids such as high-powered magnifiers and digital/electronic devices, and
    regular ophthalmologic monitoring.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: "url:https://www.ncbi.nlm.nih.gov/books/NBK1418/"

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Achromatopsia (ACHM) is an autosomal recessive disorder characterized by color blindness, photophobia, nystagmus and severely reduced visual acuity."
    explanation: Supports genetic counseling given the confirmed autosomal recessive inheritance pattern.
notes: >-
  Unlike CNGA3- and CNGB3-related achromatopsia, which have completed and
  active AAV gene-augmentation clinical trials, no ATF6-specific gene
  therapy trial exists as of the most recent review, and ATF6-related
  disease's near-total loss of foveal cone structure (rather than the
  persistent-but-abnormal cones seen in some CNGA3 cases) may make patients
  poorer candidates for cone-targeted gene replacement even if a trial were
  developed. This entry (MONDO:0100447) models the ATF6 gene-disease
  mechanism and its full phenotypic spectrum (classic achromatopsia plus
  the cone-rod dystrophy presentation and documented macular involvement);
  the ACHM7 subtype specifically is also modeled within Achromatopsia.yaml for
  cross-gene comparison against the five phototransduction-cascade
  achromatopsia genes.

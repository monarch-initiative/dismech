name: ATF6-Related Retinopathy
creation_date: "2026-08-03T00:00:00Z"
category: Mendelian
description: >-
  ATF6-related retinopathy is an autosomal recessive cone photoreceptor
  disorder caused by biallelic pathogenic variants in ATF6, encoding
  activating transcription factor 6, a ubiquitously expressed ER-stress
  sensor and key regulator of the unfolded protein response (UPR). Unlike
  the five other achromatopsia genes (CNGA3, CNGB3, GNAT2, PDE6C, PDE6H),
  which encode components of the cone phototransduction cascade directly,
  ATF6 acts upstream through cone photoreceptor development: loss of normal
  ATF6 UPR signaling causes foveal hypoplasia and near-absent cone structure
  rather than simply disabling an intact phototransduction cascade. Most
  patients present with the classic achromatopsia phenotype (designated
  ACHM7 in the achromatopsia gene series), but ATF6 variants have also been
  reported to cause cone-rod dystrophy and macular involvement -- a yellow
  macular lesion with reduced fundus autofluorescence has been documented in
  at least one ATF6-associated patient -- so the clinical spectrum is
  broader than achromatopsia alone. This entry captures
  the ATF6-specific gene-disease mechanism and phenotypic spectrum;
  Achromatopsia.yaml models the ACHM7 subtype within the broader
  achromatopsia disease umbrella and should be consulted for cross-gene
  comparison within that phenotype.
disease_term:
  preferred_term: ATF6-related retinopathy
  term:
    id: MONDO:0100447
    label: ATF6-related retinopathy
has_subtypes:
- name: Classic Achromatopsia
  display_name: Classic Achromatopsia (ACHM7)
  description: >-
    The majority ATF6-related phenotype: complete or near-complete cone
    dysfunction from birth with foveal hypoplasia, corresponding to
    achromatopsia type 7 (ACHM7) in the achromatopsia gene series.
  subtype_term:
    preferred_term: achromatopsia 7
    term:
      id: MONDO:0014677
      label: achromatopsia 7
  evidence:
  - reference: PMID:26029869
    reference_title: "Mutations in the unfolded protein response regulator ATF6 cause the cone dysfunction disorder achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had evidence of foveal hypoplasia and disruption of the cone photoreceptor layer."
    explanation: Founding cohort establishing the classic achromatopsia presentation of ATF6-related disease.
- name: Cone-Rod Dystrophy
  display_name: ATF6-Related Cone-Rod Dystrophy
  description: >-
    A minority phenotype in which cone responses are extinguished but rod
    responses are also decreased, with some residual color discrimination --
    clinically distinct from classic achromatopsia despite the shared
    genetic cause. No ATF6-specific numbered cone-rod dystrophy entry exists
    in OMIM/MONDO (ATF6's only disease-specific identifier is achromatopsia
    7/ACHM7); this subtype is therefore bound to the generic cone-rod
    dystrophy disease-series term rather than a gene-specific one.
  subtype_term:
    preferred_term: cone-rod dystrophy
    term:
      id: MONDO:0015993
      label: cone-rod dystrophy
  evidence:
  - reference: PMID:28812650
    reference_title: "Autosomal recessive cone-rod dystrophy can be caused by mutations in the ATF6 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detailed phenotypic examination revealed extinguished cone responses but also decreased rod responses together with the ability to discriminate some colours suggestive rather for cone-rod dystrophy than achromatopsia."
    explanation: Documents a homozygous ATF6 missense variant producing a cone-rod dystrophy phenotype rather than classic achromatopsia.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported ATF6-related retinopathy families carry biallelic
    (homozygous or compound heterozygous) pathogenic variants.
  evidence:
  - reference: PMID:26029869
    reference_title: "Mutations in the unfolded protein response regulator ATF6 cause the cone dysfunction disorder achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Achromatopsia (ACHM) is an autosomal recessive disorder characterized by color blindness, photophobia, nystagmus and severely reduced visual acuity."
    explanation: Establishes autosomal recessive inheritance in the founding ATF6 cohort.
genetic:
- name: ATF6
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ATF6
    term:
      id: hgnc:791
      label: ATF6
  features: >-
    Biallelic loss- or gain-of-function variants in ATF6 (encoding activating
    transcription factor 6) fall into three functional classes: impaired
    ER-to-Golgi trafficking with diminished transcriptional activity (class
    1), constitutively active transcriptional activity even without ER
    stress (class 2), and complete loss of transcriptional activity from a
    defective bZIP DNA-binding domain (class 3). Multiexon deletions have
    also been reported. ATF6 is a rare cause of achromatopsia overall,
    identified in ten independent families in the founding cohort study.
  evidence:
  - reference: PMID:28028229
    reference_title: "Achromatopsia mutations target sequential steps of ATF6 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "impaired ER-to-Golgi trafficking and diminished regulated intramembrane proteolysis and transcriptional activity"
    explanation: Defines the class 1 (trafficking-impaired) mutation mechanism.
  - reference: PMID:28028229
    reference_title: "Achromatopsia mutations target sequential steps of ATF6 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the entire ATF6 cytosolic domain with fully intact transcriptional activity and constitutive induction of downstream target genes, even in the absence of ER stress"
    explanation: Defines the class 2 (constitutively active) mutation mechanism.
  - reference: PMID:28028229
    reference_title: "Achromatopsia mutations target sequential steps of ATF6 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complete loss of transcriptional activity because of absent or defective bZIP domains"
    explanation: Defines the class 3 (transcriptionally null) mutation mechanism.
  - reference: PMID:32271167
    reference_title: "Multiexon deletion alleles of ATF6 linked to achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous deletion covering exons 8-14 of the ATF6 gene from 2 siblings from the same family."
    explanation: Documents multiexon deletion alleles as an additional ATF6 mutation mechanism.
  - reference: PMID:38419580
    reference_title: "Novel ATF6 homozygous variant in a Chinese patient with achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel splicing variant"
    explanation: Documents a homozygous ATF6 splice-site variant, broadening the mutational spectrum beyond the three functional classes and multiexon deletions.
pathophysiology:
- name: ATF6 Unfolded Protein Response Impairment
  biological_scale: MOLECULAR
  description: >-
    ATF6 is an ER-membrane-resident transcription factor that normally
    migrates from the ER to the Golgi under ER stress, where it undergoes
    regulated intramembrane proteolysis (RIP) to release a cytosolic
    transcriptional-activator domain that upregulates protein-folding
    chaperones. Pathogenic ATF6 variants disrupt this UPR arm through three
    distinct mechanisms rather than a single loss-of-function direction:
    impaired ER-to-Golgi trafficking with diminished RIP and transcriptional
    output, aberrant constitutive transcriptional activation independent of
    ER stress, or complete loss of DNA-binding transcriptional activity.
  genes:
  - preferred_term: ATF6
    term:
      id: hgnc:791
      label: ATF6
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: ATF6-mediated unfolded protein response
    term:
      id: GO:0036500
      label: ATF6-mediated unfolded protein response
    modifier: DYSREGULATED
  downstream:
  - target: Impaired Cone Photoreceptor Development
    description: >-
      Dysregulated ATF6-mediated ER stress response, in either direction,
      disrupts the normal developmental role of ATF6 in the retina.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26063662
      reference_title: "Mutation of ATF6 causes autosomal recessive achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "response to ER stress as mediated by the ATF6 pathway is essential for color vision in humans"
      explanation: Establishes that intact ATF6-mediated ER stress signaling is required for normal human color vision.
  - target: Age- and Genotype-Dependent Rod Involvement
    description: >-
      The same underlying ATF6 UPR impairment that disrupts cone
      developmental signaling also underlies the age- and genotype-dependent
      rod-pathway involvement documented in the Atf6-knockout mouse model.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26029869
      reference_title: "Mutations in the unfolded protein response regulator ATF6 cause the cone dysfunction disorder achromatopsia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Atf6(-/-) mice have normal retinal morphology and function at a young age but develop rod and cone dysfunction with increasing age."
      explanation: Directly links loss of ATF6 UPR function to the later, age-dependent onset of rod (and cone) dysfunction in the knockout model.
  evidence:
  - reference: PMID:26063662
    reference_title: "Mutation of ATF6 causes autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a truncated protein that lacks the DNA binding and transmembrane domains"
    explanation: Documents the truncating founder mutation's effect on ATF6 protein structure.
  - reference: PMID:26063662
    reference_title: "Mutation of ATF6 causes autosomal recessive achromatopsia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in heterologous cells ATF6 protein with the p.Glu119Glyfs*8 variant is mainly confined to the nucleus"
    explanation: Demonstrates aberrant nuclear mislocalization of the truncated ATF6 protein versus cytoplasmic wild-type localization.
  - reference: PMID:32271167
    reference_title: "Multiexon deletion alleles of ATF6 linked to achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNAscope revealed that ATF6 and the related ATF6B transcripts were expressed in cones as well as in all retinal layers in normal human retina."
    explanation: Confirms ATF6 expression in cone photoreceptors and throughout the normal human retina.
- name: Impaired Cone Photoreceptor Development
  biological_scale: CELLULAR
  description: >-
    ATF6-mediated UPR signaling is required for normal cone photoreceptor
    and foveal development. Its disruption -- rather than a direct block of
    an otherwise intact phototransduction cascade, as occurs in the other
    five achromatopsia genes -- produces a severe developmental cone deficit
    with near-absent foveal cone structure.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  locations:
  - preferred_term: fovea centralis
    term:
      id: UBERON:0001786
      label: fovea centralis
  biological_processes:
  - preferred_term: eye photoreceptor cell development
    term:
      id: GO:0042462
      label: eye photoreceptor cell development
    modifier: DECREASED
  downstream:
  - target: Foveal Hypoplasia and Near-Absent Cone Structure
    description: >-
      Impaired cone developmental signaling produces a severely
      underdeveloped fovea with little to no residual cone structure.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31237654
      reference_title: "Characterization of Retinal Structure in ATF6-Associated Achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data demonstrate a near absence of cone structure in subjects harboring ATF6 mutations. This implicates ATF6 as having a major role in cone development"
      explanation: Directly links ATF6 loss of function to a severe cone developmental deficit.
  evidence:
  - reference: "url:https://www.ncbi.nlm.nih.gov/books/NBK1418/"
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "usually have a poorly formed or absent foveal pit"
    explanation: GeneReviews identifies absent/poorly formed foveal pit as the distinguishing structural feature of ATF6-associated disease.
- name: Foveal Hypoplasia and Near-Absent Cone Structure
  biological_scale: TISSUE
  description: >-
    The structural endpoint of impaired cone development: foveal hypoplasia
    with little to no remnant foveal cone mosaic, more severe than the
    residual (if abnormal) foveal cones seen in the phototransduction-gene
    forms of achromatopsia such as CNGA3.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  locations:
  - preferred_term: fovea centralis
    term:
      id: UBERON:0001786
      label: fovea centralis
  evidence:
  - reference: PMID:31237654
    reference_title: "Characterization of Retinal Structure in ATF6-Associated Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Foveal hypoplasia was observed in all subjects with ATF6 mutations."
    explanation: Confirms foveal hypoplasia as a consistent (near-universal) structural finding across ATF6-associated cases.
  - reference: PMID:31237654
    reference_title: "Characterization of Retinal Structure in ATF6-Associated Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence of remnant foveal cone structure using confocal AOSLO"
    explanation: Adaptive-optics imaging directly documents the near-total absence of residual foveal cone structure.
  - reference: PMID:38419580
    reference_title: "Novel ATF6 homozygous variant in a Chinese patient with achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a loss of the foveal pit"
    explanation: Independent case report corroborating loss of the foveal pit as a structural finding in ATF6-associated disease.
  downstream:
  - target: Reduced Visual Acuity
    description: Near-absent foveal cone structure severely limits central visual acuity.
    causal_link_type: DIRECT
    evidence:
    - reference: "url:https://www.ncbi.nlm.nih.gov/books/NBK1418/"
      reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "reduced visual acuity"
      explanation: GeneReviews lists reduced visual acuity among the cardinal achromatopsia manifestations of foveal cone loss.
  - target: Color Vision Defect
    description: Absence of functioning foveal cone photoreceptors abolishes cone-mediated color discrimination.
    causal_link_type: DIRECT
    evidence:
    - reference: "url:https://www.ncbi.nlm.nih.gov/books/NBK1418/"
      reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "reduced or complete lack of color discrimination"
      explanation: GeneReviews links loss of cone function to impaired or absent color discrimination.
  - target: Foveal Hypoplasia
    description: >-
      The structural endpoint node's defining lesion -- near-total absence
      of the foveal cone mosaic -- is itself the clinical finding of foveal
      hypoplasia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31237654
      reference_title: "Characterization of Retinal Structure in ATF6-Associated Achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Foveal hypoplasia was observed in all subjects with ATF6 mutations."
      explanation: Direct structural-to-clinical mapping from near-absent foveal cone structure to observed foveal hypoplasia.
  - target: Abnormal Cone Electroretinogram
    description: >-
      Near-absent foveal cone structure abolishes the photopic (cone-driven)
      ERG signal.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38419580
      reference_title: "Novel ATF6 homozygous variant in a Chinese patient with achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ERG showed relatively normal rod responses and unrecordable cone responses."
      explanation: Directly ties the structural loss of foveal cone structure to an unrecordable cone-driven ERG response in an ATF6-associated patient.
  - target: Photophobia
    description: >-
      Severe cone dysfunction arising from near-absent foveal cone structure
      produces the characteristic early light sensitivity of ATF6-related
      disease.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301591
      reference_title: Achromatopsia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "increased sensitivity to light (photophobia)"
      explanation: GeneReviews lists photophobia among the cardinal manifestations of cone dysfunction in achromatopsia, including the ATF6-associated form.
  - target: Nystagmus
    description: >-
      Poor foveal fixation resulting from near-absent foveal cone structure
      produces the characteristic early pendular nystagmus of ATF6-related
      disease.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301591
      reference_title: Achromatopsia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nystagmus develops during the first few weeks after birth followed by increased sensitivity to bright light."
      explanation: GeneReviews documents early-onset nystagmus as a consequence of the same foveal cone deficit.
- name: Age- and Genotype-Dependent Rod Involvement
  biological_scale: TISSUE
  description: >-
    While the human founder cohorts and Atf6-knockout mice show normal rod
    function at a young age, some genotypes and older individuals show
    additional rod-pathway involvement beyond the primary cone/foveal
    deficit, producing a cone-rod dystrophy phenotype in a minority of
    patients rather than classic stationary achromatopsia.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  evidence:
  - reference: PMID:26029869
    reference_title: "Mutations in the unfolded protein response regulator ATF6 cause the cone dysfunction disorder achromatopsia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Atf6(-/-) mice have normal retinal morphology and function at a young age but develop rod and cone dysfunction with increasing age."
    explanation: Establishes age-dependent rod involvement in the Atf6-knockout mouse model.
  - reference: PMID:28812650
    reference_title: "Autosomal recessive cone-rod dystrophy can be caused by mutations in the ATF6 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detailed phenotypic examination revealed extinguished cone responses but also decreased rod responses together with the ability to discriminate some colours suggestive rather for cone-rod dystrophy than achromatopsia."
    explanation: Documents combined rod and cone involvement in a human ATF6 cone-rod dystrophy case.
  downstream:
  - target: Decreased Rod Response
    description: >-
      Age- and genotype-dependent rod-pathway involvement manifests
      clinically as a measurable decrease in rod (dark-adapted) ERG
      response, distinguishing the cone-rod dystrophy subtype from classic,
      rod-sparing ATF6-related achromatopsia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28812650
      reference_title: "Autosomal recessive cone-rod dystrophy can be caused by mutations in the ATF6 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "extinguished cone responses but also decreased rod responses"
      explanation: Documents the decreased rod ERG response that defines the cone-rod dystrophy subtype.

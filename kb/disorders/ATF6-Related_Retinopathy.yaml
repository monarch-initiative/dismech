    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dark or special filter glasses or red-tinted contact lenses reduce photophobia and may improve visual acuity."
    explanation: GeneReviews-recommended supportive management for photophobia in achromatopsia, including ATF6-related cases.

diagnosis:
- name: Quantitative erythrocyte catalase activity assessment
  description: >-
    Quantitative erythrocyte catalase activity is the defining biochemical
    assay. Marked or near-total deficiency supports acatalasia, while
    intermediate activity can suggest heterozygous hypocatalasemia; testing for
    a familial CAT variant is preferred for carrier confirmation. Oral findings
    alone are neither necessary nor sufficient because most affected people are
    asymptomatic.
  diagnosis_term:
    preferred_term: erythrocyte enzyme activity assessment
    term:
      id: MAXO:0035019
      label: erythrocyte enzyme activity assessment
  results: Markedly reduced erythrocyte catalase activity supports acatalasia; intermediate activity suggests carrier status and should be confirmed molecularly when a familial variant is known.
  evidence:
  - reference: PMID:24522161
    reference_title: Long-term follow-up evaluation of an acatalasemia boy with severe periodontitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

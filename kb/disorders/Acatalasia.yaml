name: Acatalasia
creation_date: "2026-07-06T06:09:44Z"
category: Mendelian
description: >-
  Acatalasia (acatalasemia) is a rare autosomal recessive inborn error caused
  by biallelic CAT pathogenic variants and defined biochemically by marked,
  often near-total deficiency of catalase activity in erythrocytes. Most
  affected people are clinically asymptomatic. In the symptomatic oral
  presentation historically called Takahara disease, hydrogen peroxide
  produced by oral microorganisms at gingival wounds is not efficiently
  detoxified. A proposed local blood-oxidation and oxygen-deprivation mechanism
  may then promote necrotic ulceration, gangrene, severe periodontitis, and tooth
  loss. Exogenous hydrogen
  peroxide is an important methemoglobinemia hazard. An association with type 2
  diabetes has been reported in selected populations, but its generalizability
  and causal mechanism remain uncertain.
disease_term:
  preferred_term: acatalasia
  term:
    id: MONDO:0013571
    label: acatalasia
synonyms:
- Acatalasemia
- Catalase deficiency
- CAT-related acatalasemia
parents:
- Inborn Error of Metabolism
notes: >-
  OMIM:614097; ORPHA:926. Takahara disease is used here for the symptomatic
  oral-ulceration and gangrene presentation, not as an unconditional synonym
  for every person with acatalasia. Heterozygous partial catalase deficiency is
  termed hypocatalasemia and represents the carrier state rather than the
  biallelic disease modeled in this entry.

progression:
- phase: Lifelong biochemical state
  age_range: Birth onward
  notes: >-
    Marked erythrocyte catalase deficiency is lifelong, but most affected
    individuals remain clinically asymptomatic and may be recognized through
    family investigation or biochemical testing rather than symptoms.
  evidence:
  - reference: PMID:24522161
    reference_title: Long-term follow-up evaluation of an acatalasemia boy with severe periodontitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although usually asymptomatic, a syndrome of oral ulcerations and gangrene may be present (Takahara's disease)."
    explanation: The report distinguishes the usually asymptomatic biochemical disorder from its oral symptomatic presentation.
  - reference: PMID:13668563
    reference_title: Carrier state in human acatalasemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected homozygotes have no blood catalase activity, whereas heterozygotes show activities intermediate between this inactivity and the activity of normal controls, without overlap."
    explanation: Biochemical family data establish the marked lifelong activity difference in affected homozygotes and carriers.
- phase: Oral Takahara presentation
  age_range: Variable; classic reports include childhood
  notes: >-
    In a symptomatic subset, gingival injury can progress to necrotic ulcers,
    oral gangrene, severe periodontal and alveolar destruction, tooth mobility,
    and premature tooth loss. Childhood cases are well documented, but
    childhood onset is not asserted as universal.
  evidence:
  - reference: PMID:120431
    reference_title: Acatalasia in two Peruvian siblings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The oral findings in two Peruvian brothers, 10- and 11-years-old, with acatalasia are presented. Gingival necrosis and severe alveolar bone destruction were the main oral manifestations."
    explanation: The sibling report documents a childhood oral-disease presentation with necrosis and alveolar destruction.
  - reference: PMID:39085062
    reference_title: The discovery of acatalasemia (lack of catalase in the blood) and its significance in human genetics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "symptomatic acatalasemia has decreased"
    explanation: The review supports a treatment- and environment-modified decline in the symptomatic oral presentation.
- phase: Treatment-modified periodontal course
  age_range: Long-term follow-up
  notes: >-
    Disease-specific management evidence is limited to case-level experience.
    In one patient, sustained periodontal therapy over 15 years was associated
    with improved periodontal measurements and stable periodontal status.
  evidence:
  - reference: PMID:24522161
    reference_title: Long-term follow-up evaluation of an acatalasemia boy with severe periodontitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 15-y treatments, the periodontal pocket depth ≥4mm and clinical attachment loss reduced to 30% and 3.7±1.2mm."
    explanation: The long-term case documents improvement in periodontal measures during treatment.
  - reference: PMID:24522161
    reference_title: Long-term follow-up evaluation of an acatalasemia boy with severe periodontitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the periodontal therapies have achieved a stable periodontal status."
    explanation: The report concludes that long-term periodontal therapy achieved clinical stability.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_cat_deficiency_oral_injury_model
  hypothesis_label: Canonical CAT Deficiency and Oral Injury Model
  status: CANONICAL
  description: >-
    Biallelic CAT variants produce marked erythrocyte catalase deficiency and
    impaired hydrogen peroxide decomposition. Most affected people remain
    asymptomatic, but at gingival wounds hydrogen peroxide-producing oral
    microorganisms can create a local oxidant burden. Historical patient-blood
    agar experiments propose that oxyhemoglobin oxidation, reduced oxygen
    availability, and a self-reinforcing necrotic ulcer and periodontal-injury
    cycle follow. The same
    catalase deficit makes exogenous hydrogen peroxide an acute
    methemoglobinemia hazard.
  notes: >-
    The oral co-trigger is conditional rather than inevitable. The graph does
    not treat acatalasia as a generalized peroxisome-biogenesis disorder and
    does not infer chronic hemolysis or universal systemic oxidative injury.
  evidence:
  - reference: PMID:120431
    reference_title: Acatalasia in two Peruvian siblings.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "It is postulated that the gingival lesions resulted from damage to tissue from hydrogen peroxide generated by organisms in gingival plaque."
    explanation: Human oral-pathology observations directly motivate the plaque hydrogen peroxide co-trigger.
  - reference: PMID:39085062
    reference_title: The discovery of acatalasemia (lack of catalase in the blood) and its significance in human genetics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "depriving it of oxygen and causing necrosis."
    explanation: The modern review summarizes the proposed local oxygen-deprivation and necrosis mechanism derived from patient-blood agar experiments.
- hypothesis_group_id: emerging_diabetes_susceptibility_model
  hypothesis_label: Emerging Diabetes Susceptibility Model
  status: EMERGING
  description: >-
    Selected human series associate inherited catalase deficiency broadly with a higher
    frequency of diabetes, and an alloxan-exposed acatalasemic mouse model
    suggests increased pancreatic beta-cell vulnerability to oxidant injury.
    These observations support a possible susceptibility mechanism but do not
    establish diabetes as an inevitable consequence of acatalasia, isolate risk
    in molecularly confirmed biallelic disease, or show that the experimental
    alloxan mechanism generalizes to unexposed humans.
  evidence:
  - reference: PMID:11117918
    reference_title: Hereditary catalase deficiencies and increased risk of diabetes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is a higher frequency of diabetes than in unaffected first-degree relatives and the general Hungarian population."
    explanation: The Hungarian series supplies cautious human association evidence.
  - reference: PMID:19883754
    reference_title: Sensitization to alloxan-induced diabetes and pancreatic cell apoptosis in acatalasemic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study suggests that catalase plays a crucial role in the defense against oxidative-stress-mediated pancreatic beta cell death in an alloxan-induced diabetes mouse model."
    explanation: The mouse experiment supports a possible beta-cell mechanism while clearly limiting it to an alloxan-induced model.

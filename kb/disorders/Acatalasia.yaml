review_notes: >-
  Re-reviewed comprehensively in July 2026. The revision narrows the disease
  identity to biallelic CAT-related, marked erythrocyte catalase deficiency;
  distinguishes usually asymptomatic acatalasia from the symptomatic Takahara
  oral presentation; rebuilds the oral peroxide-oxidation-necrosis mechanism;
  separates exposure-conditioned methemoglobinemia and an emerging,
  non-deterministic diabetes hypothesis; and adds structured genetics,
  biochemical diagnosis, case-calibrated management, a direct periodontal-EDS
  differential, and complete reference-catalog closure. Remaining gaps include
  unbiased modern natural-history cohorts, population-specific penetrance of
  oral disease, validated genotype-phenotype correlations, and prospective
  evidence for diabetes risk or management recommendations.

    evidence_source: HUMAN_CLINICAL
    snippet: "Affected homozygotes have no blood catalase activity, whereas heterozygotes show activities intermediate between this inactivity and the activity of normal controls, without overlap."
    explanation: This historical family study supports a biochemical distinction among affected, carrier, and normal ranges without establishing universal modern cutoffs.

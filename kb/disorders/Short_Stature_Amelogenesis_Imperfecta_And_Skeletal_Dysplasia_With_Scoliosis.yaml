genetic:
- name: SLC10A7
  gene_term:
    preferred_term: SLC10A7
    term:
      id: hgnc:23088
      label: SLC10A7
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    SLC10A7 is the only gene implicated in SSASKS. Reported pathogenic alleles
    are nonsense (p.Gly34*, p.Gln172*), splice-site (including c.472-1G>T and
    c.722-16A>G) and missense (p.Leu74Pro, p.Gly130Arg, p.Pro303Leu). The
    genotype-phenotype relation is graded by residual function rather than by
    variant class alone: p.Pro303Leu retains partial calcium-regulatory activity
    and gives the mildest reported phenotype, and a 2026 study showed that a
    splice allele previously presumed to be a complete null in fact leaves
    substantial normally spliced transcript, so allele nullity should not be
    inferred from the predicted consequence.
  evidence:
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identify homozygous mutations in SLC10A7 in six individuals with skeletal dysplasia with multiple dislocations and amelogenesis imperfecta."
    explanation: >-
      The gene-discovery study establishing SLC10A7 as causative.
  - reference: PMID:29878199
    reference_title: "Integrating glycomics and genomics uncovers SLC10A7 as essential factor for bone mineralization by regulating post-Golgi protein transport and glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two siblings, compound heterozygous mutations were found in SLC10A7, a gene of unknown function in human."
    explanation: >-
      Independent, contemporaneous identification of the gene by a glycomics-led
      route, and the source of the compound-heterozygous allele class.
  - reference: PMID:38037133
    reference_title: "Identification of novel homozygous nonsense SLC10A7 variant causing short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis and surgical management of spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous novel nonsense mutation in exon 1 of SLC10A7"
    explanation: >-
      Extends the allelic spectrum with a first-exon nonsense variant.
  - reference: PMID:31191616
    reference_title: "A New SLC10A7 Homozygous Missense Mutation Responsible for a Milder Phenotype of Skeletal Dysplasia With Amelogenesis Imperfecta."
    supports: SUPPORT

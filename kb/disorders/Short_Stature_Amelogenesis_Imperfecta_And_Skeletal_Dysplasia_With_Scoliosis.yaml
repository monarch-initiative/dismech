    explanation: >-
      Establishes the abnormal glycoprotein profile as a measurable feature of
      affected individuals.
- name: Reduced heparan sulfate fraction of cellular glycosaminoglycan
  notes: >-
    The heparan sulfate proportion of total glycosaminoglycan is reduced roughly
    two-fold in patient fibroblasts and about 2.5-fold in mutant mouse cartilage.
    Total glycosaminoglycan content is not significantly changed, so the defect
    is a shift in composition rather than a global loss.

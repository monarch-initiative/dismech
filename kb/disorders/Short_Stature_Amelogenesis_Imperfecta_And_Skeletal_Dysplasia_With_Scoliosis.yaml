- name: Growth Plate Disorganization and Impaired Skeletal Mineralization
  biological_scale: TISSUE
  description: >-
    In the growth plate the consequence is architectural: mutant mice show
    shortened long bones with growth plate disorganization, and the human
    counterpart is disproportionate short stature with short long bones, small
    epiphyses and advanced carpal and tarsal ossification. Mineralization is
    reduced as well as growth: affected individuals have decreased bone mineral
    density compatible with osteoporosis, and knockdown zebrafish show a strong
    reduction in bone mineralization by alizarin red staining. This entry does
    not declare conformance to the defective_skeletal_mineralization module,
    because none of that module's three trigger arms (calciopenic, phosphopenic,
    mineralization-inhibitor excess) applies here — the lesion is failure to
    deliver the organic matrix, with normal calcium, phosphate and
    pyrophosphate handling as far as is reported.

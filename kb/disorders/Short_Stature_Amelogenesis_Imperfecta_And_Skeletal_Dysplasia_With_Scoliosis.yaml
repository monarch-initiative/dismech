differential_diagnoses:
- name: Desbuquois dysplasia
  description: >-
    The nearest radiographic mimic. Desbuquois dysplasia shares the
    multiple-dislocation phenotype, the advanced carpal ossification and the
    monkey wrench proximal femur, and its genes CANT1 and XYLT1 act on the same
    proteoglycan pathway. Amelogenesis imperfecta is the discriminator: it is
    reported as specific to SLC10A7 deficiency within this disease group.
  evidence:
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "amelogenesis imperfecta seems to be a phenotypic feature specific to SLC10A7 deficiency within the group of chondrodysplasias with multiple dislocations"
    explanation: >-
      States the discriminating feature that separates SSASKS from the rest of
      the multiple-dislocation group, of which Desbuquois dysplasia is the
      prototype.
- name: LTBP3-related dental anomalies and short stature syndrome
  description: >-
    LTBP3-related disease (dental anomalies and short stature, DASS) also
    combines short stature, amelogenesis imperfecta and a brachyolmia-type
    skeletal dysplasia, and is the single most confusable entity by clinical
    description alone. It is mechanistically distinct — dysregulated TGF-beta
    signalling rather than a Golgi glycosylation defect — and carries a more
    prominent cardiovascular phenotype. This pairing is a documented
    named-entity-confusion hazard for automated literature retrieval on the
    SSASKS disease name; molecular testing, not phenotype, resolves it.
  evidence:
  - reference: PMID:34573388
    reference_title: "A Rare Case of Brachyolmia with Amelogenesis Imperfecta Caused by a New Pathogenic Splicing Variant in LTBP3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder is characterized by skeletal dysplasia (e.g., platyspondyly, short trunk, scoliosis, broad ilia, elongated femoral necks with coxa valga) and severe enamel and dental anomalies."
    explanation: >-
      Documents the LTBP3 entity's own phenotype — skeletal dysplasia with
      scoliosis plus severe enamel anomalies — which is the overlap that makes
      it the confusable differential. It also reports the cardiac involvement
      (aortic stenosis, hypertrophic cardiomyopathy) in its index case.
  notes: >-
    Flagged during this entry's deep-research preflight, which reported LTBP3 as
    a rival gene in the generated report. Inspection showed the LTBP3 material
    was confined to the report's own differential-diagnosis and caveat sections,
    so no LTBP3-derived content was curated into this entry as SSASKS biology.
    The evidence item above is cited for the LTBP3 entity's own phenotype, which
    is what makes it the differential; it is not evidence about SLC10A7.
treatments:
- name: Growth-friendly spinal instrumentation and definitive fusion
  description: >-
    Progressive early-onset scoliosis is managed with growing-rod
    instrumentation, converted from single-side to dual-rod as the deformity
    demands, with periodic lengthening procedures and a final in-situ fusion at
    skeletal maturity. In the one fully documented course this comprised seven
    operations between roughly three and fourteen years of age and ended with a
    well-corrected spine and no implant complications. This is symptomatic
    orthopedic management; nothing is disease-modifying.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure

- name: Defective Post-Golgi Glycoprotein Delivery to the Extracellular Matrix
  biological_scale: CELLULAR
  description: >-
    Beyond the composition of the glycans themselves, SLC10A7-deficient
    fibroblasts fail to move glycoproteins out of the secretory pathway:
    glycoproteins are mislocalized intracellularly and post-Golgi transport to
    the cell membrane is defective. Because the skeletal and dental matrices are
    built from secreted glycoproteins and proteoglycans, this delivery failure
    is the step that converts a biochemical glycosylation defect into a
    structural matrix defect.

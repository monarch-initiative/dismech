- name: Progressive Skeletal Dysplasia with Spinal Deformity
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint is a progressive, lifelong skeletal disorder. Growth
    restriction is present before birth and worsens; vertebral bodies are
    irregular, and progressive scoliosis, hyperlordosis and kyphosis develop
    through childhood and drive most of the morbidity, to the point of requiring
    staged growth-friendly spinal instrumentation before definitive fusion at
    skeletal maturity.
  evidence:
  - reference: PMID:38037133
    reference_title: "Identification of novel homozygous nonsense SLC10A7 variant causing short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis and surgical management of spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome starts with pre- and postnatal developmental delay, and gradually presents with variable facial dysmorphisms, a short stature, amelogenesis imperfecta, and progressive skeletal dysplasia affecting the limbs, joints, hands, feet, and spine."
    explanation: >-
      Describes the composite progressive endpoint and the body regions involved.

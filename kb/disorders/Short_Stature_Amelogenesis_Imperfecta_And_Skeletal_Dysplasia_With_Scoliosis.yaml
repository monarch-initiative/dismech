biochemical:
- name: Abnormal serum N-glycoprotein electrophoretic profile
  notes: >-
    Dried blood spots from affected individuals show an abnormal electrophoretic
    profile for the N-glycoproteins orosomucoid, haptoglobin, transferrin and
    alpha-1-antitrypsin, with orosomucoid and haptoglobin migrating faster than
    control. This is the CDG biomarker of the disorder and the reason SSASKS is
    classified as a congenital disorder of glycosylation rather than only as a
    chondrodysplasia.
  evidence:
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT

name: Short Stature, Amelogenesis Imperfecta, and Skeletal Dysplasia with Scoliosis
creation_date: "2026-08-24T00:00:00Z"
description: >-
  SSASKS is an ultra-rare autosomal recessive skeletal dysplasia caused by
  biallelic loss-of-function variants in SLC10A7, an orphan ten-transmembrane
  member of the SLC10 sodium/bile-acid cotransporter family that carries none of
  the family's canonical substrates. It is simultaneously a chondrodysplasia
  with multiple large-joint dislocations and a congenital disorder of
  glycosylation (SLC10A7-CDG): loss of SLC10A7 dysregulates calcium in the ER
  and Golgi, which in turn impairs Golgi glycosylation, reduces heparan sulfate
  on proteoglycans, and disrupts post-Golgi delivery of glycoproteins to the
  extracellular matrix. The resulting phenotype couples pre- and postnatal
  disproportionate short stature, large-joint dislocations, progressive
  scoliosis and reduced bone mineral density with a near-constant hypomineralized
  amelogenesis imperfecta, which is the clinical clue that distinguishes SSASKS
  from the other multiple-dislocation dysplasias. Roughly a dozen affected
  individuals had been reported by 2023; management is entirely supportive.
category: Mendelian
parents:
- congenital disorder of glycosylation
- autosomal recessive disease
- skeletal dysplasia
synonyms:
- SSASKS
- SLC10A7-CDG
- SLC10A7-related skeletal dysplasia with amelogenesis imperfecta
disease_term:
  preferred_term: short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis
  term:
    id: MONDO:0032703
    label: short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Curated as an inborn error of metabolism (a congenital disorder of
      glycosylation) rather than under a musculoskeletal chapter, following the
      mechanism the literature assigns it. Harrison's does not list SSASKS by
      name; this is a mechanism-based placement, not a textbook citation.
  icimd_category:
  - classification_value: multiple_glycosylation_pathways
    notes: >-
      ICIMD category 18.2 (disorders affecting multiple glycosylation pathways,
      including Golgi transport and homeostasis). SLC10A7 deficiency affects
      N-glycosylation, O-GalNAc glycosylation and glycosaminoglycan synthesis
      together through a shared upstream Golgi calcium lesion, so no single
      pathway subcategory covers it. The repository's own IEMbase crosswalk
      records this entity at 18.2.30.03.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    SSASKS follows autosomal recessive inheritance. Affected individuals carry
    biallelic (homozygous or compound heterozygous) SLC10A7 loss-of-function
    variants; most reported families are consanguineous, and both parents are
    heterozygous carriers. Expressivity is variable and partly
    genotype-correlated: the p.Pro303Leu missense allele, which retains residual
    calcium-regulatory activity, gives a milder skeletal phenotype than the
    nonsense and splice alleles.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:38037133
    reference_title: "Identification of novel homozygous nonsense SLC10A7 variant causing short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis and surgical management of spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis is a rare, autosomal recessive, skeletal disorder first described in 2018."
    explanation: >-
      States the autosomal recessive mode of inheritance directly.
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identify homozygous mutations in SLC10A7 in six individuals with skeletal dysplasia with multiple dislocations and amelogenesis imperfecta."
    explanation: >-
      The founding cohort is homozygous at SLC10A7, consistent with biallelic
      recessive causation.
pathophysiology:
- name: Biallelic SLC10A7 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    SLC10A7 encodes a ten-transmembrane-domain protein of the SLC10
    sodium/bile-acid cotransporter family which, unlike its relatives,
    transports none of the family's canonical substrates and remains an orphan
    carrier. It localizes to compartments of the secretory pathway, including
    the Golgi and the plasma membrane. Of the alleles actually assayed for
    protein level, a splice variant and the p.Leu74Pro missense reduce SLC10A7
    protein expression; this is not a property of every missense allele, since
    p.Pro303Leu fibroblasts instead show SLC10A7 overexpression while the
    protein retains only partial calcium-regulatory activity. Hypomorphic rather
    than null function is the molecular basis of the milder end of the
    phenotypic spectrum. This is the
    disorder-specific lesion this entry substitutes for the generic Golgi
    trigger of the conserved CDG module.
  genes:
  - preferred_term: SLC10A7
    term:
      id: hgnc:23088
      label: SLC10A7
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies in vitro demonstrate that SLC10A7 mutations reduce SLC10A7 protein expression."
    explanation: >-
      Establishes reduced protein expression as the shared consequence of the
      patient variants.
  - reference: PMID:34999954
    reference_title: "SLC10A7, an orphan member of the SLC10 family involved in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite similarities with the other members of the SLC10 family, SLC10A7 does not exhibit any transport activity for the typical SLC10 substrates and is then considered yet as an orphan carrier."
    explanation: >-
      Supports the orphan-carrier characterization: the protein is named for a
      transporter family whose substrates it does not carry, so the disease
      mechanism cannot be read off the family name.
  - reference: PMID:39779512
    reference_title: "SLC10A7 regulates O-GalNAc glycosylation and Ca(2+) homeostasis in the secretory pathway: insights into SLC10A7-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "They show that SLC10A7 is a key Golgi transmembrane protein maintaining the tight regulation of Ca2+ homeostasis in the ER and Golgi compartments, both essential for glycosylation."
    explanation: >-
      Places the protein at the Golgi and names the function whose loss starts
      the chain.
  downstream:
  - target: Secretory Pathway Calcium Dyshomeostasis
    causal_link_type: DIRECT
    description: >-
      Loss of the negative regulator releases the constraint it normally places
      on intracellular calcium.
    evidence:
    - reference: PMID:32350310
      reference_title: "The orphan solute carrier SLC10A7 is a novel negative regulator of intracellular calcium signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SLC10A7 protein expression was negatively correlated with store-operated calcium entry (SOCE) via the plasma membrane."
      explanation: >-
        The inverse relation between SLC10A7 protein level and calcium entry is
        what makes reduced protein expression the direct cause of the calcium
        node.
- name: Secretory Pathway Calcium Dyshomeostasis
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    SLC10A7 is a negative regulator of intracellular calcium signalling, and has
    been proposed to be renamed RCAS on that basis. Its expression is inversely
    correlated with store-operated calcium entry, and it co-localizes with
    STIM1, Orai1 and SERCA2. Loss of function therefore raises calcium influx:
    SLC10A7 knockout cells show increased influx after thapsigargin, ionomycin
    and ATP/carbachol, and patient fibroblasts show increased Ca2+ influx after
    an extracellular calcium challenge. Within the secretory pathway itself the
    consequence is an increased ER and Golgi calcium content. Because Golgi
    glycosyltransferase activity and Golgi organization are calcium-dependent,
    this node is the rate-limiting step linking an orphan transporter to a
    glycosylation disease.
  cell_types:
  - preferred_term: Dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: regulation of cytosolic calcium ion concentration
    term:
      id: GO:0051480
      label: regulation of cytosolic calcium ion concentration
    modifier: ABNORMAL
  - preferred_term: Golgi calcium ion homeostasis
    term:
      id: GO:0032468
      label: Golgi calcium ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32350310
    reference_title: "The orphan solute carrier SLC10A7 is a novel negative regulator of intracellular calcium signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the present study, SLC10A7 was established as a novel negative regulator of intracellular calcium signaling that most likely acts via STIM1, Orai1 and/or SERCA2 inhibition."
    explanation: >-
      Names the molecular function whose loss produces this node, and the
      candidate effectors.
  - reference: PMID:32350310
    reference_title: "The orphan solute carrier SLC10A7 is a novel negative regulator of intracellular calcium signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whereas SLC10A7 knockout HAP1 cells showed significantly increased calcium influx after thapsigargin, ionomycin and ATP/carbachol treatment, SLC10A7 overexpression reduced this calcium influx."
    explanation: >-
      Establishes the direction of the effect in a null background and its
      reversal on overexpression.
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "After addition of extracellular CaCl2, SLC10A7-deficient patient fibroblasts showed a significantly increased Ca2+ influx compared with control fibroblasts."
    explanation: >-
      Reproduces the calcium phenotype in cells from affected individuals rather
      than only in an engineered knockout line.
  - reference: PMID:39779512
    reference_title: "SLC10A7 regulates O-GalNAc glycosylation and Ca(2+) homeostasis in the secretory pathway: insights into SLC10A7-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The present study identifies major O-glycosylation defects in both SLC10A7 KO HAP1 cells and SLC10A7-CDG patient fibroblasts and reveals an increased ER and Golgi calcium contents."
    explanation: >-
      Locates the calcium abnormality inside the ER and Golgi lumen, the
      compartments where glycosylation occurs, and couples it to a
      glycosylation defect in the same cells.
  downstream:
  - target: Golgi Glycosylation and Glycosaminoglycan Biosynthesis Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Luminal calcium dysregulation disturbs the calcium-dependent Golgi
      glycosylation machinery. This is the least directly evidenced edge in the
      chain and is the subject of the gap_calcium_to_glycosylation_step
      discussion.
    evidence:
    - reference: PMID:39779512
      reference_title: "SLC10A7 regulates O-GalNAc glycosylation and Ca(2+) homeostasis in the secretory pathway: insights into SLC10A7-CDG."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "They show that SLC10A7 is a key Golgi transmembrane protein maintaining the tight regulation of Ca2+ homeostasis in the ER and Golgi compartments, both essential for glycosylation."
      explanation: >-
        Classified PARTIAL because the source asserts that both compartments'
        calcium regulation is essential for glycosylation without demonstrating
        the intervening step; the same paper states the mechanism is unknown.
- name: Golgi Glycosylation and Glycosaminoglycan Biosynthesis Defect
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#Golgi N-Glycan Processing and Trafficking Defect"
  description: >-
    Three glycosylation outputs fail together, which is why SSASKS is classified
    as a congenital disorder of glycosylation affecting multiple pathways rather
    than a single-enzyme defect. Heparan sulfate on proteoglycans is reduced
    roughly two-fold in patient fibroblasts and about 2.5-fold in mutant mouse
    cartilage, while total glycosaminoglycan content is preserved; N-glycans on
    plasma glycoproteins are abnormal; and O-GalNAc glycosylation is disrupted,
    with altered abundance of the C1GALT1 chaperone COSMC and mislocalization of
    the calcium-binding Golgi cargo sorter Cab45. This is the organ-agnostic
    substitution this entry makes against the CDG module's Golgi trigger: the
    module's generic disruption of Golgi glycosylation machinery is here caused
    by a luminal ionic lesion rather than by loss of a glycosyltransferase or of
    a tethering complex.

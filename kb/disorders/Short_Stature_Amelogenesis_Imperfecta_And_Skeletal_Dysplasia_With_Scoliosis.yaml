    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The conserved CDG module runs from protein hypoglycosylation to
      multisystem glycoprotein dysfunction; in SSASKS that multisystem
      consequence is the skeletal and dental disease itself. The intermediates
      are unknown, and no individual hypoglycosylated client protein has been
      tied to an SSASKS phenotype.
    evidence:

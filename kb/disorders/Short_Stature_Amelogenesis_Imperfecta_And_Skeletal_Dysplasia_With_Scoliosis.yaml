- name: Ameloblast Enamel Matrix Failure
  biological_scale: TISSUE
  description: >-
    Enamel is a secreted, protein-templated mineralized matrix, and it is the
    tissue in which SLC10A7 loss is most consistently expressed clinically.
    Slc10a7 is transcribed in the inner dental epithelium and in ameloblasts and
    odontoblasts during tooth development, mutant mice have tooth enamel
    anomalies, and every reported affected individual has amelogenesis
    imperfecta, typed as hypomineralized in the founding cohort and as
    hypoplastic/hypomineralized in the mildest case. Notably the founding study argued that the enamel
    phenotype is probably not explained by the proteoglycan defect alone, since
    amelogenesis imperfecta is what separates SSASKS from the other
    chondrodysplasias with multiple dislocations; the glycoprotein-trafficking
    arm is the more likely route.
  cell_types:
  - preferred_term: Ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: amelogenesis
    term:
      id: GO:0097186
      label: amelogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31191616
    reference_title: "A New SLC10A7 Homozygous Missense Mutation Responsible for a Milder Phenotype of Skeletal Dysplasia With Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At E18.5 labeling was observed in the inner dental epithelium of incisors and in ameloblasts and odontoblasts of molars."
    explanation: >-
      Localizes expression to ameloblasts and odontoblasts specifically, which
      is the expression-domain argument for a cell-autonomous enamel defect.
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As described earlier, all six patients were diagnosed with hypomineralized amelogenesis imperfecta."
    explanation: >-
      Human evidence that the enamel lesion is present in every member of the
      founding cohort.
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "amelogenesis imperfecta seems to be a phenotypic feature specific to SLC10A7 deficiency within the group of chondrodysplasias with multiple dislocations, suggesting that amelogenesis imperfecta is not due to a defect in proteoglycan synthesis"
    explanation: >-

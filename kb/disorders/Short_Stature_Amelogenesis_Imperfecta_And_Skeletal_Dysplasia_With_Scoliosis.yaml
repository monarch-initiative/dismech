discussions:
- discussion_id: gap_calcium_to_glycosylation_step
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what molecular step does raised ER and Golgi luminal calcium in
    SLC10A7-deficient cells produce the specific glycosylation defects observed
    — reduced heparan sulfate, abnormal hybrid-type N-glycans, and disrupted
    O-GalNAc glycosylation?
  attaches_to:
  - "pathophysiology#Secretory Pathway Calcium Dyshomeostasis"
  - "pathophysiology#Golgi Glycosylation and Glycosaminoglycan Biosynthesis Defect"
  rationale: >-
    The calcium lesion and the glycosylation lesion are each well established in
    patient cells, but the edge between them is inferred from the general
    calcium-dependence of Golgi function rather than demonstrated. The 2025 study
    that went furthest towards closing it opened by stating the mechanism was
    unknown, and its candidate mediators — altered COSMC and C1GALT1 abundance,
    mislocalized Cab45 — are correlates rather than a demonstrated causal chain.
    This matters for curation because it is the single edge on which the CDG
    classification of the disease rests.
  proposed_experiments:
  - experiment_id: exp_calcium_clamp_golgi_glycosylation_rescue
    name: Calcium-clamp rescue of Golgi glycosylation
    description: >-
      Restore Golgi luminal calcium in SLC10A7-null cells independently of
      SLC10A7 (for example by manipulating SPCA1 or SERCA activity) and test
      whether heparan sulfate synthesis, N-glycan profile and O-GalNAc
      glycosylation normalize. Rescue would establish the calcium step as
      causal; failure would place the glycosylation defect on a parallel
      SLC10A7-dependent route.
  evidence:
  - reference: PMID:39779512
    reference_title: "SLC10A7 regulates O-GalNAc glycosylation and Ca(2+) homeostasis in the secretory pathway: insights into SLC10A7-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mechanisms by which SLC10A7 deficiency leads to Golgi glycosylation abnormalities are unknown."
    explanation: >-
      The gap stated by the authors of the most recent mechanistic study of this
      disease.
- discussion_id: gap_enamel_route_gag_versus_trafficking
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the amelogenesis imperfecta of SSASKS caused by the glycoprotein
    trafficking defect rather than by the proteoglycan defect that explains the
    skeletal phenotype?
  attaches_to:
  - "pathophysiology#Ameloblast Enamel Matrix Failure"
  rationale: >-
    The founding study's argument is negative and inferential: amelogenesis
    imperfecta appears specific to SLC10A7 deficiency within a disease group
    whose other members also have proteoglycan-biosynthesis defects, so
    proteoglycan deficiency alone is unlikely to explain it. That is a
    reasonable inference but not a measurement, and it is the reason this entry
    routes the enamel node through the trafficking arm rather than the
    proteoglycan arm. If wrong, the pathograph's branch structure is wrong.
  proposed_experiments:
  - experiment_id: exp_ameloblast_gag_versus_trafficking
    name: Ameloblast-specific dissection of the two arms
    description: >-
      Compare enamel formation in ameloblast-restricted disruption of
      glycosaminoglycan synthesis against ameloblast-restricted disruption of
      post-Golgi glycoprotein trafficking, and against Slc10a7 loss, measuring
      enamel thickness and mineral density. Only the trafficking arm should
      phenocopy Slc10a7 loss if the inference holds.
  evidence:
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that amelogenesis imperfecta is not due to a defect in proteoglycan synthesis"
    explanation: >-
      The inferential claim at issue, quoted with the hedge the authors used.
- discussion_id: decision_module_conformance_boundaries
  kind: INTERPRETATION
  status: RESOLVED
  prompt: >-
    Should this entry declare conformance to defective_skeletal_mineralization
    or osteoporosis_bone_resorption, given that affected individuals have
    decreased bone mineral density compatible with osteoporosis?
  attaches_to:
  - "pathophysiology#Growth Plate Disorganization and Impaired Skeletal Mineralization"
  rationale: >-
    No, to both. defective_skeletal_mineralization is organized around three
    mutually exclusive trigger arms — calciopenic, phosphopenic, and
    mineralization-inhibitor excess — and none of them describes this disease.
    Calcium, phosphate and pyrophosphate handling are not reported as abnormal
    in SSASKS; what fails is delivery of a normally composed organic matrix, one
    step earlier than that module's entry points. Conforming would assert a
    trigger arm the literature does not support. osteoporosis_bone_resorption is
    declined for the opposite reason: its mechanism is increased RANKL-driven
    osteoclastic resorption, and no resorption abnormality has been reported
    here — the published defect is a formation defect, so mineral is never laid
    down rather than lost after the fact. This is recorded as a resolved
    decision rather than left as prose so that a later curator revisiting the
    mineralization node finds the reasoning attached to it.
  evidence:
  - reference: PMID:29878199
    reference_title: "Integrating glycomics and genomics uncovers SLC10A7 as essential factor for bone mineralization by regulating post-Golgi protein transport and glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our combined data indicate an important role for SLC10A7 in bone mineralization and transport of glycoproteins to the extracellular matrix."
    explanation: >-
      The reporting authors frame the mineralization deficit as a consequence of
      failed glycoprotein delivery to the matrix, which is the formation-side
      mechanism that puts this disease outside both modules' trigger arms.
- discussion_id: mismatch_mouse_joint_dislocation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does the Slc10a7 knockout mouse reproduce the growth, long-bone,
    craniofacial and enamel phenotypes of SSASKS but not the large-joint
    dislocations that define the human disease group?
  attaches_to:
  - "pathophysiology#Cartilage and Ligament Proteoglycan Deficiency with Joint Instability"
  rationale: >-
    The knockout has the cartilage heparan sulfate deficit that is supposed to
    cause the joint phenotype, yet no obvious dislocation. Either the mouse
    joint phenotype is present but too subtle for the assessment performed, or
    quadrupedal loading protects the mouse joints, or the human dislocations
    require something the heparan sulfate reduction does not supply. Which it is
    determines whether this model can be used to test interventions aimed at the
    joint arm at all, and the reporting authors explicitly left the question
    open.
  proposed_experiments:
  - experiment_id: exp_knockout_quantitative_joint_laxity
    name: Quantitative joint laxity phenotyping of the knockout
    description: >-
      Apply quantitative joint-laxity and micro-CT congruence measurement, plus
      histological assessment of the periarticular soft tissues, to the
      knockout, rather than relying on gross observation of dislocation. A
      graded laxity deficit would support the subtle-phenotype explanation.
  evidence:
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, no obvious joint dislocation was observed in Slc10a7−/− mice."
    explanation: >-
      The negative result that constitutes the mismatch.
notes: >-
  No GeneReviews chapter exists for SLC10A7 or for SSASKS. A PubMed search for
  a GeneReviews article on this gene and disease returned no results on
  2026-08-24, so the GeneReviews phenotype baseline step was not applicable to
  this entry and the phenotype list is built from the primary case literature
  instead.

  The decision not to conform to defective_skeletal_mineralization or
  osteoporosis_bone_resorption, despite the reduced bone mineral density, is
  recorded as the resolved `decision_module_conformance_boundaries` discussion,
  attached to the mineralization node it concerns.

  Delayed tooth eruption is deliberately not curated. It is a high-frequency
  feature of amelogenesis imperfecta generally, and a deep-research report
  offered a 91.6% figure for it, but that figure is not attributable to any
  SSASKS publication and none of the four primary case reports mentions eruption
  timing at all. An unsourced frequency band would be worse than the omission.

  Frequency bands are assigned sparingly, and exactly three phenotypes carry
  one. Amelogenesis imperfecta and abnormal facial shape are banded on a
  complete cohort denominator, each six of six in the founding cohort.
  Disproportionate short stature is banded on a clinical estimate instead: the
  2023 review sentence characterizes SSASKS patients as having it, without
  giving a denominator. The band on abnormal facial shape belongs at that class
  level and deliberately does not descend to its components — flat face,
  micrognathia and ptosis are each unbanded, because the six-of-six count is for
  facial abnormality of any kind, not for any one facial feature. Everything
  else is left unbanded rather than converting counts of one or two out of six
  into percentages.

  No `datasets:` block is curated. `just discover-datasets` returned no GEO
  candidates for this disorder on 2026-08-24, which is the expected result at
  this cohort size: the published mechanistic work is targeted biochemistry
  (calcium imaging, glycosaminoglycan quantification, glycan mass spectrometry)
  in patient fibroblasts and animal models rather than deposited omics.

    reference_title: "SLC10A7, an orphan member of the SLC10 family involved in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SLC10A7-CDG patients presented skeletal dysplasia with multiple large joint dislocations, short stature and amelogenesis imperfecta likely mediated by glycosaminoglycan (GAG) defects."
    explanation: >-
      States the proposed causal relation between the glycosaminoglycan defect
      and the joint phenotype; the authors hedge with "likely", which this node
      preserves.

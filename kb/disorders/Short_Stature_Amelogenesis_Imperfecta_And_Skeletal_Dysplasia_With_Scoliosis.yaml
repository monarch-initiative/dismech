- name: Abnormal Glycoprotein Glycan Profile
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  description: >-
    The Golgi lesion is readable on circulating glycoproteins. Blood spots from
    affected individuals show an abnormal N-glycoprotein electrophoretic
    profile, and the glycomics study that independently identified SLC10A7 did
    so by clustering a shared hybrid-type N-glycan signature out of a cohort of
    individuals with abnormal Golgi glycosylation. This is the biochemical
    readout that places SSASKS in the CDG group and the substitution this entry
    makes against the module's hypoglycosylation node. The module's expected
    edge onward to multisystem glycoprotein dysfunction is carried below, but
    only at the level of the disease as a whole: no study has yet linked a
    specific hypoglycosylated client protein to a specific SSASKS phenotype, so
    that edge is graded PARTIAL rather than asserted.

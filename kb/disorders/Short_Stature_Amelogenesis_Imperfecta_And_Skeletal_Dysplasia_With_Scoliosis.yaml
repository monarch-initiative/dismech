  biological_scale: TISSUE
  description: >-
    SSASKS sits nosologically among the dysplasias with multiple joint
    dislocations, most of which are proteoglycan-biosynthesis disorders, and the
    reduced heparan sulfate content of cartilage supplies the shared mechanism:
    proteoglycan-dependent cartilage and periarticular structures are
    undersupplied, and large joints dislocate. The radiographic signature —
    advanced carpal ossification with a monkey wrench or Swedish key appearance
    of the proximal femora — is shared with Desbuquois dysplasia, whose genes
    CANT1 and XYLT1 also act on the proteoglycan pathway.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: heparan sulfate proteoglycan biosynthetic process
    term:
      id: GO:0015012
      label: heparan sulfate proteoglycan biosynthetic process
    modifier: DECREASED
  evidence:

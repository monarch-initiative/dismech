progression:
- phase: Prenatal and neonatal
  notes: >-
    Growth restriction is present before birth, with birth length commonly below
    three standard deviations. Neonatal respiratory distress can occur, driven
    by micrognathia and Pierre-Robin sequence or by a small thorax, and one
    reported family had a neonatal death from respiratory distress with
    micromelia.
  evidence:
  - reference: PMID:38037133
    reference_title: "Identification of novel homozygous nonsense SLC10A7 variant causing short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis and surgical management of spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome starts with pre- and postnatal developmental delay"
    explanation: >-
      Establishes prenatal onset of the growth phenotype.
- phase: Childhood and adolescence
  notes: >-
    Skeletal involvement is progressive through childhood. Spinal deformity in
    particular worsens and is the phase that drives intervention; in the one
    fully documented surgical course, scoliosis required a first operation at
    about three and a half years and staged procedures continued to age
    fourteen.
  evidence:
  - reference: PMID:38037133
    reference_title: "Identification of novel homozygous nonsense SLC10A7 variant causing short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis and surgical management of spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gradually presents with variable facial dysmorphisms, a short stature, amelogenesis imperfecta, and progressive skeletal dysplasia affecting the limbs, joints, hands, feet, and spine"
    explanation: >-
      Describes the gradual, progressive accumulation of the skeletal phenotype.
  - reference: PMID:38037133
    reference_title: "Identification of novel homozygous nonsense SLC10A7 variant causing short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis and surgical management of spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The last surgery of final definite in situ fusion was performed at the age of 14.2"
    explanation: >-
      Anchors the end of the growth-friendly surgical phase at skeletal
      maturity.
- phase: Long-term outcome
  notes: >-
    No deaths have been reported among affected individuals surviving the
    neonatal period, and survival statistics do not exist at this cohort size.
    The single documented long-term surgical course ended with a well-corrected
    spine and no implant complications, so aggressive orthopedic surveillance
    appears to give a favourable functional outcome.
  evidence:
  - reference: PMID:38037133
    reference_title: "Identification of novel homozygous nonsense SLC10A7 variant causing short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis and surgical management of spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the last follow-up, she had a Cobb angle of 16.3° and no implant-related complications."
    explanation: >-
      The single reported long-term outcome measure.
diagnosis:
- name: Exome sequencing
  description: >-
    Every reported case has been solved by exome sequencing. There is no
    clinical gestalt that points specifically at SLC10A7 before molecular
    testing, because the radiographic findings overlap the Desbuquois dysplasia
    spectrum; the presence of amelogenesis imperfecta alongside a
    multiple-dislocation dysplasia is the clue that should prompt the test.
  evidence:
  - reference: PMID:31191616
    reference_title: "A New SLC10A7 Homozygous Missense Mutation Responsible for a Milder Phenotype of Skeletal Dysplasia With Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing was performed in a consanguineous family."
    explanation: >-
      Documents exome sequencing as the diagnostic route used.
  - reference: PMID:31191616
    reference_title: "A New SLC10A7 Homozygous Missense Mutation Responsible for a Milder Phenotype of Skeletal Dysplasia With Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AI is the key feature indicative of SLC10A7 mutations in patients with skeletal dysplasia"
    explanation: >-
      States the clinical trigger for targeting SLC10A7.
- name: Skeletal radiographic survey
  description: >-
    Skeletal survey shows advanced carpal and tarsal ossification, a monkey
    wrench or Swedish key appearance of the proximal femora, irregular vertebral
    bodies with coronal clefts, small epiphyses and short metacarpals, together
    with the progressive spinal deformity.
  evidence:
  - reference: PMID:30082715
    reference_title: "SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Butterfly vertebrae Th11, Th12, horizontal acetabular roof"
    explanation: >-
      A single clean row of radiological findings from the founding cohort's
      clinical table, quoted rather than the concatenated multi-patient run that
      the table extraction produces.
- name: Glycoprotein glycan analysis
  description: >-
    Plasma or dried-blood-spot glycoprotein analysis shows the abnormal glycan
    profile that classifies the disorder as a CDG. In the discovery cohort a
    hybrid-type N-glycan signature clustered the affected individuals out of a
    larger group with abnormal Golgi glycosylation, so this assay has
    demonstrated discriminating power and is not merely confirmatory.
  evidence:
  - reference: PMID:29878199
    reference_title: "Integrating glycomics and genomics uncovers SLC10A7 as essential factor for bone mineralization by regulating post-Golgi protein transport and glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "glycomics profiling was performed of total plasma glycoproteins"
    explanation: >-
      Names the assay and the specimen.
  - reference: PMID:29878199

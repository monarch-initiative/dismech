name: Complement Component 4A Deficiency
creation_date: "2026-09-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: complement component 4a deficiency
  term:
    id: MONDO:0013721
    label: complement component 4a deficiency
description: >-
  Complement component 4A (C4A) deficiency is the absence of functional C4A
  protein, most often from homozygous zero copy number of the C4A gene in the
  MHC class III region on chromosome 6p21.33, with C4B still present. It is best
  understood as a genetic risk state rather than a high-penetrance Mendelian
  disease: low C4A copy number is one of the strongest common genetic risk
  factors for systemic lupus erythematosus (SLE), and homozygous C4A deficiency
  carries a several-fold increased odds of SLE. C4A is more effective than C4B at
  binding immune complexes and enhancing their clearance via CR1, so its loss
  reduces clearance of immune complexes and apoptotic debris. This entry is
  scoped to homozygous C4A deficiency (zero functional C4A, C4B present).
synonyms:
- C4A deficiency
- C4AD
- homozygous C4A deficiency
- complement component C4A deficiency
parents:
- Complement Disorder
inheritance:
- name: Autosomal Recessive
  description: >-
    Complete C4A deficiency reflects biallelic loss of functional C4A gene copies
    (zero C4A copy number), typically from the monomodular short RCCX haplotype
    carrying a single short C4B gene. Heterozygous (single-copy) C4A deficiency is
    a weaker risk factor and is curated here as a risk-factor genetic record
    rather than as the disease.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:17503323
    reference_title: >-
      Gene copy-number variation and associated polymorphisms of complement
      component C4 in human systemic lupus erythematosus (SLE): low copy number
      is a risk factor for and high copy number is a protective factor against
      SLE susceptibility in European Americans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Total absence of C4A genes (homozygous C4A deficiency) had a frequency of 6.5% in female patients with SLE, compared with 1.3% in unrelated controls (OR=5.27; 95% CI 1.87-14.8; P=.001)."
    explanation: >-
      Defines homozygous C4A deficiency as total absence of C4A genes and
      quantifies its SLE risk in a case-control comparison.
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A classical-pathway complement deficiency whose dominant association is
      with the rheumatologic disease SLE, placing it in Harrison's
      immune/rheumatologic Part, matching the sibling complement-deficiency
      entries.
  iuis_category:
    classification_value: complement deficiency
    notes: >-
      A defect of a classical complement pathway component (C4A), placing it in
      the IUIS complement deficiencies table.
pathophysiology:
- name: Absent Functional C4A Protein
  biological_scale: MOLECULAR
  description: >-
    Zero C4A gene copy number removes functional C4A protein from plasma, while
    C4B remains. C4A and C4B differ by only a few residues but C4A reacts
    preferentially with amino groups on immune complexes, forming covalent amide
    bonds, so C4A is more effective than C4B at immune complex handling.
  genetic_context:
    gene:
      preferred_term: C4A
      term:
        id: hgnc:1323
        label: C4A
    variant_type: deletion
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: complement component C1q complex binding
    term:
      id: GO:0001849
      label: complement component C1q complex binding
    modifier: DECREASED
  evidence:
  - reference: PMID:2138067
    reference_title: >-
      Differences between C4A and C4B in the handling of immune complexes: the
      enhancement of CR1 binding is more important than the inhibition of
      immunoprecipitation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the CR1 binding assay C4A was markedly more effective than C4B in enhancing binding to CR1."
    explanation: >-
      Purified-protein assays show C4A is functionally superior to C4B at
      enhancing immune-complex binding to CR1, the function lost in C4A
      deficiency.
  downstream:
  - target: Reduced Immune Complex and Apoptotic Debris Clearance
    description: >-
      Loss of the more effective C4A isotype reduces complement-dependent
      clearance of immune complexes and apoptotic cells.
  - target: Decreased Circulating Complement C4
    description: >-
      Zero C4A gene copy number lowers total serum C4, which falls with C4 gene
      copy number.
    evidence:
    - reference: PMID:29050534
      reference_title: >-
        Low copy numbers of complement C4 and homozygous deficiency of C4A may
        predispose to severe disease and earlier disease onset in patients with
        systemic lupus erythematosus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "C4 serum levels were strongly related to C4 gene copy numbers in patients, the mean concentration ranging from 0.110 g/l (two copies) to 0.256 g/l (five to six copies; p = 4.9 × 10-6)."
      explanation: >-
        Serum C4 tracks C4 gene copy number, so loss of C4A copies lowers
        circulating C4.
- name: Reduced Immune Complex and Apoptotic Debris Clearance
  biological_scale: CELLULAR
  description: >-
    Classical-pathway opsonisation (C4b, then C3b) tags immune complexes and
    apoptotic cells for CR1-mediated transport and phagocytic clearance. With
    less functional C4 this clearance is impaired, so immune complexes and
    apoptotic debris persist. Direct human measurement of this defect is mixed:
    one study tied reduced prevention of immune precipitation to low C4A, while
    a later study (PMID:15932521) found the defect independent of C4A null alleles.
  biological_processes:
  - preferred_term: immune complex clearance
    term:
      id: GO:0002434
      label: immune complex clearance
    modifier: DECREASED
  - preferred_term: apoptotic cell clearance
    term:
      id: GO:0043277
      label: apoptotic cell clearance
    modifier: DECREASED
  evidence:
  - reference: PMID:15054157
    reference_title: >-
      Patients with systemic lupus erythematosus are deficient in
      complement-dependent prevention of immune precipitation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "PIP was positively correlated with levels of C4 (P = 3 x 10(-5)) and in particular the C4A isotype (P = 9 x 10(-10)) whereas C4B was redundant."
    explanation: >-
      Correlates prevention of immune precipitation with C4A levels in SLE
      patients; indirect because it measures function in SLE rather than in
      isolated C4A deficiency.
  - reference: PMID:15932521
    reference_title: "Defective prevention of immune precipitation in autoimmune diseases is independent of C4A*Q0."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "These results show that the PIP defect cannot be explained by low levels of C4A alone"
    explanation: >-
      A later study found the precipitation defect normal in other
      C4A*Q0-associated diseases, so low C4A alone does not explain it.
  downstream:
  - target: Breakdown of Self-Tolerance and Autoantibody Production
    description: >-
      Persistent apoptotic debris and immune complexes provide self-antigen that
      drives autoantibody formation.
- name: Breakdown of Self-Tolerance and Autoantibody Production
  biological_scale: ORGANISM
  description: >-
    Impaired clearance of apoptotic cells and immune complexes is linked to a
    breakdown of B-cell tolerance and production of antinuclear autoantibodies.
    The mechanistic chain downstream of defective clearance is supported mainly
    by C4-knockout mice, which abolish total C4 rather than C4A alone, so its
    application to human C4A deficiency is indirect.
  biological_processes:
  - preferred_term: B cell tolerance induction
    term:
      id: GO:0002514
      label: B cell tolerance induction
    modifier: DECREASED
  evidence:
  - reference: PMID:11067882
    reference_title: >-
      Complement C4 inhibits systemic autoimmunity through a mechanism
      independent of complement receptors CR1 and CR2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Here we report high titers of spontaneous antinuclear antibody (ANA) in C4(-/)- mice."
    explanation: >-
      C4-knockout mice develop spontaneous ANA, modelling the tolerance
      breakdown; indirect for human C4A deficiency because the model removes
      total C4.
  - reference: PMID:23749435
    reference_title: Complement C4 maintains peripheral B-cell tolerance in a myeloid cell dependent manner.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Deficiency in complement component C4 led to a breakdown in the elimination of autoreactive B-cell clones at the transitional stage"
    explanation: >-
      Identifies the B-cell tolerance checkpoint that C4 maintains; indirect
      because it is a mouse model of total C4 deficiency.
  downstream:
  - target: Systemic Lupus Erythematosus
    description: >-
      Autoantibody production and immune-complex deposition produce the
      lupus phenotype.
phenotypes:
- category: Immunological
  name: Systemic Lupus Erythematosus
  description: >-
    SLE and lupus-like disease are the dominant clinical association of C4A
    deficiency. Homozygous C4A deficiency is one of the strongest common genetic
    risk factors for SLE, though it is a risk state rather than a fully penetrant
    cause, and the risk is confounded by HLA linkage (see discussions).
  phenotype_term:
    preferred_term: Systemic lupus erythematosus
    term:
      id: HP:0002725
      label: Systemic lupus erythematosus
  evidence:
  - reference: PMID:29050534
    reference_title: >-
      Low copy numbers of complement C4 and homozygous deficiency of C4A may
      predispose to severe disease and earlier disease onset in patients with
      systemic lupus erythematosus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous deficiency of the C4A isotype was identified as the strongest risk factor for SLE (odds ratio (OR) = 5.329; p = 7.7 × 10-3) in the case-control comparison."
    explanation: >-
      Quantifies homozygous C4A deficiency as the strongest single risk factor
      for SLE in this cohort.
  - reference: PMID:29050534
    reference_title: >-
      Low copy numbers of complement C4 and homozygous deficiency of C4A may
      predispose to severe disease and earlier disease onset in patients with
      systemic lupus erythematosus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two copies of total C4 and homozygous deletion of C4A were associated with a disease course requiring cyclophosphamide therapy (OR = 4.044; p = 0.040 and OR = 5.798; p = 0.034, respectively)."
    explanation: >-
      Associates homozygous C4A deletion with a more severe SLE course requiring
      cyclophosphamide.
  - reference: PMID:26814708
    reference_title: >-
      Effects of Complement C4 Gene Copy Number Variations, Size Dichotomy, and
      C4A Deficiency on Genetic Risk and Clinical Presentation of Systemic Lupus
      Erythematosus in East Asian Populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous C4A deficiency was infrequent in East Asian subjects, but had an odds ratio (OR) of 12.4 (P = 0.0015) for SLE disease susceptibility."
    explanation: >-
      Confirms the SLE association of homozygous C4A deficiency in a second,
      East Asian, population.
- category: Laboratory
  name: Decreased Circulating Complement C4
  description: >-
    Serum C4 protein concentration falls with C4 gene copy number, so C4A-deficient
    individuals tend to have reduced total C4.
  phenotype_term:
    preferred_term: Decreased circulating complement C4 concentration
    term:
      id: HP:0045042
      label: Decreased circulating complement C4 concentration
  evidence:
  - reference: PMID:29050534
    reference_title: >-
      Low copy numbers of complement C4 and homozygous deficiency of C4A may
      predispose to severe disease and earlier disease onset in patients with
      systemic lupus erythematosus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C4 serum levels were strongly related to C4 gene copy numbers in patients, the mean concentration ranging from 0.110 g/l (two copies) to 0.256 g/l (five to six copies; p = 4.9 × 10-6)."
    explanation: >-
      Shows serum C4 concentration tracks C4 gene copy number, so low-copy C4A
      deficiency lowers measured C4.
- category: Neoplastic
  name: Lymphoma
  description: >-
    A cohort of patients with homozygous C4A deficiency showed a novel increased
    association with lymphoma relative to controls.
  phenotype_term:
    preferred_term: Lymphoma
    term:
      id: HP:0002665
      label: Lymphoma
  evidence:
  - reference: PMID:29928053
    reference_title: Clinical features of patients with homozygous complement C4A or C4B deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel associations between homozygous C4A deficiency and lymphoma, coeliac disease and sarcoidosis were detected."
    explanation: >-
      Reports lymphoma as a novel association of homozygous C4A deficiency in a
      retrospective clinical cohort.
- category: Gastrointestinal
  name: Celiac Disease
  description: >-
    The same homozygous C4A deficiency cohort showed an increased association
    with coeliac disease.
  phenotype_term:
    preferred_term: Celiac disease
    term:
      id: HP:0002608
      label: Celiac disease
  evidence:
  - reference: PMID:29928053
    reference_title: Clinical features of patients with homozygous complement C4A or C4B deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Novel associations between homozygous C4A deficiency and lymphoma, coeliac disease and sarcoidosis were detected."
    explanation: >-
      Reports coeliac disease as a novel association of homozygous C4A deficiency
      in a retrospective clinical cohort.
- category: Immunological
  name: Adverse Drug Response
  description: >-
    Homozygous C4A deficiency was associated with adverse drug reactions leading
    to drug discontinuation.
  phenotype_term:
    preferred_term: Adverse drug response
    term:
      id: HP:0020172
      label: Adverse drug response
  evidence:
  - reference: PMID:29928053
    reference_title: Clinical features of patients with homozygous complement C4A or C4B deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C4A and C4B deficiencies were both associated with adverse drug reactions leading to drug discontinuation (34.4%, 11/32 in C4A-deficient patients vs. 14.2%, 17/120 in controls, OR = 3.174, 95%CI = 1.30-7.74, p = 0.009"
    explanation: >-
      Reports the association of homozygous C4A deficiency with adverse drug
      reactions.
- category: Cardiovascular
  name: Pericarditis
  description: >-
    In juvenile-onset SLE, low C4A copy number was specifically associated with
    pericarditis.
  phenotype_term:
    preferred_term: Pericarditis
    term:
      id: HP:0001701
      label: Pericarditis
  evidence:
  - reference: PMID:26800705
    reference_title: >-
      Low C4, C4A and C4B gene copy numbers are stronger risk factors for
      juvenile-onset than for adult-onset systemic lupus erythematosus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "pericarditis in JSLE patients was associated with low C4 (OR = 4.13; 95% CI: 1.02, 16.68; P = 0.047) and low C4A (OR = 5.54; 95% CI: 1.37, 22.32; P = 0.016)."
    explanation: >-
      Associates low C4A with pericarditis; indirect because it is measured as a
      manifestation within juvenile SLE rather than in isolated C4A deficiency.
genetic:
- name: C4A
  gene_term:
    preferred_term: C4A
    term:
      id: hgnc:1323
      label: C4A
  relationship_type: CAUSATIVE
  notes: >-
    Homozygous C4A deficiency (zero functional C4A gene copies) is the causal
    genotype for this entry. In Europeans it most often arises from the
    monomodular short RCCX haplotype carrying a single short C4B gene and no long
    C4A gene, on the 8.1 ancestral haplotype.
  evidence:
  - reference: PMID:26814708
    reference_title: >-
      Effects of Complement C4 Gene Copy Number Variations, Size Dichotomy, and
      C4A Deficiency on Genetic Risk and Clinical Presentation of Systemic Lupus
      Erythematosus in East Asian Populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main cause for C4A-deficiency among Europeans is the presence of mono-S coding for C4B1 and the absence of a long C4A gene in haplotypes with HLA-DRB1*0301."
    explanation: >-
      States the predominant genetic mechanism of C4A deficiency in Europeans
      and its HLA haplotype context.
- name: C4A copy number (heterozygous deficiency)
  gene_term:
    preferred_term: C4A
    term:
      id: hgnc:1323
      label: C4A
  relationship_type: RISK_FACTOR
  notes: >-
    Heterozygous (single-copy) C4A deficiency is a weaker, non-disease risk
    factor for SLE, curated separately from the homozygous causal genotype.
  evidence:
  - reference: PMID:17503323
    reference_title: >-
      Gene copy-number variation and associated polymorphisms of complement
      component C4 in human systemic lupus erythematosus (SLE): low copy number
      is a risk factor for and high copy number is a protective factor against
      SLE susceptibility in European Americans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the patients, 26% had only one copy of the C4A gene (i.e., heterozygous C4A deficiency), compared with 18.2% of unrelated controls (OR=1.61; 95% CI 1.1-2.4; P=.022)."
    explanation: >-
      Quantifies heterozygous C4A deficiency as a modest SLE risk factor,
      distinct from the stronger homozygous effect.
differential_diagnoses:
- name: Complete C4 Deficiency
  description: >-
    Complete (homozygous) deficiency of both C4A and C4B carries a much higher
    frequency of SLE or lupus-like disease than isotype C4A deficiency. This
    entry is scoped to C4A-only deficiency with C4B present.
  distinguishing_features:
  - Both C4A and C4B absent, not C4A alone
  - Much higher frequency of SLE or lupus-like disease
  evidence:
  - reference: PMID:26913032
    reference_title: >-
      Early Components of the Complement Classical Activation Pathway in Human
      Systemic Autoimmune Diseases.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "SLE or lupus-like disease was diagnosed in 22 (78.6%) of the C4-deficient subjects, and four others had renal disease including glomerulonephritis."
    explanation: >-
      Reports the high SLE frequency in complete C4 deficiency, contrasting with
      the lower-penetrance isotype C4A deficiency.
- name: Complement Component 4B Deficiency
  description: >-
    Deficiency of the C4B isotype rather than C4A. C4B favours binding to
    hydroxyl/carbohydrate surfaces, so its clinical association differs from C4A
    deficiency.
  disease_term:
    preferred_term: complement component 4b deficiency
    term:
      id: MONDO:0013720
      label: complement component 4b deficiency
  distinguishing_features:
  - C4B absent with C4A present
  evidence:
  - reference: PMID:29928053
    reference_title: Clinical features of patients with homozygous complement C4A or C4B deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-two patients with no functional C4A, 87 patients with no C4B and 120 with normal amount of C4 genes were included."
    explanation: >-
      Distinguishes the two isotype deficiencies as separate groups within one
      cohort.
- name: Idiopathic Systemic Lupus Erythematosus
  description: >-
    Most SLE is polygenic and not attributable to a classical-pathway complement
    deficiency. C4A deficiency is one strong but uncommon genetic contributor.
  disease_term:
    preferred_term: systemic lupus erythematosus
    term:
      id: MONDO:0007915
      label: systemic lupus erythematosus
  distinguishing_features:
  - No homozygous C4A deficiency genotype
  evidence:
  - reference: PMID:36535812
    reference_title: The complement system and human autoimmune diseases.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, isotype genetic deficiency of C4A and acquired deficiency of C1q by autoantibodies are frequent among patients with SLE."
    explanation: >-
      Frames C4A deficiency as one contributor within the broader SLE
      population, supporting the differential.
discussions:
- discussion_id: c4a_hla_confounding
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Systemic Lupus Erythematosus
  prompt: >-
    How much of the SLE risk attributed to C4A deficiency is independent of the
    linked HLA class II alleles (e.g. HLA-DRB1*03:01) on the same 8.1 ancestral
    haplotype?
  rationale: >-
    C4A deficiency in Europeans sits on the 8.1 ancestral haplotype in strong
    linkage disequilibrium with HLA-DRB1*03:01, so disentangling the complement
    effect from the HLA effect is difficult. One British analysis found partial
    C4 deficiency not independent of DRB1*03, while the East Asian data, where
    C4A deficiency is not linked to DRB1*03:01, support an HLA-independent
    complement effect. The question is unresolved in Europeans.
  evidence:
  - reference: PMID:29050534
    reference_title: >-
      Low copy numbers of complement C4 and homozygous deficiency of C4A may
      predispose to severe disease and earlier disease onset in patients with
      systemic lupus erythematosus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association of homozygous deletion of C4A and SLE is accompanied by the presence of HLA-DRB1*0301 without a proven pathophysiological mechanism."
    explanation: >-
      States the C4A-SLE association co-occurs with HLA-DRB1*0301 with no proven
      mechanism, which is the confounding this discussion raises.
  proposed_experiments:
  - experiment_id: c4a_hla_conditioned_assoc
    name: HLA-conditioned association analysis of C4A copy number in SLE
    description: >-
      Test C4A copy number against SLE risk conditioning on HLA-DRB1 genotype in
      a large European cohort.
- discussion_id: c4a_mouse_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Breakdown of Self-Tolerance and Autoantibody Production
  prompt: >-
    Does the C4-knockout mouse, which lacks total C4, faithfully model human
    isotype C4A deficiency where C4B remains present?
  rationale: >-
    The clearance-to-autoimmunity chain downstream of C4 loss rests mainly on
    C4-knockout mice, which abolish both isotypes. Humans with C4A deficiency
    retain C4B, which also opsonises, so the mouse may overstate the functional
    deficit of human C4A-only deficiency. This is why those edges are curated as
    INDIRECT.
  proposed_experiments:
  - experiment_id: c4a_isotype_selective_model
    name: C4A-specific restoration or isotype-selective model
    description: >-
      Compare autoimmunity in C4B-retaining versus total C4-null systems to
      isolate the C4A-specific contribution.
notes: >-
  Scope: this entry is homozygous C4A deficiency (zero functional C4A, C4B
  present). Heterozygous partial C4A deficiency appears only as a risk-factor
  genetic record, and complete C4 deficiency (no C4A and no C4B) appears only as
  a differential diagnosis.

  C4A deficiency is closer to a genetic risk state than to a high-penetrance
  Mendelian disease: it is a strong common risk factor for SLE rather than a
  fully penetrant cause, so no penetrance figure is asserted. Attribution of SLE
  risk to C4A specifically is confounded by HLA linkage (the 8.1 ancestral
  haplotype carries both the C4A-deficient RCCX module and HLA-DRB1*03:01); see
  the c4a_hla_confounding discussion.

  Several downstream pathophysiology edges rely on C4-knockout mice, which lack
  total C4 rather than C4A alone, and are therefore graded INDIRECT; see the
  c4a_mouse_model_fidelity discussion.

  PMID:29928053 reports sarcoidosis as a third novel association alongside
  lymphoma and coeliac disease, but it is not curated as a phenotype because HP
  has no sarcoidosis term (it is a disease concept carried in MONDO, not an HP
  phenotype).

name: Hypopigmentation, Organomegaly, and Delayed Myelination and Development
creation_date: "2026-09-03T16:45:00Z"
category: Mendelian
synonyms:
- HOD syndrome
- HOD
description: >-
  HOD syndrome (OMIM 618541) is an ultra-rare multisystem lysosomal disorder caused by
  de novo heterozygous missense variants in CLCN7, which encodes ClC-7, the lysosomal
  2Cl-/H+ antiporter. The reported variants increase ClC-7 transport activity, and the
  resulting over-acidified, grossly enlarged lysosome-related vacuoles accumulate across
  many tissues, producing hypopigmentation, hepatosplenomegaly with foam-cell
  infiltration, delayed myelination and global developmental delay.

  The entry exists chiefly for a contrast the knowledge base can hold but a single-gene
  view cannot. CLCN7 loss of function causes osteopetrosis, curated here as Osteopetrosis,
  Autosomal_Dominant_Osteopetrosis_Type_II and Autosomal_Recessive_Osteopetrosis. HOD is
  allelic with all three and shares none of their bone disease: every reported patient has
  been explicitly free of osteopetrosis. Bone is not a mildly affected organ in HOD, it is
  an unaffected one.
disease_term:
  preferred_term: HOD syndrome
  term:
    id: MONDO:0032805
    label: hypopigmentation, organomegaly, and delayed myelination and development
parents:
- lysosomal storage disease
- CLCN7-related disorder
inheritance:
- name: Autosomal dominant, arising de novo
  description: >-
    Every reported case has carried a heterozygous CLCN7 missense variant absent from both
    parents. No transmitted case has been described, which is unsurprising given the
    severity and early onset. The dominance is not haploinsufficiency: ClC-7 functions as a
    homodimer, and the mutant subunit shifts the gating of wild-type subunits with which it
    dimerizes, so a single mutant allele raises the activity of the whole population.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31155284
    reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome and -genome sequencing revealed a de novo c.2144A>G variant in CLCN7 in both affected children."
    explanation: Establishes the de novo heterozygous origin in the two index cases.
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "shifted voltage-dependent gating to less positive potentials, an effect partially conferred to WT subunits in WT/mutant heteromers"
    explanation: >-
      Supplies the mechanism of dominance - the mutant subunit alters its wild-type partner
      within the dimer, rather than merely halving normal activity.
pathophysiology:
- name: De Novo Heterozygous CLCN7 Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Two variants have been reported: p.Tyr715Cys (c.2144A>G), carried by four of the five
    published patients, and p.Lys285Thr (c.854A>C) in one. Both lie in the cytoplasmic
    portion of ClC-7 and affect residues lining the binding pocket for the signalling lipid
    PI(3,5)P2, which is the point of convergence between two otherwise distant substitutions.
  molecular_functions:
  - preferred_term: chloride/proton antiporter activity of ClC-7
    term:
      id: GO:0015297
      label: antiporter activity
  downstream:
  - target: Loss of PI(3,5)P2 Inhibition of ClC-7
    causal_link_type: DIRECT
    description: Both reported variants sit in or beside the PI(3,5)P2 binding pocket.
    evidence:
    - reference: PMID:38838776
      reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Both mutations decreased ClC-7 inhibition by PI(3,5)P2 and affected residues lining its binding pocket"
      explanation: States that the variants act by removing lipid inhibition of the transporter.
  evidence:
  - reference: PMID:31155284
    reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This p.Tyr715Cys variant, located in the C-terminal domain of ClC-7, resulted in increased outward currents when it was heterologously expressed in Xenopus oocytes."
    explanation: Identifies the recurrent variant and its position in the protein.
- name: Loss of PI(3,5)P2 Inhibition of ClC-7
  biological_scale: MOLECULAR
  description: >-
    PI(3,5)P2 normally restrains ClC-7. Both HOD variants weaken that restraint and shift
    voltage-dependent gating toward less positive potentials, so more of the transporter
    population is open at physiological membrane voltages.
  downstream:
  - target: Increased ClC-7 Chloride/Proton Exchange Current
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38838776
      reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of PI(3,5)P2 inhibition will further increase current amplitudes, but may not be a general feature of HOD."
      explanation: >-
        Supports the link while recording the authors' own limit on it - they attribute the
        gain principally to the gating shift and treat lost lipid inhibition as additive.
- name: Increased ClC-7 Chloride/Proton Exchange Current
  biological_scale: MOLECULAR
  description: >-
    The functional lesion. Heterologous expression of p.Tyr715Cys yields increased outward
    currents, and the gating shift is predicted to drive extra chloride into the vesicle
    lumen down the existing pH gradient.
  molecular_functions:
  - preferred_term: chloride transmembrane transporter activity
    term:
      id: GO:0015108
      label: chloride transmembrane transporter activity
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Lysosomal Hyperacidification
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31155284
      reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Fibroblasts from probands displayed a lysosomal pH approximately 0.2 units lower than that of control cells, and treatment with chloroquine normalized the pH."
      explanation: >-
        Measures the pH consequence in patient cells and shows it is reversible by an
        alkalinizing agent, which is what ties the pH shift to transporter activity.
  - target: Enlarged Lysosome-Related Vacuole Formation
    causal_link_type: DIRECT
    description: >-
      A second, partly separable consequence - vacuole formation was shown to require the
      exchange activity itself, not merely the acidification it produces.
    evidence:
    - reference: PMID:38136669
      reference_title: "Impaired Autophagic Clearance with a Gain-of-Function Variant of the Lysosomal Cl(-)/H(+) Exchanger ClC-7."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "increased ClC-7 Cl-/H+ exchange activity is required for the formation of enlarged vacuoles by membrane fusion"
      explanation: >-
        Uncoupling mutations separate transport from the phenotype and show the exchange
        activity is necessary for vacuole formation.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This shift predicts augmented pH gradient-driven Cl- uptake into vesicles."
    explanation: States the transport consequence of the gating shift.
- name: Lysosomal Hyperacidification
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts sit about 0.2 pH units below control. The size of that shift is
    worth stating plainly: it is small in absolute terms, and it is the disease. Note the
    direction, because it is the opposite of the intuition carried over from most lysosomal
    storage disorders, where the lysosome fails to acidify.
  biological_processes:
  - preferred_term: lysosomal lumen acidification
    term:
      id: GO:0007042
      label: lysosomal lumen acidification
    modifier: INCREASED
  downstream:
  - target: Impaired Lysosomal and Autophagic Degradation
    causal_link_type: DIRECT
  - target: Reduced Melanin Synthesis in Melanosomes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed rather than measured in this disease. See the knowledge gap attached to this
      edge - no study has recorded melanosomal pH in a patient with HOD syndrome.
  evidence:
  - reference: PMID:31155284
    reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results show that p.Tyr715Cys is a gain-of-function CLCN7 variant associated with developmental delay, organomegaly, and hypopigmentation resulting from lysosomal hyperacidity, abnormal storage, and enlarged intracellular vacuoles."
    explanation: The authors' summary statement of the mechanism, naming hyperacidity as causal.
- name: Enlarged Lysosome-Related Vacuole Formation
  biological_scale: CELLULAR
  description: >-
    Grossly enlarged vacuoles arise by membrane fusion and are seen in patient fibroblasts,
    leukocytes, liver and kidney. This is the feature that distinguishes gain of ClC-7
    function from its loss: losing ClC-7 also produces storage, but not these vacuoles.
  downstream:
  - target: Impaired Lysosomal and Autophagic Degradation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31155284
    reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Primary fibroblasts from both probands also exhibited markedly enlarged intracellular vacuoles; this finding was recapitulated by the overexpression of human p.Tyr715Cys CLCN7 in control fibroblasts, reflecting the dominant, gain-of-function nature of the variant."
    explanation: >-
      Shows the vacuoles in patient cells and reproduces them in control cells by expressing
      the variant, which is what makes the variant causal rather than correlated.
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overactivity of ClC-7 induces pathologically enlarged vacuoles in many tissues, which is distinct from lysosomal storage observed with the loss of ClC-7 function."
    explanation: Distinguishes the gain-of-function cellular lesion from the loss-of-function one.
  - reference: PMID:33217309
    reference_title: "A Recurrent Gain-of-Function Mutation in CLCN6, Encoding the ClC-6 Cl(-)/H(+)-Exchanger, Causes Early-Onset Neurodegeneration."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Bafilomycin treatment abrogated vacuole generation, indicating that H+-driven Cl- accumulation osmotically drives vesicle enlargement."
    explanation: >-
      Supplies the physical mechanism this node otherwise states without explaining - the
      vesicles swell because chloride is osmotically dragged in behind pumped protons. It is
      INDIRECT because it was shown for the sibling exchanger ClC-6, not ClC-7. The parallel
      is close: a de novo gain-of-function substitution in an endolysosomal CLC, slowed
      gating, larger currents, giant vacuoles requiring intact Cl-/H+ exchange.
- name: Impaired Lysosomal and Autophagic Degradation
  biological_scale: CELLULAR
  description: >-
    Degradation of endocytosed material falls inside the enlarged compartments and autophagic
    clearance is largely blocked, so undegraded substrate accumulates.
  biological_processes:
  - preferred_term: autophagosome-lysosome fusion and cargo degradation
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  downstream:
  - target: Foam Cell Transformation and Tissue Storage
    causal_link_type: DIRECT
  - target: Delayed Myelination and Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38136669
    reference_title: "Impaired Autophagic Clearance with a Gain-of-Function Variant of the Lysosomal Cl(-)/H(+) Exchanger ClC-7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In cells expressing the ClC-7 gain-of-function mutant, autophagic clearance was largely impaired, resulting in a build-up of autophagic material."
    explanation: Directly reports the autophagic block in cells carrying the HOD variant.
  - reference: PMID:38136669
    reference_title: "Impaired Autophagic Clearance with a Gain-of-Function Variant of the Lysosomal Cl(-)/H(+) Exchanger ClC-7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Degradation of endocytosed material was reduced in these compartments and resulted in an accumulation of lysosomal storage material."
    explanation: Links the enlarged compartments to failed degradation and to storage.
- name: Foam Cell Transformation and Tissue Storage
  biological_scale: TISSUE
  description: >-
    Tissue macrophages fill with undegraded material and become foam cells, most heavily in
    liver portal fields and renal medullary interstitium. The organs enlarge while their
    function is preserved, which is an unusual combination and a useful diagnostic clue.
  cell_types:
  - preferred_term: CD68+ tissue histiocyte
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Organomegaly with Preserved Organ Function
    causal_link_type: DIRECT
  - target: Protein-Losing Enteropathy and Failure to Thrive
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A liver biopsy taken at 19 months of age revealed numerous CD68+ histiocytic cells, particularly in the portal fields, with foamy, highly expanded, and light-colored cytoplasm."
    explanation: Histological demonstration of foam-cell transformation in a patient.
- name: Reduced Melanin Synthesis in Melanosomes
  biological_scale: CELLULAR
  description: >-
    The proposed route to hypopigmentation, and the weakest link in this entry's chain.
    The melanosome is a lysosome-related organelle, tyrosinase is the rate-limiting enzyme
    of melanin synthesis and is inhibited at acidic pH, so a transporter that over-acidifies
    lysosomes is expected to over-acidify melanosomes and suppress pigment. Every step of
    that is plausible and none of it has been measured in this disease: no study has
    reported melanosomal pH, tyrosinase activity or melanosome morphology in a patient with
    HOD syndrome. The supporting evidence below is drawn from melanocyte biology generally
    and is marked INDIRECT for that reason.
  biological_processes:
  - preferred_term: melanin biosynthetic process
    term:
      id: GO:0042438
      label: melanin biosynthetic process
    modifier: DECREASED
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  downstream:
  - target: Hypopigmentation of Skin and Hair
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31214276
    reference_title: "Intramelanocytic Acidification Plays a Role in the Antimelanogenic and Antioxidative Properties of Vitamin C and Its Derivatives."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The activity of tyrosinase, the rate-limiting enzyme required for melanin synthesis, is generally minimal in an acidic environment."
    explanation: >-
      Establishes the pH dependence of tyrosinase in melanocytes. It is about vitamin-C-driven
      cytoplasmic acidification, not ClC-7, so it supports the step by inference rather than
      by observation in this disease.
  - reference: PMID:19389708
    reference_title: "{alpha}MSH and Cyclic AMP elevating agents control melanosome pH through a protein kinase A-independent mechanism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Numerous studies have shown that the pH of melanosome plays a key role in the regulation of melanin synthesis."
    explanation: >-
      Independent support that melanosomal pH governs pigment output. Again general melanocyte
      biology, not a measurement in HOD syndrome.
- name: Hypopigmentation of Skin and Hair
  biological_scale: ORGANISM
  description: >-
    Present in all five reported patients. In the best-described case the hair and eyebrows
    are hypopigmented while the irides are not, so this is not uniform oculocutaneous albinism.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Note hypopigmentation of hair including eyebrows but not the irides, the massively distended abdomen due to organomegaly, and a gastric tube in place because of impaired intestinal transit."
    explanation: >-
      Records the distribution of the pigment defect, including the sparing of the irides that
      separates it from classical oculocutaneous albinism.
- name: Organomegaly with Preserved Organ Function
  biological_scale: ORGANISM
  description: >-
    Liver, spleen and kidneys enlarge, in one case to the point of a massively distended
    abdomen, while laboratory function of those organs stays normal.
  evidence:
  - reference: PMID:31155284
    reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children had delayed myelination and development, organomegaly, and hypopigmentation, but neither had osteopetrosis."
    explanation: Records organomegaly in the two index patients alongside the absence of bone disease.
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over time, he also developed grossly enlarged organs with fully preserved function (liver, spleen, and kidneys)."
    explanation: >-
      The preserved-function detail matters clinically - it means normal liver and renal panels
      do not argue against the diagnosis.
- name: Protein-Losing Enteropathy and Failure to Thrive
  biological_scale: ORGANISM
  description: >-
    Progressive bowel-wall thickening impairs intestinal transit, with malabsorption and loss
    of protein and electrolytes. In the most fully reported patient this, rather than the
    neurological disease, dominates the clinical course.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture is dominated by progressive thickening of bowel walls, resulting in chronic impairment of intestinal transit, an extremely distended abdomen, malabsorption, loss of protein and electrolytes, and failure to thrive"
    explanation: Establishes the enteropathy and its weight in the overall clinical picture.
- name: Delayed Myelination and Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    Delayed myelination on MRI with global developmental delay, and in the longest-followed
    patient reduced cerebral volume with frontotemporal accentuation and symmetrical
    signal change in the subthalamic nuclei.
  evidence:
  - reference: PMID:31155284
    reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children had delayed myelination and development, organomegaly, and hypopigmentation, but neither had osteopetrosis."
    explanation: Records delayed myelination and development in the index patients.
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A cranial MRI at 14 months of age revealed delayed myelination in addition to reduced cerebral volume, particularly evident in the frontotemporal region."
    explanation: Radiological confirmation with the additional finding of volume loss.

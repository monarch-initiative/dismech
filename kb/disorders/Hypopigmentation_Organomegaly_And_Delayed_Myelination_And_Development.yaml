genetic:
- name: CLCN7
  notes: >-
    CLCN7 encodes ClC-7, which with its obligatory beta-subunit OSTM1 performs 2Cl-/H+
    exchange across the lysosomal membrane and across the osteoclast ruffled border. Four
    allelic outcomes are on record, and they do not lie on a single dose axis:

    biallelic loss of function causes infantile malignant autosomal recessive osteopetrosis;
    a dominant-negative allele causes Albers-Schonberg autosomal dominant osteopetrosis type
    II; the gain-of-function alleles below cause HOD syndrome with no bone phenotype at all;
    and simple heterozygous loss of function causes no abnormality whatever. That last point
    is the one most easily lost - CLCN7 haploinsufficiency is silent, so ADO II is not
    "half of" recessive osteopetrosis, and HOD is not the far end of a severity gradient.
  gene_term:
    preferred_term: CLCN7
    term:
      id: hgnc:2025
      label: CLCN7
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  variants:
  - name: p.Tyr715Cys
    description: >-
      c.2144A>G (NM_001287.5), in the cytoplasmic C-terminal domain. Carried by four of the
      five published patients, all de novo.
    clinical_significance: PATHOGENIC
  - name: p.Lys285Thr
    description: >-
      c.854A>C, in the cytoplasmic portion beside the PI(3,5)P2 binding site. Reported once,
      de novo, absent from gnomAD v4.0.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:39056574
    reference_title: "Multisystem disorder associated with a pathogenic variant in CLCN7 in the absence of osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed a de novo gain-of-function variant, p.Tyr715Cys, in the C-terminal domain of ClC-7 encoded by CLCN7."
    explanation: Independent confirmation of the recurrent de novo gain-of-function variant.
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant is absent in the gnomAD database (v.4.0) and is predicted to be deleterious by various commonly applied bioinformatics prediction programs with a CADD score of 28.6 and a REVEL score of 0.872."
    explanation: Population-frequency and in-silico support for the second, novel variant p.Lys285Thr.
  - reference: PMID:11741829
    reference_title: "Albers-Schönberg disease (autosomal dominant osteopetrosis, type II) results from mutations in the ClCN7 chloride channel gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it seems that ADO II reflects a dominant negative effect, whereas loss-of-function mutations in ClCN7 do not cause abnormalities in heterozygous individuals"
    explanation: >-
      Source for the allelic architecture above, and specifically for the claim that
      heterozygous loss of CLCN7 is silent - which is what makes the dominant-negative and
      gain-of-function alleles the only heterozygous routes to disease.
biochemical:
- name: Plasma chitotriosidase
  notes: >-
    Massively elevated in the one patient in whom it was measured - up to 18,400 nmol/h/ml
    against a reference of under 150, more than a hundredfold. Chitotriosidase reports
    activated tissue macrophages, so the value is a readout of the foam-cell burden rather
    than of ClC-7 itself. Useful for the same reason it is useful in Gaucher disease, and
    subject to the same caveat: roughly 6% of people are chitotriosidase-deficient by
    genotype and will not mount the elevation.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient’s plasma chitotriosidase, a biomarker representing tissue-resident macrophage activation upon excessive lipid accumulation, was detected to be tremendously elevated (up to 18,400 nmol/h/ml; reference range <150 nmol/h/ml)."
    explanation: Reports the value, the reference range, and what the marker represents.
treatments:
- name: Chloroquine
  description: >-
    The only mechanism-directed treatment tried. Chloroquine is lysosomotropic and raises
    lysosomal pH, so it opposes the primary lesion directly, and in patient fibroblasts it
    normalised the pH. The clinical result did not follow: one patient treated from 19
    months of age continued to progress. The two evidence items below therefore point in
    opposite directions on purpose - the first supports the mechanism, the second refutes
    clinical efficacy, and collapsing them into a single graded item would lose exactly the
    information a clinician needs.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: chloroquine
      term:
        id: CHEBI:3638
        label: chloroquine
  target_mechanisms:
  - target: Lysosomal Hyperacidification
    description: Raises lysosomal pH, opposing the transporter's over-acidification.
  evidence:
  - reference: PMID:31155284
    reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts from probands displayed a lysosomal pH approximately 0.2 units lower than that of control cells, and treatment with chloroquine normalized the pH."
    explanation: >-
      Chloroquine corrects the primary biochemical lesion in patient cells. This is a claim
      about mechanism, in fibroblasts.
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical course is progressive despite treatment with chloroquine, a drug known to increase lysosomal pH"
    explanation: >-
      Refutes clinical benefit in the one patient followed on treatment. A separate claim from
      the in-vitro rescue above, and the one that matters for care.
diagnosis:
- name: Vacuolated lymphocytes on peripheral blood film
  description: >-
    The cheapest first step. Vacuolated lymphocytes in a child with hypopigmentation and
    organomegaly point at a storage disorder before any sequencing is ordered.
  evidence:
  - reference: PMID:39056574
    reference_title: "Multisystem disorder associated with a pathogenic variant in CLCN7 in the absence of osteopetrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypogammaglobulinemia with lymphocyte vacuoles"
    explanation: Records the blood-film finding in a diagnosed patient.
- name: Trio exome or genome sequencing
  description: >-
    The diagnosis has been made by sequencing in every reported case, and given the de novo
    inheritance a trio design is what makes the call. Note that one patient was diagnosed
    retrospectively by targeted Sanger sequencing of banked fibroblasts, 25 years after death.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was referred to diagnostic trio exome analysis that revealed heterozygosity for a de novo CLCN7 variant"
    explanation: Trio exome as the diagnostic route for the novel variant.
- name: Misleading elevation of bound neuraminic acid
  description: >-
    A named pitfall. In one patient a markedly elevated bound neuraminic acid suggested
    neuraminidase deficiency - that is, sialidosis, a different lysosomal disease with its
    own gene and its own management. The result came back only after genetic testing had
    already given the answer, which is the only reason it did not redirect the workup. The
    generic risk is real: a storage disorder produces abnormal storage biomarkers, and those
    biomarkers name whichever disease they were designed for.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A markedly elevated concentration of bound neuraminic acid suggestive of neuraminidase deficiency was only returned after results of genetic testing."
    explanation: >-
      Documents both the misleading result and the fact that sequencing pre-empted it, which
      is what makes it a pitfall worth recording rather than a diagnostic route.
animal_models:
- name: Clcn7 p.Tyr715Cys knock-in mouse
  species: Mouse
  genotype: Clcn7 knock-in of the variant equivalent to human p.Tyr715Cys, heterozygous
  publication: PMID:31155284
  description: >-
    Reproduces the two most visible features of the human disease, and - importantly for
    this entry's central contrast - also reproduces the absence of bone disease.
  modeled_mechanisms:
  - target: Foam Cell Transformation and Tissue Storage
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Hepatomegaly attributable to abnormal storage, with enlarged vacuoles in fibroblasts.
    limitations: >-
      Reported at the level of organ size and cell morphology; the mouse has not been used to
      test the melanosome-pH step, which is where this entry's chain is weakest.
    evidence:
    - reference: PMID:31155284
      reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A mouse harboring the knock-in Clcn7 variant exhibited hypopigmentation, hepatomegaly resulting from abnormal storage, and enlarged vacuoles in cultured fibroblasts."
      explanation: Recapitulation of storage-driven organomegaly in the knock-in animal.
  - target: Hypopigmentation of Skin and Hair
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      The mouse shows the pigment phenotype but no published work establishes the melanosomal
      mechanism in it either, so it confirms the association without closing the gap.
    evidence:
    - reference: PMID:31155284
      reference_title: "Lysosomal Storage and Albinism Due to Effects of a De Novo CLCN7 Variant on Lysosomal Acidification."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A mouse harboring the knock-in Clcn7 variant exhibited hypopigmentation, hepatomegaly resulting from abnormal storage, and enlarged vacuoles in cultured fibroblasts."
      explanation: The knock-in animal is hypopigmented, matching the human phenotype.
- name: Clcn7 knockout mouse
  species: Mouse
  genotype: Clcn7 null, homozygous
  publication: PMID:15706348
  description: >-
    The loss-of-function counterpart, included deliberately as a contrast rather than as a
    model of this disease. It develops osteopetrosis, neurodegeneration and lysosomal
    storage - and its neurons show unchanged lysosomal pH, which is the opposite of the
    human gain-of-function finding.
  modeled_mechanisms:
  - target: Lysosomal Hyperacidification
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Losing ClC-7 does not lower lysosomal pH - it leaves neuronal lysosomal pH unchanged.
      The pH lesion in HOD is therefore specific to excess transporter activity and is not a
      general consequence of perturbing ClC-7 in either direction.
    limitations: >-
      A null allele, not the human genotype, and pH was measured in cultured neurons rather
      than in the tissues that are enlarged in HOD. It is included to bound the claim that
      ClC-7 sets lysosomal pH, not as a model of HOD.
    evidence:
    - reference: PMID:15706348
      reference_title: "Loss of the chloride channel ClC-7 leads to lysosomal storage disease and neurodegeneration."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "We show that ClC-7 knockout mice additionally display neurodegeneration and severe lysosomal storage disease despite unchanged lysosomal pH in cultured neurons."
      explanation: >-
        Loss of ClC-7 produces storage without a pH shift, so the hyperacidification seen in
        HOD cannot be attributed to disturbed ClC-7 function in general.
differential_diagnoses:
- name: CLCN7-related osteopetrosis
  description: >-
    The allelic disorders, and the reason this entry exists. Autosomal recessive
    osteopetrosis and Albers-Schonberg autosomal dominant osteopetrosis type II arise from
    loss of ClC-7 and are dominated by dense, brittle bone with marrow failure and cranial
    nerve compression. HOD shares the gene and essentially nothing else: no patient has had
    osteopetrosis, and one had a structurally normal skeleton on X-ray at six years. A
    CLCN7 variant found on a gene panel therefore does not by itself indicate which disease
    is present - the direction of its functional effect does.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Osteopetrosis results from a loss of ClC-7, but osteoclasts remain resilient to increased ClC-7 activity."
    explanation: States the asymmetry between the two directions of CLCN7 dysfunction.
- name: Sialidosis (neuraminidase deficiency)
  description: >-
    Raised as a false lead in one reported case by an elevated bound neuraminic acid. It is
    a genuine differential on the clinical picture too, since sialidosis also presents with
    organomegaly, developmental delay and vacuolated cells.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A markedly elevated concentration of bound neuraminic acid suggestive of neuraminidase deficiency was only returned after results of genetic testing."
    explanation: The biochemical result that pointed at the wrong lysosomal disease.
discussions:
- discussion_id: osteoclast_resilience
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does bone escape? Loss of ClC-7 destroys osteoclast resorption and causes
    osteopetrosis, but gain of ClC-7 activity leaves the skeleton structurally normal.
    What makes the osteoclast ruffled border tolerant of excess exchange activity when the
    lysosome is not?
  rationale: >-
    This is the question the disease poses most sharply, and answering it would say
    something general about how much of ClC-7 physiology is set by the transporter versus by
    the compartment it sits in. It also has a practical edge: if a therapy for the
    osteopetroses ever aims to raise ClC-7 activity, the safety question is whether it would
    reproduce HOD, and the answer currently rests on five patients.
  attaches_to:
  - pathophysiology#Increased ClC-7 Chloride/Proton Exchange Current
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Osteopetrosis results from a loss of ClC-7, but osteoclasts remain resilient to increased ClC-7 activity."
    explanation: States the asymmetry without accounting for it, which is the gap.
- discussion_id: melanosome_ph_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is melanosomal pH actually lowered in HOD syndrome, and is that why these patients are
    hypopigmented? No study has measured melanosomal pH, tyrosinase activity or melanosome
    ultrastructure in a patient or in the knock-in mouse.
  rationale: >-
    The melanosome step is the weakest link in this entry's causal chain and the only one
    supported entirely by evidence from outside the disease. The inference is reasonable -
    melanosomes are lysosome-related organelles and tyrosinase is pH-sensitive - but it has
    not been tested, and the knock-in mouse makes it testable. The deep-research report
    reached the same chain independently and listed the same step among its own limitations.
  attaches_to:
  - pathophysiology#Reduced Melanin Synthesis in Melanosomes
  proposed_experiments:
  - experiment_id: melanosome_ph_in_knockin_mouse
    name: Melanosomal pH and tyrosinase activity in the Clcn7 knock-in mouse
    description: >-
      Measure melanosomal pH and tyrosinase activity in melanocytes from the Clcn7
      p.Tyr715Cys knock-in mouse against littermate controls, and ask whether alkalinizing
      treatment restores pigment.
    would_support:
    - pathophysiology#Reduced Melanin Synthesis in Melanosomes
    supporting_outcome:
    - Melanosomal pH is lower in knock-in melanocytes and tyrosinase activity is reduced.
    would_refute:
    - pathophysiology#Reduced Melanin Synthesis in Melanosomes
    refuting_outcome:
    - Melanosomal pH is unchanged, implicating a route to hypopigmentation other than melanosomal over-acidification.
- discussion_id: gof_does_not_uniquely_predict_hod
  kind: KNOWLEDGE_GAP
  prompt: >-
    If gain of ClC-7 function causes HOD and loss causes osteopetrosis, why do some
    osteopetrosis-causing CLCN7 variants also accelerate ClC-7 activation? What besides the
    direction of the functional change decides which disease a CLCN7 variant produces?
  rationale: >-
    The tidy summary - gain gives HOD, loss gives osteopetrosis - is the one this entry is
    built around, and it is not sufficient on its own. Some variants that accelerate
    voltage-dependent activation nevertheless cause osteopetrosis. Whatever separates them
    from p.Tyr715Cys and p.Lys285Thr is unknown, and the PI(3,5)P2 binding site is the
    current candidate because both HOD variants sit in it. Recording this stops the entry
    asserting a cleaner genotype-phenotype rule than the evidence supports.
  attaches_to:
  - pathophysiology#Loss of PI(3,5)P2 Inhibition of ClC-7
  evidence:
  - reference: PMID:38136669
    reference_title: "Impaired Autophagic Clearance with a Gain-of-Function Variant of the Lysosomal Cl(-)/H(+) Exchanger ClC-7."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Interestingly, not all osteopetrosis-causing CLCN7 mutations from patients are associated with a loss of ion transport. Some rather result in an acceleration of voltage-dependent ClC-7 activation."
    explanation: >-
      Refutes the simple reading that increased ClC-7 activation is sufficient to produce the
      HOD phenotype rather than osteopetrosis.
- discussion_id: neural_branch_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which cell type carries the neurological phenotype in HOD syndrome - the oligodendrocyte
    failing to myelinate, the neuron accumulating storage material, or the microglion failing
    to clear debris? None of these has been examined in HOD.
  rationale: >-
    Delayed myelination is one of the four features the syndrome is named for, and it is the
    least mechanistically explained. What is known about ClC-7 in the CNS comes from loss of
    function, which cannot be assumed to transfer to a gain-of-function disease - the mouse
    knockout shows that losing ClC-7 produces storage without any pH change at all.
  attaches_to:
  - pathophysiology#Delayed Myelination and Neurodevelopmental Impairment
  evidence:
  - reference: PMID:38294065
    reference_title: "The Cl- transporter ClC-7 is essential for phagocytic clearance by microglia."
    supports: NO_EVIDENCE
    evidence_source: MODEL_ORGANISM
    snippet: "we show that microglia and embryonic macrophages in zebrafish clcn7 mutants cannot effectively process extracellular debris in the form of apoptotic cells and β-amyloid"
    explanation: >-
      Cited to mark the boundary of what is known, not as support. This is a loss-of-function
      zebrafish study, so it establishes that microglia need ClC-7 but says nothing about what
      excess ClC-7 activity does to them, which is the question HOD raises.
- discussion_id: immune_branch_speculative
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the hypogammaglobulinemia reported in one HOD patient a consequence of the lysosomal
    lesion in B-lineage cells, or an incidental finding in a single case?
  rationale: >-
    The deep-research report proposed a mechanistic immune branch - impaired endolysosomal
    processing in B cells causing hypogammaglobulinemia. That is a plausible hypothesis and
    it is recorded here as one, not curated as a causal edge: it rests on a single patient,
    and no B-cell or immunoglobulin work has been done in this disease. The finding was
    prominent enough in that report for the case to be framed as an inborn error of immunity,
    which is exactly why it is worth marking as unestablished.
  attaches_to:
  - phenotypes#Hypogammaglobulinemia
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five patients in the published literature as of this curation: two in the 2019 founding
    report, two in the 2024 mechanistic paper (one of them diagnosed retrospectively from
    banked fibroblasts, having died in 1999), and one Taiwanese boy in a 2024 case report.
    No prevalence estimate exists and none should be inferred from this count.
  evidence:
  - reference: PMID:38838776
    reference_title: "Gain-of-function variants in CLCN7 cause hypopigmentation and lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now describe two additional HOD individuals with the previously described p.Tyr715Cys and a novel p.Lys285Thr mutation, respectively."
    explanation: Establishes the incremental case count over the two original patients.
notes: >-
  Ontology note. Two bindings were chosen against the deep-research report's suggestions,
  both toward greater specificity rather than away from it. The report offered HP:0003271
  Visceromegaly and HP:0012448 Delayed myelination; both resolve and are correctly labelled,
  but the reported findings are hepatosplenomegaly specifically (HP:0001433) and delayed
  myelination seen on brain MRI (HP:0002188 Delayed CNS myelination), so the narrower terms
  represent the claims accurately.

  Three of the report's identifiers were wrong, and none of them would have been caught by
  term validation, because every one is a real CURIE:

  MONDO:0032781, offered as this disease's own Mondo ID, is congenital hypotonia, epilepsy,
  developmental delay, and digital anomalies - a different rare syndrome that shares the
  words hypotonia and developmental delay. The correct term is MONDO:0032805. This is the
  entry's identity, so copying it would have bound the whole record to the wrong disease.
  The report did hedge it ("to be confirmed against current Mondo release"), which is the
  honest flag, and the hedge is the part worth reading.

  HGNC:2023, offered for CLCN7, is CLCN5 - a different member of the same CLC family, whose
  disease is Dent disease, a renal tubulopathy. CLCN7 is hgnc:2025. Adjacent identifier,
  same family, wrong gene.

  HP:0007730 is offered under the label "Ocular albinism"; its actual label is Iris
  hypopigmentation. Beyond the mislabelling, the claim does not hold for this disease: the
  best-described patient has hypopigmented hair and eyebrows "but not the irides", so an
  iris term should not be bound here at all.

  All identifiers used in this entry were instead derived from the curation stub and
  resolved against local OAK builds.

  Modifier note. The activity node carries modifier GAIN_OF_FUNCTION rather than the
  PATO-bound INCREASED. That trades ontology grounding for accuracy and the trade is
  deliberate: the variants do not merely raise the output of a normally regulated
  transporter, they remove the PI(3,5)P2 inhibition that regulates it and shift its voltage
  dependence, which is the qualitative case CLAUDE.md reserves those values for.

  Deep-research divergence. The committed OpenScientist report independently reproduced this
  entry's causal chain - gain-of-function variant, increased exchange, over-acidification,
  branching to pigment, viscera and brain, with bone spared - and it flagged the melanosome
  step among its own limitations, which is the same judgement reached here. Two of its
  proposals were not adopted. Its immune branch, deriving hypogammaglobulinemia from impaired
  endolysosomal processing in B cells, rests on one patient with no supporting B-cell work
  and is recorded as a knowledge gap rather than as a causal edge. Its neural branch attributes
  delayed myelination to neuronal, oligodendrocyte and microglial lysosomal failure; the
  underlying microglial evidence is a loss-of-function zebrafish study, which cannot be
  carried across to a gain-of-function disease, so that too is a gap rather than a chain.

  GeneReviews note. There is no GeneReviews article for HOD syndrome. The tagged
  GeneReviews reference below is CLCN7-Related Osteopetrosis, listed as the loss-of-function
  counterpart and NOT used as a phenotype baseline for this entry: it describes different
  diseases with a different mechanism and essentially no phenotypic overlap, so taking it as
  the baseline would import fractures, marrow failure and cranial nerve compression into an
  entry whose patients have structurally normal skeletons. Same gene, wrong disease.

  Citation format. The report cites by bare PubMed number in a Key References section rather
  than as PMID: identifiers, so the identifier sweep suggested in the curation skill returns
  nothing on it and its sidecar file was not produced. The references were recovered by
  reading that section. Worth knowing before concluding that an OpenScientist report is
  uncited.

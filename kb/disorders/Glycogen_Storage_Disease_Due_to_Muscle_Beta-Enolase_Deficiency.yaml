biochemical:
- name: Muscle beta-enolase activity
  notes: >-
    Direct enzymatic assay of beta-enolase activity in a skeletal muscle biopsy.
    Reported residual activities in confirmed patients span 5-20%. Because some
    pathogenic variants preserve substantial residual activity while altering
    kinetics, activity alone does not separate all patients from controls, which
    is the argument for kinetic as well as endpoint measurement.
  evidence:
  - reference: PMID:11506403
    reference_title: Beta-enolase deficiency, a new metabolic myopathy of distal glycolysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A severe muscle enolase deficiency, with 5% of residual activity, was
      detected in a 47-year-old man affected with exercise intolerance and
      myalgias.
    explanation: >-
      Residual activity measurement in the index patient.
  - reference: PMID:31741825
    reference_title: The need for biochemical testing in beta-enolase deficiency in the genomic era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      p.E187K caused extremely low total enolase activity. p.C357Y was associated
      with a higher level of residual activity but kinetic studies showed a lower
      maximum work rate (V max).
    explanation: >-
      Shows that endpoint activity and kinetic profile can dissociate between
      variants, which is why kinetic studies are recommended.
- name: Forearm exercise test lactate response
  notes: >-
    The lactate rise on forearm exercise testing is inconsistent in GSDXIII and
    should not be relied on to exclude the diagnosis. The 2001 index patient
    showed no rise on ischaemic testing; a 2014 series found only a very mild
    rise; and a 2021 physiological study found normal lactate production on
    non-ischaemic testing in all three patients studied. The discrepancy tracks
    at least partly with test protocol (ischaemic versus non-ischaemic).
  evidence:
  - reference: PMID:11506403
    reference_title: Beta-enolase deficiency, a new metabolic myopathy of distal glycolysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No rise of serum lactate was observed with the ischemic forearm exercise.
    explanation: >-
      The absent lactate rise in the index patient, on an ischaemic protocol.
  - reference: PMID:34485019
    reference_title: Energy metabolism during exercise in patients with β-enolase deficiency (GSDXIII).
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During nonischemic forearm test, all patients were able to produce lactate
      in normal amounts.
    explanation: >-
      Refutes any general claim that GSDXIII patients fail to raise lactate on
      forearm exercise testing. Recorded as REFUTE against the flat-lactate
      expectation inherited from the index case.
  - reference: PMID:25267339
    reference_title: "Recurrent rhabdomyolysis due to muscle β-enolase deficiency: very rare or underestimated?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both cases, there was a very mild rise in lactate during a forearm
      exercise test.
    explanation: >-
      An intermediate result: a rise occurred but was blunted, sitting between
      the index case and the 2021 series.
  - reference: PMID:30397902
    reference_title: Myopathies Related to Glycogen Metabolism Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A failure of serum lactate to rise with exercise with an exaggerated ammonia
      response is a common, but not invariant, finding.
    explanation: >-
      Class-level review explicitly stating that the flat-lactate finding is not
      invariant across the glycogen metabolism myopathies.
genetic:
- name: ENO3 pathogenic variants
  gene_term:
    preferred_term: ENO3
    term:
      id: hgnc:3354
      label: ENO3
  association: Causative
  notes: >-
    Reported pathogenic variants include the index compound heterozygous pair
    p.Gly156Asp and p.Gly374Glu, and the homozygous missense variants p.Asn151Ser,
    p.Glu187Lys and p.Cys357Tyr. Both null-type and kinetically abnormal alleles
    cause disease.
  evidence:
  - reference: PMID:11506403
    reference_title: Beta-enolase deficiency, a new metabolic myopathy of distal glycolysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ENO3 gene of our patient carries two heterozygous missense mutations
      affecting highly conserved amino acid residues; a G467A transition changing
      a glycine residue at position 156 to aspartate, in close proximity to the
      catalytic site, and a G1121A transition changing a glycine to glutamate at
      position 374.
    explanation: >-
      The originally reported causative ENO3 genotype.
  - reference: PMID:25267339
    reference_title: "Recurrent rhabdomyolysis due to muscle β-enolase deficiency: very rare or underestimated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular genetic analysis of ENO3 gene revealed two novel homozygous
      missense mutations, (p.Asn151Ser and p.Glu187Lys).
    explanation: >-
      Two further causative ENO3 genotypes in unrelated families.
  - reference: PMID:31741825
    reference_title: The need for biochemical testing in beta-enolase deficiency in the genomic era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next generation sequencing confirmed patient 1 was homozygous for p.E187K in
      ENO3, while patient 2 was homozygous for p.C357Y.
    explanation: >-
      Confirms p.E187K recurrence and adds p.C357Y.
diagnosis:
- name: Muscle biopsy with beta-enolase enzymology
  description: >-
    Diagnosis rests on muscle enzymology together with molecular genetics.
    Beta-enolase protein is reduced on immunohistochemistry and immunoblotting
    while alpha-enolase is preserved, and muscle histology shows only minimal
    changes, so a normal-looking biopsy does not exclude the diagnosis.
  evidence:
  - reference: PMID:11506403
    reference_title: Beta-enolase deficiency, a new metabolic myopathy of distal glycolysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The beta-enolase protein was dramatically reduced in the muscle of our
      patient, by both immunohistochemistry and immunoblotting, while alpha-enolase
      was normally represented.
    explanation: >-
      The isoform-selective protein deficit that anchors the biopsy diagnosis.
  - reference: PMID:25267339
    reference_title: "Recurrent rhabdomyolysis due to muscle β-enolase deficiency: very rare or underestimated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle biopsy showed minimal changes with no lipid or glycogen accumulation.
    explanation: >-
      Warns that routine histology can be unremarkable despite biochemical
      deficiency.
- name: Functional confirmation of ENO3 variants
  description: >-
    Because next-generation sequencing panels for rhabdomyolysis now identify ENO3
    variants before any biochemical testing, functional confirmation in skeletal
    muscle is recommended to establish pathogenicity, including kinetic study for
    variants retaining residual activity.
  evidence:
  - reference: PMID:31741825
    reference_title: The need for biochemical testing in beta-enolase deficiency in the genomic era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study highlights the importance of carrying out functional studies as
      part of the diagnostic process following the identification of variants with
      next generation sequencing.
    explanation: >-
      States the recommendation for functional confirmation directly.

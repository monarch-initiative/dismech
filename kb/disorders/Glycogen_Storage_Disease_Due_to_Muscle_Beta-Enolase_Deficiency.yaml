discussions:
- discussion_id: gap_gsd13_forearm_lactate_inconsistency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is the forearm exercise test lactate response inconsistent across GSDXIII
    patients, and can a standardised protocol discriminate GSDXIII from controls?
  attaches_to:
  - "pathophysiology#Distal Glycolytic Block"
  rationale: >-
    A distal glycolytic block should blunt exercise lactate production, and this
    was observed in the 2001 index patient on ischaemic forearm testing. But a
    2014 series found only a very mild blunting, and a 2021 physiological study
    found normal lactate production in all three patients on non-ischaemic
    testing. Since beta-enolase catalyses the penultimate glycolytic step, normal
    lactate output implies either substantial residual flux through the remaining
    enzyme, or a compensating route that has not been identified. This matters
    diagnostically as well as mechanistically: a normal forearm test is currently
    being used to exclude glycolytic defects, and on this evidence it cannot
    exclude GSDXIII.
  proposed_experiments:
  - experiment_id: exp_gsd13_forearm_protocol_controlled
    name: Protocol-controlled forearm exercise testing in genetically confirmed GSDXIII
    description: >-
      Test the same genetically confirmed patients under both ischaemic and
      non-ischaemic forearm protocols, measuring venous lactate and ammonia, to
      establish whether protocol alone accounts for the discrepant published
      results.
  - experiment_id: exp_gsd13_glycolytic_flux_by_residual_activity
    name: Muscle glycolytic flux measurement stratified by residual enzyme activity
    description: >-
      Measure in vivo glycolytic flux (e.g. by phosphorus magnetic resonance
      spectroscopy) in patients spanning the reported 5-20% residual activity
      range, to determine the residual activity threshold above which exercise
      lactate production is preserved.
- discussion_id: gap_gsd13_extramuscular_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does GSDXIII produce any clinical phenotype outside skeletal muscle, given
    that ENO3 is expressed in other tissues?
  attaches_to:
  - "pathophysiology#Beta-Enolase Deficiency"
  rationale: >-
    All reported patients have a purely myopathic presentation, and beta-enolase
    is described as carrying over 90% of enolase activity in adult human muscle.
    Whether the absence of extramuscular disease reflects genuinely
    muscle-restricted dependence on beta-enolase, or simply the small number of
    reported patients and the muscle-focused ascertainment route (rhabdomyolysis
    gene panels), is untested. The reported cohort is too small and too
    selectively ascertained to settle it.
  proposed_experiments:
  - experiment_id: exp_gsd13_unselected_cohort_phenotyping
    name: Systematic multisystem phenotyping of an unselected ENO3 biallelic cohort
    description: >-
      Recruit biallelic ENO3 carriers identified through population or
      broad-indication exome sequencing rather than through rhabdomyolysis panels,
      and phenotype cardiac, hepatic and neurological systems prospectively.
notes: >-
  Scope and boundaries. This entry covers muscle beta-enolase (ENO3) deficiency
  only. It is mechanistically distinct from the other distal glycolytic
  myopathies that share its clinical picture, in particular phosphoglycerate
  mutase (PGAM2) deficiency immediately upstream, and from the far more common
  McArdle disease (PYGM), against which GSDXIII is consistently described as
  milder.

  Two claims that circulate about this disorder are not supported by the current
  literature and are deliberately not asserted here. The first is that GSDXIII
  characteristically shows a flat lactate curve on forearm exercise testing: that
  was true of the 2001 index patient on an ischaemic protocol, but later patients
  produced lactate normally or near-normally, and the entry records the
  discrepancy as an open knowledge gap rather than picking a side. The second is
  that GSDXIII spares patients from myoglobinuria: the index patient had no
  pigmenturia, but every subsequently reported patient has had recurrent
  rhabdomyolysis, in one instance requiring dialysis.

  No module conformance is declared. The distal glycolytic block here has no
  counterpart among the current kb/modules/ set, and the metabolic modules that
  exist (metabolic_intoxication_decompensation) model toxic-metabolite
  accumulation and catabolic decompensation, which is not the mechanism in
  GSDXIII: nothing accumulates to a toxic level and there is no decompensation
  crisis driven by catabolic stress.

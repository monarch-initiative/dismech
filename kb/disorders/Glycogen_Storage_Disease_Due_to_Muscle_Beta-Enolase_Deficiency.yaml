name: Glycogen Storage Disease Due to Muscle Beta-Enolase Deficiency
creation_date: "2026-08-24T13:20:00Z"
description: >-
  Glycogen storage disease type XIII (GSDXIII, muscle beta-enolase deficiency) is
  an ultra-rare autosomal recessive metabolic myopathy caused by biallelic ENO3
  variants. Beta-enolase is the muscle-specific enolase subunit that catalyses the
  interconversion of 2-phosphoglycerate and phosphoenolpyruvate, and accounts for
  over 90% of enolase activity in adult human muscle, so its loss blocks the distal
  (post-phosphoglycerate-mutase) segment of glycolysis. Patients present with
  exercise intolerance, exertional myalgia and recurrent rhabdomyolysis. Two
  mechanistically distinct variant classes are recognised: null variants that
  abolish beta-enolase, and missense variants that destabilise the enzyme or alter
  its kinetic profile while leaving residual activity.
synonyms:
- GSDXIII
- GSD XIII
- glycogen storage disease type 13
- muscle beta-enolase deficiency
- beta-enolase deficiency
- enolase 3 deficiency
- ENO3-related metabolic myopathy
- glycogenosis due to muscle beta-enolase deficiency

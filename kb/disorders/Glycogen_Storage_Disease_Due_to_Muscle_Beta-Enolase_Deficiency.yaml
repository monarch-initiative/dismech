    reference_title: Energy metabolism during exercise in patients with β-enolase deficiency (GSDXIII).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with GSDXIII experience exercise intolerance and episodes of
      myoglobinuria, even to the point of needing renal dialysis, but still retain

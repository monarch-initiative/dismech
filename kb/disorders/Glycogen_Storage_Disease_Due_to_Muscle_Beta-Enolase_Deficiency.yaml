  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:30397902
    reference_title: Myopathies Related to Glycogen Metabolism Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therapy for glycogen storage diseases that result in exercise-induced
      symptoms includes lifestyle adaptation and carefully titrated exercise.
    explanation: >-
      Class-level management recommendation covering the exercise-induced
      glycogenoses, of which GSDXIII is one.

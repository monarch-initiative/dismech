pathophysiology:
- name: Beta-Enolase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic ENO3 variants reduce or abolish muscle beta-enolase. Two distinct
    molecular routes are documented: destabilising missense substitutions that
    lower the amount of correctly folded dimeric enzyme, and variants that leave
    higher residual activity but alter the enzyme's kinetic profile. Beta-enolase
    accounts for over 90% of enolase activity in adult human muscle, so there is
    no effective isoform redundancy in that tissue.
  genes:
  - preferred_term: ENO3
    term:
      id: hgnc:3354
      label: ENO3
  molecular_functions:
  - preferred_term: phosphopyruvate hydratase activity
    modifier: DECREASED
    term:
      id: GO:0004634
      label: phosphopyruvate hydratase activity
  evidence:
  - reference: PMID:11506403
    reference_title: Beta-enolase deficiency, a new metabolic myopathy of distal glycolysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In adult human muscle, over 90% of enolase activity is accounted for by the
      beta-enolase subunit, the protein product of the ENO3 gene.
    explanation: >-
      Establishes that beta-enolase carries almost all muscle enolase activity,
      which is why an ENO3 defect is not buffered by other enolase isoforms.
  - reference: PMID:11506403
    reference_title: Beta-enolase deficiency, a new metabolic myopathy of distal glycolysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A severe muscle enolase deficiency, with 5% of residual activity, was
      detected in a 47-year-old man affected with exercise intolerance and
      myalgias.
    explanation: >-
      Quantifies the enzymatic deficiency in the index patient.
  - reference: PMID:25267339
    reference_title: "Recurrent rhabdomyolysis due to muscle β-enolase deficiency: very rare or underestimated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical studies on muscle tissue demonstrated a marked reduction of
      muscle β-enolase activity (20 and 10% of residual activity, respectively).
    explanation: >-
      Independent biochemical confirmation of reduced muscle beta-enolase
      activity in two further, unrelated patients.
  - reference: PMID:31741825
    reference_title: The need for biochemical testing in beta-enolase deficiency in the genomic era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study illustrates that GSDXIII may be caused by either null mutations
      leading to β-enolase deficiency or by mutations that alter the enzyme's
      kinetic profile.
    explanation: >-
      Direct evidence for the two-route molecular lesion curated on this node.
  - reference: PMID:18070103
    reference_title: Effects of the G376E and G157D mutations on the stability of yeast enolase--a model for human muscle enolase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      They are less stable than wild-type enolase with respect to thermal
      denaturation, and both have increased Kd values for subunit dissociation.
    explanation: >-
      Yeast-enolase surrogates of the index patient's two substitutions are
      correctly folded but destabilised, supporting protein instability rather
      than misfolding as the molecular consequence. Cited as IN_VITRO because the
      measurement is on a yeast orthologue, not the human enzyme.
  downstream:
  - target: Distal Glycolytic Block
    description: >-
      Loss of beta-enolase activity blocks the interconversion of
      2-phosphoglycerate and phosphoenolpyruvate, interrupting glycolysis at the
      penultimate step of the distal pathway.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11506403
      reference_title: Beta-enolase deficiency, a new metabolic myopathy of distal glycolysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The enzyme enolase catalyzes the interconversion of 2-phosphoglycerate and
        phosphoenolpyruvate.
      explanation: >-
        Identifies the exact glycolytic step that beta-enolase loss interrupts.
- name: Distal Glycolytic Block
  biological_scale: CELLULAR
  description: >-
    Interruption of glycolysis distal to phosphoglycerate mutase limits ATP
    generation from glycogen-derived carbon in skeletal muscle during
    higher-intensity exercise, and is accompanied by focal sarcoplasmic
    accumulation of glycogen beta particles.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: glycolytic process
    modifier: DECREASED
    term:
      id: GO:0006096
      label: glycolytic process
  evidence:
  - reference: PMID:25267339
    reference_title: "Recurrent rhabdomyolysis due to muscle β-enolase deficiency: very rare or underestimated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle β-enolase deficiency is a very rare inherited metabolic myopathy
      caused by an enzymatic defect of distal glycolysis.
    explanation: >-
      Places the metabolic block in the distal segment of glycolysis.
  - reference: PMID:11506403
    reference_title: Beta-enolase deficiency, a new metabolic myopathy of distal glycolysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrastructural analysis showed focal sarcoplasmic accumulation of glycogen
      beta particles.
    explanation: >-
      The glycogen accumulation that places this disorder among the glycogen
      storage diseases, though it is focal rather than the massive storage seen
      in other GSDs.
  downstream:
  - target: Exertional Muscle Energy Failure and Myofiber Injury
    description: >-
      Impaired glycolytic ATP supply during higher-intensity exercise produces
      exertional symptoms and, when severe, sarcolemmal failure with
      rhabdomyolysis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34485019
      reference_title: Energy metabolism during exercise in patients with β-enolase deficiency (GSDXIII).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients had lower VO2max than healthy controls, and two of three patients
        had to stop prematurely during the intended 1-hour submaximal exercise
        test.
      explanation: >-
        In vivo exercise physiology demonstrating the reduced exercise capacity
        that the glycolytic block produces.
- name: Exertional Muscle Energy Failure and Myofiber Injury
  biological_scale: TISSUE
  description: >-
    Exercise-induced energy shortfall in glycolytic muscle fibres causes myalgia,
    cramps and exercise intolerance, and can progress to frank rhabdomyolysis with
    myoglobinuria. Serum creatine kinase is characteristically normal between
    episodes and rises only with rhabdomyolysis, distinguishing GSDXIII from the
    myopathic glycogenoses that carry a persistently raised CK.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:25267339
    reference_title: "Recurrent rhabdomyolysis due to muscle β-enolase deficiency: very rare or underestimated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two men, one Italian and one Turkish, with consanguineous
      parents, who complained of several episodes of intense myalgia, cramps,
      generalized muscle tenderness and dark urine.
    explanation: >-
      Directly documents the exertional myalgia, cramps and pigmenturia of
      rhabdomyolysis in ENO3-confirmed patients.
  - reference: PMID:34485019
    reference_title: Energy metabolism during exercise in patients with β-enolase deficiency (GSDXIII).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with GSDXIII experience exercise intolerance and episodes of
      myoglobinuria, even to the point of needing renal dialysis, but still retain
      an almost normal anaerobic metabolic response to submaximal intensity
      exercise.
    explanation: >-
      Establishes both the severity ceiling (dialysis-requiring myoglobinuria)
      and the preserved submaximal anaerobic response that makes this a mild
      glycolytic defect overall.
  - reference: PMID:30397902
    reference_title: Myopathies Related to Glycogen Metabolism Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The serum creatine kinase (CK) is often elevated in the myopathic forms and
      in PYGM deficiency, but can be normal and increase only with rhabdomyolysis
      (PGAM2, PFK, ENO3).
    explanation: >-
      Class-level review naming ENO3 among the glycolytic defects in which CK is
      normal between rhabdomyolysis episodes.
  downstream:
  - target: Exercise intolerance
    description: Reduced glycolytic ATP supply limits sustained and higher-intensity exercise.
  - target: Exercise-induced myalgia
    description: Exertional energy failure produces post-exercise muscle pain.
  - target: Rhabdomyolysis
    description: Severe exertional energy failure causes myofiber breakdown with myoglobin release.
  - target: Myoglobinuria
    description: Myoglobin released during rhabdomyolysis is excreted, producing pigmenturia.
  - target: Muscle cramp
    description: Exertional metabolic stress in glycolytic fibres provokes cramping.
  - target: Elevated circulating creatine kinase concentration
    description: >-
      Myofiber membrane injury releases creatine kinase, which rises with
      rhabdomyolysis while typically remaining normal between episodes.

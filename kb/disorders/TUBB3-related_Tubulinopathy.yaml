    explanation: Directly supports a later-onset neuropathy in a subset.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Burden ranges widely with the structural brain phenotype. Cortical forms can
    cause severe motor and intellectual disability and epilepsy, while milder
    axon-guidance forms may survive into adulthood but require ophthalmologic,
    developmental, and sometimes neuropathy care.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: Tubulinopathies Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While most affected individuals have severe-to-profound intellectual disability, a minority have less extensive
      cortical malformations that result in only moderate intellectual disability, and a few have limited malformations
      that allow near-normal cognitive abilities.
    explanation: GeneReviews documents the broad severity spectrum and substantial cognitive burden.

      supports: SUPPORT
      evidence_source: OTHER
      snippet: "RANBP2 | HGNC:9848 | familial acute necrotizing encephalopathy | MONDO:0011953 | AD | Moderate"
      explanation: ClinGen Epilepsy GCEP classifies RANBP2 in familial ANE as Moderate, autosomal dominant.

- name: Acute Febrile Viral Illness
  biological_scale: ORGANISM
  description: >-
    A common systemic viral infection, usually respiratory or
    gastrointestinal, with fever and prodromal symptoms. It is the
    obligatory environmental trigger: the encephalopathy begins within about
    12 hours to 4 days of the first viral symptoms. The virus is not found in
    the brain.
  evidence:
  - reference: PMID:19118815
    reference_title: "Infection-triggered familial or recurrent cases of acute necrotizing encephalopathy caused by mutations in a component of the nuclear pore, RANBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "previously healthy children develop encephalopathy, seizures, and coma within days after the onset of a common childhood febrile infection, such as influenza A or parainfluenza,3 without evidence of viral infection of the brain or inflammatory cell infiltration"
    explanation: The trigger is a systemic febrile infection, not CNS infection.
  downstream:
  - target: Fever
  - target: Vomiting
  - target: Enhanced Influenza Virus Replication
    hypothesis_groups:
    - viral_replication_restraint
  - target: Pro-Inflammatory Cytokine Overproduction
    evidence:
    - reference: PMID:21610332
      reference_title: "The interplay of infection and genetics in acute necrotizing encephalopathy."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Inflammatory factors participate in the pathogenesis of ANE, but the lack of difference between influenza and noninfluenza ANE focuses attention on the abnormal host response as causative."
      explanation: >-
        Different infections give the same phenotype, so the infection acts
        through an abnormal host inflammatory response.
- name: Enhanced Influenza Virus Replication
  biological_scale: CELLULAR
  description: >-
    RANBP2 normally restrains influenza A genome replication and nuclear
    export of viral RNA. Its depletion or mislocalization favors nuclear
    import of the viral polymerase subunits and export of viral genomic RNA,
    raising viral replication in airway epithelial cells.
  biological_processes:
  - preferred_term: viral genome replication
    modifier: INCREASED
    term:
      id: GO:0019079
      label: viral genome replication
  cell_types:
  - preferred_term: respiratory tract epithelial cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  evidence:
  - reference: PMID:41651846
    reference_title: "The genetic driver of Acute Necrotizing Encephalopathy, RANBP2, regulates the inflammatory response to Influenza A virus infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the depletion of RANBP2 in a human airway epithelial cell line increases IAV genomic replication by favouring the import of the viral polymerase subunits, PB1, PB2, and PA, following viral transcription and translation."

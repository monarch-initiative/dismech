name: Familial Acute Necrotizing Encephalopathy
creation_date: "2026-10-15T01:37:42Z"
category: Mendelian
synonyms:
- ANE1
- acute necrotizing encephalopathy type 1
- ADANE
- autosomal dominant acute necrotizing encephalopathy
- recurrent acute necrotizing encephalopathy
- infection-induced acute encephalopathy 3
- IIAE3
- susceptibility to infection-induced acute encephalopathy 3
- RANBP2-associated acute necrotizing encephalopathy
description: >-
  Familial acute necrotizing encephalopathy (ANE1) is an autosomal dominant,
  incompletely penetrant susceptibility to acute necrotizing encephalopathy
  caused by heterozygous missense variants in the nuclear pore gene RANBP2,
  most often p.Thr585Met. In a carrier, a common febrile viral illness
  (influenza A in particular, but also influenza B, parainfluenza, human
  herpesvirus 6, enteroviruses and SARS-CoV-2) is followed within hours to a
  few days by rapidly progressive encephalopathy with lethargy, seizures and
  coma, and by bilateral symmetric necrotic lesions of the thalami, brainstem,
  putamina and other deep grey and white matter structures, without direct
  viral invasion of the brain. Raised interleukin-6 and TNF-alpha and raised
  CSF protein without pleocytosis point to a host hyperinflammatory response
  as the proximate cause, but how the RANBP2 variants produce it is unsettled.
  About a third of affected individuals die in the acute phase, half of
  survivors have permanent neurologic deficits, and recurrent episodes occur
  in about half of affected individuals, which distinguishes ANE1 from the
  usual sporadic, non-recurrent form of ANE. Median age at first episode is
  about two years, but first episodes also occur in adolescents and adults.

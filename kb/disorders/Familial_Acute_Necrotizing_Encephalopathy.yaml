    cytokines and chemokines. Two non-exclusive routes from RANBP2 have been
    proposed: loss of RANBP2-mediated restraint on viral replication, and loss
    of RANBP2-mediated translational repression of IL-6 and TNF-alpha mRNAs.
    The second is contested, because a RANBP2 construct carrying three ANE
    variants still represses IL-6 mRNA.

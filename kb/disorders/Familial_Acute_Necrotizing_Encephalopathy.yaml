- name: Impaired RANBP2-Dependent Mitochondrial Support
  biological_scale: CELLULAR
  description: >-
    RANBP2 interacts with the cytochrome c oxidase chaperone COX11 and
    positions mitochondria through kinesin-1, independently of Ran. The
    symmetric lesion pattern resembles Leigh syndrome and Wernicke
    encephalopathy, suggesting that a variant-dependent energy failure in
    vulnerable deep grey matter may contribute during fever. This route is
    supported only by biochemical and analogical evidence.
  biological_processes:
  - preferred_term: mitochondrion localization
    modifier: DECREASED
    term:
      id: GO:0051646
      label: mitochondrion localization

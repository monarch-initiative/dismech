genetic:
- name: RANBP2
  gene_term:
    preferred_term: RANBP2
    term:
      id: hgnc:9848
      label: RANBP2
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  association: Heterozygous missense variants in the RANBP2 leucine-rich N-terminal domain
  features: >-
    The recurrent p.Thr585Met variant (c.1880C>T, also reported as c.1754C>T
    on a shorter transcript) accounts for most families, has arisen
    independently and de novo several times, and is absent from controls.
    p.Thr653Ile and p.Ile656Val alter conserved residues in the same
    leucine-rich domain. A biallelic p.Thr585Met case has been reported. The
    variants are not found in isolated (sporadic, non-recurrent) ANE.
  gene_disease_validity:

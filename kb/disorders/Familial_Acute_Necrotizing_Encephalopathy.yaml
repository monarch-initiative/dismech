  title: "RANBP2 / familial acute necrotizing encephalopathy (Moderate)"
notes: >-
  Scope: this entry covers RANBP2-associated (genetic, familial or recurrent)
  ANE. Sporadic, non-recurrent ANE without a RANBP2 variant, including
  familial clusters without a RANBP2 variant, is a differential diagnosis and
  not a subtype; non-RANBP2 genetic contributors (thermolabile CPT2 variants,
  biallelic RNH1 variants, HLA genotypes) define separate susceptibilities.
  The GeneReviews chapter on this condition (Susceptibility to
  Infection-Induced Acute Encephalopathy 3) has been retired by GeneReviews
  and is cited as an archival expert summary. ClinGen classifies the RANBP2
  relationship as Moderate rather than Definitive because of the low
  penetrance and absence of curated experimental data. Reported outcome
  predictors of ANE (the ANE severity score, hyperferritinemia, AST
  elevation, shock and brainstem involvement) come from ANE cohorts whose
  RANBP2 status was not reported, so they are not curated here as
  properties of ANE1.

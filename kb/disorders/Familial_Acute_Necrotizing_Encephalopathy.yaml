mechanistic_hypotheses:
- hypothesis_group_id: cytokine_storm
  hypothesis_label: Infection-triggered cytokine storm with blood-brain barrier failure
  status: CANONICAL
  description: >-
    The prevailing model: the febrile infection provokes an excessive host
    cytokine response (IL-6, TNF-alpha), which damages the cerebral
    microvasculature, opens the blood-brain barrier and produces symmetric
    edema, hemorrhage and necrosis. It is canonical for ANE as a whole and
    underpins immunomodulatory treatment, but how RANBP2 variants drive the
    cytokine excess, and why the lesions are so selectively distributed, is
    not established.
  evidence:
  - reference: PMID:19118815
    reference_title: "Infection-triggered familial or recurrent cases of acute necrotizing encephalopathy caused by mutations in a component of the nuclear pore, RANBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "leading to the prevailing hypothesis of a “cytokine storm” as part of the pathogenic mechanism"
    explanation: Cytokine storm described as the prevailing hypothesis.
  - reference: PMID:35408907
    reference_title: "Roles of Nucleoporin RanBP2/Nup358 in Acute Necrotizing Encephalopathy Type 1 (ANE1) and Viral Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in the RANBP2 gene are associated with acute necrotizing encephalopathy type 1 (ANE1), a rare condition where patients experience a sharp rise in cytokine production in response to viral infection and undergo hyperinflammation, seizures, coma, and a high rate of mortality."
    explanation: Review framing ANE1 as virus-triggered hyperinflammation.
- hypothesis_group_id: viral_replication_restraint
  hypothesis_label: Loss of RANBP2 restraint on viral replication drives hyperinflammation
  status: EMERGING
  description: >-
    The ANE1 variant displaces RANBP2 from the nuclear envelope, which
    increases influenza A replication and viral RNA export and drives
    pro-inflammatory cytokine and chemokine production. Shown in a human
    airway cell line and primary macrophages; not yet tested in neural tissue
    or patients.
  evidence:
  - reference: PMID:41651846
    reference_title: "The genetic driver of Acute Necrotizing Encephalopathy, RANBP2, regulates the inflammatory response to Influenza A virus infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, our results reveal that RANBP2 regulates influenza RNA replication and nuclear export, thereby restraining virus-induced hyperinflammation"
    explanation: Cell-model evidence for the restraint model.
- hypothesis_group_id: mitochondrial_energy_failure
  hypothesis_label: RANBP2-dependent mitochondrial dysfunction and energy failure
  status: EMERGING
  description: >-
    RANBP2 positions mitochondria and binds COX11; the variants weaken the
    COX11 interaction, and the lesion pattern resembles Leigh syndrome and
    Wernicke encephalopathy. Whether ATP production actually falls in
    patient cells has not been shown.
  evidence:
  - reference: PMID:34400285
    reference_title: "RANBP2 mutation causing autosomal dominant acute necrotizing encephalopathy attenuates its interaction with COX11."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutated RANBP2 had an attenuated binding ability to COX11. Whether this change indeed decreases ATP production remains to be further explored."
    explanation: Biochemical support, with the functional consequence unresolved.
  - reference: PMID:32426208
    reference_title: "Genetic Acute Necrotizing Encephalopathy Associated with RANBP2: Clinical and Therapeutic Implications in Pediatrics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Several features of this condition suggest a metabolic or mitochondrial etiology."
    explanation: Review summarizing the metabolic/mitochondrial hypothesis.
discussions:
- discussion_id: incomplete_penetrance_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - inheritance#Autosomal dominant
  prompt: >-
    Why do most RANBP2 variant carriers never develop ANE, and why does the
    same carrier escape some infections but not others?
  rationale: >-
    Neither the infecting agent nor known genetic background explains the
    incomplete penetrance or the episodic course. A temperature-sensitive
    misfolding of the variant protein, so that height and duration of fever
    matter, has been proposed but not tested.
  evidence:
  - reference: PMID:19118815
    reference_title: "Infection-triggered familial or recurrent cases of acute necrotizing encephalopathy caused by mutations in a component of the nuclear pore, RANBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the amino acid substitutions result in temperature sensitivity, resulting in protein misfolding and alteration of function, variations in the severity and duration of fever could contribute to the reduced penetrance."
    explanation: The temperature-sensitivity hypothesis for reduced penetrance.
  - reference: PMID:34059398
    reference_title: "Recurrent acute necrotizing encephalopathy in a boy with RANBP2 mutation and thermolabile CPT2 variant: The first case of ANE1 in Japan."
    supports: SUPPORT

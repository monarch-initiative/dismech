inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  penetrance_percentage: "40"
  expressivity: VARIABLE
  description: >-
    A single heterozygous RANBP2 missense variant confers susceptibility. The
    variant is often inherited from an unaffected or mildly affected parent
    because penetrance is incomplete (estimated at 40% in the index kindred),
    and it can also arise de novo. Outcome varies widely within families
    carrying the same variant.
  evidence:
  - reference: PMID:19118815
    reference_title: "Infection-triggered familial or recurrent cases of acute necrotizing encephalopathy caused by mutations in a component of the nuclear pore, RANBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a 7 Mb interval containing a susceptibility locus (ANE1) in a family segregating recurrent ANE as an incompletely penetrant, autosomal-dominant trait"
    explanation: >-
      Linkage and segregation in the index kindred establish autosomal
      dominant inheritance with incomplete penetrance.
  - reference: PMID:19118815
    reference_title: "Infection-triggered familial or recurrent cases of acute necrotizing encephalopathy caused by mutations in a component of the nuclear pore, RANBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Penetrance was estimated at 40% and recurrent episodes occurred in half of the affected individuals."
    explanation: Source of the 40% penetrance estimate.
  - reference: PMID:37090838
    reference_title: "Variable Presentation and Reduced Penetrance in Autosomal Dominant Acute Necrotizing Encephalopathy Related to RANBP2 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report reinforces incomplete penetrance of ADANE and intrafamilial phenotypic variability of outcome."
    explanation: >-
      Two further families with p.Thr585Met carried by affected and
      asymptomatic members, with variable outcome within each family.
  - reference: PMID:25473726
    reference_title: "Susceptibility to Infection-Induced Acute Encephalopathy 3 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Susceptibility to IIAE3 is inherited in an autosomal dominant manner."
    explanation: Expert-review statement of the mode of inheritance.
- name: Incomplete penetrance
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  description: >-
    Many obligate carriers never have an episode, and an affected child's
    carrier parent is frequently unaffected.
  evidence:
  - reference: PMID:25473726
    reference_title: "Susceptibility to Infection-Induced Acute Encephalopathy 3 – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To date the majority of individuals diagnosed with IIAE3 have a parent who is heterozygous for a RANBP2 pathogenic variant; however, due to reduced penetrance, the parent may not have manifested the disease state."
    explanation: Reduced penetrance explains unaffected carrier parents.
  - reference: PMID:25522933
    reference_title: "RANBP2 mutation and acute necrotizing encephalopathy: 2 cases and a literature review of the expanding clinico-radiological phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

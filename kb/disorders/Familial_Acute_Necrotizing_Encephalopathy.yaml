pathophysiology:
- name: Germline RANBP2 Missense Variant
  biological_scale: MOLECULAR
  description: >-
    The ANE1 variants are germline heterozygous missense substitutions in
    RANBP2 (Nup358); the recurrent ones (p.Thr585Met, p.Thr653Ile,
    p.Ile656Val) cluster in the N-terminal leucine-rich domain. RANBP2 is a
    large cytoplasmic-filament
    component of the nuclear pore complex with SUMO E3 ligase, nuclear
    transport, microtubule and mitochondrial-trafficking functions. The
    variant does not cause disease by itself; it creates a susceptibility
    that is expressed only during a febrile infection.
  genes:
  - preferred_term: RANBP2
    term:
      id: hgnc:9848
      label: RANBP2
  molecular_functions:
  - preferred_term: structural constituent of nuclear pore
    term:
      id: GO:0017056
      label: structural constituent of nuclear pore
  cellular_components:
  - preferred_term: nuclear pore
    term:
      id: GO:0005643
      label: nuclear pore
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: missense
    variant_type: single nucleotide variant
  evidence:
  - reference: PMID:19118815
    reference_title: "Infection-triggered familial or recurrent cases of acute necrotizing encephalopathy caused by mutations in a component of the nuclear pore, RANBP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three mutations identified cluster in the “leucine-rich domain” (LD) that has been described as a domain necessary for localization to the both the nucleus and microtubules."
    explanation: Location of the three ANE1 variants in the leucine-rich domain.
  downstream:
  - target: Loss of RANBP2 Nuclear Envelope Localization
    causal_link_type: DIRECT
    hypothesis_groups:
    - viral_replication_restraint
    evidence:
    - reference: PMID:41651846
      reference_title: "The genetic driver of Acute Necrotizing Encephalopathy, RANBP2, regulates the inflammatory response to Influenza A virus infection."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using CRISPR-Cas9 knock-in for the ANE1 disease variant RANBP2-T585M, we further demonstrate that this point mutation causes a loss-of-localisation phenotype that excludes RANBP2 from the nuclear envelope"
      explanation: Knock-in of p.Thr585Met in human cells displaces RANBP2 from the nuclear envelope.
  - target: Impaired RANBP2-Dependent Mitochondrial Support
    hypothesis_groups:
    - mitochondrial_energy_failure
    evidence:
    - reference: PMID:34400285
      reference_title: "RANBP2 mutation causing autosomal dominant acute necrotizing encephalopathy attenuates its interaction with COX11."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The amount of COX11 bound to mutated RANBP2 was significantly smaller than that bound to the wild-type RANBP2."
      explanation: >-
        The common ANE1 variant weakens binding to the mitochondrial
        cytochrome c oxidase chaperone COX11 in a pull-down assay.
  - target: Recurrent encephalopathy
    description: >-
      The germline variant persists, so each later febrile infection carries
      a renewed risk of an episode.
    evidence:
    - reference: PMID:35108406
      reference_title: "Outcomes in influenza and RANBP2 mutation-associated acute necrotizing encephalopathy of childhood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RANBP2 status was predictive of relapse but not predictive of overall outcome."
      explanation: In a 20-patient ANE cohort, RANBP2 variant status predicted recurrence.
- name: Loss of RANBP2 Nuclear Envelope Localization
  biological_scale: CELLULAR
  description: >-
    In knock-in human airway cells, RANBP2-T585M is excluded from the nuclear
    envelope, which phenocopies RANBP2 depletion. This is one proposed
    molecular consequence of the variant; its relevance to the brain lesions
    is not established.

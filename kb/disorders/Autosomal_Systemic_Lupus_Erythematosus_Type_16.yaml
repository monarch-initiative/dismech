    term:
      id: GO:0006308
      label: DNA catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:27293190
    reference_title: "Digestion of Chromatin in Apoptotic Cell Microparticles Prevents Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "DNASE1L3 is uniquely capable of digesting chromatin in microparticles released from apoptotic cells."
    explanation: >-
      Identifies the specific extracellular substrate (microparticle chromatin)
      that DNASE1L3 digests and that accumulates when it is lost.
  - reference: PMID:39947743
    reference_title: "Identification and functional characterisation of a novel DNASE1L3 variant (c.572A>G, p.Asn191Ser) in three Emirati families with systemic lupus erythematosus and hypocomplementaemic urticarial vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients homozygous for 191S variant had significantly higher burden (p=0.0409) of NET structure in comparison to heterozygous and healthy control."
    explanation: >-
      Patient NETs are cleared poorly when DNASE1L3 is impaired, so extracellular
      chromatin accumulates.
  downstream:
  - target: Accumulation of Circulating Microparticle-Associated Self-DNA
    description: >-
      Undigested chromatin persists as elevated plasma DNA, especially in
      circulating microparticles.
- name: Accumulation of Circulating Microparticle-Associated Self-DNA
  biological_scale: MOLECULAR
  description: >-
    DNASE1L3-deficient humans and mice have elevated plasma DNA, concentrated in
    apoptotic-cell microparticles whose surface chromatin is a self-antigen
    recognised by lupus autoantibodies.
  evidence:
  - reference: PMID:27293190
    reference_title: "Digestion of Chromatin in Apoptotic Cell Microparticles Prevents Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Accordingly, DNASE1L3-deficient mice and human patients have elevated DNA levels in plasma, particularly in circulating microparticles."
    explanation: >-
      Extracellular self-DNA accumulates in both patients and mice lacking
      DNASE1L3.
  - reference: PMID:27293190
    reference_title: "Digestion of Chromatin in Apoptotic Cell Microparticles Prevents Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, extracellular microparticle-associated chromatin is a potential self-antigen normally digested by circulating DNASE1L3."
    explanation: >-
      Names the accumulated microparticle chromatin as the self-antigen.
  - reference: PMID:33022220
    reference_title: "Plasma DNA Profile Associated with DNASE1L3 Gene Mutations: Clinical Observations, Relationships to Nuclease Substrate Preference, and In Vivo Correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we found that human patients with DNASE1L3 disease-associated gene variations showed aberrations in size and a reduction of a \"CC\" end motif of plasma DNA."
    explanation: >-
      Human data for the self-DNA accumulation claim: patients show the altered
      plasma-DNA fragmentation signature of undigested chromatin, independent of
      the mouse evidence above.
  downstream:
  - target: Loss of B Cell Tolerance to DNA and Chromatin
    description: >-
      Persisting microparticle chromatin is the antigen that breaks B-cell
      tolerance.
  - target: Type I Interferon Pathway Activation
    description: >-
      Self-DNA engages nucleic-acid-sensing pathways in plasmacytoid dendritic
      cells, inducing type I interferon.
- name: Loss of B Cell Tolerance to DNA and Chromatin
  biological_scale: CELLULAR
  description: >-
    In DNASE1L3-deficient mice, exposure to undigested extracellular chromatin
    drives a rapid anti-DNA response that proceeds through CD40L-dependent
    T-cell help and short-lived extrafollicular antibody-forming cells rather
    than classical germinal centres, with plasmacytoid dendritic cells and type
    I interferon facilitating the differentiation of DNA-reactive cells.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: B cell activation
    term:
      id: GO:0042113
      label: B cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:32454024
    reference_title: "Plasmacytoid Dendritic Cells and Type I Interferon Promote Extrafollicular B Cell Responses to Extracellular Self-DNA."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We report that anti-DNA responses in Dnase1l3-/- mice require CD40L-mediated T cell help, but proceed independently of germinal center formation via short-lived antibody-forming cells (AFCs) localized to extrafollicular regions."
    explanation: >-
      Characterises the extrafollicular B-cell pathway that produces anti-DNA
      antibodies when DNASE1L3 is absent.
  downstream:
  - target: Anti-dsDNA and Anti-Chromatin Autoantibody Production
    description: >-
      Activated DNA-reactive B cells differentiate into antibody-forming cells
      secreting anti-dsDNA and anti-chromatin IgG.
- name: Anti-dsDNA and Anti-Chromatin Autoantibody Production
  biological_scale: ORGANISM
  description: >-
    DNASE1L3-deficient mice develop high-titre anti-dsDNA and anti-chromatin IgG,
    and patients characteristically have high-titre anti-dsDNA with childhood
    onset; a subset is seronegative.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  evidence:
  - reference: PMID:27293190
    reference_title: "Digestion of Chromatin in Apoptotic Cell Microparticles Prevents Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We report that DNASE1L3-deficient mice rapidly develop autoantibodies to DNA and chromatin, followed by an SLE-like disease."
    explanation: >-
      Anti-DNA and anti-chromatin autoantibodies arise directly from DNASE1L3
      loss in the mouse model.
  - reference: PMID:33022220
    reference_title: "Plasma DNA Profile Associated with DNASE1L3 Gene Mutations: Clinical Observations, Relationships to Nuclease Substrate Preference, and In Vivo Correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In humans, DNASE1L3 deficiency causes familial monogenic systemic lupus erythematosus with childhood onset and anti-dsDNA reactivity."
    explanation: >-
      Anti-dsDNA reactivity is the characteristic serology of human DNASE1L3
      deficiency; this is the abstract's framing sentence, not the paper's own
      result.
  downstream:
  - target: Immune Complex Formation and Tissue Deposition
    description: >-
      Anti-DNA antibodies bind circulating self-DNA to form immune complexes.
  - target: Anti-dsDNA Antibody Positivity
    description: >-
      Circulating anti-dsDNA antibody is the serologic readout.
  - target: Antinuclear Antibody Positivity
    description: >-
      Antinuclear antibody reactivity is detected in most patients.
- name: Type I Interferon Pathway Activation
  biological_scale: CELLULAR
  description: >-
    Self-DNA accumulation drives a type I interferon response through
    plasmacytoid dendritic cells and endosomal nucleic-acid sensing. Unlike the
    canonical type I interferonopathies, the interferon signature in DNASE1L3
    deficiency is transient and tracks disease activity, and glomerular
    interferon-induced MXA expression is seen in affected kidneys.
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: positive regulation of type I interferon production
    term:
      id: GO:0032481
      label: positive regulation of type I interferon production
    modifier: INCREASED
  evidence:
  - reference: PMID:35670985
    reference_title: "DNASE1L3 deficiency, new phenotypes, and evidence for a transient type I IFN signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Contrary to canonical type I interferonopathies, we noticed a transient increase of ISGs in blood, which returned to normal with disease remission."
    explanation: >-
      Documents the transient type I interferon signature in patients.
  - reference: PMID:39059688
    reference_title: "Lupus Nephritis Patterns and Response to Type I Interferon in Patients With DNASE1L3 Variants: Report of Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNASE1L3 variants impair the enzyme function, enhance autoantibody production and type I interferon (IFN-I) responses, and cause different autosomal recessive phenotypes ranging from hypocomplementemic urticarial vasculitis syndrome to full-blown systemic lupus erythematosus (SLE)."
    explanation: >-
      Links DNASE1L3 loss to enhanced type I interferon responses across the
      disease spectrum.
  downstream:
  - target: Lupus Nephritis
    description: >-
      Glomerular interferon-induced MXA expression places DNASE1L3 nephritis in
      the spectrum of type I interferon-mediated kidney disease.
- name: Immune Complex Formation and Tissue Deposition
  biological_scale: TISSUE
  description: >-
    Anti-DNA antibodies and undigested self-DNA form immune complexes that
    deposit in glomeruli, skin vessels and other tissues, triggering
    complement-fixing inflammation. Immunofluorescence shows glomerular IgG and
    C3 deposition. The bound GO term is "immune complex clearance" marked
    DECREASED, used as the closest ontology proxy: GO has no term for immune
    complexes forming and depositing, so the net excess of tissue-deposited
    complexes is expressed as a failure of their clearance.
  biological_processes:
  - preferred_term: immune complex clearance
    term:
      id: GO:0002434
      label: immune complex clearance
    modifier: DECREASED
  evidence:
  - reference: PMID:27293190
    reference_title: "Digestion of Chromatin in Apoptotic Cell Microparticles Prevents Autoimmunity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ultimately, auto-Abs forming immune complexes with nucleic acids are deposited in tissues, where they cause chronic inflammation, such as vasculitis and glomerulonephritis."
    explanation: >-
      Describes immune-complex deposition causing vasculitis and
      glomerulonephritis, the tissue-level step of the disease.
  - reference: PMID:40880305
    reference_title: "Early-onset systemic lupus erythematosus-ANCA-associated vasculitis overlap syndrome caused by DNASE1L3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence showed strongly positive glomerular fixation of IgG and C3"
    explanation: >-
      Glomerular immune-complex (IgG/C3) deposition in a genetically confirmed
      patient.
  downstream:
  - target: Complement Consumption
    description: >-
      Immune complexes fix and consume classical-pathway complement.
  - target: Lupus Nephritis
    description: >-
      Glomerular immune-complex deposition produces lupus nephritis.
  - target: Urticarial Vasculitis
    description: >-
      Dermal immune-complex vasculitis presents as urticarial vasculitis.
  - target: Pulmonary Hemorrhage
    description: >-
      Immune-complex injury of the alveolar capillaries causes diffuse alveolar
      haemorrhage in a subset.
  - target: Glomerular Immune-Complex Deposition
    description: >-
      Renal biopsy shows glomerular immune-complex deposits.
  - target: Systemic Lupus Erythematosus
    description: >-
      The multisystem immune-complex disease fulfils SLE classification in most
      patients.
- name: Complement Consumption
  biological_scale: ORGANISM
  description: >-
    Classical-pathway activation by immune complexes consumes C3 and C4,
    producing the persistent hypocomplementemia characteristic of the disease,
    including in its urticarial-vasculitis presentations.
  biological_processes:
  - preferred_term: complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:42716676
    reference_title: "Discordance between disease activity and long-term outcomes in DNASE1L3 deficiency: a multicentre longitudinal cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hallmark clinical features include very early-onset disease, persistent hypocomplementaemia, high-titre anti-dsDNA antibodies, urticarial vasculitis, lupus nephritis and, in some cases, pulmonary haemorrhage."
    explanation: >-
      Names persistent hypocomplementemia as a hallmark feature of the disease.
  downstream:
  - target: Decreased Circulating Complement C3 Concentration
    description: >-
      Consumption lowers serum C3.
  - target: Decreased Circulating Complement C4 Concentration
    description: >-
      Consumption lowers serum C4.
phenotypes:
- category: Immunological
  name: Systemic Lupus Erythematosus
  frequency: FREQUENT
  description: >-
    Most patients develop early-onset, often pediatric SLE; in a 2026 systematic
    review SLE-dominant disease was the most frequent phenotype (60% of 45
    previously reported patients), with HUVS-dominant and overlap phenotypes
    accounting for the remainder.
  phenotype_term:
    preferred_term: Systemic lupus erythematosus
    term:
      id: HP:0002725
      label: Systemic lupus erythematosus
  sequelae:
  - target: Arthritis
    description: >-
      Arthritis is a common musculoskeletal manifestation of the lupus.
  - target: Autoimmune Hemolytic Anemia
    description: >-
      Autoimmune cytopenias including haemolytic anaemia occur in a subset.
  - target: Recurrent Fever
    description: >-
      Recurrent fever is a frequent systemic feature at presentation.
  - target: Malar Rash
    description: >-
      Acute cutaneous (malar) rash is a frequent lupus skin manifestation.
  - target: Discoid Lupus Rash
    description: >-
      Chronic cutaneous (discoid) lesions occur in a fifth of patients.
  - target: Photosensitivity
    description: >-
      Cutaneous photosensitivity accompanies the lupus skin disease.
  - target: Inflammatory Eye Disease
    description: >-
      Inflammatory eye disease, including episcleritis, is a lupus manifestation.
  - target: Generalized Lymphadenopathy
    description: >-
      Generalised lymphadenopathy is a common systemic feature.
  - target: Leukopenia
    description: >-
      Leucopenia/lymphopenia is a haematologic manifestation of the lupus.
  - target: Serositis
    description: >-
      Serositis occurs as part of the systemic lupus.
  - target: Abdominal Pain
    description: >-
      Recurrent abdominal pain, including serosal/intestinal involvement, occurs
      in a third of patients.
  - target: Antiphospholipid Antibody Positivity
    description: >-
      Antiphospholipid antibodies are present in about a fifth of patients.
  - target: Anti-C1q Antibody Positivity
    description: >-
      Anti-C1q antibodies are present in most patients tested.
  evidence:

inheritance:
- name: Autosomal Recessive
  description: >-
    Disease requires biallelic (usually homozygous) loss-of-function DNASE1L3
    variants, frequently in consanguineous families; heterozygous carriers are
    clinically unaffected. The trait is fully penetrant in reported cohorts.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:22019780
    reference_title: "Loss-of-function variant in DNASE1L3 causes a familial form of systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a rare autosomal recessive form of SLE, in which autozygome analysis revealed a null mutation in the DNASE1L3 gene."
    explanation: >-
      The founding family report describing autosomal recessive SLE from a
      DNASE1L3 null variant.
  - reference: PMID:27821515
    reference_title: "An autosomal recessive DNASE1L3-related autoimmune disease with unusual clinical presentation mimicking systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the third family in the world, after Arabian and Turkish ones, displaying an autosomal recessive autoimmune disease (AID), mimicking systemic lupus erythematosus (SLE), with unusual manifestations due to a homozygous frame-shift variant in DNASE1L3."
    explanation: >-
      A homozygous DNASE1L3 frameshift variant segregating recessively in a
      third unrelated family.
pathophysiology:
- name: DNASE1L3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function DNASE1L3 variants (frameshift, nonsense,
    splice-region and secretion/activity-impairing missense alleles) abolish or
    markedly reduce the activity of the secreted endonuclease. DNASE1L3 normally
    carries a CC-end-motif-preferring endodeoxyribonuclease activity, so its loss
    is detectable as reduced serum DNase activity and an abnormal plasma cell-free
    DNA fragmentation pattern (altered fragment lengths and loss of CC end motifs).
  genes:
  - preferred_term: DNASE1L3
    term:
      id: hgnc:2959
      label: DNASE1L3
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: CC-preferring endodeoxyribonuclease activity
    term:
      id: GO:0033891
      label: CC-preferring endodeoxyribonuclease activity
    modifier: DECREASED
  evidence:
  - reference: PMID:22019780
    reference_title: "Loss-of-function variant in DNASE1L3 causes a familial form of systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a rare autosomal recessive form of SLE, in which autozygome analysis revealed a null mutation in the DNASE1L3 gene."
    explanation: >-
      A null DNASE1L3 variant underlies the disease.
  - reference: PMID:33022220
    reference_title: "Plasma DNA Profile Associated with DNASE1L3 Gene Mutations: Clinical Observations, Relationships to Nuclease Substrate Preference, and In Vivo Correction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we found that human patients with DNASE1L3 disease-associated gene variations showed aberrations in size and a reduction of a \"CC\" end motif of plasma DNA."
    explanation: >-
      Loss of DNASE1L3 activity is readable in patients as a reduced CC end
      motif in plasma DNA, the readout of its CC-preferring nuclease activity.
  - reference: PMID:39059688
    reference_title: "Lupus Nephritis Patterns and Response to Type I Interferon in Patients With DNASE1L3 Variants: Report of Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all 3 patients had reduced serum DNAse activity."
    explanation: >-
      Reduced serum DNase activity in genetically confirmed patients.
  downstream:
  - target: Impaired Clearance of Extracellular Chromatin
    description: >-
      Without functional DNASE1L3, chromatin in apoptotic-cell microparticles
      and NETs is no longer digested in the circulation.
- name: Impaired Clearance of Extracellular Chromatin
  biological_scale: MOLECULAR
  description: >-
    DNASE1L3 is the only serum nuclease able to penetrate membrane-coated
    microparticles and digest the nucleosomal chromatin they carry, and it also
    degrades the chromatin backbone of neutrophil extracellular traps. Its
    absence leaves this extracellular self-DNA undigested.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:

diagnosis:
- name: DNASE1L3 sequencing
  description: >-
    Biallelic pathogenic DNASE1L3 variants are identified by whole-exome or
    targeted sequencing and confirmed by Sanger segregation in the family;
    several recurrent loss-of-function alleles have been described.
  diagnosis_term:
    preferred_term: DNASE1L3 gene sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34161863
    reference_title: "Monogenic lupus due to DNASE1L3 deficiency in a pediatric patient with urticarial rash, hypocomplementemia, pulmonary hemorrhage, and immune-complex glomerulonephritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suspected monogenic lupus and performed whole-exome sequencing, which further revealed a homozygous T97Ifs*2 mutation (NM_004944.4: c.290_291delCA/p.Thr97Ilefs*2) in DNASE1L3 gene."
    explanation: >-
      Exome sequencing identified the biallelic DNASE1L3 variant.
- name: Plasma cell-free DNA fragmentomics
  description: >-
    Because DNASE1L3 shapes circulating cell-free DNA, patients show
    characteristic plasma DNA aberrations — altered fragment lengths and loss of
    CC end motifs — which serve as a functional biomarker of impaired nuclease
    activity.
  diagnosis_term:
    preferred_term: plasma cell-free DNA fragmentation analysis
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:42396794
    reference_title: "DNASE1L3 Deficiency With Novel Missense Variant: Enzymatic and Plasma Fragmentomic Evidence of Pathogenicity and Partial Response to JAK Blockade."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma DNA fragment analysis provides a sensitive biomarker of impaired nuclease function, and JAK inhibition may offer partial therapeutic benefit in DNASE1L3-related systemic inflammation."
    explanation: >-
      Plasma DNA fragmentomics as a functional diagnostic biomarker.
genetic:
- name: DNASE1L3
  gene_term:
    preferred_term: DNASE1L3
    term:
      id: hgnc:2959
      label: DNASE1L3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic loss-of-function DNASE1L3 variants cause the disease, inherited
    autosomal-recessively. Recurrent alleles include the frameshifts
    c.289_290delAC (p.Thr97Ilefs*2) and c.643delT, a splice-region deletion
    c.320+4delAGTA, and secretion/activity-impairing missense variants such as
    p.Asn191Ser; the same variants are found across the SLE and HUVS ends of the
    spectrum.
  variants:
  - name: p.Thr97Ilefs*2 (c.289_290delAC)
    description: >-
      A recurrent homozygous frameshift leading to loss of function, reported in
      both HUVS and SLE-spectrum families.
  - name: c.643delT
    description: >-
      A recurrent homozygous loss-of-function frameshift enriched in a large
      Omani/UAE cohort.
  - name: p.Asn191Ser (c.572A>G)
    description: >-
      A missense variant that impairs DNASE1L3 secretion and enzymatic activity
      in affected families with SLE and HUV.
  evidence:
  - reference: PMID:22019780
    reference_title: "Loss-of-function variant in DNASE1L3 causes a familial form of systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a rare autosomal recessive form of SLE, in which autozygome analysis revealed a null mutation in the DNASE1L3 gene."
    explanation: >-
      Establishes DNASE1L3 as the causative gene, with a null (loss-of-function)
      allele.
  - reference: PMID:42716676
    reference_title: "Discordance between disease activity and long-term outcomes in DNASE1L3 deficiency: a multicentre longitudinal cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "57 patients from 22 families were enrolled, most carrying the homozygous DNASE1L3 c.643delT loss of function variant."
    explanation: >-
      The recurrent c.643delT loss-of-function allele in the largest cohort.
  - reference: PMID:39947743
    reference_title: "Identification and functional characterisation of a novel DNASE1L3 variant (c.572A>G, p.Asn191Ser) in three Emirati families with systemic lupus erythematosus and hypocomplementaemic urticarial vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant 191S was shown to impact the secretion and activity of DNASE1L3."
    explanation: >-
      Functional demonstration that the p.Asn191Ser allele reduces DNASE1L3
      secretion and activity.
prevalence:
- population: Worldwide published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2026 systematic review assembled 49 genetically confirmed individuals
    (45 previously reported plus 4 new); a single Omani/UAE multicentre cohort
    reported 57 patients from 22 families. These are literature counts, not
    population prevalence estimates. The disease is most frequent in
    consanguineous populations of the Middle East.
  evidence:
  - reference: PMID:42726335
    reference_title: "Unraveling the Clinical Spectrum of DNASE1L3 Deficiency: Insights from Case Series and Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Combined with four patients from our centre, the analysis included 49 genetically confirmed individuals."
    explanation: >-
      Count of genetically confirmed patients in a systematic review.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    DNASE1L3 deficiency is a fully penetrant, treatment-refractory early-onset
    lupus. In the largest longitudinal cohort, reduction in disease-activity
    scores did not prevent progressive organ damage, with rising lupus
    nephritis, pulmonary involvement, osteoporosis and continued mortality after
    transition to adult care.
  evidence:
  - reference: PMID:42716676
    reference_title: "Discordance between disease activity and long-term outcomes in DNASE1L3 deficiency: a multicentre longitudinal cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the largest DNASE1L3 deficiency cohort, reduction in clinical disease activity does not prevent progressive organ damage."
    explanation: >-
      Documents the high, progressive organ-damage burden.
animal_models:
- name: Dnase1l3 knockout mouse
  species: Mouse
  genotype: Dnase1l3(LacZ/LacZ) (global knockout)
  publication: PMID:27293190
  description: >-
    Global Dnase1l3-deficient mice rapidly develop anti-dsDNA and anti-chromatin
    antibodies followed by an SLE-like disease with IgG deposition and
    background-dependent glomerulonephritis, driven by accumulation of
    undigested microparticle-associated self-DNA.
  modeled_mechanisms:
  - target: Anti-dsDNA and Anti-Chromatin Autoantibody Production
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Knockout mice develop rapid, specific anti-dsDNA and anti-chromatin IgG,
      as in human patients.
    limitations: >-
      Overt glomerulonephritis is background-dependent (seen on 129 but not C57BL/6),
      and the human skin/vasculitis phenotype is not reproduced.
    evidence:
    - reference: PMID:27293190
      reference_title: "Digestion of Chromatin in Apoptotic Cell Microparticles Prevents Autoimmunity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We report that DNASE1L3-deficient mice rapidly develop autoantibodies to DNA and chromatin, followed by an SLE-like disease."
      explanation: >-
        The knockout recapitulates the anti-DNA/anti-chromatin autoantibody
        response central to the human disease.
  - target: Impaired Clearance of Extracellular Chromatin
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Knockout serum cannot digest microparticle DNA, and the mice accumulate
      microparticle-associated plasma DNA, as patients do.
    limitations: >-
      The substrate-digestion defect is shown biochemically in mouse serum and
      cells; patient confirmation is via the plasma cell-free DNA fragmentation
      profile rather than a direct microparticle-clearance assay.
    evidence:
    - reference: PMID:27293190
      reference_title: "Digestion of Chromatin in Apoptotic Cell Microparticles Prevents Autoimmunity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Accordingly, DNASE1L3-deficient mice and human patients have elevated DNA levels in plasma, particularly in circulating microparticles."
      explanation: >-
        The clearance defect and self-DNA accumulation are shared by mouse and
        human.
differential_diagnoses:
- name: Hypocomplementemic urticarial vasculitis syndrome (DNASE1L3 allelic presentation)
  description: >-
    HUVS is caused by the same biallelic DNASE1L3 loss-of-function variants and
    is best regarded as the organ-limited, vasculitis-dominant end of one
    DNASE1L3-deficiency spectrum rather than a separate disease: roughly half of
    HUVS patients go on to develop SLE, and identical variants are found across
    both presentations. It is listed here as an allelic presentation to be
    recognised, not a distinct genetic differential.
  evidence:
  - reference: PMID:23666765
    reference_title: "DNASE1L3 mutations in hypocomplementemic urticarial vasculitis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results show that HUVS is caused by mutations in DNASE1L3, encoding an endonuclease that previously has been associated with SLE."
    explanation: >-
      Establishes that HUVS and DNASE1L3-SLE share the same causative gene.
  - reference: PMID:27821515
    reference_title: "An autosomal recessive DNASE1L3-related autoimmune disease with unusual clinical presentation mimicking systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As approximately 50% of individuals affected with HUVS develop SLE, it is still unclear whether it is a SLE sub-phenotype or a separate condition."
    explanation: >-
      States the unresolved lump/split question that justifies treating HUVS as
      an allelic presentation of the same disease.
- name: Other monogenic lupus (C1q and complement deficiencies, type I interferonopathies)
  description: >-
    Early-onset/pediatric lupus should prompt a monogenic-lupus work-up; the
    other leading causes are complement-component deficiencies (especially C1q)
    and type I interferonopathies. In monogenic-lupus cohorts C1Q and DNASE1L3
    are the two commonest genes. DNASE1L3 deficiency is distinguished by its
    characteristic urticarial vasculitis, ANCA positivity and abnormal plasma
    DNA fragmentation, and by a transient rather than sustained interferon
    signature.
  evidence:
  - reference: PMID:41850754
    reference_title: "Genetic and phenotypic landscape of monogenic lupus: insights from an international cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently implicated genes were C1Q (26%) and DNASE1L3 (25%), representing complement and type I interferon pathways, respectively."
    explanation: >-
      C1Q and DNASE1L3 are the two leading monogenic-lupus genes, so C1q
      deficiency is the main alternative to consider.
  - reference: PMID:35670985
    reference_title: "DNASE1L3 deficiency, new phenotypes, and evidence for a transient type I IFN signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report shows that interferon production is transient contrary to anomalies of intracellular DNA sensing and signaling observed in Aicardi-Goutières syndrome or STING-associated vasculitis in infancy (SAVI)."
    explanation: >-
      Distinguishes DNASE1L3 deficiency's transient interferon signature from
      the canonical type I interferonopathies.
treatments:
- name: Immunosuppressive Therapy (hydroxychloroquine and mycophenolate mofetil)
  description: >-
    Disease is managed with standard lupus immunosuppression — hydroxychloroquine
    in nearly all patients and mycophenolate mofetil in most, with
    corticosteroids, and cyclophosphamide or rituximab in refractory or
    organ-threatening disease — but the course is frequently refractory.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: hydroxychloroquine
      term:
        id: CHEBI:5801
        label: hydroxychloroquine
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  evidence:
  - reference: PMID:42716676
    reference_title: "Discordance between disease activity and long-term outcomes in DNASE1L3 deficiency: a multicentre longitudinal cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hydroxychloroquine use remained unchanged (98% vs 98%; p=1.000), with no significant differences in azathioprine (27% vs 30%; p=1.000), mycophenolate mofetil (90% vs 92%; p=1.000), cyclophosphamide (17% vs 8.3%; p=0.625), methotrexate (12% vs 4.0%; p=0.5) or rituximab exposure (16% vs 12%; p=1.000)."
    explanation: >-
      Documents the standard immunosuppressive regimen used across the cohort.
- name: JAK Inhibition (baricitinib)
  description: >-
    Because the disease involves a type I interferon response, JAK inhibitors
    that block interferon-receptor signalling (e.g. baricitinib) are an emerging
    option in refractory DNASE1L3 and other monogenic lupus, with reported
    clinical improvement; responses can be partial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: JAK inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baricitinib
      term:
        id: CHEBI:95341
        label: baricitinib
  target_mechanisms:
  - target: Type I Interferon Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Blocks JAK-dependent type I interferon receptor signalling.
  evidence:
  - reference: PMID:42100058
    reference_title: "Clinical Response to Baricitinib in Monogenic Lupus: Real-World Evidence from a Case Series of Seven Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baricitinib was well-tolerated and associated with clinical improvement in patients with treatment-refractory monogenic lupus."
    explanation: >-
      Baricitinib improved refractory monogenic lupus, a cohort that included a
      DNASE1L3 patient.
  - reference: PMID:42396794
    reference_title: "DNASE1L3 Deficiency With Novel Missense Variant: Enzymatic and Plasma Fragmentomic Evidence of Pathogenicity and Partial Response to JAK Blockade."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "JAK inhibition may offer partial therapeutic benefit in DNASE1L3-related systemic inflammation."
    explanation: >-
      Partial response to JAK inhibition in a DNASE1L3-deficient patient.
notes: >-
  HUVS is treated as an allelic presentation of DNASE1L3 deficiency rather than
  a separate entry or a has_subtypes row: it is caused by the same biallelic
  loss-of-function variants (often identical alleles, e.g. c.289_290delAC), is a
  phenotypic continuum with SLE, and is captured here through the Urticarial
  Vasculitis and hypocomplementemia phenotypes plus a differential_diagnoses
  entry. No mechanism module was a genuine fit: the core mechanism is impaired
  extracellular self-DNA clearance with an extrafollicular, STING-independent,
  MyD88/TLR-dependent autoantibody response (PMID:27293190, PMID:32454024), so
  it does not conform to the cGAS-STING, germinal-center, complement-deficiency
  or molecular-mimicry modules.

name: Autosomal Systemic Lupus Erythematosus Type 16
creation_date: "2026-10-29T18:17:57Z"
category: Mendelian
description: >-
  Autosomal systemic lupus erythematosus type 16 (SLEB16) is a rare monogenic
  form of lupus caused by biallelic loss-of-function variants in DNASE1L3, the
  gene encoding a secreted deoxyribonuclease produced mainly by macrophages and
  dendritic cells. DNASE1L3 is uniquely able to digest chromatin in the
  membrane-coated microparticles released by apoptotic cells and in neutrophil
  extracellular traps; when it is lost, undigested extracellular self-DNA and
  nucleosomal chromatin accumulate in the circulation, break B-cell tolerance,
  and drive high-titre anti-double-stranded-DNA and anti-chromatin
  autoantibodies with a transient type I interferon response. The resulting
  immune complexes deposit in tissue, consume complement, and produce an
  early-onset, often pediatric lupus dominated by lupus nephritis,
  hypocomplementemia, urticarial/skin vasculitis and, in a subset, ANCA
  positivity and pulmonary haemorrhage. The same gene and often the same
  variants also cause hypocomplementemic urticarial vasculitis syndrome (HUVS);
  because roughly half of HUVS patients go on to develop SLE, DNASE1L3
  deficiency is best understood as a single autosomal-recessive disease
  spectrum ranging from organ-limited urticarial vasculitis to full SLE rather
  than as two distinct conditions. Disease is treated with standard lupus
  immunosuppression, and interferon-directed therapies such as JAK inhibition
  are an emerging option for refractory disease.

name: DDX17-related Neurodevelopmental Disorder
creation_date: "2026-10-22T20:30:00Z"
category: Mendelian
synonyms:
- DDX17-related disorder
description: >-
  DDX17-related neurodevelopmental disorder is a recently delineated autosomal
  dominant condition caused by heterozygous, de novo variants in DDX17, which
  encodes the DEAD-box RNA helicase DDX17 (also called p72/p82). The gene-disease
  relationship rests on a single international case series of 11 unrelated
  individuals (PMID:39405200), assembled through the 100,000 Genomes Project and
  GeneMatcher, with five predicted loss-of-function and six missense variants.
  The phenotype is a nonspecific neurodevelopmental disorder: mild to moderate
  intellectual disability, delayed speech and language, global developmental and
  motor delay, frequent attention deficit hyperactivity disorder, autistic
  features, stereotypies and hypotonia, with subtle and variable facial
  dysmorphism and occasional macrocephaly or nonspecific brain MRI changes.
  Severity did not differ between missense and truncating variants, which the
  authors read as haploinsufficiency. DDX17 and its paralogue DDX5 regulate
  transcription, alternative splicing and microRNA biogenesis, and DDX17
  co-regulates the neuronal gene repressor REST. In model systems, reducing DDX17
  delays cortical neuronal migration and shortens axons in mouse, reduces axon
  outgrowth and working memory in heterozygous Xenopus tropicalis tadpoles, and
  deregulates neurodevelopmental and axon-guidance genes in human neuroblastoma
  cells.

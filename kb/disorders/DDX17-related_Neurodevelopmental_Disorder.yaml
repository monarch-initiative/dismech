      explanation: >-
        Heterozygous ddx17 frameshift Xenopus tropicalis tadpoles, the model
        closest to the patient genotype, show reduced axon outgrowth.
- name: Dysregulated Neurodevelopmental Gene Expression
  biological_scale: CELLULAR
  description: >-
    DDX17 is a multifunctional regulator of gene expression: a transcriptional
    co-regulator, a spliceosome component that controls alternative splicing,
    and a cofactor of the Drosha/DGCR8 microprocessor in microRNA biogenesis.
    During neuronal differentiation it associates with REST, promotes REST
    binding to a subset of its target promoters, and with DDX5 regulates
    proneural microRNAs that target the REST complex. Knocking down DDX17 alone
    in human SH-SY5Y neuroblastoma cells deregulates 350 genes enriched for
    nervous system development, including transcription factors (NEUROG2,
    RARB, MYCN) and axon-guidance receptors and ligands (DCC, EFNB2, PLXNA2,
    PLXNA4, SEMA6A, SEMA6D, ROBO2, UNC5D). Which of these targets carries the
    disease is not known.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of gene expression
    modifier: DYSREGULATED
    term:
      id: GO:0010468
      label: regulation of gene expression
  evidence:
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The functions of this set of genes were significantly associated with developmental processes, in particular the development and functions of the nervous system"
    explanation: >-
      Gene ontology enrichment of the DDX17-knockdown differentially expressed
      genes in SH-SY5Y cells.
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "including several receptors/ligands associated with axon guidance"
    explanation: >-
      The deregulated set includes axon-guidance receptors and ligands,
      connecting the transcriptional effect to the axon phenotype seen in vivo.
  - reference: PMID:29931089
    reference_title: "The RNA helicase DDX17 controls the transcriptional activity of REST and the expression of proneural microRNAs in neuronal differentiation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "DDX17 associates with REST, promotes its binding to the promoter of a subset of REST-targeted genes and co-regulates REST transcriptional repression activity."
    explanation: >-
      Cell-based study of normal DDX17 function in neuronal differentiation,
      describing the REST co-repressor role through which reduced DDX17 is
      proposed to alter neuronal gene expression. It does not study patient
      variants.
  - reference: PMID:29931089
    reference_title: "The RNA helicase DDX17 controls the transcriptional activity of REST and the expression of proneural microRNAs in neuronal differentiation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "DDX17 and its paralog DDX5 regulate the expression of several proneural microRNAs that are known to target the REST complex during neurogenesis"
    explanation: >-
      Places DDX17 in the microRNA-REST regulatory loop of neurogenesis. The
      experiments co-deplete DDX5, so the specific contribution of DDX17 alone
      is not isolated here.
  - reference: PMID:35007564
    reference_title: "The RNA helicases DDX5 and DDX17 facilitate neural differentiation of human pluripotent stem cells NTERA2."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Importantly, DDX5 and DDX17 are critical for differentiation of hPSCs toward NESTIN- and TUBB3-positive cells, which represent neural progenitors and mature neurons, respectively."
    explanation: >-
      Human pluripotent stem cell (NTERA2) neural differentiation requires the
      two paralogous helicases together; DDX17 was not depleted on its own.
  - reference: PMID:31851931
    reference_title: "RNA Specificity and Autoregulation of DDX17, a Modulator of MicroRNA Biogenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The RNA sequence preference of the catalytic core is critical for DDX17 to directly bind and remodel a specific region of primary microRNAs 3' to the mature sequence, and consequently enhance processing by Drosha."
    explanation: >-
      Structural and biochemical study of the DDX17 helicase core establishing
      its microRNA-processing role, one of the gene-regulatory functions that a
      reduced DDX17 dose would compromise. Not a study of patient variants.
  - reference: PMID:24275493
    reference_title: "The Ddx5 and Ddx17 RNA helicases are cornerstones in the complex regulatory array of steroid hormone-signaling pathways."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "The Ddx5 and Ddx17 RNA helicases are also splicing regulators."
    explanation: >-
      Background statement, in a study of steroid hormone signalling in cancer
      cells, that DDX17 regulates alternative splicing. Supports the splicing
      arm of the node description, not a neuronal finding.
  downstream:
  - target: Impaired Axon Outgrowth

inheritance:
- name: Autosomal dominant, de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Every reported variant is heterozygous and arose de novo (trio sequencing in
    all eleven families), so no transmission from an affected parent has yet
    been observed. Expressivity is recorded as variable because intellectual
    disability, macrocephaly, autistic features and hypotonia are each present in
    only part of the cohort.
  evidence:
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The summary of the phenotypic features of the 11 patients (from 11 independent families) harbouring de novo heterozygous variants in DDX17 are provided in Table 1"
    explanation: >-
      All eleven families carry heterozygous de novo variants, consistent with a
      dominant disorder arising from new mutation.
pathophysiology:
- name: DDX17 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo DDX17 variants are predicted to reduce DDX17 dosage or
    function. Five are predicted loss-of-function (frameshift, canonical splice)
    and six are missense; five of the six missense changes fall in the
    conserved helicase core, two within core DEAD-box motifs. Phenotype severity
    did not differ between missense and truncating variants, so the authors
    attribute the disorder to haploinsufficiency rather than a dominant-negative
    or gain-of-function effect. The gene is strongly constrained against
    loss-of-function variation in population data (gnomAD LOEUF 0.13).
  genes:
  - preferred_term: DDX17
    term:
      id: hgnc:2740
      label: DDX17
  molecular_functions:
  - preferred_term: RNA helicase activity
    modifier: DECREASED
    term:
      id: GO:0003724
      label: RNA helicase activity
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no substantial differences in phenotype severity between patients harbouring missense variants versus LoF variants, suggesting DDX17 haploinsufficiency causes the observed phenotype."
    explanation: >-
      Genotype-phenotype comparison in the case series; haploinsufficiency is
      inferred from equivalent severity across variant classes rather than
      measured directly as reduced protein in patient cells.
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five variants were pLoF and six variants were missense (Fig. 1B). Of these missense variants, five are within the helicase domain and evolutionarily conserved from budding yeast to humans"
    explanation: >-
      Variant spectrum: truncating variants plus missense changes concentrated
      in the conserved helicase domain.
  downstream:
  - target: Dysregulated Neurodevelopmental Gene Expression
    causal_link_type: DIRECT
    description: >-
      Reduced DDX17 alters steady-state expression of a set of genes enriched

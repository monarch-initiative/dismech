animal_models:
- name: Ddx17 shRNA knockdown by in utero cortical electroporation (mouse)
  species: Mouse
  genotype: Ddx17 shRNA knockdown in electroporated cortical progenitors (two independent shRNAs)
  publication: PMID:39405200
  description: >-
    Ddx17 shRNA plasmids electroporated into mouse cortical progenitors at E15.5
    and analysed at postnatal day 21. A knockdown in a subset of cortical
    neurons, not a germline heterozygous model.
  modeled_mechanisms:
  - target: Impaired Cortical Neuronal Migration
    relationship: PERTURBS
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Mosaic acute knockdown in a fraction of cortical neurons rather than
      constitutional heterozygosity, and shRNA approaches can cause off-target
      migration defects in mouse cortex; the authors call for genetic knockout
      models to confirm specificity.
    evidence:
    - reference: PMID:39405200
      reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of Ddx17 in electroporated mouse neurons in vivo showed delayed neuronal migration as well as decreased cortical axon complexity."
      explanation: >-
        The model is informative for the migration node.
  - target: Disrupted Cortical Circuit Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Reduced contralateral axon density is measured in electroporated neurons
      only; cognitive or behavioural consequences were not assessed in mouse.
    evidence:
    - reference: PMID:39405200
      reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "especially a strong reduction of contralateral axon density"
      explanation: >-
        Tissue-level wiring readout in the knockdown cortex.
- name: ddx17 heterozygous frameshift (Xenopus tropicalis)
  species: Xenopus tropicalis
  genotype: ddx17 +/- (exon 7 frameshift, Xtr.ddx17em2EXRC)
  publication: PMID:39405200
  description: >-
    F1 heterozygous tadpoles from CRISPR/Cas9 crispant founders, the model
    closest to the patient genotype. Morphologically normal, with reduced axon
    outgrowth and a working memory deficit in the free-movement pattern Y-maze.
  modeled_mechanisms:
  - target: Impaired Axon Outgrowth
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Amphibian embryo neural tube axons rather than human cortical neurons; the
      effect is clearest at an early developmental stage and diminishes later.
    evidence:
    - reference: PMID:39405200
      reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The axon outgrowth phenotype was replicated in crispant ddx17 tadpoles and in heterozygotes."
      explanation: >-
        Heterozygous tadpoles reproduce the axon outgrowth defect.
  - target: Disrupted Cortical Circuit Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      A tadpole working memory assay is a distant proxy for human cognitive
      impairment, and the tadpole brain has no layered neocortex.
    evidence:
    - reference: PMID:39405200
      reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous tadpoles had clear neurodevelopmental defects and showed an impaired neurobehavioral phenotype."
      explanation: >-
        Functional neural deficit in the heterozygous model.
notes: >-
  No GeneReviews chapter covers this disorder. Mechanistic nodes below the
  haploinsufficiency node rest on knockdown and heterozygous-knockout models and
  one cell-line transcriptome, not on patient-derived cells. Facial and limb
  features, macrocephaly and hypotonia are not connected to a mechanism because
  no source addresses how they arise.

  Seizures are not described in any of the 11 patients in the case series
  (PMID:39405200), and heterozygous ddx17 tadpoles showed no seizure-like
  locomotor behaviour. With 11 patients this does not exclude epilepsy, but it
  is a point of comparison when separating this disorder from other DEAD-box
  helicase neurodevelopmental disorders.

  No treatments section is recorded because no disease-specific treatment or
  management study has been published. Supportive care (developmental
  therapies, management of ADHD and autistic features) follows general
  neurodevelopmental practice and has no DDX17-specific source to cite.

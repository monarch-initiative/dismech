- name: Impaired Cortical Neuronal Migration
  biological_scale: CELLULAR
  description: >-
    After in utero electroporation of Ddx17 shRNAs at E15.5, a significant
    fraction of upper-layer (layer II/III) mouse cortical neurons fail to reach
    the superficial cortical layers by postnatal day 21, while neuronal
    polarisation and axon formation are preserved. The authors caution that
    shRNA strategies can cause off-target migration defects in mouse cortex and
    that genetic knockout models are needed to confirm specificity.
  cell_types:
  - preferred_term: callosal-projecting pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: neuron migration
    modifier: DECREASED
    term:
      id: GO:0001764
      label: neuron migration
  evidence:
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a statistically significant fraction of neurons did not reach the most superficial cortical layers in conditions electroporated with shRNA plasmids"
    explanation: >-
      Quantified migration defect after Ddx17 knockdown in the developing mouse
      cortex.
  downstream:
  - target: Disrupted Cortical Circuit Development
    causal_link_type: UNKNOWN
    description: >-
      Mispositioned neurons are one route by which cortical wiring can be
      altered; the axonal defect is separable from it.
    evidence:
    - reference: PMID:39405200
      reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Ddx17 knockdown impaired neuronal migration and axon development in the brain of newborn mice"
      explanation: >-
        Both cellular defects are reported together in the knockdown cortex;
        their separate contributions to circuit wiring are not quantified.
- name: Impaired Axon Outgrowth
  biological_scale: CELLULAR
  description: >-
    Reducing DDX17 shortens axons and reduces collateral branches in cultured
    mouse cortical neurons, and overexpressing human DDX17 lengthens them, so
    DDX17 is both necessary and sufficient for normal axon elongation in this
    system. The effect is not explained by neuronal death. Axon outgrowth from
    the neural tube is also reduced in heterozygous ddx17 Xenopus tropicalis
    embryos. The authors report that this axonal role is independent of the
    migration defect.
  cell_types:
  - preferred_term: cortical neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: axon extension
    modifier: DECREASED
    term:
      id: GO:0048675
      label: axon extension
  evidence:
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the inhibition of DDX17 expression decreased axon length and reduced collateral branch formation"
    explanation: >-
      Two independent shRNAs in cultured mouse cortical neurons give the same
      axon-length phenotype.
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed an increased axon length compared to the control condition, mirroring the effect of Ddx17 knockdown"
    explanation: >-
      Gain-of-function control: overexpression of human DDX17 lengthens axons,
      supporting dosage sensitivity of axon elongation.
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, we report that DDX17 plays a role in axon morphogenesis that is independent of its function in neuronal migration."
    explanation: >-
      Separates the axonal defect from the migration defect, justifying two
      cellular nodes.
  downstream:
  - target: Disrupted Cortical Circuit Development
    causal_link_type: UNKNOWN
    description: >-
      Shorter, less branched axons reduce terminal innervation of the
      contralateral cortex.
    evidence:
    - reference: PMID:39405200
      reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "especially a strong reduction of contralateral axon density"
      explanation: >-
        Ddx17 knockdown in mouse layer II/III neurons strongly reduces their
        axon density in the contralateral cortex, the wiring defect this edge
        asserts.
    - reference: PMID:39405200
      reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "There was no difference in axon density in the white matter (WM), indicating that the same proportion of axons reached the contralateral hemisphere regardless of Ddx17 expression."
      explanation: >-
        Axons still cross, but contralateral innervation is reduced, which
        locates the defect in terminal axon growth and branching rather than in
        axon guidance across the midline.
- name: Disrupted Cortical Circuit Development
  biological_scale: TISSUE
  description: >-
    In Ddx17-knockdown mouse cortex, callosal axons from layer II/III neurons
    reach the opposite hemisphere but innervate the contralateral cortex much
    less densely, with a trend to reduced ipsilateral layer V innervation.
    Heterozygous ddx17 Xenopus tadpoles have normal gross brain structure but a
    working memory deficit in a Y-maze assay. Together these indicate a defect
    in neuronal connectivity rather than a structural brain malformation, which
    fits the largely nonspecific brain imaging in patients.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "especially a strong reduction of contralateral axon density"
    explanation: >-
      Reduced callosal innervation of the contralateral cortex after Ddx17
      knockdown in mouse.
  - reference: PMID:39405200
    reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "showing that they have a major deficit in short-term working memory"
    explanation: >-
      Heterozygous ddx17 tadpoles, the genotype closest to patients, show a
      functional neural deficit without gross brain malformation.
  downstream:
  - target: Intellectual Disability
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:39405200
      reference_title: "Monoallelic de novo variants in DDX17 cause a neurodevelopmental disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "These in vivo results are therefore consistent with the hypothesis that heterozygous LoF DDX17 variants identified in patients induce a significant alteration of the function of the protein during neuronal development, resulting in the observed phenotype in our cohort."
      explanation: >-
        The authors connect the animal-model neurodevelopmental defects to the
        patient phenotype as a consistent hypothesis; the step from cortical
        wiring to cognition is inferred.

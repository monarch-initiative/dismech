      hernia, but this is also present in her carrier mother.
    explanation: >-
      The reason the diaphragmatic hernia is not curated as a phenotype of the
      disorder.
pathophysiology:
- name: Biallelic LTBP1 Premature Truncating Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous nonsense or frameshift variants in LTBP1. In the four reported
    families the alterations fall in the second EGF-like domain (c.1342C>T),
    the third EGF-like domain (c.4844del), and the 12th and 13th
    calcium-binding EGF-like domains (c.3991dup and c.4431T>A) of the long
    isoform. The position matters mechanistically and the two branches below
    are not interchangeable.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Premature termination codons, homozygous in all eight reported
      individuals.
  genes:
  - preferred_term: LTBP1
    term:
      id: hgnc:6714
      label: LTBP1
  downstream:
  - target: Nonsense-Mediated Decay with Complete Loss of LTBP1 Protein
    causal_link_type: DIRECT
    description: >-
      The N-terminal allele route.
    evidence:
    - reference: PMID:33991472
      reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        RT-qPCR indicates that LTBP1 mRNA expression is completely abolished in
        dermal fibroblast cultures of F4:II-1 (c.1342C>T) compared to control
        fibroblasts but is partly rescued upon cycloheximide treatment,
        indicative of NMD
      explanation: >-
        The cycloheximide rescue is what establishes decay rather than a
        transcription defect as the route from this allele to absent protein.
  - target: C-Terminally Truncated LTBP1 with Reduced Fibrillin Binding
    causal_link_type: DIRECT
    description: >-
      The C-terminal allele route.
    evidence:
    - reference: PMID:33991472
      reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In contrast, LTBP1 mRNA expression in dermal fibroblasts of F1:IV-2
        (c.4844del) is present at equal levels as in fibroblasts of control
        subjects
      explanation: >-
        Escape from decay is why this allele class yields a protein product
        rather than an absence.
  - target: Impaired Skeletal Matrix Assembly and Ossification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ltbp1_tissue_specific_tgfbeta
    description: >-
      The skeletal limb of the disease, drawn straight from the lesion because
      the intervening steps in bone are not established. Both zebrafish lines
      develop ectopic bone, and one has reduced vertebral tissue mineral
      density, but neither reproduces craniosynostosis.
    evidence:
    - reference: PMID:33991472
      reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overall, our findings in humans and zebrafish show that LTBP1 function
        is crucial for skin and bone ECM assembly and homeostasis.
      explanation: >-
        The authors' own summary of the skeletal claim, which is at the level
        of LTBP1 being required for bone matrix assembly rather than a
        step-by-step chain.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified premature truncating variants are distributed across LTBP1
      and correspond to protein alterations in the second (family 4, c.1342C>T)
      and third EGF-like domains (family 1, c.4844del)
    explanation: >-
      Locates two of the four alleles in the protein, which is what the branch
      split depends on.
- name: Nonsense-Mediated Decay with Complete Loss of LTBP1 Protein
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The c.1342C>T transcript is degraded, and no LTBP1 protein reaches the
    matrix. This is the branch in which the expected TGF-beta abnormality does
    not appear.
  biological_processes:
  - preferred_term: nonsense-mediated decay of the LTBP1 transcript
    modifier: INCREASED
    term:
      id: GO:0000184
      label: "nuclear-transcribed mRNA catabolic process, nonsense-mediated decay"
  cell_types:
  - preferred_term: proband dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Reduced Fibrillin-1 Expression
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33991472
      reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-

      inheritance is established.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to different in silico algorithms, the identified variants are
      predicted to be disease causing and all variants are absent from the
      population databases.
    explanation: >-
      The segregation and population-frequency basis for calling the alleles
      causal.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

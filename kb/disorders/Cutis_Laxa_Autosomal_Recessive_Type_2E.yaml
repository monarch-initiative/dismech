genetic:
- name: LTBP1
  gene_term:
    preferred_term: LTBP1
    term:
      id: hgnc:6714
      label: LTBP1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  features: >-
    LTBP1 encodes latent TGF-beta binding protein 1, a multidomain secreted
    matrix protein with fifteen calcium-binding EGF-like domains, three
    EGF-like domains, two TGF-beta-binding domains, a hybrid motif and a
    4-cysteine domain. It tethers the small latent TGF-beta complex to the
    matrix and is anchored there through its C-terminal region to fibrillin-1
    and its N-terminal region to fibronectin. Two promoters give a long and a
    short isoform; variant numbering in the source uses the long isoform,
    GenBank NM_206943.4.
  notes: >-
    All four reported alleles are premature termination codons, and it would be
    natural to record the gene as simply loss of function. The functional work
    argues against collapsing them that way. The one N-terminal allele tested
    undergoes nonsense-mediated decay and behaves as a null; the C-terminal
    alleles escape decay and produce a protein that is made, secreted, and
    incorporated into rudimentary fibers while binding fibrillin poorly - a
    protein present and misbehaving rather than absent. The
    functional_impact_category on the initiating pathophysiology node is
    recorded as LOSS_OF_FUNCTION because that is what the authors demonstrate
    for the alleles at the protein-function level, but the downstream cellular
    phenotype of the C-terminal class is one of excess matrix and excess
    signaling.

    Two fibroblast lines is the entire functional dataset, one allele per
    class, so the split is a two-sample observation and the authors say so
    explicitly. No genotype-phenotype correlation can be drawn from the
    clinical data either: the individual without craniosynostosis and the
    individual with severe intellectual disability carry different alleles from
    each other, and the numbers are far too small to test.
  variants:
  - name: c.1342C>T (p.Gln448*)
    description: >-
      Family 4, Saudi Arabian. Homozygous nonsense variant in exon 7, altering
      the second EGF-like domain. Undergoes nonsense-mediated decay; the
      fibroblasts show no LTBP1 protein, reduced FBN1 mRNA, and normal
      TGF-beta levels and Smad2 phosphorylation.
  - name: c.4844del (p.Asn1615Ilefs*23)
    description: >-
      Family 1, Turkish. Homozygous frameshift in exon 29, altering the third
      EGF-like domain. Escapes nonsense-mediated decay; the fibroblasts show
      rudimentary LTBP1 fibers, loss of fibulin-4 from the matrix, increased
      LTBP2, increased total TGF-beta and an increased pSmad2/Smad2 ratio.
  - name: c.4431T>A (p.Cys1477*)
    description: >-
      Family 2, Pakistani; four affected individuals. Homozygous nonsense
      variant in exon 26, altering the 13th calcium-binding EGF-like domain. No
      fibroblasts were available; the recombinant C-terminal fragment carrying
      this variant shows the same reduced fibrillin-1 and fibrillin-2 binding
      as the c.4844del fragment.
  - name: c.3991dup (p.Thr1331Asnfs*22)
    description: >-
      Family 3, Pakistani; two affected individuals. Homozygous duplication in
      exon 23, altering the 12th calcium-binding EGF-like domain. The original
      publication described this allele as c.3991_3995del (p.Thr1331Asnfs*20);
      a 2021 erratum corrected it to c.3991dup (p.Thr1331Asnfs*22). The
      corrected form is the one recorded here.
    evidence:
    - reference: PMID:34861177
      reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we discovered that this variant description was wrong and should be
        corrected as LTBP1 variant (GenBank: NM_206943.4) c.3991dup
        (p.Thr1331Asnfs∗22)
      explanation: >-
        The published correction to the family 3 allele, which is why this
        entry does not use the nomenclature in the original article.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing (ES) identified homozygous premature truncating variants
      in LTBP1 (GenBank: NM_206943.4) in eight affected children from four
      different families.
    explanation: >-
      The gene-disease assertion and the transcript the variant nomenclature is
      numbered against.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      LTBP1 consists of fifteen calcium-binding (cb) EGF-like domains, three
      EGF-like domains, two TGFβ-binding domains, a hybrid motif, and a
      4-cysteine domain.
    explanation: >-
      The domain architecture recorded in features above. Restated by these
      authors from the established protein structure, hence BACKGROUND.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      LTBP1, LTBP2, and LTBP4 interact through their C-terminal region with
      fibrillin-1 (FBN1),
    explanation: >-
      The C-terminal fibrillin interaction that the C-terminal alleles disrupt.
      Restated from prior work, hence BACKGROUND.
histopathology:
- name: Abnormal dermal elastic fibers on transmission electron microscopy
  description: >-
    Skin biopsy from the individual with the c.4844del allele, compared with an
    age- and sex-matched control. Microfibrils infiltrate the periphery of the
    elastic fiber and the elastin shows mild fragmentation while still forming
    a central core. Collagen fibrils are normal in diameter. This is a
    research-grade finding in one individual, not an established diagnostic
    test.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The elastic fiber shows microfibril infiltration in its periphery with
      mild fragmentation of elastin that still formed a central core
    explanation: >-
      The elastic fiber abnormality as described by the authors.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collagen fibrils appear similar to the control subject with regular fiber
      diameters
    explanation: >-
      The negative collagen finding, which matters because the zebrafish models
      do show a dermal collagen abnormality.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight individuals from four unrelated consanguineous families, in one
    publication. A PubMed search on 2026-09-24 for LTBP1 with cutis laxa,
    ARCL2E or craniosynostosis in title or abstract returned four records: the
    index paper, its erratum, an LTBP4 structural study, and a craniosynostosis
    sequencing cohort listing LTBP1 among candidate variants of uncertain
    significance. No second cohort of biallelic LTBP1 disease has been
    published.

    rate_per_100000 is left empty because no denominator-based estimate exists.
    The families are Turkish, Pakistani and Saudi Arabian, which reflects where
    consanguineous homozygosity is detectable rather than a true population
    difference in gene frequency.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we report homozygous premature truncating LTBP1 variants
      in eight affected individuals from four unrelated consanguineous
      families.
    explanation: >-
      The size of the entire reported literature at the time of curation.
diagnosis:
- name: LTBP1 molecular genetic testing by exome or genome sequencing
  presence: PRESENT
  description: >-
    The only established diagnostic route. All four families were solved by
    exome sequencing, with homozygosity mapping preceding it in one. LTBP1 is
    not on older targeted cutis laxa or craniosynostosis gene lists, so a
    negative panel predating 2021 does not exclude the diagnosis, and
    reanalysis or broad sequencing is the appropriate next step in a child with
    cutis laxa plus craniosynostosis.
  results: >-
    Biallelic premature truncating LTBP1 variants, numbered against GenBank
    NM_206943.4. Every reported allele is homozygous in a consanguineous
    family; no compound heterozygote has been described.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prior to ES, homozygosity mapping in family 2 showed one shared 22.9 Mb
      homozygous region on chromosome 2 (20,605,248-43,530,418), containing
      LTBP1, between the three affected individuals tested and absent in
      unaffected family members.
    explanation: >-
      The mapping and sequencing route by which the gene was identified.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variants segregate in family members according to disease-and carrier
      status.
    explanation: >-
      The segregation evidence supporting variant interpretation.
- name: Cranial imaging for suture patency
  presence: PRESENT
  description: >-
    Craniosynostosis is present in three-quarters of reported individuals, the
    suture pattern is not stereotyped, and a copper-beaten calvarium indicating
    raised intracranial pressure was documented radiographically in two. Suture
    imaging is therefore part of the assessment of any child with this
    diagnosis, not only those with an obviously abnormal head shape. This is
    reasoning from the reported findings rather than a published surveillance
    protocol, of which none exists.
  results: >-
    Premature fusion of one or more sutures, variably coronal, sagittal,
    lambdoid or pansynostotic; copper-beaten calvarial pattern where
    intracranial pressure is chronically raised.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      coronal, sagittal, and lambdoid suture (F2:V-8), or right coronal and
      sagittal suture (F3:II-1 and F3:II-2). Individual F4:II-1 shows
      pansynostosis.
    explanation: >-
      The range of suture patterns, ending in pansynostosis. It is that range,
      rather than any one pattern, that makes imaging rather than inspection
      the appropriate assessment.
- name: Echocardiography
  presence: PRESENT
  description: >-
    Three of eight individuals had a cardiac abnormality and all three were
    different lesions - a septal defect, valvular insufficiency, and
    ventricular hypertrophy - so no single lesion can be looked for
    selectively. All were mild to moderate. As with cranial imaging, this
    follows from the reported findings; no surveillance interval has been
    published.
  results: >-
    Secundum atrial septal defect, mitral and tricuspid insufficiency, or mild
    concentric left ventricular hypertrophy. No aortic root dilation or
    dissection has been reported in this disorder.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variable heart defects were found in three individuals.
    explanation: >-
      The frequency of cardiac involvement that motivates cardiac assessment.
differential_diagnoses:
- name: LTBP4-related autosomal recessive cutis laxa type 1C
  description: >-
    The nearest LTBP-family neighbour, and the one most likely to be considered
    alongside ARCL2E because both involve a latent TGF-beta binding protein and
    both present with loose redundant skin in infancy.
  distinguishing_features:
  - ARCL1C is dominated by severe early pulmonary emphysema and by gastrointestinal and urinary tract diverticula; neither is reported in ARCL2E.
  - Craniosynostosis, short stature and brachydactyly are the ARCL2E signature and are not features of ARCL1C.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Finally, pathogenic variants in LTBP4 cause AR cutis laxa (CL) type 1C,
      characterized by loose redundant skin folds, emphysema, and diverticula
      of the gastrointestinal and urinary tract.
    explanation: >-
      The ARCL1C phenotype, restated by these authors from the prior
      literature, hence BACKGROUND.
- name: Other autosomal recessive cutis laxa syndromes
  description: >-
    The cutis laxa group is genetically heterogeneous and the skin phenotype
    alone does not discriminate within it. ARCL2A (ATP6V0A2), ARCL2B and ARCL3
    (PYCR1, ALDH18A1), ARCL1A (FBLN5) and ARCL1B (EFEMP2) all present with
    loose skin in infancy.
  distinguishing_features:
  - The skeletal constellation - craniosynostosis with short stature, brachydactyly, clinodactyly and syndactyly - is what the authors identify as separating ARCL2E from the rest of the group.
  - ARCL2A carries a combined N- and O-linked glycosylation abnormality on serum transferrin and apolipoprotein C-III isoelectric focusing; no glycosylation abnormality is reported in ARCL2E.
  - Progeroid appearance, corpus callosum dysgenesis and dystonic posturing point to PYCR1 or ALDH18A1 rather than LTBP1.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The craniofacial features, short stature, brachydactyly, variable
      craniosynostosis, and variable mild heart defects clearly distinguish
      this AR CL syndrome from other subtypes of CL syndrome.
    explanation: >-
      The authors' own statement of what separates ARCL2E within the group.
  notes: >-
    The glycosylation and neuroimaging discriminators listed above are
    properties of the comparator disorders, curated in this repository's ARCL2A
    entry from its own sources. They are stated here as differentiating
    features rather than cited to the LTBP1 paper, which does not discuss them.
- name: Syndromic craniosynostosis
  description: >-
    A child presenting first to a craniofacial service with premature suture
    fusion, proptosis and midface changes may be worked up for the common
    syndromic craniosynostoses before the skin is considered. Cutis laxa in a
    craniosynostosis patient should redirect the differential.
  distinguishing_features:
  - Most craniosynostosis syndromes have neither cutaneous laxity nor short stature, which the authors note explicitly.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, most craniosynostosis syndromes do not present with clear
      cutaneous manifestation or short stature.
    explanation: >-
      The discriminator in the direction that matters clinically, from
      craniosynostosis towards this diagnosis.
treatments:
- name: Craniosynostosis Surgery
  description: >-
    Surgical release and cranial vault reconstruction for premature suture
    fusion, with the indication strengthened where a copper-beaten calvarium
    indicates chronically raised intracranial pressure. No outcome data exist
    for this specific disorder; the indication is the suture fusion and the
    intracranial pressure, which are documented.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cranial vault surgery for craniosynostosis
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Craniosynostosis
    description: >-
      Addresses the fused suture and the secondary pressure, not the underlying
      matrix defect.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A copper beaten calvarium due to high intracranial pressure is present in
      F4:II-1
    explanation: >-
      Documents raised intracranial pressure in this disorder, which is the
      indication for surgical decompression.
  notes: >-
    Curated as an indication that follows from the reported findings, not as a
    published management recommendation. No treatment guideline, trial or
    outcome series exists for ARCL2E.
- name: Inguinal Hernia Repair
  description: >-
    Surgical repair of inguinal hernia, present in five of eight reported
    individuals. Whether repair was performed in the cohort is not stated in
    the source.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: inguinal hernia repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Inguinal hernia
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inguinal hernia | + | + | - | + | + | + | - | - | 5/8 (62.5%)
    explanation: >-
      The frequency of the lesion that this intervention addresses.
- name: Hearing Amplification
  description: >-
    Hearing aid provision for the hearing loss present in three of eight
    reported individuals. The type and degree of loss are not characterized in
    the source, so the choice of device cannot be specified.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid provision
    term:
      id: NCIT:C15747
      label: Supportive Care
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Hearing impairment
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      while F2:V-3, F2:V-8, and F2:V-9 have hearing loss
    explanation: >-
      The hearing loss that amplification addresses.
  notes: >-
    NCIT:C183182 Hearing Aid is a device term and is not reachable from
    NCIT:C25218 Clinical Intervention or Procedure, so it cannot sit in
    treatment_term. It is attached as a qualifier value on a supportive-care
    action term, following this repository's device-annotation convention.
- name: Genetic Counseling
  description: >-
    Recessive-inheritance counselling for the family, including carrier testing
    for at-risk relatives once the family's variant is known. All four reported
    families are consanguineous, so counselling has to cover both the sibling
    recurrence risk and the wider kindred.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parental consanguinity | + | + | + | + | + | + | + | + | N/A
    explanation: >-
      Consanguinity in every reported family, which is what makes
      wider-kindred carrier counselling relevant here rather than a routine
      addendum.
  notes: >-
    No numeric recurrence risk is stated in this entry because the source
    publication does not state one and no GeneReviews chapter or other
    disease-specific counselling source exists to cite for it.
animal_models:
- name: ltbp1 delta29 zebrafish
  species: Zebrafish
  genotype: ltbp1 c.3526del exon 29, homozygous
  publication: PMID:33991472
  description: >-
    CRISPR-Cas9 line lacking two TGF-beta-binding domains, three
    calcium-binding EGF-like domains and one EGF-like domain at the Ltbp1 C
    terminus - the zebrafish counterpart of the human C-terminal allele class.
    Normal weight, length, Mendelian transmission and survival.
  modeled_mechanisms:
  - target: Disordered Dermal Collagen Architecture
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Dermal collagen loses its plywood-like organization, with increased
      interfibrillar spacing.
    limitations: >-
      Zebrafish dermis is not human dermis, and the corresponding human skin
      biopsy showed normal collagen fibril diameters - so this is the model
      showing a lesion the one available human sample did not.
    readouts:
    - name: Dermal collagen fibril organization on transmission electron microscopy
      target: Disordered Dermal Collagen Architecture
      direction: ALTERED
      interpretation: >-
        Structural correlate of the disordered collagen architecture node.
      evidence:
      - reference: PMID:33991472
        reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Increased interfibrillar spaces and disorganized collagen
          architecture are noted in ltbp1−/−Δ29 and ltbp1−/−Δ35 zebrafish
          samples.
        explanation: >-
          The measured ultrastructural change in both lines.
  - target: Impaired Skeletal Matrix Assembly and Ossification
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Ectopic intramembranous bone on the vertebral neural and haemal arches,
      reduced vertebral tissue mineral density, and increased vertebral volume.
    limitations: >-
      The sutures are normal and no craniosynostosis or craniofacial
      abnormality develops, so the human feature that most distinguishes this
      disorder is not reproduced. The authors raise genetic compensation and
      residual mutant transcript as possible reasons. Cardiac function is also
      normal, unlike in the mouse.
    readouts:
    - name: Vertebral tissue mineral density by micro-CT
      target: Impaired Skeletal Matrix Assembly and Ossification
      direction: DECREASED
      interpretation: >-
        Quantitative mineralization deficit, seen only in this line and not in
        the delta35 line.
      evidence:
      - reference: PMID:33991472
        reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Quantitative μCT analysis of 4-month-old zebrafish reveals a
          significant decrease in tissue mineral density (TMD) of the vertebral
          centrum
        explanation: >-
          The micro-CT measurement behind this readout.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ltbp1−/−Δ29 zebrafish lack two TGFβ-binding domains, three
      calcium-binding EGF-like domains, and one EGF-like domain at the Ltbp1 C
      terminus.
    explanation: >-
      The domains lost, which is what makes this line the counterpart of the
      human C-terminal alleles.
- name: ltbp1 delta35 zebrafish
  species: Zebrafish
  genotype: ltbp1 c.4294_4303del exon 35, homozygous
  publication: PMID:33991472
  description: >-
    Second CRISPR-Cas9 line, lacking only the last calcium-binding EGF-like
    domain and the last EGF-like domain. Its value is as an internal
    comparison: it shares the soft-tissue and ectopic-bone phenotypes but has
    normal mineral density, which localizes the mineralization phenotype to the
    C-terminal TGF-beta-binding domains that only the delta29 line loses.
  modeled_mechanisms:
  - target: Disordered Dermal Collagen Architecture
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Same folded, disorganized dermal collagen architecture as the delta29
      line.
    limitations: >-
      As for the delta29 line, this is a fish dermal phenotype without a
      confirmed human ultrastructural counterpart.
  - target: Impaired Skeletal Matrix Assembly and Ossification
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Ectopic intramembranous bone on the vertebral arches, but normal tissue
      mineral density.
    limitations: >-
      No craniosynostosis and no mineralization deficit. The contrast with the
      delta29 line is the informative part; on its own the line reproduces less
      of the human skeletal phenotype.
    readouts:
    - name: Vertebral tissue mineral density by micro-CT
      target: Impaired Skeletal Matrix Assembly and Ossification
      direction: UNCHANGED
      interpretation: >-
        A real negative result: the mineralization deficit requires loss of the
        C-terminal TGF-beta-binding domains.
      evidence:
      - reference: PMID:33991472
        reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Interestingly, quantitative μCT parameters were not different between
          ltbp1−/−Δ35 zebrafish and WT siblings
        explanation: >-
          The negative micro-CT result that separates the two lines.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ltbp1−/−Δ35 zebrafish lack the last calcium-binding EGF-like domains and
      the last EGF-like domain.
    explanation: >-
      The domains lost, which is the basis for reading the two lines as an
      allelic series.
- name: Ltbp1L-null mouse
  species: Mouse
  genotype: Ltbp1L-null (targeted deletion of the long-isoform locus)
  publication: PMID:17804598
  description: >-
    Predates the human disease by fourteen years and was not made to model it.
    Deleting the long Ltbp1 isoform is perinatally lethal from persistent
    truncus arteriosus and interrupted aortic arch, with decreased TGF-beta
    activity in the outflow tract and faulty cardiac neural crest function.
    Recorded here because the contrast with the human phenotype is
    informative, not because it recapitulates it.
  modeled_mechanisms:
  - target: Biallelic LTBP1 Premature Truncating Variants
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Loss of Ltbp1 in the mouse produces a lethal conotruncal malformation
      with reduced TGF-beta activity. Humans with biallelic truncating LTBP1
      variants survive, and their cardiac findings are a septal defect, mild
      valvular insufficiency and mild hypertrophy - none of them conotruncal
      and none lethal.
    limitations: >-
      Species difference in LTBP paralog redundancy is the authors' proposed
      explanation and is not demonstrated. The mouse allele also removes only
      the long isoform, where the human alleles truncate both, so the
      comparison is not allele-matched.
    evidence:
    - reference: PMID:17804598
      reference_title: "Long form of latent TGF-beta binding protein 1 (Ltbp1L) is essential for cardiac outflow tract septation and remodeling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ltbp1L-null animals die shortly after birth from defects in heart
        development, consisting of the improper septation of the cardiac
        outflow tract (OFT) and remodeling of the associated vessels.
      explanation: >-
        The mouse phenotype that the human disorder does not share.
  evidence:
  - reference: PMID:17804598
    reference_title: "Long form of latent TGF-beta binding protein 1 (Ltbp1L) is essential for cardiac outflow tract septation and remodeling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The lack of Ltbp1L in the ECM of the septating OFT and associated vessels
      results in altered gene expression and function of CNCCs and decreased
      Tgf-beta activity in the OFT.
    explanation: >-
      The direction of the TGF-beta change in the mouse heart, which is a
      decrease - the opposite of what is measured in human ARCL2E dermal
      fibroblasts.
experimental_models:
- name: Proband dermal fibroblast cultures (c.4844del and c.1342C>T)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary dermal fibroblasts from two probands, one per truncation class,
    each compared against two age- and sex-matched control lines. This is the
    entire functional dataset for the disorder, and every mechanistic claim
    about the branch split rests on it. Skin biopsies were unavailable from the
    other six affected individuals.
  modeled_mechanisms:
  - target: Excess TGF-beta Activation and Canonical Smad2 Signaling
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Total TGF-beta by ELISA in conditioned medium, pSmad2/Smad2 by
      immunoblot, CTGF and POSTN by RT-qPCR.
    limitations: >-
      One proband line per truncation class, and dermal fibroblasts cannot
      report the bone and suture compartments where the skeletal phenotype
      arises. The authors note that growth factor signaling in fibroblasts may
      not represent osteogenic pathways.
    readouts:
    - name: Total TGF-beta in conditioned medium
      target: Excess TGF-beta Activation and Canonical Smad2 Signaling
      direction: INCREASED
      interpretation: >-
        Increased in the C-terminal-variant line only.
      evidence:
      - reference: PMID:33991472
        reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Total TGFβ protein levels are significantly increased in conditioned
          media of F1:IV-2, but not of F4:II-1, compared to control subjects
        explanation: >-
          The ELISA measurement and the contrast between the two branches.
  - target: Failure of Fibulin-4 Incorporation into the Elastic Fiber Scaffold
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Immunofluorescent analysis of the matrix fraction at 9 days
      post-confluency for fibulin-4, LTBP1, LTBP2, fibrillin-1, and collagens I
      and III.
    limitations: >-
      A confluent fibroblast monolayer builds a matrix that is not dermis, and
      one line per branch gives no measure of between-individual variation.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We used dermal fibroblasts cultured from skin biopsies of F1:IV-2 and
      F4:II-1 in this study. Skin biopsies of F2:V-3, F2:V-4, F2:V-8, F2:V-9,
      F3:II-1, and F3:II-2 are not available.
    explanation: >-
      States both what was studied and the limit on the dataset, which is why
      the two-branch model is a two-sample observation.
discussions:
- discussion_id: arcl2e_no_independent_replication
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the ARCL2E phenotype hold outside the four founding families, and does
    the N-terminal versus C-terminal split carry any clinical consequence?
  attaches_to:
  - pathophysiology#Biallelic LTBP1 Premature Truncating Variants
  - genetic#LTBP1
  rationale: >-
    The disorder rests on one publication. Every frequency in this entry is a
    fraction of eight, every functional claim about the branch split comes from
    two fibroblast lines, and the ascertainment was entirely through
    consanguineous families identified by research sequencing. What a
    non-consanguineous compound heterozygote looks like is unknown, and so is
    whether the N-terminal and C-terminal classes differ clinically rather than
    only in cell culture.

    The only other human LTBP1 finding located is a candidate variant in a
    craniosynostosis sequencing cohort, reported without segregation, zygosity
    or functional work, and grouped by its authors with other variants of
    uncertain relevance. It is a lead for where the second cohort might come
    from, not a replication.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further studies are needed to confirm the distinct molecular consequences
      related to a loss of LTBP1 or altered LTBP1 level in cultured dermal
      fibroblast samples derived from other diagnosed individuals with LTBP1
      variants in similar regions.
    explanation: >-
      The authors' own statement that the branch split needs confirmation in
      further individuals.
  - reference: PMID:38318288
    reference_title: "The value of genome-wide analysis in craniosynostosis."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, we identified potentially relevant variants in 87% of the
      remaining families with no previously detected causal variants, including
      novel variants in ADAMTSL4, ASH1L, ATRX, C2CD3, CHD5, ERF, H4C5, IFT122,
      IFT140, KDM6B, KMT2D, LTBP1, MAP3K7, NOTCH2, NSD1, SOS1, SPRY1, POLR2A,
      PRRX1, RECQL4, TAB2, TAOK1, TET3, TGFBR1, TCF20, and ZBTB20.
    explanation: >-
      Graded NO_EVIDENCE because this names LTBP1 in a list of potentially
      relevant candidate variants in a craniosynostosis cohort without
      zygosity, segregation or functional data. It does not bear on whether
      biallelic LTBP1 truncation causes this disorder, and is recorded here so
      it is not mistaken for a second cohort.
- discussion_id: arcl2e_mouse_human_cardiac_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is Ltbp1 loss lethal in the mouse heart and survivable in humans, and
    what does that imply for using rodent data to predict human cardiovascular
    risk?
  attaches_to:
  - pathophysiology#Biallelic LTBP1 Premature Truncating Variants
  - animal_models#Mouse
  rationale: >-
    Ltbp1L-null and Ltbp1-null mice die perinatally with persistent truncus
    arteriosus and interrupted aortic arch, from decreased TGF-beta activity in
    the outflow tract. Humans homozygous for premature truncating LTBP1
    variants have no conotruncal defect, survive into adolescence at least, and
    show mild variable cardiac findings instead. The zebrafish lines have
    normal cardiac function on ultrasound. The mismatch is not a detail: it is
    the reason the mouse literature cannot be used to counsel cardiac risk in
    this disorder, and it is a specific argument that LTBP paralog redundancy
    differs between species.

    It also cuts the other way. The absence of a severe cardiac phenotype in
    eight humans is not the same as its absence in the disorder, and the oldest
    individual reported was 17 years 5 months. Adult cardiovascular outcome in
    ARCL2E is simply unobserved.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Remarkably, Ltbp1L−/− and Ltbp1−/− mice present with truncus arteriosus,
      interrupted aortic arch, and perinatal lethality. Our observations imply
      differences in functional redundancy of LTBP family members or other
      compensatory mechanisms for Ltbp1 deficiency in mice versus humans and
      teleosts.
    explanation: >-
      States the mismatch and the authors' proposed explanation for it.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Assessment of cardiovascular function in adult zebrafish by ultrasound
      imaging, however, revealed no significant differences between
      ltbp1−/−Δ29 zebrafish, ltbp1−/−Δ35 zebrafish, and corresponding WT
      siblings at 10 months of age
    explanation: >-
      The zebrafish result, which sides with the human phenotype rather than
      the mouse one.
- discussion_id: arcl2e_zebrafish_no_craniosynostosis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can craniosynostosis be modelled in an ltbp1-deficient animal at all, and
    if not, what system would test the suture mechanism?
  attaches_to:
  - pathophysiology#Impaired Skeletal Matrix Assembly and Ossification
  - animal_models#Zebrafish
  rationale: >-
    Craniosynostosis is present in three-quarters of affected humans and is the
    feature that separates this disorder from the rest of the cutis laxa group,
    yet neither zebrafish line develops it - the interfrontal, coronal,
    sagittal and lambdoid sutures are all normal, as is craniofacial
    morphology. The mouse literature offers only minor craniofacial
    abnormalities in an Ltbp1-null. So the single most diagnostically useful
    feature of ARCL2E currently has no animal model, and the proposed
    reduced-TGF-beta-in-bone mechanism has never been tested in a system that
    produces the phenotype.

    The authors suggest genetic compensation, or residual mutant transcript, as
    reasons the fish may be protected, and propose an RNA-less allele as the
    test. Neither explanation has been evaluated.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, neither craniofacial abnormalities nor craniosynostosis were
      observed in both homozygous mutant zebrafish models.
    explanation: >-
      The negative result at the heart of this mismatch.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A possible explanation for the lack of these features could be the
      induction of genetic compensation mechanisms, which could partly rescue
      the craniosynostosis phenotype.
    explanation: >-
      The authors' proposed explanation, offered as a possibility.
notes: >-
  Lump or split. ARCL2E is curated as its own Disease entry rather than as a
  has_subtypes entry under an autosomal recessive cutis laxa type 2 parent, for
  three reasons. It has its own MONDO term (MONDO:0030337) and OMIM entry, and
  a single causal gene with a single proximal mechanism. There is no ARCL2
  parent entry in this knowledge base to attach it to - ARCL2A is itself a
  standalone entry - and the type 2 numbering is a nosological accident rather
  than a mechanistic family: 2A and 2C/2D are V-ATPase subunits acting on Golgi
  pH, 2B is PYCR1 proline metabolism, and 2E is a microfibril-associated
  TGF-beta binding protein. Grouping them would assert a shared mechanism that
  does not exist. The authors themselves proposed the name LTBP1-related cutis
  laxa syndrome on the strength of features that do not occur in the rest of
  the group.

  The within-entry split was considered and rejected. The N-terminal and
  C-terminal truncation classes have genuinely different cellular phenotypes,
  which would be an argument for two has_subtypes entries. They are modelled as
  two pathophysiology branches instead, because the split is currently a
  two-fibroblast-line observation with no demonstrated clinical correlate: the
  individual with the N-terminal allele is not clinically distinguishable from
  the others in the reported cohort, and the authors call for confirmation in
  further individuals. Declaring subtypes would assert a clinical division the
  data do not support.

  No conforms_to is declared. The nearest candidate module,
  aortopathy_tgfbeta_dysregulation, scopes itself to the heritable thoracic
  aortic aneurysm and dissection syndromes and runs from an aortic wall defect
  through medial degeneration to dilation and dissection. No aortic dilation,
  dissection or medial degeneration is reported in ARCL2E, and its cardiac
  findings are a septal defect and mild valvular and ventricular changes, so
  conforming would import a cascade the disorder has not been shown to have. No
  elastic-fibre-assembly or microfibril-homeostasis module exists in
  kb/modules/ at the time of curation; one would be the right target if it did.

  GeneReviews has no chapter for this disorder. Checked against the committed
  Bookshelf index (snapshot 2026-09-10, 958 GeneReviews chapters) and with a
  live PubMed title search; both returned NO_CHAPTER. Orphanet has no entry
  either: the Orphadata en_product1.xml release pinned in
  data/orphadata/MANIFEST.yaml contains no LTBP1 gene mention and no cutis laxa
  type 2E disorder, only types 1, 1C, 2, 2A and 2B. Phenotype frequencies here
  therefore come from the primary cohort table rather than from an
  expert-curated baseline.

  Most of the craniofacial features carry no causal edge, and that is the
  state of the knowledge rather than an omission. The source groups coarse
  face, arched eyebrows, downslanting fissures, nasal shape, sagging cheeks,
  nasolabial folds, philtrum, lip vermilion and palate under craniofacial
  dysmorphism and offers no mechanism for any of them; whether they follow from
  the skin laxity, from the cranial matrix defect, or from both is not
  addressed. The same applies to the hearing loss, the optic nerve hypoplasia,
  the cranial nerve palsies, the feeding problems and the two urological
  lesions. Among the cardiac findings only the mitral lesion has a proposed
  upstream, and that by analogy to a Marfan mouse model; the septal defect, the
  tricuspid insufficiency and the ventricular hypertrophy have none.

  Frequencies of 8/8 are recorded as VERY_FREQUENT rather than OBLIGATE.
  OBLIGATE asserts presence in all cases of the disease; eight individuals
  cannot establish that, and reading a 100% figure from a series this small as
  obligate would overstate it.

  The family 3 allele is recorded as c.3991dup (p.Thr1331Asnfs*22), the
  corrected nomenclature from the 2021 erratum, not the c.3991_3995del
  (p.Thr1331Asnfs*20) printed in the original article.

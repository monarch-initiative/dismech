      absence of LTBP1 in dermal fibroblasts of F4:II-1
    explanation: >-
      Protein-level confirmation that the transcript loss produces an absent
      protein rather than a reduced one.
- name: LTBP Paralog Redundancy Preserves TGF-beta Handling
  biological_scale: MOLECULAR
  role: compensation
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Why complete absence of LTBP1 produces no TGF-beta signature. In the
    c.1342C>T fibroblasts total TGF-beta, the pSmad2/Smad2 ratio, POSTN
    expression and collagen I and III fiber incorporation are all unchanged,
    and LTBP2, LTBP3 and LTBP4 are available to carry the latent complex.
    Proposed by the authors rather than demonstrated - no paralog knockdown was
    performed in these cells.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Total TGFβ protein levels are significantly increased in conditioned
      media of F1:IV-2, but not of F4:II-1, compared to control subjects
    explanation: >-
      The negative result in the N-terminal branch that the redundancy proposal
      is built to explain.
  - reference: PMID:25960419
    reference_title: "Latent TGF-β-binding proteins."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This may suggest either notable redundancy between LTBP isoforms or that
      there are significant LTBP-independent mechanisms of TGFβ secretion and
      signaling that occur during development.
    explanation: >-
      An independent review reaching the same redundancy hypothesis from the
      knockout-animal literature, and naming the alternative explanation.
- name: Reduced Fibrillin-1 Expression
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    FBN1 mRNA and secreted fibrillin-1 protein are reduced in the fibroblasts
    lacking LTBP1 entirely, while FBN2 is unaffected. How loss of a
    microfibril-associated ligand lowers fibrillin-1 transcription is not
    worked out in the source; a later in vitro study found LTBP1 coordinating
    fibrillin incorporation into the matrix independently of TGF-beta, which is
    a candidate explanation rather than a demonstrated one.
  cell_types:
  - preferred_term: proband dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  downstream:
  - target: Abnormal Dermal Elastic Fiber Architecture
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35452817
    reference_title: "LTBP1 promotes fibrillin incorporation into the extracellular matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we show that LTBP1 coordinates the incorporation of
      fibrillin-1 and -2 into the extracellular matrix in vitro.
    explanation: >-
      An LTBP1 function on fibrillin that does not run through TGF-beta, which

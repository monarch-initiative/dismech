inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic premature truncating LTBP1 variants. Every reported individual is
    homozygous and every reported family consanguineous, and the four alleles
    are private to their families rather than a shared founder variant. All
    four segregate with disease and carrier status within their pedigrees and
    none is present in population allele-frequency databases.

    Heterozygous carriers in these families are unaffected. One carrier mother
    has a congenital diaphragmatic hernia shared with her affected daughter,
    which the authors note explicitly rather than counting as a disease
    feature.
  evidence:
  - reference: PMID:33991472

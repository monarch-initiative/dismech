mechanistic_hypotheses:
- hypothesis_group_id: ltbp1_tissue_specific_tgfbeta
  hypothesis_label: Tissue-Specific Direction of TGF-beta Dysregulation
  status: EMERGING
  description: >-
    The TGF-beta abnormality demonstrated in ARCL2E is an increase, and it was
    measured in dermal fibroblasts from one individual carrying a C-terminal
    allele. The authors argue that the skeletal phenotype may require the
    opposite: craniosynostosis has been produced in mice by reducing TGF-beta
    bioavailability in the bone matrix through Ltbp3 ablation, and skull
    deformities are reported in Ltbp1-null mice. Under this model the direction
    of the TGF-beta change is set by the local matrix rather than by the
    variant, so dermis and cranial suture can move in opposite directions from
    the same genotype.

    Nothing in the published work measures TGF-beta in human ARCL2E bone or
    suture tissue, so the skeletal limb of this model is unmeasured. A
    competing possibility the same authors raise is that the relevant LTBP1
    function in bone is not TGF-beta handling at all.
  evidence:
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the mechanisms controlling the tissue bioavailability of TGFβ
      are most likely tissue specific.
    explanation: >-
      The authors' statement of the tissue-specificity premise the hypothesis
      rests on.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These reports in mice are consistent with the idea of reduced TGFβ
      bioavailability in bone of F4:II-1.
    explanation: >-
      The proposed reduced-TGF-beta direction in bone, explicitly framed as
      consistency with mouse data rather than as a human measurement.
  - reference: PMID:33991472
    reference_title: "Bi-allelic premature truncating variants in LTBP1 cause cutis laxa syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, LTBP1 might have other, yet unknown functions that cannot be
      compensated by other LTBPs and are causative for the clinical features in
      the reported probands.
    explanation: >-
      The competing non-TGF-beta explanation, stated by the same authors.

name: Early-onset Familial Hypoaldosteronism
creation_date: "2026-10-15T12:00:00Z"
category: Mendelian
synonyms:
- Aldosterone synthase deficiency
- Congenital hyperreninemic hypoaldosteronism
- Corticosterone methyloxidase deficiency
- Early-onset familial hyperreninemic hypoaldosteronism
- Severe aldosterone synthase deficiency
description: >-
  Early-onset familial hypoaldosteronism (aldosterone synthase deficiency) is an
  autosomal recessive isolated defect of the terminal steps of aldosterone
  biosynthesis caused by biallelic loss-of-function variants in CYP11B2, which
  encodes aldosterone synthase in the adrenal zona glomerulosa. Cortisol
  synthesis is preserved. Lack of aldosterone causes renal sodium wasting and
  potassium retention, so affected infants present in the first weeks to months
  of life with vomiting, dehydration, failure to thrive, hyponatremia,
  hyperkalemia and markedly elevated renin. Two biochemical types are
  distinguished by the steroid profile: corticosterone methyloxidase type I
  (CMO I), with low 18-hydroxycorticosterone, and type II (CMO II), with an
  elevated 18-hydroxycorticosterone to aldosterone ratio. Treatment is
  fludrocortisone with sodium supplementation; mineralocorticoid requirement
  usually wanes in childhood and adults are often asymptomatic.
disease_term:
  preferred_term: Early-onset familial hypoaldosteronism
  term:
    id: MONDO:0035320
    label: early-onset familial hypoaldosteronism
parents:
- familial hypoaldosteronism

has_subtypes:
- name: CMO I
  display_name: Corticosterone methyloxidase type I deficiency
  subtype_term:
    preferred_term: corticosterone methyloxidase type 1 deficiency
    term:
      id: MONDO:0008751
      label: corticosterone methyloxidase type 1 deficiency
  genes:
  - preferred_term: CYP11B2
    term:
      id: hgnc:2592
      label: CYP11B2
  description: >-
    Biochemical type in which aldosterone and 18-hydroxycorticosterone are both
    decreased while corticosterone and 11-deoxycorticosterone are elevated,
    reflecting loss of the 18-hydroxylase step; typically caused by truncating
    or fully inactivating CYP11B2 variants (for example E255X, R384P).
  evidence:
  - reference: PMID:9360501
    reference_title: "Hereditary defect in biosynthesis of aldosterone: aldosterone synthase deficiency 1964-1997."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aldosterone and 18-OH-corticosterone were decreased, whereas corticosterone and 11-deoxycorticosterone were elevated, thus confirming the diagnosis of corticosterone methyl oxidase deficiency type I."
    explanation: Defines the CMO I steroid profile in the original Visser and Cost patients.
  - reference: PMID:7852500
    reference_title: "Amino acid substitution R384P in aldosterone synthase causes corticosterone methyloxidase type I deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R384P leads to complete loss of 11 beta- and 18-hydroxylase activities of P450aldo"
    explanation: A CMO I allele abolishes both 11beta- and 18-hydroxylase activities in expression studies.
- name: CMO II
  display_name: Corticosterone methyloxidase type II deficiency
  subtype_term:
    preferred_term: corticosterone methyloxidase type 2 deficiency
    term:
      id: MONDO:0012524
      label: corticosterone methyloxidase type 2 deficiency
  genes:
  - preferred_term: CYP11B2
    term:
      id: hgnc:2592
      label: CYP11B2
  description: >-
    Biochemical type characterized by an elevated ratio of
    18-hydroxycorticosterone to aldosterone, reflecting selective loss of the
    18-oxidase step with retained 18-hydroxylase activity. Highly prevalent in
    Iranian Jews homozygous for the combined R181W and V386A alleles.
  evidence:
  - reference: PMID:1594605
    reference_title: Mutations in the human CYP11B2 (aldosterone synthase) gene causing corticosterone methyloxidase II deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corticosterone methyloxidase II (CMO-II) deficiency is an autosomal recessive disorder of aldosterone biosynthesis, characterized by an elevated ratio of 18-hydroxycorticosterone to aldosterone in serum."
    explanation: Defines CMO II by its steroid ratio.
  - reference: PMID:1594605
    reference_title: Mutations in the human CYP11B2 (aldosterone synthase) gene causing corticosterone methyloxidase II deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R181W reduced 18-hydroxylase and abolished 18-oxidase activities but left 11 beta-hydroxylase activity intact"
    explanation: Expression of the CMO II allele shows the selective loss of 18-oxidase activity underlying the subtype.
inheritance:
- name: Autosomal recessive inheritance
  description: Biallelic (homozygous or compound heterozygous) CYP11B2 variants; carrier parents are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33098647
    reference_title: Molecular Analysis of the CYP11B2 Gene in 62 Patients with Hypoaldosteronism Due to Aldosterone Synthase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main causes of this rare autosomal recessive disorder is pathogenic variants of the CYP11B2 gene leading to aldosterone synthase deficiency."
    explanation: States the autosomal recessive inheritance of aldosterone synthase deficiency.
  - reference: PMID:7852500
    reference_title: "Amino acid substitution R384P in aldosterone synthase causes corticosterone methyloxidase type I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both parents were heterozygous carriers for R384P, whereas the patient appeared homozygous"
    explanation: Family segregation consistent with recessive inheritance.
genetic:
- name: CYP11B2
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CYP11B2
    term:
      id: hgnc:2592
      label: CYP11B2
  notes: >-
    Biallelic missense, nonsense, frameshift, splice and in-frame deletion
    variants are reported. In a Greek cohort of 62 patients, p.T185I was present
    in 96% of unrelated patients; it was also the most common variant (40%) in a
    Turkish multicenter series. A minority of clinically typical patients carry
    no identifiable CYP11B2 defect.
  evidence:
  - reference: PMID:33098647
    reference_title: Molecular Analysis of the CYP11B2 Gene in 62 Patients with Hypoaldosteronism Due to Aldosterone Synthase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, 96% of the 56 patients carried the previously reported p.T185I variant either in homozygosity or in compound heterozygosity with another variant."
    explanation: Largest cohort identifies biallelic CYP11B2 variants and a recurrent founder allele.
  - reference: PMID:34415991
    reference_title: Catch-up Growth and Discontinuation of Fludrocortisone Treatment in Aldosterone Synthase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common variant (40%) was p.T185I."
    explanation: Independent cohort confirms p.T185I as a common pathogenic allele.
  - reference: PMID:16733366
    reference_title: "Congenital hyperreninemic hypoaldosteronism in Israel: sequence analysis of CYP11B2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We could not find a molecular defect in 2 patients: one was a carrier of the D335G mutation and the other had no detectable molecular change in the coding and promoter regions."
    explanation: Some clinically typical patients lack identified biallelic CYP11B2 variants, indicating incomplete molecular yield.
pathophysiology:
- name: Biallelic CYP11B2 loss of function
  description: >-
    Biallelic inactivating CYP11B2 variants reduce or abolish aldosterone
    synthase (P450c11AS) activity. Enzymatic activity generally has to fall
    below about 1% of normal before aldosterone synthesis is impaired; the
    pattern of residual 11beta-hydroxylase, 18-hydroxylase and 18-oxidase
    activity determines the CMO I versus CMO II steroid profile.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CYP11B2
    term:
      id: hgnc:2592
      label: CYP11B2
  molecular_functions:
  - preferred_term: aldosterone synthase 18-hydroxylase activity
    term:
      id: GO:0047783
      label: corticosterone 18-monooxygenase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:15134805
    reference_title: Aldosterone synthase deficiency and related disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Many mutations have been documented in each of these genes; in general enzymatic activity must be reduced to <1% of normal for aldosterone biosynthesis to be impaired."
    explanation: Review states the residual-activity threshold for disease.
  - reference: PMID:20494601
    reference_title: "Five novel mutations in CYP11B2 gene detected in patients with aldosterone synthase deficiency type I: Functional characterization and structural analyses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The expression studies of the mutant proteins in COS-1 cells showed a complete absence of CYP11B2 activity of p.S315R and p.R374W mutants for the conversion of 11-deoxycorticosterone to aldosterone."
    explanation: Patient missense variants abolish aldosterone synthase activity in vitro.
  downstream:
  - target: Impaired zona glomerulosa aldosterone biosynthesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31302112
      reference_title: Analysis of novel heterozygous mutations in the CYP11B2 gene causing congenital aldosterone synthase deficiency and literature review.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The HEK-293T expression system was used to investigate the variants, demonstrating negligible aldosterone synthesis compared with WT CYP11B2."
      explanation: Patient CYP11B2 variants produce negligible aldosterone in a cellular expression system.
- name: Impaired zona glomerulosa aldosterone biosynthesis
  description: >-
    Aldosterone synthase catalyzes the terminal 11beta-hydroxylation,
    18-hydroxylation and 18-oxidation steps converting 11-deoxycorticosterone to
    aldosterone in zona glomerulosa cells. Its loss produces isolated aldosterone
    deficiency with intact cortisol synthesis, which is CYP11B1-dependent.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: zona glomerulosa cell
    term:
      id: CL:0002099
      label: type I cell of adrenal cortex
  locations:
  - preferred_term: zona glomerulosa of adrenal gland
    term:
      id: UBERON:0002053
      label: zona glomerulosa of adrenal gland
  biological_processes:
  - preferred_term: aldosterone biosynthetic process
    term:
      id: GO:0032342
      label: aldosterone biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:1594605
    reference_title: Mutations in the human CYP11B2 (aldosterone synthase) gene causing corticosterone methyloxidase II deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P450XIB2 catalyzes the synthesis of aldosterone from deoxycorticosterone, a process that successively requires hydroxylation at positions 11 beta and 18 and oxidation at position 18."
    explanation: Describes the three terminal steps performed by aldosterone synthase.
  - reference: PMID:38262861
    reference_title: "Neonatal salt wasting syndrome: Aldosterone synthase deficiency caused by a new splicing variant in CYP11B2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aldosterone synthase deficiency (ASD) is a rare autosomal recessive disorder involving isolated aldosterone deficiency without any compromise of other adrenal hormones."
    explanation: Aldosterone deficiency is isolated, with other adrenal steroids preserved.
  downstream:
  - target: Renal sodium wasting and potassium retention
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15134805
      reference_title: Aldosterone synthase deficiency and related disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Inherited defects in aldosterone biosynthesis thus cause hypovolemia, hyponatremia and hyperkalemia."
      explanation: Review states that loss of aldosterone biosynthesis causes the renal electrolyte disturbance.
  - target: Decreased circulating aldosterone
- name: Renal sodium wasting and potassium retention
  description: >-
    Without aldosterone, distal nephron and collecting duct principal cells fail
    to reabsorb sodium and secrete potassium, producing urinary sodium loss,
    hypovolemia, hyponatremia, hyperkalemia and metabolic acidosis.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: kidney collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell
  biological_processes:
  - preferred_term: renal sodium ion absorption
    term:
      id: GO:0070294
      label: renal sodium ion absorption
    modifier: DECREASED
  - preferred_term: potassium ion homeostasis
    term:
      id: GO:0055075
      label: potassium ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:15134805
    reference_title: Aldosterone synthase deficiency and related disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aldosterone's main actions are to regulate intravascular volume and serum electrolytes by controlling sodium absorbtion and potassium excretion in the distal nephron."
    explanation: Establishes the renal sodium and potassium handling disrupted by aldosterone deficiency.
  downstream:
  - target: Hyponatremia
  - target: Hyperkalemia
  - target: Dehydration
  - target: Metabolic acidosis
  - target: Renal salt wasting
  - target: Compensatory renin-angiotensin system activation
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34415991
      reference_title: Catch-up Growth and Discontinuation of Fludrocortisone Treatment in Aldosterone Synthase Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Fludrocortisone treatment is associated with a rapid catch-up growth and control of electrolyte imbalances in ASD."
      explanation: Correction of mineralocorticoid deficiency restores growth, linking salt wasting to growth failure through a treatment-response inference.
- name: Compensatory renin-angiotensin system activation
  description: >-
    Volume depletion drives renin secretion; plasma renin activity is markedly
    elevated in affected infants and young children but may be normal in adults.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32539318
    reference_title: "Clinical and Genetic Characteristics of Patients with Corticosterone Methyloxidase Deficiency Type 2: Novel Mutations in CYP11B2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma renin activity is significantly increased in affected infants and young children (up to 100-fold normal) but can be normal in adults."
    explanation: Describes the magnitude and age dependence of hyperreninemia.
  downstream:
  - target: Increased circulating renin

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through comprehensive sequence analyses of sarcomere genes in 334 DCM probands we identified 2 unrelated, multi-generational families with DCM that shared a variant in the gene encoding α-tropomyosin (TPM1)."
    explanation: Proband cohort screening showing TPM1 accounts for a small fraction of familial DCM.

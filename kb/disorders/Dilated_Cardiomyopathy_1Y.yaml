inheritance:
- name: Autosomal dominant
  description: >-
    Autosomal dominant transmission with high but incomplete penetrance. In the two large
    multigenerational families that established the D230N allele, penetrance was reported
    at 80%.
  penetrance_percentage: "80"
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:23147248
    reference_title: "A novel alpha-tropomyosin mutation associates with dilated and non-compaction cardiomyopathy and diminishes actin binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a large four-generation family in which DCM is inherited as an autosomal dominant trait."
    explanation: Autosomal dominant transmission across four generations.
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal cardiac dimensions and contractile parameters were identified in 16 of 20 mutation carriers, indicating a penetrance of 80% for DCM in the 2 families."
    explanation: >-
      The primary segregation study, giving the carrier count behind the 80% figure rather
      than the figure alone.
pathophysiology:
- name: TPM1 Missense Variant
  description: >-
    Single missense substitutions in alpha-tropomyosin. The disease-causing alleles are
    scattered along the coiled-coil rather than confined to one domain, and which disease
    results depends on where the substitution sits and what it does to the molecule -
    different mutations cause HCM or DCM, so the gene is not simply dose-sensitive.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TPM1
    term:
      id: hgnc:12010
      label: TPM1
  downstream:
  - target: Altered Tropomyosin Flexibility and Actin Binding
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24005378
    reference_title: "Alpha-tropomyosin mutations in inherited cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The inherited cardiac diseases hypertrophic cardiomyopathy (HCM) and dilated cardiomyopathy (DCM) can both be caused by missense mutations in the TPM1 gene which encodes the thin filament regulatory protein α-tropomyosin."
    explanation: >-
      Establishes that both diseases arise from missense change in the same gene. Graded
      OTHER because this is a structure-function review synthesising biophysical and
      animal-model work rather than reporting one study type.
  - reference: PMID:24005378
    reference_title: "Alpha-tropomyosin mutations in inherited cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Different mutations are responsible for either HCM or DCM, suggesting that distinct changes in tropomyosin structure and function can lead to the different diseases."
    explanation: States that allele identity, not gene dosage, determines which phenotype results.
  - reference: PMID:11273725
    reference_title: "Mutations that alter the surface charge of alpha-tropomyosin are associated with dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two mutations that alter highly conserved residues and that, unlike hypertrophic cardiomyopathy-associated mutations, cause localized charge reversal on the surface of tropomyosin."
    explanation: >-
      The first proposal of a physical rule separating the two phenotypes - DCM alleles
      reverse surface charge, HCM alleles do not. D230N fits it, losing a charge at a
      solvent-exposed f-position residue.
  - reference: PMID:11273725
    reference_title: "Mutations that alter the surface charge of alpha-tropomyosin are associated with dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "substitution of different amino acid residues in the same thin filament proteins is associated with the distinct phenotypes of cardiac hypertrophy or congestive heart failure"
    explanation: >-
      The same claim stated as a conclusion, and the earliest statement of the
      one-gene-two-diseases pattern this node rests on.
- name: Altered Tropomyosin Flexibility and Actin Binding
  description: >-
    The primary biophysical lesion, and it differs between alleles. D230N increases the
    thermal stability of the C-terminal end of the coiled-coil, which decreases flexibility
    at the head-to-tail overlap - the joint the filament must flex about to move around
    actin. D84N instead weakens tropomyosin's binding to actin by 25% through lost
    charge-charge interaction. Both routes compromise the same regulatory function; neither
    is a simple loss of protein.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: actin binding
    modifier: DECREASED
    term:
      id: GO:0003779
      label: actin binding
  cellular_components:
  - preferred_term: striated muscle thin filament
    term:
      id: GO:0005865
      label: striated muscle thin filament
  downstream:
  - target: Decreased Myofilament Calcium Sensitivity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28600229
    reference_title: "The structural basis of alpha-tropomyosin linked (Asp230Asn) familial dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Measurements of the thermal unfolding of D230N-Tm vs WT-Tm revealed an increase in stability primarily affecting the C-terminus of the Tm coiled-coil."
    explanation: The structural measurement behind the reduced-flexibility mechanism.
  - reference: PMID:28600229
    reference_title: "The structural basis of alpha-tropomyosin linked (Asp230Asn) familial dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the D230N-Tm mutation induces a decrease in flexibility of the C-terminus via propagation through the helical structure of the protein, thus decreasing the flexibility of the Tm overlap and impairing its ability to regulate contraction"
    explanation: States the allosteric propagation from the substituted residue to the overlap region.
  - reference: PMID:23147248
    reference_title: "A novel alpha-tropomyosin mutation associates with dilated and non-compaction cardiomyopathy and diminishes actin binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The TPM1 p.D84N was the only mutation identified. The mutation co-segregates with all clinically affected family members and significantly weakens the binding of tropomyosin to actin by 25%."
    explanation: >-
      The alternative biophysical route - quantified loss of actin binding rather than
      altered flexibility.
- name: Decreased Myofilament Calcium Sensitivity
  description: >-
    The functional consequence that defines the DCM direction. Across TPM1 alleles, DCM
    mutations generally decrease myofilament calcium sensitivity while HCM mutations
    increase it, and DCM mutations additionally uncouple troponin phosphorylation from
    calcium responsiveness - so the heart loses not only sensitivity but the ability to
    modulate it. In the D230N mouse the reduced calcium sensitivity of sliding velocity is
    accompanied by an increased peak amplitude of the calcium transient, which reads as
    compensation: the cell raises calcium because the filament responds to it less.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: regulation of cardiac muscle contraction by calcium ion signaling
    modifier: DECREASED
    term:
      id: GO:0010882
      label: regulation of cardiac muscle contraction by calcium ion signaling
  downstream:
  - target: Systolic Dysfunction and Ventricular Dilation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24005378
    reference_title: "Alpha-tropomyosin mutations in inherited cardiomyopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The latter changes have been found to be particularly consistent, with HCM mutations increasing Ca(2+) sensitivity and DCM mutations in general decreasing this parameter and uncoupling the effect of troponin phosphorylation upon Ca(2+) responsiveness."
    explanation: >-
      The central directional claim separating TPM1-HCM from TPM1-DCM, described by the
      review as the most consistent of the reported effects.
  - reference: PMID:28600229
    reference_title: "The structural basis of alpha-tropomyosin linked (Asp230Asn) familial dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "D230N-Tm filaments exhibited a reduced Ca2+ sensitivity of sliding velocity. This decrease in sensitivity was coupled to increase in the peak amplitude of Ca2+ transients."
    explanation: Direct measurement of both the reduced sensitivity and the compensatory calcium transient.
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies demonstrated major inhibitory effects on sarcomere function with reduced Ca(2+) sensitivity, maximum activation, and Ca(2+) affinity compared with wild-type TPM1."
    explanation: >-
      The reconstituted-thin-filament measurements themselves, from the study that made
      them, across three related biophysical parameters.
  - reference: PMID:28600229
    reference_title: "The structural basis of alpha-tropomyosin linked (Asp230Asn) familial dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "While significant, and consistent with other DCMs, these measurements are comprised of complex inputs and did not provide sufficient experimental resolution."
    explanation: >-
      Graded PARTIAL and included deliberately - the authors themselves judged the calcium
      measurements insufficiently resolved, which is why they went on to the structural
      work. The calcium change is real but is not the whole account.
- name: Systolic Dysfunction and Ventricular Dilation
  description: >-
    The organ-level endpoint: reduced ejection fraction with left ventricular enlargement.
    In the D230N transgenic mouse significant systolic dysfunction is present by two months
    of age, phenocopying the early onset seen in the families.
  biological_scale: ORGANISM
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal cardiac dimensions and contractile parameters were identified in 16 of 20 mutation carriers, indicating a penetrance of 80% for DCM in the 2 families."
    explanation: >-
      The human phenotype the mechanism must explain - abnormal chamber dimensions and
      contractility in most carriers.
  - reference: PMID:23147248
    reference_title: "A novel alpha-tropomyosin mutation associates with dilated and non-compaction cardiomyopathy and diminishes actin binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dilated cardiomyopathy (DCM) is characterized by idiopathic dilatation and systolic contractile dysfunction of the ventricle(s) leading to an impaired systolic function."
    explanation: Defines the clinical endpoint of the pathograph.
phenotypes:
- name: Dilated Cardiomyopathy
  category: Cardiovascular
  description: Left ventricular dilation with systolic dysfunction, the defining phenotype.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TPM1 D230N segregated with DCM in 2 large unrelated families."
    explanation: The segregation evidence establishing TPM1 as a DCM gene.
- name: Reduced Left Ventricular Ejection Fraction
  category: Cardiovascular
  description: Reduced ejection fraction, the functional correlate of the systolic dysfunction.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Reduced left ventricular ejection fraction
    term:
      id: HP:0012664
      label: Reduced left ventricular ejection fraction
  evidence:
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two siblings, IV-5 and IV-8, presented with DCM and advanced HF at 5 months of age (LVEF 27% and 29%), and were given the presumptive diagnosis of myocarditis."
    explanation: >-
      Measured ejection fractions in affected carriers. The misdiagnosis as myocarditis is
      quoted with them because it is how the phenotype presents before the family history
      is known.
- name: Left Ventricular Noncompaction
  category: Cardiovascular
  description: >-
    Noncompaction cardiomyopathy, described with the D84N allele in the same family as
    dilated cardiomyopathy. MONDO lists left ventricular noncompaction among this term's
    parents, so the overlap is recognised at the ontology level as well as clinically.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Left ventricular noncompaction
    term:
      id: HP:0030682
      label: Left ventricular noncompaction
  evidence:
  - reference: PMID:23147248
    reference_title: "A novel alpha-tropomyosin mutation associates with dilated and non-compaction cardiomyopathy and diminishes actin binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that a mutation in TPM1 is associated with DCM and a lethal, early onset form of NCCM, probably as a result of diminished actin binding caused by weakened charge-charge interactions."
    explanation: >-
      Establishes the DCM/noncompaction overlap for TPM1 and attributes it to the same
      actin-binding defect.
  - reference: PMID:23147248
    reference_title: "A novel alpha-tropomyosin mutation associates with dilated and non-compaction cardiomyopathy and diminishes actin binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The youngest affected was diagnosed with dilated and non-compaction cardiomyopathy (NCCM) and died at the age of five."
    explanation: The index noncompaction case, showing both phenotypes in one individual.
- name: Congestive Heart Failure
  category: Cardiovascular
  description: >-
    Decompensated heart failure, the clinical syndrome the systolic dysfunction produces.
    In the D230N families it was the presenting problem in those who presented early in
    life, and the route to death or transplantation.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  notes: >-
    Graded FREQUENT rather than VERY_FREQUENT because the same cohort describes adults
    diagnosed on family screening with asymptomatic left ventricular dysfunction, who by
    definition were not in heart failure. The phenotype is age-dependent within the family.
  evidence:
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations ranged from decompensated heart failure or sudden death in those presenting early in life to asymptomatic left ventricular dysfunction in those diagnosed during adulthood."
    explanation: >-
      Both the presence of heart failure and the reason it is not graded universal - the
      same sentence gives the asymptomatic adult end of the range.
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presentation early in life, from infancy to adolescence, was not uncommon and was associated with severe, sometimes lethal outcomes, including SCD and refractory HF leading to death or transplantation."
    explanation: The severity of the heart failure when it occurs, and its endpoints.
genetic:
- name: TPM1
  notes: >-
    TPM1 encodes alpha-tropomyosin, a coiled-coil thin filament regulatory protein. The
    gene-disease validity is asymmetric between the two cardiomyopathies it causes:
    ClinGen classifies TPM1 as Definitive for hypertrophic cardiomyopathy but only
    Moderate for dilated cardiomyopathy. Two independent large reappraisals reach the same
    tier, one of them suggesting the TPM1 contribution to DCM may be concentrated in
    early-onset disease. Interpret a TPM1 variant reported in an adult DCM patient with
    that asymmetry in mind.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TPM1
    term:
      id: hgnc:12010
      label: TPM1
  evidence:
  - reference: CGGV:assertion_1173d239-23cf-4c9c-9ea5-f95d9356e6c7-2025-04-04T160000.000Z
    reference_title: "TPM1 / dilated cardiomyopathy (Moderate)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "TPM1 | HGNC:12010 | dilated cardiomyopathy | MONDO:0005021 | AD | Moderate"
    explanation: >-
      ClinGen's current gene-disease validity classification for TPM1 in dilated
      cardiomyopathy is Moderate, not Definitive. Graded PARTIAL because that is exactly
      what a moderate classification asserts - real but not fully established.
  - reference: CGGV:assertion_32e7ed58-ee49-4719-b48e-7fad58012319-2023-12-18T170000.000Z
    reference_title: "TPM1 / hypertrophic cardiomyopathy (Definitive)"
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: "TPM1 | HGNC:12010 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive"
    explanation: >-
      Graded NO_EVIDENCE deliberately. This assertion is about TPM1 in hypertrophic
      cardiomyopathy, a different disease, so it contributes nothing to the TPM1-DCM claim
      this record makes. It is retained because the contrast is the point - the same gene
      is Definitive for HCM and only Moderate for DCM - but a validity assertion for
      another disease must not be counted as support for this one.
  - reference: PMID:33947203
    reference_title: "Evidence-Based Assessment of Genes in Dilated Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven genes (14%; ACTC1, ACTN2, JPH2, NEXN, TNNI3, TPM1, VCL) including 2 additional ontologies were classified as moderate evidence; these genes are likely to emerge as strong or definitive with additional evidence."
    explanation: >-
      Independent expert-panel curation placing TPM1 in the moderate tier for DCM, with the
      panel's own expectation that it will strengthen.
  - reference: PMID:31983221
    reference_title: "Reevaluating the Genetic Contribution of Monogenic Dilated Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in MYH7, LMNA, BAG3, TNNT2, TNNC1, PLN, ACTC1, NEXN, TPM1, and VCL were significantly enriched in specific patient subsets, with the last 2 genes potentially contributing primarily to early-onset forms of DCM."
    explanation: >-
      Case-control burden analysis showing TPM1 enrichment is restricted to specific
      patient subsets rather than DCM at large.
  variants:
  - name: D230N
    description: >-
      The allele that defined this disease entity, identified by segregation in two large
      unrelated multigenerational families with severe, often early-onset DCM at 80%
      penetrance. It substitutes asparagine for aspartic acid at a solvent-exposed
      f-position residue near the C-terminus, losing a charge.
    evidence:
    - reference: PMID:20117437
      reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Unlike previously reported TPM1 variants (E45K E40K) associated with DCM in isolated individuals (7), we demonstrate that dominant transmission of TPM1 D230N segregates with disease and deleteriously impacts in vitro assays of contractility, providing definitive evidence that TPM1 mutations cause DCM."
      explanation: >-
        Identifies the founding allele and states what distinguishes it from the earlier
        single-patient TPM1 reports - dominant segregation, not just co-occurrence.
    - reference: PMID:20117437
      reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Presentation early in life, from infancy to adolescence, was not uncommon and was associated with severe, sometimes lethal outcomes, including SCD and refractory HF leading to death or transplantation."
      explanation: The clinical severity of the allele, from the study that ascertained the families.
  - name: D84N
    description: >-
      Causes dilated and non-compaction cardiomyopathy in a four-generation family, acting
      by weakening actin binding rather than by altering coiled-coil flexibility.
    evidence:
    - reference: PMID:23147248
      reference_title: "A novel alpha-tropomyosin mutation associates with dilated and non-compaction cardiomyopathy and diminishes actin binding."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We mapped the phenotype to chromosome 15 and subsequently identified a missense mutation in TPM1, resulting in a p.D84N amino acid substitution."
      explanation: Identification of the D84N allele by linkage and sequencing.
  - name: K30E
    description: >-
      A de novo allele in a proband with DCM and left ventricular non-compaction who
      reached terminal heart failure before four years of age. The only reported de novo
      TPM1 variant in this entry, and the clearest evidence that a single TPM1 substitution
      is sufficient to cause paediatric DCM without a transmitted family history.
    evidence:
    - reference: PMID:39684770
      reference_title: "Novel Mutation Lys30Glu in the TPM1 Gene Leads to Pediatric Left Ventricular Non-Compaction and Dilated Cardiomyopathy via Impairment of Structural and Functional Properties of Cardiac Tropomyosin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a novel de novo variant, c.88A>G (p.Lys30Glu, K30E), in the TPM1 gene encoding the major cardiac muscle tropomyosin (Tpm) isoform, Tpm1.1."
      explanation: Identifies the allele and establishes that it arose de novo.
    - reference: PMID:39684770
      reference_title: "Novel Mutation Lys30Glu in the TPM1 Gene Leads to Pediatric Left Ventricular Non-Compaction and Dilated Cardiomyopathy via Impairment of Structural and Functional Properties of Cardiac Tropomyosin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant was found in a proband with DCM and left ventricular non-compaction who progressed to terminal heart failure at the age of 3 years and 8 months."
      explanation: >-
        The clinical course, and the second TPM1 allele in this entry to combine dilated
        cardiomyopathy with non-compaction.
    - reference: PMID:39684770
      reference_title: "Novel Mutation Lys30Glu in the TPM1 Gene Leads to Pediatric Left Ventricular Non-Compaction and Dilated Cardiomyopathy via Impairment of Structural and Functional Properties of Cardiac Tropomyosin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The K30E substitution decreased the thermal stability of Tpm and its complex with actin and significantly reduced the sliding velocity of the regulated thin filaments over a surface covered by ovine cardiac myosin in an in vitro motility assay across the entire physiological range of Ca2+ concentration."
      explanation: >-
        Functional confirmation on the same two axes the D230N work uses - thermal
        stability of the coiled-coil and thin-filament sliding velocity - which is what
        makes the two alleles mechanistically comparable.
  - name: E114Q
    description: >-
      A heterozygous missense allele in exon 3, reported in a Chinese Han family with DCM.
      Curated as an allele-spectrum entry: the report establishes the substitution and the
      family, but performs no functional assay, so no mechanism is asserted for it.
    evidence:
    - reference: PMID:35029218
      reference_title: "Identification of a novel missense mutation in the TPM1 gene via exome sequencing in a Chinese family with dilated cardiomyopathy: A case report and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This novel heterozygous mutation results in the substitution of glutamic acid with glutamine (p.E114Q)."
      explanation: Identifies the allele and its zygosity.
    - reference: PMID:35029218
      reference_title: "Identification of a novel missense mutation in the TPM1 gene via exome sequencing in a Chinese family with dilated cardiomyopathy: A case report and literature review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A Chinese Han family with DCM phenotypes was examined."
      explanation: >-
        Graded PARTIAL - a single family with no segregation statistics or functional work,
        which is the level of evidence this allele currently rests on.
  - name: M8R
    description: >-
      A DCM-linked allele near the tropomyosin N-terminus, studied end to end from atomistic
      simulation through a Markov thin-filament model to human engineered heart tissue. It
      reaches the same hypocontractile endpoint as D230N by a different molecular route -
      by favouring the blocked state of tropomyosin on actin rather than by stiffening the
      overlap region.
    evidence:
    - reference: PMID:39282088
      reference_title: "In silico and in vitro models reveal the molecular mechanisms of hypocontractility caused by TPM1 M8R."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Atomistic simulations predict that M8R increases flexibility of the tropomyosin chain and enhances affinity for the blocked or inactive state of tropomyosin on actin."
      explanation: >-
        The predicted molecular mechanism. Note the direction is opposite to D230N, which
        decreases flexibility - so increased and decreased chain flexibility can both give
        a dilated phenotype, and flexibility alone is not the discriminator.
    - reference: PMID:39282088
      reference_title: "In silico and in vitro models reveal the molecular mechanisms of hypocontractility caused by TPM1 M8R."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutant tissues manifested depressed contractility and twitch duration that agreed in detail with model predictions."
      explanation: >-
        Experimental confirmation in human engineered heart tissue, which is what lifts this
        above a purely computational claim.
  - name: E40K and E45K
    description: >-
      The earliest reported TPM1 alleles associated with dilated cardiomyopathy, found in
      isolated individuals rather than in segregating families. Curated to record why TPM1
      pathogenicity in DCM was considered unproven until D230N: the alleles existed, but
      without transmission data.
    evidence:
    - reference: PMID:20117437
      reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Unlike previously reported TPM1 variants (E45K E40K) associated with DCM in isolated individuals (7), we demonstrate that dominant transmission of TPM1 D230N segregates with disease and deleteriously impacts in vitro assays of contractility, providing definitive evidence that TPM1 mutations cause DCM."
      explanation: >-
        Graded PARTIAL because the sentence names these alleles in order to say their
        evidence was weaker - association in single individuals without segregation.
  - name: E54K
    description: >-
      A DCM-associated allele used as the comparator against the HCM allele E62Q in
      mechanistic work. Modelled as acting through long-range allosteric change in the
      association of the troponin I mobile domain with tropomyosin/actin.
    evidence:
    - reference: PMID:39436707
      reference_title: "Distinct mechanisms drive divergent phenotypes in hypertrophic and dilated cardiomyopathy-associated TPM1 variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the E54K mutation appeared to act via long-range allosteric interactions to increase the association rate of the C-terminal troponin I mobile domain to tropomyosin/actin"
      explanation: The proposed molecular mechanism distinguishing this DCM allele from the paired HCM allele.
treatments:
- name: Heart Failure Pharmacotherapy
  description: >-
    Standard heart-failure medical therapy, ACE inhibition in particular. It is not
    directed at the tropomyosin lesion and does not correct it, but in these families it
    was followed by recovery of ejection fraction in individual carriers, including one
    whose function improved from 39% to 55% on starting an ACE inhibitor.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
  evidence:
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After an uncomplicated pregnancy, II-4 had mild further decline in LVEF from 48% to 39%, improving to 55% with institution of an ACE inhibitor."
    explanation: >-
      A measured before-and-after in a carrier of the founding allele. Single-patient
      evidence, which is why the treatment is described as followed by recovery rather
      than as shown to cause it.
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac studies revealed ventricular tachycardia and DCM (LVEF 25%) which improved with medical management."
    explanation: >-
      Graded PARTIAL - improvement on unspecified medical management in one further
      carrier, with no agent named.
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, although early presentation with DCM was typically severe, there was potential for remarkable improvement, as 3 of 5 affected infants with the TPM1 mutation had striking recovery of LV function."
    explanation: >-
      Graded PARTIAL and included as a caution rather than as efficacy evidence. Infants
      with this allele can recover spontaneously, so an uncontrolled series cannot
      separate treatment effect from natural history.
- name: Heart Transplantation
  description: >-
    The endpoint for carriers whose heart failure becomes refractory. In these families it
    was reached in adolescence by a carrier who had been asymptomatic at diagnosis, which
    is the clearest statement of how fast the phenotype can move.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  evidence:
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IV-1 was asymptomatic when diagnosed with DCM at 7 years during family screening, but developed severe HF at age 17 and underwent transplant at 18 years of age."
    explanation: >-
      Documents transplantation in a carrier, and the decade-long interval between
      screen-detected asymptomatic disease and transplant.
- name: Cascade Screening of At-Risk Relatives
  description: >-
    Cardiac surveillance of first-degree relatives, with genetic testing where the familial
    variant is known. This is the intervention with the clearest rationale in TPM1-DCM: the
    phenotype is 80% penetrant, adults are often asymptomatic when detected, and the one
    carrier in these families whose course is documented from asymptomatic diagnosis
    onwards was found by family screening.
  therapeutic_modality: OTHER
  treatment_term:

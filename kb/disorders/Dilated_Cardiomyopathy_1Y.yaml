animal_models:
- name: D230N-Tm transgenic mouse
  species: Mouse
  genotype: Heterozygous alpha-tropomyosin D230N transgenic (alpha-MHC promoter)
  publication: PMID:28600229
  description: >-
    A transgenic mouse carrying the human D230N tropomyosin allele under an
    alpha-myosin-heavy-chain promoter, developed specifically to phenocopy the early-onset
    remodelling seen in the D230N families and to permit paired cellular and structural
    measurements in the same model.
  genes:
  - preferred_term: TPM1
    term:
      id: hgnc:12010
      label: TPM1
  modeled_mechanisms:
  - target: Systolic Dysfunction and Ventricular Dilation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the early-onset systolic dysfunction of the human D230N families, with
      significant impairment by two months of age.
    limitations: >-
      A transgenic overexpression model driven by the alpha-MHC promoter rather than a
      knock-in at the endogenous locus, so the mutant-to-wild-type protein ratio is set by
      transgene expression rather than by heterozygosity. Since the mechanism turns on the
      biophysical properties of a coiled-coil that must dimerise and interdigitate,
      stoichiometry is not a neutral detail here.
    readouts:
    - name: Left ventricular systolic function by echocardiography
      target: Systolic Dysfunction and Ventricular Dilation
      direction: DECREASED
      interpretation: Early-onset systolic dysfunction matching the human phenotype.
      evidence:
      - reference: PMID:28600229
        reference_title: "The structural basis of alpha-tropomyosin linked (Asp230Asn) familial dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The resultant mouse model strongly phenocopied the early onset of cardiomyopathic remodeling observed in patients as significant systolic dysfunction was observed by 2months of age."
        explanation: The echocardiographic finding and its timing.
    evidence:
    - reference: PMID:28600229
      reference_title: "The structural basis of alpha-tropomyosin linked (Asp230Asn) familial dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To determine how a single amino acid mutation in α-tropomyosin (Tm) can lead to a highly penetrant DCM we generated a novel transgenic mouse model carrying the D230N mutation."
      explanation: States the model's purpose and construction.
  - target: Decreased Myofilament Calcium Sensitivity
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Isolated myocytes from the model were used to measure calcium handling and myofilament
      activation, giving the reduced calcium sensitivity and raised transient amplitude.
    limitations: >-
      The authors judged these measurements to comprise complex inputs and to lack
      sufficient experimental resolution, which is why they turned to structural methods.
      The readout is directionally informative but should not be treated as a precise
      quantification of the myofilament defect.
    readouts:
    - name: Calcium sensitivity of sliding velocity
      target: Decreased Myofilament Calcium Sensitivity
      direction: DECREASED
      interpretation: Reduced thin-filament responsiveness to calcium in the mutant.
      evidence:
      - reference: PMID:28600229
        reference_title: "The structural basis of alpha-tropomyosin linked (Asp230Asn) familial dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "D230N-Tm filaments exhibited a reduced Ca2+ sensitivity of sliding velocity."
        explanation: The in vitro motility measurement.
    evidence:
    - reference: PMID:28600229
      reference_title: "The structural basis of alpha-tropomyosin linked (Asp230Asn) familial dilated cardiomyopathy."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "we examined the effect of the mutation on Ca2+ handling in isolated myocytes and myofilament activation in vitro"
      explanation: >-
        Establishes what the model was used to measure. Graded PARTIAL given the authors'
        own stated reservation about the resolution of these measurements.
discussions:
- discussion_id: tpm1_dcm_gene_validity_asymmetry
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is TPM1-DCM a distinct disease entity, or is the moderate ClinGen classification
    telling us that some reported TPM1 DCM variants will not survive re-curation?
  attaches_to:
  - genetic#TPM1
  - disease#Dilated Cardiomyopathy 1Y
  rationale: >-
    The evidence here is genuinely split and a curator should not paper over it. On one
    side, two large multigenerational families with linkage, 80% penetrance, a transgenic
    mouse that phenocopies the early-onset disease, and a coherent biophysical mechanism -
    that is a strong case for D230N specifically. On the other, ClinGen rates TPM1-DCM
    Moderate while rating TPM1-HCM Definitive, an expert panel places it in the moderate
    tier, and a case-control burden study finds enrichment only in specific patient
    subsets, possibly confined to early-onset disease. The likeliest reconciliation is that
    a small number of well-supported alleles are genuinely causative while the gene as a
    whole has been over-called in adult DCM panels, which would predict that a variant-level
    rather than gene-level re-curation resolves the discrepancy. Practically, this matters
    for how much weight a TPM1 variant of uncertain significance should carry in an adult
    DCM workup.
  evidence:
  - reference: CGGV:assertion_1173d239-23cf-4c9c-9ea5-f95d9356e6c7-2025-04-04T160000.000Z
    reference_title: "TPM1 / dilated cardiomyopathy (Moderate)"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "TPM1 | HGNC:12010 | dilated cardiomyopathy | MONDO:0005021 | AD | Moderate"
    explanation: The current ClinGen classification, which is the substance of the gap.
  - reference: PMID:31983221
    reference_title: "Reevaluating the Genetic Contribution of Monogenic Dilated Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in MYH7, LMNA, BAG3, TNNT2, TNNC1, PLN, ACTC1, NEXN, TPM1, and VCL were significantly enriched in specific patient subsets, with the last 2 genes potentially contributing primarily to early-onset forms of DCM."
    explanation: >-
      The subset-restricted enrichment that supports a narrower, early-onset role rather
      than a general adult DCM gene.
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike previously reported TPM1 variants (E45K E40K) associated with DCM in isolated individuals (7), we demonstrate that dominant transmission of TPM1 D230N segregates with disease and deleteriously impacts in vitro assays of contractility, providing definitive evidence that TPM1 mutations cause DCM."
    explanation: >-
      The counterweight - allele-level evidence for D230N is strong, which is why the gap
      is about gene-level over-calling rather than about whether TPM1-DCM exists.
- discussion_id: tpm1_pseudophosphorylation_rescue
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can tropomyosin pseudo-phosphorylation rescue TPM1 cardiomyopathy mutations in a whole
    heart, given that the same modification is itself cardiomyopathic when overexpressed?
  attaches_to:
  - pathophysiology#Altered Tropomyosin Flexibility and Actin Binding
  rationale: >-
    Two results sit awkwardly together. In vitro, the phosphomimetic substitutions S283D
    and S61D reduce or eliminate the abnormal actin affinity caused by cardiomyopathy
    mutations, which the authors propose as a rescue strategy. But a transgenic mouse
    highly expressing the S283D phosphomimetic develops severe dilated cardiomyopathy and
    dies within a month, and even moderate expression causes myocyte hypertrophy and
    fibrosis with impaired diastolic function. So the modification that normalises a
    biophysical parameter in a test tube is itself pathogenic in a heart at high dose.
    The unresolved question is whether there is a therapeutic window - a level of
    phosphorylation high enough to correct the mutant filament but below the threshold at
    which it causes disease on its own - or whether the in vitro rescue simply does not
    translate. Notably the mouse showed no change in myofilament calcium sensitivity, so
    the actin-affinity correction and the whole-heart phenotype may not be connected at
    all.
  evidence:
  - reference: PMID:33129908
    reference_title: "Tropomyosin pseudo-phosphorylation can rescue the effects of cardiomyopathy-associated mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results indicate that Tpm pseudo-phosphorylation by mutations S283D or S61D can rescue the effects of mutations in the TPM1 gene encoding a cardiac isoform of Tpm that lead to the development of such severe inherited heart diseases as hypertrophic or dilated cardiomyopathies."
    explanation: The in vitro rescue claim.
  - reference: PMID:30567734
    reference_title: "Tropomyosin pseudo-phosphorylation results in dilated cardiomyopathy."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "High expression of Tpm S283D variant in one transgenic mouse line resulted in an increased heart:body weight ratio, coupled with a severe dilated cardiomyopathic phenotype resulting in death within 1 month of birth."
    explanation: >-
      Graded REFUTE against the rescue proposal as a therapeutic strategy - the same
      modification causes lethal DCM in vivo at high expression.
  - reference: PMID:30567734
    reference_title: "Tropomyosin pseudo-phosphorylation results in dilated cardiomyopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Surprisingly, we observed no alterations in calcium sensitivity of the myofibers, cooperativity, or calcium-ATPase activity in the myofibers."
    explanation: >-
      Shows the in vivo phenotype is not mediated by the calcium-sensitivity axis, which
      weakens the link between the in vitro actin-affinity correction and any whole-heart
      benefit.

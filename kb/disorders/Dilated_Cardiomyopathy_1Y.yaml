    Rare genetic subtype of dilated cardiomyopathy: roughly thirty DCM-associated TPM1 variants have been
    reported across published families and cohorts, and sequencing of 334 DCM probands identified segregating TPM1 D230N
    disease in 2 unrelated families (2/334, ~0.6% derived from that cohort).

    treatment_effect: MODULATES
    description: Neurohormonal afterload reduction supports recovery of left ventricular ejection fraction without correcting the primary sarcomeric tropomyosin defect.
    evidence:
    - reference: PMID:20117437
      reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After an uncomplicated pregnancy, II-4 had mild further decline in LVEF from 48% to 39%, improving to 55% with institution of an ACE inhibitor."
      explanation: Documents improvement of left ventricular ejection fraction following institution of ACE-inhibitor therapy in a TPM1 D230N carrier.
  evidence:
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After an uncomplicated pregnancy, II-4 had mild further decline in LVEF from 48% to 39%, improving to 55% with institution of an ACE inhibitor."
    explanation: >-
      A measured before-and-after in a carrier of the founding allele. Single-patient
      evidence, which is why the treatment is described as followed by recovery rather
      than as shown to cause it.
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac studies revealed ventricular tachycardia and DCM (LVEF 25%) which improved with medical management."
    explanation: >-
      Improvement on unspecified medical heart-failure management in an additional TPM1
      carrier without naming individual drugs.
  - reference: PMID:20117437
    reference_title: "Familial dilated cardiomyopathy caused by an alpha-tropomyosin mutation: the distinctive natural history of sarcomeric dilated cardiomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, although early presentation with DCM was typically severe, there was potential for remarkable improvement, as 3 of 5 affected infants with the TPM1 mutation had striking recovery of LV function."
    explanation: >-
      Included as an interpretive caution: infants with TPM1 D230N can show substantial
      recovery of left ventricular function, so uncontrolled case observations cannot
      cleanly separate drug effect from natural history.
- name: Heart Transplantation
  description: >-
    The endpoint for carriers whose heart failure becomes refractory. In these families it
    was reached in adolescence by a carrier who had been asymptomatic at diagnosis, which
    is the clearest statement of how fast the phenotype can move.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_phenotypes:

  results: Heterozygous pathogenic or likely pathogenic missense variant in TPM1, interpreted alongside family segregation given Moderate gene-level validity.
  evidence:
  - reference: PMID:35029218
    reference_title: "Identification of a novel missense mutation in the TPM1 gene via exome sequencing in a Chinese family with dilated cardiomyopathy: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next-generation sequencing (NGS) of DNA samples was performed to detect the gene mutation in the proband, which was confirmed by Sanger sequencing."
    explanation: Next-generation sequencing with Sanger confirmation used to establish the molecular diagnosis of DCM1Y.
treatments:
- name: Heart Failure Pharmacotherapy
  description: >-
    Standard heart-failure medical therapy, ACE inhibition in particular. It is not
    directed at the tropomyosin lesion and does not correct it, but in these families it
    was followed by recovery of ejection fraction in individual carriers, including one
    whose function improved from 39% to 55% on starting an ACE inhibitor.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  - preferred_term: Reduced left ventricular ejection fraction
    term:
      id: HP:0012664
      label: Reduced left ventricular ejection fraction
  target_mechanisms:

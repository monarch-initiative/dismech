name: Dilated Cardiomyopathy 1Y
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- CMD1Y
- TPM1-related dilated cardiomyopathy
- Alpha-tropomyosin-related dilated cardiomyopathy
- Cardiomyopathy, dilated, 1Y
description: >-
  Dilated cardiomyopathy 1Y is the TPM1-related form of familial dilated cardiomyopathy.
  TPM1 encodes alpha-tropomyosin, the coiled-coil dimer that lies in the actin groove and
  acts as the gatekeeper of cross-bridge formation. Each dimer interdigitates head-to-tail
  with the next, so the thin filament is a continuous flexible cable whose azimuthal
  position - blocked, closed or open - sets whether myosin can engage actin as calcium
  rises.

  The point worth understanding is that TPM1 causes both hypertrophic and dilated
  cardiomyopathy, and the direction of the calcium-sensitivity change is what separates
  them. HCM mutations increase myofilament calcium sensitivity; DCM mutations in general
  decrease it, and additionally uncouple the effect of troponin phosphorylation on calcium
  responsiveness. This is not a difference of degree along one axis: recent work on the
  paired variants E62Q (HCM) and E54K (DCM) attributes them to different molecular events -
  reduced tropomyosin stiffness favouring the closed state in the HCM variant, versus a
  long-range allosteric change in troponin I mobile-domain association in the DCM variant.

  A curator should also know that the gene-disease validity is asymmetric. ClinGen
  classifies TPM1 for hypertrophic cardiomyopathy as Definitive but for dilated
  cardiomyopathy only as Moderate, and two independent large reappraisals of DCM gene
  validity place TPM1 in the moderate rather than definitive tier, with a suggestion that
  its contribution is concentrated in early-onset disease. TPM1-DCM is real but is not on
  the same evidential footing as LMNA or TTN.

  Phenotype extends beyond dilation. The D84N allele causes dilated and non-compaction
  cardiomyopathy in the same family, with a child diagnosed at five months who died at
  five, and MONDO lists left ventricular noncompaction among this term's parents.

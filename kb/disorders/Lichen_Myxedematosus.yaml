name: Lichen Myxedematosus
category: Acquired
creation_date: '2026-09-08T09:45:00Z'
synonyms:
- LM
- papular mucinosis
- scleromyxedema
- Arndt-Gottron syndrome
description: >-
  Lichen myxedematosus is an idiopathic primary cutaneous mucinosis in which
  dermal fibroblasts deposit excess mucin — glycosaminoglycans, chiefly
  hyaluronic acid — alongside variable fibroblast proliferation and fibrosis, in
  a patient whose thyroid function is normal. That last clause is definitional
  and is what separates it from generalised and pretibial myxedema.

  The term is an umbrella, and the split that matters clinically is between a
  generalised papular and sclerodermoid form — scleromyxedema — and a group of
  localised forms. Scleromyxedema requires all four of: generalised papular and
  sclerodermoid eruption; mucin deposition with fibroblast proliferation and
  fibrosis; monoclonal gammopathy; and absence of thyroid disease. It runs a
  chronic, unpredictable course with extracutaneous neurologic, rheumatologic and
  cardiac involvement, and it kills. The localised forms lack both the
  gammopathy and the systemic disease and do not run a disabling course.

  The monoclonal gammopathy is where the mechanism is most often over-stated. It
  is a diagnostic criterion of scleromyxedema and is present in the large
  majority of patients, but the same classification that requires it also
  recognises scleromyxedema occurring without it, and paraprotein-negative cases
  with entirely typical histology are reported. So the gammopathy is a strong,
  near-constant association that is nonetheless not necessary — which is a
  different claim from it being the effector, and this entry does not assert the
  stronger one.
disease_term:
  preferred_term: lichen myxedematosus
  term:
    id: MONDO:0018432
    label: lichen myxedematosus
parents:
- Cutaneous Mucinosis
- Skin Disease
notes: >-
  Curated as one Disease with has_subtypes rather than split into separate
  entries, because the generalised and localised forms share the defining
  pathograph — fibroblast-driven dermal mucin deposition without thyroid disease
  — and are distinguished by extent, paraproteinaemia and systemic involvement
  rather than by a different mechanism. A reviewer who thinks the localised forms
  make no shared mechanistic claim at all should push back on that; the case for
  splitting would rest on the localised forms having a different trigger, which
  the cited sources do not establish either way.

  The dermato-neuro syndrome is recorded as a phenotype and as a knowledge gap
  rather than as a mechanism, because none of the sources cited here proposes
  one.
has_subtypes:
- name: Scleromyxedema
  display_name: Scleromyxedema (generalised papular and sclerodermoid form)
  description: >-
    The generalised form, requiring all four diagnostic criteria including
    monoclonal gammopathy and absent thyroid disease. Carries the systemic
    manifestations and the mortality.
  evidence:
  - reference: PMID:11174386
    reference_title: "Updated classification of papular mucinosis, lichen myxedematosus, and scleromyxedema."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Diagnosis of scleromyxedema should fulfill the following criteria: (1) generalized papular and sclerodermoid eruption; (2) mucin deposition, fibroblast proliferation, and fibrosis; (3) monoclonal gammopathy; and (4) the absence of thyroid disease.
    explanation: The operative diagnostic criteria for this subtype.
- name: Localized LM
  display_name: Localized lichen myxedematosus
  description: >-
    Papular or nodular eruption with mucin deposition, without monoclonal
    gammopathy and without thyroid disease. Subdivided into five subtypes:
    discrete papular, acral persistent papular mucinosis, self-healing papular
    mucinosis, papular mucinosis of infancy, and nodular.
  evidence:
  - reference: PMID:11174386
    reference_title: "Updated classification of papular mucinosis, lichen myxedematosus, and scleromyxedema."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The criteria for localized LM are as follows: (1) papular or nodular/plaque eruption; (2) mucin deposition with variable fibroblast proliferation; and (3) the absence of both monoclonal gammopathy and thyroid disease.
    explanation: The criteria that define this subtype negatively against scleromyxedema.
  - reference: PMID:11174386
    reference_title: "Updated classification of papular mucinosis, lichen myxedematosus, and scleromyxedema."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The localized form is subdivided into 5 subtypes: (1) a discrete papular form involving any site; (2) acral persistent papular mucinosis involving only the extensor surface of the hands and wrists; (3) self-healing papular mucinosis, of a juvenile and an adult type; (4) papular mucinosis of infancy, a pediatric variant of the discrete form or of acral persistent papular mucinosis; and (5) nodular form.
    explanation: Enumerates the five recognised localised subtypes.
- name: Atypical LM
  display_name: Atypical or intermediate forms
  description: >-
    Cases meeting the criteria for neither category — including scleromyxedema
    without monoclonal gammopathy, and localised disease that nonetheless carries
    a gammopathy or systemic symptoms. This subtype is the reason the
    paraprotein cannot be treated as the mechanism.
  evidence:
  - reference: PMID:11174386
    reference_title: "Updated classification of papular mucinosis, lichen myxedematosus, and scleromyxedema."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      A third group of atypical or intermediate forms, not meeting the criteria for either scleromyxedema or the localized form, includes cases of (1) scleromyxedema without monoclonal gammopathy, (2) localized forms with monoclonal gammopathy and/or systemic symptoms, (3) localized forms with mixed features of the 5 subtypes, and (4) not well-specified cases.
    explanation: >-
      Explicitly recognises scleromyxedema without gammopathy, which is the
      classification's own evidence that the paraprotein is not necessary.
pathophysiology:
- name: Plasma Cell Clone and Monoclonal Gammopathy
  biological_scale: CELLULAR
  description: >-
    A clonal plasma cell population producing a single immunoglobulin species,
    predominantly IgG. It is present in the large majority of scleromyxedema
    patients and is one of the four diagnostic criteria — but see the knowledge
    gap: the classification itself recognises scleromyxedema without it, so this
    node is an upstream association whose causal contribution is unresolved.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  downstream:
  - target: Dermal Fibroblast Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Deliberately typed as having unknown intermediates. Patient serum
      stimulates fibroblasts, but which serum factor does so is not established,
      and the paraprotein is neither necessary (paraprotein-negative
      scleromyxedema exists) nor sufficient (most people with IgG monoclonal
      gammopathy never develop mucinosis).
  evidence:
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monoclonal gammopathy was detected in 27 patients."
    explanation: >-
      Quantifies the association in the largest multicentre series — and note it
      is 27 of 30, not 30 of 30.
  - reference: PMID:9816405
    reference_title: "[Significance of histopathologic analysis of skin lesions in scleromyxedema. Light microscopy, electron microscopy, immunohistochemistry and immunofluorescence microscopy]."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the patient with SM in which abnormal serum paraprotein was not identified, the skin biopsy showed mucinous material in the dermis and proliferation of fibroblasts accompanied by mild dermal sclerosis.
    explanation: >-
      Refutes the paraprotein being necessary for the dermal lesion: typical
      mucin deposition and fibroblast proliferation in a paraprotein-negative
      patient.
- name: Dermal Fibroblast Activation
  biological_scale: CELLULAR
  description: >-
    Dermal fibroblasts proliferate and increase synthesis of glycosaminoglycans.
    This is the effector step and the one common to every form of the disease,
    generalised or localised, with or without a gammopathy.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: fibroblast proliferation
    modifier: INCREASED
    term:
      id: GO:0048144
      label: fibroblast proliferation
  - preferred_term: glycosaminoglycan biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006024
      label: glycosaminoglycan biosynthetic process
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Dermal Mucin Deposition and Fibrosis
    causal_link_type: DIRECT
    description: >-
      Increased glycosaminoglycan output plus collagen deposition produces the
      mucinous, sclerotic dermis.
  evidence:
  - reference: PMID:11174386
    reference_title: "Updated classification of papular mucinosis, lichen myxedematosus, and scleromyxedema."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      LM includes two clinicopathologic subsets: a generalized papular and sclerodermoid form (also called scleromyxedema) and a localized papular form.
    explanation: >-
      Establishes that both subsets are one clinicopathologic entity, which is
      what makes this a shared node rather than a subtype-specific one.
- name: Dermal Mucin Deposition and Fibrosis
  biological_scale: TISSUE
  description: >-
    Accumulation of mucin in the dermis with variable fibrosis. Mucin here is a
    gelatinous glycosaminoglycan material, chiefly hyaluronic acid and dermatan
    sulfate, demonstrable histologically with alcian blue or colloidal iron —
    which is why the diagnosis is made on a stained biopsy rather than on
    routine sections.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Papular and sclerodermoid eruption
    causal_link_type: DIRECT
    description: >-
      Mucin and fibrosis in the dermis produce the waxy papules and the
      induration that gives the sclerodermoid appearance.
  evidence:
  - reference: PMID:8668693
    reference_title: "[Cutaneous mucinoses]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Mucin is a gelatinous substance composed of glycosaminoglycanes, especially hyaluronic acid and dermatan sulfate bound to small quantities of chondoitin sulfate and heparin sulfate.
    explanation: >-
      Defines the deposited material. Note the source's own spelling of
      "glycosaminoglycanes" and "chondoitin" is reproduced exactly, as an
      evidence snippet must be.
  - reference: PMID:8668693
    reference_title: "[Cutaneous mucinoses]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Histologically, mucin is recognized after special staining techniques using alcian blue and colloidal iron.
    explanation: >-
      Records how the deposit is demonstrated, which is what makes the
      histological criterion operational.
- name: Extracutaneous Organ Involvement
  biological_scale: ORGANISM
  description: >-
    Systemic disease occurred in 19 of 30 patients in the multicentre series —
    neurologic in 30%, rheumatologic in 23.3%, cardiac in 20%. It is a feature of
    the generalised form and is what converts a skin disease into a lethal one.
    Whether the systemic lesions share the dermal mechanism is not established by
    the cited sources.
  evidence:
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extracutaneous manifestations were present in 19 patients including neurologic (30%), rheumatologic (23.3%), and cardiac (20%) manifestations.
    explanation: Quantifies the systemic burden by organ system.
phenotypes:
- category: Dermatologic
  name: Papular and sclerodermoid eruption
  description: >-
    Waxy papules on an indurated, sclerodermoid background. Generalised in
    scleromyxedema; papular, nodular or plaque-form and regionally confined in
    localised LM.
  phenotype_term:
    preferred_term: Papule
    term:
      id: HP:0200034
      label: Papule
  diagnostic: true
  reports_on:
  - target: Dermal Mucin Deposition and Fibrosis
    relationship: READOUT_OF
  evidence:
  - reference: PMID:11174386
    reference_title: "Updated classification of papular mucinosis, lichen myxedematosus, and scleromyxedema."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Diagnosis of scleromyxedema should fulfill the following criteria: (1) generalized papular and sclerodermoid eruption; (2) mucin deposition, fibroblast proliferation, and fibrosis; (3) monoclonal gammopathy; and (4) the absence of thyroid disease.
    explanation: The eruption is the first diagnostic criterion.
- category: Dermatologic
  name: Thickened indurated skin
  description: The sclerodermoid induration that makes scleroderma the main differential.
  phenotype_term:
    preferred_term: Thickened skin
    term:
      id: HP:0001072
      label: Thickened skin
  subtype: Scleromyxedema
  evidence:
  - reference: PMID:9816405
    reference_title: "[Significance of histopathologic analysis of skin lesions in scleromyxedema. Light microscopy, electron microscopy, immunohistochemistry and immunofluorescence microscopy]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scleromyxedema (SM) may be considered as a possible disease entity in the differential diagnosis of scleroderma.
    explanation: >-
      States the differential the induration creates, which is the practical
      reason this phenotype is recorded separately from the papules.
- category: Dermatologic
  name: Skin nodules
  description: >-
    The nodular subtype of localised LM presents with mucinous nodules and
    little or no papular eruption.
  phenotype_term:
    preferred_term: Skin nodule
    term:
      id: HP:0200036
      label: Skin nodule
  subtype: Localized LM
  evidence:
  - reference: PMID:11174386
    reference_title: "Updated classification of papular mucinosis, lichen myxedematosus, and scleromyxedema."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      The criteria for localized LM are as follows: (1) papular or nodular/plaque eruption; (2) mucin deposition with variable fibroblast proliferation; and (3) the absence of both monoclonal gammopathy and thyroid disease.
    explanation: Includes the nodular presentation among the localised criteria.
- category: Neurologic
  name: Dermato-neuro syndrome
  description: >-
    An acute encephalopathy with fever, seizures and coma occurring in
    scleromyxedema. It is the disease's characteristic lethal complication — two
    of the five deaths in the multicentre series — and no mechanism has been
    proposed for it in the sources cited here.
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
    temporality: ACUTE
  subtype: Scleromyxedema
  evidence:
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five patients died: 2 with dermatoneuro syndrome and 1 each with myeloid leukemia, Hodgkin lymphoma, and myocardial insufficiency.
    explanation: >-
      Establishes the syndrome as a cause of death and gives its share of the
      mortality in the series.
prevalence:
- population: Multicentre scleromyxedema series
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate is available. The largest reported series is 30 patients
    assembled across multiple centres, which is itself the measure of how rare
    the disease is.
  evidence:
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 30 patients with scleromyxedema (17 men and 13 women). The mean age at diagnosis was 59 years.
    explanation: >-
      Gives the size, sex distribution and age of the largest assembled cohort.
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Its prognostic and therapeutic features are poorly documented because most reports deal with single cases or small series.
    explanation: >-
      States the evidence-base limitation that shapes everything else in this
      entry.
progression:
- phase: Onset to diagnosis
  notes: >-
    Diagnosis follows onset by about nine months on average, in patients whose
    mean age is 59.
  evidence:
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean delay between disease onset and diagnosis was 9 months.
    explanation: Quantifies the diagnostic delay.
- phase: Chronic course
  notes: >-
    Chronic and unpredictable, with a guarded prognosis. Of 21 patients followed
    a mean 33.5 months, 16 were alive and 12 of those still had skin disease;
    five died.
  evidence:
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all, 21 patients were followed up for a mean period of 33.5 months, at which time 16 patients were alive, 12 with and 4 without skin disease.
    explanation: Gives the outcome distribution at follow-up.
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study confirms that scleromyxedema is a chronic and unpredictable disease with severe systemic manifestations leading to a guarded prognosis.
    explanation: The series' own summary of the natural history.
treatments:
- name: Intravenous immunoglobulin
  description: >-
    First-line therapy for scleromyxedema. In the multicentre series IVIg, alone
    or combined, produced complete remission in 4 and partial remission in 9 of
    30 patients over a mean two years of treatment. The response is not
    permanent and maintenance infusions are required.
  treatment_term:
    preferred_term: Intravenous Immunoglobulin Therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Dermal Fibroblast Activation
    description: >-
      Presumed to act by removing or neutralising the circulating factor that
      drives fibroblast activation. Which factor that is has not been
      established, so this link is inferred from therapeutic response rather
      than demonstrated.
    evidence:
    - reference: PMID:23453242
      reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although corticosteroids were ineffective, intravenous immunoglobulins (alone or in combination with other drugs) induced complete remission in 4 and partial remission in 9 patients with a mean treatment duration of 2 years.
      explanation: >-
        Therapeutic response cited as evidence for the mechanism it targets, so
        graded INDIRECT: the study shows IVIg works, not how, and the
        uncontrolled design does not isolate IVIg from the combination therapy.
  evidence:
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data support the contention that intravenous immunoglobulin is a relatively effective and safe treatment. The response is not permanent and maintenance infusions are required.
    explanation: >-
      States both the efficacy claim and its limitation, from the study that
      makes it.
- name: Systemic corticosteroids
  description: >-
    Commonly used and reported ineffective in the multicentre series. Recorded so
    the negative result is queryable rather than only the positive one.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:23453242
    reference_title: "Scleromyxedema: a multicenter study of characteristics, comorbidities, course, and therapy in 30 patients."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although corticosteroids were ineffective, intravenous immunoglobulins (alone or in combination with other drugs) induced complete remission in 4 and partial remission in 9 patients with a mean treatment duration of 2 years.
    explanation: >-
      REFUTE against the claim that corticosteroids treat this disease. Same
      quoted sentence as the IVIg item, graded the same evidence_source; only
      `supports` differs, because the sentence cuts opposite ways for the two
      claims.
discussions:
- discussion_id: paraprotein_not_the_effector
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Plasma Cell Clone and Monoclonal Gammopathy
  prompt: >-
    What circulating factor drives fibroblast activation in lichen myxedematosus,
    given that the monoclonal paraprotein is neither necessary nor sufficient?
  rationale: >-
    Monoclonal gammopathy is one of the four diagnostic criteria for
    scleromyxedema and is present in 27 of 30 patients in the largest series, so
    it is easy to state as the cause — and secondary sources routinely do. Two
    things block that. The classification that defines the disease explicitly
    recognises an atypical category of scleromyxedema *without* monoclonal
    gammopathy, and a paraprotein-negative patient is reported with entirely
    typical mucin deposition and fibroblast proliferation on biopsy, so it is not
    necessary. And monoclonal gammopathy of undetermined significance is common
    while this disease is vanishingly rare, so it is not sufficient. The edge from
    the plasma cell clone to fibroblast activation is therefore typed
    INDIRECT_UNKNOWN_INTERMEDIATES. Identifying the actual mediator would change
    treatment, which is currently aimed at the immunoglobulin compartment on the
    strength of an unexplained response.
- discussion_id: dermatoneuro_syndrome_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Dermato-neuro syndrome
  prompt: >-
    What causes the acute encephalopathy of dermato-neuro syndrome?
  rationale: >-
    It is the characteristic way this disease kills — two of five deaths in the
    largest series — and it has no proposed mechanism in any source cited here.
    The brain shows no mucin deposition corresponding to the skin lesion, so the
    obvious extrapolation from the dermal pathology does not work, and nothing
    else has been established. It is recorded as a phenotype with a stated
    mechanism gap rather than being attached to a speculative pathophysiology
    node.
- discussion_id: localized_forms_shared_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - has_subtypes#Localized LM
  prompt: >-
    Do the localised forms share a trigger with scleromyxedema, or only a final
    histological pathway?
  rationale: >-
    This entry lumps the generalised and localised forms as one disease with
    subtypes, on the grounds that both are fibroblast-driven dermal mucin
    deposition in a euthyroid patient. But the localised forms lack the
    gammopathy, lack systemic disease, and some resolve spontaneously — and no
    cited source identifies what initiates them. If they turn out to have a
    distinct trigger, the lump/split call made here should be revisited and they
    may warrant separate entries. Flagged so the decision is auditable rather
    than silent.

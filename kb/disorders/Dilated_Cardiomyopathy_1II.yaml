      finding rather than evaluating a surveillance programme.
animal_models:
- name: CryAB R120G cardiomyocyte-targeted transgenic mouse
  species: Mouse
  genotype: Cardiomyocyte-restricted transgenic overexpression of CryAB p.Arg120Gly
  publication: PMID:11440982
  description: >-
    The reference model of cardiac alpha-B crystallinopathy. It is included here
    because it is the only in vivo evidence for the aggregation route, and it is
    explicitly NOT a model of CMD1II: the allele causes desmin-related myopathy
    rather than isolated dilated cardiomyopathy, the phenotype reported is
    hypertrophic rather than dilated, and the effect is dose-dependent on a
    transgene rather than produced at endogenous expression.
  modeled_mechanisms:
  - target: Alpha-B Crystallin and Desmin Aggregate Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces alpha-B crystallin and desmin aggregation with desmin filament
      disruption and myofibrillar misalignment in cardiomyocytes in vivo.
    limitations: >-
      p.Arg120Gly is a desmin-related myopathy allele and is not a reported cause
      of isolated dilated cardiomyopathy, and the phenotype is produced by
      transgenic overexpression, with a high-expressing line reaching 100%
      mortality by early adulthood. Severity is therefore an expression artefact
      as much as an allele effect.
    readouts:
    - name: Cardiomyocyte desmin filament integrity and myofibril alignment
      target: Alpha-B Crystallin and Desmin Aggregate Accumulation
      direction: DECREASED
      interpretation: >-
        Structural correlate of the aggregation node in this model.
      evidence:
      - reference: PMID:11440982
        reference_title: "Expression of R120G-alphaB-crystallin causes aberrant desmin and alphaB-crystallin aggregation and cardiomyopathy in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The desmin filaments in the cardiomyocytes were overtly affected, myofibril alignment was significantly impaired"
        explanation: >-
          Reports the histological measurement that grounds this readout.
    evidence:
    - reference: PMID:11440982
      reference_title: "Expression of R120G-alphaB-crystallin causes aberrant desmin and alphaB-crystallin aggregation and cardiomyopathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The data show that the R120G mutation causes a desminopathy, is dominant negative, and results in cardiac hypertrophy."
      explanation: >-
        Supports treating this model as informative for the aggregation node,
        while naming the hypertrophic phenotype that limits its relevance to
        dilated cardiomyopathy.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model does not reproduce the dilated phenotype that defines this entry.
    limitations: >-
      The reported cardiac response in this transgenic line is hypertrophic, at
      both the molecular and the cellular level, rather than dilated. Curating it
      as a model of dilated cardiomyopathy would misrepresent the published
      result.
    evidence:
    - reference: PMID:11440982
      reference_title: "Expression of R120G-alphaB-crystallin causes aberrant desmin and alphaB-crystallin aggregation and cardiomyopathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a hypertrophic response occurred at both the molecular and cellular levels"
      explanation: >-
        States the phenotype the model produces, which is not the dilated
        phenotype of this disease.
- name: CryAB R120G Drosophila heart model
  species: Drosophila melanogaster
  genotype: Cardiac expression of human CryAB p.Arg120Gly
  publication: PMID:23818860
  description: >-
    An invertebrate model in which cardiac expression of the mutant chaperone
    impairs contractile function and enlarges the heart tube, and in which the
    phenotype is suppressed by reducing NADPH-generating enzyme activity —
    evidence that reductive stress is part of the downstream pathology.
  modeled_mechanisms:
  - target: Cardiomyocyte Sarcomeric Stress-Protection Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Cardiac expression of the mutant chaperone is sufficient to impair
      contractile function and increase chamber dimensions.
    limitations: >-
      The allele is p.Arg120Gly rather than a CMD1II allele, the organ is a
      Drosophila heart tube rather than a four-chambered mammalian heart, and the
      protein is expressed heterologously.
    readouts:
    - name: Cardiac function and heart tube dimension
      target: Cardiomyocyte Sarcomeric Stress-Protection Deficit
      direction: ALTERED
      interpretation: >-
        Functional correlate of the cardiomyocyte insult node in this model.
      evidence:
      - reference: PMID:23818860
        reference_title: "The NADPH metabolic network regulates human αB-crystallin cardiomyopathy and reductive stress in Drosophila melanogaster."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "expression of mutant CryAB in the Drosophila heart impaired cardiac function and increased heart tube dimensions"
        explanation: >-
          Reports the functional and dimensional measurements behind this readout.
    evidence:
    - reference: PMID:23818860
      reference_title: "The NADPH metabolic network regulates human αB-crystallin cardiomyopathy and reductive stress in Drosophila melanogaster."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we confirmed the link between G6PD and mutant CryAB pathology by finding that reduction of G6PD expression suppressed the phenotype while overexpression enhanced it"
      explanation: >-
        Supports treating the model as informative for the cardiomyocyte insult
        node, since the phenotype is modifiable in the direction the redox
        hypothesis predicts.
discussions:
- discussion_id: cmd1ii_model_allele_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the p.Arg120Gly proteotoxic model of cardiac alpha-B crystallinopathy
    describe the mechanism of the alleles that actually cause isolated dilated
    cardiomyopathy?
  attaches_to:
  - "pathophysiology#Alpha-B Crystallin and Desmin Aggregate Accumulation"
  - "pathophysiology#Cardiomyocyte Sarcomeric Stress-Protection Deficit"
  rationale: >-
    Evidence for the aggregation route is not absent — it is abundant, detailed
    and in the wrong allele. Every in vivo and cell system cited for cardiac
    alpha-B crystallinopathy uses p.Arg120Gly, which causes desmin-related
    myopathy and which the founding CMD1II paper singles out as behaving
    differently: p.Arg120Gly loses binding to both the heart-specific N2B domain
    and the striated-muscle-specific I26/I27 domains and forms intracellular
    aggregates, while p.Arg157His loses only the N2B interaction and does not
    redistribute. The mouse model compounds the mismatch by producing a
    hypertrophic rather than a dilated phenotype, and by producing it from a
    transgene whose expression level sets the severity. So the well-supported
    mechanism belongs to a neighbouring disease, and the disease curated here has
    a binding measurement and no allele-matched model at all. This is the reason
    the two routes are separated into hypothesis groups instead of being merged
    into one chain.
  proposed_experiments:
  - experiment_id: exp_cmd1ii_r157h_knockin_mouse
    name: Knock-in mouse carrying the CRYAB p.Arg157His allele at endogenous expression
    description: >-
      Generate a heterozygous knock-in of p.Arg157His or its murine equivalent
      and phenotype the heart for chamber dimensions, ejection fraction, fibrosis
      and aggregate burden. This is the experiment that would show whether the
      titin N2B binding defect is sufficient to cause dilated cardiomyopathy, and
      whether it does so without the aggregation that defines the neighbouring
      myofibrillar disease.
    would_support:
    - "pathophysiology#Loss of Alpha-B Crystallin Binding to the Cardiac Titin N2B Domain"
    supporting_outcome:
    - >-
        Progressive left ventricular dilation with reduced ejection fraction in
        heterozygous knock-in animals, with no alpha-B crystallin or desmin
        aggregates on immunohistochemistry.
    would_refute:
    - "pathophysiology#Loss of Alpha-B Crystallin Binding to the Cardiac Titin N2B Domain"
    refuting_outcome:
    - >-
        Normal cardiac dimensions and function through the animals' lifespan,
        indicating that the measured binding defect is not by itself sufficient to
        produce disease.
  - experiment_id: exp_cmd1ii_ipsc_cardiomyocyte_titin_strain
    name: Patient-derived iPSC cardiomyocytes under mechanical load
    description: >-
      Differentiate cardiomyocytes from a p.Arg157His carrier and an isogenic
      corrected control, and measure titin-based passive stiffness, sarcomere
      integrity and contractile function under increasing mechanical and thermal
      stress. This tests the stress-protection step directly in human cells, which
      is the step currently carried as inference.
    would_support:
    - "pathophysiology#Cardiomyocyte Sarcomeric Stress-Protection Deficit"
    supporting_outcome:
    - >-
        Variant cardiomyocytes show sarcomere disorganization and contractile
        failure at stress levels the isogenic control tolerates.
- discussion_id: cmd1ii_entity_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do CRYAB alleles partition cleanly enough into cardiac-restricted and
    myofibrillar groups to justify two knowledge-base entries rather than one?
  attaches_to:
  - "disease#Dilated Cardiomyopathy 1II"
  - "genetic#CRYAB"
  rationale: >-
    This entry is curated as a sibling of the alpha-B crystallinopathy subtype of
    `Myofibrillar_Myopathy` rather than as a subtype of it, on the strength of a
    single allele-versus-allele biochemical comparison and a small number of
    cardiac-restricted patients. The counter-evidence is real and is recorded
    rather than argued away: p.Gly154Ser was first reported in isolated
    cardiomyopathy and later found in a family with late-onset distal vacuolar
    myopathy and no cardiac dysfunction, so at least one allele sits on both
    sides of the boundary. What would settle it is a systematic
    genotype-phenotype study across reported CRYAB carriers, and a ClinGen
    Gene-Disease Validity curation of the CRYAB-dilated cardiomyopathy
    relationship, which the ClinGen release cached in this repository does not
    contain. Until then the split is a mechanistic judgement, not a demonstrated
    partition, and a future curator with better data should feel free to reverse
    it.
  proposed_experiments:
  - experiment_id: exp_cmd1ii_genotype_phenotype_survey
    name: Systematic genotype-phenotype survey of reported CRYAB variant carriers
    description: >-
      Assemble every published CRYAB carrier with allele, cardiac imaging,
      skeletal-muscle assessment and ophthalmic examination, and test whether
      cardiac-restricted disease associates with alleles that spare the
      striated-muscle-specific titin domains. This is the analysis that would turn
      the present mechanistic argument into an empirical one.
  evidence:
  - reference: PMID:20171888
    reference_title: "The p.G154S mutation of the alpha-B crystallin gene (CRYAB) causes late-onset distal myopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the missense mutation p.Gly154Ser to be associated with a late-onset distal vacuolar myopathy with protein aggregates without respiratory or cardiac dysfunction"
    explanation: >-
      Counts against a clean allelic partition: an allele reported in isolated
      cardiomyopathy also produces aggregate-positive distal myopathy with no
      cardiac involvement, which is the myofibrillar phenotype in a supposedly
      cardiac allele.
  - reference: PMID:16483541
    reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "its disease-causing mechanism is different from the mutation found in desmin-related myopathy"
    explanation: >-
      The primary statement that the founding CMD1II allele acts by a different
      mechanism from the myofibrillar myopathy allele, which is the basis for
      curating the two as separate entities.
notes: >-
  Relationship to other entries. `Myofibrillar_Myopathy` curates the
  alpha-B crystallinopathy that presents with skeletal-muscle disease, including
  the dominant p.Arg120Gly adult-onset form and the recessive fatal infantile
  hypertonic form; its MFM2 subtype is bound to MONDO:0012130. This entry curates
  the cardiac-restricted presentation bound to MONDO:0014073. The two are
  siblings under alpha-B crystallinopathy. A `kb/groupings/` entry uniting the
  CRYAB-related phenotypes would be a reasonable follow-up and is deliberately
  not created here, since it would need the DES, BAG3 and other chaperone
  entries considered alongside it rather than being assembled around one gene in
  passing.


  Gene identifier. Issue #10634 and the stub give the causal gene as
  `hgnc:2388`. That CURIE is CRYAA (alpha-A crystallin). CRYAB is `hgnc:2389`,
  which is what this entry and the pre-existing `Myofibrillar_Myopathy` entry
  both use.


  Deep-research provenance. The Edison/falcon report
  `research/Dilated_Cardiomyopathy_1II-deep-research-falcon.md` was read as a
  lead. It carries no PMIDs — its ten validated references are all DOIs, and its
  substantive claims are attributed to page ranges in unnamed sources — so none
  of its citations are used here. Its most useful contribution was negative: it
  flags clearly that R120G findings are supporting biology rather than proof of
  the mechanism of every CMD1II allele, and that framing survives into this
  entry. Every reference cited above was fetched independently.

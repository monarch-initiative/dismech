    titin spring has lost its chaperone or because aggregates and a disrupted
    desmin network have degraded the contractile apparatus. This is the primary
    cardiomyocyte insult of the maladaptive-remodeling module, reached by a
    chaperone route rather than by a sarcomeric-protein or toxic route.

    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38212463
    reference_title: "CRYAB stop-loss variant causes rare syndromic dilated cardiomyopathy with congenital cataract: expanding the phenotypic and mutational spectrum of alpha-B crystallinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "He also has a 10-year-old child diagnosed with bilateral congenital cataracts with the same CRYAB variant."
    explanation: >-
      Demonstrates that familial variant testing identifies at-risk relatives

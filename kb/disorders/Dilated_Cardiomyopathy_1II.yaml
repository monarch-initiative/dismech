        label: Angiotensin Receptor-Neprilysin Inhibitor
    - preferred_term: dapagliflozin
      term:
        id: CHEBI:85078
        label: dapagliflozin
    - preferred_term: carvedilol
      term:
        id: CHEBI:3441
        label: carvedilol
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
  target_mechanisms:
  - target: Adverse Ventricular Remodeling and Myocardial Fibrosis
    description: >-
      Neurohormonal blockade and SGLT2 inhibition act on the shared remodeling
      stage of the pathograph rather than on the CRYAB lesion upstream of it.
    evidence:
    - reference: PMID:25176015
      reference_title: "Angiotensin-neprilysin inhibition versus enalapril in heart failure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "LCZ696 was superior to enalapril in reducing the risks of death and of hospitalization for heart failure."
      explanation: >-
        Establishes the benefit of neprilysin inhibition in heart failure with
        reduced ejection fraction. Indirect for this entry because the trial
        population was unselected for genotype.
  evidence:
  - reference: PMID:25176015
    reference_title: "Angiotensin-neprilysin inhibition versus enalapril in heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "we randomly assigned 8442 patients with class II, III, or IV heart failure and an ejection fraction of 40% or less"
    explanation: >-
      Defines the trial population whose results are being extended to CRYAB
      carriers, making the extrapolation explicit.
  - reference: PMID:31535829
    reference_title: "Dapagliflozin in Patients with Heart Failure and Reduced Ejection Fraction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "the risk of worsening heart failure or death from cardiovascular causes was"
    explanation: >-
      Supports SGLT2 inhibition as a component of the regimen. Indirect because
      the trial was not genotype-stratified.
- name: Implantable Cardioverter Defibrillator
  description: >-
    Device therapy for prevention of sudden cardiac death, indicated by general
    cardiomyopathy and arrhythmia guidelines. Noted here because a family history
    of sudden cardiac death accompanied the founding p.Arg157His report; no
    CRYAB-specific risk-stratification rule exists, so the standard
    ejection-fraction-based indication applies.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:

    explanation: >-
      Heart failure is the managed clinical state of this disease class.
      Indirect because it is a class-level statement.
- name: Cataract
  category: Ophthalmological
  description: >-
    Alpha-B crystallin is a lens protein as well as a muscle protein, and some
    CRYAB alleles declare themselves in the lens. In the reported stop-loss family
    the cataracts were bilateral and congenital, and were the only manifestation
    in the transmitting proband's child. Cataract is allele-dependent and is not
    a feature of the p.Arg157His cardiac-restricted presentation.
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38212463
    reference_title: "CRYAB stop-loss variant causes rare syndromic dilated cardiomyopathy with congenital cataract: expanding the phenotypic and mutational spectrum of alpha-B crystallinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had a history of bilateral congenital cataracts but had no evidence of myopathy or associated symptoms"
    explanation: >-
      Documents cataract with dilated cardiomyopathy and, in the same sentence,
      the absence of myopathy that keeps this presentation outside the
      myofibrillar myopathy entry.
  - reference: PMID:9731540
    reference_title: "A missense mutation in the alphaB-crystallin chaperone gene causes a desmin-related myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "a candidate gene encoding a 20-kD protein that is abundant in lens and is also present in a number of non-ocular tissues, including cardiac and skeletal muscle"
    explanation: >-
      Gives the expression basis for lens involvement alongside cardiac and
      skeletal muscle. Indirect because it is an expression statement rather than
      an observation of cataract in a CMD1II patient.
- name: Myocardial fibrosis
  category: Cardiovascular
  description: >-
    Interstitial and subendocardial fibrosis accompanying adverse remodeling.
    Reported in advanced CRYAB-related cardiac disease and expected from the
    remodeling module, but not quantified in any CRYAB series.

- name: Genetic Counseling and Cascade Testing of First-Degree Relatives
  description: >-
    Once a pathogenic CRYAB variant is established in a proband, targeted testing
    of first-degree relatives identifies carriers for cardiac surveillance. The
    stop-loss family makes the case concretely: the proband's child carried the
    same variant and had already declared the ocular phenotype while remaining
    cardiologically unremarkable, which is exactly the situation surveillance
    exists for.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

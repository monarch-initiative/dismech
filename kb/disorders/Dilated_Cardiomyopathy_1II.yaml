        CRYAB observation.
  evidence:
  - reference: PMID:16483541
    reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation of CRYAB, Arg157His, was found in a familial DCM patient"
    explanation: >-
      Anchors the organ-level endpoint in the founding CMD1II family.
phenotypes:
- name: Dilated cardiomyopathy
  category: Cardiovascular
  description: >-
    Left ventricular or biventricular dilation with impaired systolic function,
    not explained by loading conditions or coronary disease. This is the defining
    and, in the cardiac-restricted alleles, essentially the only phenotype.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:16483541
    reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation of CRYAB, Arg157His, was found in a familial DCM patient"
    explanation: >-
      Reports dilated cardiomyopathy in the index CRYAB p.Arg157His patient.
  - reference: PMID:38212463
    reference_title: "CRYAB stop-loss variant causes rare syndromic dilated cardiomyopathy with congenital cataract: expanding the phenotypic and mutational spectrum of alpha-B crystallinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband, diagnosed with DCM at age 32"
    explanation: >-
      Independent CRYAB carrier with the same cardiac phenotype.
- name: Reduced left ventricular ejection fraction
  category: Cardiovascular
  description: >-
    Impaired contraction is part of the diagnostic definition of the disease and
    is the parameter that treatment decisions are indexed to. No CRYAB-specific
    distribution of ejection fraction has been reported.
  phenotype_term:
    preferred_term: Reduced left ventricular ejection fraction
    term:
      id: HP:0012664
      label: Reduced left ventricular ejection fraction
  evidence:
  - reference: PMID:31073128
    reference_title: "Dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Dilated cardiomyopathy (DCM) is a clinical diagnosis characterized by left ventricular or biventricular dilation and impaired contraction"
    explanation: >-
      Impaired contraction is definitional for the disease class. Indirect
      because the source is a class-level review and not a CRYAB cohort.
- name: Congestive heart failure
  category: Cardiovascular
  description: >-
    The clinical syndrome that follows established systolic dysfunction —
    dyspnoea, fatigue, exercise intolerance and congestion.
  phenotype_term:
    preferred_term: Congestive heart failure

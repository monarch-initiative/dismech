prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence figure exists for the CRYAB-attributed
    form of dilated cardiomyopathy. The reported human material is a small number
    of index patients and families. The nearest thing to a denominator is a
    whole-genome-sequencing series of 159 unrelated dilated cardiomyopathy
    probands in which a single CRYAB variant was found, and an earlier
    consecutive series of 200 unrelated probands whose title reports low
    prevalence; neither is a population estimate and neither should be stored as
    one.
  evidence:
  - reference: PMID:38212463
    reference_title: "CRYAB stop-loss variant causes rare syndromic dilated cardiomyopathy with congenital cataract: expanding the phenotypic and mutational spectrum of alpha-B crystallinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "we performed whole genome sequencing on 159 unrelated patients with DCM and identified an unusual stop-loss pathogenic variant"
    explanation: >-
      Gives the only clean cohort denominator available for CRYAB in dilated
      cardiomyopathy — one variant carrier among 159 sequenced probands. It is
      indirect because a single-centre diagnostic yield is not a population
      prevalence.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    The reported CMD1II families are heterozygous for a single CRYAB missense or
    stop-loss allele, and transmission is vertical: the index p.Arg157His patient
    had familial dilated cardiomyopathy, and in the stop-loss family the proband's
    child carries the same variant. Penetrance and expressivity are unknown and
    are almost certainly age-dependent, since the described cardiac probands
    presented in adulthood while the transmitting-family lens phenotype was
    congenital. The recessive CRYAB route that produces fatal infantile hypertonic
    myofibrillar myopathy is a different entity and is curated on
    `Myofibrillar_Myopathy`, not here.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:16483541
    reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation of CRYAB, Arg157His, was found in a familial DCM patient"
    explanation: >-
      Documents the founding allele in a familial, rather than sporadic, dilated
      cardiomyopathy case, which is the basis for the dominant model.
  - reference: PMID:38212463
    reference_title: "CRYAB stop-loss variant causes rare syndromic dilated cardiomyopathy with congenital cataract: expanding the phenotypic and mutational spectrum of alpha-B crystallinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He also has a 10-year-old child diagnosed with bilateral congenital cataracts with the same CRYAB variant."
    explanation: >-
      Records parent-to-child transmission of a heterozygous CRYAB allele,
      supporting dominant inheritance and showing the age-dependence of which
      organ declares itself first.
genetic:
- name: CRYAB
  notes: >-
    CRYAB encodes alpha-B crystallin (HSPB5), a small heat-shock protein and
    ATP-independent molecular chaperone abundant in the lens and in cardiac and
    skeletal muscle. The alleles curated here as CMD1II are the heterozygous
    missense variant p.Arg157His, which impairs the interaction with the
    heart-specific titin N2B domain, and p.Gly154Ser, first reported in isolated
    cardiomyopathy. A stop-loss allele extending the protein by 19 residues has
    since been reported in dilated cardiomyopathy with congenital cataract. The
    aggregate-forming myofibrillar-myopathy allele p.Arg120Gly is deliberately
    NOT curated as a CMD1II allele; it belongs to `Myofibrillar_Myopathy`, and
    conflating the two is the specific error this entry exists to avoid. No
    ClinGen Gene-Disease Validity assertion for a CRYAB-dilated cardiomyopathy
    relationship is present in the ClinGen release cached in this repository, so
    the clinical validity of the relationship has not been expert-panel graded
    and should be treated as unsettled.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: CRYAB
    term:
      id: hgnc:2389
      label: CRYAB
  evidence:
  - reference: PMID:16483541
    reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mutation affected the evolutionary conserved amino acid residue among alpha-crystallins"
    explanation: >-
      Establishes that the founding CMD1II allele alters a residue conserved
      across the alpha-crystallin family, the conservation argument on which its
      pathogenicity partly rests.
  - reference: PMID:20171888
    reference_title: "The p.G154S mutation of the alpha-B crystallin gene (CRYAB) causes late-onset distal myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "has been identified earlier in patients with isolated cardiomyopathy"
    explanation: >-
      Confirms that p.Gly154Ser was first reported in isolated cardiomyopathy,
      which is why it is listed here as a CMD1II allele. Indirect because the
      cited report is itself a skeletal-myopathy family and refers back to the
      cardiac cases rather than describing them.
  - reference: PMID:38212463
    reference_title: "CRYAB stop-loss variant causes rare syndromic dilated cardiomyopathy with congenital cataract: expanding the phenotypic and mutational spectrum of alpha-B crystallinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant alpha-B crystallin protein is predicted to have an extended strand with addition of 19 amino acid residues"
    explanation: >-
      Documents a non-missense route to CRYAB-related dilated cardiomyopathy,
      widening the allelic spectrum beyond the two reported missense variants.
mechanistic_hypotheses:
- hypothesis_group_id: titin_n2b_interaction_defect
  hypothesis_label: Loss of alpha-B crystallin support for the cardiac titin N2B spring
  status: EMERGING
  description: >-
    The route directly supported for the founding CMD1II allele. Alpha-B
    crystallin associates with the heart-specific N2B domain and the adjacent
    I26/I27 domains of titin/connectin; p.Arg157His selectively reduces binding
    to N2B without visibly redistributing the protein inside cardiomyocytes. On
    this model the lesion is a failure to protect the titin spring under
    mechanical and thermal stress, and cardiac restriction follows from the fact
    that N2B is the heart-specific element. It is labelled EMERGING rather than
    established because the binding defect has been measured but the step from
    that defect to human myocardial disease has not been demonstrated in patient
    tissue or in an allele-matched model.
- hypothesis_group_id: proteotoxic_aggregation
  hypothesis_label: Chaperone failure with alpha-B crystallin and desmin aggregation
  status: ALTERNATIVE
  description: >-
    The route that dominates the alpha-B crystallinopathy literature and that
    underlies the myofibrillar myopathy pathograph: a dominant-negative chaperone
    allele forms insoluble alpha-B crystallin and desmin aggregates that overload
    protein quality control, disorganize the sarcomere and drive cardiomyocyte
    injury. It is listed here as an alternative rather than the canonical route
    because the evidence for it comes almost entirely from p.Arg120Gly, which is
    a desmin-related myopathy allele and not a reported cause of isolated dilated
    cardiomyopathy. It becomes plausible for CMD1II specifically with the
    stop-loss allele, whose extended, more hydrophobic product is predicted to
    aggregate.
pathophysiology:
- name: CRYAB Variant Altering the Cardiac Client Interface of Alpha-B Crystallin
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous germline CRYAB allele changes how alpha-B crystallin engages
    its client proteins in the cardiomyocyte. For p.Arg157His the change is
    narrow: an evolutionarily conserved residue is substituted, and the resulting
    protein still distributes normally in cardiomyocytes. For the stop-loss
    allele the change is to the C-terminus, extending the protein by 19 residues
    and raising predicted hydrophobicity. These are different molecular
    consequences that converge on the same organ, which is why the two downstream
    routes are curated as separate hypothesis groups rather than one chain.
  genes:
  - preferred_term: CRYAB
    term:
      id: hgnc:2389
      label: CRYAB
  genetic_context:
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      p.Arg157His is a heterozygous germline missense allele altering a residue
      conserved across the alpha-crystallins. Its measured defect is a selective
      loss of one protein-protein interaction rather than a loss of chaperone
      activity or of correct subcellular localization, so the loss-of-function
      category should be read as loss of a specific client interaction, not as
      global chaperone failure. The separately reported stop-loss allele is not
      a missense variant and is described in the genetic block instead.
  molecular_functions:
  - preferred_term: heat shock protein binding
    term:
      id: GO:0031072
      label: heat shock protein binding
  cellular_components:
  - preferred_term: I band
    term:
      id: GO:0031674
      label: I band
  downstream:
  - target: Loss of Alpha-B Crystallin Binding to the Cardiac Titin N2B Domain
    causal_link_type: DIRECT
    hypothesis_groups:
    - titin_n2b_interaction_defect
    description: >-
      The measured consequence of p.Arg157His is a reduced interaction with the
      heart-specific titin N2B domain.
    evidence:
    - reference: PMID:16483541
      reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional analysis revealed that the mutation decreased the binding to titin/connectin heart-specific N2B domain without affecting distribution of the mutant crystallin protein in cardiomyocytes."
      explanation: >-
        States both halves of this edge: binding to N2B falls, and subcellular
        distribution does not change, so the edge is a binding defect and not a
        mislocalization or aggregation defect.
  - target: Alpha-B Crystallin and Desmin Aggregate Accumulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - proteotoxic_aggregation
    description: >-
      An aggregation-competent CRYAB allele forms insoluble deposits with desmin.
      This edge is well supported for p.Arg120Gly and predicted, not demonstrated,
      for the CMD1II stop-loss allele.
    evidence:
    - reference: PMID:9731540
      reference_title: "A missense mutation in the alphaB-crystallin chaperone gene causes a desmin-related myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Muscle cell lines transfected with the mutant CRYAB cDNA showed intracellular aggregates that contain both desmin and alphaB-crystallin"
      explanation: >-
        Demonstrates the aggregation edge for a CRYAB missense allele. Indirect
        for this entry because the allele tested is p.Arg120Gly, a
        desmin-related myopathy allele rather than a CMD1II allele.
    - reference: PMID:38212463
      reference_title: "CRYAB stop-loss variant causes rare syndromic dilated cardiomyopathy with congenital cataract: expanding the phenotypic and mutational spectrum of alpha-B crystallinopathy."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: "which may contribute to aggregation and increased hydrophobicity of alpha-B crystallin"
      explanation: >-
        The only support that an aggregation route operates in a CMD1II allele is
        a structural prediction for the stop-loss product, which is why this edge
        is curated as an alternative hypothesis rather than the canonical chain.
  evidence:
  - reference: PMID:16483541
    reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation of CRYAB, Arg157His, was found in a familial DCM patient"
    explanation: >-
      Identifies the trigger variant in a dilated cardiomyopathy family.
  - reference: PMID:9731540
    reference_title: "A missense mutation in the alphaB-crystallin chaperone gene causes a desmin-related myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "AlphaB-crystallin is a member of the small heat shock protein (shsp) family and possesses molecular chaperone activity."
    explanation: >-
      Establishes the normal biology this node perturbs. Indirect because the
      paper's disease context is desmin-related myopathy rather than isolated
      dilated cardiomyopathy.
- name: Loss of Alpha-B Crystallin Binding to the Cardiac Titin N2B Domain
  biological_scale: MOLECULAR
  description: >-
    Alpha-B crystallin associates with the heart-specific N2B element of
    titin/connectin and with the adjacent I26/I27 domains. In the p.Arg157His
    mutant the N2B interaction is selectively lost. The contrast with
    p.Arg120Gly is the informative part: that allele loses binding to both N2B
    and the striated-muscle-specific I26/I27 domains, which is consistent with
    its combined cardiac and skeletal phenotype, while a defect confined to the
    heart-specific element offers a molecular reason for a cardiac-restricted
    presentation. This is the mechanistic argument for curating CMD1II as its own
    entity rather than as a myofibrillar myopathy subtype.
  molecular_functions:
  - preferred_term: heat shock protein binding
    term:
      id: GO:0031072
      label: heat shock protein binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: I band
    term:
      id: GO:0031674
      label: I band
  downstream:
  - target: Cardiomyocyte Sarcomeric Stress-Protection Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - titin_n2b_interaction_defect
    description: >-
      An unchaperoned titin spring is proposed to leave the sarcomere less able
      to tolerate mechanical and thermal stress. This step is inference from the
      binding data, not a measured cellular result.
    evidence:
    - reference: PMID:16483541
      reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "the Arg157His mutation may be involved in the pathogenesis of DCM via impaired accommodation to the heart-specific N2B domain of titin/connectin"
      explanation: >-
        The authors themselves frame the step from binding defect to disease as a
        proposal, and the quoted hedge is reproduced rather than removed.
  evidence:
  - reference: PMID:16483541
    reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "alphaB-crystallin was recently reported to associate with the heart-specific N2B domain and adjacent I26/I27 domain of titin/connectin"
    explanation: >-
      Establishes the normal interaction that this node reports as lost, and
      names the domain whose heart specificity underlies the tissue restriction.
  - reference: PMID:16483541
    reference_title: "Alpha B-crystallin mutation in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, another CRYAB mutation, Arg120Gly, reported in desmin-related myopathy decreased the binding to both N2B and striated muscle-specific I26/27 domains and showed intracellular aggregates of the mutant protein."
    explanation: >-
      The direct allele-versus-allele comparison. It is the single most important
      piece of evidence for the lump/split decision recorded in this entry.
- name: Alpha-B Crystallin and Desmin Aggregate Accumulation
  biological_scale: CELLULAR
  description: >-
    Insoluble deposits containing both alpha-B crystallin and desmin accumulate
    in the sarcoplasm, overloading protein quality control and disorganizing the
    myofibrillar lattice. This is the alpha-B crystallinopathy mechanism as it is
    usually described, and it is the mechanism `Myofibrillar_Myopathy` curates.
    It is retained here as an alternative route because a CMD1II stop-loss allele
    is predicted to aggregate, but no aggregate pathology has been demonstrated
    in myocardium from a patient carrying a CMD1II allele.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: intermediate filament cytoskeleton organization
    term:
      id: GO:0045104
      label: intermediate filament cytoskeleton organization
    modifier: DECREASED
  cellular_components:
  - preferred_term: Z disc
    term:
      id: GO:0030018
      label: Z disc
  downstream:
  - target: Cardiomyocyte Sarcomeric Stress-Protection Deficit
    causal_link_type: DIRECT
    hypothesis_groups:
    - proteotoxic_aggregation
    description: >-
      Aggregate burden and desmin filament disruption compromise the
      cardiomyocyte's contractile apparatus.
    evidence:
    - reference: PMID:11440982
      reference_title: "Expression of R120G-alphaB-crystallin causes aberrant desmin and alphaB-crystallin aggregation and cardiomyopathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The desmin filaments in the cardiomyocytes were overtly affected, myofibril alignment was significantly impaired"
      explanation: >-
        Shows the aggregation-to-myofibril-disorganization step in cardiomyocytes
        in vivo. Indirect because the mouse expresses p.Arg120Gly from a
        transgene, not a CMD1II allele at endogenous level.
  evidence:
  - reference: PMID:11440982
    reference_title: "Expression of R120G-alphaB-crystallin causes aberrant desmin and alphaB-crystallin aggregation and cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The data show that the R120G mutation causes a desminopathy, is dominant negative, and results in cardiac hypertrophy."
    explanation: >-
      Establishes the dominant-negative aggregation mechanism, and at the same
      time shows why it is an imperfect model for this entry: the cardiac
      phenotype reported is hypertrophy, not dilation.
- name: Cardiomyocyte Sarcomeric Stress-Protection Deficit
  biological_scale: CELLULAR
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The convergence point of the two routes: a cardiomyocyte whose sarcomere is

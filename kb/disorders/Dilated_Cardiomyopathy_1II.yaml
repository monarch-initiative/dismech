treatments:
- name: Guideline-Directed Medical Therapy for Heart Failure with Reduced Ejection Fraction
  description: >-
    There is no genotype-directed therapy for CRYAB-related dilated
    cardiomyopathy. Management is the standard heart-failure regimen — an
    angiotensin receptor-neprilysin inhibitor or ACE inhibitor, an evidence-based
    beta-blocker, a mineralocorticoid receptor antagonist, an SGLT2 inhibitor, and
    diuretics for congestion. The supporting trials enrolled unselected patients
    with reduced ejection fraction; none was CRYAB-stratified, and the benefit is
    recorded here as class-level rather than disease-specific.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: angiotensin receptor-neprilysin inhibitor (sacubitril/valsartan)
      term:

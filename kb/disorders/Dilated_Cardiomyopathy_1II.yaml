name: Dilated Cardiomyopathy 1II
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
synonyms:
- CMD1II
- DCM1II
- dilated cardiomyopathy type 1II
- cardiomyopathy, dilated, 1II
- CRYAB familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in CRYAB
- alpha-B crystallin-related dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1II (CMD1II, OMIM 615184) is the CRYAB-attributed node
  of the familial isolated dilated cardiomyopathy series. CRYAB encodes
  alpha-B crystallin (HSPB5), an ATP-independent small heat-shock protein that
  is abundant in the lens and in cardiac and skeletal muscle, and that binds
  desmin, actin and — the point on which this entry turns — the heart-specific
  N2B spring element of titin/connectin.


  THIS ENTRY IS DELIBERATELY SEPARATE FROM MYOFIBRILLAR MYOPATHY, AND THE
  REASON IS MECHANISTIC RATHER THAN NOSOLOGICAL. MONDO gives MONDO:0014073 two
  parents: familial isolated dilated cardiomyopathy, and the CRYAB-related
  myofibrillar myopathy-cataract-cardiomyopathy spectrum. The knowledge base
  already curates the second of those as `Myofibrillar_Myopathy`, whose MFM2
  subtype is alpha-B crystallinopathy and whose pathograph is built end to end
  around protein aggregation — chaperone-assisted selective autophagy failure,
  desmin network disruption, myofibrillar disintegration at the Z-disc, and
  ectopic aggregate accumulation. The founding CMD1II allele does not fit that
  pathograph. Inagaki and colleagues showed that p.Arg157His, found in a
  familial dilated cardiomyopathy patient, reduces binding to the heart-specific
  titin N2B domain while leaving the distribution of the protein in
  cardiomyocytes unchanged, whereas the myofibrillar-myopathy allele p.Arg120Gly
  loses binding to both N2B and the striated-muscle-specific I26/I27 domains and
  does form intracellular aggregates. They state explicitly that the
  disease-causing mechanism of Arg157His is different from that of the allele
  found in desmin-related myopathy. Recording CMD1II as a `has_subtypes` entry
  on `Myofibrillar_Myopathy` would therefore assert an aggregate-first
  myofibrillar mechanism that the primary literature specifically denies for the
  index allele, and would assert skeletal-muscle involvement that the reported
  cardiac-restricted patients do not have. The two entries are curated as
  siblings under alpha-B crystallinopathy rather than parent and child.


  THE ALLELIC BOUNDARY IS REAL BUT NOT ABSOLUTE, AND THIS ENTRY DOES NOT PRETEND
  OTHERWISE. p.Gly154Ser was first reported in isolated cardiomyopathy and was
  later found in a family with late-onset distal vacuolar myopathy with protein
  aggregates and no cardiac dysfunction at all — the same allele on either side
  of the line. A stop-loss allele, p.(Ter176TrpextTer19), was found in one of
  159 sequenced dilated cardiomyopathy probands and produced dilated
  cardiomyopathy with bilateral congenital cataracts but no myopathy, adding a
  third pattern. So CRYAB alleles distribute across cardiac, skeletal-muscle and
  ocular presentations in a way that correlates with the allele but is not
  determined by it. Two mechanistic routes are curated here as explicit
  hypothesis groups — a titin-interaction route supported directly for
  p.Arg157His, and a proteotoxic aggregation route supported mainly by
  p.Arg120Gly model systems that are not CMD1II alleles.


  THE MECHANISTIC MODEL EVIDENCE IS ALLELE-MISMATCHED. Essentially all of the
  cell and animal work on cardiac alpha-B crystallinopathy uses p.Arg120Gly,
  which causes desmin-related myopathy rather than isolated dilated
  cardiomyopathy, and does so by overexpression. No knock-in or patient-derived
  model of p.Arg157His or p.Gly154Ser cardiac disease has been reported. That
  mismatch is carried as a HUMAN_MODEL_MISMATCH discussion rather than smoothed
  over, and the animal-model links say which node they model and which they do
  not.

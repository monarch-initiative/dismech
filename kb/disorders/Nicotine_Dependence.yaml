genetic:
- name: CHRNA5
  gene_term:
    preferred_term: CHRNA5
    term:
      id: hgnc:1959
      label: CHRNA5
  relationship_type: RISK_FACTOR
  notes: >-
    The chromosome 15q25 alpha-5/alpha-3/beta-4 cluster carries the strongest
    and most replicated genetic risk factor for nicotine dependence, and the
    lead variant is a common CHRNA5 missense change. Low-frequency and rare
    CHRNA5 coding variants contribute risk independently of it, so the locus is
    not a single-variant signal. The effect size for the lead allele is modest,
    an odds ratio of about 1.3, which is why this is a risk factor and not a
    cause.
  variants:
  - name: rs16969968
    description: >-
      A common nonsynonymous coding variant, D398N, in the alpha-5 subunit.
      Associated with nicotine dependence, heaviness of smoking, cessation, and
      with smoking-related lung cancer and chronic obstructive pulmonary
      disease. Functionally it reduces alpha-5 subunit function.
    identifiers:
    - dbSNP:rs16969968
    evidence:
    - reference: PMID:26239294
      reference_title: "Rare, low frequency and common coding variants in CHRNA5 and their contribution to nicotine dependence in European and African Americans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Meta-analysis confirmed the risk effect of the only common variant
        (rs16969968, European ancestry: odds ratio (OR)=1.3, P=3.5 × 10(-11);
        African ancestry: OR=1.3, P=0.01)
      explanation: >-
        Gives the effect size and significance in both ancestry groups, from a
        meta-analysis of the primary sample with replication studies containing
        12 174 heavy and 11 290 light smokers.
  evidence:
  - reference: PMID:26239294
    reference_title: "Rare, low frequency and common coding variants in CHRNA5 and their contribution to nicotine dependence in European and African Americans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common nonsynonymous variant rs16969968 in the α5 nicotinic receptor
      subunit gene (CHRNA5) is the strongest genetic risk factor for nicotine
      dependence in European Americans and contributes to risk in African
      Americans.
    explanation: >-
      States the locus's standing relative to every other genetic signal in
      this trait, and that it replicates across the two ancestry groups
      studied.
  - reference: PMID:26239294
    reference_title: "Rare, low frequency and common coding variants in CHRNA5 and their contribution to nicotine dependence in European and African Americans."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many independent studies demonstrated that rs16969968, a common coding
      variant (D398N) in the α5 nicotinic receptor subunit gene (CHRNA5), is
      associated with nicotine dependence, heaviness of smoking, and smoking
      cessation, as well as smoking-related illnesses such as lung cancer and
      chronic obstructive pulmonary disease.
    explanation: >-
      Names the amino-acid change and the breadth of phenotypes the allele is
      associated with. Quoted from the paper's introduction, where it
      summarises the prior association literature rather than its own
      sequencing result.
- name: CHRNA3
  gene_term:
    preferred_term: CHRNA3
    term:
      id: hgnc:1957
      label: CHRNA3
  relationship_type: RISK_FACTOR
  notes: >-
    Part of the same 15q25 cluster, in strong linkage disequilibrium with
    CHRNA5. The alpha-3 subunit can assemble with beta-2 and contributes to
    aspects of nicotine-related behaviour distinct from those of alpha-4.
- name: CHRNB4
  gene_term:
    preferred_term: CHRNB4
    term:
      id: hgnc:1964
      label: CHRNB4
  relationship_type: RISK_FACTOR
  notes: >-
    The third gene of the 15q25 cluster. The beta-4 subunit partners alpha-3
    and alpha-5 in the habenulo-interpeduncular receptors this entry's aversion
    node depends on.
- name: CYP2A6
  gene_term:
    preferred_term: CYP2A6
    term:
      id: hgnc:2610
      label: CYP2A6
  relationship_type: MODIFIER
  notes: >-
    CYP2A6 variation does not alter liability to dependence through the
    receptor system; it sets nicotine clearance, and so smoking rate and which
    pharmacotherapy works. It is recorded as a modifier because its
    established consequence in a randomised trial is treatment response rather
    than risk of the disorder.
  evidence:
  - reference: PMID:25588294
    reference_title: "Use of the nicotine metabolite ratio as a genetically informed biomarker of response to nicotine patch or varenicline for smoking cessation: a randomised, double-blind placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treating normal metabolisers with varenicline and slow metabolisers with
      nicotine patch could optimise quit rates while minimising side-effects.
    explanation: >-
      The trial's own interpretation of the metabolite-ratio-by-treatment
      interaction, which is the clinical form this gene's effect takes.
- name: CHRNA4
  gene_term:
    preferred_term: CHRNA4
    term:
      id: hgnc:1958
      label: CHRNA4
  relationship_type: RISK_FACTOR
  notes: >-
    Encodes the alpha-4 subunit of the high-affinity heteromer that mediates
    nicotine reinforcement. Recorded here because it is the subunit the
    pathophysiology and the partial-agonist treatments act on, not because it
    carries a 15q25-sized association signal.
- name: CHRNB2
  gene_term:
    preferred_term: CHRNB2
    term:
      id: hgnc:1962
      label: CHRNB2
  relationship_type: RISK_FACTOR
  notes: >-
    Encodes the beta-2 subunit, without which nicotine does not reach the
    mesolimbic dopamine system at all in mice. As with CHRNA4, it is recorded
    for its mechanistic role rather than for an association signal.
  evidence:
  - reference: PMID:9428762
    reference_title: Acetylcholine receptors containing the beta2 subunit are involved in the reinforcing properties of nicotine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that nicotine stimulates dopamine release in the ventral
      striatum of wild-type mice but not in the ventral striatum of
      beta2-mutant mice.
    explanation: >-
      Establishes the subunit as necessary for the dopaminergic response to
      nicotine, in a knockout rather than in a human association study.
environmental:
- name: Tobacco smoking
  description: >-
    Smoked tobacco is the route by which nicotine dependence is established in
    most of the world, and the route that carries the disorder's mortality. The
    inhaled bolus reaches the brain within seconds, which is what makes the
    reinforcement so tightly paired with the act, and it is delivered alongside
    the combustion products responsible for the attributable deaths.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Nicotinic Acetylcholine Receptor Agonism by Nicotine
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Smoking is the exposure route through which nicotine reaches the
      receptor, so it initiates the mechanism rather than modifying it.
    evidence:
    - reference: PMID:41559453
      reference_title: "Multiple sources of β2*-nicotinic acetylcholine receptor binding are differentially affected during tobacco smoking abstinence as revealed by Independent Component Analysis of [(18)F]Flubatine PET images."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: >-
        Nicotine is the primary addictive component of tobacco and acts in the
        brain at nicotinic acetylcholine receptors (nAChRs).
      explanation: >-
        States that the addictive constituent of the exposure is nicotine and
        names its target, which is the link this edge asserts. Quoted from
        the paper's introduction, where it states an established fact rather
        than its own PET result.
  evidence:
  - reference: PMID:34051883
    reference_title: "Spatial, temporal, and demographic patterns in prevalence of smoking tobacco use and attributable disease burden in 204 countries and territories, 1990-2019: a systematic analysis from the Global Burden of Disease Study 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Globally in 2019, 1·14 billion (95% uncertainty interval 1·13-1·16)
      individuals were current smokers, who consumed 7·41 trillion (7·11-7·74)
      cigarette-equivalents of tobacco in 2019.
    explanation: >-
      Quantifies how widely the exposure is held, from 3625 nationally
      representative surveys across 204 countries and territories.
- name: Smokeless tobacco use
  description: >-
    Chewed and other non-combusted tobacco products deliver nicotine without
    the combustion products, so they can establish and maintain dependence
    while carrying a different risk profile. This entry does not curate that
    profile; the row exists so the exposure routes are not reduced to smoking
    alone.
  exposure_term:
    preferred_term: exposure to smokeless tobacco
    term:
      id: ECTO:7000167
      label: exposure to smokeless tobacco
  review_notes: >-
    Left deliberately uncited. The sources assembled for this entry are about
    smoked tobacco: the Global Burden of Disease analysis cited above reports
    smoking prevalence and smoking-attributable burden, the cohorts behind the
    receptor and genetic nodes ascertained cigarette smokers, and all four
    pharmacotherapy trials enrolled people who smoked cigarettes daily. A
    PubMed search for smokeless tobacco dependence sources was not run,
    because curating that risk profile properly is its own piece of work
    rather than a sentence in this entry, and quoting a smoking source for a
    smokeless claim would be the named-entity error this repository warns
    about. The row is kept unbound to evidence so the exposure route is
    visible and the gap is explicit.
treatments:
- name: Varenicline
  description: >-
    A high-affinity partial agonist at the alpha-4-beta-2 receptor, and the
    most effective single agent in the head-to-head trial. In a four-arm
    randomised comparison it beat placebo, nicotine patch and bupropion, and
    the long-standing neuropsychiatric safety concern was not borne out.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: varenicline
      term:
        id: CHEBI:84500
        label: varenicline
  target_mechanisms:
  - target: Partial Agonist Occupancy of Alpha4Beta2 Nicotinic Receptors
    description: >-
      Occupies and desensitises the receptor the reinforcement runs through,
      while weakly activating it.
  evidence:
  - reference: PMID:27116918
    reference_title: "Neuropsychiatric safety and efficacy of varenicline, bupropion, and nicotine patch in smokers with and without psychiatric disorders (EAGLES): a double-blind, randomised, placebo-controlled clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Varenicline-treated participants achieved higher abstinence rates than
      those on placebo (odds ratio [OR] 3·61, 95% CI 3·07 to 4·24), nicotine
      patch (1·68, 1·46 to 1·93), and bupropion (1·75, 1·52 to 2·01).
    explanation: >-
      The direct head-to-head result in 8144 randomised participants, which is
      what establishes varenicline's rank rather than an indirect comparison
      across trials.
  - reference: PMID:27116918
    reference_title: "Neuropsychiatric safety and efficacy of varenicline, bupropion, and nicotine patch in smokers with and without psychiatric disorders (EAGLES): a double-blind, randomised, placebo-controlled clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study did not show a significant increase in neuropsychiatric
      adverse events attributable to varenicline or bupropion relative to
      nicotine patch or placebo.
    explanation: >-
      The trial's primary safety endpoint, which addressed the concern that
      had carried a boxed warning. Recorded because it is the reason the drug
      is usable in the psychiatric comorbidity that is common in this disorder.
- name: Nicotine replacement therapy
  description: >-
    Delivers nicotine without combustion products, which relieves withdrawal
    and reduces the aversive abstinent state while removing the exposure that
    carries the mortality. It beat placebo in the head-to-head trial and was
    the better arm for slow nicotine metabolisers.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: nicotine replacement
    term:
      id: NCIT:C15710
      label: Nicotine Replacement
    therapeutic_agent:
    - preferred_term: nicotine
      term:
        id: CHEBI:18723
        label: nicotine
  target_mechanisms:
  - target: Reward Deficit and Stress-System Recruitment in Nicotine Abstinence
    description: >-
      Substituting nicotine blunts the negative affective state that makes
      abstinence hard to sustain, which is the arm of the mechanism this
      treatment addresses.
  evidence:
  - reference: PMID:27116918
    reference_title: "Neuropsychiatric safety and efficacy of varenicline, bupropion, and nicotine patch in smokers with and without psychiatric disorders (EAGLES): a double-blind, randomised, placebo-controlled clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those on bupropion and nicotine patch achieved higher abstinence rates
      than those on placebo
    explanation: >-
      Establishes the patch's effect against placebo in the same trial that
      ranks it below varenicline; the source gives the odds ratio for the
      patch as 2.15 and for bupropion as 2.07. The quote stops before those
      figures because their confidence intervals are printed in square
      brackets, which the snippet comparison strips from a candidate quote.
  - reference: PMID:25588294
    reference_title: "Use of the nicotine metabolite ratio as a genetically informed biomarker of response to nicotine patch or varenicline for smoking cessation: a randomised, double-blind placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An NMR-by-treatment interaction showed that slow (vs normal)
      metabolisers reported greater overall side-effect severity with
      varenicline versus placebo (β=-1·06, 95% CI -2·08 to -0·03; p=0·044).
    explanation: >-
      The tolerability half of the metabolite-ratio result, which is the
      reason the patch is preferred in slow metabolisers rather than simply
      being equally good.
  effect_modifiers:
  - effect_modifier_type: BIOMARKER
    stratum: slow metabolisers of nicotine
    comparator_stratum: normal metabolisers of nicotine
    modified_outcome: biochemically verified 7 day point prevalence abstinence at end of treatment
    effect_in_stratum: LARGER_EFFECT
    modification_analysis: PRESPECIFIED_SUBGROUP
    interaction_tested: true
    description: >-
      Varenicline's advantage over the patch was present in normal metabolisers
      and absent in slow metabolisers, so relative to varenicline the patch
      does better in the slow stratum. The trial randomised and stratified on
      the metabolite ratio, and the interaction was formally tested.
    evidence:
    - reference: PMID:25588294
      reference_title: "Use of the nicotine metabolite ratio as a genetically informed biomarker of response to nicotine patch or varenicline for smoking cessation: a randomised, double-blind placebo-controlled trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        At end of treatment, varenicline was more efficacious than nicotine
        patch in normal metabolisers (OR 2·17, 95% CI 1·38-3·42; p=0·001), but
        not in slow metabolisers (OR 1·13, 0·74-1·71; p=0·56).
      explanation: >-
        The stratum-specific odds ratios behind this modifier, from a trial in
        which the stratifier was part of the randomisation.
- name: Cytisinicline
  description: >-
    A plant alkaloid that binds the same alpha-4-beta-2 receptor as
    varenicline, long used in central and eastern Europe and trialled in the
    United States on a new pharmacokinetically based schedule. Both a six-week
    and a twelve-week course beat placebo.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cytisinicline
      term:
        id: CHEBI:4055
        label: cytisine
  target_mechanisms:
  - target: Partial Agonist Occupancy of Alpha4Beta2 Nicotinic Receptors
    description: >-
      Binds the same receptor as varenicline. Whether it reaches
      concentrations sufficient to act on that receptor at clinical doses is
      disputed, and the controversy is recorded below.
  evidence:
  - reference: PMID:37432430
    reference_title: "Cytisinicline for Smoking Cessation: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the 12-week course of cytisinicline vs placebo, continuous abstinence
      rates were 32.6% vs 7.0% for weeks 9 to 12 (OR, 6.3 [95% CI, 3.7-11.6];
      P < .001) and 21.1% vs 4.8% during weeks 9 to 24 (OR, 5.3 [95% CI,
      2.8-11.1]; P < .001).
    explanation: >-
      Biochemically verified continuous abstinence against placebo in 810
      randomised adults, at end of treatment and sustained to 24 weeks.
  - reference: PMID:37432430
    reference_title: "Cytisinicline for Smoking Cessation: A Randomized Clinical Trial."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Cytisinicline (cytisine) is a plant-based alkaloid that, like
      varenicline, binds selectively to α4β2 nicotinic acetylcholine
      receptors, which mediate nicotine dependence.
    explanation: >-
      States the receptor target and the identity of cytisinicline with
      cytisine. Quoted from the trial report's importance statement, where it
      restates established pharmacology rather than reporting the trial's own
      finding.
- name: Bupropion
  description: >-
    A weak dopamine and noradrenaline reuptake inhibitor that also antagonises
    nicotinic receptors. It beat placebo in the head-to-head trial but was
    inferior to varenicline. Its two actions are thought to address different
    parts of the mechanism, and neither is firmly established as the operative
    one.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bupropion
      term:
        id: CHEBI:3219
        label: bupropion
  target_mechanisms:
  - target: Reward Deficit and Stress-System Recruitment in Nicotine Abstinence
    description: >-
      Mimicking nicotine's effects on dopamine and noradrenaline is the
      proposed route by which bupropion attenuates the withdrawal state.
    evidence:
    - reference: PMID:16109583
      reference_title: "How does bupropion work as a smoking cessation aid?"
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        the principal mode of bupropion action is upon the withdrawal symptoms
        following smoking cessation
      explanation: >-
        The review's conclusion about which part of the mechanism the drug
        acts on. Indirect, and a synthesis rather than a measurement: the
        authors state in the same abstract that the precise mechanisms remain
        unclear.
  evidence:
  - reference: PMID:16109583
    reference_title: "How does bupropion work as a smoking cessation aid?"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Bupropion is a weak inhibitor of dopamine and noradrenaline reuptake,
      and has also been shown to antagonise nicotinic acetylcholine receptor
      function.
    explanation: >-
      Names the two pharmacological actions, which is as far as the evidence
      goes; the review is explicit that the precise mechanism of its clinical
      effect is unclear.
  - reference: PMID:16109583
    reference_title: "How does bupropion work as a smoking cessation aid?"
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      its ability to antagonize nicotinic receptors may prevent relapse by
      attenuating the reinforcing properties of nicotine, but probably cannot
      acutely reduce smoking
    explanation: >-
      Separates the relapse-prevention role the authors attribute to nicotinic
      antagonism from an acute reduction in smoking they say it cannot
      produce. Hedged in the source and recorded as such.
- name: Nicotine e-cigarettes
  description: >-
    A route that delivers nicotine without combustion, used for cessation in
    many countries. In the Cochrane component network meta-analysis it was
    among the three most effective interventions, alongside varenicline and
    cytisine, on high-certainty evidence. It is also the clearest case of why
    this entry is bound to nicotine dependence rather than to tobacco use
    disorder: a patient who switches completely remains dependent on nicotine
    while no longer being a tobacco user, and that is a case the binding, and
    so this entry, covers. Its regulatory status varies by country and is not
    recorded here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: nicotine e-cigarette for smoking cessation
    term:
      id: NCIT:C15372
      label: Smoking Cessation Intervention
    therapeutic_agent:
    - preferred_term: nicotine
      term:
        id: CHEBI:18723
        label: nicotine
  target_mechanisms:
  - target: Reward Deficit and Stress-System Recruitment in Nicotine Abstinence
    description: >-
      Continues nicotine delivery, so the abstinence state the dependence is
      maintained by does not arise, while removing the combustion exposure.
  evidence:
  - reference: PMID:37696529
    reference_title: "Pharmacological and electronic cigarette interventions for smoking cessation in adults: component network meta-analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found high-certainty evidence that nicotine e-cigarettes (OR 2.37, 95%
      CrI 1.73 to 3.24; 16 RCTs, 3828 participants), varenicline (OR 2.33, 95%
      CrI 2.02 to 2.68; 67 RCTs, 16,430 participants) and cytisine (OR 2.21,
      95% CrI 1.66 to 2.97; 7 RCTs, 3848 participants) were associated with
      higher quit rates than control.
    explanation: >-
      Puts all three of the most effective interventions and their effect sizes
      in one estimate, from a Bayesian component network meta-analysis of 319
      randomised trials. This is the comparative evidence the single
      head-to-head trial cannot give.
  notes: >-
    The entry records this as a cessation treatment because that is what the
    cited evidence measures. It does not follow that e-cigarette use is
    harmless, and the long-term consequences of the exposure are not curated
    here.
- name: Behavioural counselling
  description: >-
    Brief behavioural support accompanied the active drug in every trial cited
    in this entry, including the placebo arms, so each of the pharmacotherapy
    effects above is an effect on top of counselling rather than instead of it.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Behavioral Counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  target_mechanisms:
  - target: Incentive Salience and Smoking Cue Reactivity
    description: >-
      Counselling targets the cue-driven, habitual arm by identifying and
      planning for the situations that provoke seeking.
diagnosis:
- name: Fagerstrom Test for Nicotine Dependence
  description: >-
    The instrument most of this entry's cited cohorts used to define and grade
    dependence. It is a revision of the Fagerstrom Tolerance Questionnaire that
    dropped two items unrelated to any biochemical measure of smoking
    heaviness and rescored the two that carry most of the signal, time to the
    first cigarette of the day and cigarettes per day.
  notes: >-
    The CHRNA5 sequencing study cited in the genetic section defined its cases
    as scoring at or above 4 on this instrument, so the genetic effect sizes in
    this entry are anchored to this threshold rather than to a DSM diagnosis.
  evidence:
  - reference: PMID:1932883
    reference_title: "The Fagerström Test for Nicotine Dependence: a revision of the Fagerström Tolerance Questionnaire."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a revision of the FTQ: the Fagerström Test for Nicotine
      Dependence (FTND).
    explanation: >-
      The paper that introduced the instrument, from an item analysis against
      biochemical measures of smoking heaviness in 254 smokers.
  - reference: PMID:1932883
    reference_title: "The Fagerström Test for Nicotine Dependence: a revision of the Fagerström Tolerance Questionnaire."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that the nicotine rating item and the inhalation item were
      unrelated to any of our biochemical measures and these two items were
      primary contributors to psychometric deficiencies in the FTQ.
    explanation: >-
      Identifies what was wrong with the earlier questionnaire, which is why
      the revised instrument rather than its predecessor is the one in use.
- name: Nicotine metabolite ratio
  description: >-
    The ratio of 3'-hydroxycotinine to cotinine in a single blood or saliva
    sample, which reads out CYP2A6 activity and so nicotine clearance. It is
    a treatment-selection test rather than a diagnostic one: it does not say
    whether the patient is dependent, it says which pharmacotherapy is likely
    to work.
  notes: >-
    No measurement term is bound. The measurements slot takes a LOINC code
    only, and no LOINC code for cotinine or for the 3'-hydroxycotinine to
    cotinine ratio is present in cache/loinc/terms.csv, which held 828 rows on
    2026-11-19. A code may not be typed from memory for this slot, and
    seeding one requires the pinned LOINC table that this repository does not
    commit, so the row names the analytes in prose instead. The two analytes
    are bound as chemical entities on the CYP2A6 clearance node.
  evidence:
  - reference: PMID:25588294
    reference_title: "Use of the nicotine metabolite ratio as a genetically informed biomarker of response to nicotine patch or varenicline for smoking cessation: a randomised, double-blind placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We tested whether a genetically informed biomarker of nicotine clearance,
      the nicotine metabolite ratio (NMR; 3'-hydroxycotinine:cotinine),
      predicts response to nicotine patch or varenicline for smoking
      cessation.
    explanation: >-
      Defines the ratio and states the question the trial was built to answer,
      which is the use this row records.
clinical_trials:
- name: NCT01456936
  phase: PHASE_IV
  status: COMPLETED
  description: >-
    EAGLES: a four-arm, triple-dummy comparison of varenicline, bupropion,
    nicotine patch and placebo in 8144 smokers with and without psychiatric
    disorders, at 140 centres in 16 countries. Powered on a composite
    neuropsychiatric adverse-event endpoint, with biochemically confirmed
    continuous abstinence for weeks 9 to 12 as the efficacy endpoint.
  target_phenotypes:
  - preferred_term: Addictive nicotine use
    term:
      id: HP:0033543
      label: Addictive nicotine use
  evidence:
  - reference: PMID:27116918
    reference_title: "Neuropsychiatric safety and efficacy of varenicline, bupropion, and nicotine patch in smokers with and without psychiatric disorders (EAGLES): a double-blind, randomised, placebo-controlled clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      8144 participants were randomly assigned, 4116 to the psychiatric cohort
      (4074 included in the safety analysis) and 4028 to the non-psychiatric
      cohort (3984 included in the safety analysis).
    explanation: >-
      Gives the enrolment and the split between the two cohorts, which is what
      lets the trial speak to the psychiatric comorbidity common in this
      disorder.
- name: NCT01314001
  phase: PHASE_IV
  status: COMPLETED
  description: >-
    A nicotine-metabolite-ratio-stratified, placebo-controlled trial of
    nicotine patch and varenicline in 1246 treatment-seeking smokers at four
    sites, randomising within slow and normal metaboliser strata so that the
    biomarker-by-treatment interaction could be tested prospectively.
  target_phenotypes:
  - preferred_term: Addictive nicotine use
    term:
      id: HP:0033543
      label: Addictive nicotine use
  evidence:
  - reference: PMID:25588294
    reference_title: "Use of the nicotine metabolite ratio as a genetically informed biomarker of response to nicotine patch or varenicline for smoking cessation: a randomised, double-blind placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      1246 participants (662 slow metabolisers of nicotine, 584 normal
      metabolisers of nicotine) were enrolled and randomly assigned to the
      three interventions (408 placebo, 418 nicotine patch, 420 varenicline).
    explanation: >-
      Gives the enrolment by stratum and arm, which is the design feature that
      makes the interaction result prospective rather than post hoc.
animal_models:
- name: Chrna5 null mouse
  species: Mouse
  genotype: Chrna5 null mutation (homozygous)
  publication: PMID:21278726
  description: >-
    The model that identified the habenulo-interpeduncular aversion circuit.
    Knockout mice self-administer far more nicotine than wild types, most
    markedly at high unit doses, and the effect is rescued by re-expressing
    the subunit in the medial habenula alone.
  genes:
  - preferred_term: Chrna5
    term:
      id: MGI:87889
      label: Chrna5
  modeled_mechanisms:
  - target: Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      A complete null of the subunit whose partial loss of function the human
      risk allele produces, in the circuit the node is about.
    limitations: >-
      A null mutation is not the human allele: rs16969968 reduces alpha-5
      function partially rather than abolishing the subunit, so the model
      exaggerates the genotype it stands for. The behavioural readout is
      intravenous self-administration in a cage, not smoking, and the
      corresponding circuit measurement has not been made in human carriers.
    readouts:
    - name: Intravenous nicotine self-administration across unit doses
      target: Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
      direction: INCREASED
      interpretation: >-
        Loss of the dose-limiting signal, read out as failure to titrate
        intake as the available unit dose rises.
      evidence:
      - reference: PMID:21278726
        reference_title: Habenular α5 nicotinic receptor subunit signalling controls nicotine intake.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In contrast, knockout mice did not titrate their responding and
          consumed greater amounts of nicotine as the dose increased
        explanation: >-
          The measurement itself: wild types held intake near a fixed amount
          per session while knockouts did not.
    evidence:
    - reference: PMID:21278726
      reference_title: Habenular α5 nicotinic receptor subunit signalling controls nicotine intake.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, nicotine intake was indistinguishable in knockout versus
        wildtype mice after injection of a lentivirus vector (Lenti-CHRNA5)
        into the MHb to rescue α5 nAChR subunits in the habenulo-interpeduncular
        tract
      explanation: >-
        The habenular rescue, which is what makes this model informative about
        the circuit rather than about the subunit in general.
- name: Chrnb2 null mouse
  species: Mouse
  genotype: Chrnb2 null mutation (homozygous)
  publication: PMID:9428762
  description: >-
    Deleting the beta-2 subunit abolishes the dopaminergic response to nicotine
    and reduces nicotine self-administration, establishing the receptor
    requirement at the top of this entry's pathograph.
  genes:
  - preferred_term: Chrnb2
    term:
      id: MGI:87891
      label: Chrnb2
  modeled_mechanisms:
  - target: Nicotinic Acetylcholine Receptor Agonism by Nicotine
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Removes the subunit the node depends on, and shows the node's downstream
      effect disappears with it.
    limitations: >-
      A constitutive germline null, so developmental compensation cannot be
      excluded, and no human carries it. It establishes necessity of the
      subunit, not the quantitative contribution of this receptor in a smoker.
    readouts:
    - name: Nicotine-evoked dopamine release in ventral striatum
      target: Nicotinic Acetylcholine Receptor Agonism by Nicotine
      direction: ABOLISHED
      interpretation: >-
        Without beta-2 the agonism node has no downstream dopaminergic effect.
      evidence:
      - reference: PMID:9428762
        reference_title: Acetylcholine receptors containing the beta2 subunit are involved in the reinforcing properties of nicotine.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found that nicotine stimulates dopamine release in the ventral
          striatum of wild-type mice but not in the ventral striatum of
          beta2-mutant mice.
        explanation: >-
          The microdialysis measurement, in wild-type and mutant mice side by
          side.
- name: Chrna4 Leu9'Ala hypersensitive knock-in mouse
  species: Mouse
  genotype: Chrna4 Leu9'Ala knock-in (M2 domain point mutation)
  publication: PMID:15528443
  description: >-
    A gain-of-sensitivity knock-in that makes alpha-4-containing receptors
    respond to nicotine doses too low to act on other subtypes, so the
    contribution of this one receptor can be tested in isolation. Reward,
    tolerance and sensitisation all follow from activating it alone.
  genes:
  - preferred_term: Chrna4
    term:
      id: MGI:87888
      label: Chrna4
  modeled_mechanisms:
  - target: Nicotinic Acetylcholine Receptor Agonism by Nicotine
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Isolates the alpha-4-containing receptor as the sufficient target for the
      dependence-relevant effects this node produces.
    limitations: >-
      The receptor is engineered hypersensitive rather than expressed normally,
      so the doses used are not the doses a smoker achieves, and sufficiency in
      this preparation does not establish that alpha-4 carries the whole effect
      at physiological occupancy.
    readouts:
    - name: Conditioned place preference, tolerance and locomotor sensitisation
      target: Nicotinic Acetylcholine Receptor Agonism by Nicotine
      direction: INCREASED
      interpretation: >-
        The three dependence-relevant behavioural phenotypes follow from
        selective activation of this receptor.
      evidence:
      - reference: PMID:15528443
        reference_title: "Nicotine activation of alpha4* receptors: sufficient for reward, tolerance, and sensitization."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Selective activation of a4* nicotinic acetylcholine receptors with
          low doses of agonist recapitulates nicotine effects thought to be
          important in dependence, including reinforcement in response to acute
          nicotine administration, as well as tolerance and sensitization
          elicited by chronic nicotine administration.
        explanation: >-
          Names the three readouts and the fact that low agonist doses
          sufficed, which is the design that makes the receptor attribution
          possible.
discussions:
- discussion_id: nd_cytisinicline_target_engagement
  kind: CONTROVERSY
  prompt: >-
    Does cytisinicline work through the alpha-4-beta-2 receptor at the doses
    used clinically?
  attaches_to:
  - pathophysiology#Partial Agonist Occupancy of Alpha4Beta2 Nicotinic Receptors
  - treatments#Cytisinicline
  rationale: >-
    The drug is described, including in its own trial report, as acting on the
    alpha-4-beta-2 receptor like varenicline. A pharmacokinetic analysis
    predicts the opposite: that at recommended doses cytisine does not reach
    brain concentrations sufficient to affect that receptor, and attributes
    varenicline's superior trial performance to exactly that difference. Both
    claims are recorded on the target node, one as SUPPORT and one as REFUTE.
    The tension is not merely historical, because the trial that established
    efficacy in the United States used a new, pharmacokinetically based dosing
    schedule rather than the traditional regimen the prediction was made for,
    so the prediction may simply not apply to the regimen now in use. No
    measurement of receptor occupancy under the new schedule is cited here,
    and until one exists the mechanism of a drug with a positive phase 3
    result is open.
- discussion_id: nd_habenular_circuit_unmeasured_in_humans
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has the habenulo-interpeduncular aversion circuit ever been measured in
    human CHRNA5 risk-allele carriers?
  attaches_to:
  - pathophysiology#Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
  - mechanistic_hypotheses#nd_alpha5_aversion_brake
  rationale: >-
    This entry's account of how the strongest genetic risk factor in the trait
    produces risk rests on joining two separately established facts: that the
    human allele reduces alpha-5 function and raises dependence risk, and that
    the rodent circuit limits intake. No cited work measures the circuit in
    people, and the rodent experiments used a null mutation rather than the
    partial loss of function the human allele produces. The node is marked
    PROVISIONAL for this reason. The gap matters beyond bookkeeping, because
    the circuit is being discussed as a therapeutic target and a target
    inferred across a species and an allele-strength gap is a weaker
    proposition than one measured in carriers.
  proposed_experiments:
  - experiment_id: nd_habenular_response_by_genotype
    name: Habenular response to a nicotine challenge, stratified by rs16969968 genotype
    experiment_design: HUMAN_OBSERVATIONAL
    description: >-
      Image the habenulo-interpeduncular response to an aversive-range nicotine
      challenge in smokers grouped by rs16969968 genotype, and test whether
      carriers show the reduced response the rodent work predicts. The
      measurement is the part that does not exist; the genotyping and the
      challenge paradigm both do.
    would_support:
    - pathophysiology#Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
    supporting_outcome:
    - >-
      Risk-allele carriers show a smaller habenular or interpeduncular
      response to the higher nicotine dose than non-carriers, with the
      difference confined to the aversive dose range rather than present at
      rewarding doses.
    would_refute:
    - pathophysiology#Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
    refuting_outcome:
    - >-
      Carriers and non-carriers show the same habenular response across the
      dose range, which would leave the human association to be explained by
      another consequence of the allele.
- discussion_id: nd_chrna5_null_versus_human_allele
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does a Chrna5 null mouse model the human risk allele, which only partially
    reduces subunit function?
  attaches_to:
  - pathophysiology#Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
  - mechanistic_hypotheses#nd_alpha5_aversion_brake
  rationale: >-
    The circuit result comes from the Chrna5 null mouse recorded below and
    from shRNA knockdown in rats.
    The human allele is a missense change that reduces function partially, and
    carries an odds ratio of about 1.3 rather than abolishing the brake. So the
    model's genotype is more severe than the one it stands for, and the size of
    the behavioural effect in the mouse is not a guide to the size of the
    effect in a carrier. This is a translational-validity question rather than
    an absence of evidence: the rodent result is solid, and what is uncertain
    is how much of it carries across.
  proposed_experiments:
  - experiment_id: nd_missense_knockin_versus_null
    name: Knock-in of the human rs16969968 equivalent in place of a null
    experiment_design: TARGETED_PERTURBATION
    description: >-
      Compare intake titration and interpeduncular activation between animals
      carrying the orthologous missense substitution and animals carrying the
      null, so the dose-response consequence of partial rather than complete
      loss of function can be read directly.
    would_support:
    - pathophysiology#Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
    supporting_outcome:
    - >-
      The missense knock-in shows the same loss of intake titration as the
      null, in attenuated form, confirming that partial loss of function is
      enough to weaken the brake.
    would_refute:
    - pathophysiology#Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
    refuting_outcome:
    - >-
      The missense knock-in titrates intake like a wild type, which would mean
      the null result overstates what the human allele does and the human
      association needs another mechanism.

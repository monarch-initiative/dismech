name: Nicotine Dependence
creation_date: "2026-11-19T00:00:00Z"
category: Psychiatric
description: >-
  Nicotine dependence is a chronic, relapsing disorder in which repeated
  self-administration of nicotine, in most of the world through combusted
  tobacco, produces a compulsive pattern of use that persists against the
  user's own intention to stop. Nicotine is the reinforcing constituent, and
  its pharmacology is the whole of the mechanism: agonism at high-affinity
  heteromeric nicotinic acetylcholine receptors on midbrain dopaminergic
  neurons drives mesolimbic dopamine release, chronic exposure upregulates
  those receptors, and abstinence produces a reward deficit and a stress-system
  recruitment that make continued use negatively reinforced. A second,
  opposing circuit limits intake: the habenulo-interpeduncular pathway signals
  the aversive effects of higher nicotine doses, and the common CHRNA5 risk
  allele weakens that brake. The disorder matters out of proportion to its
  symptoms because the dependence sustains an exposure that is itself
  carcinogenic and atherogenic.
disease_term:
  preferred_term: nicotine dependence
  term:
    id: MONDO:0008575
    label: nicotine dependence
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:F17.2
      label: Nicotine dependence
    mapping_predicate: skos:exactMatch
    mapping_source: dismech curation
    mapping_justification: >-
      MONDO cross-references nicotine dependence (MONDO:0008575) to ICD-10-CM
      F17.2, read from the MONDO OLS entity record on 2026-11-19. The two
      labels are the same string and the concepts are co-extensive, so the
      mapping is recorded as an exact match. ICD-10-CM subdivides F17.2 by
      product (cigarettes, chewing tobacco, other) and by complication
      (uncomplicated, in remission, with withdrawal); those children are
      narrower than this entry and are not separately mapped.
synonyms:
- Nicotine addiction
- Tobacco use disorder
- Tobacco dependence
- Cigarette smoking dependence
parents:
- Substance Use Disorder
- Mental Health Disorder
notes: >-
  The entry is named and bound to nicotine dependence rather than to the DSM-5
  construct tobacco use disorder, which its two sibling entries
  (Alcohol_Use_Disorder, Opioid_Use_Disorder) would suggest. Tobacco use
  disorder is not co-extensive with the binding in either direction: it admits
  harmful patterns of tobacco use without physiological dependence, and it
  excludes dependence maintained by a non-tobacco nicotine product. Most of
  the cited cohorts and trials ascertain daily cigarette smokers scoring at or
  above a Fagerstrom threshold, which is narrower again; each claim below is
  scoped to what its source measured.
  No ontology term was bound for the craving phenotype. A search of HPO
  through the OLS adapter for l~craving on 2026-11-19 returned only
  HP:0030083 Salt craving, HP:0030221 Sweet craving and HP:6000785 Protein
  craving, and l~urge returned only urinary and bowel urgency and three focal
  autonomic seizure terms; HPO has no drug-craving or tobacco-craving class, so
  that row carries a free-text preferred_term only.
  The habenulo-interpeduncular mechanism is established in rodents and inferred
  in humans from the direction of the CHRNA5 association; no human measurement
  of that pathway is cited, and the node is marked PROVISIONAL accordingly.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    No population-based estimate of diagnosed nicotine dependence was located.
    The Global Burden of Disease 2019 figure below counts current smokers
    rather than people meeting dependence criteria, so it is recorded as a
    qualitative tier and not as a rate. The exposure prevalence itself is
    carried in clinical_burden and in the environmental section.
  evidence:
  - reference: PMID:34051883
    reference_title: "Spatial, temporal, and demographic patterns in prevalence of smoking tobacco use and attributable disease burden in 204 countries and territories, 1990-2019: a systematic analysis from the Global Burden of Disease Study 2019."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Globally in 2019, 1·14 billion (95% uncertainty interval 1·13-1·16)
      individuals were current smokers, who consumed 7·41 trillion (7·11-7·74)
      cigarette-equivalents of tobacco in 2019.
    explanation: >-
      Establishes that the exposure is held by over a billion people, which
      places the dependence well above any rare-disease band. It is indirect
      because the denominator is current smoking rather than diagnosed
      dependence.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    The burden of nicotine dependence is almost entirely the burden of the
    exposure it maintains rather than of the psychiatric syndrome itself:
    smoking was the leading risk factor for death among males worldwide in
    2019, and the great majority of those deaths were in people who were still
    smoking rather than in former smokers.
  evidence:
  - reference: PMID:34051883
    reference_title: "Spatial, temporal, and demographic patterns in prevalence of smoking tobacco use and attributable disease burden in 204 countries and territories, 1990-2019: a systematic analysis from the Global Burden of Disease Study 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Globally in 2019, smoking tobacco use accounted for 7·69 million
      (7·16-8·20) deaths and 200 million (185-214) disability-adjusted
      life-years, and was the leading risk factor for death among males (20·2%
      [19·3-21·1] of male deaths).
    explanation: >-
      Quantifies the attributable mortality and disability that continued
      smoking produces.
  - reference: PMID:21278726
    reference_title: Habenular α5 nicotinic receptor subunit signalling controls nicotine intake.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tobacco smoking results in greater than 5 million deaths each year and
      accounts for almost 90% of all deaths from lung cancer
    explanation: >-
      States the share of lung-cancer mortality attributable to smoking, which
      the Global Burden of Disease analysis does not break out in the quoted
      passage. Quoted from this paper's introduction, where it restates
      epidemiology established elsewhere, rather than from its own
      rodent experiments.
inheritance:
- name: Polygenic (multifactorial) liability
  inheritance_term:
    preferred_term: polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Nicotine dependence is a complex trait. Twin estimates of heritability are
    moderate to high but move with the construct measured, and the single
    strongest common-variant signal is the CHRNA5 missense allele described in
    the genetic section.
  evidence:
  - reference: PMID:27052577
    reference_title: Genome-wide single nucleotide polymorphism heritability of nicotine dependence as a multidimensional phenotype.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heritability estimates from twin studies of the multi-faceted phenotype
      of nicotine dependence (ND) range from moderate to high (31-60%), but
      vary substantially based on the specific ND-related construct examined.
    explanation: >-
      Gives the twin-study heritability range and, in the same sentence, the
      reason a single figure cannot be quoted: the estimate depends on which
      dependence construct is measured. Quoted from the paper's background
      section, where it summarises the prior twin literature rather than this
      study's own SNP-heritability result.
pathophysiology:
- name: Polygenic Susceptibility to Nicotine Dependence
  biological_scale: MOLECULAR
  node_class: GENETIC_PREDISPOSITION
  description: >-
    Common and low-frequency variation at the CHRNA5-CHRNA3-CHRNB4 cluster on
    chromosome 15q25 shifts liability to dependence and to heavy smoking. It is
    the strongest and most replicated signal in the trait, and its lead allele
    reduces the function of the alpha-5 subunit rather than increasing it,
    which is why the downstream edge runs to a loss of the aversion brake
    rather than to a gain in reward. The molecular function bound here is that
    of the receptor these three subunits assemble into, marked DECREASED for
    the lead allele's direction of effect. Liability carried by CYP2A6 is a
    separate, pharmacokinetic route and is curated on the clearance node.
  molecular_functions:
  - preferred_term: nicotinic acetylcholine receptor channel activity
    term:
      id: GO:0022848
      label: acetylcholine-gated monoatomic cation-selective channel activity
    modifier: DECREASED
  genes:
  - preferred_term: CHRNA5
    term:
      id: hgnc:1959
      label: CHRNA5
  - preferred_term: CHRNA3
    term:
      id: hgnc:1957
      label: CHRNA3
  - preferred_term: CHRNB4
    term:
      id: hgnc:1964
      label: CHRNB4
  evidence:
  - reference: PMID:26239294
    reference_title: "Rare, low frequency and common coding variants in CHRNA5 and their contribution to nicotine dependence in European and African Americans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that common, low frequency and rare CHRNA5 coding
      variants are independently associated with nicotine dependence risk.
    explanation: >-
      Targeted sequencing of 1582 dependent cases and 1238 controls with
      exome-chip replication, establishing that liability at this locus is
      carried by several independent coding variants rather than by the lead
      SNP alone.
  downstream:
  - target: Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
    causal_link_type: DIRECT
    description: >-
      The CHRNA5 risk allele reduces alpha-5 subunit function, and the alpha-5
      subunit is densely expressed in the habenulo-interpeduncular pathway, so
      the liability allele weakens the circuit that limits intake.
    evidence:
    - reference: PMID:21278726
      reference_title: Habenular α5 nicotinic receptor subunit signalling controls nicotine intake.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In particular, polymorphisms in the α5 subunit gene (CHRNA5), which
        result in decreased function of the subunit, increase vulnerability to
        tobacco addiction
      explanation: >-
        States the direction of the human allele's functional effect, which is
        what makes the rodent loss-of-function result the right model for the
        human risk allele. Indirect because the human studies measured
        dependence risk and not habenular signalling, and quoted from this
        paper's introduction rather than from its own experiments.
  - target: Nicotine Clearance Rate Set by CYP2A6 Activity
    causal_link_type: DIRECT
    description: >-
      CYP2A6 genotype sets the enzyme activity that determines nicotine
      clearance, which is a separate route from the receptor cluster.
- name: Nicotinic Acetylcholine Receptor Agonism by Nicotine
  biological_scale: MOLECULAR
  description: >-
    Inhaled nicotine reaches the brain within seconds of a puff and acts as an
    agonist at neuronal nicotinic acetylcholine receptors, which are
    ligand-gated cation channels assembled from five subunits. The subtypes
    that carry the addictive effects are the high-affinity heteromers
    containing alpha-4 and beta-2; the beta-2 subunit is required for nicotine
    to reach the dopamine system at all, and selective activation of
    alpha-4-containing receptors is on its own enough to produce reinforcement,
    tolerance and sensitisation.
  molecular_functions:
  - preferred_term: nicotinic acetylcholine receptor channel activity
    term:
      id: GO:0022848
      label: acetylcholine-gated monoatomic cation-selective channel activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: nicotinic acetylcholine receptor signalling
    term:
      id: GO:0095500
      label: acetylcholine receptor signaling pathway
    modifier: INCREASED
  genes:
  - preferred_term: CHRNA4
    term:
      id: hgnc:1958
      label: CHRNA4
  - preferred_term: CHRNB2
    term:
      id: hgnc:1962
      label: CHRNB2
  chemical_entities:
  - preferred_term: nicotine
    term:
      id: CHEBI:18723
      label: nicotine
  triggers:
  - preferred_term: exposure to nicotine via inhalation
    term:
      id: ECTO:0900393
      label: exposure to nicotine via inhalation
  evidence:
  - reference: PMID:15528443
    reference_title: "Nicotine activation of alpha4* receptors: sufficient for reward, tolerance, and sensitization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data indicate that activation of a4* receptors is sufficient for
      nicotine-induced reward, tolerance, and sensitization.
    explanation: >-
      Mice carrying a Leu9'-to-Ala9' point mutation that makes
      alpha-4-containing receptors hypersensitive show reinforcement,
      tolerance and sensitisation at agonist doses too low to act elsewhere,
      so this receptor is sufficient for the core dependence phenotypes.
  - reference: PMID:21278726
    reference_title: Habenular α5 nicotinic receptor subunit signalling controls nicotine intake.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      The predominant nAChR subtypes in mammalian brain that have been heavily
      implicated in regulating the addictive properties of nicotine are those
      containing α4 and β2 subunits (denoted α4β2* nAChRs)
    explanation: >-
      Identifies the subunit composition this node is about. Quoted from the
      paper's introduction, where it summarises a body of earlier work rather
      than reporting a result of its own, so the evidence type is the review
      synthesis the sentence carries rather than this paper's rodent
      experiments.
  - reference: PMID:37696529
    reference_title: "Pharmacological and electronic cigarette interventions for smoking cessation in adults: component network meta-analyses."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-nicotine/placebo e-cigarettes (OR 1.16, 95% CrI 0.74 to 1.80; 8 RCTs,
      1094 participants; low-certainty evidence), equating to one additional
      quitter (95% CrI -2 to 5), had point estimates favouring the intervention
      over control, but CrIs encompassed the potential for no difference and
      harm.
    explanation: >-
      A device-controlled contrast at clinical scale. Nicotine e-cigarettes
      raise quit rates with high-certainty evidence while e-cigarettes without
      nicotine do not clearly beat control, so the pharmacology rather than
      the inhalation ritual is what the treatment effect runs through. Indirect
      because it is a cessation outcome rather than a receptor measurement.
  downstream:
  - target: Ventral Tegmental Dopamine Neuron Activation and Mesolimbic Dopamine Release
    causal_link_type: DIRECT
    description: >-
      Agonism at beta-2-containing receptors on midbrain dopaminergic neurons
      depolarises them; without that subunit nicotine does not reach the
      dopamine system.
    evidence:
    - reference: PMID:9428762
      reference_title: Acetylcholine receptors containing the beta2 subunit are involved in the reinforcing properties of nicotine.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using patch-clamp recording, we show that mesencephalic dopaminergic
        neurons from mice without the beta2 subunit no longer respond to
        nicotine, and that self-administration of nicotine is attenuated in
        these mutant mice.
      explanation: >-
        Puts the receptor requirement and the behavioural consequence in one
        experiment: deleting beta-2 abolishes the dopaminergic response to
        nicotine and reduces how hard the animal works for it.
  - target: Nicotinic Receptor Upregulation and Desensitization
    causal_link_type: DIRECT
    description: >-
      Sustained agonist occupancy at the concentrations smoking produces both
      desensitises the receptor and increases the number of high-affinity
      binding sites.
- name: Ventral Tegmental Dopamine Neuron Activation and Mesolimbic Dopamine Release
  conforms_to: "addiction_cycle#Acute Mesolimbic Dopamine Reinforcement"
  biological_scale: CELLULAR
  description: >-
    Nicotinic agonism on ventral tegmental dopaminergic neurons raises their
    firing rate and, more specifically, the number and length of phasic bursts.
    Because the nucleus accumbens shell and the dorsolateral striatum have
    different frequency dependences for dopamine release, the shift towards
    bursting raises dopamine preferentially in the shell. This is the step
    nicotine shares with every other drug of abuse, and the step the addiction
    cycle module anchors.
  biological_processes:
  - preferred_term: mesolimbic dopamine release
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: INCREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  locations:
  - preferred_term: ventral tegmental area
    term:
      id: UBERON:0002691
      label: ventral tegmental area
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  evidence:
  - reference: PMID:2899326
    reference_title: Drugs abused by humans preferentially increase synaptic dopamine concentrations in the mesolimbic system of freely moving rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Drugs abused by humans (e.g., opiates, ethanol, nicotine, amphetamine,
      and cocaine) increased extracellular dopamine concentrations in both
      areas, but especially in the accumbens, and elicited hypermotility at low
      doses.
    explanation: >-
      Brain dialysis in freely moving rats, with nicotine among the drugs
      tested, establishing the preferential rise in accumbens dopamine that
      this node asserts.
  - reference: PMID:19339599
    reference_title: Dopamine signaling differences in the nucleus accumbens and dorsal striatum exploited by nicotine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nicotine administration increased the firing frequency of dopamine
      neurons and specifically increased the number and the length of phasic
      burst firing.
    explanation: >-
      In vivo unit recording from putative midbrain dopamine neurons in freely
      moving rats, giving the firing change that underlies the release change.
  - reference: PMID:19339599
    reference_title: Dopamine signaling differences in the nucleus accumbens and dorsal striatum exploited by nicotine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By favoring release from bursts while depressing release from tonic
      signals, nicotine spreads the range of dopamine signaling and effectively
      increases the signal-to-noise relationship along dopamine afferents.
    explanation: >-
      States the mechanism by which a firing change becomes a
      region-specific release change, which is why the shell and the
      dorsolateral striatum respond differently to the same drug.
  downstream:
  - target: Incentive Salience and Smoking Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      Phasic dopamine release paired with the cues and acts of smoking is the
      teaching signal that gives those cues motivational value.
  - target: Reward Deficit and Stress-System Recruitment in Nicotine Abstinence
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Repeated supraphysiological mesolimbic dopamine signalling
    description: >-
      Repetition of the acute dopamine signal, many times a day for years, is
      what recruits the opponent adaptation; a single exposure does not.
- name: Nicotinic Receptor Upregulation and Desensitization
  biological_scale: MOLECULAR
  description: >-
    Chronic nicotine increases the number of high-affinity beta-2-containing
    receptors while a large fraction of them sit desensitised at the
    concentrations smoking sustains. In smokers the excess binding is
    measurable in vivo and does not return to never-smoker levels for weeks
    after the last cigarette, which is the molecular state the early abstinent
    patient is in. The upregulation is nicotine-specific rather than part of
    the shared addiction cycle, so it stays on this entry.
  molecular_functions:
  - preferred_term: nicotinic acetylcholine receptor channel activity
    term:
      id: GO:0022848
      label: acetylcholine-gated monoatomic cation-selective channel activity
    modifier: INCREASED
  locations:
  - preferred_term: dorsal striatum
    term:
      id: UBERON:0005382
      label: dorsal striatum
  - preferred_term: prefrontal cortex
    term:
      id: UBERON:0000451
      label: prefrontal cortex
  evidence:
  - reference: PMID:19487632
    reference_title: beta2-Nicotinic acetylcholine receptor availability during acute and prolonged abstinence from tobacco smoking.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with nonsmokers, beta(2)*-nAChR availability in the striatum,
      cortex, and cerebellum of smokers was not different at 1 day of
      abstinence, was significantly higher at 1 week of abstinence, and was not
      different at 4 or at 6 to 12 weeks of abstinence.
    explanation: >-
      Serial SPECT in 19 smokers against 20 age-matched nonsmokers, giving both
      the excess availability and its time course. Note the measured
      difference is significant at one week and not at four, so this entry does
      not claim a month-long elevation.
  - reference: PMID:41559453
    reference_title: "Multiple sources of β2*-nicotinic acetylcholine receptor binding are differentially affected during tobacco smoking abstinence as revealed by Independent Component Analysis of [(18)F]Flubatine PET images."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Chronic nicotine administration robustly upregulates (i.e., increases the
      number of) β2*-nAChRs in most brain regions across animal models,
      postmortem human brain, and human imaging
    explanation: >-
      States that the upregulation replicates across rodent, postmortem human
      and human imaging work, which no single cited study does. Quoted from
      this paper's introduction: its own PET result is that two of three
      independent components load lower in abstinent smokers than in
      non-smokers, so the generalisation must not be attributed to it.
  downstream:
  - target: Reward Deficit and Stress-System Recruitment in Nicotine Abstinence
    causal_link_type: DIRECT
    description: >-
      A larger population of receptors left unoccupied when nicotine is
      withdrawn is part of what makes the abstinent state aversive.
  - target: Tobacco craving
    causal_link_type: DIRECT
    description: >-
      Residual receptor availability during abstinence tracks how strongly the
      patient reports craving on the same day.
    evidence:
    - reference: PMID:19487632
      reference_title: beta2-Nicotinic acetylcholine receptor availability during acute and prolonged abstinence from tobacco smoking.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, cerebellar beta(2)*-nAChR availability at 4 weeks of
        abstinence was positively correlated with craving on the day of the
        SPECT scan.
      explanation: >-
        A within-smoker correlation between receptor availability and
        same-day craving. Indirect because a correlation at one region and one
        timepoint does not establish that the receptor state produces the
        craving.
- name: Habenulo-Interpeduncular Nicotinic Aversion Signalling Deficit
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The medial habenula projects almost exclusively to the interpeduncular
    nucleus, and alpha-5-containing receptors on that projection carry an
    inhibitory motivational signal that the higher nicotine doses recruit.
    Removing or knocking down the alpha-5 subunit, or inactivating the
    interpeduncular nucleus, raises nicotine intake without altering how
    rewarding low doses are, so the circuit is a brake on consumption rather
    than a contributor to reward. Reduced signalling here is the mechanism
    through which the CHRNA5 risk allele is thought to act in smokers; that
    step is inferred from the direction of the human association rather than
    measured in people, which is why the node is provisional.
  molecular_functions:
  - preferred_term: alpha-5-containing nicotinic receptor channel activity
    term:
      id: GO:0022848
      label: acetylcholine-gated monoatomic cation-selective channel activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: aversive signalling through the habenulo-interpeduncular pathway
    term:
      id: GO:0095500
      label: acetylcholine receptor signaling pathway
    modifier: DECREASED
  genes:
  - preferred_term: CHRNA5
    term:
      id: hgnc:1959
      label: CHRNA5
  locations:
  - preferred_term: medial habenula
    term:
      id: UBERON:0001942
      label: medial habenular nucleus
  - preferred_term: interpeduncular nucleus
    term:
      id: UBERON:0002145
      label: interpeduncular nucleus
  evidence:
  - reference: PMID:21278726
    reference_title: Habenular α5 nicotinic receptor subunit signalling controls nicotine intake.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings indicate that nicotine activates the
      habenulo-interpeduncular pathway through α5-containing nAChRs,
      triggering an inhibitory motivational signal that acts to limit nicotine
      intake.
    explanation: >-
      The paper's own conclusion from Chrna5 knockout mice, habenular rescue
      and knockdown in rats, and interpeduncular inactivation, which together
      establish the circuit and the direction of its effect on intake.
  - reference: PMID:21278726
    reference_title: Habenular α5 nicotinic receptor subunit signalling controls nicotine intake.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Remarkably, α5 subunit knockdown in MHb did not alter the rewarding
      effects of nicotine but abolished the inhibitory effects of higher
      nicotine doses on brain reward systems.
    explanation: >-
      Separates the two motivational drives: the brain-stimulation reward
      threshold still falls at low doses after knockdown, and only the
      dose-limiting aversive arm is lost. This is why the node is drawn as a
      lost brake and not as increased reward.
  downstream:
  - target: Compulsive Tobacco Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      With the dose-limiting signal weakened, the range of nicotine doses that
      are net reinforcing widens and consumption rises.
    evidence:
    - reference: PMID:21278726
      reference_title: Habenular α5 nicotinic receptor subunit signalling controls nicotine intake.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we report markedly increased nicotine intake in mice with a null
        mutation in Chrna5.
      explanation: >-
        The behavioural consequence of losing the subunit, measured as
        intravenous nicotine self-administration.
- name: Nicotine Clearance Rate Set by CYP2A6 Activity
  biological_scale: MOLECULAR
  description: >-
    CYP2A6 performs most of the conversion of nicotine to cotinine, so its
    activity sets how fast brain nicotine falls between cigarettes. The ratio
    of 3'-hydroxycotinine to cotinine in a single sample reads that activity
    out, which makes the rate measurable in a clinic. Faster clearance means a
    shorter interval before the receptor population is unoccupied again, and in
    a randomised trial it changes which pharmacotherapy works: it is the one
    node in this entry with an established treatment-selection consequence.
  molecular_functions:
  - preferred_term: CYP2A6 nicotine C-oxidation
    term:
      id: GO:0004497
      label: monooxygenase activity
  genes:
  - preferred_term: CYP2A6
    term:
      id: hgnc:2610
      label: CYP2A6
  chemical_entities:
  - preferred_term: nicotine
    term:
      id: CHEBI:18723
      label: nicotine
  - preferred_term: cotinine
    term:
      id: CHEBI:749089
      label: cotinine
  evidence:
  - reference: PMID:25588294
    reference_title: "Use of the nicotine metabolite ratio as a genetically informed biomarker of response to nicotine patch or varenicline for smoking cessation: a randomised, double-blind placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At end of treatment, varenicline was more efficacious than nicotine patch
      in normal metabolisers (OR 2·17, 95% CI 1·38-3·42; p=0·001), but not in
      slow metabolisers (OR 1·13, 0·74-1·71; p=0·56).
    explanation: >-
      A trial randomised and stratified on the metabolite ratio itself, so the
      interaction is prospectively tested rather than found in subgroups after
      the fact. This is what makes the clearance rate a mechanism node and not
      only a pharmacokinetic detail.
  downstream:
  - target: Compulsive Tobacco Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      A shorter interval to an unoccupied receptor population shortens the
      interval to the next cigarette, so clearance rate contributes to how much
      is smoked.
- name: Incentive Salience and Smoking Cue Reactivity
  conforms_to: "addiction_cycle#Incentive Salience and Habit Formation"
  biological_scale: CELLULAR
  description: >-
    The cues that accompany smoking acquire motivational value through
    pavlovian learning, and control over seeking migrates from goal-directed to
    habitual as it moves from ventral to more dorsal striatum. In smoking this
    learning is unusually heavily rehearsed: a pack-a-day smoker repeats the
    drug-cue pairing on the order of two hundred times a day, which is an
    order of magnitude more trials than most other drugs of abuse deliver.
  biological_processes:
  - preferred_term: drug-cue conditioning and habit learning
    term:
      id: GO:0008306
      label: associative learning
    modifier: INCREASED
  locations:
  - preferred_term: ventral striatum
    term:
      id: UBERON:0005403
      label: ventral striatum
  - preferred_term: dorsal striatum
    term:
      id: UBERON:0005382
      label: dorsal striatum
  evidence:
  - reference: PMID:16251991
    reference_title: "Neural systems of reinforcement for drug addiction: from actions to habits to compulsion."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      We hypothesize that the change from voluntary drug use to more habitual
      and compulsive drug use represents a transition at the neural level from
      prefrontal cortical to striatal control over drug seeking and drug taking
      behavior as well as a progression from ventral to more dorsal domains of
      the striatum, involving its dopaminergic innervation.
    explanation: >-
      The framework statement of the ventral-to-dorsal transition this node
      asserts. It is the authors' hypothesis in a review rather than a result,
      and it is not nicotine-specific.
  downstream:
  - target: Compulsive Tobacco Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Once seeking is habitual and cue-driven it continues without being
      re-decided, which is the behavioural form loss of control takes.
- name: Reward Deficit and Stress-System Recruitment in Nicotine Abstinence
  conforms_to: "addiction_cycle#Reward Deficit and Stress-System Recruitment"
  biological_scale: ORGANISM
  description: >-
    Abstinence from nicotine lowers the function of the dopamine component of
    the reward system and recruits the extended-amygdala stress
    neurotransmitters, so that smoking comes to relieve a negative state rather
    than to produce a positive one. This is the opponent-process adaptation the
    addiction cycle module names as its key conformance target, and it is the
    stage at which nicotine dependence becomes self-sustaining: the patient now
    has a reason to smoke that does not depend on nicotine being pleasant.
  biological_processes:
  - preferred_term: reduced mesolimbic dopamine release
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  - preferred_term: corticotropin-releasing factor signalling in the extended amygdala
    term:
      id: GO:0071376
      label: cellular response to corticotropin-releasing hormone stimulus
    modifier: INCREASED
  locations:
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  - preferred_term: central amygdala
    term:
      id: UBERON:0002883
      label: central amygdaloid nucleus
  - preferred_term: bed nucleus of the stria terminalis
    term:
      id: UBERON:0001880
      label: bed nucleus of stria terminalis
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The increases in negative emotional states and dysphoric and stress-like
      responses in the withdrawal/negative affect stage involve decreases in the
      function of the dopamine component of the reward system and recruitment
      of brain stress neurotransmitters, such as corticotropin-releasing factor
      and dynorphin, in the neurocircuitry of the extended amygdala.
    explanation: >-
      Names both arms of the adaptation this node carries, which is the
      statement the addiction cycle module is built on. A review synthesis
      across substances rather than a nicotine measurement.
  downstream:
  - target: Nicotine Withdrawal Syndrome
    causal_link_type: DIRECT
    description: >-
      The negative affective state is what the patient experiences and reports
      as withdrawal when nicotine is stopped.
  - target: Prefrontal Executive Control Deficit
    causal_link_type: DIRECT
    description: >-
      Prefrontal regulation of the basal ganglia and extended amygdala is
      degraded as the opponent adaptation establishes itself.
  - target: Compulsive Tobacco Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Smoking to relieve the negative state is negative reinforcement, and it
      maintains use independently of any positive effect.
- name: Nicotine Withdrawal Syndrome
  biological_scale: ORGANISM
  description: >-
    Stopping nicotine produces a characterised abstinence syndrome. The
    DSM-IV set, which the DSM-5 criteria retain, is depressed mood, insomnia,
    irritability, anxiety, difficulty concentrating, restlessness, decreased
    heart rate and increased appetite, with craving alongside. More dependent
    smokers do not simply report more symptoms: they report a syndromal
    pattern, where smokers with comorbid anxiety, depression or disordered
    eating report the symptoms their own disorder resembles.
  evidence:
  - reference: PMID:11082828
    reference_title: "Who gets what symptom? Effects of psychiatric cofactors and nicotine dependence on patterns of smoking withdrawal symptomatology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the eight DSM-IV withdrawal symptoms (depressed mood, insomnia,
      irritability, anxiety, difficulty concentrating, restlessness, decreased
      heart rate, increased appetite) during smoking abstinence
    explanation: >-
      Enumerates the diagnostic withdrawal set that the phenotype rows below
      are drawn from.
  - reference: PMID:11082828
    reference_title: "Who gets what symptom? Effects of psychiatric cofactors and nicotine dependence on patterns of smoking withdrawal symptomatology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      smokers scoring high on nicotine dependence appeared to be at increased
      risk of experiencing a syndromal pattern of withdrawal, encompassing
      craving and insomnia as well as cognitive/affective symptoms
    explanation: >-
      Distinguishes the effect of dependence severity, which broadens the
      syndrome, from the effect of psychiatric comorbidity, which shapes which
      symptoms appear. Retrospective self-report in 365 smokers recruited for
      laboratory studies.
  downstream:
  - target: Tobacco craving
    causal_link_type: DIRECT
  - target: Irritability
    causal_link_type: DIRECT
  - target: Anxiety
    causal_link_type: DIRECT
  - target: Diminished ability to concentrate
    causal_link_type: DIRECT
  - target: Restlessness
    causal_link_type: DIRECT
  - target: Insomnia
    causal_link_type: DIRECT
  - target: Dysphoria
    causal_link_type: DIRECT
  - target: Increased appetite
    causal_link_type: DIRECT
- name: Prefrontal Executive Control Deficit
  conforms_to: "addiction_cycle#Prefrontal Executive Control Deficit"
  biological_scale: TISSUE
  description: >-
    Prefrontal regulation of limbic reward regions and of higher-order
    executive function is disrupted, so the capacity to act on an intention to
    stop is reduced at the point it is needed. This is the stage that explains
    why intention and behaviour come apart in a patient who wants to quit.
  biological_processes:
  - preferred_term: prefrontal glutamatergic projection signalling
    term:
      id: GO:0014047
      label: glutamate secretion
    modifier: DECREASED
  locations:
  - preferred_term: prefrontal cortex
    term:
      id: UBERON:0000451
      label: prefrontal cortex
  evidence:
  - reference: PMID:22011681
    reference_title: "Dysfunction of the prefrontal cortex in addiction: neuroimaging findings and clinical implications."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      However, imaging studies in addictive behaviours have identified a key
      involvement of the prefrontal cortex (PFC) both through its regulation of
      limbic reward regions and its involvement in higher-order executive
      function (for example, self-control, salience attribution and awareness).
    explanation: >-
      Summarises the human imaging basis for a prefrontal contribution. A
      review across addictive behaviours, not a nicotine-specific measurement.
  downstream:
  - target: Compulsive Tobacco Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Reduced executive control is what allows the habitual, negatively
      reinforced seeking to proceed against the patient's stated intention.
- name: Compulsive Tobacco Seeking and Loss of Control
  conforms_to: "addiction_cycle#Compulsive Seeking and Loss of Control"
  biological_scale: ORGANISM
  node_class: BEHAVIOURAL_AND_COGNITIVE_MECHANISM
  description: >-
    The three upstream arms converge on compulsive seeking with loss of control
    over intake: use continues despite the intention to stop, and quit attempts
    repeatedly fail. This is the clinical syndrome, and it is also the node that
    maintains the exposure below it.
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Drug addiction can be defined as a chronically relapsing disorder,
      characterised by compulsion to seek and take the drug, loss of control in
      limiting intake, and emergence of a negative emotional state (eg,
      dysphoria, anxiety, irritability) when access to the drug is prevented.
    explanation: >-
      The definition this node names, including the negative emotional state
      that the withdrawal node carries separately.
  downstream:
  - target: Addictive nicotine use
    causal_link_type: DIRECT
  - target: Sustained Tobacco Smoke Exposure
    causal_link_type: DIRECT
    description: >-
      Continued compulsive use of combusted tobacco is what maintains the daily
      exposure that carries the disorder's mortality.
- name: Sustained Tobacco Smoke Exposure
  biological_scale: ORGANISM
  node_class: ENVIRONMENTAL_EFFECT
  description: >-
    The dependence maintains a daily inhaled exposure to tobacco combustion
    products. Almost none of the disorder's mortality is attributable to
    nicotine itself; it is attributable to what nicotine is delivered in, which
    is why the organ consequences are curated in the disease entries for those
    organs rather than here. The node is kept so the pathograph does not stop
    at the psychiatric syndrome and leave the burden unexplained.
  triggers:
  - preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:
  - reference: PMID:34051883
    reference_title: "Spatial, temporal, and demographic patterns in prevalence of smoking tobacco use and attributable disease burden in 204 countries and territories, 1990-2019: a systematic analysis from the Global Burden of Disease Study 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      6·68 million [86·9%] of 7·69 million deaths attributable to smoking
      tobacco use were among current smokers.
    explanation: >-
      Locates the great majority of the attributable mortality in people whose
      exposure was still ongoing, which is the claim this node makes about why
      the dependence and not only the history matters.
- name: Partial Agonist Occupancy of Alpha4Beta2 Nicotinic Receptors
  biological_scale: MOLECULAR
  description: >-
    A high-affinity partial agonist occupies the alpha-4-beta-2 receptor,
    desensitising it and activating it weakly. The dual action is the point:
    the weak activation substitutes for some of the withdrawal relief nicotine
    would give, and the occupancy blunts the reinforcement a cigarette smoked
    on top of it would produce. This node exists as the target the two
    partial-agonist treatments below point at.
  molecular_functions:
  - preferred_term: nicotinic acetylcholine receptor channel activity
    term:
      id: GO:0022848
      label: acetylcholine-gated monoatomic cation-selective channel activity
    modifier: DECREASED
  chemical_entities:
  - preferred_term: varenicline
    term:
      id: CHEBI:84500
      label: varenicline
  - preferred_term: cytisine
    term:
      id: CHEBI:4055
      label: cytisine
  evidence:
  - reference: PMID:20331614
    reference_title: "Pre-clinical properties of the alpha4beta2 nicotinic acetylcholine receptor partial agonists varenicline, cytisine and dianicline translate to clinical efficacy for nicotine dependence."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      A comparison of predicted human brain concentrations following
      therapeutic doses demonstrated that varenicline and nicotine, but not
      dianicline and cytisine, can extensively desensitize and, to a lesser
      extent, activate alpha4beta2 nAChRs.
    explanation: >-
      States the desensitise-and-weakly-activate action this node describes,
      for varenicline. The figures are predicted human brain concentrations
      derived from rat pharmacokinetics and in vitro potency, not measured in
      people, so the evidence is computational.
  - reference: PMID:20331614
    reference_title: "Pre-clinical properties of the alpha4beta2 nicotinic acetylcholine receptor partial agonists varenicline, cytisine and dianicline translate to clinical efficacy for nicotine dependence."
    supports: REFUTE
    evidence_source: COMPUTATIONAL
    snippet: >-
      recommended doses of cytisine, despite its high in vitro potency, are
      predicted to result in brain concentrations that are insufficient to
      affect alpha4beta2 nAChRs
    explanation: >-
      Contradicts this node as an account of how cytisine works. The
      prediction was made for the traditional cytisine dosing regimen; the
      cytisinicline trial cited under treatments used a different,
      pharmacokinetically based regimen and showed efficacy, so the
      discrepancy is unresolved and is recorded as a controversy below rather
      than settled here.
mechanistic_hypotheses:
- hypothesis_group_id: nd_alpha5_aversion_brake
  hypothesis_label: CHRNA5 risk alleles act by weakening a habenular aversion brake
  status: EMERGING
  description: >-
    The CHRNA5 missense allele increases dependence risk by reducing
    alpha-5-subunit function in the habenulo-interpeduncular pathway, removing
    an inhibitory signal that would otherwise limit how much nicotine is taken.
    Both halves are established separately: the human allele is associated with
    dependence and reduces subunit function, and the rodent circuit limits
    intake. What is not established is the join, since the circuit has not been
    measured in carriers.
- hypothesis_group_id: nd_receptor_upregulation_withdrawal
  hypothesis_label: Receptor upregulation drives the aversive abstinent state
  status: ALTERNATIVE
  description: >-
    Upregulated, unoccupied high-affinity receptors are what make early
    abstinence aversive, so the time course of receptor normalisation should
    predict the time course of relapse risk. The receptor change is measured in
    smokers and a correlation with same-day craving exists, but the direction
    of causation is untested, and the most recent imaging work finds some
    components of binding lower rather than higher in abstinent smokers.
- hypothesis_group_id: nd_opponent_process
  hypothesis_label: Negative reinforcement, not positive reinforcement, maintains smoking
  status: CANONICAL
  description: >-
    After the opponent adaptation establishes itself, smoking is maintained
    because it relieves a negative state rather than because it produces a
    positive one. This is the canonical reading of the addiction cycle, and it
    is what the module's key conformance target asserts; it is carried here as
    the default against which the two alternatives above are read.

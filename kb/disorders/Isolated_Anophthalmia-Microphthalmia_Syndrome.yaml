- name: Teratogenic and Infectious Disruption of First-Trimester Ocular Morphogenesis
  biological_scale: ORGANISM
  role: trigger
  description: >-
    A minority of A/M is non-genetic. The same three morphogenetic steps are
    vulnerable to first-trimester environmental insult: gestationally acquired
    infection (the strongest environmental evidence), maternal vitamin A
    deficiency, exposure to X-rays, solvent misuse, and thalidomide. Exogenous
    retinoids act on the same retinoic-acid node as the STRA6/ALDH1A3/RARB
    genetic lesions. Because the critical window is embryonic there is no
    postnatal trigger, and the malformation itself is not transmissible.

    explanation: Demonstrates the non-ocular expression domains that underlie OTX2 extraocular disease.
  - reference: PMID:37163579
    reference_title: "SOX2 pathogenic variants with normal eyes: Expanding the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patients provide further evidence for broadening the phenotypic spectrum of SOX2 mutations and"
    explanation: Direct evidence that the SOX2 phenotype is not confined to the eye, undermining a strictly ocular reading of the isolated label.
- name: Congenital Visual Deprivation
  biological_scale: ORGANISM
  role: outcome
  description: >-
    Absence or severe malformation of the globe prevents formation of a normal
    retinal image and, in bilateral disease, of a functional visual pathway.
    Visual outcome depends principally on laterality, residual retinal and
    optic-nerve development and the status of the fellow eye. Bilateral severe
    disease produces lifelong blindness; unilateral disease may preserve useful
    vision but leaves the fellow eye at risk from amblyopia and injury. In a
    paediatric A/M cohort 10 of 35 children were totally blind or had light
    perception only.
  downstream:
  - target: Visual impairment
    description: Loss of ocular tissue directly reduces visual function.
  - target: Blindness
    description: Bilateral severe disease abolishes form vision.
  - target: Amblyopia
    description: In unilateral disease the fellow eye is at risk of deprivation and refractive amblyopia.
  evidence:
  - reference: PMID:35105264
    reference_title: "Anophthalmia and microphthalmia in children: associated ocular, somatic and genetic morbidities and quality of life."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten cases were totally blind or had light perception."
    explanation: Quantifies the visual outcome of the convergent structural deficit.

- name: Low-vision rehabilitation and early developmental intervention
  description: >-
    Children with reduced vision benefit from visual aids and visual resources,
    together with early intervention to optimise psychomotor development,
    education, life skills and mobility. Orientation and mobility training is
    central for bilateral visual loss. Quality of life is measurably reduced:
    median parent-reported PedsQL total score was 52.4 in affected children aged
    2-12.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_phenotypes:

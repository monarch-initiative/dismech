has_subtypes:
- name: Anophthalmia
  display_name: Anophthalmia (clinical and true)
  description: >-
    Complete absence of the globe in the presence of ocular adnexa (eyelids,
    conjunctiva, lacrimal apparatus). "Clinical anophthalmia" denotes absence of
    any visible ocular structure although a histologically detectable remnant
    may persist; "true" anophthalmia denotes total absence of any ocular tissue.
    The boundary with extreme microphthalmia is a fine one. Represents failure at
    the earliest step (optic vesicle evagination/induction) and is the phenotype
    most strongly enriched for a molecular diagnosis.
  evidence:
  - reference: PMID:20301552
    reference_title: "Microphthalmia/Anophthalmia/Coloboma Spectrum – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anophthalmia refers to complete absence of the globe in the presence of ocular adnexa"
    explanation: GeneReviews definition of anophthalmia within the MAC spectrum.
- name: Simple microphthalmia
  display_name: Simple (non-colobomatous) microphthalmia
  description: >-
    A globe of reduced size (total axial length at least 2 SD below the
    age-adjusted mean; <21 mm in adults, <14 mm in newborns) that is otherwise
    anatomically intact. Reflects a quantitative failure of optic-cup growth
    rather than a discrete structural closure defect.
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Simple microphthalmia refers to an anatomically intact eye with a reduced axial length, without"
    explanation: Establishes the simple-versus-complex microphthalmia classification used for this subtype.
- name: Complex microphthalmia
  display_name: Complex microphthalmia (with segment anomalies)
  description: >-
    Microphthalmia accompanied by anterior-segment abnormalities
    (Axenfeld-Rieger anomaly, Peters anomaly, sclerocornea, cataract) or
    posterior-segment abnormalities (persistent primitive vitreous, chorioretinal
    coloboma, retinal dysplasia). Implies additional failure of anterior-segment
    or retinal differentiation on top of reduced globe growth.
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."

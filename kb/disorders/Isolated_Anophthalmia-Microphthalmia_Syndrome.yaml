inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The dominant arm is driven by haploinsufficiency of dosage-sensitive
    developmental transcription factors, chiefly SOX2 and OTX2. The great
    majority of SOX2 variants arise de novo, but germline mosaicism is documented
    and must be factored into recurrence-risk counselling. OTX2 disease shows
    marked non-penetrance and variable expressivity even within a single family.
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SOX2-related anophthalmia syndrome is transmitted in an autosomal dominant"
    explanation: States the dominant transmission of the commonest A/M gene.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic variants in RAX, VSX2, ALDH1A3, FOXE3, MFRP and PRSS56 cause
    recessive disease, typically bilateral and severe, and are enriched in
    consanguineous pedigrees although compound heterozygosity occurs in
    non-consanguineous families. Heterozygous carriers are usually unaffected.
  evidence:
  - reference: PMID:21976963
    reference_title: VSX2 mutations in autosomal recessive microphthalmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in VSX2 represent an important cause of autosomal recessive microphthalmia in consanguineous pedigrees."
    explanation: Documents the autosomal recessive arm of isolated microphthalmia.
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    An X-linked numbered locus exists in the isolated series (MCOPCB1,
    MONDO:0024549 / OMIM:300345), and X-linked genes such as BCOR contribute to
    the wider MAC spectrum. Deletions involving the X chromosome were among the
    causal findings in a prospective MAC cohort.
  evidence:
  - reference: PMID:36192130
    reference_title: Real-world clinical and molecular management of 50 prospective patients with microphthalmia, anophthalmia and/or ocular coloboma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "novel variants in six known MAC genes (SOX2, KMT2D, MAB21L2, ALDH1A3, BCOR and"
    explanation: Identifies the X-linked gene BCOR among causal findings in a real-world MAC cohort; the numbered X-linked locus MCOPCB1 itself is documented in MONDO/OMIM rather than in this paper, so this is scored PARTIAL.

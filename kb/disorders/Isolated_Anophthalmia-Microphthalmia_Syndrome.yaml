- name: Retinal Progenitor Specification Failure and RPE Fate Shift
  biological_scale: CELLULAR
  role: mediator
  description: >-
    VSX2 (CHX10) is expressed from optic-vesicle stage in the presumptive neural
    retina, where it drives retinal-progenitor proliferation and represses the

    explanation: The conformer series quantifies the growth deficit that mechanical expansion corrects.
- name: Anterior and Posterior Segment Dysgenesis
  biological_scale: TISSUE
  role: consequence
  description: >-
    In complex microphthalmia the same morphogenetic failures that reduce globe
    size also disrupt differentiation of individual ocular structures, producing
    anterior-segment anomalies (Axenfeld-Rieger anomaly, Peters anomaly,
    sclerocornea, cataract) and posterior-segment anomalies (persistent primitive
    vitreous, chorioretinal coloboma, retinal dysplasia). In a prospective MAC
    cohort 44% had complex ocular features beyond the MAC phenotype itself.

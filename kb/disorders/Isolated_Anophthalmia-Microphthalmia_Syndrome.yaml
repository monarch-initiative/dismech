name: Isolated Anophthalmia-Microphthalmia Syndrome
creation_date: "2026-08-01T07:00:00Z"
description: >-
  Isolated anophthalmia-microphthalmia syndrome is the non-syndromic pole of the
  microphthalmia-anophthalmia-coloboma (MAC) spectrum: a severe congenital
  developmental eye malformation in which the globe is absent (anophthalmia) or
  abnormally small (microphthalmia). Mechanistically it is best understood as
  failure at one of three sequential steps of early ocular morphogenesis —
  lateral evagination of the eye field into paired optic vesicles (4th week),
  invagination of the distal optic vesicle to form the bilayered optic cup, and
  fusion of the nasal and temporal edges of the optic fissure (7th week). Which
  step fails largely determines the resulting phenotype: the earliest and most
  complete failures abort globe formation and produce anophthalmia, partial
  failures of invagination and growth produce microphthalmia, and failure of the
  last step produces coloboma. The disorder is highly genetically heterogeneous;
  SOX2 (10-15% of all A/M) and OTX2 are the commonest single-gene causes, with
  the eye-field and lens transcription factors RAX, VSX2, PAX6, FOXE3 and
  MAB21L2, the BMP-family ligands GDF3 and GDF6, the posterior-microphthalmia
  genes MFRP and PRSS56, and the retinoic-acid-pathway genes ALDH1A3, STRA6,
  RBP4 and RARB also implicated, alongside copy-number and regulatory variants. Non-genetic first-trimester insults — gestational
  infection, maternal vitamin A deficiency, and teratogens such as thalidomide
  and retinoids — contribute a minority of cases.
category: Mendelian
parents:
- hereditary disease
- developmental eye disorder
synonyms:
- MAC spectrum
- microphthalmia-anophthalmia-coloboma spectrum
- nonsyndromic anophthalmia-microphthalmia syndrome
- isolated anophthalmia - microphthalmia
- clinical anophthalmia
- isolated pure microphthalmia
- A/M
disease_term:
  preferred_term: isolated anophthalmia-microphthalmia syndrome
  term:

treatments:
- name: Serial conformer-assisted socket expansion
  description: >-
    The principal disease-directed intervention. Because orbital, conjunctival
    and eyelid growth is normally driven by the expanding globe, an ocularist
    fits conformers of progressively increasing size starting shortly after birth
    to expand the palpebral fissure, conjunctival cul-de-sac and bony orbit. In a
    24-orbit case series with a mean of 7 conformer exchanges over 51 months,
    good outcomes were achieved in 18 orbits (75%) and fair outcomes in 6 (25%),
    with unilateral cases reaching a mean final lid length of 22.3 mm against
    23.5 mm in the normal contralateral eye.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Failure of Orbital and Periocular Growth
    treatment_effect: BYPASSES
    description: >-
      Conformers supply mechanically the expansile stimulus that the absent or
      small globe cannot, driving orbital and palpebral growth by an external
      route rather than restoring globe development.
  target_phenotypes:
  - preferred_term: Blepharophimosis
    term:
      id: HP:0000581
      label: Blepharophimosis
  evidence:
  - reference: PMID:36257503
    reference_title: Socket expansion with conformers in congenital anophthalmia and microphthalmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Good outcomes were achieved in 18 orbits (75%); fair outcomes, in 6 (25%) cases."
    explanation: The case series reports good outcomes in 18 of 24 orbits (75%) after conformer-assisted socket expansion.
  - reference: PMID:20301552
    reference_title: "Microphthalmia/Anophthalmia/Coloboma Spectrum – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an ocularist can start shortly after birth to expand the palpebral fissures"
    explanation: GeneReviews management recommendation establishing timing and rationale.
- name: Ocular prosthesis
  description: >-
    Fitting of an ocular prosthesis over the socket or a microphthalmic globe.
    GeneReviews states directly that prosthetic intervention is appropriate for
    those with severe microphthalmia and anophthalmia; it is the most universal
    intervention in this disorder, addressing both cosmesis and, together with
    conformers, socket volume. In a prospective MAC cohort most patients did not
    require a customised prosthesis, so the need is individualised rather than
    universal across the whole spectrum.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Failure of Orbital and Periocular Growth
    treatment_effect: BYPASSES
    description: >-
      A prosthesis occupies and maintains socket volume in place of the absent
      or hypoplastic globe.
  evidence:
  - reference: PMID:20301552
    reference_title: "Microphthalmia/Anophthalmia/Coloboma Spectrum – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prosthetic intervention is appropriate for those with severe microphthalmia and anophthalmia."
    explanation: GeneReviews management recommendation for prosthetic intervention.
- name: Oculoplastic and orbital reconstructive surgery
  description: >-
    Surgical intervention for severe sockets, orbital cysts and prosthetic
    support. GeneReviews advises that an oculoplastic surgeon determine the most
    suitable options after age six months, when postnatal orbital growth can be
    assessed, and before orbital dimensions become fixed — after which far more
    extensive reconstruction is required. This timing constraint is the key
    management point.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Ophthalmologic Surgical Procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  target_mechanisms:
  - target: Failure of Orbital and Periocular Growth
    treatment_effect: BYPASSES
    description: >-
      Orbital reconstruction and implants substitute surgically for the missing
      globe-driven expansion of the socket.
  evidence:
  - reference: PMID:20301552

pathophysiology:
- name: Eye Field Transcription Factor Network Dosage Loss
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The proximal molecular lesion in most genetically explained cases is loss of
    functional dosage of a transcription factor that specifies and maintains the
    anterior neural-plate eye field. SOX2 and OTX2 act as dosage-sensitive hubs
    that bind regulatory elements of downstream eye-field genes including RAX and
    PAX6; heterozygous loss-of-function variants, whole-gene deletions and
    regulatory or copy-number lesions all reduce effective dosage. Biallelic loss
    of RAX, VSX2 or FOXE3 removes the corresponding node outright. Because these
    factors act sequentially and combinatorially, the developmental stage at
    which the network first fails, rather than the identity of the gene alone,
    sets the severity of the resulting malformation.
  biological_processes:
  - preferred_term: eye field specification
    term:
      id: GO:0060898
      label: eye field cell fate commitment involved in camera-type eye formation
    modifier: DECREASED
  - preferred_term: embryonic camera-type eye formation
    term:
      id: GO:0060900
      label: embryonic camera-type eye formation
    modifier: DECREASED
  locations:
  - preferred_term: optic vesicle
    term:
      id: UBERON:0004128
      label: optic vesicle
  genes:
  - preferred_term: SOX2
    term:
      id: hgnc:11195
      label: SOX2
  - preferred_term: OTX2
    term:
      id: hgnc:8522
      label: OTX2
  - preferred_term: PAX6
    term:
      id: hgnc:8620
      label: PAX6
  - preferred_term: MAB21L2
    term:
      id: hgnc:6758
      label: MAB21L2
  - preferred_term: FOXE3
    term:
      id: hgnc:3808
      label: FOXE3
  downstream:
  - target: Failure of Optic Vesicle Evagination
    description: Loss of eye-field specification prevents the eye-forming region from evaginating into paired optic vesicles.
  - target: Failure of Optic Cup Invagination and Growth
    description: Partial dosage loss permits vesicle formation but impairs subsequent invagination and growth.
  - target: Failure of Optic Fissure Closure
    description: Reduced dosage of the same network perturbs ventral optic-cup patterning required for fissure fusion.
  - target: Retinal Progenitor Specification Failure and RPE Fate Shift
    description: Loss of VSX2, itself a member of this eye-field network, removes the neural-retina specification and RPE-repression node.
  - target: Extraocular Pleiotropy of Eye Field Transcription Factors
    description: The same dosage lesion acts in the non-ocular expression domains of SOX2, OTX2 and RAX, producing extraocular disease.
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This process of eye formation is directed by a network of genes, and any disruption of these"
    explanation: States that a gene network directs eye formation and that its disruption produces A/M and coloboma.
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."
    supports: SUPPORT

    label: isolated anophthalmia-microphthalmia syndrome
notes: >-
  SCOPE AND BOUNDARIES. This entry curates MONDO:0016764, the umbrella
  "isolated" anophthalmia-microphthalmia (A/M) grouping term, and is organised
  around the three-step developmental-failure spine (evagination -> invagination
  -> optic fissure closure) that unifies the MAC spectrum. Its immediate MONDO
  child MONDO:0000170 (microphthalmia, isolated, with coloboma) is already
  curated separately as `Microphthalmia_with_Coloboma`; that entry is the
  detailed treatment of the optic-fissure-closure arm and its gene-level
  subtypes. To avoid duplication the coloboma arm is modelled here only as the
  third step of the developmental spine and as a subtype pointer, with the
  gene-by-gene coloboma detail left to that entry. Syndromic forms in which A/M
  is one feature of a defined multisystem disorder are curated as their own
  entries (STRA6-related syndromic microphthalmia / Matthew-Wood,
  RARB-related syndromic microphthalmia / MCOPS12, CHARGE syndrome,
  Axenfeld-Rieger syndrome, Bosma arhinia microphthalmia syndrome) and appear
  here only as differential diagnoses.

  THE "ISOLATED" LABEL IS AN ASCERTAINMENT QUALIFIER, NOT A BIOLOGICAL CLAIM.
  This is the single most important caveat for this entity and is curated
  explicitly rather than left implicit in the MONDO label. The two commonest
  causal genes both routinely produce extraocular disease: SOX2 loss classically
  causes psychomotor delay, brain malformation, hypogonadism and pituitary
  involvement, genital and renal anomalies and (in the AEG/MCOPS3 form,
  OMIM:206900) oesophageal atresia, and SOX2 variants have been reported in
  individuals with structurally normal eyes; OTX2 (MCOPS5) causes a combined
  pituitary-plus-eye phenotype. OMIM in fact assigns SOX2, OTX2, BMP4 and STRA6
  to the *syndromic* MCOPS series, not to the isolated MCOP/MCOPCB series,
  precisely because their phenotypes extend beyond the eye. Population data
  agree: extra-ocular abnormalities were present in 32.1% of Danish MO/AO cases
  (PMID:27552085) and only 16/35 children in a Swedish A/M cohort had genuinely
  isolated disease (PMID:35105264). "Isolated" here therefore means "no
  extraocular findings recognised at the time of ascertainment", and every
  apparently isolated case with a SOX2, OTX2, RAX or ALDH1A3 diagnosis warrants
  systemic — especially endocrine, neurological and gastrointestinal —
  evaluation.

  NUMBERED SUBTYPE SERIES. The MCOP (isolated microphthalmia) and MCOPCB
  (microphthalmia, isolated, with coloboma) gene-to-locus assignments below were
  re-derived independently from MONDO via OAK (definition text, OMIM xrefs and
  RO:0004003 gene relations); they were not taken from any deep-research output.
  Loci for which MONDO records no causal gene (MCOP1, MCOPCB1/2/4/6/8) are
  represented as such rather than being assigned a gene speculatively. Note that
  the MCOPS (syndromic microphthalmia) numbered series is a *different* series
  that sits under MONDO:0016073 (syndromic microphthalmia) and is therefore out
  of scope for this isolated-disease entry.

- name: Failure of Optic Fissure Closure
  biological_scale: TISSUE
  role: mediator
  description: >-
    STEP 3 OF THE THREE-STEP SPINE. Invagination of the optic cup is asymmetric,
    leaving a ventral furrow — the optic fissure — running from the cup into the
    optic stalk, through which the hyaloid artery enters. The nasal and temporal
    edges of this fissure must fuse during the 7th week of human development.
    Failure of this epithelial fusion produces coloboma, which may involve iris,
    retina, choroid and optic nerve; when it co-occurs with a small globe the
    result is colobomatous microphthalmia. Retinoic acid receptor signalling
    regulates fissure closure through independent actions on the ventral optic
    cup and on the neural-crest-derived periocular mesenchyme. NOTE: the
    gene-level detail of this arm is curated in the separate
    `Microphthalmia_with_Coloboma` entry (MONDO:0000170).

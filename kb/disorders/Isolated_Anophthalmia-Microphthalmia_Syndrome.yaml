- name: Extraocular Pleiotropy of Eye Field Transcription Factors
  biological_scale: ORGANISM
  role: consequence
  description: >-
    THE HONESTY NODE FOR THE "ISOLATED" LABEL. SOX2, OTX2 and RAX are not
    eye-restricted. SOX2 is required for pluripotency and multiple early
    developmental programmes; OTX2 is expressed in the posterior pituitary,
    retina, ear, thalamus and choroid plexus during human embryogenesis; RAX
    patterns the ventral forebrain and hypothalamus. Consequently the same
    dosage lesion that produces A/M frequently produces psychomotor delay,
    ventriculomegaly and corpus-callosum hypoplasia, hypogonadism and pituitary
    dysfunction, growth and renal anomalies, and — in the AEG/MCOPS3 form —
    oesophageal atresia. SOX2 variants have been reported in individuals with
    structurally normal eyes, and truncating RAX variants have caused
    anophthalmia with hypopituitarism, diabetes insipidus and cleft palate. A
    disorder labelled "isolated" is therefore isolated only until it is looked
    for elsewhere.
  downstream:
  - target: Global developmental delay
    description: Extraocular action of the same transcription factors impairs neurodevelopment.
  - target: Hypopituitarism
    description: OTX2 and RAX act in pituitary and hypothalamic development.
  - target: Hypogonadism
    description: Pituitary and gonadal-axis involvement follows from the same dosage lesion.
  - target: Esophageal atresia
    description: SOX2 loss disrupts foregut separation, the AEG/MCOPS3 association.
  - target: Hypoplasia of the corpus callosum
    description: SOX2 loss produces midline forebrain malformation.

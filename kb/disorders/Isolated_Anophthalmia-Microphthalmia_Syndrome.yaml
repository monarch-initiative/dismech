- name: Failure of Optic Vesicle Evagination
  biological_scale: TISSUE
  role: mediator
  description: >-
    STEP 1 OF THE THREE-STEP SPINE. During neurulation (4th week of human
    gestation) the eye-forming region of the anterior neural plate evaginates
    laterally, splitting the single eye field into right and left optic vesicles.
    Complete failure of this earliest morphogenetic step — through lack of
    induction at the primitive neural tube, failure of the optic pit to enlarge,
    or (in some models) secondary regression of an already-formed structure —
    aborts globe formation altogether. This is the step whose failure yields
    anophthalmia, and it explains why histologically detectable vestigial ocular
    tissue is variably found in anophthalmic sockets.

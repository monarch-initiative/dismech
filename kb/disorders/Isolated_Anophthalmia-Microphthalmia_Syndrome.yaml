    snippet: "an ocularist can start shortly after birth to expand the palpebral fissures"
    explanation: GeneReviews implies globe-dependent orbital growth by describing the need for mechanical expansion when the globe is absent; the causal dependency itself is not stated explicitly, so this is scored PARTIAL.
  - reference: PMID:36257503
    reference_title: Socket expansion with conformers in congenital anophthalmia and microphthalmia.

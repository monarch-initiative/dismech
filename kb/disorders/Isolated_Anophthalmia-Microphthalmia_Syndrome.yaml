    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median total PedsQL score of parent reports for ages 2-12 was 52.4 (range 22.6-100)."
    explanation: Quantifies the quality-of-life impairment that rehabilitation addresses.
- name: Protection of the fellow eye
  description: >-
    In unilateral disease the unaffected eye carries the individual's entire
    visual function, so protective polycarbonate eyewear, prompt refraction and
    amblyopia treatment are explicitly recommended. This is the highest-yield,
    lowest-cost intervention in unilateral A/M.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Amblyopia
    term:
      id: HP:0000646
      label: Amblyopia
  evidence:
  - reference: PMID:20301552
    reference_title: "Microphthalmia/Anophthalmia/Coloboma Spectrum – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protection of the healthy eye in those with"
    explanation: GeneReviews management recommendation for unilateral disease.
- name: Genetic counselling and molecular diagnosis
  description: >-
    Molecular testing identifies a genetic cause in 80% of individuals with
    bilateral anophthalmia or severe microphthalmia and up to 20% of all MAC
    individuals, and should combine sequencing with gene-targeted
    deletion/duplication analysis and chromosomal microarray. Real-world yields
    are meaningful in unilateral as well as bilateral disease (33% in each group
    in a prospective cohort), so testing should not be restricted to bilateral
    cases. Counselling must address de novo occurrence, incomplete penetrance,
    variable expressivity and germline mosaicism, which together mean recurrence
    risk after an apparently de novo diagnosis is not zero.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301552
    reference_title: "Microphthalmia/Anophthalmia/Coloboma Spectrum – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can identify a genetic cause in 80% of individuals with"
    explanation: GeneReviews diagnostic-yield figure underpinning the testing recommendation.
  - reference: PMID:36192130
    reference_title: Real-world clinical and molecular management of 50 prospective patients with microphthalmia, anophthalmia and/or ocular coloboma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a molecular diagnostic rate of 33% for both bilateral and unilateral cohorts"
    explanation: Supports extending genetic testing to unilateral cases.
- name: Management of secondary ocular complications
  description: >-
    Remediable pathology in the malformed or fellow eye should be treated
    actively: cataract extraction, glaucoma control, and retinal-detachment
    repair. Retinal detachment occurred in 9% of a prospective MAC cohort and
    presented from the first to the third decade, so lifelong surveillance rather
    than a fixed discharge point is appropriate.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Ophthalmologic Surgical Procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  target_phenotypes:
  - preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  - preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  - preferred_term: Retinal detachment
    term:
      id: HP:0000541
      label: Retinal detachment
  evidence:
  - reference: PMID:36192130
    reference_title: Real-world clinical and molecular management of 50 prospective patients with microphthalmia, anophthalmia and/or ocular coloboma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study highlights the importance of thorough clinical and molecular phenotyping of MAC patients to provide appropriate multidisciplinary care."
    explanation: Establishes the multidisciplinary phenotyping and management model within which secondary complications are detected and treated.
diagnosis:
- name: Ophthalmic examination with axial-length biometry
  description: >-
    Diagnosis begins with comprehensive paediatric ophthalmological examination:
    inspection for any globe tissue, corneal diameter, axial length by
    ultrasound biometry, anterior- and posterior-segment examination where
    possible, refraction, intraocular pressure and visual behaviour, together
    with full assessment of the fellow eye. Microphthalmia is confirmed when
    total axial length is more than 2 SD below the age-adjusted mean (<21 mm in
    adults, <14 mm in newborns); severe microphthalmia additionally requires a
    corneal diameter under 4 mm.
  diagnosis_term:
    preferred_term: Eye Examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deviations (SD) below the age-adjusted population mean; < 21 mm in adults and < 14 mm in newborns"
    explanation: Gives the biometric threshold on which the clinical diagnosis rests.
- name: Orbital and cranial magnetic resonance imaging
  description: >-
    Orbital imaging distinguishes a truly absent globe from extreme
    microphthalmia, an orbital cyst or another orbital lesion, and is
    particularly indicated in bilateral severe disease, developmental delay,
    seizures, optic-nerve abnormality or suspected midline and pituitary
    involvement. In a paediatric A/M cohort neuroimaging was abnormal in 14 of
    20 scanned children, corpus callosum dysgenesis being commonest.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:35105264
    reference_title: "Anophthalmia and microphthalmia in children: associated ocular, somatic and genetic morbidities and quality of life."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging demonstrated pathology in 14/20 cases with corpus callosum dysgenesis (6/20) being the most common."
    explanation: Quantifies the yield of neuroimaging in a paediatric A/M cohort.
- name: Chromosomal microarray analysis
  description: >-
    First-tier cytogenetic testing. Chromosomal aberrations are a substantial
    and easily missed cause: in a Danish national cohort 14.7% of karyotyped
    cases had an abnormal karyotype, and among the 8.7% who underwent
    chromosomal microarray a possibly pathogenic copy-number variant was found
    in 44.4%.
  diagnosis_term:
    preferred_term: Microarray Analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  evidence:
  - reference: PMID:27552085
    reference_title: Congenital Microphthalmia, Anophthalmia and Coloboma among Live Births in Denmark.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 8.7% of the cohort, a chromosome microarray analysis was performed, and in 44.4% of cases, a possibly pathogenic copy number variation was observed."
    explanation: Quantifies the copy-number yield that justifies microarray as a first-tier test.
- name: Exome or genome sequencing
  description: >-
    Molecular genetic testing identifies a cause in 80% of individuals with
    bilateral anophthalmia or severe microphthalmia and up to 20% of all MAC
    individuals, and should combine sequence analysis with gene-targeted
    deletion/duplication analysis. Clinical exome sequencing achieved a
    diagnostic rate starting at 32.3% in a 189-person non-isolated MAC cohort,
    and a subset of the implicated genes are absent from commercially available
    ophthalmic gene panels - an argument for exome or genome sequencing rather
    than panel testing. Real-world yield is comparable in unilateral and
    bilateral disease (33% each), so testing should not be restricted to
    bilateral cases.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:20301552
    reference_title: "Microphthalmia/Anophthalmia/Coloboma Spectrum – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can identify a genetic cause in 80% of individuals with bilateral anophthalmia/severe microphthalmia and in up to 20% of all individuals with an ocular malformation in the MAC spectrum."
    explanation: GeneReviews diagnostic-yield benchmark.
  - reference: PMID:38502138
    reference_title: "High Clinical Exome Sequencing Diagnostic Rates and Novel Phenotypic Expansions for Nonisolated Microphthalmia, Anophthalmia, and Coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found the efficacy of cES in nonisolated MAC to be between 32.3%"
    explanation: Contemporary clinical-exome diagnostic rate in a large MAC cohort.
  - reference: PMID:36192130
    reference_title: Real-world clinical and molecular management of 50 prospective patients with microphthalmia, anophthalmia and/or ocular coloboma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a molecular diagnostic rate of 33% for both bilateral and unilateral cohorts"
    explanation: Shows comparable yield in unilateral disease, supporting unrestricted testing.
differential_diagnoses:
- name: Microphthalmia with coloboma
  description: >-
    The immediate MONDO child term (MONDO:0000170) and the fissure-closure arm of
    the same spectrum, curated in dismech as `Microphthalmia_with_Coloboma`.
    Distinguished from non-colobomatous A/M by the presence of a demonstrable
    iris, chorioretinal or optic-disc coloboma. This is a boundary rather than a
    rival diagnosis: colobomatous microphthalmia is a subset of this entity.
  disease_term:
    preferred_term: microphthalmia, isolated, with coloboma
    term:
      id: MONDO:0000170
      label: microphthalmia, isolated, with coloboma
  distinguishing_features:
  - Demonstrable coloboma of iris, retina, choroid or optic disc.
  - Mechanistically attributable to step 3 (optic fissure closure) rather than step 1 or 2.
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "optic fissure closure defect, it is referred to as colobomatous microphthalmia"
    explanation: Defines the boundary between colobomatous and non-colobomatous microphthalmia.
- name: STRA6-related syndromic microphthalmia (Matthew-Wood syndrome)
  description: >-
    Biallelic STRA6 variants disrupt cellular retinol uptake, causing
    anophthalmia or microphthalmia together with pulmonary hypoplasia or
    agenesis, diaphragmatic defects and cardiac malformations (PDAC/MCOPS9,
    OMIM:601186). Shares the retinoic-acid mechanism with isolated A/M but is
    distinguished by the extraocular malformation pattern. Curated separately as
    `STRA6-related_syndromic_microphthalmia`.
  disease_term:
    preferred_term: Matthew-Wood syndrome
    term:
      id: MONDO:0011010
      label: Matthew-Wood syndrome
  distinguishing_features:
  - Pulmonary hypoplasia or agenesis.
  - Diaphragmatic hernia or eventration.
  - Congenital cardiac malformation.
  - Biallelic STRA6 variants rather than SOX2 or OTX2 dosage loss.
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STRA6 codes for a transmembrane receptor that mediates the cellular uptake of Vitamin A (retinol)."
    explanation: Establishes the STRA6 retinol-uptake mechanism that distinguishes this syndromic differential.
- name: RARB-related syndromic microphthalmia (MCOPS12)
  description: >-
    Predominantly de novo gain-of-function RARB variants produce a
    Matthew-Wood-like malformation pattern (pulmonary and diaphragmatic defects,
    A/M, cardiac malformation) with severe global developmental delay and
    progressive movement disorder. Also a retinoic-acid-pathway disorder but
    acting at the receptor rather than at synthesis or uptake. Curated separately
    as `RARB-related_syndromic_microphthalmia`.
  disease_term:
    preferred_term: microphthalmia, syndromic 12
    term:
      id: MONDO:0014229
      label: microphthalmia, syndromic 12
  distinguishing_features:
  - Progressive spasticity, dystonia or chorea.
  - Pulmonary and diaphragmatic malformation.
  - Gain-of-function RARB variants.
- name: CHARGE syndrome
  description: >-
    CHD7-related multisystem disorder in which ocular coloboma is a cardinal
    feature, accompanied by choanal atresia, cranial nerve dysfunction,
    characteristic ear anomalies and hearing loss, cardiac defects and growth
    retardation. Should be considered whenever coloboma co-occurs with any of
    these. Curated separately as `CHARGE_Syndrome`.
  disease_term:
    preferred_term: CHARGE syndrome
    term:
      id: MONDO:0008965
      label: CHARGE syndrome
  distinguishing_features:
  - Choanal atresia and characteristic external ear anomalies.
  - Cranial nerve dysfunction, especially anosmia and swallowing difficulty.
  - Pathogenic CHD7 variant.
- name: Axenfeld-Rieger syndrome
  description: >-
    Anterior-segment dysgenesis with iris hypoplasia, corectopia, posterior
    embryotoxon and a high risk of glaucoma, caused chiefly by PITX2 or FOXC1
    variants and often with dental and umbilical anomalies. Overlaps the
    complex-microphthalmia phenotype at the anterior segment, but the globe is
    usually of normal size. Curated separately as `Axenfeld-Rieger_syndrome`.
  disease_term:
    preferred_term: Axenfeld-Rieger syndrome
    term:
      id: MONDO:0019187
      label: Axenfeld-Rieger syndrome
  distinguishing_features:
  - Normal axial length with isolated anterior-segment dysgenesis.
  - Dental hypoplasia and redundant periumbilical skin.
  - PITX2 or FOXC1 variants.
- name: Congenital cystic eye
  description: >-
    Complete failure of optic vesicle invagination leaving a cystic orbital mass
    with no recognisable globe. Clinically mimics anophthalmia, and a
    colobomatous cyst arising from an incompletely closed optic fissure can
    likewise dominate the orbit alongside a small globe. Orbital ultrasound or
    MRI distinguishes these and directs surgical planning.
  disease_term:
    preferred_term: congenital cystic eye
    term:
      id: MONDO:0022825
      label: congenital cystic eye
  distinguishing_features:
  - Cystic orbital mass on ultrasound or MRI.
  - Absence of any recognisable globe structure.
- name: Fraser syndrome (cryptophthalmos)
  description: >-
    Failure of eyelid separation with skin running continuously over a malformed
    globe, most often as part of Fraser syndrome with cutaneous syndactyly and
    renal agenesis. Clinically resembles anophthalmia because no eye is visible,
    but the adnexa are abnormal rather than preserved — the key discriminator
    from clinical anophthalmia, whose definition explicitly requires intact
    adnexa.
  disease_term:
    preferred_term: Fraser syndrome
    term:
      id: MONDO:0009046
      label: Fraser syndrome
  distinguishing_features:
  - Absent palpebral fissure with skin continuous over the orbit.
  - Cutaneous syndactyly and renal agenesis.
  evidence:
  - reference: PMID:20301552
    reference_title: "Microphthalmia/Anophthalmia/Coloboma Spectrum – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anophthalmia refers to complete absence of the globe in the presence of ocular adnexa (eyelids, conjunctiva, and lacrimal apparatus)."
    explanation: The requirement for intact ocular adnexa in the definition of anophthalmia is what distinguishes it from cryptophthalmos.
- name: Congenital rubella syndrome and other acquired destructive ocular disease
  description: >-
    A shrunken, disorganised globe following intrauterine infection,
    inflammation, trauma, retinopathy of prematurity or intraocular tumour can be
    mistaken for congenital microphthalmia. Congenital rubella is the classic
    infectious cause, producing cataract, retinopathy and microphthalmia together
    with deafness and cardiac defects; congenital Zika virus infection produced
    microphthalmia in 2.7% of reviewed cases. Serology, laterality, corneal
    diameter relative to axial length, and imaging for calcification or scarring
    distinguish an acquired small eye from a developmental one.
  disease_term:
    preferred_term: congenital rubella syndrome
    term:
      id: MONDO:0017361
      label: congenital rubella syndrome
  distinguishing_features:
  - Positive maternal or infant serology for a TORCH pathogen.
  - Intraocular calcification, chorioretinal scarring or disorganisation on imaging.
  - Accompanying sensorineural deafness and cardiac defects in congenital rubella.
  evidence:
  - reference: PMID:38350011
    reference_title: "Prenatal and Postnatal Ocular Abnormalities Following Congenital Zika Virus Infections: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "microphthalmia was reported in 13 cases (13/479, 2.7%)"
    explanation: Documents a destructive congenital infection producing microphthalmia, the principal acquired mimic.

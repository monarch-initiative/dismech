- name: Copy-number and chromosomal variants
  relationship_type: CAUSATIVE
  notes: >-
    Chromosomal deletions, duplications and translocations are an important and
    frequently overlooked cause. In a Danish national cohort 14.7% of karyotyped
    A/M and coloboma cases had an abnormal karyotype, and a possibly pathogenic
    copy-number variant was found in 44.4% of those who underwent chromosomal
    microarray — supporting microarray as a first-tier test alongside sequencing.
  evidence:

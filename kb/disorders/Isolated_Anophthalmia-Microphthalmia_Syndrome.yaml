- name: Failure of Orbital and Periocular Growth
  biological_scale: TISSUE
  role: consequence
  description: >-
    Postnatal expansion of the bony orbit, conjunctival cul-de-sac and palpebral
    fissure is driven mechanically by growth of the globe. When the globe is
    absent or very small this stimulus is lost, and the orbit, eyelids and
    midface on the affected side remain hypoplastic, producing progressive facial
    asymmetry. This is the rationale for the principal therapeutic intervention
    in this disorder — serial conformer-assisted socket expansion begun in
    infancy, which in a case series increased mean lid length by 90.9% in
    anophthalmia and 31.3% in microphthalmia.
  locations:
  - preferred_term: orbit of skull
    term:
      id: UBERON:0001697
      label: orbit of skull
  downstream:
  - target: Orbital and Palpebral Fissure Hypoplasia
    description: Loss of the globe-derived growth stimulus leaves the orbit and palpebral fissure underdeveloped.

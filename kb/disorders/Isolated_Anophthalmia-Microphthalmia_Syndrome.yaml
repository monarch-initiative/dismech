      id: hgnc:18121
      label: MFRP
  relationship_type: CAUSATIVE
  notes: >-
    Autosomal recessive. Biallelic MFRP variants cause nanophthalmia and
    posterior microphthalmia, sometimes with retinal dystrophy, foveoschisis and
    optic disc drusen. This is the small-eye-with-normal-anterior-segment arm of
    the spectrum, mechanistically distinct from the eye-field transcription
    factor lesions that cause severe A/M. Corresponds to MCOP5 (MONDO:0012605,
    OMIM:611040).
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In humans, biallelic mutations in MFRP were first associated with nanophthalmia (Sundin et al. 2005)."
    explanation: Documents the recessive MFRP mechanism and its nanophthalmia and posterior microphthalmia phenotype.
- name: PRSS56
  gene_term:
    preferred_term: PRSS56
    term:
      id: hgnc:39433
      label: PRSS56
  relationship_type: CAUSATIVE
  notes: >-
    Autosomal recessive. Biallelic PRSS56 variants (missense, nonsense,
    frameshift and splice-donor) cause posterior microphthalmia and
    nanophthalmia in humans and posterior microphthalmia in mice, the second
    gene of the posterior-microphthalmia arm alongside MFRP. Corresponds to
    MCOP6 (MONDO:0013293, OMIM:613517).
  evidence:
  - reference: PMID:30762128
    reference_title: "Genetics of anophthalmia and microphthalmia. Part 1: Non-syndromic anophthalmia/microphthalmia."

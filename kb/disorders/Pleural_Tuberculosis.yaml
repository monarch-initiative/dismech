- phase: Spontaneous resolution of the effusion
  notes: >-
    Without treatment the effusion usually resolves within about 2-4 months.
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      of 141 US military personnel diagnosed with tuberculous effusion in the
      1940s, all spontaneously resolved within 2–4 months in the absence of
      antibiotic therapy
    explanation: >-
      Historical untreated series in which every effusion resolved.
- phase: Later active tuberculosis if untreated
  notes: >-
    Most untreated patients later develop active pulmonary or extrapulmonary
    tuberculosis (65% in the 1955 military series, which was done when
    reinfection was common).
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Despite this initial resolution, however, 65% went on to develop active
      TB in subsequent years
    explanation: >-
      Later active tuberculosis in most untreated patients.
  - reference: PMID:28290161
    reference_title: Corticosteroids for tuberculous pleurisy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Pleural TB usually resolves without treatment of any kind, but untreated
      patients may experience longer duration of the acute symptoms and risk
      recurrence of active TB at a later point in time
    explanation: >-
      Restates the natural history of untreated disease.
- phase: Treated course and residual pleural thickening
  notes: >-
    Standard therapy cures most patients; about half are left with residual
    pleural thickening, and the effusion can enlarge during treatment.
  evidence:
  - reference: PMID:7855916
    reference_title: Tuberculous pleural effusion in the eastern province of Saudi Arabia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Six months anti-TB therapy resulted in complete recovery in 86 patients.
    explanation: >-
      Recovery with six months of treatment in 86 of 89 patients.
  - reference: PMID:12719023
    reference_title: Tuberculous pleural effusions.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      50% of TPE patients have a thickened pleura as a result of the
      accumulation of fluid, and in 16% the quantity of effusion increases
      during treatment, even if corticosteroids are administered
    explanation: >-
      Residual thickening and enlargement of the effusion during treatment.
diagnosis:
- name: Diagnostic thoracentesis with pleural fluid analysis
  description: >-
    The fluid is a straw-coloured exudate with high protein and usually more
    than 50% lymphocytes. About 10% of effusions, mainly early ones, are
    neutrophil predominant, and 17% had under 50% lymphocytes in one Taiwanese
    series. A lymphocytic exudate is not specific: malignant effusions look
    the same.
  diagnosis_term:
    preferred_term: Thoracentesis
    term:
      id: NCIT:C15392
      label: Thoracentesis
  evidence:
  - reference: PMID:9778201
    reference_title: "Tuberculous pleurisy: a study of 254 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In 93.3% of the effusions, more than 50% of leukocytes were lymphocytes,
      and almost all had the biologic characteristics of exudates (98.8% had
      high total protein contents
    explanation: >-
      Lymphocytic, high-protein exudate in 254 patients.
  - reference: PMID:22436167
    reference_title: "Revisiting tuberculous pleurisy: pleural fluid characteristics and diagnostic yield of mycobacterial culture in an endemic area."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The median lymphocyte percentage of total cells in pleural fluids was
      84% (IQR 64-95%) and 17% of cases had a lymphocyte percentage of <50%.
    explanation: >-
      Lymphocyte predominance is not universal.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      caution must be exercised to ensure malignant effusions are not
      misdiagnosed, as these can also present as lymphocyte-predominant
      exudates with variable ADA level
    explanation: >-
      Malignant effusion is the main differential of a lymphocytic exudate.
- name: Pleural fluid adenosine deaminase
  description: >-
    The most widely used rapid test. A level above 40 U/L in a lymphocytic
    exudate supports the diagnosis in high-prevalence settings. Pooled
    sensitivity is about 0.92 and specificity about 0.90 (63 studies in 2008;
    174 studies and 27,009 patients in 2019, 0.93/0.90 at 40±4 U/L), but every
    included study was at high risk of bias, and the positive predictive value
    falls where tuberculosis is uncommon. ADA stays useful in HIV even at low
    CD4 counts. Very high levels (above 250 U/L) suggest bacterial empyema or
    lymphoma instead. ADA gives no drug-susceptibility information.
  evidence:
  - reference: PMID:18222681
    reference_title: "Diagnostic accuracy of adenosine deaminase in tuberculous pleurisy: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The summary estimates for ADA in the diagnosis of tuberculous pleurisy in
      the studies included were sensitivity 0.92 (95% confidence interval
      0.90-0.93), specificity 0.90 (95% confidence interval 0.89-0.91)
    explanation: >-
      Pooled accuracy across 63 studies.
  - reference: PMID:30913213
    reference_title: "Adenosine deaminase for diagnosis of tuberculous pleural effusion: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      65 studies with ADA threshold of 40±4 IU/L showed summary sensitivity
      and specificity of 0.93 (95% CI 0.90-0.95) and 0.90 (95% CI 0.87-0.91)
      respectively.
    explanation: >-
      Accuracy at the usual 40 U/L cut-off.
  - reference: PMID:30913213
    reference_title: "Adenosine deaminase for diagnosis of tuberculous pleural effusion: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We retrieved 2162 citations, and included 174 publications with 27009
      patients. All studies showed high risk of bias.
    explanation: >-
      Size of the evidence base, and its risk of bias.
  - reference: PMID:20345583
    reference_title: Update on tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lymphocytic exudates not due to tuberculosis almost always have adenosine
      deaminase levels below 40 U/L.
    explanation: >-
      Supports the 40 U/L cut-off in lymphocytic exudates.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A pleural fluid ADA level above 40 U·L−1 is frequently used as the
      diagnostic cut-off for pTB, and appears to be unaffected by HIV status,
      even at low CD4 count
    explanation: >-
      Cut-off and performance in HIV.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      very high levels (>250 U·L−1) are unusual in TB, and should prompt
      consideration of an alternative diagnosis such as bacterial empyema or
      lymphoma
    explanation: >-
      Very high ADA points to other diagnoses.
- name: Combined pleural fluid ADA, lymphocyte-to-neutrophil ratio and closed biopsy
  description: >-
    In high-incidence settings, an elevated ADA with a lymphocyte/neutrophil
    ratio of at least 0.75 and no malignant cells justifies treatment; adding
    closed needle biopsy gives accuracy close to thoracoscopy (93% sensitivity
    and 100% specificity in a prospective South African comparison).
  evidence:
  - reference: PMID:14582908
    reference_title: "Diagnostic tools in tuberculous pleurisy: a direct comparative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Combined ADA, lymphocyte/neutrophil ratio > or = 0.75 plus closed needle
      biopsy reached 93% sensitivity and 100% specificity.
    explanation: >-
      Accuracy of the combined criterion in 51 patients.
  - reference: PMID:12719023
    reference_title: Tuberculous pleural effusions.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It has been recommended that treatment for tuberculosis be initiated if
      analysis of pleural fluid shows high ADA activity, a
      lymphocyte/neutrophil ratio greater than 0.75, and no malignant cells.
    explanation: >-
      The criterion for starting treatment.
- name: Pleural fluid unstimulated interferon-gamma
  description: >-
    Pleural fluid interferon-gamma has pooled sensitivity 0.93 and specificity
    0.96 (67 studies, 7,153 patients), possibly better than ADA, but no
    optimal cut-off is established and all studies were at high risk of bias.
    Interferon-gamma release assays on pleural fluid perform poorly and are
    not the same test.
  diagnosis_term:
    preferred_term: Interferon gamma measurement
    term:
      id: NCIT:C81996
      label: Interferon Gamma Measurement
  evidence:
  - reference: PMID:33208475
    reference_title: "Unstimulated Pleural Fluid Interferon Gamma for Diagnosis of Tuberculous Pleural Effusion: a Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The summary estimates for sensitivity, specificity, and diagnostic odds
      ratio were 0.93 (95% confidence interval [CI], 0.91 to 0.95), 0.96 (95%
      CI, 0.94 to 0.97)
    explanation: >-
      Pooled accuracy across 67 studies.
  - reference: PMID:33208475
    reference_title: "Unstimulated Pleural Fluid Interferon Gamma for Diagnosis of Tuberculous Pleural Effusion: a Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All publications demonstrated a high risk of bias.
    explanation: >-
      Caveat on the quality of the included studies.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      IGRA has performed poorly in the diagnosis of pTB, with a pooled
      sensitivity and specificity for pleural fluid assays of 72% and 78%
    explanation: >-
      Distinguishes stimulated release assays, which perform poorly.
- name: Pleural fluid nucleic acid amplification (Xpert MTB/RIF and Ultra)
  description: >-
    Highly specific and gives rifampicin-resistance information, but
    insensitive because of the low bacillary load: Xpert 0.52 against culture
    and 0.21 against a composite reference; Ultra 0.68 and 0.47. Useful to rule
    in, not to rule out.
  diagnosis_term:
    preferred_term: Nucleic acid amplification test
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:35816471
    reference_title: "Xpert MTB/RIF Ultra versus Xpert MTB/RIF for diagnosis of tuberculous pleural effusion: A systematic review and comparative meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Summary estimates for sensitivity and specificity for Xpert were 0.52
      (95% CI 0.43-0.60, I2 82.1%) and 0.99 (95% CI 0.97-0.99, I2 85.1%),
      respectively, using culture-based reference standard; and 0.21 (95% CI
      0.17-0.26, I2 81.5%) and 1.00 (95% CI 0.99-1.00, I2 37.6%),
      respectively, using composite reference standard.
    explanation: >-
      Pooled Xpert accuracy across 74 studies.
  - reference: PMID:35816471
    reference_title: "Xpert MTB/RIF Ultra versus Xpert MTB/RIF for diagnosis of tuberculous pleural effusion: A systematic review and comparative meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Summary estimates for sensitivity and specificity for Ultra were 0.68
      (95% CI 0.55-0.79, I2 80.0%) and 0.97 (95% CI 0.97-0.99, I2 92.1%),
      respectively, using culture-based reference standard; and 0.47 (95% CI
      0.40-0.55, I2 64.1%) and 0.98 (95% CI 0.95-0.99, I2 54.8%),
      respectively, using composite reference standard.
    explanation: >-
      Pooled Ultra accuracy.
- name: Mycobacterial smear and culture of pleural fluid and sputum
  description: >-
    Smears of pleural fluid are almost always negative. Fluid culture yield
    varies with method: under 40% classically, 63% with liquid media in a
    Taiwanese series. Induced sputum is culture positive in about half of
    patients even without visible lung disease, and combining fluid and sputum
    culture raises the yield; culture is the route to drug-susceptibility
    testing.
  diagnosis_term:
    preferred_term: Microbial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:20345583
    reference_title: Update on tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pleural fluid cultures are positive for Mycobacterium tuberculosis in
      less than 40% and smears are virtually always negative.
    explanation: >-
      Low smear and culture yield.
  - reference: PMID:22436167
    reference_title: "Revisiting tuberculous pleurisy: pleural fluid characteristics and diagnostic yield of mycobacterial culture in an endemic area."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The diagnostic yields were 63% for effusion culture, 48% for sputum
      culture, 79% for the combination of effusion and sputum cultures, and 74%
      for histological examination of pleural biopsy specimens.
    explanation: >-
      Culture yields with liquid media in 382 patients.
  - reference: PMID:19672657
    reference_title: Tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sputum induction (in addition to pleural fluid) for acid-fast bacilli and
      culture is a recommended procedure in all patients with TB pleurisy.
    explanation: >-
      Recommends induced sputum in all patients.
- name: Closed (Abrams) needle pleural biopsy
  description: >-
    Closed needle biopsy of the parietal pleura (Abrams or another needle)
    shows granulomas and gives tissue for culture; at least six samples are
    recommended. Yield is about 60-80% in skilled hands (histology 66%, culture
    48%, combined 79% in a prospective comparison).
  diagnosis_term:
    preferred_term: Pleural biopsy
    term:
      id: NCIT:C51897
      label: Pleural Biopsy
  evidence:
  - reference: PMID:14582908
    reference_title: "Diagnostic tools in tuberculous pleurisy: a direct comparative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sensitivity of histology, culture and combined histology/culture was 66,
      48 and 79%, respectively for closed needle biopsy and 100, 76 and 100%,
      respectively for thoracoscopy.
    explanation: >-
      Closed biopsy and thoracoscopy compared in the same 42 tuberculosis
      patients.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Closed needle biopsy, using either the superior Abrams needle or an
      alternative biopsy needle, offers a lower diagnostic yield, but it
      remains somewhere in the region of 60–80% when performed by a skilled
      operator
    explanation: >-
      Yield of Abrams and other closed needles.
- name: Medical thoracoscopy with pleural biopsy
  description: >-
    The most accurate test, diagnostic in over 90% of cases, with large
    samples for histology and culture; limited by cost and availability in
    high-burden regions.
  diagnosis_term:
    preferred_term: Diagnostic thoracoscopy
    term:
      id: NCIT:C64947
      label: Diagnostic Thoracoscopy
  evidence:
  - reference: PMID:14582908
    reference_title: "Diagnostic tools in tuberculous pleurisy: a direct comparative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sensitivity of histology, culture and combined histology/culture was 66,
      48 and 79%, respectively for closed needle biopsy and 100, 76 and 100%,
      respectively for thoracoscopy.
    explanation: >-
      Thoracoscopic histology was 100% sensitive.
  - reference: PMID:20345583
    reference_title: Update on tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In questionable cases the diagnosis can be established by demonstrating
      granulomas or organisms on tissue specimens obtained via needle biopsy
      of the pleura or thoracoscopy.
    explanation: >-
      Tissue diagnosis in uncertain cases.
- name: Tuberculin skin test
  description: >-
    Positive in about two thirds to nine tenths of patients; a negative test
    does not exclude pleural tuberculosis.
  diagnosis_term:
    preferred_term: Tuberculin skin test
    term:
      id: NCIT:C85994
      label: Tuberculin Skin Test
  evidence:
  - reference: PMID:9778201
    reference_title: "Tuberculous pleurisy: a study of 254 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Negative skin test results were no guarantee of the effusion being
      nontuberculous.
    explanation: >-
      A negative test does not exclude the diagnosis.
- name: Chest radiography
  description: >-
    Shows a unilateral effusion, usually less than two thirds of the
    hemithorax; associated parenchymal lesions are seen on radiography in a
    minority (18.9% in one series), but CT finds coexistent lung disease more
    often.
  diagnosis_term:
    preferred_term: Chest radiography
    term:
      id: NCIT:C38103
      label: Chest Radiography
  evidence:
  - reference: PMID:9778201
    reference_title: "Tuberculous pleurisy: a study of 254 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Associated pulmonary lesions were detected in 18.9% of patients, of whom
      14.6% exhibited cavitation.
    explanation: >-
      Pulmonary lesions in a minority on radiography.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Coexistent pulmonary TB is common, with parenchymal disease detected on
      up to 85% of computed tomography (CT) scans performed in patients with
      pTB
    explanation: >-
      CT detects coexistent lung disease more often.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    The same regimen as for pulmonary tuberculosis: isoniazid, rifampicin and
    pyrazinamide (with ethambutol in current four-drug practice) for two
    months, then isoniazid and rifampicin for four months, under direct
    observation where adherence is a concern. Shorter regimens with fewer drugs
    have been studied because the disease is paucibacillary. Longer courses are
    used for complicated, loculated effusions and empyema, and have been
    suggested for empirically treated patients and people living with HIV,
    with limited supporting data. Drug-resistant disease is treated under
    drug-resistant pulmonary tuberculosis guidelines in an experienced centre.
    Treatment also prevents the later active tuberculosis that follows an
    untreated effusion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Paucibacillary Containment with Persistent Viable Bacilli
    treatment_effect: INHIBITS
    description: >-
      Chemotherapy kills the persisting pleural bacilli.
    evidence:
    - reference: PMID:7855916
      reference_title: Tuberculous pleural effusion in the eastern province of Saudi Arabia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Six months anti-TB therapy resulted in complete recovery in 86
        patients.
      explanation: >-
        Recovery in 86 of 89 treated patients.
  - target: Subsequent Active Tuberculosis After Untreated Pleurisy
    treatment_effect: INHIBITS
    description: >-
      Treating the pleurisy prevents later active tuberculosis.
    evidence:
    - reference: PMID:20345583
      reference_title: Update on tuberculous pleural effusion.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        if this diagnosis is not made the patient will recover only to have a
        high likelihood of subsequently developing pulmonary or extrapulmonary
        tuberculosis
      explanation: >-
        The reason for diagnosing and treating is to prevent later active
        disease.
  evidence:
  - reference: PMID:27499981
    reference_title: Tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The recommended treatment for TPE is a regimen with isoniazid, rifampin,
      and pyrazinamide for two months followed by four months of two drugs,
      isoniazid and rifampin.
    explanation: >-
      Recommended regimen and duration.
  - reference: PMID:19672657
    reference_title: Tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A reasonable management strategy for pleural TB would be to initiate a
      four-drug regimen and perform a therapeutic thoracentesis in patients
      with large, symptomatic effusions.
    explanation: >-
      Four-drug initial regimen.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A standard 6-month regimen is commonly used for drug-sensitive disease,
      with use of directly observed therapy where concern exists around
      potential compliance
    explanation: >-
      Six-month regimen with directly observed therapy.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Given the paucibacillary nature of pTB, some studies have explored the
      use of shorter regimens with fewer drugs
    explanation: >-
      Shorter, reduced-drug regimens have been studied.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Longer regimens are commonly employed in complicated, loculated
      tuberculous effusions and in TB empyema
    explanation: >-
      Longer regimens for complicated effusions.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Extended treatment durations have also been suggested for subgroups of
      patients such as those receiving empiric therapy (as can frequently be
      the case in pTB) or PLHIV, although data supporting this strategy are
      limited
    explanation: >-
      Extended duration in empiric treatment and HIV, weakly supported.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The treatment of drug-resistant pTB should follow international
      guidelines for the treatment of drug-resistant pulmonary TB and should be
      undertaken in an experienced centre.
    explanation: >-
      Management of drug-resistant disease.
- name: Adjunctive Systemic Corticosteroids
  description: >-
    Adjunctive prednisolone is not routinely recommended. In a Cochrane review
    of six trials (590 participants), corticosteroids may shorten resolution
    of the effusion and reduce residual effusion and pleural changes (low
    certainty), with no shown benefit on long-term lung function. Adverse
    events leading to discontinuation were more frequent, and in the trial in
    HIV-positive people Kaposi sarcoma occurred only in the steroid group, a
    caution against their use with HIV.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Pleural Fibrin Deposition and Fibrosis
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids may reduce pleural thickening and adhesions.
    evidence:
    - reference: PMID:28290161
      reference_title: Corticosteroids for tuberculous pleurisy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        corticosteroids may reduce the risk of having pleural changes (such as
        pleural thickening or pleural adhesions), on chest X-ray at the end of
        follow-up by almost one third (RR 0.72, 95% CI 0.57 to 0.92; 393
        participants, 5 trials,low certainty evidence)
      explanation: >-
        Pooled trial evidence for fewer pleural changes, low certainty.
  - target: Pleural Th1 Delayed-Type Hypersensitivity Response
    treatment_effect: INHIBITS
    description: >-
      Suppressing the pleural inflammatory response may hasten resolution of

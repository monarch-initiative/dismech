      label: type II interferon production
    modifier: INCREASED
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: INCREASED
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:19672657
    reference_title: Tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The immediate cause of the effusion is a delayed hypersensitivity
      response to mycobacterial antigens in the pleural space.
    explanation: >-
      Defines the hypersensitivity response this node represents.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The infiltrating lymphocytes seen in most tuberculous effusions are
      predominantly memory T-helper (Th)1 cells, presumably sensitised at the
      time of initial host infection, that selectively home to the infected
      pleural space
    explanation: >-
      The pleural lymphocytes are memory Th1 cells.
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In a purified protein derivative-sensitised guinea pig model, lymphocyte
      depletion prevented the formation of a pleural effusion following
      injection of tuberculous protein into the pleural space
    explanation: >-
      Guinea pig experiment showing the lymphocytic influx is needed for the
      effusion.
  - reference: PMID:12719023
    reference_title: Tuberculous pleural effusions.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      tuberculous effusions have high adenosine deaminase (ADA) activity,
      apparently due to high levels of the ADA isoenzyme ADA2, which is only
      found in monocytes and macrophages
    explanation: >-
      Pleural ADA comes from activated monocytes and macrophages.

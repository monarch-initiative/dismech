- name: Therapeutic Thoracentesis and Pleural Drainage
  description: >-
    Large, symptomatic effusions are drained for relief of dyspnoea. In a
    randomised trial, pigtail drainage added to chemotherapy shortened
    dyspnoea but did not reduce residual pleural thickening or improve forced
    vital capacity; evidence for routine early drainage is inconsistent.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Thoracentesis
    term:
      id: NCIT:C15392
      label: Thoracentesis
  target_mechanisms:
  - target: Exudative pleural effusion
    treatment_effect: INHIBITS
    description: >-
      Removing the fluid relieves breathlessness.
    evidence:
    - reference: PMID:12554899
      reference_title: "Pigtail drainage in the treatment of tuberculous pleural effusions: a randomised study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Although the duration of dyspnoea was significantly shortened by the
        use of pigtail drainage
      explanation: >-
        Drainage shortened dyspnoea in a randomised trial.
  evidence:
  - reference: PMID:12554899
    reference_title: "Pigtail drainage in the treatment of tuberculous pleural effusions: a randomised study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The addition of pigtail drainage to an effective anti-TB regimen is not

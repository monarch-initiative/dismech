    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacillus that causes tuberculosis. In the
    common tuberculous effusion only a few bacilli are present in the pleural
    space, held in check by the local Th1 response.
  evidence:
  - reference: PMID:12719023
    reference_title: Tuberculous pleural effusions.

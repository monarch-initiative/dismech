prevalence:
- population: United States national tuberculosis surveillance, 1993-2003
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Pleural tuberculosis, reported as the major and only site, made up a stable
    median 3.6% (range 3.3-4.0%) of reported tuberculosis each year, 7,549
    cases over 11 years. This is a share of tuberculosis cases, not a
    population prevalence or incidence, so no rate is asserted. Reviews give
    3-25% of tuberculosis cases, higher in high-burden settings and with HIV.
  evidence:
  - reference: PMID:17426219
    reference_title: "Pleural tuberculosis in the United States: incidence and drug resistance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      From 1993 through 2003, 7,549 cases of pleural TB and 156,779 cases of
      pulmonary TB were reported
    explanation: >-
      Case count in US surveillance.
  - reference: PMID:17426219
    reference_title: "Pleural tuberculosis in the United States: incidence and drug resistance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The annual proportion of pleural TB was relatively stable (median rate,
      3.6%; range, 3.3 to 4.0%)
    explanation: >-
      Share of reported tuberculosis that is pleural.
  - reference: PMID:20345583
    reference_title: Update on tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Between 3% and 25% of patients with tuberculosis will have tuberculous
      pleuritis.
    explanation: >-
      Range of the pleural share across settings.
environmental:
- name: HIV co-infection
  description: >-
    HIV raises the rate of pleural involvement among people with tuberculosis.
    With low CD4 counts the local lymphocytic response is weaker, the pleural
    bacillary load higher (more smear- and culture-positive fluid), and the
    illness longer and more severe, with more constitutional symptoms and
    disseminated disease. Pleural ADA remains a useful marker even at low CD4
    counts.
  influences_mechanisms:
  - target: Mycobacterium tuberculosis Entry into the Pleural Space
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      People living with HIV who have tuberculosis more often have pleural
      involvement.
    evidence:
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        one US-based study reporting pleural involvement in 11% of TB patients
        living with HIV, compared with 6% of TB patients living without HIV
      explanation: >-
        Higher proportion of pleural involvement among tuberculosis patients
        with HIV.
  - target: Paucibacillary Containment with Persistent Viable Bacilli
    environmental_effect: MODULATES
    causal_link_type: DIRECT
    description: >-
      CD4 depletion weakens containment, so the pleural bacillary load rises.
    evidence:
    - reference: PMID:9484963
      reference_title: "Pleural tuberculosis in Harare, Zimbabwe: the relationship between human immunodeficiency virus, CD4 lymphocyte count, granuloma formation and disseminated disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        A CD4+ count of <200 x 10(6)/l was associated with a length of illness
        >30 days (65% vs 37%; P = 0.05), a positive pleural fluid smear (37% vs
        0%; P = 0.0006)
      explanation: >-
        Low CD4 counts are associated with smear-positive pleural fluid and
        longer illness in 90 patients, 85% HIV positive.
  evidence:
  - reference: PMID:20345583
    reference_title: Update on tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The incidence of pleural tuberculosis is higher in patients who are HIV
      positive.
    explanation: >-
      HIV is a risk factor for pleural tuberculosis.
  - reference: PMID:11495266
    reference_title: "Evaluation of suspected tuberculous pleurisy: clinical and diagnostic findings in HIV-1-positive and HIV-negative adults in Uganda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of 156 individuals enrolled, 142 had tuberculosis, of whom 80% were
      HIV-positive. Among those with tuberculosis, HIV-positive patients bad a
      more severe and longer illness.
    explanation: >-
      In Uganda most patients with tuberculous pleurisy were HIV positive, and
      they had more severe, longer illness (the source misprints "had" as
      "bad").
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PLHIV with pTB often present later with constitutional symptoms and may
      have evidence of disseminated disease
    explanation: >-
      HIV changes the presentation.
pathophysiology:
- name: Mycobacterium tuberculosis Entry into the Pleural Space
  role: trigger
  description: >-
    Bacilli and mycobacterial antigens reach the pleural space, classically by
    rupture of a subpleural caseous focus; direct infection of the pleural
    space is now thought to start the cascade, rather than a purely
    hypersensitivity process.
  biological_scale: ORGANISM
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:12719023
    reference_title: Tuberculous pleural effusions.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculosis is caused by the rupture of a pulmonary subpleural caseous
      focus, which releases mycobacterium into the pleural cavity
    explanation: >-
      Rupture of a subpleural caseous focus releases bacilli into the pleural
      cavity.
  - reference: PMID:26150911
    reference_title: "Tuberculous pleural effusions: advances and controversies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      what was once thought to be an effusion as a result of a pure delayed
      hypersensitivity reaction is now believed to be the consequence of direct
      infection of the pleural space with a cascade of events including an
      immunological response
    explanation: >-
      Direct pleural infection starts the process.
  downstream:
  - target: Early Neutrophilic Pleural Influx
    causal_link_type: DIRECT
    description: >-
      Bacilli in the pleural space first recruit neutrophils and monocytes.
    evidence:
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Animal studies, supported by observations in human populations,
        suggest early neutrophil and monocyte infiltration, followed by a
        protracted influx of pre-sensitised T-lymphocytes into the pleural
        space that give rise to persistent pleural effusion
      explanation: >-
        Early neutrophil and monocyte infiltration follows pleural seeding.
  - target: Pleural Th1 Delayed-Type Hypersensitivity Response
    causal_link_type: DIRECT
    description: >-
      Mycobacterial antigens in the pleural space trigger an immune response
      of macrophages and CD4+ T lymphocytes.
    evidence:
    - reference: PMID:12719023
      reference_title: Tuberculous pleural effusions.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Tuberculosis is caused by the rupture of a pulmonary subpleural caseous
        focus, which releases mycobacterium into the pleural cavity, thereby
        triggering an immune response involving mainly macrophages, CD4+ T
        lymphocytes
      explanation: >-
        States the step from pleural seeding to the macrophage and CD4+ T-cell
        response.
- name: Early Neutrophilic Pleural Influx
  description: >-
    In the first days neutrophils and monocytes enter the pleural space. About
    10% of sampled tuberculous effusions are neutrophil predominant; these have
    higher smear and culture positivity and more loculation, and many become
    lymphocytic on repeat sampling.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While lymphocyte predominance is the most common finding in tuberculous
      effusions, ∼10% of sampled tuberculous effusions in human studies are
      neutrophil predominant
    explanation: >-
      A minority of effusions are sampled in the neutrophilic phase.
  downstream:
  - target: Pleural Fibrin Deposition and Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neutrophil-predominant effusions loculate more, and loculation is

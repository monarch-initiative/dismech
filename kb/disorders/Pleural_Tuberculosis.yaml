    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculosis is caused by the rupture of a pulmonary subpleural caseous
      focus, which releases mycobacterium into the pleural cavity
    explanation: >-
      Names the mycobacterium released into the pleural cavity as the cause.
agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans as airborne droplet nuclei.
    Pleural disease is not acquired by a separate route; it arises within an
    already infected host, after primary infection or on reactivation.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens

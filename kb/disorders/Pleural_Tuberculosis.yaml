- name: Paucibacillary Containment with Persistent Viable Bacilli
  description: >-
    The Th1 response keeps the pleural bacillary load low, but viable bacilli
    persist. The effusion often resolves without treatment, yet the infection
    is not cleared, and higher smear and culture positivity with low CD4
    counts shows that live bacilli are present.
  biological_scale: CELLULAR
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      these observations suggest that while the Th1 hypersensitivity reaction
      is central to the development and maintenance of the tuberculous
      effusion, it is likely that true pleural infection is present and
      persists
    explanation: >-
      Viable infection persists under the hypersensitivity response.

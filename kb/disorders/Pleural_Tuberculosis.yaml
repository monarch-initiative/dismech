    reference_title: Update on tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pleural fluid cultures are positive for Mycobacterium tuberculosis in
      less than 40% and smears are virtually always negative.
    explanation: >-
      The low bacillary load shows in the low microbiological yield.
  downstream:
  - target: Subsequent Active Tuberculosis After Untreated Pleurisy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Without treatment, the persisting infection later causes active
      pulmonary or extrapulmonary tuberculosis in most patients.
    evidence:
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Despite this initial resolution, however, 65% went on to develop
        active TB in subsequent years
      explanation: >-
        Historical military series in which most untreated patients later
        developed active tuberculosis.
  - target: Pleural empyema
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Rarely, containment fails and the effusion progresses to multibacillary
      tuberculous empyema (curated in Tuberculous_Empyema).
    evidence:

transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The host acquires M. tuberculosis by inhaling airborne bacilli. Pleural
    involvement follows by spread within the host, not by a separate
    transmission route.
- name: Within-host spread into the pleural space
  description: >-
    Bacilli and antigens reach the pleura weeks after primary infection or on
    reactivation, usually by rupture of a subpleural caseous focus.

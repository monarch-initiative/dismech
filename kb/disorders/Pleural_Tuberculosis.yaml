      not a demonstrated causal chain.
    evidence:
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        demonstrate greater loculation ... (which in turn is associated with
        higher rates of persistent pleural thickening
      explanation: >-
        Links neutrophil-predominant effusions to loculation and persistent
        pleural thickening.
- name: Pleural Th1 Delayed-Type Hypersensitivity Response
  description: >-
    Memory Th1 cells sensitised at the initial infection home selectively to
    the pleura and produce more interferon-gamma than their blood
    counterparts, compartmentalising the response. Interferon-gamma activates
    pleural macrophages, which release adenosine deaminase (the ADA2 isoenzyme).
    In sensitised guinea pigs, lymphocyte depletion prevents the effusion, so
    the lymphocytic influx is required for it.
  biological_scale: CELLULAR
  conforms_to: "granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation"
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: interferon-gamma production
    term:

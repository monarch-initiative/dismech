notes: >-
  Scope. This entry covers the common paucibacillary, lymphocytic tuberculous
  pleural effusion (tuberculous pleuritis). Frank tuberculous empyema
  (MONDO:0005999, a MONDO child of this term), with purulent, multibacillary
  fluid and a thick pleural rind, is curated separately in
  Tuberculous_Empyema.yaml and appears here only as a pointer subtype and as the
  failed-containment complication. Tuberculosis.yaml carries a single
  Tuberculous Pleuritis node within the general tuberculosis pathograph; this
  entry is the full curation of that site. Lipid effusions (pseudochylothorax,
  chylothorax) mentioned in the cited review are not modelled. Evidence base.
  The mechanism rests on narrative reviews and on guinea pig and human
  pleural-fluid studies summarised in them; the clinical picture on
  retrospective or small prospective hospital series from Spain, Saudi Arabia,
  Qatar, Taiwan, Brazil (children), Uganda and Zimbabwe; diagnostic accuracy on
  pooled meta-analyses whose included studies were all at high risk of bias;
  treatment on one Cochrane review of six corticosteroid trials and one
  randomised drainage trial. The classic natural-history figures (spontaneous
  resolution of all 141 effusions and later active tuberculosis in 65%) come
  from a 1955 United States military series whose PubMed record has no
  abstract; they are quoted here from a 2023 review. Symptom frequencies are
  taken from the adult series (Saudi prospective, Qatar retrospective); the
  two disagree on band for cough (80% versus 77%), and the more conservative
  band is used. Hypoalbuminaemia and anaemia are recorded from the Qatar series
  but have no upstream edge, because no cited source explains their mechanism
  in pleural tuberculosis; anorexia and the positive tuberculin skin test are
  likewise left without an edge, since no cited sentence links them to a
  pathophysiology node. Weight loss, anorexia and night sweats have no
  frequency because the sources give either a combined figure or a figure
  quoted from older literature. No cached source documented Mycobacterium bovis
  or another M. tuberculosis complex member as a cause of pleural tuberculosis,
  and no mortality figure specific to pleural tuberculosis was found, so no
  non-human reservoir and no clinical burden block are recorded. NCIT has no
  adenosine deaminase measurement term, so that diagnosis row carries no term.
  Seeded from research/Pleural_Tuberculosis-deep-research-claude_code.md, used
  as leads only; every claim is supported by an evidence item quoting a cached
  abstract or full text.
review_notes: >-
  Deliberately lumped. The only has_subtypes row is a pointer to the separately
  curated tuberculous empyema. Candidate strata in the literature were checked
  against the infectious-disease granularity ladder: primary pleurisy after
  recent infection versus reactivation pleurisy, HIV-associated pleurisy with a
  higher bacillary load and more chronic onset, neutrophil-predominant early
  effusions, loculated effusions, and paediatric disease. They share organism,
  mechanism, diagnostic approach and first-line therapy and are recorded in
  descriptions, progression phases and environmental entries rather than as
  subtypes. No organism stratum (M. bovis, M. africanum) was documented for
  pleural tuberculosis in a cached source.

- name: Intrapleural Fibrinolytic Therapy
  description: >-
    Drainage with intrapleural fibrinolytics such as urokinase has been
    reported to reduce residual thickening, improve lung function and speed
    resolution in free-flowing and loculated effusions, but the optimal
    regimen is not established. No agent term is bound because the cited
    review names urokinase only as an example.
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Pleural Fibrin Deposition and Fibrosis
    treatment_effect: INHIBITS
    description: >-
      Fibrinolysis breaks down pleural fibrin and septa.
    evidence:
    - reference: PMID:38125799
      reference_title: The tuberculous pleural effusion.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Drainage facilitated by the instillation of intrapleural fibrinolytics
        such as urokinase has been shown to reduce residual pleural thickening
      explanation: >-
        Less residual thickening with fibrinolytics.
  evidence:
  - reference: PMID:38125799
    reference_title: The tuberculous pleural effusion.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

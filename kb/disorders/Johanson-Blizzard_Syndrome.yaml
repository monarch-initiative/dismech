discussions:
- discussion_id: jbs_mouse_pancreatic_fidelity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Intrauterine Destructive Pancreatitis
  prompt: >-
    Does the Ubr1(-/-) mouse capture the intrauterine destructive pancreatitis
    that produces exocrine failure in human JBS, or only a milder functional
    insufficiency that leaves the destructive prenatal mechanism unmodeled?
  rationale: >-
    In human JBS the pancreas does not express UBR1 and shows an
    intrauterine-onset destructive pancreatitis with acinar loss and fibro-fatty
    replacement. The Ubr1(-/-) mouse reproduces functional exocrine pancreatic
    insufficiency with impaired stimulus-secretion coupling and increased injury
    susceptibility, but the reported phenotype is milder and does not recapitulate
    the destructive prenatal pancreatitis, nor the craniofacial, dental and
    auditory malformations. Functional redundancy among the overlapping N-end rule
    ligases (notably UBR2) in the mouse is a candidate explanation. The mismatch
    matters because the destructive-pancreatitis mechanism, not simple secretory
    failure, is what makes JBS exocrine insufficiency congenital and near-total, so
    a model that omits it cannot test interventions aimed at the destructive
    process itself.
  proposed_experiments:
  - experiment_id: jbs_ubr1_ubr2_pancreas
    name: Prenatal pancreatic histology in Ubr1/Ubr2 compound-deficient mice
    description: >-
      Compare prenatal and early-postnatal pancreatic histology (acinar apoptosis,
      inflammation, fibro-fatty replacement) across Ubr1(-/-) and Ubr1/Ubr2
      compound-deficient genotypes against controls, to test whether removing the
      redundant N-end rule ligase unmasks the destructive prenatal pancreatitis
      seen in human JBS.
    would_support:
    - pathophysiology#Intrauterine Destructive Pancreatitis
    supporting_outcome:
    - >-
      Compound-deficient animals develop destructive prenatal pancreatitis with
      acinar apoptosis and fibro-fatty replacement resembling human JBS, absent in
      single Ubr1(-/-) animals.
    would_refute:
    - pathophysiology#Intrauterine Destructive Pancreatitis
    refuting_outcome:
    - >-
      No genotype reproduces the destructive prenatal pancreatitis, indicating the
      human mechanism depends on factors not captured by murine N-end rule ligase
      loss.

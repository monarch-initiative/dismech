name: Johanson-Blizzard syndrome
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >-
  Johanson-Blizzard syndrome (JBS) is a rare autosomal recessive multisystem
  disorder caused by biallelic loss-of-function variants in UBR1, which encodes
  one of the E3 ubiquitin ligases of the N-end rule (Arg/N-degron) branch of the
  ubiquitin-proteasome system. Its clinical hallmark is congenital exocrine
  pancreatic insufficiency together with hypoplasia or aplasia of the nasal alae,
  aplasia cutis of the scalp, oligodontia of the permanent teeth, sensorineural
  hearing loss, short stature and variable intellectual disability; hypothyroidism,
  other endocrinopathies including later-onset diabetes, and cardiac,
  genitourinary and anorectal malformations occur in a subset. In affected
  individuals the pancreas does not express UBR1 and shows an intrauterine-onset
  destructive pancreatitis with acinar loss and fibro-fatty replacement, so
  exocrine failure is largely established by birth. The proximate molecular defect
  is failure of regulated N-degron proteolysis, but the specific disease-relevant
  substrate(s) stabilized in human pancreas and in the developing craniofacial,
  cochlear and endocrine tissues remain undefined; missense alleles that retain
  partial catalytic activity are associated with milder disease.

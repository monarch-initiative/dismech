pathophysiology:
- name: Biallelic UBR1 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous variants in UBR1 abolish or strongly
    reduce the activity of the encoded E3 ubiquitin ligase. Most JBS alleles are
    nonsense, frameshift or splice-site changes that abolish activity; missense
    changes in the conserved UBR-box and RING-H2 domains reduce it. In patient
    pancreas UBR1 protein is not expressed.
  genes:
  - preferred_term: UBR1
    term:
      id: hgnc:16808
      label: UBR1
  genetic_context:
    gene:
      preferred_term: UBR1
      term:
        id: hgnc:16808
        label: UBR1
    allele_type: nonsense, frameshift, splice-site, missense, or whole-exon deletion/duplication
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: UBR1 ubiquitin-protein ligase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
  evidence:
  - reference: PMID:16311597
    reference_title: >-
      Deficiency of UBR1, a ubiquitin ligase of the N-end rule pathway, causes pancreatic dysfunction, malformations and mental retardation (Johanson-Blizzard syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped the disease-associated locus to chromosome 15q14-21.1 and identified mutations, mostly truncating ones, in the gene UBR1 in 12 unrelated families with Johanson-Blizzard syndrome.
    explanation: >-
      Establishes UBR1 as the disease gene and the predominance of truncating,
      activity-abolishing mutations.
  - reference: PMID:21931868
    reference_title: >-
      Ubiquitin ligases of the N-end rule pathway: assessment of mutations in UBR1 that cause the Johanson-Blizzard syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Most JBS-causing alterations of UBR1 are nonsense, frameshift or splice-site mutations that abolish UBR1 activity.
    explanation: >-
      Classifies the mutational spectrum as loss-of-function that abolishes ligase
      activity.
  downstream:
  - target: Impaired N-end Rule Proteolysis
    description: >-
      Loss of UBR1 catalytic function directly removes the substrate-recognition
      and ubiquitin-transfer step it performs in the N-end rule pathway.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16311597
      reference_title: >-
        Deficiency of UBR1, a ubiquitin ligase of the N-end rule pathway, causes pancreatic dysfunction, malformations and mental retardation (Johanson-Blizzard syndrome).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        UBR1 encodes one of at least four functionally overlapping E3 ubiquitin ligases of the N-end rule pathway, a conserved proteolytic system whose substrates include proteins with destabilizing N-terminal residues.
      explanation: >-
        Places UBR1 as a recognin of the N-end rule pathway whose loss impairs that
        proteolytic step.
- name: Impaired N-end Rule Proteolysis
  biological_scale: MOLECULAR
  description: >-
    UBR1 recognizes destabilizing N-terminal residues (N-degrons) and targets
    those substrates for ubiquitin-dependent degradation. Its loss impairs
    regulated N-degron proteolysis, with metabolic stabilization of specific N-end
    rule substrates in affected tissues. The identity of the disease-relevant
    substrate(s) in human pancreas and developing organs is not established.
  biological_processes:
  - preferred_term: N-end rule pathway proteolysis
    modifier: DECREASED
    term:
      id: GO:0071596
      label: ubiquitin-dependent protein catabolic process via the N-end rule pathway
  evidence:
  - reference: PMID:21931868
    reference_title: >-
      Ubiquitin ligases of the N-end rule pathway: assessment of mutations in UBR1 that cause the Johanson-Blizzard syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      One class of degradation signals (degrons) recognized by UBR1 are destabilizing N-terminal residues of protein substrates.
    explanation: >-
      Defines the N-degron substrates whose regulated degradation fails when UBR1
      is lost.
  downstream:
  - target: Intrauterine Destructive Pancreatitis
    description: >-
      In the exocrine pancreas, loss of N-end rule proteolysis is followed by a
      destructive prenatal pancreatitis; the intervening substrate is unknown, so
      the edge is annotated with unknown intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16311597
      reference_title: >-
        Deficiency of UBR1, a ubiquitin ligase of the N-end rule pathway, causes pancreatic dysfunction, malformations and mental retardation (Johanson-Blizzard syndrome).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings indicate that deficiency of UBR1 perturbs the pancreas' acinar cells and other organs, presumably owing to metabolic stabilization of specific substrates of the N-end rule pathway.
      explanation: >-
        Attributes the acinar-cell injury to substrate stabilization downstream of
        UBR1 loss, while the hedged "presumably" marks the intermediate as unknown.
  - target: Multisystem Developmental and Organ Dysfunction
    description: >-
      Beyond the pancreas, UBR1 loss perturbs other organs, converging on the
      craniofacial, ectodermal, cochlear and endocrine malformations of JBS. The
      tissue-specific developmental mechanism has not been demonstrated, so the
      edge carries unknown intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16311597
      reference_title: >-
        Deficiency of UBR1, a ubiquitin ligase of the N-end rule pathway, causes pancreatic dysfunction, malformations and mental retardation (Johanson-Blizzard syndrome).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings indicate that deficiency of UBR1 perturbs the pancreas' acinar cells and other organs, presumably owing to metabolic stabilization of specific substrates of the N-end rule pathway.
      explanation: >-
        States that UBR1 deficiency perturbs organs beyond the pancreas, the
        support for a multisystem developmental branch.

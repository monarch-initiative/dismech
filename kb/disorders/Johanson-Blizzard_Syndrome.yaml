      label: Autosomal recessive inheritance
  description: >-
    JBS is caused by biallelic (homozygous or compound heterozygous)
    loss-of-function variants in UBR1; parental consanguinity is frequently
    observed given the rarity of the allele.
  evidence:
  - reference: PMID:16311597
    reference_title: >-
      Deficiency of UBR1, a ubiquitin ligase of the N-end rule pathway, causes pancreatic dysfunction, malformations and mental retardation (Johanson-Blizzard syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Johanson-Blizzard syndrome (OMIM 243800) is an autosomal recessive disorder that includes congenital exocrine pancreatic insufficiency, multiple malformations such as nasal wing aplasia, and frequent mental retardation.
    explanation: >-
      The gene-discovery paper states the autosomal recessive inheritance and the
      defining clinical triad.
  - reference: PMID:34760428
    reference_title: >-
      Performance of Children With Johanson-Blizzard Syndrome After Cochlear Implantation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of JBS is estimated to be 1 in 250,000, with no reported difference in gender while parental consanguinity is frequently observed
    explanation: >-
      Records the frequent parental consanguinity consistent with recessive
      inheritance of a rare allele.

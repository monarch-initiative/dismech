animal_models:
- name: Ubr1-null mouse exocrine pancreatic phenotype
  species: Mouse
  genotype: Ubr1(-/-)
  publication: PMID:16311597
  modeled_mechanisms:
  - target: Exocrine Pancreatic Insufficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Ubr1(-/-) mice develop exocrine pancreatic insufficiency with impaired
      stimulus-secretion coupling and increased susceptibility to pancreatic
      injury, directionally matching the human exocrine defect.
    limitations: >-
      The murine phenotype is milder than human JBS: the abstract reports
      functional exocrine insufficiency and injury susceptibility but not the
      intrauterine-onset destructive pancreatitis seen in patient pancreas, and the
      mouse does not reproduce the craniofacial, dental or auditory malformations.
      Functional redundancy with the overlapping N-end rule ligase UBR2 in mice is
      thought to buffer the single-Ubr1 knockout.

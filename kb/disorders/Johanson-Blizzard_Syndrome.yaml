genetic:
- name: UBR1
  association: Causal biallelic variant
  gene_term:
    preferred_term: UBR1
    term:
      id: hgnc:16808
      label: UBR1
  notes: >-
    UBR1 (chromosome 15q15.2) encodes an E3 ubiquitin ligase of the N-end rule
    pathway. Biallelic loss-of-function variants cause JBS; most are truncating
    (nonsense/frameshift/splice), with missense variants in the conserved UBR-box
    and RING-H2 domains producing milder disease when residual catalytic activity
    is retained. No predominant founder allele is known.
  evidence:
  - reference: PMID:16311597
    reference_title: >-
      Deficiency of UBR1, a ubiquitin ligase of the N-end rule pathway, causes pancreatic dysfunction, malformations and mental retardation (Johanson-Blizzard syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped the disease-associated locus to chromosome 15q14-21.1 and identified mutations, mostly truncating ones, in the gene UBR1 in 12 unrelated families with Johanson-Blizzard syndrome.
    explanation: >-
      Original identification of UBR1 as the JBS disease gene across 12 families.
  - reference: PMID:21931868
    reference_title: >-
      Ubiquitin ligases of the N-end rule pathway: assessment of mutations in UBR1 that cause the Johanson-Blizzard syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      one of them (H160R) was inactive in yeast-based activity assays, the other one (Q1224E) had a detectable but weak activity, and the third one (V146L) exhibited a decreased but significant activity, in agreement with manifestations of JBS in the corresponding JBS patients.
    explanation: >-
      Functional assays establish a genotype-severity correlation with residual
      catalytic activity.

notes: >-
  Curated de novo from a Claude Code deep-research report (see
  research/Johanson-Blizzard_Syndrome-deep-research-claude_code.md) with every
  ontology term and evidence snippet independently verified. Two CURIEs suggested
  by the report were rejected during term verification: HP:0001060 (proposed for
  aplasia cutis; it is actually "Axillary pterygium" - the scalp defect is bound
  here to HP:0007385) and CHEBI:6710 (proposed for levothyroxine; it is actually
  meclofenamic acid - levothyroxine is bound here to NCIT:C62080). The specific
  N-end rule substrate(s) stabilized in human pancreas and developing organs
  remain undefined, so the extra-pancreatic developmental edges are annotated
  INDIRECT_UNKNOWN_INTERMEDIATES.

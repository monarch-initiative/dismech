name: Short-Rib Thoracic Dysplasia 6 With or Without Polydactyly
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- SRTD6
- NEK1-related short-rib thoracic dysplasia
- Short-rib polydactyly syndrome type II
- Majewski syndrome
- Short rib-polydactyly syndrome, Majewski type
description: >-
  Short-rib thoracic dysplasia 6 is the NEK1-related form of the skeletal ciliopathy
  spectrum, corresponding clinically to short-rib polydactyly syndrome type II
  (Majewski). NEK1 encodes a NIMA-related serine/threonine kinase that localises to the
  basal body region and coordinates the primary cilium cycle with the cell cycle; loss of
  functional full-length NEK1 severely reduces cilium number and alters ciliary
  morphology in vivo. The skeletal phenotype follows from that: the growth plate depends
  on primary-cilium-transduced Hedgehog signalling, so ciliary failure gives markedly
  short ribs, a narrow thorax, micromelia and - variably - polydactyly. Death is
  perinatal, from pulmonary hypoplasia secondary to the constricted thoracic cage rather
  than from primary lung disease.

  The distinguishing radiographic feature of the Majewski type is short ovoid tibiae or
  outright tibial agenesis, which separates it from the Beemer-Langer type (IV), where
  the tibiae are relatively well tubulated. That distinction turns out to be genetically
  meaningful: screening 13 SRP type II and seven type IV cases found NEK1 or DYNC2H1
  mutations only in type II and in none of the type IV cases.

  Two nomenclature points a curator should hold onto. First, NEK1 is not the only gene
  behind the type II phenotype - homozygous NEK1 mutations were found in 5 of 13 type II
  cases, compound heterozygous DYNC2H1 in 4 of 12, and neither gene in 3 of 12, so the
  entity is genetically heterogeneous and the modern per-gene SRTD numbering is what
  makes this entry a single disease. Second, digenic diallelic inheritance has been
  proposed on the strength of a family carrying heterozygous NEK1 and DYNC2H1 mutations;
  that rests on individual families, not a systematic two-locus series.
disease_term:
  preferred_term: short-rib thoracic dysplasia 6 with or without polydactyly
  term:

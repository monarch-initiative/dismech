histopathology:
- name: Femoral epiphyseal growth plate
  description: >-
    Postmortem histology of the femoral growth plate shows an expanded and irregular
    hypertrophic zone. This is the tissue-level correlate of the impaired endochondral
    ossification the pathograph asserts: the hypertrophic chondrocytes accumulate instead
    of being replaced in orderly columns, which is what produces short bones from a growth
    plate that is present but not working.
  evidence:
  - reference: PMID:24854045
    reference_title: "Majewski syndrome (short-rib polydactyly syndrome type II): Prenatal diagnosis and histological features of chondral growth plate, liver and kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological examination of the femoral epypheseal chondral plate showed an expanded and irregular hypertrophic zone."
    explanation: The growth-plate lesion itself, in an autopsied Majewski case.
- name: Kidney and liver
  description: >-
    Cortico-medullary renal cysts with portal fibrosis of the liver - the visceral
    ciliopathy findings that accompany the skeletal phenotype and place this disorder in
    the ciliopathy group rather than among isolated skeletal dysplasias.
  evidence:
  - reference: PMID:24854045
    reference_title: "Majewski syndrome (short-rib polydactyly syndrome type II): Prenatal diagnosis and histological features of chondral growth plate, liver and kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, characteristic cortico-medullary cysts of both kidneys and portal fibrosis were also demonstrated; findings consistent with the broad phenotypic spectrum of this rare skeletal disease."
    explanation: >-
      Renal cystic disease and portal fibrosis at autopsy, the classic ciliopathy visceral
      pair.
treatments:
- name: Perinatal Palliative Care
  description: >-
    Majewski-type short-rib polydactyly syndrome is lethal in the perinatal period from
    respiratory failure, and no treatment alters that. Palliative care and the counselling
    that goes with a prenatal or perinatal diagnosis are what is actually offered. This
    section is short because the disorder is lethal, not because management was not looked
    for.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: palliative therapy
    term:
      id: NCIT:C15292
      label: Palliative Therapy
  notes: >-
    No cached reference reports a palliative-care protocol for this specific disorder, so
    this entry carries no evidence item rather than a quote that does not say what the
    entry claims. Its basis is the lethality documented elsewhere in this file.
- name: Genetic Counselling and Prenatal Diagnosis
  description: >-
    Counselling with a 25% recurrence risk for the autosomal recessive form, and prenatal
    ultrasound that can detect the phenotype in the second trimester. Counselling is
    load-bearing here rather than routine: recurrence risk is not straightforwardly 25% in
    every family, because a digenic diallelic mechanism involving NEK1 and DYNC2H1 has been
    proposed, and a negative NEK1 result does not exclude the clinical diagnosis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22482978
    reference_title: "Short rib-polydactyly syndrome type II (Majewski): prenatal diagnosis, perinatal imaging findings and molecular analysis of the NEK1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tibial aplasia, choroid plexus cysts and polycystic kidneys can be prominent prenatal ultrasound findings of type II SRPS."
    explanation: >-
      The prenatally detectable findings on which prenatal diagnosis, and therefore
      counselling in a subsequent pregnancy, rests.
- name: Thoracic Expansion Surgery
  description: >-
    Progressive internal distraction of the sternum, used at the non-lethal end of the
    short-rib thoracic dysplasia group. Curated with an explicit boundary: this is a Jeune
    syndrome intervention, reported in two patients, and no NEK1 or Majewski-type patient
    has been treated this way because they do not survive to be candidates. It is here
    because the surgical target - the constricted thorax - is the same node, and because a
    reader asking whether anything can be done for the chest should find the answer with
    its limits attached rather than find nothing.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: thoracoplasty
    term:
      id: NCIT:C86923
      label: Thoracoplasty
  target_mechanisms:
  - target: Thoracic Constriction
    treatment_effect: MODULATES
    description: >-
      Enlarges the thoracic cavity mechanically. It does not touch the ciliary or
      growth-plate lesion upstream, so it is palliative of the constriction rather than
      disease-modifying.
  evidence:
  - reference: PMID:37822322

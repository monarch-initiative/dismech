inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic NEK1 variants. Identified by homozygosity mapping in two consanguineous
    families with Majewski-type short-rib polydactyly syndrome.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21211617
    reference_title: "NEK1 mutations cause short-rib polydactyly syndrome type majewski."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used homozygosity mapping in two families with autosomal-recessive short-rib polydactyly syndrome Majewski type to identify mutations in NEK1 as an underlying cause of this lethal osteochondrodysplasia."
    explanation: The founding recessive mapping result.
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study identified homozygous NEK1 mutations in 5/13 SRP type II and compound heterozygous DYNC2H1 mutations in 4/12 cases."
    explanation: Confirms biallelic NEK1 involvement in an independent case series.
- name: Digenic diallelic (NEK1/DYNC2H1)
  description: >-
    A proposed second inheritance mode in which heterozygous mutations at two ciliopathy
    loci combine. It rests on individual families rather than a systematic two-locus
    screen, and one prenatal case with a single paternal-origin NEK1 splice variant and no
    identified second mutation is consistent with - but does not establish - the same
    idea. Treat it as proposed, not settled.
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  evidence:
  - reference: PMID:21211617
    reference_title: "NEK1 mutations cause short-rib polydactyly syndrome type majewski."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We further substantiate a proposed digenic diallelic inheritance of ciliopathies by the identification of heterozygous mutations in NEK1 and DYNC2H1 in an additional family."
    explanation: >-
      Graded PARTIAL - a single additional family substantiating a pre-existing proposal,
      which is suggestive rather than conclusive.
  - reference: PMID:22482978
    reference_title: "Short rib-polydactyly syndrome type II (Majewski): prenatal diagnosis, perinatal imaging findings and molecular analysis of the NEK1 gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis of fetal tissues showed a paternal-origin heterozygous splice site mutation in intron 7 (c.465-1 G>A) in the NEK1 gene, but no mutations in the genes of WDR35, DYNC2H1, IFT80, EVC and EVC2. The NEK1 mutation causes an alteration of the splice acceptor site of intron 7 (IVS7-1 G>A). No second mutation was identified."
    explanation: >-
      A clinically typical case with only one identified NEK1 allele and no second hit in
      the screened ciliopathy genes. Consistent with an unfound second allele or with a
      non-classical inheritance mechanism; it distinguishes neither.
pathophysiology:
- name: NEK1 Loss of Function
  description: >-
    Biallelic NEK1 variants abolish functional full-length protein. NEK1 is a
    serine/threonine kinase of the NIMA-related family with proposed roles in DNA
    double-strand break repair, neuronal development and cell-cycle-associated
    ciliogenesis. Reported alleles include splice-site variants disrupting the acceptor
    site of intron 7.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NEK1
    term:
      id: hgnc:7744
      label: NEK1
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
  downstream:
  - target: Defective Ciliogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21211617
    reference_title: "NEK1 mutations cause short-rib polydactyly syndrome type majewski."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NEK1 encodes a serine/threonine kinase with proposed function in DNA double-strand repair, neuronal development, and coordination of cell-cycle-associated ciliogenesis."
    explanation: Defines the gene product and its proposed functions.
  - reference: PMID:22482978
    reference_title: "Short rib-polydactyly syndrome type II (Majewski): prenatal diagnosis, perinatal imaging findings and molecular analysis of the NEK1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The NEK1 mutation causes an alteration of the splice acceptor site of intron 7 (IVS7-1 G>A)."
    explanation: An example of the splice-disrupting allele class.
- name: Defective Ciliogenesis
  description: >-
    Loss of NEK1 severely reduces cilium number and alters ciliary morphology in vivo.
    Mechanistically NEK1 sits at the basal body, and the relationship is dose-sensitive in
    both directions: overexpressing NEK1 also inhibits ciliogenesis in cultured epithelial
    cells, and cilium number is dramatically reduced in kat2J mouse embryonic fibroblasts.
    That two-sided sensitivity is why NEK1 is thought to link cell-cycle progression to
    the cilium cycle rather than simply to build cilia.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  cellular_components:
  - preferred_term: centriole
    term:
      id: GO:0005814
      label: centriole
  downstream:
  - target: Impaired Growth Plate Chondrogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:21211617
    reference_title: "NEK1 mutations cause short-rib polydactyly syndrome type majewski."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that absence of functional full-length NEK1 severely reduces cilia number and alters ciliar morphology in vivo."
    explanation: The primary ciliary phenotype in patient material.
  - reference: PMID:18387364
    reference_title: "The mammalian Nek1 kinase is involved in primary cilium formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated herein that Nek1 is localized to basal body region and that Nek1 overexpression inhibits ciliogenesis in Madin-Darby canine kidney epithelial cells."
    explanation: Localises NEK1 to the basal body and shows overexpression also impairs ciliogenesis.
  - reference: PMID:18387364
    reference_title: "The mammalian Nek1 kinase is involved in primary cilium formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The number of primary cilia is dramatically reduced in kat2J mouse embryonic fibroblasts culture."
    explanation: Independent confirmation of reduced ciliation in a Nek1-deficient mouse line.
  - reference: PMID:18387364
    reference_title: "The mammalian Nek1 kinase is involved in primary cilium formation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "It is thus hypothesized that Nek1 links cell cycle progression and the PC cycle."
    explanation: >-
      Graded PARTIAL - explicitly stated as a hypothesis by its authors, and it is the
      interpretation that makes sense of loss and overexpression both being disruptive.
- name: Impaired Growth Plate Chondrogenesis
  description: >-
    The primary cilium transduces Hedgehog signalling, on which endochondral ossification
    at the growth plate depends. Ciliary failure therefore produces the disproportionate
    shortening of ribs and long bones and the digit patterning defects that define the
    disorder. The founding study suggests the severity of the resulting skeletal phenotype
    tracks the degree of defective microtubule or centriole elongation, which would place
    NEK1 disease and the other skeletal ciliopathies on one mechanistic continuum rather
    than making them separate entities.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Thoracic Constriction
    causal_link_type: DIRECT
  notes: >-
    A biological_processes descriptor for smoothened signaling pathway with
    modifier: DECREASED was removed. Reduced Hedgehog signalling downstream of ciliary
    failure is a well-established mechanism in the skeletal ciliopathies generally, but no
    reference cached for this entry measures or states it for NEK1, so as curated it was an
    unevidenced modifier on an otherwise evidence-backed node. The inference is kept in the
    description, where it reads as reasoning rather than as an annotated fact. Restoring
    the descriptor needs a source that reports Hedgehog output in NEK1-deficient tissue.
  evidence:
  - reference: PMID:24854045
    reference_title: "Majewski syndrome (short-rib polydactyly syndrome type II): Prenatal diagnosis and histological features of chondral growth plate, liver and kidneys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological examination of the femoral epypheseal chondral plate showed an expanded and irregular hypertrophic zone."
    explanation: >-
      The histological lesion at the growth plate itself, in an autopsied Majewski case -
      an expanded, disorganised hypertrophic zone. This is the direct tissue-level evidence
      for the node, which previously rested only on a proposed genotype-severity
      correlation.
  - reference: PMID:21211617
    reference_title: "NEK1 mutations cause short-rib polydactyly syndrome type majewski."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest a correlation between the degree of defective microtubule or centriole elongation and organization and the severity of the resulting phenotype"
    explanation: >-
      Graded PARTIAL - a proposed genotype-severity correlation, stated as a suggestion
      rather than a measured relationship.
- name: Thoracic Constriction
  description: >-
    Markedly short ribs give a small, rigid, bell-shaped thorax. This is the skeletal
    lesion expressed at the level of the chest wall, and it is what the surgical
    interventions attempted at the survivable end of the spectrum are aimed at.
  biological_scale: TISSUE
  locations:
  - preferred_term: thoracic cavity
    term:
      id: UBERON:0002224
      label: thoracic cavity
  downstream:
  - target: Pulmonary Hypoplasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lethal short rib polydactyly syndromes (SRP type I-IV) are characterised by notably short ribs, short limbs, polydactyly, multiple anomalies of major organs, and autosomal recessive mode of inheritance."
    explanation: >-
      Establishes the short ribs that constrict the thorax. Graded as support for the rib
      lesion specifically; it is a group-level definition and does not by itself assert the
      mechanical consequence, which is why that claim now sits on the edge below.
- name: Pulmonary Hypoplasia
  description: >-
    Lungs that cannot reach normal size because the chest cannot accommodate them. The
    lungs are intrinsically normal - this is a mechanical consequence of the chest wall,
    not independent lung disease, and it is the proximate cause of death.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:37822322
    reference_title: "Case report: A simple and reliable approach for progressive internal distraction of the sternum for Jeune syndrome (asphyxiating thoracic dystrophy): preliminary experience and literature review of surgical techniques."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Described for the first time in 1954, Jeune syndrome (JS), often called asphyxiating thoracic dystrophy, is a congenital musculoskeletal disease characterized by short ribs, a narrow thorax, and small limbs."
    explanation: >-
      Graded PARTIAL and cited across the disease boundary deliberately. Jeune syndrome is
      the non-lethal end of the same short-rib thoracic dysplasia group, and it is where
      the mechanical chain from short ribs to a narrow thorax is documented in patients who
      survive long enough to be treated. Nothing about NEK1 is claimed from it.

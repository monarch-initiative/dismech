  - reference: PMID:37822322
    reference_title: "Case report: A simple and reliable approach for progressive internal distraction of the sternum for Jeune syndrome (asphyxiating thoracic dystrophy): preliminary experience and literature review of surgical techniques."
    supports: PARTIAL

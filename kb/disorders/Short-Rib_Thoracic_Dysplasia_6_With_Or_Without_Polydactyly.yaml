- name: Abnormal Tibia Morphology
  category: Skeletal
  description: >-
    Short ovoid tibiae or outright tibial agenesis. This is the radiographic feature that
    distinguishes Majewski-type from Beemer-Langer-type short-rib polydactyly syndrome,
    where the tibiae are relatively well tubulated - and that distinction turns out to
    track the genetics, since NEK1 and DYNC2H1 were excluded in all type IV cases tested.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Short ovoid tibiae or tibial agenesis
    term:
      id: HP:0002992
      label: Abnormal tibia morphology
  evidence:
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SRP type II (Majewski; MIM 263520) is characterised by short ovoid tibiae or tibial agenesis and is radiographically closely related to SRP type IV (Beemer-Langer; MIM 269860) which is distinguished by bowed radii and ulnae and relatively well tubulated tibiae."
    explanation: Defines the tibial finding as the type II/IV radiographic discriminator.
  - reference: PMID:22482978
    reference_title: "Short rib-polydactyly syndrome type II (Majewski): prenatal diagnosis, perinatal imaging findings and molecular analysis of the NEK1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tibial aplasia, choroid plexus cysts and polycystic kidneys can be prominent prenatal ultrasound findings of type II SRPS."
    explanation: Tibial aplasia as a prenatally detectable feature.
  notes: >-

genetic:
- name: NEK1
  notes: >-
    NEK1 accounts for a minority of Majewski-type cases - homozygous NEK1 mutations in
    5 of 13, with compound heterozygous DYNC2H1 in 4 of 12 and neither gene in 3 of 12.
    The phenotype is therefore genetically heterogeneous and a negative NEK1 result does
    not exclude the clinical diagnosis. Note also that NEK1 is separately established as
    an amyotrophic lateral sclerosis risk gene; the ciliopathy and ALS roles are distinct
    claims and should not be conflated. Zygosity and allele class separate them: the
    skeletal disease is autosomal recessive with biallelic loss of function, while the ALS
    association is a heterozygous risk effect including a specific missense variant.
    Nothing here should be read as saying that carriers of a Majewski allele are at ALS
    risk, or that the ciliary mechanism curated here operates in motor neurons.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: NEK1
    term:
      id: hgnc:7744
      label: NEK1
  evidence:
  - reference: PMID:21211617
    reference_title: "NEK1 mutations cause short-rib polydactyly syndrome type majewski."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to identify mutations in NEK1 as an underlying cause of this lethal osteochondrodysplasia"
    explanation: The founding gene-disease association.
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms that NEK1 is one gene causing SRP type II but also reports mutations in DYNC2H1, expanding the phenotypic spectrum of DYNC2H1 mutations."
    explanation: Independent confirmation, and explicit statement that NEK1 is one gene among several.
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exclusion of NEK1 and DYNC2H1 in 3/12 SRP type II and in all SRP type IV cases further support genetic heterogeneity."
    explanation: Quantifies the unexplained fraction and the clean separation from type IV.
  - reference: PMID:37585529
    reference_title: "Loss of function of the ALS-associated NEK1 kinase disrupts microtubule homeostasis and nuclear import."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function variants in NIMA-related kinase 1 (NEK1) constitute a major genetic cause of amyotrophic lateral sclerosis (ALS), accounting for 2 to 3% of all cases."
    explanation: >-
      Graded NO_EVIDENCE deliberately. This says nothing about the skeletal ciliopathy; it
      is here to substantiate the pleiotropy statement in the notes, which was previously
      unevidenced prose. Quantifying the ALS role at 2-3% of cases shows how large and how
      separate that literature is.
  - reference: PMID:38986433
    reference_title: "Clinicopathological analysis of NEK1 variants in amyotrophic lateral sclerosis."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, the p.Arg261His missense variant was associated with significantly increased disease susceptibility."
    explanation: >-
      Also NO_EVIDENCE for the skeletal claim. Quoted because it names the allele class
      behind the ALS association - a heterozygous missense risk variant - which is what
      distinguishes it from the biallelic loss of function that causes this disorder.
- name: DYNC2H1
  notes: >-
    DYNC2H1 encodes the cytoplasmic dynein 2 heavy chain that drives retrograde
    intraflagellar transport, so it acts on the same ciliary process as NEK1. It is
    curated here as COOPERATING rather than CAUSATIVE for a specific reason: in the
    Majewski series it accounts for its own biallelic cases (compound heterozygous in 4 of
    12), which would make it causative for those patients, but this entry is keyed to
    MONDO:0009894, the NEK1-defined disorder. What earns it a place here is the digenic
    observation - a family carrying heterozygous mutations in both genes - which is the
    claim the disease-level inheritance block makes and which the genetic section
    previously did not know about.
  relationship_type: COOPERATING
  gene_term:
    preferred_term: DYNC2H1
    term:
      id: hgnc:2962
      label: DYNC2H1
  evidence:
  - reference: PMID:21211617
    reference_title: "NEK1 mutations cause short-rib polydactyly syndrome type majewski."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We further substantiate a proposed digenic diallelic inheritance of ciliopathies by the identification of heterozygous mutations in NEK1 and DYNC2H1 in an additional family."
    explanation: >-
      The digenic observation, which is what makes DYNC2H1 a cooperating locus here rather
      than simply another gene for the same clinical picture.
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Double heterozygosity for mutations in both NEK1 and DYNC2H1 in one SRP type II case supported possible digenic diallelic inheritance."
    explanation: >-
      Independent restatement of the same double-heterozygous case, which is the whole
      evidential basis for the digenic claim - one family, reported twice.
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The study identified homozygous NEK1 mutations in 5/13 SRP type II and compound heterozygous DYNC2H1 mutations in 4/12 cases."
    explanation: >-
      Graded PARTIAL. It quantifies DYNC2H1's independent contribution to the Majewski
      phenotype, which is real but belongs to a different MONDO concept than this entry.
diagnosis:
- name: Whole exome sequencing
  description: >-
    WES is established as an efficient first-line method for the short-rib thoracic
    dystrophies. Across 11 affected individuals it identified biallelic mutations in six
    confirmed SRTD genes including NEK1 in 10, giving 90.9% sensitivity, with specificity
    above 99% against 993 unaffected individuals. That performance matters here because
    the alternative - iterative Sanger sequencing across 14 genes and 398 exons - is
    expensive enough that it is often simply not undertaken.
  evidence:
  - reference: PMID:25492405
    reference_title: "Whole exome sequencing is an efficient, sensitive and specific method for determining the genetic cause of short-rib thoracic dystrophies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compound heterozygous or homozygous mutations were identified in six confirmed SRTD genes in 10 individuals (IFT172, DYNC2H1, TTC21B, WDR60, WDR34 and NEK1), giving overall sensitivity of 90.9%."
    explanation: Establishes WES sensitivity, with NEK1 among the genes detected.
  - reference: PMID:25492405
    reference_title: "Whole exome sequencing is an efficient, sensitive and specific method for determining the genetic cause of short-rib thoracic dystrophies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conventional mutation detection (usually by iterative Sanger sequencing) is inefficient and expensive, and often not undertaken."
    explanation: The comparator that makes WES the recommended approach.
animal_models:
- name: kat2J Nek1-deficient mouse
  species: Mouse
  genotype: Nek1 kat2J homozygous (spontaneous mutant)
  publication: PMID:25030234
  description: >-
    A spontaneous Nek1 mutant line originally characterised as a polycystic kidney disease
    model rather than a skeletal one. Homozygotes show aberrant kidney development before
    gross cysts appear - thin cortical zones, immature glomeruli, excessive apoptosis -
    then postnatal cysts throughout the nephron. Cilia lining the cysts are morphologically
    diverse, some unusually long and some multiple.
  genes:
  - preferred_term: NEK1
    term:
      id: hgnc:7744
      label: NEK1
  modeled_mechanisms:
  - target: Defective Ciliogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the ciliary defect in an intact animal, both as reduced cilium number in
      embryonic fibroblasts and as abnormal ciliary morphology in cyst-lining cells.
    limitations: >-
      Note the direction is not simply "fewer cilia": in cyst-lining cells some cilia are
      unusually long and some cells carry several, which is a patterning and length-control
      defect rather than a failure to ciliate. That is consistent with NEK1 coordinating
      the cilium cycle, but it means the model's ciliary phenotype is not a clean
      quantitative match to the reduced ciliation reported in patient material.
    readouts:
    - name: Primary cilium number in embryonic fibroblasts
      target: Defective Ciliogenesis
      direction: DECREASED
      interpretation: Reduced ciliation in Nek1-deficient cells.
      evidence:
      - reference: PMID:18387364
        reference_title: "The mammalian Nek1 kinase is involved in primary cilium formation."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The number of primary cilia is dramatically reduced in kat2J mouse embryonic fibroblasts culture."
        explanation: The quantitative ciliary measurement in this model.
    - name: Ciliary morphology in cyst-lining cells
      target: Defective Ciliogenesis
      direction: ALTERED
      interpretation: >-
        Length and number dysregulation rather than absence, supporting a cilium-cycle
        coordination role.
      evidence:
      - reference: PMID:25030234
        reference_title: "Expression of Nek1 during kidney development and cyst formation in multiple nephron segments in the Nek1-deficient kat2J mouse model of polycystic kidney disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The primary cilia of cells lining cysts in kat2J homozygous mice are morphologically diverse: in some cells they are unusually long and in others there are multiple cilia of varying lengths."
        explanation: The morphological description behind this readout.
    evidence:
    - reference: PMID:25030234
      reference_title: "Expression of Nek1 during kidney development and cyst formation in multiple nephron segments in the Nek1-deficient kat2J mouse model of polycystic kidney disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nek1 is the primary protein inactivated in kat2J mouse models of PKD."
      explanation: Establishes the model's genetic basis.
  notes: >-
    This model carries no link to Impaired Growth Plate Chondrogenesis, deliberately. The
    cited characterisation is entirely renal: no rib, thorax, limb or growth-plate phenotype
    is reported. That is an absence of reported skeletal assessment, not a documented normal
    skeleton, and FAILS_TO_RECAPITULATE is a substantive negative claim that exports consume
    - encoding "nobody looked" as "the model fails" would put a claim into the graph that no
    source makes. The gap is recorded in the nek1_srtd6_no_skeletal_model discussion
    instead, which is where an unanswered question belongs. A study that assays the kat2J
    skeleton and finds it normal is the evidence such a link would need.
  evidence:
  - reference: PMID:25030234
    reference_title: "Expression of Nek1 during kidney development and cyst formation in multiple nephron segments in the Nek1-deficient kat2J mouse model of polycystic kidney disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the embryonic kidney, Nek1 expression is most prominent in cells that will become podocytes and proximal tubules."
    explanation: Expression data supporting the model's relevance to the renal component of the disorder.
discussions:
- discussion_id: nek1_srtd6_no_skeletal_model
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why has the Nek1 mouse been characterised almost entirely as a kidney model when the
    human NEK1 disorder is defined by a lethal skeletal phenotype, and does a Nek1 mouse
    reproduce the short ribs and thoracic constriction at all?
  attaches_to:
  - pathophysiology#Impaired Growth Plate Chondrogenesis
  - pathophysiology#Thoracic Constriction
  - pathophysiology#Pulmonary Hypoplasia
  rationale: >-
    The kat2J line predates the human skeletal association by decades and entered the
    literature as a polycystic kidney disease model, so its characterisation followed the
    kidney. The result is that the organ system carrying essentially all of the human
    mortality has no reported model phenotype. Three readings are possible and they are not
    equivalent: the mouse skeleton may be genuinely spared, in which case there is a
    species difference in how growth-plate chondrocytes depend on NEK1; the skeletal
    phenotype may simply never have been looked for; or perinatal lethality in the severe
    human alleles may have no murine counterpart because kat2J is hypomorphic rather than
    null. Distinguishing them needs only skeletal preparations and rib measurements on
    existing animals. Until then, nothing in the model literature tests the growth-plate
    Hedgehog mechanism this entry proposes.
  evidence:
  - reference: PMID:25030234
    reference_title: "Expression of Nek1 during kidney development and cyst formation in multiple nephron segments in the Nek1-deficient kat2J mouse model of polycystic kidney disease."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Our studies indicate that Nek1 deficiency leads to disordered kidney maturation, and cysts throughout the nephron."
    explanation: The scope of the model's published characterisation - renal, not skeletal.
  - reference: PMID:21211617
    reference_title: "NEK1 mutations cause short-rib polydactyly syndrome type majewski."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to identify mutations in NEK1 as an underlying cause of this lethal osteochondrodysplasia"
    explanation: >-
      The human phenotype is an osteochondrodysplasia, which is precisely what the model
      literature does not report on.
- discussion_id: nek1_srtd6_unexplained_type_ii_cases
  kind: KNOWLEDGE_GAP
  prompt: >-
    What causes the quarter of Majewski-type short-rib polydactyly cases in which neither
    NEK1 nor DYNC2H1 is mutated?
  attaches_to:
  - genetic#NEK1
  rationale: >-
    In the largest targeted screen, NEK1 and DYNC2H1 were both excluded in 3 of 12 type II
    cases. That is not a rounding error, and the study reports a clinical correlate worth
    following: holoprosencephaly and polymicrogyria were the main difference between the
    mutation-positive and mutation-negative groups. A brain malformation segregating with
    the unexplained cases suggests they may not be the same entity at all, rather than
    being NEK1-negative instances of it - which would matter for whether they belong under
    this MONDO term. Whole exome sequencing is already established as sensitive and
    specific in this disease group, so the cohort exists and the method exists.
  evidence:
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main difference between the mutation positive SRP type II group and the mutation negative SRP type II group was the presence of holoprosencephaly and polymycrogyria in the mutation negative group."
    explanation: >-
      The clinical signal distinguishing the unexplained cases, and the reason to suspect
      they are a separate entity.
  - reference: PMID:22499340
    reference_title: "NEK1 and DYNC2H1 are both involved in short rib polydactyly Majewski type but not in Beemer Langer cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, NEK1 and DYNC2H1 were excluded in 3/12 SRP type II and in all SRP type IV cases."
    explanation: Quantifies the unexplained fraction.

    wrong. The source sentence is "short ovoid tibiae or tibial agenesis" - a disjunction in
    which only the second limb is absence - so HP:0009556 encoded the severe end of a range
    as though it were the whole finding, and VERY_FREQUENT asserted agenesis in over 80% of
    cases, which nothing states. Now bound to the parent term HP:0002992, which is the most
    specific term that accurately covers the disjunction, at FREQUENT. Splitting into Short
    tibia (HP:0005736) and Absent tibia (HP:0009556) would be better, and is not done
    because no cached reference gives separate frequencies for the two forms - the split
    would require inventing a distribution.

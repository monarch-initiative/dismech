  - reference: PMID:34754635
    reference_title: 'Sclerotherapy for Aneurysmal Bone Cyst: A Single-Center Experience.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Sclerotherapy provides an effective, minimally invasive treatment for ABC and is
      particularly useful for deep lesions, challenging access for surgery and potentially
      damaging vital structures.'
    explanation: States the niche in which this option is preferred over surgery.
- name: Denosumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    An anti-RANKL monoclonal antibody, borrowed from giant cell tumour of bone on
    the strength of histological similarity rather than shared genetics. Pain
    relief and neurological improvement are rapid, and most patients ossify. The
    case against routine use is equally clear: recurrence in 18.6%, mostly in
    adults, and five of forty-three reported patients required intensive care for
    hypercalcaemia.
  treatment_term:
    preferred_term: monoclonal antibody therapy
    term:
      id: NCIT:C15490
      label: Monoclonal Antibody Therapy
    therapeutic_agent:
    - preferred_term: denosumab
      term:
        id: NCIT:C61313
        label: Denosumab
  target_mechanisms:
  - target: Osteolysis and Vascular Space Formation
    treatment_effect: INHIBITS
    description: RANKL blockade suppresses osteoclast-mediated bone resorption, the arm of this
      node that produces the lytic destruction. It does not touch the USP6 driver upstream,
      which is the likely reason lesions recur when it is stopped.
    evidence:
    - reference: PMID:34481945
      reference_title: Denosumab in the management of Aneurysmal bone cyst.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Radiological assessment showed ossification and/or volume reduction in 36/39
        patients.'
      explanation: Ossification and volume reduction are the direct readouts of suppressed
        resorption at this node.
  evidence:
  - reference: PMID:34481945
    reference_title: Denosumab in the management of Aneurysmal bone cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Pain relief and neurological improvement were rapid and sustained.'
    explanation: Gives the symptomatic benefit.
  - reference: PMID:34481945
    reference_title: Denosumab in the management of Aneurysmal bone cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Eight patients (18,6%) presented a recurrence after or during denosumab therapy
      of whom 7 were adults. Adverse events occurred in 11 patients, 5 of them were admitted
      to the intensive care unit due to hypercalcemia.'
    explanation: Records the recurrence rate and the serious toxicity, which together are why
      this is reserved for advanced disease.
  - reference: PMID:34481945
    reference_title: Denosumab in the management of Aneurysmal bone cyst.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: 'The oncological outcome remains unclear with a recurrence rate of 18,6% during/after
      denosumab therapy, mostly in adults.'
    explanation: The authors state the oncological outcome is unclear, so this is recorded as
      absence of evidence for durable disease control rather than as support for it.

      term:
        id: CHEBI:46859
        label: polidocanol
  target_mechanisms:
  - target: Osteolysis and Vascular Space Formation
    treatment_effect: INHIBITS
    description: Sclerosis obliterates the vascular spaces, after which the cavity ossifies.
    evidence:
    - reference: PMID:34754635
      reference_title: 'Sclerotherapy for Aneurysmal Bone Cyst: A Single-Center Experience.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Ossification was complete in 24 (92.3%) patients and partial in two (7.7%)
        patients.'
      explanation: Ossification of the cavity is the direct radiological readout that the
        vascular spaces have been obliterated.
  evidence:
  - reference: PMID:34754635
    reference_title: 'Sclerotherapy for Aneurysmal Bone Cyst: A Single-Center Experience.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Eighteen patients (70%) were pain-free at the end of three months.'

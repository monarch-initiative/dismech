name: Aneurysmal Bone Cyst
creation_date: '2026-09-03T15:00:00Z'
description: >-
  A locally aggressive, blood-filled, expansile bone lesion of children and young
  adults, reclassified in the last two decades from a reactive process to a true
  neoplasm. The reclassification rests on a specific and unusual genetic
  mechanism: a translocation places the entire intact USP6 coding sequence
  downstream of a strong constitutive promoter, most often that of the osteoblast
  cadherin CDH11. No fusion protein is made. What changes is transcription, and
  overexpressed USP6 then drives NF-kappa-B activation, matrix metalloproteinase
  production, osteolysis and the florid vascularity that gives the lesion its
  name. Roughly 70% of cases carry the rearrangement; the remaining 30% are
  ABC-like change arising within a different neoplasm and are a separate entity
  that this pathograph does not describe.
categories:
- Bone Neoplasm
- Locally Aggressive Non-Metastasising Neoplasm
- Promoter-Swap Fusion Neoplasm
parents:
- bone neoplasm
synonyms:
- ABC
- aneurysmal cyst of bone
epidemiology:
- name: Age distribution
  description: >-
    Predominantly a lesion of the first two decades of life, and the reason it was
    long grouped with the reactive lesions of growing bone.
  evidence:
  - reference: PMID:15026324
    reference_title: USP6 (Tre2) fusion oncogenes in aneurysmal bone cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Aneurysmal bone cyst (ABC) is a locally aggressive osseous lesion that typically
      occurs during the first two decades of life.
    explanation: Gives the age distribution and the locally aggressive behaviour.
- name: Primary versus secondary proportion
  description: >-
    About 70% of lesions called aneurysmal bone cyst are true neoplasms carrying
    the USP6 rearrangement. The remaining 30% are ABC-like change in some other
    bone neoplasm, which look the same down a microscope and behave according to
    the lesion underneath.
  evidence:
  - reference: PMID:35941207
    reference_title: 'Update on aneurysmal bone cyst: pathophysiology, histology, imaging and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'ABC, which accounts for approximately 70% of the cases, is now recognized to be
      a true neoplasm, whereas ABC-like changes associated to other bone neoplasms (also referred
      in the literature as secondary ABC) accounts for the remaining 30%.'
    explanation: Gives the split between the true neoplasm and the ABC-like change, and states
      the neoplastic reclassification.
has_subtypes:
- name: Primary
  display_name: Primary (USP6-rearranged)
  description: >-
    The true neoplasm. Carries a USP6 rearrangement, which is what the pathograph
    in this entry describes.
  evidence:
  - reference: PMID:30553465
    reference_title: Primary aneurysmal bone cyst with a novel SPARC-USP6 translocation identified by next-generation
      sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Aneurysmal bone cyst (ABC) is a benign but locally aggressive, mostly pediatric
      neoplasm, with characteristic USP6 gene rearrangement that distinguishes it from a secondary
      ABC and other primary bone tumors.'
    explanation: States that the USP6 rearrangement is what defines this subtype against the
      secondary form.
- name: Secondary
  display_name: Secondary (ABC-like change, USP6-negative)
  description: >-
    Not a distinct tumour at all but a reactive cystic change occurring inside
    another neoplasm, most often giant cell tumour of bone, chondroblastoma,
    fibrous dysplasia or osteosarcoma. It is USP6-negative, and its behaviour and
    treatment follow the underlying lesion, not this entry.
  evidence:
  - reference: PMID:31611201
    reference_title: Validation of Fluorescence in situ Hybridization Testing of USP6 Gene Rearrangement for
      Diagnosis of Primary Aneurysmal Bone Cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All secondary ABC, GCT and TOS were negative.
    explanation: Establishes that the secondary form does not carry the rearrangement, which is
      the basis for separating it from the primary lesion.
- name: Solid variant
  description: >-
    A rare form lacking the characteristic cystic blood-filled spaces while
    retaining the neoplastic nature of the primary lesion.
  evidence:
  - reference: PMID:35941207
    reference_title: 'Update on aneurysmal bone cyst: pathophysiology, histology, imaging and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The solid variant of ABC is also considered a true neoplasm but is rare.
    explanation: States the existence and neoplastic status of the solid variant.
pathophysiology:
- name: USP6 Promoter-Swap Rearrangement
  biological_scale: MOLECULAR
  subtypes:
  - Primary
  description: >-
    The initiating lesion, and an unusual one. The recurrent t(16;17)(q22;p13)
    juxtaposes the CDH11 promoter region to the entire USP6 coding sequence, so
    the protein made is ordinary USP6 and only its transcription is deregulated.
    That distinguishes this from the fusion-protein oncogenes it superficially
    resembles. At least thirteen partner promoters are now known, all of them
    strongly expressed in bone or connective tissue, which is consistent with the
    promoter being the operative element rather than the partner gene.
  genes:
  - preferred_term: USP6
    term:
      id: hgnc:12629
      label: USP6
  - preferred_term: CDH11
    term:
      id: hgnc:1750
      label: CDH11
  evidence:
  - reference: PMID:15026324
    reference_title: USP6 (Tre2) fusion oncogenes in aneurysmal bone cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Herein we show that a recurring ABC chromosomal translocation t(16;17)(q22;p13)
      creates a fusion gene in which the osteoblast cadherin 11 gene (CDH11) promoter region
      on 16q22 is juxtaposed to the entire ubiquitin-specific protease USP6 (Tre2) coding sequence
      on 17p13.'
    explanation: Describes the promoter-to-intact-coding-sequence architecture that defines this
      node.
  - reference: PMID:15026324
    reference_title: USP6 (Tre2) fusion oncogenes in aneurysmal bone cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'CDH11 is expressed strongly in bone, and our findings implicate a novel oncogenic
      mechanism in which deregulated USP6 transcription results from juxtaposition to the highly
      active CDH11 promoter.'
    explanation: States explicitly that the mechanism is transcriptional deregulation by a strong
      promoter, which is the point of this node.
  - reference: PMID:30553465
    reference_title: Primary aneurysmal bone cyst with a novel SPARC-USP6 translocation identified by next-generation
      sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Including our case, the list of currently known USP6 fusion partners in primary
      ABC include: CDH11, CNBP, COL1A1, CTNNB1, EIF1, FOSL2, OMD, PAFAH1B1, RUNX2, SEC31A, SPARC,
      STAT3 and THRAP3.'
    explanation: Enumerates the thirteen partners, whose only shared property is strong
      expression, which is the evidence that the promoter rather than the partner is what
      matters.
  downstream:
  - target: USP6 Overexpression with Intact Deubiquitinase Activity
    causal_link_type: DIRECT
    description: The rearrangement raises USP6 transcription; the protein itself is unaltered.
    evidence:
    - reference: PMID:20418905
      reference_title: TRE17/USP6 oncogene translocated in aneurysmal bone cyst induces matrix metalloproteinase
        production via activation of NF-kappaB.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Recent work revealed that ABCs harbor translocation of TRE17/USP6, leading to its
        transcriptional upregulation.
      explanation: States that the consequence of the translocation is transcriptional
        upregulation, which is exactly what this edge asserts.
- name: USP6 Overexpression with Intact Deubiquitinase Activity
  biological_scale: MOLECULAR
  description: >-
    Overexpressed USP6 is sufficient on its own to initiate tumour formation. The
    domain mapping is informative: the deubiquitinase activity is required, while
    the TBC domain that binds the Arf6 GTPase is not. That narrows the mechanism
    to the protease function rather than to vesicular trafficking, which had been
    the other candidate.
  biological_processes:
  - preferred_term: protein deubiquitination
    modifier: INCREASED
    term:
      id: GO:0016579
      label: protein deubiquitination
  evidence:
  - reference: PMID:20418905
    reference_title: TRE17/USP6 oncogene translocated in aneurysmal bone cyst induces matrix metalloproteinase
      production via activation of NF-kappaB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In this study we show that TRE17 is sufficient to induce expression of MMP-9 and
      MMP-10, in a manner requiring its USP activity, but not its ability to bind Arf6.'
    explanation: Establishes that the deubiquitinase activity is the required function and rules
      out the Arf6-binding route.
  downstream:
  - target: NF-kappa-B Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: USP6 activates NF-kappa-B, mediated in part by the GTPase RhoA and its effector
      kinase ROCK.
    evidence:
    - reference: PMID:20418905
      reference_title: TRE17/USP6 oncogene translocated in aneurysmal bone cyst induces matrix metalloproteinase
        production via activation of NF-kappaB.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'TRE17 induces transcription of MMP-9 through activation of nuclear factor-kappaB
        (NF-kappaB), mediated in part by the GTPase RhoA and its effector kinase, ROCK.'
      explanation: Names the pathway and the intermediates, which is why this edge is graded as
        having known intermediates rather than as direct.
- name: NF-kappa-B Activation
  biological_scale: MOLECULAR
  description: >-
    Canonical NF-kappa-B signalling is switched on downstream of USP6, and is the
    transcriptional route to the matrix proteases that do the tissue damage.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:20418905
    reference_title: TRE17/USP6 oncogene translocated in aneurysmal bone cyst induces matrix metalloproteinase
      production via activation of NF-kappaB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'TRE17 induces transcription of MMP-9 through activation of nuclear factor-kappaB
      (NF-kappaB), mediated in part by the GTPase RhoA and its effector kinase, ROCK.'
    explanation: Places NF-kappa-B between the oncogene and the protease output.
  downstream:
  - target: Matrix Metalloproteinase Production and Matrix Degradation
    causal_link_type: DIRECT
    description: NF-kappa-B drives transcription of MMP-9, with MMP-10 also induced.
    evidence:
    - reference: PMID:20418905
      reference_title: TRE17/USP6 oncogene translocated in aneurysmal bone cyst induces matrix metalloproteinase
        production via activation of NF-kappaB.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Furthermore, xenograft studies show that TRE17 induces formation of tumors that
        reproduce multiple features of ABC, including a high degree of vascularization, with
        an essential role for the USP domain.'
      explanation: The xenograft result showing the pathway is sufficient to reproduce the
        lesion, which is the strongest support for the chain this edge sits in.
- name: Matrix Metalloproteinase Production and Matrix Degradation
  biological_scale: CELLULAR
  description: >-
    MMP-9 and MMP-10 are induced and degrade the surrounding matrix. Matrix
    proteases are the common requirement of the three processes that define this
    lesion histologically: osteolysis, inflammatory cell recruitment and extensive
    new vessel formation.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: INCREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  evidence:
  - reference: PMID:20418905
    reference_title: TRE17/USP6 oncogene translocated in aneurysmal bone cyst induces matrix metalloproteinase
      production via activation of NF-kappaB.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'ABCs are characterized by osteolysis, inflammatory recruitment and extensive
      vascularization, the processes in which matrix proteases have a prominent role.'
    explanation: States the link between matrix proteases and the three defining processes of
      the lesion.
  downstream:
  - target: Osteolysis and Vascular Space Formation
    causal_link_type: DIRECT
    description: Matrix degradation permits bone destruction and the ingrowth of the thin-walled
      blood-filled spaces that give the lesion its name and its imaging appearance.
    evidence:
    - reference: PMID:20418905
      reference_title: TRE17/USP6 oncogene translocated in aneurysmal bone cyst induces matrix metalloproteinase
        production via activation of NF-kappaB.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Aneurysmal bone cyst (ABC) is an aggressive, pediatric bone tumor characterized
        by extensive destruction of the surrounding bone.'
      explanation: Names the bone destruction that this edge terminates in.
- name: Osteolysis and Vascular Space Formation
  biological_scale: TISSUE
  description: >-
    The lesion proper: an expansile, lytic, blood-filled cavity with septated
    spaces, produced by osteoclast-mediated bone resorption alongside florid
    angiogenesis. The fluid-fluid levels seen on cross-sectional imaging are the
    direct radiological signature of these spaces.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  evidence:
  - reference: PMID:35941207
    reference_title: 'Update on aneurysmal bone cyst: pathophysiology, histology, imaging and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The imaging appearance of ABC is variable; however, a lytic and expansile lesion
      with fluid-fluid levels is the most common presentation.'
    explanation: Describes the lytic expansile blood-filled lesion that constitutes this node.
  downstream:
  - target: Aneurysmal Bone Cyst
    causal_link_type: DIRECT
    description: The expansile lytic lesion is the structural phenotype itself.
    evidence:
    - reference: PMID:35941207
      reference_title: 'Update on aneurysmal bone cyst: pathophysiology, histology, imaging and treatment.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'ABC can involve any bone in the body, and although it has a metaphyseal preference,
        it can involve any part of a bone and soft tissues.'
      explanation: Describes the distribution of the lesion that this phenotype records.
  - target: Local Bone Destruction and Mass Effect
    causal_link_type: DIRECT
    description: Progressive destruction of cortex and expansion into surrounding tissue produce
      the clinical consequences.
    evidence:
    - reference: PMID:20418905
      reference_title: TRE17/USP6 oncogene translocated in aneurysmal bone cyst induces matrix metalloproteinase
        production via activation of NF-kappaB.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Aneurysmal bone cyst (ABC) is an aggressive, pediatric bone tumor characterized
        by extensive destruction of the surrounding bone.'
      explanation: States the destruction of surrounding bone that this edge asserts.
- name: Local Bone Destruction and Mass Effect
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. The lesion does not metastasise, so morbidity is
    entirely local and depends on site: pain and pathological fracture in long
    bones, cord compression in the spine, proptosis and threatened sight in the
    orbit.
  evidence:
  - reference: PMID:36356178
    reference_title: Aneurysmal Bone Cyst of the Orbit With USP6 Gene Rearrangement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Presentations are varied and can include pain, proptosis, decreased vision, and
      extraocular motility disturbance.'
    explanation: Illustrates how the same lesion produces entirely site-determined morbidity.
  downstream:
  - target: Bone Pain
    causal_link_type: DIRECT
    description: Expansion and cortical destruction produce local bone pain, the usual
      presenting symptom.
    evidence:
    - reference: PMID:34754635
      reference_title: 'Sclerotherapy for Aneurysmal Bone Cyst: A Single-Center Experience.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'There was an improvement in the VAS score, and clinically, there was a significant
        reduction in pain and swelling.'
      explanation: Pain and swelling are the endpoints measured and relieved when the lesion is
        treated, which is indirect but concrete evidence that the lesion produces them.
  - target: Spinal Cord Compression
    causal_link_type: DIRECT
    description: A spinal lesion expanding into the canal compresses the cord, which is the
      indication for the most aggressive management.
    evidence:
    - reference: PMID:34481945
      reference_title: Denosumab in the management of Aneurysmal bone cyst.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Pain relief and neurological improvement were rapid and sustained.'
      explanation: Neurological deficit is one of the two outcomes tracked in treated patients,
        which establishes that the lesion produces it.
  - target: Proptosis
    causal_link_type: DIRECT
    description: An orbital lesion displaces the globe forward and can threaten sight.
    evidence:
    - reference: PMID:36356178
      reference_title: Aneurysmal Bone Cyst of the Orbit With USP6 Gene Rearrangement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Presentations are varied and can include pain, proptosis, decreased vision, and
        extraocular motility disturbance.'
      explanation: Names proptosis among the presentations of the orbital form.

notes: >-
  Scope. The pathograph describes primary, USP6-rearranged aneurysmal bone cyst
  only. Secondary ABC is listed as a subtype for completeness because it carries
  the same name and the same histology, but it is a reactive change inside a
  different neoplasm, is USP6-negative, and behaves according to the lesion
  underneath. Nothing in the causal chain here applies to it.

  Why the genetic mechanism is modelled as a promoter swap rather than a fusion.
  This is the entry's central point and it is easy to get wrong, because the
  seminal paper uses the phrase "fusion gene" and the fusions are named in the
  familiar PARTNER-USP6 style. What is fused is DNA, not protein: the entire USP6
  coding sequence is retained and only the upstream promoter changes. The
  strongest evidence is the partner list itself. Thirteen partners are known and
  they share no functional family, only strong expression in bone and connective
  tissue, which is what one expects if the promoter is the operative element.
  CDH11 and COL1A1 are therefore recorded as COOPERATING rather than as drivers,
  since they contribute a promoter and no protein.

  Where the evidence is thinner than it looks. The core mechanism from USP6
  through NF-kappa-B to MMP-9 and MMP-10 rests on one 2010 cell-culture and
  xenograft study, graded IN_VITRO throughout. It is a strong study, including a
  xenograft that reproduces multiple features of the lesion and a domain mapping
  that separates the required deubiquitinase activity from the dispensable
  Arf6-binding function, but it is one paper and it has not been replicated in
  human lesional tissue in the sources cached here. The chain is not upgraded to
  human evidence on the strength of the clinical papers, which describe the
  lesion rather than testing the pathway.

  A diagnostic discrepancy worth carrying. The FISH validation study reports 53%
  sensitivity for USP6 break-apart while citing a literature rearrangement rate
  of 70 to 75%. Both figures are recorded rather than reconciled, because the gap
  is real and its cause is not established: it may be assay performance,
  case-mix, or genuine absence of rearrangement in a subset. The practical
  consequence is stated in the diagnosis entry - a positive result is decisive,
  a negative one is not.

  Ontology notes. HPO has an exact term for the lesion, HP:0012063 Aneurysmal
  bone cyst, so no generic bone-cyst parent was needed. MAXO is not used in this
  repository, so treatments bind to NCIT actions; denosumab has no CHEBI term and
  uses NCIT:C61313, while polidocanol uses CHEBI:46859.

  Known extension points: prevalence, for which no cleanly quotable incidence
  figure was found in the cached sources; histopathology as a structured section;
  clinical_trials; bisphosphonates, radiofrequency thermal ablation and the
  minimally invasive curopsy and bone-marrow-concentrate techniques, all named in
  the management review but without quotable outcome data in that abstract; and
  the wider family of USP6-driven lesions such as nodular fasciitis and myositis
  ossificans, which would be better modelled as a mechanism module than inside
  this entry.

  Provenance. Curated directly from PubMed. Both configured deep-research
  providers remain unavailable: openscientist.io returns a CloudFront 403 on POST
  and 401 on authenticated GET, and the cyberian backend returns 500. Every
  snippet was fetched with just fetch-reference and verified as an exact
  substring of the cached reference.

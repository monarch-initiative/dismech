diagnosis:
- name: USP6 break-apart fluorescence in situ hybridization
  presence: PRESENT
  description: >-
    A break-apart FISH probe for USP6 separates primary aneurysmal bone cyst from
    the secondary form, giant cell tumour of bone and telangiectatic osteosarcoma,
    which are morphologically similar. Read the operating characteristics
    carefully: in the validation study specificity and positive predictive value
    were both 100%, but sensitivity was only 53% and negative predictive value
    69%. A positive result settles the diagnosis; a negative result does not
    exclude it. Note also that this 53% falls short of the 70 to 75% rearrangement
    rate the same paper cites from the literature, so some of the shortfall is
    assay performance rather than true absence of the rearrangement.
  evidence:
  - reference: PMID:31611201
    reference_title: Validation of Fluorescence in situ Hybridization Testing of USP6 Gene Rearrangement for
      Diagnosis of Primary Aneurysmal Bone Cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The test sensitivity and specificity in primary ABC were 53% (9/17) and 100% (18/18),
      respectively. The positive predictive value and negative predictive value were 100% (9/9)
      and 69% (18/26), respectively.'
    explanation: Gives the operating characteristics that make a positive result decisive and a
      negative result uninformative.
  - reference: PMID:31611201
    reference_title: Validation of Fluorescence in situ Hybridization Testing of USP6 Gene Rearrangement for
      Diagnosis of Primary Aneurysmal Bone Cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Ubiquitin specific protease 6 (USP6) gene rearrangement has been reported in
      approximately 70%-75% of aneurysmal bone cyst cases.'
    explanation: The literature rearrangement rate against which the 53% assay sensitivity should
      be read.
- name: Magnetic resonance imaging
  presence: PRESENT
  description: >-
    Radiographs first, then MRI or less often CT for characterisation. The typical
    appearance is a lytic expansile lesion with fluid-fluid levels.
  evidence:
  - reference: PMID:35941207
    reference_title: 'Update on aneurysmal bone cyst: pathophysiology, histology, imaging and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'As with any bone tumor, the initial evaluation of ABCs should be done with radiographs
      followed by magnetic resonance imaging or less frequently computed tomography for further
      characterization.'
    explanation: States the imaging sequence used for evaluation.
- name: Diagnostic biopsy before treatment
  presence: PRESENT
  description: >-
    Biopsy is recommended before treatment because telangiectatic osteosarcoma, a
    malignant tumour, can look identical on imaging. This is the single most
    consequential pitfall in managing the lesion, since the treatments below would
    be badly wrong for an osteosarcoma.
  evidence:
  - reference: PMID:35941207
    reference_title: 'Update on aneurysmal bone cyst: pathophysiology, histology, imaging and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The main differential diagnosis of an ABC in the pediatric population is unicameral
      bone cyst (UBC) and telangiectatic osteosarcoma, therefore a biopsy is recommended before
      treatment.'
    explanation: States the differential and the resulting recommendation for pre-treatment
      biopsy.
treatments:
- name: Curettage with Local Adjuvants and Bone Grafting
  therapeutic_modality: SURGERY
  description: >-
    The standard operation: manual and high-speed burr curettage, local adjuvants
    such as phenol, liquid nitrogen or argon laser, and grafting to fill the
    defect. Recurrence after treatment is high, which is what drives interest in
    the alternatives below.
  treatment_term:
    preferred_term: curettage procedure
    term:
      id: NCIT:C15216
      label: Curettage Procedure
  target_mechanisms:
  - target: Osteolysis and Vascular Space Formation
    treatment_effect: INHIBITS
    description: Physically removes the lesional tissue and its vascular spaces, without
      addressing the driver in any cells left behind.
    evidence:
    - reference: PMID:31476792
      reference_title: 'Aneurysmal Bone Cyst: A Review of Management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Standard treatment consists of curettage (manual + motorized high-speed burr)
        plus local adjuvants and bone grafting to fill the void.'
      explanation: Describes the operation and its components.
  evidence:
  - reference: PMID:31476792
    reference_title: 'Aneurysmal Bone Cyst: A Review of Management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'It can have an unpredictable behavior, with a high recurrence rate after treatment.
      Treatment is based on personal and institutional experience and preferences.'
    explanation: Records both the high recurrence rate and, candidly, that management is driven
      by local preference rather than by trial evidence.
- name: Percutaneous Sclerotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Intralesional injection of a sclerosant, most often polidocanol, under
    fluoroscopic guidance. Useful where surgical access is difficult or would
    endanger nearby structures. In a single-centre series of 26 patients,
    ossification was complete in 92% and 70% were pain-free at three months.
  treatment_term:
    preferred_term: sclerotherapy
    term:
      id: NCIT:C62732
      label: Sclerotherapy
    therapeutic_agent:

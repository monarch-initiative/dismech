name: BEST1-related Vitreoretinochoroidopathy
creation_date: "2026-10-22T09:00:00Z"
category: Mendelian
parents:
- Bestrophinopathy
- Vitreoretinal degeneration
synonyms:
- ADVIRC
- autosomal dominant vitreoretinochoroidopathy
- VRCP
description: >-
  BEST1-related vitreoretinochoroidopathy (autosomal dominant
  vitreoretinochoroidopathy, ADVIRC) is a rare dominant bestrophinopathy in
  which degeneration begins in the peripheral rather than the macular retina.
  Its hallmark is a 360-degree band of chorioretinal pigmentary change between
  the equator and the ora serrata, with a sharp posterior border, accompanied by
  fibrillar vitreous condensation and, in many families, developmental anomalies
  of the anterior eye: nanophthalmos, microcornea, shallow anterior chamber,
  angle-closure glaucoma, iris dysgenesis and early cataract. Expressivity is
  highly variable within families; the band can be absent, and advanced disease
  with generalized photoreceptor loss can be mistaken for retinitis pigmentosa.
  It is caused by a small set of heterozygous BEST1 variants clustered in a few
  regions of bestrophin-1, the calcium-activated chloride channel of the retinal
  pigment epithelium (RPE). How these alleles cause disease is unresolved.
  Minigene assays showed exon skipping, but splicing was normal in RPE derived
  from patients' own stem cells, which instead show increased BEST1 anion
  permeability, consistent with a gain of channel function that sets ADVIRC
  apart from the loss-of-function bestrophinopathies. Histopathology shows
  widespread RPE loss with RPE migration into the retina. Visual impairment is
  usually mild until late macular atrophy, though onset in early childhood
  occurs.

- name: Peripheral RPE Degeneration and Migration
  biological_scale: TISSUE
  description: >-
    The primary lesion is in the RPE. In the oldest examined eye, RPE was lost
    except for an island in the macula; RPE cells left Bruch's membrane, migrated
    into the neuroretina around blood vessels, possibly by epithelial-mesenchymal
    transition, and the choriocapillaris thinned. Bestrophin-1 itself was barely
    detectable even in surviving RPE. The disease begins in the periphery, where
    it forms the characteristic circumferential band.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  evidence:
  - reference: PMID:29774302
    reference_title: Ocular Histopathology and Immunohistochemical Analysis in the Oldest Known Individual with Autosomal Dominant Vitreoretinochoroidopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary defect in ADVIRC is in RPE, the only cells in the eye that express the BEST1 gene."
    explanation: Histopathology locates the primary lesion in the RPE.
  - reference: PMID:29774302
    reference_title: Ocular Histopathology and Immunohistochemical Analysis in the Oldest Known Individual with Autosomal Dominant Vitreoretinochoroidopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dysfunctional RPE cells may go through epithelial/mesenchymal transition as they migrate from BrMb to form papillary aggregations in the neuro-retina, often ensheathing blood vessels."
    explanation: RPE migration into the retina accounts for the pigmentary change.
  - reference: PMID:29774302
    reference_title: Ocular Histopathology and Immunohistochemical Analysis in the Oldest Known Individual with Autosomal Dominant Vitreoretinochoroidopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Migration of RPE from BrMb was also associated with attenuation of the choriocapillaris."
    explanation: Choroidal involvement accompanies RPE loss.
  downstream:
  - target: Peripheral Circumferential Pigmentary Band
    causal_link_type: DIRECT
  - target: Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal Electrooculogram
    causal_link_type: DIRECT
    description: The EOG light rise is generated by the RPE.
  - target: Cystoid Macular Edema
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Choriocapillaris Atrophy
    causal_link_type: DIRECT
    description: The choriocapillaris depends on RPE-derived VEGF and degenerates where the RPE has left Bruch's membrane.
    evidence:
    - reference: PMID:29774302
      reference_title: Ocular Histopathology and Immunohistochemical Analysis in the Oldest Known Individual with Autosomal Dominant Vitreoretinochoroidopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When RPE cells vacate BrMb, CC lose their source of VEGF, and they degenerate."
      explanation: The authors' explanation for the choriocapillaris loss they observed.
  - target: Retinal Neovascularization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Migrated RPE and inner retinal glia shift the local balance of VEGF and
      PEDF; preretinal neovascularization is attributed to excess VEGF.
    evidence:
    - reference: PMID:29774302
      reference_title: Ocular Histopathology and Immunohistochemical Analysis in the Oldest Known Individual with Autosomal Dominant Vitreoretinochoroidopathy.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We observed greatly elevated PEDF and VEGF in the inner retina and the epiretinal membrane in the ADVIRC subject, compared to the control subject."
      explanation: Elevated retinal VEGF in one eye; the link to neovascularization is the authors' inference.
- name: Photoreceptor Degeneration
  biological_scale: CELLULAR
  description: >-
    Secondary loss of rods and cones, with thinning of the photoreceptor layer
    and shortened outer segments, progressing centripetally; late macular
    atrophy causes cone dysfunction and loss of central vision.

    - reference: PMID:27653836
      reference_title: Mislocalisation of BEST1 in iPSC-derived retinal pigment epithelial cells from a family with autosomal dominant vitreoretinochoroidopathy (ADVIRC).
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "A single amplicon of 200bp was observed in control and patient cells, signifying normal splicing of Exon 6 in ADVIRC patients"
      explanation: Patient-derived RPE carrying an exon 6 missense allele splice normally.
    - reference: PMID:26849243
      reference_title: Long-Term Macular Changes in the First Proband of Autosomal Dominant Vitreoretinochoroidopathy (ADVIRC) Due to a Newly Identified Mutation in BEST1.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "in vitro splicing assays failed to demonstrate an effect of the c.248G > A mutation on splicing of BEST1 exon 3 or exon 4"
      explanation: The first proband's allele did not alter splicing in vitro.
- name: Increased BEST1 Anion Conductance in RPE
  biological_scale: MOLECULAR
  description: >-
    Mutant channels reach the basolateral membrane and conduct more anion than
    wild type, suggesting a channel held in an open gating state. Continuous
    chloride flux during eye development is the proposed basis for the
    developmental anomalies. Shown for p.Val86Met in patient iPSC-RPE.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  molecular_functions:
  - preferred_term: calcium-activated chloride channel activity
    modifier: INCREASED
    term:
      id: GO:0005229
      label: intracellularly calcium-gated chloride channel activity
  evidence:
  - reference: PMID:32111077
    reference_title: Mutation-Dependent Pathomechanisms Determine the Phenotype in the Bestrophinopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both BD and ARB hiPSC-RPEs display a strong reduction of BEST1-mediated anion transport function compared to control, while ADVIRC mutations trigger an increased anion permeability suggesting a stabilized open state condition of channel gating."
    explanation: Increased conductance distinguishes ADVIRC from other bestrophinopathies.
  - reference: PMID:24560797
    reference_title: "Disease-causing mutations associated with four bestrophinopathies exhibit disparate effects on the localization, but not the oligomerization, of Bestrophin-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For ADVIRC, all 4 associated mutants localized to the basolateral plasma membrane"
    explanation: ADVIRC mutants traffic normally, consistent with altered function at the membrane rather than loss.
  - reference: PMID:27653836
    reference_title: Mislocalisation of BEST1 in iPSC-derived retinal pigment epithelial cells from a family with autosomal dominant vitreoretinochoroidopathy (ADVIRC).
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Disruption of this tightly regulated and polarised cell conductance by mislocalisation of BEST1, a proposed ion channel, at the apical and basal surface may lead to the clinical pathology observed in ADVIRC patients."
    explanation: In one family's iPSC-RPE the mutant protein mislocalised to the apical membrane, a different proposed mechanism.
  downstream:
  - target: Abnormal Ocular Growth and Anterior Segment Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - advirc_channel_gain_of_function
    evidence:
    - reference: PMID:32111077

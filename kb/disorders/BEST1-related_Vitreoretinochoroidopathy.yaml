    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ADVIRC outer segment layer was significantly thinner than BVMD eyes at all locations from the fovea, and the ADVIRC PR layer was significantly thinner than BVMD and control eyes at perifoveal locations."
    explanation: OCT shows photoreceptor layer thinning.

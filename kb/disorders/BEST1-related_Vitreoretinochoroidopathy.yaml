      reference_title: ADVIRC is caused by distinct mutations in BEST1 that alter pre-mRNA splicing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "As with previous ADVIRC mutations, the novel c.704T-->C mutation in exon 6 altered normal splicing in an ex vivo splicing assay."
      explanation: An exon 6 ADVIRC allele altered splicing ex vivo.
    - reference: PMID:38957071
      reference_title: Variable expressivity of the autosomal dominant vitreoretinochoroidopathy (ADVIRC) phenotype associated with a novel variant in BEST1
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional analysis confirmed its impact on pre-mRNA splicing, resulting in an in-frame deletion (p(Ser367_Asn579del))."

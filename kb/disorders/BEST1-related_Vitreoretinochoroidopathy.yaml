genetic:
- name: BEST1
  gene_term:
    preferred_term: BEST1
    term:
      id: hgnc:12703
      label: BEST1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Only a handful of ADVIRC alleles are known, which distinguishes it from the
    hundreds of Best vitelliform macular dystrophy alleles in the same gene. Most
    are missense changes; p.Val86Met (c.256G>A) recurs in several families. A
    canonical splice-site allele (c.1101-1G>T) producing an in-frame deletion and
    a p.Thr277Met allele with atypical posterior disease have also been reported.
  evidence:
  - reference: PMID:15452077
    reference_title: Mutations of VMD2 splicing regulators cause nanophthalmos and autosomal dominant vitreoretinochoroidopathy (ADVIRC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three pathogenic sequence alterations in VMD2 were identified in five families with nanophthalmos associated with ADVIRC."
    explanation: Gene discovery.
  - reference: PMID:36712704
    reference_title: Autosomal Dominant Vitreoretinochoroidopathy With a Novel BEST1 Mutation and a Review of Reported Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing identified a heterozygous c.830C>T, p.(T277M) mutation located on exon 7 of the BEST1 gene."
    explanation: A further heterozygous missense allele with atypical posterior involvement.

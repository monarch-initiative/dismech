      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that anion transport function in hiPSC-RPEs unequivocally discriminates between dominant BD and ADVIRC mutations as anion permeability is considerably higher in ADVIRC hiPSC-RPEs cells when compared to controls."
      explanation: The ADVIRC allele raises anion permeability in patient RPE.
  - target: Aberrant BEST1 Pre-mRNA Splicing
    causal_link_type: DIRECT
    hypothesis_groups:
    - advirc_aberrant_splicing
    evidence:

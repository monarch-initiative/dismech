inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous BEST1 variants segregating through multigenerational families,
    with marked intrafamilial variation in severity.
  evidence:
  - reference: PMID:20301346
    reference_title: Bestrophinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BVMD, AVMD, and ADVIRC are inherited in an autosomal dominant (AD) manner."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:21072067
    reference_title: "BEST1-related autosomal dominant vitreoretinochoroidopathy: a degenerative disease with a range of developmental ocular anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A heterozygous change, p.V86M (c.256G > A), was identified in the BEST1 gene in the three affected subjects tested, and was shown to segregate with the disease phenotype."
    explanation: A heterozygous variant segregates with disease in a family.
mechanistic_hypotheses:
- hypothesis_group_id: advirc_channel_gain_of_function
  hypothesis_label: ADVIRC alleles increase BEST1 anion permeability
  status: EMERGING
  description: >-
    Patient-derived iPSC-RPE carrying p.Val86Met conduct more anion than
    controls, the opposite of the loss of conductance seen with Best
    vitelliform macular dystrophy and recessive bestrophinopathy alleles, and the
    variants cluster near the channel neck and its flexible gating helices.
    Shown for one allele in patient cells; the link to the peripheral and
    developmental phenotype is inferred.
  evidence:
  - reference: PMID:32111077
    reference_title: Mutation-Dependent Pathomechanisms Determine the Phenotype in the Bestrophinopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both BD and ARB hiPSC-RPEs display a strong reduction of BEST1-mediated anion transport function compared to control, while ADVIRC mutations trigger an increased anion permeability suggesting a stabilized open state condition of channel gating."
    explanation: Patient-derived RPE show increased anion permeability with ADVIRC alleles.
- hypothesis_group_id: advirc_aberrant_splicing
  hypothesis_label: ADVIRC alleles cause BEST1 exon skipping
  status: ALTERNATIVE
  description: >-
    The original explanation: the missense changes sit in exonic splicing
    regulatory elements and cause skipping of the exon, producing an internally
    deleted bestrophin alongside the missense protein. Supported by minigene and
    ex vivo splicing assays, and by one canonical splice-site allele, but not
    reproduced in patient iPSC-RPE carrying exon 6 or p.Val86Met alleles, nor
    for the first proband's allele in vitro.
  evidence:
  - reference: PMID:15452077
    reference_title: Mutations of VMD2 splicing regulators cause nanophthalmos and autosomal dominant vitreoretinochoroidopathy (ADVIRC).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All sequences showed simultaneous missense substitutions and exon skipping."
    explanation: Minigene assays of the first ADVIRC alleles showed exon skipping.
  - reference: PMID:32111077
    reference_title: Mutation-Dependent Pathomechanisms Determine the Phenotype in the Bestrophinopathies.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "In the present study, we found no evidence for alternative splicing in the ADVIRC-associated hiPSC-RPE cell lines well in agreement with earlier findings from Carter et al."
    explanation: Patient-derived RPE show normal splicing.
pathophysiology:
- name: BEST1 Heterozygous ADVIRC Variant
  biological_scale: MOLECULAR
  description: >-
    A small number of heterozygous BEST1 variants, mostly missense changes
    clustered at Gly83, Val86 and the Val235-Val239 stretch, plus rare
    splice-site alleles. Unlike Best vitelliform macular dystrophy alleles, they
    do not reduce RPE anion transport.

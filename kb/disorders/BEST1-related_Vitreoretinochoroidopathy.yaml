    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Optic nerve dysplasia and iris dysgenesis are novel observations that extend the ocular phenotype of ADVIRC."
    explanation: Developmental anomalies beyond the anterior segment.

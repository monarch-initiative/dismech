    (nanophthalmos), microcornea, shallow anterior chamber with a narrow angle,
    iris dysgenesis and optic nerve dysplasia. The RPE is the only BEST1-expressing
    cell type implicated, so these are attributed to its role in eye growth.
  biological_processes:

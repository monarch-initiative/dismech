discussions:
- discussion_id: advirc_mechanism_unresolved
  prompt: >-
    Do ADVIRC alleles act by altering BEST1 splicing, by increasing channel
    conductance, or by mislocalising the protein, and does the answer differ
    between alleles?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant BEST1 Pre-mRNA Splicing
  - pathophysiology#Increased BEST1 Anion Conductance in RPE
  rationale: >-
    Minigene assays support exon skipping, yet patient iPSC-RPE splice normally
    for the exon 6 and p.Val86Met alleles tested. One study of patient iPSC-RPE
    found the mutant channel at the basolateral membrane with increased
    conductance; another found apical mislocalisation. Only one canonical
    splice-site allele clearly acts through splicing. Testing more ADVIRC alleles
    in patient-derived RPE for splicing, localisation and conductance together
    would settle whether there is one mechanism.
- discussion_id: advirc_no_allele_specific_model
  prompt: >-
    Is there an animal or patient-cell model carrying an ADVIRC allele that
    reproduces the peripheral degeneration or the developmental anomalies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Abnormal Ocular Growth and Anterior Segment Development
  - pathophysiology#Peripheral RPE Degeneration and Migration
  rationale: >-
    The naturally occurring canine BEST1 retinopathies and the published
    zebrafish and cell models carry Best vitelliform macular dystrophy or
    recessive bestrophinopathy alleles, whose loss of channel function is the
    opposite of the increased conductance reported for ADVIRC. Patient iPSC-RPE
    model the channel defect but not eye growth or peripheral-retina
    degeneration, so no model links the two.
notes: >-
  ADVIRC (MONDO:0008662, the only MONDO child of MONDO:0700240) is also listed
  as a short subtype row of BEST1_Bestrophinopathies, which points here. The
  MRCS presentation (microcornea, rod-cone dystrophy, cataract, posterior
  staphyloma) overlaps ADVIRC and may lie on the same spectrum, but is left as a
  separate subtype of that entry.

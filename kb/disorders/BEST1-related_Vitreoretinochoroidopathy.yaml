      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Hence, a continuous chloride transport across the cell membrane in the early development of the human eye may account for the distinct ocular phenotype and possibly the developmental anomalies in ADVIRC patients."
      explanation: The authors' proposal linking the channel defect to eye development.
  - target: Peripheral RPE Degeneration and Migration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - advirc_channel_gain_of_function

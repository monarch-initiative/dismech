- name: Cortico-Basal Ganglia Motor Network Dysfunction
  biological_scale: TISSUE
  description: >-
    Spasmodic dysphonia is a central network disorder of the
    cortico-basal ganglia-thalamo-cortical motor loop controlling laryngeal motor
    output. Functional and structural imaging implicate altered activity and
    connectivity across sensorimotor cortex, basal ganglia, thalamus, and
    cerebellum, with reduced striatal dopamine D2/D3 receptor binding, rare
    causative GNAL (G-alpha-olf) variants perturbing striatal D1/A2A G-protein
    signaling, and a widespread decrease in cortical (GABAergic) inhibition
    demonstrated by transcranial magnetic stimulation, permitting excessive,
    involuntary laryngeal muscle activation during speech.

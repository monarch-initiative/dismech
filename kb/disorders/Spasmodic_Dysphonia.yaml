inheritance:
- name: Autosomal dominant (rare monogenic GNAL cases)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Most cases (~88%) of spasmodic dysphonia are sporadic and multifactorial,
    while up to 12% of patients report a family history of dystonia. Rare
    monogenic isolated laryngeal dystonia caused by heterozygous GNAL variants
    follows autosomal dominant inheritance with reduced penetrance.
  evidence:
  - reference: PMID:27093447
    reference_title: "GNAL mutation in isolated laryngeal dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This same variant was also present in his unaffected mother, confirming the reduced penetrance of GNAL mutations as shown previously 5, 16."
    explanation: >-
      Demonstrates maternal transmission with incomplete penetrance of a
      heterozygous GNAL variant in isolated laryngeal dystonia.
  - reference: PMID:27093447
    reference_title: "GNAL mutation in isolated laryngeal dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Up to 12% of patients with laryngeal dystonia report a familial history of dystonia, pointing to involvement of genetic factors."
    explanation: >-
      Documents that approximately 88% of laryngeal dystonia cases are sporadic
      while up to 12% report a familial history of dystonia.
has_subtypes:
- name: Adductor
  display_name: Adductor Spasmodic Dysphonia
  description: >-
    Most common form (~80-95% of cases). Involuntary hyperadduction of the vocal
    folds during phonation produces a strained-strangled voice quality with abrupt
    voice breaks on vowels (voiced sounds). Caused by spasms of the adductor muscles,
    principally the thyroarytenoid (vocalis) and lateral cricoarytenoid muscles.
  evidence:
  - reference: PMID:32861505
    reference_title: "The prevalence and clinical features of spasmodic dysphonia: A review of epidemiological surveys conducted in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adductor SD predominated (90-95%) and females were four-fold more likely to be affected than males."
    explanation: Japanese epidemiological surveys confirm adductor SD is the predominant form.
- name: Abductor
  display_name: Abductor Spasmodic Dysphonia
  description: >-
    Less common form (~10-20%). Involuntary abduction (opening) of the vocal folds
    during phonation causes breathy breaks and prolonged voiceless segments,
    especially on voiceless consonants. Caused by spasms of the posterior
    cricoarytenoid muscle.
  evidence:
  - reference: PMID:29219190
    reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abductor LD is characterized by breathy breaks or aphonia during speech. This is due to intermittent abduction of the vocal folds during phonation resulting in reduction of loudness or aphonic whispered segments of speech."
    explanation: >-
      Large clinical series characterizes the abductor subtype by intermittent
      vocal fold abduction causing breathy voice breaks and aphonic speech
      segments.
- name: Mixed
  display_name: Mixed Spasmodic Dysphonia
  description: >-
    Combination of adductor and abductor features, with both strained and breathy
    voice breaks.
  evidence:
  - reference: PMID:29219190
    reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our review of these patients also revealed other variants including mixed adductor and abductor types during speech (n=6), singer’s dystonia (n=7), adductor respiratory dystonia (n=14) and patients with dystonic tremor (25%)."
    explanation: >-
      Documents mixed adductor and abductor laryngeal dystonia as a recognized
      clinical subtype in a 1,400-patient clinical series.

    causal_link_type: DIRECT
    description: >-
      Hyperactive firing onto the thyroarytenoid and lateral cricoarytenoid
      muscles causes vocal fold hyperadduction with strained-strangled voice
      breaks in adductor disease.
  - target: Breathy voice breaks
    causal_link_type: DIRECT
    description: >-
      Hyperactive firing onto the posterior cricoarytenoid muscle causes
      untimely vocal fold abduction with breathy, aphonic voice breaks in
      abductor disease.
  evidence:
  - reference: PMID:24027271
    reference_title: "Abnormal striatal dopaminergic neurotransmission during rest and task production in spasmodic dysphonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spasmodic dysphonia is a primary focal dystonia characterized by involuntary
      spasms in the laryngeal muscles during speech production.
    explanation: Defines the disorder by involuntary spasms of the laryngeal muscles, the motor endpoint.
  - reference: PMID:10086613
    reference_title: "Selective laryngeal adductor denervation-reinnervation: a new surgical treatment for adductor spasmodic dysphonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This therapy, which produces bilateral weakness of the thyroarytenoid muscle,
      undoubtedly produces physiologic effects that are beneficial to patients with
      ASD.
    explanation: Botulinum-toxin weakening of the thyroarytenoid implicates laryngeal motor-unit hyperactivity in the adductor muscle.
phenotypes:
- name: Laryngeal dystonia
  description: >-
    Task-specific focal dystonia of the intrinsic laryngeal muscles, the defining
    feature of the disorder.
  phenotype_term:
    preferred_term: Laryngeal dystonia
    term:
      id: HP:0012049
      label: Laryngeal dystonia
  evidence:
  - reference: PMID:20194686
    reference_title: "Abnormal activation of the primary somatosensory cortex in spasmodic dysphonia: an fMRI study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spasmodic dysphonia (SD) is a task-specific focal dystonia of unknown
      pathophysiology, characterized by involuntary spasms in the laryngeal muscles
      during speaking.
    explanation: Directly characterizes SD as a task-specific focal laryngeal dystonia.
- name: Dysphonia
  description: >-
    Disordered voice production. In adductor spasmodic dysphonia the voice is
    strained and strangled with abrupt voice breaks; in abductor spasmodic dysphonia
    the voice is breathy with voiceless breaks.
  phenotype_term:
    preferred_term: Dysphonia
    term:
      id: HP:0001618
      label: Dysphonia
  evidence:
  - reference: PMID:27093447
    reference_title: "GNAL mutation in isolated laryngeal dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LD is characterized by involuntary spasm-inducing voice breaks with strained
      and strangled voice quality in the adductor form (ADLD) and excessive
      breathiness in the abductor form (ABLD).
    explanation: Describes the dysphonic voice quality distinguishing adductor and abductor forms.
- name: Strained-strangled voice
  subtype: Adductor
  description: >-
    Effortful, strained-strangled voice quality with abrupt voiced voice breaks,
    characteristic of the adductor type.
  phenotype_term:
    preferred_term: Hoarse voice
    term:
      id: HP:0001609
      label: Hoarse voice
  evidence:
  - reference: PMID:29219190
    reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He described the adductor type as a choked, strain-strangled voice quality
      with abrupt initiation and termination of sound, producing voice breaks.
    explanation: Describes the strained-strangled voice quality of adductor SD.
- name: Breathy voice breaks
  subtype: Abductor
  description: >-
    Breathy, weak voice with prolonged voiceless segments due to involuntary vocal
    fold abduction during phonation.
  phenotype_term:
    preferred_term: Imperfect vocal cord adduction
    term:
      id: HP:0005934
      label: Imperfect vocal cord adduction
  evidence:
  - reference: PMID:29219190
    reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      he characterized the voice of patients with abductor LD as breathy with
      effortful vocalization and abrupt termination of voicing producing aphonic,
      whispered segments of speech.
    explanation: Describes the breathy, aphonic voice breaks of abductor SD.
- name: Vocal tremor
  description: >-
    A rhythmic oscillation of voice frequently coexists with spasmodic dysphonia,
    particularly the adductor type, and can complicate diagnosis and treatment.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Vocal tremor
    term:
      id: HP:0012477
      label: Vocal tremor
  evidence:
  - reference: PMID:29219190
    reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our review of these patients also revealed other variants including mixed adductor and abductor types during speech (n=6), singer’s dystonia (n=7), adductor respiratory dystonia (n=14) and patients with dystonic tremor (25%)."
    explanation: Roughly a quarter of patients in the 1400-patient series had a co-occurring dystonic (vocal) tremor.
  - reference: PMID:28850801
    reference_title: "Spasmodic Dysphonia: A Review. Part 1: Pathogenic Factors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Spasmodic dysphonia is a rare disorder primarily affecting females beginning in their 40s. Vocal tremor co-occurs in 30% to 60%."
    explanation: Review reports vocal tremor co-occurrence in 30-60% of spasmodic dysphonia patients.
diagnosis:
- name: Flexible Fiberoptic Laryngoscopy
  description: >-
    Transnasal flexible fiberoptic laryngoscopy during connected speech and
    non-speech vocal tasks visualizes task-specific vocal fold hyperadduction
    (adductor type) or untimely vocal fold abduction (abductor type) while
    excluding structural vocal fold lesions or paralysis.
  diagnosis_term:
    preferred_term: Laryngoscopy
    term:
      id: NCIT:C16781
      label: Laryngoscopy
  evidence:
  - reference: PMID:29219190
    reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the 1400 patients had flexible laryngoscopic examination with video recording so that the results could later be evaluated."
    explanation: >-
      Confirms flexible video-laryngoscopy as a standard diagnostic evaluation
      across 1,400 laryngeal dystonia patients.
  - reference: PMID:29494321
    reference_title: "Clinical Practice Guideline: Hoarseness (Dysphonia) (Update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinicians should perform laryngoscopy, or refer to a clinician who can perform laryngoscopy, when dysphonia fails to resolve or improve within 4 weeks or irrespective of duration if a serious underlying cause is suspected."
    explanation: >-
      AAO-HNS clinical practice guideline recommends diagnostic laryngoscopy to
      visualize the larynx in persistent dysphonia.
- name: Perceptual Voice and Task-Specific Speech Assessment
  description: >-
    Structured auditory-perceptual voice evaluation using vowel-loaded versus
    voiceless-consonant-loaded sentences combined with laryngological and
    neurological examination distinguishes adductor and abductor spasmodic
    dysphonia from muscle tension dysphonia and essential vocal tremor.
  diagnosis_term:
    preferred_term: Diagnosis Assessment
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment
  evidence:
  - reference: PMID:31153765
    reference_title: "The extrinsic risk and its association with neural alterations in spasmodic dysphonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SD diagnosis was confirmed using voice and speech perceptual analysis and laryngological/neurological examinations."
    explanation: >-
      Establishes combined voice/speech perceptual analysis and
      laryngological/neurological examination as the clinical diagnostic
      standard.
  - reference: PMID:28850801
    reference_title: "Spasmodic Dysphonia: A Review. Part 1: Pathogenic Factors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis of spasmodic dysphonia usually includes speech and laryngoscopic assessment."
    explanation: >-
      Confirms speech assessment paired with laryngoscopy as standard clinical
      diagnostic practice.
- name: Laryngeal Electromyography
  description: >-
    Fine-wire or needle electromyography of the intrinsic laryngeal muscles
    demonstrates involuntary spasms of motor control during phonation and guides
    accurate placement of botulinum toxin near laryngeal motor endplates.
  diagnosis_term:
    preferred_term: Electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:29219190
    reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our group, studying SD (Spasmodic Dysphonia) patients clinically and with electromyography (EMG), confirmed that SD was a focal laryngeal dystonia, paralleling the work of Marsden et al (10)."
    explanation: >-
      Demonstrates diagnostic use of laryngeal electromyography to confirm focal
      laryngeal dystonia.
  - reference: PMID:29219190
    reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The injections are given under EMG control for accurate placement near motor endplates."
    explanation: >-
      Documents electromyographic guidance for motor-endplate localization
      during laryngeal chemodenervation.
treatments:
- name: Botulinum Toxin Chemodenervation
  description: >-
    Targeted injection of botulinum toxin type A into the affected intrinsic
    laryngeal muscles (thyroarytenoid for adductor type; posterior cricoarytenoid for
    abductor type) is the first-line symptomatic treatment. It weakens the
    overactive muscles by cleaving SNAP-25 and blocking acetylcholine release at
    the neuromuscular junction, reducing spasms for several months per treatment
    cycle.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Botulinum Toxin Therapy
    term:
      id: NCIT:C157775
      label: Botulinum Toxin Therapy
    therapeutic_agent:
    - preferred_term: botulinum toxin type A
      term:
        id: CHEBI:3160
        label: Botulinum toxin type A
  target_mechanisms:
  - target: Laryngeal Motor Unit Hyperactivity
    treatment_effect: INHIBITS
    description: >-
      Cleaves presynaptic SNAP-25 to block vesicular acetylcholine exocytosis at
      the laryngeal neuromuscular junction, weakening hyperactive intrinsic
      laryngeal muscles.
    evidence:
    - reference: PMID:29219190
      reference_title: "Phenomenology, genetics, and CNS network abnormalities in laryngeal dystonia: A 30-year experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Each botulinum toxin serotype cleaves at least one peptide bond on a SNARE protein (soluble N-ethylmaleimide-sensitive factor attachment protein receptor) (41), which make up the vesicle docking and fusion apparatus required for neurotransmitter exocytosis. Botulinum toxin types A, C1, and E cleave SNAP-25 (synaptosomal membrane-associated protein 25 kD), whereas types B, D, F, and G cleave the vesicle associated membrane proteins (VAMPs; synaptobrevins) (39)."
      explanation: >-
        Establishes presynaptic SNAP-25 cleavage and blockade of
        neurotransmitter exocytosis as the mechanism inhibiting laryngeal
        motor-unit hyperactivity.
  evidence:
  - reference: PMID:2041443
    reference_title: "Double-blind controlled study of botulinum toxin in adductor spasmodic dysphonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Botulinum toxin A markedly reduced perturbation, decreased fundamental
      frequency range, and improved the spectrographic characteristics of the voice.
    explanation: Class I double-blind placebo-controlled RCT demonstrating efficacy of thyroarytenoid botulinum toxin in ADSD.
  - reference: PMID:17564757
    reference_title: "Evidence for the effectiveness of botulinum toxin for spasmodic dysphonia from high-quality research designs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      botulinum toxin can be considered an effective treatment for adductor
      spasmodic dysphonia
    explanation: Evidence-based review concludes botulinum toxin is effective for adductor SD.
  - reference: PMID:38095707
    reference_title: "Comparison of the efficacy and adverse effects of unilateral or bilateral botulinum toxin injections for adductor spasmodic dysphonia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bilateral botulinum toxin injections associated with a longer duration of
      vocal improvement
    explanation: Meta-analysis (854 patients) quantifies the duration trade-off between unilateral and bilateral injection.
  - reference: PMID:27803079
    reference_title: "Effect of Botulinum Toxin and Surgery among Spasmodic Dysphonia Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The duration of the beneficial effect ranged from 15 to 18 weeks."
    explanation: Systematic review quantifies the typical 15-18 week duration of benefit per botulinum toxin injection cycle.
  - reference: PMID:29494321
    reference_title: "Clinical Practice Guideline: Hoarseness (Dysphonia) (Update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinicians should offer, or refer to a clinician who can offer, botulinum toxin injections for the treatment of dysphonia caused by spasmodic dysphonia and other types of laryngeal dystonia."
    explanation: The AAO-HNS clinical practice guideline explicitly recommends botulinum toxin injection for dysphonia caused by spasmodic dysphonia and other laryngeal dystonias.
- name: Voice Therapy
  description: >-
    Behavioral voice therapy delivered by a speech-language pathologist is used
    adjunctively to optimize phonatory technique, reduce compensatory muscle tension
    dysphonia, and provide modest symptomatic benefit in a subset of patients.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: voice therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Laryngeal Motor Unit Hyperactivity
    treatment_effect: MODULATES
    description: >-
      Behavioral phonatory retraining reduces compensatory supraglottic and
      laryngeal hyperfunction during speech production.
  evidence:
  - reference: PMID:31153765
    reference_title: "The extrinsic risk and its association with neural alterations in spasmodic dysphonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Speech therapy was tried by 61% of patients, with 32% reporting mild benefits."
    explanation: >-
      Quantifies real-world utilization of speech/voice therapy and mild
      symptomatic benefit in nearly one-third of treated spasmodic dysphonia
      patients.
  - reference: PMID:29494321
    reference_title: "Clinical Practice Guideline: Hoarseness (Dysphonia) (Update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinicians should advocate voice therapy for patients with dysphonia from a cause amenable to voice therapy."
    explanation: >-
      AAO-HNS clinical practice guideline supports behavioral voice therapy for
      amenable components of dysphonia following diagnostic laryngoscopy.
- name: Selective Laryngeal Denervation-Reinnervation Surgery
  description: >-
    Surgical approaches such as selective laryngeal adductor denervation-reinnervation
    (SLAD-R) and type 2 thyroplasty aim to provide durable reduction of adductor
    spasms for selected patients who do not tolerate or respond to botulinum toxin.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Laryngeal Motor Unit Hyperactivity
    treatment_effect: INHIBITS
    description: >-
      Selective bilateral sectioning of the adductor branch of the recurrent
      laryngeal nerve interrupts hyperactive dystonic motor drive to the
      thyroarytenoid muscle while ansa cervicalis reinnervation preserves muscle
      tone.
    evidence:
    - reference: PMID:10086613
      reference_title: "Selective laryngeal adductor denervation-reinnervation: a new surgical treatment for adductor spasmodic dysphonia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the adductor branch of the recurrent laryngeal nerve is selectively denervated
        bilaterally, and its distal nerve stumps are reinnervated with branches of the
        ansa cervicalis nerve
      explanation: >-
        Demonstrates surgical interruption of hyperactive adductor motor
        innervation paired with non-dystonic reinnervation.
  evidence:
  - reference: PMID:10086613
    reference_title: "Selective laryngeal adductor denervation-reinnervation: a new surgical treatment for adductor spasmodic dysphonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the adductor branch of the recurrent laryngeal nerve is selectively denervated
      bilaterally, and its distal nerve stumps are reinnervated with branches of the
      ansa cervicalis nerve
    explanation: Describes the SLAD-R surgical mechanism for durable adductor SD control.
  - reference: PMID:22606926
    reference_title: "Surgery or botulinum toxin for adductor spasmodic dysphonia: a comparative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the surgical patients had significantly improved voice handicap outcome scores
      (mean, 14.4 +/- 13.6) as compared to the patients who had Botox injection
      (mean, 26.5 +/- 12.1; p = 0.001)
    explanation: Comparative study (mean 7.5-year follow-up) shows SLAD-R yields better long-term voice-handicap scores than botulinum toxin.
- name: Deep Brain Stimulation
  description: >-
    Deep brain stimulation of the ventral intermediate (sensorimotor) thalamus is an
    emerging neurosurgical option for adductor SD; a randomized controlled trial
    demonstrated safety and efficacy, with benefit predicted by stimulation of
    thalamic sensorimotor areas.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_mechanisms:
  - target: Impaired Sensorimotor Integration
    treatment_effect: MODULATES
    description: >-
      Stimulation of thalamic sensorimotor territories modulates dysregulated
      thalamic sensorimotor integration and cerebellothalamic connectivity.
    evidence:
    - reference: PMID:38251897
      reference_title: "Deep Brain Stimulation Improves Symptoms of Spasmodic Dysphonia Through Targeting of Thalamic Sensorimotor Connectivity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stimulation of thalamic sensorimotor areas was associated with improvement in symptoms of spasmodic dysphonia. These data are consistent with DBS acting on pathophysiologically dysregulated thalamic sensorimotor integration in spasmodic dysphonia."
      explanation: >-
        Directly demonstrates that thalamic DBS improves symptoms by modulating
        dysregulated thalamic sensorimotor integration.
  - target: Cortico-Basal Ganglia Motor Network Dysfunction
    treatment_effect: MODULATES
    description: >-
      Modulates thalamic relay and cerebellothalamic/pallidothalamic network
      pathways within the motor control loop.
  evidence:
  - reference: PMID:38251897
    reference_title: "Deep Brain Stimulation Improves Symptoms of Spasmodic Dysphonia Through Targeting of Thalamic Sensorimotor Connectivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent randomized controlled trial of thalamic deep brain stimulation (DBS)
      demonstrated its safety and efficacy.
    explanation: Confirms thalamic DBS as a safe and effective emerging therapy for adductor SD.
- name: Sodium Oxybate
  description: >-
    Sodium oxybate (the sodium salt of gamma-hydroxybutyrate) is an investigational
    oral agent that mimics the symptomatic benefit of alcohol in the
    alcohol-responsive subgroup of laryngeal dystonia, acting directly on the
    abnormal dystonic brain network rather than on the larynx.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium oxybate
      term:
        id: CHEBI:749298
        label: sodium oxybate
  target_mechanisms:
  - target: Cortico-Basal Ganglia Motor Network Dysfunction
    treatment_effect: MODULATES
    description: >-
      Attenuates hyperfunctional activity across cerebellar, thalamic, and
      primary/secondary sensorimotor cortical regions where GABAergic
      neurotransmission is abnormal.
    evidence:
    - reference: PMID:30382161
      reference_title: "A novel therapeutic agent, sodium oxybate, improves dystonic symptoms via reduced network-wide activity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found that sodium oxybate significantly attenuated hyperfunctional activity of cerebellar, thalamic and primary/secondary sensorimotor cortical regions."
      explanation: >-
        Pharmacological fMRI demonstrates direct attenuation of network-wide
        hyperfunctional brain activity by sodium oxybate in laryngeal dystonia.
  evidence:
  - reference: PMID:30382161
    reference_title: "A novel therapeutic agent, sodium oxybate, improves dystonic symptoms via reduced network-wide activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that sodium oxybate shows direct modulatory effects on
      disorder pathophysiology by acting upon abnormal neural activity within the
      dystonic network.
    explanation: fMRI in LD patients shows sodium oxybate normalizes hyperfunctional network activity, a pathophysiology-targeted oral therapy.

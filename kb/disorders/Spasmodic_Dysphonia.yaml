- name: Impaired Sensorimotor Integration
  biological_scale: TISSUE
  description: >-
    Abnormal central processing of laryngeal sensory feedback contributes to the
    task-specific, action-induced nature of the dystonia. The primary somatosensory
    cortex and thalamic sensorimotor territories show consistent functional
    abnormalities, and deficient sensorimotor integration destabilizes
    feedforward/feedback control of phonation so that spasms appear selectively
    during the learned motor act of speech.
  locations:

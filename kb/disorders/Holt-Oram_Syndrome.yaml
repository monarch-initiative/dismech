genetic:
- name: TBX5
  gene_term:
    preferred_term: TBX5
    term:
      id: hgnc:11604
      label: TBX5
  presence: Positive
  association: Causative
  notes: 'Loss-of-function mutations in TBX5 cause Holt-Oram syndrome with autosomal dominant inheritance. Heterozygous loss-of-function variants account for approximately 90% of familial cases. The T-box transcription factor TBX5 is essential for cardiac and upper limb development. Gene dosage sensitivity is critical, as even partial loss of TBX5 function due to haploinsufficiency disrupts regulatory networks.

    '
  evidence:
  - reference: PMID:36936432
    reference_title: 'Case report: Novel TBX5-related pathogenic mechanism of Holt-Oram syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Holt-Oram syndrome (HOS) is a rare genetic disorder characterized by upper limb abnormalities, congenital heart defects, and/or conduction abnormalities. Sequence alteration of T-box transcription factor 5 (TBX5) is correlated with the incidence of HOS.
    explanation: Directly establishes the causal relationship between TBX5 sequence variants and HOS development.
  - reference: PMID:38189150
    reference_title: 'A Genomic Link From Heart Failure to Atrial Fibrillation Risk: FOG2 Modulates a TBX5/GATA4-Dependent Atrial Gene Regulatory Network.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: FOG2 repressed TBX5-dependent transcription from a subset of co-bound enhancers, including a conserved enhancer at the Atp2a2 locus. Atrial rhythm abnormalities in mice caused by Tbx5 haploinsufficiency were rescued by Zfpm2 haploinsufficiency.
    explanation: Mouse Tbx5 haploinsufficiency model demonstrates that reduced TBX5 dosage is sufficient to produce atrial rhythm abnormalities, paralleling HOS cardiac phenotypes.
  - reference: PMID:8988165
    reference_title: Mutations in human TBX5 [corrected] cause limb and cardiac malformation in Holt-Oram syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TBX5 was cloned from the disease locus on human chromosome 12q24.1 and identified as a member of the T-box transcription factor family.
    explanation: Original positional cloning of TBX5 from the 12q24.1 HOS locus, identifying it as the causative T-box transcription factor.
  - reference: PMID:30552424
    reference_title: 'Holt-Oram syndrome: clinical and molecular description of 78 patients with TBX5 variants.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A CHD was present in 91% of the patients with a TBX5 variant, atrial septal defects being the most common (61.5%).
    explanation: Largest molecular series of TBX5-confirmed HOS (78 patients) showing 91% rate of congenital heart disease with ASD as the most common (61.5%), supporting TBX5 as the causative gene and ASD as the most frequent cardiac phenotype.
  - reference: PMID:20301290
    reference_title: Holt-Oram Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: More than 70% of individuals who meet strict clinical diagnostic criteria have an identifiable heterozygous pathogenic variant in TBX5.
    explanation: GeneReviews synthesis confirming that heterozygous pathogenic variants in TBX5 account for over 70% of individuals meeting strict clinical criteria for Holt-Oram syndrome.
  - reference: CGGV:assertion_24e6c85a-33cf-4248-be1f-6431c7c6b1e5-2025-03-25T160000.000Z
    reference_title: TBX5 / Holt-Oram syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: TBX5 | HGNC:11604 | Holt-Oram syndrome | MONDO:0007732 | AD | Definitive
    explanation: ClinGen classifies the TBX5-Holt-Oram syndrome gene-disease relationship as definitive with autosomal dominant inheritance.

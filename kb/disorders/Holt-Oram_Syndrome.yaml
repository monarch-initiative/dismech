- name: Upper Limb Morphogenesis Disruption
  description: 'TBX5 is required cell-autonomously in the lateral plate mesoderm of the prospective forelimb field for forelimb bud initiation and for preaxial (radial) ray patterning. Heterozygous loss-of-function variants reduce TBX5 dosage below the threshold required for normal radial ray morphogenesis, producing the dosage-sensitive HOS limb spectrum that ranges from triphalangeal thumb and thumb hypoplasia to absent thumb, radial hypoplasia and phocomelia. Limb defects in HOS are bilateral but characteristically asymmetric and can occur independently of the severity of the cardiac phenotype.

    '

notes: 'Holt-Oram syndrome is a rare autosomal dominant genetic disorder with an estimated birth prevalence of approximately 0.7 to 1 per 100,000 births (1 in 135,615 in EUROCAT), characterized by preaxial radial-ray upper-limb defects, congenital heart malformations (present in ~90% of individuals, most commonly atrial and ventricular septal defects), and progressive cardiac conduction disease (~30% risk) caused by heterozygous pathogenic variants in TBX5 on chromosome 12q24.1. The disorder exhibits complete penetrance with marked intrafamilial variability; up to 60% of affected individuals represent simplex (de novo) cases, and offspring of an affected individual have a 50% risk of inheriting HOS. Because atrioventricular block can progress unpredictably to complete heart block with or without atrial fibrillation even in the absence of structural heart defects, annual ECG surveillance (with Holter monitoring for known conduction disease) and permanent pacemaker implantation when indicated are central to clinical management.

  '

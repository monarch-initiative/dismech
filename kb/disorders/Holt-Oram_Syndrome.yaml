  description: Genetically heterogeneous DNA interstrand crosslink repair disorder that commonly presents with radial-ray and thumb anomalies and congenital heart defects; distinguished from Holt-Oram syndrome by progressive bone marrow failure, cafe-au-lait macules, short stature, and increased chromosomal breakage on diepoxybutane or mitomycin C testing.

- name: Cofactor and Chromatin Remodeling Dysfunction
  description: 'TBX5 function depends critically on physical interactions with cardiac transcription factor GATA4 and the chromatin modulating protein ZFPM2/FOG2, which together co-occupy atrial-specific enhancers controlling genes required for atrial conduction and calcium handling. Additionally, TBX5 directly interacts with chromatin remodeling complexes including CHD4 (NuRD) and SMARCA4/BRG1 (BAF/SWI-SNF) to maintain accessible chromatin at cardiac enhancers. Reduced TBX5 dosage impairs the formation and maintenance of these enhancer-promoter loops and topologically associating domains (TADs), leading to widespread transcriptional dysregulation of conduction and chamber specification genes.

    '
  evidence:
  - reference: PMID:38189150
    reference_title: 'A Genomic Link From Heart Failure to Atrial Fibrillation Risk: FOG2 Modulates a TBX5/GATA4-Dependent Atrial Gene Regulatory Network.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: FOG2 bound a subset of GATA4 and TBX5 co-bound genomic locations, defining a shared atrial gene regulatory network. FOG2 repressed TBX5-dependent transcription from a subset of co-bound enhancers, including a conserved enhancer at the Atp2a2 locus.
    explanation: ChIP-seq in mouse cardiomyocytes (adult cardiomyocyte-specific FOG2 overexpression model) demonstrates the functional interaction between TBX5, GATA4, and FOG2 at atrial enhancers.
  - reference: PMID:38189150
    reference_title: 'A Genomic Link From Heart Failure to Atrial Fibrillation Risk: FOG2 Modulates a TBX5/GATA4-Dependent Atrial Gene Regulatory Network.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: FOG2 repressed TBX5-dependent transcription from a subset of co-bound enhancers, including a conserved enhancer at the Atp2a2 locus. Atrial rhythm abnormalities in mice caused by Tbx5 haploinsufficiency were rescued by Zfpm2 haploinsufficiency.
    explanation: Genetic evidence in mice that FOG2/ZFPM2 modulates TBX5-dependent conduction defects, supporting a direct functional interaction.
  - reference: PMID:39677667
    reference_title: CHD4 Interacts With TBX5 to Maintain the Gene Regulatory Network of Postnatal Atrial Cardiomyocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that TBX5 recruits CHD4, a chromatin remodeling ATPase, to 33,170 genomic regions (TBX5-enhanced CHD4 sites). As a component of the NuRD complex, CHD4 functions to repress gene transcription. However, combined snRNA-seq and snATAC-seq of CHD4 knockout (KO) and control aCMs revealed that CHD4 has both gene activator and repressor functions.
    explanation: Atrial cardiomyocyte-specific Chd4 conditional knockout mouse model with snRNA-seq/snATAC-seq showing that CHD4 is directly recruited by TBX5 and is critical for maintaining atrial cardiomyocyte identity and rhythm homeostasis.

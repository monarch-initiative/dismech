    causal_link_type: DIRECT
    description: 'TBX5 haploinsufficiency reduces TBX5 occupancy at cardiac enhancers, weakening recruitment of the GATA4/NKX2-5/ZFPM2 cofactor module and the BAF and CHD4/NuRD chromatin remodelers that depend on TBX5 for targeting.


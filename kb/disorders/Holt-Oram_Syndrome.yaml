  description: 'Holt-Oram syndrome is inherited in an autosomal dominant manner with complete penetrance and significant intrafamilial variability in limb and cardiac defect severity. Up to 60% of affected individuals represent simplex (de novo) cases, and offspring of an affected individual have a 50% risk of inheriting the disorder.


    evidence:
    - reference: PMID:39677667
      reference_title: CHD4 Interacts With TBX5 to Maintain the Gene Regulatory Network of Postnatal Atrial Cardiomyocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The transcription factor TBX5 is essential for normal atrial rhythm, and its inactivation causes loss of aCM enhancer accessibility, looping, and transcriptional identity. Here we investigated the mechanisms by which TBX5 regulates chromatin organization. We found that TBX5 recruits CHD4, a chromatin remodeling ATPase, to 33,170 genomic regions (TBX5-enhanced CHD4 sites).
      explanation: Demonstrates that TBX5 directly recruits the chromatin remodeler CHD4 to atrial enhancers and that TBX5 loss disrupts enhancer accessibility and looping.

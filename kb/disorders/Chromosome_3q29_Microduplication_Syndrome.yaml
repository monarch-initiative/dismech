inheritance:
- name: Autosomal dominant with reduced penetrance
  description: >-
    The duplication behaves as a dominant but incompletely penetrant lesion. Both de novo and
    inherited cases occur, and inheritance from a similarly mildly affected parent is the
    common pattern rather than the exception.

pathophysiology:
- name: NAHR Between 3q29 Low-Copy Repeats
  biological_scale: MOLECULAR
  description: >-
    The 3q29 interval is flanked by almost identical low-copy repeats, and non-allelic
    homologous recombination between them generates a reciprocal deletion/duplication pair.
    Optical genome mapping across 18 probands localised the crossovers tightly: in 89% of them
    the breakpoints lay within paralogous copies of one 20 kb segment inside the segmental
    duplications. Unlike the 8p and 15q recurrent rearrangements, no parent-of-origin inversion
    polymorphism has been found at this locus.
  downstream:
  - target: Increased Dosage of the 3q29 Interval
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39739615
    reference_title: "Delineation of the Genetic Architecture and Clinical Polymorphism of 3q29 Duplication Syndrome: A Review of the Literature and a Report of Two Novel Patients With Single-Gene BDH1 Duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which indicates that nonallelic homologous recombination is the most likely mechanism for rearrangement formation"
    explanation: >-
      Names the mechanism directly. An earlier version of this item quoted the first half of the
      same sentence and stopped at "almost identical low", because the cached text carries a
      U+2010 HYPHEN inside "low-copy repeats" - so the truncated quote did not mention NAHR at
      all. This clause sits immediately after that character and verifies unchanged.
  - reference: PMID:37165454
    reference_title: "High level of complexity and global diversity of the 3q29 locus revealed by optical mapping and long-read sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 89% (16/18) of the probands, breakpoints were confined to paralogous copies of a 20-kbp segment within the 3q29 SDs."
    explanation: >-
      Localises the recombination to a specific paralogous segment rather than to the
      segmental duplications generally.
  - reference: PMID:37165454
    reference_title: "High level of complexity and global diversity of the 3q29 locus revealed by optical mapping and long-read sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, we found no evidence of inversions in parent-of-origin chromosomes."
    explanation: >-
      A negative result worth curating: the inversion-polymorphism model that explains other
      recurrent NAHR rearrangements was looked for here and not found.
- name: Increased Dosage of the 3q29 Interval
  biological_scale: MOLECULAR
  description: >-
    The recurrent lesion carries 21 protein-coding genes at three copies rather than two. The
    functional consequence is presumed increased expression of dosage-sensitive genes rather
    than loss of any function, which is why the duplication phenotype is not simply a milder
    version of the deletion phenotype and why some features mirror rather than parallel it.
  downstream:
  - target: Gain of Dosage of Synaptic and Metabolic Candidate Genes
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37165454
    reference_title: "High level of complexity and global diversity of the 3q29 locus revealed by optical mapping and long-read sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are 21 protein-coding genes lost or gained as a result of such recurrent 1.6-Mbp deletions or duplications, respectively, in the 3q29 locus."
    explanation: The gene content of the interval, stated for both directions of the rearrangement.
  - reference: PMID:39739615
    reference_title: "Delineation of the Genetic Architecture and Clinical Polymorphism of 3q29 Duplication Syndrome: A Review of the Literature and a Report of Two Novel Patients With Single-Gene BDH1 Duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mirrored phenotypes in patients with duplications and deletions included overweight and weight deficit."
    explanation: >-
      Evidence that the two directions are not simply graded versions of one another: at least
      one trait runs opposite ways, which is what a dosage model predicts and a severity model
      does not.
- name: Gain of Dosage of Synaptic and Metabolic Candidate Genes
  biological_scale: CELLULAR
  description: >-
    Which gene or genes in the interval drive the phenotype is unresolved. The candidates
    repeatedly nominated are synaptic - DLG1, PAK2, FBXO45 - plus the mitochondrial ketone-body
    enzyme BDH1, and successive minimal-region analyses have converged on DLG1 with BDH1 and
    then on BDH1 alone. The largest cohort disputes that any critical region exists. This node
    therefore asserts the class of mechanism, not the gene.
  genes:
  - preferred_term: DLG1
    term:
      id: hgnc:2900
      label: DLG1
  - preferred_term: BDH1
    term:
      id: hgnc:1027
      label: BDH1
  biological_processes:
  - preferred_term: synapse organization
    modifier: ABNORMAL
    term:
      id: GO:0050808
      label: synapse organization
  downstream:
  - target: Altered Neurodevelopment with Incomplete Penetrance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormality of the Eye
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal Heart Morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal Facial Shape
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29501613
    reference_title: "3q29 microduplication syndrome: Description of two new cases and delineation of the minimal critical region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene content analysis of the duplicated region suggests that gain-of-dosage of DLG1 and BDH1 may be a good candidate for the main clinical features of this syndrome."
    explanation: >-
      The two-gene nomination, phrased by its own authors as a suggestion rather than a
      finding.
  - reference: PMID:39739615
    reference_title: "Delineation of the Genetic Architecture and Clinical Polymorphism of 3q29 Duplication Syndrome: A Review of the Literature and a Report of Two Novel Patients With Single-Gene BDH1 Duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time, we delineated and described the smallest minimal critical region, including the single BDH1 gene; in our patients, this region was associated with ASD, heart defects, biliary tract dysfunction, and obesity."
    explanation: The single-gene refinement, and the phenotypes seen in those carriers.
  - reference: PMID:38421086
    reference_title: "3q29 duplications: A cohort of 46 patients and a literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Besides, the study of small 3q29 duplications does not provide evidence for any critical region."
    explanation: >-
      Recorded as REFUTE against the claim that a critical region has been established. It is
      the counter-position in discussions#dup3q29_critical_region and is curated alongside the
      claim rather than after it.
  notes: >-
    The genes listed here are the candidates the literature nominates, not established drivers.
    No functional experiment in any cited source tests dosage of DLG1 or BDH1 against the
    phenotype; the nominations rest on interval overlap.
- name: Altered Neurodevelopment with Incomplete Penetrance
  biological_scale: ORGANISM
  description: >-
    The clinical layer. Isolated 3q29 duplications produce mainly mild neurodevelopmental
    impairment - a high rate of learning disability against a low proportion with frank
    intellectual disability - and the same duplication is carried by mildly affected or
    unaffected relatives. Additional genetic findings were identified in a substantial minority
    of patients, which is why the cohort authors advise looking further when the presentation
    is severe.
  downstream:
  - target: Delayed Speech and Language Development
    causal_link_type: DIRECT
  - target: Specific Learning Disability
    causal_link_type: DIRECT
  - target: Global Developmental Delay
    causal_link_type: DIRECT
  - target: Intellectual Disability
    causal_link_type: DIRECT
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Macrocephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Obesity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38421086
    reference_title: "3q29 duplications: A cohort of 46 patients and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focusing on apparently isolated 3q29 duplications, patients present mainly mild NDD as suggested by a high rate of learning disabilities in contrast to a low proportion of patients with intellectual disabilities."
    explanation: >-
      The severity calibration, and specifically the pattern of learning disability
      predominating over intellectual disability, which distinguishes this from the deletion.
  - reference: PMID:38421086
    reference_title: "3q29 duplications: A cohort of 46 patients and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional genetic findings that may be involved in the phenotype were identified in 11 patients."
    explanation: >-
      Quantifies how often something other than the duplication may be doing the work, which is
      what makes attribution to the duplication provisional in an individual patient.

genetic:
- name: 3q29 recurrent duplication
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    A recurrent interstitial copy-number gain of ~1.6 Mb at 3q29 containing 21 protein-coding
    genes, generated by NAHR between the flanking low-copy repeats. Smaller overlapping
    duplications down to about 232 kb have been reported, and they are what the debate over a
    minimal critical region turns on.
  evidence:
  - reference: PMID:37165454
    reference_title: "High level of complexity and global diversity of the 3q29 locus revealed by optical mapping and long-read sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are 21 protein-coding genes lost or gained as a result of such recurrent 1.6-Mbp deletions or duplications, respectively, in the 3q29 locus."
    explanation: Size and gene content of the recurrent lesion.
  - reference: PMID:38421086
    reference_title: "3q29 duplications: A cohort of 46 patients and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report a French cohort of 31 families with a 3q29 duplication identified by chromosomal microarray analysis (CMA), including 14 recurrent 1.6 Mb duplications, eight overlapping duplications (>1 Mb), and nine small duplications (<1 Mb)."
    explanation: >-
      The size distribution in the largest cohort, which is what makes "the recurrent 1.6 Mb
      duplication" only part of what is seen in practice.
diagnosis:
- name: Chromosomal microarray analysis
  description: >-
    The duplication is submicroscopic, so karyotype is normal and detection is by microarray.
  evidence:
  - reference: PMID:38421086
    reference_title: "3q29 duplications: A cohort of 46 patients and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report a French cohort of 31 families with a 3q29 duplication identified by chromosomal microarray analysis (CMA), including 14 recurrent 1.6 Mb duplications, eight overlapping duplications (>1 Mb), and nine small duplications (<1 Mb)."
    explanation: CMA as the ascertainment method for the whole cohort.
- name: Further genetic analysis when the presentation is severe
  description: >-
    A severe or syndromic presentation in a 3q29 duplication carrier should not be attributed
    to the duplication without looking further, because additional contributory findings are
    common and the duplication alone predicts mild disease.
  evidence:
  - reference: PMID:38421086
    reference_title: "3q29 duplications: A cohort of 46 patients and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that the overlapping and recurrent 3q29 duplications seem to lead to mild NDD and that a severe or syndromic clinical presentation should warrant further genetic analyses."
    explanation: >-
      The authors' explicit diagnostic recommendation, which is the actionable output of the
      reduced-penetrance finding.
treatments:
- name: Genetic Counselling
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    The intervention this entry's whole argument bears on. Three facts have to be conveyed
    together and each one on its own misleads: penetrance is reduced and most duplications are
    inherited from a mildly affected or unaffected parent; additional contributory genetic
    findings are common enough that a severe presentation should prompt further testing rather
    than attribution to the duplication; and the schizophrenia association that dominates the
    3q29 literature belongs to the reciprocal deletion, not to this.
  evidence:
  - reference: PMID:38421086
    reference_title: "3q29 duplications: A cohort of 46 patients and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although some are de novo, most of the 3q29 duplications are inherited from a parent with a similar mild phenotype."
    explanation: >-
      The inheritance pattern a counselling conversation has to start from, and the reason
      parental testing changes the recurrence discussion.
  - reference: PMID:39739615
    reference_title: "Delineation of the Genetic Architecture and Clinical Polymorphism of 3q29 Duplication Syndrome: A Review of the Literature and a Report of Two Novel Patients With Single-Gene BDH1 Duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Schizophrenia, generalized anxiety disorder, and recurrent ear infections were unique phenotypes of patients carrying deletions."
    explanation: >-
      The deletion-only phenotypes, cited here because importing them into a duplication
      counselling conversation is the specific error this record exists to prevent.
  notes: >-
    No study measures counselling outcomes in 3q29 duplication. The evidence items attached here
    substantiate the facts to be conveyed, not the effectiveness of conveying them.
discussions:
- discussion_id: dup3q29_critical_region
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does 3q29 duplication syndrome have a minimal critical region - BDH1, or DLG1 with BDH1 -
    or is no critical region supported by the data?
  attaches_to:
  - pathophysiology#Gain of Dosage of Synaptic and Metabolic Candidate Genes
  rationale: >-
    Two lines of evidence point opposite ways and neither is obviously weaker. Successive small
    duplications have been used to shrink the region: 448 kb containing DLG1 and BDH1, then a
    second independent family with a 433 kb duplication of the same two genes, then five
    patients with 232-486 kb duplications used to argue for BDH1 alone. Against that, the
    largest published cohort - 31 families, nine of them with duplications under 1 Mb - looked
    at exactly this question in its own data and concluded there is no evidence for any
    critical region.

    The disagreement is not about a boundary, it is about the kind of disorder this is. A
    single-gene critical region would make it a BDH1 dosage disorder with a tractable
    mechanism. No critical region would make it a contiguous-gene effect in which the
    phenotype needs the interval rather than any member of it. The entry curates the candidate
    genes as candidates and the node's causal link to the clinical layer as
    INDIRECT_UNKNOWN_INTERMEDIATES for this reason.

    What would settle it is not another small duplication. Given the reduced penetrance and the
    frequency of second findings, small-duplication series are the wrong instrument - unaffected
    carriers of the small region are what the region-shrinking argument has to explain, and one
    of the two-gene families reports exactly that, an unaffected sibling and an unaffected
    transmitting mother with the same 432.8 kb duplication.
  evidence:
  - reference: PMID:39739615
    reference_title: "Delineation of the Genetic Architecture and Clinical Polymorphism of 3q29 Duplication Syndrome: A Review of the Literature and a Report of Two Novel Patients With Single-Gene BDH1 Duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time, we delineated and described the smallest minimal critical region, including the single BDH1 gene; in our patients, this region was associated with ASD, heart defects, biliary tract dysfunction, and obesity."
    explanation: The single-gene position.
  - reference: PMID:38421086
    reference_title: "3q29 duplications: A cohort of 46 patients and a literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Besides, the study of small 3q29 duplications does not provide evidence for any critical region."
    explanation: The no-critical-region position, from the larger cohort.
  - reference: PMID:36691815
    reference_title: "3q29 microduplication syndrome: New evidence for the refinement of the critical region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on a family with two males with neurodevelopmental disorders and an unaffected sibling with a small 3q29 microduplication (432.8 Kb) inherited from an unaffected mother that involves only two genes: DGL1 and BDH1."
    explanation: >-
      Cited for the fact that complicates both positions: in the very family used to refine the
      region, the same small duplication is carried by an unaffected sibling and an unaffected
      mother. The source prints "DGL1" for DLG1; the snippet reproduces it exactly.
- discussion_id: dup3q29_not_the_deletion
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Which 3q29 findings transfer between the deletion and the duplication, and which do not?
  attaches_to:
  - disease#Chromosome 3q29 Microduplication Syndrome
  - pathophysiology#Increased Dosage of the 3q29 Interval
  rationale: >-
    The 3q29 literature is dominated by the deletion, and the most cited finding in it - the
    schizophrenia association - is a deletion finding. It is worth recording explicitly that it
    does not transfer, because the reciprocal relationship makes it easy to assume it does.

    The direct comparison gives three distinct patterns rather than one. Most phenotypes occur
    on both sides but significantly less often in duplication carriers. Overweight and weight
    deficit are mirrored, running opposite ways. And schizophrenia, generalised anxiety
    disorder and recurrent ear infections are reported as unique to deletion carriers. A
    counselling conversation that treats the duplication as a milder deletion gets the first
    pattern right and the other two wrong.
  evidence:
  - reference: PMID:39739615
    reference_title: "Delineation of the Genetic Architecture and Clinical Polymorphism of 3q29 Duplication Syndrome: A Review of the Literature and a Report of Two Novel Patients With Single-Gene BDH1 Duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the phenotypes were observed in both groups but were significantly less common among individuals with 3q29 duplications."
    explanation: The shared-but-attenuated pattern.
  - reference: PMID:39739615
    reference_title: "Delineation of the Genetic Architecture and Clinical Polymorphism of 3q29 Duplication Syndrome: A Review of the Literature and a Report of Two Novel Patients With Single-Gene BDH1 Duplications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Schizophrenia, generalized anxiety disorder, and recurrent ear infections were unique phenotypes of patients carrying deletions."
    explanation: >-
      The deletion-only phenotypes, and the direct source for not importing the schizophrenia
      association into this entry.
notes: >-
  Relationship to kb/disorders/Chromosome_3q29_Microdeletion_Syndrome. The two are reciprocal
  products of one NAHR event and are separate entries because they are separate diseases, not
  two severities of one. This entry does not restate the deletion's pathophysiology; where the
  comparison is informative it is curated as evidence, in
  discussions#dup3q29_not_the_deletion.

  A late-onset presentation has been reported - progressive cortical atrophy and recurrent
  mucosal infections first manifesting at 34 - in a single patient (PMID:32874693). It is not
  curated as a phenotype here because one case cannot establish whether it belongs to the
  syndrome, and the report itself speculates about the gene involved rather than demonstrating
  it. Recorded so the next curator knows it was seen and set aside deliberately.

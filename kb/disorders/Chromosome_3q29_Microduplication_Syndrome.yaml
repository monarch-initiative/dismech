name: Chromosome 3q29 Microduplication Syndrome
category: Chromosomal
creation_date: "2026-09-03T19:00:00Z"
synonyms:
- 3q29 microduplication syndrome
- 3q29 duplication syndrome
- dup3q29S
- trisomy 3q29
- dup(3)(q29)
description: >-
  Chromosome 3q29 microduplication syndrome is the copy-number *gain* of the recurrent ~1.6 Mb
  interval at 3q29, the reciprocal of the much better characterised 3q29 microdeletion. It
  presents as a variable and generally mild neurodevelopmental disorder: speech and language
  delay, learning disability, and a scatter of accessory features that includes microcephaly
  or macrocephaly, ocular and cardiac anomalies, obesity and dysmorphism.

  The mechanism of formation is settled and is the same one that produces the deletion. The
  interval is flanked by near-identical low-copy repeats, and non-allelic homologous
  recombination between them yields a reciprocal pair. Optical genome mapping across probands
  narrowed the crossovers further: in 89% of probands the breakpoints fell inside paralogous
  copies of a single 20 kb segment within the 3q29 segmental duplications.

  Everything downstream of that is less settled, and this entry is written to keep the two
  apart. Two claims in particular are curated as contested rather than as facts.

  The first is the minimal critical region. Successive reports have shrunk it from the full
  interval to DLG1 plus BDH1 (448 kb, then 433 kb in an independent family) and then to BDH1
  alone in patients with duplications of 232-486 kb. Against that, the largest cohort to date
  looked at its own small duplications and concluded they provide no evidence for any critical
  region at all. Both are curated, as a CONTROVERSY, because the disagreement is not a detail:
  a single-gene critical region would make this a BDH1 dosage disorder, and no critical region
  would make it a contiguous-gene effect.

  The second is what the duplication is *for* a carrier. Most 3q29 duplications are inherited
  from a parent with a similar mild phenotype, penetrance is reduced, and additional genetic
  findings that might themselves explain the presentation were identified in 11 of 46 patients
  in one series. The cohort's own conclusion is the practical one and is curated here: a
  severe or syndromic presentation in a 3q29 duplication carrier should prompt further genetic
  analysis rather than being attributed to the duplication.

  The contrast with the reciprocal deletion is the other thing worth curating explicitly,
  because the two are easy to conflate and the asymmetry matters for counselling. Most
  phenotypes occur on both sides but are significantly less common in duplication carriers.
  Overweight and weight deficit are mirrored between them. And schizophrenia, generalised
  anxiety disorder and recurrent ear infections are phenotypes of deletion carriers only - so
  the schizophrenia association that dominates the 3q29 literature does not transfer to this
  entry.

- name: Xpert MTB/RIF assay on vertebral tissue
  description: >-
    A rapid molecular test that also detects rifampicin resistance. In a
    meta-analysis its pooled sensitivity against culture was 92% and
    specificity 71%; in an 893-patient series its sensitivity against
    histopathology was 81.5%, and combining histopathology with Xpert gave
    86.6% accuracy. That series came from an orthopaedic department in
    which most patients had surgery, so its figures may not carry over to
    patients sampled by needle biopsy. In a prospective South African study

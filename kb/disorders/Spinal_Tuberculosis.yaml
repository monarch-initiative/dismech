histopathology:
- name: Caseating Granulomatous Osteomyelitis of the Vertebra
  description: >-
    Biopsy shows caseating necrosis, epithelioid cell granulomas and Langhans
    giant cells, reported in about 72 to 97% of cases.
  evidence:
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

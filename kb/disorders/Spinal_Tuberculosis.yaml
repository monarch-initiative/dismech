  - reference: PMID:42510106
    reference_title: "Differentiating Tuberculous and Pyogenic Spondylodiscitis: Part I-Epidemiology, Clinical Features, Laboratory Markers, and Tissue-Based Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

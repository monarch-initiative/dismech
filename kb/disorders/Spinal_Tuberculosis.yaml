      reference_title: "Spinal Tuberculosis: Current Concepts."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Rajasekaran et al, in a series of 17 patients, reported that the

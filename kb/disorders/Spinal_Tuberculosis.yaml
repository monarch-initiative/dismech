agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans by inhaled aerosols and
    reaches the spine by haematogenous spread from a pulmonary or other
    primary focus. M. bovis is maintained in cattle and reaches humans through
    unpasteurised dairy products or direct contact with infected animals.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host of M. tuberculosis
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: primary host and reservoir of M. bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:39231571
    reference_title: "Massive cerebral tuberculomas, Pott's disease and hypercalcaemia secondary to Mycobacterium bovis in a patient with chronic kidney disease on peritoneal dialysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      However, while M. tuberculosis is the main infectious agent causing TB,
      cattle are the primary host of Mycobacterium bovis (M. bovis), so they
      have a zoonotic risk.
    explanation: >-
      The background of a case report of M. bovis Pott disease identifies
      cattle as the primary host of M. bovis.
  - reference: PMID:33101977
    reference_title: "A rare case of spinal tuberculosis due to Mycobacterium bovis. Is zoonotic tuberculosis underdiagnosed?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Infection takes place via the consumption of unpasteurized, contaminated
      dairy products and their derivatives, or via direct contact with
      infected animals.
    explanation: >-
      States how humans acquire M. bovis from animals.

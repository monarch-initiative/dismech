treatments:
- name: Antituberculous chemotherapy
  description: >-
    The cornerstone of treatment. The standard regimen is an intensive phase
    of isoniazid, rifampicin, pyrazinamide and ethambutol (or streptomycin)
    for 2 months followed by isoniazid and rifampicin. The WHO regimen cited
    in the reviews totals 9 months; WHO guidance is also quoted as 6 to 9
    months, while India's index guidelines recommend 12 months extendable to
    18. The Medical Research Council trials found 6- and 9-month
    isoniazid-rifampicin regimens excellent and similar to 18-month regimens,
    a meta-analysis of six randomised studies found 6 months as effective as
    9 months or more for healing (90.6% versus 87.3%), a pilot randomised
    trial of 100 biopsy-proven patients found 6 and 12 months equivalent, and a prospective study treating for 12 months found
    complete MRI healing in 30% at 6 months and 80% at 12 months. Duration is
    often individualised by clinical, laboratory and MRI response; patients
    not healing by 6 months should be investigated for drug resistance rather
    than simply treated for longer. Paradoxical worsening, a deterioration
    after the first month of treatment, occurred in 11% of a 73-patient
    series and predicted a poor outcome; it should not be mistaken for
    treatment failure. Drug-induced hepatitis occurred in 16% of the same
    series. Caveat: isoniazid, rifampicin and pyrazinamide are hepatotoxic, and treatment should be interrupted and a
    modified regimen used when ALT rises above three times the upper limit of
    normal with symptoms or jaundice, or five times without.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Caseating Granulomatous Vertebral Osteomyelitis
    treatment_effect: INHIBITS
    description: >-
      The drugs kill the bacilli that sustain the vertebral granulomatous
      infection, which heals with chemotherapy alone in most patients.
    evidence:
    - reference: PMID:30574444
      reference_title: "Spinal Tuberculosis: Current Concepts."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Chemotherapy alone cures spinal TB; however, around 3% to 5% of cases
        progress to ≥ 60° kyphosis, requiring surgery.
      explanation: >-
        Chemotherapy alone cures the infection in most patients.
  - target: Cold Abscess Formation
    treatment_effect: INHIBITS
    description: >-
      Chemotherapy resolves most cold abscesses without drainage.
    evidence:
    - reference: PMID:30574444
      reference_title: "Spinal Tuberculosis: Current Concepts."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Chemotherapy alone resolves majority of the cold abscesses, and
        drainage is recommended only in certain scenarios
      explanation: >-
        Most cold abscesses resolve on chemotherapy.
  evidence:
  - reference: PMID:22118251
    reference_title: "Spinal tuberculosis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antituberculous treatment remains the cornerstone of treatment.
    explanation: >-
      Chemotherapy is the mainstay of treatment.
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The duration of chemotherapy for spinal TB has been long debated, and
      the WHO recommends 9 months of treatment where 4 drugs—isoniazid,
      rifampicin, pyrazinamide, ethambutol, or streptomycin—are administered
      in the “initiation” phase for 2 months, followed by isoniazid and
      rifampicin for 7 months in the “continuation” phase.
    explanation: >-
      The WHO 9-month regimen as summarised by the review.
  - reference: PMID:40518224
    reference_title: "Changing trends in duration of treatment of musculoskeletal and spinal tuberculosis- long term experience in a tertiary care teaching hospital."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      WHO recommends 6-9 months therapy, index TB guidelines of India
      recommends 12 months ATT extendable to 18 months, yet many surgeons in
      India continue to prescribe 18-24 months ATT in all cases of MSK TB.
    explanation: >-
      The alternative durations recommended by WHO and by India's index
      guidelines, and the longer durations used in practice.
  - reference: PMID:40518224
    reference_title: "Changing trends in duration of treatment of musculoskeletal and spinal tuberculosis- long term experience in a tertiary care teaching hospital."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Patients with no progressive signs of clinical healing by 6 months
      should be investigated for drug resistance rather than empirical
      extension of treatment beyond 6-9 months.
    explanation: >-
      Advises testing for resistance, not extending treatment, when healing
      stalls.
  - reference: PMID:10422019
    reference_title: "Five-year assessment of controlled trials of short-course chemotherapy regimens of 6, 9 or 18 months' duration for spinal tuberculosis in patients ambulatory from the start or undergoing radical surgery. Fourteenth report of the Medical Research Council Working Party on Tuberculosis of the Spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In all centres the results of the 6- and 9-month regimens of HR were
      excellent and similar to the 18-month EH and PH regimens.
    explanation: >-
      The MRC randomised trials found 6- and 9-month isoniazid-rifampicin
      regimens as good as 18-month regimens.
  - reference: PMID:10422019
    reference_title: "Five-year assessment of controlled trials of short-course chemotherapy regimens of 6, 9 or 18 months' duration for spinal tuberculosis in patients ambulatory from the start or undergoing radical surgery. Fourteenth report of the Medical Research Council Working Party on Tuberculosis of the Spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Chemotherapy is the critical factor in the management of tuberculosis of
      the spine.
    explanation: >-
      The trials' conclusion that chemotherapy, not surgery, is decisive.
  - reference: PMID:34784702
    reference_title: "Is 6 Months of Antitubercular Chemotherapy as Effective as More Than 6 Months Regimen in Spinal Tuberculosis? A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Overall, the healed status of spinal TB was equivalent in patients in
      both groups (pooled relative risk, 0.98; 95% CI, 0.92-1.04; p =0.439).
      However, there was considerable heterogeneity among the trials
      (I2=40.8%, p =0.149).
    explanation: >-
      A meta-analysis of six randomised studies found 6 months of therapy
      equivalent to 9 months or more, with heterogeneity between trials.
  - reference: PMID:30045346
    reference_title: "Six versus 12 Months of Anti Tubercular Therapy in Patients With Biopsy Proven Spinal Tuberculosis: A Single Center, Open Labeled, Prospective Randomized Clinical Trial-A Pilot study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This pilot study concludes that, in patients with biopsy proven
      spinal-vertebral, TB, 6 and 12 months of ATT give similar clinical
      outcomes at 24 months of completion of therapy.
    explanation: >-
      A pilot randomised trial found 6 and 12 months equivalent.
  - reference: PMID:41438824
    reference_title: "Spinal tuberculosis treatment duration: Correlating MRI findings with therapeutic outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A middle-path regime followed with standard ATT, including a 2-month
      intensive phase (with isoniazid, rifampicin, ethambutol, and
      pyrazinamide), and a 10-month continuation phase (isoniazid and
      rifampicin)
    explanation: >-
      A 12-month alternative regimen used in a prospective study.
  - reference: PMID:41438824
    reference_title: "Spinal tuberculosis treatment duration: Correlating MRI findings with therapeutic outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      MRI assessments revealed complete healing in 30% at 6 months and 80% at
      12 months.
    explanation: >-
      MRI healing rates at 6 and 12 months of treatment in 100 patients.
  - reference: PMID:17021358
    reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment should be interrupted and, generally, a modified or
      alternative regimen used for those with ALT elevation more than three
      times the upper limit of normal (ULN) in the presence of hepatitis
      symptoms and/or jaundice, or five times the ULN in the absence of
      symptoms.
    explanation: >-
      Caveat: the ALT thresholds for interrupting hepatotoxic antituberculous
      drugs.
  - reference: PMID:36270077
    reference_title: "Treatment response and complications during management of Pott's spine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      It is concluded that neurological involvement in Pott's spine was
      present in 64% patients, paradoxical worsening (deterioration in
      symptoms after one month of ATT) in 11% and DIH in 16%. Weight loss,
      non-ambulatory state on admission and paradoxical worsening predicted
      poor outcome.
    explanation: >-
      In 73 patients treated with four-drug therapy, 11% had paradoxical
      worsening and 16% drug-induced hepatitis, and paradoxical worsening
      predicted a poor outcome.

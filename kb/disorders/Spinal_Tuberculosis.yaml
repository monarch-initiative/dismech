clinical_burden:
  burden_level: HIGH
  rationale: >-
    Spinal tuberculosis is rarely fatal (about 2% mortality in large surveys)
    but often disabling: about half of patients have a neurological deficit,
    a fifth of patients in African series had permanent disability, and 38.5%
    of a Spanish series had severe functional sequelae despite long hospital
    stays, with relapse in about 5%.
  evidence:
  - reference: PMID:39245137
    reference_title: "Disparities in the Clinical Profile of Spinal Tuberculosis in Africa: A Scoping Review of Management and Outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A favorable outcome was achieved in 51.6% of patients, 20.3% developed a
      permanent disability, and the mortality rate was 2.1%.
    explanation: >-
      Pooled outcomes from 60 African studies with 3416 patients.
  - reference: PMID:15164258
    reference_title: "Tuberculous vertebral osteomyelitis in the new millennium: still a diagnostic and therapeutic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Although no deaths were directly attributable to tuberculous vertebral
      osteomyelitis and only 5.1% of patients relapsed, the mean overall
      hospital stay was 69.1+/-36.9 days, and 30 (38.5%) patients had severe
      functional sequelae.
    explanation: >-
      Relapse, hospital stay and severe sequelae in 78 patients.
  - reference: PMID:11339471
    reference_title: "Spinal tuberculosis (Pott's disease): its clinical presentation, surgical management, and outcome. A survey study on 694 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Follow-up information was available in 414 of the 694 patients and
      there were ten deaths (2%), one occurring intraoperatively and the other
      nine postoperatively.
    explanation: >-
      Mortality of 2% in a national survey of mostly surgical cases.

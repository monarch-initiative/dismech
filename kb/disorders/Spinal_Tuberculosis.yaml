notes: >-
  The entry is named "Spinal Tuberculosis", a MONDO exact synonym, rather
  than the inverted MONDO label "tuberculosis, spinal". The clinical evidence
  is almost entirely retrospective case series from single centres or
  national surveys, narrative reviews and one pilot randomised trial of
  treatment duration; there are no large randomised trials of surgery or of
  regimen. Symptom frequencies are taken from Colmenero et al. (78 patients
  with definite or probable tuberculous vertebral osteomyelitis, all
  diagnosed patients over 19 years, of whom 70.5% eventually had surgery) and
  Pertuiset et al. (103 consecutive culture- or histology-confirmed adults in
  Paris). The Turkish survey of 694 cases (Turgut 2001) pooled published,
  largely surgical case reports, so its figures (leg weakness 69%, gibbus 46%)
  are cited but not used to set frequencies. The East Chinese series of 893
  patients came from an orthopaedic department, most of whom had surgery, so
  its rates of concurrent pulmonary tuberculosis (48.7%) and drug resistance
  (6.5%) are recorded in prose only. Three deep-research runs with the
  claude_code provider initially returned incomplete reports; a later run
  succeeded and is committed as
  `research/Spinal_Tuberculosis-deep-research-claude_code.md`. The report
  was used as a set of leads only, and everything taken from it was
  re-verified against the cited abstracts.
review_notes: >-
  Deliberately lumped. Spinal tuberculosis caused by Mycobacterium
  tuberculosis, the rare cases caused by zoonotic Mycobacterium bovis, and
  tuberculous spondylitis after intravesical BCG are kept in one entry, as are
  the classic paradiscal spondylodiscitis and the atypical spondylitis without
  disc involvement described by Pertuiset et al. The cited sources describe
  the same granulomatous vertebral lesion, the same imaging and the same
  antituberculous treatment for all of them, and none describes M. bovis or
  BCG spondylitis, or the non-discal pattern, as a separate clinical entity
  with its own diagnostic or therapeutic pathway. PubMed was searched for
  spinal tuberculosis, Pott disease, tuberculous spondylitis and
  spondylodiscitis, and for M. bovis spondylitis; the M. bovis literature
  found was two case reports.

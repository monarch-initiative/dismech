transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The infection is acquired by inhaling aerosolised bacilli; the spine is
    then reached through the bloodstream from the primary focus. Spinal
    tuberculosis itself is not transmitted from the spinal lesion.
  evidence:
  - reference: PMID:34827337
    reference_title: "Genitourinary Tuberculosis: A Comprehensive Review of a Neglected Manifestation in Low-Endemic Countries."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TB infection starts from inhalation of cough-generated aerosols
      containing mycobacterium tuberculosis.
    explanation: >-
      States the airborne entry of M. tuberculosis that precedes all
      extrapulmonary tuberculosis, including spinal disease.
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Spinal infection is always secondary and is caused by hematogenous
      dissemination of the bacillus from a primary focus.
    explanation: >-
      States that the spine is infected secondarily, through the blood, from
      a primary focus.
- name: Zoonotic Mycobacterium bovis acquisition
  description: >-
    M. bovis is acquired from infected cattle, mainly by consuming
    unpasteurised dairy products or by direct contact with infected animals.
  evidence:

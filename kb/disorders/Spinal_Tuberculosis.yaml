      caseative necrosis, epithelioid cell granuloma, and Langhans giant
      cells and have been reported in around 72% to 97%.
    explanation: >-
      The classical histology of spinal tuberculosis and how often it is
      found.
progression:
- phase: Active spinal tuberculosis
  notes: >-
    Granulomatous vertebral infection with abscess formation, vertebral
    destruction and, in some patients, early-onset neurological deficit from
    compression. Symptoms usually last months before diagnosis.
  evidence:
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Direct compression due to abscess, inflammatory tissue, or sequestrum
      and instability are the usual causes for neural compromise in the
      active stage.
    explanation: >-
      Describes the neural compression of the active stage.
- phase: Healed disease with residual deformity
  notes: >-
    After treatment the lesion heals by fusion, but kyphosis can progress and
    a severe kyphosis can cause late-onset paraplegia years to decades later.
    Intermittent back pain may persist after healing.
  evidence:
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neurological complications can occur either during the early active
      disease or in the late healed stage.
    explanation: >-
      Places late neurological complications in the healed stage.
  - reference: PMID:40518224
    reference_title: "Changing trends in duration of treatment of musculoskeletal and spinal tuberculosis- long term experience in a tertiary care teaching hospital."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Intermittent back pain continued in 23/51 patients (41%) even after 2
      years of stoppage of 9-11 months ATT, among them 20 patients (96.4%) had
      radiological bony fusion.
    explanation: >-
      Back pain persisted in 41% of 51 patients two years after treatment,
      despite bony fusion.
diagnosis:
- name: MRI of the spine
  description: >-
    The imaging modality of choice: it detects the earliest changes, shows
    the extent of bone and soft-tissue disease, abscesses and neural
    compression, and helps follow the response to treatment. Features
    favouring tuberculous over pyogenic spondylitis include a well-defined
    paraspinal signal, a thin and smooth abscess wall, paraspinal or
    intraosseous abscess, subligamentous spread over three or more levels,
    multiple vertebrae, thoracic involvement and relative disc preservation;
    pyogenic infection more often shows early disc-endplate destruction,
    homogeneous enhancement, facet arthritis and epidural phlegmon. Persistent
    enhancement after treatment does not on its own mean active infection.
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the spine
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:22118251
    reference_title: "Spinal tuberculosis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For the diagnosis of spinal tuberculosis magnetic resonance imaging is
      more sensitive imaging technique than x-ray and more specific than
      computed tomography.
    explanation: >-
      MRI is more sensitive than radiography and more specific than CT.
  - reference: PMID:15149983
    reference_title: Discrimination of tuberculous spondylitis from pyogenic spondylitis on MRI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The reviewer identified tuberculous spondylitis with sensitivity,
      specificity, and accuracy of 100% (20/20), 80% (16/20), and 90% (36/40)
    explanation: >-
      MRI read by a blinded reviewer identified tuberculous spondylitis
      accurately in 20 tuberculous and 20 pyogenic cases.
  - reference: PMID:15149983
    reference_title: Discrimination of tuberculous spondylitis from pyogenic spondylitis on MRI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patients with tuberculous spondylitis had a significantly higher
      incidence of MRI findings as follows (p < 0.05): a well-defined
      paraspinal abnormal signal
    explanation: >-
      Opens the list of MRI features significantly more frequent in
      tuberculous than in pyogenic spondylitis. The abstract goes on to give
      a well-defined paraspinal signal (95% vs 25%), a thin smooth abscess
      wall (95% vs 15%), paraspinal or intraosseous abscess (95% vs 50%),
      subligamentous spread over three or more levels (85% vs 40%), multiple
      vertebral bodies (60% vs 25%) and thoracic involvement (40% vs 10%);
      those figures sit beside bracketed counts that cannot be quoted, so
      they are given here rather than in the snippet.
  - reference: PMID:42650944
    reference_title: "Differentiating Tuberculous and Pyogenic Spondylodiscitis: Part II: MRI/CT Features, Prediction Models, and the Role of PET/CT-A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Features favoring PS include lumbar predominance, early disc-endplate
      destruction, homogeneous inflammatory enhancement, facet-joint
      arthritis, and epidural phlegmon.
    explanation: >-
      The imaging features that favour pyogenic spondylodiscitis instead.
  - reference: PMID:42533326
    reference_title: AO Spine Clinical Practice Recommendations for the Management of Spinal Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Persistent contrast enhancement on MRI alone should not automatically be
      interpreted as ongoing active infection.
    explanation: >-
      Caveat on reading follow-up MRI.
- name: FDG-PET/CT as an adjunct to MRI
  description: >-
    Conditionally recommended when MRI is inconclusive, contraindicated or
    limited by artefact, or to judge healing when MRI is limited by metal
    implants. It does not establish the diagnosis and is not recommended
    routinely in resource-limited settings.
  diagnosis_term:
    preferred_term: FDG-PET/CT
    term:
      id: NCIT:C137817
      label: FDG-Positron Emission Tomography and Computed Tomography Scan
  evidence:
  - reference: PMID:42533326
    reference_title: AO Spine Clinical Practice Recommendations for the Management of Spinal Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Based on GRADE methodology, we conditionally recommend FDG-PET/CT as an
      adjunctive imaging modality in selected patients with suspected spinal
      tuberculosis when MRI is inconclusive, contraindicated, or substantially
      limited by artifact.
    explanation: >-
      The AO Spine panel's conditional recommendation for PET/CT.

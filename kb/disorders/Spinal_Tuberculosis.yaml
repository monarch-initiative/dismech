- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacterium that causes almost all spinal
    tuberculosis, reaching the spine by haematogenous spread.
  evidence:
  - reference: PMID:40890663
    reference_title: "Clinical and epidemiological analysis of 893 patients with spinal tuberculosis: an 11-Year investigation of a general hospital in East China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Spinal tuberculosis typically results from the hematogenous spread of Mtb
      to the spine, leading to destructive lesions in vertebral bodies or
      intervertebral spaces.
    explanation: >-
      The introduction of a large case series names M. tuberculosis as the
      agent reaching the spine through the blood.
  - reference: PMID:33101977
    reference_title: "A rare case of spinal tuberculosis due to Mycobacterium bovis. Is zoonotic tuberculosis underdiagnosed?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In the available scientific literature, spinal tuberculosis is generally
      caused by M. tuberculosis and indicates human to human transmission.
    explanation: >-
      States that spinal tuberculosis is generally caused by M. tuberculosis.
- name: Mycobacterium bovis
  infectious_agent_term:
    preferred_term: Mycobacterium bovis
    term:
      id: NCBITaxon:1765
      label: Mycobacterium tuberculosis variant bovis
  description: >-
    A member of the M. tuberculosis complex whose primary host is cattle. It
    is a rare cause of Pott disease, acquired from infected animals or their
    unpasteurised milk; its attenuated BCG strain can also cause tuberculous
    spondylitis after intravesical bladder cancer therapy.
  evidence:
  - reference: PMID:33101977
    reference_title: "A rare case of spinal tuberculosis due to Mycobacterium bovis. Is zoonotic tuberculosis underdiagnosed?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We report a rare presentation of Pott's disease caused by M. bovis,
      suggesting transmission from infected cattle, and only the second case
      described so far in scientific reports.
    explanation: >-
      A case report of Pott disease caused by M. bovis, which the authors
      describe as only the second reported.
  - reference: PMID:33101977
    reference_title: "A rare case of spinal tuberculosis due to Mycobacterium bovis. Is zoonotic tuberculosis underdiagnosed?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND

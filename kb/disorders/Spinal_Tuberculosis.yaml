prevalence:
- population: Patients with tuberculosis
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Spinal tuberculosis is reported as about 2% of all tuberculosis cases in
    a French series and as about half of skeletal tuberculosis, which is in
    turn about 10% of extrapulmonary tuberculosis. These are shares of
    tuberculosis cases, not population rates, so no rate is asserted.
  evidence:
  - reference: PMID:10499072
    reference_title: "Spinal tuberculosis in adults. A study of 103 cases in a developed country, 1980-1994."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Spinal tuberculosis (TB) accounts for about 2% of all cases of TB.
    explanation: >-
      The framing sentence of a 103-patient series gives the share of all
      tuberculosis that is spinal.
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Skeletal TB (STB) contributes to around 10% of EPTB, and spinal TB has
      been the most common site of STB, amounting to around half of skeletal
      EPTB.
    explanation: >-
      Spinal disease is about half of skeletal tuberculosis, itself about a
      tenth of extrapulmonary tuberculosis.
  - reference: PMID:22118251
    reference_title: "Spinal tuberculosis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Spinal tuberculosis is more common in children and young adults.
    explanation: >-
      States the age groups most affected.
environmental:
- name: HIV infection
  description: >-
    People living with HIV have a higher risk of tuberculosis and of
    extrapulmonary tuberculosis. In a South African series of 52 patients with
    spinal tuberculosis, 59.6% were HIV-infected, and those with HIV had more
    vertebrae involved and more vertebral collapse, though fewer presented
    with neurogenic symptoms.
  influences_mechanisms:
  - target: Hematogenous Seeding of the Vertebral Body
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HIV raises the risk of extrapulmonary tuberculosis; the cited sources do
      not establish which step it acts on, so the link is drawn to the
      haematogenous seeding of the spine.
    evidence:
    - reference: PMID:39514752
      reference_title: "Evaluation of clinical, laboratory, radiographical and histopathological characteristics in patients with spinal tuberculosis in the context of HIV infection: An analysis of 52 patients from a South African tertiary hospital."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        People living with HIV have an increased risk of TB infection, and are
        more likely to develop extrapulmonary TB.
      explanation: >-
        The background of a spinal tuberculosis series states that HIV raises
        the risk of extrapulmonary tuberculosis.
  evidence:
  - reference: PMID:39514752
    reference_title: "Evaluation of clinical, laboratory, radiographical and histopathological characteristics in patients with spinal tuberculosis in the context of HIV infection: An analysis of 52 patients from a South African tertiary hospital."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The rate of vertebral collapse was higher in the HIV-infected cohort (39%
      v. 67%, p=0.048). HIV-infected patients showed a higher count of
      involved vertebrae (mean 3.0 v. 3.85; p=0.034).
    explanation: >-
      In 52 South African patients, HIV infection was associated with more
      vertebral collapse and more vertebrae involved.
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      HIV-infected individuals pose them at a high risk for clinically
      symptomatic disease as they are immunodeficient.
    explanation: >-
      The review names HIV-related immunodeficiency as a risk for clinically
      symptomatic spinal tuberculosis.

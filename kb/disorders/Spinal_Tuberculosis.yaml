- name: Hematogenous Seeding of the Vertebral Body
  description: >-
    Bacilli lodge in the subchondral bone of the vertebral endplates on
    either side of a disc, supplied by the paradiscal arteries, and usually in
    the anterior part of the vertebral body. The adult disc is avascular and
    is reached secondarily. Batson's paravertebral venous plexus may
    contribute to the thoracic predilection, multilevel spread and occasional
    skip lesions. Other patterns are central (vertebral body), posterior
    (posterior elements) and non-osseous abscess.
  biological_scale: TISSUE
  locations:
  - preferred_term: vertebral body
    term:
      id: UBERON:0001075
      label: bony vertebral centrum
  - preferred_term: vertebral endplate
    term:
      id: UBERON:0014386
      label: vertebral endplate
  evidence:
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anatomically the intervertebral disc is an avascular structure and the
      paradiscal arteries split on either side of the disc and reach the
      subchondral region of the upper and lower endplates of each disc. This
      arterial supply of the vertebra favors subchondral bone involvement on
      either side of the disc, “paradiscal,” which is the most common type
      observed.
    explanation: >-
      Explains why infection seeds the subchondral bone either side of the
      disc, the commonest pattern.
  - reference: PMID:42510106
    reference_title: "Differentiating Tuberculous and Pyogenic Spondylodiscitis: Part I-Epidemiology, Clinical Features, Laboratory Markers, and Tissue-Based Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In adults, spinal infection is usually hematogenous, with seeding of the
      subchondral endplate; the paravertebral venous plexus, as described by
      Batson, may contribute to the thoracic predilection, multilevel spread,
      and occasional noncontiguous lesions seen in spinal tuberculosis
    explanation: >-
      Describes endplate seeding and the possible venous-plexus contribution
      to thoracic predilection and skip lesions.
  - reference: PMID:42650944
    reference_title: "Differentiating Tuberculous and Pyogenic Spondylodiscitis: Part II: MRI/CT Features, Prediction Models, and the Role of PET/CT-A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TS more often begins in the anterior vertebral body and reaches the disc
      secondarily
    explanation: >-
      Places the initial lesion in the anterior vertebral body, with the disc
      reached secondarily.
  downstream:
  - target: Caseating Granulomatous Vertebral Osteomyelitis
    causal_link_type: DIRECT
    description: >-
      The implanted bacilli provoke a granulomatous inflammation of the
      vertebral bone.
    evidence:
    - reference: PMID:30574444
      reference_title: "Spinal Tuberculosis: Current Concepts."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        TB results in granulomatous inflammation characterized by lymphocytic
        infiltration and epithelioid cells, which may merge to form the
        classical Langhans-type giant cells and end up in caseating necrosis
        of affected tissues forming cold abscess.
      explanation: >-
        Describes the granulomatous inflammation that the vertebral infection
        produces.

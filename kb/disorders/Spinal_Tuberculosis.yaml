- name: Drainage of a large cold abscess
  description: >-
    Most cold abscesses resolve with chemotherapy. Drainage is recommended
    only when a large cervical paravertebral abscess causes respiratory
    distress or dysphagia, or a large psoas abscess causes a pseudo-flexion
    deformity of the hip.
  therapeutic_modality: SURGERY

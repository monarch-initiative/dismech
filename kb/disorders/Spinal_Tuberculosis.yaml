- name: Progressive Kyphotic Deformity
  description: >-
    Collapse of one vertebra gives a knuckle, of two a gibbus and of more a
    rounded kyphosis. About 3 to 5% of patients treated with chemotherapy
    alone reach 60 degrees or more and need surgery. In children, kyphosis
    can progress during active disease and again after cure as the spine
    grows; radiological "spine at risk" instability signs predict a late
    increase, and the most severe form, buckling collapse beyond 120
    degrees, is linked to infection before age seven, thoracolumbar disease
    and loss of more than two vertebral bodies. Severe kyphosis in adults
    usually stems from childhood disease.

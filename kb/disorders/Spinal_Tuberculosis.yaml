- name: Surgical decompression, debridement and stabilisation
  description: >-
    Needed only in a minority. Indications are neurological deficit that is
    severe at presentation or static or worsening on chemotherapy,
    instability, severe or progressing deformity, a large abscess,
    incapacitating pain, and failure of medical treatment or recurrence.
    Because the vertebral body is the main site, decompression has
    traditionally been anterior; the AO Spine panel conditionally recommends a
    posterior-only approach for most thoracolumbar cases needing surgery, with
    anterior or combined approaches for selected complex cases, and anterior
    debridement and fusion remains standard in the lower cervical spine.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: spinal decompression
    term:
      id: NCIT:C124141
      label: Spinal Cord Decompression
  target_mechanisms:
  - target: Spinal Cord Compression in Active Disease
    treatment_effect: INHIBITS
    description: >-
      Decompression relieves the compressing abscess, granulation tissue and
      bone.
    evidence:
    - reference: PMID:11964634
      reference_title: "Treatment of tuberculosis of the spine with neurologic complications."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        When needed, a combination of conservative therapy and surgical
        decompression yields successful results in most patients with
        tuberculosis of the spine who have neurologic complications.
      explanation: >-
        Surgical decompression with chemotherapy succeeds in most patients
        with neurological complications.
  - target: Vertebral Body Destruction and Collapse
    treatment_effect: INHIBITS
    description: >-
      Stabilisation restores support to the destroyed anterior column and
      halts progression of deformity.
    evidence:
    - reference: PMID:30574444
      reference_title: "Spinal Tuberculosis: Current Concepts."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Surgery in spinal TB is directed toward achieving adequate
        decompression and debridement, maintenance, and reinforcement of
        stability and halting the progress of deformity
      explanation: >-
        States the aims of surgery, including stability and halting deformity.
  evidence:
  - reference: PMID:30574444
    reference_title: "Spinal Tuberculosis: Current Concepts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Certain situations necessitating surgical management are as follows:
      lack of response to chemotherapy or recurrence, severe weakness at
      presentation, and static or worsening neural deficit even after
      initiating chemotherapy, instability, incapacitating pain, and
      deformities.
    explanation: >-
      Lists the indications for surgery.
  - reference: PMID:22118251
    reference_title: "Spinal tuberculosis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgery may be required in selected cases, e.g. large abscess
      formation, severe kyphosis, an evolving neurological deficit, or lack of
      response to medical treatment.
    explanation: >-
      Adds large abscess to the indications.
  - reference: PMID:11964634
    reference_title: "Treatment of tuberculosis of the spine with neurologic complications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The vertebral body primarily is affected in tuberculosis; therefore,
      decompression has to be anterior.
    explanation: >-
      The traditional rationale for anterior decompression.
  - reference: PMID:42533326
    reference_title: AO Spine Clinical Practice Recommendations for the Management of Spinal Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Based on GRADE methodology, we conditionally recommend a posterior-only
      surgical approach as the preferred option for many patients with
      thoracolumbar spinal tuberculosis requiring operative treatment,
      provided that adequate debridement, decompression, deformity
      correction, and stabilization can be achieved through that approach.
    explanation: >-
      The AO Spine panel's conditional recommendation on approach.
  - reference: PMID:42533326
    reference_title: AO Spine Clinical Practice Recommendations for the Management of Spinal Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgery is indicated in a minority of STB patients; the majority of
      uncomplicated cases are managed effectively with antitubercular
      chemotherapy alone.
    explanation: >-
      Most uncomplicated cases need no surgery.
- name: Corrective osteotomy for severe kyphosis
  description: >-
    For severe or progressive kyphosis, including healed deformity of 60
    degrees or more, posterior osteotomies such as closing-opening wedge
    osteotomy correct the deformity and may prevent or treat late-onset
    paraplegia. Patients expected to reach severe kyphosis should have
    surgery during the active stage.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: spinal osteotomy
    term:
      id: NCIT:C51903
      label: Osteotomy
  target_mechanisms:
  - target: Progressive Kyphotic Deformity
    treatment_effect: INHIBITS
    description: >-
      Osteotomy corrects the kyphotic angle.
    evidence:

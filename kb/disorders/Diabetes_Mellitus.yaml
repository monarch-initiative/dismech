  - reference: PMID:39344692
    reference_title: "Neonatal diabetes mellitus around the world: Update 2024."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a consequence, the list of NDM genes now exceeds 40."

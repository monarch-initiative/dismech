  relationship_type: CAUSATIVE
  subtype: maturity-onset diabetes of the young type 8
  notes: >-
    CEL encodes carboxyl ester lipase, an acinar digestive enzyme, making
    CEL-MODY the one MODY form whose primary lesion is exocrine rather than
    endocrine: frameshift variants in the proximal segments of the gene's
    variable-number tandem repeat produce a proteotoxic protein, exocrine
    pancreatic disease, and only later insulin-dependent diabetes. The allele
    class matters for diagnosis: the reported cases all carry frameshift
    variants, and no carrier of a CEL missense variant has been reported with
    exocrine pancreatic dysfunction.

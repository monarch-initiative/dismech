      label: maturity-onset diabetes of the young type 4
  classification: mondo_nested_subclass
  genes:
  - preferred_term: PDX1
    term:
      id: hgnc:6107
      label: PDX1
  description: >-
    PDX1-MODY (OMIM:606392). PDX1 encodes a transcription factor governing
    pancreatic development and beta-cell maturation; heterozygous variants are a
    rare, low-penetrance cause of MODY, while biallelic loss causes pancreatic
    agenesis.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Mutations in PDX1 represent a rare subtype of monogenic diabetes and are associated with several disorders, including pancreatic agenesis (or congenital pancreatic hypoplasia), permanent neonatal diabetes, or MODY.
    explanation: Places PDX1 variants across the monogenic diabetes spectrum including MODY.
  - reference: PMID:40779032
    reference_title: "Rare Variants in NEUROD1 and PDX1 Are Low-Penetrance Causes of MODY, Whereas Those in APPL1 and WFS1 Are Not Associated With MODY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast, variants in NEUROD1 and PDX1 were enriched, albeit at levels comparable to RFX6.
    explanation: Rare-variant burden evidence supporting PDX1 as a genuine, low-penetrance MODY gene.
- name: maturity-onset diabetes of the young type 6
  subtype_term:
    preferred_term: maturity-onset diabetes of the young type 6
    term:
      id: MONDO:0011668
      label: maturity-onset diabetes of the young type 6
  classification: mondo_nested_subclass
  genes:
  - preferred_term: NEUROD1
    term:
      id: hgnc:7762
      label: NEUROD1
  description: >-
    NEUROD1-MODY (OMIM:606394). Rare heterozygous NEUROD1 variants are enriched
    in MODY cohorts at a level comparable to the low-penetrance MODY gene RFX6,
    so the subtype is real but not highly penetrant.
  evidence:
  - reference: PMID:40779032
    reference_title: "Rare Variants in NEUROD1 and PDX1 Are Low-Penetrance Causes of MODY, Whereas Those in APPL1 and WFS1 Are Not Associated With MODY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In summary, rare heterozygous variants in NEUROD1 and PDX1 are low-penetrance causes of MODY, while those in APPL1 and WFS1 lack robust genetic evidence for causality and should not be included in MODY testing panels.
    explanation: The burden study's own summary of NEUROD1 as a low-penetrance MODY cause.

- name: APPL1
  gene_term:
    preferred_term: APPL1
    term:
      id: hgnc:24035
      label: APPL1
  relationship_type: DISPUTED
  subtype: maturity-onset diabetes of the young type 14
  notes: >-
    Curated as disputed rather than causative. MONDO records APPL1 as the causal
    gene of maturity-onset diabetes of the young type 14 (MONDO:0014674,
    OMIM:616511). APPL1 was one of the genes ClinGen identified as having
    evidence insufficient to support or refute the relationship; a 2025
    case-control burden analysis then found ultra-rare protein-truncating and
    predicted-damaging missense APPL1 variants no more frequent in 2,571 MODY
    cases than in 155,501 population controls, and its authors recommend that
    heterozygous APPL1 variants not be reported as a cause of MODY. The same
    analysis supported PDX1 and NEUROD1, which is why those two are curated here
    as causative and APPL1 is not.
  evidence:
  - reference: PMID:40779032
    reference_title: "Rare Variants in NEUROD1 and PDX1 Are Low-Penetrance Causes of MODY, Whereas Those in APPL1 and WFS1 Are Not Associated With MODY."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Crucially, ultra-rare (minor allele frequency <1:10,000) protein-truncating and predicted-damaging missense variants in APPL1 and WFS1 were not enriched in a MODY cohort (n = 2,571) compared with population control individuals (n = 155,501; all P > 0.05).
    explanation: The negative burden result that this disputed classification rests on.
  - reference: PMID:40779032
    reference_title: "Rare Variants in NEUROD1 and PDX1 Are Low-Penetrance Causes of MODY, Whereas Those in APPL1 and WFS1 Are Not Associated With MODY."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: PDX1 and NEUROD1 should be included in MODY gene panels, while heterozygous APPL1 and WFS1 variants should not be reported as causes of MODY.
    explanation: The testing recommendation that follows, and the contrast with the two genes the same analysis supported.

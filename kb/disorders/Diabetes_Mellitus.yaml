- name: UVA/Padova Type 1 Diabetes Simulator
  description: >-
    Simulator of glucose-insulin dynamics with a population of in silico
    subjects with type 1 diabetes, built on the Dalla Man meal model of the
    glucose-insulin system. The 2013 version (S2013) adds nonlinear
    insulin-dependent glucose utilization in hypoglycemia and glucagon
    kinetics, secretion and action. It is used for in silico trials of glucose
    sensors, insulin dosing and closed-loop (artificial pancreas) controllers,
    and its developers report that FDA accepted it in 2008 as a substitute for
    animal trials in pre-clinical testing of insulin treatment strategies; no
    FDA document recording that decision is cited here. It describes the type
    1 diabetes subtype only, not the other forms this umbrella entry covers.
  model_type: PHYSIOLOGICAL
  base_model: Dalla Man meal simulation model of the glucose-insulin system (PMID:17926672)
  publication: PMID:24876534
  modeled_mechanisms:
  - target: Chronic Hyperglycemia (shared diabetic complication cascade)
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Simulates plasma glucose excursions after meals and insulin doses in
      virtual type 1 diabetes subjects, the glycemic state at the head of this
      node. The complication cascade the node goes on to describe is not
      modelled.
    limitations: >-
      The virtual subjects have absent endogenous insulin secretion by
      construction; autoimmune beta-cell destruction, residual beta-cell
      function and diabetic complications are not modelled. It applies only to
      the type 1 diabetes subtype of this entry, and its glucose output is
      short-term dynamics rather than chronic hyperglycemia over years.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: IMMATERIAL
      description: >-
        Loss of insulin secretion is an input to the simulator, not an outcome
        of modelled autoimmunity; this does not affect its use for simulating
        glucose responses to insulin therapy.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The node continues from sustained hyperglycemia into oxidative and
        AGE-RAGE stress, endothelial injury and end-organ complications; none of
        these is in the simulator, which stops at plasma glucose and insulin.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The node's hyperglycemia is sustained over years; the underlying meal
        model describes single meals and a day of meals, so the simulator
        describes glucose control rather than chronic exposure.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The node spans every diabetes subtype in this entry, while the virtual
        population is calibrated to type 1 diabetes only, so the link does not
        extend to type 2, monogenic or gestational diabetes.
    evidence:
    - reference: PMID:24876534
      reference_title: "The UVA/PADOVA Type 1 Diabetes Simulator: New Features."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "the new virtual subjects span well the real type 1 diabetes mellitus population as demonstrated by good agreement between real and simulated distribution of patient-specific parameters"
      explanation: Supports that the virtual population represents real type 1 diabetes patients.
  evidence:
  - reference: PMID:24876534
    reference_title: "The UVA/PADOVA Type 1 Diabetes Simulator: New Features."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "glucagon kinetics and secretion and action models have been incorporated into the simulator"
    explanation: Describes the S2013 model extensions.
  - reference: PMID:17926672
    reference_title: "Meal simulation model of the glucose-insulin system."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Here, we present a new simulation model in normal humans that describes the physiological events that occur after a meal"
    explanation: Describes the meal model on which the simulator is built.
  findings:
  - statement: The simulator's developers report that FDA accepted it in January 2008 as a substitute for animal trials in pre-clinical testing of insulin treatment strategies.
    evidence:
    - reference: PMID:37743740
      reference_title: "Developing the UVA/Padova Type 1 Diabetes Simulator: Modeling, Validation, Refinements, and Utility."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In January 2008, in an unprecedented decision, the Food and Drug Administration (FDA) accepted this simulator as a substitute to animal trials for the pre-clinical testing of insulin treatment strategies."
      explanation: The simulator developers' review records the FDA decision.
  - statement: The S2013 version describes hypoglycemic events better than the earlier version.
    evidence:
    - reference: PMID:24876534
      reference_title: "The UVA/PADOVA Type 1 Diabetes Simulator: New Features."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "S2013 shows a better performance in describing hypoglycemic events."
      explanation: Reports the validation improvement of the 2013 version.
  notes: >-
    Placed on this umbrella entry rather than on Type_I_Diabetes at the
    maintainer's direction on issue #16321. The simulator is distributed under
    licence by the University of Virginia and is not in a public repository.
environmental:
- name: Environmental determinants of diabetes susceptibility and progression
  influences_mechanisms:
  - target: Chronic Hyperglycemia (shared diabetic complication cascade)
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A meta-exposure rather than an exposure: it asserts that environmental
      context matters across subtypes without naming a context. Recorded as
      modulating for that reason, and graded partial on a sentence that
      reports what a panel of experts discussed. It is drawn because the claim
      it makes, that environment modifies trajectories across all subtypes, is
      the umbrella-level statement this entry exists to hold. This entry is
      the retained umbrella for diabetes mellitus and carries a single
      pathophysiology node, the shared hyperglycemia that every subtype
      converges on, so one target is the only shape available; the
      subtype-specific routes are modeled in the per-type entries and in the
      diabetic_vascular_complications module. Stated once here rather than
      repeated on all nine links, which lets each description carry its own
      reasoning.
    evidence:
    - reference: PMID:27980006
      reference_title: "Differentiation of Diabetes by Pathophysiology, Natural History, and Prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "International experts in genetics, immunology, metabolism, endocrinology, and systems biology discussed genetic and environmental determinants of type 1 and type 2 diabetes risk and progression, as well as complications."
      explanation: >-
        Reports that international experts discussed genetic and environmental
        determinants of risk, progression and complications. It records that
        the topic was addressed rather than what was concluded.
  description: >-
    Environmental contexts modify susceptibility and progression across diabetes
    subtypes rather than a single uniform etiologic pathway.
  effect: Alters diabetes risk trajectories and complication burden across subtypes.
  evidence:
  - reference: PMID:27980006
    reference_title: "Differentiation of Diabetes by Pathophysiology, Natural History, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

      label: HNF1A
  description: >-
    HNF1A-MODY (OMIM:600496). The commonest MODY form in most series, with a
    glucose-stimulated insulin secretory defect that worsens over time and
    marked sulfonylurea sensitivity.
  evidence:
  - reference: PMID:29931562
    reference_title: "Monogenic Diabetes in Children and Adolescents: Recognition and Treatment Options."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Insulin secretion in response to glucose is reduced in patients with heterozygous HNF1A mutations, and secretory defects worsen over time as a result of the progressive beta cell dysfunction.
    explanation: States the progressive secretory defect that defines this subtype.
- name: maturity-onset diabetes of the young type 4

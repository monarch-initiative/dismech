pathophysiology:
# The blended type-1/type-2/type-5 mechanism graph that previously lived here has
# been retired as part of the A2 diabetes refactor. Diabetes mellitus is modeled
# as: a Grouping over the distinct type entries (kb/groupings/Diabetes_Mellitus.yaml,
# owning MONDO:0005015) + the shared diabetic_vascular_complications mechanism
# module + the per-type standalone entries (Type_I_Diabetes, Type_2_Diabetes_Mellitus,
# Malnutrition-related_Diabetes_Mellitus). The type-specific routes to hyperglycemia
# are elaborated in those standalone entries; the shared complication cascade is the
# module. This umbrella retains the has_subtypes catalog, the case-definition/USPSTF
# screening definitions, and disease-level framing, and defers mechanism to the module
# via the single conforming node below. See docs/curation-notes/diabetes-mellitus-grouping-refactor.md.
- name: Chronic Hyperglycemia (shared diabetic complication cascade)
  description: >-
    Sustained hyperglycemia is the shared, subtype-independent driver of diabetic
    tissue injury across every form of diabetes mellitus. Whatever the upstream
    route (autoimmune beta-cell destruction in type 1, insulin resistance with
    beta-cell secretory failure in type 2, undernutrition-associated beta-cell
    impairment in type 5, or a monogenic beta-cell defect), chronic hyperglycemia
    feeds one conserved cascade: hyperglycemia-induced oxidative and AGE-RAGE
    stress, endothelial dysfunction and vascular inflammation, micro- and
    macrovascular injury, and diabetic end-organ complications (kidney disease,
    retinopathy, neuropathy, atherosclerotic cardiovascular disease). That cascade
    is captured once in the diabetic_vascular_complications module, to which this
    node conforms; the per-type entries elaborate their own routes to hyperglycemia.
  conforms_to: "diabetic_vascular_complications#Chronic Hyperglycemia"
  biological_processes:
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32872570
    reference_title: "Pathophysiology of Type 2 Diabetes Mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to the World Health Organization (WHO) diabetes mellitus is a chronic, metabolic disease characterized by elevated levels of blood glucose, which leads over time to damage to the heart, vasculature, eyes, kidneys and nerves."
    explanation: >-
      Supports chronic hyperglycemia as the shared driver of multiorgan diabetic
      complications, the mechanism captured by the diabetic_vascular_complications
      module this node conforms to.

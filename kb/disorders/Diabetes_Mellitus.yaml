environmental:
- name: Environmental determinants of diabetes susceptibility and progression
  influences_mechanisms:
  - target: Chronic Hyperglycemia (shared diabetic complication cascade)
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A meta-exposure rather than an exposure: it asserts that environmental
      context matters across subtypes without naming a context. Recorded as
      modulating for that reason, and graded partial on a sentence that
      reports what a panel of experts discussed. It is drawn because the claim
      it makes, that environment modifies trajectories across all subtypes, is
      the umbrella-level statement this entry exists to hold. This entry is
      the retained umbrella for diabetes mellitus and carries a single
      pathophysiology node, the shared hyperglycemia that every subtype
      converges on, so one target is the only shape available; the
      subtype-specific routes are modeled in the per-type entries and in the
      diabetic_vascular_complications module. Stated once here rather than
      repeated on all nine links, which lets each description carry its own
      reasoning.
    evidence:
    - reference: PMID:27980006
      reference_title: "Differentiation of Diabetes by Pathophysiology, Natural History, and Prognosis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "International experts in genetics, immunology, metabolism, endocrinology, and systems biology discussed genetic and environmental determinants of type 1 and type 2 diabetes risk and progression, as well as complications."
      explanation: >-
        Reports that international experts discussed genetic and environmental
        determinants of risk, progression and complications. It records that
        the topic was addressed rather than what was concluded.
  description: >-
    Environmental contexts modify susceptibility and progression across diabetes
    subtypes rather than a single uniform etiologic pathway.
  effect: Alters diabetes risk trajectories and complication burden across subtypes.
  evidence:
  - reference: PMID:27980006
    reference_title: "Differentiation of Diabetes by Pathophysiology, Natural History, and Prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "International experts in genetics, immunology, metabolism, endocrinology, and systems biology discussed genetic and environmental determinants of type 1 and type 2 diabetes risk and progression, as well as complications."
    explanation: This supports broad environmental contributions to diabetes susceptibility and progression.

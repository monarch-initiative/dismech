notes: >-
  Genetics pass, September 2026 (dismech#12194). This entry is the umbrella that
  the A2 refactor left in place after its blended mechanism graph was retired:
  diabetes mellitus is modelled as a Grouping over the standalone type entries
  plus the diabetic_vascular_complications module, and this file keeps the
  has_subtypes catalogue, the case definitions, and disease-level framing (see
  docs/curation-notes/diabetes-mellitus-grouping-refactor.md). The genetics pass
  was scoped to match that decision.

  What was done. The monogenic arm is the part of the genetics that has no other
  home - there is no standalone MODY or neonatal-diabetes entry - so it was
  curated here. Every numbered MODY subtype row and the renal-cysts-and-diabetes
  row now carries a real description, the OMIM identifier its number comes from,
  and, where the gene-disease relationship stands up, a bound gene. Nine gene
  records were added: PDX1, NEUROD1, CEL, INS (as a monogenic claim distinct
  from the type 1 susceptibility record), RFX6, and four recorded as DISPUTED
  (KLF11, PAX4, BLK, APPL1). A single Monogenic Beta-Cell Dysfunction node was
  added upstream of the shared hyperglycaemia node so that the monogenic genes
  reach the pathograph; it deliberately does not elaborate per-gene mechanism,
  which belongs in per-subtype entries if those are ever promoted.

  Four MONDO-recorded genes are curated as disputed rather than causative, which
  is a considered disagreement with MONDO and not an omission. BLK, KLF11 and
  PAX4 were re-examined against gnomAD and UK Biobank and fail on cosegregation,
  population frequency, and case-control burden; ClinGen has reclassified all
  three as refuted. APPL1 fails the same burden test in a later analysis that
  supported PDX1 and NEUROD1 in the same run. The MONDO subtype terms are
  retained because MONDO defines them, and each subtype row states why no gene
  is bound to it.

  Deliberately not done. The type 1 and type 2 genetic records here (HLA-DQA1,
  HLA-DQB1, INS, PTPN22, IL2RA, CTLA4, TCF7L2, PPARG, SLC30A8) duplicate records
  in Type_I_Diabetes.yaml and Type_2_Diabetes_Mellitus.yaml, where they are
  already wired to type-specific mechanism nodes. They are unwireable here by
  construction, because the refactor removed the type-specific mechanism nodes
  from this file on purpose, and wiring them would mean putting those nodes
  back. The refactor note already lists reallocating this section as outstanding
  work; that is a separate change and is not attempted here. Note that
  Type_I_Diabetes.yaml records the class II risk as the haplotype labels HLA-DQ2
  and HLA-DQ8 with an explicit note that they are not HGNC-resolvable, so the
  HGNC-bound HLA-DQA1 and HLA-DQB1 records here are not pure duplicates and
  should be carried across rather than dropped when that reallocation happens.

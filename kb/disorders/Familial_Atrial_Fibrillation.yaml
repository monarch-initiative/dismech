pathophysiology:
- name: Atrial Ion-Channel or Coupling Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  description: >-
    A germline (or, for GJA5, atrial-tissue-restricted somatic) variant alters an
    atrial ion channel, a gap-junction protein, or another atrial-restricted
    protein. The best-characterized variants are gain-of-function in atrial
    potassium channels (KCNQ1/IKs, KCNJ2/IK1, KCNE2), with additional families
    carrying GJA5 (connexin 40), NPPA, SCN5A, and loss-of-function KCNA5 (IKur)
    variants. Three further loci reach this node without being channels at all:
    ABCC9 encodes the KATP channel regulatory subunit SUR2A, NUP155 is a nuclear
    pore component, and MYL4 encodes the atrial-selective essential myosin light
    chain. The sodium channel beta subunits SCN1B and SCN2B act indirectly, by
    reducing SCN5A-mediated current.
  genes:

notes: >-
  Familial AF is genetically heterogeneous; OMIM enumerates numerous ATFB loci
  (familial AF 1-18 in MONDO). The well-validated, mechanistically informative
  subtypes are represented here as has_subtypes rather than as separate
  gene-level files, consistent with the issue #4242 recommendation to prefer a
  single lumped entry. This entry is distinct from the general/acquired Atrial
  Fibrillation entry (MONDO:0004981). The grouping-membership decision for the
  Inherited Arrhythmia Syndromes grouping (broaden vs. spin off an atrial/
  conduction sibling grouping) is deferred to maintainers per #4242.

  How the genes are graded. The numbered ATFB series looks uniform from the
  outside and is not: the evidence behind the twelve gene-bound entities ranges
  from a fully penetrant recessive variant found by sequencing a national
  population to a single case report. Rather than record them all as causative,
  this entry applies one rule and states it here. CAUSATIVE is used where a
  family or population study showed segregation or complete penetrance together
  with supporting functional work: KCNQ1, KCNE2, KCNJ2, GJA5, KCNA5, NUP155,
  MYL4. UNKNOWN is used where the report describes unrelated probands without
  pedigrees, or a single patient: SCN1B, SCN2B, ABCC9. SCN5A is RISK_FACTOR,
  following its own study's conclusion that such variants "may predispose" and
  the observation that a comparable share of AF probands carried rare variants
  already attributed to long-QT or Brugada syndrome. ZFHX3 is SUSCEPTIBILITY -
  see below.

  Read those gradings against the background that the largest unbiased test of
  monogenic AF in the general population, an exome-wide rare loss-of-function
  burden scan across 9,099 genes in the UK Biobank, found a significant
  association for one gene only, and it was TTN rather than any of the numbered
  ATFB loci. That does not refute the families reported here, which are real and
  in several cases functionally worked out; it does mean these loci explain very
  little AF at population scale, and it is the reason this entry is careful
  about the word causative.

  Where this entry disagrees with MONDO. MONDO relates atrial fibrillation,
  familial, 8 (MONDO:0013100) to ZFHX3 with RO:0004003, "has material basis in
  germline mutation in" - the same relation it uses for KCNQ1 and MYL4. The
  finding behind ATFB8 is a genome-wide association signal at a common intronic
  SNP with an odds ratio near 1.2, not a rare germline mutation in a family.
  This entry binds ZFHX3, because the association is solid and repeatedly
  replicated, but grades it SUSCEPTIBILITY and records the reasoning on the
  ZFHX3 genetic entry. The disagreement is about the relation, not about the
  fact.

  Still without a gene. Six of the eighteen MONDO ATFB entities carry no
  causal-gene relation in MONDO: ATFB1, ATFB2, ATFB5, ATFB10, ATFB16 and ATFB17.
  Five of those six stay unbound here too and are retained as MONDO leaf-class
  anchors. The exception is ATFB10, which MONDO leaves gene-less but which this
  entry binds to SCN5A from the literature, with the RISK_FACTOR grading
  explained above. The remaining twelve entities each carry one MONDO gene, and
  every one of those twelve is now bound on its subtype row and carries a
  genetic record with its own evidence.

  TTN is not curated in this entry at all. The TTN association is with
  early-onset AF as a presentation of an inherited cardiomyopathy rather than
  with the Mendelian atrial channelopathy spectrum this entry models, so it
  belongs with the cardiomyopathy entries; it is named above only because it is
  the comparator that shows how small the numbered loci are at population
  scale.

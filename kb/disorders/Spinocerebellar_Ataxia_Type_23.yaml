    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Radioimmunoassay shows markedly elevated mutant dynorphin A in the
      cerebellum, which is the in vivo counterpart of the cellular
      overproduction seen in the original report.
    limitations: >-
      A knock-in of one variant; the functional heterogeneity between reported
      SCA23 alleles means this model speaks for R212W rather than for the
      disease's whole allelic spectrum.

inheritance:
- name: Autosomal dominant inheritance
  description: >-
    SCA23 is autosomal dominant, described in four Dutch families in the
    original report and subsequently in single families elsewhere. Penetrance is
    incomplete and onset is late, which is material to the variant-interpretation
    controversy recorded in this entry.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

animal_models:
- name: PDYN R212W knock-in mouse
  species: Mouse
  genotype: PDYN R212W knock-in
  category: Genetic
  description: >-
    The first animal model of SCA23, carrying the R212W PDYN variant. It
    reproduces the elevated mutant peptide, the Purkinje pathology and the
    progressive motor phenotype, and supplies the glutamatergic transcriptional
    dysregulation that connects the peptide to the cellular lesion. Its authors
    propose on that basis that lowering the mutant peptide could be therapeutic.
  publication: PMID:26169942
  genes:

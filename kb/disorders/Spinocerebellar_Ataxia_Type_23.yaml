name: Spinocerebellar Ataxia Type 23
creation_date: "2026-08-24T00:00:00Z"
description: >-
  SCA23 is a rare, late-onset, autosomal dominant cerebellar ataxia attributed to
  missense variants in PDYN, the precursor of the opioid neuropeptides
  alpha-neoendorphin and dynorphins A and B. It is unusual among the
  spinocerebellar ataxias in that the mutant product is a small secreted
  neuropeptide rather than a channel, chaperone or repeat-expanded protein. The
  proposed mechanism is a gain of toxicity: variants clustered in the dynorphin
  A coding region distort the peptide's secondary structure, which both lowers
  its kappa-opioid receptor affinity and makes it resistant to degradation, so a
  peptide that should be transient persists and acts instead through NMDA
  receptors. The result is proposed to be a convergence of lost
  opioid-mediated neuroprotection and gained NMDA-mediated excitotoxicity,
  producing Purkinje cell loss. Curators should note that the gene-disease
  relationship has been formally challenged in the literature and is more
  contested than for most monogenic ataxia genes — see the
  controversy_pdyn_gene_validity discussion.
category: Mendelian
parents:
- autosomal dominant disease
- spinocerebellar ataxia
synonyms:

- name: Cerebellar Developmental Deficit in Purkinje Cell Innervation
  biological_scale: TISSUE
  description: >-
    A second, non-degenerative arm, and the reason SCA23 cannot be read as
    purely late-onset neurodegeneration. In the R212W mouse the cerebellum is
    already abnormal at two weeks of age — long before the motor deficits at
    three months and the Purkinje cell loss at twelve. GABAergic synapses on the
    Purkinje cell soma are reduced; early-phase climbing fibre elimination is
    delayed between two and three weeks; climbing fibres fail to reach their
    terminal height, and the proximal dendrite they should occupy is taken over
    by parallel fibres, with increased vGlut1 as the marker of that takeover.

    This reframes the climbing fibre retraction curated on the degeneration node
    below: part of it may be territory never properly established rather than
    connectivity lost. The two are not alternatives — the mouse shows both, at
    different ages — and this entry curates them as separate nodes rather than
    collapsing them, because no experiment has yet apportioned the adult
    phenotype between them.

    Everything here is mouse. No human SCA23 developmental study exists, and the
    disease presents in the fifth decade, so the translational status of this arm
    is genuinely open — recorded as the developmental_versus_degenerative
    discussion.

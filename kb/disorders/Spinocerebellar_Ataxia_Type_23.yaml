  description: >-
    PDYN encodes the precursor of alpha-neoendorphin and dynorphins A and B.
    The reported SCA23 variants cluster in the dynorphin A coding region, which
    the mouse-model authors describe as a likely mutational hotspot; a further
    variant sits in the non-opioid domain of the precursor. This is the
    disorder-specific substitution this entry makes against the conserved
    Purkinje-degeneration module, whose trigger node is deliberately generic
    about the molecular lesion.

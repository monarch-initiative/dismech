- name: Cerebellar atrophy
  category: Neurologic
  description: >-
    Cerebellar atrophy on MRI, affecting both hemispheres and the vermis, is the
    consistent imaging finding. Its diagnostic value lies as much in what is
    spared: brainstem, pons and middle cerebellar peduncles are normal, and the
    hot cross bun sign is absent — which is what separates SCA23 from MSA-C.
    Crucially it is not confined to symptomatic carriers; an 88-year-old with no
    subjective cerebellar complaint had moderate cerebellar atrophy.

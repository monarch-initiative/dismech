genetic:
- name: PDYN
  gene_term:
    preferred_term: PDYN
    term:
      id: hgnc:8820
      label: PDYN
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    PDYN is the only gene proposed for SCA23. Reported variants are missense,
    concentrated in the dynorphin A coding region with one in the non-opioid
    domain of the precursor. Functional characterization is variant-specific
    rather than uniform: R6W and R9C show degradation resistance and reduced
    solubility, R6W shows the opioid-to-NMDA receptor switch, and L5S behaves
    oppositely with increased degradation and no aggregation. That heterogeneity
    matters for interpretation, because it means a PDYN missense variant cannot
    be assumed to act by the R6W mechanism. The gene-disease relationship itself
    has been formally challenged — see the controversy_pdyn_gene_validity
    discussion — so variant-level segregation and functional evidence should be
    weighed individually rather than assumed from the gene assignment.
  evidence:
  - reference: PMID:21035104
    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified missense mutations in prodynorphin (PDYN) that cause SCA23 in four Dutch families displaying progressive gait and limb ataxia."
    explanation: >-
      The gene-discovery statement and the number of families it rests on.
  - reference: PMID:21035104
    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three mutations were located in Dyn A, a peptide with both opioid activities and nonopioid neurodegenerative actions."
    explanation: >-
      Establishes the distribution of variants and, in passing, the dual opioid
      and non-opioid character of the peptide that the mechanism turns on.
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R6W and wt Dyn A peptides were most toxic to primary cerebellar neurons."
    explanation: >-
      A variant-specific toxicity result, and one that complicates the picture:
      wild-type peptide was among the most toxic in this assay, which is why
      this entry frames toxicity as concentration- and persistence-dependent
      rather than as a simple property of mutancy.
prevalence:
- population: Netherlands
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The original report estimated SCA23 at about 0.5% of ataxia families in the
    Netherlands, which is a share of a disease population rather than a
    population prevalence and is recorded as such. Cases outside the founding
    Dutch cohort are individually reported, including a first Japanese family.
    Any count here should be read against the gene-validity controversy: if some
    reported variants are not causal, the true number is smaller.
  evidence:
  - reference: PMID:21035104
    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PDYN mutations are identified in a small subset of ataxia families, indicating that SCA23 is an infrequent SCA type (∼0.5%) in the Netherlands"
    explanation: >-
      The source of the 0.5% figure and its explicit framing as a share of
      ataxia families in one country.
progression:
- phase: Adult onset and slow progression
  notes: >-
    Onset is in adult life with slowly progressive gait and limb ataxia. The
    animal model reproduces the temporal pattern in miniature, with gait
    deficits from three months and declining motor coordination by twelve.
  evidence:
  - reference: PMID:26169942
    reference_title: "Elevated mutant dynorphin A causes Purkinje cell loss and motor dysfunction in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "with gait deficits starting at 3 months of age revealed by footprint pattern analysis, and progressive loss of motor coordination and balance at the age of 12 months"
    explanation: >-
      The progressive time course in the model. Evidence source is
      MODEL_ORGANISM; the human time course is described in prose because the
      original report does not state ages in its abstract.
diagnosis:
- name: PDYN sequencing with variant-level functional assessment
  description: >-
    Diagnosis is by sequencing, but the gene assignment's contested status makes
    a bare variant call insufficient. Because functional behaviour differs
    between reported variants, and because the gene-disease relationship has
    been formally questioned, segregation data and functional evidence — peptide
    stability, kappa-opioid receptor signalling, cerebellar neuron toxicity —
    carry more weight here than a classification derived from the gene's
    reputation.
  evidence:
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, L5S Dyn A displayed increased degradation and no aggregation."
    explanation: >-
      The clearest single demonstration that reported SCA23 variants do not
      share one functional behaviour, which is the argument for assessing them
      individually.

discussions:
- discussion_id: controversy_pdyn_gene_validity
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is PDYN genuinely the cause of SCA23, and are all the originally reported
    variants pathogenic?
  attaches_to:
  - "pathophysiology#PDYN Missense Variant in the Dynorphin A Coding Region"
  rationale: >-
    This is not an ordinary knowledge gap: the gene-disease relationship was
    formally challenged in print. In 2016 Brain published a correspondence
    titled "SCA23 and prodynorphin: is it time for gene retraction?", and the
    original authors published a reply under the matching title in the same
    issue. Both are carried in this entry's references. Neither can be quoted
    here: both cache as metadata only, with no abstract body, so no snippet is
    possible and the specifics of the argument are deliberately not asserted in
    this entry. What can be said from sources that are quotable is that the
    functional evidence is variant-specific rather than uniform — L5S behaves
    oppositely to R6W and R9C, and wild-type dynorphin A was among the most
    toxic peptides in one cerebellar neuron assay — and that the original gene
    assignment rested on four families from one country. Against that,
    segregation in those families, an animal model reproducing the phenotype,
    and orthogonal structural and cellular work all support causality. The
    practical consequence for curation is that a PDYN missense variant should
    not be treated as pathogenic on the strength of the gene assignment alone.
  proposed_experiments:
  - experiment_id: exp_pdyn_gene_validity_reassessment
    name: Formal gene-disease validity reassessment
    description: >-
      Submit PDYN-SCA23 to a structured gene-disease validity framework such as
      ClinGen's, pooling segregation evidence from all reported families,
      population-database frequencies for each reported allele, and the
      variant-level functional data, and classify each allele separately. This
      would replace a contested binary — is the gene real or not — with a
      per-variant answer, which is what the heterogeneous functional data
      actually support.
  notes: >-
    No ClinGen gene-disease validity assertion for PDYN was present in this
    repository's cached ClinGen records at the time of curation, so none is
    cited.
- discussion_id: gap_wildtype_dynorphin_toxicity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    If wild-type dynorphin A is itself toxic to cerebellar neurons at sustained
    concentration, what exactly do the SCA23 variants add?
  attaches_to:
  - "pathophysiology#Persistent Elevation of Mutant Dynorphin A"
  - "pathophysiology#Switch from Opioid to NMDA Receptor Signalling"
  rationale: >-
    The cited toxicity assay found R6W and wild-type dynorphin A to be the most
    toxic peptides tested, and the same study reports that the opioid-to-NMDA
    receptor switch was seen for R6W but not for wild-type. Those two results
    sit awkwardly together: if the wild-type peptide can be equally toxic
    without the receptor switch, then the switch is not the whole explanation
    for toxicity, and the disease-relevant variable may be persistence and local
    concentration rather than any change in receptor preference. Resolving this
    matters for the therapeutic proposal that comes out of the mouse model,
    which is to lower the mutant peptide: if concentration is the variable, that
    proposal is well founded; if the receptor switch is, then lowering total
    peptide may not be the right target.
  proposed_experiments:
  - experiment_id: exp_dose_matched_wt_versus_mutant_toxicity
    name: Dose-matched wild-type versus mutant toxicity with receptor blockade
    description: >-
      Compare wild-type and mutant dynorphin A on primary cerebellar neurons at
      matched sustained concentrations, with and without NMDA receptor blockade
      and kappa-opioid agonism. If NMDA blockade rescues the mutant but not the
      wild-type peptide, the receptor switch is doing real work; if it rescues
      both equally, concentration is the dominant variable and the switch is
      incidental.
  evidence:
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R6W and wt Dyn A peptides were most toxic to primary cerebellar neurons. For R6W Dyn A, this is likely because of a switch from opioid to NMDA- receptor signalling, while for wt Dyn A, this switch was not observed."
    explanation: >-
      Both halves of the tension are in this one passage: comparable toxicity,
      but the mechanism invoked for one and explicitly not observed for the
      other.
- discussion_id: developmental_versus_degenerative
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The R212W mouse cerebellum is already abnormal at two weeks of age. Does a
    developmental innervation deficit contribute to human SCA23, a disease that
    presents in the fifth decade?
  attaches_to:
  - "pathophysiology#Cerebellar Developmental Deficit in Purkinje Cell Innervation"
  - "pathophysiology#Purkinje Cell Degeneration and Climbing Fibre Retraction"
  rationale: >-
    This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because the
    evidence is not absent — it is unusually detailed — but it exists only in a
    mouse, and the translational question is sharp rather than routine. The
    mouse shows reduced GABAergic synapses on Purkinje cell soma, delayed
    early-phase climbing fibre elimination, climbing fibres that never reach
    terminal height, and parallel-fibre takeover of the vacated proximal
    dendrite, all by three weeks of age. Human SCA23 presents at a mean age
    around 43 years, with reported onset as early as 10 and as late as 73. A
    developmental lesion of that severity would be expected to produce childhood
    signs, and none are reported.

    Three readings are compatible with the current evidence, and nothing yet
    distinguishes them. The developmental deficit may be a mouse-specific
    consequence of the transgenic construct or of murine cerebellar development,
    with no human counterpart. It may exist in humans as a subclinical
    substrate — a cerebellum built with less climbing fibre territory than
    normal, which tolerates later loss worse — which would explain adult onset
    without requiring childhood signs. Or the adult retraction may be genuinely
    degenerative in both species, with the developmental finding a separable
    early effect that does not feed it.

    The distinction is not academic. If a developmental substrate is real in
    humans, the therapeutic window for peptide-lowering closes before diagnosis
    is possible, which changes what the animal-model authors' own therapeutic
    proposal can be expected to achieve.
  proposed_experiments:
  - experiment_id: exp_conditional_adult_onset_pdyn
    name: Adult-restricted PDYN R212W expression in mouse
    description: >-
      Express the R212W allele under temporal control, switching it on only
      after cerebellar circuit maturation is complete, and compare adult motor
      phenotype, climbing fibre morphology and Purkinje cell survival against the
      constitutive model. If the adult phenotype is reproduced without the
      developmental window, the degeneration does not require the developmental
      deficit; if it is attenuated, the developmental substrate is load-bearing.
  - experiment_id: exp_presymptomatic_carrier_cerebellar_imaging
    name: Cerebellar imaging in presymptomatic PDYN variant carriers
    description: >-
      Image cerebellar volume and, where feasible, functional connectivity in
      young, asymptomatic obligate carriers from reported SCA23 families. The
      question is whether the carrier cerebellum differs from control before any
      degeneration could plausibly have begun. This is directly motivated by the
      documented asymptomatic p.R215H carrier who nonetheless had apparent
      cerebellar atrophy on MRI, which is at least consistent with a substrate
      preceding symptoms.
  evidence:
  - reference: PMID:33043513
    reference_title: "Cerebellar developmental deficits underlie neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings indicate that developmental abnormalities contribute to the SCA23 pathology and uncover a developmental role for PDYN in the cerebellum."
    explanation: >-
      The claim whose human applicability is the open question.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the proband's mother with the PDYN p.R215H variant had no subjective symptoms; she had not come to medical attention before our survey, although she showed apparent cerebellar atrophy on brain magnetic resonance imaging (MRI)"
    explanation: >-
      Classified PARTIAL. A structurally abnormal cerebellum in a carrier with
      no symptoms is consistent with a substrate preceding disease, but a single
      64-year-old carrier cannot distinguish a developmental substrate from
      subclinical degeneration — which is exactly why the imaging experiment
      above is proposed in young carriers.
- discussion_id: calcium_handling_in_sca23
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is Purkinje cell calcium handling actually dysregulated in SCA23, or is the
    reported change confined to channel subunit expression?
  attaches_to:
  - "pathophysiology#Purkinje Cell Degeneration and Climbing Fibre Retraction"
  - "pathophysiology#Switch from Opioid to NMDA Receptor Signalling"
  rationale: >-
    This gap exists because of what it blocks. The
    `cerebellar_purkinje_degeneration` module carries a
    `#Purkinje Cell Calcium and Proteostasis Dysregulation` amplifier node that
    most conforming disorders declare, and SCA23 has two independent reasons to
    expect it: an NMDA-receptor-mediated excitotoxic mechanism, which implies
    calcium entry, and a reported change in the expression of several critical
    Ca2+ channel subunits in the R212W mouse. Neither is a measurement of
    calcium handling. The channel-subunit result is an expression change, and
    its own authors go no further than "potentially contributing to altered Ca2+
    transients"; the excitotoxicity route is an inference from receptor
    pharmacology, not an observation in SCA23 tissue. So the amplifier is left
    unclaimed, and the entry states which measurement is missing rather than
    which evidence is absent.
  proposed_experiments:
  - experiment_id: exp_purkinje_calcium_imaging_r212w
    name: Purkinje cell calcium imaging in the R212W mouse
    description: >-
      Measure calcium transients in Purkinje cells of PDYN R212W and wild-type
      littermates across the ages that bracket the known pathology — three
      weeks, three months and twelve months — using two-photon imaging in acute
      cerebellar slices, with climbing-fibre and parallel-fibre stimulation
      separately. A transient abnormality present at three weeks would tie
      calcium to the developmental arm; one appearing only at three months would
      tie it to the degenerative arm; absence at all three would settle the
      non-conformance affirmatively rather than by default.
  evidence:
  - reference: PMID:33043513
    reference_title: "Cerebellar developmental deficits underlie neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, we detected altered expression of several critical Ca2+ channel subunits, potentially contributing to altered Ca2+ transients in PDYNR212W cerebella."
    explanation: >-
      The whole gap in one sentence: an expression measurement, and an explicitly
      hedged inference to the functional consequence that has not been measured.
notes: >-
  On the treatments block. An earlier version of this entry omitted one, on the
  grounds that rehabilitative care is generic convention rather than SCA23
  evidence. That reasoning was half right and is now recorded rather than acted
  on: there is still no disease-modifying therapy for SCA23 and none has been
  trialled — the SCA treatment literature says plainly that no symptomatic or
  neuroprotective treatment is FDA-approved for any SCA — but one SCA23 patient
  was in fact referred to multidisciplinary rehabilitation for gait and
  dysphagia, which is a reported intervention and is now curated as one. Its
  target_mechanisms link is deliberately drawn to the clinical endpoint with
  MODULATES, not to any mechanistic node, and no outcome is claimed because none
  is reported. The mouse-model authors' proposal that lowering the elevated
  mutant peptide could be explored therapeutically stays in the animal-model
  section as a proposal, not a treatment.

  Phenotype scope. The phenotypes curated here are those evidenced in SCA23
  patients specifically. Several manifestations attributed to SCA23 in review
  and database sources — decreased vibratory sense, peripheral neuropathy,
  ocular dysmetria, Babinski sign, falls — are deliberately NOT curated, because
  the sources that name them describe the spinocerebellar ataxias as a class
  (PMID:33175256, PMID:23108490) or are OMIM/Orphanet summaries, and the one
  SCA23 series with a per-patient examination table records Babinski sign as
  absent in all five patients and sensory deficits as absent in all four assessed.
  Curating them from class-level text would assert of SCA23 something one of its
  few primary sources contradicts. Dysarthria is the single class-level phenotype
  retained, marked PARTIAL and explained on the entry itself.

  An attempt was made to ground those manifestations properly by citing
  Orphanet's own phenotype table (ORPHA:101108, which the deep-research report
  named as their source). It was abandoned: `just refresh-orphadata` failed a
  sha256 check on en_product1.xml — Orphadata has published a release newer than
  the one pinned in `data/orphadata/MANIFEST.yaml` — and the recipe aborts before
  fetching en_product4.xml, which is the file that carries phenotypes. A cache
  file built in that state contains definitions and cross-references but no
  phenotype table, and would have been derived from an unpinned snapshot, so it
  was discarded rather than committed. The manifest drift is a repository-level
  issue, not one this entry should work around.

  Module conformance. Three nodes conform to `cerebellar_purkinje_degeneration`
  — the trigger insult, Purkinje neuron degeneration, and the cerebellar ataxia
  endpoint. The module's `#Purkinje Cell Calcium and Proteostasis Dysregulation`
  amplifier is deliberately NOT claimed, on narrower grounds than an earlier
  draft of this entry stated. That draft said no calcium-handling measurement
  has been made in SCA23; PMID:33043513 reports altered expression of several
  critical Ca2+ channel subunits in the R212W mouse, so that was too broad. What
  is true, and what the non-conformance rests on, is that no calcium *transient*,
  buffering or store-release measurement has been reported — the authors state
  only that the expression change is "potentially contributing to altered Ca2+
  transients" — and that nothing bearing on protein quality control has been
  measured at all. NMDA-mediated excitotoxicity implying calcium entry remains an
  inference rather than a measurement in this disease. The gap and the experiment
  that would close it are recorded as the `calcium_handling_in_sca23` discussion
  rather than left as prose.

  The gene-disease relationship is contested. The description, the genetic
  notes, the diagnosis entry and a dedicated CONTROVERSY discussion all say so,
  because a reader who takes only one of those sections away should still know
  it. The two 2016 Brain correspondence pieces that constitute the challenge
  and the reply are listed in `references:` but cache as metadata only with no
  abstract body, so nothing is quoted from them and their specific arguments are
  not asserted here.

  No `datasets:` block: no disease-specific dataset was identified.

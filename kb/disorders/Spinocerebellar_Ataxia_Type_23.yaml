  - reference: PMID:21035104
    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PDYN is the precursor protein for the opioid neuropeptides, α-neoendorphin, and dynorphins A and B (Dyn A and B)."
    explanation: >-
      Establishes what the gene encodes, which is what makes this disorder
      mechanistically unusual among the ataxias.
  - reference: PMID:26169942

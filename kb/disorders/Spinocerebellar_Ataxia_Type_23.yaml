- name: Purkinje Cell Degeneration and Climbing Fibre Retraction
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >-
    The tissue-level lesion. In the R212W mouse the elevated mutant peptide is
    accompanied by climbing fibre retraction and Purkinje cell loss on
    immunohistochemistry, together with transcriptional dysregulation of
    ionotropic and metabotropic glutamate receptors and glutamate transporters
    and altered neuronal excitability — which ties the receptor-level mechanism
    above to the cellular one. This entry does not declare conformance to the
    module's Purkinje calcium and proteostasis node, and the reason needs stating
    precisely rather than as a blanket absence of evidence. PMID:33043513 did
    measure something calcium-adjacent in the R212W mouse: altered *expression*
    of several critical Ca2+ channel subunits. What it did not do is measure
    calcium handling — the authors themselves write only that this is
    "potentially contributing to altered Ca2+ transients", with no transient,
    buffering, or store-release measurement reported. Nothing bearing on protein
    quality control has been measured at all, in mouse or in human tissue.
    Expression of a channel subunit is not a measurement of the dysregulated
    calcium handling that amplifier node asserts, so the conformance stays
    unclaimed — but as a specific gap, with a named experiment that would close
    it (see the calcium_handling_in_sca23 discussion).

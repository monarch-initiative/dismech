  - reference: PMID:21035104
    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fourth mutation was located in the nonopioid PDYN domain and was associated with altered expression of components of the opioid and glutamate system, as evident from analysis of SCA23 autopsy tissue."
    explanation: >-
      Documents the non-opioid-domain variant and the autopsy finding, which is
      the only human tissue evidence in the original report.
  downstream:
  - target: Altered Dynorphin A Secondary Structure
    causal_link_type: DIRECT
    description: >-
      The substitutions disrupt the peptide's fold.
    evidence:
    - reference: PMID:27260403
      reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that SCA23 mutations in the Dyn A-coding region disrupted peptide secondary structure leading to a loss of the N-terminal α-helix"
      explanation: >-
        Direct structural measurement linking the variants to the fold change.
- name: Altered Dynorphin A Secondary Structure
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Loss of the peptide's N-terminal alpha-helix is the pivot of the whole
    mechanism, because it does two things at once. It lowers kappa-opioid
    receptor affinity, removing the peptide's normal signalling identity; and,
    for the R6W and R9C variants, it confers marked degradation resistance and
    reduced solubility, so the peptide persists. Not every variant behaves this
    way — L5S showed increased degradation and no aggregation — which is
    curated here because it bears directly on whether all reported variants
    share a mechanism.
  molecular_functions:
  - preferred_term: kappa-type opioid receptor binding
    term:
      id: GO:0031851
      label: kappa-type opioid receptor binding
    modifier: DECREASED
  evidence:
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "disrupted peptide secondary structure leading to a loss of the N-terminal α-helix associated with decreased κ-opioid receptor affinity"
    explanation: >-
      Links the structural change to the loss of opioid receptor affinity.
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the altered secondary structure led to increased peptide stability of R6W and R9C Dyn A, as these peptides showed marked degradation resistance, which coincided with decreased peptide solubility. Notably, L5S Dyn A displayed increased degradation and no aggregation."
    explanation: >-
      Establishes both the degradation resistance of two variants and the
      explicit exception, which is why this entry does not claim a uniform
      mechanism across alleles.
  downstream:
  - target: Persistent Elevation of Mutant Dynorphin A
    causal_link_type: DIRECT
    description: >-
      A peptide that resists degradation accumulates.
    evidence:
    - reference: PMID:21035104
      reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Two of these mutations resulted in excessive generation of Dyn A in a cellular model system."
      explanation: >-
        The original cellular demonstration that mutant peptide levels rise.
- name: Persistent Elevation of Mutant Dynorphin A
  biological_scale: MOLECULAR
  description: >-
    Dynorphin A is normally a transient signal. When it persists, it becomes
    toxic — a property of the wild-type peptide at sustained concentration, not
    only of the mutants. The mouse model carrying the R212W allele shows
    markedly elevated mutant dynorphin A in the cerebellum, which is the in vivo
    confirmation that the cellular observation translates.
  biological_processes:
  - preferred_term: neuropeptide signaling pathway
    term:
      id: GO:0007218
      label: neuropeptide signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased concentration of or prolonged exposure to Dyn A is neurotoxic"
    explanation: >-
      States that it is the persistence and concentration, rather than the
      mutation per se, that makes the peptide toxic.
  - reference: PMID:26169942
    reference_title: "Elevated mutant dynorphin A causes Purkinje cell loss and motor dysfunction in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of peptide levels using a radioimmunoassay shows that these PDYN(R212W) mice display markedly elevated levels of mutant dynorphin A"
    explanation: >-
      In vivo measurement of the elevated peptide in the model that reproduces
      the disease.
  downstream:
  - target: Switch from Opioid to NMDA Receptor Signalling
    causal_link_type: DIRECT
    description: >-
      A peptide with lost opioid affinity but sustained presence engages a
      different receptor system.
    evidence:
    - reference: PMID:27260403
      reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "For R6W Dyn A, this is likely because of a switch from opioid to NMDA- receptor signalling, while for wt Dyn A, this switch was not observed."
      explanation: >-
        The receptor switch, quoted with the authors' hedge and with the
        wild-type control result that makes it variant-specific.
- name: Switch from Opioid to NMDA Receptor Signalling
  biological_scale: MOLECULAR
  description: >-
    Dynorphin A peptides bind NMDA receptors and potentiate their
    glutamate-evoked currents, a long-recognized non-opioid action. In SCA23 the
    proposal is that the mutant peptide's loss of kappa-opioid affinity leaves
    this NMDA action unopposed, so the same molecule that should have been
    neuroprotective becomes excitotoxic. The reporting authors frame the
    pathology as a convergence of the two, not as either alone.
  molecular_functions:
  - preferred_term: NMDA glutamate receptor activity
    term:
      id: GO:0004972
      label: NMDA glutamate receptor activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: glutamate receptor signaling pathway
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these deleterious effects are very likely caused by an N-methyl-d-aspartate-mediated non-opioid mechanism as Dyn A peptides were shown to bind NMDA receptors and potentiate their glutamate-evoked currents"
    explanation: >-
      Establishes the NMDA mechanism and its molecular basis, with the authors'
      hedge preserved.
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We propose that the pathology of SCA23 results from converging mechanisms of loss of opioid-mediated neuroprotection and NMDA-mediated excitotoxicity."
    explanation: >-
      Classified PARTIAL because the authors present the convergence as a
      proposal. It is the framing this entry's two-arm node adopts, and the
      hedge is preserved rather than upgraded.
  downstream:
  - target: Purkinje Cell Degeneration and Climbing Fibre Retraction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Excitotoxic signalling in the cerebellum is proposed as the route to
      Purkinje cell loss; the intervening steps are not established.
    evidence:
    - reference: PMID:21035104
      reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "alterations in Dyn A activities and/or impairment of secretory pathways by mutant PDYN may lead to glutamate neurotoxicity, which underlies Purkinje cell degeneration and ataxia"
      explanation: >-
        Classified PARTIAL: the original authors state this as a possibility
        ("may lead to") and offer two alternative proximal routes, one of which
        — impaired secretory pathways — this entry does not curate as a separate
        node because it has not been followed up.
- name: Purkinje Cell Degeneration and Climbing Fibre Retraction
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >-
    The tissue-level lesion. In the R212W mouse the elevated mutant peptide is
    accompanied by climbing fibre retraction and Purkinje cell loss on
    immunohistochemistry, together with transcriptional dysregulation of
    ionotropic and metabotropic glutamate receptors and glutamate transporters
    and altered neuronal excitability — which ties the receptor-level mechanism
    above to the cellular one. This entry does not declare conformance to the
    module's Purkinje calcium and proteostasis node: no calcium-handling or
    protein-quality-control measurement has been made in SCA23, and asserting
    that amplifier would go beyond the evidence.
  cell_types:

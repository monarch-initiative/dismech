- name: Switch from Opioid to NMDA Receptor Signalling
  biological_scale: MOLECULAR
  description: >-
    Dynorphin A peptides bind NMDA receptors and potentiate their
    glutamate-evoked currents, a long-recognized non-opioid action. In SCA23 the
    proposal is that the mutant peptide's loss of kappa-opioid affinity leaves
    this NMDA action unopposed, so the same molecule that should have been
    neuroprotective becomes excitotoxic. The reporting authors frame the
    pathology as a convergence of the two, not as either alone.
  molecular_functions:
  - preferred_term: NMDA glutamate receptor activity
    term:

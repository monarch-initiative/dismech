- name: Altered Dynorphin A Secondary Structure
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Loss of the peptide's N-terminal alpha-helix is the pivot of the whole
    mechanism, because it does two things at once. It lowers kappa-opioid
    receptor affinity, removing the peptide's normal signalling identity; and,
    for the R6W and R9C variants, it confers marked degradation resistance and
    reduced solubility, so the peptide persists. Not every variant behaves this
    way — L5S showed increased degradation and no aggregation — which is
    curated here because it bears directly on whether all reported variants
    share a mechanism.
  molecular_functions:
  - preferred_term: kappa-type opioid receptor binding
    term:
      id: GO:0031851
      label: kappa-type opioid receptor binding
    modifier: DECREASED
  evidence:
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "disrupted peptide secondary structure leading to a loss of the N-terminal α-helix associated with decreased κ-opioid receptor affinity"
    explanation: >-
      Links the structural change to the loss of opioid receptor affinity.
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the altered secondary structure led to increased peptide stability of R6W and R9C Dyn A, as these peptides showed marked degradation resistance, which coincided with decreased peptide solubility. Notably, L5S Dyn A displayed increased degradation and no aggregation."
    explanation: >-
      Establishes both the degradation resistance of two variants and the
      explicit exception, which is why this entry does not claim a uniform
      mechanism across alleles.
  - reference: PMID:34944698
    reference_title: "Functional Characterization of Spinocerebellar Ataxia Associated Dynorphin A Mutant Peptides."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DynA mutations, associated with a severe ataxic phenotype, decrease potency of KOR activation, both for G-protein dissociation as well as β-arrestin recruitment"
    explanation: >-
      Independent confirmation that the DECREASED modifier on kappa-opioid
      receptor binding has a functional consequence, and one that goes further
      than binding affinity: potency falls for both downstream branches of KOR
      signalling, G-protein and beta-arrestin alike. Note the qualifier the
      authors attach — the mutants tested were those associated with a severe
      ataxic phenotype, so this is not a blanket claim about every reported
      allele.
  - reference: PMID:34944698
    reference_title: "Functional Characterization of Spinocerebellar Ataxia Associated Dynorphin A Mutant Peptides."
    supports: PARTIAL

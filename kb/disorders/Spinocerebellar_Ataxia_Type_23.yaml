    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinocerebellar ataxias (SCAs) are dominantly inherited neurodegenerative disorders characterized by progressive cerebellar ataxia and dysarthria. We have identified missense mutations in prodynorphin (PDYN) that cause SCA23 in four Dutch families displaying progressive gait and limb ataxia."
    explanation: >-
      Establishes dominant inheritance and the four-family basis of the original
      gene assignment.
pathophysiology:
- name: PDYN Missense Variant in the Dynorphin A Coding Region
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >-
    PDYN encodes the precursor of alpha-neoendorphin and dynorphins A and B.
    The reported SCA23 variants cluster in the dynorphin A coding region, which
    the mouse-model authors describe as a likely mutational hotspot; a further
    variant sits in the non-opioid domain of the precursor. This is the
    disorder-specific substitution this entry makes against the conserved
    Purkinje-degeneration module, whose trigger node is deliberately generic
    about the molecular lesion.

- name: Persistent Elevation of Mutant Dynorphin A
  biological_scale: MOLECULAR
  description: >-
    Dynorphin A is normally a transient signal. When it persists, it becomes
    toxic — a property of the wild-type peptide at sustained concentration, not
    only of the mutants. The mouse model carrying the R212W allele shows
    markedly elevated mutant dynorphin A in the cerebellum, which is the in vivo
    confirmation that the cellular observation translates.

      of symptom severity.
- name: Hyperreflexia
  category: Neurologic
  description: >-
    Increased deep tendon reflexes are documented in three of the five patients
    of the Japanese families, in the lower limbs or in all four. This is a
    pyramidal sign in what the founding report called an isolated cerebellar
    syndrome, and the original Dutch family was likewise described as having a
    pure cerebellar syndrome "with hyper-reflexia". Not universal: one patient in
    the same series had decreased reflexes instead.
  phenotype_term:
    preferred_term: Hyperreflexia
    term:
      id: HP:0001347
      label: Hyperreflexia
  evidence:
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A neurological examination revealed saccadic eye movements, scanning speech, hyperreflexia of all limbs, and parkinsonism such as bradykinesia, rigidity, frozen gait, and a resting tremor affecting both hands (R > L)."
    explanation: >-
      Four-limb hyperreflexia on examination in the proband.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A later neurological examination at 52 years-of-age revealed a cerebellar tremor and hyper-reflexia of the lower limbs."
    explanation: >-
      A second affected sibling, with the lower-limb-restricted pattern.
- name: Tremor
  category: Neurologic
  description: >-
    Tremor is reported in two forms in the same series and they should not be
    conflated: a cerebellar (action) tremor of the hands in two patients, and a
    resting tremor in the one patient who also had parkinsonism. No frequency
    band — the total described population is a handful of families.
  phenotype_term:
    preferred_term: Cerebellar tremor
    term:
      id: HP:0001337
      label: Tremor
  evidence:
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A detailed neurological examination at 60 years-of-age revealed mild dysarthria, horizontal nystagmus, a cerebellar tremor affecting both hands, decreased deep tendon reflex without muscle atrophy or sensory disturbance."
    explanation: >-
      Cerebellar tremor of both hands, in the proband of the second family.
- name: Nystagmus
  category: Neurologic
  description: >-
    Horizontal nystagmus, documented in one patient of the Japanese series.
    Oculomotor involvement in SCA23 is heterogeneous rather than stereotyped:
    a different patient in the same series had saccadic eye movements and no
    nystagmus, and two others had no eye movement disorder at all.
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  evidence:
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A detailed neurological examination at 60 years-of-age revealed mild dysarthria, horizontal nystagmus, a cerebellar tremor affecting both hands, decreased deep tendon reflex without muscle atrophy or sensory disturbance."
    explanation: >-
      The single documented instance, with its horizontal direction.
- name: Abnormal saccadic eye movements
  category: Neurologic
  description: >-
    Saccadic eye movements on examination in the proband of the first Japanese
    family. Bound to the parent term rather than to a directional child
    (hypometric, slow, dysmetric): the source records "saccadic eye movements"
    without specifying which abnormality, and choosing a child term would assert
    a finding it does not report.
  phenotype_term:
    preferred_term: Saccadic eye movements
    term:
      id: HP:0000570
      label: Abnormal saccadic eye movements
  evidence:
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A neurological examination revealed saccadic eye movements, scanning speech, hyperreflexia of all limbs, and parkinsonism such as bradykinesia, rigidity, frozen gait, and a resting tremor affecting both hands (R > L)."
    explanation: >-
      The examination finding, quoted with the surrounding signs that were
      recorded at the same time.
- name: Parkinsonism
  category: Neurologic
  description: >-
    One patient presented with bradykinesia, rigidity, frozen gait and a resting
    tremor, was investigated as MSA with predominant parkinsonism before the
    genetic diagnosis, and had severe bilateral nigrostriatal dopaminergic
    deficits on DAT-SPECT with only a slight levodopa response. This is the
    single most consequential atypical presentation of SCA23, because it sends
    the diagnosis somewhere else entirely — see the MSA differential.
  phenotype_term:
    preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  evidence:
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A neurological examination revealed saccadic eye movements, scanning speech, hyperreflexia of all limbs, and parkinsonism such as bradykinesia, rigidity, frozen gait, and a resting tremor affecting both hands (R > L)."
    explanation: >-
      The parkinsonian syndrome as examined, with its components named.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proband showed clinical and neuroimaging features suggestive of multiple system atrophy with predominant parkinsonism (MSA-P)"
    explanation: >-
      Records that the presentation was read as MSA-P, which is what makes this
      phenotype diagnostically significant rather than merely additional.
- name: Dysphagia
  category: Neurologic
  description: >-
    Dysphagia is reported in a 2026 Brazilian case with unusually early onset,
    where it was prominent enough to be a target of the rehabilitation referral.
    It is not documented in the Dutch or Japanese series, so it is curated as an
    occasional feature of advancing disease rather than a core one.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: DOI:10.1007/s12311-026-02001-6
    reference_title: "Spinocerebellar Ataxia Type 23 (SCA23): A Rare Cause of SCA in the Americas"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by progressive dysarthria, tremor, dysphagia, and gait disturbance"
    explanation: >-
      The presenting features of the reported case. Note that `DOI:` is in the
      reference validator's skip_prefixes, so this snippet is not
      machine-verified the way the PMID snippets in this entry are; it was
      checked by hand against the cached record.
genetic:
- name: PDYN
  gene_term:
    preferred_term: PDYN
    term:
      id: hgnc:8820
      label: PDYN
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    PDYN is the only gene proposed for SCA23. Reported variants are missense,
    concentrated in the dynorphin A coding region with one in the non-opioid
    domain of the precursor. Functional characterization is variant-specific
    rather than uniform: R6W and R9C show degradation resistance and reduced
    solubility, R6W shows the opioid-to-NMDA receptor switch, and L5S behaves
    oppositely with increased degradation and no aggregation. That heterogeneity
    matters for interpretation, because it means a PDYN missense variant cannot
    be assumed to act by the R6W mechanism. The gene-disease relationship itself
    has been formally challenged — see the controversy_pdyn_gene_validity
    discussion — so variant-level segregation and functional evidence should be
    weighed individually rather than assumed from the gene assignment.

    Variant class and distribution. Eight disease-causing PDYN variants were
    recognized by 2020, six of them lying within the Dyn A and Dyn B coding
    region — residues 207 to 236, the stretch that forms "big dynorphin" — which
    is what concentrates functional interpretation on that peptide.

    Penetrance is incomplete or age-dependent, and this is not a footnote: in one
    Japanese family the parents of three affected siblings showed no cerebellar
    signs into their eighth and ninth decades, while their children were affected
    in young adult life. The mother nonetheless had moderate cerebellar atrophy on
    MRI at 88 with no subjective complaint. A negative examination in a parent
    therefore does not exclude carriage, and an asymptomatic carrier may still be
    structurally affected.

    Zygosity has a dosage effect. The same family included one homozygote for
    p.R215H, whose onset was earlier and whose ataxia was the most severe of the
    five. The reporting authors are careful about what this does and does not
    show: it does not adjudicate between the toxic-gain-of-function and
    loss-of-function models, but it does indicate that dosage — of the variant or
    of the normal protein — tracks clinical severity.
  evidence:
  - reference: PMID:21035104
    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified missense mutations in prodynorphin (PDYN) that cause SCA23 in four Dutch families displaying progressive gait and limb ataxia."
    explanation: >-
      The gene-discovery statement and the number of families it rests on.
  - reference: PMID:21035104
    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three mutations were located in Dyn A, a peptide with both opioid activities and nonopioid neurodegenerative actions."
    explanation: >-
      Establishes the distribution of variants and, in passing, the dual opioid
      and non-opioid character of the peptide that the mechanism turns on.
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R6W and wt Dyn A peptides were most toxic to primary cerebellar neurons."
    explanation: >-
      A variant-specific toxicity result, and one that complicates the picture:
      wild-type peptide was among the most toxic in this assay, which is why
      this entry frames toxicity as concentration- and persistence-dependent
      rather than as a simple property of mutancy.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since its discovery, eight SCA23 disease-causing variants in PDYN have been identified, six of which lie exclusively within the PDYN Dyn A and Dyn B encoding regions (amino acid residues 207"
    explanation: >-
      The variant count and their concentration in the big-dynorphin coding
      region. Quoted to the residue number rather than through it, because the
      en-dash in the printed range does not survive quoting cleanly.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The low penetrance rate for PDYN variants might have contributed to the marked intrafamilial variation observed in this family."
    explanation: >-
      Classified PARTIAL and quoted with its "might": the authors offer low
      penetrance as one of two explanations for the intrafamilial variation, the
      other being anticipation. Neither is demonstrated, and the entry does not
      pick between them.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age of onset for the homozygous patient (II-4) was a little younger than that for the heterozygous patients, and the ataxic symptoms were the most severe."
    explanation: >-
      The homozygote-versus-heterozygote comparison within one family, which is
      the dosage observation.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "it might suggest that the dosage effect of the variant or normal PDYN proteins is directly associated with the clinical severity of SCA23"
    explanation: >-
      The authors' own reading of that comparison, quoted with its hedge and
      with the ambiguity they leave open — variant dosage or normal-protein
      dosage — intact.
prevalence:
- population: Netherlands
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The original report estimated SCA23 at about 0.5% of ataxia families in the
    Netherlands, which is a share of a disease population rather than a
    population prevalence and is recorded as such. Cases outside the founding
    Dutch cohort are individually reported, including a first Japanese family.
    Any count here should be read against the gene-validity controversy: if some
    reported variants are not causal, the true number is smaller.
  evidence:
  - reference: PMID:21035104
    reference_title: "Prodynorphin mutations cause the neurodegenerative disorder spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PDYN mutations are identified in a small subset of ataxia families, indicating that SCA23 is an infrequent SCA type (∼0.5%) in the Netherlands"
    explanation: >-
      The source of the 0.5% figure and its explicit framing as a share of
      ataxia families in one country.
- population: United Kingdom, Greece, Egypt and India ataxia series
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    An independent screen of 852 ataxia patients found PDYN variants in about
    0.1% of cases — a fifth of the Dutch figure, and a useful corrective, since
    the 0.5% estimate came from the population in which the gene was discovered.
    The authors note the yield may be higher in pure cerebellar ataxia
    specifically. As with the Dutch figure this is a share of an ataxia
    population, not a population prevalence.
  evidence:
  - reference: PMID:23108490
    reference_title: "The frequency of spinocerebellar ataxia type 23 in a UK population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirms that PDYN mutations are a very rare cause of spinocerebellar ataxia, accounting for ~ 0.1 % of ataxia cases but perhaps with a higher frequency in pure cerebellar ataxia"
    explanation: >-
      The 0.1% figure with the authors' own qualification about pure cerebellar
      ataxia.
  - reference: PMID:23108490
    reference_title: "The frequency of spinocerebellar ataxia type 23 in a UK population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced the coding and flanking intronic regions of the PDYN gene in a total of 852 ataxia patients"
    explanation: >-
      The denominator behind that figure.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2020 count put the total confirmed worldwide at twenty patients. Read
    alongside the gene-validity controversy this is an upper bound rather than a
    settled number.
  evidence:
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only 20 patients worldwide, including two Japanese patients in the same family, have been confirmed to carry disease-causing PDYN variants to date"
    explanation: >-
      An explicit worldwide count at a stated point in time.
progression:
- phase: Adult onset and slow progression
  notes: >-
    Onset is in adult life with slowly progressive gait and limb ataxia. The
    animal model reproduces the temporal pattern in miniature, with gait
    deficits from three months and declining motor coordination by twelve.
  evidence:
  - reference: PMID:26169942
    reference_title: "Elevated mutant dynorphin A causes Purkinje cell loss and motor dysfunction in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "with gait deficits starting at 3 months of age revealed by footprint pattern analysis, and progressive loss of motor coordination and balance at the age of 12 months"
    explanation: >-
      The progressive time course in the model. Evidence source is
      MODEL_ORGANISM; the human time course is described in prose because the
      original report does not state ages in its abstract.
histopathology:
- name: Neuronal loss in Purkinje cell layer, dentate nuclei and inferior olives
  diagnostic: false
  description: >-
    The human neuropathology, from autopsy of one affected member of the
    founding Dutch family. Neuronal loss is not confined to Purkinje cells: it
    involves the dentate nuclei and the inferior olives as well — that is, all
    three elements of the olivo-cerebellar circuit whose climbing-fibre arm the
    pathograph models. This is the direct human counterpart of the Purkinje cell
    loss demonstrated in the mouse, and the reason the degeneration node is not
    curated on model evidence alone.

    No `finding_term` is bound, and the reason is the enum rather than the
    ontologies. `HistopathologyFindingTerm` is reachable only from the NCIT
    Histopathology Result branch (NCIT:C83490) plus a handful of HP rosette
    terms. HP:0002529 Neuronal loss in central nervous system names this finding
    exactly but is not a member, and NCIT's Histopathology Result branch has no
    neuronal-loss morphologic finding — searching it returns disease entities,
    not findings. Rather than bind something broader that would mean less, the
    finding is carried by `name` and `description`. Note this is n = 1: one
    autopsy from one family, reported before PDYN was identified.
  evidence:
  - reference: PMID:15306549
    reference_title: "Mapping of the SCA23 locus involved in autosomal dominant cerebellar ataxia to chromosome region 20p13-12.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuropathological examination in one affected subject showed neuronal loss in the Purkinje cell layer, dentate nuclei and inferior olives, thinning of cerebellopontine tracts, demyelination of posterior and lateral columns in the spinal cord, as well as ubiquitin-positive intranuclear inclusions in nigral neurons that were considered to be Marinesco bodies"
    explanation: >-
      The original autopsy description, quoted whole because the entry curates
      three separate findings out of it and the reader should see they come from
      one observation in one subject.
  - reference: PMID:19089525
    reference_title: "Spinocerebellar ataxia type 23: a genetic update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuropathological examination revealed neuronal loss in the Purkinje cell layer, dentate nuclei, and inferior olives."
    explanation: >-
      The later review restating the same finding. Cited as corroboration of the
      record, not as an independent observation — it describes the same autopsy.
- name: Demyelination of the spinal cord posterior and lateral columns
  diagnostic: false
  description: >-
    Spinal cord involvement in the same autopsy, in the posterior (dorsal) and
    lateral columns. This is the anatomical substrate that would account for the
    pyramidal signs — the hyperreflexia curated above — in a disorder otherwise
    described as a pure cerebellar syndrome, and it is why "spinocerebellar"
    rather than "cerebellar" is the right word for this disease.

    Unbound for the same enum reason as the finding above: NCIT:C117277
    Demyelination exists but is not reachable from the Histopathology Result
    branch, so it fails `HistopathologyFindingTerm`. On the HP side,
    HP:0008311 Spinal cord dorsal column hypomyelination names a developmental
    failure to myelinate rather than the demyelination reported here, and covers
    only one of the two involved column systems — it would assert the wrong
    thing even if it were a member.
  evidence:
  - reference: PMID:15306549
    reference_title: "Mapping of the SCA23 locus involved in autosomal dominant cerebellar ataxia to chromosome region 20p13-12.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demyelination of posterior and lateral columns in the spinal cord"
    explanation: >-
      The spinal cord finding, naming both involved column systems.
- name: Ubiquitin-positive intranuclear inclusions in nigral neurons
  diagnostic: false
  description: >-
    Curated as a documented negative, because it is the kind of finding that
    gets propagated as disease pathology once it appears in a table. The same
    autopsy showed ubiquitin-positive intranuclear inclusions in substantia
    nigra neurons — and the reporting neuropathologists judged them to be
    Marinesco bodies, an age-related incidental finding of the nigral neuron,
    not SCA23 pathology.

    No `finding_term` is bound. Binding an inclusion-body term would assert the
    disease-associated reading the source explicitly declines. This entry does
    not claim intranuclear inclusions as a feature of SCA23; it records that
    they were seen and were interpreted as incidental.
  evidence:
  - reference: PMID:15306549
    reference_title: "Mapping of the SCA23 locus involved in autosomal dominant cerebellar ataxia to chromosome region 20p13-12.3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "ubiquitin-positive intranuclear inclusions in nigral neurons that were considered to be Marinesco bodies"
    explanation: >-
      Classified PARTIAL: the observation is supported, the disease-pathology
      interpretation is explicitly rejected in the same clause by the people who
      made it.

diagnosis:
- name: PDYN sequencing with variant-level functional assessment
  description: >-
    Diagnosis is by sequencing, but the gene assignment's contested status makes
    a bare variant call insufficient. Because functional behaviour differs
    between reported variants, and because the gene-disease relationship has
    been formally questioned, segregation data and functional evidence — peptide
    stability, kappa-opioid receptor signalling, cerebellar neuron toxicity —
    carry more weight here than a classification derived from the gene's
    reputation.
  evidence:
  - reference: PMID:27260403
    reference_title: "Altered secondary structure of Dynorphin A associates with loss of opioid signalling and NMDA-mediated excitotoxicity in SCA23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, L5S Dyn A displayed increased degradation and no aggregation."
    explanation: >-
      The clearest single demonstration that reported SCA23 variants do not
      share one functional behaviour, which is the argument for assessing them
      individually.
- name: Position in the ataxia testing sequence
  description: >-
    Where SCA23 belongs in a diagnostic workup, which is a question its rarity
    answers. A screen of 852 ataxia patients across four countries found PDYN
    variants in about 0.1%, and its authors concluded that front-line evaluation
    should go to other ataxia genes first. In practice the reported patients were
    found the same way: common repeat expansions excluded, then a panel or exome.
    The corollary matters for a treatable-looking differential — a negative
    standard ataxia panel does not exclude SCA23, because PDYN is not always on
    one.
  evidence:
  - reference: PMID:23108490
    reference_title: "The frequency of spinocerebellar ataxia type 23 in a UK population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "front-line diagnostic evaluation of UK familial and early onset pure spinocerebellar ataxia patients should focus on other known ataxia genes"
    explanation: >-
      The explicit recommendation about testing order, from the largest screen
      published.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening for common repeat expansions for ADCAs (SCA1, SCA2, MJD/SCA3, SCA6, SCA7, SCA8, SCA12, SCA17, and DRPLA) and SCA31 was negative for the proband in each family"
    explanation: >-
      The route by which two families actually reached the diagnosis, naming the
      expansions excluded first.
differential_diagnoses:
- name: Multiple system atrophy, parkinsonian type (MSA-P)
  description: >-
    The differential that actually misdirects diagnosis. One reported SCA23
    patient was investigated as MSA-P: bradykinesia, rigidity, frozen gait and
    resting tremor, a hyperintense lateral putaminal rim on MRI, and severe
    bilateral nigrostriatal dopaminergic deficits on DAT-SPECT. What excluded MSA
    was the absence of autonomic failure — no urinary dysfunction, no orthostatic
    hypotension — so the consensus criteria were not met.

    Two imaging features do the discriminating work in the other direction: the
    hot cross bun sign and middle cerebellar peduncle hyperintensity, both
    characteristic of MSA-C, were absent in every reported SCA23 patient. A prior
    Japanese case is the exception that proves how much overlap is possible — it
    had both a hot cross bun sign and a putaminal rim.

    The practical consequence: a family history is the discriminator that survives
    when imaging does not, and a sporadic-appearing SCA23 patient (incomplete
    penetrance makes those possible) can look like MSA on every axis examined.
  evidence:
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because this patient had no urinary dysfunction (incontinence, urgency, or incomplete bladder emptying) or orthostatic hypotension, he did not fulfill the second consensus criteria of probable or possible MSA"
    explanation: >-
      The specific negatives that excluded MSA in a patient who otherwise
      resembled it.
  - reference: PMID:32587707
    reference_title: "Intrafamilial phenotypic variation in spinocerebellar ataxia type 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our cases suggest that the existence of a phenotypic overlap between SCA23 and MSA, both clinically and neuroradiologically"
    explanation: >-
      The authors' own conclusion that the overlap is real on both clinical and
      imaging axes.
treatments:
- name: Multidisciplinary Rehabilitation
  description: >-
    There is no disease-modifying therapy for SCA23 and none has been trialled in
    it. Rehabilitation is curated here — rather than omitted as generic
    convention, which an earlier version of this entry did — because it is the
    only intervention actually reported for an SCA23 patient: the 2026 Brazilian
    case was referred to a multidisciplinary rehabilitation group with emphasis
    on gait and dysphagia. The content of that care (physical, respiratory,
    speech, voice, swallowing and occupational therapy) is evidenced from the
    ataxia rehabilitation literature, not from SCA23 specifically, and its stated
    objective there is quality of life rather than altering the disease course.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Progressive Cerebellar Ataxia
    treatment_effect: MODULATES
    description: >-
      Rehabilitation acts on function at the level of the clinical endpoint. It
      does not touch the peptide, the receptor switch, or the Purkinje cell, and
      the entry does not draw an edge suggesting it does.
    evidence:
    - reference: PMID:35239817
      reference_title: "Rehabilitation in patients with cerebellar ataxias."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "The current treatment of patients with cerebellar ataxias, especially neurodegenerative forms, genetic or not, should include these different forms of rehabilitation, with the main objective of improving the quality of life of patients."
      explanation: >-
        Names the objective — quality of life — which is what fixes this link at
        MODULATES on the clinical endpoint rather than anything mechanistic.
        PARTIAL and evidence_source OTHER: this is a narrative review's
        recommendation about cerebellar ataxias as a class, not a trial result
        and not about SCA23.
  evidence:
  - reference: PMID:35239817
    reference_title: "Rehabilitation in patients with cerebellar ataxias."
    supports: PARTIAL
    evidence_source: OTHER

- name: Neuronal and endothelial mitochondrial dysfunction
  biological_scale: CELLULAR
  description: >-
    CMPK2 loss of function depletes mitochondrial DNA and mitochondrial protein
    in neurons and vascular endothelial cells, two brain cell types with high
    energy expenditure, lowering ATP production, distorting cristae
    architecture, and raising intracellular inorganic phosphate. This is a third
    initiating axis in this disease, alongside the phosphate transporters and the
    neurovascular-unit genes, and it converges on the same deposition step.

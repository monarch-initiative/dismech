      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: ATP biosynthetic process
    term:
      id: GO:0006754
      label: ATP biosynthetic process
    modifier: DECREASED
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: ABNORMAL
  locations:
  - preferred_term: basal ganglion
    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:36443312
    reference_title: "Loss of function of CMPK2 causes mitochondria deficiency and brain calcification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In situ hybridization and single-cell RNA sequencing revealed robust Cmpk2 expression in neurons and vascular endothelial cells (vECs), two cell types with high energy expenditure in the brain."
    explanation: >-
      The basis for the two cell types bound at this node, and for describing them
      as the high-energy-demand cells in which a mitochondrial defect would bite
      first.
  - reference: PMID:36443312
    reference_title: "Loss of function of CMPK2 causes mitochondria deficiency and brain calcification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The neurons in Cmpk2-knockout (KO) mice have fewer mitochondrial DNA copies, down-regulated mitochondrial proteins, reduced ATP production, and elevated intracellular inorganic phosphate (Pi) level, recapitulating the mitochondrial dysfunction observed in the PBMCs isolated from the FBC patients."
    explanation: >-
      Supports the decreased ATP biosynthesis bound here, and the elevated
      intracellular phosphate that is this node's link to the deposition step.
  - reference: PMID:36443312
    reference_title: "Loss of function of CMPK2 causes mitochondria deficiency and brain calcification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morphologically, the cristae architecture of the Cmpk2-KO murine neurons was also impaired."
    explanation: >-
      Supports the abnormal mitochondrion organization bound here, as distinct from
      the separate quantitative loss of ATP output.
  - reference: PMID:37446066
    reference_title: "The Genetics of Primary Familial Brain Calcification: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The function of currently known genes suggests that PFBC could be caused by the dysfunction of the neurovascular unit, the dysregulation of phosphate homeostasis, or mitochondrial dysfunction."
    explanation: >-
      Independent review naming mitochondrial dysfunction as one of the three
      mechanisms of this disease, which is why it is modelled as its own node
      rather than folded into the phosphate-handling node.
  downstream:
  - target: Neurovascular calcium-phosphate deposition
    description: >-
      Failed mitochondrial energy metabolism with raised intracellular inorganic
      phosphate in high-demand neurons and vascular endothelial cells favours
      calcium-phosphate precipitation at the same deep-brain microvascular sites
      the transporter and neurovascular-unit lesions act on.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36443312
      reference_title: "Loss of function of CMPK2 causes mitochondria deficiency and brain calcification."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Notably, calcification developed in a progressive manner in the homozygous Cmpk2-KO mice thalamus region as well as in the Cmpk2-knock-in mice bearing the patient mutation, thus phenocopying the calcification pathology observed in the patients."
      explanation: >-
        Connects the mitochondrial lesion to deposition: removing or mutating
        Cmpk2 in mouse produces the calcification itself, not only the
        mitochondrial phenotype.

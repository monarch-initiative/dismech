notes: >-
  This entry is intentionally curated at the disease/root level for
  MONDO:0008947 rather than split into multiple premature gene-specific pages.
  The page captures the dominant and recessive BSPDC/PFBC spectrum in one
  place, with subtype heterogeneity documented under `has_subtypes` and
  gene-level heterogeneity documented under `genetic`. The current
  PMID-supported core gene set curated here is SLC20A2, XPR1, PDGFRB, PDGFB,
  MYORG, JAM2, NAA60, CMPK2, and RRP12. Secondary causes of basal ganglia
  calcification are outside scope for this disease-level entry.

  Each of those nine genes has its own numbered MONDO leaf below MONDO:0008947
  (`basal ganglia calcification, idiopathic, 1` and `4` through `11`), and each
  leaf is declared in `mappings.mondo_mappings` as a `skos:narrowMatch` rather
  than turned into a `has_subtypes` row. The reason is that a MONDO leaf here
  carries no clinical content of its own - its definition is just "any bilateral
  striopallidodentate calcinosis in which the cause is a mutation in <gene>" -
  so a subtype row per leaf would restate the `genetic:` section under a second
  heading. The two `has_subtypes` rows that do exist split the spectrum the way
  the literature does, by inheritance, which is the axis that carries a
  phenotype difference (heavier calcification burden in the recessive forms).
  Two further MONDO descendants of this term carry no causal-gene edge and so
  have nothing to curate genetically: MONDO:0007247 (`basal ganglia
  calcification, idiopathic, childhood-onset`, OMIM:114100, whose own MONDO
  definition reads "Not in the OMIM series."). The IBGC2 and IBGC3 designations
  are not separate terms at all: MONDO:0024538 carries `IBGC2` and `basal ganglia
  calcification, idiopathic, 2` as exact synonyms, the latter cross-referenced to
  the merged term MONDO:0011692, and `basal ganglia calcification, idiopathic, 3`
  as a related synonym cross-referenced to OMIM:213600, the same OMIM entry the
  IBGC1 leaf itself carries.

  The GeneReviews chapter `Primary Familial Brain Calcification Overview`
  (PMID:20301594) is tagged in `references:` as the mandatory baseline, but no
  evidence item quotes it: its PubMed record contains only the chapter's
  five-point statement of scope, with no clinical or genetic finding in it. The
  chapter text itself is served from an NCBI Bookshelf URL, and dismech#12747
  reports that those URLs were returning a bot-detection interstitial rather
  than chapter content around the time this entry was revised, so it was not
  fetched.
has_subtypes:
- name: Autosomal Dominant PFBC
  classification: inheritance
  description: >-
    Dominant BSPDC/PFBC is most often caused by pathogenic variants in SLC20A2,
    XPR1, PDGFRB, or PDGFB and shows age-dependent, variably expressive motor,
    cognitive, and neuropsychiatric disease.
  evidence:
  - reference: PMID:29955172
    reference_title: "Primary brain calcification: an international study reporting novel variants and associated phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is typically inherited as an autosomal-dominant trait with four causative genes identified so far: SLC20A2, PDGFRB, PDGFB, and XPR1."
    explanation: Defines the dominant PFBC subgroup and its core genes.
- name: Autosomal Recessive PFBC
  classification: inheritance
  description: >-
    Recessive BSPDC/PFBC includes MYORG-, JAM2-, NAA60- and CMPK2-associated
    disease and tends to have heavier calcification burden and more severe
    neurologic involvement than the dominant forms. RRP12 is a further recessive
    locus, reported biallelic in four families, that its founding authors
    describe as a candidate rather than as established; see the `RRP12`
    `genetic:` record.
  evidence:
  - reference: PMID:31851307
    reference_title: "Biallelic loss-of-function mutations in JAM2 cause primary familial brain calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with patients with autosomal dominant primary familial brain calcification, patients with the recessive form of the disease present with more severe clinical and imaging phenotypes, and deserve more clinical and research attention."
    explanation: Supports recessive PFBC as a clinically more severe subtype grouping.
  - reference: PMID:38480682
    reference_title: "Biallelic NAA60 variants with impaired n-terminal acetylation capacity cause autosomal recessive primary familial brain calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identify biallelic NAA60 variants in ten individuals from seven families with autosomal recessive PFBC."
    explanation: Confirms that autosomal recessive PFBC extends beyond MYORG and JAM2.
  - reference: PMID:37446066
    reference_title: "The Genetics of Primary Familial Brain Calcification: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hitherto, seven genes have been associated with PFBC, including four dominant inherited genes (SLC20A2, PDGFRB, PDGFB, and XPR1) and three recessive inherited genes (MYORG, JAM2, and CMPK2)."
    explanation: >-
      Places CMPK2 in the recessive group alongside MYORG and JAM2, which is the
      membership claim this subtype row makes. The review predates the NAA60 and
      RRP12 reports, so its count of seven is the count at the time and not a
      statement that no further gene exists.
progression:
- phase: Variable onset and age-dependent expressivity
  notes: >-
    Symptoms may begin in childhood or late adulthood, and some genetically
    affected individuals remain asymptomatic despite calcifications on imaging.
  evidence:
  - reference: PMID:29955172
    reference_title: "Primary brain calcification: an international study reporting novel variants and associated phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary familial brain calcification (PFBC) is a rare cerebral microvascular calcifying
      disorder with a wide spectrum of motor, cognitive, and neuropsychiatric symptoms. ... Our
      study aimed at screening the coding regions of these genes in a series of 177 unrelated
      probands that fulfilled the diagnostic criteria for primary brain calcification regardless of
      their family history. ... We identified 45 probands (25.4%) carrying either pathogenic or
      likely pathogenic variants (n = 34, 19.2%) or VUS (n = 11, 6.2%). ... A total of 81.5% of
      carriers were symptomatic and the most recurrent symptoms were parkinsonism, cognitive
      impairment, and psychiatric disturbances (52.3%, 40.9%, and 38.6% of symptomatic individuals,
      respectively), with a wide range of age at onset (from childhood to 81 years).
    explanation: >-
      Identifies primary familial brain calcification and variable onset, retaining the distinction
      between pathogenic/likely pathogenic variants and variants of uncertain significance.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant disease accounts for the traditional PFBC families driven mainly
    by SLC20A2, XPR1, PDGFRB, and PDGFB.
  evidence:
  - reference: PMID:29955172
    reference_title: "Primary brain calcification: an international study reporting novel variants and associated phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is typically inherited as an autosomal-dominant trait with four causative genes identified so far: SLC20A2, PDGFRB, PDGFB, and XPR1."
    explanation: Establishes autosomal dominant inheritance for the classical PFBC subgroup.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Recessive BSPDC/PFBC now includes MYORG-, JAM2-, and NAA60-associated
    disease with biallelic pathogenic variants.
  evidence:
  - reference: PMID:38480682
    reference_title: "Biallelic NAA60 variants with impaired n-terminal acetylation capacity cause autosomal recessive primary familial brain calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identify biallelic NAA60 variants in ten individuals from seven families with autosomal recessive PFBC."
    explanation: Confirms autosomal recessive inheritance as part of the PFBC spectrum.
genetic:
- name: SLC20A2
  gene_term:
    preferred_term: SLC20A2
    term:
      id: hgnc:10947
      label: SLC20A2
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    SLC20A2 encodes the PiT-2 inorganic phosphate importer and is the major
    cause of autosomal dominant PFBC. Loss of expression or regulatory
    haploinsufficiency lowers phosphate uptake and promotes phosphate
    dysregulation in brain microvascular tissue.
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:32506582
    reference_title: "Haploinsufficiency of the Primary Familial Brain Calcification Gene SLC20A2 Mediated by Disruption of a Regulatory Element."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency of SLC20A2, which encodes an inorganic phosphate importer, is a major cause of autosomal-dominant PFBC."
    explanation: Establishes SLC20A2 as the major dominant phosphate-import gene in PFBC.
- name: XPR1
  gene_term:
    preferred_term: XPR1
    term:
      id: hgnc:12827
      label: XPR1
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    XPR1 encodes a phosphate exporter. Pathogenic dominant variants impair
    phosphate efflux and reinforce phosphate homeostasis as a central disease
    axis in BSPDC/PFBC.
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:25938945
    reference_title: "Mutations in XPR1 cause primary familial brain calcification associated with altered phosphate export."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations alter phosphate export, implicating XPR1 and phosphate homeostasis in PFBC."
    explanation: Directly links dominant XPR1 variants to PFBC through altered phosphate export.
- name: PDGFRB
  gene_term:
    preferred_term: PDGFRB
    term:
      id: hgnc:8804
      label: PDGFRB
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    PDGFRB encodes the platelet-derived growth factor receptor beta. Reduced
    receptor function implicates pericyte biology, angiogenic signaling, and
    phosphate-regulatory neurovascular pathways in PFBC.
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:23255827
    reference_title: "Mutation of the PDGFRB gene as a cause of idiopathic basal ganglia calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations of PDGFRB further support the involvement of this biological pathway in IBGC pathophysiology."
    explanation: Supports PDGFRB as a causative dominant PFBC gene linked to the shared pathway.
- name: PDGFB
  gene_term:
    preferred_term: PDGFB
    term:
      id: hgnc:8800
      label: PDGFB
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    PDGFB is the major ligand for PDGFRB. Endothelial PDGF-B loss is linked to
    pericyte deficiency, blood-brain barrier compromise, and brain
    calcification.
  inheritance:
  - name: Autosomal Dominant
  evidence:
  - reference: PMID:23913003
    reference_title: "Mutations in the gene encoding PDGF-B cause brain calcifications in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we identify six families of different ancestry with nonsense and missense mutations in the gene encoding PDGF-B, the main ligand for PDGF-Rβ."
    explanation: Establishes PDGFB as a dominant PFBC gene in affected human families.
- name: MYORG
  gene_term:
    preferred_term: MYORG
    term:
      id: hgnc:19918
      label: MYORG
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    MYORG encodes an astrocyte-associated glycosidase-family protein and causes
    recessive PFBC. Current evidence links MYORG-associated disease to
    neurovascular signaling pathways related to PDGFRB biology.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:30656188
    reference_title: "MYORG is associated with recessive primary familial brain calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYORG mutations are linked to a recessive form of primary familial brain calcification."
    explanation: Establishes MYORG as a recessive PFBC gene.
  - reference: PMID:30656188
    reference_title: "MYORG is associated with recessive primary familial brain calcification."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "the MYORG protein may interact with calcium channels expressed in astrocytes"
    explanation: Phylogenetic-profiling analysis links MYORG to astrocyte calcium channels and to PDGFRB-interacting proteins, connecting recessive MYORG disease to the shared neurovascular PFBC pathway.
- name: JAM2
  gene_term:
    preferred_term: JAM2
    term:
      id: hgnc:14686
      label: JAM2
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    JAM2 encodes a junctional adhesion protein enriched in neurovascular-unit
    cell types. Biallelic loss disrupts cell-cell adhesion and neurovascular
    integrity in severe recessive PFBC.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:31851307
    reference_title: "Biallelic loss-of-function mutations in JAM2 cause primary familial brain calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study identifies a novel causative gene for primary familial brain calcification, whose vital function and high expression in the neurovascular unit further supports impairment of the neurovascular unit as the root of primary familial brain calcification pathogenesis."
    explanation: Establishes JAM2 as a recessive PFBC gene and ties it to neurovascular pathology.
- name: NAA60
  gene_term:
    preferred_term: NAA60
    term:
      id: hgnc:25875
      label: NAA60
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    NAA60 encodes a Golgi-localized N-terminal acetyltransferase. Recessive
    loss of NAA60 impairs transmembrane-protein acetylation, lowers cell-surface
    SLC20A2, and reduces phosphate uptake.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:38480682
    reference_title: "Biallelic NAA60 variants with impaired n-terminal acetylation capacity cause autosomal recessive primary familial brain calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study establishes NAA60 as a causal gene for PFBC, provides a possible biochemical explanation of its disease-causing mechanisms and underscores NAA60-mediated Nt-acetylation of transmembrane proteins as a fundamental process for healthy neurobiological functioning."
    explanation: Establishes NAA60 as a recessive PFBC gene with a defined biochemical mechanism.
- name: CMPK2
  gene_term:
    preferred_term: CMPK2
    term:
      id: hgnc:27015
      label: CMPK2
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Biallelic CMPK2 loss of function lowers mitochondrial DNA copy number,
    mitochondrial protein abundance and ATP production, and raises intracellular
    inorganic phosphate. That is a third mechanistic axis in this disease,
    distinct from the phosphate transporters and from the neurovascular-unit
    genes, and it is the one this entry models at the `Neuronal and endothelial
    mitochondrial dysfunction` node. The cited work characterises the
    consequences of losing the gene rather than stating what the protein does, so
    no claim about the enzyme's normal substrate is made here.
  inheritance:
  - name: Autosomal Recessive
  evidence:
  - reference: PMID:36443312
    reference_title: "Loss of function of CMPK2 causes mitochondria deficiency and brain calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we analyzed two brain calcification families and identified calcification co-segregated biallelic variants in the CMPK2 gene that disrupt mitochondrial functions."
    explanation: >-
      Establishes CMPK2 as a recessive brain-calcification gene on co-segregation
      of biallelic variants in two families.
  - reference: PMID:36443312
    reference_title: "Loss of function of CMPK2 causes mitochondria deficiency and brain calcification."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, calcification developed in a progressive manner in the homozygous Cmpk2-KO mice thalamus region as well as in the Cmpk2-knock-in mice bearing the patient mutation, thus phenocopying the calcification pathology observed in the patients."
    explanation: >-
      Two independent mouse models - a knockout and a knock-in carrying the
      patient allele - reproduce the calcification, which is what raises CMPK2
      above a co-segregation observation.
  - reference: PMID:37446066
    reference_title: "The Genetics of Primary Familial Brain Calcification: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hitherto, seven genes have been associated with PFBC, including four dominant inherited genes (SLC20A2, PDGFRB, PDGFB, and XPR1) and three recessive inherited genes (MYORG, JAM2, and CMPK2)."
    explanation: >-
      Independent review counting CMPK2 among the established recessive PFBC
      genes, which is the basis for typing it CAUSATIVE rather than as a
      candidate.
- name: RRP12
  gene_term:
    preferred_term: RRP12
    term:
      id: hgnc:29100
      label: RRP12
  association: Candidate
  relationship_type: UNKNOWN
  features: >-
    Biallelic RRP12 missense variants were reported in four families with brain
    calcification, with reduced RRP12 protein and abnormal nucleolar morphology in
    patient fibroblasts. The founding report describes RRP12 as having an
    essential role in RNA metabolism, which places the gene on the
    nucleic-acid-metabolism axis of brain calcification rather than on the
    phosphate-transport or neurovascular-unit axes the other eight genes occupy.
    No pathophysiology node is curated for it here, because the reported
    functional work establishes that the variants reduce RRP12 protein and
    disturb the nucleolus, not how either step reaches calcium-phosphate
    deposition; the zebrafish knockdown in that report gave developmental delay,
    crimping and early lethality rather than a calcification phenotype.
  inheritance:
  - name: Autosomal Recessive
  notes: >-
    `relationship_type: UNKNOWN` with `association: Candidate` follows the
    founding report's own conclusion, which calls RRP12 "a novel candidate gene"
    rather than an established cause. Four families with biallelic variants and a
    protein-level readout is real support, but the two large screening cohorts it
    drew on (France n = 111, China n = 543) yielded three further individuals
    between them, its own zebrafish knockdown produced developmental delay and
    lethality rather than calcification, and the current ClinGen Gene-Disease
    Validity table (file created 2026-09-25,
    downloaded from the unversioned URL pinned in data/clingen/MANIFEST.yaml)
    contains no RRP12 assertion - nor any assertion for the other eight genes on
    this entry, so that silence is about the panel's coverage of this disease
    rather than about RRP12 specifically.
  evidence:
  - reference: PMID:41059649
    reference_title: "RRP12 Variants Are Associated With Autosomal Recessive Brain Calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of two large cohorts of patients with unresolved brain calcifications revealed two affected French siblings and one unrelated Chinese individual, each carrying rare, biallelic, missense variants in the RRP12 gene"
    explanation: >-
      The replication beyond the two index Pakistani probands: three further
      individuals from two more families, all with biallelic missense variants.
  - reference: PMID:41059649
    reference_title: "RRP12 Variants Are Associated With Autosomal Recessive Brain Calcifications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RRP12 is a novel candidate gene for autosomal recessive brain calcifications, possibly associated with a wide clinical spectrum ranging from early-onset severe forms to adult-onset paucisymptomatic presentations."
    explanation: >-
      The authors' own classification, and the reason this record is typed
      UNKNOWN/Candidate rather than CAUSATIVE.
  - reference: PMID:41059649
    reference_title: "RRP12 Variants Are Associated With Autosomal Recessive Brain Calcifications."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Primary brain calcifications are observed in several inherited diseases due to different pathogenic mechanisms, including the disruption of the neurovascular unit, mitochondrial dysfunction, and impaired nucleic acid metabolism."
    explanation: >-
      Names the three mechanistic axes of inherited brain calcification, which is
      how RRP12 is positioned relative to the other genes on this entry. Marked
      BACKGROUND because it is the paper's structured `BACKGROUND:` framing
      rather than a result of the study.
biochemical:
- name: Normal serum calcium and phosphate metabolism
  presence: NORMAL
  context: >-
    Primary/idiopathic brain calcification occurs with normal systemic
    calcium-phosphate metabolism and normal parathyroid function. Documented
    normal serum calcium, phosphate, and parathyroid hormone distinguish primary
    familial brain calcification from secondary brain calcification due to
    hypoparathyroidism and other metabolic causes, and this exclusion is part of
    the diagnostic definition.
  evidence:
  - reference: PMID:30656188
    reference_title: "MYORG is associated with recessive primary familial brain calcification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive neurological disorder with extensive brain calcification, lacking known metabolic causes such as calcium or phosphorus disorders"
    explanation: Defines PFBC by the absence of a calcium/phosphorus metabolic disturbance, the criterion separating primary from secondary brain calcification.
  - reference: PMID:39036637
    reference_title: "Primary familial brain calcification presenting with parkinsonism and motor complications caused by a novel SLC20A2 variant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory tests revealed normal liver function, electrolyte (including calcium and phosphorus metabolism)"
    explanation: A genetically confirmed PFBC case shows normal calcium/phosphorus metabolism and parathyroid hormone, consistent with the primary/idiopathic diagnostic criterion.
pathophysiology:
- name: Disrupted phosphate transport homeostasis
  description: >-
    SLC20A2 and XPR1 directly regulate inorganic phosphate influx and efflux,
    while NAA60 loss secondarily reduces SLC20A2 surface abundance and
    phosphate uptake. Together these defects dysregulate phosphate handling in
    the brain microvascular environment and promote calcium-phosphate
    deposition.
  genes:
  - preferred_term: SLC20A2
    term:
      id: hgnc:10947
      label: SLC20A2
  - preferred_term: XPR1
    term:
      id: hgnc:12827
      label: XPR1
  - preferred_term: NAA60

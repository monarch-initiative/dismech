animal_models:
- name: DAP12-deficient mouse (Tyrobp knockout)
  species: Mouse
  genotype: Tyrobp (DAP12) homozygous null
  publication: PMID:12569157
  description: >-
    The reference genetic model. It reproduces the two tissue-level arms of the disease -
    a bone phenotype and a myelin phenotype - but does so with important differences from
    the human lesion, and the microglial state that current human data place at the centre
    of the CNS arm is specifically not reproduced. It is therefore a good model of the
    consequences and a poor model of the mechanism, which is worth stating explicitly
    rather than leaving a reader to infer from a citation list.
  modeled_mechanisms:
  - target: Impaired Bone Resorption and Remodelling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      DAP12-null bone marrow yields immature osteoclasts with attenuated resorption, and the
      mice develop increased bone mass - a direct functional demonstration of the cellular
      defect this node asserts.
    limitations: >-
      The organism-level readout diverges: mice develop osteopetrosis (uniformly increased
      bone mass), whereas patients develop focal lytic cysts with fragility. The cellular
      mechanism transfers; the tissue outcome does not.
    readouts:
    - name: In vitro osteoclast bone resorption activity
      target: Impaired Bone Resorption and Remodelling
      direction: DECREASED
      interpretation: Functional confirmation that DAP12 loss impairs osteoclast maturation and resorption.
      evidence:
      - reference: PMID:12569157
        reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In vitro osteoclast induction from DAP12(-/-) bone marrow cells yielded immature cells with attenuated bone resorption activity."
        explanation: Reports the resorption measurement behind this readout.
    - name: Bone mass
      target: Impaired Bone Resorption and Remodelling
      direction: INCREASED
      interpretation: >-
        Increased bone mass in the mouse - the opposite direction to the human cystic,
        fragile bone, and the reason the limitation above is recorded.
      evidence:
      - reference: PMID:12569157
        reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "DAP12-deficient (DAP12(-/-)) mice develop an increased bone mass (osteopetrosis)"
        explanation: >-
          Graded PARTIAL for this node because it confirms disordered DAP12-dependent bone
          remodelling while diverging in direction from the human phenotype.
    evidence:
    - reference: PMID:12569157
      reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "suggesting that the primary defects in DAP12(-/-) mice are the developmental arrest of osteoclasts and oligodendrocytes"
      explanation: Supports treating this model as informative for the osteoclast nodes.
  - target: Impaired Oligodendrocyte Myelination
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mice show a reduction of myelin accentuated in the thalamus, with immature
      oligodendrocytes arrested nearby.
    limitations: >-
      The mouse lesion is a regionally restricted developmental arrest centred on the
      thalamus, whereas the human disease is a progressive, frontally accentuated sclerosing
      leukoencephalopathy in an adult brain. Distribution, timing and progressive character
      all differ.
    readouts:
    - name: Thalamic myelin content
      target: Impaired Oligodendrocyte Myelination
      direction: DECREASED
      interpretation: Structural correlate of the myelination node in this model.
      evidence:
      - reference: PMID:12569157
        reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a reduction of myelin (hypomyelinosis) accentuated in the thalamus"
        explanation: Reports the myelin measurement behind this readout.
    evidence:
    - reference: PMID:12569157
      reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "immature oligodendrocytes were arrested in the vicinity of the thalamus"
      explanation: >-
        Supports the model as partly informative for the myelination node while showing the
        regional restriction that limits it.
  - target: Dysregulated Microglial Wound-Healing Program
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Single-nuclei profiling of mice lacking DAP12 signalling showed only very mild
      microglial defects and did not reproduce the human NHD microglial signature. This is a
      substantive negative result, not an absence of data: the same study generated the human
      and mouse profiles and compared them directly.
    limitations: >-
      The mouse does not reproduce the RUNX1/STAT3/TGF-beta wound-healing program that
      defines this node in human brain. Any therapeutic inference about resetting microglial
      signalling that rests on this mouse is therefore unsupported, and mouse-derived
      microglial readouts should not be used as a proxy for the human microglial state.

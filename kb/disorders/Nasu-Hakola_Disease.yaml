genetic:
- name: TYROBP
  notes: >-
    Encodes DAP12, the ITAM-bearing transmembrane adaptor. The Finnish founder allele is a
    large deletion that abolishes detectable protein; other loss-of-function alleles have been
    described in Japanese and other populations. TYROBP variants account for the majority of
    reported PLOSL.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TYROBP
    term:
      id: hgnc:12449
      label: TYROBP
  evidence:
  - reference: PMID:10888890
    reference_title: "Loss-of-function mutations in TYROBP (DAP12) result in a presenile dementia with bone cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identifying one large deletion in all Finnish PLOSL alleles and another mutation in a Japanese patient, both representing loss-of-function mutations"
    explanation: Original identification of TYROBP loss-of-function alleles as causal.
- name: TREM2
  notes: >-
    Encodes the lipid-sensing receptor subunit. Biallelic loss of function causes PLOSL2.
    Separately - and this is the reason the gene is widely studied - heterozygous hypomorphic
    TREM2 alleles are established risk factors for late-onset Alzheimer disease, so the same
    gene sits at both ends of a dose-response relationship with dementia.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TREM2
    term:
      id: hgnc:17761
      label: TREM2
  evidence:
  - reference: PMID:12080485
    reference_title: "Mutations in two genes encoding different subunits of a receptor signaling complex result in an identical disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we complete the molecular pathology of PLOSL by identifying TREM2 as the second PLOSL gene."
    explanation: Original identification of TREM2 as causal for PLOSL.
  - reference: PMID:36658241
    reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous hypofunctional TREM2 variants impair microglia, accelerating late-onset Alzheimer's disease."
    explanation: Establishes the heterozygous Alzheimer risk that contrasts with the biallelic PLOSL phenotype.

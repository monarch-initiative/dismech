animal_models:
- name: DAP12-deficient mouse (Tyrobp knockout)
  species: Mouse
  genotype: Tyrobp (DAP12) homozygous null
  publication: PMID:12569157
  description: >-
    The reference genetic model. It reproduces the two tissue-level arms of the disease -
    a bone phenotype and a myelin phenotype - but does so with important differences from
    the human lesion, and the microglial state that current human data place at the centre
    of the CNS arm is specifically not reproduced. It is therefore a good model of the
    consequences and a poor model of the mechanism, which is worth stating explicitly
    rather than leaving a reader to infer from a citation list.
  modeled_mechanisms:
  - target: Osteoclast Differentiation and Resorption Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      DAP12-null bone marrow yields immature osteoclasts with attenuated resorption, and the
      mice develop increased bone mass - a direct functional demonstration of the cellular
      defect this node asserts.
    limitations: >-
      The organism-level readout diverges: mice develop osteopetrosis (uniformly increased
      bone mass), whereas patients develop focal lytic cysts with fragility. The cellular
      mechanism transfers; the tissue outcome does not.
    readouts:
    - name: In vitro osteoclast bone resorption activity
      target: Osteoclast Differentiation and Resorption Failure
      direction: DECREASED
      interpretation: Functional confirmation that DAP12 loss impairs osteoclast maturation and resorption.
      evidence:
      - reference: PMID:12569157
        reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In vitro osteoclast induction from DAP12(-/-) bone marrow cells yielded immature cells with attenuated bone resorption activity."
        explanation: Reports the resorption measurement behind this readout.
    - name: Bone mass
      target: Osteoclast Differentiation and Resorption Failure
      direction: INCREASED
      interpretation: >-
        Increased bone mass in the mouse - the opposite direction to the human cystic,
        fragile bone, and the reason the limitation above is recorded.
      evidence:
      - reference: PMID:12569157
        reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "DAP12-deficient (DAP12(-/-)) mice develop an increased bone mass (osteopetrosis)"
        explanation: >-
          Graded PARTIAL for this node because it confirms disordered DAP12-dependent bone
          remodelling while diverging in direction from the human phenotype.
    evidence:
    - reference: PMID:12569157
      reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "suggesting that the primary defects in DAP12(-/-) mice are the developmental arrest of osteoclasts and oligodendrocytes"
      explanation: Supports treating this model as informative for the osteoclast node.
  - target: Impaired Oligodendrocyte Myelination and Demyelination
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mice show a reduction of myelin accentuated in the thalamus, with immature
      oligodendrocytes arrested nearby.
    limitations: >-
      The mouse lesion is a regionally restricted developmental arrest centred on the
      thalamus, whereas the human disease is a progressive, frontally accentuated sclerosing
      leukoencephalopathy in an adult brain. Distribution, timing and progressive character
      all differ.
    readouts:
    - name: Thalamic myelin content
      target: Impaired Oligodendrocyte Myelination and Demyelination
      direction: DECREASED
      interpretation: Structural correlate of the myelination node in this model.
      evidence:
      - reference: PMID:12569157
        reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a reduction of myelin (hypomyelinosis) accentuated in the thalamus"
        explanation: Reports the myelin measurement behind this readout.
    evidence:
    - reference: PMID:12569157
      reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "immature oligodendrocytes were arrested in the vicinity of the thalamus"
      explanation: >-
        Supports the model as partly informative for the myelination node while showing the
        regional restriction that limits it.
  - target: Dysregulated Microglial Wound-Healing Program
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Single-nuclei profiling of mice lacking DAP12 signalling showed only very mild
      microglial defects and did not reproduce the human NHD microglial signature. This is a
      substantive negative result, not an absence of data: the same study generated the human
      and mouse profiles and compared them directly.
    limitations: >-
      The mouse does not reproduce the RUNX1/STAT3/TGF-beta wound-healing program that
      defines this node in human brain. Any therapeutic inference about resetting microglial
      signalling that rests on this mouse is therefore unsupported, and mouse-derived
      microglial readouts should not be used as a proxy for the human microglial state.
    readouts:
    - name: Microglial transcriptional signature (single-nuclei)
      target: Dysregulated Microglial Wound-Healing Program
      direction: UNCHANGED
      interpretation: >-
        Essentially preserved microglial profile in the mouse, against a markedly dysregulated
        one in human NHD brain. UNCHANGED is the finding here, not a missing measurement.
      evidence:
      - reference: PMID:36658241
        reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "single-nuclei signatures in mice lacking DAP12 signaling reflected very mild microglial defects that did not recapitulate NHD"
        explanation: Reports the direct human-versus-mouse comparison behind this readout.
    evidence:
    - reference: PMID:36658241
      reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Conversely, single-nuclei signatures in mice lacking DAP12 signaling reflected very mild microglial defects that did not recapitulate NHD."
      explanation: >-
        Refutes the proposition that this model is informative for the human microglial node -
        the claim the link makes, and the reason the relationship is FAILS_TO_RECAPITULATE.
discussions:
- discussion_id: nhd_microglial_signature_species_divergence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does loss of DAP12 signalling produce a florid dysregulated microglial wound-healing
    program in human brain but only very mild microglial defects in mouse, and what does that
    species difference mean for interpreting mouse-derived NHD mechanism and therapy?
  attaches_to:
  - pathophysiology#Dysregulated Microglial Wound-Healing Program
  - animal_models#Mouse
  rationale: >-
    This is not a gap where evidence is missing - the evidence exists in both species and
    disagrees. The same study produced human and mouse single-nuclei profiles and found the
    human NHD microglial signature (heightened RUNX1, STAT3, TGF-beta repair signalling) was
    not reproduced in DAP12-deficient mice.

    The mismatch matters because it lands on the mechanistic step the field is currently
    building therapeutic hypotheses on. The proposal to "reset" microglial signalling in NHD
    comes from the human signature; the tractable model for testing such a reset is the mouse
    that does not display it. Reading across from mouse microglial phenotypes to human NHD is
    therefore unsafe in this specific respect, while the same mouse remains informative for
    the osteoclast and oligodendrocyte arms - so the mismatch is node-specific rather than a
    blanket judgement on the model.

    A plausible reading is that mouse microglia tolerate DAP12 loss through redundancy that
    human microglia lack, but the entry does not assert that; the observation is the
    divergence itself.
  proposed_experiments:
  - experiment_id: exp_nhd_ipsc_microglia_signature
    name: Human iPSC-derived microglia carrying biallelic TYROBP or TREM2 null alleles
    description: >-
      Test whether the RUNX1/STAT3/TGF-beta wound-healing signature emerges cell-autonomously
      in a human genetic background, which would locate the species difference in microglial
      biology rather than in the brain environment.
    would_support:
    - pathophysiology#Dysregulated Microglial Wound-Healing Program
    supporting_outcome:
    - >-
      DAP12-null human iPSC-microglia reproduce the RUNX1/STAT3/TGF-beta signature seen in
      patient brain, establishing it as cell-autonomous and human-specific.
    refuting_outcome:
    - >-
      DAP12-null human iPSC-microglia show only the mild changes seen in mouse, indicating the
      signature requires the diseased brain environment rather than the genotype alone.
  - experiment_id: exp_nhd_microglia_xenotransplant
    name: Xenotransplantation of DAP12-null human microglia into humanised mouse brain
    description: >-
      Separates species-of-cell from species-of-environment by placing human DAP12-null
      microglia in a mouse CNS.
    would_support:
    - pathophysiology#Dysregulated Microglial Wound-Healing Program
    supporting_outcome:
    - >-
      Human DAP12-null microglia adopt the NHD signature even in mouse brain, implicating
      human microglial biology rather than the surrounding tissue.
    refuting_outcome:
    - >-
      Human DAP12-null microglia remain near-homeostatic in mouse brain, implicating the human
      brain environment or disease-stage context.

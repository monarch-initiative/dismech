name: Nasu-Hakola Disease
category: Mendelian
creation_date: "2026-08-28T10:30:00Z"
synonyms:
- PLOSL
- polycystic lipomembranous osteodysplasia with sclerosing leukoencephalopathy
- PLO-SL
- NHD
- brain-bone-fat disease
- presenile dementia with bone cysts
- dementia, prefrontal, with bone cysts
- membranous lipodystrophy
description: >-
  Nasu-Hakola disease (PLOSL) is an autosomal recessive disorder in which biallelic
  loss-of-function variants in either TYROBP (encoding the ITAM-bearing adaptor DAP12) or
  TREM2 (the lipid-sensing receptor it serves) disable a single myeloid immunoreceptor
  complex. Because that one complex is used by both osteoclasts and microglia, one molecular
  lesion produces two clinical arms that look unrelated: cystic osteodysplasia of the wrists
  and ankles with pathological fractures in the third decade, then a frontal lobe syndrome
  progressing to presenile dementia in the fourth, with death usually before age 50.

  The two-gene architecture is the point of the entry rather than a complication of it.
  TREM2 and DAP12 are the ligand-binding and signal-transducing halves of the same receptor,
  so mutations in either subunit give an identical phenotype - a rarely clean natural
  experiment showing that the disease is the loss of the pathway, not of either protein.
  This entry therefore models one pathograph with two entry points (has_subtypes PLOSL1 and
  PLOSL2) rather than two diseases.

  What the entry deliberately does not claim is a settled account of how loss of an
  activating receptor causes demyelination. Single-nucleus sequencing of DAP12-deficient
  human brain found microglia not silenced but locked into a RUNX1/STAT3/TGF-beta wound-healing
  program, with matching astrocyte and oligodendrocyte signatures - and the same study found
  that DAP12-deficient mice do not reproduce that signature. The mouse remains a good model
  of the bone and myelin arms and a poor one of the microglial state, which is recorded here
  as an explicit human/model mismatch rather than smoothed over.

  The heterozygote is the reason this ultra-rare disease is read widely: carriers do not
  develop PLOSL, but hypomorphic TREM2 alleles are established risk factors for late-onset
  Alzheimer disease, making PLOSL the complete-loss end of a dose-response curve whose
  shallow end is common.

diagnosis:
- name: Radiography of Ankles and Wrists
  description: >-
    Plain radiography of the ankles and wrists demonstrating polycystic osseous lesions. The
    practical recommendation from the largest molecularly confirmed series is to x-ray ankles
    and wrists in any patient with frontal-type dementia of unknown origin - because some
    patients have no bone symptoms at all before the neurological presentation, so waiting for
    a fracture misses them.
  evidence:
  - reference: PMID:11402114
    reference_title: "CNS manifestations of Nasu-Hakola disease: a frontal dementia with bone cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with frontal-type dementia of unknown origin should be investigated by x-ray of ankles and wrists"
    explanation: States the diagnostic recommendation and the reasoning behind it.
- name: Molecular Genetic Testing of TYROBP and TREM2
  description: >-
    Identification of biallelic pathogenic variants in TYROBP or TREM2 confirms the diagnosis.
    GeneReviews is explicit that this is needed because the radiographic and clinical picture
    can be inconclusive.
  evidence:
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in TYROBP or TREM2 confirms the diagnosis since radiographic and clinical features may be inconclusive."
    explanation: Establishes molecular confirmation as the definitive diagnostic step.

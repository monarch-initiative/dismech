discussions:
- discussion_id: nhd_microglial_signature_species_divergence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does loss of DAP12 signalling produce a florid dysregulated microglial wound-healing
    program in human brain but only very mild microglial defects in mouse, and what does that
    species difference mean for interpreting mouse-derived NHD mechanism and therapy?
  attaches_to:
  - pathophysiology#Dysregulated Microglial Wound-Healing Program
  - animal_models#DAP12-deficient mouse (Tyrobp knockout)
  rationale: >-
    This is not a gap where evidence is missing - the evidence exists in both species and
    disagrees. The same study produced human and mouse single-nuclei profiles and found the
    human NHD microglial signature (heightened RUNX1, STAT3, TGF-beta repair signalling) was
    not reproduced in DAP12-deficient mice.

    The mismatch matters because it lands on the mechanistic step the field is currently
    building therapeutic hypotheses on. The proposal to "reset" microglial signalling in NHD
    comes from the human signature; the tractable model for testing such a reset is the mouse
    that does not display it. Reading across from mouse microglial phenotypes to human NHD is
    therefore unsafe in this specific respect, while the same mouse remains informative for
    the osteoclast and oligodendrocyte arms - so the mismatch is node-specific rather than a
    blanket judgement on the model.

    A plausible reading is that mouse microglia tolerate DAP12 loss through redundancy that
    human microglia lack, but the entry does not assert that; the observation is the
    divergence itself.
  proposed_experiments:
  - experiment_id: exp_nhd_ipsc_microglia_signature
    name: Human iPSC-derived microglia carrying biallelic TYROBP or TREM2 null alleles
    description: >-
      Test whether the RUNX1/STAT3/TGF-beta wound-healing signature emerges cell-autonomously
      in a human genetic background, which would locate the species difference in microglial
      biology rather than in the brain environment.
    would_support:
    - pathophysiology#Dysregulated Microglial Wound-Healing Program
    supporting_outcome:
    - >-
      DAP12-null human iPSC-microglia reproduce the RUNX1/STAT3/TGF-beta signature seen in
      patient brain, establishing it as cell-autonomous and human-specific.
    refuting_outcome:
    - >-
      DAP12-null human iPSC-microglia show only the mild changes seen in mouse, indicating the
      signature requires the diseased brain environment rather than the genotype alone.
  - experiment_id: exp_nhd_microglia_xenotransplant
    name: Xenotransplantation of DAP12-null human microglia into humanised mouse brain
    description: >-
      Separates species-of-cell from species-of-environment by placing human DAP12-null
      microglia in a mouse CNS.
    would_support:
    - pathophysiology#Dysregulated Microglial Wound-Healing Program
    supporting_outcome:
    - >-
      Human DAP12-null microglia adopt the NHD signature even in mouse brain, implicating
      human microglial biology rather than the surrounding tissue.
    refuting_outcome:
    - >-
      Human DAP12-null microglia remain near-homeostatic in mouse brain, implicating the human
      brain environment or disease-stage context.

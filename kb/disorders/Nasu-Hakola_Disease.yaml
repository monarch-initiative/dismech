histopathology:
- name: Sclerosing Leukoencephalopathy with Frontal Accentuation
  description: >-
    The CNS half of the name. Autopsy of molecularly confirmed patients shows advanced
    sclerosing leukoencephalopathy accentuated frontally, with widespread microglial
    activation and microvascular changes. The microglial finding is worth reading forward:
    it was a static histological observation for two decades before single-nucleus sequencing
    identified what those activated microglia were actually doing.
  evidence:
  - reference: PMID:11402114
    reference_title: "CNS manifestations of Nasu-Hakola disease: a frontal dementia with bone cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients who had undergone autopsies showed an advanced sclerosing leukoencephalopathy with frontal accentuation, widespread activation of microglia, and microvascular changes."
    explanation: The autopsy description, in patients confirmed homozygous for a DAP12 loss-of-function allele.
- name: Gliosis and Myelin Loss
  description: >-
    Cerebral atrophy, myelin loss and gliosis are given as the defining neuropathological
    triad in the recent human tissue study.
  evidence:
  - reference: PMID:36658241
    reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an early-onset dementia characterized by cerebral atrophy, myelin loss and gliosis"
    explanation: States the neuropathological triad.
- name: Polycystic Osseous Lesions with Necrotic Fatty Content
  description: >-
    The bone half of the name. The lesions are radiologically demonstrable polycystic osseous
    lesions; the "lipomembranous" in the disease name refers to the partly necrotic fatty
    tissue filling them. Because they are the finding that distinguishes this dementia from
    every other, radiography of the ankles and wrists is a diagnostic step rather than an
    incidental one.
  evidence:
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "radiologically demonstrable polycystic osseous lesions"
    explanation: >-
      GeneReviews names the osseous lesion. The necrotic fatty content is described in the
      older literature and is carried here in prose rather than quoted, since it is not stated
      in a source cached for this entry.
phenotypes:
- name: Bone Cyst
  category: Skeletal
  description: >-
    Well-defined lytic cystic lesions with a highly characteristic distribution - carpal and
    tarsal bones, phalanges, metacarpals, metatarsals, patella and the ends of long bones.
    Radiologically demonstrable and, in combination with a presenile frontal dementia,
    effectively diagnostic.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Bone cyst
    term:
      id: HP:0012062
      label: Bone cyst
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PLOSL can be established in a proband with radiologically demonstrable polycystic osseous lesions, frontal lobe syndrome, and progressive presenile dementia beginning in the fourth decade."
    explanation: Places the polycystic osseous lesions among the defining diagnostic findings.
- name: Pathologic Fracture

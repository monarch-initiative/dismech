has_subtypes:
  - name: PLOSL1
    display_name: PLOSL1 (TYROBP/DAP12)
    description: >-
      Caused by biallelic TYROBP variants removing the DAP12 adaptor. The Finnish founder
      allele is a large deletion abolishing detectable DAP12; a distinct loss-of-function
      allele was found in a Japanese patient. This subtype accounts for the majority of
      reported patients and for essentially all the Finnish ones.
    subtype_term:
      preferred_term: polycystic lipomembranous osteodysplasia with sclerosing leukoencephalopathy 1
      term:
        id: MONDO:0020749
        label: polycystic lipomembranous osteodysplasia with sclerosing leukoencephalopathy 1
    genes:
    - preferred_term: TYROBP
      term:
        id: hgnc:12449
        label: TYROBP
    evidence:
    - reference: PMID:10888890
      reference_title: "Loss-of-function mutations in TYROBP (DAP12) result in a presenile dementia with bone cysts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we characterize the molecular defect in PLOSL by identifying one large deletion in all Finnish PLOSL alleles and another mutation in a Japanese patient, both representing loss-of-function mutations, in the gene encoding TYRO protein tyrosine kinase binding protein (TYROBP; formerly DAP12)."
      explanation: Establishes TYROBP loss of function as the first PLOSL gene and names the Finnish and Japanese alleles.
  - name: PLOSL2
    display_name: PLOSL2 (TREM2)
    description: >-
      Caused by biallelic TREM2 variants. TREM2 was identified as the second PLOSL gene in
      the roughly one fifth of families with no TYROBP mutation, and the resulting phenotype
      is clinically indistinguishable from PLOSL1.
    subtype_term:
      preferred_term: polycystic lipomembranous osteodysplasia with sclerosing leukoencephalopathy 2
      term:
        id: MONDO:0020750
        label: polycystic lipomembranous osteodysplasia with sclerosing leukoencephalopathy 2
    genes:
    - preferred_term: TREM2
      term:
        id: hgnc:17761
        label: TREM2
    evidence:
    - reference: PMID:12080485
      reference_title: "Mutations in two genes encoding different subunits of a receptor signaling complex result in an identical disease phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we complete the molecular pathology of PLOSL by identifying TREM2 as the second PLOSL gene."
      explanation: Identifies TREM2 as the second causal gene, defining this subtype.
notes: >-
  Phenotype scope, and why the list is shorter than Orphanet's. Orphanet lists a number of
  further features as very frequent - spasticity (HP:0001257), myoclonus (HP:0002067),
  reduced bone mineral density (HP:0004349), limitation of joint mobility (HP:0001376),
  skeletal dysplasia (HP:0002652) and irritability (HP:0000737). None of them is modelled
  here, and the reason is availability of evidence rather than a judgement that they are out
  of scope.

  Orphanet's frequency rows are not currently citable in this repository. `just
  refresh-orphadata` fails its pinned checksum (issue #9687), and because it aborts on the
  first bulk file the phenotype product carrying the HPO rows is never downloaded at all. A
  further hazard found while trying: the rejected download is left on disk and
  `just structured-rebuild-orphanet` will then build a normal-looking cache file from it, so
  an ORPHA_2770.md produced today would be derived from unverified data. One was built during
  curation and deliberately discarded rather than committed.

  Two candidate phenotypes were dropped for the same reason after being drafted. Memory
  impairment had no cached source using memory or any cognitive-domain wording - only
  "progressive dementia", which the Frontal Lobe Dementia entry already carries. Arthralgia
  rested on the same GeneReviews sentence as Bone Pain; that sentence names pain and
  tenderness at anatomical sites and does not separate joint from bone pain, so splitting it
  across two HP terms would have asserted a distinction the source does not make.

  When #9687 is resolved these features become straightforwardly citable from the Orphanet
  frequency rows, and adding them is a small, self-contained follow-up.

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic loss-of-function variants in TYROBP or TREM2. Parents are asymptomatic
    heterozygous carriers. The one caveat worth recording is that TYROBP heterozygotes are
    not entirely unaffected: they may show cyst-like bone lesions without dementia, and
    carriers of the Finnish deletion have an increased risk of Alzheimer disease - so
    "recessive" describes the PLOSL phenotype, not the total absence of a carrier effect.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PLOSL is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the inheritance mode.
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals heterozygous for a TYROBP pathogenic variant may have cyst-like bone lesions without presenile dementia, and population studies of individuals heterozygous for the TYROBP 5.2-kb deletion show an increased risk for developing Alzheimer disease"
    explanation: >-
      Qualifies the recessive model - graded as PARTIAL because it supports the inheritance
      claim while documenting a measurable heterozygote effect that a strict recessive
      reading would miss.
pathophysiology:
- name: TREM2-DAP12 Receptor Complex Loss of Function
  description: >-
    Biallelic null or hypomorphic variants in TYROBP or TREM2 remove one half of a
    two-subunit myeloid immunoreceptor. TREM2 is the ligand-binding subunit, a lipid-sensing
    receptor whose short cytoplasmic tail carries no signalling motif of its own; DAP12 is
    the ITAM-bearing transmembrane adaptor that transduces for it. Losing either subunit
    disables the complex, which is why two genes give one disease. The complex is expressed
    on microglia and on osteoclasts, and that shared expression - not two separate lesions -
    is what couples the brain and bone arms of the phenotype.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TYROBP
    term:
      id: hgnc:12449
      label: TYROBP
  - preferred_term: TREM2
    term:
      id: hgnc:17761
      label: TREM2
  downstream:
  - target: Loss of ITAM-Dependent Myeloid Activation Signalling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12080485
    reference_title: "Mutations in two genes encoding different subunits of a receptor signaling complex result in an identical disease phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "provide an interesting example of how mutations in two different subunits of a multisubunit receptor complex result in an identical human disease phenotype"
    explanation: States the two-subunit, one-phenotype logic that this node encodes.
  - reference: PMID:36658241
    reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TREM2 is a lipid sensing receptor expressed on multiple myeloid cells, including microglia in the central nervous system (CNS), osteoclasts in the bone, and macrophages in liver, adipose tissue and tumors"
    explanation: >-
      Establishes the shared microglia/osteoclast expression that couples the two disease
      arms. Graded OTHER because this is a background statement of receptor biology in the
      paper's introduction, not a finding of the human study it reports.
- name: Loss of ITAM-Dependent Myeloid Activation Signalling
  description: >-
    Without an intact TREM2-DAP12 pair, ligand engagement no longer phosphorylates the DAP12
    ITAM, and the downstream tyrosine-kinase cascade that normally drives myeloid activation,
    cytoskeletal reorganisation and phagocytosis is not initiated. The same signalling failure
    is then read out differently by the two cell types that depend on it.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: immunoreceptor-mediated signaling in myeloid cells
    modifier: DECREASED
    term:
      id: GO:0002429
      label: immune response-activating cell surface receptor signaling pathway
  downstream:
  - target: Osteoclast Maturation Arrest
    causal_link_type: DIRECT
  - target: Dysregulated Microglial Wound-Healing Program
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12080485
    reference_title: "Mutations in two genes encoding different subunits of a receptor signaling complex result in an identical disease phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TREM2 forms a receptor signaling complex with TYROBP and triggers activation of the immune responses in macrophages and dendritic cells."
    explanation: >-
      Identifies the activating signalling function that is lost. Graded OTHER because the
      sentence states established receptor biology as background rather than reporting this
      paper's own human genetic finding.
- name: Osteoclast Maturation Arrest
  description: >-
    Osteoclasts are myeloid-derived and require ITAM adaptor signalling to differentiate.
    DAP12-deficient bone marrow yields immature osteoclasts, and the developmental arrest of
    the osteoclast lineage is named by the mouse study as one of the two primary defects.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    modifier: DECREASED
    term:
      id: GO:0030316
      label: osteoclast differentiation
  downstream:
  - target: Impaired Bone Resorption and Remodelling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12569157
    reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "suggesting that the primary defects in DAP12(-/-) mice are the developmental arrest of osteoclasts and oligodendrocytes"
    explanation: Names the osteoclast developmental arrest as a primary defect of DAP12 loss.
- name: Impaired Bone Resorption and Remodelling
  description: >-
    The functional consequence of the maturation arrest: immature osteoclasts resorb bone
    poorly. The human lesion is not simply osteopetrosis, however - patients get focal cystic
    osteodysplasia of the small bones and epiphyses rather than a uniformly dense skeleton, so
    this node is modelled as failed remodelling rather than as absent resorption.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone resorption
    modifier: DECREASED
    term:
      id: GO:0045453
      label: bone resorption
  downstream:
  - target: Polycystic Lipomembranous Osteodysplasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12569157
    reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vitro osteoclast induction from DAP12(-/-) bone marrow cells yielded immature cells with attenuated bone resorption activity."
    explanation: Direct functional demonstration that the immature osteoclasts resorb bone poorly.
- name: Polycystic Lipomembranous Osteodysplasia
  description: >-
    Failed remodelling produces well-defined lytic cysts in the carpal, tarsal, metacarpal,
    metatarsal and phalangeal bones and at the ends of long bones, filled with partly necrotic
    fatty tissue - the finding that gives the disease its "lipomembranous" name and its
    brain-bone-fat nickname. The cysts weaken the bone locally, which is why symptoms begin as
    strain-related pain at the ankles and wrists and progress to fracture on minor trauma.
  biological_scale: TISSUE
  locations:
  - preferred_term: bone tissue
    term:
      id: UBERON:0002481
      label: bone tissue
  downstream:
  - target: Pathologic Fracture
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The osseous stage (3rd decade of life) is characterized by pain and tenderness, mostly in ankles and feet, usually following strain or injury."
    explanation: Describes the clinical onset of the osseous lesion in its characteristic distribution.
  - reference: PMID:11402114
    reference_title: "CNS manifestations of Nasu-Hakola disease: a frontal dementia with bone cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most patients, the disease debuted with pain in ankles and wrists after strain during the third decade, followed by fractures caused by cystic lesions in the bones of the extremities."
    explanation: Links the cystic lesions causally to the fractures in a molecularly confirmed cohort.
- name: Pathologic Fracture
  description: >-
    Fractures of the extremities on minor trauma, arising from the cystic lesions rather than
    from generalised osteoporosis. In most patients this is the presenting event and it
    precedes any neurological symptom by roughly a decade.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is characterized by fractures (resulting from radiologically demonstrable polycystic osseous lesions), frontal lobe syndrome, and progressive presenile dementia beginning in the fourth decade"
    explanation: GeneReviews states the causal relation between the osseous lesions and the fractures.
- name: Dysregulated Microglial Wound-Healing Program
  description: >-
    The intuitive prediction from losing an activating receptor is quiescent microglia. What
    single-nucleus RNA sequencing of DAP12-deficient human brain actually found is the
    opposite: a distinctive signature of heightened RUNX1, STAT3 and TGF-beta signalling -
    the transcriptional program of repair responses to injury - running unchecked. The current
    reading is that DAP12 signalling normally restrains these wound-healing pathways, and that
    without that brake they crowd out the physiological functions of microglia. This is the
    node on which the mouse and the human diverge, and it is the least settled step in the
    pathograph.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: microglial cell activation
    modifier: INCREASED
    term:
      id: GO:0001774
      label: microglial cell activation
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  downstream:
  - target: Impaired Oligodendrocyte Myelination
    causal_link_type: DIRECT
  - target: Demyelination and Myelin Debris Accumulation
    causal_link_type: DIRECT
  - target: Reactive Astrocyte Wound-Healing Response
    causal_link_type: DIRECT
  - target: Pericyte-Associated Microvascular Abnormality
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36658241
    reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "single-nucleus RNA-sequencing analysis of brain specimens from DAP12-deficient NHD individuals revealed a unique microglia signature indicating heightened RUNX1, STAT3 and transforming growth factor-β signaling pathways that mediate repair responses to injuries"
    explanation: The primary human transcriptomic evidence defining this node.
  - reference: PMID:11402114
    reference_title: "CNS manifestations of Nasu-Hakola disease: a frontal dementia with bone cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients who had undergone autopsies showed an advanced sclerosing leukoencephalopathy with frontal accentuation, widespread activation of microglia, and microvascular changes."
    explanation: >-
      Independent autopsy evidence that microglia are activated rather than absent, which is
      the observation the transcriptomic signature later explained.
- name: Impaired Oligodendrocyte Myelination
  description: >-
    A failure to lay down myelin. Oligodendrocytes in DAP12-deficient human brain carry an
    impaired-myelination signature, and DAP12-null mice show oligodendrocyte precursors
    arrested near the thalamus - a developmental arrest rather than destruction of myelin
    already made. Whether the oligodendrocyte defect is driven entirely by the microglial
    state or is partly cell-autonomous is not resolved; the entry models it as downstream of
    the microglial node because that is what the human co-expression data support.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    modifier: DECREASED
    term:
      id: GO:0042552
      label: myelination
  downstream:
  - target: Demyelination and Myelin Debris Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sclerosing Leukoencephalopathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36658241
    reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This profile correlated with a wound healing signature in astrocytes and impaired myelination in oligodendrocytes, while pericyte profiles indicated vascular abnormalities."
    explanation: Human single-nucleus data showing the oligodendrocyte myelination defect alongside the microglial signature.
  - reference: PMID:12569157
    reference_title: "Osteopetrosis and thalamic hypomyelinosis with synaptic degeneration in DAP12-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "immature oligodendrocytes were arrested in the vicinity of the thalamus, suggesting that the primary defects in DAP12(-/-) mice are the developmental arrest of osteoclasts and oligodendrocytes"
    explanation: Model-organism evidence that DAP12 loss arrests oligodendrocyte maturation.
- name: Demyelination and Myelin Debris Accumulation
  description: >-
    Loss of myelin already laid down, distinct from the failure to make it. Human NHD brain
    shows myelin loss, and the proposed sequence is that the dysregulated microglial state
    promotes demyelination and then fails to clear the resulting debris, which further
    activates microglia. Whether the demyelination is a consequence of the failed myelination
    node or an independent microglia-driven process is not established, which is why the edge
    into it is drawn with unknown intermediates.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: myelin maintenance
    modifier: DECREASED
    term:
      id: GO:0043217
      label: myelin maintenance
  downstream:
  - target: Sclerosing Leukoencephalopathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36658241
    reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an early-onset dementia characterized by cerebral atrophy, myelin loss and gliosis"
    explanation: >-
      Establishes myelin loss, as distinct from failed myelination, in human NHD brain. Kept
      HUMAN_CLINICAL rather than OTHER, unlike the receptor-biology sentences regraded
      elsewhere in this entry: this sentence describes the neuropathology of human patients,
      and the paper analysed human brain tissue.
- name: Reactive Astrocyte Wound-Healing Response
  description: >-
    Astrocytes in DAP12-deficient brain carry a wound-healing signature correlated with the
    microglial one, consistent with the dense gliosis seen at autopsy. Modelled as a parallel
    consequence of the dysregulated microglial state rather than an independent lesion.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  downstream:
  - target: Sclerosing Leukoencephalopathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36658241
    reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This profile correlated with a wound healing signature in astrocytes and impaired myelination in oligodendrocytes"
    explanation: Establishes the correlated astrocyte wound-healing state.
- name: Pericyte-Associated Microvascular Abnormality
  description: >-
    Pericyte transcriptional profiles in DAP12-deficient brain indicate vascular abnormality,
    matching the microvascular changes described in the original autopsy series and the older
    hypothesis of a primary small-vessel defect in both bone and brain. The vascular arm is
    included because it is independently observed, not because it is required to explain the
    demyelination.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: pericyte
    term:
      id: CL:0000669
      label: pericyte
  downstream:
  - target: Sclerosing Leukoencephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36658241
    reference_title: "Human early-onset dementia caused by DAP12 deficiency reveals a unique signature of dysregulated microglia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while pericyte profiles indicated vascular abnormalities"
    explanation: Human single-nucleus evidence for the pericyte/vascular component.
  - reference: PMID:11402114
    reference_title: "CNS manifestations of Nasu-Hakola disease: a frontal dementia with bone cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "widespread activation of microglia, and microvascular changes"
    explanation: Autopsy confirmation of microvascular change in molecularly confirmed patients.
- name: Sclerosing Leukoencephalopathy
  description: >-
    The convergent tissue lesion: frontally accentuated white matter sclerosis with
    demyelination, axonal loss and gliosis, visible on T2-weighted MRI as increased white
    matter signal before any clinical neurological symptom, and accompanied by basal ganglia
    calcification and a rising bicaudate ratio. Its frontal predominance is what makes the
    clinical syndrome a frontal one.
  biological_scale: TISSUE
  locations:
  - preferred_term: brain white matter
    term:
      id: UBERON:0003544
      label: brain white matter
  downstream:
  - target: Frontal Lobe Syndrome and Presenile Dementia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11402114
    reference_title: "CNS manifestations of Nasu-Hakola disease: a frontal dementia with bone cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging disclosed abnormally high and progressively increasing bicaudate ratios and calcifications in the basal ganglia as well as increased signal intensities of the white matter on T2-weighted MR images even before the appearance of clinical neurologic symptoms."
    explanation: >-
      Establishes both the white matter lesion and its key temporal property - it is present
      before symptoms, which is what makes imaging useful diagnostically.
- name: Frontal Lobe Syndrome and Presenile Dementia
  description: >-
    The clinical endpoint of the CNS arm: an insidious personality change with loss of
    judgment, euphoria, loss of social inhibitions and lack of insight, progressing to frank
    dementia and loss of mobility, beginning around age 30 and causing death typically before
    50. The frontal, behavioural character of the presentation is why patients are often first
    seen in psychiatric rather than neurological services.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals show a frontal lobe syndrome (loss of judgment, euphoria, loss of social inhibitions, disturbance of concentration, and lack of insight, libido, and motor persistence)"
    explanation: GeneReviews definition of the frontal lobe syndrome.
  - reference: PMID:11402114
    reference_title: "CNS manifestations of Nasu-Hakola disease: a frontal dementia with bone cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frontal lobe syndrome and dementia began to develop by age 30, leading to death by age 40."
    explanation: Gives the age of onset and the course in a molecularly confirmed cohort.
progression:
- phase: Latent stage
  notes: >-
    Normal early development. Nothing distinguishes an affected individual, which is why the
    disease is essentially never diagnosed before the third decade in the absence of a family
    history.
  evidence:
  - reference: PMID:20301376
    reference_title: "Polycystic Lipomembranous Osteodysplasia with Sclerosing Leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The latent stage is characterized by normal early development."
    explanation: GeneReviews definition of stage 1.
- phase: Osseous stage
  age_range: 3rd decade
  notes: >-
    Pain and tenderness, mostly at the ankles and feet, following strain or injury. Fractures
    are typically diagnosed several years after the pain begins, which is the first of the two
    diagnostic delays in this disease.
  evidence:
  - reference: PMID:20301376

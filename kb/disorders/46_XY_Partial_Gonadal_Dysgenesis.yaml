    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the presence of Y chromosomal material serves as a risk factor for malignant
      transformation
    explanation: Supports the Y-bearing dysgenetic gonadal substrate as the tumor risk factor.
  downstream:
  - target: Gonadal germ-cell neoplasia risk
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

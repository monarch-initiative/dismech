discussions:
- discussion_id: gap_xy_pgd_gonad_retention_risk_benefit
  prompt: >-
    In 46,XY partial gonadal dysgenesis with functionally significant residual
    testicular tissue, what is the age-stratified gonadal tumor risk for a
    retained gonad (as opposed to the prevalence found at gonadectomy), how much
    does labioscrotal position and hCG responsiveness modify it, and is any
    surveillance strategy sensitive enough to make gonad retention safe?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Published tumor figures are prevalence-at-gonadectomy in referral cohorts, not
    incidence in retained gonads, and are therefore the wrong denominator for the
    decision clinicians actually face. Because partial disease — unlike complete
    disease — offers a genuine functional reason to retain gonads, this denominator
    problem is decision-critical rather than academic. No validated surveillance
    protocol exists, and imaging and tumor markers are known to miss lesions.
  attaches_to:
  - pathophysiology#Gonadal germ-cell neoplasia risk
  - pathophysiology#Residual pubertal gonadal steroid capacity
  proposed_experiments:
  - experiment_id: exp_xy_pgd_retained_gonad_incidence
    name: Prospective registry follow-up of retained gonads in 46,XY partial gonadal dysgenesis
    description: >-
      Follow retained gonads prospectively within a multinational DSD registry using
      protocolized imaging, tumor markers, and (where performed) biopsy, reporting
      neoplasia incidence per gonad-year stratified by gonadal position and
      hCG-stimulated testosterone response, rather than prevalence at gonadectomy.
  - experiment_id: exp_xy_pgd_ihc_germ_cell_marker_triage
    name: Immunohistochemical germ-cell marker triage of gonadal biopsy material
    description: >-
      Evaluate whether immunohistochemical germ-cell markers (for example OCT3/4,
      TSPY, SALL4) on gonadal biopsy material can stratify premalignant risk well
      enough to serve as a triage test for gonad retention versus removal.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      though further study is needed to determine the risk of developing gonadal
      tumors.
    explanation: The cohort's own authors identify this precise gap.
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the limitation of tumor markers and US or MRI/CT to detect them and missing
      guidelines for surveillance.
    explanation: Directly documents the absence of a reliable surveillance strategy.
- discussion_id: gap_xy_pgd_molecular_yield
  prompt: >-
    What accounts for the roughly half of 46,XY partial gonadal dysgenesis cases
    that remain molecularly unexplained after panel and exome testing — non-coding
    regulatory variation, oligogenic burden, mosaicism confined to the gonad, or
    genes not yet implicated?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Diagnostic yield has plateaued near 40-50% despite broad sequencing. The
    documented digenic DHX37/NR5A1 cases and the dosage-sensitive SOX9 enhancer
    architecture both suggest that single-gene coding analysis is structurally
    unable to capture the remainder.
  attaches_to:
  - pathophysiology#Attenuated pro-testis network activation
  proposed_experiments:
  - experiment_id: exp_xy_pgd_enhancer_genome_sequencing
    name: Genome sequencing with targeted gonadal-enhancer interrogation
    description: >-
      Apply genome sequencing to exome-negative partial-dysgenesis cases with
      explicit interrogation of known gonadal enhancer regions, including the
      testis-specific enhancers upstream of SOX9, to test whether non-coding
      regulatory variation explains part of the diagnostic gap.
  - experiment_id: exp_xy_pgd_gonadal_mosaicism_sequencing
    name: Deep sequencing of gonadal tissue for gonad-confined mosaicism
    description: >-
      Deep-sequence gonadal tissue obtained at gonadectomy alongside matched blood
      to test whether mosaic variants confined to the gonad account for cases
      undiagnosed on peripheral-blood testing.
  evidence:
  - reference: PMID:37240737
    reference_title: "DHX37 and NR5A1 Variants Identified in Patients with 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      approximately 50% of all cases remain elusive.
    explanation: Directly quantifies the unexplained fraction.
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genetic etiology was identified in 42% of the cohort
    explanation: Confirms the plateaued diagnostic yield in a large contemporary cohort.
  - reference: PMID:35249806
    reference_title: Genetics of 46,XY gonadal dysgenesis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A minority of all cases of GD are associated with pathogenic variants in
      key players of testis-determination, SRY, SOX9, MAP3K1 and NR5A1. However,
      most of the cases remain unexplained.
    explanation: >-
      An expert review independently confirms that established testis-determining
      genes account for only a minority of cases.
- discussion_id: mismatch_xy_pgd_nr5a1_mouse_model_divergence
  prompt: >-
    Do mouse Nr5a1 models faithfully reproduce the human NR5A1 gonadal phenotype,
    given that the same p.R92W substitution induces testicular development in
    human 46,XX gonads but produces no masculinization in XX mice?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: >-
    NR5A1 is the gene most characteristically implicated in 46,XY partial gonadal
    dysgenesis, so the fidelity of its animal models directly determines how much
    mechanistic weight mouse data can carry for this disease. A direct
    human-versus-mouse comparison of the identical p.R92W allele found the gonadal
    consequence to be species-divergent: disruption of male gonadal development in
    both, but ovary-to-testis conversion only in humans. This means the
    NR5A1-dependent sex-determination network is not fully conserved, and murine
    rescue or knockout results should not be treated as directly predictive of
    the human partial phenotype's severity or threshold behavior. Evidence exists
    in the model; what is uncertain is its translational validity.
  attaches_to:
  - pathophysiology#Attenuated pro-testis network activation
  proposed_experiments:
  - experiment_id: exp_xy_pgd_human_gonadal_organoid_nr5a1_dosage
    name: Human gonadal organoid or iPSC titration of NR5A1 dosage
    description: >-
      Titrate NR5A1 dosage and introduce patient-specific alleles in
      human-derived gonadal somatic cell models (iPSC-derived or fetal gonadal
      organoid) to establish the human-specific dose-response threshold that
      separates partial from complete testis-determination failure, and compare
      it directly against the corresponding murine threshold.
  evidence:
  - reference: PMID:27833742
    reference_title: "The p.R92W variant of NR5A1/Nr5a1 induces testicular development of 46,XX gonads in humans, but not in mice: phenotypic comparison of human patients and mutation-induced mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, mutation-positive XX mice showed no signs of masculinization.
    explanation: >-
      Directly documents the species divergence for the identical allele that
      masculinizes human 46,XX gonads.
  - reference: PMID:27833742
    reference_title: "The p.R92W variant of NR5A1/Nr5a1 induces testicular development of 46,XX gonads in humans, but not in mice: phenotypic comparison of human patients and mutation-induced mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings provide novel insights into the conservation and divergence in
      the molecular networks
    explanation: >-
      The authors frame the result explicitly in terms of network conservation
      versus divergence, which is the translational-validity question this
      record tracks.

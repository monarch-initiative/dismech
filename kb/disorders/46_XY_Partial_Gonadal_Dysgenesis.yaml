- name: Dysgenetic Y-bearing germ-cell niche
  role: central_effector
  biological_scale: TISSUE
  description: >-
    Germ cells arrested in a poorly differentiated gonadal environment containing
    Y-chromosome material can escape normal maturation and give rise to
    gonadoblastoma and then invasive germ-cell tumor. Partial dysgenesis carries a
    lower but still substantially elevated risk compared with complete dysgenesis,
    and the risk is further graded by gonadal position, being lowest in scrotal
    gonads.
  cell_types:
  - preferred_term: germ cell
    term:
      id: CL:0000586
      label: germ cell
  evidence:

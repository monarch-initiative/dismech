- name: Inhibin B
  presence: DECREASED
  context: >-
    Inhibin B is the other Sertoli-cell product used alongside AMH to gauge
    gonadal reserve. It is reduced in 46,XY DSD with genital ambiguity, and has
    been proposed as the more discriminating of the two between DSD categories.
    As with AMH, no partial-gonadal-dysgenesis-specific reference values were
    located, so this record is qualitative.
  readouts:
  - target: Incomplete testicular differentiation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low inhibin B indexes reduced functional Sertoli-cell mass and therefore the
      degree of testicular differentiation failure.
    evidence:
    - reference: PMID:35137906
      reference_title: "Leydig and Sertoli cell function in individuals with genital ambiguity, 46,XY karyotype, palpable gonads and normal testosterone secretion: a case-control study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AMH and inhibin B levels were significantly lower in cases than in
        controls
      explanation: >-
        Supports reduced Sertoli-cell output in 46,XY DSD with ambiguous genitalia;

- name: Residual pubertal gonadal steroid capacity
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    Retained dysgenetic gonads may respond to pubertal gonadotropin drive. This is
    the single most clinically consequential difference from complete gonadal
    dysgenesis, because it means an individual with retained gonads may either
    complete puberty spontaneously (an advantage if raised male) or virilize
    against the sex of rearing (a harm if raised female). Whether residual
    function exists is partly predictable before puberty from gonadal position and
    the testosterone response to hCG stimulation. Where residual function is
    inadequate, hypergonadotropic hypogonadism supervenes.
  cell_types:

    reported zygosity is mixed (one patient heterozygous, the other carrying a
    heterozygous plus a homozygous variant)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Evidence rests on two reported patients; gene-disease validity for the partial
    phenotype specifically is not established, and the source does not separate
    partial from complete presentations. The complete-form entry declined to
    promote ZFPM2 on gene-validity grounds; it is retained here only as a
    provisional subtype, explicitly flagged as emerging.
  evidence:
  - reference: PMID:24549039
    reference_title: Mutations in the FOG2/ZFPM2 gene are associated with anomalies of human testis determination.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      the failure of testis development in these cases could be explained by the
      impaired ability of the mutant FOG2 proteins to interact with a known
      regulator of early testis development, GATA4.
    explanation: >-
      Provides functional support for the FOG2-GATA4 mechanism in two patients;
      the small n and lack of partial/complete separation keep this PARTIAL.
environmental: []
histopathology:
- name: Dysgenetic testis with hypoplastic seminiferous tubules
  description: >-
    The defining histology of partial disease. Unlike the homogeneous fibrous
    streak tissue of complete gonadal dysgenesis, the gonad contains recognizable
    seminiferous tubules that are hypoplastic and disorganized. Establishing this
    distinction on the gonadectomy specimen is what confirms partial rather than
    complete disease.
  diagnostic: true
  evidence:
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypoplastic seminiferous tubules seen under the microscope, consistent with
      the dysplastic testicular tissue.
    explanation: Directly documents the hypoplastic-tubule histology.
- name: Gonadoblastoma and germ cell neoplasia in situ in dysgenetic gonads
  description: >-
    Resected gonads may harbor precursor lesions or invasive tumor. Because
    neoplasia can be focal, a limited biopsy with benign histology is not a
    reliable exclusion test.
  diagnostic: false
  evidence:
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pre-invasive tumors such as germ cell neoplasia in situ (GCNIS) or
      gonadoblastoma, which is commonly observed in complete or partial dysgenesis
    explanation: Directly supports precursor lesions in partial dysgenesis.
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tissue samples had been previously taken laparoscopically with benign
      histology.
    explanation: >-
      Illustrates that a limited laparoscopic biopsy reported as benign can precede
      a later tumour. Graded PARTIAL and flagged for provenance: this patient in
      the cited series had complete androgen insensitivity, not partial gonadal
      dysgenesis, so the sampling-limitation principle transfers but the tumour
      substrate and risk are not those of a dysgenetic gonad.
imaging_findings:
- name: Variable or absent Müllerian structures
  modality: MRI
  diagnostic: false
  description: >-
    Because AMH output is partial, Müllerian derivatives may be absent,
    rudimentary, or present. Imaging must therefore establish rather than assume
    the internal anatomy — the opposite of the expectation in complete gonadal
    dysgenesis.
  evidence:
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pelvic magnetic resonance imaging showed absence of uterus and ovaries.
    explanation: >-
      In this partial case MRI reported no uterus while ultrasound in the same
      workup reported a probable primordial uterus, so modalities can disagree on
      small Müllerian remnants and a single negative study should not be read as
      proof of regression.
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypoechoic mass (considered primordial uterus) in posterior bladder
    explanation: >-
      The discordant ultrasound finding from the same case, documenting a
      rudimentary Müllerian remnant.
- name: Inguinal or intra-abdominal dysgenetic gonads
  modality: ULTRASOUND
  diagnostic: false
  description: >-
    Gonads are frequently undescended and identifiable in the inguinal canal or
    abdomen. Gonadal position matters beyond localization: labioscrotal position
    predicts residual function and lower tumor risk.
  evidence:
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The abdominopelvic ultrasound revealed bilateral testicle in bilateral
      groin.
    explanation: Directly documents inguinal gonads on ultrasound.
diagnosis:
- name: Integrated clinical, endocrine, and karyotypic assessment
  description: >-
    Assess external genital anatomy, gonadal palpability and position, family
    history, and syndromic features (renal, neurological), alongside
    age-appropriate FSH, LH, testosterone, and AMH. Confirm a nonmosaic 46,XY
    karyotype, since 45,X/46,XY mixed gonadal dysgenesis is the principal
    chromosomal mimic.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Atypical genitalia with a 46,XY karyotype and biochemical evidence of partial gonadal function.
  evidence:
  - reference: PMID:36424806
    reference_title: "Diagnostic approach in 46, XY DSD: an endocrine society of bengal (ESB) consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We recommend formal Karyotyping, even if Y chromosome material has been
      detected by other methods.
    explanation: Supports formal karyotyping as part of the 46,XY DSD workup.
- name: hCG stimulation test for residual Leydig-cell function
  description: >-
    Human chorionic gonadotropin stimulation quantifies residual Leydig-cell
    testosterone capacity. In partial gonadal dysgenesis this is not merely a
    diagnostic discriminator against androgen-synthesis defects but a prognostic
    test, since the response predicts spontaneous puberty and therefore informs
    gonad-retention and sex-of-rearing discussions.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: A preserved testosterone rise indicates functionally significant residual testicular tissue.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      testosterone response to human chorionic gonadotropin predicted onset of
      spontaneous puberty.
    explanation: Directly supports the prognostic use of the hCG test.
- name: Abdominopelvic imaging for gonadal position and Müllerian anatomy
  description: >-
    Ultrasound, supplemented by MRI where indeterminate, locates the gonads and
    establishes whether Müllerian derivatives are present — which, unlike in
    complete disease, cannot be assumed.
  diagnosis_term:
    preferred_term: Ultrasound
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:36424806
    reference_title: "Diagnostic approach in 46, XY DSD: an endocrine society of bengal (ESB) consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All patients with 46, XY DSD should undergo abdominopelvic ultrasonography
      by a trained radiologist.
    explanation: Directly supports ultrasound in the diagnostic workup.
- name: Broad molecular testing including WT1
  description: >-
    Stepwise copy-number analysis followed by a DSD gene panel or exome/genome
    sequencing. WT1 deserves specific emphasis: it should be tested promptly in
    46,XY gonadal dysgenesis even when no renal abnormality has been found,
    because a positive result triggers nephropathy and Wilms tumor surveillance.
    A negative result does not exclude the clinical diagnosis, since roughly half
    of cases remain molecularly unexplained.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25613702
    reference_title: "WT1 deletion leading to severe 46,XY gonadal dysgenesis, Wilms tumor and gonadoblastoma: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      even in the absence of renal abnormality, it is recommended to test promptly
      for WT1 defects in 46,XY gonadal dysgenesis.
    explanation: Directly supports prompt WT1 testing regardless of renal findings.
  - reference: PMID:36424806
    reference_title: "Diagnostic approach in 46, XY DSD: an endocrine society of bengal (ESB) consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic studies, which include copy number variation (CNV) or molecular
      testing of a candidate gene or next generation sequencing then should be
      ordered in a stepwise manner
    explanation: Supports the stepwise molecular strategy.
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of WT1 disorder is established in a proband with suggestive
      clinical findings and a heterozygous pathogenic variant in WT1 identified by
      molecular genetic testing.
    explanation: >-
      Supplies the GeneReviews diagnostic criterion for the WT1 subtype: molecular
      confirmation, not clinical impression, establishes it.
- name: Gonadal histopathology to confirm partial rather than complete dysgenesis
  description: >-
    Histological demonstration of hypoplastic seminiferous tubules — as opposed to
    homogeneous fibrous streak tissue — establishes the partial phenotype and
    should be accompanied by assessment for gonadoblastoma and germ cell neoplasia
    in situ.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathology show testes dysgenesis, composed mainly of hypoplastic
      seminiferous tubules
    explanation: Directly supports histology as the confirmatory test for partial disease.
differential_diagnoses:
- name: 46,XY complete gonadal dysgenesis
  description: >-
    The principal contrast. In the complete form, testis determination fails
    entirely: gonads are bilateral fibrous streaks, fetal AMH and androgen are
    absent, external genitalia are typically female, Müllerian structures uniformly
    persist with a uterus, and there is no residual gonadal function to drive
    spontaneous puberty or unwanted virilization. Gonadal histology and evidence of
    any residual fetal or pubertal testicular hormone output distinguish the two.
    Tumor risk is higher in the complete form.
  disease_term:
    preferred_term: 46,XY complete gonadal dysgenesis
    term:
      id: MONDO:0010765
      label: 46,XY complete gonadal dysgenesis
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gonadal pre-/malignancy was found in 33.8% in CGD, 19.7% in PGDf, and 8.8%
      in PGDm.
    explanation: >-
      A single cohort scoring both entities documents the tumor-risk gradient that
      separates them.
  - reference: PMID:28504475
    reference_title: "MAP3K1-related gonadal dysgenesis: Six new cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of these individuals presented with complete gonadal dysgenesis,
      characterized by bilateral streak gonads with typical internal and external
      female genitalia, while the other three presented with partial gonadal
      dysgenesis, characterized by incomplete testicular development
    explanation: >-
      Directly contrasts the two phenotypes within one gene's spectrum — the
      cleanest available statement of the distinction.
- name: 45,X/46,XY mixed gonadal dysgenesis
  description: >-
    Mixed gonadal dysgenesis presents with similarly ambiguous genitalia and is
    the single most important mimic, but it is a sex-chromosome DSD. The
    distinction is made by formal karyotype with adequate cell counts, NOT by
    gonadal asymmetry: an asymmetric pair (a dysgenetic testis on one side and a
    streak on the other) is classically described in mixed gonadal dysgenesis but
    occurs in 46,XY partial gonadal dysgenesis too, so it does not separate the
    two.
  evidence:
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      sex chromosome DSD (Klinefelter or Turner Syndrome, chimerism), XX-DSD, and
      46 XY-DSD
    explanation: >-
      Supports separation of sex-chromosome DSD from 46,XY DSD; the asymmetric
      gonadal detail is clinical synthesis.
- name: Partial androgen insensitivity syndrome
  description: >-
    PAIS produces overlapping genital ambiguity but the gonads are normally
    differentiated testes: AMH is normal or high, Müllerian structures are absent,
    and testosterone is normal or elevated with a normal or exaggerated hCG
    response. In practice the two are readily conflated, and cohorts often carry a
    combined "partially virilized 46,XY DSD" label until molecular testing
    resolves them.
  evidence:
  - reference: PMID:31745530
    reference_title: "Next-Generation Sequencing Reveals Novel Genetic Variants (SRY, DMRT1, NR5A1, DHH, DHX37) in Adults With 46,XY DSD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      partially virilized 46,XY DSD (pvDSD) (n = 25), a group that included partial
      gonadal dysgenesis and those with a broad "partial androgen insensitivity
      syndrome" label.
    explanation: >-
      Directly documents the clinical conflation of partial gonadal dysgenesis with
      PAIS, motivating molecular resolution.
- name: 46,XY androgen synthesis disorders
  description: >-
    5-alpha-reductase 2 deficiency, 17-beta-hydroxysteroid dehydrogenase 3
    deficiency, and steroidogenic block disorders cause undervirilization despite
    differentiated testes. Normal AMH with a characteristic steroid-precursor
    profile after hCG distinguishes them from failure of testis determination.
  evidence:
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      46 XY-DSD (disorders of testicular development and disorders of androgen
      synthesis or action)
    explanation: Supports the mechanistic distinction within 46,XY DSD.
- name: Ovotesticular disorder of sex development
  description: >-
    Ovotesticular DSD also produces ambiguous genitalia in a dysgenetic-appearing
    gonadal setting, but is defined by the presence of both ovarian follicular and
    testicular tubular tissue in the same individual. Only careful histological
    examination of the whole gonad separates it from partial gonadal dysgenesis.
  evidence:
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      primary ovarian insufficiency and ovotesticular DSD in 46, XX individuals.
    explanation: >-
      Establishes ovotesticular DSD as a distinct entity within the same gene's
      phenotypic spectrum; the histological criterion is clinical synthesis.
- name: Testicular regression syndrome
  description: >-
    Testicular regression reflects loss of previously differentiated testicular
    tissue rather than failure to differentiate it. The distinction can be
    genuinely difficult, and DHX37 variants are found in both cohorts, so the two
    are best regarded as adjacent points on a spectrum of testis-development
    failure.
  evidence:
  - reference: PMID:37240737
    reference_title: "DHX37 and NR5A1 Variants Identified in Patients with 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including complete and partial GD (PGD) and testicular regression syndrome
      (TRS)
    explanation: >-
      Places testicular regression syndrome alongside partial dysgenesis in the
      same disease group with shared genetic causes.
treatments:
- name: Individualized gonadal management (retention versus gonadectomy)
  action_category: THERAPEUTIC
  description: >-
    Gonadal management in partial disease is materially different from the
    complete form, where nonfunctional gonads are removed without a functional
    trade-off. Here the gonads may carry genuine endocrine value, so the decision
    balances tumor risk against retained function and must be individualized.
    Factors favoring retention include labioscrotal gonad position, a preserved
    hCG-stimulated testosterone response, and male sex of rearing, all of which
    associate with both lower tumor risk and a real prospect of spontaneous
    puberty. Factors favoring gonadectomy include intra-abdominal position, absent
    residual function, female sex of rearing (where retained gonads risk unwanted
    virilization in 42%), and a WT1 genotype. There is no validated surveillance
    protocol for retained gonads — imaging and tumor markers are unreliable — so
    retention entails accepting an unmonitorable residual risk, which should be
    disclosed. Decisions should be made by an experienced multidisciplinary team
    with developmentally appropriate patient participation.
  treatment_term:
    preferred_term: orchiectomy
    term:
      id: NCIT:C15288
      label: Orchiectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Dysgenetic Y-bearing germ-cell niche
    treatment_effect: INHIBITS
    description: Gonadectomy removes the tumor-susceptible Y-bearing dysgenetic tissue.
    evidence:
    - reference: PMID:32352694
      reference_title: WT1 Disorder.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Prevent whenever possible gonadoblastoma by prophylactic gonadectomy in
        those with a disorder of testicular development.
      explanation: Supports prophylactic gonadectomy as the tumor-prevention intervention.
  target_phenotypes:
  - preferred_term: Gonadoblastoma
    term:
      id: HP:0000150
      label: Gonadoblastoma
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many PGD patients with preserved gonads have the potential to develop
      puberty spontaneously, though further study is needed to determine the risk
      of developing gonadal tumors.
    explanation: >-
      Directly supports the retention-versus-removal trade-off and the unresolved
      tumor risk that makes it a judgment rather than a protocol.
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient underwent bilateral orchiectomy at age 12 years and was given a
      feminizing hormonal treatment of 0.5 mg/day of estradiol valerate tablets.
    explanation: >-
      A worked example of gonadectomy chosen in an individual raised female who was
      virilizing.
- name: Sex-steroid replacement concordant with sex of rearing
  action_category: THERAPEUTIC
  description: >-
    Replacement is needed when residual gonadal function is inadequate or after
    gonadectomy, and the steroid chosen follows the sex of rearing rather than the
    karyotype. Individuals raised female receive estrogen (with progestogen if an
    endometrium-bearing uterus is present); individuals raised male receive
    testosterone. Two features are distinctive to partial disease. First,
    replacement is often only partially required, since residual function may carry
    a patient part of the way through puberty. Second, in individuals raised female
    with retained gonads, estrogen may be given specifically to counter unwanted
    endogenous virilization — a therapeutic problem that does not arise in the
    complete form. Induction should be individualized and multidisciplinary; regimen
    detail is extrapolated from broader congenital gonadal-hormone-deficiency
    guidance rather than from partial-dysgenesis-specific trials.
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:23965
        label: estradiol
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  target_mechanisms:
  - target: Residual pubertal gonadal steroid capacity
    treatment_effect: BYPASSES
    description: >-
      Exogenous sex steroid supplements or replaces inadequate residual gonadal
      output.
    evidence:
    - reference: PMID:35353710
      reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        recommendations for puberty induction with oestrogen or testosterone.
      explanation: Supports sex-steroid induction for gonadal hormone deficiency.
  target_phenotypes:
  - preferred_term: Delayed puberty
    term:
      id: HP:0000823
      label: Delayed puberty
  - preferred_term: Hypergonadotropic hypogonadism
    term:
      id: HP:0000815
      label: Hypergonadotropic hypogonadism
  evidence:
  - reference: PMID:35353710
    reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Puberty induction should be individualised but considered at 11 years in
      girls
    explanation: Supports individualized, timely pubertal induction.
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient recovered well after surgery and hormonal treatment and had a
      regression in hirsutism and clitoromegaly.
    explanation: >-
      Documents estrogen replacement reversing virilization in an individual raised
      female.
- name: Genital reconstructive surgery
  action_category: THERAPEUTIC
  description: >-
    Hypospadias repair and orchidopexy may be undertaken in individuals raised
    male; genitoplasty may be considered in those raised female. This is the most
    contested aspect of care: the field has moved away from early corrective
    surgery toward deferral, careful diagnosis, family education, and
    individualized decisions by a multidisciplinary team, with long-term outcome
    data remaining conflicting. Orchidopexy has an additional rationale here beyond
    cosmesis and fertility, since a palpable scrotal gonad is more amenable to
    examination and is associated with lower tumor risk.
  treatment_term:
    preferred_term: orchiopexy
    term:
      id: NCIT:C111066
      label: Orchiopexy
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:23276787
    reference_title: Review and management of 46,XY disorders of sex development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The focus of treatment has shifted from early gender assignment and
      corrective surgery to careful diagnosis, proper education of patients and
      their families, and individualized treatment by a multi-disciplinary team.
    explanation: Directly supports the shift away from early corrective surgery.
  - reference: PMID:23276787
    reference_title: Review and management of 46,XY disorders of sex development.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Conflicting data on long-term outcomes of these individuals have been
      reported in the literature.
    explanation: Supports genuine outcome uncertainty rather than a settled surgical standard.
- name: Renal surveillance and Wilms tumor monitoring
  action_category: MONITORING
  description: >-
    Applies specifically to the WT1-related subtype. Monitor for proteinuria every
    six months to age ten and yearly thereafter, and screen for Wilms tumor every
    three months to age seven. Critically, the glomerulopathy must NOT be treated
    with immunosuppressants, which are ineffective and potentially toxic;
    renin-angiotensin-aldosterone system inhibition is the preferred approach.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monitor for first appearance of the following: proteinuria every six months
      until age ten years, yearly thereafter; Wilms tumor every three months until
      age seven years
    explanation: Directly supplies the surveillance schedule for the WT1 subtype.
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Avoid treating glomerulopathy with immunosuppressants, as they are not
      effective and potentially toxic.
    explanation: >-
      A GeneReviews agents-to-avoid warning that materially changes management in
      this subtype.
- name: Long-term endocrine, growth, and developmental follow-up
  action_category: MONITORING
  description: >-
    Follow-up should continue well past pubertal completion. Gonadotropins drift
    upward over years even in individuals who virilized spontaneously, so
    periodic FSH, LH, and testosterone assessment is needed to detect emerging
    androgen deficiency and start replacement. Growth prognosis is generally good
    and does not itself require intervention. A long-term series also found
    cognitive impairment in a minority and recommended screening for learning
    disabilities; that observation comes from a single small cohort and should be
    treated as a prompt to remain alert rather than an established disease
    feature.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25580123
    reference_title: Long-Term Follow-Up of Patients with 46,XY Partial Gonadal Dysgenesis Reared as Males.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the last evaluation, FSH was high or high-normal in 8/10; LH was high or
      high-normal in 5/10; testosterone was decreased in one.
    explanation: >-
      Documents late gonadotropin elevation and emerging androgen deficiency,
      justifying ongoing endocrine surveillance.
  - reference: PMID:25580123
    reference_title: Long-Term Follow-Up of Patients with 46,XY Partial Gonadal Dysgenesis Reared as Males.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Though additional studies are required, screening for learning disabilities
      is advisable.
    explanation: >-
      The authors' own hedged recommendation from a 10-patient series; graded
      PARTIAL because the cognitive finding is not an established feature of the
      disease.
- name: Gene-specific genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counseling must be gene-specific. NR5A1 families require explicit discussion of
    markedly incomplete penetrance (<50%) and intrafamilial variability, so an
    unaffected carrier parent or sibling is expected rather than surprising. MAP3K1
    identification should prompt DSD evaluation of female siblings. WT1 findings
    convert counseling into active surveillance. Digenic DHX37/NR5A1 findings
    complicate simple recurrence arithmetic. DHH families should be counseled about
    later neuropathy.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:28504475
    reference_title: "MAP3K1-related gonadal dysgenesis: Six new cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a MAP3K1 variant should prompt an evaluation for DSD in
      female siblings of the proband.
    explanation: Supplies a gene-specific cascade-testing recommendation.
  - reference: PMID:33296094
    reference_title: "NR5A1 c.991-1G > C splice-site variant causes familial 46,XY partial gonadal dysgenesis with incomplete penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation analysis across three generations showed incomplete penetrance
      (<50%) and phenotypic variability among the carriers
    explanation: Supports the penetrance counseling point for NR5A1 families.
- name: Psychosocial support, disclosure, and sex-of-rearing counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Partial gonadal dysgenesis raises sex-of-rearing questions more acutely than
    the complete form, because the genital phenotype is genuinely intermediate and
    endogenous puberty may not match the assigned sex. Sex reassignment later in
    life occurs in a meaningful minority. Care should include staged,
    developmentally appropriate disclosure, psychological and peer support, support
    for autonomy and gender identity, and fertility and sexual-health counseling.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sex was reassigned in 16.1% and 5.3% of individuals with PGDf and PGDm,
      respectively.
    explanation: >-
      Quantifies later sex reassignment, supporting the need for autonomy-centered
      counseling.
  - reference: PMID:35353710
    reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Psychological aspects of puberty and fertility issues are especially
      important to address in individuals with sex development disorders
    explanation: Supports psychosocial and fertility-focused support.

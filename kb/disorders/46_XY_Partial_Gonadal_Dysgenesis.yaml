    explanation: Directly supports use of the hCG-stimulated testosterone response.
- name: Anti-Müllerian hormone
  presence: DECREASED
  context: >-
    AMH is a Sertoli-cell product, so it is expected to index surviving
    Sertoli-cell mass and therefore the degree of testicular differentiation.
    Caveat on the evidence: no partial-versus-complete AMH comparison with
    quotable numbers was found for this entry, so the widely repeated clinical
    expectation that AMH is low-but-detectable in partial disease (versus
    undetectable in the complete form) is stated here as an inference from the
    mechanism, not as an evidenced discriminator. Interpret an individual AMH
    against age- and sex-appropriate assay ranges rather than as a categorical
    partial/complete test.
  readouts:
  - target: Partial fetal AMH secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      AMH indexes surviving Sertoli-cell mass and therefore the degree of
      testicular differentiation.
    evidence:
    - reference: PMID:38206718
      reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        associates with SOX9 to regulate the anti-Müllerian hormone expression,
        which lead to the regression of Müllerian structures.
      explanation: >-
        Supports AMH as the Sertoli-derived signal whose level reflects the
        testicular program; this source states the mechanism rather than reporting
        a measured AMH value.
  evidence:
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SF-1 binds to and activates testis-specific enhancer of SOX9 core (TESCO),
      and associates with SOX9 to regulate the anti-Müllerian hormone expression
    explanation: >-
      Establishes the SF-1/SOX9 control of AMH; graded PARTIAL because the source
      does not report a quantitative AMH level in the partial phenotype.
  - reference: PMID:35137906
    reference_title: "Leydig and Sertoli cell function in individuals with genital ambiguity, 46,XY karyotype, palpable gonads and normal testosterone secretion: a case-control study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AMH and inhibin B levels were significantly lower in cases than in controls
    explanation: >-
      Case-control confirmation that AMH is reduced in 46,XY DSD with genital
      ambiguity and palpable gonads. Graded PARTIAL because the cohort was partial

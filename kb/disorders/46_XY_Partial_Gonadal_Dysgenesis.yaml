name: 46,XY partial gonadal dysgenesis
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >-
  46,XY partial gonadal dysgenesis (46,XY PGD) is a genetically heterogeneous
  disorder of testis determination in which an individual with a nonmosaic 46,XY
  karyotype develops incompletely rather than absently differentiated testes.
  The defining contrast with 46,XY complete gonadal dysgenesis is that residual
  testicular tissue persists: dysgenetic testes with hypoplastic seminiferous
  tubules retain partial fetal Sertoli-cell (anti-Müllerian hormone) and
  Leydig-cell (androgen) output. Because fetal androgen exposure is partial
  rather than absent, external genitalia are typically ambiguous — spanning
  almost-female to almost-male — instead of typically female, and Müllerian
  regression is partial and variable rather than uniformly failed. Most
  individuals present with atypical genitalia in infancy. Retained gonads drive
  spontaneous puberty in most individuals raised male (80% of those with at least
  one gonad), and unwanted virilization in a substantial minority raised female
  (42% of those with gonads). Y-bearing dysgenetic gonadal tissue confers
  gonadoblastoma and invasive germ-cell tumor risk, which is real but lower than
  in the complete form.
disease_term:
  preferred_term: 46,XY partial gonadal dysgenesis
  term:
    id: MONDO:0016674
    label: 46,XY partial gonadal dysgenesis
synonyms:
- 46,XY PGD
- 46,XY partial testicular dysgenesis
- partial gonadal dysgenesis
parents:
- Disorder of sex development
- Gonadal development disorder
definitions:
- name: 46,XY partial gonadal dysgenesis case definition
  definition_type: CASE_DEFINITION
  description: >-
    The modeled disease requires a nonmosaic 46,XY karyotype and incomplete
    testis determination, evidenced by histologically dysgenetic but present
    testicular tissue and/or partial fetal testicular hormone output. The
    external genital phenotype is typically ambiguous rather than typically
    female, and Müllerian structures may be partially retained.
  scope: >-
    This entry models the partial phenotype specifically. 46,XY complete gonadal
    dysgenesis (Swyer syndrome, bilateral streak gonads with typical female
    genitalia and full Müllerian persistence) is a distinct entity curated
    separately; 45,X/46,XY mixed gonadal dysgenesis is a sex-chromosome DSD;
    testicular regression syndrome, ovotesticular DSD, androgen insensitivity,
    and androgen synthesis defects are differential diagnoses. Gene-anchored
    subtypes whose published spectrum spans partial and complete disease are
    included here only for their partial presentations.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      46,XY gonadal dysgenesis is classified as complete (CGD) or partial (PGD)
      subtypes.
    explanation: >-
      Establishes the complete/partial dichotomy that this entry's case
      definition operationalizes.
  - reference: PMID:28504475
    reference_title: "MAP3K1-related gonadal dysgenesis: Six new cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the other three presented with partial gonadal dysgenesis, characterized
      by incomplete testicular development
    explanation: >-
      Supplies the defining "incomplete testicular development" criterion that
      distinguishes partial from complete disease.

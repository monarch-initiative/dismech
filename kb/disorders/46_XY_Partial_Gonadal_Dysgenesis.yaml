biochemical:
- name: Follicle-stimulating hormone
  presence: INCREASED
  context: >-
    FSH is elevated when residual gonadal function is insufficient, reflecting
    loss of inhibin B and steroid feedback. FSH may be normal in individuals with
    well-preserved residual function, so a normal value does not exclude the
    diagnosis.
  biomarker_term:
    preferred_term: Follicle stimulating hormone
    term:
      id: CHEBI:81569
      label: Follicle stimulating hormone
  readouts:
  - target: Residual pubertal gonadal steroid capacity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated FSH reports inadequate residual gonadal function; a normal FSH is
      compatible with preserved function.
    evidence:

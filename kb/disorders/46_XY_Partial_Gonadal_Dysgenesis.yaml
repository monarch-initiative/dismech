definitions:
- name: 46,XY partial gonadal dysgenesis case definition
  definition_type: CASE_DEFINITION
  description: >-
    A 46,XY karyotype with evidence of incomplete or disordered testicular development, assessed through
    the genital phenotype, endocrine function, histology when available, and molecular findings. Atypical
    external genitalia are common but are not obligatory: the I-DSD study also included individuals with
    female external genitalia, absent uterus, and evidence of gonadal dysfunction. No single hormone value
    or histological pattern separates every partial and complete presentation.
  scope: >-
    This entry covers partial gonadal dysgenesis, including gene-specific syndromic forms. Complete gonadal
    dysgenesis, 45,X/46,XY mosaicism, ovotesticular DSD, testicular regression, androgen insensitivity,
    and steroid synthesis defects require distinction. A blood 46,XY result does not exclude low-level
    or tissue-confined sex-chromosome mosaicism.
  evidence:
  - reference: PMID:40208111
    reference_title: >-
      Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A small group of patients (n = 10) had typical female genitalia but without a uterus and evidence
      of gonadal dysfunction from biochemical, genetic, or histological investigations.
    explanation: The registry explicitly included this exception to an atypical-genitalia definition.
  - reference: PMID:40208111
    reference_title: >-
      Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      As 46,XY PGD is a heterogeneous disorder without clearly defined diagnostic criteria, we used the
      diagnostic criteria from a previous study which requires evidence of testicular dysgenesis, either
      in a biochemical test (e.g., low testosterone response after hCG stimulation, low AMH or inhibin
      B), histology findings, or a genetic defect associated with GD (8).
    explanation: >-
      Documents the study-specific combination of clinical, biochemical, histological and genetic criteria.
  - reference: PMID:40208111
    reference_title: >-
      Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Furthermore, standard karyotyping techniques may miss mosaicism such as 46,XY/45,X.
    explanation: >-
      The registry authors explicitly identify a limitation of conventional karyotyping; a blood result
      does not exclude every mosaic cell line.

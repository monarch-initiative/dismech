  description: >-
    Pathogenic MAP3K1 variants increase phosphorylation of ERK1, ERK2, and p38 and
    hyperactivate Wnt4/beta-catenin/FOXL2 signaling, biasing the bipotential gonad
    toward the ovarian program. Where the bias is incomplete, testis determination
    is attenuated rather than abolished, yielding partial dysgenesis.

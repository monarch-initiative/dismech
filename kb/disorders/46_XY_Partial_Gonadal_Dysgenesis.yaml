- name: Testosterone response to hCG stimulation
  presence: ABNORMAL
  context: >-
    Unlike complete gonadal dysgenesis, where the gonad cannot respond, the hCG
    stimulation test in partial disease measures genuinely variable residual
    Leydig-cell capacity. Its value is prognostic as well as diagnostic: the
    testosterone response predicts whether spontaneous puberty will occur.
  biomarker_term:
    preferred_term: testosterone
    term:
      id: CHEBI:17347
      label: testosterone
  readouts:
  - target: Residual pubertal gonadal steroid capacity
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      A preserved testosterone rise after hCG predicts spontaneous pubertal onset;
      a blunted response predicts the need for induction.
    evidence:
    - reference: PMID:40208111
      reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        testosterone response to human chorionic gonadotropin predicted onset of
        spontaneous puberty.
      explanation: Directly establishes the prognostic value of the hCG test.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Labioscrotal gonads at presentation and testosterone response to human

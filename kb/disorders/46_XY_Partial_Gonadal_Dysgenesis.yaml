    explanation: >-
      Directly links partial (heterozygous) loss of SF-1 function to the mild,
      residual-function end of the phenotype spectrum.
  - reference: PMID:30552336
    reference_title: Human sex reversal is caused by duplication or deletion of core enhancers upstream of SOX9.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      All three enhancers showed synergistic activity and together drive SOX9 in

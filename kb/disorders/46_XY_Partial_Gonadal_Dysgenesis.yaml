- name: DHH paracrine hedgehog signaling failure
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic DHH loss removes Sertoli-derived hedgehog signaling to the
    interstitial compartment, impairing fetal Leydig-cell and peritubular
    myoid-cell development. Because the supporting-cell lineage itself still forms,
    the gonad is dysgenetic rather than streak. The same signal is required for
    perineurial development in peripheral nerve, which is why this subtype
    couples partial gonadal dysgenesis with minifascicular neuropathy.

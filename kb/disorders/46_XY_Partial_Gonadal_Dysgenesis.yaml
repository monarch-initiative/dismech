    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Labioscrotal gonads at presentation and testosterone response to human
      chorionic gonadotropin predicted onset of spontaneous puberty.
    explanation: Directly supports predictable residual Leydig function.
  downstream:

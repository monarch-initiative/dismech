has_subtypes:
- name: NR5A1-related PGD
  display_name: NR5A1/SF-1-related 46,XY partial gonadal dysgenesis
  classification: gene
  genes:
  - preferred_term: NR5A1
    term:
      id: hgnc:7983
      label: NR5A1
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:33296094
      reference_title: "NR5A1 c.991-1G > C splice-site variant causes familial 46,XY partial gonadal dysgenesis with incomplete penetrance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Segregation analysis across three generations showed incomplete
        penetrance (<50%) and phenotypic variability among the carriers of NR5A1
        c.991-1G > C.
      explanation: >-
        Multigenerational heterozygous segregation supports dominant transmission
        with reduced penetrance.
  description: >-
    Heterozygous NR5A1 (SF-1) loss-of-function variants are the most frequently
    identified molecular cause in partial disease specifically. Haploinsufficiency
    typically produces the milder end of the testis-development spectrum —
    dysgenetic testes with often spontaneous puberty — and shows marked
    intrafamilial variability and incomplete penetrance. Adrenal function was
    preserved in the partial-dysgenesis series cited here, and most NR5A1 46,XY
    DSD occurs without adrenal insufficiency, but NR5A1/SF-1 also governs adrenal
    development and primary adrenal failure was the presentation in the first
    reported human NR5A1 case. Preserved adrenal function should therefore be
    confirmed rather than assumed.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genetic etiology was identified in 42% of the cohort, with common gene
      defects in SRY and WT1 in CGD and NR5A1 in PGD.
    explanation: >-
      Directly identifies NR5A1 as the gene most characteristically implicated in
      the partial form, in contrast to SRY/WT1 in complete disease.
  - reference: PMID:27463801
    reference_title: "NR5A1 Loss-of-Function Mutations Lead to 46,XY Partial Gonadal Dysgenesis Phenotype: Report of Three Novel Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3 novel NR5A1 mutations were identified in 3 patients with 46,XY partial
      gonadal dysgenesis
    explanation: Directly documents NR5A1 variants in molecularly defined partial disease.
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More commonly, NR5A1 mutations happening in individuals with 46,XY DSD are
      associated with varying severity but without adrenal insufficiency
    explanation: >-
      Supports absent adrenal insufficiency as the usual - but explicitly not
      universal - situation in NR5A1-related 46,XY DSD.
  - reference: PMID:38206718
    reference_title: "NR5A1-related 46,XY partial gonadal dysgenesis: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NR5A1 mutations in humans was first described in a patient with 46,XY DSD,
      Müllerian structures, and primary adrenal failure
    explanation: >-
      Documents that adrenal failure can accompany NR5A1-related 46,XY DSD, which
      is why preserved adrenal function must be confirmed rather than assumed.
- name: MAP3K1-related PGD
  display_name: MAP3K1-related 46,XY partial gonadal dysgenesis
  classification: gene
  genes:
  - preferred_term: MAP3K1
    term:
      id: hgnc:6848
      label: MAP3K1
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:35290982
      reference_title: "Pathogenic Variants in MAP3K1 Cause 46,XY Gonadal Dysgenesis: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Inheritance occurs in a sex-limited, autosomal dominant fashion with
        virtually complete penetrance in 46,XY individuals.
      explanation: Directly supports sex-limited dominant inheritance for this subtype.
  description: >-
    Sex-limited heterozygous gain-of-function MAP3K1 variants account for at least
    4% of nonsyndromic 46,XY gonadal dysgenesis and produce partial as well as
    complete presentations; partial cases characteristically show clitoral
    hypertrophy with otherwise typical female external genitalia. Only partial
    presentations belong in this entry.
  evidence:
  - reference: PMID:28504475
    reference_title: "MAP3K1-related gonadal dysgenesis: Six new cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the other three presented with partial gonadal dysgenesis, characterized by
      incomplete testicular development, resulting in clitoral hypertrophy with
      otherwise typical female external genitalia
    explanation: Directly documents the MAP3K1 partial phenotype and its genital pattern.
  - reference: PMID:35290982
    reference_title: "Pathogenic Variants in MAP3K1 Cause 46,XY Gonadal Dysgenesis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenic variants in the MAP3K1 gene are an important cause of 46,XY
      non-syndromic partial and complete gonadal dysgenesis, accounting for at
      least 4% of cases.
    explanation: Quantifies the MAP3K1 contribution across the partial-to-complete spectrum.
- name: WT1-related PGD
  display_name: WT1-related 46,XY partial gonadal dysgenesis (Denys-Drash/Frasier continuum)
  classification: gene
  genes:
  - preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:32352694
      reference_title: WT1 Disorder.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        WT1 disorder is inherited in an autosomal dominant manner.
      explanation: Directly supports the inheritance mode for WT1-related disease.
  description: >-
    Heterozygous WT1 variants cause a syndromic form in which the disorder of
    testicular development is accompanied by steroid-resistant nephrotic syndrome
    and Wilms tumor predisposition. The historical Denys-Drash and Frasier
    designations are now recognized as a phenotypic continuum. A genotype-severity
    correlation is classically described (missense and intron-9 splice variants
    giving severe dysgenesis; nonsense variants and whole-gene deletions giving
    haploinsufficiency with milder dysgenesis and later-onset nephropathy), but the
    case curated here is a whole-gene deletion that nonetheless caused severe
    partial dysgenesis with gonadoblastoma in infancy and bilateral Wilms tumour,
    and its authors present it as showing the deletion phenotype can be more severe
    than previously thought. The correlation should therefore not be used to
    reassure. A WT1 defect should be sought promptly in 46,XY gonadal dysgenesis
    even without a detected renal abnormality.
  evidence:
  - reference: PMID:25613702
    reference_title: "WT1 deletion leading to severe 46,XY gonadal dysgenesis, Wilms tumor and gonadoblastoma: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a newborn with 46,XY severe partial gonadal dysgenesis
    explanation: Directly documents WT1-associated partial gonadal dysgenesis.
  - reference: PMID:32352694
    reference_title: WT1 Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additional common findings can include disorders of testicular development
      (with or without abnormalities of the external genitalia and/or müllerian
      structures) and Wilms tumor.
    explanation: Supports the syndromic gonadal-plus-renal/oncologic character of this subtype.
- name: DHH-related PGD
  display_name: DHH-related 46,XY partial gonadal dysgenesis with minifascicular neuropathy
  classification: gene
  genes:
  - preferred_term: DHH
    term:
      id: hgnc:2865
      label: DHH
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:11017805
      reference_title: "A novel mutation of desert hedgehog in a patient with 46,XY partial gonadal dysgenesis accompanied by minifascicular neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found, in the patient, a homozygous missense mutation (ATG-->ACG) at
        the initiating codon in exon 1 of the desert hedgehog (DHH) gene
      explanation: Homozygosity with a heterozygous carrier father supports recessive inheritance.
  description: >-
    Biallelic DHH variants impair Sertoli-derived paracrine hedgehog signaling.
    Notably, the partial form is the presentation classically associated with
    minifascicular polyneuropathy, because DHH is also required for peripheral
    nerve perineurial development — an extra-gonadal feature that distinguishes
    this subtype and should prompt neurological evaluation.
  evidence:
  - reference: PMID:11017805
    reference_title: "A novel mutation of desert hedgehog in a patient with 46,XY partial gonadal dysgenesis accompanied by minifascicular neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutation of the DHH gene may cause 46, XY PGD associated with
      minifascicular neuropathy.
    explanation: Directly links biallelic DHH defects to partial disease with neuropathy.
  - reference: PMID:25927242
    reference_title: "46,XY Gonadal Dysgenesis due to a Homozygous Mutation in Desert Hedgehog (DHH) Identified by Exome Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel homozygous R124Q mutation in the desert hedgehog gene
      (DHH)
    explanation: >-
      An independent consanguineous family, so the subtype no longer rests on a
      single 2000 case report.
  - reference: PMID:25927242
    reference_title: "46,XY Gonadal Dysgenesis due to a Homozygous Mutation in Desert Hedgehog (DHH) Identified by Exome Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in DHH play a role in 46,XY gonadal dysgenesis and are associated
      with seminoma formation and a neuropathy with minifascicle formation.
    explanation: >-
      Confirms the gonad-plus-neuropathy pairing and adds seminoma risk to this
      subtype's profile.
- name: DHX37-related PGD
  display_name: DHX37-related 46,XY partial gonadal dysgenesis
  classification: gene
  genes:
  - preferred_term: DHX37
    term:
      id: hgnc:17210
      label: DHX37
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:37240737
      reference_title: "DHX37 and NR5A1 Variants Identified in Patients with 46,XY Partial Gonadal Dysgenesis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In DHX37, the variant p.(Arg308Gln), recurrent associated with DSD, was
        identified in one patient
      explanation: >-
        Supports monoallelic DHX37 variants segregating with partial disease;
        two of the four variant carriers in this series additionally carried an
        NR5A1 variant, so the mode is not uniformly monogenic.
  description: >-
    Heterozygous variants in DHX37, encoding a putative RNA helicase required for
    ribosome biogenesis, cause partial gonadal dysgenesis and testicular
    regression syndrome. The recurrent p.(Arg308Gln) variant is the best-attested
    allele. In a subset of patients a DHX37 variant co-occurs with an NR5A1
    variant, supporting a digenic contribution (see the digenic inheritance
    block).
  evidence:
  - reference: PMID:37240737
    reference_title: "DHX37 and NR5A1 Variants Identified in Patients with 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent studies have identified variants in DHX37, a gene encoding a
      putative RNA helicase essential in ribosome biogenesis and previously
      associated with neurodevelopmental disorders, as a cause of PGD and TRS.
    explanation: Directly establishes DHX37 as a cause of partial gonadal dysgenesis.
  - reference: PMID:31337883
    reference_title: "Pathogenic variants in the DEAH-box RNA helicase DHX37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHX37 pathogenic variants are a new cause of an autosomal dominant form of
      46,XY DSD, including gonadal dysgenesis and TRS, showing that these
      conditions are part of a clinical spectrum.
    explanation: >-
      The primary discovery cohort establishes autosomal dominant inheritance and
      places gonadal dysgenesis and testicular regression on one spectrum.
- name: ZFPM2-related PGD
  display_name: ZFPM2/FOG2-related 46,XY partial gonadal dysgenesis
  classification: gene
  genes:
  - preferred_term: ZFPM2
    term:
      id: hgnc:16700
      label: ZFPM2
  description: >-
    Missense variants in ZFPM2 (FOG2) impair the FOG2-GATA4 interaction required
    for early testis determination. Evidence is limited to a small number of
    patients and this subtype should be regarded as emerging rather than
    established.
  evidence:
  - reference: PMID:24549039
    reference_title: Mutations in the FOG2/ZFPM2 gene are associated with anomalies of human testis determination.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified independent missense mutations in FOG2 in two patients with
      46,XY gonadal dysgenesis.
    explanation: >-
      Supports ZFPM2 as a testis-determination gene in two patients; the report
      does not separate partial from complete presentations, so the subtype is
      curated with restraint.
- name: Molecularly unresolved PGD
  display_name: Molecularly unresolved 46,XY partial gonadal dysgenesis
  classification: molecular
  description: >-
    A majority of individuals meeting the partial case definition receive no
    molecular diagnosis with currently available testing, so an explicitly
    unresolved subtype is retained rather than forcing every case into a
    gene-anchored bin.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genetic etiology was identified in 42% of the cohort
    explanation: >-
      A 42% diagnostic yield implies that most of this large registry cohort
      remained molecularly unresolved.
  - reference: PMID:37240737
    reference_title: "DHX37 and NR5A1 Variants Identified in Patients with 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several genes are known to be involved in sex development pathways, however
      approximately 50% of all cases remain elusive.
    explanation: Directly supports a large molecularly unexplained fraction.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    46,XY partial gonadal dysgenesis is rare and no population-based prevalence
    estimate exists for the partial form specifically. The largest assembled
    series is a multinational registry cohort (210 partial cases), which is a
    referral-ascertained denominator and must not be converted into a population
    rate. The only nationwide estimate that bounds the problem is Danish: 1.5 per
    100,000 live-born females for 46,XY gonadal dysgenesis presenting as a
    phenotypic female. That figure is deliberately NOT adopted as this entry's
    rate, because it ascertains only female-phenotype cases and therefore
    systematically excludes the large partial subgroup raised male; it is a lower
    bound on a different population, not a prevalence for this disease.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with 46,XY GD were identified from the I-DSD Registry
    explanation: >-
      Documents registry-based ascertainment, supporting rarity while explicitly
      not supplying a population rate.
  - reference: PMID:27603905
    reference_title: "Incidence, Prevalence, Diagnostic Delay, and Clinical Presentation of Female 46,XY Disorders of Sex Development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of 46,XY females was 6.4 per 100 000 live born females, and
      for AIS and gonadal dysgenesis, it was 4.1 and 1.5 per 100 000,
      respectively.
    explanation: >-
      A nationwide Danish rate for female-phenotype 46,XY gonadal dysgenesis. It
      bounds rarity but is not adopted as this entry's rate because
      female-only ascertainment excludes partial cases raised male.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most identified molecular causes of partial disease — NR5A1, MAP3K1, WT1,
    DHX37, SOX9-regulatory — are heterozygous and sex-limited dominant, with
    gene-specific penetrance. NR5A1 in particular shows markedly incomplete
    penetrance and intrafamilial phenotypic variability, which complicates
    cascade counseling.
  evidence:
  - reference: PMID:33296094
    reference_title: "NR5A1 c.991-1G > C splice-site variant causes familial 46,XY partial gonadal dysgenesis with incomplete penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation analysis across three generations showed incomplete penetrance
      (<50%) and phenotypic variability among the carriers of NR5A1 c.991-1G > C.
    explanation: Directly documents dominant transmission with reduced penetrance in partial disease.
  - reference: PMID:35290982
    reference_title: "Pathogenic Variants in MAP3K1 Cause 46,XY Gonadal Dysgenesis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inheritance occurs in a sex-limited, autosomal dominant fashion with
      virtually complete penetrance in 46,XY individuals.
    explanation: Supports sex-limited dominant inheritance with gene-specific penetrance for MAP3K1.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic DHH variants cause the recessive partial form, classically with
    minifascicular polyneuropathy.
  evidence:
  - reference: PMID:11017805
    reference_title: "A novel mutation of desert hedgehog in a patient with 46,XY partial gonadal dysgenesis accompanied by minifascicular neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a homozygous missense mutation (ATG-->ACG) at the initiating codon in exon
      1 of the desert hedgehog (DHH) gene
    explanation: Homozygosity in the proband supports recessive inheritance.
- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    In a subset of partial gonadal dysgenesis, pathogenic variants at two loci
    co-occur and are jointly invoked to explain the phenotype. The best-documented
    pair is DHX37 plus NR5A1: in a Brazilian series, two of the patients carrying
    a deleterious DHX37 variant also carried a pathogenic NR5A1 variant, and the
    authors proposed digenic inheritance. Oligogenic modification has also been
    proposed for NR5A1 splice-variant families, where co-inherited rare OTX2 or
    PROP1 variants may modulate penetrance. Because the Inheritance class has no
    genes slot, the contributing loci are named here: DHX37 and NR5A1 for the
    digenic pair, and OTX2 and PROP1 as proposed modifiers. All four have records
    in the genetic section, with OTX2 and PROP1 typed as MODIFIER.
  evidence:
  - reference: PMID:37240737
    reference_title: "DHX37 and NR5A1 Variants Identified in Patients with 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For both patients carrying DHX37 and NR5A1 pathogenic variants, a digenic
      inheritance is suggested.
    explanation: >-
      Directly asserts digenic inheritance for the DHX37+NR5A1 double
      heterozygotes in a partial-gonadal-dysgenesis cohort.
  - reference: PMID:33296094
    reference_title: "NR5A1 c.991-1G > C splice-site variant causes familial 46,XY partial gonadal dysgenesis with incomplete penetrance."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant pathogenicity was possibly modulated by rare heterozygous
      variants inherited from the other parent, OTX2 p.P134R (P1) or PROP1
      c.301_302delAG (P2).
    explanation: >-
      Supports an oligogenic modifier model as a proposed ("possibly") explanation
      for the incomplete penetrance, not an established second-locus requirement.
progression:
- phase: Fetal partial testis-determination phase
  age_range: embryonic and fetal development
  notes: >-
    Attenuated rather than absent activation of the pro-testis program permits
    partial Sertoli-cell and Leydig-cell differentiation. Partial fetal AMH gives
    incomplete Müllerian regression; partial fetal androgen gives incomplete
    masculinization. This graded, dose-dependent fetal hormone exposure is the
    mechanistic origin of the ambiguous genital phenotype and the single most
    important contrast with complete gonadal dysgenesis.
  evidence:
  - reference: PMID:28504475
    reference_title: "MAP3K1-related gonadal dysgenesis: Six new cases and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      partial gonadal dysgenesis, characterized by incomplete testicular
      development
    explanation: Directly supports incomplete (rather than absent) fetal testis development.
- phase: Neonatal and infantile atypical-genitalia recognition phase
  age_range: birth to infancy
  notes: >-
    Unlike complete disease, which usually remains unrecognized until puberty,
    most partial disease is detected at or shortly after birth because the
    external genitalia are visibly atypical.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most individuals with PGD presented with atypical genitalia in infancy
    explanation: Directly supports the infantile recognition phase.
- phase: Variable pubertal phase
  age_range: adolescence
  notes: >-
    Retained dysgenetic gonads produce a bifurcated pubertal course determined by
    residual Leydig function. Individuals raised male frequently enter puberty
    spontaneously; individuals raised female with retained gonads may instead
    virilize unexpectedly, and a minority present for the first time in
    adolescence with delayed puberty. Labioscrotal gonad position and the
    testosterone response to hCG stimulation are the reported predictors of
    spontaneous puberty.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the PGDm (>13 years) with at least 1 gonad, 80% had spontaneous
      pubertal onset and 59% achieved Tanner G5 without hormone treatment.
      Labioscrotal gonads at presentation and testosterone response to human
      chorionic gonadotropin predicted onset of spontaneous puberty. In PGDf with
      gonads, 42% developed spontaneous virilization at puberty.
    explanation: Directly supplies the bifurcated pubertal course and its predictors.
- phase: Long-term gonadal-tumor and fertility phase
  age_range: childhood through adulthood
  notes: >-
    Retained Y-bearing dysgenetic gonadal tissue remains at risk of
    gonadoblastoma and invasive germ-cell tumor throughout life, at a rate lower
    than complete disease but clearly elevated. Spermatogenesis is typically
    absent or severely impaired even when androgen production is adequate.
  evidence:
  - reference: PMID:40208111
    reference_title: "Phenotypic Variation and Pubertal Outcomes in Males and Females With 46,XY Partial Gonadal Dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gonadal pre-/malignancy was found in 33.8% in CGD, 19.7% in PGDf, and 8.8%
      in PGDm.
    explanation: >-
      Directly supplies the partial-versus-complete tumor gradient in a single
      cohort with consistent ascertainment.
  - reference: PMID:25580123
    reference_title: Long-Term Follow-Up of Patients with 46,XY Partial Gonadal Dysgenesis Reared as Males.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is good prognosis for growth and spontaneous pubertal development but
      not for fertility.
    explanation: >-
      A 13-20 year follow-up of partial-dysgenesis patients reared as males
      directly separates the favorable pubertal/growth outcome from the
      unfavorable fertility outcome.
- phase: Adult gonadal-reserve decline phase
  age_range: adulthood
  notes: >-
    Even in individuals who complete puberty spontaneously, gonadotropins may
    drift upward over long follow-up, which would indicate progressive erosion of
    the already-reduced gonadal reserve. The supporting observation comes from a
    single 10-patient centre series in which the prepubertal and final assessments
    used different denominators, so the trend is suggestive rather than
    established. Long-term endocrine follow-up is nonetheless warranted after
    apparently successful spontaneous puberty rather than discharge at pubertal
    completion.
  evidence:
  - reference: PMID:25580123
    reference_title: Long-Term Follow-Up of Patients with 46,XY Partial Gonadal Dysgenesis Reared as Males.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the end of the prepubertal period, FSH was high or high-normal in 3/6

      this is not a within-patient longitudinal comparison.
pathophysiology:
- name: Attenuated pro-testis network activation
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Partial rather than complete loss of pro-testis transcriptional drive.
    Heterozygous NR5A1 haploinsufficiency, partial SOX9 enhancer loss, hypomorphic
    SRY alleles, and WT1 dosage reduction each leave residual pro-testis output.
    Because the SRY-SOX9-SF1 network is dosage-sensitive and its enhancers act
    synergistically, intermediate network output produces intermediate — not
    absent — testis determination. This dose-dependence is the mechanistic reason
    partial and complete dysgenesis are a spectrum caused by overlapping genes
    rather than distinct gene sets.
  genes:

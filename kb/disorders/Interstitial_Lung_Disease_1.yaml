name: Interstitial Lung Disease 1
creation_date: "2026-10-15T14:36:39Z"
category: Mendelian
description: >-
  Interstitial lung disease 1 (ILD1) is a rare, gene-defined fibrosing lung
  disease caused by germline missense variants in SFTPA1, which encodes
  surfactant protein A1 (SP-A1), a collectin secreted by alveolar type II
  cells. The reported variants cluster in the carbohydrate-recognition domain
  of SP-A1; cell studies show that the mutant protein is made but not
  secreted, and patient lung tissue shows an abnormal SP-A staining pattern.
  Disease ranges from severe respiratory insufficiency in infancy to adult
  idiopathic interstitial pneumonia or idiopathic pulmonary fibrosis, and is
  frequently accompanied by lung adenocarcinoma in carriers and their
  relatives. Inheritance is usually autosomal dominant with incomplete,
  age-dependent penetrance; a single consanguineous family with a homozygous
  variant has also been reported. Lung transplantation is the established
  treatment for end-stage disease. ClinGen classifies SFTPA1 as Moderate for
  autosomal dominant ILD1.

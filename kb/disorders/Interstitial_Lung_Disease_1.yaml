notes: >-
  Entry type: a standalone gene-defined disease (OMIM 619611, MONDO:0030608)
  rather than a subtype of idiopathic pulmonary fibrosis. Its phenotype extends
  beyond IPF to infant-onset respiratory insufficiency, nonspecific
  interstitial pneumonia and lung adenocarcinoma, and ClinGen curates it as a
  distinct gene-disease pair. Idiopathic_Pulmonary_Fibrosis records SFTPA1 as
  a rare familial subset gene, which is consistent with this entry.
  SFTPA2-related familial pulmonary fibrosis is a separate MONDO disease; it is
  mentioned here only where a cited cohort pools SFTPA1 and SFTPA2 carriers,
  and those items say so. The necroptosis chain (ER stress, JNK, RIPK3, MLKL)
  comes from the homozygous p.Tyr208His mouse and has not been shown for
  dominant alleles. No edge to lung adenocarcinoma is drawn because no cited
  source establishes the mechanism linking the secretion defect to cancer.
  Causal edges from the fibrotic remodeling node are drawn only where a cited
  source states the link (NSIP pattern, fatal respiratory failure); the
  imaging, physiological and symptom phenotypes are recorded without an
  inbound edge because the SFTPA1 case reports describe them but do not
  attribute them to a mechanism.
  No GeneReviews chapter is titled for ILD1 or SFTPA1. The Pulmonary Fibrosis
  Predisposition Overview (PMID:20301408) covers surfactant genes generally,
  and its PubMed record holds only a statement of purpose, so it is not cited
  as evidence.

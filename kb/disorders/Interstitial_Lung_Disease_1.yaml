inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Heterozygous SFTPA1 missense variants segregate with disease in
    multigenerational families. Young carriers can be asymptomatic, and the
    clinical picture among affected carriers ranges from infant-onset
    respiratory insufficiency to adult fibrosis with or without lung
    adenocarcinoma. The only penetrance estimate pools SFTPA1 and SFTPA2
    carriers as a single locus, so it is not given as a number here.
  evidence:
  - reference: PMID:26792177
    reference_title: Germline SFTPA1 mutation in familial idiopathic interstitial pneumonia and lung cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified, in a multigenerational family, nine members carrying a
      heterozygous missense mutation with evidence of pathogenicity in SFTPA1
      that encodes the surfactant protein (SP)-A1.
    explanation: >-
      Nine heterozygous carriers in one multigenerational family establish
      dominant transmission of the disease allele.
  - reference: PMID:30854216
    reference_title: A novel germline mutation of the SFTPA1 gene in familial interstitial pneumonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, this variant was also found by Sanger sequencing in one other
      symptomatic family member and one young asymptomatic family member.
    explanation: >-
      A second, independent family carrying p.Val178Met shows dominant
      segregation and an asymptomatic young carrier, consistent with
      age-dependent penetrance.
  - reference: CGGV:assertion_3c3d8e40-6ec1-4fb0-8a30-ce4f1e33dbdf-2025-01-28T170000.000Z
    reference_title: "SFTPA1 / interstitial lung disease 1 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lung disease associated with SFTPA1 variants is characterized by
      pulmonary fibrosis, interstitial pneumonia, and/or lung adenocarcinoma,
      with variability in presentation.
    explanation: >-
      ClinGen's summary records variable expressivity among SFTPA1 carriers.
  - reference: CGGV:assertion_3c3d8e40-6ec1-4fb0-8a30-ce4f1e33dbdf-2025-01-28T170000.000Z
    reference_title: "SFTPA1 / interstitial lung disease 1 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Due to these reasons the ILD disease entity is curated in the autosomal
      dominant mode of inheritance only.
    explanation: >-
      ClinGen curates this gene-disease pair as autosomal dominant.
- name: Autosomal recessive (single family)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    One consanguineous Japanese family had three brothers homozygous for
    SFTPA1 p.Tyr208His, with both parents heterozygous. OMIM lists both modes
    for ILD1, but ClinGen judged the evidence that this family's disease is
    monogenic insufficient and did not score it, so recessive inheritance
    rests on one report.
  evidence:
  - reference: PMID:31601679
    reference_title: A homozygous SFTPA1 mutation drives necroptosis of type II alveolar epithelial cells in patients with idiopathic pulmonary fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe the identification of a homozygous missense mutation
      in SFTPA1 in patients of a consanguineous Japanese family.
    explanation: >-
      A homozygous SFTPA1 variant in affected members of a consanguineous
      family supports recessive inheritance in this family; the paper also
      reports both parents as heterozygous.
  - reference: CGGV:assertion_3c3d8e40-6ec1-4fb0-8a30-ce4f1e33dbdf-2025-01-28T170000.000Z
    reference_title: "SFTPA1 / interstitial lung disease 1 (Moderate)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      At this time, the data asserting an autosomal recessive inheritance
      pattern are limited, and sufficient evidence has not been provided in
      published reports regarding the monogenic nature of the lung disease
      found in the probands (PMID 31601679).
    explanation: >-
      ClinGen does not accept the recessive family as sufficient evidence for
      an autosomal recessive form of ILD1.
pathophysiology:
- name: SFTPA1 Carbohydrate-Recognition Domain Missense Variant
  description: >-
    Disease-associated SFTPA1 variants are germline missense changes in the
    C-terminal carbohydrate-recognition domain (CRD) of SP-A1, including
    p.Trp211Arg (a residue invariant across CRD-containing proteins),
    p.Val178Met and p.Tyr208His.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SFTPA1
    term:
      id: hgnc:10798
      label: SFTPA1
  genetic_context:
    variant_origin: GERMLINE
  molecular_functions:
  - preferred_term: SP-A1 carbohydrate-recognition domain carbohydrate binding
    term:
      id: GO:0030246
      label: carbohydrate binding
  notes: >-
    The molecular function is bound without a modifier. The variants lie in
    the carbohydrate-recognition domain, but the cited studies measure loss
    of secretion, not loss of carbohydrate binding, so no change in this
    activity is asserted. GO:0120153 calcium-dependent carbohydrate binding
    was not used because no cited source states the calcium dependence.
  evidence:
  - reference: CGGV:assertion_3c3d8e40-6ec1-4fb0-8a30-ce4f1e33dbdf-2025-01-28T170000.000Z
    reference_title: "SFTPA1 / interstitial lung disease 1 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SP-A binds specific carbohydrate moieties found on lipids and on the
      surface of microorganisms, playing an essential role in the defense
      against respiratory pathogens
    explanation: >-
      ClinGen's summary of SP-A function supports the carbohydrate-binding
      molecular function, the activity of the domain in which every reported
      ILD1 variant lies.
  - reference: PMID:26792177
    reference_title: Germline SFTPA1 mutation in familial idiopathic interstitial pneumonia and lung cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation (p.Trp211Arg), which segregates with a disease phenotype
      characterized by either isolated IIP/IPF, or IPF associated with lung
      adenocarcinoma, is located in the carbohydrate recognition domain (CRD)
      of SP-A1 and involves a residue invariant throughout evolution
    explanation: >-
      The founding p.Trp211Arg variant lies in the CRD at an evolutionarily
      invariant residue.
  - reference: PMID:30854216
    reference_title: A novel germline mutation of the SFTPA1 gene in familial interstitial pneumonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant encodes the substitution p.(Val178Met), localized within the
      carbohydrate recognition domain of surfactant protein A
    explanation: >-
      A second family's variant also lies in the CRD.
  - reference: CGGV:assertion_3c3d8e40-6ec1-4fb0-8a30-ce4f1e33dbdf-2025-01-28T170000.000Z
    reference_title: "SFTPA1 / interstitial lung disease 1 (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants reported in this gene are all missense variants in exon 6
      encoding the carbohydrate-binding domain, which do not affect the
      expression of the protein but interfere with its secretion.
    explanation: >-
      ClinGen's summary of all reported variants: missense, exon 6, CRD.
  downstream:
  - target: Defective SP-A1 Secretion From Alveolar Type II Cells
    causal_link_type: DIRECT
    description: >-
      Each CRD missense variant tested in cells abolishes secretion of SP-A1
      while leaving its production intact.
    evidence:
    - reference: PMID:26792177
      reference_title: Germline SFTPA1 mutation in familial idiopathic interstitial pneumonia and lung cancer.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        As shown through functional studies, the p.Trp211Arg mutation impairs
        SP-A1 secretion.
      explanation: >-
        Cell-based functional assays link the p.Trp211Arg variant to impaired
        secretion.
    - reference: PMID:31601679
      reference_title: A homozygous SFTPA1 mutation drives necroptosis of type II alveolar epithelial cells in patients with idiopathic pulmonary fibrosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The mutation in SFTPA1 disturbed the secretion of SFTPA1 protein.
      explanation: >-
        The recessive p.Tyr208His variant also disturbs SP-A1 secretion in
        expression studies.
- name: Defective SP-A1 Secretion From Alveolar Type II Cells
  description: >-
    Mutant SP-A1 is produced but is not secreted from the cell, and patient
    alveolar epithelium shows an altered, largely intracellular SP-A staining
    pattern. The mutant protein can still associate with SP-A2, so wild-type
    SP-A may also be retained, but a dominant-negative mechanism has not been
    shown directly.

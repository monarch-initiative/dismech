name: Chancroid
creation_date: '2026-09-25T00:00:00Z'
category: Infectious Disease
description: >-
  Chancroid is a sexually acquired bacterial genital-ulcer disease caused by
  Haemophilus ducreyi. Local inoculation of the fastidious Gram-negative
  coccobacillus produces one or more soft, painful, nonindurated genital ulcers
  and can extend through regional lymphatics to tender inguinal lymph nodes that
  suppurate into buboes. Single-dose azithromycin or ceftriaxone and multi-day
  erythromycin or ciprofloxacin regimens are effective antimicrobial therapies,
  with needle aspiration or incision and drainage for tense fluctuant buboes.
disease_term:
  preferred_term: chancroid
  term:
    id: MONDO:0001797
    label: chancroid
parents:
- Bacterial Infection
- Sexually transmitted infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
infectious_agent:
- name: Haemophilus ducreyi
  description: >-
    A human-adapted Gram-negative coccobacillus that causes chancroid after
    local sexual acquisition at genital skin or mucosa.
  infectious_agent_term:
    preferred_term: Haemophilus ducreyi
    term:
      id: NCBITaxon:730
      label: '[Haemophilus] ducreyi'
  evidence:
  - reference: PMID:28081686
    reference_title: "2017 European guideline for the management of chancroid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chancroid is a sexually acquired infection caused by Haemophilus ducreyi.
    explanation: >-
      The practice guideline identifies H. ducreyi as the causative bacterium of
      sexually acquired chancroid.
transmission:
- name: Sexual transmission
  description: >-
    H. ducreyi is acquired through sexual contact that inoculates the organism
    into susceptible genital skin or mucosa.
  evidence:
  - reference: PMID:28081686
    reference_title: "2017 European guideline for the management of chancroid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chancroid is a sexually acquired infection caused by Haemophilus ducreyi.
    explanation: >-
      Supports the sexual-acquisition route for genital chancroid.
pathophysiology:
- name: H. ducreyi Genital Inoculation
  description: >-
    Sexual contact inoculates H. ducreyi into abraded genital epithelium or
    dermis, creating a local extracellular bacterial focus that can either
    resolve or progress toward a pustule and ulcer.
  role: trigger
  biological_processes:
  - preferred_term: symbiont entry into host
    modifier: INCREASED
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: HgbA-Dependent Heme Acquisition
    description: >-
      The newly inoculated organism must recover heme from host hemoglobin to
      establish early experimental infection.
  evidence:
  - reference: PMID:26374122
    reference_title: >-
      The Human Skin Microbiome Associates with the Outcome of and Is Influenced
      by Bacterial Infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After inoculation, papules form and either spontaneously resolve or
      progress to pustules.
    explanation: >-
      The human H. ducreyi challenge model demonstrates the local papule stage
      that follows experimental inoculation and then either resolves or
      progresses.
- name: HgbA-Dependent Heme Acquisition
  description: >-
    The surface hemoglobin receptor HgbA allows H. ducreyi to acquire heme from
    host hemoglobin. Heme uptake is an obligate early nutritional step and is
    vulnerable to HgbA-directed antibodies in the swine model.
  role: central_effector
  downstream:
  - target: LspA-Dependent Phagocyte Evasion
    description: >-
      Nutritionally established organisms must evade killing by neutrophils and
      macrophages at the inoculation site.
  evidence:
  - reference: PMID:21646451
    reference_title: >-
      Passive immunization with a polyclonal antiserum to the hemoglobin
      receptor of Haemophilus ducreyi confers protection against a homologous
      challenge in the experimental swine model of chancroid.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Haemophilus ducreyi, the etiologic agent of chancroid, has an obligate
      requirement for heme.
    explanation: >-
      Supports H. ducreyi heme dependence, the nutritional constraint captured
      by this node.
  - reference: PMID:21646451
    reference_title: >-
      Passive immunization with a polyclonal antiserum to the hemoglobin
      receptor of Haemophilus ducreyi confers protection against a homologous
      challenge in the experimental swine model of chancroid.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      only the hemoglobin receptor, HgbA, is required to establish infection
      during the early stages of the experimental human model of chancroid
    explanation: >-
      Identifies HgbA as the TonB-dependent hemoglobin receptor required in the
      early human challenge model.
- name: LspA-Dependent Phagocyte Evasion
  description: >-
    H. ducreyi LspA1 and LspA2 large supernatant proteins inhibit phagocytosis
    by macrophage and myelocytic cells, enabling extracellular persistence
    among recruited polymorphonuclear leukocytes and macrophages in the lesion.
  role: central_effector
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Dysregulated Cutaneous Inflammatory Pustule
    description: >-
      Phagocytic failure permits the host response to mature into the
      hyperinflammatory pustule-forming branch.
  evidence:
  - reference: PMID:15271912
    reference_title: >-
      Expression of the LspA1 and LspA2 proteins by Haemophilus ducreyi is
      required for virulence in human volunteers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to its wild-type parent, an lspA1 lspA2 double mutant does not
      inhibit phagocytosis by macrophage and myelocytic cell lines in vitro and
      is attenuated in an experimental rabbit model of chancroid.
    explanation: >-
      Supports LspA1/LspA2 as H. ducreyi anti-phagocytic virulence proteins.
  - reference: PMID:15271912
    reference_title: >-
      Expression of the LspA1 and LspA2 proteins by Haemophilus ducreyi is
      required for virulence in human volunteers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      expression of LspA1 and LspA2 facilitates the ability of H. ducreyi to
      initiate disease and to progress to pustule formation in humans
    explanation: >-
      The human challenge study showed that the LspA1/LspA2 double mutant formed
      smaller papules and no pustules, establishing this evasion step as an
      early virulence determinant.
- name: CdtB-Mediated Host DNA Damage
  description: >-
    Cytolethal distending toxin delivers CdtB into susceptible host cells, where
    its DNase-like activity produces DNA double-strand breaks that trigger DNA
    damage signaling, cell-cycle arrest, distension, and death of epithelial,
    keratinocyte, and immune cells.
  role: central_effector
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: DNA damage response
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  - preferred_term: regulation of cell cycle
    modifier: INCREASED
    term:
      id: GO:0051726
      label: regulation of cell cycle
  downstream:
  - target: Dysregulated Cutaneous Inflammatory Pustule
    description: >-
      CDT-mediated host-cell injury and the inflammatory response converge at
      the local tissue-damage step.
  evidence:
  - reference: PMID:17123907
    reference_title: "The contribution of cytolethal distending toxin to bacterial pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Once inside the cell, CdtB enters the nucleus and exhibits a DNase I-like
      activity that results in DNA double-strand breaks.
    explanation: >-
      Establishes the nuclear DNase-like mechanism of the CdtB toxin subunit.
  - reference: PMID:17123907
    reference_title: "The contribution of cytolethal distending toxin to bacterial pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The eukaryotic cell responds to the DNA double-strand breaks by initiating
      a regulatory cascade that results in cell cycle arrest, cellular
      distension, and cell death.
    explanation: >-
      Links CDT-induced double-strand breaks to the downstream host cell-cycle
      and death phenotypes.
- name: Dysregulated Cutaneous Inflammatory Pustule
  description: >-
    In pustule-forming hosts, neutrophils, macrophages, T cells, and myeloid
    dendritic cells mount a dysregulated local response in which phagocytes fail
    to clear extracellular H. ducreyi, allowing papules to progress to pustules
    and then painful ulcers.
  role: consequence
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Painful genital ulcer
    description: The suppurative focus breaks down into a soft, painful genital ulcer.
  - target: Inguinal lymphadenopathy
    description: >-
      Local genital infection can drain to regional inguinal lymph nodes,
      forming tender, fluctuant buboes.
  evidence:
  - reference: PMID:17893130
    reference_title: >-
      Dysregulated immune profiles for skin and dendritic cells are associated
      with increased host susceptibility to Haemophilus ducreyi infection in
      human volunteers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In experimentally infected human volunteers, the cutaneous immune response
      to Haemophilus ducreyi is orchestrated by serum, polymorphonuclear
      leukocytes, macrophages, T cells, and myeloid dendritic cells (DC).
    explanation: >-
      Identifies the major inflammatory cell types in the human H. ducreyi
      lesion.
  - reference: PMID:17893130
    reference_title: >-
      Dysregulated immune profiles for skin and dendritic cells are associated
      with increased host susceptibility to Haemophilus ducreyi infection in
      human volunteers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This response either leads to spontaneous resolution of infection or
      progresses to pustule formation, which is associated with the failure of
      phagocytes to ingest the organism and the presence of Th1 and regulatory T
      cells.
    explanation: >-
      Supports the host-response branch between spontaneous resolution and
      pustule formation.
- name: Bacterial mRNA Translation by the Ribosome (Macrolide Target)
  description: >-
    H. ducreyi depends on 70S-ribosome translation. Azithromycin and
    erythromycin act through the shared macrolide target on the bacterial 50S
    ribosomal subunit, inhibiting bacterial protein synthesis and clearing the
    organism.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
- name: H. ducreyi Peptidoglycan Cross-Linking (Ceftriaxone Target)
  description: >-
    As a cephalosporin beta-lactam, ceftriaxone acts on the conserved
    penicillin-binding-protein transpeptidase reaction that cross-links the
    bacterial peptidoglycan cell wall.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  biological_processes:
  - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
phenotypes:
- name: Painful genital ulcer
  description: >-
    Soft, painful, nonindurated genital ulcers are the characteristic local
    lesions of chancroid.
  category: Genitourinary
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Genital ulcers
    term:
      id: HP:0003249
      label: Genital ulcers
  evidence:
  - reference: PMID:28081686
    reference_title: "2017 European guideline for the management of chancroid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The infection is characterized by one or more genital ulcers, which are
      soft and painful, and regional lymphadenitis, which may develop into
      buboes.
    explanation: >-
      Directly supports painful genital ulcers as the defining chancroid lesion.
- name: Inguinal lymphadenopathy
  description: >-
    Regional inguinal adenitis is a common extension of local genital infection
    and can progress to fluctuant, suppurative buboes.
  category: Lymphatic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Inguinal lymphadenopathy
    term:
      id: HP:0034751
      label: Inguinal lymphadenopathy
  evidence:
  - reference: PMID:6687703
    reference_title: "Chancroid and granuloma inguinale."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bubo formation is common and about half suppurate.
    explanation: >-
      Supports regional suppurative bubo formation as a frequent complication of
      chancroid.
treatments:
- name: Azithromycin Therapy
  description: >-
    Single-dose oral azithromycin is a recommended macrolide regimen for
    chancroid and is supported by randomized-trial evidence as a convenient
    first-line option.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial mRNA Translation by the Ribosome (Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin acts as a macrolide ribosome-targeting antibacterial agent
      that inhibits H. ducreyi protein synthesis.
  evidence:
  - reference: PMID:10028106
    reference_title: "Treatment of chancroid, 1997."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recommended therapies--with azithromycin (1 g orally, once),
      ceftriaxone (250 mg intramuscularly, once), or erythromycin (500 mg
      orally, four times a day for 7 days)--appear highly effective in the United
      States
    explanation: >-
      Supports azithromycin as a recommended single-dose oral regimen for
      chancroid.
  - reference: PMID:29226307
    reference_title: Macrolides for treatment of Haemophilus ducreyi infection in sexually active adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low quality evidence suggests that azithromycin could be considered as the
      first therapeutic alternative, based on their mono-dose oral
      administration, with a similar safety and effectiveness profile, when it is
      compared with long-term erythromycin use.
    explanation: >-
      Cochrane review evidence supports single-dose azithromycin as an effective
      and convenient macrolide regimen compared with longer erythromycin
      courses.
- name: Ceftriaxone Therapy
  description: >-
    Single-dose intramuscular ceftriaxone is a recommended cephalosporin
    beta-lactam regimen for chancroid.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: H. ducreyi Peptidoglycan Cross-Linking (Ceftriaxone Target)
    treatment_effect: INHIBITS
    description: >-
      Ceftriaxone inhibits penicillin-binding-protein cross-linking of the H.
      ducreyi peptidoglycan cell wall.
  evidence:
  - reference: PMID:10028106
    reference_title: "Treatment of chancroid, 1997."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recommended therapies--with azithromycin (1 g orally, once),
      ceftriaxone (250 mg intramuscularly, once), or erythromycin (500 mg
      orally, four times a day for 7 days)--appear highly effective in the United
      States
    explanation: >-
      Supports single-dose intramuscular ceftriaxone as a recommended chancroid
      regimen.
- name: Erythromycin Therapy
  description: >-
    A seven-day erythromycin course is a recommended macrolide alternative to
    single-dose azithromycin or ceftriaxone.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Bacterial mRNA Translation by the Ribosome (Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Erythromycin acts on the same bacterial 50S ribosomal target as other
      macrolide antibacterials.
  evidence:
  - reference: PMID:10028106
    reference_title: "Treatment of chancroid, 1997."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recommended therapies--with azithromycin (1 g orally, once),
      ceftriaxone (250 mg intramuscularly, once), or erythromycin (500 mg
      orally, four times a day for 7 days)--appear highly effective in the United
      States
    explanation: >-
      Supports erythromycin as a recommended multi-day oral regimen for
      chancroid.
- name: Ciprofloxacin Therapy
  description: >-
    Oral ciprofloxacin twice daily for three days is an effective fluoroquinolone
    alternative for chancroid where local susceptibility supports its use.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:10028106
    reference_title: "Treatment of chancroid, 1997."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The alternative regimen of ciprofloxacin proposed in 1993 (500 mg orally,
      twice a day for 3 days) is as effective as the recommended therapies
    explanation: >-
      Supports ciprofloxacin twice daily for three days as an effective
      alternative chancroid regimen.
- name: Fluctuant Bubo Drainage
  description: >-
    Tense or fluctuant chancroid buboes can require needle aspiration or incision
    and drainage in addition to antimicrobial therapy.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Dysregulated Cutaneous Inflammatory Pustule
    description: >-
      Drainage decompresses the suppurative regional node that forms downstream
      of the ulcerative cutaneous H. ducreyi lesion.
  evidence:
  - reference: PMID:41046959
    reference_title: Chancroid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Buboes may need additional treatment with either aspiration or excision and
      drainage.
    explanation: >-
      Supports procedural drainage as an adjunct when suppurative chancroid
      buboes develop.

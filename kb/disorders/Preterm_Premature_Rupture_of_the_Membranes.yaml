name: Preterm Premature Rupture of the Membranes
creation_date: "2026-09-19T00:00:00Z"
category: Complex
synonyms:
- PPROM
- pPROM
- Preterm prelabor rupture of the membranes
- Preterm prelabour rupture of fetal membranes
- Preterm premature rupture of the fetal membranes
description: >-
  Preterm premature rupture of the membranes is the failure of a load-bearing tissue,
  and that is the useful way to read it: the amniochorion is an avascular collagen
  sheet that has to hold for forty weeks and then give way, and in PPROM it gives way
  early. It complicates 3-4% of pregnancies and precedes 40-50% of all preterm births,
  which makes it the largest single identifiable route to the leading cause of neonatal
  death worldwide. The contemporary model treats it as a disease of the fetal membranes
  rather than as an early instance of labour: oxidative stress accumulates in the
  amniochorion, drives premature cellular senescence with its associated secretory
  phenotype, and both the senescence-derived sterile inflammation and any ascending
  microbial inflammation converge on matrix metalloproteinase activity that degrades
  the fibrillar collagen holding the sheet together. Microfractures - channels through
  areas the amnion has vacated - are more numerous, wider and deeper in PPROM membranes
  than in gestational-age-matched spontaneous preterm birth, marking remodelling that
  failed rather than remodelling that succeeded. The same convergence can be reached
  from the maternal side by decidual haemorrhage, where thrombin overrides the
  progestin suppression of collagenase and links placental abruption to membrane
  rupture. Once the sheet fails, the pathology changes character entirely and becomes a
  problem of a breached barrier: amniotic fluid is lost, the cavity is open to ascending
  organisms, and the fetus is delivered preterm either by the inflammation that caused
  the rupture or by the obstetric decision the rupture forces. Almost all of the
  management - latency antibiotics, antenatal corticosteroids, magnesium sulphate,
  expectant management where it is safe - buys gestational age against infection, and
  the trials that define it are trials of that trade rather than of the mechanism.

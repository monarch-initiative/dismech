    reference_title: A functional SNP in the promoter of the SERPINH1 gene increases risk of preterm premature rupture of membranes in African Americans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The -656 T allele displayed significantly reduced promoter activity compared to the major -656 C allele in amnion fibroblasts, which lay down the fibrillar collagen that gives tensile strength to the amnion."
    explanation: >-
      Gives both halves of this node in one sentence: the molecular effect of the allele
      and the reason amnion fibroblast collagen is the load-bearing element.
  downstream:
  - target: Loss of Amniochorion Tensile Strength
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced chaperone availability to reduced tensile strength is the plausible and
      intended reading of the genetic finding, but no study measures membrane tensile
      strength as a function of SERPINH1 genotype. The edge is recorded at that strength.
- name: Matrix Metalloproteinase-Mediated Collagen Degradation in the Amniochorion
  biological_scale: MOLECULAR
  description: >-
    MMP-9 (gelatinase B) rises in amniotic fluid around membrane rupture, and MMP-1

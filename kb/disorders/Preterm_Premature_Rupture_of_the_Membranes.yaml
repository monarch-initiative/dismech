      strength as a function of SERPINH1 genotype. The edge is recorded at that strength.
- name: Matrix Metalloproteinase-Mediated Collagen Degradation in the Amniochorion
  biological_scale: MOLECULAR
  description: >-
    MMP-9 (gelatinase B) rises in amniotic fluid around membrane rupture, and MMP-1

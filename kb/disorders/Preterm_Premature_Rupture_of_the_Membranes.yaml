    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Intrauterine infection is thought to be one cause of preterm premature rupture of the membranes (PPROM)."
    explanation: >-
      Records the hypothesis at the strength its own source states it - thought to be
      one cause. Tagged BACKGROUND because it is the trial's framing sentence, not its
      result; the trial's result is cited on the antibiotic treatment.
  downstream:

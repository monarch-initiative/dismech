  - preferred_term: chorion membrane
    term:
      id: UBERON:0003124
      label: chorion membrane
  evidence:
  - reference: PMID:32785751
    reference_title: Novel pathways of inflammation in human fetal membranes associated with preterm birth and preterm pre-labor rupture of the membranes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The intrauterine build-up of oxidative stress at term or in response to risk factors (preterm) can accelerate senescence and promote a terminal state of EMT, resulting in the accumulation of inflammation."
    explanation: >-
      States the oxidative-stress-to-senescence-to-inflammation sequence that the next
      two nodes model, and marks the preterm case as risk-factor driven.
  downstream:
  - target: Premature Senescence of the Amniochorion
    causal_link_type: DIRECT
    description: >-
      The strongest experimental support is that the senescence phenotype can be induced
      in term membranes in vitro by an oxidant exposure, which makes this an inducible
      relationship rather than only a correlated one.
    evidence:
    - reference: PMID:24832021
      reference_title: Histological evidence of oxidative stress and premature senescence in preterm premature rupture of the human fetal membranes recapitulated in vitro.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Histologic and biochemical resemblance of pPROM and term membranes suggests premature senescence of the membranes is a mechanistic feature in pPROM, and this can be phenocopied in an in vitro model."
      explanation: >-
        The in vitro phenocopy is what turns the histological association into a causal
        claim about oxidative stress driving the senescence node.
- name: Premature Senescence of the Amniochorion
  biological_scale: CELLULAR
  description: >-
    Fetal membrane cells in PPROM carry the senescence markers p53, p21 and
    phospho-p38 MAPK at frequencies resembling term membranes rather than
    gestational-age-matched preterm ones - the membranes have aged early. Fetal
    telomere length points the same way. The clinical reading is that PPROM membranes
    have reached, prematurely, the state that normally permits rupture at term.
  cell_types:
  - preferred_term: epithelial cell of amnion
    term:
      id: CL:0002536
      label: epithelial cell of amnion
  biological_processes:
  - preferred_term: cellular senescence
    modifier: INCREASED

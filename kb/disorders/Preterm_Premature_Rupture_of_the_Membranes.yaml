    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Onset of Preterm Parturition
    causal_link_type: DIRECT
- name: Onset of Preterm Parturition
  biological_scale: ORGANISM
  description: >-
    Delivery before 37 weeks, whether by spontaneous labour or by the obstetric decision
    the rupture forces. It is modelled as a node rather than only as an outcome because
    three different upstream states reach it - the inflammation that caused the rupture,
    the infection that followed it, and the barrier failure itself - and the management
    question is which of them is driving a given pregnancy.
  biological_processes:
  - preferred_term: parturition
    modifier: INCREASED
    term:
      id: GO:0007567
      label: parturition
  evidence:
  - reference: PMID:32785751
    reference_title: Novel pathways of inflammation in human fetal membranes associated with preterm birth and preterm pre-labor rupture of the membranes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inflammatory mediators from damaged membranes are propagated via extracellular vesicles (EV) to maternal uterine tissues and transition quiescent maternal uterine tissues into an active state of labor."
    explanation: >-
      The proposed signalling route from the damaged membrane to myometrial activation,
      which is the mechanism behind the inflammation-to-parturition edges in this entry.
  downstream:
  - target: Premature birth
    causal_link_type: DIRECT
phenotypes:
- category: Obstetric
  name: Preterm premature rupture of membranes
  description: >-
    Rupture of the chorioamniotic membranes before the onset of labour and before 37
    completed weeks - the defining clinical finding, usually reported as a gush or
    continuous leakage of fluid and confirmed by sterile speculum examination.
  phenotype_term:
    preferred_term: Preterm premature rupture of membranes
    term:
      id: HP:6000310
      label: Preterm premature rupture of membranes
  evidence:
  - reference: PMID:28807394
    reference_title: "Preterm prelabor rupture of the membranes: A disease of the fetal membranes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Preterm prelabor rupture of the membranes (pPROM) remains a significant obstetric problem that affects 3-4% of all pregnancies and precedes 40-50% of all preterm births."
    explanation: Establishes the finding as the entity itself and gives its frequency.
- category: Obstetric
  name: Oligohydramnios
  description: >-
    Reduced amniotic fluid volume following the loss of the barrier. Its importance is
    not the measurement but its duration: severe oligohydramnios sustained beyond two
    weeks at an early gestation is what converts a fluid problem into a lethal one.
  phenotype_term:
    preferred_term: Oligohydramnios
    term:
      id: HP:0001562
      label: Oligohydramnios
  evidence:
  - reference: PMID:8828433
    reference_title: "Defining limits of survival: lethal pulmonary hypoplasia after midtrimester premature rupture of membranes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal mortality and pulmonary hypoplasia were statistically predicted by gestational age at rupture of membranes and interaction of premature rupture of membranes of > 14 days' duration with severe oligohydramnios."
    explanation: >-
      Identifies the interaction - duration crossed with severity - rather than
      oligohydramnios alone as the predictor, which is what the description records.
  sequelae:
  - target: Pulmonary hypoplasia
    causal_link_type: DIRECT
- category: Neonatal
  name: Pulmonary hypoplasia
  description: >-
    Failure of fetal lung growth when amniotic fluid is absent during the canalicular
    phase of development. It is the harm that makes previable PPROM categorically
    different from later PPROM, and the one that is not fixed by delivering the fetus.
  phenotype_term:
    preferred_term: Pulmonary hypoplasia
    term:
      id: HP:0002089
      label: Pulmonary hypoplasia
  subtype: Previable
  evidence:
  - reference: PMID:8828433
    reference_title: "Defining limits of survival: lethal pulmonary hypoplasia after midtrimester premature rupture of membranes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe oligohydramnios > 14 days after premature rupture of membranes at < 25 weeks' gestation has a predicted neonatal mortality of > 90%."
    explanation: >-
      The mortality figure attached to the gestational-age and duration thresholds that
      define the previable subtype.
- category: Obstetric
  name: Premature birth
  description: >-
    Delivery before 37 completed weeks. In PPROM this is the outcome that carries almost
    all of the harm, which is why the whole therapeutic repertoire is organised around
    deferring it safely rather than preventing the rupture.
  phenotype_term:
    preferred_term: Premature birth
    term:
      id: HP:0001622
      label: Premature birth
  evidence:
  - reference: PMID:11293640
    reference_title: "Broad-spectrum antibiotics for preterm, prelabour rupture of fetal membranes: the ORACLE I randomised trial. ORACLE Collaborative Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preterm, prelabour rupture of the fetal membranes (pPROM) is the commonest antecedent of preterm birth, and can lead to death, neonatal disease, and long-term disability."
    explanation: States the relationship between the entity and this phenotype directly.
  sequelae:
  - target: Neonatal respiratory distress
    causal_link_type: DIRECT
- category: Neonatal
  name: Neonatal respiratory distress
  description: >-
    Respiratory distress syndrome of prematurity, from surfactant insufficiency in an
    immature lung. It is the neonatal outcome that both antenatal corticosteroids and
    latency antibiotics were shown to reduce, and the one the PPROMT trial found was
    increased by delivering late-preterm PPROM immediately.
  phenotype_term:
    preferred_term: Neonatal respiratory distress
    term:
      id: HP:0002643
      label: Neonatal respiratory distress
  evidence:
  - reference: PMID:26564381
    reference_title: "Immediate delivery compared with expectant management after preterm pre-labour rupture of the membranes close to term (PPROMT trial): a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neonates born to mothers in the immediate delivery group had increased rates of respiratory distress (76 [8%] of 919 vs 47 [5%] of 910, RR 1·6, 95% CI 1·1-2·30; p=0·008)"
    explanation: >-
      Quantifies the phenotype as the cost of immediate delivery in the late-preterm
      window, which is the trade-off this entry's treatment section is built around.
- category: Neonatal
  name: Neonatal sepsis
  description: >-
    Bloodstream infection in the newborn following exposure to an infected amniotic
    cavity. This is the harm that expectant management is weighed against, and the
    PPROMT trial's primary outcome.
  phenotype_term:
    preferred_term: Neonatal sepsis
    term:
      id: HP:0040187
      label: Neonatal sepsis
  evidence:
  - reference: PMID:26564381
    reference_title: "Immediate delivery compared with expectant management after preterm pre-labour rupture of the membranes close to term (PPROMT trial): a randomised controlled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal sepsis occurred in 23 (2%) of 923 neonates whose mothers were assigned to immediate birth and 29 (3%) of 912 neonates of mothers assigned to expectant management (relative risk [RR] 0·8, 95% CI 0·5-1·3; p=0·37)."
    explanation: >-
      Recorded as REFUTE against the specific claim that waiting after late-preterm PPROM
      raises neonatal sepsis: the trial was powered for exactly that outcome and did not
      find it. It does not refute neonatal sepsis as a phenotype of the disease, which
      the same trial reports in both arms.
genetic:
- name: SERPINH1
  gene_term:
    preferred_term: SERPINH1
    term:
      id: hgnc:1546
      label: SERPINH1
  association: Promoter variant reducing HSP47 expression; susceptibility allele enriched in African ancestry
  relationship_type: SUSCEPTIBILITY
  notes: >
    SERPINH1 encodes HSP47, the collagen-specific molecular chaperone. The -656 C>T
    promoter variant reduces transcription in amnion fibroblasts and is associated with
    PPROM in African Americans, with the association surviving adjustment for genetic
    ancestry using 29 ancestry-informative markers - which is the step that makes it a
    variant effect rather than a population-stratification artefact. A separate 12-bp
    deletion in the same 5'-flanking region runs the other way and is protective
    (PMID:18205191, carried as a top-level reference rather than as an evidence item:
    it is a Mutation in Brief with no abstract indexed, so the only quotable text is its
    title, and a title is not a finding). Note
    that this is a susceptibility allele in a multifactorial condition and not a
    Mendelian cause; MONDO nonetheless classifies MONDO:0012511 under hereditary
    disease, which this entry does not follow.
  evidence:
  - reference: PMID:16938879
    reference_title: A functional SNP in the promoter of the SERPINH1 gene increases risk of preterm premature rupture of membranes in African Americans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An initial case-control study demonstrated that the -656 T allele is significantly more frequent in African-American neonates (P < 0.0009) born from pregnancies complicated by PPROM compared with controls (odds ratio of 3.22, 95% confidence interval 1.50, 7.22)."
    explanation: The clinical association with its effect size, from the discovery case-control study.
  - reference: PMID:16938879
    reference_title: A functional SNP in the promoter of the SERPINH1 gene increases risk of preterm premature rupture of membranes in African Americans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no significant difference in ancestry among cases and controls using a dihybrid model based on 29 ancestry-informative markers."
    explanation: >-
      The admixture control. Without it the association in an ancestry-enriched allele
      would be uninterpretable, so it is cited separately rather than folded into the
      effect-size item.
  - reference: PMID:16938879
    reference_title: A functional SNP in the promoter of the SERPINH1 gene increases risk of preterm premature rupture of membranes in African Americans.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "SERPINH1 encodes heat-shock protein 47, a chaperone essential for collagen synthesis."
    explanation: >-
      The gene's function, which is what connects the variant to the collagen-synthesis
      node. Tagged BACKGROUND because it is established biochemistry restated in the
      paper's introduction rather than the paper's own result.
environmental:
- name: Maternal Cigarette Smoking
  description: >-
    Heavy smoking raises PPROM risk, and the effect is largest at the earliest
    gestations - roughly fivefold before 28 weeks against twofold before 37. The
    gestational gradient is what makes this more than an epidemiological association
    here: it is consistent with an exposure acting on a membrane that has to survive
    longer, and the same oxidant exposure reproduces the PPROM senescence phenotype in
    term membranes in vitro.
  exposure_term:
    preferred_term: exposure to cigarette smoking via maternal
    term:
      id: ECTO:0300003
      label: exposure to cigarette smoking via maternal
  influences_mechanisms:
  - target: Oxidative Stress in the Fetal Membranes
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The intermediate is named and has been tested: cigarette smoke extract applied to
      term fetal membranes raises phospho-p38 MAPK and produces the organelle changes of
      the senescence phenotype. The human data give the risk; the in vitro data give the
      step.
    evidence:
    - reference: PMID:24832021
      reference_title: Histological evidence of oxidative stress and premature senescence in preterm premature rupture of the human fetal membranes recapitulated in vitro.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "In vitro cigarette smoke extract exposure increased p-p38 MAPK without any detectable change in p-p53 MAPK."
      explanation: >-
        The measured effect of the exposure on the oxidative-stress and senescence
        signalling this node models. Quoted with the negative result for p-p53 intact.
  evidence:
  - reference: PMID:23329562
    reference_title: Increased risk of preterm premature rupture of membranes at early gestational ages among maternal cigarette smokers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "smoking > 10 cigarettes per day was associated with an increased risk of PPROM at < 28 weeks (odds ratio [OR] 5.28; 95% confidence interval [CI] 2.20 to 12.7)"
    explanation: >-
      The largest effect in the series, from a 17,961-birth retrospective cohort; the
      same sentence carries the smaller estimates at later gestational ages.
  - reference: PMID:23329562
    reference_title: Increased risk of preterm premature rupture of membranes at early gestational ages among maternal cigarette smokers.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Smoking 1 to 10 cigarettes per day was not associated with a significant risk of PPROM at any gestational age."
    explanation: >-
      Recorded as NO_EVIDENCE against any claim that light smoking carries this risk.
      The exposure is dose-dependent and the entry should not be readable as attributing
      risk to smoking at any level.
treatments:
- name: Latency Antibiotics
  description: >-
    A course of antibiotics given after PPROM to prolong the interval to delivery and to
    reduce neonatal infection and its consequences. Two large randomised trials define
    it and they do not agree on regimen: the NICHD trial used intravenous ampicillin
    plus erythromycin followed by oral amoxicillin plus erythromycin, while ORACLE I
    found the benefit in erythromycin alone and found that co-amoxiclav raised neonatal
    necrotising enterocolitis. Contemporary practice follows the safety finding rather
    than the efficacy finding, which is why the amoxicillin component is recorded here
    with that caveat attached rather than as an equal option.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: erythromycin
      term:
        id: CHEBI:48923
        label: erythromycin
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
  target_mechanisms:
  - target: Ascending Intraamniotic Infection After Rupture
    description: >-
      The intended target is the infection that follows the breach, not the mechanism
      that caused it. That is the honest reading of these trials: they buy latency and
      reduce neonatal infection, and neither one shows that treating infection prevents
      rupture.
    evidence:
    - reference: PMID:32591087
      reference_title: Antibiotic administration reduces the rate of intraamniotic inflammation in preterm prelabor rupture of the membranes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Intravenous therapy with clarithromycin was associated with a reduction in the intensity of the intraamniotic inflammatory response in patients with PPROM with either intraamniotic infection or sterile intraamniotic inflammation."
      explanation: >-
        Direct evidence that antibiotic therapy moves the intraamniotic inflammation this
        edge targets, measured by paired amniocentesis rather than by outcome alone. The
        agent is clarithromycin, which is not the regimen recorded above.
  evidence:
  - reference: PMID:9307346
    reference_title: Antibiotic therapy for reduction of infant morbidity after preterm premature rupture of the membranes. A randomized controlled trial. National Institute of Child Health and Human Development Maternal-Fetal Medicine Units Network.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the total study population, the primary outcome (44.1 % vs 52.9%; P=.04), respiratory distress (40.5% vs 48.7%; P=.04), and necrotizing enterocolitis (2.3% vs 5.8%; P=.03) were less frequent with antibiotics."
    explanation: The NICHD trial's primary result, in the 24-32 week window.
  - reference: PMID:11293640
    reference_title: "Broad-spectrum antibiotics for preterm, prelabour rupture of fetal membranes: the ORACLE I randomised trial. ORACLE Collaborative Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 2260 singletons in this comparison, significantly fewer had the composite primary outcome in the erythromycin group (125 of 1111 [11.2%] vs 166 of 1149 [14.4%], p=0.02)."
    explanation: >-
      ORACLE I's erythromycin result in singletons. Note the same comparison across all
      infants did not reach significance, which the trial reports separately.
  - reference: PMID:11293640
    reference_title: "Broad-spectrum antibiotics for preterm, prelabour rupture of fetal membranes: the ORACLE I randomised trial. ORACLE Collaborative Group."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Although co-amoxiclav only and co-amoxiclav plus erythromycin were associated with prolongation of pregnancy, they were also associated with a significantly higher rate of neonatal necrotising enterocolitis."
    explanation: >-
      REFUTE against the claim that co-amoxiclav is an acceptable latency regimen. It
      does not refute latency antibiotics generally - the same trial supports
      erythromycin - which is why it is a separate item rather than a qualifier on the
      one above.
- name: Antenatal Corticosteroids
  description: >-
    A single course of betamethasone or dexamethasone given when preterm delivery is
    anticipated, to accelerate fetal lung maturation. It is the intervention with the
    largest and most certain effect on the outcome that carries most of the harm in
    PPROM, and the concern specific to this population - that a steroid in a pregnancy
    with ruptured membranes raises maternal infection - is addressed by the same
    systematic review, which finds little to no difference in chorioamnionitis with wide
    confidence intervals.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: betamethasone
      term:
        id: CHEBI:3077
        label: betamethasone
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  target_mechanisms:
  - target: Neonatal respiratory distress
    description: >-
      The target is the consequence of prematurity, not any node in the membrane-failure
      chain. Nothing in this entry's pathophysiology is altered by corticosteroids, and
      the entry should not be readable as claiming otherwise.
  evidence:
  - reference: PMID:33368142
    reference_title: Antenatal corticosteroids for accelerating fetal lung maturation for women at risk of preterm birth.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "respiratory distress syndrome (RR 0.71, 95% CI 0.65 to 0.78; 11,183 infants; studies = 26; high-certainty evidence; 4.3% fewer, 95% CI 3.2% to 5.2% fewer)"
    explanation: The pooled effect on the outcome this treatment targets, graded high certainty.
  - reference: PMID:33368142
    reference_title: Antenatal corticosteroids for accelerating fetal lung maturation for women at risk of preterm birth.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "The wide 95% CIs in all of these outcomes include possible benefit and possible harm."
    explanation: >-
      Recorded as NO_EVIDENCE against the maternal-infection concern in either direction.
      The review's own reading of its maternal outcomes, including chorioamnionitis, is
      that they are imprecise - which is a different statement from safety.
- name: Magnesium Sulphate for Fetal Neuroprotection
  description: >-
    Magnesium sulphate given to a woman at risk of delivering before 34 weeks, to reduce
    cerebral palsy in the child. Like corticosteroids it treats the consequence of
    preterm birth rather than the membrane disease, and it is included because PPROM is
    one of the commonest routes into the population in which it is indicated.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: magnesium sulfate
      term:
        id: CHEBI:32599
        label: magnesium sulfate
  target_mechanisms:
  - target: Premature birth
    description: >-
      The edge means addresses a consequence of, not prevents. Magnesium sulphate given
      for neuroprotection does not prolong the pregnancy and is not a tocolytic in this
      indication - the cited review explicitly excludes trials using it for tocolysis.
  evidence:
  - reference: PMID:38726883
    reference_title: Magnesium sulphate for women at risk of preterm birth for neuroprotection of the fetus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "magnesium sulphate compared with placebo reduced cerebral palsy (RR 0.71, 95% CI 0.57 to 0.89; 6 RCTs, 6107 children; number needed to treat for additional beneficial outcome (NNTB) 60, 95% CI 41 to 158)"
    explanation: The pooled effect on cerebral palsy with its number needed to treat, graded high certainty.
  - reference: PMID:38726883
    reference_title: Magnesium sulphate for women at risk of preterm birth for neuroprotection of the fetus.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not include studies where magnesium sulphate was used with the primary aim of preterm labour tocolysis, or the prevention and/or treatment of eclampsia."
    explanation: >-
      Recorded as NO_EVIDENCE against reading this treatment as prolonging the pregnancy.
      The review's exclusion criterion is what makes the neuroprotective indication a
      separate claim from tocolysis.
- name: Expectant Management with Surveillance
  description: >-
    Deferring delivery while watching for infection and fetal compromise. It is the
    default below 34 weeks and, since the PPROMT trial, also the default between 34 and
    37 weeks in the absence of overt infection - a reversal of the previous assumption
    that the infection risk of waiting outweighed the prematurity risk of delivering. The
    trial found no reduction in neonatal sepsis from immediate birth and more respiratory
    distress, more ventilation and longer intensive care; it also found the trade is not
    free on the maternal side, with more antepartum or intrapartum haemorrhage and
    intrapartum fever in the expectant arm, against fewer caesareans.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: expectant management with maternal and fetal surveillance
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Onset of Preterm Parturition
    description: >-
      What is being managed is the timing of delivery, which is the node this edge
      points at. The intervention is a decision not to intervene, so nothing in the
      membrane-failure chain upstream of it is touched.
  evidence:
  - reference: PMID:26564381
    reference_title: "Immediate delivery compared with expectant management after preterm pre-labour rupture of the membranes close to term (PPROMT trial): a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of overt signs of infection or fetal compromise, a policy of expectant management with appropriate surveillance of maternal and fetal wellbeing should be followed in pregnant women who present with ruptured membranes close to term."
    explanation: >-
      The trial's own interpretation, which is the recommendation this treatment records,
      with its two explicit preconditions.
  - reference: PMID:26564381
    reference_title: "Immediate delivery compared with expectant management after preterm pre-labour rupture of the membranes close to term (PPROMT trial): a randomised controlled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "those assigned to the expectant management group had higher risks of antepartum or intrapartum haemorrhage (RR 0·6, 95% CI 0·4-0·9), intrapartum fever (0·4, 0·2-0·9), and use of postpartum antibiotics (0·8, 0·7-1·0), and longer hospital stay (p<0·0001), but a lower risk of caesarean delivery (RR 1·4, 95% CI 1·2-1·7)."
    explanation: >-
      REFUTE against any reading of this treatment as costless. The maternal harms sit in
      the same trial that supports the policy, and are cited from it rather than
      elsewhere.
clinical_trials:
- name: ISRCTN44485060
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    The PPROMT trial - immediate delivery versus expectant management for PPROM between
    34 weeks and 36 weeks and 6 days, with neonatal sepsis as the primary outcome. It
    has no NCT identifier: it is registered on ISRCTN and reached here through the WHO
    ICTRP, which is the identifier the publication itself cites. `phase` follows the
    registry's own Not Applicable value rather than assigning a phase the register does
    not claim.
  target_phenotypes:
  - preferred_term: Neonatal sepsis
    term:
      id: HP:0040187
      label: Neonatal sepsis
  - preferred_term: Neonatal respiratory distress
    term:
      id: HP:0002643
      label: Neonatal respiratory distress
  evidence:
  - reference: ICTRP:ISRCTN44485060
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Current inclusion criteria as of 12/02/2009: Singleton pregnancies, with confirmed ruptured membranes from 34 weeks to 36 weeks and 6 days gestation."
    explanation: >-
      WHO ICTRP registration record establishing the trial's identity and its registered
      eligibility window, which is the window the late-preterm subtype names.
  - reference: PMID:26564381
    reference_title: "Immediate delivery compared with expectant management after preterm pre-labour rupture of the membranes close to term (PPROMT trial): a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PPROMT trial was a multicentre randomised controlled trial done at 65 centres across 11 countries."
    explanation: Establishes the trial's design and scale, from the primary report.
discussions:
- discussion_id: gap_pprom_senescence_cause_or_marker
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is premature senescence of the amniochorion a cause of PPROM, or a marker of
    membranes that were already destined to fail?
  attaches_to:
  - pathophysiology#Premature Senescence of the Amniochorion
  rationale: >-
    The senescence evidence is strong on association and on inducibility, and those are
    different claims. Membranes from PPROM carry the markers at term-like frequencies,
    and an oxidant exposure produces the same phenotype in term membranes in vitro - but
    no study shows that blocking senescence prevents rupture, and no in vivo experiment
    separates senescence from the oxidative stress that induces it. The distinction is
    not academic: it decides whether senescence is a screening biomarker or a
    therapeutic target, and the field's own reviews call for exactly this work.
  proposed_experiments:
  - experiment_id: exp_pprom_senescence_blockade_mechanical_endpoint
    name: Senescence blockade in a fetal membrane organ-on-chip under oxidant challenge
    description: >-
      Apply an oxidant challenge to a human fetal membrane organ-on-chip with and
      without senolytic or p38 inhibition, and measure both the senescence markers and a
      mechanical endpoint. The mechanical endpoint is the point of the experiment:
      showing that blockade prevents marker accumulation would only repeat what is
      already known.
    would_support:
    - pathophysiology#Premature Senescence of the Amniochorion
    supporting_outcome:
    - >-
      Senescence blockade preserves membrane tensile strength or rupture pressure under
      an oxidant challenge that weakens untreated membranes.
    refuting_outcome:
    - >-
      Senescence markers are suppressed but the membranes weaken to the same degree,
      placing the mechanical failure downstream of oxidative stress but not of
      senescence.
  evidence:
  - reference: PMID:28807394
    reference_title: "Preterm prelabor rupture of the membranes: A disease of the fetal membranes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Further studies on senescence activation and microfracture formation and their role in maintaining membrane homeostasis are needed to fill the knowledge gaps in our understanding of pPROM"
    explanation: The review states this gap in its own words, which is why it is recorded here rather than inferred.
- discussion_id: gap_pprom_organism_direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does an organism recovered from the amniotic cavity after PPROM reflect a cause of
    the rupture or a consequence of it?
  attaches_to:
  - pathophysiology#Ascending Choriodecidual Microbial Colonization
  - pathophysiology#Ascending Intraamniotic Infection After Rupture
  rationale: >-
    This entry deliberately splits colonisation before rupture from infection after it,
    because the literature very largely cannot. Amniotic fluid is sampled after the
    membranes have opened, at which point the cavity is continuous with the vagina, so a
    positive culture is compatible with either direction. The consequence is practical:
    the fraction of PPROM that is genuinely infection-initiated is not established, and
    the observation that much intraamniotic inflammation is culture-negative is
    consistent with either a sterile mechanism or an unrecovered organism.
  proposed_experiments:
  - experiment_id: exp_pprom_pre_rupture_sampling
    name: Pre-rupture longitudinal sampling in a high-risk cohort
    description: >-
      Serial cervicovaginal and, where amniocentesis is independently indicated,
      amniotic sampling with molecular microbiology in a cohort at high risk of PPROM,
      so that organism presence is established before the barrier fails rather than
      after.
    would_support:
    - pathophysiology#Ascending Choriodecidual Microbial Colonization
    supporting_outcome:
    - >-
      Organisms detectable in the amniotic cavity before rupture in a substantial
      fraction of women who subsequently rupture, at rates exceeding matched women who
      do not.
    refuting_outcome:
    - >-
      Pre-rupture sampling is sterile in most women who go on to rupture, placing the
      recovered organisms after the event and reducing the infectious route to a
      minority mechanism.
  evidence:
  - reference: PMID:32591087
    reference_title: Antibiotic administration reduces the rate of intraamniotic inflammation in preterm prelabor rupture of the membranes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sterile intraamniotic inflammation was defined as the presence of intraamniotic inflammation without microbial invasion of the amniotic cavity"
    explanation: >-
      The existence of a named, operationalised sterile category is what makes the
      direction question answerable rather than rhetorical.
- discussion_id: gap_pprom_no_mondo_term_for_preterm_birth
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is there no MONDO term for preterm birth itself, when PPROM - one of its causes -
    has one?
  attaches_to:
  - disease#Preterm Premature Rupture of the Membranes
  rationale: >-
    Searching MONDO for preterm birth, premature birth, preterm labor and obstetric
    labor complication returns no general term for the condition; the only anchorable
    obstetric concept in this area is preterm premature rupture of the membranes
    (MONDO:0012511), which is why this entry exists in this shape. Preterm birth is
    available in HPO as a phenotype (HP:0001622 Premature birth, with the WHO severity
    strata HP:0025664, HP:0025665 and HP:0025666), so the gap is specifically a disease
    anchor. This is the same class of blocker that issue 7837 records for postpartum
    haemorrhage. It is recorded here as a gap rather than worked around, and it is worth
    a MONDO new-term request.
  notes: >-
    Note also that MONDO classifies MONDO:0012511 under hereditary disease - it is
    reachable from MONDO:0003847 - which fits the SERPINH1 susceptibility literature the
    OMIM entry rests on but not the multifactorial entity this file curates. Worth
    raising upstream alongside the missing preterm-birth term.
differential_diagnoses:
- name: Urinary incontinence in pregnancy
  description: >-
    The commonest benign explanation for reported fluid loss in the third trimester, and
    the one that makes sterile speculum confirmation rather than history the diagnostic
    step.
- name: Increased physiological vaginal discharge
  description: >-
    Leucorrhoea increases in late pregnancy and is reported as wetness. It is
    distinguished on speculum examination by the absence of pooling.
- name: Term premature rupture of the membranes
  description: >-
    The same lesion at or after 37 weeks. It is a different entity for management
    purposes - induction rather than latency - and the mechanism literature treats term
    rupture as the physiological endpoint of the same senescence process rather than as
    a disease.
- name: Placental abruption
  description: >-
    Shares a mechanism with PPROM through decidual haemorrhage and thrombin, and the two
    co-occur, so it is a differential and a comorbidity at once. It is distinguished by
    pain, bleeding and uterine tone rather than by fluid loss.
notes: >-
  Scope. This entry is about the membrane failure, not about preterm birth. That is
  partly a modelling choice and partly forced: MONDO has no term for preterm birth (see
  the discussion entry above), so PPROM is the only anchorable disease concept in this
  part of obstetrics, and it happens to be the single largest identifiable route to the
  outcome. Spontaneous preterm labour with intact membranes is a sibling entity with
  overlapping causes and a different tissue failure, and it is not covered here.

  What the pathograph asserts and does not. The chain from oxidative stress through
  senescence to microfractures to mechanical failure is the contemporary model of a
  research group that has argued it consistently; it is well evidenced at each node and
  under-evidenced between some of them, and the causal_link_type values record which is
  which. The infectious route is modelled in parallel rather than upstream, because the
  directionality problem set out in the second discussion entry means the literature
  cannot generally place organisms before the rupture.

  Treatment edges. Three of the four treatments here target consequences rather than
  mechanisms - corticosteroids target neonatal respiratory distress, magnesium sulphate
  targets the sequelae of preterm birth, expectant management targets the timing of
  delivery. Only latency antibiotics point at a pathophysiology node, and even that edge
  points at the post-rupture infection rather than at any cause of the rupture. There is
  no treatment in current practice that acts on the membrane-failure chain, which is the
  clearest statement of where this disease stands.

  Terminology. The literature uses both premature and prelabor/prelabour for the second
  P, and both spellings appear in the cited titles. MONDO's label uses premature, which
  this entry follows for the primary name; the synonyms carry the alternatives.

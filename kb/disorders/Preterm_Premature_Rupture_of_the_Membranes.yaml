has_subtypes:
- name: Previable
  display_name: Previable PPROM (rupture before about 23 weeks)
  description: >-
    Rupture before the threshold of viability. It is separated from the others because
    the dominant pathology is not prematurity but the consequence of prolonged
    anhydramnios during the canalicular phase of lung development: pulmonary hypoplasia
    and skeletal deformation, on top of a high rate of intrauterine loss. The
    counselling and the management decision are categorically different from later
    PPROM, which is why this is a subtype rather than a severity grade.
  evidence:
  - reference: PMID:8828433
    reference_title: "Defining limits of survival: lethal pulmonary hypoplasia after midtrimester premature rupture of membranes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe oligohydramnios > 14 days after premature rupture of membranes at < 25 weeks' gestation has a predicted neonatal mortality of > 90%."
    explanation: >-
      Quantifies the outcome that distinguishes this subtype - mortality driven by
      duration of severe oligohydramnios and gestational age at rupture, not by the
      rupture itself.
- name: Early-Preterm
  display_name: Early-preterm PPROM (about 23 to 33 weeks)
  description: >-
    The gestational window in which latency antibiotics, antenatal corticosteroids and
    magnesium sulphate are all indicated and in which prolonging the pregnancy is worth
    the infection risk. The randomised evidence that defines expectant management with
    antibiotics was generated in this window.
  evidence:
  - reference: PMID:9307346
    reference_title: Antibiotic therapy for reduction of infant morbidity after preterm premature rupture of the membranes. A randomized controlled trial. National Institute of Child Health and Human Development Maternal-Fetal Medicine Units Network.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 614 of 804 eligible gravidas with PPROM between 24 weeks' and 0 days' and 32 weeks' and 0 days' gestation who were considered candidates for pregnancy prolongation"
    explanation: >-
      Defines the gestational window of the trial that established latency antibiotics,
      which is the window this subtype names.
- name: Late-Preterm
  display_name: Late-preterm PPROM (34 to 36 weeks and 6 days)
  description: >-
    Rupture close to term, where the balance flips: the fetus is mature enough that the
    infection risk of waiting was long assumed to outweigh the prematurity risk of
    delivering. The PPROMT trial tested exactly that assumption in this window and
    found against it, which is why the window is worth separating.
  evidence:
  - reference: PMID:26564381
    reference_title: "Immediate delivery compared with expectant management after preterm pre-labour rupture of the membranes close to term (PPROMT trial): a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women aged over 16 years with singleton pregnancies and ruptured membranes before the onset of labour between 34 weeks and 36 weeks and 6 days weeks who had no signs of infection were included."
    explanation: States the gestational bounds that define this subtype, as used by the trial that governs its management.

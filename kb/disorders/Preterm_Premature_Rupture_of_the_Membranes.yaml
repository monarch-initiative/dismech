  evidence:
  - reference: PMID:28807394
    reference_title: "Preterm prelabor rupture of the membranes: A disease of the fetal membranes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we introduce the concept that pPROM is a disease of the fetal membranes where inflammation-oxidative stress axis plays a major role in producing pathways that can lead to membrane weakening through a variety of processes"
    explanation: >-
      The framing claim this node encodes - that the several upstream pathways converge
      on membrane weakening - stated by the review that proposes it.
  downstream:
  - target: Rupture of the Chorioamniotic Membranes Before 37 Weeks
    causal_link_type: DIRECT
- name: Rupture of the Chorioamniotic Membranes Before 37 Weeks
  biological_scale: TISSUE
  description: >-
    The defining lesion, and the point at which the disease changes character. Up to
    here the pathology is a progressive weakening of one tissue; from here it is a
    breached barrier, and what follows is driven by what the breach allows rather than
    by what caused it.
  locations:
  - preferred_term: amnion
    term:
      id: UBERON:0000305
      label: amnion
  - preferred_term: chorion membrane
    term:
      id: UBERON:0003124
      label: chorion membrane
  downstream:
  - target: Preterm premature rupture of membranes
    causal_link_type: DIRECT
    description: The clinically observed presentation of this node.
  - target: Loss of the Amniotic Fluid Barrier
    causal_link_type: DIRECT
  - target: Onset of Preterm Parturition
    causal_link_type: DIRECT
- name: Loss of the Amniotic Fluid Barrier
  biological_scale: ORGANISM
  description: >-
    Amniotic fluid drains and the amniotic cavity is continuous with the vagina. Two
    separate harms follow and they scale with different things: fluid volume loss harms
    the fetus in proportion to how early it happens and how long it lasts, whereas the
    open conduit harms in proportion to latency alone.
  locations:
  - preferred_term: amniotic fluid
    term:
      id: UBERON:0000173
      label: amniotic fluid
  - preferred_term: uterine cervix
    term:
      id: UBERON:0000002
      label: uterine cervix
  downstream:
  - target: Oligohydramnios
    causal_link_type: DIRECT
  - target: Ascending Intraamniotic Infection After Rupture
    causal_link_type: DIRECT
- name: Ascending Intraamniotic Infection After Rupture
  biological_scale: ORGANISM
  description: >-
    Colonisation of the now-open amniotic cavity. This is a separate node from the
    ascending colonisation that may have caused the rupture, and confusing the two is
    the standard trap in reading the PPROM literature: an organism recovered after
    rupture may have arrived because of it. The node is retained because it is what
    latency antibiotics are given against and what limits how long expectant management
    can run.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: leukocyte migration
    modifier: INCREASED
    term:

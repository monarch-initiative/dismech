    evidence_source: HUMAN_CLINICAL
    snippet: "Preterm prelabor rupture of the membranes (pPROM) remains a significant obstetric problem that affects 3-4% of all pregnancies and precedes 40-50% of all preterm births."
    explanation: >-
      Gives both the per-pregnancy rate recorded here and the fraction of preterm births
      it precedes, which is the figure that sets this entry's burden. The quoted text is
      human population epidemiology, so it is graded HUMAN_CLINICAL; REVIEW_SYNTHESIS
      records that this review is collating figures generated elsewhere rather than
      reporting a cohort of its own.
- population: Preterm deliveries
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 35000.0
  rate_low: 30000.0
  rate_high: 40000.0
  notes: >-
    The conditional fraction - 30-40% of preterm deliveries follow PPROM - not a
    population figure. Recorded because it is the number that makes this entry a
    high-burden one. Note the two cited sources give 30-40% (1998) and 40-50% (2017)
    for the same quantity; both are recorded rather than averaged.
  evidence:
  - reference: PMID:9822510
    reference_title: A role for matrix metalloproteinase-9 in spontaneous rupture of the fetal membranes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preterm premature rupture of fetal membranes is responsible for 30% to 40% of preterm deliveries."
    explanation: The conditional fraction of preterm deliveries attributable to PPROM.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    PPROM is the commonest identifiable antecedent of preterm birth, which is itself the
    leading cause of neonatal death worldwide. The burden is almost entirely
    transmitted: the rupture harms nobody directly, but it delivers the fetus early,
    opens the amniotic cavity to ascending infection, and - when it happens early enough
    and lasts long enough - removes the amniotic fluid that fetal lung development
    requires.
  evidence:
  - reference: PMID:11293640
    reference_title: "Broad-spectrum antibiotics for preterm, prelabour rupture of fetal membranes: the ORACLE I randomised trial. ORACLE Collaborative Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preterm, prelabour rupture of the fetal membranes (pPROM) is the commonest antecedent of preterm birth, and can lead to death, neonatal disease, and long-term disability."
    explanation: States the burden claim directly, from the largest randomised trial in the condition.
  - reference: PMID:8828433
    reference_title: "Defining limits of survival: lethal pulmonary hypoplasia after midtrimester premature rupture of membranes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both duration of severe oligohydramnios exposure and gestational age at premature rupture of membranes were independent significant predictors of increased neonatal risk."
    explanation: >-
      Identifies the two variables that govern outcome, which is why this entry models
      gestational age at rupture and latency duration rather than rupture alone.
pathophysiology:
- name: Oxidative Stress in the Fetal Membranes
  conforms_to: "cellular_senescence#Senescence-Inducing Stress"
  biological_scale: CELLULAR
  description: >-
    Reactive oxygen species accumulate in the amniochorion during gestation and are
    accelerated by risk-factor exposures. This is the node the contemporary model puts
    upstream of everything else in the non-infectious route to PPROM, and it is also the
    node at which the main modifiable risk factor - smoking - acts.
  cell_types:
  - preferred_term: epithelial cell of amnion
    term:
      id: CL:0002536
      label: epithelial cell of amnion
  - preferred_term: amnion mesenchymal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  locations:
  - preferred_term: amnion
    term:
      id: UBERON:0000305
      label: amnion
  - preferred_term: chorion membrane
    term:
      id: UBERON:0003124
      label: chorion membrane
  evidence:
  - reference: PMID:32785751
    reference_title: Novel pathways of inflammation in human fetal membranes associated with preterm birth and preterm pre-labor rupture of the membranes.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: IN_VITRO
    snippet: "The intrauterine build-up of oxidative stress at term or in response to risk factors (preterm) can accelerate senescence and promote a terminal state of EMT, resulting in the accumulation of inflammation."
    explanation: >-
      States the oxidative-stress-to-senescence-to-inflammation sequence that the next
      two nodes model, and marks the preterm case as risk-factor driven. The
      acceleration claim rests on oxidant exposure of cultured fetal membrane cells and
      organ explants - the same experimental route as PMID:24832021 on the edge below -
      so it is graded IN_VITRO, with REVIEW_SYNTHESIS recording that this review did not
      perform those experiments.
  downstream:
  - target: Premature Senescence of the Amniochorion
    causal_link_type: DIRECT
    description: >-
      The strongest experimental support is that the senescence phenotype can be induced
      in term membranes in vitro by an oxidant exposure, which makes this an inducible
      relationship rather than only a correlated one.
    evidence:
    - reference: PMID:24832021
      reference_title: Histological evidence of oxidative stress and premature senescence in preterm premature rupture of the human fetal membranes recapitulated in vitro.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Histologic and biochemical resemblance of pPROM and term membranes suggests premature senescence of the membranes is a mechanistic feature in pPROM, and this can be phenocopied in an in vitro model."
      explanation: >-
        The in vitro phenocopy is what turns the histological association into a causal
        claim about oxidative stress driving the senescence node.
- name: Premature Senescence of the Amniochorion
  conforms_to: "cellular_senescence#Senescence-Associated Cell Cycle Arrest"
  biological_scale: CELLULAR
  description: >-
    Fetal membrane cells in PPROM carry the senescence markers p53, p21 and
    phospho-p38 MAPK at frequencies resembling term membranes rather than
    gestational-age-matched preterm ones - the membranes have aged early. Fetal
    telomere length points the same way. The clinical reading is that PPROM membranes
    have reached, prematurely, the state that normally permits rupture at term.
  cell_types:
  - preferred_term: epithelial cell of amnion
    term:
      id: CL:0002536
      label: epithelial cell of amnion
  biological_processes:
  - preferred_term: cellular senescence
    modifier: INCREASED
    term:
      id: GO:0090398
      label: cellular senescence
  locations:
  - preferred_term: amnion
    term:
      id: UBERON:0000305
      label: amnion
  evidence:
  - reference: PMID:24832021
    reference_title: Histological evidence of oxidative stress and premature senescence in preterm premature rupture of the human fetal membranes recapitulated in vitro.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 80% of pPROM cells and >60% of term cells were positive for all three senescence phenotype markers, and concentrations were higher than in PTBs (P < 0.05)."
    explanation: >-
      The comparator is the informative part: PPROM membranes resemble term membranes
      and differ from gestational-age-matched spontaneous preterm birth, which is what
      makes this specific to PPROM rather than to prematurity.
  - reference: PMID:22348044
    reference_title: Short fetal leukocyte telomere length and preterm prelabor rupture of the membranes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "pPROM had telomere lengths (9962 ± 3124 bp) that were significantly shorter than gestational age-matched PTB (11546 ± 4348 bp, p = 0.04), but comparable to term births (9011 ± 2497 bp, p = 0.31)."
    explanation: >-
      A second, independent marker of the same early-ageing pattern. INDIRECT because
      telomere length is a surrogate for oxidative stress and senescence rather than a
      measurement of the membrane state itself, and because it was measured in cord
      blood leukocytes - the study reports a strong correlation with placental membrane
      telomere length, which is the step that licenses the inference.
  downstream:
  - target: Microfracture Formation in the Amnion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Microfractures appear as extensions of areas the amnion has vacated through
      shedding or senescence-associated topographic change. The cited source postulates
      the link rather than demonstrating it, and says so.
  - target: Intraamniotic Inflammatory Response
    causal_link_type: DIRECT
    description: >-
      The senescence-associated secretory phenotype is the proposed source of the
      sterile intraamniotic inflammation seen in PPROM without microbial invasion. This
      is the edge that makes a single model cover both the infected and the
      culture-negative cases.
- name: Ascending Choriodecidual Microbial Colonization
  biological_scale: TISSUE
  description: >-
    Organisms ascend from the lower genital tract into the choriodecidual space and, in
    a subset, into the amniotic cavity. This is the classic route and it remains the one
    the treatment is aimed at, but it is not the only route: a substantial fraction of
    PPROM has intraamniotic inflammation with no recoverable organism, which is why the
    inflammation node below is kept separate from this one.
  cell_types:
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: decidua
    term:
      id: UBERON:0002450
      label: decidua
  - preferred_term: amniotic fluid
    term:
      id: UBERON:0000173
      label: amniotic fluid
  evidence:
  - reference: PMID:9307346
    reference_title: Antibiotic therapy for reduction of infant morbidity after preterm premature rupture of the membranes. A randomized controlled trial. National Institute of Child Health and Human Development Maternal-Fetal Medicine Units Network.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrauterine infection is thought to be one cause of preterm premature rupture of the membranes (PPROM)."
    explanation: >-
      Records the hypothesis at the strength its own source states it - thought to be
      one cause. Tagged BACKGROUND because it is the trial's framing sentence, not its
      result; the trial's result is cited on the antibiotic treatment. The sentence
      summarises human clinical observation, so HUMAN_CLINICAL + BACKGROUND is the pair
      that is true of it - OTHER would have asserted nothing about the evidence.
  downstream:
  - target: Intraamniotic Inflammatory Response
    causal_link_type: DIRECT
- name: Intraamniotic Inflammatory Response
  biological_scale: TISSUE
  description: >-
    Raised amniotic fluid interleukin-6 with or without recoverable organisms. The
    distinction is operationalised in the literature and matters here: intraamniotic
    infection is microbial invasion plus inflammation, whereas sterile intraamniotic
    inflammation is inflammation without invasion. Both drive the same downstream
    proteolysis, which is why this entry models the inflammation rather than the
    infection as the pathogenic node.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:

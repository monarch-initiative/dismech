      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Extrapolation of thrombin-enhanced MMP-1 expression in cultured endometrial stromal and decidual cells to the in vivo pregnant state provides an explanation for the strong association between placental abruption and preterm membrane rupture."
      explanation: >-
        Quoted with its own hedge intact - the authors label the move to the in vivo
        pregnant state an extrapolation, which is why this edge is not DIRECT.
- name: Reduced Amnion Collagen Synthesis
  biological_scale: MOLECULAR
  description: >-
    Amnion fibroblasts lay down the fibrillar collagen that gives the sheet its tensile
    strength, and that synthesis depends on the collagen-specific chaperone HSP47,
    encoded by SERPINH1. A promoter allele that lowers SERPINH1 transcription is the one
    genetic finding in PPROM that has both an effect on the molecule and a replicated
    clinical association, so this node is the genetic entry point into the same
    structural failure the proteolytic nodes reach from the other direction.

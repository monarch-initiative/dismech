mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:O42.919
      label: Preterm premature rupture of membranes, unspecified as to length of time between rupture and onset of labor, unspecified trimester
    mapping_predicate: skos:closeMatch
    mapping_source: ICD10CM
    mapping_justification: >-
      The single ICD-10-CM code that names preterm premature rupture of the membranes
      with both of its qualifying axes left unspecified, which is the nearest coded
      equivalent of this entry's disease unit. closeMatch rather than exactMatch because
      the code remains a member of a latency-stratified family: ICD-10-CM cuts PPROM
      along two axes this entry does not use - the interval between rupture and the onset
      of labour, and the trimester - giving nine preterm codes (O42.011-O42.019,
      O42.111-O42.119, O42.911-O42.919). Mapping all nine would assert nine disease units
      where this entry curates one, so a claims query should expand to that family rather
      than read this mapping as exhaustive.
  - term:
      id: ICD10CM:O42
      label: Premature rupture of membranes
    mapping_predicate: skos:broadMatch
    mapping_source: ICD10CM
    mapping_justification: >-
      The ICD-10-CM category covering rupture of the membranes before labour at any
      gestation. It is broader than this entry, which is restricted to rupture before 37
      weeks: O42.02, O42.12 and O42.92 code the full-term case, which this entry treats
      as a differential diagnosis rather than as itself.

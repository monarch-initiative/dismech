clinical_burden:
  burden_level: HIGH
  rationale: >-
    PPROM is the commonest identifiable antecedent of preterm birth, which is itself the
    leading cause of neonatal death worldwide. The burden is almost entirely
    transmitted: the rupture harms nobody directly, but it delivers the fetus early,
    opens the amniotic cavity to ascending infection, and - when it happens early enough
    and lasts long enough - removes the amniotic fluid that fetal lung development
    requires.
  evidence:
  - reference: PMID:11293640
    reference_title: "Broad-spectrum antibiotics for preterm, prelabour rupture of fetal membranes: the ORACLE I randomised trial. ORACLE Collaborative Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preterm, prelabour rupture of the fetal membranes (pPROM) is the commonest antecedent of preterm birth, and can lead to death, neonatal disease, and long-term disability."
    explanation: States the burden claim directly, from the largest randomised trial in the condition.
  - reference: PMID:8828433
    reference_title: "Defining limits of survival: lethal pulmonary hypoplasia after midtrimester premature rupture of membranes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both duration of severe oligohydramnios exposure and gestational age at premature rupture of membranes were independent significant predictors of increased neonatal risk."
    explanation: >-
      Identifies the two variables that govern outcome, which is why this entry models
      gestational age at rupture and latency duration rather than rupture alone.
pathophysiology:
- name: Oxidative Stress in the Fetal Membranes
  biological_scale: CELLULAR
  description: >-
    Reactive oxygen species accumulate in the amniochorion during gestation and are
    accelerated by risk-factor exposures. This is the node the contemporary model puts
    upstream of everything else in the non-infectious route to PPROM, and it is also the
    node at which the main modifiable risk factor - smoking - acts.
  cell_types:

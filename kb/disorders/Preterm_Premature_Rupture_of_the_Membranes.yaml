      label: inflammatory response
  - preferred_term: cytokine-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
  locations:
  - preferred_term: amniotic fluid
    term:
      id: UBERON:0000173
      label: amniotic fluid
  evidence:
  - reference: PMID:32591087
    reference_title: Antibiotic administration reduces the rate of intraamniotic inflammation in preterm prelabor rupture of the membranes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intraamniotic infection was defined as the presence of both microbial invasion of the amniotic cavity and intraamniotic inflammation; sterile intraamniotic inflammation was defined as the presence of intraamniotic inflammation without microbial invasion of the amniotic cavity."
    explanation: >-
      The operational definitions that separate the infected from the sterile route, both
      of which this node covers.
  - reference: PMID:32785751
    reference_title: Novel pathways of inflammation in human fetal membranes associated with preterm birth and preterm pre-labor rupture of the membranes.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: IN_VITRO
    snippet: "Inflammation degrades the matrix and destabilizes membrane function."
    explanation: >-
      States the inflammation-to-matrix step that the downstream edge asserts. The
      degradation and mechanical-destabilisation work behind the sentence is done on
      cultured fetal membrane explants, so it is graded IN_VITRO rather than OTHER, and
      REVIEW_SYNTHESIS records that the citing publication is a review.
  downstream:
  - target: Matrix Metalloproteinase-Mediated Collagen Degradation in the Amniochorion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9822510
      reference_title: A role for matrix metalloproteinase-9 in spontaneous rupture of the fetal membranes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Women with microbial invasion of the amniotic cavity had higher median matrix metalloproteinase-9 concentrations than did those without microbial invasion regardless of membrane status"
      explanation: >-
        Links the infectious arm of the inflammation node to the MMP-9 node, and does so
        independently of membrane status - so the association is not merely a consequence
        of the rupture having already happened.
  - target: Onset of Preterm Parturition
    causal_link_type: DIRECT
    description: >-
      Intraamniotic inflammation activates the myometrium as well as degrading the
      membranes, so an inflamed pregnancy can reach preterm delivery without waiting for
      the barrier failure. This is the edge that makes latency finite even when the
      rupture is managed perfectly.
- name: Decidual Haemorrhage and Thrombin Generation
  biological_scale: TISSUE
  description: >-
    Bleeding at the decidual interface generates thrombin, which overrides the
    progestin suppression of collagenase expression in decidual cells. This is a
    maternal-side entry into the same proteolytic node and is the mechanistic account of
    why placental abruption and PPROM travel together clinically.
  cell_types:
  - preferred_term: decidual cell
    term:
      id: CL:2000002
      label: decidual cell
  locations:
  - preferred_term: decidua
    term:
      id: UBERON:0002450
      label: decidua
  evidence:
  - reference: PMID:12380602
    reference_title: "Thrombin-enhanced matrix metalloproteinase-1 expression: a mechanism linking placental abruption with premature rupture of the membranes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "MPA strongly inhibited MMP-1 levels in endometrial stromal and term decidual cells. However, thrombin overcame this suppression, producing MMP-1 levels that were several-fold higher than control levels."
    explanation: >-
      The measured result: thrombin defeats the progestin brake on interstitial
      collagenase. INDIRECT because it is cultured cells under a hormonal mimic, and the
      authors themselves describe the step to the pregnant state as an extrapolation.
  downstream:
  - target: Matrix Metalloproteinase-Mediated Collagen Degradation in the Amniochorion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12380602
      reference_title: "Thrombin-enhanced matrix metalloproteinase-1 expression: a mechanism linking placental abruption with premature rupture of the membranes."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Extrapolation of thrombin-enhanced MMP-1 expression in cultured endometrial stromal and decidual cells to the in vivo pregnant state provides an explanation for the strong association between placental abruption and preterm membrane rupture."
      explanation: >-
        Quoted with its own hedge intact - the authors label the move to the in vivo
        pregnant state an extrapolation, which is why this edge is not DIRECT.
- name: Reduced Amnion Collagen Synthesis
  biological_scale: MOLECULAR
  description: >-
    Amnion fibroblasts lay down the fibrillar collagen that gives the sheet its tensile
    strength, and that synthesis depends on the collagen-specific chaperone HSP47,
    encoded by SERPINH1. A promoter allele that lowers SERPINH1 transcription is the one
    genetic finding in PPROM that has both an effect on the molecule and a replicated
    clinical association, so this node is the genetic entry point into the same
    structural failure the proteolytic nodes reach from the other direction.

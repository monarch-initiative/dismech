genetic:
- name: HACD1
  gene_term:
    preferred_term: HACD1
    term:
      id: hgnc:9639
      label: HACD1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported homozygous alleles (NM_014241): c.744C>A p.(Tyr248*) in a large
    consanguineous family with eight examined affected members;
    c.373_375+2delGAGGT (splice), reported in the 2021 cohort and in four
    unrelated Brazilian families; c.785-1G>T and c.785-2A>T (intron 6 splice
    acceptor); c.458G>A (nonsense); and a homozygous LINE insertion of about
    1.25 kb in exon 6 (c.739_740delins1250, PMID:32426512, a case letter with
    no abstract). ClinGen classifies HACD1 as Definitive for autosomal
    recessive congenital myopathy under the parent class MONDO:0019952, not
    under this MONDO term, so no gene_disease_validity assertion is recorded
    here.
  evidence:
  - reference: PMID:33354762
    reference_title: "Biallelic loss-of-function HACD1 variants are a bona fide cause of congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings conclusively confirm the implication of HACD1 in the pathogenesis of congenital myopathies"
    explanation: Independent families confirm HACD1 as a congenital myopathy gene.
  - reference: PMID:23933735
    reference_title: "Congenital myopathy is caused by mutation of HACD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide linkage analysis and whole-exome sequencing identified a homozygous non-sense mutation in 3-hydroxyacyl-CoA dehydratase 1 (HACD1) in affected individuals."
    explanation: Gene discovery report.
  - reference: PMID:42275936
    reference_title: "HACD1-related congenital myopathy skeletal muscle MRI findings in a Brazilian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same pathogenic biallelic HACD1 variant was found in all cases (c.373_375+2delGAGGT)."
    explanation: Recurrent splice allele in four unrelated Brazilian families.
animal_models:
- name: Labrador retriever HACD1 centronuclear myopathy
  species: Canis lupus familiaris
  genotype: HACD1 (PTPLA) exon 2 SINE insertion, homozygous (PTPLA cnm allele)
  publication: PMID:15829503
  description: >-
    Naturally occurring autosomal recessive myopathy of Labrador retrievers,
    spread worldwide from a single recent founder. Affected dogs have
    hypotonia, generalized weakness and reduced exercise capacity, and the
    canine disease is classified histologically as a centronuclear myopathy.
  associated_phenotypes:
  - Generalized muscle weakness and reduced walking distance
  - Centronuclear myopathy histology
  - T-tubule dilatation and mislocalized triads
  evidence:
  - reference: PMID:15829503
    reference_title: "SINE exonic insertion in the PTPLA gene leads to multiple splicing defects and segregates with the autosomal recessive centronuclear myopathy in dogs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Described herein is a disease-associated insertion within PTPLA exon 2, found in both alleles of all affected Labradors and in a single allele in obligate carriers."
    explanation: Homozygous HACD1 insertion segregates with the canine myopathy.
  - reference: PMID:12884002
    reference_title: "The cnm locus, a canine homologue of human autosomal forms of centronuclear myopathy, maps to chromosome 2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We have established a canine pedigree and show that the disorder segregates as an autosomal recessive trait in that pedigree."
    explanation: Autosomal recessive inheritance of the canine disease.
  - reference: PMID:23071563
    reference_title: "Centronuclear myopathy in Labrador retrievers: a recent founder mutation in the PTPLA gene has rapidly disseminated worldwide."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Haplotype analysis demonstrated that the PTPLA(cnm) allele resulted from a single and recent mutational event that may have rapidly disseminated through the extensive use of popular sires."
    explanation: Single founder allele shared by affected Labradors worldwide.
  - reference: PMID:27012153
    reference_title: "Noninvasive Assessment of Neuromuscular Disease in Dogs: Use of the 6-minute Walk Test to Assess Submaximal Exercise Tolerance in Dogs with Centronuclear Myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Degree of paresis varied among affected dogs, and was reflected by significant differences in distance walked between CNM-affected dogs and those with clear and carrier genotypes (P = .048)."
    explanation: Measurable reduction in exercise capacity in homozygous dogs.
  modeled_mechanisms:
  - target: HACD1 Biallelic Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: The insertion disrupts splicing so that wild-type HACD1 transcript falls to about 1% in muscle.
    limitations: >-
      A hypomorphic splicing allele rather than the nonsense, splice-site or
      exon 6 insertion alleles seen in patients.
    evidence:
    - reference: PMID:15829503
      reference_title: "SINE exonic insertion in the PTPLA gene leads to multiple splicing defects and segregates with the autosomal recessive centronuclear myopathy in dogs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "As a result, the amount of wild-type transcripts falls to 1% in affected muscles."
      explanation: Near-complete loss of normal HACD1 transcript.
  - target: Impaired Myoblast Fusion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reduced myoblast fusion in HACD1-deficient Labradors.
    evidence:
    - reference: PMID:26160855
      reference_title: "HACD1, a regulator of membrane composition and fluidity, promotes myoblast fusion and skeletal muscle growth."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Through analysis of HACD1-deficient Labradors, Hacd1-knockout mice, and Hacd1-deficient myoblasts, we provide evidence that HACD1 promotes myoblast fusion during muscle development and regeneration."
      explanation: Dogs are one of the three systems showing the fusion defect.
  - target: T-Tubule and Sarcoplasmic Membrane Disorganization
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Progressive membrane system defects in canine muscle.
    limitations: >-
      Membrane and nuclear-position changes are prominent in dogs but have
      not been described in human HACD1 biopsies, so this node may be
      canine-specific or age-dependent.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The dog disease is progressive and centronuclear, whereas the human
        disease improves with age and shows fiber-type disproportion with only
        rare internal nuclei; the T-tubule lesion has been documented only in
        the dog.
    evidence:
    - reference: PMID:27939133
      reference_title: "Progressive Structural Defects in Canine Centronuclear Myopathy Indicate a Role for HACD1 in Maintaining Skeletal Muscle Membrane Systems."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found progressive changes in tubuloreticular and sarcolemmal membranes and mislocalized triads and mitochondria in skeletal muscle from animals deficient in HACD1."
      explanation: The membrane lesion is defined in this model.
  - target: Myofiber Hypotrophy With Fiber Size Disproportion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Fiber size disproportion with generalized weakness, as in patients.
    evidence:
    - reference: PMID:26160855
      reference_title: "HACD1, a regulator of membrane composition and fluidity, promotes myoblast fusion and skeletal muscle growth."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "In humans and dogs, HACD1 deficiency leads to a congenital myopathy with fibre size disproportion associated with a generalized muscle weakness."
      explanation: Shared fiber size phenotype between dogs and humans.
- name: Hacd1 knockout mouse
  species: Mus musculus
  genotype: Hacd1-/-
  publication: PMID:28784662
  description: >-
    Hacd1 knockout mice have reduced body and skeletal muscle weight and
    impaired myoblast fusion, but only a partial fall in muscle dehydratase
    activity because of HACD2 redundancy. Hacd1-deficient mice also show
    reduced muscle cardiolipin, mitochondrial uncoupling and increased energy
    expenditure.
  associated_phenotypes:
  - Reduced body and skeletal muscle weight
  - Increased basal energy expenditure
  evidence:
  - reference: PMID:28784662
    reference_title: "The 3-hydroxyacyl-CoA dehydratases HACD1 and HACD2 exhibit functional redundancy and are active in a wide range of fatty acid elongation pathways."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we generated Hacd1 KO mice and observed that these mice had reduced body and skeletal muscle weights."
    explanation: Reduced muscle mass in the knockout.
  modeled_mechanisms:
  - target: Reduced 3-Hydroxyacyl-CoA Dehydratase Activity in Muscle
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Muscle dehydratase activity falls by about 40%.
    limitations: >-
      HACD2 redundancy limits the biochemical defect, and the same study
      found no change in membrane lipid composition in knockout muscle.
    evidence:
    - reference: PMID:28784662
      reference_title: "The 3-hydroxyacyl-CoA dehydratases HACD1 and HACD2 exhibit functional redundancy and are active in a wide range of fatty acid elongation pathways."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, we observed only an ∼40% reduction in HACD activity and no changes in membrane lipid composition in Hacd1-KO skeletal muscle, suggesting that some HACD activities are redundant."
      explanation: Partial loss of activity in knockout muscle.
  - target: Impaired Myoblast Fusion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Knockout mice show reduced myoblast fusion in development and regeneration.
    evidence:
    - reference: PMID:26160855
      reference_title: "HACD1, a regulator of membrane composition and fluidity, promotes myoblast fusion and skeletal muscle growth."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Through analysis of HACD1-deficient Labradors, Hacd1-knockout mice, and Hacd1-deficient myoblasts, we provide evidence that HACD1 promotes myoblast fusion during muscle development and regeneration."
      explanation: Knockout mice are one of the systems showing the fusion defect.
  - target: Reduced Mitochondrial Cardiolipin and Coupling Efficiency
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: The cardiolipin and coupling finding is defined in this model.
    limitations: >-
      Not examined in patients, so whether the mitochondrial change occurs in
      human HACD1 deficiency is unknown.
    evidence:
    - reference: PMID:33523852
      reference_title: "Cardiolipin content controls mitochondrial coupling and energetic efficiency in muscle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, muscle-specific modulation of the very-long-chain fatty acid pathway was associated with a reduced content of the inner mitochondrial membrane phospholipid cardiolipin and a blunted coupling efficiency between the respiratory chain and adenosine 5'-triphosphate (ATP) synthase, which was restored by cardiolipin enrichment."
      explanation: Mitochondrial phenotype of the Hacd1-deficient mouse.

- name: T-Tubule and Sarcoplasmic Membrane Disorganization
  biological_scale: CELLULAR
  description: >-
    In HACD1-deficient Labrador muscle, T-tubules dilate and become
    disorganized, tubuloreticular and sarcolemmal membranes change
    progressively, and triads and mitochondria are mislocalized, a picture
    shared with other centronuclear myopathies and proposed to impair
    excitation-contraction coupling. Such membrane changes have not been
    reported in human HACD1 biopsies.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: T-tubule organization
    term:
      id: GO:0033292
      label: T-tubule organization
    modifier: DECREASED
  evidence:
  - reference: PMID:27939133
    reference_title: "Progressive Structural Defects in Canine Centronuclear Myopathy Indicate a Role for HACD1 in Maintaining Skeletal Muscle Membrane Systems."

name: Congenital Myopathy 11
creation_date: "2026-10-16T09:00:00Z"
category: Mendelian
synonyms:
- CMYO11
- HACD1-related congenital myopathy
- HACD1-related myopathy
- PTPLA-related myopathy
description: >-
  Ultra-rare autosomal recessive congenital myopathy caused by biallelic
  loss-of-function variants in HACD1 (formerly PTPLA), which encodes
  3-hydroxyacyl-CoA dehydratase 1, a muscle-enriched endoplasmic reticulum
  enzyme catalysing the third (dehydration) step of the very-long-chain fatty
  acid elongation cycle. Affected infants present at birth or in the neonatal
  period with severe hypotonia, generalized muscle weakness, motor delay and in
  some cases respiratory distress, followed by marked spontaneous improvement
  through childhood. Muscle biopsy shows congenital fiber-type disproportion
  (small type 1 fibers), and muscle MRI shows fatty infiltration of the pelvic
  girdle and posterior leg compartments with sparing of the anterior
  compartments. Reported alleles are nonsense, splice-site and retrotransposon
  insertion variants. A naturally occurring HACD1 (PTPLA) insertion causes an
  autosomal recessive centronuclear myopathy in Labrador retrievers, and Hacd1
  knockout mice have reduced muscle mass; studies in these models implicate
  altered membrane phospholipid composition, impaired myoblast fusion and
  disorganized T-tubule and sarcoplasmic membrane systems.

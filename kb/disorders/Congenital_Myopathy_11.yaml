discussions:
- discussion_id: canine_centronuclear_versus_human_cftd
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#T-Tubule and Sarcoplasmic Membrane Disorganization
  - animal_models#Canis lupus familiaris
  prompt: >-
    Is the T-tubule and sarcoplasmic membrane lesion of HACD1-deficient dogs
    part of the human disease, given that human biopsies show fiber-type
    disproportion without centronuclear or membrane changes, and that the
    human course improves while the canine course progresses?
  rationale: >-
    Most mechanistic data on HACD1 deficiency come from the Labrador model, in
    which the myopathy is classified as centronuclear and the membrane lesion
    worsens with age. Human patients improve, and their biopsies, taken in
    early childhood, show small type 1 fibers with only rare internal nuclei.
    The difference may reflect biopsy age, species differences in HACD2
    compensation or allele type, and it decides whether membrane maintenance
    or myoblast fusion is the mechanism to pursue in patients.
  evidence:
  - reference: PMID:15829503
    reference_title: "SINE exonic insertion in the PTPLA gene leads to multiple splicing defects and segregates with the autosomal recessive centronuclear myopathy in dogs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Labrador retrievers affected by spontaneous centronuclear myopathy (cnm) have clinical and histological features of the human disorder and represent the first model of recessive autosomal centronuclear myopathy."
    explanation: The canine disease is centronuclear.
  - reference: PMID:42275936
    reference_title: "HACD1-related congenital myopathy skeletal muscle MRI findings in a Brazilian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsy revealed congenital fiber type disproportion."
    explanation: Human biopsies show fiber-type disproportion.
  proposed_experiments:
  - experiment_id: adult_patient_muscle_ultrastructure
    name: Ultrastructure of adult HACD1 patient muscle
    description: >-
      Electron microscopy and T-tubule immunostaining of muscle from adult
      HACD1 patients, compared with age-matched controls, to test whether the
      canine membrane lesion appears with age in humans.
    would_support:
    - pathophysiology#T-Tubule and Sarcoplasmic Membrane Disorganization
- discussion_id: muscle_lipid_composition_in_hacd1_deficiency
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Myoblast Membrane Phospholipid Composition
  prompt: >-
    Is membrane phospholipid composition altered in HACD1-deficient human
    muscle or myoblasts, and at which developmental stage?
  rationale: >-
    The lipid-dependent fusion model rests on expression of HACD1 in normal
    myoblasts, while adult Hacd1 knockout mouse muscle showed no membrane lipid
    change. Lipidomics of patient myoblasts through differentiation would show
    whether the proposed lipid mechanism operates in the human disease.
  evidence:
  - reference: PMID:28784662
    reference_title: "The 3-hydroxyacyl-CoA dehydratases HACD1 and HACD2 exhibit functional redundancy and are active in a wide range of fatty acid elongation pathways."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, we observed only an ∼40% reduction in HACD activity and no changes in membrane lipid composition in Hacd1-KO skeletal muscle, suggesting that some HACD activities are redundant."
    explanation: Negative lipid result in adult knockout muscle.
notes: >-
  No disease-specific treatment has been reported; management in published
  cases is supportive. The canine disease is catalogued as a centronuclear
  myopathy, but MONDO places the human disease under congenital myopathy and
  human biopsies are not centronuclear.

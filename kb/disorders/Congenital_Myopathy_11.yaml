    evidence_source: MODEL_ORGANISM
    snippet: "We found progressive changes in tubuloreticular and sarcolemmal membranes and mislocalized triads and mitochondria in skeletal muscle from animals deficient in HACD1."
    explanation: Ultrastructural membrane defects in HACD1-deficient dogs.
  - reference: PMID:27939133
    reference_title: "Progressive Structural Defects in Canine Centronuclear Myopathy Indicate a Role for HACD1 in Maintaining Skeletal Muscle Membrane Systems."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our novel findings, including T-tubule dilatation and disorganization, associated with defects in this additional CNM-associated gene provide a definitive pathophysiologic link with these disorders, confirm that dogs deficient in HACD1 are relevant models, and strengthen the evidence for a unifying pathogenesis in CNMs via defective membrane trafficking and excitation-contraction coupling in muscle."
    explanation: T-tubule dilatation and the proposed excitation-contraction coupling consequence.
  downstream:
  - target: Neonatal Generalized Muscle Weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed by analogy with other centronuclear myopathies, through
      defective excitation-contraction coupling; coupling has not been
      measured in HACD1 deficiency, and the membrane lesion is documented only
      in dogs.

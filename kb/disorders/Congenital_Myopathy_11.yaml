    reference_title: "Congenital myopathy is caused by mutation of HACD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide linkage analysis and whole-exome sequencing identified a homozygous non-sense mutation in 3-hydroxyacyl-CoA dehydratase 1 (HACD1) in affected individuals."
    explanation: Homozygous HACD1 variant segregating in the consanguineous founding family.
  - reference: PMID:33354762
    reference_title: "Biallelic loss-of-function HACD1 variants are a bona fide cause of congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three patients manifesting with neonatal-onset generalized muscle weakness and motor delay that carried three novel homozygous likely pathogenic HACD1 variants."
    explanation: Three further homozygous patients with three different alleles.
  - reference: PMID:36823680
    reference_title: "Identification of a novel mutation in the HACD1 gene in an Iranian family with autosomal recessive congenital myopathy, with fibre-type disproportion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCR-Sanger-sequencing data analysis confirmed the WES result in the proband and showed that the parents were carriers for the mutation."
    explanation: Homozygous proband with heterozygous carrier parents.
pathophysiology:
- name: HACD1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous nonsense (c.744C>A p.Tyr248*, c.458G>A), splice-site
    (c.373_375+2delGAGGT, c.785-1G>T, c.785-2A>T) and LINE retrotransposon
    insertion alleles remove functional HACD1. The p.Tyr248* allele reduces
    muscle HACD1 mRNA to 31% of control through nonsense-mediated decay, and
    the encoded protein has no 3-hydroxyacyl-CoA dehydratase activity.
  genes:
  - preferred_term: HACD1
    term:
      id: hgnc:9639
      label: HACD1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:23933735
    reference_title: "Congenital myopathy is caused by mutation of HACD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation results in non-sense mediated decay of the HACD1 mRNA to 31% of control levels in patient muscle and completely abrogates the enzymatic activity of dehydration of 3-hydroxyacyl-CoA, the third step in the elongation of very long-chain fatty acids (VLCFAs)."
    explanation: Reduced transcript in patient muscle and loss of enzyme activity of the mutant protein.
  - reference: PMID:33354762
    reference_title: "Biallelic loss-of-function HACD1 variants are a bona fide cause of congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two of these changes (c.373_375+2delGAGGT and c.785-1G>T) were predicted to introduce splice site alterations, while one is a nonsense change (c.458G>A)."
    explanation: Splice-site and nonsense alleles, all predicted loss of function.
  - reference: PMID:36823680
    reference_title: "Identification of a novel mutation in the HACD1 gene in an Iranian family with autosomal recessive congenital myopathy, with fibre-type disproportion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES data analysis identified a homozygous single nucleotide change (A>T) at position c.785-2 located in intron 6 of the HACD1 gene"
    explanation: A further canonical splice-acceptor allele.
  downstream:
  - target: Reduced 3-Hydroxyacyl-CoA Dehydratase Activity in Muscle
    causal_link_type: DIRECT
    description: Loss of HACD1 removes the most abundant 3-hydroxyacyl-CoA dehydratase transcript of skeletal muscle.
    evidence:
    - reference: PMID:23933735
      reference_title: "Congenital myopathy is caused by mutation of HACD1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We suggest that the mutation in the HACD1 gene causes a reduction in the synthesis of VLCFAs, which are components of membrane lipids and participants in physiological processes, leading to congenital myopathy."
      explanation: The authors' model linking the HACD1 lesion to reduced VLCFA synthesis.
  - target: Impaired Myoblast Differentiation
    causal_link_type: DIRECT
    description: >-
      HACD1 (PTPLA) depletion arrests cultured myoblasts before differentiation;
      whether this acts through VLCFA elongation has not been tested.
    evidence:
    - reference: PMID:22106411
      reference_title: "Protein tyrosine phosphatase-like A regulates myoblast proliferation and differentiation through MyoG and the cell cycling signaling pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The cells lacking PTPLa remained immature and failed to differentiate into mature myotubes."
      explanation: Loss of PTPLa (HACD1) blocks myotube differentiation in cultured myoblasts.
  - target: T-Tubule and Sarcoplasmic Membrane Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HACD1-deficient canine muscle and cultured HACD1-deficient myotubes show
      the same membrane abnormalities, so the defects follow from HACD1 loss;
      the lipid species responsible are not identified.
    evidence:
    - reference: PMID:27939133
      reference_title: "Progressive Structural Defects in Canine Centronuclear Myopathy Indicate a Role for HACD1 in Maintaining Skeletal Muscle Membrane Systems."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, comparable membranous abnormalities in cultured HACD1-deficient myotubes provide additional evidence that these defects are a primary consequence of altered HACD1 expression."
      explanation: Cell-autonomous reproduction of the membrane defects in HACD1-deficient myotubes.
- name: Reduced 3-Hydroxyacyl-CoA Dehydratase Activity in Muscle
  biological_scale: MOLECULAR
  description: >-
    HACD1 is one of four mammalian 3-hydroxyacyl-CoA dehydratases (HACD1-4)
    that dehydrate 3-hydroxyacyl-CoA to trans-2-enoyl-CoA in the endoplasmic
    reticulum elongation cycle, interacting with the ELOVL condensing enzymes.
    HACD1 is the most highly expressed isoform in skeletal muscle. In Hacd1
    knockout mouse muscle total dehydratase activity falls by only about 40%,
    because HACD2 carries a redundant activity, which may explain the
    relatively mild and improving human course.
  genes:
  - preferred_term: HACD1
    term:
      id: hgnc:9639
      label: HACD1
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: skeletal muscle myoblast
    term:
      id: CL:0000515
      label: skeletal muscle myoblast
  molecular_functions:
  - preferred_term: very-long-chain 3-hydroxyacyl-CoA dehydratase activity
    term:
      id: GO:0102158
      label: very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: very long-chain fatty acid biosynthetic process
    term:
      id: GO:0042761
      label: very long-chain fatty acid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:18554506
    reference_title: "Characterization of four mammalian 3-hydroxyacyl-CoA dehydratases involved in very long-chain fatty acid synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that all four of these human proteins are indeed 3-hydroxyacyl-CoA dehydratases, in growth suppression experiments using a PHS1-shut off yeast strain and/or in vitro 3-hydroxypalmitoyl-CoA dehydratase assays."
    explanation: Establishes HACD1 as a 3-hydroxyacyl-CoA dehydratase of VLCFA synthesis.
  - reference: PMID:18554506
    reference_title: "Characterization of four mammalian 3-hydroxyacyl-CoA dehydratases involved in very long-chain fatty acid synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also establish that HACD proteins interact with the condensation enzymes ELOVL1-7, with some preferences."
    explanation: HACD1 acts with the ELOVL condensing enzymes in the elongation cycle.
  - reference: PMID:28784662
    reference_title: "The 3-hydroxyacyl-CoA dehydratases HACD1 and HACD2 exhibit functional redundancy and are active in a wide range of fatty acid elongation pathways."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, we observed only an ∼40% reduction in HACD activity and no changes in membrane lipid composition in Hacd1-KO skeletal muscle, suggesting that some HACD activities are redundant."
    explanation: Dehydratase activity is reduced but not abolished in Hacd1 knockout muscle.
  - reference: PMID:28784662
    reference_title: "The 3-hydroxyacyl-CoA dehydratases HACD1 and HACD2 exhibit functional redundancy and are active in a wide range of fatty acid elongation pathways."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We therefore conclude that HACD1 and HACD2 exhibit redundant activities in a wide range of FA elongation pathways, including those for saturated to polyunsaturated FAs, with HACD2 being the major 3-hydroxyacyl-CoA dehydratase."
    explanation: HACD2 redundancy limits the biochemical consequence of HACD1 loss.
  downstream:
  - target: Altered Myoblast Membrane Phospholipid Composition
    causal_link_type: DIRECT
    description: >-
      Catalytically active HACD1 shifts myoblast phospholipid acyl chains
      toward longer and monounsaturated species and lowers
      lysophosphatidylcholine; its loss is expected to reverse this. The
      mouse data on the target node conflict.
    evidence:
    - reference: PMID:26160855
      reference_title: "HACD1, a regulator of membrane composition and fluidity, promotes myoblast fusion and skeletal muscle growth."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "We further demonstrate that in normal differentiating myoblasts, expression of the catalytically active HACD1 isoform, which is encoded by a muscle-enriched splice variant, yields decreased lysophosphatidylcholine content, a potent inhibitor of myoblast fusion"
      explanation: Expression experiment in normal myoblasts; the deficiency state is inferred from it.
  - target: Reduced Mitochondrial Cardiolipin and Coupling Efficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In mice lacking the muscle-specific VLCFA enzyme (Hacd1), the altered
      elongation pathway was associated with lower cardiolipin and looser
      mitochondrial coupling.
    evidence:
    - reference: PMID:33523852
      reference_title: "Cardiolipin content controls mitochondrial coupling and energetic efficiency in muscle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, muscle-specific modulation of the very-long-chain fatty acid pathway was associated with a reduced content of the inner mitochondrial membrane phospholipid cardiolipin and a blunted coupling efficiency between the respiratory chain and adenosine 5'-triphosphate (ATP) synthase, which was restored by cardiolipin enrichment."
      explanation: >-
        Hacd1-deficient mouse muscle; the abstract names the enzyme only as a
        muscle-specific enzyme of very-long-chain fatty acid synthesis, and the
        study's model is the Hacd1 knockout.
- name: Altered Myoblast Membrane Phospholipid Composition
  biological_scale: CELLULAR
  description: >-
    HACD1 activity in differentiating myoblasts lowers lysophosphatidylcholine,
    a fusion inhibitor, raises the proportion of C18 and longer and
    monounsaturated phospholipid acyl chains and reduces plasma membrane
    rigidity. A separate Hacd1 knockout line showed no change in the membrane
    lipid composition of adult skeletal muscle, so whether and when lipid
    composition is altered in deficient human muscle is unresolved.
  cell_types:
  - preferred_term: skeletal muscle myoblast
    term:
      id: CL:0000515
      label: skeletal muscle myoblast
  evidence:
  - reference: PMID:26160855
    reference_title: "HACD1, a regulator of membrane composition and fluidity, promotes myoblast fusion and skeletal muscle growth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These lipid modifications correlate with a reduction in plasma membrane rigidity."
    explanation: HACD1-dependent lipid changes alter myoblast membrane physical properties.
  - reference: PMID:28784662
    reference_title: "The 3-hydroxyacyl-CoA dehydratases HACD1 and HACD2 exhibit functional redundancy and are active in a wide range of fatty acid elongation pathways."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "However, we observed only an ∼40% reduction in HACD activity and no changes in membrane lipid composition in Hacd1-KO skeletal muscle, suggesting that some HACD activities are redundant."
    explanation: >-
      No detectable membrane lipid change in adult Hacd1 knockout muscle, which
      argues against a persistent lipid composition defect in mature muscle.
  downstream:
  - target: Impaired Myoblast Fusion
    causal_link_type: DIRECT
    description: Lysophosphatidylcholine inhibits myoblast fusion, and membrane rigidity is altered.
    evidence:
    - reference: PMID:26160855
      reference_title: "HACD1, a regulator of membrane composition and fluidity, promotes myoblast fusion and skeletal muscle growth."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In conclusion, we propose that fusion impairment constitutes a novel, non-exclusive pathological mechanism operating in congenital myopathies and reveal that HACD1 is a key regulator of a lipid-dependent muscle fibre growth mechanism."
      explanation: Authors' conclusion linking the HACD1 lipid effect to fusion-dependent fiber growth.

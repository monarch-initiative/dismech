    snippet: "Fetal akinesia deformation sequence (FADS) is a rare condition characterized by intrauterine growth retardation (IUGR), congenital limb contractures, pulmonary hypoplasia, hydramnios and craniofacial abnormalities."
    explanation: >-
      Defines the deformation sequence in which pulmonary hypoplasia sits
      alongside the contractures.
  downstream:
  - target: Neonatal Respiratory Failure
    causal_link_type: DIRECT
    description: >-
      A hypoplastic lung cannot support gas exchange after delivery.
    evidence:

- name: Absent Fetal Movement
  biological_scale: ORGANISM
  description: >-
    Total or near-total fetal akinesia, detectable on ultrasound from the late
    first or second trimester and persisting at every subsequent examination.
    This is the convergence node of the whole entry: every subtype, whatever the
    level of its primary lesion, arrives here, and everything below it is
    deformation secondary to the missing movement rather than a separate genetic
    effect.
  evidence:

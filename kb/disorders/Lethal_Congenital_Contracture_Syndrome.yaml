- name: Joint Contracture Formation
  biological_scale: TISSUE
  description: >-
    Fixed, non-progressive contractures of multiple joints in both upper and
    lower limbs, classically extended elbows with flexed knees or the reverse.
    Because embryonic movement is required for normal joint cavitation and
    skeletal maturation, the contractures are a developmental deformation and do
    not spontaneously reverse once formed.

        deformations. Indirect because the swallowing step is inferred from the
        polyhydramnios rather than measured.
- name: Joint Contracture Formation
  biological_scale: TISSUE
  description: >-
    Fixed, non-progressive contractures of multiple joints in both upper and
    lower limbs, classically extended elbows with flexed knees or the reverse.
    Because embryonic movement is required for normal joint cavitation and
    skeletal maturation, the contractures are a developmental deformation and do
    not spontaneously reverse once formed.
  locations:
  - preferred_term: limb joint
    term:
      id: UBERON:0003657
      label: limb joint
  evidence:
  - reference: PMID:26142413
    reference_title: "The importance of foetal movement for co-ordinated cartilage and bone development in utero : clinical consequences and potential for therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Infants whose movement in utero is reduced or restricted and who subsequently suffer from joint dysplasia (including joint contractures) and thin hypo-mineralised bones, demonstrate that embryonic movement is crucial for appropriate skeletogenesis."
    explanation: >-
      Supplies the developmental-biology basis for treating the contractures as a
      consequence of the missing movement.
  - reference: PMID:16892327
    reference_title: Lethal congenital contracture syndrome (LCCS) and other lethal arthrogryposes in Finland--an epidemiological study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple joint contractures in both upper and lower limbs, hydrops, and fetal death before the 32nd week of pregnancy"
    explanation: Records the distribution of contractures in the LCCS series.
- name: Impaired Swallowing
  biological_scale: ORGANISM
  description: >-
    Loss of the swallowing that normally clears amniotic fluid before birth,
    producing polyhydramnios, and the same deficit persisting after birth as
    dysphagia requiring nasogastric or gastrostomy feeding. Named without
    "fetal" because the node spans both periods - the postnatal half is what
    enteral feeding targets.
  evidence:
  - reference: PMID:35806855
    reference_title: "Lethal Congenital Contracture Syndrome 11: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fetus exhibited hydrops, short long bones, fixed limb joints, absent fetal movements, and polyhydramnios."
    explanation: >-
      Records polyhydramnios alongside the absent fetal movement in an LCCS11
      fetus.
- name: Pulmonary Hypoplasia
  biological_scale: ORGANISM
  description: >-
    Underdevelopment of the fetal lung secondary to absent fetal breathing
    movements and to thoracic restriction. It is the principal proximate cause of
    death in liveborn infants and the reason that respiratory support determines
    survival more than any other single factor.
  biological_processes:
  - preferred_term: lung development
    term:
      id: GO:0030324
      label: lung development
    modifier: DECREASED
  locations:

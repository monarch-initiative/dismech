clinical_burden:
  burden_level: HIGH
  rationale: >-
    Most affected pregnancies end in fetal death or termination, and liveborn
    infants usually die of respiratory failure within days to months. Survivors
    require tracheostomy, long-term ventilation, gastrostomy feeding and
    continuing orthopaedic and rehabilitative care.
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report six infants and children from four unrelated families with biallelic GLDN mutations, four of whom survived beyond the neonatal period into infancy, childhood, and late adolescence with intensive care and chronic respiratory and nutritional support."
    explanation: >-
      Documents the intensity of support required by the survivors, and so the
      burden even in the least lethal subtype.

pathophysiology:
- name: Anterior Horn Motor Neuron Degeneration
  biological_scale: CELLULAR
  subtypes:
  - LCCS1
  - LCCS2
  - LCCS3
  description: >-
    Loss and failed maturation of spinal anterior horn motor neurons, with
    severe atrophy of the ventral spinal cord. This is the defining
    neuropathological lesion of the original Finnish and Bedouin subtypes, and
    it is what makes LCCS a fetal motor neuron disease rather than a primary
    myopathy. GLE1 loss impairs nuclear mRNA export in motor neuron precursors;
    the zebrafish model shows the deficit arises from apoptosis of dividing
    neural precursors rather than of already-differentiated motoneurons.
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  biological_processes:
  - preferred_term: motor neuron apoptotic process
    term:
      id: GO:0097049
      label: motor neuron apoptotic process
    modifier: INCREASED
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:18204449
    reference_title: Mutations in mRNA export mediator GLE1 result in a fetal motoneuron disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most severe forms of motoneuron disease manifest in utero are characterized by marked atrophy of spinal cord motoneurons and fetal immobility."
    explanation: >-
      Frames LCCS1 as an in utero motor neuron disease with spinal motoneuron
      atrophy and consequent immobility.
  - reference: PMID:17701904
    reference_title: "Lethal congenital contractural syndrome type 2 (LCCS2) is caused by a mutation in ERBB3 (Her3), a modulator of the phosphatidylinositol-3-kinase/Akt pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lethal congenital contractural syndrome type 2 (LCCS2) is an autosomal recessive neurogenic form of arthrogryposis that is associated with atrophy of the anterior horn of the spinal cord."
    explanation: >-
      Records anterior horn atrophy as the neuropathological lesion in LCCS2 as
      well, extending the node beyond LCCS1.
  - reference: PMID:22357925
    reference_title: A zebrafish model of lethal congenital contracture syndrome 1 reveals Gle1 function in spinal neural precursor survival and motor axon arborization.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unexpectedly, the motoneuron deficiency results from apoptosis of neural precursors, not of differentiated motoneurons."
    explanation: >-
      Refines the cellular mechanism: the motoneuron loss is a precursor survival
      defect rather than degeneration of mature neurons.
  downstream:
  - target: Neurogenic Skeletal Muscle Atrophy and Hypoplasia
    causal_link_type: DIRECT
    description: >-
      Denervation of developing skeletal muscle by the failing anterior horn
      motor neuron pool.
    evidence:
    - reference: PMID:18204449
      reference_title: Mutations in mRNA export mediator GLE1 result in a fetal motoneuron disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The most severe forms of motoneuron disease manifest in utero are characterized by marked atrophy of spinal cord motoneurons and fetal immobility."
      explanation: >-
        Couples motoneuron atrophy to fetal immobility; PARTIAL because the
        intervening muscle denervation step is stated in the fetal pathology
        literature rather than in this sentence.
- name: Schwann Cell Myelination Failure
  biological_scale: CELLULAR
  subtypes:
  - LCCS2
  - LCCS8
  - LCCS9
  description: >-
    Failure of Schwann cells to generate peripheral myelin around motor axons.
    ERBB3 is required to generate the Schwann cell precursors that accompany
    motor axons; ADCY6 supplies the cAMP signal that drives myelination; and
    ADGRG6/GPR126 is the adhesion GPCR whose autoproteolytic activation licenses
    it. In ADCY6 and ADGRG6 disease the peripheral nerves are effectively
    amyelinated on electron microscopy or lack myelin basic protein.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: peripheral nervous system myelin formation
    term:
      id: GO:0032290
      label: peripheral nervous system myelin formation
    modifier: DECREASED
  locations:
  - preferred_term: peripheral nervous system
    term:
      id: UBERON:0000010
      label: peripheral nervous system
  evidence:
  - reference: PMID:17701904
    reference_title: "Lethal congenital contractural syndrome type 2 (LCCS2) is caused by a mutation in ERBB3 (Her3), a modulator of the phosphatidylinositol-3-kinase/Akt pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is essential for the generation of precursors of Schwann cells that normally accompany peripheral axons of motor neurons"
    explanation: >-
      Identifies the Schwann cell precursor requirement that ERBB3 loss removes in
      LCCS2.
  - reference: PMID:24319099
    reference_title: Mutations in CNTNAP1 and ADCY6 are responsible for severe arthrogryposis multiplex congenita with axoglial defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morpholino knockdown of the zebrafish orthologs led to severe and specific defects in peripheral myelin in spite of the presence of Schwann cells."
    explanation: >-
      Shows the ADCY6 lesion is a myelination failure rather than an absence of
      Schwann cells.
  - reference: PMID:26004201
    reference_title: Mutations of GPR126 are responsible for severe arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have shown that the peripheral nerves in affected individuals from one family lack myelin basic protein, suggesting that this disease in affected individuals is due to defective myelination of the peripheral axons during fetal development."
    explanation: >-
      Demonstrates absent peripheral myelin in ADGRG6/GPR126-related disease in
      human tissue.
  downstream:
  - target: Impaired Motor Nerve Conduction
    causal_link_type: DIRECT
    description: >-
      Unmyelinated motor axons cannot support saltatory conduction, so impulses
      fail to reach the developing muscle at usable velocity.
    evidence:
    - reference: PMID:26004201
      reference_title: Mutations of GPR126 are responsible for severe arthrogryposis multiplex congenita.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "GPR126 encodes G-protein-coupled receptor 126, which has been shown to be essential for myelination of axons in the peripheral nervous system in fish and mice."
      explanation: >-
        Establishes the myelination requirement; PARTIAL because the conduction
        measurement itself is reported for the nodopathy subtypes rather than here.
- name: Node of Ranvier Assembly Failure
  biological_scale: CELLULAR
  subtypes:
  - LCCS7
  - LCCS11
  description: >-
    Failure to build the axoglial junctions that organize the node of Ranvier.
    CNTNAP1 encodes CASPR, the axonal paranodal component; GLDN encodes
    gliomedin, the Schwann-cell ligand that clusters sodium channels at the
    nascent node through neurofascin-186. These two subtypes are therefore a
    developmental nodopathy - the myelin sheath may be present, but the node is
    not assembled, so the axon cannot conduct.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  cellular_components:
  - preferred_term: node of Ranvier
    term:
      id: GO:0033268
      label: node of Ranvier
  evidence:
  - reference: PMID:24319099
    reference_title: Mutations in CNTNAP1 and ADCY6 are responsible for severe arthrogryposis multiplex congenita with axoglial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNTNAP1 encodes CASPR, an essential component of node of Ranvier domains which underlies saltatory conduction of action potentials along the myelinated axons, an important process for neuronal function."
    explanation: >-
      States the nodal role of CASPR whose loss defines the LCCS7 lesion.
  - reference: PMID:27616481
    reference_title: "Mutations in GLDN, Encoding Gliomedin, a Critical Component of the Nodes of Ranvier, Are Responsible for Lethal Arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The axoglial contact between gliomedin and NF186 is essential for the initial clustering of Na+ channels at developing nodes."
    explanation: >-
      Gives the molecular step gliomedin loss removes in LCCS11.
  - reference: PMID:27616481
    reference_title: "Mutations in GLDN, Encoding Gliomedin, a Critical Component of the Nodes of Ranvier, Are Responsible for Lethal Arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data indicate that mutations of GLDN or CNTNAP1 (MIM: 616286), encoding essential components of the nodes of Ranvier and paranodes, respectively, lead to inherited nodopathies, a distinct disease entity among peripheral neuropathies."
    explanation: >-
      Groups LCCS7 and LCCS11 explicitly as inherited nodopathies, which is why
      they share this node.
  downstream:
  - target: Impaired Motor Nerve Conduction

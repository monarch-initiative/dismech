name: Lethal Congenital Contracture Syndrome
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
description: >-
  Lethal congenital contracture syndrome (LCCS) comprises genetically heterogeneous autosomal recessive disorders
  with prenatal akinesia and congenital contractures. The numbered subtypes involve GLE1-associated spinal motor-neuron
  development, ERBB3 signaling, PIP5K1C-dependent phosphoinositide metabolism, MYBPC1-associated muscle function,
  DNM2-dependent trafficking, ZBTB42-associated muscle development, CNTNAP1 paranodal junctions, ADCY6 and ADGRG6
  peripheral myelination, NEK9-associated skeletal development, GLDN nodal organization, and combined neuronal and
  muscle DST isoforms. Some mechanistic steps are inferred from cellular or animal models and should not be transferred
  between subtypes. Reduced movement can produce joint deformations, impaired fetal swallowing and pulmonary hypoplasia,
  but primary skeletal abnormalities and central nervous system involvement also occur. Prenatal and neonatal mortality
  is high in selected series; GLDN- and CNTNAP1-associated disease can permit longer survival with substantial morbidity.
synonyms:
- LCCS
- Multiple contracture syndrome, Finnish type
- Herva disease
disease_term:
  preferred_term: lethal congenital contracture syndrome
  term:
    id: MONDO:0017436
    label: lethal congenital contracture syndrome
parents:
- Congenital Disorder

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every established LCCS locus is inherited in an autosomal recessive manner,
    with homozygous founder alleles in consanguineous or geographically isolated
    kindreds and compound heterozygosity elsewhere.
  evidence:
  - reference: PMID:25055871
    reference_title: ZBTB42 mutation defines a novel lethal congenital contracture syndrome (LCCS6).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lethal congenital contracture syndrome (LCCS) is a lethal autosomal recessive form of arthrogryposis
      multiplex congenita (AMC)."
    explanation: >-
      States the autosomal recessive mode of inheritance for the LCCS group as a
      whole.

has_subtypes:
- name: LCCS1
  display_name: LCCS1 (GLE1-related, Finnish type / Herva disease)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 1
    term:
      id: MONDO:0009670
      label: lethal congenital contracture syndrome 1
  geography:
  - Finland
  genes:
  - preferred_term: GLE1
    term:
      id: hgnc:4315
      label: GLE1
  description: >-
    The Finnish-heritage form, caused by biallelic GLE1 variants (classically the
    FinMajor splice allele). It is the most severe subtype: total fetal immobility
    detectable from the first trimester, hydrops, pterygia, and fetal death
    typically before 32 weeks, with autopsy showing loss of anterior horn
    motoneurons and severe ventral spinal cord atrophy.
  evidence:
  - reference: PMID:18204449
    reference_title: Mutations in mRNA export mediator GLE1 result in a fetal motoneuron disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that the defective gene underlying lethal motoneuron syndrome LCCS1 is the mRNA export
      mediator GLE1."
    explanation: Establishes GLE1 as the LCCS1 gene.
- name: LCCS2
  display_name: LCCS2 (ERBB3-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 2
    term:
      id: MONDO:0011868
      label: lethal congenital contracture syndrome 2
  geography:
  - Israel
  genes:
  - preferred_term: ERBB3
    term:
      id: hgnc:3431
      label: ERBB3
  description: >-
    ERBB3-associated disease in an Israeli Bedouin kindred combines neurogenic arthrogryposis, anterior-horn atrophy
    and marked urinary-bladder distension. The founder splice variant predicts a truncated receptor. Impaired PI3K/Akt
    signaling and deficient Schwann-cell support are proposed contributors based partly on Erbb3-null mice; the
    complete human pathway is unresolved.
  evidence:
  - reference: PMID:17701904
    reference_title: "Lethal congenital contractural syndrome type 2 (LCCS2) is caused by a mutation in ERBB3 (Her3),
      a modulator of the phosphatidylinositol-3-kinase/Akt pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that the disease is caused by aberrant splicing of ERBB3, which leads to a predicted truncated
      protein."
    explanation: Establishes ERBB3 as the LCCS2 gene.
- name: LCCS3
  display_name: LCCS3 (PIP5K1C-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 3
    term:
      id: MONDO:0012656
      label: lethal congenital contracture syndrome 3
  geography:
  - Israel
  genes:
  - preferred_term: PIP5K1C
    term:
      id: hgnc:8996
      label: PIP5K1C
  description: >-
    PIP5K1C-associated arthrogryposis resembles the original ERBB3 kindred clinically but lacks its neurogenic bladder
    finding. The original D253N allele markedly reduces recombinant kinase activity. Impaired PIP2-dependent synaptic
    vesicle trafficking is a proposed route to neuronal dysfunction, but no postmortem examinations were performed
    in the original LCCS3 series, so shared anterior-horn pathology cannot be assumed. Additional alleles and populations
    have since been reported.
  evidence:
  - reference: PMID:17701898
    reference_title: "Lethal contractural syndrome type 3 (LCCS3) is caused by a mutation in PIP5K1C, which encodes
      PIPKI gamma of the phophatidylinsitol pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now describe a third LCCS phenotype (LCCS3)--similar to LCCS2 yet without neurogenic bladder."
    explanation: >-
      Defines LCCS3 and its clinical discriminator from LCCS2.
- name: LCCS4
  display_name: LCCS4 (MYBPC1-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 4
    term:
      id: MONDO:0013965
      label: lethal congenital contracture syndrome 4
  genes:
  - preferred_term: MYBPC1
    term:
      id: hgnc:7549
      label: MYBPC1
  description: >-
    Recessive truncation of MYBPC1 abrogates the functional domains of slow-type myosin-binding protein C in the
    original LCCS4 families. A muscle contractile mechanism is plausible from the protein function; human myofibrillar
    histopathology was not established by the quoted genetic report. Other MYBPC1 alleles cause nonlethal distal
    or generalized arthrogryposis.
  evidence:
  - reference: PMID:22610851
    reference_title: Autosomal recessive lethal congenital contractural syndrome type 4 (LCCS4) caused by a
      mutation in MYBPC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now show that a recessive mutation abrogating all functional domains in the same gene leads to
      LCCS."
    explanation: Establishes recessive MYBPC1 loss of function as the LCCS4 mechanism.
- name: LCCS5
  display_name: LCCS5 (DNM2-related, fetal akinesia with cerebral and retinal hemorrhage)
  subtype_term:
    preferred_term: fetal akinesia-cerebral and retinal hemorrhage syndrome
    term:
      id: MONDO:0014149
      label: fetal akinesia-cerebral and retinal hemorrhage syndrome
  genes:
  - preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  description: >-
    Caused by a homozygous DNM2 p.Phe379Val substitution impairing endocytosis.
    Distinguished from the other subtypes by intracranial and retinal
    haemorrhages alongside the akinesia and contractures, consistent with a
    pleiotropic dynamin-2 requirement in both muscle and vascular development.
  evidence:
  - reference: PMID:23092955
    reference_title: Dynamin 2 homozygous mutation in humans with a lethal congenital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first homozygous mutation in the DNM2 protein p.Phe379Val, in three consanguineous patients
      with a lethal congenital syndrome associating akinesia, joint contractures, hypotonia, skeletal abnormalities,
      and brain and retinal hemorrhages."
    explanation: Establishes DNM2 and the distinguishing haemorrhagic phenotype.
- name: LCCS6
  display_name: LCCS6 (ZBTB42-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 6
    term:
      id: MONDO:0014549
      label: lethal congenital contracture syndrome 6
  geography:
  - Saudi Arabia
  genes:
  - preferred_term: ZBTB42
    term:
      id: hgnc:32550
      label: ZBTB42
  description: >-
    Identified by autozygome analysis in a consanguineous Saudi family with
    recurrent stillbirths. ZBTB42 is enriched in skeletal muscle, particularly at
    the neuromuscular junction, and zebrafish knockdown reproduces disorganized
    myofibrils - placing the lesion at the muscle/NMJ end of the motor unit.
  evidence:
  - reference: PMID:25055871
    reference_title: ZBTB42 mutation defines a novel lethal congenital contracture syndrome (LCCS6).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data assign a novel muscular developmental phenotype to ZBTB42 in vertebrates and establish a
      new LCCS6 type caused by ZBTB42 mutation."
    explanation: Establishes ZBTB42 as the LCCS6 gene.
- name: LCCS7
  display_name: LCCS7 (CNTNAP1-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 7
    term:
      id: MONDO:0014569
      label: lethal congenital contracture syndrome 7
  genes:
  - preferred_term: CNTNAP1
    term:
      id: hgnc:8011
      label: CNTNAP1
  description: >-
    Caused by biallelic CNTNAP1 loss of function. CASPR is an essential paranodal
    component, and its loss produces a developmental nodopathy with motor nerve
    conduction velocities below 10 m/s and grossly abnormal nodes of Ranvier on
    sciatic nerve electron microscopy.
  evidence:
  - reference: PMID:24319099
    reference_title: Mutations in CNTNAP1 and ADCY6 are responsible for severe arthrogryposis multiplex
      congenita with axoglial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous frameshift mutations in CNTNAP1 were found in four unrelated families."
    explanation: Establishes biallelic CNTNAP1 loss of function as an LCCS cause.
- name: LCCS8
  display_name: LCCS8 (ADCY6-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 8
    term:
      id: MONDO:0014570
      label: lethal congenital contracture syndrome 8
  genes:
  - preferred_term: ADCY6
    term:
      id: hgnc:237
      label: ADCY6
  description: >-
    Caused by biallelic ADCY6 variants. Adenylate cyclase 6 generates the cAMP
    signal that drives Schwann cell myelination, and affected nerves lack
    peripheral myelin entirely on electron microscopy.
  evidence:
  - reference: PMID:24319099
    reference_title: Mutations in CNTNAP1 and ADCY6 are responsible for severe arthrogryposis multiplex
      congenita with axoglial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation in adenylate cyclase 6 gene (ADCY6) was found in another family characterized
      by a lack of myelin in the peripheral nervous system (PNS) as determined by TEM."
    explanation: Establishes ADCY6 and the amyelinating peripheral nerve phenotype.
- name: LCCS9
  display_name: LCCS9 (ADGRG6/GPR126-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 9
    term:
      id: MONDO:0014670
      label: lethal congenital contracture syndrome 9
  genes:
  - preferred_term: ADGRG6
    term:
      id: hgnc:13841
      label: ADGRG6
  description: >-
    Caused by biallelic ADGRG6 (GPR126) variants. GPR126 is an adhesion GPCR
    required for Schwann cell myelination; affected peripheral nerves lack myelin
    basic protein, and Gpr126-null mice reproduce the lethal arthrogryposis
    phenotype.
  evidence:
  - reference: PMID:26004201
    reference_title: Mutations of GPR126 are responsible for severe arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome or targeted exome sequencing, it was shown that the probands each harbored a different
      homozygous mutation (one missense, one nonsense, and one frameshift mutation) in GPR126."
    explanation: Establishes biallelic GPR126/ADGRG6 variants as a cause of lethal AMC.
  - reference: PMID:26004201
    reference_title: Mutations of GPR126 are responsible for severe arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A previous study reported that Gpr126(-/-) mice have a lethal arthrogryposis phenotype."
    explanation: >-
      The mouse knockout evidence the subtype description relies on for
      recapitulation.
- name: LCCS10
  display_name: LCCS10 (NEK9-related)
  subtype_term:
    preferred_term: NEK9-related lethal skeletal dysplasia
    term:
      id: MONDO:0014870
      label: NEK9-related lethal skeletal dysplasia
  genes:
  - preferred_term: NEK9
    term:
      id: hgnc:18591
      label: NEK9
  description: >-
    NEK9-associated lethal skeletal dysplasia was initially reported in two Irish Traveller families with homozygous
    p.Arg497*, fetal akinesia, shortened long bones, rib and thoracic abnormalities, contractures and pulmonary
    hypoplasia. Patient fibroblasts show cell-cycle and ciliary abnormalities. These support a developmental mechanism
    without establishing how much each skeletal finding reflects primary dysplasia versus impaired movement. Later
    surviving APUG-like neonatal cases are a distinct allelic presentation.
  evidence:
  - reference: PMID:26908619
    reference_title: Recessive NEK9 mutation causes a lethal skeletal dysplasia with evidence of cell cycle
      and ciliary defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report two Irish Traveller families with a previously undescribed lethal skeletal dysplasia
      characterized by fetal akinesia, shortening of all long bones, multiple contractures, rib anomalies,
      thoracic dysplasia, pulmonary hypoplasia and protruding abdomen.
    explanation: The original lethal skeletal-dysplasia families establish the LCCS10 clinical scope; the
      later APUG-like neonates are not used as its denominator.
- name: LCCS11
  display_name: LCCS11 (GLDN-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 11
    term:
      id: MONDO:0014965
      label: lethal congenital contracture syndrome 11
  genes:
  - preferred_term: GLDN
    term:
      id: hgnc:29514
      label: GLDN
  description: >-
    Caused by biallelic GLDN variants. Gliomedin is the Schwann-cell-derived
    ligand that clusters sodium channels at nascent nodes of Ranvier through
    neurofascin-186, so its loss is a second developmental nodopathy alongside
    LCCS7. LCCS11 is the subtype with the best-documented survival beyond the
    neonatal period.
  evidence:
  - reference: PMID:27616481
    reference_title: "Mutations in GLDN, Encoding Gliomedin, a Critical Component of the Nodes of Ranvier, Are Responsible
      for Lethal Arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through linkage analysis, homozygosity mapping, and exome sequencing in four unrelated families affected
      by lethal AMC, we identified biallelic mutations in GLDN in the affected individuals."
    explanation: Establishes biallelic GLDN variants as the LCCS11 cause.
- name: LCCS12
  display_name: LCCS12
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 12
    term:
      id: MONDO:0981031
      label: lethal congenital contracture syndrome 12
  genes:
  - preferred_term: DST
    term:
      id: hgnc:1090
      label: DST
  description: >-
    The lethal congenital-contracture presentation is associated with biallelic DST variants affecting both neuronal
    DST-a and muscle DST-b isoforms. Four patients from two families had severe arthrogryposis and intrauterine
    or early postnatal death. The separate 19-patient DST-b-only congenital-myopathy cohort cannot establish the
    muscle histology, cardiomyopathy frequency or survival of LCCS12.
  evidence:
  - reference: PMID:40497796
    reference_title: "Deciphering DST-associated disorders: biallelic variants affecting DST-b cause a congenital
      myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation in these patients and previously published cases with respective variants
      resulted in the definition of a DST-associated lethal congenital contracture syndrome."
    explanation: >-
      Establishes DST as the gene defining a lethal congenital contracture
      syndrome.
  - reference: PMID:40497796
    reference_title: "Deciphering DST-associated disorders: biallelic variants affecting DST-b cause a congenital
      myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants that also impact DST-a besides DST-b result in a more severe, lethal congenital contracture
      syndrome."
    explanation: >-
      Gives the isoform-dependent severity relationship that separates the lethal
      phenotype from the congenital myopathy.


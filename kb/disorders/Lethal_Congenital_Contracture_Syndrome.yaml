clinical_burden:
  burden_level: HIGH
  rationale: >-
    Most affected pregnancies end in fetal death or termination, and liveborn
    infants usually die of respiratory failure within days to months. Survivors
    require tracheostomy, long-term ventilation, gastrostomy feeding and
    continuing orthopaedic and rehabilitative care.
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report six infants and children from four unrelated families with biallelic GLDN mutations, four of whom survived beyond the neonatal period into infancy, childhood, and late adolescence with intensive care and chronic respiratory and nutritional support."
    explanation: >-
      Documents the intensity of support required by the survivors, and so the
      burden even in the least lethal subtype.

pathophysiology:
- name: Nuclear mRNA Export Failure
  biological_scale: MOLECULAR
  subtypes:
  - LCCS1
  description: >-
    Loss of GLE1-mediated mRNA export from the nucleus, and of the translation
    initiation and termination steps GLE1 regulates. This is the most proximal
    lesion in the entry - the point where the LCCS1 genotype acts, one level
    upstream of the motor neuron loss it produces. Its discoverers proposed that
    mRNA processing is the pathway shared with the LCCS2 and LCCS3 genes, which
    is the strongest claim in the literature for a molecular denominator across
    the anterior horn arm.
  biological_processes:
  - preferred_term: mRNA export from nucleus
    term:
      id: GO:0006406
      label: mRNA export from nucleus
    modifier: DECREASED
  genes:
  - preferred_term: GLE1
    term:
      id: hgnc:4315
      label: GLE1
  evidence:
  - reference: PMID:18204449
    reference_title: Mutations in mRNA export mediator GLE1 result in a fetal motoneuron disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our finding of mutated GLE1 exposes a common pathway connecting the genes implicated in LCCS1, LCCS2 and LCCS3 and elucidates mRNA processing as a critical molecular mechanism in motoneuron development and maturation."
    explanation: >-
      Identifies mRNA processing as the molecular mechanism, and proposes it as
      the pathway shared across the anterior horn subtypes.
  downstream:
  - target: Anterior Horn Motor Neuron Loss
    causal_link_type: DIRECT
    description: >-
      Motor neuron precursors cannot sustain the mRNA export their proliferation
      and maturation require, and die.
    evidence:
    - reference: PMID:22357925
      reference_title: A zebrafish model of lethal congenital contracture syndrome 1 reveals Gle1 function in spinal neural precursor survival and motor axon arborization.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Together, our studies provide the first functional characterization of Gle1 in vertebrate development and reveal its essential role in actively dividing cells."
      explanation: >-
        Establishes the requirement for Gle1 in dividing cells, the population
        whose loss produces the motoneuron deficit.
- name: PI3K-Akt Signaling Loss
  biological_scale: MOLECULAR
  subtypes:
  - LCCS2
  description: >-
    Loss of ERBB3-driven activation of the PI3K/Akt pathway that governs cell
    survival and vesicle trafficking. This is the molecular step whose failure
    removes the Schwann cell precursors that normally accompany motor axons, and
    it is the first reported human phenotype from loss of function in this
    receptor family.
  biological_processes:
  - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: DECREASED
  genes:
  - preferred_term: ERBB3
    term:
      id: hgnc:3431
      label: ERBB3
  evidence:
  - reference: PMID:17701904
    reference_title: "Lethal congenital contractural syndrome type 2 (LCCS2) is caused by a mutation in ERBB3 (Her3), a modulator of the phosphatidylinositol-3-kinase/Akt pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an activator of the phosphatidylinositol-3-kinase/Akt pathway--regulating cell survival and vesicle trafficking"
    explanation: >-
      Names the pathway ERBB3 activates and the cellular functions it governs.
  downstream:
  - target: Schwann Cell Myelination Failure
    causal_link_type: DIRECT
    description: >-
      Without the survival signal, the Schwann cell precursor pool that would
      myelinate motor axons is not generated.
    evidence:
    - reference: PMID:17701904
      reference_title: "Lethal congenital contractural syndrome type 2 (LCCS2) is caused by a mutation in ERBB3 (Her3), a modulator of the phosphatidylinositol-3-kinase/Akt pathway."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "is essential for the generation of precursors of Schwann cells that normally accompany peripheral axons of motor neurons"
      explanation: >-
        States the Schwann cell precursor requirement that this signalling loss
        removes.
- name: Phosphoinositide Synthesis Deficiency
  biological_scale: MOLECULAR
  subtypes:
  - LCCS3
  description: >-
    Loss of PIPKI-gamma kinase activity, so phosphatidylinositol 4-phosphate is
    not converted to PIP2. PIP2 is required for endocytosis of synaptic vesicle
    proteins, which places the LCCS3 lesion in the phosphatidylinositol pathway
    that the LCCS2 gene also feeds.
  molecular_functions:
  - preferred_term: 1-phosphatidylinositol-4-phosphate 5-kinase activity
    term:
      id: GO:0016308
      label: 1-phosphatidylinositol-4-phosphate 5-kinase activity
    modifier: DECREASED
  genes:
  - preferred_term: PIP5K1C
    term:
      id: hgnc:8996
      label: PIP5K1C
  evidence:
  - reference: PMID:17701898
    reference_title: "Lethal contractural syndrome type 3 (LCCS3) is caused by a mutation in PIP5K1C, which encodes PIPKI gamma of the phophatidylinsitol pathway."

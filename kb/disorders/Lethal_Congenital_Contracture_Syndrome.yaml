      evidence_source: HUMAN_CLINICAL
      snippet: "Arthrogryposis is characterized by congenital joint contractures in two or more body areas resulting from reduced or absent fetal movements"
      explanation: >-
        States the movement-to-contracture causal step directly.
  - target: Pulmonary Hypoplasia
    causal_link_type: DIRECT
    description: >-

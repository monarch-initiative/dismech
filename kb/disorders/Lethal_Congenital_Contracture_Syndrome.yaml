name: Lethal Congenital Contracture Syndrome
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
description: >-
  Lethal congenital contracture syndrome (LCCS) is a genetically heterogeneous
  group of autosomal recessive fetal akinesia deformation sequence disorders in
  which developmental failure of the fetal motor unit abolishes fetal movement.
  The numbered forms (LCCS1-LCCS12) place the primary lesion at different levels
  of that motor unit - anterior horn motor neuron survival in LCCS1-LCCS3,
  Schwann cell myelination and node-of-Ranvier assembly in LCCS2 and
  LCCS7-LCCS9 and LCCS11, and the sarcomere and neuromuscular junction in LCCS4-LCCS6 -
  but they converge on the same downstream sequence: absent fetal movement,
  multiple joint contractures, muscle hypoplasia, micrognathia, polyhydramnios,
  pulmonary hypoplasia, and prenatal or early neonatal death. "Lethal" is a
  historical label rather than an invariant outcome: some GLDN-related infants
  survive the neonatal period with intensive respiratory and nutritional
  support.
synonyms:
- LCCS
- Multiple contracture syndrome, Finnish type
- Herva disease
disease_term:
  preferred_term: lethal congenital contracture syndrome
  term:
    id: MONDO:0017436
    label: lethal congenital contracture syndrome
parents:
- Congenital Disorder

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every established LCCS locus is inherited in an autosomal recessive manner,
    with homozygous founder alleles in consanguineous or geographically isolated
    kindreds and compound heterozygosity elsewhere.
  evidence:
  - reference: PMID:25055871
    reference_title: ZBTB42 mutation defines a novel lethal congenital contracture syndrome (LCCS6).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lethal congenital contracture syndrome (LCCS) is a lethal autosomal recessive form of arthrogryposis multiplex congenita (AMC)."
    explanation: >-
      States the autosomal recessive mode of inheritance for the LCCS group as a
      whole.

has_subtypes:
- name: LCCS1
  display_name: LCCS1 (GLE1-related, Finnish type / Herva disease)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 1
    term:
      id: MONDO:0009670
      label: lethal congenital contracture syndrome 1
  geography:
  - Finland
  genes:
  - preferred_term: GLE1
    term:
      id: hgnc:4315
      label: GLE1
  description: >-
    The Finnish-heritage form, caused by biallelic GLE1 variants (classically the
    FinMajor splice allele). It is the most severe subtype: total fetal immobility
    detectable from the first trimester, hydrops, pterygia, and fetal death
    typically before 32 weeks, with autopsy showing loss of anterior horn
    motoneurons and severe ventral spinal cord atrophy.
  evidence:
  - reference: PMID:18204449
    reference_title: Mutations in mRNA export mediator GLE1 result in a fetal motoneuron disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that the defective gene underlying lethal motoneuron syndrome LCCS1 is the mRNA export mediator GLE1."
    explanation: Establishes GLE1 as the LCCS1 gene.
- name: LCCS2
  display_name: LCCS2 (ERBB3-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 2
    term:
      id: MONDO:0011868
      label: lethal congenital contracture syndrome 2
  geography:
  - Israel
  genes:
  - preferred_term: ERBB3
    term:
      id: hgnc:3431
      label: ERBB3
  description: >-
    Described in an inbred Israeli Bedouin kindred. Distinguished from LCCS1 by
    the absence of hydrops, pterygia and fractures, and from LCCS3 by a markedly
    distended urinary bladder. Aberrant ERBB3 splicing removes an activator of
    PI3K/Akt signalling that is required to generate the Schwann cell precursors
    accompanying motor axons.
  evidence:
  - reference: PMID:17701904
    reference_title: "Lethal congenital contractural syndrome type 2 (LCCS2) is caused by a mutation in ERBB3 (Her3), a modulator of the phosphatidylinositol-3-kinase/Akt pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that the disease is caused by aberrant splicing of ERBB3, which leads to a predicted truncated protein."
    explanation: Establishes ERBB3 as the LCCS2 gene.
- name: LCCS3
  display_name: LCCS3 (PIP5K1C-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 3
    term:
      id: MONDO:0012656
      label: lethal congenital contracture syndrome 3
  geography:
  - Israel
  genes:
  - preferred_term: PIP5K1C
    term:
      id: hgnc:8996
      label: PIP5K1C
  description: >-
    Clinically identical to LCCS2 but without bladder enlargement. Caused by
    biallelic PIP5K1C variants that abolish PIPKI-gamma kinase activity, reducing
    synthesis of PIP2, a lipid required for synaptic vesicle protein endocytosis.
    Later reports have extended the allelic spectrum beyond the original Bedouin
    D253N founder variant to truncating alleles in other populations.
  evidence:
  - reference: PMID:17701898
    reference_title: "Lethal contractural syndrome type 3 (LCCS3) is caused by a mutation in PIP5K1C, which encodes PIPKI gamma of the phophatidylinsitol pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now describe a third LCCS phenotype (LCCS3)--similar to LCCS2 yet without neurogenic bladder."
    explanation: >-
      Defines LCCS3 and its clinical discriminator from LCCS2.
- name: LCCS4
  display_name: LCCS4 (MYBPC1-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 4
    term:
      id: MONDO:0013965
      label: lethal congenital contracture syndrome 4
  genes:
  - preferred_term: MYBPC1
    term:
      id: hgnc:7549
      label: MYBPC1
  description: >-
    Caused by a homozygous truncating MYBPC1 variant abolishing all functional
    domains of slow-type myosin binding protein C. The primary lesion is in the
    sarcomere rather than in the motor neuron. Dominant missense variants in the
    same gene cause the far milder distal arthrogryposis, making MYBPC1 an
    allelic-series exemplar within this group.
  evidence:
  - reference: PMID:22610851
    reference_title: Autosomal recessive lethal congenital contractural syndrome type 4 (LCCS4) caused by a mutation in MYBPC1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now show that a recessive mutation abrogating all functional domains in the same gene leads to LCCS."
    explanation: Establishes recessive MYBPC1 loss of function as the LCCS4 mechanism.
- name: LCCS5
  display_name: LCCS5 (DNM2-related, fetal akinesia with cerebral and retinal hemorrhage)
  subtype_term:
    preferred_term: fetal akinesia-cerebral and retinal hemorrhage syndrome
    term:
      id: MONDO:0014149
      label: fetal akinesia-cerebral and retinal hemorrhage syndrome
  genes:
  - preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  description: >-
    Caused by a homozygous DNM2 p.Phe379Val substitution impairing endocytosis.
    Distinguished from the other subtypes by intracranial and retinal
    haemorrhages alongside the akinesia and contractures, consistent with a
    pleiotropic dynamin-2 requirement in both muscle and vascular development.
  evidence:
  - reference: PMID:23092955
    reference_title: Dynamin 2 homozygous mutation in humans with a lethal congenital syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first homozygous mutation in the DNM2 protein p.Phe379Val, in three consanguineous patients with a lethal congenital syndrome associating akinesia, joint contractures, hypotonia, skeletal abnormalities, and brain and retinal hemorrhages."
    explanation: Establishes DNM2 and the distinguishing haemorrhagic phenotype.
- name: LCCS6
  display_name: LCCS6 (ZBTB42-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 6
    term:
      id: MONDO:0014549
      label: lethal congenital contracture syndrome 6
  geography:
  - Saudi Arabia
  genes:
  - preferred_term: ZBTB42
    term:
      id: hgnc:32550
      label: ZBTB42
  description: >-
    Identified by autozygome analysis in a consanguineous Saudi family with
    recurrent stillbirths. ZBTB42 is enriched in skeletal muscle, particularly at
    the neuromuscular junction, and zebrafish knockdown reproduces disorganized
    myofibrils - placing the lesion at the muscle/NMJ end of the motor unit.
  evidence:
  - reference: PMID:25055871
    reference_title: ZBTB42 mutation defines a novel lethal congenital contracture syndrome (LCCS6).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data assign a novel muscular developmental phenotype to ZBTB42 in vertebrates and establish a new LCCS6 type caused by ZBTB42 mutation."
    explanation: Establishes ZBTB42 as the LCCS6 gene.
- name: LCCS7
  display_name: LCCS7 (CNTNAP1-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 7
    term:
      id: MONDO:0014569
      label: lethal congenital contracture syndrome 7
  genes:
  - preferred_term: CNTNAP1
    term:
      id: hgnc:8011
      label: CNTNAP1
  description: >-
    Caused by biallelic CNTNAP1 loss of function. CASPR is an essential paranodal
    component, and its loss produces a developmental nodopathy with motor nerve
    conduction velocities below 10 m/s and grossly abnormal nodes of Ranvier on
    sciatic nerve electron microscopy.
  evidence:
  - reference: PMID:24319099
    reference_title: Mutations in CNTNAP1 and ADCY6 are responsible for severe arthrogryposis multiplex congenita with axoglial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous frameshift mutations in CNTNAP1 were found in four unrelated families."
    explanation: Establishes biallelic CNTNAP1 loss of function as an LCCS cause.
- name: LCCS8
  display_name: LCCS8 (ADCY6-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 8
    term:
      id: MONDO:0014570
      label: lethal congenital contracture syndrome 8
  genes:
  - preferred_term: ADCY6
    term:
      id: hgnc:237
      label: ADCY6
  description: >-
    Caused by biallelic ADCY6 variants. Adenylate cyclase 6 generates the cAMP
    signal that drives Schwann cell myelination, and affected nerves lack
    peripheral myelin entirely on electron microscopy.
  evidence:
  - reference: PMID:24319099
    reference_title: Mutations in CNTNAP1 and ADCY6 are responsible for severe arthrogryposis multiplex congenita with axoglial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation in adenylate cyclase 6 gene (ADCY6) was found in another family characterized by a lack of myelin in the peripheral nervous system (PNS) as determined by TEM."
    explanation: Establishes ADCY6 and the amyelinating peripheral nerve phenotype.
- name: LCCS9
  display_name: LCCS9 (ADGRG6/GPR126-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 9
    term:
      id: MONDO:0014670
      label: lethal congenital contracture syndrome 9
  genes:
  - preferred_term: ADGRG6
    term:
      id: hgnc:13841
      label: ADGRG6
  description: >-
    Caused by biallelic ADGRG6 (GPR126) variants. GPR126 is an adhesion GPCR
    required for Schwann cell myelination; affected peripheral nerves lack myelin
    basic protein, and Gpr126-null mice reproduce the lethal arthrogryposis
    phenotype.
  evidence:
  - reference: PMID:26004201
    reference_title: Mutations of GPR126 are responsible for severe arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome or targeted exome sequencing, it was shown that the probands each harbored a different homozygous mutation (one missense, one nonsense, and one frameshift mutation) in GPR126."
    explanation: Establishes biallelic GPR126/ADGRG6 variants as a cause of lethal AMC.
  - reference: PMID:26004201
    reference_title: Mutations of GPR126 are responsible for severe arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A previous study reported that Gpr126(-/-) mice have a lethal arthrogryposis phenotype."
    explanation: >-
      The mouse knockout evidence the subtype description relies on for
      recapitulation.
- name: LCCS10
  display_name: LCCS10 (NEK9-related)
  subtype_term:
    preferred_term: NEK9-related lethal skeletal dysplasia
    term:
      id: MONDO:0014870
      label: NEK9-related lethal skeletal dysplasia
  genes:
  - preferred_term: NEK9
    term:
      id: hgnc:18591
      label: NEK9
  description: >-
    Caused by biallelic NEK9 variants. NEK9 is a NIMA-family kinase with roles in
    spindle assembly, centrosome separation and ciliogenesis, and the subtype sits
    at the skeletal-dysplasia end of the LCCS spectrum (thoracic dysplasia, short
    ribs). Allelic NEK9 disease also causes the non-lethal arthrogryposis, Perthes
    disease and upward gaze palsy syndrome; the phenotype tracks with variant
    class.
  evidence:
  - reference: PMID:36712877
    reference_title: "Novel variants of NEK9 associated with neonatal arthrogryposis: Two case reports and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in NEK9 (MIM: 609798) have been identified in patients with lethal congenital contracture syndrome 10 (OMIM: 617022) and arthrogryposis, Perthes disease, and upward gaze palsy"
    explanation: Establishes NEK9 as the LCCS10 gene.
  - reference: PMID:36712877
    reference_title: "Novel variants of NEK9 associated with neonatal arthrogryposis: Two case reports and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The findings from this study suggest that different types of mutations in NEK9 lead to different phenotypes."
    explanation: >-
      Records the allele-dependent breadth of the NEK9 phenotype, which is why the
      same gene spans a lethal and a non-lethal disorder.
- name: LCCS11
  display_name: LCCS11 (GLDN-related)
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 11
    term:
      id: MONDO:0014965
      label: lethal congenital contracture syndrome 11
  genes:
  - preferred_term: GLDN
    term:
      id: hgnc:29514
      label: GLDN
  description: >-
    Caused by biallelic GLDN variants. Gliomedin is the Schwann-cell-derived
    ligand that clusters sodium channels at nascent nodes of Ranvier through
    neurofascin-186, so its loss is a second developmental nodopathy alongside
    LCCS7. LCCS11 is the subtype with the best-documented survival beyond the
    neonatal period.
  evidence:
  - reference: PMID:27616481
    reference_title: "Mutations in GLDN, Encoding Gliomedin, a Critical Component of the Nodes of Ranvier, Are Responsible for Lethal Arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through linkage analysis, homozygosity mapping, and exome sequencing in four unrelated families affected by lethal AMC, we identified biallelic mutations in GLDN in the affected individuals."
    explanation: Establishes biallelic GLDN variants as the LCCS11 cause.
- name: LCCS12
  display_name: LCCS12
  subtype_term:
    preferred_term: lethal congenital contracture syndrome 12
    term:
      id: MONDO:0981031
      label: lethal congenital contracture syndrome 12
  genes:
  - preferred_term: DST
    term:
      id: hgnc:1090
      label: DST
  description: >-
    The most recently designated member of the OMIM phenotypic series, caused by
    biallelic DST variants. DST encodes dystonin, a cytoskeletal linker protein;
    variants restricted to the DST-b isoform give a congenital myopathy, while
    variants that also impact DST-a give the more severe lethal congenital
    contracture phenotype. This places LCCS12 on the muscle/cytoskeletal side of
    the series rather than on either neural arm. Note that MONDO:0981031 carries
    no gene edge as of this curation, so the binding here is taken from the
    primary report rather than from MONDO.
  evidence:
  - reference: PMID:40497796
    reference_title: "Deciphering DST-associated disorders: biallelic variants affecting DST-b cause a congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation in these patients and previously published cases with respective variants resulted in the definition of a DST-associated lethal congenital contracture syndrome."
    explanation: >-
      Establishes DST as the gene defining a lethal congenital contracture
      syndrome.
  - reference: PMID:40497796
    reference_title: "Deciphering DST-associated disorders: biallelic variants affecting DST-b cause a congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants that also impact DST-a besides DST-b result in a more severe, lethal congenital contracture syndrome."
    explanation: >-
      Gives the isoform-dependent severity relationship that separates the lethal
      phenotype from the congenital myopathy.

prevalence:
- subtype: LCCS1
  population: Finland
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.96
  notes: >-
    Finnish national ascertainment of all multiple-contracture cases 1987-2002,
    including live births, stillbirths and terminations. The source states the
    rate two ways, as 1 in 25,250 and as 0.40 per 10,000; both normalize to
    about 3.96 per 100,000, which is the figure recorded here.
  evidence:
  - reference: PMID:16892327
    reference_title: Lethal congenital contracture syndrome (LCCS) and other lethal arthrogryposes in Finland--an epidemiological study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCCS is noted as a unique Finnish disorder with a prevalence of 1 in 25,250 (0.40/10,000) births and is a major cause of lethal arthrogryposis in Finland."
    explanation: >-
      Gives the Finnish birth prevalence of LCCS (the Finnish-heritage LCCS1 form)
      directly.
- population: Finland

diagnosis:
- name: Prenatal ultrasound
  description: >-
    Serial expert ultrasound assessing fetal movement, limb position, amniotic
    fluid volume, hydrops, growth and thoracic development. Absent movement at
    every examination from about 12 weeks is the earliest and most specific
    finding, and club foot or fixed joints are the usual first structural clue.
  presence: PRESENT
  evidence:
  - reference: PMID:35806855
    reference_title: "Lethal Congenital Contracture Syndrome 11: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal ultrasound imaging is crucial in its early diagnosis by identifying fetal movement limitations and the presence of club foot or joint contractures"
    explanation: States the role and yield of prenatal ultrasound.
- name: Trio exome or genome sequencing
  description: >-
    Broad sequencing rather than sequential single-gene testing, because the
    subtypes are clinically near-indistinguishable and the gene list is long and
    still growing. Diagnostic yield in arthrogryposis cohorts reaches about 60%
    with whole-exome sequencing.
  presence: PRESENT
  evidence:
  - reference: PMID:35806855
    reference_title: "Lethal Congenital Contracture Syndrome 11: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis rates of arthrogryposis improve up to 60% when whole-exome sequencing (WES) is used"
    explanation: Quantifies the diagnostic yield of exome sequencing.
  - reference: PMID:26578207
    reference_title: Next generation sequencing in a large cohort of patients presenting with neuromuscular disease before or at birth.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A conclusive genetic diagnosis was achieved for 18 of the 38 families."
    explanation: >-
      Cohort-level yield of next-generation sequencing in fetal akinesia and
      arthrogryposis families.
- name: Nerve conduction study
  description: >-
    Motor nerve conduction velocity separates the axoglial subtypes (LCCS7,
    LCCS8, LCCS9, LCCS11), where it falls below 10 m/s, from the anterior horn
    cell and muscle subtypes, where the primary lesion lies elsewhere.
  presence: PRESENT
  evidence:
  - reference: PMID:24319099
    reference_title: Mutations in CNTNAP1 and ADCY6 are responsible for severe arthrogryposis multiplex congenita with axoglial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients showed a marked reduction in motor nerve conduction velocity (<10 m/s)"
    explanation: Gives the discriminating conduction velocity threshold.
- name: Fetal and neonatal autopsy
  description: >-
    Postmortem neuropathology remains the way the anterior horn cell subtypes are
    distinguished from the peripheral nerve and muscle subtypes when sequencing is
    uninformative, and it confirms the prenatal imaging findings.
  presence: PRESENT
  evidence:
  - reference: PMID:35806855
    reference_title: "Lethal Congenital Contracture Syndrome 11: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "postmortem studies confirmed the prenatal findings: distal arthrogryposis, fetal growth restriction, pulmonary hypoplasia, and retrognathia"
    explanation: Shows postmortem confirmation of the prenatal findings.

differential_diagnoses:
- name: Lethal Arthrogryposis with Anterior Horn Cell Disease
  description: >-
    LAAHD (MONDO:0012750) is allelic with LCCS1 - same gene, same fetal akinesia,
    same anterior horn cell disease - and is separated only by severity and by
    survival to the perinatal rather than the fetal period. It is the single most
    important differential for LCCS1, and the proposed discriminator is
    molecular: alleles preserving GLE1 coiled-coil function give LAAHD, alleles
    abolishing it give LCCS1. Cases surviving into childhood have prompted the
    argument that "lethal" should be dropped from the LAAHD name too.
  evidence:
  - reference: PMID:28884921
    reference_title: Survival beyond the perinatal period expands the phenotypes caused by mutations in GLE1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both LCCS and LAAHD are characterized by reduced fetal movements, congenital contractures, and a severe form of motor neuron disease that results in fetal death or death in the perinatal period, respectively."
    explanation: >-
      States the shared phenotype and the timing difference that is the whole
      basis of the distinction.
  - reference: PMID:28884921
    reference_title: Survival beyond the perinatal period expands the phenotypes caused by mutations in GLE1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype of LAAHD is now expanded to include multiple individuals surviving into childhood suggesting that LAAHD is a misnomer and should be re-named Arthrogryposis with Anterior Horn Cell Disease (AAHD)."
    explanation: >-
      Documents the survival that undermines the "lethal" label on the allelic
      disorder as well as on this one.
- name: Arthrogryposis Multiplex Congenita
  description: >-
    The parent clinical phenotype. AMC is the descriptive finding of congenital
    contractures in two or more body regions and covers more than 400 conditions
    and over 220 genes; LCCS is the lethal, prenatal-onset, autosomal recessive
    subset of it. Distinguishing them is a matter of severity, timing and
    molecular diagnosis rather than of contracture pattern.
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMC results from diverse mechanisms, including any condition that decreases or limits fetal movements."
    explanation: >-
      States the breadth of AMC against which LCCS must be positioned.
- name: KIF21A-related fetal akinesia
  description: >-
    Biallelic KIF21A loss of function causes severe fetal akinesia with
    arthrogryposis multiplex and pulmonary hypoplasia. It is clinically within the
    LCCS spectrum but is not currently a numbered LCCS subtype, and it is a
    reminder that the fetal akinesia gene list is still open.
  evidence:
  - reference: PMID:34740919
    reference_title: Bi-allelic loss-of-function variants in KIF21A cause severe fetal akinesia with arthrogryposis multiplex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal akinesia (FA) results in variable clinical presentations and has been associated with more than 166 different disease loci."
    explanation: >-
      Records the breadth of the fetal akinesia locus list that the differential
      must span.
- name: Non-genetic fetal akinesia
  description: >-
    Fetal akinesia can also result from maternal antibody-mediated disease,
    oligohydramnios, uterine constraint, teratogen exposure or congenital
    infection. Normal karyotype and microarray in an affected fetus do not exclude
    LCCS, so these must be excluded clinically rather than cytogenetically.
  evidence:
  - reference: PMID:11810649
    reference_title: "Heterogeneity in fetal akinesia deformation sequence (FADS): autopsy confirmation in three 20-21-week fetuses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The etiology of akinesia was undetermined in Case 3; no extrinsic or intrinsic cause was identified."
    explanation: >-
      Illustrates that fetal akinesia cases can lack any identifiable intrinsic
      cause, which is what the differential is guarding against.

treatments:
- name: Mechanical Ventilation and Chronic Respiratory Support
  therapeutic_modality: DEVICE
  description: >-
    Intubation and mechanical ventilation at birth, progressing where survival is
    achieved to tracheostomy and long-term ventilation with airway clearance. This
    is the intervention that separates the reported LCCS11 and LCCS8 survivors
    from the majority who die in the neonatal period, and it modifies outcome
    without touching the underlying mechanism.
  treatment_term:
    preferred_term: Invasive Mechanical Ventilation
    term:
      id: NCIT:C191573
      label: Invasive Mechanical Ventilation
  target_mechanisms:
  - target: Neonatal Respiratory Failure
    description: >-
      Substitutes for the respiratory effort that the hypoplastic lung and weak
      respiratory musculature cannot generate.
    evidence:
    - reference: PMID:28726266
      reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings confirm the association of GLDN mutations with AMC and extend the LCCS11 phenotype by describing long-term survival with chronic respiratory and nutritional support."
      explanation: >-
        Documents that chronic respiratory support is what converts a nominally
        lethal phenotype into long-term survival.
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four of whom survived beyond the neonatal period into infancy, childhood, and late adolescence with intensive care and chronic respiratory and nutritional support"
    explanation: Reports the survival achieved with sustained respiratory support.
- name: Enteral Nutritional Support
  therapeutic_modality: DEVICE
  description: >-
    Nasogastric or gastrostomy feeding for the dysphagia that follows the same
    akinesia responsible for the polyhydramnios. Required indefinitely in
    survivors. Tagged DEVICE rather than BEHAVIORAL because gastrostomy feeding
    is a procedure delivered through an indwelling tube, not a dietary or
    lifestyle change.
  treatment_term:
    preferred_term: Enteral Tube Feeding
    term:
      id: NCIT:C93322
      label: Enteral Tube Feeding
  target_mechanisms:
  - target: Impaired Swallowing
    description: >-
      Bypasses the persistent swallowing deficit that survives into postnatal
      life.
    evidence:
    - reference: PMID:28726266
      reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "chronic respiratory and nutritional support"
      explanation: >-
        Names nutritional support as part of the survival regimen. Indirect because
        the sentence does not itself trace it to the swallowing deficit.
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "extend the LCCS11 phenotype by describing long-term survival with chronic respiratory and nutritional support"
    explanation: Documents chronic nutritional support in the surviving cohort.
- name: Genetic Counseling and Prenatal Testing
  description: >-
    Because every established locus is autosomal recessive, molecular diagnosis in
    a proband converts a recurrence risk stated as "unknown" into a 25% figure and
    makes targeted prenatal or preimplantation testing possible in subsequent
    pregnancies. In a disease with no disease-modifying therapy this is the
    principal actionable consequence of making the diagnosis.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29959180
    reference_title: Genetics of neuromuscular fetal akinesia in the genomics era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genetic diagnosis has clinical utility as it may affect management and prognosis and informs recurrence risk, facilitating family planning decisions."
    explanation: >-
      States the counselling and reproductive value of reaching a molecular
      diagnosis.
- name: Palliative and Supportive Care
  description: >-
    Multidisciplinary supportive care spanning respiratory support, nutrition,
    mobility and psychological support for the family, with palliative-care
    involvement where the presentation is uniformly severe. In a condition with
    no disease-modifying therapy for any subtype this is not an adjunct to
    treatment - it is the treatment, and the decision to escalate to
    tracheostomy and long-term ventilation or to move to comfort care is the
    substantive clinical choice families face.
  treatment_term:
    preferred_term: Palliative Therapy
    term:
      id: NCIT:C15292
      label: Palliative Therapy
  evidence:
  - reference: PMID:39457470
    reference_title: "Update on Inherited Pediatric Motor Neuron Diseases: Clinical Features and Outcome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "To date, no disease-modifying treatments have been identified for congenital SMA with associated arthrogryposis or fractures."
    explanation: >-
      Establishes the absence of disease-modifying therapy in congenital motor
      neuron disease with arthrogryposis, which is what makes supportive and
      palliative care the whole of management. Indirect because the review states
      this for congenital SMA rather than for LCCS specifically.
  - reference: PMID:39457470
    reference_title: "Update on Inherited Pediatric Motor Neuron Diseases: Clinical Features and Outcome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "These clinics focus on comprehensive supportive care, addressing various aspects of the disease, such as respiratory support, nutrition, mobility aids, and psychological assistance"
    explanation: >-
      Describes the components of multidisciplinary supportive care. Indirect
      because the review states this for ALS clinics rather than for LCCS
      specifically.
- name: Contracture Management and Rehabilitation
  therapeutic_modality: BEHAVIORAL
  description: >-
    Splinting, positioning, physiotherapy and selective orthopaedic surgery in
    survivors. Because the contractures are fixed deformations that formed before
    birth, this manages rather than reverses them, and the anaesthetic and
    respiratory risk of surgery is substantial in a child already ventilator
    dependent.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of the affected infants survived beyond the neonatal period with intensive care, chronic ventilatory and nutritional support, and rehabilitation therapy."
    explanation: Records rehabilitation therapy as part of the survivor regimen.

discussions:
- discussion_id: lccs_lethality_label
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is "lethal" still an accurate label for the LCCS group, and can the subtypes
    be stratified by the survival they actually achieve with modern support?
  attaches_to:
  - pathophysiology#Neonatal Respiratory Failure
  - has_subtypes#LCCS11
  rationale: >-
    The name encodes an outcome that the evidence no longer supports uniformly.
    Four of six GLDN-mutated children in one series survived into infancy,
    childhood and late adolescence. What is missing is any denominator: the surviving cases are reported because
    they survived, so the published series cannot say what fraction of LCCS11
    infants would survive given the same support, nor whether survival is
    driven by residual allele function, by the level of the motor-unit lesion, or
    simply by the intensity of care offered. Until that is separated out,
    counselling a family from the subtype label alone is not defensible.
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings expand the genotypic and phenotypic spectrum of LCCS11 and demonstrate that the condition may not necessarily be lethal in the neonatal period."
    explanation: >-
      The primary source stating that the lethality implied by the name is not
      invariant.
- discussion_id: lccs12_gene_unassigned
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does DST-b loss reach the shared fetal-akinesia node through the same
    cytoskeletal/sarcomeric route as the other muscle-side subtypes, and should
    MONDO:0981031 carry a DST gene edge?
  attaches_to:
  - has_subtypes#LCCS12
  - pathophysiology#Myofibril Assembly Failure
  rationale: >-
    Two separable questions. The first is an ontology gap rather than a
    biological one: MONDO:0981031 carries a DOID and an OMIM cross-reference but
    no `RO:0004003` gene edge, even though OMIM and MedGen assign DST, so the
    binding in this entry comes from the primary report and MONDO should be
    asked to add the edge. The second is genuinely open: dystonin is a
    cytoskeletal linker, and whether DST-b loss produces akinesia through the
    same contractile-apparatus failure as MYBPC1 and ZBTB42 or through a distinct
    cytoskeletal route has not been established. Until it is, LCCS12 is recorded
    as a subtype with its gene but is not placed on a trigger arm.
  evidence:
  - reference: PMID:40497796
    reference_title: "Deciphering DST-associated disorders: biallelic variants affecting DST-b cause a congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants that also impact DST-a besides DST-b result in a more severe, lethal congenital contracture syndrome."
    explanation: >-
      Establishes the DST assignment while leaving the route from isoform loss to
      fetal akinesia unstated, which is what this gap records.
- discussion_id: lccs10_offspine_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does LCCS10 (NEK9) reach the contractures through the shared fetal-akinesia
    node at all, or through a primary skeletal route that bypasses it?
  attaches_to:
  - has_subtypes#LCCS10
  - pathophysiology#Absent Fetal Movement
  rationale: >-
    LCCS10 is the one numbered subtype whose arm does not join the shared
    fetal-akinesia node, and that is deliberate rather than an oversight. It has
    a molecular trigger node (`Mitotic and Ciliary Regulatory Failure`), but that
    node is tagged `mechanism_confidence: HYPOTHETICAL` and its only edge is an
    `INDIRECT_UNKNOWN_INTERMEDIATES` link straight to contracture formation,
    bypassing the spine. The other eleven subtypes have a lesion somewhere in the
    motor unit - anterior horn cell, axoglial junction, sarcomere, or endocytic
    machinery - and reach the contractures by way of absent fetal movement. NEK9 is a mitotic and ciliary regulator, MONDO files
    the subtype as a skeletal dysplasia with thoracic dysplasia and short ribs,
    and the reported pulmonary hypoplasia is at least as attributable to thoracic
    constraint as to absent fetal breathing. Whether the arthrogryposis in NEK9
    disease is akinesia-driven like the rest of the series or a primary skeletal
    deformation is unresolved, and asserting a motor-unit node for it would
    manufacture a mechanism the evidence does not carry. Resolving this decides
    whether the entry's spine is genuinely shared across all twelve subtypes.
  evidence:
  - reference: PMID:36712877
    reference_title: "Novel variants of NEK9 associated with neonatal arthrogryposis: Two case reports and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The NEK genes encode serine/threonine kinases, which play important roles in the regulation of the cell cycle and are involved in several cellular activities, such as centrosome separation, spindle assembly, chromatin condensation, nuclear envelope breakdown, spindle assembly checkpoint signaling, cytokinesis, cilia formation, and DNA damage response."
    explanation: >-
      Describes a cell-cycle and ciliary function set with no motor-unit
      component, which is why the NEK9 route to the shared node cannot be
      asserted from it.
- discussion_id: lccs_series_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Where does the LCCS numbered series end and the wider fetal akinesia gene
    list begin?
  attaches_to:
  - differential_diagnoses#KIF21A-related fetal akinesia
  rationale: >-
    Fetal akinesia has been associated with more than 166 loci, and genes such as
    KIF21A produce a phenotype indistinguishable from a numbered LCCS subtype
    without receiving an LCCS number. The numbering therefore reflects the order
    of historical discovery rather than a mechanistic boundary, which matters
    directly for this entry: a curator deciding whether a newly reported fetal
    akinesia gene belongs in `has_subtypes` or in `differential_diagnoses` has no
    principled criterion to apply, and the answer currently depends on whether
    OMIM happened to assign a series number.
  evidence:
  - reference: PMID:34740919
    reference_title: Bi-allelic loss-of-function variants in KIF21A cause severe fetal akinesia with arthrogryposis multiplex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal akinesia (FA) results in variable clinical presentations and has been associated with more than 166 different disease loci."
    explanation: >-
      Quantifies the locus list against which the twelve-member numbered series
      must be positioned.

notes: >-
  Concept decision (issue #9606). MONDO:0017436 is an OMIM phenotypic series
  (OMIMPS:253310) with twelve numbered members, which is the shape that usually
  argues for a `kb/groupings/` entry. It is curated here as a Disease with
  `has_subtypes` instead, because the subtypes are not a union of distinct
  diseases: each places its primary lesion at a different level of the same fetal
  motor unit, and ten of the twelve converge on one node - absent fetal movement
  - below which every finding is deformation secondary to the missing movement
  rather than a separate consequence of the gene. (LCCS10 and LCCS12 are the two
  that do not, for reasons recorded in their knowledge gaps; that they are the
  exceptions rather than the rule is what keeps the decision a disease rather
  than a grouping.) That is the
  gene-specific-trigger-substituted-per-subtype pattern the pathograph is built
  to express, so the shared spine sits at the root and the trigger arms carry
  `subtypes:` tags. A grouping would have had to duplicate that spine twelve
  times or omit it entirely.

  The pathograph runs from a molecular layer (mRNA export, PI3K-Akt signalling,
  phosphoinositide synthesis, cAMP synthesis, and NEK9's mitotic/ciliary
  functions) into cellular and tissue nodes, so the graph starts where the
  genetics actually acts rather than one level downstream of it.

  Three arms feed the convergence node. LCCS1-LCCS3 are anterior horn cell
  disease (GLE1, ERBB3, PIP5K1C - Nousiainen et al. proposed a shared mRNA
  processing pathway linking all three). LCCS2, LCCS7-LCCS9 and LCCS11 are
  axoglial: Schwann cell myelination failure in ERBB3, ADCY6 and ADGRG6 disease,
  and node-of-Ranvier assembly failure in CNTNAP1 and GLDN disease, which their
  discoverers group explicitly as inherited nodopathies. The muscle side is two
  nodes rather than one: MYBPC1 and ZBTB42 (LCCS4, LCCS6) fail myofibril
  assembly, while DNM2 (LCCS5) fails endocytic trafficking, which is also what
  gives LCCS5 the haemorrhagic findings the others lack. ERBB3 appears on two
  arms because the reported mechanism spans both anterior horn atrophy and
  Schwann cell precursor loss.

  Two subtypes are deliberately not on an arm. LCCS10 (NEK9) has a molecular
  node but only an `INDIRECT_UNKNOWN_INTERMEDIATES` edge that bypasses the
  akinesia spine, because NEK9's reported functions are mitotic and ciliary and
  MONDO files the subtype as a skeletal dysplasia. LCCS12 (DST) carries its gene
  but no node, because whether DST-b loss reaches akinesia through the
  contractile-apparatus route is unestablished. Both are recorded as knowledge
  gaps rather than resolved by assertion.

  Relationship to existing entries. `Arthrogryposis_Multiplex_Congenita` is the
  parent clinical phenotype and is deliberately curated there as an
  etiologically heterogeneous descriptive syndrome that does not assert a
  universal reduced-fetal-movement mechanism. This entry is the narrower,
  Mendelian, prenatal-lethal subset where that mechanism is established, so the
  two are complementary rather than overlapping. `CHRNA1-associated_Fetal_Hypo-akinesia_Disorder_of_Prenatal_Onset`
  is a separate fetal akinesia entity with a neuromuscular junction lesion and no
  LCCS series number.

  What is deliberately absent. No `clinical_trials` - the falcon report's
  ClinicalTrials.gov search found no interventional LCCS trial, and there is no
  approved disease-modifying pharmacotherapy, gene therapy or RNA therapy for any
  subtype. No `datasets` - no LCCS-specific omics resource was identified, and
  fabricating an accession from a causal-gene search is exactly the Named Entity
  Confusion the dataset SOP warns about. No `animal_models` section despite the
  zebrafish work on GLE1, ZBTB42 and ADCY6 being cited as evidence: those results
  are used to support mechanism nodes, and building out `modeled_mechanisms`
  links with fidelity and readout detail is a worthwhile follow-up rather than
  something to assert thinly here.

  Nomenclature. LCCS5 is filed in MONDO under `fetal akinesia-cerebral and
  retinal hemorrhage syndrome` (MONDO:0014149) rather than a numbered label, and
  LCCS10 under `NEK9-related lethal skeletal dysplasia` (MONDO:0014870); the
  `name` fields keep the LCCS numbering that the literature uses, with the MONDO
  label in `subtype_term`. LCCS9's gene is reported in the primary literature
  under its former symbol GPR126. MONDO:0981031 (LCCS12) carries no
  `RO:0004003` gene edge as of this curation even though OMIM and MedGen assign
  DST, so that binding is taken from the primary report and the discrepancy is
  recorded as an upstream gap to report.


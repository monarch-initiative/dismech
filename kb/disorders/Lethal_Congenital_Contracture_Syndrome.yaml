    reference_title: Lethal congenital contracture syndrome (LCCS) and other lethal arthrogryposes in Finland--an epidemiological study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-nine cases had lethal congenital contracture syndrome (LCCS) clinically characterized by total immobility of the fetus at all ultrasound examinations (12 weeks or later)"
    explanation: >-

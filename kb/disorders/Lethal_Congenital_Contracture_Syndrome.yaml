    reference_title: ZBTB42 mutation defines a novel lethal congenital contracture syndrome (LCCS6).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCCS is genetically heterogeneous with mutations in five genes identified to date, all with a role in the innervation or contractile apparatus of skeletal muscles."
    explanation: >-
      States the shared mechanistic denominator - innervation or contractile
      apparatus - that makes this a single convergence node across the subtypes.
  downstream:
  - target: Joint Contracture Formation
    causal_link_type: DIRECT
    description: >-

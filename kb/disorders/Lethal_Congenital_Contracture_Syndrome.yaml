- name: Impaired Fetal Swallowing
  biological_scale: ORGANISM
  description: >-
    Loss of the fetal swallowing that normally clears amniotic fluid, producing
    polyhydramnios. In liveborn infants the same deficit persists as dysphagia
    requiring nasogastric or gastrostomy feeding.

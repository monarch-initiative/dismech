diagnosis:
- name: Prenatal ultrasound
  description: >-
    Ultrasound can detect impaired movement, fixed joints, abnormal fluid volume, growth restriction and associated
    anomalies. Classic Finnish LCCS was recognizable from 12 weeks in the cited series, but GLDN cases were often
    detected much later; no universal timing or specificity is established.
  presence: PRESENT
  evidence:
  - reference: PMID:35806855
    reference_title: "Lethal Congenital Contracture Syndrome 11: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Prenatal ultrasound imaging is crucial in its early diagnosis by identifying fetal movement limitations
      and the presence of club foot or joint contractures"
    explanation: States the role and yield of prenatal ultrasound.
  diagnosis_term:
    preferred_term: Prenatal diagnostic ultrasound
    term:
      id: NCIT:C19337
      label: Diagnostic Ultrasound
- name: Trio exome or genome sequencing
  description: >-
    Broad molecular testing is useful for genetically heterogeneous fetal akinesia. The cited sequencing cohort
    solved 18 of 38 families with mixed fetal akinesia, arthrogryposis and congenital myopathy; this is not a LCCS-specific
    diagnostic sensitivity, and the cited evidence does not compare trio genome with exome sequencing.
  presence: PRESENT
  evidence:
  - reference: PMID:26578207
    reference_title: Next generation sequencing in a large cohort of patients presenting with neuromuscular
      disease before or at birth.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A conclusive genetic diagnosis was achieved for 18 of the 38 families."
    explanation: >-
      The 18/38 yield is for a mixed neuromuscular cohort, not a denominator consisting only of LCCS.
  diagnosis_term:
    preferred_term: Exome or genome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Nerve conduction study
  description: >-
    Electrophysiology can characterize peripheral neuropathy in surviving infants. Velocities below 10 m/s were
    reported in the original CNTNAP1 families; they do not define all axoglial LCCS, and GLDN studies may normalize
    over time.
  presence: PRESENT
  evidence:
  - reference: PMID:24319099
    reference_title: Mutations in CNTNAP1 and ADCY6 are responsible for severe arthrogryposis multiplex
      congenita with axoglial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients showed a marked reduction in motor nerve conduction velocity (<10 m/s)"
    explanation: The threshold is an observation in the original CNTNAP1 families, not a validated diagnostic
      discriminator across all LCCS subtypes.
  diagnosis_term:
    preferred_term: Motor nerve conduction studies
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
- name: Fetal and neonatal autopsy
  description: >-
    Postmortem examination can document lung, muscle, spinal cord and peripheral nerve pathology and confirm prenatal
    findings. Acceptance and tissue availability vary; absent autopsy data must not be replaced by neuropathology
    inferred from clinical similarity.
  presence: PRESENT
  evidence:
  - reference: PMID:35806855
    reference_title: "Lethal Congenital Contracture Syndrome 11: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "postmortem studies confirmed the prenatal findings: distal arthrogryposis, fetal growth restriction,
      pulmonary hypoplasia, and retrognathia"
    explanation: Shows postmortem confirmation of the prenatal findings.

  diagnosis_term:
    preferred_term: Fetal or neonatal autopsy
    term:
      id: NCIT:C25153
      label: Autopsy
- name: Fetal and postnatal magnetic resonance imaging
  description: MRI can characterize central nervous system involvement, but findings depend on subtype
    and age. A GLDN-affected fetus had normal brain and spinal cord MRI at 32 weeks, whereas serial brain
    MRI in two surviving CNTNAP1-associated children documented hypomyelination and progressive atrophy.
    A normal fetal scan does not exclude LCCS, and these reports do not establish a universal imaging
    schedule.
  presence: PRESENT
  diagnosis_term:
    preferred_term: Fetal and postnatal MRI
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by
      novel mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fetal MRI performed at 32 weeks showed normal brain and spinal cord images.
    explanation: This was the affected female infant in Family 4, whose prenatal ultrasound showed arthrogryposis
      and pulmonary hypoplasia; the normal central scan did not exclude GLDN-associated disease.
  - reference: PMID:29882456
    reference_title: Absence of Axoglial Paranodal Junctions in a Child With CNTNAP1 Mutations, Hypomyelination,
      and Arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Serial brain magnetic resonance images revealed hypomyelination, progressive atrophy, and
      reduced diffusion in the globus pallidus in both patients.
    explanation: The two CNTNAP1-associated children had serial imaging abnormalities. This supports characterization
      of central involvement in that subtype, not a mandatory MRI pattern across all LCCS.
- name: Electromyography
  description: EMG can help characterize a neurogenic component when interpreted with nerve conduction
    studies. Reduced motor unit recruitment accompanied slowed conduction in CNTNAP1-associated child
    LD_0158.0 at three weeks, whereas EMG was normal in the GLDN Family 3 survivor. These observations
    do not establish sensitivity or make a normal EMG exclusionary.
  presence: PRESENT
  diagnosis_term:
    preferred_term: Electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:29882456
    reference_title: Absence of Axoglial Paranodal Junctions in a Child With CNTNAP1 Mutations, Hypomyelination,
      and Arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nerve conduction studies and electromyography (EMG) at 3 weeks of age showed prolongation
      of distal latencies and slow nerve conduction velocity (11.1 m/s at distal median) with decreased
      motor unit recruitment suggestive of a neurogenic disorder with features consistent with a demyelinating
      peripheral neuropathy.
    explanation: The combined electrophysiological assessment in LD_0158.0 distinguished a neurogenic
      peripheral process; conduction velocity belongs to NCS, whereas reduced recruitment is the EMG contribution.
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by
      novel mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electromyography did not show any pathological finding.
    explanation: EMG was normal in the GLDN Family 3 survivor despite clinical disease; this is a patient-specific
      limitation, not evidence against the diagnostic procedure.
- name: Muscle biopsy
  description: Muscle histology may characterize the neuromuscular phenotype but can be normal or nonspecific.
    The GLDN Family 3 survivor had a normal muscle biopsy. In CNTNAP1-associated child LD_0158, quadriceps
    biopsy changed from mild scattered atrophy at one month to severe type I fiber atrophy and type II
    predominance at 3.5 years, mimicking congenital myopathy. A muscle pattern alone does not establish
    a primary myopathic LCCS mechanism.
  presence: PRESENT
  diagnosis_term:
    preferred_term: Muscle Biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by
      novel mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Muscle biopsy and MRI of the brain and spinal cord were normal.
    explanation: The muscle biopsy was normal in the GLDN Family 3 survivor; the separately normal MRI
      is not a histological result.
  - reference: PMID:29882456
    reference_title: Absence of Axoglial Paranodal Junctions in a Child With CNTNAP1 Mutations, Hypomyelination,
      and Arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A right quadriceps biopsy at 1 month of age showed mild atrophy of scattered muscle fibers
      without evidence of inflammation, myonecrosis, regeneration, or structural abnormalities (Figure
      2). The fiber type distribution appeared normal (Figure 2A). A second muscle biopsy from the left
      quadriceps at 3.5 years demonstrated abnormal variation in fiber size with a marked type II fiber
      predominance and severe atrophy of type I fibers mimicking congenital myopathic disease (Figures
      2B, 2C, and 2D).
    explanation: Serial biopsies in LD_0158 show age-dependent histological change in CNTNAP1-associated
      neuropathy. The later myopathy-like pattern must be interpreted alongside the peripheral nerve findings.
- name: Peripheral nerve biopsy
  description: Sural nerve histology and ultrastructure characterized progressive peripheral neuropathy
    in CNTNAP1-associated child LD_0158. The initial biopsy at one month showed mildly reduced myelinated
    axons, while repeat biopsy at 3.5 years showed severe demyelination and predominant axonal loss. This
    documents a selected patient investigation, not a routine biopsy recommendation or a finding established
    in every subtype.
  presence: PRESENT
  diagnosis_term:
    preferred_term: Peripheral nerve biopsy
    term:
      id: NCIT:C217131
      label: Nervous System Biopsy Procedure
  evidence:
  - reference: PMID:29882456
    reference_title: Absence of Axoglial Paranodal Junctions in a Child With CNTNAP1 Mutations, Hypomyelination,
      and Arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: His initial sural nerve biopsy (right sural) at 1 month of age showed a mildly reduced number
      of myelinated axons (Figure 3A).
    explanation: This initial peripheral nerve biopsy belongs to LD_0158; it is distinct from his muscle
      biopsy and from the normal muscle biopsy in a GLDN survivor.
  - reference: PMID:29882456
    reference_title: Absence of Axoglial Paranodal Junctions in a Child With CNTNAP1 Mutations, Hypomyelination,
      and Arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A second sural nerve biopsy (left sural) at 3.5 years of age showed severe demyelination
      and axonal pathology. The predominant pathology was axonal loss (Figure 3B).
    explanation: The repeat nerve biopsy documents progression in the same CNTNAP1-associated child, without
      supplying an umbrella diagnostic threshold.
- name: Renal and bladder ultrasound
  description: Ultrasound documented urinary tract involvement in two ERBB3-associated siblings. The first
    had a distended bladder, bilateral distal ureteral dilatation and left renal calyceal dilation; the
    second had normal kidneys with a distended, mildly thick-walled bladder and required catheter drainage.
    Their megacystis was interpreted as neurogenic rather than mechanical obstruction; a keyhole appearance
    alone was not sufficient to establish obstruction.
  presence: PRESENT
  diagnosis_term:
    preferred_term: Renal and bladder ultrasound
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:40321344
    reference_title: Prenatal diagnosis of fetal neurogenic megacystis associated with lethal congenital
      contractural syndrome 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Renal ultrasound revealed an overly distended bladder, bilateral distal ureteral dilatation,
      and left renal calyceal dilation consistent with urinary tract dilation classification P3.
    explanation: This was the first affected sibling. Her ureteral and calyceal dilatation must not be
      assigned to the second sibling, whose kidneys appeared normal.
  - reference: PMID:40321344
    reference_title: Prenatal diagnosis of fetal neurogenic megacystis associated with lethal congenital
      contractural syndrome 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Renal ultrasound showed normal kidneys with a distended bladder with mild wall thickening.
      She required an indwelling Foley catheter for adequate bladder emptying.
    explanation: The second affected sibling had normal-appearing kidneys despite bladder dysfunction
      requiring drainage. The paper interprets LCCS2 megacystis as neurogenic, despite its obstructive-looking
      prenatal appearance.
  - reference: PMID:40321344
    reference_title: Prenatal diagnosis of fetal neurogenic megacystis associated with lethal congenital
      contractural syndrome 2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In LCCS2, megacystis is not due to obstruction, despite its sonographic appearance, but rather
      to neurogenic causes.
    explanation: The authors interpret the LCCS2 bladder phenotype as neurogenic despite an obstructive-looking
      ultrasound appearance. This interpretive statement distinguishes the sonographic finding from a demonstrated
      mechanical obstruction; it does not identify the responsible neural pathway.
differential_diagnoses:
- name: Lethal Arthrogryposis with Anterior Horn Cell Disease
  description: >-
    GLE1-associated AAHD shares fetal akinesia, contractures and motor-neuron disease with classic LCCS1 but includes
    survival into childhood. The proposed coiled-coil-domain relationship is a hypothesis, not a definitive prognostic
    test for an individual allele.
  evidence:
  - reference: PMID:28884921
    reference_title: Survival beyond the perinatal period expands the phenotypes caused by mutations in GLE1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both LCCS and LAAHD are characterized by reduced fetal movements, congenital contractures, and a severe
      form of motor neuron disease that results in fetal death or death in the perinatal period, respectively."
    explanation: >-
      States the shared phenotype and the timing difference that is the whole
      basis of the distinction.
  - reference: PMID:28884921
    reference_title: Survival beyond the perinatal period expands the phenotypes caused by mutations in GLE1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype of LAAHD is now expanded to include multiple individuals surviving into childhood suggesting
      that LAAHD is a misnomer and should be re-named Arthrogryposis with Anterior Horn Cell Disease (AAHD)."
    explanation: >-
      Documents the survival that undermines the "lethal" label on the allelic
      disorder as well as on this one.
- name: Arthrogryposis Multiplex Congenita
  description: >-
    AMC is the broader descriptive phenotype of congenital contractures in multiple body regions and has diverse
    genetic and non-genetic causes. LCCS is a historically numbered recessive subset; lethality alone does not delimit
    it.
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AMC results from diverse mechanisms, including any condition that decreases or limits fetal movements."
    explanation: >-
      States the breadth of AMC against which LCCS must be positioned.
- name: KIF21A-related fetal akinesia
  description: >-
    Biallelic KIF21A loss-of-function variants cause severe fetal akinesia with arthrogryposis. This is a molecular
    differential for the historically numbered LCCS syndromes, distinct from dominant KIF21A-associated congenital
    fibrosis of extraocular muscles.
  evidence:
  - reference: PMID:34740919
    reference_title: Bi-allelic loss-of-function variants in KIF21A cause severe fetal akinesia with
      arthrogryposis multiplex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Together, these molecular and phenotypical data are in line with bi-allelic KIF21A PTVs being
      implicated in the pathogenesis of a severe form of autosomal recessive FA characterised by
      arthrogryposis multiplex, pulmonary hypoplasia and variable facial dysmorphisms.
    explanation: The human genotype and fetal phenotype data support this molecular differential, rather than
      only a generic fetal-akinesia gene count.
- name: Non-genetic fetal akinesia
  description: >-
    Extrinsic constraint, maternal disease or exposures can reduce fetal movement. The cited ungenotyped autopsy
    series illustrates etiological heterogeneity and incomplete ascertainment; a negative genetic test does not
    itself prove a non-genetic cause.
  evidence:
  - reference: PMID:11810649
    reference_title: "Heterogeneity in fetal akinesia deformation sequence (FADS): autopsy confirmation in three
      20-21-week fetuses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The etiology of akinesia was undetermined in Case 3; no extrinsic or intrinsic cause was identified."
    explanation: >-
      An unresolved cause in an ungenotyped fetus demonstrates diagnostic uncertainty, not positive evidence for
      a particular extrinsic cause.

treatments:
- name: Mechanical Ventilation and Chronic Respiratory Support
  therapeutic_modality: DEVICE
  description: >-
    Invasive ventilation and, in some survivors, tracheostomy with chronic respiratory support were
    reported in GLDN-associated disease. Some children later weaned from support. The observational
    series does not isolate the survival benefit from genotype, disease severity or other care.
    Mechanical ventilation substitutes for the respiratory effort that the hypoplastic lung and weak
    respiratory musculature cannot generate.
  treatment_term:
    preferred_term: Invasive Mechanical Ventilation
    term:
      id: NCIT:C191573
      label: Invasive Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Neonatal Respiratory Failure
    term:
      id: HP:0002878
      label: Respiratory failure
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four of whom survived beyond the neonatal period into infancy, childhood, and late adolescence with
      intensive care and chronic respiratory and nutritional support"
    explanation: Reports the survival achieved with sustained respiratory support.
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by
      novel mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings confirm the association of GLDN mutations with AMC and extend the LCCS11 phenotype
      by describing long-term survival with chronic respiratory and nutritional support.
    explanation: Reports long-term survival with respiratory and nutritional support; this is an observational
      care association, not proof that support alone determines survival.
- name: Enteral Nutritional Support
  therapeutic_modality: DEVICE
  description: >-
    Gastrostomy feeding supported a GLDN survivor with swallowing insufficiency aggravated by focal bulbar paresis.
    Oral feeding later increased, so indefinite tube dependence is not obligatory.
  treatment_term:
    preferred_term: Enteral Tube Feeding
    term:
      id: NCIT:C93322
      label: Enteral Tube Feeding
  target_mechanisms:
  - target: Focal Bulbar Paresis
    description: Tube feeding bypasses unsafe or insufficient oral intake caused partly by bulbar paresis; it
      does not reverse the paresis.
    evidence:
    - reference: PMID:28726266
      reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel
        mutations in the gliomedin gene (GLDN)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Insufficient swallowing aggravated by paresis of both the right vocal cord and right side of the
        soft palate prompted gastrostomy tube placement at 4 months of age."
      explanation: >-
        Documents insufficient swallowing and the gastrostomy it required in a
        surviving LCCS11 child.
    treatment_effect: BYPASSES
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Insufficient swallowing aggravated by paresis of both the right vocal cord and right side of the soft
      palate prompted gastrostomy tube placement at 4 months of age."
    explanation: >-
      Documents insufficient swallowing and the gastrostomy it required in a
      surviving LCCS11 child.
- name: Genetic Counseling and Prenatal Testing
  description: >-
    Molecular diagnosis can inform recurrence counseling and reproductive testing in these recessive disorders.
    The usual recurrence estimate requires confirmed parental carrier status and the relevant family genotype.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29959180
    reference_title: Genetics of neuromuscular fetal akinesia in the genomics era.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A genetic diagnosis has clinical utility as it may affect management and prognosis and informs recurrence
      risk, facilitating family planning decisions."
    explanation: >-
      States the counselling and reproductive value of reaching a molecular
      diagnosis.
- name: Contracture Management and Rehabilitation
  therapeutic_modality: BEHAVIORAL
  description: >-
    Physiotherapy and splinting improved contractures, range of motion and lower-limb tone in one GLDN survivor.
    Other survivors underwent selected orthopedic procedures. These observed courses do not establish a uniform
    protocol or irreversible contracture trajectory.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Physiotherapy and non-surgical treatment including splinting led to an improvement of his
      contractures, increased range of motion, and improved muscular tone in his lower limbs.
    explanation: The Family 3 survivor improved with physiotherapy and splinting; this directly corrects the
      prior claim that contractures cannot improve.
- name: Perinatal Palliative Care and Shared Goals of Care
  description: Multidisciplinary perinatal palliative care supported a family with prenatal ERBB3-associated
    LCCS2. The family initially requested supported comfort care, then accepted nasal oxygen, nasogastric
    feeding, thermoregulation and bladder catheterization when the infant continued to breathe. Shared
    goals can change with the observed course; palliative care does not imply comfort-only care or an
    identical prognosis across LCCS subtypes.
  treatment_term:
    preferred_term: Perinatal palliative care
    term:
      id: NCIT:C15292
      label: Palliative Therapy
  evidence:
  - reference: PMID:40321344
    reference_title: Prenatal diagnosis of fetal neurogenic megacystis associated with lethal congenital
      contractural syndrome 2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Perinatal palliative care is principled to support families through this uncertainty using
      shared decision-making to establish goals of care.
    explanation: This is the authors’ care principle for uncertain LCCS2 outcomes, not a measured treatment
      effect or a recommendation to withhold intensive care.
  - reference: PMID:40321344
    reference_title: Prenatal diagnosis of fetal neurogenic megacystis associated with lethal congenital
      contractural syndrome 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She had consultations with pediatric urology and a Perinatal Palliative Care Team including
      representatives from neonatology, pediatrics, Chaplaincy, among others. Given the family’s previous
      experience and the counseled expectations for infants born with LCCS2, patient requested a supported
      comfort care model of care after birth.
    explanation: The mother carrying the second affected sibling received multidisciplinary consultation
      and initially chose supported comfort care. This is an observed family decision, separate from the
      authors’ general principle.
  - reference: PMID:40321344
    reference_title: Prenatal diagnosis of fetal neurogenic megacystis associated with lethal congenital
      contractural syndrome 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite expectations to allow a natural death after birth, she continued to have respiratory
      drive and live. The family’s goals of care pivoted to accept neonatal intensive level care with
      perceived non-aggressive interventions such as nasal cannula oxygen support, enteral feedings via
      nasogastric tube, thermoregulation support, and Foley catheter.
    explanation: The second sibling’s continued respiratory drive changed the family’s goals. These actual
      noninvasive respiratory, nutritional and supportive interventions demonstrate that the care plan
      was revisable; they do not prove efficacy or a uniform survival trajectory.
- name: Tracheostomy
  description: Tracheostomy provided access for respiratory support in selected GLDN-associated survivors
    with persistent respiratory insufficiency. The Family 3 child underwent the procedure at six weeks
    for respiratory insufficiency, ineffective cough and swallowing difficulty, then weaned from ventilation
    at nine months and was decannulated at 19 months. Other children remained dependent; the procedure
    does not itself reverse pulmonary hypoplasia or neuromuscular weakness.
  treatment_term:
    preferred_term: Tracheostomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  evidence:
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by
      novel mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Due to persistent respiratory insufficiency, inability to cough, and insufficient swallowing,
      he underwent tracheostomy at 6 weeks of age. His respiratory function gradually improved, and he
      was successfully weaned from ventilatory support at nine months of age and subsequently decannulated
      at 19 months of age.
    explanation: This is the Family 3 survivor’s indication and subsequent course, not evidence that tracheostomy
      caused recovery or that decannulation is expected in every child.
- name: Selected Orthopedic Surgery
  description: A GLDN-associated Family 2 survivor underwent operations for bilateral hip luxation and
    clubfeet at two years and scoliosis instrumentation at nine years. These procedures addressed selected
    structural problems alongside respiratory, nutritional and rehabilitation care; the case does not
    isolate a surgical benefit or establish a standard operative plan for LCCS.
  treatment_term:
    preferred_term: Selected orthopedic surgery
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by
      novel mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He underwent surgical treatment for bilateral hip luxation and clubfeet (age 2 years) and
      scoliosis with Harrington rod insertion (age 9 years).
    explanation: The Family 2 survivor had these specific operations at distinct ages. Later mobility
      and respiratory changes occurred during a broader course of care and are not attributed solely to
      surgery.
discussions:
- discussion_id: lccs_survival_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which variant, developmental and care factors determine survival and later progression in
    GLDN-associated disease?
  attaches_to:
  - has_subtypes#LCCS11
  - phenotypes#Neonatal Respiratory Failure
  rationale: Published GLDN series include terminations, neonatal deaths and long survivors, with differing
    denominators and support. The 2025 founder report includes four early deaths and one survivor with later
    progressive compromise. These data establish variable outcome but do not separate residual function,
    modifiers and care effects.
  evidence:
  - reference: PMID:39713852
    reference_title: "Identification of a Founder GLDN Variant Associated With \"Lethal\" Arthrogryposis in Nunavik
      Inuit: Implications for Obstetrical and Long-Term Survivors' Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our data corroborate those of other reports, demonstrating that LCCS11 is not universally lethal,
      but long-term survivors are at risk of progressive neuromuscular compromise.
    explanation: The newer founder series independently supports variable lethality and later morbidity.
- discussion_id: lccs12_tissue_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How do combined neuronal and muscle dystonin defects produce the lethal contracture phenotype?
  attaches_to:
  - pathophysiology#Combined Neuronal and Muscle Dystonin Deficiency
  rationale: The source establishes causal combined-isoform involvement, now represented by a qualified edge
    to contractures. It does not identify the relative neuronal and muscle mechanisms in the lethal cases; the
    separate DST-b-only cohort is not evidence of their biopsy or cardiac phenotype.
  evidence:
  - reference: PMID:40497796
    reference_title: "Deciphering DST-associated disorders: biallelic variants affecting DST-b cause a congenital
      myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation in these patients and previously published cases with respective variants
      resulted in the definition of a DST-associated lethal congenital contracture syndrome."
    explanation: >-
      Establishes DST as the gene defining a lethal congenital contracture
      syndrome.
  - reference: PMID:40497796
    reference_title: "Deciphering DST-associated disorders: biallelic variants affecting DST-b cause a congenital
      myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants that also impact DST-a besides DST-b result in a more severe, lethal congenital contracture
      syndrome."
    explanation: >-
      Gives the isoform-dependent severity relationship that separates the lethal
      phenotype from the congenital myopathy.

- discussion_id: lccs10_developmental_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How much of the NEK9 skeletal phenotype results from primary developmental dysplasia versus reduced
    fetal movement?
  attaches_to:
  - pathophysiology#Mitotic and Ciliary Regulatory Failure
  - phenotypes#Short Long Bones
  rationale: The original lethal families had akinesia and skeletal dysplasia, and their fibroblasts had both
    mitotic and ciliary abnormalities. Qualified causal links are represented. The unresolved issue is tissue
    and process attribution, not whether the causal genotype or the fetal movement phenotype exists. Surviving
    APUG-like cases are not used to supply LCCS10 visceral findings.
  evidence:
  - reference: PMID:26908619
    reference_title: Recessive NEK9 mutation causes a lethal skeletal dysplasia with evidence of cell cycle
      and ciliary defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report two Irish Traveller families with a previously undescribed lethal skeletal dysplasia
      characterized by fetal akinesia, shortening of all long bones, multiple contractures, rib anomalies,
      thoracic dysplasia, pulmonary hypoplasia and protruding abdomen.
    explanation: The original lethal skeletal-dysplasia families establish the LCCS10 clinical scope; the
      later APUG-like neonates are not used as its denominator.
- discussion_id: lccs_gldn_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why do human GLDN variants cause severe fetal disease when gliomedin-null mice have a milder nodal
    phenotype?
  attaches_to:
  - pathophysiology#Node of Ranvier Assembly Failure
  rationale: Human nerve abnormalities support the nodopathy mechanism, but preserved conduction and absence
    of arthrogryposis in null mice constrain a simple universal loss-of-function-to-complete-conduction-block
    model. Allele, species and compensatory nodal mechanisms remain unresolved.
  evidence:
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Homozygous gldn−/− mice do not have apparent neurologic deficits or features of arthrogryposis
      and demonstrate normal nerve conduction and peripheral nervous system myelin (Feinberg, et al., 2010).
    explanation: The primary clinical paper summarizes the null-mouse contrast; this is model-organism
      evidence, not a negative finding in human GLDN disease.
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nerve conduction velocity studies performed at 1 week of age demonstrated axonal motor and
      sensory neuropathy but were normal when repeated at 7 months of age.
    explanation: Human longitudinal variability is another constraint on a permanent, uniform conduction-block
      model.
- discussion_id: lccs_hydrops_growth
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What causes hydrops and restricted growth in affected fetuses, and when do placental factors
    contribute?
  attaches_to:
  - phenotypes#Hydrops Fetalis
  - phenotypes#Intrauterine Growth Restriction
  rationale: The rat paralysis experiment supports a qualified akinesia-to-growth-restriction contribution,
    now represented in the graph. It does not resolve the relative contribution in the GLDN-associated fetus
    with abnormal umbilical-artery flow. The reviewed LCCS sources establish hydrops but do not identify a
    subtype-specific fluid-balance mechanism; its absence in original ERBB3 and PIP5K1C kindreds constrains an
    obligatory consequence of contractures.
  evidence:
  - reference: PMID:35806855
    reference_title: 'Lethal Congenital Contracture Syndrome 11: A Case Report and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sonography examination revealed hydrothorax, subcutaneous generalized edema, short long bones,
      fixed limb joints, absent fetal movements, fetal growth restriction (estimated fetal weight in the 4th
      percentile and absent end-diastolic flow in both umbilical arteries), and polyhydramnios (amniotic fluid
      index 28 cm) (Figure 1).
    explanation: The coexisting flow abnormality constrains attribution of growth restriction solely to the
      fetal motor disorder.
- discussion_id: lccs_craniofacial_joint_distribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What causes jaw retrusion and hip dislocation in the reported LCCS patients?
  attaches_to:
  - phenotypes#Retrognathia
  - phenotypes#Hip Dislocation
  rationale: Fetal immobility is a supported general deformation mechanism, with micrognathia and pterygia
    routes represented separately. The reviewed sources do not specifically resolve jaw retrusion or hip
    dislocation in the cited LCCS patients. A small mandible is not equivalent to retrusion, and local
    mechanical versus primary developmental attribution remains uncertain.
  evidence:
  - reference: PMID:35806855
    reference_title: 'Lethal Congenital Contracture Syndrome 11: A Case Report and Literature Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The pregnancy was terminated and postmortem studies confirmed the prenatal findings: distal arthrogryposis,
      fetal growth restriction, pulmonary hypoplasia, and retrognathia.'
    explanation: The primary case supports jaw retrusion, not mandibular size.
- discussion_id: lccs_bladder_localization
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which central, peripheral autonomic or developmental lesion produces neurogenic bladder in ERBB3 and
    CNTNAP1 disease?
  attaches_to:
  - phenotypes#Neurogenic Bladder
  rationale: Human reports establish neurogenic bladder in both subtypes but do not localize the responsible
    autonomic lesion. Somatic anterior-horn loss alone does not establish the bladder mechanism; CNTNAP1
    disease includes both central and peripheral pathology.
  evidence:
  - reference: PMID:29882456
    reference_title: Absence of Axoglial Paranodal Junctions in a Child With CNTNAP1 Mutations,
      Hypomyelination, and Arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individual LD_0333.0 was a girl with severe hypotonia and respiratory insufficiency that required
      a tracheostomy after birth, hypomyelinating neuropathy, bilateral hearing loss, bilateral optic nerve
      atrophy, lethargy, and neurogenic bladder.
    explanation: Documents neurogenic bladder in a CNTNAP1-associated child, extending the subtype scope
      without identifying the responsible autonomic pathway.
- discussion_id: lccs_gldn_bulbar_airway
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Are GLDN-associated bulbar and diaphragmatic weakness and airway malacia caused by the same
    peripheral lesion?
  attaches_to:
  - phenotypes#Vocal Cord Paresis
  - phenotypes#Diaphragmatic Paralysis
  - phenotypes#Laryngomalacia
  - phenotypes#Tracheomalacia
  - phenotypes#Central Apnea
  rationale: The source establishes focal paresis, diaphragm paralysis and laryngoscopic malacia in different
    children. Their downstream swallowing and respiratory contributions are represented where directly
    supported. It does not localize the upstream cause of paresis or establish that structural airway malacia
    is a direct consequence of gliomedin deficiency. Polysomnographic central apnea is separately reported;
    its coexistence with tracheomalacia does not establish an obstructive mechanism.
  evidence:
  - reference: PMID:28726266
    reference_title: "Survival among children with \"Lethal\" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Insufficient swallowing aggravated by paresis of both the right vocal cord and right side of the soft
      palate prompted gastrostomy tube placement at 4 months of age."
    explanation: >-
      Documents vocal cord paresis and its contribution to the swallowing
      failure.
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Laryngoscopy demonstrated laryngo- and tracheomalacia, floppy epiglottis, and pooling of oral
      secretions.
    explanation: The laryngoscopic findings explicitly establish laryngomalacia in this child.
- discussion_id: lccs_motor_trajectory
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How do neuropathy, weakness, contractures and respiratory illness contribute separately to delayed
    motor acquisition in GLDN survivors?
  attaches_to:
  - phenotypes#Motor Developmental Delay
  rationale: The source documents delayed milestones and subsequent gains with growth and care. It does not
    separate peripheral motor dysfunction from mechanical restriction, prolonged illness or developmental
    contributors sufficiently to assign a specific causal edge to motor delay.
  evidence:
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Motor and language development was delayed; he was able to sit independently at age 13 months and
      started to crawl at age 24 months.
    explanation: The exact ages establish motor delay in the Family 3 survivor, without inferring cognitive
      impairment.
- discussion_id: lccs_cntnap1_sensory_palate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What accounts for the distinct sensory and palatal findings in surviving CNTNAP1-associated
    children?
  attaches_to:
  - phenotypes#Cerebral Visual Impairment
  - phenotypes#Hearing Impairment
  - phenotypes#Optic Atrophy
  - phenotypes#Cleft Palate
  rationale: Central and peripheral glial-axonal disease provides plausible context, but the report does not
    connect the observed cortical visual loss, hearing loss, optic atrophy or palatal malformation to a
    specific demonstrated mechanism. Hearing-loss localization and the developmental cause of cleft palate
    remain unresolved; the established central hypomyelination and atrophy routes are represented separately.
  evidence:
  - reference: PMID:29882456
    reference_title: Absence of Axoglial Paranodal Junctions in a Child With CNTNAP1 Mutations,
      Hypomyelination, and Arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individual LD_0158.0 is an 8 year old male with hypotonia and respiratory failure requiring
      intubation at birth and subsequent tracheotomy-dependency, congenital hypomyelinating neuropathy with
      arthrogryposis multiplex congenita, cleft palate, cortical vision loss, bilateral hearing loss, and
      neurogenic bladder.
    explanation: This patient-level clinical observation establishes the findings but does not establish a
      single causal route for them.
- discussion_id: lccs_dnm2_cardiopulmonary_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Were pulmonary hypertension and ductal patency in the DNM2 siblings primary developmental findings
    or consequences of respiratory insufficiency?
  attaches_to:
  - phenotypes#Pulmonary Hypertension
  - phenotypes#Patent Ductus Arteriosus
  rationale: The source explicitly states that primary versus secondary attribution could not be determined.
    The general developmental endocytosis hypothesis does not resolve this specific uncertainty, so no direct
    respiratory or genetic-mechanism edge is asserted.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3658203/
    reference_title: Dynamin 2 homozygous mutation in humans with a lethal congenital syndrome - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AFB3 and AFB4 had pulmonary hypertension and a patent ductus arteriosus; whether these features
      were primary or secondary to respiratory insufficiency could not be determined.
    explanation: The authors state the causal attribution limit for these two cardiopulmonary observations.
- discussion_id: lccs_scoliosis_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Did scoliosis in the GLDN survivor result from neuromuscular imbalance, fixed posture or a separate
    developmental process?
  attaches_to:
  - phenotypes#Scoliosis
  rationale: The clinical course establishes scoliosis requiring surgery at age nine, alongside weakness,
    atrophy and congenital contractures. It does not identify the cause or provide serial spinal development
    sufficient to distinguish neuromuscular deformation from another developmental process. The surgery
    documents the phenotype, not a demonstrated causal intermediary.
  evidence:
  - reference: PMID:28726266
    reference_title: Survival among children with "Lethal" congenital contracture syndrome 11 caused by novel
      mutations in the gliomedin gene (GLDN).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He underwent surgical treatment for bilateral hip luxation and clubfeet (age 2 years) and
      scoliosis with Harrington rod insertion (age 9 years).
    explanation: The GLDN Family 2 survivor underwent scoliosis surgery with Harrington rod insertion at age
      nine years. The hip procedure in the same sentence occurred at age two.
notes: >-
  Reviewed as a heterogeneous numbered LCCS umbrella, with subtype and allele scope retained for clinical and mechanistic
  claims. Model perturbations and author hypotheses are distinguished from human observations; generic fetal deformation
  does not explain every primary skeletal, central nervous system, vascular or visceral finding. The current mechanism
  graph uses local nodes because the subtype-specific developmental and axoglial routes require explicit evidence
  and uncertainty; no conserved module was imported solely to increase connectivity. Clinical anatomy is not treated
  as an assay readout; nerve-conduction velocity remains an explicit electrophysiological readout. The Falcon report
  was used for candidate findings only, with source-based exclusions for APUG-like NEK9 cases, DST-b-only myopathy
  and unavailable full-text-only ADCY6 details. The Schwann-cell myelin-maintenance module was considered, but its
  Schwann-intrinsic proteostatic and maintenance chain cannot be assumed for congenital ADCY6/ADGRG6 myelination
  failure or axonal CNTNAP1 paranodal disease. The ciliopathy module was also considered; the NEK9 fibroblast data
  do not establish its Hedgehog/Wnt signaling chain. These are reasons to retain qualified local mechanisms, not
  missing evidence for an already established shared module.


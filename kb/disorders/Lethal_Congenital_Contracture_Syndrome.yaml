name: Lethal Congenital Contracture Syndrome
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
description: >-
  Lethal congenital contracture syndrome (LCCS) is a genetically heterogeneous
  group of autosomal recessive fetal akinesia deformation sequence disorders in
  which failure of the developing motor unit abolishes fetal movement, producing
  multiple joint contractures, pulmonary hypoplasia and prenatal or early
  neonatal death.
synonyms:
- LCCS
disease_term:
  preferred_term: lethal congenital contracture syndrome
  term:
    id: MONDO:0017436
    label: lethal congenital contracture syndrome
parents:
- Congenital Disorder
pathophysiology:
- name: Absent Fetal Movement
  description: >-
    Total or near-total fetal akinesia from early in gestation.
phenotypes:
- category: Musculoskeletal
  name: Multiple Congenital Joint Contractures
  description: >-
    Congenital contractures involving multiple joints.
  phenotype_term:
    preferred_term: Multiple joint contractures
    term:
      id: HP:0002828
      label: Multiple joint contractures

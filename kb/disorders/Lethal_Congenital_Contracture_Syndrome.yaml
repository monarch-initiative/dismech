      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To our knowledge, among the herein 28 reviewed cases, 16 reported respiratory findings, pulmonary hypoplasia being the most frequent (75%, 12/16), followed by pulmonary insufficiency or need of respiratory support."
      explanation: >-
        In the pooled LCCS11 literature review, pulmonary hypoplasia dominates the
        respiratory findings and is followed by respiratory insufficiency,
        supporting the hypoplasia-to-failure step.
- name: Neonatal Respiratory Failure
  biological_scale: ORGANISM
  description: >-
    Respiratory insufficiency at or shortly after birth, from the combination of
    pulmonary hypoplasia, weak or absent respiratory drive, diaphragmatic
    weakness and thoracic restriction. It is the immediate cause of death in most
    liveborn infants and the intervention target in those who survive.

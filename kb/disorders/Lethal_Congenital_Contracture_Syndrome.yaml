    reference_title: "The latest FADS: Functional analysis of GLDN patient variants and classification of GLDN-associated AMC as a type of viable fetal akinesia deformation sequence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with emphasis on the finding of pulmonary hypoplasia, suggesting that AMC secondary to GLDN variants may be best fitted under the umbrella of fetal akinesia deformation sequence (FADS)"
    explanation: >-
      Identifies pulmonary hypoplasia as the finding that places GLDN-related

    evidence_source: HUMAN_CLINICAL
    snippet: "Electromyography of the affected muscles reveals myopathic motor unit potentials and abnormal irritability, often with myotonic discharges."
    explanation: Documents the characteristic EMG finding.

histopathology:
- name: Myofibrillar dissolution with Z-disc disintegration
  description: >
    The defining biopsy lesion: foci of myofibrillar dissolution associated with
    disintegration of the Z-disc and accumulation of myofibrillar degradation
    products, visible on Engel-Gomori trichrome as amorphous dark blue material
    (eosinophilic on H&E).
  diagnostic: true
  evidence:
  - reference: PMID:21496631
    reference_title: "Myofibrillar myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MFMs are characterized by a distinct pathological pattern of myofibrillar dissolution associated with disintegration of the Z-disk, accumulation of myofibrillar degradation products, and ectopic expression of multiple proteins that include desmin, αB-crystallin, dystrophin, and sometimes congophilic material."
    explanation: Canonical description of the diagnostic biopsy lesion.
- name: Granulofilamentous material on electron microscopy
  description: >
    Ultrastructurally, focal areas of myofibrillar disruption with Z-disc
    streaming and abundant granular and filamentous material that on longitudinal
    section appears to derive from the Z-disc, either interspersed among
    myofibrils or subsarcolemmal.
  diagnostic: true
  evidence:
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural examination showed single or multiple focal areas of different size with myofibrillar disruption, streaming of Z-disk, and abundant granulofilamentous material which was either diffusely interspersed among the myofibrils or located under the sarcolemma"
    explanation: Ultrastructural signature of MFM.
- name: Focal loss of oxidative and ATPase enzyme activity
  description: >
    Histochemistry shows focal intrafibre areas with reduction or loss of ATPase
    and oxidative enzyme (NADH, SDH, COX) activity, corresponding to the regions
    occupied by protein aggregates.
  evidence:
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsies from all MFM patients showed areas with a loss or reduction of ATPase and oxidative enzyme activity (COX, SDH and NADH)"
    explanation: Documents the histochemical hallmark present in all cohort biopsies.
- name: Rimmed and non-rimmed vacuoles
  description: >
    Sparse small vacuoles, rimmed or not, appear in roughly half of MFM biopsies;
    they contain cytoplasmic degradation products and reflect the autophagic arm
    of the disease. Their presence contributes to diagnostic confusion with
    inclusion body myositis.
  frequency: FREQUENT
  evidence:
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rimmed and non-rimmed vacuoles observed in 45% of cases and cytoplasmic bodies in only 10%"
    explanation: >-
      Quantifies rimmed/non-rimmed vacuoles at 45% of biopsies, mapping to the
      FREQUENT band (30-79%).
- name: Ectopic desmin, alphaB-crystallin and myotilin immunoreactivity
  description: >
    Immunohistochemistry shows focal accumulation of desmin, alphaB-crystallin
    and myotilin in 2-15% of muscle fibres regardless of the underlying gene.
    AlphaB-crystallin deposits are typically the most numerous. Immunoblotting is
    uninformative because total protein content is unchanged.
  diagnostic: true
  evidence:
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all muscle biopsies from patients with MFM, abnormal fibers with focal areas of increased reactivity for desmin, αB-crystallin and myotilin were observed"
    explanation: Documents the immunohistochemical diagnostic pattern.


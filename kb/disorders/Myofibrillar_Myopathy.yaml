name: Myofibrillar Myopathy
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
description: >
  Myofibrillar myopathy (MFM) is a genetically heterogeneous but morphologically
  stereotyped group of protein-aggregation myopathies. The unifying lesion is
  disintegration of the myofibril that begins at the Z-disc, followed by
  accumulation of myofibrillar degradation products and ectopic accumulation of
  desmin, alphaB-crystallin, myotilin, dystrophin and other proteins into
  intracellular inclusions — the "myofibrillar" pattern seen on Engel-Gomori
  trichrome and electron microscopy. Nearly all of the causative genes encode
  Z-disc or Z-disc-associated proteins (DES, CRYAB, MYOT, LDB3/ZASP, FLNC, BAG3,
  KY) or components of the muscle protein-quality-control machinery (CRYAB, BAG3,
  DNAJB6, HSPB8, UNC45B); the more recently added members (TTN, SVIL, PYROXD1)
  converge on the same Z-disc lesion from the A-band, the costamere and redox
  metabolism respectively rather than by being Z-disc structural proteins.
  Clinically MFM causes slowly progressive skeletal muscle weakness involving
  both proximal and distal muscles — distal weakness is present in about 80% of
  affected individuals — with peripheral neuropathy in a substantial minority
  (about a fifth to a quarter). Cardiomyopathy and cardiac conduction disease occur in a
  substantial minority and, together with respiratory muscle weakness, are the
  principal drivers of morbidity and mortality; there is no disease-modifying
  therapy, so cardiac and respiratory surveillance with timely device or
  transplant therapy is the main management lever.

notes: >-
  MONDO:0018943 carries `subset: disease_grouping` / `ordo_group_of_disorders`.
  It is curated here as an umbrella `Disease` (not a `Grouping`) because the
  entity is defined by a single conserved pathological process — Z-disc-initiated
  myofibrillar disintegration with ectopic protein aggregation — that can be
  modelled as one pathograph with gene-specific substitutions in `has_subtypes`,
  rather than as a curated union over independently modelled member diseases.
  Every gene-to-MFM-number assignment in this entry was verified independently
  against the MONDO term definition, the OMIM phenotype MIM number and the NCBI
  `mim2gene_medgen` gene mapping rather than taken from secondary review text.
  The `histopathology` findings deliberately carry no `finding_term`: the
  `HistopathologyFindingTerm` dynamic enum is rooted in the NCIT Histopathology
  Result branch, which has no term for myofibrillar dissolution,
  granulofilamentous material or rimmed vacuoles, and forcing an approximate
  binding would be less accurate than leaving the finding unbound (the same
  convention used in `Nemaline_Myopathy`).

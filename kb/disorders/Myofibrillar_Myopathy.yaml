pathophysiology:
- name: Z-Disc and Chaperone Protein Variant
  description: >
    The initiating lesion is a pathogenic variant in a Z-disc structural protein
    (desmin, myotilin, ZASP/LDB3, filamin C) or in a Z-disc-associated molecular
    chaperone or co-chaperone (alphaB-crystallin, BAG3, DNAJB6, UNC45B). Each
    of the six classical MFM gene products (desmin, alphaB-crystallin, myotilin,
    ZASP, filamin C, Bag3) is an integral part of the Z-disc or is closely
    associated with it, which is why the pathology converges on that structure
    regardless of which of them is mutated. The expanded gene set reaches the
    same Z-disc lesion from other compartments rather than by being Z-disc
    structural proteins: TTN through its A-band FN3-119 domain, UNC45B as a
    myosin-directed chaperone that mislocalizes from the A-band toward the
    Z-disc, SVIL from the costamere-to-Z-line link, and PYROXD1 as a
    nuclear-cytoplasmic oxidoreductase. Mutant proteins misfold or lose their
    normal binding capacity — for example the FLNC p.Trp2710Ter truncation
    disrupts the dimerization domain so that filamin C can no longer dimerize.
  role: trigger
  biological_scale: MOLECULAR

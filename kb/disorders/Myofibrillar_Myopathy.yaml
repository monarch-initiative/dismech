- name: Respiratory Muscle Involvement
  description: >
    The mechanism-level node: the same aggregate-driven fibre degeneration
    involves the diaphragm and intercostal muscles, so the respiratory pump loses
    capacity. Pump failure declares itself first during sleep, when accessory
    muscle recruitment falls away. In HMERF/TTN disease this arm is
    characteristically early and out of proportion to limb weakness, and in BAG3
    disease it reaches severity in the teens. Together with the cardiac arm it is
    the principal cause of death in MFM. The measured clinical consequence is
    modelled separately as the `Respiratory Insufficiency due to Muscle Weakness`
    phenotype.
  role: outcome
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: Skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  evidence:
  - reference: PMID:24575448

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven patients (2 with DES, 1 with ACTA1, 4 genetically uncharacterized) died, mainly due to cardiopulmonary complications."
    explanation: Establishes cardiopulmonary failure as the dominant cause of death.

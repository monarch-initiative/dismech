diagnosis:
- name: Muscle Biopsy with Histochemistry, Immunohistochemistry and Electron Microscopy
  description: >
    Muscle biopsy remains the diagnostic cornerstone. Light microscopy
    (Engel-Gomori trichrome, ATPase, NADH/SDH/COX), immunohistochemistry for
    desmin, alphaB-crystallin and myotilin, and electron microscopy together
    establish the myofibrillar pattern. Immunoblotting is not informative.
    Because the lesions can be focal, biopsy can be falsely reassuring, which has
    increased the role of muscle MRI in selecting a target muscle.
  evidence:
  - reference: PMID:26342832
    reference_title: "Myofibrillar myopathies: State of the art, present and future challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of MFM is not always easy; as histological lesions can be focal, and muscle biopsy may be disappointing; this has led to a growing importance of muscle imaging"
    explanation: Documents the limits of biopsy and the complementary role of imaging.
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, unlike immunoblot, immunohistochemistry together with light and electron microscopy is a useful diagnostic tool in MFM."
    explanation: Establishes which biopsy modalities are diagnostically useful.
- name: Molecular Genetic Testing of MFM Genes
  description: >
    A multi-gene panel or exome covering DES, CRYAB, MYOT, LDB3, FLNC, BAG3,
    FHL1, DNAJB6, TTN, KY and PYROXD1. Historically the genetic basis was
    established in only about half of cases; in a contemporary tertiary cohort 56
    of 80 patients were genetically characterized. Because prognosis and cardiac
    surveillance intensity differ sharply between subtypes, genetic diagnosis is
    not merely confirmatory.
  evidence:
  - reference: PMID:41183253
    reference_title: "Natural History and Phenotypic Spectrum of Myofibrillar Myopathies and Myopathies Associated With MFM-Related Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the phenotypic variability, genetic diagnosis is crucial for patient management and prognosis."
    explanation: Establishes the management rationale for molecular diagnosis.
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, the genetic basis of myofibrillar myopathy has been elucidated in only about 50% of cases."
    explanation: Quantifies the historical diagnostic yield of genetic testing in MFM.

imaging_findings:
- name: Selective Pattern of Muscle Involvement on MRI
  modality: MRI
  description: >
    Muscle MRI shows disorder-specific patterns of selective muscle involvement
    that can direct both biopsy site and gene selection, and has become
    increasingly important because biopsy lesions are focal.
  diagnostic: true
  evidence:
  - reference: PMID:26342832
    reference_title: "Myofibrillar myopathies: State of the art, present and future challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this has led to a growing importance of muscle imaging, and the selectivity of muscle involvement has now been described in several disorders"
    explanation: Documents the diagnostic role of muscle MRI in MFM.

treatments:
- name: Cardiac Pacemaker or Implantable Cardioverter Defibrillator
  description: >
    Device therapy for arrhythmia and cardiac conduction defects. Because
    conduction block and ventricular arrhythmia in MFM (especially desminopathy)
    can cause syncope and sudden death, pacemaker or ICD implantation is a
    central and potentially life-saving intervention.
  therapeutic_modality: DEVICE
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: pacemaker or implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_phenotypes:
  - preferred_term: Arrhythmia
    term:
      id: HP:0011675
      label: Arrhythmia
  - preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  target_mechanisms:
  - target: Cardiomyocyte Z-Disc Aggregate Pathology
    treatment_effect: MODULATES
    description: >-
      Does not modify the underlying aggregate pathology; it substitutes for or
      terminates the arrhythmic consequence of it.
  notes: >-
    The GeneReviews recommendation covers both pacemakers and implantable
    cardioverter defibrillators; NCIT:C80435 (Implantable
    Cardioverter-Defibrillator Placement) is the sibling term for the ICD arm.
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consider pacemaker and implantable cardioverter defibrillator (ICD) in individuals with arrhythmia and/or cardiac conduction defects"
    explanation: GeneReviews management recommendation for the arrhythmia arm.
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients with arrhythmias underwent pacemaker implantation."
    explanation: Documents real-world pacemaker use in an MFM cohort.
- name: Cardiac Transplantation
  description: >
    Considered for progressive or life-threatening cardiomyopathy. In BAG3
    disease transplantation has been required as early as age eight, before
    neuromuscular weakness became apparent.
  therapeutic_modality: SURGERY
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_phenotypes:
  - preferred_term: Cardiomyopathy
    term:
      id: HP:0001638
      label: Cardiomyopathy
  target_mechanisms:
  - target: Cardiomyocyte Z-Disc Aggregate Pathology
    treatment_effect: BYPASSES
    description: Replaces the diseased myocardium rather than correcting the aggregate pathology.
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "consider cardiac transplantation in individuals with progressive or life-threatening cardiomyopathy"
    explanation: GeneReviews management recommendation for advanced cardiomyopathy.
  - reference: PMID:25728519
    reference_title: "BAG3 myofibrillar myopathy presenting with cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cardiomyopathy and cardiac transplantation (age eight) preceded neuromuscular weakness by several years"
    explanation: Worked example of paediatric cardiac transplantation in BAG3-related MFM.
- name: Noninvasive Ventilatory Support
  description: >
    Continuous or bilevel positive airway pressure, initially nocturnal for
    hypoventilation and later extended into the daytime, with progression to
    mechanical ventilation as needed.
  therapeutic_modality: DEVICE
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: continuous or bilevel positive airway pressure ventilation
    term:
      id: NCIT:C124040
      label: Continuous Positive Airway Pressure
  target_phenotypes:
  - preferred_term: Respiratory insufficiency due to muscle weakness
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
  target_mechanisms:
  - target: Respiratory Muscle Involvement
    treatment_effect: MODULATES
    description: Mechanically supplements the failing respiratory pump.
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "respiratory support (continuous or bilevel positive airway pressure), initially at night and later in the daytime, in individuals with hypercapnea and other signs of incipient respiratory failure"
    explanation: GeneReviews management recommendation for ventilatory failure.
  - reference: PMID:24575448
    reference_title: "Hereditary Myopathy with Early Respiratory Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Noninvasive ventilation with bilevel positive airway pressure (BiPAP) or continuous positive airway pressure (CPAP) may be indicated for nocturnal hypoventilation initially, followed by mechanical ventilatory support as needed."
    explanation: GeneReviews HMERF management recommendation confirming the ventilatory escalation pathway.
- name: Physical Therapy and Assistive Devices
  description: >
    Range-of-motion physical therapy and assistive devices for advanced muscle
    weakness. Ankle-foot orthoses optimise independent ambulation early in the
    course of distal leg weakness; canes, walkers and wheelchairs follow. Note
    the explicit GeneReviews caveat that the role of strengthening exercise has
    not been defined — this is the closest thing MFM has to an
    "agents/circumstances to avoid" statement, and strengthening programmes
    should not be assumed beneficial.
  therapeutic_modality: BEHAVIORAL
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
  target_mechanisms:
  - target: Progressive Skeletal Muscle Fiber Degeneration
    treatment_effect: MODULATES
    description: Mitigates contracture and functional loss; does not modify fibre degeneration.
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "range-of-motion physical therapy and assistive devices for those with advanced muscle weakness. Other: The role of strengthening exercises has not been defined."
    explanation: >-
      GeneReviews management recommendation, including the explicit caveat that
      strengthening exercise is of undefined benefit.
  - reference: PMID:24575448
    reference_title: "Hereditary Myopathy with Early Respiratory Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For distal leg weakness, use of ankle-foot orthoses can optimize independent ambulation early in the disease course; later in the disease course other mobility aids (canes, walkers, or wheelchairs) may be required."
    explanation: Specifies the orthotic and mobility-aid escalation for distal leg weakness.
- name: Genetic Counseling
  description: >
    Counseling must accommodate the mixed inheritance of the group: usually
    autosomal dominant, but X-linked for FHL1 and autosomal recessive for CRYAB
    frameshift alleles, PYROXD1, KY and SVIL. When the familial variant is known,
    carrier testing and prenatal testing are possible.
  therapeutic_modality: BEHAVIORAL
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the pathogenic variant(s) in the family are known, carrier testing and prenatal testing for pregnancies at increased risk is possible."
    explanation: GeneReviews genetic counseling recommendation.
- name: Cardiac and Respiratory Surveillance
  description: >
    Systematic surveillance is the key management lever in MFM because there is
    no disease-modifying therapy and because cardiac and respiratory involvement
    typically emerge years after myopathy onset and are the main causes of death.
    Annual reassessment of muscle strength and clinical status by a neurologist
    and pulmonary function testing every six to twelve months are recommended,
    alongside cardiac assessment.
  therapeutic_modality: BEHAVIORAL
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24575448
    reference_title: "Hereditary Myopathy with Early Respiratory Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reassessment of muscle strength and clinical status annually by a neurologist; pulmonary function testing every six to 12 months, or guided by individual findings."
    explanation: GeneReviews surveillance schedule.
  - reference: PMID:28269794
    reference_title: "Myofibrillar Myopathies: New Perspectives from Animal Models to Potential Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MFMs share common histological characteristics including progressive disorganization of the interfibrillar network and protein aggregation. Currently no treatment is available."
    explanation: >-
      Establishes the absence of disease-modifying therapy, which is why
      surveillance and organ-specific intervention constitute the management
      strategy.
  - reference: PMID:41183253
    reference_title: "Natural History and Phenotypic Spectrum of Myofibrillar Myopathies and Myopathies Associated With MFM-Related Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac involvement (n = 31) and respiratory involvement (n = 33) were frequent, manifesting at a median of 7 and 9 years, respectively, after myopathy onset."
    explanation: >-
      Establishes the multi-year latency that makes ongoing surveillance, rather
      than a single baseline assessment, necessary.

differential_diagnoses:
- name: Limb-girdle muscular dystrophy
  description: >
    MFM with proximal-predominant weakness — particularly filaminopathy (FLNC)
    and myotilinopathy — is clinically indistinguishable from limb-girdle
    muscular dystrophy at the bedside. The boundary is genuinely blurred: MYOT is
    the LGMD1A gene and myotilinopathy forms a phenotypic continuum spanning
    LGMD1A and MFM; the original FLNC MFM pedigree was described as having
    clinical features of a limb-girdle myopathy; and DNAJB6-related LGMD1D shows
    myofibrillar pathology.
  disease_term:
    preferred_term: limb-girdle muscular dystrophy
    term:
      id: MONDO:0016971
      label: limb-girdle muscular dystrophy
  distinguishing_features:
  - Muscle biopsy showing myofibrillar dissolution with Z-disc disintegration and ectopic desmin/alphaB-crystallin/myotilin aggregates favors MFM
  - Concomitant cardiomyopathy, cardiac conduction disease and peripheral neuropathy point toward MFM
  - Several genes (MYOT/LGMD1A, DNAJB6/LGMD1D, FLNC) span both diagnostic labels, so genetic testing may not fully resolve the boundary
  evidence:
  - reference: PMID:15929027
    reference_title: "A mutation in the dimerization domain of filamin c causes a novel type of autosomal dominant myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an extended German pedigree with a novel form of MFM characterized by clinical features of a limb-girdle myopathy and morphological features of MFM"
    explanation: Documents the clinical overlap of MFM with limb-girdle myopathy and its resolution by morphology.
  - reference: PMID:15947064
    reference_title: "Myotilinopathy: refining the clinical and myopathological phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Spanish cohort, the largest group of patients studied so far, shares phenotypic features with both LGMD1A and MFM/MYOT variants thus establishing a continuum of phenotypic manifestations characteristic of myotilinopathy"
    explanation: >-
      Establishes that MFM and LGMD1A are a continuum for MYOT, not cleanly
      separable diagnoses.
- name: Inclusion body myositis
  description: >
    Sporadic inclusion body myositis shares rimmed vacuoles, protein aggregation
    including congophilic material, late-adult onset and slowly progressive
    weakness with MFM, and an endomysial inflammatory infiltrate can be present
    in MFM biopsies.
  disease_term:
    preferred_term: inclusion body myositis
    term:
      id: MONDO:0007827
      label: inclusion body myositis
  distinguishing_features:
  - IBM shows characteristic asymmetric quadriceps and finger-flexor weakness, whereas MFM weakness is more often symmetric with distal leg predominance
  - MFM biopsies show Z-disc-origin granulofilamentous material on electron microscopy and focal desmin/alphaB-crystallin/myotilin immunoreactivity
  - Cardiomyopathy and cardiac conduction disease are features of MFM but not of IBM
  - A pathogenic variant in an MFM gene establishes MFM
  evidence:
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Sparse small vacuoles, rimmed or not, appeared in half of the specimens"
    explanation: >-
      Documents the rimmed-vacuolar pathology in MFM that creates the diagnostic
      overlap with inclusion body myositis; the source does not itself discuss
      IBM, hence PARTIAL.
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In one biopsy specimen there was an endomysial inflammatory infiltrate."
    explanation: >-
      Documents that an inflammatory infiltrate — the histological hallmark used
      to suspect myositis — can occur in genuine MFM.
- name: Distal myopathy
  description: >
    Because distal weakness is present in about 80% of MFM patients, MFM enters
    the differential of every hereditary distal myopathy. Indeed several
    eponymous distal myopathies have turned out to be MFM subtypes:
    Markesbery-Griggs late-onset distal myopathy is LDB3/ZASP-related MFM4.
  disease_term:
    preferred_term: distal myopathy
    term:
      id: MONDO:0018949
      label: distal myopathy
  distinguishing_features:
  - Myofibrillar pathology on biopsy distinguishes MFM from non-aggregating distal myopathies such as Welander or Laing distal myopathy
  - Associated cardiomyopathy and peripheral neuropathy favor MFM
  - Some historical distal myopathy eponyms (Markesbery-Griggs) are now classified as MFM subtypes
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distal muscle weakness is present in about 80% of individuals and is more pronounced than proximal weakness in about 25%."
    explanation: Establishes why MFM must be considered in any distal myopathy presentation.
- name: VCP-related multisystem proteinopathy
  description: >
    VCP (valosin-containing protein) disease is the closest molecular
    near-neighbour outside the modelled gene set: VCP is a proteostasis ATPase,
    its muscle pathology is rimmed-vacuolar with p62/TDP-43 and desmin/myotilin
    inclusions that overlap the MFM immunohistochemical panel, and in the
    Japanese 297-case protein-aggregate-myopathy screen VCP was the second most
    frequent gene among solved cases. It is included as a differential rather
    than a subtype because its defining multisystem phenotype (Paget disease of
    bone and frontotemporal dementia) is outside the MFM concept.
  disease_term:
    preferred_term: inclusion body myopathy with Paget disease of bone and frontotemporal dementia
    term:
      id: MONDO:0000507
      label: inclusion body myopathy with Paget disease of bone and frontotemporal dementia
  distinguishing_features:
  - Paget disease of bone and frontotemporal dementia in the proband or family point to VCP rather than MFM
  - VCP inclusions are p62- and TDP-43-positive; TDP-43 is not part of the MFM aggregate signature
  - A purely myopathic VCP presentation without CNS or bone involvement is well described and is the hardest case to separate clinically
  evidence:
  - reference: PMID:37091525
    reference_title: "VCP-related myopathy: a case series and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we executed immunofluorescence staining to evaluate the presence of proteins: p62, VCP, desmin, myotilin, TDP-43"
    explanation: >-
      Shows that VCP myopathy is worked up with the same desmin/myotilin panel
      used for MFM, plus p62 and TDP-43 — the overlap that makes it a
      differential and the markers that separate it.
  - reference: PMID:37091525
    reference_title: "VCP-related myopathy: a case series and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report strongly suggest that VCP gene mutations can be related with a predominant skeletal muscle phenotype without any central nervous system involvement"
    explanation: >-
      Documents the purely myopathic VCP presentation, which is the presentation
      that is genuinely hard to distinguish from MFM.
- name: Pompe disease (glycogen storage disease II)
  description: >
    Late-onset Pompe disease presents with slowly progressive proximal and axial
    weakness plus early diaphragmatic weakness and respiratory failure — the same
    combination that characterizes MFM, and particularly HMERF. It is the single
    most important treatable mimic, since enzyme replacement therapy is
    available.
  disease_term:
    preferred_term: glycogen storage disease II
    term:
      id: MONDO:0009290
      label: glycogen storage disease II
  distinguishing_features:
  - Pompe disease is diagnosed by deficient acid alpha-glucosidase activity on dried blood spot and biallelic GAA variants
  - Pompe muscle biopsy shows PAS-positive glycogen-filled lysosomal vacuoles with acid phosphatase reactivity, not Z-disc granulofilamentous material
  - Muscle glycogen content is normal in MFM
  - Pompe disease has a licensed disease-modifying enzyme replacement therapy; MFM management is supportive
  evidence:
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The muscle fiber lipid and glycogen content was normal."
    explanation: >-
      Documents normal muscle glycogen in MFM, one of the morphological features
      that separates it from the glycogen-storage mimic. Marked PARTIAL because
      it supports a single distinguishing feature from the MFM side only; no
      Pompe-side source is cited here.

discussions:
- discussion_id: gap_mfm_unsolved_genetic_basis
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes myofibrillar myopathy in the roughly half of patients in whom no
    pathogenic variant is found in any known MFM gene?
  rationale: >-
    Despite the addition of KY, PYROXD1, TTN, FHL1, DNAJB6, SVIL, UNC45B, MYL2
    and HSPB8 to the original six genes, a large fraction of pathologically
    confirmed MFM remains genetically unsolved. In the 21-patient Verona cohort
    the genetic basis was established in only 28% of cases; GeneReviews puts the
    historical figure at about 50%, and even the contemporary Mayo cohort left 24
    of 80 patients uncharacterized. Whether the remainder reflects additional
    Z-disc/proteostasis genes, non-coding or structural variation in known genes,
    or a non-Mendelian route is unresolved, and it directly limits both prognosis
    and family counseling.
  attaches_to:
  - pathophysiology#Z-Disc and Chaperone Protein Variant
  proposed_experiments:
  - experiment_id: exp_mfm_genome_sequencing_panel_negative
    name: Genome sequencing of biopsy-confirmed, panel-negative MFM
    description: >-
      Apply short- and long-read genome sequencing with structural- and
      non-coding-variant analysis to biopsy-confirmed MFM cohorts that are
      negative on a comprehensive MFM gene panel, to test whether the missing
      heritability lies in undetected variation within known genes.
  - experiment_id: exp_mfm_muscle_rnaseq
    name: Muscle RNA sequencing for aberrant splicing and allelic imbalance
    description: >-
      Sequence RNA from patient muscle to detect aberrant splicing events and
      allele-specific expression at known MFM loci that escape DNA-level panels.
  - experiment_id: exp_mfm_aggregate_proteomics
    name: Proteomic profiling of laser-captured aggregates
    description: >-
      Laser-capture microdissect the protein aggregates from genetically
      unsolved MFM biopsies and characterise their constituents by mass
      spectrometry to nominate novel candidate genes.
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, the genetic basis of myofibrillar myopathy has been elucidated in only about 50% of cases."
    explanation: Quantifies the diagnostic gap that motivates this knowledge gap.
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, the genetic basis of MFM was established in only 28% of our cases and these data are consistent with those reported in other studies."
    explanation: Independent cohort quantification of the unsolved fraction.
- discussion_id: gap_mfm_aggregate_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is protein aggregation in myofibrillar myopathy the cause of muscle fibre
    degeneration, or a downstream marker of a more proximal stress-induced
    pathway?
  rationale: >-
    The mechanisms leading to protein aggregation are not fully understood, and
    it has been proposed that the fibre abnormalities in MFM represent a common
    step of a stress-induced pathway that can be triggered by different stimuli —
    which would make the aggregates a consequence rather than the primary toxic
    species. This distinction determines whether therapeutic strategies should
    target aggregate clearance (for example by augmenting chaperone-assisted
    selective autophagy) or the upstream stress response, and it is the reason
    the aggregate-to-degeneration edge in this entry is typed
    INDIRECT_UNKNOWN_INTERMEDIATES.
  attaches_to:
  - pathophysiology#Ectopic Protein Aggregate Accumulation
  proposed_experiments:
  - experiment_id: exp_mfm_temporal_aggregate_vs_dysfunction
    name: Time-resolved aggregate formation versus fibre dysfunction
    description: >-
      Use inducible MFM models to establish whether measurable contractile
      dysfunction precedes, coincides with, or follows detectable aggregate
      formation.
  - experiment_id: exp_mfm_casa_augmentation_rescue
    name: CASA augmentation rescue experiment
    description: >-
      Test whether pharmacological or genetic augmentation of chaperone-assisted
      selective autophagy rescues muscle function, and whether any rescue tracks
      with reduction in aggregate burden.
  evidence:
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, the mechanisms leading to protein aggregation are not fully understood and recent studies proposed that the fiber abnormalities in MFM probably are a common step of a stress-induced pathway, triggered by different stimuli"
    explanation: States the unresolved causal direction between aggregation and fibre injury.

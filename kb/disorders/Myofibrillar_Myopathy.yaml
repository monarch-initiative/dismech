    reference_title: "Chaperone-assisted selective autophagy is essential for muscle maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Stv and its mammalian ortholog BAG-3 coordinate the activity of Hsc70 and the small heat shock protein HspB8 during disposal that is initiated by the chaperone-associated ubiquitin ligase CHIP and the autophagic ubiquitin adaptor p62."
    explanation: Defines the molecular composition of the CASA machinery centred on BAG3.
  - reference: PMID:20060297
    reference_title: "Chaperone-assisted selective autophagy is essential for muscle maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Impaired CASA results in Z disk disintegration and progressive muscle weakness in flies, mice, and men."
    explanation: Directly connects CASA failure to the defining Z-disc lesion of MFM.
  - reference: PMID:22366786
    reference_title: "Mutations affecting the cytoplasmic functions of the co-chaperone DNAJB6 cause limb-girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies demonstrated that the mutations increase the half-life of DNAJB6, extending this effect to the wild-type protein, and reduce its protective anti-aggregation effect."
    explanation: Shows loss of anti-aggregation chaperone capacity as the mechanism in a CASA-complex partner.
  downstream:
  - target: Ectopic Protein Aggregate Accumulation
    causal_link_type: DIRECT
    description: Failure to clear damaged Z-disc components leaves them to aggregate.
    evidence:

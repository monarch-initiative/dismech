- name: Desmin Intermediate Filament Network Disruption
  description: >
    Desmin is the principal intermediate filament protein of cardiac, skeletal
    and smooth muscle, forming a continuous cytoskeletal network that links
    adjacent Z-discs to each other and to the sarcolemma, nucleus and
    mitochondria. Mutant desmin — or loss of its dedicated chaperone
    alphaB-crystallin — destabilises this network so that it can no longer
    maintain the spatial organisation of the contractile apparatus. Muscle cell
    lines transfected with mutant CRYAB reproduce intracellular aggregates
    containing both desmin and alphaB-crystallin, identical to those seen in
    patient muscle fibres.
  role: amplifier
  biological_scale: CELLULAR
  biological_processes:

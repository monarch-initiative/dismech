  evidence:
  - reference: PMID:33802723
    reference_title: "The Role of Z-disc Proteins in Myopathy and Cardiomyopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Numerous proteins interact in the Z-disc to facilitate force transduction and intracellular signalling in both cardiac and skeletal muscle."
    explanation: >-
      Establishes that the Z-disc machinery disrupted in MFM operates in
      cardiomyocytes as well as skeletal myofibres, which is the basis for
      cardiac involvement and for conformance to the cardiomyopathy module's

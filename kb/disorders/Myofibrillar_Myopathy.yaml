inheritance:
- name: Autosomal Dominant
  description: >
    Most myofibrillar myopathy is inherited in an autosomal dominant manner.
    Heterozygous missense and truncating variants in DES, CRYAB, MYOT, LDB3/ZASP,
    FLNC and BAG3 each act dominantly (the prototypical FLNC allele is the
    nonsense p.Trp2710Ter), and dominant transmission was apparent in the original
    gene-discovery cohorts.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myofibrillar myopathy is most commonly inherited in an autosomal dominant manner."
    explanation: GeneReviews states dominant inheritance is the usual mode.
- name: Autosomal Recessive
  description: >
    A recessive route exists for CRYAB, where biallelic frameshift variants that
    lead to premature termination and loss of the alphaB-crystallin protein cause
    disease. Recessive variants have also been reported for PYROXD1, KY and SVIL.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "autosomal recessive inheritance of CRYAB pathogenic frameshift variants that lead to premature termination of the translational chain resulting in non-transcription of the mutated protein"
    explanation: GeneReviews documents the recessive CRYAB exception.
- name: X-Linked
  description: >
    FHL1-related muscular dystrophy, which can display full myofibrillar
    myopathy pathology (with or without reducing bodies), is X-linked.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:20301672
    reference_title: "Myofibrillar Myopathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked inheritance of FHL1 pathogenic variants"
    explanation: GeneReviews documents X-linked FHL1 as an inheritance exception within MFM.

has_subtypes:
- name: MFM1
  display_name: Myofibrillar myopathy 1 (desminopathy, DES)
  description: >
    Desminopathy, caused by variants in DES encoding the muscle intermediate
    filament protein desmin. The most common genetically defined MFM and the one
    with the earliest and most frequent cardiac involvement: distal-onset leg
    weakness spreading proximally, with conduction block, arrhythmia and heart
    failure, and frequent respiratory muscle involvement. Gene assignment
    verified against OMIM 601419 / NCBI GeneID 1674.
  subtype_term:
    preferred_term: myofibrillar myopathy 1
    term:
      id: MONDO:0011076
      label: myofibrillar myopathy 1
  genes:
  - preferred_term: DES
    term:
      id: hgnc:2770
      label: DES
  evidence:
  - reference: PMID:41183253
    reference_title: "Natural History and Phenotypic Spectrum of Myofibrillar Myopathies and Myopathies Associated With MFM-Related Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with desminopathy exhibited earlier and higher rates of cardiac involvement (p < 0.001), more frequent respiratory involvement (p = 0.029), earlier gait aid dependence (p = 0.018)"
    explanation: Mayo natural-history cohort identifies desminopathy as the most cardiopulmonary-severe MFM subtype.
- name: MFM2
  display_name: Myofibrillar myopathy 2 (alphaB-crystallinopathy, CRYAB)
  description: >
    AlphaB-crystallinopathy, caused by variants in CRYAB encoding the small
    heat-shock protein / molecular chaperone alphaB-crystallin. The classic
    adult-onset form (MFM2A, OMIM 608810) arises from the dominant p.Arg120Gly
    variant and can be accompanied by cataract; recessive CRYAB frameshift
    alleles cause a distinct fatal infantile hypertonic form (MFM2B, OMIM 613869,
    MONDO:0013472). CRYAB is a component of the chaperone/proteostasis axis
    shared with BAG3. Gene assignment verified against the MONDO:0012130
    definition ("mutation in the CRYAB gene"), its xref OMIM 608810 (the
    dominant adult-onset arm) and NCBI GeneID 1410; the recessive infantile arm
    carries a separate OMIM (613869) and MONDO class (MONDO:0013472), so the
    bound subtype term strictly covers only the dominant arm while this subtype
    entry describes both.
  subtype_term:
    preferred_term: myofibrillar myopathy 2
    term:
      id: MONDO:0012130
      label: myofibrillar myopathy 2
  genes:
  - preferred_term: CRYAB
    term:
      id: hgnc:2389
      label: CRYAB
  evidence:
  - reference: PMID:9731540
    reference_title: "A missense mutation in the alphaB-crystallin chaperone gene causes a desmin-related myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified an R120G missense mutation in CRYAB that co-segregates with the disease phenotype in this family."
    explanation: Original identification of CRYAB p.Arg120Gly as a cause of desmin-related (myofibrillar) myopathy.
- name: MFM3
  display_name: Myofibrillar myopathy 3 (myotilinopathy, MYOT)
  description: >
    Myotilinopathy, caused by variants in MYOT encoding myotilin, a key Z-disc
    component. Mutations cluster in the serine-rich exon 2 hotspot, the same
    region harbouring the LGMD1A variants. Onset at 42-77 years with weakness
    starting in distal or proximal leg muscles and spreading; cardiomyopathy,
    respiratory failure and peripheral neuropathy occur in a fraction of
    patients. Gene assignment verified against OMIM 609200 / NCBI GeneID 9499.
  subtype_term:
    preferred_term: myofibrillar myopathy 3
    term:
      id: MONDO:0012215
      label: myofibrillar myopathy 3
  genes:
  - preferred_term: MYOT
    term:
      id: hgnc:12399
      label: MYOT
  evidence:
  - reference: PMID:15111675
    reference_title: "Mutations in myotilin cause myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors detected four missense mutations in 6 of 57 patients with MFM in the serine-rich exon 2 of MYOT, where the two previously identified LGMD1A mutations are located."
    explanation: Establishes MYOT exon 2 as an MFM mutation hotspot.
  - reference: PMID:15947064
    reference_title: "Myotilinopathy: refining the clinical and myopathological phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is characterized by the onset at the age of 42-77 years with muscle weakness initially in distal or proximal leg muscles, eventually spreading to other muscle groups of the lower and upper extremities."
    explanation: Defines the age-at-onset range and weakness distribution of myotilinopathy.
- name: MFM4
  display_name: Myofibrillar myopathy 4 (zaspopathy, LDB3/ZASP)
  description: >
    Zaspopathy, caused by variants in LDB3 encoding ZASP (Z-band alternatively
    spliced PDZ motif-containing protein). Late-adult onset (44-73 years in the
    original series) with distal-predominant weakness in a subset; also known as
    Markesbery-Griggs late-onset distal myopathy. Cardiac involvement and
    neuropathy occur in a minority. Gene assignment verified against OMIM 609452
    / NCBI GeneID 11155.
  subtype_term:
    preferred_term: myofibrillar myopathy 4
    term:
      id: MONDO:0012277
      label: myofibrillar myopathy 4
  genes:
  - preferred_term: LDB3
    term:
      id: hgnc:15710
      label: LDB3
  evidence:
  - reference: PMID:15668942
    reference_title: "Mutations in ZASP define a novel form of muscular dystrophy in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore searched for mutations in ZASP in 54 MFM patients and detected 3 heterozygous missense mutations in 11. Their age at onset was 44 to 73 years."
    explanation: Original description of ZASP/LDB3 mutations as a cause of MFM with late-adult onset.
- name: MFM5
  display_name: Myofibrillar myopathy 5 (filaminopathy, FLNC)
  description: >
    Filaminopathy, caused by variants in FLNC encoding filamin C. The
    prototypical variant (p.Trp2710Ter) lies in the dimerization domain and
    abolishes proper dimerization, producing massive cytoplasmic filamin
    C-containing aggregates. Clinically limb-girdle (proximal-predominant), with
    common respiratory muscle weakness and reported cardiac conduction and
    structural abnormalities. Gene assignment verified against OMIM 609524 / NCBI
    GeneID 2318.
  subtype_term:
    preferred_term: myofibrillar myopathy 5
    term:
      id: MONDO:0012289
      label: myofibrillar myopathy 5
  genes:
  - preferred_term: FLNC
    term:
      id: hgnc:3756
      label: FLNC
  evidence:
  - reference: PMID:15929027
    reference_title: "A mutation in the dimerization domain of filamin c causes a novel type of autosomal dominant myofibrillar myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a co-segregating, heterozygous nonsense mutation (8130G-->A; W2710X) in the filamin c gene (FLNC) on chromosome 7q32.1"
    explanation: Original FLNC MFM family with the dimerization-domain nonsense variant.
- name: MFM6
  display_name: Myofibrillar myopathy 6 (BAG3-opathy, BAG3)
  description: >
    BAG3-related MFM, caused almost invariably by the recurrent de novo
    heterozygous BAG3 p.Pro209Leu variant. Distinct from other MFM subtypes in
    its childhood onset, rapid progression, severe early cardiomyopathy (which
    may precede weakness and require transplantation), severe axonal sensorimotor
    neuropathy, rigid spine and adolescent respiratory failure. BAG3 is the
    mammalian orthologue of Drosophila Starvin and the organising co-chaperone of
    chaperone-assisted selective autophagy (CASA). Gene assignment verified
    against OMIM 612954 / NCBI GeneID 9531.
  subtype_term:
    preferred_term: myofibrillar myopathy 6
    term:
      id: MONDO:0013061
      label: myofibrillar myopathy 6
  genes:
  - preferred_term: BAG3
    term:
      id: hgnc:939
      label: BAG3
  evidence:
  - reference: PMID:19085932
    reference_title: "Mutation in BAG3 causes severe dominant childhood muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a heterozygous p.Pro209Leu mutation in three patients. All presented in childhood, had progressive limb and axial muscle weakness, and experienced development of cardiomyopathy and severe respiratory insufficiency in their teens"
    explanation: Defines the BAG3 p.Pro209Leu childhood-onset severe MFM subtype.
- name: MFM7
  display_name: Myofibrillar myopathy 7 (KY)
  description: >
    KY-related myopathy, caused by biallelic variants in KY encoding
    kyphoscoliosis peptidase, a Z-disc-associated protein. Presents as a
    congenital myopathy with core targetoid defects, kyphoscoliosis and tongue
    atrophy. Gene assignment verified against OMIM 617114 / NCBI GeneID 339855
    and the MONDO:0014922 definition.
  subtype_term:
    preferred_term: myofibrillar myopathy 7
    term:
      id: MONDO:0014922
      label: myofibrillar myopathy 7
  genes:
  - preferred_term: KY
    term:
      id: hgnc:26576
      label: KY
  evidence:
  - reference: PMID:27484770
    reference_title: "Kyphoscoliosis peptidase (KY) mutation causes a novel congenital myopathy with core targetoid defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kyphoscoliosis peptidase (KY) mutation causes a novel congenital myopathy with core targetoid defects."
    explanation: >-
      Original report assigning KY as a myopathy gene. PubMed provides only the
      title for this short Acta Neuropathologica communication (no abstract
      body), so the quoted snippet is the article title itself.
- name: MFM8
  display_name: Myofibrillar myopathy 8 (PYROXD1)
  description: >
    PYROXD1-related myopathy, caused by biallelic variants in PYROXD1, a pyridine
    nucleotide-disulphide oxidoreductase. Early-onset myopathy with internalized
    nuclei and myofibrillar disorganization; slowly progressive, with facial
    weakness, nasal speech and swallowing difficulties. Gene assignment verified
    against OMIM 617258 / NCBI GeneID 79912 and the MONDO:0014993 definition.
  subtype_term:
    preferred_term: myofibrillar myopathy 8
    term:
      id: MONDO:0014993
      label: myofibrillar myopathy 8
  genes:
  - preferred_term: PYROXD1
    term:
      id: hgnc:26162
      label: PYROXD1
  evidence:
  - reference: PMID:27745833
    reference_title: "Variants in the Oxidoreductase PYROXD1 Cause Early-Onset Myopathy with Internalized Nuclei and Myofibrillar Disorganization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinctive histopathology showed abundant internalized nuclei, myofibrillar disorganization, desmin-positive inclusions, and thickened Z-bands."
    explanation: >-
      Original gene-discovery report for PYROXD1 myopathy (MFM8); the quoted
      histopathology is the myofibrillar-pattern lesion that places it in this
      group.
  - reference: PMID:27745833
    reference_title: "Variants in the Oxidoreductase PYROXD1 Cause Early-Onset Myopathy with Internalized Nuclei and Myofibrillar Disorganization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "facial weakness, nasal speech, swallowing difficulties"
    explanation: Documents the facial and bulbar involvement characteristic of MFM8.
- name: MFM9
  display_name: Myofibrillar myopathy 9 / hereditary myopathy with early respiratory failure (TTN)
  description: >
    Hereditary myopathy with early respiratory failure, caused by heterozygous
    variants in the region of TTN encoding the 119th fibronectin-3 domain of
    titin. Third-to-fifth-decade onset with distal leg weakness and,
    distinctively, early nocturnal respiratory symptoms out of proportion to limb
    weakness. MONDO does not currently expose a `myofibrillar myopathy 9` class
    under MONDO:0018943; the OMIM designation MFM9 corresponds to OMIM 603689
    (verified via NCBI `mim2gene_medgen` → GeneID 7273, TTN). HMERF is included
    here because contemporary MFM reviews explicitly place it inside the group.
  genes:
  - preferred_term: TTN
    term:
      id: hgnc:12403
      label: TTN
  evidence:
  - reference: PMID:24575448
    reference_title: "Hereditary Myopathy with Early Respiratory Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of HMERF is established in a proband with typical clinical findings and/or a heterozygous pathogenic variant in the region of TTN that encodes the 119th fibronectin-3 domain of titin on molecular genetic testing."
    explanation: GeneReviews defines the TTN A-band FN3-119 domain as the HMERF locus.
  - reference: PMID:26342832
    reference_title: "Myofibrillar myopathies: State of the art, present and future challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "other entities such as FHL1 myopathy or Hereditary Myopathy with Early Respiratory Failure linked to mutations of titin can now as well be included in this group"
    explanation: Justifies including HMERF/TTN within the MFM group.
- name: FHL1-Related
  display_name: FHL1 muscular dystrophy with myofibrillar myopathy pathology
  description: >
    X-linked FHL1-related muscular dystrophy. LIM2-domain variants produce
    menadione-NBT-positive reducing bodies composed of 13-nm tubulofilaments that
    emanate from Z-discs; a variant outside the LIM domains produced a mild
    late-onset phenotype with MFM pathology and no reducing bodies. Features
    include muscle hypertrophy, rigid spine and joint contractures.
  genes:
  - preferred_term: FHL1
    term:
      id: hgnc:3702
      label: FHL1
  evidence:
  - reference: PMID:22094483
    reference_title: "Reducing bodies and myofibrillar myopathy features in FHL1 muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FHL1 dystrophies can be associated with MFM pathology. Mutations in the LIM2 domain are associated with reducing bodies composed of distinct tubulofilaments."
    explanation: Establishes FHL1 as a cause of MFM-pattern pathology.
- name: DNAJB6-Related
  display_name: DNAJB6 limb-girdle muscular dystrophy (LGMD1D) with myofibrillar pathology
  description: >
    Dominant DNAJB6 G/F-domain variants (p.Phe89Ile, p.Phe93Leu) cause LGMD1D
    with Z-disc myofibrillar disintegration, rimmed vacuoles and accumulation of
    myotilin, desmin and alphaB-crystallin. DNAJB6 interacts with the CASA
    complex including BAG3, placing it mechanistically inside the MFM
    proteostasis group.
  genes:
  - preferred_term: DNAJB6
    term:
      id: hgnc:14888
      label: DNAJB6
  evidence:
  - reference: PMID:22366786
    reference_title: "Mutations affecting the cytoplasmic functions of the co-chaperone DNAJB6 cause limb-girdle muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show that DNAJB6 interacts with members of the CASA complex, including the myofibrillar myopathy-causing protein BAG3"
    explanation: Links DNAJB6 disease to the BAG3/CASA proteostasis axis of MFM.
- name: MFM10
  display_name: Myofibrillar myopathy 10 (supervillin, SVIL)
  description: >
    Biallelic loss-of-function variants in SVIL encoding supervillin cause a
    childhood/adolescence-onset myopathy with myofibrillar disorganization and
    autophagic vacuoles. Supervillin is a sarcolemmal myosin II- and
    F-actin-binding protein that potentially attaches the sarcolemma to
    myofibrillar Z-lines — a costameric rather than strictly Z-disc location.
    Note that the reported patients had no or only minor muscle weakness and only
    mild cardiac manifestations, so this is a mild outlier within the group.
    Gene assignment verified against OMIM 619040 / NCBI GeneID 6840.
  subtype_term:
    preferred_term: myofibrillar myopathy 10
    term:
      id: MONDO:0033620
      label: myofibrillar myopathy 10
  genes:
  - preferred_term: SVIL
    term:
      id: hgnc:11480
      label: SVIL
  evidence:
  - reference: PMID:32779703
    reference_title: "Loss of supervillin causes myopathy with myofibrillar disorganization and autophagic vacuoles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report four patients from two unrelated, consanguineous families with a childhood/adolescence onset of a myopathy associated with homozygous loss-of-function mutations in SVIL."
    explanation: Original SVIL gene-discovery report establishing recessive loss of function as the mechanism.
  - reference: PMID:32779703
    reference_title: "Loss of supervillin causes myopathy with myofibrillar disorganization and autophagic vacuoles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supervillin (SV2) binds and co-localizes with costameric dystrophin and binds nebulin, potentially attaching the sarcolemma to myofibrillar Z-lines."
    explanation: >-
      Places supervillin at the costamere-to-Z-line link rather than within the
      Z-disc proper, which is why this subtype extends the group beyond the
      classic Z-disc proteins.
- name: MFM11
  display_name: Myofibrillar myopathy 11 (myosin chaperone UNC-45B)
  description: >
    Bi-allelic variants in UNC45B, encoding the myosin-directed chaperone
    UNC-45B, cause childhood-onset progressive muscle weakness, extending the MFM
    group beyond Z-disc structural proteins into the sarcomeric chaperone
    machinery. Mutant UNC-45B is reduced in muscle and mislocalized away from the
    A-band towards the Z-disc. Gene
    assignment verified against OMIM 619178 / NCBI GeneID 146862. Two further
    numbered members of the OMIM MFM series are not separately modelled here:
    MFM12 (MYL2, OMIM 619424, MONDO:0859168) and MFM13 (HSPB8, OMIM 621078,
    MONDO:0976133); HSPB8 is of particular mechanistic interest because it is the
    small heat-shock protein partner of BAG3 in the CASA complex. Also out of
    scope for this release, but reported in the wider protein-aggregate myopathy
    spectrum and worth a future look: PLEC, ACTA1 (a patient with an ACTA1
    variant appears in the Mayo cohort cited under `genetic[DES]`), VCP, and the
    digenic SQSTM1-TIA1 combination.
  subtype_term:
    preferred_term: myofibrillar myopathy 11
    term:
      id: MONDO:0030927
      label: myofibrillar myopathy 11
  genes:
  - preferred_term: UNC45B
    term:
      id: hgnc:14304
      label: UNC45B
  evidence:
  - reference: PMID:33217308
    reference_title: "Pathogenic Variants in the Myosin Chaperone UNC-45B Cause Progressive Myopathy with Eccentric Cores."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report ten individuals with bi-allelic variants in UNC45B who exhibit childhood-onset progressive muscle weakness."
    explanation: Original UNC45B gene-discovery report establishing the recessive childhood-onset phenotype.
  - reference: PMID:33217308
    reference_title: "Pathogenic Variants in the Myosin Chaperone UNC-45B Cause Progressive Myopathy with Eccentric Cores."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In situ localization studies further demonstrated reduced expression of mutant UNC-45B in muscle combined with abnormal localization away from the A-band towards the Z-disk of the sarcomere."
    explanation: >-
      Documents the mislocalization toward the Z-disc that connects this
      chaperonopathy to the Z-disc-centred MFM group.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: RARE
  notes: >-
    Orphanet (ORPHA:593) and MONDO both classify myofibrillar myopathy as a rare
    disorder, and no reliable numeric point-prevalence estimate is published for
    the group as a whole; published series are tertiary-referral cohorts, which
    cannot establish population epidemiology. Recorded as a qualitative class
    rather than a fabricated rate.
  evidence:
  - reference: PMID:22106715
    reference_title: "Clinical, morphological and genetic studies in a cohort of 21 patients with myofibrillar myopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The term myofibrillar myopathies (MFM) refers to uncommon neuromuscular disorders that pathologically are characterized by myofibrillar degeneration and ectopic expression of several proteins."
    explanation: >-
      Supports the qualitative rarity class only; the source characterizes MFM as
      "uncommon" without providing a population rate.

progression:
- phase: Muscular or cardiac onset in mid-adult life
  age_range: Median 42.3 years (IQR 20.2-57.0)
  notes: >-
    Most patients present with skeletal muscle symptoms, but a substantial
    minority (14 of 80 in the Mayo cohort) present with cardiac symptoms first.
  evidence:
  - reference: PMID:41183253
    reference_title: "Natural History and Phenotypic Spectrum of Myofibrillar Myopathies and Myopathies Associated With MFM-Related Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at symptom onset was 42.3 years"

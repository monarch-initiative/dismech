- name: Ectopic Protein Aggregate Accumulation
  description: >
    Degraded myofibrillar filaments aggregate into pleomorphic granular or
    hyaline inclusions in which multiple proteins are ectopically expressed:
    desmin, alphaB-crystallin, myotilin, dystrophin, sarcoglycans, NCAM, plectin,
    gelsolin, ubiquitin, filamin C and sometimes congophilic amyloid material.
    Immunohistochemically these focal accumulations affect 2-15% of muscle fibres
    and correspond to the fibre regions with lost ATPase and oxidative enzyme
    activity. Importantly, immunoblotting shows no change in total protein
    content, indicating mislocalisation and aggregation rather than
    overexpression — which is why immunohistochemistry, not immunoblot, is the
    diagnostic tool.

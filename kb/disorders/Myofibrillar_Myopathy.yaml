- name: Cardiomyocyte Z-Disc Aggregate Pathology
  description: >
    Desmin and the other MFM proteins are as highly expressed in cardiac as in
    skeletal muscle, so the same Z-disc aggregate pathology occurs in
    cardiomyocytes. The resulting cardiomyocyte insult drives two clinically
    distinct arms: a conduction/arrhythmia arm (atrioventricular and bundle
    branch block, atrial and ventricular tachyarrhythmia, syncope, sudden cardiac
    death) and a structural arm (dilated, hypertrophic or restrictive
    cardiomyopathy progressing to congestive heart failure). This is the main
    driver of mortality in MFM and the reason cardiac surveillance is the
    dominant management concern. In BAG3 disease the cardiomyopathy can be the
    presenting feature and precede neuromuscular weakness by years, requiring
    transplantation in childhood. The node is declared conformant to the `Primary
    Cardiomyocyte Insult` trigger of the `cardiomyopathy_maladaptive_remodeling`
    module, whose definition explicitly covers "a variant in a sarcomeric or
    cytoskeletal protein gene that perturbs sarcomere assembly and force
    generation" — the situation here — and it carries both biological processes
    that module trigger expects (sarcomere organization and muscle contraction,
    both ABNORMAL). Scope note: only **trigger-level** conformance is asserted.
    The module's downstream neurohormonal-activation, ventricular-remodeling and
    heart-failure nodes are not duplicated here because MFM-specific evidence for
    them was not identified, and the module is explicitly kept distinct from the
    electrical mechanism modelled by `cardiac_ion_channel_repolarization`; the
    conduction/arrhythmia manifestations below are therefore attached as
    phenotypic outputs of this cardiomyocyte insult, not as a claim that this
    entry instantiates the module's electrical arm.
  role: consequence
  biological_scale: CELLULAR
  conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
  cell_types:

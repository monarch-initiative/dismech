- name: Chaperone-Assisted Selective Autophagy Failure
  description: >
    The Z-disc is under continuous mechanical, thermal and oxidative stress
    during contraction, and its damaged components are disposed of by
    chaperone-assisted selective autophagy (CASA). In this pathway BAG3
    (mammalian orthologue of Drosophila Starvin) coordinates the activity of the
    constitutive chaperone Hsc70/HSPA8 and the small heat-shock protein HspB8;
    disposal is initiated by the chaperone-associated ubiquitin ligase CHIP and
    the autophagic ubiquitin adaptor p62. Damaged filamin is a canonical CASA
    client. CASA is mechanistically distinct from chaperone-mediated autophagy —
    it proceeds through macroautophagy of ubiquitinated aggregates (aggrephagy)
    rather than direct lysosomal translocation of the client. This node explains
    why CRYAB and BAG3, which are chaperones rather than structural Z-disc
    proteins, produce the identical Z-disc lesion, and DNAJB6 disease joins the
    same axis through its interaction with the CASA complex. Impaired CASA
    results in Z-disc disintegration and progressive muscle weakness in flies,
    mice and humans.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Aggrephagy
    term:
      id: GO:0035973
      label: aggrephagy
    modifier: DECREASED
  - preferred_term: Protein Quality Control for Misfolded Proteins
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
    modifier: DECREASED
  molecular_functions:

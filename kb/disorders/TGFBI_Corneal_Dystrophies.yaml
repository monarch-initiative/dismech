    label: epithelial-stromal TGFBI dystrophy
has_subtypes:
- name: GCD1
  display_name: Granular Corneal Dystrophy Type I
  description: Characterized by discrete, well-demarcated, breadcrumb-like hyaline deposits in the anterior corneal stroma. Caused by the R555W mutation. Progressive visual impairment over decades.
  subtype_term:
    preferred_term: granular corneal dystrophy type I
    term:
      id: MONDO:0007377
      label: granular corneal dystrophy type I
- name: GCD2
  display_name: Granular Corneal Dystrophy Type II (Avellino)
  description: Characterized by mixed granular and lattice deposits in the corneal stroma, combining features of both granular and lattice dystrophies. Caused by the R124H mutation. Homozygotes have severe early-onset disease. Particularly common in Korean populations.
  subtype_term:
    preferred_term: granular corneal dystrophy type II
    term:
      id: MONDO:0011855
      label: granular corneal dystrophy type II
- name: LCD1
  display_name: Lattice Corneal Dystrophy Type I
  description: Characterized by amyloid deposits forming branching lattice lines in the corneal stroma. Caused by the R124C mutation. Recurrent corneal erosions are common.
  subtype_term:
    preferred_term: lattice corneal dystrophy type I
    term:
      id: MONDO:0007380
      label: lattice corneal dystrophy type I
- name: RBCD
  display_name: Reis-Bucklers Corneal Dystrophy
  description: Superficial corneal dystrophy with irregular deposits at the level of Bowman layer. Caused by the R124L mutation. Presents with recurrent corneal erosions from early childhood.
  subtype_term:
    preferred_term: Reis-Bucklers corneal dystrophy
    term:
      id: MONDO:0012043
      label: Reis-Bucklers corneal dystrophy
- name: TBCD
  display_name: Thiel-Behnke Corneal Dystrophy
  description: Superficial corneal dystrophy with honeycomb-shaped deposits at Bowman layer. Caused by the R555Q mutation. Clinically similar to Reis-Bucklers but with distinct ultrastructural features.
  subtype_term:
    preferred_term: Thiel-Behnke corneal dystrophy
    term:
      id: MONDO:0011185
      label: Thiel-Behnke corneal dystrophy

  description: Missense mutations in TGFBI alter the structure of TGFBIp (keratoepithelin), a secreted extracellular matrix protein expressed by corneal epithelial cells. The mutant protein misfolds, disrupting normal protein folding and stability. The severity and age of onset depend on the specific amino acid alteration.

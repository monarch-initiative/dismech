- name: Molecular Genetic Testing of TGFBI
  diagnosis_term:
    preferred_term: DNA Sequencing
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  description: Targeted sequencing of TGFBI (especially mutational hotspots in exons 4 and 12 encoding R124 and R555) establishes definitive subtype diagnosis, distinguishes clinically overlapping phenotypes, and screens candidates prior to keratorefractive surgery.
  results: Identification of a heterozygous or homozygous pathogenic TGFBI missense variant (such as p.Arg124Cys, p.Arg124His, p.Arg124Leu, p.Arg555Trp, or p.Arg555Gln).
  evidence:
  - reference: PMID:30760895
    reference_title: Evaluation of TGFBI corneal dystrophy and molecular diagnostic testing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'At present one commercially available test examines for the five most common of these mutations: R124H, R124C, R124L, R555W, and R555Q.'
    explanation: Establishes targeted molecular genetic testing of TGFBI hotspot mutations for diagnostic confirmation.
  - reference: PMID:22355247
    reference_title: Phenotype-genotype correlations in patients with TGFBI-linked corneal dystrophies in Taiwan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequencing of TGFBI can aid in the precise classification of these corneal dystrophies.
    explanation: Directly supports TGFBI sequencing for precise subtype classification when clinical features overlap.
differential_diagnoses:
- name: Paraproteinemic keratopathy
  description: Acquired monoclonal gammopathy-associated corneal deposition (linked to MGUS, Waldenstrom macroglobulinemia, or multiple myeloma) that can closely mimic lattice corneal dystrophies (LCDs) or granular corneal dystrophy type 1 (GCD1).
  distinguishing_features:
  - Late and potentially unilateral onset with a negative family history
  - Associated with systemic monoclonal gammopathy (MGUS or multiple myeloma) rather than pathogenic TGFBI variants
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: PPK can mimic various corneal dystrophies including SCD, LCDs, or GCD1.
    explanation: IC3D consensus statement identifying paraproteinemic keratopathy (PPK) as a clinical mimic of TGFBI-related lattice (LCDs) and granular (GCD1) corneal dystrophies.
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The index of suspicion for PPK can increase if there is late and possibly unilateral onset with a negative family history.
    explanation: Establishes late/unilateral onset and negative family history as clinical features distinguishing paraproteinemic keratopathy from inherited corneal dystrophies.

treatments:
- name: Corneal Transplantation
  description: Penetrating keratoplasty or deep anterior lamellar keratoplasty for advanced disease with significant visual impairment. Recurrence of deposits in the graft is common, particularly for lattice and granular dystrophies.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Corneal transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  evidence:
  - reference: DOI:10.3390/vision7010022
    reference_title: Management of Stromal Corneal Dystrophies; Review of the Literature with a Focus on Phototherapeutic Keratectomy and Keratoplasty
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Where there is visual reduction, treatment options may include either phototherapeutic keratectomy (PTK) or corneal transplantation.
    explanation: Review explicitly identifies corneal transplantation as a treatment option for visually significant stromal corneal dystrophies.
  - reference: DOI:10.3341/kjo.2023.0032
    reference_title: 'Mini-Review: Clinical Features and Management of Granular Corneal Dystrophy Type 2'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For deeper lesions, deep anterior lamellar keratoplasty can be used as the endothelial layer is not always affected.
    explanation: GCD2 management review supports lamellar keratoplasty for deeper stromal deposits.
- name: Phototherapeutic Keratectomy
  description: Excimer laser phototherapeutic keratectomy (PTK) can remove superficial deposits and improve visual acuity, particularly for Reis-Bucklers and Thiel-Behnke subtypes.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Phototherapeutic keratectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: DOI:10.3390/vision7010022
    reference_title: Management of Stromal Corneal Dystrophies; Review of the Literature with a Focus on Phototherapeutic Keratectomy and Keratoplasty
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Due to the anterior location of the deposits in Reis-Bücklers and Thiel–Behnke dystrophies, PTK is considered the treatment of choice.
    explanation: Review directly supports PTK for anterior TGFBI-associated epithelial-stromal corneal dystrophy deposits.
  - reference: DOI:10.3341/kjo.2023.0032
    reference_title: 'Mini-Review: Clinical Features and Management of Granular Corneal Dystrophy Type 2'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Phototherapeutic keratectomy removes anterior opacities and is advantageous in terms of its applicability and repeatability.
    explanation: GCD2 review supports PTK for anterior corneal opacities.
- name: Genetic Counseling
  description: Genetic counseling regarding autosomal dominant inheritance with 50% recurrence risk. Genetic testing is recommended before refractive surgery (LASIK) as TGFBI mutations can cause severe corneal haze post-LASIK.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30760895
    reference_title: Evaluation of TGFBI corneal dystrophy and molecular diagnostic testing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, it is our opinion that genetic screening for these late onset, heterozygous mutations should be performed before refractive surgeries
    explanation: Directly supports genetic screening and counseling before refractive surgery in people at risk for late-onset heterozygous TGFBI mutations.

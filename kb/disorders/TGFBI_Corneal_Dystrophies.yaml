    notes: Applies to the lattice corneal dystrophy (LCD1/variant LCD) lineage and granular corneal dystrophy type 2 (GCD2, combined hyaline and amyloid), whereas GCD1, Reis-Bucklers (RBCD), and Thiel-Behnke (TBCD) involve non-amyloid hyaline or curly-fiber TGFBIp deposits.

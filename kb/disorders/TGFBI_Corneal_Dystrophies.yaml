histopathology:
- name: Insoluble TGFBIp corneal deposits
  description: TGFBI-associated corneal dystrophies show pathognomonic insoluble protein deposits in corneal tissue, with deposit form and location varying by genotype and clinicopathologic subtype.
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:25284770
    reference_title: Clinical and genetic aspects of the TGFBI-associated corneal dystrophies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The deposition of insoluble protein materials in the form of extracellular deposits or intracellular cysts is pathognomic.
    explanation: Establishes insoluble corneal protein deposits as the defining histopathologic finding in TGFBI-associated corneal dystrophies.
- name: Granular corneal dystrophy type 2 anterior stromal deposits
  description: GCD2 shows well-demarcated granular opacities in the central anterior corneal stroma; deposit extrusion can cause epithelial erosion and pain.
  subtype: GCD2
  evidence:
  - reference: DOI:10.3341/kjo.2023.0032
    reference_title: 'Mini-Review: Clinical Features and Management of Granular Corneal Dystrophy Type 2'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is characterized by well demarcated granular shaped opacities in central anterior stroma and as the disease progresses, extrusion of the deposits results in ocular pain due to corneal epithelial erosion.
    explanation: Provides subtype-specific corneal stromal deposit morphology and its relationship to epithelial erosion in GCD2.
- name: Granular corneal dystrophy type 1 Masson-positive deposits
  description: GCD1 is associated with R555W TGFBI variants and shows granular/hyaline stromal deposits that are highlighted by Masson trichrome staining.
  subtype: GCD1
  evidence:
  - reference: PMID:22355247
    reference_title: Phenotype-genotype correlations in patients with TGFBI-linked corneal dystrophies in Taiwan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common mutations in Taiwan were R124H in GCD type 2 and R555W in GCD type 1.
    explanation: Supports the genotype-subtype assignment for the GCD1 histopathology entry.
  - reference: PMID:20697279
    reference_title: Granular and lattice deposits in corneal dystrophy caused by R124C mutation of TGFBIp.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: granular deposits stained with Masson trichrome and lattice deposits stained with ThT and Congo red showed birefringence and dichroism as expected.
    explanation: Supports Masson trichrome staining as a marker of granular/hyaline corneal deposits.
- name: Lattice corneal dystrophy type 1 amyloid deposits
  finding_term:
    preferred_term: Corneal amyloid deposits
    term:
      id: NCIT:C54018
      label: Amyloid Deposition
  description: LCD1 is associated with R124C TGFBI variants and shows stromal amyloid deposits with lattice morphology; amyloid deposits are detected by Congo red or related amyloid stains.
  subtype: LCD1
  evidence:
  - reference: PMID:38359414
    reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Classic lattice corneal dystrophy (LCD) results from TGFBI R124C mutation. The LCD variant group has over 80 dystrophies with non-R124C TGFBI mutations, amyloid deposition, and often similar phenotypes to classic LCD.
    explanation: IC3D supports the R124C association and amyloid-deposit pattern for classic lattice corneal dystrophy.
  - reference: PMID:20697279
    reference_title: Granular and lattice deposits in corneal dystrophy caused by R124C mutation of TGFBIp.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In control LCD sections, stromal deposits were stained with ThT but not with trichrome, confirming lack of granular deposits.
    explanation: Supports amyloid-type staining in lattice corneal dystrophy and distinguishes LCD deposits from granular Masson-positive deposits.

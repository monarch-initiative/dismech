genetic:
- name: CFAP410
  gene_term:
    preferred_term: CFAP410
    term:
      id: hgnc:1260
      label: CFAP410
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Formerly C21orf2, also LRRC76; 21q22.3. Five biallelic alleles in the original
    series (three missense, two splicing, with the splicing effects confirmed at RNA
    level). The gene also causes isolated retinal dystrophy with macular staphyloma,
    Jeune syndrome, and has been associated with amyotrophic lateral sclerosis, so
    the genotype does not predict this entity. In the largest CFAP410 series only
    22.4 per cent of patients had skeletal features consistent with axial SMD.
  evidence:
  - reference: PMID:26974433
    reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted whole exome sequencing and identified C21orf2 (chromosome 21 open reading frame 2) as a disease gene for axial SMD."
    explanation: "The gene-disease assignment."
  - reference: PMID:40246852
    reference_title: "Variants in CFAP410 cause a range of retinal and skeletal phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A minority of patients (22.4%) presented with skeletal abnormalities consistent with axial spondylometaphyseal dysplasia (SMDAX)."
    explanation: >-
      Quantifies how often a CFAP410 genotype produces this disease rather than
      isolated retinal dystrophy. Read from the retinal end, this entity is the
      minority presentation of the gene.
- name: NEK1
  gene_term:
    preferred_term: NEK1
    term:
      id: hgnc:7744
      label: NEK1
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    The second locus, and the CFAP410 binding partner. Reported as compound
    heterozygous c.3107C>G (p.S1036*) and c.3830A>C (p.D1277A). NEK1 variants also
    cause short-rib thoracic dystrophy, which lacks the retinal dystrophy, so the
    presence or absence of retinal involvement is what separates the NEK1 disorders
    clinically. Genetic heterogeneity beyond these two genes is likely: patients
    without a CFAP410 variant remained unexplained in the original series.
  evidence:
  - reference: PMID:28123176
    reference_title: "Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we identified NEK1 as the second disease gene for axial SMD."
    explanation: "The gene-disease assignment for the second locus."
  - reference: PMID:28123176
    reference_title: "Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NEK1 mutations have previously been found in three types of short rib thoracic dystrophy, which have no retinal dystrophy."
    explanation: >-
      The differential within the NEK1 disorders, and the reason retinal
      involvement is diagnostically load-bearing here.
  - reference: PMID:26974433
    reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of patients without C21orf2 mutation indicated genetic heterogeneity of axial SMD."
    explanation: >-
      Establishes that the two known genes do not account for every case, which
      is the basis for the locus-heterogeneity statement in the notes.
treatments:
- name: Respiratory surveillance and supportive care
  description: >-
    The thoracic constriction is what threatens life in the skeletal dysplasias of
    this class, so respiratory function is followed rather than treated. No
    disease-specific respiratory intervention has been reported for axial SMD.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Thoracic Constriction and Restrictive Ventilation
    description: Addresses the consequence of the thoracic constriction rather than the constriction itself.
  notes: >-
    Left without evidence deliberately. No treatment study exists for this disease
    and none of the papers cited here states a respiratory management
    recommendation in a form that could be quoted. The rationale is the mechanism
    recorded in the pathograph, and this note is the honest version of that.
- name: Low-vision rehabilitation and ophthalmic surveillance
  description: >-
    The retinal dystrophy is progressive and has no disease-modifying therapy.
    Management is surveillance and visual rehabilitation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: low-vision rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_phenotypes:
  - preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  notes: >-
    Also deliberately unevidenced. The cited series report the natural history of
    the visual loss but make no management claim that could be quoted here.
- name: Genetic counseling
  description: >-
    Autosomal recessive, so a 25 per cent recurrence risk for siblings. Counseling
    is complicated by the fact that the same biallelic genotype can produce
    isolated retinal dystrophy in one person and the full skeletal phenotype in
    another.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40246852
    reference_title: "Variants in CFAP410 cause a range of retinal and skeletal phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A minority of patients (22.4%) presented with skeletal abnormalities consistent with axial spondylometaphyseal dysplasia (SMDAX)."
    explanation: >-
      The variable expressivity that makes counseling non-trivial: most people with
      a CFAP410 genotype do not have the skeletal phenotype.
diagnosis:
- name: Skeletal survey
  description: >-
    The diagnosis is made radiographically. The combination of mild platyspondyly,
    a small thorax with cupped anterior rib ends, irregular proximal femoral
    metaphyses and lacy iliac wings is the recognizable pattern, and it is what the
    entity was named for.
  diagnosis_term:
    preferred_term: skeletal radiographic survey
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:9266195
    reference_title: "Axial spondylometaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a new type of spondylometaphyseal dysplasia (SMD) and propose the name axial SMD."
    explanation: >-
      The entity was defined on the radiographic pattern, which is what makes the
      skeletal survey the diagnostic step rather than a supporting one.
- name: Molecular testing of CFAP410 and NEK1
  description: >-
    Confirmatory sequencing. A negative result does not exclude the diagnosis:
    unexplained cases remained after CFAP410 screening in the original series.
  diagnosis_term:
    preferred_term: CFAP410 and NEK1 sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26974433
    reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of patients without C21orf2 mutation indicated genetic heterogeneity of axial SMD."
    explanation: "The basis for the caveat that a negative test does not exclude the diagnosis."
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists. The literature comprises the original three
    cases from 1997, nine families studied in the gene-discovery paper of which six
    carried CFAP410 variants, one NEK1 patient, and the skeletal subset of a
    49-patient CFAP410 series. Note the denominator in that last figure is patients
    ascertained through ophthalmology, so it says what fraction of CFAP410 retinal
    disease carries the skeletal phenotype, not how common the disease is.
  evidence:
  - reference: PMID:40246852
    reference_title: "Variants in CFAP410 cause a range of retinal and skeletal phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A minority of patients (22.4%) presented with skeletal abnormalities consistent with axial spondylometaphyseal dysplasia (SMDAX)."
    explanation: >-
      The only proportion available, quoted with its ascertainment caveat stated
      in the notes rather than presented as a prevalence.
discussions:
- discussion_id: ciliary_signalling_unmeasured_in_chondrocytes
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which ciliary signalling pathway actually fails in the axial SMD growth plate,
    and has any of it been measured in this disease?
  attaches_to:
  - pathophysiology#Growth Plate Chondrocyte Differentiation Failure
  - pathophysiology#Defective Primary Ciliogenesis
  rationale: >-
    The step from defective ciliogenesis to the skeletal lesion is the weakest
    link in this pathograph and the entry marks the edge INDIRECT_UNKNOWN_INTERMEDIATES for that reason.
    In other skeletal ciliopathies the mechanism is impaired Hedgehog transduction
    through failed ciliary translocation of GLI transcription factors, and that is
    a reasonable expectation here, but no Hedgehog readout, no GLI localization,
    and no growth-plate histology has been reported in an axial SMD patient or
    model. The only chondrocyte-level datum is a functional result described by its
    own authors as suggesting involvement in cartilage differentiation. Until a
    signalling readout is measured, the skeletal arm rests on analogy.
- discussion_id: dna_repair_arm_contribution
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the homologous-recombination defect contribute to the skeletal or retinal
    phenotype, or is it a parallel consequence of losing the same complex?
  attaches_to:
  - pathophysiology#Impaired Homologous Recombination Repair
  rationale: >-
    The CFAP410-NEK1 complex has two demonstrated functions and this disease could
    in principle be caused by either. The repair arm is modelled here as a node
    with no downstream edge, which is deliberate: nothing published connects it to
    a tissue phenotype in axial SMD. The reason it is not simply omitted is that
    the same complex is implicated in amyotrophic lateral sclerosis, where the DNA
    repair function is the favoured mechanism, so which arm matters may be
    tissue-dependent rather than settled.
- discussion_id: axial_restriction_unexplained
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the skeletal involvement confined to the axial skeleton and proximal
    femora when the affected complex is ubiquitously required for ciliogenesis?
  attaches_to:
  - pathophysiology#Axial Metaphyseal and Vertebral Dysplasia
  rationale: >-
    The site restriction is the naming feature of the disease and nothing explains
    it. A ubiquitously expressed ciliary protein producing a dysplasia limited to
    vertebrae, ribs, ilia and proximal femora implies either a growth-plate-specific
    requirement at those sites or a modifier, and neither has been looked for.

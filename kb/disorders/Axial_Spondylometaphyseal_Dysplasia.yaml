inheritance:
- name: Autosomal Recessive
  description: Biallelic variants in either CFAP410 or NEK1, by homozygosity or compound heterozygosity, with segregation confirmed in the reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Axial spondylometaphyseal dysplasia (axial SMD) is an autosomal recessive disease characterized by dysplasia of axial skeleton and retinal dystrophy.
    explanation: States the mode of inheritance and, in the same sentence, the two-tissue definition of the entity.
  - reference: PMID:21910225
    reference_title: 'Axial spondylometaphyseal dysplasia: additional reports.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Equally affected sibling pairs of opposite gender and parental consanguinity are strongly suggestive of autosomal recessive inheritance.
    explanation: The segregation evidence that supported the recessive assignment before either gene was known.
pathophysiology:
- name: Biallelic CFAP410 or NEK1 Loss of Function
  biological_scale: MOLECULAR
  description: 'Biallelic CFAP410 variants include missense and splice-altering alleles. A NEK1-associated patient carried the nonsense variant p.Ser1036Ter and missense variant p.Asp1277Ala. Functional effects depend on the allele: the NEK1 variants markedly reduce association with CFAP410, whereas CFAP410 p.Arg73Pro weakens this association and has been characterized as hypomorphic. Complete absence of either protein is not established for every patient genotype.'
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We found a total of five biallelic C21orf2 mutations in six families out of nine: three missense and two splicing mutations in patients with various ethnic backgrounds.'
    explanation: The allelic series establishing CFAP410 as the first disease gene.
  - reference: PMID:28123176
    reference_title: Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By whole-exome sequencing in a patient with axial SMD, we identified compound heterozygous mutations of NEK1, c.3107C>G (p.S1036*) and c.3830A>C (p.D1277A), which co-segregated in the family.
    explanation: The second locus, with family segregation.
  - reference: PMID:40246852
    reference_title: Variants in CFAP410 cause a range of retinal and skeletal phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with the most severe ophthalmic and skeletal phenotypes had disease-associated variants within conserved leucine-rich regions of CFAP410
    explanation: Genotype-phenotype correlation locating severity in the domain that mediates the NEK1 interaction, which is why the next node is the complex rather than either protein alone.
  downstream:
  - target: Disruption of the CFAP410-NEK1 Complex
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37188479
      reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Taken together, the data above indicate that the NEK1–C21ORF2 association is negatively impacted by NEK1 pathogenic mutations S1036* and D1277A, and by the C21ORF2 R73P and L224P mutations.
      explanation: Co-immunoprecipitation in transfected ARPE-19 cells supports allele-specific impairment of association. The L224P experiment concerns a related skeletal ciliopathy; the NEK1 alleles and R73P are also documented in axial SMD.
    description: Demonstrated for the tested NEK1 p.Ser1036Ter/p.Asp1277Ala and CFAP410 p.Arg73Pro variants; not a universal functional assignment to every disease-associated allele.
  - target: Reduced Stability of Selected CFAP410 Variants
    causal_link_type: DIRECT
    evidence:
    - &id001
      reference: PMID:37901396
      reference_title: Pathogenicity and functional analysis of CFAP410 mutations causing cone-rod dystrophy with macular staphyloma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Western blot showed that the half-life of CFAP410 protein carrying the Y107H variant and P116 L variant was significantly shorter compared with the wild-type protein, indicating that both pathogenic variants impaired the stability of CFAP410 protein (Figure 7B).
      explanation: Cycloheximide chase in transfected HEK293T cells; both alleles were previously reported together in axial SMD, while this study patient had isolated retinal dystrophy.
- name: Reduced Stability of Selected CFAP410 Variants
  biological_scale: MOLECULAR
  description: 'CFAP410 p.Tyr107His and p.Pro116Leu have shorter protein half-lives and increased ubiquitination in transfected HEK293T cells. MG132 increased mutant protein stability. The result is allele- and model-specific: it does not establish universal CFAP410 degradation or the mechanism of reduced CFAP410 abundance after NEK1 knockout.'
  evidence:
  - *id001
  - reference: PMID:37901396
    reference_title: Pathogenicity and functional analysis of CFAP410 mutations causing cone-rod dystrophy with macular staphyloma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that the ubiquitination levels of P116L and Y107H proteins were significantly increased compared to the wild-type CFAP410 proteins (Figure 7D).
    explanation: Supports increased ubiquitination of these two variants in the cell-line assay.
  downstream:
  - target: Defective Primary Ciliogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced protein abundance is a plausible contributor, but the protein-turnover study did not directly measure ciliary assembly for these two alleles.
- name: Disruption of the CFAP410-NEK1 Complex
  biological_scale: MOLECULAR
  description: Endogenous CFAP410 associates tightly with NEK1 in ARPE-19 cells. The NEK1 C-terminal region spanning residues 1160-1286 is necessary and sufficient for association in cellular assays. AlphaFold predicts an interface with the CFAP410 N-terminal leucine-rich repeat region, supported by mutagenesis, but direct binding of purified proteins was not demonstrated. Tested disease-associated variants reduce association to different degrees. In NEK1-knockout cells, both wild-type and kinase-dead NEK1 restored CFAP410 abundance, whereas association-defective variants did not; kinase activity and complex-dependent abundance are therefore separable requirements.
  molecular_functions:
  - preferred_term: CFAP410 binding to the NEK1 C-terminal interaction domain
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0019901
      label: protein kinase binding
  evidence:
  - reference: PMID:37188479
    reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These observations suggest but do not prove that the interaction is direct.
    explanation: Co-immunoprecipitation, mass spectrometry, modeling and mutagenesis support a complex without establishing purified-protein direct binding.
  - reference: PMID:37188479
    reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We noticed that both NEK1–WT and NEK1–KD restored C21ORF2 expression level back to normal in NEK1–KO cells (Fig S7B).
    explanation: Kinase-dead NEK1 rescued CFAP410 abundance; loss of NEK1-mediated phosphorylation must not be treated as the demonstrated explanation for reduced abundance in this experiment.
  - reference: PMID:37188479
    reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, the NEK1 mutants which weakened association with C21ORF2 did not rescue C21ORF2 expression, consistent with the possibility that complex formation regulates C21ORF2 stability (Fig S7B).
    explanation: Supports an association-dependent contribution to CFAP410 abundance; turnover mechanisms remain unresolved.
  downstream:
  - target: Defective Primary Ciliogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37188479
      reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We show that NEK1 mutations that inhibit kinase activity or weaken its association with C21ORF2 severely compromise ciliogenesis, and that C21ORF2, like NEK1 is required for homologous recombination.
      explanation: Weakening the association compromises ciliogenesis, which is exactly the causal step this edge claims.
  - target: Impaired Homologous Recombination Repair
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37188479
      reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Taken together, we conclude that cells deficient in NEK1 or C21ORF2 have a major defect in HR.
      explanation: Knockdown reporter assays establish a requirement for the proteins; they do not isolate complex disruption as the causal defect.
    description: Depletion of either partner reduces homologous recombination, but the effect of specific association-defective axial SMD alleles on repair was not tested.
- name: Defective Primary Ciliogenesis
  biological_scale: CELLULAR
  conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
  description: NEK1 or CFAP410 knockout markedly reduces the proportion of ciliated ARPE-19 cells after serum starvation. Wild-type re-expression rescues ciliogenesis, whereas kinase-dead NEK1 and the association-defective NEK1 p.Asp1277Ala allele do not. These epithelial-cell experiments establish a ciliary function but do not directly assay an axial SMD growth plate or patient photoreceptor.
  biological_processes:
  - preferred_term: primary cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  evidence:
  - reference: PMID:26167768
    reference_title: An siRNA-based functional genomics screen for the identification of regulators of ciliogenesis and ciliopathy genes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Biochemical approaches place C21orf2 within key ciliopathy-associated protein modules, offering an explanation for the skeletal and retinal involvement observed in individuals with C21orf2 variants.
    explanation: An unbiased genome-wide screen, not a candidate-gene experiment, placing the protein in the ciliary machinery and connecting that to the two affected tissues.
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study indicates that axial SMD is a member of a unique group of ciliopathy affecting skeleton and retina.
    explanation: The classification of the disease as a ciliopathy by the group that identified its first gene.
  - reference: PMID:37188479
    reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: As shown in Fig 5D and E, the proportion of NEK1–KO and C21ORF2–KO cells bearing primary cilia was reduced dramatically compared with parental cells.
    explanation: Loss of either gene impairs primary ciliogenesis in ARPE-19 cells.
  downstream:
  - target: Photoreceptor Connecting Cilium Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26294103
      reference_title: C21orf2 is mutated in recessive early-onset retinal dystrophy with macular staphyloma and encodes a protein that localises to the photoreceptor primary cilium.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Immunohistochemical studies in human, pig and mouse retinas localised C21orf2 protein to the ciliary structures of the photoreceptor cell (the daughter basal body, the centriole adjacent to the basal body, and the connecting cilium).
      explanation: Localization supports a plausible ciliary site of action but does not itself measure dysfunction or establish the causal sequence.
      directness: INDIRECT
    description: The proteins participate in ciliogenesis and CFAP410 localizes to photoreceptor ciliary structures; localization alone does not demonstrate connecting-cilium failure in a patient.
  - target: Altered Chondrocyte Marker Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: 'An inferred connection: CFAP410 knockdown alters cartilage-marker expression in a chondrosarcoma cell line, but neither ciliary signaling nor patient growth-plate differentiation was measured.'
    evidence:
    - reference: PMID:26974433
      reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Functional data in chondrocyte suggest C21orf2 is implicated in cartilage differentiation.
      explanation: The only chondrocyte-level functional evidence in the disease literature. The authors' own hedge ("suggest") is why this edge is marked as indirect with unknown intermediates.
- name: Impaired Homologous Recombination Repair
  biological_scale: MOLECULAR
  description: Depletion of CFAP410 or NEK1 reduces homologous recombination in U2-O-S traffic-light and DR-GFP reporter assays. CFAP410 depletion had little effect on cell-cycle distribution, arguing against a cell-cycle explanation for its repair phenotype. Whether this repair defect contributes to skeletal dysplasia or retinal degeneration in axial SMD remains untested.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: DECREASED
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  evidence:
  - reference: PMID:37188479
    reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Depletion of NEK1 and C21ORF2 resulted in a dramatic reduction in HR efficiency, similar in effect size to depletion of BRCA1.
    explanation: Direct result from a cell-based homologous-recombination reporter assay; not a demonstration of DNA damage in patient tissues.
- name: Photoreceptor Connecting Cilium Dysfunction
  biological_scale: CELLULAR
  description: CFAP410 localizes to the connecting cilium and basal-body structures of photoreceptors. This supports a ciliary site of disease action, but patient photoreceptor transport failure was not measured in the cited studies. Reduced stability of selected variants was demonstrated separately in transfected HEK293T cells, not in patient photoreceptors.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: C21orf2 protein was localized to the connecting cilium of the cone and rod photoreceptors, confirming its significance in retinal function.
    explanation: AAV reporter and fusion-protein localization in mouse retina supports the ciliary site of action; this was not a patient-cell dysfunction or treatment-rescue experiment.
    directness: INDIRECT
  downstream:
  - target: Progressive Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26294103
      reference_title: C21orf2 is mutated in recessive early-onset retinal dystrophy with macular staphyloma and encodes a protein that localises to the photoreceptor primary cilium.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This retinal dystrophy phenotype is caused by recessive mutations in C21orf2 and can be considered a retinal ciliopathy as C21orf2 encodes a protein that localises to photoreceptor ciliary structures.
      explanation: Genetic association and ciliary localization support a model of retinal ciliopathy without directly measuring the intervening transport or degeneration mechanism.
      directness: INDIRECT
- name: Progressive Photoreceptor Degeneration
  biological_scale: TISSUE
  description: Retinal dysfunction and visual loss can begin early and progress. Fundoscopic retinitis pigmentosa and electroretinographic cone-rod dysfunction are both described in axial SMD; fundoscopic pigmentation does not independently establish a rod-first disease sequence. The relative cone-rod and rod-cone frequencies in a broader CFAP410 ophthalmic cohort cannot be transferred to axial SMD.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  evidence:
  - reference: PMID:40246852
    reference_title: Variants in CFAP410 cause a range of retinal and skeletal phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A cone-rod dystrophy pattern was observed roughly two times more commonly than rod-cone dystrophy.
    explanation: The pattern mix in 49 patients ascertained through ophthalmic genetics centres. Note this is not directly comparable with the axial SMD series below, where the two labels describe the same eyes on different tests.
  - reference: PMID:21910225
    reference_title: 'Axial spondylometaphyseal dysplasia: additional reports.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Retinal changes are diagnosed as retinitis pigmentosa or pigmentary retinal degeneration on fundoscopic examination and cone-rod dystrophy on electroretinogram.
    explanation: The modality distinction. This is the sentence that stops the two phenotype records below being read as competing frequencies.
  - reference: PMID:21910225
    reference_title: 'Axial spondylometaphyseal dysplasia: additional reports.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Impaired visual acuity comes to medical attention in early life and function rapidly deteriorates.
    explanation: Onset and rate of the visual loss in the clinically defined series.
  downstream:

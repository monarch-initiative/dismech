  description: Molecular evaluation includes CFAP410 and NEK1, interpreted with the skeletal and ophthalmic phenotype. The original CFAP410-negative cases motivated identification of a second locus; that earlier study was not a test of the combined diagnostic yield of both genes.
  diagnosis_term:
    preferred_term: CFAP410 and NEK1 sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conducted whole exome sequencing and identified C21orf2 (chromosome 21 open reading frame 2) as a disease gene for axial SMD.
    explanation: Supports CFAP410 molecular testing.
  - reference: PMID:28123176
    reference_title: Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this study, we identified NEK1 as the second disease gene for axial SMD.
    explanation: Supports inclusion of NEK1.
- name: Repeated ophthalmologic evaluation
  description: Detailed and repeated ophthalmologic examinations are recommended because early visual symptoms can precede recognizable retinal degeneration. Fundoscopy and electrophysiology provide complementary characterization.
  evidence:
  - reference: PMID:23371363
    reference_title: Axial spondylometaphyseal dysplasia with retinitis pigmentosa--a clinical report and diagnostic clues.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Any patient with this constellation of findings should have repeated in-depth ophthalmologic examination.
    explanation: Disease-specific clinical recommendation after recognition of retinal abnormalities only in adolescence.
  - reference: PMID:40246852
    reference_title: Variants in CFAP410 cause a range of retinal and skeletal phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A detailed ophthalmological examination should also be recommended for all SMDAX patients, as it would allow us to better estimate the true frequency of ophthalmic manifestations in this condition and the spectrum thereof.
    explanation: Explicit recommendation for axial SMD, even though the underlying cohort includes broader CFAP410 disease.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: A population prevalence is not established. The 2016 clinical study included 13 patients from nine families, nine patients from six families with CFAP410 variants; families F1-F6 had been reported previously, so these reports must not be summed as independent cases. The later 49-person study was ascertained through CFAP410 retinal disease and its 11-person skeletal subset is not a population prevalence or a uniform axial SMD cohort.
  evidence:
  - reference: PMID:40246852
    reference_title: Variants in CFAP410 cause a range of retinal and skeletal phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A minority of patients (22.4%) presented with skeletal abnormalities consistent with axial spondylometaphyseal dysplasia (SMDAX).
    explanation: The only proportion available, quoted with its ascertainment caveat stated in the notes rather than presented as a prevalence.
  - reference: PMID:21910225
    reference_title: 'Axial spondylometaphyseal dysplasia: additional reports.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report here on the clinical and radiological manifestations in seven affected individuals from five families (three sporadic cases and two familial cases).
    explanation: Seven individuals in the 2011 report; subsequent series include previously reported families, so the counts overlap.
discussions:
- discussion_id: ciliary_signalling_unmeasured_in_chondrocytes
  kind: KNOWLEDGE_GAP
  prompt: Which ciliary signalling pathway actually fails in the axial SMD growth plate, and has any of it been measured in this disease?
  attaches_to:
  - pathophysiology#Altered Chondrocyte Marker Expression
  - pathophysiology#Defective Primary Ciliogenesis
  rationale: The step from defective ciliogenesis to the skeletal lesion is the weakest link in this pathograph and the entry marks the edge INDIRECT_UNKNOWN_INTERMEDIATES for that reason. In other skeletal ciliopathies the mechanism is impaired Hedgehog transduction through failed ciliary translocation of GLI transcription factors, and that is a reasonable expectation here, but no Hedgehog readout, no GLI localization, and no growth-plate histology has been reported in an axial SMD patient or model. The only chondrocyte-level datum is a functional result described by its own authors as suggesting involvement in cartilage differentiation. Until a signalling readout is measured, the skeletal arm rests on analogy.
- discussion_id: dna_repair_arm_contribution
  kind: KNOWLEDGE_GAP
  prompt: Does the homologous-recombination defect contribute to the skeletal or retinal phenotype, or is it a parallel consequence of losing the same complex?
  attaches_to:
  - pathophysiology#Impaired Homologous Recombination Repair
  rationale: 'The CFAP410-NEK1 complex has two demonstrated functions and this disease could in principle be caused by either. The repair arm is modelled here as a node with no downstream edge, which is deliberate: nothing published connects it to a tissue phenotype in axial SMD. The reason it is not simply omitted is that the same complex is implicated in amyotrophic lateral sclerosis, where the DNA repair function is the favoured mechanism, so which arm matters may be tissue-dependent rather than settled.'
- discussion_id: axial_restriction_unexplained
  kind: KNOWLEDGE_GAP
  prompt: Why are ribs, vertebrae and proximal femora prominently affected when CFAP410 and NEK1 participate broadly in ciliary biology?
  attaches_to:
  - pathophysiology#Axial Metaphyseal and Vertebral Dysplasia
  rationale: 'The distribution is characteristic but not absolute: the 2016 series also recorded metacarpal metaphyseal abnormalities and one patient with other long-bone involvement. Tissue-specific requirements and modifiers remain hypotheses.'
- discussion_id: species_dependent_ciliogenesis_requirement
  kind: KNOWLEDGE_GAP
  prompt: Why does CFAP410 disruption strongly impair ciliation in mammalian epithelial cells but produce a much smaller effect on algal flagella?
  attaches_to:
  - pathophysiology#Defective Primary Ciliogenesis
  rationale: The 2023 mammalian knockout and 2025 algal knockout studies differ in organism, cilium type and assay conditions. The algal report also differs internally between numerical reductions in Results and a lack of significance in Discussion. Cell-cycle effects and compensation remain hypotheses.
experimental_models:
- name: ARPE-19 CFAP410 and NEK1 knockout-rescue cells
  experimental_model_type: CELL_LINE
  description: CRISPR knockout and re-expression in human retinal pigment epithelial cells test protein association, abundance and primary ciliogenesis.
  publication: PMID:37188479
  modeled_mechanisms:
  - target: Disruption of the CFAP410-NEK1 Complex
    relationship: PERTURBS
    limitations: Association measured by co-immunoprecipitation; not purified-protein binding.
  - target: Defective Primary Ciliogenesis
    relationship: PERTURBS
    limitations: Epithelial cell line, not patient photoreceptors or a growth plate.
  evidence:
  - reference: PMID:37188479
    reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: As shown in Fig 5D and E, the proportion of NEK1–KO and C21ORF2–KO cells bearing primary cilia was reduced dramatically compared with parental cells.
    explanation: Direct ciliation readout following knockout.
- name: U2-O-S homologous-recombination reporters
  experimental_model_type: CELL_LINE
  description: Knockdown in traffic-light and DR-GFP reporter cells measures homologous-recombination efficiency.
  publication: PMID:37188479
  modeled_mechanisms:
  - target: Impaired Homologous Recombination Repair
    relationship: PERTURBS
    limitations: Knockdown of whole proteins; effects of individual axial SMD patient alleles on repair were not tested.
  evidence:
  - reference: PMID:37188479
    reference_title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Depletion of NEK1 and C21ORF2 resulted in a dramatic reduction in HR efficiency, similar in effect size to depletion of BRCA1.
    explanation: Homologous-recombination reporter result.
- name: OUMS-27 CFAP410 knockdown
  experimental_model_type: CELL_LINE
  description: Human chondrosarcoma-cell knockdown tests cartilage-marker transcript expression.
  publication: PMID:26974433
  modeled_mechanisms:
  - target: Altered Chondrocyte Marker Expression
    relationship: PERTURBS
    limitations: Transformed cells; no patient growth-plate histology or ciliary signaling readout.
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Knock-down of C21orf2 caused significant decreases in expression of chondrocyte marker genes (Fig 5).
    explanation: Cartilage-marker transcript changes after CFAP410 depletion.
- name: ATDC5 chondrogenic differentiation time course
  experimental_model_type: CELL_LINE
  description: Mouse ATDC5 cells were followed during cartilage induction without Cfap410 perturbation.
  publication: PMID:26974433
  modeled_mechanisms:
  - target: Altered Chondrocyte Marker Expression
    relationship: MEASURES
    limitations: Expression correlation during differentiation, not a knockdown experiment.
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: While the expression of cartilage marker genes (Col2a1, Agc1 and Col10a1) was increased by the cartilage induction, 1810043G02Rik expression was continuously suppressed during cartilage differentiation (Fig 4).
    explanation: Cfap410 expression decreases as the induced cartilage markers increase.
- name: HEK293T CFAP410 p.Tyr107His and p.Pro116Leu expression
  experimental_model_type: CELL_LINE
  description: Transient overexpression with cycloheximide chase, MG132 exposure and ubiquitination assays.
  publication: PMID:37901396
  modeled_mechanisms:
  - target: Reduced Stability of Selected CFAP410 Variants
    relationship: PERTURBS
    limitations: Tagged protein overexpression; not patient-derived photoreceptors.
  evidence:
  - *id001
- name: mIMCD3 CFAP410 knockdown and allele rescue
  experimental_model_type: CELL_LINE
  description: Mouse collecting-duct cells with endogenous Cfap410 knockdown were transfected with human wild-type or mutant CFAP410.
  publication: PMID:26167768
  modeled_mechanisms:
  - target: Defective Primary Ciliogenesis
    relationship: PARTIALLY_RECAPITULATES
    limitations: The p.Arg73Pro and p.Leu224Pro constructs partially rescue ciliogenesis; the latter was reported in a Jeune-labeled family rather than the founding axial SMD series.
  evidence:
  - reference: PMID:26167768
    reference_title: An siRNA-based functional genomics screen for the identification of regulators of ciliogenesis and ciliopathy genes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Exogenous expression of both the p.Arg73Pro and p.Leu224Pro variants in C21orf2 partially rescued ciliogenesis in mIMCD3 cells following siRNA knockdown of endogenous C21orf2, suggesting that they are hypomorphic mutations (Suppl. Figure 4).
    explanation: Direct evidence of residual allele function in this assay.
- name: Purified CFAP410 C-terminal-domain assembly
  experimental_model_type: OTHER
  description: Synthetic human, trypanosome and algal C-terminal domains were studied by crystallography, light scattering, size-exclusion chromatography and circular dichroism.
  publication: PMID:39255848
  modeled_mechanisms:
  - target: Disruption of the CFAP410-NEK1 Complex
    relationship: MEASURES
    limitations: Assays measure CFAP410 oligomerization, not NEK1 affinity; impact on the complex is inferred.
  evidence:
  - reference: PMID:39255848
    reference_title: The C-terminus of CFAP410 forms a tetrameric helical bundle that is essential for its localization to the basal body.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, the disease-causing mutant L224P lost all characteristic helical features and became completely unfolded.
    explanation: Human C-terminal domain loses helicity; species-matched assays also support disruption of tetrameric assembly.
  notes: The p.Leu224Pro variant comes from the broader CFAP410 skeletal-ciliopathy spectrum; it is not evidence that every axial SMD allele disrupts tetramerization.
- name: Trypanosome CFAP410 N-terminal domain and localization
  experimental_model_type: OTHER
  description: Purified trypanosome N-terminal domains test solubility of human disease-equivalent substitutions; tagged proteins expressed in trypanosomes test cellular localization.
  publication: PMID:40018707
  modeled_mechanisms:
  - target: Disruption of the CFAP410-NEK1 Complex
    relationship: MEASURES
    limitations: Mutant solubility and localization are measured, but the human NEK1 interface is computationally predicted rather than tested as a binding assay here.
  evidence:
  - reference: PMID:40018707
    reference_title: CFAP410 has a bimodular architecture with a conserved surface patch on its N-terminal leucine-rich repeat motif for binding interaction partners.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, however, all the six mutants were present only in the pellets but not in the supernants (Figure 2F, lanes 5–22), demonstrating that the proteins are insoluble and thus likely mis-folded.
    explanation: Recombinant trypanosome domains are insoluble in bacterial expression; not direct evidence of human protein abundance.
  - reference: PMID:40018707
    reference_title: CFAP410 has a bimodular architecture with a conserved surface patch on its N-terminal leucine-rich repeat motif for binding interaction partners.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Our results showed that unlike the mutant L272P that completely lost its localization at the basal body and the posterior cell tip, none of the mutants in the NTD showed such a dramatic change in their localization pattern.
    explanation: Retains the weaker cellular-localization effect despite insolubility of recombinant N-terminal domains.
  notes: Non-animal experimental organism; the structural model alone does not prove partner-binding failure in human tissues.
- name: Chlamydomonas CFAP410 knockout
  experimental_model_type: OTHER
  description: Two CRISPR knockout lines were compared with wild-type algae for flagellation and flagellar length. The Results describe modest reductions, while the Discussion states that these changes were not significant.
  publication: PMID:40018707
  modeled_mechanisms:
  - target: Defective Primary Ciliogenesis
    relationship: FAILS_TO_RECAPITULATE
    limitations: Algal flagella are not human primary cilia. The study did not reproduce the marked ciliogenesis loss found in mammalian knockout cells; internal Results/Discussion wording differs.
    evidence:
    - &id002
      reference: PMID:40018707
      reference_title: CFAP410 has a bimodular architecture with a conserved surface patch on its N-terminal leucine-rich repeat motif for binding interaction partners.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Surprisingly, no significant changes in flagellar length or the percentage of flagellated cells were observed compared to wild-type cells.
      explanation: The Discussion reports no significant ciliation phenotype in two algal knockout lines; the Results describe modest numerical reductions. This limits extrapolation across organisms.
  evidence:
  - *id002
animal_models:
- name: nek1 zebrafish morpholino with human CFAP410 rescue
  species: Zebrafish
  description: Splice-blocking nek1 morpholinos cause ciliary developmental abnormalities and retinal defects; human CFAP410 RNA partly rescues the phenotype, with weaker rescue by p.Arg73Pro and little rescue by p.Leu224Pro.
  publication: PMID:26167768
  modeled_mechanisms:
  - target: Defective Primary Ciliogenesis
    relationship: PARTIALLY_RECAPITULATES
    limitations: Transient knockdown and cross-gene rescue; not a stable genetic model of axial SMD or proof of a human treatment.
  evidence:
  - reference: PMID:26167768
    reference_title: An siRNA-based functional genomics screen for the identification of regulators of ciliogenesis and ciliopathy genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Knockdown of nek1 also resulted in retinal defects including loss of photoreceptors (Suppl. Figure 7fd-g) and cilia length defects in the pronephros (Suppl. Figure 7h,i).
    explanation: Whole-embryo knockdown phenotype.
  - reference: PMID:26167768
    reference_title: An siRNA-based functional genomics screen for the identification of regulators of ciliogenesis and ciliopathy genes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: RNA expressing C21orf2 with the missense mutation p.Arg73Pro rescued the nek1 morphant phenotype less effectively than wild-type, whereas C21orf2-p.Leu224Pro had little effect (Figure 7e), confirming the predicted hypomorphic effect of both variants observed in vitro (Suppl. Figure 4).
    explanation: Relative rescue in a cross-gene embryonic assay; residual activity differs by allele.
- name: Mouse retinal CFAP410 reporter localization
  species: Mouse
  description: AAV-mediated reporter expression localizes CFAP410 to cone and rod connecting cilia.
  publication: PMID:26974433
  modeled_mechanisms:
  - target: Photoreceptor Connecting Cilium Dysfunction
    relationship: MEASURES
    limitations: Localization only; no disease-allele dysfunction or gene-therapy rescue was tested.
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: C21orf2 protein was localized to the connecting cilium of the cone and rod photoreceptors, confirming its significance in retinal function.
    explanation: Anatomical localization assay.
variants:
- name: CFAP410 c.218G>C (p.Arg73Pro)
  gene: *id003
  description: Homozygous in families F8 and F9; functional assays show residual ciliogenesis rescue and reduced NEK1 association. Skeletal expression is variable even in homozygotes.
  evidence:
  - &id004
    reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 12 mutant alleles were counted as five different mutations, including three exonic mutations (c.218G>C, c.319T>C and c.347C>T, S5 Fig; NM_004928), and two intronic mutations (c.545+1G>A and c.643-23A>T).
    explanation: Distinct CFAP410 alleles identified in the axial SMD families.
- name: CFAP410 c.319T>C (p.Tyr107His)
  gene: *id003
  description: In trans with p.Pro116Leu in the founding axial SMD family F5. The same genotype was later reported in a child without skeletal abnormalities; HEK293T assays show reduced protein stability.
  evidence:
  - *id004
- name: CFAP410 c.347C>T (p.Pro116Leu)
  gene: *id003
  description: In trans with p.Tyr107His in axial SMD family F5. The 2023 retinal study classifies this allele as likely pathogenic in its detailed assessment and demonstrates reduced stability in HEK293T cells.
  evidence:
  - *id004
- name: CFAP410 c.643-23A>T
  gene: *id003
  description: Intronic branch-point candidate in families F1 and F7. Patient RNA demonstrates retention of the entire intron 6, altering the reading frame and predicting an elongated p.Asn215ValfsTer259 product lacking the normal conserved C terminus. Protein abundance and production of the elongated product were not directly measured.
  evidence:
  - *id004
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Direct sequencing of the PCR product identified that entire intron 6 remained in the mutant mRNA, which led to a frame shift and produced an elongated protein (p.N215Vfs*259) without the C-terminal conserved region.
    explanation: Patient RNA confirms intron retention; the protein consequence follows from the transcript sequence.
- name: CFAP410 c.545+1G>A
  gene: *id003
  description: Canonical splice-donor variant in family F6. Patient RNA demonstrates cryptic donor use, a five-base deletion at the exon 5 end, and partial or complete intron 5 retention. The transcripts predict p.Ala181GlnfsTer6 or p.Ser183Ter; nonsense-mediated decay was predicted, not experimentally measured.
  evidence:
  - *id004
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequencing results showed that several cryptic donor sites in exon 5 and intron 5 were utilized in the mutant genome, and were responsible for the multiple bands in the RT-PCR (Fig 2C).
    explanation: Patient transcript analysis directly demonstrates aberrant splicing.
- name: NEK1 c.3107C>G (p.Ser1036Ter)
  gene: *id005
  description: One allele of the reported compound-heterozygous axial SMD genotype. Cellular assays show markedly reduced CFAP410 association; protein-level consequences should not be assumed identical to complete NEK1 knockout.
  evidence:
  - reference: PMID:28123176
    reference_title: Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By whole-exome sequencing in a patient with axial SMD, we identified compound heterozygous mutations of NEK1, c.3107C>G (p.S1036*) and c.3830A>C (p.D1277A), which co-segregated in the family.
    explanation: Both alleles co-segregated in the reported family.
- name: NEK1 c.3830A>C (p.Asp1277Ala)
  gene: *id005
  description: One allele of the reported compound-heterozygous axial SMD genotype. Cellular assays show markedly reduced CFAP410 association; protein-level consequences should not be assumed identical to complete NEK1 knockout.
  evidence:
  - reference: PMID:28123176
    reference_title: Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations.
    supports: SUPPORT

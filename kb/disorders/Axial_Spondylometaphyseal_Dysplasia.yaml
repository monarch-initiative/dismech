inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic variants in either CFAP410 or NEK1, by homozygosity or compound
    heterozygosity, with segregation confirmed in the reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26974433
    reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Axial spondylometaphyseal dysplasia (axial SMD) is an autosomal recessive disease characterized by dysplasia of axial skeleton and retinal dystrophy."
    explanation: "States the mode of inheritance and, in the same sentence, the two-tissue definition of the entity."
pathophysiology:
- name: Biallelic CFAP410 or NEK1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two loci, one complex. Five biallelic CFAP410 variants across six of nine
    originally studied families, and compound heterozygous NEK1 variants in a
    subsequent patient. The most severe skeletal and ophthalmic phenotypes track
    with variants in the conserved leucine-rich regions of CFAP410, which is the
    part that contacts NEK1.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:26974433
    reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a total of five biallelic C21orf2 mutations in six families out of nine: three missense and two splicing mutations in patients with various ethnic backgrounds."
    explanation: "The allelic series establishing CFAP410 as the first disease gene."
  - reference: PMID:28123176
    reference_title: "Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome sequencing in a patient with axial SMD, we identified compound heterozygous mutations of NEK1, c.3107C>G (p.S1036*) and c.3830A>C (p.D1277A), which co-segregated in the family."
    explanation: "The second locus, with family segregation."
  - reference: PMID:40246852
    reference_title: "Variants in CFAP410 cause a range of retinal and skeletal phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the most severe ophthalmic and skeletal phenotypes had disease-associated variants within conserved leucine-rich regions of CFAP410"
    explanation: >-
      Genotype-phenotype correlation locating severity in the domain that mediates
      the NEK1 interaction, which is why the next node is the complex rather than
      either protein alone.
  downstream:
  - target: Disruption of the CFAP410-NEK1 Complex
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37188479
      reference_title: "Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A C21ORF2 interaction domain \"CID\" at the C-terminus of NEK1 is necessary for its association with C21ORF2 in cells, and pathogenic mutations in this region disrupt the complex."
      explanation: >-
        Demonstrates that the disease-associated variants act by breaking the
        complex, which is the step this edge asserts.
- name: Disruption of the CFAP410-NEK1 Complex
  biological_scale: MOLECULAR
  description: >-
    Endogenous NEK1 and CFAP410 form a tight complex in human cells. CFAP410 is a
    256-residue leucine-rich protein whose repeat region binds the NEK1
    C-terminal interaction domain; NEK1 is a NIMA-related kinase. The complex is
    the functional unit, and it has two jobs that this disease separates: building
    the cilium, and repairing double-strand breaks.
  molecular_functions:
  - preferred_term: CFAP410 binding to the NEK1 C-terminal interaction domain
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0019901
      label: protein kinase binding
  evidence:
  - reference: PMID:37188479
    reference_title: "Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report that endogenous NEK1 and C21ORF2 form a tight complex in human cells."
    explanation: "Establishes that the complex exists at endogenous levels rather than only on overexpression."
  - reference: PMID:40246852
    reference_title: "Variants in CFAP410 cause a range of retinal and skeletal phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The protein encoded by CFAP410 is 256 residues long, rich in leucine residues, and involved in ciliogenesis and the maintenance of cilia in photoreceptor cells of the retina"
    explanation: "Describes the protein and the ciliary role this node loses."
  downstream:
  - target: Defective Primary Ciliogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37188479
      reference_title: "Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that NEK1 mutations that inhibit kinase activity or weaken its association with C21ORF2 severely compromise ciliogenesis, and that C21ORF2, like NEK1 is required for homologous recombination."
      explanation: >-
        Weakening the association compromises ciliogenesis, which is exactly the
        causal step this edge claims.
  - target: Impaired Homologous Recombination Repair
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37188479
      reference_title: "Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that NEK1 mutations that inhibit kinase activity or weaken its association with C21ORF2 severely compromise ciliogenesis, and that C21ORF2, like NEK1 is required for homologous recombination."
      explanation: >-
        The same sentence carries the second, parallel requirement. Both edges are
        cited to it because it states both.
- name: Defective Primary Ciliogenesis
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  description: >-
    Loss of the complex compromises assembly and maintenance of the primary
    cilium. CFAP410 sits with the basal body and ciliopathy-associated protein
    modules, and an unbiased whole-genome ciliogenesis screen placed it there
    independently of any disease hypothesis.
  cellular_components:
  - preferred_term: photoreceptor connecting cilium
    term:
      id: GO:0032391
      label: photoreceptor connecting cilium
  biological_processes:
  - preferred_term: primary cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  evidence:
  - reference: PMID:26167768
    reference_title: "An siRNA-based functional genomics screen for the identification of regulators of ciliogenesis and ciliopathy genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical approaches place C21orf2 within key ciliopathy-associated protein modules, offering an explanation for the skeletal and retinal involvement observed in individuals with C21orf2 variants."
    explanation: >-
      An unbiased genome-wide screen, not a candidate-gene experiment, placing the
      protein in the ciliary machinery and connecting that to the two affected tissues.
  - reference: PMID:26974433
    reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study indicates that axial SMD is a member of a unique group of ciliopathy affecting skeleton and retina."
    explanation: "The classification of the disease as a ciliopathy by the group that identified its first gene."
  downstream:
  - target: Photoreceptor Connecting Cilium Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26294103
      reference_title: "C21orf2 is mutated in recessive early-onset retinal dystrophy with macular staphyloma and encodes a protein that localises to the photoreceptor primary cilium."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Immunohistochemical studies in human, pig and mouse retinas localised C21orf2 protein to the ciliary structures of the photoreceptor cell (the daughter basal body, the centriole adjacent to the basal body, and the connecting cilium)."
      explanation: >-
        Localizes the protein to exactly the structure this edge says fails,
        in three species including human.
  - target: Growth Plate Chondrocyte Differentiation Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The chondrocyte arm is the weaker of the two. Functional data in chondrocytes
      implicate CFAP410 in cartilage differentiation, but the intervening ciliary
      signalling step has not been assayed in this disease.
    evidence:
    - reference: PMID:26974433
      reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional data in chondrocyte suggest C21orf2 is implicated in cartilage differentiation."
      explanation: >-
        The only chondrocyte-level functional evidence in the disease literature.
        The authors' own hedge ("suggest") is why this edge is marked as indirect with unknown intermediates.
- name: Impaired Homologous Recombination Repair
  biological_scale: MOLECULAR
  description: >-
    The second job of the complex. CFAP410 is required for homologous
    recombination, and CFAP410 depletion reduces repair efficiency. Whether this
    arm contributes to the skeletal or retinal lesion in axial SMD, or is simply
    another consequence of the same complex being broken, is not established -
    see the knowledge gap below.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: DECREASED
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  evidence:
  - reference: PMID:37188479
    reference_title: "Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The NEK1 kinase controls ciliogenesis, mitosis, and DNA repair, and NEK1 mutations cause human diseases including axial spondylometaphyseal dysplasia and amyotrophic lateral sclerosis."
    explanation: >-
      Establishes DNA repair as one of the complex's functions and names this
      disease among its consequences.
- name: Photoreceptor Connecting Cilium Dysfunction
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Photoreceptor Connecting Cilium Degeneration"
  description: >-
    The photoreceptor outer segment is a modified cilium and everything it needs
    passes through the connecting cilium. CFAP410 localizes there, in cones and
    rods, and pathogenic variants reduce protein stability and mislocalize it.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    modifier: DECREASED
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
  evidence:
  - reference: PMID:26974433
    reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "C21orf2 protein was localized to the connecting cilium of the cone and rod photoreceptors, confirming its significance in retinal function."
    explanation: "Places the protein in both photoreceptor classes, which is consistent with the mixed cone-rod phenotype."
  - reference: PMID:39232248
    reference_title: "Expanding the genotypic and phenotypic spectra with a novel variant in the ciliopathy gene, CFAP410, associated with selective cone degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pathogenic CFAP410 variants reduce protein stability, impair cytoplasmic localisation and result in dysfunction of rod and cone photoreceptors"
    explanation: "States the molecular consequence of the variants on the protein and on photoreceptor function."
  downstream:
  - target: Progressive Photoreceptor Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26294103
      reference_title: "C21orf2 is mutated in recessive early-onset retinal dystrophy with macular staphyloma and encodes a protein that localises to the photoreceptor primary cilium."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This retinal dystrophy phenotype is caused by recessive mutations in C21orf2 and can be considered a retinal ciliopathy as C21orf2 encodes a protein that localises to photoreceptor ciliary structures."
      explanation: >-
        Draws the causal line from the ciliary localization to the human retinal
        dystrophy, which is what this edge asserts.
- name: Progressive Photoreceptor Degeneration
  biological_scale: TISSUE
  description: >-
    The retinal phenotype is progressive, unlike the skeletal one. A cone-rod
    pattern is about twice as common as a rod-cone pattern in the largest
    CFAP410 series, which is worth knowing because the original 1997 description
    recorded retinitis pigmentosa - a rod-cone pattern - and the balance in the
    gene-defined cohort runs the other way.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  evidence:
  - reference: PMID:40246852
    reference_title: "Variants in CFAP410 cause a range of retinal and skeletal phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A cone-rod dystrophy pattern was observed roughly two times more commonly than rod-cone dystrophy."
    explanation: "Quantifies the mix of degeneration patterns in 49 genotyped patients."
  downstream:
  - target: Retinal dystrophy
    causal_link_type: DIRECT
- name: Growth Plate Chondrocyte Differentiation Failure
  biological_scale: CELLULAR
  description: >-
    Disturbed chondrocyte differentiation in the growth plates that build the
    vertebrae, ribs, ilia and proximal femora. Why those sites and not the whole
    skeleton is unexplained; the distribution is what makes the dysplasia
    "axial".
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endochondral bone growth
    modifier: DECREASED
    term:
      id: GO:0003416
      label: endochondral bone growth
  evidence:
  - reference: PMID:26974433

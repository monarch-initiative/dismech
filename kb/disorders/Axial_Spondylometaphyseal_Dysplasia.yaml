genetic:
- name: CFAP410
  gene_term: &id003
    preferred_term: CFAP410
    term:
      id: hgnc:1260
      label: CFAP410
  association: Causative
  relationship_type: CAUSATIVE
  notes: Formerly C21orf2 or LRRC76; 21q22.3. The 2016 axial SMD study identified five distinct alleles (three missense and two splice-altering) in nine patients from six of nine families. The same gene causes a broader spectrum including isolated retinal dystrophy and Jeune-like skeletal ciliopathy. In the ophthalmically ascertained 2025 series, 11/49 patients had skeletal abnormalities, which were broader than a uniform axial SMD diagnosis; five patients lacked a documented skeletal examination. This is not penetrance of axial SMD among all biallelic carriers.
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conducted whole exome sequencing and identified C21orf2 (chromosome 21 open reading frame 2) as a disease gene for axial SMD.
    explanation: The gene-disease assignment.
  - reference: PMID:40246852
    reference_title: Variants in CFAP410 cause a range of retinal and skeletal phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A minority of patients (22.4%) presented with skeletal abnormalities consistent with axial spondylometaphyseal dysplasia (SMDAX).
    explanation: The abstract labels 11/49 as consistent with axial SMD; the full text and Supplementary Table 2 document heterogeneous skeletal findings and incomplete skeletal assessment. This ascertainment-dependent proportion is not population penetrance.
- name: NEK1
  gene_term: &id005
    preferred_term: NEK1
    term:
      id: hgnc:7744
      label: NEK1
  association: Causative
  relationship_type: CAUSATIVE
  notes: A patient with axial SMD carried compound heterozygous NEK1 c.3107C>G (p.Ser1036Ter) and c.3830A>C (p.Asp1277Ala). NEK1 is a CFAP410-associated protein and also causes other skeletal ciliopathies. Both variants reduce CFAP410 association in cellular assays. The unresolved CFAP410-negative patients in the earlier 2016 study preceded discovery of NEK1 as the second locus and do not by themselves establish a third disease gene.
  evidence:
  - reference: PMID:28123176
    reference_title: Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this study, we identified NEK1 as the second disease gene for axial SMD.
    explanation: The gene-disease assignment for the second locus.
  - reference: PMID:28123176
    reference_title: Axial spondylometaphyseal dysplasia is also caused by NEK1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: NEK1 mutations have previously been found in three types of short rib thoracic dystrophy, which have no retinal dystrophy.
    explanation: The differential within the NEK1 disorders, and the reason retinal involvement is diagnostically load-bearing here.
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Analysis of patients without C21orf2 mutation indicated genetic heterogeneity of axial SMD.
    explanation: The CFAP410-negative families supported genetic heterogeneity in 2016, before NEK1 was identified; they do not prove that testing both currently known genes leaves these same cases unexplained.

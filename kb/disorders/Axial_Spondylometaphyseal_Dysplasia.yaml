    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: C21orf2 mutations presented with a wide range of skeletal phenotypes, including cupped and flared anterior ends of ribs, lacy ilia and metaphyseal dysplasia of proximal femora.
    explanation: The skeletal phenotype in the genotyped cohort.
  downstream:

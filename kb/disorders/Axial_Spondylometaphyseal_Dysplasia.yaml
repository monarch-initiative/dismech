- name: Altered Chondrocyte Marker Expression
  biological_scale: CELLULAR
  description: CFAP410 knockdown in OUMS-27 human chondrosarcoma cells reduces expression of chondrocyte marker genes, suggesting a role in maintaining the differentiated chondrocyte phenotype. In a separate mouse ATDC5 differentiation time course, Cfap410 transcript abundance decreased while cartilage markers increased. Neither experiment establishes failure of growth-plate differentiation in patients or identifies the intervening ciliary signal.
  evidence:
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Knock-down of C21orf2 caused significant decreases in expression of chondrocyte marker genes (Fig 5).
    explanation: Perturbation in OUMS-27 cells supports altered maintenance of cartilage-marker expression, not a direct growth-plate histopathology finding.
  - reference: PMID:26974433
    reference_title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: While the expression of cartilage marker genes (Col2a1, Agc1 and Col10a1) was increased by the cartilage induction, 1810043G02Rik expression was continuously suppressed during cartilage differentiation (Fig 4).
    explanation: The ATDC5 time course is an expression association, not a loss-of-function differentiation experiment.
  downstream:
  - target: Axial Metaphyseal and Vertebral Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The link from altered marker expression in cultured cells to axial skeletal abnormalities in patients remains inferred.
- name: Axial Metaphyseal and Vertebral Dysplasia
  biological_scale: TISSUE
  description: The characteristic radiographic distribution includes ribs, vertebrae, iliac wings and proximal femora, with variable involvement of other bones. Femoral-neck shortening and coxa vara can progress with age; a uniformly static adult course has not been established.
  evidence:

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional data in chondrocyte suggest C21orf2 is implicated in cartilage differentiation."
    explanation: "The chondrocyte-level functional result behind this node."
  downstream:
  - target: Axial Metaphyseal and Vertebral Dysplasia
    causal_link_type: DIRECT
- name: Axial Metaphyseal and Vertebral Dysplasia
  biological_scale: TISSUE
  description: >-
    The radiographic signature, and the reason the disease is recognizable: mild
    platyspondyly, cupped and flared anterior rib ends, irregular proximal femoral
    metaphyses, and lacy iliac wings. Unlike the retinal lesion this is largely
    static once growth is complete.
  evidence:
  - reference: PMID:26974433
    reference_title: "Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C21orf2 mutations presented with a wide range of skeletal phenotypes, including cupped and flared anterior ends of ribs, lacy ilia and metaphyseal dysplasia of proximal femora."
    explanation: "The skeletal phenotype in the genotyped cohort."
  downstream:
  - target: Thoracic Constriction and Restrictive Ventilation
    causal_link_type: DIRECT
  - target: Metaphyseal dysplasia
    causal_link_type: DIRECT
  - target: Platyspondyly
    causal_link_type: DIRECT
- name: Thoracic Constriction and Restrictive Ventilation
  biological_scale: ORGANISM
  description: >-
    The small thorax with cupped anterior rib ends limits chest wall excursion.
    This is the mechanism by which a skeletal dysplasia becomes a respiratory
    illness, and it is the same constraint that the ciliopathy module's skeletal
    node describes - minus the polydactyly that node also carries.
  evidence:
  - reference: PMID:9266195
    reference_title: "Axial spondylometaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a previously undescribed skeletal dysplasia characterized by mild platyspondyly, small thorax with cupping of the anterior ends of the ribs, irregular proximal femoral metaphyses, and lacy appearance of the iliac wings."
    explanation: >-
      The original description, which names the small thorax as a defining
      feature. It reports the anatomy, not the ventilatory consequence.

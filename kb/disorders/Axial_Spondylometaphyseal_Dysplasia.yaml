- name: Thoracic Constriction and Restrictive Ventilation
  biological_scale: ORGANISM
  description: A narrow thorax and short ribs can restrict lung expansion and contribute to neonatal respiratory problems. The clinical reports infer this mechanical relationship; they do not provide formal pulmonary-function measurements establishing restrictive physiology in every patient.
  evidence:
  - reference: PMID:9266195
    reference_title: Axial spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We present a previously undescribed skeletal dysplasia characterized by mild platyspondyly, small thorax with cupping of the anterior ends of the ribs, irregular proximal femoral metaphyses, and lacy appearance of the iliac wings.
    explanation: The original description, which names the small thorax as a defining feature. It reports the anatomy, not the ventilatory consequence.
  - reference: PMID:21910225
    reference_title: 'Axial spondylometaphyseal dysplasia: additional reports.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The main clinical findings are postnatal growth failure, rhizomelic short stature in early childhood evolving into short trunk in late childhood, and thoracic hypoplasia that may cause mild to moderate respiratory problems in the neonatal period and later susceptibility to airway infection.
    explanation: 'The ventilatory consequence the 1997 description did not supply: thoracic hypoplasia causing neonatal respiratory problems and later airway infection, in seven patients from five families.'
  downstream:
  - target: Neonatal respiratory distress
    causal_link_type: DIRECT
  - target: Recurrent respiratory infections
    causal_link_type: DIRECT
  - target: Thoracic hypoplasia
    causal_link_type: DIRECT

name: Axial Spondylometaphyseal Dysplasia
creation_date: "2026-09-11T12:45:00Z"
category: Mendelian
synonyms:
- axial SMD
- SMDAX
- spondylometaphyseal dysplasia, axial
- spondylometaphyseal dysplasia with cone-rod dystrophy
description: >-
  Axial spondylometaphyseal dysplasia is a recessive ciliopathy that hits two
  tissues and spares the rest. The skeletal half is confined to the axial
  skeleton and the proximal limbs: mild platyspondyly, a small thorax with cupped
  and flared anterior rib ends, irregular proximal femoral metaphyses, and a lacy
  appearance of the iliac wings. The retinal half is a progressive photoreceptor
  dystrophy that usually begins in early childhood. The pairing is what defines
  the entity; it was described as a new type of spondylometaphyseal dysplasia in
  1997 on exactly those grounds.

  Both disease genes encode partners in the same complex. CFAP410 (formerly
  C21orf2) binds through its leucine-rich repeat to an interaction domain at the
  C-terminus of the NEK1 kinase, and that complex is required both for
  ciliogenesis and for homologous-recombination repair. Biallelic variants in
  either partner produce the disease, and pathogenic variants in the interface
  are the ones that disrupt the complex - which is why a gene-level account of
  this disease is less informative than a complex-level one.

  Two things are worth flagging before reading the pathograph. The link from
  ciliary dysfunction to the specific skeletal lesion is **inferred from
  ciliopathy biology rather than demonstrated in this disease**; no Hedgehog or
  other ciliary signalling readout has been measured in axial SMD chondrocytes,
  and the entry marks that gap rather than papering over it. And the same two
  genes cause a spread of other phenotypes - isolated retinal dystrophy without
  any skeletal involvement, Jeune syndrome, and amyotrophic lateral sclerosis for
  both NEK1 and CFAP410 - so the genotype does not predict this entity.

  Two pathophysiology nodes declare conforms_to against
  kb/modules/ciliopathy_dysfunction. The module's skeletal node
  (`#Skeletal Dysplasia with Polydactyly and Thoracic Constriction`) is
  deliberately NOT claimed: thoracic constriction fits, polydactyly is absent
  here, and conforming would assert a limb phenotype this disease does not have.

- name: Region-Specific Anal Canal Adenocarcinoma Subtype Context
  description: >-
    A molecular cohort separated primary anal canal adenocarcinoma into two
    region-specific entities that differ in HPV status, immune contexture,
    checkpoint expression, and mutation profile. This node records subtype
    context and association rather than asserting a causal sequence between
    those features.

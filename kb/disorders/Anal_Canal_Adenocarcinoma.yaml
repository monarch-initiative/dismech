  description: >-
    Persistent perianal abscess and anal fistula create a chronic inflammatory
    epithelial-tract context implicated in fistula-associated mucinous
    adenocarcinoma. The available evidence is case-level and does not establish
    how long inflammation must persist before epithelial change occurs.

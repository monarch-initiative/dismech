- name: Lateral Plate Mesoderm Nodal Cascade Mispatterning
  description: >-
    The left-sided Nodal, Lefty2 and Pitx2 cascade in the lateral plate
    mesoderm is either not activated (Pkd1l1 rks point mutant) or activated on

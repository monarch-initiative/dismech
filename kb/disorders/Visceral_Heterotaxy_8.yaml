  - reference: PMID:21307098
    reference_title: >-
      Pkd1l1 complexes with Pkd2 on motile cilia and functions to establish the
      left-right axis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that Pkd1l1 and Pkd2 form a complex that functions
      as the nodal flow sensor in the motile cilia of the medaka KV.
    explanation: >-
      Independent medaka evidence that Pkd1l1-Pkd2 acts as the organizer flow
      sensor.
  - reference: PMID:37413993
    reference_title: >-
      Nodal flow transfers polycystin to determine mouse left-right asymmetry.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As PKD1L1 N-term is predominantly associated with Nodal on the left margin
      and that PKD1L1/PKD2 overexpression significantly augments cellular Nodal
      sensitivity, we propose that leftward transfer of polycystin-containing
      fibrous strands determines left-right asymmetry in developing embryos.
    explanation: >-
      Live imaging of tagged PKD1L1 in mouse embryos shows flow-directed
      leftward transfer of PKD1L1 to the left node margin.
  - reference: PMID:20080492
    reference_title: >-
      Situs inversus in Dpcd/Poll-/-, Nme7-/- , and Pkd1l1-/- mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, the absence of respiratory tract lesions, hydrocephalus, and
      male infertility in Pkd1l1(-/-) mice (for: polycystic kidney disease 1
      like 1) suggested that dysfunction of motile cilia was not involved in the
      development of SI in this line.
    explanation: >-
      Pkd1l1-null mice lack the motile-cilia disease features, separating this
      mechanism from primary ciliary dyskinesia.
  downstream:
  - target: Loss of Right-Biased Cerl2 Expression at the Node Crown
    description: >-
      Flow sensing through PKD1L1 normally biases Cerl2 (Dand5) expression to

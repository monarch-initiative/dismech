mechanistic_hypotheses:
- hypothesis_group_id: pkd1l1_biliary_cilia
  hypothesis_label: PKD1L1 loss causes biliary atresia through cholangiocyte cilia dysfunction
  status: EMERGING
  description: >-
    Beyond its role at the left-right organizer, PKD1L1 is expressed in bile
    duct epithelium, and Pkd1l1-deficient mice show reduced cholangiocyte
    primary cilia, decreased Hedgehog pathway gene expression and fibrotic
    extrahepatic bile duct remodeling. This would explain why PKD1L1 variants
    are found in biliary atresia splenic malformation syndrome, which combines
    laterality defects with biliary atresia.
  notes: >-
    EMERGING because the mouse ducts remain patent without an added biliary
    injury, and the human data are rare biallelic and heterozygous variants in
    a BASM cohort, described there as a candidate gene. None of the heterotaxy
    families carrying the alleles discussed above was reported with biliary
    atresia.
  evidence:
  - reference: PMID:38460793
    reference_title: >-
      Pkd1l1-deficiency drives biliary atresia through ciliary dysfunction in
      biliary epithelial cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pkd1l1 loss causes both laterality defects and fibro-proliferative EHBD
      transformation through disrupted ciliary signaling, phenocopying
      syndromic biliary atresia.
    explanation: >-
      The mouse study on which the hypothesis principally rests.
  - reference: PMID:30664273
    reference_title: >-
      Identification of Polycystic Kidney Disease 1 Like 1 Gene Variants in
      Children With Biliary Atresia Splenic Malformation Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five BASM subjects harbored rare and potentially deleterious biallelic
      variants in polycystic kidney disease 1 like 1 (PKD1L1), a gene
      associated with ciliary calcium signaling and embryonic laterality
      determination in fish, mice, and humans.
    explanation: >-
      Human genetic association of PKD1L1 variants with the BASM presentation.

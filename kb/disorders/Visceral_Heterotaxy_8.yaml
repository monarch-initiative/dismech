- name: Loss of Right-Biased Cerl2 Expression at the Node Crown
  description: >-
    In normal embryos flow represses the Nodal antagonist Cerl2 (Dand5) on the
    left side of the node crown, so Nodal activity there becomes left-biased.
    In Pkd1l1-null embryos Cerl2 expression remains symmetrical. Epistasis
    places Pkd1l1 as an upstream genetic repressor of Pkd2 in this step.

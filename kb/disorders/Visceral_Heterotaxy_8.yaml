pathophysiology:
- name: PKD1L1 Loss of Function
  description: >-
    Biallelic PKD1L1 variants remove or disable the protein. The recurrent
    intron 42 splice-donor deletion abolishes the canonical donor site, nonsense
    alleles truncate the protein before the transmembrane and PKD2-binding
    regions, and the p.Cys1691Ser missense change is predicted to destabilize
    the GPS motif needed for protein maturation. In cultured cells PKD1L1 is
    sufficient to support a calcium signaling response to fluid flow, and
    destabilizing its extracellular PKD domain abolishes that response.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PKD1L1
    term:
      id: hgnc:18053
      label: PKD1L1
  molecular_functions:
  - preferred_term: calcium channel activity (as a PKD2 channel partner)
    modifier: DECREASED
    term:
      id: GO:0005262
      label: calcium channel activity
  evidence:
  - reference: PMID:27616478
    reference_title: >-
      Bi-allelic Mutations in PKD1L1 Are Associated with Laterality Defects in
      Humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES identified a homozygous splicing mutation, c.6473+2_6473+3delTG, which
      disrupts the invariant splice donor site in intron 42, in both affected
      individuals.
    explanation: >-
      A canonical splice-site deletion predicted to abolish normal PKD1L1
      splicing segregates with disease.
  - reference: PMID:27616478
    reference_title: >-
      Bi-allelic Mutations in PKD1L1 Are Associated with Laterality Defects in
      Humans.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The p.Cys1691Ser substitution affects a highly conserved cysteine residue
      and is predicted by molecular modeling to disrupt a disulfide bridge
      essential for the proper folding of the G protein-coupled receptor
      proteolytic site (GPS) motif.
    explanation: >-
      Structural modeling predicts that the disease missense variant
      destabilizes the GPS motif.
  - reference: PMID:35691949
    reference_title: >-
      A novel nonsense PKD1L1 variant cause heterotaxy syndrome with congenital
      asplenia in a Han Chinese patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This homozygous variant caused the domain of PKD1L1 complete absence.
    explanation: >-
      A homozygous nonsense allele removes the downstream PKD1L1 domains.
  - reference: PMID:27272319
    reference_title: >-
      Genetic Analysis Reveals a Hierarchy of Interactions between
      Polycystin-Encoding Genes and Genes Controlling Cilia Function during
      Left-Right Determination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      using a system in which cultured cells are supplied artificial flow, we
      demonstrate that PKD1L1 is sufficient to mediate a Ca2+ signaling response
      after flow stimulation.
    explanation: >-
      Establishes the flow-induced calcium signaling activity that PKD1L1 loss
      removes.
  - reference: PMID:27272319
    reference_title: >-
      Genetic Analysis Reveals a Hierarchy of Interactions between
      Polycystin-Encoding Genes and Genes Controlling Cilia Function during
      Left-Right Determination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, we show that an extracellular PKD domain within PKD1L1 is crucial
      for PKD1L1 function; as such, destabilizing the domain causes L-R defects
      in the mouse.
    explanation: >-
      A single destabilizing change in an extracellular domain is enough to
      abolish PKD1L1 function and cause laterality defects.
  downstream:
  - target: Failure of Nodal Flow Sensing at the Left-Right Organizer
    description: >-
      Without PKD1L1, the PKD1L1-PKD2 complex in organizer cilia cannot form or
      signal, so the leftward flow is not converted into a left-sided signal.
    evidence:
    - reference: PMID:21307093
      reference_title: >-
        Pkd1l1 establishes left-right asymmetry and physically interacts with

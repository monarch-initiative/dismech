discussions:
- discussion_id: pkd1l1_allele_specific_nodal_outcome
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Lateral Plate Mesoderm Nodal Cascade Mispatterning
  prompt: >-
    Do human PKD1L1 alleles abolish left-sided Nodal (as the mouse rks point
    mutant does) or make it bilateral (as the mouse null does), and does this
    explain why some patients have isomerism with heterotaxy and others situs
    inversus totalis?
  rationale: >-
    Two mouse alleles of the same gene give opposite lateral plate Nodal
    outcomes, right versus left lung isomerism, and different survival. Human
    patients range from situs inversus totalis without heart disease to
    lethal heterotaxy, and siblings with the same genotype differ, but no human
    allele has been tested for which mouse outcome it resembles. Until that is
    known, the edge from flow-sensing failure to a particular situs outcome is
    an inference from mouse.
  status: OPEN
  evidence:
  - reference: PMID:27272319
    reference_title: >-
      Genetic Analysis Reveals a Hierarchy of Interactions between
      Polycystin-Encoding Genes and Genes Controlling Cilia Function during
      Left-Right Determination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, the Pkd1l1tm1 allele has a strikingly different impact on
      both survival and L-R patterning compared to the Pkd1l1rks point mutation.
    explanation: >-
      Two Pkd1l1 alleles give distinct laterality outcomes in mice.
  - reference: PMID:42630107
    reference_title: >-
      Genetics in Heterotaxy: A Case Series and Literature Review on DNAH9,
      PKD1L1, MMP21, and GDF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed that while PKD1L1 mutations are often severe, familial cases
      like FR-02 and FR-03 show that identical genotypes can result in
      strikingly different cardiac severities.
    explanation: >-
      In humans, the same PKD1L1 genotype gives different severity within a
      family.
  - reference: PMID:31026592
    reference_title: >-
      Compound heterozygous Pkd1l1 variants in a family with two fetuses
      affected by heterotaxy and complex Chd.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Features of CHD and other anomalies vary between and within families.
    explanation: >-
      Cardiac and other features vary within PKD1L1 families.
notes: >-
  Curated as a standalone entry rather than a subtype of Visceral_Heterotaxy,
  following Visceral_Heterotaxy_7 and Visceral_Heterotaxy_9: HTX8 has its own
  MONDO term and OMIM number (617205), a single causal gene, and a distinct
  mechanism (loss of a ciliary flow sensor with intact cilia motility) that the
  genetically heterogeneous umbrella entry does not describe. No module in
  kb/modules fits: ciliopathy_dysfunction covers motile cilia beat failure and
  primary cilium signaling disorders, not organizer flow sensing, so no
  conforms_to is declared. A family with PKD1L1-related situs inversus and
  sideroblastic anemia (PMID:30791085) is not curated as a phenotype, because
  only one family is reported and no quotable abstract text was retrieved on
  the fetch made. Heterozygous PKD1L1 variants of uncertain significance
  reported in laterality and BASM cohorts are not treated as disease-causing.
  Variable expressivity is recorded in the inheritance description and the
  discussion rather than as an inheritance term, because HP:0003828 is outside
  the InheritanceTerm enum.
  No GeneReviews chapter covers PKD1L1-related heterotaxy (check-genereviews
  --online returns NO_CHAPTER).

name: Visceral Heterotaxy 8
creation_date: "2026-10-20T23:34:44Z"
category: Mendelian
disease_term:
  preferred_term: heterotaxy, visceral, 8, autosomal
  term:
    id: MONDO:0014967
    label: heterotaxy, visceral, 8, autosomal
synonyms:
- HTX8
- PKD1L1 visceral heterotaxy
- visceral heterotaxy caused by mutation in PKD1L1
- PKD1L1-related heterotaxy
description: >-
  Visceral heterotaxy 8 (HTX8) is an autosomal recessive laterality disorder
  caused by biallelic loss-of-function variants in PKD1L1, which encodes
  polycystin-1-like 1, an eleven-pass transmembrane polycystin-1 family protein
  that partners with the cation channel PKD2 in cilia of the embryonic
  left-right organizer. PKD1L1 is not needed to build or move the organizer
  cilia: in mutant mice node and cilia morphology and cilia motility are normal
  and leftward nodal flow is generated. It is needed to interpret that flow, so
  that the right-biased expression of the Nodal antagonist CERL2 (DAND5) at the
  node and the left-sided Nodal, Lefty2 and Pitx2 cascade in the lateral plate
  mesoderm fail to arise. Affected individuals have situs inversus totalis or
  situs ambiguus (heterotaxy), usually with complex congenital heart disease
  such as unbalanced atrioventricular septal defects, double-outlet right
  ventricle, transposition of the great arteries, pulmonary atresia or stenosis
  and single-ventricle physiology, together with splenic anomalies (polysplenia
  or asplenia), right-sided stomach, midline or left-sided liver and intestinal
  malrotation. Several affected pregnancies have shown nonimmune hydrops, and
  PKD1L1 variants have also been reported in biliary atresia splenic
  malformation syndrome. There is no airway or sperm motility disease, because
  motile cilia are intact. Severity varies within families carrying the same
  genotype.
parents:
- Visceral heterotaxy
- Congenital Disorder

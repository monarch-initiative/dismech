genetic:
- name: PKD1L1
  gene_term:
    preferred_term: PKD1L1
    term:
      id: hgnc:18053
      label: PKD1L1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    PKD1L1 (7p12.3) encodes a 2,849-residue polycystin-1 family protein with two
    extracellular Ig-like PKD domains, a REJ domain, a GPS autoproteolysis
    motif, eleven transmembrane segments, a PLAT domain and a C-terminal
    coiled-coil that binds PKD2. Reported pathogenic alleles include a recurrent
    canonical splice-donor deletion in intron 42 (c.6473+2_6473+3delTG, found
    homozygous and in trans with other alleles), nonsense variants (for example
    p.Gln463* and p.Glu427*), and a homozygous missense change (p.Cys1691Ser)
    predicted to break a disulfide bond in the GPS motif. The truncating and
    splice alleles and the mouse null phenotype indicate loss of function.
  evidence:
  - reference: PMID:27616478
    reference_title: >-
      Bi-allelic Mutations in PKD1L1 Are Associated with Laterality Defects in
      Humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Via whole-exome sequencing (WES), we identified homozygous mutations in
      PKD1L1 from three affected individuals in two unrelated families.
    explanation: >-
      The gene-discovery report establishing biallelic PKD1L1 variants as a
      cause of human laterality defects.
  - reference: PMID:35691949
    reference_title: >-
      A novel nonsense PKD1L1 variant cause heterotaxy syndrome with congenital
      asplenia in a Han Chinese patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel nonsense variant in PKD1L1(c.1387 C > T; p.463Gln*)
      in a Chinese patient with heterotaxy syndrome and congenital asplenia.
    explanation: >-
      An independent homozygous truncating PKD1L1 allele in a heterotaxy
      patient from a cohort of 110 laterality cases.
  - reference: PMID:42630107
    reference_title: >-
      Genetics in Heterotaxy: A Case Series and Literature Review on DNAH9,
      PKD1L1, MMP21, and GDF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both siblings, the molecular analysis identified the recurrent
      c.6473+2_6473+3del variant in trans with a nonsense variant, c.1279G>T
      (p.Glu427*).
    explanation: >-
      Shows the recurrent splice allele in trans with a nonsense allele in a

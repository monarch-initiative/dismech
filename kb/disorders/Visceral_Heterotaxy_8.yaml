animal_models:
- name: Pkd1l1 rks ENU point mutant mouse
  species: Mouse
  genotype: Pkd1l1 rks (p.Asp411Gly in a PKD domain) homozygous
  publication: PMID:21307093
  description: >-
    A recessive ENU line with a missense change in a PKD domain of Pkd1l1 shows
    right pulmonary isomerism, randomized heart and stomach situs, outflow
    tract defects, oedema and death by 15.5 dpc, with normal node and cilia
    motility and absent left-sided lateral plate gene expression.
  evidence:
  - reference: PMID:21307093
    reference_title: >-
      Pkd1l1 establishes left-right asymmetry and physically interacts with
      Pkd2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report the identification of a point mutation in the mouse
      Pkd1l1 locus named rks that results in right pulmonary isomerism, cardiac
      outflow defects, overt oedema and lethality by 15.5 dpc.
    explanation: >-
      Establishes the rks line and its phenotype.
  modeled_mechanisms:
  - target: Failure of Nodal Flow Sensing at the Left-Right Organizer
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Laterality fails although the node and its motile cilia are normal,
      isolating the flow-sensing step.
    limitations: >-
      A single missense allele on one genetic background; it gives almost
      exclusively right isomerism with absent Nodal, whereas the null allele
      gives bilateral Nodal, so allele effects differ.
    evidence:
    - reference: PMID:21307093
      reference_title: >-
        Pkd1l1 establishes left-right asymmetry and physically interacts with
        Pkd2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Node and cilia morphology were normal in mutants and cilia demonstrated
        typical motility, consistent with Pkd1l1 and Pkd2 activity downstream of
        nodal flow.
      explanation: >-
        Shows the model informs the flow-sensing node.
  - target: Cardiac Laterality and Outflow Tract Malformation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Mutant embryos develop double-outlet right ventricle and transposition.
    limitations: >-
      Embryonic lethality by 15.5 dpc prevents study of later cardiac
      remodeling and survival.
    evidence:
    - reference: PMID:21307093
      reference_title: >-
        Pkd1l1 establishes left-right asymmetry and physically interacts with
        Pkd2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        revealing a significant incidence of apparent double outlet right
        ventricle (DORV) and transposition of the great arteries (TGA)
      explanation: >-
        Outflow tract defects in the model.
- name: Pkd1l1 tm1 targeted null mouse
  species: Mouse
  genotype: Pkd1l1 tm1Lex homozygous
  publication: PMID:27272319
  description: >-
    A targeted, likely null, Pkd1l1 allele with reduced viability; survivors
    have normal or reversed situs without respiratory, hydrocephalus or
    fertility phenotypes, and embryos show bilateral Nodal activity, mostly
    left lung isomerism and loss of node Cerl2 asymmetry.
  evidence:
  - reference: PMID:27272319
    reference_title: >-
      Genetic Analysis Reveals a Hierarchy of Interactions between
      Polycystin-Encoding Genes and Genes Controlling Cilia Function during
      Left-Right Determination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surviving mutants either exhibited normal (57%) or reversed (43%) situs
      based on stomach position in neonates
    explanation: >-
      Randomized situs in surviving null mice.
  modeled_mechanisms:
  - target: Loss of Right-Biased Cerl2 Expression at the Node Crown
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Null embryos lose node-crown Cerl2 asymmetry and activate Nodal
      bilaterally.
    limitations: >-
      The human left-right organizer has not been studied directly, so the
      link from this mouse readout to particular human alleles is inferred.
    evidence:
    - reference: PMID:27272319
      reference_title: >-
        Genetic Analysis Reveals a Hierarchy of Interactions between
        Polycystin-Encoding Genes and Genes Controlling Cilia Function during
        Left-Right Determination.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast, Cerl2 asymmetry failed to manifest in Pkd1l1tm1/tm1
        mutants, which instead exhibited a symmetrical pattern of Cerl2
        expression
      explanation: >-
        Direct readout of the Cerl2 node in the null model.
- name: Medaka abecobe (pkd1l1) mutant
  species: Medaka
  genotype: pkd1l1 abecobe (abc) homozygous
  publication: PMID:21307098
  description: >-
    The medaka laterality mutant abecobe carries a pkd1l1 mutation; its
    Kupffer's vesicle generates normal flow but asymmetric southpaw, lefty and
    charon expression fails.
  evidence:
  - reference: PMID:21307098
    reference_title: >-
      Pkd1l1 complexes with Pkd2 on motile cilia and functions to establish the
      left-right axis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we show that the medaka left-right mutant abecobe (abc) is defective for
      left-right asymmetric expression of southpaw, lefty and charon, but not
      for nodal flow
    explanation: >-
      Establishes the medaka pkd1l1 model and its flow-sensing defect.
  modeled_mechanisms:
  - target: Lateral Plate Mesoderm Nodal Cascade Mispatterning
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Asymmetric Nodal-family expression is lost despite normal flow.
    limitations: >-
      In medaka the Kupffer's vesicle cilia that carry Pkd1l1 are motile,
      whereas in mouse the flow-sensing cilia are thought to be the immotile
      cilia of crown cells, so the cellular site of sensing may differ between
      species.
    evidence:
    - reference: PMID:21307098
      reference_title: >-
        Pkd1l1 complexes with Pkd2 on motile cilia and functions to establish
        the left-right axis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results suggest that Pkd1l1 and Pkd2 form a complex that functions
        as the nodal flow sensor in the motile cilia of the medaka KV.
      explanation: >-
        Supports the model's relevance to organizer flow sensing.

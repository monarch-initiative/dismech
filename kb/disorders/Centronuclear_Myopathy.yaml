      than obligate in SPEG-related CNM.
- name: CCDC78-CNM
  display_name: CCDC78-related myopathy with internal nuclei
  description: >-
    Dominant CCDC78-associated myopathy spans early-onset distal weakness with internal nuclei and atypical cores
    in the original family and a milder adult myalgia/cramp phenotype with sarcoplasmic-reticulum abnormalities
    in a second family. Allele- and isoform-dependent effects remain incompletely defined.
  genes:
  - preferred_term: CCDC78
    term:
      id: hgnc:14153
      label: CCDC78
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22818856
    reference_title: Dominant mutation of CCDC78 in a unique congenital myopathy with prominent internal nuclei and atypical cores.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A splice-acceptor variant in previously uncharacterized CCDC78 was detected in affected individuals and absent
      in unaffected family members and > 10,000 controls. This variant alters RNA-transcript processing and results
      in a 222 bp in-frame insertion.
    explanation: >-
      Segregation and transcript evidence from the original dominant family support the CCDC78 association.
  - reference: PMID:39273074
    reference_title: "CCDC78: Unveiling the Function of a Novel Gene Associated with Hereditary Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Here, we analyze for the first time a family harboring a CCDC78 nonsense mutation to better understand the
      role of CCDC78 in muscle.
    explanation: >-
      A second family extends the association. The full text describes an adult with myalgia, cramps, calf hypertrophy
      and mild central nucleation, without measured strength deficit; his daughter had calf hypertrophy. This is
      a small family-level evidence base, not a penetrance estimate.
  subtype_term:
    preferred_term: CCDC78-related myopathy with internal nuclei
    term:
      id: MONDO:0013890
      label: congenital myopathy with internal nuclei and atypical cores

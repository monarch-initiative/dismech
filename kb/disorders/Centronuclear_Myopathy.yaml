- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    MTM1-related XLMTM is X-linked. A mother carrying an MTM1 pathogenic variant has a 50% chance of transmitting
    it in each pregnancy. Hemizygous sons are affected; heterozygous daughters may be asymptomatic or manifest weakness.
    Some simplex cases arise de novo, and maternal germline mosaicism means that a negative maternal blood test
    does not eliminate recurrence risk.
  evidence:
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If the mother is a carrier, each sib has a 50% chance of inheriting the MTM1 pathogenic variant.
    explanation: >-
      The transmission risk applies to offspring of a carrier mother, not to all families with an affected child.
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Thus, about 10%-20% of males who represent simplex cases have a de novo pathogenic variant in MTM1 and a mother
      who is not a carrier. Germline mosaicism has been reported.
    explanation: >-
      Explains sporadic presentations and why maternal carrier assessment matters.
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Female carriers of X-MTM are generally asymptomatic, although manifesting heterozygotes are increasingly being
      identified.
    explanation: >-
      Female heterozygosity does not guarantee absence of manifestations.

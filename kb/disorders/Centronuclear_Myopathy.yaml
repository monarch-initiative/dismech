name: Centronuclear Myopathy
creation_date: "2026-06-16T00:00:00Z"
category: Mendelian
description: >-
  Centronuclear myopathy (CNM) is a genetically heterogeneous group of congenital myopathies characterized by excessive
  central or internal skeletal-muscle nuclei, often with fiber hypotrophy and type 1 predominance. Major forms involve
  MTM1, DNM2 and BIN1; additional genetic forms or overlapping congenital-myopathy phenotypes involve RYR1, TTN,
  SPEG, CCDC78, MAP3K20 and CACNA1S. Membrane remodeling and excitation-contraction coupling are recurrent mechanisms,
  while titin-related sarcomeric dysfunction and MAP3K20 signaling provide distinct routes. These mechanisms are
  not established uniformly across all genotypes. Severity ranges from neonatal respiratory failure in classic X-linked
  myotubular myopathy to childhood- or adult-onset weakness; symptomatic females occur in MTM1-related disease and
  BIN1 disease can be dominant or recessive.
disease_term:
  preferred_term: centronuclear myopathy
  term:
    id: MONDO:0018947
    label: centronuclear myopathy
parents:
- Congenital myopathy
has_subtypes:
- name: XLMTM
  display_name: X-linked myotubular myopathy (MTM1)
  subtype_term:
    preferred_term: X-linked myotubular myopathy
    term:
      id: MONDO:0010683
      label: X-linked myotubular myopathy
  description: >-
    X-linked myotubular myopathy is caused by hemizygous loss-of-function mutations in MTM1 encoding myotubularin,
    a phosphoinositide 3-phosphatase. It is the most severe and best-characterized form, with ~80% of affected males
    presenting with severe (classic) neonatal weakness, hypotonia, and respiratory failure. Symptomatic heterozygous
    females can have severe childhood weakness or milder, often asymmetric adult-onset disease.
  evidence:
  - reference: PMID:20301605
    reference_title: "X-Linked Myotubular Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 80% of affected males present with severe (classic) X-MTM
      characterized by polyhydramnios, decreased fetal movement, and neonatal
      weakness, hypotonia, and respiratory failure.
    explanation: >-
      GeneReviews establishes the severe neonatal MTM1 presentation as the
      dominant XLMTM phenotype.
  - reference: PMID:8640223
    reference_title: "A gene mutated in X-linked myotubular myopathy defines a new putative tyrosine phosphatase family conserved in yeast."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked recessive myotubular myopathy (MTM1) is characterized by severe
      hypotonia and generalized muscle weakness, with impaired maturation of
      muscle fibres.
    explanation: >-
      The MTM1 gene-discovery paper defines the X-linked myotubular myopathy
      clinical entity.
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In affected females, symptoms range from severe, generalized weakness presenting in childhood, with infantile
      onset similar to affected male patients, to mild (often asymmetric) weakness manifesting in adulthood.
    explanation: >-
      Captures the female spectrum within MTM1-related disease without labeling female carriers uniformly unaffected.
  genes:
  - preferred_term: MTM1
    term:
      id: hgnc:7448
      label: MTM1
- name: DNM2-CNM
  display_name: DNM2-related centronuclear myopathy
  description: >-
    Heterozygous DNM2 missense variants cause autosomal dominant centronuclear myopathy. Onset and severity vary
    from severe congenital disease to slowly progressive childhood- or adult-onset weakness. DNM2 encodes dynamin
    2, a membrane-remodeling GTPase. MONDO:0008048 includes OMIM:160150 (DNM2/CNM1) and OMIM:614408 (CNM3), has
    an exact MYF6-associated synonym, and is defined by dominant inheritance rather than a DNM2 restriction. It
    is therefore not used as an exact identity for this gene-specific subtype.
  evidence:
  - reference: PMID:16227997
    reference_title: "Mutations in dynamin 2 cause dominant centronuclear myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant centronuclear myopathy is a rare congenital myopathy
      characterized by delayed motor milestones and muscular weakness.
    explanation: >-
      The DNM2 gene-discovery paper defines the autosomal dominant CNM clinical
      entity and its causal gene.
  genes:
  - preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
- name: BIN1-CNM
  display_name: BIN1-related centronuclear myopathy
  description: >-
    BIN1-related CNM includes recessive and dominant forms with different variant mechanisms. Biallelic variants
    were first described in congenital or childhood-onset CNM. Heterozygous amphipathic-helix and stop-loss variants
    can cause progressive dominant CNM, often presenting in adulthood; childhood-onset myalgia, exercise intolerance
    and mild proximal weakness have also been reported. MONDO:0009709 (OMIM:255200) has a BIN1-specific definition
    but is classified under autosomal recessive centronuclear myopathy. This subtype deliberately includes both
    dominant and recessive BIN1 disease, so the narrower inheritance classification is not asserted as its exact
    identity.
  evidence:
  - reference: PMID:17676042
    reference_title: "Mutations in amphiphysin 2 (BIN1) disrupt interaction with dynamin 2 and cause autosomal recessive centronuclear myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified homozygous mutations in amphiphysin 2 (BIN1) in three
      families with autosomal recessive inheritance.
    explanation: >-
      The BIN1 gene-discovery paper defines the autosomal recessive CNM form and
      its causal gene.
  - reference: PMID:25260562
    reference_title: Adult-onset autosomal dominant centronuclear myopathy due to BIN1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our data provide the evidence that specific BIN1 mutations can cause either recessive or dominant centronuclear
      myopathy and that both disorders involve different pathomechanisms.
    explanation: >-
      The primary dominant-BIN1 report expands inheritance beyond recessive CNM; it does not imply that every BIN1
      variant acts dominantly.
  - reference: PMID:29103045
    reference_title: Dominant Centronuclear Myopathy with Early Childhood Onset due to a Novel Mutation in BIN1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The main features were mild proximal weakness with pronounced myalgia, exercise intolerance and large muscle
      mass, with a childhood onset in the youngest generation and mild cognitive features.
    explanation: >-
      A dominant BIN1 family demonstrates that adult onset is not obligatory.

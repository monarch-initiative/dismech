diagnosis:
- name: Molecular confirmation of XLMTM
  description: >-
    Confirm suspected MTM1-related myotubular myopathy by molecular genetic testing in the clinical context. A hemizygous
    pathogenic MTM1 variant establishes the diagnosis in an affected male. The broader CNM phenotype warrants testing
    of other causal genes when MTM1 findings do not explain the presentation.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of X-MTM is established in a proband with suggestive clinical findings and identification of
      a hemizygous pathogenic variant in MTM1 by molecular genetic testing.
    explanation: >-
      GeneReviews specifies molecular confirmation of the MTM1 subtype.
  - reference: PMID:23975875
    reference_title: "Recessive truncating titin gene, TTN, mutations presenting as centronuclear myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This study expands the phenotypic spectrum associated with TTN mutations and indicates that TTN mutation analysis
      should be considered in cases of possible CNM without mutations in the classic CNM genes.
    explanation: >-
      The TTN series supports extending genetic evaluation beyond the classic CNM genes when unresolved.
- name: Muscle biopsy with histopathology
  description: >-
    Muscle biopsy identifies the centronuclear pattern: central or internal myonuclei, fiber hypotrophy and often
    type 1 predominance. These findings support a CNM diagnosis but do not by themselves establish the causal gene.
    Interpret morphology alongside the clinical phenotype and genetic results.
  diagnosis_term:
    preferred_term: Muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:28624463
    reference_title: Insights from genotype-phenotype correlations by novel SPEG mutations causing centronuclear myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Centronuclear myopathies (CNM) are a clinically and genetically heterogeneous group of congenital myopathies,
      defined histologically by increased number of fibres with centrally located nuclei, and type I fibre predominance
      in muscle biopsy.
    explanation: >-
      The clinical report defines the histologic pattern across genetically heterogeneous CNM.
- name: Assessment of neuromuscular transmission when function declines
  description: >-
    Unexpected loss of motor skills in XLMTM warrants evaluation for an additional neuromuscular-junction component.
    Electrophysiology can identify impaired transmission; a myasthenic presentation does not exclude centronuclear
    myopathy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1432/
    reference_title: X-Linked Myotubular Myopathy - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Children with X-MTM and an unexpected decline in motor skills should be evaluated for a potential abnormality
      in neuromuscular junction (NMJ) function.
    explanation: >-
      GeneReviews gives a clinical trigger for additional evaluation.
  - reference: PMID:21440438
    reference_title: Impaired neuromuscular transmission and response to acetylcholinesterase inhibitors in centronuclear myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Muscle biopsy should be considered in infants suspected to have CMS, especially if treatment response is incomplete,
      or no CMS gene mutation is identified.
    explanation: >-
      The clinical series describes overlap with congenital myasthenic syndromes and the role of muscle histology
      in unresolved presentations.
progression:
- subtype: XLMTM
  notes: >-
    A prospective 45-male survivor cohort documented loss of previously acquired milestones in some individuals,
    including mildly affected males. MFM32 motor scores declined modestly over one year, whereas several respiratory
    and strength measures were stable. Slow progression should not be equated with rapid deterioration in every
    patient.
  evidence:
  - reference: PMID:30902907
    reference_title: "X-linked myotubular myopathy: A prospective international natural history study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Standardized pulmonary function test, motor function test other than MFM32, and upper limb strength test scores
      remained stable over 1 year, confirming the very slow progression of the disease.
    explanation: >-
      The full text places progression in context rather than treating the disorder as uniformly static or rapidly
      progressive.
animal_models:
- name: Mtm1-null mouse
  species: Mouse
  genotype: Mtm1-/y
  publication: PMID:19846786
  description: Myotubularin-deficient male mice model severe XLMTM muscle disease, including triad disorganization and reduced depolarization-evoked calcium release. Hepatic manifestations differ from the zebrafish model.
  modeled_mechanisms:
  - target: Disrupted triad organization and T-tubule remodeling
    relationship: RECAPITULATES
    description: Reduced triad number and abnormal longitudinal T-tubules in myotubularin-deficient muscle.
    evidence:
    - reference: PMID:19846786
      reference_title: T-tubule disorganization and defective excitation-contraction coupling in muscle fibers lacking myotubularin lipid phosphatase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Using a mouse model of the disease, we report that Mtm1-deficient muscle fibers have a decreased number
        of triads and abnormal longitudinally oriented T-tubules.
      explanation: >-
        The Mtm1-null mouse provides direct experimental evidence for triad disorganization; transfer of the complete
        causal sequence to human disease remains an inference.
  - target: Impaired excitation-contraction coupling
    relationship: RECAPITULATES
    description: Voltage-evoked SR calcium release is reduced while calcium removal and store content remain essentially intact.
    evidence:
    - reference: PMID:19846786
      reference_title: T-tubule disorganization and defective excitation-contraction coupling in muscle fibers lacking myotubularin lipid phosphatase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        In addition, SR Ca(2+) release elicited by voltage-clamp depolarizations is strongly depressed in myotubularin-deficient
        muscle fibers, with myoplasmic Ca(2+) removal and SR Ca(2+) content essentially unaffected.
      explanation: >-
        Voltage-clamp measurements identify impaired release in Mtm1-null mouse muscle without inferring depletion
        of calcium stores.
  - target: Impaired canalicular bile transport
    relationship: FAILS_TO_RECAPITULATE
    limitations: A separate Mtm1-/y organ-comparison study found no liver functional or morphological defect. The mouse therefore does not reproduce the overt cholestatic liver phenotype; this does not establish that every individual transporter process is normal.
    evidence:
    - reference: DOI:10.1007/s00018-024-05512-9
      reference_title: Potential compensatory mechanisms preserving cardiac function in myotubular myopathy
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Our findings revealed no defects in liver function or morphology.
      explanation: The organ-comparison study found preserved hepatic function and morphology in Mtm1-deficient mice, limiting extrapolation from the zebrafish liver phenotype.
- name: Dnm2 R369W heterozygous knock-in mouse
  species: Mouse
  genotype: Dnm2R369W/+
  publication: PMID:37547294
  description: An allele-specific model of moderate DNM2-CNM with increased muscle DNM2 abundance, reduced force, muscle and fiber hypotrophy, and progressive organelle mispositioning. DNM2 lowering improves histopathology and hypotrophy.
  modeled_mechanisms:
  - target: DNM2 dynamin-2 dysfunction
    relationship: PARTIALLY_RECAPITULATES
    description: Models the R369W-associated abundance and muscle phenotype.
    limitations: The raised DNM2 abundance is allele-specific and is not asserted for all DNM2-CNM variants.
    evidence:
    - reference: PMID:37547294
      reference_title: DNM2 levels normalization improves muscle phenotypes of a novel mouse model for moderate centronuclear myopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Dnm2R369W/+ mice presented with increased DNM2 protein level in muscle and moderate CNM-like phenotypes with force deficit, muscle and fiber hypotrophy, impaired mTOR signaling, and progressive mitochondria and nuclei mis-position with age.
      explanation: Defines the observed phenotype of this knock-in model.
  - target: Disrupted triad organization and T-tubule remodeling
    relationship: PARTIALLY_RECAPITULATES
    limitations: Normal and abnormal triads coexist; this is not uniform loss of triads.
    evidence:
    - reference: PMID:37547294
      reference_title: DNM2 levels normalization improves muscle phenotypes of a novel mouse model for moderate centronuclear myopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        The electron microscopy also revealed a combination of triads with normal aspect and others with shape defects
        in the Dnm2R369W/+ muscles, as enlargement of the T-tubule
      explanation: >-
        The primary R369W model shows mixed normal and abnormal triads, rather than uniform destruction of the coupling
        apparatus.
- name: mtm1 loss-of-function zebrafish liver model
  species: Zebrafish
  genotype: mtm1 loss-of-function mutant
  publication: DOI:10.1172/JCI166275
  description: Larval mtm1-mutant zebrafish exhibit cholestatic liver abnormalities, mislocalized Rab11 and reduced canalicular transporter proteins. Hepatocyte-restricted Mtm1 expression provides partial rescue.
  modeled_mechanisms:
  - target: Hepatocyte recycling-endosome trafficking defect
    relationship: PARTIALLY_RECAPITULATES

  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: DOI:10.1172/JCI166275
    reference_title: Loss of Mtm1 causes cholestatic liver disease in a model of X-linked myotubular myopathy
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      by 7 dpf, both Mdr1 and Bsep protein expression levels were nearly absent in the mtm fish, suggesting a nearly
      complete loss of transporter expression
    explanation: >-
      Reduced transporter protein is measured in larval zebrafish; it is not a demonstrated reduction of transporter
      transcription.
  notes: >-
    In Figure 7, normal bile-flux readout occurred in 30% of mutant fish without the transgene and 65% with it,
    with one-sided Fisher P=0.0532. This is partial improvement and does not meet a conventional 0.05 significance
    threshold. Liver steatosis and bile-duct dilation were not rescued. Mammalian Mtm1-deficient models do not consistently
    reproduce the hepatic phenotype.
  downstream:
  - target: Intrahepatic cholestasis
    description: >-
      Impaired canalicular bile export provides a provisional model-derived explanation for cholestasis; the full

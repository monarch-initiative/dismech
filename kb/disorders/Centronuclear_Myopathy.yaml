- name: RYR1-CNM
  display_name: RYR1-related centronuclear myopathy
  description: >-
    RYR1 mutations, encoding the skeletal muscle ryanodine receptor / calcium
    release channel, can produce a centronuclear myopathy phenotype, expanding the
    histological spectrum of RYR1-related congenital myopathy to include central
    nuclei. RyR1 directly regulates excitation-contraction coupling.
  evidence:
  - reference: PMID:20839240
    reference_title: RYR1 mutations are a common cause of congenital myopathies with central nuclei.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We sequenced the entire RYR1 coding sequence in 24 patients with a diagnosis of CNM from South Africa (n =
      14) and Europe (n = 10) and identified mutations in 17 patients. The most common genotypes featured compound
      heterozygosity for RYR1 missense mutations and mutations resulting in reduced protein expression, including
      intronic splice site and frameshift mutations.
    explanation: >-
      Direct RYR1-CNM cohort evidence; the selected cohort and South African founder effects preclude interpreting
      17/24 as a general population case fraction.
  genes:
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
- name: TTN-CNM
  display_name: TTN-related centronuclear myopathy
  description: >-
    Biallelic truncating TTN variants were identified in a CNM cohort without MTM1, DNM2 or BIN1 variants. Titin
    forms the sarcomeric backbone, so this genotype provides a sarcomeric route to a centronuclear histologic phenotype,
    distinct from the membrane-remodeling mechanisms of several classic CNM genes.

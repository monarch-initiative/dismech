    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Based on these results, we reviewed the clinical history of five patients with two different DNM2-CNM mutations
      (S619L and E368K) and found electrophysiological evidence of abnormal neuromuscular transmission in two of
      the individuals.
    explanation: >-
      The primary paper reports electrophysiologic confirmation in two, not all five, individuals.

  description: Altered actin, microtubule and intermediate-filament organization can impair myonuclear positioning. BIN1-dependent N-WASP interactions and abnormal desmin organization provide candidate routes in CNM, with genotype-specific evidence. The relation between central nuclear position and muscle weakness remains unresolved.

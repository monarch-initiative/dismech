- name: DNM2 dynamin-2 dysfunction
  description: >-
    CNM-associated DNM2 missense variants alter the membrane-remodeling GTPase dynamin 2. Functional studies support
    increased GTPase activity and stabilized oligomers for tested variants. Increased protein abundance is additionally
    reported for particular alleles, including R369W, and must be distinguished from intrinsic enzymatic gain of
    function. Endocytosis findings depend on allele and experimental system; a uniform increase or decrease in endocytosis
    is not established.
  gene:
    preferred_term: DNM2
    description: >
      Dynamin 2, a membrane-remodeling GTPase; gain-of-function missense variants
      cause autosomal dominant centronuclear myopathy.
    term:
      id: hgnc:2974
      label: DNM2
  cell_types:

- name: Impaired canalicular bile transport
  description: >-
    Mtm1-deficient zebrafish have disrupted canalicular architecture, reduced Mdr1/Bsep protein localization and
    impaired bile flux. Hepatocyte-restricted Mtm1 reexpression restores localization and partially improves the
    flux readout. These findings support a liver-autonomous component in the model, while the corresponding human
    mechanism and susceptibility to AAV-associated injury remain unresolved.
  subtypes:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We identified two homozygous frameshift mutations and a homozygous nonsense mutation in the mitogen-activated
      protein triple kinase ZAK. In total, six affected patients carry these mutations.
    explanation: >-
      Three families establish a recessive MAP3K20/ZAK congenital myopathy with type 1 predominance and central

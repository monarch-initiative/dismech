    reference_title: >-
      SPEG interacts with myotubularin, and its deficiency causes centronuclear
      myopathy with dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing, we identified three unrelated CNM-affected
      probands, including two with documented dilated cardiomyopathy, carrying
      homozygous or compound-heterozygous SPEG mutations.
    explanation: >-
      The gene-discovery study establishing biallelic SPEG variants as a cause of
      centronuclear myopathy and linking the form to dilated cardiomyopathy.
  - reference: PMID:28624463
    reference_title: >-
      Insights from genotype-phenotype correlations by novel SPEG mutations
      causing centronuclear myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical phenotype was distinctive in the two patients since patient 2
      developed a dilated cardiomyopathy with milder myopathy features, while
      patient 1 showed only myopathic features without cardiac involvement.
    explanation: >-
      An independent series showing that cardiac involvement is variable rather
      than obligate in SPEG-related CNM.

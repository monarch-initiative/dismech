pathophysiology:
- name: MTM1 myotubularin phosphatase deficiency
  description: >-
    Loss-of-function MTM1 variants reduce myotubularin phosphoinositide phosphatase activity. Myotubularin dephosphorylates
    PI3P and PI(3,5)P2, lipids involved in membrane organization and trafficking. Skeletal-muscle triad defects
    are well studied; a separate hepatocyte trafficking pathway is supported by zebrafish experiments and remains
    provisional for human liver disease.
  gene:
    preferred_term: MTM1
    description: >
      Myotubularin, a phosphoinositide phosphatase whose loss of function causes
      X-linked myotubular myopathy.
    term:
      id: hgnc:7448
      label: MTM1
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: Phosphatidylinositol dephosphorylation
    modifier: DECREASED
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
  evidence:
  - reference: PMID:19846786
    reference_title: T-tubule disorganization and defective excitation-contraction coupling in muscle fibers lacking myotubularin lipid phosphatase.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Myotubularin is a ubiquitously expressed phosphoinositide (PI) 3-phosphatase that acts on both phosphatidylinositol
      3-phosphate ... and 3,5-bisphosphate ... in vitro and in vivo
    explanation: >-
      The full text defines the actual lipid substrates; the 1996 sequence-motif observation alone did not establish
      this substrate specificity.
  downstream:
  - target: Disrupted triad organization and T-tubule remodeling
    description: >-
      Loss of myotubularin disrupts triad organization in Mtm1-null muscle; the intervening lipid-dependent steps
      are not fully resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19846786
      reference_title: T-tubule disorganization and defective excitation-contraction coupling in muscle fibers lacking myotubularin lipid phosphatase.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Using a mouse model of the disease, we report that Mtm1-deficient muscle fibers have a decreased number
        of triads and abnormal longitudinally oriented T-tubules.
      explanation: >-
        The Mtm1-null mouse provides direct experimental evidence for triad disorganization; transfer of the complete
        causal sequence to human disease remains an inference.
  - target: Hepatocyte recycling-endosome trafficking defect
    description: >-
      Loss of Mtm1 alters Rab11-associated canalicular transporter trafficking in zebrafish hepatocytes. Human pathway
      assignment remains provisional.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20839240
    reference_title: RYR1 mutations are a common cause of congenital myopathies with central nuclei.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We sequenced the entire RYR1 coding sequence in 24 patients with a diagnosis of CNM from South Africa (n =
      14) and Europe (n = 10) and identified mutations in 17 patients. The most common genotypes featured compound
      heterozygosity for RYR1 missense mutations and mutations resulting in reduced protein expression, including
      intronic splice site and frameshift mutations.
    explanation: >-
      Direct RYR1-CNM cohort evidence; the selected cohort and South African founder effects preclude interpreting
      17/24 as a general population case fraction.
  relationship_type: CAUSATIVE
- name: SPEG biallelic loss-of-function variants
  association: Causative
  relationship_type: CAUSATIVE
  subtype: SPEG-CNM
  gene_term:
    preferred_term: SPEG
    description: >
      SPEG encodes striated muscle preferentially expressed protein kinase, an
      MTM1-interacting protein of the triad. Homozygous or compound-heterozygous
      loss-of-function variants cause centronuclear myopathy 5 (MONDO:0014418),
      which may be accompanied by dilated cardiomyopathy because SPEG is also
      expressed in cardiac muscle.

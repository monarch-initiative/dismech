        the SR that is expected to lead to a reduced Ca2+-troponin occupancy and thus to depressed contraction and
        force development.
      explanation: >-
        The authors distinguish measured calcium-release impairment from its expected contractile consequence in
        the mouse model.
- name: Muscle contractile dysfunction
  description: >-

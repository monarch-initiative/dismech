- name: CACNA1S-CNM
  display_name: CACNA1S-related congenital myopathy with internal nuclei
  description: >-
    Dominant or recessive CACNA1S variants cause a congenital myopathy with perinatal hypotonia, severe axial and
    generalized weakness and sometimes ophthalmoplegia. Internal nuclei occur within a broader biopsy spectrum of
    sarcoplasmic-reticulum dilation and myofibrillar disorganization. This overlapping phenotype is not equivalent
    to every CACNA1S-related disorder.

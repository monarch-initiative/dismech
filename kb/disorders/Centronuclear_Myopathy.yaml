- name: SPEG deficiency and impaired triad maturation
  description: >
    Biallelic loss-of-function SPEG variants remove or markedly reduce striated
    muscle preferentially expressed protein kinase. SPEG was identified as an
    MTM1-interacting protein and localises in alignment with the terminal
    cisternae of the sarcoplasmic reticulum, placing it at the triad alongside
    myotubularin; its loss reproduces the centronuclear histology in mouse
    muscle. SPEG is also present in cardiac muscle, where the gene-discovery
    report says it plays a critical role, and two of the three original probands
    had a documented dilated cardiomyopathy.

  description: >-
    In mtm1-mutant zebrafish, Rab11 loses its normal pericanalicular distribution and forms dispersed cytoplasmic
    aggregates. Mdr1 and Bsep canalicular protein abundance is reduced despite the absence of reduced transporter
    transcripts. This supports a trafficking or stability defect; the intervening molecular steps have not been
    completely resolved.

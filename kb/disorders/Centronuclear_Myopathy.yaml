    reference_title: >-
      Recessive truncating titin gene, TTN, mutations presenting as centronuclear
      myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive compound heterozygous truncating mutations of the titin
      gene, TTN, were identified in 5 individuals.
    explanation: >-
      The exome study that establishes biallelic truncating TTN variants as a

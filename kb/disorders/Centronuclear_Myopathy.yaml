  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:28012042
    reference_title: "Dihydropyridine receptor (DHPR, CACNA1S) congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Exome sequencing revealed ten recessive or dominant mutations in CACNA1S (Cav1.1), the pore-forming subunit

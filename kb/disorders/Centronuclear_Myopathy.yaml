  evidence:
  - reference: PMID:28012042
    reference_title: "Dihydropyridine receptor (DHPR, CACNA1S) congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Exome sequencing revealed ten recessive or dominant mutations in CACNA1S (Cav1.1), the pore-forming subunit
      of DHPR in skeletal muscle.
    explanation: >-
      The congenital-myopathy series identifies both inheritance patterns; the biopsy spectrum includes internal
      nuclei but is broader than classic CNM.
prevalence:
- population: Male births (X-linked myotubular myopathy)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.0
  rate_denominator: LIVE_BIRTHS
  notes: >-
    XLMTM, the most severe CNM form, is a rare, life-threatening congenital
    disease. The 2 per 100,000 male births figure is the estimate given in the
    Orphanet review cited below, which in its body attributes it to unpublished
    observations of molecularly confirmed cases in France; it is quoted here as
    that source's estimate rather than as a measured population rate. No
    epidemiological figure is available for the non-XLMTM centronuclear
    myopathy forms in the sources cited in this entry.
  evidence:
  - reference: PMID:18817572
    reference_title: "Centronuclear (myotubular) myopathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The incidence of X-linked myotubular myopathy is estimated at 2/100000
      male births but epidemiological data for other forms are not currently
      available.
    explanation: >-
      Source of the XLMTM incidence estimate, and of the statement that the
      other centronuclear myopathy forms have no epidemiological data.
  - reference: PMID:38715109
    reference_title: "A healthcare claims analysis to identify and characterize patients with suspected X-Linked Myotubular Myopathy (XLMTM) in the Brazilian Healthcare System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked myotubular myopathy (XLMTM) is a rare, life-threatening
      congenital disease
    explanation: >-
      Characterizes XLMTM as a rare, life-threatening congenital disease in a
      population claims study.
treatments:
- name: Supportive and multidisciplinary care
  description: >
    Treatment of CNM is primarily supportive. Management optimally involves a team
    of specialists in long-term neuromuscular care (pulmonology, neurology, physical
    therapy/rehabilitation, clinical genetics), and frequently requires
    tracheostomy, gastrostomy feeding, and assistive devices in severe XLMTM.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301605
    reference_title: "X-Linked Myotubular Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Treatment is supportive.
    explanation: >-
      GeneReviews establishes supportive care as the mainstay of XLMTM management.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1432/
    reference_title: X-Linked Myotubular Myopathy - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Such teams often include a pulmonologist, neurologist, physical therapist and/or rehabilitation medicine specialist,
      and clinical geneticist.
    explanation: >-
      Names the components of the recommended neuromuscular care team.
- name: Assisted ventilation
  description: >
    Respiratory support including assisted/mechanical ventilation is central to
    management of severe XLMTM, where most affected boys require ventilatory
    assistance.
  treatment_term:
    preferred_term: Mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  evidence:
  - reference: PMID:20301605
    reference_title: "X-Linked Myotubular Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory failure is nearly uniform, with most individuals requiring
      24-hour ventilatory assistance.
    explanation: >-
      GeneReviews documents the central role of ventilatory support in XLMTM.
  therapeutic_modality: DEVICE
- name: MTM1 gene replacement therapy (resamirigene bilparvovec)
  description: >
    AAV8-mediated MTM1 gene replacement therapy (resamirigene bilparvovec, AT132)
    was investigated in the ASPIRO trial for XLMTM; a substantial proportion of
    dosed boys achieved ventilator independence, though dosing was stopped due to
    serious safety events including hepatobiliary toxicity and fatalities.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
    therapeutic_agent:
    - preferred_term: resamirigene bilparvovec
      term:
        id: NCIT:C177083
        label: Resamirigene Bilparvovec
  evidence:
  - reference: PMID:39285418
    reference_title: "An algorithm for discontinuing mechanical ventilation in boys with x-linked myotubular myopathy after positive response to gene therapy: the ASPIRO experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      16 of 24 dosed participants achieved ventilator independence between 14 and
      97 weeks after dosing
    explanation: >-
      Reports ventilator independence in 16 of 24 dosed trial participants; this selected-cohort outcome must be
      interpreted alongside the fatal hepatic safety events.
  - reference: PMID:39285418
    reference_title: "An algorithm for discontinuing mechanical ventilation in boys with x-linked myotubular myopathy after positive response to gene therapy: the ASPIRO experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The resamirigene bilparvovec program has been paused to investigate the deaths of four participants who experienced
      severe cholestatic liver failure after receiving the investigational gene therapy in ASPIRO
    explanation: >-
      The full text supplies the safety finding omitted from the existing efficacy-only evidence. Dosing cessation
      and long-term follow-up are distinct from recruitment status.
  target_mechanisms:
  - target: MTM1 myotubularin phosphatase deficiency
    treatment_effect: MODULATES
    description: Intended delivery of functional MTM1 to address myotubularin deficiency. This records the molecular target, not established clinical benefit or resolution of the liver-safety risk.
- name: Genetic counseling and family testing
  description: >-
    Offer family-specific genetic counseling, maternal and at-risk relative testing for MTM1-related disease, and
    discussion of reproductive options. Prenatal testing is possible when the familial MTM1 variant is known. Recurrence
    counseling must account for de novo variants and germline mosaicism.
  evidence:
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Carrier testing of at-risk female relatives and prenatal testing for a pregnancy at risk are possible if the
      MTM1 pathogenic variant has been identified in an affected male relative.
    explanation: >-
      Supports family testing and reproductive counseling in XLMTM.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Enteral nutrition
  description: >-
    Provide individualized nutritional support for XLMTM with inadequate oral feeding; gastrostomy tube feeding
    is often required.
  evidence:
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tracheostomy, G-tube feeding, and assistive communication devices are often required.
    explanation: >-
      GeneReviews identifies concrete supportive interventions in XLMTM.
  therapeutic_modality: DEVICE
- name: Pulmonary and sleep surveillance
  description: >-
    GeneReviews recommends annual pulmonary assessment and polysomnography every one to three years for XLMTM, with
    clinical evaluation tailored to symptoms and ventilatory needs.
  evidence:
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surveillance: Annual pulmonary assessment; polysomnography every one to three years; routine examination for
      scoliosis; annual ophthalmologic examinations to evaluate for ophthalmoplegia, ptosis, and myopia; routine
      assessment for dental malocclusion.
    explanation: >-
      Supports the pulmonary and sleep surveillance schedule.
- name: Orthopedic, ophthalmologic and dental surveillance
  description: >-
    Monitor individuals with XLMTM for scoliosis and dental malocclusion, and obtain annual ophthalmologic examinations
    for ophthalmoplegia, ptosis and myopia.
  evidence:
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surveillance: Annual pulmonary assessment; polysomnography every one to three years; routine examination for
      scoliosis; annual ophthalmologic examinations to evaluate for ophthalmoplegia, ptosis, and myopia; routine
      assessment for dental malocclusion.
    explanation: >-
      Supports surveillance for extrapulmonary complications.
- name: Anesthetic precautions in XLMTM
  description: >-
    Avoid succinylcholine for anesthesia in MTM1-related XLMTM. The GeneReviews chapter distinguishes this precaution
    from malignant-hyperthermia susceptibility; the RYR1-related myopathy risk must be assessed separately by genotype.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1432/
    reference_title: X-Linked Myotubular Myopathy - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is generally agreed that neuromuscular paralytics such as succinylcholine should be avoided as part of
      anesthesia for patients with X-MTM.
    explanation: >-
      The full chapter gives a specific agent-to-avoid recommendation for the MTM1 subtype.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1432/
    reference_title: X-Linked Myotubular Myopathy - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, it is important to note that individuals with X-MTM are NOT susceptible to malignant hyperthermia
    explanation: >-
      GeneReviews explicitly distinguishes MTM1-related XLMTM from malignant-hyperthermia-susceptible myopathies.
- name: Hepatic surveillance and cholestasis management
  description: >-
    Evaluate XLMTM-associated liver disease with transaminases, GGT, total and direct bilirubin, serum bile acids
    and abdominal ultrasonography. The clinical case-series authors recommend repeat assessment during intercurrent
    illness or cholestatic symptoms until resolution. Ursodeoxycholic acid and cholestyramine were used in the small
    uncontrolled series; their reported responses do not establish general efficacy.
  evidence:
  - reference: PMID:34366366
    reference_title: "Intrahepatic Cholestasis Is a Clinically Significant Feature Associated with Natural History of X-Linked Myotubular Myopathy (XLMTM): A Case Series and Biopsy Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Recommendations for monitoring the liver function of patients with XLMTM include a hepatic panel—transaminases,
      GGT, total and direct bilirubin, and serum bile acids—and abdominal ultrasonography.
    explanation: >-
      Disease-specific monitoring recommendation from the clinical liver series.
  - reference: PMID:34366366
    reference_title: "Intrahepatic Cholestasis Is a Clinically Significant Feature Associated with Natural History of X-Linked Myotubular Myopathy (XLMTM): A Case Series and Biopsy Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Patients 1–4 responded well to choleretic treatment with UDCA and cholestyramine.
    explanation: >-
      Uncontrolled treatment experience in four cases; the individual regimens differed and the fifth case progressed
      to liver failure.
- name: Assistive communication
  description: >-
    Provide assistive communication devices when severe weakness or ventilatory dependence limits speech in XLMTM.
    Educational planning and neuropsychologic evaluation may also help children with learning difficulties.
  evidence:
  - reference: PMID:20301605
    reference_title: X-Linked Myotubular Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tracheostomy, G-tube feeding, and assistive communication devices are often required.
    explanation: >-
      GeneReviews identifies concrete supportive interventions in XLMTM.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1432/
    reference_title: X-Linked Myotubular Myopathy - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Based on the emerging natural history study data, neuropsychologic evaluation may help identify learning difficulties
      and enable optimized educational planning.
    explanation: >-
      The recommendation concerns identifying educational needs; it does not imply universal intellectual disability.
  therapeutic_modality: DEVICE
- name: Pyridostigmine for selected patients with a myasthenic component
  description: >-
    Acetylcholinesterase inhibition has produced symptomatic improvements in small uncontrolled CNM series, including
    DNM2-related disease and XLMTM. Evidence is limited and responses are not uniform; a prospective XLMTM natural-history
    study did not detect different outcomes in patients receiving pyridostigmine. This is a selectively considered
    symptomatic strategy, not an established disease-modifying therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pyridostigmine pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Pyridostigmine
      term:
        id: CHEBI:8665
        label: Pyridostigmine
  evidence:
  - reference: PMID:23338057
    reference_title: Neuromuscular junction abnormalities in DNM2-related centronuclear myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All five patients showed improved muscle strength and motor function, and/or reduced fatigability following
      acetylcholinesterase inhibitor treatment.
    explanation: >-
      Uncontrolled observations in five DNM2 patients; electrophysiologic transmission defects were documented in
      only two.
  - reference: PMID:21440438
    reference_title: Impaired neuromuscular transmission and response to acetylcholinesterase inhibitors in centronuclear myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Three (including the XLMTM case) showed improved strength with acetylcholinesterase inhibitor treatment.
    explanation: >-
      The small series included genetically unresolved CNM and one XLMTM case.
  - reference: PMID:30902907
    reference_title: "X-linked myotubular myopathy: A prospective international natural history study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Lastly, there was no indication that patients treated with pyridostigmine had different outcomes.
    explanation: >-
      The prospective observational study did not show a distinguishable treatment-associated outcome; this is not
      a randomized efficacy test.
  - reference: PMID:34768808
    reference_title: Common Pathogenic Mechanisms in Centronuclear and Myotubular Myopathies and Latest Treatment Advances.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pyridostigmine treatment in patients with DNM2 mutations resulted in reduced fatigability and improvement
      in muscle strength and motor function
    explanation: >-
      The review identifies the agent used in the clinical treatment observations.
  target_mechanisms:
  - target: Neuromuscular transmission impairment
    treatment_effect: MODULATES
    description: >-
      Acetylcholinesterase inhibition prolongs synaptic acetylcholine action and may improve transmission in the
      responsive subset.
- name: DNM2-lowering antisense therapy (DYN101, investigational)
  description: >-
    DYN101 was developed to lower DNM2 RNA in DNM2- or MTM1-related CNM. The phase 1/2 Unite-CNM study was terminated
    because low-dose tolerability findings prevented continued dosing or escalation. Preclinical rescue does not
    establish human efficacy or safety.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  evidence:
  - reference: PMID:34768808
    reference_title: Common Pathogenic Mechanisms in Centronuclear and Myotubular Myopathies and Latest Treatment Advances.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This study aims to assess safety, tolerability, pharmacokinetics (PK) and pharmacodynamics (PD) as well as
      the preliminary efficacy of intravenous injection (IV) of an ASO against human DNM2 mRNA in male and female
      patients ≥16 years with confirmed DNM2 or MTM1 mutations.
    explanation: >-
      The review describes the intervention and intended RNA target; its historical trial status is superseded by

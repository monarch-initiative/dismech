- name: Neuromuscular transmission impairment
  description: >-
    A myasthenic component contributes to weakness in some CNM patients. Small clinical series document electrophysiologic
    transmission defects in XLMTM and in two of five reviewed DNM2 cases, with treatment responses in some patients.
    Zebrafish models also show junctional abnormalities. These findings do not establish a transmission defect in
    every patient or genotype.
  subtypes:
  - XLMTM
  - DNM2-CNM
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:21440438
    reference_title: Impaired neuromuscular transmission and response to acetylcholinesterase inhibitors in centronuclear myopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A fourth case, with XLMTM, also showed electrophysiological features of a neuromuscular transmission defect.

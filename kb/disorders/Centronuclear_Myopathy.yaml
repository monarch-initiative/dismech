      id: hgnc:16901
      label: SPEG
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Cardiac involvement is variable rather than obligate: of the three probands in
    the gene-discovery report two had documented dilated cardiomyopathy, and an
    independent two-patient series found cardiomyopathy in one and isolated
    myopathy in the other.
  evidence:
  - reference: PMID:25087613
    reference_title: >-
      SPEG interacts with myotubularin, and its deficiency causes centronuclear
      myopathy with dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing, we identified three unrelated CNM-affected
      probands, including two with documented dilated cardiomyopathy, carrying
      homozygous or compound-heterozygous SPEG mutations.
    explanation: >-
      Establishes biallelic SPEG variants as causal for centronuclear myopathy in
      unrelated probands.
  - reference: PMID:28624463
    reference_title: >-
      Insights from genotype-phenotype correlations by novel SPEG mutations
      causing centronuclear myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next generation sequencing revealed novel biallelic homozygous mutations in
      SPEG in both cases.
    explanation: >-
      Independent replication of biallelic SPEG variants in centronuclear
      myopathy, three years after the original report.
- name: TTN biallelic truncating variants
  association: Causative
  relationship_type: CAUSATIVE
  subtype: TTN-CNM
  gene_term:
    preferred_term: TTN
    description: >
      TTN encodes titin, the giant sarcomeric protein that forms the myofibrillar
      backbone of the contractile machinery. Recessive truncating variants were
      found in a CNM cohort screened after MTM1, DNM2 and BIN1 were excluded, and
      produce truncated titin and increased titin degradation in patient muscle.
    term:
      id: hgnc:12403
      label: TTN
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    TTN-related disease is the mechanistic outlier of this entry: the other CNM
    genes act at the triad, whereas titin is a sarcomeric structural protein. The
    cohort here was deliberately depleted of MTM1, DNM2 and BIN1 cases, so the
    5-of-29 figure is a yield in a preselected series and is not a case fraction
    for centronuclear myopathy as a whole; no `case_fractions` record is made from
    it for that reason.
  evidence:
  - reference: PMID:23975875
    reference_title: >-
      Recessive truncating titin gene, TTN, mutations presenting as centronuclear
      myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive compound heterozygous truncating mutations of the titin
      gene, TTN, were identified in 5 individuals.
    explanation: >-
      Establishes biallelic truncating TTN variants in patients carrying a
      clinicopathologic diagnosis of centronuclear myopathy.
  - reference: PMID:23975875
    reference_title: >-
      Recessive truncating titin gene, TTN, mutations presenting as centronuclear
      myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome or -genome sequencing was performed in a cohort of 29 unrelated
      patients with clinicopathologic diagnoses of CNM or related myopathy
      depleted for cases with mutations of MTM1, DNM2, and BIN1.
    explanation: >-
      Records the ascertainment of the cohort, which is why its TTN yield is not
      treated as a population case fraction.
- name: CCDC78 variants
  association: Causative
  relationship_type: CAUSATIVE
  subtype: CCDC78-CNM
  gene_term:
    preferred_term: CCDC78
    term:
      id: hgnc:14153
      label: CCDC78
    description: >-
      Dominant CCDC78-associated myopathy spans early-onset distal weakness with internal nuclei and atypical cores
      in the original family and a milder adult myalgia/cramp phenotype with sarcoplasmic-reticulum abnormalities
      in a second family. Allele- and isoform-dependent effects remain incompletely defined.
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22818856
    reference_title: Dominant mutation of CCDC78 in a unique congenital myopathy with prominent internal nuclei and atypical cores.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A splice-acceptor variant in previously uncharacterized CCDC78 was detected in affected individuals and absent
      in unaffected family members and > 10,000 controls. This variant alters RNA-transcript processing and results
      in a 222 bp in-frame insertion.
    explanation: >-
      Segregation and transcript evidence from the original dominant family support the CCDC78 association.
  - reference: PMID:39273074
    reference_title: "CCDC78: Unveiling the Function of a Novel Gene Associated with Hereditary Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Here, we analyze for the first time a family harboring a CCDC78 nonsense mutation to better understand the
      role of CCDC78 in muscle.
    explanation: >-
      A second family extends the association. The full text describes an adult with myalgia, cramps, calf hypertrophy
      and mild central nucleation, without measured strength deficit; his daughter had calf hypertrophy. This is
      a small family-level evidence base, not a penetrance estimate.
  notes: >-
    Evidence comes from two reported families with distinct variants and phenotypes. The 2024 allele is nonsense
    in one transcript and missense in another; nonsense-mediated decay, selective isoform reduction and altered
    protein interactions do not establish one uniform haploinsufficiency mechanism for all CCDC78-associated disease.
- name: MAP3K20 variants
  association: Causative
  relationship_type: CAUSATIVE
  subtype: MAP3K20-CNM
  gene_term:
    preferred_term: MAP3K20
    term:
      id: hgnc:17797
      label: MAP3K20
    description: >-
      Biallelic truncating variants in MAP3K20, also called ZAK, cause congenital or childhood-onset slowly progressive
      myopathy with type 1 fiber predominance, central nuclei and variable respiratory impairment. Contractures
      with distal joint laxity and subsarcolemmal mitochondrial accumulation were family-dependent findings.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:

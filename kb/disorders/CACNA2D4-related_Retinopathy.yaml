    evidence:
    - reference: PMID:16877424
      reference_title: Structural and functional abnormalities of retinal ribbon synapses due to Cacna2d4 mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The mutation leads to significant loss of rods, whereas the number of

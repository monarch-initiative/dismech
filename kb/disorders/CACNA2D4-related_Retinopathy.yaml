        synapse assembly, independently of channel current.
- name: Reduced Cav1.4 Channel Abundance and Activity at Photoreceptor Terminals
  biological_scale: MOLECULAR
  description: >-
    Without alpha2delta-4, fewer Cav1.4 channels reach and remain at the
    photoreceptor presynaptic terminal and the remaining channels conduct less
    current. In knockout mice the maximum rod calcium current density is
    substantially reduced and its voltage sensitivity shifted; in cones
    alpha2delta-4 is essential for Cav1.4 function. Zebrafish cacna2d4b
    knockout reduces expression of the Cav1.4 pore subunit, indicating that
    this trafficking role is conserved.

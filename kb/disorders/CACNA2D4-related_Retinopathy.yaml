    explanation: >-
      In the spontaneous mouse mutant the truncating allele reduces transcript
      and probably abolishes protein.
  - reference: PMID:12181424
    reference_title: Molecular cloning and characterization of the human voltage-gated calcium channel alpha(2)delta-4 subunit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In human embryonic kidney 293 cells, the alpha(2)delta-4 subunit

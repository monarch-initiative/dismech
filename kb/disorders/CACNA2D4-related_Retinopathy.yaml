- name: Reduced Photoreceptor-to-Bipolar Cell Synaptic Transmission
  biological_scale: CELLULAR
  conforms_to: synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit
  description: >-
    Reduced calcium entry at photoreceptor ribbon synapses, together with
    failed rod synapse assembly, reduces glutamatergic transmission from
    photoreceptors to ON- and OFF-bipolar cells. This is the convergent
    synaptic endpoint of the disease, read out clinically as a reduced
    b-wave relative to the a-wave and as abnormal light-adapted responses on
    the full-field ERG. In humans the cone pathway is most affected; in the
    mouse rod transmission is abolished as well. Conformance to the synaptic
    vesicle cycle module is at its endpoint only: the lesion is in the
    calcium channel that triggers release, not in a vesicle-cycle protein,
    and the affected synapse is the photoreceptor ribbon synapse rather than
    a cortical or neuromuscular one.

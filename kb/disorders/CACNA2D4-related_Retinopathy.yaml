name: CACNA2D4-related Retinopathy
creation_date: '2026-10-27T00:00:00Z'
category: Mendelian
description: >-
  CACNA2D4-related retinopathy is a rare autosomal recessive inherited retinal
  disorder caused by biallelic loss-of-function variants in CACNA2D4, which
  encodes the alpha2delta-4 auxiliary subunit of the Cav1.4 L-type
  voltage-gated calcium channel at photoreceptor ribbon synapses. Loss of
  alpha2delta-4 reduces Cav1.4 channel abundance and calcium current at rod and
  cone terminals and so impairs glutamatergic signalling from photoreceptors to
  bipolar cells. Reported patients have a cone-dominant dysfunction with mildly
  to moderately reduced visual acuity, photophobia or light sensitivity, and a
  distinctive full-field electroretinogram in which light-adapted (cone)
  responses are most affected and the dark-adapted b-wave can be reduced
  relative to the a-wave. The original family was described as a slowly
  progressive cone dystrophy (retinal cone dystrophy 4, RCD4); in a later
  sibship one patient remained stable without retinal degeneration over 17
  years of follow-up, and expression varied between the two siblings. Single
  reports of retinitis pigmentosa rest on weak genetic evidence. Only a few
  families are published; ClinGen counted over eight probands. Mouse
  knockouts show severe rod synapse failure and slow photoreceptor degeneration, which human patients largely do not show.

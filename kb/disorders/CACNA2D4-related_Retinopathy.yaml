discussions:
- discussion_id: cacna2d4_mouse_degeneration_vs_human_stability
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Photoreceptor Cell Loss
  - pathophysiology#Failure of Rod Ribbon Synapse Assembly
  prompt: >-
    Why do alpha2delta-4-deficient mice abolish rod synaptic transmission and
    lose photoreceptors, while patients with null CACNA2D4 variants keep
    relatively preserved rod function and mostly show no retinal degeneration
    over decades?
  rationale: >-
    The spontaneous and knockout mice lose rod synapses and photoreceptors
    and have a night-blindness-like phenotype, whereas human patients have a
    cone-dominant dysfunction that was stable for 17 years in one patient. The
    cone-dominant zebrafish double knockout matches the human phenotype more
    closely. The mismatch matters because the mouse is the model used for the
    gene therapy studies, and its rod degeneration is a main rescue endpoint.
  evidence:
  - reference: PMID:40883544
    reference_title: "Intrafamilial variability of phenotype in CACNA2D4-associated retinal dysfunction: more or less."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, mouse phenotype does not recapitulate the human one and is
      closer to congenital stationary night blindness
    explanation: >-
      The authors' discussion of the published models states the mismatch
      between the mouse and human phenotypes.
  - reference: PMID:31834350
    reference_title: A New Zebrafish Model for CACNA2D4-Dysfunction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Similar to human patients, our double KO zebrafish model shows mild
      cone dysfunction, which was not associated with signs of retinal
      degeneration.
    explanation: A cone-dominant model reproduces the human non-degenerative course.
  proposed_experiments:
  - experiment_id: cacna2d4_human_retinal_organoid
    name: CACNA2D4-null human retinal organoids
    description: >-
      Compare rod and cone ribbon synapse assembly, Cav1.4 localization and
      photoreceptor survival in CACNA2D4-null versus isogenic control human
      retinal organoids.
    would_support:
    - pathophysiology#Failure of Rod Ribbon Synapse Assembly
differential_diagnoses:
- name: CACNA1F-related retinopathy
  description: >-
    X-linked incomplete congenital stationary night blindness from loss of
    the Cav1.4 pore subunit gives a similar electronegative ERG, but with
    night blindness, X-linked inheritance and a characteristic ON-OFF ERG
    pattern that CACNA2D4 patients lack.
  distinguishing_features:
  - X-linked inheritance rather than autosomal recessive.
  - Schubert-Bornschein ON-OFF ERG abnormality absent in CACNA2D4 patients.
  disease_term:
    preferred_term: CACNA1F-related retinopathy
    term:
      id: MONDO:0700243
      label: CACNA1F-related retinopathy
  evidence:
  - reference: PMID:40883544
    reference_title: "Intrafamilial variability of phenotype in CACNA2D4-associated retinal dysfunction: more or less."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Also, there were no ON–OFF ERG alterations (Fig. 1, ON–OFF) specific for
      Schubert-Bornschein complete and incomplete forms of congenital
      stationary night blindness
    explanation: >-
      The ON-OFF ERG distinguishes CACNA2D4 retinopathy from the
      Schubert-Bornschein CSNB forms, including CACNA1F incomplete CSNB.
notes: >-
  No GeneReviews chapter covers this disease. Phenotype evidence comes from
  three families and one singleton; the Ba-Abbad 2016 letter (PMID:26560832)
  describing two further patients with a non-progressive cone-dominant
  dysfunction has no PubMed abstract and its full text is not cached, so it
  is not cited for specific findings. The Huang 2015 cohort (PMID:25356976),
  cited by ClinGen for a homozygous missense variant, does not mention
  CACNA2D4 in its abstract and is not cited. The heterozygous 30.65 kb
  CACNA2D4 deletion reported in an Ashkenazi Jewish retinitis pigmentosa
  pedigree (PMID:28837078) is a single allele in a patient who also carried
  a homozygous C21orf2 deletion and is not counted as causal. CACNA2D4 copy
  number changes reported in bipolar disorder and 12p13.33 deletion
  syndromes are unrelated to this retinopathy.

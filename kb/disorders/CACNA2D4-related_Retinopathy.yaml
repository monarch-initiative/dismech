      explanation: Rod loss in the spontaneous mutant.
- name: Cacna2d4 knockout mouse
  species: Mouse
  genotype: Cacna2d4 null (alpha2delta-4 knockout)
  publication: PMID:29875267
  description: >-
    Knockout lines in which rod synapses fail to form, Cav1.4 channels are
    progressively lost from rod and then cone terminals, ERG b-waves are
    absent, and visually guided behaviour is retained, better under photopic
    than scotopic conditions.
  modeled_mechanisms:
  - target: Reduced Cav1.4 Channel Abundance and Activity at Photoreceptor Terminals
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Progressive loss of Cav1.4 channels from photoreceptor terminals.
    limitations: >-
      Channel loss is measured in mouse; no human photoreceptor tissue has been
      examined.
    evidence:
    - reference: PMID:29875267
      reference_title: α(2)δ-4 Is Required for the Molecular and Structural Organization of Rod and Cone Photoreceptor Synapses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The severity of the synaptic defects in α2δ-4 KO mice correlates with
        a progressive loss of Cav1.4 channels, first in terminals of rods and
        later cones.
      explanation: Channel loss in knockout photoreceptor terminals.
  - target: Reduced Photoreceptor-to-Bipolar Cell Synaptic Transmission
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: ERG b-waves are absent while visually guided behaviour persists.
    limitations: >-
      The knockout abolishes rod transmission, whereas patients have
      relatively preserved rod function and a cone-dominant disorder.
    evidence:
    - reference: PMID:29875267
      reference_title: α(2)δ-4 Is Required for the Molecular and Structural Organization of Rod and Cone Photoreceptor Synapses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Despite the absence of b-waves in electroretinograms, visually guided
        behavior is evident in α2δ-4 KO mice and better under photopic than
        scotopic conditions.
      explanation: Absent b-wave with relatively retained photopic vision.

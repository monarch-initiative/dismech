  - target: Failure of Rod Ribbon Synapse Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28262416
      reference_title: The Auxiliary Calcium Channel Subunit α2δ4 Is Required for Axonal Elaboration, Synaptic Transmission, and Wiring of Rod Photoreceptors.

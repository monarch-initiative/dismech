  description: >-
    The originally described cone dystrophy, in two siblings homozygous for
    CACNA2D4 p.Tyr802*, with mild late-noticed acuity loss, photophobia since
    childhood, abnormal colour discrimination and an absent single-flash cone
    ERG response. MONDO currently lists it as the only child of the spectrum
    term.
  evidence:
  - reference: PMID:17033974
    reference_title: Mutation in the auxiliary calcium-channel subunit CACNA2D4 causes autosomal recessive cone dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings represent the first report of a mutation in the human
      CACNA2D4 gene and define a novel gene defect that causes autosomal
      recessive cone dystrophy.
    explanation: >-
      Defines CACNA2D4 cone dystrophy, the RCD4 subtype, from the index
      family.

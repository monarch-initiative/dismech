      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous for a CACNA2D4 loss-of-function
    variant; a heterozygous parent in the index family was unaffected. ClinGen
    classifies the gene-disease relationship as Definitive for autosomal
    recessive inheritance. No published source specific to this disease states
    a recurrence risk figure.
  evidence:
  - reference: PMID:17033974
    reference_title: Mutation in the auxiliary calcium-channel subunit CACNA2D4 causes autosomal recessive cone dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The affected sister (II-2) also showed homozygosity for this DNA
      sequence variant, whereas the unaffected father (I-1) was heterozygous
      for the mutation
    explanation: >-
      Segregation in the index family: affected siblings homozygous, the
      heterozygous father unaffected, consistent with recessive inheritance.

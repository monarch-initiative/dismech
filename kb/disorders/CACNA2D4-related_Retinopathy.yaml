      how often the disease has been reported.
pathophysiology:
- name: Biallelic CACNA2D4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic CACNA2D4 variants (nonsense, multi-exon deletions, a
    splice-altering deletion, and rare missense changes) remove or truncate
    the alpha2delta-4 auxiliary subunit. The recurrent p.Tyr802* nonsense
    variant truncates about one-third of the open reading frame and is
    predicted to cause nonsense-mediated decay or loss of the delta peptide
    that anchors the subunit at the membrane; the mouse frameshift allele
    sharply reduces Cacna2d4 transcript. alpha2delta-4 normally increases
    current through the L-type channel it partners.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION

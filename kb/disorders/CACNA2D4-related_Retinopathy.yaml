      label: CACNA2D4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported causal variants are nonsense (p.Tyr802*, p.Arg628*), two large
    multi-exon deletions, a splice-altering deletion confirmed by minigene
    assay, and missense changes; most reported affected individuals are
    homozygous, and one retinitis pigmentosa proband was compound
    heterozygous.
    Expression differs between siblings carrying the same homozygous variant.
    p.Arg628* and the multi-exon deletion from the UK BioResource study
    (Ba-Abbad et al. 2016, PMID:26560832) are recorded here without evidence
    items because that letter has no PubMed abstract or cached full text.

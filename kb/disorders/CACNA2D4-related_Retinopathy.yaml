- name: Rod Internal Calcium Store Depletion
  biological_scale: CELLULAR
  description: >-
    In rods of the spontaneous Cacna2d4 mutant mouse, internal calcium stores
    are depleted and calcium and sodium entry through non-selective cation
    channels is upregulated. The authors propose that store depletion, with
    the resulting cation overload and endoplasmic reticulum stress, drives rod
    death. Shown only in the mouse.

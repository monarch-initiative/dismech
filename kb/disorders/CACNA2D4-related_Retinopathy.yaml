- name: Photoreceptor Cell Loss
  biological_scale: CELLULAR
  description: >-
    Mouse models lose photoreceptors slowly: the spontaneous mutant loses rods
    while cones are spared until about 6 weeks, the knockout shows slow
    photoreceptor degeneration, and an all-cone knockout retina loses about
    10% of cones by 2 months. Human patients have mostly not shown retinal
    degeneration, including over 17 years of follow-up in one patient, so
    this node is largely a model finding (see the HUMAN_MODEL_MISMATCH
    discussion). Single reports of retinitis pigmentosa with CACNA2D4
    variants are the only possible human counterpart.

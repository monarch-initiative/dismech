- name: Ectopic Bipolar and Horizontal Cell Neurite Sprouting
  biological_scale: CELLULAR
  description: >-
    In alpha2delta-4 knockout retina, rod bipolar, cone bipolar and horizontal
    cell processes extend abnormally into the outer nuclear layer, a remodeling response to the loss of normal photoreceptor
    synaptic contacts. Neonatal gene supplementation in mice prevents it,
    whereas later treatment restores synaptic proteins without reversing the
    sprouting. Not documented in human patients, whose retinal imaging is
    usually normal.

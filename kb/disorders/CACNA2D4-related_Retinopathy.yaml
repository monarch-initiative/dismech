diagnosis:
- name: Full-Field Electroretinography
  description: >-
    Full-field ERG shows the cone-dominant dysfunction with a reduced b-wave;
    the dark-adapted bright-flash response was electronegative in one of the
    two reported siblings but not the other. In that sibship the ERG pattern
    was specific for CACNA2D4-related dysfunction although amplitudes
    differed between the two patients.
  diagnosis_term:
    preferred_term: full-field electroretinography
    term:
      id: NCIT:C101217
      label: Retinal Examination
  notes: >-
    NCIT has no electroretinography term: OLS4 searches of NCIT for
    "electroretinography" and "electroretinogram" return no results, so the
    broader Retinal Examination is bound, as in CACNA1F-Related_Retinopathy.
  evidence:
  - reference: PMID:40883544
    reference_title: "Intrafamilial variability of phenotype in CACNA2D4-associated retinal dysfunction: more or less."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ffERG was specific for CACNA2D4-related retinal dysfunction, but
      amplitudes of responses were different in the two patients.
    explanation: >-
      Reports that the full-field ERG pattern identified CACNA2D4-related
      dysfunction in both affected siblings.
- name: Molecular Genetic Testing
  description: >-
    Biallelic CACNA2D4 variants confirm the diagnosis. Because large
    multi-exon deletions are part of the variant spectrum, testing that
    detects structural variants (such as whole-genome sequencing) is
    informative where exome or panel sequencing finds a single or no variant.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:28041643
    reference_title: Comprehensive Rare Variant Analysis via Whole-Genome Sequencing to Determine the Molecular Pathology of Inherited Retinal Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-genome sequencing gives unprecedented power to detect three
      categories of pathogenic variants in particular: structural variants,
      variants in GC-rich regions, which have significantly improved coverage
      compared to whole-exome sequencing, and variants in non-coding
      regulatory regions.
    explanation: >-
      This inherited retinal disease WGS cohort, which included two
      CACNA2D4 patients, reports that genome sequencing detects structural
      variants better than exome sequencing; CACNA2D4 large deletions are
      such variants.
treatments:
- name: AAV CACNA2D4 Gene Supplementation (Preclinical)
  description: >-
    No disease-specific therapy is approved and no clinical trial has been
    reported. In alpha2delta-4 knockout mice, subretinal AAV delivery of
    alpha2delta-4 to photoreceptors restored synaptic localization of Cav1.4,
    ELFN proteins and mGluR6, retinal function and visual acuity, and
    prevented rod degeneration. The
    benefit depended on age: rod transmission was not restored when treatment
    started in middle age, while cone transmission was. Both studies are
    preprints. An exon-skipping antisense approach was tested and found
    unsuitable because the skipped alpha2delta-4 proteins are nonfunctional
    (PMID:26218913).
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic CACNA2D4 Loss of Function
    treatment_effect: BYPASSES
    description: Supplies a functional CACNA2D4 coding sequence to photoreceptors.
  - target: Reduced Cav1.4 Channel Abundance and Activity at Photoreceptor Terminals
    treatment_effect: RESTORES
    description: Restores synaptic localization of Cav1.4 in knockout mice.
  evidence:
  - reference: PMID:42539265
    reference_title: AAV-mediated age- and circuit-dependent restoration of photoreceptor synaptic structure and function in α2δ4-associated retinal synaptopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      AAV-mediated α2δ4 expression restored synaptic localization of Cav1.4,
      ELFN proteins, and mGluR6 at all treatment ages.
    explanation: Preprint; gene supplementation restores synaptic protein localization in knockout mice.
  - reference: PMID:42539265
    reference_title: AAV-mediated age- and circuit-dependent restoration of photoreceptor synaptic structure and function in α2δ4-associated retinal synaptopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Rescue in middle-aged mice restored cone but not rod transmission.
    explanation: Preprint; the therapeutic window is narrower for rods than for cones.
  - reference: PMID:42427680
    reference_title: Therapeutic restoration of synaptic architecture, retinal and visual function, and prevention of retinal degeneration in a mouse model of retinal dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using adult α2δ4 -/- mice, we show that recombinant adeno-associated
      virus (rAAV)-mediated gene therapy directed to rod photoreceptors
      prevents rod degeneration, restores synaptic organization, retinal
      function, and improves visual acuity under both light- and dark-adapted
      conditions.
    explanation: Preprint; rod-directed gene therapy in adult knockout mice.
  - reference: PMID:26218913
    reference_title: "A New Splicing Isoform of Cacna2d4 Mimicking the Effects of c.2451insC Mutation in the Retina: Novel Molecular and Electrophysiological Insights."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The designed exon-skipping strategy is not applicable because the
      resulting skipped α2δ4 are nonfunctional.
    explanation: >-
      Records why the alternative exon-skipping strategy was abandoned, which
      leaves gene supplementation as the tested genetic approach.
animal_models:

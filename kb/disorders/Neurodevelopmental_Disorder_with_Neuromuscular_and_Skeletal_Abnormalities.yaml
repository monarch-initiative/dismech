- name: Aberrant CNS White Matter Tract Formation
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    Nr-CAM is expressed along the major crossing fibre pathways — the anterior
    commissure, corpus callosum and posterior commissure — so loss of NrCAM
    guidance is expected to disturb their formation. Zebrafish nrcamaΔ mutants
    lacking the third Fn-III domain show a trend toward increased α-tubulin
    fibre density in the dorsal telencephalon and a thicker anterior
    telencephalic commissure. In affected individuals, brain MRI is variable and
    non-specific: thin corpus callosum, ventriculomegaly, periventricular
    leukomalacia and delayed myelination are each seen in a subset, and some
    individuals have normal imaging. Confidence is provisional because the
    zebrafish differences were trends rather than significant, and no human
    neuropathological correlate exists.

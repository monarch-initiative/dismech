- name: Defective Node of Ranvier Assembly and Maintenance
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    At the peripheral node of Ranvier, glial NrCAM and gliomedin on the Schwann
    cell bind axonal neurofascin-186; this axo-glial complex recruits ankyrin-G,
    which in turn clusters and concentrates voltage-gated sodium channels at the
    nodal axolemma. NrCAM is also present on the axonal side at nodes and axon
    initial segments together with neurofascin and ankyrin-G. Loss of the glial
    clustering signal produces delayed and disorganized node formation and,
    over time, progressive loss of Nav channels, ankyrin-G and βIV spectrin from
    established nodes.

  - reference: PMID:16039564
    reference_title: Gliomedin mediates Schwann cell-axon interaction and the molecular assembly of the nodes of Ranvier.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Eliminating the expression of gliomedin by RNAi, or the addition of a
      soluble extracellular domain of neurofascin to myelinating cultures, which
      caused the redistribution of gliomedin along the internodes, abolished node
      formation.
    explanation: >-
      Disrupting the gliomedin-neurofascin-NrCAM interaction abolishes node
      formation outright, establishing the complex as necessary rather than
      merely correlated.
  - reference: PMID:11728309
    reference_title: Nr-CAM and neurofascin interactions regulate ankyrin G and sodium channel clustering at the node of Ranvier.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Nr-Fc had no effect on initial axon-Schwann cell interactions, including
      Schwann cell proliferation, or on the extent of myelination, but it
      strikingly and specifically inhibited Na(+) channel and ankyrin G
      accumulation at the node.
    explanation: >-
      A loss-of-function experiment in myelinating DRG neuron-Schwann cell
      co-culture showing that blocking Nr-CAM interactions specifically prevents
      sodium channel and ankyrin G accumulation at the node while leaving
      myelination itself intact - the cleanest available separation of the nodal
      defect from a primary myelination defect. The authors frame their own
      conclusion around neurofascin, with Nr-CAM as its likely partner, so the
      experiment constrains the complex rather than isolating NrCAM's
      contribution within it.
- name: Peripheral Nerve Conduction Failure and Axonal Degeneration
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Progressive loss of nodal sodium channels and disorganization of nodal
    architecture slow or block saltatory conduction. In the mouse double mutant
    that removes the entire glial clustering signal this produces measurable
    neurological abnormality and slowed nerve conduction. In affected
    individuals the corresponding clinical finding is a peripheral neuropathy -
    motor-predominant and axonal in the one case with quotable
    electrophysiology - with chronic neurogenic changes on needle EMG,
    neurogenic grouped fibre atrophy on muscle biopsy, and modestly elevated
    creatine kinase.

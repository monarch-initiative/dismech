inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires bi-allelic NRCAM variants. Reported genotypes are
    homozygous (frequently in consanguineous or founder families) or compound
    heterozygous, and variants co-segregated with disease in all eight families
    of the founding cohort. Heterozygous carriers, including the parents, are
    unaffected. Expressivity is markedly variable, both between and within
    genotype classes: from hydrocephalus with failure to thrive and death in
    infancy, through developmental delay with hypotonia/neuropathy or
    spasticity, to isolated late-onset peripheral neuropathy with normal
    cognition.
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe ten affected individuals with bi-allelic variants in the
      neuronal cell adhesion molecule NRCAM that lead to a neurodevelopmental
      syndrome of varying severity; the individuals are from eight families.
    explanation: >-
      Ten affected individuals from eight families each carry bi-allelic NRCAM
      variants, establishing autosomal recessive inheritance.
  - reference: PMID:36606341
    reference_title: Bi-allelic loss of function variant in the NRCAM gene is associated with motor-predominant axonal polyneuropathy; the second report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband is a 19‐year‐old male who is the only child of consanguineous
      (first cousin) healthy Iranian parents
    explanation: >-
      The second reported family is consanguineous with a homozygous proband,
      consistent with autosomal recessive inheritance.

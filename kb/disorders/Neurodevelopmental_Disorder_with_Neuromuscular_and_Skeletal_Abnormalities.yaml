name: Neurodevelopmental Disorder with Neuromuscular and Skeletal Abnormalities
creation_date: '2026-08-18T00:00:00Z'
category: Mendelian
synonyms:
- NEDNMS
- NRCAM-related neurodevelopmental disorder
- NRCAM deficiency
description: >-
  Neurodevelopmental disorder with neuromuscular and skeletal abnormalities
  (NEDNMS; OMIM:619833) is an ultra-rare autosomal recessive disorder caused by
  bi-allelic loss-of-function or damaging missense variants in NRCAM, which
  encodes neuronal cell adhesion molecule (NrCAM), a member of the L1
  immunoglobulin-superfamily of cell adhesion molecules (L1CAM, NRCAM, CHL1,
  NFASC). NrCAM mediates neuron-neuron and axon-glia adhesion, couples the
  cell surface to the ankyrin-spectrin cytoskeleton, and is required for axon
  growth and guidance, synaptogenesis and dendritic spine remodeling, and
  assembly and maintenance of nodes of Ranvier. Affected individuals present
  from infancy or early childhood with global developmental delay and cognitive
  impairment combined with a neuromuscular phenotype that is either hypotonia
  with peripheral neuropathy or spasticity; facial dysmorphism, skeletal
  findings (scoliosis, hip dysplasia, pes cavus), ataxia, ocular and auditory
  abnormalities, and non-specific brain MRI changes (thin corpus callosum,
  ventriculomegaly, periventricular leukomalacia, delayed myelination) occur
  with variable penetrance. Severity spans a wide spectrum, from early demise
  in infancy to isolated adult-onset motor-predominant axonal polyneuropathy
  with normal cognition. Disease-associated variants cluster in the third
  fibronectin type III (Fn-III) domain, a predicted protein-protein interaction
  interface. About 11 individuals have been reported in two primary
  publications since the disorder was delineated in 2022, plus a review letter
  that re-describes two of them.

    explanation: >-
      Establishes that the disease alleles are predicted to impair NrCAM
      structure and its protein-protein interactions.
  - reference: PMID:36606341
    reference_title: Bi-allelic loss of function variant in the NRCAM gene is associated with motor-predominant axonal polyneuropathy; the second report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing revealed a homozygous variant, c.73C > T
      (p.Gln25*), in the NRCAM gene, while the patient manifests a mild range of
      phenotypes compared to NRCAM-related disorder.
    explanation: >-
      An independent homozygous nonsense allele confirms bi-allelic NRCAM loss
      of function as the disease trigger.
- name: Impaired NrCAM-Mediated Neural Cell Adhesion
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NrCAM is a type-I transmembrane L1-family Ig-CAM whose extracellular region
    comprises six immunoglobulin-like domains followed by five fibronectin type
    III repeats; the Ig domains mediate ligand recognition and homophilic and
    heterophilic trans-binding (contactin-1/TAG-1, neurofascin), while the
    Fn-III repeats mediate adhesion signaling, and the cytoplasmic tail binds
    ankyrin. Loss of NrCAM therefore removes an adhesion and signaling hub that
    is shared by the neuron-neuron, neuron-glia and axon-glia interfaces. Most
    disease variants fall in the third Fn-III domain, which carries a
    KGE integrin-recognition motif and an RNRR furin site and is predicted to
    form a protein-protein interaction surface.
  biological_processes:

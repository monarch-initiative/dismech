animal_models:
- name: Nrcam knockout mouse
  species: Mouse
  genotype: Nrcam-null (homozygous knockout)
  description: >-
    Constitutive Nrcam-null mice reproduce the cellular defects of the disorder
    — delayed and abnormal node of Ranvier formation with delayed sodium channel
    clustering, failure of cerebellar granule cells to extend neurites on
    contactin-1, excess dendritic spines with increased mEPSC frequency in
    visual cortex, thalamic axon mistargeting with abnormal visual-evoked
    potentials, lens fibre disorganization with cataract, and transient cochlear
    innervation errors — yet do not develop a neuromuscular disorder and have
    only mildly reduced cerebellar size. The disconnect is the central
    translational caveat for this entry.
  publication: PMID:35108495
  modeled_mechanisms:
  - target: Defective Node of Ranvier Assembly and Maintenance
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Peripheral nerves of Nrcam-deficient mice show delayed or abnormal node
      formation with delayed nodal sodium channel clustering, the same lesion
      proposed to underlie the human peripheral neuropathy.
    limitations: >-
      Node formation is delayed rather than abolished, because gliomedin
      provides a partially redundant glial clustering signal; the severe nodal
      phenotype requires loss of both molecules.
    evidence:
    - reference: PMID:35108495
      reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Nrcam has also been proven integral for formation and maintenance of
        nodes of Ranvier on myelinated axons, and peripheral nerves of
        Nrcam-deficient mice exhibit delayed or abnormal node formation.
      explanation: >-
        Supports treating the Nrcam-null mouse as informative for the nodal
        assembly node.
  - target: Neuromuscular Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Despite the nodal defect, Nrcam-null mice show no neuromuscular disorder,
      in contrast to the hypotonia, spasticity and neuropathy present in every
      reported affected individual.
    limitations: >-
      Probable compensation by other L1-family Ig-CAMs (L1cam, Chl1, Nfasc) in
      mouse, and possible transcriptional adaptation triggered by
      nonsense-mediated decay of the null allele. Species differences in the
      protein itself are also implicated: the KGE and RNRR motifs of the human
      third Fn-III domain are poorly conserved outside mammals.
    evidence:
    - reference: PMID:35108495
      reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, while KO mice have delayed nodes of Ranvier formation and
        subsequently delayed sodium channel clustering at nodes, they do not
        exhibit signs of a neuromuscular disorder.
      explanation: >-
        Explicit negative result: the mouse null does not develop the defining
        neuromuscular phenotype of the human disorder.
  - target: Impaired Synaptogenesis and Dendritic Spine Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      NrCAM-null cortex shows elevated dendritic spine density, increased
      asymmetric synapses and increased mEPSC frequency, establishing NrCAM as a
      postnatal regulator of spine density within the Sema3F receptor complex.
    limitations: >-
      Measured in mouse primary visual cortex; no corresponding measurement
      exists in tissue from affected individuals, so the relevance to the human
      cognitive and behavioural phenotype is inferred.
    readouts:
    - name: Apical dendritic spine density on star pyramidal cells
      target: Impaired Synaptogenesis and Dendritic Spine Remodeling
      direction: INCREASED
      interpretation: >-
        Loss of NrCAM removes Sema3F-dependent spine pruning, raising spine
        density.
      evidence:
      - reference: PMID:25143608
        reference_title: Neural cell adhesion molecule NrCAM regulates Semaphorin 3F-induced dendritic spine remodeling.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          NrCAM deletion in mice resulted in elevated spine densities on apical
          dendrites of star pyramidal cells at both postnatal and adult stages,
          and electron microscopy revealed increased numbers of asymmetric
          synapses in layer 4 of V1.
        explanation: Reports the spine-density measurement behind this readout.
    - name: Miniature EPSC frequency in star pyramidal neurons
      target: Impaired Synaptogenesis and Dendritic Spine Remodeling
      direction: INCREASED
      interpretation: >-
        Functional correlate of the excess excitatory synapses.
      evidence:
      - reference: PMID:25143608
        reference_title: Neural cell adhesion molecule NrCAM regulates Semaphorin 3F-induced dendritic spine remodeling.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Whole-cell recordings in cortical slices from NrCAM-null mice revealed
          increased frequency of mEPSCs in star pyramidal neurons.
        explanation: Reports the electrophysiological measurement behind this readout.
    evidence:
    - reference: PMID:25143608
      reference_title: Neural cell adhesion molecule NrCAM regulates Semaphorin 3F-induced dendritic spine remodeling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings reveal NrCAM as a novel postnatal regulator of dendritic
        spine density in cortical pyramidal neurons, and an integral component
        of the Sema3F receptor complex.
      explanation: >-
        Supports treating the NrCAM-null mouse as informative for the synaptic
        node.
  - target: Sensory Pathway Miswiring
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Nrcam-null mice reproduce the developmental miswiring — thalamic axon
      mistargeting to visual cortex with abnormal VEPs, and cochlear afferent
      and efferent innervation errors — but the cochlear defects self-correct
      and adult auditory acuity is normal, unlike the persistent hearing
      impairment in some affected individuals.
    limitations: >-
      Transient cochlear phenotype with functional recovery by weaning; humans
      appear to lack the compensatory mechanism.
    evidence:
    - reference: PMID:29536590
      reference_title: Neuronal cell adhesion molecule (NrCAM) is expressed by sensory cells in the cochlea and is necessary for proper cochlear innervation and sensory domain patterning during development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Neonatal Nrcam-null cochleae show errors in type II SGN fasciculation,
        reduced efferent innervation, and defects in the stereotyped packing of
        hair and supporting cells.
      explanation: >-
        Supports treating the mouse as informative for the sensory-miswiring
        node, with the transience caveat recorded in limitations.
  evidence:
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, while KO mice have delayed nodes of Ranvier formation and
      subsequently delayed sodium channel clustering at nodes, they do not
      exhibit signs of a neuromuscular disorder.
    explanation: >-
      The mouse null is informative for the cellular mechanism but not for the
      organism-level neuromuscular phenotype, hence PARTIAL.
- name: Gliomedin/NrCAM double knockout mouse
  species: Mouse
  genotype: Gldn-null; Nrcam-null double knockout
  description: >-
    Removing both glial nodal adhesion molecules abolishes the glial clustering
    signal entirely and, unlike either single knockout, produces progressive
    disintegration of established nodes — sequential loss of neurofascin-186,
    sodium channels, ankyrin-G and then βIV spectrin, binary node formation and
    dysregulated nodal gap length — with neurological abnormality and slowed
    nerve conduction. It is the model that isolates the consequences of losing
    NrCAM-dependent nodal contact from the redundancy that masks them in the
    single mutant.
  publication: PMID:24719088
  evidence:
  - reference: PMID:24719088
    reference_title: Long-term maintenance of Na+ channels at nodes of Ranvier depends on glial contact mediated by gliomedin and NrCAM.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that, in contrast to mice that lack either gliomedin or
      NrCAM, absence of both molecules (and hence the glial clustering signal)
      resulted in a gradual loss of Na(+) channels and other axonal components
      from the nodes, the formation of binary nodes, and dysregulation of nodal
      gap length.
    explanation: >-
      Establishes the model. It is PARTIAL for this disorder because affected
      individuals retain gliomedin, so the double knockout removes more than
      NRCAM loss alone does.
  modeled_mechanisms:
  - target: Peripheral Nerve Conduction Failure and Axonal Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of the gliomedin/NrCAM clustering signal produces measurable slowing
      of nerve conduction and neurological abnormality.
    limitations: >-
      The double knockout removes a redundant partner that is intact in affected
      individuals, so the model overstates the nodal deficit expected from NRCAM
      loss alone; it establishes the direction of the mechanism rather than its
      magnitude in human disease.
    readouts:
    - name: Nerve conduction velocity
      target: Peripheral Nerve Conduction Failure and Axonal Degeneration
      direction: DECREASED
      interpretation: >-
        Functional consequence of nodal disassembly.
      evidence:
      - reference: PMID:24719088
        reference_title: Long-term maintenance of Na+ channels at nodes of Ranvier depends on glial contact mediated by gliomedin and NrCAM.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Therefore, these mice exhibit neurological abnormalities and slower
          nerve conduction.
        explanation: Reports the conduction measurement behind this readout.
    evidence:
    - reference: PMID:24719088
      reference_title: Long-term maintenance of Na+ channels at nodes of Ranvier depends on glial contact mediated by gliomedin and NrCAM.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that, in contrast to mice that lack either gliomedin or
        NrCAM, absence of both molecules (and hence the glial clustering signal)
        resulted in a gradual loss of Na(+) channels and other axonal components
        from the nodes, the formation of binary nodes, and dysregulation of
        nodal gap length.
      explanation: >-
        Establishes the model and the redundancy that motivates using the double
        knockout.
- name: Zebrafish nrcama third Fn-III domain deletion mutant
  species: Zebrafish
  genotype: nrcamaΔ (CRISPR-Cas9 deletion of the third Fn-III domain)
  description: >-
    A CRISPR-Cas9 mutant deleting the third Fn-III repeat — the domain in which
    most human disease variants cluster — generated in the founding study.
    Mutant larvae are viable with no gross morphological defect but show
    significantly altered swimming behaviour and a trend toward increased
    α-tubulin fibre density in the dorsal telencephalon and a thickened anterior
    telencephalic commissure. It is the only in vivo model built around the
    human variant hotspot.
  publication: PMID:35108495
  modeled_mechanisms:
  - target: Aberrant CNS White Matter Tract Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Altered axonal projections in the dorsal telencephalon and anterior
      commissure, the zebrafish counterpart of the mammalian pallium and of the
      commissural tracts abnormal on human MRI.
    limitations: >-
      The axonal differences were reported as trends and did not reach
      significance; the pallium is massively expanded in humans relative to
      zebrafish; and the KGE and RNRR motifs of the human third Fn-III domain
      are not conserved in zebrafish Nrcam (HGD and QDYD), so the deleted domain
      is not functionally equivalent.
    evidence:
    - reference: PMID:35108495
      reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, nrcamaΔ mutants displayed a trend toward increased amounts of
        α-tubulin fibers in the dorsal telencephalon, demonstrating an
        alteration in white matter tracts and projections.
      explanation: >-
        Supports the model as informative for white matter tract formation,
        while recording that the finding is a trend.
  evidence:
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our studies on zebrafish nrcamaΔ mutants lacking the third Fn-III domain
      revealed that mutant larvae displayed significantly altered swimming
      behavior compared to wild-type larvae (p < 0.03).
    explanation: >-
      The behavioural readout that establishes functional consequence of
      deleting the human variant-hotspot domain in vivo.
discussions:
- discussion_id: skeletal_phenotype_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the mechanism of the skeletal abnormalities that give NEDNMS its
    name, and can the reported frequencies be anchored to quotable primary
    evidence?
  attaches_to:
  - pathophysiology#Secondary Musculoskeletal Deformity
  - pathophysiology#Neuromuscular Dysfunction
  rationale: >-
    The disorder is named for "neuromuscular and skeletal abnormalities", and
    the OMIM clinical synopsis for OMIM:619833 records scoliosis in 5/9, hip
    dysplasia in 3/9, pes cavus in 3/9, plus coxa valga, acetabular dysplasia,
    hammertoe and distal arthrogryposis. Those counts derive from Table 1 of
    PMID:35108495, but that table is not present in the extractable text of the
    cached reference and the paper's narrative and abstract never use the words
    scoliosis, skeletal or contracture — the founding authors frame the disorder
    as neurological and neuromuscular throughout. Two questions follow. First,
    the evidentiary one: the skeletal phenotypes in this entry carry ontology
    terms and provenance notes but no exact-quote evidence items, and cannot be
    given any until a source states them in quotable text. Second, the
    mechanistic one: no cell-autonomous role for NRCAM in bone or cartilage has
    been described, so the skeletal findings are modeled here as secondary to
    chronic abnormal loading from hypotonia, spasticity and neurogenic
    weakness. That inference is plausible for scoliosis, hip subluxation and
    cavus foot — all standard sequelae of early-onset neuromuscular disease —
    but distal arthrogryposis implies a prenatal akinesia sequence rather than
    postnatal loading, and the disorder's own name asserts a prominence the
    primary literature does not argue for.
  proposed_experiments:
  - experiment_id: skeletal_phenotyping_cohort
    name: Systematic skeletal phenotyping of a larger NRCAM cohort
    description: >-
      Prospectively collect standing spine radiographs, hip imaging and foot
      examination on all molecularly confirmed individuals, scored alongside
      motor function (GMFCS or equivalent) and tone, and report the results in
      a citable narrative rather than a table alone. This would both anchor the
      frequencies and test whether skeletal severity tracks neuromuscular
      severity, as the secondary-loading model predicts.
  - experiment_id: nrcam_skeletal_cell_autonomy
    name: Test for cell-autonomous NRCAM function in skeletal tissue
    description: >-
      Assay NRCAM expression in growth plate chondrocytes, osteoblasts and
      tendon, and compare skeletal phenotype in a conditional
      neural-lineage-restricted Nrcam knockout against the constitutive null. A
      neural-restricted null that still produces skeletal deformity would
      support the secondary-loading model; a difference between the two would
      indicate a direct skeletal role.
- discussion_id: mouse_null_neuromuscular_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why do Nrcam-null mice show the cellular lesions of this disorder — delayed
    node of Ranvier formation, failed neurite outgrowth, excess dendritic
    spines, thalamic axon mistargeting — without developing the neuromuscular
    disorder that is present in every affected human?
  attaches_to:
  - pathophysiology#Neuromuscular Dysfunction
  - pathophysiology#Defective Node of Ranvier Assembly and Maintenance
  rationale: >-
    This is a mismatch of translational validity rather than a gap in evidence:
    the mouse data exist and are consistent, but the organism-level phenotype
    does not follow. Three explanations are on the table, and they are not
    mutually exclusive. (1) Redundancy within the L1-family Ig-CAMs: L1cam,
    Chl1 and Nfasc could substitute in mouse, and at the node gliomedin
    provides a partially redundant glial clustering signal — consistent with
    the observation that only the gliomedin/NrCAM double knockout produces node
    disintegration with slowed conduction. (2) Transcriptional adaptation
    triggered by nonsense-mediated decay of the null transcript, the mechanism
    invoked to explain phenotypic discrepancies between complete-gene knockouts
    and other disruptions of the same gene; notably, the first L1cam knockout
    mice were also mild until moved to a different genetic background. (3) True
    species divergence in the protein: the KGE integrin-recognition and RNRR
    furin motifs of the human third Fn-III domain — the human variant hotspot —
    are poorly conserved in zebrafish Nrcam, and the zebrafish domain-deletion
    mutant is correspondingly mild. Distinguishing these matters practically,
    because it determines whether any mouse model can serve as a preclinical
    platform for this disorder.
  proposed_experiments:
  - experiment_id: l1_family_compound_mutants
    name: L1-family compound mutants and genetic background sensitization
    description: >-
      Generate Nrcam-null mice compound with heterozygous or conditional loss of
      L1cam, Chl1 and Nfasc, and cross the Nrcam null onto additional inbred
      backgrounds, testing whether a neuromuscular phenotype emerges. A positive
      result supports redundancy or background modification over species
      divergence.
  - experiment_id: fn3_missense_knockin
    name: Knock-in of human-equivalent Fn-III domain 3 missense alleles
    description: >-
      Rather than a null, knock in the mouse equivalents of p.Arg853Cys,
      p.Lys902Thr and p.Gly913Asp. If a missense allele that escapes
      nonsense-mediated decay produces a neuromuscular phenotype where the null
      does not, transcriptional adaptation is implicated.
  - experiment_id: ipsc_motor_neuron_schwann_coculture
    name: Human iPSC-derived motor neuron and Schwann cell co-culture
    description: >-
      Differentiate patient-derived and isogenic-corrected iPSCs into motor
      neurons co-cultured with Schwann cells, and quantify node of Ranvier
      assembly and sodium channel clustering. This tests the nodal mechanism in
      human cells, bypassing the species question entirely.

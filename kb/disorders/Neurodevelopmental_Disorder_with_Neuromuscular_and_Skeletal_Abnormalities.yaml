    causal_link_type: DIRECT
  - target: Defective Node of Ranvier Assembly and Maintenance
    causal_link_type: DIRECT
    description: >-
      NrCAM is one of the two glial adhesion molecules that deliver the nodal
      clustering signal, so loss of its adhesion function acts directly on node
      assembly.
    evidence:
    - reference: PMID:25459119
      reference_title: '[New insights on the organization of the nodes of Ranvier].'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The axo-glial contact at nodes implicates adhesion molecules expressed
        by the Schwann cell (gliomedin and NrCAM), which binds a partner,
        neurofascin-186, on the axonal side.
      explanation: >-
        Places NrCAM-mediated adhesion immediately upstream of node assembly.
  - target: Impaired Synaptogenesis and Dendritic Spine Remodeling
    causal_link_type: DIRECT
  evidence:

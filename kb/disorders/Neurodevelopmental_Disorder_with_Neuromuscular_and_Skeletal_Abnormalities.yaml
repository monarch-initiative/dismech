    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nrcam has also been proven integral for formation and maintenance of nodes
      of Ranvier on myelinated axons, and peripheral nerves of Nrcam-deficient

pathophysiology:
- name: Bi-allelic NRCAM Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous or compound heterozygous NRCAM variants — nonsense, frameshift,
    canonical splice-site and deep-intronic splice-disrupting alleles, and
    damaging missense substitutions — abolish or degrade NrCAM protein function.
    Missense variants are predicted to change residue polarity and/or charge and
    so perturb the protein's electrostatic surface and its protein-protein
    interaction interfaces; truncating alleles remove the C-terminal region
    including the third Fn-III domain.
  genes:
  - preferred_term: NRCAM
    term:
      id: hgnc:7994
      label: NRCAM
  genetic_context:
    gene:
      preferred_term: NRCAM
      term:
        id: hgnc:7994
        label: NRCAM
    allele_type: SNV, indel, and splice-site variants
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Bi-allelic germline variants; both homozygous (consanguineous/founder
      families) and compound heterozygous genotypes are reported. Loss-of-function
      alleles trend toward a more severe phenotype than missense alleles, but the
      correlation is not absolute.
  downstream:
  - target: Impaired NrCAM-Mediated Neural Cell Adhesion
    causal_link_type: DIRECT
    description: >-
      The variants act on the adhesion protein itself, so the link from genotype
      to loss of adhesion function is direct.
    evidence:
    - reference: PMID:35108495
      reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Computational analyses of NRCAM variants, many of which cluster in the
        third fibronectin type III (Fn-III) domain, strongly suggest a
        deleterious effect on NRCAM structure and function, including possible
        disruption of its interactions with other proteins.
      explanation: >-
        Structural modeling links the disease alleles directly to impaired NrCAM
        function and protein-protein interaction.
  evidence:
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-

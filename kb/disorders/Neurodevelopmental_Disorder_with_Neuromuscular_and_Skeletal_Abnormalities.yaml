notes: >-
  Curation note on the disorder name. The OMIM/MONDO label foregrounds
  "neuromuscular and skeletal abnormalities", and the OMIM clinical synopsis for
  OMIM:619833 records scoliosis (5/9), hip dysplasia (3/9), pes cavus (3/9),
  coxa valga, acetabular dysplasia, hammertoe and distal arthrogryposis. Those
  counts derive from Table 1 of the founding case series (PMID:35108495), which
  is a figure/table asset and is not present in the extractable text of the
  cached reference; the narrative text and abstract of that paper describe the
  neurological and neuromuscular phenotype only and never use the words
  "scoliosis", "skeletal", or "contracture". The skeletal phenotypes below are
  therefore curated with ontology terms and descriptions but WITHOUT
  exact-quote evidence items, rather than with a fabricated snippet, per the
  evidence SOP. See the KNOWLEDGE_GAP discussion "skeletal_phenotype_evidence".

  Seizures are deliberately NOT curated as a phenotype of this disorder. The
  OMIM clinical synopsis and the deep-research reports both surface a single
  seizure case, but PMID:35108495 attributes it to a confounder rather than to
  NRCAM: individual 1 carries a concomitant homozygous loss-of-function CD55
  variant, and the paper states that "Shortly after PLE onset, he suffered from
  seizures attributed to sinus vein thrombosis secondary to the CD55 loss, which
  resolved on treatment with eculizumab." A seizure with an identified
  non-NRCAM cause in the one individual who had it is not evidence that this
  disorder causes seizures. The same individual's eculizumab treatment is
  likewise kept out of the treatments block. Individual 3's mosaic KRAS variant
  is a second, independent confounder in the founding cohort.

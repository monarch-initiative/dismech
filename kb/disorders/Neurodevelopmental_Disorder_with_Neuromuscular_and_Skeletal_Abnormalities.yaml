diagnosis:
- name: Exome or Genome Sequencing
  diagnosis_term:
    preferred_term: exome or genome sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  description: >-
    Molecular diagnosis rests on exome or genome sequencing with Sanger
    confirmation and segregation analysis; there is no biochemical marker. Every
    reported case was ascertained this way, and the founding cohort was
    assembled through GeneMatcher after each family's variant was found
    independently. Genome sequencing was required in one family whose causal
    allele was a deep-intronic splice variant invisible to exome sequencing, and
    runs-of-homozygosity assessment supported the homozygous nonsense allele in
    the second report.
  evidence:
  - reference: PMID:36606341
    reference_title: Bi-allelic loss of function variant in the NRCAM gene is associated with motor-predominant axonal polyneuropathy; the second report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing (WES), in parallel with WES-based CNV detection and
      assessment of homozygosity runs, was performed to identify this patient's
      possible genetic cause.
    explanation: >-
      Describes the diagnostic strategy that established the molecular
      diagnosis.
- name: Nerve Conduction Studies and Electromyography
  diagnosis_term:
    preferred_term: Electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  description: >-
    Nerve conduction studies and needle EMG characterize the peripheral nerve
    lesion and establish whether it is axonal or demyelinating. In the second reported case they showed reduced motor CMAP
    amplitudes with preserved velocities and chronic neurogenic changes with
    spontaneous activity, initially suggesting distal spinal muscular atrophy.
  evidence:
  - reference: PMID:36606341
    reference_title: Bi-allelic loss of function variant in the NRCAM gene is associated with motor-predominant axonal polyneuropathy; the second report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Needle examination showed chronic neurogenic changes and spontaneous
      activity in leg muscles (proximal and distal).
    explanation: >-
      The electrophysiological findings used diagnostically in an affected
      individual.
differential_diagnoses:
- name: L1 Syndrome (L1CAM-related)
  description: >-
    X-linked L1CAM variants cause congenital hydrocephalus and spastic
    paraplegia. The overlap with NEDNMS is mechanistic, not coincidental — both
    genes encode L1-family Ig-CAMs — but the inheritance (X-linked vs autosomal
    recessive) separates them.
  evidence:
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      variants inL1CAM(MIM:308840) have been implicated in the most common cause
      for X-linked congenital syndromic and non-syndromic hydrocephalus, as well
      as several non-hydrocephalus phenotypes characterized by spastic
      paraplegia
    explanation: >-
      Describes the L1CAM phenotype that overlaps NEDNMS. The gene symbol runs
      together with the surrounding words in the cached text; the quote
      reproduces it verbatim.
- name: NFASC-related neurodevelopmental disorder with central and peripheral motor dysfunction
  description: >-
    Bi-allelic NFASC variants (the neurofascin binding partner of NrCAM at the
    node of Ranvier) cause a phenotypically very similar autosomal recessive
    disorder combining central and peripheral motor dysfunction; the founding
    NRCAM report explicitly draws this parallel.
  evidence:
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is also observed in individuals withNFASCvariants, and spastic paraparesis
      is observed in individuals withL1CAMmutations
    explanation: >-
      The founding report names NFASC (and L1CAM) as producing the same variable
      neurological and neuromuscular phenotype. Gene symbols run together with
      the surrounding words in the cached text and are reproduced verbatim.
- name: Charcot-Marie-Tooth disease and distal spinal muscular atrophy
  description: >-
    The mild, neuropathy-only end of the NRCAM spectrum is clinically
    indistinguishable from CMT2/distal hereditary motor neuropathy; the second
    reported patient carried a working diagnosis of distal SMA and had SMN1
    exon 7 deletion excluded before exome sequencing.
  evidence:
  - reference: PMID:36606341
    reference_title: Bi-allelic loss of function variant in the NRCAM gene is associated with motor-predominant axonal polyneuropathy; the second report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on the primary diagnosis of motor neuropathy or distal spinal
      muscular atrophy, the initial molecular analysis by real‐time PCR and MLPA
      for exon 7 of the SMN1 gene revealed no exon deletion in this patient.
    explanation: >-
      Documents distal SMA as the working differential that had to be excluded
      before the NRCAM diagnosis was made.
- name: Cerebral palsy
  description: >-
    Cerebral palsy is recorded as a feature in the OMIM clinical synopsis for
    OMIM:619833 (3/10) and appears in the abbreviation key of the founding
    report's clinical table, so a clinical label of cerebral palsy preceded the
    genetic diagnosis in some individuals. This is the recurring pattern in
    early-onset genetic spasticity/hypotonia syndromes and makes NEDNMS a
    consideration in "cerebral palsy" of unexplained cause.
  notes: >-
    No exact-quote evidence item is attached. Table 1 of PMID:35108495 is where
    the per-individual detail sits; its abbreviation key ("CP, cerebral palsy")
    survives in the cached text but the data rows do not, and a key is not a
    count.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    No disease-specific or targeted therapy exists. Management is entirely
    supportive: feeding support for failure to thrive, respiratory support in
    the most severely affected infants, and multidisciplinary
    neurodevelopmental follow-up.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  notes: >-
    No pharmacological, gene-therapy, RNA-based or targeted therapy has been
    reported or is in development for this disorder, and no registered clinical
    trial was identified. Gastrostomy tube feeding in infancy is recorded in
    the OMIM clinical synopsis for OMIM:619833 (2/9); as with the skeletal
    phenotypes, that count comes from Table 1 of PMID:35108495 and is not in the
    extractable text of the cached reference, so no evidence item is attached
    and specific interventions are not asserted in the description.

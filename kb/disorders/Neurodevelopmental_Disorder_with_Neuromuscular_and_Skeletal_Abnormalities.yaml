- name: Neuromuscular Dysfunction
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The convergent clinical output of peripheral nerve involvement and
    corticospinal/central involvement is a neuromuscular phenotype that is
    present in every reported individual, though its polarity differs: either
    hypotonia with peripheral neuropathy, or spasticity and hypertonia. The
    founding report proposes misrouting of nerve fibres as the common origin of
    both poles. Muscle weakness predominates distally and in the lower limbs in
    the neuropathy-predominant individuals.
  downstream:
  - target: Secondary Musculoskeletal Deformity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no single feature is observed in 100% of the affected individuals
      described here, although different neuromuscular abnormalities, e.g.,
      neuropathy, hypotonia, or spasticity, are present in all individuals
    explanation: >-
      Neuromuscular abnormality is the one universal feature of the disorder,
      which is why it is modeled as the convergent organism-level node.
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The observed diverse clinical manifestations of either neuropathy and
      hypotonia or spasticity in affected individuals may result from misrouting
      of nerve fibers.
    explanation: >-
      The authors' proposed mechanism linking the adhesion/guidance defect to
      both poles of the neuromuscular phenotype.
- name: Global Neurodevelopmental Impairment
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Global developmental delay with cognitive impairment of congenital onset is
    the dominant central manifestation, present in seven of the ten individuals
    of the founding cohort. It is absent in the mildest phenotype (isolated
    late-onset peripheral neuropathy) and, in one individual with a severe
    neonatal presentation, resolved with age.
  downstream:
  - target: Secondary Musculoskeletal Deformity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35108495
    reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals, excluding the proband of family 7 and the
      brothers of family 8, presented with global developmental delay (GDD) and
      cognitive impairment, combined with either hypotonia and neuropathy or
      spasticity.
    explanation: >-
      Establishes global developmental delay with cognitive impairment as the
      dominant, but not universal, central phenotype.
- name: Secondary Musculoskeletal Deformity
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Scoliosis, hip dysplasia/acetabular dysplasia, coxa valga, pes cavus,
    hammertoe and distal arthrogryposis are recorded in the OMIM clinical
    synopsis for this disorder and give the entity its name. No cell-autonomous
    role for NRCAM in bone or cartilage has been reported, and NRCAM is
    characterized throughout the literature as a nervous-system adhesion
    molecule; the skeletal findings are therefore modeled here as secondary to
    chronic abnormal biomechanical loading from hypotonia, spasticity and
    neurogenic muscle weakness — the same route by which scoliosis, hip
    subluxation and cavus foot arise in other early-onset neuromuscular
    disorders. This is an inference, not a demonstrated mechanism; it is
    flagged as a KNOWLEDGE_GAP and the confidence is HYPOTHETICAL.
  notes: >-
    No exact-quote evidence item is attached to this node because no cited
    publication states the skeletal mechanism. Deliberately left unsupported
    rather than justified with a snippet that does not make the claim.
  evidence:
  - reference: PMID:36606341
    reference_title: Bi-allelic loss of function variant in the NRCAM gene is associated with motor-predominant axonal polyneuropathy; the second report.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He also has lordosis and abnormal gait with limitations in walking ability
      (he can walk with braces).
    explanation: >-
      Documents a spinal deformity (lordosis) co-occurring with the
      motor-predominant neuropathy and gait limitation in an affected
      individual. It is consistent with, but does not demonstrate, the proposed
      neuromuscular route to skeletal deformity; hence PARTIAL.

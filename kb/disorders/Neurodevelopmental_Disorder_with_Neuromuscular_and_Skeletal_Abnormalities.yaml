genetic:
- name: NRCAM
  gene_term:
    preferred_term: NRCAM
    term:
      id: hgnc:7994
      label: NRCAM
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    NRCAM (7q31.1) encodes neuronal cell adhesion molecule, an L1-family
    Ig-superfamily transmembrane adhesion protein of the canonical 1,304-residue
    isoform with six Ig-like domains, five fibronectin type III repeats, a
    transmembrane segment and a short cytoplasmic tail. Reported disease alleles
    include nonsense (p.Glu111*, p.Arg929*, p.Gln25*), frameshift
    (p.Thr766Ilefs*4), canonical (c.2647-2A>G) and deep-intronic
    (c.230+824G>C) splice variants, and missense substitutions in Ig-like
    domains 1, 2 and 5 (p.Asp55Gly [see the provenance caveat below],
    p.Ser134Pro, p.Gly197Asp, p.Asn469Ser) and
    in the third Fn-III domain (p.Arg853Cys, p.Lys902Thr, p.Gly913Asp). Alleles
    cluster in the third Fn-III domain, whose KGE and RNRR motifs and predicted
    docking surface implicate it as a protein-protein interaction interface.
    Loss-of-function alleles trend toward greater severity, but the second
    reported family shows that a nonsense allele can produce a mild,
    neuropathy-only phenotype, so variant class alone is not predictive.
    Population constraint is consistent with the recessive mechanism: gnomAD
    reports pLI approximately 0 (2.6e-11) with LOEUF 0.64 and observed/expected
    loss-of-function 0.53 (83 observed vs 156.5 expected, LoF Z = 4.99), i.e.
    NRCAM is under selection against loss-of-function alleles but is not
    haploinsufficient - which is what unaffected heterozygous parents require.
    These figures were read directly from the gnomAD GraphQL API on 2026-08-18
    (GRCh38) rather than from a publication, so they carry no evidence item.
    Note also that cDNA coordinates are deliberately not
    asserted for the missense alleles below: the paper's narrative names the
    protein changes, but the per-individual cDNA mapping lives in its Table 2,
    which is not in the extractable text of the cached reference. Each variant
    is therefore keyed on the protein designation that is quotable, with cDNA
    given only for the three alleles whose narrative or abstract states it. One
    allele is an acknowledged exception to that rule: for p.Asp55Gly the
    narrative names only the residue Asp55, in the solvent-exposure list, and
    not the Gly substitution, the Ig-like domain 1 assignment, or the compound
    heterozygosity with c.230+824G>C. Those three details come from Table 2 as
    transcribed in the claude_code deep-research report, and are retained
    because they are internally consistent and independently checkable (c.164
    falls in codon 55; GAC to GGC is Asp to Gly; individual 3 is the
    genome-sequenced individual carrying the deep-intronic allele) - but they
    are DR-sourced, not narrative-sourced, and the attached evidence item is
    scoped to solvent exposure only. The other twelve alleles are keyed on
    designations the narrative or abstract states directly.
    ACMG/AMP clinical significance is likewise not asserted per allele, because
    the original reports' per-variant classifications are table content rather
    than narrative.
  variants:
  - name: p.Asp55Gly
    description: >-
      Missense substitution in the first Ig-like domain, found in compound
      heterozygosity with the deep-intronic c.230+824G>C allele. The residue is
      solvent-exposed. See the genetic notes: the substitution, domain
      assignment and pairing are transcribed from Table 2 via the deep-research
      report rather than from the paper's narrative, which names only the
      residue Asp55.
    gene:
      preferred_term: NRCAM
      term:
        id: hgnc:7994
        label: NRCAM
    type: missense
    evidence:
    - reference: PMID:35108495
      reference_title: Bi-allelic variants in neuronal cell adhesion molecule cause a neurodevelopmental disorder characterized by developmental delay, hypotonia, neuropathy/spasticity.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Based on the obtained structural models, all substituted amino acids
        (Asp55, Ser134, Gly197, Asn469, Arg853, Lys902, and Gly913) appear
        exposed to the solvent
      explanation: >-
        Structural modeling places Asp55 among the solvent-exposed substituted
        residues.
  - name: p.Ser134Pro
    description: >-
      Missense substitution in Ig-like domain 1. The residue is solvent-exposed and the
      substitution changes polarity and/or charge, so it is predicted to perturb
      the electrostatic surface and protein-protein interaction interfaces.

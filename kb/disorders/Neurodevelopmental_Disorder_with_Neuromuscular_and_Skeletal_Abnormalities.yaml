  - reference: PMID:8947556
    reference_title: 'Molecular composition of the node of Ranvier: identification of ankyrin-binding cell adhesion molecules neurofascin (mucin+/third FNIII domain-) and NrCAM at nodal axon segments.'
    supports: SUPPORT

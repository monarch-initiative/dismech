- name: Sensory Pathway Miswiring
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    NrCAM is expressed at the optic chiasm and on cochlear spiral ganglion
    afferents, olivocochlear efferents and cochlear hair and supporting cells.
    Nrcam-null mice mistarget thalamic axons to visual cortex and have abnormal
    visual-evoked potentials, and Nrcam-null cochleae show type II spiral
    ganglion fasciculation errors and reduced efferent innervation. This is the
    proposed basis for the abnormal VEPs, optic atrophy, strabismus and
    auditory findings in affected individuals. A translational caveat applies:
    the cochlear defects in mice are transient and adult Nrcam-null mice hear
    normally, whereas some affected individuals have persistent hearing
    impairment.
  biological_processes:
  - preferred_term: retinal ganglion cell axon guidance
    modifier: ABNORMAL
    term:
      id: GO:0031290
      label: retinal ganglion cell axon guidance
  downstream:

    explanation: >-
      Establishes NrCAM as an ankyrin-binding L1-family adhesion molecule, the
      molecular basis of the coupling lost in this disorder.
- name: Defective Axon Growth and Guidance
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    NrCAM is expressed on growing and crossing axons and on the specialized
    midline glia they navigate (floor plate, optic chiasm, median eminence), and
    it partners with contactin-1/TAG-1 to promote neurite extension. Nrcam-null
    cerebellar granule cells fail to extend neurites on contactin-1 substrate,
    and Nrcam-deficient mice mistarget motor and somatosensory thalamic axons to
    the visual cortex. Loss of this guidance function is the proposed origin of
    the misrouted central and peripheral fibre tracts in affected individuals.

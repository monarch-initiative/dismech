- name: Cortical Circuit Dysfunction
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Excess dendritic spines and asymmetric synapses with increased mEPSC
    frequency in NrCAM-null cortex predict a shift in excitatory/inhibitory
    balance in neocortical circuits. This is the proposed cellular substrate for
    the cognitive impairment and the behavioural phenotype (irritability,
    aggression, self-injurious behaviour) in affected individuals, but it is an
    extrapolation from mouse visual cortex and has not been measured in humans.
  biological_processes:

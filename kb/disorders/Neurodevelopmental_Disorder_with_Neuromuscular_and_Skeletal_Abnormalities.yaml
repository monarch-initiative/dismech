- name: Impaired Synaptogenesis and Dendritic Spine Remodeling
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: PROVISIONAL
  description: >-
    Beyond its presynaptic and axonal roles, NrCAM acts postsynaptically as an
    integral component of the Semaphorin 3F receptor complex with Neuropilin-2
    and PlexinA3, and is required for Sema3F-induced dendritic spine pruning.
    NrCAM-null mice show elevated spine density, increased asymmetric synapse
    number and increased miniature EPSC frequency in visual cortex, i.e. a shift
    in excitatory/inhibitory balance. This arm is mechanistically well supported
    in the mouse but has not been demonstrated in tissue from affected
    individuals, hence the provisional confidence.
  biological_processes:

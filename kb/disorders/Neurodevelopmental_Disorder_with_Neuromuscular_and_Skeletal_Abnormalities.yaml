  - reference: PMID:16039564
    reference_title: Gliomedin mediates Schwann cell-axon interaction and the molecular assembly of the nodes of Ranvier.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We report the identification of gliomedin, a glial ligand for neurofascin
      and NrCAM, two axonal immunoglobulin cell adhesion molecules that are
      associated with Na+ channels at the nodes of Ranvier.
    explanation: >-
      Identifies the glial ligand that NrCAM binds at the node, completing the

pathophysiology:
- name: SLC11A2/DMT1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic SLC11A2 variants reduce or abolish functional DMT1, the
    proton-coupled divalent metal transporter that carries ferrous iron across
    membranes. Different alleles act by different molecular routes - defective
    protein processing and endoplasmic-reticulum retention (R416C), lysosomal
    mis-accumulation and degradation (G75R), or exon skipping that leaves only a
    small amount of functional transporter (E399D) - but all converge on
    quantitatively reduced DMT1 activity.
  genes:
  - preferred_term: SLC11A2
    term:
      id: hgnc:10908
      label: SLC11A2
  molecular_functions:
  - preferred_term: iron ion transmembrane transporter activity
    modifier: DECREASED
    term:
      id: GO:0005381
      label: iron ion transmembrane transporter activity
  evidence:
  - reference: PMID:15459009
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here the first human mutation of DMT1 identified in a female with
      severe hypochromic microcytic anemia and iron overload.
    explanation: >-
      Establishes DMT1/SLC11A2 loss of function as the cause of the human
      disease.
  - reference: PMID:16584902
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that DMT1(C1246T) (R416C) represents a complete loss-of-function,
      and that a quantitative reduction in DMT1 expression is the cause of the
      microcytic anemia and iron overload in the patient.
    explanation: >-
      Functional characterisation showing a disease allele is a complete
      loss-of-function producing a quantitative reduction in transporter.
  downstream:
  - target: Impaired Erythroid Transferrin-Cycle Iron Utilization
    description: >-
      DMT1 releases transferrin-cycle iron from recycling endosomes into the
      cytosol of erythroid precursors; its loss blocks this erythroid iron use.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16160008
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Divalent metal transporter 1 (DMT1) mediates apical iron uptake in duodenal
        enterocytes and iron transfer from the transferrin receptor endosomal cycle
        into the cytosol in erythroid cells.
      explanation: >-
        Names the erythroid transferrin-endosomal-cycle iron transfer that DMT1
        loss disrupts.
  - target: Impaired Duodenal Iron Absorption
    description: >-
      DMT1 mediates apical (brush-border) iron uptake in duodenal enterocytes,
      so its loss impairs dietary iron absorption.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16023393
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        DMT1 (Nramp2, Slc11a2) mediates iron uptake at the intestinal brush border
        and across the membrane of acidified endosomes.
      explanation: >-
        Names the brush-border absorptive function that DMT1 loss impairs.
  - target: Hepatic Iron Overload via DMT1-Independent Uptake
    description: >-
      Liver iron uptake does not require DMT1, so its loss does not protect the
      liver; hepatic iron loading proceeds through other pathways.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16160008
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The early onset of iron overload indicates that, as in animal models, DMT1
        is dispensable for liver iron uptake, whereas its deficiency in the gut is
        likely bypassed by the up-regulation of other pathways of iron use.
      explanation: >-
        States that liver iron uptake is DMT1-independent, the basis for the
        paradoxical hepatic overload.
- name: Impaired Erythroid Transferrin-Cycle Iron Utilization
  biological_scale: CELLULAR
  description: >-
    In erythroid precursors, iron delivered by transferrin is internalised
    through the transferrin-receptor cycle and must be exported from the
    recycling endosome into the cytosol by DMT1 to reach the mitochondrion for
    haem synthesis. Loss of DMT1 leaves iron trapped in the endosome, starving
    haemoglobin synthesis despite adequate whole-body iron.
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  biological_processes:
  - preferred_term: iron ion transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0034755
      label: iron ion transmembrane transport
  cellular_components:
  - preferred_term: recycling endosome
    term:
      id: GO:0055037
      label: recycling endosome
  evidence:
  - reference: PMID:35457224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DMT1 has a vital role in iron homeostasis by mediating iron uptake in the
      intestine and kidneys and by recovering iron from recycling endosomes after
      transferrin endocytosis.
    explanation: >-
      Establishes the recycling-endosome iron-recovery step that is lost in
      erythroid precursors.
  downstream:
  - target: Microcytic anemia
    description: >-
      Failure of erythroid iron utilization blocks haemoglobin synthesis,
      producing hypochromic microcytic anemia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15459009
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        deficient iron utilization in erythroid precursors
      explanation: >-
        Names the deficient erythroid iron utilization that produces the anemia.
- name: Impaired Duodenal Iron Absorption
  biological_scale: CELLULAR
  description: >-
    DMT1 imports dietary ferrous iron across the apical brush-border membrane of
    duodenal enterocytes. Its loss impairs intestinal iron absorption; in humans,
    however, this is partly bypassed by up-regulation of other absorptive
    pathways, so intestinal loss alone does not produce iron deficiency.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: iron ion transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0034755
      label: iron ion transmembrane transport
  cellular_components:
  - preferred_term: brush border membrane
    term:
      id: GO:0031526
      label: brush border membrane
  evidence:
  - reference: PMID:15459009
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Divalent metal transporter 1 (DMT1) is a transmembrane protein crucial for
      duodenal iron absorption and erythroid iron transport.
    explanation: >-
      Establishes the duodenal iron-absorption function impaired by DMT1 loss.
  downstream:
  - target: Microcytic anemia
    description: >-
      Reduced dietary iron absorption compounds the erythroid iron deficit,
      although in humans it is largely bypassed by other absorptive pathways.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16160008
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        its deficiency in the gut is likely bypassed by the up-regulation of other
        pathways of iron use
      explanation: >-
        Records that the intestinal absorption defect is partly compensated,
        limiting its contribution to the phenotype.
- name: Hepatic Iron Overload via DMT1-Independent Uptake
  biological_scale: TISSUE
  description: >-
    Because hepatocyte iron uptake does not require DMT1, and serum iron and
    transferrin saturation are high, the liver continues to acquire iron through
    DMT1-independent routes - non-transferrin-bound iron entering hepatocytes
    probably via the ZIP14 transporter. Transfusion and oral iron given for the
    anemia further exacerbate this loading.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:35457224
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This DMT1-independent iron acquisition, in a high serum iron level condition,
      is performed probably through the ZIP14 transporter
    explanation: >-
      Names the DMT1-independent hepatic uptake route (ZIP14) operating under high
      serum iron. Cited as MODEL_ORGANISM because this sentence describes the
      Belgrade rat.
  downstream:
  - target: Elevated hepatic iron concentration
    description: >-
      Continued DMT1-independent hepatic iron acquisition deposits iron in the
      liver.
    causal_link_type: DIRECT

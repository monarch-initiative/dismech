genetic:
- name: SLC11A2 biallelic pathogenic variants
  gene_term:
    preferred_term: SLC11A2
    term:
      id: hgnc:10908
      label: SLC11A2
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported causative alleles include the homozygous exon-12 splice/E399D
    variant (first case), the compound heterozygous intron-4 deletion plus R416C,
    the G212V and N491S trafficking-defective variants, and the recurrent G75R
    (a possible founder allele in Ecuadorian patients). Variants act through
    defective processing, ER retention, lysosomal degradation, or aberrant
    splicing, all reducing functional DMT1.
  evidence:
  - reference: PMID:15459009
    reference_title: Identification of a human mutation of DMT1 in a patient with microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here the first human mutation of DMT1 identified in a female with
      severe hypochromic microcytic anemia and iron overload.
    explanation: >-
      The first reported causative SLC11A2/DMT1 genotype.
  - reference: PMID:16160008
    reference_title: Microcytic anemia and hepatic iron overload in a child with compound heterozygous mutations in DMT1 (SCL11A2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The novel mutations were a 3-bp deletion in intron 4 (c.310-3_5del CTT)
      resulting in a splicing abnormality and a C>T transition at nucleotide
      1246(p. R416C).
    explanation: >-
      An independent biallelic (compound heterozygous) causative genotype.
  - reference: PMID:21871825
    reference_title: A novel N491S mutation in the human SLC11A2 gene impairs protein trafficking and in association with the G212V mutation leads to microcytic anemia and liver iron overload.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the N491S mutation, through its deleterious effect on protein trafficking,
      contributes together with the G212V mutation to the development of anemia and
      hepatic iron overload.
    explanation: >-
      A further biallelic genotype (G212V plus N491S) with a trafficking-based
      mechanism.
diagnosis:
- name: Iron studies with SLC11A2 sequencing
  description: >-
    The combination of hypochromic microcytic anemia with high serum iron,
    increased transferrin saturation, low-to-normal ferritin, raised soluble
    transferrin receptor, and hepatic iron overload distinguishes AHMIO1 from
    iron-deficiency anemia; SLC11A2 sequencing confirms the diagnosis and
    prevents counterproductive iron therapy.
  evidence:
  - reference: PMID:19786204
    reference_title: "Mutations in the gene encoding DMT1: clinical presentation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum markers could be particularly useful to establish a correct diagnosis:
      high serum iron, normal total iron-binding capacity (TIBC), increased
      saturation of transferrin (Tf), slightly elevated ferritin, and increased
      soluble transferrin receptor (sTfR).
    explanation: >-
      Names the serum-marker pattern used to reach the diagnosis.
treatments:
- name: Recombinant erythropoietin
  description: >-
    Recombinant erythropoietin is the reported treatment of choice: all described
    patients responded, with improved haemoglobin. Mean corpuscular volume and
    mean corpuscular haemoglobin did not change during treatment, so erythropoietin
    is thought to act by reducing erythroblast apoptosis (relieving ineffective
    erythropoiesis) rather than by improving erythroid iron utilization, and it may
    also help mobilise excess hepatic iron.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant erythropoietin
      term:
        id: NCIT:C477
        label: Recombinant Erythropoietin
  target_phenotypes:
  - preferred_term: Hypochromic microcytic anemia
    term:
      id: HP:0004840
      label: Hypochromic microcytic anemia
  evidence:
  - reference: PMID:19786204
    reference_title: "Mutations in the gene encoding DMT1: clinical presentation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients appeared to respond to erythropoietin (Epo) administration.
    explanation: >-
      Reports the erythropoietin response across the affected patients.
  - reference: PMID:19786204
    reference_title: "Mutations in the gene encoding DMT1: clinical presentation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it was concluded that Epo did not improve iron utilization of the erythroblasts
      but likely reduced the degree or intensity of apoptosis, affecting
      erythropoiesis.
    explanation: >-
      States the proposed mechanism of erythropoietin benefit (reduced apoptosis,
      not improved iron use).
- name: Avoidance of iron supplementation and routine transfusion
  description: >-
    Oral iron and transfusion - the default management of a microcytic anemia -
    are counterproductive here because hepatic iron uptake is DMT1-independent, so
    added iron worsens the overload. Recognising the disease early to avoid these
    treatments is a management priority.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Elevated hepatic iron concentration
    term:
      id: HP:0012465
      label: Elevated hepatic iron concentration
  evidence:
  - reference: PMID:35457224
    reference_title: New Cases of Hypochromic Microcytic Anemia Due to Mutations in the SLC11A2 Gene and Functional Characterization of the G75R Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest that liver iron accumulation observed in some AHMIO1 patients might
      be exacerbated by transfusions and/or oral iron supplements, the gold standard
      treatments for general anemic patients.
    explanation: >-
      Directly supports avoiding iron supplementation and transfusion because they
      aggravate the iron overload.

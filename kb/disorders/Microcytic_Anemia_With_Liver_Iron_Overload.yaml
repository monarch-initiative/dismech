discussions:
- discussion_id: ahmio1_human_model_hepatic_overload_mismatch
  prompt: >-
    Why do humans with biallelic SLC11A2/DMT1 loss develop hepatic iron overload
    when the mk mouse and Belgrade rat carrying the analogous G185R mutation are
    iron-deficient rather than iron-overloaded?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatic Iron Overload via DMT1-Independent Uptake
  - animal_models#Mouse
  rationale: >-
    The erythroid and intestinal iron-transport failure of DMT1 deficiency is
    faithfully reproduced by the rodent models, but the paradoxical hepatic iron
    overload that names the human disease is not: the mk mouse and Belgrade rat
    are iron-deficient. The divergence is mechanistically meaningful because it
    localises the open question to the hepatic arm - whether a species difference
    in DMT1-independent hepatic uptake (for example ZIP14-mediated
    non-transferrin-bound iron entry under high serum iron), in dietary iron
    handling, or in iatrogenic iron exposure explains why humans load hepatic iron
    while the analogous rodents do not.
  proposed_experiments:
  - experiment_id: exp_ahmio1_cross_species_hepatic_iron
    name: Cross-species comparison of DMT1-independent hepatic iron uptake
    description: >-
      Compare hepatic non-transferrin-bound-iron uptake and ZIP14 expression in
      DMT1-mutant mk mice and Belgrade rats against human AHMIO1 liver tissue
      under matched high-serum-iron conditions, to determine whether a species
      difference in the DMT1-independent hepatic route explains the divergent
      iron-overload phenotype.
    experiment_type:
      preferred_term: cross-species model comparison experiment
  - experiment_id: exp_ahmio1_iron_loaded_rodent_hepatic
    name: Controlled iron loading of DMT1-mutant rodents
    description: >-
      Systematically iron-load DMT1-mutant rodents (as with the reported iron
      dextran injection in the Belgrade rat) and quantify hepatic iron deposition
      and its ZIP14 dependence, to test whether the human hepatic overload
      reflects the DMT1-independent route operating under the high serum iron of
      untreated or transfused patients.
    experiment_type:
      preferred_term: model-system iron-loading experiment
  evidence:
  - reference: PMID:15459009
    reference_title: Identification of a human mutation of DMT1 in a patient with microcytic anemia and iron overload.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      unlike the animal models of DMT1 mutation, the patient is iron overloaded
    explanation: >-
      Directly states the human-versus-model divergence in the iron-overload
      phenotype that this discussion is about.
notes: >-
  Named entity. The disease has the OMIM/Orphanet identity "anemia, hypochromic
  microcytic, with iron overload 1" (AHMIO1, OMIM #206100) and is caused by
  SLC11A2 encoding DMT1 (also called NRAMP2). It is distinct from the other
  congenital microcytic anemias and from the sideroblastic anemias: here the
  lesion is an iron transporter, not a heme-synthesis or iron-sulfur-cluster
  enzyme, and the hallmark is the pairing of iron-starved erythropoiesis with
  systemic and hepatic iron loading.

  The central paradox. Loss of one protein produces both iron deficiency in the
  erythron (blocked release of transferrin-cycle iron in red-cell precursors)
  and iron overload in the body (liver iron uptake is DMT1-independent, so it
  continues in the face of high serum iron). This is why the serum profile
  (high iron, high transferrin saturation, low-to-normal ferritin, high soluble
  transferrin receptor) looks contradictory and is diagnostically useful.

  Phenotype completeness. Two of the reported patients did not have documented
  hepatic iron overload, so "with liver iron overload" is characteristic but not
  universal; no frequency bands are assigned because the literature is a small
  case series.

  GeneReviews baseline. A PubMed search for a GeneReviews chapter on SLC11A2 /
  DMT1 microcytic anemia returned no result; the negative is recorded here so the
  check is visibly done. Phenotype and treatment content is therefore anchored to
  the primary case reports and the Iolascon review.

  No module conformance declared. There is no iron-metabolism or heme-synthesis
  module in kb/modules/ at present; a future iron-transport or
  iron-sulfur-cluster module would be the natural home for this entry alongside
  the sideroblastic anemias.

  Deep-research provenance. No automated deep-research report was generated: the
  deep-research providers were non-functional in the curation environment (no API
  keys). Content was instead built by directly mining the seven cached full
  texts/abstracts for this ultra-rare (~10-patient) disease, including the mk
  mouse / Belgrade rat model divergence, the ZIP14-mediated DMT1-independent
  hepatic uptake route, and the erythropoietin treatment rationale.

name: Microcytic Anemia With Liver Iron Overload
creation_date: "2026-09-02T00:00:00Z"
description: >-
  Microcytic anemia with liver iron overload (AHMIO1) is an ultra-rare autosomal
  recessive disorder caused by biallelic loss-of-function variants in SLC11A2,
  which encodes the divalent metal transporter 1 (DMT1). DMT1 performs two
  distinct iron-handling jobs: apical iron uptake at the duodenal brush border,
  and release of transferrin-cycle iron from recycling endosomes into the
  cytosol of erythroid precursors. Loss of the erythroid function starves
  developing red cells of iron for haemoglobin synthesis, producing a severe
  hypochromic microcytic anemia present from birth. The paradox that defines the
  disease is that this iron-deficient erythropoiesis coexists with systemic and
  hepatic iron overload: liver iron uptake does not depend on DMT1, so in the
  face of high serum iron and transferrin saturation the liver continues to load
  iron through DMT1-independent routes (non-transferrin-bound iron via ZIP14).
  Because standard management of a microcytic anemia (oral iron, transfusion)
  worsens the iron loading, correct early diagnosis is clinically important, and
  recombinant erythropoietin is the reported treatment of choice.
synonyms:
- AHMIO1
- anemia, hypochromic microcytic, with iron overload 1
- hypochromic microcytic anemia with iron overload
- microcytic anaemia and hepatic iron overload
- DMT1 deficiency
- SLC11A2-related microcytic anemia

name: SNF8-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodevelopmental disorder plus optic atrophy
  term:
    id: MONDO:0968947
    label: neurodevelopmental disorder plus optic atrophy
description: >-
  Neurodevelopmental disorder plus optic atrophy (NEDOA) is an autosomal
  recessive disorder caused by bi-allelic variants in SNF8, the gene encoding
  the SNF8 subunit of the ESCRT-II complex. It occupies the mild end of a
  two-part SNF8 disease spectrum: the severe end is developmental and epileptic
  encephalopathy 115, a congenital-onset encephalopathy with massive white
  matter loss and early death, while NEDOA presents as impaired intellectual
  development with optic atrophy, nystagmus, and in some individuals ataxia,
  and is compatible with survival into later childhood and beyond. Every
  individual reported at the mild end carried the same hypomorphic missense
  allele, c.304G>A (p.Val102Ile), so the milder phenotype is currently defined
  by genotype as much as by clinical features. ESCRT-II is the central module
  of the endosomal sorting complex required for transport pathway, bridging
  ESCRT-I to ESCRT-III on the endosomal membrane and thereby driving
  intralumenal vesicle formation, multivesicular body biogenesis, receptor
  downregulation, and autophagosome maturation. Patient fibroblasts carrying
  bi-allelic SNF8 variants lose ESCRT-II subunits, and the authors of the
  founding study attribute the neurodevelopmental and neurodegenerative
  phenotype principally to impaired autophagic flux. The disorder is
  ultra-rare: as of this curation the entire published clinical literature is a
  single 2024 report of nine individuals from six families spanning both ends
  of the spectrum.
parents:
- Neurodevelopmental Disorder
synonyms:
- NEDOA
- neurodevelopmental disorder plus optic atrophy
- SNF8-related syndromic optic atrophy
- VPS22-related neurodevelopmental disorder
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The entire reported morbidity is neurological and neuro-ophthalmological:
      impaired intellectual development in 4/4, optic atrophy in 3/4, speech and
      language delay, mild global developmental delay, and in one individual
      congenital ataxia, with brain and cerebellar atrophy on MRI. The optic
      neuropathy is a lesion of the anterior visual pathway - central nervous
      system tissue - rather than an ophthalmological disease of the globe, so
      NEUROLOGIC rather than an ophthalmology assignment is the correct single
      chapter. No systemic, cardiac, renal, hepatic, haematological or skeletal
      involvement has been reported at either end of the SNF8 spectrum.
    evidence:
    - reference: PMID:38423010
      reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report nine individuals from six families presenting with a spectrum of neurodevelopmental/neurodegenerative features caused by bi-allelic variants in SNF8"
      explanation: The founding report characterises the entire phenotype as neurodevelopmental and neurodegenerative, which is the basis for the NEUROLOGIC chapter assignment.
notes: >-
  Entity verification. The target term was verified with OAK before any content
  was written: `runoak -i sqlite:obo:mondo relationships --direction up
  MONDO:0968947` returns `RO:0004003 HGNC:17028 SNF8` and
  `rdfs:subClassOf MONDO:0100500 (Mendelian neurodevelopmental disorder)`, and
  the term xrefs OMIM:620784, MEDGEN:1859522, UMLS:C5935605. HGNC:17028 was
  confirmed against the HGNC REST API as symbol SNF8, name "SNF8 subunit of
  ESCRT-II", locus 17q21.32, with alias symbols EAP30, VPS22 and Dot3. That
  alias list matters for reading the literature: the structural papers cited
  here (PMID:18539118, PMID:15469844) name the same protein VPS22 and never use
  the string "SNF8", so those citations are about this gene despite the
  different symbol.

  Contrast entity, also verified with OAK rather than typed from memory. SNF8
  carries two distinct MONDO disease terms, and this entry curates only the
  milder one. `runoak -i sqlite:obo:mondo relationships --direction down
  HGNC:17028` returns exactly two subjects: MONDO:0968946 (developmental and
  epileptic encephalopathy 115, OMIM:620783) and MONDO:0968947 (this entry,
  OMIM:620784). DEE115 is curated below as an allelic differential diagnosis,
  not as a subtype or a parent. MONDO:0100500, the superclass of this entry, is
  deliberately NOT bound as a differential.

  Both MedGen concept records state autosomal recessive inheritance
  (C5935605: "Neurodevelopmental disorder plus optic atrophy (NEDOA) is an
  autosomal recessive disorder"; C5935604 likewise for DEE115), matching the
  "bi-allelic" language of the founding study. The HPO annotation set for
  OMIM:620784 nonetheless records HP:0000006 (Autosomal dominant inheritance).
  That HPOA inheritance annotation is judged to be an error and is NOT
  propagated into this entry; HP:0000007 is asserted instead, with the
  bi-allelic evidence quoted from the primary paper.

  Evidence base and its limits. PMID:38423010 (Brugger et al., Am J Hum Genet
  2024) is the only clinical publication describing this disorder. A PubMed
  search on 2026-08-01 for `(SNF8[TIAB] OR VPS22[TIAB]) AND (variant* OR
  mutation* OR patient*)` returned 20 records, of which PMID:38423010 was the
  only human disease-gene report; the 2025-2026 SNF8 records
  (PMID:42043682, PMID:41824857, PMID:40728621, PMID:40306176, PMID:40176577,
  PMID:40055680) were audited individually and are steatohepatitis
  bioinformatics, psoriasis Mendelian randomisation, disordered-region
  prediction, a rat MASH model, an insomnia pleiotropy analysis, and a fatigue
  GWAS respectively - none reports a patient with an SNF8 variant. Only the
  abstract of PMID:38423010 is cached, so per-individual clinical detail from
  its full text is not quotable here.

  No GeneReviews chapter exists. Searched on 2026-08-01: `SNF8
  GeneReviews[All Fields]` returned 0 records, and `neurodevelopmental disorder
  plus optic atrophy GeneReviews[All Fields]` returned exactly 1 record,
  PMID:20301382, which was retrieved and rejected - it is "Single Large-Scale
  Mitochondrial DNA Deletion Syndromes" and matched only on the free-text words
  "optic atrophy". The Step 3b GeneReviews phenotype baseline is therefore not
  applicable.

  Cohort arithmetic, reconciled. An earlier draft of this entry recorded an
  apparent conflict between the abstract and the HPO annotation file; the deep
  research pass resolved it, and the resolution is recorded here rather than the
  conflict. The published cohort is nine individuals: five at the severe pole
  (A1, A2, B1, C1, C2) and four at the mild pole (D1, E1, E2, F1). The
  abstract's "four individuals with severe developmental and epileptic
  encephalopathy" counts the four liveborn severely affected children; the fifth
  severe case, C1, was a pregnancy terminated at 25 weeks for brain
  malformations and so had no epileptic encephalopathy to report. HPOA's
  denominators - up to 5 for DEE115 (OMIM:620783) and 4 for NEDOA
  (OMIM:620784) - are therefore consistent with the abstract, not in conflict
  with it, and the NEDOA denominator of 4 is the correct one for this entry.

  Frequency bands are nonetheless deliberately omitted from every phenotype.
  The reason is no longer a suspected inconsistency but simply the cohort size:
  the denominator is four individuals from a single unreplicated series, so one
  reclassified case moves most features across a FrequencyEnum boundary. The
  deep research report reached the same conclusion independently and recommended
  recording exact counts instead of bands. Each phenotype's `notes:` therefore
  carries the exact fraction and its source.

  Age of onset is left unbound rather than assigned an enum, and the research
  pass strengthened rather than weakened that decision. HPOA records HP:0011463
  (Childhood onset, defined in HPO as 1 to 5 years) in 2 of 4 and HP:0003621
  (Juvenile onset, 5 to 15 years) in 2 of 4. The underlying reason is now
  visible: optic atrophy declared itself between ages 4 and 7 years, a window
  that straddles the boundary between the two age-bounded HPO categories. No
  single onset term can be asserted for the disorder. The abstract's own wording,
  "childhood-onset optic atrophy", is quoted where relevant but is not treated
  as a claim about the HPO CHILDHOOD interval specifically.

  Deep research: `just research-disorder claude_code
  SNF8-Related_Neurodevelopmental_Disorder`
  (research/SNF8-Related_Neurodevelopmental_Disorder-deep-research-claude_code.md,
  2026-08-01, 5 web searches, 83 turns, 24 citations). The NEC gate was applied
  to that report before any of it was used: SNF8 is named 103 times, the next
  most frequent gene symbols are its own ESCRT-II partners VPS25 (12) and VPS36
  (12) and its own HGNC aliases VPS22 (5) and EAP30 (3), and the only disease
  identifiers asserted anywhere in the report are OMIM:620783/MONDO:0968946 and
  OMIM:620784/MONDO:0968947 plus the SNF8 gene MIM 610904. Hits were read in
  context rather than counted blind. The report ran its own NEC preflight and
  flagged the two real confusion risks for this gene: SNF8 is a long-established
  S. cerevisiae gene name, and human SNF8 sits in the GWAS-dense 17q21.32 locus
  UBE2Z-GIP-ATP5G1-SNF8, so GWAS hits for psoriasis, fatigue, insomnia and
  chicken carcass traits name the gene without bearing on this disorder. Those
  are deliberately not curated as risk factors.

  Facts taken from that report that are in the paper's full text or supplement
  rather than its abstract are recorded in `notes:` blocks, never as evidence
  snippets, because only the abstract of PMID:38423010 is cached.

  Structured-source evidence was unavailable. `data/orphadata/`,
  `data/clingen/` and `data/clingen-dosage/` in this checkout contain only
  `MANIFEST.yaml` with no downloaded payload, so no Orphanet prevalence class
  or ClinGen gene-disease-validity classification could be consulted. Per the
  scope rules the manifests were not touched. This is recorded as a gap, not as
  an assertion that no such classification exists.

  Post-review revision, 2026-08-01. Following review of PR #7785 the pathograph
  was corrected and four research findings that had been left out were pulled
  in. The allele-specific arm (`Stability-Independent Impairment by the
  p.Val102Ile Hypomorph`) now branches from the variant node rather than from
  `Loss of the ESCRT-II Complex`; it had been placed downstream of complex loss,
  which asserted the opposite of what the node says, since the mild-pole
  fibroblasts preserve complex abundance. The preserved-EGFR-degradation
  negative result, cell-type bindings, the morpholino character of the zebrafish
  model and the IMPC mouse null were added. Three literal searches were run
  before asserting anything was missing, all on 2026-08-01 and all against this
  file: `grep -in egfr` (no match, so the earlier PR-comment claim that this
  finding lived in a `notes:` block was wrong), `grep -n classifications` (no
  match) and `grep -n cell_types` (no match). `grep -in "egfr\|autolysosom\|
  LAMP1\|LC3\|autopsy\|morpholino" references_cache/PMID_38423010.md` also
  returned nothing, which is why every one of those findings is recorded as a
  note and none as an evidence snippet. Deliberately still absent: a
  `histopathology:` section, because the only neuropathology in the literature
  is the autopsy of individual A2, a severe-pole (DEE115) case, and attributing
  it to this MONDO term would repeat the error this entry exists to correct; and
  a `progression:` section, reasoned in the phenotype notes instead.

  ESCRT cross-reference. `kb/disorders/VPS4A-Related_Neurodevelopmental_Syndrome.yaml`
  covers the ESCRT-III disassembly ATPase and is cited here only as a
  mechanistic differential, under the specific claim that lesions at different
  steps of one ESCRT cascade converge on neurodevelopmental disease. No content
  was copied from that entry.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Disease requires two damaging SNF8 alleles. All nine reported individuals
    were bi-allelic, and every individual at the mild NEDOA end of the spectrum
    carried the hypomorphic missense allele c.304G>A (p.Val102Ile), which is
    understood to retain partial function and thereby to set the severity
    floor. Heterozygous carriers, including the parents in the six reported
    families, are not described as affected.

    Penetrance is recorded as incomplete, and the reason is specific to this
    entity rather than a generic hedge. gnomAD contains one apparently healthy
    individual homozygous for c.304G>A (p.Val102Ile) - the very allele that
    defines the mild pole. For the severe bi-allelic genotypes penetrance
    appears complete, so penetrance here is genotype-dependent rather than
    uniformly reduced. The practical consequence is a counselling problem: a
    fetus predicted to be a p.Val102Ile homozygote cannot be described as
    affected on present evidence. That gnomAD homozygote is reported in the full
    text of PMID:38423010 and was surfaced by the deep research pass; it is not
    in the cached abstract, so it carries no snippet. Consanguinity is not
    explicitly reported for any family and is deliberately not asserted, despite
    the one homozygous family being consistent with it.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report nine individuals from six families presenting with a spectrum of neurodevelopmental/neurodegenerative features caused by bi-allelic variants in SNF8"
    explanation: Nine affected individuals from six families all carried bi-allelic SNF8 variants, which is the definition of autosomal recessive inheritance for this locus.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mildly affected individuals shared the same hypomorphic variant, c.304G>A (p.Val102Ile)."
    explanation: Identifies the specific hypomorphic allele shared by the mild cohort, that is, by the individuals who constitute this MONDO entity rather than the allelic encephalopathy.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Nine individuals from six families have been reported in total across both
    ends of the SNF8 spectrum, in one 2024 publication; four of those nine are
    at the mild pole and therefore constitute the entire published experience of
    this entity. `NOT_YET_DOCUMENTED` is used rather than a qualitative
    `ULTRA_RARE` band because no prevalence or incidence estimate of any kind
    has been published and Orphanet has assigned no ORPHA code to this disorder,
    so there is no source to band. `rate_per_100000` is deliberately left empty
    - there is no basis for a number. No founder effect is asserted: the single
    homozygous family is one family, and the recurrence of p.Val102Ile across
    three unrelated families reflects that allele's appreciable population
    frequency rather than a founder event. The reported ancestries are European
    and Middle Eastern, which reflects ascertainment through European diagnostic
    genomics networks and must not be read as population restriction.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report nine individuals from six families presenting with a spectrum of neurodevelopmental/neurodegenerative features caused by bi-allelic variants in SNF8"
    explanation: Establishes the total published case count for the SNF8 disease spectrum at the time of curation.
pathophysiology:
- name: Bi-allelic Hypomorphic SNF8 Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is bi-allelic damage to SNF8 at 17q21.32, reported
    against transcript NM_007241.4. Genotype maps onto severity: the mild
    NEDOA phenotype curated here occurs only in individuals who carry the
    hypomorphic missense allele c.304G>A (p.Val102Ile), which is inferred to
    leave residual SNF8 function, whereas the severe allelic encephalopathy
    arises from more damaging genotypes. Functional testing in vivo reproduced
    this graded effect, with different SNF8 alleles having different impacts on
    embryonic development, which is the mechanistic basis for the clinical
    heterogeneity across the spectrum.
  genes:
  - preferred_term: SNF8
    term:
      id: hgnc:17028
      label: SNF8
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by bi-allelic variants in SNF8 (GenBank: NM_007241.4), encoding the ESCRT-II subunit SNF8"
    explanation: Names the causal gene, the reference transcript, and the gene product's identity as an ESCRT-II subunit.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo experiments corroborated the pathogenicity of the tested SNF8 variants and their variable impact on embryo development, validating the observed clinical heterogeneity."
    explanation: Supports the claim that allele severity, not a second locus, accounts for the split between the mild and severe ends of the spectrum.
  downstream:
  - target: Loss of the ESCRT-II Complex
    description: >-
      Severe-pole genotypes, which lack p.Val102Ile, destabilise SNF8 protein
      and with it the assembled ESCRT-II heterotetramer. This is the
      abundance-dependent arm of the allelic split.
  - target: Stability-Independent Impairment by the p.Val102Ile Hypomorph
    description: >-
      The parallel, allele-specific arm. In individuals carrying the mild-pole
      hypomorph c.304G>A (p.Val102Ile), ESCRT-II function is impaired without a
      measurable fall in complex abundance, so this branch is a direct
      consequence of the variant rather than of complex loss.
- name: Loss of the ESCRT-II Complex
  biological_scale: MOLECULAR
  description: >-
    ESCRT-II is an obligate heterotetramer built from one copy of SNF8/VPS22,
    one copy of VPS36, and two copies of VPS25, arranged as a trilobal
    assembly of winged-helix domains. Because the subunits are mutually
    stabilising, damaging one of them destabilises the whole complex rather
    than removing a single activity: patient-derived fibroblasts carrying
    bi-allelic SNF8 variants show loss of ESCRT-II subunits, plural. SNF8 is
    not a peripheral subunit in this assembly - the first helix of VPS22
    contributes directly, alongside the VPS36 GLUE domain, to targeting
    ESCRT-II onto the endosomal membrane - so its loss removes both the
    structural core and part of the membrane-recruitment activity.
  genes:
  - preferred_term: SNF8
    term:
      id: hgnc:17028
      label: SNF8
  protein_complexes:
  - preferred_term: ESCRT II complex
    modifier: DECREASED
    term:
      id: GO:0000814
      label: ESCRT II complex
  cellular_components:
  - preferred_term: endosome membrane
    term:
      id: GO:0010008
      label: endosome membrane
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  notes: >-
    Scope caveat, and the single most important qualification in this entry.
    The quoted abstract sentence "bi-allelic SNF8 variants cause loss of ESCRT-II
    subunits" is written across the whole spectrum, but the full-text proteomics
    behind it separates the two poles, and the separation runs against this
    entity. In severe-pole fibroblasts SNF8 fell to roughly a quarter of control
    with VPS36 and VPS25 significantly co-depleted; in the mild-pole fibroblasts
    (individuals D1 and E1, the NEDOA genotype curated here) the reduction in
    SNF8 was not statistically significant and VPS36 and VPS25 were not
    significantly reduced at all. Complex destabilisation is therefore
    established for the severe allelic disorder and NOT demonstrated for NEDOA.
    This node is retained because ESCRT-II is unambiguously the affected
    machinery, but the destabilisation route is marked PARTIAL for this entity
    and the alternative route is modelled as its own node below. These
    per-individual fold changes are full-text/supplementary figures in
    PMID:38423010, not abstract content, so they are recorded here rather than
    quoted as a snippet; they were surfaced by the deep research pass.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "In patient-derived fibroblasts, bi-allelic SNF8 variants cause loss of ESCRT-II subunits."
    explanation: >-
      Patient-cell demonstration that the SNF8 genotype can destabilise ESCRT-II
      subunits collectively. Marked PARTIAL rather than SUPPORT because the
      sentence is stated for the spectrum as a whole while the underlying
      proteomics shows the effect in the severe-pole genotypes and not in the
      mild-pole genotype that defines this MONDO term; see this node's notes.
  - reference: PMID:18539118
    reference_title: "Integrated structural model and membrane targeting mechanism of the human ESCRT-II complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The complex has three lobes and contains one copy each of VPS22 and VPS36 and two copies of VPS25."
    explanation: Defines the stoichiometry of human ESCRT-II and places SNF8, whose HGNC alias is VPS22, as a single-copy core subunit whose loss cannot be compensated by another copy.
  - reference: PMID:18539118
    reference_title: "Integrated structural model and membrane targeting mechanism of the human ESCRT-II complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ESCRT-II is targeted to endosomal membranes by the lipid-binding activities of both the Vps36 GLUE domain and the first helix of Vps22."
    explanation: Assigns a specific membrane-targeting function to the SNF8/VPS22 subunit itself, so loss of SNF8 impairs recruitment of ESCRT-II to the endosome and not only its assembly.
  - reference: PMID:15469844
    reference_title: "ESCRT-II, an endosome-associated complex required for protein sorting: crystal structure and interactions with ESCRT-III and membranes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The 3.6 A structure of the yeast ESCRT-II core presented here reveals a trilobal complex containing two copies of Vps25, one copy of Vps22, and the C-terminal region of Vps36."
    explanation: Independent structural confirmation of the same single-copy Vps22 stoichiometry in the yeast orthologue, establishing that the architecture is conserved.
  - reference: PMID:15329733
    reference_title: "Structure of the ESCRT-II endosomal trafficking complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Vps22 and Vps36 form nearly equivalent interactions with the two Vps25 molecules at the centre of the 'Y'."
    explanation: >-
      Shows that the SNF8/Vps22 subunit is one of the two scaffolding arms
      holding both Vps25 copies in place, which is the structural reason its
      loss collapses the assembly rather than merely trimming one activity.
  downstream:
  - target: Failure of ESCRT-III Nucleation and Multivesicular Body Biogenesis
    description: Without ESCRT-II on the endosomal membrane, the downstream ESCRT-III polymer is not nucleated.
- name: Stability-Independent Impairment by the p.Val102Ile Hypomorph
  biological_scale: MOLECULAR
  description: >-
    This node exists because the mechanism that produces NEDOA is not the
    mechanism that produces the severe allelic encephalopathy. Every mildly
    affected individual carries c.304G>A (p.Val102Ile) in trans to a more
    damaging allele, and in fibroblasts from two of them the ESCRT-II subunits
    were not significantly depleted. The authors' reading is that this allele
    impairs ESCRT-II function by a route independent of protein stability -
    a partially functional complex is assembled in normal amounts but works
    less well - rather than by removing the complex. That is what sets the
    severity floor for this entity: enough residual ESCRT-II activity to permit
    survival into adulthood and mild rather than absent development, but not
    enough to protect the anterior visual pathway. The distinction also predicts
    that a proteomic assay of ESCRT-II subunit abundance, which is informative
    for the severe pole, will look near-normal in NEDOA and cannot be used to
    confirm this diagnosis.
  genes:
  - preferred_term: SNF8
    term:
      id: hgnc:17028
      label: SNF8
  protein_complexes:
  - preferred_term: ESCRT II complex
    modifier: ABNORMAL
    term:
      id: GO:0000814
      label: ESCRT II complex
  mechanism_confidence: PROVISIONAL
  notes: >-
    No evidence item is attached to this node. The claim rests on full-text and
    supplementary data of PMID:38423010 - the non-significant SNF8 reduction in
    the mild-pole fibroblasts (individuals D1 and E1), the preserved VPS36 and
    VPS25 levels, and the authors' conclusion that the variant acts by a
    mechanism independent of protein stability. None of that is in the cached
    abstract, and the abstract's only sentence about fibroblasts says the
    opposite for the spectrum as a whole, so quoting it here would be a
    claim/snippet mismatch of exactly the kind the evidence rules forbid. The
    hypomorphic character of the allele and its restriction to the mild cohort
    ARE abstract-verifiable and are evidenced in the `genetic:` and
    `inheritance:` blocks.
  downstream:
  - target: Failure of ESCRT-III Nucleation and Multivesicular Body Biogenesis
    description: >-
      Reduced, rather than absent, ESCRT-II activity yields a partial and
      cargo-selective block of the downstream sorting step.
- name: Failure of ESCRT-III Nucleation and Multivesicular Body Biogenesis
  biological_scale: CELLULAR
  description: >-
    ESCRT-0, -I, -II and -III act as a sequential relay on the endosomal
    membrane. ESCRT-II is the hand-off point: it binds the ESCRT-I VPS28
    C-terminal domain on one side and, through VPS25, directly recruits and
    nucleates the ESCRT-III subunit VPS20/CHMP6 on the other. Losing ESCRT-II
    therefore breaks the cascade in the middle, so ubiquitinated cargo is not
    packaged into intralumenal vesicles, multivesicular bodies fail to mature,
    and surface receptors are not downregulated. This step is the mechanistic
    junction with the ESCRT-III disorders: an ESCRT-II lesion and an ESCRT-III
    lesion disable adjacent stages of one pathway.
  biological_processes:
  - preferred_term: multivesicular body assembly
    modifier: DECREASED
    term:
      id: GO:0036258
      label: multivesicular body assembly
  - preferred_term: endosomal transport
    modifier: ABNORMAL
    term:
      id: GO:0016197
      label: endosomal transport
  - preferred_term: ubiquitin-dependent cargo delivery to the lysosome via the MVB sorting pathway
    modifier: DECREASED
    term:
      id: GO:0043328
      label: protein transport to vacuole involved in ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway
  cellular_components:
  - preferred_term: multivesicular body
    term:
      id: GO:0005771
      label: multivesicular body
  cell_types:
  - preferred_term: patient-derived dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  notes: >-
    The block at this step is partial and cargo-selective, not a global collapse
    of ESCRT function, and the strongest evidence for that is a negative result.
    In the founding study, EGFR degradation - the canonical, most widely used
    readout of ESCRT-dependent receptor downregulation - was NOT detectably
    impaired in patient-derived fibroblasts compared with control fibroblasts.
    The authors attribute this to residual ESCRT-II activity and to cargo
    specificity: different cargoes have different ESCRT-II dependency
    thresholds. This constrains the model in a way the abstract alone does not.
    It argues against reading "loss of ESCRT-II subunits" as "the MVB pathway is
    shut down", and it is consistent with the mild pole existing at all: a
    partially functional pathway that still clears EGFR but fails somewhere
    else, most likely at autophagosome-lysosome progression.

    Provenance and honesty about it. This result is in the full text of
    PMID:38423010, not in its abstract, which is the only part cached here
    (`grep -i egfr references_cache/PMID_38423010.md` returns nothing, checked
    2026-08-01). It is therefore recorded in this note rather than as an
    evidence snippet, and no `REFUTE`/`PARTIAL` evidence item is attached to it,
    because attaching one would require quoting text this repository cannot
    verify. It was surfaced by the deep research pass
    (research/SNF8-Related_Neurodevelopmental_Disorder-deep-research-claude_code.md,
    section 6). The study also does not report which pole the EGFR-assayed
    fibroblasts came from, so the result is recorded for the SNF8 spectrum
    rather than asserted specifically for the NEDOA genotype.
  evidence:

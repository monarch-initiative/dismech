    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second cohort shows a milder phenotype with intellectual disability, childhood-onset optic atrophy, or ataxia."
    explanation: Directly names childhood-onset optic atrophy as a feature of the milder cohort denoted by this MONDO term.

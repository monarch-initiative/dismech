name: SNF8-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodevelopmental disorder plus optic atrophy
  term:
    id: MONDO:0968947
    label: neurodevelopmental disorder plus optic atrophy
description: >-
  Neurodevelopmental disorder plus optic atrophy (NEDOA) is an autosomal
  recessive disorder caused by bi-allelic variants in SNF8, the gene encoding
  the SNF8 subunit of the ESCRT-II complex. It occupies the mild end of a
  two-part SNF8 disease spectrum: the severe end is developmental and epileptic
  encephalopathy 115, a congenital-onset encephalopathy with massive white
  matter loss and early death, while NEDOA presents as impaired intellectual
  development with optic atrophy, nystagmus, and in some individuals ataxia,
  and is compatible with survival into later childhood and beyond. Every
  individual reported at the mild end carried the same hypomorphic missense
  allele, c.304G>A (p.Val102Ile), so the milder phenotype is currently defined
  by genotype as much as by clinical features. ESCRT-II is the central module
  of the endosomal sorting complex required for transport pathway, bridging
  ESCRT-I to ESCRT-III on the endosomal membrane and thereby driving
  intralumenal vesicle formation, multivesicular body biogenesis, receptor
  downregulation, and autophagosome maturation. Patient fibroblasts carrying
  bi-allelic SNF8 variants lose ESCRT-II subunits, and the authors of the
  founding study attribute the neurodevelopmental and neurodegenerative
  phenotype principally to impaired autophagic flux. The disorder is
  ultra-rare: as of this curation the entire published clinical literature is a
  single 2024 report of nine individuals from six families spanning both ends
  of the spectrum.
parents:
- Neurodevelopmental Disorder
synonyms:
- NEDOA
- neurodevelopmental disorder plus optic atrophy
- SNF8-related syndromic optic atrophy
- VPS22-related neurodevelopmental disorder
notes: >-
  Entity verification. The target term was verified with OAK before any content
  was written: `runoak -i sqlite:obo:mondo relationships --direction up
  MONDO:0968947` returns `RO:0004003 HGNC:17028 SNF8` and
  `rdfs:subClassOf MONDO:0100500 (Mendelian neurodevelopmental disorder)`, and
  the term xrefs OMIM:620784, MEDGEN:1859522, UMLS:C5935605. HGNC:17028 was
  confirmed against the HGNC REST API as symbol SNF8, name "SNF8 subunit of
  ESCRT-II", locus 17q21.32, with alias symbols EAP30, VPS22 and Dot3. That
  alias list matters for reading the literature: the structural papers cited
  here (PMID:18539118, PMID:15469844) name the same protein VPS22 and never use
  the string "SNF8", so those citations are about this gene despite the
  different symbol.

  Contrast entity, also verified with OAK rather than typed from memory. SNF8
  carries two distinct MONDO disease terms, and this entry curates only the
  milder one. `runoak -i sqlite:obo:mondo relationships --direction down
  HGNC:17028` returns exactly two subjects: MONDO:0968946 (developmental and
  epileptic encephalopathy 115, OMIM:620783) and MONDO:0968947 (this entry,
  OMIM:620784). DEE115 is curated below as an allelic differential diagnosis,
  not as a subtype or a parent. MONDO:0100500, the superclass of this entry, is
  deliberately NOT bound as a differential.

  Both MedGen concept records state autosomal recessive inheritance
  (C5935605: "Neurodevelopmental disorder plus optic atrophy (NEDOA) is an
  autosomal recessive disorder"; C5935604 likewise for DEE115), matching the
  "bi-allelic" language of the founding study. The HPO annotation set for
  OMIM:620784 nonetheless records HP:0000006 (Autosomal dominant inheritance).
  That HPOA inheritance annotation is judged to be an error and is NOT
  propagated into this entry; HP:0000007 is asserted instead, with the
  bi-allelic evidence quoted from the primary paper.

  Evidence base and its limits. PMID:38423010 (Brugger et al., Am J Hum Genet
  2024) is the only clinical publication describing this disorder. A PubMed
  search on 2026-08-01 for `(SNF8[TIAB] OR VPS22[TIAB]) AND (variant* OR
  mutation* OR patient*)` returned 20 records, of which PMID:38423010 was the
  only human disease-gene report; the 2025-2026 SNF8 records
  (PMID:42043682, PMID:41824857, PMID:40728621, PMID:40306176, PMID:40176577,
  PMID:40055680) were audited individually and are steatohepatitis
  bioinformatics, psoriasis Mendelian randomisation, disordered-region
  prediction, a rat MASH model, an insomnia pleiotropy analysis, and a fatigue
  GWAS respectively - none reports a patient with an SNF8 variant. Only the
  abstract of PMID:38423010 is cached, so per-individual clinical detail from
  its full text is not quotable here.

  No GeneReviews chapter exists. Searched on 2026-08-01: `SNF8
  GeneReviews[All Fields]` returned 0 records, and `neurodevelopmental disorder
  plus optic atrophy GeneReviews[All Fields]` returned exactly 1 record,
  PMID:20301382, which was retrieved and rejected - it is "Single Large-Scale
  Mitochondrial DNA Deletion Syndromes" and matched only on the free-text words
  "optic atrophy". The Step 3b GeneReviews phenotype baseline is therefore not
  applicable.

  Frequency bands are deliberately omitted from every phenotype in this entry.
  Per-feature counts are not in the cached abstract; they exist only in the HPO
  annotation file for OMIM:620784, which is derived from the full text of the
  same paper. Those fractions are recorded verbatim in each phenotype's own
  `notes:` (retrieved 2026-08-01 from
  https://ontology.jax.org/api/network/annotation/OMIM:620784) so a reader can
  see the numbers, but they are not converted into a FrequencyEnum band for two
  reasons. First, the largest denominator is four individuals, so a single
  reclassified case moves most features across a band boundary. Second, the
  HPOA split of the cohort disagrees with the abstract: the abstract states
  that "four individuals" had severe developmental and epileptic
  encephalopathy, which leaves five in the milder cohort, whereas HPOA uses
  denominators of up to 5 for DEE115 (OMIM:620783) and 4 for NEDOA
  (OMIM:620784) - the opposite split. Until that is reconciled against the full
  text, no banded frequency claim is defensible.

  Age of onset is likewise left unbound rather than assigned an enum. HPOA
  records HP:0011463 (Childhood onset, defined in HPO as onset between 1 and 5
  years) in 2 of 4 and HP:0003621 (Juvenile onset, 5 to 15 years) in 2 of 4 -
  the cohort straddles the boundary between the two age-bounded categories, so
  neither term can be asserted for the disorder as a whole. The abstract's own
  wording, "childhood-onset optic atrophy", is quoted where relevant but is not
  treated as a claim about the HPO CHILDHOOD interval specifically.

  Structured-source evidence was unavailable. `data/orphadata/`,
  `data/clingen/` and `data/clingen-dosage/` in this checkout contain only
  `MANIFEST.yaml` with no downloaded payload, so no Orphanet prevalence class
  or ClinGen gene-disease-validity classification could be consulted. Per the
  scope rules the manifests were not touched. This is recorded as a gap, not as
  an assertion that no such classification exists.

  ESCRT cross-reference. `kb/disorders/VPS4A-Related_Neurodevelopmental_Syndrome.yaml`
  covers the ESCRT-III disassembly ATPase and is cited here only as a
  mechanistic differential, under the specific claim that lesions at different
  steps of one ESCRT cascade converge on neurodevelopmental disease. No content
  was copied from that entry.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Disease requires two damaging SNF8 alleles. All nine reported individuals
    were bi-allelic, and every individual at the mild NEDOA end of the spectrum
    carried the hypomorphic missense allele c.304G>A (p.Val102Ile), which is
    understood to retain partial function and thereby to set the severity
    floor. Heterozygous carriers, including the parents in the six reported
    families, are not described as affected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report nine individuals from six families presenting with a spectrum of neurodevelopmental/neurodegenerative features caused by bi-allelic variants in SNF8"
    explanation: Nine affected individuals from six families all carried bi-allelic SNF8 variants, which is the definition of autosomal recessive inheritance for this locus.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mildly affected individuals shared the same hypomorphic variant, c.304G>A (p.Val102Ile)."
    explanation: Identifies the specific hypomorphic allele shared by the mild cohort, that is, by the individuals who constitute this MONDO entity rather than the allelic encephalopathy.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Nine individuals from six families have been reported in total across both
    ends of the SNF8 spectrum, in one 2024 publication. Four of the nine are
    described in the abstract as having severe developmental and epileptic
    encephalopathy, which is the allelic disorder DEE115 rather than this
    entity, so the published NEDOA count is the remainder of that nine. No
    population-based prevalence estimate, incidence figure, founder effect, or
    ethnic enrichment has been described, and no Orphanet prevalence class was
    available in this checkout.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report nine individuals from six families presenting with a spectrum of neurodevelopmental/neurodegenerative features caused by bi-allelic variants in SNF8"
    explanation: Establishes the total published case count for the SNF8 disease spectrum at the time of curation.
pathophysiology:
- name: Bi-allelic Hypomorphic SNF8 Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is bi-allelic damage to SNF8 at 17q21.32, reported
    against transcript NM_007241.4. Genotype maps onto severity: the mild
    NEDOA phenotype curated here occurs only in individuals who carry the
    hypomorphic missense allele c.304G>A (p.Val102Ile), which is inferred to
    leave residual SNF8 function, whereas the severe allelic encephalopathy
    arises from more damaging genotypes. Functional testing in vivo reproduced
    this graded effect, with different SNF8 alleles having different impacts on
    embryonic development, which is the mechanistic basis for the clinical
    heterogeneity across the spectrum.
  genes:
  - preferred_term: SNF8
    term:
      id: hgnc:17028
      label: SNF8
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by bi-allelic variants in SNF8 (GenBank: NM_007241.4), encoding the ESCRT-II subunit SNF8"
    explanation: Names the causal gene, the reference transcript, and the gene product's identity as an ESCRT-II subunit.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo experiments corroborated the pathogenicity of the tested SNF8 variants and their variable impact on embryo development, validating the observed clinical heterogeneity."
    explanation: Supports the claim that allele severity, not a second locus, accounts for the split between the mild and severe ends of the spectrum.
  downstream:
  - target: Loss of the ESCRT-II Complex
    description: Reduced or destabilised SNF8 protein leads to loss of the assembled ESCRT-II heterotetramer.
- name: Loss of the ESCRT-II Complex
  biological_scale: MOLECULAR
  description: >-
    ESCRT-II is an obligate heterotetramer built from one copy of SNF8/VPS22,
    one copy of VPS36, and two copies of VPS25, arranged as a trilobal
    assembly of winged-helix domains. Because the subunits are mutually
    stabilising, damaging one of them destabilises the whole complex rather
    than removing a single activity: patient-derived fibroblasts carrying
    bi-allelic SNF8 variants show loss of ESCRT-II subunits, plural. SNF8 is
    not a peripheral subunit in this assembly - the first helix of VPS22
    contributes directly, alongside the VPS36 GLUE domain, to targeting
    ESCRT-II onto the endosomal membrane - so its loss removes both the
    structural core and part of the membrane-recruitment activity.
  genes:
  - preferred_term: SNF8
    term:
      id: hgnc:17028
      label: SNF8
  protein_complexes:
  - preferred_term: ESCRT II complex
    modifier: DECREASED
    term:
      id: GO:0000814
      label: ESCRT II complex
  cellular_components:
  - preferred_term: endosome membrane
    term:
      id: GO:0010008
      label: endosome membrane
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In patient-derived fibroblasts, bi-allelic SNF8 variants cause loss of ESCRT-II subunits."
    explanation: Direct patient-cell demonstration that the SNF8 genotype destabilises ESCRT-II subunits collectively, establishing complex loss rather than isolated SNF8 loss as the cellular lesion.
  - reference: PMID:18539118
    reference_title: "Integrated structural model and membrane targeting mechanism of the human ESCRT-II complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The complex has three lobes and contains one copy each of VPS22 and VPS36 and two copies of VPS25."
    explanation: Defines the stoichiometry of human ESCRT-II and places SNF8, whose HGNC alias is VPS22, as a single-copy core subunit whose loss cannot be compensated by another copy.
  - reference: PMID:18539118
    reference_title: "Integrated structural model and membrane targeting mechanism of the human ESCRT-II complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ESCRT-II is targeted to endosomal membranes by the lipid-binding activities of both the Vps36 GLUE domain and the first helix of Vps22."
    explanation: Assigns a specific membrane-targeting function to the SNF8/VPS22 subunit itself, so loss of SNF8 impairs recruitment of ESCRT-II to the endosome and not only its assembly.
  - reference: PMID:15469844
    reference_title: "ESCRT-II, an endosome-associated complex required for protein sorting: crystal structure and interactions with ESCRT-III and membranes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The 3.6 A structure of the yeast ESCRT-II core presented here reveals a trilobal complex containing two copies of Vps25, one copy of Vps22, and the C-terminal region of Vps36."
    explanation: Independent structural confirmation of the same single-copy Vps22 stoichiometry in the yeast orthologue, establishing that the architecture is conserved.
  downstream:
  - target: Failure of ESCRT-III Nucleation and Multivesicular Body Biogenesis
    description: Without ESCRT-II on the endosomal membrane, the downstream ESCRT-III polymer is not nucleated.
- name: Failure of ESCRT-III Nucleation and Multivesicular Body Biogenesis
  biological_scale: CELLULAR
  description: >-
    ESCRT-0, -I, -II and -III act as a sequential relay on the endosomal
    membrane. ESCRT-II is the hand-off point: it binds the ESCRT-I VPS28
    C-terminal domain on one side and, through VPS25, directly recruits and
    nucleates the ESCRT-III subunit VPS20/CHMP6 on the other. Losing ESCRT-II
    therefore breaks the cascade in the middle, so ubiquitinated cargo is not
    packaged into intralumenal vesicles, multivesicular bodies fail to mature,
    and surface receptors are not downregulated. This step is the mechanistic
    junction with the ESCRT-III disorders: an ESCRT-II lesion and an ESCRT-III
    lesion disable adjacent stages of one pathway.
  biological_processes:
  - preferred_term: multivesicular body assembly
    modifier: DECREASED
    term:
      id: GO:0036258
      label: multivesicular body assembly
  - preferred_term: endosomal transport
    modifier: ABNORMAL
    term:
      id: GO:0016197
      label: endosomal transport
  - preferred_term: protein targeting to vacuole
    modifier: DECREASED
    term:
      id: GO:0006623
      label: protein targeting to vacuole
  cellular_components:
  - preferred_term: multivesicular body
    term:
      id: GO:0005771
      label: multivesicular body
  evidence:
  - reference: PMID:15469844
    reference_title: "ESCRT-II, an endosome-associated complex required for protein sorting: crystal structure and interactions with ESCRT-III and membranes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ESCRT-I, -II, and -III protein complexes are sequentially recruited to endosomal membranes, where they orchestrate protein sorting and MVB biogenesis."
    explanation: Establishes that ESCRT-II occupies an obligatory intermediate position in the sorting relay, so its loss interrupts the sequence rather than degrading it gracefully.
  - reference: PMID:15469844
    reference_title: "ESCRT-II, an endosome-associated complex required for protein sorting: crystal structure and interactions with ESCRT-III and membranes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that purified ESCRT-II binds directly to the Vps20 component of ESCRT-III."
    explanation: Demonstrates the direct physical hand-off from ESCRT-II to ESCRT-III that is lost when the ESCRT-II complex is destabilised.
  - reference: PMID:18539118
    reference_title: "Integrated structural model and membrane targeting mechanism of the human ESCRT-II complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ESCRT-II plays a pivotal role in receptor downregulation and multivesicular body biogenesis and is conserved from yeast to humans."
    explanation: States the two cell-biological outputs, receptor downregulation and multivesicular body biogenesis, that fail when ESCRT-II is lost.
  - reference: PMID:18539118
    reference_title: "Integrated structural model and membrane targeting mechanism of the human ESCRT-II complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ESCRT-II binds to the ESCRT-I VPS28 C-terminal domain subunit through a helix immediately C-terminal to the VPS36-GLUE domain."
    explanation: Documents the upstream half of the hand-off, confirming ESCRT-II as the physical bridge between ESCRT-I and ESCRT-III.
  downstream:
  - target: Impaired Autophagic Flux
    description: Blocked endosomal maturation prevents autophagosome-lysosome progression.
- name: Impaired Autophagic Flux
  biological_scale: CELLULAR
  description: >-
    The ESCRT machinery is required not only for endosomal sorting but for
    autophagy, where it contributes to phagophore closure and to
    autophagosome-lysosome fusion. The founding study's stated conclusion is
    that the neurodevelopmental and neurodegenerative phenotypes of bi-allelic
    SNF8 disease are mediated principally through impaired autophagic flux
    rather than through cargo missorting alone. This is the model's weakest
    documented link and is presented as such: the abstract offers it as a
    likelihood, and no autophagy readout from patient cells is quotable from
    the cached abstract.
  biological_processes:
  - preferred_term: macroautophagy
    modifier: DECREASED
    term:
      id: GO:0016236
      label: macroautophagy
  - preferred_term: autophagosome maturation
    modifier: DECREASED
    term:
      id: GO:0097352
      label: autophagosome maturation
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we conclude that loss of ESCRT-II due to bi-allelic SNF8 variants is associated with a spectrum of neurodevelopmental/neurodegenerative phenotypes mediated likely via impairment of the autophagic flux"
    explanation: The authors' own conclusion, marked PARTIAL because the word "likely" is theirs and the abstract does not report a direct autophagic-flux measurement in patient material.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The endosomal sorting complex required for transport (ESCRT) machinery is essential for membrane remodeling and autophagy"
    explanation: Establishes autophagy, alongside membrane remodelling, as a core ESCRT function and therefore as a plausible route from ESCRT-II loss to neurodegeneration.
  downstream:
  - target: Optic Nerve and Forebrain Developmental Failure
    description: Neurons and retinal ganglion cells, being long-lived and dependent on autophagic turnover, are the cells that fail.
- name: Optic Nerve and Forebrain Developmental Failure
  biological_scale: TISSUE
  description: >-
    The tissue-level endpoint is selective failure of the visual pathway and
    the forebrain. Zebrafish snf8 loss of function reproduces this pattern
    specifically, producing impaired optic nerve development and reduced
    forebrain size in addition to global developmental delay and altered embryo
    morphology. That the optic nerve phenotype is recovered in a model organism
    is what elevates optic atrophy in this disorder from an incidental
    association to a mechanistically anchored feature, and it is the strongest
    available support for the visual pathway being intrinsically vulnerable to
    ESCRT-II loss rather than secondarily damaged.
  locations:
  - preferred_term: optic nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  - preferred_term: forebrain
    term:
      id: UBERON:0001890
      label: forebrain
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Snf8 loss of function in zebrafish results in global developmental delay and altered embryo morphology, impaired optic nerve development, and reduced forebrain size."
    explanation: An orthogonal animal model reproduces both the optic nerve and the forebrain components of the human phenotype, supporting a developmental rather than purely degenerative mechanism for the visual pathway involvement.
genetic:
- name: SNF8
  association: Bi-allelic variants; the mild NEDOA phenotype is associated specifically with the hypomorphic allele c.304G>A (p.Val102Ile)
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SNF8
    term:
      id: hgnc:17028
      label: SNF8
  notes: >-
    Nomenclature. HGNC:17028 is symbol SNF8, "SNF8 subunit of ESCRT-II", at
    17q21.32, Entrez 11267, Ensembl ENSG00000159210, UniProt Q96H20, with alias
    symbols EAP30, VPS22 and Dot3 (HGNC REST API, retrieved 2026-08-01). The
    structural literature cited in this entry uses VPS22 exclusively.

    Allelic architecture. The reference transcript in the founding report is
    NM_007241.4. The only allele identified by name in the cached abstract is
    c.304G>A (p.Val102Ile), described as hypomorphic and shared by all mildly
    affected individuals. The genotypes of the severely affected individuals,
    the zygosity of each proband, the consanguinity status of the six families,
    and any population allele frequency or gnomAD constraint metric are in the
    full text or supplement and are not abstract-verifiable, so they are not
    asserted anywhere in this entry. No second modifier locus, methylation
    episignature, or somatic mechanism has been reported.

    Because MONDO splits the SNF8 phenotype into two terms and both are
    caused by bi-allelic variants in this same gene, a laboratory reporting an
    SNF8 genotype cannot assign the OMIM phenotype number from the gene alone;
    the assignment depends on the allele and on the clinical severity.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by bi-allelic variants in SNF8 (GenBank: NM_007241.4), encoding the ESCRT-II subunit SNF8"
    explanation: Establishes SNF8 as the causal gene and names the reference transcript against which variants are reported.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mildly affected individuals shared the same hypomorphic variant, c.304G>A (p.Val102Ile)."
    explanation: Ties the specific hypomorphic allele to the mild phenotype that this MONDO term denotes, which is the genotype-phenotype correlation defining the entity.
phenotypes:

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "impaired optic nerve development, and reduced forebrain size"
    explanation: The zebrafish model independently implicates the optic nerve, supporting the human optic atrophy as gene-attributable rather than coincidental.
- name: Ataxia
  category: Neurologic
  description: >-
    Ataxia is listed in the abstract as an alternative or additional
    presenting feature of the milder cohort, and the phrasing "optic atrophy,
    or ataxia" indicates that not every affected individual has both. In the
    HPO annotation set it is the least frequent of the core neurological
    features, consistent with the cerebellar involvement being variable.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  notes: >-
    HPO annotation for OMIM:620784 records HP:0001251 at 1/4, sourced to
    PMID:38423010 (retrieved 2026-08-01). No FrequencyEnum band is asserted.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A second cohort shows a milder phenotype with intellectual disability, childhood-onset optic atrophy, or ataxia."
    explanation: Ataxia is named as a feature of the milder cohort; the disjunction in the source sentence is the reason this phenotype is not described as universal.
- name: Global developmental delay
  category: Neurologic
  description: >-
    Developmental delay in the milder cohort is characterised in the HPO
    annotation set as mild, in explicit contrast to the neurodevelopmental
    arrest that defines the severe allelic encephalopathy. The zebrafish model
    reproduces global developmental delay at the organismal level.
  phenotype_term:
    preferred_term: Mild global developmental delay
    term:
      id: HP:0011342
      label: Mild global developmental delay
  notes: >-
    HPO annotation for OMIM:620784 records HP:0011342 (Mild global
    developmental delay) at 3/4, sourced to PMID:38423010 (retrieved
    2026-08-01). The severity qualifier "mild" comes from that annotation and
    not from the cached abstract, which describes the cohort only as having a
    "milder phenotype".
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Snf8 loss of function in zebrafish results in global developmental delay and altered embryo morphology"
    explanation: >-
      Marked PARTIAL rather than SUPPORT for two reasons. It is model-organism
      evidence standing alone for a human phenotype, and the zebrafish result
      speaks to developmental delay as such but says nothing about the "mild"
      severity qualifier in the bound HP:0011342 term, which comes from the HPO
      annotation set rather than from any cached abstract.
- name: Nystagmus
  category: Ophthalmologic
  description: >-
    Nystagmus accompanies the optic atrophy in most reported individuals and
    is a common consequence of early-onset visual loss. It is also recorded in
    the severe allelic encephalopathy, so it does not discriminate between the
    two ends of the SNF8 spectrum.
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  notes: >-
    Curated from the HPO annotation set for OMIM:620784, which records
    HP:0000639 at 3/4 sourced to PMID:38423010 (retrieved 2026-08-01). The
    cached abstract does not mention nystagmus, so this phenotype carries no
    evidence item rather than a snippet that does not support it.
- name: Abnormal visual evoked potentials
  category: Ophthalmologic
  description: >-
    Abnormal visual evoked potentials are the electrophysiological correlate
    of the optic neuropathy and were abnormal in every individual in whom they
    were recorded. They are the most sensitive objective marker of visual
    pathway involvement in this disorder and are relevant to diagnosis in
    young or non-verbal children in whom acuity cannot be measured.
  phenotype_term:
    preferred_term: Abnormality of visual evoked potentials
    term:
      id: HP:0000649
      label: Abnormality of visual evoked potentials
  notes: >-
    Curated from the HPO annotation set for OMIM:620784, which records
    HP:0000649 at 3/3 sourced to PMID:38423010 (retrieved 2026-08-01). Note
    the denominator of 3, not 4, meaning one individual was not tested. Not
    mentioned in the cached abstract, so no evidence item is attached.
- name: Delayed speech and language development
  category: Neurologic
  description: >-
    Speech and language delay was present in every individual in whom it was
    assessed and is a practical early flag, since it typically precedes the
    ophthalmological presentation.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  notes: >-
    Curated from the HPO annotation set for OMIM:620784, which records
    HP:0000750 at 3/3 sourced to PMID:38423010 (retrieved 2026-08-01). Not
    mentioned in the cached abstract, so no evidence item is attached.
- name: Global brain atrophy
  category: Neurologic
  description: >-
    Diffuse cerebral volume loss on MRI is present in a substantial minority
    of the milder cohort and is the imaging feature that marks this disorder
    as neurodegenerative as well as neurodevelopmental. It is far more
    consistent in the severe allelic encephalopathy.
  phenotype_term:
    preferred_term: Global brain atrophy
    term:
      id: HP:0002283
      label: Global brain atrophy
  notes: >-
    Curated from the HPO annotation set for OMIM:620784, which records
    HP:0002283 at 2/4 sourced to PMID:38423010 (retrieved 2026-08-01). Not
    mentioned in the cached abstract, so no evidence item is attached.
- name: Cerebellar cortical atrophy
  category: Neurologic
  description: >-
    Cerebellar cortical volume loss is the structural counterpart of the
    ataxia and is notable because it is recorded in the milder cohort but not
    in the severe allelic encephalopathy, where the corresponding HPO
    annotation is zero. It is therefore one of the few imaging features that
    may point towards this end of the spectrum rather than the other.
  phenotype_term:
    preferred_term: Cerebellar cortical atrophy
    term:
      id: HP:0008278
      label: Cerebellar cortical atrophy
  notes: >-
    Curated from the HPO annotation set for OMIM:620784, which records
    HP:0008278 at 2/4 sourced to PMID:38423010 (retrieved 2026-08-01); the
    corresponding annotation for OMIM:620783 (DEE115) is 0/5. Not mentioned in
    the cached abstract, so no evidence item is attached.
- name: Microcephaly
  category: Craniofacial
  description: >-
    Reduced head circumference occurs in a minority and is congruent with the
    reduced forebrain size seen on snf8 loss of function in zebrafish. It is
    not a defining feature of this end of the spectrum.
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  notes: >-
    Curated from the HPO annotation set for OMIM:620784, which records
    HP:0000252 at 1/4 sourced to PMID:38423010 (retrieved 2026-08-01). Not
    mentioned in the cached abstract, so no evidence item is attached.
- name: Conductive hearing impairment
  category: Otologic
  description: >-
    Conductive, rather than sensorineural, hearing impairment was recorded in
    one individual. It is listed here for completeness of the reported
    phenotype and should not be over-interpreted from a single case; notably a
    conductive deficit is mechanistically distinct from the sensorineural
    hearing loss that accompanies the mitochondrial optic neuropathies in the
    differential.
  phenotype_term:
    preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
  notes: >-
    Curated from the HPO annotation set for OMIM:620784, which records
    HP:0000405 at 1/4 sourced to PMID:38423010 (retrieved 2026-08-01). Not
    mentioned in the cached abstract, so no evidence item is attached.
- name: Dysplastic corpus callosum
  category: Neurologic
  description: >-
    A malformed corpus callosum is reported in a minority at this end of the
    spectrum. This is the attenuated form of the callosal lesion that is
    prominent in the severe allelic encephalopathy, where hypoplasia or
    aplasia of the corpus callosum is a defining feature; at the mild end the
    HPO annotations for hypoplasia and agenesis are both zero and only
    dysplasia is recorded.
  phenotype_term:
    preferred_term: Dysplastic corpus callosum
    term:
      id: HP:0006989
      label: Dysplastic corpus callosum
  notes: >-
    Curated from the HPO annotation set for OMIM:620784, which records
    HP:0006989 at 1/4, HP:0002079 (Hypoplasia of the corpus callosum) at 0/4
    and HP:0001274 (Agenesis of corpus callosum) at 0/4, all sourced to
    PMID:38423010 (retrieved 2026-08-01). Not mentioned in the cached abstract,
    so no evidence item is attached.
diagnosis:
- name: Exome or genome sequencing with bi-allelic SNF8 variant interpretation
  description: >-
    Molecular diagnosis rests on identifying bi-allelic SNF8 variants against
    transcript NM_007241.4 by exome or genome sequencing, in a child with
    impaired intellectual development plus optic atrophy. Two interpretation
    points follow from the published genotype-phenotype pattern. First, because
    the mild phenotype is driven by a hypomorphic missense allele, a
    conservative-looking missense change such as c.304G>A (p.Val102Ile) should
    not be dismissed on in-silico grounds; it is the allele that defines this
    entity. Second, both parents must be tested to confirm that the two
    variants are in trans, since SNF8 heterozygotes are unaffected. As SNF8 is
    a recently described disease gene, reanalysis of previously non-diagnostic
    sequencing data is reasonable.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by bi-allelic variants in SNF8 (GenBank: NM_007241.4), encoding the ESCRT-II subunit SNF8"
    explanation: Names the gene and the reference transcript that a diagnostic laboratory must use when reporting and interpreting variants.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mildly affected individuals shared the same hypomorphic variant, c.304G>A (p.Val102Ile)."
    explanation: Supports the specific interpretive caution that this particular missense allele, despite being a conservative valine-to-isoleucine substitution, is the recurring cause of the mild phenotype.
- name: Ophthalmological assessment including visual evoked potentials
  description: >-
    Formal ophthalmological review is required in any child with unexplained
    developmental delay who is being considered for this diagnosis, because the
    optic atrophy is the discriminating feature and can be clinically silent
    early. Visual evoked potentials are the objective test of choice, having
    been abnormal in every individual in whom they were recorded, and are
    feasible in children too young or too impaired for subjective acuity
    testing.
  notes: >-
    The supporting observation that visual evoked potentials were abnormal in
    3 of 3 tested individuals comes from the HPO annotation set for
    OMIM:620784 (HP:0000649, retrieved 2026-08-01), not from the cached
    abstract, which does not mention electrophysiology. It is therefore
    recorded as a note rather than as an evidence snippet.
- name: Brain MRI
  description: >-
    Brain MRI serves two purposes. It documents the structural correlates of
    the disorder - global brain atrophy, cerebellar cortical atrophy, and a
    dysplastic corpus callosum - and it helps place an individual on the SNF8
    spectrum, since massive white matter reduction with hypoplasia or aplasia
    of the corpus callosum characterises the severe allelic encephalopathy
    rather than this entity.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "massive reduction of white matter, hypo-/aplasia of the corpus callosum"
    explanation: Names the specific MRI findings that mark the severe end of the SNF8 spectrum, which is what makes imaging useful for distinguishing that disorder from this one.
differential_diagnoses:
- name: Developmental and epileptic encephalopathy 115
  disease_term:
    preferred_term: developmental and epileptic encephalopathy 115
    term:
      id: MONDO:0968946
      label: developmental and epileptic encephalopathy 115
  description: >-
    The allelic disorder, caused by bi-allelic variants in the same gene. This
    is not a differential in the usual sense of a different disease that
    mimics this one; it is the other half of one continuum, and separating the
    two is a clinical judgement made after the SNF8 genotype is already known.
    A laboratory that reports bi-allelic SNF8 variants has not thereby chosen
    between OMIM:620783 and OMIM:620784.
  distinguishing_features:
  - DEE115 has a congenital onset, whereas the optic atrophy in NEDOA is described as childhood-onset and the HPO onset annotations for NEDOA are childhood or juvenile.
  - DEE115 is defined by severe developmental and epileptic encephalopathy with neurodevelopmental arrest and early death; NEDOA is compatible with survival and with mild rather than absent developmental progress.
  - Massive white matter reduction with hypoplasia or aplasia of the corpus callosum is characteristic of DEE115; in the NEDOA HPO annotation set both callosal hypoplasia and agenesis are recorded at 0/4 and only dysplasia appears.
  - Seizures and EEG abnormality are recorded in DEE115 but are annotated at 0/4 in NEDOA, so an epileptic presentation argues against this entity.
  - All mildly affected individuals carried the hypomorphic c.304G>A (p.Val102Ile) allele, so this genotype is currently the strongest single pointer towards NEDOA rather than DEE115.
  notes: >-
    MONDO:0968946 was verified with OAK (`runoak -i sqlite:obo:mondo
    relationships --direction down HGNC:17028`), which returns it and
    MONDO:0968947 as the only two SNF8 disease terms; its xref is OMIM:620783.
    The seizure and EEG contrasts in the distinguishing features come from the
    HPO annotation sets for OMIM:620783 and OMIM:620784 (retrieved 2026-08-01),
    not from the cached abstract.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypic spectrum included four individuals with severe developmental and epileptic encephalopathy, massive reduction of white matter, hypo-/aplasia of the corpus callosum, neurodevelopmental arrest, and early death."
    explanation: Describes the severe allelic phenotype in the same cohort, establishing the clinical features that separate it from the milder entity curated here.
- name: Behr syndrome
  disease_term:
    preferred_term: Behr syndrome
    term:
      id: MONDO:0008858
      label: Behr syndrome
  description: >-
    The closest clinical mimic. Behr syndrome is a recessive, childhood-onset
    combination of bilateral optic atrophy with ataxia and variable
    intellectual disability, most often from bi-allelic OPA1 variants and also
    from OPA3, C12orf65/MTRFR or C19orf12. The three cardinal features of the
    milder SNF8 cohort - impaired intellectual development, childhood-onset
    optic atrophy, ataxia - are precisely the Behr triad, so a child with
    NEDOA presenting to a neuro-ophthalmology service will be worked up as
    Behr syndrome first, and the distinction is molecular rather than clinical.
  distinguishing_features:
  - Behr syndrome is mechanistically mitochondrial, converging on impaired bioenergetics, whereas NEDOA is a defect of the endosomal ESCRT pathway; a normal mitochondrial workup does not exclude NEDOA and should prompt broader sequencing.
  - Pyramidal signs with spasticity, peripheral neuropathy and posterior-column sensory loss are part of the classical Behr phenotype and are not reported in the milder SNF8 cohort.
  - 3-methylglutaconic aciduria points towards OPA3 within the Behr group and away from SNF8.
  - Behr syndrome is genetically heterogeneous by definition and is a clinically defined phenotype, so the two are not mutually exclusive on clinical grounds alone; only bi-allelic SNF8 variants establish NEDOA.
  notes: >-
    MONDO:0008858 was verified with OAK. The description of Behr syndrome here
    is drawn from the existing dismech entry
    kb/disorders/Behr_Syndrome.yaml and is presented as clinical context; the
    distinguishing features are reasoned contrasts, not quotations, which is
    why no evidence item is attached to this differential.
- name: Bosch-Boonstra-Schaaf optic atrophy syndrome
  disease_term:
    preferred_term: Bosch-Boonstra-Schaaf optic atrophy syndrome
    term:
      id: MONDO:0014320
      label: Bosch-Boonstra-Schaaf optic atrophy syndrome
  description: >-
    BBSOAS pairs optic atrophy with intellectual disability and developmental
    delay, which is the same two-part core as NEDOA, and it is the syndrome
    most likely to be on a clinician's list when a child presents with optic
    atrophy plus developmental delay. It is caused by NR2F1 variants or
    deletions.
  distinguishing_features:
  - BBSOAS is autosomal dominant and usually de novo; NEDOA is autosomal recessive, so an affected sibling with unaffected parents favours NEDOA.
  - NR2F1 deletions are detectable by chromosomal microarray, whereas SNF8 disease requires sequencing.
  - The two are distinguished definitively by the causal gene, not by the ophthalmological findings, which overlap substantially.
  notes: >-
    MONDO:0014320 was verified with OAK and matches the disease_term already
    bound in kb/disorders/Bosch-Boonstra-Schaaf_Optic_Atrophy_Syndrome.yaml.
    No evidence item is attached because the contrast is a reasoned clinical
    comparison rather than a quotable finding from a cached source.
- name: Autosomal dominant optic atrophy plus syndrome
  disease_term:
    preferred_term: autosomal dominant optic atrophy plus syndrome
    term:
      id: MONDO:0014720
      label: autosomal dominant optic atrophy plus syndrome
  description: >-
    Dominant OPA1 disease with extra-ocular features is the commonest
    inherited syndromic optic neuropathy and will be considered before a
    newly described recessive gene. Optic atrophy with ataxia is common to
    both.
  distinguishing_features:
  - Dominant transmission with an affected parent argues strongly against NEDOA, which is recessive.
  - Sensorineural deafness, chronic progressive external ophthalmoplegia and mitochondrial myopathy characterise the OPA1-plus phenotype; the only hearing impairment reported in the milder SNF8 cohort was conductive.
  - Intellectual disability is not a core feature of dominant optic atrophy plus, whereas it is present in every reported NEDOA individual.
  notes: >-
    MONDO:0014720 was verified with OAK and matches
    kb/disorders/Autosomal_Dominant_Optic_Atrophy_Plus.yaml. No evidence item
    is attached; the contrast is reasoned rather than quoted.
- name: CIMDAG syndrome
  disease_term:
    preferred_term: CIMDAG syndrome
    term:
      id: MONDO:0035819
      label: cerebellar hypoplasia-intellectual disability-congenital microcephaly-dystonia-anemia-growth retardation syndrome
  description: >-
    Included as a mechanistic rather than a clinical differential. CIMDAG
    syndrome is caused by VPS4A variants; VPS4A is the AAA-ATPase that
    disassembles ESCRT-III filaments, the step immediately downstream of the
    ESCRT-III nucleation that ESCRT-II performs. The pair establishes that
    lesions at adjacent stages of a single ESCRT cascade both produce syndromic
    neurodevelopmental disease with cerebellar and cognitive involvement, which
    is the argument for treating ESCRT dysfunction as a coherent disease group.
  distinguishing_features:
  - CIMDAG syndrome is dominant, with de novo missense variants acting through a dominant-negative mechanism; SNF8 disease is recessive and hypomorphic.
  - Congenital dyserythropoietic anemia with binucleated erythroblasts is characteristic of CIMDAG and has not been reported in SNF8 disease.
  - Congenital microcephaly and dystonia define CIMDAG; the microcephaly in the milder SNF8 cohort is a minority finding and dystonia is not reported.
  - Optic atrophy is the defining ophthalmological feature of NEDOA, whereas cataract is the eye finding in CIMDAG.
  notes: >-
    MONDO:0035819 was verified with OAK and matches the disease_term bound in
    kb/disorders/VPS4A-Related_Neurodevelopmental_Syndrome.yaml. This
    differential is deliberately mechanistic; a clinician is unlikely to
    confuse the two presentations. No evidence item is attached because the
    comparison is a reasoned cross-reference rather than a quoted finding.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy exists. Management is entirely supportive and
    follows the components of the phenotype: developmental and educational
    support, speech and language therapy for the near-universal language delay,
    low-vision services and educational accommodation for the optic atrophy, and
    physiotherapy where ataxia affects mobility.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  notes: >-
    Carried as a descriptor with no evidence item, deliberately. No management
    guideline, natural-history study, or treatment trial exists for this
    disorder - the entire clinical literature is one 2024 case series whose
    abstract says nothing about management, and no GeneReviews chapter exists
    (search recorded in the entry-level notes). The specific supportive measures
    listed are the standard-of-care response to the phenotypes curated above
    rather than anything reported for SNF8 disease, so attaching a snippet to
    them would be a claim/snippet mismatch.
- name: Genetic counselling
  description: >-
    Autosomal recessive recurrence risk counselling for the parents of a
    proband, with carrier testing for the specific familial alleles and
    discussion of reproductive options. Relevant to this disorder in particular
    because the same gene produces a lethal congenital encephalopathy at the
    severe end of the spectrum, so the counselling conversation has to address
    the possibility of a more severely affected sibling and cannot simply
    extrapolate the proband's mild course.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    No evidence item is attached. The autosomal recessive mode of inheritance
    that underpins this recommendation is separately evidenced in the
    `inheritance:` block from PMID:38423010; the counselling recommendation
    itself is a clinical inference from that mode of inheritance and from the
    two-term MONDO/OMIM structure of the SNF8 spectrum, not a published
    recommendation, so it is recorded here rather than dressed up with a
    snippet.
animal_models:
- species: Danio rerio
  genotype: snf8 loss of function
  category: Genetic
  description: >-
    Zebrafish snf8 loss of function is the only reported animal model. It
    reproduces the two organ-level features that matter for this entity,
    impaired optic nerve development and reduced forebrain size, alongside
    global developmental delay and altered embryo morphology. The model was
    also used to test individual human SNF8 alleles, and the alleles differed
    in their impact on embryonic development, which is the experimental basis
    for attributing the clinical spectrum to allele severity.
  associated_phenotypes:
  - Impaired optic nerve development
  - Reduced forebrain size
  - Global developmental delay
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Snf8 loss of function in zebrafish results in global developmental delay and altered embryo morphology, impaired optic nerve development, and reduced forebrain size."
    explanation: Describes the zebrafish phenotype, which recapitulates the optic nerve and forebrain involvement of the human disorder.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo experiments corroborated the pathogenicity of the tested SNF8 variants and their variable impact on embryo development, validating the observed clinical heterogeneity."
    explanation: Establishes that the model was used for allele-specific functional testing, not only for gene knockout, which is what links it to the genotype-phenotype correlation.

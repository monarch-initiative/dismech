  category: Neurologic
  diagnostic: true
  description: >-
    Intellectual disability is the constant feature and the reason the
    disorder is classified as neurodevelopmental rather than as an isolated
    optic neuropathy. It is the component named first in both the MedGen
    definition and the abstract's description of the milder cohort. Severity
    is not resolvable from the abstract.

  description: >-
    Optic atrophy is the feature that names the disorder and separates it from
    a generic neurodevelopmental disorder. The abstract describes it as
    childhood-onset. Whether the underlying lesion is failure of optic nerve
    development, progressive degeneration, or both is not settled by the human
    data, but the zebrafish model shows impaired optic nerve development,
    favouring a developmental contribution.
  phenotype_term:

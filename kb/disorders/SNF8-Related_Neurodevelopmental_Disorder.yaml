    evidence_source: HUMAN_CLINICAL
    snippet: "we conclude that loss of ESCRT-II due to bi-allelic SNF8 variants is associated with a spectrum of neurodevelopmental/neurodegenerative phenotypes mediated likely via impairment of the autophagic flux"
    explanation: The authors' own conclusion, marked PARTIAL because the word "likely" is theirs and the abstract does not report a direct autophagic-flux measurement in patient material.
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The endosomal sorting complex required for transport (ESCRT) machinery is essential for membrane remodeling and autophagy"
    explanation: >-
      Establishes autophagy, alongside membrane remodelling, as a core ESCRT
      function and therefore as a plausible route from ESCRT-II loss to
      neurodegeneration. Classified OTHER rather than HUMAN_CLINICAL: this is
      the paper's introductory statement of general cell biology and reports no
      human observation of its own, so tagging it HUMAN_CLINICAL would overstate
      the evidence type.
  downstream:
  - target: Optic Nerve and Forebrain Developmental Failure
    description: Neurons and retinal ganglion cells, being long-lived and dependent on autophagic turnover, are the cells that fail.
- name: Optic Nerve and Forebrain Developmental Failure
  biological_scale: TISSUE
  description: >-
    The tissue-level endpoint is selective failure of the visual pathway and
    the forebrain. Zebrafish snf8 loss of function reproduces this pattern
    specifically, producing impaired optic nerve development and reduced
    forebrain size in addition to global developmental delay and altered embryo
    morphology. That the optic nerve phenotype is recovered in a model organism
    is what elevates optic atrophy in this disorder from an incidental
    association to a mechanistically anchored feature, and it is the strongest
    available support for the visual pathway being intrinsically vulnerable to
    ESCRT-II loss rather than secondarily damaged.
  locations:
  - preferred_term: optic nerve
    term:
      id: UBERON:0000941
      label: cranial nerve II
  - preferred_term: forebrain
    term:
      id: UBERON:0001890
      label: forebrain
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  notes: >-
    The retinal ganglion cell binding is an inference, not an observation, and
    is flagged as such. No retina was examined histologically in PMID:38423010,
    and no electroretinography or optical-coherence-tomography ganglion-cell-layer
    measurement is reported in the cached abstract. The cell type is named
    because the retinal ganglion cell is the neuron whose axons constitute the
    optic nerve, so optic atrophy with reduced anterior-visual-pathway volume
    localises the lesion to that population by anatomy; and because retinal
    ganglion cells are the canonical autophagy- and energy-vulnerable long-axon
    neuron implicated in the mitochondrial optic neuropathies that form this
    disorder's clinical differential. Oligodendrocyte involvement, which the
    deep research pass also suggested, is NOT bound here: it rests only on
    "marked loss of myelin" at severe-pole autopsy, which is an inference from a
    different pole of the spectrum and one step further removed. CL:0000740 was
    verified with OAK on 2026-08-01.
  evidence:
  - reference: PMID:38423010
    reference_title: "Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental and epileptic encephalopathy to syndromic optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Snf8 loss of function in zebrafish results in global developmental delay and altered embryo morphology, impaired optic nerve development, and reduced forebrain size."
    explanation: An orthogonal animal model reproduces both the optic nerve and the forebrain components of the human phenotype, supporting a developmental rather than purely degenerative mechanism for the visual pathway involvement.
genetic:
- name: SNF8
  association: Bi-allelic variants; the mild NEDOA phenotype is associated specifically with the hypomorphic allele c.304G>A (p.Val102Ile)
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SNF8
    term:
      id: hgnc:17028
      label: SNF8
  notes: >-
    Nomenclature. HGNC:17028 is symbol SNF8, "SNF8 subunit of ESCRT-II", at
    17q21.32, Entrez 11267, Ensembl ENSG00000159210, UniProt Q96H20, with alias
    symbols EAP30, VPS22 and Dot3 (HGNC REST API, retrieved 2026-08-01). The
    structural literature cited in this entry uses VPS22 exclusively.

    Allelic architecture. The reference transcript in the founding report is
    NM_007241.4. The only allele identified by name in the cached abstract is
    c.304G>A (p.Val102Ile), described as hypomorphic and shared by all mildly
    affected individuals. The deep research pass adds, from the full text and
    from ClinVar, that seven distinct variants were reported across the six
    families and that every mildly affected individual carries p.Val102Ile in
    trans to a more damaging allele: c.423-1G>C (splice acceptor) in family D,
    c.673_683delinsTGGA p.Asp225TrpfsTer99 in family E, and c.236C>T p.Pro79Leu
    in family F. Absence of p.Val102Ile predicted the severe pole in all five
    severe cases. None of that per-family detail is abstract-verifiable, so it
    is recorded here rather than asserted with a snippet.

    Variant classification is genuinely contested and is recorded as such rather
    than smoothed over. ClinVar holds conflicting germline interpretations for
    c.304G>A (p.Val102Ile): the Institute of Human Genetics Munich submitted
    Pathogenic and OMIM submitted Pathogenic for neurodevelopmental disorder
    plus optic atrophy, while Ambry Genetics submitted Uncertain significance on
    insufficient or conflicting evidence. The Ambry position is defensible on
    the population data - gnomAD allele frequency for rs200399045 is about
    1.5 x 10^-4 and gnomAD contains one apparently healthy homozygote. A
    laboratory reporting this allele should not present it as unqualified
    Pathogenic. These ClinVar and gnomAD figures come from the deep research
    pass, not from the cached abstract.

    Not asserted, deliberately. gnomAD constraint metrics (pLI, o/e LoF,
    missense Z) are NOT recorded anywhere in this entry: the research pass could
    not reach the gnomAD API and explicitly warned against populating them from
    memory, and no other source consulted here provides them. DepMap
    essentiality is likewise not asserted for the same reason. Three large
    multi-gene 17q21.32 deletions appear in a ClinVar SNF8 gene query but are
    not SNF8-specific and are not curated as a cause of this disorder. No
    modifier locus, methylation episignature, founder allele, or somatic
    mechanism has been established.

    Because MONDO splits the SNF8 phenotype into two terms and both are
    caused by bi-allelic variants in this same gene, a laboratory reporting an
    SNF8 genotype cannot assign the OMIM phenotype number from the gene alone;
    the assignment depends on the allele and on the clinical severity.

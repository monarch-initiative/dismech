- name: AMC
  display_name: SYNE1-deficient arthrogryposis multiplex congenita
  description: >-
    The severe end of the spectrum, presenting prenatally and neonatally with
    decreased fetal movements, severe hypotonia, and multiple congenital joint
    contractures including clubfoot. Mechanistically part of SYNE1 deficiency
    but clinically remote from the adult-onset Beauce ataxia.

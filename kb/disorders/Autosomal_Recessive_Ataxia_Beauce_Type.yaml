prevalence:
- population: Eastern Quebec adults
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.67
  notes: >-
    In an Eastern Quebec cross-sectional study, ARCA1 (AR cerebellar ataxia type 1)
    was the most prevalent hereditary ataxia identified, at a minimum prevalence of
    2.67/100,000 [95% CI 2.65-2.7], within an overall adult hereditary ataxia
    prevalence of 6.47/100,000. This is a founder-population figure and a
    *minimum* (genetically confirmed cases only); it should not be read as a
    worldwide prevalence for this disorder, and no worldwide estimate is
    currently curated.
  evidence:
  - reference: PMID:33397523
    reference_title: "Genetic and Epidemiological Study of Adult Ataxia and Spastic Paraplegia in Eastern Quebec."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AR cerebellar ataxia type 1 (2.67/100 000) and AD spastic paraplegia SPG4 (1.18/100 000) were the most prevalent disorders identified."
    explanation: Provides a population-based minimum prevalence estimate for ARCA1.
progression:
- phase: Adult-onset cerebellar syndrome
  age_range: Adolescence to mid-adulthood (range ~6-45 years; mean onset ~31.6 years in founder cohort)
  notes: >-
    Classic Beauce phenotype begins with gait and limb ataxia in early-to-mid
    adulthood, with dysarthria following. Non-founder cohorts can show earlier
    (childhood/young-adult) onset.
  evidence:
  - reference: PMID:20301553
    reference_title: "SYNE1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SYNE1-deficient cerebellar ataxia, the most commonly recognized manifestation of SYNE1 deficiency to date, is a slowly progressive disorder typically beginning in adulthood (age range 6-45 years)."
    explanation: GeneReviews documents typical adult onset across a wide age range.
- phase: Slowly progressive course
  duration: Slowly progressive over years to decades
  notes: >-
    The founder phenotype progresses slowly to moderate disability with no effect
    on life expectancy; cerebellar-plus forms can carry additional morbidity from
    motor neuron and multisystem involvement.
  evidence:
  - reference: PMID:17503513
    reference_title: "Clinical and genetic study of autosomal recessive cerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recessive transmission, middle-age onset (mean, 31.60; range, 17-46 years), slow progression and moderate disability"
    explanation: Documents slow progression to moderate disability.
diagnosis:
- name: Brain MRI
  description: >-
    Brain MRI demonstrating diffuse cerebellar atrophy supports the diagnosis;
    normal nerve conduction studies help distinguish ARCA1 from ataxias with
    prominent peripheral neuropathy.
  evidence:
  - reference: PMID:17503513
    reference_title: "Clinical and genetic study of autosomal recessive cerebellar ataxia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal nerve conduction studies, and diffuse cerebellar atrophy on imaging"
    explanation: Imaging shows diffuse cerebellar atrophy with normal nerve conduction.
- name: Molecular genetic testing (NGS with CNV analysis)
  description: >-
    Next-generation sequencing (gene panel, exome, or genome) detects most SYNE1
    variants, but CNV-sensitive methods (e.g., array-CGH) are needed to detect
    large intragenic deletions that standard sequencing pipelines may miss.
    Diagnostic workup for adult-onset hereditary ataxia combines STR-expansion
    testing with sequencing.
  evidence:
  - reference: PMID:38136976
    reference_title: "A Case Report of SYNE1 Deficiency-Mimicking Mitochondrial Disease and the Value of Pangenomic Investigations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "even rare copy number variations should be considered in patients with a phenotype suggestive of SYNE1 deficiency"
    explanation: Highlights the need for CNV-sensitive testing in suspected SYNE1 deficiency.
  - reference: PMID:38760634
    reference_title: "An update on the adult-onset hereditary cerebellar ataxias: novel genetic causes and new diagnostic approaches."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Testing methods include targeted evaluation of STR expansions (e.g. SCAs, Friedreich ataxia, fragile X-associated tremor/ataxia syndrome, dentatorubral-pallidoluysian atrophy), next generation sequencing for conventional variants, which may include targeted gene panels, whole exome, or whole genome sequencing"
    explanation: Describes the contemporary diagnostic approach for adult-onset hereditary ataxia.
differential_diagnoses:
- name: Autosomal recessive spastic ataxia of Charlevoix-Saguenay (ARSACS)
  disease_term:
    preferred_term: ARSACS
    term:
      id: MONDO:0010041
      label: Charlevoix-Saguenay spastic ataxia
  description: >-
    The most important differential in the population where ARCA1 was defined:
    a second recessive ataxia with a Quebec founder effect, present in the same
    Eastern Quebec ataxia clinics. Both are recessive, both are cerebellar, and
    both are enriched in the same ancestry, so ancestry alone does not
    discriminate them.
  distinguishing_features:
  - Caused by biallelic SACS variants (sacsin), not SYNE1.
  - Prominent spasticity and peripheral neuropathy, whereas ARCA1 has normal nerve conduction studies and is relatively pure cerebellar.
  - Roughly six-fold rarer than ARCA1 in the same Eastern Quebec population (0.43 vs 2.67 per 100,000).
  evidence:
  - reference: PMID:33397523
    reference_title: "Genetic and Epidemiological Study of Adult Ataxia and Spastic Paraplegia in Eastern Quebec."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic mutations in SACS were found in seven non-related patients"
    explanation: >-
      Establishes that SACS-related ARSACS co-occurs with ARCA1 in the same
      Eastern Quebec cohort, making it the co-located differential.
- name: Friedreich ataxia
  disease_term:
    preferred_term: Friedreich ataxia
    term:
      id: MONDO:0100339
      label: Friedreich ataxia
  description: >-
    The commonest recessive ataxia overall and the comparator against which
    SYNE1 oculomotor findings have been benchmarked.
  distinguishing_features:
  - Caused by a GAA repeat expansion in FXN, detected by repeat-expansion testing rather than sequencing.
  - Sensory axonal neuropathy with absent reflexes; ARCA1 has normal nerve conduction studies.
  - Cardiomyopathy and diabetes are part of Friedreich ataxia and are not features of the ARCA1 founder phenotype.
  evidence:
  - reference: PMID:33526008
    reference_title: "Eye-tracking-aided characterization of saccades and antisaccades in SYNE1 ataxia patients: a pilot study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compare them to the same parameters of Friedreich ataxia (FA) patients and healthy subjects"
    explanation: >-
      Friedreich ataxia is used as the explicit clinical comparator group in the
      SYNE1 oculomotor study, reflecting its role as the primary differential.
- name: Primary mitochondrial disease
  description: >-
    SYNE1 deficiency can present with secondary mitochondrial findings and be
    misclassified as a primary mitochondrial disorder, a diagnostic trap worth
    recording explicitly because it redirects the whole testing strategy.
  distinguishing_features:
  - COX-negative fibers and mtDNA deletions can be present in SYNE1 deficiency as secondary findings.
  - Resolution requires pangenomic (exome plus CNV-sensitive) testing rather than mitochondrial-targeted testing.
  evidence:
  - reference: PMID:38136976
    reference_title: "A Case Report of SYNE1 Deficiency-Mimicking Mitochondrial Disease and the Value of Pangenomic Investigations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband presented with the association of cerebellar ataxia, COX-negative fibers on muscle histology, and mtDNA deletions."
    explanation: >-
      Documents a SYNE1-deficient proband whose muscle and mtDNA findings
      pointed toward a primary mitochondrial disorder before exome sequencing
      plus array-CGH identified biallelic SYNE1 variants.
discussions:
- discussion_id: syne1_proximal_cerebellar_target
  kind: OPEN_QUESTION
  status: UNDER_DISCUSSION
  prompt: >-
    Which cerebellar cell population is the proximal target of SYNE1 loss — the
    Purkinje cell nuclear envelope, as the canonical LINC model and this entry's
    pathograph assume, or the mossy-fibre/granule-cell synaptic compartment
    where the cerebellum-enriched KASH-less nesprin-1 isoform actually
    localizes?
  attaches_to:
  - pathophysiology#Disrupted Nuclear-Cytoskeletal LINC Coupling
  - pathophysiology#Cerebellar Neurodegeneration and Atrophy
  rationale: >-
    This entry asserts Purkinje-cell vulnerability in its pathograph and
    declares conformance to
    cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration, which is the
    mainstream reading of GeneReviews and of Dupre's statement that SYNE1 is
    critical to the maintenance of cerebellar structure. Neither of those
    sources actually demonstrates Purkinje neuron loss. The direct localization
    work points the other way: the abundant cerebellar isoform, KLNes1g, is
    KASH-less, sits at mossy-fibre glomeruli and granule-cell dendritic
    membranes rather than the nuclear envelope, and it is Nesprin2 - not
    Nesprin1 - that decorates the nuclear envelope of cerebellar neurons. If
    that is the operative lesion, the cell-type annotations and the module
    conformance on the degeneration node are describing the wrong compartment,
    and the canonical LINC framing is downstream of, or parallel to, the real
    mechanism rather than upstream of it.
  proposed_experiments:
  - experiment_id: exp_syne1_purkinje_vs_granule_neuropathology
    name: Neuropathological series quantifying Purkinje versus granule cell loss
    description: >-
      Assemble a systematic autopsy series of genetically confirmed SYNE1
      ataxia and quantify Purkinje versus granule cell loss and mossy-fibre
      glomerular pathology against age-matched controls. Human neuropathology
      currently rests on isolated case reports, so the entry's Purkinje-centric
      cell-type annotation is not presently testable against a series.
    would_support:
    - Selective Purkinje neuron loss out of proportion to granule cell loss.
    would_refute:
    - Granule cell or mossy-fibre pathology predominating with relatively preserved Purkinje populations.
  - experiment_id: exp_syne1_celltype_specific_ablation
    name: Cell-type-specific Syne1 ablation in mouse
    description: >-
      Ablate Syne1 selectively in Purkinje cells versus granule cells in mouse
      and compare ataxia severity and cerebellar histology, to establish which
      population is sufficient to produce the phenotype.
    would_support:
    - Purkinje-restricted ablation reproducing ataxia.
    would_refute:
    - Only granule-cell-restricted ablation reproducing ataxia.
  - experiment_id: exp_klnes1g_human_cerebellum_localization
    name: KASH-less nesprin-1 isoform expression in human cerebellum
    description: >-
      Determine whether the KASH-less nesprin-1 isoform is expressed and
      similarly localized in human cerebellum. The existing splicing and
      immunogold localization data are from mouse, so the translational
      validity of the synaptic model to human disease is untested.
    would_support:
    - Detection of the KASH-less isoform at human mossy-fibre glomeruli.
    would_refute:
    - Absence of the isoform, or exclusively nuclear-envelope localization, in human cerebellum.
  notes: >-
    Recorded during the 2026-08 publication-readiness review. The conformance
    and the Purkinje cell_types annotations are deliberately retained as the
    mainstream model rather than removed, but they should not be read as
    evidence-backed claims about the proximal cellular target. PMID:36525394
    (an autopsied SYNE1-ataxia patient) is listed under references as a
    bibliographic pointer only and is deliberately not cited as evidence
    anywhere in this entry: PubMed carries no abstract for that letter, so no
    snippet can be verified against a cached source. Mine it for evidence if
    full text ever reaches the cache.
review_notes: >-
  Publication-readiness review, August 2026. Baseline was already schema-valid
  with 100% recommended-field compliance and 46/46 verified snippets, so this
  pass targeted content completeness and claim-evidence alignment rather than
  structure. Changes: added the three GeneReviews-defined presentations as
  has_subtypes so severe-end features can be curated without leaking into the
  adult-onset Beauce founder phenotype; added 21 source-backed phenotypes and
  wired every one of them into the pathograph; declared conformance to
  cerebellar_purkinje_degeneration; tagged biological_scale; converted the
  free-text prevalence record to the structured measure_type/prevalence_class/
  rate_per_100000 slots; and added differential diagnoses. Snippet count went
  46 -> 96, all verified.

  Claim-evidence alignment fixes. (1) The EMERGING synaptic-isoform hypothesis
  was supported only by a generic LINC-complex review whose quoted sentence
  never mentions an isoform; it now cites the primary source (PMID:25843669)
  for both the KASH-less cerebellar isoform and its synaptic localization.
  (2) Dysarthria claimed "present in essentially all patients in the founder
  cohort" and a VERY_FREQUENT band that no source quantified; the description
  now tracks what Dupre actually wrote and the band is explicitly justified as
  a qualitative mapping. (3) The FREQUENT band on upper motor neuron
  dysfunction is likewise now tied to the source word "many". (4) Component
  motor-neuron signs are curated WITHOUT frequency bands, because the source
  quantifies the UMN and LMN arms as wholes and not the individual signs.
  (5) The prevalence record now states that 2.67/100,000 is a minimum
  founder-population figure and not a worldwide rate.

  Dispositions for the 19 remaining D2P recommendations, none of which are
  adopted in this pass:

  - Peripheral-neuropathy cluster (HP:0003477 peripheral axonal neuropathy,
    HP:0003390 sensory axonal neuropathy, HP:0007267 chronic axonal
    neuropathy, HP:0007178 motor polyneuropathy, HP:0001271 polyneuropathy,
    HP:0003445 EMG neuropathic changes, HP:0002495 impaired vibratory
    sensation). NOT ADDED, deliberately. The ARCA1 founder phenotype is
    defined in part by normal nerve conduction studies, and normal NCS is what
    separates it from Friedreich ataxia and ARSACS in the differential above.
    OMIM/Orphanet carry these at Very rare/Occasional, presumably from
    non-founder SYNE1 cohorts. Adding them unqualified would contradict the
    entry's own definition; adding them qualified needs a cohort source that
    reports neuropathy in genetically confirmed SYNE1 patients, which is not
    in the cache. Revisit with such a source.
  - Skeletal/ocular items (HP:0002808 kyphosis, HP:0000508 ptosis, HP:0000597
    ophthalmoparesis, HP:0031960 arm dystonia, HP:0000020 urinary
    incontinence, HP:0002312 clumsiness, HP:0007366 brainstem atrophy,
    HP:0002500 abnormal cerebral white matter, HP:0001270 motor delay). NOT
    ADDED: no cached source supports any of them with a quotable snippet, and
    HP:0002500 and HP:0007366 additionally sit against this entry's curated
    claim that the classic phenotype shows cerebellar atrophy without
    brainstem or white-matter involvement. Fetch primary sources before
    adopting.
  - Broader-term flags (HP:0002061 lower limb spasticity vs curated HP:0001257
    spasticity; HP:0007340 lower limb muscle weakness vs curated HP:0001324
    muscle weakness; HP:0011448 ankle clonus under HP:0002493). NOT
    NARROWED: GeneReviews names spasticity and muscle weakness without limb
    localization, so the broader terms are what the evidence actually supports.
    Narrowing would assert a distribution no cited source states. Ankle clonus
    is not named in any cached source.

  Also unresolved and worth flagging beyond this entry: `just refresh-orphadata`
  currently fails a checksum check against the pinned manifest (upstream
  Orphadata has drifted), so ORPHA:88644 could not be cached and Orphanet
  frequency rows were unavailable as evidence for this review. That blocks
  Orphanet-backed frequency curation repo-wide, not just here.

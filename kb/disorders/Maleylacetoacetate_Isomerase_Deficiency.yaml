name: Maleylacetoacetate Isomerase Deficiency
category: Mendelian
creation_date: '2026-09-06T00:00:00Z'
synonyms:
- MAAI deficiency
- MAAID
- GSTZ1 deficiency
- Glutathione transferase zeta 1 deficiency
- Mild hypersuccinylacetonaemia
- MHSA
description: >
  Maleylacetoacetate isomerase deficiency is an autosomal recessive inborn error
  of tyrosine catabolism caused by biallelic variants in GSTZ1, which encodes
  maleylacetoacetate isomerase — the glutathione-dependent enzyme that isomerises
  maleylacetoacetate to fumarylacetoacetate, the step immediately upstream of
  fumarylacetoacetate hydrolase. It is curated here because it is the exception
  that the rest of the distal tyrosine pathway does not predict: a block one
  enzyme above the lesion that causes hepatorenal tyrosinemia type 1 produces
  only mild, often intermittent hypersuccinylacetonaemia and, in every
  molecularly confirmed individual followed to date, no disease. The
  mechanistic explanation is a glutathione-mediated non-enzymatic isomerisation
  of maleylacetoacetate that partially substitutes for the missing enzyme,
  demonstrated in vitro and in Gstz1-null mice. That bypass is not unconditional:
  under phenylalanine or tyrosine overload, a high-protein diet, or glutathione
  depletion, mutant mice develop renal and hepatic necrosis and die, and no human
  counterpart of that stressed state has been reported. Clinically the entry
  matters mainly as a differential diagnosis in newborn screening — elevated
  dried-blood-spot succinylacetone is no longer pathognomonic for tyrosinemia
  type 1 — where elevated urinary maleic acid discriminates the two and spares
  the infant unnecessary nitisinone and dietary restriction.

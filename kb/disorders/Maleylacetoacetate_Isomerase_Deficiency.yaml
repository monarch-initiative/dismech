      MONDO:0060527 (maleylacetoacetate isomerase deficiency) cross-references
      OMIM:617596, MEDGEN:713903 and UMLS:C1291607, and carries MAAID as a
      synonym. OMIM:617596 is the GSTZ1 entity, matching IEMbase WP-002 row

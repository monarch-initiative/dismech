      III, alkaptonuria or hawkinsinuria, which are separate MONDO entities on
      separate genes.
inheritance:
- name: Autosomal recessive
  description: >
    Biallelic GSTZ1 variants are required. Segregation in the German family is
    the clearest demonstration: the index case was homozygous for a canonical
    splice-site variant, his mother heterozygous and clinically unremarkable,
    and his father homozygous and — at 32 years, on an unrestricted diet —
    also unremarkable.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27876694
    reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four individuals were homozygous for c.449C>T (p.Ala150Val). One was compound heterozygous for c.259C>T (p.Arg87Ter) and an intronic sequence variant."
    explanation: Homozygous and compound heterozygous genotypes in the founding case series establish the recessive requirement.
  - reference: PMID:38535121
    reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mother was found to be heterozygous and the father homozygous for this variant."
    explanation: Family segregation showing an unaffected heterozygous carrier alongside a homozygous relative.
prevalence:
- population: Worldwide, published case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >
    No population-based rate has been established. As of the 2025 review, fewer
    than 20 people with MAAI deficiency had been reported, clinical follow-up
    was available for nine, and biallelic GSTZ1 variants had been confirmed in
    only eight. The band is recorded as the coarse ultra-rare tier on that
    published-case basis, not from a measured rate. Ascertainment is almost
    entirely through succinylacetone-based newborn screening, so the reported
    count is a lower bound on an unknown true frequency: individuals whose
    screening succinylacetone falls below the local cut-off — as it did in the
    32-year-old homozygous father, whose dried-blood-spot value was within the
    reference range — are invisible to that route entirely.
  evidence:
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Less than 20 people with MAAID have been reported, with clinical follow-up only available for 9 of them; among these, bi-allelic variants in the GSTZ1 gene were identified in only eight individuals"
    explanation: Provides the published-case count from which the ultra-rare band is derived.
- population: Heidelberg newborn screening cohort, Germany, August 2016 to December 2020
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.19
  rate_denominator: LIVE_BIRTHS
  notes: >
    One genetically confirmed case among 516,803 newborns screened for
    tyrosinemia type 1 gives approximately 0.19 per 100,000 live births. This is
    an ascertainment-limited detection rate, not a true birth prevalence: only
    infants exceeding the succinylacetone cut-off entered the diagnostic
    pathway, a second suspected case in the same cohort was never genetically
    resolved, and the cut-off was raised mid-study. Read it as a floor.
  evidence:
  - reference: PMID:38535121
    reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 516,803 children underwent NBS for HT1 at the NBS center in Heidelberg between August 2016 and December 2020."
    explanation: Gives the screening denominator behind the detection rate.
  - reference: PMID:38535121
    reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MAAI deficiency was suspected in two cases and genetically confirmed in one who showed traces of succinylacetone in urine."
    explanation: Gives the numerator, and shows why it is a floor rather than a count.
clinical_burden:
  burden_level: LOW
  rationale: >
    No molecularly confirmed individual has developed disease. The Québec series
    of six went untreated with a normal course to 13 years; a German homozygote
    reached 32 years on an unrestricted diet including dairy and meat with normal
    liver and kidney chemistry; two Italian infants were well at 2 and 4 years,
    one of them after nitisinone and dietary restriction were withdrawn without
    consequence. The real burden is iatrogenic and informational rather than
    pathophysiological: a positive newborn screen for a lethal treatable disease,
    an interval of unnecessary nitisinone and protein restriction while
    tyrosinemia type 1 is excluded, and a lifelong surveillance recommendation
    whose necessity is unestablished. Recorded LOW rather than UNKNOWN because
    the observed burden across every confirmed case is genuinely low; the residual
    uncertainty about lifelong metabolite exposure is carried by a knowledge-gap
    discussion instead.
  evidence:
  - reference: PMID:27876694
    reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The six individuals with mild hypersuccinylacetonaemia (MHSA) were not treated with diet or nitisinone. Their clinical course has been normal for up to 13 years."
    explanation: The founding series establishes a normal untreated course over more than a decade.
  - reference: PMID:38535121
    reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The father was without obvious medical complaints at the age of 32 years and adhered to a regular diet including dairy and meat. He had never experienced episodes of liver disease or clinical decompensation despite having experienced several intercurrent infections."
    explanation: The longest natural history on record, on an unrestricted protein intake.
progression:
- phase: Newborn-screening ascertainment
  age_range: First days of life
  notes: >
    Detection is by an elevated dried-blood-spot succinylacetone on newborn
    screening for tyrosinemia type 1, with normal plasma tyrosine. Coagulation
    testing and liver enzymes are normal at referral, which is the observation
    that separates these infants from tyrosinemia type 1 at the bedside before
    any genetic result is available.
  evidence:
  - reference: PMID:27876694
    reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six newborns referred for hypersuccinylacetonaemia but who had normal coagulation testing on initial evaluation had sequence variants in the GSTZ1 gene, encoding maleylacetoacetate isomerase (MAAI), the enzyme preceding FAH in tyrosine degradation."
    explanation: Defines the presenting picture and the normal-coagulation discriminator at referral.
- phase: Diagnostic interval
  age_range: Weeks to months after screening
  notes: >
    Until tyrosinemia type 1 is excluded, some infants are started on nitisinone
    and a tyrosine- and phenylalanine-restricted diet. In the reported Italian
    case this ran to 21 months before GSTZ1 sequencing allowed withdrawal.
    Succinylacetone in dried blood spots falls into the reference range on
    treatment and rises modestly again afterwards, without any accompanying
    change in tyrosine, transaminases, bilirubin, coagulation or renal
    parameters — so the treatment moves the marker without evidence of moving
    anything else.
  evidence:
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 1 showed intermittent SA elevation; Nitisinone and dietary treatment were started, then discontinued after the identification of two variants in the GSTZ1 gene and the definitive diagnosis of MAAID."
    explanation: Documents the treat-then-withdraw course of the diagnostic interval.
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of clinical and biochemical deterioration after therapy withdrawal suggests that the intervention did not confer a measurable benefit in MAAID, at least during the follow-up period."
    explanation: Records the authors' reading of the withdrawal experiment.
- phase: Untreated long-term course
  age_range: Childhood through at least the fourth decade
  notes: >
    Longitudinal follow-up exists for only four individuals, spanning 10 to 32
    years, and has been unremarkable throughout. The oldest is a homozygous
    adult ascertained by cascade testing rather than screening, with normal
    renal function, transaminases, coagulation and alpha-fetoprotein, and
    undetectable urinary succinylacetone.
  evidence:
  - reference: PMID:38535121
    reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our observation of natural history over 32 years adds evidence for a benign clinical course of MAAI deficiency without specific treatment."
    explanation: States the longest untreated natural history reported.
mechanistic_hypotheses:
- hypothesis_group_id: gsh_bypass_sufficiency
  hypothesis_label: A glutathione-dependent non-enzymatic bypass keeps the enzymatic block clinically silent
  status: CANONICAL
  description: >
    The accepted explanation for why loss of the penultimate enzyme of tyrosine
    catabolism is benign while loss of the final one is lethal. Glutathione
    binds maleylacetoacetate spontaneously and can isomerise it to
    fumarylacetoacetate without the enzyme, slowly but fast enough at the
    millimolar hepatic glutathione concentrations found in vivo. The bypass was
    shown directly in vitro, and inferred in vivo from Maai/Fah double-mutant
    mice, which die of a fumarylacetoacetate-driven phenotype that could only
    have arisen if maleylacetoacetate reached fumarylacetoacetate in the absence
    of the enzyme.
  evidence:
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A glutathione-mediated isomerization of MAA to FAA independent of MAAI enzyme was demonstrated in vitro. This nonenzymatic bypass is likely responsible for the lack of a phenotype in nonstressed MAAI mutant mice."
    explanation: The in vitro demonstration and the authors' attribution of the absent phenotype to it.
- hypothesis_group_id: bypass_saturation_toxicity
  hypothesis_label: The bypass is saturable, so substrate overload or glutathione depletion should be toxic
  status: EMERGING
  description: >
    A conditional-toxicity model derived entirely from the mouse. Because the
    non-enzymatic reaction is slow, it should fail when maleylacetoacetate
    production is raised or when glutathione is consumed — and in mice it does,
    producing hepatic and renal necrosis, leucopenia and death. Curated as
    EMERGING rather than CANONICAL because no human has been reported in that
    stressed state: the only long-term human observations are of unrestricted
    ordinary diets, which the mouse data would not predict to be dangerous
    either. The model is what motivates the standing advice to avoid protein
    supplements, dichloroacetate and glutathione-depleting drugs, so it is
    currently doing clinical work on animal evidence alone.
  evidence:
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A complete redundancy of MAAI could be ruled out because substrate overload of the tyrosine catabolic pathway (administration of homogentisic acid, phenylalanine, or tyrosine) resulted in renal and hepatic damage."
    explanation: Establishes the saturability of the bypass under substrate load in the mouse.
pathophysiology:
- name: Maleylacetoacetate isomerase deficiency
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Biallelic GSTZ1 variants reduce maleylacetoacetate isomerase activity,
    blocking the glutathione-dependent isomerisation of maleylacetoacetate to
    fumarylacetoacetate — the step immediately upstream of fumarylacetoacetate
    hydrolase, whose loss causes tyrosinemia type 1. The pathway operates in
    hepatocytes and renal proximal tubular cells. Patient missense alleles have
    been expressed in bacteria and shown to retain only low activity, so the
    lesion is a genuine enzymatic deficiency rather than a regulatory or
    transport defect.
  genes:
  - preferred_term: GSTZ1
    term:

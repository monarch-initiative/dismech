    evidence:
    - reference: PMID:37545091
      reference_title: "Maleic acid is a biomarker for maleylacetoacetate isomerase deficiency; implications for newborn screening of tyrosinemia type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Q-uMA ranged from not detectable to 1.16 mmol/mol creatinine in controls (n = 66) and from 0.95 to 192.06 mmol/mol creatinine in false-positive newborns and MAAI-D children (n = 10)."
      explanation: Quantifies the urinary maleic acid elevation against a control distribution.
- name: Bypass saturation under substrate overload or glutathione depletion
  biological_scale: MOLECULAR
  description: >
    A conditional state, established only in the mouse, in which the chemical
    rescue fails. It is reached by raising flux into the blocked step
    (homogentisic acid, phenylalanine or tyrosine loading, or simply a
    bean-and-lentil high-protein diet) or by consuming the co-substrate
    (diethylmaleate or phorone, and by extension glutathione-depleting drugs such
    as acetaminophen). Free maleylacetoacetate then accumulates. No human has
    been reported in this state, and the ordinary unrestricted human diets under
    which affected people have remained well are not obviously equivalent to any
    of the murine loading protocols — so this node is a prediction about humans,
    not an observation of them.
  chemical_entities:
  - preferred_term: 4-maleylacetoacetate
    term:
      id: CHEBI:17105
      label: 4-maleylacetoacetate
    modifier: INCREASED
  - preferred_term: glutathione
    term:
      id: CHEBI:16856
      label: glutathione
    modifier: DECREASED
  evidence:
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, MAAI deficiency may manifest itself as hypersensitivity to GSH-depleting drugs, such as acetaminophen."
    explanation: States the glutathione-depletion arm of the saturating condition and its predicted pharmacological consequence.
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To simulate nutritional conditions experienced by mice in the wild, experimental animals were fed a diet consisting of beans and lentils, which are high in protein. Under these conditions, MAAI mutant mice also developed renal and hepatic injury and had reduced survival"
    explanation: Shows the substrate-load arm is reachable by ordinary dietary protein in the mouse, not only by pharmacological loading.
  downstream:
  - target: Hepatorenal injury and leucopenia in the saturated state
    description: >
      Once free maleylacetoacetate accumulates, tissue injury follows in the
      mouse, with the kidney as the predominant target.
    causal_link_type: DIRECT
    hypothesis_groups:
    - bypass_saturation_toxicity
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Double mutants showed predominant renal injury, indicating that this organ is the primary target for the accumulated compound(s) resulting from MAAI deficiency."
      explanation: Identifies the target organ of the accumulating compound in the saturated state.
- name: Hepatorenal injury and leucopenia in the saturated state
  biological_scale: TISSUE
  description: >
    The terminal node of the mouse-derived arm: renal epithelial vacuolization,
    apoptosis and necrosis with rising creatinine, hepatic necrosis and
    steatosis with rising transaminases, and — on high dietary phenylalanine —
    a rapid 60 percent fall in circulating white cells attributed to
    maleylacetoacetate or maleylacetone reaching the circulation. Nitisinone,
    which blocks the pathway two steps above, prevents it, confirming the
    injury is driven by flux through tyrosine catabolism rather than by the
    genotype as such. This node has no reported human counterpart and therefore
    carries no downstream phenotype in this entry; the prediction that it would
    present as renal tubular dysfunction or Fanconi syndrome remains untested.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:19426674
    reference_title: "Phenylalanine-induced leucopenia in genetic and dichloroacetic acid generated deficiency of glutathione transferase Zeta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Exposure of GSTZ1-1 deficient mice to high dietary phenylalanine causes a rapid loss of circulating white blood cells (WBCs)."
    explanation: Documents the haematological arm of the saturated-state injury.
  - reference: PMID:19426674
    reference_title: "Phenylalanine-induced leucopenia in genetic and dichloroacetic acid generated deficiency of glutathione transferase Zeta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The rapid loss of WBCs was attributed to the accumulation of the catabolic intermediates maleylacetoacetate or maleylacetone (MA) in the circulation."
    explanation: Attributes the leucopenia to the accumulating intermediate rather than to phenylalanine itself.
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, the most likely manifestation of MAAI deficiency in humans would be renal tubular dysfunction or renal Fanconi syndrome."
    explanation: The authors' extrapolation to a human phenotype, recorded as indirect because it is a prediction from the murine target organ and has not been observed.
phenotypes:
- category: Biochemical
  name: Mild hypersuccinylacetonaemia
  description: >
    Circulating succinylacetone above the reference range but far below
    untreated tyrosinemia type 1, and frequently intermittent — normalising on
    repeat dried-blood-spot sampling in some infants. This is the entire
    consistent human phenotype of the disorder; no clinical abnormality has been
    reported alongside it in any molecularly confirmed individual.
  phenotype_term:
    preferred_term: Mild elevation of circulating succinylacetone
    term:
      id: HP:6001410
      label: Elevated circulating succinylacetone concentration
    severity: MILD
  evidence:
  - reference: PMID:27876694
    reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MHSA can be caused by sequence variants in GSTZ1. Such individuals have thus far remained asymptomatic despite receiving no specific treatment."
    explanation: Names the biochemical phenotype and records that it is unaccompanied by clinical disease.
  - reference: PMID:37545091
    reference_title: "Maleic acid is a biomarker for maleylacetoacetate isomerase deficiency; implications for newborn screening of tyrosinemia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated SA may also be due to maleylacetoacetate isomerase deficiency (MAAI-D), which appears to be clinically insignificant."
    explanation: Independently states that the succinylacetone elevation here carries no evident clinical significance.
- category: Biochemical
  name: Elevated urinary succinylacetone
  description: >
    Urine organic acid analysis shows succinylacetone, sometimes only as traces
    quantitatively below the laboratory's abnormal cut-off. Reported values in
    screened infants have ranged from traces to 2 mmol/mol creatinine against a
    cut-off of 1. In the 32-year-old homozygous adult, urinary succinylacetone
    was undetectable — so a negative urine result does not exclude the genotype.
  phenotype_term:
    preferred_term: Elevated urinary succinylacetone
    term:
      id: HP:6000598
      label: Elevated urinary succinylacetone level
  evidence:
  - reference: PMID:38535121
    reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An analysis of urinary organic acids showed traces of succinylacetone in urine, quantitatively still below the cut-off of the laboratories' abnormal range (N < 1 mmol/mol creatinine)."
    explanation: Documents the urinary finding and its sub-cut-off magnitude in a confirmed case.
- category: Biochemical
  name: Elevated urinary maleic acid excretion
  description: >
    Urinary maleic acid is raised in maleylacetoacetate isomerase deficiency and
    not in tyrosinemia type 1, which makes it the discriminating analyte rather
    than merely another marker of the block. Bound to the broader HPO carboxylic
    acid concept because HPO has no term for maleic acid specifically.
  phenotype_term:
    preferred_term: Elevated urinary maleic acid
    term:
      id: HP:0031980
      label: Abnormal urine carboxylic acid level
    modifier: INCREASED
  diagnostic: true
  evidence:
  - reference: PMID:37545091
    reference_title: "Maleic acid is a biomarker for maleylacetoacetate isomerase deficiency; implications for newborn screening of tyrosinemia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study shows that MAAI-D is a recognizable cause of false-positive TT1 NBS results. Elevated urine maleic acid excretion seems highly effective in discriminating MAAI-D from TT1."
    explanation: Establishes both the finding and its discriminating value against tyrosinemia type 1.
biochemical:
- name: Plasma and dried-blood-spot succinylacetone
  presence: INCREASED
  specificity: LOW
  context: >
    The screening analyte. It is sensitive for the block but not specific to it:
    the same elevation is produced by fumarylacetoacetate hydrolase deficiency,
    including partial deficiency from the pseudodeficient p.Arg341Trp allele. The
    magnitude separates them in practice — hundreds of nmol/L here against tens of
    thousands in untreated tyrosinemia type 1 — but the ranges are a guide rather
    than a boundary, and nanomolar-range quantitation by GC-MS/MS is what makes
    the distinction analytically tractable.
  biomarker_term:
    preferred_term: succinylacetone
    term:
      id: CHEBI:87897
      label: 4,6-dioxoheptanoic acid
  evidence:
  - reference: PMID:27876694
    reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial plasma SA levels ranged from 233 to 1282 nmol/L, greater than normal (<24 nmol/L) but less than the initial values of patients with HT1 (16 944-74 377 nmol/L, n=15)."
    explanation: Gives the observed concentration range against the normal range and against tyrosinemia type 1.
  - reference: PMID:41767123
    reference_title: "Quantitative Succinylacetone Measurement by Gas Chromatography-Tandem Mass Spectrometry (GC-MS/MS) Facilitates Diagnosis, Monitoring, and Characterization of Tyrosinemia Type 1 and Other Hypersuccinylacetonemias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This assay facilitates laboratory diagnosis and monitoring of HT1, permits identification and characterization of other hypersuccinylacetonemias including maleylacetoacetate isomerase deficiency"
    explanation: Establishes that nanomolar-range quantitation is what allows this disorder to be characterised biochemically.
- name: Urinary maleic acid
  presence: INCREASED
  specificity: HIGH
  context: >
    Quantitative urinary maleic acid by LC-MS/MS separated confirmed cases from
    controls cleanly in the only study to measure it: undetectable to 1.16
    mmol/mol creatinine in 66 controls against 0.95 to 192.06 in ten
    screen-positive or confirmed children, and normal in tyrosinemia type 1.
    Genetic confirmation tracked the analyte in that series — the two
    normal-maleic-acid newborns were both genetically excluded.
  biomarker_term:
    preferred_term: maleic acid
    term:
      id: CHEBI:18300
      label: maleic acid
  evidence:
  - reference: PMID:37545091
    reference_title: "Maleic acid is a biomarker for maleylacetoacetate isomerase deficiency; implications for newborn screening of tyrosinemia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MAAI-D was genetically confirmed in 4/7 false-positive newborns, all with elevated Q-uMA, and rejected in the two newborns with normal Q-uMA."
    explanation: Shows the analyte tracking the molecular diagnosis in both directions.
genetic:
- name: GSTZ1 deficiency
  gene_term:
    preferred_term: GSTZ1
    term:
      id: hgnc:4643
      label: GSTZ1
  inheritance:
  - name: Autosomal recessive
    description: Biallelic GSTZ1 variants are required; heterozygous carriers are unaffected.
    evidence:
    - reference: PMID:38535121
      reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recently, biallelic pathogenic variants in GSTZ1 underlying maleylacetoacetate isomerase (MAAI) deficiency have been described as a differential diagnosis in individuals with slightly elevated succinylacetone detected by NBS."
      explanation: States the biallelic requirement and the clinical context in which the genotype is found.
  variants:
  - name: GSTZ1 missense variants
    description: >
      c.449C>T (p.Ala150Val) was homozygous in four of the six individuals in the
      founding Québec series and c.295G>A (p.Val99Met) was seen in a further
      individual; both retained only low activity on bacterial expression.
      p.Val99Met has since recurred in trans with a splicing allele in an Italian
      infant and is classified likely pathogenic.
    evidence:
    - reference: PMID:27876694
      reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In one, a single heterozygous GSTZ1 sequence variant was identified, c.295G>A (p.Val99Met)."
      explanation: Documents the p.Val99Met allele in the founding series.
    - reference: PMID:41009955
      reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The genetic analysis highlighted the presence of the variants c.68-12G>A and c.295G>A, p.(Val99Met), in the GSTZ1 gene."
      explanation: Documents recurrence of the same missense allele in an unrelated case.
  - name: GSTZ1 splicing variants
    description: >
      Splicing alleles account for much of the reported molecular spectrum. A
      homozygous canonical acceptor-site change, c.136-2A>G, was found in a
      German consanguineous family and predicted to trigger nonsense-mediated
      decay. The deep-intronic c.68-12G>A, shared by two unrelated Italian
      infants, creates a cryptic acceptor: RNA from a patient showed retention of
      10 bp at the exon 2 to 3 junction, which upgraded the variant from
      uncertain significance to likely pathogenic and, by trans configuration,
      upgraded the partner allele with it.
    evidence:
    - reference: PMID:38535121
      reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant is predicted to lead to a loss of the splice acceptor site in exon 4 and therefore to aberrant splicing and presumably the nonsense-mediated mRNA decay of abnormally spliced protein."
      explanation: Documents the canonical splice-acceptor allele and its predicted consequence.
    - reference: PMID:41009955
      reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "To confirm this hypothesis, we carried out patient 1 RNA sequencing, which highlighted retention of 10 bp in the exon 2-3 junction, due to the creation of a cryptic splice site in position c.68-10 (Figure 2)."
      explanation: RNA-level functional evidence establishing the cryptic-acceptor mechanism of the recurrent intronic allele.
  - name: GSTZ1 nonsense variants
    description: >
      c.259C>T (p.Arg87Ter) was found in trans with an intronic variant in one
      individual of the founding series.
    evidence:
    - reference: PMID:27876694
      reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One was compound heterozygous for c.259C>T (p.Arg87Ter) and an intronic sequence variant."
      explanation: Documents the reported nonsense allele and its compound heterozygous context.
  features: >
    GSTZ1 is bifunctional. Besides its tyrosine-pathway role it is the principal
    enzyme metabolising dichloroacetate, so GSTZ1 genotype is an established
    pharmacogenetic determinant in its own right — haplotype governs
    dichloroacetate clearance in healthy volunteers, and clinical genotyping is
    used to individualise dosing. That second function is why loss-of-function
    genotypes here carry a drug-exposure implication that is independent of, and
    better evidenced than, any disease risk from the metabolic block itself.
  evidence:
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The GSTZ1 gene encodes maleylacetoacetate isomerase, a bifunctional enzyme that plays a critical role in both tyrosine catabolism and detoxification of xenobiotic compounds, such as dichloroacetate."
    explanation: Establishes the gene's second, xenobiotic-metabolising function.
  - reference: PMID:29641284
    reference_title: "Personalized Dosing of Dichloroacetate Using GSTZ1 Clinical Genotyping Assay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variation in the GSTZ1 haplotype is the principal variable influencing DCA kinetics and dynamics in humans."
    explanation: Quantifies the pharmacogenetic consequence of GSTZ1 variation in humans.
diagnosis:
- name: Newborn screening for dried-blood-spot succinylacetone
  description: >
    Ascertainment is a by-product of screening for tyrosinemia type 1. The
    finding that brings the infant to attention is an elevated succinylacetone
    with normal tyrosine; because the elevation is mild and sometimes
    intermittent, cut-off choice determines whether the disorder is seen at all.
  diagnosis_term:
    preferred_term: newborn screening
    term:
      id: NCIT:C81178
      label: Newborn Screening
  evidence:
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both cases displayed elevated SA and normal Tyrosine levels at newborn screening."
    explanation: Defines the screening finding that initiates the diagnostic pathway.
- name: Coagulation and liver function testing to exclude tyrosinemia type 1
  description: >
    Normal coagulation at initial evaluation is the first discriminator, since
    newborns with tyrosinemia type 1 are clinically asymptomatic but show
    coagulation abnormalities. It is a negative finding rather than a positive
    one, and does not by itself distinguish this disorder from partial
    fumarylacetoacetate hydrolase deficiency.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:27876694
    reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Newborns with HT1 are usually clinically asymptomatic but show liver dysfunction with coagulation abnormalities (prolonged prothrombin time and/or high international normalised ratio)."
    explanation: Establishes why normal coagulation is informative at referral.
- name: Quantitative urinary maleic acid
  description: >
    LC-MS/MS quantitation of urinary maleic acid, normalised to creatinine, is
    the positive biochemical test for this disorder and separated confirmed cases
    from tyrosinemia type 1 and from controls in the study that introduced it.
    Conventional urine organic acid analysis by GC-MS detects the same
    abnormality in most but not all cases.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:37545091
    reference_title: "Maleic acid is a biomarker for maleylacetoacetate isomerase deficiency; implications for newborn screening of tyrosinemia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study investigated whether urine organic acid (uOA) and quantitative urine maleic acid (Q-uMA) analyses can distinguish between TT1 and MAAI-D."
    explanation: Identifies the assay and the diagnostic question it was designed to answer.
- name: GSTZ1 molecular genetic testing
  description: >
    Confirmation requires biallelic GSTZ1 variants. Both a targeted two-gene
    FAH-plus-GSTZ1 approach and a five-gene hereditary tyrosinemia panel
    (HPD, FAH, TAT, HGD, GSTZ1) have been used; the panel shortened time to
    diagnosis from months to weeks in directly compared cases, which matters
    because the interval is when unnecessary treatment is given.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In case 2, the molecular testing was carried out by analysis of a multigene NGS (Next Generation Sequencing) panel, including the five genes associated with hereditary tyrosinemia (i.e., HPD, FAH, TAT, HGD, and GSTZ1)"
    explanation: Documents the panel-based confirmatory approach.
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Case 2, the final diagnosis was reached within a few weeks, making use of an NGS multigene panel."
    explanation: Records the time-to-diagnosis advantage over sequential single-gene sequencing.
differential_diagnoses:
- name: Tyrosinemia type 1
  description: >
    The disorder this one is mistaken for. Both raise succinylacetone; only
    tyrosinemia type 1 causes liver failure, and it requires nitisinone within
    the first month of life. Distinguished by the magnitude of the
    succinylacetone elevation, by coagulation testing at referral, by normal
    urinary maleic acid, and definitively by FAH sequencing.
  disease_term:
    preferred_term: tyrosinemia type I
    term:
      id: MONDO:0010161
      label: tyrosinemia type I
  distinguishing_features:
  - Succinylacetone in the tens of thousands of nmol/L rather than the hundreds
  - Coagulation abnormality at initial evaluation
  - Urinary maleic acid not elevated
  - Biallelic FAH rather than GSTZ1 variants
  evidence:
  - reference: PMID:37545091
    reference_title: "Maleic acid is a biomarker for maleylacetoacetate isomerase deficiency; implications for newborn screening of tyrosinemia type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maleic acid was elevated in uOA of 5/7 false-positive newborns and in the three available samples of confirmed MAAI-D children, but not in TT1 patients."
    explanation: Gives the analyte that separates the two disorders.
- name: Partial fumarylacetoacetate hydrolase deficiency (FAH pseudodeficiency)
  description: >
    The other cause of mild hypersuccinylacetonaemia, and the one that this
    entry's discriminators do not fully separate: compound heterozygotes for the
    prevalent p.Arg341Trp pseudodeficient FAH allele and a severe FAH allele have
    succinylacetone three- to fivefold above normal, normal coagulation, and have
    remained well untreated to 9 and 15 years. Only FAH and GSTZ1 sequencing
    distinguishes them with confidence.
  distinguishing_features:
  - Biallelic FAH variants including the c.1021C>T (p.Arg341Trp) pseudodeficient allele, rather than biallelic GSTZ1 variants
  - Urinary maleic acid predicted normal, though this has not been directly tested in that genotype
  evidence:
  - reference: PMID:29326876
    reference_title: "Mildly elevated succinylacetone and normal liver function in compound heterozygotes with pathogenic and pseudodeficient FAH alleles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All newborns identified with mild hypersuccinylacetonemia in Québec have had genetic deficiencies of tyrosine degradation: either deficiency of the enzyme preceding FAH, maleylacetoacetate isomerase, or partial deficiency of FAH itself."
    explanation: States the two-way differential for mild hypersuccinylacetonaemia.
treatments:
- name: Withholding nitisinone and dietary tyrosine restriction, with structured surveillance
  description: >
    The management decision in this disorder is a decision not to treat. Every
    reported cohort has been managed without nitisinone or protein restriction,
    or has had both withdrawn once GSTZ1 variants were found, with no clinical
    or biochemical deterioration afterwards. What replaces treatment is
    surveillance — regular clinical, biochemical and imaging review — plus advice
    to seek evaluation of liver function and clotting during severe intercurrent
    illness. Note the asymmetry that makes this hard in practice: withholding is
    correct only once tyrosinemia type 1 has been excluded, and until then the
    cost of treating unnecessarily is much lower than the cost of not treating
    tyrosinemia type 1.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: clinical and biochemical surveillance without disease-directed therapy
  evidence:
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest regular clinical, biochemical and imaging surveillance in MAAID."
    explanation: States the surveillance recommendation that stands in place of disease-directed therapy.
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data are in line with previous sparse reports (Table 2), strengthening the observation that subjects with MAAID do not develop symptoms and arguing against the need to start any treatment."
    explanation: The authors' explicit argument against initiating treatment, which is the claim this entry records as management.
- name: Avoidance of dichloroacetate, glutathione-depleting drugs and protein supplements
  description: >
    A mechanism-derived precaution rather than a therapy. Because the
    non-enzymatic rescue consumes glutathione, and because GSTZ1 is itself the
    enzyme that detoxifies dichloroacetate, exposures that either deplete
    glutathione or load the blocked step are predicted to be the circumstances
    under which this disorder could become symptomatic. The advice is standing
    clinical guidance in the human literature but rests on the mouse for its
    mechanism; no human adverse event of this kind has been reported.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of glutathione-depleting and pathway-loading exposures
  target_mechanisms:
  - target: Bypass saturation under substrate overload or glutathione depletion
    treatment_effect: INHIBITS
    description: >
      Removing glutathione-depleting drugs and pathway substrate load keeps the
      non-enzymatic isomerisation from being exhausted.
    evidence:
    - reference: PMID:29641284
      reference_title: "Personalized Dosing of Dichloroacetate Using GSTZ1 Clinical Genotyping Assay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dichloroacetate (DCA) represents the first targeted therapy for pyruvate dehydrogenase complex deficiency; it is metabolized by glutathione transferase zeta1 (GSTZ1)."
      explanation: Establishes in humans that dichloroacetate is cleared by the enzyme this disorder disables, which is the pharmacological rationale for avoiding it in this genotype.
    - reference: PMID:12052898

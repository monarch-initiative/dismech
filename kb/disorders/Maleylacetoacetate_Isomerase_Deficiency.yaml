discussions:
- discussion_id: maai_bypass_saturation_no_human_counterpart
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Gstz1-null mice die of hepatic and renal necrosis on a high-protein diet of
    beans and lentils, yet a homozygous human adult ate an unrestricted diet
    including dairy and meat for 32 years without a single episode of hepatic
    decompensation. Does the murine substrate-overload arm describe a real human
    vulnerability at all, and if so at what exposure?
  rationale: >
    This is not an absence of evidence but a conflict between evidence in a model
    and evidence in humans, which is why it is curated as a model mismatch rather
    than a knowledge gap. The mouse result is robust and internally controlled —
    the injury is prevented by nitisinone, so it is genuinely flux-driven — and
    it is the sole mechanistic basis for the standing advice to avoid protein
    supplements, dichloroacetate and glutathione-depleting drugs. But the murine
    loading protocols are extreme relative to human intake, mouse chow is
    unusually low in phenylalanine and tyrosine so the baseline is not the human
    baseline, and mouse survival on high phenylalanine varied by sex and strain
    by an order of magnitude, which points to modifiers that have no human
    counterpart mapped. The strain effect reaches the baseline as well as the
    challenge: a second, independently derived null on BALB/c has hepatomegaly,
    renomegaly, splenic atrophy and multifocal hepatitis on ordinary chow, where
    the line that is healthy for 22 months has none of it. So the murine arm does
    not speak with one voice about what an unstressed null looks like, and its
    human extrapolation inherits that. Two readings remain open: either humans sit permanently
    below the saturation threshold under any realistic diet, or the threshold
    exists and no ascertained individual has yet crossed it. The nine people with
    clinical follow-up are far too few to distinguish these.
  attaches_to:
  - pathophysiology#Bypass saturation under substrate overload or glutathione depletion
  - pathophysiology#Hepatorenal injury and leucopenia in the saturated state
  proposed_experiments:
  - experiment_id: exp_maai_glutathione_stress_challenge
    name: Prospective biochemical monitoring of confirmed cases through glutathione-depleting exposures
    description: >
      Register-based prospective collection of paired succinylacetone, maleic
      acid, transaminase, creatinine and tubular-function measurements in
      molecularly confirmed individuals before and during naturally occurring
      glutathione-depleting exposures — therapeutic acetaminophen courses,
      febrile intercurrent illness, high-protein dietary periods — rather than
      any deliberate challenge.
    decision_criterion: >
      A reproducible rise in succinylacetone or maleic acid with concurrent
      tubular or hepatic markers during such exposures would establish that the
      murine saturation threshold is reachable in humans and would convert the
      avoidance advice from prediction to evidence. Stable metabolites and normal
      organ markers across the exposure range would argue that human glutathione
      turnover keeps the bypass unsaturated and that the advice is precautionary
      only.
  evidence:
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Humans, at least in developed countries, are unlikely to experience nutritional stress severe enough to be affected by MAAI deficiency if this gene defect exists in the human population."
    explanation: The originating authors' own statement of the translational limit, written before any human case was known.
  - reference: PMID:38535121
    reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The father was without obvious medical complaints at the age of 32 years and adhered to a regular diet including dairy and meat. He had never experienced episodes of liver disease or clinical decompensation despite having experienced several intercurrent infections."
    explanation: The longest human observation refutes a dietary-protein vulnerability at ordinary intakes, which is the specific extrapolation the mouse invites.
- discussion_id: maai_lifelong_succinylacetone_exposure_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Succinylacetone has been characterised as an oncometabolite in
    GSTZ1-deficient hepatocellular carcinoma models. Is decades of mild,
    intermittent succinylacetone exposure in constitutional maleylacetoacetate
    isomerase deficiency genuinely inert, and does the surveillance
    recommendation have any evidential basis?
  rationale: >
    Every human observation to date says the disorder is benign, and every
    observation to date is short. Only four individuals have longitudinal
    follow-up, the longest to 32 years, in a condition whose plausible harm —
    hepatocellular carcinoma — is a late outcome. Meanwhile, somatic
    GSTZ1-1 loss in hepatocellular carcinoma drives NRF2 activation through
    succinylacetone-mediated alkylation of KEAP1 and is described as
    tumour-promoting, and the same review that argues against treating this
    disorder notes that these cancer observations would argue for lowering
    succinylacetone. The two literatures have not been reconciled, and the
    difference between them may simply be somatic loss in a transformed
    hepatocyte versus lifelong constitutional loss with an intact bypass — but
    that is a hypothesis, not a finding. Concretely: the imaging surveillance now
    recommended has no reported yield, and no cohort large or old enough to
    estimate one exists.
  attaches_to:
  - pathophysiology#Escape of succinylacetone and maleic acid into blood and urine
  - treatments#Withholding nitisinone and dietary tyrosine restriction, with structured surveillance
  proposed_experiments:
  - experiment_id: exp_maai_international_registry_longitudinal_outcome
    name: International registry of molecularly confirmed cases with standardised long-term outcome capture
    description: >
      Pooling of confirmed GSTZ1 cases across newborn screening programmes with
      a common minimum dataset — periodic transaminases, alpha-fetoprotein,
      hepatic imaging and time-integrated succinylacetone — carried into adult
      life, since no single centre has enough cases to answer the question.
    decision_criterion: >
      Any excess of hepatic nodules, alpha-fetoprotein elevation or
      hepatocellular carcinoma over an age-matched expectation would justify the
      current surveillance and reopen the case for lowering succinylacetone.
      Event-free ageing across a registry-scale cohort would support
      de-escalating surveillance to reassurance.
  evidence:
  - reference: PMID:31267557
    reference_title: "GSTZ1-1 Deficiency Activates NRF2/IGF1R Axis in HCC via Accumulation of Oncometabolite Succinylacetone."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, GSTZ1-1 deficiency led to succinylacetone accumulation, alkylation modification of KEAP1, and NRF2 activation, thus promoting IGF1R transcription by recruiting SP1 to its promoter."
    explanation: Gives the mechanistic reason succinylacetone cannot simply be assumed inert, and is the basis for the gap.
  - reference: PMID:38535121
    reference_title: "New Cases of Maleylacetoacetate Isomerase Deficiency with Detection by Newborn Screening and Natural History over 32 Years: Experience from a German Newborn Screening Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While this suggests a benign clinical course of MAAI deficiency without specific treatment, the long-term consequences of human MAAI deficiency are currently unknown"
    explanation: States the gap directly in the human literature.
- discussion_id: maai_unconfirmed_fatal_case
  kind: CONTROVERSY
  status: OPEN
  prompt: >
    A historical patient attributed to maleylacetoacetate isomerase deficiency
    died of hepatic and renal failure but was never molecularly confirmed. Should
    that case be counted when describing the phenotypic spectrum, or excluded as
    a probable misdiagnosis?
  rationale: >
    It matters because it is the only human report inconsistent with a benign
    course, and because the reasoning is circular in both directions. Excluding
    it on the grounds that confirmed cases are benign assumes the conclusion;
    including it risks importing a case that, on today's differential, could
    equally have been tyrosinemia type 1 or partial fumarylacetoacetate hydrolase
    deficiency — both of which were unavailable as diagnoses at the time and both
    of which produce the same succinylacetone elevation. This entry describes the
    disorder from molecularly confirmed cases only and records the unconfirmed
    case here rather than in the burden assessment, but that is a curation choice
    with consequences: it is what licenses the LOW burden level, and a single
    confirmed severe case would overturn it.
  attaches_to:
  - clinical_burden#
  evidence:
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While Berger et al. described one patient showing fatal hepatic and renal failure, for whom molecular confirmation was not available"
    explanation: Records the single discordant report and its lack of molecular confirmation.
notes: >
  Curated as IEMbase WP-002 row 1.4.06.01 (GSTZ1-related maleylacetoacetate
  isomerase deficiency). With this entry the distal tyrosine catabolic pathway
  is curated at every enzymatic step in dismech: TAT (Tyrosinemia_Type_II), HPD
  (Tyrosinemia_Type_III), HGD (Alkaptonuria), GSTZ1 (here) and FAH
  (Tyrosinemia_Type_I). The series is worth reading as a series, because
  severity does not track position in the pathway — it tracks the chemistry of
  what accumulates behind each block, and this step is the one where a
  non-enzymatic reaction removes most of what would otherwise accumulate.

  Hawkinsinuria (MONDO:0007700), the other HPD-allelic entity, is not curated
  here and is not a member of this disorder's differential; the differential in
  practice is a three-way one among tyrosinemia type 1, partial FAH deficiency
  and this disorder, all of which raise succinylacetone.

  The entry deliberately does not populate a neurological, hepatic or renal
  phenotype. Those appear in the mouse under substrate overload and are the
  subject of a HUMAN_MODEL_MISMATCH discussion, but asserting them as human
  phenotypes on murine evidence is exactly the error the evidence_source
  discipline exists to prevent.
experimental_models: []
animal_models:
- name: Gstz1/Maai-null mouse
  species: Mouse
  genotype: Targeted deletion of Maai (Gstz1), homozygous
  background: 129SvJ and C57BL/6
  publication: PMID:12052898
  genes:
  - preferred_term: GSTZ1
    term:
      id: hgnc:4643
      label: GSTZ1
  description: >
    The defining model of this disorder, and the one that supplied its mechanism
    before any human case was known. Homozygotes are enzymatically and
    immunologically null for maleylacetoacetate isomerase, are born at Mendelian
    ratios, and remain healthy for at least 22 months on standard chow with
    normal weight, fertility and histology and no tumours — while excreting
    fumarylacetoacetate and succinylacetone in urine. That combination is the
    human phenotype in miniature and is what makes the model unusually
    informative here. Under phenylalanine, tyrosine or homogentisic acid loading,
    a high-protein bean-and-lentil diet, or pharmacological glutathione
    depletion, the same animals develop hepatic necrosis and steatosis, renal
    epithelial vacuolisation, apoptosis and necrosis, and die; nitisinone
    prevents it.
  evidence:
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we describe the phenotype of mice with a targeted deletion of the MAAI (GSTZ1) gene."
    explanation: Establishes that the model carries a targeted lesion in the orthologous gene, which is what licenses treating it as informative for this disorder.
  modeled_mechanisms:
  - target: Maleylacetoacetate isomerase deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      A germline null for the orthologous gene, with complete loss of enzyme
      protein and activity in liver and kidney.
    limitations: >-
      The lesion is a targeted whole-gene deletion, whereas the reported human
      genotypes are missense and splicing alleles with residual activity, so the
      model represents the severe end of the human allelic spectrum rather than
      its centre.
    readouts:
    - name: Hepatic maleylacetoacetate isomerase activity
      target: Maleylacetoacetate isomerase deficiency
      description: >-
        Enzyme assay of liver extracts from homozygous mutants, used both to
        confirm the null and to test for a redundant isomerase.
      direction: ABOLISHED
      interpretation: >-
        Complete loss of activity with no alternative activity detectable in the
        extract is what forces the chemical rather than enzymatic reading of the
        bypass.
      evidence:
      - reference: PMID:12052898
        reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "MAAI enzyme activity was also completely obliterated, indicating that liver cell extracts did not contain an alternate enzyme capable of metabolizing MAA to FAA in the in vitro assay."
        explanation: Reports the enzyme measurement and its negative control for a redundant enzyme.
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This test showed a complete absence of MAAI (Fig.2C), consistent with deletion of the majority of the gene."
      explanation: Confirms loss of the protein itself, establishing the model as a null for this node.
  - target: Escape of succinylacetone and maleic acid into blood and urine
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Mutants excrete both fumarylacetoacetate and succinylacetone in urine while
      remaining well, reproducing the central paradox of the human disorder — an
      abnormal metabolite profile without disease.
    limitations: >-
      Urinary maleic acid, which is the discriminating human analyte, was not
      measured in this study, so the model covers only the succinylacetone half
      of the node. Metabolite detection was qualitative by GC-MS and the
      concentrations are not comparable with the human nmol/L ranges on which the
      clinical distinction from tyrosinemia type 1 rests.
    readouts:
    - name: Urinary fumarylacetoacetate and succinylacetone
      target: Escape of succinylacetone and maleic acid into blood and urine
      description: >-
        GC-MS analysis of urine from homozygous mutants and wild-type controls.
      direction: INCREASED
      interpretation: >-
        Appearance of metabolites absent from control urine, in an animal with no
        clinical or histological abnormality, is the model's counterpart of mild
        hypersuccinylacetonaemia.
      evidence:
      - reference: PMID:12052898
        reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "GC-MS analysis of the urine from mutant mice showed the presence of both FAA and SA (Fig.3), compounds which are not present in normal controls."
        explanation: Reports the urinary measurement against controls.
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MAAI-deficient mice accumulated FAA and succinylacetone in urine but appeared otherwise healthy."
      explanation: Pairs the metabolite finding with the absence of disease, which is the claim this node makes.
  - target: Glutathione-dependent non-enzymatic isomerisation to fumarylacetoacetate
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Liver extract from mutant mice, which contains no isomerase, was the assay
      system in which the glutathione-dependent reaction was titrated, and
      glutathione-depleting agents were used in vivo to remove it.
    limitations: >-
      The in vitro titration used murine liver extract and non-physiological
      glutathione-depleting agents (diethylmaleate, phorone); human hepatic
      glutathione concentrations and turnover were not measured, so the margin by
      which the human bypass operates above its 1 mM floor is unknown. This link
      is a molecular-scale measurement cited for a molecular-scale node, so it
      carries no scale extrapolation, but it does carry a species one.
    readouts:
    - name: In vitro conversion of maleylacetoacetate to fumarylacetoacetate versus glutathione concentration
      target: Glutathione-dependent non-enzymatic isomerisation to fumarylacetoacetate
      description: >-
        Titration of the non-enzymatic isomerisation rate against glutathione
        concentration in isomerase-free mutant liver extract, with dithiothreitol
        as a chemical comparator.
      direction: INCREASED
      interpretation: >-
        A reaction rate that rises with glutathione and is undetectable below
        1 mM defines the bypass as a saturable chemical reaction rather than a
        constitutive rescue.
      evidence:
      - reference: PMID:12052898
        reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "GSH concentrations lower than 1 mM did not result in the chemical isomerization of MAA to FAA. However, higher concentrations of GSH increased the speed of the reaction until a maximal effect was achieved with 10 mM GSH."
        explanation: Reports the concentration-response measurement that defines the bypass.
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We were able to demonstrate the enzyme-independent bypass of MAAI activity by increasing the GSH concentration in the in vitro reaction using protein extract from MAAI mutant mouse liver"
      explanation: Establishes that this model is the system in which the bypass was demonstrated.
  - target: Bypass saturation under substrate overload or glutathione depletion
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Homogentisic acid, phenylalanine or tyrosine loading, a high-protein
      bean-and-lentil diet, and glutathione depletion by diethylmaleate or
      phorone are the interventions that drive the animal into the saturated
      state; nitisinone rescues it, confirming the injury is flux-dependent.
    limitations: >-
      Fidelity is recorded LOW because the node it perturbs has no observed human
      counterpart: the loading protocols are far outside human dietary exposure,
      laboratory chow is unusually low in aromatic amino acids so the murine
      baseline is not the human one, and survival on high phenylalanine varied
      several-fold with sex and strain, implying modifiers that are unmapped in
      humans. The model establishes that the bypass is saturable in mice; it does
      not establish the human threshold, or that one is reachable.
    readouts:
    - name: Survival and hepatic and renal injury under phenylalanine loading
      target: Bypass saturation under substrate overload or glutathione depletion
      description: >-
        Survival, transaminases, creatinine and histopathology in mutants versus
        controls on phenylalanine-supplemented food or drinking water, with
        nitisinone as the rescue arm.
      direction: DECREASED
      interpretation: >-
        Dose-dependent lethality abolished by blocking the pathway upstream shows
        the injury is caused by flux into the blocked step rather than by the
        genotype itself.
      evidence:
      - reference: PMID:12052898
        reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "With the Phe diet, blood amino acid analysis showed no differences between wild-type and mutant mice, but liver function tests indicated hepatocellular damage (elevated transaminases) and renal injury (increased creatinine)"
        explanation: Reports the hepatic and renal injury measurements under phenylalanine loading, with amino acid levels unchanged.
      - reference: PMID:12052898
        reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "to the drinking water prevented this phenotype, demonstrating the relation of this phenotype and overloading of phenylalanine catabolic pathway."
        explanation: >-
          Records the nitisinone rescue arm: the quoted clause completes the sentence
          "Addition of NTBC ... to the drinking water prevented this phenotype", so what
          it establishes is that the injury depends on flux into the blocked step rather
          than on the genotype alone. The quote begins after the drug's chemical-name
          gloss, which is bracketed in the source and so cannot be carried verbatim.
    - name: Circulating white blood cell count under high dietary phenylalanine
      target: Bypass saturation under substrate overload or glutathione depletion
      description: >-
        Total white cell counts in Gstz1-null mice on high dietary phenylalanine,
        with splenocyte cytotoxicity assays of mutant serum as the mechanistic
        follow-up.
      direction: DECREASED
      interpretation: >-
        A 60 percent white cell loss within six days, reproduced by direct
        incubation of normal splenocytes with maleylacetone, identifies a
        circulating intermediate rather than phenylalanine as the toxic species.
      evidence:
      - reference: PMID:19426674
        reference_title: "Phenylalanine-induced leucopenia in genetic and dichloroacetic acid generated deficiency of glutathione transferase Zeta."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The loss was significant (P<0.05) after 2 days and total WBCs were reduced by 60% after 6 days."
        explanation: Reports the haematological measurement and its magnitude.
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To simulate nutritional conditions experienced by mice in the wild, experimental animals were fed a diet consisting of beans and lentils, which are high in protein. Under these conditions, MAAI mutant mice also developed renal and hepatic injury and had reduced survival"
      explanation: Establishes that the saturated state is reachable by dietary protein alone in this model, which is what makes the link worth curating despite its low translational fidelity.
- name: Maai/Fah double-mutant mouse
  species: Mouse
  genotype: Maai (Gstz1) and Fah double homozygous null
  publication: PMID:12052898
  genes:
  - preferred_term: GSTZ1
    term:
      id: hgnc:4643
      label: GSTZ1
  description: >
    A genetic test of the bypass rather than a model of the disease. If
    maleylacetoacetate could not reach fumarylacetoacetate without the enzyme,
    removing fumarylacetoacetate hydrolase as well should have been harmless or
    protective; instead the double mutants died within about a week of nitisinone
    withdrawal, with severe liver and kidney injury and a marked creatinine rise
    and acute renal necrosis not seen in Fah-null animals. That is the strongest
    in vivo evidence that the non-enzymatic bypass operates, and it simultaneously
    shows that maleylacetoacetate deficiency generates a toxic species distinct
    from the fumarylacetoacetate of tyrosinemia type 1.
  evidence:
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice doubly mutant for MAAI and fumarylacetoacetate hydrolase (FAH) died rapidly on a normal diet, indicating that MAA could be isomerized to FAA in the absence of MAAI."
    explanation: States the genotype and the inference it licenses about the bypass.
  modeled_mechanisms:
  - target: Glutathione-dependent non-enzymatic isomerisation to fumarylacetoacetate
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Removing the downstream hydrolase converts the products of the bypass into
      a lethal readout, so the double mutant reports on whether the bypass is
      carrying flux.
    limitations: >-
      The genotype has no human counterpart — no person carries biallelic null
      alleles at both loci — so this model speaks only to the existence of the
      bypass and not to any human phenotype. Its severe renal necrosis is
      evidence about maleylacetoacetate toxicity in a doubly blocked pathway, and
      must not be read as a prediction for constitutional GSTZ1 deficiency, where
      the hydrolase is intact.
    readouts:
    - name: Plasma creatinine and renal histology in double mutants
      target: Glutathione-dependent non-enzymatic isomerisation to fumarylacetoacetate
      description: >-
        Blood chemistry and kidney histopathology in Maai/Fah double mutants
        compared with Fah single mutants after nitisinone withdrawal.
      direction: INCREASED
      interpretation: >-
        Renal injury exceeding that of Fah-null animals shows the double mutant
        accumulates something the single mutant does not, which is the signature
        of maleylacetoacetate rather than fumarylacetoacetate.
      evidence:
      - reference: PMID:12052898
        reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The marked elevation of plasma creatinine indicated severe renal glomerular dysfunction, a phenotype not seen in FAH-deficient animals."
        explanation: Reports the measurement distinguishing the double mutant from the single mutant.
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "First, there is a bypass for MAAI activity in hepatocytes and renal tubular cells."
      explanation: The authors' conclusion from this genotype, which is the claim the link records.
- name: Gstz1-null BALB/c mouse
  species: Mouse
  genotype: Gstz1 homozygous null on a BALB/c background
  publication: PMID:15277241
  genes:
  - preferred_term: GSTZ1
    term:
      id: hgnc:4643
      label: GSTZ1
  description: >
    An independently derived germline Gstz1 deletion, on a different genetic
    background from the model above, and the reason the "unstressed null mouse is
    well" reading cannot be taken as general. On standard chow these animals have
    enlarged liver and kidneys, splenic atrophy, multifocal hepatitis and renal
    ultrastructural change, with constitutive induction of alpha, mu and pi class
    glutathione transferases and NQO1 — an antioxidant response consistent with
    chronic accumulation of a toxic metabolite rather than with a silent block.
    Phenylalanine loading then reproduces the same lethality, hepatic necrosis,
    steatosis, splenic atrophy and leucopenia seen in the other line, with animals
    under 28 days old dying. The strain discrepancy at baseline is itself the
    finding: whether the bypass suffices appears to be modifier-dependent in mice,
    which is one reason the murine arm is not read as a prediction for humans.

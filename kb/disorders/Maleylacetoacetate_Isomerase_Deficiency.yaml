- name: Genetic counselling and cascade testing
  description: >
    Confirming the recessive genotype allows correct counselling and identifies
    homozygous relatives who would otherwise never be found — in the German
    family, cascade testing identified a 32-year-old homozygous father whose
    screening succinylacetone was within the reference range. Because the finding
    carries no treatment implication, the counselling content is largely
    reassurance plus the avoidance advice above.
  therapeutic_modality: OTHER
  treatment_term:

review_notes: >
  Curated from eleven cached PubMed references anchored to MONDO:0060527 and GSTZ1
  (hgnc:4643). Identity was confirmed before curation: MONDO:0060527
  cross-references OMIM:617596, MEDGEN:713903 and UMLS:C1291607, matching IEMbase
  WP-002 row 1.4.06.01 (GSTZ1, OMIM 617596) exactly. No named-entity confusion
  against the other tyrosine-pathway entities, all of which are separate MONDO
  terms on separate genes. Every evidence snippet is an exact substring of the
  cached record for its PMID.

  The graph is deliberately shaped around a negative claim. The disorder's
  mechanistic interest is that a block immediately upstream of the tyrosinemia
  type 1 lesion is not disease, so the central node is the glutathione-dependent
  non-enzymatic bypass, and the injury nodes downstream of bypass saturation are
  fenced into a separate EMERGING hypothesis group carrying only model-organism
  and in vitro evidence. No human phenotype is attached below that fence. The
  metabolite-swap account of why the two disorders differ (high maleylacetoacetate
  with low fumarylacetoacetate here, the reverse in tyrosinemia type 1) is curated
  with an INDIRECT evidence item quoting the source's own statement that these
  intermediates have never been measured in human tyrosinemic liver, because it is
  a pathway-position inference rather than a measurement.

  Three animal models are curated as separate entries because they answer
  different questions. Two come from the same 2002 study: the Gstz1-null mouse, a
  high-fidelity model of the enzyme block and of the metabolite-abnormality-without-disease
  phenotype, and the Maai/Fah double mutant, which is not a model of this disease
  at all but the genetic experiment that demonstrated the bypass — recorded as
  PERTURBS at MODERATE fidelity with an explicit limitation that its severe renal
  phenotype must not be read as a prediction for constitutional GSTZ1 deficiency.
  The third is the independently derived BALB/c null (PMID:15277241), added
  because it contradicts the first at baseline: it has organ pathology on ordinary
  chow where the other is healthy for 22 months. It is linked at LOW fidelity with
  a POPULATION_MISMATCH divergence, and its value here is that it stops the murine
  arm being read as one consistent prediction about unstressed nulls. No non-animal
  experimental model, computational model, or dataset with an evidence-supported
  mechanism link was identified, so those sections are empty rather than
  speculatively populated.

  Two treatments carry no ontology binding. NCIT roots TreatmentTerm at
  NCIT:C25218 (Clinical Intervention or Procedure), and neither structured
  non-treatment surveillance nor exposure avoidance has a term below that root
  that is not a distortion — the same conclusion reached for surveillance in
  Congenital_Laryngomalacia and ReNU_Syndrome, where NCIT:C15719 and NCIT:C15722
  were both rejected. Free-text preferred_term is used instead, per the ontology
  term contract's preference for no term over a bad one.

  Phenotype frequencies are omitted throughout: with fewer than twenty reported
  individuals and nine with clinical follow-up, no denominator is defensible.

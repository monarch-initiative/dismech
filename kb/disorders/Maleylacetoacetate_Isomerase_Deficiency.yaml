      snippet: "However, SA levels appear to be lower and/or discontinuously elevated in MAAID as compared to HT-1"
      explanation: Describes the magnitude and intermittency of the circulating marker.
  - target: Elevated urinary succinylacetone
    description: >
      Urinary succinylacetone may be only at trace levels, below the laboratory
      abnormal cut-off yet above what healthy urine contains.
    causal_link_type: DIRECT

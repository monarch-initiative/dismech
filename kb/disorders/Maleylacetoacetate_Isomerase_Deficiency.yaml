  evidence:
  - reference: PMID:41009955
    reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the tyrosine degradation pathway, the enzyme catalyzes the isomerization of maleylacetoacetate (MAA) to fumarylacetoacetate (FAA), a step immediately upstream of fumarylacetoacetate hydrolase."
    explanation: Defines the reaction blocked by the lesion and fixes its position relative to the tyrosinemia type 1 step.
  - reference: PMID:27876694
    reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Bacterial expression of p.Ala150Val and p.Val99Met revealed low MAAI activity."
    explanation: Functional expression of patient alleles establishes reduced enzyme activity as the molecular consequence.
  downstream:
  - target: Maleylacetoacetate accumulation behind the block
    description: >
      Loss of the isomerase leaves its substrate unconsumed at the blocked step.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41009955
      reference_title: "Variants in GSTZ1 Gene Underlying Maleylacetoacetate Isomerase Deficiency: Characterization of Two New Individuals and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Deficiency of this enzyme leads to the accumulation of upstream intermediates, including succinylacetone, a toxic metabolite traditionally regarded as pathognomonic for tyrosinemia type I."
      explanation: States that the enzyme block causes accumulation of the intermediates proximal to it.
- name: Maleylacetoacetate accumulation behind the block
  biological_scale: MOLECULAR
  description: >
    Maleylacetoacetate builds up in hepatocytes and renal tubular cells. This is
    the node where the disorder diverges from tyrosinemia type 1: at a matched
    plasma succinylacetone concentration, the predicted intracellular profile
    here is high maleylacetoacetate with low fumarylacetoacetate, whereas
    fumarylacetoacetate hydrolase deficiency predicts the reverse. Since
    fumarylacetoacetate is the strongly electrophilic species held responsible
    for hepatocyte and tubular injury in tyrosinemia type 1, the swap of which
    intermediate accumulates is the leading account of why the two disorders
    share a marker but not a phenotype. Note this is an inference from pathway
    position, not a measurement: neither intermediate is stable enough to have
    been quantified in human tyrosinemic liver.
  chemical_entities:
  - preferred_term: 4-maleylacetoacetate
    term:
      id: CHEBI:17105
      label: 4-maleylacetoacetate
    modifier: INCREASED
  - preferred_term: 4-fumarylacetoacetate
    term:
      id: CHEBI:18034
      label: 4-fumarylacetoacetate(2-)
    modifier: DECREASED
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:29326876
    reference_title: "Mildly elevated succinylacetone and normal liver function in compound heterozygotes with pathogenic and pseudodeficient FAH alleles."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "At a similar level of plasma SA, MAAI deficiency is predicted to cause higher MAA in liver than FAH deficiency, but low levels of FAA."
    explanation: States the predicted intracellular metabolite swap that distinguishes this node from the tyrosinemia type 1 counterpart.
  - reference: PMID:29326876
    reference_title: "Mildly elevated succinylacetone and normal liver function in compound heterozygotes with pathogenic and pseudodeficient FAH alleles."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first three are reactive and labile, and have not been accurately measured in tyrosinemic liver. The relative toxicities of FAA and MAA are not known"
    explanation: States that the intracellular intermediates have never been measured and their relative toxicities are unknown, which is why the metabolite-swap account is curated as an inference rather than a direct toxicity claim.
  downstream:
  - target: Glutathione-dependent non-enzymatic isomerisation to fumarylacetoacetate
    description: >
      Accumulating maleylacetoacetate is bound by glutathione and slowly
      isomerised without the enzyme, so most of the flux still reaches
      fumarylacetoacetate.
    causal_link_type: DIRECT
    hypothesis_groups:
    - gsh_bypass_sufficiency
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A glutathione-mediated isomerization of MAA to FAA independent of MAAI enzyme was demonstrated in vitro."
      explanation: Direct in vitro demonstration that the substrate is isomerised without the enzyme.
  - target: Escape of succinylacetone and maleic acid into blood and urine
    description: >
      A minority fraction of maleylacetoacetate leaves the cell and is converted
      to the excreted metabolites that make the disorder detectable.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MAAI-deficient mice accumulated FAA and succinylacetone in urine but appeared otherwise healthy."
      explanation: Shows the escaping fraction appearing in urine while the animal remains well.
- name: Glutathione-dependent non-enzymatic isomerisation to fumarylacetoacetate
  role: modifier
  biological_scale: MOLECULAR
  description: >
    Glutathione binds maleylacetoacetate spontaneously, and the bound adduct can
    rearrange to fumarylacetoacetate with no enzyme present. The reaction is slow
    and needs high glutathione — it is undetectable below 1 mM in vitro and
    approaches its maximum near 5 to 10 mM, against a measured hepatic
    glutathione concentration of 3 to 7 mM in both wild-type and mutant mice.
    This node, not any residual enzyme activity, is why the disorder is mild:
    mutant liver extracts contain no alternative isomerase, so the rescue is
    chemical rather than enzymatic. The strongest in vivo argument is the
    Maai/Fah double mutant, which dies of a fumarylacetoacetate-driven phenotype
    that could not exist unless maleylacetoacetate still reached
    fumarylacetoacetate without the enzyme.
  chemical_entities:
  - preferred_term: glutathione
    term:
      id: CHEBI:16856
      label: glutathione
  - preferred_term: 4-fumarylacetoacetate
    term:
      id: CHEBI:18034
      label: 4-fumarylacetoacetate(2-)
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MAAI enzyme activity was also completely obliterated, indicating that liver cell extracts did not contain an alternate enzyme capable of metabolizing MAA to FAA in the in vitro assay."
    explanation: Excludes a redundant enzyme, which is what forces the chemical rather than enzymatic interpretation of the bypass.
  - reference: PMID:12052898
    reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice doubly mutant for MAAI and fumarylacetoacetate hydrolase (FAH) died rapidly on a normal diet, indicating that MAA could be isomerized to FAA in the absence of MAAI."
    explanation: In vivo genetic evidence that flux still reaches fumarylacetoacetate without the enzyme.
  downstream:
  - target: Bypass saturation under substrate overload or glutathione depletion
    description: >
      Because the reaction is slow and glutathione-dependent, raising
      maleylacetoacetate production or consuming glutathione exhausts it.
    causal_link_type: DIRECT
    hypothesis_groups:
    - bypass_saturation_toxicity
    evidence:
    - reference: PMID:12052898
      reference_title: "Maleylacetoacetate isomerase (MAAI/GSTZ)-deficient mice reveal a glutathione-dependent nonenzymatic bypass in tyrosine catabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our data showed clearly that hepatic GSH levels are essential for the MAAI bypass reaction."
      explanation: Establishes glutathione dependence as the saturable term.
- name: Escape of succinylacetone and maleic acid into blood and urine
  biological_scale: ORGANISM
  description: >
    The fraction of maleylacetoacetate that neither the enzyme nor the bypass
    handles leaves the cell and is reduced and decarboxylated to succinylacetone,
    while maleic acid appears in urine. Both are excreted markers rather than
    established effectors of injury in this disorder. The quantitative point
    carries the diagnosis: circulating succinylacetone here is roughly one to two
    orders of magnitude below untreated tyrosinemia type 1, and is often
    intermittent, dropping into the reference range on repeat sampling.
  chemical_entities:
  - preferred_term: succinylacetone
    term:
      id: CHEBI:87897
      label: 4,6-dioxoheptanoic acid
    modifier: INCREASED
  - preferred_term: maleic acid
    term:
      id: CHEBI:18300
      label: maleic acid
    modifier: INCREASED
  evidence:
  - reference: PMID:27876694
    reference_title: "Hypersuccinylacetonaemia and normal liver function in maleylacetoacetate isomerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

treatments:
- name: Mechanical Callus Debridement and Friction Reduction
  description: >-
    The mainstay of care: paring, filing, grinding or clipping the plantar
    callus, together with lifestyle measures that reduce friction and trauma
    (comfortable footwear and orthotics, wicking socks and ventilated footwear,
    limiting standing and walking, maintaining ideal body weight, walking aids
    when needed). Benefit is variable and over-trimming can paradoxically
    worsen plantar pain, so paring frequency is set by patient preference.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Focal Palmoplantar Keratoderma
    treatment_effect: INHIBITS
    description: >-
      Physical removal of hyperkeratotic material and reduction of the
      mechanical stimulus that drives it.
    evidence:
    - reference: PMID:20301457
      reference_title: "Pachyonychia Congenita."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Foot care includes paring down of hyperkeratotic areas and topical therapies for hyperkeratosis (emollients and lotions containing keratolyics)."
      explanation: GeneReviews specifies debridement of the hyperkeratosis.
  evidence:
  - reference: PMID:20301457
    reference_title: "Pachyonychia Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pain from the palmoplantar keratoderma may be reduced somewhat by limiting friction and trauma to the feet by minimizing walking or standing, reducing hydration of the stratum corneum by using wicking socks and ventilated footwear, selecting comfortable shoes, and maintaining ideal body weight."
    explanation: >-
      GeneReviews describes the friction- and trauma-reduction strategy and is
      explicit that the benefit is only partial.
  - reference: PMID:37766547
    reference_title: "Pachyonychia Congenita: Clinical Features and Future Treatments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure or specific treatment for PC at present. Current treatments are limited to conservative measures to reduce plantar friction and trauma, mechanical debridement, topical treatments, and treatments for associated features or complications, most commonly infection."
    explanation: >-
      Establishes that conservative and mechanical measures remain the standard
      of care, and that no disease-specific therapy is approved.
- name: Topical Keratolytics and Emollients
  description: >-
    Emollients with keratolytic agents (urea 40%, salicylic acid 10-20%, lactic
    acid) applied to the callus to soften and thin hyperkeratotic skin.
    Symptomatic only, with variable benefit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: urea
      term:
        id: CHEBI:16199
        label: urea
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Focal Palmoplantar Keratoderma
    treatment_effect: INHIBITS
    description: Keratolysis of the accumulated stratum corneum.
  evidence:
  - reference: PMID:20301457
    reference_title: "Pachyonychia Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Foot care includes paring down of hyperkeratotic areas and topical therapies for hyperkeratosis (emollients and lotions containing keratolyics)."
    explanation: >-
      GeneReviews recommends keratolytic-containing topical therapy as part of
      routine foot care.
- name: Systemic Retinoids
  description: >-
    Oral retinoids (acitretin, isotretinoin) thin the hyperkeratosis but
    frequently increase blistering and plantar pain, leading many patients to
    discontinue. Acitretin is highly teratogenic with a three-year washout, so
    it is often inappropriate for women of childbearing potential. Benefit is
    limited to a small subgroup.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

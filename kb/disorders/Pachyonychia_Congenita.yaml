experimental_models:
- name: Dominant-negative K6a cell culture model
  description: >-
    Cultured cells co-expressing wild-type and mutant (N171K) K6a, used to
    reproduce the dominant-negative filament defect in vitro and to test
    allele-selective siRNA. Simultaneous expression of both alleles yields
    defective filament formation; mutant-specific siRNA restores normal
    filaments.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:17914454
  modeled_mechanisms:
  - target: Keratin Intermediate Filament Network Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the defining molecular lesion — mutant-allele-dependent failure
      of keratin filament assembly — and shows it is reversible by removing the
      mutant transcript.
    limitations: >-
      A transfected, over-expression cell system rather than differentiated
      volar epidermis; it captures filament assembly but not the tissue-level
      hyperproliferation, differentiation and pain phenotypes.
    evidence:
    - reference: PMID:17914454
      reference_title: "Single-nucleotide-specific siRNA targeting in a dominant-negative skin model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "To test whether lead siRNAs could discriminate mutant mRNA in the presence of both wild-type and mutant forms, a dominant-negative PC cell culture model was developed."
      explanation: >-
        Describes the construction of the model and its purpose, supporting its
        use as an informative system for this mechanism node.
  evidence:
  - reference: PMID:17145926
    reference_title: "SiRNA-mediated selective inhibition of mutant keratin mRNAs responsible for the skin disorder pachyonychia congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Similar constructs containing a single nucleotide change (N171K) or a three-nucleotide deletion (N171del) showed keratin aggregate formation."
    explanation: >-
      The companion transfection study establishing the aggregate readout used
      in this model class.
- name: Organotypic PC epidermal equivalent
  description: >-
    An organotypic (raft) epidermal model built from PC keratinocytes, used to
    assay keratinocyte uptake of chemically modified self-delivery siRNA and
    allele-selective knockdown of mutant K6a mRNA. Developed specifically
    because intradermal needle delivery to PC plantar lesions is too painful to
    be viable.
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:21248764
  modeled_mechanisms:
  - target: Keratin Intermediate Filament Network Disruption
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Used to perturb the mutant keratin transcript pool with self-delivery
      siRNA and measure allele-selective knockdown in a stratified epidermal
      context.
    limitations: >-
      An in vitro epidermal equivalent lacking innervation, mechanical loading
      and immune components, so it cannot report the pain or callus phenotypes
      that dominate the human disease.
    evidence:
    - reference: PMID:21248764
      reference_title: "Use of self-delivery siRNAs to inhibit gene expression in an organotypic pachyonychia congenita model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "treatment of PC epidermal equivalents with self-delivery \"TD101\" siRNA resulted in marked reduction of mutant keratin 6a mRNA with little or no effect on wild-type expression."
      explanation: >-
        Demonstrates allele-selective knockdown in the organotypic model,
        grounding its link to the filament-disruption node.
  evidence:
  - reference: PMID:21191405
    reference_title: "Development of quantitative molecular clinical end points for siRNA clinical trials."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrate that repeated siRNA treatment results in sustained inhibition of mutant K6a mRNA in patient-derived keratinocyte cultures"
    explanation: >-
      Companion work establishing quantitative molecular endpoints for this
      model system and for trials using it.
animal_models:
- name: Krt16-null mouse
  species: Mouse
  genotype: Krt16-/- (null)
  background: C57BL/6; also transferred to FVB/N
  genes:
  - preferred_term: KRT16
    term:
      id: hgnc:6423
      label: KRT16
  publication: PMID:22336941
  description: >-
    The principal animal model of PC-associated palmoplantar keratoderma. Mice
    null for Krt16 spontaneously develop oral lesions and PPK-like
    hyperkeratotic calluses on fore and hind paws that impair walking, and
    reproduce the sequence of pre-lesional differentiation failure, oxidative
    stress with hypoactive Keap1-Nrf2 signalling, and lesional loss of epidermal
    homeostasis.
  modeled_mechanisms:
  - target: Loss of Keratinocyte Mechanical Resilience
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of the K16 filament subunit produces weight-bearing-site callus and
      compromised ambulation, mirroring the human lesion distribution.
    limitations: >-
      The mouse phenotype arises from complete loss of function inherited
      recessively, whereas human PC is a dominant-negative disease in
      heterozygotes — so the model tests the consequence of losing functional
      K16 filaments, not the consequence of a poisoned filament network.
    evidence:
    - reference: PMID:22336941
      reference_title: "Keratin 16-null mice develop palmoplantar keratoderma, a hallmark feature of pachyonychia congenita and related disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the inactivation of Krt16 in mice consistently causes oral lesions as well as PPK-like hyperkeratotic calluses on Krt16(-/-) front and hind paws, which severely compromise the animals' ability to walk"
      explanation: >-
        Establishes the model's core palmoplantar phenotype and functional
        consequence.
  - target: Defective Terminal Differentiation of Volar Keratinocytes
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Pre-lesional loss of Krt9 and pleiotropic terminal differentiation defects
      in footpad keratinocytes, mirrored in published human PC PPK expression
      data.
    limitations: >-
      Demonstrated in the null background; whether human dominant-negative
      alleles produce the same magnitude of KRT9 loss is not established.
    evidence:
    - reference: PMID:31220272
      reference_title: "Altered keratinocyte differentiation is an early driver of keratin mutation-based palmoplantar keratoderma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings highlight a role for defective terminal differentiation and loss of Krt9/K9 expression as additional drivers of PC-associated PPK and highlight restoration of KRT9 expression as a worthy target for therapy."
      explanation: >-
        States the model's central differentiation finding and its proposed
        translational read.
  - target: Oxidative Stress and Hypoactive Keap1-NRF2 Signalling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Oxidative stress and failure of NRF2-dependent glutathione synthesis
      precede lesion onset; Nrf2 ablation accelerates and topical NRF2
      activation prevents the keratoderma, and hypophosphorylated NRF2 is
      confirmed in human PC lesional skin.
    limitations: >-
      The preventive effect of sulforaphane is shown in mice only; it has not
      been shown to prevent or reverse keratoderma in people with PC.
    evidence:
    - reference: PMID:27183391
      reference_title: "Oxidative stress and dysfunctional NRF2 underlie pachyonychia congenita phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Topical application of the NRF2 activator sulforaphane to the footpad of Krt16-/- mice prevented the development of PPK and normalized redox balance via regeneration of GSH from existing cellular pools."
      explanation: >-
        Demonstrates causal, rescuable involvement of the NRF2 node in the model.
  evidence:
  - reference: PMID:31021398
    reference_title: "Pathophysiology of pachyonychia congenita-associated palmoplantar keratoderma: new insights into skin epithelial homeostasis and avenues for treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We reviewed the relevant literature with a particular focus on the Krt16 null mouse, which spontaneously develops footpad lesions that mimic several aspects of PC-associated PPK."
    explanation: >-
      Establishes the Krt16-null mouse as the reference model for PC-associated
      keratoderma, while wording the claim as mimicking several aspects only.
discussions:
- discussion_id: pc_pain_not_proportional_to_keratoderma
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines plantar pain severity in pachyonychia congenita, given that
    it is not proportional to the extent of hyperkeratosis?
  attaches_to:
  - pathophysiology#Plantar Nociceptive and Neuropathic Pain
  rationale: >-
    Plantar pain is the dominant disability in PC and dictates treatment goals,
    yet its severity tracks poorly with callus extent. Candidate contributors
    include subepidermal blistering beneath the callus, nociceptive input from
    tissue damage, neuropathic change in cutaneous sensory afferents,
    neurovascular structures within the callus, and TRPV3/EGFR-driven
    sensitisation. Quantitative sensory testing supports a neuropathic
    component but does not identify its cause, and the sensory phenotype does
    not differ by causal gene. Until this is resolved, dismech deliberately
    keeps pain as its own mechanism node rather than as a severity qualifier on
    the keratoderma node, since a therapy that thins the callus is not thereby
    predicted to relieve the pain.
  proposed_experiments:
  - experiment_id: pc_ienfd_lesional_vs_nonlesional
    name: Intraepidermal nerve fibre quantification in PC lesional vs non-lesional plantar skin
    description: >-
      Skin biopsy with PGP9.5 immunostaining to test whether small-fibre density
      or morphology in lesional plantar skin correlates with pain scores
      independently of callus thickness.
  - experiment_id: pc_neurovascular_structures_vs_qst
    name: Correlation of neurovascular structure burden with quantitative sensory testing
    description: >-
      Prospective study relating the number and distribution of intracallus
      neurovascular structures to mechanical hyperalgesia thresholds and DN4
      scores.
  evidence:
  - reference: PMID:29210461
    reference_title: "Chronic pain in pachyonychia congenita: evidence for neuropathic origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although thermal and mechanical hypoaesthesia may result from thicker skin, its presentation in painful regions, along with mechanical hyperalgesia and allodynia, point towards the possibility of neuropathic changes occurring in PC."
    explanation: >-
      Frames the open question: skin thickening explains part of the sensory
      phenotype but not the hyperalgesia and allodynia.
  - reference: PMID:36116508
    reference_title: "EGFR Signaling Is Overactive in Pachyonychia Congenita: Effective Treatment with Oral Erlotinib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mechanisms leading to pain and painful palmoplantar keratoderma in PC remain elusive."
    explanation: >-
      A 2023 primary study states the gap explicitly.
- discussion_id: pc_krt16_null_mouse_dominant_negative_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the recessively inherited Krt16-null mouse model the same disease
    mechanism as dominant-negative keratin variants in human pachyonychia
    congenita?
  attaches_to:
  - pathophysiology#Loss of Keratinocyte Mechanical Resilience
  - pathophysiology#Keratin Intermediate Filament Network Disruption
  rationale: >-
    Nearly all mechanistic insight into PC keratoderma — the pre-lesional
    differentiation defect, the KRT9 loss, the NRF2/oxidative-stress axis and
    the sulforaphane rescue — comes from mice lacking Krt16 entirely, a
    recessive loss-of-function state. Human PC is caused by heterozygous,
    dominant-negative alleles in which a mutant subunit is present and poisons
    the network. The model's own authors note that their findings call into
    question a purely gain-of-function view of PC keratoderma and emphasise the
    role of genetic modifiers. Whether the differentiation/redox cascade is
    equally engaged when a poisoned filament network is present, rather than no
    K16 at all, is unresolved, and it matters directly for whether NRF2-directed
    therapy will translate. Partial reassurance exists — hypophosphorylated NRF2
    was confirmed in human PC lesional skin — but the rescue arm remains
    mouse-only.
  proposed_experiments:
  - experiment_id: pc_krt16_dominant_negative_knockin_mouse
    name: Knock-in mouse carrying a human dominant-negative Krt16 allele
    description: >-
      Generate a heterozygous knock-in of a recurrent human KRT16 PC allele and
      test whether the pre-lesional KRT9 loss and NRF2 hypoactivity of the null
      model are reproduced.
  - experiment_id: pc_krt9_nrf2_readouts_human_biopsies
    name: KRT9 and NRF2 pathway readouts in genotyped human PC plantar biopsies
    description: >-
      Compare KRT9 expression and NRF2 phosphorylation state across PC-K6a,
      PC-K16 and PC-K17 lesional skin to test whether the mouse cascade is
      genotype-independent in humans.
  evidence:
  - reference: PMID:22336941
    reference_title: "Keratin 16-null mice develop palmoplantar keratoderma, a hallmark feature of pachyonychia congenita and related disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings call into question the view that PC-related PPK arises exclusively as a gain-of-function on account of dominantly acting mutated keratins, and highlight the key role of modifiers in the clinical heterogeneity of PC symptoms."
    explanation: >-
      The model's authors state the mechanistic mismatch between the recessive
      null mouse and the dominant human disease.
  - reference: PMID:27183391
    reference_title: "Oxidative stress and dysfunctional NRF2 underlie pachyonychia congenita phenotypes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, examination of plantar skin biopsies from individuals with PC confirmed the presence of high levels of hypophosphorylated NRF2 in lesional tissue."
    explanation: >-
      Partially closes the mismatch for the NRF2 node by confirming it in human
      tissue; the therapeutic rescue arm remains mouse-only.
- discussion_id: pc_nosology_genotypic_supersedes_eponymous
  kind: OPEN_QUESTION
  status: RESOLVED
  prompt: >-
    Should pachyonychia congenita be subtyped by the eponymous PC-1
    (Jadassohn-Lewandowsky) / PC-2 (Jackson-Lawler) split or by causal keratin
    gene?
  rationale: >-
    Registry data showed that most keratin subgroups express a mixed
    constellation of the findings historically assigned to PC-1 and PC-2, so the
    eponymous categories cut across the causal genes and mislead on prognosis.
    Both large genotyped cohorts (n = 254 and n = 815) concluded in favour of a
    genotypic classification, and dismech follows that: has_subtypes is
    organised as PC-K6a/PC-K6b/PC-K6c/PC-K16/PC-K17. The eponyms are retained
    only as synonyms on the disease entry.
  resolution_note: >-
    Resolved in favour of the genotypic classification. Note that MONDO's
    numbered children still attach "Jadassohn-Lewandowsky" to the KRT16 class
    (MONDO:0008173) alone, which is a simplification of the historical usage
    (PC-1 spanned KRT6A and KRT16; PC-2 spanned KRT6B and KRT17). The MONDO
    terms are bound on their single-gene definitions, not on the eponyms.
  evidence:
  - reference: PMID:22264670
    reference_title: "A review of the clinical phenotype of 254 patients with genetically confirmed pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most keratin subgroups expressed a mixed constellation of findings historically reported as PC-1 and PC-2."
    explanation: >-
      The empirical basis for abandoning the eponymous split.
  - reference: PMID:22264670
    reference_title: "A review of the clinical phenotype of 254 patients with genetically confirmed pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose a new classification for PC based on the specific keratin gene affected to help clinicians improve their diagnostic and prognostic accuracy, correct spurious associations, and improve therapeutic development."
    explanation: >-
      The explicit proposal of the genotypic nosology adopted here.
  - reference: PMID:31823354
    reference_title: "Revisiting pachyonychia congenita: a case-cohort study of 815 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The establishment of an international registry containing clinical and molecular data led to the development of a disease classification based on the mutant gene and associated features."
    explanation: >-
      Confirms the registry-derived, gene-based classification as the accepted
      scheme.
notes: >-
  NOSOLOGY. This entry uses the genotypic subtype axis (PC-K6a, PC-K6b, PC-K6c,
  PC-K16, PC-K17), which supersedes the older eponymous split into PC-1
  (Jadassohn-Lewandowsky) and PC-2 (Jackson-Lawler). The eponymous categories
  cut across the causal genes and are no longer the preferred nosology; they are
  retained here only as synonyms. MONDO's four numbered children of
  MONDO:0016471 are themselves defined genotypically, so they map cleanly onto
  four of the five subtypes: KRT16 to MONDO:0008173 ("pachyonychia congenita
  1"), KRT17 to MONDO:0008174 ("pachyonychia congenita 2"), KRT6A to
  MONDO:0014324 ("pachyonychia congenita 3"), KRT6B to MONDO:0014325
  ("pachyonychia congenita 4"). Note that MONDO's PC1 term folds the
  Jadassohn-Lewandowsky eponym onto KRT16 alone, which is itself a
  simplification: historically PC-1 spanned KRT6A and KRT16, and PC-2 spanned
  KRT6B and KRT17.

  ONTOLOGY GAP. There is no MONDO term for the KRT6C-caused subtype, so PC-K6c
  is curated with genes and evidence but with subtype_term deliberately left
  unbound rather than forced onto a near-miss term. Two obsolete MONDO classes
  exist in this area and must never be used: MONDO:0000325 (obsolete
  pachyonychia congenita) and MONDO:0009827 (obsolete pachyonychia congenita,
  autosomal recessive).

  MODELLING CHOICES. Two structural decisions follow the curation issue and the
  review of KRT1_Keratinopathies.yaml in dismech#3401. First, plantar pain is
  modelled as its own mechanism node ("Plantar Nociceptive and Neuropathic
  Pain") and its own phenotype ("Plantar Pain") rather than as a severity
  qualifier on the keratoderma, because its magnitude is not proportional to the
  extent of hyperkeratosis and quantitative sensory testing shows a neuropathic
  component that thickened skin does not explain. Second, keratin network
  collapse ("Keratin Intermediate Filament Network Disruption" and "Loss of
  Keratinocyte Mechanical Resilience") is kept separate from downstream
  hyperproliferation and barrier failure ("Compensatory Epidermal
  Hyperproliferation and Barrier Dysregulation"), with the differentiation and
  redox nodes between them, so that a therapy acting on one arm is not
  implicitly credited with acting on the other.

  RELATED ENTRIES. Punctate_Palmoplantar_Keratoderma.yaml (shares the KM-001
  trials, which co-enrolled PC),
  Diffuse_Nonepidermolytic_Palmoplantar_Keratoderma.yaml, and
  KRT1_Keratinopathies.yaml (the epidermolytic keratin disorders, from which PC
  is distinguished by its non-epidermolytic histology). Named-entity caution for
  future curators: pachyonychia congenita is not dyskeratosis congenita (a
  telomere biology disorder that shares nail dystrophy and oral leukoplakia but
  adds bone marrow failure and lacks plantar pain), not Olmsted syndrome
  (TRPV3), not Clouston syndrome (GJB6), and not punctate or diffuse
  epidermolytic PPK.

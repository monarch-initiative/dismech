- name: Plantar Nociceptive and Neuropathic Pain
  biological_scale: ORGANISM
  description: >-
    Chronic, moderate-to-severe plantar pain, throbbing and stabbing in
    quality, worst on weight bearing, and the single most disabling feature of
    PC. It is modelled here as its own mechanism node rather than as a severity
    qualifier on the keratoderma for two reasons. First, its magnitude is not
    proportional to the extent of hyperkeratosis. Second, quantitative sensory
    testing in 62 patients versus 45 controls shows a signature that
    hyperkeratosis alone does not explain: mechanical hyperalgesia and static
    allodynia in painful regions, DN4 scores in the neuropathic range in the
    majority, and impaired conditioned pain modulation — i.e. a neuropathic
    component alongside the nociceptive one. Notably the sensory phenotype did
    not differ by causal gene, so pain is a shared final common pathway across
    subtypes rather than a subtype feature.

name: Pachyonychia Congenita
creation_date: "2026-08-18T11:45:00Z"
category: Mendelian
description: >-
  Pachyonychia congenita (PC) is a rare autosomal dominant disorder of
  keratinization caused by heterozygous, predominantly dominant-negative
  variants in one of five keratin genes — KRT6A, KRT6B, KRT6C, KRT16 or
  KRT17 — whose products are the wound- and stress-inducible keratins of
  palmoplantar epidermis and ectodermal appendages. The defining clinical
  triad is focal (non-epidermolytic) palmoplantar keratoderma, severe chronic
  plantar pain, and hypertrophic nail dystrophy; additional features include
  oral leukokeratosis, pilosebaceous cysts, follicular hyperkeratosis,
  palmoplantar hyperhidrosis, hoarseness and natal teeth. Mutant keratin
  incorporated into type I/type II heterodimers disrupts assembly of the
  keratin intermediate filament network; downstream, palmoplantar
  keratinocytes show defective terminal differentiation with loss of KRT9,
  oxidative stress with hypoactive Keap1-NRF2 signalling, barrier and
  alarmin dysregulation, and compensatory hyperproliferation, producing the
  focal callus. Plantar pain is the dominant patient-reported burden, is not
  proportional to the extent of keratoderma, and carries quantitative
  sensory-testing evidence of a neuropathic component; it is therefore
  modelled here as a mechanism and phenotype in its own right rather than as
  a severity qualifier on the keratoderma. Modern nosology is genotypic
  (PC-K6a, PC-K6b, PC-K6c, PC-K16, PC-K17) and supersedes the older
  eponymous PC-1 (Jadassohn-Lewandowsky) / PC-2 (Jackson-Lawler) split, which
  cuts across the causal genes.

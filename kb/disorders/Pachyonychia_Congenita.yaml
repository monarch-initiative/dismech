has_subtypes:
- name: PC-K6a
  display_name: PC-K6a (KRT6A; MONDO pachyonychia congenita 3)
  subtype_term:
    preferred_term: PC-K6a
    term:
      id: MONDO:0014324
      label: pachyonychia congenita 3
  description: >-
    PC caused by heterozygous KRT6A variants. The most common subtype in most
    reported cohorts. Characterised by widespread nail dystrophy with the
    earliest age of onset and the highest number of involved nails, prominent
    oral leukokeratosis, hoarseness (laryngeal leukokeratosis), and the greatest
    likelihood of requiring walking aids. First-bite syndrome is reported
    predominantly in this subtype.
  genes:
  - preferred_term: KRT6A
    term:
      id: hgnc:6443
      label: KRT6A
  evidence:
  - reference: PMID:31823354
    reference_title: "Revisiting pachyonychia congenita: a case-cohort study of 815 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KRT6A mutations were associated with oral leucokeratosis, hoarseness, youngest age or highest number of fingernails/toenails involved, and use of walking aids."
    explanation: >-
      The IPCRR case-cohort study of 815 genetically confirmed patients defines
      the KRT6A genotype-phenotype correlation used for this subtype.
  - reference: PMID:22264670
    reference_title: "A review of the clinical phenotype of 254 patients with genetically confirmed pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed a higher likelihood of oral leukokeratosis in individuals harboring KRT6A mutations, and a strong association of natal teeth and cysts in carriers of a KRT17 mutation."
    explanation: >-
      An independent registry cohort replicates the KRT6A-oral leukokeratosis
      association.
- name: PC-K6b
  display_name: PC-K6b (KRT6B; MONDO pachyonychia congenita 4)
  subtype_term:
    preferred_term: PC-K6b
    term:
      id: MONDO:0014325
      label: pachyonychia congenita 4
  description: >-
    PC caused by heterozygous KRT6B variants. The least common of the four
    MONDO-recognised numbered subtypes, accounting for roughly 3% of families
    in a large mutational study. Plantar keratoderma, plantar pain and toenail
    dystrophy are near-universal, while fingernail involvement and oral
    leukokeratosis are less frequent than in PC-K6a.
  genes:
  - preferred_term: KRT6B
    term:
      id: hgnc:6444
      label: KRT6B
  evidence:
  - reference: PMID:21326300
    reference_title: "A large mutational study in pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately half of the kindreds had mutations in KRT6A (52%), 28% had mutations in KRT16, 17% in KRT17, and 3% of families had mutations in KRT6B."
    explanation: >-
      Establishes KRT6B as a confirmed but uncommon causal gene in a cohort of
      90 genetically characterised PC families.
- name: PC-K6c
  display_name: PC-K6c (KRT6C; no MONDO term available)
  description: >-
    PC caused by heterozygous KRT6C variants, most often in-frame deletions.
    Originally delineated in families presenting with focal palmoplantar
    keratoderma and minimal or absent nail change, and correspondingly a
    milder and probably underdiagnosed subtype; plantar keratoderma and plantar
    pain are nonetheless near-universal, while fingernail involvement is rare.
    KRT6C is expressed in plantar epidermis, consistent with the tissue
    restriction of the phenotype.
  genes:
  - preferred_term: KRT6C
    term:
      id: hgnc:20406
      label: KRT6C
  review_notes: >-
    ONTOLOGY GAP: MONDO has no term for the KRT6C-caused subtype. The four
    numbered MONDO children of MONDO:0016471 cover KRT16 (MONDO:0008173),
    KRT17 (MONDO:0008174), KRT6A (MONDO:0014324) and KRT6B (MONDO:0014325)
    only, so subtype_term is deliberately left unbound here rather than forced
    onto a near-miss term. Note also that two obsolete MONDO classes exist in
    this area — MONDO:0000325 (obsolete pachyonychia congenita) and
    MONDO:0009827 (obsolete pachyonychia congenita, autosomal recessive) — and
    must never be used.
  evidence:
  - reference: PMID:19609311
    reference_title: "Keratin K6c mutations cause focal palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutational analysis of the recently identified KRT6C gene, encoding keratin K6c, showed heterozygous in-frame deletion mutations in all three kindreds"
    explanation: >-
      The report that established KRT6C as the fifth PC/focal-PPK keratin gene,
      by in-frame deletion in three unrelated kindreds.
  - reference: PMID:19609311
    reference_title: "Keratin K6c mutations cause focal palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report three unrelated families who presented with familial FPPK with minor or absent nail changes."
    explanation: >-
      Documents the nail-sparing, keratoderma-predominant presentation that
      distinguishes the KRT6C subtype.
  - reference: PMID:31823354
    reference_title: "Revisiting pachyonychia congenita: a case-cohort study of 815 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pachyonychia congenita (PC) is a group of autosomal dominant disorders caused by mutations in one of five keratin genes (KRT6A, KRT6B, KRT6C, KRT16, KRT17)."
    explanation: >-
      Confirms KRT6C as one of the five accepted causal genes, so the subtype
      is real despite lacking a MONDO identifier.
- name: PC-K16
  display_name: PC-K16 (KRT16; MONDO pachyonychia congenita 1)
  subtype_term:
    preferred_term: PC-K16
    term:
      id: MONDO:0008173
      label: pachyonychia congenita 1
  description: >-
    PC caused by heterozygous KRT16 variants; the second most common subtype
    in most cohorts and the most common in the Israeli population, where a
    founder p.R127H allele predominates. Plantar keratoderma and plantar pain
    are near-universal; oral leukokeratosis, cysts and natal teeth are less
    frequent than in PC-K6a/PC-K17. KRT16 variants can also cause focal
    non-epidermolytic PPK without other PC features.
  genes:
  - preferred_term: KRT16
    term:
      id: hgnc:6423
      label: KRT16
  review_notes: >-
    MONDO labels this class "pachyonychia congenita 1" and attaches the
    Jadassohn-Lewandowsky eponym to it. That is a simplification: historically
    PC-1 spanned KRT6A and KRT16 (and PC-2 spanned KRT6B and KRT17), so the
    eponymous split cuts across the genotypic subtypes used here. The MONDO
    term is bound because its definition is the single-gene (KRT16) criterion,
    not because the eponym is endorsed.
  evidence:
  - reference: PMID:33190296
    reference_title: "Molecular epidemiology of pachyonychia congenita in the Israeli population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to the high prevalence of KRT6A mutations in other populations, we found that KRT16 mutations were the most common type among Israeli patients with PC (56%)."
    explanation: >-
      Documents population-specific enrichment of the KRT16 subtype.
  - reference: PMID:33190296
    reference_title: "Molecular epidemiology of pachyonychia congenita in the Israeli population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most (77%) of the Israeli patients with PC with KRT16 mutation carried the same variant (c.380G>A; p.R127H) and shared the same haplotype around the KRT16 locus, suggestive of a founder effect."
    explanation: >-
      Identifies a founder KRT16 allele underlying the subtype's local
      over-representation.
- name: PC-K17
  display_name: PC-K17 (KRT17; MONDO pachyonychia congenita 2)
  subtype_term:
    preferred_term: PC-K17
    term:
      id: MONDO:0008174
      label: pachyonychia congenita 2
  description: >-
    PC caused by heterozygous KRT17 variants. Distinguished by the strong
    clustering of pilosebaceous cysts (including steatocystomas and vellus hair
    cysts) and of natal or prenatal teeth; follicular hyperkeratosis is also
    common. Plantar keratoderma and plantar pain, while still the dominant
    burden, are somewhat less universal than in the KRT6A/KRT16 subtypes. The
    same heterozygous KRT17 variant can present as steatocystoma multiplex in
    other family members.
  genes:
  - preferred_term: KRT17
    term:
      id: hgnc:6427
      label: KRT17
  evidence:
  - reference: PMID:31823354
    reference_title: "Revisiting pachyonychia congenita: a case-cohort study of 815 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KRT17 mutations were most commonly associated with cysts and natal teeth."
    explanation: >-
      The IPCRR case-cohort study of 815 patients establishes the defining
      KRT17 genotype-phenotype correlation.
  - reference: PMID:22264670
    reference_title: "A review of the clinical phenotype of 254 patients with genetically confirmed pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed a higher likelihood of oral leukokeratosis in individuals harboring KRT6A mutations, and a strong association of natal teeth and cysts in carriers of a KRT17 mutation."
    explanation: >-
      An independent registry cohort replicates the KRT17-cysts/natal-teeth
      association.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: Approximately 30% of cases arise from a de novo pathogenic variant.
  description: >-
    PC is inherited in an autosomal dominant manner. Roughly 70% of patients
    have an affected parent and about 30% represent de novo variants; a single
    case of germline mosaicism has been reported.
  evidence:
  - reference: PMID:20301457
    reference_title: "Pachyonychia Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pachyonychia congenita is inherited in an autosomal dominant manner. Approximately 30% of cases appear to be caused by a de novo pathogenic variant."
    explanation: >-
      GeneReviews states the mode of inheritance and the de novo rate.
  - reference: PMID:21326300
    reference_title: "A large mutational study in pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PC is due to heterozygous mutations in one of four keratin genes, namely, KRT6A, KRT6B, KRT16, or KRT17."
    explanation: >-
      Confirms the heterozygous (dominant) state of the causal variants in a
      cohort of 90 families. Predates the addition of KRT6C to the gene set.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ULTRA_RARE
  notes: >-
    No numeric population-based prevalence estimate could be verified from a
    quotable abstract; contemporary reviews describe PC as rare and note that
    the true prevalence is probably underestimated because milder subtypes
    (particularly PC-K6c) go undiagnosed. rate_per_100000 is deliberately
    omitted rather than derived from a figure that could not be quoted.
  evidence:
  - reference: PMID:37766547
    reference_title: "Pachyonychia Congenita: Clinical Features and Future Treatments."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although classed as rare, the prevalence of PC is likely to be underestimated."
    explanation: >-
      Supports the rare classification while flagging that ascertainment is
      incomplete; it does not supply a numeric rate, hence PARTIAL.
progression:
- phase: Onset
  age_range: First months to first years of life
  notes: >-
    Hypertrophic nail dystrophy is typically the first recognised feature,
    usually in the first year; plantar keratoderma follows once the child
    begins to walk.
  evidence:
  - reference: PMID:31823354
    reference_title: "Revisiting pachyonychia congenita: a case-cohort study of 815 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The earliest clinical manifestations of PC are nail dystrophy and palmoplantar keratoderma. Diagnosis can be suspected and confirmed in preschool years."
    explanation: >-
      Establishes nail dystrophy and keratoderma as the earliest manifestations
      and preschool age as the usual point of diagnosis.
- phase: Established disease
  age_range: By age 10 years
  notes: >-
    The diagnostic triad of toenail thickening, plantar keratoderma and plantar
    pain is present in nearly all patients by the end of the first decade.
  evidence:
  - reference: PMID:22264670
    reference_title: "A review of the clinical phenotype of 254 patients with genetically confirmed pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a diagnostic triad of toenail thickening, plantar keratoderma, and plantar pain was reported by 97% of patients with PC by age 10 years"
    explanation: >-
      Quantifies completion of the diagnostic triad within the first decade.
- phase: Chronic
  age_range: Adolescence to adulthood
  notes: >-
    Lifelong disease without effect on lifespan. Chronic plantar pain becomes
    the dominant disability, frequently requiring walking aids and imposing
    occupational and psychosocial costs.
  evidence:
  - reference: PMID:31021398
    reference_title: "Pathophysiology of pachyonychia congenita-associated palmoplantar keratoderma: new insights into skin epithelial homeostasis and avenues for treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PC dramatically impacts quality of life although it does not affect lifespan."
    explanation: >-
      Characterises the chronic, non-lethal but highly disabling natural
      history.
pathophysiology:
- name: Dominant-Negative Keratin Variant
  conforms_to: "keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament Assembly Domain"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous variant — usually a missense change or a small in-frame
    insertion/deletion within one of the helix boundary (helix initiation or
    helix termination) motifs — in KRT6A, KRT6B, KRT6C, KRT16 or KRT17. These
    motifs are the regions of the keratin polypeptide most critical for
    filament assembly, so the mutant protein acts in a dominant-negative
    fashion on the network built by the wild-type allele. The five genes encode
    the wound- and stress-inducible keratins whose expression domain (palmar
    and plantar epidermis, nail bed, oral mucosa, pilosebaceous unit) predicts
    the tissue distribution of disease.
  genes:
  - preferred_term: KRT6A
    term:
      id: hgnc:6443
      label: KRT6A
  - preferred_term: KRT6B
    term:
      id: hgnc:6444
      label: KRT6B
  - preferred_term: KRT6C
    term:
      id: hgnc:20406
      label: KRT6C
  - preferred_term: KRT16
    term:
      id: hgnc:6423
      label: KRT16
  - preferred_term: KRT17
    term:
      id: hgnc:6427
      label: KRT17
  evidence:
  - reference: PMID:21326300
    reference_title: "A large mutational study in pachyonychia congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the mutations were heterozygous missense or small in-frame insertion/deletion mutations occurring within one of the helix boundary motif regions of the keratin polypeptide."
    explanation: >-
      Establishes the mutation class and its clustering in the assembly-critical
      helix boundary motifs across 90 PC families.
  - reference: PMID:19609311
    reference_title: "Keratin K6c mutations cause focal palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dominant-negative mutations in any of the four identified keratin genes, KRT6A, KRT6B, KRT16, or KRT17, cause pachyonychia congenita (PC), characterized by hypertrophic nail dystrophy and other ectodermal features."
    explanation: >-
      States the dominant-negative mechanism explicitly for the PC keratin
      genes.
  downstream:
  - target: Keratin Intermediate Filament Network Disruption
    causal_link_type: DIRECT
    description: >-
      Mutant keratin is co-expressed with wild-type keratin and incorporated
      into the same filament population, poisoning assembly.
    evidence:
    - reference: PMID:17914454
      reference_title: "Single-nucleotide-specific siRNA targeting in a dominant-negative skin model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "As predicted for a dominant-negative disease, simultaneous expression of both wild-type and mutant K6a resulted in defective keratin filament formation. Addition of mutant-specific siRNAs allowed normal filament formation, suggesting selective inhibition of mutant K6a."
      explanation: >-
        Directly demonstrates that co-expression of mutant and wild-type K6a is
        what defeats filament formation, and that removing the mutant transcript
        restores it — the definition of a dominant-negative edge.
- name: Keratin Intermediate Filament Network Disruption
  conforms_to: "keratin_intermediate_filament_fragility#Keratin Filament Network Collapse and Aggregation"
  biological_scale: MOLECULAR
  description: >-
    Keratin intermediate filaments are obligate heteropolymers of one type I
    and one type II keratin (K16/K17 with K6a/K6b/K6c in PC-relevant tissues).
    Mutant subunits assemble into aggregates instead of an extended filament
    network. This has been reproduced directly for the recurrent KRT6A N171K
    substitution and the N171del in-frame deletion in transfected cells, where
    fluorescent keratin reporters form aggregates rather than normal filaments.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratin intermediate filament assembly
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: ABNORMAL
  - preferred_term: intermediate filament cytoskeleton organization
    term:
      id: GO:0045104
      label: intermediate filament cytoskeleton organization
    modifier: ABNORMAL
  locations:
  - preferred_term: skin epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  evidence:
  - reference: PMID:17145926
    reference_title: "SiRNA-mediated selective inhibition of mutant keratin mRNAs responsible for the skin disorder pachyonychia congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Similar constructs containing a single nucleotide change (N171K) or a three-nucleotide deletion (N171del) showed keratin aggregate formation."
    explanation: >-
      Directly demonstrates that PC-causing KRT6A alleles produce keratin
      aggregates rather than a normal filament network.
  - reference: PMID:17145926
    reference_title: "SiRNA-mediated selective inhibition of mutant keratin mRNAs responsible for the skin disorder pachyonychia congenita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection experiments of a fusion gene consisting of K6a and a yellow fluorescent reporter (YFP) resulted in normal keratin filament formation in transfected cells as assayed by fluorescence microscopy."
    explanation: >-
      Provides the wild-type control against which the mutant aggregation
      phenotype is read.
  downstream:
  - target: Loss of Keratinocyte Mechanical Resilience
    causal_link_type: DIRECT
    description: >-
      A defective keratin filament network leaves the palmoplantar keratinocyte
      unable to bear the mechanical load of weight-bearing skin.
  - target: Defective Terminal Differentiation of Volar Keratinocytes
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of K16-dependent regulation of the volar keratinocyte differentiation
      programme, with downregulation of KRT9.
    description: >-
      Beyond its structural role, K16 is required for the normal terminal
      differentiation programme of volar keratinocytes; its loss or disruption
      derails that programme ahead of any lesion.
- name: Loss of Keratinocyte Mechanical Resilience
  conforms_to: "keratin_intermediate_filament_fragility#Loss of Keratinocyte Mechanical Resilience"
  biological_scale: CELLULAR
  description: >-
    Palmoplantar keratinocytes carrying a disrupted keratin network tolerate
    friction, pressure and shear poorly, so lesions form precisely at
    weight-bearing pressure points. Importantly, and unlike the KRT1/KRT10 and
    KRT9 keratinopathies, PC-associated keratoderma is non-epidermolytic:
    frank cytolysis of the differentiating epidermis is not the histological
    hallmark, and the mechanism is better described as reduced mechanical
    resilience plus derailed stress signalling than as simple cell lysis.
    Blistering can occur beneath the callus but is not the defining lesion.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: skin of sole of pes
    term:
      id: UBERON:0013778
      label: skin of sole of pes
  - preferred_term: nail bed
    term:
      id: UBERON:0005273
      label: nail bed
  mechanism_confidence: PROVISIONAL
  notes: >-
    The non-epidermolytic character of PC keratoderma is why this node is kept
    distinct from the downstream hyperproliferation/barrier node, following the
    node structure used in KRT1_Keratinopathies.yaml and the point raised in
    dismech#3401 that keratin network collapse and downstream hyperproliferation
    are separate mechanistic claims.
  evidence:
  - reference: PMID:37766547
    reference_title: "Pachyonychia Congenita: Clinical Features and Future Treatments."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "PC is diagnosed clinically alongside identification of a heterozygous pathogenic mutation in one of five keratin genes: KRT6A, KRT6B, KRT6C, KRT16, or KRT17."
    explanation: >-
      Supports the genetic basis of the keratinocyte defect; the review does not
      quantify mechanical resilience directly, hence PARTIAL.
  - reference: PMID:22336941
    reference_title: "Keratin 16-null mice develop palmoplantar keratoderma, a hallmark feature of pachyonychia congenita and related disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the inactivation of Krt16 in mice consistently causes oral lesions as well as PPK-like hyperkeratotic calluses on Krt16(-/-) front and hind paws, which severely compromise the animals' ability to walk"
    explanation: >-
      Shows that loss of the K16 filament subunit alone is sufficient to
      produce weight-bearing-site callus and impaired ambulation in vivo.
  downstream:
  - target: Compensatory Epidermal Hyperproliferation and Barrier Dysregulation
    causal_link_type: DIRECT
    description: >-
      Chronic mechanical stress at pressure points drives a compensatory
      hyperproliferative and barrier-repair response.
  - target: Plantar Nociceptive and Neuropathic Pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Tissue-level injury at weight-bearing sites is one hypothesised

    reference_title: "Pachyonychia congenita: pathogenesis of pain and approaches to treatment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Current therapeutic options for pain in PC are limited to lifestyle adjustment and mechanical techniques, with a small subgroup of patients benefiting from oral retinoids."
    explanation: >-
      Supports a real but narrow role for oral retinoids; PARTIAL because the
      review explicitly restricts the benefit to a small subgroup.
- name: Neuropathic Pain Pharmacotherapy
  description: >-
    Simple analgesia plus neuropathic agents (amitriptyline, gabapentin,
    pregabalin) used by some patients, with specialist pain input in severe
    cases. The rationale is the demonstrated neuropathic component of PC
    plantar pain rather than any effect on the keratoderma — which is precisely
    why plantar pain is modelled as its own mechanism node here.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Plantar Nociceptive and Neuropathic Pain
    treatment_effect: INHIBITS
    description: >-
      Targets the neuropathic component of the pain directly, independently of
      callus thickness.
    evidence:
    - reference: PMID:29210461
      reference_title: "Chronic pain in pachyonychia congenita: evidence for neuropathic origin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical features and DN4 scores support this possibility and therefore neuropathic pain medications may be beneficial for patients with PC."
      explanation: >-
        The sensory-testing study's own therapeutic inference: neuropathic pain
        medication is indicated by the neuropathic phenotype.
  evidence:
  - reference: PMID:29210461
    reference_title: "Chronic pain in pachyonychia congenita: evidence for neuropathic origin."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Histological studies showing alterations in sensory innervation, along with reports on alterations in mechanical sensitivity, suggest that PC may be a form of neuropathy."
    explanation: >-
      Supports the rationale; PARTIAL because no controlled trial of neuropathic
      agents in PC is cited.
- name: TD101 Mutation-Specific siRNA
  description: >-
    TD101 (K6a_513a.12) is an allele-specific small interfering RNA designed to
    silence the KRT6A N171K mutant transcript while sparing wild-type K6a
    mRNA — the therapeutic embodiment of the dominant-negative mechanism. It
    was tested by intradermal injection into plantar calluses in a 17-week,
    prospective, double-blind, split-body (opposite feet), vehicle-controlled,
    dose-escalation phase Ib trial. IMPORTANT EVIDENCE CAVEAT: that trial
    enrolled a SINGLE PATIENT (n = 1). Callus regression was reported on the
    siRNA-treated foot only and no adverse events occurred, and the study is
    historically notable as the first clinical use of siRNA in human skin and
    the first targeting a dominant-negative mutant allele — but it is an n-of-1
    observation and must not be read as established efficacy. The authors
    themselves framed the result as warranting further study. Development did
    not proceed to a larger trial, in part because intradermal needle
    administration to PC lesions is intensely painful.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SIRNA
  target_mechanisms:
  - target: Keratin Intermediate Filament Network Disruption
    treatment_effect: INHIBITS
    description: >-
      Selective degradation of the mutant K6a transcript removes the
      dominant-negative subunit from the filament pool, permitting normal
      keratin filament formation from the wild-type allele. Demonstrated in
      cell culture; the human evidence is a single-patient trial.
    evidence:
    - reference: PMID:17914454
      reference_title: "Single-nucleotide-specific siRNA targeting in a dominant-negative skin model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Addition of mutant-specific siRNAs allowed normal filament formation, suggesting selective inhibition of mutant K6a."
      explanation: >-
        Directly demonstrates that the siRNA acts on this mechanism node by
        restoring filament assembly in a dominant-negative cell model.
    - reference: PMID:19935778
      reference_title: "First-in-human mutation-targeted siRNA phase Ib trial of an inherited skin disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This siRNA, called TD101, specifically and potently targets the keratin 6a (K6a) N171K mutant mRNA without affecting wild-type K6a mRNA."
      explanation: >-
        Establishes the allele-selective target of the agent in the clinical
        formulation.
  evidence:
  - reference: PMID:19935778
    reference_title: "First-in-human mutation-targeted siRNA phase Ib trial of an inherited skin disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The safety and efficacy of TD101 was tested in a single-patient 17-week, prospective, double-blind, split-body, vehicle-controlled, dose-escalation trial."
    explanation: >-
      The design statement itself is the caveat: n = 1. Recorded as PARTIAL
      because a single-patient split-body observation cannot establish efficacy,
      however well controlled within that patient.
  - reference: PMID:19935778
    reference_title: "First-in-human mutation-targeted siRNA phase Ib trial of an inherited skin disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjective patient assessment and physician clinical efficacy measures revealed regression of callus on the siRNA-treated, but not on the vehicle-treated foot."
    explanation: >-
      Reports the observed effect, in the single treated patient, with the
      contralateral vehicle-treated foot as the internal control.
  - reference: PMID:19935778
    reference_title: "First-in-human mutation-targeted siRNA phase Ib trial of an inherited skin disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This trial represents the first time that siRNA has been used in a clinical setting to target a mutant gene or a genetic disorder, and the first use of siRNA in human skin."
    explanation: >-
      Supports the historical significance claim, which is separable from — and
      does not imply — a claim about efficacy.
  - reference: PMID:21248764
    reference_title: "Use of self-delivery siRNAs to inhibit gene expression in an organotypic pachyonychia congenita model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unfortunately, the intense pain associated with hypodermic needle administration to PC lesions precludes this as a viable delivery option for this disorder."
    explanation: >-
      Documents the delivery barrier that stopped intradermal TD101 from
      progressing, and motivated self-delivery siRNA chemistry.
  notes: >-
    TD101 is the canonical dismech example of an allele-specific silencing
    therapy anchored to a dominant-negative mechanism node. Its evidence base is
    deliberately recorded as PARTIAL: the human data are a single-patient trial
    (PMID:19935778), supported by IN_VITRO allele-selectivity data
    (PMID:17914454, PMID:17145926, PMID:21248764) and by molecular endpoint
    development (PMID:21191405).
- name: Topical Rapamycin (Sirolimus)
  description: >-
    Topical mTOR inhibition, rationalised by the demonstrated
    EGFR-MAPK/ERK-mTOR overactivity in PC lesional epidermis and by reports
    that sirolimus selectively reduces KRT6A expression. Oral sirolimus
    improved keratoderma in an off-label series but had intolerable systemic
    effects, motivating the topical route. A multicentre phase 3
    vehicle-controlled trial of QTORIN 3.9% rapamycin anhydrous gel is under
    way; efficacy is not yet established.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Compensatory Epidermal Hyperproliferation and Barrier Dysregulation
    treatment_effect: INHIBITS
    description: >-
      mTOR inhibition downstream of the overactive EGFR-MAPK/ERK axis in
      lesional epidermis.
    evidence:
    - reference: PMID:36116508
      reference_title: "EGFR Signaling Is Overactive in Pachyonychia Congenita: Effective Treatment with Oral Erlotinib."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "EGFR activation was confirmed by upregulated MAPK/ERK and mTOR signaling."
      explanation: >-
        Establishes mTOR activation in PC lesions as the target rationale;
        PARTIAL because this study tested EGFR inhibition, not rapamycin.
  evidence:
  - reference: clinicaltrials:NCT05180708
    reference_title: "A Multicenter, Phase 3 Randomized, Double-Blind, Vehicle-controlled Study Evaluating the Safety and Efficacy of QTORIN 3.9% Rapamycin Anhydrous Gel in the Treatment of Pachyonychia Congenita"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This study evaluates the safety and efficacy of QTORIN 3.9% rapamycin anhydrous gel in the treatment of adults with Pachyonychia Congenita."
    explanation: >-
      A registered phase 3 trial establishes that topical rapamycin is under
      formal evaluation in PC; PARTIAL because the registry record reports the
      design, not a result.
- name: Oral EGFR Inhibition (Erlotinib)
  description: >-
    Oral erlotinib, given for 6-8 months to three patients with PC on the basis
    of demonstrated EGFR pathway overactivity in lesional skin, was well
    tolerated and produced an early, marked and sustained reduction in
    neuropathic pain with major quality-of-life improvement. This is a
    three-patient open series, not a controlled trial, but it is mechanistically
    important because it targets the pain node through the epidermal signalling
    node rather than through callus removal.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Compensatory Epidermal Hyperproliferation and Barrier Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Pharmacological inhibition of the overactive HER1-EGFR signalling
      demonstrated in the upper spinous layers of PC lesions.
    evidence:
    - reference: PMID:36116508
      reference_title: "EGFR Signaling Is Overactive in Pachyonychia Congenita: Effective Treatment with Oral Erlotinib."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our study provides evidence that targeted pharmacological inhibition of EGFR is an effective strategy in PC."
      explanation: >-
        The authors' own statement that EGFR is the actionable target node.
  - target: Plantar Nociceptive and Neuropathic Pain
    treatment_effect: INHIBITS
    description: >-
      Reduction of neuropathic plantar pain reported in the treated patients.
    evidence:
    - reference: PMID:36116508
      reference_title: "EGFR Signaling Is Overactive in Pachyonychia Congenita: Effective Treatment with Oral Erlotinib."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "To counteract this biological cascade, we treated three patients with PC with oral erlotinib for 6‒8 months. The treatment was well-tolerated and led to an early, drastic, and sustained reduction of neuropathic pain with a major improvement of QOL."
      explanation: >-
        Reports the pain benefit; PARTIAL because n = 3 in an uncontrolled open
        series.
- name: Oral Statin Therapy
  description: >-
    Off-label oral statins, proposed to downregulate KRT6A expression via
    STAT1. Case reports suggested benefit in KRT6A-associated disease, but a
    subsequent series of six adults with KRT16 or KRT17 variants found no
    significant improvement in plantar calluses or pain, and all patients
    discontinued for insufficient efficacy. Recorded here as a genotype-limited
    strategy with negative evidence outside KRT6A. No `target_mechanisms` link
    is asserted: the only quotable clinical evidence is negative, and the
    TreatmentEffectEnum has no value for "no effect", so claiming an INHIBITS
    edge would overstate the case.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:41100406
    reference_title: "Oral Statin Therapy in KRT16- and KRT17-Associated Palmoplantar Epidermal Differentiation Disorder (Pachyonychia Congenita)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the treatment was well tolerated in most cases, no significant clinical improvement in plantar calluses or pain was observed. All patients discontinued therapy due to insufficient efficacy."
    explanation: >-
      A negative result for oral statins in the KRT16 and KRT17 subtypes.
  - reference: PMID:41100406
    reference_title: "Oral Statin Therapy in KRT16- and KRT17-Associated Palmoplantar Epidermal Differentiation Disorder (Pachyonychia Congenita)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that oral statin therapy may offer limited benefit in KRT16/KRT17-pEDD-PC and suggest the potential importance of early intervention and genotype-specific therapeutic strategies."
    explanation: >-
      The authors' conclusion, supporting a genotype-specific rather than
      universal role for statins in PC.
- name: Management of Oral Leukokeratosis and Laryngeal Involvement
  description: >-
    Gentle brushing with a soft toothbrush and good oral hygiene improve the
    oral plaques; most resolve without intervention. Infants with leukokeratosis
    may need a soft, enlarged-opening bottle nipple. Laryngeal thickening
    requires ENT review, since rare infantile airway obstruction may need
    emergency surgery — but surgery to the larynx can paradoxically worsen the
    condition.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Oral Leukokeratosis
    treatment_effect: MODULATES
    description: Mechanical and hygiene measures for the oral mucosal plaques.
  evidence:
  - reference: PMID:20301457
    reference_title: "Pachyonychia Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Good oral hygiene and brushing gently with a soft toothbrush can improve thick, white patches on the tongue and oral mucosa."
    explanation: GeneReviews management recommendation for oral leukokeratosis.
  - reference: PMID:20301457
    reference_title: "Pachyonychia Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rarely, young children with laryngeal thickening/growths need emergency surgery to reestablish the airway; however, surgery may exacerbate the condition."
    explanation: >-
      Records both the airway risk and the explicit caution that surgery can
      make it worse.
- name: Infection Prevention and Treatment
  description: >-
    Secondary bacterial and fungal infection of dystrophic nails and macerated
    callus is common and a frequent reason for pain flares. Swabs and clippings
    should be taken and infections treated; a dilute bleach-bath regimen and
    pre/post-grooming hygiene are recommended for prevention. Infected or
    painful cysts can be incised and drained.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Hypertrophic Nail Dystrophy
    treatment_effect: MODULATES
    description: >-
      Treating superimposed infection removes a common aggravator of nail
      disease and pain, without altering the underlying keratin defect.
  evidence:
  - reference: PMID:20301457
    reference_title: "Pachyonychia Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary fungal and bacterial infections that require treatment are common; cysts usually do not require treatment but can be incised and drained if infected or painful."
    explanation: GeneReviews management recommendation for secondary infection and cysts.
  notes: >-
    GeneReviews also lists an "Agents/circumstances to avoid" item relevant to
    everyday management: "High temperatures and high humidity may worsen the
    condition."
- name: Genetic Counselling
  description: >-
    Autosomal dominant inheritance with a 50% recurrence risk for offspring and
    a roughly 30% de novo rate. Prenatal testing is possible once the familial
    variant is known; in vitro fertilisation with preimplantation genetic
    diagnosis is available but is generally reserved for severe disease.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301457
    reference_title: "Pachyonychia Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The offspring of an affected individual have a 50% chance of inheriting the disorder. If the pathogenic variant has been identified in an affected family member, prenatal testing for a pregnancy at increased risk is possible."
    explanation: GeneReviews genetic counselling statement.
diagnosis:
- name: Keratin gene molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Identification of a heterozygous pathogenic variant in one of the five PC
    keratin genes (KRT6A, KRT6B, KRT6C, KRT16, KRT17) confirms the diagnosis and
    assigns the genotypic subtype. This is what makes the five-gene axis, rather
    than the older PC-1/PC-2 eponyms, the operative nosology for this entry.
  results: >-
    A heterozygous pathogenic variant in KRT6A, KRT6B, KRT6C, KRT16, or KRT17
    establishes the diagnosis and the corresponding PC-K subtype.
  evidence:
  - reference: PMID:20301457
    reference_title: "Pachyonychia Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PC is diagnosed by clinical findings and/or by the identification of a heterozygous pathogenic variant in one of the five keratin genes known to cause PC: KRT6A, KRT6B, KRT6C, KRT16, and KRT17."
    explanation: >-
      GeneReviews DIAGNOSIS/TESTING statement, establishing both the clinical
      and the molecular route to diagnosis and naming the five causal genes.

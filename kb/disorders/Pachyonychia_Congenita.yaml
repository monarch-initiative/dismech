  mechanistic_category:
  - classification_value: intermediate filament disease
    notes: >-
      PC arises from variants in five keratin genes whose products are type I
      and type II intermediate filament proteins of palmoplantar epidermis and
      ectodermal appendages; the proximal lesion is disruption of keratin
      intermediate filament assembly.
    evidence:
    - reference: PMID:22336941
      reference_title: "Keratin 16-null mice develop palmoplantar keratoderma, a hallmark feature of pachyonychia congenita and related disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Keratin 16 (KRT16 in human, Krt16 in mouse), a type I intermediate filament protein, is constitutively expressed in epithelial appendages and is induced in the epidermis upon wounding and other stressors."
      explanation: >-
        Identifies the PC-associated keratins as intermediate filament proteins,
        supporting the mechanistic nosology assignment.

    snippet: >-
      Maternal hyperthermia in early pregnancy is associated with increased risk
      for neural tube defects and may be a human teratogen.
    explanation: >-
      Meta-analysis reporting an ~1.9-fold increased NTD risk with maternal
      hyperthermia in early pregnancy.
treatments:
- name: Periconceptional Folic Acid Supplementation
  description: >-
    Primary prevention: daily periconceptional folic acid (typically 0.4 mg for
    average risk, up to 4 mg for high-risk/prior-NTD pregnancies) markedly
    reduces the occurrence and recurrence of neural tube defects. This is
    preventive, not curative — anencephaly itself has no treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folic acid
      term:
        id: CHEBI:27470
        label: folic acid
  evidence:
  - reference: PMID:1307234
    reference_title: "Prevention of the first occurrence of neural-tube defects by periconceptional vitamin supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Periconceptional vitamin use decreases the incidence of a first
      occurrence of neural-tube defects.
    explanation: >-
      Randomized trial demonstrating periconceptional folic-acid-containing
      supplementation prevents first-occurrence NTDs.
  - reference: PMID:1677062
    reference_title: "Prevention of neural tube defects: results of the Medical Research Council Vitamin Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Folic acid supplementation starting before pregnancy can now be firmly
      recommended for all women who have had an affected pregnancy
    explanation: >-
      The MRC Vitamin Study established a 72% reduction in NTD recurrence with
      periconceptional folic acid.
- name: Palliative and Supportive Care
  description: >-
    Anencephaly is uniformly lethal and has no curative therapy; management is
    comfort/palliative care for liveborn neonates and supportive counseling for
    families, including reproductive counseling.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29205322
    reference_title: "A targeted sequencing panel identifies rare damaging variants in multiple genes in the cranial neural tube defect, anencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neural tube defects (NTDs) affecting the brain (anencephaly) are lethal
      before or at birth
    explanation: >-
      Anencephaly is uniformly lethal before or at birth, so management is
      limited to palliative and supportive care rather than curative therapy.
prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 51.0
  rate_low: 47.0
  rate_high: 55.0
  notes: >-
    Global meta-analysis estimate of 5.1 per 10,000 births (95% CI 4.7-5.5),
    normalized to cases per 100,000. This pooled estimate is higher than the
    3.7 per 10,000 live-birth prevalence reported by Metropolitan Atlanta
    population surveillance. The sources use different geography, eras, and
    pregnancy-outcome ascertainment, so the pooled figure should not be
    interpreted as a uniform country-specific live-birth rate.
  evidence:
  - reference: PMID:36253858
    reference_title: "Global prevalence of congenital anencephaly: a comprehensive systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall estimate of the prevalence, incidence and attenuation of
      anencephaly worldwide were 5.1 per ten thousand births (95% confidence interval
      4.7-5.5 per ten thousand births)
    explanation: >-
      Directly supports the disease-specific worldwide rate and interval,
      replacing an inference from a combined neural-tube-defect prevalence.
- population: Metropolitan Atlanta, United States
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 37.0
  notes: >-
    Population-based surveillance estimate of 3.7 per 10,000 live births for
    1968-2002. This outcome-restricted estimate is presented alongside the
    higher global pooled estimate because national US surveillance found that
    live births represented only 34% of ascertained anencephaly cases and
    warned that live-birth-only surveillance severely underestimates cases.
  evidence:
  - reference: PMID:16950981
    reference_title: "Are encephaloceles neural tube defects?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevalence rates of encephalocele (n = 167), spina bifida (n = 650), and
      anencephaly (n = 431) were 1.4, 5.5, and 3.7 per 10 000 live births,
      respectively.
    explanation: >-
      Directly supports the anencephaly live-birth surveillance rate used for
      comparison with the global pooled estimate.
  - reference: PMID:31580536
    reference_title: "National population-based estimates for major birth defects, 2010-2014."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Live birth cases contributed to only 34% of the anencephaly cases
    explanation: >-
      Supports the explicit caveat that live-birth prevalence omits most
      anencephaly cases captured through broader pregnancy-outcome surveillance.
imaging_findings:
- name: Acrania-exencephaly-anencephaly sequence on prenatal ultrasound
  modality: ULTRASOUND
  imaging_finding_term:
    preferred_term: Absent cranial vault with abnormal or absent cerebral tissue
  located_in:
    preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  phenotype_term:
    preferred_term: Anencephaly
    term:
      id: HP:0002323
      label: Anencephaly
  diagnostic: true
  description: >-
    Prenatal ultrasound demonstrates the acrania-exencephaly-anencephaly
    sequence through loss of the normal cranial contour and progressive
    abnormality or absence of cranial tissue. Quantitative cranial ratios can
    support recognition before 11 weeks, but very early findings require
    confirmation after 11 weeks.
  evidence:
  - reference: PMID:41267385
    reference_title: "Study of Ultrasound Diagnosis of Acrania-Exencephaly-Anencephaly Sequence in Middle First Trimester: A Multicenter Center, Retrospective Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When combined with cranial ultrasound morphological changes, it can accurately diagnose the
      acrania-exencephaly-anencephaly sequence before 11 weeks of gestation. However,
      diagnosis at this stage still requires reconfirmation after 11 weeks
    explanation: >-
      Multicenter human evidence supports early ultrasonographic detection while
      preserving the authors' explicit requirement for later confirmation.
diagnosis:
- name: Prenatal Screening and Imaging
  description: >-
    Anencephaly is detected by elevated maternal serum alpha-fetoprotein,
    elevated amniotic fluid AFP and acetylcholinesterase, and prenatal
    ultrasound demonstrating absence of the cranial vault and cerebral
    hemispheres (often from the late first trimester onward).
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      diagnosis was based on measurement of alphafetoprotein (AFP) concentration
      in the amniotic fluid and maternal blood 8,9, but later technological
      improvements enabled ultrasound to replace AFP measurement as the mainstay
      of prenatal diagnosis
    explanation: >-
      Prenatal diagnosis of open neural tube defects historically relied on
      amniotic-fluid and maternal-serum AFP and is now performed principally by
      ultrasound.
  - reference: PMID:33544785
    reference_title: "The etiopathogenic and morphological spectrum of anencephaly: a comprehensive review of literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Screening tests include maternal serum alpha-fetoprotein level and ultrasound (US) examination.
    explanation: >-
      Disease-specific review confirms the principal biochemical screening and
      imaging modalities for anencephaly.
differential_diagnoses:
- name: Encephalocele
  description: >-
    Herniation of meninges, with or without brain tissue, through a skull
    opening rather than a persistently open cranial neural tube.
  distinguishing_features:
  - Focal herniation through a pathological skull opening
  - Brain or meningeal tissue is exteriorized rather than broadly exposed
  disease_term:
    preferred_term: isolated encephalocele
    term:
      id: MONDO:0016057
      label: isolated encephalocele
  evidence:
  - reference: PMID:24009034
    reference_title: "Neural tube defects--disorders of neurulation and related embryonic processes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      'Herniation' NTDs are those in which meninges, with or without brain or spinal
      cord tissue, become exteriorized through a pathological opening in the skull or
      vertebral column (e.g., encephalocele and meningocele).
    explanation: >-
      Defines the focal herniation morphology that distinguishes encephalocele
      from an open cranial neural-tube defect.
- name: Iniencephaly
  description: >-
    Lethal neural-tube defect dominated by an occipital/cervical defect and
    extreme fixed retroflexion rather than absence of the calvarium and brain.
  distinguishing_features:
  - Extreme retroflexion of the head and short malformed spine
  - Occipital and cervical vertebral defect rather than isolated cranial-vault absence
  disease_term:
    preferred_term: iniencephaly
    term:
      id: MONDO:0018968
      label: iniencephaly
  evidence:
  - reference: PMID:9688130
    reference_title: "Iniencephaly: neuroradiological and surgical features. Case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iniencephaly is a rare congenital anomaly characterized by spina bifida of
      the cervical vertebrae, fixed retroflexion of the head on the cervical spine,
      and occipital bone defect.
    explanation: >-
      Directly supports the occipital, cervical, and fixed-retroflexion features
      that distinguish iniencephaly.
- name: Craniorachischisis
  description: >-
    Continuous failure of closure involving both the cranial and spinal neural
    tube, distinguished from anencephaly without a contiguous open spinal defect.
  distinguishing_features:
  - Cranial defect continues caudally as rachischisis/open spine
  - Involves failure of multiple closure sites rather than the cranial site alone
  disease_term:
    preferred_term: craniorachischisis
    term:
      id: MONDO:0018969
      label: craniorachischisis
  evidence:
  - reference: PMID:38846167
    reference_title: "Craniorachischisis in a 33-week-old Female Fetus: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Craniorachischisis is characterized by anencephaly and an open defect
      extending from the brain to the spine and is the most severe and fatal type
      of neural tube defect.
    explanation: >-
      Directly distinguishes the contiguous craniospinal open defect from an
      isolated cranial defect.
experimental_models:
- name: Human SOSRS brain organoid model of NTD-like apical-constriction failure
  description: >-
    Self-organizing single-rosette spheroids provide a human in-vitro system in
    which valproate exposure or SHROOM3 knockout enlarges the apical lumen and
    cell surface through reduced apical constriction. The model captures a
    closure-relevant cellular readout, but it lacks developmental-axis context
    and does not establish an anencephaly-specific phenotype.
  publication: PMID:37443734
  evidence:
  - reference: PMID:37443734
    reference_title: "A Shared Pathogenic Mechanism for Valproic Acid and SHROOM3 Knockout in a Brain Organoid Model of Neural Tube Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The increased lumen sizes were caused by reduced cell apical constriction suggesting that
      impingement of this process is a shared mechanism for VPA treatment and
      SHROOM3-KO, two well-known causes of NTDs.
    explanation: >-
      Demonstrates a convergent cellular mechanism for a teratogenic exposure
      and genetic perturbation in a human organoid system.
  - reference: PMID:37090564
    reference_title: "A Shared Pathogenic Mechanism for Valproic Acid and SHROOM3 Knockout in a Brain Organoid Model of Neural Tube Defects."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      our current SOSRS methodology has no developmental axis patterning such as
      dorsal-ventral or rostral-caudal.
    explanation: >-
      This is the preprint version of PMID:37443734, not an independent study;
      it is cited only because its accessible full text directly documents the
      published model's missing developmental-axis context.
- name: Surface-ectoderm Rac1 conditional-knockout mouse
  description: >-
    Conditional Rac1 loss in mouse surface ectoderm yields a spectrum including
    open spina bifida, exencephaly/anencephaly, and localized encephalocele. It
    is useful for separating failed-closure phenotypes from post-neurulation
    herniation, but it is not a model of common nonsyndromic human anencephaly.
  publication: PMID:31628096
  evidence:
  - reference: PMID:31628096
    reference_title: "Novel mouse model of encephalocele: post-neurulation origin and relationship to open neural tube defects."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Most mutant fetuses have open
      spina bifida, and some also exhibit exencephaly/anencephaly.
    explanation: >-
      Supports the model's open-NTD phenotype spectrum; classified PARTIAL
      because the experiment was designed primarily as an encephalocele model.
clinical_trials: []
discussions:
- discussion_id: anencephaly_human_model_specificity_gap
  prompt: >-
    Which human in-vitro neurulation readouts predict anencephaly specifically,
    rather than neural-tube defects collectively?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Cranial Neuropore Closure
  rationale: >-
    Current human brain-organoid systems reproduce lumen expansion and
    apical-constriction defects after genetic or teratogenic perturbation, but
    the reported SOSRS system lacks developmental-axis context and reports an
    NTD-like rather than an anencephaly-specific phenotype. Translational
    specificity to human anencephaly therefore remains unresolved.
  evidence:
  - reference: PMID:37443734
    reference_title: "A Shared Pathogenic Mechanism for Valproic Acid and SHROOM3 Knockout in a Brain Organoid Model of Neural Tube Defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our system allows the rapid
      identification of NTD-like phenotypes for both compounds and genetic variants
    explanation: >-
      The authors explicitly describe the readout as NTD-like, supporting the
      open question of whether it is specific to anencephaly.
- discussion_id: anencephaly_residual_folate_resistant_risk_gap
  prompt: >-
    Which genetic and exposure combinations explain anencephaly that occurs
    despite adequate periconceptional folic acid?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Folate One-Carbon Metabolism
  - pathophysiology#Convergent Extension and Neural Plate Morphogenesis Defect
  rationale: >-
    Folic acid prevents many but not all neural-tube defects, while sequencing
    implicates heterogeneous and often oligogenic closure pathways. The relative
    contribution and interaction of folate-resistant mechanisms remain poorly
    quantified in human anencephaly cohorts.
  evidence:
  - reference: PMID:1677062
    reference_title: "Prevention of neural tube defects: results of the Medical Research Council Vitamin Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      27 of these had a known neural tube defect, 6 in the folic
      acid groups and 21 in the two other groups, a 72% protective effect (relative
      risk 0.28, 95% confidence interval 0.12-0.71).
    explanation: >-
      The randomized recurrence trial demonstrates substantial but incomplete
      prevention across neural-tube defects; PARTIAL because it was not powered
      for anencephaly-specific residual mechanisms.

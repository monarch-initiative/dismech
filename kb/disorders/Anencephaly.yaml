      label: exposure to increased temperature
  influences_mechanisms:
  - target: Failure of Cranial Neuropore Closure
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Elevated core temperature in early pregnancy raises neural tube defect
      risk. Recorded as predisposing rather than triggering because the cited
      source states the association firmly but stops short of calling

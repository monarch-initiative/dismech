name: Anencephaly
creation_date: '2026-07-31T00:00:00Z'
category: Complex
description: >-
  Anencephaly is the most severe and one of the most common open neural tube
  defects, characterized by absence of a major portion of the brain, skull
  (calvaria), and scalp. It results from failure of the rostral (cranial)
  neuropore to close during the fourth week of embryogenesis (around days
  24-26 post-conception), leaving the developing forebrain exposed to amniotic
  fluid and progressively destroyed (area cerebrovasculosa). The condition lies
  on a continuum with exencephaly (an earlier developmental stage) and
  craniorachischisis. Anencephaly is uniformly lethal: affected pregnancies end
  in spontaneous abortion or stillbirth, and liveborn infants survive only hours
  to days. It is multifactorial, with periconceptional folate status the major
  modifiable determinant; maternal folic acid supplementation and food
  fortification prevent a large fraction of cases.
disease_term:
  preferred_term: anencephaly
  term:

genetic:
- name: MTHFR
  notes: >-
    The MTHFR c.677C>T (p.Ala222Val) thermolabile polymorphism reduces
    5,10-methylenetetrahydrofolate reductase activity and is a folate-dependent
    maternal/fetal risk factor for neural tube defects including anencephaly.
  gene_term:
    preferred_term: MTHFR
    term:
      id: hgnc:7436
      label: MTHFR
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:25808073
    reference_title: "Association between MTHFR C677T polymorphism and neural tube defect risks: A comprehensive evaluation in three groups of NTD patients, mothers, and fathers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a significant correlation between MTHFR C677T polymorphism and NTD risk was
      found in NTD patients and in their mother
    explanation: >-
      Meta-analysis showing the MTHFR C677T polymorphism is associated with NTD
      risk in affected individuals and their mothers.
- name: VANGL1
  notes: >-
    VANGL1 encodes a core planar cell polarity protein; rare missense variants
    have been identified in patients with neural tube defects, implicating the
    PCP/convergent-extension pathway in human anencephaly.
  gene_term:
    preferred_term: VANGL1
    term:
      id: hgnc:15512
      label: VANGL1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:17409324
    reference_title: "Mutations in VANGL1 associated with neural-tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings implicate VANGL1 as a risk factor in human neural-tube
      defects.
    explanation: >-
      Identifies VANGL1 (a PCP-pathway gene) missense mutations in patients with
      familial and sporadic neural tube defects.
- name: VANGL2
  notes: >-
    VANGL2, another core PCP gene, causes severe neural tube defects including
    craniorachischisis and exencephaly/anencephaly in mutant mice. Its role in
    human anencephaly is inferred from this model-organism evidence and the
    established human relevance of the PCP pathway (e.g. VANGL1); direct human
    genetic evidence for VANGL2 is not yet established here.
  gene_term:
    preferred_term: VANGL2
    term:
      id: hgnc:15511
      label: VANGL2
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of the mouse mutant loop-tail (Vangl2 gene) has shown that
      craniorachischisis, the most severe NTD, results from failure of Closure 1
    explanation: >-
      The Vangl2 loop-tail mouse links PCP-gene disruption to failure of neural
      tube closure and the most severe NTDs.
- name: PAX3
  notes: >-
    PAX3 is required for neural tube and neural crest development; Pax3 mutant
    (Splotch) mice develop cranial NTDs, especially under folate deficiency.
    The link to human anencephaly rests on this model-organism evidence; direct
    human genetic evidence for PAX3 in anencephaly is not yet established here.
  gene_term:
    preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The frequency of cranial NTDs is exacerbated by maternal folate deficiency
      in mutant splotch (Pax3) embryos, whereas wild-type littermates are never
      affected by NTDs
    explanation: >-
      Splotch (Pax3) mutant embryos develop folate-sensitive cranial NTDs,
      implicating PAX3 in cranial neural tube closure.
- name: PDGFRA
  notes: >-
    Targeted exome sequencing of cranial NTD (predominantly anencephaly) cohorts
    has identified rare damaging variants, including a PDGFRA frameshift,
    supporting an oligogenic contribution to anencephaly.
  gene_term:
    preferred_term: PDGFRA
    term:
      id: hgnc:8803
      label: PDGFRA
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:29205322
    reference_title: "A targeted sequencing panel identifies rare damaging variants in multiple genes in the cranial neural tube defect, anencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This included 1 frameshift (PDGFRA)
    explanation: >-
      A 191-gene panel in 90 cranial NTD (85 anencephaly) patients identified a
      rare damaging PDGFRA frameshift variant among candidate anencephaly genes.
environmental:
- name: Maternal Folate Deficiency
  description: >-
    Inadequate periconceptional folate is the strongest modifiable risk factor
    for neural tube defects; folic acid supplementation and food fortification
    substantially reduce anencephaly incidence.
  evidence:
  - reference: PMID:1677062
    reference_title: "Prevention of neural tube defects: results of the Medical Research Council Vitamin Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      supplementation with folic acid (one of the vitamins in the B group) or a
      mixture of seven other vitamins (A,D,B1,B2,B6,C and nicotinamide) around
      the time of conception can prevent neural tube defects (anencephaly, spina
      bifida, encephalocele)
    explanation: >-
      The randomized MRC Vitamin Study established that periconceptional folic
      acid prevents NTDs, implicating folate status as the key modifiable
      determinant.
- name: Maternal Valproate Exposure
  description: >-
    Periconceptional exposure to the antiepileptic valproic acid interferes with
    folate metabolism and histone deacetylation and increases the risk of neural
    tube defects.
  evidence:
  - reference: PMID:16639967
    reference_title: "Major malformations with valproic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has now become evident that valproic acid might cause more than just
      neural tube defects (NTDs).
    explanation: >-
      Systematic review of cohort studies confirms valproic acid is a teratogen
      causing neural tube defects and other major malformations.
- name: Maternal Pregestational Diabetes
  description: >-
    Poorly controlled maternal diabetes mellitus is an established risk factor
    for neural tube defects including anencephaly.
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      factors implicated in the aetiology of NTDs include maternal diabetes
    explanation: >-
      Maternal diabetes is an established environmental risk factor for neural
      tube defects.
- name: Maternal Hyperthermia
  description: >-
    First-trimester maternal hyperthermia (febrile illness, hot tub/sauna) is
    associated with an increased risk of neural tube defects.
  evidence:
  - reference: PMID:15703536
    reference_title: "Maternal hyperthermia and the risk for neural tube defects in offspring: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maternal hyperthermia in early pregnancy is associated with increased risk
      for neural tube defects and may be a human teratogen.
    explanation: >-
      Meta-analysis reporting an ~1.9-fold increased NTD risk with maternal
      hyperthermia in early pregnancy.
treatments:
- name: Periconceptional Folic Acid Supplementation
  description: >-
    Primary prevention: daily periconceptional folic acid (typically 0.4 mg for
    average risk, up to 4 mg for high-risk/prior-NTD pregnancies) markedly
    reduces the occurrence and recurrence of neural tube defects. This is
    preventive, not curative — anencephaly itself has no treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folic acid
      term:
        id: CHEBI:27470
        label: folic acid
  evidence:
  - reference: PMID:1307234
    reference_title: "Prevention of the first occurrence of neural-tube defects by periconceptional vitamin supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Periconceptional vitamin use decreases the incidence of a first
      occurrence of neural-tube defects.
    explanation: >-
      Randomized trial demonstrating periconceptional folic-acid-containing
      supplementation prevents first-occurrence NTDs.
  - reference: PMID:1677062
    reference_title: "Prevention of neural tube defects: results of the Medical Research Council Vitamin Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Folic acid supplementation starting before pregnancy can now be firmly
      recommended for all women who have had an affected pregnancy
    explanation: >-
      The MRC Vitamin Study established a 72% reduction in NTD recurrence with
      periconceptional folic acid.
- name: Palliative and Supportive Care
  description: >-
    Anencephaly is uniformly lethal and has no curative therapy; management is
    comfort/palliative care for liveborn neonates and supportive counseling for
    families, including reproductive counseling.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29205322
    reference_title: "A targeted sequencing panel identifies rare damaging variants in multiple genes in the cranial neural tube defect, anencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neural tube defects (NTDs) affecting the brain (anencephaly) are lethal
      before or at birth
    explanation: >-
      Anencephaly is uniformly lethal before or at birth, so management is
      limited to palliative and supportive care rather than curative therapy.
prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 20.0
  rate_low: 10.0
  rate_high: 30.0
  notes: >-
    Birth prevalence of anencephaly is on the order of 1-3 per 10,000 births
    (roughly half of all neural tube defects), varying by geography, folate
    fortification status, and prenatal ascertainment/termination. NTDs
    collectively occur at 0.5-2 per 1000 pregnancies; observed anencephaly birth
    prevalence is lower because a large fraction of affected pregnancies are
    terminated after prenatal detection.
  evidence:
  - reference: PMID:29205322
    reference_title: "A targeted sequencing panel identifies rare damaging variants in multiple genes in the cranial neural tube defect, anencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      they rank among the most common human birth defects worldwide with a
      prevalence of 0.5 to 2 per 1000 pregnancies
    explanation: >-
      Neural tube defects collectively occur at 0.5-2 per 1000 pregnancies and
      are evenly split between anencephaly and spina bifida, placing anencephaly
      birth prevalence in the 1-5 per 10,000 range (further reduced by prenatal
      termination).
diagnosis:
- name: Prenatal Screening and Imaging
  description: >-
    Anencephaly is detected by elevated maternal serum alpha-fetoprotein,
    elevated amniotic fluid AFP and acetylcholinesterase, and prenatal
    ultrasound demonstrating absence of the cranial vault and cerebral
    hemispheres (often from the late first trimester onward).
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diagnosis was based on measurement of alphafetoprotein (AFP) concentration
      in the amniotic fluid and maternal blood 8,9, but later technological
      improvements enabled ultrasound to replace AFP measurement as the mainstay
      of prenatal diagnosis
    explanation: >-
      Prenatal diagnosis of open neural tube defects historically relied on
      amniotic-fluid and maternal-serum AFP and is now performed principally by
      ultrasound.

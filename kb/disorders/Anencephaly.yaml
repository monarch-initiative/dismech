    snippet: >-
      embryos complete Closure 1 but fail in later neurulation, presenting NTDs
      as separate open lesions of the cranial neural tube (exencephaly,
      progressing to anencephaly)
    explanation: >-
      Exencephaly is the open cranial-neural-tube precursor lesion that
      progresses to anencephaly.

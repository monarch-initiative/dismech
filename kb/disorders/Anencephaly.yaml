- name: Exencephaly
  category: Phenotypic abnormality
  description: >-
    The earlier developmental precursor lesion, in which the disorganized brain
    is exposed but not yet destroyed; it degenerates into anencephaly.
  phenotype_term:
    preferred_term: Exencephaly
    term:
      id: HP:0030769
      label: Exencephaly
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT

  description: >-
    Maternal obesity is a reported risk factor for anencephaly and other neural
    tube defects. Its contribution is recorded as an association rather than a
    sufficient cause in this multifactorial disorder.
  evidence:
  - reference: PMID:33544785
    reference_title: "The etiopathogenic and morphological spectrum of anencephaly: a comprehensive review of literature."

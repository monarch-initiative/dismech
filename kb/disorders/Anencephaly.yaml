    notes: >-
      Congenital malformation of the central nervous system (open cranial neural
      tube defect).
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Multifactorial disorder of development with polygenic/oligogenic
      susceptibility (folate one-carbon metabolism and planar cell polarity
      pathways) interacting with environmental exposures.
references:
- reference: PMID:23790957
  title: 'Neural tube defects: recent advances, unsolved questions, and controversies.'
  findings:
  - statement: >-
      Authoritative review of neural tube defect embryology, genetics (folate
      one-carbon metabolism and planar cell polarity), and prevention.
inheritance:
- name: Multifactorial / polygenic with oligogenic contributions
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Most nonsyndromic anencephaly is sporadic and multifactorial, arising from
    polygenic susceptibility (folate one-carbon metabolism and planar cell
    polarity pathway variants) combined with environmental exposures; targeted
    sequencing supports an additional oligogenic contribution in some cases.
  evidence:
  - reference: PMID:29205322
    reference_title: "A targeted sequencing panel identifies rare damaging variants in multiple genes in the cranial neural tube defect, anencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with evidence for oligogenic inheritance, this study provides new
      information on the possible genetic causation of anencephaly
    explanation: >-
      Rare damaging variants across multiple candidate genes support an
      oligogenic/polygenic model of anencephaly causation.
pathophysiology:
- name: Disrupted Folate One-Carbon Metabolism
  biological_scale: MOLECULAR
  description: >-
    Periconceptional folate status is the strongest modifiable determinant of
    successful neural tube closure. Folate one-carbon metabolism supplies the
    methyl groups and nucleotide precursors required by the rapidly
    proliferating cranial neuroepithelium; reduced
    5,10-methylenetetrahydrofolate reductase (MTHFR) activity and inadequate
    folate availability compromise this supply and increase the risk that the
    cranial neuropore fails to close.
  genes:
  - preferred_term: MTHFR
    term:
      id: hgnc:7436
      label: MTHFR
  biological_processes:
  - preferred_term: tetrahydrofolate interconversion
    term:
      id: GO:0035999
      label: tetrahydrofolate interconversion
    modifier: DECREASED
  evidence:
  - reference: PMID:25808073
    reference_title: "Association between MTHFR C677T polymorphism and neural tube defect risks: A comprehensive evaluation in three groups of NTD patients, mothers, and fathers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a significant correlation between MTHFR C677T polymorphism and NTD risk was
      found in NTD patients and in their mother
    explanation: >-
      Meta-analysis links reduced MTHFR-dependent folate one-carbon metabolism to
      increased neural tube defect risk in affected individuals and their mothers.
  downstream:
  - target: Failure of Cranial Neuropore Closure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired folate one-carbon metabolism compromises the neuroepithelial
      methylation and nucleotide supply required for timely cranial neuropore
      closure; the precise molecular link between folate status and closure
      remains unresolved.
- name: Failure of Cranial Neuropore Closure
  biological_scale: TISSUE
  description: >-
    Primary neurulation requires the flat neural plate to bend, elevate its
    neural folds, and fuse dorsally to form the closed neural tube, a process
    that proceeds by multiple closure initiation sites and zips both rostrally
    and caudally. Anencephaly arises specifically from failure of closure of
    the rostral (anterior/cranial) neuropore, which normally seals by
    approximately embryonic day 24-26. When the cranial neural folds fail to
    appose and fuse, the forebrain neuroepithelium remains open and the future
    cranial vault does not form over it.
  genes:
  - preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  - preferred_term: PDGFRA
    term:
      id: hgnc:8803
      label: PDGFRA
  cell_types:
  - preferred_term: neuroepithelial cell
    term:
      id: CL:0000710
      label: neurecto-epithelial cell
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: neural tube closure
    term:
      id: GO:0001843
      label: neural tube closure
    modifier: DECREASED
  - preferred_term: apical constriction driving neural fold bending
    term:
      id: GO:0003383
      label: apical constriction
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      human brain formation is achieved by neurulation progressing directly
      between Closures 1 and 3, with completion of a single cranial (rostral)
      neuropore
    explanation: >-
      Human cranial neurulation completes at a single rostral neuropore; failure
      of its closure produces anencephaly.
  downstream:
  - target: Exencephaly
    causal_link_type: DIRECT
    description: >-
      The unclosed cranial neural tube remains open, producing exencephaly — the
      exposed, disorganized brain precursor lesion.
  - target: Exposure and Degeneration of Exposed Neural Tissue
    causal_link_type: DIRECT
    description: >-
      Failure of closure leaves the forebrain neuroepithelium exposed to the
      amniotic cavity, initiating its progressive mechanical and chemical
      degeneration.
  - target: Polyhydramnios
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Absence of the forebrain and brainstem impairs fetal swallowing of amniotic
      fluid, producing polyhydramnios.
- name: Convergent Extension and Neural Plate Morphogenesis Defect
  biological_scale: CELLULAR
  description: >-
    Convergent extension movements, governed by the non-canonical Wnt/planar
    cell polarity (PCP) pathway, narrow and lengthen the neural plate and are
    required to bring the neural folds close enough to fuse. Disruption of PCP
    signaling (e.g. VANGL1/VANGL2, CELSR1, SCRIB) broadens the neural plate and
    prevents fold apposition, producing severe open neural tube defects
    including anencephaly and craniorachischisis in model organisms and humans.
  genes:
  - preferred_term: VANGL1
    term:
      id: hgnc:15512
      label: VANGL1
  - preferred_term: VANGL2
    term:
      id: hgnc:15511
      label: VANGL2
  biological_processes:
  - preferred_term: convergent extension in neural plate elongation
    term:
      id: GO:0022007
      label: convergent extension involved in neural plate elongation
    modifier: DECREASED
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      convergent extension cell movements are dependent on non-canonical Wnt
      signalling: the planar cell polarity (PCP) pathway
    explanation: >-
      Neural plate narrowing/elongation (convergent extension) is driven by PCP
      signaling; its disruption prevents neural fold apposition and closure.
  downstream:
  - target: Failure of Cranial Neuropore Closure
    causal_link_type: DIRECT
    description: >-
      Defective convergent extension leaves the neural plate too broad for the
      cranial neural folds to appose and fuse, causing failure of rostral
      neuropore closure.
- name: Exposure and Degeneration of Exposed Neural Tissue
  biological_scale: TISSUE
  description: >-
    Following failed closure, the exposed forebrain (initially exencephaly)
    undergoes progressive mechanical and chemical degeneration on contact with
    amniotic fluid, leaving a hemorrhagic, poorly differentiated vascular mass
    (area cerebrovasculosa) in place of the cerebral hemispheres. The absence of
    a normal brain also disrupts induction of the overlying skull and scalp.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: cranium
    term:
      id: UBERON:0003128
      label: cranium
  - preferred_term: scalp
    term:
      id: UBERON:0000403
      label: scalp
  biological_processes:
  - preferred_term: forebrain development
    term:
      id: GO:0030900
      label: forebrain development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presenting NTDs as separate open lesions of the cranial neural tube
      (exencephaly, progressing to anencephaly)
    explanation: >-
      Anencephaly develops when the open cranial neural tube (exencephaly)
      degenerates, confirming the exencephaly-to-anencephaly progression.
  downstream:
  - target: Anencephaly
    causal_link_type: DIRECT
    description: >-
      Progressive destruction of the exposed forebrain leaves the area
      cerebrovasculosa in place of the cerebral hemispheres — anencephaly.
  - target: Absent Calvaria
    causal_link_type: DIRECT
    description: >-
      Absence of the underlying brain and failure of the overlying cranial vault
      to form produce acrania (absent calvaria).
  - target: Adrenal Hypoplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the forebrain and hypothalamic-pituitary axis removes trophic ACTH
      drive to the fetal adrenal cortex, producing adrenal hypoplasia.

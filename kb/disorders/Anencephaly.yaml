name: Anencephaly
creation_date: '2026-07-31T00:00:00Z'
category: Complex
description: >-
  Anencephaly is the most severe and one of the most common open neural tube
  defects, characterized by absence of a major portion of the brain, skull
  (calvaria), and scalp. It results from failure of the rostral (cranial)
  neuropore to close during the fourth week of embryogenesis (around days
  24-26 post-conception), leaving the developing forebrain exposed to amniotic
  fluid and progressively destroyed (area cerebrovasculosa). The condition lies
  on a continuum with exencephaly (an earlier developmental stage) and
  craniorachischisis. Anencephaly is uniformly lethal: affected pregnancies end
  in spontaneous abortion or stillbirth, and liveborn infants survive only hours
  to days. It is multifactorial, with periconceptional folate status the major
  modifiable determinant; maternal folic acid supplementation and food
  fortification prevent a large fraction of cases.
disease_term:
  preferred_term: anencephaly
  term:
    id: MONDO:0000819
    label: anencephaly
synonyms:
- anencephalus
- aprosencephaly with open cranium
parents:
- Neural Tube Defect
references:
- reference: PMID:23790957
  title: 'Neural tube defects: recent advances, unsolved questions, and controversies.'
  findings:
  - statement: >-
      Authoritative review of neural tube defect embryology, genetics (folate
      one-carbon metabolism and planar cell polarity), and prevention.
inheritance:
- name: Multifactorial / polygenic with oligogenic contributions
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Most nonsyndromic anencephaly is sporadic and multifactorial, arising from
    polygenic susceptibility (folate one-carbon metabolism and planar cell
    polarity pathway variants) combined with environmental exposures; targeted
    sequencing supports an additional oligogenic contribution in some cases.
  evidence:
  - reference: PMID:29205322
    reference_title: "A targeted sequencing panel identifies rare damaging variants in multiple genes in the cranial neural tube defect, anencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this study provides new information on the possible genetic causation of
      anencephaly
    explanation: >-
      Rare damaging variants across multiple candidate genes support an
      oligogenic/polygenic model of anencephaly causation.
pathophysiology:
- name: Failure of Cranial Neuropore Closure
  biological_scale: TISSUE
  description: >-
    Primary neurulation requires the flat neural plate to bend, elevate its
    neural folds, and fuse dorsally to form the closed neural tube, a process
    that proceeds by multiple closure initiation sites and zips both rostrally
    and caudally. Anencephaly arises specifically from failure of closure of
    the rostral (anterior/cranial) neuropore, which normally seals by
    approximately embryonic day 24-26. When the cranial neural folds fail to
    appose and fuse, the forebrain neuroepithelium remains open and the future
    cranial vault does not form over it.
  cell_types:
  - preferred_term: neuroepithelial cell
    term:
      id: CL:0000710
      label: neurecto-epithelial cell
  biological_processes:
  - preferred_term: neural tube closure
    term:
      id: GO:0001843
      label: neural tube closure
    modifier: DECREASED
  - preferred_term: apical constriction driving neural fold bending
    term:
      id: GO:0003383
      label: apical constriction
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      human brain formation is achieved by neurulation progressing directly
      between Closures 1 and 3, with completion of a single cranial (rostral)
      neuropore
    explanation: >-
      Human cranial neurulation completes at a single rostral neuropore; failure
      of its closure produces anencephaly.
- name: Convergent Extension and Neural Plate Morphogenesis Defect
  biological_scale: CELLULAR
  description: >-
    Convergent extension movements, governed by the non-canonical Wnt/planar
    cell polarity (PCP) pathway, narrow and lengthen the neural plate and are
    required to bring the neural folds close enough to fuse. Disruption of PCP
    signaling (e.g. VANGL1/VANGL2, CELSR1, SCRIB) broadens the neural plate and
    prevents fold apposition, producing severe open neural tube defects
    including anencephaly and craniorachischisis in model organisms and humans.
  biological_processes:
  - preferred_term: convergent extension in neural plate elongation
    term:
      id: GO:0022007
      label: convergent extension involved in neural plate elongation
    modifier: DECREASED
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      convergent extension cell movements are dependent on non-canonical Wnt
      signalling: the planar cell polarity (PCP) pathway
    explanation: >-
      Neural plate narrowing/elongation (convergent extension) is driven by PCP
      signaling; its disruption prevents neural fold apposition and closure.
- name: Exposure and Degeneration of Exposed Neural Tissue
  biological_scale: TISSUE
  description: >-
    Following failed closure, the exposed forebrain (initially exencephaly)
    undergoes progressive mechanical and chemical degeneration on contact with
    amniotic fluid, leaving a hemorrhagic, poorly differentiated vascular mass
    (area cerebrovasculosa) in place of the cerebral hemispheres. The absence of
    a normal brain also disrupts induction of the overlying skull and scalp.
  biological_processes:
  - preferred_term: forebrain development
    term:
      id: GO:0030900
      label: forebrain development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presenting NTDs as separate open lesions of the cranial neural tube
      (exencephaly, progressing to anencephaly)
    explanation: >-
      Anencephaly develops when the open cranial neural tube (exencephaly)
      degenerates, confirming the exencephaly-to-anencephaly progression.
phenotypes:
- name: Anencephaly
  category: Phenotypic abnormality
  description: >-
    Absence of the major portion of the brain, skull, and scalp, the defining
    feature of the disorder.
  phenotype_term:
    preferred_term: Anencephaly
    term:
      id: HP:0002323
      label: Anencephaly
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:17409324
    reference_title: "Mutations in VANGL1 associated with neural-tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neural-tube defects such as anencephaly and spina bifida constitute a
      group of common congenital malformations caused by complex genetic and
      environmental factors.
    explanation: >-
      Establishes anencephaly as a common open neural tube defect of
      multifactorial (genetic and environmental) origin.
- name: Exencephaly
  category: Phenotypic abnormality
  description: >-
    The earlier developmental precursor lesion, in which the disorganized brain
    is exposed but not yet destroyed; it degenerates into anencephaly.
  phenotype_term:
    preferred_term: Exencephaly
    term:
      id: HP:0030769
      label: Exencephaly
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      embryos complete Closure 1 but fail in later neurulation, presenting NTDs
      as separate open lesions of the cranial neural tube (exencephaly,
      progressing to anencephaly)
    explanation: >-
      Exencephaly is the open cranial-neural-tube precursor lesion that
      progresses to anencephaly.
- name: Absent Calvaria
  category: Phenotypic abnormality
  description: >-
    Absence of the cranial vault (acrania), leaving the brain uncovered.
  phenotype_term:
    preferred_term: Neural tube defect
    term:
      id: HP:0045005
      label: Neural tube defect
- name: Polyhydramnios
  category: Phenotypic abnormality
  description: >-
    Excess amniotic fluid, attributed to impaired fetal swallowing, frequently
    complicates anencephalic pregnancies.
  phenotype_term:
    preferred_term: Polyhydramnios
    term:
      id: HP:0001561
      label: Polyhydramnios
  frequency: OCCASIONAL
- name: Adrenal Hypoplasia
  category: Phenotypic abnormality
  description: >-
    Fetal adrenal hypoplasia occurs secondary to absent hypothalamic-pituitary
    drive (absent forebrain/pituitary axis).
  phenotype_term:
    preferred_term: Adrenal hypoplasia
    term:
      id: HP:0000835
      label: Adrenal hypoplasia
genetic:
- name: MTHFR
  notes: >-
    The MTHFR c.677C>T (p.Ala222Val) thermolabile polymorphism reduces
    5,10-methylenetetrahydrofolate reductase activity and is a folate-dependent
    maternal/fetal risk factor for neural tube defects including anencephaly.
  gene_term:
    preferred_term: MTHFR
    term:
      id: hgnc:7436
      label: MTHFR
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:25808073
    reference_title: "Association between MTHFR C677T polymorphism and neural tube defect risks: A comprehensive evaluation in three groups of NTD patients, mothers, and fathers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The C677T polymorphism in the methylenetetrahydrofolate reductase
    explanation: >-
      Meta-analysis showing the MTHFR C677T polymorphism is associated with NTD
      risk in affected individuals and their mothers.
- name: VANGL1
  notes: >-
    VANGL1 encodes a core planar cell polarity protein; rare missense variants
    have been identified in patients with neural tube defects, implicating the
    PCP/convergent-extension pathway in human anencephaly.
  gene_term:
    preferred_term: VANGL1
    term:
      id: hgnc:15512
      label: VANGL1
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:17409324
    reference_title: "Mutations in VANGL1 associated with neural-tube defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings implicate VANGL1 as a risk factor in human neural-tube
      defects.
    explanation: >-
      Identifies VANGL1 (a PCP-pathway gene) missense mutations in patients with
      familial and sporadic neural tube defects.
- name: VANGL2
  notes: >-
    VANGL2, another core PCP gene, causes severe neural tube defects including
    craniorachischisis and exencephaly/anencephaly in mutant mice and has been
    implicated by rare variants in human NTDs.
  gene_term:
    preferred_term: VANGL2
    term:
      id: hgnc:15511
      label: VANGL2
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of the mouse mutant loop-tail (Vangl2 gene) has shown that
      craniorachischisis, the most severe NTD, results from failure of Closure 1
    explanation: >-
      The Vangl2 loop-tail mouse links PCP-gene disruption to failure of neural
      tube closure and the most severe NTDs.
- name: PAX3
  notes: >-
    PAX3 is required for neural tube and neural crest development; Pax3 mutant
    (Splotch) mice develop cranial NTDs, especially under folate deficiency,
    linking PAX3 to neural tube closure.
  gene_term:
    preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The frequency of cranial NTDs is exacerbated by maternal folate deficiency
      in mutant splotch (Pax3) embryos, whereas wild-type littermates are never
      affected by NTDs
    explanation: >-
      Splotch (Pax3) mutant embryos develop folate-sensitive cranial NTDs,
      implicating PAX3 in cranial neural tube closure.
- name: PDGFRA
  notes: >-
    Targeted exome sequencing of cranial NTD (predominantly anencephaly) cohorts
    has identified rare damaging variants, including a PDGFRA frameshift,
    supporting an oligogenic contribution to anencephaly.
  gene_term:
    preferred_term: PDGFRA
    term:
      id: hgnc:8803
      label: PDGFRA
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:29205322
    reference_title: "A targeted sequencing panel identifies rare damaging variants in multiple genes in the cranial neural tube defect, anencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This included 1 frameshift (PDGFRA)
    explanation: >-
      A 191-gene panel in 90 cranial NTD (85 anencephaly) patients identified a
      rare damaging PDGFRA frameshift variant among candidate anencephaly genes.
environmental:
- name: Maternal Folate Deficiency
  description: >-
    Inadequate periconceptional folate is the strongest modifiable risk factor
    for neural tube defects; folic acid supplementation and food fortification
    substantially reduce anencephaly incidence.
  evidence:
  - reference: PMID:1677062
    reference_title: "Prevention of neural tube defects: results of the Medical Research Council Vitamin Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      supplementation with folic acid (one of the vitamins in the B group) or a
      mixture of seven other vitamins (A,D,B1,B2,B6,C and nicotinamide) around
      the time of conception can prevent neural tube defects (anencephaly, spina
      bifida, encephalocele)
    explanation: >-
      The randomized MRC Vitamin Study established that periconceptional folic
      acid prevents NTDs, implicating folate status as the key modifiable
      determinant.
- name: Maternal Valproate Exposure
  description: >-
    Periconceptional exposure to the antiepileptic valproic acid interferes with
    folate metabolism and histone deacetylation and increases the risk of neural
    tube defects.
  evidence:
  - reference: PMID:16639967
    reference_title: "Major malformations with valproic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has now become evident that valproic acid might cause more than just
      neural tube defects (NTDs).
    explanation: >-
      Systematic review of cohort studies confirms valproic acid is a
      dose-dependent teratogen causing neural tube defects.
- name: Maternal Pregestational Diabetes
  description: >-
    Poorly controlled maternal diabetes mellitus is an established risk factor
    for neural tube defects including anencephaly.
  evidence:
  - reference: PMID:23790957
    reference_title: "Neural tube defects: recent advances, unsolved questions, and controversies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      factors implicated in the aetiology of NTDs include maternal diabetes
    explanation: >-
      Maternal diabetes is an established environmental risk factor for neural
      tube defects.
- name: Maternal Hyperthermia
  description: >-
    First-trimester maternal hyperthermia (febrile illness, hot tub/sauna) is
    associated with an increased risk of neural tube defects.
  evidence:
  - reference: PMID:15703536
    reference_title: "Maternal hyperthermia and the risk for neural tube defects in offspring: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maternal hyperthermia in early pregnancy is associated with increased risk
      for neural tube defects and may be a human teratogen.
    explanation: >-
      Meta-analysis reporting an ~1.9-fold increased NTD risk with maternal
      hyperthermia in early pregnancy.
treatments:
- name: Periconceptional Folic Acid Supplementation
  description: >-
    Primary prevention: daily periconceptional folic acid (typically 0.4 mg for
    average risk, up to 4 mg for high-risk/prior-NTD pregnancies) markedly
    reduces the occurrence and recurrence of neural tube defects. This is
    preventive, not curative — anencephaly itself has no treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folic acid
      term:
        id: CHEBI:27470
        label: folic acid
  evidence:
  - reference: PMID:1307234
    reference_title: "Prevention of the first occurrence of neural-tube defects by periconceptional vitamin supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Periconceptional vitamin use decreases the incidence of a first
      occurrence of neural-tube defects.
    explanation: >-
      Randomized trial demonstrating periconceptional folic-acid-containing
      supplementation prevents first-occurrence NTDs.
  - reference: PMID:1677062
    reference_title: "Prevention of neural tube defects: results of the Medical Research Council Vitamin Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Folic acid supplementation starting before pregnancy can now be firmly
      recommended for all women who have had an affected pregnancy
    explanation: >-
      The MRC Vitamin Study established a 72% reduction in NTD recurrence with
      periconceptional folic acid.
- name: Palliative and Supportive Care
  description: >-
    Anencephaly is uniformly lethal and has no curative therapy; management is
    comfort/palliative care for liveborn neonates and supportive counseling for
    families, including reproductive counseling.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 10.0
  notes: >-
    Birth prevalence of anencephaly is on the order of ~1 per 1,000-10,000
    births, varying by geography, folate fortification status, and prenatal
    ascertainment/termination.
diagnosis:
- name: Prenatal Screening and Imaging
  description: >-
    Anencephaly is detected by elevated maternal serum alpha-fetoprotein,
    elevated amniotic fluid AFP and acetylcholinesterase, and prenatal
    ultrasound demonstrating absence of the cranial vault and cerebral
    hemispheres (often from the late first trimester onward).

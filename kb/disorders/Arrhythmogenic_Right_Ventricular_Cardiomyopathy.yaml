progression:
- phase: Concealed stage
  notes: >-
    Structural disease may be absent or minimal, but sudden cardiac death can
    occur. The four reported stages do not necessarily proceed sequentially.
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AC can present in four clinical stages which do not necessarily proceed
      from one into the other: 1) concealed stage without or with minimal
      structural disease, although SCD may occur, 2) overt stage with structural
      alterations of primarily the right ventricle, and episodes of monomorphic
      VT, 3) overt stage with obvious structural biventricular involvement, and
      4) the end-stage of the disease with heart failure [1, 26, 27].
    explanation: >-
      This directly defines the concealed stage and cautions against assuming a
      fixed sequential course.
- phase: Overt right-ventricular stage
  notes: >-
    Structural abnormalities predominantly affect the right ventricle and are
    accompanied by episodes of monomorphic ventricular tachycardia.
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AC can present in four clinical stages which do not necessarily proceed
      from one into the other: 1) concealed stage without or with minimal
      structural disease, although SCD may occur, 2) overt stage with structural
      alterations of primarily the right ventricle, and episodes of monomorphic
      VT, 3) overt stage with obvious structural biventricular involvement, and
      4) the end-stage of the disease with heart failure [1, 26, 27].
    explanation: >-
      This directly defines the overt stage dominated by right-ventricular
      structural disease and monomorphic VT.
- phase: Overt biventricular stage
  notes: >-
    More extensive disease has obvious structural involvement of both
    ventricles.
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AC can present in four clinical stages which do not necessarily proceed
      from one into the other: 1) concealed stage without or with minimal
      structural disease, although SCD may occur, 2) overt stage with structural
      alterations of primarily the right ventricle, and episodes of monomorphic
      VT, 3) overt stage with obvious structural biventricular involvement, and
      4) the end-stage of the disease with heart failure [1, 26, 27].
    explanation: >-
      This directly identifies a clinically overt biventricular stage.
- phase: End-stage heart failure
  notes: >-
    Advanced ventricular dysfunction can culminate in heart failure.
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk

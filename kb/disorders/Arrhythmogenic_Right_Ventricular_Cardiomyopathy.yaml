    - reference: PMID:18662195
      reference_title: >-
        Abnormal connexin43 in arrhythmogenic right ventricular cardiomyopathy
        caused by plakophilin-2 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Areas of slow conduction are one predisposing factor for re-entrant
        ventricular arrhythmias, which are seen in this disease and responsible
        in this patient group for sudden cardiac death.
      explanation: >-
        Human ARVC data link slow-conduction reentry to sudden cardiac death.
  - target: Epsilon wave
    description: >-
      Delayed terminal right-ventricular activation can appear as an epsilon
      wave on the surface ECG.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Delayed terminal activation of right-ventricular myocardium
    evidence:
    - reference: PMID:18662195
      reference_title: >-
        Abnormal connexin43 in arrhythmogenic right ventricular cardiomyopathy
        caused by plakophilin-2 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient 3 showed epsilon waves, while Patients 1 and 2 were found to
        have late potentials on signal-averaged ECG, reflecting slow electrical
        conduction over the anterior right ventricle.
      explanation: >-
        The patient series relates epsilon waves and late potentials to slow
        right-ventricular conduction.
  - target: T-wave inversion
    description: >-
      Right-precordial T-wave inversion is a repolarization manifestation of
      diseased right-ventricular myocardium, but its precise causal bridge from
      the slow-conduction substrate is not fully resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24817548
      reference_title: >-
        Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
        management.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Inverted T waves in right precordial leads (V1, V2, V3) or beyond in
        individuals >14 years of age
      explanation: >-
        The Task Force criteria establish the ECG manifestation; the
        mechanistic intermediates linking it to the substrate remain uncertain.
- name: Progressive ventricular contractile dysfunction
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss and replacement of contractile myocardium impair right-ventricular and
    sometimes left-ventricular function, producing chamber remodeling and
    eventual heart failure.
  locations:
  - preferred_term: heart right ventricle
    term:
      id: UBERON:0002080
      label: heart right ventricle
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AC can present in four clinical stages which do not necessarily proceed
      from one into the other: 1) concealed stage without or with minimal
      structural disease, although SCD may occur, 2) overt stage with structural
      alterations of primarily the right ventricle, and episodes of monomorphic
      VT, 3) overt stage with obvious structural biventricular involvement, and
      4) the end-stage of the disease with heart failure [1, 26, 27].
    explanation: >-
      The clinical staging evidence supports progression from ventricular
      structural involvement to biventricular disease and end-stage failure.
  downstream:
  - target: Right ventricular dilatation
    description: >-
      Loss of contractile myocardium and adverse remodeling enlarge the right
      ventricular chamber.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of functional myocardium and adverse chamber remodeling
    evidence:
    - reference: PMID:24817548
      reference_title: >-
        Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
        management.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ratio of RVEDV to BSA ≥110 mL/m2 (male) or ≥100 mL/m2 (female), or RV
        ejection fraction ≤40 %
      explanation: >-
        The MRI major criterion jointly captures increased right-ventricular
        end-diastolic volume and reduced ejection fraction.
  - target: Congestive heart failure
    description: >-
      Advanced ventricular pump dysfunction culminates in symptomatic heart
      failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced cardiac output and systemic or pulmonary venous congestion
    evidence:
    - reference: PMID:24817548
      reference_title: >-
        Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
        management.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the end-stage of the disease with heart failure
      explanation: >-
        This directly identifies heart failure as the end-stage clinical
        consequence.

  evidence:
  - reference: PMID:18662195
    reference_title: >-
      Abnormal connexin43 in arrhythmogenic right ventricular cardiomyopathy
      caused by plakophilin-2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reduced connexin43 expression and localization to the intercalated disk
      occurs in heterozygous human PKP-2 mutations, potentially explaining the
      delayed conduction and propensity to develop arrhythmias seen in this
      disease.
    explanation: >-
      Human myocardial tissue directly demonstrates connexin43 remodeling in
      heterozygous PKP2-related ARVC.
  downstream:
  - target: Arrhythmogenic slow-conduction substrate
    description: >-
      Electrical uncoupling and reduced sodium current create slow,
      heterogeneous activation that predisposes to ventricular tachyarrhythmia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24817548
      reference_title: >-
        Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
        management.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These alterations give rise to electrical cell-cell uncoupling and slow
        conduction, respectively, thereby providing a substrate for early
        activation delay resulting in ventricular tachyarrhythmia, a hallmark
        of AC [5, 12, 46, 47].
      explanation: >-
        The review explicitly links intercalated-disc electrical remodeling to
        slow conduction and the ventricular tachyarrhythmia substrate.

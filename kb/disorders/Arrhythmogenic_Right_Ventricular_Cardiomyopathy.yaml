mechanistic_hypotheses:
- hypothesis_group_id: anti_dsg2_causal_injury_driver_or_amplifier
  hypothesis_label: Anti-DSG2 Causal Injury Driver or Amplifier
  status: EMERGING
  description: >-
    Anti-DSG2 antibodies may causally worsen genetically vulnerable myocardium
    either as antecedent drivers or as injury-dependent amplifiers. Candidate
    mechanisms are direct impairment of junctional adhesion or electrical
    coupling and Fc-receptor- or complement-dependent injury. A signal that
    merely follows tissue damage without antigen-specific functional activity
    is the null, biomarker-only alternative and refutes this causal hypothesis.
    DAMP-mediated innate activation remains a separately tested possible
    upstream or parallel branch rather than a presumed linear cascade. Current
    evidence does not warrant wiring this emerging hypothesis to a causal
    pathophysiology edge, defining a clinical biomarker, or proposing an
    immune-directed treatment.
  evidence:
  - reference: PMID:42406223
    reference_title: >-
      From inflammation to inheritance: rethinking myocarditis as the first
      signal of desmosomal cardiomyopathy.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      While these observations support a possible role for autoimmunity, the
      causal contribution of these autoantibodies to myocardial injury and
      disease progression remains incompletely established and constitutes a
      proposed rather than confirmed model.
    explanation: >-
      The seed narrative review explicitly identifies the causal autoimmune
      interpretation as a working model while emphasizing that it remains
      unconfirmed. This supports testing an emerging causal hypothesis, not
      treating an injury-associated antibody signal as part of that hypothesis.
  - reference: PMID:30239670
    reference_title: >-
      An autoantibody identifies arrhythmogenic right ventricular
      cardiomyopathy and participates in its pathogenesis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified anti-DSG2 antibodies in 12/12 and 25/25 definite ARVC
      cohorts and 7/8 borderline subjects.
    explanation: >-
      The original small discovery and validation cohorts support antibody
      occurrence in clinically defined ARVC. The study lacked myocarditis and
      inflammatory-cardiomyopathy comparators, so these case-control results do
      not establish disease specificity, temporal order, or causality.
  - reference: PMID:30239670
    reference_title: >-
      An autoantibody identifies arrhythmogenic right ventricular
      cardiomyopathy and participates in its pathogenesis.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      antibodies caused gap junction dysfunction, a common feature of ARVC, in
      vitro.
    explanation: >-
      Purified IgG from two ARVC patients and a commercial anti-DSG2 antibody
      provide an initial functional signal in human iPSC-derived
      cardiomyocytes. The experiment did not use antigen-specific depletion and
      add-back for patient IgG or establish Fc or complement dependence,
      necessity, or sufficiency in vivo.
  - reference: PMID:41351822
    reference_title: >-
      Anti-desmoglein-2 autoantibodies do not discriminate between UK boxer
      dogs with and without arrhythmogenic right ventricular cardiomyopathy.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Serum anti-DSG2 autoantibodies were detected in all dogs, bar one healthy
      dog.
    explanation: >-
      In an independent 40-Boxer cohort, anti-DSG2 was nearly ubiquitous across
      healthy, preclinical-ARVC, and clinical-ARVC groups. This fails to
      reproduce the original Boxer-model disease-specificity anchor. It does
      not by itself exclude a pathogenic human antibody subset or an
      injury-dependent amplifier, but directly refutes using Boxer seropositivity
      as evidence that anti-DSG2 distinguishes affected from unaffected animals.
  - reference: PMID:42160918
    reference_title: >-
      Evaluation of anti-desmoglein-2 antibodies and cardiac biomarkers in
      Boxer dogs with arrhythmogenic right ventricular cardiomyopathy.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Anti-desmoglein-2 antibody concentrations did not differ between groups by
      either method (enzyme-linked immunosorbent assay: P=0.687; Western blot:
      P=0.293).
    explanation: >-
      A separate prospective study of 28 affected and 24 screened-control
      Boxers found poor anti-DSG2 discrimination by ELISA and Western blot,
      while troponin and NT-proBNP performed substantially better and tracked
      ventricular premature-complex burden. This independently refutes the
      model-specific diagnostic premise and favors conventional injury or
      dysfunction markers, while remaining non-decisive about a causal human
      antibody subset.
  - reference: PMID:37450050
    reference_title: >-
      Catalytic antibodies in arrhythmogenic cardiomyopathy patients cleave
      desmoglein 2 and N-cadherin and impair cardiomyocyte cohesion.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IgG fractions were purified from 15 AC patients and 4 healthy controls.
    explanation: >-
      The donor series was small, comprised only DSP- or PKP2-variant
      arrhythmogenic cardiomyopathy cases, and pooled IgG from four healthy
      controls. It included no inflammatory cardiac comparator, serial samples,
      or clinical test of whether the activity preceded injury.
  - reference: PMID:37450050
    reference_title: >-
      Catalytic antibodies in arrhythmogenic cardiomyopathy patients cleave
      desmoglein 2 and N-cadherin and impair cardiomyocyte cohesion.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Immunostainings revealed that autoantibodies against ICD proteins are
      prevalent in AC and most autoantibody fractions have catalytic properties
      and cleave the ICD adhesion molecules DSG2 and N-cadherin, thereby
      reducing cadherin interactions as revealed by AFM.
    explanation: >-
      In biochemical and murine atrial cell-line assays, 11 of 15 IgG fractions
      cleaved recombinant DSG2, six reduced cellular cohesion, and p38
      inhibition rescued cohesion for selected fractions. The fractions also
      targeted N-cadherin, the study could not detect anti-DSG2 binding by its
      ELISAs, and it used no antigen-specific adsorption, monoclonal
      reconstruction, or intact-animal transfer.
  - reference: PMID:42219531
    reference_title: >-
      Autoantibodies in Patients With Arrhythmogenic Cardiomyopathy Activate
      GSK-3β, Resulting in a Loss of Cardiomyocyte Cohesion.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Three out of six ACM patients derived IgGs that reduced cardiomyocyte
      cohesion.
    explanation: >-
      Total polyclonal IgG from only half of the six broader arrhythmogenic
      cardiomyopathy donors reduced cohesion in cell and tissue assays, and
      healthy-relative IgG also stained intercalated discs. GSK-3β inhibition
      rescued the responder-IgG phenotype, but the study did not use
      DSG2-specific depletion and add-back, a sequence-defined monoclonal,
      epitope rescue, or intact-animal transfer. It therefore supports a
      reproducible functional signal in a subset, not an anti-DSG2-specific
      causal axis or a treatment claim.
  - reference: PMID:39597880
    reference_title: >-
      Prevalence and Correlates of Anti-DSG2 Antibodies in Arrhythmogenic Right
      Ventricular Cardiomyopathy and Myocarditis: Immunological Insights from a
      Multicenter Study.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-DSG2-ab titer was not different between ARVC and myocarditis/DCM
      patients (48% anti-DSG-ab positive).
    explanation: >-
      In 77 ARVC cases, 91 myocarditis or DCM cases, 27 systemic
      immune-mediated disease cases, and 50 controls, 56% of ARVC cases were
      positive, but titers did not distinguish ARVC from myocarditis or DCM and
      anti-DSG2 positivity had no ARVC clinical correlates. This argues against
      treating the antibody as ARVC-specific or as an established mediator.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13256025/fullTextXML
    reference_title: >-
      Clinical value of anti-desmoglein-2 antibodies in arrhythmogenic right
      ventricular cardiomyopathy: real-world evidence.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-DSG2 antibody levels were not associated with major arrhythmic
      events.
    explanation: >-
      In 101 definite ARVC cases, antibody levels separated cases from 37
      selected Ebstein-anomaly or Eisenmenger-syndrome controls and 31 healthy
      controls. A separately derived higher threshold correlated with cardiac
      death or transplantation but not arrhythmic events. The single-centre
      study lacked longitudinal antibody measurements and myocarditis or DCM
      comparators, so its favorable internally derived cutoffs do not reverse
      the comparator-rich PMID:39597880 finding or establish temporal order,
      disease specificity, or causality.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13256025/fullTextXML
    reference_title: >-
      Clinical value of anti-desmoglein-2 antibodies in arrhythmogenic right
      ventricular cardiomyopathy: real-world evidence.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As comparisons were limited to right ventricular disease controls,
      diagnostic specificity relative to other non-ischaemic cardiomyopathies
      more commonly entering the ARVC remains to be established.
    explanation: >-
      The investigators explicitly bound their specificity claim to the
      selected comparison set. This supports testing antibody utility in
      harmonized, prospectively thresholded cohorts that include myocarditis,
      DCM, and other non-ischaemic cardiomyopathies rather than treating the
      internally estimated specificity as a general ARVC property.
  - reference: PMID:32114801
    reference_title: >-
      Evidence From Family Studies for Autoimmunity in Arrhythmogenic Right
      Ventricular Cardiomyopathy: Associations of Circulating Anti-Heart and
      Anti-Intercalated Disk Autoantibodies With Disease Severity and Family
      History.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Longitudinal studies are needed to clarify whether they may predict ARVC
      development in healthy relatives or if they be a result of manifest
      ARVC.
    explanation: >-
      Anti-heart and anti-intercalated-disc antibodies were enriched in ARVC
      families and associated cross-sectionally with severity features, but the
      investigators explicitly could not distinguish antecedent autoimmunity
      from a response to manifest disease.
  - reference: PMID:35764120
    reference_title: High frequency of anti-DSG 2 antibodies in post COVID-19 serum samples.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, 29.3% of the post COVID-19 infection samples demonstrated a
      signal higher than the 90th percentile of the control population and
      8.7% were higher than the median found in ARVC patients.
    explanation: >-
      Sustained anti-DSG2 signals after COVID-19 show that antibody elevation
      can follow a non-ARVC inflammatory or injury context. The study did not
      phenotype cardiac injury deeply, so it establishes neither a common
      mechanism nor harmlessness, but materially weakens disease specificity.
  - reference: PMID:19635863
    reference_title: >-
      Myocyte necrosis underlies progressive myocardial dystrophy in mouse
      dsg2-related arrhythmogenic right ventricular cardiomyopathy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate for the first time that myocyte necrosis is the key
      initiator of myocardial injury, triggering progressive myocardial damage,
      including an inflammatory response and massive calcification within the
      myocardium, followed by injury repair with fibrous tissue replacement,
      and myocardial atrophy.
    explanation: >-
      A transgenic Dsg2 model supports primary structural injury followed by
      inflammation and fibrosis. It does not test DAMP necessity or
      autoantibodies, and therefore supports a plausible injury-first branch
      without establishing the proposed adaptive immune sequence in humans.

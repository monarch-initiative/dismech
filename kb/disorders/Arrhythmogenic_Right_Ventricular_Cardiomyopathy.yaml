experimental_models:
- name: Heterozygous plakoglobin-deficient (plakoglobin+/-) mouse
  description: >-
    Mice heterozygous for a plakoglobin (Jup) null allele, modelling the
    desmosomal haploinsufficiency mechanism of ARVC. By ten months they show
    increased right-ventricular volume, reduced right-ventricular function and
    spontaneous ventricular ectopy with preserved left-ventricular size and
    function, and isolated perfused hearts show ventricular tachycardia of
    right-ventricular origin with prolonged right-ventricular conduction times.
    The model is the principal in vivo demonstration that endurance training
    accelerates the ARVC phenotype on a desmosomal-deficiency background, which
    is why it anchors the exercise exposure edge in this entry. Important scope
    limit: histology and electron microscopy did not identify right-ventricular
    abnormalities in affected animals, so the model recapitulates the
    functional, conduction and arrhythmic arms of the disease but NOT the
    fibrofatty replacement that defines its histopathology - it must not be
    cited as evidence for accelerated fibrofatty remodelling.

    term:
      id: CL:0000746
      label: cardiac muscle cell
  modeled_mechanisms:
  - target: Intercalated-disc adhesion failure
    description: >-
      Plakoglobin haploinsufficiency reproduces the desmosomal adhesion defect
      in vivo, and endurance training accelerates its functional and arrhythmic
      consequences - the model system behind the exercise EXACERBATES edge on
      this node.
    evidence:
    - reference: PMID:17030684
      reference_title: >-
        Age- and training-dependent development of arrhythmogenic right
        ventricular cardiomyopathy in heterozygous plakoglobin-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous plakoglobin deficiency provokes ARVC. Manifestation of the
        phenotype is accelerated by endurance training.
      explanation: >-
        States both halves of what this model contributes: desmosomal
        haploinsufficiency is sufficient to provoke the phenotype, and exercise
        accelerates its manifestation.
  evidence:
  - reference: PMID:17030684
    reference_title: >-
      Age- and training-dependent development of arrhythmogenic right
      ventricular cardiomyopathy in heterozygous plakoglobin-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ten-month-old heterozygous plakoglobin-deficient mice (plakoglobin+/-)

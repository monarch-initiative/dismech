environmental:
- name: Competitive and endurance sports
  description: >-
    Vigorous exercise is an important disease modifier that accelerates
    progression and increases arrhythmic risk.
  effect: EXACERBATES
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 87 pathogenic AC mutation carriers, 56 were endurance athletes.
      Endurance athletes were more likely to have symptoms at young age, fulfil
      the 2010 TFC, and had lower survival free from VT, ventricular fibrillation
      (VF), and heart failure.
    explanation: >-
      Human mutation-carrier data directly associate endurance athletics with
      earlier expression and worse arrhythmia- and heart-failure-free survival.
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sports participation has been shown to increase the risk of SCD fivefold
      in AC patients
    explanation: >-
      This quantifies the association between sports participation and
      sudden-death risk.
treatments:
- name: Implantable cardioverter-defibrillator placement
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: MAXO:0000474
      label: implantable cardioverter-defibrillator placement
  description: >-
    ICD implantation terminates fast ventricular tachycardia or ventricular
    fibrillation and is the proven life-saving modality for appropriately
    selected high-risk patients.
  target_phenotypes:
  - preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  - preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, at present ICD implantation is the only proven lifesaving
      therapeutic modality for fast VT/VF.
    explanation: >-
      This directly supports ICD implantation as the life-saving treatment for
      fast ventricular tachyarrhythmia.
- name: Antiarrhythmic pharmacotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sotalol
      term:
        id: CHEBI:63622
        label: sotalol
    - preferred_term: amiodarone
      term:
        id: CHEBI:2663
        label: amiodarone
    - preferred_term: flecainide
      term:
        id: CHEBI:75984
        label: flecainide
  description: >-
    Beta-blockers, sotalol, amiodarone, or flecainide may reduce ventricular
    arrhythmia burden and symptoms, including as adjuncts intended to reduce ICD
    shocks.
  target_phenotypes:
  - preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  - preferred_term: Premature ventricular contraction
    term:
      id: HP:0006682
      label: Premature ventricular contraction
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since ventricular arrhythmias and cardiac arrest occur frequently during
      or after physical exercise or may be triggered by catecholamines,
      non-class III antiadrenergic beta-blockers are recommended. In the
      absence of adequate antiarrhythmic response, sotalol in an appropriate
      dose is the drug of first choice. Alternatively, amiodarone and
      flecainide have been reported to be useful
    explanation: >-
      This directly supports antiarrhythmic pharmacotherapy and names the main
      drug options used in symptomatic ARVC.
- name: Catheter ablation
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac radiofrequency ablation
    term:
      id: NCIT:C170884
      label: Cardiac Radiofrequency Ablation
  description: >-
    Endocardial and/or epicardial catheter ablation uses a substrate-based
    approach to reduce recurrent ventricular tachycardia burden; it does not
    reverse the underlying cardiomyopathy.
  target_phenotypes:
  - preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  - preferred_term: Premature ventricular contraction
    term:
      id: HP:0006682
      label: Premature ventricular contraction
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Catheter ablation is an alternative in patients who are refractory to
      drug treatment and have frequent VT episodes (with a predominantly single
      morphology)
    explanation: >-
      This directly supports catheter ablation as a treatment option for
      recurrent ventricular tachycardia in ARVC.
  target_mechanisms:
  - target: Scar-related conduction heterogeneity
    treatment_effect: MODULATES
    description: >-
      Substrate-based ablation modifies regions that sustain scar-related
      reentry rather than removing all fibrofatty tissue.
    evidence:
    - reference: PMID:24817548
      reference_title: >-
        Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
        management.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The outcomes of VT ablation are improved with a combined endocardial
        and epicardial approach, incorporating a substrate-based strategy
      explanation: >-
        This supports a combined endocardial/epicardial substrate strategy for
        modifying scar-related reentry.
- name: Avoidance of competitive and endurance exercise
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoid excessive exercise
    term:
      id: MAXO:0000802
      label: avoid excessive exercise
  description: >-
    Restricting competitive and high-intensity endurance exercise reduces
    mechanical stress and may lower ventricular tachyarrhythmia risk in
    affected people and pathogenic-variant carriers.
  target_phenotypes:
  - preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  - preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A reversible effect of reduction of sports activities, being a
      significant decrease in risk for VT or VF, was observed in those
      individuals who exercised the most (top quartile) [20].
    explanation: >-
      Human mutation-carrier data support a reduction in VT/VF risk after
      reducing sports activity among the highest exercisers.

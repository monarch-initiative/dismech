  downstream:
  - target: Gap-junction and sodium-channel remodeling
    description: >-
      Desmosomal dysfunction changes connexin43 and Nav1.5 abundance or
      localization at the intercalated disc.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24817548
      reference_title: >-
        Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
        management.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Desmosomal dysfunction due to a gene mutation may give rise to loss of
        mechanical cell-cell adhesion, and leads to down-regulation and/or
        altered distribution of other intercalated disk proteins, i.e. gap
        junction proteins (Connexin43) and sodium channels (Nav1.5) [43–45].
      explanation: >-
        This directly links desmosomal dysfunction to secondary remodeling of
        gap-junction and sodium-channel proteins.
  - target: Cardiomyocyte apoptosis and loss
    description: >-
      Mechanical dissociation under repeated myocardial stress can progress to
      cardiomyocyte injury, apoptosis, and loss.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Mechanical dissociation of cardiomyocytes under repetitive wall stress
    evidence:
    - reference: PMID:16823493
      reference_title: >-
        Suppression of canonical Wnt/beta-catenin signaling by nuclear
        plakoglobin recapitulates phenotype of arrhythmogenic right ventricular
        cardiomyopathy.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous DP-deficient mice exhibited excess adipocytes and fibrosis
        in the myocardium, increased myocyte apoptosis, cardiac dysfunction,
        and ventricular arrhythmias, thus recapitulating the phenotype of human
        ARVC.
      explanation: >-
        A desmoplakin-deficient mouse model supports apoptosis downstream of
        desmosomal deficiency, but the edge remains indirect for human ARVC.
  - target: Nuclear plakoglobin and canonical Wnt suppression
    description: >-
      Desmosomal disruption can redistribute plakoglobin to the nucleus and
      reduce canonical Wnt/beta-catenin signaling.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Release and nuclear redistribution of plakoglobin after desmosomal disruption
    evidence:
    - reference: PMID:16823493
      reference_title: >-
        Suppression of canonical Wnt/beta-catenin signaling by nuclear
        plakoglobin recapitulates phenotype of arrhythmogenic right ventricular
        cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        suppression of DP expression leads to nuclear localization of the
        desmosomal protein plakoglobin and a 2-fold reduction in canonical
        Wnt/beta-catenin signaling through Tcf/Lef1 transcription factors.
      explanation: >-
        Desmoplakin knockdown directly produced nuclear plakoglobin and reduced
        canonical Wnt signaling in cultured atrial myocytes.

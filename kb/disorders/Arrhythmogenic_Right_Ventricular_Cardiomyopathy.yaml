inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Most familial ARVC is inherited in an autosomal dominant fashion with
    reduced penetrance and variable expressivity.
  evidence:
  - reference: PMID:18662195
    reference_title: >-
      Abnormal connexin43 in arrhythmogenic right ventricular cardiomyopathy
      caused by plakophilin-2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ARVC is associated with autosomal dominant mutations of desmosomal
      proteins, including plakophilin-2 (PKP-2), desmoplakin (DSP), junctional
      plakoglobin (JUP), desmoglein-2 (DSG-2) and desmocollin-2 (DSC-2)
      [9–11].
    explanation: >-
      This directly supports autosomal-dominant inheritance across the
      canonical desmosomal gene spectrum.
  - reference: PMID:24817548
    reference_title: >-
      Arrhythmogenic cardiomyopathy: diagnosis, genetic background, and risk
      management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      incorporating genetic results in AC risk stratification is hampered by
      incomplete penetrance and an extremely variable clinical expression.
      Mutation carriers may present with SCD but can also remain without signs
      and symptoms of the disease into old age.
    explanation: >-
      This directly supports the incomplete penetrance and variable
      expressivity that characterise the inherited, autosomal dominant ARVC
      substrate.
pathophysiology:
- name: Intercalated-disc adhesion failure
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Pathogenic variation in core desmosomal genes disrupts mechanical
    cell-cell adhesion at cardiomyocyte intercalated discs. PKP2, DSP, DSG2,
    DSC2, and JUP form the canonical desmosomal core represented here; the
    gene-level validity annotations below preserve the strength of each
    available assertion.

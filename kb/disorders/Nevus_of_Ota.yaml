progression:
- phase: Congenital or early-life onset
  age_range: Birth to childhood
  evidence:
  - reference: PMID:35851619
    reference_title: "An update on ophthalmological perspectives in oculodermal melanocytosis (Nevus of Ota)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ODM is a rare, prevalently unilateral, congenital condition that presents
      with brown or blue/gray flat asymptomatic lesions of the skin, mucosae,
      episclera/sclera, and uvea localized within the territory of distribution
      of the ophthalmic and mandibular branches of the trigeminal nerve.
    explanation: >-
      Supports congenital or early-life presentation as the typical temporal
      pattern.
diagnosis:
- name: Comprehensive ophthalmological examination and multimodal imaging
  diagnosis_term:
    preferred_term: eye examination
    term:
      id: NCIT:C38060
      label: Eye Examination
  description: >-
    Diagnosis is primarily clinical, supplemented by comprehensive
    ophthalmologic examination, ultrasonography, and fluorescein or indocyanine
    green angiography because fundus hyperpigmentation can obscure subtle
    retinal and choroidal pathology.
  evidence:
  - reference: PMID:35851619
    reference_title: "An update on ophthalmological perspectives in oculodermal melanocytosis (Nevus of Ota)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis and management are through comprehensive opthalmological
      examination and traditional imaging methods such as ultrasonography and
      fluorescein/indocyanine green angiography as pigmentation of the fundus can
      conceal subtle retinal and choroidal alterations.
    explanation: >-
      Supports comprehensive ophthalmologic examination and angiographic or
      ultrasonographic imaging in diagnosis and surveillance.
- name: Optical coherence tomography and anterior segment imaging
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  description: >-
    Anterior segment optical coherence tomography, ultrasound biomicroscopy, and
    enhanced depth imaging spectral-domain optical coherence tomography evaluate
    anterior segment involvement, glaucoma, and early choroidal melanoma versus
    benign nevi.
  evidence:
  - reference: PMID:35851619
    reference_title: "An update on ophthalmological perspectives in oculodermal melanocytosis (Nevus of Ota)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anterior segment optical coherence tomography and ultrasound biomicroscopy
      are used to evaluate the anterior segment and the ciliary body in the
      presence of glaucoma or melanoma of the anterior uveal tract.
    explanation: >-
      Supports anterior segment OCT and ultrasound biomicroscopy for evaluating
      glaucoma and anterior uveal melanoma complications.
treatments:
- name: Q-switched or picosecond laser therapy
  description: >-
    Pigment-directed selective photothermolysis using non-ablative Q-switched
    (1064 nm Nd:YAG, 755 nm alexandrite, or 694 nm ruby) or picosecond lasers
    targets dermal melanin and melanocytes for clearance of facial
    hyperpigmentation while preserving the overlying skin.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Q-switched or picosecond laser therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_mechanisms:
  - target: Dermal and Ocular Melanocyte Accumulation
    treatment_effect: INHIBITS
    description: >-
      Selective photothermolysis with Q-switched or picosecond lasers clears
      accumulated cutaneous dermal melanocytic pigmentation in nevus of Ota.
    evidence:
    - reference: PMID:32839837
      reference_title: "Comparing the efficacy and safety of Q-switched and picosecond lasers in the treatment of nevus of Ota: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The pooled success rate was 64% for QSNL (95% CI 52-76%), 54% for QSRL
        (95% CI 39-69%), 58% for QSAL (95% CI 44-72%), and 100% for PSAL (95%
        CI 98-102%).
      explanation: >-
        Systematic review and meta-analysis across 57 studies and 13,417
        patients quantifying pigment clearance efficacy of Q-switched and
        picosecond lasers in nevus of Ota.
    - reference: PMID:38327549
      reference_title: "Results and Follow-Up of a Sequential Q-Switched Laser Therapy for Nevus of Ota in Infants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Laser therapy exhibited significant efficacy in the treatment of nevus
        of Ota in infants. Success rates reached 88.7% after four sessions and
        99.3% after seven sessions.
      explanation: >-
        Clinical cohort of 102 infants demonstrating high cutaneous lesion
        clearance with sequential 755 nm and 1064 nm Q-switched laser therapy.
  evidence:
  - reference: PMID:32839837
    reference_title: "Comparing the efficacy and safety of Q-switched and picosecond lasers in the treatment of nevus of Ota: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled success rate was 64% for QSNL (95% CI 52-76%), 54% for QSRL
      (95% CI 39-69%), 58% for QSAL (95% CI 44-72%), and 100% for PSAL (95% CI
      98-102%).
    explanation: >-
      Meta-analysis of 57 studies (13,417 patients) establishing efficacy and
      safety of Q-switched Nd:YAG, ruby, alexandrite, and picosecond alexandrite
      laser therapy for nevus of Ota.
  - reference: PMID:38327549
    reference_title: "Results and Follow-Up of a Sequential Q-Switched Laser Therapy for Nevus of Ota in Infants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laser therapy exhibited significant efficacy in the treatment of nevus of
      Ota in infants. Success rates reached 88.7% after four sessions and 99.3%
      after seven sessions.
    explanation: >-
      Retrospective cohort of 102 infants demonstrating 88.7%-99.3% success
      with sequential Q-switched 755 nm and 1064 nm laser therapy and intact
      skin on follow-up.
  - reference: clinicaltrials:NCT04481178
    reference_title: A Retrospective Study on Laser Treatment of Nevus of Ota in Thai Patients
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A retrospective study on efficacy and complication of laser treatment
      (Q-switched Nd:YAG and picosecond laser) of nevus of Ota in Thai patients
    explanation: >-
      ClinicalTrials.gov record supporting Q-switched Nd:YAG and picosecond
      laser therapy for nevus of Ota.

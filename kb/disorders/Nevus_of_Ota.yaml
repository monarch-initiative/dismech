description: >-
  Nevus of Ota is a sporadic congenital or early-onset oculodermal melanocytosis
  characterized by usually unilateral brown or blue-gray pigmentation of facial
  skin, mucosae, episclera or sclera, and uvea along the ophthalmic (V1) and
  maxillary (V2) distributions of the trigeminal nerve. Lesions arise from
  entrapped dermal and ocular melanocytes driven by postzygotic mosaic activating
  mutations in GNAQ or GNA11 in migrating neural crest-derived melanoblasts.
  Management includes lifelong ophthalmic surveillance for ipsilateral glaucoma
  and uveal melanoma, and pigment-directed Q-switched or picosecond laser
  therapy for cutaneous hyperpigmentation.

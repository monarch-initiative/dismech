    extensive dermal melanocytoses without germline transmission.
  evidence:
  - reference: PMID:19078957
    reference_title: "Frequent somatic mutations of GNAQ in uveal melanoma and blue naevi."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To increase the detection limit for mutations in a background of normal
      cells, we used a mutation-specific assay and found a mutation in one of 14
      cases (6%)
    explanation: >-
      Directly identifies somatic GNAQ mutation in lesional nevus of Ota biopsy
      tissue using a mutation-specific assay.
  - reference: PMID:26778290
    reference_title: "Mosaic Activating Mutations in GNA11 and GNAQ Are Associated with Phakomatosis Pigmentovascularis and Extensive Dermal Melanocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations were detected at very low levels in affected tissues but were
      undetectable in the blood, indicating that these conditions are postzygotic
      mosaic disorders.
    explanation: >-
      Supports postzygotic tissue-restricted mosaicism as the molecular genetic
      architecture of extensive dermal melanocytosis.

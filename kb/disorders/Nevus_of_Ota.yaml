inheritance:
- name: Somatic mosaicism (not inherited)
  inheritance_term:
    preferred_term: Somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    Nevus of Ota is a sporadic, non-heritable post-zygotic disorder. The activating GNAQ (rarely
    GNA11) variant is somatic, and its segmental distribution across periorbital skin, conjunctiva,
    neurovascular bundles, ganglia and uvea is explained by the variant arising in a melanoblast
    precursor early during migration, before those structures are seeded. Lesional tissue is sparsely
    cellular, so the mutant allele is detected in only a minority of samples even with a
    mutation-specific assay. A paired lesion-versus-blood comparison has not been reported for nevus
    of Ota itself; tissue-restricted, blood-negative detection is documented for the related extensive
    dermal melanocytoses and is cited here as indirect support.
  evidence:
  - reference: PMID:21083380
    reference_title: "Mutations in GNA11 in uveal melanoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "segmental lesions, such as the nevus of Ota, would result from mutations in a precursor early during migration"
    explanation: States the post-zygotic origin for nevus of Ota specifically, as a somatic variant in a migrating melanocyte precursor whose timing sets the segmental extent.
  - reference: PMID:19078957
    reference_title: "Frequent somatic mutations of GNAQ in uveal melanoma and blue naevi."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "nevus of Ota involves different structures such as periorbital skin, conjunctiva, neurovascular bundles, ganglia, and uvea, suggesting these GNAQ mutations may arise early in a migrating melanoblast"
    explanation: Ties the multi-structure distribution of nevus of Ota to a somatic GNAQ variant acquired early in melanoblast migration, which is the mosaic mechanism this block records.
  - reference: PMID:19078957
    reference_title: "Frequent somatic mutations of GNAQ in uveal melanoma and blue naevi."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "To increase the detection limit for mutations in a background of normal cells, we used a mutation-specific assay and found a mutation in one of 14 cases (6%)"
    explanation: The mutant allele sits in a background of normal cells and is recovered in a minority of nevus of Ota samples, the detection pattern of a sparsely cellular mosaic lesion.
  - reference: PMID:26778290
    reference_title: "Mosaic Activating Mutations in GNA11 and GNAQ Are Associated with Phakomatosis Pigmentovascularis and Extensive Dermal Melanocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The mutations were detected at very low levels in affected tissues but were undetectable in the blood, indicating that these conditions are postzygotic mosaic disorders."
    explanation: Concerns the related phakomatosis pigmentovascularis and extensive dermal melanocytoses, not nevus of Ota itself; the tissue-restricted, blood-negative pattern it reports is cited as indirect support for the same post-zygotic origin.

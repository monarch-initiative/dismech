notes: >-
  No GeneReviews chapter or ClinGen gene-disease validity record covers nevus of
  Ota (MONDO:0016984). Typical isolated nevus of Ota is a sporadic postzygotic
  mosaic disorder with no established germline inheritance, infectious etiology,
  or environmental causation.

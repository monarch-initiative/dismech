  evidence:
  - reference: PMID:26778290
    reference_title: "Mosaic Activating Mutations in GNA11 and GNAQ Are Associated with Phakomatosis Pigmentovascularis and Extensive Dermal Melanocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we discover that extensive dermal melanocytosis and phakomatosis
      pigmentovascularis are associated with activating mutations in GNA11 and
      GNAQ, genes that encode Gα subunits of heterotrimeric G proteins.
    explanation: >-
      Establishes postzygotic activating GNAQ and GNA11 mutations as the
      molecular basis of extensive dermal melanocytosis.
  - reference: PMID:26778290
    reference_title: "Mosaic Activating Mutations in GNA11 and GNAQ Are Associated with Phakomatosis Pigmentovascularis and Extensive Dermal Melanocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Codon 183 in both GNA11 and GNAQ is located within the guanosine
      triphosphate binding region of the human Gα subunit, a region required for
      hydrolysis of guanosine triphosphate to guanosine diphosphate and an
      essential step for inactivation of G-protein coupled receptor signaling.
      Therefore, these mutations lead to decreased function of guanosine
      triphosphatase and to constitutive activation of downstream effector
      pathways.
    explanation: >-
      Explains the molecular mechanism whereby GNAQ and GNA11 hotspot variants
      decrease intrinsic GTPase activity to drive constitutive Gαq/11 signaling.
  - reference: PMID:26778290
    reference_title: "Mosaic Activating Mutations in GNA11 and GNAQ Are Associated with Phakomatosis Pigmentovascularis and Extensive Dermal Melanocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro expression of mutant GNA11(R183C) and GNA11(Q209L) in human cell
      lines demonstrated activation of the downstream p38 MAPK signaling pathway
      and the p38, JNK, and ERK pathways, respectively.
    explanation: >-
      Directly demonstrates downstream MAPK-family activation from mutant GNA11
      signaling in human cells.
  - reference: PMID:26778290
    reference_title: "Mosaic Activating Mutations in GNA11 and GNAQ Are Associated with Phakomatosis Pigmentovascularis and Extensive Dermal Melanocytosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Transgenic mosaic zebrafish models expressing mutant GNA11(R183C) under
      promoter mitfa developed extensive dermal melanocytosis recapitulating the
      human phenotype.
    explanation: >-
      Model-organism evidence supporting causal sufficiency of melanocyte-lineage
      mutant GNA11 for dermal melanocytosis.

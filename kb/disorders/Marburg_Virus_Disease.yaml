name: Marburg Virus Disease
creation_date: "2026-10-31T00:00:00Z"
category: Infectious
description: >-
  Marburg virus disease (MVD) is a severe, frequently fatal systemic viral
  hemorrhagic fever caused by Marburg virus (MARV) and the closely related Ravn
  virus, filoviruses of the species Orthomarburgvirus marburgense. Egyptian
  fruit bats (Rousettus aegyptiacus) are the natural reservoir; human outbreaks
  begin with zoonotic spillover - classically in caves and mines harbouring
  large bat colonies - followed by person-to-person transmission through direct
  contact with blood and body fluids, amplified in healthcare and funeral
  settings. After an incubation of days to about three weeks, disease begins
  abruptly with high fever, headache, and myalgia, progresses to severe
  gastrointestinal symptoms, and in severe cases to coagulopathy, bleeding,
  shock and multi-organ failure. Case-fatality rates have ranged from about 24%
  to 88%. The viral glycoprotein, especially its mucin-like domain, damages the
  vascular endothelium and increases vascular permeability, while infection of
  endothelial and mononuclear phagocyte targets drives the consumptive
  coagulopathy shared across viral hemorrhagic fevers. No vaccine or antiviral
  is licensed; care is supportive. It is the sibling of Ebola virus disease -
  same family and same person-to-person amplification - but with a distinct
  fruit-bat reservoir.
synonyms:
- Marburg hemorrhagic fever
- Marburg haemorrhagic fever
- MVD
- MARV disease

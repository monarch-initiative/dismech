progression:
- phase: Incubation
  notes: >-
    The incubation period ranges from about 2 to 21 days following infection.
  evidence:
  - reference: PMID:42958480
    reference_title: "Marburg Virus Disease (MVD): a rapid systematic review with narrative synthesis of epidemiology, clinical presentation, diagnostics, management, and public-health response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The incubation period for MVD ranges from 2 to 21 days following infection.
    explanation: >-
      Establishes the incubation range for MVD.
- phase: Generalised phase (days 1-4)
  notes: >-
    An abrupt onset of non-specific systemic symptoms (high fever, headache,
    myalgia, malaise) in the first days of illness.
  evidence:
  - reference: PMID:42958480
    reference_title: "Marburg Virus Disease (MVD): a rapid systematic review with narrative synthesis of epidemiology, clinical presentation, diagnostics, management, and public-health response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Phase 1: Generalised Phase (Days 1–4): This phase is dominated by
      non-specific systemic symptoms.
    explanation: >-
      Establishes the early generalised phase and its timing.
- phase: Early organ phase (days 5-13)
  notes: >-
    Disease accelerates with severe gastrointestinal symptoms, coagulopathy,
    bleeding, vascular leak and progression toward shock and multi-organ
    failure; death, when it occurs, is typically around days 8-9.
  evidence:
  - reference: PMID:42958480
    reference_title: "Marburg Virus Disease (MVD): a rapid systematic review with narrative synthesis of epidemiology, clinical presentation, diagnostics, management, and public-health response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Phase 2: Early Organ Phase (Days 5–13): Disease progression accelerates
      dramatically in this phase.
    explanation: >-
      Establishes the organ phase in which severe disease develops.
- phase: Late organ phase / convalescence (days 13+)
  notes: >-
    Beyond about day 13 patients reach a critical juncture, progressing either
    to fatal multi-organ failure or to convalescence in survivors.
  evidence:
  - reference: PMID:42958480
    reference_title: "Marburg Virus Disease (MVD): a rapid systematic review with narrative synthesis of epidemiology, clinical presentation, diagnostics, management, and public-health response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Phase 3: Late Organ Phase / Convalescence (Days 13+): Patients reach a
      critical juncture.
    explanation: >-
      Establishes the late phase separating fatal outcome from recovery.
treatments:
- name: Supportive Care
  therapeutic_modality: OTHER
  description: >-
    There is no licensed vaccine or antiviral for MVD. Management is supportive:
    aggressive fluid resuscitation, blood-pressure and circulatory support, and
    intensive critical care, with monoclonal antibodies and antivirals in
    development.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42294865
    reference_title: "Marburg virus disease: a comprehensive review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patient care focuses on supportive therapies, including aggressive fluid
      resuscitation, management of blood pressure and circulation, and intensive
      critical care.
    explanation: >-
      Documents that supportive critical care is the mainstay of treatment.
notes: >-
  Marburg virus disease is a member of the Viral_Hemorrhagic_Fevers grouping and
  conforms to the viral_hemorrhagic_fever_syndrome module on its vascular and
  hemostatic nodes, substituting Marburg virus, its glycoprotein mucin-like
  domain, and the Rousettus aegyptiacus reservoir. It is kept a separate entry
  from Ebola virus disease (its filovirus sibling) because of its distinct
  fruit-bat reservoir association and the absence of a licensed monoclonal
  antibody or vaccine, following the infectious-disease granularity ladder
  (design decisions section 3e). Ravn virus is included under the same species
  (Orthomarburgvirus marburgense) and causes clinically indistinguishable
  disease.

transmission:
- name: Zoonotic spillover from fruit bats
  description: >-
    Human infection is introduced by spillover from the Egyptian fruit-bat
    reservoir, classically among miners and tourists exposed to bat-infested
    caves and mines.
  evidence:
  - reference: PMID:19649327
    reference_title: "Isolation of genetically diverse Marburg viruses from Egyptian fruit bats."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These data indicate common Egyptian fruit bats can represent a major
      natural reservoir and source of Marburg virus with potential for spillover
      into humans.
    explanation: >-
      Establishes the fruit-bat reservoir as the source of zoonotic spillover to
      humans.
- name: Person-to-person contact with blood and body fluids
  description: >-
    After introduction, the virus spreads human-to-human through direct contact
    with the blood and body fluids of infected people, amplified by healthcare
    exposure and funeral practices.
  evidence:
  - reference: PMID:42958480
    reference_title: "Marburg Virus Disease (MVD): a rapid systematic review with narrative synthesis of epidemiology, clinical presentation, diagnostics, management, and public-health response."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      human infections result from zoonotic spillover and subsequent
      human-to-human transmission, particularly via direct contact with bodily
      fluids and funeral practices
    explanation: >-
      Documents person-to-person transmission by body-fluid contact and funeral
      practices.
agent_life_cycle:
  description: >-
    Marburg virus is maintained in the Egyptian fruit bat (Rousettus
    aegyptiacus), in which it circulates with low-level year-round horizontal
    transmission and distinct seasonal pulses of infection in juvenile bats that
    coincide with peak human spillover risk. Humans are incidental, dead-end
    hosts that do not maintain the cycle but can sustain outbreaks through
    person-to-person transmission.
  hosts:
  - preferred_term: Egyptian fruit bat (reservoir host)
    role: reservoir host
    term:
      id: NCBITaxon:9407
      label: Rousettus aegyptiacus
  - preferred_term: Human (incidental dead-end host)
    role: incidental (dead-end) host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:23055920
    reference_title: "Seasonal pulses of Marburg virus circulation in juvenile Rousettus aegyptiacus bats coincide with periods of increased risk of human infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      distinct pulses of virus infection in older juvenile bats (~six months of
      age) that temporarily coincide with the peak twice-yearly birthing seasons
    explanation: >-
      Documents the seasonal reservoir dynamics in Rousettus aegyptiacus that
      drive human spillover risk.
prevalence:
- population: Historical MVD outbreaks (aggregated)
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    MVD occurs as sporadic, geographically restricted outbreaks rather than
    endemic disease; case-fatality rates across outbreaks range from about 24%
    to 88%.
  evidence:
  - reference: PMID:42294865
    reference_title: "Marburg virus disease: a comprehensive review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Case fatality rates vary widely, from 24% up to 90%.
    explanation: >-
      Documents the wide, high case-fatality range of MVD outbreaks.
pathophysiology:
- name: High Viremia with Endothelial and Myeloid Infection
  conforms_to: "viral_hemorrhagic_fever_syndrome#High Viremia and Vascular Target Infection"
  biological_scale: ORGANISM
  description: >-
    Marburg virus replicates to high titre and reaches the vascular endothelium
    and the mononuclear phagocyte compartment. Filovirus entry into these target
    cells requires the endosomal cholesterol transporter NPC1 after
    glycoprotein-mediated attachment and fusion. The high systemic viral burden
    presented to the vasculature and myeloid cells initiates the vascular and
    hemostatic arms of disease.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: mononuclear phagocyte
    term:
      id: CL:0000113
      label: mononuclear phagocyte
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
    modifier: INCREASED
  evidence:
  - reference: PMID:21866103
    reference_title: "Ebola virus entry requires the cholesterol transporter Niemann-Pick C1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      membrane fusion mediated by filovirus glycoproteins and viral escape from
      the vesicular compartment require the NPC1 protein
    explanation: >-
      Establishes the NPC1-dependent filovirus entry mechanism by which Marburg
      virus infects its target cells.
  downstream:
  - target: Glycoprotein-Mediated Endothelial Damage
    causal_link_type: DIRECT
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      The high-viremia systemic infection and inflammatory response drive the
      abrupt febrile prodrome.
  - target: Headache
    causal_link_type: DIRECT
  - target: Vomiting
    causal_link_type: DIRECT
    description: >-
      Severe gastrointestinal symptoms accompany the systemic viral phase.
  - target: Consumptive Coagulopathy
    causal_link_type: DIRECT
    description: >-
      Infection of host cells and the host response together dysregulate the
      hemostatic system, of which consumptive coagulopathy is one route.
    evidence:
    - reference: PMID:42958480
      reference_title: "Marburg Virus Disease (MVD): a rapid systematic review with narrative synthesis of epidemiology, clinical presentation, diagnostics, management, and public-health response."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Clinical presentation ranges from abrupt febrile illness with
        gastrointestinal symptoms to coagulopathy, multi-organ failure, and
        hemorrhage.
      explanation: >-
        Links the high-viremia systemic infection to the coagulopathy and
        hemorrhage that follow.
- name: Glycoprotein-Mediated Endothelial Damage
  conforms_to: "viral_hemorrhagic_fever_syndrome#Endothelial Activation and Damage"
  biological_scale: CELLULAR
  description: >-
    The Marburg virus glycoprotein (GP), acting largely through its mucin-like
    domain, shields and downregulates cell-surface molecules, rounds and detaches
    adherent cells, and damages endothelial cells, disrupting monolayer barrier
    function. This is the Marburg-specific driver of the endothelial activation
    and damage step of the viral-hemorrhagic-fever syndrome.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: endothelial cell activation
    term:
      id: GO:0042118
      label: endothelial cell activation
    modifier: INCREASED
  evidence:
  - reference: PMID:42028645
    reference_title: "Marburg Virus Glycoprotein Is a Remarkable Virulent Factor Linked to Hemorrhagic Pathology: Evidence from Multimodal Experimental Systems."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In an ex vivo rat vascular model, GP expression caused significant
      endothelial cell damage and increased vascular permeability.
    explanation: >-
      Directly attributes endothelial damage to the Marburg GP.
  downstream:
  - target: Increased Vascular Permeability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42028645
      reference_title: "Marburg Virus Glycoprotein Is a Remarkable Virulent Factor Linked to Hemorrhagic Pathology: Evidence from Multimodal Experimental Systems."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        GP expression caused significant endothelial cell damage and increased
        vascular permeability
      explanation: >-
        Links endothelial damage to the increase in vascular permeability.
- name: Increased Vascular Permeability
  conforms_to: "viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability"
  biological_scale: TISSUE
  description: >-
    Endothelial damage and activation abolish normal barrier regulation, raising
    vascular permeability. Fluid and protein leak from the intravascular
    compartment, driving the capillary leak, hypovolemia, and shock of severe
    disease.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: regulation of vascular permeability
    term:
      id: GO:0043114
      label: regulation of vascular permeability
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42028645
    reference_title: "Marburg Virus Glycoprotein Is a Remarkable Virulent Factor Linked to Hemorrhagic Pathology: Evidence from Multimodal Experimental Systems."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MARV GP increases vascular permeability and exacerbates inflammation and
      tissue injury in mouse muscle and liver transduction models
    explanation: >-
      Documents the increased vascular permeability caused by Marburg GP in vivo.
  downstream:
  - target: Shock
    causal_link_type: DIRECT
- name: Consumptive Coagulopathy
  conforms_to: "viral_hemorrhagic_fever_syndrome#Consumptive Coagulopathy"
  biological_scale: ORGANISM
  description: >-
    Activation and consumption of coagulation components, together with the
    endothelial injury, produce a consumptive coagulopathy (disseminated
    intravascular coagulation) with thrombocytopenia and bleeding, the hemostatic
    arm of the viral-hemorrhagic-fever syndrome.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42294865
    reference_title: "Marburg virus disease: a comprehensive review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      followed by severe gastrointestinal symptoms, bleeding disorders, and, in
      the most severe cases, multi-organ failure
    explanation: >-
      Documents the bleeding disorder (coagulopathy) as a core feature of severe
      MVD.
  downstream:
  - target: Abnormal bleeding
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT

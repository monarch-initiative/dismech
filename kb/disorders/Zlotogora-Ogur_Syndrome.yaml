discussions:
- discussion_id: clped1_w185x_mouse_human_allele_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the dominant-interfering effect of NECTIN1 W185X in mouse palatal
    epithelium explain human CLPED1, which is inherited as a recessive disorder?
  rationale: >-
    W185X expression produces cleft palate with greater penetrance than Nectin1
    loss in mice,
    suggesting dominant interference, whereas human syndromic disease requires
    biallelic pathogenic variants. The mouse result supports a role for the
    nectin-afadin axis but does not establish the allelic mechanism in human
    palate or ectodermal appendages.
  attaches_to:
  - pathophysiology#Impaired Palate Shelf Elevation and Fusion
  evidence:
  - reference: PMID:32554531
    reference_title: "Disruption of the nectin-afadin complex recapitulates features of the human cleft lip/palate syndrome CLPED1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      expression of the human disease mutant NECTIN1W185X causes CP with greater
      penetrance than Nectin1 loss, suggesting this alteration may drive CP via
      a dominant interfering mechanism
    explanation: >-
      The mouse study explicitly identifies the allele-mechanism mismatch that
      remains unresolved in the recessively inherited human syndrome.
- discussion_id: clped1_natural_history_and_management_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the syndrome-specific phenotype frequencies, natural history, and
    outcomes of cleft, limb, dental, dermatologic, and developmental management?
  rationale: >-
    Published CLPED1 evidence is dominated by small pedigrees and case reports.
    The entry therefore avoids unsupported frequency labels and does not infer
    treatment efficacy from citations that only establish the corresponding
    phenotype. Cached exact-text sources directly support hypodontia and dry
    hair, but not separate dry-skin, sparse-eyebrow, nail-dysplasia,
    palmoplantar-keratoderma, or broader dental-morphology assertions, nor a
    congenital-to-progressive natural-history sequence. Mixed
    ectodermal-dysplasia cohorts provide only indirect cleft-management evidence.
  attaches_to:
  - disease#Zlotogora-Ogur Syndrome

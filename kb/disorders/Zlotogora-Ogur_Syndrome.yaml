prevalence:
- population: Margarita Island, Venezuela
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    CLPED1 was reported to have a high frequency on Margarita Island in the
    Caribbean Sea. Homozygous W185X causes CLPED1 in this population, but the
    cited evidence does not establish a founder event. No syndrome-specific
    prevalence estimate or carrier frequency is established. The cited study
    proposed, but did not demonstrate, heterozygote advantage against
    alpha-herpesvirus infection.
  evidence:
  - reference: PMID:10932188
    reference_title: "Mutations of PVRL1, encoding a cell-cell adhesion molecule/herpesvirus receptor, in cleft lip/palate-ectodermal dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the high frequency of CLPED1 on Margarita Island in the Caribbean Sea
      might result from resistance of heterozygotes to infection by these viruses
    explanation: >-
      Documents the reported high frequency on Margarita Island and explicitly
      frames viral-resistance heterozygote advantage as a possibility.

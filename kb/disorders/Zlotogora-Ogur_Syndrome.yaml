    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we demonstrate highly significant association between heterozygosity
      for this mutation and sporadic, non-syndromic CL/P in northern Venezuela
    explanation: >-

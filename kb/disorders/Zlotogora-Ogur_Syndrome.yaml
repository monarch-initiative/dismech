      label: roof of mouth
  evidence:
  - reference: PMID:32554531
    reference_title: "Disruption of the nectin-afadin complex recapitulates features of the human cleft lip/palate syndrome CLPED1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we use in utero lentiviral-mediated genetic approaches in mice to
      provide the first direct evidence that the nectin-afadin axis is essential
      for proper palate shelf elevation and fusion
    explanation: >-
      Directly supports the tissue-level palate mechanism in mice.
  downstream:
  - target: Cleft Palate
    description: Failed palate shelf elevation and fusion produces cleft palate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32554531
      reference_title: "Disruption of the nectin-afadin complex recapitulates features of the human cleft lip/palate syndrome CLPED1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        palatal epithelial conditional loss of afadin (Afdn) - an obligate
        nectin- and actin-binding protein - induces a high penetrance of CP
      explanation: >-
        Directly supports cleft palate downstream of disruption of the
        nectin-afadin palate-fusion mechanism in mice; it does not support a
        cleft-lip edge.
- name: NECTIN1-Associated Ectodermal Dysplasia
  biological_scale: TISSUE
  description: >
    Human CLPED1 reports document hypohidrotic ectodermal dysplasia with sparse,
    structurally abnormal hair, hypodontia, and cutaneous syndactyly. The
    precise NECTIN1-dependent tissue mechanism for each feature is not
    established. PVRL4-associated evidence supplies only cross-nectinopathy
    plausibility for hair follicles and separating digits; it does not establish
    NECTIN1 tooth- or sweat-gland mechanisms.

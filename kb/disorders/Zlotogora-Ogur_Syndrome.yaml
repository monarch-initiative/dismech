- name: Impaired Palate Shelf Elevation and Fusion
  biological_scale: TISSUE
  description: >
    Mouse experiments show that the nectin-afadin axis is required for palate
    shelf elevation and fusion. Palatal epithelial loss of afadin induces
    high-penetrance cleft palate; loss of either Nectin1 or Nectin4 produces
    mild palate-closure defects at low penetrance, and combined loss produces
    severe cleft palate. Expression of human NECTIN1 W185X in mice causes cleft
    palate with greater penetrance than Nectin1 loss, suggesting a dominant
    interfering mechanism in that model.
  cell_types:
  - preferred_term: ectodermal cell
    term:
      id: CL:0000221
      label: ectodermal cell

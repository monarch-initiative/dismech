discussions:
- discussion_id: magt1_cdg_xmen_one_disease_two_phenotypes
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a MAGT1 loss-of-function patient presents with immunodeficiency
    (XMEN) or with intellectual and developmental disability?
  attaches_to:
  - "pathophysiology#Defective Post-Translational N-Glycosylation"
  rationale: >-
    MAGT1-CDG is delineated as one disorder with two clinical presentations, both caused by
    defects in glycosylation. What partitions patients between them is unexplained.
    Candidate modifiers include which client glycoproteins are affected in a given genetic
    background, residual MAGT1 activity, the degree of TUSC3 compensation, and ascertainment
    bias — immunology clinics find EBV disease, metabolic clinics find abnormal transferrin.
    Until this is resolved, curators should not treat the two presentations as separate
    diseases, nor assume a genotype-phenotype correlation that has not been demonstrated.
  proposed_experiments:
  - experiment_id: magt1_genotype_glycoproteome_correlation
    name: Genotype-to-glycoproteome correlation across both presentations
    description: >-
      Comparative glycoproteomics on patient lymphocytes and fibroblasts from both clinical
      presentations, paired with quantification of residual MAGT1 and of TUSC3 expression,
      to test whether presentation tracks the affected client-glycoprotein set or the degree
      of homolog compensation.
- discussion_id: magt1_tusc3_compensation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does TUSC3 upregulation functionally compensate for MAGT1 loss, and could it be
    therapeutically exploited?
  attaches_to:
  - "pathophysiology#Loss of MAGT1 STT3B Oligosaccharyltransferase Subunit"
  rationale: >-
    MAGT1 deficiency is accompanied by enhanced expression of its homolog TUSC3, which the
    source describes as pointing toward a compensatory mechanism. Whether that compensation
    is functionally meaningful — and whether it could be enhanced — has not been
    established, and the observation is currently an expression finding rather than a
    demonstrated rescue. With magnesium supplementation refuted, the therapeutic options for
    this disorder are limited enough that this is worth resolving.
notes: >-
  DEEP RESEARCH: a Perplexity deep-research pass was run for this disease
  (`research/Congenital_Disorder_Of_Glycosylation_Type_ICC-deep-research-perplexity.md`,
  model sonar-deep-research). Its own reference validation resolved 6/6 citations with a
  0.0 confabulation rate and 6/6 judged on topic, and `just preflight-dr` against
  MONDO:0026729 returned PASS (canonical gene MAGT1 dominant at 286 mentions; report OMIM
  IDs include the MONDO xref 301031). The report was used as a lead and a cross-check, not
  as a source: every evidence snippet in this entry is quoted from a directly fetched
  primary reference, and no PMID, snippet or ontology term was taken from the report
  unverified. It independently corroborated the one-disease/two-presentations reading and
  the type I transferrin assignment.

  Curated from five primary sources: PMID:31036665 (Blommaert, delineating MAGT1-CDG),
  PMID:31714901 (Ravell, reclassifying XMEN as a CDG with multisystem features),
  PMID:35182234 (NKG2D loss caused by hypoglycosylation, and magnesium rescue refuted in
  vitro), PMID:34655400 (the randomized magnesium trial), PMID:21796205 (the original Mg2+
  second-messenger report), plus the trial registration clinicaltrials:NCT02496676. Every
  evidence snippet is quoted from one of those directly fetched primary references; the
  Perplexity report described above was a cross-check, not a source.

  LUMP/SPLIT DECISION: curated as ONE disease with two `has_subtypes` presentations rather
  than as separate CDG-ICC and XMEN entries. This follows the literature rather than
  overriding it — PMID:31036665 concludes "we delineate MAGT1-CDG as a disorder associated
  with two different clinical phenotypes caused by defects in glycosylation", and
  PMID:35182234 opens by describing one CDG "with two distinct clinical phenotypes".
  Splitting would create two entries for one gene, one mechanism and one final common
  pathway, differing only in ascertainment route. XMEN is carried as a synonym and the
  historical name is preserved in the description.

  SUPERSEDED MECHANISM: the magnesium-transporter model is curated as a DEPRECATED
  `mechanistic_hypotheses` entry rather than deleted, because it named the disease, drove
  its clinical trial, and dominates the older literature — a curator meeting only the
  current model would not understand why "magnesium defect" is in the disorder's own name.
  Its refutation carries `supports: REFUTE` evidence at both the in vitro and clinical
  levels.

  The magnesium treatment entry records a NEGATIVE result and is titled to say so. It is
  included deliberately rather than omitted: silence would leave the historical rationale
  as the only signal a reader finds.


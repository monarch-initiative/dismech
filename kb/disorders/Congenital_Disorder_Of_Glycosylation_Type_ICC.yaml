has_subtypes:
- name: Immunodeficiency
  display_name: Primary immunodeficiency presentation (XMEN)
  description: >
    The immunodeficiency presentation, historically named XMEN. Dominated by failure to
    control Epstein-Barr virus, with EBV-associated lymphoproliferative disease and
    lymphoma, lymphadenopathy, autoimmune cytopenias, liver disease and recurrent
    sinopulmonary infection, on a background of decreased NKG2D expression on CD8+ T
    cells and NK cells.
- name: Neurodevelopmental
  display_name: Intellectual and developmental disability presentation
  description: >
    The neurodevelopmental presentation, in which patients ascertained through abnormal
    serum transferrin glycosylation present mainly with intellectual and developmental
    disability rather than with immunodeficiency.
genetic:
- name: MAGT1
  gene_term:
    preferred_term: MAGT1
    term:
      id: hgnc:28880
      label: MAGT1
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    Loss-of-function mutations in the X-linked MAGT1 gene. MAGT1 is a subunit of the
    oligosaccharyltransferase complex, and more specifically of the STT3B complex, which
    carries out post-translational N-glycosylation. Causality for the glycosylation defect
    was established by rescue: transfection of MAGT1 mRNA restored proteins with defective
    glycosylation. MAGT1 deficiency is accompanied by enhanced expression of TUSC3, the
    homologous protein, suggesting a partial compensatory mechanism.
  evidence:
  - reference: PMID:31036665
    reference_title: "Mutations in MAGT1 lead to a glycosylation disorder with a variable phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MAGT1 has been described to be a subunit of the oligosaccharyltransferase (OST)
      complex and more specifically of the STT3B complex.
    explanation: >-
      Establishes the molecular identity of MAGT1 as an OST/STT3B subunit, the basis for
      classifying this disorder as a CDG.
  - reference: PMID:31714901
    reference_title: "Defective glycosylation and multisystem abnormalities characterize the primary immunodeficiency XMEN disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection of MAGT1 mRNA enabled us to rescue proteins with defective glycosylation.
    explanation: >-
      Rescue by MAGT1 mRNA establishes that the glycosylation defect is caused by MAGT1
      loss rather than being incidental.
  - reference: PMID:31036665
    reference_title: "Mutations in MAGT1 lead to a glycosylation disorder with a variable phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, MAGT1 deficiency is associated with an enhanced expression of TUSC3, the
      homolog protein of MAGT1, pointing toward a compensatory mechanism.
    explanation: >-
      Documents TUSC3 upregulation as a candidate partial compensatory mechanism.
mechanistic_hypotheses:
- hypothesis_group_id: glycosylation_defect_model
  hypothesis_label: STT3B/OST hypoglycosylation model
  status: CANONICAL
  description: >
    MAGT1 is a subunit of the STT3B oligosaccharyltransferase complex, so its loss impairs
    post-translational N-glycosylation of a restricted subset of client glycoproteins. On
    this model the immunological phenotype is a direct consequence of glycoprotein
    hypoglycosylation: the loss of steady-state NKG2D is caused by hypoglycosylation of
    NKG2D itself at a defined site, not by a downstream signalling defect. This is the
    model the current evidence supports.
  evidence:
  - reference: PMID:35182234
    reference_title: "Lack of NKG2D in MAGT1-deficient patients is caused by hypoglycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that the reduced steady-state levels of NKG2D are caused by
      hypoglycosylation of the protein and we pinpoint the exact site that is
      underglycosylated in MAGT1-deficient patients.
    explanation: >-
      Directly demonstrates that the NKG2D deficit is a glycosylation defect, the central
      claim of this model.
  - reference: PMID:31714901
    reference_title: "Defective glycosylation and multisystem abnormalities characterize the primary immunodeficiency XMEN disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also performed glycoproteomics analysis on T lymphocytes and show that XMEN
      disease is a congenital disorder of glycosylation that affects a restricted subset
      of glycoproteins.
    explanation: >-
      Glycoproteomic evidence reclassifying XMEN as a congenital disorder of glycosylation
      and noting that the affected glycoprotein set is restricted.
- hypothesis_group_id: magnesium_transporter_model
  hypothesis_label: Mg2+ second-messenger transporter model
  status: DEPRECATED
  description: >
    The original model, in which MAGT1 acts as a magnesium transporter and the loss of
    NKG2D and of EBV cytotoxicity follows from a Mg2+ homeostasis defect, with
    supraphysiological magnesium predicted to rescue the defect. This model is retained
    here because it drove the disorder's original name, its clinical trial, and much of
    the older literature — but it is recorded as DEPRECATED. Magnesium did not
    significantly rescue NKG2D expression in CRISPR-engineered human cell lines or in
    patient cells, did not rescue the hypoglycosylation defect, and produced no change in
    EBV or NKG2D status in a randomized controlled trial.
  evidence:
  - reference: PMID:21796205
    reference_title: "Second messenger role for Mg2+ revealed by human T-cell immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These observations reveal a role for Mg(2+) as an intracellular second messenger
      coupling cell-surface receptor activation to intracellular effectors and identify
      MAGT1 as a possible target for novel therapeutics.
    explanation: >-
      The originating report's own statement of the magnesium second-messenger model,
      including the therapeutic inference that motivated the later magnesium trial.
  - reference: PMID:35182234
    reference_title: "Lack of NKG2D in MAGT1-deficient patients is caused by hypoglycosylation."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we challenge the possibility that supplementation with magnesium
      restores NKG2D levels and show that the addition of this ion does not significantly
      improve NKG2D steady-state expression nor does it rescue the hypoglycosylation defect
      in CRISPR-engineered human cell lines.
    explanation: >-
      Direct experimental refutation of the magnesium-rescue prediction that defines this
      model.
  - reference: PMID:34655400
    reference_title: "A Double-Blind, Placebo-Controlled, Crossover Study of Magnesium Supplementation in Patients with XMEN Disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No change in EBV or NKG2D status was observed.
    explanation: >-
      Clinical refutation: the randomized controlled trial of magnesium supplementation
      found no effect on either endpoint.
pathophysiology:
- name: Loss of MAGT1 STT3B Oligosaccharyltransferase Subunit
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: MAGT1
      term:
        id: hgnc:28880
        label: MAGT1
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >
    Loss-of-function mutation of the X-linked MAGT1 gene removes a subunit of the STT3B
    oligosaccharyltransferase complex, the machinery that performs post-translational
    N-glycosylation. TUSC3, the MAGT1 homolog, is upregulated, which may partially
    compensate. Note that MAGT1 is a non-catalytic subunit, so the annotation here is the
    decrease in the N-glycosylation process rather than loss of a catalytic molecular
    function; GO:0008250 (oligosaccharyltransferase complex) names the complex MAGT1
    belongs to but is a cellular component and is not a valid MolecularFunctionTerm.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  downstream:
  - target: Defective Post-Translational N-Glycosylation
    hypothesis_groups:
    - glycosylation_defect_model
  evidence:
  - reference: PMID:31036665
    reference_title: "Mutations in MAGT1 lead to a glycosylation disorder with a variable phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MAGT1 has been described to be a subunit of the oligosaccharyltransferase (OST)
      complex and more specifically of the STT3B complex.
    explanation: >-
      Identifies the molecular lesion as loss of an STT3B/OST subunit.
- name: Defective Post-Translational N-Glycosylation
  biological_scale: MOLECULAR
  description: >
    The post-translational glycosylation carried out by the STT3B complex is dysfunctional,
    producing a glycosylation defect demonstrable across several substrates including
    GLUT1 and SHBG, and detectable clinically as abnormal serum transferrin glycosylation.
    Glycoproteomics shows the affected glycoprotein set is restricted rather than global —
    an important qualification when reusing the generic CDG module.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  downstream:
  - target: NKG2D Hypoglycosylation and Loss from Cytotoxic Lymphocytes
    hypothesis_groups:
    - glycosylation_defect_model
  - target: Multisystem Glycoprotein Dysfunction
    hypothesis_groups:
    - glycosylation_defect_model
  evidence:
  - reference: PMID:31036665
    reference_title: "Mutations in MAGT1 lead to a glycosylation disorder with a variable phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three patients have an N-glycosylation defect, as was shown by the study of
      different substrates, such as GLUT1 and SHBG, demonstrating that the posttranslational
      glycosylation carried out by the STT3B complex is dysfunctional in all three patients.
    explanation: >-
      Demonstrates the N-glycosylation defect across multiple substrates in patients of
      both clinical presentations.
  - reference: PMID:31714901
    reference_title: "Defective glycosylation and multisystem abnormalities characterize the primary immunodeficiency XMEN disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also performed glycoproteomics analysis on T lymphocytes and show that XMEN
      disease is a congenital disorder of glycosylation that affects a restricted subset
      of glycoproteins.
    explanation: >-
      Supports the hypoglycosylation node but qualifies it: the affected glycoprotein set
      is restricted, not the global proteome-wide degradation the generic CDG module
      describes. Recorded as PARTIAL for that reason.
- name: NKG2D Hypoglycosylation and Loss from Cytotoxic Lymphocytes
  biological_scale: CELLULAR
  description: >
    NKG2D, the activating receptor encoded by KLRK1, is underglycosylated at a defined
    site in MAGT1-deficient patients, and its steady-state surface expression on CD8+
    cytotoxic T lymphocytes and NK cells is consequently lost. NKG2D is the best
    characterized but not the only affected client: glycoproteomic work describes a
    restricted set of hypoglycosylated immune glycoproteins also including CD28, HLA-DR
    beta and the T cell receptor alpha chain. Those additional substrates are stated in
    prose only, without an evidence block, because the cited abstracts here support the
    "restricted subset" claim generically rather than naming them. NKG2D and CD70 are required
    for control of Epstein-Barr virus, so this is the proximate immunological lesion.
    Critically, this step is a glycosylation defect and not a magnesium-signalling defect:
    magnesium neither restores NKG2D expression nor rescues the hypoglycosylation.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  downstream:
  - target: Failure of Epstein-Barr Virus Control
    hypothesis_groups:
    - glycosylation_defect_model
  evidence:
  - reference: PMID:35182234
    reference_title: "Lack of NKG2D in MAGT1-deficient patients is caused by hypoglycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that the reduced steady-state levels of NKG2D are caused by
      hypoglycosylation of the protein and we pinpoint the exact site that is
      underglycosylated in MAGT1-deficient patients.
    explanation: >-
      Establishes hypoglycosylation as the cause of NKG2D loss, the mechanistic core of
      this node.
  - reference: PMID:34655400
    reference_title: "A Double-Blind, Placebo-Controlled, Crossover Study of Magnesium Supplementation in Patients with XMEN Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Invariably, XMEN patients have decreased surface expression of the activating receptor
      “natural killer group 2D” (NKG2D) on CD8+ cytotoxic T lymphocytes (CTL) and natural
      killer (NK) cells
    explanation: >-
      Confirms the consistency of the NKG2D surface-expression deficit across patients and
      names the affected cell types.
- name: Failure of Epstein-Barr Virus Control
  biological_scale: ORGANISM
  description: >
    Loss of NKG2D-dependent cytotoxicity leaves EBV-infected B cells inadequately
    controlled. EBV-associated B cell lymphoproliferative disease and lymphoma are the
    commonest causes of morbidity and mortality. Notably, EBV-naive children have a similar
    immunophenotype to EBV-positive patients, so the immune lesion precedes and is
    independent of infection.
  downstream:
  - target: Multisystem Glycoprotein Dysfunction
    hypothesis_groups:
    - glycosylation_defect_model
  evidence:
  - reference: PMID:34655400
    reference_title: "A Double-Blind, Placebo-Controlled, Crossover Study of Magnesium Supplementation in Patients with XMEN Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EBV-associated lymphoproliferative disease (LPD) and lymphoma are the most common
      cause of morbidity and mortality but EBV-naïve children have a similar immunophenotype
      to EBV+ patients
    explanation: >-
      Establishes both the dominant clinical consequence and that the immunophenotype is
      independent of EBV status.
- name: Multisystem Glycoprotein Dysfunction
  biological_scale: ORGANISM
  description: >
    The wider phenotype attributable to hypoglycosylation of client glycoproteins beyond
    the immune compartment: lymphadenopathy, cytopenias, liver disease, cavum septum
    pellucidum, and — in patients ascertained by transferrin screening rather than by
    infection — intellectual and developmental disability as the dominant presentation.
  conforms_to: "congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction"
  evidence:
  - reference: PMID:31714901
    reference_title: "Defective glycosylation and multisystem abnormalities characterize the primary immunodeficiency XMEN disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed lymphadenopathy (LAD), cytopenias, liver disease, cavum septum pellucidum
      (CSP), and increased CD4-CD8-B220-TCRαβ+ T cells (αβDNTs), in addition to the
      previously described features of an inverted CD4/CD8 ratio, CD4+ T lymphocytopenia,
      increased B cells, dysgammaglobulinemia, and decreased expression of the natural
      killer group 2, member D (NKG2D) receptor.
    explanation: >-
      Enumerates the multisystem abnormalities in a 23-patient cohort.

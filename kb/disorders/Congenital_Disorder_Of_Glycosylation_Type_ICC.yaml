name: Congenital Disorder of Glycosylation, Type ICC
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
synonyms:
- CDG1CC
- MAGT1-CDG
- Congenital disorder of glycosylation, type Icc, X-linked recessive
- XMEN disease
- XMEN syndrome
- X-linked immunodeficiency with magnesium defect, EBV infection and neoplasia
- X-linked MAGT1 deficiency with increased susceptibility to Epstein-Barr virus infection and N-linked glycosylation defect
- MAGT1 deficiency
description: >
  Congenital disorder of glycosylation type ICC (MAGT1-CDG) is an X-linked recessive
  disorder caused by loss-of-function mutations in MAGT1. MAGT1 is a subunit of the
  oligosaccharyltransferase (OST) complex, specifically of the STT3B complex, which
  performs post-translational N-glycosylation. Loss of MAGT1 therefore produces a
  glycosylation defect detectable as abnormal serum transferrin glycosylation and as
  hypoglycosylation of a restricted subset of client glycoproteins.

  The disorder is curated here as ONE disease with TWO clinical presentations, following
  the delineation of MAGT1-CDG in the primary literature: a primary immunodeficiency
  (historically named XMEN) and an intellectual and developmental disability phenotype.
  The immunodeficiency arm is dominated by failure to control Epstein-Barr virus, with
  EBV-associated B cell lymphoproliferative disease and lymphoma the commonest causes of
  morbidity and mortality, together with lymphadenopathy, cytopenias, liver disease and
  recurrent sinopulmonary infection.

  The mechanistic history of this disorder matters for curation and is modelled
  explicitly below. MAGT1 was originally characterized as a magnesium transporter, and
  the loss of the activating receptor NKG2D from CD8+ T cells and NK cells was attributed
  to a Mg2+ homeostasis defect. That model has been superseded: the NKG2D deficit is
  caused by hypoglycosylation of the receptor at a defined site, and a randomized,
  double-blind, placebo-controlled crossover trial of magnesium supplementation was
  stopped without any change in EBV or NKG2D status. Magnesium supplementation should
  not be curated as an effective therapy for this disorder.

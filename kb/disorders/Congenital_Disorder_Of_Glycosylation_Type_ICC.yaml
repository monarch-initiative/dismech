- category: Laboratory
  name: Abnormal Serum Transferrin Glycosylation
  description: >
    Defective serum transferrin glycosylation, the screening abnormality that identified
    the neurodevelopmental presentation and the classic marker of a congenital disorder of
    glycosylation.
  phenotype_term:
    preferred_term: Type I transferrin isoform profile
    term:
      id: HP:0003642
      label: Type I transferrin isoform profile
  notes: >-
    The cited PMID reports "defective serum transferrin glycosylation" without naming the
    isoform pattern, so the type I binding is not a quoted claim from that source. It is
    supported by three converging lines: MAGT1 is an OST transfer-step subunit, MONDO
    places this disorder under congenital disorder of glycosylation type I, and an
    independent Perplexity deep-research pass on this disease (NEC preflight PASS,
    references 6/6 verified) found OMIM and MalaCards describing CDG1CC as showing
    "abnormal serum transferrin isoelectric focusing consistent with a type 1 pattern"
    and independently proposed HP:0003642. Recorded here rather than left implicit so a
    reviewer can challenge the inference.

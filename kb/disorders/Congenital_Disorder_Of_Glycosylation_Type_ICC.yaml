treatments:
- name: Magnesium Supplementation (tested and ineffective)
  description: >
    Oral magnesium L-threonate and intravenous magnesium sulfate were tested on the
    now-superseded premise that MAGT1 deficiency is primarily a magnesium-homeostasis
    defect. A randomized, double-blind, placebo-controlled crossover trial (NCT02496676)
    found no change in EBV or NKG2D status, in vitro supplementation of cells from 14
    patients failed to significantly rescue NKG2D expression, and the trial was stopped.
    One EBV-naive patient was withdrawn after asymptomatic elevation of liver enzymes on
    intravenous magnesium sulfate.

    This entry exists to record a negative result, NOT to recommend a therapy. It is
    curated because the magnesium rationale is embedded in this disorder's name and in
    much of its older literature, so a curator or clinician meeting the entry needs to
    find the refutation here rather than infer efficacy from the historical framing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: magnesium sulfate
      term:
        id: CHEBI:32599
        label: magnesium sulfate
  evidence:
  - reference: PMID:34655400
    reference_title: "A Double-Blind, Placebo-Controlled, Crossover Study of Magnesium Supplementation in Patients with XMEN Disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although small, this study indicates magnesium supplementation is unlikely to be an
      effective therapeutic option in XMEN disease.
    explanation: >-
      The trial's own conclusion, refuting magnesium supplementation as a therapy.
  - reference: PMID:34655400
    reference_title: "A Double-Blind, Placebo-Controlled, Crossover Study of Magnesium Supplementation in Patients with XMEN Disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vitro magnesium supplementation experiments in cells from 14 XMEN patients failed
      to significantly rescue NKG2D expression and the clinical trial was stopped.
    explanation: >-
      Records both the in vitro failure and the fact that the trial was halted.
- name: Allogeneic Haematopoietic Stem Cell Transplantation
  description: >
    HSCT is a standard option for some primary immunodeficiencies, but in XMEN it carries
    high mortality because of post-transplant bleeding and is undertaken with extreme
    caution. Recorded with that caveat attached rather than as a routine option — the
    thrombocytopenia present in 70% of patients is the reason.

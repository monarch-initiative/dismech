name: Mitochondrial Complex I Deficiency, Nuclear Type 39
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- MC1DN39
- NDUFB7-related isolated complex I deficiency
- complex I deficiency due to NDUFB7 deficiency
description: >-
  MC1DN39 is isolated mitochondrial complex I deficiency caused by biallelic NDUFB7
  variants. One patient has been reported: intrauterine growth restriction and anemia
  before birth, then hypertrophic cardiomyopathy, lactic acidosis and encephalopathy after
  it, with a fatal outcome.

  For a single-case entity the causal argument is unusually complete, and that is the
  reason this entry is worth having. The variant is intronic, ten bases upstream of an
  exon, and would be easy to dismiss on a variant-call list. What makes it convincing is
  that each step was measured rather than predicted: RNA sequencing showed the splicing
  pattern actually changed, immunoassay showed NDUFB7 protein actually fell, enzymology
  showed complex I activity actually fell, and expressing wild-type NDUFB7 in the patient's
  own fibroblasts brought complex I function back to normal. The rescue is what turns a
  correlation into a demonstration, and it is curated here as a RESCUES link rather than
  buried in prose.

  NDUFB7 is an accessory subunit, not one of the fourteen core subunits that carry the
  enzyme's catalytic function. Accessory subunits were long of unclear necessity, and the
  systematic knockout screen that settled the question found that loss of any one of them
  destabilises the other subunits in its own structural module. That is the general
  principle this entry uses to connect reduced NDUFB7 protein to a failed enzyme, and the
  entry marks it as a general principle: the screen reports the rule across subunits and
  does not, in the record cached here, single out NDUFB7.

  What one patient cannot support is prognosis. The published nuclear complex I deficiency
  series of 130 patients found a wide survival range with no clinical, biochemical or
  genetic parameter predicting it, so this entry does not present the index patient's fatal
  course as the natural history of the disease.

experimental_models:
- name: Patient fibroblasts with wild-type NDUFB7 complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from the index patient, carrying the homozygous intronic variant, in
    which complex I activity was measured before and after expression of wild-type NDUFB7.
    Function normalised on complementation.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Isolated Complex I Enzyme Deficiency
    relationship: RESCUES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The complementation arm is the causality argument for this disease. It tests the
      candidate gene against the biochemical phenotype inside the patient's own genetic
      background, so it is not vulnerable to the objection that some other variant in that
      genome caused the enzyme defect.
    limitations: >-
      Fibroblasts, not heart or brain, so nothing about tissue selectivity or about the
      cardiomyopathy is testable here. The rescue also establishes that NDUFB7 is limiting
      for complex I activity in these cells, not the assembly-level mechanism by which it is
      limiting; no complexome profile or assembly-intermediate analysis has been reported for
      this patient.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The cardiac and neural compartments in which the disease manifests are outside the
        model. A dermal fibroblast has a fraction of the ATP demand of a cardiomyocyte, so
        the model can report the enzyme defect but not the threshold at which it becomes
        organ failure.

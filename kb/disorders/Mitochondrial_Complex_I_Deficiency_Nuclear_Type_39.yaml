    explanation: >-
      The disease class this variant places the patient in, and why a complex I subunit was
      a credible candidate.
- name: Aberrant NDUFB7 Messenger RNA Splicing
  description: >-
    Splicing pattern alterations confirmed by RNA sequencing of patient material. The
    measurement matters more than usual here: for a non-canonical intronic variant, the
    transcript is the only place the effect is visible, and predicting it would not have
    been the same claim.
  biological_scale: MOLECULAR
  downstream:
  - target: Reduced NDUFB7 Protein
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "splicing pattern alterations in NDUFB7 messenger RNA were confirmed by RNA Sequencing"
    explanation: The transcript-level measurement this node records.
- name: Reduced NDUFB7 Protein
  description: >-
    The accessory subunit falls in abundance. NDUFB7 is one of the thirty-one accessory
    subunits of the forty-five-subunit human enzyme, and is not among the fourteen core
    subunits shared with bacterial complex I that carry catalysis.
  biological_scale: MOLECULAR
  downstream:
  - target: Destabilised Assembly of the Complex I Membrane Arm
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The detected variant resulted in a significant reduction of the NDUFB7 protein and reduced complex I activity."
    explanation: >-
      The protein-level measurement, reported together with the enzymatic one it produces.
  - reference: PMID:27626371
    reference_title: "Accessory subunits are integral for assembly and function of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Bacterial and human complex I share 14 core subunits that are essential for enzymatic function; however, the role and necessity of the remaining 31 human accessory subunits is unclear."
    explanation: >-
      Places NDUFB7 in the accessory rather than the core class, which is what determines
      whether its loss is expected to abolish catalysis directly or to act through assembly.
- name: Destabilised Assembly of the Complex I Membrane Arm
  description: >-
    The step from a missing subunit to a broken enzyme. A systematic knockout screen of
    every accessory subunit found that losing any one of them destabilises the other
    subunits sitting in the same structural module, and that twenty-five of the thirty-one
    are strictly required for a functional complex to assemble at all.

    That is the mechanism this node asserts, and it is asserted as a general property of
    accessory subunits rather than as a measurement on NDUFB7. The cached record of the
    screen reports the rule across subunits without naming NDUFB7's module or its individual
    result, and no complexome profile has been published for a MC1DN39 patient. The node is
    marked PROVISIONAL for that reason.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

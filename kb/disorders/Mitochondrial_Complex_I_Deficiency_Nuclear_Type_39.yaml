prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    One functionally proven patient. No prevalence or incidence estimate exists for
    MC1DN39 specifically, and none can be derived from a single case. For context, the
    nuclear complex I deficiency group as a whole has a published series of 130 patients
    across all its genes. See the ascertainment discussion for why the reported count may
    understate the true one: the causal variant class here is deep intronic and is not
    reliably detected by exome sequencing.
  evidence:
  - reference: PMID:22644603
    reference_title: "Natural disease course and genotype-phenotype correlations in Complex I deficiency caused by nuclear gene defects: what we learned from 130 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We review the natural disease course and signs and symptoms of 130 patients (four
      new cases and 126 from literature) with mutations in nuclear genes encoding
      structural complex I proteins or those involved in its assembly.
    explanation: >-
      The size of the whole nuclear complex I deficiency literature, which is the only
      denominator available and covers every gene in the group rather than this one.
genetic:
- name: NDUFB7
  notes: >-
    The causal gene, encoding an accessory subunit of complex I. Not one of the fourteen
    core subunits, which matters mechanistically: the route from a reduced accessory subunit
    to a failed enzyme runs through assembly and module stability rather than through direct
    loss of catalytic capacity.
  gene_term:
    preferred_term: NDUFB7
    term:
      id: hgnc:7702
      label: NDUFB7
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation studies with expression of wild-type NDUFB7 in patient fibroblasts normalized complex I function."
    explanation: >-
      The gene-disease evidence is a rescue rather than a segregation argument, which is
      what a single consanguineous family can offer and is arguably stronger for causality
      than a small pedigree would be.
diagnosis:
- name: Genome sequencing with RNA sequencing, after enzymology shows isolated complex I deficiency
  description: >-
    The diagnostic route that solved this case, and the reason it is worth recording as a
    diagnosis entry rather than assumed. Biochemical testing establishes an isolated complex
    I deficiency, but the genetic confirmation needed two things that are not routine.

    Whole genome sequencing was needed because the causal variant is intronic and ten bases
    from the acceptor site, outside the coding regions an exome captures reliably and
    outside the canonical splice dinucleotides a coding-focused filter retains. RNA
    sequencing was then needed to show the variant actually altered splicing, rather than
    leaving the claim to a prediction tool. A laboratory running exome-only analysis with
    standard coding filters would have returned no result in this patient.

    The practical consequence for a patient with unexplained isolated complex I deficiency
    is that a negative exome does not exclude a nuclear complex I gene, and that
    reflex RNA sequencing is what converts a candidate non-coding variant into a diagnosis.
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing revealed an intronic biallelic mutation in the NDUFB7 gene (c.113-10C>G) and splicing pattern alterations in NDUFB7 messenger RNA were confirmed by RNA Sequencing."
    explanation: The two technologies the diagnosis required, neither of them first-line.
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The detected variant resulted in a significant reduction of the NDUFB7 protein and reduced complex I activity."
    explanation: >-
      The biochemical confirmation that follows the genetic finding, and which in practice
      usually precedes it as the reason to sequence at all.
experimental_models:
- name: Patient fibroblasts with wild-type NDUFB7 complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from the index patient, carrying the homozygous intronic variant, in
    which complex I activity was measured before and after expression of wild-type NDUFB7.
    Function normalised on complementation.

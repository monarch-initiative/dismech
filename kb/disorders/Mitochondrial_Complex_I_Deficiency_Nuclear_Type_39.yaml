discussions:
- discussion_id: mc1dn39_prognosis_from_one_patient
  kind: KNOWLEDGE_GAP
  prompt: >-
    The first reported MC1DN39 patient died in early infancy whereas the second
    survived on supportive cofactor therapy. What genotype-phenotype determinants
    govern survival and organ tropism across NDUFB7 alleles?
  attaches_to:
  - disease#Mitochondrial Complex I Deficiency, Nuclear Type 39
  - pathophysiology#Bioenergetic Failure in High-Demand Tissues
  rationale: >-
    The two published MC1DN39 patients span fatal neonatal hypertrophic
    cardiomyopathy with severe congenital lactic acidosis (PMID:33502047) and
    long-term survival with pontine abnormality, growth failure, ventral hernia,
    and gastrointestinal pseudo-obstruction stabilised on coenzyme Q10 and
    vitamin B complex (PMID:40025060). Across 130 patients with nuclear gene
    defects causing complex I deficiency, a quarter died before six months and
    three quarters before ten years, yet some survived into adulthood and no
    clinical, biochemical, or genetic parameter predicted longer survival
    (PMID:22644603).

    With only two probands — one homozygous for a non-canonical intronic
    splicing variant and one compound heterozygous for coding variants — the
    determinants of cardiac versus brainstem/visceral predominance and early
    lethality versus prolonged survival remain unresolved. Note also that
    HP:0003811 Neonatal death sits under HPO's mortality branch rather than
    under Phenotypic abnormality, so the fatal neonatal outcome of the index
    case is recorded in prose and here rather than as a phenotypes entry.
  evidence:
  - reference: PMID:22644603
    reference_title: "Natural disease course and genotype-phenotype correlations in Complex I deficiency caused by nuclear gene defects: what we learned from 130 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five percent of the patients died before the age of six months, more than half before the age of two and 75 % before the age of ten years."
    explanation: The survival distribution across the group, which is wide.
  - reference: PMID:22644603
    reference_title: "Natural disease course and genotype-phenotype correlations in Complex I deficiency caused by nuclear gene defects: what we learned from 130 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No clinical, biochemical, or genetic parameters indicating longer survival were found."
    explanation: >-
      Shows that nothing measured predicts survival position across nuclear
      complex I deficiency.
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Such mutations can present a wide range of clinical manifestations, varying from mild deficiencies to severe, lethal disorders."
    explanation: >-
      Notes broad clinical severity heterogeneity across complex I subunit and
      assembly-factor defects.
  - reference: PMID:40025060
    reference_title: "NDUFB7 mutations cause brain neuronal defects, lactic acidosis, and mitochondrial dysfunction in humans and zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A patient carrying a homozygous NDUFB7 intronic mutation died within two months after birth due to cardiorespiratory defects, preventing further study. Here, we report another patient with compound heterozygous mutations in NDUFB7 who suffers from pons abnormality, lactic acidosis, prematurity, prenatal and postnatal growth deficiency, incomplete closure of the abdominal wall (ventral hernia), and a poorly functioning gastrointestinal tract (pseudo-obstruction)."
    explanation: >-
      Directly contrasts the fatal neonatal index presentation with the
      surviving compound-heterozygous second proband.
- discussion_id: mc1dn39_module_mechanism_is_generic
  kind: KNOWLEDGE_GAP
  prompt: >-
    Patient fibroblasts confirm impaired complex I assembly and supercomplex
    loss in NDUFB7 deficiency, but how do distinct intronic versus coding NDUFB7
    variants differentially perturb subassembly intermediates across target
    tissues?
  attaches_to:
  - pathophysiology#Destabilised Assembly of the Complex I Membrane Arm
  rationale: >-
    Skin fibroblasts from the compound-heterozygous proband demonstrate
    deficient complex I assembly and reduced respiratory supercomplex formation
    (PMID:40025060), corroborating the general knockout-screen principle that
    loss of individual human complex I accessory subunits destabilises partner
    subunits within their structural module (PMID:27626371). However, high-depth
    quantitative complexome profiling across cardiomyocytes, CNS neurons, and
    enteric smooth muscle/neurons comparing splicing-hypomorphic versus coding
    missense/in-frame-deletion alleles has not yet been performed.
  evidence:
  - reference: PMID:40025060
    reference_title: "NDUFB7 mutations cause brain neuronal defects, lactic acidosis, and mitochondrial dysfunction in humans and zebrafish."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrated that the patient's skin fibroblasts are deficient in Complex I assembly and reduced supercomplex formation."
    explanation: >-
      Establishes impaired complex I assembly and supercomplex loss in patient
      dermal fibroblasts, leaving tissue-specific subassembly stoichiometry open.
  - reference: PMID:27626371
    reference_title: "Accessory subunits are integral for assembly and function of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we use gene editing to generate human knockout cell lines for each accessory subunit."
    explanation: >-
      Isogenic human accessory-subunit knockout panel establishing the reference
      framework for subunit-specific assembly dependence.
- discussion_id: mc1dn39_intronic_variant_ascertainment
  kind: KNOWLEDGE_GAP
  prompt: >-
    The index causal variant is intronic and ten bases from the splice site. How
    many NDUFB7 cases are being missed by exome-only sequencing and coding-region
    filters?
  attaches_to:
  - pathophysiology#Biallelic Intronic NDUFB7 Variant
  - genetic#NDUFB7
  rationale: >-
    Only two unrelated MC1DN39 probands have been reported to date, and one of
    the two carried a homozygous non-canonical intronic variant (c.113-10C>G)
    outside coding exons and canonical splice dinucleotides. Standard exome
    capture and coding-focused variant filters routinely miss or discard such
    alleles; the index case was solved only because whole genome sequencing was
    paired with reflex RNA sequencing. Re-analysis of unsolved isolated complex
    I deficiency cohorts with genome and transcriptome sequencing is needed to
    determine the true contribution of non-coding NDUFB7 alleles.
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing revealed an intronic biallelic mutation in the NDUFB7 gene (c.113-10C>G) and splicing pattern alterations in NDUFB7 messenger RNA were confirmed by RNA Sequencing."
    explanation: >-
      The two technologies that were needed to find and confirm this variant, neither of
      which is standard first-line testing.

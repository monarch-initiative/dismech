    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient presenting intrauterine growth restriction and anemia, which displayed postpartum hypertrophic cardiomyopathy, lactic acidosis, encephalopathy, and a severe complex I defect with fatal outcome."
    explanation: The prenatal features in the index patient.
  - reference: PMID:22644603
    reference_title: "Natural disease course and genotype-phenotype correlations in Complex I deficiency caused by nuclear gene defects: what we learned from 130 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at presentation may vary, but is generally within the first year of life."
    explanation: >-
      The group's usual presentation window, against which a prenatal presentation is early.
- name: Anemia
  category: Hematologic
  description: >-
    Reported prenatally in the index patient. Anemia is not a described feature of nuclear
    complex I deficiency generally, which makes it either a gene-specific feature or an
    incidental finding in a single case; nothing published distinguishes those.

    Left unconnected to the pathograph on purpose. With one patient, no described mechanism,
    and no precedent in the disease group, drawing an edge from bioenergetic failure would
    be inventing the very thing that makes this finding interesting.

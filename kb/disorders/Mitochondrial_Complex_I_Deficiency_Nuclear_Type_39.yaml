biochemical:
- name: NDUFB7 protein abundance and complex I enzyme activity
  notes: >-
    The two measurements that define the disease at the bench, and the pair is more
    informative than either alone. Reduced complex I activity is the entry criterion for
    any isolated complex I deficiency; the specific addition here is that NDUFB7 protein
    itself falls, which points at the accessory subunit as the lesion rather than at a
    catalytic defect in the core enzyme.

    What makes them diagnostic rather than merely descriptive in this disorder is the
    complementation arm: both measures return toward normal when wild-type NDUFB7 is
    expressed in the patient's fibroblasts. That is the assay that would turn a future
    NDUFB7 variant of uncertain significance into a causal one, which matters for a gene
    whose only reported allele is a non-coding splicing change.
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The detected variant resulted in a significant reduction of the NDUFB7 protein and reduced complex I activity."
    explanation: The paired protein and enzyme measurement this record describes.
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation studies with expression of wild-type NDUFB7 in patient fibroblasts normalized complex I function."
    explanation: >-
      The complementation assay that makes the pair interpretable for a variant of
      uncertain significance.
treatments:
- name: Supportive and Symptomatic Management
  description: >-
    There is no disease-modifying therapy for MC1DN39, and none for nuclear complex I
    deficiency generally. Management is symptomatic: treating the lactic acidosis, the
    hypertrophic cardiomyopathy and the encephalopathy as they present.

    This block records the state of the field rather than anything reported for a MC1DN39
    patient. No treatment or treatment response was described for the index case, and with
    one patient no disease-specific management claim is possible.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Bioenergetic Failure in High-Demand Tissues
    description: >-
      Supportive care addresses the organ consequences of the bioenergetic failure. It does
      not act on the assembly defect, and nothing reported does.
  evidence:
  - reference: PMID:28943110
    reference_title: "Therapies for mitochondrial diseases and current clinical trials."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment for mitochondrial diseases remains largely symptomatic and does not significantly alter the course of the disease."
    explanation: >-
      The state of mitochondrial disease therapy, from a review of the field. Evidence
      source is OTHER because this is a narrative review rather than a study, and it is
      cited for the class this disease belongs to rather than for this disease.
- name: Empiric Mitochondrial Cofactor Supplementation
  description: >-
    The vitamin and cofactor combination often given in mitochondrial disease, typically
    including riboflavin, coenzyme Q10, thiamine and carnitine. It is offered because the
    alternative is nothing, not because it has been shown to work: the reviewed evidence
    base is a small number of clinical trials across a heterogeneous group of disorders,
    and no trial has enrolled a patient with this genotype.

    Riboflavin has a mechanistic rationale specific to complex I, since flavin
    mononucleotide is the enzyme's own NADH-oxidising prosthetic group, but that rationale
    is not a result. Nothing here should be read as evidence of benefit in MC1DN39.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
    - preferred_term: carnitine
      term:
        id: CHEBI:17126
        label: carnitine
  target_mechanisms:
  - target: Isolated Complex I Enzyme Deficiency
    description: >-
      The stated aim is to enhance residual electron transfer chain function rather than to
      restore complex I assembly. Whether that is achievable when the enzyme cannot be
      assembled is exactly the untested question.
  evidence:
  - reference: PMID:28943110
    reference_title: "Therapies for mitochondrial diseases and current clinical trials."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic strategies for mitochondrial diseases include the use of agents enhancing
      electron transfer chain function (coenzyme Q10, idebenone, riboflavin, dichloroacetate,
      and thiamine), agents acting as energy buffer (creatine), antioxidants (vitamin C,
      vitamin E, lipoic acid, cysteine donors, and EPI-743), amino acids restoring nitric
      oxide production (arginine and citrulline), cardiolipin protector (elamipretide),
      agents enhancing mitochondrial biogenesis (bezafibrate, epicatechin, and RTA 408),
      nucleotide bypass therapy, liver transplantation, and gene therapy.
    explanation: >-
      The agents in question and the category they are placed in. Cited for what is used in
      the field, not for efficacy in this disorder.
  - reference: PMID:28943110
    reference_title: "Therapies for mitochondrial diseases and current clinical trials."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Based on limited number of clinical trials, several agents aiming at enhancing mitochondrial function or treating the consequences of mitochondrial dysfunction have been used."
    explanation: >-
      The strength of the evidence base behind these agents, in the reviewers' own words.
      Quoted here rather than paraphrased because the hedge is the point.
discussions:
- discussion_id: mc1dn39_prognosis_from_one_patient
  kind: KNOWLEDGE_GAP
  prompt: >-
    The one reported MC1DN39 patient died. Is MC1DN39 a lethal neonatal disorder, or is that
    one point on a range nobody has sampled?
  attaches_to:
  - disease#Mitochondrial Complex I Deficiency, Nuclear Type 39
  - pathophysiology#Bioenergetic Failure in High-Demand Tissues
  rationale: >-
    This is the gap most likely to be answered wrongly by inference, because a single fatal
    case reads as a prognosis unless something stops it.

    The group-level data say stop. Across 130 patients with nuclear gene defects causing
    complex I deficiency, a quarter died before six months and three quarters before ten
    years, but some recovered skills and some were alive in their thirties, and the authors
    reported that no clinical, biochemical or genetic parameter predicted longer survival.
    A range that wide, with no predictor, means one observation carries almost no
    information about the next patient.

    There is also a specific reason to expect variability for this gene in particular. The
    reported allele is an intronic splicing variant, which produces a quantitative rather
    than an absolute reduction in protein; a different NDUFB7 allele producing a different
    residual level could plausibly give a different course. That is speculation, but it is
    speculation the evidence base cannot currently rule out, which is precisely why the
    entry does not state a prognosis.

    A note on how the fatal outcome is recorded. It is not curated as a phenotype: HP:0003811
    Neonatal death sits under HPO's mortality branch rather than under Phenotypic
    abnormality, so it is outside the PhenotypeTerm dynamic enum and cannot be bound in a
    phenotypes entry. The outcome therefore lives in this discussion and in the entry
    description, which is the right place for it given that it is one observation rather
    than a disease feature, but the constraint is the schema's rather than a curation
    decision.
  evidence:
  - reference: PMID:22644603
    reference_title: "Natural disease course and genotype-phenotype correlations in Complex I deficiency caused by nuclear gene defects: what we learned from 130 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five percent of the patients died before the age of six months, more than half before the age of two and 75 % before the age of ten years."
    explanation: The survival distribution across the group, which is wide.
  - reference: PMID:22644603
    reference_title: "Natural disease course and genotype-phenotype correlations in Complex I deficiency caused by nuclear gene defects: what we learned from 130 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No clinical, biochemical, or genetic parameters indicating longer survival were found."
    explanation: >-
      That nothing measured predicts position within that range, which is what makes a
      single case uninformative about prognosis.
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Such mutations can present a wide range of clinical manifestations, varying from mild deficiencies to severe, lethal disorders."
    explanation: >-
      The reporting authors say the same thing about complex I mutations generally, in the
      paper describing the fatal case.
- discussion_id: mc1dn39_module_mechanism_is_generic
  kind: KNOWLEDGE_GAP
  prompt: >-
    The step from reduced NDUFB7 to a destabilised complex is taken from a screen of
    accessory subunits in general. Which module does NDUFB7 belong to, and is it one of the
    twenty-five strictly required subunits?
  attaches_to:
  - pathophysiology#Destabilised Assembly of the Complex I Membrane Arm
  rationale: >-
    The entry's causal chain has one link that is not measured for this gene, and it is
    worth naming rather than leaving a reader to notice.

    The knockout screen established a rule: losing an accessory subunit destabilises the
    other subunits in its own structural module, and twenty-five of thirty-one accessory
    subunits are strictly required for a functional complex. The record cached for this
    entry states the rule and the count without naming NDUFB7's module or reporting its
    individual result, so the entry applies a strong prior rather than a finding. Six
    accessory subunits are not strictly required, and nothing here excludes NDUFB7 being one
    of them, with the enzyme defect in this patient arising some other way.

    Two things would close it and neither is expensive. The screen's own supplementary data
    almost certainly contain the NDUFB7 knockout line's result, which would settle the
    general question immediately. A complexome profile or blue native analysis of the
    patient's fibroblasts, which already exist and already showed the enzyme defect, would
    settle the specific one and say whether assembly stalls at an identifiable intermediate.
  evidence:
  - reference: PMID:27626371
    reference_title: "Accessory subunits are integral for assembly and function of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we use gene editing to generate human knockout cell lines for each accessory subunit."
    explanation: >-
      The screen covers every accessory subunit, so an NDUFB7-specific answer exists in
      principle; what the cached record does not carry is that answer.
- discussion_id: mc1dn39_intronic_variant_ascertainment
  kind: KNOWLEDGE_GAP
  prompt: >-
    The causal variant is intronic and ten bases from the splice site. How many NDUFB7 cases
    are being missed by exome sequencing and coding-region filters?
  attaches_to:
  - pathophysiology#Biallelic Intronic NDUFB7 Variant
  - genetic#NDUFB7
  rationale: >-
    Worth recording because it bears on why this disorder has one patient, and the answer is
    not necessarily that it is vanishingly rare.

    A c.113-10C>G change is outside the coding sequence and outside the canonical splice
    dinucleotides. Exome capture may not cover it well, standard variant filtering usually
    discards it, and in silico splice prediction is the only thing that would flag it. This
    case was solved because the group ran whole genome sequencing and then sequenced the RNA
    to check what the variant actually did. A laboratory doing exome-only analysis with
    coding filters would have found nothing in this patient.

    So the reported frequency of MC1DN39 is a statement about how the group has been
    ascertained as much as about how often the disease occurs. Re-analysis of unsolved
    isolated complex I deficiency cohorts with genome sequencing plus RNA sequencing is the
    obvious test, and it is the same test that would answer the prognosis gap above by
    supplying more patients.
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing revealed an intronic biallelic mutation in the NDUFB7 gene (c.113-10C>G) and splicing pattern alterations in NDUFB7 messenger RNA were confirmed by RNA Sequencing."
    explanation: >-
      The two technologies that were needed to find and confirm this variant, neither of
      which is standard first-line testing.

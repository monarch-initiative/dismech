    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation studies with expression of wild-type NDUFB7 in patient fibroblasts normalized complex I function."
    explanation: >-
      The rescue experiment. This is the strongest single piece of evidence in the entry
      because it tests the gene against the phenotype within one patient's own cells.
- name: Bioenergetic Failure in High-Demand Tissues
  description: >-
    Reduced electron transfer through complex I lowers oxidative phosphorylation output,
    and the tissues that decompensate first are the ones with the highest ATP demand: heart
    and brain. The clinical picture in the index patient follows that pattern, with
    hypertrophic cardiomyopathy and encephalopathy, and the anaerobic compensation shows as
    lactic acidosis.

    The tissue-selectivity reasoning is standard mitochondrial-medicine inference rather
    than a measurement in this patient, so the node is marked PROVISIONAL. No cardiac or
    brain tissue enzymology was reported.
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL

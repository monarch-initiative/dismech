    snippet: "Complementation studies with expression of wild-type NDUFB7 in patient fibroblasts normalized complex I function."
    explanation: >-
      The complementation assay that makes the pair interpretable for a variant of
      uncertain significance.
treatments:
- name: Supportive and Symptomatic Management
  description: >-
    There is no disease-modifying therapy for MC1DN39, and none for nuclear complex I
    deficiency generally. Management is symptomatic: treating the lactic acidosis, the
    hypertrophic cardiomyopathy and the encephalopathy as they present.

    This block records the state of the field rather than anything reported for a MC1DN39
    patient. No treatment or treatment response was described for the index case, and with
    one patient no disease-specific management claim is possible.

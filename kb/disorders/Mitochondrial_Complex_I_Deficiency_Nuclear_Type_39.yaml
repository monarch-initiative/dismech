  modeled_mechanisms:
  - target: Isolated Complex I Enzyme Deficiency
    relationship: RESCUES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The complementation arm is the causality argument for this disease. It tests the
      candidate gene against the biochemical phenotype inside the patient's own genetic
      background, so it is not vulnerable to the objection that some other variant in that
      genome caused the enzyme defect.
    limitations: >-
      Fibroblasts, not heart or brain, so nothing about tissue selectivity or about the
      cardiomyopathy is testable here. The rescue also establishes that NDUFB7 is limiting
      for complex I activity in these cells, not the assembly-level mechanism by which it is
      limiting; no complexome profile or assembly-intermediate analysis has been reported for
      this patient.

- name: NDUFB7
  notes: >-
    The causal gene, encoding an accessory structural subunit of the membrane arm
    of mitochondrial complex I. Both homozygous non-canonical intronic splicing
    (c.113-10C>G; PMID:33502047) and compound heterozygous coding variants
    (PMID:40025060) cause complex I assembly failure and clinical mitochondrial
    disease.

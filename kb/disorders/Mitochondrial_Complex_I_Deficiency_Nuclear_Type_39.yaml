    explanation: The cardiac phenotype in the index patient.
- name: Encephalopathy
  category: Neurological
  description: >-
    Neonatal encephalopathy. Brain involvement is near-universal across nuclear complex I
    deficiency, where the 130-case series found that virtually all children ultimately
    develop Leigh syndrome or leukoencephalopathy; no neuroimaging pattern has been reported
    for this subtype.
  phenotype_term:
    preferred_term: Encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  evidence:
  - reference: PMID:22644603
    reference_title: "Natural disease course and genotype-phenotype correlations in Complex I deficiency caused by nuclear gene defects: what we learned from 130 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Virtually all children ultimately develop Leigh syndrome or leukoencephalopathy."
    explanation: >-
      The neurological trajectory of the group. Cited for the class rather than this
      subtype, because the index patient died before a trajectory could be observed.
- name: Intrauterine growth retardation
  category: Growth
  description: >-
    Present before birth, alongside anemia. Prenatal onset is worth noting because it places
    the bioenergetic failure in fetal life rather than at the neonatal metabolic transition,
    and because a fetal presentation is not typical of the group, whose age at presentation
    is generally within the first year.

    This phenotype is deliberately left without an incoming causal edge. Reading it as
    systemic bioenergetic failure is plausible and is what the deep-research report does,
    but no source measures a route from complex I deficiency to fetal growth restriction in
    this patient or in this gene, and an uncited edge would assert one. The same applies to
    the anemia below, more strongly.
  phenotype_term:
    preferred_term: Intrauterine growth retardation
    term:
      id: HP:0001511
      label: Intrauterine growth retardation

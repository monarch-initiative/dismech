    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27626371
    reference_title: "Accessory subunits are integral for assembly and function of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Quantitative proteomic analysis of cell lines revealed that loss of each subunit affects the stability of other subunits residing in the same structural module."
    explanation: >-
      The module-destabilisation principle that connects a reduced accessory subunit to a
      failed enzyme. Measured across the accessory subunit knockout panel, not specifically
      on NDUFB7.
  - reference: PMID:27626371
    reference_title: "Accessory subunits are integral for assembly and function of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that 25 subunits are strictly required for assembly of a functional complex and 1 subunit is essential for cell viability."
    explanation: >-
      How often the principle holds, which sets the prior for NDUFB7 being one of the
      required ones. It also leaves six accessory subunits that are not, so this is a strong
      prior and not a demonstration.
- name: Isolated Complex I Enzyme Deficiency
  description: >-
    Complex I activity is reduced with the other respiratory chain complexes intact, which
    is what makes the deficiency isolated. This node is where the causal argument closes:
    expressing wild-type NDUFB7 in the patient's own fibroblasts normalised complex I
    function, so the enzyme defect is attributable to NDUFB7 and not to an unrelated
    variant carried by the same patient.
  biological_scale: CELLULAR
  molecular_functions:

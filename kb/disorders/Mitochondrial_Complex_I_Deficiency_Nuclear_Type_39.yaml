name: Mitochondrial Complex I Deficiency, Nuclear Type 39
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- MC1DN39
- NDUFB7-related isolated complex I deficiency
- complex I deficiency due to NDUFB7 deficiency
description: >-
  MC1DN39 is isolated mitochondrial complex I deficiency caused by biallelic
  NDUFB7 variants. Two unrelated probands define the clinical spectrum to date:
  an index infant homozygous for a non-canonical intronic variant (c.113-10C>G)
  who presented prenatally with intrauterine growth restriction and anemia and
  died in early infancy from hypertrophic cardiomyopathy, severe congenital
  lactic acidosis, and encephalopathy (PMID:33502047); and a surviving female
  proband with compound heterozygous NDUFB7 variants presenting with prematurity,
  prenatal and postnatal growth deficiency, lactic acidosis, pontine brain
  abnormality, ventral hernia, and gastrointestinal pseudo-obstruction who
  stabilised clinically on coenzyme Q10 and vitamin B complex supplementation
  (PMID:40025060).

  Functional studies across both patients close the causal chain from gene to
  organelle. In the index case, RNA sequencing confirmed altered NDUFB7
  messenger RNA splicing, protein and enzyme assays demonstrated reduced NDUFB7
  abundance and complex I deficiency, and lentiviral expression of wild-type
  NDUFB7 in patient fibroblasts normalised complex I function. In the second
  case, patient skin fibroblasts directly demonstrated deficient complex I
  assembly and reduced respiratory supercomplex formation, while morpholino
  knockdown of ndufb7 in zebrafish embryos recapitulated brain ventricular and
  neuronal defects, elevated lactic acid, and reduced mitochondrial oxygen
  consumption — all rescued by ectopic ndufb7 expression and ameliorated by
  mitoquinone mesylate (MitoQ).
notes: >-
  PMID:26425749 ("Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview") is
  tagged in references as the closest GeneReviews overview for nuclear-encoded
  oxidative phosphorylation complex I defects, following sibling MC1DN entries,
  but is not cited as evidence because its cached PubMed record contains only a
  chapter purpose statement without a clinical-characteristics table, and no
  NDUFB7-specific GeneReviews or StatPearls chapter exists. Phenotypes and
  mechanisms are curated from the two primary NDUFB7 patient and zebrafish
  reports (PMID:33502047; PMID:40025060) and the 130-case nuclear complex I
  deficiency series (PMID:22644603).

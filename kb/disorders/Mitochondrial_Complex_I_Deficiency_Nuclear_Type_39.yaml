      Places NDUFB7 in the accessory rather than the core class, which is what determines
      whether its loss is expected to abolish catalysis directly or to act through assembly.
- name: Destabilised Assembly of the Complex I Membrane Arm
  description: >-
    Loss or alteration of the accessory subunit NDUFB7 disrupts assembly of
    mitochondrial complex I and reduces respiratory chain supercomplex
    formation. A systematic knockout screen across all 31 human complex I
    accessory subunits established that loss of an individual subunit
    destabilises partner subunits within its structural module, with 25 strictly
    required for holoenzyme assembly (PMID:27626371), and blue-native analyses
    of skin fibroblasts from the second MC1DN39 proband directly confirmed
    deficient complex I assembly and reduced supercomplex formation
    (PMID:40025060).

biochemical:
- name: NDUFB7 protein abundance and complex I enzyme activity
  notes: >-
    The two measurements that define the disease at the bench, and the pair is more
    informative than either alone. Reduced complex I activity is the entry criterion for
    any isolated complex I deficiency; the specific addition here is that NDUFB7 protein
    itself falls, which points at the accessory subunit as the lesion rather than at a
    catalytic defect in the core enzyme.

    What makes them diagnostic rather than merely descriptive in this disorder is the
    complementation arm: both measures return toward normal when wild-type NDUFB7 is
    expressed in the patient's fibroblasts. That is the assay that would turn a future
    NDUFB7 variant of uncertain significance into a causal one, which matters for a gene
    whose only reported allele is a non-coding splicing change.
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: IN_VITRO

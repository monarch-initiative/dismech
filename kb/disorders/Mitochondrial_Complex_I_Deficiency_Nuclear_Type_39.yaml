pathophysiology:
- name: Biallelic Intronic NDUFB7 Variant
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  description: >-
    Biallelic loss-of-function variants in NDUFB7 — exemplified by the index
    homozygous c.113-10C>G non-canonical intronic change ten bases upstream of
    the splice acceptor site (PMID:33502047) as well as compound heterozygous
    coding variants in a second proband (PMID:40025060) — impair expression or
    incorporation of the accessory subunit NDUFB7 required for mitochondrial
    complex I membrane-arm biogenesis.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline biallelic intronic splicing or coding NDUFB7 variants deplete
      functional NDUFB7 accessory subunit and impair complex I assembly.

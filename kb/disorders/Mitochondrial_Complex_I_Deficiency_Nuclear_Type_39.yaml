pathophysiology:
- name: Biallelic Intronic NDUFB7 Variant
  description: >-
    A homozygous c.113-10C>G change in an NDUFB7 intron, ten bases upstream of the acceptor
    site. This is the class of variant that routine filtering discards: it is not coding,
    not canonical splice-site, and would be scored by most in silico splice predictors
    rather than observed. It was found by whole genome sequencing and taken seriously
    because the RNA was sequenced too.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NDUFB7
    term:
      id: hgnc:7702
      label: NDUFB7
  downstream:
  - target: Aberrant NDUFB7 Messenger RNA Splicing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33502047
      reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole genome sequencing revealed an intronic biallelic mutation in the NDUFB7 gene (c.113-10C>G) and splicing pattern alterations in NDUFB7 messenger RNA were confirmed by RNA Sequencing."
      explanation: >-
        Evidence for this specific edge: the same sentence reports the variant and the
        measured splicing consequence, which is what makes the intronic change actionable
        rather than a candidate.
  evidence:
  - reference: PMID:33502047
    reference_title: "Severe congenital lactic acidosis and hypertrophic cardiomyopathy caused by an intronic variant in NDUFB7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

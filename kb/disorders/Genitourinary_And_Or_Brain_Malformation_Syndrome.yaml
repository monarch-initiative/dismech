animal_models:
- name: Zebrafish mypt1 mutant
  species: Zebrafish
  genotype: mypt1 loss-of-function mutant
  publication: PMID:20147380
  description: >-
    A zebrafish mypt1 mutant shows excess myosin activity and failed epithelial
    relaxation, impairing brain ventricle expansion and hindbrain morphogenesis -
    the contractility and morphogenesis mechanism proposed for the human disease.
  modeled_mechanisms:
  - target: Excess Actomyosin Contractility
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces the overactive myosin and failed epithelial relaxation downstream of lost myosin phosphatase regulation.
    limitations: >-
      A whole-gene zebrafish mutant modelling a human heterozygous
      haploinsufficiency, assayed in hindbrain/ventricle morphogenesis; the human
      forebrain, genitourinary and gut malformations were not examined.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The study assayed hindbrain and ventricle morphogenesis only; the human
        malformation sites (forebrain midline, genitourinary tract, gut), which
        zebrafish possess, were not examined, so the model captures the
        contractility mechanism rather than the disease malformations.
    evidence:
    - reference: PMID:20147380
      reference_title: Epithelial relaxation mediated by the myosin phosphatase regulator Mypt1 is required for brain ventricle lumen expansion and hindbrain morphogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A mutation in the myosin phosphatase regulator mypt1 results in a small ventricle due to impaired stretching of the surrounding neuroepithelium."

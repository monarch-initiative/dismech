name: PPP1R12A-Related Urogenital and/or Brain Malformation Syndrome
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- GUBS
- urogenital and/or brain malformation syndrome
- UBMS
- PPP1R12A-related urogenital and/or brain malformation syndrome
description: >-
  Genitourinary and/or brain malformation syndrome (GUBS) is a rare autosomal
  dominant congenital multiple-malformation syndrome caused by heterozygous,
  usually de novo, loss-of-function variants in PPP1R12A, which encodes MYPT1, the
  regulatory subunit that targets protein phosphatase 1 to myosin and forms the
  myosin phosphatase complex. Affected individuals have malformations of the brain
  (most severely on the holoprosencephaly spectrum, with agenesis of the corpus
  callosum and, at the extreme, anencephaly) and/or the genitourinary system, and
  46,XY individuals frequently have a difference of sex development with gonadal
  dysgenesis, undermasculinization and persistent Mullerian derivatives.
  Gastrointestinal atresias, developmental delay, intellectual disability,
  seizures and eye anomalies also occur. Around two dozen individuals have been
  reported; both brain and genitourinary involvement in the same person is the
  minority.

  MYPT1 haploinsufficiency reduces myosin phosphatase activity, leaving myosin
  regulatory light chain over-phosphorylated and actomyosin contractility
  excessive; this disrupts the cell-shape change, epithelial relaxation and
  collective migration that embryonic morphogenesis depends on. The same
  mechanism acts at distinct sites and critical periods - the prosencephalic
  neural folds (forebrain midline division), the genital tubercle and lower
  urinary tract (urogenital development), and the gut - producing the
  branch-specific malformations. The human relevance of the contractility step
  is inferred from model organisms.
disease_term:
  preferred_term: genitourinary and/or brain malformation syndrome
  term:
    id: MONDO:0032934
    label: genitourinary and/or brain malformation syndrome
parents:
- Neurodevelopmental Disorder
- Disorder of Sex Development
- Genetic Disease
notes: >-
  MONDO:0032934 cross-references OMIM 618820 (GUBS); the gene is PPP1R12A/MYPT1
  (OMIM 602021). ClinGen (Syndromic Disorders GCEP, 2021) rates PPP1R12A for this
  disease Strong (AD). The GeneReviews chapter (Alkhunaizi & Chitayat,
  "PPP1R12A-Related Urogenital and/or Brain Malformation Syndrome") is the
  phenotype baseline. The contractility and morphogenesis steps are shown in
  zebrafish and mouse; their operation in human embryos is inferred. No
  genotype-phenotype correlation has been identified.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous loss-of-function PPP1R12A variants, usually de novo; haploinsufficiency
    is the proposed mechanism. Contiguous 12q21 deletions including PPP1R12A cause an
    overlapping phenotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31883643
    reference_title: "Loss-of-Function Variants in PPP1R12A: From Isolated Sex Reversal to Holoprosencephaly Spectrum and Urogenital Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified twelve individuals with de novo loss-of-function (LoF) variants in protein phosphatase 1, regulatory subunit 12a (PPP1R12A)"
    explanation: Heterozygous de novo loss-of-function variants, consistent with autosomal dominant inheritance.
pathophysiology:
- name: PPP1R12A (MYPT1) Loss of Function
  description: >-
    A heterozygous loss-of-function PPP1R12A variant (nonsense, frameshift or
    splice) reduces functional MYPT1 by about half (haploinsufficiency); a
    truncated protein can also fail to bind the PP1 catalytic subunit PPP1CB.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PPP1R12A
    term:
      id: hgnc:7618
      label: PPP1R12A
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: myosin phosphatase activity
    modifier: DECREASED
    term:
      id: GO:0017018
      label: myosin phosphatase activity
  downstream:
  - target: Excess Actomyosin Contractility
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31883643
    reference_title: "Loss-of-Function Variants in PPP1R12A: From Isolated Sex Reversal to Holoprosencephaly Spectrum and Urogenital Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it has intolerance to LoF as illustrated by a very low observed-to-expected ratio of LoF variants in gnomAD"
    explanation: PPP1R12A is loss-of-function intolerant, consistent with a haploinsufficiency mechanism.
  - reference: PMID:39334371
    reference_title: Functional analysis of a novel nonsense PPP1R12A variant in a Chinese family with infantile epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Co-IP indicated that the mutant protein no longer interacted with PPP1CB, indicating an effect on the structural stability of the myosin phase complex."
    explanation: A truncating variant abolishes MYPT1 binding to the PP1 catalytic subunit.
- name: Excess Actomyosin Contractility
  description: >-
    With reduced myosin phosphatase activity the myosin regulatory light chain
    stays over-phosphorylated, so actomyosin contractility is excessive and
    sustained rather than dynamically regulated.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: actomyosin structure organization
    modifier: ABNORMAL
    term:
      id: GO:0031032
      label: actomyosin structure organization
  downstream:
  - target: Disrupted Cell Migration and Epithelial Morphogenesis
    causal_link_type: DIRECT
  - target: Impaired Digestive Tract Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:20147380
    reference_title: Epithelial relaxation mediated by the myosin phosphatase regulator Mypt1 is required for brain ventricle lumen expansion and hindbrain morphogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By contrast, mutants show continuously high pMRLC levels, with concentration of pMRLC and myosin II at the apical side of the epithelium"
    explanation: Loss of the myosin phosphatase regulator leaves myosin light chain persistently phosphorylated (excess contractility).
  - reference: PMID:20147380
    reference_title: Epithelial relaxation mediated by the myosin phosphatase regulator Mypt1 is required for brain ventricle lumen expansion and hindbrain morphogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "indicating that each defect is a consequence of overactive myosin"
    explanation: The morphogenetic defects are consequences of the overactive myosin.
- name: Disrupted Cell Migration and Epithelial Morphogenesis
  description: >-
    Excess contractility disrupts cell-shape change, epithelial relaxation and
    collective cell migration in embryonic tissues; the same defect acts at
    distinct sites and critical periods to produce the forebrain and genitourinary
    malformations.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: cell migration
    modifier: ABNORMAL
    term:
      id: GO:0016477
      label: cell migration
  downstream:
  - target: Failed Forebrain Midline Division
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Genitourinary Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31883643
    reference_title: "Loss-of-Function Variants in PPP1R12A: From Isolated Sex Reversal to Holoprosencephaly Spectrum and Urogenital Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an important developmental gene involved in cell migration, adhesion, and morphogenesis"
    explanation: PPP1R12A governs the cell migration, adhesion and morphogenesis disrupted here.
  - reference: PMID:20147380
    reference_title: Epithelial relaxation mediated by the myosin phosphatase regulator Mypt1 is required for brain ventricle lumen expansion and hindbrain morphogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A mutation in the myosin phosphatase regulator mypt1 results in a small ventricle due to impaired stretching of the surrounding neuroepithelium."
    explanation: Impaired epithelial relaxation/stretching is the morphogenetic failure downstream of the contractility defect.
- name: Failed Forebrain Midline Division
  description: >-
    At the prosencephalic neural folds, disrupted morphogenesis is inferred to
    cause failed forebrain midline division, giving the holoprosencephaly spectrum
    and corpus callosum defects.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: forebrain development
    modifier: ABNORMAL
    term:
      id: GO:0030900
      label: forebrain development
  downstream:
  - target: Holoprosencephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31883643
    reference_title: "Loss-of-Function Variants in PPP1R12A: From Isolated Sex Reversal to Holoprosencephaly Spectrum and Urogenital Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "PPP1R12A expression in the prosencephalic neural folds"
    explanation: Expression at the prosencephalic neural folds places the lesion at the site of forebrain midline division.
- name: Impaired Genitourinary Morphogenesis
  description: >-
    In the genital tubercle and lower urinary tract, disrupted morphogenesis is
    inferred to cause the urogenital anomalies and, in 46,XY individuals, gonadal
    dysgenesis, undermasculinization and persistent Mullerian derivatives.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: male genitalia development
    modifier: ABNORMAL
    term:
      id: GO:0030539
      label: male genitalia development
  downstream:
  - target: Female external genitalia in individual with 46,XY karyotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Gonadal dysgenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Persistent Mullerian derivatives
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypospadias
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31883643
    reference_title: "Loss-of-Function Variants in PPP1R12A: From Isolated Sex Reversal to Holoprosencephaly Spectrum and Urogenital Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "protein localization in the lower urinary tract at critical periods for forebrain division and urogenital development"
    explanation: Protein localization in the lower urinary tract at the critical period places the lesion at the site of urogenital development.
  - reference: PMID:36331510
    reference_title: Persistent Müllerian duct syndrome associated with genetic defects in the regulatory subunit of myosin phosphatase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "suggests that myosin phosphatase is involved in Müllerian regression, independently of the anti-Müllerian hormone (AMH) signaling cascade"
    explanation: Myosin phosphatase regulatory-subunit (PPP1R12A) defects impair Mullerian duct regression, independently of AMH signaling.
- name: Impaired Digestive Tract Morphogenesis
  description: >-
    In the gut, epithelial disorganisation from the actomyosin defect - rather than
    altered cell migration - is inferred to cause the jejunal and ileal atresias; a
    medaka Mypt1 model showed the atresia was ameliorated by inhibiting smooth-muscle
    myosin and rescued by blebbistatin, without a change in cell motility.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  biological_processes:
  - preferred_term: digestive tract development
    modifier: ABNORMAL
    term:
      id: GO:0048565
      label: digestive tract development
  downstream:
  - target: Intestinal atresia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:41805950
    reference_title: A genetic model of congenital intestinal atresia implicates Mypt1 in epithelial organisation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of myh11a, encoding smooth muscle (SM) myosin heavy chain, ameliorated the IA phenotype"
    explanation: Inhibiting smooth-muscle myosin ameliorated the intestinal atresia in the medaka Mypt1 model, implicating myosin hyperactivity.
  - reference: PMID:41805950
    reference_title: A genetic model of congenital intestinal atresia implicates Mypt1 in epithelial organisation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These cytoskeletal abnormalities were accompanied by epithelial disorganisation, without notable alterations in cell proliferation, motility or apoptosis."
    explanation: The gut atresia arises from epithelial disorganisation, not altered cell motility, so it is routed from the contractility node rather than the migration node.

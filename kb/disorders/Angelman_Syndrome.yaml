discussions:
- discussion_id: gap_angelman_human_model_fidelity
  prompt: >-
    Which phenotypes and therapeutic-response windows in maternal UBE3A-loss
    models faithfully predict human Angelman syndrome across development?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced neuronal UBE3A protein abundance
  - pathophysiology#Impaired experience-dependent synaptic remodeling
  rationale: >-
    Maternal Ube3a-null mice reproduce useful EEG, seizure, sleep, and synaptic
    phenotypes, but rodent models do not reproduce the entire human syndrome.
    The duration and developmental timing of mouse myelination delay cannot be
    extrapolated directly to people. The newer pig model broadens developmental
    coverage but remains preclinical and has not yet demonstrated predictive
    validity for treatment response.
  evidence:
  - reference: PMID:40690672
    reference_title: "A preclinical pig model of Angelman syndrome mirrors the early developmental trajectory of the human condition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rodent models of Angelman syndrome do not fully recapitulate all the symptoms associated with the condition and are limited as a preclinical model for therapeutic development."
    explanation: Directly states the rodent-model fidelity limitation motivating the pig model.
  - reference: PMID:39726042
    reference_title: "Comparative profiling of white matter development in the human and mouse brain reveals volumetric deficits and delayed myelination in Angelman syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "LIMITATIONS: It is difficult to extrapolate the timing and duration of the myelination delay observed in AS model mice to individuals with AS."
    explanation: Identifies a specific developmental translation limitation.
- discussion_id: gap_angelman_disease_modifying_efficacy
  prompt: >-
    Do UBE3A-ATS-targeting antisense oligonucleotides produce durable, clinically
    meaningful benefit with acceptable long-term safety across AS genotypes and ages?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuron-specific paternal UBE3A silencing
  - pathophysiology#Reduced neuronal UBE3A protein abundance
  rationale: >-
    Rugonersen phase 1 data establish acceptable short-term safety and show
    pharmacodynamic EEG change, but clinical outcomes were exploratory in an
    open-label design. Ongoing randomized phase 3 programs are needed to establish
    efficacy, durability, age-dependent response, genotype effects, and longer-term safety.
  evidence:
  - reference: PMID:40646322
    reference_title: "The UBE3A-ATS antisense oligonucleotide rugonersen in children with Angelman syndrome: a phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary endpoint was met; rugonersen had an acceptable safety and tolerability profile."
    explanation: Establishes the completed primary endpoint without resolving clinical efficacy.
  - reference: PMID:40646322
    reference_title: "The UBE3A-ATS antisense oligonucleotide rugonersen in children with Angelman syndrome: a phase 1 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of exploratory endpoints showed that rugonersen led to a dose-dependent partial normalization of the AS-associated electroencephalogram abnormality and revealed signals of clinical improvement in core AS symptom domains beyond expectation from natural history data."
    explanation: Supports promising exploratory signals while preserving the study's qualification.
- discussion_id: gap_angelman_gastrointestinal_mechanism
  prompt: >-
    Which neural, motor, behavioral, dietary, and treatment-related mechanisms
    account for constipation, reflux, feeding difficulty, and dysphagia in AS?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced neuronal UBE3A protein abundance
  rationale: >-
    Gastrointestinal and swallowing manifestations are frequent in observational
    cohorts, but these studies do not demonstrate a specific autonomic, enteric,

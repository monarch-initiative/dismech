  located_in:
    preferred_term: brain white matter
    term:
      id: UBERON:0003544
      label: brain white matter
  spatial_extent: DIFFUSE
  diagnostic: false
  context: Cohort-level volumetric finding; not an established diagnostic criterion.
  description: >-
    MRI volumetry in children with Angelman syndrome identified early and
    substantial cerebral white-matter volume reduction. Delayed myelination was
    demonstrated in the parallel mouse model, not established in the human cohort.
  evidence:
  - reference: PMID:39726042
    reference_title: "Comparative profiling of white matter development in the human and mouse brain reveals volumetric deficits and delayed myelination in Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data revealed that AS individuals exhibit significant reductions in brain volume by ~ 1 year of age, and by 6-12 years of age WM is reduced by 26% and gray matter by 21%-approximately twice the reductions observed in the adult AS mouse model."
    explanation: Directly supports the age-dependent human MRI volumetric finding while distinguishing it from the mouse myelination result.
diagnosis:
- name: Parent-specific DNA methylation analysis of 15q11.2-q13
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: First-line molecular test in suspected Angelman syndrome.
  results: Detects most cases due to deletion, UPD, or imprinting defect.
  evidence:
  - reference: PMID:20301323
    reference_title: "Angelman Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of parent-specific DNA methylation imprints in the 15q11.2-q13 chromosome region detects approximately 80% of individuals with AS, including those with a deletion, uniparental disomy, or an imprinting defect"
    explanation: Supports methylation analysis as primary diagnostic assay.
- name: UBE3A sequence analysis
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: Reflex molecular testing when methylation study is negative.
  results: Adds diagnostic yield for UBE3A pathogenic variants.
  evidence:
  - reference: PMID:20301323
    reference_title: "Angelman Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UBE3A sequence analysis detects pathogenic variants in an additional approximately 11% of individuals."
    explanation: Supports reflex sequencing after negative methylation testing.
- name: Consensus clinical diagnostic criteria assessment
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: Clinical phenotype evaluation remains central, particularly in molecularly unresolved cases.
  evidence:
  - reference: PMID:20301323
    reference_title: "Angelman Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of AS is established in a proband who meets the consensus clinical diagnostic criteria and/or who has findings on molecular genetic testing that suggest deficient expression or function of the maternally inherited UBE3A allele."
    explanation: Supports integrated clinical-plus-molecular diagnosis.
- name: Electroencephalographic supportive testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: EEG abnormalities are supportive but not fully specific.
  evidence:
  - reference: PMID:20398390
    reference_title: "Epilepsy in patients with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The EEG abnormalities are not themselves pathognomonic of AS and both background activity and epileptic discharges vary even in the same patient with time."
    explanation: Supports EEG as a supportive, non-pathognomonic diagnostic adjunct.
- name: Quantitative EEG (qEEG) as biomarker
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Quantitative EEG features (elevated absolute and relative delta power,
    altered coherence, reduced sleep spindles, genotype-specific spectral
    differences) provide objective biomarkers of network pathology and are being
    used in disease-modifying trials to demonstrate target engagement.
  results: >-
    Elevated broadband delta power, reduced sleep spindles, and increased
    long-range coherence; deletion-genotype-specific theta excess and beta
    deficit.
  evidence:
  - reference: PMID:29719672
    reference_title: "Abnormal coherence and sleep composition in children with Angelman syndrome: a retrospective EEG study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate two quantitative readouts of dysregulated sleep composition in children with AS-gamma coherence and spindles-and describe how functional connectivity patterns may be disrupted during wakefulness."
    explanation: Establishes quantitative EEG features as candidate biomarkers in AS.
  - reference: PMID:30826071
    reference_title: "Electrophysiological Phenotype in Angelman Syndrome Differs Between Genotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found elevated theta power (peak frequency: 5.3 Hz) and diminished beta power (peak frequency: 23 Hz) in the deletion genotype compared with the nondeletion genotype as well as excess broadband EEG power (1-32 Hz) peaking in the delta frequency range (peak frequency: 2.8 Hz), shared by both genotypes but stronger for the deletion genotype at younger ages."
    explanation: Genotype-stratified spectral signatures supporting qEEG as a diagnostic-stratification tool.
  - reference: PMID:35611307
    reference_title: "Longitudinal EEG model detects antisense oligonucleotide treatment effect and increased UBE3A in Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deviations in delta power from a human natural history model in Angelman syndrome can detect antisense oligonucleotide-mediated improvement in Ube3a expression in Angelman syndrome mice and may be relevant for human clinical trials."
    explanation: Supports longitudinal qEEG modeling as a translational biomarker for ASO trials.
  - reference: PMID:33203220
    reference_title: "Quantitative EEG Analysis in Angelman Syndrome: Candidate Method for Assessing Therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support the use of qEEG analysis in evaluating AS and suggest that this technique may be useful to evaluate therapeutic efficacy in AS."
    explanation: Establishes qEEG as a methodological framework for therapeutic assessment in AS.
  - reference: PMID:42321460
    reference_title: "Periodic and aperiodic contributions to EEG delta power are translatable and complementary Angelman syndrome biomarkers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Periodic delta power predicts cognitive ability in children"
    explanation: Supports the human association between periodic delta power and cognitive ability.
  - reference: PMID:42321460
    reference_title: "Periodic and aperiodic contributions to EEG delta power are translatable and complementary Angelman syndrome biomarkers."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "aperiodic features predict motor deficits in mice."
    explanation: Separately supports the model-organism association between aperiodic features and motor deficits.
treatments:
- name: Rugonersen UBE3A-ATS antisense oligonucleotide therapy
  action_category: THERAPEUTIC
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: UBE3A
      term:
        id: hgnc:12496
        label: UBE3A
    target_transcript: UBE3A-ATS long noncoding antisense transcript
  description: >-
    Investigational intrathecal rugonersen (RO7248824) reduces UBE3A-ATS to
    derepress the paternal UBE3A allele. Phase 1 data support safety,
    tolerability, and pharmacodynamic activity; efficacy findings were
    exploratory and do not establish clinical benefit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Neuron-specific paternal UBE3A silencing
    treatment_effect: INHIBITS
    description: Rugonersen reduces the cis-acting UBE3A-ATS transcript that maintains paternal neuronal UBE3A silencing.
    evidence:
    - reference: PMID:40884397
      reference_title: "Angelman syndrome patient-derived neuron screen leads to clinical ASO rugonersen targeting UBE3A-ATS with long-lasting effect in monkeys."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This let to the identification of rugonersen (RO7248824), which selectively and potently reduces UBE3A-ATS and upregulates UBE3A messenger RNA (mRNA) and protein in neurons derived from neurotypical humans, AS patients, and cynomolgus monkeys."
      explanation: Patient-derived neurons directly support target engagement and UBE3A restoration.
  - target: Reduced neuronal UBE3A protein abundance
    treatment_effect: RESTORES
    description: UBE3A-ATS knockdown derepresses paternal UBE3A mRNA and protein in neuronal models.
    evidence:
    - reference: PMID:40884397
      reference_title: "Angelman syndrome patient-derived neuron screen leads to clinical ASO rugonersen targeting UBE3A-ATS with long-lasting effect in monkeys."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Two studies of up to three lumbar intrathecal (IT) rugonersen doses in monkeys showed no adverse effects and produced long-lasting paternal UBE3A mRNA/protein reactivation in key brain regions."
      explanation: Nonhuman-primate studies support sustained paternal UBE3A reactivation in brain regions.
  evidence:
  - reference: PMID:40646322
    reference_title: "The UBE3A-ATS antisense oligonucleotide rugonersen in children with Angelman syndrome: a phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary endpoint was met; rugonersen had an acceptable safety and tolerability profile."
    explanation: Supports the phase 1 primary safety and tolerability outcome in 61 children.
  - reference: PMID:40646322
    reference_title: "The UBE3A-ATS antisense oligonucleotide rugonersen in children with Angelman syndrome: a phase 1 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of exploratory endpoints showed that rugonersen led to a dose-dependent partial normalization of the AS-associated electroencephalogram abnormality and revealed signals of clinical improvement in core AS symptom domains beyond expectation from natural history data."
    explanation: Supports pharmacodynamic and exploratory clinical signals only; the open-label phase 1 design does not establish efficacy.

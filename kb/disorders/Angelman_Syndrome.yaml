notes: >-
  Publication-readiness review completed through 2026-08-05. Multidisciplinary
  symptomatic care remains standard; UBE3A-ATS-targeting antisense programs are
  investigational, and randomized trials have not yet established a
  disease-modifying clinical benefit. Quantitative EEG delta features are
  candidate pharmacodynamic and translational biomarkers. Deletion-type AS has
  more severe and earlier-onset epilepsy, but the independent contribution of
  the codeleted GABA-A receptor cluster remains provisional. OCA2
  haploinsufficiency provides a better-supported deletion-specific explanation
  for hypopigmentation and associated ocular findings.

- name: Ataluren Stop-Codon Readthrough Therapy
  description: >-
    Ataluren plus standard care promotes readthrough of premature stop codons
    for ambulatory patients with nonsense mutation DMD, delaying functional and
    respiratory disease-progression milestones.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ataluren
      term:
        id: CHEBI:94805
        label: 3-[5-(2-fluorophenyl)-1,2,4-oxadiazol-3-yl]benzoic acid
  evidence:
  - reference: PMID:37115359
    reference_title: "Safety and effectiveness of ataluren in patients with nonsense mutation DMD in the STRIDE Registry compared with the CINRG Duchenne Natural History Study (2015–2022): 2022 interim analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kaplan–Meier analyses demonstrated that ataluren plus SoC significantly
      delayed age at loss of ambulation by 4 years (p < 0.0001) and age at
      decline to %-predicted forced vital capacity of < 60% and < 50% by
      1.8 years (p = 0.0021) and 2.3 years (p = 0.0207), respectively, compared
      with SoC alone.
    explanation: >-
      The STRIDE registry compared ataluren plus standard care with CINRG
      natural-history standard care and showed delayed loss of ambulation and
      respiratory decline milestones in nonsense-mutation DMD.
- name: Delandistrogene Moxeparvovec
  description: >-
    AAVrh74-based gene therapy (Elevidys/SRP-9001) that delivers a truncated
    micro-dystrophin transgene to muscle fibers via systemic intravenous
    administration. In a 2026 meta-analysis of ambulatory pediatric DMD
    patients, delandistrogene moxeparvovec significantly improved functional
    outcomes and increased dystrophin expression at 1-year follow-up.
    Administration carries substantial immune-mediated toxicity risk -
    principally AAV-capsid-directed hepatotoxicity (acute liver injury, with
    liver failure and death reported), plus myositis, myocarditis, and
    troponin elevation - requiring immunoprophylaxis and structured
    post-infusion hepatic and cardiac monitoring.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Dystrophin Deficiency
    treatment_effect: RESTORES
    description: >-
      Delivers an AAVrh74-packaged micro-dystrophin transgene to skeletal
      muscle, restoring expression of a functional truncated dystrophin and
      partially compensating for the absent endogenous protein.
    evidence:
    - reference: PMID:42396397
      reference_title: "Duchenne Muscular Dystrophy and Delandistrogene Moxeparvovec Gene Therapy in Children: A Systematic Review and Meta-Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Muscle dystrophin content significantly increased (MD = 28.39, p < 0.01)."
      explanation: >-
        Micro-dystrophin gene transfer significantly increased muscle
        dystrophin content, directly addressing the dystrophin deficiency that
        drives DMD pathophysiology.
  evidence:
  - reference: PMID:42396397
    reference_title: "Duchenne Muscular Dystrophy and Delandistrogene Moxeparvovec Gene Therapy in Children: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 1 year, the therapy significantly improved NSAA scores (MD = 2.48, p = 0.04) and TTR (MD = -0.85, p < 0.01). Sensitivity analysis demonstrated improved 10MWR (MD = -0.71, p = 0.02). Muscle dystrophin content significantly increased (MD = 28.39, p < 0.01)."
    explanation: >-
      2026 systematic review and meta-analysis of 4 studies (302 participants,
      107 on delandistrogene moxeparvovec) demonstrates significant improvement
      in NSAA (a functional outcome measure), time-to-rise, 10-meter walk/run,
      and dystrophin expression at 1-year follow-up in ambulatory pediatric DMD
      patients.
  - reference: PMID:41047627
    reference_title: "Real-world outcomes of delandistrogene moxeparvovec gene therapy: Motor outcomes and emerging safety concerns."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients experienced 15 treatment-related toxicities, and 4 required escalation of corticosteroids. Side effects included gastrointestinal symptoms (n = 7), liver enzyme abnormalities (n = 4), acute liver injury (n = 2), and troponin I elevations (n = 3)."
    explanation: >-
      Prospective real-world cohort of 11 commercially treated ambulatory boys
      documents the treatment-related toxicity burden - including acute liver
      injury and troponin elevation - that counterbalances the efficacy
      evidence above.
  - reference: PMID:41854298
    reference_title: "Sirolimus for the treatment of steroid-refractory hepatotoxicity following AAV gene therapy in patients with Duchenne muscular dystrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "While generally well tolerated, hepatotoxicity has been observed following its administration, leading to liver failure and death in two reported cases to date."
    explanation: >-
      Documents fatal hepatotoxicity as a reported outcome of delandistrogene
      moxeparvovec, the safety signal that gates patient selection and
      post-infusion monitoring.
- name: Sevasemten (EDG-5506)
  description: >-
    Selective, orally active allosteric inhibitor of fast skeletal muscle
    myosin (Edgewise Therapeutics; investigational). Modest reduction of
    fast-fiber contraction is sufficient to protect dystrophin-deficient
    muscle from contraction-induced membrane injury without compromising
    overall strength or coordination.

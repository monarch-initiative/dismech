  evidence:
  - reference: PMID:16770791
    reference_title: "Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Duchenne patients, mutations induce a shift in the reading frame
      leading to prematurely truncated, dysfunctional dystrophins.
    explanation: >-
      The human mutation series establishes the genomic reading-frame lesion
      whose transcript can become an exon-skipping therapeutic substrate.
  - reference: PMID:29752304
    reference_title: "Eteplirsen treatment for Duchenne muscular dystrophy: Exon skipping and dystrophin production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reverse transcription PCR analysis and sequencing of the newly formed
      splice junction confirmed that 100% of treated patients displayed the
      expected skipped exon 51 sequence.
    explanation: >-
      Direct molecular confirmation in an exon-51-amenable subgroup establishes
      that the DMD pre-mRNA can be therapeutically reprocessed by controlled
      exon skipping.
  downstream:
  - target: DMD ASO-Directed Exon Skipping
    description: >-
      When an exon-45-, exon-51-, or exon-53-skipping ASO is administered to the
      matching amenable genotype, steric occupancy of the selected exon redirects
      DMD pre-mRNA processing toward an in-frame transcript. This edge is
      conditional on treatment and is not caused by the untreated lesion alone.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29752304
      reference_title: "Eteplirsen treatment for Duchenne muscular dystrophy: Exon skipping and dystrophin production."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Reverse transcription PCR analysis and sequencing of the newly formed
        splice junction confirmed that 100% of treated patients displayed the
        expected skipped exon 51 sequence.
      explanation: >-
        Sequencing of the treatment-induced junction directly supports the
        intervention-conditioned transition to DMD exon skipping.
- name: DMD ASO-Directed Exon Skipping
  description: >-
    In a patient with a matching exon-45-, exon-51-, or exon-53-skipping-amenable
    genotype, administration of the exon-specific steric ASO occludes the chosen
    DMD pre-mRNA element and causes the spliceosome to omit that exon. This is a
    treatment effector state and is not present without administration of the
    matched ASO.
  role: effector
  biological_scale: MOLECULAR

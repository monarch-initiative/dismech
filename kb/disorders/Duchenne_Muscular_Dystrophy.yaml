- name: Multidisciplinary Care Considerations (2018 DMD Care Considerations, Part 1)
  description: >-
    Standardized, anticipatory multidisciplinary management framework per the
    2018 DMD Care Considerations update (Birnkrant et al., Lancet Neurol), the
    revision of the 2010 care considerations. Part 1 covers diagnosis and
    neuromuscular, rehabilitation, endocrine (growth, puberty, and adrenal
    insufficiency), and gastrointestinal (including nutrition and dysphagia)
    management, with newly added domains of primary care and emergency
    management, endocrine management, and transitions of care across the
    lifespan. Coordinated, proactive surveillance across these domains aims to
    address the needs of patients with prolonged survival and to improve quality
    of life. Parts 2 and 3 (respiratory, cardiac, bone health, orthopaedic, and
    psychosocial management) are companion publications.
  treatment_term:
    preferred_term: multidisciplinary disease management and surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care

datasets:
- accession: geo:GSE288958
  title: Inhibiting EZH2 complements steroid effects in Duchenne muscular dystrophy
  description: Duchenne muscular dystrophy (DMD) is a devastating X-linked disorder caused by mutations in the dystrophin gene. Despite recent advances in understanding the disease etiology and applying emerging treatment methodologies, glucocorticoid derivatives remain the only general therapeutic option that can slow disease development. However, the precise molecular mechanism of glucocorticoid action remains unclear, and there is still need for additional remedies to complement the treatment. Here, using single-nucleus RNA-sequencing and spatial transcriptome analyses of human and mouse muscles, we investigated pathogenic features in DMD patients and palliative effects of glucocorticoids.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MULTI_OMICS
  sample_count: 11
  publication: PMID:40085707
  notes: Identified by GEO DataSets index search for Duchenne Muscular Dystrophy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE229968
  title: Gene expression of CD56positive and CD56negative human muscle stem cells from normal and Duchenne Muscular Dystrophy muscles
  description: In Duchenne Muscular Dystrophy (DMD), the absence of the subsarcolemmal dystrophin protein leads to repeated myofiber damages inducing cycles of muscle regeneration that is driven by muscle stem cells (MuSCs). With time, MuSC regenerative capacities are overwhelmed, leading to fibrosis and muscle atrophy. Whether MuSCs from DMD muscle have intrinsic alterations or are primed by their degenerative/regenerative environment is still debated. We investigated gene expression in human using primary MuSCs derived from DMD or healthy muscles.
  organism:

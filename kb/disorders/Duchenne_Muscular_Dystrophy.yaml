biochemical:
- name: Creatine Kinase
  presence: Elevated
  context: Markedly elevated (10-100x normal), highest in early disease
  readouts:
  - target: Sarcolemmal Fragility
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated serum CK reflects leakage from damaged skeletal muscle fibers
      and is a biochemical readout of sarcolemmal injury in DMD.
  biomarker_term:
    preferred_term: creatine kinase measurement
    term:
      id: NCIT:C64489
      label: Creatine Kinase Measurement
  evidence:
  - reference: PMID:3302699
    reference_title: "Serum creatine kinase isoenzymes in Duchenne muscular dystrophy determined by sensitive enzyme immunoassay methods."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum levels of creatine kinase (CK) isoenzymes (MM, MB, and BB) were
      measured by sensitive enzyme immunoassay (EIA) methods in 50 patients
      with Duchenne muscular dystrophy (DMD) and in 39 controls. MM, MB, and BB
      levels in DMD patients were higher than in controls, and these three
      levels decreased with advancing age of DMD patients.
    explanation: >-
      This patient-control enzyme-immunoassay study supports elevated serum CK
      isoenzymes as a biochemical marker of Duchenne muscular dystrophy.
- name: Dystrophin
  presence: Absent
  context: Absent or severely reduced on muscle biopsy immunostaining
  readouts:
  - target: Dystrophin Deficiency
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Absent or severely reduced dystrophin staining directly reports the
      proximal dystrophin-deficiency mechanism.
  biomarker_term:
    preferred_term: dystrophin measurement
    term:
      id: NCIT:C209442
      label: Dystrophin Measurement
  evidence:
  - reference: PMID:2674948
    reference_title: "Dystrophin diagnosis: comparison of dystrophin abnormalities by immunofluorescence and immunoblot analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a very strong correlation of clinical diagnoses with the type of
      dystrophin abnormality; all Duchenne muscular dystrophy patient muscle
      contained no detectable dystrophin, Becker muscular dystrophy patient
      muscle had clearly abnormal dystrophin, and unrelated diseases showed
      normal dystrophin.
    explanation: >-
      Immunoblot and immunofluorescence testing in human muscle directly
      supports absent dystrophin as a Duchenne biochemical diagnostic marker.
- name: Treatment-Induced Dystrophin Expression
  presence: Treatment-induced
  context: >-
    Measured in skeletal muscle biopsy after exon-skipping antisense
    oligonucleotide therapy; distinct from baseline diagnostic absence of
    dystrophin.
  readouts:
  - target: Dystrophin Deficiency
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: PRESENT_ABSENT
    endpoint_context: PHARMACODYNAMIC
    regulatory_endpoint_refs:
    - FDA-SE-adult-noncancer-022
    - FDA-SE-pediatric-noncancer-017
    interpretation: >-
      Treatment-induced dystrophin expression in skeletal muscle reports
      pharmacodynamic correction at the dystrophin-deficiency node for
      exon-skipping therapies.
  biomarker_term:
    preferred_term: dystrophin measurement
    term:
      id: NCIT:C209442
      label: Dystrophin Measurement
  synonyms:
  - skeletal muscle dystrophin
  - exon-skipping-induced dystrophin
  evidence:
  - reference: PMID:29752304
    reference_title: "Eteplirsen treatment for Duchenne muscular dystrophy: Exon skipping and dystrophin production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, the 4 assays, each based on unique evaluation mechanisms,
      provided evidence of eteplirsen muscle cell penetration, exon skipping,
      and induction of novel dystrophin expression.
    explanation: >-
      This eteplirsen study supports treatment-induced dystrophin expression as
      a measured pharmacodynamic biomarker for exon-skipping therapy in DMD.
- name: Micro-dystrophin Expression
  presence: Treatment-induced
  context: >-
    Measured in muscle biopsy after delandistrogene moxeparvovec gene therapy;
    distinguish from endogenous full-length dystrophin.
  readouts:
  - target: Dystrophin Deficiency
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: PRESENT_ABSENT
    endpoint_context: PHARMACODYNAMIC
    interpretation: >-
      Treatment-induced micro-dystrophin expression reports biological response
      at the dystrophin-deficiency node rather than baseline disease status.
  biomarker_term:
    preferred_term: dystrophin measurement
    term:
      id: NCIT:C209442
      label: Dystrophin Measurement
  synonyms:
  - delandistrogene moxeparvovec micro-dystrophin
  evidence:
  - reference: PMID:37539981
    reference_title: "Delandistrogene Moxeparvovec Gene Therapy in Ambulatory Patients (Aged ≥4 to <8 Years) with Duchenne Muscular Dystrophy: 1-Year Interim Results from Study SRP-9001-103 (ENDEAVOR)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary endpoint was change from baseline (CFBL) to week 12 in
      delandistrogene moxeparvovec micro-dystrophin by western blot. Additional
      endpoints evaluated included: safety; vector genome copies; CFBL to week
      12 in muscle fiber-localized micro-dystrophin by immunofluorescence; and
      functional assessments, including North Star Ambulatory Assessment, with
      comparison with a propensity score-weighted external natural history
      control.
    explanation: >-
      The ENDEAVOR DMD gene-therapy study used micro-dystrophin expression in
      muscle biopsy as a measured biochemical endpoint.
- name: N-terminal Titin Fragment
  presence: Treatment-responsive
  context: >-
    Urinary N-terminal titin fragment measured by proteomic profiling;
    pharmacodynamic biomarker of microdystrophin gene-therapy efficacy. More
    sensitive than serum CK at low levels of expressed microdystrophin.
  readouts:
  - target: Sarcolemmal Fragility
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: NEGATIVE
    endpoint_context: PHARMACODYNAMIC
    interpretation: >-
      Reduction in urinary N-terminal titin fragment levels reports
      pharmacodynamic correction of myofiber membrane injury after AAV
      microdystrophin restoration.
  biomarker_term:
    preferred_term: urinary N-terminal titin fragment
    term:
      id: NCIT:C101758
      label: Titin
  synonyms:
  - urinary titin
  - N-terminal titin fragment
  evidence:
  - reference: PMID:38229112
    reference_title: "N-terminal titin fragment: a non-invasive, pharmacodynamic biomarker for microdystrophin efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Potential PD biomarkers in DMD participant urine were examined using a
      proteomic approach on the Somalogic platform.
    explanation: >-
      Identifies urinary N-terminal titin fragment as a candidate
      pharmacodynamic biomarker in human DMD participants via Somalogic
      proteomic profiling.
  - reference: PMID:38229112
    reference_title: "N-terminal titin fragment: a non-invasive, pharmacodynamic biomarker for microdystrophin efficacy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Findings were confirmed in both mdx mice and Golden Retriever muscular
      dystrophy (GRMD) dog plasma samples.
    explanation: >-
      mdx mouse and GRMD dog plasma data confirm cross-species reproducibility
      of titin fragment changes as a DMD biomarker.
  - reference: PMID:38229112
    reference_title: "N-terminal titin fragment: a non-invasive, pharmacodynamic biomarker for microdystrophin efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The measurement of objective PD biomarkers such as titin may provide
      additional confidence in the assessment of the mechanism of action and
      efficacy in gene therapy clinical trials of DMD.
    explanation: >-
      Author conclusion positions titin as a pharmacodynamic biomarker to
      complement functional outcome measures in DMD gene therapy trials.
computational_models:
- name: Virgilio agent-based model of regeneration in healthy and mdx skeletal muscle
  description: >-
    Spatial stochastic model of an acutely injured mouse muscle cross-section in
    which muscle fibers, extracellular matrix, necrotic tissue, fibroblasts,
    satellite stem cells, myogenic progenitors, neutrophils, and macrophage states
    interact over 28 days. Disease scenarios alter microenvironmental cell behaviors
    and initial injury using age-specific mdx experimental observations.
  model_type: AGENT_BASED
  model_id: Virgilio-mdx-muscle-regeneration-2018
  model_software: Repast
  model_format: Java agent-based simulation with histology-derived two-dimensional geometry
  publication: PMID:30070607
  modeled_mechanisms:
  - target: Failed Satellite Cell Regeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Simulates satellite-cell activation, proliferation, differentiation, and
      their contribution to recovery of injured muscle cross-sectional area.
    limitations: >-
      The model represents acute injury in young and aged mdx mouse muscle, not
      chronic human DMD progression; mdx disease is substantially milder than the
      human disorder, and cross-sectional area is not a direct measure of strength.
  - target: Chronic Muscle Inflammation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Represents neutrophils and multiple pro- and anti-inflammatory macrophage
      states as regulators of regeneration after contraction-induced injury.
    limitations: >-
      Immune behavior is encoded as literature-derived rules in a two-dimensional
      acute-injury setting and omits systemic immunity and the chronic inflammatory
      history of human DMD muscle.
  - target: Fibrofatty Muscle Replacement
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Tracks fibroblast and extracellular-matrix behavior as microenvironmental
      determinants of regeneration in mdx scenarios.
    limitations: >-
      The model does not reproduce long-term fatty replacement and only represents
      a small muscle cross-section over 28 days.
  variables:
  - name: Initial injured muscle fraction
    dataset_identifier: initial_injury
    description: Fraction of the simulated muscle cross-section replaced by necrotic tissue
    unit: fraction
  - name: Satellite stem cell count
    dataset_identifier: SSC_count
    description: Number of quiescent and activated satellite stem-cell agents
    unit: cells
  - name: Fibroblast count
    dataset_identifier: fibroblast_count
    description: Number of fibroblast and myofibroblast agents
    unit: cells
  - name: Anti-inflammatory macrophage count
    dataset_identifier: M2_count
    description: Number of anti-inflammatory macrophage agents
    unit: cells
  - name: Muscle cross-sectional area recovery
    dataset_identifier: CSA_recovery
    description: Recovered muscle-fiber area 28 days after simulated injury
    unit: percent of pre-injury area
  evidence:
  - reference: PMID:30070607
    reference_title: Agent-based model illustrates the role of the microenvironment in regeneration in healthy and mdx skeletal muscle.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The goals of this project were to 1) develop an agent-based model of skeletal
      muscle that predicts the dynamic regenerative response of muscle cells,
      fibroblasts, SSCs, and inflammatory cells as a result of contraction-induced
      injury, 2) calibrate and validate the model parameters based on comparisons
      with published experimental measurements, and 3) use the model to investigate
      how changing isolated and combined factors known to be associated with DMD
      (e.g., altered fibroblast or SSC behaviors) influence muscle regeneration.
    explanation: Directly identifies the agents, calibration, injury, and DMD perturbations.
  findings:
  - statement: >-
      Recovery at day 28 depended on peak satellite stem-cell abundance, with
      suppressed peaks emerging in the impaired-regeneration aged-mdx scenario.
    evidence:
    - reference: PMID:30070607
      reference_title: Agent-based model illustrates the role of the microenvironment in regeneration in healthy and mdx skeletal muscle.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Our predictions revealed that the percent of injured muscle that recovered
        28 days after injury was dependent on the peak SSC counts following injury.
        In simulations with near-full cross-sectional area recovery (healthy, 4-wk
        mdx, 3-mo mdx), the SSC counts correlated with the extent of initial injury;
        however, in simulations with impaired regeneration (9-mo mdx), the peak SSC
        counts were suppressed relative to initial injury.
      explanation: Directly reports the age-stratified regeneration prediction.
  - statement: >-
      Fibroblast and anti-inflammatory macrophage populations influenced satellite
      stem-cell abundance, but no single altered parameter explained the disease difference.
    evidence:
    - reference: PMID:30070607
      reference_title: Agent-based model illustrates the role of the microenvironment in regeneration in healthy and mdx skeletal muscle.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Fibroblast and anti-inflammatory macrophage counts influenced SSC counts,
        but no single factor was able to predict the pathological differences in
        SSC counts that lead to impaired regeneration.
      explanation: Directly supports the multicomponent microenvironment finding.
  notes: >-
    No durable public deposit of the exact 2018 Repast implementation was identified.
    This is an mdx mouse model, not a human or patient-specific DMD digital twin;
    its value is hypothesis generation about regeneration microenvironments.
- name: Virgilio fibrosis-perturbation model of mdx muscle regeneration
  description: >-
    Follow-up use of the skeletal-muscle agent-based framework to vary
    extracellular-matrix area fraction and protein density, predict their effects on cell migration,
    growth-factor diffusion, and 28-day regeneration, and compare the prediction with
    TGF-beta-treated mdx mouse experiments.
  model_type: AGENT_BASED
  model_id: Virgilio-mdx-fibrosis-regeneration-2021
  base_model: Virgilio-mdx-muscle-regeneration-2018
  model_software: Repast
  model_format: Java agent-based simulation with two-dimensional muscle geometry
  publication: PMID:32748106
  modeled_mechanisms:
  - target: Fibrofatty Muscle Replacement
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Independently varies extracellular-matrix occupied area and effective protein
      density to test how distinct fibrosis properties affect regeneration.
    limitations: >-
      Fibrosis is represented by area fraction and density in mdx mouse muscle;
      matrix composition, architecture, fatty infiltration, and years-long human
      disease evolution are not represented.
  - target: Failed Satellite Cell Regeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Predicts regeneration loss through restricted cell migration and growth-factor
      diffusion, then revises that prediction when matrix density is reduced.
    limitations: >-
      Regeneration is assessed using cross-sectional area 28 days after an acute
      injury, not human muscle function or longitudinal DMD progression.
  variables:
  - name: Extracellular matrix area fraction
    dataset_identifier: ECM_area_fraction
    description: Fraction of the simulated cross-section occupied by extracellular matrix
    unit: fraction
  - name: Extracellular matrix protein density
    dataset_identifier: ECM_protein_density
    description: Effective matrix density controlling stiffness and transport constraints
    unit: relative density
  - name: Growth-factor diffusion
    dataset_identifier: growth_factor_diffusion
    description: Effective diffusion of regenerative signals through extracellular matrix
    unit: relative diffusivity
  - name: Cell migration
    dataset_identifier: cell_migration
    description: Effective movement of regenerative cells through the matrix
    unit: relative migration rate
  - name: Muscle cross-sectional area recovery
    dataset_identifier: CSA_day_28
    description: Regenerated muscle area at 28 days after injury
    unit: relative area
  evidence:
  - reference: PMID:32748106
    reference_title: Computational Models Provide Insight into In Vivo Studies and Reveal the Complex Role of Fibrosis in mdx Muscle Regeneration.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      This study (1) used an agent-based model to predict the effect of increased
      fibrosis in mdx muscle on regeneration from injury, and (2) experimentally
      tested the resulting model-derived hypothesis.
    explanation: Directly establishes the disease model and experiment-linked design.
  findings:
  - statement: >-
      Increasing simulated fibrotic area initially reduced day-28 regeneration by
      limiting growth-factor diffusion and cell migration.
    evidence:
    - reference: PMID:32748106
      reference_title: Computational Models Provide Insight into In Vivo Studies and Reveal the Complex Role of Fibrosis in mdx Muscle Regeneration.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The model predicted that increasing the area fraction of fibrosis decreased
        regeneration 28 days post injury due to limited growth factor diffusion and
        impaired cell migration.
      explanation: Directly reports the initial fibrosis prediction and its mediators.
  - statement: >-
      The TGF-beta experiment did not show the predicted recovery difference;
      additional simulations reproduced that negative result when matrix protein
      density was reduced, showing that area fraction alone was insufficient.
    evidence:
    - reference: PMID:32748106
      reference_title: Computational Models Provide Insight into In Vivo Studies and Reveal the Complex Role of Fibrosis in mdx Muscle Regeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Further, there was no cross-sectional area (CSA) difference during recovery
        between the groups.
      explanation: Directly reports the negative recovery result in TGF-beta-treated mdx mice.
    - reference: PMID:32748106
      reference_title: Computational Models Provide Insight into In Vivo Studies and Reveal the Complex Role of Fibrosis in mdx Muscle Regeneration.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Additional simulations revealed that decreasing the ECM protein density
        resulted in no difference in CSA, similar to the experiment.
      explanation: Directly reports the simulation revision that reproduced the experimental result.
  notes: >-
    This follow-up is especially useful as a negative-result case: the first model
    prediction failed when fibrosis area increased but matrix density fell. It should
    not be generalized from mdx mice to antifibrotic efficacy in people with DMD.
- name: Yoon multivariate DMD progression and virtual-trial models
  description: >-
    Five nonlinear mixed-effects progression models derived from the prospective
    longitudinal ImagingNMD cohort. Each model couples six-minute walk distance to
    MRI transverse relaxation time in one leg muscle and simulates how age, steroid
    use, baseline function, and baseline imaging alter virtual-patient trajectories.
  model_type: DIGITAL_TWIN
  repository_url: https://app.cop.ufl.edu/dmd/
  model_id: DMD-6MWD-MRI-T2-multivariate-models
  model_software: Monolix, Simulx, and R
  model_format: Nonlinear mixed-effects sigmoid Imax and Emax models
  publication: PMID:38609673
  modeled_mechanisms:
  - target: Progressive Muscle Degeneration
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Uses age-dependent decline in walking distance and rise in muscle MRI-T2 to
      estimate heterogeneous human DMD progression trajectories.
    limitations: >-
      This is a cohort-derived statistical virtual-patient model rather than a
      mechanistic tissue twin. It was developed in individuals ambulatory at baseline,
      excludes disease-modifying treatment effects, and does not represent the early
      developmental gain in walking ability before age five.
  - target: Fibrofatty Muscle Replacement
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Treats longitudinal muscle MRI-T2 as a quantitative imaging readout associated
      with replacement of contractile muscle by noncontractile tissue.
    limitations: >-
      MRI-T2 is not specific to fat or fibrosis and can also reflect edema and
      inflammation; muscle-specific trajectories cannot be generalized to every
      skeletal muscle or to cardiac tissue.
  variables:
  - name: Six-minute walk distance
    dataset_identifier: 6MWD
    description: Distance walked during the six-minute walk test
    unit: m
  - name: Muscle MRI transverse relaxation time
    dataset_identifier: MRI_T2
    description: MRI-T2 for one of five modeled leg muscles
    unit: ms
  - name: Age at assessment
    dataset_identifier: Age
    description: Time metric for the disease-progression trajectories
    unit: years
  - name: Steroid use
    dataset_identifier: steroid_use
    description: Covariate indicating corticosteroid treatment status
    unit: categorical
  - name: Half-maximal functional decline age
    dataset_identifier: DPT50_6MWD
    description: Age at which six-minute walk distance reaches half its maximum decrease
    unit: years
  - name: Half-maximal MRI-T2 increase age
    dataset_identifier: DPT50_MRI_T2
    description: Age at which muscle MRI-T2 reaches half its maximum increase
    unit: years
  evidence:
  - reference: PMID:38609673
    reference_title: Five multivariate Duchenne muscular dystrophy progression models bridging six-minute walk distance and MRI relaxometry of leg muscles.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Disease progression models were developed by a nonlinear mixed-effect modeling
      approach. Univariate models of 6MWD and MRI-T2 of five muscles were developed
      separately. Age at assessment was the time metric. Multivariate models were
      developed by estimating the correlation of 6MWD and MRI-T2 model variables.
    explanation: Directly states the model family, outcomes, muscles, and time metric.
  findings:
  - statement: >-
      Sigmoid Imax and Emax functions best captured functional decline and MRI-T2
      increase, with steroid use and baseline functional and imaging values as
      significant covariates.
    evidence:
    - reference: PMID:38609673
      reference_title: Five multivariate Duchenne muscular dystrophy progression models bridging six-minute walk distance and MRI relaxometry of leg muscles.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Sigmoid Imax and Emax models best captured the profiles of 6MWD and MRI-T2
        over age. Steroid use, baseline 6MWD, and baseline MRI-T2 were significant covariates.
      explanation: Directly reports model selection and the significant covariates.
  - statement: >-
      The five models produced similar half-decline ages for walking distance but
      muscle-specific half-increase ages for MRI-T2.
    evidence:
    - reference: PMID:38609673
      reference_title: Five multivariate Duchenne muscular dystrophy progression models bridging six-minute walk distance and MRI relaxometry of leg muscles.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The median age at which 6MWD is half of its maximum decrease in the five
        models was similar, while the median age at which MRI-T2 is half of its
        maximum increase varied depending on the type of muscle.
      explanation: Directly reports the shared functional and muscle-specific imaging trajectories.
  notes: >-
    The public simulator supports real and virtual populations for trial-design use.
    The DIGITAL_TWIN label denotes individualized covariate-conditioned trajectories,
    not a mechanistic or continuously updated personal twin; clinical use beyond trial
    simulation would require external validation in the intended population.
genetic:
- name: DMD pathogenic variants
  gene_term:
    preferred_term: DMD
    term:
      id: hgnc:2928
      label: DMD
  association: Causative loss-of-function variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: X-linked recessive
    evidence:
    - reference: PMID:23650001
      reference_title: "Two mutations in one dystrophin gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Duchenne/Becker muscular dystrophies (DMD/BMD) lead to progressive
        irreversible muscle deterioration caused by recessive mutations in the
        dystrophin encoding gene (Xp21.1).
      explanation: >-
        The cited human-family study places the recessive causal gene at the
        Xp21.1 dystrophin locus, consistent with X-linked recessive inheritance.
  variants:
  - name: Out-of-frame or truncating DMD variants
    description: >-
      Duchenne-associated deletions, duplications, nonsense variants,
      frameshifts, and splice variants commonly disrupt the DMD reading frame
      and produce prematurely truncated or dysfunctional dystrophin.
    gene:
      preferred_term: DMD
      term:
        id: hgnc:2928
        label: DMD
    clinical_significance: PATHOGENIC
    type: loss_of_function_variant
    functional_effects:
    - function: Dystrophin production
      description: Premature truncation or severe loss of functional dystrophin.
      type: loss-of-function
    evidence:
    - reference: PMID:16770791
      reference_title: "Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In Duchenne patients, mutations induce a shift in the reading frame
        leading to prematurely truncated, dysfunctional dystrophins.
      explanation: >-
        This mutation-database review directly supports out-of-frame/truncating
        DMD variants as the severe Duchenne molecular class.
  - name: DMD exon deletions
    description: >-
      Multiexon or single-exon deletions are the most frequent DMD mutation
      class and often cause Duchenne disease when they disrupt the reading
      frame.
    gene:
      preferred_term: DMD
      term:
        id: hgnc:2928
        label: DMD
    clinical_significance: PATHOGENIC
    type: copy_number_loss
    functional_effects:
    - function: Dystrophin open reading frame
      description: Exon loss can disrupt the open reading frame and abolish functional dystrophin.
      type: loss-of-function
    evidence:
    - reference: PMID:23650001
      reference_title: "Two mutations in one dystrophin gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Approximately 60% of mutations are deletions, 10% are duplications and
        the remaining 30% are point mutations.
      explanation: >-
        This provides the reported relative frequency of deletions among
        dystrophinopathy-causing DMD mutations.
  - name: DMD exon duplications
    description: >-
      DMD exon duplications are a recurrent copy-number class. Their clinical
      effect depends on transcript structure and whether the duplication
      disrupts the reading frame.
    gene:
      preferred_term: DMD
      term:
        id: hgnc:2928
        label: DMD
    clinical_significance: PATHOGENIC
    type: copy_number_gain
    functional_effects:
    - function: Dystrophin open reading frame
      description: Exon gain can disrupt transcript structure or the reading frame.
      type: loss-of-function
    evidence:
    - reference: PMID:23650001
      reference_title: "Two mutations in one dystrophin gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Approximately 60% of mutations are deletions, 10% are duplications and
        the remaining 30% are point mutations.
      explanation: >-
        This supports duplications as a recurring DMD mutation class.
  - name: DMD point and small sequence variants
    description: >-
      Nonsense, frameshift, splice-site, and other small sequence variants
      account for the remaining major DMD mutation class and can cause the
      Duchenne phenotype when they truncate or destabilize dystrophin.
    gene:
      preferred_term: DMD
      term:
        id: hgnc:2928
        label: DMD
    clinical_significance: PATHOGENIC
    type: sequence_variant
    functional_effects:
    - function: Dystrophin protein integrity
      description: Small sequence changes can truncate or severely impair dystrophin.
      type: loss-of-function
    evidence:
    - reference: PMID:23650001
      reference_title: "Two mutations in one dystrophin gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Approximately 60% of mutations are deletions, 10% are duplications and
        the remaining 30% are point mutations.
      explanation: >-
        This supports point and small sequence variants as a major non-CNV DMD
        mutation class.
  features: >-
    DMD is an X-linked dystrophinopathy in which Duchenne severity usually
    follows the reading-frame rule: out-of-frame or truncating variants abolish
    functional dystrophin, while in-frame variants can preserve partially
    functional dystrophin and cause milder Becker or intermediate phenotypes.
    Variant class determines eligibility for mutation-specific therapies such
    as exon skipping or stop-codon readthrough.
  notes: >-
    Contemporary cohort data continue to show that exonic deletions are the
    most common mutation class, followed by duplications and truncating or
    splice-disrupting sequence variants. Genotype-phenotype prediction is strong
    but not absolute because transcript processing, residual dystrophin, and
    mutation position can modify severity.
  evidence:
  - reference: PMID:39182149
    reference_title: "Comprehensive analysis of 2097 patients with dystrophinopathy based on a database from 2011 to 2021"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The spectrum of identified variants included exonic deletions (66.6%),
      exonic duplications (10.7%), nonsense variants (10.3%), splice-site
      variants (4.5%), small deletions (3.5%), small insertions/duplications
      (1.8%), and missense variants (0.9%).
    explanation: >-
      This recent 2,097-patient dystrophinopathy cohort updates the DMD variant
      spectrum and supports the curated mutation-class distribution.
  - reference: PMID:16770791
    reference_title: "Entries in the Leiden Duchenne muscular dystrophy mutation database: an overview of mutation types and paradoxical cases that confirm the reading-frame rule."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, over 4700 mutations have been reported in the Leiden DMD
      mutation database, of which 91% are in agreement with this rule.
    explanation: >-
      This supports the reading-frame rule as the major genotype-phenotype
      principle while acknowledging known exceptions.

- accession: geo:GSE310327
  title: Microdystrophins Partially Rescue Duchenne Muscular Dystrophy Deficits in iPSC-Cardiomyocytes
  description: Duchenne muscular dystrophy (DMD) is a severe muscle wasting disease caused by the lack of dystrophin. Dilated cardiomyopathy is the leading cause of death in DMD patients. Smaller variants of dystrophin, called microdystrophins, amenable to packaging into adeno-associated virus (AAV), have shown to be effective in improving skeletal muscle function in animal models; however, the functional benefit of these microdystrophins in the DMD heart remains unclear. To determine the efficacy of microdystrophin gene therapy, we compared three microdystrophin variants in DMD cardiomyocytes differentiated from human induced pluripotent stem cells (iPSCs).

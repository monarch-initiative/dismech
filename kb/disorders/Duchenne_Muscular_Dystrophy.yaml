name: Duchenne Muscular Dystrophy
creation_date: '2026-01-07T17:31:51Z'
description: >-
  Duchenne muscular dystrophy is caused by X-linked, typically out-of-frame loss-of-function variants in DMD that abolish functional dystrophin.
  Loss of dystrophin destabilizes the dystrophin-glycoprotein complex, leaving the sarcolemma fragile and prone to contraction-induced microtears with pathological calcium influx and myofiber necrosis.
  Repeated degeneration exhausts satellite cell regeneration and drives chronic inflammation and fibrofatty replacement, producing progressive skeletal muscle weakness, respiratory failure, and cardiomyopathy.

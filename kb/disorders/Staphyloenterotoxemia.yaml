name: Staphyloenterotoxemia
creation_date: "2026-11-03T19:31:54Z"
description: >-
  Staphyloenterotoxemia is staphylococcal food poisoning: an acute,
  vomiting-predominant food intoxication caused by ingestion of preformed
  Staphylococcus aureus enterotoxin. Enterotoxigenic S. aureus contaminates
  handled food, multiplies during warm storage, and secretes heat- and
  protease-resistant staphylococcal enterotoxins that survive cooking and
  digestion even when viable bacteria are no longer central to the illness.
  Ingested enterotoxin crosses the upper intestinal epithelium and activates
  mast-cell, serotonin, and vagal-afferent signaling, producing rapid nausea,
  violent vomiting, abdominal cramping, and sometimes diarrhea after a short
  incubation period. Disease is typically self-limited and is managed with
  fluid and electrolyte support rather than antistaphylococcal therapy.
category: Infectious Disease
disease_term:
  preferred_term: staphyloenterotoxemia
  term:
    id: MONDO:0005971
    label: staphyloenterotoxemia
parents:
- staphylococcal infection
synonyms:
- Staphylococcal food poisoning
- Staphylococcal food-borne disease
- Staphylococcal toxemia due to food
infectious_agent:
- name: Staphylococcus aureus
  description: >-
    Enterotoxigenic Staphylococcus aureus strains contaminate foods from human
    skin, nasal, and food-animal reservoirs. The organism causes the syndrome by
    producing staphylococcal enterotoxin in the food before ingestion rather
    than by invading intestinal mucosa after ingestion.
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Staphylococcal food poisoning (SFP) is an intoxication that results from
      the consumption of foods containing sufficient amounts of one (or more)
      preformed enterotoxin
    explanation: >-
      Identifies S. aureus preformed enterotoxin in food as the proximate cause
      of staphyloenterotoxemia.
  - reference: PMID:24804250
    reference_title: >-
      Staphylococcus aureus and staphylococcal food-borne disease: an ongoing
      challenge in public health.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Staphylococcal food-borne disease (SFD) is one of the most common
      food-borne diseases worldwide resulting from the contamination of food by
      preformed S. aureus enterotoxins.
    explanation: >-
      Supports the foodborne toxin-mediated disease identity and attributes it
      to preformed S. aureus enterotoxins.
classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Foodborne preformed enterotoxin ingestion
  description: >-
    The disease follows ingestion of food in which S. aureus has multiplied and
    elaborated preformed enterotoxin, classically after contamination by a food
    handler followed by storage at temperatures that permit staphylococcal
    growth and toxin production.
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      contamination is mainly associated with improper handling of cooked or
      processed foods, followed by storage under conditions which allow growth
      of S. aureus and production of the enterotoxin(s).
    explanation: >-
      Supports handled food followed by permissive storage as the exposure route
      that yields food containing preformed toxin.
  - reference: PMID:24804250
    reference_title: >-
      Staphylococcus aureus and staphylococcal food-borne disease: an ongoing
      challenge in public health.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Outbreak investigations have found that improper food handling practices in
      the retail industry account for the majority of SFD outbreaks.
    explanation: >-
      Links the clinical outbreak pattern to improper handling in food retail
      settings.
  - reference: PMID:42700799
    reference_title: >-
      A Staphylococcus aureus Foodborne Outbreak Linked to Hand-Shredded
      Chicken in a Corporate Canteen in Shenzhen, China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A point-source staphylococcal foodborne outbreak occurred in a corporate
      canteen in Shenzhen, China, in April 2024, affecting 16 of 107 exposed
      employees (attack rate, 15.0%).
    explanation: >-
      Provides human outbreak support for foodborne point-source transmission of
      staphylococcal enterotoxin.
environmental:
- name: Food containing preformed staphylococcal enterotoxin
  description: >-
    Ready-to-eat or cooked food that is contaminated with enterotoxigenic S.
    aureus and then temperature-abused becomes a vehicle for preformed
    staphylococcal enterotoxin. Cooking may kill the organism without
    destroying enough of the heat-stable toxin to prevent intoxication.
  exposure_term:
    preferred_term: exposure to preformed staphylococcal enterotoxin in food
    term:
      id: ECTO:0000537
      label: exposure to toxin
  influences_mechanisms:
  - target: Gastrointestinal staphylococcal enterotoxin exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingesting food that already contains staphylococcal enterotoxin delivers
      the toxin bolus to the stomach and proximal small intestine.
    evidence:
    - reference: PMID:22069659
      reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Staphylococcal food poisoning (SFP) is an intoxication that results from
        the consumption of foods containing sufficient amounts of one (or more)
        preformed enterotoxin
      explanation: >-
        Directly supports preformed toxin-bearing food as the trigger of
        gastrointestinal toxin exposure.
    - reference: PMID:42700799
      reference_title: >-
        A Staphylococcus aureus Foodborne Outbreak Linked to Hand-Shredded
        Chicken in a Corporate Canteen in Shenzhen, China.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Brief steaming before service would not have removed preformed toxin.
      explanation: >-
        Shows in a point-source human outbreak that reheating after storage did
        not remove the preformed enterotoxin delivered by the implicated food.
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      SEs are a major cause of food poisoning, which typically occurs after
      ingestion of different foods, particularly processed meat and dairy
      products, contaminated with S. aureus by improper handling and subsequent
      storage at elevated temperatures.
    explanation: >-
      Establishes contaminated foods with elevated-temperature storage as the
      enterotoxin vehicle.
  - reference: PMID:42700799
    reference_title: >-
      A Staphylococcus aureus Foodborne Outbreak Linked to Hand-Shredded
      Chicken in a Corporate Canteen in Shenzhen, China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S. aureus and its enterotoxin A were recovered from patient specimens and
      from the implicated chicken, whereas three other retained dishes yielded
      the organism without detectable toxin; S. aureus was also isolated from an
      asymptomatic food handler.
    explanation: >-
      Documents the implicated food, its preformed SEA, and a plausible
      asymptomatic food-handler source in a human outbreak.
  notes: >-
    Bound to the broad ECTO:0000537 toxin-exposure parent and narrowed in the
    preferred term because the exposure is not a food type alone but the
    composite of ready-to-eat food contamination, S. aureus growth, and
    preformed heat-stable enterotoxin accumulation.
progression:
- phase: Short incubation after toxin ingestion
  incubation_days: 0.083-0.333
  notes: Symptoms characteristically begin 2-8 hours after ingestion.
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Symptoms of SFP have a rapid onset (2–8 h), and include nausea, violent
      vomiting, abdominal cramping, with or without diarrhea
    explanation: >-
      Gives the 2-8 hour incubation window and the acute gastrointestinal
      symptom complex.
- phase: Self-limited acute illness
  duration_days: 1-2
  notes: >-
    Most patients recover within one to two days after symptom onset; severe
    illness is uncommon and is driven by volume depletion from vomiting and
    diarrhea.
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The disease is usually self-limiting and typically resolves within 24–48 h after onset.
    explanation: Supports the usual short duration and self-limited course.

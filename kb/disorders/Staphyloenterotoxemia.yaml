diagnosis:
- name: Short-incubation foodborne clinical syndrome
  description: >-
    Diagnosis is usually clinical and outbreak-epidemiologic: abrupt nausea and
    vomiting within hours of a shared food exposure strongly indicates
    preformed staphylococcal enterotoxin or the vomiting form of Bacillus cereus.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Symptoms of SFP have a rapid onset (2–8 h), and include nausea, violent
      vomiting, abdominal cramping, with or without diarrhea
    explanation: >-
      Supports the short-incubation clinical pattern used to recognize the
      syndrome after a food exposure.
- name: Foodborne outbreak enterotoxin testing
  description: >-
    In outbreaks, implicated food and isolates can be tested for staphylococcal
    enterotoxin or enterotoxin genes, because viable organism culture alone may
    miss a heat-stable toxin that persists after bacterial killing.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:42190559
    reference_title: >-
      Current methods and emerging strategies for the detection of foodborne
      bacterial protein toxins.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Many of these pathogens produce lethal toxins that may persist in various
      food matrices even in the absence of viable microorganisms, making direct
      toxin detection essential for food safety surveillance. This review
      focuses on five major foodborne bacterial exotoxins selected based on
      acute clinical severity, structural and mechanistic diversity across toxin
      classes, a large volume of published data on detection platforms relative
      to other foodborne protein toxins, and the existence of persistent
      unresolved detection challenges. These major toxins include botulinum
      neurotoxins (BnT), Shiga toxins (Stx), cholera toxin (CT), listeriolysin O
      (LLO), and staphylococcal enterotoxins (SEs).
    explanation: >-
      Supports direct enterotoxin detection during SFP outbreak investigation
      because staphylococcal enterotoxins can persist after viable organisms are
      absent.
treatments:
- name: Fluid and electrolyte supportive care
  description: >-
    Management is supportive, focused on oral or intravenous fluid and
    electrolyte replacement when vomiting and diarrhea cause volume depletion;
    antistaphylococcal antibiotics are not needed for the preformed-toxin
    syndrome.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Vomiting
    description: >-
      Rehydration addresses water and electrolyte loss from vomiting and
      diarrhea without acting on toxin production.
    evidence:
    - reference: PMID:16271055
      reference_title: Recognition and management of Staphylococcus aureus toxin-mediated disease.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Symptom-onset is abrupt and the disease may be severe enough to warrant
        hospitalization, but it is usually self-limiting and does not require
        specific antistaphylococcal therapy.
      explanation: >-
        Establishes supportive rather than antistaphylococcal management for the
        toxin-mediated foodborne disease.
animal_models:
- name: House musk shrew oral SEA emesis model
  species: House musk shrew
  genotype: Wild-type Suncus murinus challenged with oral staphylococcal enterotoxin A
  publication: PMID:17517065
  description: >-
    Oral SEA challenge in an emetic small-animal model used to test intestinal
    serotonin release, 5-HT3 receptor blockade, serotonergic afferent depletion,
    surgical vagotomy, and cannabinoid modulation of SE-induced vomiting.
  modeled_mechanisms:
  - target: Vagal emetic reflex activation
    relationship: RECAPITULATES
    description: >-
      The shrew model reproduces SEA-induced vomiting and demonstrates that
      vagal afferent signaling is necessary for the emetic reflex.
    evidence:
    - reference: PMID:17517065
      reference_title: Staphylococcal enterotoxin induces emesis through increasing serotonin release in intestine and it is downregulated by cannabinoid receptor 1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that SEA induces 5-HT release in intestine,
        rather than in brain, and that the 5-HT(3) receptors on vagal afferent
        neurons are essential for SEA-stimulated emesis.
      explanation: >-
        Directly supports the house musk shrew as an oral SEA model of the
        intestinal 5-HT and vagal-afferent emetic mechanism.
  evidence:
  - reference: PMID:17517065
    reference_title: Staphylococcal enterotoxin induces emesis through increasing serotonin release in intestine and it is downregulated by cannabinoid receptor 1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We investigated a mechanism of SEA-induced emesis using a small emetic
      animal model, house musk shrew.
    explanation: >-
      Identifies the house musk shrew oral SEA challenge used to dissect the
      enterotoxin-emesis pathway.
- name: Common marmoset oral enterotoxin emesis model
  species: Common marmoset
  genotype: Wild-type Callithrix jacchus challenged with classical staphylococcal enterotoxins
  publication: PMID:31112582
  description: >-
    Orogastric enterotoxin challenge in an emetic primate model used to test
    classical enterotoxin-induced vomiting, mast-cell degranulation, histamine
    release, serotonin signaling, and vagal transmission.
  modeled_mechanisms:
  - target: Submucosal mast-cell mediator release
    relationship: RECAPITULATES
    description: >-
      The marmoset model recapitulates intestinal SEA binding to submucosal mast
      cells and shows that mast-cell stabilization or histamine H1 blockade
      reduces SEA-induced vomiting.
    evidence:
    - reference: PMID:31112582
      reference_title: Histamine release from intestinal mast cells induced by staphylococcal enterotoxin A (SEA) evokes vomiting reflex in common marmoset.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results indicated that SEA-induced degranulation and histamine
        release evokes emesis.
      explanation: >-
        Directly links mast-cell degranulation and histamine release to
        SEA-induced emesis in common marmosets.
  evidence:
  - reference: PMID:31112582
    reference_title: Histamine release from intestinal mast cells induced by staphylococcal enterotoxin A (SEA) evokes vomiting reflex in common marmoset.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Common marmosets were administered classical SEs, including SEA, SEB and
      SEC, and exhibited multiple vomiting responses.
    explanation: >-
      Establishes common marmosets as an emetic primate model responsive to
      orally administered classical staphylococcal enterotoxins.
discussions:
- discussion_id: sfp_superantigen_ordinary_oral_scope
  prompt: >-
    How much do staphylococcal enterotoxin superantigen MHC-II/TCR-Vβ cytokine
    responses contribute to ordinary short-incubation oral food poisoning?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Gastrointestinal staphylococcal enterotoxin exposure
  rationale: >-
    Staphylococcal enterotoxins are superantigens, but this entry does not model
    a systemic T-cell cytokine-storm arm as a typical SFP mechanism. The ordinary
    oral food-poisoning syndrome is emesis-dominant and self-limited, while the
    superantigenic contribution to that oral-dose presentation remains
    unquantified relative to high-dose or parenteral toxic-shock contexts.
  evidence:
  - reference: PMID:41187575
    reference_title: >-
      Staphylococcal enterotoxins in cancer immunotherapy: An overview of
      translational advances and targeting strategies.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Staphylococcal enterotoxins (SEs) are superantigens that polyclonally
      activate T cells by cross-linking MHC class II on antigen-presenting cells
      with T cell receptor (TCR) Vβ regions, generating potent IL-2/IFN-γ/TNF
      responses distinct from conventional peptide-MHC-restricted activation.
    explanation: >-
      Establishes the mechanistic superantigen arm that is deliberately held out
      of the core ordinary oral-intoxication pathograph.
  - reference: PMID:28632753
    reference_title: >-
      MAIT cells launch a rapid, robust and distinct hyperinflammatory response
      to bacterial superantigens and quickly acquire an anergic phenotype that
      impedes their cognate antimicrobial function: Defining a novel mechanism
      of superantigen-induced immunopathology and immunosuppression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we have identified a population of innate-like T cells, called
      mucosa-associated invariant T (MAIT) cells, as the most powerful source of
      pro-inflammatory cytokines after exposure to SAgs.
    explanation: >-
      Supports the existence of a host cytokine-response branch downstream of
      bacterial superantigens, distinct from enteric mast-cell/vagal emesis.
  - reference: PMID:31112582
    reference_title: Histamine release from intestinal mast cells induced by staphylococcal enterotoxin A (SEA) evokes vomiting reflex in common marmoset.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These SEI properties provide information that there is no complete
      relationship between emetic activity and superantigenic activity.
    explanation: >-
      Supports treating emesis and superantigenicity as separable toxin
      activities rather than folding a systemic cytokine-storm arm into the core
      oral-emesis pathograph.
- discussion_id: sfp_emesis_model_human_confirmation_gap
  prompt: >-
    Does the full intestinal transcytosis, mast-cell mediator, 5-HT3, and vagal
    relay chain operate in human staphylococcal food poisoning as it does in
    shrew and marmoset enterotoxin-challenge models?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Enterotoxin intestinal transcytosis
  - pathophysiology#Submucosal mast-cell mediator release
  - pathophysiology#Vagal emetic reflex activation
  rationale: >-
    The shrew and marmoset models connect SEA ingestion to intestinal 5-HT
    release, mast-cell degranulation, histamine release, and vagal relay, but
    human SFP studies remain clinical and outbreak-based. The animal mechanism
    is compelling, yet full in-vivo confirmation of this multi-step enteric
    reflex in human patients is inferential.
  evidence:
  - reference: PMID:17517065
    reference_title: >-
      Staphylococcal enterotoxin induces emesis through increasing serotonin
      release in intestine and it is downregulated by cannabinoid receptor 1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We investigated a mechanism of SEA-induced emesis using a small emetic
      animal model, house musk shrew.
    explanation: >-
      Identifies the shrew challenge model as the source of the intestinal 5-HT
      and vagal-ablation evidence.
  - reference: PMID:31112582
    reference_title: Histamine release from intestinal mast cells induced by staphylococcal enterotoxin A (SEA) evokes vomiting reflex in common marmoset.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Common marmosets were administered classical SEs, including SEA, SEB and
      SEC, and exhibited multiple vomiting responses.
    explanation: >-
      Identifies the marmoset challenge model as the source of the mast-cell and
      histamine-release evidence.
review_notes: >-
  Duplicate preflight for MONDO:0005971, staphyloenterotoxemia, and
  staphylococcal food poisoning found no exact disease entry on origin/main and
  no matching open claim or all-state GitHub issue/PR before claim issue #16407
  was opened. The entry intentionally scopes the disease to preformed
  staphylococcal enterotoxin ingestion; invasive S. aureus enteritis,
  staphylococcal toxic shock syndrome, and staphylococcal scalded skin syndrome
  use different portals and toxin/systemic mechanisms. The superantigen
  MHC-II/TCR-Vβ cytokine arm of staphylococcal enterotoxins is recorded as an
  open discussion rather than a pathophysiology node because ordinary oral food
  poisoning is emesis-dominant, the marmoset data separate emesis from
  superantigenicity, and the contribution of systemic superantigen cytokine
  biology to typical short-incubation self-limited food poisoning remains
  unquantified.

pathophysiology:
- name: Gastrointestinal staphylococcal enterotoxin exposure
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Ingested preformed staphylococcal enterotoxins remain active in acidic and
    protease-rich gastrointestinal conditions because the toxins are resistant to
    heat, low pH, and proteolytic enzymes at doses in the high-nanogram to
    low-microgram range.
  downstream:
  - target: Enterotoxin intestinal transcytosis
    causal_link_type: DIRECT
    description: >-
      Ingested toxin survives the gut lumen and crosses the proximal intestinal
      epithelium.
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      are resistant to conditions (heat treatment, low pH) that easily destroy
      the bacteria that produce them, and to proteolytic enzymes, hence
      retaining their activity in the digestive tract after ingestion
    explanation: >-
      Establishes toxin potency and physicochemical resistance after the
      producing bacteria have been damaged or killed.
- name: Enterotoxin intestinal transcytosis
  role: process
  biological_scale: TISSUE
  description: >-
    Staphylococcal enterotoxins move across the mucus-producing goblet-cell and
    intestinal epithelial barrier to reach immune and neural targets in the
    lamina propria.
  downstream:
  - target: Submucosal mast-cell mediator release
    causal_link_type: DIRECT
    description: >-
      Translocated enterotoxin reaches submucosal mast cells and induces
      mast-cell degranulation and mediator release.
  evidence:
  - reference: PMID:29662470
    reference_title: Basis of Virulence in Enterotoxin-Mediated Staphylococcal Food Poisoning.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The enterotoxins transit through mucus-expelling goblet cells and
      epithelial cells in the intestinal epithelium to reach the lamina propria.
    explanation: >-
      Summarizes the modeled tissue route by which enterotoxin reaches lamina
- name: Submucosal mast-cell mediator release
  role: process
  biological_scale: CELLULAR
  description: >-
    Staphylococcal enterotoxin A binds submucosal mast cells in the stomach and
    intestine and induces degranulation with histamine release; serotonergic
    signaling then couples this gut mediator response to the vagal emetic
    pathway.
  downstream:
  - target: Vagal emetic reflex activation
    causal_link_type: DIRECT
    description: >-
      Mast-cell degranulation, histamine release, and serotonergic signaling
      activate the vagal pathway required for enterotoxin-induced emesis.
  evidence:
  - reference: PMID:31112582
    reference_title: Histamine release from intestinal mast cells induced by staphylococcal enterotoxin A (SEA) evokes vomiting reflex in common marmoset.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SEA bound with submucosal mast cells and induced mast cell degranulation.
    explanation: >-
      Demonstrates the mast-cell binding and degranulation step in a common
      marmoset model of staphylococcal enterotoxin A-induced emesis.
- name: Vagal emetic reflex activation
  role: process
  biological_scale: ORGANISM
  description: >-
    The abdominal vagal afferent pathway relays the intestinal enterotoxin
    signal to the brainstem emetic circuitry, causing the abrupt, often violent
    vomiting that distinguishes the syndrome from invasive enteritis.
  downstream:
  - target: Vomiting
    causal_link_type: DIRECT
    description: >-
      Vagal relay to the vomiting center is the final common pathway for the
      vomiting-predominant presentation.
  - target: Nausea
    causal_link_type: DIRECT
    description: >-
      The same upper-gastrointestinal toxin signal that activates the emetic
      reflex produces nausea in the short-incubation syndrome.
  evidence:
  - reference: PMID:17517065
    reference_title: Staphylococcal enterotoxin induces emesis through increasing serotonin release in intestine and it is downregulated by cannabinoid receptor 1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SEA-induced emesis was also abolished by surgical vagotomy.
    explanation: >-
      Demonstrates in the house musk shrew that an intact vagus nerve is
      required for staphylococcal enterotoxin A-induced emesis.
- name: Enterotoxin-associated intestinal secretory response
  role: process
  biological_scale: TISSUE
  description: >-
    Staphylococcal enterotoxin can inflame the upper gastrointestinal tract and
    inhibit small-intestinal water and electrolyte reabsorption, producing
    watery diarrhea and cramping in a subset of patients.
  downstream:
  - target: Diarrhea
    causal_link_type: DIRECT
    description: >-
      Impaired small-intestinal water and electrolyte reabsorption yields
      toxin-associated diarrhea.
  - target: Abdominal cramps
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Upper gastrointestinal inflammatory and secretory effects accompany the
      abdominal cramping syndrome.
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diarrhea sometimes associated with SEs intoxication may be due to the
      inhibition of water and electrolyte reabsorption in the small intestine
    explanation: >-
      Supports a secretory mechanism for the diarrheal arm of the intoxication.

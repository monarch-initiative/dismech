diagnosis:
- name: Short-incubation foodborne clinical syndrome
  description: >-
    Diagnosis is usually clinical and outbreak-epidemiologic: abrupt nausea and
    vomiting within hours of a shared food exposure strongly indicates
    preformed staphylococcal enterotoxin or the vomiting form of Bacillus cereus.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:22069659
    reference_title: Food poisoning and Staphylococcus aureus enterotoxins.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Symptoms of SFP have a rapid onset (2–8 h), and include nausea, violent
      vomiting, abdominal cramping, with or without diarrhea
    explanation: >-
      Supports the short-incubation clinical pattern used to recognize the
      syndrome after a food exposure.
- name: Foodborne outbreak enterotoxin testing
  description: >-
    In outbreaks, implicated food and isolates can be tested for staphylococcal
    enterotoxin or enterotoxin genes, because viable organism culture alone may
    miss a heat-stable toxin that persists after bacterial killing.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:29662470
    reference_title: Basis of Virulence in Enterotoxin-Mediated Staphylococcal Food Poisoning.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      it is best for studies investigating SFP outbreaks to employ methods that
      can detect all SE genes as well as the physical presence of toxin in
      suspected contaminated foods.
    explanation: >-
      Supports combined gene and toxin detection in suspected foods during SFP
      outbreak investigation.
treatments:
- name: Fluid and electrolyte supportive care
  description: >-
    Management is supportive, focused on oral or intravenous fluid and
    electrolyte replacement when vomiting and diarrhea cause volume depletion;
    antistaphylococcal antibiotics are not needed for the preformed-toxin
    syndrome.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Vomiting
    description: >-
      Rehydration addresses water and electrolyte loss from vomiting and
      diarrhea without acting on toxin production.
    evidence:
    - reference: PMID:16271055
      reference_title: Recognition and management of Staphylococcus aureus toxin-mediated disease.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Symptom-onset is abrupt and the disease may be severe enough to warrant
        hospitalization, but it is usually self-limiting and does not require
        specific antistaphylococcal therapy.
      explanation: >-
        Establishes supportive rather than antistaphylococcal management for the
        toxin-mediated foodborne disease.
animal_models:
- name: House musk shrew oral SEA emesis model
  species: House musk shrew
  genotype: Wild-type Suncus murinus challenged with oral staphylococcal enterotoxin A
  publication: PMID:17517065
  description: >-
    Oral SEA challenge in an emetic small-animal model used to test intestinal
    serotonin release, 5-HT3 receptor blockade, serotonergic afferent depletion,
    surgical vagotomy, and cannabinoid modulation of SE-induced vomiting.
  modeled_mechanisms:
  - target: Vagal emetic reflex activation
    relationship: RECAPITULATES
    description: >-
      The shrew model reproduces SEA-induced vomiting and demonstrates that
      vagal afferent signaling is necessary for the emetic reflex.
    evidence:
    - reference: PMID:17517065
      reference_title: Staphylococcal enterotoxin induces emesis through increasing serotonin release in intestine and it is downregulated by cannabinoid receptor 1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that SEA induces 5-HT release in intestine,
        rather than in brain, and that the 5-HT(3) receptors on vagal afferent
        neurons are essential for SEA-stimulated emesis.
      explanation: >-
        Directly supports the house musk shrew as an oral SEA model of the
        intestinal 5-HT and vagal-afferent emetic mechanism.
  evidence:
  - reference: PMID:17517065
    reference_title: Staphylococcal enterotoxin induces emesis through increasing serotonin release in intestine and it is downregulated by cannabinoid receptor 1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We investigated a mechanism of SEA-induced emesis using a small emetic
      animal model, house musk shrew.
    explanation: >-
      Identifies the house musk shrew oral SEA challenge used to dissect the
      enterotoxin-emesis pathway.
- name: Common marmoset oral enterotoxin emesis model
  species: Common marmoset
  genotype: Wild-type Callithrix jacchus challenged with classical staphylococcal enterotoxins
  publication: PMID:31112582
  description: >-
    Orogastric enterotoxin challenge in an emetic primate model used to test
    classical enterotoxin-induced vomiting, mast-cell degranulation, histamine
    release, serotonin signaling, and vagal transmission.
  modeled_mechanisms:
  - target: Submucosal mast-cell mediator release
    relationship: RECAPITULATES
    description: >-
      The marmoset model recapitulates intestinal SEA binding to submucosal mast
      cells and shows that mast-cell stabilization or histamine H1 blockade
      reduces SEA-induced vomiting.
    evidence:
    - reference: PMID:31112582
      reference_title: Histamine release from intestinal mast cells induced by staphylococcal enterotoxin A (SEA) evokes vomiting reflex in common marmoset.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results indicated that SEA-induced degranulation and histamine
        release evokes emesis.
      explanation: >-
        Directly links mast-cell degranulation and histamine release to
        SEA-induced emesis in common marmosets.
  evidence:
  - reference: PMID:31112582
    reference_title: Histamine release from intestinal mast cells induced by staphylococcal enterotoxin A (SEA) evokes vomiting reflex in common marmoset.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Common marmosets were administered classical SEs, including SEA, SEB and
      SEC, and exhibited multiple vomiting responses.
    explanation: >-
      Establishes common marmosets as an emetic primate model responsive to
      orally administered classical staphylococcal enterotoxins.
review_notes: >-
  Duplicate preflight for MONDO:0005971, staphyloenterotoxemia, and
  staphylococcal food poisoning found no exact disease entry on origin/main and
  no matching open claim or all-state GitHub issue/PR before claim issue #16407
  was opened. The entry intentionally scopes the disease to preformed
  staphylococcal enterotoxin ingestion; invasive S. aureus enteritis,
  staphylococcal toxic shock syndrome, and staphylococcal scalded skin syndrome
  use different portals and toxin/systemic mechanisms.

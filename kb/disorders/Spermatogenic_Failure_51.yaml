    explanation: Reduced CFAP251 in sperm of CFAP91 patients, as summarised from the primary report.
  - reference: PMID:36552811
    reference_title: "Cfap91-Dependent Stability of the RS2 and RS3 Base Proteins and Adjacent Inner Dynein Arms in Tetrahymena Cilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The localization studies confirmed that the level of RS3-specific proteins, Cfap61 and Cfap251, as well as RS2-associated Cfap206, are significantly diminished in Tetrahymena CFAP91-KO cells."
    explanation: In Tetrahymena, CFAP91 knockout depletes the other CSC subunits and an RS2 base protein.

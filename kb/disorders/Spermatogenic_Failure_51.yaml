    reference_title: "Biallelic variants in MAATS1 encoding CFAP91, a calmodulin-associated and spoke-associated complex protein, cause severe astheno-teratozoospermia and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified six unrelated affected patients carrying a homozygous deleterious variants in MAATS1, a gene encoding CFAP91, a calmodulin-associated and spoke-associated complex (CSC) protein."

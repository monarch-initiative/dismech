  evidence:
  - reference: PMID:32161152
    reference_title: "Biallelic variants in MAATS1 encoding CFAP91, a calmodulin-associated and spoke-associated complex protein, cause severe astheno-teratozoospermia and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We showed that CFAP91 is essential for normal sperm flagellum structure and function in human and Trypanosoma and that biallelic variants in this gene lead to severe flagellum malformations resulting in astheno-teratozoospermia and primary male infertility."
    explanation: Flagellar malformation is the human phenotype.
  - reference: PMID:40931011
    reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we demonstrate that Cfap91 knockout (KO) mice exhibit impaired sperm flagellum formation and male infertility."
    explanation: Flagellum formation fails in knockout mice.
mechanistic_hypotheses:
- hypothesis_group_id: cfap91_motile_cilia_involvement
  hypothesis_label: CFAP91 loss affects sperm flagella but spares other motile cilia
  status: EMERGING
  description: >-
    CFAP91 is part of the RS3 base in respiratory and ependymal cilia as well
    as sperm. No respiratory phenotype has been reported in patients, but the
    human report could only be read as an abstract, so absence was not
    confirmed. In Cfap91 knockout mice, tracheal and ependymal cilia grow
    normally on a mixed background, whereas on the B6D2 background knockouts
    were under-represented and died before 8 weeks, which the authors
    attributed, without confirming it, to hydrocephalus. In Tetrahymena,
    CFAP91 loss severely disrupts ciliary beating. Whether CFAP91 loss affects
    human motile cilia is therefore unresolved.
  evidence:
  - reference: PMID:40931011
    reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, there were no apparent differences found between Cfap91+/- and Cfap91-/- mice (Supplementary Fig. 3e), indicating that ciliary elongation was endurable in Cfap91-/- mice in contrast to disrupted sperm flagellum formation."
    explanation: Tracheal and ependymal cilia are of normal length in knockout mice.
  - reference: PMID:40931011
    reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "As mutations in other Cfap genes were reported to cause hydrocephalus37,38, we hypothesized that Cfap91-/- mice in the B6D2 background may also carry hydrocephalus."
    explanation: >-
      Early death of knockouts on one background suggests a role outside
      sperm, though hydrocephalus was hypothesized rather than shown.
  - reference: PMID:36552811
    reference_title: "Cfap91-Dependent Stability of the RS2 and RS3 Base Proteins and Adjacent Inner Dynein Arms in Tetrahymena Cilia."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Cilia of Tetrahymena cells with knocked-out CFAP91 beat in an uncoordinated manner and their beating frequency is dramatically reduced."
    explanation: In a ciliate, CFAP91 is needed for ciliary motility.

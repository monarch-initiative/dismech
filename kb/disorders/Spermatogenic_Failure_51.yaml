pathophysiology:
- name: Loss of CFAP91
  description: >-
    Biallelic deleterious CFAP91 variants. CFAP91 is a structural scaffold of
    the axonemal doublet: its N-terminal region runs from the base of RS2 to
    the base of RS3, and its C-terminal region extends up the RS3 neck. It
    binds CFAP251 before flagellar outgrowth and later recruits LRRC23 to the
    spoke.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP91
    term:
      id: hgnc:24010
      label: CFAP91
  molecular_functions:
  - preferred_term: structural constituent of the axonemal cytoskeleton
    modifier: DECREASED
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
  cellular_components:
  - preferred_term: Radial spoke base 3
    term:
      id: GO:0120342
      label: radial spoke base 3
  downstream:
  - target: Loss of the Calmodulin- and Spoke-Associated Complex from the Sperm Axoneme
    causal_link_type: DIRECT
    description: >-
      Without CFAP91, CFAP251 and LRRC23 are present in testis but fail to
      incorporate into the sperm flagellum.
    evidence:
    - reference: PMID:40931011
      reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hence, depletion of CFAP91 disabled the incorporation of CFAP251 into the sperm flagella"
      explanation: CFAP91 is needed to bring CFAP251 into the flagellum.
  evidence:
  - reference: PMID:40931011
    reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using a transgenic rescue model expressing FLAG- and BioID2-tagged CFAP91, we reveal that CFAP91 immunoprecipitates with RS3 proteins CFAP251 and LRRC23, whose localization is disrupted in Cfap91 KO sperm flagella."
    explanation: CFAP91 binds RS3 proteins in mouse testis.
  - reference: PMID:40931011
    reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Notably, according to a high-resolution study published recently, CFAP91 has been shown to exhibit a distinctive localization in bovine sperm axoneme: the N-terminal region of CFAP91 is localized from the RS2 base to the RS3 base through the base plate of the nexin-dynein regulatory complex (N-DRC) and is intertwined with the protofilament formed by CCDC39/4033,34."
    explanation: Structural position of CFAP91 in the bovine sperm axoneme, summarised from a cited cryo-EM study.
  - reference: PMID:17967944
    reference_title: "A conserved CaM- and radial spoke associated complex mediates regulation of flagellar dynein activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FAP91 directly interacts with radial spoke protein 3 (an AKAP), which is located at the base of the spoke."
    explanation: In Chlamydomonas the CFAP91 orthologue is a CaM-associated protein bound to the radial spoke base.
- name: Loss of the Calmodulin- and Spoke-Associated Complex from the Sperm Axoneme
  description: >-
    The CSC (CFAP61, CFAP91 and CFAP251 with calmodulin) sits at the base of
    radial spoke 3 and links it to the doublet microtubules. Loss of any one
    subunit destabilizes the others. Without CFAP91, CFAP251 and LRRC23 are not
    incorporated into the sperm flagellum, CFAP251 is reduced in patient sperm,
    and in Tetrahymena the RS3 base and the base of RS2 are not stably docked.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Radial spoke 3
    term:
      id: GO:0120335
      label: radial spoke 3
  biological_processes:
  - preferred_term: Radial spoke assembly
    modifier: DECREASED
    term:
      id: GO:0062177
      label: radial spoke assembly
  downstream:
  - target: Sperm Axonemal Disorganization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Radial spokes anchor the central pair and connect it to the dynein arms;
      without RS3 and a stable RS2 base the central pair is lost and the
      axoneme becomes disordered. How loss of these spoke bases leads to
      failure of the whole sperm flagellum is not established.
    evidence:
    - reference: PMID:32161152
      reference_title: "Biallelic variants in MAATS1 encoding CFAP91, a calmodulin-associated and spoke-associated complex protein, cause severe astheno-teratozoospermia and male infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of TbCFAP91 using RNAi impaired flagellar movement led to CPC defects in Trypanosoma as observed in humans."
      explanation: Knockdown of the Trypanosoma orthologue reproduces the central pair defect.
  evidence:
  - reference: PMID:32161152
    reference_title: "Biallelic variants in MAATS1 encoding CFAP91, a calmodulin-associated and spoke-associated complex protein, cause severe astheno-teratozoospermia and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, we confirmed that the WDR66 protein is a physical and functional partner of CFAP91 into the CSC."
    explanation: CFAP91 and CFAP251 (WDR66) are partners in the human sperm CSC.
  - reference: PMID:40931011
    reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND

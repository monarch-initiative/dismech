name: Spermatogenic Failure 51
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF51
- spermatogenic failure 51
- CFAP91-related multiple morphological abnormalities of the sperm flagella
- MAATS1-related astheno-teratozoospermia
description: >-
  Spermatogenic failure 51 (SPGF51) is autosomal recessive male infertility
  caused by biallelic variants in CFAP91 (formerly MAATS1 or AAT1). CFAP91 is a
  subunit of the calmodulin- and spoke-associated complex (CSC), which with
  CFAP61 and CFAP251 builds the base of radial spoke 3 (RS3); CFAP91 also
  extends along the doublet microtubule to the base of radial spoke 2 and acts
  as the scaffold on which RS3 is assembled. Loss of CFAP91 prevents CFAP251
  and other RS3 proteins from being incorporated into the sperm flagellum.
  Affected men have severe astheno-teratozoospermia with multiple
  morphological abnormalities of the sperm flagella (MMAF), and electron
  microscopy shows central pair complex and radial spoke defects.

  The disease is known from six unrelated men identified by exome sequencing
  of an MMAF cohort, with supporting data from Trypanosoma and Tetrahymena
  orthologue knockdowns and a Cfap91 knockout mouse with immotile,
  short-tailed sperm. Respiratory involvement has not been reported in
  patients. ICSI is the usual route to fertility for MMAF, but
  CFAP91-specific outcome data are limited.
disease_term:
  preferred_term: spermatogenic failure 51
  term:
    id: MONDO:0030926
    label: spermatogenic failure 51
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 619177. ClinGen has not
  classified CFAP91 for spermatogenic failure 51: no CFAP91 row is present in
  the ClinGen gene-disease validity export dated 2026-10-14
  (data/clingen/gene_validity.csv), so gene_disease_validity is left absent.
  The only cached text of the primary human report (PMID:32161152) is its
  abstract, so the number of patients with each phenotype, the variant list,
  sperm counts and the patients' respiratory history could not be quoted; the
  abstract gives six unrelated homozygous men. A CFAP91 carrier was among the
  MMAF patients of a French ICSI series (PMID:34529793), but the cached
  abstract does not report that couple's outcome separately. No GeneReviews
  chapter covers this disease (Bookshelf index snapshot 2026-09-10).

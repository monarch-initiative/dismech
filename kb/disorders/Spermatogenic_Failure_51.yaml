animal_models:
- name: Cfap91 knockout mouse
  species: Mouse
  genotype: Cfap91-/- (32-kb deletion), homozygous, B6D2/129 background
  publication: PMID:40931011
  description: >-
    Knockout males are infertile with oligo-astheno-teratozoospermia: few,
    completely immotile sperm with short tails and abnormal heads, disordered
    axonemes and peri-axonemal defects. CFAP251 and LRRC23 fail to enter the
    flagellum. On the B6D2 background knockouts were under-represented and all
    died before 8 weeks of age.
  modeled_mechanisms:
  - target: Loss of the Calmodulin- and Spoke-Associated Complex from the Sperm Axoneme
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: CFAP251 and LRRC23 are not incorporated into knockout sperm flagella.
    evidence:
    - reference: PMID:40931011
      reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, these data suggested that the localization of CFAP91-associating RS3 proteins was disrupted in sperm tails of Cfap91-/- males."
      explanation: RS3 proteins mislocalize without CFAP91.
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Short-tailed immotile sperm, with a more severe count reduction than is documented in patients.
    limitations: >-
      Knockout males have very few epididymal sperm, and the strain-dependent
      early death has no counterpart in reported patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse knockouts have oligozoospermia with few sperm reaching the cauda
        epididymis, whereas the human phenotype is reported as
        astheno-teratozoospermia; whether patients also have low counts is not
        stated in the available human source.
    - divergence_type: OTHER
      materiality: IMMATERIAL
      description: >-
        On the B6D2 inbred background Cfap91 knockouts died before 8 weeks of
        age, possibly from hydrocephalus, while on a mixed B6D2/129 background
        they survived. The lethality is a mouse strain effect and does not bear
        on the sperm phenotype studied in survivors.
    evidence:
    - reference: PMID:40931011
      reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, spermatozoa from Cfap91-/- cauda epididymis showed abnormal morphology (Fig. 2a), including shorter tails (Fig. 2b) and abnormal heads (Fig. 2c)."
      explanation: Short-tailed, malformed sperm in knockout mice.
    - reference: PMID:40931011
      reference_title: "Proximity labeling of axonemal protein CFAP91 identifies EFCAB5 that regulates sperm motility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistently, fewer number of spermatozoa were found in the cauda epididymis of Cfap91-/- males (Supplementary Fig. 3d)."
      explanation: Records the low sperm count behind the species divergence.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility defect and is the standard fertility treatment
    for MMAF. In a French series of 20 MMAF couples, which included the
    genetic causes found in the cohort (MAATS1 among them), fertilization rates
    after ICSI matched those of non-MMAF couples and did not differ by
    genotype. Outcome data for CFAP91 carriers specifically are not available.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion and form irrelevant to fertilization.
    evidence:
    - reference: PMID:34529793
      reference_title: "Genetic diagnosis, sperm phenotype and ICSI outcome in case of severe asthenozoospermia with multiple morphological abnormalities of the flagellum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Despite occasional technical difficulties, ICSI outcomes for couples with MMAF do not differ from those of other couples requiring ICSI, irrespective of the genetic defect."
      explanation: Applies to MMAF across genotypes; not reported separately for CFAP91.
  evidence:
  - reference: PMID:34529793
    reference_title: "Genetic diagnosis, sperm phenotype and ICSI outcome in case of severe asthenozoospermia with multiple morphological abnormalities of the flagellum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The fertilisation rate was not statistically different between the MMAF (65.7%) and the non-MMAF (66.0%) couples and it did not differ according to the genotype or the flagellar phenotype of the subjects or use of the HOS test."
    explanation: Group-level MMAF outcome data from a series that included CFAP91; the CFAP91 couple's own result is not reported in the abstract.

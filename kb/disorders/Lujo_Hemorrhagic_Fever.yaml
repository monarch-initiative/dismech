transmission:
- name: Nosocomial blood and body-fluid transmission
  description: >-
    Recognized human spread has occurred in the healthcare setting during the
    Southern African outbreak through exposure to blood or body fluids and
    high-risk aerosol-generating procedures; the natural reservoir route to the
    index patient has not yet been identified.
  evidence:
  - reference: PMID:25393244
    reference_title: Clinical features and patient management of Lujo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In 2008 a nosocomial outbreak of five cases of viral hemorrhagic fever due
      to a novel arenavirus, Lujo virus, occurred in Johannesburg, South Africa.
    explanation: >-
      Documents healthcare-associated transmission in the original Lujo
      hemorrhagic fever outbreak.
  - reference: PMID:41118368
    reference_title: Age- and sex-associated differences in Lujo hemorrhagic fever pathogenesis in strain 13/N guinea pigs.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Despite its public health significance, LUJV remains poorly understood,
      with no approved treatments, vaccines, or known reservoir.
    explanation: >-
      Supports leaving the natural-reservoir side of LUJV transmission
      unmodeled.

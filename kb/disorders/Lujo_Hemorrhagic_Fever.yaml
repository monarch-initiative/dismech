diagnosis:
- name: Lujo Virus RT-PCR
  description: >-
    Reverse-transcription PCR can detect Lujo viral RNA rapidly and can support
    molecular diagnostic workups that distinguish LUJV from other viral
    hemorrhagic-fever agents.
  presence: PRESENT
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    Detection of Lujo virus genomic RNA in serum or tissue specimens.
  evidence:
  - reference: PMID:24096270
    reference_title: Rapid molecular detection of Lujo virus RNA.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This report details the first set of diagnostic molecular assays designed
      to identify Lujo viral RNA rapidly, and demonstrates the potential
      functionality of these assays for use in the clinical setting.
    explanation: >-
      Supports Lujo-virus RNA RT-PCR as a molecular diagnostic route.
- name: Unbiased Viral Metagenomic Sequencing
  description: >-
    High-throughput unbiased sequencing of serum and tissue RNA identifies
    divergent Lujo virus sequences when routine hemorrhagic fever assays are
    negative.
  presence: PRESENT
  diagnosis_term:
    preferred_term: Next Generation Sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  results: >-
    Recovery and phylogenetic identification of Lujo virus S and L genomic
    segments.
  evidence:
  - reference: PMID:19478873
    reference_title: "Genetic detection and characterization of Lujo virus, a new hemorrhagic fever-associated arenavirus from southern Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unbiased pyrosequencing of RNA extracts from serum and tissues of outbreak
      victims enabled identification and detailed phylogenetic characterization
      within 72 hours of sample receipt.
    explanation: >-
      Demonstrates diagnostic identification of Lujo virus from patient serum
      and tissues by unbiased next-generation sequencing.
treatments:
- name: Ribavirin-Containing Empiric Antiviral Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The only survivor in the 2008 outbreak received rapid ribavirin together
    with statin, N-acetylcysteine, and recombinant factor VIIa; no controlled
    efficacy trials exist.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ribavirin
      term:
        id: CHEBI:63580
        label: ribavirin
  target_mechanisms:
  - target: Systemic Arenaviral Illness
    treatment_effect: INHIBITS
    description: >-
      Ribavirin is administered empirically to inhibit arenaviral RNA
      replication during early systemic infection.
  evidence:
  - reference: PMID:25393244
    reference_title: Clinical features and patient management of Lujo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distinctive treatment components of the one surviving patient included
      rapid commencement of the antiviral drug ribavirin and administration of
      HMG-CoA reductase inhibitors (statins), N-acetylcysteine, and recombinant
      factor VIIa.
    explanation: >-
      Documents ribavirin as one empiric component of the combination regimen
      used in the sole survivor, without proving that ribavirin caused survival.
- name: Supportive Critical Care and Viral Hemorrhagic Fever Isolation
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Management relies on intensive supportive care for hemodynamic instability,
    coagulopathy, and organ failure combined with strict barrier nursing and
    aerosol precautions during high-risk procedures such as endotracheal
    intubation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Consumptive Coagulopathy and Shock
    treatment_effect: MODULATES
    description: >-
      Intensive supportive care addresses shock, multiorgan dysfunction, and
      consumptive coagulopathy in severe second-week disease.
  evidence:
  - reference: PMID:25393244
    reference_title: Clinical features and patient management of Lujo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the risk of secondary transmission, viral hemorrhagic fever
      precautions should be implemented for all cases of Lujo virus infection,
      with specialized precautions to protect against aerosols when performing
      enhanced-risk procedures such as endotracheal intubation.
    explanation: >-
      Supports strict viral hemorrhagic fever isolation and aerosol precautions
      during critical-care procedures in Lujo virus infection.
animal_models:
- name: Cynomolgus macaque LUJV infection model
  species: Cynomolgus macaque
  genotype: Wild type
  publication: PMID:25520505
  description: >-
    LUJV-infected cynomolgus macaques developed mild, nonlethal illness and
    showed a delayed inflammatory and cell-death transcriptional response
    compared with severe Lassa virus infection, making the model useful for
    host-response timing rather than fatal LHF.
  modeled_mechanisms:
  - target: Delayed Innate Response and Inflammatory Cytokine Storm
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    limitations: >-
      Cynomolgus macaques show a 72-hour delay in PBMC inflammatory and
      cell-death transcriptional induction relative to lethal Lassa virus
      infection and do not mount lethal hyperinflammation.
    description: >-
      Demonstrates that delayed induction of proinflammatory and proapoptotic
      host responses is associated with attenuated disease rather than lethal
      cytokine storm in macaques.
    evidence:
    - reference: PMID:25520505
      reference_title: Delayed inflammatory and cell death responses are associated with reduced pathogenicity in Lujo virus-infected cynomolgus macaques.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We detected a 72-h delay in the induction of host responses to infection
        during LUJV infection compared to that of the animals infected with LASV.
      explanation: >-
        PBMC transcriptomics directly measures the 72-hour delay in host
        inflammatory and cell-death response induction in LUJV-infected
        macaques.
  - target: Consumptive Coagulopathy and Shock
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    limitations: >-
      Cynomolgus macaques develop only mild, nonlethal illness without
      progressing to fatal second-week shock or disseminated intravascular
      coagulation.
    description: >-
      Evaluates why delayed proinflammatory and proapoptotic host responses
      spare cynomolgus macaques from lethal hemorrhagic shock.
    evidence:
    - reference: PMID:25520505
      reference_title: Delayed inflammatory and cell death responses are associated with reduced pathogenicity in Lujo virus-infected cynomolgus macaques.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to human cases, LUJV caused mild, nonlethal illness in
        macaques.
      explanation: >-
        Demonstrates that cynomolgus macaques fail to recapitulate lethal human
        Lujo hemorrhagic fever.
  evidence:
  - reference: PMID:25520505
    reference_title: Delayed inflammatory and cell death responses are associated with reduced pathogenicity in Lujo virus-infected cynomolgus macaques.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast to human cases, LUJV caused mild, nonlethal illness in
      macaques.
    explanation: >-
      Shows the limited disease severity of the Lujo cynomolgus macaque model.
- name: Strain 13/N guinea pig LUJV infection model
  species: Guinea pig
  genotype: Wild-type strain 13/N
  publication: PMID:41118368
  description: >-
    Strain 13/N guinea pigs develop severe LUJV disease in an age- and
    sex-dependent pattern; lethality correlates with hematologic and biochemical
    derangement plus cytokine storms rather than with tissue viral burden alone.
  modeled_mechanisms:
  - target: Systemic Arenaviral Illness
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Disease severity is age- and sex-dependent, with young female guinea pigs
      showing attenuated inflammation and markedly higher survival despite
      comparable tissue viral titers.
    description: >-
      Models high-titer disseminated LUJV replication across lungs, liver,
      spleen, kidneys, and serum.
    evidence:
    - reference: PMID:41118368
      reference_title: Age- and sex-associated differences in Lujo hemorrhagic fever pathogenesis in strain 13/N guinea pigs.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Despite similar high titers of LUJV detected in the lungs, liver,
        spleen, kidneys, and serum of infected animals, survival outcomes
        strongly correlated with immune responses rather than viral burden.
      explanation: >-
        Confirms high-titer multiorgan and serum LUJV dissemination in infected
        strain 13/N guinea pigs.
  - target: Delayed Innate Response and Inflammatory Cytokine Storm
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Pronounced cytokine storm develops in adult guinea pigs and young males,
      whereas young females exhibit attenuated inflammatory cytokine profiles.
    description: >-
      Directly models the lethal systemic IL-1beta, IL-2, IL-6, and CXCL10
      cytokine storm that distinguishes fatal from surviving LUJV infection.
    evidence:
    - reference: PMID:41118368
      reference_title: Age- and sex-associated differences in Lujo hemorrhagic fever pathogenesis in strain 13/N guinea pigs.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Adult animals and young males developed more severe clinical signs,
        heightened hematological and biochemical abnormalities, and pronounced
        cytokine storms, particularly elevated IL-1β, IL-2, IL-6, and CXCL10
        levels.
      explanation: >-
        Demonstrates severe inflammatory cytokine storm driving lethality in
        susceptible strain 13/N guinea pigs.
  evidence:
  - reference: PMID:41118368
    reference_title: Age- and sex-associated differences in Lujo hemorrhagic fever pathogenesis in strain 13/N guinea pigs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Adult animals and young males developed more severe clinical signs,
      heightened hematological and biochemical abnormalities, and pronounced
      cytokine storms, particularly elevated IL-1β, IL-2, IL-6, and CXCL10
      levels.
    explanation: >-
      Documents the severe host-response phenotype in susceptible strain 13/N
      guinea pigs.
- name: Stat1-knockout LUJV mouse model
  species: Mouse
  genotype: Stat1 knockout
  publication: PMID:42075721
  description: >-
    Stat1-deficient mice develop a partially lethal LUJV disease that reproduces
    several hematologic, clinical-chemistry, and histologic findings of Lujo
    hemorrhagic fever.
  modeled_mechanisms:
  - target: Systemic Arenaviral Illness
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Requires genetic ablation of host STAT1 interferon signaling to overcome
      murine resistance and produces only partially lethal disease.
    description: >-
      Reproduces hematological, clinical-chemistry, and histologic features of
      systemic Lujo virus disease in an immunocompromised mouse background.
    evidence:
    - reference: PMID:42075721
      reference_title: Hemorrhagic Fever Disease in STAT-1 Knockout Mice Infected with Lujo Virus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Several key hematological, clinical chemistry, and histologic findings
        common to LHF disease are recapitulated in this model.
      explanation: >-
        Demonstrates partial recapitulation of systemic LHF pathology in
        STAT1-knockout mice.
  evidence:
  - reference: PMID:42075721
    reference_title: Hemorrhagic Fever Disease in STAT-1 Knockout Mice Infected with Lujo Virus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Several key hematological, clinical chemistry, and histologic findings
      common to LHF disease are recapitulated in this model.
    explanation: >-
      Supports Stat1-deficient mice as a preliminary LUJV disease model.
datasets: []
notes: >-
  No natural animal reservoir has been identified for Lujo virus; documented
  human transmission is restricted to healthcare-associated spread from the
  2008 Southern African index case to four secondary contacts. Preclinical
  antiviral and vaccine candidates reported in cell-culture or vaccine-platform
  studies — including site-1-protease inhibition with PF-429242 (PMID:26719243),
  cannabinoid receptor CB1 antagonists, griffithsin entry inhibitors, and
  recombinant MOPEVAC vaccine constructs — have not been tested in human Lujo
  hemorrhagic fever and are therefore scoped out of clinical treatments.

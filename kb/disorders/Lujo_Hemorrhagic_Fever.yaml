- name: Delayed Innate Response and Inflammatory Cytokine Storm
  conforms_to: "cytokine_storm_hyperinflammation#IL-6-Driven Systemic Cytokine Storm"
  biological_scale: ORGANISM
  description: >-
    Comparative animal pathogenesis models show that LHF severity is governed
    by dysregulated host inflammatory and cell-death responses rather than
    tissue viral burden alone: susceptible strain 13/N guinea pigs mount a
    pronounced systemic cytokine storm (elevated IL-1beta, IL-2, IL-6, and
    CXCL10) driving hematologic, biochemical, and fatal decompensation despite
    similar viral titers in survivors, whereas delayed proinflammatory and
    proapoptotic induction in cynomolgus macaques spares them from severe
    hemorrhagic shock.
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: interleukin-6 production
    term:
      id: GO:0032635
      label: interleukin-6 production
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:41118368
    reference_title: Age- and sex-associated differences in Lujo hemorrhagic fever pathogenesis in strain 13/N guinea pigs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Adult animals and young males developed more severe clinical signs,
      heightened hematological and biochemical abnormalities, and pronounced
      cytokine storms, particularly elevated IL-1β, IL-2, IL-6, and CXCL10
      levels.
    explanation: >-
      Demonstrates pronounced systemic cytokine storm (IL-1beta, IL-2, IL-6,
      CXCL10) accompanying lethal LUJV disease in susceptible guinea pigs.
  - reference: PMID:41118368
    reference_title: Age- and sex-associated differences in Lujo hemorrhagic fever pathogenesis in strain 13/N guinea pigs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite similar high titers of LUJV detected in the lungs, liver, spleen,
      kidneys, and serum of infected animals, survival outcomes strongly
      correlated with immune responses rather than viral burden.
    explanation: >-
      Establishes that lethal LUJV progression correlates with host inflammatory
      immunopathology rather than viral replication titers alone.
  - reference: PMID:25520505
    reference_title: Delayed inflammatory and cell death responses are associated with reduced pathogenicity in Lujo virus-infected cynomolgus macaques.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We detected a 72-h delay in the induction of host responses to infection
      during LUJV infection compared to that of the animals infected with LASV.
    explanation: >-
      Comparative PBMC transcriptomics in macaques links the timing and
      magnitude of proinflammatory and cell-death host-response induction to
      arenaviral hemorrhagic-fever pathogenicity.
  downstream:
  - target: Consumptive Coagulopathy and Shock
    causal_link_type: DIRECT

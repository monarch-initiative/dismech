      id: GO:0046755
      label: viral budding
    modifier: INCREASED
  - preferred_term: viral glycoprotein precursor processing
    term:
      id: GO:0019082
      label: viral protein processing
    modifier: INCREASED
  evidence:
  - reference: PMID:26719243
    reference_title: Analysis of Assembly and Budding of Lujo Virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The L domains in Z are required for efficient virus-like particle release,
      but Tsg101, ALIX/AIP1, and Vps4A/B are unnecessary for budding.
    explanation: >-
      Shows that LUJV Z-protein late domains are needed for efficient particle
      release.
  - reference: PMID:26719243
    reference_title: Analysis of Assembly and Budding of Lujo Virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LUJV GPC is cleaved by site 1 protease (S1P) at the RKLM motif, and
      treatment with the S1P inhibitor PF-429242 reduced LUJV production.
    explanation: >-
      Shows that LUJV glycoprotein precursor processing by S1P supports viral
      production.

pathophysiology:
- name: NRP2/CD63-Dependent Lujo Virus Entry
  biological_scale: CELLULAR
  description: >-
    LUJV glycoprotein uses neuropilin-2 as a surface entry factor and the
    tetraspanin CD63 to stimulate pH-activated membrane fusion; human CD63 large
    extracellular-loop residues around phenylalanine 143 help explain why human
    cells are more permissive than rodent cell lines.
  genes:
  - preferred_term: NRP2
    term:
      id: hgnc:8005
      label: NRP2
  - preferred_term: CD63
    term:
      id: hgnc:1692
      label: CD63
  molecular_functions:
  - preferred_term: virus receptor activity
    modifier: INCREASED
    term:
      id: GO:0001618
      label: virus receptor activity
  biological_processes:
  - preferred_term: LUJV glycoprotein-mediated endocytosis
    term:
      id: GO:0075509
      label: endocytosis involved in viral entry into host cell
    modifier: INCREASED
  evidence:
  - reference: PMID:29120745
    reference_title: NRP2 and CD63 Are Host Factors for Lujo Virus Cell Entry.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A genome-wide haploid genetic screen identified the transmembrane protein
      neuropilin 2 (NRP2) and tetraspanin CD63 as factors for LUJV GP-mediated
      infection.
    explanation: >-
      Identifies NRP2 and CD63 as host factors used by LUJV glycoprotein during
      entry.
  - reference: PMID:35164564
    reference_title: Molecular Mechanisms Underlying the Cellular Entry and Host Range Restriction of Lujo Virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By site-directed mutagenesis, we further determined that a phenylalanine
      at position 143 in human CD63 was the key residue for efficient membrane
      fusion and VSVΔG*-LUJV/GP infection.
    explanation: >-
      Refines the CD63-dependent fusion mechanism by identifying a human CD63
      residue required for efficient LUJV glycoprotein-mediated entry.
  downstream:
  - target: Z-Protein Budding and S1P-Dependent Glycoprotein Maturation
    causal_link_type: DIRECT
- name: Z-Protein Budding and S1P-Dependent Glycoprotein Maturation
  biological_scale: MOLECULAR
  description: >-
    LUJV production depends on Z-protein late domains for efficient particle
    release and on host site 1 protease (MBTPS1) cleavage of the glycoprotein
    precursor at RKLM to mature the viral entry complex.
  genes:
  - preferred_term: MBTPS1
    term:
      id: hgnc:15456
      label: MBTPS1
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    modifier: INCREASED

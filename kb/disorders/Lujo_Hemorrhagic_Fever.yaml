name: Lujo Hemorrhagic Fever
creation_date: "2026-11-04T03:26:46Z"
category: Infectious
description: >-
  Lujo hemorrhagic fever is a severe arenaviral viral hemorrhagic fever caused
  by Lujo virus, a mammarenavirus first recognized in a nosocomial Southern
  African outbreak. Disease starts with an abrupt febrile systemic phase,
  commonly followed during the first week by pharyngitis, chest pain, rash,
  minor bleeding, and cervicofacial swelling; fatal cases can progress in the
  second week to disseminated intravascular coagulation, shock, multi-organ
  failure, and late neurologic signs. LUJV entry is unusual among arenaviruses:
  the viral glycoprotein uses NRP2 at the cell surface and CD63 to support
  low-pH endosomal fusion, and productive virion release requires LUJV Z
  late-domain function plus site-1-protease cleavage of the glycoprotein
  precursor.
synonyms:
- Lujo virus infection
- Lujo virus disease
- Zambian hemorrhagic fever
- Lujo viral hemorrhagic fever
disease_term:
  preferred_term: Lujo hemorrhagic fever
  term:
    id: MONDO:0017872
    label: Lujo hemorrhagic fever
parents:
- viral infectious disease
- viral hemorrhagic fever
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:19478873
      reference_title: "Genetic detection and characterization of Lujo virus, a new hemorrhagic fever-associated arenavirus from southern Africa."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lujo virus (LUJV), a new member of the family Arenaviridae and the first
        hemorrhagic fever-associated arenavirus from the Old World discovered in
        three decades, was isolated in South Africa during an outbreak of human
        disease characterized by nosocomial transmission and an unprecedented high
        case fatality rate of 80% (4/5 cases).
      explanation: >-
        Lujo hemorrhagic fever is an acute viral infectious disease caused by
        Mammarenavirus lujoense.

    coarse_binding_basis: SOURCE_UNSPECIFIED
  evidence:
  - reference: PMID:25393244
    reference_title: Clinical features and patient management of Lujo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Illness typically began with the abrupt onset of fever, malaise, headache,
      and myalgias followed successively by sore throat, chest pain,
      gastrointestinal symptoms, rash, minor hemorrhage, subconjunctival
      injection, and neck and facial swelling over the first week of illness.
    explanation: >-
      Gastrointestinal symptoms are reported among the typical first-week
      manifestations in the 2008 human LHF case series without finer HPO
      decomposition in the abstract.

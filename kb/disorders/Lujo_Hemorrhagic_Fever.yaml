    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lujo virus (LUJV) is a highly pathogenic zoonotic arenavirus first
      identified during a 2008 viral hemorrhagic fever (VHF) outbreak in
      Southern Africa, exhibiting an 80% case fatality rate.

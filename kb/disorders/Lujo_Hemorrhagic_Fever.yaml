name: Lujo Hemorrhagic Fever
creation_date: "2026-11-04T03:26:46Z"
category: Infectious
description: >-
  Lujo hemorrhagic fever is a severe arenaviral viral hemorrhagic fever caused
  by Lujo virus, a mammarenavirus first recognized in a nosocomial Southern
  African outbreak. Disease starts with an abrupt febrile systemic phase,
  commonly followed during the first week by pharyngitis, chest pain, rash,
  minor bleeding, and cervicofacial swelling; fatal cases can progress in the
  second week to disseminated intravascular coagulation, shock, multi-organ
  failure, and late neurologic signs. LUJV entry is unusual among arenaviruses:
  the viral glycoprotein uses NRP2 at the cell surface and CD63 to support
  low-pH endosomal fusion, and productive virion release requires LUJV Z
  late-domain function plus site-1-protease cleavage of the glycoprotein
  precursor.
synonyms:
- Lujo virus infection
- Lujo virus disease
- Zambian hemorrhagic fever
- Lujo viral hemorrhagic fever
disease_term:
  preferred_term: Lujo hemorrhagic fever
  term:
    id: MONDO:0017872
    label: Lujo hemorrhagic fever
parents:
- viral infectious disease
- viral hemorrhagic fever
infectious_agent:
- name: Lujo virus
  description: >-
    Lujo virus is a genetically distinct mammarenavirus, now classified as
    Mammarenavirus lujoense, that was isolated from the 2008 Southern African
    hemorrhagic-fever outbreak.
  infectious_agent_term:
    preferred_term: Lujo virus
    term:
      id: NCBITaxon:3052314
      label: Mammarenavirus lujoense
  evidence:
  - reference: PMID:19478873
    reference_title: "Genetic detection and characterization of Lujo virus, a new hemorrhagic fever-associated arenavirus from southern Africa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lujo virus (LUJV), a new member of the family Arenaviridae and the first
      hemorrhagic fever-associated arenavirus from the Old World discovered in
      three decades, was isolated in South Africa during an outbreak of human
      disease characterized by nosocomial transmission and an unprecedented high
      case fatality rate of 80% (4/5 cases).
    explanation: >-
      Identifies LUJV as the arenavirus isolated from the outbreak that defined
      Lujo hemorrhagic fever.
transmission:
- name: Nosocomial blood and body-fluid transmission
  description: >-
    Recognized human spread has occurred in the healthcare setting during the
    Southern African outbreak; the natural reservoir has not yet been
    identified.
  evidence:
  - reference: PMID:25393244
    reference_title: Clinical features and patient management of Lujo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In 2008 a nosocomial outbreak of five cases of viral hemorrhagic fever due
      to a novel arenavirus, Lujo virus, occurred in Johannesburg, South Africa.
    explanation: >-
      Documents healthcare-associated transmission in the original Lujo
      hemorrhagic fever outbreak.
  - reference: PMID:41118368
    reference_title: Age- and sex-associated differences in Lujo hemorrhagic fever pathogenesis in strain 13/N guinea pigs.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Despite its public health significance, LUJV remains poorly understood,
      with no approved treatments, vaccines, or known reservoir.
    explanation: >-
      Supports leaving the natural-reservoir side of LUJV transmission
      unmodeled.
prevalence:
- population: Recognized 2008 Lujo hemorrhagic fever outbreak
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2008 Southern African cluster remains the defining recognized Lujo
    hemorrhagic fever outbreak, with five reported cases.
  evidence:
  - reference: PMID:25393244
    reference_title: Clinical features and patient management of Lujo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the clinical features of five cases of Lujo hemorrhagic fever
      and summarize their clinical management, as well as providing additional
      epidemiologic detail regarding the 2008 outbreak.
    explanation: >-
      Provides the case count for the recognized 2008 LHF outbreak.
progression:
- phase: First-week febrile systemic illness
  evidence:
  - reference: PMID:25393244
    reference_title: Clinical features and patient management of Lujo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Illness typically began with the abrupt onset of fever, malaise, headache,
      and myalgias followed successively by sore throat, chest pain,
      gastrointestinal symptoms, rash, minor hemorrhage, subconjunctival
      injection, and neck and facial swelling over the first week of illness.
    explanation: >-
      Defines the early systemic phase observed in the original LHF case
      series.
- phase: Second-week shock and multi-organ failure
  evidence:
  - reference: PMID:25393244
    reference_title: Clinical features and patient management of Lujo hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Shock and multi-organ system failure, often with evidence of disseminated
      intravascular coagulopathy, ensued in the second week, with death in four
      of the five cases.
    explanation: >-
      Defines the late severe phase observed in fatal LHF cases.
pathophysiology:
- name: NRP2/CD63-Dependent Lujo Virus Entry
  biological_scale: CELLULAR
  description: >-
    LUJV glycoprotein uses neuropilin-2 as a surface entry factor and the
    tetraspanin CD63 to stimulate pH-activated membrane fusion; human CD63 large
    extracellular-loop residues around phenylalanine 143 help explain why human
    cells are more permissive than rodent cell lines.
  biological_processes:
  - preferred_term: LUJV glycoprotein-mediated endocytosis
    term:
      id: GO:0075509
      label: endocytosis involved in viral entry into host cell
    modifier: INCREASED
  evidence:
  - reference: PMID:29120745
    reference_title: NRP2 and CD63 Are Host Factors for Lujo Virus Cell Entry.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A genome-wide haploid genetic screen identified the transmembrane protein
      neuropilin 2 (NRP2) and tetraspanin CD63 as factors for LUJV GP-mediated
      infection.
    explanation: >-
      Identifies NRP2 and CD63 as host factors used by LUJV glycoprotein during
      entry.
  - reference: PMID:35164564
    reference_title: Molecular Mechanisms Underlying the Cellular Entry and Host Range Restriction of Lujo Virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By site-directed mutagenesis, we further determined that a phenylalanine
      at position 143 in human CD63 was the key residue for efficient membrane
      fusion and VSVΔG*-LUJV/GP infection.
    explanation: >-
      Refines the CD63-dependent fusion mechanism by identifying a human CD63
      residue required for efficient LUJV glycoprotein-mediated entry.
  downstream:
  - target: Z-Protein Budding and S1P-Dependent Glycoprotein Maturation
    causal_link_type: DIRECT
- name: Z-Protein Budding and S1P-Dependent Glycoprotein Maturation
  biological_scale: MOLECULAR
  description: >-
    LUJV production depends on Z-protein late domains for efficient particle
    release and on site 1 protease cleavage of the glycoprotein precursor at
    RKLM to mature the viral entry complex.
  biological_processes:
  - preferred_term: viral budding
    term:
      id: GO:0046755
      label: viral budding
    modifier: INCREASED
  - preferred_term: viral glycoprotein precursor processing
    term:
      id: GO:0019082
      label: viral protein processing
    modifier: INCREASED
  evidence:
  - reference: PMID:26719243
    reference_title: Analysis of Assembly and Budding of Lujo Virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The L domains in Z are required for efficient virus-like particle release,
      but Tsg101, ALIX/AIP1, and Vps4A/B are unnecessary for budding.
    explanation: >-
      Shows that LUJV Z-protein late domains are needed for efficient particle
      release.
  - reference: PMID:26719243
    reference_title: Analysis of Assembly and Budding of Lujo Virus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LUJV GPC is cleaved by site 1 protease (S1P) at the RKLM motif, and
      treatment with the S1P inhibitor PF-429242 reduced LUJV production.
    explanation: >-
      Shows that LUJV glycoprotein precursor processing by S1P supports viral
      production.
  downstream:
  - target: Systemic Arenaviral Illness
    causal_link_type: DIRECT
- name: Systemic Arenaviral Illness
  biological_scale: ORGANISM
  description: >-
    LUJV infection produces an abrupt systemic viral illness with fever,
    headache, myalgia, pharyngitis, chest pain, rash, cervicofacial swelling,
    and minor hemorrhage during the first week of recognized human disease.
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
    modifier: INCREASED

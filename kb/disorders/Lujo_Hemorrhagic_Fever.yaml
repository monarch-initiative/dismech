    Lujo virus is a zoonotic Old World mammarenavirus whose natural animal
    reservoir and wildlife maintenance cycle remain unidentified. Humans are
    accidental hosts in whom spillover followed by secondary healthcare
    transmission produces severe systemic infection.
  hosts:
  - preferred_term: Homo sapiens

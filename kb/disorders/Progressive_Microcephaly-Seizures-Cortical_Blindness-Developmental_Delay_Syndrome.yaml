differential_diagnoses:
- name: DIAPH1-related sensorineural hearing loss-thrombocytopenia syndrome
  description: >-
    The allelic dominant DIAPH1 entity, caused by gain-of-function variants that disrupt the
    DID-DAD autoinhibition rather than removing mDia1. It presents with sensorineural hearing loss
    and macrothrombocytopenia and no neurodevelopmental phenotype, and heterozygous carriers of
    the recessive alleles in SCBMS families had no hearing impairment. Curated in dismech as
    Autosomal_Dominant_Nonsyndromic_Hearing_Loss_67 and Platelet-type_Bleeding_Disorder_15.
  evidence:
  - reference: PMID:38915998
    reference_title: A Novel Variant in the DIAPH1 Gene Causing Macrothrombocytopenia and Non-syndromic Hearing Loss in a Pediatric Saudi Girl.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Dominant gain-of-function DIAPH1 variants cause macrothrombocytopenia and sensorineural deafness (autosomal dominant non-syndromic hearing loss 1 (DFNA1)), while homozygous loss of DIAPH1 results in seizures, cortical blindness, and microcephaly syndrome (SCBMS)."
    explanation: States the contrast between the two DIAPH1 entities directly.
- name: Autosomal recessive primary microcephaly
  description: >-
    The MCPH genes, including ASPM and WDR62, produce congenital rather than progressive
    microcephaly with intellectual disability and without the combined immune phenotype, low
    TRECs or lymphoma risk that point toward DIAPH1. Both have GeneReviews chapters, which DIAPH1
    does not.
- name: Congenital infection
  description: >-
    Congenital cytomegalovirus and the other TORCH infections produce microcephaly, seizures and
    visual impairment, and are the main acquired mimic to exclude before pursuing a Mendelian
    diagnosis in an infant with this presentation.
animal_models:
- name: Diap1 knockout mouse
  species: Mouse
  genotype: Diap1 (mDia1) constitutive knockout
  publication: PMID:24781755
  description: >-
    Constitutive mouse knockout. Body and brain size are grossly normal, so the model does not
    reproduce the human microcephaly; histology of coronal brain sections at early and postnatal
    stages shows unilateral ventricular enlargement. The founding paper itself reports the model
    as showing both similarities to and differences from the human pathology.
  genes:
  - preferred_term: Diaph1
    term:
      id: MGI:1194490
      label: Diaph1
  modeled_mechanisms:
  - target: Impaired Neural Precursor Division and Cortical Neuron Output
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The knockout does not produce the reduced brain size that defines the human cortical
      phenotype, although it does show a ventricular abnormality.
    limitations: >-
      Grossly normal body and brain size means the defining human feature is absent. ClinGen
      records the same discrepancy for the mouse models generally, noting they did not reproduce
      the microcephaly, seizures or cortical blindness while reproducing the immune phenotype.
      Mammalian formin redundancy with mDia2 and mDia3 and species differences in cortical
      neurogenesis are candidate explanations and neither is tested in the cited work.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        The mouse does not develop microcephaly on loss of the orthologous gene, so the model
        cannot be used to study the human cortical-size phenotype at all. Human neurogenesis
        depends on progenitor populations and a cortical expansion the mouse does not share.
    evidence:
    - reference: PMID:24781755
      reference_title: Homozygous loss of DIAPH1 is a novel cause of microcephaly in humans.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "diap1 (mDia1 knockout (KO))-deficient mice have grossly normal body and brain size."
      explanation: The measurement that contradicts recapitulation of the human microcephaly in this model.
  evidence:
  - reference: PMID:24781755
    reference_title: Homozygous loss of DIAPH1 is a novel cause of microcephaly in humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "our histological analysis of diap1 KO mouse coronal brain sections at early and postnatal stages shows unilateral ventricular enlargement, indicating that this mutant mouse shows both important similarities as well as differences with human pathology"
    explanation: The founding paper's own assessment of what this model does and does not show.
- name: Xenopus tropicalis diaph1 loss of function
  species: Xenopus tropicalis
  genotype: diaph1 knockout
  publication: PMID:41860019
  description: >-
    Knockout in Xenopus tropicalis reproduced the growth and eye defects seen in patients, making
    it the model that comes closest to the non-immune phenotype.
  modeled_mechanisms:
  - target: Impaired Neural Precursor Division and Cortical Neuron Output
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Growth and eye defects corresponding to the human phenotype, in a non-mammalian model.
    limitations: >-
      A non-mammalian model of a human cortical phenotype: Xenopus has no six-layered neocortex
      and no occipital lobe, so the eye and growth defects are a partial correlate rather than a
      model of the cortical malformation. The cited report gives the phenotype without cortical
      histology.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The anatomical structure that carries the human phenotype, an expanded six-layered
        neocortex with occipital-predominant involvement, does not exist in Xenopus, so a
        corresponding cortical readout is not available in this model.
    evidence:
    - reference: PMID:41860019
      reference_title: "Recessive loss of DIAPH1 function causes a progressive neurodevelopmental syndrome with variable immunological involvement."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The Xenopus model mirrored growth and eye defects seen in humans"
      explanation: The reported correspondence between this model and the human phenotype.
- name: Danio rerio diaph1 loss of function
  species: Zebrafish
  genotype: diaph1 knockout
  publication: PMID:41860019
  description: >-
    Zebrafish knockout showed no overt malformation but seizure-like behaviour in Phenothiazine
    assays, which separates the epilepsy from the structural malformation.
  modeled_mechanisms:
  - target: Seizure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Seizure-like behaviour without structural brain malformation, which is evidence that the
      epilepsy does not require the malformation.
    limitations: >-
      Seizure-like behaviour was elicited in a Phenothiazine assay rather than arising
      spontaneously, and no electrographic correlate is reported in the cited abstract, so the
      readout is a provoked behavioural proxy for human epilepsy.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is drug-provoked seizure-like swimming behaviour; the node's quantity
        is spontaneous epilepsy with an electrographic correlate in a malformed human cortex.
    evidence:
    - reference: PMID:41860019
      reference_title: "Recessive loss of DIAPH1 function causes a progressive neurodevelopmental syndrome with variable immunological involvement."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "zebrafish exhibited no overt malformations but showed seizure-like behavior in Phenothiazine assays"
      explanation: Reports the dissociation between seizure phenotype and structural malformation in this model.
treatments:
- name: Antiseizure pharmacotherapy
  description: >-
    Symptomatic treatment of the epilepsy. No DIAPH1-specific or disease-modifying therapy exists,
    and no antiseizure agent has been reported as preferentially effective in this disorder in the
    sources used here, so no specific agent is recorded.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Seizure
    description: Symptomatic seizure control; does not address the underlying cytoskeletal lesion.
- name: Genetic counseling and carrier testing
  description: >-
    Autosomal recessive recurrence risk of 25% for siblings, with carrier testing and prenatal or
    preimplantation options. This matters disproportionately here because most reported families
    are consanguineous and because a Finnish founder allele creates a population in which carrier
    testing has a defined target.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

    reference_title: "Loss of DIAPH1 causes SCBMS, combined immunodeficiency, and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Genetic analyses found all Finnish patients homozygous for a rare DIAPH1 splice-variant (NM_005219:c.684+1G>A) enriched in the Finnish population"
    explanation: Establishes the founder allele that gives carrier testing a defined target in this population.
- name: Immunological surveillance
  description: >-
    Monitoring for the combined immune defect and its complications, including infection and
    B-cell lymphoma. Because gross lymphocyte subsets and immunoglobulins are often normal, the
    surveillance that detects the defect is T-cell receptor excision circles and naive
    T-lymphocyte counts. No immunoglobulin-replacement or transplant outcome data for this
    disorder appear in the sources used here, so no such intervention is recorded.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Combined immunodeficiency
    description: >-
      Detects and monitors the immune defect rather than correcting it.
  evidence:
  - reference: PMID:41860019
    reference_title: "Recessive loss of DIAPH1 function causes a progressive neurodevelopmental syndrome with variable immunological involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Although the majority had normal lymphocyte subsets and serum immunoglobulins, T cell receptor excision circles and naïve T-lymphocyte counts were consistently low"
    explanation: Identifies the measurements that surveillance must use, and why a normal subset panel is insufficient.
discussions:
- discussion_id: scbms_mouse_lacks_microcephaly
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Neural Precursor Division and Cortical Neuron Output
  - animal_models#Mouse
  prompt: >-
    Why does loss of the orthologous gene leave mouse brain size grossly normal when biallelic
    DIAPH1 loss causes progressive microcephaly in humans, and which model can therefore be used
    to study the cortical phenotype?
  rationale: >-
    This is a mismatch of the kind where evidence exists in a model and its translational validity
    is the open question, not one where evidence is absent. The mouse knockout exists, has been
    examined histologically, and reproduces the immune phenotype; what it does not reproduce is
    the microcephaly, the seizures or the cortical blindness, which are the features that define
    the human disease and give it its name. ClinGen's own curation records this discrepancy
    explicitly. The consequence for curation is that the chain from the demonstrated
    human-neural-precursor spindle defect to the cortical phenotype rests on an inference across a
    gap no current mammalian model spans, which is why that node is marked provisional.
    Mammalian formin redundancy with mDia2 and mDia3, and species differences in cortical
    neurogenesis, are the candidate explanations named in the literature and neither has been
    tested. The Xenopus knockout reproduces growth and eye defects and the zebrafish knockout
    shows provoked seizure-like behaviour without malformation, but neither animal has a
    six-layered neocortex, so neither can model occipital-predominant cortical malformation
    either.
  evidence:
  - reference: CGGV:assertion_1a6bb748-bda5-4d57-ab9c-00882cbefdf6-2024-11-21T170000.000Z
    reference_title: DIAPH1 / progressive microcephaly-seizures-cortical blindness-developmental delay syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Interestingly, the mouse models were not reported to recapitulate the full phenotype, specifically the microcephaly, seizures, and cortical blindness, but did recapitulate the immune phenotype."
    explanation: ClinGen states the mismatch directly, including which features transfer and which do not.
  - reference: PMID:24781755
    reference_title: Homozygous loss of DIAPH1 is a novel cause of microcephaly in humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "diap1 (mDia1 knockout (KO))-deficient mice have grossly normal body and brain size."
    explanation: The primary measurement establishing the mismatch.
  proposed_experiments:
  - experiment_id: scbms_human_cortical_organoid_diaph1_null
    name: Human cortical organoid or neural-progenitor model of biallelic DIAPH1 loss
    description: >-
      Generate DIAPH1-null human iPSC-derived cortical organoids or neural progenitors, alongside
      isogenic controls, and measure progenitor division, spindle orientation, MTOC positioning
      and neuron output. This asks the question in the species whose cortex carries the phenotype
      and whose neural precursors already have a demonstrated mDia1 spindle dependence, which is
      the gap the animal models leave.
    would_support:
    - pathophysiology#Impaired Neural Precursor Division and Cortical Neuron Output
    supporting_outcome:
    - >-
        DIAPH1-null human cortical organoids show misoriented progenitor divisions, reduced
        progenitor expansion and reduced neuron output relative to isogenic controls.
    refuting_outcome:
    - >-
        DIAPH1-null human cortical organoids divide, expand and produce neurons indistinguishably
        from isogenic controls, which would place the human microcephaly outside progenitor division
        and require a different route.
  - experiment_id: scbms_combined_mdia_paralog_loss_mouse
    name: Combined mDia1, mDia2 and mDia3 loss in a mammalian cortical model
    description: >-
      Test the redundancy explanation directly by removing the paralogous formins together in a
      mouse or mouse-derived cortical model and asking whether a microcephaly phenotype appears.
      This discriminates between redundancy and a species difference in cortical neurogenesis as
      the reason the single knockout is unaffected.
    would_support:
    - pathophysiology#Impaired Neural Precursor Division and Cortical Neuron Output
    supporting_outcome:
    - >-
        Combined formin loss produces reduced brain size in the mouse, which would attribute the
        single-knockout result to paralog redundancy rather than to a species difference.
    refuting_outcome:
    - >-
        Combined formin loss still leaves mouse brain size normal, which would attribute the
        discrepancy to a species difference in cortical neurogenesis and further limit mammalian
        modelling of this phenotype.

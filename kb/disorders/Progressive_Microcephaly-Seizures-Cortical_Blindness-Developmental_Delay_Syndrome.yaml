pathophysiology:
- name: Biallelic DIAPH1 Loss of Function
  description: >-
    Homozygous or compound heterozygous nonsense, frameshift and canonical splice-site DIAPH1
    variants remove functional mDia1. ClinGen records loss of function as the mechanism of
    pathogenicity for this entity, in explicit contrast to the gain-of-function mechanism of the
    dominant DIAPH1 hearing-loss arm. A heterozygous truncating allele that removes the FH2 domain
    abolishes actin-elongation activity in vitro, which is the direct biochemical demonstration
    that truncation destroys the protein's catalytic output.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  evidence:
  - reference: CGGV:assertion_1a6bb748-bda5-4d57-ab9c-00882cbefdf6-2024-11-21T170000.000Z
    reference_title: DIAPH1 / progressive microcephaly-seizures-cortical blindness-developmental delay syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of disease for AR SCBMS is thought to be loss of function."
    explanation: ClinGen states the disease mechanism for this gene-disease pair.
  - reference: PMID:38915998
    reference_title: "A Novel Variant in the DIAPH1 Gene Causing Macrothrombocytopenia and Non-syndromic Hearing Loss in a Pediatric Saudi Girl."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Dominant gain-of-function DIAPH1 variants cause macrothrombocytopenia and sensorineural deafness (autosomal dominant non-syndromic hearing loss 1 (DFNA1)), while homozygous loss of DIAPH1 results in seizures, cortical blindness, and microcephaly syndrome (SCBMS)."
    explanation: States the allelic contrast that scopes this entry; quoted from the framing of a report about the dominant entity, so the quote is background rather than that paper's own result.
  gene:
    preferred_term: DIAPH1
    term:
      id: hgnc:2876
      label: DIAPH1
  molecular_functions:
  - preferred_term: mDia1 FH2-domain actin filament binding and processive elongation
    term:
      id: GO:0051015
      label: actin filament binding
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: DIAPH1
      term:
        id: hgnc:2876
        label: DIAPH1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    description: Biallelic nonsense, frameshift or canonical splice-site alleles; all reported probands homozygous.
  downstream:
  - target: Loss of Rho-Effector Formin Actin Elongation
    description: >-
      Removing mDia1 removes the Rho-activated formin that elongates long linear actin filaments,
      so the activity its downstream cell biology depends on is absent.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35060117
      reference_title: "Late-onset hearing loss case associated with a heterozygous truncating variant of DIAPH1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "p.R1049X lacks F-actin elongation activity because this variant truncates one-third of the FH2 domain, which is vital for DIAPH1 dimerization and processive F-actin elongation activity."
      explanation: Direct biochemical demonstration that truncating the FH2 domain abolishes the elongation activity, so a truncating allele removes the enzymatic output rather than merely lowering dosage.
  - target: Reduced Mitochondrial Respiratory Chain Complex IV
    description: >-
      Patient-derived fibroblasts lacking DIAPH1 carry less respiratory-chain complex IV. The
      route from a cytoskeletal lesion to complex IV abundance is not established in the cited
      work, so this edge records only that the association follows the lesion; it is drawn from
      the lesion rather than from a cell-biological intermediate for that reason.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33662367
      reference_title: "Loss of DIAPH1 causes SCBMS, combined immunodeficiency, and mitochondrial dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Experiments with immortalized, patient-derived fibroblasts indicated that DIAPH1 affects the amount of complex IV of the mitochondrial respiratory chain."
      explanation: The observation linking loss of DIAPH1 to reduced complex IV, in patient-derived cells; it establishes the association without identifying the intermediate steps.
- name: Loss of Rho-Effector Formin Actin Elongation
  description: >-
    mDia1 is a Diaphanous-related formin and a Rho effector. On binding GTP-bound Rho its
    autoinhibition is relieved and the FH2 domain nucleates and processively elongates long linear
    actin filaments, which is the activity that maintains polarity during adhesion, migration and
    cell division. Loss of mDia1 removes that activity.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:24781755
    reference_title: "Homozygous loss of DIAPH1 is a novel cause of microcephaly in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Upon the activation of GTP-bound Rho, mDia1 generates linear actin filaments in the maintenance of polarity during adhesion, migration, and division in immune cells and neuroepithelial cells, and in driving tangential migration of cortical interneurons in the rodent."
    explanation: States the molecular activity of mDia1 and the cell processes that depend on it; the sentence is the founding paper's framing of established formin biology rather than its own experimental result.
  biological_processes:
  - preferred_term: actin filament polymerization
    term:
      id: GO:0030041
      label: actin filament polymerization
    modifier: DECREASED
  - preferred_term: actin nucleation
    term:
      id: GO:0045010
      label: actin nucleation
    modifier: DECREASED
  molecular_functions:
  - preferred_term: mDia1 FH2-domain actin filament binding and elongation
    term:
      id: GO:0051015
      label: actin filament binding
    modifier: DECREASED
  downstream:
  - target: Failure of Cell Polarity, Spindle Formation and MTOC Positioning
    description: >-
      Without processive linear-actin elongation and the microtubule coordination that accompanies
      it, the polarity, division and organelle-positioning machinery that depends on this
      cytoskeletal architecture fails.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18955552
      reference_title: "Memo-RhoA-mDia1 signaling controls microtubules, the actin network, and adhesion site formation in migrating cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Memo-RhoA-mDia1 signaling coordinates the organization of the lamellipodial actin network, adhesion site formation, and MT outgrowth within the cell leading edge to sustain cell motility."
      explanation: Establishes that mDia1 acting downstream of RhoA coordinates the actin network together with microtubule outgrowth and adhesion, which is the coupled function lost in this disease.
- name: Failure of Cell Polarity, Spindle Formation and MTOC Positioning
  description: >-
    The cell-biological consequence shared by every organ affected: loss of mDia1 impairs
    establishment of cell polarity, mitotic spindle formation and cell division, and repositioning
    of the microtubule-organizing center. In human neuronal precursor cells mDia1 is expressed
    during mitotic division and has a major effect on spindle formation; in patient T cells the
    same lesion leaves the microtubule-organizing center unable to reposition efficiently to the
    immunologic synapse. This is the node at which the neural and immune branches separate.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "neural_progenitor_centrosome_spindle_dysfunction#Centrosome and Mitotic Spindle Perturbation"
  evidence:
  - reference: PMID:24781755
    reference_title: "Homozygous loss of DIAPH1 is a novel cause of microcephaly in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We also found that mDia1 protein is expressed in human neuronal precursor cells during mitotic cell division and has a major impact in the regulation of spindle formation and cell division."
    explanation: The founding paper's own result locating the spindle defect in human neuronal precursors, which is the cell type the microcephaly branch requires.
  - reference: PMID:33662367
    reference_title: "Loss of DIAPH1 causes SCBMS, combined immunodeficiency, and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Patient-derived peripheral blood T cells exhibited impaired adhesion and inefficient microtubule-organizing center repositioning to the immunologic synapse."
    explanation: Demonstrates the same polarity and MTOC-positioning failure in a patient cell type, which is what makes this a shared node rather than a neural-specific one. Graded IN_VITRO rather than HUMAN_CLINICAL because adhesion and synapse formation were assayed in cells taken out of the patient, not observed in the patient.
  biological_processes:
  - preferred_term: establishment of cell polarity
    term:
      id: GO:0030010
      label: establishment of cell polarity
    modifier: DECREASED
  - preferred_term: mitotic spindle organization
    term:
      id: GO:0007052
      label: mitotic spindle organization
    modifier: DECREASED
  - preferred_term: microtubule cytoskeleton organization
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
    modifier: DECREASED
  downstream:
  - target: Impaired Neural Precursor Division and Cortical Neuron Output
    description: >-
      In neural progenitors the spindle and polarity defect reduces and distorts the progenitor
      pool, lowering cortical neuron output.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24781755
      reference_title: "Homozygous loss of DIAPH1 is a novel cause of microcephaly in humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "mDia1 protein is expressed in human neuronal precursor cells during mitotic cell division and has a major impact in the regulation of spindle formation and cell division"
      explanation: Links the shared cytoskeletal lesion specifically to division of human neural precursors.
  - target: Defective Lymphocyte Maturation and Activation
    description: >-
      In lymphocytes the same adhesion and MTOC-positioning failure blocks activation,
      proliferation and B-cell maturation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33662367
      reference_title: "Loss of DIAPH1 causes SCBMS, combined immunodeficiency, and mitochondrial dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "defective B-cell maturation, and lack of naive T cells"
      explanation: >-
        Re-quoted to the part of the sentence that is immunophenotyping of patient blood, so the
        item is cleanly HUMAN_CLINICAL. The same sentence also reports poor lymphocyte activation
        and proliferation, which the paper measured with in vitro stimulation assays; that claim
        is carried by the IN_VITRO items on this node instead rather than graded under a clinical
        source here.
- name: Impaired Neural Precursor Division and Cortical Neuron Output
  description: >-
    mDia1 is expressed in human neuronal precursor cells during mitotic division and is required
    for normal spindle formation, so its loss distorts progenitor division during corticogenesis
    and lowers cortical neuron output. The resulting microcephaly is postnatal and progressive
    rather than congenital, and the structural abnormalities reported across the largest cohort
    are frequently occipital-predominant, which is consistent with the cortical visual impairment
    that accompanies them. The step from a demonstrated human-precursor spindle defect to the
    cortical phenotype is an inference: no human neurodevelopmental tissue or organoid study of
    DIAPH1 loss is cited in the sources used here, and the mouse knockout does not reproduce the
    microcephaly.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  node_class: DEVELOPMENTAL_MALFORMATION
  conforms_to: "neural_progenitor_centrosome_spindle_dysfunction#Abnormal Cortical Neuron Output and Gyration"
  evidence:

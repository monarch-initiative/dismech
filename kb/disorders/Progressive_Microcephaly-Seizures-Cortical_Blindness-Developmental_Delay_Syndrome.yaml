- name: Reduced Mitochondrial Respiratory Chain Complex IV
  description: >-
    Immortalized patient-derived fibroblasts show that DIAPH1 loss reduces the amount of complex
    IV of the mitochondrial respiratory chain, and the patients' clinical and laboratory findings
    also suggested mitochondrial dysfunction. How a cytoskeletal lesion lowers complex IV is not
    established in the cited work, and this node is recorded as a demonstrated association rather
    than a mechanistic step with a known route.

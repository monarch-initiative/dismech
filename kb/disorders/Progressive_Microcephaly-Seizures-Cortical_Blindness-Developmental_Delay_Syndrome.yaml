    snippet: "The mean age of onset for patients in the group of 20 patients with a known age of onset was 2.3 months (SD = 1.6)."
    explanation: Establishes the early-infantile onset window quantitatively.
- phase: Progressive neurological course with infectious and neoplastic complications
  notes: >-
    Microcephaly worsens postnatally and the neurological disability is severe and persistent.
    Recurrent respiratory infection, bronchiectasis and, in a subset, B-cell lymphoma are the
    reported complications. In the 2024 literature review 13 of 20 patients with determinable
    outcome were alive at the time of reporting; that figure is an ascertainment-biased survival
    snapshot across heterogeneous follow-up, not a survival rate.
  evidence:
  - reference: PMID:39578953
    reference_title: "A Novel Homozygote Pathogenic Variant in the DIAPH1 Gene Associated With Seizures, Cortical Blindness, and Microcephaly Syndrome (SCBMS): Report of a Family and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

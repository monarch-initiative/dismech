- name: Immunological evaluation including TRECs and naive T-cell counts
  description: >-
    Because gross lymphocyte subsets and serum immunoglobulins are often normal, the immune defect
    is found by measuring T-cell receptor excision circles and naive T-lymphocyte counts, which
    are consistently low. A normal subset panel does not exclude the immune phenotype.

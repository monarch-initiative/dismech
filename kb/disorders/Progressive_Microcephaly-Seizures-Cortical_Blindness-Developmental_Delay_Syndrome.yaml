    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "CRISPR-Cas9 knockout of DIAPH1 in PBMCs from healthy donors replicated the T-cell activation defect."
    explanation: An engineered knockout in normal human cells reproduces the patient defect, establishing that DIAPH1 loss is sufficient for it.
  - reference: PMID:41860019

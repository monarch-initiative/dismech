- name: Defective Lymphocyte Maturation and Activation
  description: >-
    The same adhesion and microtubule-organizing-center defect in lymphocytes produces poor
    lymphocyte activation and proliferation, defective B-cell maturation and a lack of naive T
    cells. CRISPR-Cas9 knockout of DIAPH1 in healthy-donor peripheral blood mononuclear cells
    reproduces the T-cell activation defect, which makes this the most directly demonstrated
    branch of the mechanism. In the largest cohort the gross lymphocyte subsets and serum
    immunoglobulins were usually normal while T-cell receptor excision circles and naive
    T-lymphocyte counts were consistently low, so the laboratory signature is thymic output
    rather than lymphopenia.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  node_class: CELLULAR_FUNCTION_DISTURBANCE
  evidence:
  - reference: PMID:33662367

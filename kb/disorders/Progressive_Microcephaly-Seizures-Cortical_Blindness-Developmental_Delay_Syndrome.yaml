- phase: Early infantile onset
  notes: >-
    Presentation is in the first months of life; the mean reported age of onset across twenty
    reviewed patients was 2.3 months, with a median of 2.25 months. Head circumference may be
    normal at birth and the microcephaly declares itself postnatally.
  evidence:
  - reference: PMID:39578953
    reference_title: "A Novel Homozygote Pathogenic Variant in the DIAPH1 Gene Associated With Seizures, Cortical Blindness, and Microcephaly Syndrome (SCBMS): Report of a Family and Literature Review."

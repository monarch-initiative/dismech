name: Progressive Microcephaly-Seizures-Cortical Blindness-Developmental Delay Syndrome
category: Mendelian
creation_date: "2026-11-12T22:20:00Z"
synonyms:
- SCBMS
- seizures, cortical blindness, microcephaly syndrome
- DIAPH1-related neuroimmunological syndrome
description: >-
  An ultra-rare autosomal recessive disorder caused by biallelic loss-of-function variants in
  DIAPH1, which encodes the Rho-effector formin mDia1. mDia1 nucleates and processively elongates
  long linear actin filaments on activation by GTP-bound Rho and coordinates the microtubule
  cytoskeleton with them, so its loss removes a single cytoskeletal function on which cell
  polarity, mitotic spindle formation and microtubule-organizing-center positioning all depend.
  The clinical core is early-infantile progressive postnatal microcephaly, epilepsy, cortical
  visual impairment or blindness and severe developmental delay, frequently with
  occipital-predominant structural brain abnormalities. Beyond the brain, the same lesion produces
  a combined immune deficiency in which lymphocyte subsets and immunoglobulins are often normal
  while T-cell receptor excision circles and naive T-lymphocyte counts are consistently low, and
  patient T cells show impaired adhesion and inefficient microtubule-organizing-center
  repositioning to the immunologic synapse. Reduced mitochondrial respiratory-chain complex IV and
  B-cell lymphoma in a subset of patients are documented in the Finnish and Omani cohort. The
  disorder must be kept apart from the allelic dominant gain-of-function DIAPH1 entity, which
  causes sensorineural hearing loss with macrothrombocytopenia and no neurodevelopmental
  phenotype.
disease_term:
  preferred_term: progressive microcephaly-seizures-cortical blindness-developmental delay syndrome
  term:
    id: MONDO:0014714
    label: progressive microcephaly-seizures-cortical blindness-developmental delay syndrome
parents:
- Mendelian neurodevelopmental disorder
- Inborn error of immunity
notes: >-
  Entry scope. This entry is the autosomal recessive, biallelic loss-of-function DIAPH1 entity
  only. DIAPH1 appears in four other dismech entries as a different allelic entity -
  Autosomal_Dominant_Nonsyndromic_Hearing_Loss_67, Autosomal_Recessive_Nonsyndromic_Hearing_Loss_93,
  Platelet-type_Bleeding_Disorder_15 and
  Thrombocytopenia_11_with_Multiple_Congenital_Anomalies_and_Dysmorphic_Facies - and the dominant
  hearing-loss/macrothrombocytopenia arm is a gain-of-function mechanism that relieves DID-DAD
  autoinhibition rather than removing mDia1. ClinGen curates the two as separate disease entities
  and records that heterozygous carriers of the recessive alleles, including parents and siblings,
  were not reported to be clinically affected and had no hearing impairment. The entry is named
  from the MONDO label, which is also the ClinGen-preferred label for this gene-disease pair;
  ClinGen's own DIAPH1 dyadic name ("DIAPH1-related sensorineural hearing
  loss-thrombocytopenia syndrome") belongs to the dominant entity, so a DIAPH1-related name here
  would collide with it. No GeneReviews chapter exists. Searched cache/bookshelf/genereviews.csv
  (index snapshot 2026-09-10, 958 chapters) for DIAPH1, SCBMS, "cortical blindness" and
  "microcephaly syndrome"; the index carries ASPM Primary Microcephaly and WDR62 Primary
  Microcephaly but nothing covering this entity, and `just check-genereviews` reports NO_CHAPTER.
  Phenotype content is therefore taken from the primary cohorts rather than from a GeneReviews
  baseline. The ClinGen cache file committed here is stamped from a current ClinGen export
  (2026-11-12) rather than the release pinned in data/clingen/MANIFEST.yaml (2026-10-04), because
  `just fetch-reference` downloads and parses the current export; the pin had already drifted
  before this branch. The assertion identifier also differs from the one in the older committed
  cache/clingen/gene_validity.csv fallback, which renders the same classification date as
  T170000.000Z rather than T040000.000Z.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic loss-of-function DIAPH1 variants. All reported probands are
    homozygous or compound heterozygous, with homozygosity in consanguineous pedigrees and a
    Finnish founder splice allele. ClinGen classifies this gene-disease pair as autosomal
    recessive and records that heterozygous relatives were not reported to be clinically affected.
  evidence:
  - reference: CGGV:assertion_1a6bb748-bda5-4d57-ab9c-00882cbefdf6-2024-11-21T170000.000Z
    reference_title: DIAPH1 / progressive microcephaly-seizures-cortical blindness-developmental delay syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Heterozygous carriers (parents of patients or siblings) were not reported to be clinically affected, this includes no reports of hearing impairment, suggesting the mechanism of disease between AR SCBMS and AD SNHL +/- thrombocytopenia may be different."
    explanation: ClinGen states that carriers of the recessive alleles are unaffected, which is what makes this a recessive entity distinct from the dominant DIAPH1 arm.
  - reference: PMID:41860019
    reference_title: "Recessive loss of DIAPH1 function causes a progressive neurodevelopmental syndrome with variable immunological involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic DIAPH1 pathogenic variants cause a neurodevelopmental syndrome occasionally associated with immunodeficiency."
    explanation: The largest cohort states the biallelic requirement for the neurodevelopmental syndrome.
prevalence:
- population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate is published. Twenty cases across seven
    studies were on record by 2024; the 2026 cohort reports 53 individuals, 33 of them previously
    unreported.
  evidence:
  - reference: PMID:41860019
    reference_title: "Recessive loss of DIAPH1 function causes a progressive neurodevelopmental syndrome with variable immunological involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 53 individuals with biallelic DIAPH1 variants, including 33 previously unreported patients, were studied."
    explanation: Largest reported case count, establishing the order of magnitude of ascertained cases.
  - reference: PMID:39578953
    reference_title: "A Novel Homozygote Pathogenic Variant in the DIAPH1 Gene Associated With Seizures, Cortical Blindness, and Microcephaly Syndrome (SCBMS): Report of a Family and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty cases from seven studies were found after a review of the literature."
    explanation: Independent literature review establishing how few cases were ascertained before the 2026 cohort.
- population: Finnish population
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    A founder splice allele, NM_005219:c.684+1G>A, is enriched in Finland and accounted for all
    five Finnish patients in the 2021 cohort. No allele frequency or disease prevalence is given
    for the Finnish population in the cited source, so no rate is recorded here.
  evidence:
  - reference: PMID:33662367
    reference_title: "Loss of DIAPH1 causes SCBMS, combined immunodeficiency, and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses found all Finnish patients homozygous for a rare DIAPH1 splice-variant (NM_005219:c.684+1G>A) enriched in the Finnish population"
    explanation: Documents the founder allele and its population enrichment.

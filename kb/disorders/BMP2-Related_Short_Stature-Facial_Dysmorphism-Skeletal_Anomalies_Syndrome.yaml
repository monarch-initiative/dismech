diagnosis:
- name: Chromosomal microarray
  description: >-
    Detects deletions encompassing BMP2 and defines their genomic extent. Gene content informs interpretation
    of additional findings, but deletion size alone does not predict their penetrance.
  presence: PRESENT
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For larger deletions, validation and segregation were done using array comparative genomic hybridisation"
    explanation: >-
      Array CGH is the method used to confirm and size the deletions in this
      cohort.
- name: Exome or genome sequencing
  description: >-
    Can identify intragenic BMP2 variants, including truncating, frameshift, splice-altering and selected
    missense variants. Coverage and variant interpretation matter; low-level parental mosaicism may require
    targeted assays or another tissue.
  presence: PRESENT
  evidence:
  - reference: PMID:40285376
    reference_title: "Emergence of osteolysis as a new radiological feature in a case with a novel BMP2 gene variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a de novo heterozygous truncating variant (c.440C>G; p.Ser147*) in BMP2."
    explanation: >-
      Documents sequence-level identification of a de novo truncating BMP2 variant; the abstract does
      not establish a prior negative microarray.
- name: Growth hormone axis evaluation
  description: >-
    Recommended in the workup of short stature here, because partial isolated
    growth hormone deficiency has been documented in one individual and
    responded to replacement. Whether it is part of the syndrome or coincidental
    is unresolved.
  presence: VARIABLE
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Until then, we suggest that evaluation of growth hormone levels should be included in the medical investigation."
    explanation: >-
      The recommendation, stated with the uncertainty that motivates it.
- name: Audiological surveillance and middle ear examination
  description: >-
    Regular assessment of hearing and of the middle ear, proposed as routine
    surveillance because effusion and conductive loss are common and treatable.
  presence: PRESENT
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on our observations, we recommend that evaluation of language development and regular controls of the middle ear are included in the surveillance of these individuals."
    explanation: >-
      The seven-person 2025 cohort explicitly recommends surveillance of middle-ear disease and language
      development.
- name: Longitudinal skeletal radiography
  description: >-
    Longitudinal skeletal monitoring was proposed by the authors of the phalangeal osteolysis case report.
    The published abstract reports detection at age ten but does not provide earlier radiographic comparisons
    or a validated surveillance interval.
  presence: VARIABLE
  evidence:
  - reference: PMID:40285376
    reference_title: "Emergence of osteolysis as a new radiological feature in a case with a novel BMP2 gene variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings highlight the necessity of longitudinal skeletal monitoring in BMP2-related conditions"
    explanation: >-
      The recommendation as stated by the reporting authors.
- name: Cardiac imaging and rhythm assessment
  description: >-
    Echocardiography and electrocardiography characterize structural and rhythm involvement. A patient
    with bicuspid aortic valve and WPW underwent annual echocardiography that documented progressive aortic
    dilatation. This is a case-based surveillance example, not a validated universal interval.
  presence: VARIABLE
  evidence:
  - reference: PMID:33247540
    reference_title: A de novo pathogenic BMP2 variant-related phenotype with the novel finding of bicuspid aortic valve.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient was monitored annually with echocardiograms for progression of the cardiovascular involvement. Slow progressive dilation of aortic root and ascending aorta was noted without aortic stenosis and, at most, mild aortic insufficiency
    explanation: >-
      Documents longitudinal imaging and its findings in the intragenic-variant case.
  - reference: PMID:33247540
    reference_title: A de novo pathogenic BMP2 variant-related phenotype with the novel finding of bicuspid aortic valve.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: an electrocardiogram showed evidence of preexcitation consistent with Wolff–Parkinson–White syndrome (WPW).
    explanation: >-
      ECG identified pre-excitation in the patient evaluated for palpitations.

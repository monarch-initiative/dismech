prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Population prevalence is not established. Published cohorts include 12 individuals in the 2017 defining
    series, 18 in the 2023 international series, and seven in the 2025 report. These cohort sizes and
    the 2025 literature subset of 29 individuals are not independent counts to sum: the latter is restricted
    by genotype and potential confounding diagnoses.
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the literature most individuals (28/29) with BMP2 sequence variants or deletions encompassing only BMP2, and no other genetic variant conflicting interpretation, have no or mild developmental delay"
    explanation: >-
      A selected literature subset used to assess developmental outcomes, not a complete count of all
      published cases or a population prevalence estimate.
  - reference: PMID:37125634
    reference_title: "Monoallelic loss-of-function BMP2 variants result in BMP2-related skeletal dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used retrospective chart review to examine phenotypes from an international cohort of 18 individuals and compared these with published cases."
    explanation: >-
      Documents the size of the 2023 cohort without establishing a cumulative case count.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous BMP2 loss-of-function variants and deletions may arise de novo or be inherited. In the
    2017 family with two affected sisters, variant-specific assays detected somatic mosaicism in their
    clinically unaffected father; transmission to both daughters also establishes germline involvement.
    Routine blood sequencing did not detect the mosaic variant in that father.
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo occurrence and autosomal-dominant inheritance of variants, including paternal mosaicism in two affected sisters who inherited a BMP2 splice-altering variant, were observed across all reported families."
    explanation: >-
      Establishes dominant transmission and documents paternal mosaicism, which
      matters for recurrence counselling in apparently de novo families.
genetic:
- name: BMP2
  gene_term:
    preferred_term: BMP2
    term:
      id: hgnc:1069
      label: BMP2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    BMP2 at 20p12.3 encodes a secreted ligand of the TGF-beta superfamily. Reported disease-associated
    alleles include truncating, frameshift, splice-altering and initiation-codon variants, whole-gene
    deletions, and functionally assessed missense variants. The shared phenotype of intragenic variants,
    deletions and heterozygous knockout mice supports haploinsufficiency. This does not establish that
    every BMP2 missense variant is pathogenic or that every truncating allele undergoes nonsense-mediated
    decay. The 2017 study did not experimentally demonstrate nonsense-mediated decay. Deletion boundaries
    and additional variants matter when interpreting findings beyond the core phenotype.
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a cranioskeletal phenotype due to monoallelic truncating and frameshift BMP2 variants and deletions in 12 individuals from eight unrelated families that share features of short stature, a recognizable craniofacial gestalt, skeletal anomalies, and congenital heart disease."
    explanation: >-
      The defining series, establishing that truncating variants and deletions
      produce one shared phenotype.
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One individual had a novel frameshift variant in BMP2, and six individuals had 1.3-3.7 Mb microdeletions, including BMP2."
    explanation: >-
      Documents the two allele classes side by side in one cohort and gives the
      deletion size range.
  - reference: PMID:40285376
    reference_title: "Emergence of osteolysis as a new radiological feature in a case with a novel BMP2 gene variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a de novo heterozygous truncating variant (c.440C>G; p.Ser147*) in BMP2."
    explanation: >-
      A representative de novo nonsense allele, on the reference transcript used
      across the literature.
  - reference: PMID:37125634
    reference_title: "Monoallelic loss-of-function BMP2 variants result in BMP2-related skeletal dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sought to expand the phenotypic spectrum and highlight phenotypes of patients harboring monoallelic missense variants in BMP2."
    explanation: >-
      Establishes monoallelic missense variants as a disease-causing allele
      class in their own right, which the earlier truncating-and-deletion
      series did not cover. The functional evidence that these are
      loss-of-function alleles is a separate, zebrafish-based claim and is
      graded separately below.
  - reference: PMID:37125634
    reference_title: "Monoallelic loss-of-function BMP2 variants result in BMP2-related skeletal dysplasia spectrum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Missense variants modeled in zebrafish resulted in loss of protein function."
    explanation: >-
      The functional result that puts missense alleles in the same
      loss-of-function mechanism as the truncating ones rather than in a
      separate one.
pathophysiology:
- name: BMP2 Haploinsufficiency
  description: >-
    Loss of one functional BMP2 allele is the principal model for this disorder. Overlapping human phenotypes
    with intragenic variants and deletions, together with growth and rib abnormalities in heterozygous
    knockout mice, support dosage sensitivity. These observations do not quantify secreted ligand in patients
    or exclude other effects of individual mutant proteins.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BMP2
    term:
      id: hgnc:1069
      label: BMP2
  molecular_functions:
  - preferred_term: BMP2 growth factor activity
    modifier: DECREASED
    term:
      id: GO:0008083
      label: growth factor activity
  downstream:
  - target: Reduced Canonical BMP-SMAD Signalling Output
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Complete cranial neural crest Bmp2 deletion reduces mandibular SMAD phosphorylation. Reduced signaling
      is a proposed consequence of human haploinsufficiency; the dose-response and intervening receptor
      activity were not measured in patients.
    evidence:
    - reference: PMID:30413887
      reference_title: Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: As shown in Fig. 6 (a-d), the mutant mandibular bone exhibits reduced pSmad1/5/8 and pp38 signals.
      explanation: >-
        Immunostaining directly demonstrates reduced canonical and p38 signaling in the mandibular bone
        of Wnt1-Cre;Bmp2 flox/flox embryos. This is complete lineage-specific loss, not a measurement
        in heterozygous patients.
  - target: Reduced Noncanonical p38 Signalling Output
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same mouse deletion reduces mandibular p38 phosphorylation; relevance to human heterozygous
      loss is inferred.
    evidence:

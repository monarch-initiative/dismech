name: BMP2-Related Short Stature-Facial Dysmorphism-Skeletal Anomalies Syndrome
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
synonyms:
- SSFSC1
- short stature, facial dysmorphism, and skeletal anomalies with or without cardiac anomalies 1
- BMP2 haploinsufficiency
- 20p12.3 microdeletion syndrome involving BMP2
description: >-
  A rare autosomal dominant developmental disorder caused by heterozygous loss-of-function BMP2 variants
  or deletions encompassing BMP2. Short stature, craniofacial differences, digital and axial skeletal
  abnormalities, and variable cardiac involvement form the core spectrum. Normal stature can occur. Conductive
  hearing impairment and speech delay are also reported. Human genetic findings and heterozygous mouse
  models support haploinsufficiency; an exact reduction in secreted ligand has not been measured across
  patient alleles. This entity is distinct from recessive SCUBE3-related SSFSC2 and from BMP2 regulatory-duplication-associated
  brachydactyly type A2.

    evidence_source: MODEL_ORGANISM
    snippet: "However, in the condensations that do form, subsequent chondrogenic differentiation proceeds normally even in the absence of BMP2 and BMP7 or BMP2 and BMP4."
    explanation: >-
      Chondrogenic differentiation continues in condensations that form in these limb-mesenchyme mutants,
      with a delay described in the full text. This does not refute BMP2-dependent chondrogenesis in other
      lineages, including Meckel cartilage.
  mechanism_confidence: PROVISIONAL
- name: Impaired Endochondral Bone Growth
  description: >-
    Disrupted endochondral ossification is a plausible contributor to the growth and digital phenotype,
    supported by combined Bmp2/Bmp4 limb-mutant experiments. Normal growth hormone testing in some patients
    does not localize the defect specifically to the growth plate. In the heterozygous Bmp2 mouse studied
    in 2017, total body length was reduced but femoral and tibial lengths were unchanged.

diagnosis:
- name: Chromosomal microarray
  description: >-
    Detects the 20p12.3 microdeletions that account for most reported cases.
    Deletion size should be reported, because it determines whether phenotypes
    beyond the BMP2 syndrome are expected.
  presence: PRESENT
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For larger deletions, validation and segregation were done using array comparative genomic hybridisation"
    explanation: >-
      Array CGH is the method used to confirm and size the deletions in this
      cohort.
- name: Exome or genome sequencing
  description: >-
    Identifies intragenic truncating, frameshift and splice-altering BMP2
    variants, which microarray cannot see.
  presence: PRESENT
  evidence:
  - reference: PMID:40285376
    reference_title: "Emergence of osteolysis as a new radiological feature in a case with a novel BMP2 gene variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a de novo heterozygous truncating variant (c.440C>G; p.Ser147*) in BMP2."
    explanation: >-
      A worked example of sequence-level diagnosis in a microarray-negative
      patient.
- name: Growth hormone axis evaluation
  description: >-
    Recommended in the workup of short stature here, because partial isolated
    growth hormone deficiency has been documented in one individual and
    responded to replacement. Whether it is part of the syndrome or coincidental
    is unresolved.
  presence: VARIABLE
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Until then, we suggest that evaluation of growth hormone levels should be included in the medical investigation."
    explanation: >-
      The recommendation, stated with the uncertainty that motivates it.
- name: Audiological surveillance and middle ear examination
  description: >-
    Regular assessment of hearing and of the middle ear, proposed as routine
    surveillance because effusion and conductive loss are common and treatable.
  presence: PRESENT
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on our observations, we recommend that evaluation of language development and regular controls of the middle ear are included in the surveillance of these individuals."
    explanation: >-
      The explicit surveillance recommendation from the largest recent cohort.
- name: Longitudinal skeletal radiography
  description: >-
    Repeat rather than single-timepoint skeletal survey, prompted by the report
    of phalangeal osteolysis emerging at age 10 in a patient whose earlier
    evaluation had not shown it.
  presence: VARIABLE
  evidence:
  - reference: PMID:40285376
    reference_title: "Emergence of osteolysis as a new radiological feature in a case with a novel BMP2 gene variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings highlight the necessity of longitudinal skeletal monitoring in BMP2-related conditions"
    explanation: >-
      The recommendation as stated by the reporting authors.
treatments:
- name: Myringotomy and Ventilation Tube Insertion
  description: >-
    Drainage of persistent middle ear effusion. In the 2025 cohort all four
    individuals with recurrent secretory otitis media required myringotomy, and
    all four had conductive hearing loss secondary to the effusion, so this
    addresses the reversible component of the hearing phenotype.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: myringotomy with ear tube placement
    term:
      id: NCIT:C70906
      label: Myringotomy with Ear Tube Placement
  target_mechanisms:
  - target: Eustachian Tube Dysfunction and Middle Ear Effusion
    description: >-
      Drains the effusion that is the proximate cause of the conductive loss.
    evidence:
    - reference: PMID:39970956
      reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The conductive hearing impairment detected in four individuals (4/5) in our cohort resulted from repeated secretory otitis media."
      explanation: >-
        Identifies the effusion as the cause of the hearing loss, which is what
        makes draining it the mechanistically targeted intervention.
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four individuals had recurrent secretory otitis media and needed to go through myringotomy, all of them also had secondary conductive hearing impairment because of secretory otitis media."
    explanation: >-
      Documents the intervention and the indication in this cohort.
- name: Adenoidectomy
  description: >-
    Performed for adenoid hypertrophy, which contributes to Eustachian tube
    obstruction in a nasopharynx already narrowed by midface hypoplasia.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: adenoidectomy
    term:
      id: NCIT:C51697
      label: Adenoidectomy
  target_mechanisms:
  - target: Eustachian Tube Dysfunction and Middle Ear Effusion
    evidence:
    - reference: PMID:39970956
      reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three of them also had adenoid hypertrophy and underwent adenoidectomy."
      explanation: >-
        Adenoid hypertrophy co-occurred with the effusions in three of the four

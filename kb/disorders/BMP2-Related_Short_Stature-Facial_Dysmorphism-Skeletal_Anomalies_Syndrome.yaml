animal_models:
- name: Heterozygous Bmp2 knockout mouse
  species: Mouse
  genotype: Bmp2 heterozygous null
  publication: PMID:29198724
  description: >-
    The direct genetic counterpart of the human disorder. Its value is that it
    tests the dose hypothesis rather than the gene's necessity: the homozygote
    is embryonic lethal and says nothing about haploinsufficiency.
  modeled_mechanisms:
  - target: BMP2 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Halved Bmp2 dose in the mouse reproduces the human short stature and
      skeletal anomalies.
    limitations: >-
      The report describes phenotypic similarity for growth and skeletal
      features; it does not claim the craniofacial gestalt or the cardiac
      anomalies are reproduced, so the model is not established as covering
      those arms.
    evidence:
    - reference: PMID:29198724
      reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, we observed similarity to the human phenotype of short stature and skeletal anomalies in a heterozygous Bmp2-knockout mouse model, suggesting that haploinsufficiency of BMP2 could be the primary phenotypic determinant in individuals with predicted truncating variants and deletions encompassing BMP2."
      explanation: >-
        Attests that this model is informative for the haploinsufficiency node,
        by the authors' own comparison with the human phenotype.
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, we observed similarity to the human phenotype of short stature and skeletal anomalies in a heterozygous Bmp2-knockout mouse model, suggesting that haploinsufficiency of BMP2 could be the primary phenotypic determinant in individuals with predicted truncating variants and deletions encompassing BMP2."
    explanation: >-
      The comparison that makes this the reference model for the disorder.
- name: Wnt1-Cre;Bmp2 flox/flox cranial neural crest conditional knockout mouse
  species: Mouse
  genotype: Wnt1-Cre;Bmp2 fl/fl
  publication: PMID:30413887
  description: >-
    Tissue-specific homozygous deletion of Bmp2 in cranial neural crest,
    generated explicitly to model the human Pierre Robin sequence caused by BMP2
    haploinsufficiency.
  modeled_mechanisms:
  - target: Impaired Cranial Neural Crest Osteogenic Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reduced proliferation and osteogenic differentiation of mandibular
      progenitors is measured directly in this model.
    limitations: >-
      Homozygous conditional loss in one lineage, not a heterozygous
      whole-organism halving, so it demonstrates the requirement rather than
      the sufficiency of a halved dose. The mutants die at birth, which is far
      more severe than the human disorder.
    evidence:
    - reference: PMID:30413887
      reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further studies revealed obvious reduction in cell proliferation and differentiation of osteogenic progenitors in the mandible of the mutants, attributing to the micrognathia phenotype."
      explanation: >-
        The measured progenitor defect is what makes this model informative for
        the cranial-neural-crest osteogenic node.
  - target: Craniofacial Skeletal Hypoplasia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Micrognathia, cleft palate, zygomatic and mandibular hypoplasia are all
      reproduced.
    limitations: >-
      Cleft palate is complete and obligate in the mutant, whereas in humans it
      is occasional. The severity gap reflects homozygous versus heterozygous
      loss.
    evidence:
    - reference: PMID:30413887
      reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lateral views of 3D reconstructions from microCT scans further confirmed severe craniofacial bone defects in mutant mice"
      explanation: >-
        Imaging confirmation of the craniofacial skeletal hypoplasia this link
        is cited for, rather than gross inspection alone.
  evidence:
  - reference: PMID:30413887
    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant mice exhibit severe PRS with a significantly reduced size of craniofacial bones, cleft palate, malformed tongue and micrognathia."
    explanation: >-
      The phenotype that makes this model informative for the craniofacial arm.
- name: AV myocardial Bmp2 conditional knockout mouse
  species: Mouse
  genotype: Bmp2 conditional null in atrioventricular myocardium
  publication: PMID:16314491
  description: >-
    Inactivation of Bmp2 in the atrioventricular myocardium, which is the source
    of the signal that induces endocardial transformation.
  modeled_mechanisms:
  - target: Failed Endocardial Cushion Mesenchymal Transition
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Loss of cushion EMT, of cardiac jelly, and of AV myocardial patterning.
    limitations: >-
      Complete tissue-restricted loss rather than a halved organism-wide dose,
      so it identifies the required signal without establishing that
      heterozygosity alone produces the human septal defects. It also
      reproduces no other arm of the syndrome.
    evidence:
    - reference: PMID:16314491
      reference_title: "Bmp2 is essential for cardiac cushion epithelial-mesenchymal transition and myocardial patterning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Bmp2 is required for myocardial expression of Has2, a crucial component of the cardiac jelly matrix."
      explanation: >-
        A specific molecular readout measured in this model, grounding the
        cushion-formation claim in more than gross morphology.
  evidence:
  - reference: PMID:16314491
    reference_title: "Bmp2 is essential for cardiac cushion epithelial-mesenchymal transition and myocardial patterning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we inactivated bone morphogenetic protein 2 (Bmp2) in the AV myocardium of mice. We show that Bmp2 has three functions in the AV canal: to enhance formation of the cardiac jelly, to induce endocardial EMT and to pattern the AV myocardium."
    explanation: >-
      The model and its three measured cardiac phenotypes.
- name: Limb-conditional Bmp2 knockout mouse
  species: Mouse
  genotype: Bmp2 conditional null restricted to the limb skeleton
  publication: PMID:17099713
  description: >-
    Removal of Bmp2 from the limb skeleton after it has formed, which separates
    a postnatal maintenance role from the developmental one.
  modeled_mechanisms:
  - target: Deficient Skeletal Repair and Bone Homeostasis
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Spontaneous non-healing fractures establish BMP2 as required to initiate
      bone repair.
    limitations: >-
      Homozygous limb-restricted loss, and the human phenotype it is invoked
      for - phalangeal osteolysis - has been reported in a single patient. The
      model shows that a repair requirement exists, not that a halved human dose
      breaches it.
    evidence:
    - reference: PMID:17099713
      reference_title: "BMP2 activity, although dispensable for bone formation, is required for the initiation of fracture healing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking the ability to produce BMP2 in their limb bones have spontaneous fractures that do not resolve with time."
      explanation: >-
        The observed skeletal-maintenance failure this link is cited for.
  evidence:
  - reference: PMID:17099713
    reference_title: "BMP2 activity, although dispensable for bone formation, is required for the initiation of fracture healing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate that BMP2 is a necessary component of the signaling cascade that governs fracture repair."
    explanation: >-
      The finding this model contributes, distinct from the developmental
      phenotypes of the other models here.
- name: Zebrafish bmp2b ventralization assay for patient missense alleles
  species: Zebrafish
  genotype: patient-derived BMP2 missense alleles assayed against bmp2b function
  publication: PMID:37125634
  description: >-
    Not a disease model but a variant-function assay: each patient missense
    allele is tested for its ability to support bmp2b-driven embryonic
    dorsoventral patterning. Its purpose is allele interpretation, which is why
    it is linked to the haploinsufficiency node rather than to any phenotype.
  modeled_mechanisms:
  - target: BMP2 Haploinsufficiency
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reads out whether a given missense allele retains BMP2 function, and so
      whether it belongs in the same loss-of-function class as the truncating
      alleles.
    limitations: >-
      The readout is embryonic ventralization in a fish, which is not a
      craniofacial, skeletal or cardiac phenotype and shares no tissue context
      with the human disease. It measures whether the protein works at all, not
      how a halved dose behaves in the affected human tissues.
    evidence:
    - reference: PMID:37125634
      reference_title: "Monoallelic loss-of-function BMP2 variants result in BMP2-related skeletal dysplasia spectrum."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Missense variants modeled in zebrafish resulted in loss of protein function."
      explanation: >-
        The assay result that places patient missense alleles in the
        loss-of-function class.
  evidence:
  - reference: PMID:37125634
    reference_title: "Monoallelic loss-of-function BMP2 variants result in BMP2-related skeletal dysplasia spectrum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Patient-derived missense variants were modeled in zebrafish to examine their effect on the ability of bmp2b to promote embryonic ventralization."
    explanation: >-
      States what the assay is and what it reads out.
differential_diagnoses:
- name: SCUBE3-Related Short Stature Syndrome
  disease_term:
    preferred_term: short stature, facial dysmorphism, and skeletal anomalies with or without cardiac anomalies 2
    term:
      id: MONDO:0030953
      label: short stature, facial dysmorphism, and skeletal anomalies with or without cardiac anomalies 2
  description: >-
    SSFSC2, the type-2 entity whose MONDO label differs from this one only in a
    trailing digit. It is autosomal recessive, caused by biallelic SCUBE3
    variants, and prominently features dental anomalies. SCUBE3 is itself a
    BMP2/BMP4 co-receptor, so the two disorders converge on reduced BMP
    signalling from opposite ends of the same axis, which is why the clinical
    overlap is real rather than nominal.
  distinguishing_features:
  - Autosomal recessive rather than autosomal dominant inheritance
  - OMIM 619184 rather than OMIM 617877
  - SCUBE3 on 6p21.31 rather than BMP2 on 20p12.3
  - >-
    Prominent dental anomalies, and no cardiac phenotype reported in any SCUBE3
    patient despite the shared disease-name clause
  evidence:
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen affected individuals from nine unrelated families showed a consistent phenotype characterized by reduced growth, skeletal features, distinctive craniofacial appearance, and dental anomalies."
    explanation: >-
      The SSFSC2 phenotype as reported, showing why it is a genuine differential
      rather than a naming artefact, and where the dental emphasis differs.
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that SCUBE3 acts as a BMP2/BMP4 co-receptor, recruits the BMP receptor complexes into raft microdomains, and positively modulates signaling possibly by augmenting the specific interactions between BMPs and BMP type I receptors."
    explanation: >-
      Explains the overlap mechanistically: the two disorders reduce the same
      BMP signal from opposite ends of one ligand-co-receptor axis.
- name: Brachydactyly type A2
  disease_term:
    preferred_term: brachydactyly type A2
    term:
      id: MONDO:0007216
      label: brachydactyly type A2
  description: >-
    The reason gene-level literature searches on BMP2 return material that does
    not apply here. BDA2 is most often caused by variants in BMPR1B or GDF5,
    and only a minority of families carry the BMP2-linked lesion: duplication
    of a conserved limb enhancer roughly 110 kb downstream of BMP2, which
    increases local BMP2 expression in the limb. Either way it is confined to
    hypoplastic middle phalanges of the second and fifth digits, without short
    stature, facial dysmorphism or cardiac disease.
  distinguishing_features:
  - >-
    Where BMP2-linked at all, a non-coding regulatory duplication increasing
    limb BMP2 expression, rather than a coding loss-of-function variant or
    whole-gene deletion; more often a BMPR1B or GDF5 variant and so not a BMP2
    disorder in the first place
  - >-
    An isolated digital malformation of the second and fifth middle phalanges,
    without short stature, facial dysmorphism or cardiac disease
  evidence:
  - reference: PMID:19327734
    reference_title: "Duplications involving a conserved regulatory element downstream of BMP2 are associated with brachydactyly type A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results reveal an additional functional mechanism for the pathogenesis of BDA2, which is duplication of a regulatory element that affects the expression of BMP2 in the developing limb."
    explanation: >-
      Establishes the mechanism as gain of local expression, which is the
      opposite direction to the haploinsufficiency curated here.
- name: Larger 20p12 contiguous gene deletion syndromes
  description: >-
    Deletions extending beyond BMP2 add the phenotypes of the genes they also
    remove, and those phenotypes have repeatedly been misattributed to BMP2.
    Deletions reaching JAG1 produce Alagille syndrome; deletions including
    PROKR2 have been reported with congenital hypopituitarism and growth hormone
    deficiency.

    Wolff-Parkinson-White syndrome does not belong on that list any more, and
    the correction is worth stating because the older literature invites the
    error in both directions. WPW was first described for the wider 20p13p12
    interval, which made it look like a neighbouring-gene effect. It has since
    been reported in a patient carrying an intragenic BMP2 nonsense variant with
    no deletion at all, so it is curated here as a rare cardiac phenotype of
    this disorder rather than excluded.
  distinguishing_features:
  - Deletion breakpoints and size on chromosomal microarray
  - >-
    A phenotype seen only in patients with large deletions, and never in
    patients with an intragenic BMP2 variant, is evidence against attributing it
    to BMP2 dose
  evidence:
  - reference: PMID:21671386
    reference_title: "Microdeletion 20p12.3 involving BMP2 contributes to syndromic forms of cleft palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microdeletion 20p13p12 involving BMP2 is rare and has been implicated in Wolff-Parkinson-White (WPW) syndrome with neurocognitive deficits and with Alagille syndrome when the deletion includes the neighboring JAG1 gene in addition to BMP2."
    explanation: >-
      Names the contiguous-gene phenotypes and ties Alagille syndrome
      specifically to JAG1 inclusion rather than to BMP2.
  - reference: PMID:28586151
    reference_title: "A heterozygous microdeletion of 20p12.2-3 encompassing PROKR2 and BMP2 in a patient with congenital hypopituitarism and growth hormone deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion contained 17 protein coding genes including PROKR2 and BMP2, both of which are expressed during embryological development of the pituitary gland."
    explanation: >-
      A 4.8 Mb deletion in which 17 genes are removed. Cited as the reason
      hypopituitarism in a deletion patient cannot be attributed to BMP2 dose
      alone.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Life expectancy is not reported to be reduced and intelligence is normal.
    The burden is chronic and largely surgical and rehabilitative: short stature,
    repeated middle ear procedures with hearing loss during the years of
    language acquisition, orthodontic and craniofacial management, and
    cardiological surveillance in those with structural disease. Palatal
    clefting, where present, adds feeding and airway management in infancy.
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "display a consistent distinct phenotype characterized by short stature and skeletal and cardiac anomalies without neurological deficits"
    explanation: >-
      The absence of neurological deficits is what keeps this below a severe
      burden rating despite the multi-system malformation load.
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Delayed speech, secretory otitis media and conductive hearing loss are common features that require medical attention."
    explanation: >-
      Establishes an ongoing, non-trivial care requirement, which is the other
      half of a moderate rather than mild rating.
discussions:
- discussion_id: bmp2_developmental_delay_extent
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does isolated BMP2 haploinsufficiency cause global developmental delay, or
    only isolated speech delay with the global delay attributable to
    co-deleted genes in larger 20p12 deletions?
  status: OPEN
  attaches_to:
  - phenotypes#Delayed speech and language development
  - pathophysiology#BMP2 Haploinsufficiency
  rationale: >-
    The two largest series disagree in their conclusions. Tan et al. describe
    the phenotype as occurring "without neurological deficits"; Priestley et al.
    reported global delay in four of fourteen, three of whom carried additional
    genetic variants that confound the reading. The 2025 cohort resolves it in
    favour of no global delay for isolated lesions but reports one exception,
    and its own proposed explanation for that exception - a 3.7 Mb deletion
    whose identically deleted brother was unaffected - is an argument from a
    single sibling pair. That argument does replicate, though, in a second
    family: a father and child carrying the same 2.3 Mb deletion differ, the
    child having global developmental delay and failure to thrive and the
    father neither. Two independent within-family discordances for an identical
    deletion are a real signal that the delay tracks something other than the
    deletion itself. The question is answerable with a cohort restricted to
    intragenic variants and BMP2-only deletions, formally assessed.
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of developmental delay is still controversial."
    explanation: >-
      The controversy stated by the authors of the most recent cohort.
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that global developmental delay is either a rare part or not part of the phenotype."
    explanation: >-
      The current best answer, offered as a proposal rather than a settled
      finding.
  - reference: PMID:22965927
    reference_title: "Cleft palate in a multigenerational family with a microdeletion of 20p12.3 involving BMP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The father was otherwise healthy with no history of FTT or DD, suggesting high penetrance, yet variable expressivity for haploinsufficiency of BMP2."
    explanation: >-
      The second within-family discordance: the same 2.3 Mb deletion, global
      developmental delay in the child and none in the father. Evidence that
      the delay tracks something other than the deletion.
- discussion_id: bmp2_cardiac_laterality
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does BMP2 contribute to determination of the cardiac axis in humans, beyond
    its established role in septal and valvuloseptal morphogenesis?
  status: OPEN
  attaches_to:
  - pathophysiology#Failed Endocardial Cushion Mesenchymal Transition
  - phenotypes#Congenital heart disease
  rationale: >-
    One family with a BMP2 frameshift variant included a proband with isolated
    dextrocardia and situs solitus, with no other viscus displaced and no
    structural cardiac defect. Laterality is a distinct developmental question
    from cushion transformation, and a single proband cannot separate a real
    BMP2 laterality role from coincidence. The reporting authors say so
    themselves. It is recorded here so that dextrocardia is not silently folded
    into the cardiac-anomaly phenotype, where it would imply a mechanism the
    evidence does not support.
  evidence:
  - reference: PMID:37572998
    reference_title: "BMP2 is a potential causative gene for isolated dextrocardia situs solitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to short stature, impaired hearing ability and minor skeletal deformities, the proband exhibited isolated dextrocardia situs solitus without cardiac anomalies and abnormal locations of other visceral organs."
    explanation: >-
      The single observation the question rests on, including that it occurred
      without any structural cardiac defect.
  - reference: PMID:37572998
    reference_title: "BMP2 is a potential causative gene for isolated dextrocardia situs solitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "further studies are needed to assemble more cases to elucidate BMP2 role in human heart development"
    explanation: >-
      The authors' own statement that the laterality claim is not established.
notes: >-
  No GeneReviews chapter exists for BMP2 or for SSFSC1; PubMed searches for
  "BMP2 GeneReviews" and for the disease name with GeneReviews returned no
  matching article. The mandatory GeneReviews phenotype baseline is therefore
  not available for this entry, and the phenotype set is anchored on the
  defining series (PMID:29198724) and the largest recent cohort (PMID:39970956)
  instead.

  On frequency bands: the numeric denominators available are small (7 and 12
  individuals), so frequencies here are the observed cohort proportions and
  should be read as provisional. Where the literature reports a feature without
  a denominator, frequency has been left at the band the cohort supports rather
  than inferred upward.

  On datasets: none are curated, and the absence is a finding rather than an
  omission. `just discover-datasets` returns 12 candidates and classifies all 12
  as GENE_ONLY, with zero DIRECT matches; the top-scoring hit is a glioma cell
  line treated with recombinant BMP2. That is the failure mode the dataset
  guidance warns about - searching a causal gene surfaces whatever the gene is
  famous for, and BMP2 is famous as an osteoinductive reagent rather than as
  this syndrome's gene. No omics dataset of BMP2-haploinsufficient patient
  material appears to exist, which is unsurprising for a disorder with fewer
  than 40 reported individuals.

  On the deep-research report accompanying this entry
  (research/BMP2-Related_Short_Stature-Facial_Dysmorphism-Skeletal_Anomalies_Syndrome-deep-research-openscientist.md):
  falcon was the requested provider and its key returned 403, so the run was
  re-issued with --fallback and openscientist produced the report; the
  frontmatter records that rather than the report claiming to be a falcon run.
  Its 20 citations all resolve with no confabulations. Two quotes are flagged as
  not found in source; both are the report's own ellipsis-shortened renderings
  of sentences that are present verbatim, not fabrications, and one of them
  matches an evidence snippet used here word for word.

  The report earned its place by catching a real gap rather than by confirming
  what was already written. Three of its citations were adopted after reading
  them, and two of those changed the entry's claims: PMID:37125634, an
  international 18-patient cohort that establishes missense alleles as a third
  disease-causing class and adds neural tube defects, brain anomalies and
  endocrinopathies to the spectrum, and PMID:33247540, which supplies the only
  BMP2-only-lesion evidence for scoliosis and for Wolff-Parkinson-White and
  reports bicuspid aortic valve with aortopathy. PMID:10362015 was taken for the
  cushion mechanism. Citations about other genes and other disorders (BMPER,
  BMPR1B, Dubowitz, Robinow) were not used; they are Named Entity Confusion
  risks rather than errors in the report.

  None of the report's ontology suggestions were adopted. Term validation found
  1 of 4 checked labels matching, and among the mismatches it offered
  NCIT:C15192 as "Speech Therapy" when that code is Blood Transfusion. An
  earlier run of the same provider offered UBERON:0006618 for "growth plate",
  which is the atrium auricular region.

  On five phenotypes left unconnected to the pathograph - hypotonia in infancy,
  toenail dysplasia, neural tube defect, structural brain anomaly and
  endocrinopathy: no cited source proposes a mechanism linking any of them to
  the BMP2 chain, and inventing an edge to tidy the graph would assert causation
  that nothing supports. The last three arrive from the 18-patient cohort as a
  bare spectrum expansion, listed in one sentence with no denominator and no
  mechanism, which is also why they carry the lowest frequency band the schema
  offers rather than one inferred from cohort size. They are curated as observed
  features without an upstream node.

  Neural tube and brain findings are the ones to watch here. BMP signalling has
  a real role in neural tube closure, so a mechanism is plausible, and that is
  exactly the reason not to draw the edge from plausibility alone.

  On scoliosis: it is curated, but only on the strength of one specific
  observation, and the route there is worth recording because an earlier draft
  of this entry got it wrong twice. Scoliosis was first curated with no source
  at all, then removed on review after a check showed the word appeared exactly
  once across the cached references, inside a sentence about JAG1 deletions and
  Alagille syndrome. Removing it was right on that evidence. It is back because
  a later reference supplies what was missing: progressive thoracic scoliosis
  requiring surgery at 13, in a patient whose BMP2 lesion is an intragenic de
  novo nonsense variant with no deletion, so no neighbouring gene is available
  to explain it.

  On frequency bands for the facial gestalt: midface hypoplasia, long philtrum
  and dental crowding carry bands because the cohort states counts for them.
  Micrognathia, downslanted palpebral fissures, hypertelorism, broad forehead
  and the ear findings deliberately carry none. The only cached source for
  those is a three-patient photographic figure legend, which supports a
  denominator somewhere between 1/7 and 3/7 without fixing it; the real counts
  are in a table the reference cache does not carry.

  On what has deliberately not been curated as a BMP2 phenotype: congenital
  hypopituitarism and Alagille syndrome appear in the 20p12 deletion literature
  and are attributable to co-deleted genes, PROKR2 and JAG1 respectively,
  rather than to BMP2 dose. They are recorded under differential diagnoses.
  Wolff-Parkinson-White was on that list and has been moved off it: it is now
  reported in a patient with an intragenic BMP2 nonsense variant and no
  deletion, so the neighbouring-gene explanation no longer covers it. Growth hormone deficiency is a separate case and is curated as an
  open question rather than either a phenotype or an exclusion: it has been seen
  in one individual with an isolated BMP2 lesion, and the reporting authors
  explicitly leave open whether it belongs to the syndrome.

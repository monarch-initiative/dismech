  - target: Reduced Osteogenic Output of Skeletal Progenitors
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      BMP2 and BMP4 jointly support osteoblast maturation in limb mesenchyme. The combined-knockout experiments
      establish a pathway requirement, not the magnitude of a human heterozygous BMP2 defect.
  - target: Failed Endocardial Cushion Mesenchymal Transition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Myocardial Bmp2 is necessary for cushion induction in conditional-null mice. An equivalent defect
      has not been demonstrated in human BMP2 heterozygotes.
  - target: Deficient Skeletal Repair and Bone Homeostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Complete limb-conditional Bmp2 loss impairs fracture repair. A repair defect from a single defective
      human allele remains unproven.
  - target: Reduced Cranial Neural Crest Chondrogenic Progenitors
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Complete neural crest Bmp2 deletion reduces Meckel cartilage progenitor proliferation and Sox9 expression;
      the human dosage threshold is unknown.
  - target: Wolff-Parkinson-White syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pre-excitation has been reported with intragenic BMP2 loss and deletions. The conduction-system
      mechanism is unresolved and is not established by cardiac cushion experiments.
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, we observed similarity to the human phenotype of short stature and skeletal anomalies in a heterozygous Bmp2-knockout mouse model, suggesting that haploinsufficiency of BMP2 could be the primary phenotypic determinant in individuals with predicted truncating variants and deletions encompassing BMP2."
    explanation: >-
      The heterozygous knockout phenotype supports haploinsufficiency; it does not by itself exclude additional
      effects of individual human alleles.
  - reference: PMID:19116164
    reference_title: "Genetic interaction between Bmp2 and Bmp4 reveals shared functions during multiple aspects of mouse organogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Whereas mice lacking a single copy of Bmp2 or Bmp4 are viable and have subtle developmental defects, compound mutants show embryonic and postnatal lethality due to defects in multiple organ systems including the allantois, placental vasculature, ventral body wall, skeleton, eye and heart."
    explanation: >-
      Bmp2/Bmp4 interactions demonstrate dose sensitivity in mice. Single Bmp2 heterozygotes have skeletal
      defects, but survival and severity depend on background; the full text reports hydrocephalus and
      loss of some heterozygotes on C57BL/6J. These models do not establish human viability or severity
      thresholds.

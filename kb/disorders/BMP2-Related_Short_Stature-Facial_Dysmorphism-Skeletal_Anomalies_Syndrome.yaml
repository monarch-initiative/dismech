    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate the important role of BMP2 in human craniofacial, skeletal, and cardiac development and confirm that individuals heterozygous for BMP2 truncating sequence variants or deletions display a consistent distinct phenotype characterized by short stature and skeletal and cardiac anomalies without neurological deficits."
    explanation: >-

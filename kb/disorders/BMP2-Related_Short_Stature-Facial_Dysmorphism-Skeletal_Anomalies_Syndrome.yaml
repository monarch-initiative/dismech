  mechanism_confidence: HYPOTHETICAL
- name: Deficient Skeletal Repair and Bone Homeostasis
  description: >-
    Limb-conditional Bmp2-null mice develop spontaneous fractures that fail to heal, demonstrating a requirement
    for BMP2 in fracture repair. This provides a candidate mechanism for skeletal maintenance abnormalities,
    but neither a repair defect in human heterozygotes nor a causal connection to the single reported
    phalangeal osteolysis case has been established.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: bone remodeling
    modifier: ABNORMAL
    term:
      id: GO:0046849
      label: bone remodeling
  downstream:
  - target: Phalangeal osteolysis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Provisional cross-species hypothesis: non-healing fractures after complete mouse limb Bmp2 loss
      and osteolysis in one heterozygous patient are distinct observations, without a demonstrated causal
      bridge.
  evidence:
  - reference: PMID:17099713
    reference_title: "BMP2 activity, although dispensable for bone formation, is required for the initiation of fracture healing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice lacking the ability to produce BMP2 in their limb bones have spontaneous fractures that do not resolve with time."
    explanation: >-
      Separates a postnatal bone-maintenance requirement for BMP2 from its
      developmental one. Note this is the homozygous limb-conditional null, not
      the heterozygote, so it establishes that the requirement exists rather
      than that a halved dose is enough to breach it.
  notes: >-
    The fracture-repair experiment uses complete limb-restricted loss. Human phalangeal osteolysis has
    been reported in one case and does not establish a general fracture-healing phenotype.
  mechanism_confidence: HYPOTHETICAL
- name: Failed Endocardial Cushion Mesenchymal Transition
  description: >-
    Myocardial Bmp2 is required for atrioventricular cardiac jelly formation, induction of endocardial
    epithelial-to-mesenchymal transition and AV myocardial patterning in conditional-null mice. This identifies
    one developmental pathway relevant to congenital cardiac malformations, without establishing that
    human heterozygosity causes cushion failure or explaining every reported cardiac feature.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition involved in endocardial cushion formation
    modifier: DECREASED
    term:
      id: GO:0003198
      label: epithelial to mesenchymal transition involved in endocardial cushion formation
  downstream:
  - target: Altered Cardiac Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Failure of cushion induction can disrupt AV septation and valves. The experiments do not explain
      human semilunar valve anomalies, aortopathy or electrical conduction abnormalities.
  evidence:
  - reference: PMID:16314491
    reference_title: "Bmp2 is essential for cardiac cushion epithelial-mesenchymal transition and myocardial patterning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that Bmp2 has three functions in the AV canal: to enhance formation of the cardiac jelly, to induce endocardial EMT and to pattern the AV myocardium."
    explanation: >-
      Assigns cushion induction to Bmp2 specifically, in the myocardial
      compartment that signals to the endocardium. Homozygous conditional
      inactivation, so it shows the signal is required rather than that halving
      it produces the human septal defects.
  - reference: PMID:10362015
    reference_title: "Bone morphogenetic protein-2 acts synergistically with transforming growth factor-beta3 during endothelial-mesenchymal transformation in the developing chick heart."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Antisense oligodeoxynucleotides to BMP2 inhibited mesenchyme formation in AV endocardium cocultured with associated myocardium. This inhibitory effect was reversed by the addition of recombinant BMP2."
    explanation: >-
      A loss-and-rescue experiment in explant culture, which is the cleanest
      demonstration that the BMP2 signal itself is what drives cushion
      mesenchyme formation. Independent of the mouse genetics and of a
      transgenic background.
  - reference: PMID:10362015
    reference_title: "Bone morphogenetic protein-2 acts synergistically with transforming growth factor-beta3 during endothelial-mesenchymal transformation in the developing chick heart."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "However, BMP2 enhanced the TGFbeta-induced initial phenotypic changes associated with endothelial-mesenchymal transformation."
    explanation: >-
      In cultured chick AV endothelial cells, BMP2 enhanced TGF-beta-induced changes but was insufficient
      alone. This co-signal requirement does not establish the reason for incomplete human penetrance.
  mechanism_confidence: PROVISIONAL
- name: Altered Cardiac Development
  description: >-
    Human BMP2 variants and deletions are associated with a variable cardiac spectrum including septal,
    outflow and valve abnormalities. Bicuspid aortic valve with progressive aortic dilatation has been
    described with an intragenic truncating variant. Mouse myocardial conditional and Bmp2/Bmp4 compound
    mutants demonstrate developmental requirements, but the pathways underlying individual human lesion
    classes remain unresolved.
  biological_scale: TISSUE
  downstream:

name: BMP2-Related Short Stature-Facial Dysmorphism-Skeletal Anomalies Syndrome
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
synonyms:
- SSFSC1
- short stature, facial dysmorphism, and skeletal anomalies with or without cardiac anomalies 1
- BMP2 haploinsufficiency
- 20p12.3 microdeletion syndrome involving BMP2
description: >-
  A rare autosomal dominant disorder caused by heterozygous loss-of-function
  variants in BMP2, or by microdeletions of 20p12.3 that encompass it, in which
  the dose of secreted bone morphogenetic protein 2 is halved. Affected
  individuals share short stature, a recognisable craniofacial gestalt (midface
  hypoplasia, long philtrum, dental crowding, micrognathia), skeletal anomalies,
  and variable congenital heart disease. Because BMP2 is the ligand that
  initiates canonical BMP-SMAD signalling in several developmental fields at
  once, one halved gene dose produces a multi-system malformation bundle rather
  than an isolated defect: cranial neural crest osteogenesis, limb chondrogenic
  condensation and osteogenesis, and endocardial cushion transformation each
  draw on the same ligand.

  Two naming hazards are worth recording before citing anything here. First,
  MONDO:0100297 (SSFSC1, OMIM 617877) and MONDO:0030953 (SSFSC2, OMIM 619184)
  carry near-identical labels differing only in a trailing digit; SSFSC2 is a
  recessive SCUBE3 disorder curated separately as SCUBE3-Related Short Stature
  Syndrome, and the OMIM number is what tells the two apart. Second, BMP2 causes
  a second, mechanistically opposite entity: brachydactyly type A2 (OMIM 112600)
  arises from duplication of a limb enhancer *downstream* of BMP2, so it is a
  gain of local expression rather than haploinsufficiency, and its literature
  must not be read as evidence for this disorder.

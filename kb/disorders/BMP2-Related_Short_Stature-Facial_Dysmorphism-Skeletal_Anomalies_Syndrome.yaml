- name: Failure of Tongue Descent and Palatal Shelf Elevation
  description: >-
    In the neural crest Bmp2 conditional-null mouse, a small mandible prevents tongue descent and mechanically
    obstructs palatal shelf elevation. Removing the mandible and tongue permits elevation in embryonic
    head culture, and isolated shelves fuse in organ culture. Tongue volume, myogenic differentiation
    and palatal proliferation were preserved. Palatal BMP signaling was largely maintained, although posterior
    nasal-side pSmad1/5/8 was reduced; compensation by BMP4/BMP7 was proposed. The rescue supports a mechanical
    contribution without proving that all human BMP2-associated clefts follow this route.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: roof of mouth development
    modifier: ABNORMAL
    term:
      id: GO:0060021
      label: roof of mouth development
  downstream:

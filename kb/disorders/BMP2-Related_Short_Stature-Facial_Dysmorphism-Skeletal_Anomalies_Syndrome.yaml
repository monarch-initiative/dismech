animal_models:
- name: Heterozygous Bmp2 knockout mouse
  species: Mouse
  genotype: Bmp2 heterozygous null
  publication: PMID:29198724
  description: >-
    A heterozygous Bmp2-null model supports dosage sensitivity through growth and rib abnormalities. The
    2017 study measured the skeleton directly; additional axial and survival findings in the 2009 study
    depend on its genetic background.
  modeled_mechanisms:
  - target: BMP2 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Loss of one Bmp2 allele reproduces reduced body length and rib abnormalities. Patient ligand concentrations
      were not measured.
    limitations: >-
      The report describes phenotypic similarity for growth and skeletal
      features; it does not claim the craniofacial gestalt or the cardiac
      anomalies are reproduced, so the model is not established as covering
      those arms.
    readouts:
    - name: Axial skeletal defects in Bmp2 heterozygous adults
      target: BMP2 Haploinsufficiency
      direction: INCREASED
      interpretation: >-
        The 2009 study found defects in dorsal fusion of cervical vertebrae in 3/9 and defects of the
        13th rib in 7/9 Bmp2 heterozygotes. The cervical finding is failure of dorsal fusion, not excessive
        fusion between vertebrae. These are cohort-specific mouse observations.
      evidence:
      - reference: PMID:19116164
        reference_title: "Genetic interaction between Bmp2 and Bmp4 reveals shared functions during multiple aspects of mouse organogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Notably, we detected identical defects in dorsal fusion of one or more cervical vertebrae (Fig. 1A and B) as well as defects in formation of the 13th rib (Fig. 1C and D) in 33% and 77%, respectively, of all Bmp2−/+ skeletons analyzed (n = 9)."
        explanation: >-
          The measurement itself, in Bmp2 heterozygotes rather than the
          Bmp4 animals named earlier in the same passage as prior art.
    - name: Reduced body length with preserved femur and tibia lengths
      target: BMP2 Haploinsufficiency
      direction: DECREASED
      interpretation: >-
        The 2017 heterozygote comparison found reduced total body length without shorter femora or tibiae.
        It supports the growth phenotype without demonstrating generalized long-bone growth-plate failure.
      evidence:
      - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5812889/
        reference_title: Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions - PMC
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We observed that the body of heterozygous ... mice was significantly shorter than that of wild-type mice, consistent with short stature in human individuals, but the two groups of mice showed no differences in femur or tibia length
        explanation: >-
          Direct morphometry distinguishes total body length from long-bone length.
    - name: Preserved femoral mechanical properties
      target: BMP2 Haploinsufficiency
      direction: UNCHANGED
      interpretation: >-
        Despite reduced bone mineral content and volume, three-point bending did not detect impaired femoral
        mechanics in the 2017 heterozygotes. This limits inference of universal fragility from complete
        conditional-null mice.
      evidence:
      - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5812889/
        reference_title: Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions - PMC
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We did not observe any significant differences in maximum load, yield load, work to failure, or stiffness between the two groups
        explanation: >-
          Negative mechanical testing result in Bmp2 heterozygotes compared with wild-type littermates.
    evidence:
    - reference: PMID:29198724
      reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Additionally, we observed similarity to the human phenotype of short stature and skeletal anomalies in a heterozygous Bmp2-knockout mouse model, suggesting that haploinsufficiency of BMP2 could be the primary phenotypic determinant in individuals with predicted truncating variants and deletions encompassing BMP2."
      explanation: >-
        Attests that this model is informative for the haploinsufficiency node,
        by the authors' own comparison with the human phenotype.
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, we observed similarity to the human phenotype of short stature and skeletal anomalies in a heterozygous Bmp2-knockout mouse model, suggesting that haploinsufficiency of BMP2 could be the primary phenotypic determinant in individuals with predicted truncating variants and deletions encompassing BMP2."
    explanation: >-
      The comparison that makes this the reference model for the disorder.

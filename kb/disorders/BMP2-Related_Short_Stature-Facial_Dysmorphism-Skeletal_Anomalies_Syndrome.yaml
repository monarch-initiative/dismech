    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Failed osteoblast maturation interrupts endochondral bone formation in combined Bmp2/Bmp4 limb mutants.
      Its contribution to human BMP2 haploinsufficiency is inferred.
  evidence:
  - reference: PMID:17194222
    reference_title: "Genetic analysis of the roles of BMP2, BMP4, and BMP7 in limb patterning and skeletogenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, we find that the loss of both BMP2 and BMP4 results in a severe impairment of osteogenesis."
    explanation: >-
      Combined Bmp2/Bmp4 loss impairs completion of osteoblast differentiation; Bmp2 loss alone did not
      produce this severe limb phenotype.
  - reference: PMID:17194222
    reference_title: "Genetic analysis of the roles of BMP2, BMP4, and BMP7 in limb patterning and skeletogenesis."

- category: Cardiovascular
  name: Congenital heart disease
  phenotype_term:
    preferred_term: Congenital heart disease
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  description: >-
    Structural cardiac anomalies, principally septal. Penetrance is clearly
    incomplete: several well-characterised patients have entirely normal
    echocardiography, which is what the "with or without cardiac anomalies"
    clause of the disease name records. No frequency band is given because no
    cited source supplies a denominator; the defining series reports congenital
    heart disease as a shared group-level feature of its 12 patients without
    stating how many had it.

    On arrhythmia: the 2025 review lists arrhythmias in the BMP2
    haploinsufficiency spectrum, but the principal arrhythmia reported for this
    locus is Wolff-Parkinson-White, which this entry attributes to the wider
    20p13p12 deletion interval rather than to BMP2 dose (see differential
    diagnoses). No arrhythmia is therefore curated as a BMP2 phenotype here.
    Resolving this needs a rhythm phenotype reported in a patient with an
    intragenic BMP2 variant or a BMP2-only deletion, which no cited source
    supplies.
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency of BMP2 is associated with short stature, skeletal malformations, hearing impairment, cleft palate and cardiac abnormalities including structural abnormalities and arrhythmias"
    explanation: >-
      Names both structural defects and arrhythmia as part of the cardiac
      spectrum.
  - reference: PMID:40285376
    reference_title: "Emergence of osteolysis as a new radiological feature in a case with a novel BMP2 gene variant."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional clinical evaluations, including echocardiography and metabolic studies, were unremarkable."
    explanation: >-
      Refutes the claim that cardiac involvement is a constant feature: this
      patient has a confirmed de novo truncating BMP2 variant and entirely
      normal echocardiography. It is the direct evidence for incomplete cardiac
      penetrance.

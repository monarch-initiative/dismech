prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Roughly 50 to 60 individuals with an isolated BMP2 sequence variant or a
    small BMP2-containing deletion have been reported: 12 in the defining
    series, an international cohort of 18, seven in the 2025 cohort, and
    scattered single cases. No population rate has been published.
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the literature most individuals (28/29) with BMP2 sequence variants or deletions encompassing only BMP2, and no other genetic variant conflicting interpretation, have no or mild developmental delay"
    explanation: >-
      A literature tally of 29 individuals with an isolated BMP2 lesion as of
      the 2025 review, to which that report's own seven are additional.
  - reference: PMID:37125634
    reference_title: "Monoallelic loss-of-function BMP2 variants result in BMP2-related skeletal dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used retrospective chart review to examine phenotypes from an international cohort of 18 individuals and compared these with published cases."
    explanation: >-
      The largest single cohort, and the reason the count is now in the fifties
      rather than under forty.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous truncating, frameshift and splice-altering BMP2 variants, or
    heterozygous deletions encompassing BMP2, arising de novo or transmitted
    from an affected parent. Germline mosaicism has been documented.
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo occurrence and autosomal-dominant inheritance of variants, including paternal mosaicism in two affected sisters who inherited a BMP2 splice-altering variant, were observed across all reported families."
    explanation: >-
      Establishes dominant transmission and documents paternal mosaicism, which
      matters for recurrence counselling in apparently de novo families.
genetic:
- name: BMP2
  gene_term:
    preferred_term: BMP2
    term:
      id: hgnc:1069
      label: BMP2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    BMP2 (20p12.3) encodes bone morphogenetic protein 2, a secreted homodimeric
    ligand of the TGF-beta superfamily. The disease alleles are of two kinds
    that converge on the same endpoint: intragenic truncating, frameshift and
    canonical splice-site variants, and heterozygous microdeletions spanning
    roughly 0.6 Mb to several Mb that remove the whole gene. Both predict
    haploinsufficiency, and the shared phenotype across those allele classes
    is the main argument that BMP2 dose, rather than any neighbouring gene, is
    the determinant.

    Missense variants are a third class and were added later. An international
    18-patient cohort found monoallelic missense alleles producing the same
    syndrome, and tested them functionally in zebrafish, where they failed to
    support bmp2b-driven embryonic ventralization. So a missense allele here is
    a loss-of-function allele rather than a separate mechanism, and a negative
    deletion screen does not exclude the diagnosis.

    Deletion size is the practical variable to record. A deletion confined to
    BMP2 gives this syndrome; a larger 20p12 deletion adds the phenotypes of
    whatever else it removes, and those must not be attributed to BMP2 (see
    notes on contiguous-gene effects).
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a cranioskeletal phenotype due to monoallelic truncating and frameshift BMP2 variants and deletions in 12 individuals from eight unrelated families that share features of short stature, a recognizable craniofacial gestalt, skeletal anomalies, and congenital heart disease."
    explanation: >-
      The defining series, establishing that truncating variants and deletions
      produce one shared phenotype.
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One individual had a novel frameshift variant in BMP2, and six individuals had 1.3-3.7 Mb microdeletions, including BMP2."
    explanation: >-
      Documents the two allele classes side by side in one cohort and gives the
      deletion size range.
  - reference: PMID:40285376
    reference_title: "Emergence of osteolysis as a new radiological feature in a case with a novel BMP2 gene variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a de novo heterozygous truncating variant (c.440C>G; p.Ser147*) in BMP2."
    explanation: >-
      A representative de novo nonsense allele, on the reference transcript used
      across the literature.
  - reference: PMID:37125634
    reference_title: "Monoallelic loss-of-function BMP2 variants result in BMP2-related skeletal dysplasia spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sought to expand the phenotypic spectrum and highlight phenotypes of patients harboring monoallelic missense variants in BMP2."
    explanation: >-
      Establishes monoallelic missense variants as a disease-causing allele
      class in their own right, which the earlier truncating-and-deletion
      series did not cover. The functional evidence that these are
      loss-of-function alleles is a separate, zebrafish-based claim and is
      graded separately below.
  - reference: PMID:37125634
    reference_title: "Monoallelic loss-of-function BMP2 variants result in BMP2-related skeletal dysplasia spectrum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Missense variants modeled in zebrafish resulted in loss of protein function."
    explanation: >-
      The functional result that puts missense alleles in the same
      loss-of-function mechanism as the truncating ones rather than in a
      separate one.
pathophysiology:
- name: BMP2 Haploinsufficiency
  description: >-
    A heterozygous truncating variant or a whole-gene deletion halves the
    functional BMP2 gene dose, so the amount of secreted BMP2 ligand available
    to the tissues that depend on it falls below the level those tissues
    require. The mouse heterozygote reproduces the human growth and skeletal
    phenotype, which is what identifies dose rather than a dominant-negative
    protein as the lesion.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BMP2
    term:
      id: hgnc:1069
      label: BMP2
  molecular_functions:
  - preferred_term: BMP2 growth factor activity
    modifier: DECREASED
    term:
      id: GO:0008083
      label: growth factor activity
  downstream:
  - target: Reduced Canonical BMP-SMAD Signalling Output
    causal_link_type: DIRECT
    description: >-
      Less ligand reaching BMP type I and type II receptor complexes gives less
      receptor activation and so less downstream signal.
    evidence:
    - reference: PMID:21671386
      reference_title: "Microdeletion 20p12.3 involving BMP2 contributes to syndromic forms of cleft palate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Binding to and functioning via BMP receptors, BMPRI and BMPRII, they result in phosphorylation-dependent activation of the SMAD proteins and downstream signaling cascades."
      explanation: >-
        States the ligand-to-receptor-to-SMAD step that a halved ligand dose
        attenuates. Cited for the pathway architecture, not for a measurement of
        signalling in patients.
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Additionally, we observed similarity to the human phenotype of short stature and skeletal anomalies in a heterozygous Bmp2-knockout mouse model, suggesting that haploinsufficiency of BMP2 could be the primary phenotypic determinant in individuals with predicted truncating variants and deletions encompassing BMP2."
    explanation: >-
      The heterozygous null mouse phenocopying the human growth and skeletal
      features is the direct argument that gene dose is the lesion.
  - reference: PMID:19116164
    reference_title: "Genetic interaction between Bmp2 and Bmp4 reveals shared functions during multiple aspects of mouse organogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Whereas mice lacking a single copy of Bmp2 or Bmp4 are viable and have subtle developmental defects, compound mutants show embryonic and postnatal lethality due to defects in multiple organ systems including the allantois, placental vasculature, ventral body wall, skeleton, eye and heart."
    explanation: >-
      Independently establishes that a single Bmp2 null allele is viable and
      produces subtle rather than gross defects, which is the severity regime
      the human disorder occupies and the reason haploinsufficiency here is a
      syndrome rather than a lethal.
- name: Reduced Canonical BMP-SMAD Signalling Output
  description: >-
    Reduced ligand gives reduced phosphorylation of the receptor-regulated SMADs
    1, 5 and 9 and less transcriptional output from BMP-responsive genes in
    every tissue that depends on BMP2 rather than on a redundant family member.
    Where BMP4 or BMP7 is co-expressed the deficit is buffered; where BMP2 is
    the principal ligand it is not, and this is what selects the affected
    tissues.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: BMP signaling pathway
    modifier: DECREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  - preferred_term: SMAD protein signal transduction
    modifier: DECREASED
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
  downstream:
  - target: Impaired Cranial Neural Crest Osteogenic Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30413887
      reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further studies revealed obvious reduction in cell proliferation and differentiation of osteogenic progenitors in the mandible of the mutants, attributing to the micrognathia phenotype."
      explanation: >-
        Deleting Bmp2 specifically in cranial neural crest reduces proliferation
        and differentiation of osteogenic progenitors, which is this edge. The
        mutant is a homozygous lineage-restricted null, so it establishes that
        the requirement exists rather than that a halved dose breaches it.
  - target: Reduced Osteogenic Output of Skeletal Progenitors
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17194222
      reference_title: "Genetic analysis of the roles of BMP2, BMP4, and BMP7 in limb patterning and skeletogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We do find that a threshold level of BMP signaling is required for the onset of chondrogenesis, and hence some chondrogenic condensations fail to form in limbs deficient in both BMP2 and BMP4."
      explanation: >-
        Names a signalling threshold below which condensation fails, which is
        the form of dose dependence a haploinsufficiency has to act through.
  - target: Failed Endocardial Cushion Mesenchymal Transition
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16314491
      reference_title: "Bmp2 is essential for cardiac cushion epithelial-mesenchymal transition and myocardial patterning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deletion of the Bmp type 1A receptor, Bmpr1a, in endocardium also resulted in failed cushion formation, indicating that Bmp2 signals directly to cushion-forming endocardium to induce EMT."
      explanation: >-
        Places the requirement on receptor-level BMP2 signalling in the
        cushion-forming endocardium itself, which is the edge from reduced
        signalling to failed transformation. Both manipulations are homozygous
        tissue-restricted deletions, not the heterozygous state of the human
        disease.
  evidence:
  - reference: PMID:37572998
    reference_title: "BMP2 is a potential causative gene for isolated dextrocardia situs solitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BMP2 (bone morphogenic protein-2) is a member of the TGF-β superfamily and has essential roles in the development of multiple organs, including osteogenesis."
    explanation: >-
      Establishes that one ligand serves several developmental fields at once,
      which is why a single halved dose produces a multi-system phenotype rather
      than an isolated defect.
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Scube3-/- mice showed craniofacial and dental defects, reduced body size, and defective endochondral bone growth due to impaired BMP-mediated chondrogenesis and osteogenesis, recapitulating the human disorder."
    explanation: >-
      Independent support from the other end of the same signalling axis: losing
      a positive modulator of BMP2 signalling, rather than BMP2 itself, yields
      a comparable craniofacial and growth phenotype through reduced BMP
      output. INDIRECT because the lesion is in SCUBE3, so the claim about
      reduced BMP2 signalling follows by inference rather than being measured
      here. Note the quoted phrase "the human disorder" means SSFSC2
      (MONDO:0030953, the recessive SCUBE3 disorder), not the SSFSC1 curated
      here - this is exactly the label collision this entry guards against, and
      the sentence is quoted with that reading made explicit.
- name: Impaired Cranial Neural Crest Osteogenic Differentiation
  description: >-
    Cranial neural crest cells populate the pharyngeal arches and give rise, by
    intramembranous ossification, to most of the facial skeleton. With less BMP2
    they proliferate and differentiate into osteoblasts less well, so the
    mandible, maxilla and zygoma are built undersized.
  biological_scale: CELLULAR
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch Program Perturbation"
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: neural crest cell development
    modifier: ABNORMAL
    term:
      id: GO:0014032
      label: neural crest cell development
  - preferred_term: osteoblast differentiation
    modifier: DECREASED
    term:
      id: GO:0001649
      label: osteoblast differentiation
  downstream:
  - target: Craniofacial Skeletal Hypoplasia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30413887
      reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further studies revealed obvious reduction in cell proliferation and differentiation of osteogenic progenitors in the mandible of the mutants, attributing to the micrognathia phenotype."
      explanation: >-
        The authors attribute the gross mandibular phenotype to the progenitor
        defect, which is exactly this edge rather than either node alone. From
        a homozygous cranial-neural-crest conditional mutant, so the effect
        size is an upper bound on the human heterozygote.
  evidence:
  - reference: PMID:30413887
    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we generate mice carrying Bmp2-specific deletion in cranial neural crest cells using floxed Bmp2 and Wnt1-Cre alleles to mimic PRS in humans."
    explanation: >-
      Establishes the cranial neural crest as the cell population in which BMP2
      loss produces the craniofacial phenotype.
  notes: >-
    On the module conformance declared here and on the consequence node: this
    entry conforms to the trigger and consequence nodes of
    pharyngeal_arch_patterning_serial_homology but deliberately not to its
    central effector, "Disrupted Pharyngeal-Arch Patterning and Neural-Crest
    Skeletogenesis". That node is written around mis-specification of arch
    identity, whose clearest demonstration is homeotic transformation of
    mandibular toward maxillary fate under a disrupted EDN1-DLX code. Nothing of
    that kind is reported for BMP2: the cranial-neural-crest conditional mutant
    shows reduced proliferation and osteogenic differentiation of progenitors
    with arch identity intact, so the lesion here is quantitative
    skeletogenesis, not patterning. Claiming that node would assert a
    mis-specification the literature does not support.
- name: Craniofacial Skeletal Hypoplasia
  description: >-
    The undersized facial skeleton is what the clinic sees as the recognisable
    gestalt: midface hypoplasia, micrognathia, a long philtrum and a crowded
    dentition in a maxilla too small for it. The mouse mutant quantifies it as
    roughly a 40 per cent reduction in zygomatic volume and 10 per cent in
    mandibular length, with the proximal mandible worse affected than the
    distal.
  biological_scale: TISSUE
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Serially Homologous Craniofacial Malformation Across Arch Derivatives"
  biological_processes:
  - preferred_term: face morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0060325
      label: face morphogenesis
  - preferred_term: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
  downstream:
  - target: Midface retrusion
    causal_link_type: DIRECT
  - target: Micrognathia
    causal_link_type: DIRECT
  - target: Dental crowding
    causal_link_type: DIRECT
  - target: Hypertelorism
    causal_link_type: DIRECT
  - target: Downslanted palpebral fissures
    causal_link_type: DIRECT
  - target: Broad forehead
    causal_link_type: DIRECT
  - target: Long philtrum
    causal_link_type: DIRECT
  - target: Low-set ears
    causal_link_type: DIRECT
  - target: Posteriorly rotated ears
    causal_link_type: DIRECT
  - target: Failure of Tongue Descent and Palatal Shelf Elevation
    causal_link_type: DIRECT
    description: >-
      A mandible too small to accommodate the tongue holds it high, where it
      obstructs the palatal shelves.
    evidence:
    - reference: PMID:30413887
      reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results demonstrated that the failure of palatal shelf elevation in embryo lacking Bmp2 in CNC-derived mesenchyme is due to the steric hindrance of the higher tongue."
      explanation: >-
        Attributes the elevation failure to steric hindrance by the tongue,
        which is this edge. Established in a homozygous cranial-neural-crest
        conditional mutant, not in the heterozygote that matches the human
        disease.
  - target: Eustachian Tube Dysfunction and Middle Ear Effusion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A hypoplastic midface and palate distort the nasopharynx and the
      musculature that opens the Eustachian tube, so effusions accumulate.
  evidence:
  - reference: PMID:30413887
    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lateral views of 3D reconstructions from microCT scans further confirmed severe craniofacial bone defects in mutant mice, including a ~ 40% reduction in the zygomatic volume and a ~ 10% reduction in the length of the mandibular bone with a missing coronoid process"
    explanation: >-
      Quantifies the hypoplasia this node asserts, across two separate arch
      derivatives. From a homozygous conditional mutant, so the magnitudes are
      an upper bound on what a halved human dose would produce.
- name: Failure of Tongue Descent and Palatal Shelf Elevation
  description: >-
    The mechanical step between a small mandible and a cleft palate, and the
    reason the cleft in this disorder is palatal rather than a cleft lip. It is
    given its own node because the mouse work shows it is genuinely mechanical
    and not a BMP2 signalling defect in the palate at all: mutant palatal
    shelves elevate and fuse normally once the mandible and tongue are removed,
    and BMP/SMAD activity in the mutant palate is largely preserved through
    BMP4 and BMP7 redundancy. Collapsing this into the hypoplasia node would
    imply a palatal signalling lesion that the evidence specifically excludes.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: roof of mouth development
    modifier: ABNORMAL
    term:
      id: GO:0060021
      label: roof of mouth development
  downstream:
  - target: Cleft palate
    causal_link_type: DIRECT
  - target: Pierre-Robin sequence
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30413887
    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Palate clefting is caused by the undescended tongue that prevents palatal shelf elevation."
    explanation: >-
      The causal statement this node exists to carry.
  - reference: PMID:30413887
    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Bmp2 itself is not an intrinsic regulator of palatal shelf elevation and fusion."
    explanation: >-
      Refutes the alternative reading, that BMP2 acts on the palatal shelves
      directly. Recorded because that reading is the natural one and is wrong,
      and because it is what makes this a separate mechanical node rather than
      part of the hypoplasia node above.
  - reference: PMID:30413887
    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Our results demonstrate that, although Bmp2 is inactivated in CNC-derived mesenchymal tissues, the activities of BMP signaling in the mutant palate appear largely unaffected, most likely attributing to the functional redundancy by Bmp4 and Bmp7."
    explanation: >-
      A measured negative result: pSmad1/5/8 was largely unchanged in the
      mutant palate. It refutes any claim that reduced BMP-SMAD output in the
      palate causes the cleft, and it is the direct evidence for the BMP4/BMP7
      redundancy this entry invokes elsewhere.
  - reference: PMID:21671386
    reference_title: "Microdeletion 20p12.3 involving BMP2 contributes to syndromic forms of cleft palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features were significant for cleft palate and facial dysmorphism in all three patients, including Pierre-Robin sequence in two."
    explanation: >-
      The human counterpart, in patients whose only deleted gene was BMP2 in two
      of three cases.
- name: Reduced Osteogenic Output of Skeletal Progenitors
  description: >-
    In the limb and axial skeleton the sensitive step is osteogenesis from
    cartilage templates, not chondrocyte differentiation. Two negative results
    in the mouse limb genetics constrain this node and are worth stating
    plainly, because they are easy to overread in the opposite direction: once
    a condensation has formed, chondrogenic differentiation proceeds normally
    even without BMP2, and severe osteogenic impairment appears only when BMP4
    is removed as well. BMP4 and BMP7 are therefore substantially redundant
    with BMP2 in the limb, which is the most likely reason the human
    heterozygote has hypoplastic and dysmorphic bones rather than absent
    skeletal elements, and the reason this node is annotated for osteogenesis
    alone.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    modifier: DECREASED
    term:
      id: GO:0001649
      label: osteoblast differentiation
  downstream:
  - target: Impaired Endochondral Bone Growth
    causal_link_type: DIRECT
  - target: Deficient Skeletal Repair and Bone Homeostasis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17194222
    reference_title: "Genetic analysis of the roles of BMP2, BMP4, and BMP7 in limb patterning and skeletogenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, we find that the loss of both BMP2 and BMP4 results in a severe impairment of osteogenesis."
    explanation: >-
      Locates the BMP-sensitive step at osteogenesis. INDIRECT, and the
      qualification matters: this is a compound Bmp2/Bmp4 limb-conditional
      knockout, so it identifies which step BMP signalling is required for
      without showing that removing BMP2 alone impairs it.
  - reference: PMID:17194222
    reference_title: "Genetic analysis of the roles of BMP2, BMP4, and BMP7 in limb patterning and skeletogenesis."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "However, in the condensations that do form, subsequent chondrogenic differentiation proceeds normally even in the absence of BMP2 and BMP7 or BMP2 and BMP4."
    explanation: >-
      Recorded as a refutation of the natural but wrong reading of this node,
      that BMP2 loss impairs chondrocyte differentiation. It does not, even in
      compound mutants, which is why no chondrocyte-differentiation process is
      annotated here despite chondrocytes being listed as a cell type.
  - reference: PMID:19116164
    reference_title: "Genetic interaction between Bmp2 and Bmp4 reveals shared functions during multiple aspects of mouse organogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results identify numerous BMP4-dependent developmental processes that are also very sensitive to BMP2 dosage, thus revealing novel functions of Bmp2."
    explanation: >-
      This is the dose claim the node needs and the compound limb knockout does
      not supply: skeletal processes conventionally attributed to BMP4 are
      shown to be sensitive to BMP2 gene dosage specifically, which is the
      regime a human heterozygote is in.
- name: Impaired Endochondral Bone Growth
  description: >-
    Reduced growth of the long bones through the endochondral route produces
    proportionate to mildly disproportionate short stature. Growth hormone axis
    testing is normal in most affected individuals, which locates the deficit in
    the growth plate rather than in pituitary output.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  - preferred_term: growth plate cartilage development
    modifier: DECREASED
    term:
      id: GO:0003417
      label: growth plate cartilage development
  downstream:
  - target: Short stature
    causal_link_type: DIRECT
  - target: Brachydactyly
    causal_link_type: DIRECT
  - target: Short toe
    causal_link_type: DIRECT
  - target: Sandal gap
    causal_link_type: DIRECT
  - target: Prominent sternum
    causal_link_type: DIRECT
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:40285376
    reference_title: "Emergence of osteolysis as a new radiological feature in a case with a novel BMP2 gene variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone morphogenetic protein 2 (BMP2) is essential for endochondral ossification, skeletal development, and bone homeostasis."
    explanation: >-
      Names endochondral ossification as the process BMP2 is required for, which
      is the route from reduced signalling to reduced stature.
- name: Deficient Skeletal Repair and Bone Homeostasis
  description: >-
    BMP2 is not required to build the skeleton once other BMPs are present, but
    it is required to initiate repair of it. Limb-conditional Bmp2 null mice
    accumulate spontaneous fractures that never heal, so the postnatal role is
    maintenance rather than morphogenesis. This is the most plausible frame for
    the phalangeal osteolysis reported in one patient, and it is the reason
    skeletal surveillance in this disorder is longitudinal rather than a single
    baseline survey.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: bone remodeling
    modifier: ABNORMAL
    term:
      id: GO:0046849
      label: bone remodeling
  downstream:
  - target: Phalangeal osteolysis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17099713
    reference_title: "BMP2 activity, although dispensable for bone formation, is required for the initiation of fracture healing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice lacking the ability to produce BMP2 in their limb bones have spontaneous fractures that do not resolve with time."
    explanation: >-
      Separates a postnatal bone-maintenance requirement for BMP2 from its
      developmental one. Note this is the homozygous limb-conditional null, not
      the heterozygote, so it establishes that the requirement exists rather
      than that a halved dose is enough to breach it.
  notes: >-
    The link from this node to human phalangeal osteolysis is the weakest chain
    in this entry and is labelled as such deliberately. Osteolysis has been
    reported once, in a single 10-year-old; the mouse evidence for a repair
    requirement comes from complete limb-conditional loss rather than
    heterozygosity. Both halves are real and they point the same way, but this
    is a hypothesis about a single case rather than an established mechanism.
- name: Failed Endocardial Cushion Mesenchymal Transition
  description: >-
    In the atrioventricular canal, endocardial cells respond to a
    myocardium-derived BMP2 signal by undergoing epithelial-to-mesenchymal
    transition and populating the cushions that become the septa and valves.
    Reduced BMP2 attenuates that induction. The variable penetrance of cardiac
    disease here, against near-complete penetrance of the skeletal features,
    suggests this field tolerates a halved dose better than the skeletal ones
    do.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition involved in endocardial cushion formation
    modifier: DECREASED
    term:
      id: GO:0003198
      label: epithelial to mesenchymal transition involved in endocardial cushion formation
  downstream:
  - target: Congenital Septal and Valvuloseptal Defects
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16314491
    reference_title: "Bmp2 is essential for cardiac cushion epithelial-mesenchymal transition and myocardial patterning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that Bmp2 has three functions in the AV canal: to enhance formation of the cardiac jelly, to induce endocardial EMT and to pattern the AV myocardium."
    explanation: >-
      Assigns cushion induction to Bmp2 specifically, in the myocardial
      compartment that signals to the endocardium. Homozygous conditional
      inactivation, so it shows the signal is required rather than that halving
      it produces the human septal defects.
  - reference: PMID:10362015
    reference_title: "Bone morphogenetic protein-2 acts synergistically with transforming growth factor-beta3 during endothelial-mesenchymal transformation in the developing chick heart."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Antisense oligodeoxynucleotides to BMP2 inhibited mesenchyme formation in AV endocardium cocultured with associated myocardium. This inhibitory effect was reversed by the addition of recombinant BMP2."
    explanation: >-
      A loss-and-rescue experiment in explant culture, which is the cleanest
      demonstration that the BMP2 signal itself is what drives cushion
      mesenchyme formation. Independent of the mouse genetics and of a
      transgenic background.
  - reference: PMID:10362015
    reference_title: "Bone morphogenetic protein-2 acts synergistically with transforming growth factor-beta3 during endothelial-mesenchymal transformation in the developing chick heart."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "However, BMP2 enhanced the TGFbeta-induced initial phenotypic changes associated with endothelial-mesenchymal transformation."
    explanation: >-
      BMP2 is a modulator of a TGF-beta-driven transformation rather than a
      sufficient inducer of it. That dependence on a co-signal is a plausible
      reason a halved BMP2 dose gives incompletely penetrant cardiac disease
      rather than obligate septal defects, though the inference is ours.
- name: Congenital Septal and Valvuloseptal Defects
  description: >-
    Structural congenital heart disease, most often septal, in a minority of
    affected individuals. Cardiac involvement is the least penetrant arm of this
    syndrome and is absent in several well-characterised patients.

    One reported patient extends this beyond septation to the left ventricular
    outflow tract, with a bicuspid aortic valve and aortic root and ascending
    aortic aneurysm. That is a different morphogenetic field from the
    atrioventricular cushions the mechanism above runs through, and the mouse
    literature is explicit that BMP2's role in semilunar valvulogenesis is less
    well established than its role in the AV cushions. It is curated as part of
    the cardiac spectrum on the strength of the human observation, not on a
    mechanism this entry can trace.
  biological_scale: TISSUE
  downstream:
  - target: Congenital heart disease
    causal_link_type: DIRECT
  - target: Bicuspid aortic valve
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Aortic root aneurysm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Wolff-Parkinson-White syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29198724
    reference_title: "Monoallelic BMP2 Variants Predicted to Result in Haploinsufficiency Cause Craniofacial, Skeletal, and Cardiac Features Overlapping Those of 20p12 Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate the important role of BMP2 in human craniofacial, skeletal, and cardiac development and confirm that individuals heterozygous for BMP2 truncating sequence variants or deletions display a consistent distinct phenotype characterized by short stature and skeletal and cardiac anomalies without neurological deficits."
    explanation: >-
      Establishes cardiac anomalies as part of the core phenotype in the
      defining series.
  - reference: PMID:19116164
    reference_title: "Genetic interaction between Bmp2 and Bmp4 reveals shared functions during multiple aspects of mouse organogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Within the heart, BMP2 and BMP4 function coordinately to direct normal lengthening of the outflow tract, proper positioning of the outflow vessels, and septation of the atria, ventricle and atrioventricular canal."
    explanation: >-
      Names septation of the atria, ventricle and atrioventricular canal as a
      BMP2-dependent process, which is the specific lesion class this node
      asserts. It also explains why cardiac penetrance is partial: BMP4 shares
      the function.
- name: Eustachian Tube Dysfunction and Middle Ear Effusion
  description: >-
    Recurrent secretory otitis media, driven by the craniofacial anatomy rather
    than by any primary defect of the inner ear or of immunity. The hearing loss
    that follows is therefore conductive and, in principle, correctable, which
    is why it is worth separating from the sensorineural loss seen in other
    skeletal dysplasias.
  biological_scale: TISSUE
  downstream:
  - target: Recurrent otitis media
    causal_link_type: DIRECT
  - target: Conductive hearing impairment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39970956
      reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The conductive hearing impairment detected in four individuals (4/5) in our cohort resulted from repeated secretory otitis media."
      explanation: >-
        The word "resulted from" makes this an explicit causal claim about the
        edge, not merely co-occurrence of the two findings.
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Fluctuating conductive hearing loss during the years of language
      acquisition is the proposed route to the speech delay, which occurs
      without intellectual disability.
    evidence:
    - reference: PMID:39970956
      reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We speculate that individuals with BMP2 haploinsufficiency may suffer from articulation difficulties related to facial muscular hypotonia and conductive hearing loss."
      explanation: >-
        The authors advance this as a speculation, and the edge is curated at
        that strength: it is the proposed explanation of the speech delay, not a
        demonstrated one.
  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four individuals had recurrent secretory otitis media and needed to go through myringotomy, all of them also had secondary conductive hearing impairment because of secretory otitis media."
    explanation: >-
      Documents the effusion-to-conductive-loss sequence directly, including the
      intervention it required.

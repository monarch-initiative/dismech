    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Palate clefting is caused by the undescended tongue that prevents palatal shelf elevation."
    explanation: >-
      Describes the tongue-position mechanism in the conditional-null mouse.
  - reference: PMID:30413887
    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Bmp2 itself is not an intrinsic regulator of palatal shelf elevation and fusion."
    explanation: >-
      Cultured mutant heads and palatal shelves retain elevation and fusion capacity after removal of
      the obstruction. This refutes an intrinsic failure of those processes under the tested culture conditions.
  - reference: PMID:30413887
    reference_title: "Conditional deletion of Bmp2 in cranial neural crest cells recapitulates Pierre Robin sequence in mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Our results demonstrate that, although Bmp2 is inactivated in CNC-derived mesenchymal tissues, the activities of BMP signaling in the mutant palate appear largely unaffected, most likely attributing to the functional redundancy by Bmp4 and Bmp7."
    explanation: >-
      Most palatal signaling persisted, but the full text reports reduced posterior nasal-side pSmad1/5/8.
      Redundancy was inferred rather than directly tested by combined deletion in this experiment.
  - reference: PMID:21671386
    reference_title: "Microdeletion 20p12.3 involving BMP2 contributes to syndromic forms of cleft palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features were significant for cleft palate and facial dysmorphism in all three patients, including Pierre-Robin sequence in two."
    explanation: >-
      The human counterpart, in patients whose only deleted gene was BMP2 in two
      of three cases.
- name: Reduced Osteogenic Output of Skeletal Progenitors
  description: >-
    In Prx1-Cre limb mesenchyme, combined deletion of Bmp2 and Bmp4 allows an initial bone collar but
    prevents sustained osteoblast maturation and trabecular or cortical bone formation. Osterix expression
    declines after birth. Loss of Bmp2 alone largely preserves early limb skeletal differentiation in
    this experiment, showing that the combined-knockout result is not a direct demonstration of the human
    monoallelic defect. Chondrogenic requirements differ by lineage and developmental stage.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062

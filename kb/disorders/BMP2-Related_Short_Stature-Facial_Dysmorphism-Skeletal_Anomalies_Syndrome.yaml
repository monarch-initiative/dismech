- name: Reduced Cranial Neural Crest Chondrogenic Progenitors
  description: >-
    Complete Bmp2 loss in the mouse cranial neural crest lineage reduces Sox9 expression and proliferation
    in Meckel cartilage. The smaller transient cartilaginous support accompanies mandibular hypoplasia.
    This lineage-specific finding cannot be replaced by results from limb mesenchyme, where other BMP
    ligands can sustain much of chondrogenesis.

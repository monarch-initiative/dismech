  evidence:
  - reference: PMID:39970956
    reference_title: "Genotypic and Phenotypic Characterization of Seven Individuals With Predicted Bone Morphogenetic Protein 2 (BMP2) Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of them also had adenoid hypertrophy and underwent adenoidectomy."
    explanation: >-
      Documents the intervention in three of the four affected individuals.
- name: Growth Hormone Replacement
  description: >-
    Used in the subset with demonstrated growth hormone deficiency, not as a
    treatment for the BMP2 growth-plate defect itself. One individual with
    partial isolated deficiency had a marked height response. Growth hormone
    testing was normal in the other cohort individuals with data, so this is not
    a general therapy for the short stature of this syndrome.

pathophysiology:
- name: Clarin-1 Loss of Function
  description: >-
    Biallelic loss of clarin-1, a four-transmembrane protein that belongs to
    neither the upper tip-link density complex nor the ankle-link complex. Its
    core experimentally supported cellular role is actin filament organization.

    Because clarin-1 is in neither Usher complex and has no assigned biochemical
    activity, this node names the protein's loss rather than the disruption of a
    named assembly - which is the honest form of the claim and is itself the
    reason type 3 could not share a root node with types 1 and 2.
  biological_scale: MOLECULAR
  downstream:
  - target: Cochlear Hair Bundle Disorganization
    description: >-
      Clarin-1 is required for cochlear hair cell development; its loss
      disorganizes the hair bundle.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19680541
      reference_title: CLRN1 is nonessential in the mouse retina but is required for cochlear hair cell development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Clrn1 KO mice do not develop a retinal degeneration phenotype, but exhibit progressive loss of sensory hair cells in the cochlea and deterioration of the organ of Corti by 4 months."
      explanation: >-
        Establishes the cochlear requirement for clarin-1. The same sentence is the
        primary evidence that the mouse retina does not model this entity.
  - target: Müller Glial Support Failure
    description: >-
      Clarin-1 is expressed in Müller glia rather than photoreceptors, so its loss
      acts on the retina through glial support rather than through a
      photoreceptor-intrinsic defect.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31625146
      reference_title: Clarin-1 expression in adult mouse and human retina highlights a role of Müller glia in Usher syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The pattern of Clrn1 mRNA cellular expression is similar in both mouse and human adult retina, with CLRN1 transcripts being localized in Müller glia, and not photoreceptors."
      explanation: >-
        Establishes the cell type in human retina, using RNAscope and single-cell
        RNA-seq on adult human tissue.
  evidence:
  - reference: PMID:11524702
    reference_title: "Mutations in a novel gene with transmembrane domains underlie Usher syndrome type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "USH3, the candidate gene that we \nidentified, encodes a 120-amino-acid protein."
    explanation: Identifies the causative gene subsequently named CLRN1.
- name: Cochlear Hair Bundle Disorganization
  description: >-
    Progressive loss of cochlear sensory hair cells and deterioration of the organ
    of Corti. Unlike types 1 and 2, where the lesion is in a structural complex
    required from the outset, the clarin-1 deficit produces a progressive
    postnatal loss - which is the mechanistic correlate of the postlingual,
    progressive audiogram that clinically defines type 3.
  biological_scale: TISSUE
  conforms_to: "sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death"
  cell_types:
  - preferred_term: cochlea auditory hair cell
    term:
      id: CL:4023120
      label: cochlea auditory hair cell
  locations:

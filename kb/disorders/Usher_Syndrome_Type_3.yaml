review_notes: >-
  Created 2026-09-24 by splitting kb/disorders/Usher_Syndrome.yaml into four
  mechanism entities plus a grouping, per the decision recorded on issue #10822.

  This is the entity the lumped entry served worst. Clarin-1 is in neither Usher
  complex, so the shared root node named an assembly it does not belong to; and
  it is expressed in Müller glia rather than photoreceptors, so the shared
  "Photoreceptor Connecting Cilium Dysfunction" node named a compartment it is
  not in. Both nodes have been replaced rather than renamed.

  The root node names the loss of a protein rather than the disruption of a named
  complex, which is deliberate: clarin-1 has no assigned biochemical activity and
  belongs to no Usher assembly, and a node asserting otherwise would be the same
  defect the split was made to fix.

  The retinal causal direction rests on a cell-specific rescue experiment in
  zebrafish, with the human cell-type attribution from RNAscope and single-cell
  RNA-seq on adult human retina. The published PLoS Genetics version is cited
  rather than the bioRxiv preprint.

  The Clrn1 knockout mouse carries a FAILS_TO_RECAPITULATE link for the retinal
  arm. That is a substantive negative claim and it is the observation that
  redirected the field to Müller glia, so it is recorded structurally rather than
  left as prose.

  ClinGen's CLRN1-type 3 Definitive assertion is not cited as a structured
  reference because it predates the CGGV identifier scheme and its CGGCIEX
  identifier is not in the repository's ClinGen index; this was checked rather
  than assumed, and the gene entry says so. The HARS1 Refuted assertion does have
  a CGGV identifier and is cited.

  No GeneReviews chapter exists for Usher syndrome type 3 or CLRN1. This was
  checked rather than assumed: the committed Bookshelf index
  (cache/bookshelf/genereviews.csv, snapshot 2026-09-10, 958 chapters) contains
  exactly two Usher chapters - PMID:20301442 "Usher Syndrome Type I." (NBK1265)
  and PMID:20301515 "Usher Syndrome Type II." (NBK1341) - and neither covers type
  3. `just check-genereviews kb/disorders/Usher_Syndrome_Type_3.yaml` reports
  NO_CHAPTER for the same reason. The mandatory GeneReviews phenotype baseline
  therefore does not apply to this entry, and neither existing chapter is cited,
  since quoting a type I or type II chapter for a type-3 claim would be evidence
  from the wrong disease. This follows the convention Usher_Syndrome_Type_4
  already records for the same situation.

  Not curated here: the CLRN1 isolated-retinopathy branch (retinitis pigmentosa
  61). Like the USH2A branch on the type-2 entry, it is defined by ABSENT hearing
  loss and cannot be stated until issue #10190 lands. No per-entity prevalence is
  asserted: the 4-17 per 100,000 figure the lumped entry carried is for Usher
  syndrome as a whole, and the `Grouping` class has no prevalence slot, so that
  figure is carried in the grouping's prose.

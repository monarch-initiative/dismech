    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  downstream:
  - target: Progressive Postlingual Sensorineural Hearing Loss
    description: >-
      Progressive hair cell loss produces hearing loss that develops after speech
      acquisition and worsens over time.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11524702
      reference_title: "Mutations in a novel gene with transmembrane domains underlie Usher syndrome type 3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Usher syndrome type 3 (USH3) is an autosomal recessive disorder characterized by \nprogressive hearing loss, severe retinal degeneration, and variably present \nvestibular dysfunction, assigned to 3q21-q25."
      explanation: Establishes progressive hearing loss as the defining type-3 auditory course.
  - target: Vestibular Dysfunction
    description: >-
      Vestibular involvement is variable in type 3, unlike the constant areflexia
      of type 1.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11524702
      reference_title: "Mutations in a novel gene with transmembrane domains underlie Usher syndrome type 3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Usher syndrome type 3 (USH3) is an autosomal recessive disorder characterized by \nprogressive hearing loss, severe retinal degeneration, and variably present \nvestibular dysfunction, assigned to 3q21-q25."
      explanation: Establishes variable rather than constant vestibular dysfunction in type 3.
  evidence:
  - reference: PMID:19680541
    reference_title: CLRN1 is nonessential in the mouse retina but is required for cochlear hair cell development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Clrn1 KO mice do not develop a retinal degeneration phenotype, but exhibit progressive loss of sensory hair cells in the cochlea and deterioration of the organ of Corti by 4 months."
    explanation: Establishes the progressive cochlear hair cell loss that this node describes.
- name: Müller Glial Support Failure
  description: >-
    Loss of clarin-1 from Müller glia disorganizes actin-based structures of the
    Müller glia and the outer retina, and leaves photoreceptors unable to
    withstand cell stress. The cell-type attribution is supported directly in
    human tissue, and the causal direction - glia to photoreceptor - is supported
    by a cell-specific rescue experiment in which Müller glial re-expression
    prevents photoreceptor death while photoreceptor-specific re-expression does
    not.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Mueller cell
    term:
      id: CL:0000636
      label: Mueller cell
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  downstream:
  - target: Photoreceptor Degeneration
    description: >-
      Loss of Müller glial support is followed by photoreceptor stress sensitivity
      and degeneration.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40067805
      reference_title: The USH3A causative gene clarin1 functions in Müller glia to maintain retinal photoreceptors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Müller glia re-expression of clrn1 prevented the elevated cell death observed in larval clrn1 mutant zebrafish exposed to high-intensity light."
      explanation: >-
        Cell-specific rescue establishes that the glial compartment is where
        clarin-1 acts to protect photoreceptors.
    - reference: PMID:40067805
      reference_title: The USH3A causative gene clarin1 functions in Müller glia to maintain retinal photoreceptors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, rod- or cone-specific Clrn1 re-expression did not reduce the extent of cell death."
      explanation: >-
        The negative arm of the same rescue experiment rules out a
        photoreceptor-intrinsic requirement, which is what distinguishes this
        retinal mechanism from those of types 1 and 2.
  evidence:
  - reference: PMID:40067805
    reference_title: The USH3A causative gene clarin1 functions in Müller glia to maintain retinal photoreceptors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Investigation revealed disorganization in the outer retina in clrn1 mutants, including actin-based structures of the Müller glia and photoreceptor cells."
    explanation: Establishes the outer-retinal and Müller glial disorganization that this node describes.
  - reference: PMID:31625146
    reference_title: Clarin-1 expression in adult mouse and human retina highlights a role of Müller glia in Usher syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pattern of Clrn1 mRNA cellular expression is similar in both mouse and human adult retina, with CLRN1 transcripts being localized in Müller glia, and not photoreceptors."
    explanation: Establishes the human cell-type attribution underlying this node.

- name: Investigational Gene-Directed Therapy
  description: >-
    No approved treatment exists for the retinal degeneration. Gene replacement,
    gene editing, antisense oligonucleotides and small molecules are in
    development across the Usher entities.

    The Müller glial localization of clarin-1 has a direct consequence for this
    entity that does not apply to types 1 and 2: a retinal gene therapy would need
    to reach Müller glia, not photoreceptors. The zebrafish rescue experiment cited
    on the Müller glial node is the evidence for that targeting requirement.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:32995707
    reference_title: "Usher syndrome: clinical features, molecular genetics and advancing therapeutics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While there is currently no available approved treatment for the RP, various therapeutic strategies are in development or in clinical trials for Usher syndrome, including gene replacement, gene editing, antisense oligonucleotides and small molecule drugs."
    explanation: Documents that no approved retinal treatment exists and names the strategies in development.

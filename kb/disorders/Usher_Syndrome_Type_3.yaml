      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Clrn1 KO mice do not develop a retinal degeneration phenotype, but exhibit progressive loss of sensory hair cells in the cochlea and deterioration of the organ of Corti by 4 months."
      explanation: Establishes that the model reproduces the cochlear mechanism.
  - target: Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Clrn1-null mice develop no retinal degeneration, so the model cannot report
      on the retinal arm of this entity and a negative retinal result in it is
      uninformative about human disease. Mouse Clrn1 mRNA is also developmentally
      downregulated in the adult retina, detectable only by sensitive assays,
      which compounds the problem.
    description: >-
      The model does not reproduce the human retinal phenotype.
    evidence:
    - reference: PMID:19680541
      reference_title: CLRN1 is nonessential in the mouse retina but is required for cochlear hair cell development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Clrn1 KO mice do not develop a retinal degeneration phenotype, but exhibit progressive loss of sensory hair cells in the cochlea and deterioration of the organ of Corti by 4 months."
      explanation: Directly states the absent retinal phenotype.
  evidence:
  - reference: PMID:19680541
    reference_title: CLRN1 is nonessential in the mouse retina but is required for cochlear hair cell development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast to mouse KO models of USH1 and USH2, our data indicate that Clrn1 expression in the retina is restricted to the Müller glia."
    explanation: >-
      The same study that reports the absent retinal phenotype also reports the

- name: Clrn1 knockout mouse
  species: Mouse (Mus musculus)
  genotype: Clrn1 knockout
  category: Constitutive knockout
  description: >-
    Reproduces the cochlear arm of type 3 and explicitly fails to reproduce the
    retinal arm. Both results are informative, and the negative one is the more
    useful of the two: it is the observation that redirected the field toward
    Müller glia.
  modeled_mechanisms:
  - target: Cochlear Hair Bundle Disorganization
    relationship: RECAPITULATES

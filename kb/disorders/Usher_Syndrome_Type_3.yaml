name: Usher Syndrome Type 3
creation_date: "2026-09-24T00:00:00Z"
category: Mendelian
synonyms:
- USH3
- USH3A
- Usher syndrome type III
- Usher syndrome type 3
description: >
  Usher syndrome type 3 is the mechanism entity caused by biallelic loss of
  clarin-1 (CLRN1), producing progressive postlingual sensorineural hearing loss,
  variable vestibular dysfunction, and variable-onset retinitis pigmentosa.

  Clarin-1 is the outlier of the Usher proteins, and that is the reason this is a
  separate entity rather than a third clinical grade of one disease. It belongs
  to neither the upper tip-link density complex of type 1 nor the ankle-link
  complex of type 2. Its core experimentally supported role is actin filament
  organization, and the in vivo support for it is the disorganized stereocilia of
  Clrn1-null mice.

  The retinal arm diverges even further. Clarin-1 is expressed in MÜLLER GLIA,
  not photoreceptors, in both mouse and human adult retina - so the type-3
  retinal mechanism is a glial support failure that causes photoreceptor loss
  secondarily, rather than a photoreceptor-intrinsic defect. In zebrafish,
  re-expressing clarin-1 in Müller glia rescues light-induced retinal cell death
  while rod- or cone-specific re-expression does not. A single "photoreceptor
  connecting cilium dysfunction" node, as the previously lumped Usher entry
  carried, was simply wrong for this entity: clarin-1 is not in photoreceptors.

  The clinical typing is an imperfect proxy for the mechanism in both directions
  here. A Spanish series reported clarin-1 phenotypic variability such that the
  progression of hearing impairment, the parameter classically used to separate
  type 3 from types 1 and 2, does not cleanly assign every CLRN1 family.

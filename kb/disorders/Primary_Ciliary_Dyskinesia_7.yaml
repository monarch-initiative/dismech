    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic DNAH11 variants. The first patient was
    homozygous through paternal uniparental disomy of chromosome 7; later
    patients are mostly compound heterozygous for private variants.
  evidence:
  - reference: PMID:22184204
    reference_title: "Mutations of DNAH11 in patients with primary ciliary dyskinesia with normal ciliary ultrastructure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 58 unrelated patients with PCD with normal ultrastructure, 13 (22%) had two (biallelic) mutations in DNAH11"
    explanation: Biallelic variants in affected patients.
  - reference: PMID:12142464
    reference_title: "Mutations in the DNAH11 (axonemal heavy chain dynein type 11) gene cause one form of situs inversus totalis and most likely primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous nonsense mutation (R2852X) in the DNAH11 gene."
    explanation: Homozygous truncating variant in the first reported patient.
prevalence:
- population: PCD patients with normal ciliary ultrastructure
  measure_type: UNKNOWN
  notes: >-
    No population prevalence exists for CILD7. DNAH11 explained 22% of
    unrelated PCD patients with normal ultrastructure in one large referral
    cohort, and DNAH5 and DNAH11 together account for about half of
    genetically solved families of white European ancestry. These are shares
    of selected PCD cohorts, not population rates.
  evidence:
  - reference: PMID:22184204
    reference_title: "Mutations of DNAH11 in patients with primary ciliary dyskinesia with normal ciliary ultrastructure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 58 unrelated patients with PCD with normal ultrastructure, 13 (22%) had two (biallelic) mutations in DNAH11"
    explanation: DNAH11 share within the normal-ultrastructure group.

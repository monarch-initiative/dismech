name: Primary Ciliary Dyskinesia 7
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: primary ciliary dyskinesia 7
  term:
    id: MONDO:0012748
    label: primary ciliary dyskinesia 7
description: >-
  Primary ciliary dyskinesia 7 (CILD7) is the form of primary ciliary
  dyskinesia (PCD) caused by biallelic loss-of-function variants in DNAH11.
  DNAH11 encodes a beta-type heavy chain of the axonemal outer dynein arm. In
  human respiratory cilia it is found only in the proximal part of the
  axoneme, where it defines the proximal (type 1) outer dynein arm; its
  paralogue DNAH9 occupies the distal part.

  The hallmark of CILD7 is a ciliary ultrastructure that looks normal on
  standard transmission electron microscopy. Electron tomography and
  immunofluorescence show the real lesion: loss of DNAH11 and a partial
  reduction of outer dynein arm volume confined to the proximal cilium. The
  cilia are not immotile. They beat with a stiff, non-flexible,
  reduced-amplitude and often hyperkinetic (fast) pattern, and some patients
  have immotile cilia. Clearance fails all the same, giving chronic
  oto-sino-pulmonary disease and bronchiectasis. Neonatal respiratory
  distress is less common than in outer dynein arm defect PCD. The mouse
  orthologue is left-right dynein, mutated in the inversus viscerum (iv)
  mouse, and about half of patients have situs inversus.

  Because standard electron microscopy is normal, diagnosis depends on nasal
  nitric oxide, high-speed video microscopy, immunofluorescence and genetic
  testing. DNAH11 is one of the most common PCD genes in patients of
  European ancestry.
parents:
- Primary Ciliary Dyskinesia
- Ciliopathy
synonyms:
- CILD7
- ciliary dyskinesia, primary, 7
- primary ciliary dyskinesia 7 with or without situs inversus
- DNAH11-related primary ciliary dyskinesia
notes: >-
  MONDO cross-references this disease as OMIM 611884; 603339 is the DNAH11
  gene record. ClinGen classifies the DNAH11 relationship with this disease
  as Definitive (autosomal recessive). The original family reported that
  DNAH11 nonsense variants were compatible with normal male fertility, while
  the iv mouse has reduced sperm motility, so a human sperm phenotype is not
  asserted here.

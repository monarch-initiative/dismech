    reference_title: "Primary ciliary dyskinesia associated with normal axoneme ultrastructure is caused by DNAH11 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings support the view that DNAH11 mutations indeed cause PCD and KS"
    explanation: Confirmation of DNAH11 as a PCD gene in a multiplex family.
  - reference: PMID:22184204
    reference_title: "Mutations of DNAH11 in patients with primary ciliary dyskinesia with normal ciliary ultrastructure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations were novel and private."
    explanation: Allelic heterogeneity.
diagnosis:
- name: Nasal Nitric Oxide and High-Speed Video Microscopy
  description: >-
    Low nasal nitric oxide and the characteristic stiff, hyperkinetic beat on
    high-speed video microscopy are central to diagnosis, because standard
    electron microscopy is normal.
  evidence:
  - reference: PMID:35305968
    reference_title: "Analysis of the diagnosis of Japanese patients with primary ciliary dyskinesia using a conditional reprogramming culture."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In DNAH11-mutant cases with normal ultrastructure by TEM, the HSVA revealed stiff and hyperfrequent ciliary beating with low bending capacity in CRC-expanded cells, thereby supporting the diagnosis."
    explanation: HSVA supports the diagnosis when TEM is normal.
  - reference: PMID:27836958
    reference_title: "European Respiratory Society guidelines for the diagnosis of primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It focuses on clinical presentation, nasal nitric oxide, analysis of ciliary beat frequency and pattern by high-speed video-microscopy analysis, transmission electron microscopy, genotyping and immunofluorescence."
    explanation: The ERS diagnostic test panel.
- name: Transmission Electron Microscopy and Electron Tomography
  description: >-
    Standard TEM is normal and cannot confirm CILD7. Electron tomography
    detects the proximal outer dynein arm deficiency on existing diagnostic
    samples.
  evidence:
  - reference: PMID:29467202
    reference_title: "Primary ciliary dyskinesia with normal ultrastructure: three-dimensional tomography detects absence of DNAH11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advantageously, electron tomography can be used on existing diagnostic samples and establishes a structural abnormality where ultrastructural studies were previously normal."
    explanation: Tomography as an adjunct when TEM is normal.
- name: Immunofluorescence Staining for DNAH11
  description: >-
    Loss of DNAH11 from the proximal cilium on immunofluorescence supports
    the diagnosis.
  evidence:
  - reference: PMID:33589394
    reference_title: "Multifaceted analysis of Japanese cases of primary ciliary dyskinesia: Value of immunofluorescence for ciliary protein detection in patients with DNAH5 and DNAH11 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The loss of DNAH11 proteins at the proximal region of cilia was revealed by IF."
    explanation: Immunofluorescence finding in a DNAH11 patient.
- name: Genetic Testing
  description: >-
    Sequencing of DNAH11 establishes the diagnosis in patients with a PCD
    phenotype and normal ultrastructure.
  evidence:
  - reference: PMID:22184204
    reference_title: "Mutations of DNAH11 in patients with primary ciliary dyskinesia with normal ciliary ultrastructure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in DNAH11 are a common cause of PCD in patients without ciliary ultrastructural defects; thus, genetic analysis can be used to ascertain the diagnosis of PCD in this challenging group of patients."
    explanation: Role of genetic testing.
animal_models:
- name: inversus viscerum (iv) Dnah11 mutant mouse
  species: Mouse
  genotype: Dnah11 (lrd) iv/iv homozygous
  publication: PMID:22102620
  description: >-
    The iv mouse carries a mutation in left-right dynein, the Dnah11
    orthologue. Homozygotes have randomized situs, immotile tracheal cilia
    with normal ultrastructure, reduced sperm motility, rhinitis, sinusitis
    and otitis media that worsen with age.
  modeled_mechanisms:
  - target: Randomization of Left-Right Body Asymmetry
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Situs inversus in half of homozygotes.
    evidence:
    - reference: PMID:9353118
      reference_title: "Mutation of an axonemal dynein affects left-right asymmetry in inversus viscerum mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The allelic mouse mutations inversus viscerum (iv) and legless (lgl) produce LR inversion, or situs inversus, in half of live-born homozygotes."
      explanation: Laterality phenotype of the mutant.
    - reference: PMID:9353118
      reference_title: "Mutation of an axonemal dynein affects left-right asymmetry in inversus viscerum mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we report the positional cloning of an axonemal dynein heavy-chain gene, left/right-dynein (lrd), that is mutated in both lgl and iv."
      explanation: The mutated gene is the DNAH11 orthologue.
  - target: Stiff Hyperkinetic Ciliary Beating with Reduced Bending
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Normal ultrastructure with abnormal motility, but cilia are static rather than hyperkinetic.
    limitations: >-
      Mouse tracheal cilia are immotile, whereas most human DNAH11 patients
      have hyperkinetic cilia; the static pattern matches only a minority of
      patients.
    evidence:
    - reference: PMID:22102620
      reference_title: "Static respiratory cilia associated with mutations in Dnahc11/DNAH11: a mouse model of PCD."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrated immotile tracheal cilia with normal ultrastructure and reduced sperm motility in the Dnahc11(iv) mouse."
      explanation: Normal ultrastructure with abnormal motility in the mouse.
  - target: Impaired Mucociliary Clearance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Rhinitis, sinusitis and otitis media.
    evidence:
    - reference: PMID:22102620
      reference_title: "Static respiratory cilia associated with mutations in Dnahc11/DNAH11: a mouse model of PCD."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This is accompanied by gross rhinitis, sinusitis, and otitis media, all indicators of human PCD."
      explanation: Upper airway disease in the mouse.
treatments:
- name: Airway Clearance and Chronic Infection Management
  description: >-
    There is no treatment that restores ciliary function. Management is the
    supportive care used across primary ciliary dyskinesia: airway clearance,
    prompt treatment of respiratory infections, and macrolide prophylaxis,
    for which a randomized trial of azithromycin in PCD reduced pulmonary
    exacerbations. Nothing in it is specific to DNAH11. The cilia still move,
    but clearance fails, so the same airway care applies as in immotile-cilia
    PCD.

    Curated as a single scoping entry rather than an itemised regimen,
    because no trial has enrolled by genotype and the umbrella
    Primary_Ciliary_Dyskinesia entry holds the detailed management block.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Mucociliary Clearance
    description: >-
      Airway clearance techniques substitute mechanically for the mucociliary
      transport the abnormally beating cilia cannot provide. They do not
      restore ciliary function.
  evidence:
  - reference: PMID:38891105
    reference_title: "Primary Ciliary Dyskinesia: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Though there are no PCD-specific approved therapies that restore ciliary function, routine airway clearance and aggressive management of infections are important to preserve lung health and minimize complications"
    explanation: >-
      The supportive management used across PCD. Applied to DNAH11 disease by
      inference, since no genotype-stratified treatment evidence exists.
  - reference: PMID:38891105
    reference_title: "Primary Ciliary Dyskinesia: A Clinical Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "A European study found that people with PCD benefitted from treatment with thrice weekly azithromycin, with decreased pulmonary exacerbation rates and without an apparent increase in antibiotic resistance"
    explanation: >-
      The review's summary of a randomized trial in PCD, not stratified by
      genotype.
differential_diagnoses:
- name: Primary Ciliary Dyskinesia 3
  description: >-
    DNAH5 disease gives absent outer dynein arms on standard electron
    microscopy and immotile cilia.
- name: Primary Ciliary Dyskinesia 40
  description: >-
    DNAH9 encodes the distal beta heavy chain paralogue. Its loss removes
    distal outer arms, with mild respiratory disease and often normal nasal
    nitric oxide.

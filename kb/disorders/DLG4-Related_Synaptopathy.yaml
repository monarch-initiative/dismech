    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A large variety of seizure types was reported, although focal seizures were the most common."
    explanation: Characterizes the epileptic output of the circuit lesion in the largest epilepsy-focused cohort.
  - reference: PMID:35457207
    reference_title: "Neurodevelopmental Disorders Associated with PSD-95 and Its Interaction Partners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain magnetic resonance imaging (MRI) of the individuals with pathogenic DLG4 variants revealed that the structural brain abnormalities were diverse and nonspecific."
    explanation: Supports framing the circuit lesion as functional rather than a discrete structural malformation.
  downstream:
  - target: Sleep-Activated Epileptiform Encephalopathy (DEE-SWAS/ESES)
    description: >-
      In a subgroup, cortical hyperexcitability becomes sleep-potentiated and
      crosses into a continuous spike-wave encephalopathy.
    causal_link_type: DIRECT
  - target: Developmental Regression
    description: >-
      Regression also occurs in individuals who never develop ESES/DEE-SWAS, so
      circuit dysfunction has a route to skill loss that does not pass through
      the sleep-activated state.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neurodevelopmental Phenotypic Output
    description: >-
      Diffuse cortical circuit dysfunction manifests as the core cognitive,
      behavioural and motor phenotype.
    causal_link_type: DIRECT
- name: Sleep-Activated Epileptiform Encephalopathy (DEE-SWAS/ESES)
  biological_scale: TISSUE
  role: consequence
  description: >
    In about a quarter of individuals with DLG4-related epilepsy, epileptiform
    activity is massively potentiated by slow-wave sleep, producing
    encephalopathy related to status epilepticus during slow-wave sleep
    (ESES) / developmental epileptic encephalopathy with spike-wave activation
    during sleep (DEE-SWAS). This is a distinct circuit state, not merely more
    seizures: the abnormality is near-continuous sleep-activated spike-wave, and
    because the driving activity occurs in sleep it is invisible to a routine
    awake EEG. Sleep or 24-hour EEG is therefore the specific investigation this
    node motivates.
  biological_processes:
  - preferred_term: Chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Encephalopathy related to status epilepticus during slow-wave sleep (ESES)/developmental epileptic encephalopathy with spike-wave activation during sleep (DEE-SWAS) was diagnosed in >25% of the individuals."
    explanation: Quantifies the DEE-SWAS/ESES subgroup within the DLG4 epilepsy cohort.
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Occurrence of ESES/DEE-SWAS in DLG4-related synaptopathy requires proper investigation with sleep EEG."
    explanation: Supports the sleep-EEG surveillance implication that follows from the sleep-activated mechanism.
  downstream:
  - target: Developmental Regression
    description: >-
      Sleep-activated epileptiform encephalopathy drives loss of previously
      acquired verbal and motor skills; regression was observed in every
      individual with ESES/DEE-SWAS.
    causal_link_type: DIRECT
- name: Developmental Regression
  biological_scale: ORGANISM
  role: consequence
  description: >
    Loss of previously acquired verbal and/or motor skills, which converts an
    otherwise largely static developmental disorder into an actively regressive
    one and is the strongest determinant of cognitive outcome.

    This node is deliberately separate from the sleep-activated encephalopathy
    that most often drives it, because the evidence decouples them in both
    directions: regression occurred in every individual with ESES/DEE-SWAS but
    also in some who never developed it, so it has a second route from cortical
    circuit dysfunction that does not pass through the sleep-activated state.
    Regression is also not confined to childhood — intellectual regression
    without motor delay has been reported at age two, and cognitive regression
    with progressive dystonia in adulthood.
  evidence:
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regression in verbal and/or motor domains was observed in all individuals who suffered from ESES/DEE-SWAS, as well as some who did not."
    explanation: >-
      The sentence that both establishes the coupling to DEE-SWAS and shows it
      is not exclusive — the reason these are two nodes rather than one.
  - reference: PMID:37347881
    reference_title: DLG4-Related Synaptopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regression in motor development and/or language has been reported in about 40% of affected individuals."
    explanation: Quantifies regression across the disorder as a whole, not only within the epilepsy subgroup.
  downstream:
  - target: Neurodevelopmental Phenotypic Output
    description: >-
      Active regression subtracts from the developmental trajectory, worsening
      the cognitive and language outcome.
    causal_link_type: DIRECT
- name: Neurodevelopmental Phenotypic Output
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "excitatory_synapse_scaffold_disruption#Neurodevelopmental Phenotypic Output"
  description: >
    The clinical convergence point of the synaptopathy: early-onset global
    developmental delay, intellectual disability that is most often mild to
    moderate, autism spectrum disorder and attention deficit-hyperactivity
    disorder, together with hypotonia, movement disorders and sleep
    disturbance. The overlap with other synaptic-dysfunction neurodevelopmental
    disorders is what motivated the "synaptopathy" designation in the first
    place, and is why the clinical gestalt alone cannot establish the diagnosis.
  cell_types:
  - preferred_term: Glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:33597769
    reference_title: "DLG4-related synaptopathy: a new rare brain disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture was predominated by early onset global developmental delay, intellectual disability, autism spectrum disorder, and attention deficit-hyperactivity disorder, all of which point to a brain disorder."
    explanation: States the core clinical output of the mechanism in the founding cohort.

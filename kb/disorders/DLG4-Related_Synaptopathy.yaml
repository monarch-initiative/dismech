notes: >-
  Deep research: an Edison/Falcon run was attempted first, per the default in the
  initiate-new-disorder-creation skill, but the API returned HTTP 402 (Payment
  Required — account credits exhausted), so no Falcon report exists for this
  entry. Two other providers were run instead and both were used:
  research/DLG4-Related_Synaptopathy-deep-research-claude_code.md and
  research/DLG4-Related_Synaptopathy-deep-research-openscientist.md.

  NEC preflight against MONDO:0032919 returned PASS for both reports (claude_code:
  DLG4 mentioned 61 times, next gene DLG2 at 4; openscientist: DLG4 52, next PSD
  7; both report OMIM 618793, matching the MONDO xref).

  The claude_code report's own reference-validation block flagged
  `needs_review: true` over three identifiers, each triaged separately rather
  than as a block. Two are not cited here: DOI:10.1111/cge.14411 (malformed by a
  pasted URL suffix) and DOI:10.1073/pnas.1517045112 (a quote the validator
  could not substantiate). The deep-intronic case the malformed DOI referred to
  is cited instead by its PMID (PMID:37525972), fetched and verified
  independently.

  The third, PMC:PMC3546964 / PMID:23342049 (Yudowski et al. 2013, acute PSD-95
  inactivation destabilizes AMPA receptors), was flagged `off_topic` and that
  flag was reviewed and deliberately overridden after reading the paper. Per
  CLAUDE.md an off-topic flag is evidence, not a verdict; the flag fires because
  the paper shares little vocabulary with a clinical DLG4 report, not because it
  is irrelevant. It is in fact the cleanest loss-of-function test of the
  receptor-anchoring claim in this entry — acute photoinactivation strips
  surface AMPA receptors within minutes while sparing NMDA and transferrin
  receptors — so it IS cited, on the Impaired Glutamate Receptor Anchoring node.

  The openscientist report validated clean (14/14 references resolved, no
  unsupported quotes, no off-topic flags).

  Two claims from the reports were checked and rejected. The claude_code report
  asserted that no human iPSC model of DLG4-related synaptopathy had been
  published — out of date, since PMID:42462545 reports the patient-derived
  AOUMEYi004-A line, curated here under experimental_models. The openscientist
  report stated that germline mosaicism is "not specifically documented" in this
  disorder — also out of date, since PMID:42482343 confirms paternal germline
  mosaicism at 3.83% allele frequency in sperm DNA, curated here under
  inheritance.

  Reference-cache scoping: several caches added in this change were fetched
  during the two deep-research reference-validation passes and are deliberately
  not cited. DOI:10.1111/cge.13243, DOI:10.1111/epi.17876 and
  DOI:10.1111/cge.14411 are DOI-keyed duplicates of PMID:29460436,
  PMID:38135915 and PMID:37525972 respectively, which are cited by PMID.
  DOI:10.1073/pnas.1517045112 is the PNAS MAGUK paper whose quote the
  claude_code report could not substantiate, and is not used. PMID:15638945 and
  PMID:8793296 (Drosophila dlg) are invertebrate background, and PMID:18248606
  and PMID:20554866 are PSD-95-interactome studies not specific to this
  disorder; the entry cites primary DLG4 and mammalian PSD-95 literature in
  their place. Note that PMID:23342049 is NOT in this unused set — despite its
  off-topic flag it is cited, for the reason given above.

  Datasets: `just discover-datasets DLG4-Related_Synaptopathy` returned 12
  candidates, all tagged DIRECT, and every one of them failed relevance triage —
  they matched on the generic phrase "intellectual developmental" and concern
  other genes entirely (ZMIZ1, HNRNPH2, KAT6A, UNC5C and others). This is the
  Named Entity Confusion failure mode reached through dataset search that
  CLAUDE.md warns about, so no `datasets:` block is curated here rather than
  recording an accession that resolves but is about a different disease. No
  DLG4- or PSD-95-specific repository accession surfaced.

  Two further items from the openscientist report are recorded in prose rather
  than as evidence because no citable snippet supports them: the gnomAD
  constraint metrics for DLG4 (pLI = 1.0, LOEUF = 0.14), which appear in the
  trigger-node description as "among the most loss-of-function-intolerant genes
  in the genome" without a reference; and a reported ~33% frequency of cerebellar
  vermis atrophy on MRI, which is not traceable to any source retrievable into
  the reference cache and is therefore omitted entirely rather than curated as an
  imaging finding.

  Frequency discipline: GeneReviews' full Clinical Characteristics tables report
  per-feature percentages that the cached PubMed abstract does not carry, so
  `frequency:` bands here are asserted only where the cached abstract (or the
  Kassabian epilepsy cohort abstract) is itself quantitative or uses an explicit
  frequency word, per docs/frequency-evidence-guidelines.md. Several features
  that the deep-research report gave percentages for (ASD 56%, ADHD 57%, anxiety
  53%, marfanoid habitus ~24%) are curated without a frequency band because those
  numbers trace to the GeneReviews chapter body rather than to any quotable
  cached source.
prevalence:
- population: Worldwide, individuals ascertained by exome or genome sequencing
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence study exists. The founding cohort assembled 53
    individuals through GeneMatcher; a later multicenter epilepsy-focused series
    added 35 individuals with a DLG4 variant and epilepsy. Case counts, not a
    denominator-based rate.
  evidence:
  - reference: PMID:33597769
    reference_title: "DLG4-related synaptopathy: a new rare brain disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present the clinical and genetic features of 53 patients (42 previously unpublished) with DLG4 variants."
    explanation: Establishes the size of the founding published cohort, the basis for describing the disorder as ultra-rare.
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We included 35 individuals with a DLG4 variant and epilepsy as part of a multicenter study."
    explanation: The later multicenter epilepsy series, the second-largest published case collection.
progression:
- phase: Infancy and early childhood
  age_range: First years of life
  notes: >-
    Presentation is with early-onset global developmental delay; the disorder is
    recognized through the developmental trajectory rather than through any
    congenital malformation, and neither the facial gestalt nor brain MRI is
    specific enough to prompt the diagnosis at this stage.
  evidence:
  - reference: PMID:33597769
    reference_title: "DLG4-related synaptopathy: a new rare brain disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture was predominated by early onset global developmental delay, intellectual disability, autism spectrum disorder, and attention deficit-hyperactivity disorder, all of which point to a brain disorder."
    explanation: Establishes early onset of the global developmental delay that opens the course.
- phase: Childhood - epilepsy and the regression window
  age_range: Childhood, with epilepsy onset typically in mid-childhood
  notes: >-
    About half of individuals develop epilepsy, and a subgroup develop the
    sleep-activated DEE-SWAS/ESES pattern. This is the critical window: verbal
    and/or motor regression occurs in every individual who develops ESES/DEE-SWAS
    and in some who do not, so an otherwise static developmental disorder becomes
    actively regressive here. Regression can present in the intellectual domain
    alone, as early as age two.
  evidence:
  - reference: PMID:38135915
    reference_title: Developmental epileptic encephalopathy in DLG4-related synaptopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regression in verbal and/or motor domains was observed in all individuals who suffered from ESES/DEE-SWAS, as well as some who did not."
    explanation: Defines the regression window and its tight coupling to the sleep-activated encephalopathy.
  - reference: PMID:38182567
    reference_title: "A novel DLG4 variant causes DLG4-related synaptopathy with intellectual regression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual regression without motor delay was observed at 2 years of age, and she was diagnosed with autism spectrum disorder and attention-deficit/hyperactivity disorder."
    explanation: Documents how early, and how selectively, the regression can present.
- phase: Adulthood
  age_range: Adulthood
  notes: >-
    Survival into adulthood is documented and the disorder is not known to
    shorten life expectancy, but the adult phenotype is poorly characterized
    because genetic testing was historically not offered to adults — diagnoses
    made fourteen years after presentation are on record. Late cognitive
    regression and progressive generalised dystonia have both been reported in
    adults, so the course is not reliably static after childhood.
  evidence:
  - reference: PMID:42551111
    reference_title: "Intellectual disability, neuroregression and adult-onset progressive dystonia due to a DLG4 pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 34-year-old male with childhood developmental delay, severe intellectual disability in adulthood, episodes of agitation with a previous diagnosis of schizoaffective disorder and adult-onset cognitive regression who developed progressive generalised dystonia due to a de novo DLG4 pathogenic loss-of-function variant."
    explanation: Documents an adult-onset regressive and dystonic course, the evidence against assuming a static adult phase.
  - reference: PMID:40444229
    reference_title: "Late-onset diagnosis of SHINE syndrome in an adolescent with developmental delay: Case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen years after the initial presentation, additional genetic testing revealed a de-novo mutation in the DLG4 gene, confirming a diagnosis of SHINE syndrome."
    explanation: Documents the diagnostic delay that leaves the older phenotype under-ascertained.
inheritance:
- name: Autosomal dominant, almost always de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  de_novo_rate: >-
    The great majority of pathogenic DLG4 variants arise de novo; in the founding
    53-patient cohort the majority of the 45 distinct variants occurred de novo,
    with four of unknown origin. Rare transmission from a heterozygous or mosaic
    parent is documented, and paternal germline mosaicism has now been confirmed
    molecularly in sperm DNA.
  description: >-
    Heterozygous DLG4 loss-of-function variants act in a dominant,
    dosage-sensitive manner; the other DLG-MAGUK paralogs (DLG1/SAP97,
    DLG2/PSD-93, DLG3/SAP102) do not compensate for the missing PSD-95 allele.
  evidence:
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DLG4-related synaptopathy is an autosomal dominant disorder typically caused by a de novo pathogenic variant."
    explanation: GeneReviews states the inheritance pattern and the predominance of de novo origin.
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rarely, individuals diagnosed with DLG4-related synaptopathy inherited a DLG4 pathogenic variant from a heterozygous or mosaic parent."
    explanation: Documents the rare inherited and parental-mosaic route, which sets the recurrence risk counseling.
  - reference: PMID:42482343
    reference_title: "A Synonymous DLG4 Variant (c.771G>A) Causes Exon 9 Skipping via Paternal Germline Mosaicism in DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant was present at 3.83% variant allele frequency in paternal sperm, establishing paternal germline mosaicism as the origin."
    explanation: First molecular confirmation of parental germline mosaicism in this disorder, quantifying a previously inferred recurrence mechanism.
pathophysiology:
- name: DLG4 Loss of Function and PSD-95 Haploinsufficiency
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "excitatory_synapse_scaffold_disruption#Postsynaptic Scaffold Disruption"
  description: >
    A heterozygous protein-truncating variant (nonsense, frameshift, canonical
    splice-site) — or a synonymous, deep-intronic or missense variant that
    disrupts splicing or protein folding — halves the functional dose of PSD-95,
    the prototypic MAGUK scaffold of the excitatory postsynaptic density. The
    endpoint that is actually measured is reduced PSD-95 protein; the route to it
    is allele-dependent and should not be assumed. Truncating alleles in the body
    of the transcript are conventionally expected to be cleared by
    nonsense-mediated decay, but the one DLG4 allele for which this has been
    tested directly — the GK-domain frameshift V692Wfs*12 — escapes decay and
    still yields less protein, so degradation of the transcript is not a
    prerequisite for haploinsufficiency here. Any surviving protein product lacks
    one or more of the PDZ, SH3 and guanylate-kinase domains through which PSD-95
    organizes the postsynaptic density. Because the paralogous DLG-MAGUKs do not
    compensate, the single remaining wild-type allele is insufficient; DLG4's
    position among the most loss-of-function-intolerant genes in the genome is the
    population-genetic footprint of that fact, not its cause.
  cell_types:
  - preferred_term: Glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:
  - preferred_term: Synapse assembly
    term:
      id: GO:0007416
      label: synapse assembly
    modifier: DECREASED
  - preferred_term: Glutamate receptor signaling pathway
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: DECREASED
  molecular_functions:
  - preferred_term: PSD-95 scaffolding of the postsynaptic density
    term:
      id: GO:0098919
      label: structural constituent of postsynaptic density
    modifier: DECREASED
  cellular_components:
  - preferred_term: Postsynaptic density
    term:
      id: GO:0014069
      label: postsynaptic density
  genetic_context:
    gene:
      preferred_term: DLG4
      term:
        id: hgnc:2903
        label: DLG4
    allele_type: SNV
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous, predominantly de novo loss-of-function alleles; six missense
      variants in the founding cohort localize to conserved PDZ2, PDZ3 and GK
      domains and are predicted to destabilize the domain or alter its surface
      charge rather than to abolish a canonical PDZ binding pocket.
  evidence:
  - reference: PMID:33597769
    reference_title: "DLG4-related synaptopathy: a new rare brain disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 45 different DLG4 variants, 39 were predicted to lead to loss of protein function and the majority occurred de novo (four with unknown origin)."
    explanation: Establishes loss of function as the dominant variant class and de novo occurrence as the rule.
  - reference: PMID:35457207
    reference_title: "Neurodevelopmental Disorders Associated with PSD-95 and Its Interaction Partners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Majority of the DLG4 variants are predicted to lead to haploinsufficiency of PSD-95 resulting in a brain disorder, which suggests that the other members of the DLG subfamily are unable to compensate for PSD-95, as could have been expected."
    explanation: >-
      States the haploinsufficiency mechanism and the failure of paralog
      compensation that makes a single lost allele pathogenic. evidence_source
      OTHER: this is a narrative review's synthesis, not a primary measurement.
  - reference: PMID:29460436
    reference_title: "Truncating variants of the DLG4 gene are responsible for intellectual disability with marfanoid features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gene expression studies supported their pathogenicity through haploinsufficiency and loss-of-function."
    explanation: Expression studies in the original discovery families directly support haploinsufficiency rather than a dominant-negative effect.
  - reference: PMID:33597769
    reference_title: "DLG4-related synaptopathy: a new rare brain disorder."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "The six missense variants identified were suggested to lead to structural or functional changes by protein modeling studies."
    explanation: >-
      Supports the missense arm only indirectly — the structural consequence is
      inferred from molecular-dynamics modeling, not measured, so the
      loss-of-function assignment for missense alleles remains provisional.
  downstream:
  - target: Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
    description: >-
      Reduced PSD-95 dose lowers the scaffold's capacity to cluster and retain
      ionotropic glutamate receptors and their auxiliary subunits.
    causal_link_type: DIRECT
- name: Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
  biological_scale: MOLECULAR
  role: central_effector
  conforms_to: "excitatory_synapse_scaffold_disruption#Excitatory Postsynaptic Structural Deficit"
  description: >
    PSD-95 clusters in postsynaptic nanodomains where its PDZ1-2 supermodule
    binds the C-terminal PDZ-binding motifs of NMDA-receptor GluN2 subunits and
    of TARP/stargazin, the auxiliary subunit that tethers AMPA receptors, while
    PDZ3 binds neuroligin-1 and the LGI1-ADAM22 complex. Losing PSD-95 dose
    fragments the postsynaptic density, reduces its size, and destabilizes AMPA
    receptors at the synaptic membrane, increasing the proportion of "silent"
    synapses that carry NMDA receptors but no functional AMPA receptors. The
    NMDA-receptor current is not simply lost but qualitatively altered, decaying
    more slowly with a greater GluN2B contribution — a shift toward an immature
    receptor complement.
  cell_types:
  - preferred_term: Cortical and hippocampal pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: AMPA receptor clustering at the postsynaptic density
    term:
      id: GO:0097113
      label: AMPA glutamate receptor clustering
    modifier: DECREASED
  - preferred_term: NMDA receptor clustering at the postsynaptic density
    term:
      id: GO:0097114
      label: NMDA glutamate receptor clustering
    modifier: DECREASED
  - preferred_term: Regulation of postsynaptic receptor levels
    term:
      id: GO:0099072
      label: regulation of postsynaptic membrane neurotransmitter receptor levels
    modifier: DECREASED
  - preferred_term: Postsynaptic density assembly
    term:
      id: GO:0097107
      label: postsynaptic density assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: Dendritic spine
    term:
      id: GO:0043197
      label: dendritic spine
  evidence:
  - reference: PMID:35457207
    reference_title: "Neurodevelopmental Disorders Associated with PSD-95 and Its Interaction Partners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This is in line with the observation that knockdown of PSD-95 leads to a fragmentation of the PSD."
    explanation: >-
      Statement that losing PSD-95 degrades the structural integrity of the
      postsynaptic density. evidence_source OTHER rather than IN_VITRO: the
      cited publication is a review reporting another group's knockdown result,
      not a paper presenting in-vitro data of its own.
  - reference: PMID:17148601
    reference_title: "Synapse-specific regulation of AMPA receptor function by PSD-95."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that the alpha-amino-3-hydroxy-5-methylisoxazole-4-propionic acid (AMPA)subtype of glutamate receptor (AMPAR)-mediated synaptic transmission was reduced in these mice."
    explanation: Complete PSD-95 knockout reduces AMPA-receptor-mediated transmission, the core receptor-anchoring deficit.
  - reference: PMID:17148601
    reference_title: "Synapse-specific regulation of AMPA receptor function by PSD-95."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, we report that the decay of NMDAR-mediated current was slower in KO mice: The contribution of NR2B subunit containing receptors to the NMDAR-mediated synaptic current was greater in KO mice."
    explanation: Shows the NMDA-receptor subunit complement shifts toward GluN2B when PSD-95 is absent, an anchoring rather than a purely quantitative defect.
  - reference: PMID:11082065
    reference_title: "PSD-95 involvement in maturation of excitatory synapses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PSD-95 expression enhanced postsynaptic clustering and activity of glutamate receptors."
    explanation: The reciprocal gain-of-dose experiment establishes that PSD-95 level sets glutamate-receptor clustering at the synapse.
  - reference: PMID:29169997
    reference_title: "PSD95: A synaptic protein implicated in schizophrenia or autism?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Postsynaptic density protein-95 (PSD-95) is a major regulator of synaptic maturation by interacting, stabilizing and trafficking N-methyl-d-aspartic acid receptors (NMDARs) and α-amino-3-hydroxy-5-methyl-4-isox-azoleproprionic acid receptors (AMPARs) to the postsynaptic membrane."
    explanation: >-
      Review statement of the receptor stabilization and trafficking role that
      the haploinsufficient synapse loses; evidence_source OTHER because this is
      a narrative review rather than a primary study.
  - reference: PMID:23268962
    reference_title: "Impaired synaptic clustering of postsynaptic density proteins and altered signal transmission in hippocampal neurons, and disrupted learning behavior in PDZ1 and PDZ2 ligand binding-deficient PSD-95 knockin mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The KI mice showed decreased accumulation of mutant PSD-95, PSD-93 and AMPA receptor subunits in the PSD fraction of the hippocampus."
    explanation: >-
      A domain-specific knock-in shows that disabling only the PDZ1/2 ligand
      interaction is sufficient to strip AMPA-receptor subunits out of the
      postsynaptic density, isolating the anchoring function.
  - reference: PMID:23342049
    reference_title: "Acute inactivation of PSD-95 destabilizes AMPA receptors at hippocampal synapses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, acute inactivation of PSD-95 in rat hippocampal cultures rapidly reduced surface AMPA receptor immunostaining, but did not affected NMDA or transferrin receptor localization."
    explanation: >-
      The cleanest loss-of-function test of the anchoring claim: acutely
      destroying PSD-95 strips surface AMPA receptors within minutes while
      sparing NMDA and control receptors, so the deficit follows directly from
      losing the scaffold rather than from developmental compensation.
  downstream:
  - target: Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
    description: >-
      A destabilized receptor complement changes the rules and the set point of
      activity-dependent plasticity at glutamatergic synapses.
    causal_link_type: DIRECT
  - target: Impaired Functional Maturation of Excitatory Synapses
    description: >-
      The same scaffold deficit leaves excitatory synapses structurally and
      functionally immature during the period of synaptogenesis.
    causal_link_type: DIRECT
- name: Impaired Functional Maturation of Excitatory Synapses
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "excitatory_synapse_scaffold_disruption#Excitatory Postsynaptic Structural Deficit"
  description: >
    PSD-95 level is instructive, not merely permissive, for excitatory synapse
    maturation: raising it drives glutamatergic synapses to maturity, enhances
    presynaptic terminal maturation transsynaptically, and increases the number
    and size of dendritic spines. Halving it therefore leaves a developing
    cortex with fewer functionally mature excitatory synapses during the window
    of synaptogenesis.

    The maturation failure is functional and is explicitly dissociated from
    spine morphology, which is the single most important caveat on this node. In
    the complete knockout the functionally silent synapses sit on
    morphologically mature spines, and PSD-95 mutant mice show unaffected
    synaptic morphology — so this entry deliberately does not assert a
    dendritic-spine-development deficit, and a negative spine-imaging result in
    a DLG4 model or patient neuron would not count against the node.
  cell_types:
  - preferred_term: Cortical and hippocampal pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: Synapse assembly
    term:
      id: GO:0007416
      label: synapse assembly
    modifier: DECREASED
  - preferred_term: Glutamate receptor signaling pathway
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:11082065
    reference_title: PSD-95 involvement in maturation of excitatory synapses.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that overexpression of PSD-95 in hippocampal neurons can drive maturation of glutamatergic synapses."
    explanation: >-
      Establishes PSD-95 dose as instructive for excitatory synapse maturation.
      Note the direction: this is a gain-of-dose experiment, so it constrains the
      dose-response relationship rather than measuring the haploinsufficient state.
  - reference: PMID:17148601
    reference_title: Synapse-specific regulation of AMPA receptor function by PSD-95.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, we report that the decay of NMDAR-mediated current was slower in KO mice: The contribution of NR2B subunit containing receptors to the NMDAR-mediated synaptic current was greater in KO mice."
    explanation: >-
      Loss-of-function direction: the receptor complement shifts toward the
      GluN2B-dominated configuration characteristic of immature synapses, which
      is what "functional immaturity" means here.
  - reference: PMID:29169997
    reference_title: "PSD95: A synaptic protein implicated in schizophrenia or autism?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In this review, we describe the role of PSD-95 as an essential scaffolding protein during synaptogenesis and neurodevelopment."
    explanation: >-
      Frames PSD-95 as essential specifically during synaptogenesis and
      neurodevelopment, the developmental window in which the haploinsufficiency
      acts; evidence_source OTHER because this is a narrative review.
  - reference: PMID:29460436
    reference_title: Truncating variants of the DLG4 gene are responsible for intellectual
      disability with marfanoid features.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "PSD-95 probably participates in dendritogenesis."
    explanation: >-
      The DLG4 discovery paper invokes dendritogenesis, but hedges ("probably"),
      so this supports the claim only weakly on the human side.
  - reference: PMID:9853749
    reference_title: Enhanced long-term potentiation and impaired learning in mice with
      mutant postsynaptic density-95 protein.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Synaptic NMDA-receptor currents, subunit expression, localization and synaptic morphology are all unaffected in the mutant mice."
    explanation: >-
      Refutes any structural reading of this node: PSD-95 mutant mice show
      unaffected synaptic morphology, so the maturation deficit curated here must
      be understood as functional rather than morphological.
  - reference: PMID:17148601
    reference_title: Synapse-specific regulation of AMPA receptor function by PSD-95.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Unexpectedly, the silent synapses in the KO mouse were located onto morphologically mature spines."
    explanation: >-
      Independently refutes a spine-morphology reading: the functionally silent
      synapses sit on spines that look mature, which is why no dendritic-spine
      GO term with a DECREASED modifier is asserted on this node.
  downstream:
  - target: Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
    description: >-
      An immature excitatory synapse population cannot support normal
      activity-dependent plasticity.
    causal_link_type: DIRECT
- name: Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "excitatory_synapse_scaffold_disruption#Impaired Synaptic Plasticity and Excitatory-Inhibitory Imbalance"
  description: >
    PSD-95 couples the NMDA receptor to the machinery that decides whether a
    given firing pattern potentiates or depresses a synapse. Without it, the
    frequency-response function of NMDA-dependent long-term potentiation and
    depression is shifted, producing strikingly enhanced LTP across stimulation
    frequencies rather than a simple loss of plasticity — a bidirectional
    learning rule broken in the direction of over-potentiation. The
    excitation-inhibition framing is an inference rather than a measurement in
    this disorder: the studies cited here quantified glutamatergic transmission
    and plasticity only, and none of them measured GABAergic transmission
    alongside it. PSD-95 is confined to excitatory synapses, so a shifted set
    point is the expected consequence, but a comparable inhibitory deficit has
    not been excluded.
  cell_types:
  - preferred_term: Glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:
  - preferred_term: Long-term synaptic potentiation
    term:
      id: GO:0060291
      label: long-term synaptic potentiation
    modifier: DYSREGULATED
  - preferred_term: Regulation of synaptic plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
    modifier: DYSREGULATED
  - preferred_term: Glutamatergic synaptic transmission
    term:
      id: GO:0035249
      label: synaptic transmission, glutamatergic
    modifier: DECREASED
  evidence:
  - reference: PMID:9853749
    reference_title: "Enhanced long-term potentiation and impaired learning in mice with mutant postsynaptic density-95 protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mutant mice lacking PSD-95, the frequency function of NMDA-dependent LTP and LTD is shifted to produce strikingly enhanced LTP at different frequencies of synaptic stimulation."
    explanation: The defining plasticity phenotype of PSD-95 loss — a shifted bidirectional learning rule, not simply absent plasticity.
  - reference: PMID:9853749
    reference_title: "Enhanced long-term potentiation and impaired learning in mice with mutant postsynaptic density-95 protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PSD-95 thus appears to be important in coupling the NMDA receptor to pathways that control bidirectional synaptic plasticity and learning."
    explanation: States the mechanistic role of PSD-95 as the coupler between NMDA receptor and plasticity machinery.
  - reference: PMID:23268962
    reference_title: "Impaired synaptic clustering of postsynaptic density proteins and altered signal transmission in hippocampal neurons, and disrupted learning behavior in PDZ1 and PDZ2 ligand binding-deficient PSD-95 knockin mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the hippocampal CA1 region of young KI mice, basal synaptic efficacy was reduced and long-term potentiation (LTP) was enhanced with intact long-term depression."
    explanation: >-
      Independently reproduces the paradoxical pattern — reduced basal
      excitatory efficacy with enhanced LTP — in a PDZ1/2 ligand-binding-deficient
      knock-in, showing it follows from lost receptor anchoring rather than from
      the particular null allele.
  downstream:
  - target: Cortical Network Dysfunction and Hyperexcitability
    description: >-
      Synapse-level plasticity failure and a shifted E/I set point aggregate
      into abnormal cortical circuit assembly and network excitability.
    causal_link_type: DIRECT
- name: Cortical Network Dysfunction and Hyperexcitability
  biological_scale: TISSUE
  role: consequence
  conforms_to: "excitatory_synapse_scaffold_disruption#Circuit-Level Dysfunction"
  description: >
    Aggregated synaptic deficits produce diffuse, bilateral cortical and
    hippocampal circuit dysfunction. Structural imaging is deliberately
    unhelpful here: brain MRI in individuals with pathogenic DLG4 variants shows
    abnormalities that are diverse and nonspecific, so the circuit lesion is
    functional rather than a visible malformation. In roughly half of
    individuals the shifted excitation-inhibition set point crosses into frank
    epileptogenesis, with a wide range of seizure types of which focal seizures
    are the most common.
  cell_types:
  - preferred_term: Cortical and hippocampal pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  locations:
  - preferred_term: Neocortex
    term:
      id: UBERON:0001950
      label: neocortex
  - preferred_term: Hippocampal formation
    term:
      id: UBERON:0002421
      label: hippocampal formation
  biological_processes:

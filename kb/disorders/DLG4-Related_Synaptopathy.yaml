name: DLG4-Related Synaptopathy
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- intellectual developmental disorder 62
- intellectual developmental disorder, autosomal dominant 62
- MRD62
- IDDA62
- SHINE syndrome
- DLG4 synaptopathy
- PSD-95 haploinsufficiency
- intellectual disability with marfanoid features
description: >
  DLG4-related synaptopathy is a rare autosomal dominant neurodevelopmental
  disorder caused by heterozygous, almost always de novo, loss-of-function
  variants in DLG4, the gene encoding postsynaptic density protein 95 (PSD-95).
  PSD-95 is the prototypic and most abundant membrane-associated guanylate
  kinase (MAGUK) scaffold of the excitatory postsynaptic density, where its
  three PDZ domains plus SH3 and guanylate-kinase-like domains organize NMDA
  receptors, TARP/stargazin-coupled AMPA receptors, Kv1 channels, neuroligins
  and the LGI1-ADAM22 complex into transsynaptic nanocolumns. Reduced PSD-95
  dosage degrades that scaffold, impairs glutamate-receptor anchoring and
  activity-dependent synaptic plasticity, and yields a neurodevelopmental
  phenotype dominated by global developmental delay, intellectual disability
  (most often mild to moderate), autism spectrum disorder and ADHD, with
  epilepsy in about half of individuals.

  The condition is indexed in OMIM as 618793 "intellectual developmental
  disorder, autosomal dominant 62" (MRD62) and in MONDO as MONDO:0032919
  "intellectual developmental disorder 62" — serial-numbered labels that carry
  no mechanistic information. This entry uses
  the gene-anchored clinical name "DLG4-related synaptopathy" coined by
  Rodríguez-Palmero et al. (2021) — the name used by the GeneReviews chapter and
  by the subsequent literature — and retains the OMIM/MONDO label plus the
  patient-community acronym SHINE (Sleep disturbances, Hypotonia, Intellectual
  disability, Neurologic disorder, Epilepsy) as synonyms.

  The clinically most consequential complication is a developmental and
  epileptic encephalopathy with spike-wave activation in sleep
  (DEE-SWAS/ESES), which affects roughly a quarter of the epilepsy subgroup and
  is tightly coupled to motor and language regression.

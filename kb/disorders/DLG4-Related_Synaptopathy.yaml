genetic:
- name: DLG4
  gene_term:
    preferred_term: DLG4
    term:
      id: hgnc:2903
      label: DLG4
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: DE_NOVO
  notes: >-
    DLG4 (17p13.1) encodes PSD-95, the prototypic and most abundant DLG-family
    MAGUK of the excitatory postsynaptic density. It is the sole established
    causal gene for this disorder. Reported variant classes span nonsense,
    frameshift, canonical splice-site, missense, synonymous splice-disrupting
    and deep-intronic pseudoexon-activating alleles; no pathogenic
    gene-level copy-number variants have been reported.
  evidence:
  - reference: PMID:33597769
    reference_title: "DLG4-related synaptopathy: a new rare brain disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postsynaptic density protein-95 (PSD-95), encoded by DLG4, regulates excitatory synaptic function in the brain."
    explanation: Establishes the gene-protein relationship and the protein's synaptic role.
  - reference: PMID:29460436
    reference_title: "Truncating variants of the DLG4 gene are responsible for intellectual disability with marfanoid features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only DLG4 gene met these criteria."
    explanation: >-
      In the exome study of 64 marfanoid-habitus intellectual-disability
      probands, DLG4 was the single gene meeting the recurrent-truncating-variant
      discovery criteria, establishing the gene-disease link.
  - reference: PMID:35457207
    reference_title: "Neurodevelopmental Disorders Associated with PSD-95 and Its Interaction Partners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only six missense variants, all localizing to the highly conserved functional domains of PSD-95, have been reported."
    explanation: Characterizes the missense minority and its localization to conserved domains.
variants:
- name: DLG4 c.2105+235C>T (deep intronic, pseudoexon-activating)
  gene:
    preferred_term: DLG4
    term:
      id: hgnc:2903
      label: DLG4
  type: SNV
  clinical_significance: PATHOGENIC
  description: >-
    A deep intronic variant identified by whole genome sequencing that generates
    two alternative DLG4 transcripts, one containing a pseudoexon; both are
    out-of-frame and predicted to truncate the protein. Notable because it is
    invisible to exome sequencing and because DLG4 mRNA proved detectable in
    peripheral blood, making an accessible-tissue RNA assay diagnostic.
  evidence:
  - reference: PMID:37525972
    reference_title: "A deep intronic DLG4 variant resulting in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both alternative transcripts are out-of-frame and predicted to result in protein-truncation, thereby establishing the genetic diagnosis for the proband."
    explanation: Establishes the pathogenic splice-disrupting consequence of the deep intronic variant.
- name: DLG4 c.771G>A p.(Ala257=) (synonymous, exon 9 skipping)
  gene:
    preferred_term: DLG4
    term:
      id: hgnc:2903
      label: DLG4
  type: SNV
  clinical_significance: PATHOGENIC
  description: >-
    A synonymous variant with previously conflicting ClinVar interpretations,
    shown by RNA sequencing and RT-PCR to cause complete exon 9 skipping with a
    resulting frameshift and premature termination codon. Its origin was
    paternal germline mosaicism, detected by high-depth amplicon sequencing of
    sperm DNA.
  evidence:
  - reference: PMID:42482343
    reference_title: "A Synonymous DLG4 Variant (c.771G>A) Causes Exon 9 Skipping via Paternal Germline Mosaicism in DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The synonymous DLG4 c.771G>A variant (absent in gnomAD) induced complete exon 9 skipping, resulting in a frameshift and premature termination codon."
    explanation: Functional RNA evidence resolving a synonymous variant as loss-of-function.
diagnosis:
- name: Molecular genetic testing for a heterozygous DLG4 pathogenic variant
  presence: PRESENT
  description: >-
    The diagnosis is genotype-first. The clinical picture overlaps other
    synaptopathies too closely to be diagnostic on its own, so a multigene
    intellectual-disability/epilepsy panel or exome/genome sequencing is the
    appropriate test. RNA studies should be considered for synonymous, missense
    or intronic variants of uncertain splicing consequence, and DLG4 mRNA is
    detectable in peripheral blood, so an accessible-tissue assay is feasible.
  evidence:
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DLG4-related synaptopathy is established in a proband with suggestive clinical findings and a heterozygous pathogenic variant in DLG4 identified by molecular genetic testing."
    explanation: GeneReviews states the diagnostic criterion.
  - reference: PMID:37525972
    reference_title: "A deep intronic DLG4 variant resulting in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By using reverse-transcription PCR on RNA derived from peripheral blood, we demonstrate that DLG4 mRNA expression is detectable in blood and the deep intronic variant gives rise to two alternative DLG4 transcripts, one of which includes a pseudoexon."
    explanation: Supports blood RNA testing as a practical route for resolving splice-uncertain DLG4 variants.
  - reference: PMID:40444229
    reference_title: "Late-onset diagnosis of SHINE syndrome in an adolescent with developmental delay: Case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourteen years after the initial presentation, additional genetic testing revealed a de-novo mutation in the DLG4 gene, confirming a diagnosis of SHINE syndrome."
    explanation: >-
      Illustrates the long diagnostic delay that follows from the non-specific
      clinical gestalt, and the reason genotype-first testing is recommended
      rather than waiting for a recognizable phenotype.
- name: Sleep or 24-hour EEG
  presence: PRESENT
  description: >-
    Because the DEE-SWAS/ESES pattern is activated by slow-wave sleep, a routine
    awake EEG can miss it. Sleep or 24-hour EEG is indicated in individuals with
    significant cognitive or behavioural delay, developmental regression, or an
    abnormal routine EEG.
  evidence:
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Occurrence of ESES/DEE-SWAS in DLG4-related synaptopathy requires proper investigation with sleep EEG."
    explanation: States the sleep-EEG requirement that follows from the sleep-activated mechanism.
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annually or as clinically indicated, ophthalmology evaluation; and 24-hour EEG in those with significant cognitive/behavioral delay, developmental regression, or abnormal routine EEG."
    explanation: GeneReviews surveillance recommendation specifying when 24-hour EEG is indicated.
treatments:
- name: Supportive and symptom-directed care
  description: >-
    There is no cure and no disease-modifying therapy. Management is entirely
    supportive: standard treatment of developmental delay and intellectual
    disability, epilepsy, migraine, ataxia, dystonia, refractive error,
    strabismus and cerebral visual impairment, delivered through a
    multidisciplinary surveillance-and-support model.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for DLG4-related synaptopathy. Supportive care includes standard treatment for developmental delay / intellectual disability, epilepsy, migraine, ataxia, dystonia, refractive errors, strabismus, and cerebral visual impairment."
    explanation: GeneReviews management statement, the basis for the supportive-care-only framing.
- name: Antiseizure medication
  description: >-
    Standard antiseizure pharmacotherapy tailored to seizure type. No
    DLG4-specific regimen has been established, and the epilepsy cohort study
    assessed medication response only retrospectively and by referring-clinician
    report, so drug-choice guidance rests on general epilepsy practice rather
    than on evidence specific to this gene.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Cortical Network Dysfunction and Hyperexcitability
    treatment_effect: INHIBITS
    description: >-
      Antiseizure medication suppresses the network hyperexcitability that
      generates seizures; it does not act on the upstream PSD-95 deficit.
  evidence:
  - reference: PMID:37347881
    reference_title: DLG4-Related Synaptopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for DLG4-related synaptopathy. Supportive care includes standard treatment for developmental delay / intellectual disability, epilepsy, migraine, ataxia, dystonia, refractive errors, strabismus, and cerebral visual impairment."
    explanation: >-
      GeneReviews states that epilepsy in this disorder is managed with standard
      epilepsy treatment — the management recommendation this treatment entry
      records.
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Antiseizure medication response was retrospectively assessed by the referring clinician."
    explanation: >-
      Kept only as the caveat it is: this is a Methods sentence, not a finding,
      and it is here to make explicit that the largest cohort's
      medication-response data are retrospective and clinician-reported, so no
      agent-specific claim can rest on them.
- name: Clozapine for treatment-resistant psychosis
  description: >-
    In a reported adolescent with DLG4-related synaptopathy and early-onset,
    treatment-resistant schizophrenia with catatonia, clozapine produced
    substantial improvement in positive and negative symptoms after three other
    antipsychotics had failed. This is a single case report and is not a
    treatment recommendation for the disorder.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clozapine
      term:
        id: CHEBI:3766
        label: clozapine
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Psychosis
    term:
      id: HP:0000709
      label: Psychosis
  evidence:
  - reference: PMID:37386468
    reference_title: "Significant improvement of psychotic symptoms in treatment-resistant schizophrenia with clozapine in an adolescent with SHINE syndrome: a case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "After failing three antipsychotic drug treatments, the patient was started on clozapine, which resulted in significant improvements in positive and negative symptoms."
    explanation: >-
      Single-patient evidence for clozapine responsiveness; graded PARTIAL
      because an uncontrolled n-of-1 observation cannot establish efficacy in
      the disorder.
- name: Behavioural therapy and pharmacotherapy for sleep disturbance
  description: >-
    Behavioural measures are first-line for insomnia, with pharmacotherapy
    reserved for refractory sleep disturbance.
  treatment_term:
    preferred_term: Sleep disorder therapy
    term:
      id: NCIT:C15541
      label: Sleep Disorder Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:

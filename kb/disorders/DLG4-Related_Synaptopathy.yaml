    term:
      id: HP:0002360
      label: Sleep disturbance
  evidence:
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behavioral therapy may aid those who have insomnia, while pharmacotherapy may be considered in those who have refractory sleep disturbance."
    explanation: GeneReviews sets out the stepped approach to sleep disturbance.
- name: Developmental, physical and speech therapy
  description: >-
    Early intervention and ongoing developmental, physical, occupational and
    speech therapies form the core of management for the developmental delay and
    intellectual disability, alongside monitoring of mobility and self-help
    skills.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:

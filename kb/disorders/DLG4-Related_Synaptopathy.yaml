    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At each visit, monitor those with seizures; assess for new manifestations such as seizures, changes in tone, movement disorders, and migraine headaches; monitor developmental progress and educational needs; assess mobility and self-help skills; and assess for signs/symptoms of sleep disturbance."
    explanation: >-
      GeneReviews surveillance recommendation covering developmental progress,
      educational needs and mobility, the domains these therapies address.
- name: Genetic counseling
  description: >-
    Counseling covers the autosomal dominant, predominantly de novo mechanism;
    the low-but-not-zero sibling recurrence risk from parental germline
    mosaicism, now molecularly confirmed in at least one family; and the
    availability of prenatal and preimplantation genetic testing once the
    familial variant is known.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, once a DLG4 pathogenic variant has been identified in an affected family member, prenatal and preimplantation genetic testing are possible."
    explanation: GeneReviews genetic-counseling statement on reproductive testing options.
  - reference: PMID:42482343
    reference_title: "A Synonymous DLG4 Variant (c.771G>A) Causes Exon 9 Skipping via Paternal Germline Mosaicism in DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings underscore the dual necessity of functional analysis for synonymous variants and sensitive mosaicism detection for accurate genetic counseling."
    explanation: Supports mosaicism testing as a component of recurrence-risk counseling in this disorder.
imaging_findings:
- name: Nonspecific structural brain abnormality on MRI
  modality: MRI
  laterality: BILATERAL
  description: >-
    Brain MRI is part of the diagnostic work-up of developmental delay in this
    disorder but is not diagnostic of it: the structural abnormalities reported
    across the cohort are diverse and nonspecific, consistent with a functional
    synaptic lesion rather than a recognizable malformation. Awake and sleep EEG
    carry the diagnostic weight instead.
  diagnostic: false
  evidence:
  - reference: PMID:35457207
    reference_title: "Neurodevelopmental Disorders Associated with PSD-95 and Its Interaction Partners."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain magnetic resonance imaging (MRI) of the individuals with pathogenic DLG4 variants revealed that the structural brain abnormalities were diverse and nonspecific."
    explanation: States that MRI findings in this disorder are heterogeneous and lack a specific pattern.
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data on awake and sleep electroencephalography (EEG) and/or video-polygraphy and brain magnetic resonance imaging were collected."
    explanation: Confirms MRI is routinely collected in this population alongside awake and sleep EEG.
animal_models:
- name: Dlg4 V692Wfs*12 heterozygous knock-in mouse (patient-derived SHINE allele)
  species: Mouse
  genotype: Dlg4 V692Wfs*12/+ (patient-derived frameshift allele)
  publication: PMID:42565830
  description: >-
    The genetically most faithful model available: a heterozygous knock-in of a
    patient frameshift allele associated with severe disease. The mutant
    transcript escapes nonsense-mediated decay yet still yields reduced PSD-95
    protein, reproducing the patient's molecular phenotype rather than a clean
    null. Behavioural phenotypes are partly sex-specific.
  modeled_mechanisms:
  - target: DLG4 Loss of Function and PSD-95 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Heterozygous patient allele producing reduced PSD-95 protein — the same
      genetic state and the same molecular endpoint as the human disorder.
    limitations: >-
      Models one specific severe frameshift allele; whether an allele that is
      degraded by nonsense-mediated decay behaves identically is untested.
    readouts:
    - name: PSD-95 protein abundance
      target: DLG4 Loss of Function and PSD-95 Haploinsufficiency
      direction: DECREASED
      interpretation: Reduced PSD-95 protein confirms the haploinsufficient molecular state.
      evidence:
      - reference: PMID:42565830
        reference_title: "A patient-derived mouse model reproduces molecular, neurological, and sleep symptoms of SHINE syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The mutant transcript escapes nonsense-mediated decay but results in reduced PSD-95 protein expression, faithfully reproducing the molecular phenotype observed in the patient."
        explanation: Reports the reduced PSD-95 protein measurement in the knock-in.
    evidence:
    - reference: PMID:42565830
      reference_title: "A patient-derived mouse model reproduces molecular, neurological, and sleep symptoms of SHINE syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we developed and characterized a mouse model of SHINE syndrome carrying the patient-derived DLG4V692Wfs*12/+ variant associated with a severe form of the disorder."
      explanation: Establishes the model as a heterozygous patient-allele knock-in, matching the human genetic state.
  - target: Neurodevelopmental Phenotypic Output
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces learning and cognitive-flexibility deficits and a fragmented
      sleep architecture reminiscent of the patient, with trends toward altered
      sensory processing and socialization.
    limitations: >-
      Several phenotypes appeared only in male mutants, and the social and
      sensory findings were trends rather than established effects. Spontaneous
      seizures were not observed, so the epilepsy arm of the human phenotype is
      not captured.
    readouts:
    - name: Learning and cognitive flexibility
      target: Neurodevelopmental Phenotypic Output
      direction: DECREASED
      interpretation: Behavioural correlate of the intellectual-disability phenotype, in male mutants.
      evidence:
      - reference: PMID:42565830
        reference_title: "A patient-derived mouse model reproduces molecular, neurological, and sleep symptoms of SHINE syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Male mutants showed deficits in learning and cognitive flexibility."
        explanation: Reports the cognitive readout and its sex specificity.
    - name: Sleep bout architecture
      target: Neurodevelopmental Phenotypic Output
      direction: ALTERED
      interpretation: Fragmented sleep, the model correlate of the human sleep-disturbance phenotype.
      evidence:
      - reference: PMID:42565830
        reference_title: "A patient-derived mouse model reproduces molecular, neurological, and sleep symptoms of SHINE syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Male mutants exhibited an increased proportion of short sleep bouts and compensatory longer average sleep bout length, suggesting sporadic sleep reminiscent of the patient."
        explanation: Reports the sleep-architecture measurement in the model.
    evidence:
    - reference: PMID:42565830
      reference_title: "A patient-derived mouse model reproduces molecular, neurological, and sleep symptoms of SHINE syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Dlg4V692Wfs*12/+ mice also demonstrate trends toward altered sensory processing and socialization."
      explanation: >-
        Supports the model as informative for the behavioural phenotype while
        showing the sensory and social arms are trends, not established effects.
  - target: Cortical Network Dysfunction and Hyperexcitability
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      No spontaneous seizures were observed in the heterozygous knock-in,
      despite epilepsy affecting about half of individuals with the human
      disorder.
    limitations: >-
      Provoked-seizure susceptibility was not tested, so this is a negative
      result for spontaneous seizures only and does not exclude a latent
      lowered seizure threshold.
    evidence:
    - reference: PMID:42565830
      reference_title: "A patient-derived mouse model reproduces molecular, neurological, and sleep symptoms of SHINE syndrome."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "While spontaneous seizures were not observed, future studies will test susceptibility to provoked seizures."
      explanation: >-
        Explicit negative result for the epilepsy arm in the most
        genotype-faithful model, and the authors' own statement that the
        provoked-seizure question remains open.
- name: Dlg4 null (PSD-95 knockout) mouse - autism-relevant behaviour
  species: Mouse
  genotype: Dlg4-/- (complete PSD-95 knockout), C57BL/6J congenic
  publication: PMID:20952458
  description: >-
    Complete PSD-95 null mouse phenotyped across repetitive, social, motor and
    anxiety-related behavioural domains, with dendritic-spine and forebrain
    synaptic-gene-expression correlates.
  modeled_mechanisms:
  - target: Neurodevelopmental Phenotypic Output
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Produces a behavioural profile spanning the autism-relevant, motor and
      anxiety domains seen in the human disorder.
    limitations: >-
      Homozygous null, so it models complete PSD-95 absence rather than the
      human heterozygous haploinsufficient state; homozygous deletion also
      adversely affected survival, imposing a survivor-selection bias absent
      from the human condition.
    evidence:
    - reference: PMID:20952458
      reference_title: "Association of mouse Dlg4 (PSD-95) gene deletion and human DLG4 gene variation with phenotypes relevant to autism spectrum disorders and Williams' syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings demonstrate that DLG4 gene disruption in mice produces a complex range of behavioral and molecular abnormalities relevant to autism spectrum disorders and Williams' syndrome."
      explanation: Establishes the null mouse as informative for the behavioural output of DLG4 disruption.
- name: PSD-95 mutant mouse - bidirectional plasticity and spatial learning
  species: Mouse
  genotype: PSD-95 mutant (guanylate kinase domain-truncating)
  publication: PMID:9853749
  description: >-
    The classic PSD-95 mutant used to define the plasticity phenotype: the
    NMDA-dependent LTP/LTD frequency-response is shifted toward enhanced LTP,
    with severely impaired spatial learning and intact synaptic NMDA-receptor
    currents, subunit expression, localization and synaptic morphology.
  modeled_mechanisms:
  - target: Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates that losing PSD-95 breaks the bidirectional plasticity rule
      and impairs learning, the mechanistic core of the human cognitive
      phenotype.
    limitations: >-
      This line expresses a truncated PSD-95 rather than being a complete null,
      and it is homozygous, so it does not model human heterozygous
      haploinsufficiency. Learning was assayed as rodent spatial learning, a
      distant proxy for human intellectual disability.
    readouts:
    - name: NMDA-dependent LTP/LTD frequency-response function
      target: Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
      direction: ALTERED
      interpretation: The plasticity set point is shifted toward potentiation rather than plasticity being lost.
      evidence:
      - reference: PMID:9853749
        reference_title: "Enhanced long-term potentiation and impaired learning in mice with mutant postsynaptic density-95 protein."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In mutant mice lacking PSD-95, the frequency function of NMDA-dependent LTP and LTD is shifted to produce strikingly enhanced LTP at different frequencies of synaptic stimulation."
        explanation: The electrophysiological measurement behind the plasticity node.
    - name: Spatial learning
      target: Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
      direction: DECREASED
      interpretation: Behavioural consequence of the shifted plasticity rule.
      evidence:
      - reference: PMID:9853749
        reference_title: "Enhanced long-term potentiation and impaired learning in mice with mutant postsynaptic density-95 protein."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In keeping with neural-network models that incorporate bidirectional learning rules, this frequency shift is accompanied by severely impaired spatial learning."
        explanation: Reports the learning deficit that accompanies the plasticity shift.
    evidence:
    - reference: PMID:9853749
      reference_title: "Enhanced long-term potentiation and impaired learning in mice with mutant postsynaptic density-95 protein."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "PSD-95 thus appears to be important in coupling the NMDA receptor to pathways that control bidirectional synaptic plasticity and learning."
      explanation: The authors' own statement of what the model establishes about PSD-95 function.
- name: PSD-95 complete knockout mouse - AMPA receptor and silent synapses
  species: Mouse
  genotype: PSD-95-/- (PDZ1-2 deletion, out-of-frame transcript)
  publication: PMID:17148601
  description: >-
    A complete PSD-95 null generated specifically to avoid the residual
    functional truncated protein of earlier lines; used to define the
    AMPA-receptor and silent-synapse phenotype in hippocampal CA1.
  modeled_mechanisms:
  - target: Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes that PSD-95 loss reduces AMPA-receptor-mediated transmission
      and slows NMDA-receptor current decay through a greater GluN2B
      contribution.
    limitations: >-
      Homozygous null rather than heterozygous; the authors also found a
      substantial population of synapses unaffected by the deletion, so the
      receptor-anchoring deficit is synapse-specific rather than global.
    readouts:
    - name: AMPA receptor-mediated synaptic transmission
      target: Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
      direction: DECREASED
      interpretation: Direct electrophysiological measure of failed AMPA-receptor anchoring.
      evidence:
      - reference: PMID:17148601
        reference_title: "Synapse-specific regulation of AMPA receptor function by PSD-95."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that the alpha-amino-3-hydroxy-5-methylisoxazole-4-propionic acid (AMPA)subtype of glutamate receptor (AMPAR)-mediated synaptic transmission was reduced in these mice."
        explanation: The AMPA-receptor transmission measurement in the complete knockout.
    evidence:
    - reference: PMID:17148601
      reference_title: "Synapse-specific regulation of AMPA receptor function by PSD-95."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Together, these results suggest a synapse-specific role for PSD-95 in controlling synaptic function that is independent of spine morphology."
      explanation: >-
        The authors' summary, which both supports the model's relevance to
        receptor anchoring and flags that the effect is synapse-specific.
- name: PSD-95 PDZ1/PDZ2 ligand-binding-deficient knock-in mouse
  species: Mouse
  genotype: PSD-95 PDZ1/PDZ2 ligand binding-deficient cDNA knock-in (homozygous)
  publication: PMID:23268962
  description: >-
    A domain-specific model that leaves PSD-95 present but unable to bind
    ligands through PDZ1/PDZ2 — the supermodule that docks NMDA-receptor GluN2
    subunits and TARP-coupled AMPA receptors. It therefore isolates the
    receptor-anchoring function from PSD-95 abundance, and is the closest
    available model for the minority of human missense alleles that fall in the
    PDZ domains.
  modeled_mechanisms:
  - target: Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Disabling PDZ1/2 ligand binding alone depletes PSD-95, PSD-93 and AMPA
      receptor subunits from the hippocampal postsynaptic density fraction.
    limitations: >-
      Homozygous, and models a ligand-binding defect rather than the reduced
      protein dose that most human alleles produce; the effect was also
      age- and subregion-dependent, so a single developmental snapshot can
      mislead.
    readouts:
    - name: PSD-fraction accumulation of PSD-95, PSD-93 and AMPA receptor subunits
      target: Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
      direction: DECREASED
      interpretation: Biochemical measure of failed scaffold-dependent receptor anchoring.
      evidence:
      - reference: PMID:23268962
        reference_title: "Impaired synaptic clustering of postsynaptic density proteins and altered signal transmission in hippocampal neurons, and disrupted learning behavior in PDZ1 and PDZ2 ligand binding-deficient PSD-95 knockin mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The KI mice showed decreased accumulation of mutant PSD-95, PSD-93 and AMPA receptor subunits in the PSD fraction of the hippocampus."
        explanation: Reports the biochemical anchoring measurement in the knock-in.
    evidence:
    - reference: PMID:23268962
      reference_title: "Impaired synaptic clustering of postsynaptic density proteins and altered signal transmission in hippocampal neurons, and disrupted learning behavior in PDZ1 and PDZ2 ligand binding-deficient PSD-95 knockin mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings reveal that PSD-95 including its ligand binding of the PDZ1/2 domains controls the synaptic clustering of PSD-MAGUKs and AMPA receptors, which may have an essential role in regulating hippocampal synaptic transmission, plasticity, and hippocampus-dependent behavior."
      explanation: The authors' statement of what the model establishes about PSD-95-dependent receptor clustering.
  - target: Neurodevelopmental Phenotypic Output
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Produces abnormal anxiety-like behaviour and impaired spatial reference,
      working and remote memory — the cognitive and anxiety domains of the human
      phenotype.
    limitations: >-
      Rodent memory tasks are a distant proxy for human intellectual disability,
      and the model captures neither epilepsy nor the connective-tissue features.
    readouts:
    - name: Spatial reference, working and remote memory
      target: Neurodevelopmental Phenotypic Output
      direction: DECREASED
      interpretation: Cognitive correlate of the intellectual-disability phenotype.
      evidence:
      - reference: PMID:23268962
        reference_title: "Impaired synaptic clustering of postsynaptic density proteins and altered signal transmission in hippocampal neurons, and disrupted learning behavior in PDZ1 and PDZ2 ligand binding-deficient PSD-95 knockin mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In a battery of behavioral tests, KI mice showed markedly abnormal anxiety-like behavior, impaired spatial reference and working memory, and impaired remote memory and pattern separation in fear conditioning test."
        explanation: Reports the behavioural battery results in the knock-in.
    evidence:
    - reference: PMID:23268962
      reference_title: "Impaired synaptic clustering of postsynaptic density proteins and altered signal transmission in hippocampal neurons, and disrupted learning behavior in PDZ1 and PDZ2 ligand binding-deficient PSD-95 knockin mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In a battery of behavioral tests, KI mice showed markedly abnormal anxiety-like behavior, impaired spatial reference and working memory, and impaired remote memory and pattern separation in fear conditioning test."
      explanation: Supports treating this model as informative for the cognitive and anxiety output of PSD-95 dysfunction.
experimental_models:
- name: AOUMEYi004-A patient-derived iPSC line (DLG4 c.2155A>T p.Arg719*)
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cell line derived from a 37-year-old man with
    DLG4-related synaptopathy carrying a novel heterozygous de novo nonsense
    variant. The line has a normal karyotype, expresses pluripotency markers and
    differentiates into all three germ layers. It provides the first published
    human cellular substrate for modeling this disorder; no neuronal
    differentiation or disease phenotype is reported yet.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:42462545
  modeled_mechanisms:
  - target: DLG4 Loss of Function and PSD-95 Haploinsufficiency
    relationship: MEASURES
    fidelity: UNKNOWN
    description: >-
      Carries a patient heterozygous nonsense DLG4 allele in a human genetic
      background, the substrate required to measure the haploinsufficient state
      in human neurons.
    limitations: >-
      Characterized only at the pluripotent stage — karyotype, pluripotency
      markers and trilineage differentiation. No neuronal derivative, no PSD-95
      protein measurement and no synaptic phenotype has been reported, so the
      line does not yet demonstrate any disease mechanism.
    evidence:
    - reference: PMID:42462545
      reference_title: "Generation of a human induced pluripotent stem cell line (hiPSC) from a patient with DLG4-related synaptopathy (AOUMEYi004-A) and a novel heterozygous de novo nonsense DLG4 variant c.2155A > T p.(Arg719*)."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "We established the diagnosis in a 37-year-old man, by whole exome sequencing, heterozygous for the novel variant c.2155A > T; p.(Arg719*), then generated and characterized the iPSC line derived from the patient in order to model the neurodevelopmental disorder."
      explanation: >-
        Establishes the line's genotype and stated purpose; graded PARTIAL
        because the report characterizes the stem cell line, not a disease
        mechanism.
differential_diagnoses:
- name: SYNGAP1-Related Developmental and Epileptic Encephalopathy
  description: >-
    The closest mechanistic mimic: SynGAP binds the PDZ1-3 domains of PSD-95 and
    is itself a postsynaptic-density organizer, so its loss produces an
    overlapping intellectual-disability-plus-epilepsy synaptopathy.
  distinguishing_features:
  - >-
    Distinguished only by molecular testing; the clinical gestalt is not
    separable, which is why panel or exome sequencing rather than single-gene
    testing is recommended.
  evidence:
  - reference: PMID:35457207
    reference_title: "Neurodevelopmental Disorders Associated with PSD-95 and Its Interaction Partners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is a general overlap between the clinical features of the genetic NDDs described in the previous section and DLG4-related synaptopathy."
    explanation: >-
      Supports the general claim that PSD-95-interactor disorders overlap
      clinically with DLG4-related synaptopathy and therefore require
      genotype-first discrimination. Note the scope limit: "the previous
      section" in the source covers the transmembrane PSD-95 partners, whereas
      SynGAP is discussed separately as a non-transmembrane partner, so this
      quote supports the overlap principle rather than the SYNGAP1 comparison
      specifically.
- name: Other DLG-MAGUK-related neurodevelopmental disorders (DLG2, DLG3)
  description: >-
    DLG2 variants have been linked to autism, schizophrenia and bipolar
    disorder, and truncating DLG3 variants to X-linked intellectual disability;
    all three paralogs encode postsynaptic-density MAGUKs.
  distinguishing_features:
  - >-
    DLG3 is X-linked, giving a different inheritance signature; otherwise
    discrimination is molecular.
  evidence:
  - reference: PMID:35457207
    reference_title: "Neurodevelopmental Disorders Associated with PSD-95 and Its Interaction Partners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DLG2 variants to ASD, schizophrenia, and bipolar disorder"
    explanation: Establishes the DLG2 paralog disorder that forms part of the immediate differential.
  - reference: PMID:35457207
    reference_title: "Neurodevelopmental Disorders Associated with PSD-95 and Its Interaction Partners."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "and truncating DLG3 variants to X-linked ID"
    explanation: >-
      Establishes the DLG3 paralog disorder and its X-linked inheritance, the
      one differentiating feature available without sequencing. This and the
      preceding item are two clauses of a single source sentence, split because
      the inline citation markers between them are stripped before
      substring matching and so cannot be quoted across.
- name: Marfan syndrome and other syndromic intellectual disability with marfanoid habitus
  description: >-
    DLG4 was discovered through a marfanoid-habitus-plus-intellectual-disability
    cohort, a clinically and genetically heterogeneous group of overlapping
    disorders.
  distinguishing_features:
  - >-
    Marfanoid habitus was found in only nine of 53 individuals in the founding
    DLG4 cohort and no distinct facial dysmorphism could be established, so a
    marfanoid presentation neither confirms nor excludes DLG4.
  evidence:
  - reference: PMID:29460436
    reference_title: "Truncating variants of the DLG4 gene are responsible for intellectual disability with marfanoid features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marfanoid habitus (MH) combined with intellectual disability (ID) is a genetically and clinically heterogeneous group of overlapping disorders."
    explanation: States the heterogeneity of the differential group in which DLG4 was found.
discussions:
- discussion_id: hmm_homozygous_null_vs_human_haploinsufficiency
  prompt: >-
    The mechanistic literature that defines PSD-95 function — the shifted
    LTP/LTD frequency-response, the AMPA-receptor and silent-synapse phenotype,
    the autism-relevant behavioural profile — comes almost entirely from
    homozygous Dlg4-null or PSD-95-truncating mice, whereas every affected human
    is heterozygous. Does halving PSD-95 dose produce a proportionate,
    qualitatively similar synaptic phenotype, or does the near-complete loss
    studied in mice engage compensations and failure modes that a
    haploinsufficient synapse never reaches?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
  - pathophysiology#Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
  rationale: >-
    The gap is not hypothetical. Homozygous Dlg4 deletion adversely affects
    survival in mice, so the null phenotype is measured in a survivor-selected
    population with no human counterpart, and the complete knockout leaves a
    substantial subpopulation of synapses unaffected, implying a threshold
    rather than a linear dose-response. The one heterozygous patient-allele
    model published to date does reproduce reduced PSD-95 protein and cognitive
    and sleep phenotypes, but showed no spontaneous seizures despite epilepsy
    affecting about half of affected humans — the clearest signal so far that
    the heterozygous state is not simply a milder null.
  proposed_experiments:
  - experiment_id: dlg4_het_vs_null_synaptic_physiology
    name: Side-by-side heterozygous versus homozygous Dlg4 synaptic physiology
    description: >-
      Measure LTP/LTD frequency-response functions, AMPA/NMDA ratio and
      silent-synapse fraction in Dlg4+/- and Dlg4-/- hippocampus on one genetic
      background, to establish whether the half-dose state is a proportionate
      version of the null or a qualitatively different phenotype.
    decision_criterion: >-
      A monotonic, proportionate shift across genotypes would support
      extrapolating null-mouse mechanism to human haploinsufficiency; a
      threshold effect, with Dlg4+/- indistinguishable from wild type, would
      refute it.
  - experiment_id: dlg4_ipsc_neuron_synaptic_content
    name: Synaptic PSD-95 and AMPA-receptor content in patient iPSC-derived neurons
    description: >-
      Quantify PSD-95 protein per synapse and synaptic AMPA-receptor content in
      neurons differentiated from the patient-derived AOUMEYi004-A iPSC line
      against an isogenic corrected control, moving the receptor-anchoring claim
      into human cells at the correct heterozygous dose.
  - experiment_id: dlg4_knockin_provoked_seizure_threshold
    name: Provoked-seizure threshold in the Dlg4 V692Wfs*12/+ knock-in
    description: >-
      Test chemically or electrically provoked seizure susceptibility in the
      heterozygous patient-allele knock-in, since spontaneous seizures were
      absent but the seizure threshold was never probed.
    decision_criterion: >-
      A lowered provoked-seizure threshold would reconcile the model with the
      ~50% human epilepsy frequency; a normal threshold would sharpen the
      mismatch.
  evidence:
  - reference: PMID:17148601
    reference_title: "Synapse-specific regulation of AMPA receptor function by PSD-95."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also observed that a significant population of synapses appeared unaffected by PSD-95 gene deletion, suggesting that the functional role of PSD-95 displays synapse-specificity."
    explanation: >-
      Even complete PSD-95 deletion spares many synapses, so extrapolating a
      null phenotype to a half-dose state is not straightforward.
  - reference: PMID:42565830
    reference_title: "A patient-derived mouse model reproduces molecular, neurological, and sleep symptoms of SHINE syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While spontaneous seizures were not observed, future studies will test susceptibility to provoked seizures."
    explanation: >-
      The genotype-faithful heterozygous model misses the epilepsy arm, the
      concrete instance of the mismatch.
- discussion_id: gap_dlg4_genotype_phenotype
  prompt: >-
    Why do individuals carrying the same DLG4 variant differ so widely in
    severity, from mild intellectual disability without epilepsy to a regressive
    DEE-SWAS course? What determines whether a given individual develops
    sleep-activated epileptiform encephalopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Sleep-Activated Epileptiform Encephalopathy (DEE-SWAS/ESES)
  - pathophysiology#Developmental Regression
  - pathophysiology#Neurodevelopmental Phenotypic Output
  rationale: >-
    The largest epilepsy-focused cohort could not identify a genotype-phenotype
    relationship even between individuals carrying identical DLG4 variants,
    which rules out variant identity as the explanation and points instead to
    modifier genes, developmental timing or stochastic circuit factors. Because
    DEE-SWAS is the single strongest predictor of regression, predicting who
    will develop it is the question with the most direct clinical consequence in
    this disorder.
  proposed_experiments:
  - experiment_id: dlg4_prospective_sleep_eeg_cohort
    name: Prospective longitudinal sleep-EEG cohort in DLG4 variant carriers
    description: >-
      Follow an unselected cohort of DLG4 variant carriers with serial sleep or
      24-hour EEG to establish the incidence, age window and clinical predictors
      of DEE-SWAS onset, which no retrospective series can supply.
    decision_criterion: >-
      Identification of a reproducible pre-DEE-SWAS EEG or clinical signature
      would make the regression risk predictable and the surveillance interval
      evidence-based.
  - experiment_id: dlg4_psd95_partner_modifier_screen
    name: Modifier screen in PSD-95 interaction partners
    description: >-
      Test whether variation in PSD-95 binding partners already implicated in
      epilepsy (LGI1-ADAM22, KCNA1/KCNA2, GRIN2A/GRIN2B) modifies the epilepsy
      phenotype among DLG4 carriers, the leading candidate explanation for
      within-variant phenotypic divergence.
  evidence:
  - reference: PMID:38135915
    reference_title: "Developmental epileptic encephalopathy in DLG4-related synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We could not identify a clear genotype-phenotype relationship even between individuals with the same DLG4 variants."
    explanation: Directly states the unexplained variability that defines this gap.
- discussion_id: gap_no_disease_modifying_strategy
  prompt: >-
    Every clinically advanced PSD-95-directed drug programme is designed to
    *disrupt* a PSD-95 interaction — nerinetide (Tat-NR2B9c) and the
    small-molecule PSD-95/nNOS disruptors developed for ischaemic stroke and
    neuropathic pain. For a haploinsufficiency disorder the required direction
    is the opposite: restore PSD-95 dose or function. Is there any tractable
    route to that — transcriptional upregulation of the remaining allele,
    targeted augmentation of a paralogous MAGUK, or stabilization of the
    residual protein — and in what developmental window would it have to act?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#DLG4 Loss of Function and PSD-95 Haploinsufficiency
  - pathophysiology#Impaired Functional Maturation of Excitatory Synapses
  rationale: >-
    The existence of a mature PSD-95-directed pharmacology is easy to mistake
    for a therapeutic head start for this disorder, and it is not one: those
    agents deliberately uncouple PSD-95 from nNOS to suppress excitotoxic nitric
    oxide, which in a PSD-95-deficient brain would push the lesion further in
    the direction it is already broken. The window question is equally
    unresolved — PSD-95 is described as essential during synaptogenesis and
    neurodevelopment, so a dose-restoring therapy started after that window may
    have nothing left to rescue, and no natural-history data yet define when the
    window closes.
  proposed_experiments:
  - experiment_id: dlg4_postnatal_restoration_window
    name: Conditional postnatal restoration of PSD-95 dose in a heterozygous model
    description: >-
      Restore PSD-95 expression at a series of postnatal ages in Dlg4+/- or
      Dlg4 V692Wfs*12/+ mice and test which synaptic, cognitive and sleep
      phenotypes remain reversible at each age.
    decision_criterion: >-
      Reversibility of a phenotype after the close of synaptogenesis would make
      dose-restoring therapy worth pursuing beyond infancy; strict
      developmental-window dependence would restrict it to a prenatal or
      early-infantile intervention.
  evidence:
  - reference: PMID:40712457
    reference_title: "Uncoupling toxic NO signaling: Progress, challenges, and therapeutic promise of disrupting the PSD-95/nNOS protein-protein interaction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Collectively, the evidence positions PSD-95/nNOS disruption as a versatile, clinically achievable approach for mitigating excitotoxic and nociceptive pathology and sets the stage for first-in-class therapies that uncouple toxic NO signaling without silencing healthy synapses."
    explanation: >-
      Establishes that the mature PSD-95-directed pharmacology is aimed at
      disrupting a PSD-95 interaction for excitotoxicity and pain — the opposite
      direction from what a PSD-95 haploinsufficiency disorder needs.
  - reference: PMID:29169997
    reference_title: "PSD95: A synaptic protein implicated in schizophrenia or autism?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In this review, we describe the role of PSD-95 as an essential scaffolding protein during synaptogenesis and neurodevelopment."
    explanation: Supports the developmental-window concern that motivates the second half of this gap.
  - reference: PMID:37347881
    reference_title: "DLG4-Related Synaptopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for DLG4-related synaptopathy."
    explanation: Confirms that no disease-modifying option currently exists, which is what makes this an open gap rather than a settled question.

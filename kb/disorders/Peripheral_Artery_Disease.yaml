environmental:
- name: Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  notes: Strongest modifiable risk factor
  evidence:
  - reference: PMID:23915883
    reference_title: "Comparison of global estimates of prevalence and risk factors for peripheral artery disease in 2000 and 2010: a systematic review and analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Smoking was an important risk factor in both HIC and LMIC, with meta-OR for current smoking of 2·72"
    explanation: "Meta-analysis across 34 community studies (112,027 participants). Smoking carries the largest effect of the 15 risk factors assessed -- meta-OR 2.72 in high-income countries -- which is what makes it the strongest; diabetes, hypertension and hypercholesterolaemia follow in that order."
- name: Diabetes
  notes: Major risk factor
  evidence:
  - reference: PMID:23915883
    reference_title: "Comparison of global estimates of prevalence and risk factors for peripheral artery disease in 2000 and 2010: a systematic review and analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in LMIC, followed by diabetes (1·88"
    explanation: "Diabetes has the second-largest effect of the 15 risk factors meta-analysed. The quoted OR 1.88 is the high-income estimate; the low/middle-income estimate is 1.47, in the bracketed continuation the validator strips."
- name: Hypertension
  notes: Contributes to atherosclerosis
  evidence:
  - reference: PMID:24881994
    reference_title: "Blood pressure and incidence of twelve cardiovascular diseases: lifetime risks, healthy life-years lost, and age-specific associations in 1.25 million people"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "raised systolic blood pressure had a greater effect on angina, myocardial infarction, and peripheral arterial disease"
    explanation: "CALIBER cohort of 1.25 million initially cardiovascular-disease-free patients; pulse pressure showed its strongest association of any of the twelve endpoints with peripheral arterial disease. PARTIAL because it evidences the association, not the atherogenic mechanism the note asserts -- for that, see the atherogenesis module."
- name: Dyslipidemia
  notes: LDL elevation
  evidence:
  - reference: PMID:33221847
    reference_title: "LDL-Cholesterol versus Glucose in Microvascular and Macrovascular Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LDL-cholesterol has a causal effect on risk of peripheral arterial disease"
    explanation: "Supports the LDL fraction specifically, which is what this annotation names, and states it causally rather than as an association -- the review synthesises Mendelian randomization and trial evidence."
- name: Sedentary Lifestyle
  exposure_term:
    preferred_term: sedentary lifestyle
    term:
      id: ECTO:6000004
      label: exposure to sedentary lifestyle
  notes: Lack of exercise
  evidence:
  - reference: PMID:42537768
    reference_title: "Wearable device-measured sedentary behaviour, physical activity, and incident symptomatic peripheral artery disease: a prospective cohort study of 87,490 adults"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants in the highest SB tertile had a 43% increased risk of symptomatic PAD"

environmental:
- name: Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  notes: Strongest modifiable risk factor
  evidence:
  - reference: PMID:23915883
    reference_title: "Comparison of global estimates of prevalence and risk factors for peripheral artery disease in 2000 and 2010: a systematic review and analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Smoking was an important risk factor in both HIC and LMIC, with meta-OR for current smoking of 2·72"
    explanation: "Meta-analysis across 34 community studies (112,027 participants). Smoking carries the largest effect of the 15 risk factors assessed -- meta-OR 2.72 in high-income countries -- which is what makes it the strongest; diabetes, hypertension and hypercholesterolaemia follow in that order."
- name: Sedentary Lifestyle
  exposure_term:
    preferred_term: sedentary lifestyle
    term:
      id: ECTO:6000004
      label: exposure to sedentary lifestyle
  notes: Lack of exercise
  evidence:
  - reference: PMID:42537768
    reference_title: "Wearable device-measured sedentary behaviour, physical activity, and incident symptomatic peripheral artery disease: a prospective cohort study of 87,490 adults"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants in the highest SB tertile had a 43% increased risk of symptomatic PAD"
    explanation: "Prospective cohort of 87,490 adults with device-measured rather than self-reported activity, removing the recall bias that weakens most sedentary-behaviour evidence; median follow-up 7.9 years."
treatments:
- name: Smoking Cessation
  description: Most important intervention, reduces progression.
  treatment_term:
    preferred_term: tobacco cessation counseling
    term:
      id: NCIT:C101244
      label: Tobacco Cessation Counseling
  evidence:
  - reference: PMID:25282696
    reference_title: "Smoking cessation is associated with decreased mortality and improved amputation-free survival among patients with symptomatic peripheral artery disease."
    supports: SUPPORT
    snippet: "During follow-up to 5 years, patients who quit smoking had significantly lower all-cause mortality (14% vs 31%; hazard ratio, 0.40; 95% confidence interval, 0.18-0.90) and improved amputation-free survival (81% vs 60%; hazard ratio, 0.43, 95% confidence interval, 0.22-0.86) compared with patients who continued smoking"
    explanation: Demonstrates that smoking cessation in PAD patients significantly reduces mortality and improves amputation-free survival.

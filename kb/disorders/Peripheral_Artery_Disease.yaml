    reference_title: "Exercise training for intermittent claudication."
    supports: SUPPORT
    snippet: "A meta-analysis of 25 randomized trials demonstrated a 180-meter increase in treadmill walking distance in response to supervised exercise interventions compared with a nonexercising control group."
    explanation: Meta-analysis of 25 RCTs demonstrates supervised exercise significantly improves walking distance in PAD patients.
  - reference: PMID:42248619
    reference_title: "Editor's Choice - Focused Update on Paclitaxel Coated Technologies, from the 2024 European Society for Vascular Surgery (ESVS) Guidelines on the Management of Asymptomatic Peripheral Arterial Disease and Intermittent Claudication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The update consistently emphasises supervised exercise therapy and best medical therapies as first line treatment."
    explanation: The ESVS focused update emphasises supervised exercise therapy, alongside best medical therapy, as first-line treatment for intermittent claudication.
- name: Cilostazol
  description: Phosphodiesterase inhibitor for claudication symptoms.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cilostazol
      term:
        id: CHEBI:31401
        label: cilostazol
  evidence:
  - reference: PMID:12480040
    reference_title: "Meta-analysis of results from eight randomized, placebo-controlled trials on the effect of cilostazol on patients with intermittent claudication."
    supports: SUPPORT
    snippet: "Cilostazol therapy increased maximal and pain-free walking distances by 50% and 67%, respectively."
    explanation: Meta-analysis of 8 RCTs showing cilostazol significantly improves walking distances in claudication patients.
  - reference: PPR:PPR1280150
    reference_title: "Efficacy and Safety of Fixed-Dose Combination Therapy With Cilostazol and Rosuvastatin in Patients With Symptomatic Lower Extremity Peripheral Artery Disease: A Multicenter Randomized Controlled Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combination therapy group showed significantly greater improvement in the KPAQ summary score than in the rosuvastatin monotherapy group"
    explanation: Double-blind placebo-controlled RCT (n=260 randomized, 232 completed, Korea) in which adding cilostazol to rosuvastatin improved patient-reported health status beyond rosuvastatin alone. Preprint, not peer reviewed; supports the add-on claim but is not the sole support for it.

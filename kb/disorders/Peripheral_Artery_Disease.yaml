- accession: geo:GSE287118
  title: Multiomics identifies unique modulators of calf muscle pathophysiology in peripheral artery disease and chronic kidney disease
  description: This project aimed to map transcriptome changes in the skeletal muscle of patients with and without PAD (peripheral artery disease) and CKD (chronic kidney disease)
  organism:

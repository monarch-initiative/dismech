- name: Lipoprotein(a)
  presence: Elevated
  context: >-
    Genetically determined causal risk factor for atherosclerotic cardiovascular
    disease, including peripheral artery disease; measured at least once in adulthood and interpreted against global cardiovascular risk.
  loinc_term:
    id: LOINC:43583-4
    label: Lipoprotein a [Moles/volume] in Serum or Plasma
  evidence:
  - reference: PMID:36036785
    reference_title: "Lipoprotein(a) in atherosclerotic cardiovascular disease and aortic stenosis: a European Atherosclerosis Society consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lp(a) should be measured at least once in adults to identify those with high cardiovascular risk."
    explanation: Supports measuring Lp(a) once in adults as a cardiovascular risk marker.
  reference_ranges:
  - loinc_term:
      id: LOINC:43583-4
      label: Lipoprotein a [Moles/volume] in Serum or Plasma
    unit: nmol/L
    population: Adults (European Atherosclerosis Society 2022 consensus risk thresholds)
    notes: >-
      Risk thresholds, not a population reference interval: Lp(a) is more than 90%
      genetically determined, so the distribution is skewed and no "normal"
      interval applies. The consensus prefers molar units. Its rule-out is "<75
      nmol/L" and rule-in "≥125 nmol/L", so the half-open bands match them
      exactly. The very-high threshold is ">430 nmol/L"; the band places exactly
      430 nmol/L in the top band, a one-point discrepancy left as is.
    evidence:
    - reference: PMID:36036785
      reference_title: "Lipoprotein(a) in atherosclerotic cardiovascular disease and aortic stenosis: a European Atherosclerosis Society consensus statement."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Rather than absolute values, clinical guidelines should consider using risk thresholds with ‘grey’ zones (e.g., 30–50 mg/dL or 75–125 nmol/L) to either rule-in (≥50 mg/dL; 125 nmol/L) or rule-out (<30 mg/dL; 75 nmol/L) cardiovascular risk."
      explanation: Gives the rule-out, grey-zone and rule-in thresholds.
    - reference: PMID:36036785
      reference_title: "Lipoprotein(a) in atherosclerotic cardiovascular disease and aortic stenosis: a European Atherosclerosis Society consensus statement."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Very high Lp(a) levels (>180 mg/dL or >430 nmol/L) also identify individuals with lifetime ASCVD risk equivalent to untreated heterozygous familial hypercholesterolaemia (FH)."
      explanation: Gives the very-high threshold and the risk it carries.
    - reference: PMID:36036785
      reference_title: "Lipoprotein(a) in atherosclerotic cardiovascular disease and aortic stenosis: a European Atherosclerosis Society consensus statement."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Measurement of Lp(a) should be in molar units if available. If not, the units in which the assay is calibrated should be used for reporting."
      explanation: Records the preference for molar units.
    interpretation_bands:
    - name: Rule out
      upper_bound: 75
      unit: nmol/L
      abnormal_flag: NORMAL
      interpretation: Lp(a)-attributable cardiovascular risk ruled out.
    - name: Grey zone
      lower_bound: 75
      upper_bound: 125
      unit: nmol/L
      abnormal_flag: HIGH
      severity: MILD
      interpretation: Lp(a)-attributable risk depends on other risk factors; relevant to global risk stratification.
    - name: Rule in
      lower_bound: 125
      upper_bound: 430
      unit: nmol/L
      abnormal_flag: HIGH
      severity: MODERATE
      interpretation: Lp(a)-attributable cardiovascular risk ruled in; addressed through intensified risk factor management.
    - name: Very high (FH-equivalent risk)
      lower_bound: 430
      unit: nmol/L
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
      interpretation: Lifetime ASCVD risk equivalent to untreated heterozygous familial hypercholesterolaemia.
  - loinc_term:
      id: LOINC:10835-7
      label: Lipoprotein a [Mass/volume] in Serum or Plasma
    unit: mg/dL
    population: Adults (European Atherosclerosis Society 2022 consensus risk thresholds)
    notes: >-
      Mass-unit equivalents of the molar thresholds, for assays calibrated in
      mg/dL. Mass and molar values cannot be converted by a single factor
      because apolipoprotein(a) isoform size varies, so the paired thresholds
      are the consensus's own, not a conversion. The very-high threshold is
      ">180 mg/dL"; the band places exactly 180 mg/dL in the top band.
    evidence:
    - reference: PMID:36036785
      reference_title: "Lipoprotein(a) in atherosclerotic cardiovascular disease and aortic stenosis: a European Atherosclerosis Society consensus statement."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Rather than absolute values, clinical guidelines should consider using risk thresholds with ‘grey’ zones (e.g., 30–50 mg/dL or 75–125 nmol/L) to either rule-in (≥50 mg/dL; 125 nmol/L) or rule-out (<30 mg/dL; 75 nmol/L) cardiovascular risk."
      explanation: Gives the mass-unit rule-out, grey-zone and rule-in thresholds.
    - reference: PMID:36036785
      reference_title: "Lipoprotein(a) in atherosclerotic cardiovascular disease and aortic stenosis: a European Atherosclerosis Society consensus statement."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Very high Lp(a) levels (>180 mg/dL or >430 nmol/L) also identify individuals with lifetime ASCVD risk equivalent to untreated heterozygous familial hypercholesterolaemia (FH)."
      explanation: Gives the mass-unit very-high threshold.
    interpretation_bands:
    - name: Rule out
      upper_bound: 30
      unit: mg/dL
      abnormal_flag: NORMAL
      interpretation: Lp(a)-attributable cardiovascular risk ruled out.
    - name: Grey zone
      lower_bound: 30
      upper_bound: 50
      unit: mg/dL
      abnormal_flag: HIGH
      severity: MILD
      interpretation: Lp(a)-attributable risk depends on other risk factors; relevant to global risk stratification.
    - name: Rule in
      lower_bound: 50
      upper_bound: 180
      unit: mg/dL
      abnormal_flag: HIGH
      severity: MODERATE
      interpretation: Lp(a)-attributable cardiovascular risk ruled in; addressed through intensified risk factor management.
    - name: Very high (FH-equivalent risk)
      lower_bound: 180
      unit: mg/dL
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
      interpretation: Lifetime ASCVD risk equivalent to untreated heterozygous familial hypercholesterolaemia.

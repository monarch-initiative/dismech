- accession: geo:GSE289575
  title: Multi-omics Analysis of Skeletal Muscle Identifies Dysregulation of Hypoxia-Induced Genes in Peripheral Artery Disease [RRBS]
  description: Epigenetic modifications such as DNA methylation play a critical role in hypoxic cell programs. However, no previous studies have investigated the epigenetic regulation of gene expression in peripheral artery disease (PAD), a condition characterized by intermittent ischemia. In this study, we used reduced representation bisulphite sequencing (RRBS) to investigate how PAD affects the DNA methylome in skeletal muscle of PAD patients with intermittent claudication (IC) or critical limb ischemia (CLI) compared to non-PAD controls. We also used small and bulk RNA-sequencing (RNA-seq), which allowed for data integration.

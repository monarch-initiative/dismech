name: Peripheral Artery Disease
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Peripheral artery disease (PAD) is atherosclerotic narrowing of the arteries
  supplying the limbs, most often the lower extremities. Endothelial dysfunction,
  plaque accumulation, inflammation, and thrombosis progressively reduce distal
  perfusion, producing a supply-demand mismatch that manifests as intermittent
  claudication and, in advanced disease, rest pain, ulceration, and critical limb
  ischemia. PAD also marks elevated systemic cardiovascular risk.
category: Complex
parents:
- Cardiovascular Disease
disease_term:
  preferred_term: peripheral arterial disease
  term:
    id: MONDO:0005386
    label: peripheral arterial disease
pathophysiology:
- name: Endothelial Dysfunction and Subendothelial LDL Retention
  conforms_to: "atherogenesis#Endothelial Dysfunction and Subendothelial LDL Retention"
  role: trigger
  description: >-
    In the peripheral arterial intima, endothelial injury and dysfunction permit
    infiltration and retention of apoB-containing lipoproteins in the
    subendothelial space. Retained and modified lipoproteins initiate local
    inflammation and monocyte recruitment. This plaque-initiation node is
    distinct from the downstream vasodilation and ischemic-angiogenesis defect.
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Cholesterol Homeostasis
    term:
      id: GO:0042632
      label: cholesterol homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      infiltration and retention of apoB containing lipoproteins in the artery
      wall is a critical initiating event that sparks an inflammatory response
      and promotes the development of atherosclerosis.
    explanation: >-
      Establishes arterial-wall apoB retention as the initiating event;
      peripheral arterial intima is the disease-specific location represented
      here.
  downstream:
  - target: Monocyte Recruitment and Macrophage Foam Cell Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Arterial injury causes endothelial dysfunction promoting modification of
        apoB containing lipoproteins and infiltration of monocytes into the
        subendothelial space.
      explanation: >-
        Directly links endothelial injury and modified apoB lipoproteins to
        monocyte entry into the subendothelial space.
- name: Monocyte Recruitment and Macrophage Foam Cell Formation
  conforms_to: "atherogenesis#Monocyte Recruitment and Macrophage Foam Cell Formation"
  role: amplifier
  description: >-
    In the peripheral arterial intima, recruited monocytes become macrophages and
    internalize retained apoB-containing lipoproteins, forming lipid-laden foam
    cells. Their inflammatory feed-forward loop promotes further lipoprotein
    oxidation, endothelial activation, monocyte recruitment, and foam-cell
    formation.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: Foam Cell
    term:
      id: CL:0000891
      label: foam cell
  biological_processes:
  - preferred_term: Foam Cell Differentiation
    term:
      id: GO:0090077
      label: foam cell differentiation
    modifier: INCREASED
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Internalization of the apoB containing lipoproteins by macrophages promotes
      foam cell formation, which is the hallmark of the fatty streak phase of
      atherosclerosis.
    explanation: >-
      Directly supports macrophage uptake of apoB lipoproteins and foam-cell
      formation in the fatty streak.
  - reference: PMID:26844337
    reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Macrophage inflammation results in enhanced oxidative stress and
      cytokine/chemokine secretion, causing more LDL/remnant oxidation,
      endothelial cell activation, monocyte recruitment, and foam cell formation.
    explanation: >-
      Documents the macrophage inflammatory loop that amplifies foam-cell
      formation.
  downstream:
  - target: Atherosclerosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Macrophage inflammatory chemoattractants stimulate infiltration and
        proliferation of smooth muscle cells. Smooth muscle cells produce the
        extracellular matrix providing a stable fibrous barrier between plaque
        prothrombotic factors and platelets.
      explanation: >-
        Connects macrophage inflammation to smooth-muscle-cell proliferation and
        extracellular-matrix production, the next core stage.
- name: Atherosclerosis
  conforms_to: "atherogenesis#Smooth Muscle Cell Switching and Fibrofatty Plaque Formation"
  role: central_effector
  description: >-
    In the inflamed peripheral arterial intima, vascular smooth muscle cells
    switch to a synthetic, migratory phenotype, proliferate, and organize
    extracellular matrix to build the fibrofatty plaque and its fibrous cap.
    This is the atomic smooth-muscle-cell and matrix assembly step.
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: Smooth Muscle Cell Proliferation
    term:
      id: GO:0048661
      label: positive regulation of smooth muscle cell proliferation
    modifier: INCREASED
  - preferred_term: Extracellular Matrix Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      vascular smooth muscle cell phenotypic switching through
      transdifferentiation and stem/progenitor cell activation resulting in the
      promotion of inflammation, calcification, and secretion of extracellular
      matrix, altering fibrous cap structure, and necrotic core growth.
    explanation: >-
      Directly supports smooth-muscle-cell phenotypic switching and
      extracellular-matrix secretion in plaque assembly.
  downstream:
  - target: Advanced Atheroma with Necrotic Core and Fibrous Cap
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - continued lipid accumulation
    - foam-cell apoptosis/death with defective efferocytosis and necrotic-core growth
    - vascular smooth muscle cell and extracellular-matrix remodeling
    description: >-
      Continued lipid accumulation, foam-cell death, and matrix remodeling
      intervene between initial fibrofatty plaque assembly and advanced atheroma.
    evidence:
    - reference: PMID:26844337
      reference_title: The Role of Lipids and Lipoproteins in Atherosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Unresolved inflammation results in formation of vulnerable plaques
        characterized by enhanced macrophage apoptosis and defective efferocytosis
        of apoptotic cells resulting in necrotic cell death leading to increased
        smooth muscle cell death, decreased extracellular matrix production, and
        collagen degradation by macrophage proteases.
      explanation: >-
        Identifies macrophage/foam-cell death and extracellular-matrix remodeling
        as known intermediates in progression toward vulnerable advanced plaque.
- name: Endothelial Dysfunction
  description: >
    Impaired endothelium-dependent vasodilation reduces blood flow
    reserve. Decreased nitric oxide production and increased
    endothelin contribute.
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Vasodilation
    term:
      id: GO:0042311
      label: vasodilation
  evidence:
  - reference: PMID:38961103
    reference_title: "An evaluation of inflammatory and endothelial dysfunction markers as determinants of peripheral arterial disease in those with diabetes mellitus."
    supports: SUPPORT
    snippet: "It was observed that serum IL-6, IL-8, ICAM and VCAM levels in type II diabetes mellitus (T2DM) with PAD patients were increased significantly (85.93, 597.08, 94.80 and 80.66) as compared to T2DM patients (59.52, 231.34, 56.88 and 50.19) and healthy individuals (4.81, 16.93, 5.55 and 5.16)."
    explanation: Demonstrates marked elevation of endothelial activation markers (ICAM, VCAM) in PAD patients, indicating severe endothelial dysfunction.
  - reference: PMID:38182796
    reference_title: "Inhibiting anti-angiogenic VEGF165b activates a miR-17-20a-Calcipressin-3 pathway that revascularizes ischemic muscle in peripheral artery disease."
    supports: SUPPORT
    snippet: "We have previously shown that VEGF165b, an alternatively spliced anti-angiogenic VEGF-A isoform, inhibits the VEGFR-STAT3 pathway in ischemic endothelial cells (ECs) to decrease their angiogenic capacity."
    explanation: Describes impaired angiogenic signaling in ischemic endothelial cells in PAD, contributing to endothelial dysfunction and inadequate collateral formation.
- name: Advanced Atheroma with Necrotic Core and Fibrous Cap
  conforms_to: "atherogenesis#Advanced Atheroma with Necrotic Core and Fibrous Cap"
  role: effector
  description: >-
    Continued lipid accumulation, foam-cell death, and matrix remodeling produce
    a mature peripheral arterial atheroma with a necrotic lipid core beneath a
    fibrous cap. Local plaque changes can destabilize the cap and create a
    rupture-prone lesion.
  cell_types:
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  locations:
  - preferred_term: Artery
    term:
      id: UBERON:0001637
      label: artery
  biological_processes:
  - preferred_term: Extracellular Matrix Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:37595697
    reference_title: The microenvironment of the atheroma expresses phenotypes of plaque instability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the local arterial microenvironment of a stable atheroma promotes
      destabilizing conditions that result in the transition to an unstable
      atheroma.
    explanation: >-
      Human histopathology and vascular-imaging evidence supports transition of
      a mature stable atheroma to an unstable lesion; peripheral artery is the
      disease-specific location substituted here.
  downstream:
  - target: Thrombosis
    causal_link_type: DIRECT
    evidence:
    - reference: DOI:10.3389/fcvm.2023.1271100
      reference_title: Lower limb arterial calcification and its clinical relevance with peripheral arterial disease
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        atherosclerotic plaque rupture-related thrombosis was more common above
        the knee.
      explanation: >-
        PAD-specific histopathology summarized by this review directly supports
        plaque rupture leading to thrombosis in the above-knee atherosclerotic
        branch; it does not generalize to every PAD occlusion.
- name: Thrombosis
  description: >-
    In the atherosclerotic PAD branch, plaque rupture-related thrombosis is
    reported more often above the knee. PAD also includes occlusive thrombosis
    without significant plaque, so this node records a qualified association
    rather than a universal plaque-rupture consequence or an asserted acute
    limb-ischemia outcome.
  cell_types:
  - preferred_term: Platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: Thrombosis
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  evidence:
  - reference: DOI:10.3389/fcvm.2023.1271100
    reference_title: Lower limb arterial calcification and its clinical relevance with peripheral arterial disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      atherosclerotic plaque rupture-related thrombosis was more common above the
      knee.
    explanation: >-
      PAD-specific histopathology summarized by this review directly supports
      rupture-related thrombosis in above-knee disease and defines the qualified
      atherosclerotic branch represented by this node.
  - reference: PMID:38401035
    reference_title: "Neutrophil extracellular traps: a catalyst for atherosclerosis."
    supports: PARTIAL
    snippet: "Continuous release of NETs in response to external stimuli leads to activation of surrounding platelets and monocytes/macrophages, resulting in damage to endothelial cells (EC) and vascular smooth muscle cells (VSMC)."
    explanation: Supports platelet-activating and vascular-injury context in atherosclerosis, but does not directly establish plaque rupture-related thrombosis in PAD.
  - reference: PMID:37452714
    reference_title: "Neutrophil extracellular traps contributing to atherosclerosis: From pathophysiology to clinical implications."
    supports: PARTIAL
    snippet: "NETs not only capture pathogens in innate immunity but also respond to sterile inflammatory stimuli in atherosclerosis, such as lipoproteins and inflammatory cytokines."
    explanation: Supports NET responses to sterile atherosclerotic stimuli, but does not directly establish thrombosis or a PAD-specific rupture event.
- name: Inflammation
  description: >
    Chronic inflammation drives plaque progression and instability.
    Elevated CRP and inflammatory markers predict cardiovascular events.
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:38003290
    reference_title: "Current Medical Therapy and Revascularization in Peripheral Artery Disease of the Lower Limbs: Impacts on Subclinical Chronic Inflammation."
    supports: SUPPORT
    snippet: "Peripheral artery disease (PAD), coronary artery disease (CAD), and cerebrovascular disease (CeVD) are characterized by atherosclerosis and inflammation as their underlying mechanisms."
    explanation: Establishes inflammation as a core mechanism underlying PAD pathophysiology.
  - reference: PMID:37452714
    reference_title: "Neutrophil extracellular traps contributing to atherosclerosis: From pathophysiology to clinical implications."
    supports: SUPPORT
    snippet: "Neutrophil extracellular traps (NETs) are network-like structures of chromatin filaments decorated by histones, granules, and cytoplasmic-derived proteins expelled by activated neutrophils under multiple pathogenic conditions."
    explanation: Describes neutrophil-driven inflammatory mechanisms involving NET formation in atherosclerosis.
  - reference: PMID:38401035
    reference_title: "Neutrophil extracellular traps: a catalyst for atherosclerosis."
    supports: SUPPORT
    snippet: "Continuous release of NETs in response to external stimuli leads to activation of surrounding platelets and monocytes/macrophages, resulting in damage to endothelial cells (EC) and vascular smooth muscle cells (VSMC)."
    explanation: Demonstrates how neutrophil-mediated inflammation causes vascular cell damage in atherosclerotic disease.

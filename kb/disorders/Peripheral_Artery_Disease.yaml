      label: Tobacco Cessation Counseling
  evidence:
  - reference: PMID:25282696
    reference_title: "Smoking cessation is associated with decreased mortality and improved amputation-free survival among patients with symptomatic peripheral artery disease."
    supports: SUPPORT
    snippet: "During follow-up to 5 years, patients who quit smoking had significantly lower all-cause mortality (14% vs 31%; hazard ratio, 0.40; 95% confidence interval, 0.18-0.90) and improved amputation-free survival (81% vs 60%; hazard ratio, 0.43, 95% confidence interval, 0.22-0.86) compared with patients who continued smoking"
    explanation: Demonstrates that smoking cessation in PAD patients significantly reduces mortality and improves amputation-free survival.

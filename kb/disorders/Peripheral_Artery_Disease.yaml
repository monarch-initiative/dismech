treatments:
- name: Smoking Cessation
  description: Most important intervention, reduces progression.
  treatment_term:
    preferred_term: tobacco cessation counseling
    term:
      id: NCIT:C101244
      label: Tobacco Cessation Counseling
  evidence:
  - reference: PMID:25282696
    supports: SUPPORT
    snippet: "During follow-up to 5 years, patients who quit smoking had
      significantly lower all-cause mortality (14% vs 31%; hazard ratio, 0.40;
      95% confidence interval, 0.18-0.90) and improved amputation-free survival
      (81% vs 60%; hazard ratio, 0.43, 95% confidence interval, 0.22-0.86)
      compared with patients who continued smoking"
    explanation: Demonstrates that smoking cessation in PAD patients
      significantly reduces mortality and improves amputation-free survival.
- name: Antiplatelet Therapy
  description: Aspirin or clopidogrel to reduce cardiovascular events.
  treatment_term:
    preferred_term: platelet aggregation inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antiplatelet agent
      term:
        id: NCIT:C1327
        label: Antiplatelet Agent
- name: Statins
  description: LDL lowering, plaque stabilization.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: statin
      term:
        id: CHEBI:87631
        label: statin
  evidence:
  - reference: PMID:34389230
    supports: SUPPORT
    snippet: "Higher dosing of statins confers a significant improvement in
      patient outcomes, especially ACM and amputations, although the quality of
      the evidence was variable."
    explanation: Meta-analysis demonstrating statins significantly reduce
      mortality and amputations in PAD patients.
- name: ACE Inhibitors
  description: Cardiovascular risk reduction.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
- name: Supervised Exercise Therapy
  description: First-line for claudication, improves walking distance.
  treatment_term:
    preferred_term: aerobic exercise therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:28874320
    supports: SUPPORT
    snippet: "A meta-analysis of 25 randomized trials demonstrated a 180-meter
      increase in treadmill walking distance in response to supervised exercise
      interventions compared with a nonexercising control group."
    explanation: Meta-analysis of 25 RCTs demonstrates supervised exercise
      significantly improves walking distance in PAD patients.
  - reference: PMID:42248619
    reference_title: "Editor's Choice - Focused Update on Paclitaxel Coated Technologies, from the 2024 European Society for Vascular Surgery (ESVS) Guidelines on the Management of Asymptomatic Peripheral Arterial Disease and Intermittent Claudication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The update consistently emphasises supervised exercise therapy and best medical therapies as first line treatment."
    explanation: The ESVS focused update emphasises supervised exercise therapy, alongside best medical therapy, as first-line treatment for intermittent claudication.
- name: Cilostazol
  description: Phosphodiesterase inhibitor for claudication symptoms.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cilostazol
      term:
        id: CHEBI:31401
        label: cilostazol
  evidence:
  - reference: PMID:12480040
    supports: SUPPORT
    snippet: "Cilostazol therapy increased maximal and pain-free walking
      distances by 50% and 67%, respectively."
    explanation: Meta-analysis of 8 RCTs showing cilostazol significantly
      improves walking distances in claudication patients.
- name: Revascularization
  description: Endovascular or surgical for severe disease.
  treatment_term:
    preferred_term: invasive revascularization therapy
    term:
      id: NCIT:C191567
      label: Invasive Revascularization Therapy
  evidence:
  - reference: PMID:42248619
    reference_title: "Editor's Choice - Focused Update on Paclitaxel Coated Technologies, from the 2024 European Society for Vascular Surgery (ESVS) Guidelines on the Management of Asymptomatic Peripheral Arterial Disease and Intermittent Claudication."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Endovascular revascularisation is recommended only for persistent lifestyle limiting symptoms despite conservative therapy."
    explanation: The ESVS focused update restricts endovascular revascularisation to patients with persistent lifestyle-limiting symptoms despite conservative therapy.


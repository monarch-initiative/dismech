    supports: SUPPORT
    snippet: "Higher dosing of statins confers a significant improvement in patient outcomes, especially ACM and amputations, although the quality of the evidence was variable."
    explanation: Meta-analysis demonstrating statins significantly reduce mortality and amputations in PAD patients.

      explanation: The authors specifically propose a developmental effect of constitutive GABA deficiency
        to explain axial hypotonia. Their comparison with stiff-person syndrome does not establish
        the cause of other motor signs in DEE89.
      directness: INDIRECT

- name: Impaired Retraction of Physiological Umbilical Hernia
  description: The authors propose that impaired fetal movement alters posture and intra-abdominal
    pressure, interfering with retraction of the physiological umbilical hernia. Gad1-null mice have
    persistent umbilical hernia rather than histologically identical human omphalocele; transfer of
    this mechanism to human omphalocele is provisional.
  role: mediator
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:20333300
    reference_title: Cleft palate is caused by CNS dysfunction in Gad1 and Viaat knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These phenotypes suggest that Gad1 and Viaat functions are not necessary for body wall
      formation per se but are instead required for the retraction of the umbilical hernia during
      development.
    explanation: Mouse histology supports a retraction defect rather than failed body-wall formation;
      it does not demonstrate human omphalocele.
    directness: INDIRECT
  - reference: PMID:32282878
    reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic
      encephalopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: movement reduction leads to a hunched posture in the foetus and increased intra-abdominal
      pressure, resulting in failure of retracting umbilical hernia and omphalocele
    explanation: The clinical authors propose this movement/posture/retraction route. Mouse histology
      establishes umbilical hernia, so extension to human omphalocele remains a hypothesis.
    directness: INDIRECT
  downstream:
  - target: Omphalocele
    description: Failure of normal visceral retraction is proposed as a contributor to human omphalocele.
      This human extrapolation is less secure than the demonstrated mouse umbilical-hernia phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32282878
      reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and
        epileptic encephalopathy.
      supports: SUPPORT
      evidence_source: OTHER

      explanation: CNS-specific deletion, pharmacological rescue and oral explants support the mouse
        mechanism.
      directness: INDIRECT
    - reference: PMID:32282878
      reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and
        epileptic encephalopathy.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Also the pes equinovarus, joint contractures and arthrogryposis, seen in several of
        the patients in our study, are known to reflect a reduction of foetal movements
      explanation: The authors propose fetal movement reduction as the causal explanation for these

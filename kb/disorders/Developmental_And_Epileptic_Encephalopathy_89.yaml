inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    DEE 89 is autosomal recessive. Affected individuals carry biallelic
    loss-of-function GAD1 variants; the founding cohort was drawn from six
    independent consanguineous families, and subsequent reports have been
    homozygous or compound heterozygous.
  evidence:
  - reference: PMID:32282878
    reference_title: "Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe a new syndromic developmental and epileptic
      encephalopathy caused by bi-allelic loss-of-function variants in GAD1, as
      presented by 11 patients from six independent consanguineous families.
    explanation: >-
      Establishes biallelic (recessive) GAD1 loss of function as the cause, in
      consanguineous pedigrees.
  - reference: PMID:32705143
    reference_title: "Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present six affected individuals from six unrelated families,
      carrying bi-allelic GAD1 variants
    explanation: >-
      Independent replication of biallelic GAD1 inheritance in six further
      families.
pathophysiology:
- name: Biallelic GAD1 Loss of Function
  description: >-
    Biallelic loss-of-function variants in GAD1 (missense, nonsense, splice-site
    and deletion alleles distributed across the gene) are the initiating lesion.
    This node captures the single concept of the genetic lesion.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: GAD1
    term:
      id: hgnc:4092
      label: GAD1
  evidence:
  - reference: PMID:32282878
    reference_title: "Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe a new syndromic developmental and epileptic
      encephalopathy caused by bi-allelic loss-of-function variants in GAD1, as
      presented by 11 patients from six independent consanguineous families.
    explanation: >-
      Identifies biallelic GAD1 loss-of-function variants as the causal lesion of
      the syndrome.
  downstream:
  - target: GAD67 Enzyme Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss-of-function alleles reduce or abolish the activity of the GAD67
      enzyme that GAD1 encodes.
  - target: Muscle Weakness
    description: The clinical series attributes weakness to biallelic GAD1 variants; the intervening
      mechanism and central versus peripheral localization are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32705143
      reference_title: Early-infantile onset epilepsy and developmental delay caused by bi-allelic
        GAD1 variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In conclusion, this case series reports distinct phenotypical features caused by GAD1
        variants, including early-infantile onset epilepsy, severe developmental delay and muscle
        weakness.
      explanation: The clinical genetic series explicitly attributes muscle weakness to GAD1 variants.
        This supports a qualified causal relation with unknown intermediates, but does not localize
        weakness to central motor development, peripheral nerves or muscle.
      directness: INDIRECT

- name: GAD67 Enzyme Deficiency
  description: GAD67 converts glutamate to GABA. Biallelic GAD1 variants are predicted or demonstrated
    to impair the protein; activity has not been measured for every allele, and missense or in-frame
    variants need not abolish all function.
  role: mediator
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: glutamate decarboxylase activity
    term:
      id: GO:0004351
      label: glutamate decarboxylase activity

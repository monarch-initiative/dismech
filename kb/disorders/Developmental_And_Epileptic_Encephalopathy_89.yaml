    reference_title: "Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GAD1 encodes the glutamate decarboxylase enzyme GAD67
    explanation: >-
      Establishes that the affected gene product is the GAD67 decarboxylase
      enzyme.
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GAD67 is the rate-limiting enzyme in GABA synthesis, and its deficiency
      leads to developmental and epileptic encephalopathy 89 (DEE 89).
    explanation: >-
      Names GAD67 deficiency as the proximate biochemical defect in DEE 89 and
      identifies it as rate-limiting for GABA synthesis.
  downstream:
  - target: GABA Depletion
    causal_link_type: DIRECT
    description: Reduced GAD67 function decreases basal GABA synthesis. GAD65 supplies residual and
      compartment-specific GABA but does not restore the normal cortical pool in null mice.

- name: GABA Depletion
  description: GAD67 loss markedly reduces basal CNS GABA in mouse models. GAD65-dependent synthesis

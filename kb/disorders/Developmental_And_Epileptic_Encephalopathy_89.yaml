genetic:
- name: GAD1
  gene_term:
    preferred_term: GAD1
    term:
      id: hgnc:4092
      label: GAD1
  relationship_type: CAUSATIVE
  notes: >-
    GAD1 (2q31.1, 21 exons) encodes GAD67. Reported pathogenic alleles include
    missense, nonsense, splice-site and in-frame deletion variants distributed
    across the protein, including the PLP-binding domain. A recurrent nonsense
    allele, c.1591C>T p.(Arg531*), has been seen in several unrelated
    populations.
  evidence:
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recurrent c.1591C>T, p.(Arg531*) variant has been reported three times
      (20% of all reported variants) in different populations, indicating it may
      be a probable hotspot mutation.
    explanation: >-
      Documents the recurrent p.(Arg531*) nonsense allele and its share of
      reported variants.
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The mutation is located in the PLP‐binding domain, which is important for the activity of the protein"
    explanation: >-
      Locates a reported missense allele in the pyridoxal-phosphate-binding
      domain, the structural basis on which missense alleles are argued to impair
      catalysis. Evidence source is COMPUTATIONAL because the functional inference
      rests on docking and molecular-dynamics simulation, not an enzyme assay.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    The diagnosis rests on identification of biallelic pathogenic GAD1 variants,
    typically by exome sequencing, in an infant with neonatal-onset epileptic
    encephalopathy. There is no specific biochemical marker in routine use;
    metabolic screening was normal in the reported case where it was performed.
  evidence:
  - reference: PMID:32705143
    reference_title: "Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings highlight an important role for GAD1 in seizure induction,
      neuronal and extraneuronal development, and introduce GAD1 as a new gene
      associated with developmental and epileptic encephalopathy.
    explanation: >-
      Establishes GAD1 as the gene to be tested in this presentation; the
      diagnosis is molecular.
- name: Neuroimaging
  description: >-
    Brain MRI is normal in most patients early on; later imaging at older ages can
    show atrophic change, so a normal early MRI does not argue against the
    diagnosis.
  evidence:
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The majority of the patients had normal MRI, although, in some patients,
      later MRI at older ages revealed defects.
    explanation: >-
      Records that MRI is usually normal initially with later abnormalities in
      some. Evidence source is OTHER because this is the paper's literature
      summary.
treatments:
- name: Vigabatrin
  description: >-
    Vigabatrin irreversibly inhibits GABA transaminase, the enzyme that degrades
    GABA, and is therefore a mechanistically rational attempt to raise whatever
    GABA the residual synthetic capacity produces. Five of seven patients in the
    founding cohort who tried it had a good seizure response, but the authors
    themselves cautioned that the responders were particularly those with
    epileptic spasms, so the effect may be semiology-driven rather than
    GAD1-specific.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  target_mechanisms:
  - target: GABA Depletion
    treatment_effect: RESTORES
    description: >-
      Blocking GABA catabolism is intended to raise the available GABA pool and
      partially offset the synthetic deficit. The link is mechanistic rationale
      plus an observed clinical seizure response, not a measured rise in human
      brain GABA.
    evidence:
    - reference: PMID:33169137
      reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both treatment strategies are thought to increase the available pool of
        GABA, and combined they might compensate for the severely impaired GABA
        synthesis.
      explanation: >-
        States the intended mechanism - raising the available GABA pool to
        compensate for impaired synthesis - for vigabatrin and the ketogenic diet.
  evidence:
  - reference: PMID:33169137
    reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our report, five of seven patients who tried vigabatrin showed a
      remarkably good seizure response.
    explanation: >-
      Reports the vigabatrin response rate in the founding cohort. Support is
      PARTIAL because the same authors attribute the response partly to seizure
      type (epileptic spasms) rather than to the GAD1 genotype.
- name: Ketogenic Diet
  description: >-
    The ketogenic diet is used alongside vigabatrin on the same rationale of
    increasing the available GABA pool. Its disease-specific evidence is a single
    treated infant with an excellent outcome set against at least two patients on
    the same combination who remained refractory.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Ketogenic Diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  target_mechanisms:
  - target: GABA Depletion
    treatment_effect: RESTORES
    description: >-
      The diet is proposed to increase the available GABA pool; this is a
      hypothesized mechanism carried over from ketogenic-diet pharmacology
      generally, not a measurement made in GAD1-deficient patients.
    evidence:
    - reference: PMID:33169137
      reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both treatment strategies are thought to increase the available pool of
        GABA, and combined they might compensate for the severely impaired GABA
        synthesis.
      explanation: >-
        States the intended GABA-raising mechanism shared by the ketogenic diet
        and vigabatrin.
  evidence:
  - reference: PMID:33169137
    reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient (Patient C) also appears to take a combination of ketogenic
      diet and vigabatrin at the age of 28 months, and still has refractory
      seizures and severe delay.
    explanation: >-
      Records a treated patient who remained refractory on the same combination.
      Support is PARTIAL because the disease-specific evidence for the diet
      points in both directions.
- name: Early Combined Vigabatrin and Ketogenic Diet
  description: >-
    Combination therapy started in the second month of life, immediately after
    genetic diagnosis, was reported in one infant to stop seizures within two days
    and leave growth and psychomotor development unremarkable at 7 months - a
    striking exception in a disorder where a neonatal burst-suppression EEG has
    otherwise predicted profound delay. It is one observation, and another patient
    on the same combination started later remained refractory.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  evidence:
  - reference: PMID:33169137
    reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This combination treatment not only resulted in clinical cessation of
      seizures within 2 days, but at 7 months of age, growth and psychomotor
      development were unremarkable.
    explanation: >-
      Reports the single favourable outcome on early combination therapy. Support
      is PARTIAL because the same commentary explicitly cautions against drawing

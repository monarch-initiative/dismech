treatments:
- name: Vigabatrin
  description: >-
    Vigabatrin irreversibly inhibits GABA transaminase, the enzyme that degrades
    GABA, and is therefore a mechanistically rational attempt to raise whatever
    GABA the residual synthetic capacity produces. Five of seven patients in the
    founding cohort who tried it had a good seizure response, but the authors
    themselves cautioned that the responders were particularly those with
    epileptic spasms, so the effect may be semiology-driven rather than
    GAD1-specific.

    The rationale has a published objection, and it is a mechanistic one rather
    than a null trial result: sparing GABA from degradation cannot help much when
    synthesis is the step that has failed, since GAD67 supplies over 90% of basal
    GABA. The 2023 review states that vigabatrin is therefore not a suitable
    solution "at least for mutations that result in severe reduction or complete
    loss of the enzyme function" - a genotype-stratified claim, which is the same
    residual-activity axis this entry records as an open gap. Two treated
    patients, including one on the vigabatrin-plus-ketogenic-diet combination,
    continued to have seizures. Both sides are curated as evidence below rather
    than resolved here, because the objection is an inference from the mechanism
    and the response is an observation, and neither refutes the other.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  target_mechanisms:
  - target: GABA Depletion
    treatment_effect: RESTORES
    description: >-
      Blocking GABA catabolism is intended to raise the available GABA pool and
      partially offset the synthetic deficit. The link is mechanistic rationale
      plus an observed clinical seizure response, not a measured rise in human
      brain GABA.
    evidence:
    - reference: PMID:33169137
      reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Both treatment strategies are thought to increase the available pool of
        GABA, and combined they might compensate for the severely impaired GABA
        synthesis.
      explanation: >-
        States the intended mechanism - raising the available GABA pool to
        compensate for impaired synthesis - for vigabatrin and the ketogenic diet.
    - reference: PMID:37029735
      reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
      supports: REFUTE
      evidence_source: OTHER
      snippet: "it seems that prescribing vigabatrin for patients with GAD1 deficiency is not a suitable solution, at least for mutations that result in severe reduction or complete loss of the enzyme function."
      explanation: >-
        The direct argument against this link. Because GAD67 supplies most basal
        GABA, blocking catabolism has little left to spare where the variant
        abolishes synthesis, so the restorative effect is expected to fail for
        null and severe-reduction alleles. `treatment_effect` remains RESTORES
        because that is the intended mechanism the drug is chosen for; this item
        records that the intent is disputed on mechanistic grounds. Evidence
        source is OTHER because this is the paper's reasoning over the literature
        rather than a measurement.
  evidence:
  - reference: PMID:33169137
    reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our report, five of seven patients who tried vigabatrin showed a
      remarkably good seizure response.
    explanation: Five of seven treated patients in the authors' original cohort improved, particularly
      those with spasms. This may be a semiology-related response rather than a genotype-specific
      effect.
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: He suffers from refractory tonic–clonic seizures despite treatment with a combination
      of vigabatrin and a ketogenic diet.
    explanation: The 2023 index patient remained refractory on the combination. A separate patient
      in Neuray et al. also remained refractory, as summarized in the reply.

- name: Ketogenic Diet
  description: >-
    The ketogenic diet is used alongside vigabatrin on the same rationale of
    increasing the available GABA pool. Its disease-specific evidence is a single
    treated infant with an excellent outcome set against at least two patients on
    the same combination who remained refractory.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Ketogenic Diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  target_mechanisms:
  - target: GABA Depletion
    treatment_effect: RESTORES
    description: >-
      The diet is proposed to increase the available GABA pool; this is a
      hypothesized mechanism carried over from ketogenic-diet pharmacology
      generally, not a measurement made in GAD1-deficient patients.
    evidence:
    - reference: PMID:33169137
      reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Both treatment strategies are thought to increase the available pool of
        GABA, and combined they might compensate for the severely impaired GABA
        synthesis.
      explanation: >-
        States the intended GABA-raising mechanism shared by the ketogenic diet
        and vigabatrin.
  evidence:
  - reference: PMID:33169137
    reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient (Patient C) also appears to take a combination of ketogenic
      diet and vigabatrin at the age of 28 months, and still has refractory
      seizures and severe delay.
    explanation: The reply summarizes a patient from the independent cohort who remained refractory
      on the combination; the treatment-start age was not reported. This argues against uniform benefit.

- name: Early Combined Vigabatrin and Ketogenic Diet
  description: Combination therapy started in the second month of life, immediately after genetic
    diagnosis, was reported in one infant to stop seizures within two days and leave growth and psychomotor
    development unremarkable at 7 months - a striking exception in a disorder where a neonatal burst-suppression
    EEG has otherwise predicted profound delay. It is one observation, and another patient on the
    same combination with unreported treatment-start age remained refractory.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  evidence:
  - reference: PMID:33169137
    reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This combination treatment not only resulted in clinical cessation of
      seizures within 2 days, but at 7 months of age, growth and psychomotor
      development were unremarkable.
    explanation: The reply summarizes a single infant treated by another group; seven-month follow-up
      does not establish sustained developmental benefit.
  - reference: PMID:33169137
    reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While this is certainly a reasonable hypothesis, one should be cautious
      drawing conclusions from one single observation.
    explanation: >-
      The authors' own caution about the strength of the single-patient
      developmental-outcome claim.
  target_mechanisms:
  - target: GABA Depletion
    treatment_effect: RESTORES
    description: >-
      Both components are proposed to raise the available GABA pool - vigabatrin
      by blocking GABA catabolism, the ketogenic diet by shifting substrate
      availability - so the combination is directed at the same depletion node
      each single agent targets. The effect is an inferred mechanism, not a
      measured rise in human brain GABA.
    evidence:
    - reference: PMID:33169137
      reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Both treatment strategies are thought to increase the available pool of
        GABA, and combined they might compensate for the severely impaired GABA
        synthesis.
      explanation: The authors propose increasing the available GABA pool; GABA restoration was not
        measured in treated patients.

- name: Individualized Antiseizure Medication
  description: >-
    No single antiseizure medication has emerged as the treatment of choice.
    Across the patients whose epilepsy was controlled there was no drug in
    common, so regimen choice remains empirical.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we found that there was no common drug therapy among patients whose
      epilepsy was controlled
    explanation: >-
      Documents the absence of a shared effective drug across controlled cases,
      supporting individualized rather than protocolized therapy.

animal_models:
- name: Gad1-null mouse (GAD67 knockout)
  species: Mouse
  genotype: Gad1 (GAD67) homozygous null
  publication: PMID:9177246
  description: >-
    Targeted disruption of exon 1 of mouse Gad1 abolishes GAD67. Homozygotes are
    born at Mendelian frequency but die on the first morning after birth with
    severe cleft palate, and cortical GABA is reduced to 7% of wild type. Because
    death is neonatal, the model cannot be used to study the epilepsy that defines
    the human disorder.
  evidence:
  - reference: PMID:9177246
    reference_title: "Cleft palate and decreased brain gamma-aminobutyric acid in mice lacking the 67-kDa isoform of glutamic acid decarboxylase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These mice were born at the expected frequency but died of severe cleft
      palate during the first morning after birth.
    explanation: >-
      Establishes the model and its neonatal lethal cleft-palate phenotype, which
      is what makes it informative for the malformation arm and uninformative for
      the epilepsy arm.
  modeled_mechanisms:
  - target: GABA Depletion
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Direct biochemical measurement of the depletion: cortical GAD activity
      under 20% and GABA content 7% of wild type in newborn nulls.
    limitations: >-
      Measured in newborn mouse cerebral cortex; the equivalent measurement has
      not been made in human patients, so the magnitude is transferred by
      inference.
    readouts:
    - name: Cerebral cortical GABA content
      target: GABA Depletion
      description: >-
        HPLC measurement of GABA in cerebral cortex homogenate of P0.5 nulls
        against wild-type littermates.
      direction: DECREASED
      interpretation: >-
        GABA at 7% of wild type is the quantitative correlate of the depletion
        node.
      evidence:
      - reference: PMID:9177246
        reference_title: "Cleft palate and decreased brain gamma-aminobutyric acid in mice lacking the 67-kDa isoform of glutamic acid decarboxylase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          GAD activities and GABA contents were reduced to 20% and 7%,
          respectively, in the cerebral cortex of the newborn GAD67 -/- mice.
        explanation: Reports the cortical GAD activity and GABA measurements.
    evidence:
    - reference: PMID:9177246
      reference_title: "Cleft palate and decreased brain gamma-aminobutyric acid in mice lacking the 67-kDa isoform of glutamic acid decarboxylase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        GAD activities and GABA contents were reduced to 20% and 7%,
        respectively, in the cerebral cortex of the newborn GAD67 -/- mice.
      explanation: >-
        Supports treating the null mouse as informative for the GABA-depletion
        node.
  - target: Failure of Palatal Shelf Elevation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Gad1-null mouse histology demonstrates failed palatal shelf elevation and cleft palate.
      CNS-specific deletion and oral explants support a neural movement-dependent mechanism, but the
      corresponding fetal intermediate has not been measured in human patients.
    limitations: Mouse cleft palate is highly penetrant and lethal, whereas the human malformation
      is variable and survivable. Human shelf elevation is not directly observed. The separate mouse
      umbilical-hernia finding does not establish identical human omphalocele.
    readouts:
    - name: Secondary palate fusion
      target: Failure of Palatal Shelf Elevation
      description: >-
        Gross and histological examination of the upper jaw and coronal facial
        sections in newborn and E17.5 animals.
      direction: ABOLISHED
      interpretation: >-
        Complete failure of secondary palate formation in every homozygote is the
        structural readout for this node.
      evidence:
      - reference: PMID:9177246
        reference_title: "Cleft palate and decreased brain gamma-aminobutyric acid in mice lacking the 67-kDa isoform of glutamic acid decarboxylase."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Severe cleft palate was found in all homozygous mutants
        explanation: Reports full penetrance of the cleft palate readout.
    evidence:
    - reference: PMID:20333300
      reference_title: Cleft palate is caused by CNS dysfunction in Gad1 and Viaat knockout mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In both genotypes, palate shelf elevation fails to occur at E14.5 and all Gad1 and
        Viaat mutants were born with cleft secondary palates (Fig. 3A-H and data not shown).
      explanation: Mouse histology identifies failed shelf elevation preceding cleft palate; the human
        developmental intermediate is inferred from the model.
      directness: INDIRECT
    - reference: PMID:20333300
      reference_title: Cleft palate is caused by CNS dysfunction in Gad1 and Viaat knockout mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In all cases the ViaatlacZ and Gad1lacZ mutant explants underwent palatal shelf outgrowth
        and elevation in culture.
      explanation: Mutant shelves can elevate after removal from the embryonic context, supporting
        an indirect neural movement-dependent cause.
  - target: Early-Onset Epileptic Seizures
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The defining human phenotype - neonatal epilepsy - cannot be observed in
      this model. Homozygotes die within a day of birth from the cleft palate, and
      their brains show no discernible structural defect, so the model gives no
      information about the seizure phenotype.
    limitations: >-
      This is a negative result by inaccessibility rather than by measurement: the
      animals do not survive long enough for an epilepsy phenotype to develop or
      be recorded, and no EEG was obtained. It should not be read as evidence that
      GAD67 loss fails to cause seizures.
    evidence:
    - reference: PMID:32705143
      reference_title: "Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1 variants."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        as Gad1-/- mice die neonatally of severe cleft palate, it has not been
        possible to determine any potential neurological dysfunction
      explanation: >-
        States explicitly that neonatal lethality prevents the mouse from
        informing the neurological phenotype.
    - reference: PMID:9177246
      reference_title: "Cleft palate and decreased brain gamma-aminobutyric acid in mice lacking the 67-kDa isoform of glutamic acid decarboxylase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Their brain, however, did not show any discernible defects.
      explanation: >-
        The original report found no brain abnormality in the nulls, consistent
        with the model being uninformative about the neurological phenotype.

- name: Gad1-null rat
  species: Rat
  genotype: Gad1 homozygous knockout
  publication: PMID:37830095
  description: >-
    Unlike the mouse, Gad1-null rats survive to adulthood and can be recorded by
    chronic EEG. They show abundant spike-wave discharges from two months of age
    and reduced GABA immunoreactivity in reticular thalamic neuronal somata. The
    seizure phenotype is absence-type spike-wave discharge, not the neonatal
    spasms and suppression-burst pattern of the human disorder.
  evidence:
  - reference: PMID:37830095
    reference_title: "Gad1 knock-out rats exhibit abundant spike-wave discharges in EEG, exacerbated with valproate treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SWDs were abundant in EEG from Gad1 (-/-) rats as young as 2 months old.
    explanation: >-
      Establishes that this model, unlike the mouse, survives to yield an
      electrographic seizure phenotype.
  modeled_mechanisms:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      GAD1 loss in the rat produces a hypersynchronous electrographic phenotype,
      supporting the general link from GABA synthesis failure to network
      hypersynchrony.
    limitations: >-
      The discharge type is absence-like spike-wave activity in adolescent and
      adult animals, mechanistically a thalamocortical oscillation, rather than
      the neonatal epileptic spasms and suppression-burst background that define
      the human disease. Common laboratory rat strains also show spike-wave
      discharges spontaneously, so the phenotype is a shift in severity against a
      noisy background rather than an all-or-none disease model. Valproate, which
      suppressed discharges in controls, made them worse in the nulls, so drug
      responses in this model should not be transferred to patients.
    readouts:
    - name: Reticular thalamic somatic GABA immunoreactivity
      target: Neuronal Hyperexcitability and Hypersynchrony
      description: >-
        Immunohistochemistry for GABA in reticular thalamic nucleus neurons of
        null versus control rats.
      direction: DECREASED
      interpretation: >-
        Confirms that the electrographic phenotype is accompanied by the expected
        loss of GABA in the implicated inhibitory nucleus.
      evidence:
      - reference: PMID:37830095
        reference_title: "Gad1 knock-out rats exhibit abundant spike-wave discharges in EEG, exacerbated with valproate treatment."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          GABA immunoreactivity was significantly reduced in the somata of RTN
          neurons in Gad1 (-/-) rats but not in their axons targeting the
          thalamus.
        explanation: Reports the immunohistochemical GABA measurement.
    evidence:
    - reference: PMID:37830095
      reference_title: "Gad1 knock-out rats exhibit abundant spike-wave discharges in EEG, exacerbated with valproate treatment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        VPA treatment alleviated SWD symptoms in control rats, however,
        counterintuitively exacerbated the symptoms in Gad1 (-/-) rats.
      explanation: >-
        The paradoxical valproate response is why this model is treated as only
        partially informative and its pharmacology is not transferred to patients.

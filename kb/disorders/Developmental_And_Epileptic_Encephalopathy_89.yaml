discussions:
- discussion_id: gap_dee89_missense_sparing_of_malformations
  prompt: >-
    Do GAD1 missense variants genuinely spare palatal and ventral wall
    development, and if so is that because they retain residual decarboxylase
    activity above a developmental threshold that truncating alleles fall below?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Palatal Shelf Elevation
  - pathophysiology#Impaired GABA-Dependent Fetal Motor Signaling
  - pathophysiology#Impaired Retraction of Physiological Umbilical Hernia
  rationale: The 2023 published-case comparison reported no cleft palate or omphalocele among missense
    cases, but the sample was small and enzyme activity was not quantified for the alleles. A residual-activity
    threshold is a testable explanation, not an established allelic subtype or prognosis.
  proposed_experiments:
  - experiment_id: exp_dee89_gad1_missense_residual_activity
    name: Residual decarboxylase activity of patient GAD1 missense alleles
    description: >-
      Express the reported missense alleles alongside truncating alleles and wild
      type, and measure glutamate decarboxylase activity and GABA production, to
      test whether the missense alleles retain measurable residual activity.
  evidence:
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the comparison of clinical symptoms between patients with missense and
      truncating mutations did not show any significant clinical difference,
      except that patients with missense mutations did not show cleft palates or
      omphaloceles.
    explanation: This is a small published-case comparison, not a systematic genotype-stratified cohort
      or enzyme assay.

- discussion_id: mismatch_dee89_gad1_null_mouse_neonatal_lethality
  prompt: >-
    Can any Gad1-loss animal model inform the neurological arm of DEE 89, given
    that the mouse null dies of cleft palate before an epilepsy phenotype can
    emerge and the surviving rat null has a mechanistically different seizure
    type?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Early-Onset Epileptic Seizures
  - pathophysiology#Neuronal Hyperexcitability and Hypersynchrony
  rationale: Gad1-null mice die neonatally, limiting postnatal epilepsy assessment. Surviving null
    rats provide a neurological model with frequent spike-wave discharges from about two months, but
    no overt convulsive seizures in the study. Their EEG pattern, retained stimulus responsiveness
    and paradoxical valproate response differ from human neonatal spasms and suppression-burst. They
    inform GAD1 network biology without directly reproducing the human seizure syndrome.
  proposed_experiments:
  - experiment_id: exp_dee89_palate_rescued_gad1_mouse_eeg
    name: Palate-rescued conditional Gad1 mouse with neonatal EEG
    description: >-
      Generate a Gad1 null with palatal development rescued (for example by
      tissue-restricted expression), so that homozygotes survive the neonatal
      period, and record EEG through the neonatal and infantile period to
      establish whether a suppression-burst and spasm phenotype develops.
  evidence:
  - reference: PMID:32705143
    reference_title: "Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1 variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      as Gad1-/- mice die neonatally of severe cleft palate, it has not been
      possible to determine any potential neurological dysfunction
    explanation: States the inaccessibility of the neurological phenotype in the mouse null.
  - reference: PMID:37830095
    reference_title: "Gad1 knock-out rats exhibit abundant spike-wave discharges in EEG, exacerbated with valproate treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      VPA treatment alleviated SWD symptoms in control rats, however,
      counterintuitively exacerbated the symptoms in Gad1 (-/-) rats.
    explanation: >-
      The rat null's paradoxical drug response illustrates why its pharmacology
      cannot be transferred to patients.

- discussion_id: gap_dee89_early_combination_therapy_and_developmental_outcome
  prompt: >-
    Does starting vigabatrin plus a ketogenic diet in the first weeks after
    genetic diagnosis change developmental outcome in DEE 89, or only seizure
    frequency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Developmental Encephalopathy
  - pathophysiology#GABA Depletion
  rationale: 'One infant started on the combination in the second month of life had seizures stop
    within two days and normal growth and psychomotor development at 7 months, which is remarkable
    against a cohort in which every patient with a neonatal burst-suppression EEG had profound delay.
    But a second patient on the same combination, with unreported treatment-start age, remained refractory
    with severe delay, and the commentary authors explicitly caution against generalizing from a single
    case. Because the disorder is ultra-rare and a critical treatment window has not been established,
    the question is unlikely to be settled by a conventional trial and needs a prospective registry
    with a pre-specified developmental endpoint.

    There is also a mechanistic objection that any such registry would have to stratify for. Vigabatrin
    works by blocking GABA catabolism, so it can only spare GABA that is being made; where the variant
    abolishes GAD67 activity there is little to spare, and the 2023 review argues on that basis that
    vigabatrin is not a suitable solution for severe-reduction or complete-loss alleles. That makes
    residual enzyme activity - the same quantity the allelic knowledge gap in this entry asks about
    - the plausible determinant of who responds, and it is not measured in any reported patient. The
    same review notes that oral GABA does not cross the blood-brain barrier but that brain-penetrant
    GABA derivatives might, which is the alternative route if the catabolism-blocking rationale really
    does fail at low residual activity.'
  proposed_experiments:
  - experiment_id: exp_dee89_treat_on_diagnosis_registry
    name: Prospective treat-on-diagnosis registry with developmental endpoints
    description: >-
      Enrol newly genetically diagnosed infants, record time from diagnosis to
      start of combination therapy, and follow standardized developmental
      assessments, so that outcome can be related to treatment latency rather
      than compared across ad hoc case reports.
  - experiment_id: exp_dee89_vigabatrin_response_by_residual_activity
    name: Vigabatrin response stratified by residual GAD67 activity
    description: >-
      For each reported allele, measure residual glutamate decarboxylase activity
      and relate it to that patient's vigabatrin response, to test the review's
      prediction that the drug fails where activity is abolished and works only
      where some synthesis remains.
  evidence:
  - reference: PMID:33169137
    reference_title: "Reply: Rational therapy with vigabatrin and a ketogenic diet in a patient with GAD1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of a neonatal burst-suppression pattern on EEG generally has a
      dire prognosis, and all families reported in our study indeed had a
      profound developmental delay.
    explanation: >-
      Establishes the baseline against which the single favourable outcome stands
      out, and hence why the question is open rather than answered.
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it seems that prescribing vigabatrin for patients with GAD1 deficiency is not a suitable solution, at least for mutations that result in severe reduction or complete loss of the enzyme function."
    explanation: The review proposes a genotype-dependent limitation of vigabatrin; this mechanistic
      objection does not itself resolve the developmental-outcome question.
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, the production of GABA derivatives with the ability to cross the blood–brain barrier may be useful for controlling epilepsy in these patients."
    explanation: >-
      Names the alternative therapeutic route the same authors propose if the
      catabolism-blocking rationale fails - brain-penetrant GABA derivatives,
      since oral GABA does not cross the blood-brain barrier. Evidence source is
      OTHER because this is the paper's proposal rather than data.

- discussion_id: gap_dee89_neuroimaging

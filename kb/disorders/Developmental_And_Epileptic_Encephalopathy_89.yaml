    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 10 patients, from whom early disease history was available, presented
      with seizure onset in the first month of life, mainly consisting of
      epileptic spasms or myoclonic seizures.
    explanation: The ten-person denominator refers only to evaluable early histories in this 11-patient
      cohort, not to all published patients.
  - reference: PMID:37029735
    reference_title: "Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular dynamics simulation, and a comprehensive clinical and molecular profile."
    supports: SUPPORT
    evidence_source: OTHER

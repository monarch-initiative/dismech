- name: GABA Depletion
  description: >-
    GAD67 supplies the large majority of basal GABA in the CNS, so its loss
    depletes the GABA pool rather than merely trimming it - the intact GAD65
    isoform, which is nerve-terminal-localized and demand-activated, does not
    substitute. This node captures the single concept of reduced GABA
    availability, and is the branch point at which the neural and the
    developmental/structural arms of the syndrome separate.

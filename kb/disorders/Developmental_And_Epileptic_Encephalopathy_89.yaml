- name: Impaired GABA-Dependent Fetal Motor Signaling
  description: Developing CNS GABA signaling supports fetal motor activity. Mouse CNS-specific deletion
    disrupts palatal development even when palatal Gad1 expression is retained; normal mutant palate
    fusion in explants argues against a required palate-intrinsic lesion. Translation of this motor
    mechanism to human malformations is provisional.
  role: mediator
  biological_scale: TISSUE
  evidence:
  - reference: PMID:20333300
    reference_title: Cleft palate is caused by CNS dysfunction in Gad1 and Viaat knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Our work strongly supports the idea that the cleft palate phenotype in Gad1 and Viaat
      knockout mice is due to a loss of GABA signaling in the CNS rather than in craniofacial tissues.
    explanation: CNS-specific deletion, pharmacological rescue and oral explants support the mouse
      mechanism.
    directness: INDIRECT
  downstream:
  - target: Reduced Fetal Movement
    description: Impaired fetal CNS signaling reduces movements needed for normal morphogenesis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

name: Developmental and Epileptic Encephalopathy 89
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: developmental and epileptic encephalopathy 89
  term:
    id: MONDO:0030856
    label: developmental and epileptic encephalopathy 89
synonyms:
- DEE89
- DEE 89
- GAD1 deficiency
- GAD67 deficiency
description: >-
  Developmental and epileptic encephalopathy 89 (DEE 89) is an autosomal
  recessive, early-onset epileptic encephalopathy caused by biallelic
  loss-of-function variants in GAD1. GAD1 encodes GAD67, one of the two glutamic
  acid decarboxylase isoforms that convert glutamate to GABA. GAD67 is the
  constitutively active, cytoplasmic isoform and supplies the large majority of
  basal CNS GABA, so its loss is not buffered by the intact GAD2/GAD65 isoform -
  which is what makes a recessive defect in a single biosynthetic enzyme
  sufficient to abolish inhibitory tone from birth.

  The clinical picture is therefore an inhibitory-failure epilepsy. Seizures are
  universal; onset across the reported literature runs from birth to six months,
  and was within the first month in every evaluable patient of the founding
  cohort. The semiologies are heterogeneous - epileptic spasms and myoclonic
  seizures predominate, with tonic-clonic and focal motor seizures also reported -
  and the EEG shows suppression-burst or hypsarrhythmia. Developmental impairment
  is severe to profound, and roughly a third of reported patients died in early
  childhood.

  What distinguishes DEE 89 from most channelopathy DEEs is a second,
  non-neuronal arm. GAD67-derived GABA also acts as a developmental signal
  outside the nervous system, and the Gad1-null mouse dies at birth of cleft
  palate. Human patients reproduce that: cleft palate, omphalocele, joint
  contractures and talipes equinovarus are part of the syndrome, and the
  contractures are plausibly a fetal-akinesia consequence of the same GABA
  deficit. This entry curates the neural and the developmental/structural arms
  as two branches from one shared GABA-depletion node rather than deriving the
  malformations from the seizures.

  Two things are deliberately left unresolved. First, an allelic pattern that is
  suggestive but not established: in the assembled literature series, patients
  carrying missense variants had neither cleft palate nor omphalocele, while the
  neurological phenotype did not differ between missense and truncating
  variants. That is a small-n observation across published case reports, not a
  measured residual-activity study, so it is recorded as a discussion rather
  than curated as a subtype. Second, the therapeutic question: vigabatrin (which
  blocks GABA catabolism) and the ketogenic diet both aim to raise the residual
  GABA pool, and one infant treated with the combination from the second month
  of life had seizure cessation and normal psychomotor development at 7 months -
  against a background in which every other reported patient with a neonatal
  burst-suppression EEG had profound delay. A single observation on one side and
  a treated patient who remained refractory on the other is not enough to
  establish that early combination therapy alters developmental outcome.

name: Developmental and Epileptic Encephalopathy 89
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: developmental and epileptic encephalopathy 89
  term:
    id: MONDO:0030856
    label: developmental and epileptic encephalopathy 89
synonyms:
- DEE89
- DEE 89
- GAD1 deficiency
- GAD67 deficiency
description: >-
  Developmental and epileptic encephalopathy 89 (DEE 89) is an autosomal
  recessive disorder associated with biallelic GAD1 variants that impair GAD67,
  an enzyme converting glutamate to GABA. Mouse experiments demonstrate marked
  depletion of cortical GABA; residual synthesis and compartment-specific
  compensation by GAD2/GAD65 vary, and human brain GABA has not been measured in
  the reviewed clinical studies.

  Epilepsy was reported in the published DEE89 cohorts, with onset from birth
  to six months. Chatron et al. reported first-month onset in ten patients with
  an available early history, whereas Neuray et al.'s six patients had onset at
  two to six months. Seizure types and medication response vary. EEG may show
  suppression-burst, hypsarrhythmia or other epileptiform abnormalities.
  Developmental impairment is usually severe, but one older patient had moderate
  intellectual disability and an early-treated infant had unremarkable
  psychomotor development at seven months, a short follow-up exception.

  GABA deficiency can affect neural development as well as inhibitory network
  function. Developmental deficits persisted despite seizure control in several
  patients. Structural findings include cleft palate, omphalocele, contractures
  and clubfoot. CNS-specific Gad1 deletion and palate explant experiments in
  mice support a fetal motor mechanism for palatal abnormalities, rather than
  requiring a primary defect within the palate. The human authors likewise
  propose reduced fetal movement as a cause of contractures and malformations;
  that extrapolation remains provisional, and mouse umbilical hernia is not
  identical to human omphalocele.

  Additional motor, swallowing, ocular, auditory, renal and dysmorphic findings
  are variably reported, often in single patients. A small published-case
  comparison found fewer major malformations with missense alleles, without
  measuring residual GAD67 activity. Neither that observation nor the single
  favourable early combination-treatment outcome establishes a genotype-specific
  prognosis or a developmental treatment effect.


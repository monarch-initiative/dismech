- name: Developmental Encephalopathy
  description: 'Impaired neurodevelopment generally causes major cognitive, language and motor limitations,
    sometimes with regression. Severity varies: one older child had moderate intellectual disability
    and some speech and ambulation, and an early-treated infant had unremarkable development at seven
    months. Deaths in the original cohort had heterogeneous causes and are not treated as a single
    developmental endpoint.'
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32705143
    reference_title: Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1
      variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most patients did not achieve any speech or non-verbal communication, only one was reported
      to have developed simple speech and basic perceptive language skills.
    explanation: The six-patient cohort documents a range of developmental outcomes.
  - reference: PMID:32705143
    reference_title: Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1
      variants.
    supports: SUPPORT

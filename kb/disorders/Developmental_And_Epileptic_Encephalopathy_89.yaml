    reference_title: Cleft palate is caused by CNS dysfunction in Gad1 and Viaat knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In both genotypes, palate shelf elevation fails to occur at E14.5 and all Gad1 and Viaat
      mutants were born with cleft secondary palates (Fig. 3A-H and data not shown).
    explanation: Mouse histology identifies failed shelf elevation preceding cleft palate; the human
      developmental intermediate is inferred from the model.
    directness: INDIRECT
  - reference: PMID:32282878
    reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic
      encephalopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Further studies demonstrated that the presence of cleft palate is due to a defect of
      foetal oral movement of the tongue during palatal development and Gad1 is specifically required
      in the CNS for normal palatal formation
    explanation: The clinical authors interpret prior mouse experiments as a CNS-dependent fetal oral-movement

      explanation: The clinical authors propose this movement/posture/retraction route. Mouse histology
        establishes umbilical hernia, so extension to human omphalocele remains a hypothesis.
      directness: INDIRECT

phenotypes:
- name: Seizures
  description: Epilepsy was present in the published DEE89 cohorts and case reports reviewed through
    2023. These epilepsy-ascertained cases do not establish complete penetrance of all biallelic GAD1
    variants.
  category: Neurological
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:32705143
    reference_title: Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1
      variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A key clinical feature common to all affected individuals was early onset seizures (from
      2 to 6 months), predominantly focal motor seizures with and without impaired awareness (two
      with additional epileptic spasms, four with focal non-motor seizures, and five with bilateral
      motor seizures).
    explanation: All six patients in this cohort had epilepsy; this is a cohort observation rather
      than a penetrance estimate.

- name: Neonatal-Onset Seizures

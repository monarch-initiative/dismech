  prompt: Which imaging changes are primary developmental lesions and which reflect secondary injury
    or fluid-space changes?
  rationale: Most initial MRI scans were normal. Some patients later developed atrophy, whereas others
    had callosal hypoplasia or hydrocephalus with craniocervical anomalies. The reviewed sources do
    not resolve primary GABA-dependent development, seizure-related injury and coincident structural
    causes. MRI volume loss does not by itself establish the regional cellular mechanism. The 2023
    microcephaly report also raises cerebral palsy as an alternative attribution.

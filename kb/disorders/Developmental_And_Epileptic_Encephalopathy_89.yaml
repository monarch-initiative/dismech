- name: Excitation-Inhibition Imbalance
  description: >-
    Depletion of the principal inhibitory neurotransmitter shifts the balance
    between glutamatergic excitation and GABAergic inhibition toward net
    excitation. This node captures the single concept of the excitation-inhibition
    imbalance and conforms to the shared epilepsy final common pathway.

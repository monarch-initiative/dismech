- name: Impaired GABA-Dependent Axial Motor Development
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: The clinical authors propose that constitutive GABA deficiency impairs axial motor
    development, explaining axial hypotonia. This interpretation is not a demonstrated circuit lesion
    or an explanation for every abnormal motor sign.
  evidence:
  - reference: PMID:32282878
    reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic
      encephalopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: This most likely reflects the detrimental impact of a constitutive GABA deficiency on
      neurodevelopment.
    explanation: The authors specifically propose a developmental effect of constitutive GABA deficiency
      to explain axial hypotonia. Their comparison with stiff-person syndrome does not establish the
      cause of other motor signs in DEE89.
    directness: INDIRECT
  downstream:
  - target: Hypotonia
    description: Impaired axial motor development is the authors' proposed cause of axial hypotonia;
      the responsible circuitry and developmental intermediates remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32282878
      reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and
        epileptic encephalopathy.

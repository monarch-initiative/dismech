- discussion_id: gap_dee89_drug_response
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Refractory Drug Response
  prompt: Which features determine antiseizure medication resistance?
  rationale: Both control and resistance occur. The represented GABA-deficiency seizure pathway explains
    epilepsy but does not establish why one patient responds and another does not. Seizure type, residual
    GAD67 activity, treatment timing and drug choice remain competing explanations.
  evidence:
  - reference: PMID:32705143
    reference_title: Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1
      variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Seizures were pharmacologically controlled in three of six affected individuals, with
      three reported as drug-resistant.
    explanation: Three of six patients had drug-resistant epilepsy; this phenotype describes antiseizure
      treatment response, not a distinct seizure type.

- discussion_id: gap_dee89_motor_sign_localization
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Spasticity
  - phenotypes#Hyperreflexia
  - phenotypes#Clonus
  - phenotypes#Dystonia
  - phenotypes#Choreoathetosis
  - phenotypes#Hyporeflexia
  prompt: Which inhibitory motor circuits account for increased tone and brisk reflexes, which generate
    dystonia or choreoathetosis, and why does one patient instead have hyporeflexia?
  rationale: The authors explicitly propose a developmental explanation for axial hypotonia and genetically
    attribute weakness; those qualified causal relations are represented. For increased tone, the
    paper compares DEE89 with stiff-person syndrome, whose spinal and supraspinal disinhibition is
    an analogy rather than a demonstrated DEE89 mechanism. The case descriptions of spasticity and
    brisk reflexes establish the signs but do not localize their causal lesion. Clonus in the 2023
    patient, dystonia emerging during follow-up, choreoathetotic arm movements and hyporeflexia in
    patient E likewise lack a source-established circuit explanation. These are unresolved phenotype-specific
    localization and attribution questions, not missing steps in an otherwise established central
    motor pathway.
  evidence:
  - reference: PMID:32282878
    reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic
      encephalopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: This autoimmune disorder is thought to result in an impairment of spinal and supra-spinal
      inhibitory neurons, leading to excessive excitatory drive upon the motor neurons.
    explanation: The antecedent is stiff-person syndrome, not DEE89. This comparison supplies a hypothesis
      for increased tone but does not demonstrate the circuit responsible for DEE89 spasticity or
      reflex findings.
    directness: INDIRECT
  - reference: PMID:32282878
    reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic
      encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He initially showed reduced muscle tone and developed spasticity and dystonia as well
      as scoliosis later during the disease course.
    explanation: Case 7 documents evolution of tone and dystonia without identifying the causal circuit.
  - reference: PMID:32282878
    reference_title: Bi-allelic GAD1 variants cause a neonatal onset syndromic developmental and epileptic
      encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She kept her hands fisted with flexion of wrists and her arms movements were uncoordinated
      and choreathetotic.
    explanation: Case 11 documents choreoathetotic arm movements; this observation is not evidence
      that the axial-hypotonia mechanism causes them.
  - reference: PMID:32705143
    reference_title: Early-infantile onset epilepsy and developmental delay caused by bi-allelic GAD1
      variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: '| Neurological examination | Mild hypotonia | Brisk DTR, stereotypic hand movements,
      oral automatisms | Mild hypotonia, spasticity in lower extremities, oropharyngeal dysphagia
      | Severe hypotonia, dysphagia (floppy epiglottis) | Severe hypotonia, hyporeflexia, dysphagia
      | Severe hypotonia |'
    explanation: Hyporeflexia was recorded in patient E in Table 1 of Neuray et al., contrasting with
      brisk reflexes in other patients. The source does not localize the reflex impairment.
  - reference: PMID:37029735
    reference_title: 'Developmental and epileptic encephalopathy 89: A novel bi-allelic variant, molecular
      dynamics simulation, and a comprehensive clinical and molecular profile.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This study's patient, in addition to typical symptoms of the DEE89, showed microcephaly
      and clonus in the toe, which were novel clinical findings.
    explanation: The 2023 report calls the toe movement clonus; its proposed motor pathway was not
      studied.


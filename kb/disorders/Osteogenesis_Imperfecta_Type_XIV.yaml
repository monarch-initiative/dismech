- name: Insufficient Bone Matrix, Reduced Mineralization, and Skeletal Fragility
  biological_scale: TISSUE
  description: >-
    Reduced collagen deposition and impaired osteoblast differentiation and
    function, together with low bone turnover, produce an insufficient bone
    extracellular matrix with reduced trabecular bone volume, low bone mineral
    density (osteopenia), and skeletal fragility. In human TMEM38B bone biopsies
    (Webb et al., 2017), trabecular bone volume, osteoblast numbers, and
    osteoclast numbers are reduced while bone matrix mineralization density is
    normal and nanoporosity is low — contrasting with the hypermineralization of
    classical collagen-defect OI and with the poor matrix mineralization
    observed in Tric-b-knockout mice and CRISPR TMEM38B-knockout human fetal
    osteoblast cultures. Clinically this manifests as recurrent fractures,
    growth deficiency, and long-bone bowing/deformity.
  notes: >-
    Node name is retained for pathograph stability. GO:0030282 (bone
    mineralization, modifier: DECREASED) captures the defective matrix
    mineralization demonstrated in Tric-b-knockout mice (PMID:38123563) and
    TMEM38B-knockout hFOB 1.19 osteoblasts (PMID:34582479), whereas human
    pediatric iliac bone biopsies show normal matrix mineralization density with
    low nanoporosity and reduced trabecular bone volume (PMID:28323974).

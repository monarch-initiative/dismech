- name: Intrinsic Osteoclast Defect and Low Bone Turnover
  biological_scale: CELLULAR
  description: >-
    Human TMEM38B-mutant transiliac bone biopsies demonstrate markedly reduced
    osteoclast numbers with >80% reduction in bone resorption alongside reduced
    osteoblast numbers, defining a low-bone-turnover state distinct from classic
    high-turnover collagen-defect OI. Predominance of Tmem38b (TRIC-B) over
    Tmem38a (TRIC-A) expression in osteoclasts supports a cell-autonomous
    osteoclast defect resulting from TRIC-B loss.

diagnosis:
- name: Molecular Genetic Diagnosis
  description: >-
    OI type XIV is suspected in an infant or child with recessive OI (recurrent
    fractures from infancy, osteopenia, deformity) when COL1A1/COL1A2 and other
    recessive OI genes are negative. Diagnosis is confirmed by identifying
    biallelic loss-of-function TMEM38B variants by gene-panel or exome
    sequencing; supportive cellular findings include undetectable TRIC-B protein
    with altered ER Ca2+ flux and reduced collagen secretion in patient cells.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:23054245
    reference_title: "Study of autosomal recessive osteogenesis imperfecta in Arabia reveals a novel locus defined by TMEM38B mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used autozygome guided mutation analysis of AR OI (AR OI) genes
      followed by exome sequencing when such analysis failed to identify the
      causative mutation.
    explanation: >-
      Molecular genetic testing (autozygosity mapping and exome sequencing)
      establishes the TMEM38B diagnosis of OI type XIV.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates (e.g., pamidronate, zoledronic acid, neridronate)
    are the pharmacological mainstay of OI type XIV, increasing lumbar spine bone
    mineral density and reducing fracture burden despite persistent residual bone
    fragility. They are antiresorptive and do not correct the underlying ER
    calcium-channel defect.
  notes: >-
    Although human TMEM38B-mutant bone already exhibits low bone turnover with
    >80% reduction in bone resorption (PMID:28323974), bisphosphonate-treated
    probands achieved a median +1.7 increase in lumbar spine BMD z-score; the
    long-term balance between BMD gain and further suppression of bone
    remodeling in this intrinsically low-turnover state remains a clinical
    consideration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:
    - preferred_term: bisphosphonate
      term:
        id: NCIT:C443
        label: Biphosphonate
  target_mechanisms:
  - target: Insufficient Bone Matrix, Reduced Mineralization, and Skeletal Fragility
    treatment_effect: MODULATES
    description: >-
      Antiresorptive bisphosphonates increase lumbar spine bone mineral density
      z-scores in TMEM38B probands without correcting the upstream ER TRIC-B
      channel defect.
    evidence:
    - reference: PMID:28323974
      reference_title: "Phenotypic Spectrum in Osteogenesis Imperfecta Due to Mutations in TMEM38B: Unraveling a Complex Cellular Defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Proband lumbar spine bone density z score was reduced ... and increased
        by +1.7 (1.17 to 3.0; n = 3) following bisphosphonate therapy.
      explanation: >-
        Quantifies the lumbar spine bone mineral density z-score gain (+1.7 in
        three treated probands) following bisphosphonate therapy in OI type XIV.
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bisphosphonates continue to be used most extensively in those with
      vertebral fractures, frequent long bone fractures, or more severe OI.
    explanation: >-
      GeneReviews documents bisphosphonates as the mainstay pharmacotherapy for
      OI with frequent fractures or more severe disease, the management category
      that applies to OI type XIV.
  - reference: PMID:28323974
    reference_title: "Phenotypic Spectrum in Osteogenesis Imperfecta Due to Mutations in TMEM38B: Unraveling a Complex Cellular Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probands are responsive to bisphosphonates and some show muscular and
      cardiovascular features possibly related to intracellular calcium flux
      abnormalities.
    explanation: >-
      OI-type-XIV-specific evidence: the TMEM38B natural-history cohort documents
      probands as responsive to bisphosphonate therapy (lumbar spine bone density
      z score increased following treatment).
- name: Orthopedic Surgery and Intramedullary Rodding
  description: >-
    Intramedullary (telescoping) rod fixation and corrective osteotomy stabilize
    fracture-prone, deformed long bones; spinal surgery addresses progressive
    scoliosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intramedullary rodding when
      indicated to provide anatomic positioning of limbs
    explanation: >-
      GeneReviews documents intramedullary rodding as standard orthopedic
      management for OI long-bone fractures and deformity.
- name: Physical Therapy and Rehabilitation
  description: >-
    Physical and occupational therapy improve mobility and muscle strength and
    prevent contractures and deformity; early physical therapy follows brief
    post-fracture immobilization.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fractures are treated with as
      short a period of immobility as is practical, small and lightweight casts, and
      physical therapy as soon as casts are removed
    explanation: >-
      GeneReviews documents early physical therapy and brief immobilization as
      part of standard OI fracture rehabilitation.
animal_models:
- name: Tric-b knockout mouse
  species: Mouse
  genotype: Tric-b (Tmem38b) homozygous knockout
  publication: PMID:38123563
  description: >-
    Tric-b-knockout mouse lacking the ER monovalent cation channel TRIC-B, which
    reproduces deranged ER Ca2+ handling, procollagen retention with PERK/eIF2a
    ER-stress activation in growth-plate chondrocytes, reduced osteoblast
    extracellular-matrix synthesis, and poor bone mineralization.
  modeled_mechanisms:
  - target: TMEM38B Loss Eliminates the ER Cation Channel TRIC-B and Disrupts ER Calcium Flux
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Knockout cells show impaired ER Ca2+ release with elevated cytoplasmic
      Ca2+ and exacerbated PERK/eIF2a ER stress.
    evidence:
    - reference: PMID:38123563
      reference_title: "Atypical cell death and insufficient matrix organization in long-bone growth plates from Tric-b-knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ca2+ imaging detected aberrant Ca2+ handling in the knockout
        chondrocytes; ER Ca2+ release was impaired, while cytoplasmic Ca2+ level
        was elevated.
      explanation: >-
        Demonstrates impaired ER Ca2+ release and deranged intracellular calcium
        handling in Tric-b-knockout skeletal cells.
  - target: Insufficient Bone Matrix, Reduced Mineralization, and Skeletal Fragility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Deranged ER Ca2+ handling in Tric-b-knockout osteoblasts and growth-plate
      chondrocytes reduces extracellular matrix synthesis and causes poor bone
      mineralization.
    limitations: >-
      Tric-b-knockout mice exhibit poor bone mineralization and perinatal
      lethality, whereas human TMEM38B-mutant iliac bone biopsies show reduced
      trabecular bone volume and low turnover with normal bone matrix
      mineralization density and low nanoporosity (PMID:28323974).
    evidence:
    - reference: PMID:38123563
      reference_title: "Atypical cell death and insufficient matrix organization in long-bone growth plates from Tric-b-knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We have reported that Tric-b-knockout mice can be used as an OI model;
        Tric-b deficiency deranges ER Ca2+ handling and thus reduces
        extracellular matrix (ECM) synthesis in osteoblasts, leading to poor
        mineralization.
      explanation: >-
        Establishes that the Tric-b-knockout mouse models reduced osteoblast ECM
        synthesis and defective mineralization in vivo.
experimental_models:
- name: CRISPR/Cas9 TMEM38B-knockout hFOB 1.19 human fetal osteoblasts
  experimental_model_type: CELL_LINE
  publication: PMID:34582479
  description: >-
    CRISPR/Cas9-engineered human fetal osteoblast hFOB 1.19 clones completely
    lacking TRIC-B expression, modeling osteoblast-intrinsic defects of OI type
    XIV.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  genes:
  - preferred_term: TMEM38B
    term:
      id: hgnc:25535
      label: TMEM38B
  modeled_mechanisms:
  - target: Dysregulated Collagen Synthesis and Defective Secretion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Knockout osteoblast clones reproduce altered ER calcium flux, abnormal
      type I collagen structure, and impaired collagen secretion observed in OI
      type XIV patient cells.
    evidence:
    - reference: PMID:34582479
      reference_title: "Knocking out TMEM38B in human foetal osteoblasts hFOB 1.19 by CRISPR/Cas9: A model for recessive OI type XIV."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Few clones were validated as good models for the disease since they
        reproduce the altered ER calcium flux, collagen I structure and impaired
        secretion and osteoblastic markers expression detected in patients' cells.
      explanation: >-
        Validates CRISPR TMEM38B-null hFOB 1.19 osteoblasts as faithful cellular
        models of altered ER Ca2+ flux and impaired type I collagen secretion.
  - target: Insufficient Bone Matrix, Reduced Mineralization, and Skeletal Fragility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Knockout clones exhibit impaired osteoblast proliferation and reduced in
      vitro matrix mineralization.
    limitations: >-
      Upward scale extrapolation from a CELLULAR monolayer osteoblast culture to
      a TISSUE-scale skeletal outcome: hFOB 1.19 cultures measure in-vitro
      calcium/mineral deposition nodules and lack 3D trabecular architecture,
      osteoclast-coupled remodeling, and mechanical loading, and human
      TMEM38B-mutant bone biopsies show normal matrix mineralization density
      despite reduced trabecular bone volume (PMID:28323974).
    divergences:
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        Monolayer hFOB 1.19 osteoblast cultures observe cellular proliferation
        and in-vitro mineral deposition rather than tissue-level trabecular bone
        volume, osteoclast-coupled remodeling, or whole-bone mechanical
        fragility.
    evidence:
    - reference: PMID:34582479
      reference_title: "Knocking out TMEM38B in human foetal osteoblasts hFOB 1.19 by CRISPR/Cas9: A model for recessive OI type XIV."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Impaired proliferation and mineralization in KO clones unveiled the
        relevance of TRIC-B in osteoblasts functionality.
      explanation: >-
        Demonstrates impaired osteoblast proliferation and matrix mineralization
        upon TMEM38B knockout in vitro.

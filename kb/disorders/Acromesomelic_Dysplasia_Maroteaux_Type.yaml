    explanation: The landmark functional assays directly show deficient receptor catalytic activity.
  - reference: PMID:32694885
    reference_title: "A novel NPR2 mutation (p.Arg388Gln) in a patient with acromesomelic dysplasia, type Maroteaux."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cells expressing HA-R388Q-NPRB showed negligible cGMP responses to C-type
      natriuretic peptide (CNP) stimulation, indicating that the mutation led
      to severe loss-of-function.
    explanation: A patient-associated receptor shows a negligible CNP-stimulated cGMP response.
  downstream:
  - target: Growth-Plate Proliferative and Hypertrophic Zone Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced cGMP-dependent protein kinase II signaling
    - MEK/ERK disinhibition in the NPR2-deficient growth plate
    description: >-
      Reduced NPR-B/cGMP signaling alters downstream cGKII and MEK/ERK control,
      reducing proliferative and hypertrophic growth-plate zones.
    evidence:
    - reference: PMID:23065701
      reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutant tibiae have increased levels of the activated form of ERK1/2,
        consistent with the idea that natriuretic peptide receptor type 2
        (NPR2) signaling inhibits the activation of the MEK/ERK mitogen
        activated protein kinase pathway.
      explanation: The Npr2-deficient mouse connects receptor loss to ERK activation in tibiae.
    - reference: PMID:33106379
      reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        C-type natriuretic peptide (CNP), its endogenous receptor, natriuretic
        peptide receptor-B (NPR-B), as well as its downstream mediator, cyclic
        guanosine monophosphate (cGMP) dependent protein kinase II (cGKII), have
        been shown to play a pivotal role in chondrogenic differentiation and
        endochondral bone growth.
      explanation: The PRKG2 study identifies cGKII as the downstream mediator linking NPR-B/cGMP to chondrogenic growth.

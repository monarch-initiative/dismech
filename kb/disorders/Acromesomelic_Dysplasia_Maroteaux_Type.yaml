phenotypes:
- category: Skeletal
  name: Severe Disproportionate Short-Limb Short Stature
  description: >-
    Severe short stature is disproportionate, with the limbs more affected than
    the trunk and the middle and distal limb segments most affected. Final
    height is usually below 120 cm, although milder cases occur.
  phenotype_term:
    preferred_term: Disproportionate short-limb short stature
    term:

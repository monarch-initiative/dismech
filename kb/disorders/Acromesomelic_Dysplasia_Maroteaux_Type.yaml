name: Acromesomelic Dysplasia Maroteaux Type
creation_date: "2026-04-02T12:00:00Z"
category: Mendelian
description: >-
  Acromesomelic dysplasia, Maroteaux type (AMDM) is a rare autosomal recessive
  skeletal dysplasia caused by biallelic loss-of-function variants in NPR2,
  which encodes natriuretic peptide receptor B (NPR-B). Allele-specific defects
  in RNA processing, receptor trafficking, or catalytic activity reduce C-type
  natriuretic peptide (CNP)-stimulated cGMP
  signaling in growth-plate chondrocytes. The resulting impairment of
  proliferative and hypertrophic growth-plate zones reduces endochondral
  longitudinal bone growth. AMDM causes disproportionate short-limb short
  stature, acromesomelic shortening, brachydactyly, short hands and feet, and
  characteristic vertebral and epiphyseal radiographic findings. Growth is
  often normal at birth and decelerates during the first two years. Mild and
  variable frontal prominence or a depressed nasal bridge may occur;
  intelligence is generally reported as normal.
disease_term:
  preferred_term: acromesomelic dysplasia, Maroteaux type
  term:
    id: MONDO:0011275
    label: acromesomelic dysplasia 1, Maroteaux type
parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: acromesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 16 "Acromesomelic dysplasias"; listed under dyadic
      naming as the NPR2-linked Maroteaux type (OMIM 602875). The 2019 revision
      (Mortier et al., PMID:31633310) placed the same entity in group 16 as
      "Acromesomelic dysplasia type Maroteaux (AMDM)", so the group assignment is
      unchanged across the two revisions.
    evidence:
    - reference: PMID:39441036
      reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The remaining three ACD types encompass NPR2-linked Maroteaux type (OMIM
        #602875), the PRKG2-linked ACD type (OMIM #619636) and Osebold-Remondini
        type, which is not yet associated with a genomic locus (OMIM #112910).
      explanation: >-
        A 2024 report enumerating the seven acromesomelic chondrodysplasia types
        recognised by the 2023 nosology revision places the NPR2-linked Maroteaux
        type inside that group.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_high: 0.1
  notes: >-
    Orphanet reports a worldwide point prevalence below one per million. This
    is a broad rare-disease estimate rather than a population-based AMDM
    registry measurement.
  evidence:

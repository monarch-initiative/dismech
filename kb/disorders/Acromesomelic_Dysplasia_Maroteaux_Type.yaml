animal_models:
- species: Mus musculus
  genotype: Npr2(cn/cn) loss-of-function
  description: >-
    The cn/cn mouse has Npr2 loss of function and recapitulates disproportionate
    dwarfism with a shortened physeal hypertrophic zone. Chondrocyte
    ultrastructure is preserved, supporting a growth-plate-zone defect rather
    than a primary matrix-synthesis abnormality.
  genes:
  - preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  evidence:
  - reference: PMID:25319082
    reference_title: "The cn/cn dwarf mouse. Histomorphometric, ultrastructural, and radiographic study in mutants corresponding to human acromesomelic dysplasia Maroteaux type (AMDM)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The cn/cn dwarf mouse is caused by a loss-of-function mutation in the
      natriuretic peptide receptor 2 (NPR-2) gene which helps positively
      regulate endochondral longitudinal bone growth.
    explanation: The study establishes cn/cn as an Npr2 loss-of-function skeletal model.
- species: Mus musculus
  genotype: Npr2(pwe/pwe) 4-bp deletion
  description: >-
    The peewee mouse carries a truncating Npr2 deletion and models AMDM skeletal
    growth failure. Increased activated ERK1/2 in mutant tibiae and rescue of
    fetal tibia explants by MEK inhibitors provide preclinical pathway evidence;
    they do not establish a human AMDM treatment.
  genes:
  - preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  evidence:
  - reference: PMID:23065701
    reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The Npr2(pwe/pwe) mouse is a model for the human skeletal dysplasia
      acromesomelic dysplasia, Maroteaux type (AMDM).
    explanation: The publication explicitly identifies the peewee mouse as an AMDM model.
  - reference: PMID:23065701
    reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Treatment of fetal tibiae explants with mitogen activated protein kinase
      1 and 2 inhibitors U0126 and PD325901 rescues the Npr2(pwe/pwe) growth
      defect, providing a promising foundation for skeletal dysplasia
      therapeutics.
    explanation: The fetal-tibia explant result is preclinical evidence for MEK/ERK pathway modulation.
diagnosis:
- name: Characteristic Physical Examination
  description: >-
    Examination identifies disproportionate short-limb stature with
    acromesomelic shortening, brachydactyly, and short broad hands and feet.
    Craniofacial findings are mild and variable; normal intelligence is typical.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:35368703
    reference_title: "Novel Loss-of-Function Mutations in NPR2 Cause Acromesomelic Dysplasia, Maroteaux Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acromesomelic dysplasia, Maroteaux type (AMDM) is a rare skeletal
      dysplasia characterized by severe disproportionate short stature, short
      hands and feet, normal intelligence, and facial dysmorphism.
    explanation: The clinical description supports the characteristic examination pattern.
- name: Skeletal Radiographic Evaluation
  description: >-
    Skeletal radiographs assess mesomelic shortening, short broad metacarpals
    and phalanges, cone-shaped epiphyses, vertebral flattening or pear shape,
    lumbar interpedicular narrowing, and long-bone bowing. The pattern can
    support diagnosis even when stature is only mildly affected.
  diagnosis_term:
    preferred_term: radiograph imaging procedure
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given these findings, a diagnosis of AMDM should be considered in
      individuals with characteristic radiological findings, even if stature is
      only modestly affected.
    explanation: The report directly supports diagnostic use of the radiographic pattern.
- name: Biallelic NPR2 Molecular Confirmation
  description: >-
    Molecular genetic testing confirms the diagnosis by identifying pathogenic
    or likely pathogenic variants affecting both NPR2 alleles. Transcript-level
    analysis can resolve suspected splice effects, including synonymous
    variants.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:15146390
    reference_title: "Mutations in the transmembrane natriuretic peptide receptor NPR-B impair skeletal growth and cause acromesomelic dysplasia, type Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced DNA from 21 families affected by AMDM and found 4 nonsense
      mutations, 4 frameshift mutations, 2 splice-site mutations, and 11
      missense mutations.
    explanation: The landmark study establishes biallelic NPR2 variant detection as the molecular basis of AMDM.
  - reference: PMID:42442044
    reference_title: A synonymous NPR2 variant causes acromesomelic dysplasia through aberrant pre-mRNA splicing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis using patient-derived leukocyte RNA revealed
      aberrant splicing leading to partial exon truncation, frameshift, and
      premature termination of NPR2
    explanation: Patient-derived RNA demonstrates the value of transcript analysis for a splice-altering synonymous allele.
differential_diagnoses:
- name: PRKG2-Related Acromesomelic Dysplasia
  description: >-
    Biallelic PRKG2 loss causes a downstream cGMP-pathway skeletal dysplasia with
    severe short stature, acromesomelia, brachydactyly, platyspondyly, and
    progressive metaphyseal changes, closely overlapping NPR2-related AMDM.
  distinguishing_features:
  - Biallelic PRKG2 variants, rather than biallelic NPR2 variants, establish this diagnosis.
  - Progressively increasing metaphyseal long-bone alterations were prominent in the initial PRKG2 cases.
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing was performed in two girls with severe short stature due
      to acromesomelic limb shortening, brachydactyly, mild to moderate
      platyspondyly and progressively increasing metaphyseal alterations of the
      long bones.
    explanation: The founding PRKG2 series documents the overlapping phenotype and progressive metaphyseal pattern.
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two homozygous PRKG2 variants, a nonsense and a frameshift, were identified.
    explanation: The genetic finding distinguishes this downstream-pathway disorder from NPR2-related AMDM.
- name: Acromesomelic Dysplasia, Hunter-Thompson Type
  disease_term:
    preferred_term: acromesomelic dysplasia 2C, Hunter-Thompson type
    term:
      id: MONDO:0008717
      label: acromesomelic dysplasia 2C, Hunter-Thompson type
  description: >-
    Hunter-Thompson acromesomelic dysplasia belongs to the GDF5/BMPR1B spectrum
    and overlaps AMDM in distal limb shortening and brachydactyly.
  distinguishing_features:
  - Craniofacial and axial skeleton are generally unaffected, unlike the vertebral and mild craniofacial findings in AMDM.
  - Lower limbs are more severely affected; square phalanges, a single fifth-digit phalanx, ankle dislocation, or radial-head dislocation can occur.
  evidence:
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In AMDH the lower limbs are more severely affected, phalanges tend to
      square and there may be a single phalangeal bone in the fifth digit. Ankle
      dislocation is common and radial head dislocation may be present
    explanation: The review supplies the distinguishing Hunter-Thompson radiographic pattern.
- name: Acromesomelic Dysplasia, Grebe Type
  disease_term:
    preferred_term: acromesomelic dysplasia 2A
    term:
      id: MONDO:0008703
      label: acromesomelic dysplasia 2A
  description: >-
    Grebe-type acromesomelic dysplasia is a severe GDF5/BMPR1B-spectrum limb
    dysplasia that overlaps AMDM but has much more destructive appendicular
    involvement.
  distinguishing_features:
  - Severe micromelia with absent or fused carpal, metacarpal, tarsal, metatarsal, or phalangeal bones favors Grebe type.
  - Postaxial polydactyly and major femoral, tibial, fibular, ulnar, or radial abnormalities are not typical AMDM findings.
  evidence:
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AMDG is characterized by severe micromelia. Fusion of the carpals and/or
      metacarpals and tarsals and/or metatarsals maybe present. Metacarpal,
      metatarsal or proximal and/or middle phalanges may be absent. Postaxial
      polydactyly has also been reported.
    explanation: The review provides the severe appendicular findings that distinguish Grebe type.
- name: Acromesomelic Dysplasia, Du Pan Type
  disease_term:
    preferred_term: acromesomelic dysplasia 2B
    term:
      id: MONDO:0009231
      label: acromesomelic dysplasia 2B
  description: >-
    Du Pan type is a milder GDF5/BMPR1B-spectrum acromesomelic dysplasia that can
    overlap AMDM in limb shortening and brachydactyly.
  distinguishing_features:
  - Fibular hypoplasia with complex brachydactyly favors Du Pan type; molecular testing distinguishes GDF5/BMPR1B-spectrum disease from NPR2-related AMDM.
  evidence:
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A milder form with fibular hypoplasia and complex brachydactyly
      (acromesomelic dysplasia, du Pan type) has also been reported
    explanation: The review identifies the characteristic Du Pan pattern.
- name: Acromesomelic Dysplasia, Demirhan Type
  disease_term:
    preferred_term: acromesomelic dysplasia, Demirhan type
    term:
      id: MONDO:0012274
      label: acromesomelic dysplasia 3
  description: >-
    The BMPR1B-related, receptor-side member of the GDF5/BMPR1B half of ISDS
    group 16. Its Grebe-like limb phenotype overlaps AMDM in acromesomelic
    shortening and brachydactyly.
  distinguishing_features:
  - Biallelic BMPR1B variants, rather than biallelic NPR2 variants, establish this diagnosis.
  - >-
    Genital anomalies with hypergonadotrophic hypogonadism were present in the
    index patient and are not a feature of AMDM.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, she presented with hypoplasia of the uterus and ovarian
      dysfunction resulting in hypergonadotrophic hypogonadism.
    explanation: Identifies the extraskeletal feature that separates the BMPR1B disorder from AMDM.
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis of BMPR1B revealed a homozygous 8 bp deletion
      (del359-366).
    explanation: The molecular finding distinguishes this receptor-side disorder from NPR2-related AMDM.
- name: TRPV4-Related Spondyloepimetaphyseal Dysplasia, Maroteaux Type
  disease_term:
    preferred_term: spondyloepimetaphyseal dysplasia, Maroteaux type
    term:
      id: MONDO:0008473
      label: spondyloepimetaphyseal dysplasia, Maroteaux type
  description: >-
    This autosomal dominant TRPV4 skeletal dysplasia shares the Maroteaux eponym
    but is distinct from autosomal recessive NPR2-related acromesomelic
    dysplasia. Both can cause short stature, brachydactyly, spinal deformity,
    and long-bone involvement.
  distinguishing_features:
  - A heterozygous pathogenic TRPV4 variant establishes the TRPV4-related disorder rather than NPR2-related AMDM.
  - The broader TRPV4 spectrum includes progressive spinal deformity and long-bone and pelvic involvement.
  evidence:
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The five autosomal dominant skeletal dysplasias are (from mildest to most
      severe) familial digital arthropathy with brachydactyly, brachyolmia,
      spondylometaphyseal dysplasia (Kozlowski type), spondyloepimetaphyseal
      dysplasia (Maroteaux type), and metatropic dysplasia.
    explanation: GeneReviews identifies the separate autosomal dominant TRPV4 disorder sharing the Maroteaux eponym.
  - reference: PMID:24830047
    reference_title: Autosomal Dominant TRPV4-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of an autosomal dominant TRPV4-related disorder is
      established in a proband who has characteristic clinical and
      neurophysiologic findings, radiographic findings in the skeletal
      dysplasias, and a heterozygous TRPV4 pathogenic variant identified by
      molecular genetic testing.
    explanation: Heterozygous TRPV4 molecular confirmation distinguishes this eponymic differential.
treatments:
- name: Somatropin Therapy
  action_category: THERAPEUTIC
  description: >-
    Recombinant human growth hormone has been reported in two long-term-treated
    siblings and isolated short-term cases. Some height gain occurred, but
    responses are variable and the uncontrolled evidence is too limited to
    establish a standard AMDM regimen or expected final-height benefit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_phenotypes:
  - preferred_term: Disproportionate short-limb short stature
    term:
      id: HP:0008873
      label: Disproportionate short-limb short stature
  evidence:
  - reference: PMID:33238275
    reference_title: "Acromesomelic Dysplasia, Type Maroteaux: Impact of Long-Term (8 Years) High-Dose Growth Hormone Treatment on Growth Velocity and Final Height in 2 Siblings."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Final heights after 8.5 years of GH treatment were 130.5 cm (-6.57 SDS,
      Pt-A) and 134 cm (-4.58 SDS, Pt-B).
    explanation: Two siblings reached the reported final heights after prolonged treatment, without a control group.
  - reference: PMID:35368703
    reference_title: "Novel Loss-of-Function Mutations in NPR2 Cause Acromesomelic Dysplasia, Maroteaux Type."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, rhGH therapy in patient 1 increased the patient's height by
      0.6SDS over 15 months without adversely affecting the trunk-leg
      proportion.
    explanation: One short-term case showed a 0.6-SDS gain; this does not establish general efficacy.
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some individuals with AMDM have been treated with recombinant human
      growth hormone therapy with a variable response
    explanation: The review explicitly characterizes response as variable.
- name: Genetic Counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Genetic counseling is appropriate after molecular confirmation to explain
    autosomal recessive inheritance and to support testing of relatives for the
    known familial variants. Carrier stature is variable and should not be used
    as a substitute for molecular testing.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40551241
    reference_title: "A novel variant in NPR2: C.2291T > C (p.Leu764Pro) identified in a patient with acromesomelic dysplasia Maroteaux type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing confirmed that the variants were inherited from his
      phenotypically normal parents. The proband is compound heterozygous, while
      both parents are heterozygous carriers, indicating an autosomal recessive
      pattern of inheritance.
    explanation: The family demonstrates the recessive carrier relationships relevant to counseling and familial testing.
  - reference: PMID:40551241
    reference_title: "A novel variant in NPR2: C.2291T > C (p.Leu764Pro) identified in a patient with acromesomelic dysplasia Maroteaux type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic diagnosis is also useful to provide adequate counselling to family memebers, including the formulation of the proper recurrence risk"  # codespell:ignore-line
    explanation: The report directly supports using molecular diagnosis to provide family counseling about recurrence risk.

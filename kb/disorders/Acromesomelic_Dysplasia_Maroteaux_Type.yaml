    explanation: The structured Orphanet record supplies the prevalence class and geographic scope.
progression:
- phase: Birth
  age_range: Neonatal period
  notes: >-
    Birth weight, length, and head circumference may be within normal ranges,
    so absence of marked shortening at birth does not exclude AMDM.
  evidence:
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At birth, children with AMDM generally have weight, length and head
      circumference measurements within the normal range.
    explanation: The clinical review describes generally normal anthropometric measurements at birth.
- phase: Early postnatal growth deceleration
  age_range: Infancy through two years
  notes: >-
    Disproportionate limb-growth failure becomes clinically apparent during the
    first two years of life.
  evidence:
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Limb length at birth may be normal but decreased growth becomes obvious
      in the first 2 years of life.
    explanation: This directly defines the typical timing of postnatal growth deceleration.
- phase: Childhood to adulthood
  age_range: Childhood through skeletal maturity
  notes: >-
    Reduced postnatal skeletal growth accumulates into severe adult short
    stature, although residual severity varies and mild molecularly confirmed
    cases occur.
  evidence:
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Postnatal skeletal growth is reduced and final height is usually below 120 cm
    explanation: The review describes the usual longitudinal growth outcome while allowing milder cases.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    AMDM results from biallelic NPR2 loss of function. Heterozygous relatives may
    have reduced mean stature at a group level, but individual carriers can be
    phenotypically normal and do not have the full recessive skeletal dysplasia.
  evidence:
  - reference: PMID:15146390
    reference_title: "Mutations in the transmembrane natriuretic peptide receptor NPR-B impair skeletal growth and cause acromesomelic dysplasia, type Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The autosomal recessive skeletal dysplasia known as "acromesomelic
      dysplasia, type Maroteaux" (AMDM) maps to an interval that contains NPR2.
    explanation: The landmark study explicitly identifies AMDM as autosomal recessive.
  - reference: PMID:40551241
    reference_title: "A novel variant in NPR2: C.2291T > C (p.Leu764Pro) identified in a patient with acromesomelic dysplasia Maroteaux type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing confirmed that the variants were inherited from his
      phenotypically normal parents. The proband is compound heterozygous, while
      both parents are heterozygous carriers, indicating an autosomal recessive
      pattern of inheritance.
    explanation: A recent family demonstrates an affected compound heterozygote with phenotypically normal carrier parents.
  - reference: PMID:15146390
    reference_title: "Mutations in the transmembrane natriuretic peptide receptor NPR-B impair skeletal growth and cause acromesomelic dysplasia, type Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also found that obligate carriers of NPR2 mutations have heights that
      are below the mean for matched controls.
    explanation: The landmark family series supports reduced mean stature among obligate carriers while not implying that every carrier is short.
genetic:
- name: Biallelic NPR2 Loss-of-Function Variants
  gene_term:
    preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Causative alleles include nonsense, frameshift, splice-site, synonymous
    splice-altering, and missense variants. Functional consequences are
    allele-specific and include abnormal splicing, endoplasmic-reticulum
    retention, and deficient guanylyl-cyclase activity.
  evidence:
  - reference: PMID:15146390
    reference_title: "Mutations in the transmembrane natriuretic peptide receptor NPR-B impair skeletal growth and cause acromesomelic dysplasia, type Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced DNA from 21 families affected by AMDM and found 4 nonsense
      mutations, 4 frameshift mutations, 2 splice-site mutations, and 11
      missense mutations.
    explanation: The landmark family series establishes the allelic spectrum of causative NPR2 variants.
  - reference: PMID:42442044
    reference_title: A synonymous NPR2 variant causes acromesomelic dysplasia through aberrant pre-mRNA splicing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis using patient-derived leukocyte RNA revealed
      aberrant splicing leading to partial exon truncation, frameshift, and
      premature termination of NPR2
    explanation: Patient-derived RNA establishes a synonymous splice-altering loss-of-function mechanism.
pathophysiology:
- name: Biallelic NPR2 Loss of Function
  description: >-
    Pathogenic variants on both NPR2 alleles reduce NPR-B receptor function.
    The alleles span truncating, splice-altering, and missense classes and
    initiate the shared AMDM mechanism.
  genes:
  - preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  evidence:
  - reference: PMID:15146390
    reference_title: "Mutations in the transmembrane natriuretic peptide receptor NPR-B impair skeletal growth and cause acromesomelic dysplasia, type Maroteaux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced DNA from 21 families affected by AMDM and found 4 nonsense
      mutations, 4 frameshift mutations, 2 splice-site mutations, and 11
      missense mutations.
    explanation: Multiple biallelic variant classes were identified across 21 affected families.
  downstream:
  - target: Variant-Specific NPR-B Biogenesis and Catalytic Failure
    causal_link_type: DIRECT
    description: >-
      Individual NPR2 alleles directly impair transcript processing, receptor
      trafficking, or guanylyl-cyclase activity.
    evidence:
    - reference: PMID:42442044
      reference_title: A synonymous NPR2 variant causes acromesomelic dysplasia through aberrant pre-mRNA splicing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional analysis using patient-derived leukocyte RNA revealed
        aberrant splicing leading to partial exon truncation, frameshift, and
        premature termination of NPR2
      explanation: A synonymous NPR2 allele directly produces an abnormal transcript and premature termination.
- name: Variant-Specific NPR-B Biogenesis and Catalytic Failure
  description: >-
    NPR2 variants use several proximal routes to receptor failure. Some cause
    aberrant transcripts or premature truncation; some missense receptors are
    retained in the endoplasmic reticulum; and functional assays of other
    missense alleles show markedly deficient guanylyl-cyclase activity. These
    are convergent allelic mechanisms, not competing disease hypotheses.
  genes:
  - preferred_term: NPR2
    term:
      id: hgnc:7944
      label: NPR2
  evidence:
  - reference: PMID:38078000
    reference_title: "Unveiling the pathogenic mechanisms of NPR2 missense variants: insights into the genotype-associated severity in acromesomelic dysplasia and short stature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results indicate that variants p.Leu51Pro, p.Gly123Val, p.Leu314Arg,
      p.Arg388Gln have defective cellular trafficking, being sequestered within
      the endoplasmic reticulum (ER), and consequently impaired cGMP production
      ability.
    explanation: Functional testing demonstrates ER retention as one allele-specific route to receptor failure.
  - reference: PMID:15146390
    reference_title: "Mutations in the transmembrane natriuretic peptide receptor NPR-B impair skeletal growth and cause acromesomelic dysplasia, type Maroteaux."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Three missense mutations were tested in a functional assay and were found
      to have markedly deficient guanylyl cyclase activity.
    explanation: Functional assays in the landmark AMDM study establish deficient catalytic activity as a convergent consequence of missense alleles.
  downstream:
  - target: Reduced CNP-Stimulated Guanylyl Cyclase Activity and cGMP
    causal_link_type: DIRECT
    description: >-
      The diverse proximal receptor defects converge directly on reduced or
      absent CNP-stimulated cGMP production, with residual activity depending on
      the allele.
    evidence:
    - reference: PMID:38078000
      reference_title: "Unveiling the pathogenic mechanisms of NPR2 missense variants: insights into the genotype-associated severity in acromesomelic dysplasia and short stature."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our results indicate that variants p.Leu51Pro, p.Gly123Val,
        p.Leu314Arg, p.Arg388Gln have defective cellular trafficking, being
        sequestered within the endoplasmic reticulum (ER), and consequently
        impaired cGMP production ability.
      explanation: The trafficking-defective variants directly show impaired cGMP production.
- name: Reduced CNP-Stimulated Guanylyl Cyclase Activity and cGMP
  description: >-
    NPR-B is a homodimeric receptor guanylyl cyclase that produces cytoplasmic
    cGMP after CNP binding. AMDM variants reduce or abolish this response rather
    than universally eliminating all activity.

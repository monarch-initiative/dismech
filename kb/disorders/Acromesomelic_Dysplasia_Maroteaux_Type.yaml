discussions:
- discussion_id: genotype_functional_severity
  prompt: Which NPR2 allele-specific functional defects and residual activities predict AMDM skeletal severity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    NPR2 missense variants differ in trafficking and catalytic behavior, and
    clinically mild AMDM is recognized, but no validated genotype-to-severity
    rule is available. Comparable functional assays linked to standardized
    longitudinal phenotypes are needed.
  attaches_to:
  - pathophysiology#Variant-Specific NPR-B Biogenesis and Catalytic Failure
  - pathophysiology#Reduced CNP-Stimulated Guanylyl Cyclase Activity and cGMP
  evidence:
  - reference: PMID:38078000
    reference_title: "Unveiling the pathogenic mechanisms of NPR2 missense variants: insights into the genotype-associated severity in acromesomelic dysplasia and short stature."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Conversely, variants p.Arg318Gly, p.Arg495Cys, and p.Arg557His seem to
      display a non-statistically significant behavior that is slightly
      comparable to WT-NPR2.
    explanation: The heterogeneous in-vitro behavior motivates a standardized variant-function study.
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: although to date there are no reported genotype-phenotype correlations.
    explanation: The clinical report explicitly identifies the unresolved genotype-phenotype relationship.
- discussion_id: regional_acromesomelic_patterning
  prompt: Why does NPR-B deficiency preferentially shorten middle and distal limb segments while producing milder axial involvement?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Reduced growth-plate signaling explains impaired longitudinal growth, but it
    does not by itself explain the reproducible regional acromesomelic pattern.
    Spatial developmental studies are needed to define segment-specific CNP,
    NPR-B, cGKII, and downstream signaling dependencies.
  attaches_to:
  - pathophysiology#Impaired Endochondral Longitudinal Bone Growth
  - pathophysiology#Acromesomelic Limb Elongation Deficit
  evidence:
  - reference: PMID:34162036
    reference_title: "Acromesomelic dysplasia-Maroteaux type, nine patients with two novel NPR2 variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is a rare type of dwarfism characterized by shortening of the middle
      and distal segments of the limbs with spondylar dysplasia.
    explanation: The consistent regional phenotype defines the pattern that remains mechanistically unexplained.
- discussion_id: genotype_stratified_growth_response
  prompt: Which AMDM genotypes, if any, predict benefit from somatropin or future NPR-B/cGMP-pathway therapies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Somatropin evidence is limited to uncontrolled cases with variable response.
    Complete NPR-B loss and residual-function alleles may differ in their
    response to CNP-pathway strategies, while MEK inhibition remains confined to
    a fetal mouse tibia explant model.
  attaches_to:
  - pathophysiology#Reduced CNP-Stimulated Guanylyl Cyclase Activity and cGMP
  - treatments#Somatropin Therapy
  evidence:
  - reference: PMID:34178199
    reference_title: "A mild case of acromesomelic dysplasia, type Maroteaux with novel natriuretic peptide receptor B (NPR2) variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some individuals with AMDM have been treated with recombinant human
      growth hormone therapy with a variable response
    explanation: Variable reported response motivates prospective genotype-stratified study.
  - reference: PMID:23065701
    reference_title: "A novel loss-of-function mutation in Npr2 clarifies primary role in female reproduction and reveals a potential therapy for acromesomelic dysplasia, Maroteaux type."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Treatment of fetal tibiae explants with mitogen activated protein kinase
      1 and 2 inhibitors U0126 and PD325901 rescues the Npr2(pwe/pwe) growth
      defect, providing a promising foundation for skeletal dysplasia
      therapeutics.
    explanation: The rescue is preclinical and defines a pathway hypothesis rather than a human treatment.
notes: >-
  AMDM is an NPR2 loss-of-function disorder. It is distinct from the allelic
  NPR2 gain-of-function Miura overgrowth phenotype and from the autosomal
  dominant TRPV4-related spondyloepimetaphyseal dysplasia that also uses the
  Maroteaux eponym. Npr2-deficient mouse models show normal skeletal
  mineralization despite reduced growth-plate proliferative and hypertrophic
  zones; AMDM should therefore not be described as a generalized
  mineralization failure.

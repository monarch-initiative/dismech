      ALCL and identifies NPM1 as the most common fusion partner.
  - reference: PMID:11850821
    reference_title: Anaplastic lymphoma kinase (ALK) activates Stat3 and protects hematopoietic cells from cell death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The anaplastic lymphoma kinase (ALK) gene is characteristically
      translocated in Anaplastic Large Cell Lymphomas (ALCL) and the
      juxtaposition of the ALK gene to multiple partners results in its
      constitutive protein tyrosine kinase activity.
    explanation: >-
      The experimental study directly supports constitutive kinase activity of
      ALK fusions.

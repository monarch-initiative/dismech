differential_diagnoses:
- name: Classic Hodgkin Lymphoma
  description: >-
    Hodgkin lymphoma can show overlapping anaplastic morphology and CD30
    expression.
  distinguishing_features:
  - Integrate lineage markers, PAX5, CD15, ALK, and the broader immunophenotypic pattern.
  - Confirm that the morphology and clinical distribution fit an ALCL entity.
  evidence:
  - reference: PMID:28975123
    reference_title: "Systemic and primary cutaneous anaplastic large cell lymphoma: Clinical features, morphological spectrum, and immunohistochemical profile."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, other entities such as diffuse large B-cell lymphoma, peripheral
      T-cell lymphoma, Hodgkin lymphoma, and undifferentiated carcinoma can also
      show similar anaplastic features.
    explanation: >-
      The clinicopathologic study explicitly includes Hodgkin lymphoma among
      mimics with similar anaplastic features.

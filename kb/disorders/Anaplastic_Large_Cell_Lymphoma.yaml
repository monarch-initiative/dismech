- accession: geo:GSE209838
  title: Plasma small-extracellular vesicles enriched in miR-122-5p promote disease aggressiveness in pediatric Anaplastic Large Cell Lymphoma
  description: Emerging evidence shows that small extracellular vesicles (S-EVs) play a critical role in cancer biology. However, the role of S-EVs in pediatric anaplastic large cell lymphoma (ALCL) is still largely unknown. Small RNA sequencing of plasma S-EVs revealed a peculiar microRNA profile in pediatric ALCL patients compared to healthy donors (HD). In particular, the liver-specific miR-122-5p was more abundant in ALCL plasma S-EVs compared to HD. Elevated levels of miR-122-5p correlated with advanced stage disease and impaired hepatic function in ALCL patients.

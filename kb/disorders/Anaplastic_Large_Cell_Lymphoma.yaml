  evidence:
  - reference: PMID:39551572
    reference_title: "Anaplastic lymphoma kinase-negative primary systemic anaplastic large cell lymphoma mimicking a ruptured epidermal cyst of the scalp: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The incidence of anaplastic large cell lymphoma is 0.25 cases per 100,000 people.
    explanation: The literature review supplies the explicit population incidence estimate.
has_subtypes:
- name: Systemic ALK-Positive
  display_name: Systemic ALK-Positive Anaplastic Large Cell Lymphoma
  description: >-
    Systemic ALCL defined by an ALK fusion oncogene, often presenting at
    advanced stage in children, adolescents, and younger adults.
  classification: molecular
  subtype_term:
    preferred_term: ALK-positive anaplastic large cell lymphoma
    term:
      id: MONDO:0017602
      label: ALK-positive anaplastic large cell lymphoma
  evidence:
  - reference: PMID:37655119
    reference_title: ALK-positive anaplastic large cell lymphoma in adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This subtype contains a translocation between the ALK gene on chromosome 2
      and one of several other genes that together form an oncogene.
    explanation: >-
      The review defines the subtype by its ALK translocation-derived oncogene.
  - reference: PMID:37655119
    reference_title: ALK-positive anaplastic large cell lymphoma in adults.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This lymphoma has a median age of 34 years, is more common in males, and
      is in advanced stage at the time of diagnosis in most patients.
    explanation: >-
      The review supports the younger adult distribution and frequent
      advanced-stage presentation.
  - reference: PMID:36907641
    reference_title: Diagnosis and management of ALK-positive anaplastic large cell lymphoma in children and adolescents.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most children and adolescents present in advanced stages, often with
      extranodal disease and B symptoms.
    explanation: >-
      The pediatric review directly supports the age-specific advanced-stage,
      extranodal, and constitutional presentation.
- name: Systemic ALK-Negative
  display_name: Systemic ALK-Negative Anaplastic Large Cell Lymphoma
  description: >-
    Systemic ALCL lacking ALK rearrangement and containing genetically distinct
    DUSP22-rearranged, TP63-rearranged, and two triple-negative molecular groups
    (TN-I and TN-II).
  classification: molecular
  subtype_term:
    preferred_term: ALK-negative anaplastic large cell lymphoma
    term:
      id: MONDO:0017603
      label: ALK-negative anaplastic large cell lymphoma
  evidence:
  - reference: PMID:24894770
    reference_title: ALK-negative anaplastic large cell lymphoma is a genetically heterogeneous disease with widely disparate clinical outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, ALK-negative ALCL is a genetically heterogeneous disease with widely
      disparate outcomes following standard therapy.
    explanation: >-
      The multicenter study supports a systemic ALK-negative subtype with
      clinically meaningful internal heterogeneity.
  - reference: PMID:24894770
    reference_title: ALK-negative anaplastic large cell lymphoma is a genetically heterogeneous disease with widely disparate clinical outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosomal rearrangements of DUSP22 and TP63 were identified in 30% and
      8% of ALK-negative ALCLs, respectively.
    explanation: >-
      The study defines two recurrent genomic subgroups within ALK-negative
      disease.
  - reference: PMID:41329859
    reference_title: "Gene expression profiling reveals 2 overarching types of ALCL with distinct targetable biology: an LLMPP study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We introduce an integrated molecular classification that preserves
      currently diagnosed ALCL entities but identifies 4 molecularly distinct
      ALK- ALCL subtypes (DUSP22-rearranged, TP63-rearranged, TN-I, and TN-II).
    explanation: >-
      The large molecular-profiling study refines triple-negative ALK-negative
      disease into TN-I and TN-II groups.
- name: Primary Cutaneous
  display_name: Primary Cutaneous Anaplastic Large Cell Lymphoma
  description: >-
    A primary cutaneous CD30-positive lymphoproliferative disorder produced by
    skin-homing malignant T cells and requiring separation from systemic ALCL
    with secondary skin involvement.
  classification: anatomical_site
  subtype_term:
    preferred_term: primary cutaneous anaplastic large cell lymphoma
    term:
      id: MONDO:0017598
      label: primary cutaneous anaplastic large cell lymphoma
  evidence:
  - reference: PMID:34382383
    reference_title: Whole-genome profiling of primary cutaneous anaplastic large cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary cutaneous anaplastic large cell lymphoma (pcALCL), a hematological
      neoplasm caused by skin-homing CD30+ malignant T cells, is part of the
      spectrum of primary cutaneous CD30+ lymphoproliferative disorders.
    explanation: >-
      The genomic study directly supports the skin-homing malignant T-cell
      boundary.
  - reference: PMID:21841159
    reference_title: "EORTC, ISCL, and USCLC consensus recommendations for the treatment of primary cutaneous CD30-positive lymphoproliferative disorders: lymphomatoid papulosis and primary cutaneous anaplastic large-cell lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Primary cutaneous CD30(+) lymphoproliferative disorders (CD30(+) LPDs)
      are the second most common form of cutaneous T-cell lymphomas and include
      lymphomatoid papulosis and primary cutaneous anaplastic large-cell
      lymphoma.
    explanation: >-
      International consensus places primary cutaneous ALCL within the
      cutaneous CD30-positive lymphoproliferative-disorder spectrum.
mechanistic_hypotheses:
- hypothesis_group_id: alk_fusion_stat3_model
  hypothesis_label: ALK fusion to STAT3 survival model
  status: CANONICAL
  description: >-
    Constitutive ALK fusion kinase activity activates STAT3, which drives
    anti-apoptotic and immune-evasion programs supporting the ALK-positive
    malignant clone.
  applies_to_subtypes:
  - Systemic ALK-Positive
  evidence:
  - reference: PMID:11850821
    reference_title: Anaplastic lymphoma kinase (ALK) activates Stat3 and protects hematopoietic cells from cell death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show here that expression of activated ALK induces the constitutive
      phosphorylation of Stat3 in transfected cells as well as in primary human
      ALCLs.
    explanation: >-
      The study directly establishes the central ALK-to-STAT3 link.
- hypothesis_group_id: systemic_alk_negative_jak_stat_model
  hypothesis_label: JAK/STAT-driven systemic ALK-negative subset
  status: EMERGING
  description: >-
    In a subset of systemic ALK-negative ALCL, somatic JAK1 and STAT3
    alterations replace ALK fusion signaling as a route to constitutive
    JAK/STAT activation.
  applies_to_subtypes:
  - Systemic ALK-Negative
  evidence:
  - reference: PMID:34572893
    reference_title: "ALK-Negative Anaplastic Large Cell Lymphoma: Current Concepts and Molecular Pathogenesis of a Heterogeneous Group of Large T-Cell Lymphomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additionally, systemic ALK- ALCL-apart from DUSP22-rearranged
      cases-harbors JAK1 and/or STAT3 mutations that result in the activation of
      the JAK/STAT signaling pathway.
    explanation: >-
      The review supports a mutation-driven JAK/STAT branch in systemic
      ALK-negative disease.
- hypothesis_group_id: alcl_type_i_type_ii_molecular_model
  hypothesis_label: pSTAT3-defined type I and epigenetic type II molecular model
  status: EMERGING
  description: >-
    Integrated profiling separates ALCL into pSTAT3-positive type I disease,
    including ALK-positive and TN-I tumors, and pSTAT3-negative type II disease,
    including DUSP22-rearranged, TP63-rearranged, and TN-II tumors. Type II
    disease is enriched for non-tyrosine-kinase and epigenetic-regulator programs.
  applies_to_subtypes:
  - Systemic ALK-Positive
  - Systemic ALK-Negative
  evidence:
  - reference: PMID:41329859
    reference_title: "Gene expression profiling reveals 2 overarching types of ALCL with distinct targetable biology: an LLMPP study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type I ALCLs included ALK+ ALCL and a subset of triple-negative ALCLs
      (TN-I); type II ALCLs included tumors with DUSP22 and/or TP63 rearrangements
      and the remaining triple-negative ALCLs (TN-II).
    explanation: The large molecular-profiling study directly defines the two-type model and its constituent groups.
- hypothesis_group_id: primary_cutaneous_pi3k_mapk_model
  hypothesis_label: PI3K/AKT and MAPK signaling in primary cutaneous ALCL
  status: EMERGING
  description: >-
    Recurrent genomic and transcriptomic alterations converge on
    proliferation-promoting PI3K/AKT, MAPK, and G-protein pathways in primary
    cutaneous ALCL.
  applies_to_subtypes:
  - Primary Cutaneous
  evidence:
  - reference: PMID:34382383
    reference_title: Whole-genome profiling of primary cutaneous anaplastic large cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with the genomic data, transcriptome analysis uncovered
      upregulation of signal transduction routes associated with the PI-3-K,
      MAPK and G-protein pathways (e.g., ERK, phospholipase C, AKT).
    explanation: >-
      Integrated genomic and transcriptomic analysis supports the signaling
      model while leaving individual driver sufficiency unresolved.
pathophysiology:

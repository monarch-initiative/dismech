      reference_title: Sensitivity Analysis of the NPM-ALK Signalling Network Reveals Important Pathways for Anaplastic Large Cell Lymphoma Combination Therapy.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Our results also highlight the importance of a group of interleukins
        together with the Janus kinase 3 (JAK3) / signal transducer and
        activator of transcription 3 (STAT3) signalling in the development of
        NPM-ALK derived ALCL.
      explanation: The simulation explicitly includes and prioritizes the JAK3-STAT3 branch.
  model_type: KINETIC
  publication: PMID:27669408
  notes: >-

name: Anaplastic Large Cell Lymphoma
creation_date: "2026-04-13T05:41:42Z"
category: Cancer
categories:
- Hematologic Malignancy
- T-cell Neoplasm
- Non-Hodgkin Lymphoma
synonyms:
- ALCL
- anaplastic large-cell lymphoma
description: >-
  Anaplastic large cell lymphoma (ALCL) is a CD30-positive mature T-cell
  lymphoma family comprising systemic ALK-positive, systemic ALK-negative, and
  primary cutaneous disease. Breast implant-associated ALCL is represented in
  its own MONDO:0850112 disorder entry because it is an exposure-associated
  entity outside the MONDO:0020325 descendant branch.
definitions:
- name: Pathologic definition of anaplastic large cell lymphoma
  definition_type: CASE_DEFINITION
  description: >-
    ALCL is a mature T-cell lymphoma family unified by strong CD30 expression
    and subdivided here into systemic ALK-positive, systemic ALK-negative, and
    primary cutaneous entities.
  scope: General pathologic and molecular definition of anaplastic large cell lymphoma
  evidence:
  - reference: PMID:40565334
    reference_title: "Molecular Insights into the Diagnosis of Anaplastic Large Cell Lymphoma: Beyond Morphology and Immunophenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anaplastic Large Cell Lymphoma (ALCL) represents a diverse group of mature
      T-Cell Lymphomas unified by strong CD30 expression but with different
      molecular and clinical subtypes.
    explanation: >-
      The review provides the shared disease-family definition used by this
      entry.
- name: International consensus classification framework
  definition_type: OTHER
  description: >-
    The entry follows the modern mature-lymphoid-neoplasm framework in which
    genomic findings refine entity definitions and diagnostic criteria.
  scope: Classification context for mature T-cell lymphoma entities
  evidence:
  - reference: PMID:35653592
    reference_title: "The International Consensus Classification of Mature Lymphoid Neoplasms: a report from the Clinical Advisory Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Major findings from recent genomic studies have impacted the conceptual
      framework and diagnostic criteria for many disease entities.
    explanation: >-
      The International Consensus Classification provides the genomic and
      diagnostic framework used to keep mature lymphoma entities distinct.

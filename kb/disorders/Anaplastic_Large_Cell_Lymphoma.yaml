      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show here that expression of activated ALK induces the constitutive
        phosphorylation of Stat3 in transfected cells as well as in primary
        human ALCLs.
      explanation: >-
        Activated ALK directly induces constitutive STAT3 phosphorylation.

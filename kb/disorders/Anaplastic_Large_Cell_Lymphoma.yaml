    explanation: The publication directly defines the computational scope and purpose.
discussions:
- discussion_id: gap_primary_cutaneous_treatment_evidence
  prompt: >-
    Which primary cutaneous ALCL treatment strategies have comparative
    prospective evidence sufficient to replace case-series-driven selection?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Radiation Therapy
  - treatments#Surgical Excision
  - treatments#Low-Dose Methotrexate for Primary Cutaneous ALCL
  - treatments#Brentuximab Vedotin for Primary Cutaneous ALCL
  - has_subtypes#Primary Cutaneous
  rationale: >-
    Prospective brentuximab data and modern reviews improve the evidence base,
    but most management evidence remains non-randomized. Comparative sequencing,
    risk stratification, and uncommon aggressive variants remain unresolved.
  evidence:
  - reference: PMID:21841159
    reference_title: "EORTC, ISCL, and USCLC consensus recommendations for the treatment of primary cutaneous CD30-positive lymphoproliferative disorders: lymphomatoid papulosis and primary cutaneous anaplastic large-cell lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although a broad spectrum of therapeutic strategies has been reported,
      these have been limited mostly to small retrospective cohort series or
      case reports, and only very few prospective controlled or multicenter
      studies have been performed, which results in a low level of evidence for
      most therapies.
    explanation: >-
      The consensus explicitly identifies the comparative-treatment evidence
      gap.
  - reference: PMID:42192920
    reference_title: "Primary Cutaneous Anaplastic Large Cell Lymphoma: A Review of Diagnosis and Treatment for the General Oncologist."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Overall, current management is supported largely by non-randomized data,
      and key gaps remain in risk stratification, optimal sequencing of
      therapies, and management of uncommon aggressive variants.
    explanation: The current review explicitly confirms the remaining evidence gaps.
  posed_date: "2026-07-21T02:53:02Z"
- discussion_id: gap_dusp22_prognostic_reproducibility
  prompt: >-
    Which clinical and molecular contexts explain the conflicting survival
    estimates for DUSP22-rearranged systemic ALK-negative ALCL?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#DUSP22 Rearrangement
  - has_subtypes#Systemic ALK-Negative
  rationale: >-
    Two multicenter molecular cohorts, including the largest integrated series,
    report survival comparable to ALK-positive disease, whereas an independent
    cohort found no advantage over DUSP22-nonrearranged ALK-negative ALCL.
    Prospective, treatment-annotated molecular cohorts are needed before DUSP22
    alone can determine treatment intensity.
  evidence:
  - reference: PMID:24894770
    reference_title: ALK-negative anaplastic large cell lymphoma is a genetically heterogeneous disease with widely disparate clinical outcomes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five-year overall survival rates were 85% for ALK-positive ALCLs, 90% for
      DUSP22-rearranged ALCLs, 17% for TP63-rearranged ALCLs, and 42% for cases
      lacking all 3 genetic markers (P < .0001).
    explanation: This cohort reported a strongly favorable DUSP22-associated outcome.
  - reference: PMID:41329859
    reference_title: "Gene expression profiling reveals 2 overarching types of ALCL with distinct targetable biology: an LLMPP study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prognosis in systemic ALCL was favorable for DUSP22-rearranged ALCL (5-year
      overall survival, 95%) and ALK+ ALCL (88%), intermediate for triple-negative
      ALCL (TN-I, 52% and TN-II, 37%), and poor for TP63-rearranged ALCL (0%).
    explanation: The largest integrated cohort supports the favorable DUSP22 signal while resolving TN-I, TN-II, and TP63 outcomes.
  - reference: PMID:36453104
    reference_title: DUSP22 rearrangement is associated with a distinctive immunophenotype but not outcome in patients with systemic ALK-negative anaplastic large cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in this cohort DUSP22-R was not associated with a better clinical
      outcome.
    explanation: This independent cohort directly establishes non-reproduction of the favorable association.
  posed_date: "2026-08-04T00:00:00Z"
- discussion_id: gap_npm_alk_mouse_lineage_fidelity
  prompt: >-
    How faithfully does the T-cell-targeted NPM-ALK transgenic mouse reproduce
    mature human ALK-positive ALCL rather than a broader lineage-promiscuous
    lymphoid transformation phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mus musculus
  - pathophysiology#Constitutive ALK Fusion Kinase Activity
  rationale: >-
    The model provides in-vivo evidence that NPM-ALK is oncogenic, but its tumors
    arise largely as immature-thymocyte lymphomas and some mice develop clonal
    plasma-cell neoplasms. Those outputs do not precisely reproduce a mature
    T-cell ALCL entity and bound translational interpretation.
  evidence:
  - reference: PMID:12424201
    reference_title: NPM-ALK transgenic mice spontaneously develop T-cell lymphomas and plasma cell tumors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NPM-ALK Tg thymic lymphomas displayed a T-cell phenotype characteristic of
      immature thymocytes and frequently coexpressed surface CD30. A subset of
      the NPM-ALK Tg mice also developed clonal B-cell plasma cell neoplasms.
    explanation: The observed immature and B-lineage tumors directly define the fidelity mismatch.
  posed_date: "2026-08-04T00:00:00Z"
- discussion_id: gap_relapse_consolidation_sequencing
  prompt: >-
    Can checkpoint blockade or prolonged ALK inhibition replace allogeneic
    transplantation for selected relapsed pediatric ALK-positive ALCL?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Crizotinib
  - treatments#Allogeneic Hematopoietic Stem Cell Transplantation
  rationale: >-
    Multiple agents can reinduce remission, but comparative prospective evidence
    is insufficient to determine which patients require transplantation and
    which can safely continue less intensive targeted or immune therapy.
  evidence:
  - reference: PMID:36907641
    reference_title: Diagnosis and management of ALK-positive anaplastic large cell lymphoma in children and adolescents.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It needs to be shown whether check-point inhibitors or long-term
      ALK-inhibition may substitute for transplantation.
    explanation: The pediatric management review explicitly states the unresolved comparison.
  posed_date: "2026-08-04T00:00:00Z"

computational_models:
- name: NPM-ALK Signaling-Network Sensitivity Model
  description: >-
    A quantitative phenomenological ODE network uses Hill-type transfer
    functions and steady-state sensitivity analysis to rank control points for
    NPM-ALK-driven survival and proliferation. It predicts a predominant
    VAV1-CDC42 contribution to proliferation and RAS-MEK-ERK contribution to
    survival; these predictions require experimental validation.
  modeled_mechanisms:
  - target: Constitutive ALK Fusion Kinase Activity
    description: Models signal flow from NPM-ALK through interacting survival and proliferation pathways.
    evidence:
    - reference: PMID:27669408
      reference_title: Sensitivity Analysis of the NPM-ALK Signalling Network Reveals Important Pathways for Anaplastic Large Cell Lymphoma Combination Therapy.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        We computationally simulated the signalling network which mediates
        pathological cell survival and proliferation through NPM-ALK
      explanation: The model explicitly starts from NPM-ALK-driven signal flow.
  - target: ALK-Driven STAT3 Activation
    description: Models JAK3-STAT3 as one control branch of the NPM-ALK network.
    evidence:

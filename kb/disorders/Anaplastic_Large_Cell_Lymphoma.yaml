prevalence:
- population: General population
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.25
  notes: >-
    A recent clinical literature review reports an annual incidence estimate of

- name: Brentuximab Vedotin Plus CHP
  action_category: THERAPEUTIC
  description: >-
    Frontline brentuximab vedotin plus cyclophosphamide, doxorubicin, and
    prednisone improves progression-free and overall survival over CHOP in
    previously untreated CD30-positive peripheral T-cell lymphomas, with the
    trial population targeted to include 75% systemic ALCL.
  context: Previously untreated systemic ALCL

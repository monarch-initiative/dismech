- accession: ega:EGAS00001004189
  title: Integrative molecular analysis of pediatric Anaplastic large cell lymphoma reveals subtypes with distinct immune suppression signatures.
  description: Anaplastic large cell lymphoma (ALCL) is a peripheral T-cell lymphoma accounting for 10–15% of all childhood lymphomas. While more than 90% of the ALCL cases contain ALK-rearrangement, these tumors possess significant inter-tumor molecular heterogeneity that contributes to distinct morphologic differences and clinical impact. To gain insight into the molecular heterogeneity within ALK+ ALCL, we performed whole-exome sequencing, RNA-sequencing, and methylome analysis of 42 primary pediatric ALK+ ALCL patients. Our data showed that ALK+ALCLs was subclassified into two subtypes based on ALK gene expression, methylation profiles, and somatic mutation patterns.

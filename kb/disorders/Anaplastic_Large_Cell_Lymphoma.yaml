      label: CHP-Brentuximab Vedotin Regimen
  target_mechanisms:
  - target: Systemic CD30-Positive Malignant T-Cell Expansion
    treatment_effect: INHIBITS
    description: >-
      The anti-CD30 conjugate delivers an antimitotic payload to the
      CD30-positive malignant-cell compartment; CHP supplies complementary
      cytotoxic activity.
    evidence:
    - reference: PMID:29279550
      reference_title: "Anaplastic large cell lymphoma: pathology, genetics, and clinical aspects."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        For targeted therapies, an anti-CD30 monoclonal antibody linked to a
        synthetic antimitotic agent (brentuximab vedotin) and ALK inhibitors
        (crizotinib, alectinib, and ceritinib) are being used in clinical
        settings.
      explanation: >-
        The review directly supports CD30-directed delivery of an antimitotic
        payload rather than an incorrect ALK-STAT3 target assignment.
  evidence:
  - reference: PMID:30522922
    reference_title: "Brentuximab vedotin with chemotherapy for CD30-positive peripheral T-cell lymphoma (ECHELON-2): a global, double-blind, randomised, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      METHODS: ECHELON-2 is a double-blind, double-dummy, randomised,
      placebo-controlled, active-comparator phase 3 study. Eligible adults from
      132 sites in 17 countries with previously untreated CD30-positive
      peripheral T-cell lymphomas (targeting 75% with systemic anaplastic large
      cell lymphoma) were randomly assigned 1:1 to receive either A+CHP or CHOP
      for six or eight 21-day cycles.
    explanation: >-
      The phase 3 design directly establishes the intended systemic-ALCL-rich
      frontline population and randomized comparator.
  - reference: PMID:30522922
    reference_title: "Brentuximab vedotin with chemotherapy for CD30-positive peripheral T-cell lymphoma (ECHELON-2): a global, double-blind, randomised, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median progression-free survival was 48·2 months (95% CI 35·2-not
      evaluable) in the A+CHP group and 20·8 months (12·7-47·6) in the CHOP
      group
    explanation: >-
      The randomized trial directly supports improved progression-free survival
      with A+CHP.
  - reference: PMID:40750774
    reference_title: "Brentuximab vedotin plus chemotherapy for the treatment of front-line systemic anaplastic large cell lymphoma: subgroup analysis of the ECHELON-2 study at 5 years' follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      median PFS per investigator was not reached in the A + CHP arm and was
      54.2 months in the CHOP arm, with estimated 5-year PFS rates of 61% versus
      48%, respectively
    explanation: >-
      The ALCL-specific five-year analysis directly supports durable PFS benefit
      in the systemic ALCL subgroup.

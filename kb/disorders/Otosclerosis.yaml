      the fenestral/retrofenestral distinction this entry models as a branch in
      the pathophysiology chain rather than as subtypes.
inheritance:
- name: Autosomal dominant inheritance with reduced penetrance
  description: >-
    Familial otosclerosis segregates as an autosomal dominant trait, but
    penetrance is well below one. The figure most often quoted is about 40%, and
    a contemporary British series found reduced penetrance evident in 44 of 91
    pedigrees. This is the reason linkage mapping in this disease has been so
    unproductive: unaffected obligate carriers are common, so a pedigree
    contributes far less information than its size suggests. Roughly half of all
    patients have no affected relative at all and are better described by the
    polygenic architecture recorded under `genetic`.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by an autosomal dominant mode of inheritance with incomplete penetrance, estimated at 40%"
    explanation: States the mode of inheritance and the penetrance estimate used here.
  - reference: PMID:30540696
    reference_title: The Epidemiology of Otosclerosis in a British Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pedigree analysis is consistent with an autosomal dominant inheritance with reduced penetrance being apparent in 44/91 pedigrees studied."
    explanation: >-
      Independent pedigree-level confirmation from a 657-patient surgically
      confirmed cohort, and the source of the fraction of pedigrees showing
      reduced penetrance.
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Otosclerosis is highly familial, with a positive family history reported for 50–60% of cases"
    explanation: >-
      Gives the proportion of cases that are familial, which bounds how much of
      the disease the dominant model can account for.
- name: Complex polygenic susceptibility
  description: >-
    The remaining cases have no Mendelian pattern. A three-biobank
    meta-analysis of 3,504 cases identified 27 loci at genome-wide significance,
    and reported genetic correlation with skeletal traits, which places most of
    the population risk in common variants of small effect in bone-remodeling
    genes rather than in a segregating allele.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most association loci, the nearest protein-coding genes are implicated in bone remodelling, mineralization or severe skeletal disorders."
    explanation: >-
      Characterizes the polygenic component and the biology of the genes it
      implicates.
  - reference: PMID:34498117
    reference_title: "Genetics of otosclerosis: finally catching up with other complex traits?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In most of these families, otosclerosis seems to be caused by a small number of genetic factors (oligogenic) while only in a small number of families the disease seems to be truly monogenic."
    explanation: >-
      States that even the familial fraction is mostly oligogenic rather than
      monogenic, which is why this entry records loci and susceptibility genes
      instead of subtypes.
  - reference: PMID:20513039
    reference_title: "The etiology of otosclerosis: a combination of genes and environment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is a complex genetic disease, caused by a combination of genetic and environmental factors."
    explanation: >-
      The framing this entry adopts: susceptibility genes plus environmental
      triggers rather than a Mendelian locus.
pathophysiology:
- name: Germline Susceptibility Variants in Bone-Remodeling Genes
  description: >-
    The genetic layer of the disease, and the only node that is present from
    birth. It is deliberately written as one node covering two architectures
    that converge on the same consequence: rare high-penetrance alleles that
    segregate in single families (FOXL1, SMARCA4), and common variants of small
    effect at RELN, TGFB1, MEPE and roughly two dozen further loci whose nearest
    genes act in bone remodeling and mineralization. Neither architecture
    explains why the lesion is confined to the otic capsule when the genes
    involved are expressed throughout the skeleton; that is the disease's
    central unanswered question and is recorded as a knowledge gap.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
  downstream:
  - target: Altered TGF-beta Signaling in Otic Capsule Bone Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      TGFB1 is one of the few implicated genes with a demonstrated functional
      allele effect, and the largest GWAS singles out TGF-beta signalling for
      follow-up.
    evidence:
    - reference: PMID:36653343
      reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We highlight multiple genes involved in transforming growth factor beta signalling for follow-up studies."
      explanation: >-
        The GWAS's own reading of which pathway the association signal points
        at, which is what this edge asserts.
  - target: Failure of Otic Capsule Remodeling Suppression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediates are unknown by design. No implicated gene has been shown
      to act on the otic-capsule-specific suppression mechanism, so the edge
      records that susceptibility precedes the failure without claiming a
      mechanism for it.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify 23 novel risk loci"
    explanation: >-
      Establishes the scale of the polygenic contribution in the largest
      case-control analysis performed to date.
  - reference: PMID:34633540
    reference_title: A pathogenic deletion in Forkhead Box L1 (FOXL1) identifies the first otosclerosis (OTSC) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identify a 15 bp coding deletion in Forkhead Box L1 co-segregating with otosclerosis in a Caucasian family"
    explanation: >-
      The first demonstration that a single germline coding variant can cause
      the disease, which is the rare-allele half of this node.
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a disease-causing variant in SMARCA4, encoding a key component of the PBAF chromatin remodelling complex."
    explanation: The second such gene, identified by linkage plus exome sequencing in one kindred.
- name: Altered TGF-beta Signaling in Otic Capsule Bone Cells
  description: >-
    TGF-beta1 couples osteoclast and osteoblast activity and is the best
    functionally characterised susceptibility signal in this disease. The
    direction matters and is easy to state backwards: the T263I coding
    polymorphism produces a more active TGF-beta1 and is under-represented in
    patients, so it is the protective allele and the risk state is relatively
    reduced TGF-beta1 activity. The node is marked provisional because the
    functional work is a reporter assay rather than a measurement in otic
    capsule bone.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: TGF-beta1 signaling activity
    modifier: DECREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  downstream:
  - target: Failure of Otic Capsule Remodeling Suppression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Asserted as an association-derived link, not a demonstrated one: no study
      has shown that the T263I genotype changes otic capsule turnover.
  evidence:
  - reference: PMID:17588962
    reference_title: The coding polymorphism T263I in TGF-beta1 is associated with otosclerosis in two independent populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant I263 is under-represented in otosclerosis patients and hence protective against the disease."
    explanation: >-
      Establishes the allele's direction of effect, which fixes the direction of
      this node's modifier.
  - reference: PMID:17588962
    reference_title: The coding polymorphism T263I in TGF-beta1 is associated with otosclerosis in two independent populations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis of SNP T263I with a luciferase reporter assay showed that the protective variant I263 of TGF-beta1 is more active than the WT variant T263"
    explanation: >-
      The functional half of the same paper, split out because it is a reporter
      assay rather than a human association result.
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "report an association in RELN and three previously reported candidate gene or linkage regions (TGFB1, MEPE, and OTSC7)."
    explanation: Independent replication of the TGFB1 association at biobank scale.
- name: Failure of Otic Capsule Remodeling Suppression
  description: >-
    The step that makes otosclerosis a disease of one bone. Capsular bone next
    to the perilymphatic spaces turns over at about 0.13% per year against
    roughly 10% for the rest of the skeleton, and otosclerotic foci arise
    precisely where that inhibition is strongest. The best-supported mechanism
    for the inhibition is osteoprotegerin secreted by inner ear soft tissue into
    the perilymph and diffusing outward through the lacuno-canalicular system;
    cochlear bone additionally suppresses osteocytic perilacunar remodeling. A
    local failure of that suppression must precede the lesion. What causes the
    failure in any individual patient is not known, and this is the node the
    knowledge gaps in this entry attach to.
  biological_scale: TISSUE
  locations:
  - preferred_term: bony otic capsule
    term:
      id: UBERON:0005411
      label: bony otic capsule
  biological_processes:
  - preferred_term: osteoprotegerin-mediated suppression of otic capsule bone resorption
    modifier: DECREASED
    term:
      id: GO:0045779
      label: negative regulation of bone resorption
  downstream:
  - target: Focal Osteoclastic Resorption of Otic Capsule Bone
    causal_link_type: DIRECT
    description: >-
      Removing the local anti-resorptive brake is what permits osteoclasts to
      open a focus in bone that is otherwise permanently quiescent.
    evidence:
    - reference: PMID:10908995
      reference_title: Predilection of otosclerotic foci related to the bone turnover in the otic capsule.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A surpassing (or failure) of this pronounced inhibition must precede the tumultuous but delimited osteogenesis of otosclerosis."
      explanation: >-
        States the causal ordering this edge draws, from the canine study that
        mapped the turnover gradient.
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In fact, under normal conditions, osteoblast and osteoclast activity of bone turnover is almost entirely absent in the mature otic capsule"
    explanation: Establishes the baseline quiescence whose failure this node describes.
  - reference: PMID:17245023
    reference_title: Dynamic bone studies of the labyrinthine capsule in relation to otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone resorption and consequently bone remodelling which turns over the general skeleton at a rate of 10% per year is normally highly restricted in perilabyrinthine bone to a minimum of 0.13% per year except in otosclerosis, and systemic remodelling rates are normal even in otosclerotic patients."
    explanation: >-
      Quantifies the suppression and records that patients' systemic bone
      turnover is normal, which is what confines the disease to this node.
  - reference: PMID:15630389
    reference_title: Osteoprotegerin in the inner ear may inhibit bone remodeling in the otic capsule.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "OPG, a powerful inhibitor of bone remodeling, was expressed at extremely high levels within the soft tissue of the cochlea and was present in the perilymph at very high concentrations."
    explanation: >-
      The observation behind the osteoprotegerin mechanism: the inner ear itself
      is the source of the anti-resorptive signal.
  - reference: PMID:27085457
    reference_title: Parallel mechanisms suppress cochlear bone remodeling to protect hearing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cochlear bone is singular in its regulation of remodeling by expressing high levels of osteoprotegerin."
    explanation: >-
      Independent confirmation of the osteoprotegerin mechanism, from work
      showing the cochlea suppresses osteocyte-mediated remodeling in parallel.
  - reference: PMID:23158898
    reference_title: On the biology of the bony otic capsule and the pathogenesis of otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that bone remodeling may commence when the effect of anti-resorptive OPG fails locally within regions of non-viable osteocytes."
    explanation: >-
      A specific proposed trigger for the local failure, osteocyte death
      interrupting the diffusion route, offered as a hypothesis rather than a
      demonstrated mechanism.
- name: Persistent Measles Virus Infection of the Otosclerotic Focus
  description: >-
    Measles virus RNA is recoverable from the great majority of otosclerotic
    stapes footplates and from no control footplate, and the measles receptor
    CD46 is strongly expressed on osteoclasts and endothelial cells inside
    active foci while being only weakly expressed on normal footplate osteocytes
    and fibroblasts. The proposal is a self-sustaining loop: persistent
    infection raises receptor expression, which supports continued replication
    and inflammatory recruitment at the site. Whether this is cause, consequence
    or bystander is genuinely contested and is recorded as a discussion rather
    than settled here.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: osteoclast within an active otosclerotic focus
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: endothelial cell of the otosclerotic focus
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: Focal Osteoclastic Resorption of Otic Capsule Bone
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Proposed to act through CD46-bearing osteoclasts and the inflammatory
      infiltrate of the active focus.
    evidence:
    - reference: PMID:17294206
      reference_title: "Expression of measles virus receptors in otosclerotic, non-otosclerotic and in normal stapes footplates."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Otosclerosis is a disease of disturbed osteoid turnover due to persistent measles virus infection and special CD46 receptor pattern of the otic capsule."
      explanation: >-
        The authors' own statement of the causal link from persistent infection
        to disturbed bone turnover.
  evidence:
  - reference: PMID:11642419
    reference_title: Persistent measles virus infection and otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By the use of RT-PCR, measles virus RNA could be detected in 32 patients, but not in controls."
    explanation: >-
      The primary detection result, in 40 otosclerosis patients against
      controls, that grounds this node.
  - reference: PMID:17294206
    reference_title: "Expression of measles virus receptors in otosclerotic, non-otosclerotic and in normal stapes footplates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 116 stapes fixation cases, 87 otosclerotic stapes contained measles virus RNA."
    explanation: >-
      Replication in a larger surgical series, with virus-negative fixed stapes
      turning out to be non-otosclerotic on histology.
  - reference: PMID:17294206
    reference_title: "Expression of measles virus receptors in otosclerotic, non-otosclerotic and in normal stapes footplates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Active otosclerosis was featured by increased numbers of osteoclasts showing strong CD46 expression."
    explanation: >-
      Locates the receptor on the resorbing cell population, which is the
      cell-type annotation on this node.
- name: Focal Osteoclastic Resorption of Otic Capsule Bone
  description: >-
    The active, or otospongiotic, phase. Osteoclasts open a hypervascular focus
    in endochondral capsular bone, most often at the fissula ante fenestram just
    anterior to the oval window. The lesion is chalky or reddish and, when
    vascular enough and superficial enough on the promontory, produces the
    Schwartze sign visible through an intact eardrum. This is the phase that
    medical therapy aims at, and the phase high-resolution CT can see as a
    hypodense focus.
  biological_scale: TISSUE
  locations:
  - preferred_term: bony otic capsule at the fissula ante fenestram
    term:
      id: UBERON:0005411
      label: bony otic capsule
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: focal resorption of otic capsule bone
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  - preferred_term: osteoclast recruitment to the otosclerotic focus
    modifier: INCREASED
    term:
      id: GO:0030316
      label: osteoclast differentiation
  downstream:
  - target: Reparative Deposition of Sclerotic Woven Bone
    causal_link_type: DIRECT
    description: The resorptive phase is followed by a reparative one at the same site.
    evidence:
    - reference: PMID:11300278
      reference_title: Pathophysiology of otosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "These lesions seem to begin by resorption of stable otic capsule bone in adults, followed by a reparative phase with bone deposition."
      explanation: States the two-phase sequence this edge encodes.
  - target: Retrofenestral Extension to the Cochlear Endosteum
    causal_link_type: DIRECT
    description: >-
      The same remodeling front, when it extends medially rather than only
      across the stapediovestibular joint, reaches the cochlear endosteum.
    evidence:
    - reference: PMID:36653343
      reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "When bone remodeling progresses to involve the cochlear endosteum, otosclerosis can cause additional sensorineural hearing loss in 20–30% of patients"
      explanation: >-
        States that the endosteal involvement is a progression of the same
        remodeling process rather than a separate lesion.
  - target: Vestibular Endorgan Involvement and Cupular Deposit Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drawn at the disease level rather than from a specific lesion site. The
      temporal bone study that establishes the association explicitly found no
      correlation with endosteal involvement or with stapes fixation, so the
      route from focus to cupula is unknown.
    evidence:
    - reference: PMID:17178944
      reference_title: Association between cupular deposits and otosclerosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results suggest otosclerosis as an underlying mechanism for the production of cupular deposits"
      explanation: >-
        The authors' conclusion that otosclerosis causes the deposits, which is
        exactly the strength of claim this edge makes.
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In otosclerosis, through a poorly understood mechanism, osteoblasts and osteoclasts are activated and initiate abnormal bone remodeling: endochondral bone in the otic capsule is reabsorbed by osteoclasts, followed by deposition of new dense mineralized bone by osteoblasts, ultimately resulting in otosclerotic foci"
    explanation: >-
      Describes the resorptive phase and names the cell type responsible, and is
      explicit that the activating mechanism is unknown.
  - reference: PMID:10908995
    reference_title: Predilection of otosclerotic foci related to the bone turnover in the otic capsule.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In otosclerosis, foci of abnormal bone deposition are particularly frequent around the oval and round windows and in the cochlear capsule, i.e. where inhibition of bone remodelling is most prominent."
    explanation: >-
      Gives the anatomical predilection recorded in this node's location, and
      ties it to the turnover gradient of the upstream node.
  - reference: PMID:36923175
    reference_title: "Conservative Otosclerosis Treatment With Sodium Fluoride and Other Modern Formulations: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are many osteoclasts, fibroblasts, giant cells, and proliferating endothelial cells in active otosclerotic foci, which may be responsible for the increased metabolic activity and the development of spongiotic damage that ultimately leads to bone resorption."
    explanation: >-
      Describes the cellular composition and hypervascularity of the active
      focus that gives the otospongiotic phase its name.
- name: Reparative Deposition of Sclerotic Woven Bone
  description: >-
    The reparative phase. Osteoblasts fill the resorbed focus with irregularly
    laid, densely mineralized bone that is larger and stiffer than what it
    replaced. Because the focus sits at the anterior margin of the oval window,
    the expanding sclerotic mass crosses the stapediovestibular joint. Cycles of
    resorption and deposition can repeat, which is why the lesion enlarges over
    years rather than reaching a stable size.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: deposition of dense sclerotic bone in the otosclerotic focus
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  - preferred_term: mineralization of the otosclerotic focus
    modifier: INCREASED
    term:
      id: GO:0030282
      label: bone mineralization
  downstream:
  - target: Stapes Footplate Fixation at the Oval Window
    causal_link_type: DIRECT
    description: >-
      Expansion of the new bone across the stapediovestibular joint is the
      mechanical event that immobilizes the footplate.
    evidence:
    - reference: PMID:37399313
      reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "which upon expansion causes fixation of the adjacent stapedial footplate, impairing free motion of the stapes bone and culminating in progressive conductive hearing loss"
      explanation: States the expansion-to-fixation step this edge draws.
  evidence:
  - reference: PMID:11300278
    reference_title: Pathophysiology of otosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Otosclerosis is a localized disease of bone remodeling within the otic capsule of the human temporal bone."
    explanation: >-
      The defining statement of the disease as a remodeling process localized to
      this bone, from the review that established the two-phase model.
  - reference: PMID:36923175
    reference_title: "Conservative Otosclerosis Treatment With Sodium Fluoride and Other Modern Formulations: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In response to this enhanced bone resorption, a regenerative process occurs in the foci, leading to their fibrous transformation by osteoblasts and fibroblasts"
    explanation: Describes the reparative phase and the cell types that carry it out.
- name: Stapes Footplate Fixation at the Oval Window
  description: >-
    The lesion that defines clinical otosclerosis. Sclerotic bone spanning the
    annular ligament ankyloses the footplate in the oval window. Where the new
    bone fills the niche entirely the surgeon finds obliterative disease, which
    is technically harder and carries a higher risk of sensorineural injury at
    operation. Histologic otosclerosis without footplate fixation is common and
    silent; it is this step that converts it into a disease.
  biological_scale: TISSUE
  locations:
  - preferred_term: stapes footplate
    term:
      id: UBERON:0002496
      label: stapes base
  - preferred_term: oval window
    term:
      id: UBERON:0002501
      label: oval window
  downstream:
  - target: Impaired Ossicular Sound Transmission
    causal_link_type: DIRECT
    description: >-
      An ankylosed footplate cannot deliver ossicular vibration into the
      perilymph.
    evidence:
    - reference: PMID:36653343
      reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In classic otosclerosis, the conduction of sound through the ossicular chain is impeded due to fixation of the stapes footplate by pathologic bone remodeling, leading to conductive hearing loss."
      explanation: >-
        States the fixation-to-impeded-conduction step directly, which is what
        this edge asserts rather than either node alone.
  - target: Stapes ankylosis
    causal_link_type: DIRECT
    description: >-
      The clinical finding corresponding to this node, confirmed at surgery.
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most common location of otosclerotic lesions in the otic capsule is the anterior part of the oval window"
    explanation: Locates the lesion at the site this node names.
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In classic otosclerosis, the conduction of sound through the ossicular chain is impeded due to fixation of the stapes footplate by pathologic bone remodeling, leading to conductive hearing loss."
    explanation: >-
      States the fixation and its mechanical consequence, which is the edge out
      of this node.
  - reference: PMID:16985478
    reference_title: "Surgical findings and long-term hearing results in 3,050 stapedotomies for primary otosclerosis: a prospective study with the otology-neurotology database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postoperative ABG was achieved to within 10 dB in 95% of cases of obliterative otosclerosis"
    explanation: >-
      The operative series' record of obliterative disease as a distinct
      intraoperative finding, which is what the description refers to.
- name: Impaired Ossicular Sound Transmission
  description: >-
    An immobile footplate cannot deliver the vibration of the ossicular chain
    into the perilymph, so acoustic energy that reaches the eardrum is not
    transferred to the cochlea. The audiometric consequences are specific enough
    to be diagnostic: an air-bone gap that is largest at low frequencies, absent
    stapedial reflexes despite a normal tympanogram, and a Carhart notch, a dip
    in bone conduction around 2 kHz that is an artefact of the ossicular chain's
    altered resonance rather than a cochlear lesion, and that recovers after
    successful surgery.
  biological_scale: ORGANISM
  downstream:
  - target: Conductive hearing impairment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37399313
      reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "which upon expansion causes fixation of the adjacent stapedial footplate, impairing free motion of the stapes bone and culminating in progressive conductive hearing loss"
      explanation: >-
        Carries the chain through impaired stapes motion to the conductive loss,
        which is the step this edge draws.
  - target: Tinnitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as an edge with unknown intermediates because the strongest
      evidence is therapeutic rather than mechanistic: closing the air-bone gap
      improves tinnitus, and the degree of improvement tracks the degree of
      closure.
    evidence:
    - reference: PMID:41174987
      reference_title: "Impact of Stapedectomy on Tinnitus Severity and Hearing Outcomes in Patients With Otosclerosis: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There was a moderate-to-strong relation between tinnitus improvement and air-bone gap (ABG) closure (32%), tinnitus resolution versus ABG closure (55%)."
      explanation: >-
        Ties tinnitus to the conductive block by the response of one to
        correction of the other; this is an inference from treatment response,
        not a direct demonstration.
  evidence:
  - reference: PMID:16995960
    reference_title: "Predictive role of Carhart's notch in pre-operative assessment for middle-ear surgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A Carhart's notch at 2 kHz indicates stapes footplate fixation, whereas one at 1 kHz indicates a mobile stapes footplate; the footplate mobility can thus be predicted pre-operatively."
    explanation: >-
      Establishes the frequency specificity of the Carhart notch as a signature
      of footplate fixation rather than of conductive loss generally.
  - reference: PMID:7308599
    reference_title: The negative on/off effect in cochlear and early stapedial otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patterns were more common for the early stapedial otosclerosis group."
    explanation: >-
      The acoustic reflex counterpart: absent-reflex patterns track stapedial
      fixation, which is why an intact reflex argues against this node.
  - reference: PMID:33746227
    reference_title: Is the Carhart notch a predictive factor of hearing results after stapedectomy?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ossicular and inner ear fluid inertia are less efficient due to the higher impedance of the fixed stapes footplate in otosclerosis and an increase in BC thresholds is observed."
    explanation: >-
      The mechanical explanation for the Carhart notch, which is what makes it an
      artefact of this node rather than a cochlear finding.
  - reference: PMID:33746227
    reference_title: Is the Carhart notch a predictive factor of hearing results after stapedectomy?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this apparent BC loss is not a true indicator of the inner ear function, since it could improve following successful surgery; it reflects the successful reestablishment of the former impedance of the oval window by surgery"
    explanation: >-
      Sources the claim in this node's description that the bone-conduction dip
      recovers after surgery, and states why: the deficit is impedance, not
      cochlear damage.
- name: Retrofenestral Extension to the Cochlear Endosteum
  description: >-
    In a minority of patients the remodeling front extends medially from the
    pericochlear capsule to the cochlear endosteum. This is what radiologists
    call retrofenestral or cochlear otosclerosis and what produces the
    pericochlear halo on CT. The classical definition of cochlear otosclerosis
    requires endosteal involvement without stapes fixation, but temporal bone
    work shows that disease severe enough to reach the endosteum has usually
    fixed the stapes as well, so most patients present with a mixed rather than
    a purely sensorineural loss.
  biological_scale: TISSUE
  locations:
  - preferred_term: cochlear endosteum
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Spiral Ligament Hyalinization and Stria Vascularis Atrophy
    causal_link_type: DIRECT
    description: >-
      Channels through the endosteal bone connect the focus to the spiral
      ligament, and hyalinization spreads laterally from them.
    evidence:
    - reference: PMID:6190061
      reference_title: "Otosclerosis: relationship of spiral ligament hyalinization to sensorineural hearing loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Small channels through the endosteal bone from the lesion to the spiral ligament have been found."
      explanation: >-
        The anatomical route between the two nodes this edge connects, from the
        temporal bone series that established the relationship.
  evidence:
  - reference: PMID:20693902
    reference_title: Cochlear otosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cochlear otosclerosis is defined as otosclerosis located in the otic capsule involving the cochlear endosteum and causing sensorineural hearing loss or mixed-type hearing loss."
    explanation: Defines the lesion this node represents.
  - reference: PMID:20693902
    reference_title: Cochlear otosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has been clearly shown that, when otosclerosis is sufficiently severe to involve the cochlear endosteum, it usually fixes the stapes as well."
    explanation: >-
      The reason this node is drawn as a branch off the same lesion rather than
      as an independent disease form.
- name: Spiral Ligament Hyalinization and Stria Vascularis Atrophy
  description: >-
    The tissue lesion behind the sensorineural component. Hyalinization of the
    spiral ligament appears adjacent to active otospongiotic foci and not
    adjacent to inactive ones, which is the strongest available argument that
    the lesion is driven by something diffusing out of the active focus rather
    than by the bone itself. The stria vascularis atrophies where the ligament
    is most hyalinized, and immunostaining for Na,K-ATPase and carbonic
    anhydrase II falls in both structures.
  biological_scale: TISSUE
  locations:
  - preferred_term: spiral ligament
    term:
      id: UBERON:0006725
      label: spiral ligament
  - preferred_term: stria vascularis
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  downstream:
  - target: Loss of Endocochlear Potential
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15241221
      reference_title: "Spiral ligament and stria vascularis changes in cochlear otosclerosis: effect on hearing level."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "dampened expression of ion transport molecules within the spiral ligament and stria vascularis may disrupt potassium ion recycling, resulting in loss of endocochlear potential and sensory hearing loss."
      explanation: >-
        States the proposed step from the structural lesion to the electrical
        one, which is what this edge asserts.
  evidence:
  - reference: PMID:6190061
    reference_title: "Otosclerosis: relationship of spiral ligament hyalinization to sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hyalinization occurs adjacent to active otospongiotic lesions but not next to inactive otosclerotic lesions."
    explanation: >-
      The activity dependence that argues for a diffusible mediator, and the
      reason this node sits downstream of the active rather than the sclerotic
      phase.
  - reference: PMID:15241221
    reference_title: "Spiral ligament and stria vascularis changes in cochlear otosclerosis: effect on hearing level."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spiral ligament hyalinization correlated significantly with stria vascularis atrophy in the posterior middle turn of the cochlea"
    explanation: >-
      Establishes the coupling between the two structures named in this node, in
      32 cochleae from 24 temporal bone donors.
- name: Loss of Endocochlear Potential
  description: >-
    Strial atrophy and reduced ion-transport protein expression are proposed to
    disrupt potassium recycling and lower the endocochlear potential, degrading
    hair cell transduction without destroying the hair cells themselves. The
    proposal is inferential: the human material is post-mortem temporal bone
    with correlated audiograms, and no endocochlear potential has been measured
    in an otosclerotic ear.
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15241221
      reference_title: "Spiral ligament and stria vascularis changes in cochlear otosclerosis: effect on hearing level."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "dampened expression of ion transport molecules within the spiral ligament and stria vascularis may disrupt potassium ion recycling, resulting in loss of endocochlear potential and sensory hearing loss."
      explanation: >-
        The same sentence carries the chain one step further, from the lost
        potential to the sensory loss this edge points at.
  - target: Mixed hearing impairment
    causal_link_type: DIRECT
    description: >-
      Mixed loss is the usual clinical form, because endosteal involvement
      almost always coexists with footplate fixation.
    evidence:
    - reference: PMID:20693902
      reference_title: Cochlear otosclerosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It has been clearly shown that, when otosclerosis is sufficiently severe to involve the cochlear endosteum, it usually fixes the stapes as well."
      explanation: >-
        Explains why the sensorineural component almost always arrives on top of
        a conductive one rather than alone, which is what makes this edge a mixed
        rather than a pure sensorineural loss.
  evidence:
  - reference: PMID:15241221
    reference_title: "Spiral ligament and stria vascularis changes in cochlear otosclerosis: effect on hearing level."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone-conduction thresholds at 2,000 and 4,000 Hz were significantly associated with the amount of stria vascularis atrophy"
    explanation: >-
      The only quantitative link in the human material between the strial lesion
      and measured sensorineural loss.
  - reference: PMID:6190061
    reference_title: "Otosclerosis: relationship of spiral ligament hyalinization to sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the degree of sensorineural loss is directly related to the amount of hyalinization of the spiral ligament"
    explanation: >-
      The dose-response relationship across 46 temporal bones that makes this
      node more than an anatomical coincidence.
- name: Vestibular Endorgan Involvement and Cupular Deposit Formation
  description: >-
    Otosclerotic temporal bones carry significantly more cupular deposits than
    age-matched controls, which is the clearest structural correlate of the
    vestibular symptoms patients report. It is also, on the same data, not an
    explanation for them: deposit burden did not correlate with dysequilibrium,
    stapes fixation, endosteal involvement or prior stapes surgery. The node is
    kept because the lesion is real and reproducible; the arrow from it to
    vertigo is deliberately not drawn, and the gap is recorded as a discussion.
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:17178944
    reference_title: Association between cupular deposits and otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of cupular deposits in TBs with otosclerosis was significantly higher than in those without"
    explanation: >-
      Establishes the lesion in 35 otosclerotic temporal bones against 35
      age-matched controls.
  - reference: PMID:17178944
    reference_title: Association between cupular deposits and otosclerosis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we did not find an association between these deposits and vestibular symptoms."
    explanation: >-
      Refutes the natural next claim, that these deposits cause the vertigo, and
      is why no edge is drawn from this node to the Vertigo phenotype.
phenotypes:
- category: Auditory
  name: Conductive hearing impairment
  description: >-
    The presenting problem in the great majority of patients: an air-bone gap
    behind a normal eardrum, worst at low frequencies first, with absent
    stapedial reflexes and a normal tympanogram.
  frequency: VERY_FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
    clinical_course: PROGRESSIVE
  sequelae:
  - target: Progressive hearing impairment
    description: >-
      The conductive loss does not plateau. Repeated cycles of resorption and
      sclerosis enlarge the focus, so thresholds worsen over years.
    evidence:
    - reference: PMID:27056980
      reference_title: Mutations and altered expression of SERPINF1 in patients with familial otosclerosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "hearing loss in clinical otosclerosis typically begins in the third decade and progressively becomes more severe."
      explanation: States that the loss, once present, progresses.
  - target: Bilateral hearing impairment
    description: >-
      Disease that begins in one ear usually declares itself in the other,
      asymmetrically and later.
    evidence:
    - reference: PMID:36653343
      reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Initial manifestation is often limited to one ear, but eventual bilateral disease is observed in 70–80% of cases"
      explanation: >-
        States the unilateral-to-bilateral progression this edge draws, and
        quantifies how often it happens.
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While the vast majority of otosclerosis patients present conductive hearing loss"
    explanation: >-
      Supports the VERY_FREQUENT band directly: it is a statement about the
      proportion of patients, not merely about the phenotype occurring.
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "is one of the most common causes of conductive hearing loss"
    explanation: >-
      Places otosclerosis among the leading causes of this phenotype at
      population level.
- category: Auditory
  name: Stapes ankylosis
  description: >-
    The lesion itself, recorded as a phenotype because it is what the surgeon
    confirms intraoperatively and what makes the diagnosis definitive. Fixation
    ranges from a thin anterior focus to complete obliteration of the oval
    window niche.
  frequency: VERY_FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Stapes ankylosis
    term:
      id: HP:0000381
      label: Stapes ankylosis
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It results from dysregulation of bone homeostasis in the otic capsule, most commonly leading to fixation of the stapes bone, impairing sound conduction through the middle ear."
    explanation: >-
      Names footplate fixation as the usual outcome of the disease process,
      supporting both the phenotype and its high frequency.
- category: Auditory
  name: Progressive hearing impairment
  description: >-
    Hearing loss in otosclerosis worsens over years rather than fluctuating or
    plateauing, which is why the disease is usually diagnosed a decade or more
    after onset. No frequency band is recorded: the sources establish that
    progression is the typical course without quantifying the proportion of
    patients in whom it occurs.
  phenotype_term:
    preferred_term: Progressive hearing impairment
    term:
      id: HP:0001730
      label: Progressive hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:27056980
    reference_title: Mutations and altered expression of SERPINF1 in patients with familial otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hearing loss in clinical otosclerosis typically begins in the third decade and progressively becomes more severe."
    explanation: >-
      States the progressive course. It supports the phenotype and its
      typicality but does not give a proportion, which is why frequency is
      omitted.
- category: Auditory
  name: Bilateral hearing impairment
  description: >-
    Disease usually starts in one ear and becomes bilateral, typically
    asymmetrically. The bound HP term is the bilateral conductive one, which is
    the form the sources' bilaterality figures overwhelmingly describe; a
    patient whose second ear declares itself as a cochlear lesion is covered by
    the mixed and sensorineural entries instead.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Bilateral conductive hearing impairment
    term:
      id: HP:0008513
      label: Bilateral conductive hearing impairment
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Initial manifestation is often limited to one ear, but eventual bilateral disease is observed in 70–80% of cases"
    explanation: >-
      Gives the quantitative basis for the FREQUENT band and the
      unilateral-to-bilateral course.
  - reference: PMID:27056980
    reference_title: Mutations and altered expression of SERPINF1 in patients with familial otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss is bilateral in 70–85% of cases and is usually asymmetrical, developing initially in one ear before progressing to the other"
    explanation: >-
      A second, slightly wider estimate, recorded alongside rather than merged
      with the first, and the source for the asymmetry.
- category: Auditory
  name: Mixed hearing impairment
  description: >-
    The usual form taken by cochlear involvement, because endosteal disease
    almost always coexists with footplate fixation.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Mixed hearing impairment
    term:
      id: HP:0000410
      label: Mixed hearing impairment
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in up to 10% of cases otosclerotic foci involve the cochlear endosteum that may also manifest as sensorineural or mixed hearing loss"
    explanation: >-
      The lower of the two published figures for cochlear involvement, and the
      one the OCCASIONAL band is set from.
- category: Auditory
  name: Sensorineural hearing impairment
  description: >-
    The bone-conduction component contributed by the cochlear lesion. Note that
    published estimates of how often cochlear involvement occurs disagree by a
    factor of two or three, 10% in one review and 20 to 30% in another, and the
    two figures are recorded here side by side rather than averaged. The
    disagreement is partly definitional: whether a case counts depends on
    whether endosteal involvement is defined radiologically, histologically or
    audiometrically.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When bone remodeling progresses to involve the cochlear endosteum, otosclerosis can cause additional sensorineural hearing loss in 20–30% of patients"
    explanation: The higher of the two published frequency estimates.
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "in up to 10% of cases otosclerotic foci involve the cochlear endosteum that may also manifest as sensorineural or mixed hearing loss"
    explanation: >-
      The lower estimate. Recorded separately so that the disagreement is
      visible rather than resolved by the curator.
- category: Auditory
  name: Tinnitus
  description: >-
    Common, and more so where the disease has reached the cochlea. It responds
    to stapes surgery in roughly half of operated patients, tracking closure of
    the air-bone gap.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:36923175
    reference_title: "Conservative Otosclerosis Treatment With Sodium Fluoride and Other Modern Formulations: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As many as 56%-84.5% of patients with otosclerosis experience tinnitus, particularly in the cochlear type of otosclerosis"
    explanation: >-
      A pooled range across the review's sources rather than a single measured
      frequency. The range spans the FREQUENT and VERY_FREQUENT bands, so the
      band recorded here is set conservatively from its lower bound.
  - reference: PMID:41174987
    reference_title: "Impact of Stapedectomy on Tinnitus Severity and Hearing Outcomes in Patients With Otosclerosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most studies reported improvement of tinnitus severity post-stapes surgery 15.7% to 64% (median 46.3%)"
    explanation: >-
      Pooled response of the symptom to correcting the conductive block, across
      22 studies and 2,233 patients.
- category: Vestibular
  name: Vertigo
  description: >-
    A minority symptom, most often benign paroxysmal positional vertigo or
    non-specific dysequilibrium rather than an otosclerosis-specific syndrome.
    It is deliberately not connected to the pathophysiology chain: the only
    structural correlate identified in temporal bones, cupular deposits, was
    explicitly not associated with symptoms in the study that established it.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Vertigo
    term:
      id: HP:0002321
      label: Vertigo
  evidence:
  - reference: PMID:36923175
    reference_title: "Conservative Otosclerosis Treatment With Sodium Fluoride and Other Modern Formulations: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vestibular symptoms, most commonly benign paroxysmal positional vertigo, balance disorders, and dizziness, have been reported in up to 10%-30% of patients with otosclerosis, but their pathophysiology remains unclear"
    explanation: >-
      Gives both the frequency band and the explicit statement that the
      mechanism is unknown.
  - reference: PMID:19638946
    reference_title: Audiovestibular function in patients with otosclerosis and balance disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complaints were dizziness in 42 patients (56%), benign paroxysmal positional vertigo in 37 patients (51%), and rotatory vertigo in 21 patients (29%)"
    explanation: >-
      The symptom breakdown, from a series selected for balance complaints, so
      these proportions describe that referred population and not otosclerosis
      patients generally.
prevalence:
- population: Populations of European descent
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 340.0
  rate_low: 300.0
  rate_high: 380.0
  rate_denominator: POPULATION
  notes: >-
    Clinical otosclerosis, i.e. otosclerosis causing hearing loss. The published
    0.30 to 0.38% converted to 300 to 380 per 100,000. Much lower in African,
    Native American and East Asian populations.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical otosclerosis has an estimated prevalence of 0.30–0.38% in populations of European descent"
    explanation: The figure the normalized rate is derived from.
  - reference: PMID:27056980
    reference_title: Mutations and altered expression of SERPINF1 in patients with familial otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is much rarer in African, Native American and other Asian populations"
    explanation: The ancestry restriction recorded in the notes.
- population: Unselected consecutive temporal bone autopsy series
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2500.0
  rate_denominator: POPULATION
  notes: >-
    Histologic otosclerosis, a different measure from the clinical one above:
    otosclerotic foci found on sectioning, most of which never fixed a stapes.
    2.5% of 236 temporal bones, or 3.4% of the 118 deceased patients. This study
    matters precisely because it is unselected. Earlier laboratory collections
    gave 12 to 15%, biased by having been assembled from people with ear
    disease, and their extrapolated clinical prevalence of about 1% did not
    match clinical series.
  evidence:
  - reference: PMID:17245017
    reference_title: "Prevalence of histologic otosclerosis: an unbiased temporal bone study in Caucasians."

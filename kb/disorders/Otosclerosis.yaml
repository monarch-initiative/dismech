- name: OTSC1-OTSC10 linkage loci
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  association: >-
    Ten autosomal dominant loci were mapped in multiplex families between 1998
    and 2011: OTSC1 (15q25-q26), OTSC2 (7q34-q36), OTSC3 (6p21.3-p22.3), OTSC4
    (16q), OTSC5 (3q22-q24), OTSC7 (6q13-q16.1), OTSC8 (9p13-q21) and OTSC10
    (1q41-q44), with OTSC6 and OTSC9 reserved but unpublished. None of them
    yielded a gene. Two things follow, and both matter for how this entry is
    scoped. First, these are mapped intervals of tens of megabases and not
    disease entities: OTSC1 and OTSC5 are not two diseases, so they are recorded
    here as genetic detail rather than as `has_subtypes`. Second, the loci are
    not uniformly solid. The OTSC2 interval failed to replicate in seven British
    pedigrees, while OTSC7 was independently re-implicated by the biobank GWAS.
    OTSC11 and OTSC12 are excluded from this record because they are named for
    the genes found in them, FOXL1 and SMARCA4, which have their own entries
    above.

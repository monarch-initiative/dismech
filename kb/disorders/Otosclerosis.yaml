- name: Loss of Otic Capsule Remodeling Quiescence
  description: >-
    The mature otic capsule is a near-static bone: osteoblast and osteoclast activity
    is almost absent, and turnover runs at roughly 0.13% per year against about 10%
    in ordinary skeletal bone. In otosclerosis both lineages are reactivated at focal
    sites, most plausibly at the residual islands of immature cartilage (globuli
    interossei) retained in the human capsule.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:

      snippet: The lack of OPG mRNA and the presence of TNF-α and IL-1β mRNA in the majority of otosclerotic tissues reflect the bone remodeling process occurring in the stapes.
      explanation: The authors themselves link the cytokine profile to the remodeling process in the focus.
- name: Dysregulated TGF-beta Signaling in the Otic Capsule
  description: >-
    TGF-beta1 regulates both osteoblast and osteoclast lineages and is produced
    within the otic capsule and by inner-ear tissues from which it can diffuse. An
    intronic TGFB1 variant is genome-wide significant for otosclerosis, and several
    further risk loci (SMAD3, CD109, LTBP3, AHSG, and a haplotype overlapping RUNX2)
    lie on the same pathway, making TGF-beta signalling the most consistently
    implicated molecular axis.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:

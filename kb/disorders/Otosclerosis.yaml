progression:
- phase: Onset in the second to fifth decade
  notes: >-
    Symptomatic disease is a young-adult and middle-aged presentation. Onset in
    the third decade is the mode; childhood-onset juvenile otosclerosis exists
    but is uncommon. The lesion is presumably present for some time before
    hearing loss becomes noticeable, so age of onset is age of symptom
    recognition rather than age of disease.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic otosclerosis most frequently occurs in working-age individuals between the second and fifth decades"
    explanation: The age band this phase records.
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The age at disease onset varies greatly, ranging between 5-55 years, with peak incidence between 15-30 years"
    explanation: >-
      Gives the full range including childhood onset, and a narrower peak than
      the band above; the two are reported separately rather than reconciled.
- phase: Progression to bilateral, then mixed disease
  notes: >-
    The second ear usually declares itself later and asymmetrically. Where the
    focus reaches the cochlear endosteum, a sensorineural component is added and
    the loss becomes mixed. Sensorineural decline can continue after successful
    stapes surgery, because surgery corrects the conductive block and does
    nothing to the remodeling process.
  evidence:
  - reference: PMID:27056980
    reference_title: Mutations and altered expression of SERPINF1 in patients with familial otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss is bilateral in 70–85% of cases and is usually asymmetrical, developing initially in one ear before progressing to the other"
    explanation: The bilateralization step.
  - reference: PMID:33433749
    reference_title: "Stapes surgery in osteogenesis imperfecta: retrospective analysis of 18 operated ears."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "A hearing gain is often obtained in spite of the sensorineural hearing loss caused by the natural progression of the disease."
    explanation: >-
      Recorded as NO_EVIDENCE deliberately. The sentence states the general
      principle that stapes surgery does not arrest an ongoing sensorineural
      decline, but it is about osteogenesis imperfecta rather than otosclerosis,
      so it cannot support the claim for this disease.
- phase: Far-advanced otosclerosis
  notes: >-
    The end of the natural history in a minority: air conduction thresholds
    beyond the reach of amplification with unmeasurable bone conduction. This is
    the stage at which cochlear implantation replaces stapes surgery, and where
    retrofenestral extension raises the rate of facial nerve stimulation from
    the implant because otosclerotic bone conducts current toward the facial
    canal.
  evidence:
  - reference: PMID:30498273
    reference_title: "Cochlear implantation in far-advanced otosclerosis: hearing results and complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe forms of otosclerosis known as far-advanced otosclerosis (FAO) can lead to severe to profound sensorineural hearing loss and can justify cochlear implantation."
    explanation: Defines the stage and its management implication.
  - reference: PMID:36082830
    reference_title: "Cochlear Implantation in Far Advanced Otosclerosis: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pooled rates of FNS were 18% (95% confidence interval, CI 12%-27%) and the rate of partial insertion was 10% (95% CI 7%-15%)."
    explanation: Quantifies the stage-specific implant complications across 27 studies.

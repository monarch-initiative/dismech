diagnosis:
- name: Pure-tone audiometry
  description: >-
    The test that raises the diagnosis. The pattern is an air-bone gap behind a
    normal eardrum, larger at low frequencies, often with a Carhart notch, a dip
    in bone conduction centred at 2 kHz. The notch is not a cochlear lesion: it
    is an artefact of the fixed ossicular chain's altered mechanics, and it
    recovers after successful stapedotomy. Its site matters diagnostically,
    since a notch at 2 kHz indicates a fixed footplate while one at 1 kHz does
    not, but it is not by itself sufficient, because tympanosclerosis, otitis
    media with effusion and congenital ossicular anomalies also produce it.
  diagnosis_term:
    preferred_term: pure-tone audiometry with air and bone conduction
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:16995960
    reference_title: "Predictive role of Carhart's notch in pre-operative assessment for middle-ear surgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with otosclerosis and tympanosclerosis, a Carhart's notch was seen at 2 kHz in 28 (93 per cent) patients but at 1 kHz in only two (7 per cent)."
    explanation: The frequency specificity of the notch in 315 operated ears.
  - reference: PMID:16995960
    reference_title: "Predictive role of Carhart's notch in pre-operative assessment for middle-ear surgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Otitis media with effusion, tympanosclerosis and congenital malformations should be considered in the differential diagnosis of a patient with a Carhart's notch seen on pure tone audiometry."
    explanation: >-
      The limitation recorded in the description: the notch indicates fixation,
      not specifically otosclerotic fixation.
  - reference: PMID:21422306
    reference_title: "Carhart notch 2-kHz bone conduction threshold dip: a nondefinitive predictor of stapes fixation in conductive hearing loss with normal tympanic membrane."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence of 2KBD was similar among the stapes fixation, incudostapedial joint detachment, and malleus or incus fixation groups, implying that 2KBD is not a useful predictor of stapes fixation."
    explanation: >-
      The counterweight to the study above, and the reason the description says
      the notch is not sufficient on its own. These two papers disagree: one
      finds the notch at 2 kHz specific to footplate fixation, the other finds
      its incidence indistinguishable across three ossicular pathologies. Both
      are cited so the disagreement is visible.
- name: Tympanometry and acoustic reflex testing
  description: >-
    A normal tympanogram with absent stapedial reflexes is the classic
    combination in stapedial otosclerosis, and it is the cheap discriminator
    against third-window lesions such as superior semicircular canal dehiscence,
    which produce an air-bone gap with reflexes preserved. Reflex patterns are
    less reliable in cochlear otosclerosis, where the footplate may still move.
  diagnosis_term:
    preferred_term: tympanometry with acoustic reflex testing
    term:
      id: NCIT:C88505
      label: Tympanometry Assessment
  evidence:
  - reference: PMID:26626134
    reference_title: Acoustic Reflex Screening of Conductive Hearing Loss for Third Window Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighty-eight percent of ears (166 of 189) demonstrating absence of all acoustic reflexes had an ossicular etiology of conductive hearing loss."
    explanation: >-
      Quantifies the discriminating power of absent reflexes for an ossicular
      cause in 212 ears with conductive loss.
  - reference: PMID:7308599
    reference_title: The negative on/off effect in cochlear and early stapedial otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of acoustic reflex patterns classically associated with stapedial otosclerosis in patients with cochlear otosclerosis leads us to predict that some degree of stapedial fixation is common in many cases of cochlear otosclerosis."
    explanation: >-
      The reason reflex patterns do not cleanly separate the fenestral and
      cochlear forms.
- name: High-resolution computed tomography of the temporal bones
  description: >-
    Used to confirm the lesion, grade its extent, and exclude other causes of a
    conductive loss behind a normal eardrum. Its operating characteristics are
    asymmetric and worth stating precisely: specificity is high and sensitivity
    is not, so a positive scan is close to diagnostic while a negative one does
    not exclude the disease. It misses sub-millimetre foci and, importantly, is
    much better at active hypodense lesions than at inactive sclerotic ones.
    Cone-beam CT identified every histologically active focus in one series and
    none of the inactive ones.
  diagnosis_term:
    preferred_term: high-resolution computed tomography of the temporal bones
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:28798924
    reference_title: Diagnostic performance of high resolution computed tomography in otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HRCT has a relatively low sensitivity of 58% (95%CI: 49.4-66.9), a high specificity, 95% (95%CI: 89.9-98.0) and a positive predictive value of 92% (95%CI: 84.1-95.8)."
    explanation: >-
      The pooled operating characteristics against histologically confirmed
      disease.
  - reference: PMID:24048411
    reference_title: Diagnostic value of cone-beam CT in histologically confirmed otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically active foci of otosclerosis (n = 21) were identified by CBCT in all cases with a sensitivity of 100 %. However, CBCT was unable to detect histologically inactive otosclerosis (n = 11, sensitivity = 0 %)."
    explanation: >-
      The activity dependence of CT detection, in 32 patients with
      histologically confirmed disease.
environmental:
- name: Persistent measles virus infection
  description: >-
    The most-studied non-genetic contributor. Measles virus RNA is detectable in
    most otosclerotic stapes footplates and in no control footplate, and the
    receptor CD46 is strongly upregulated on osteoclasts within active foci. The
    exposure is placed as a trigger for the persistent infection node rather
    than acting directly on bone, because that is the step the evidence
    describes.
  exposure_term:
    preferred_term: persistent measles virus infection of the otic capsule
    term:
      id: ECTO:3000001
      label: exposure to virus
  notes: >-
    ECTO has no measles-specific exposure term; a search of the local ECTO build
    for "measles" returns nothing. The binding is therefore the generic
    virus-exposure term with the specific concept carried in `preferred_term`.
  influences_mechanisms:
  - target: Persistent Measles Virus Infection of the Otosclerotic Focus
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Prior measles infection is the route by which virus reaches and persists
      in the otic capsule.
    evidence:
    - reference: PMID:11642419
      reference_title: Persistent measles virus infection and otosclerosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We conclude that the spontaneous form of otosclerosis is, in the vast majority of cases, a measles virus-associated disease of the otic capsule."
      explanation: The authors' statement of the association this edge draws.
  evidence:
  - reference: PMID:11642419
    reference_title: Persistent measles virus infection and otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of perilymph revealed the presence of antibodies to N, F1, and M measles virus proteins in all cases"
    explanation: >-
      The serological counterpart to the RNA detection, from perilymph rather
      than serum, which is what makes it evidence of local rather than past
      systemic infection.
  - reference: PMID:18235207
    reference_title: "Otosclerosis and measles virus - association or causation?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The existence of the MV proteins and RNA within the otosclerotic tissue has been shown by several authors."
    explanation: Records that the detection has been independently reproduced.
  - reference: PMID:30540696
    reference_title: The Epidemiology of Otosclerosis in a British Cohort.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No association with measles infection was detected."
    explanation: >-
      The contemporary negative result, in 657 surgically confirmed patients. It
      is questionnaire-based history rather than tissue virology, so it does not
      address the same measurement, but it is a real disagreement and is
      recorded as one.
- name: Measles vaccination
  description: >-
    The counterpart exposure, and the reason the measles hypothesis is more than
    an association. Germany's voluntary vaccination programme from 1974 provides
    a natural experiment: between 1993 and 2004 the incidence of otosclerosis
    requiring inpatient treatment fell significantly further in the vaccinated
    age group than in the unvaccinated one, with no comparable effect for otitis
    media used as an external control. The same period saw the mean age of
    stapedectomy patients rise, consistent with a cohort effect.
  exposure_term:
    preferred_term: measles vaccination
  notes: >-
    Left unbound. ECTO has no vaccination-exposure term that resolves in this
    repository's build; `ECTO:2000129` (exposure to vaccination) is absent from
    it, as CLAUDE.md records, and the only vaccine-adjacent hits name a
    different vaccine. A binding that does not validate is worse than none, so
    the concept stays in `preferred_term`.
  influences_mechanisms:
  - target: Persistent Measles Virus Infection of the Otosclerotic Focus
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Vaccination prevents wild-type measles infection, and so prevents the
      persistent otic-capsule infection this node describes. The intermediate,
      never acquiring measles, is known but was not measured in the
      epidemiological studies, which observed the disease endpoint.
    evidence:
    - reference: PMID:17297608
      reference_title: The influence of measles vaccination on the incidence of otosclerosis in Germany.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The results indicate that measles vaccination in Germany has resulted in a significant reduction in the number of hospital treatments for otosclerosis in the vaccinated age groups."
      explanation: The population-level protective effect this edge records.
  evidence:
  - reference: PMID:17297608
    reference_title: The influence of measles vaccination on the incidence of otosclerosis in Germany.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Between 1993 and 2004 the incidence of hospital treatments for otosclerosis decreased to a significantly greater extent in the vaccinated patients than in the unvaccinated patients."
    explanation: >-
      The primary comparison, over 64,112 hospitalized patients, with otitis
      media serving as the external validation series.
  - reference: PMID:11349778
    reference_title: Shift of the distribution of age in patients with otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Statistical analysis during the recruitment period indicated a significant increase in the average age of the otosclerosis patients"
    explanation: >-
      The independent cohort-effect signal from 1,351 stapedectomy patients. The
      disease receding from the vaccinated generations should push the operated
      population older, and it did.
- name: Pregnancy
  description: >-
    Long-claimed and still unsettled. The rationale is that otosclerosis is
    twice as common in women and presents during reproductive years, and that
    pregnancy changes systemic bone metabolism. The evidence is genuinely
    conflicting: a review of 11 studies covering 2,323 women reported hearing
    change during pregnancy in 44% and a significant correlation with the number
    of pregnancies, while a controlled comparison of 47 stapedectomy patients
    with children against 47 without found no difference at all and no
    dose-response with parity. The two are recorded side by side, and the
    mechanism link is drawn with unknown intermediates.
  exposure_term:
    preferred_term: pregnancy
  notes: >-
    Left unbound after searching: neither the ECTO nor the XCO build carries a
    pregnancy exposure term. Pregnancy is arguably a physiological state rather
    than an exposure, which may be why.
  influences_mechanisms:
  - target: Focal Osteoclastic Resorption of Otic Capsule Bone
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as EXACERBATES with unknown intermediates and contested support.
      No study has measured otic capsule turnover across a pregnancy; the claim
      rests on reported hearing change, and one controlled series does not
      reproduce it.
    evidence:
    - reference: PMID:34819176
      reference_title: Does pregnancy have an influence on otosclerosis?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A statistically significant correlation emerged between hearing change and number of pregnancies (p = 0.003)."
      explanation: >-
        The dose-response signal across 2,323 women that is the strongest
        argument for this edge.
    - reference: PMID:16222205
      reference_title: Does pregnancy affect otosclerosis?
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Within the group with children, no significant correlation was found between number of children and hearing loss."
      explanation: >-
        The controlled comparison that fails to reproduce the same dose-response,
        on the same axis.
  evidence:
  - reference: PMID:34819176
    reference_title: Does pregnancy have an influence on otosclerosis?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During childbearing, otosclerosis began in 1 per cent of pregnant women, worsened in 21 per cent and worsened during puerperium in 4 per cent."
    explanation: The pooled figures from 11 reviewed studies.
  - reference: PMID:16222205
    reference_title: Does pregnancy affect otosclerosis?
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We found no adverse effect on hearing in otosclerotic women who had children compared with women without children."
    explanation: >-
      The negative controlled result, in 94 women and 128 ears, and the reason
      the description calls this contested rather than established.
treatments:
- name: Stapedotomy
  description: >-
    The definitive treatment and the reason otosclerosis is a highly treatable
    cause of deafness. A small fenestra is made in the fixed footplate and a
    prosthesis is coupled from the incus into it, restoring transmission across
    the immobilized joint. In a single-surgeon prospective series of 3,050
    procedures the air-bone gap closed to within 10 dB in 94.2% of ears, with
    significant sensorineural loss in 0.5%. Laser fenestration gives modestly
    better hearing results than non-laser technique in meta-analysis without a
    demonstrable complication advantage. The operation does not touch the
    underlying remodeling, so an ongoing sensorineural component continues on
    its own trajectory afterwards.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: stapedotomy with prosthesis interposition
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Stapes Footplate Fixation at the Oval Window
    treatment_effect: BYPASSES
    description: >-
      The fixation is left in place; the prosthesis provides a new mechanical
      path across it. This is why it is recorded as bypassing rather than
      inhibiting the node.
    evidence:
    - reference: PMID:16985478
      reference_title: "Surgical findings and long-term hearing results in 3,050 stapedotomies for primary otosclerosis: a prospective study with the otology-neurotology database."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, the postoperative ABG was closed to 10 dB in 94.2% of cases."
      explanation: >-
        The magnitude of the mechanical correction, which is what establishes
        that the intervention acts on this node.
  notes: >-
    NCIT has no stapedectomy or stapedotomy term. Searches for both, and for
    "stapes surgery", "ear surgery" and "ossicular", return nothing, so the
    bound action term is the generic surgical one and the specific procedure is
    carried in `preferred_term`.
  evidence:
  - reference: PMID:16985478
    reference_title: "Surgical findings and long-term hearing results in 3,050 stapedotomies for primary otosclerosis: a prospective study with the otology-neurotology database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant postoperative sensorineural hearing loss (SNHL; >15 dB) was seen in 0.5% of cases in this series."
    explanation: >-
      The principal risk of the operation, from the same 14-year prospective
      series as the benefit figure.
  - reference: PMID:24572322
    reference_title: "Laser versus non-laser stapedotomy in otosclerosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our overall results suggest that the laser stapedotomy had significantly better hearing results than non-laser stapedotomy."
    explanation: >-
      The technique comparison across 11 studies and 1,614 subjects. The same
      analysis found no complication advantage, which is why the description
      calls the benefit modest.
  - reference: PMID:35878633
    reference_title: "Stapedotomy Versus Hearing Aids in the Management of Conductive Hearing Loss Caused by Otosclerosis: A Prospective Comparative Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stapedotomy remains more effective compared with hearing aids with greater improvements in quality of life, patient satisfaction, hearing outcomes, and self-evaluated tinnitus."
    explanation: >-
      A within-patient comparison against amplification, in which each of 22
      patients received a hearing aid first and then surgery, which is the
      strongest available design for this comparison.
- name: Hearing Aid Amplification
  description: >-
    The non-surgical alternative, and the option for a patient who declines
    surgery, has an only ear, or has a loss too advanced for stapedotomy alone.
    Amplification compensates for the transmission deficit without altering the
    lesion. It performs worse than surgery on hearing, quality of life and
    tinnitus in direct comparison, and a Markov cost-effectiveness model over a
    30-year-old patient's lifetime favours surgery. Uptake is poor even where
    indicated: 28 to 30 years after stapedectomy, 95% of one cohort needed
    amplification and 46% had none.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Impaired Ossicular Sound Transmission
    treatment_effect: MODULATES
    description: >-
      Amplification raises the input to overcome the conductive block. It is
      recorded against the transmission node rather than the fixation node
      because it changes the signal, not the joint.
    evidence:
    - reference: PMID:35878633
      reference_title: "Stapedotomy Versus Hearing Aids in the Management of Conductive Hearing Loss Caused by Otosclerosis: A Prospective Comparative Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Adult patients with a unilateral conductive hearing loss of at least 30 dB caused by otosclerosis."
      explanation: >-
        Establishes that the intervention is applied to, and measured against,
        the conductive transmission deficit this node represents.
  notes: >-
    NCIT:C183182 Hearing Aid is a device concept and is not reachable from
    NCIT:C25218, so it cannot sit in the `term:` slot of a TreatmentTerm. The
    bound action is Rehabilitation and the device identity is carried as a
    `qualifiers` predicate-value pair, which is the device pattern CLAUDE.md
    prescribes.
  evidence:
  - reference: PMID:23336672
    reference_title: "Hearing-aid use and benefit: a long-term follow-up in patients undergoing surgery for otosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 95% of the subjects there was a theoretical need for hearing-aid amplification at follow-up; 46% of the subjects had no hearing aids, while 26% had unilateral and 28% bilateral hearing aids."
    explanation: >-
      The long-term unmet-need finding recorded in the description, 28 to 30
      years after stapedectomy in 65 patients.
  - reference: PMID:23336672
    reference_title: "Hearing-aid use and benefit: a long-term follow-up in patients undergoing surgery for otosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The subjects reported a high level of satisfaction (mean 4.5) and benefit (mean 4.2), but also residual activity limitations (mean 3.1)."
    explanation: >-
      The benefit and its ceiling among those who do use amplification, on the
      validated IOI-HA instrument.
  - reference: PMID:31697352
    reference_title: Cost-effectiveness of Stapedectomy vs Hearing Aids in the Treatment of Otosclerosis.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The incremental cost-effectiveness ratio for stapedectomy is $3918.43 per QALY."
    explanation: >-
      The economic comparison. Graded COMPUTATIONAL because it is a Markov
      decision model over literature-derived inputs rather than a trial.
- name: Cochlear Implantation
  description: >-
    Reserved for far-advanced disease, meaning severe to profound loss with
    speech discrimination too poor for amplification, where the target is the
    residual auditory nerve rather than the ossicular chain. Outcomes match
    implantation for other causes on most measures, but two complications are
    specific to this disease and both track retrofenestral extension: facial
    nerve stimulation, pooled at 18%, because demineralized otosclerotic bone
    offers a low-impedance path from the electrode to the facial canal, and
    partial insertion at 10% where new bone has narrowed the scala. Prior
    stapedotomy does not preclude implantation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Loss of Endocochlear Potential
    treatment_effect: BYPASSES
    description: >-
      Direct electrical stimulation of the spiral ganglion substitutes for the
      failed transduction step, leaving the cochlear lesion untouched.
    evidence:
    - reference: PMID:30498273
      reference_title: "Cochlear implantation in far-advanced otosclerosis: hearing results and complications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Severe forms of otosclerosis known as far-advanced otosclerosis (FAO) can lead to severe to profound sensorineural hearing loss and can justify cochlear implantation."
      explanation: >-
        Ties the indication for implantation to the sensorineural deficit this
        node produces, which is what the link asserts.
  notes: >-
    Bound the same way as stapedotomy and for the same reason: NCIT:C157820
    Cochlear Implant is the device, is not reachable from NCIT:C25218, and is
    therefore attached as a device qualifier rather than as the action term.
    This follows the worked example in CLAUDE.md.
  evidence:
  - reference: PMID:30498273
    reference_title: "Cochlear implantation in far-advanced otosclerosis: hearing results and complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant difference was found between FAO and non-FAO hearing outcomes, except that monosyllabic WRS were lower for FAO patients, especially those who underwent previous stapedotomy."
    explanation: >-
      The controlled comparison against non-otosclerotic implant recipients, in
      35 ears versus 38 controls.
  - reference: PMID:30498273
    reference_title: "Cochlear implantation in far-advanced otosclerosis: hearing results and complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "86% of FAO implanted patients had retrofenestral extension on CT. These were associated with poorer disyllabic WRS (51% vs 68%, p < 0.05) than those with only fenestral involvement."
    explanation: >-
      Ties the poorer outcomes to the retrofenestral extension node rather than
      to otosclerosis in general.
  - reference: PMID:36082830
    reference_title: "Cochlear Implantation in Far Advanced Otosclerosis: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cochlear implantation in FAO demonstrates significant gains in speech discrimination scores with higher rates of FNS and partial insertion."
    explanation: >-
      The pooled benefit-and-complication statement across 27 studies, and the
      source of the two rates quoted in the description.
- name: Sodium Fluoride
  description: >-
    The oldest medical therapy, given on the rationale that fluoride converts
    active otospongiotic lesions to inactive sclerotic ones and so arrests
    sensorineural progression. The evidence base is thin and has not improved in
    thirty-five years. Exactly two placebo-controlled trials exist and they
    disagree; a systematic review of them concluded that the support is weak and
    comes from one study with significant limitations. This treatment is
    recorded because it is still used, not because it is established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium fluoride
      term:
        id: CHEBI:28741
        label: sodium fluoride
  target_mechanisms:
  - target: Focal Osteoclastic Resorption of Otic Capsule Bone
    treatment_effect: INHIBITS
    description: >-
      The stated aim is to stop the resorptive phase and drive the focus to
      inactivity. Recorded as the intended target of the therapy; the evidence
      that it achieves this in patients is weak, which is the point of the
      accompanying knowledge gap.
    evidence:
    - reference: PMID:36923175
      reference_title: "Conservative Otosclerosis Treatment With Sodium Fluoride and Other Modern Formulations: A Systematic Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The rationale for medical therapy for otospongiosis is to slow down and eventually stop the phase of bone resorption."
      explanation: >-
        States the mechanistic target of medical therapy, which is the node this
        link points at.
  evidence:
  - reference: PMID:2655462
    reference_title: "Otospongiosis and sodium fluoride. A clinical double-blind, placebo-controlled study on sodium fluoride treatment in otospongiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results showed a statistically significant greater deterioration of hearing loss in the placebo group than in the group actively treated with 40 mg of sodium fluoride daily."
    explanation: >-
      The one positive randomized placebo-controlled result, in 95 patients. It
      is the source of essentially all the support this treatment has.
  - reference: PMID:24751746
    reference_title: "Limited evidence for the effect of sodium fluoride on deterioration of hearing loss in patients with otosclerosis: a systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is weak evidence from one study with significant limitations that deterioration of hearing loss in otosclerosis patients receiving sodium fluoride treatment is less than in patients treated with a placebo."
    explanation: >-
      The systematic appraisal of that literature, and the reason this entry
      does not present fluoride as established. It supports the description's
      claim about the strength of the evidence, not the drug's efficacy.
  - reference: PMID:24751746
    reference_title: "Limited evidence for the effect of sodium fluoride on deterioration of hearing loss in patients with otosclerosis: a systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our search yielded 168 original titles, of which, 2 placebo-controlled studies were eligible for data extraction. The results of these 2 studies were conflicting."
    explanation: >-
      Records that only two eligible trials exist and that they disagree, which
      is the concrete basis for calling the evidence base thin.
  - reference: PMID:20163750
    reference_title: "Sodium fluoride in otosclerosis treatment: review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is low quality evidence suggesting that sodium fluoride may be of benefit to preserve hearing and reduce vestibular symptoms in patients with otosclerosis."
    explanation: >-
      A second independent appraisal reaching the same verdict, and the source
      for the claim that dosing and duration are also unsettled.
- name: Third-Generation Bisphosphonate Therapy
  description: >-
    Antiresorptive therapy aimed at the same target as fluoride with a better
    mechanistic rationale, since otosclerosis is an osteoclast-driven lesion and
    risedronate and zoledronate are potent, bone-avid osteoclast inhibitors. The
    supporting human data are a single retrospective series of 10 patients in
    whom sensorineural progression stabilized. That is enough to justify the
    hypothesis and not enough to establish the treatment; there is no randomized
    trial. The mouse counterpart is stronger and is recorded under animal
    models.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: risedronate
      term:
        id: CHEBI:8869
        label: Risedronic acid
    - preferred_term: zoledronate
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Focal Osteoclastic Resorption of Otic Capsule Bone
    treatment_effect: INHIBITS
    description: >-
      Bisphosphonates inhibit osteoclast-mediated resorption directly, which is
      the node this treatment is aimed at.
    evidence:
    - reference: PMID:22935809
      reference_title: Third-generation bisphosphonates for treatment of sensorineural hearing loss in otosclerosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Otosclerosis is a disease of abnormal bone remodeling in the otic capsule. In recent years, third generation bisphosphonates, with more powerful anti-resorptive properties and increased bone affinity, have demonstrated effectiveness in the treatment of osteoporosis and other metabolic bone diseases."
      explanation: >-
        The authors' stated mechanistic rationale, which is exactly what this
        link asserts.
  evidence:
  - reference: PMID:22935809
    reference_title: Third-generation bisphosphonates for treatment of sensorineural hearing loss in otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 10 patients (19 ears) showed at least no significant progression of SNHL (i.e., stabilization) at an average follow-up of 13 months."
    explanation: >-
      The entire human efficacy evidence for this treatment: 10 patients,
      retrospective, uncontrolled, 13 months.
  - reference: PMID:22935809
    reference_title: Third-generation bisphosphonates for treatment of sensorineural hearing loss in otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with zoledronate or risedronate stabilized progressive SNHL related to otosclerosis in this small group of patients. Further evaluation of third-generation bisphosphonate treatments is warranted."
    explanation: >-
      The authors' own framing of the result as hypothesis-generating, which is
      how this entry treats it.
  - reference: PMID:11300278
    reference_title: Pathophysiology of otosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Of the factors that may inhibit this process, fluorides, cytokine inhibitors, and bisphosphonates, third-generation bisphosphonates appear to hold the most promise."
    explanation: >-
      The prior expectation from a pathophysiology review, recorded to show that
      the rationale predates the clinical series rather than following from it.
animal_models:
- name: Osteoprotegerin-deficient mouse
  species: Mouse
  genotype: Tnfrsf11b (Opg) homozygous knockout
  background: C57BL/6
  publication: PMID:16467704
  description: >-
    The closest thing to an otosclerosis model, and the model that generated the
    osteoprotegerin hypothesis in the first place. Opg-null mice develop
    multifocal osteoclastic resorption and new bone formation within the otic
    capsule that the original authors describe as resembling human otosclerosis,
    fix the stapes at its junction with the otic capsule, and lose hearing
    progressively. The critical caveat is that the animal is a systemic OPG
    null, a model of juvenile Paget disease, with generalized high bone turnover
    and thinning of all three ossicles, whereas human otosclerosis is confined
    to the otic capsule in patients whose systemic bone turnover is normal.
  modeled_mechanisms:
  - target: Failure of Otic Capsule Remodeling Suppression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Removing OPG removes the proposed suppressor and produces active
      remodeling in a bone that is normally quiescent, which is the node's
      central claim.
    limitations: >-
      The knockout is systemic and constitutive, so it deletes the suppressor
      everywhere rather than failing locally. That inverts the feature which
      defines the human disease: patients have normal systemic remodeling rates
      and a lesion confined to the otic capsule, while the mouse has generalized
      high turnover with the capsule as one affected site among many. The model
      therefore supports the sufficiency of OPG loss to release capsular
      remodeling, and says nothing about why the failure is focal in people.
    evidence:
    - reference: PMID:16467704
      reference_title: Osteoprotegrin knockout mice demonstrate abnormal remodeling of the otic capsule and progressive hearing loss.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Osteoprotegerin knockout mice demonstrated abnormal remodeling of bone within the otic capsule with multiple foci showing osteoclastic bone resorption and formation of new bone."
      explanation: >-
        The histological phenotype that makes this model informative for the
        node.
    readouts:
    - name: Otic capsule histology
      target: Failure of Otic Capsule Remodeling Suppression
      direction: ALTERED
      interpretation: >-
        Multifocal resorption and new bone formation appear in a bone that shows
        none in age-matched wild-type controls.
      evidence:
      - reference: PMID:16467704
        reference_title: Osteoprotegrin knockout mice demonstrate abnormal remodeling of the otic capsule and progressive hearing loss.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Such changes were not seen in the age-matched B6 controls."
        explanation: The control comparison that makes the histological readout interpretable.
  - target: Stapes Footplate Fixation at the Oval Window
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The stapes is fixed to the otic capsule in these animals, which is the
      human disease's defining mechanical lesion.
    limitations: >-
      The route to fixation is not the human one. In patients the footplate is
      immobilized by sclerotic bone expanding across the stapediovestibular
      joint from a focus at the fissula ante fenestram; in the mouse the ossicles
      are being resorbed, becoming thinner with a thinner and broader footplate,
      and the junction fuses in the course of that. A treatment or mechanism
      study reading footplate fixation off this model would be studying a
      different lesion with the same name.
    evidence:
    - reference: PMID:16564235
      reference_title: Resorption of auditory ossicles and hearing loss in mice lacking osteoprotegerin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Most notably, unlike in the case in wild-type mice, the junction between the stapes and the otic capsule was fixed in Opg(-/-) mice, and the stapedial footplate was thinner and broader."
      explanation: >-
        Reports both the fixation and the resorptive morphology that makes it a
        different lesion from the human one.
    readouts:
    - name: Auditory brainstem response threshold after risedronate treatment
      target: Stapes Footplate Fixation at the Oval Window
      direction: RESTORED
      interpretation: >-
        Nine weeks of risedronate inhibited ossicular bone loss, reduced the
        bony fusion at the stapes-otic capsule junction, and significantly
        improved hearing, which is the animal counterpart of the bisphosphonate
        rationale in the treatments section.
      evidence:
      - reference: PMID:18715136
        reference_title: Bisphosphonate therapy ameliorates hearing loss in mice lacking osteoprotegerin.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Bony fusion of the junction between the stapes and the otic capsule was reduced after treatment. Moreover, ABR measurement showed that hearing in Opg(-/-) mice was significantly improved by risedronate treatment."
        explanation: The rescue result, on both the structural and functional readout.
  - target: Loss of Endocochlear Potential
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The mouse does develop a sensorineural component, but by a different
      route, so it does not model this node.
    limitations: >-
      In Opg-null mice the sensorineural loss comes from demyelination and
      degeneration of the cochlear nerve and from ERK-mediated sensitization of
      spiral ganglion cells to apoptosis, which is a neural lesion. The human
      sensorineural component in cochlear otosclerosis is attributed to spiral
      ligament hyalinization and strial atrophy disrupting potassium recycling,
      which is a lateral wall lesion. Both end in sensorineural hearing loss and
      neither is the other; using this model to study the human cochlear lesion
      would substitute a nerve pathology for a lateral-wall one.
    evidence:
    - reference: PMID:23607938
      reference_title: Loss of osteoprotegerin expression in the inner ear causes degeneration of the cochlear nerve and sensorineural hearing loss.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "OPG deficiency caused demyelination and degeneration of the cochlear nerve in vivo."
      explanation: >-
        Identifies the mechanism of sensorineural loss in this model, which is
        not the mechanism this node describes.
  evidence:
  - reference: PMID:16467704
    reference_title: Osteoprotegrin knockout mice demonstrate abnormal remodeling of the otic capsule and progressive hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The active bone remodeling process in the knockout animals showed many similarities to otosclerosis seen in human temporal bones."
    explanation: >-
      The authors' own assessment of the resemblance, which is the basis for
      treating this model as informative for the disease at all.
  - reference: PMID:16467704
    reference_title: Osteoprotegrin knockout mice demonstrate abnormal remodeling of the otic capsule and progressive hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This mouse may provide a valuable animal model of human otosclerosis."
    explanation: >-
      The proposal that this is an otosclerosis model, stated as a possibility
      by its authors and treated as such here.
- name: Smarca4 E1548K knock-in mouse
  species: Mouse
  genotype: Smarca4+/E1548K knock-in (orthologue of human SMARCA4 p.E1610K)
  background: C57BL/6J
  publication: PMID:37399313
  description: >-
    A CRISPR knock-in carrying the mouse equivalent of the human otosclerosis
    variant, generated in the same paper that identified the gene. The animals
    are otherwise normal, with no skeletal anomaly on whole-body X-ray and no
    histopathology elsewhere, and have hearing impairment on acoustic startle
    and auditory brainstem response with a structurally abnormal incus.
  modeled_mechanisms:
  - target: Impaired Ossicular Sound Transmission
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mouse reproduces the functional endpoint, a disrupted ossicular chain
      producing measurable hearing loss, from the same allele that causes the
      disease in people.
    limitations: >-
      The lesion is in the wrong bone and of the wrong kind. The mutant's
      abnormality is a malformed incus disrupting the chain, described as a
      structural anomaly of the auditory bulla ossicles; the human lesion is
      progressive remodeling of the otic capsule that ankyloses the stapes
      footplate at the oval window. The model therefore supports SMARCA4 as
      causal for an ossicular-chain phenotype without demonstrating the otic
      capsule remodeling that defines otosclerosis.
    evidence:
    - reference: PMID:37399313
      reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Isolated ossicles of the auditory bullae of mutant mice exhibited a highly irregular structure of the incus bone, and their in situ micro-CT studies demonstrated the anomalous structure of the incus bone, causing disruption in the ossicular chain."
      explanation: >-
        Reports both the functional claim this link makes and the anatomical
        divergence recorded as its limitation.
    readouts:
    - name: Auditory brainstem response threshold
      target: Impaired Ossicular Sound Transmission
      direction: INCREASED
      interpretation: >-
        A consistent threshold elevation across all tested frequencies at four
        months, averaging 11.3 dB SPL, which is modest and closer to a mild
        conductive loss than to the human disease's typical air-bone gap.
      evidence:
      - reference: PMID:37399313
        reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mutant Smarca4+/E1548K mice exhibited marked hearing impairment demonstrated through acoustic startle response and auditory brainstem response tests."
        explanation: The functional measurement behind this readout.
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that otosclerosis can be caused by a variant in SMARCA4, with a similar phenotype of hearing impairment and abnormal bone formation in the auditory bullae in transgenic mice carrying the human mutation in the mouse SMARCA4 orthologue."
    explanation: >-
      The authors' summary of what the model shows, including their own phrasing
      "similar phenotype" rather than a claim of full recapitulation.
- name: foxl1 mutant zebrafish
  species: Zebrafish
  genotype: foxl1n1001 (CRISPR 52 bp deletion upstream of the forkhead domain)
  publication: PMID:35885890
  description: >-
    Built explicitly as a model for otosclerosis after FOXL1 was identified as
    an OTSC gene, on the reasoning that zebrafish jaw elements are homologous to
    the mammalian middle ear ossicles. What it produced is a developmental
    phenotype and not a remodeling one: delayed craniofacial cartilage formation
    and jawbone mineralization with reduced collagen gene expression, an
    unchanged axial skeleton, and a phenotype that only becomes severe when
    combined with a foxc1a mutation.
  modeled_mechanisms:
  - target: Reparative Deposition of Sclerotic Woven Bone
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The model does not reproduce the pathological bone deposition that defines
      otosclerosis, and moves in the opposite direction.
    limitations: >-
      Three divergences compound. The direction is inverted: the fish shows
      reduced and delayed mineralization where the disease shows excess
      deposition. The timing is wrong: this is a defect of skeletal development,
      whereas otosclerosis is remodeling of a bone that completed development
      decades earlier. And the site is a homologue rather than the structure
      itself, with jaw elements standing in for middle ear ossicles and no otic
      capsule counterpart at all. The model is informative about what foxl1 does
      to cartilage and collagen expression; it is not informative about this
      node.
    evidence:
    - reference: PMID:35885890
      reference_title: Mutation of foxl1 Results in Reduced Cartilage Markers in a Zebrafish Model of Otosclerosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate that foxl1 regulates the expression of collagen genes such as collagen type 1 alpha 1a and collagen type 11 alpha 2, and results in a delay in jawbone mineralization, while the axial skeleton remains unchanged."
      explanation: >-
        The observed phenotype: reduced and delayed mineralization in jaw
        elements, which is the opposite of the deposition this node describes.
  evidence:
  - reference: PMID:35885890
    reference_title: Mutation of foxl1 Results in Reduced Cartilage Markers in a Zebrafish Model of Otosclerosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our zebrafish model demonstrates atypical cartilage formation and mineralization in the zebrafish craniofacial skeleton in foxl1 mutants and demonstrates that aberrant collagen expression may underlie the development of otosclerosis."
    explanation: >-
      The authors' own framing. Note the claim they draw is about collagen
      expression as a candidate mechanism, not that the fish has otosclerosis.
differential_diagnoses:
- name: Superior semicircular canal dehiscence and other third-window lesions
  description: >-
    The most important thing to exclude before opening a middle ear. A third
    window in the labyrinth shunts acoustic energy away from the cochlea and
    lowers bone conduction thresholds, producing an air-bone gap behind a normal
    eardrum that mimics stapes fixation exactly on pure-tone audiometry.
    Operating on it is both useless and avoidable.
  disease_term:
    preferred_term: semicircular canal dehiscence syndrome
    term:
      id: MONDO:0018484
      label: semicircular canal dehiscence syndrome
  distinguishing_features:
  - >-
      Acoustic reflexes are the discriminator and they are cheap: reflexes are
      absent in stapes fixation and preserved in a third-window lesion. Third
      window symptoms such as autophony and sound- or pressure-induced vertigo
      point the same way. High-resolution CT with reformatting in the plane of the
      superior canal settles it.
  evidence:
  - reference: PMID:26626134
    reference_title: Acoustic Reflex Screening of Conductive Hearing Loss for Third Window Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-two percent of ears (12 of 23) with at least 1 detectable acoustic reflex had a nonossicular etiology."
    explanation: >-
      Quantifies the discriminating value of a preserved reflex, which is the
      distinguishing feature recorded here.
  - reference: PMID:26626134
    reference_title: Acoustic Reflex Screening of Conductive Hearing Loss for Third Window Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The detection of even 1 acoustic reflex or third window symptom (regardless of reflex status) should prompt further workup prior to middle ear exploration."
    explanation: The clinical rule this differential exists to enforce.
- name: Osteogenesis imperfecta with stapes fixation
  description: >-
    The classic mimic, and the one where the two diseases are hardest to tell
    apart at the footplate. A substantial minority of people with osteogenesis
    imperfecta develop conductive or mixed hearing loss from stapes fixation,
    with a thickened footplate that looks otosclerotic to the operating surgeon.
    Stapes surgery works in both, though less completely in osteogenesis
    imperfecta.
  disease_term:
    preferred_term: osteogenesis imperfecta type 1
    term:
      id: MONDO:0008146
      label: osteogenesis imperfecta type 1
  distinguishing_features:
  - >-
      The systemic phenotype rather than the ear: fractures, blue sclerae,
      dentinogenesis imperfecta, short stature, family history of a collagen
      disorder. This is also the cleanest illustration of what makes otosclerosis
      otosclerosis, namely generalized bone fragility versus a lesion confined to
      one bone in a person with normal systemic bone turnover. Intraoperatively,
      fragile or fractured crura are characteristic of osteogenesis imperfecta.
  evidence:
  - reference: PMID:33433749
    reference_title: "Stapes surgery in osteogenesis imperfecta: retrospective analysis of 18 operated ears."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main operative findings were stapes fixation, thickened footplate and fragile or fractured stapes crura."
    explanation: >-
      The overlap and the intraoperative discriminator, from 18 operated ears in
      11 patients.
  - reference: PMID:33433749
    reference_title: "Stapes surgery in osteogenesis imperfecta: retrospective analysis of 18 operated ears."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We obtained an air-bone gap closure to within 10 dB in 46% of the cases and to within 15 dB in 92% of the cases at 1-year follow-up."
    explanation: >-
      The outcome, which is materially worse than the 94% closure to 10 dB in
      otosclerotic stapedotomy and is worth knowing before consenting a patient.
- name: Paget disease of bone involving the temporal bone
  description: >-
    A systemic high-turnover bone disease that can involve the otic capsule and
    cause hearing loss, and which is grouped with otosclerosis in older
    literature on the grounds that both are viral-hypothesis remodeling
    disorders.
  disease_term:
    preferred_term: bone Paget disease
    term:
      id: MONDO:0005382
      label: bone Paget disease
  distinguishing_features:
  - >-
      Distribution and systemic involvement. Paget disease is systemic with
      occasional capsular involvement; otosclerosis is capsular with a normal
      skeleton, and the pattern of remodeling within the temporal bone differs
      between the two. Raised alkaline phosphatase and characteristic radiographic
      changes elsewhere in the skeleton settle it.
  evidence:
  - reference: PMID:17245023
    reference_title: Dynamic bone studies of the labyrinthine capsule in relation to otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is not clear why a virus should cause otosclerosis, confined to the bony otic capsule with no effects on the general skeleton in some patients, and systemic Paget's disease with only occasional involvement of the bony otic capsule in others."
    explanation: >-
      States the distribution difference that separates the two diseases, and
      does so as an objection to the shared viral hypothesis.
  - reference: PMID:17245023
    reference_title: Dynamic bone studies of the labyrinthine capsule in relation to otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the extent and distribution of pathological bone remodelling is different in Paget's disease of the temporal bone and in otosclerosis."
    explanation: >-
      The histological counterpart of the same distinction, within the temporal
      bone itself.
- name: Congenital stapes fixation and other ossicular anomalies
  description: >-
    Congenital fixation of the footplate or of the malleus, and incudostapedial
    joint discontinuity, all present as a conductive loss behind a normal
    eardrum. Congenital stapes fixation is a particular trap because it produces
    a Carhart notch just as acquired fixation does.
  distinguishing_features:
  - >-
      Age and course. Congenital fixation is present from childhood and does not
      progress; otosclerosis begins in adulthood and worsens. Where the history is
      unclear, the notch does not help, because it marks fixation and not its
      cause, and the answer comes from CT or from exploration.
  evidence:
  - reference: PMID:21422306
    reference_title: "Carhart notch 2-kHz bone conduction threshold dip: a nondefinitive predictor of stapes fixation in conductive hearing loss with normal tympanic membrane."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 153 ears among 127 consecutive patients with a congenital ossicular anomaly or otosclerosis."
    explanation: >-
      The study population, assembled precisely because these two diagnoses are
      audiometrically hard to separate.
  - reference: PMID:21422306
    reference_title: "Carhart notch 2-kHz bone conduction threshold dip: a nondefinitive predictor of stapes fixation in conductive hearing loss with normal tympanic membrane."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2-kHz bone conduction recovery after operation were evaluated in a stapes fixation group (which included cases of otosclerosis and congenital stapes fixation)"
    explanation: >-
      Records that congenital and otosclerotic fixation were pooled into one
      audiometric group, which is the reason the notch cannot separate them.
- name: Tympanosclerosis and otitis media with effusion
  description: >-
    Middle-ear disease that fixes or loads the ossicular chain and produces a
    conductive loss, sometimes with a Carhart notch.
  distinguishing_features:
  - >-
      The eardrum and the tympanogram. Otosclerosis requires a normal drum and a
      normal-compliance tympanogram; effusion gives a flat tracing, and
      tympanosclerosis usually leaves visible drum changes. Where a Carhart notch
      is present at 1 kHz rather than 2 kHz, the footplate is more likely mobile
      and a middle-ear cause more likely.
  evidence:
  - reference: PMID:16995960
    reference_title: "Predictive role of Carhart's notch in pre-operative assessment for middle-ear surgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, in patients with chronic otitis media, a Carhart's notch was seen at 1 kHz in 10 (55 per cent) patients and at 2 kHz in eight (45 per cent) patients."
    explanation: >-
      The frequency difference that partially separates middle-ear disease from
      stapes fixation on audiometry alone.
discussions:
- discussion_id: why_only_the_otic_capsule
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is otosclerosis confined to the otic capsule when every gene implicated
    in it acts on bone throughout the skeleton?
  attaches_to:
  - pathophysiology#Failure of Otic Capsule Remodeling Suppression
  - pathophysiology#Germline Susceptibility Variants in Bone-Remodeling Genes
  rationale: >-
    This is the disease's central unanswered question and the reason its
    genetics have been so hard to interpret. Patients with otosclerosis have
    normal systemic bone remodeling rates; the lesion sits in the one bone whose
    turnover is normally suppressed to about a hundredth of the skeletal rate,
    and it sits preferentially where that suppression is strongest. Every causal
    or susceptibility gene identified so far, including FOXL1, SMARCA4, RELN,
    TGFB1, MEPE and AHSG, is expressed well beyond the temporal bone, and the
    biobank GWAS finds the risk loci genetically correlated with height and
    fracture risk, that is, with systemic bone biology. So the genetics predict
    a generalized bone phenotype and the disease is not one.

    The best current proposal is that the specificity lives in the anatomy
    rather than in the genes: osteoprotegerin secreted by inner ear soft tissue
    diffuses into the capsule through the lacuno-canalicular system, and that
    delivery route depends on living osteocytes, so local osteocyte death could
    open a focus while the rest of the skeleton stays normal. That is a
    hypothesis supported by co-localization of non-viable osteocytes with
    otosclerotic foci, not a demonstrated mechanism, and it does not explain why
    the failure occurs preferentially at the fissula ante fenestram.
  evidence:
  - reference: PMID:17245023
    reference_title: Dynamic bone studies of the labyrinthine capsule in relation to otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests the existence of a local inner ear mechanism in control of capsular remodelling activity, which is either overruled, bypassed or most likely defective in otosclerosis, no matter what may have triggered the disease process."
    explanation: >-
      States the shape of the gap: a local control mechanism must exist and must
      fail, independently of whatever triggers the disease.
  - reference: PMID:23158898
    reference_title: On the biology of the bony otic capsule and the pathogenesis of otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "earlier theories of virus infections, autoimmunity or association to generalized bone diseases have been unable to explain why otosclerosis only occurs in the bony otic capsule while the rest of the skeleton remains completely normal."
    explanation: >-
      Records that the leading etiological theories do not answer this question,
      which is what makes it a gap rather than a detail.
  - reference: PMID:23158898
    reference_title: On the biology of the bony otic capsule and the pathogenesis of otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, 3-D reconstructions and vector-based stereology revealed a co-existence between non-viable osteocytes and otosclerosis."
    explanation: >-
      The observation behind the osteocyte-death hypothesis offered as a
      candidate answer.
- discussion_id: no_species_gets_otosclerosis
  kind: KNOWLEDGE_GAP
  prompt: >-
    Given that otosclerosis occurs in no species other than humans, what would
    an adequate animal model of it even look like?
  attaches_to:
  - pathophysiology#Failure of Otic Capsule Remodeling Suppression
  - animal_models#Osteoprotegerin-deficient mouse
  - animal_models#foxl1 mutant zebrafish
  rationale: >-
    This entry records three animal models and every one of them is linked with
    a caveat, which is not a curation failure but the state of the field. The
    disease is described as exclusively human, so there is no natural model to
    find and every model is an engineered approximation of one component. The
    Opg-null mouse gets the capsular remodeling but as part of a systemic
    high-turnover disease; the Smarca4 knock-in gets a causal human allele and a
    hearing phenotype but through a malformed incus rather than capsular
    remodeling; the foxl1 zebrafish gets the gene but produces reduced
    mineralization in jaw homologues, the opposite process in the wrong
    structure.

    What is missing is a model in which remodeling suppression fails locally, in
    an adult, in a capsule that developed normally, on a background of normal
    systemic bone turnover. A conditional or inducible otic-capsule-restricted
    OPG knockout is the obvious candidate and does not appear to have been
    reported. Until something like it exists, no model can test the question the
    disease actually poses, and therapeutic results from these models, such as
    the risedronate rescue in Opg-null mice, transfer to patients only as far as
    the shared osteoclast biology carries them.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Otosclerosis is an exclusively human disorder characterized by pathologic remodeling of the bone encasing the inner ear, called the otic capsule"
    explanation: The species restriction that creates the gap.
  - reference: PMID:18235207
    reference_title: "Otosclerosis and measles virus - association or causation?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Otosclerosis is a frequent condition which occurs exclusively in the human temporal bone."
    explanation: >-
      Independent statement of the same restriction, from a different research
      tradition.
- discussion_id: opg_null_mouse_is_systemic
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can the Opg-null mouse be used to study the localization of otosclerosis,
    when the feature that defines the human disease, a lesion confined to one
    bone in a person with normal systemic bone turnover, is precisely what the
    systemic knockout abolishes?
  attaches_to:
  - animal_models#Osteoprotegerin-deficient mouse
  - pathophysiology#Failure of Otic Capsule Remodeling Suppression
  rationale: >-
    The mismatch is structural rather than a matter of degree, and it runs in a
    direction that is easy to overlook because the model looks so good on the
    endpoint. Opg-null mice do develop multifocal capsular remodeling, do fix
    the stapes, and do lose hearing progressively, and their authors proposed
    them as an otosclerosis model on exactly those grounds. But the knockout is
    constitutive and whole-body, so it deletes the proposed suppressor
    everywhere; the animals have generalized high bone turnover, thinning of all
    three ossicles, and are used elsewhere as a model of juvenile Paget disease.
    Human otosclerosis is the opposite arrangement: normal systemic remodeling
    with a focal capsular lesion.

    The practical rule this yields is narrow but real. The model is informative
    about whether losing OPG is sufficient to release capsular remodeling, about
    the osteoclast biology of the lesion, and about whether antiresorptive
    therapy can reverse capsular bone change, all of which it answers
    affirmatively. It is not informative about why the human lesion is focal,
    about the fissula ante fenestram predilection, or about anything that
    depends on the surrounding skeleton being normal. Its sensorineural arm is a
    separate mismatch: the mouse loses hearing through cochlear nerve
    demyelination, where the human cochlear component is attributed to spiral
    ligament and strial pathology.
  evidence:
  - reference: PMID:17245023
    reference_title: Dynamic bone studies of the labyrinthine capsule in relation to otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "systemic remodelling rates are normal even in otosclerotic patients"
    explanation: >-
      The human fact the model cannot reproduce, and the whole substance of the
      mismatch.
  - reference: PMID:16564235
    reference_title: Resorption of auditory ossicles and hearing loss in mice lacking osteoprotegerin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All three ossicles in Opg(-/-) mice showed thinning, especially at the malleal manubrium and incus body."
    explanation: >-
      Documents the generalized ossicular resorption in the model, which has no
      counterpart in otosclerosis.
  - reference: PMID:23607938
    reference_title: Loss of osteoprotegerin expression in the inner ear causes degeneration of the cochlear nerve and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that they develop sensorineural hearing loss, in addition to conductive hearing loss due to abnormal middle-ear bones."
    explanation: >-
      The second arm of the mismatch: the model's sensorineural loss arises from
      a neural lesion rather than from the lateral wall pathology seen in
      cochlear otosclerosis.
- discussion_id: measles_causation_contested
  kind: CONTROVERSY
  prompt: >-
    Is persistent measles virus infection a cause of otosclerosis, or a
    detectable passenger in a bone that happens to be remodeling?
  attaches_to:
  - environmental#Persistent measles virus infection
  - environmental#Measles vaccination
  - pathophysiology#Persistent Measles Virus Infection of the Otosclerotic Focus
  rationale: >-
    The case for causation has two independent legs. Tissue virology finds
    measles RNA in most otosclerotic footplates and none in controls, with CD46
    upregulated on the resorbing cells; and national epidemiology finds
    otosclerosis admissions falling faster in vaccinated than unvaccinated age
    groups, with otitis media as a negative control, plus a rising mean age of
    stapedectomy patients consistent with a cohort effect. That is a stronger
    argument than an association, because vaccination is an intervention on the
    exposure.

    The case against is that a contemporary 657-patient British cohort found no
    association with measles infection at all, and that the ecological design of
    the vaccination studies cannot separate the vaccine from everything else
    that changed in German healthcare between 1974 and 2004. The two lines of
    evidence are not measuring the same thing, since questionnaire history of
    measles is a different variable from viral RNA in the footplate, which is
    part of why the disagreement has not resolved. This entry models the
    infection as a node and the vaccination as a protective exposure because
    that is what the tissue and intervention evidence supports, and records the
    negative cohort result as a REFUTE item on the environmental entry rather
    than dropping it.
  evidence:
  - reference: PMID:18235207
    reference_title: "Otosclerosis and measles virus - association or causation?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The strong correlation makes it most plausible that the MV is at least one triggering factor for the development of otosclerosis."
    explanation: >-
      The affirmative reading, and note that its own title poses the question as
      open.
  - reference: PMID:30540696
    reference_title: The Epidemiology of Otosclerosis in a British Cohort.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No association with measles infection was detected."
    explanation: The contemporary negative result on the other side of the question.
  - reference: PMID:26276418
    reference_title: "The pathophysiology of otosclerosis: Review of current research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "So far, many possible etiological factors like genetics, HLA, autoimmunity, viruses, inflammation, and hormones have been investigated but still the development of the disease remains unclear."
    explanation: >-
      A review's summary position, which is that none of the candidate
      etiologies including this one is settled.
- discussion_id: pregnancy_effect_contested
  kind: CONTROVERSY
  prompt: >-
    Does pregnancy accelerate otosclerosis, or is the association an artefact of
    a disease that affects women of reproductive age?
  attaches_to:
  - environmental#Pregnancy
  rationale: >-
    The claim is old, widely repeated in clinical teaching, and poorly supported
    in either direction. A review of 11 studies covering 2,323 women reports
    hearing change during pregnancy in 44% and a significant correlation with
    number of pregnancies; a controlled comparison of 47 stapedectomy patients
    with children against 47 without finds no difference in air conduction, bone
    conduction or discrimination, and no dose-response with parity or
    breastfeeding.

    Both designs have the same weakness from opposite ends. The review is of
    heterogeneous retrospective series in which hearing change during pregnancy
    is often self-reported and always unblinded, in a disease that progresses
    anyway over exactly the years in which women bear children; the controlled
    study is small, retrospective, and restricted to women who reached
    stapedectomy. Nobody has measured otic capsule turnover across a pregnancy,
    so the mechanistic claim is entirely unexamined. A prospective audiometric
    cohort with pre-pregnancy baselines would settle it and does not appear to
    exist.
  evidence:
  - reference: PMID:34819176
    reference_title: Does pregnancy have an influence on otosclerosis?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to this review, pregnancy seems to have a worsening effect on the course of otosclerosis."
    explanation: The affirmative conclusion, hedged by its own authors.
  - reference: PMID:34819176
    reference_title: Does pregnancy have an influence on otosclerosis?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of wide data heterogeneity and the difficulty in analysing a single factor, absolute statements could not be formulated."
    explanation: >-
      The same review's own statement of why its conclusion should not be taken
      as settled.
  - reference: PMID:16222205
    reference_title: Does pregnancy affect otosclerosis?
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean pure tone air and bone conduction thresholds were not worse in women with children versus those women without children."
    explanation: The controlled negative result.
- discussion_id: vestibular_symptoms_unexplained
  kind: KNOWLEDGE_GAP
  prompt: >-
    What causes vertigo and dysequilibrium in otosclerosis, given that the one
    structural correlate found in temporal bones does not track the symptoms?
  attaches_to:
  - pathophysiology#Vestibular Endorgan Involvement and Cupular Deposit Formation
  - phenotypes#Vertigo
  rationale: >-
    Ten to thirty per cent of patients report vestibular symptoms, and the
    obvious structural explanation fails on its own data. Cupular deposits are
    significantly more common in otosclerotic than in age-matched control
    temporal bones, so otosclerosis does produce them, but deposit burden did
    not correlate with dysequilibrium, with stapes fixation, with prior stapes
    surgery, or with endosteal involvement of the focus. That last null is the
    awkward one: it means the deposits are not simply a downstream consequence
    of the focus reaching the labyrinth, so even the upstream half of the
    mechanism is unclear.

    The alternative proposals, altered perilymph composition or diffusion of
    proteolytic products from an active focus into the vestibular endorgans,
    have the same character as the spiral ligament hyalinization story on the
    cochlear side, where a diffusible mediator from the active lesion is
    inferred from the fact that hyalinization occurs next to active but not
    inactive foci. Nobody has looked for the vestibular counterpart of that
    observation. Note also that surgery is a confounder in the clinical series:
    stapedotomy itself produces measurable caloric asymmetry, so symptoms in
    operated patients cannot be attributed to the disease without care. This
    entry therefore records the deposit node but draws no edge from it to
    vertigo.
  evidence:
  - reference: PMID:17178944
    reference_title: Association between cupular deposits and otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An increase in deposits did not correlate with stapedial fixation, stapes surgery, or endosteal involvement."
    explanation: >-
      The set of nulls that leaves both ends of the proposed mechanism
      unsupported.
  - reference: PMID:19638946
    reference_title: Audiovestibular function in patients with otosclerosis and balance disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the loss of vestibular function symmetry in patients suggested a surgery-induced vestibular trauma."
    explanation: >-
      The surgical confounder: vestibular asymmetry in operated patients is
      attributable to the operation, not to the disease.
  - reference: PMID:19638946
    reference_title: Audiovestibular function in patients with otosclerosis and balance disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no correlation between hearing thresholds and the BCR."
    explanation: >-
      Records that vestibular dysfunction does not track disease severity as
      measured by hearing, which is a further constraint on any proposed
      mechanism.
- discussion_id: no_disease_modifying_therapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is there still no medical therapy that arrests otic capsule remodeling,
    and what would it take to test one properly?
  attaches_to:
  - treatments#Sodium Fluoride
  - treatments#Third-Generation Bisphosphonate Therapy
  - pathophysiology#Focal Osteoclastic Resorption of Otic Capsule Bone
  rationale: >-
    Surgery corrects the mechanical consequence and leaves the disease running,
    so a drug that stopped the remodeling would change the natural history of
    the sensorineural arm in a way stapedotomy cannot. Two candidate classes
    have been tried for decades and neither has been established. Sodium
    fluoride rests on two placebo-controlled trials that disagree, appraised as
    weak evidence from one study with significant limitations. Third-generation
    bisphosphonates have a better mechanistic rationale and stronger animal
    evidence, since risedronate reversed capsular fusion and improved hearing in
    Opg-null mice, but the entire human dataset is ten patients, retrospective
    and uncontrolled.

    Two obstacles explain the stalemate rather than excusing it. The endpoint
    problem: the treatable lesion is the active otospongiotic phase, and CT can
    see active foci but not inactive ones, so trials have no non-invasive way to
    select patients whose disease is currently remodeling or to measure whether
    it stopped. And the timescale problem: sensorineural decline in otosclerosis
    plays out over decades, so a trial powered on hearing thresholds needs
    either very long follow-up or a validated surrogate, and no surrogate for
    focus activity has been validated. Until one exists, this remains a disease
    with a well-understood target and no way to run the trial.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "robust pharmacological or genetic therapies for otosclerosis do not yet exist."
    explanation: The current state of therapy, stated plainly.
  - reference: PMID:11300278
    reference_title: Pathophysiology of otosclerosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Surgical correction of the conductive hearing loss is highly effective, but nonsurgical intervention has not yet been shown to prevent or slow the disease."
    explanation: >-
      The asymmetry the gap is about. Note it was written in 2001, and the
      position has not moved in the intervening two decades.
  - reference: PMID:24048411
    reference_title: Diagnostic value of cone-beam CT in histologically confirmed otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that CBCT has high sensitivity and specificity in the detection of hypodense lesions due to histologically active otosclerosis."
    explanation: >-
      The half of the endpoint problem that is solved, namely that active foci
      are detectable, against the inactive foci the same study reports as
      undetectable, which is the half that is not.
notes: >-
  Scope and lump/split. This is one entry for otosclerosis, curated as a single
  DISEASE. MONDO carries ten numbered otosclerosis terms beside the
  parent concept (MONDO:0008164 otosclerosis 1 through MONDO:0968980
  otosclerosis 12, with 6 and 9 unassigned), and the temptation is to treat them
  as subtypes. They are not clinical entities. Eight of them are linkage
  intervals of ten to thirty megabases mapped in single multiplex families, with
  no gene, no distinguishing phenotype and, in the case of OTSC2, a failed
  replication; the two that do name genes, FOXL1 and SMARCA4, were each found in
  one kindred and are recorded here as causative genes. A patient is
  not diagnosed with OTSC5, and no clinical, mechanistic or therapeutic decision
  follows from which interval a family maps to. The loci are therefore recorded
  as genetic detail in a single consolidated `genetic` record. The stub for this
  disease was dispositioned the same way by the queue's lump review, and this
  entry agrees with it.

  The fenestral and retrofenestral forms were also considered as a subtype axis
  and rejected. Cochlear otosclerosis is classically defined as endosteal
  involvement without stapes fixation, but the temporal bone literature is
  explicit that disease severe enough to reach the endosteum usually fixes the
  stapes as well, so the two are stages of one lesion rather than two diseases.
  They are modelled here as a branch in the pathophysiology chain, which is what
  ICD-10-CM's own H80.0 / H80.1 / H80.2 subdivision by lesion site describes.

  No GeneReviews chapter exists. PubMed searches for `otosclerosis[TI]
  GeneReviews[TI]` and for `otosclerosis GeneReviews[All Fields]` return
  nothing, which is expected for a complex disease with two single-family genes.

  Corrections to the deep-research report. The Perplexity sonar-deep-research
  report for this disease (`research/Otosclerosis-deep-research-perplexity.md`,
  `needs_review: true`) offered five ontology bindings that are wrong, four of
  which its own term-validation section catches. UBERON:0001750 is the lacrimal
  apparatus and not the middle ear; UBERON:0002228 is a rib and not the stapes;
  UBERON:0001738 is thyroid cartilage and not the cochlea; NCIT:C26835 is
  Nervous System Disorder and not otosclerosis; and HP:00003944, offered twice
  for mixed hearing impairment, does not exist. Every CURIE in this entry was
  looked up independently. The correct terms for the first three concepts are
  UBERON:0005411, UBERON:0002496 and UBERON:0001844, and mixed hearing
  impairment is HP:0000410. The report also cites Wikipedia, StatPearls, OMIM
  entry pages, a German ICD code website and a lecture PDF as sources for
  several of its central claims, none of which can be cited here, so the primary
  literature behind those claims was located independently through PubMed. Its
  claim that the disease's HPO representation includes "age-related progressive
  hearing loss (HP:0001730)" mislabels that term, which is simply Progressive
  hearing impairment.

  What this entry does not model. Autoimmunity and HLA association are discussed
  in the report and in several reviews, but the primary evidence is a patchwork
  of small association studies with no replicated target, and the review this
  entry does cite says explicitly that no etiology is established; rather than
  add a node supported only by "has been investigated", it is left out.
  Quality-of-life instruments (SF-36, EQ-5D, Hearing Handicap Inventory) are
  named in the report without otosclerosis-specific results and are not curated.
  No `datasets` block is included: no expression or genomic dataset specific to
  otosclerotic stapes was located that could be verified with `just
  verify-datasets`, and an unverified accession is worse than none.

  Two evidence conflicts are recorded rather than resolved, because both sides
  are real. The frequency of cochlear involvement is given as 10% by one review
  and 20 to 30% by another, and both are cited on the sensorineural and mixed
  hearing loss phenotypes. The measles hypothesis is supported by tissue
  virology and by vaccination epidemiology and contradicted by a contemporary
  British cohort; the contradicting result is kept as a REFUTE evidence item on
  the environmental entry rather than dropped.

  One evidence item is deliberately graded NO_EVIDENCE. Under `progression`, a
  sentence from the osteogenesis imperfecta stapes surgery series states the
  general principle that stapes surgery does not arrest an ongoing sensorineural
  decline. The principle is the one this entry asserts, but the paper is about a
  different disease, so it cannot support the claim for otosclerosis and is
  recorded as bearing on it without supporting it.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: under normal conditions, osteoblast and osteoclast activity of bone turnover is almost entirely absent in the mature otic capsule
    explanation: Establishes the baseline quiescence whose loss defines this node.
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The otic capsule contains regions of immature cartilage called globuli interossei, which may correspond to the earliest loci of otosclerosis.
    explanation: Identifies the candidate cellular substrate where quiescence is first lost.
  downstream:
  - target: Focal Otospongiotic Bone Resorption
    causal_link_type: DIRECT
    description: >-
      Reactivation of osteoclasts within the capsule is the first half of the
      remodeling cycle that produces the otosclerotic focus.
    evidence:
    - reference: PMID:37399313
      reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In otosclerosis, through a poorly understood mechanism, osteoblasts and osteoclasts are activated and initiate abnormal bone remodeling: endochondral bone in the otic capsule is reabsorbed by osteoclasts, followed by deposition of new dense mineralized bone by osteoblasts, ultimately resulting in otosclerotic foci"
      explanation: States the causal order — activation of both lineages, then resorption — that this edge asserts.
- name: Focal Otospongiotic Bone Resorption
  description: >-
    The active phase. Bone is resorbed around vessels and replaced by fibrous
    connective tissue, the perivascular spaces enlarge into vascular channels, and
    the focus becomes hypervascular and hypercellular with osteoclastic giant cells.
    The commonest site is the fissula ante fenestram immediately anterior to the oval
    window. While active the lesion is termed otospongiosis.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

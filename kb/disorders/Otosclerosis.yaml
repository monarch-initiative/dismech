  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologic otosclerosis without clinical symptoms is more frequent, with bony overgrowth observed in as many as 2.5% of temporal bone autopsy specimens"
    explanation: Gives the autopsy-series rate recorded here.
- population: Olmsted County, Minnesota, USA, 2015-2017
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.2
  notes: >-
    Rochester Epidemiology Project, 614 incident cases 1950-2017. The nadir of a
    steep decline from a 1970-74 peak of 18.5 per 100,000 person-years.
  evidence:
  - reference: PMID:32925838
    reference_title: "The Rise and Fall of Otosclerosis: A Population-based Study of Disease Incidence Spanning 70 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence rose from 8.9 per 100,000 person-years in the 1950s to a peak of 18.5 from 1970 to 1974. From this peak, the incidence significantly declined to 6.2 per 100,000 person-years by the early-1990s and reached a nadir of 3.2 from 2015 to 2017"
    explanation: Gives the modern incidence and the trajectory behind it.
progression:
- phase: Onset
  age_range: Second to fifth decade, most often the third
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Symptomatic otosclerosis most frequently occurs in working-age individuals between the second and fifth decades
    explanation: Gives the age band recorded for this phase.
- phase: Progression to bilateral disease
  notes: >-
    Onset is usually unilateral; most patients eventually have both ears involved.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Initial manifestation is often limited to one ear, but eventual bilateral disease is observed in 70–80% of cases
    explanation: Gives the unilateral-to-bilateral course recorded for this phase.
environmental:
- name: Persistent measles virus infection of the otic capsule
  description: >-
    The longest-standing environmental hypothesis. Measles virus RNA has been
    recovered from otosclerotic stapes footplates in many series and the incidence of
    otosclerosis fell steeply in the decades after mass measles vaccination. Other
    series using comparable RT-PCR methods have detected nothing at all. The
    hypothesis is therefore recorded here with both a supporting and a refuting
    primary study rather than as a settled cause.
  effect: Proposed trigger of otic-capsule remodeling; contested
  evidence:
  - reference: PMID:32968571
    reference_title: "Otosclerosis and Measles: Do Measles Have a Role in Otosclerosis? A Review Article."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The majority of the current literature supported the presence of the measles virus component in the otosclerotic stapes samples and its role in the etiopathogenesis of otosclerosis."
    explanation: >-
      A systematic review of 52 relevant articles reporting that most, though not all,
      support the association; graded OTHER because it is a synthesis, not primary data.
  - reference: PMID:32968571
    reference_title: "Otosclerosis and Measles: Do Measles Have a Role in Otosclerosis? A Review Article."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "On the contrary, five observational studies reported no evidence of the association."
    explanation: >-
      The same review counts the studies that found nothing; recorded as a separate
      REFUTE item because one evidence item cannot carry two opposite claims.
  influences_mechanisms:
  - target: Local Proinflammatory Cytokine Expression in the Otosclerotic Focus
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed route: persistent viral antigen in the focus drives local
      proinflammatory cytokine expression and osteoclast activation in a bone that is
      otherwise not remodeled.
    evidence:
    - reference: PMID:24676726
      reference_title: "Expression of TNF-α, OPG, IL-1β and the presence of the measles virus RNA in the stapes of the patients with otosclerosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: The presence of measles virus RNA was noted in 80.3 % of otosclerotic stapes (49 out of 61) and 9.7 % of normal tissues (3 out of 31).
      explanation: >-
        A case-control detection difference in surgically removed stapes versus cadaveric
        controls. It shows association with the diseased tissue, not that the virus
        initiates remodeling, hence INDIRECT.
    - reference: PMID:24676726
      reference_title: "Expression of TNF-α, OPG, IL-1β and the presence of the measles virus RNA in the stapes of the patients with otosclerosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The presence of TNF-α and IL-1β mRNA in the virus-positive stapes could be the result of viral antigen stimulation and may be a marker of inflammation the otosclerotic focus."
      explanation: >-
        States the proposed antigen-to-cytokine step of this link; the source's own hedging
        ("could be", "may be") is why it is graded INDIRECT.
    - reference: PMID:28971731
      reference_title: Absence of Measles Virus Detection from Stapes of Patients with Otosclerosis.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "No sample was positive for any of 3 measles virus genes (H, N, and F). Measles virus RNA was not detected in any sample by real-time RT-PCR."
      explanation: >-
        A 93-patient cross-sectional study using real-time RT-PCR for three measles genes
        that found no virus at all, directly contradicting the detection studies.
  notes: >-
    No `exposure_term:` is bound. ECTO was searched (`runoak -i sqlite:obo:ecto`) for
    measles, virus and viral-exposure terms and returned nothing suitable; the ECTO
    virus-exposure branch does not carry a measles term, and no term beats a wrong
    term.
- name: Fluoride in drinking water
  description: >-
    Clinical otosclerosis has been reported to be commoner in low-fluoride areas,
    and sodium fluoride is proposed to neutralise proteolytic enzymes implicated in
    abnormal otic-capsule bone metabolism. This is the rationale behind fluoride
    supplementation as a medical therapy, which has never been supported by
    adequately designed trials.
  exposure_term:
    preferred_term: exposure to fluoride in drinking water
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  effect: Proposed protective; epidemiological only
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: An epidemiological study on otosclerosis and fluoridated drinking water showed a higher prevalence of clinical otosclerosis in low-fluoride areas.
    explanation: >-
      An ecological prevalence comparison, reported second-hand by the task force; it
      supports an inverse association, not a demonstrated protective effect, hence INDIRECT.
  influences_mechanisms:
  - target: Focal Otospongiotic Bone Resorption
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed mechanism for the inverse association: fluoride inactivates proteolytic
      enzymes that drive abnormal bone metabolism in the otic capsule.
    evidence:
    - reference: PMID:37647735
      reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Sodium fluoride neutralizes proteolytic enzymes that can cause abnormal bone metabolism, such as the Diastrophic Dysplasia Sulfate Transporter
      explanation: >-
        States the proposed biochemical mechanism behind the protective claim; it is a
        mechanistic rationale rather than a measurement in otosclerotic bone, hence INDIRECT.
- name: Pregnancy and endogenous estrogen exposure
  description: >-
    A long-held clinical belief, resting on the roughly 2:1 female predominance and
    on reports of hearing deterioration around pregnancy. A population-based
    case-control study of 299 cases and 897 matched controls found no association
    with parity or with prior bilateral oophorectomy. It is recorded here as a
    refuted risk factor, with no mechanism link asserted.
  effect: No association demonstrated
  evidence:
  - reference: PMID:33107781
    reference_title: "Pregnancy, Estrogen Exposure, and the Development of Otosclerosis: A Case-Control Study of 1196 Women."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "These data do not support a relationship between endogenous estrogen exposure and development of otosclerosis."
    explanation: >-
      The study's own conclusion, from 1196 women, refutes the proposed estrogen risk
      factor.
  - reference: PMID:33107781
    reference_title: "Pregnancy, Estrogen Exposure, and the Development of Otosclerosis: A Case-Control Study of 1196 Women."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The odds ratio for the association of ≥1 delivery with otosclerosis was 1.16 (95% confidence interval [CI] 0.85-1.60; P = .35)."
    explanation: The null point estimate and confidence interval behind that conclusion.
  notes: >-
    No `exposure_term:` bound: this entry records the absence of an effect, and
    binding an ECTO exposure term would imply an asserted exposure-disease
    relationship the evidence refutes.
animal_models:
- name: Smarca4 E1548K knock-in mouse
  species: Mouse
  genotype: Smarca4+/E1548K (CRISPR-Cas9 knock-in of the orthologue of the human SMARCA4 p.E1548K variant)
  publication: PMID:37399313
  description: >-
    The only animal model of otosclerosis. Mice carrying the mouse orthologue of the
    human kindred's SMARCA4 variant are hearing-impaired on acoustic startle and
    auditory brainstem response testing, and micro-CT shows a highly irregular incus
    disrupting the ossicular chain.
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We generated CRISPR-Cas9 transgenic mice carrying the human mutation in the mouse SMARCA4 orthologue.
    explanation: Documents how the model was made and that it carries the orthologue of the human kindred's allele.
  modeled_mechanisms:
  - target: Progressive Conductive Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reproduces conductive-type hearing impairment arising from abnormal
      ossicular bone, from the same allele that causes the human disease.
    limitations: >-
      The murine lesion is an irregular incus interrupting the ossicular chain, not
      otosclerotic fixation of the stapes footplate at the oval window, and the paper
      reports no otic-capsule focus. Otosclerosis is elsewhere described as an
      exclusively human disorder, so this model reproduces the ossicular consequence
      rather than the otic-capsule dystrophy that defines the disease.
    readouts:
    - name: Auditory brainstem response and acoustic startle threshold
      target: Progressive Conductive Hearing Loss
      direction: DECREASED
      interpretation: >-
        Functional hearing loss in the mutant mice, the model's counterpart of the
        audiometric phenotype.
      evidence:
      - reference: PMID:37399313
        reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mutant Smarca4+/E1548K mice exhibited marked hearing impairment demonstrated through acoustic startle response and auditory brainstem response tests."
        explanation: Reports the hearing measurement behind this readout.
    - name: Micro-CT incus morphology and ossicular chain continuity
      target: Progressive Conductive Hearing Loss
      direction: ALTERED
      interpretation: >-
        Structural correlate: abnormal ossicular bone interrupting sound conduction.
      evidence:
      - reference: PMID:37399313
        reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Isolated ossicles of the auditory bullae of mutant mice exhibited a highly irregular structure of the incus bone, and their in situ micro-CT studies demonstrated the anomalous structure of the incus bone, causing disruption in the ossicular chain."
        explanation: Reports the micro-CT morphology behind this readout.
    evidence:
    - reference: PMID:37399313
      reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate that otosclerosis can be caused by a variant in SMARCA4, with a similar phenotype of hearing impairment and abnormal bone formation in the auditory bullae in transgenic mice carrying the human mutation in the mouse SMARCA4 orthologue."
      explanation: >-
        The authors' own claim that the model is informative for the human disease, which
        is what the link asserts.
treatments:
- name: Stapedotomy
  description: >-
    The definitive treatment for fenestral otosclerosis with preserved cochlear
    reserve. A fenestra is made in the fixed footplate and a prosthesis is placed
    between the incus and the vestibule, bypassing the ankylosed stapes. Failure rate
    is around 6% and sensorineural loss is uncommon. Contraindications include an
    only-hearing ear, active Meniere disease, a persistent stapedial artery and
    tympanic membrane perforation.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: stapedotomy with stapes prosthesis placement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: stapes prosthesis
        term:
          id: NCIT:C17598
          label: Prosthesis
  target_phenotypes:
  - preferred_term: Progressive conductive hearing impairment
    term:
      id: HP:0008607
      label: Progressive conductive hearing impairment
  target_mechanisms:
  - target: Stapes Footplate Fixation
    treatment_effect: BYPASSES
    description: >-
      The prosthesis restores sound transmission across a footplate that remains
      fixed; the otosclerotic focus itself is untouched, which is why surgery does not
      arrest the disease.
    evidence:
    - reference: PMID:36653343
      reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: stapedotomy surgery which replaces the fixed stapes bone with a mobile prosthesis
      explanation: States that the operation substitutes for the fixed stapes rather than treating the bone lesion.
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Stapedotomy is currently the most accepted surgical treatment for fenestral otosclerosis with good cochlear reserve.
    explanation: Establishes stapedotomy as the guideline-endorsed first-line surgical option.
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Stapedotomy is usually a safe procedure, with good results, few complications, and a failure rate of approximately 6%.
    explanation: Supports the safety and failure-rate statement in the description.
  notes: >-
    The device is carried as a `qualifiers` predicate-value pair because
    `TreatmentTerm` is rooted at NCIT:C25218 (Clinical Intervention or Procedure) and
    a device term cannot sit in that slot. NCIT has no term for a stapes prosthesis
    specifically, so the generic NCIT:C17598 (Prosthesis) is bound and the specificity
    is carried in `preferred_term`.
- name: Hearing aid amplification
  description: >-
    A well-indicated non-surgical alternative for patients who decline or are unfit
    for stapes surgery, and the recommended option after stapedotomy in severe mixed
    loss with a large residual air-bone gap. The guideline notes a worse cost-benefit
    ratio than surgery.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_phenotypes:
  - preferred_term: Progressive conductive hearing impairment
    term:
      id: HP:0008607
      label: Progressive conductive hearing impairment
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The use of hearing aids is well indicated for the treatment of patients with otosclerosis. However, when compared with stapes surgery, the cost-benefit ratio is worse
    explanation: Task-force recommendation stating both the indication and its cost-benefit caveat.
  notes: >-
    Bound to the rehabilitation action rather than to the device, since NCIT:C183182
    (Hearing Aid) is equipment and is not reachable from NCIT:C25218; the device is
    kept queryable as a qualifier value.
- name: Cochlear implantation
  description: >-
    Reserved for advanced cochlear otosclerosis with profound deafness, on the same
    indications as any other cause of profound loss. Round-window and basal-turn
    ossification is a specific hazard, so MRI is required before implantation, and
    perimodiolar electrodes reduce facial nerve stimulation.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  context: Advanced cochlear otosclerosis with profound sensorineural deafness
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with advanced otosclerosis are at increased risk of ossification of the round window membrane and basal turn, and the surgeon should order MRI as a mandatory test to prevent complications during the insertion of electrode array
    explanation: Supports both the indication in advanced disease and the ossification hazard described here.
  - reference: PMID:28874211
    reference_title: Audiological outcome of stapes surgery for far advanced cochlear otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stapes surgery is a suitable treatment option for patients with advanced otosclerosis, and should be considered mandatory, before offering cochlear implantation, for those with a demonstrable conductive component to their hearing loss."
    explanation: >-
      Constrains when cochlear implantation is the right operation: in advanced disease with
      a residual air-bone gap, stapes surgery comes first, and implantation is for the
      minority who gain little from it.
  notes: >-
    Sequencing matters here. In a series of 28 ears with thresholds above 80 dB — i.e.
    audiometrically implant-eligible — most did well with primary stapes surgery, 7% needed
    revision and only 10% went on to a cochlear implant.
- name: Sodium fluoride
  description: >-
    Used for decades on the rationale that fluoride inactivates proteolytic enzymes
    driving otic-capsule bone turnover. The 2023 task force grades the evidence as
    insufficient: no adequately designed study supports the indication.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium fluoride
      term:
        id: CHEBI:28741
        label: sodium fluoride
  target_mechanisms:
  - target: Focal Otospongiotic Bone Resorption
    treatment_effect: INHIBITS
    description: >-
      Intended to suppress the resorptive phase; the mechanism is a rationale rather
      than a demonstrated effect in otosclerotic bone.
    evidence:
    - reference: PMID:37647735
      reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Fluoride ingestion may influence the prevalence of diseases with abnormal bone resorption.
      explanation: >-
        States the proposed target of the therapy. It is a general statement about bone
        resorption rather than a measured effect on otosclerotic foci, hence INDIRECT.
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Sodium fluoride has been used for decades to treat patients with otosclerosis. However, well-designed studies are lacking to support its indication (Insufficient evidence).
    explanation: >-
      The guideline finds the evidence insufficient, which cuts against the treatment's
      efficacy claim; recorded as REFUTE for that reason, not because harm was shown.
- name: Bisphosphonate therapy
  description: >-
    Tried as an antiresorptive for otospongiotic disease. Control imaging improves but
    clinical benefit is at most slight, and the task force grades the evidence as
    insufficient.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
  target_mechanisms:
  - target: Focal Otospongiotic Bone Resorption
    treatment_effect: INHIBITS
    description: >-
      Antiresorptive suppression of the active otospongiotic phase; radiologic change
      is reported without a matching clinical effect.
    evidence:
    - reference: PMID:37647735
      reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: The use of bisphosphonates has shown radiologic improvement on control scans, but only slight clinical improvement in patients.
      explanation: >-
        Radiologic improvement of the focus is a surrogate for suppressed resorption, so it
        supports the mechanism indirectly while the same sentence limits the clinical claim.
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Higher-quality studies are still lacking to support their indication in patients with otosclerosis (Insufficient evidence).
    explanation: >-
      The guideline declines to endorse bisphosphonates, cutting against a clinical
      efficacy claim.
diagnosis:
- name: Pure-tone audiometry with Carhart notch and absent acoustic reflexes
  description: >-
    The diagnostic core: a conductive or mixed loss with an air-bone gap, a Carhart
    notch (an artefactual bone-conduction dip around 2 kHz produced by the fixed
    ossicular chain), absent stapedial reflexes and a type A or As tympanogram. In a
    typical case this constellation makes imaging largely unnecessary.
  evidence:
  - reference: PMID:33107781
    reference_title: "Pregnancy, Estrogen Exposure, and the Development of Otosclerosis: A Case-Control Study of 1196 Women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical and audiologic assessments included the presence of a Carhart notch, absent acoustic reflexes, and a type A or As tympanogram."
    explanation: >-
      These are the criteria actually used to ascertain otosclerosis cases in a
      population-based study, so they document diagnostic practice rather than merely
      recommending it.
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: family history of otosclerosis, and successful stapes surgery in one of the ears gain little benefit from imaging
    explanation: Supports the statement that imaging adds little in a typical audiometrically classic case.
- name: High-resolution temporal bone CT
  description: >-
    Indicated before stapes surgery and when the presentation is atypical — mixed or
    sensorineural loss, fluctuating hearing, prior ear surgery or trauma, vestibular
    complaints, or a child with mixed loss (to exclude X-linked mixed deafness).
  diagnosis_term:
    preferred_term: high-resolution temporal bone computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mastoid HRCT is the imaging modality of choice for patients with a clinical indication for stapes surgery
    explanation: Establishes CT as the preoperative imaging modality of choice.
differential_diagnoses:
- name: Superior semicircular canal dehiscence
  description: >-
    A third-window lesion that produces an air-bone gap with an intact tympanic
    membrane and can be mistaken for otosclerosis. It is also an explicit
    contraindication to stapedotomy, so distinguishing it changes management.
  distinguishing_features:
  - Supranormal bone conduction thresholds and abnormal VEMP responses despite the air-bone gap.
  - Sound- and pressure-evoked vestibular symptoms, with dehiscence visible on CT.
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ménière’s disease or superior semicircular canal dehiscence are contraindications to stapedotomy (Insufficient evidence)."
    explanation: Establishes why this differential must be resolved before surgery.
- name: Meniere disease
  description: >-
    Overlaps otosclerosis in vestibular symptoms and fluctuating hearing, and is a
    relative contraindication to stapedotomy. Endolymphatic hydrops is itself seen in
    some patients with otosclerosis involving the spiral ligament, which blurs the
    boundary.
  distinguishing_features:
  - Episodic vertigo with fluctuating low-frequency sensorineural loss and aural fullness, rather than a stable air-bone gap.
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vestibular complaints should be investigated during clinical evaluation, as misdiagnosis can have significant implications on treatment outcomes, especially in patients with Ménière’s disease, an enlarged vestibular aqueduct, or superior semicircular canal dehiscence."
    explanation: Names the differentials that matter and says why getting them wrong changes outcomes.
notes: >-
  Lump/split: curated as a single Disease per the stub queue's lump review
  (stubs/Otosclerosis.yaml, entry_type DISEASE). The seeded stubs for otosclerosis 11
  (FOXL1) and otosclerosis 12 were folded into this entry. The numbered OTSC loci are
  mapped linkage intervals of one disease, not distinct clinical entities, and are
  recorded under `genetic:` rather than as `has_subtypes`. Histologic, clinical and
  cochlear otosclerosis are stages and distributions of the same lesion, so they are
  likewise handled as prevalence populations, phenotypes and progression rather than
  as subtypes.

  Module conformance was considered and declined for
  kb/modules/osteoporosis_bone_resorption.yaml. That module scopes itself to the
  osteoporoses and its chain terminates in net bone loss and skeletal fragility;
  otosclerosis is focal, confined to a bone that is normally not remodeled at all, and
  its endpoint is net sclerosis. The RANKL/osteoprotegerin step is a parallel use of
  the same axis rather than a conforming instance. The reasoning is repeated on the
  "Reduced Osteoprotegerin Restraint of Osteoclastogenesis" node so it is visible where
  the decision would be made.

  No `datasets:` block. `just discover-datasets Otosclerosis` returned no DIRECT
  candidate — every hit was GENE_ONLY, reached through SMARCA4, TGFB1 or RELN, and
  belonged to lung cancer, AML or macular degeneration studies. Those accessions
  resolve perfectly and are about other diseases, which is the Named Entity Confusion
  failure the dataset guidance warns about, so none was curated.

  Deep research: `just research-disorder perplexity Otosclerosis` failed three times
  with "Server disconnected without sending a response" on the default
  `sonar-deep-research` model, and `--fallback` did not engage because a runtime API
  error is not treated as a provider being unable to take work. The committed report
  is a Perplexity run on `sonar-reasoning-pro`. Its citations resolved 12/12, but 5 of
  7 quotes were near-miss paraphrases and 13 of 27 ontology labels named a different
  term (HP:0005117 offered as "Conductive hearing impairment" is in fact Elevated
  diastolic blood pressure), so no CURIE was taken from it — every binding here was
  selected independently with OAK.
stages:
- name: Histologic otosclerosis
  description: >-
    An otic-capsule focus that has not reached a site where it fixes the stapes or
    the round window, and so causes no symptoms. It is found only by sectioning
    temporal bones at autopsy, in roughly an order of magnitude more people than have
    clinical disease. Only some 12-15% of temporal bones with histologic otosclerosis
    show stapedial fixation.
  evidence:
  - reference: PMID:11568664
    reference_title: Prevalence of otosclerosis in an unselected series of temporal bones.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologic otosclerosis is a disease process without clinical symptoms or manifestations that can be discovered only by sectioning of the temporal bone at autopsy."
    explanation: Defines this stage and how it is ascertained.
  - reference: PMID:11568664
    reference_title: Prevalence of otosclerosis in an unselected series of temporal bones.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some 12% to 15% of temporal bones with histologic otosclerosis have demonstrated stapedial fixation."
    explanation: Quantifies the fraction of histologic foci that progress to the clinical stage.
- name: Clinical otosclerosis
  description: >-
    A focus sited so that it interferes with stapes motion or the round window
    membrane, producing conductive hearing loss with tinnitus and sometimes vestibular
    symptoms. This is the stage at which patients present.
  evidence:
  - reference: PMID:11568664
    reference_title: Prevalence of otosclerosis in an unselected series of temporal bones.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical otosclerosis is otosclerosis at a site where it causes conductive hearing loss by interfering with the motion of the stapes or of the round window membrane."
    explanation: Defines this stage by lesion site rather than by lesion size.
- name: Cochlear (far-advanced) otosclerosis
  description: >-
    Extensive otic-capsule involvement reaching the cochlear endosteum. Sensorineural
    loss is added or predominates, thresholds may reach implant-eligible levels, and
    round-window or basal-turn ossification can complicate cochlear implantation.
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cochlear otosclerosis refers to invasion of the cochlear endosteum with extensive involvement of the otic capsule, without stapes fixation, leading to NSHL, tinnitus, and vestibular symptoms."
    explanation: Defines this stage as the task force does.


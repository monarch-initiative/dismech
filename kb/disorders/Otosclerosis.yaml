clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Untreated otosclerosis causes progressive, usually bilateral hearing loss that
    begins in working life, but it is not life-limiting and the conductive component
    is correctable by stapes surgery or amplification in the great majority of
    patients.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Symptomatic otosclerosis most frequently occurs in working-age individuals between the second and fifth decades
    explanation: Establishes onset in working life, which is what makes the hearing loss burdensome.
pathophysiology:
- name: Reduced Osteoprotegerin Restraint of Osteoclastogenesis
  description: >-
    In health the otic capsule is protected from remodeling by osteoprotegerin,
    secreted in large amounts by the spiral ligament, which acts as a decoy receptor
    for RANKL and suppresses osteoclast recruitment and activation. Osteoprotegerin
    transcript is significantly reduced in otosclerotic stapes footplates relative to
    normal stapes, releasing that restraint.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: negative regulation of osteoclast differentiation
    term:
      id: GO:0045671
      label: negative regulation of osteoclast differentiation
    modifier: DECREASED
  genes:
  - preferred_term: TNFRSF11B
    description: Encodes osteoprotegerin (OPG).
    term:
      id: hgnc:11909
      label: TNFRSF11B
  locations:
  - preferred_term: bony otic capsule
    term:
      id: UBERON:0005411
      label: bony otic capsule
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This is explained by the presence of OPG, a mediator produced in large quantities by the spiral ligament that inhibits the recruitment, formation, and activation of osteoclasts.
    explanation: States the osteoprotegerin mechanism that normally holds otic-capsule remodeling in check.
  - reference: PMID:24676726
    reference_title: "Expression of TNF-α, OPG, IL-1β and the presence of the measles virus RNA in the stapes of the patients with otosclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The OPG expression level was significantly lower in otosclerotic tissues comparing to controls.
    explanation: Measures the loss of that restraint directly in otosclerotic stapes versus cadaveric control stapes.
  downstream:
  - target: Loss of Otic Capsule Remodeling Quiescence
    causal_link_type: DIRECT
    description: >-
      Withdrawal of osteoprotegerin's decoy-receptor restraint permits RANKL-driven
      osteoclast recruitment in a bone that is otherwise not remodeled.
    evidence:
    - reference: PMID:37647735
      reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Therefore, low levels of OPG may be related to pathological new bone formation and resorption.
      explanation: The cited task force draws exactly this causal step from low osteoprotegerin to pathological remodeling.
  notes: >-
    Deliberately not declared conformant to
    osteoporosis_bone_resorption#RANKL-Driven Osteoclastogenesis. That module scopes
    itself to the osteoporoses and its chain terminates in net bone loss and skeletal
    fragility; otosclerosis is focal, confined to one bone that is normally not
    remodeled at all, and ends in net sclerosis rather than fragility. The
    RANKL/osteoprotegerin step is a parallel use of the same axis, not a conforming
    instance of that module's chain.

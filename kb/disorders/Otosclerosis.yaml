name: Otosclerosis
creation_date: '2026-09-09T00:00:00Z'
category: Complex
description: >-
  Otosclerosis is a bone dystrophy confined to the otic capsule — the endochondral
  bone shell of the inner ear, which in health is one of the least remodeled bones
  in the body. In otosclerosis that quiescence is lost focally: osteoclasts resorb
  endochondral bone at discrete foci, most often at the fissula ante fenestram just
  anterior to the oval window, and osteoblasts then replace the resorbed bone with
  disorganized, poorly organized new bone. The active, hypervascular resorptive
  phase is called otospongiosis; the inactive, densely mineralized end state is
  otosclerosis proper, and both appear in the same temporal bone.

  The lesion causes disease by where it sits rather than by how much bone it
  destroys. A focus that reaches the annular ligament ankyloses the stapes
  footplate in the oval window, and sound can no longer be transmitted through the
  ossicular chain — progressive conductive hearing loss, typically beginning in the
  third decade and bilateral in most patients. Medial extension to the cochlear
  endosteum adds a sensorineural component, giving mixed hearing loss.

  Two features frame the etiology. Around half of patients have an affected
  relative, and the familial pattern is autosomal dominant with reduced penetrance,
  but two decades of linkage mapping produced ten OTSC intervals and almost no
  genes; a 2023 three-biobank GWAS instead found 27 common risk loci and confirmed
  a polygenic architecture, with the nearest genes clustering on bone remodeling,
  mineralization and TGF-beta signalling. And the disease is disappearing: US
  population incidence fell from 18.5 per 100,000 person-years in the early 1970s
  to 3.2 by 2015-2017, a decline widely — but not conclusively — attributed to
  measles vaccination, since measles virus RNA has been recovered from otosclerotic
  stapes in some series and not at all in others.

name: Otosclerosis
creation_date: "2026-09-09T13:20:42Z"
category: Complex
synonyms:
- otospongiosis
- stapedial otosclerosis
- fenestral otosclerosis
- cochlear otosclerosis
- retrofenestral otosclerosis
description: >-
  Otosclerosis is a focal disorder of bone remodeling confined to the otic
  capsule, the dense endochondral bone that encases the inner ear. That bone is
  normally the most remodeling-inert in the body, turning over at roughly a
  hundredth of the rate of the surrounding skull, and the disease is best
  understood as a local escape from whatever holds that suppression in place.
  A focus of osteoclastic resorption opens in previously stable capsular bone,
  most often at the fissula ante fenestram immediately anterior to the oval
  window, producing the hypervascular otospongiotic lesion that is occasionally
  visible through the eardrum as the Schwartze sign. A reparative phase follows,
  laying down irregular sclerotic bone that expands across the stapediovestibular
  joint and fixes the stapes footplate. The mechanical consequence is a
  conductive hearing loss with the audiometric signature of stapes fixation: an
  air-bone gap, absent stapedial reflexes, a normal eardrum, and a dip in bone
  conduction at 2 kHz known as the Carhart notch. In a minority of patients the
  process extends retrofenestrally to the cochlear endosteum, where spiral
  ligament hyalinization and stria vascularis atrophy add a sensorineural
  component and convert the loss to a mixed one; tinnitus is common and
  vestibular symptoms occur in a minority.

  The disease is complex rather than Mendelian. Half or more of patients have an
  affected relative and pedigrees are usually read as autosomal dominant with
  penetrance near 40%, but ten linkage loci mapped between 1998 and 2011 yielded
  no gene, and only two genes, FOXL1 and SMARCA4, have been shown to cause
  otosclerosis in single families. Population-scale association work has been
  more productive, implicating RELN, TGFB1, MEPE and a further two dozen loci
  whose nearest genes govern bone remodeling and mineralization. Persistent
  measles virus infection of the otosclerotic focus is the most-studied
  environmental contributor, supported by viral RNA in stapes footplates and by
  a fall in surgical incidence after national vaccination programmes, and
  disputed by at least one contemporary cohort that found no such association.

  Otosclerosis occurs in no other species, so there is no natural animal model.
  Surgical replacement of the fixed stapes closes the air-bone gap in more than
  nine of ten operated ears and remains the definitive treatment; no medical
  therapy has been shown to arrest the underlying remodeling.

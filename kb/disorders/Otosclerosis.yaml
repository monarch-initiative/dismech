  category: Auditory
  description: >-
    Where the focus reaches the cochlear endosteum a sensorineural component is added
    to the persisting conductive one.
  phenotype_term:
    preferred_term: Mixed hearing impairment
    term:
      id: HP:0000410
      label: Mixed hearing impairment
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: in up to 10% of cases otosclerotic foci involve the cochlear endosteum that may also manifest as sensorineural or mixed hearing loss
    explanation: Names mixed hearing loss as a manifestation of endosteal involvement.
- name: Sensorineural Hearing Loss
  category: Auditory
  description: >-
    Cochlear otosclerosis — extensive otic-capsule involvement without stapes
    fixation — presents as sensorineural loss. A profound deficit across all
    frequencies is rare but is the indication for cochlear implantation.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:34633540
    reference_title: A pathogenic deletion in Forkhead Box L1 (FOXL1) identifies the first otosclerosis (OTSC) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients typically present with conductive HL which often progresses to mixed loss (cochlear otosclerosis); purely sensorineural hearing loss (SNHL) is rare.
    explanation: Establishes both that pure sensorineural loss occurs and that it is the uncommon presentation.
- name: Tinnitus
  category: Auditory
  description: Ringing or buzzing accompanying the hearing loss.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Tinnitus is a highly prevalent symptom.
    explanation: >-
      Supports both the phenotype and the FREQUENT band; the source gives a qualitative
      "highly prevalent" rather than a percentage, which maps to FREQUENT.
- name: Vestibular Symptoms
  category: Vestibular
  description: >-
    Dizziness, vertigo and imbalance, reported in a substantial minority. They matter
    clinically because they overlap with Meniere disease, enlarged vestibular
    aqueduct and superior semicircular canal dehiscence, all of which change surgical
    management. Reported in up to 40% of patients; `frequency:` is left unset because
    "up to 40%" bounds the estimate rather than giving a band.
  phenotype_term:
    preferred_term: Vestibular symptoms
    term:
      id: HP:0001751
      label: Abnormal vestibular function
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Vestibular symptoms have been reported in up to 40% of patients with otosclerosis.
    explanation: Supports the phenotype and the upper bound quoted in the description.
- name: Paracusis of Willis
  category: Auditory
  description: >-
    Improved speech clarity in noisy surroundings, a classical if inconstant symptom
    of conductive loss. There is no HPO term for it, so the descriptor carries the
    eponym as free text.
  phenotype_term:
    preferred_term: Paracusis of Willis
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients may describe improved hearing clarity in noisy environments.
    explanation: Describes the symptom this phenotype records.
- name: Schwartze Sign
  category: Otoscopic
  description: >-
    Reddish hue over the cochlear promontory seen through an otherwise normal
    tympanic membrane, produced by the hypervascular active focus. It is inconstant
    and its absence does not exclude the diagnosis.
  phenotype_term:
    preferred_term: Schwartze sign (promontory hyperemia)
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This sign is inconsistently found in patients with otosclerosis and is not necessary for diagnosis.
    explanation: Supports the caveat that makes this an unreliable but real sign.
histopathology:
- name: Otospongiotic (Active) Focus with Vascular Proliferation
  description: >-
    Enlarged perivascular spaces, bone resorbed around vessels and replaced by
    fibrous tissue, osteoclastic giant cells and vascular proliferation. Osteoblast
    and osteoclast precursors, histiocytes and macrophages are seen on electron
    microscopy.
  finding_term:
    preferred_term: vascular proliferation within the otosclerotic focus
    term:
      id: NCIT:C35504
      label: Vascular Proliferation
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These areas of active disease are characterized by the presence of osteoclastic giant cells and vascular proliferation.
    explanation: States the two defining histologic features of the active focus.
- name: Sclerotic (Inactive) Focus of Dense Mineralized Bone
  description: >-
    The burnt-out end state of the lesion: dense mineralized bone replacing the
    resorbed otic-capsule bone.
  finding_term:
    preferred_term: dense sclerotic otosclerotic bone
    term:
      id: NCIT:C69309
      label: Sclerosis
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The otosclerosis focus may appear as dense mineralized bone (sclerosis) or active, well-vascularized bone (spongiotic).
    explanation: Names both the sclerotic and spongiotic appearances of the focus.
- name: Blue Mantles
  description: >-
    Basophilic (bluish on H&E) zones of recently remodeled bone bordering the focus,
    among the earliest histologic manifestations. No NCIT or HP term names this
    finding, so the descriptor is free text.
  finding_term:
    preferred_term: blue mantles (basophilic recently remodeled bone)
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: One of the first histologic manifestations of otosclerosis is known as blue mantles, which are basophilic staining regions visualized after application of Hematoxylin and Eosin (H&E).
    explanation: Defines the finding and marks it as an early manifestation.
imaging_findings:
- name: Fissula Ante Fenestram Radiolucency on Temporal Bone CT
  modality: CT
  description: >-
    A hypodense (radiolucent) focus at the fissula ante fenestram, or pericochlear
    lucency in more extensive disease. High-resolution CT of the mastoid is the
    imaging modality of choice when stapes surgery is planned.
  located_in:
    preferred_term: bony otic capsule
    term:
      id: UBERON:0005411
      label: bony otic capsule
  spatial_extent: FOCAL
  evidence:
  - reference: PMID:33107781
    reference_title: "Pregnancy, Estrogen Exposure, and the Development of Otosclerosis: A Case-Control Study of 1196 Women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Imaging criteria included radiolucency in the otic capsule at the fissula ante fenestram or surrounding the otic capsule.
    explanation: States the imaging criterion, here used as a diagnostic criterion in a population-based case ascertainment.
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mastoid HRCT is the imaging modality of choice for patients with a clinical indication for stapes surgery
    explanation: Supports the modality assignment.
inheritance:
- name: Autosomal dominant with reduced penetrance (familial otosclerosis)
  description: >-
    Around half to sixty per cent of patients have an affected relative, and in most
    such families transmission fits autosomal dominance with incomplete penetrance.
    The FOXL1 and SMARCA4 kindreds are the two families in which a segregating
    dominant variant has actually been identified.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In most families, the inheritance pattern is autosomal dominant with incomplete penetrance.
    explanation: States both the mode and the reduced penetrance recorded here.
- name: Polygenic susceptibility (non-familial otosclerosis)
  description: >-
    Sporadic disease behaves as a complex trait. A three-biobank GWAS meta-analysis
    of 3,504 cases and 861,198 controls found 27 genome-wide-significant loci and
    SNP-based heritability estimates of 0.15-0.27, confirming a polygenic
    architecture rather than a few high-impact genes.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We confirm a polygenic basis to otosclerosis.
    explanation: The GWAS authors state the polygenic conclusion this record encodes.
genetic:
- name: OTSC linkage loci (OTSC1-OTSC10)
  association: >-
    Two decades of linkage mapping in multiplex families defined ten autosomal
    dominant OTSC intervals (OTSC1 15q25-qter, OTSC2 7q34-q36, OTSC3 6p22.3-p21.3,
    OTSC4 16q22.1-q23.1, OTSC5 3q22-q24, OTSC7 6q13-q16.1, OTSC8 9p13.1-q21.11,
    OTSC10 1q41-q44; OTSC6 and OTSC9 unpublished). The intervals are large — 10 to
    34 Mb — and, apart from FOXL1 mapping into the 16q24.1 region, none has yielded
    a causal gene. These loci are recorded here as genetic detail of one disease, not
    as clinical subtypes.
  relationship_type: UNKNOWN
  evidence:
  - reference: PMID:34633540
    reference_title: A pathogenic deletion in Forkhead Box L1 (FOXL1) identifies the first otosclerosis (OTSC) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: multiplex families have been used to map ten autosomal dominant (OTSC) loci to large genomic intervals
    explanation: Establishes the number and nature of the OTSC intervals recorded here.
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, efforts to identify causative genes have produced inconsistent results, with insufficient evidence for most candidate genes
    explanation: Supports the statement that the intervals have largely not yielded causal genes.
- name: FOXL1
  association: >-
    A 15 bp coding deletion (rs764026385) in the C-terminus of FOXL1 co-segregates
    with autosomal dominant otosclerosis in a large Newfoundland family of English
    extraction and was found in a second unrelated case on a shared haplotype. The
    mutant protein is transcribed, translated and correctly nuclear, but loses its
    C-terminal alpha helix and all transcriptional activity, implying that wild-type
    FOXL1 normally restrains otic-capsule bone remodeling.
  gene_term:
    preferred_term: FOXL1
    term:
      id: hgnc:3817
      label: FOXL1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:34633540
    reference_title: A pathogenic deletion in Forkhead Box L1 (FOXL1) identifies the first otosclerosis (OTSC) gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we map a new OTSC locus to a 9.96 Mb region within the FOX gene cluster on 16q24.1 and identify a 15 bp coding deletion in Forkhead Box L1 co-segregating with otosclerosis in a Caucasian family
    explanation: Reports the co-segregating variant that makes this a causative gene claim.
  - reference: PMID:34633540
    reference_title: A pathogenic deletion in Forkhead Box L1 (FOXL1) identifies the first otosclerosis (OTSC) gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, the deletion of 5 residues in the C-terminus of mutant FOXL1 causes a complete loss of transcriptional activity due to loss of secondary (alpha helix) structure.
    explanation: >-
      The functional consequence was measured in reporter assays rather than in patients,
      so it is graded IN_VITRO separately from the segregation evidence above.
- name: SMARCA4
  association: >-
    Whole-exome sequencing plus linkage in a kindred with seven affected individuals
    identified a disease-causing SMARCA4 variant (p.E1548K), encoding a component of
    the PBAF chromatin-remodeling complex. Knock-in mice carrying the orthologous
    change are the only animal model that reproduces an otosclerosis-like phenotype.
  gene_term:
    preferred_term: SMARCA4
    term:
      id: hgnc:11100
      label: SMARCA4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:37399313
    reference_title: SMARCA4 mutation causes human otosclerosis and a similar phenotype in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through genetic studies of kindred with seven individuals affected by apparent autosomal dominant otosclerosis, we identified a disease-causing variant in SMARCA4, encoding a key component of the PBAF chromatin remodelling complex."
    explanation: Reports the human genetic finding behind this CAUSATIVE assignment.
- name: MEPE
  association: >-
    MEPE encodes matrix extracellular phosphoglycoprotein, an osteocyte product with
    roles in both mineralization and osteoclast regulation. A rare frameshift variant
    (rs753138805), enriched in Finns, carries by far the largest effect of any
    otosclerosis allele reported to date and fine-maps as the most likely causal
    variant at its locus. MEPE protein is present in maturing and adult mouse otic
    capsule osteocytes.
  gene_term:
    preferred_term: MEPE
    term:
      id: hgnc:13361
      label: MEPE
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the chromosome 4 locus near the MEPE gene, the rare frameshift variant rs753138805 (EAF 0.3% in controls and 1.3% in cases) was the lead variant in the GWAS in FinnGen with an odds ratio of 21.5 (95% CI 9.6-48.4)"
    explanation: Gives the specific variant and effect size behind this susceptibility claim.
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our localization of MEPE protein within the maturing and adult otic capsule validates our GWAS finding."
    explanation: >-
      The expression validation was done by immunostaining mouse cochleae, so it is graded
      MODEL_ORGANISM separately from the human association above.
  notes: >-
    The frameshift is not otosclerosis-specific — the same variant also raises leg
    fracture risk, which the authors read as a systemic skeletal effect.
- name: TGFB1
  association: >-
    The most consistently replicated common susceptibility gene. An intronic variant
    (rs8105161) reached genome-wide significance in the three-biobank meta-analysis,
    and a British case-control study independently associated the coding variant
    rs1800472, most strongly among non-familial cases.
  gene_term:
    preferred_term: TGFB1
    term:
      id: hgnc:11766
      label: TGFB1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the only genome-wide significant association observed for the intronic TGFB1 variant rs8105161"
    explanation: Gives the genome-wide-significant TGFB1 association.
  - reference: PMID:29728750
    reference_title: Evidence of distinct RELN and TGFB1 genetic associations in familial and non-familial otosclerosis in a British population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence of an association between rs1800472 in TGFB1 and otosclerosis was found (p = 0.034), this association was strongest amongst non-familial cases (p = 0.011)."
    explanation: Independent replication in a different cohort, and locates the effect in non-familial disease.
- name: RELN
  association: >-
    Reelin was the first otosclerosis GWAS hit and remains associated in the largest
    meta-analysis, but replication has been erratic and a British study found the
    signal only in familial cases. Reelin has no known role in bone biology, which
    the field has repeatedly noted as a puzzle rather than a mechanism.
  gene_term:
    preferred_term: RELN
    term:
      id: hgnc:9957
      label: RELN
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the locus on chromosome 7, the strongest association was observed for variants in the second and third introns of RELN concordant with previous GWAS"
    explanation: Confirms the RELN association in the largest available meta-analysis.
  - reference: PMID:29728750
    reference_title: Evidence of distinct RELN and TGFB1 genetic associations in familial and non-familial otosclerosis in a British population.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a significant association (p = 0.0057) was detected between one RELN SNP (rs39399) and otosclerosis in familial patients."
    explanation: >-
      Supports a RELN association only in the familial stratum; the same study found none in
      the whole cohort, so it bears on the claim through a subgroup analysis.
  notes: >-
    The mechanistic gap is explicit in the literature: reelin's known function is
    neuronal migration, and no link to the bone dysregulation of otosclerosis has been
    demonstrated.
- name: CD109
  association: >-
    A GWAS lead variant in an intron of CD109 falls inside the previously mapped
    OTSC7 linkage region on 6q13-16.1, which is the only OTSC interval so far
    corroborated by association data. CD109 is a TGF-beta co-receptor and negative
    regulator, placing it on the same pathway as TGFB1.
  gene_term:
    preferred_term: CD109
    term:
      id: hgnc:21685
      label: CD109
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One locus (denoted by the lead variant rs4464751 in an intron of CD109) is a previously identified linkage locus (OTSC7, 6q13–16.1)"
    explanation: Establishes both the association and its coincidence with the OTSC7 interval.
- name: SERPINF1
  association: >-
    Contested. Whole-exome sequencing of familial cases reported six rare
    heterozygous SERPINF1 variants and reduced expression of the stapes-predominant
    SERPINF1-012 transcript, naming it the first otosclerosis gene. A subsequent
    resequencing study of 1,604 patients, 1,538 controls and 62 families found no
    enrichment, and specifically found the reported pathogenic p.Ala131Asp allele in
    more controls than patients. The evidence items below are deliberately kept as a
    SUPPORT/REFUTE pair rather than resolved.
  gene_term:
    preferred_term: SERPINF1
    term:
      id: hgnc:8824
      label: SERPINF1
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:27056980
    reference_title: Mutations and altered expression of SERPINF1 in patients with familial otosclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Six rare heterozygous SERPINF1 variants were found in seven patients in our familial otosclerosis cohort; three are missense mutations predicted to be deleterious to protein function.
    explanation: The original discovery finding that made SERPINF1 a candidate causal gene.
  - reference: PMID:30968248
    reference_title: Insufficient evidence for a role of SERPINF1 in otosclerosis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study showed no enrichment of rare variants, stratified by type, in SERPINF1 in patients versus controls."
    explanation: A much larger resequencing study found no case-control enrichment, contradicting the discovery claim.
  - reference: PMID:30968248
    reference_title: Insufficient evidence for a role of SERPINF1 in otosclerosis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the c.392C > A (p.Ala131Asp) variant, previously reported as pathogenic, was identified in three patients and four controls, not replicating its pathogenic nature"
    explanation: Directly refutes the pathogenicity of the specific allele reported by the discovery study.
- name: COL1A1
  association: >-
    Type I collagen was the first candidate gene proposed, on the strength of its
    role in bone metabolism and its links to osteogenesis imperfecta and
    osteoporosis. Targeted replication in a British cohort found no association.
  gene_term:
    preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:29728750
    reference_title: Evidence of distinct RELN and TGFB1 genetic associations in familial and non-familial otosclerosis in a British population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No evidence of an association was detected with variants in COL1A1, FGF2, BMP2, and PPP2R5B."
    explanation: A powered replication attempt that failed to confirm the COL1A1 association.
- name: TNFRSF11B
  association: >-
    Candidate by function rather than by association: TNFRSF11B encodes
    osteoprotegerin, whose transcript is reduced in otosclerotic stapes, and
    homozygous TNFRSF11B variants cause juvenile Paget disease, which can itself
    cause hearing loss. No variant association with otosclerosis has been
    established.
  gene_term:
    preferred_term: TNFRSF11B
    term:
      id: hgnc:11909
      label: TNFRSF11B
  relationship_type: UNKNOWN
  evidence:
  - reference: PMID:37647735
    reference_title: "Brazilian Society of Otology task force - Otosclerosis: evaluation and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous mutations in TNFRSF11B play a role in Paget’s disease, which may also lead to hearing loss"
    explanation: >-
      Supports candidate status only. The quoted sentence establishes a functional
      rationale by analogy with juvenile Paget disease, not an otosclerosis variant
      association, which is why relationship_type is UNKNOWN rather than SUSCEPTIBILITY.

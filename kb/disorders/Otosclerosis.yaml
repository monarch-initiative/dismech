  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 340.0
  rate_low: 300.0
  rate_high: 380.0
  notes: Clinical (symptomatic) otosclerosis, 0.30-0.38%.
  evidence:
  - reference: PMID:36653343
    reference_title: "Genome-wide screen of otosclerosis in population biobanks: 27 loci and shared associations with skeletal structure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical otosclerosis has an estimated prevalence of 0.30–0.38% in populations of European descent
    explanation: Gives the population, measure and rate recorded here.
- population: Temporal bone autopsy specimens
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2500.0
  notes: >-
    Histologic otosclerosis — otic-capsule bony overgrowth without clinical

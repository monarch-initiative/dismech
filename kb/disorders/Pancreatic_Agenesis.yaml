- name: PAGEN3
  display_name: Pancreatic Agenesis 3 (ZNF808-Related)
  classification: molecular
  subtype_term:
    preferred_term: pancreatic agenesis 3
    term:
      id: MONDO:0975839
      label: pancreatic agenesis 3
  description: >-
    Pancreatic agenesis from biallelic loss of ZNF808, a KRAB zinc finger
    protein that silences primate-specific transposable elements during early
    pancreas development. MONDO cross-references this class to OMIM:620991. The
    gene has no rodent counterpart, so the mechanism was established in human
    stem-cell-derived pancreatic differentiation rather than in a knockout
    mouse, and the reported phenotype is confined to the pancreas.
  genes:
  - preferred_term: ZNF808
    term:
      id: hgnc:33230
      label: ZNF808
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Affected individuals are homozygous for ZNF808 loss-of-function alleles,
      and the variants cosegregate with disease as a recessive trait.
    evidence:
    - reference: PMID:37973953
      reference_title: >-
        Primate-specific ZNF808 is essential for pancreatic development in
        humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All families showed cosegregation of the ZNF808 homozygous variants with
        the disease consistent with recessive inheritance
      explanation: >-
        Cosegregation of homozygous variants across all reported families is the
        direct statement of recessive inheritance for this subtype.
  evidence:
  - reference: PMID:37973953
    reference_title: >-
      Primate-specific ZNF808 is essential for pancreatic development in
      humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the identification of homozygous loss-of-function variants
      in the primate-specific gene ZNF808 as a cause of pancreatic agenesis.
    explanation: >-
      The discovery report names ZNF808 biallelic loss of function as a cause of
      pancreatic agenesis, which is what this subtype row asserts.
definitions:
- name: Pancreas agenesis clinical definition
  definition_type: OTHER
  description: >-
    A rare condition underlying a variant of permanent neonatal diabetes in
    which complete pancreatic agenesis restricts fetal growth and causes
    neonatal endocrine and exocrine pancreatic failure.
  evidence:
  - reference: PMID:38180040
    reference_title: "Pancreas agenesis and fetal growth: a semi-quantitative analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pancreas agenesis is a rare condition underlying a variant of permanent
      neonatal diabetes mellitus.
    explanation: >-
      The 2024 semiquantitative analysis gives a concise disease definition
      and links pancreas agenesis to permanent neonatal diabetes.

notes: >-
  Falcon research highlighted that complete pancreatic agenesis should be kept
  distinct from isolated dorsal pancreatic agenesis, which may present later and
  has different developmental scope.


  MONDO:0009832, the class bound as this entry's disease_term, carries
  "pancreatic agenesis type 1" as an exact synonym and "pancreatic agenesis 1"
  and "PAGEN1" as related synonyms, while MONDO:0024547 is the class labelled
  "pancreatic agenesis 1" and is bound on the PAGEN1 subtype row of this entry.
  A name-based lookup of either string therefore resolves to the umbrella rather
  than to the PDX1 subtype.


  Two sources could not be consulted. There is no
  references_cache/ORPHA_2805.md file for the Orphanet record MONDO:0009832
  cross-references, and populating one needs a maintainer bulk refresh of
  Orphadata. ClinGen carries no gene-disease validity row for GATA6, PDX1,
  PTF1A or ZNF808 in any of the 664 committed CGGV cache files.

      rapidly evolving group of epigenetic silencers which target transposable
      elements.
    explanation: >-
      States the protein-family identity and silencing activity that this node
      says is lost. The sentence reports no experiment, so it is graded as
      background rather than as a study result.
  - reference: PMID:37973953
    reference_title: >-
      Primate-specific ZNF808 is essential for pancreatic development in
      humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We show that loss of ZNF808 in vitro results in aberrant activation of
      regulatory potential contained in the primate-specific transposable
      elements it represses during early pancreas development. This leads to
      inappropriate specification of cell fate with induction of genes
      associated with liver identity.
    explanation: >-
      The differentiation experiment supports both bound processes: loss of
      transposable element silencing, and endodermal cell fate specification
      going to liver rather than pancreas.

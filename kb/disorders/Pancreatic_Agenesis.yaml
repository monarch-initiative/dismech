name: Pancreatic Agenesis
creation_date: "2026-05-09T13:53:48Z"
category: Mendelian
synonyms:
- pancreas agenesis
- complete pancreatic agenesis
- pancreatic aplasia
- congenital pancreatic agenesis
- pancreatic agenesis type 1
- partial agenesis of the pancreas
- partial pancreatic agenesis
description: >-
  Pancreatic agenesis is a rare congenital developmental disorder in which the
  pancreas is absent or markedly hypoplastic. Complete pancreatic agenesis
  usually presents with permanent neonatal diabetes from severe insulin
  deficiency and exocrine pancreatic insufficiency requiring enzyme
  replacement. Known Mendelian causes disrupt pancreatic developmental
  transcription-factor dosage or regulation, especially GATA6, PTF1A, and PDX1.
  A fourth cause, biallelic loss of the primate-specific epigenetic silencer
  ZNF808, acts instead by derepressing the transposable elements it normally
  keeps silent during early pancreas development.
disease_term:
  preferred_term: pancreatic agenesis
  term:
    id: MONDO:0009832
    label: pancreatic agenesis
parents:
- hereditary disease
- disorder of development or morphogenesis
has_subtypes:
- name: GATA6
  display_name: GATA6-Related Pancreatic Agenesis
  classification: molecular
  description: >-
    Heterozygous, frequently de novo inactivating GATA6 variants: the most
    commonly identified molecular cause of pancreatic agenesis in neonatal
    diabetes cohorts, and the form regularly accompanied by congenital heart
    and other endodermal-organ malformations. MONDO files GATA6 pancreatic
    involvement under a congenital heart disease class rather than under
    pancreatic agenesis, so no child of the parent term is available to bind
    as this row's subtype_term.
  subtype_frequency: 21 of 39 (54%) patients with pancreatic agenesis in the combined neonatal diabetes cohorts
  genes:
  - preferred_term: GATA6
    term:
      id: hgnc:4174
      label: GATA6
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0100540
        label: GATA6-related congenital heart disease with or without pancreatic hypoplasia or diabetes
      mapping_predicate: skos:broadMatch
      mapping_source: MONDO
      mapping_justification: >-
        A synonym-inclusive search of the gene symbol
        (runoak -i ols:mondo search "GATA6") returns MONDO:0100540 as the only
        GATA6 class covering pancreatic involvement; its hierarchical parents
        place it outside MONDO:0009832, so it is a broader cardiac-led concept
        rather than a pancreatic agenesis subtype. Recorded as broadMatch, which
        leaves the concept in the curation queue.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      A single inactivating GATA6 allele is sufficient, and the variant is
      usually de novo rather than inherited.
    evidence:
    - reference: PMID:22158542
      reference_title: GATA6 haploinsufficiency causes pancreatic agenesis in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report de novo heterozygous inactivating mutations in GATA6 in 15/27
        (56%) individuals with pancreatic agenesis.
      explanation: >-
        The discovery cohort establishes the heterozygous, frequently de novo
        pattern that makes this subtype autosomal dominant.
  evidence:
  - reference: PMID:23223019
    reference_title: >-
      GATA6 mutations cause a broad phenotypic spectrum of diabetes from
      pancreatic agenesis to adult-onset diabetes without exocrine
      insufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we have now identified GATA6 mutations in 21 of 39 (54%) patients with
      pancreatic agenesis
    explanation: >-
      Quantifies the share of pancreatic agenesis cases this subtype row
      carries, which is the figure in subtype_frequency.
- name: PAGEN1
  display_name: Pancreatic Agenesis 1 (PDX1-Related)
  classification: molecular
  subtype_term:
    preferred_term: pancreatic agenesis 1
    term:
      id: MONDO:0024547
      label: pancreatic agenesis 1
  description: >-
    Pancreatic agenesis from biallelic variants in PDX1, the gene formerly
    called IPF1. MONDO defines this class as any pancreatic agenesis whose
    cause is a mutation in PDX1 and cross-references it to OMIM:260370.
  genes:
  - preferred_term: PDX1
    term:
      id: hgnc:6107
      label: PDX1
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Complete pancreatic agenesis from PDX1 requires loss of functional
      protein from both alleles.
    evidence:
    - reference: PMID:22158542
      reference_title: GATA6 haploinsufficiency causes pancreatic agenesis in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This is in contrast to PDX1 and PTF1A mutations, where pancreatic
        agenesis results from a complete absence of functional protein as a result
        of homozygous inactivating mutations.
      explanation: >-
        States that pancreatic agenesis from PDX1 follows homozygous
        inactivating mutations, which is autosomal recessive transmission.
    - reference: PMID:20301620
      reference_title: Permanent Neonatal Diabetes Mellitus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        PDX1-, PTF1A-, RFX6-, SLC2A2-, and SLC19A2-related PNDM are inherited in
        an autosomal recessive manner.
      explanation: >-
        The GeneReviews chapter for permanent neonatal diabetes assigns
        autosomal recessive inheritance to PDX1-related disease by gene name.
  evidence:
  - reference: PMID:12970316
    reference_title: >-
      Agenesis of human pancreas due to decreased half-life of insulin promoter
      factor 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe two novel mutations in the IPF1 gene leading to pancreas
      agenesis.
    explanation: >-
      IPF1 is the former symbol for PDX1, so this report is the human evidence
      that the gene defining this subtype causes pancreatic agenesis.

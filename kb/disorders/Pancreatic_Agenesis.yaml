- name: ZNF808 Loss and Derepression of Primate-Specific Transposable Elements
  description: >-
    ZNF808 is a KRAB zinc finger protein that silences a family of
    primate-specific transposable elements. When both alleles are lost those
    elements are no longer repressed during early pancreas development, the
    regulatory potential they carry is aberrantly activated, and endodermal
    cell fate is redirected towards liver identity instead of pancreas.

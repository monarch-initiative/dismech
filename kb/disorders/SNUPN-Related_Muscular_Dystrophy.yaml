- name: Purkinje Cell Mis-splicing and Cerebellar Maldevelopment
  description: >-
    In a knock-in mouse carrying patient variants, mis-splicing in cerebellar
    Purkinje cells lowers expression of neuronal development and synaptic
    genes, leaving an immature cytoskeleton and reduced sonic hedgehog
    secretion, with secondary defects in granule cell migration and
    interneuron development. Shown in mice; in patients, cerebellar atrophy
    is observed but the mechanism is inferred.

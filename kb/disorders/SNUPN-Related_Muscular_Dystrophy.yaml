genetic:
- name: SNUPN
  association: Causal
  gene_term:
    preferred_term: SNUPN
    term:
      id: hgnc:14245
      label: SNUPN
  gene_disease_validity:
  - validity_classification: STRONG
    classified_by: CLINGEN
    external_id: CGGV:assertion_06303378-ec98-485e-bbfe-dcbd5c5ebea3-2024-10-08T160000.000Z
    evidence:
    - reference: CGGV:assertion_06303378-ec98-485e-bbfe-dcbd5c5ebea3-2024-10-08T160000.000Z
      reference_title: "SNUPN / SNUPN-related muscular dystrophy with or without multi-system involvement (Strong)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SNUPN | HGNC:14245 | SNUPN-related muscular dystrophy with or without multi-system involvement | MONDO:0100584 | AR | Strong"
      explanation: ClinGen Strong classification.
  notes: >-
    Reported alleles include the recurrent missense p.Ile309Ser (homozygous in
    Romanian, Macedonian and Kosovar families), nonsense and frameshift
    variants in the last coding exon (several with founder haplotypes), a
    splice-acceptor variant, the N-terminal missense p.Arg55Gln, and the
    compound heterozygous p.Arg27Cys/p.Cys174Tyr in the adult-onset family.
    Patients with homozygous nonsense or frameshift variants had more severe
    weakness than those with C-terminal missense variants.
  evidence:
  - reference: PMID:38413582
    reference_title: "SNUPN deficiency causes a recessive muscular dystrophy due to RNA mis-splicing and ECM dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, patients with homozygous nonsense or frameshift variants displayed more severe muscle weakness whereas those with missense variant in C-terminus had milder symptoms."
    explanation: Truncating genotypes are more severe than C-terminal missense.
  - reference: PMID:38366623
    reference_title: "Biallelic variants in SNUPN cause a limb girdle muscular dystrophy with myofibrillar-like features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients were homozygous for a missense variant in exon 9 (c.926T>G; NM_0011042581; p.Ile309Ser)"
    explanation: Independent replication with a homozygous missense allele.
  - reference: PMID:41054283
    reference_title: "SNUPN-Related Muscular Dystrophy: Novel Phenotypic, Pathological and Functional Protein Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two siblings carrying two novel deleterious variants in the SNUPN gene (p.Arg27Cys and p.Cys174Tyr) showed adult-onset proximo-distal and axial muscle weakness with early respiratory involvement."
    explanation: Compound heterozygous alleles in an adult-onset family.
animal_models:
- name: Drosophila muscle-specific Snup knockdown
  species: Drosophila melanogaster
  genotype: UAS-iSnup; Mhc-GAL4 (muscle-specific RNAi of the SNUPN ortholog)
  publication: PMID:38366623
  description: >-
    Muscle-specific silencing of the fly ortholog impairs climbing and
    shortens survival.
  modeled_mechanisms:
  - target: Myofiber Degeneration and Endomysial Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Muscle knockdown reduces mobility and survival.
    limitations: >-
      RNAi knockdown is not the hypomorphic C-terminal alleles of patients,
      and the fly readout is climbing and lifespan rather than dystrophic
      histology.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The node is dystrophic myofiber loss with fibrosis; the fly study
        measures climbing ability and survival, which stand in for muscle
        function without showing fibrosis.
    evidence:
    - reference: PMID:38366623
      reference_title: "Biallelic variants in SNUPN cause a limb girdle muscular dystrophy with myofibrillar-like features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Reduced expression of snup in Drosophila impairs mobility and survival."
      explanation: Muscle-specific knockdown impairs fly mobility and survival.
- name: Snupn compound heterozygous knock-in mouse
  species: Mouse
  genotype: Snupn knock-in mimicking the patients' compound heterozygous variants
  publication: PMID:41705730
  description: >-
    The mouse develops cerebellar ataxia, cerebellar atrophy and Purkinje
    cell dendritic abnormalities with Purkinje-cell mis-splicing. Muscle
    findings were not described in the abstract.
  modeled_mechanisms:
  - target: Purkinje Cell Mis-splicing and Cerebellar Maldevelopment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the cerebellar phenotype of the spinocerebellar families.
    evidence:
    - reference: PMID:41705730
      reference_title: "SNUPN variants cause spinocerebellar atrophy by disrupting global splicing in cerebellar Purkinje cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The knock-in mouse mimicking the compound heterozygous variants exhibited cerebellar ataxia, cerebellar atrophy and dendritic abnormalities in Purkinje cells."
      explanation: Cerebellar atrophy and Purkinje-cell defects in the knock-in.

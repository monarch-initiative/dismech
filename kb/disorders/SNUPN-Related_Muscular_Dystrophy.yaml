    explanation: Variants cluster in the last coding exon.
  - reference: PMID:38413582
    reference_title: "SNUPN deficiency causes a recessive muscular dystrophy due to RNA mis-splicing and ECM dysregulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that mutant SPN1 failed to oligomerize leading to cytoplasmic aggregation in patients' primary fibroblasts and CRISPR/Cas9-mediated mutant cell lines."
    explanation: Mutant SPN1 cannot oligomerize and aggregates in patient and engineered cells.

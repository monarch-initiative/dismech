  description: >-
    The OMIM-defined limb-girdle entity (MIM 620793), which MONDO places
    under SNUPN-related muscular dystrophy. The ClinGen entity spans the
    same patients plus the extramuscular presentations, so this subtype is
    recorded for mapping rather than as a separate pathograph.
  subtype_term:
    preferred_term: muscular dystrophy, limb-girdle, autosomal recessive 29
    term:
      id: MONDO:0971171
      label: muscular dystrophy, limb-girdle, autosomal recessive 29
notes: >-
  ClinGen named the entity "with or without multi-system involvement" because
  central nervous system and ocular features accompany the muscle disease in
  some patients; it classifies SNUPN as Strong (2024) and notes a preprint
  linking SNUPN to spinocerebellar atrophy that was later published
  (PMID:41705730). No GeneReviews chapter covers the disorder; the phenotype
  baseline is the 18-patient Nashabat et al. cohort (PMID:38413582, Table 1)
  and the 5-patient Iruzubieta et al. cohort (PMID:38366623). That table
  codes thin corpus callosum as HP:0200012, which HPO labels Short corpus
  callosum; this entry binds HP:0033725 Thin corpus callosum instead.
inheritance:
- name: Autosomal recessive
  description: >-
    Homozygous or compound heterozygous SNUPN variants segregate with
    disease; consanguinity is present in a minority of families, and
    founder haplotypes are reported for recurrent alleles.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

pathophysiology:
- name: Snurportin-1 Oligomerization and Importin-beta Binding Defect
  description: >-
    Eight of nine variants in the founding cohort lie in the 198-nucleotide
    last coding exon, so truncating alleles are expected to escape
    nonsense-mediated decay and yield C-terminally altered protein. Mutant
    SPN1 fails to self-oligomerize and aggregates in the cytoplasm; other
    variants reduce importin-beta binding and impair folding. Total SPN1
    abundance can be unchanged, so the defect is functional rather than a
    loss of protein.
  biological_scale: MOLECULAR

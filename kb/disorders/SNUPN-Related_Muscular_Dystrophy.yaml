      snippet: "Functional studies showed that SNUPN variants impair snurportin-1 function through reduced binding affinity to importin-β and impaired folding, leading to disturbed nuclear import of small nuclear ribonucleoproteins and downstream splicing."
      explanation: Variant SPN1 binds importin-beta poorly, disturbing snRNP import.
  evidence:
  - reference: PMID:38413582

name: SNUPN-Related Muscular Dystrophy
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- SNUPN-related muscular dystrophy with or without multi-system involvement
- LGMDR29
- limb-girdle muscular dystrophy, autosomal recessive 29
- snurportin-1-related muscular dystrophy
description: >-
  SNUPN-related muscular dystrophy is an autosomal recessive muscular
  dystrophy caused by biallelic, mostly hypomorphic variants in SNUPN, which
  encodes snurportin-1 (SPN1), the adapter that binds the trimethylguanosine
  cap of spliceosomal U snRNPs and importin-beta to import them into the
  nucleus. Most variants cluster in the last coding exon and impair SPN1
  self-oligomerization or importin-beta binding; snRNP components accumulate
  in the cytoplasm, Cajal bodies break down, spliceosome maturation fails and
  splicing is deregulated, notably in sarcolemmal, extracellular matrix and
  splicing-factor genes.

  Onset ranges from birth to about 10 years in the two founding cohorts, with
  an adult-onset family reported later. Patients have progressive proximal
  limb weakness, often with distal and axial weakness, joint contractures,
  spinal deformity, raised creatine kinase and a myopathic EMG; many lose
  independent ambulation. Restrictive respiratory insufficiency is common and
  can be fatal in childhood. Muscle biopsy shows dystrophic changes with
  endomysial fibrosis and myofibrillar-like features (myotilin and desmin
  aggregates, Z-disc disorganization). Extramuscular involvement is variable:
  cerebellar atrophy, thin corpus callosum and congenital bilateral cataracts,
  and two families have presented mainly with spinocerebellar atrophy.
  Treatment is supportive.

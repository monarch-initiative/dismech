- name: Type II pneumocyte hyperplasia
  description: Chronic recurrent alveolar hemorrhage and intra-alveolar hemosiderin accumulation are accompanied by reactive type II pneumocyte hyperplasia along the alveolar epithelium and mild-to-moderate interstitial fibrosis. If the underlying gluten-driven condition is not recognized and treated, repeated hemorrhagic episodes progress to worsening pulmonary hemosiderosis, interstitial fibrosis, and end-stage lung disease.

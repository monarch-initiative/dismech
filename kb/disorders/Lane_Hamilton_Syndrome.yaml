treatments:
- name: Gluten-free diet
  description: Elimination of gluten from diet is foundational therapy for Lane Hamilton Syndrome, as it addresses the underlying celiac disease trigger. Many LHS cases achieve remission or significant improvement with strict, lifelong gluten-free diet adherence. Relapse commonly occurs with dietary nonadherence, emphasizing the critical importance of sustained dietary compliance for disease control.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Gluten-triggered intestinal autoimmunity in celiac disease
    treatment_effect: INHIBITS
    description: Dietary elimination of gluten removes the antigenic trigger of intestinal celiac autoimmunity and resolves the associated diffuse alveolar hemorrhage.
    evidence:
    - reference: PMID:34401285
      reference_title: Coincidence or connection? A patient with concurrent Lane Hamilton Syndrome and idiopathic membranous nephropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Maintaining a gluten-free diet has been shown to improve symptoms of both CD and IPH in the setting of LHS
      explanation: Directly links dietary gluten elimination to improvement of both intestinal celiac disease and respiratory hemorrhage in LHS.
  evidence:
  - reference: PMID:35475077
    reference_title: 'Comparative Analysis of Adult Patients With Idiopathic Pulmonary Hemosiderosis and Lane-Hamilton Syndrome: A Systematic Review of the Literature in the Period 1971-2022.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A gluten-free diet alone was effective in the majority of patients
    explanation: Systematic review demonstrates gluten-free diet as effective primary therapy
  - reference: DOI:10.5505/respircase.2024.73604
    reference_title: 'Diet-treatable Cause of Hemoptysis: Lane Hamilton Syndrome'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The primary treatment for LHS is a GFD, which leads to the regression of both IPH and CD -related symptoms in most cases (4,9). While some patients may be prescribed steroids or other immunosuppressive drugs to control hemoptysis, GFD can lead to the discontinuation of these drugs in most patients.
    explanation: Case report and literature discussion confirm that a gluten-free diet is the primary treatment for Lane-Hamilton syndrome and leads to regression of both pulmonary and gastrointestinal symptoms.
- name: Corticosteroids
  description: Systemic corticosteroids (prednisone or methylprednisolone pulse therapy) are initiated alongside a gluten-free diet in the acute phase of diffuse alveolar hemorrhage, and long-term prednisone is used in refractory cases. Fewer patients with Lane-Hamilton syndrome require chronic systemic corticosteroids compared with isolated idiopathic pulmonary hemosiderosis once a gluten-free diet is instituted.
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  evidence:
  - reference: PMID:35912848
    reference_title: 'Celiac disease and idiopathic pulmonary hemosiderosis: a literature review of the Lane-Hamilton syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Prednisone or methylprednisolone pulse therapy and GFD were initiated in the acute phase, whereas chronic therapy included GFD, along with long-term prednisone in refractory cases.
    explanation: Literature review details acute-phase corticosteroid pulse therapy alongside GFD and long-term prednisone for refractory LHS cases.
  - reference: PMID:36751263
    reference_title: 'Lane-Hamilton Syndrome in an Adult With Down Syndrome: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A gluten-free diet and steroids were given to the patient with a very good clinical response
    explanation: Case report documents combined gluten-free diet and corticosteroid therapy with good clinical response.
  - reference: PMID:35475077
    reference_title: 'Comparative Analysis of Adult Patients With Idiopathic Pulmonary Hemosiderosis and Lane-Hamilton Syndrome: A Systematic Review of the Literature in the Period 1971-2022.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fewer patients in the LHS cohort received systemic corticosteroid than the IPH cohort
    explanation: Systematic review compares corticosteroid usage between LHS and IPH patients.
- name: Immunosuppressive therapy
  description: Steroid-sparing agents such as azathioprine or hydroxychloroquine have been used in selected cases of idiopathic pulmonary hemosiderosis and Lane Hamilton Syndrome for long-term management or when gluten-free diet and corticosteroid monotherapy are insufficient.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  evidence:
  - reference: PMID:36324124
    reference_title: 'Updates in idiopathic pulmonary hemosiderosis in 2022: A state of the art review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although strict gluten free diet can manage the majority of patients with LHS, other patients generally require immunosuppressive therapy.
    explanation: Review states that patients with Lane-Hamilton syndrome not controlled by a strict gluten-free diet generally require immunosuppressive therapy.
  - reference: PMID:34401285
    reference_title: Coincidence or connection? A patient with concurrent Lane Hamilton Syndrome and idiopathic membranous nephropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Successful treatment of IPH with a combination of oral steroids and azathioprine or hydroxychloroquine has also been reported
    explanation: Documents steroid-sparing immunosuppressive agents (azathioprine, hydroxychloroquine) used alongside oral steroids.
differential_diagnoses:
- name: Idiopathic pulmonary hemosiderosis (IPH) without celiac disease
  disease_term:
    preferred_term: pulmonary hemosiderosis
    term:
      id: MONDO:0008346
      label: pulmonary hemosiderosis
  description: 'Idiopathic pulmonary hemosiderosis (IPH) is a rare bleeding disorder of the lungs presenting with similar pulmonary manifestations to Lane Hamilton Syndrome: diffuse alveolar hemorrhage, hemoptysis, iron-deficiency anemia, and hemosiderin-laden macrophages on BAL. However, IPH occurs in the absence of underlying celiac disease or gluten sensitivity. IPH patients lack serologic evidence of celiac disease (negative anti-tTG and endomysial antibodies) and do not respond to gluten-free diet.'
  distinguishing_features:
  - Negative celiac disease serology (anti-tTG, endomysial antibodies)
  - No villous atrophy or duodenal histology changes on small bowel biopsy
  - No improvement with gluten-free diet alone
  - Requires corticosteroids and/or immunosuppressive therapy from disease onset
  evidence:
  - reference: PMID:35088581
    reference_title: 'Association between idiopathic pulmonary hemosiderosis and celiac disease in pediatric patients: A scoping review of the literature over the past 50 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nearly one-third of pediatric patients with IPH test positive for Celiac disease (CD) serology. Several hypothetical mechanisms have been proposed to unify the coexistence of these two entities, also referred to as Lane-Hamilton syndrome (LHS).
    explanation: Scoping review documents the coexistence of IPH and celiac disease in pediatric patients
  - reference: PMID:36324124
    reference_title: 'Updates in idiopathic pulmonary hemosiderosis in 2022: A state of the art review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A substantial number of patients suffer from coexisting CD, also known as Lane-Hamilton syndrome (LHS), and all patients with IPH need to be evaluated for LHS by serology.
    explanation: Review of IPH updates recommends evaluating all IPH patients for coexisting celiac disease
- name: Vasculitis-associated pulmonary hemorrhage (ANCA-associated vasculitis)
  disease_term:
    preferred_term: granulomatosis with polyangiitis
    term:
      id: MONDO:0012105
      label: granulomatosis with polyangiitis
  description: ANCA-associated vasculitides (granulomatosis with polyangiitis, microscopic polyangiitis) can present with pulmonary hemorrhage, hemoptysis, and hemoptysis-related anemia. Unlike Lane Hamilton Syndrome, vasculitis is characterized by capillaritis and immune complex deposition on lung biopsy, frank vasculitis of small vessels, and positive ANCA serology (c-ANCA or p-ANCA antibodies).
  distinguishing_features:
  - Positive ANCA serology (c-ANCA/PR3 or p-ANCA/MPO)
  - Histologic evidence of capillaritis and vasculitis on lung biopsy
  - Multi-system involvement (glomerulonephritis, upper respiratory involvement)
  - No association with celiac disease or gluten exposure
  evidence:
  - reference: PMID:34401285
    reference_title: Coincidence or connection? A patient with concurrent Lane Hamilton Syndrome and idiopathic membranous nephropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Infectious and rheumatologic workups were unrevealing, including ANA, ANCA, and anti-glomerular basement membrane antibodies.
    explanation: Diagnostic workup of Lane-Hamilton syndrome excludes ANCA-associated vasculitis and other rheumatologic causes of alveolar hemorrhage.
  notes: Microscopic polyangiitis (MONDO:0019124) is another important ANCA-associated vasculitis in the differential diagnosis
- name: Goodpasture syndrome (anti-glomerular basement membrane disease)
  disease_term:
    preferred_term: anti-glomerular basement membrane disease
    term:
      id: MONDO:0009303
      label: anti-glomerular basement membrane disease
  description: Goodpasture syndrome is an autoimmune condition causing pulmonary-renal vasculitis with diffuse alveolar hemorrhage and rapidly progressive glomerulonephritis. While it presents with hemoptysis and alveolar hemorrhage similar to Lane Hamilton Syndrome, Goodpasture syndrome features anti-GBM antibody positivity, linear IgG deposition on basement membranes, and acute progression without association with celiac disease.
  distinguishing_features:
  - Positive anti-glomerular basement membrane (anti-GBM) antibodies
  - Linear IgG deposition on basement membrane by immunofluorescence
  - Rapidly progressive glomerulonephritis with renal dysfunction
  - No association with celiac disease or gluten exposure
  - Presents acutely; more severe at onset than Lane Hamilton Syndrome
  evidence:
  - reference: PMID:34401285
    reference_title: Coincidence or connection? A patient with concurrent Lane Hamilton Syndrome and idiopathic membranous nephropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pulmonary renal syndromes may share common features due to similarities between the glomerular basement membrane and the alveolar basement membrane, such as type IV collagen, which is implicated in Goodpasture's syndrome.
    explanation: Discusses Goodpasture syndrome and anti-GBM testing in the differential diagnosis of pulmonary-renal and alveolar hemorrhage presentations.

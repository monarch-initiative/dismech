    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pathology demonstrated benign lung parenchymal tissue with patchy areas of alveolar hemorrhage and an extensive collection of intra-alveolar hemosiderin containing macrophages consistent with pulmonary hemosiderosis
    explanation: Lung biopsy pathology directly demonstrates patchy alveolar hemorrhage and intra-alveolar hemosiderin-laden macrophages in Lane-Hamilton syndrome.

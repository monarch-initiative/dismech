- name: Alveolar hemorrhage and hemosiderin accumulation
  description: Extravasation of red blood cells and hemoglobin into the alveolar space causes diffuse alveolar hemorrhage (DAH). Alveolar macrophages phagocytose the extravasated erythrocytes and degrade hemoglobin into hemosiderin. These hemosiderin-laden macrophages (siderophages) accumulate in alveolar spaces and are detected via bronchoalveolar lavage (BAL) or lung biopsy as the hallmark histologic finding of alveolar bleeding.
  evidence:
  - reference: PMID:35088581
    reference_title: 'Association between idiopathic pulmonary hemosiderosis and celiac disease in pediatric patients: A scoping review of the literature over the past 50 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bronchoscopy with bronchoalveolar lavage demonstrating hemosiderin laden macrophages was the primary mode of diagnostic confirmation.
    explanation: Scoping review confirms accumulation of hemosiderin-laden macrophages in alveolar spaces detected by BAL as the primary diagnostic hallmark of alveolar hemorrhage in LHS.

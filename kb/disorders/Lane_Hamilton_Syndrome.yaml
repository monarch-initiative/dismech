environmental:
- name: Dietary Gluten Exposure
  description: Dietary gluten ingestion is the essential environmental/dietary trigger of both the intestinal celiac enteropathy and the associated diffuse alveolar hemorrhage in Lane-Hamilton syndrome; strict dietary gluten elimination resolves both gastrointestinal and pulmonary manifestations in most patients.
  evidence:
  - reference: PMID:34401285
    reference_title: Coincidence or connection? A patient with concurrent Lane Hamilton Syndrome and idiopathic membranous nephropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Maintaining a gluten-free diet has been shown to improve symptoms of both CD and IPH in the setting of LHS
    explanation: Demonstrates that dietary gluten exposure drives both intestinal and respiratory disease activity in Lane-Hamilton syndrome.
diagnosis:
- name: Bronchoscopy with Bronchoalveolar Lavage
  description: Bronchoscopy with bronchoalveolar lavage (BAL) demonstrating hemosiderin-laden macrophages is the primary method for confirming diffuse alveolar hemorrhage / idiopathic pulmonary hemosiderosis in Lane-Hamilton syndrome.

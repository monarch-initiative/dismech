prevalence:
- population: Published cases (1971-2020 literature review)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: Literature review of international databases from January 1971 to August 2020 identified 80 published cases (44 children and 36 adults). Among patients with idiopathic pulmonary hemosiderosis, coexisting celiac disease is reported in approximately one-third of pediatric cases and 25% of adult cases.
  evidence:

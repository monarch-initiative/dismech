- name: Immune-mediated increase in pulmonary capillary permeability
  description: Gluten-driven systemic autoimmunity in celiac disease is associated with immune-mediated injury or permeability changes across the alveolar-capillary barrier, leading to bland diffuse alveolar hemorrhage without necrotizing capillaritis. Although a shared immunologic pathogenesis is strongly supported by circulating autoantibodies and clinical remission on a gluten-free diet, the exact molecular effectors remain incompletely defined.

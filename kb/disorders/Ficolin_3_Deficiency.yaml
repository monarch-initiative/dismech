prevalence:
- population: White (Caucasian) populations
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2000.0
  notes: >-
    Allele frequency 0.01 for FCN3 +1637delC among whites, so roughly 1 in 50
    individuals is a heterozygous carrier. This is the carrier rate for the
    allele, not the rate of the deficiency state.
  evidence:
  - reference: PMID:19535802
    reference_title: "Immunodeficiency associated with FCN3 mutation and ficolin-3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "occurs in people without disease (allele frequency among whites, 0.01)"
    explanation: >-
      Source of the carrier allele frequency, and of the statement that carriers
      are unaffected. Quoted from this paper's framing of prior work; the
      primary determination is the item below.
    quote_role: BACKGROUND
  - reference: PMID:18261799
    reference_title: "Characterization of a polymorphism in the coding sequence of FCN3 resulting in a Ficolin-3 (Hakata antigen) deficiency state."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Out of several polymorphisms one FCN3+1637delC causing a reading frame shift and a distortion of the C-terminal end of the molecule with an allele frequency of 0.011 was particularly interesting."
    explanation: >-
      States the allele frequency this prevalence record is computed from,
      determined in the primary population survey rather than restated from it.
    quote_role: PRIMARY_RESULT
- population: Newborns of European origin from Krasnoyarsk city, Siberia
  measure_type: UNKNOWN
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3300.0
  notes: >-
    Read this record with its caveats or not at all.

    It is a genotype frequency in a newborn sample, not a disease prevalence -
    the deficiency genotype was counted, no phenotype was assessed, and the
    authors defer infectious-morbidity analysis to future work. measure_type is
    UNKNOWN rather than BIRTH_PREVALENCE for that reason: labelling it a birth
    prevalence would invite a consumer to read 3300 per 100,000 as the rate at
    which this disease is born.

    The population is the study's comparison group, not its subject. Krasnoyarsk
    city sits around 56 degrees north, roughly 2,000 km south of the Taimyr
    Dolgano-Nenets region whose indigenous populations the study is about. Those
    Arctic groups carry the genotype at 0% (Nenets) and 0.8% (Dolgans and
    Nganasans); the high figure belongs to the Caucasian controls.

    The figure is the full text's 3.3% (10 of 302), not the abstract's 3.5%.

    Most importantly, the genotype distribution is internally inconsistent. The
    same paper reports one heterozygote in the entire 926-newborn sample against
    15 del/del homozygotes. Hardy-Weinberg at that homozygote rate predicts
    heterozygotes in the hundreds. A common rare homozygote with an absent
    heterozygote is the signature of allele dropout in a single-base-deletion
    assay, so this may be measuring the assay rather than the population. It is
    curated because it is the only unselected genotype screen published, not
    because the number is reliable.
  evidence:
  - reference: PMID:35083404
    reference_title: "Prevalence of the polymorphic H-f icolin (FCN3) genes and mannose-binding lectin-associated serine protease-2 (MASP2) in indigenous populations from the Russian Arctic regions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it was found in our cohort of the studied samples in\n10 Russian newborns (3.3 %), in 4 newborns from a mixed\npopulation (2.0 %) and in one of the Dolgan and Nganasan\ngroup (0.8 %)"
    explanation: >-
      The per-population homozygote counts from the full text, with denominators
      implied by the percentages. Quoted in preference to the abstract's
      summary, which rounds the Russian figure to 3.5% and omits the counts.
  - reference: PMID:35083404
    reference_title: "Prevalence of the polymorphic H-f icolin (FCN3) genes and mannose-binding lectin-associated serine protease-2 (MASP2) in indigenous populations from the Russian Arctic regions."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant deletion allele (del) FCN3 rs28357092 in\na heterozygous state was not found in any newborns of\nthe three indigenous populations of the Taimyr Dolgano-\nNenets region, except for one Russian individual from\nthe city of Krasnoyarsk."
    explanation: >-
      One heterozygote against 15 homozygotes in 926 newborns. Curated as REFUTE
      against reading the homozygote figure above as a population frequency: no
      allele frequency produces that distribution, and it is what allele dropout
      in a single-base-deletion assay looks like.

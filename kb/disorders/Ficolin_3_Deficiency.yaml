- name: Lectin-pathway functional assay
  diagnosis_term:
    preferred_term: ficolin-3-initiated lectin pathway functional assay
    term:
      id: NCIT:C70617
      label: Total Complement Assay
  notes: >-
    The binding is broader than the assay. NCIT:C70617 concerns total complement
    activity, whereas the assay described here is a pathway-specific deposition
    readout that localises the defect to ficolin-3 or to shared downstream
    components. NCIT:C70611 (hemolytic), NCIT:C80160 (quantity rather than
    function) and NCIT:C39138 (a pathway, not a procedure) were checked and none
    is closer. Kept rather than dropped because the procedure class is right and
    the specificity is carried in preferred_term.
  description: >-
    A functional complement assay reading out ficolin-3-initiated activation,
    which distinguishes a defect in ficolin-3 itself from one in the downstream
    shared components of the pathway.

name: Ficolin 3 Deficiency
creation_date: "2026-09-15T13:18:10Z"
category: Mendelian
description: >-
  Ficolin-3 deficiency is an inherited defect of the lectin pathway of
  complement caused by homozygosity for the FCN3 frameshift variant +1637delC
  (rs28357092). Ficolin-3, also called H-ficolin or Hakata antigen, is made in
  liver and lung and is the most potent activator of the lectin pathway in
  vitro; the frameshift distorts the C-terminal end of the molecule, so
  homozygotes have undetectable serum ficolin-3 and no ficolin-3-dependent
  complement activation. Heterozygosity is common in white populations (allele
  frequency about 0.01) and is not a disease state.

  What the loss does clinically is genuinely unsettled, and this entry curates
  that uncertainty rather than resolving it. The index case was reported as an
  immunodeficiency with recurrent infection; later cases add meningitis,
  pyelonephritis and refractory seizures. A subsequent series of deficient
  individuals questioned whether susceptibility to infection is the right
  reading at all, and a systematic review found that a third of deficient
  patients carried a diagnosis of systemic lupus erythematosus, pointing at
  defective clearance of apoptotic material rather than at failed opsonisation.
  Fewer than a dozen homozygotes have been described clinically, so every
  published frequency drawn from case series is a proportion of single figures.
  Genotyped homozygotes may be a much larger population, but the one screen
  that looked cannot settle it: a Siberian study reports the null genotype at
  1.6% overall, and at 3.3% in its Krasnoyarsk city comparison group, while
  finding a single heterozygote in 926 newborns - a distribution no allele
  frequency produces. It also measured no phenotypes.

differential_diagnoses:
- name: Mannose-binding lectin deficiency
  description: >-
    The other common lectin-pathway recognition-molecule deficiency. Both reduce
    lectin-pathway activation, but MBL deficiency leaves ficolin-3-dependent
    activation intact, so the two are distinguished by measuring the proteins
    separately rather than by a single pathway assay.
- name: MASP-2 deficiency
  description: >-
    Deficiency of the shared serine protease rather than of one recognition
    molecule, so it abolishes activation initiated by MBL and by all ficolins.
    Serum ficolin-3 is normal.
- name: Complement component 2 deficiency
  description: >-
    C2 sits downstream of the lectin and classical pathways at their shared
    C4b2a convertase, so C2 deficiency blocks the effector arm of both.
    Ficolin-3 deficiency blocks only one recognition arm upstream of that
    convergence, and CH50 is not the discriminating test.
discussions:
- discussion_id: ficolin3_infection_versus_autoimmunity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Opsonophagocytic Clearance of Bacteria
  - pathophysiology#Defective Clearance of Apoptotic Cells and Immune Complexes
  prompt: >-
    Is the dominant consequence of ficolin-3 deficiency failed opsonisation of
    bacteria, failed clearance of apoptotic material, or neither?
  rationale: >-
    The two mechanistic nodes in this entry come from two readings of the same
    small case literature, and the entry deliberately carries both. The index
    report framed the deficiency as an immunodeficiency; a later series
    concluded the infection link is more complicated and less clear-cut; a
    systematic review found a third of deficient patients had SLE, which is the
    signature of a clearance defect rather than an opsonisation defect. No study
    has measured opsonophagocytosis or apoptotic-cell clearance directly in
    ficolin-3-deficient cells, so both nodes rest on inference from phenotype
    distribution in fewer than a dozen people.
- discussion_id: ficolin3_penetrance_versus_carrier_frequency
  kind: KNOWLEDGE_GAP
  attaches_to:
  - prevalence#White (Caucasian) populations
  prompt: >-
    Why have so few homozygotes been reported when the carrier frequency
    predicts many more?
  rationale: >-
    The Danish allele frequency of 0.011 implies roughly 1 in 10,000
    homozygotes, which would be tens of thousands of people in Europe alone
    against fewer than a dozen clinically published cases. Either the deficiency
    is usually silent and those cases are an ascertainment tail, or homozygosity
    is rarer than Hardy-Weinberg predicts.

    What the published data can and cannot settle is worth stating precisely,
    because the obvious reading of the one unselected genotype screen does not
    survive reading its full text.

    That screen - 926 Siberian newborns, reported across two papers by the same
    group and not two independent cohorts - finds del/del at 1.6% overall and
    3.3% in its Krasnoyarsk city comparison group. Taken at face value that is
    orders of magnitude above the Danish-derived prediction and would settle the
    question in favour of a usually-silent deficiency. It cannot be taken at
    face value. The same paper reports a single heterozygote in all 926, against
    15 homozygotes; no allele frequency produces that distribution, and it is
    the signature of allele dropout in a single-base-deletion assay. The study
    also assessed no phenotypes, deferring infectious morbidity to future work,
    so the homozygotes are not known to be well - nobody looked.

    One thing does survive from it, and it is the part that matters here: the
    1-in-10,000 figure is specific to the population it was computed from. The
    Danish allele frequency of 0.011 is not a global constant, and both the
    Siberian data and the Ensembl range the paper cites (1-3% variant allele,
    zero in Asian populations) say the denominator differs by population. There
    is no single worldwide prediction for the case count to fall short of.

    So the honest position is that the question is open and the evidence
    available to close it is one Polish neonatal series (613 serum
    concentrations, 529 genotypes), which found exactly one homozygote - who had
    a confirmed group B streptococcal infection - and one Siberian genotype
    screen whose internal distribution cannot be reconciled. Whether that single
    infected European homozygote is chance, ascertainment, or a real signal is
    not answerable from what is published. This bears directly on whether the
    pathophysiology nodes above describe a disease or a risk factor.
  evidence:
  - reference: PMID:22226667
    reference_title: "H-ficolin (ficolin-3) concentrations and FCN3 gene polymorphism in neonates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum H-ficolin (ficolin-3) concentrations (n=613) and FCN3 genotypes (n=529) from a large group of neonates are presented."
    explanation: >-
      The larger of the two unselected cohorts, establishing that such screening
      has been done and at what scale.
  - reference: PMID:22226667
    reference_title: "H-ficolin (ficolin-3) concentrations and FCN3 gene polymorphism in neonates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One premature newborn, with confirmed infection caused by Streptococcus agalactiae, was H-ficolin-deficient (FCN3 variant homozygote, no detectable protein)."
    explanation: >-
      The single homozygote found in unselected screening. One observation
      cannot resolve the penetrance question, but it is not neutral on it.
  - reference: PMID:36574978
    reference_title: "Ficolin-3 and MASP-2 gene variants in Siberian arctic populations: Summarized evidence of selective pressure for the high frequency of lectin complement pathway deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 926 specimens of dried blood spots of the newborns were genotyped."
    explanation: >-
      Establishes the sample size of the Siberian screen. Note this is the same
      926 newborns as PMID:35083404 by overlapping authors, not a second cohort;
      an earlier version of this discussion counted them as two and weighed one
      dataset on both sides of the argument.
  - reference: PMID:35083404
    reference_title: "Prevalence of the polymorphic H-f icolin (FCN3) genes and mannose-binding lectin-associated serine protease-2 (MASP2) in indigenous populations from the Russian Arctic regions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of the homozygous variant del/del FCN3 rs28357092 associated with the total absence of the most powerful activator of the lectin complement pathway, N-ficolin, was revealed; 0 % in the Nenets, 0.8 % in the Dolgans and Nganasans, and 3.5 % among the Russians ( p < 0.01)."
    explanation: >-
      The abstract's per-population summary. Quoted for the one thing it
      establishes that survives reading the full text: the genotype frequency
      differs by population, so the Danish-derived 1-in-10,000 figure is not a
      global prediction. It does not establish that the deficiency is silent -
      the study assessed no phenotypes - and the 3.5% here is the abstract's
      rounding of a full-text 3.3%, in the Krasnoyarsk city comparison group
      rather than in an Arctic population. The prevalence record carries those
      corrections and the heterozygote anomaly that undercuts the figure.
- discussion_id: ficolin3_no_curated_treatments
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there any ficolin-3-specific evidence for management, as opposed to
    general complement-deficiency care?
  rationale: >-
    No treatments are curated. The sources consulted describe management of the
    individual patients' infections, not an intervention directed at the
    deficiency or an outcome measured in a deficient cohort. Curating
    class-level complement-deficiency guidance here would attribute to
    ficolin-3 deficiency an evidence base that does not exist for it.
notes: >-
  Every frequency in this entry has a single-figure denominator. The one-third
  SLE figure is three of nine (PMID:31044336) and the infection reports are
  individual cases. HPO frequency tags are deliberately omitted from both the
  infection and the SLE phenotypes for that reason: a frequency band would
  present a proportion of nine literature-assembled patients as a penetrance,
  and the assembly is by case report, which selects for being unwell.

  The entry carries a REFUTE evidence item on the opsonophagocytosis node
  (PMID:25662573) alongside a SUPPORT item on the same node. That is intentional
  and is not a curation error. The dispute is between the index report's
  interpretation and a later series' reading of the accumulated cases, and
  flattening it to one direction would misrepresent the literature. Per
  CLAUDE.md the two directions are separate evidence items quoting the sentences
  that carry them, rather than one item hedged in prose.

  The `directness: INDIRECT` on the apoptotic-clearance node is load-bearing.
  The quoted sentence reports an emerging autoimmune phenotype, not a measured
  clearance defect; the clearance mechanism is imported from what is known about
  C1q and C2 deficiency. Grading it DIRECT would claim the paper measured
  something it did not.

  `quote_role: BACKGROUND` marks a quoted sentence that is a paper's framing of
  ficolin-3 biology rather than its own result - PMID:19535802's statement of
  where FCN3 is expressed, PMID:25662573's in vitro potency comparison,
  PMID:32634042's antimicrobial-activity sentence, and the carrier-frequency
  restatement beside the prevalence record. Each of those papers is also quoted
  elsewhere in this entry without the marker, for sentences that are its own
  observations. Deliberately stated without a count, since a count has to be
  maintained against the entry and prose that describes the entry rots when it
  is not.

  Hardy-Weinberg arithmetic in the second discussion (allele frequency 0.01
  implying about 1 in 10,000 homozygotes) is this entry's calculation from the
  quoted allele frequency, not a figure taken from a source. It is stated in a
  discussion rather than as a prevalence record for that reason.

  The `parents: [Complement Disorder]` value follows the sibling
  Complement_Component_2_Deficiency entry. This entry is intended to become a
  member of kb/groupings/Complement_Deficiency_IEIs.yaml, whose
  `curate_early_and_regulatory_complement_defects` experiment names a
  lectin-pathway deficiency as a prerequisite; that membership edit is left to a
  separate PR so this one stays a single-disease diff.

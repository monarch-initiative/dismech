inheritance:
- name: Autosomal Recessive
  description: >-
    Deficiency requires homozygosity for FCN3 +1637delC. Heterozygotes are found
    in the general population without disease, and the index report explicitly
    contrasts the heterozygous carrier state with the homozygous proband.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19535802
    reference_title: "Immunodeficiency associated with FCN3 mutation and ficolin-3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with recurrent infections who was homozygous for this mutation, who had undetectable serum levels of ficolin-3"
    explanation: >-
      The affected proband is homozygous, against a heterozygous carrier state
      the same abstract describes as occurring in people without disease.
pathophysiology:
- name: FCN3 Frameshift and Absent Ficolin-3 Protein
  biological_scale: MOLECULAR
  description: >-
    The +1637delC frameshift (rs28357092) distorts the C-terminal end of
    ficolin-3, which carries the fibrinogen-like recognition domain. Homozygotes
    have undetectable ficolin-3 in serum. Ficolin-3 is expressed in liver and
    lung, so the deficiency removes both the circulating and the airway pool.
  genetic_context:
    gene:
      preferred_term: FCN3
      term:
        id: hgnc:3625
        label: FCN3
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:18261799
    reference_title: "Characterization of a polymorphism in the coding sequence of FCN3 resulting in a Ficolin-3 (Hakata antigen) deficiency state."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Characterization of recombinant Ficolin-3 derived from FCN3+1637delC showed that in the homozygous situation this allelic variant would lead to Ficolin-3 deficiency."
    explanation: >-
      The direct demonstration of the functional consequence, in recombinant
      protein, rather than an association between the variant and the deficient
      state. This is what LOSS_OF_FUNCTION rests on.
  - reference: PMID:19535802
    reference_title: "Immunodeficiency associated with FCN3 mutation and ficolin-3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ficolin-3, encoded by the FCN3 gene and expressed in the lung and liver, is a recognition molecule in the lectin pathway of the complement system."
    explanation: >-
      Establishes the gene, the tissues of expression, and the pathway role of
      the missing protein. The sentence is the report's framing of ficolin-3
      biology rather than its own measurement, so it is graded BACKGROUND.
    quote_role: BACKGROUND
  - reference: PMID:25662573
    reference_title: "Primary Ficolin-3 deficiency--Is it associated with increased susceptibility to infections?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its genetically determined deficiency in Caucasians is associated with a frame-shift mutation +1637delC (rs28357092) of the FCN3 gene."
    explanation: >-
      Names the specific causal allele underlying the deficiency state.
  downstream:
  - target: Failure of Ficolin-3-Dependent Lectin Pathway Activation
    description: >-
      With no ficolin-3 protein there is no ficolin-3 recognition event to
      recruit MASPs, so the ficolin-3 arm of the lectin pathway cannot initiate.
- name: Failure of Ficolin-3-Dependent Lectin Pathway Activation
  biological_scale: MOLECULAR
  description: >-
    Ficolin-3 is the recognition molecule that binds acetylated ligands on
    microbial and altered-self surfaces and recruits MASPs to cleave C4 and C2.
    Its absence abolishes ficolin-3-dependent complement activation
    specifically; mannose-binding lectin and the ficolin-2 arm remain, which is
    one reason the clinical consequence is more variable than a deficiency of a
    shared downstream component such as C2.
  biological_processes:
  - preferred_term: complement activation, lectin pathway
    term:
      id: GO:0001867
      label: complement activation, lectin pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:19535802
    reference_title: "Immunodeficiency associated with FCN3 mutation and ficolin-3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "who had a deficiency in ficolin-3-dependent complement activation"
    explanation: >-
      Reports the functional assay result in the proband, which is what makes
      this a pathway block and not only an absent antigen.
  - reference: PMID:25662573
    reference_title: "Primary Ficolin-3 deficiency--Is it associated with increased susceptibility to infections?"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ficolin-3 (also called H-ficolin or Hakata antigen) is the most potent activator of the lectin pathway of complement in vitro."
    explanation: >-
      Establishes the magnitude of the lectin-pathway contribution that is lost.
      The claim is an in vitro potency comparison, not a patient measurement.
    quote_role: BACKGROUND
  downstream:
  - target: Impaired Opsonophagocytic Clearance of Bacteria
    description: >-
      Loss of ficolin-3-initiated C4 and C2 cleavage reduces complement
      deposition on bacterial surfaces, impairing complement-receptor-mediated
      uptake. This edge carries the index report's interpretation, which a later
      series disputes; see the linked discussion.
  - target: Defective Clearance of Apoptotic Cells and Immune Complexes
    description: >-
      Ficolin-3 binds altered-self surfaces, so its loss removes a route for
      complement-dependent disposal of dying cells and immune complexes.
- name: Impaired Opsonophagocytic Clearance of Bacteria
  biological_scale: CELLULAR
  description: >-
    Without ficolin-3-initiated complement deposition, phagocytes engage
    opsonised bacteria less efficiently through complement receptors. This node
    is the mechanism proposed by the index case report; whether it is the
    dominant consequence of ficolin-3 loss in people is contested, and the entry
    records the dispute rather than settling it.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:32634042
    reference_title: "A new case of congenital ficolin-3 deficiency with primary immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has anti-microbial activities against bacterial and viral infections and restrains opportunistic pathogens."
    explanation: >-
      States the antimicrobial role whose loss this node represents. The
      sentence is the paper's framing of ficolin-3 function rather than a
      measurement made in its patient, so it is graded BACKGROUND.
    quote_role: BACKGROUND
    directness: INDIRECT
  - reference: PMID:25662573
    reference_title: "Primary Ficolin-3 deficiency--Is it associated with increased susceptibility to infections?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, with our knowledge extended by several other patients that issue seems to be more complicated and less clear-cut."
    explanation: >-
      Contradicts the claim that ficolin-3 deficiency reliably produces an
      infection-susceptibility phenotype once more than the index patient is
      considered. Curated as REFUTE against this node rather than omitted,
      because the dispute is the state of the evidence.
  downstream:
  - target: Recurrent Bacterial Infection
    description: >-
      Reduced opsonophagocytic clearance is the proposed route to the recurrent
      bacterial infections reported in deficient individuals.
- name: Defective Clearance of Apoptotic Cells and Immune Complexes
  biological_scale: CELLULAR
  description: >-
    Complement-dependent disposal of apoptotic cells and immune complexes is the
    route by which other early-complement deficiencies cause lupus, and the
    autoimmune phenotype emerging from the ficolin-3-deficient case series
    points at the same mechanism here. The link is inferred from the phenotype
    distribution rather than measured in deficient individuals, which is what
    the attached discussion records.
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:31044336
    reference_title: "Ficolin-3 Deficiency Is Associated with Disease and an Increased Risk of Systemic Lupus Erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "By systematically reviewing the literature for the described cases of ficolin-3 deficiency, an autoimmune phenotype is emerging."
    explanation: >-
      Reports that an autoimmune rather than purely infectious phenotype
      characterises the deficient cases, which is the observation this
      clearance-failure node is posited to explain. The paper measures the
      phenotype, not the clearance step, so the support is indirect.
  downstream:
  - target: Systemic Lupus Erythematosus
    description: >-
      Persistence of apoptotic material and immune complexes is the established
      route from early-complement deficiency to lupus, and is proposed here on
      the strength of the phenotype distribution.
phenotypes:
- category: Immunological
  name: Recurrent Bacterial Infection
  description: >-
    Recurrent bacterial infection is the presenting feature in the index case
    and in several subsequent reports, but its status as a consistent
    consequence of ficolin-3 deficiency is disputed. Reported infections span
    recurrent respiratory infection, cerebral abscess, meningitis and
    pyelonephritis, with no organism established as characteristic — unlike the
    pneumococcal predominance of C2 deficiency or the neisserial predominance of
    terminal pathway deficiency. No frequency is tagged; see notes.
  phenotype_term:
    preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  evidence:
  - reference: PMID:19535802
    reference_title: "Immunodeficiency associated with FCN3 mutation and ficolin-3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with recurrent infections who was homozygous for this mutation"
    explanation: >-
      The index homozygous patient presented with recurrent infection.

    causal_link_type: DIRECT
  - target: Auricular Ossification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cranial and Skull-Base Hyperostosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23788687
    reference_title: Effects of RANK-ligand antibody (denosumab) treatment on bone turnover markers
      in a girl with juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Increased bone turnover and lack of bone modeling lead to severe deformities, frequent
      fractures, short stature, and loss of hearing.
    explanation: Directly links the high-turnover state to the deformity, fracture, short-stature,
      and hearing-loss manifestations drawn downstream here.
- name: Cranial and Skull-Base Hyperostosis
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    High-turnover remodelling of the calvarium and skull base produces diploic
    thickening, basilar/orbital-roof and sphenoid sclerosis, an enlarged clivus,
    and progressive macrocephaly; the thickened temporal bone and ossicular
    disease contribute the conductive component of hearing loss.
  downstream:
  - target: Macrocephaly
    causal_link_type: DIRECT
  - target: Conductive Hearing Impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40775369
    reference_title: Juvenile Paget disease with unique compound heterozygous sequence variants
      in the TNFRSF11B gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The radiograph in early adulthood reveals marked widening of the skull with periosteal
      appositions both on the internal and external lamina, bossing of the frontal sinus, diffuse osteosclerosis
    explanation: Radiographic documentation of the calvarial/skull-base hyperostosis this node describes.
- name: Cochlear OPG Deficiency and Spiral Ganglion Degeneration
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A skeleton-independent arm. Spiral-ganglion cells secrete OPG at high levels;
    in the OPG-null mouse, OPG loss causes demyelination and degeneration of the
    cochlear nerve and sensitises spiral-ganglion cells to apoptosis (via ERK),
    producing a primary sensorineural hearing loss that compounds the conductive
    loss from ossicular/temporal-bone disease. The human sensorineural component
    is inferred from this model plus the clinical deafness of JPD, so the node is
    marked provisional.
  biological_processes:
  - preferred_term: neuron apoptotic process (spiral ganglion)
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  downstream:
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23607938
    reference_title: Loss of osteoprotegerin expression in the inner ear causes degeneration of
      the cochlear nerve and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: OPG deficiency caused demyelination and degeneration of the cochlear nerve in vivo.
    explanation: Establishes the direct cochlear-nerve degeneration mechanism of sensorineural loss in OPG deficiency.
  - reference: PMID:23607938
    reference_title: Loss of osteoprotegerin expression in the inner ear causes degeneration of
      the cochlear nerve and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: It also activated ERK, sensitized spiral ganglion cells (SGC) to apoptosis
    explanation: Names the ERK-dependent spiral-ganglion apoptosis captured by this node.
- name: Ectopic Vascular and Bruch-Membrane Calcification
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A hypothesised extraskeletal arm reflecting OPG's vascular-protective role.
    OPG/RANKL dysfunction is proposed to promote calcification of Bruch membrane
    (producing angioid streaks liable to choroidal neovascularisation) and of
    arterial walls (vascular microcalcification with a predisposition to carotid
    and iliac aneurysms). The clinical associations are well documented; the
    mechanistic link is inferential, and the retinopathy notably progresses
    despite good skeletal disease control, indicating partial uncoupling from the
    osteoclast axis.
  downstream:
  - target: Angioid Streaks and Retinopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Vascular Calcification and Arterial Aneurysm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:20547946
    reference_title: Ocular manifestations of juvenile Paget disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Osteoprotegerin or its signaling pathway may have a role in calcification of Bruch
      membrane and in the pathogenesis of angioid streaks.
    explanation: States the proposed (hypothesised) Bruch-membrane calcification mechanism; directness
      INDIRECT because the paper frames it as a hypothesis rather than a demonstrated step.
  - reference: PMID:25063546
    reference_title: Juvenile Paget's disease with heterozygous duplication within TNFRSF11A encoding RANK.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: This OPG deficiency form of JPD uniquely leads to vascular microcalcification (VMC)(14)
      that perhaps explains carotid aneurysms in childhood(15) and retinopathy with blindness in adult life.
    explanation: Links OPG-deficiency vascular microcalcification to the carotid aneurysm and retinopathy
      phenotypes; "perhaps explains" marks the inferential status recorded here.

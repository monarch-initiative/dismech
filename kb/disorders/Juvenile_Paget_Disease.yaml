treatments:
- name: Bisphosphonate Therapy
  description: >-
    First-line and best-established therapy. IV pamidronate or zoledronic acid,
    or oral alendronate/ibandronate, suppress the accelerated osteoclastic
    resorption, normalise or near-normalise ALP and other turnover markers,
    prevent new fractures, halt deformity progression, and produce striking
    motor-developmental recovery when started early in childhood and continued
    through growth. Turnover suppression relapses if treatment is discontinued;
    therapy is not curative.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pamidronate
      term:
        id: CHEBI:7903
        label: pamidronate
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
    - preferred_term: alendronic acid
      term:
        id: CHEBI:2567
        label: alendronic acid
  target_mechanisms:
  - target: Accelerated Osteoclastic Bone Resorption
    treatment_effect: INHIBITS
    description: Bisphosphonates inhibit osteoclastic bone resorption, the effector step of JPD.
    evidence:
    - reference: PMID:33850973
      reference_title: Clinical course in two children with Juvenile Paget's disease during long-term
        treatment with intravenous bisphosphonates.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Individualized intravenous treatment with pamidronate resulted in sufficient control
        of bone pain and suppression of bone turnover with few side effects over the observation period.
      explanation: Demonstrates bisphosphonate suppression of bone turnover and pain in two children with JPD.
  evidence:
  - reference: PMID:33850973
    reference_title: Clinical course in two children with Juvenile Paget's disease during long-term
      treatment with intravenous bisphosphonates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Motor development was delayed in both children before treatment with bisphosphonates
      was commenced and improved thereafter.
    explanation: Documents functional (motor-developmental) benefit of early bisphosphonate therapy.
  - reference: PMID:40775369
    reference_title: Juvenile Paget disease with unique compound heterozygous sequence variants
      in the TNFRSF11B gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Early diagnosis and antiresorption treatment prevent further fractures and deformity
      progression, and improve the patient's quality of life.
    explanation: States the fracture/deformity-preventing benefit of early anti-resorptive treatment.
- name: Denosumab
  description: >-
    A humanised anti-RANKL monoclonal antibody — the most direct pharmacologic
    mimic of the missing OPG, neutralising the RANKL that OPG can no longer
    sequester. Achieves good skeletal control (ALP normalisation, pain relief) in
    JPD but carries a substantial risk of severe hypocalcemia when high
    pretreatment turnover is abruptly shut off, so calcium must be monitored
    closely; pediatric use in particular demands caution. Does not reliably
    prevent retinopathy progression.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: denosumab
      term:
        id: NCIT:C61313
        label: Denosumab
  target_mechanisms:
  - target: Unopposed RANK-RANKL Osteoclastogenesis
    treatment_effect: INHIBITS
    description: Denosumab binds RANKL and prevents RANK engagement, replacing OPG's lost decoy function.
    evidence:
    - reference: PMID:23788687
      reference_title: Effects of RANK-ligand antibody (denosumab) treatment on bone turnover markers
        in a girl with juvenile Paget's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Alkaline phosphatase levels dropped within the normal range and remained at normal levels
        for 5 months after the final dose of denosumab.
      explanation: Demonstrates RANKL-antibody suppression of turnover (ALP normalisation) in JPD.
  evidence:
  - reference: PMID:23788687
    reference_title: Effects of RANK-ligand antibody (denosumab) treatment on bone turnover markers
      in a girl with juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: concomitant with the first injection, severe hypocalcemia developed, for which the patient
      was hospitalized and iv calcium supplementation was required for 13 days.
    explanation: Documents the severe-hypocalcemia hazard that governs pediatric denosumab dosing in JPD.
  - reference: PMID:40223037
    reference_title: Long-Term Denosumab Treatment in Adults with Juvenile Paget Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: long-term denosumab administration in adults with JPD, who had been previously treated
      with bisphosphonates, was safe and effective in terms of the skeletal disease, but it may not prevent
      the emergence of retinopathy.
    explanation: Establishes durable skeletal efficacy but persistent retinopathy risk despite treatment.
- name: Recombinant Osteoprotegerin (investigational)
  description: >-
    Direct protein replacement of the missing decoy receptor. In two adult
    siblings, once-weekly subcutaneous recombinant OPG suppressed bone resorption
    and increased bone mass over 15 months with only mild hypocalcemia/
    hypophosphatemia — proof of mechanism for OPG replacement, but never
    developed into an approved product (denosumab is the practical
    RANKL-pathway therapeutic).
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Loss of OPG Decoy Inhibition of RANKL
    treatment_effect: RESTORES
    description: Recombinant OPG restores the decoy-receptor sequestration of RANKL that the null genotype abolishes.
    evidence:
    - reference: PMID:16135836
      reference_title: Recombinant osteoprotegerin for juvenile Paget's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Bone resorption (assessed by N-telopeptide excretion) was suppressed by once-weekly
        subcutaneous doses of 0.3 to 0.4 mg per kilogram of body weight.
      explanation: Demonstrates that replacing OPG directly suppresses the resorptive drive.
  evidence:
  - reference: PMID:16135836
    reference_title: Recombinant osteoprotegerin for juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After 15 months of treatment, radial bone mass increased in one patient by 9 percent
      and in the other by 30 percent, skeletal bisphosphonate retention decreased by 37 percent and 55 percent, respectively
    explanation: Quantifies the bone-mass and resorption response to recombinant OPG replacement.
- name: Calcitonin (historical)
  description: >-
    An inhibitor of bone resorption used before bisphosphonates and denosumab
    became standard; now largely superseded but part of the historical treatment
    record.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcitonin
      term:
        id: CHEBI:3306
        label: calcitonin
  evidence:
  - reference: PMID:23788687
    reference_title: Effects of RANK-ligand antibody (denosumab) treatment on bone turnover markers
      in a girl with juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The treatment for JPD is challenging and has previously been based on administration of
      either calcitonin or bisphosphonates.
    explanation: Records calcitonin as a prior standard anti-resorptive for JPD.
- name: Anti-VEGF Intravitreal Therapy
  description: >-
    Intravitreal anti-vascular-endothelial-growth-factor agents (bevacizumab,
    aflibercept) for the choroidal neovascularisation that complicates JPD
    angioid-streak retinopathy — the ocular treatment arm. It targets the
    neovascular complication rather than the underlying bone disease, and is part
    of the ophthalmologic surveillance/management that continues independently of
    skeletal disease control. In the long-term denosumab cohort one subject with
    sudden vision loss had almost full visual recovery after intravitreal
    bevacizumab and aflibercept.

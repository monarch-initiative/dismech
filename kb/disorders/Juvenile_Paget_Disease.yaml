discussions:
- discussion_id: jpd-retinopathy-uncoupling
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does JPD retinopathy progress despite excellent skeletal disease control
    on anti-resorptive therapy, and is the ocular/vascular arm mechanistically
    uncoupled from the osteoclast axis that bisphosphonates and denosumab target?
  attaches_to:
  - pathophysiology#Ectopic Vascular and Bruch-Membrane Calcification
  - phenotypes#Angioid Streaks and Retinopathy
  rationale: >-
    In the long-term denosumab cohort, retinopathy progressed (including sudden
    vision loss requiring anti-VEGF therapy) despite normalised ALP and no new
    fractures. This suggests the Bruch-membrane/vascular calcification arm of OPG
    deficiency is at least partly independent of the RANKL-osteoclast axis, with
    direct implications for surveillance (ongoing ophthalmology regardless of
    skeletal control) and for whether RANKL-pathway therapy can ever prevent the
    ocular disease.
  evidence:
  - reference: PMID:40223037
    reference_title: Long-Term Denosumab Treatment in Adults with Juvenile Paget Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: long-term denosumab administration in adults with JPD, who had been previously treated
      with bisphosphonates, was safe and effective in terms of the skeletal disease, but it may not prevent
      the emergence of retinopathy.
    explanation: Documents the retinopathy-despite-skeletal-control observation motivating this question.
notes: >-
  Curated de novo (2026-09) from primary literature; a Claude Code deep-research
  report was used only as a lead list and every snippet was verified against a
  fetched reference. Distinct from adult Paget_Disease_of_Bone, which explicitly
  excludes JPD. Evidence base is almost entirely individual case reports and
  small series (~80 cases since 1956), so prevalence, natural-history, and
  treatment-response claims are case-series-level, not population-based. Two
  minority genetic causes (a dominant activating TNFRSF11A duplication and a de
  novo neomorphic SP7 variant) are recorded but not fully modelled in the
  pathograph, which centres the predominant TNFRSF11B/OPG-deficiency mechanism.
  Naming trap: JPD ("hyperphosphatasia", HIGH ALP) is the biochemical opposite of
  hypophosphatasia (ALPL, LOW ALP) — do not conflate.

inheritance:
- name: Autosomal recessive (TNFRSF11B/OPG deficiency, predominant form)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The great majority of JPD is autosomal-recessive OPG deficiency from
    homozygous or compound-heterozygous loss-of-function variants in TNFRSF11B,
    with consanguinity and geographic founder alleles (e.g. a Navajo homozygous
    deletion; a "Balkan" 966_969delTGACinsCTT indel) recurrent in the reported
    cohort. The genetically distinct minority forms — a heterozygous activating
    TNFRSF11A (RANK) duplication and a de novo heterozygous neomorphic SP7
    variant — behave dominantly and are recorded in the genetic section rather
    than here.
  evidence:
  - reference: PMID:12124406
    reference_title: Osteoprotegerin deficiency and juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Juvenile Paget's disease, an autosomal recessive osteopathy, is characterized
      by rapidly remodeling woven bone, osteopenia, fractures, and progressive skeletal deformity.
    explanation: The defining paper states the autosomal-recessive mode and the core skeletal
      phenotype of the predominant OPG-deficiency form.
  - reference: PMID:26762549
    reference_title: 'Auricular Ossification: A Newly Recognized Feature of Osteoprotegerin-Deficiency
      Juvenile Paget Disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autosomal recessive transmission of loss-of-function mutations within TNFRSF11B
      encoding OPG accounts for most JPD (JPD1). JPD2 results from heterozygous constitutive
      activation of TNFRSF11A encoding RANK.
    explanation: States both the recessive OPG-deficiency form (JPD1) and the dominant RANK-activation
      form (JPD2), supporting the genetic heterogeneity recorded here.
pathophysiology:
- name: Biallelic TNFRSF11B Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous or compound-heterozygous loss-of-function variants in TNFRSF11B
    (whole-gene/multi-exon deletions, splice, and ligand-binding-domain missense
    alleles) abolish or cripple secreted osteoprotegerin. The initiating lesion
    of the predominant form; the Whyte 2002 index Navajo patients carried a
    homozygous ~100 kb deletion and had undetectable circulating OPG.
  genetic_context:
    gene:
      preferred_term: TNFRSF11B
      term:
        id: hgnc:11909
        label: TNFRSF11B
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of OPG Decoy Inhibition of RANKL
    causal_link_type: DIRECT
  - target: Cochlear OPG Deficiency and Spiral Ganglion Degeneration
    causal_link_type: DIRECT
  - target: Ectopic Vascular and Bruch-Membrane Calcification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:12124406
    reference_title: Osteoprotegerin deficiency and juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both patients had a homozygous deletion of TNFRSF11B, with identical break points,
      on chromosome 8q24.2.
    explanation: Establishes the causal biallelic TNFRSF11B deletion in the index patients.
  - reference: PMID:12124406
    reference_title: Osteoprotegerin deficiency and juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that serum levels of osteoprotegerin and soluble osteoclast differentiation
      factor were undetectable and markedly increased, respectively.
    explanation: Confirms loss of the OPG protein product (undetectable serum OPG) with reciprocally
      elevated RANKL, the direct biochemical consequence of the null genotype.
  - reference: PMID:37180975
    reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutant OPG is unable to block osteoclastic resorption in a bone culture system,
      demonstrating that it is a loss-of-function mutation (Chong et al., 2003).
    explanation: Functional confirmation that the JPD-associated TNFRSF11B alleles act by loss of function.
- name: Loss of OPG Decoy Inhibition of RANKL
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Osteoprotegerin normally acts as a soluble decoy receptor that binds RANKL
    and prevents it from engaging RANK on osteoclast precursors. With OPG absent,
    RANKL is no longer sequestered and is free to drive RANK signalling — the
    single molecular switch that connects the genetic lesion to accelerated
    osteoclastogenesis.
  biological_processes:
  - preferred_term: negative regulation of bone resorption
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0045779
      label: negative regulation of bone resorption
  cell_types:
  - preferred_term: osteoblast (OPG source)
    term:
      id: CL:0000062
      label: osteoblast
  downstream:
  - target: Unopposed RANK-RANKL Osteoclastogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12124406
    reference_title: Osteoprotegerin deficiency and juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: osteoprotegerin suppresses bone turnover by functioning as a decoy receptor for
      osteoclast differentiation factor (also called RANK ligand).
    explanation: States OPG's decoy-receptor function whose loss defines this node.
  - reference: PMID:40775369
    reference_title: Juvenile Paget disease with unique compound heterozygous sequence variants
      in the TNFRSF11B gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: OPG is a soluble factor released from pre-osteoblasts and osteoblasts, which in complex
      with the osteoclast differentiation factor, also known as receptor activator of nuclear factor-kappa
      B ligand (RANKL)
    explanation: Independent statement of the OPG-RANKL decoy mechanism whose loss is the JPD lesion.
- name: Unopposed RANK-RANKL Osteoclastogenesis
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Free RANKL engages RANK on osteoclast precursors, driving markedly increased
    osteoclast differentiation. This is the step denosumab (an anti-RANKL
    antibody) targets, restoring pharmacologically the ligand neutralisation the
    missing OPG can no longer provide.
  biological_processes:
  - preferred_term: positive regulation of osteoclast differentiation
    modifier: INCREASED
    term:
      id: GO:0045672
      label: positive regulation of osteoclast differentiation
  cell_types:
  - preferred_term: osteoclast precursor (monocyte-macrophage lineage)
    term:
      id: CL:0000576
      label: monocyte
  downstream:
  - target: Accelerated Osteoclastic Bone Resorption
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22638612
    reference_title: 'Genotype-phenotype correlation in juvenile Paget disease: role of molecular
      alterations of the TNFRSF11B gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This gene encodes a soluble protein, the osteoprotegerin, which leads to uncontrolled
      osteoclastogenesis when mutated.
    explanation: States that loss of OPG produces uncontrolled osteoclastogenesis, the process of this node.
  - reference: PMID:23788687
    reference_title: Effects of RANK-ligand antibody (denosumab) treatment on bone turnover markers

genetic:
- name: TNFRSF11B
  gene_term:
    preferred_term: TNFRSF11B
    term:
      id: hgnc:11909
      label: TNFRSF11B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    TNFRSF11B (8q24.12) encodes osteoprotegerin (OPG). Biallelic loss-of-function
    variants — whole-gene/multi-exon deletions, splice variants (e.g. c.30+5G>A),
    ligand-binding-domain missense variants (e.g. c.329G>T p.Gly110Val),
    cysteine-residue missense, and small indels such as the "Balkan"
    966_969delTGACinsCTT — cause the predominant autosomal-recessive form.
    Homozygosity dominates; compound heterozygosity is rare. A strong
    genotype-phenotype gradient runs from severe (large deletions,
    ligand-binding-domain cysteine missense; deformity before 18 months) to mild
    (an exon-5 indel). Founder alleles include a Navajo homozygous deletion and
    the Balkan indel. The functional consequence (loss of function) is recorded
    on the pathophysiology genetic_context.
  evidence:
  - reference: PMID:12124406
    reference_title: Osteoprotegerin deficiency and juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Juvenile Paget's disease can result from osteoprotegerin deficiency caused by homozygous
      deletion of TNFRSF11B.
    explanation: Establishes TNFRSF11B (OPG) as the causal gene of the predominant form.
  - reference: PMID:22638612
    reference_title: 'Genotype-phenotype correlation in juvenile Paget disease: role of molecular
      alterations of the TNFRSF11B gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: JPD is characterized by a strong genotype-phenotype correlation, so depending on the
      alteration of the TNFRSN11B gene, the phenotype is variable.
    explanation: States the TNFRSF11B genotype-phenotype correlation summarised in the notes (the
      quoted sentence carries the source's own TNFRSN11B typo).
- name: TNFRSF11A
  gene_term:
    preferred_term: TNFRSF11A
    term:
      id: hgnc:11908
      label: TNFRSF11A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    A genetically distinct minority cause. A single reported patient with no
    TNFRSF11B mutation carried a heterozygous 15-bp in-frame tandem duplication
    (87dup15) in exon 1 of TNFRSF11A, predicting the same signal-peptide
    extension of RANK that causes expansile skeletal hyperphosphatasia — i.e. a
    gain-of-function RANK lesion phenocopying OPG loss through the shared
    pathway. Dominant-acting; contrast with the recessive TNFRSF11B form.
  evidence:
  - reference: PMID:25063546
    reference_title: Juvenile Paget's disease with heterozygous duplication within TNFRSF11A encoding RANK.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a unique heterozygous 15-bp insertional tandem duplication (87dup15) within exon 1 of
      TNFRSF11A predicted the same pentapeptide extension of RANK that causes expansile skeletal hyperphosphatasia (84dup15).
    explanation: Documents the activating TNFRSF11A duplication as an alternative JPD cause.
- name: SP7
  gene_term:
    preferred_term: SP7
    term:
      id: hgnc:17321
      label: SP7
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    A third, genetically distinct cause reported in a single patient. A de novo
    heterozygous missense variant (c.926C>G; p.Ser309Trp) in SP7, encoding the
    osteoblast master transcription factor osterix, was identified after no
    TNFRSF11A/B defect was found, and produces a high-turnover JPD phenotype
    through an altered/neomorphic mechanism in the osteoblast rather than direct
    RANK-RANKL disruption. Note SP7 is pleiotropic: separate biallelic
    loss-of-function SP7 variants cause a low-turnover osteogenesis imperfecta,
    so mechanism — not the gene alone — determines the direction of bone
    turnover. Dominant, de novo.
  evidence:
  - reference: PMID:32298837
    reference_title: Juvenile Paget's Disease From Heterozygous Mutation of SP7 Encoding Osterix
      (Specificity Protein 7, Transcription Factor SP7).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'trio exome sequencing revealed a de novo heterozygous missense mutation (c.926C>G; p.S309W)
      within SP7 encoding the osteoblast transcription factor osterix'
    explanation: Identifies the de novo SP7 variant in a patient with JPD.
  - reference: PMID:32298837
    reference_title: Juvenile Paget's Disease From Heterozygous Mutation of SP7 Encoding Osterix
      (Specificity Protein 7, Transcription Factor SP7).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thus, mutation of SP7 represents a third genetic cause of JPD.
    explanation: Establishes SP7 as the third reported causal gene, supporting the description's claim.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. Approximately 80 cases have been reported worldwide since the
    disease was first described in 1956; no registry-based prevalence exists, so
    this is a literature-count estimate read as case-series-level evidence. A
    numeric rate_per_100000 is deliberately omitted: the modelled "<1 in 10
    million" figure is an order-of-magnitude estimate, not a measured population
    rate, so prevalence_class BELOW_1_IN_1000000 carries the claim instead.
  evidence:
  - reference: PMID:40775369
    reference_title: Juvenile Paget disease with unique compound heterozygous sequence variants
      in the TNFRSF11B gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Approximately 80 cases of JPD have been described worldwide since 1956
    explanation: Gives the literature case count that grounds the ultra-rare classification.
progression:
- phase: Infantile/childhood onset with lifelong progressive high-turnover disease
  age_range: Infancy to early childhood onset; progressive through the adolescent growth spurt
  notes: >-
    JPD presents in infancy or early childhood with fractures and deformity and,
    untreated, progresses through the growth years; severe forms carry high
    morbidity and can be fatal in childhood or young adulthood. Early
    anti-resorptive treatment halts deformity/fracture progression; there is no
    spontaneous remission, and turnover relapses if bisphosphonate therapy is
    stopped. Extraskeletal disease (retinopathy, vascular) can progress even
    under good skeletal control.
  evidence:
  - reference: PMID:32298837
    reference_title: Juvenile Paget's Disease From Heterozygous Mutation of SP7 Encoding Osterix
      (Specificity Protein 7, Transcription Factor SP7).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: present in infancy or early childhood as fractures and deformity hallmarked biochemically
      by marked elevation of serum alkaline phosphatase (ALP) activity
    explanation: States the infantile/early-childhood onset and the fracture/deformity presentation.
  - reference: PMID:32298837
    reference_title: Juvenile Paget's Disease From Heterozygous Mutation of SP7 Encoding Osterix
      (Specificity Protein 7, Transcription Factor SP7).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Untreated, JPD can kill during childhood or young adult life.
    explanation: States the progressive, potentially fatal untreated course.
biochemical:
- name: Serum alkaline phosphatase (total)
  presence: Increased
  context: >-
    Grossly elevated total serum ALP is the cardinal biochemical marker of JPD
    disease extent/activity, reflecting the accelerated osteoblastic response to
    high-turnover bone. Often >10-15x the upper limit of normal at diagnosis;
    used to titrate anti-resorptive therapy. Urinary collagen cross-links and
    P1NP/BAP/beta-CrossLaps corroborate the high-turnover state.
  biomarker_term:
    preferred_term: Serum Alkaline Phosphatase Measurement
    term:
      id: NCIT:C61016
      label: Serum Alkaline Phosphatase Measurement
  reference_ranges:
  - loinc_term:
      id: LOINC:6768-6
      label: Alkaline phosphatase [Enzymatic activity/volume] in Serum or Plasma
    lower_bound: 25.0
    upper_bound: 120.0
    unit: IU/L
    population: adults (assay-specific normal range as reported in the cited JPD cohort)
    notes: >-
      Adult reference interval 25-120 IU/l as stated for the long-term denosumab
      JPD cohort; off-treatment JPD ALP in that cohort ran 630-2500 IU/l, i.e.
      roughly 5-20x the upper limit.
    evidence:
    - reference: PMID:40223037
      reference_title: Long-Term Denosumab Treatment in Adults with Juvenile Paget Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Off treatment, ALP was 1300–2500 IU/l (reference range 25–120 IU/l).
      explanation: Provides both the adult ALP reference interval and the magnitude of the JPD elevation.
    interpretation_bands:
    - name: Normal
      lower_bound: 25.0
      upper_bound: 120.0
      unit: IU/L
      abnormal_flag: NORMAL
    - name: Elevated (JPD activity range)
      lower_bound: 120.0
      unit: IU/L
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: Elevated circulating alkaline phosphatase concentration
        term:
          id: HP:0003155
          label: Elevated circulating alkaline phosphatase concentration
      interpretation: >-
        Values above the upper reference limit indicate active high-turnover bone
        disease; untreated JPD characteristically runs many multiples of the ULN.
  evidence:
  - reference: PMID:40223037
    reference_title: Long-Term Denosumab Treatment in Adults with Juvenile Paget Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Accelerated bone turnover as assessed by biochemical markers, such as alkaline phosphatase
      (ALP), can be suppressed by bisphosphonate treatment, but it relapses if bisphosphonate treatment is discontinued.
    explanation: Establishes ALP as the activity marker that tracks (and relapses with) turnover in JPD.
diagnosis:
- name: Molecular genetic testing of TNFRSF11B (with deletion/CNV analysis)
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    First-tier confirmatory test is sequencing of TNFRSF11B. Crucially, several
    families — including the index Navajo kindred — carry homozygous whole-gene
    or multi-exon deletions of TNFRSF11B that Sanger/exon sequencing alone will
    miss, so copy-number/deletion (CNV) analysis must accompany sequencing.
    TNFRSF11A and SP7 are second-tier for TNFRSF11B-negative cases.
  evidence:
  - reference: PMID:12124406
    reference_title: Osteoprotegerin deficiency and juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both patients had a homozygous deletion of TNFRSF11B, with identical break points,
      on chromosome 8q24.2.
    explanation: The disease-causing lesion is a whole-gene deletion, establishing why CNV/deletion
      analysis must accompany sequencing rather than sequencing alone.
- name: Skeletal radiography
  diagnosis_term:

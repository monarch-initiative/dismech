name: Juvenile Paget Disease
creation_date: '2026-09-04T00:00:00Z'
category: Complex
description: >-
  Juvenile Paget disease (JPD; OMIM #239000, "Paget disease of bone 5,
  juvenile-onset"; ORPHA:2801) is an ultra-rare, autosomal-recessive osteopathy
  of infancy and early childhood, most often caused by biallelic loss of
  osteoprotegerin (OPG), the secreted decoy receptor encoded by TNFRSF11B that
  normally sequesters RANKL and restrains osteoclastogenesis. With the OPG brake
  removed, RANK-RANKL signalling runs unopposed, osteoclasts are grossly
  increased in number and activity, and the whole skeleton remodels at a rate it
  is not built for. Coupled osteoblastic formation cannot keep pace in an orderly
  way, so resorbed bone is replaced by disorganised woven bone; the child
  develops generalised osteopenia, progressive long-bone bowing and fractures,
  macrocephaly and skull-base hyperostosis, and grossly elevated serum alkaline
  phosphatase (the name "hereditary/idiopathic hyperphosphatasia" records that
  laboratory signature).

  Two contrasts anchor the entry. First, JPD is emphatically NOT adult Paget
  disease of bone (curated separately as Paget_Disease_of_Bone). Adult PDB is a
  focal, late-onset, usually SQSTM1-associated disorder of a handful of lesions;
  JPD is a generalised, whole-skeleton process of childhood driven by a
  different gene through the same RANK-RANKL-OPG axis. The adult entry
  explicitly cites loss of OPG causing JPD as the cleanest evidence that this
  axis is the centre of gravity of pagetic biology; this entry does not
  reproduce the adult disease. Second, JPD is genetically heterogeneous: while
  biallelic TNFRSF11B loss of function is the predominant cause, a heterozygous
  activating duplication in TNFRSF11A (RANK) and a de novo neomorphic SP7
  (Osterix) variant have each been reported to produce a JPD phenotype through
  convergent high-turnover biology, so the disease is not inheritance-uniform
  across its causal genes.

  The extraskeletal disease is where OPG's non-osteoclastic roles surface, and
  it is partly uncoupled from bone. Sensorineural hearing loss reflects a direct
  cochlear requirement for OPG (spiral-ganglion degeneration), layered on
  conductive loss from ossicular resorption; progressive retinopathy with
  angioid streaks and a vasculopathy with arterial calcification and aneurysms
  reflect OPG's vascular role. Anti-resorptive therapy (bisphosphonates
  first-line; the RANKL antibody denosumab as a direct pathophysiologic mimic of
  the missing protein, with careful calcium monitoring) controls the skeletal
  disease well but does not reliably prevent the retinopathy, an important
  prognostic caveat.

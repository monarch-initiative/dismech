  evidence:
  - reference: PMID:20547946
    reference_title: Ocular manifestations of juvenile Paget disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Participants underwent ophthalmic examinations consisting of at least best-corrected Snellen

    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12124406
    reference_title: Osteoprotegerin deficiency and juvenile Paget's disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Juvenile Paget's disease, an autosomal recessive osteopathy, is characterized by
      rapidly remodeling woven bone, osteopenia, fractures, and progressive skeletal deformity.
    explanation: States the rapidly remodelling woven bone that is the tissue-level signature of this node.
- name: Generalized High-Turnover Osteopathy
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The whole-skeleton, high-turnover disease state: osteopenic, mechanically
    inferior woven bone that bows, fractures, expands the calvarium and skull
    base, and spills grossly elevated alkaline phosphatase into serum. Downstream
    are the clinical manifestations and the ALP laboratory signature.
  downstream:
  - target: Progressive Long-Bone Deformity
    causal_link_type: DIRECT
  - target: Recurrent Fractures
    causal_link_type: DIRECT
  - target: Bone Pain
    causal_link_type: DIRECT
  - target: Short Stature
    causal_link_type: DIRECT

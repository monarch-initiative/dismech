    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: JPD can be caused by loss of function of osteoprotegerin, resulting in subsequent stimulation
      of osteoclasts via the receptor activator of nuclear factor-κB (RANK) pathway.
    explanation: Names the RANK-pathway stimulation of osteoclasts that this node captures.
- name: Accelerated Osteoclastic Bone Resorption
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Excess, hyperactive osteoclasts resorb bone throughout the skeleton at a
    grossly accelerated rate. In the OPG-null mouse this is directly observed as
    numerous osteoclasts with rapidly remodelling bone, recapitulating the human
    disease.
  biological_processes:
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  cell_types:

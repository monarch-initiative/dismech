  description: >-
    Generalised (not focal) radiographic disease: osteopenic/osteosclerotic long
    bones with cortical thickening (hyperostosis), coarse trabeculation, calvarial
    and skull-base thickening; the generalised distribution distinguishes JPD from
    the focal lesions of adult Paget disease.
  evidence:
  - reference: PMID:40775369
    reference_title: Juvenile Paget disease with unique compound heterozygous sequence variants
      in the TNFRSF11B gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a diffuse modeling disorder in long bones, presenting as extremely thickened cortical bone

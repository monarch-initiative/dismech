    explanation: Describes the characteristic generalised radiographic modelling disorder.
- name: Bone turnover markers
  diagnosis_term:
    preferred_term: laboratory measurement of bone turnover markers
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  markers: >-
    Serum alkaline phosphatase (cardinal), urinary pyridinoline/deoxypyridinoline

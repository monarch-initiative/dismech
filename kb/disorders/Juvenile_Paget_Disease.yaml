    causal_link_type: DIRECT
  - target: Generalized High-Turnover Osteopathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16564235
    reference_title: Resorption of auditory ossicles and hearing loss in mice lacking osteoprotegerin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Osteoclastic bone resorption is enhanced in Opg(-/-) mice lacking osteoprotegerin,
      which is a soluble decoy receptor for the osteoclastogenic cytokine RANKL.
    explanation: The OPG-null mouse directly demonstrates enhanced osteoclastic resorption on loss of the decoy receptor.
  - reference: PMID:25063546
    reference_title: Juvenile Paget's disease with heterozygous duplication within TNFRSF11A encoding RANK.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histopathology showed accelerated remodeling with abundant osteoclasts.
    explanation: Human bone histology confirming abundant osteoclasts and accelerated remodelling.
- name: Compensatory Disorganized Woven-Bone Formation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Coupled osteoblastic formation increases in response to the resorptive drive
    but cannot organise, so resorbed bone is replaced by structurally
    disorganised woven bone rather than mature lamellar bone across the whole
    skeleton — the generalised (not focal) counterpart of the adult pagetic
    mosaic.
  biological_processes:
  - preferred_term: ossification (disorganized, woven)
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  downstream:

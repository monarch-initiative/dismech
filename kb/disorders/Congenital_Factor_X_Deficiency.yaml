  evidence:
  - reference: PMID:16919077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "haemarthrosis (33%)"
    explanation: >-
      Reports haemarthrosis frequency among symptomatic subjects.
  - reference: PMID:26222694

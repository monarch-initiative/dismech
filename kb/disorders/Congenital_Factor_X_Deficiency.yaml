genetic:
- name: F10
  gene_term:
    preferred_term: F10
    term:
      id: hgnc:3528
      label: F10
  relationship_type: CAUSATIVE
  notes: >-
    F10 lies at the telomeric end of chromosome 13q, immediately adjacent to F7.
    That adjacency is clinically relevant: a large terminal deletion can remove
    both loci and produce combined factor VII and factor X deficiency, which is a
    different entity from isolated factor X deficiency and is reached by a
    different genetic mechanism. Allelic heterogeneity is high and no single
    founder variant dominates worldwide, though regional recurrence is reported.
    The protein has four domains - a Gla domain, two EGF-like domains and a serine
    protease domain - and pathogenic variants are distributed across all of them,
    which is part of why domain location alone does not predict severity.
  evidence:
  - reference: PMID:16919077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-nine different causative mutations, including 15 novel mutations, were analysed."
    explanation: >-
      Establishes allelic heterogeneity at the causative locus.
  - reference: PMID:25582404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The F7 and F10 genes are located on the long arm of chromosome 13."
    explanation: >-
      Supports the locus assignment and the adjacency to F7 described in the
      notes.
  - reference: PMID:25582404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In four patients, the combined deficiency was due to a large deletion within the terminal end of chromosome 13."
    explanation: >-
      Documents the contiguous-deletion mechanism that produces combined FVII/FX
      deficiency rather than isolated factor X deficiency.
  - reference: PMID:26222694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.Gly262Asp missense mutation was identified in 11 of the 12 patients in this study."
    explanation: >-
      A regional recurrent variant, which is the qualification to the allelic
      heterogeneity recorded in the notes.
  - reference: PMID:35059555
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coagulation factor X (FX), often termed as Stuart-Prower factor, is a plasma glycoprotein composed of the \u03b3-carboxyglutamic acid (GLA) domain, two epidermal growth factor domains (EGF-1 and EGF-2), and the serine protease (SP) domain."
    explanation: >-
      States the four-domain architecture described in the notes.
  - reference: PMID:35059555
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, 149 are point variants (of which 128 are missense), 22 are deletions, 3 are insertions, and 6 are polymorphisms."
    explanation: >-
      Quantifies the variant spectrum across 180 distinct F10 variants, showing
      the predominance of missense change recorded in the notes.
  - reference: PMID:30507709
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified 22 separate mutations, including 15 missense mutations, 2 deletions, 4 splice site mutations, and 1 nonsense mutation"
    explanation: >-
      An independent multicentre cohort showing the same mixed spectrum with
      missense predominance.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.15
  rate_low: 0.1
  rate_high: 0.2
  rate_denominator: POPULATION
  notes: >-
    Reported as 1 in 500,000 to 1 in 1,000,000, which normalises to 0.1-0.2 per
    100,000. The point estimate recorded here is the midpoint of that range; the
    range itself is carried in rate_low and rate_high.
  evidence:
  - reference: PMID:29707881
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary factor X (FX) deficiency (FXD) affects 1:500 000-1:1 000 000 people worldwide."
    explanation: >-
      States the worldwide frequency range normalised in this record.
  - reference: PMID:16919077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inherited factor X deficiency (FXD) is a rare (1:1,000,000) recessive bleeding disorder."
    explanation: >-
      An independent statement of frequency at the lower-frequency end of the
      range.
diagnosis:
- name: Coagulation screen with factor-specific assay
  description: >-
    Simultaneous prolongation of the prothrombin time and the activated partial
    thromboplastin time prompts single-factor assays. Factor X coagulant activity
    establishes the diagnosis; factor X antigen measured alongside it separates
    type I from type II. Because a prolonged prothrombin time with a normal
    activated partial thromboplastin time can still conceal combined FVII/FX
    deficiency, single-factor activities should be measured in any case with a
    prolonged prothrombin time.
  evidence:
  - reference: PMID:25582404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To avoid a misdiagnosis of combined FVII/FX deficiency, analyses of single factor activities have to be performed in all cases with prolonged PT even if aPTT is normal."
    explanation: >-
      States the diagnostic rule this record recommends, and the misdiagnosis it
      is designed to prevent.
- name: F10 sequencing
  description: >-
    Confirms the diagnosis, establishes the inheritance pattern for counselling,
    and distinguishes isolated factor X deficiency from a contiguous 13q deletion
    involving F7. Multiplex ligation-dependent probe amplification is needed
    alongside sequencing to detect large heterozygous deletions.
  evidence:
  - reference: PMID:25582404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses included direct sequencing of the F7 and F10 genes and MLPA (multiplex ligation-dependent probe amplification) for detection of heterozygous large deletions."
    explanation: >-
      States the two assays needed, and why sequencing alone is not sufficient.
  - reference: PMID:25582404
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses are substantial for correct prediction of an inheritance pattern and a proper genetic counselling."
    explanation: >-
      States the role of genetic analysis in establishing inheritance and
      counselling.
treatments:
- name: Plasma-derived factor X concentrate
  description: >-
    High-purity human plasma-derived factor X concentrate, the first single-factor
    replacement therapy licensed specifically for hereditary factor X deficiency.
    It is the preferred replacement product because, unlike plasma or prothrombin
    complex concentrate, its factor X content is specified.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: factor X replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human coagulation factor X
      term:
        id: NCIT:C82272
        label: Coagulation Factor X Human
  target_mechanisms:
  - target: Reduced Functional Plasma Factor X
    description: >-
      Replacement restores circulating functional factor X, and so restores the
      substrate for prothrombinase assembly. The treatment acts at the node
      immediately downstream of the genetic lesion, not on the lesion itself.
  evidence:
  - reference: PMID:27797267
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To meet the need for a single-factor replacement therapy specifically for use in FX-deficient patients, a high-purity, high-potency, human plasma-derived FX concentrate (pdFX; Coagadex®; Bio Products Laboratory, Elstree, UK) has been developed and approved for treatment of perioperative bleeding and on-demand treatment in FX-deficient patients."
    explanation: >-
      Establishes the agent, its indication and its regulatory approval.
  - reference: PMID:29707881
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At end of study, investigators rated pdFX efficacy excellent for all subjects."
    explanation: >-
      Prospective phase 3 efficacy result in children under 12, the age group for
      which data were previously lacking. Investigator-rated rather than blinded,
      in nine subjects.
  - reference: PMID:34024682
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current recommendations advise clinicians to use single-factor replacement therapy for hereditary disease rather than multifactor therapies such as fresh frozen plasma, cryoprecipitate, and prothrombin complex concentrates."
    explanation: >-
      Supports the preference for single-factor replacement over the multifactor
      alternatives recorded below.
- name: Prophylactic factor X replacement
  description: >-
    Regular replacement dosed to keep trough factor X activity above a threshold,
    rather than treating bleeds as they occur. In the paediatric phase 3 study
    doses were adjusted to maintain trough activity above 5 IU/dL.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: prophylactic factor X replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human coagulation factor X
      term:
        id: NCIT:C82272
        label: Coagulation Factor X Human
  target_mechanisms:
  - target: Systemic Bleeding Tendency
    description: >-
      Maintaining a trough activity level above the bleeding threshold prevents
      bleeding episodes rather than treating them.
  evidence:
  - reference: PMID:29707881
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects aged <12 years with basal plasma FX activity (FX:C) <5 IU/dL received pdFX as prophylactic and on-demand treatment, with doses adjusted to maintain FX:C > 5 IU/dL."
    explanation: >-
      States the prophylactic regimen and the trough target it is dosed to.
  - reference: PMID:29707881
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trough FX:C levels remained >5 IU/dL for all subjects after the last dose adjustment study visit."
    explanation: >-
      Reports that the trough target was achieved in every subject.
- name: Prothrombin complex concentrate
  description: >-
    A multifactor product containing factor X alongside the other vitamin
    K-dependent factors. Current guidance prefers single-factor replacement where
    it is available, but prothrombin complex concentrate remains in use, including
    as regular replacement where it is the accessible option.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: prothrombin complex concentrate therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: four-factor prothrombin complex concentrate
      term:
        id: NCIT:C208347
        label: Four-factor Prothrombin Complex Concentrate
  target_mechanisms:
  - target: Reduced Functional Plasma Factor X
    description: >-
      Supplies factor X, though at a concentration the product specification may
      not state.
  evidence:
  - reference: PMID:31667683
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following continued regular replacement of 500 units of PPSB-HT once per week, the proband has exhibited no bleeding tendencies and no new bruises have been observed."
    explanation: >-
      A single-patient outcome under regular prothrombin complex concentrate
      replacement. This is one uncontrolled case, and the authors present it as a
      first report rather than as established practice.
  - reference: PMID:27797267
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, treatment options for hereditary FX deficiency were limited mostly to products that may not specify FX content (i.e. fresh frozen plasma and prothrombin complex concentrates) and that have associated safety concerns."
    explanation: >-
      Cuts against prothrombin complex concentrate as a preferred option, on the
      grounds of unspecified factor X content and safety concerns. Recorded as
      REFUTE against this treatment rather than dropped, because the same sentence
      is the reason single-factor replacement is now recommended.
- name: Fresh frozen plasma
  description: >-
    The historical option, still used where no concentrate is available. It carries
    the same unspecified-content problem as prothrombin complex concentrate, plus
    volume load and transfusion reaction risk.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fresh frozen plasma transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Reduced Functional Plasma Factor X
    description: >-
      Supplies factor X in unpurified form along with all other plasma proteins.
  notes: >-
    Two binding decisions here, both forced and both recorded rather than worked
    around. The treatment_term binds the clinical action (transfusion) rather than
    the product, because the product term is a substance and is not reachable from
    NCIT:C25218 Clinical Intervention or Procedure. And therapeutic_agent is left
    absent: NCIT:C89783 Fresh Frozen Plasma is the exact term for the product, but
    therapeutic_agent has range ChemicalEntityDescriptor and that CURIE is not a
    member of the ChemicalEntityTerm dynamic enum, so binding it fails term
    validation. Plasma is a blood component, not a chemical entity. The product
    identity is carried in preferred_term and in this note rather than bound to a
    term that does not fit.
  evidence:
  - reference: PMID:35958882
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was re-hospitalized to remove a wisdom tooth, during which fresh frozen plasma was administered."
    explanation: >-
      Documents fresh frozen plasma used as perioperative cover where concentrate
      was unavailable. Marked INDIRECT because the case reports the practice, not
      a measured haemostatic benefit.
  - reference: PMID:35958882
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "An allergic reaction complicated this procedure in the form of a rash on the body."
    explanation: >-
      Records a transfusion reaction in the same patient, which is part of why
      plasma is no longer the preferred option.
  - reference: PMID:34024682
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Current recommendations advise clinicians to use single-factor replacement therapy for hereditary disease rather than multifactor therapies such as fresh frozen plasma, cryoprecipitate, and prothrombin complex concentrates."
    explanation: >-
      Current guidance recommends against fresh frozen plasma where single-factor
      replacement is available.
discussions:
- discussion_id: fx_activity_severity_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is residual factor X activity such a poor predictor of bleeding severity
    in this disease?
  attaches_to:
  - pathophysiology#Systemic Bleeding Tendency
  rationale: >-
    A single non-redundant enzymatic step with a quantifiable residual activity
    ought to give a clean dose-response relationship with bleeding, and it does
    not. The largest genotyped cohort states outright that clinical and laboratory
    phenotypes are poorly correlated. Candidate explanations include modifying
    variation elsewhere in the haemostatic system, the insensitivity of one-stage
    clotting assays to the thrombin-generation capacity that actually matters, and
    the small patient numbers available in a disorder this rare. Which of these
    dominates is unresolved, and it bears directly on whether a one-stage
    laboratory value should be used to set a prophylaxis threshold.
  evidence:
  - reference: PMID:16919077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical and laboratory phenotypes of FXD are poorly correlated and few regional studies on the genotype and the clinical manifestations of FXD are known."
    explanation: >-
      States the discordance this gap is about, and names the scarcity of regional
      studies as part of the problem.
- discussion_id: fx_treatment_threshold_consensus
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a consensus treatment threshold across the severity spectrum?
  attaches_to:
  - treatments#
  rationale: >-
    A trough factor X activity above 5 IU/dL was the target in the paediatric
    prophylaxis study, but that figure comes from one open-label trial in nine
    children. The most recent comprehensive review says explicitly that consensus
    in treatment guidelines is still needed across the spectrum of disease
    severity, so the threshold used in practice is not a settled number.
  evidence:
  - reference: PMID:34024682
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consensus in treatment guidelines is still urgently needed to ensure optimal management of patients with factor X deficiency across the spectrum of disease severity."
    explanation: >-
      States that treatment guidance is not yet settled across severity strata.

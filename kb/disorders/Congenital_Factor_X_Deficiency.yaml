genetic:
- name: F10
  gene_term:
    preferred_term: F10
    term:
      id: hgnc:3528
      label: F10
  relationship_type: CAUSATIVE
  notes: >-
    F10 lies at the telomeric end of chromosome 13q, immediately adjacent to F7.
    That adjacency is clinically relevant: a large terminal deletion can remove
    both loci and produce combined factor VII and factor X deficiency, which is a
    different entity from isolated factor X deficiency and is reached by a
    different genetic mechanism. Allelic heterogeneity is high and no single
    founder variant dominates worldwide, though regional recurrence is reported.
    The protein has four domains - a Gla domain, two EGF-like domains and a serine
    protease domain - and pathogenic variants are distributed across all of them,
    which is part of why domain location alone does not predict severity.
  evidence:
  - reference: PMID:16919077
    reference_title: "Factor X deficiency: clinical manifestation of 102 subjects from Europe and Latin America with mutations in the factor 10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-nine different causative mutations, including 15 novel mutations, were analysed."
    explanation: >-
      Establishes allelic heterogeneity at the causative locus.
  - reference: PMID:25582404
    reference_title: "Congenital combined deficiency of coagulation factors VII and X--different genetic mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The F7 and F10 genes are located on the long arm of chromosome 13."
    explanation: >-
      Supports the locus assignment and the adjacency to F7 described in the
      notes.
  - reference: PMID:25582404
    reference_title: "Congenital combined deficiency of coagulation factors VII and X--different genetic mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In four patients, the combined deficiency was due to a large deletion within the terminal end of chromosome 13."
    explanation: >-
      Documents the contiguous-deletion mechanism that produces combined FVII/FX
      deficiency rather than isolated factor X deficiency.
  - reference: PMID:26222694
    reference_title: "Frequency of the p.Gly262Asp mutation in congenital Factor X deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.Gly262Asp missense mutation was identified in 11 of the 12 patients in this study."
    explanation: >-
      A regional recurrent variant, which is the qualification to the allelic
      heterogeneity recorded in the notes.
  - reference: PMID:35059555
    reference_title: "Analysis of 180 Genetic Variants in a New Interactive FX Variant Database Reveals Novel Insights into FX Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coagulation factor X (FX), often termed as Stuart-Prower factor, is a plasma glycoprotein composed of the \u03b3-carboxyglutamic acid (GLA) domain, two epidermal growth factor domains (EGF-1 and EGF-2), and the serine protease (SP) domain."
    explanation: >-
      States the four-domain architecture described in the notes.
  - reference: PMID:35059555
    reference_title: "Analysis of 180 Genetic Variants in a New Interactive FX Variant Database Reveals Novel Insights into FX Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, 149 are point variants (of which 128 are missense), 22 are deletions, 3 are insertions, and 6 are polymorphisms."
    explanation: >-
      Quantifies the variant spectrum across 180 distinct F10 variants, showing
      the predominance of missense change recorded in the notes.
  - reference: PMID:30507709
    reference_title: "Genotype analysis and identification of novel mutations in a multicentre cohort of patients with hereditary factor X deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified 22 separate mutations, including 15 missense mutations, 2 deletions, 4 splice site mutations, and 1 nonsense mutation"
    explanation: >-
      An independent multicentre cohort showing the same mixed spectrum with
      missense predominance.
biochemical:
- name: Factor X coagulant activity (FX:C)
  biomarker_term:
    preferred_term: factor X coagulant activity
  presence: DECREASED
  readouts:
  - target: Reduced Functional Plasma Factor X
    relationship: READOUT_OF
    description: >-
      FX:C measures the functional consequence of the genetic lesion at the level
      of circulating protein activity.
  reference_ranges:
  - lower_bound: 50.0
    upper_bound: 150.0
    unit: IU/dL
    population: healthy adults
    interpretation_bands:
    - name: Severe deficiency
      upper_bound: 1.0
      unit: "% of normal FX:C"
      abnormal_flag: CRITICAL_LOW
      severity: SEVERE
    - name: Moderate deficiency
      lower_bound: 1.0
      upper_bound: 6.0
      unit: "% of normal FX:C"
      abnormal_flag: LOW
      severity: MODERATE
    - name: Mild deficiency
      lower_bound: 6.0
      upper_bound: 10.0
      unit: "% of normal FX:C"
      abnormal_flag: LOW
      severity: MILD
    notes: >-
      Two things are recorded deliberately. First, the normal interval is quoted in
      IU/dL while the source states the severity strata as a percentage of normal
      FX:C, so the bands carry their own unit rather than being silently converted.
      Second, the source's strata are integer bands with an implicit gap between 5%
      and 6%; that gap is the source's own discretization and is not closed here.
    evidence:
    - reference: PMID:35059555
      reference_title: "Analysis of 180 Genetic Variants in a New Interactive FX Variant Database Reveals Novel Insights into FX Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FX:C in healthy human plasma ranges from 50 to 150 IU/dL."
      explanation: >-
        Source for the normal reference interval.
    - reference: PMID:35059555
      reference_title: "Analysis of 180 Genetic Variants in a New Interactive FX Variant Database Reveals Novel Insights into FX Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mildly deficient patients have 6 to 10% of normal FX:C, moderately deficient patients 1 to 5% and severely deficient patients"
      explanation: >-
        Source for the three severity bands. The quote stops where the cached
        extraction breaks the sentence: the trailing "<1%." for the severe stratum
        sits on the following line of the cache file, so quoting further would not
        be an exact substring.
  notes: >-
    The plasma factor X coagulant activity assay, which both establishes the
    diagnosis and defines the conventional severity strata for this disorder.
    biomarker_term is left unbound. There is no factor X activity measurement term
    in the local NCIT cache (it holds Factor XIII Measurement and Factor XIII
    Activity Measurement, but no factor X counterpart), and a CURIE is never
    written without reading it from a source in the same step.
  evidence:
  - reference: PMID:34024682
    reference_title: "Diagnosis, therapeutic advances, and key recommendations for the management of factor X deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The typology and severity of the associated bleeding symptoms are highly heterogeneous, adding to the difficulties of diagnosis and management."
    explanation: >-
      Records why the severity strata above matter clinically and why they are not
      a reliable predictor of bleeding on their own, which is the point the
      fx_activity_severity_discordance knowledge gap makes.


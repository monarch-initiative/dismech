    range itself is carried in rate_low and rate_high.
  evidence:
  - reference: PMID:29707881
    reference_title: "Prophylactic treatment of bleeding episodes in children <12 years with moderate to severe hereditary factor X deficiency (FXD): Efficacy and safety of a high-purity plasma-derived factor X (pdFX) concentrate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary factor X (FX) deficiency (FXD) affects 1:500 000-1:1 000 000 people worldwide."
    explanation: >-
      States the worldwide frequency range normalised in this record.
  - reference: PMID:16919077
    reference_title: "Factor X deficiency: clinical manifestation of 102 subjects from Europe and Latin America with mutations in the factor 10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inherited factor X deficiency (FXD) is a rare (1:1,000,000) recessive bleeding disorder."
    explanation: >-
      An independent statement of frequency at the lower-frequency end of the

- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.15
  rate_low: 0.1
  rate_high: 0.2
  rate_denominator: POPULATION
  notes: >-
    Reported as 1 in 500,000 to 1 in 1,000,000, which normalises to 0.1-0.2 per

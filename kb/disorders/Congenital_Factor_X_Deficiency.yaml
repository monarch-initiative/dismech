diagnosis:
- name: Coagulation screen with factor-specific assay
  description: >-
    Simultaneous prolongation of the prothrombin time and the activated partial
    thromboplastin time prompts single-factor assays. Factor X coagulant activity
    establishes the diagnosis; factor X antigen measured alongside it separates
    type I from type II. Because a prolonged prothrombin time with a normal
    activated partial thromboplastin time can still conceal combined FVII/FX
    deficiency, single-factor activities should be measured in any case with a
    prolonged prothrombin time.
  evidence:
  - reference: PMID:25582404
    reference_title: "Congenital combined deficiency of coagulation factors VII and X--different genetic mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To avoid a misdiagnosis of combined FVII/FX deficiency, analyses of single factor activities have to be performed in all cases with prolonged PT even if aPTT is normal."
    explanation: >-
      States the diagnostic rule this record recommends, and the misdiagnosis it
      is designed to prevent.
- name: F10 sequencing
  description: >-
    Confirms the diagnosis, establishes the inheritance pattern for counselling,
    and distinguishes isolated factor X deficiency from a contiguous 13q deletion
    involving F7. Multiplex ligation-dependent probe amplification is needed
    alongside sequencing to detect large heterozygous deletions.
  evidence:
  - reference: PMID:25582404
    reference_title: "Congenital combined deficiency of coagulation factors VII and X--different genetic mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses included direct sequencing of the F7 and F10 genes and MLPA (multiplex ligation-dependent probe amplification) for detection of heterozygous large deletions."
    explanation: >-
      States the two assays needed, and why sequencing alone is not sufficient.
  - reference: PMID:25582404
    reference_title: "Congenital combined deficiency of coagulation factors VII and X--different genetic mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analyses are substantial for correct prediction of an inheritance pattern and a proper genetic counselling."
    explanation: >-
      States the role of genetic analysis in establishing inheritance and
      counselling.
treatments:
- name: Plasma-derived factor X concentrate
  description: >-
    High-purity human plasma-derived factor X concentrate, the first single-factor
    replacement therapy licensed specifically for hereditary factor X deficiency.
    It is the preferred replacement product because, unlike plasma or prothrombin
    complex concentrate, its factor X content is specified.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: factor X replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human coagulation factor X
      term:
        id: NCIT:C82272
        label: Coagulation Factor X Human
  target_mechanisms:
  - target: Reduced Functional Plasma Factor X
    description: >-
      Replacement restores circulating functional factor X, and so restores the
      substrate for prothrombinase assembly. The treatment acts at the node
      immediately downstream of the genetic lesion, not on the lesion itself.
  evidence:
  - reference: PMID:27797267
    reference_title: "Plasma-derived human factor X concentrate for on-demand and perioperative treatment in factor X-deficient patients: pharmacology, pharmacokinetics, efficacy, and safety."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To meet the need for a single-factor replacement therapy specifically for use in FX-deficient patients, a high-purity, high-potency, human plasma-derived FX concentrate (pdFX; Coagadex®; Bio Products Laboratory, Elstree, UK) has been developed and approved for treatment of perioperative bleeding and on-demand treatment in FX-deficient patients."
    explanation: >-
      Establishes the agent, its indication and its regulatory approval.
  - reference: PMID:29707881
    reference_title: "Prophylactic treatment of bleeding episodes in children <12 years with moderate to severe hereditary factor X deficiency (FXD): Efficacy and safety of a high-purity plasma-derived factor X (pdFX) concentrate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At end of study, investigators rated pdFX efficacy excellent for all subjects."
    explanation: >-
      Prospective phase 3 efficacy result in children under 12, the age group for
      which data were previously lacking. Investigator-rated rather than blinded,
      in nine subjects.
  - reference: PMID:34024682
    reference_title: "Diagnosis, therapeutic advances, and key recommendations for the management of factor X deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current recommendations advise clinicians to use single-factor replacement therapy for hereditary disease rather than multifactor therapies such as fresh frozen plasma, cryoprecipitate, and prothrombin complex concentrates."
    explanation: >-
      Supports the preference for single-factor replacement over the multifactor
      alternatives recorded below.
- name: Prophylactic factor X replacement
  description: >-
    Regular replacement dosed to keep trough factor X activity above a threshold,
    rather than treating bleeds as they occur. In the paediatric phase 3 study
    doses were adjusted to maintain trough activity above 5 IU/dL.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: prophylactic factor X replacement therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human coagulation factor X
      term:
        id: NCIT:C82272
        label: Coagulation Factor X Human
  target_mechanisms:
  - target: Systemic Bleeding Tendency
    description: >-
      Maintaining a trough activity level above the bleeding threshold prevents
      bleeding episodes rather than treating them.
  evidence:
  - reference: PMID:29707881
    reference_title: "Prophylactic treatment of bleeding episodes in children <12 years with moderate to severe hereditary factor X deficiency (FXD): Efficacy and safety of a high-purity plasma-derived factor X (pdFX) concentrate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects aged <12 years with basal plasma FX activity (FX:C) <5 IU/dL received pdFX as prophylactic and on-demand treatment, with doses adjusted to maintain FX:C > 5 IU/dL."
    explanation: >-
      States the prophylactic regimen and the trough target it is dosed to.
  - reference: PMID:29707881
    reference_title: "Prophylactic treatment of bleeding episodes in children <12 years with moderate to severe hereditary factor X deficiency (FXD): Efficacy and safety of a high-purity plasma-derived factor X (pdFX) concentrate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trough FX:C levels remained >5 IU/dL for all subjects after the last dose adjustment study visit."
    explanation: >-
      Reports that the trough target was achieved in every subject.
- name: Prothrombin complex concentrate
  description: >-
    A multifactor product containing factor X alongside the other vitamin
    K-dependent factors. Current guidance prefers single-factor replacement where
    it is available, but prothrombin complex concentrate remains in use, including
    as regular replacement where it is the accessible option.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: prothrombin complex concentrate therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: four-factor prothrombin complex concentrate
      term:
        id: NCIT:C208347
        label: Four-factor Prothrombin Complex Concentrate
  target_mechanisms:
  - target: Reduced Functional Plasma Factor X
    description: >-
      Supplies factor X, though at a concentration the product specification may
      not state.
  evidence:
  - reference: PMID:31667683
    reference_title: "Genetic analysis of a compound heterozygous patient with congenital factor X deficiency and regular replacement therapy with a prothrombin complex concentrate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following continued regular replacement of 500 units of PPSB-HT once per week, the proband has exhibited no bleeding tendencies and no new bruises have been observed."
    explanation: >-
      A single-patient outcome under regular prothrombin complex concentrate
      replacement. This is one uncontrolled case, and the authors present it as a
      first report rather than as established practice.
  - reference: PMID:27797267
    reference_title: "Plasma-derived human factor X concentrate for on-demand and perioperative treatment in factor X-deficient patients: pharmacology, pharmacokinetics, efficacy, and safety."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, treatment options for hereditary FX deficiency were limited mostly to products that may not specify FX content (i.e. fresh frozen plasma and prothrombin complex concentrates) and that have associated safety concerns."
    explanation: >-
      Cuts against prothrombin complex concentrate as a preferred option, on the
      grounds of unspecified factor X content and safety concerns. Recorded as
      REFUTE against this treatment rather than dropped, because the same sentence
      is the reason single-factor replacement is now recommended.
- name: Fresh frozen plasma
  description: >-
    The historical option, still used where no concentrate is available. It carries
    the same unspecified-content problem as prothrombin complex concentrate, plus
    volume load and transfusion reaction risk.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fresh frozen plasma transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Reduced Functional Plasma Factor X
    description: >-
      Supplies factor X in unpurified form along with all other plasma proteins.
  notes: >-
    Two binding decisions here, both forced and both recorded rather than worked
    around. The treatment_term binds the clinical action (transfusion) rather than
    the product, because the product term is a substance and is not reachable from
    NCIT:C25218 Clinical Intervention or Procedure. And therapeutic_agent is left
    absent: NCIT:C89783 Fresh Frozen Plasma is the exact term for the product, but
    therapeutic_agent has range ChemicalEntityDescriptor and that CURIE is not a
    member of the ChemicalEntityTerm dynamic enum, so binding it fails term
    validation. Plasma is a blood component, not a chemical entity. The product
    identity is carried in preferred_term and in this note rather than bound to a
    term that does not fit.
  evidence:
  - reference: PMID:35958882
    reference_title: "A case report of congenital factor X deficiency in an adult patient."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was re-hospitalized to remove a wisdom tooth, during which fresh frozen plasma was administered."
    explanation: >-
      Documents fresh frozen plasma used as perioperative cover where concentrate
      was unavailable. Marked INDIRECT because the case reports the practice, not
      a measured haemostatic benefit.
  - reference: PMID:35958882
    reference_title: "A case report of congenital factor X deficiency in an adult patient."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "An allergic reaction complicated this procedure in the form of a rash on the body."
    explanation: >-
      Records a transfusion reaction in the same patient, which is part of why
      plasma is no longer the preferred option.
  - reference: PMID:34024682
    reference_title: "Diagnosis, therapeutic advances, and key recommendations for the management of factor X deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Current recommendations advise clinicians to use single-factor replacement therapy for hereditary disease rather than multifactor therapies such as fresh frozen plasma, cryoprecipitate, and prothrombin complex concentrates."
    explanation: >-
      Current guidance recommends against fresh frozen plasma where single-factor
      replacement is available.
- name: Antifibrinolytic therapy
  description: >-
    Tranexamic acid or epsilon-aminocaproic acid, used for minor and mucosal
    bleeding, often alongside or instead of factor replacement. Antifibrinolytics
    do not correct the factor X defect; they stabilise the clot that the reduced
    thrombin generation does manage to form, by inhibiting its fibrinolytic
    breakdown. Fibrin glue is used in the same setting.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antifibrinolytic therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
  target_mechanisms:
  - target: Impaired Fibrin Clot Formation
    description: >-
      Acts at the fibrin node rather than upstream of it: the clot formed under
      reduced thrombin generation is preserved by blocking plasmin-mediated
      lysis. This is why antifibrinolytics help in mucosal bleeding without
      raising factor X activity.
  notes: >-
    epsilon-aminocaproic acid is named by the source alongside tranexamic acid but
    is not bound as a second therapeutic_agent: it has no row in the local CHEBI
    term cache, and a CURIE is never written without reading it from a source in
    the same step.
  evidence:
  - reference: PMID:35059555
    reference_title: "Analysis of 180 Genetic Variants in a New Interactive FX Variant Database Reveals Novel Insights into FX Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predominant treatments for FX deficiency include FX replacement and the use of antifibrinolytics."
    explanation: >-
      Places antifibrinolytics alongside replacement as one of the two mainstay
      treatment classes for this disorder.
  - reference: PMID:35059555
    reference_title: "Analysis of 180 Genetic Variants in a New Interactive FX Variant Database Reveals Novel Insights into FX Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antifibrinolytics such as ε-aminocaproic and tranexamic acid or fibrin glue are often used for the treatment of minor bleeds."
    explanation: >-
      Names the specific agents and the clinical setting (minor bleeds) that this
      treatment record describes.

animal_models:
- name: F10 total knockout mouse
  species: Mouse
  genotype: F10-/- (targeted deletion of all exons encoding the mature FX protein)
  publication: PMID:12161341
  description: >-
    Mice carrying a targeted deletion of every exon encoding mature factor X.
    Homozygotes are partially lost in utero around E11.5-12.5 with massive
    bleeding and no vascular malformation; most survivors die within five days,
    usually of intraabdominal bleeding, and the rest between P5 and P20. The model
    establishes that factor X is required for embryonic and postnatal survival.
  evidence:
  - reference: PMID:12161341
    reference_title: "Gene targeting in hemostasis. Factor X."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These observations underline the importance of FX function in embryonic and postnatal survival and confirm that these mice serve as effective models of the bleeding disorders observed in human FX deficiency."
    explanation: >-
      The authors' own statement that the knockout is a model of the human
      bleeding disorder, which is what licenses the link below.
  modeled_mechanisms:
  - target: Systemic Bleeding Tendency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Complete absence of factor X produces fatal spontaneous bleeding at
      multiple sites, reproducing the bleeding tendency that is this entry's
      organism-level node.
    limitations: >-
      The match is to severity rather than to course. Total factor X deficiency is
      embryonic or perinatally lethal in the mouse, whereas the human disorder is
      a survivable chronic bleeding diathesis in which some residual factor X
      activity is essentially always present. The model therefore cannot report on
      the human disease's natural history, its genotype-phenotype relationship, or
      long-term treatment, and its lethality is what prevented further study.
    evidence:
    - reference: PMID:12161341
      reference_title: "Gene targeting in hemostasis. Factor X."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The genotypic distribution indicated that homozygous deficiency results in partial embryonic lethality at embryonic day (E) 11.5-12.5 with signs of massive bleeding but no histologically evident defects in the vasculature of these embryos or their yolk sac."
      explanation: >-
        Reports the bleeding phenotype and, importantly, its absence of a vascular
        malformation, so the haemorrhage is attributable to the coagulation defect
        itself.
- name: f10-/- zebrafish
  species: Zebrafish
  genotype: f10-/- (TALEN-mediated ablation)
  publication: PMID:28576875
  description: >-
    TALEN-generated factor X null zebrafish. They show a major embryonic
    haemostatic defect but, unlike the mouse, survive well beyond the equivalent
    stage, which makes them usable for functional testing of human F10 variants.
  evidence:
  - reference: PMID:28576875
    reference_title: "Genome editing of factor X in zebrafish reveals unexpected tolerance of severe defects in the common pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also use f10-/- zebrafish to confirm 5 novel human F10 variants as causative mutations in affected patients, providing a rapid and reliable in vivo model for testing the severity of F10 variants."
    explanation: >-
      Establishes the model's actual utility for this disorder: assigning
      pathogenicity to human F10 variants.
  modeled_mechanisms:
  - target: Systemic Bleeding Tendency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Loss of f10 causes an embryonic haemostatic defect with later widespread
      haemorrhage, reproducing the bleeding tendency in a vertebrate that tolerates
      the null state long enough to be studied.
    limitations: >-
      The paper's own finding is that fish tolerate what is an early lethal defect
      in mammals, so the timing and severity of the zebrafish course cannot be
      transferred to human disease. Vascular development is unaffected, which is
      informative, but the model is best read as a variant-pathogenicity assay
      rather than as a model of the human clinical phenotype.
    evidence:
    - reference: PMID:28576875
      reference_title: "Genome editing of factor X in zebrafish reveals unexpected tolerance of severe defects in the common pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, widespread hemorrhage and subsequent lethality does not occur until later stages, with absence of any detectable defect in vascular development."
      explanation: >-
        States both the bleeding phenotype and the divergence in timing that the
        limitations field records.
- name: Naturally occurring feline factor X deficiency
  species: Cat
  genotype: Presumed inherited factor X deficiency (reduced FX activity in dam and one sibling)
  publication: PMID:9290823
  description: >-
    A spontaneous, apparently heritable severe factor X deficiency in a domestic
    shorthair cat, presenting with prolonged bleeding after venipuncture and
    generalized seizures. Reduced factor X activity in the dam and a sibling
    supported heritability.
  evidence:
  - reference: PMID:9290823
    reference_title: "Factor X deficiency in a cat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Severe congenital deficiency of factor X was diagnosed in a 3-year-old castrated male domestic shorthair cat with clinical signs of generalized seizures and prolonged bleeding after venipuncture."
    explanation: >-
      Records a spontaneous non-human occurrence of the same deficiency with a
      bleeding phenotype. Graded MODEL_ORGANISM per the convention that veterinary
      observations in non-human animals are model-organism evidence.
  modeled_mechanisms:
  - target: Systemic Bleeding Tendency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      A naturally occurring, non-engineered instance of severe factor X deficiency
      with a bleeding phenotype, in a species where the deficiency had not
      previously been reported.
    limitations: >-
      A single animal, with no molecular characterisation of the underlying
      defect and no formal inheritance study, so heritability is suspected rather
      than established. The seizures were not shown to be haemorrhagic in origin
      and are not curated here as a phenotype of this disorder.
  notes: >-
    Kept because it is the only spontaneous animal occurrence of this deficiency
    in the cited literature, not because it carries weight comparable to the
    engineered models above.

discussions:
- discussion_id: fx_activity_severity_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is residual factor X activity such a poor predictor of bleeding severity
    in this disease?
  attaches_to:
  - pathophysiology#Systemic Bleeding Tendency
  rationale: >-
    A single non-redundant enzymatic step with a quantifiable residual activity
    ought to give a clean dose-response relationship with bleeding, and it does
    not. The largest genotyped cohort states outright that clinical and laboratory
    phenotypes are poorly correlated. Candidate explanations include modifying
    variation elsewhere in the haemostatic system, the insensitivity of one-stage
    clotting assays to the thrombin-generation capacity that actually matters, and
    the small patient numbers available in a disorder this rare. Which of these
    dominates is unresolved, and it bears directly on whether a one-stage
    laboratory value should be used to set a prophylaxis threshold.
  evidence:
  - reference: PMID:16919077
    reference_title: "Factor X deficiency: clinical manifestation of 102 subjects from Europe and Latin America with mutations in the factor 10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical and laboratory phenotypes of FXD are poorly correlated and few regional studies on the genotype and the clinical manifestations of FXD are known."
    explanation: >-
      States the discordance this gap is about, and names the scarcity of regional
      studies as part of the problem.
- discussion_id: fx_treatment_threshold_consensus
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there a consensus treatment threshold across the severity spectrum?
  attaches_to:
  - treatments#
  rationale: >-
    A trough factor X activity above 5 IU/dL was the target in the paediatric
    prophylaxis study, but that figure comes from one open-label trial in nine
    children. The most recent comprehensive review says explicitly that consensus
    in treatment guidelines is still needed across the spectrum of disease
    severity, so the threshold used in practice is not a settled number.
  evidence:
  - reference: PMID:34024682
    reference_title: "Diagnosis, therapeutic advances, and key recommendations for the management of factor X deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consensus in treatment guidelines is still urgently needed to ensure optimal management of patients with factor X deficiency across the spectrum of disease severity."
    explanation: >-
      States that treatment guidance is not yet settled across severity strata.

name: Congenital Factor X Deficiency
creation_date: "2026-09-12T12:52:00Z"
category: Mendelian
synonyms:
- factor X deficiency
- hereditary factor X deficiency
- inherited factor X deficiency
- Stuart-Prower factor deficiency
- FX deficiency
- FXD
description: >-
  An autosomal recessive bleeding disorder caused by biallelic variants in F10,
  the gene encoding coagulation factor X. It is among the rarest of the rare
  bleeding disorders, at roughly one in 500,000 to one in a million.

  The mechanism is short and unusually well resolved, because factor X sits at a
  single, non-redundant point in the coagulation cascade. Factor X is the zymogen
  of factor Xa, and factor Xa is the protease component of the prothrombinase
  complex - the assembly of factor Xa with its cofactor factor Va on an anionic
  phospholipid surface that converts prothrombin to thrombin some five orders of
  magnitude faster than factor Xa can alone. Both the tissue-factor (extrinsic)
  and the contact-activated (intrinsic) arms of the cascade converge on factor X
  activation, so a defect here is downstream of both and cannot be bypassed by
  either. Less functional factor X means less prothrombinase, less thrombin, less
  fibrin, and a bleeding tendency whose severity broadly tracks residual factor X
  activity.

  That convergence is also what makes the laboratory picture distinctive: because
  the lesion is in the common pathway rather than in one arm, both the prothrombin
  time and the activated partial thromboplastin time are prolonged, which is the
  finding that usually prompts factor-specific assays.

  Two deficiency types are recognised and are modelled here as has_subtypes rather
  than as separate diseases, because they converge on the same prothrombinase
  defect and differ only in whether the defective protein is absent or present but
  non-functional. Type I is cross-reactive-material-negative, with factor X
  activity and antigen reduced together; type II is
  cross-reactive-material-positive, with activity reduced against preserved
  antigen.

  Three things in this entry are deliberately hedged rather than smoothed over.
  First, genotype-phenotype correlation is weak: the largest cohort curated here
  says in terms that clinical and laboratory phenotypes are poorly correlated, and
  the mutation-specific associations it reports for intracranial haemorrhage are
  described by its own authors as tentative. That hedge is carried into the
  evidence rather than dropped. Second, the type I/type II split is applied
  inconsistently in the primary literature - at least one curated cohort reports
  uniformly reduced antigen and then labels the patients type II, which inverts the
  usual convention - so the subtype records are anchored to a variant-database
  definition covering 427 case reports rather than to any single cohort's
  labelling. Third, no
  pathophysiology node declares conforms_to: kb/modules/ was searched for a
  coagulation-cascade module and none covers a single-factor common-pathway defect.

  Heterozygotes are not curated as a subtype. They are usually asymptomatic, but a
  minority bleed, and the entry records that inside the inheritance block rather
  than as a distinct disease state.
disease_term:
  preferred_term: congenital factor X deficiency
  term:
    id: MONDO:0009212
    label: congenital factor X deficiency
parents:
- Rare bleeding disorder
- Vitamin K-dependent coagulation factor deficiency
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Symptomatic disease requires two defective F10 alleles, homozygous or compound
    heterozygous. A minority of heterozygotes report bleeding symptoms, but they
    are not curated here as an affected state.
  evidence:
  - reference: PMID:18403394
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factor X deficiency is a severe rare hemorrhagic condition inherited as an autosomal recessive trait."
    explanation: >-
      States the inheritance pattern directly.
  - reference: PMID:16919077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The manifestation of bleeding symptoms in 9 of 67 (13%) symptomatic heterozygous subjects is described."
    explanation: >-
      Quantifies the minority of heterozygotes who are symptomatic, which is the
      qualification recorded in this block's description.
has_subtypes:
- name: Type I
  display_name: Type I (cross-reactive-material-negative)
  description: >-
    Concordant reduction of factor X activity and factor X antigen, indicating
    reduced synthesis or reduced stability of the protein rather than a
    dysfunctional circulating molecule.
  evidence:
  - reference: PMID:35059555
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type-I variants involve the simultaneous reduction of FX coagulant activity (FX:C) and FX antigen levels (FX:Ag), whereas type-II variants involve a reduction in FX:C with normal FX:Ag plasma levels."
    explanation: >-
      States the type I and type II definitions from a database curating 427 case
      reports, which is the authority this entry uses for the classification
      rather than any single cohort's labelling.
- name: Type II
  display_name: Type II (cross-reactive-material-positive)
  description: >-
    Reduced factor X activity against preserved or near-preserved factor X
    antigen, indicating a circulating but catalytically or membrane-binding
    defective molecule. Gla-domain variants are a recognised structural route to
    this pattern, since gamma-carboxyglutamate residues mediate the
    calcium-dependent membrane binding that prothrombinase assembly requires.
  evidence:
  - reference: PMID:35059555
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type-I variants involve the simultaneous reduction of FX coagulant activity (FX:C) and FX antigen levels (FX:Ag), whereas type-II variants involve a reduction in FX:C with normal FX:Ag plasma levels."
    explanation: >-
      States the type II definition, preserved antigen against reduced activity,
      which is what distinguishes this subtype from type I.
  - reference: PMID:19490765
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Gla-domain of factor X (FX) is a 39 residue peptide, part of the light chain, and is characterized by the presence of 11 gamma-carboxylglutaminic acid residues interspersed among other no-Gla residues."
    explanation: >-
      Describes the Gla domain whose variants give a dysfunctional but present
      molecule, the structural route to a type II pattern.
  - reference: PMID:19490765
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Factor X antigen varied between 16 and 55% of normal in almost all cases."
    explanation: >-
      Shows antigen preserved well above the activity levels reported in the same
      kindreds, which is the laboratory signature of this subtype.
pathophysiology:
- name: Biallelic F10 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous variants in F10, on chromosome 13q.
    Missense substitutions predominate, and the reported spectrum also includes
    in-frame deletions, splice-site changes and, where F7 is co-deleted, large
    terminal deletions of chromosome 13 that remove both loci.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: hepatocyte, the site of factor X synthesis
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Reduced Functional Plasma Factor X
    description: >-
      The variant protein is either not made, not secreted, or secreted in a form
      that cannot participate in prothrombinase assembly.
  evidence:
  - reference: PMID:16919077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This international study analysed the phenotype and genotype of 102 subjects from Central Europe (Germany, Poland and Slovakia) and Latin America (Costa Rica and Venezuela) with causative mutations in the F10 gene, via sequencing."
    explanation: >-
      Establishes F10 as the causative locus in a large genotyped cohort.
  - reference: PMID:16919077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-eight homozygous, seven compound-heterozygous and 67 heterozygous FXD subjects were characterized."
    explanation: >-
      Documents the biallelic genotypes that produce the disease, alongside the
      heterozygous carrier state.
  - reference: PMID:31667683
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of the proband identified two types of single-base substitutions, c.353G>A (p.Gly118Asp) and c.1303G>A (p.Gly435Ser), indicating compound heterozygous congenital FX deficiency."
    explanation: >-
      A worked compound heterozygous case with both variants identified and the
      parental carrier states confirmed in the same study.
- name: Reduced Functional Plasma Factor X
  biological_scale: MOLECULAR
  description: >-
    The functional deficit measured in plasma as factor X coagulant activity
    (FX:C). In type I disease the immunoreactive antigen (FX:Ag) falls with it; in
    type II a dysfunctional molecule is still present, so antigen is comparatively
    preserved. Residual activity is the quantity that grades severity.
  molecular_functions:
  - preferred_term: factor X zymogen available for conversion to the active protease
    modifier: DECREASED
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  downstream:
  - target: Impaired Prothrombinase Complex Activity
    description: >-
      Less factor X zymogen available for activation means less factor Xa
      available to assemble with factor Va on the membrane surface.
  evidence:
  - reference: PMID:31667683
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marked declines in FX activity (< 1%) and FX antigen levels (5%) were also observed."
    explanation: >-
      Directly measures the reduction in both factor X activity and antigen that
      defines this node in a genetically confirmed patient.
  - reference: PMID:26222694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FX:C was <1% in 11 patients, and 4% in one."
    explanation: >-
      Quantifies residual coagulant activity across a severe-deficiency cohort.
- name: Impaired Prothrombinase Complex Activity
  biological_scale: MOLECULAR
  description: >-
    The non-redundant step. Factor Xa is the catalytic subunit of prothrombinase,
    which assembles with the cofactor factor Va on an anionic phospholipid surface
    supplied largely by activated platelets. The assembled complex cleaves
    prothrombin far faster than free factor Xa, so the amount of thrombin a patient
    can generate is set by how much functional prothrombinase can form. Both the
    extrinsic and intrinsic arms of the cascade feed into factor X activation, so
    neither arm can compensate for the defect.
  biological_processes:
  - preferred_term: blood coagulation, common pathway
    modifier: DECREASED
    term:
      id: GO:0072377
      label: blood coagulation, common pathway
  cell_types:
  - preferred_term: activated platelet providing the anionic phospholipid surface
    term:
      id: CL:0000233
      label: platelet
  downstream:
  - target: Reduced Thrombin Generation
    description: >-
      Less assembled prothrombinase converts less prothrombin to thrombin.
    evidence:
    - reference: PMID:25153592
      supports: SUPPORT
      directness: DIRECT
      evidence_source: COMPUTATIONAL
      snippet: "The balance between bleeding and thrombosis depends on the amount of thrombin produced, and this in turn depends on the function of the prothrombinase complex."
      explanation: >-
        States the dependency this edge asserts, that thrombin output is set by
        prothrombinase function. Graded COMPUTATIONAL because the cited
        publication is a homology-modelling study, even though the quoted
        sentence is the paper's statement of established biochemistry rather than
        a result of its own model.
  evidence:
  - reference: PMID:25153592
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Prothrombinase is composed of a protease, factor (f) Xa, and a cofactor, fVa, which interact on negatively charged phospholipid surfaces and cleave prothrombin into thrombin 300 000 times faster than fXa alone"
    explanation: >-
      Gives the composition of the complex and the magnitude of the rate
      enhancement that makes this step non-redundant, which is why a factor X
      defect cannot be bypassed. Graded COMPUTATIONAL because the publication is a
      modelling study; see the note on the downstream edge.
- name: Reduced Thrombin Generation
  biological_scale: MOLECULAR
  description: >-
    The functional common denominator of the disease. Thrombin is required both to
    cleave fibrinogen to fibrin and to amplify its own generation through feedback
    activation of factors V, VIII and XI, so a prothrombinase deficit propagates
    rather than being buffered.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: DECREASED
    term:
      id: GO:0007596
      label: blood coagulation
  downstream:
  - target: Impaired Fibrin Clot Formation
    description: >-
      Insufficient thrombin to convert fibrinogen to fibrin at the rate a
      haemostatic plug requires.
- name: Impaired Fibrin Clot Formation
  biological_scale: TISSUE
  description: >-
    Failure to form a stable fibrin network at sites of vascular injury. This is
    the step the routine coagulation screen measures, and it is the reason both the
    prothrombin time and the activated partial thromboplastin time are prolonged in
    this disease rather than only one of them.
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    modifier: DECREASED
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
  downstream:
  - target: Systemic Bleeding Tendency
    description: >-
      An unstable or slowly formed clot fails to secure haemostasis, producing
      spontaneous and provoked bleeding.
  evidence:
  - reference: PMID:26222694
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total or partial deficiency of FX causes an impairment of clot formation, leading to a haemorrhagic disease, which manifests with bleeding symptoms of different severity, also unprovoked."
    explanation: >-
      States the impairment of clot formation and its consequence, including that
      bleeding may be unprovoked.
  - reference: PMID:31667683
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prothrombin time (> 40 s) and activated partial thromboplastin time (65.0 s) were prolonged."
    explanation: >-
      Documents the simultaneous prolongation of both screening tests that a
      common-pathway defect predicts.
- name: Systemic Bleeding Tendency
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. Bleeding is mucocutaneous, muscular and articular, and
    in the most severely affected can be intracranial. Severity broadly tracks
    residual factor X activity, but the correlation is imperfect and this entry
    does not overstate it.
  downstream:
  - target: Bruising susceptibility
  - target: Subcutaneous hemorrhage
  - target: Epistaxis
  - target: Joint hemorrhage
  - target: Intracranial hemorrhage
    description: >-
      The most serious consequence, reported in about a fifth of symptomatic
      subjects in the largest curated cohort.
  - target: Gastrointestinal hemorrhage
  - target: Abnormal umbilical stump bleeding
  - target: Gingival bleeding
  evidence:
  - reference: PMID:16919077
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous bleeding symptoms in 42 symptomatic individuals (26 homozygous, seven compound heterozygous and nine heterozygous) comprised easy bruising (55%), haematoma (43%), epistaxis (36%), haemarthrosis (33%), intracranial haemorrhage (ICH; 21%), and gastrointestinal (GI) haemorrhage (12%)."
    explanation: >-
      Quantifies the bleeding phenotype across a 102-subject genotyped cohort, and
      is the source for the individual phenotype frequencies below.
  - reference: PMID:16919077
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical and laboratory phenotypes of FXD are poorly correlated and few regional studies on the genotype and the clinical manifestations of FXD are known."
    explanation: >-
      Records the limit on the severity claim. Marked INDIRECT because it
      constrains how strongly residual activity may be read as predicting
      bleeding, rather than asserting the bleeding tendency itself.

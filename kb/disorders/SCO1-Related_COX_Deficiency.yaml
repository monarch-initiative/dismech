  evidence:
  - reference: PMID:19295170
    reference_title: "Loss of function of Sco1 and its interaction with cytochrome c oxidase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both the activity and content of CcO were reduced in the patient's muscle to approximately 10-20% of control values."
    explanation: Quantifies severe loss of Complex IV enzymatic activity in SCO1 patient mitochondria.
  - reference: PMID:23878101
    reference_title: "Novel mutations in SCO1 as a cause of fatal infantile encephalopathy and lactic acidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Fibroblasts expressing p.M294V had a relatively modest decrease in COX activity compared with those expressing p.P174L, whereas both SCO1 lines had marked copper deficiencies."
    explanation: Demonstrates marked cellular copper deficiency alongside allele-dependent Complex IV deficiency in SCO1-mutant patient fibroblasts.
  - reference: PMID:20864674
    reference_title: "Unexpected vascular enrichment of SCO1 over SCO2 in mammalian tissues: implications for human mitochondrial disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, although the amounts of Sco1 and Sco2 in brain, heart, and kidney, were comparable, in liver there was about a 15-fold greater amount of Sco1 than of Sco2, whereas conversely, in skeletal muscle there was approximately a sevenfold greater amount of Sco2 than Sco1."
    explanation: Explains why liver is disproportionately vulnerable to SCO1 loss compared with SCO2 deficiency.
  - reference: PMID:10545952

treatments:
- name: Supportive Metabolic and Multidisciplinary Care
  description: >-
    No curative or copper-bypass therapy is established for mitochondrial
    disorders of copper metabolism; clinical care relies on general supportive
    and symptomatic management tailored to organ involvement. Unlike COA6 and
    SCO2 copper-deficiency models, the investigational copper ionophore
    elesclomol failed to rescue sco1-null yeast cells in experimental testing
    because Sco1 plays a non-redundant metallochaperone role inserting copper
    directly into the Cox2 subunit of Complex IV.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    General supportive management is standard clinical practice in the absence
    of disease-modifying therapy; the cited SCO1 case reports do not establish a
    validated disease-specific interventional protocol.
  evidence:
  - reference: PMID:30038027
    reference_title: "Elesclomol restores mitochondrial function in genetic models of copper deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Mitochondrial disorders of copper metabolism represent a subset of inborn errors of mitochondrial energy metabolism for which no therapy currently exists (24)."
    explanation: Confirms that no established disease-modifying therapy currently exists for mitochondrial disorders of copper metabolism, leaving clinical care supportive.
  - reference: PMID:30038027
    reference_title: "Elesclomol restores mitochondrial function in genetic models of copper deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "ES failed to rescue sco1Δ cells, possibly because of the specific role of Sco1 as a metallochaperone in inserting copper into the Cox2 subunit of CcO"
    explanation: Experimental yeast evidence explaining why pharmacological copper-ionophore bypass with elesclomol does not rescue complete Sco1 loss.
notes: >-
  Phenotypic expression in SCO1-related COX deficiency (MC4DN4) is strongly
  allele-dependent (PMID:23878101): severe loss-of-function or CxxxC-proximal
  combinations (e.g., p.Pro174Leu / frameshift in PMID:11013136; p.Gly132Ser in
  PMID:19295170) produce neonatal or infantile hepatopathy, ketoacidotic/lactic
  acidosis, encephalopathy, hypotonia, or hypertrophic cardiomyopathy, whereas
  hypomorphic genotypes permit survival beyond infancy with developmental and
  epileptic encephalopathy and progressive hypopituitarism (PMID:39214134).
  Hepatic vulnerability contrasts with the skeletal/cardiac muscle predominance
  of paralogous SCO2 deficiency and tracks with ~15-fold higher SCO1 than SCO2
  protein abundance in mammalian liver (PMID:20864674).

    reference_title: "Mutations of the SCO1 gene in mitochondrial cytochrome c oxidase deficiency with neonatal-onset hepatic failure and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation screening revealed compound heterozygosity for SCO1 gene mutations in the patients."
    explanation: Demonstrates compound heterozygous paternal frameshift and maternal missense SCO1 mutations in the founding pedigree.
  - reference: PMID:31352446
    reference_title: "Mitochondrial Disease Caused by a Novel Homozygous Mutation (Gly106del) in the SCO1 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present a novel mutation in the SCO1 gene: in-frame deletion (Gly106del)with a different phenotype without encephalopathy, hepatopathy, hypotonia, or cardiac involvement."
    explanation: Reports autosomal recessive disease from a homozygous SCO1 in-frame deletion.

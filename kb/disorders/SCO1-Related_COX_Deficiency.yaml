pathophysiology:
- name: SCO1 Loss and Defective Copper Delivery to COX
  conforms_to: "complex_iv_assembly_deficiency#Complex IV Biogenesis Failure"
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
  description: >-
    Biallelic pathogenic SCO1 variants destabilize the inner-membrane copper
    metallochaperone SCO1 or disrupt its CxxxC copper-binding domain, impairing
    cooperative maturation and copper insertion into the CuA binuclear center of
    COX20-bound COX2. Loss of COX2 metallation stalls cytochrome c oxidase
    assembly, causing accumulation of early COX1/COX4 and COX2 subcomplexes and
    reducing mature Complex IV holoenzyme content to ~10-20% of control levels.
  genes:
  - preferred_term: SCO1
    term:
      id: hgnc:10603
      label: SCO1
  molecular_functions:
  - preferred_term: SCO1 copper metallochaperone activity
    term:
      id: GO:0016531
      label: copper chaperone activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: copper ion transport
    term:
      id: GO:0006825
      label: copper ion transport
    modifier: DECREASED
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:19295170
    reference_title: "Loss of function of Sco1 and its interaction with cytochrome c oxidase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The steady-state level of mutant Sco1 was severely decreased in the muscle mitochondria of the SCO1 patient, indicating compromised stability and thus loss of function of the protein."
    explanation: Demonstrates severe loss of mutant SCO1 protein stability in patient mitochondria.
  - reference: PMID:24403053
    reference_title: "Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly of cytochrome c oxidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also showed that a transient complex composed of newly synthesized COX2, COX20, and the copper chaperones SCO1 and SCO2 is formed and that it facilitates COX2 membrane insertion, maturation and ultimately assembly of the holoenzyme."
    explanation: Defines the direct molecular complex in which SCO1 matures COX2 to assemble Complex IV.
  - reference: PMID:39214134
    reference_title: "Endocrinological features and epileptic encephalopathy in COX deficiency due to SCO1 mutations: case series and review of literature."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial complex IV deficiency nuclear type 4 (MC4DN4) is a form of COX deficiency associated with pathogenic variants in the SCO1 gene."
    explanation: Confirms SCO1 variants cause MC4DN4, a nuclear copper-delivery COX deficiency.
  downstream:
  - target: Impaired Terminal Electron Transfer and ATP Synthesis
    causal_link_type: DIRECT
    description: >-
      Failed CuA metallation and stalled COX2 assembly severely deplete
      catalytically active Complex IV holoenzyme in mitochondria.
    evidence:
    - reference: PMID:19295170
      reference_title: "Loss of function of Sco1 and its interaction with cytochrome c oxidase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both the activity and content of CcO were reduced in the patient's muscle to approximately 10-20% of control values."
      explanation: Directly links loss-of-function SCO1 mutation to an 80-90% reduction in Complex IV holoenzyme content and catalytic activity.
    - reference: PMID:11013136
      reference_title: "Mutations of the SCO1 gene in mitochondrial cytochrome c oxidase deficiency with neonatal-onset hepatic failure and encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This proline, adjacent to the CxxxC copper-binding domain of SCO1, is likely to play a crucial role in the tridimentional structure of the domain."
      explanation: Locates the pathogenic SCO1 missense change in the copper-binding domain, tying loss of copper delivery to isolated COX deficiency.
- name: Impaired Terminal Electron Transfer and ATP Synthesis
  conforms_to: "complex_iv_assembly_deficiency#Impaired Terminal Electron Transfer and ATP Synthesis"
  biological_scale: CELLULAR
  description: >-
    Loss of functional Complex IV blocks terminal electron transfer from
    cytochrome c to molecular oxygen and proton pumping across the inner
    mitochondrial membrane, collapsing oxidative ATP synthesis and accompanied
    by marked cellular copper deficiency due to loss of SCO1-mediated copper
    homeostasis. In mammals, SCO1 is expressed at ~15-fold higher levels than
    SCO2 in liver (and strongly in vascular endothelial cells), explaining the
    predilection of severe SCO1 deficiency for liver, brain, endocrine, and
    cardiac tissues, with residual allelic capacity shaping phenotypic severity.
  cell_types:

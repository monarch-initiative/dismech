- discussion_id: gap_bfie_synaptic_vs_channel_convergence
  prompt: >-
    Do the presynaptic-release route (PRRT2) and the voltage-gated
    sodium-channel routes (SCN2A, SCN8A, and KCNQ2/3) to benign familial
    infantile seizures converge on a single shared infantile
    hyperexcitability mechanism, or represent distinct pathways with a common
    clinical endpoint?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
  rationale: >-
    BFIE is genetically heterogeneous, arising from a presynaptic
    release-machinery protein (PRRT2) and from ion-channel subunits (SCN2A,
    SCN8A, KCNQ2/3). Whether these mechanistically distinct lesions converge on
    a common infantile cortical hyperexcitability node, or produce the same
    self-limited phenotype by parallel routes, is unresolved and bears on
    whether BFIE should be modeled as one mechanism with substitutable drivers
    or several convergent mechanisms.
  evidence:
  - reference: PMID:12243921
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a clinically intermediate variant, benign familial
      neonatal-infantile seizures, with mutations in the sodium-channel subunit
      gene SCN2A.
    explanation: >-
      Documents the sodium-channel route to benign familial infantile-onset
      seizures, distinct from the PRRT2 presynaptic route.
  - reference: PMID:27052163
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PRRT2 interacts with the synaptic proteins SNAP-25 and synaptotagmin 1/2.
    explanation: >-
      Places PRRT2 in the presynaptic release machinery, defining the
      mechanistic route that must be reconciled with the ion-channel routes.
  proposed_experiments:
  - experiment_id: exp_bfie_multigene_convergence_screen
    name: BFIE multi-gene convergence electrophysiology screen
    description: >-
      In a shared infantile cortical-network assay, compare PRRT2, SCN2A,
      SCN8A, and KCNQ2/3 loss-of-function or gain-of-function perturbations for a
      common signature of increased network synchrony and excitatory/inhibitory
      imbalance, testing whether the distinct molecular lesions converge on one
      hyperexcitability node.
    experiment_type:
      preferred_term: comparative network electrophysiology screen

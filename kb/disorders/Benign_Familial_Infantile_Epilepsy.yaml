review_notes: >-
  The MONDO record retains the historical name “benign familial infantile
  epilepsy”; current clinical usage favors “self-limited familial infantile
  epilepsy,” which is included as the primary synonym and used throughout the
  narrative. Scope is restricted to the infantile syndrome. Predominantly
  neonatal KCNQ2/KCNQ3 epilepsies are represented as a differential rather than
  expanded into the focal disease, while SCN2A neonatal-infantile disease is
  retained because it is the established intermediate subtype. PRRT2 is the
  major cause; SCN2A, SCN8A, and the recurrent ANKH c.-11C>T allele are rare
  causes, and variant-specific interpretation is required. Treatment evidence
  for sodium-channel blockers is observational. GeneReviews supportive-care
  guidance is represented separately and is not used as drug-efficacy evidence.
  No disease-specific interventional trial was identified; NCT06585605 and
  NCT06967727 are broad observational epilepsy-dyskinesia studies whose
  recruiting status was checked on 2026-07-23.

      explanation: The reported carriers directly connect the familial allele to infantile focal or tonic-clonic seizures.
- name: ANKH Start-Region Variant With Unresolved Epilepsy Mechanism
  description: >-
    The recurrent ANKH c.-11C>T start-region variant segregates with
    self-limited familial infantile epilepsy in two families, but its molecular
    effect in neurons and the pathway from ANKH dysfunction to seizures remain
    unresolved.
  role: trigger
  genes:
  - preferred_term: ANKH
    term:
      id: hgnc:15492
      label: ANKH
  evidence:
  - reference: PMID:40574727
    reference_title: "Recurrent c.-11C>T change located upstream of the normal ATG initiation codon of ANKH causes self-limited familial infantile epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To our knowledge, we report the second family with autosomal dominant
      epilepsy caused by an ANKH c.-11C>T variant.
    explanation: Recurrence and segregation support causation while leaving the neuronal mechanism open.
  downstream:
  - target: Focal-Onset Infantile Seizures

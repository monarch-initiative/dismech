    explanation: Three-family phenotyping establishes the mild infantile seizure phenotype of the recurrent SCN8A allele.
  downstream:
  - target: Focal-Onset Infantile Seizures
    causal_link_type: DIRECT
    description: The familial SCN8A allele is associated with afebrile focal seizures in infancy.
    evidence:
    - reference: PMID:26677014
      reference_title: Benign infantile seizures and paroxysmal dyskinesia caused by an SCN8A mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fifteen affected members presented with afebrile focal or generalized

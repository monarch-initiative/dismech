    explanation: Electrophysiologic modeling supports variant-specific Nav1.2 dysfunction rather than an unqualified gene-wide mechanism.
  downstream:
  - target: Focal-Onset Infantile Seizures
    causal_link_type: DIRECT
    description: Familial SCN2A variants can produce self-limited neonatal-infantile focal seizures.
    evidence:
    - reference: PMID:12243921
      reference_title: Sodium-channel defects in benign familial neonatal-infantile seizures.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we describe a clinically intermediate variant, benign familial
        neonatal-infantile seizures, with mutations in the sodium-channel
        subunit gene SCN2A.
      explanation: The original family study directly links SCN2A variants to the mild familial seizure phenotype.
- name: SCN8A Nav1.6 Familial Epilepsy Association
  description: >-
    The recurrent SCN8A p.E1483K allele cosegregates with a mild familial
    infantile seizure and dyskinesia phenotype. SCN8A encodes a voltage-gated
    sodium channel, but the precise functional direction of this familial allele
    is not asserted here because the cited family study is clinical.
  role: trigger
  genes:
  - preferred_term: SCN8A
    term:
      id: hgnc:10596
      label: SCN8A
  biological_processes:
  - preferred_term: neuronal action potential
    modifier: DYSREGULATED
    term:
      id: GO:0019228
      label: neuronal action potential
  evidence:
  - reference: PMID:26677014

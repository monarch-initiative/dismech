name: Benign Familial Infantile Epilepsy
creation_date: "2026-05-13T12:00:00Z"
category: Mendelian
description: >-
  Self-limited familial infantile epilepsy (historically benign familial
  infantile epilepsy, BFIE) is an autosomal dominant epilepsy syndrome in which
  otherwise typically developing infants develop brief, afebrile focal or
  focal-to-bilateral tonic-clonic seizures, often in clusters. Onset is usually
  in the first year of life, interictal examination and EEG are usually normal,
  and seizures remit in early childhood. Heterozygous PRRT2 loss-of-function is
  the major cause and links the epilepsy to paroxysmal kinesigenic dyskinesia
  and the combined infantile convulsions and choreoathetosis syndrome. Rare
  familial phenocopies are associated with SCN2A, SCN8A, or the recurrent ANKH
  c.-11C>T variant. The favorable course is characteristic rather than
  absolute: later seizure recurrence and mild neurodevelopmental concerns occur
  in a minority.
disease_term:
  preferred_term: benign familial infantile epilepsy
  term:
    id: MONDO:0017615
    label: benign familial infantile epilepsy
synonyms:
- BFIE
- benign familial infantile seizures
- BFIS
- self-limited familial infantile epilepsy
parents:

      label: neurotransmitter secretion
  - preferred_term: synaptic vesicle exocytosis
    modifier: DECREASED
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  evidence:
  - reference: PMID:23343561
    reference_title: "Role of PRRT2 in common paroxysmal neurological disorders: a gene with remarkable pleiotropy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PRRT2 is a largely uncharacterised protein. It is expressed in the brain
      and has been demonstrated to interact with SNAP-25, a component of the
      molecular machinery involved in the release of neurotransmitters at the
      presynaptic membrane.
    explanation: Review summarizing prior in vitro biochemical work establishing PRRT2 presynaptic localization and SNAP-25 interaction.
  - reference: PMID:27052163
    reference_title: PRRT2 Is a Key Component of the Ca(2+)-Dependent Neurotransmitter Release Machinery.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that PRRT2 is enriched in presynaptic terminals and that its
      silencing decreases the number of synapses and increases the number of
      docked synaptic vesicles at rest.
    explanation: Direct cellular evidence that PRRT2 loss perturbs synaptic vesicle pools.
  - reference: PMID:27052163
    reference_title: PRRT2 Is a Key Component of the Ca(2+)-Dependent Neurotransmitter Release Machinery.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PRRT2-silenced neurons exhibit a severe impairment of synchronous release,
      attributable to a sharp decrease in release probability and Ca(2+)
      sensitivity and associated with a marked increase of the
      asynchronous/synchronous release ratio.
    explanation: Loss of PRRT2 specifically impairs calcium-dependent synchronous neurotransmitter release.
  - reference: PMID:27052163
    reference_title: PRRT2 Is a Key Component of the Ca(2+)-Dependent Neurotransmitter Release Machinery.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PRRT2 interacts with the synaptic proteins SNAP-25 and synaptotagmin 1/2.
    explanation: Defines the molecular interactions placing PRRT2 in the SNARE/Ca2+-sensing release machinery.
  - reference: PMID:34133925
    reference_title: PRRT2 modulates presynaptic Ca(2+) influx by interacting with P/Q-type channels.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      At presynaptic terminals lacking PRRT2, P/Q-type Ca2+ channels reduce their
      clustering at the active zone, with a corresponding decrease in the
      P/Q-dependent presynaptic Ca2+ signal.
    explanation: Direct cellular evidence connects PRRT2 loss to impaired Cav2.1 active-zone targeting and calcium influx.
  downstream:
  - target: PRRT2-Deficient Network Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Altered excitatory and inhibitory synaptic transmission after PRRT2 loss
      destabilizes neuronal networks and produces heightened spontaneous and
      evoked activity.
    evidence:
    - reference: PMID:29912316
      reference_title: Constitutive Inactivation of the PRRT2 Gene Alters Short-Term Synaptic Plasticity and Promotes Network Hyperexcitability in Hippocampal Neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        At the network level these complex synaptic effects resulted in a state
        of heightened spontaneous and evoked activity that was associated with
        increased excitability of excitatory neurons in both PRRT2 knockout
        primary cultures and acute hippocampal slices.
      explanation: PRRT2-null neuronal systems directly show the intervening network-hyperexcitability state.
- name: PRRT2-Deficient Network Hyperexcitability
  description: >-
    PRRT2 loss changes short-term synaptic plasticity in both excitatory and
    inhibitory neurons. The net effect in primary hippocampal cultures and acute
    slices is unstable, hyperexcitable network activity, providing an
    experimentally observed bridge between the presynaptic lesion and seizures.

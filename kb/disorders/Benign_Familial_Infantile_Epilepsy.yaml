    description: The ANKH variant is genetically associated with focal and bilateral tonic-clonic infantile seizures, but the intervening mechanism is unknown.
    evidence:
    - reference: PMID:40574727
      reference_title: "Recurrent c.-11C>T change located upstream of the normal ATG initiation codon of ANKH causes self-limited familial infantile epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All affected family members experienced focal and/or bilateral
        tonic-clonic seizures, sometimes triggered by fever or infection, with
        seizure onset predominantly before the age of 2 years.
      explanation: The second ANKH family directly supplies the downstream seizure phenotype.
phenotypes:
- name: Focal-Onset Infantile Seizures
  category: Neurological
  diagnostic: true
  description: >-
    Affected infants present with brief focal-onset seizures, often clustered,
    sometimes with secondary bilateral spread to tonic-clonic activity. Onset is
    typically between 3 and 12 months of age, on a background of normal
    development, neurological examination, and interictal EEG.
  phenotype_term:
    preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:22243967
    reference_title: PRRT2 mutations cause benign familial infantile epilepsy and infantile convulsions with choreoathetosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benign familial infantile epilepsy (BFIE) is a self-limited seizure
      disorder that occurs in infancy and has autosomal-dominant inheritance.
    explanation: The discovery paper defines BFIE clinically as a self-limited infantile seizure disorder.
  - reference: PMID:37170076
    reference_title: Peri-ictal EEG in infants with PRRT2-related self-limited infantile epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten infants presented with focal seizures at a median age of 5 months
      (range: 3-6 months).
    explanation: A genetically confirmed PRRT2 cohort supplies seizure type and typical onset timing.
- name: Focal-to-Bilateral Tonic-Clonic Seizures
  category: Neurological
  description: >-
    Focal motor or non-motor seizures frequently spread to bilateral
    tonic-clonic activity; some clinical reports use the less specific
    “bilateral tonic-clonic” description when focal onset is not captured.
  phenotype_term:
    preferred_term: Bilateral tonic-clonic seizure with focal onset
    term:
      id: HP:0007334
      label: Bilateral tonic-clonic seizure with focal onset
  evidence:
  - reference: PMID:31901402
    reference_title: The clinical and genetic spectrum in infants with (an) unprovoked cluster(s) of focal seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had focal motor or non-motor seizures, in 12 (52%) followed
      by bilateral (tonic)clonic seizures.
    explanation: The cohort directly documents focal-to-bilateral seizure evolution.
- name: Seizure Clusters
  category: Neurological
  description: >-
    Seizures typically occur in clusters, with multiple events over hours or
    days, followed by long seizure-free intervals. This temporal pattern is a
    characteristic feature of BFIE.
  phenotype_term:
    preferred_term: Recurrent seizure clusters
    term:
      id: HP:0001250
      label: Seizure
    temporality: RECURRENT
  evidence:
  - reference: PMID:23077018
    reference_title: PRRT2 phenotypic spectrum includes sporadic and fever-related infantile seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benign familial infantile epilepsy (BFIE) is an autosomal dominant
      epilepsy syndrome characterized by afebrile seizures beginning at about 6
      months of age.
    explanation: Defines BFIE clinically as an autosomal dominant afebrile infantile-seizure syndrome.
  - reference: PMID:31901402
    reference_title: The clinical and genetic spectrum in infants with (an) unprovoked cluster(s) of focal seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean cluster duration was 2.9 days (range 1-13) (see Table 1). Twelve
      infants had only one cluster.
    explanation: The infant cohort quantifies cluster duration and shows that a single cluster can occur.
- name: Paroxysmal Kinesigenic Dyskinesia
  category: Neurological
  description: >-
    PRRT2-related BFIE families can also show adolescent-onset paroxysmal
    kinesigenic dyskinesia/choreoathetosis, defining the ICCA overlap syndrome
    when combined with infantile seizures.
  phenotype_term:
    preferred_term: Paroxysmal kinesigenic dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  evidence:
  - reference: PMID:22243967
    reference_title: PRRT2 mutations cause benign familial infantile epilepsy and infantile convulsions with choreoathetosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also report PRRT2 mutations in five of six (83%) families affected by infantile convulsions and choreoathetosis (ICCA) syndrome, a familial syndrome in which infantile seizures and an adolescent-onset movement disorder, paroxysmal kinesigenic choreoathetosis (PKC), co-occur.
    explanation: >-
      The PRRT2 discovery paper directly links PRRT2-related BFIE/ICCA families
      to adolescent-onset paroxysmal kinesigenic choreoathetosis, supporting
      the local paroxysmal dyskinesia phenotype and resolving the existing
      pathograph target.
progression:
- phase: Seizure clusters in infancy
  age_range: 3-12 months (typical)
  notes: >-
    Affected infants present with clusters of focal-onset seizures, often within
    a single day or over several days, on a background of normal development
    and neurological examination. Interictal EEG is characteristically normal.
  evidence:
  - reference: PMID:23077018
    reference_title: PRRT2 phenotypic spectrum includes sporadic and fever-related infantile seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benign familial infantile epilepsy (BFIE) is an autosomal dominant
      epilepsy syndrome characterized by afebrile seizures beginning at about 6
      months of age.
    explanation: Supports the infantile-onset seizure phase centered on ~6 months.
- phase: Spontaneous remission
  age_range: infancy to early childhood
  notes: >-
    Seizure freedom is usually reached during infancy or by the end of the
    second year. Persistence beyond age 2 years, frequent recurrence, or
    treatment resistance should prompt reassessment for another genetic
    epilepsy; the reported ANKH families can remit somewhat later.
  evidence:
  - reference: PMID:31901402
    reference_title: The clinical and genetic spectrum in infants with (an) unprovoked cluster(s) of focal seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When clusters reoccur frequently, when seizures are more therapy-resistant
      and when seizures persist beyond the age of 2 years, another diagnosis or
      causative gene is likely.
    explanation: The cohort bounds the expected self-limited window and identifies red flags for diagnostic reassessment.
  - reference: PMID:40574727
    reference_title: "Recurrent c.-11C>T change located upstream of the normal ATG initiation codon of ANKH causes self-limited familial infantile epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients responded well to antiseizure medication, and seizures resolved
      completely before the age of 4 years.
    explanation: The rare ANKH subtype demonstrates a still self-limited but somewhat broader remission window.
- phase: Later seizure recurrence or episodic PRRT2 manifestations
  age_range: childhood to adulthood
  notes: >-
    A minority have later isolated seizures. PRRT2 carriers can develop
    paroxysmal kinesigenic dyskinesia or migraine after the infantile epilepsy
    has remitted; these later manifestations reflect pleiotropy rather than
    persistence of the infantile syndrome.
  evidence:
  - reference: PMID:38160512
    reference_title: Neurodevelopmental outcomes in a cohort of Australian families with self-limited familial epilepsy of neonatal/infantile onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten of 50 individuals (20%) had seizure recurrence, aged 8-65 years.
      Median time from last neonatal/infantile seizure was 11.8/12.8 years.
    explanation: The mixed familial neonatal/infantile cohort quantifies a non-zero risk of later seizure recurrence.
  - reference: PMID:38160512
    reference_title: Neurodevelopmental outcomes in a cohort of Australian families with self-limited familial epilepsy of neonatal/infantile onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paroxysmal kinesiogenic dyskinesia (n=5) occurred in 4 families and
      hemiplegic migraine (n=8) in 3 families.
    explanation: The long-term cohort documents later episodic movement and migraine phenotypes.
- phase: Long-term outcome
  notes: >-
    Most individuals achieve normal cognitive and adaptive functioning, though
    a minority show mild neurodevelopmental concerns, particularly when seizure
    burden in infancy was high or treatment duration was prolonged.
  evidence:
  - reference: PMID:38160512
    reference_title: Neurodevelopmental outcomes in a cohort of Australian families with self-limited familial epilepsy of neonatal/infantile onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vineland-3 identified 3 had low-average and 3 had mild-moderately impaired
      functioning. The majority (82%) were average.
    explanation: Adaptive function outcomes support generally favorable long-term outcome with a minority showing mild impairment.
  - reference: PMID:24958006
    reference_title: Evaluation of clinical course and neurocognition in children with self-limited infantile epilepsy in a Turkish cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fine motor and gross motor skills, language, adaptive personal/social
      skills were near-normal in all patients with self-limited familial
      infantile epilepsy.
    explanation: A separate cohort supports generally favorable development in the familial subgroup.
diagnosis:
- name: Electroclinical recognition with interictal and peri-ictal EEG
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  presence: SUPPORTIVE
  description: >-
    Diagnosis begins with the characteristic age, brief afebrile focal seizures
    in clusters, normal development, and compatible family history. The
    interictal EEG is usually normal; an EEG obtained within 24 hours of a
    seizure can show bilateral temporo-occipital focal epileptiform discharges.
    A normal interictal study therefore does not exclude the syndrome.
  evidence:
  - reference: PMID:37170076
    reference_title: Peri-ictal EEG in infants with PRRT2-related self-limited infantile epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic PRRT2 variants cause self-limited (familial) infantile epilepsy
      (SeLIE), which is responsive to sodium channel blocking antiseizure
      medications. The interictal EEG is typically normal.
    explanation: The EEG cohort explicitly establishes the usual interictal pattern.
  - reference: PMID:37170076
    reference_title: Peri-ictal EEG in infants with PRRT2-related self-limited infantile epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven of the eight infants with an EEG performed within 24 h of the most
      recent seizure had epileptiform discharges.
    explanation: Timing-dependent peri-ictal abnormalities explain why an otherwise normal interictal EEG can coexist with the syndrome.
- name: Molecular genetic testing for etiologic assignment
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: RECOMMENDED_FOR_ETIOLOGIC_ASSIGNMENT
  description: >-
    Sequence and copy-number analysis should prioritize PRRT2 and include SCN2A
    and SCN8A; ANKH c.-11C>T is a rare consideration, especially when joint pain
    or chondrocalcinosis segregates in the family. Broad testing is appropriate
    for atypical, refractory, developmentally concerning, or PRRT2-negative
    presentations.
  evidence:
  - reference: PMID:29334453
    reference_title: PRRT2-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of PRRT2-related disorder is established in a proband with
      suggestive findings and a heterozygous PRRT2 pathogenic variant identified
      by molecular genetic testing.
    explanation: GeneReviews directly supports molecular confirmation for PRRT2-related disease.
  - reference: PMID:40574727
    reference_title: "Recurrent c.-11C>T change located upstream of the normal ATG initiation codon of ANKH causes self-limited familial infantile epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ANKH-associated epilepsy should be considered in SeLFIE, especially in
      cases with a family history of chondrocalcinosis or recurrent acute joint
      pain episodes.
    explanation: The recurrent-family report supplies a specific clue for extending testing to ANKH.
differential_diagnoses:
- name: Self-limited familial neonatal epilepsy
  disease_term:
    preferred_term: benign neonatal seizures
    term:
      id: MONDO:0016027
      label: benign neonatal seizures
  description: >-
    Both disorders are autosomal dominant and self-limited. Predominantly
    neonatal onset and a KCNQ2/KCNQ3 molecular diagnosis favor familial neonatal
    epilepsy; onset later in infancy, clustering, and PRRT2 favor the focal
    disease curated here. SCN2A-associated neonatal-infantile epilepsy bridges
    the age boundary and is retained as an overlapping subtype.
  distinguishing_features:
  - Seizure onset predominantly in the neonatal period
  - KCNQ2 or KCNQ3 pathogenic variant
  evidence:
  - reference: PMID:12243921
    reference_title: Sodium-channel defects in benign familial neonatal-infantile seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two autosomal dominant disorders present in the first year of life: benign
      familial neonatal seizures, which is associated with potassium-channel
      gene defects; and benign familial infantile seizures, for which no genes
      have been identified.
    explanation: The original SCN2A study explicitly separates neonatal and infantile familial syndromes while defining the intermediate form.
- name: PCDH19-related developmental and epileptic encephalopathy
  disease_term:
    preferred_term: developmental and epileptic encephalopathy, 9
    term:
      id: MONDO:0010246
      label: developmental and epileptic encephalopathy, 9
  description: >-
    PCDH19-related epilepsy can initially resemble infantile clustered focal
    seizures. Recurrent, treatment-resistant clusters, persistence after age 2
    years, developmental concerns, or identification of a pathogenic PCDH19
    variant argue against classic self-limited familial infantile epilepsy.
  distinguishing_features:
  - Recurrent or treatment-resistant clusters
  - Seizures persisting beyond age 2 years
  - Developmental or behavioral concerns
  evidence:
  - reference: PMID:31901402
    reference_title: The clinical and genetic spectrum in infants with (an) unprovoked cluster(s) of focal seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All had an initial diagnosis of S(F)IE which was adjusted in 5 individuals.
      In 12 individuals a pathogenic variation in PRRT2 gene or complete deletion
      was identified. Pathogenic variants in PCDH19 and KCNQ2 were found in
      respectively 3 and 1 individuals.
    explanation: Reclassification after genetic testing shows that PCDH19-related disease is a concrete phenocopy.
treatments:
- name: Sodium-Channel-Blocking Antiseizure Medication
  description: >-
    Carbamazepine or oxcarbazepine is often highly effective for acute seizure
    clusters in PRRT2-associated self-limited infantile epilepsy. Evidence is
    retrospective and observational rather than randomized, and treatment
    duration should be individualized in view of spontaneous remission.
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
    - preferred_term: oxcarbazepine
      term:
        id: CHEBI:7824
        label: oxcarbazepine
  target_phenotypes:
  - preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  - preferred_term: Bilateral tonic-clonic seizure with focal onset
    term:
      id: HP:0007334
      label: Bilateral tonic-clonic seizure with focal onset
  evidence:
  - reference: PMID:36187725
    reference_title: "Efficacy, Tolerability, and Retention of Antiseizure Medications in PRRT2-Associated Infantile Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sodium channel blockers were used in 22 individuals and resulted in
      seizure freedom in all but 1 child, who showed a reduction of more than
      50% in seizure frequency.
    explanation: The largest treatment-response cohort directly supports high response to sodium-channel blockers.
  - reference: PMID:36187725
    reference_title: "Efficacy, Tolerability, and Retention of Antiseizure Medications in PRRT2-Associated Infantile Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study provides Class IV evidence that in individuals with
      PRRT2-associated infantile epilepsy, sodium channel blockers are associated
      with reduced seizure frequency but levetiracetam is not.
    explanation: The authors' evidence classification makes the observational limitation explicit.
  - reference: PMID:40401013
    reference_title: "PRRT 2-Related Epilepsy: From Self-Limited Infantile Epilepsy to Atypical Epilepsy Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-seven children (n = 37/40, 93%) were treated with antiseizure
      medications, and sodium channel blockers were effective in most (20/27
      responded, 74%).
    explanation: A recent international cohort independently supports frequent response while showing that it is not universal.
- name: Supportive Management and Surveillance
  description: >-
    GeneReviews advises prompt fever treatment during the self-limited familial
    infantile epilepsy phase and regularly scheduled follow-up to monitor
    existing manifestations, response to supportive care, and emergence of new
    manifestations. This is supportive-care guidance, not evidence for a
    specific antiseizure medication.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29334453
    reference_title: PRRT2-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surveillance: Monitoring existing manifestations, the individual's
      response to supportive care, and the emergence of new manifestations
      requires regularly scheduled follow up with the treating neurologist as
      well as educators and social services. Agents/circumstances to avoid: For
      self-limited (familial) infantile epilepsy, treat fevers promptly.
    explanation: >-
      GeneReviews supplies separate supportive-care and surveillance guidance
      without asserting efficacy for a particular antiseizure medication.
clinical_trials:
- name: NCT06585605
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    Multinational retrospective observational survey of epilepsy-dyskinesia
    syndromes, including genetic causes such as PRRT2, SCN2A, and SCN8A. It is
    relevant to ICCA and related familial overlap phenotypes but requires a
    pediatric movement disorder and is not a BFIE treatment trial.
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Paroxysmal dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  evidence:
  - reference: clinicaltrials:NCT06585605
    reference_title: A Retrospective Survey-based Multicenter Study to Delineate the Molecular and Phenotypic Spectrum of Epilepsy-dyskinesia Syndromes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Epilepsy-Dyskinesia Study aims to advance the understanding of the
      clinical and molecular spectrum of epilepsy-dyskinesia syndromes,
      monogenic diseases that cause both movement disorders and epilepsy.
    explanation: The registry summary establishes its combined epilepsy and dyskinesia scope.
  notes: Recruiting status checked on 2026-07-23; this is a broad observational study, not disease-specific efficacy evidence.
- name: NCT06967727
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    Prospective registry and natural-history study collecting longitudinal
    clinical data and biospecimens from genetically diagnosed
    epilepsy-dyskinesia syndromes, including PRRT2-, SCN2A-, and SCN8A-related
    disease. It is broader than self-limited familial infantile epilepsy.
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: Paroxysmal dyskinesia
    term:
      id: HP:0007166
      label: Paroxysmal dyskinesia
  evidence:
  - reference: clinicaltrials:NCT06967727
    reference_title: Registry and Natural History of Epilepsy-Dyskinesia Syndromes
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Registry and Natural History of Epilepsy-Dyskinesia Syndromes is
      focused on gathering longitudinal clinical data as well as biological
      samples (blood, urine, and/or skin/tissue) from male and female patients,
      of all ages, who have a genetic diagnosis of epilepsy-dyskinesia
      syndromes.
    explanation: The registry summary directly defines the longitudinal and biospecimen collection.
  notes: Recruiting status checked on 2026-07-23; this is a broad observational registry, not a therapeutic study.
animal_models:
- species: Mus musculus
  genotype: Constitutive Prrt2 knockout
  background: C57BL
  genes:
  - preferred_term: Prrt2
    term:
      id: MGI:1916267
      label: Prrt2
  category: Neurological
  description: >-
    Constitutive Prrt2-null mice model PRRT2 deficiency. They show paroxysmal
    movements, abnormal audiogenic motor behavior, increased sensitivity to
    pentylenetetrazole-induced convulsions, and cerebellar synaptic changes.
    Adult provoked-convulsion susceptibility is supportive but does not exactly
    reproduce the spontaneous infantile human seizure window.
  associated_phenotypes:
  - Paroxysmal movements
  - Increased chemically induced seizure susceptibility
  - Abnormal audiogenic motor behavior
  evidence:
  - reference: PMID:28007585
    reference_title: The PRRT2 knockout mouse recapitulates the neurological diseases associated with PRRT2 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, adult PRRT2 KO mice present abnormal motor behaviors
      characterized by wild running and jumping in response to audiogenic
      stimuli that are ineffective in wild type mice and an increased
      sensitivity to the convulsive effects of pentylentetrazol.
    explanation: The knockout model directly demonstrates paroxysmal behavior and increased provoked-convulsion sensitivity.
- species: Mus musculus
  genotype: Heterozygous and homozygous Prrt2 knockout allelic series
  genes:
  - preferred_term: Prrt2
    term:
      id: MGI:1916267
      label: Prrt2
  category: Neurological
  description: >-
    Heterozygous and homozygous Prrt2 knockout mice provide an allelic series
    for developmental timing. Synaptic-protein changes are strongest early
    postnatally and attenuate with age, while motor phenotypes occupy a later
    window. The study models age dependence but does not prove the mechanism of
    human infantile seizure remission.
  associated_phenotypes:
  - Age-dependent reduction of synaptic proteins
  - Transient motor incoordination
  evidence:
  - reference: PMID:34101060
    reference_title: Age-dependent neurological phenotypes in a mouse model of PRRT2-related diseases.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that Prrt2 deletion reduces the levels of synaptic proteins in a
      dose-dependent manner that is most pronounced at postnatal day 5 (P5),
      attenuates at P60, and disappears by P180.
    explanation: The allelic-series model directly demonstrates an age-dependent molecular phenotype.

    evidence:
    - reference: PMID:29334453
      reference_title: PRRT2-Related Disorder.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        PRRT2-related disorder, caused by heterozygous pathogenic variants in
        the gene PRRT2 (associated with aberrant synaptic transmission), is
        characterized by three core episodic neurologic phenotypes: epilepsy,
        movement disorder, and migraine.
      explanation: The GeneReviews overview places the major molecular subtype within episodic neurologic disease.
definitions:
- name: Self-limited familial infantile epilepsy clinical definition
  definition_type: CASE_DEFINITION
  scope: Infants and families with a self-limited focal epilepsy beginning after the neonatal period
  description: >-
    A clinical syndrome of unprovoked focal seizures or focal-to-bilateral
    tonic-clonic seizures beginning in infancy, commonly in clusters, in a
    usually normally developing child with a compatible autosomal dominant
    family history and remission in early childhood. Molecular confirmation
    refines the subtype but is not required to recognize the electroclinical
    syndrome.
  evidence:
  - reference: PMID:31901402
    reference_title: The clinical and genetic spectrum in infants with (an) unprovoked cluster(s) of focal seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Self-limited (familial) infantile epilepsy (S(F)IE), formerly known as
      benign (familial) infantile convulsions (B(F)IC), is an infantile cluster
      epilepsy with in rule a complete recovery.
    explanation: This cohort defines the syndrome using current terminology, infantile clustering, and recovery.
  - reference: PMID:36775847
    reference_title: "PRRT2-positive self-limited infantile epilepsy: Initial seizure characteristics and response to sodium channel blockers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with PRRT2-related epilepsy had characteristic seizure semiology
      at the initial presentation, including all afebrile, clustered
      (n = 23, 63.9%), short-duration (n = 33, 91.7%), and bilateral
      tonic-clonic seizures (n = 26, 72.2%).
    explanation: A genetically confirmed cohort provides the characteristic seizure pattern.
- name: PRRT2-related disorder molecular diagnosis
  definition_type: DIAGNOSTIC_CRITERIA
  scope: Individuals with a suggestive self-limited infantile epilepsy, movement-disorder, or migraine phenotype
  description: >-
    PRRT2-related disease is established by identifying a heterozygous
    pathogenic PRRT2 variant in an individual with suggestive findings.
  evidence:
  - reference: PMID:29334453
    reference_title: PRRT2-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of PRRT2-related disorder is established in a proband with
      suggestive findings and a heterozygous PRRT2 pathogenic variant identified
      by molecular genetic testing.
    explanation: GeneReviews states the molecular diagnostic criterion for the major BFIE subtype.
has_subtypes:
- name: PRRT2-related BFIE
  subtype_term:
    preferred_term: seizures, benign familial infantile, 2
    term:
      id: MONDO:0011593
      label: seizures, benign familial infantile, 2
  description: >-
    The most frequent molecular subtype, accounting for >80% of BFIE families.
    Caused by heterozygous truncating PRRT2 variants leading to
    haploinsufficiency. Families may also include relatives with paroxysmal
    kinesigenic dyskinesia or infantile convulsions with choreoathetosis (ICCA).
  evidence:
  - reference: PMID:22243967
    reference_title: PRRT2 mutations cause benign familial infantile epilepsy and infantile convulsions with choreoathetosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified heterozygous mutations in PRRT2, which encodes
      proline-rich transmembrane protein 2, in 14 of 17 families (82%) affected
      by BFIE, indicating that PRRT2 mutations are the most frequent cause of
      this disorder.
    explanation: The discovery cohort establishes PRRT2-related BFIE as the major molecular subtype.
- name: ICCA
  display_name: Infantile Convulsions with Choreoathetosis
  subtype_term:
    preferred_term: infantile convulsions and choreoathetosis
    term:
      id: MONDO:0011178
      label: infantile convulsions and choreoathetosis
  description: >-
    Combined familial syndrome in which infantile seizures (BFIE) and an
    adolescent-onset movement disorder (paroxysmal kinesigenic choreoathetosis)
    co-occur in the same individual or within the same family. Caused by PRRT2
    variants, with very high mutation detection rates (>90%).
  evidence:
  - reference: PMID:22243967
    reference_title: PRRT2 mutations cause benign familial infantile epilepsy and infantile convulsions with choreoathetosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also report PRRT2 mutations in five of six (83%) families affected by
      infantile convulsions and choreoathetosis (ICCA) syndrome, a familial
      syndrome in which infantile seizures and an adolescent-onset movement
      disorder, paroxysmal kinesigenic choreoathetosis (PKC), co-occur.
    explanation: The discovery study directly supports the PRRT2-related combined seizure and movement-disorder subtype.
- name: SCN2A-related BFNIS
  display_name: SCN2A-related Benign Familial Neonatal-Infantile Seizures
  subtype_term:
    preferred_term: seizures, benign familial infantile, 3
    term:
      id: MONDO:0011904
      label: seizures, benign familial infantile, 3
  description: >-
    Clinically intermediate variant in which seizure onset spans the late
    neonatal period through early infancy. Caused by heterozygous SCN2A missense
    variants encoding the Nav1.2 voltage-gated sodium channel alpha subunit.
  evidence:
  - reference: PMID:12243921
    reference_title: Sodium-channel defects in benign familial neonatal-infantile seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a clinically intermediate variant, benign familial
      neonatal-infantile seizures, with mutations in the sodium-channel subunit
      gene SCN2A.
    explanation: The original report defines the SCN2A-associated neonatal-infantile familial subtype.
- name: SCN8A-related BFIS
  display_name: SCN8A-related Benign Familial Infantile Seizures
  subtype_term:
    preferred_term: seizures, benign familial infantile, 5
    term:
      id: MONDO:0014903
      label: seizures, benign familial infantile, 5
  description: >-
    Rare familial subtype caused by specific heterozygous SCN8A variants, with
    afebrile seizures beginning in the first or second year and generally normal
    development. Variant-specific evidence is essential because other SCN8A
    variants cause developmental and epileptic encephalopathy.
  evidence:
  - reference: PMID:26677014
    reference_title: Benign infantile seizures and paroxysmal dyskinesia caused by an SCN8A mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 3 families with a total of 16 affected members, we identified the same,
      cosegregating heterozygous missense mutation (c.4447G>A; p.E1483K) in
      SCN8A, encoding a voltage-gated sodium channel.
    explanation: Segregation of a recurrent SCN8A variant across three families supports this rare subtype.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    BFIE is inherited in an autosomal dominant pattern with high but not
    complete penetrance. PRRT2, SCN2A, SCN8A, and ANKH variants segregate
    vertically across multiple generations in reported pedigrees.
  evidence:
  - reference: PMID:22243967
    reference_title: PRRT2 mutations cause benign familial infantile epilepsy and infantile convulsions with choreoathetosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benign familial infantile epilepsy (BFIE) is a self-limited seizure
      disorder that occurs in infancy and has autosomal-dominant inheritance.
    explanation: The PRRT2 discovery paper explicitly defines BFIE as an autosomal-dominant infantile seizure disorder.
  - reference: PMID:29334453
    reference_title: PRRT2-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Reduced penetrance and variable expressivity are commonly observed,
      leading to considerable phenotypic variability among heterozygous family
      members. Each child of an individual with a heterozygous PRRT2 pathogenic
      variant has a 50% chance of inheriting the pathogenic variant.
    explanation: GeneReviews defines both reduced penetrance and the 50% recurrence risk for the major molecular subtype.
genetic:
- name: PRRT2
  association: Causal loss-of-function variant
  gene_term:
    preferred_term: PRRT2
    term:
      id: hgnc:30500
      label: PRRT2
  notes: >-
    Heterozygous truncating PRRT2 variants are the most common cause of BFIE
    (~80% of families) and ICCA (>90% of families). The recurrent
    c.649dupC/p.R217fsX224 frameshift is the predominant pathogenic allele and
    is predicted to cause haploinsufficiency.
  evidence:
  - reference: PMID:22243967
    reference_title: PRRT2 mutations cause benign familial infantile epilepsy and infantile convulsions with choreoathetosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified heterozygous mutations in PRRT2, which encodes
      proline-rich transmembrane protein 2, in 14 of 17 families (82%) affected
      by BFIE, indicating that PRRT2 mutations are the most frequent cause of
      this disorder.
    explanation: This is the discovery paper establishing PRRT2 as the major BFIE gene.
  - reference: PMID:23077018
    reference_title: PRRT2 phenotypic spectrum includes sporadic and fever-related infantile seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRRT2 mutations are present in >80% of BFIE and >90% ICCA families, but
      are not a common cause of other forms of infantile epilepsy.
    explanation: Independent replication of PRRT2 mutation frequency in BFIE and ICCA cohorts.
  - reference: PMID:23343561
    reference_title: "Role of PRRT2 in common paroxysmal neurological disorders: a gene with remarkable pleiotropy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The vast majority of these mutations are truncating and are predicted to
      lead to haploinsufficiency.
    explanation: Reviews the haploinsufficiency mechanism that unifies PRRT2-related BFIE, ICCA, and PKD.
- name: SCN2A
  association: Causal variant
  gene_term:
    preferred_term: SCN2A
    term:
      id: hgnc:10588
      label: SCN2A
  notes: >-
    Heterozygous SCN2A missense variants cause benign familial neonatal-infantile
    seizures (BFNIS), a clinically intermediate phenotype with onset spanning
    the late neonatal period into infancy.
  evidence:
  - reference: PMID:12243921
    reference_title: Sodium-channel defects in benign familial neonatal-infantile seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a clinically intermediate variant, benign familial
      neonatal-infantile seizures, with mutations in the sodium-channel subunit
      gene SCN2A.
    explanation: Original identification of SCN2A as the gene underlying benign familial neonatal-infantile seizures.
  - reference: PMID:29844171
    reference_title: Dynamic action potential clamp predicts functional separation in mild familial and severe de novo forms of SCN2A epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Dynamic clamp was also able to functionally separate the L1563V variant,
      seen in benign familial neonatal-infantile seizures from R1882Q, seen in
      DEE, suggesting a diagnostic potential for this type of analysis.
    explanation: Functional modeling shows that a familial SCN2A allele differs from a severe de novo encephalopathy allele.
- name: SCN8A
  association: Causal variant (mild end of SCN8A spectrum)
  gene_term:
    preferred_term: SCN8A
    term:
      id: hgnc:10596
      label: SCN8A
  notes: >-
    SCN8A variants are an uncommon cause of self-limited familial epilepsy of
    neonatal/infantile onset; the same gene more often causes severe SCN8A
    developmental and epileptic encephalopathy.
  evidence:
  - reference: PMID:26677014
    reference_title: Benign infantile seizures and paroxysmal dyskinesia caused by an SCN8A mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 3 families with a total of 16 affected members, we identified the same,
      cosegregating heterozygous missense mutation (c.4447G>A; p.E1483K) in
      SCN8A, encoding a voltage-gated sodium channel.
    explanation: A recurrent cosegregating SCN8A allele directly supports familial causation.
- name: ANKH
  association: Causal recurrent start-region variant
  gene_term:
    preferred_term: ANKH
    term:
      id: hgnc:15492
      label: ANKH
  notes: >-
    The recurrent heterozygous c.-11C>T change upstream of the normal
    translation-initiation codon has now segregated with self-limited familial
    infantile epilepsy in two families. The epilepsy mechanism remains
    unresolved; a family history of chondrocalcinosis or recurrent acute joint
    pain can be a diagnostic clue.
  evidence:
  - reference: PMID:40574727
    reference_title: "Recurrent c.-11C>T change located upstream of the normal ATG initiation codon of ANKH causes self-limited familial infantile epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short-read genome/exome sequencing and comparative bioinformatic analysis
      of the variants of five affected individuals and one unaffected individual
      revealed ANKH c.-11C>T as the causative pathogenic variant in this family,
      segregating with the disease.
    explanation: Segregation in a second reported family supports the recurrent ANKH start-region variant as a rare cause.
pathophysiology:
- name: PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
  description: >-
    PRRT2 encodes a presynaptic, transmembrane-anchored protein that interacts
    with SNAP-25 and synaptotagmin 1/2 and contributes to the
    calcium-dependent neurotransmitter release machinery. Heterozygous
    truncating PRRT2 variants cause haploinsufficiency in presynaptic terminals,
    impairing synchronous neurotransmitter release and altering cortical and
    basal-ganglia network excitability. This presynaptic defect is the leading
    mechanistic model for the shared pathogenesis of BFIE, ICCA, and PKD.
  role: central_effector
  genes:
  - preferred_term: PRRT2
    term:
      id: hgnc:30500
      label: PRRT2
  cell_types:
  - preferred_term: neuron
    term:

discussions:
- discussion_id: gap_prrt2_pleiotropy_phenotype_determinant
  prompt: >-
    What determines whether a single PRRT2 loss-of-function allele (classically
    c.649dupC) manifests as infantile epilepsy (BFIE), later paroxysmal
    kinesigenic dyskinesia (PKD), the combined ICCA phenotype, or hemiplegic
    migraine, sometimes varying even among carriers within one family?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
  - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
  rationale: >-
    The same recurrent truncating PRRT2 allele predicted to cause
    haploinsufficiency produces phenotypes that differ in age of expression
    (infancy versus later childhood) and anatomical substrate (cortex versus
    basal ganglia). Because the primary lesion is shared, the factors selecting
    among BFIE, PKD, ICCA, and migraine (genetic modifiers, developmental timing
    of PRRT2-dependent release in different circuits, environmental triggers)
    remain a genuine mechanistic gap that curation cannot resolve from the
    single-gene defect alone.
  evidence:
  - reference: PMID:22243967
    reference_title: PRRT2 mutations cause benign familial infantile epilepsy and infantile convulsions with choreoathetosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRRT2 mutations elicit pleiotropy in terms of both age of expression
      (infancy versus later childhood) and anatomical substrate (cortex versus
      basal ganglia).
    explanation: >-
      Documents the age-dependent and region-dependent pleiotropy whose
      determinants are the open question.
  - reference: PMID:23343561
    reference_title: "Role of PRRT2 in common paroxysmal neurological disorders: a gene with remarkable pleiotropy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The vast majority of these mutations are truncating and are predicted to
      lead to haploinsufficiency.
    explanation: >-
      Establishes that a shared haploinsufficiency mechanism underlies the
      divergent phenotypes, so phenotype selection must be governed by factors
      beyond the primary allele.
  proposed_experiments:
  - experiment_id: exp_prrt2_knockin_allelic_circuit_timing
    name: PRRT2 knock-in allelic-series circuit-timing experiment
    description: >-
      Introduce the recurrent c.649dupC and other truncating PRRT2 alleles on
      defined genetic backgrounds and profile, across postnatal development,
      calcium-dependent synchronous release and network excitability separately
      in cortical and striatal circuits to test whether region-specific and
      age-specific release deficits predict the cortical-seizure versus
      basal-ganglia-dyskinesia phenotype.
    experiment_type:
      preferred_term: developmental circuit electrophysiology experiment
    perturbations:
    - name: PRRT2 truncating allele knock-in
      target: pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
      genes:
      - preferred_term: PRRT2
        term:
          id: hgnc:30500
          label: PRRT2
      description: >-
        Knock-in of c.649dupC and additional truncating alleles compared against
        matched wild-type controls.
    readouts:
    - name: Region-specific synchronous release and excitability
      target: pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
      biological_processes:
      - preferred_term: neurotransmitter secretion
        term:
          id: GO:0007269
          label: neurotransmitter secretion
        modifier: DECREASED
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: DECREASED
      assays:
      - preferred_term: multielectrode array recording
      - preferred_term: patch-clamp electrophysiology
      direction: NEGATIVE
    controls:
    - name: Wild-type littermates
      description: Matched wild-type animals profiled at the same developmental ages.
    decision_criterion: >-
      A circuit-timing model of pleiotropy is supported if release and
      excitability deficits are cortex-predominant during infancy and shift
      toward the basal ganglia at ages matching PKD onset.
    would_support:
    - pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
- discussion_id: gap_bfie_spontaneous_remission_developmental_window
  prompt: >-
    Why do PRRT2-related infantile seizures remit spontaneously by the second
    year while the same haploinsufficient allele can produce persistent
    paroxysmal kinesigenic dyskinesia later in the same individuals?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
  rationale: >-
    The self-limiting course of the seizure phenotype is a defining and
    clinically reassuring feature of BFIE, yet its mechanistic basis is
    unexplained. Because PRRT2 haploinsufficiency persists lifelong, remission
    implies a developmental-window process (maturation of inhibitory circuits,
    compensatory presynaptic release proteins, or age-dependent PRRT2
    requirement) that resolves cortical hyperexcitability without correcting the
    genetic lesion, in contrast to the later-emerging and persistent movement
    disorder in the same carriers.
  evidence:
  - reference: PMID:22243967
    reference_title: PRRT2 mutations cause benign familial infantile epilepsy and infantile convulsions with choreoathetosis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benign familial infantile epilepsy (BFIE) is a self-limited seizure
      disorder that occurs in infancy and has autosomal-dominant inheritance.
    explanation: >-
      Establishes the self-limited seizure course whose developmental basis is
      the open question.
  - reference: PMID:38160512
    reference_title: Neurodevelopmental outcomes in a cohort of Australian families with self-limited familial epilepsy of neonatal/infantile onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paroxysmal kinesiogenic dyskinesia (n=5) occurred in 4 families and
      hemiplegic migraine (n=8) in 3 families.
    explanation: >-
      Documents the later-onset persistent PKD phenotype in the same families,
      contrasting with the transient seizure phase and framing the
      window-specific remission question.
  proposed_experiments:
  - experiment_id: exp_bfie_developmental_excitability_timecourse
    name: BFIE developmental excitability time-course experiment
    description: >-
      In a PRRT2-haploinsufficient model, quantify cortical network
      excitability, inhibitory-circuit maturation, and expression of candidate
      compensatory presynaptic release proteins across the infantile
      seizure-prone window and after the expected remission age to test whether
      remission tracks with maturation-driven normalization of synchronous
      release rather than with any change in PRRT2 dosage.
    experiment_type:
      preferred_term: longitudinal developmental profiling experiment
    perturbations:
    - name: PRRT2 haploinsufficiency
      target: pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
      genes:
      - preferred_term: PRRT2
        term:
          id: hgnc:30500
          label: PRRT2
      description: >-
        PRRT2 loss-of-function background profiled longitudinally against
        wild-type controls.
    readouts:
    - name: Excitability normalization over development
      target: pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
      biological_processes:
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: DECREASED
      - preferred_term: trans-synaptic signaling
        term:
          id: GO:0099537
          label: trans-synaptic signaling
        modifier: DYSREGULATED
      assays:
      - preferred_term: multielectrode array recording
      direction: NEGATIVE
    controls:
    - name: Wild-type developmental controls
      description: Matched wild-type samples profiled at the same ages.
    decision_criterion: >-
      A developmental-window model of remission is supported if network
      hyperexcitability and synchronous-release deficits normalize by the
      post-remission age despite unchanged PRRT2 dosage.
    would_support:
    - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
- discussion_id: gap_bfie_synaptic_vs_channel_convergence
  prompt: >-
    Do the presynaptic-release route (PRRT2), the voltage-gated sodium-channel
    routes (SCN2A and SCN8A), and the unresolved ANKH route to self-limited
    familial infantile epilepsy converge on a single infantile
    hyperexcitability mechanism, or represent distinct pathways with a common
    clinical endpoint?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
  - pathophysiology#SCN2A Nav1.2 Variant-Specific Excitability
  - pathophysiology#SCN8A Nav1.6 Familial Epilepsy Association
  - pathophysiology#ANKH Start-Region Variant With Unresolved Epilepsy Mechanism
  rationale: >-
    BFIE is genetically heterogeneous, arising from a presynaptic
    release-machinery protein (PRRT2) and from ion-channel subunits (SCN2A,
    SCN8A), with a rare ANKH association whose neuronal mechanism remains
    unknown. Whether these lesions converge on a common infantile cortical
    hyperexcitability node, or produce the same self-limited phenotype by
    parallel routes, is unresolved and bears on whether the syndrome should be
    modeled as one mechanism with substitutable drivers or several convergent
    mechanisms.
  evidence:
  - reference: PMID:12243921
    reference_title: Sodium-channel defects in benign familial neonatal-infantile seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a clinically intermediate variant, benign familial
      neonatal-infantile seizures, with mutations in the sodium-channel subunit
      gene SCN2A.
    explanation: >-
      Documents the sodium-channel route to benign familial infantile-onset
      seizures, distinct from the PRRT2 presynaptic route.
  - reference: PMID:27052163
    reference_title: PRRT2 Is a Key Component of the Ca(2+)-Dependent Neurotransmitter Release Machinery.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PRRT2 interacts with the synaptic proteins SNAP-25 and synaptotagmin 1/2.
    explanation: >-
      Places PRRT2 in the presynaptic release machinery, defining the
      mechanistic route that must be reconciled with the ion-channel routes.
  proposed_experiments:
  - experiment_id: exp_bfie_multigene_convergence_screen
    name: BFIE multi-gene convergence electrophysiology screen
    description: >-
      In a shared infantile cortical-network assay, compare PRRT2 loss,
      familial SCN2A and SCN8A alleles, and ANKH c.-11C>T for a common signature
      of increased network synchrony and excitatory/inhibitory imbalance,
      testing whether the distinct molecular lesions converge on one
      hyperexcitability node.
    experiment_type:
      preferred_term: comparative network electrophysiology screen
    perturbations:
    - name: PRRT2 c.649dupC loss-of-function knock-in
      target: pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
      genes:
      - preferred_term: PRRT2
        term:
          id: hgnc:30500
          label: PRRT2
      description: >-
        Introduce the recurrent PRRT2 c.649dupC loss-of-function allele in the
        shared assay background.
    - name: Familial SCN2A L1563V knock-in
      target: pathophysiology#SCN2A Nav1.2 Variant-Specific Excitability
      genes:
      - preferred_term: SCN2A
        term:
          id: hgnc:10588
          label: SCN2A
      description: >-
        Introduce the familial SCN2A L1563V allele in the same assay background.
    - name: Familial SCN8A p.E1483K knock-in
      target: pathophysiology#SCN8A Nav1.6 Familial Epilepsy Association
      genes:
      - preferred_term: SCN8A
        term:
          id: hgnc:10596
          label: SCN8A
      description: >-
        Introduce the recurrent familial SCN8A p.E1483K allele in the same assay
        background.
    - name: ANKH c.-11C>T start-region knock-in
      target: pathophysiology#ANKH Start-Region Variant With Unresolved Epilepsy Mechanism
      genes:
      - preferred_term: ANKH
        term:
          id: hgnc:15492
          label: ANKH
      description: >-
        Introduce the recurrent ANKH c.-11C>T start-region allele in the same
        assay background.
    readouts:
    - name: Shared network hyperexcitability signature
      target: epilepsy_excitation_inhibition_imbalance:pathophysiology#Neuronal Hyperexcitability and Hypersynchrony
      biological_processes:
      - preferred_term: regulation of membrane potential
        term:
          id: GO:0042391
          label: regulation of membrane potential
        modifier: DYSREGULATED
      - preferred_term: neuronal action potential
        term:
          id: GO:0019228
          label: neuronal action potential
        modifier: INCREASED
      assays:
      - preferred_term: multielectrode array recording
      direction: POSITIVE
      interpretation: >-
        Compare network synchrony, firing, and excitability profiles across all
        four isogenic perturbations. A genuinely shared signature supports
        convergence on the conserved epilepsy hyperexcitability node; distinct
        signatures support parallel routes to the same clinical endpoint.
    controls:

discussions:
- discussion_id: gap_prrt2_pleiotropy_phenotype_determinant
  prompt: >-
    What determines whether a single PRRT2 loss-of-function allele (classically
    c.649dupC) manifests as infantile epilepsy (BFIE), later paroxysmal
    kinesigenic dyskinesia (PKD), the combined ICCA phenotype, or hemiplegic
    migraine, sometimes varying even among carriers within one family?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
  - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
  rationale: >-
    The same recurrent truncating PRRT2 allele predicted to cause
    haploinsufficiency produces phenotypes that differ in age of expression
    (infancy versus later childhood) and anatomical substrate (cortex versus
    basal ganglia). Because the primary lesion is shared, the factors selecting
    among BFIE, PKD, ICCA, and migraine (genetic modifiers, developmental timing
    of PRRT2-dependent release in different circuits, environmental triggers)
    remain a genuine mechanistic gap that curation cannot resolve from the
    single-gene defect alone.
  evidence:
  - reference: PMID:22243967
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRRT2 mutations elicit pleiotropy in terms of both age of expression
      (infancy versus later childhood) and anatomical substrate (cortex versus
      basal ganglia).
    explanation: >-
      Documents the age-dependent and region-dependent pleiotropy whose
      determinants are the open question.
  - reference: PMID:23343561
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The vast majority of these mutations are truncating and are predicted to
      lead to haploinsufficiency.
    explanation: >-
      Establishes that a shared haploinsufficiency mechanism underlies the
      divergent phenotypes, so phenotype selection must be governed by factors
      beyond the primary allele.
  proposed_experiments:
  - experiment_id: exp_prrt2_knockin_allelic_circuit_timing
    name: PRRT2 knock-in allelic-series circuit-timing experiment
    description: >-
      Introduce the recurrent c.649dupC and other truncating PRRT2 alleles on
      defined genetic backgrounds and profile, across postnatal development,
      calcium-dependent synchronous release and network excitability separately
      in cortical and striatal circuits to test whether region-specific and
      age-specific release deficits predict the cortical-seizure versus
      basal-ganglia-dyskinesia phenotype.
    experiment_type:
      preferred_term: developmental circuit electrophysiology experiment
    perturbations:
    - name: PRRT2 truncating allele knock-in
      target: pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
      genes:
      - preferred_term: PRRT2
        term:
          id: hgnc:30500
          label: PRRT2
      description: >-
        Knock-in of c.649dupC and additional truncating alleles compared against
        matched wild-type controls.
    readouts:
    - name: Region-specific synchronous release and excitability
      target: pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
      biological_processes:
      - preferred_term: neurotransmitter secretion
        term:
          id: GO:0007269
          label: neurotransmitter secretion
        modifier: DECREASED
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: DECREASED
      assays:
      - preferred_term: multielectrode array recording
      - preferred_term: patch-clamp electrophysiology
      direction: NEGATIVE
    controls:
    - name: Wild-type littermates
      description: Matched wild-type animals profiled at the same developmental ages.
    decision_criterion: >-
      A circuit-timing model of pleiotropy is supported if release and
      excitability deficits are cortex-predominant during infancy and shift
      toward the basal ganglia at ages matching PKD onset.
    would_support:
    - pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
- discussion_id: gap_bfie_spontaneous_remission_developmental_window
  prompt: >-
    Why do PRRT2-related infantile seizures remit spontaneously by the second
    year while the same haploinsufficient allele can produce persistent
    paroxysmal kinesigenic dyskinesia later in the same individuals?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
  rationale: >-
    The self-limiting course of the seizure phenotype is a defining and
    clinically reassuring feature of BFIE, yet its mechanistic basis is
    unexplained. Because PRRT2 haploinsufficiency persists lifelong, remission
    implies a developmental-window process (maturation of inhibitory circuits,
    compensatory presynaptic release proteins, or age-dependent PRRT2
    requirement) that resolves cortical hyperexcitability without correcting the
    genetic lesion, in contrast to the later-emerging and persistent movement
    disorder in the same carriers.
  evidence:
  - reference: PMID:22243967
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benign familial infantile epilepsy (BFIE) is a self-limited seizure
      disorder that occurs in infancy and has autosomal-dominant inheritance.
    explanation: >-
      Establishes the self-limited seizure course whose developmental basis is
      the open question.
  - reference: PMID:38160512
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paroxysmal kinesiogenic dyskinesia (n=5) occurred in 4 families and
      hemiplegic migraine (n=8) in 3 families.
    explanation: >-
      Documents the later-onset persistent PKD phenotype in the same families,
      contrasting with the transient seizure phase and framing the
      window-specific remission question.

has_subtypes:
- name: CMD
  display_name: Congenital muscular dystrophy presentation
  description: >-
    The common presentation (44 of 47 reported individuals in the GeneReviews
    series): early developmental and speech delay, intellectual disability,
    proximal weakness with later loss of ambulation, and in a subset dilated
    cardiomyopathy.
  evidence:
  - reference: PMID:37011121
    reference_title: "CHKB-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CMD: All affected children have developmental delay and speech delay; gross motor milestones are delayed with subsequent loss of ambulation over time."
    explanation: GeneReviews defines the congenital presentation.
    quote_role: REVIEW_SYNTHESIS
- name: LGMD
  display_name: Adolescent-onset limb-girdle presentation
  description: >-
    A rare allelic presentation (3 of 47 reported individuals) with normal motor
    development, later proximal weakness, susceptibility to rhabdomyolysis,
    normal or mildly impaired cognition and no cardiomyopathy reported. It was
    first described as proximal myopathy with focal depletion of mitochondria
    before CHKB variants were found in the same sibship.
  evidence:
  - reference: PMID:37011121
    reference_title: "CHKB-Related Muscular Dystrophy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LGMD: Motor development is normal; all affected children start walking at the usual age."
    explanation: GeneReviews defines the limb-girdle presentation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:26782016
    reference_title: "Proximal myopathy with focal depletion of mitochondria and megaconial congenital muscular dystrophy are allelic conditions caused by mutations in CHKB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus the phenotypic spectrum of CHKB mutations ranges from a congenital muscular dystrophy with intellectual disability to a later-onset non-progressive muscular weakness with normal cognition."
    explanation: Establishes the milder later-onset presentation as allelic.

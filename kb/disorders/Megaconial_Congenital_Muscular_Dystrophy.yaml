genetic:
- name: CHKB
  gene_term:
    preferred_term: CHKB
    term:
      id: hgnc:1938
      label: CHKB
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported variant classes are nonsense, frameshift, splice-site and missense,
    all with known or presumed loss of enzyme activity. Some missense and
    synonymous changes act through aberrant splicing (c.581G>A deletes exon 4).
    In offspring of non-consanguineous parents, an apparently homozygous
    variant may be hemizygous over a large deletion or arise from uniparental
    isodisomy.
  evidence:
  - reference: PMID:21665002
    reference_title: "A congenital muscular dystrophy with mitochondrial structural abnormalities caused by defective de novo phosphatidylcholine biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified homozygous or compound heterozygous mutations in the gene encoding choline kinase beta (CHKB)"
    explanation: Identification of CHKB as the causal gene.
  - reference: PMID:42292914
    reference_title: "Preclinical efficacy of a gene therapy for CHKB-mediated muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases of CHKB-mediated disease are due to a known (or presumed) loss of CHKB enzyme activity."
    explanation: Summary of the human allelic spectrum as loss of function, from the paper's introduction.
    quote_role: BACKGROUND
  - reference: PMID:41026188
    reference_title: "Alternative splicing events of three rare variants in CHKB gene causing megaconial congenital dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.581G > A variant, instead to produce a missense change (p.Arg194Gln), induces an aberrant splicing event resulting in the deletion of exon 4 (V1 and V2: r.448_581del)."
    explanation: A presumed missense variant acts by exon skipping.
  - reference: PMID:36896673
    reference_title: "Large heterozygous deletion and uniparental disomy masquerading as homozygosity in CHKB gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantitative PCR revealed that patient 1 had a large deletion encompassing the CHKB gene, inherited from the mother. Single nucleotide polymorphism analysis revealed patient 2 had paternal uniparental isodisomy containing the CHKB gene."
    explanation: Apparent homozygosity can result from a deletion or uniparental disomy rather than biparental inheritance.
animal_models:
- name: Chkb-null rostrocaudal muscular dystrophy (rmd) mouse
  species: Mouse
  genotype: Chkb rmd 1.6-kb intragenic deletion, homozygous (Chkb-/-)
  publication: PMID:16371353
  description: >-
    Spontaneous recessive Chkb null with rapidly progressive hindlimb muscular
    dystrophy, neonatal forelimb bone deformity, megaconial mitochondria and
    mitophagy in affected muscle, and cardiac hypertrophy with arrhythmia
    susceptibility. Forelimb muscle, rich in CHKA, is largely spared.
  modeled_mechanisms:
  - target: Myofiber Degeneration and Necrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Recessive Chkb loss produces progressive muscular dystrophy.
    limitations: >-
      Dystrophy follows a rostral-to-caudal gradient set by CHKA expression,
      and early membrane damage markers are not raised, whereas patients have
      proximal weakness with raised CK. Intellectual disability and skin
      findings have not been characterised in the mouse.
    evidence:
    - reference: PMID:16371353
      reference_title: "A rostrocaudal muscular dystrophy caused by a defect in choline kinase beta, the first enzyme in phosphatidylcholine biosynthesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "While mutant rmd mice show a dramatic decrease of CHK activity in all tissues, the dystrophy is only evident in skeletal muscle tissues in an unusual rostral-to-caudal gradient."
      explanation: Muscle-restricted dystrophy with a gradient not seen in patients.
  - target: Megaconial Mitochondrial Redistribution
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The rmd mouse shows the same peripheral enlargement and central loss of mitochondria as patient biopsies.
    evidence:
    - reference: PMID:21750112
      reference_title: "Muscle choline kinase beta defect causes mitochondrial dysfunction and increased mitophagy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "No mitochondria were found in the center of muscle fibers, while those located at the periphery of the fibers were significantly enlarged."
      explanation: Reproduces the diagnostic biopsy pattern.
  - target: Cardiac Mitochondrial Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Chkb-null hearts show mitochondrial cristae abnormalities and inefficient electron transport.
    limitations: >-
      Mice develop cardiac hypertrophy with a smaller left ventricle, not the
      dilated cardiomyopathy seen in patients.
    evidence:
    - reference: PMID:35151687
      reference_title: "A mouse model of inherited choline kinase β-deficiency presents with specific cardiac abnormalities and a predisposition to arrhythmia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We determined that there is cardiac hypertrophy in Chkb-/- mice along with a decrease in left ventricle size, internal diameter, and stroke volume compared with wildtype and Chkb+/- mice."
      explanation: Cardiac phenotype diverges from human dilated cardiomyopathy.
  - target: Myofiber Degeneration and Necrosis
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      A muscle-specific Chkb transgene, intramuscular AAV6-Chkb after onset, and
      systemic AAV9 carrying human CHKB each rescue the dystrophic phenotype.
    limitations: Preclinical only; no human gene therapy trial has been reported.
    evidence:
    - reference: PMID:31216357
      reference_title: "Functional rescue in a mouse model of congenital muscular dystrophy with megaconial myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Introduction of a muscle-specific Chkb transgene completely rescues motor and behavioral function in the rmd mouse model, confirming the cell-autonomous nature of the disease."
      explanation: Muscle-restricted Chkb replacement rescues the mouse.
    - reference: PMID:42292914
      reference_title: "Preclinical efficacy of a gene therapy for CHKB-mediated muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The AAV9-CHKB-treated mice were biochemically and phenotypically indistinguishable from the wild type mice."
      explanation: Systemic AAV9-CHKB normalises the knockout.

    evidence_source: MODEL_ORGANISM
    snippet: "The rmd mutation is a 1.6-kb intragenic deletion within the choline kinase beta (Chkb) gene, resulting in a complete loss of CHKB protein and enzymatic activity."
    explanation: The rmd mouse allele is a null for Chkb.

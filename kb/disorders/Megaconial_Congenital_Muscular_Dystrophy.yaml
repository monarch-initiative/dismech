    evidence_source: HUMAN_CLINICAL
    snippet: "In muscle of three affected individuals with nonsense mutations, choline kinase activities were undetectable, and phosphatidylcholine levels were decreased."
    explanation: Decreased PC in patient muscle.
  - reference: PMID:19236939
    reference_title: "Understanding the muscular dystrophy caused by deletion of choline kinase beta in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that the hindlimb muscular dystrophy in Chkb -/- mice is due to attenuated PC biosynthesis and enhanced catabolism of PC."
    explanation: Attenuated PC synthesis and increased PC catabolism in affected muscle.
  - reference: PMID:20026284

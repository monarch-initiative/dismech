- name: CHKB Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic nonsense, frameshift, splice-site and missense CHKB variants
    abolish or reduce choline kinase beta activity. In muscle of patients with
    nonsense variants choline kinase activity was undetectable.

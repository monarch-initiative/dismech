    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that the relative lack of muscle degeneration in forelimbs of Chkb(-/-) mice is due to abundant choline kinase alpha and the stable homeostasis of phosphatidylcholine."
    explanation: CHKA abundance protects muscle in which PC homeostasis is maintained.
  downstream:

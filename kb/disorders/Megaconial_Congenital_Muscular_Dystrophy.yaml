name: Megaconial Congenital Muscular Dystrophy
creation_date: "2026-10-28T22:24:04Z"
category: Mendelian
synonyms:
- MDCMC
- CHKB-related muscular dystrophy
- CHKB-MD
- choline kinase beta deficiency
- muscular dystrophy, congenital, megaconial type
- congenital megaconial myopathy
- congenital muscular dystrophy due to phosphatidylcholine biosynthesis defect
- congenital muscular dystrophy with mitochondrial structural abnormalities
- proximal myopathy with focal depletion of mitochondria
description: >-
  Autosomal recessive muscular dystrophy caused by biallelic loss-of-function
  variants in CHKB, which encodes choline kinase beta, the enzyme catalysing the
  first step of the CDP-choline (Kennedy) pathway for de novo synthesis of
  phosphatidylcholine. Most affected children present in infancy or early
  childhood with hypotonia, delayed motor and speech development, proximal
  weakness with later loss of ambulation, intellectual disability, autistic or
  hyperactive behaviour, and ichthyosis-like skin changes; about a third develop
  dilated cardiomyopathy, which accounts for most deaths. A small number of
  individuals present in adolescence with a limb-girdle phenotype, normal or
  near-normal cognition and episodes of rhabdomyolysis. The defining muscle
  biopsy finding, shared by both presentations, is a "megaconial" pattern:
  markedly enlarged mitochondria at the periphery of muscle fibers with
  mitochondria absent from the fiber center. In patient muscle and in the
  Chkb-deficient rostrocaudal muscular dystrophy (rmd) mouse, loss of choline
  kinase activity is followed by mitochondrial dysfunction and enhanced
  mitophagy, which is thought to remove defective central mitochondria while the
  remaining peripheral ones enlarge. Later mouse work found that bulk
  phosphatidylcholine is barely changed and implicates impaired mitochondrial
  fatty acid beta-oxidation with triacylglycerol accumulation and failure of the
  alpha7beta1 integrin complex at the sarcolemma. There is no disease-specific
  treatment; AAV-mediated CHKB gene replacement rescues the mouse model.

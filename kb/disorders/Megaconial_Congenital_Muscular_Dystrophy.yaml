    reference_title: "A congenital muscular dystrophy with mitochondrial structural abnormalities caused by defective de novo phosphatidylcholine biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In muscle of three affected individuals with nonsense mutations, choline kinase activities were undetectable, and phosphatidylcholine levels were decreased."
    explanation: Direct measurement of absent choline kinase activity in patient muscle.
  - reference: PMID:23692895
    reference_title: "Muscular dystrophy with large mitochondria associated with mutations in the CHKB gene in three British patients: extending the clinical and pathological phenotype."

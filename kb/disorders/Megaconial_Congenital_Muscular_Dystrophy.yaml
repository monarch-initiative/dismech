- name: Impaired De Novo Phosphatidylcholine Synthesis in Muscle
  biological_scale: CELLULAR
  description: >-
    Loss of the first Kennedy-pathway step lowers phosphocholine and impairs
    phosphatidylcholine synthesis in muscle where CHKB is the dominant isoform,
    while phospholipase-mediated PC catabolism rises. Whether bulk PC falls is
    disputed: it was decreased in patient muscle and rmd mitochondria, but a
    later time-course in Chkb knockout mice found no significant change at any
    disease stage. Muscle groups rich in the paralog CHKA are spared in mouse.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber

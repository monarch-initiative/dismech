- name: Cardiac Mitochondrial Dysfunction
  biological_scale: CELLULAR
  description: >-
    Patient heart muscle shows the same enlarged mitochondria and OXPHOS
    assembly defect as skeletal muscle. Chkb-deficient mouse hearts accumulate
    acylcarnitine, a sign that mitochondria cannot use fatty acids, and have
    mitochondria with abnormal cristae and inefficient electron transport.

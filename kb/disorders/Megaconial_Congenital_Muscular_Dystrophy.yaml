differential_diagnoses:
- name: Neurodevelopmental disorder with microcephaly, movement abnormalities, and seizures (CHKA-related)
  distinguishing_features:
  - >-
    Caused by biallelic CHKA variants in the paralogous choline kinase that
    catalyses the same Kennedy-pathway step, but producing a CNS-predominant
    disorder with epilepsy, microcephaly and movement disorder rather than a
    muscular dystrophy; separable by genotype and by the absence of a megaconial
    muscle biopsy.
  evidence:
  - reference: PMID:35202461
    reference_title: "Bi-allelic variants in CHKA cause a neurodevelopmental disorder with epilepsy and microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified six individuals from five families with bi-allelic variants in CHKA presenting with severe global developmental delay, epilepsy, movement disorders and microcephaly."
    explanation: Phenotype of the CHKA disorder for comparison.
- name: Atypical Rett syndrome
  distinguishing_features:
  - >-
    Autistic behaviour, hand stereotypies and developmental delay can suggest
    atypical Rett syndrome; hypotonia with progressive weakness, raised CK and
    a megaconial muscle biopsy point to CHKB.
  evidence:
  - reference: PMID:33712684
    reference_title: "Megaconial congenital muscular dystrophy secondary to novel CHKB mutations resemble atypical Rett syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atypical Rett syndrome-like presentation may be a clue towards CHKB-related disorder."
    explanation: Names atypical Rett syndrome as a mimic.
- name: Dystrophinopathy, dystroglycanopathy and myotonic dystrophy
  distinguishing_features:
  - >-
    Motor delay, proximal weakness and learning difficulty raise these
    diagnoses; the megaconial biopsy pattern and ichthyosis-like skin changes
    point to CHKB.
  evidence:
  - reference: PMID:26548592
    reference_title: "Choline Kinase Beta-Related Muscular Dystrophy, Appearance of Muscle Involvement on Magnetic Resonance Imaging."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical presentation with motor delay, proximal weakness, and learning difficulties raise the possibility of a dystrophinopathy, dystroglycanopathy, or myotonic dystrophy."
    explanation: Names the clinical differential.
    quote_role: BACKGROUND
discussions:
- discussion_id: gap_pc_level_vs_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired De Novo Phosphatidylcholine Synthesis in Muscle
  - pathophysiology#Impaired Mitochondrial Fatty Acid Beta-Oxidation
  - pathophysiology#Sarcolemmal Integrin Complex Failure
  prompt: >-
    Is muscle degeneration driven by loss of phosphatidylcholine mass, or by
    downstream consequences of the blocked choline phosphorylation step that do
    not require bulk PC to fall?
  rationale: >-
    The founding human and early mouse studies report decreased PC in muscle and
    muscle mitochondria, but a later time-course in Chkb knockout mice found no
    significant change in PC at any stage, and implicates fatty acid oxidation
    failure and integrin complex loss instead. How these routes relate to the
    megaconial mitochondria and to each other is unresolved.
- discussion_id: gap_cns_and_skin_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Intellectual disability
  - phenotypes#Autistic behavior
  - phenotypes#Ichthyosis
  prompt: >-
    What mechanism links CHKB loss to intellectual disability, autistic
    behaviour and ichthyosis?
  rationale: >-
    Mechanistic work has been done almost entirely in skeletal and cardiac
    muscle of the mouse. Brain MRS shows reduced choline compounds in only some
    patients, and no study has examined neurons or keratinocytes.
references:
- reference: PMID:37011121
  title: "CHKB-Related Muscular Dystrophy."
  tags:
  - GeneReviews
notes: >-
  GeneReviews covers this disease as CHKB-related muscular dystrophy
  (PMID:37011121), which includes the rare adolescent-onset limb-girdle
  presentation formerly called proximal myopathy with focal depletion of
  mitochondria; that presentation is recorded here as a subtype rather than a
  separate entry because it shares the gene and the megaconial biopsy.

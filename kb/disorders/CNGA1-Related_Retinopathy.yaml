genetic:
- name: CNGA1
  gene_term:
    preferred_term: CNGA1
    term:
      id: hgnc:2148
      label: CNGA1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Causative
  features: >-
    Reported causal alleles are mostly frameshift and nonsense variants, plus a whole-gene deletion and missense variants. In East Asian cohorts a single recurrent frameshift accounts for most alleles (72% of patient alleles in a Chinese cohort, 69% in a Chinese and Korean cohort); the Chinese study found a more severe phenotype in homozygotes, while the East Asian study found no significant genotype-phenotype association. A functional screen of 86 missense variants classified most as functionally abnormal and allowed reclassification of many variants of uncertain significance.
  case_fractions:
  - population: Japanese patients with autosomal recessive or sporadic retinitis pigmentosa
    case_fraction_percent: 5.1
    cohort_size: 99
    notes: Five of 99 unrelated patients carried biallelic CNGA1 frameshift variants.
    evidence:
    - reference: PMID:25268133
      reference_title: Whole exome analysis identifies frequent CNGA1 mutations in Japanese population with autosomal recessive retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The frequency of CNGA1 gene mutation was 5.1% (5/99 patients).
      explanation: Primary estimate of the CNGA1 share of arRP and sporadic RP in Japan.
  - population: Autosomal recessive retinitis pigmentosa patients screened in the gene-discovery study
    case_fraction_low: 1.7
    case_fraction_high: 2.3
    cohort_size: 173
    notes: Three or four of 173 unrelated arRP patients, as restated by a later study; the original paper described CNGA1 as an uncommon cause of RP.
    evidence:
    - reference: PMID:25268133
      reference_title: Whole exome analysis identifies frequent CNGA1 mutations in Japanese population with autosomal recessive retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: Dryja et al. estimated the prevalence of CNGA1 mutations in arRP patients to be between 1.7 and 2.3% (3 or 4 of 173 patients)
      explanation: Restates the case fraction implied by the gene-discovery screen.
    - reference: PMID:7479749
      reference_title: Mutations in the gene encoding the alpha subunit of the rod cGMP-gated channel in autosomal recessive retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We conclude that the absence or paucity of functional cGMP-gated cation channels in the plasma membrane is deleterious to rod photoreceptors and is an uncommon cause of RP.
      explanation: The original screen concluded that CNGA1 is an uncommon cause of RP.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:15570217
      reference_title: Autosomal recessive retinitis pigmentosa in a Pakistani family mapped to CNGA1 with identification of a novel mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The autosomal recessive retinitis pigmentosa in this family is caused by a mutation in CNGA1 gene.
      explanation: Linkage plus a homozygous frameshift establishes recessive CNGA1 disease.
  evidence:
  - reference: PMID:7479749
    reference_title: Mutations in the gene encoding the alpha subunit of the rod cGMP-gated channel in autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Five mutant sequences cosegregated with disease among four unrelated families with autosomal recessive RP.
    explanation: Gene-discovery evidence for CNGA1 as a causal arRP gene.
  - reference: PMID:41448483
    reference_title: Natural History of CNGA1-Associated Retinitis Pigmentosa in a Large Chinese Cohort Revealing an Optimal Intervention Window.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: c.265delC was confirmed as a hotspot variant with an allele frequency of 72% in the Chinese population.
    explanation: Identifies the predominant Chinese allele; the frequency is among patient alleles in the cohort.
  - reference: PMID:42440411
    reference_title: "Clinical and Molecular Features of CNGA1-Associated Retinitis Pigmentosa in an East Asian Cohort: Insights for Gene Therapy Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The c.253delC variant was the predominant mutation in both the Chinese and Korean cohorts, with an allele frequency of 69%.
    explanation: The recurrent frameshift predominates in both Chinese and Korean patients.
  - reference: PMID:42192302
    reference_title: Systematic functional evaluation of CNGA1 missense variants associated with retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Based on the functional findings, 62.1% of the variants initially classified as VUS were re-categorized as likely pathogenic or likely benign.
    explanation: Functional data resolve many CNGA1 missense variants of uncertain significance.
animal_models:
- name: Cnga1 knockout mouse (CRISPR/Cas9)
  species: Mouse
  genotype: Cnga1-/- (CRISPR/Cas9 frameshift deletion)
  publication: PMID:34418172
  description: >-
    CRISPR/Cas9 knockout with absent rod-driven ERG, a transient supernormal cone response and rapid photoreceptor degeneration that is nearly complete by 6 months. It degenerates faster than the Y509C point mutant and lacks a macula.
  evidence:
  - reference: PMID:34418172
    reference_title: Retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGA1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We observed progressive retinal thinning and a concomitant functional deficit in vivo as typical phenotypes for RP.
    explanation: Establishes the knockout as a model of CNGA1 retinitis pigmentosa.
  modeled_mechanisms:
  - target: Loss of Rod Light Responses
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Rod-specific ERG responses are absent from one month.
    limitations: Mouse retina lacks a macula; a null allele does not represent every human missense allele.
    readouts:
    - name: Scotopic rod-specific ERG b-wave
      target: Loss of Rod Light Responses
      direction: ABOLISHED
      interpretation: Absent response to the rod-specific flash indicates a nonfunctional rod system.
      evidence:
      - reference: PMID:40897815
        reference_title: Gene augmentation therapy restores vision and preserves photoreceptors in a mouse model of CNGA1-retinitis pigmentosa.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: In contrast, the Cnga1-/- mice showed no response to the rod-specific flash at −2 log cd s m−2
        explanation: Direct ERG measurement of absent rod response.
    evidence:
    - reference: PMID:40897815
      reference_title: Gene augmentation therapy restores vision and preserves photoreceptors in a mouse model of CNGA1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: These observations suggest that the rod system is not functional in the Cnga1-/- mouse.
      explanation: The knockout reproduces the primary functional defect.
  - target: Progressive Rod Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Progressive TUNEL-positive photoreceptor loss with microglial activation and oxidative damage.
    limitations: Degeneration is much faster than in patients, whose central acuity is preserved for decades.
    evidence:
    - reference: PMID:34418172
      reference_title: Retinal degeneration in mice lacking the cyclic nucleotide-gated channel subunit CNGA1.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Immunofluorescence and TUNEL staining showed progressive degeneration in rods and cones. Moreover, microglial activation and oxidative stress damage occurred in parallel.
      explanation: Histological evidence of progressive photoreceptor death in the knockout.
  - target: Loss of Rod Light Responses
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Subretinal AAV8-hRHO-mCnga1 at postnatal day 14 restores correctly localized CNGA1, rod-mediated ERG and vision-guided behaviour for at least 8.5 months.
    limitations: Species-matched murine Cnga1, treatment before major rod loss, and a fast-degenerating null background limit inference to older patients treated at later stages.
    readouts:
    - name: Scotopic rod-specific ERG b-wave after treatment
      target: Loss of Rod Light Responses
      direction: RESTORED
      interpretation: A rod-specific ERG response appears in treated but not untreated eyes.
      evidence:
      - reference: PMID:40897815
        reference_title: Gene augmentation therapy restores vision and preserves photoreceptors in a mouse model of CNGA1-retinitis pigmentosa.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        directness: DIRECT
        snippet: At the ISCEV rod-specific flash of −2 log cd s m−2, the treated Cnga1-/- eye exhibited a clear positive b-wave, while the untreated Cnga1-/- eye did not show a response
        explanation: Direct ERG evidence of restored rod function.
    evidence:
    - reference: PMID:40897815
      reference_title: Gene augmentation therapy restores vision and preserves photoreceptors in a mouse model of CNGA1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Gene augmentation therapy results in robust expression of correctly localized CNGA1 protein, sustained rescue of retinal function and long-term preservation of photoreceptors for at least 9 months.
      explanation: Gene augmentation rescues function and structure in the knockout.
  - target: Rod cGMP Accumulation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Treated retina loses the abnormal cGMP immunoreactivity seen in untreated eyes.
    limitations: Immunostaining is not a quantitative cGMP or calcium measurement.
    evidence:
    - reference: PMID:40897815
      reference_title: Gene augmentation therapy restores vision and preserves photoreceptors in a mouse model of CNGA1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We found that this toxic accumulation was reversed in the treated retina, whereas cGMP levels remained high in untreated eyes
      explanation: Reversal of cGMP accumulation after gene augmentation.
- name: Cnga1 Y509C mouse (ENU-derived)
  species: Mouse
  genotype: Cnga1 c.1526A>G (p.Tyr509Cys) homozygous
  publication: PMID:36115851
  description: >-
    ENU-derived point mutation in the cyclic nucleotide-binding domain. CNGA1 and CNGB1 proteins are absent, rod-driven ERG is lost from postnatal week 3, and rods degenerate more slowly than in the knockout, followed by complete cone loss by 12 months.
  evidence:
  - reference: PMID:36115851
    reference_title: Mutations within the cGMP-binding domain of CNGA1 causing autosomal recessive retinitis pigmentosa in human and animal model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Homozygous Cnga1 mice harboring a (ENSMUST00000087213.12) c.1526 A > G (p.Tyr509Cys) mutation showed progressive degeneration in the retinal photoreceptors from 8 weeks on.
    explanation: Establishes the point-mutant model.
  modeled_mechanisms:
  - target: Defective Rod CNG Channel Membrane Expression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Both channel subunits are lost from rod outer segments despite normal transcript levels.
    limitations: The mouse Y509C allele differs from the human G509R allele in the same domain; protein loss may not apply to every missense allele.
    evidence:
    - reference: PMID:36115851
      reference_title: Mutations within the cGMP-binding domain of CNGA1 causing autosomal recessive retinitis pigmentosa in human and animal model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: While Cngb1 mRNA levels were also unaffected, we could not detect any CNGB1 protein in Cnga1Y509C/Y509C at 1 month of age.
      explanation: Loss of the partner subunit protein accompanies CNGA1 loss.
  - target: Secondary Cone Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Cone-mediated responses decline secondarily and cones are lost by 12 months.
    limitations: Mice lack a cone-dense fovea, so macular sparing in patients cannot be modelled.
    evidence:
    - reference: PMID:36115851
      reference_title: Mutations within the cGMP-binding domain of CNGA1 causing autosomal recessive retinitis pigmentosa in human and animal model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Over time, a gradual reduction of PNA signal was observed, revealing a loss of the outer segments of cones at PM9 and a complete loss of the cones at PM12
      explanation: Histology of delayed cone loss.
- name: Shetland sheepdog with CNGA1 frameshift (progressive retinal atrophy)
  species: Dog
  genotype: CNGA1 c.1752_1755delAACT (frameshift, exon 9)
  publication: PMID:26202106
  description: >-
    Naturally occurring progressive retinal atrophy in one Shetland sheepdog family associated with a CNGA1 frameshift. Its retinal phenotype has not been characterized in detail, and other affected Shelties in the population did not carry the variant.

pathophysiology:
- name: Biallelic CNGA1 Loss of Function
  description: >-
    Biallelic pathogenic CNGA1 variants remove or disable the alpha subunit of the rod cGMP-gated channel. Early nonsense and frameshift alleles and whole-gene deletion are expected to encode no functional channel; missense and distal frameshift alleles that have been expressed in vitro reduce membrane targeting, abundance or channel function. Not every reported missense variant is pathogenic, and functional testing has reclassified many variants of uncertain significance.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  role: trigger
  gene:
    preferred_term: CNGA1
    term:
      id: hgnc:2148
      label: CNGA1
    modifier: DECREASED

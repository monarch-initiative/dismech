name: CNGA1-Related Retinopathy
creation_date: "2026-10-14T15:02:40Z"
category: Mendelian
description: >-
  CNGA1-related retinopathy is an autosomal recessive rod-cone dystrophy (retinitis pigmentosa 49) caused by biallelic pathogenic variants in CNGA1, which encodes the alpha subunit of the cGMP-gated cation channel in the rod outer-segment plasma membrane. The rod channel is a heterotetramer of three CNGA1 subunits and one CNGB1 subunit and carries the dark current that light closes. Most reported alleles are truncating or frameshift variants; characterized missense alleles reduce channel abundance at the plasma membrane or impair channel function. Loss of the channel abolishes rod light responses, so night blindness typically begins in early childhood and the rod electroretinogram is severely reduced or nonrecordable. Rods then degenerate, producing progressive peripheral field constriction, bone-spicule pigmentation, vascular attenuation and optic disc pallor, followed by secondary cone loss. Central acuity is often preserved until the fourth decade, which has made the disease a candidate for gene augmentation. Epiretinal membrane, cystoid macular change and cataract are common accompanying findings. CNGA1 variants are an uncommon cause of autosomal recessive retinitis pigmentosa in the original North American screen but are more frequent in East Asian cohorts, where a recurrent frameshift allele predominates.

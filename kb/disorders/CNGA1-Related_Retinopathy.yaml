treatments:
- name: AAV-Mediated CNGA1 Gene Augmentation Therapy
  therapeutic_modality: GENE_THERAPY
  description: >-
    Investigational. Subretinal AAV8-hRHO-mCnga1 restores rod function, reverses cGMP accumulation and preserves photoreceptors in the Cnga1 knockout mouse. An intravitreal AAV2.NN-CNGA1 vector (VG901) is in a phase 1b open-label safety study in patients. Human efficacy has not been established.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Loss of Rod Light Responses
    treatment_effect: RESTORES
    description: Restores rod-mediated retinal function in the knockout mouse when given before major rod loss.
    evidence:
    - reference: PMID:40897815
      reference_title: Gene augmentation therapy restores vision and preserves photoreceptors in a mouse model of CNGA1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Gene augmentation therapy results in robust expression of correctly localized CNGA1 protein, sustained rescue of retinal function and long-term preservation of photoreceptors for at least 9 months.
      explanation: Preclinical restoration of rod function and structure.
  - target: Rod cGMP Accumulation
    treatment_effect: INHIBITS
    description: Reverses abnormal cGMP accumulation in treated retina.
    evidence:
    - reference: PMID:40897815
      reference_title: Gene augmentation therapy restores vision and preserves photoreceptors in a mouse model of CNGA1-retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We found that this toxic accumulation was reversed in the treated retina, whereas cGMP levels remained high in untreated eyes
      explanation: Immunohistochemical reversal of cGMP accumulation.
  evidence:
  - reference: PMID:40897815
    reference_title: Gene augmentation therapy restores vision and preserves photoreceptors in a mouse model of CNGA1-retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: To the best of our knowledge, this work demonstrates for the first time that a gene augmentation approach can restore vision and preserves photoreceptors in an animal model of CNGA1-RP.
    explanation: Preclinical proof of concept for CNGA1 gene augmentation.
  - reference: clinicaltrials:NCT06291935
    reference_title: A Prospective, Open-label, Phase 1b, Single-arm, Safety Study of an Intravitreal Application of a Recombinant Adeno-associated Virus Vector Expressing CNGA1 (AAV2.NN-CNGA1) in Patients With Retinitis Pigmentosa Due to CNGA1 Mutations
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Participants will be administered a single intravitreal dose of VG901 into the most affected eye through a syringe and followed up for a year to monitor safety and efficacy.
    explanation: Registered first-in-human study design; it reports no results.
  - reference: PMID:42440411
    reference_title: "Clinical and Molecular Features of CNGA1-Associated Retinitis Pigmentosa in an East Asian Cohort: Insights for Gene Therapy Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: OCT imaging demonstrated long-term preservation of the foveal ellipsoid zone until stage 4, indicating a broad therapeutic window.
    explanation: Preserved foveal photoreceptors in stages 1 to 3 define a population that could be treated; this is natural-history data, not treatment efficacy.

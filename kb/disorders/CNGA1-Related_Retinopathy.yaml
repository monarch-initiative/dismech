  - term:
      id: MONDO:0013405
      label: retinitis pigmentosa 49
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO places retinitis pigmentosa 49 (OMIM:613756, retinitis pigmentosa caused by mutation in CNGA1) as the single child of MONDO:0800405. All reported CNGA1 disease presents as autosomal recessive retinitis pigmentosa, so the subtype is captured as a mapping rather than a separate has_subtypes row.
notes: >-
  CNGA1 is distinct from CNGB1-related retinopathy (the partner rod channel subunit, curated separately as CNGB1-Related_Retinopathy) and from CNGA3/CNGB3 cone channel disease (achromatopsia). Findings from those genes are not used here as CNGA1 evidence; where a CNGA1 model shows loss of the CNGB1 partner protein, that is recorded as a CNGA1 finding. There is no GeneReviews chapter specific to CNGA1; the Nonsyndromic Retinitis Pigmentosa Overview supplies general retinitis pigmentosa diagnostic and management guidance. The recurrent East Asian frameshift is reported as c.265delC (p.L89Ffs) in studies using NM_000087.3 numbering and as c.253delC (p.Leu85Phefs*4) in a study annotated to NM_001379270.1.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Two of these were nonsense mutations early in the reading frame (Glu76End and Lys139End) and one was a deletion encompassing most if not all of the transcriptional unit; these three alleles would not be expected to encode a functional channel.

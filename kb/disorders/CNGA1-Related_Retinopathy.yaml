progression:
- phase: Childhood-onset night blindness
  age_range: Early childhood
  notes: Night blindness is the first symptom, with mean onset around 4 years in one cohort and childhood onset in 88% of another.
  evidence:
  - reference: PMID:42440411
    reference_title: "Clinical and Molecular Features of CNGA1-Associated Retinitis Pigmentosa in an East Asian Cohort: Insights for Gene Therapy Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Nyctalopia was the initial symptom in all patients (100%), with a mean age at onset of 4.4 ± 2.7 years.
    explanation: Establishes early-childhood onset.
- phase: Progressive visual field constriction with preserved central acuity
  age_range: Childhood to fourth decade
  notes: Field loss begins in childhood and reaches tunnel vision at a median of about 39 years, while acuity remains stable until about 30 years.
  evidence:
  - reference: PMID:41448483
    reference_title: Natural History of CNGA1-Associated Retinitis Pigmentosa in a Large Chinese Cohort Revealing an Optimal Intervention Window.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Based on the quantitative data, VA loss in CNGA1-RP is late-onset and slow-progressing, whereas VF loss occurs earlier and more severely.
    explanation: Field loss precedes acuity loss.
  - reference: PMID:38705136
    reference_title: Genotypic and Phenotypic Characterization of a Cohort of Patients Affected by Rod Cyclic Nucleotide Channel-Associated Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Rod CNG channel-associated RP was demonstrated to be a slowly progressive disease in both CNGA1- and CNGB1-related forms
    explanation: An Italian cohort including 11 CNGA1 patients also found slow progression.
- phase: Central visual decline and complications
  age_range: Fourth decade onward
  notes: Acuity declines slowly from the fourth decade, with cataract, epiretinal membrane and macular atrophy contributing; about a third were blind by age 72 in the Chinese cohort.
  evidence:
  - reference: PMID:41448483
    reference_title: Natural History of CNGA1-Associated Retinitis Pigmentosa in a Large Chinese Cohort Revealing an Optimal Intervention Window.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: BCVA remained stable (0.09 logMAR) until age of 30.7 years, followed by a progressive decline at 0.029 logMAR per year; by age of 72 years, 32% of patients had developed blindness (BCVA > 1.30 logMAR).
    explanation: Quantifies late acuity decline.

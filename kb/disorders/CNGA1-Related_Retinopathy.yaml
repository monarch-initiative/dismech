- name: Defective Rod CNG Channel Membrane Expression
  description: >-
    The native rod channel is a 3:1 CNGA1:CNGB1 heterotetramer in the outer-segment plasma membrane. Mutant CNGA1 proteins expressed in vitro are retained inside the cell or reach the membrane at reduced levels, and one C-terminal frameshift abolishes surface expression only when coexpressed with CNGB1. In a Cnga1 point-mutant mouse, CNGA1 protein is lost and the CNGB1 partner protein is also undetectable despite normal transcript levels, so the outer segment lacks the channel complex.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

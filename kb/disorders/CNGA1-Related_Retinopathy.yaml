        label: CNGA1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline CNGA1 variants, homozygous or compound heterozygous; most are truncating, with a smaller set of missense alleles shown to impair channel expression or function.

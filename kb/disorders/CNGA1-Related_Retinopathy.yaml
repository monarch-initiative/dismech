    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Retinal degeneration in the macular region and severely decreased BCVA occurred in 3/5 patients suggesting that the advanced stage of CNGA1 mutations included degeneration of the entire retina with both rod and cone photoreceptors.
    explanation: Macular degeneration and reduced acuity in advanced patients indicate cone involvement; the inference to cone loss is the authors' interpretation of clinical findings.
  downstream:
  - target: Rod-cone dystrophy
    description: Rod-first, cone-second degeneration produces the rod-cone dystrophy pattern.
    causal_link_type: DIRECT
  - target: Reduced visual acuity
    description: Loss of central cone function reduces visual acuity, usually after the third decade; cataract and macular complications also contribute.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Macular atrophy
    description: Advanced disease extends to the macula with atrophic and pigmentary changes.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Undetectable electroretinogram
    description: Loss of cones removes the residual photopic response, leaving a nonrecordable ERG in most adult patients.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

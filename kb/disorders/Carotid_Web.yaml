    reference_title: Carotid revascularization is associated with reduced recurrence in symptomatic carotid web.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: TCAR was the most common approach (65%), followed by CAS (20%) and CEA (15%).
    explanation: A 20-person single-center retrospective series includes TCAR as an approach, not a randomized comparison.
  - reference: PMID:42710700
    reference_title: Carotid revascularization is associated with reduced recurrence in symptomatic carotid web.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'Over a median follow-up of 9 months (IQR: 6-21), no patients experienced recurrent ischemic stroke in the treated vascular territory, suggesting potential effectiveness of revascularization in preventing recurrence in selected patients with carotid webs.'
    explanation: Short uncontrolled follow-up limits conclusions; this Brown series may overlap earlier reports from the same center.
  target_mechanisms:
  - target: Disturbed carotid flow and stasis
    treatment_effect: INHIBITS
    description: The TCAR stent is intended to exclude the web pouch; the local flow mechanism is extrapolated from conventional carotid stenting.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC6927439/
      reference_title: Optical coherence tomography as an adjunct during carotid artery stenting for carotid web - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: Angiogram confirming no retrograde flow into the web and no flow-limiting stenosis.
      explanation: The flow effect was imaged after conventional carotid stenting. Applying it to TCAR is a mechanism-based extrapolation from its stent component; the TCAR cohort establishes use, not this imaging endpoint.
  notes: NCIT:C157840 captures the endovascular stent component. The OAK query runoak -i ols:ncit search 'l~transcarotid' 'l~TCAR' returned no matches on 2026-10-04; the term does not encode the transcarotid access or flow-reversal protection.
- name: Mechanical thrombectomy for acute ischemic stroke
  description: Endovascular thrombectomy treats an eligible acute intracranial occlusion associated with a carotid web. It restores downstream patency but leaves the carotid lesion in place, so it does not establish a secondary-prevention strategy.

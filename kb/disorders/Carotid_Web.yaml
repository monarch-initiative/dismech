    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Fifteen (75%) underwent mechanical thrombectomy and 8 (40%) received IV thrombolysis.
    explanation: Documents acute therapies in the selected 20-person symptomatic cohort, without establishing web-specific comparative efficacy.
- name: Intravenous thrombolysis for acute ischemic stroke
  description: Intravenous thrombolysis is another acute reperfusion treatment used in eligible web-associated strokes. It addresses the acute thrombotic occlusion and does not remove the intimal shelf.

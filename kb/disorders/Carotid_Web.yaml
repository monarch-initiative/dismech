phenotypes:
- name: Embolic ischemic stroke
  category: Neurologic
  description: Ipsilateral ischemic stroke, often including large-vessel occlusion, is a major symptomatic presentation. The lesion may also be incidental, so stroke is not required to diagnose a web.
  phenotype_term:
    preferred_term: Ischemic stroke
    term:
      id: HP:0002140
      label: Ischemic stroke
  evidence:
  - reference: PMID:37724713
    reference_title: 'Clinical, imaging, and management features of symptomatic carotid web: Insight from CAROWEB registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Between June 2019 and December 2021, 244 cases were submitted by 14 centers, 42 rejected, and 202 included (IS, 91.6%; TIA, 7.9%; retinal infarction, 0.5%; mean age, 50.8 ± 12.2 years; female, 62.9%; Caucasian, 47.5%; Afro-Caribbean, 20.3%).
    explanation: The adjudicated French registry selected symptomatic cases; these proportions are not penetrance or population prevalence.
- name: Recurrent ischemic stroke
  category: Neurologic
  description: Further ipsilateral ischemic events can occur during the initial hospitalization or over subsequent years. Recurrence estimates vary with case selection, antithrombotic treatment and endpoint definition.
  phenotype_term:
    preferred_term: Ischemic stroke
    term:
      id: HP:0002140
      label: Ischemic stroke
    temporality: RECURRENT
  evidence:
  - reference: PMID:39215397
    reference_title: In-hospital recurrent stroke in ipsilateral carotid web patients undergoing thrombectomy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 11% (3/27) of patients with ipsilateral carotid artery webs experienced recurrent ischemic stroke and LVO.
    explanation: Three early recurrences occurred among 27 web patients in a single-center anterior-circulation thrombectomy cohort. This estimate does not apply to all incidentally detected webs.
- name: Transient ischemic attack

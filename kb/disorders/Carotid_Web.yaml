      directness: DIRECT
      snippet: Angiogram confirming no retrograde flow into the web and no flow-limiting stenosis.
      explanation: A single stenting case documented disappearance of retrograde pouch filling after deployment, alongside OCT-confirmed stent apposition. It supports the local flow effect, not comparative efficacy or universal prevention of embolization.
- name: Transcarotid artery revascularization
  description: TCAR is a stent-based approach reported for selected symptomatic webs. A 2026 series of 20 revascularized patients used TCAR in 65%, with no ipsilateral recurrent ischemic strokes during a median nine-month follow-up across all approaches. This small uncontrolled series does not establish superiority or long-term safety.
  therapeutic_modality: DEVICE

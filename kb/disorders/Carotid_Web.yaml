    term:
      id: HP:0002140
      label: Ischemic stroke
  evidence:
  - reference: PMID:40494576
    reference_title: 'Carotid Web: An Update Focusing on Its Relationship With Fibromuscular Dysplasia and Therapeutic Strategy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Treatment options in symptomatic cases include medical therapy (single or dual antiplatelets) or interventional approach (surgery or stenting), but there are no randomized controlled trials about therapy.
    explanation: Review synthesis documents available approaches and the absence of randomized comparative treatment evidence.
  - reference: PMID:34102760
    reference_title: 'Stroke Recurrence in First-Ever Symptomatic Carotid Web: A Cohort Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: All patients treated with carotid surgery or stenting received long-term antithrombotic therapy with aspirin (n=21) or vitamin K antagonist (n=2) that was ongoing at the end of follow-up.
    explanation: Documents agents used in this cohort; it does not prescribe a universal regimen.
  - reference: PMID:39215397

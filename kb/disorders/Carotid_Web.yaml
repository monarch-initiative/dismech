name: Carotid web
creation_date: '2026-05-05T20:46:40Z'
category: Complex
description: >-
  Carotid web is a non-atherosclerotic intimal shelf projecting into the carotid bulb or proximal internal carotid
  artery, most often from the posterior wall. Histology supports an intimal fibromuscular dysplasia phenotype, although
  its origin is incompletely understood. Disturbed flow and stasis in the web pouch favor local thrombosis and downstream
  artery-to-artery embolism. Webs may be incidental or associated with ipsilateral ischemic stroke, transient ischemic
  attack, or retinal ischemia; a severe flow-limiting stenosis is not required.
disease_term:
  preferred_term: carotid web

    explanation: The confidence interval and lack of randomized controls prevent interpreting zero observed recurrences as zero future risk.
  - reference: PMID:41885481
    reference_title: 'Pathologically Confirmed Symptomatic Carotid Webs: Histopathological Features and Long-Term Surgical Outcomes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Two patients experienced transient, minor cranial nerves injuries (hypoglossal nerve and marginal mandibular branch) after CEA.
    explanation: Documents procedural morbidity.
  - &id001
    reference: PMID:40503762
    reference_title: 'Carotid Revascularization Versus Medical Management for Ischemic Stroke with Ipsilateral Carotid Web: A Systematic Review and Meta-Analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: given the small, heterogeneous cohorts and the uncertain natural history of carotid artery web under medical management, these findings should be interpreted with caution until prospective, controlled comparative effectiveness studies are performed.
    explanation: The meta-analysis combines observational studies; lower recurrence after revascularization does not establish randomized comparative efficacy.
- name: Carotid artery stenting
  description: Stenting across the web is used to exclude the thrombogenic pouch in selected symptomatic patients. The 71-person multicenter series included 48 stenting and 23 endarterectomy procedures, with one perioperative stroke overall and one recurrent stroke in the stenting group. Procedure selection was not randomized and there was no medical-only control.

epidemiology:
- name: Demographics of an adjudicated symptomatic registry
  description: The French CAROWEB cohort was female-predominant and included multiple ancestry groups. Referral, imaging and symptomatic selection constrain interpretation; ancestry is not a demonstrated causal genetic factor.
  evidence:
  - reference: PMID:37724713
    reference_title: 'Clinical, imaging, and management features of symptomatic carotid web: Insight from CAROWEB registry.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Between June 2019 and December 2021, 244 cases were submitted by 14 centers, 42 rejected, and 202 included (IS, 91.6%; TIA, 7.9%; retinal infarction, 0.5%; mean age, 50.8 ± 12.2 years; female, 62.9%; Caucasian, 47.5%; Afro-Caribbean, 20.3%).
    explanation: The adjudicated French registry selected symptomatic cases; these proportions are not penetrance or population prevalence.
- name: Hospital-based detection prevalence
  description: A 2015 retrospective suspected-stroke imaging series detected webs in 7/576 patients (1.2%). This was a hospital convenience sample with CTA and follow-up brain MRI, not population screening.
  evidence:
  - reference: PMID:26228877
    reference_title: Carotid Webs and Recurrent Ischemic Strokes in the Era of CT Angiography.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Thus, the prevalence of carotid webs in a hospital-based series is estimated at 1.2% (95% CI, 0.4%–2.5%).
    explanation: The full methods identify a suspected-stroke CTA/MRI convenience sample.
treatments:
- name: Antithrombotic medical therapy after symptomatic ischemia
  description: Antiplatelet therapy is commonly used after symptomatic events, including alongside revascularization. Anticoagulation has also been used in selected patients or for other indications. The optimal agent, combination and duration for the web itself are not established; recurrence can occur on therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetylsalicylic acid
      term:

progression:
- phase: Incidentally detected asymptomatic web
  notes: Some webs are detected without an attributable ischemic event, including contralateral lesions. The optimal surveillance schedule and primary-prevention treatment remain uncertain.
  evidence:
  - reference: PMID:40494576
    reference_title: 'Carotid Web: An Update Focusing on Its Relationship With Fibromuscular Dysplasia and Therapeutic Strategy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Another unresolved issue is the need for treatment for an asymptomatic, incidentally found carotid web.
    explanation: The review distinguishes incidental disease from symptomatic secondary prevention.
- phase: Early recurrence after a symptomatic event
  notes: In a single-center thrombectomy cohort, all recurrent events occurred within 48 hours of the index stroke. The small event count and restricted cohort limit generalization.
  evidence:
  - reference: PMID:39215397
    reference_title: In-hospital recurrent stroke in ipsilateral carotid web patients undergoing thrombectomy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 11% (3/27) of patients with ipsilateral carotid artery webs experienced recurrent ischemic stroke and LVO.
    explanation: Three early recurrences occurred among 27 web patients in a single-center anterior-circulation thrombectomy cohort. This estimate does not apply to all incidentally detected webs.
  - reference: PMID:39215397
    reference_title: In-hospital recurrent stroke in ipsilateral carotid web patients undergoing thrombectomy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: All recurrent ischemic stroke and large vessel occlusion occurred within 48 h after the index stroke.
    explanation: Reports timing of the recurrent events.
- phase: Longer-term recurrent ischemic risk
  notes: Symptomatic cohorts show ongoing recurrence risk despite medical treatment. Stroke-only estimates and combined stroke/TIA estimates must be kept separate, and neither defines risk in an incidental asymptomatic web.
  evidence:
  - reference: PMID:34102760
    reference_title: 'Stroke Recurrence in First-Ever Symptomatic Carotid Web: A Cohort Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Under medical treatment alone, the annual recurrent CIE rate was 6.9%, and the cumulative rate was 4.4% at 30-day, 10.8% at 1-year, 19.8% at 2-year, 23.2% at 3-year, and 27.3% at 5-year.
    explanation: These Kaplan-Meier estimates combine stroke and TIA in a 92-person Afro-Caribbean symptomatic cohort; nonrandom treatment selection and adherence uncertainty limit comparisons.
  - reference: PMID:33970205
    reference_title: Assessment of Recurrent Stroke Risk in Patients With a Carotid Web.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: During 2 years of follow-up, 5 of 30 patients (17%) with CW had a recurrent stroke compared with 5 of 168 patients (3%) without CW (adjusted hazard ratio, 4.9; 95% CI, 1.4-18.1).
    explanation: The MR CLEAN-derived comparison involved anterior-circulation LVO patients; 28/30 web patients received medical management. This endpoint is recurrent stroke, whereas the other cohort combined stroke and TIA.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: CAS was undertaken in 48 patients (67.6%) and CEA in 23 (32.4%). One patient (1.41%) experienced a perioperative stroke, and none experienced a perioperative MI
    explanation: Reports procedures and adverse events in the 71-person retrospective cohort.
  - reference: PMID:40776764
    reference_title: 'Outcomes after carotid revascularization for symptomatic carotid artery web: A multi-institutional cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: no recurrent strokes were observed in patients undergoing CEA, and one recurrent symptomatic stroke occurred in the CAS cohort.
    explanation: The full-text discussion reports recurrence; the abstract calls it asymptomatic, so no claim about recurrence severity is inferred from the abstract.
  - *id001
  target_mechanisms:

definitions:
- name: Multiplanar CTA definition of carotid web
  definition_type: CASE_DEFINITION
  description: A thin shelf-like filling defect of the posterior carotid bulb seen on oblique sagittal CTA and as a septum on axial images. The imaging lesion may be present without a clinical ischemic event.
  scope: Structural imaging definition; attribution of a stroke requires clinical and etiologic assessment.
  evidence:
  - &id002
    reference: PMID:26228877
    reference_title: Carotid Webs and Recurrent Ischemic Strokes in the Era of CT Angiography.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: A carotid web was defined on CTA as a thin intraluminal filling defect along the posterior wall of the carotid bulb just beyond the carotid bifurcation on oblique sagittal section CTA that was seen as a septum on axial CTA.
    explanation: The operational imaging definition requires the shelf on oblique sagittal reconstruction and septum on axial images.
pathophysiology:
- name: Intimal shelf lesion of the carotid bulb
  description: Eccentric fibrous and myxoid intimal tissue forms a shelf projecting into the arterial lumen. Smooth-muscle-like spindle cells are embedded in extracellular matrix; the lesion differs from a lipid-rich atheroma.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:40873957
    reference_title: Histopathologic evidence of intimal hyperplasia in carotid artery webs associated with stroke.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Histopathologic analysis consistently demonstrated fibrovascular tissue with intimal fibroid hyperplasia and myxoid degeneration, without lipid-rich plaques or inflammatory infiltrates.
    explanation: Three surgically selected symptomatic patients had non-atheromatous intimal lesions; the series does not exclude coexisting atherosclerosis in other patients.
  - reference: PMID:40494576
    reference_title: 'Carotid Web: An Update Focusing on Its Relationship With Fibromuscular Dysplasia and Therapeutic Strategy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The common histological feature of the carotid web is eccentric intimal hyperplasia, characterized by spindle cells (consistent with migrated vascular smooth muscle cells) intermingled within an abundant loose extracellular matrix.
    explanation: Summarizes the cellular and matrix composition of resected webs, not an experimentally established developmental origin.
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  locations:
  - preferred_term: internal carotid artery
    term:
      id: UBERON:0001532
      label: internal carotid artery
  - preferred_term: carotid sinus
    term:
      id: UBERON:0003708
      label: carotid sinus
  downstream:
  - target: Disturbed carotid flow and stasis
    description: The intraluminal shelf produces a recirculation pouch with slow washout.
    causal_link_type: DIRECT
    evidence:
    - reference: DOI:10.1038/s41598-024-60666-7
      reference_title: Subjects with carotid webs demonstrate pro-thrombotic hemodynamics compared to subjects with carotid atherosclerosis
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Patients with CaW had significantly larger regions containing low shear rate, high OSI, low velocity, and flow stasis in comparison to subjects with mild atherosclerosis or normal bifurcations.
      explanation: Patient-specific CFD assessed flow surrogates in 13 web bifurcations, seven atherosclerotic bifurcations and six contralateral normal bifurcations; it did not measure platelet activation or prospective stroke risk.
- name: Disturbed carotid flow and stasis
  description: The web geometry produces local flow separation, recirculation, low velocity and prolonged residence time. These abnormalities can occur with modest luminal narrowing.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: DOI:10.1038/s41598-024-60666-7
    reference_title: Subjects with carotid webs demonstrate pro-thrombotic hemodynamics compared to subjects with carotid atherosclerosis
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patients with CaW had significantly larger regions containing low shear rate, high OSI, low velocity, and flow stasis in comparison to subjects with mild atherosclerosis or normal bifurcations.
    explanation: Patient-specific CFD assessed flow surrogates in 13 web bifurcations, seven atherosclerotic bifurcations and six contralateral normal bifurcations; it did not measure platelet activation or prospective stroke risk.
  locations:
  - preferred_term: internal carotid artery
    term:
      id: UBERON:0001532
      label: internal carotid artery
  notes: The CFD study assumed rigid walls and Newtonian blood, used a small symptomatic sample, and included older atherosclerotic comparators. Six normal geometries came from contralateral arteries of web patients. Hemodynamic thresholds were exploratory; modeled stasis is not a direct assay of coagulation or a validated individual stroke predictor.
  downstream:
  - target: Web-associated mural thrombosis
    description: Slow washout favors local accumulation of thrombotic material.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40494576
      reference_title: 'Carotid Web: An Update Focusing on Its Relationship With Fibromuscular Dysplasia and Therapeutic Strategy.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: It is proposed that the presence of a carotid web leads to thrombogenic hemodynamic changes downstream, which may facilitate thrombus formation and subsequent embolization, resulting in stroke
      explanation: The flow-to-thrombus-to-embolus hypothesis is supported by imaging and pathology, but not by a randomized mechanistic experiment.
- name: Web-associated mural thrombosis
  description: Thrombus forms in or adheres to the pouch of the web. Serial imaging can show its appearance and resolution, and resected specimens can contain adherent mural thrombus.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:26228877
    reference_title: Carotid Webs and Recurrent Ischemic Strokes in the Era of CT Angiography.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Specimens from another case contained a thick fibrous intimal cushion with a recent mural thrombus
    explanation: Direct histology documents thrombus associated with the intimal lesion.
  - reference: PMID:26228877
    reference_title: Carotid Webs and Recurrent Ischemic Strokes in the Era of CT Angiography.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In 2 patients, thrombus-like material was seen at the site of the carotid web, with changing morphology on serial CTAs, despite concurrent antiplatelet therapy.
    explanation: Serial imaging supports dynamic local thrombus formation, without establishing treatment efficacy.

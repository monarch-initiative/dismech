diagnosis:
- name: Multiplanar carotid vascular imaging and etiologic stroke assessment
  description: CTA with axial and oblique sagittal reconstructions identifies the shelf and septum. Complementary ultrasound or vessel-wall MRI can resolve uncertainty; DSA is useful for unresolved diagnosis or intervention. The recommendation to use two modalities is an expert-review proposal, not a validated universal criterion. A web found ipsilateral to stroke still requires evaluation for competing causes.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - *id002
  - reference: PMID:40494576
    reference_title: 'Carotid Web: An Update Focusing on Its Relationship With Fibromuscular Dysplasia and Therapeutic Strategy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: At the moment, the most reasonable suggestion is to use at least two different techniques to confirm the diagnosis of carotid web (e.g., CTA and MRA, or US and CTA), leaving DSA for unsolved questions and implementing the use of VW-MRI for the differential diagnosis.
    explanation: The authors explicitly frame concordant imaging as a suggestion.
  - reference: PMID:41885481
    reference_title: 'Pathologically Confirmed Symptomatic Carotid Webs: Histopathological Features and Long-Term Surgical Outcomes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Competing stroke mechanisms were identified in 15% of patients.
    explanation: A structural web does not exclude another stroke mechanism.
- name: Distinguishing web, dissection, plaque and superimposed thrombus
  description: A smooth intimal shelf must be distinguished from dissection, noncalcified plaque and thrombus. Repeat or complementary imaging may reveal a web masked by adherent clot. Coexisting atherosclerosis is possible.
  evidence:
  - reference: PMID:40494576
    reference_title: 'Carotid Web: An Update Focusing on Its Relationship With Fibromuscular Dysplasia and Therapeutic Strategy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The primary differential diagnoses for a carotid web include arterial dissection, non-calcified atherosclerotic plaques, and intraluminal thrombus.
    explanation: Lists the main imaging alternatives.
  - reference: PMID:40873957
    reference_title: Histopathologic evidence of intimal hyperplasia in carotid artery webs associated with stroke.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In two cases, superimposed thrombi led to initial misdiagnoses such as soft plaque or dissection.
    explanation: Direct clinical-pathology correlation documents a diagnostic pitfall.
  - reference: PMID:41885481
    reference_title: 'Pathologically Confirmed Symptomatic Carotid Webs: Histopathological Features and Long-Term Surgical Outcomes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Notably, concurrent atheromatous changes were noted in 6 patients.
    explanation: The larger pathologically confirmed series establishes that atherosclerosis can coexist.
histopathology:
- name: Fibrous and myxoid intimal hyperplasia
  description: Resected webs contain eccentric fibrovascular intimal tissue with myxoid change. Classic lipid-rich atheroma was absent in a three-patient series, but concurrent atheromatous changes occur in other cohorts.
  finding_term:
    preferred_term: Fibrous and myxoid intimal hyperplasia
  evidence:
  - reference: PMID:40873957
    reference_title: Histopathologic evidence of intimal hyperplasia in carotid artery webs associated with stroke.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Histopathologic analysis consistently demonstrated fibrovascular tissue with intimal fibroid hyperplasia and myxoid degeneration, without lipid-rich plaques or inflammatory infiltrates.
    explanation: Three surgically selected symptomatic patients had non-atheromatous intimal lesions; the series does not exclude coexisting atherosclerosis in other patients.
  - reference: PMID:41885481
    reference_title: 'Pathologically Confirmed Symptomatic Carotid Webs: Histopathological Features and Long-Term Surgical Outcomes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Notably, concurrent atheromatous changes were noted in 6 patients.
    explanation: Prevents generalizing the absence of plaque in a small case series.
- name: Adherent mural thrombus
  description: Thrombus can adhere to or be embedded in the intimal shelf, supporting a local embolic source; it is not present in every resected specimen.
  finding_term:
    preferred_term: Adherent mural thrombus
  evidence:
  - reference: PMID:26228877
    reference_title: Carotid Webs and Recurrent Ischemic Strokes in the Era of CT Angiography.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Specimens from another case contained a thick fibrous intimal cushion with a recent mural thrombus
    explanation: Direct histology documents thrombus associated with the intimal lesion.
notes: This entry concerns the structural carotid web lesion rather than atherosclerotic carotid stenosis. A web can coexist with atherosclerosis, and superimposed thrombus can obscure the underlying shelf. Symptomatic and incidentally detected webs are clinical states, not established molecular subtypes. Cohort demographics do not establish a Mendelian, hormonal, or environmental cause. Recurrence and treatment estimates depend on symptomatic case selection, follow-up, and outcome definitions; primary-prevention benefit for an incidental web is unproven.
imaging_findings:
- name: Posterior carotid-bulb shelf and axial septum
  modality: CT
  description: CTA shows the shelf on oblique sagittal reconstructions and a septum on axial images. Small protrusions lacking an axial septum were excluded from the classic imaging definition.
  evidence:
  - *id002
  - reference: PMID:26228877
    reference_title: Carotid Webs and Recurrent Ischemic Strokes in the Era of CT Angiography.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In contrast to carotid webs, these lesions were smaller and not seen on the axial sections
    explanation: Distinguishes small protruding lesions from the study definition of a web.
- name: Delayed contrast washout in the web pouch
  modality: ANGIOGRAPHY
  description: Catheter angiography can show contrast retained distal to the shelf in the late venous phase, consistent with local stasis.
  evidence:
  - reference: PMID:40494576
    reference_title: 'Carotid Web: An Update Focusing on Its Relationship With Fibromuscular Dysplasia and Therapeutic Strategy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: During the late venous phase, contrast agent retention is commonly observed at the distal end of the carotid web.
    explanation: A dynamic imaging correlate of slow washout.
- name: Sonographic intraluminal shelf
  modality: ULTRASOUND
  description: A thin shelf projects into the lumen; specialized microvascular imaging may show a triangular endoluminal defect. The 299-person retrospective ultrasound study selected patients with web or web-plus-plaque and lacked a plaque-only comparison, limiting diagnostic generalization.
  evidence:
  - reference: DOI:10.1186/s13244-024-01650-7
    reference_title: 'The differences between carotid web and carotid web with plaque: based on multimodal ultrasonic and clinical characteristics'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: A thin triangular endoluminal defect is identified as a typical feature of the web on superb microvascular imaging
    explanation: A primary multimodal imaging study documents morphology, not a universally validated screening threshold.
- name: Silent ipsilateral cerebral infarctions
  modality: MRI
  description: Prior cortical or cortico-subcortical infarcts can be visible without a corresponding clinical stroke history. In the 92-person cohort, only seven patients had ipsilateral silent infarcts; their association with recurrence requires caution.
  evidence:
  - reference: PMID:34102760
    reference_title: 'Stroke Recurrence in First-Ever Symptomatic Carotid Web: A Cohort Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: SCI ipsilateral to the index CIE were found in seven patients (7.6%)
    explanation: Reports the small subgroup in which recurrence association was studied.
  - reference: PMID:34102760
    reference_title: 'Stroke Recurrence in First-Ever Symptomatic Carotid Web: A Cohort Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: All SCIs were cortical or cortico-subcortical lesions.
    explanation: Documents the imaging distribution.

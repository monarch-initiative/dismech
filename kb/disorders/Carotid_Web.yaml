    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: the benefit of immediate dual antiplatelet or anticoagulation therapy remains unclear, particularly in medium to large strokes where there is an elevated risk of hemorrhage
    explanation: The discussion highlights uncertainty about escalation of antithrombotic treatment, not a demonstrated benefit.
  therapeutic_modality: SMALL_MOLECULE
- name: Carotid endarterectomy
  description: Selected symptomatic patients undergo surgical excision of the web, removing a local embolic source and permitting histological examination. Retrospective series report low recurrence but have no randomized medical control; cranial-nerve injury is a procedural risk.
  therapeutic_modality: SURGERY

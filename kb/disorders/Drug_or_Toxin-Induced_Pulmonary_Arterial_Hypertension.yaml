      novel clinical and basic science studies are beginning to unravel the biologic factors and genetic underpinnings responsible for disease development.
    explanation: Supports host genetic predisposition as a broader modifier of drug- and toxin-induced PAH risk.
diagnosis:
- name: Right heart catheterization
  description: >-
    Diagnosis requires invasive confirmation of pre-capillary PAH physiology,
    the same group-1 (PAH) hemodynamic triad used across the other PAH
    entries.
  diagnosis_term:
    preferred_term: right heart catheterization
    term:
      id: NCIT:C80411
      label: Right Heart Catheterization
  measurements:
  - preferred_term: mean pulmonary artery pressure
    term:
      id: LOINC:8414-5
      label: Pulmonary artery Mean blood pressure
  - preferred_term: pulmonary artery wedge pressure
    term:
      id: LOINC:8587-8
      label: Pulmonary artery wedge Mean blood pressure
  - preferred_term: pulmonary vascular resistance
    term:
      id: LOINC:8828-6
      label: Pulmonary vascular Resistance
  reference_ranges:
  - loinc_term:
      id: LOINC:8414-5
      label: Pulmonary artery Mean blood pressure
    unit: mmHg
    population: >-
      Pre-capillary (group 1, PAH) hemodynamic definition (2022 ESC/ERS PH
      guidelines, as retained by the 7th WSPH (2024) task force)
    notes: >-
      The same PMID:39209475 triad bound on the
      Idiopathic_Pulmonary_Arterial_Hypertension and
      Heritable_Pulmonary_Arterial_Hypertension entries; see the IPAH entry's
      PVR-band notes for the PVR-threshold history.

      Boundary: the criterion is mPAP >20 mmHg (strict); lower_bound is 21,
      the whole-number half-open convention used across this entry family, so
      a value of exactly 20 mmHg is not misclassified as meeting the criterion.
    evidence:
    - reference: PMID:39209475
      reference_title: Definition, classification and diagnosis of pulmonary hypertension.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Pulmonary hypertension (PH) is a haemodynamic condition characterised by elevation of mean pulmonary arterial pressure (mPAP) >20 mmHg, assessed by right heart catheterisation. Pulmonary arterial wedge pressure (PAWP) and pulmonary vascular resistance (PVR) distinguish pre-capillary PH (PAWP ≤15 mmHg, PVR >2 Wood Units (WU)), isolated post-capillary PH (PAWP >15 mmHg, PVR ≤2 WU) and combined post- and pre-capillary PH (PAWP >15 mmHg, PVR >2 WU)."
      explanation: States the current, 2022 ESC/ERS-adopted mPAP component of the pre-capillary PAH triad, reproduced below as an interpretation band.
    interpretation_bands:
    - name: Pre-capillary PH criterion met (mPAP)
      lower_bound: 21
      unit: mmHg
      abnormal_flag: HIGH
      interpretation: Meets the mPAP (>20 mmHg) component of the pre-capillary PAH triad.
  - loinc_term:
      id: LOINC:8587-8
      label: Pulmonary artery wedge Mean blood pressure
    unit: mmHg
    population: >-
      Pre-capillary (group 1, PAH) hemodynamic definition (2022 ESC/ERS PH
      guidelines, as retained by the 7th WSPH (2024) task force)
    notes: >-
      The source states the criterion inclusively ("PAWP <=15 mmHg"). Because
      PAWP is reported clinically in whole mmHg, the band below places its
      upper_bound at 16 so a measured value of exactly 15 still falls inside
      the "normal" band, the same whole-number half-open placement the
      Heart_Failure entry's HFrEF/HFmrEF split uses (41, not 40).
    evidence:
    - reference: PMID:39209475
      reference_title: Definition, classification and diagnosis of pulmonary hypertension.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Pulmonary hypertension (PH) is a haemodynamic condition characterised by elevation of mean pulmonary arterial pressure (mPAP) >20 mmHg, assessed by right heart catheterisation. Pulmonary arterial wedge pressure (PAWP) and pulmonary vascular resistance (PVR) distinguish pre-capillary PH (PAWP ≤15 mmHg, PVR >2 Wood Units (WU)), isolated post-capillary PH (PAWP >15 mmHg, PVR ≤2 WU) and combined post- and pre-capillary PH (PAWP >15 mmHg, PVR >2 WU)."
      explanation: States the PAWP component of the pre-capillary PAH triad, reproduced below as an interpretation band.
    interpretation_bands:
    - name: Pre-capillary PH criterion met (PAWP normal)
      upper_bound: 16
      unit: mmHg
      abnormal_flag: NORMAL
      interpretation: >-
        PAWP 15 mmHg or below (whole-mmHg resolution), the
        normal-left-filling-pressure component of the pre-capillary PAH triad.
  - loinc_term:
      id: LOINC:8828-6
      label: Pulmonary vascular Resistance
    unit: Wood unit
    population: >-
      Pre-capillary (group 1, PAH) hemodynamic definition (2022 ESC/ERS PH
      guidelines, as retained by the 7th WSPH (2024) task force)
    notes: >-
      This threshold moved from PVR >=3 Wood units (3rd WSPH, 2003, carried
      unchanged through the 2019 mPAP revision; PMID:30545968's own "best
      defined by" sentence still pairs the new mPAP with this older PVR
      figure) to PVR >2 Wood units in the 2022 ESC/ERS guideline. See the
      Idiopathic_Pulmonary_Arterial_Hypertension entry's matching band for
      the quoted sentence flagging the lower cut-off as the eventual
      direction of travel, and the fuller history.

      Boundary: the criterion is PVR >2 WU (strict), but the band's
      lower_bound: 2 technically includes a measured value of exactly 2.0 WU
      under the half-open convention. Unlike mPAP and PAWP this is not fixed
      by bumping to the next whole number: PVR is reported with decimal
      precision in the literature (e.g. "PVR 2-3 WU" as a real continuous
      zone), so lower_bound: 3 would wrongly exclude a genuinely elevated
      value such as PVR 2.5 WU. See the IPAH entry's matching band for the
      fuller reasoning.
    evidence:
    - reference: PMID:39209475
      reference_title: Definition, classification and diagnosis of pulmonary hypertension.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Pulmonary hypertension (PH) is a haemodynamic condition characterised by elevation of mean pulmonary arterial pressure (mPAP) >20 mmHg, assessed by right heart catheterisation. Pulmonary arterial wedge pressure (PAWP) and pulmonary vascular resistance (PVR) distinguish pre-capillary PH (PAWP ≤15 mmHg, PVR >2 Wood Units (WU)), isolated post-capillary PH (PAWP >15 mmHg, PVR ≤2 WU) and combined post- and pre-capillary PH (PAWP >15 mmHg, PVR >2 WU)."
      explanation: States the current, 2022 ESC/ERS-adopted PVR component of the pre-capillary PAH triad, reproduced below as an interpretation band.
    interpretation_bands:
    - name: Pre-capillary PH criterion met (PVR)
      lower_bound: 2
      unit: Wood unit
      abnormal_flag: HIGH
      interpretation: Meets the current PVR component of the pre-capillary PAH triad.
  evidence:
  - reference: DOI:10.3390/biomedicines13071773
    reference_title: "State of the Art in Pulmonary Arterial Hypertension: Molecular Basis, Imaging Modalities, and Right Heart Failure Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gold standard for diagnosis remains invasive right heart catheterization.
    explanation: This supports invasive hemodynamic confirmation.
- name: Exposure history and exclusion of alternate PH causes
  description: >-
    Diagnosis requires assessing exposure history to a causal prescription
    drug, anorexigen, toxin, or illicit stimulant (including urine drug
    screening where substance use is possible) and excluding alternate causes
    of pulmonary hypertension.
  diagnosis_term:
    preferred_term: medication and toxin exposure clinical evaluation and urine drug screening
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: DOI:10.21542/gcsp.2019.19
    reference_title: "Drug- and toxin-induced pulmonary arterial hypertension: Current state of the literature"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is often difficult to identify patients early and demonstrate causality between drugs and PAH.
    explanation: This supports careful exposure attribution and differential diagnosis.
  - reference: PMID:39209475
    reference_title: Definition, classification and diagnosis of pulmonary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine drug screening is recommended for all patients with idiopathic PAH or a history of substance use disorder, as methamphetamine use has been found to be a contributor when screening in cases formerly classified as idiopathic PAH
    explanation: Supports structured substance-exposure assessment and urine drug screening to distinguish stimulant-induced PAH from idiopathic PAH.
- name: Vasoreactivity assessment at index catheterization
  description: >-
    Acute pulmonary vasoreactivity testing is performed during index diagnostic
    right heart catheterization in drug- or toxin-induced PAH to identify the
    subset (~12%) of acute responders who may benefit from long-term high-dose
    calcium channel blocker therapy.
  diagnosis_term:
    preferred_term: acute pulmonary vasoreactivity testing during right heart catheterization
    term:
      id: NCIT:C80411
      label: Right Heart Catheterization
  evidence:
  - reference: PMID:39209475
    reference_title: Definition, classification and diagnosis of pulmonary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A positive acute response to vasoreactivity testing is observed in ∼12% of patients with idiopathic PAH or PAH associated with drugs and toxins, and in a smaller proportion (<5%) in heritable PAH
    explanation: Directly establishes acute vasoreactivity testing applicability and responder rate (~12%) in drug- and toxin-associated PAH.
treatments:
- name: Culprit drug or toxin withdrawal
  description: >-
    Removal of the implicated exposure is central when feasible; reversibility
    varies by agent and disease severity, with partial or complete hemodynamic
    recovery reported after dasatinib or interferon discontinuation, whereas
    anorexigen- and methamphetamine-associated PAH rarely remit with cessation
    alone.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: discontinuation of culprit drug or toxin exposure
    term:
      id: NCIT:C128535
      label: Pharmacotherapy Discontinuation
  target_mechanisms:
  - target: Drug/toxin-triggered pulmonary endothelial dysfunction
    treatment_effect: INHIBITS
    description: Removing the culprit exposure reduces ongoing exposure-driven vascular injury when reversible.
  evidence:
  - reference: PMID:23972547
    reference_title: Drugs induced pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dasatinib, a dual Src/Abl kinase inhibitor, used in the treatment of chronic myelogenous leukaemia was associated with cases of severe PAH, in part reversible after its withdrawal.
    explanation: This directly supports reversibility after withdrawal for a recognized culprit drug.
- name: Risk-stratified PAH pathway therapy
  description: >-
    Persistent or higher-risk disease is treated using standard PAH
    pathway-based therapies targeting the endothelin-1, nitric oxide,
    prostacyclin, and BMP/activin signaling axes, typically in combination and
    escalated up to four-drug therapy by risk stratum.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: endothelin receptor antagonist
      term:
        id: NCIT:C28313
        label: Endothelin Receptor Antagonist
    - preferred_term: sildenafil
      term:
        id: NCIT:C61940
        label: Sildenafil
    - preferred_term: tadalafil
      term:
        id: NCIT:C47743
        label: Tadalafil
    - preferred_term: epoprostenol
      term:
        id: NCIT:C61748
        label: Epoprostenol
    - preferred_term: sotatercept
      term:
        id: NCIT:C80038
        label: Sotatercept
  notes: >-
    Typed therapeutic_modality OTHER because risk-stratified combination
    regimens span oral and parenteral small-molecule vasodilators together with
    the activin receptor IIA-Fc fusion protein sotatercept.
  target_mechanisms:
  - target: Pulmonary vascular remodeling and increased resistance
    treatment_effect: MODULATES
    description: PAH pathway therapies modulate vasoconstriction and proliferative signaling that drive elevated pulmonary vascular resistance.
  evidence:
  - reference: DOI:10.1183/13993003.01325-2024
    reference_title: Treatment algorithm for pulmonary arterial hypertension
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current therapies have mechanisms of action involving signalling via one of four pathways: endothelin-1, nitric oxide, prostacyclin and bone morphogenetic protein/activin signalling.
    explanation: This supports pathway-targeted PAH therapy.
  - reference: DOI:10.1183/13993003.01325-2024
    reference_title: Treatment algorithm for pulmonary arterial hypertension
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Efficacy has generally been greater with therapeutic combinations and with parenteral therapy compared with monotherapy or nonparenteral therapies, and maximal medical therapy is now four-drug therapy.
    explanation: This supports combination and escalation strategies in PAH management.
progression:
- phase: Methamphetamine-associated prognosis
  notes: >-
    Methamphetamine-associated PAH carries worse hemodynamics and lower 5- and
    10-year survival (47.2% and 25%, respectively) than idiopathic PAH (64.5%
    and 45.7%) in prospective cohort comparison.
  evidence:
  - reference: DOI:10.21542/gcsp.2019.19
    reference_title: "Drug- and toxin-induced pulmonary arterial hypertension: Current state of the literature"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kaplan-Meier analysis demonstrated a 5-year and 10-year survival of 47 .2% and 25% respectively in Meth-APAH vs 64.5% and 45.7% in IPAH.
    explanation: Directly quantifies poorer 5- and 10-year survival in methamphetamine-associated PAH compared with idiopathic PAH.
  - reference: DOI:10.1183/13993003.01325-2024
    reference_title: Treatment algorithm for pulmonary arterial hypertension
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary arterial hypertension leads to significant impairment in haemodynamics, right heart function, exercise capacity, quality of life and survival.
    explanation: Supports survival and right-heart hemodynamic impairment as core outcome dimensions across PAH.

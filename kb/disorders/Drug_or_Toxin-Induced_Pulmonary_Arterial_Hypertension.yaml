pathophysiology:
- name: BMPR2 receptor signaling predisposition
  description: >-
    Germline heterozygous loss-of-function variants in BMPR2 impair bone
    morphogenetic protein receptor serine/threonine kinase activity, lowering
    the threshold of drug or anorexigen exposure needed to precipitate overt
    pulmonary arterial hypertension in a gene-environment two-hit model.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BMPR2
    term:
      id: hgnc:1078
      label: BMPR2
  molecular_functions:
  - preferred_term: BMP receptor activity
    term:
      id: GO:0098821
      label: BMP receptor activity
  genetic_context:
    variant_origin: GERMLINE
  evidence:
  - reference: DOI:10.21542/gcsp.2019.19
    reference_title: "Drug- and toxin-induced pulmonary arterial hypertension: Current state of the literature"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients carrying a BMPR2 mutation had significantly lower duration of exposure to fenfluramine than non-carriers prior to developing PAH
    explanation: >-
      Demonstrates that germline BMPR2 variants act as a host molecular
      predisposition that accelerates fenfluramine-associated PAH onset.
  downstream:
  - target: Drug/toxin-triggered pulmonary endothelial dysfunction
    description: >-
      Reduced baseline BMPR2 receptor activity lowers pulmonary endothelial
      resilience to drug- or toxin-mediated vascular injury.
- name: Drug/toxin-triggered pulmonary endothelial dysfunction
  description: >-
    Culprit drugs or toxins can injure or dysregulate pulmonary arterial
    endothelium, creating a permissive vascular state for downstream smooth
    muscle growth and remodeling.

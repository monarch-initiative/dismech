  evidence:
  - reference: PMID:21540130
    reference_title: A 17q12 chromosomal duplication associated with renal disease and esophageal atresia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, we showed herein, that renal malformations may be part of the
      17q12 duplication syndrome.
    explanation: >-
      The paper that added renal malformation to the duplication phenotype. Its
      own introduction states the prior belief it overturned, that duplication
      carriers had no renal disorder.
  - reference: PMID:27409573
    reference_title: 17q12 deletion and duplication syndrome in Denmark-A clinical cohort of 38 patients and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we extend the list of features seen in both patient categories to include
      strabismus, esophageal defects, and duodenal atresia.
    explanation: >-
      Adds the two atresias to the shared deletion/duplication feature list,
      which is where this node's gastrointestinal content comes from.

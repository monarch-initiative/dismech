genetic:
- name: HNF1B
  gene_term:
    preferred_term: HNF1B
    term:
      id: hgnc:11630
      label: HNF1B
  relationship_type: CAUSATIVE
  notes: >-
    HNF1B is the gene the literature treats as the dosage-sensitive driver of the
    17q12 interval, and it is the gene whose point mutations and whole-gene
    deletion cause MODY5 and renal cystic disease. Its role in the duplication is
    an inference from that, plus the zebrafish overexpression result: no study has
    shown which interval gene produces which duplication phenotype. The
    relationship is recorded as CAUSATIVE because the duplication is causative and
    HNF1B is in it, not because HNF1B-specific causation has been demonstrated for
    the duplication phenotype.
  evidence:
  - reference: PMID:17924346
    reference_title: Recurrent reciprocal genomic rearrangements of 17q12 are associated with renal disease, diabetes, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of the microdeletions, identified in a fetus with multicystic dysplastic
      kidneys, encompasses the TCF2 gene on 17q12, previously shown to be mutated
      in maturity-onset diabetes, as well as in a subset of pediatric renal
      abnormalities.
    explanation: >-
      Establishes HNF1B (TCF2) as the gene of interest in the interval. Note it
      describes the deletion, which is exactly the inferential step this entry
      flags rather than hides.
- name: LHX1
  gene_term:
    preferred_term: LHX1
    term:
      id: hgnc:6593
      label: LHX1
  relationship_type: UNKNOWN
  notes: >-
    LHX1 is a LIM-homeobox transcription factor inside the duplicated interval and
    is named alongside HNF1B in every description of the region's gene content. No
    study attributes a specific duplication phenotype to LHX1 dosage, so the
    relationship is left UNKNOWN rather than asserted.
  evidence:
  - reference: PMID:27409573
    reference_title: 17q12 deletion and duplication syndrome in Denmark-A clinical cohort of 38 patients and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aberrations encompass the genes, HNF1B, LHX1, and ACACA, among others.
    explanation: >-
      Places LHX1 in the interval. That is the whole of what is established about
      its role here.
- name: ACACA
  gene_term:
    preferred_term: ACACA
    term:
      id: hgnc:84
      label: ACACA
  relationship_type: UNKNOWN
  notes: >-
    ACACA encodes acetyl-CoA carboxylase alpha and sits in the duplicated
    interval. It is the only interval gene for which a narrowing observation
    exists: one tic-disorder case carried a 110 kb duplication containing ACACA
    alone. That is a single case, and the odds ratio computed from it is
    correspondingly wide, so it is a lead about where the neuropsychiatric signal
    sits rather than a gene-disease assertion.
  evidence:
  - reference: PMID:40894066
    reference_title: Persistent Tic Disorders Are Associated With 17q12 Duplications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight cases and one control carried the canonical ~1.4 Mb duplication at
      chr17:34.8 - 36.2 Mb, while one additional case had a smaller 110 kb
      duplication within this known CNV that included only one gene, ACACA
    explanation: >-
      The single-case narrowing observation, quoted with its denominator rather
      than only its odds ratio.
diagnosis:
- name: Chromosomal microarray analysis
  description: >-
    The duplication is about 1.4 Mb, below the resolution of a karyotype, so
    chromosomal microarray is the diagnostic test. Prenatally, SNP-array or
    CNV-seq on amniotic fluid is the equivalent. Parental testing follows,
    because inheritance from an apparently unaffected parent is common and
    changes the recurrence risk.
  evidence:
  - reference: PMID:26925472
    reference_title: 17q12 Recurrent Duplication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis is established in a proband by detection of the
      1.4-megabase heterozygous recurrent duplication at chromosome 17q12 by
      chromosomal microarray testing or other genomic methods.
    explanation: >-
      The GeneReviews diagnostic criterion, which fixes both the size of the
      canonical duplication and the test that establishes it.
  - reference: PMID:27409573
    reference_title: 17q12 deletion and duplication syndrome in Denmark-A clinical cohort of 38 patients and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      17q12 deletions and duplications are two distinct, recurrent chromosomal
      aberrations usually diagnosed by chromosomal microarray analysis (CMA).
    explanation: Names the diagnostic modality for both rearrangements.
  - reference: PMID:39433644
    reference_title: "Prenatal diagnosis, ultrasound findings, and pregnancy outcome of 17q12 deletion and duplication syndromes: a retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral blood from the parents was extracted to determine whether the
      CNVs in the fetuses were inherited or de novo.
    explanation: >-
      The parental testing step, as performed in the prenatal series. It is what
      converts a fetal finding into a recurrence risk.
differential_diagnoses:
- name: Chromosome 17q12 deletion syndrome
  description: >-
    The reciprocal rearrangement at the same breakpoints. It shares renal
    disease, learning disability, behavioural abnormality, epilepsy, autism,
    schizophrenia, structural brain anomalies, facial dysmorphism and joint
    laxity with the duplication, but its renal and diabetes phenotype (RCAD /
    MODY5) is far more consistent. Microarray distinguishes them immediately;
    clinical features do not.
  distinguishing_features:
  - Delayed language development, learning disability, kidney involvement and eye
    dysmorphism with strabismus are the features most consistently shared among
    deletion patients.
  - The duplication group is characterised instead by an extremely wide and less
    predictable spectrum, weighted toward neurodevelopmental and psychiatric
    features rather than renal disease and diabetes.
  evidence:
  - reference: PMID:27409573
    reference_title: 17q12 deletion and duplication syndrome in Denmark-A clinical cohort of 38 patients and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delayed language development, learning disability, kidney involvement, and
      eye dysmorphism and strabismus were the most consistently shared features
      among patients with 17q12 deletion.
    explanation: >-
      The deletion's own consistent-feature list, which is what the duplication
      has to be distinguished from.
treatments:
- name: Multidisciplinary supportive management
  description: >-
    There is no disease-specific or curative treatment. Management is
    symptom-directed across developmental, psychiatric, renal, cardiac and
    surgical domains as each applies to the individual.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Neurodevelopmental and Neuropsychiatric Dysfunction
    description: >-
      Addresses the functional consequences of the neurodevelopmental phenotype.
      Nothing available modifies the gene dosage that causes it.
  evidence:
  - reference: PMID:38379631
    reference_title: "Complex neuropsychiatric presentation of 17q12 duplication syndrome: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment involves a multidisciplinary approach
    explanation: >-
      The management principle. It is a case report's framing rather than a
      guideline, which is the strongest statement available for this disorder.
- name: Developmental, psychological and seizure surveillance
  description: >-
    GeneReviews specifies regular assessment of psychomotor development for every
    child with the duplication, psychological evaluation in both affected
    children and adults, monitoring for new-onset seizures, growth and
    nutritional assessment, and assessment of family needs at each visit. The
    adult psychological arm is the part most easily dropped, and it is the part
    the schizophrenia and tic associations argue for.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: clinical surveillance
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  target_mechanisms:
  - target: Neurodevelopmental and Neuropsychiatric Dysfunction
    description: >-
      Detects developmental, psychiatric and seizure manifestations early enough
      to intervene. It does not modify the underlying dosage imbalance.
  evidence:
  - reference: PMID:26925472
    reference_title: 17q12 Recurrent Duplication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Regular assessment of psychomotor development is recommended for all
      children with the 17q12 recurrent duplication as well as psychological
      evaluation in both affected children and adults. Monitor for new-onset
      seizures, growth and nutritional assessment, and assessment of family needs
      at each visit.
    explanation: The GeneReviews surveillance schedule for this duplication.
  - reference: PMID:26925472
    reference_title: 17q12 Recurrent Duplication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Presymptomatic diagnosis and treatment is warranted in at-risk relatives to
      identify as early as possible those who would benefit from close
      assessment/monitoring of developmental milestones in childhood or
      psychological assessment/intervention through adulthood.
    explanation: >-
      The recommendation to test and follow at-risk relatives, which is what
      makes cascade testing an intervention rather than only information.
- name: Genetic counselling and cascade testing
  description: >-
    Counselling is the intervention with the most to offer here and the hardest
    to deliver, because penetrance is incomplete, expressivity is wide, and the
    burden observed depends on whether the family was ascertained on the
    duplication or on a phenotype. The Danish cohort states that difference
    explicitly and offers it as material for prenatal counselling.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  target_mechanisms:
  - target: NAHR Between 17q12 Segmental Duplications
    description: >-
      Counselling acts on the lesion only in the reproductive sense: it addresses
      the recurrence risk of the non-allelic homologous recombination event and
      the transmission of an inherited duplication. It changes nothing downstream
      of the lesion in a person who already carries it.
  - target: Neurodevelopmental and Neuropsychiatric Dysfunction
    description: >-
      Cascade testing identifies at-risk relatives early enough for
      developmental monitoring in childhood and psychological assessment in
      adulthood, which is the chapter's stated reason for testing them. The
      benefit is earlier detection, not modification of the phenotype.
  evidence:
  - reference: PMID:27409573
    reference_title: 17q12 deletion and duplication syndrome in Denmark-A clinical cohort of 38 patients and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assessing index patients and non-index patients separately, our
      observations illustrate that an overall milder disease burden is seen, in
      particular in patients with 17q12 duplications who are ascertained on the
      duplication rather than the phenotype. This evidence may be useful in
      prenatal counseling.
    explanation: >-
      The ascertainment effect and the authors' own statement of its counselling
      use. This is the single most important sentence for anyone applying this
      entry's frequencies to a newly ascertained carrier.
  - reference: PMID:39286125
    reference_title: Prenatal diagnosis of 17q12 copy number variants in fetuses via chromosomal microarray analysis - A retrospective cohort study and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      17q12 copy number variants (CNVs) have variable presentations and
      incomplete penetrance, challenging prenatal counseling and management
    explanation: >-
      States the counselling problem directly. It opens the paper's structured
      PURPOSE section, so it frames the study rather than reporting its result.
- name: Neurologist-managed antiseizure therapy
  description: >-
    GeneReviews directs that seizures be managed by a neurologist using standard
    practice; nothing about the duplication changes which antiseizure medicines
    are indicated. One caution is specific enough to record: a 14-year-old
    carrier on valproate monotherapy at therapeutic dosing, with no other risk
    factor, developed acute pancreatitis that resolved on discontinuation and was
    rated probable on the Naranjo scale. The authors state this genetic
    background had not previously been reported with valproate pancreatitis and
    that more evidence is needed, so this is a single-case signal rather than an
    established contraindication, and it is recorded that way here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiseizure pharmacotherapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  target_mechanisms:
  - target: Seizure
    description: >-
      Suppresses the seizures that are present in 36% of carriers. It does not
      act on the dosage imbalance upstream of them.
  evidence:
  - reference: PMID:26925472
    reference_title: 17q12 Recurrent Duplication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Seizures should be managed by a neurologist using standard practice.
    explanation: >-
      The management instruction. It is deliberately unspecific about agent,
      which is why the valproate caution below is worth recording separately.
  - reference: PMID:41700275
    reference_title: Valproic Acid-Induced Pancreatitis in a Pediatric Patient With 17q12 Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This adverse effect occurred with VPA monotherapy at therapeutic dosing in
      the absence of risk factors, in the setting of 17q12 duplication syndrome,
      ADHD, and ASD.
    explanation: >-
      The observation itself, with the two features that make it worth recording:
      monotherapy and no other risk factor. Polypharmacy is the usual setting for
      this adverse reaction, so its absence is what leaves the duplication as a
      candidate.
  - reference: PMID:41700275
    reference_title: Valproic Acid-Induced Pancreatitis in a Pediatric Patient With 17q12 Duplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presence of a 17q12 duplication syndrome in association with VPA-induced
      pancreatitis has not been previously described, possibly suggesting a
      previously unknown susceptibility, although more evidence is needed.
    explanation: >-
      The authors' own limit on the claim, quoted so that this treatment record
      cannot be read as asserting a susceptibility. One case with no rechallenge
      cannot establish one, and no pathophysiology node is created for it.
- name: Feeding therapy
  description: >-
    Feeding therapy as needed, one of the GeneReviews treatment-of-manifestations
    items. It follows from the hypotonia rather than from any gene-specific
    mechanism, and the chapter gives no frequency for feeding difficulty in this
    duplication.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: feeding therapy
    term:
      id: NCIT:C156237
      label: Swallowing Therapy
  target_mechanisms:
  - target: Hypotonia
    description: >-
      Addresses the oral-motor consequence of the hypotonia. It does not treat
      the hypotonia itself.
  evidence:
  - reference: PMID:26925472
    reference_title: 17q12 Recurrent Duplication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Seizures should be managed by a neurologist using standard practice.
      Feeding therapy as needed.
    explanation: >-
      "Feeding therapy as needed" is the chapter's whole statement on it, and is
      quoted with the sentence before it because four words cannot evidence
      anything on their own. Nothing more specific is published for this
      duplication, and the terseness is the reason this row carries no frequency
      and no protocol.
discussions:
- discussion_id: gap_17q12dup_which_gene_carries_the_neuropsychiatric_signal
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which gene in the 17q12 interval carries the neurodevelopmental and
    neuropsychiatric signal of the duplication?
  attaches_to:
  - "pathophysiology#Increased 17q12 Gene Dosage"
  - "genetic#ACACA"
  rationale: >-
    Every mechanistic account of this syndrome routes through HNF1B, and the
    reason is historical rather than experimental: HNF1B is the gene whose point
    mutations cause MODY5 and renal cystic disease, so it was the gene everyone
    already knew about when the CNV was found. The only evidence that actually
    discriminates between interval genes points elsewhere, to a single
    tic-disorder case with a 110 kb duplication containing ACACA alone. One case
    cannot settle it, and the confidence interval on its odds ratio will be very
    wide, but it is the only observation in the literature that narrows the
    interval at all, and it does not narrow it onto HNF1B. The zebrafish
    overexpression result, which is the strongest mechanistic evidence for the
    gain direction, tests the HNF1B ortholog and so cannot distinguish the two
    hypotheses either. The stake is practical: if the neuropsychiatric phenotype
    is ACACA-driven, small intragenic duplications reported by microarray would
    need different interpretation from the canonical CNV.
  proposed_experiments:
  - experiment_id: exp_17q12dup_atypical_cnv_breakpoint_series
    name: Phenotype series of atypical, non-canonical 17q12 duplications
    description: >-
      Assemble carriers of 17q12 duplications whose breakpoints do not match the
      canonical NAHR interval, from clinical microarray archives, and compare
      neurodevelopmental and psychiatric outcome by which interval genes each
      duplication contains. Atypical breakpoints are the only natural experiment
      available for separating the interval's genes in humans.
- discussion_id: gap_17q12dup_penetrance_denominator
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the penetrance of the 17q12 duplication in an unselected carrier, as
    opposed to in a carrier ascertained through a clinic?
  attaches_to:
  - "prevalence#Danish national 17q12 cohort, phenotyped patients"
  rationale: >-
    Almost everything known about this syndrome's frequency comes from series
    that recruited on a phenotype, whether developmental delay, schizophrenia,
    tics or a fetal ultrasound anomaly, and the one cohort that separated index
    from non-index patients found a milder burden in those ascertained on the
    duplication. Newborn CNV screening gives a clean prevalence for recurrent NDD
    CNVs as a class, but not a duplication-specific penetrance, and the two
    published case-control odds ratios (schizophrenia, tics) are risk ratios
    rather than penetrance. The result is that a carrier found incidentally, for
    example on a prenatal microarray done for another indication, cannot be given
    a numeric risk for any of the features in this entry. That is the situation
    the prenatal literature describes as challenging counselling, and it is a gap
    in evidence rather than in mechanism.
  proposed_experiments:
  - experiment_id: exp_17q12dup_biobank_recall
    name: Phenotype recall of 17q12 duplication carriers found in population biobanks
    description: >-
      Identify 17q12 duplication carriers in unselected population biobanks with
      linked health records, and estimate the frequency of intellectual
      disability, autism, epilepsy, tic disorder, schizophrenia and renal anomaly
      among them without conditioning on any of those phenotypes.
notes: >-
  Scope and lump/split. This is the duplication, and it is a separate Disease
  entry from Chromosome_17q12_Deletion_Syndrome rather than a subtype row on it.
  The two lesions share breakpoints and a gene list, but the Danish national
  cohort reports different consistent features for each, and the deletion's
  renal-and-diabetes phenotype is not the duplication's. MONDO:0013796 was bound
  nowhere in kb/ before this entry. The deletion entry is not edited by this
  change; cross-linking the two is a follow-on.

  Whose cohort a number comes from. Three different denominators appear in this
  entry and they are not interchangeable: the Danish national cohort (26
  phenotyped duplication patients, a mix of index and family members), the
  Chinese prenatal series (seven duplication fetuses, all ascertained on an
  ultrasound anomaly), and the Norwegian newborn trios (unselected, but reporting
  the 26 recurrent NDD CNVs as a class rather than this one). Each record says
  which it is. The schema has no structured place for that, so it lives in
  descriptions and notes and is not queryable, which matters more here than in
  most entries, because the whole clinical difficulty of this syndrome is that
  its numbers depend on how the carrier was found.

  Frequency bands, and where they stop. A band is assigned only where a source
  states how many carriers have the feature, or uses a quantifier the HPO bands
  are defined against. FREQUENT covers learning disability, language delay and
  motor delay, which the national cohort names as characteristic of the
  duplication group, plus hypotonia and seizures, for which GeneReviews gives
  "most affected individuals" and 36% respectively. OCCASIONAL covers the
  features the chapter reports "in some affected individuals": short stature,
  cardiac abnormality and behavioural abnormality. Everything else carries no
  frequency at all, and that is deliberate rather than incomplete. The
  schizophrenia and tic findings are odds ratios from case-control studies, which
  say how much more likely a carrier is to have the trait, not how many carriers
  do; the malformations come from a seven-fetus prenatal series ascertained on
  the malformations themselves; and attention deficit disorder appears only in
  review lists and individual case reports. Converting any of those into an HPO
  frequency band would manufacture a number the literature does not contain.

  What the mechanism does and does not claim. The pathograph asserts dosage
  imbalance of the interval, not HNF1B-specific causation. Only one experiment
  anywhere tests the gain direction, zebrafish vhnf1 overexpression expanding the
  hindbrain valentino domain, and it is graded MODEL_ORGANISM. Everything between
  that and the human phenotype is INDIRECT_UNKNOWN_INTERMEDIATES, because nothing
  published fills it in. Attributing the neurodevelopmental phenotype to HNF1B
  specifically would be the most natural-sounding claim in the entry and is not
  supported; the competing ACACA observation is curated as a knowledge gap
  instead.

  Deep research. One OpenScientist run, committed. `just preflight-dr` returned
  SKIP, which means unchecked, because MONDO records no causal gene for
  MONDO:0013796. Manual fallback: HNF1B 33 mentions, LHX1 13, ACACA 12, against 3
  for ARX, which appears only as a co-occurring variant in one family. Right
  entity. The report's own term validation flagged four NCIT identifiers whose
  labels name unrelated concepts (C15318 offered as "Rehabilitation Therapy" but
  named Reproducibility; C15328 as "Behavioral Therapy" but named Splenectomy;
  C15311 as "Monitoring" but named Quality Control; C265 as "Antipsychotic Agent"
  but named Antidepressant Agent). None of those is bound in this entry. Its
  reference validation flagged two quotes as not found in their sources; both
  turned out to be truncations of real sentences rather than inventions, and
  where this entry quotes those papers it quotes the full sentence.

  A note on the report's own validation sections. The run wrote neither the
  reference_validation frontmatter block nor the Reference Validation and Term
  Validation sections, although the validators demonstrably ran: their warnings
  appear in the run log. Both sections were recovered afterwards with
  `just validate-research-reference`, and the committed report carries them. It
  matters because a reader of the report as first written would have had no way
  to know two quotes had failed.

  What is deliberately absent. No datasets: block, because no dataset specific to
  the duplication was identified, and searching the interval genes returns the
  much larger HNF1B renal and diabetes literature, which is the reciprocal
  deletion's disease. No clinical_trials: block; none found. No environmental:
  block; this is a genomic disorder with no established environmental
  contributor. No animal_models: block; the zebrafish vhnf1 work is curated as
  evidence on the patterning node, but it is a study of the ortholog's function
  rather than a model of this syndrome, and recording it as an animal model of
  17q12 duplication would overstate what was done. GeneReviews. PMID:26925472, 17q12 Recurrent Duplication, is the
  baseline chapter, is tagged in references:, and is mined here for the de novo
  fraction, the diagnostic criterion, the seizure frequency, five additional
  phenotypes and the surveillance schedule.

  How it was found, and what that says about the run. The OpenScientist report
  does not cite the chapter, and neither did this entry's first draft, which
  stated in these notes that no GeneReviews chapter existed. `just
  check-genereviews` found it, but only on the second run: the first run was
  against a draft that had a name and a MONDO term and no synonyms, and the
  chapter matches on the synonym "17q12 recurrent duplication" rather than on the
  entry name. So the order matters. Running the check before synonyms are written
  produces a confident NO_CHAPTER for an entry that has one. Two claims in the
  first draft were wrong as a result and are corrected above: the de novo
  fraction (the class-wide 34% was used where the locus-specific figure is about
  10%) and the absence of a numeric seizure frequency (the chapter gives 36%).

  Review round 1. Five things changed. Two behavioural rows were missing and are
  added: atypical behavior, which the entry was already quoting in the autism
  row's snippet without modelling, and attention deficit hyperactivity disorder.
  The valproate case report is now a treatment record rather than an
  undispositioned research finding; it is deliberately not a pathophysiology
  node, because one case with no rechallenge does not establish a susceptibility
  and the authors say so in the sentence quoted against it. Variable Organ
  Malformation contradicted itself, naming cardiac malformation in its
  description and strabismus in its evidence while wiring neither; both are now
  wired and the description says why strabismus sits in that branch. Hypotonia
  was an orphan row and is now downstream of the neurodevelopmental node. Two
  GeneReviews management items, neurologist-managed seizures and feeding therapy,
  were unmodelled and are added. The surveillance treatment bound
  NCIT:C49236 Therapeutic Procedure, which has no precedent in kb/ for a
  monitoring activity; NCIT:C15719 Surveillance is the obvious replacement but is
  not reachable from NCIT:C25218 and fails the TreatmentActionTerm enum, so the
  binding is NCIT:C124351 Clinical Evaluation.

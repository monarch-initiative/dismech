- name: Variable Organ Malformation
  biological_scale: ORGANISM
  description: >-
    A second, much less consistent branch: structural and ocular anomalies
    outside the nervous system, comprising renal anomalies, esophageal atresia,
    duodenal atresia, cardiac malformation and strabismus. These overlap the
    deletion phenotype, and the literature had initially described duplication
    carriers as having no renal disorder before renal malformations were shown to
    be part of the duplication syndrome too. Strabismus is grouped here rather
    than with the neurodevelopmental branch because the sentence that puts it in
    the duplication phenotype is the same sentence that puts the two atresias
    there; no source separates the two mechanistically.
  locations:

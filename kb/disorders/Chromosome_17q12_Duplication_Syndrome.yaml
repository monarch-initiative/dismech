name: Chromosome 17q12 Duplication Syndrome
creation_date: "2026-09-17T16:17:48Z"
description: >-
  Chromosome 17q12 duplication syndrome is the copy-number gain at 17q12: a
  recurrent ~1.4-1.9 Mb interstitial duplication generated by non-allelic
  homologous recombination between the segmental duplications that flank the
  region. It is the reciprocal of the 17q12 deletion, and the two were described
  together in 2007 in the paper that called the pair "the first example of a
  recurrent genomic disorder associated with diabetes". The duplicated interval
  carries roughly 15 OMIM genes, of which HNF1B, LHX1 and ACACA are the ones the
  literature names.

  The two rearrangements are not mirror images clinically, and that asymmetry is
  the reason this entry is separate from the deletion entry rather than a
  subtype row on it. The deletion gives a comparatively specific
  renal-and-diabetes picture (RCAD / MODY5). The duplication gives a
  predominantly neurodevelopmental and neuropsychiatric one: learning disability
  of variable degree, delayed speech and delayed motor milestones, autism,
  epilepsy, behavioural problems, tics, and an increased risk of schizophrenia.
  Renal anomalies do occur, and esophageal and duodenal atresia are shared with
  the deletion, but they are far less consistent.

  Two features dominate any use of this entry. Penetrance is incomplete and
  expressivity is wide enough that the duplication is frequently inherited from
  an apparently unaffected parent; a three-generation family has been reported
  with full-scale IQ ranging from 52 to 99 among carriers. And the cohorts are
  ascertained in two quite different ways: series that recruit on the phenotype
  report a heavier burden than series that recruit on the duplication, which the
  Danish national cohort makes explicit and which is what makes prenatal
  counselling difficult. There is no disease-specific therapy; management is
  supportive and multidisciplinary.
synonyms:
- 17q12 duplication syndrome
- chromosome 17q12 microduplication syndrome
- 17q12 recurrent duplication
- dup(17)(q12)
- reciprocal 17q12 duplication

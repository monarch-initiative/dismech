inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The duplication segregates as an autosomal dominant trait with reduced
    penetrance. GeneReviews puts the de novo fraction at about 10%, so roughly
    nine carriers in ten inherited it, usually from a parent who is minimally
    affected or phenotypically normal. That locus-specific figure is lower than
    the 34% de novo rate measured across recurrent neurodevelopmental CNVs as a
    class in newborn trios, which is recorded below for contrast rather than as a
    figure for this duplication. The combination of dominant transmission,
    reduced penetrance and wide expressivity is what makes the recurrence risk
    easy to state and the prognosis hard to.
  evidence:
  - reference: PMID:26925472
    reference_title: 17q12 Recurrent Duplication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The 17q12 recurrent duplication is inherited in an autosomal dominant
      manner, with approximately 10% of duplications occurring de novo and
      approximately 90% inherited from a parent who is often minimally affected
      or phenotypically normal.
    explanation: >-
      The locus-specific de novo and inherited fractions, from the GeneReviews
      chapter for this duplication. It is the figure to use; the class-wide
      newborn figure below is context.
  - reference: PMID:30134084
    reference_title: "Chromosome 17q12 duplications: Further delineation of the range of psychiatric and clinical phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The duplication is often inherited from an apparently unaffected parent.
    explanation: >-
      The transmission pattern that dominates counselling for this locus, stated
      directly.
  - reference: PMID:32778765
    reference_title: Population prevalence and inheritance pattern of recurrent CNVs associated with neurodevelopmental disorders in 12,252 newborns and their parents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately a third of the newborn recurrent NDD CNVs (34%, N = 20/59)
      are de novo variants.
    explanation: >-
      The de novo fraction measured in an unselected newborn trio cohort. Note it
      is the figure for the 26 recurrent NDD CNVs together, not for 17q12
      duplication specifically.
prevalence:
- population: Norwegian Mother, Father and Child Cohort newborns, 12,252 trios
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 480.0
  rate_denominator: LIVE_BIRTHS
  notes: >-
    0.48% of live-born children carry a deletion or duplication at one of the 13
    recurrent neurodevelopmental CNV regions. This is the figure for all 26 CNVs
    together, not for the 17q12 duplication, and is recorded because it is the
    best-quality unselected denominator available. The same study reports the
    17q12 deletion at about 1 in 4,000; it does not give a separate figure for
    the duplication, so no duplication-specific rate is curated here.
  evidence:
  - reference: PMID:32778765
    reference_title: Population prevalence and inheritance pattern of recurrent CNVs associated with neurodevelopmental disorders in 12,252 newborns and their parents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We estimate the total prevalence of recurrent NDD CNVs (duplications and
      deletions) in live-born children to 0.48% (95% C.I.: 0.37-0.62%), i.e.,
      ~1 in 200 newborns has either a deletion or duplication in these NDDs
      associated regions.
    explanation: >-
      The aggregate newborn prevalence and its confidence interval, from an
      unselected population cohort rather than a clinical referral series.
- population: Danish national 17q12 cohort, phenotyped patients
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Twenty-six phenotyped duplication patients against 12 deletion patients in
    the Danish national cohort, from 19 index patients and 19 family members.
    The ratio of index to family members matters more than the total: the same
    paper shows that the burden differs between the two groups.
  evidence:
  - reference: PMID:27409573
    reference_title: 17q12 deletion and duplication syndrome in Denmark-A clinical cohort of 38 patients and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We here describe a large national cohort of 12 phenotyped patients with
      17q12 deletions and 26 phenotyped patients with 17q12 duplications.
    explanation: >-
      The cohort composition, which is the denominator behind this entry's
      qualitative frequency statements.
progression:
- phase: Prenatal detection on ultrasound anomaly
  notes: >-
    Where the duplication is found before birth it is usually because a fetal
    ultrasound anomaly, renal or a duodenal "double bubble" or a cardiac finding,
    prompted amniocentesis and chromosomal microarray. Prenatal series are
    therefore enriched for the malformation end of the spectrum and say nothing
    about how a carrier ascertained any other way will present.
  evidence:
  - reference: PMID:39433644
    reference_title: "Prenatal diagnosis, ultrasound findings, and pregnancy outcome of 17q12 deletion and duplication syndromes: a retrospective case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retrospective data were collected for 16 fetuses diagnosed with 17q12
      deletion and seven fetuses with 17q12 duplication through SNP-array during
      prenatal diagnosis at a single Chinese tertiary medical center from January
      2017 to December 2023.
    explanation: >-
      Describes the ascertainment route and its scale. Seven duplication fetuses
      is the whole prenatal duplication series, which is why its percentages are
      treated cautiously throughout this entry.
- phase: Childhood neurodevelopmental presentation
  notes: >-
    Developmental delay, speech delay, learning disability, autism, epilepsy,
    behavioural problems and tics emerge through childhood. The features are
    static rather than degenerative.
  evidence:
  - reference: PMID:27409573
    reference_title: 17q12 deletion and duplication syndrome in Denmark-A clinical cohort of 38 patients and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with 17q12 duplications were characterized by an extremely wide
      phenotypic spectrum, including a variable degree of learning disabilities,
      delayed language development, delayed motor milestones, and a broad range
      of psychiatric and neurological features.
    explanation: The childhood phenotype as the national cohort describes it.
- phase: Adolescent and adult psychiatric presentation
  notes: >-
    Schizophrenia and psychosis have their own onset window in adolescence and
    adulthood, so a carrier assessed in childhood has not yet passed through the
    period of greatest psychiatric risk. The Swedish CNV study put the odds ratio
    for schizophrenia at about 4.
  evidence:
  - reference: PMID:30134084
    reference_title: "Chromosome 17q12 duplications: Further delineation of the range of psychiatric and clinical phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In light of recent reports of association of this locus with schizophrenia,
      we performed a detailed psychiatric assessment and confirmed that one
      family member has symptoms consistent with a diagnosis of schizophrenia and
      another has a prodromal syndrome with attenuated positive symptoms of
      psychosis.
    explanation: >-
      Psychiatric outcomes in adult carriers of a family ascertained on a child's
      developmental delay, which is what makes the adult window a separate phase.
pathophysiology:
- name: NAHR Between 17q12 Segmental Duplications
  biological_scale: MOLECULAR
  description: >-
    The 17q12 interval is flanked by segmental duplications that misalign during
    meiosis, so unequal crossing-over generates a reciprocal deletion and
    duplication at the same breakpoints. This architecture is why the
    rearrangement recurs independently in unrelated families rather than being
    inherited from a common ancestor, and why no founder haplotype or population
    is involved.
  genetic_context:
    variant_origin: GERMLINE
    allele_type: structural variant (recurrent copy-number gain)
  downstream:
  - target: Increased 17q12 Gene Dosage
    causal_link_type: DIRECT
    description: >-
      The product of the unequal crossover is a third copy of the interval, so
      every gene inside it is present at one and a half times the normal dosage.
  evidence:
  - reference: PMID:17924346
    reference_title: Recurrent reciprocal genomic rearrangements of 17q12 are associated with renal disease, diabetes, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that 6% of fetal material showed evidence of microdeletion or
      microduplication, including three independent events that likely resulted
      from unequal crossing-over between segmental duplications.
    explanation: >-
      The recombination mechanism, from the study that first identified the 17q12
      pair. It is the claim this node makes.
  - reference: PMID:17924346
    reference_title: Recurrent reciprocal genomic rearrangements of 17q12 are associated with renal disease, diabetes, and epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identified the reciprocal duplication, which appears to be enriched
      in samples from patients with epilepsy.
    explanation: >-
      The first description of the duplication as a distinct entity, and the
      first statement of a neurological association for it.
- name: Increased 17q12 Gene Dosage
  biological_scale: MOLECULAR
  description: >-
    Three copies of a ~1.4-1.9 Mb interval containing about 15 OMIM genes. The
    proteins are structurally normal; what is abnormal is how much of each there
    is. HNF1B is the gene the literature treats as the dosage-sensitive driver,
    with LHX1 and ACACA named alongside it. Which of the interval genes actually
    produces which feature is not established for the duplication, so this node
    deliberately claims dosage imbalance and not an HNF1B-specific mechanism.
  genes:
  - preferred_term: HNF1B
    modifier: INCREASED
    term:
      id: hgnc:11630
      label: HNF1B
  - preferred_term: LHX1
    modifier: INCREASED
    term:
      id: hgnc:6593
      label: LHX1
  - preferred_term: ACACA
    modifier: INCREASED
    term:
      id: hgnc:84
      label: ACACA
  downstream:
  - target: Disrupted Regional Specification of Organ Primordia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27409573
    reference_title: 17q12 deletion and duplication syndrome in Denmark-A clinical cohort of 38 patients and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aberrations encompass the genes, HNF1B, LHX1, and ACACA, among others.
    explanation: >-
      The gene content of the interval, from the national cohort. It names the
      three genes this node binds and says explicitly that there are others.
  - reference: PMID:40894066
    reference_title: Persistent Tic Disorders Are Associated With 17q12 Duplications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight cases and one control carried the canonical ~1.4 Mb duplication at
      chr17:34.8 - 36.2 Mb, while one additional case had a smaller 110 kb
      duplication within this known CNV that included only one gene, ACACA
    explanation: >-
      The one published observation that narrows the interval: a 110 kb
      duplication containing only ACACA, in a single tic-disorder case. It is
      curated as a lead about which gene carries the neuropsychiatric signal, not
      as a demonstration.
- name: Disrupted Regional Specification of Organ Primordia
  biological_scale: TISSUE
  description: >-
    HNF1B and LHX1 are transcription factors that pattern organ primordia, so an
    excess of them perturbs regional specification during the embryonic window.
    The direct evidence for the gain direction is from zebrafish: overexpressing
    the HNF1B ortholog vhnf1 expands the valentino expression domain in the
    hindbrain, which is a CNS patterning defect produced by too much rather than
    too little. The corresponding human experiment does not exist, so this node
    rests on a model-organism result and is graded accordingly.
  biological_processes:
  - preferred_term: anterior/posterior pattern specification
    modifier: ABNORMAL
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Neurodevelopmental and Neuropsychiatric Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Variable Organ Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:11731484
    reference_title: "vhnf1, the MODY5 and familial GCKD-associated gene, regulates regional specification of the zebrafish gut, pronephros, and hindbrain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Complementary to the loss-of-function phenotypes, overexpression of vhnf1
      induces expansion of the val expression domain in the hindbrain.
    explanation: >-
      The only direct evidence that excess HNF1B-family dosage perturbs CNS
      patterning. Everything else in the mechanism is inferred from the deletion
      or from the phenotype, so this sentence carries the gain-of-dosage step on
      its own.
  - reference: PMID:11731484
    reference_title: "vhnf1, the MODY5 and familial GCKD-associated gene, regulates regional specification of the zebrafish gut, pronephros, and hindbrain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that vhnf1 controls development of multiple organs through
      regulating regional specification of organ primordia.
    explanation: >-
      The authors' framing of the gene's role, which is what makes one lesion
      plausibly responsible for both the neural and the organ branches below.

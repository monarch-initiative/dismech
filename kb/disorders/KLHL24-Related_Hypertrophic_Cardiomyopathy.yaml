- name: Failure of Desmin Intermediate Filament Turnover
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Desmin is the muscle-specific type III intermediate filament that links
    adjacent Z-discs to each other, to the sarcolemma at costameres, and to
    mitochondria and nuclei, transmitting force laterally and maintaining
    myofibrillar register. It is a dynamic polymer whose subunits are
    continuously exchanged, and that exchange requires a route for disposal of
    displaced subunits. KLHL24 supplies that route in muscle: it is the cardiac
    and skeletal-muscle counterpart of the KLHL24-keratin-14 relationship
    characterised in basal keratinocytes, desmin standing to the myocyte as
    keratin-14 stands to the keratinocyte.

    In KLHL24-null myocytes the polymer is not disposed of. Immunohistochemistry
    on heart and skeletal muscle from the founding families showed desmin
    accumulating in the intermyofibrillar and subsarcolemmal spaces, electron
    microscopy resolved irregularly arranged 8-12 nm filaments in the same
    compartment, and Western blotting showed desmin markedly upregulated in
    both tissues relative to controls. This is the inverse of the lesion in
    KLHL24 gain-of-function disease, in which desmin is depleted roughly
    tenfold in patient-derived engineered heart tissue and in explanted
    myocardium. The same protein pair therefore produces two cardiomyopathies
    of opposite morphology depending on the direction in which turnover fails.

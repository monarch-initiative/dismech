phenotypes:
- name: Hypertrophic cardiomyopathy
  category: Cardiovascular
  diagnostic: true
  description: >-
    Unexplained left ventricular hypertrophy is the presenting and defining
    phenotype. The morphology is that of classical hypertrophic cardiomyopathy
    - a thick-walled, small-cavity ventricle with preserved or supranormal
    ejection fraction early on - which is why the disease is diagnosed as
    sarcomeric HCM until sequencing says otherwise. Reported wall thicknesses
    reach extremes: septal thickness of 4.0 cm in one founding-family
    individual and interventricular septal thickness of 38 to 42 mm in an
    independently reported adolescent.

    Onset is characteristically in the late teens to late twenties. Recorded
    ages of onset in the founding families were 16, 19, 21, 24 and 28 years,
    and independently reported probands presented at 16, 18 and 20. The
    combination of a young age at presentation, severe hypertrophy and no
    dominant family history is the clinical signature that should prompt
    consideration of a recessive non-sarcomeric gene.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
    clinical_course: PROGRESSIVE
    onset:
      onset_category: YOUNG_ADULT
      min_age_years: 16.0
      max_age_years: 28.0
      notes: >-
        The HPO annotation file for OMIM:620236 records Young adult onset
        (HP:0011462) at 5/5, sourced to PMID:30715372 (retrieved 2026-08-01) -
        that is, in every individual for whom an age of onset was determinable.
        The 16 to 28 year range comes from the founding cohort's clinical table
        (PMC6812045, read 2026-08-01) together with the more recent reports,
        two of which describe presentations at 16 and 18 years. Those are
        adolescent rather than young adult, so the HPO category may narrow the
        true onset window.
  notes: >-
    No FrequencyEnum band is asserted; see the entry-level notes. The wall
    thickness figures are from the clinical tables in the full text of
    PMID:30715372 (PMC6812045, read 2026-08-01) and from the cached full text
    of PMID:42158087 respectively.
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that mutations in KLHL24 cause HCM in humans."
    explanation: Directly asserts hypertrophic cardiomyopathy as the phenotype produced by KLHL24 mutation in humans.
- name: Asymmetric septal hypertrophy
  category: Cardiovascular
  diagnostic: true
  description: >-
    The hypertrophy is predominantly septal and asymmetric in most reported
    individuals, which is the pattern that generates dynamic outflow tract
    obstruction and systolic anterior motion of the mitral valve. It is present
    in adolescents who are entirely asymptomatic, and is often the finding that
    triggers investigation after an incidental murmur or a family screening
    echocardiogram.
  phenotype_term:
    preferred_term: Asymmetric septal hypertrophy
    term:
      id: HP:0001670
      label: Asymmetric septal hypertrophy
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0001670 at 3/8, sourced
    to PMID:30715372 (retrieved 2026-08-01). No FrequencyEnum band is asserted;
    the denominator of 8 is the number of individuals with tabulated clinical
    data, not the number with echocardiography, and three of those eight have
    "not determined" in one or more echocardiographic fields.
  evidence:
  - reference: PMID:41823911
    reference_title: "KLHL24-Associated Hypertrophic Cardiomyopathy: When Genotype Outpaces Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Imaging revealed asymmetric septal hypertrophy with minimal fibrosis and preserved systolic function."
    explanation: Documents asymmetric septal hypertrophy in a genetically confirmed biallelic KLHL24 case.
- name: Left ventricular outflow tract obstruction
  category: Cardiovascular
  description: >-
    Dynamic obstruction of the left ventricular outflow tract follows from the
    combination of septal hypertrophy, a small cavity and systolic anterior
    motion of the mitral valve. Measured resting gradients in the founding
    families were substantial - 48 mmHg in one individual and 112 mmHg in
    another - and obstruction is the main determinant of exertional symptoms.
    It is not universal: several individuals with severe hypertrophy had no
    outflow gradient.
  phenotype_term:
    preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0032092 at 3/8, sourced
    to PMID:30715372 (retrieved 2026-08-01). The gradient values are from the
    clinical table in the full text (PMC6812045, read 2026-08-01) and are not
    quotable from the cached abstract. No FrequencyEnum band is asserted, and
    no evidence item is attached because neither the cached abstract of the
    founding paper nor any other cached source states this finding.
- name: Systolic anterior motion of the mitral valve
  category: Cardiovascular
  description: >-
    Systolic anterior motion of the mitral valve leaflet into the outflow tract
    is the mechanical basis of the dynamic obstruction and, with it, of the
    associated mitral regurgitation. It was described as moderate to severe in
    the affected individuals in whom it was present.
  phenotype_term:
    preferred_term: Systolic anterior motion of the mitral valve
    term:
      id: HP:0031656
      label: Systolic anterior motion of the mitral valve
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0031656 at 4/8, sourced
    to PMID:30715372 (retrieved 2026-08-01). Not mentioned in the cached
    abstract, so no evidence item is attached. No FrequencyEnum band is
    asserted.
- name: Mitral regurgitation
  category: Cardiovascular
  description: >-
    Mitral regurgitation in this disease is secondary rather than primary -
    the valve is structurally normal and the leak follows from systolic
    anterior motion and outflow obstruction. It ranged from mild to moderate in
    the reported individuals. Its importance is chiefly that it is one more
    feature indistinguishable from sarcomeric hypertrophic cardiomyopathy.
  phenotype_term:
    preferred_term: Mitral regurgitation
    term:
      id: HP:0001653
      label: Mitral regurgitation
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0001653 at 3/8, sourced
    to PMID:30715372 (retrieved 2026-08-01). Not mentioned in the cached
    abstract, so no evidence item is attached. No FrequencyEnum band is
    asserted.
- name: Reduced left ventricular endsystolic diameter
  category: Cardiovascular
  description: >-
    A small, obliterating left ventricular cavity is a consistent and
    under-appreciated feature. Left ventricular end-diastolic volumes as low as
    30 to 47 mL were recorded in the Iranian family, and in an independently
    reported case the cavity was described as severely obliterated. It
    contributes to diastolic dysfunction and to the low stroke volume that
    underlies exertional symptoms even when ejection fraction is normal or
    high.
  phenotype_term:
    preferred_term: Reduced left ventricular endsystolic diameter
    term:
      id: HP:0034386
      label: Reduced left ventricular endsystolic diameter
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0034386 at 5/7, sourced
    to PMID:30715372 (retrieved 2026-08-01), which is the highest-frequency
    structural feature in the annotation set. The volume figures are from the
    full-text clinical table (PMC6812045, read 2026-08-01). Not mentioned in
    the cached abstract, so no evidence item is attached.
- name: Syncope
  category: Cardiovascular
  diagnostic: true
  description: >-
    Recurrent syncope is one of the two commonest presenting symptoms and, in a
    young adult with hypertrophic remodelling, is the symptom that should
    trigger urgent arrhythmic risk assessment rather than reassurance. In one
    independently reported proband it was the presenting complaint at age 20
    and led directly to pacemaker implantation.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
    temporality: RECURRENT
  notes: >-
    Recurrent syncope is named in the OMIM/MedGen clinical description of
    CMH29 (MedGen C5774308, retrieved 2026-08-01) and in the founding paper's
    text, but it is not separately annotated in the HPO annotation file for
    OMIM:620236, so no fraction is available.
  evidence:
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband, a 30-year-old male, initially presented with recurrent syncope at the age of 20, leading to the implantation of a permanent pacemaker."
    explanation: Documents recurrent syncope as the presenting feature in a genetically confirmed biallelic KLHL24 case, at an age typical for this disease.
- name: Palpitations
  category: Cardiovascular
  description: >-
    Palpitations were among the initial symptoms in most affected individuals
    in the founding families and are the subjective correlate of the ventricular
    ectopy and non-sustained ventricular tachycardia documented on monitoring.
  phenotype_term:
    preferred_term: Palpitations
    term:
      id: HP:0001962
      label: Palpitations
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0001962 at 5/7, sourced
    to PMID:30715372 (retrieved 2026-08-01). Not mentioned in the cached
    abstract, so no evidence item is attached. No FrequencyEnum band is
    asserted.
- name: Dyspnea
  category: Cardiovascular
  description: >-
    Exertional dyspnoea reflects diastolic dysfunction in a small, stiff
    ventricle and, where present, dynamic outflow obstruction. One founding
    individual was in NYHA class III at presentation.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0002094 at 5/7, sourced
    to PMID:30715372 (retrieved 2026-08-01). Not mentioned in the cached
    abstract, so no evidence item is attached. No FrequencyEnum band is
    asserted.
- name: Ventricular arrhythmia
  category: Cardiovascular
  diagnostic: true
  description: >-
    Malignant ventricular arrhythmia is the phenotype that makes this disease
    dangerous, and the literature is explicit that its risk is out of
    proportion to structural severity. Frequent episodes of non-sustained
    ventricular tachycardia were documented in a founding-family individual who
    later required transplantation, and an independently reported adolescent
    with low conventional risk markers received a prophylactic implantable
    cardioverter-defibrillator on genotype grounds alone.
  phenotype_term:
    preferred_term: Ventricular arrhythmia
    term:
      id: HP:0004308
      label: Ventricular arrhythmia
  notes: >-
    Bound to HP:0004308 (Ventricular arrhythmia) rather than to the parent
    HP:0011675 (Arrhythmia) or to the more specific HP:0004756 (Ventricular
    tachycardia): the reported events span non-sustained ventricular
    tachycardia, defibrillator-treated events and unwitnessed sudden death, so
    the ventricular-arrhythmia level is the most specific term the evidence
    supports for the disease as a whole. Both alternatives were checked with
    OAK. No FrequencyEnum band is asserted; the HPO annotation file for
    OMIM:620236 carries no ventricular-arrhythmia term.
  evidence:
  - reference: PMID:41823911
    reference_title: "KLHL24-Associated Hypertrophic Cardiomyopathy: When Genotype Outpaces Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KLHL24-associated HCM is uniquely arrhythmogenic, with malignant ventricular arrhythmias potentially preceding structural severity."
    explanation: Asserts malignant ventricular arrhythmia as a defining feature of this genotype and states that it may precede structural severity.
- name: Sudden cardiac death
  category: Cardiovascular
  diagnostic: true
  description: >-
    Sudden cardiac death in the third decade is the single most consequential
    outcome of this disease. In the founding cohort three of eleven affected
    young adults died suddenly, at ages 20, 26 and 26. Because inheritance is
    recessive, an affected individual's siblings carry a one-in-four risk and
    may be entirely asymptomatic with severe hypertrophy already present, which
    is what makes cascade screening urgent rather than routine.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0001645 at 3/11, sourced
    to PMID:30715372 (retrieved 2026-08-01). No FrequencyEnum band is asserted,
    but note that this denominator of 11 is the largest in the annotation set
    and refers to all ascertained affected adults rather than to the 8 with
    tabulated clinical data. The specific ages at death are in the full text
    (PMC6812045, read 2026-08-01).
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 11 young affected adults identified, 3 died suddenly and 1 had a cardiac transplant due to heart failure."
    explanation: Quantifies sudden death in the founding cohort.
- name: Congestive heart failure
  category: Cardiovascular
  description: >-
    A minority progress to overt heart failure. One founding-family individual
    was transplanted at 26 with an ejection fraction of 25 percent and regional
    akinesia; in an independently reported sibship, both siblings had markedly
    elevated B-type natriuretic peptide and high-sensitivity troponin T, the
    younger one while still describing himself as asymptomatic. Subclinical
    biochemical heart failure therefore precedes symptomatic heart failure in
    this disease and is detectable by simple blood tests.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  notes: >-
    No FrequencyEnum band is asserted; heart failure is not separately
    annotated in the HPO annotation file for OMIM:620236.
  evidence:
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His 20-year-old younger brother, identified through family screening, had no obvious clinical symptoms but exhibited severe biventricular hypertrophy, significantly elevated levels of B-type natriuretic peptide and high-sensitivity troponin T, indicating subclinical myocardial injury and heart failure."
    explanation: Documents biochemically evident heart failure in an individual who was clinically asymptomatic, which is the basis for the claim that subclinical heart failure precedes symptoms here.
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 11 young affected adults identified, 3 died suddenly and 1 had a cardiac transplant due to heart failure."
    explanation: Documents progression to transplant-requiring heart failure in the founding cohort.
- name: Cardiomyocyte hypertrophy
  category: Cardiovascular
  description: >-
    The cellular substrate of the wall thickening. Both individuals from the
    founding families whose myocardium was examined - the cardiac explant of
    one and the endomyocardial biopsy of the other - showed hypertrophied
    cardiomyocytes. It is curated separately from the organ-level phenotype
    because in this disease part of the increase in cell size is occupied by
    stored desmin filaments, glycogen and tubular membrane rather than by added
    contractile apparatus.
  phenotype_term:
    preferred_term: Cardiomyocyte hypertrophy
    term:
      id: HP:0031319
      label: Cardiomyocyte hypertrophy
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0031319 at 2/2, sourced
    to PMID:30715372 (retrieved 2026-08-01 from
    https://ontology.jax.org/api/network/annotation/OMIM:620236). The
    denominator of 2 is the number of individuals with myocardial tissue
    available, not the number affected. Not mentioned in the cached abstract of
    PMID:30715372, so no evidence item is attached; the histological
    description is from the full text (PMC6812045, read 2026-08-01). No
    FrequencyEnum band is asserted.
- name: Increased myocardial glycogen content
  category: Cardiovascular
  description: >-
    PAS staining of the myocardium shows accumulation of glycogen in
    cardiomyocytes, filling the intermyofibrillar space alongside the
    diastase-resistant polyglucosan and the desmin filaments. The glycogen
    itself is ordinary - it is digested by alpha-amylase, which is what
    separates it from the polyglucosan in the same cells - and the same
    accumulation is present in skeletal muscle.
  phenotype_term:
    preferred_term: Increased myocardial glycogen content
    term:
      id: HP:0034532
      label: Increased myocardial glycogen content
  notes: >-
    The HPO annotation file for OMIM:620236 records HP:0034532 at 2/2, sourced
    to PMID:30715372 (retrieved 2026-08-01 from
    https://ontology.jax.org/api/network/annotation/OMIM:620236), with the same
    denominator of 2 as HP:0031319 - the individuals with myocardial tissue
    available. Not mentioned in the cached abstract, so no evidence item is
    attached; the PAS and PAS-diastase findings are in the full text
    (PMC6812045, read 2026-08-01) and are also modelled under `histopathology`
    and in the storage mechanism node. No FrequencyEnum band is asserted.
- name: Cardiac polyglucosan accumulation
  category: Cardiovascular
  diagnostic: true
  description: >-
    The feature that names the OMIM entity. Scattered cardiomyocytes contain
    PAS-positive material that survives alpha-amylase digestion, and discrete
    polyglucosan bodies are also found in the interstitium associated with
    macrophage infiltrates. It is bound as a phenotype as well as being
    described under `histopathology` because it is the entity-defining feature
    and the reason the disease sits alongside the glycogen-storage
    cardiomyopathies in differential diagnosis, even though its pathogenesis
    here is unexplained.
  phenotype_term:
    preferred_term: Cardiac polyglucosan accumulation
    term:
      id: HP:0034835
      label: Cardiac polyglucosan accumulation
  notes: >-
    HP:0034835 exists in HPO (`runoak -i sqlite:obo:hp info HP:0034835`,
    checked 2026-08-01) but is NOT among the 13 annotations the HPO annotation
    file carries for OMIM:620236 (retrieved 2026-08-01 from
    https://ontology.jax.org/api/network/annotation/OMIM:620236), so it is a
    curator addition from the primary description rather than an imported
    annotation, and no frequency is available. The sibling term HP:0034766
    Muscle fiber polyglucosan inclusion bodies was considered and deliberately
    not used: the founding paper reports polyglucosan in cardiomyocytes only,
    and describes the skeletal muscle accumulation as glycogen, desmin and
    tubular structures. Not mentioned in the cached abstract, so no evidence
    item is attached; see the `histopathology` entry for provenance.
histopathology:
- name: Polyglucosan bodies in cardiomyocytes
  diagnostic: true
  description: >-
    The finding that names the OMIM entity. Scattered cardiomyocytes contain
    periodic-acid-Schiff-positive material that persists after alpha-amylase
    (diastase) digestion, identifying it as polyglucosan rather than ordinary
    glycogen. Discrete polyglucosan bodies are also found free in the
    interstitium, where they are associated with small macrophage infiltrates.
    On electron microscopy the polyglucosan sits within intermyofibrillar
    regions crowded with glycogen, filaments and tubular structures. The stain
    pair PAS and PAS-diastase is the entire test, and it is the same pair used
    to identify PRKAG2 cardiac syndrome - which is why the histology alone does
    not distinguish the two and the genotype must.
  finding_term:
    preferred_term: PAS-positive diastase-resistant polyglucosan inclusion
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  notes: >-
    Described from the full text and figures of PMID:30715372 (PMC6812045, read
    2026-08-01), which report PAS and PAS-diastase staining of the cardiac
    explant of one individual and of endomyocardial biopsy material from
    another, plus electron microscopy. The cached abstract of that paper does
    not mention polyglucosan, so no snippet from it can support this finding
    and none is attached. This finding has never been reported by an
    independent group; every subsequent KLHL24 cardiomyopathy report has been
    genotype-plus-imaging without myocardial histology.
- name: Desmin accumulation in cardiac and skeletal muscle
  diagnostic: true
  description: >-
    Immunohistochemistry for desmin shows the accumulated intermyofibrillar and
    subsarcolemmal material staining strongly, and Western blotting shows
    desmin markedly upregulated in both heart and skeletal muscle relative to
    controls. Electron microscopy resolves irregularly arranged intermediate
    filaments of 8 to 12 nm in the same compartment. This is the finding that
    ties the histology directly to the molecular mechanism, since desmin is the
    KLHL24 substrate in striated muscle.
  finding_term:
    preferred_term: intermediate filament (desmin) accumulation
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endomyocardial and skeletal muscle biopsies from affected individuals of both families demonstrated characteristic alterations, including accumulation of desmin intermediate filaments."
    explanation: Direct statement that both cardiac and skeletal muscle biopsies show accumulation of desmin intermediate filaments.
- name: Cogwheel skeletal muscle fibres
  diagnostic: true
  description: >-
    A pattern proposed as new in the founding report and not previously
    described in any myopathy: focal subsarcolemmal accumulation of glycogen
    and desmin distributed around the fibre periphery so as to give the fibre
    outline a jagged, cogwheel-like appearance on PAS and desmin staining. It
    affected the majority of both type 1 and type 2 fibres in all three
    individuals biopsied, across both founding families, and the authors
    proposed it explicitly as a diagnostic marker. The accumulated material
    stained for NADH-tetrazolium reductase but not for succinate dehydrogenase,
    indicating sarcoplasmic reticulum-derived tubules rather than mitochondria.
  finding_term:
    preferred_term: cogwheel fibre
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  notes: >-
    Described from the full text and figures of PMID:30715372 (PMC6812045, read
    2026-08-01). The cached abstract says only "characteristic alterations", so
    no snippet supports the cogwheel description specifically and none is
    attached. Because it has appeared in exactly one paper and has not been
    sought in any subsequent case, its sensitivity and specificity are entirely
    unknown; it is recorded here as a described marker, not a validated one.
- name: Interstitial fibrosis with focal CD68-positive macrophage infiltrates
  description: >-
    Patchy interstitial fibrosis on van Gieson staining, with small
    inflammatory infiltrates that stain for CD68 and are preferentially found
    adjacent to polyglucosan-containing myocytes. The distribution suggests a
    localised macrophage response to the stored material rather than a diffuse
    inflammatory process.
  finding_term:
    preferred_term: interstitial fibrosis with macrophage infiltration
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  notes: >-
    Described from the full text and figures of the cardiac explant analysis in
    PMID:30715372 (PMC6812045, read 2026-08-01). One heart, one patient; not
    replicated. No snippet is available from the cached abstract.
- name: Absence of myofibre disarray
  description: >-
    A negative finding with diagnostic weight. Myocyte and myofibrillar
    disarray is the pathognomonic histology of sarcomere-protein hypertrophic
    cardiomyopathy; what the CMH29 biopsies show instead is myocyte hypertrophy
    with intermyofibrillar accumulation. The same negative distinguishes
    PRKAG2 cardiac syndrome from sarcomeric HCM, so this feature separates
    CMH29 from sarcomeric disease but not from the other storage mimics.
  finding_term:
    preferred_term: absence of myofibre disarray
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these mutations were not associated with myocyte and myofibrillar disarray, the pathognomonic features of hypertrophic cardiomyopathy caused by sarcomere protein mutations"
    explanation: >-
      Cited for the general histological principle, established in the PRKAG2
      storage mimic, that myofibrillar disarray is pathognomonic of sarcomeric
      hypertrophic cardiomyopathy and is absent in the storage cardiomyopathies
      that mimic it. The absence of disarray in CMH29 specifically is described
      in the full text of PMID:30715372, which is not quotable from its cached
      abstract.
diagnosis:
- name: Exome or genome sequencing with biallelic KLHL24 variant interpretation
  description: >-
    Molecular diagnosis rests on identifying biallelic KLHL24 variants against
    transcript NM_017644.3, with parental testing to confirm that compound
    heterozygous variants are in trans. Three interpretive points follow from
    the published genotype-phenotype pattern. First, KLHL24 must actually be on
    the panel: the founding families were solved only after an 88-gene
    inherited-cardiac-conditions panel and a 9-gene polyglucosan-storage panel
    had both come back negative, and the most recent reported sibship was
    likewise negative across a conventional hypertrophic cardiomyopathy gene
    panel - MYH7, MYBPC3, TNNT2, TNNI3, MYL2, MYL3, TPM1, ACTC1, TNNC1, JPH2,
    PRKAG2, GLA, LAMP2, RYR2, DSP, FLNC, MYPN, CSRP3, TCAP, ZASP and others -
    before exome sequencing found KLHL24. Second, a single heterozygous
    KLHL24 variant does not explain a hypertrophic cardiomyopathy phenotype and
    should not be reported as though it did; the disease is recessive. Third,
    position matters as much as consequence - an initiation-codon variant is
    the dominant skin-and-dilated-cardiomyopathy allele, not this disease. For a
    young adult with severe unexplained hypertrophy, no dominant family history
    and a negative sarcomere panel, reanalysis or reflex exome sequencing is
    the appropriate next step.
  evidence:
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only compound heterozygous KLHL24 variants segregated with the disease phenotype."
    explanation: Documents that a conventional hypertrophic cardiomyopathy gene panel was uninformative and that only KLHL24 segregated, which is the argument for including the gene on panels and for reflex exome sequencing.
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KLHL24 could be included in genetic panels, especially for cases with early onset, severe hypertrophy, or non-dominant family histories."
    explanation: States the panel-inclusion recommendation and the clinical criteria that should trigger consideration of this gene.
- name: Echocardiography with family cascade screening
  description: >-
    Echocardiography establishes the structural phenotype - septal thickness,
    cavity size, systolic anterior motion, outflow gradient, diastolic function
    - and is the screening test for at-risk relatives. Because inheritance is
    recessive, cascade screening targets siblings, who carry a one-in-four
    risk, rather than the parents and offspring who are the focus in dominant
    hypertrophic cardiomyopathy. The screening yield is high and the finding
    can be dramatic in someone who reports no symptoms at all: in one reported
    sibship the asymptomatic younger brother, found on family screening, had
    interventricular septal thickness of 38 to 42 mm.
  evidence:
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His 20-year-old younger brother, identified through family screening, had no obvious clinical symptoms but exhibited severe biventricular hypertrophy, significantly elevated levels of B-type natriuretic peptide and high-sensitivity troponin T, indicating subclinical myocardial injury and heart failure."
    explanation: Demonstrates the yield of sibling cascade screening in this recessive disease, including severe structural disease in an asymptomatic individual.
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic pathogenic variants can be misleading, as severe structural and subclinical functional heart disease may already be present, necessitating pre-symptomatic diagnosis and management."
    explanation: States directly that asymptomatic status is unreliable in biallelic individuals, which is the justification for structural screening rather than symptom-triggered assessment.
- name: Skeletal muscle biopsy
  description: >-
    An under-used diagnostic route that is specific to this disease. Because
    KLHL24 is expressed more highly in skeletal muscle than in myocardium and
    because skeletal muscle carries the same accumulation despite being
    clinically normal, a quadriceps biopsy can show the desmin and glycogen
    accumulation and the cogwheel fibre pattern in a patient whose only
    clinical problem is cardiac. It is substantially less morbid than
    endomyocardial biopsy. Its limitation is that the pattern has been
    described in exactly three individuals from two families and its
    specificity against other desminopathies and glycogen storage myopathies
    has never been tested.
  notes: >-
    The skeletal muscle biopsy findings, the proposal of the cogwheel fibre as
    a diagnostic marker, and the tissue-expression ranking that motivates
    biopsying muscle rather than heart are all in the full text of
    PMID:30715372 (PMC6812045, read 2026-08-01). The cached abstract supports
    only the general statement that skeletal muscle biopsies showed
    characteristic alterations, which is quoted on the histopathology finding
    above rather than duplicated here.
- name: Endomyocardial biopsy with PAS and PAS-diastase histochemistry
  description: >-
    Where myocardial tissue is available - at endomyocardial biopsy, at
    transplantation or at autopsy - PAS staining before and after alpha-amylase
    digestion is the test that reveals the polyglucosan, and desmin
    immunohistochemistry with electron microscopy reveals the intermediate
    filament accumulation. In practice this is rarely the route to diagnosis
    today, since sequencing is faster and non-invasive, but it remains the way
    the entity was defined and the only way its defining histological feature
    can be confirmed. It also excludes the principal mimics directly: Danon
    disease shows autophagic vacuoles with sarcolemmal features, Fabry disease
    shows lamellar inclusions, and Pompe disease shows lysosomal glycogen.
  notes: >-
    No evidence item is attached. The histochemical protocol is described in
    the methods of PMID:30715372 (PMC6812045, read 2026-08-01), which is not
    quotable from the cached abstract, and the comparative statements about
    Danon, Fabry and Pompe histology are reasoned differential context rather
    than quoted findings.
differential_diagnoses:
- name: Epidermolysis bullosa simplex 6, generalized, with scarring and hair loss
  disease_term:
    preferred_term: epidermolysis bullosa simplex 6, generalized, with scarring and hair loss
    term:
      id: MONDO:0015006
      label: epidermolysis bullosa simplex 6, generalized, with scarring and hair loss
  description: >-
    The allelic disorder, and the most informative entry in this list. The same
    gene, mutated at its translation initiation codon rather than in its body,
    causes a dominant disease of skin fragility with scarring alopecia and
    DILATED cardiomyopathy. The mechanism is the mirror image of this entity's.
    Loss of the first 28 amino acids by translation re-initiation at Met29
    produces KLHL24-deltaN28, which escapes the autoubiquitination that
    normally limits KLHL24's own half-life; the stabilised adaptor then
    hyperdegrades its substrates - keratin 14 and other keratins in basal
    keratinocytes, desmin, synemin and vimentin in cardiac cells. Where CMH29
    accumulates intermediate filament, EBS6 destroys it; where CMH29 gives a
    thick-walled small-cavity ventricle, EBS6 gives a thin-walled dilated one.
    A clinician will never confuse the two at the bedside - one has blistering
    from birth, the other has no skin findings at all - but a laboratory
    reading a KLHL24 variant absolutely can, and that is why this differential
    is here.
  distinguishing_features:
  - EBS6 is autosomal dominant and often de novo; CMH29 is autosomal recessive, so zygosity alone separates them in most cases.
  - EBS6 alleles are confined to the translation initiation codon and to nonsense-inducing changes in c.4_84 that permit re-initiation; CMH29 alleles lie in the BACK and Kelch domains.
  - EBS6 is a gain-of-function mechanism producing substrate depletion; CMH29 is loss of function producing substrate accumulation.
  - The cardiomyopathy of EBS6 is dilated; that of CMH29 is hypertrophic with a small cavity.
  - EBS6 presents at birth with extensive skin denudation and later scarring alopecia; no individual with biallelic KLHL24 variants has had any skin abnormality, and family members of CMH29 probands screened for skin symptoms were normal.
  notes: >-
    MONDO:0015006 was verified with OAK: `runoak -i sqlite:obo:mondo info
    MONDO:0015006 -O obo` returns xref OMIM:617294, `is_a MONDO:0000426`
    (autosomal dominant disease), `is_a MONDO:0017610` (epidermolysis bullosa
    simplex) and `relationship: RO:0004003 HGNC:25947 ! KLHL24` - the same gene
    as this entry, which is what makes it allelic. The dismech entry
    `kb/disorders/Epidermolysis_Bullosa_Simplex.yaml` covers this disease as
    part of the broader EBS entity and was not modified.
  evidence:
  - reference: PMID:27798626
    reference_title: "Stabilizing mutations of KLHL24 ubiquitin ligase cause loss of keratin 14 and human skin fragility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified start-codon mutations in the KLHL24 gene in five patients with EB."
    explanation: Establishes the start-codon location of the dominant skin alleles, which is the positional contrast with the BACK and Kelch domain alleles of this entity.
  - reference: PMID:27889062
    reference_title: "Monoallelic Mutations in the Translation Initiation Codon of KLHL24 Cause Skin Fragility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "monoallelic mutations, c.1A>G and c.2T>C, in the translation initiation codon of the gene encoding kelch-like protein 24 (KLHL24) in 14 individuals with a distinct skin-fragility phenotype and skin cleavage within basal keratinocytes"
    explanation: Independently establishes that the skin disease alleles are monoallelic and confined to the initiation codon, in direct contrast to the biallelic body-of-gene alleles of CMH29.
  - reference: PMID:34292882
    reference_title: "Gain-of-function mutation in ubiquitin-ligase KLHL24 causes desmin degradation and dilatation in hiPSC-derived engineered heart tissues."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The start codon c.1A>G mutation in KLHL24, encoding ubiquitin-ligase KLHL24, results in the loss of 28 N-terminal amino acids (KLHL24-ΔN28) by skipping the initial start codon."
    explanation: Defines the truncated protein product that underlies the dominant disease and that has no counterpart in CMH29 genotypes.
  - reference: PMID:34292882
    reference_title: "Gain-of-function mutation in ubiquitin-ligase KLHL24 causes desmin degradation and dilatation in hiPSC-derived engineered heart tissues."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "presence of KLHL24-ΔN28 in cardiomyocytes leads to excessive degradation of desmin, affecting tissue morphology and function"
    explanation: Establishes the opposite direction of the desmin lesion in the allelic dominant disease, which is the core of the mechanistic contrast.
  - reference: PMID:34740256
    reference_title: "Proteasome-mediated degradation of keratins 7, 8, 17 and 18 by mutant KLHL24 in a foetal keratinocyte model: Novel insight in congenital skin defects and fragility of epidermolysis bullosa simplex with cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Epidermolysis bullosa simplex (EBS) with cardiomyopathy (EBS-KLHL24) is an EBS subtype caused by dominantly inherited, gain-of-function mutations in the gene encoding for the ubiquitin-ligase KLHL24, which addresses specific proteins to proteasomal degradation."
    explanation: States the dominant, gain-of-function character of the allelic disease explicitly.
  - reference: PMID:35975634
    reference_title: "A translation re-initiation variant in KLHL24 also causes epidermolysis bullosa simplex and dilated cardiomyopathy via intermediate filament degradation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study shows that gain-of-function variants in KLHL24 causing EBS and DCM, do not only originate in the start-codon"
    explanation: Extends the dominant allele class beyond the initiation codon itself to any nonsense-inducing change permitting re-initiation, which sharpens the positional rule a laboratory must apply.
- name: PRKAG2 cardiac syndrome
  disease_term:
    preferred_term: PRKAG2 cardiac syndrome
    term:
      id: MONDO:0800484
      label: PRKAG2-related cardiomyopathy
  description: >-
    The classic glycogen-storage mimic of hypertrophic cardiomyopathy, and the
    entity that shares CMH29's most distinctive histological feature.
    Cardiomyocyte polyglucosan bodies, PAS-positive and diastase-resistant, are
    found in both, so a pathologist reading a PAS-diastase stain cannot tell
    them apart. Everything upstream and downstream of that stain differs.
    PRKAG2 encodes the gamma-2 regulatory subunit of AMP-activated protein
    kinase; dominant missense variants render the kinase constitutively active,
    which drives glucose uptake and glycogen synthesis and produces bulk
    non-lysosomal glycogen storage. The stored material is the primary lesion.
    In CMH29 the primary lesion is failure of intermediate filament turnover,
    the polyglucosan is secondary and unexplained, and the primary stored
    species is desmin protein rather than polysaccharide.

    The clinical separator is electrophysiological. PRKAG2 disease is defined by
    ventricular pre-excitation - accessory atrioventricular connections
    producing Wolff-Parkinson-White - with progressive atrioventricular block
    and pacemaker dependence. CMH29 has conduction-interval prolongation and
    malignant ventricular arrhythmia but no accessory pathways and no
    pre-excitation has been reported. An adult with hypertrophy plus a delta
    wave is PRKAG2 until proven otherwise; an adult with hypertrophy plus
    non-sustained ventricular tachycardia and unaffected parents who are first
    cousins is not.
  distinguishing_features:
  - PRKAG2 cardiac syndrome is autosomal dominant with an affected parent in most families; CMH29 is autosomal recessive with unaffected heterozygous parents and frequent parental consanguinity.
  - Ventricular pre-excitation (Wolff-Parkinson-White) and progressive atrioventricular block define PRKAG2 disease and have not been reported in CMH29.
  - PRKAG2 is one of the eight canonical muscle polyglucosan storage genes; KLHL24 is not, and was reached in the founding study only after that gene set was sequenced and excluded.
  - In PRKAG2 disease the stored polysaccharide sits in large isolated cytosolic vacuoles; in CMH29 the polyglucosan is intermyofibrillar and accompanied by accumulated desmin filaments and sarcoplasmic-reticulum-derived tubules.
  - Desmin accumulation on immunohistochemistry and Western blot is characteristic of CMH29 and is not a feature of PRKAG2 disease.
  notes: >-
    MONDO:0800484 was verified with OAK: it carries `relationship: RO:0004003
    HGNC:9386 ! PRKAG2` and the synonym "PRKAG2 cardiac syndrome", and matches
    the disease_term already bound in
    `kb/disorders/PRKAG2_Cardiac_Syndrome.yaml`. That file was read for scoping
    and was not modified. Its NEC note records that MONDO:0859372 was
    incorrectly proposed as its target; this entry is the correct home for that
    identifier.
  evidence:
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in which hypertrophy, ventricular pre-excitation and conduction system defects coexist"
    explanation: Names the triad that defines PRKAG2 disease, of which ventricular pre-excitation is the feature absent from CMH29 and therefore the practical discriminator.
  - reference: PMID:11827995
    reference_title: "Constitutively active AMP kinase mutations cause glycogen storage disease mimicking hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These vacuoles contained inhomogeneous granular material that stained strongly with PAS"
    explanation: Establishes the shared PAS-positive storage histology that makes the two diseases indistinguishable on that stain alone.
  - reference: PMID:26278982
    reference_title: "Polyglucosan storage myopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in eight human genes are known to be associated with polyglucosan storage involving muscle, namely GYG1, GBE1, RBCK1 (HOIL-1), PFKM, EPM2A, EPM2B (NHLRC1), PRDM8, and PRKAG2."
    explanation: Places PRKAG2 inside, and KLHL24 outside, the canonical polyglucosan storage gene set, which is the genetic basis of the distinction.
- name: Sarcomeric hypertrophic cardiomyopathy
  disease_term:
    preferred_term: familial hypertrophic cardiomyopathy
    term:
      id: MONDO:0024573
      label: familial hypertrophic cardiomyopathy
  description: >-
    The default diagnosis, the parent term of this entity in MONDO, and the
    label almost every CMH29 patient carries before sequencing. Sarcomeric HCM
    is dominant, caused by variants in MYH7, MYBPC3 and the other
    sarcomere-protein genes, and accounts for the large majority of familial
    hypertrophic cardiomyopathy; the genetic cause of up to 50 percent of
    clinically diagnosed HCM nevertheless remains unknown, and CMH29 lives in
    that unexplained fraction. The
    echocardiographic appearances overlap completely. What separates them is
    the pedigree, the histology and the gene.
  distinguishing_features:
  - Sarcomeric HCM is autosomal dominant with a vertically transmitted family history; CMH29 is recessive, so unaffected parents and affected siblings are the expected pattern.
  - Myocyte and myofibrillar disarray is the pathognomonic histology of sarcomeric HCM and is not what CMH29 biopsies show.
  - Polyglucosan bodies, desmin accumulation and intermyofibrillar glycogen are not features of sarcomeric HCM.
  - Skeletal muscle histology is normal in sarcomeric HCM and abnormal, though clinically silent, in CMH29.
  - Arrhythmic risk in sarcomeric HCM tracks conventional risk markers reasonably well; in CMH29 malignant arrhythmia may precede structural severity, so those markers underestimate risk.
  notes: >-
    MONDO:0024573 was verified with OAK and is the asserted MONDO parent of
    MONDO:0859372. `kb/disorders/Hypertrophic_Cardiomyopathy.yaml` is the
    dismech entry covering sarcomeric HCM; it lists KLHL24 as a panel gene and
    quotes the same ClinGen assertion cited here, and it was not modified.
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypertrophic cardiomyopathy (HCM) is the most common inherited cardiovascular disorder, yet the genetic cause of up to 50% of cases remains unknown."
    explanation: Establishes the diagnostic gap in which this entity sits - a large unexplained fraction of clinically diagnosed hypertrophic cardiomyopathy.
- name: Danon disease
  disease_term:
    preferred_term: Danon disease
    term:
      id: MONDO:0010281
      label: Danon disease
  description: >-
    An X-linked lysosomal-associated membrane protein 2 defect producing an
    autophagic vacuolar myopathy with massive left ventricular hypertrophy,
    skeletal myopathy, pre-excitation and, in males, presentation in
    adolescence with rapid progression to transplantation. It sits in the same
    diagnostic slot as CMH29 - a young person with extreme hypertrophy and a
    non-dominant pedigree - and is a storage cardiomyopathy with a
    muscle-biopsy diagnosis, so it must be excluded on the same tissue.
  distinguishing_features:
  - Danon disease is X-linked; affected males are severely affected in adolescence and carrier females later and more mildly. CMH29 affects both sexes equally and requires two damaged alleles.
  - Danon disease combines cardiomyopathy with intellectual disability and a clinically manifest skeletal myopathy with raised creatine kinase; CMH29 has neither.
  - Ventricular pre-excitation is common in Danon disease and unreported in CMH29.
  - Danon histology shows autophagic vacuoles with sarcolemmal features and LAMP2 absence on immunostaining; CMH29 shows intermyofibrillar desmin and polyglucosan with preserved LAMP2.
  notes: >-
    MONDO:0010281 was verified with OAK and carries `RO:0004003 HGNC:6501 !
    LAMP2`. `kb/disorders/Danon_disease.yaml` is the dismech entry for this
    disease. The LAMP2 immunostaining contrast is grounded in the founding
    CMH29 study having included LAMP2 as a lysosomal marker in its
    immunohistochemistry panel (methods of PMID:30715372, PMC6812045, read
    2026-08-01); no snippet is available for it, so no evidence item is
    attached to this differential.
- name: Desminopathy and desmin-related myofibrillar myopathy
  disease_term:
    preferred_term: qualitative or quantitative defects of desmin
    term:
      id: MONDO:0016187
      label: qualitative or quantitative defects of desmin
  description: >-
    The mechanistically closest disease outside the KLHL24 locus. Dominant DES
    variants produce desmin aggregation in cardiac and skeletal muscle with
    cardiomyopathy, conduction disease and arrhythmia - the same end state that
    CMH29 reaches by removing the ligase that clears desmin rather than by
    damaging desmin itself. The pair makes the point that the desmin network
    can be broken from either side, and it is the reason desmin
    immunohistochemistry does not by itself distinguish them.
  distinguishing_features:
  - Desminopathy is usually autosomal dominant and caused by variants in DES itself; CMH29 is recessive and DES is normal.
  - Desminopathy typically produces a clinically manifest skeletal myopathy with distal-onset weakness progressing proximally; in CMH29 skeletal muscle is histologically abnormal but strength is normal.
  - The cardiac phenotype of desminopathy is most often dilated or arrhythmogenic-right-ventricular rather than hypertrophic with a small cavity.
  - Polyglucosan bodies and intermyofibrillar glycogen are not features of desminopathy.
  notes: >-
    MONDO:0016187 was verified with OAK; `runoak -i sqlite:obo:mondo
    relationships --direction down -p RO:0004003 HGNC:2770` returns it as the
    only MONDO term carrying a DES gene association in this build, which is why
    the grouping term is used here rather than a numbered myofibrillar myopathy
    term whose gene association is not asserted in the ontology. This
    differential is mechanistic; no evidence item is attached because the
    comparison is reasoned rather than quoted.
- name: Polyglucosan body myopathy 1 with or without immunodeficiency
  disease_term:
    preferred_term: polyglucosan body myopathy 1 with or without immunodeficiency
    term:
      id: MONDO:0014389
      label: polyglucosan body myopathy 1 with or without immunodeficiency
  description: >-
    An RBCK1-related recessive disorder combining polyglucosan storage myopathy
    with a progressive, often fatal cardiomyopathy, and in some individuals
    immunodeficiency and autoinflammation. It is the recessive polyglucosan
    cardiomyopathy that CMH29 most closely resembles by histology and by
    inheritance, and it is one of the nine genes that the founding study
    sequenced and excluded before reaching KLHL24. Including it here is the
    point: the differential for a recessive polyglucosan cardiomyopathy is a
    short list, and KLHL24 now belongs on it even though its polyglucosan
    remains unexplained.
  distinguishing_features:
  - RBCK1 disease frequently includes immunodeficiency, recurrent pyogenic infection and systemic autoinflammation; CMH29 is purely cardiac.
  - RBCK1 disease produces a progressive clinically manifest skeletal myopathy; CMH29 skeletal muscle is abnormal on biopsy but strong.
  - The RBCK1 cardiomyopathy is typically dilated and progresses to failure in childhood or adolescence; CMH29 is hypertrophic and presents in young adulthood.
  - RBCK1 is a canonical polyglucosan storage gene with an established mechanism in linear ubiquitin assembly and glycogen handling; the polyglucosan in CMH29 has no established mechanism.
  notes: >-
    MONDO:0014389 was verified with OAK and carries `RO:0004003 HGNC:15864 !
    RBCK1`. No evidence item is attached; the contrast is reasoned from the
    polyglucosan storage myopathy review cited elsewhere in this entry and from
    the founding study's exclusion of the polyglucosan gene panel.
- name: Fabry disease
  disease_term:
    preferred_term: Fabry disease
    term:
      id: MONDO:0010526
      label: Fabry disease
  description: >-
    Included because it is the storage mimic with a disease-modifying therapy,
    which makes missing it costlier than missing the others. X-linked
    alpha-galactosidase A deficiency produces concentric left ventricular
    hypertrophy that is routinely misdiagnosed as hypertrophic cardiomyopathy,
    and is excluded cheaply by plasma or leukocyte enzyme assay in males and by
    GLA sequencing in females.
  distinguishing_features:
  - Fabry disease is X-linked with a characteristic multisystem phenotype - acroparaesthesia, angiokeratoma, hypohidrosis, corneal verticillata, proteinuric renal disease and stroke - none of which occurs in CMH29.
  - Fabry cardiac hypertrophy is typically concentric with a short PR interval; CMH29 hypertrophy is typically asymmetric and septal, and no short PR interval has been reported in it.
  - Fabry histology shows lamellar myelin-like inclusions of globotriaosylceramide, not polyglucosan or desmin accumulation.
  - Enzyme replacement and chaperone therapy exist for Fabry disease; no disease-modifying therapy exists for CMH29.
  notes: >-
    MONDO:0010526 was verified with OAK and carries `RO:0004003 HGNC:4296 !
    GLA`. `kb/disorders/Fabry_Disease.yaml` is the dismech entry for this
    disease. No evidence item is attached; the contrast is reasoned clinical
    comparison rather than a quoted finding.
treatments:
- name: Implantable cardioverter-defibrillator
  description: >-
    The single intervention with a plausible mortality benefit in this disease,
    and the one where CMH29 departs from standard hypertrophic cardiomyopathy
    practice. Because malignant ventricular arrhythmia in this genotype can
    precede structural severity and can be the first manifestation, conventional
    HCM risk scores - which weight wall thickness, fibrosis burden, family
    history of sudden death and syncope - underestimate risk. Several
    individuals in the founding families received defibrillators in their
    twenties and thirties, and an independently reported 16-year-old with low
    conventional risk markers received a prophylactic device on genotype
    grounds. That decision was made case by case; no guideline addresses this
    genotype and no comparative data exist.
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  notes: >-
    `runoak -i sqlite:obo:ncit search 't~defibrillator'` returns NCIT:C80435
    Implantable Cardioverter-Defibrillator Placement, which matches the
    preferred term exactly and is the identifier already used for this
    intervention elsewhere in the repository (for example
    `kb/disorders/Brugada_Syndrome.yaml` and
    `kb/disorders/Paroxysmal_Familial_Ventricular_Fibrillation.yaml`).
    `runoak -i sqlite:obo:ncit ancestors -p i NCIT:C80435` places it under
    NCIT:C80430 Cardiac Therapeutic Procedure and NCIT:C49236 Therapeutic
    Procedure, so this binding is the specific term rather than the branch
    root.
  evidence:
  - reference: PMID:41823911
    reference_title: "KLHL24-Associated Hypertrophic Cardiomyopathy: When Genotype Outpaces Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite low conventional risk markers, genotype-directed assessment indicated high arrhythmic risk, prompting prophylactic implantable cardioverter-defibrillator (ICD) placement."
    explanation: Documents genotype-driven prophylactic defibrillator implantation in a biallelic KLHL24 case whose conventional risk markers were low.
  - reference: PMID:41823911
    reference_title: "KLHL24-Associated Hypertrophic Cardiomyopathy: When Genotype Outpaces Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early genetic testing enables genotype-guided preventive strategies, including timely prophylactic ICD implantation, even in apparently low-risk phenotypes."
    explanation: States the management principle that follows from the decoupling of arrhythmic risk from structural severity in this genotype.
- name: Heart transplantation
  description: >-
    Definitive treatment for the subset who progress to end-stage failure. One
    of the two Iraqi siblings was transplanted at 26 for heart failure with an
    ejection fraction of 25 percent. The relevance of transplantation here goes
    beyond the individual case: because the disease is confined to striated
    muscle and the skeletal muscle involvement is clinically silent, a
    transplanted CMH29 patient has no residual systemic disease to limit the
    outcome, unlike patients transplanted for multisystem storage disorders.
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  notes: >-
    `runoak -i sqlite:obo:ncit search "Heart Transplantation"` returns
    NCIT:C15246 as an exact match, so the organ-specific term is used rather
    than its parent NCIT:C15289 Organ Transplantation.
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 11 young affected adults identified, 3 died suddenly and 1 had a cardiac transplant due to heart failure."
    explanation: Documents cardiac transplantation as a management outcome in the founding cohort.
- name: Standard heart failure and hypertrophic cardiomyopathy pharmacotherapy
  description: >-
    Management of the haemodynamic phenotype follows standard practice for
    hypertrophic cardiomyopathy and heart failure and is not disease-specific:
    beta-blockade for outflow obstruction, symptom control and rate control,
    with mineralocorticoid receptor antagonism, loop diuretics and vasopressin
    antagonism added as congestion develops. Reported regimens in genetically
    confirmed cases have used metoprolol succinate with spironolactone in the
    less advanced sibling and metoprolol with furosemide and tolvaptan in the
    more congested one. There is no evidence that any of this modifies the
    natural history of the underlying proteostatic lesion.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metoprolol
      term:
        id: CHEBI:6904
        label: metoprolol
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
  notes: >-
    These are the agents actually used in a reported case, not a recommended
    regimen; no trial, guideline or cohort study addresses pharmacotherapy in
    KLHL24 cardiomyopathy specifically.
  evidence:
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband was on a long-term regimen of metoprolol succinate (47.5 mg daily), spironolactone (10 mg daily), and febuxostat (20 mg daily)."
    explanation: Documents the actual pharmacological management of a genetically confirmed case; cited as observed practice, not as evidence of efficacy.
- name: Genetic counselling and sibling cascade screening
  description: >-
    Counselling for CMH29 differs from counselling for dominant hypertrophic
    cardiomyopathy in the direction it points. The recurrence risk that matters
    is one in four for the proband's siblings, not fifty percent for offspring;
    the proband's children are obligate heterozygotes and, on present evidence,
    unaffected unless the other parent is also a carrier, which raises the
    question of partner testing in consanguineous families. Siblings should be
    offered targeted testing for the familial alleles and echocardiography
    without waiting for symptoms, because severe hypertrophy and biochemical
    heart failure have been documented in an entirely asymptomatic 18-year-old
    found by screening.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case expands the genetic spectrum of HCM and highlights the importance of genetic testing and family screening for KLHL24-related cardiomyopathies."
    explanation: States the family-screening recommendation that this counselling entry implements.
- name: No disease-modifying therapy
  description: >-
    Nothing addresses the underlying lesion. There is no way to restore CUL3
    substrate-adaptor function, and unlike the gain-of-function skin disease -
    where reducing KLHL24 abundance is at least a coherent therapeutic idea,
    and has been shown to restore desmin levels and tissue morphology in
    patient-derived engineered heart tissue - loss of function offers no
    obvious pharmacological handle. A review of KLHL24-associated cardiomyopathy
    published in 2025 confirms that no clinical trial of any kind is under way
    for this gene.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39708934
    reference_title: "KLHL24 associated cardiomyopathy: Gene function to clinical management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "currently there are no specific clinical trials going on regarding the therapeutic strategies among patients with KLHL24 mutations"
    explanation: Directly supports the absence of any disease-specific therapeutic development for KLHL24-associated cardiomyopathy.
  - reference: PMID:34292882
    reference_title: "Gain-of-function mutation in ubiquitin-ligase KLHL24 causes desmin degradation and dilatation in hiPSC-derived engineered heart tissues."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "KLHL24 RNA interference or direct desmin overexpression recovered desmin protein levels, restoring morphology and function in patient-derived dyn-EHTs."
    explanation: >-
      Marked PARTIAL because it is a proof of principle for the allelic
      gain-of-function disease, not for this entity. It is cited to make the
      asymmetry explicit: knocking KLHL24 down rescues the dominant disease and
      would, if anything, phenocopy this one.
animal_models:
- species: Danio rerio
  genotype: klhl24a splice-blocking antisense morpholino knockdown (morphant; no stable mutant line reported)
  category: Transient loss-of-function knockdown model
  description: >-
    The only in vivo model of this disorder, and it is a transient morpholino
    knockdown rather than a germline mutant - a distinction that limits how
    much weight it can carry. Zebrafish have two KLHL24 orthologues; klhl24a is
    expressed in the cardiac cone at 22 hours post fertilisation and in the
    ventricle at 72 hours, whereas klhl24b is not expressed in the developing
    heart, so the cardiac arm of the gene family is klhl24a. Knockdown produced
    pericardial oedema, altered heart rate and reduced circulation from 48
    hours, progressing to ventricular failure and blocked circulation in about
    90 percent of morphants against 4 percent of controls. A second,
    independently targeted morpholino reproduced the phenotype, and co-injection
    of wild-type klhl24a mRNA partially rescued it, which are the two standard
    specificity controls.

    The experiment that matters most for this entry is the allele test.
    Zebrafish klhl24a mRNA carrying the residues equivalent to the two human
    CMH29 alleles failed to rescue, giving heart defects in 71.5 and 77.5
    percent of embryos respectively. That is the direct functional evidence
    that p.Arg306His and p.Glu350* are loss-of-function alleles rather than
    dominant-negatives or benign variants.

    Its limitations are substantial and are the reason a knowledge gap is
    recorded below. The model is a knockdown, not a biallelic point-mutant; it
    reports on cardiac development in the embryo rather than on adult-onset
    hypertrophy; desmin protein levels were unchanged in morphants at 52 hours,
    which the authors attribute to the short experimental window; and it
    produces ventricular failure rather than the hypertrophy, polyglucosan
    storage or arrhythmia that define the human disease.

    Provenance and caveats. The morpholino doses, the second morpholino, the
    RT-PCR confirmation of exon 3 skipping, the rescue percentages, the
    allele-specific rescue failure percentages and the unchanged morphant
    desmin immunoblot are all in the full text and figures of PMID:30715372
    (PMC6812045, read 2026-08-01) and not in the cached abstract, so they are
    described here rather than quoted. Morpholino knockdowns are subject to
    well-documented off-target and p53-mediated artefacts; the
    second-morpholino and mRNA-rescue controls reported here mitigate but do
    not eliminate that concern. No mouse model of KLHL24 loss of function was
    found during this curation.
  associated_phenotypes:
  - Pericardial oedema
  - Altered heart rate
  - Ventricular failure with blocked circulation
  - Failure of rescue by mRNA carrying human CMH29 alleles
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knock-down of the zebrafish homologue klhl24a results in heart defects similar to that described for other HCM-linked genes providing additional support for KLHL24 as a HCM-associated gene."
    explanation: Establishes the zebrafish knockdown as the in vivo support for the gene-disease relationship and situates its phenotype alongside other HCM gene knockdowns in the same species.
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings reveal a crucial role for KLHL24 in cardiac development and function."
    explanation: The developmental conclusion drawn from the model, which is also the boundary of what it can show - development rather than adult-onset remodelling.
discussions:
- discussion_id: klhl24-polyglucosan-pathogenesis-unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of a CUL3 substrate adaptor produce polyglucosan bodies in
    cardiomyocytes, when KLHL24 has no known role in glycogen metabolism and no
    canonical polyglucosan storage gene is involved?
  rationale: >-
    This is the central unexplained fact about the disease, and it is the
    feature that OMIM chose to put in its name. The founding authors sequenced
    a dedicated nine-gene polyglucosan storage panel, found nothing, and stated
    plainly that the pathogenesis of the storage remains unknown and that it may
    serve as a diagnostic marker. Seven years later a PubMed search for
    `KLHL24 AND polyglucosan` returns zero records, so nobody has taken the
    question up. Three explanations are live and they have different
    consequences. First, the polyglucosan may be a secondary consequence of
    proteostatic failure - stalled autophagic or proteasomal flux is known to
    permit abnormal polysaccharide to accumulate, in which case the storage is
    epiphenomenal and the diagnostic marker is real but mechanistically empty.
    Second, KLHL24 may have an unidentified substrate in glycogen handling,
    which would make it a bona fide, if unconventional, glycogen-metabolism
    gene. Third, the polysaccharide may simply be trapped by the disorganised
    intermediate filament and tubular meshwork, a physical rather than
    metabolic explanation. Resolving this determines whether CMH29 should be
    classified among the inherited metabolic disorders at all - a classification
    this entry currently withholds for exactly this reason.
  attaches_to:
  - "pathophysiology#Intermyofibrillar Glycogen and Polyglucosan Storage"
  proposed_experiments:
  - experiment_id: klhl24-cardiac-glycogen-biochemistry
    name: Biochemical characterisation of the stored polysaccharide in KLHL24-null myocardium
    description: >-
      Determine chain-length distribution, branching ratio and phosphate
      content of the polysaccharide isolated from KLHL24-deficient cardiac
      tissue, and compare directly against material from PRKAG2 and GBE1
      hearts. If the material is biochemically identical to classical
      polyglucosan the metabolic hypothesis gains ground; if it differs, the
      trapping hypothesis does.
  - experiment_id: klhl24-substrate-proteomics-glycogen-enzymes
    name: Unbiased ubiquitylome and interactome of KLHL24 in cardiomyocytes
    description: >-
      Perform diGly proteomics and proximity labelling in wild-type versus
      KLHL24-null human iPSC-derived cardiomyocytes to ask whether any enzyme
      of glycogen synthesis, branching or degradation is a KLHL24 substrate.
      A comparable proteomic approach has already been applied to the
      gain-of-function allele and yielded a candidate substrate list, so the
      method is established for this gene.
  notes: >-
    The authors' statement of ignorance is in the discussion section of the
    full text of PMID:30715372 (PMC6812045, read 2026-08-01) and is not in the
    cached abstract, so this discussion carries no evidence item.
- discussion_id: klhl24-bidirectional-desmin-proteostasis
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do opposite perturbations of the same KLHL24-desmin axis produce
    opposite cardiac morphologies - hypertrophic with a small cavity when the
    ligase is dead, dilated when it is hyperactive - and is there a therapeutic
    window between them?
  rationale: >-
    KLHL24 is an unusually clean natural experiment: one gene, two directions,
    two cardiomyopathies. Excess adaptor activity depletes desmin, synemin and
    vimentin and gives dilated cardiomyopathy with mitochondrial mislocalisation
    and sarcomere shortening; absent adaptor activity lets desmin accumulate and
    gives hypertrophic cardiomyopathy with intermyofibrillar storage. The two
    have never been studied side by side in the same experimental system, and
    the intermediate states have never been probed at all. The question has
    direct therapeutic relevance in both directions: reducing KLHL24 abundance
    rescues the gain-of-function phenotype in engineered heart tissue, which
    implies a dose-response curve with an optimum somewhere between the two
    diseases, and mapping that curve is what would show whether a partial
    modulator is conceivable. It also bears on whether desmin abundance itself,
    rather than KLHL24 activity, is the proximate determinant of ventricular
    geometry.
  attaches_to:
  - "pathophysiology#Failure of Desmin Intermediate Filament Turnover"
  - "pathophysiology#Loss of CUL3-KLHL24 Substrate Adaptor Function"
  proposed_experiments:
  - experiment_id: klhl24-allelic-series-eht
    name: Isogenic KLHL24 allelic series in engineered heart tissue
    description: >-
      Build an isogenic iPSC panel spanning KLHL24 null, biallelic CMH29
      missense, heterozygous, wild-type, and deltaN28 gain-of-function, and
      measure desmin abundance, tissue geometry, force generation and calcium
      handling in dynamically loaded engineered heart tissues across the whole
      series. The gain-of-function end of this panel already exists and has
      been characterised, so only the loss-of-function arm is new.
  - experiment_id: klhl24-desmin-dose-titration
    name: Direct titration of cardiomyocyte desmin abundance
    description: >-
      Independently of KLHL24, titrate desmin levels up and down in
      cardiomyocytes and engineered tissues to test whether desmin abundance
      alone is sufficient to move tissue geometry between the hypertrophic and
      dilated poles, or whether other KLHL24 substrates are required.
- discussion_id: klhl24-silent-skeletal-muscle
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is skeletal muscle histologically severely abnormal but clinically
    normal in CMH29, when KLHL24 is expressed more highly in skeletal muscle
    than in heart?
  rationale: >-
    Every individual biopsied showed cogwheel fibres with desmin and glycogen
    accumulation affecting the majority of both fibre types, yet none had
    weakness or wasting and nerve conduction studies were normal. The HPO
    annotation set records muscle weakness at 0 of 8. This is not a minor
    curiosity: it is a counterexample to the assumption that intermediate
    filament accumulation causes muscle dysfunction, and it means the tissue
    with the highest KLHL24 expression is the tissue that tolerates its loss
    best. Candidate explanations include redundancy from another KLHL family
    adaptor in skeletal muscle, a lower mechanical demand for continuous desmin
    turnover in skeletal than in cardiac muscle, or subclinical dysfunction
    that nobody has looked for because no one has performed quantitative
    myometry, creatine kinase measurement or exercise testing in these
    individuals. It also has a practical consequence, which is that the
    absence of weakness must not be used to exclude the diagnosis.
  attaches_to:
  - "pathophysiology#Skeletal Muscle Cogwheel Fibre Pathology"
  proposed_experiments:
  - experiment_id: klhl24-skeletal-muscle-deep-phenotyping
    name: Quantitative skeletal muscle phenotyping of biallelic KLHL24 individuals
    description: >-
      Quantitative myometry, serum creatine kinase, muscle MRI and
      cardiopulmonary exercise testing in living biallelic individuals, to
      establish whether the skeletal muscle is genuinely unaffected
      functionally or merely unassessed.
  - experiment_id: klhl24-paralogue-redundancy-screen
    name: Test for KLHL paralogue redundancy in skeletal muscle
    description: >-
      Ask whether another KLHL family adaptor substitutes for KLHL24 in
      skeletal but not cardiac muscle, by comparing KLHL family expression
      between the two tissues and by testing whether co-depletion of a
      candidate paralogue unmasks a skeletal phenotype in a model system.
  notes: >-
    The absence of weakness and the normal nerve conduction studies are stated
    in the full text of PMID:30715372 (PMC6812045, read 2026-08-01) and are
    corroborated by the HPO annotation file for OMIM:620236, which records
    HP:0001324 at 0/8 (retrieved 2026-08-01). Neither source is quotable as a
    snippet from the cached abstract, so this discussion carries no evidence
    item.
- discussion_id: klhl24-no-model-of-the-human-genotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any model system represent the genotype that defines this disorder,
    given that the only in vivo work is an embryonic zebrafish morpholino
    knockdown and every cardiac cell model carries the gain-of-function allele
    instead?
  rationale: >-
    This is a model-fidelity problem rather than an absence of evidence, which
    is why it is recorded as HUMAN_MODEL_MISMATCH. Informative in vivo and in
    vitro work on KLHL24 in the heart exists, but none of it models CMH29. The
    zebrafish experiment is a transient knockdown assayed at 48 to 72 hours
    post fertilisation; it reports ventricular developmental failure, not
    adult-onset hypertrophy, and morphant desmin was unchanged over that
    window. Every human cardiac cell model published - the dynamically loaded
    engineered heart tissues, the patient iPSC lines, the proteomic
    characterisation of failing myocardium - carries the dominant
    KLHL24-deltaN28 gain-of-function allele, which produces the opposite
    molecular lesion. No mouse model of KLHL24 loss of function was identified
    during this curation. Consequently there is no system in which the
    polyglucosan storage, the desmin accumulation, the hypertrophy or the
    arrhythmia of this disease has ever been reproduced, and every mechanistic
    claim in this entry beyond the substrate identity rests on human
    histopathology from two families.
  attaches_to:
  - "pathophysiology#Intermyofibrillar Glycogen and Polyglucosan Storage"
  - "pathophysiology#Ventricular Electrical Instability and Malignant Arrhythmia"
  proposed_experiments:
  - experiment_id: klhl24-knockin-mouse-cmh29
    name: Knock-in mouse carrying a CMH29-equivalent biallelic genotype
    description: >-
      Generate homozygous p.Arg306His and null mice and phenotype the heart
      longitudinally with echocardiography, telemetry for arrhythmia, and
      PAS-diastase and desmin histology, to ask whether the polyglucosan and
      the arrhythmic phenotype are reproducible outside humans.
  - experiment_id: klhl24-null-ipsc-eht
    name: KLHL24-null human engineered heart tissue
    description: >-
      Build the loss-of-function counterpart of the existing gain-of-function
      engineered heart tissue system and measure desmin accumulation, tissue
      geometry, contractile force, calcium handling and arrhythmic propensity,
      to give the disease its first cardiac cell model.
- discussion_id: klhl24-arrhythmic-risk-stratification
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How should sudden death risk be stratified in biallelic KLHL24 individuals,
    given that malignant arrhythmia may precede structural severity and
    conventional hypertrophic cardiomyopathy risk models therefore underestimate
    it?
  rationale: >-
    Three of eleven young adults in the founding cohort died suddenly, and an
    independently reported adolescent received a prophylactic defibrillator on
    genotype grounds despite low conventional risk markers. Neither observation
    amounts to a risk model. The established HCM sudden-death calculators weight
    maximal wall thickness, left atrial size, outflow gradient, unexplained
    syncope, non-sustained ventricular tachycardia and family history of sudden
    death - and the last of those behaves differently in a recessive disease,
    where affected relatives are siblings rather than ancestors, and where a
    family with a single affected child has no family history to weight at all.
    The reported fibrosis burden also varies from minimal to extensive
    independently of hypertrophy, so late gadolinium enhancement may not carry
    its usual weight either. Whether every biallelic individual warrants a
    primary-prevention defibrillator is an open and consequential question,
    currently answered case by case.
  attaches_to:
  - "pathophysiology#Ventricular Electrical Instability and Malignant Arrhythmia"
  - "phenotypes#Sudden cardiac death"
  proposed_experiments:
  - experiment_id: klhl24-international-registry
    name: International registry of biallelic KLHL24 individuals
    description: >-
      Pool the small number of reported and unreported families into a
      genotype-defined registry with systematic prospective collection of
      arrhythmic events, device therapies, imaging and outcomes, which is the
      only realistic route to a risk model for a disease this rare.
  - experiment_id: klhl24-electrophysiological-phenotyping
    name: Systematic electrophysiological phenotyping
    description: >-
      Prospective ambulatory monitoring, signal-averaged electrocardiography
      and, where devices are implanted, interrogation-derived arrhythmia burden
      in biallelic individuals, to establish whether the arrhythmic substrate
      is detectable before structural disease.
- discussion_id: klhl24-gene-disease-validity-moderate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What evidence would move KLHL24 from moderate to strong or definitive
    gene-disease validity for hypertrophic cardiomyopathy, and is the disease
    entity being curated the same one ClinGen assessed?
  rationale: >-
    ClinGen's Hereditary Cardiovascular Disease expert panel classified KLHL24
    as moderate for hypertrophic cardiomyopathy with autosomal recessive
    inheritance in 2023, and the 2025 reappraisal publication confirms that
    placement. Moderate is the correct level and it constrains how this entry
    should be read: the human genetic evidence is a handful of small families
    and the functional evidence is a morpholino knockdown. Two things would move
    it - additional unrelated probands with segregating biallelic variants,
    which are accumulating steadily, and a cardiac functional model of the
    loss-of-function genotype, which does not yet exist. There is also a term
    mismatch worth flagging for anyone reusing this entry computationally:
    ClinGen curated against MONDO:0005045, the broad hypertrophic cardiomyopathy
    term, whereas the entity curated here is MONDO:0859372, a much narrower
    descendant two is_a steps below it (MONDO:0859372 is_a MONDO:0024573 is_a
    MONDO:0005045, per `runoak -i sqlite:obo:mondo paths -p i --target
    MONDO:0005045 MONDO:0859372`). The classification supports the gene and the mode of
    inheritance; it does not adjudicate the entity boundary, and nothing in this
    entry should be read as claiming that it does.
  attaches_to:
  - "genetic#KLHL24"
  proposed_experiments:
  - experiment_id: klhl24-reappraisal-with-new-probands
    name: ClinGen re-curation incorporating post-2023 probands
    description: >-
      Re-run the gene-disease validity curation including the Brazilian family
      and the two families reported from China and India after the 2023
      assessment, and the cardiac functional data that has appeared since, to
      test whether the classification now supports an upgrade.

name: KLHL24-Related Hypertrophic Cardiomyopathy
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
  term:
    id: MONDO:0859372
    label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
description: >-
  Hypertrophic cardiomyopathy 29 (CMH29) is an autosomal recessive,
  cardiac-restricted cardiomyopathy caused by biallelic loss-of-function
  variants in KLHL24, the gene encoding a BTB-BACK-Kelch substrate adaptor of
  the CUL3-RING E3 ubiquitin ligase. It was defined in 2019 in two unrelated
  consanguineous families, one Iraqi and one Iranian, in whom homozygous KLHL24
  variants segregated with a cardiomyopathy that mimics sarcomeric hypertrophic
  cardiomyopathy clinically but is separable from it pathologically.

  The mechanistic core of the disease is a failure of regulated intermediate
  filament turnover. KLHL24 presents substrates to CUL3 for polyubiquitination
  and proteasomal degradation; in striated muscle its principal known substrate
  is desmin, the muscle-specific intermediate filament and the cardiac
  counterpart of the keratin-14 that the same protein degrades in skin. When
  KLHL24 is inactivated, desmin is no longer cleared. Endomyocardial and
  skeletal muscle biopsies from the founding families showed accumulation of
  desmin intermediate filaments, and immunoblotting showed desmin markedly
  upregulated in both heart and skeletal muscle. Alongside the filaments, the
  intermyofibrillar space fills with glycogen, sarcoplasmic-reticulum-derived
  tubular structures, and discrete polyglucosan bodies - diastase-resistant,
  amylopectin-like polysaccharide inclusions that give the OMIM entity its
  name. No variant was found in any gene on the nine-gene polyglucosan-storage
  panel the authors screened, and they state explicitly that the origin of
  the polyglucosan remains unknown; it is presented as a diagnostic marker
  rather than as an explained step in the causal chain, and this entry does the
  same.

  Clinically the disease presents in young adulthood with recurrent syncope,
  exertional dyspnoea and palpitations, with asymmetric septal hypertrophy, a
  small left ventricular cavity, systolic anterior motion of the mitral valve
  and left ventricular outflow tract obstruction on echocardiography. Its
  defining feature is arrhythmic rather than haemodynamic: of the 11 young
  affected adults in the founding report, 3 died suddenly and 1 required
  cardiac transplantation for heart failure. Skin is not involved, and skeletal
  muscle weakness was absent in every individual examined despite florid
  histological abnormality on muscle biopsy.

  KLHL24 is one of the clearest allelic-contrast genes in cardiology. The same
  gene, mutated at its translation initiation codon, produces the opposite
  molecular lesion - a stabilised N-terminally truncated protein that escapes
  autoubiquitination and hyperdegrades its own substrates - and the opposite
  clinical disease: autosomal dominant epidermolysis bullosa simplex 6 with
  skin fragility, scarring alopecia and dilated, not hypertrophic,
  cardiomyopathy. Too little KLHL24 activity gives desmin accumulation and a
  thick, stiff, small-cavity ventricle; too much gives desmin depletion and a
  thin, dilated one.
parents:
- Cardiovascular Disease
- Genetic Disorder
synonyms:
- CMH29
- cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
- hypertrophic cardiomyopathy 29
- KLHL24-related cardiomyopathy
- autosomal recessive KLHL24 cardiomyopathy
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      The entire reported morbidity is cardiac: hypertrophic remodelling of the
      left ventricle, outflow tract obstruction, ventricular arrhythmia, sudden
      cardiac death and progression to transplantation. Skeletal muscle is
      abnormal on biopsy but clinically silent, and no skin, neurological,
      renal or hepatic involvement has been described in any individual with
      biallelic KLHL24 variants.
    evidence:
    - reference: PMID:30715372
      reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the 11 young affected adults identified, 3 died suddenly and 1 had a cardiac transplant due to heart failure."
      explanation: The reported burden of disease is entirely cardiovascular - arrhythmic death and heart failure - which is the basis for the CARDIOVASCULAR chapter assignment.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  ENTITY VERIFICATION AND NEC PREFLIGHT. The target term was verified with OAK
  before any content was written. `runoak -i sqlite:obo:mondo info
  MONDO:0859372 -O obo` returns name "cardiomyopathy, familial hypertrophic,
  29, with polyglucosan bodies", xref OMIM:620236, xrefs GARD:0026721,
  MEDGEN:1824081, UMLS:C5774308, `is_a MONDO:0024573` (familial hypertrophic
  cardiomyopathy) and `relationship: RO:0004003 HGNC:25947 ! KLHL24`.
  `runoak -i sqlite:obo:mondo relationships -p RO:0004003 MONDO:0859372`
  returns the same single gene association. `runoak -i sqlite:obo:hgnc info
  hgnc:25947` returns KLHL24. The causal gene is therefore KLHL24 and not
  PRKAG2, which is the specific confusion this entity has already produced in
  this repository (see the scoping note below).

  Every source used here was gene-checked before use. The founding clinical
  report (PMID:30715372) names KLHL24 throughout and names no other candidate
  gene; it explicitly screened and excluded an 88-gene panel of inherited
  cardiac conditions and a 9-gene polyglucosan-storage panel before reaching
  KLHL24. The corroborating reports (PMID:36672924, PMID:40176835,
  PMID:42158087, PMID:41823911) each report KLHL24 as the segregating gene in
  their own families. No deep-research report was used for this entry; the
  literature was assembled directly from a PubMed query for KLHL24 (71 records
  on 2026-08-01), each record's title and abstract read individually, and the
  cardiac subset separated by hand from the much larger dermatological and
  bioinformatics subsets.

  SCOPING AGAINST PRKAG2. `kb/disorders/PRKAG2_Cardiac_Syndrome.yaml` carries an
  NEC finding recording that a previous curation request named MONDO:0859372
  but described PRKAG2 biology throughout, and that CMH29/KLHL24 therefore
  remained uncurated. This entry is that missing entity. The two diseases are
  genuinely distinct and are deliberately kept split: PRKAG2 cardiac syndrome
  (MONDO:0800484, HGNC:9386, verified with OAK) is a dominant, non-lysosomal
  cardiac glycogenosis in which constitutive AMP-kinase activation drives bulk
  glycogen and polyglucosan storage and the electrophysiological signature is
  ventricular pre-excitation with progressive atrioventricular block; CMH29 is
  a recessive proteostasis defect in which the primary storage species is
  desmin intermediate filament, the polyglucosan is a secondary and
  unexplained finding, and the electrophysiological signature is malignant
  ventricular arrhythmia without accessory pathways. PRKAG2 is one of the eight
  genes canonically associated with muscle polyglucosan storage in
  PMID:26278982; KLHL24 is not, and was reached only after the founding
  study's own nine-gene polyglucosan-storage panel had been excluded. Whether
  that nine-gene panel is exactly the 2015 review's eight genes plus one is
  not stated in the paper and is not asserted here. Nothing in
  `kb/disorders/PRKAG2_Cardiac_Syndrome.yaml` was modified.

  SCOPING AGAINST THE OTHER TWO KLHL24-BEARING FILES.
  `kb/disorders/Hypertrophic_Cardiomyopathy.yaml` carries KLHL24 as one row of
  a gene panel and cites the same ClinGen assertion quoted here; that file
  models sarcomeric HCM as a whole and does not model this entity's mechanism.
  `kb/disorders/Epidermolysis_Bullosa_Simplex.yaml` carries KLHL24 as a
  causative gene for the dominant skin disease and correctly describes the
  gain-of-function start-codon mechanism. Both were read and neither was
  modified. The allelic relationship between the dermatological entity
  (MONDO:0015006, EBS6, OMIM:617294, KLHL24, autosomal dominant - verified with
  OAK) and this one is curated below as a differential diagnosis and as a
  mechanism contrast, because it is the single most informative fact about this
  gene.

  LUMP-VS-SPLIT VERSUS SARCOMERIC HCM. This entity is kept split from
  `kb/disorders/Hypertrophic_Cardiomyopathy.yaml` on the same reasoning applied
  to PRKAG2 in this repository. The two share the gross phenotype of increased
  left ventricular wall thickness and diverge at every modelled level: the
  primary lesion (ubiquitin-ligase substrate adaptor versus contractile
  sarcomere protein), inheritance (recessive versus dominant), the
  histopathology (desmin and polyglucosan accumulation versus myofibre disarray
  with interstitial fibrosis), and the substrate of the hypertrophy
  (proteostatic accumulation versus contractile-protein dysfunction). ClinGen
  nonetheless curated the gene against the broad HCM term MONDO:0005045, which
  is why the ClinGen assertion is quoted here despite the term mismatch; that
  mismatch is stated explicitly wherever the assertion is cited.

  EVIDENCE BASE AND ITS LIMITS. This is a thin, single-founding-cohort disease
  and is curated as such. PMID:30715372 (Hedberg-Oldfors et al., Hum Mol Genet
  2019) is the only publication that describes the histopathology; it is the
  source of the OMIM entry and of every HPO annotation attached to
  OMIM:620236. Only its abstract is cached, so all histological,
  ultrastructural, clinical-table and demographic detail below - including the
  Iraqi and Iranian descent of the two founding families, which the full text
  states as "two families with autosomal recessive cardiomyopathy originating
  from Iraq (family A) and Iran (family B)" and tabulates per individual under
  "Descent" in Table 1 - is derived from the open-access full text
  (PMC6812045, read 2026-08-01) and is attributed to it inline rather than
  asserted with a snippet. Four subsequent independent families have been
  reported (PMID:36672924, PMID:40176835, PMID:42158087, PMID:41823911), which
  is what carries the gene-disease relationship past a single observation, but
  none of them repeats the muscle-biopsy work, so the polyglucosan finding that
  names the OMIM entity has never been independently replicated.

  NO GENEREVIEWS BASELINE EXISTS. No reference here carries `tags:
  [GeneReviews]` because there is no GeneReviews chapter for this entity. A
  PubMed E-utilities search on 2026-08-01 for `KLHL24 AND GeneReviews[book]`
  returns exactly one record, PMID:20301543 - the Epidermolysis Bullosa Simplex
  chapter, which covers the dominant start-codon KLHL24 disease (EBS6,
  MONDO:0015006) and not this recessive cardiomyopathy. That chapter is
  therefore not a baseline for this entry and is not cited as one; the
  dominant/recessive contrast it belongs to is instead curated below as a
  differential diagnosis.

  ANCESTRY VERSUS REPORTING CENTRE. Only two of those four reports state the
  family's descent: PMID:36672924 describes "consanguineous Middle Eastern
  families" and PMID:40176835 a "Brazilian family". PMID:42158087 and
  PMID:41823911 state no ancestry at all - the first describes only "two
  siblings in a non-consanguineous family" and the second only "a 16-year-old
  asymptomatic young man". Those two are therefore referred to throughout this
  entry by the country of the reporting centre (Chengdu, China and
  Thiruvananthapuram, India), which is a statement about where the case was
  published from and not about the patients' ancestry. Author affiliation is
  not an ancestry annotation and is not used as one here.

  DISCORDANT SOURCE, RESOLVED AGAINST THE PRIMARY DATA. The MedGen record for
  this concept (C5774308) lists Muscle weakness (HP:0001324) among its clinical
  features. That is misleading. The HPO annotation file for OMIM:620236
  (retrieved 2026-08-01 from
  https://ontology.jax.org/api/network/annotation/OMIM:620236) records
  HP:0001324 at 0/8 - that is, an explicitly EXCLUDED feature - and the primary
  paper states that no signs of muscular atrophy or weakness were found and
  that nerve conduction studies were normal. Muscle weakness is therefore NOT
  curated as a phenotype of this disease. The dissociation between severe
  skeletal muscle histopathology and absent skeletal muscle symptoms is
  recorded instead as a histopathology finding and as an open question.

  ICIMD CLASSIFICATION DELIBERATELY OMITTED. Despite the polyglucosan storage,
  this entry is not tagged with an inherited-metabolic-disorder category. No
  enzyme or regulator of glycogen metabolism is involved, the founding study's
  nine-gene polyglucosan-storage panel was sequenced and excluded, and the
  authors state that the pathogenesis of the storage is unknown. Classifying it
  as a glycogen-metabolism disorder would assert a mechanism nobody has
  demonstrated. `kb/disorders/PRKAG2_Cardiac_Syndrome.yaml`, where the
  metabolic lesion is established, does carry that tag; the contrast is
  intentional.

  FREQUENCY BANDS DELIBERATELY OMITTED FROM EVERY PHENOTYPE. HPO annotations
  for OMIM:620236 exist and carry exact fractions, but every one of them
  derives from the same two consanguineous families with denominators between 2
  and 11, and the denominators differ per feature because different individuals
  were investigated to different depths. One reclassified individual moves most
  features across a FrequencyEnum boundary. The exact fraction and its
  denominator are recorded in each phenotype's `notes:` instead, per the
  repository's guidance to omit rather than fabricate a band.

  COVERAGE OF THE HPO ANNOTATION SET. The annotation file for OMIM:620236
  (retrieved 2026-08-01 from
  https://ontology.jax.org/api/network/annotation/OMIM:620236) carries 13
  annotations, and every one of them is accounted for: ten are bound as
  phenotypes below, HP:0000007 Autosomal recessive inheritance is carried in
  the `inheritance:` block, HP:0011462 Young adult onset is carried as the
  `onset_category` of the Hypertrophic cardiomyopathy phenotype rather than as
  a separate feature, and HP:0001324 Muscle weakness is annotated at 0/8 - an
  excluded feature - and is therefore deliberately not curated, for the reasons
  set out above. Four further phenotypes below (Hypertrophic cardiomyopathy,
  Syncope, Ventricular arrhythmia, Congestive heart failure) and one
  histopathological phenotype (Cardiac polyglucosan accumulation) are curator
  additions from the primary literature that the annotation file does not
  carry; their `notes:` say so.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    CMH29 requires two damaged KLHL24 alleles. The founding report identified
    homozygous variants in two consanguineous families and showed that the
    parents of affected individuals were heterozygous carriers and unaffected;
    an additional branch of the Iranian family independently produced a
    homozygous affected offspring of heterozygous parents, which is what
    established the recessive pattern rather than assumed it. Subsequent
    families confirm the same architecture in a non-consanguineous setting: a
    Chinese sibship carried compound heterozygous variants inherited one from
    each clinically asymptomatic parent, and an Indian case carried compound
    heterozygous truncating variants with no family history of hypertrophic
    cardiomyopathy.

    This is the point of greatest clinical consequence in the entry. Because
    the disease is recessive and the parents are unaffected, a young adult with
    unexplained septal hypertrophy and no family history is exactly the
    presentation in which a dominant sarcomeric aetiology is assumed and in
    which KLHL24 will be missed unless the panel includes it. Penetrance in
    biallelic individuals appears complete on the evidence available - every
    reported homozygote or compound heterozygote had a demonstrable cardiac
    phenotype - but the total number of biallelic individuals ever described is
    small enough that this should be read as an absence of counterexamples
    rather than as a penetrance estimate. Heterozygous carriers are not
    reported to be affected, and no carrier phenotype has been sought
    systematically.

    Provenance for this assertion. The HPO annotation file for OMIM:620236
    records HP:0000007 sourced to PMID:30715372 (retrieved 2026-08-01), and the
    ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel curated
    the KLHL24 gene-disease relationship specifically under an AR mode of
    inheritance. No dominant mode of inheritance is asserted for this entity;
    the dominant KLHL24 disease is the allelic skin disorder EBS6
    (MONDO:0015006), curated below as a differential.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified homozygous mutations in KLHL24 in two consanguineous families with HCM"
    explanation: Homozygous variants segregating in two consanguineous families is the primary observation establishing autosomal recessive inheritance for this entity.
  - reference: CGGV:assertion_f1d4ce43-4c2d-41a0-b821-a11ac8eb8fca-2023-09-28T160000.000Z
    reference_title: "KLHL24 / hypertrophic cardiomyopathy (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KLHL24 | HGNC:25947 | hypertrophic cardiomyopathy | MONDO:0005045 | AR | Moderate"
    explanation: >-
      ClinGen's expert panel independently assigned an autosomal recessive mode
      of inheritance to the KLHL24 hypertrophic cardiomyopathy relationship.
      Note the term mismatch - ClinGen curated against the broad HCM term
      MONDO:0005045 rather than against MONDO:0859372 - so this row supports the
      gene, the MOI and the strength of evidence, not the entity boundary.
  - reference: PMID:40176835
    reference_title: "Coexistence of Rare Genetic Disorders in a Consanguineous Family: Case Study of KLHL24-Related Hypertrophic Cardiomyopathy and Char Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two sisters are diagnosed with autosomal recessive KLHL24-related hypertrophic cardiomyopathy"
    explanation: An independent consanguineous family, on a different continent from the founding families, replicates the recessive inheritance pattern.
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family verification revealed a recessive inheritance pattern, with each parent carrying one of the mutations."
    explanation: Compound heterozygosity in trans in a non-consanguineous family demonstrates that the recessive architecture is not an artefact of consanguinity or of a single founder haplotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence or incidence estimate of any kind has been published for
    CMH29, and the 2026 case report cited below states that plainly. The total
    published experience consists of the two founding consanguineous families
    (11 young affected adults ascertained, of whom 8 are tabulated with clinical
    detail), plus four subsequent families - a Middle Eastern consanguineous
    family in a recessive-cardiomyopathy exome series, a Brazilian
    consanguineous family with two affected sisters, a non-consanguineous
    sibship of two reported from China, and a single adolescent reported from
    India. `NOT_YET_DOCUMENTED` is used rather than a qualitative band because
    there is no source to band, and `rate_per_100000` is deliberately left
    empty. Ascertainment to date is heavily weighted towards consanguineous
    populations and towards centres running broad exome-based cardiomyopathy
    panels, so the geographic distribution of reports reflects how the disease
    is found rather than where it occurs. Note that the last two reports state
    only the reporting centre, not the family's ancestry; see the
    ancestry-versus-reporting-centre note in the entry description.
  evidence:
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is currently no epidemiological data on recessive-inherited hypertrophic cardiomyopathy type 29 caused by KLHL24 variants"
    explanation: An explicit statement from a 2026 report that no epidemiological data exist for this entity, which is the justification for NOT_YET_DOCUMENTED.
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 11 young affected adults identified, 3 died suddenly and 1 had a cardiac transplant due to heart failure."
    explanation: Establishes the size of the founding cohort, which is the denominator behind every published clinical statistic about this disease.
pathophysiology:
- name: Biallelic Loss-of-Function KLHL24 Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The primary lesion is biallelic damage to KLHL24 at 3q27.1, reported against
    transcript NM_017644.3. The founding alleles are a homozygous nonsense
    variant c.1048G>T (p.Glu350*) in the Kelch-repeat region and a homozygous
    missense variant c.917G>A (p.Arg306His) at a residue conserved both across
    vertebrates and across the KLHL protein family. Later families add a
    frameshift in the BACK domain and a missense in the Kelch domain in trans,
    and compound heterozygous truncating alleles. All reported CMH29 genotypes
    therefore damage the BACK or Kelch portions of the protein - the substrate
    adaptor machinery - and none of them affects the translation initiation
    codon, which is the region mutated in the dominant skin disease. That
    positional separation is the structural basis of the allelic contrast that
    runs through this entry.

    The alleles behave as true loss of function rather than as
    dominant-negatives: heterozygous parents are unaffected, and both founding
    alleles failed to rescue zebrafish klhl24a knockdown when the equivalent
    substitutions were engineered into the fish transcript, whereas wild-type
    klhl24a mRNA did rescue.
  genes:
  - preferred_term: KLHL24
    term:
      id: hgnc:25947
      label: KLHL24
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that mutations in KLHL24 cause HCM in humans."
    explanation: Establishes KLHL24 as the causal gene for this hypertrophic cardiomyopathy entity.
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.532del frameshift variant truncates the BACK domain, resulting in complete loss of function (LOF) of the mutant allele."
    explanation: Assigns a reported CMH29 allele to a specific functional domain and classifies its consequence as complete loss of function, which is the variant class that defines this entity.
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case demonstrates that biallelic, loss-of-function KLHL24 mutations can cause severe, early-onset recessive HCM, even in the absence of the cutaneous features typically associated with dominant gain-of-function variants."
    explanation: States the loss-of-function versus gain-of-function contrast directly and ties the cardiac-only presentation to the loss-of-function allele class.
  notes: >-
    Allelic detail. The variant coordinates, the 8.7 Mb and 3.4 Mb runs of
    homozygosity, the LOD score of 3.6 in the Iranian family, the absence of
    both alleles from the Greater Middle Eastern Variome and from 500
    ancestry-matched in-house exomes, and the KLHL24 Residual Variation
    Intolerance Score of -0.78 (13.22nd percentile) are all in the full text of
    PMID:30715372 (PMC6812045, read 2026-08-01) and not in the cached abstract,
    so they are recorded here rather than quoted.
  downstream:
  - target: Loss of CUL3-KLHL24 Substrate Adaptor Function
    description: >-
      Nonsense and frameshift alleles remove the substrate-binding apparatus
      outright; the p.Arg306His and p.Tyr505Cys missense alleles sit in
      conserved Kelch-repeat positions and are predicted to disrupt the
      substrate-binding pocket of the beta-propeller. Either way the CUL3
      complex loses its ability to select this adaptor's substrates.
- name: Loss of CUL3-KLHL24 Substrate Adaptor Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    KLHL24 is a BTB-BACK-Kelch protein. Its BTB and BACK domains dock onto
    CUL3, and its C-terminal six-bladed Kelch beta-propeller selects
    substrates; the assembled CUL3-RBX1-KLHL24 complex then transfers ubiquitin
    onto those substrates and commits them to the 26S proteasome. KLHL24 is not
    a housekeeping component of that machinery but a specificity module: which
    proteins are degraded depends on which Kelch adaptor is loaded. Losing
    KLHL24 therefore does not impair ubiquitination in general - it removes one
    branch of substrate selection, which is why the disease is
    tissue-restricted despite the ubiquity of the proteasome. KLHL24 is most
    highly expressed in skeletal muscle, then lung, then left ventricle, so the
    branch that is lost is the one that operates in striated muscle.
  genes:
  - preferred_term: KLHL24
    term:
      id: hgnc:25947
      label: KLHL24
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  protein_complexes:
  - preferred_term: CUL3-RBX1-KLHL24 E3 ubiquitin ligase
    modifier: DECREASED
    term:
      id: GO:0031463
      label: Cul3-RING ubiquitin ligase complex
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    modifier: DECREASED
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
  biological_processes:
  - preferred_term: substrate polyubiquitination by the CUL3-KLHL24 ligase
    modifier: DECREASED
    term:
      id: GO:0000209
      label: protein polyubiquitination
  - preferred_term: proteasomal degradation of KLHL24 substrates
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:30715372
    reference_title: "Cardiomyopathy with lethal arrhythmias associated with inactivation of KLHL24."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KLHL24 is a member of the Kelch-like protein family, which acts as substrate-specific adaptors to Cullin E3 ubiquitin ligases."
    explanation: Establishes the molecular function of the gene product as a substrate-selecting adaptor for a Cullin-RING E3 ubiquitin ligase.
  - reference: PMID:41348940
    reference_title: "KLHL24 mutation drives intermediate filament degradation, mitochondrial dysfunction and fibrosis in heart failure patients."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KLHL24 is a component of the ubiquitin-proteasome system and acts as a substrate-specific adaptor protein for E3 ubiquitin ligase."
    explanation: >-
      Independent statement of the substrate-adaptor function from a cardiac
      rather than a dermatological group. Tagged OTHER rather than IN_VITRO
      because this sentence sits in the paper's AIMS section and is background
      framing of established biology, not a result generated by the study's own
      hiPSC experiments.
  - reference: PMID:42158087
    reference_title: "Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KLHL24 encodes a substrate adaptor of the Cullin3 (CUL3) E3 ubiquitin ligase complex, with two core functional domains: the N-terminal BACK domain and the C-terminal KELCH repeat domain"
    explanation: Names the two functional domains that CMH29 alleles disrupt and identifies CUL3 as the cullin scaffold, which is the structural basis for treating these variants as adaptor-function loss.
  notes: >-
    The tissue-expression ranking (skeletal muscle > lung > left ventricle,
    GTEx v6p) is reported in the full text of PMID:30715372 (PMC6812045, read
    2026-08-01) and is not in the cached abstract, so it is recorded here
    rather than quoted. Note that this expression pattern is itself part of
    the disease's unexplained anatomy: the tissue with the highest expression,
    skeletal muscle, is the one that is histologically abnormal but clinically
    silent.
  downstream:
  - target: Failure of Desmin Intermediate Filament Turnover
    description: >-
      The only KLHL24 substrate identified in striated muscle is desmin. With
      the adaptor gone, desmin escapes ubiquitin-dependent clearance and
      accumulates.

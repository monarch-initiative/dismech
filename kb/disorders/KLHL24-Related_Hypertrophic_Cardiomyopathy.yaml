- name: Sarcoplasmic Reticulum-Derived Tubular Aggregation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A third species accumulates in the same intermyofibrillar compartment:
    arrays of tubular membranous structures. Their origin was inferred
    histochemically in the founding study - the accumulated material stained
    for NADH-tetrazolium reductase but was negative for succinate
    dehydrogenase, a combination that indicates sarcoplasmic reticulum rather
    than mitochondria. This matters clinically as well as mechanistically,
    because it excludes a mitochondrial myopathy from the differential on the
    biopsy itself, and it is consistent with a disease of proteostasis
    spreading to membrane-compartment organisation rather than a primary
    bioenergetic lesion. It is marked PROVISIONAL because the inference rests
    on a histochemical staining pattern in one study and has not been confirmed
    by marker immunolocalisation or by any subsequent report.

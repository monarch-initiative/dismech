- name: Cardiomyocyte Hypertrophy and Concentric Left Ventricular Remodelling
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The myocyte enlarges. The founding heart explant and endomyocardial
    biopsies showed myocyte hypertrophy, and the HPO annotation set records
    cardiomyocyte hypertrophy in both individuals examined histologically. At
    organ level this produces the picture that brings patients to attention:
    severe septal thickening, a small left ventricular cavity, a reduced left
    ventricular end-systolic diameter, systolic anterior motion of the mitral
    valve and dynamic left ventricular outflow tract obstruction, with ejection
    fraction preserved or supranormal early on.

    Two things distinguish this hypertrophy from sarcomeric HCM. First, part of
    the wall thickness is storage rather than contractile mass - accumulated
    filaments, polysaccharide and membrane occupy the intermyofibrillar space.
    Second, myofibre disarray, the histological hallmark of sarcomeric HCM, is
    not what the biopsies show; what they show is intermyofibrillar
    accumulation. The clinical phenotype is nevertheless indistinguishable at
    the echocardiogram, which is precisely why the disease is missed.

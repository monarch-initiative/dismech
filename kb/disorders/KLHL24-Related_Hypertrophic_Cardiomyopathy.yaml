- name: Progression to Systolic Failure and Transplantation
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Not every individual stays in the hypertrophic, preserved-ejection-fraction
    phase. One of the two Iraqi siblings developed a moderately dilated left
    ventricle with regional akinesia and an ejection fraction of 25 percent,
    and underwent cardiac transplantation at 26; her brother, whose
    echocardiogram was recorded at 28, retained an ejection fraction of 50
    percent. In the independently reported non-consanguineous sibship of
    PMID:42158087, the proband's ejection fraction fell progressively from 77
    to 55 percent over two years of follow-up with the emergence of definite
    diastolic dysfunction. A separate exome series describing a consanguineous
    Middle Eastern family reported the KLHL24 phenotype as a mixture of dilated
    and hypertrophic features with non-compaction, which suggests that the
    hypertrophic-to-dilated transition may be part of the natural history of
    the gene rather than an idiosyncrasy of one family.

    This is marked PROVISIONAL because the number of individuals followed
    longitudinally is very small and the reported phenotypes span hypertrophic,
    dilated and non-compaction morphology without a clear ordering in time.

- name: Myocardial Fibrosis and Focal Macrophage Infiltration
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The CMH29 heart develops patchy interstitial fibrosis, and the founding
    explant showed small CD68-positive macrophage infiltrates that were
    preferentially associated with polyglucosan-containing myocytes. That
    spatial association suggests the inclusions themselves recruit the
    infiltrate - an inclusion-triggered innate response rather than a diffuse
    inflammatory cardiomyopathy - but the observation is from one explanted
    heart and has not been replicated. The extent of fibrosis is variable: the
    founding explant showed patchy scar, one independently reported adolescent
    had minimal fibrosis despite severe hypertrophy, while another young adult
    had extensive late-gadolinium-enhancement-positive septal scar. Fibrosis
    burden therefore does not track hypertrophy severity in this disease, which
    is one reason conventional imaging-based risk scores behave poorly in it.

- name: Intermyofibrillar Glycogen and Polyglucosan Storage
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Alongside the accumulated filaments, the intermyofibrillar space of CMH29
    cardiomyocytes fills with glycogen and with discrete polyglucosan bodies -
    periodic-acid-Schiff-positive material that resists alpha-amylase
    digestion, identifying it as the amylopectin-like, poorly branched,
    poorly soluble polysaccharide called polyglucosan rather than as ordinary
    glycogen. Skeletal muscle shows the same focal subsarcolemmal and
    intermyofibrillar glycogen accumulation.

    This node is deliberately marked HYPOTHETICAL, because its mechanism is
    genuinely unknown and the founding authors say so. Cardiomyopathies with
    polyglucosan accumulation are otherwise essentially confined to disorders
    of glycogen metabolism, and eight genes are canonically associated with
    muscle polyglucosan storage - GYG1, GBE1, RBCK1, PFKM, EPM2A, EPM2B,
    PRDM8 and PRKAG2. None of those was mutated in the founding families; a
    dedicated nine-gene polyglucosan-storage panel was screened and excluded
    before KLHL24 was reached. KLHL24 has no known role in glycogen metabolism,
    and no experiment has connected loss of its ligase-adaptor function to
    polysaccharide handling. Three explanations remain open and are set out in
    the knowledge-gap discussion below. Until one is demonstrated, the
    polyglucosan is curated as a reproducible diagnostic marker of the disease
    and as an unexplained co-occurrence, not as a step in the causal chain.

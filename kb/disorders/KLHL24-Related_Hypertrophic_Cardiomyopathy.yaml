    hgnc:25947` and against the MONDO gene association for MONDO:0859372,
    2026-08-01). Reference transcript in both the founding report and the most
    recent case report is NM_017644.3.

    Allelic architecture, and the positional rule that separates the two KLHL24
    diseases. The recessive cardiac alleles reported to date are the homozygous
    nonsense c.1048G>T (p.Glu350*) and homozygous missense c.917G>A
    (p.Arg306His) of the founding families, and the compound heterozygous
    frameshift c.532del (p.His178Ilefs*66) in the BACK domain with missense
    c.1514A>G (p.Tyr505Cys) in the Kelch domain reported in the
    non-consanguineous sibship of PMID:42158087.
    Every one of these lies well downstream of the start codon, in the domains
    that dock CUL3 and select substrates. The dominant skin alleles, by
    contrast, are confined to the translation initiation codon and its
    immediate vicinity - c.1A>G, c.1A>T, c.2T>C, c.2T>G, c.3G>A, c.3G>C,
    c.3G>T - plus, as later shown, any nonsense-inducing change in c.4_84 that
    permits translation re-initiation at Met29. The rule is therefore
    positional as well as functional: variants that abolish the normal start
    codon and allow re-initiation produce a stabilised, hyperactive
    KLHL24-deltaN28 and dominant disease; variants that damage the body of the
    protein produce a dead adaptor and recessive disease. A diagnostic
    laboratory reporting a KLHL24 variant cannot assign a phenotype from the
    gene alone, and must read the position and the zygosity.

    Gene-disease validity. ClinGen's Hereditary Cardiovascular Disease Gene
    Curation Expert Panel classified KLHL24 as MODERATE for hypertrophic
    cardiomyopathy under autosomal recessive inheritance in September 2023, and
    the panel's 2025 reappraisal publication lists KLHL24 among the newly
    curated genes reaching moderate evidence. Moderate, not definitive or
    strong, is the honest state of this gene: the human genetic evidence is
    several small families and the experimental evidence is a zebrafish
    morpholino knockdown with allele-specific rescue failure. That is enough to
    justify including KLHL24 on a hypertrophic cardiomyopathy panel and
    reporting biallelic loss-of-function variants, and not enough to treat a
    single biallelic finding as diagnostic without phenotype correlation.

    Not asserted, deliberately. No gnomAD constraint metric (pLI, o/e LoF,
    missense Z) is recorded anywhere in this entry, because none was retrieved
    from a primary source during this curation. The founding paper's Residual
    Variation Intolerance Score is recorded in the pathophysiology notes with
    its source rather than restated as a constraint claim. No founder allele,
    modifier locus, methylation episignature, digenic contribution or somatic
    mechanism has been described for this disease and none is asserted.

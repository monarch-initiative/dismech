name: Chilton-Okur-Chung Neurodevelopmental Syndrome
creation_date: "2026-10-16T15:00:00Z"
description: >-
  Chilton-Okur-Chung neurodevelopmental syndrome is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous, usually de novo, variants
  in CDC42BPB, which encodes MRCKbeta, a serine/threonine kinase that acts
  downstream of the GTPase CDC42 and phosphorylates the myosin II regulatory
  light chain. Affected individuals have developmental delay or intellectual
  disability, autism, hypotonia, and structural brain anomalies including
  cerebellar vermis hypoplasia and agenesis or hypoplasia of the corpus
  callosum. Truncating variants are predicted to act through
  haploinsufficiency; the effect of the clustered missense variants is not
  established.
notes: >-
  No GeneReviews or StatPearls chapter covers this disorder. The largest cohort
  to date, Duz et al. 2026 (BMC Med Genomics, DOI:10.1186/s12920-026-02448-w,
  37 individuals), is not cited: as of 2026-11-13 it has no PubMed record and
  only a publisher landing page was retrievable without an abstract or full
  text. Its reported features beyond this entry's phenotypes (attention deficit
  hyperactivity disorder, seizures, macrocephaly, ventriculomegaly) are
  therefore not listed here. The cited founding series (PMID:32031333) is
  abstract-only, so phenotype frequencies are also omitted. Patient acp05y in PMID:40243517
  carries a de novo heterozygous CDC42BPB missense variant (c.4049G>A,
  p.Arg1350Gln) with spastic quadriplegia, epilepsy, and holoprosencephaly/
  schizencephaly; the authors explicitly note that an additional genetic or
  environmental factor may explain the holoprosencephaly, so phenotypes remain
  restricted to those established in the founding series while PMID:40243517
  supports genetic diagnosis and rehabilitation care. The overgrowth case
  report (PMID:42565347) has no retrievable abstract. Takenouchi-Kosaki
  syndrome, named in the founding abstract, is caused by CDC42 rather than
  CDC42BPB (curated under differential_diagnoses), and Okur-Chung
  neurodevelopmental syndrome (CSNK2A1) is a distinct disorder despite the
  shared author surname.
category: Mendelian
synonyms:
- CHOCNS
- CDC42BPB-related neurodevelopmental disorder
parents:
- neurodevelopmental disorder

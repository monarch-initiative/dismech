differential_diagnoses:
- name: Takenouchi-Kosaki syndrome
  disease_term:
    preferred_term: Takenouchi-Kosaki syndrome
    term:
      id: MONDO:0014757
      label: Takenouchi-Kosaki syndrome
  description: >-
    Autosomal dominant neurodevelopmental disorder caused by heterozygous
    variants in CDC42, the upstream Rho-family GTPase that activates MRCKbeta
    (CDC42BPB). Shares developmental delay, intellectual disability, and
    neurodevelopmental anomalies, but characteristically includes
    macrothrombocytopenia, lower-extremity lymphedema, camptodactyly, and T/B
    lymphocyte deficiency with recurrent bacterial and viral infections not
    typical of CDC42BPB-related disease.
  distinguishing_features:
  - Caused by heterozygous pathogenic variants in CDC42 rather than CDC42BPB
  - Macrothrombocytopenia, lower-extremity lymphedema, camptodactyly, and immunodeficiency with recurrent infections typical of Takenouchi-Kosaki syndrome
  evidence:
  - reference: PMID:32031333
    reference_title: De novo heterozygous missense and loss-of-function variants in CDC42BPB are associated with a neurodevelopmental phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      a downstream effector of CDC42, which has recently been associated with
      Takenouchi-Kosaki syndrome, an autosomal dominant neurodevelopmental
      disorder.
    explanation: >-
      Directly links CDC42BPB/MRCKbeta to its upstream activator CDC42 and
      identifies Takenouchi-Kosaki syndrome as the pathway-adjacent autosomal
      dominant neurodevelopmental differential.
  - reference: PMID:26708094
    reference_title: "Further evidence of a mutation in CDC42 as a cause of a recognizable syndromic form of thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cardinal features of this entity include macrothrombocytopenia,
      developmental delay, lymphedema in the lower extremities, camptodactyly,
      and distinctive facial features.
    explanation: >-
      Documents the cardinal hematologic, lymphatic, and digital features
      (macrothrombocytopenia, lower-extremity lymphedema, camptodactyly) that
      distinguish CDC42-related Takenouchi-Kosaki syndrome from CHOCNS.
  - reference: PMID:33405195
    reference_title: "Progressive decline of T and B cell numbers and function in a patient with CDC42 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 19-year-old female suffered from recurrent pneumonia, otitis media,
      and bacteremia, which resolved at 10 years of age, concordant with the
      initiation of amoxicillin prophylaxis.
    explanation: >-
      Documents recurrent bacterial respiratory and bloodstream infections from
      combined T- and B-cell decline in Takenouchi-Kosaki syndrome.

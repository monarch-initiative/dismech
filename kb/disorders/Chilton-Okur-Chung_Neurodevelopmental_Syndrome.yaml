      beta), a serine/threonine protein kinase, and a downstream effector of
      CDC42
    explanation: >-
      Background statement of the gene product's identity as a CDC42 effector
      kinase.
  - reference: PMID:24553779
    reference_title: "The actin-myosin regulatory MRCK kinases: regulation, biological functions and associations with human cancer."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In addition to ROCK and CRIK, the Myotonic dystrophy-related
      Cdc42-binding kinases (MRCK) α ... MRCKβ ... and MRCKγ ... contribute to
      MLC phosphorylation downstream of CDC42.
    explanation: >-
      Review stating that MRCKbeta phosphorylates the myosin II regulatory
      light chain downstream of CDC42, the normal function this node assumes
      is reduced.
  downstream:
  - target: Impaired Neuronal Dendrite Development
    hypothesis_groups:
    - mrckbeta_dendrite_development
    description: >-
      In cultured neurons, MRCKbeta phosphorylation of the myosin regulatory
      light chain drives the actin rearrangement needed for dendrite outgrowth
      and spine formation. Whether reduced MRCKbeta produces a dendritic defect
      in patients is not known.
    evidence:
    - reference: PMID:33933448
      reference_title: MRCKβ links Dasm1 to actin rearrangements to promote dendrite development.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Activated MRCKβ in turn phosphorylates a class 2 regulatory myosin
        light chain, which leads to enhanced actin rearrangement, causing the
        dendrite outgrowth and spine formation observed before.
      explanation: >-
        Shows MRCKbeta activity drives dendrite outgrowth through myosin light
        chain phosphorylation. It is a normal-function study, not a study of
        patient variants, hence indirect.
- name: Impaired Neuronal Dendrite Development
  description: >-
    A proposed cellular consequence of reduced MRCKbeta: defective
    actin-dependent dendrite outgrowth and spine formation in developing
    neurons. Supported only by normal-function studies of MRCKbeta; no patient
    neurons or CDC42BPB-variant neuronal models have been examined.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: dendrite morphogenesis
    modifier: DECREASED
    term:
      id: GO:0048813
      label: dendrite morphogenesis
  evidence:
  - reference: PMID:33933448
    reference_title: MRCKβ links Dasm1 to actin rearrangements to promote dendrite development.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      MRCKβ FL or MRCKβ 1 to 430, but not MRCKβ K105M, was able to rescue
      Dasm1 knockdown-induced decrease of total dendrite length (left panel)
      and dendritic branch numbers (right panel) in hippocampal neurons.
    explanation: >-
      Kinase-active MRCKbeta, but not the kinase-dead K105M mutant, restores
      dendrite length and branching in cultured hippocampal neurons, so
      dendrite growth depends on MRCKbeta kinase activity. Indirect for the
      disease because no patient variant was tested.
  downstream:
  - target: Abnormal Brain Development
    hypothesis_groups:
    - mrckbeta_dendrite_development
    description: >-
      Hypothesized. Defective dendrite development would contribute to
      disturbed brain development, but no study has examined neurons or brain
      tissue carrying a CDC42BPB variant.

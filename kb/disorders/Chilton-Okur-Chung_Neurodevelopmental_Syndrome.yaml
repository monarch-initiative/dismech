name: Chilton-Okur-Chung Neurodevelopmental Syndrome
creation_date: "2026-10-16T15:00:00Z"
description: >-
  Chilton-Okur-Chung neurodevelopmental syndrome is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous, usually de novo, variants
  in CDC42BPB, which encodes MRCKbeta, a serine/threonine kinase that acts
  downstream of the GTPase CDC42 and phosphorylates the myosin II regulatory
  light chain. Affected individuals have developmental delay or intellectual
  disability, autism, hypotonia, and structural brain anomalies including
  cerebellar vermis hypoplasia and agenesis or hypoplasia of the corpus
  callosum. Truncating variants are predicted to act through
  haploinsufficiency; the effect of the clustered missense variants is not
  established.
notes: >-
  No GeneReviews or StatPearls chapter covers this disorder (Bookshelf index
  snapshot 2026-09-10 plus a live PubMed title search, by name and synonyms).
  The largest cohort to date, Duz et al. 2026 (BMC Med Genomics,
  DOI:10.1186/s12920-026-02448-w, 37 individuals), is not cited: on
  2026-10-16 it had no PubMed record and no abstract or full text was
  retrievable. Its reported features beyond
  this entry's phenotypes (attention deficit hyperactivity disorder, seizures,
  macrocephaly, ventriculomegaly) are therefore not listed here. The cited
  founding series is abstract-only in the cache, so phenotype frequencies are
  also omitted. The discussion section of PMID:40243517 attributes early-onset
  epilepsy, spasticity, and polymicrogyria or schizencephaly to CDC42BPB on a
  single citation; the founding series does not report these, so they are not
  listed. The overgrowth case report (PMID:42565347) has no retrievable
  abstract either. Takenouchi-Kosaki syndrome, named in the founding abstract,
  is caused by CDC42, not CDC42BPB, and Okur-Chung neurodevelopmental syndrome
  (CSNK2A1) is a different disorder despite the shared name.
category: Mendelian
synonyms:
- CHOCNS
- CDC42BPB-related neurodevelopmental disorder
parents:
- neurodevelopmental disorder

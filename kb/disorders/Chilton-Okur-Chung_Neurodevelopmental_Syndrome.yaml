discussions:
- discussion_id: missense_variant_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#CDC42BPB Heterozygous Variant
  - pathophysiology#Reduced MRCKbeta Actomyosin Regulation
  prompt: >-
    Do the clustered CDC42BPB missense variants reduce MRCKbeta kinase
    activity, as the truncating variants are predicted to, or do they act
    through a different mechanism?
  rationale: >-
    Most reported variants are missense, and four of nine in the founding series
    fall in one 20-amino-acid segment between two coiled-coil regions, with two
    recurrent. That clustering is unusual for a simple haploinsufficiency
    disorder. The founding report leaves the missense mechanism open, and no
    functional study of patient variants has been published, so the
    loss-of-function chain in this entry is established only for truncating
    alleles.
  evidence:
  - reference: PMID:32031333
    reference_title: De novo heterozygous missense and loss-of-function variants in CDC42BPB are associated with a neurodevelopmental phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future studies will help to delineate the natural history and to
      elucidate the underlying biological mechanisms of the missense variants
      leading to the neurodevelopmental and behavioral phenotypes.
    explanation: The authors state the missense mechanism is unresolved.
- discussion_id: mouse_model_lacks_heterozygous_phenotype
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Abnormal Brain Development
  - pathophysiology#CDC42BPB Heterozygous Variant
  prompt: >-
    The only Cdc42bpb mouse model shows diaphragm and heart defects in
    homozygous null embryos, while heterozygotes, the genotype that matches the
    human disorder, show no morphological difference from wild type and were
    not assessed for brain or behaviour. Does a heterozygous Cdc42bpb mouse
    have any neurodevelopmental phenotype?
  rationale: >-
    The human disorder is caused by one altered allele, but the published mouse
    phenotypes are ventral diaphragmatic hernia and lethal ventricular septal
    defects in homozygous knockouts. Knock-in embryos carrying one or two copies
    of a patient missense variant had only minimal ventral diaphragm gaps. No
    brain imaging, neuronal morphology, or behavioural testing was reported for
    any genotype, so the model neither supports nor refutes the brain chain in
    this entry. The single human carrier studied in that work, a boy with an
    isolated dorsal diaphragmatic hernia, had normal neurodevelopment, so
    diaphragm and heart defects are not listed as phenotypes here.
  evidence:
  - reference: PMID:42873655
    reference_title: Modeling patient variants of Cnot1 and Cdc42bpb results in distinct forms of congenital diaphragmatic hernia in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous loss of Cdc42bpb leads to large ventral gaps in the diaphragm
      with high penetrance, minor changes in lung morphology, and lethal heart
      septation defects.
    explanation: The reported mouse defects are for homozygous loss.
  - reference: PMID:42873655
    reference_title: Modeling patient variants of Cnot1 and Cdc42bpb results in distinct forms of congenital diaphragmatic hernia in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we observed no morphology differences between wildtype and heterozygotes
      and thus focused our analysis on homozygote embryos.
    explanation: Heterozygous mice, matching the human genotype, were unremarkable morphologically.
  - reference: PMID:42873655
    reference_title: Modeling patient variants of Cnot1 and Cdc42bpb results in distinct forms of congenital diaphragmatic hernia in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Embryos with one (20–70 Knock-in Score) or two (70–100 Knock-in Score)
      copies of the patient variant presented with minimal ventral diaphragm
      gap distances
    explanation: A patient missense variant gives a milder diaphragm defect than the null allele.
  - reference: PMID:42873655
    reference_title: Modeling patient variants of Cnot1 and Cdc42bpb results in distinct forms of congenital diaphragmatic hernia in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient with the de novo CDC42BPB variant also showed normal
      neurodevelopmental outcome with a Vineland Adaptive Behavioral Scale
      score of 95
    explanation: The human carrier with diaphragmatic hernia did not have the neurodevelopmental syndrome.
  proposed_experiments:
  - experiment_id: exp_cdc42bpb_heterozygous_mouse_neurodevelopment
    name: Neurodevelopmental phenotyping of heterozygous Cdc42bpb mice
    description: >-
      Assess heterozygous Cdc42bpb null and patient-variant knock-in mice for
      cerebellar vermis and corpus callosum structure, cortical and
      hippocampal dendrite morphology, and behaviours relevant to autism and
      learning, against wild-type littermates.
    would_support:
    - pathophysiology#Impaired Neuronal Dendrite Development
    - pathophysiology#Abnormal Brain Development

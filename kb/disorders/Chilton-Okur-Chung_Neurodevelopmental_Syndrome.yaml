  evidence:
  - reference: PMID:33933448
    reference_title: MRCKβ links Dasm1 to actin rearrangements to promote dendrite development.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      MRCKβ FL or MRCKβ 1 to 430, but not MRCKβ K105M, was able to rescue
      Dasm1 knockdown-induced decrease of total dendrite length (left panel)
      and dendritic branch numbers (right panel) in hippocampal neurons.
    explanation: >-
      Kinase-active MRCKbeta, but not the kinase-dead K105M mutant, restores
      dendrite length and branching in cultured hippocampal neurons, so
      dendrite growth depends on MRCKbeta kinase activity. Indirect for the
      disease because no patient variant was tested.
  downstream:

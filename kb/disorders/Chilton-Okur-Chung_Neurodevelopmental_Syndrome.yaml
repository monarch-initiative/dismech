pathophysiology:
- name: CDC42BPB Heterozygous Variant
  description: >-
    A heterozygous germline CDC42BPB variant, usually arising de novo.
    Frameshift and nonsense variants are predicted to undergo nonsense-mediated
    decay and cause haploinsufficiency. Missense variants cluster in the kinase
    domain, the citron homology domain, and a 20-amino-acid segment between two
    coiled-coil regions; whether they reduce kinase function or act otherwise
    has not been tested.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CDC42BPB
    term:
      id: hgnc:1738
      label: CDC42BPB
  evidence:
  - reference: PMID:32031333
    reference_title: De novo heterozygous missense and loss-of-function variants in CDC42BPB are associated with a neurodevelopmental phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frameshift and nonsense variants in CDC42BPB are expected to be
      gene-disrupting and lead to haploinsufficiency via nonsense-mediated
      decay.
    explanation: >-
      States the predicted mechanism for the truncating variants. It is a
      prediction from variant class, not a measured transcript level.
  - reference: PMID:32031333
    reference_title: De novo heterozygous missense and loss-of-function variants in CDC42BPB are associated with a neurodevelopmental phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All missense variants are located in highly conserved and functionally
      important protein domains/regions: 3 are found in the protein kinase
      domain, 2 are in the citron homology domain, and 4 in a 20-amino acid
      sequence between 2 coiled-coil regions, 2 of which are recurrent.
    explanation: Describes the domain distribution of the missense variants.
  downstream:
  - target: Reduced MRCKbeta Actomyosin Regulation
    hypothesis_groups:
    - mrckbeta_dendrite_development
    description: >-
      Loss of one functional CDC42BPB allele is expected to reduce MRCKbeta
      kinase activity toward the myosin II regulatory light chain. This step is
      inferred from the variant class and the kinase's normal function; it has
      not been measured in patient cells.
    evidence:
    - reference: PMID:32031333
      reference_title: De novo heterozygous missense and loss-of-function variants in CDC42BPB are associated with a neurodevelopmental phenotype.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The frameshift and nonsense variants in CDC42BPB are expected to be
        gene-disrupting and lead to haploinsufficiency via nonsense-mediated
        decay.
      explanation: >-
        Predicts reduced CDC42BPB dosage for the truncating variants. That
        reduced dosage lowers MRCKbeta kinase activity is an inference from
        this prediction; it does not cover the missense variants.
  - target: Abnormal Brain Development
    description: >-
      CDC42BPB variants are associated with structural brain anomalies in the
      founding series. The intervening cellular steps are not established.
    evidence:
    - reference: PMID:32031333
      reference_title: De novo heterozygous missense and loss-of-function variants in CDC42BPB are associated with a neurodevelopmental phenotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        with neurodevelopmental disorders including developmental
        delay/intellectual disability, autism, hypotonia, and structural brain
        abnormalities including cerebellar vermis hypoplasia and
        agenesis/hypoplasia of the corpus callosum.
      explanation: >-
        Links heterozygous CDC42BPB variants to structural brain
        abnormalities in affected individuals.
- name: Reduced MRCKbeta Actomyosin Regulation
  description: >-
    MRCKbeta is a CDC42-activated AGC-family kinase that phosphorylates the
    myosin II regulatory light chain and so controls actomyosin contractility
    and actin rearrangement. Reduced MRCKbeta dosage is expected to weaken this
    regulation. The node describes the kinase's established normal function;
    its reduction in patients is inferred.

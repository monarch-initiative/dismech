name: Blepharophimosis-Intellectual Disability Syndrome, MKB Type
creation_date: '2026-07-30T00:00:00Z'
category: Mendelian
synonyms:
- Ohdo syndrome, Maat-Kievit-Brunner type
- Ohdo syndrome, X-linked
- X-linked Ohdo syndrome
- XLOS
- OHDOX
- Blepharophimosis-mental retardation syndrome, Maat-Kievit-Brunner type
- BMRS, MKB type
description: >-
  Blepharophimosis-intellectual disability syndrome, Maat-Kievit-Brunner (MKB) type, also called X-linked Ohdo
  syndrome (XLOS/OHDOX), is a MED12-related neurodevelopmental disorder characterized by intellectual and developmental
  disability, blepharophimosis, ptosis and facial coarsening with age. Most established familial cases involve
  hemizygous missense variants in males and unaffected carrier mothers, but affected heterozygous females have
  also been reported. Associated findings include severe language delay, hypotonia, hearing loss and variable
  dental, cardiac, palatal, skeletal and genitourinary anomalies. MED12 is a transcriptional regulator within
  Mediator. Experimental work on p.Arg1148His and p.Ser1165Pro demonstrates impaired REST-dependent gene repression
  and abnormal serum-responsive FOS/EGR1 expression in non-neuronal cell systems. The developmental steps connecting
  these defects to the clinical phenotype remain incompletely resolved. This MKB entity is distinct from KAT6B-related
  Say-Barber-Biesecker-Young-Simpson syndrome and FOXL2-related BPES.

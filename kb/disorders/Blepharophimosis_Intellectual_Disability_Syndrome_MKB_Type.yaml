genetic:
- name: MED12
  notes: >-
    MED12 at Xq13.1 encodes mediator complex subunit 12. The original three families carried p.Arg1148His,
    p.Ser1165Pro or de novo p.His1729Asn. Recurrent p.Arg296Gln shows substantial phenotypic variability, including
    two cousins and their affected maternal uncle in the 2021 report. A severe neonatal case carried de novo
    p.Arg1611Cys, classified as likely pathogenic in that report. GeneReviews additionally records p.Glu172Gln
    in an affected female and p.Gln2159Pro in three brothers with immune abnormalities. Variants and clinical
    labels overlap across the broader MED12 spectrum; a MED12 variant alone does not determine the MKB subtype.
  gene_term:
    preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  evidence:
  - reference: PMID:23395478
    reference_title: Mutations in MED12 cause X-linked Ohdo syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The occurrence of three different hemizygous missense mutations in three unrelated families affected
      by Ohdo syndrome MKB type shows that mutations in MED12 are the underlying cause of this X-linked form
      of Ohdo syndrome.
    explanation: >-
      Human genetic evidence establishes MED12 causality.
    quote_role: PRIMARY_RESULT

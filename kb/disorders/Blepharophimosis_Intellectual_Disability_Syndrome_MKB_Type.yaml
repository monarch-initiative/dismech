- name: Genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Provide variant-specific X-linked inheritance counseling, maternal and at-risk relative testing, and discussion
    of prenatal or preimplantation testing when a familial pathogenic variant is known. Explain variable severity
    and the possibility of clinical expression in females; a negative maternal blood test does not eliminate
    germline mosaicism.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If the mother of a proband is heterozygous for a pathogenic variant, the chance \nof transmitting it in each pregnancy is 50%."
    explanation: >
      The quantitative recurrence risk that genetic counseling for this X-linked
      disorder is built around.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301719

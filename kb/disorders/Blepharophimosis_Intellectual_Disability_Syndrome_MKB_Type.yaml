genetic:
- name: MED12
  notes: >
    Hemizygous missense variants in MED12 (mediator complex subunit 12, Xq13.1)
    cause the MKB/X-linked type. Reported variants include p.Arg1148His, p.Ser1165Pro,
    and the de novo p.His1729Asn. MED12 is also mutated in the allelic FG (Opitz-Kaveggia)
    and Lujan-Fryns syndromes and in non-syndromic X-linked intellectual disability.
  gene_term:
    preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  evidence:
  - reference: PMID:23395478
    reference_title: "Mutations in MED12 cause X-linked Ohdo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed exome sequencing in two families, each with two affected males with Ohdo syndrome MKB type."
    explanation: Identifies the causative MED12 missense variants segregating with disease via exome sequencing.
  - reference: CGGV:assertion_afba0573-9f47-4814-bf3a-ef41f5512dee-2025-10-15T100000.000Z
    reference_title: "ClinGen Gene-Disease Validity: MED12-related intellectual disability syndrome (Definitive, X-linked)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MED12 | HGNC:11957 | MED12-related intellectual disability syndrome | MONDO:0100000 | XL | Definitive"
    explanation: ClinGen classifies the MED12 gene-disease relationship as Definitive (X-linked).
diagnosis:
- name: Molecular genetic testing for a hemizygous MED12 pathogenic variant
  description: >
    Diagnosis is established in an affected male by identification of a hemizygous
    MED12 pathogenic variant on molecular genetic testing. Clinical suspicion is
    raised by the blepharophimosis-plus-intellectual-disability phenotype,
    particularly with an X-linked family history. In reported cases the variant was
    identified by exome sequencing after non-diagnostic conventional testing, with
    Sanger confirmation and family segregation analysis. There are no formal
    consensus clinical diagnostic criteria specific to the MKB type.
  evidence:
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of an MED12-related disorder is established in \na male by identification of a hemizygous MED12 pathogenic variant on molecular \ngenetic testing."
    explanation: States the molecular basis for establishing the diagnosis in an affected male.
  - reference: PMID:34573309
    reference_title: "MED12 Mutation in Two Families with X-Linked Ohdo Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on two first cousins with X-linked Ohdo syndrome with \na missense mutation in MED12 gene, identified through whole exome sequencing."
    explanation: Documents whole exome sequencing as the diagnostic route in confirmed X-linked Ohdo cases.
pathophysiology:
- name: MED12 Missense Variant Disrupting the CDK8 Kinase Module
  biological_scale: MOLECULAR
  description: >
    MED12 is a subunit of the CDK8 kinase module (MED12, MED13, Cyclin C, and CDK8),
    a dissociable regulatory module of the Mediator complex that modulates RNA
    polymerase II transcription. MED12 activates CDK8 kinase activity by wrapping
    around CDK8 via a conserved T-loop interaction. Disease-associated missense
    variants alter MED12 function within this module rather than abolishing the
    protein, consistent with the observation that only a small subset of MED12
    variants produces the distinct MED12-related syndromes.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of RNA polymerase II transcription
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: mediator complex
    term:
      id: GO:0016592
      label: mediator complex
  downstream:
  - target: Dysregulated Immediate Early Gene and REST-Dependent Neuronal Transcription
    description: >-
      Altered MED12 function within the CDK8 kinase module changes recruitment of
      the MED12-containing complex to target promoters, producing variant-specific
      dysregulation of immediate early gene and REST-dependent neuronal
      transcriptional programs.
    evidence:
    - reference: PMID:28369444
      reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "each MED12 mutations cause specific expression patterns of JUN, FOS and EGR1 immediate early genes (IEGs), reflected by the presence or absence of MED12 containing complex at their respective promoters."
      explanation: >
        Directly links MED12 variant status to altered complex occupancy at
        promoters and consequent transcriptional dysregulation.
  evidence:
  - reference: PMID:33925166
    reference_title: "MED12-Related (Neuro)Developmental Disorders: A Question of Causality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "kinase module consists of MED12, MED13, Cyclin C (CCNC), and cyclin-dependent kinase 8 (CDK8), and the paralogs MED12L, MED13L, and CDK19."
    explanation: Defines the CDK8 kinase module in which MED12 acts.
  - reference: PMID:23395478
    reference_title: "Mutations in MED12 cause X-linked Ohdo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings point to aberrant chromatin modification as being central to the pathogenesis of Ohdo syndrome."
    explanation: Points to aberrant transcriptional/chromatin regulation as the core mechanism.
- name: Dysregulated Immediate Early Gene and REST-Dependent Neuronal Transcription
  biological_scale: CELLULAR
  description: >
    MED12 disease variants alter recruitment of the MED12-containing complex to
    immediate early gene (JUN, FOS, EGR1) promoters, producing variant- and
    cell-type-specific changes in their expression. Downstream, late responsive
    genes are dysregulated, including the RE1-silencing transcription factor (REST/NRSF),
    a master repressor of neuron-specific genes, disrupting neural plasticity and
    neuronal gene programs. MED12 also regulates Wnt/β-catenin and Sonic hedgehog
    (via GLI3) developmental signaling.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Wnt signaling pathway
    term:
      id: GO:0016055
      label: Wnt signaling pathway
    modifier: ABNORMAL
  - preferred_term: Sonic hedgehog (smoothened) signaling
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: ABNORMAL
  downstream:
  - target: Intellectual disability
    description: >-
      Disrupted REST-dependent neuronal gene expression and impaired neural
      plasticity provide the mechanistic route from MED12 dysfunction to the
      intellectual disability that defines the syndrome.
    evidence:
    - reference: PMID:28369444
      reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "the expression of late responsive genes such as the matrix metalloproteinase-3 and the RE1 silencing transcription factor implicated respectively in neural plasticity and the specific expression of neuronal genes is disturbed"
      explanation: >
        Establishes the neuronal-plasticity and neuronal-gene-expression defect
        mechanistically linking MED12 dysfunction to the cognitive phenotype.
        PARTIAL because the causal step to human intellectual disability is
        inferred from cell-based work rather than demonstrated directly.
  evidence:
  - reference: PMID:28369444
    reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "each MED12 mutations cause specific expression patterns of JUN, FOS and EGR1 immediate early genes (IEGs), reflected by the presence or absence of MED12 containing complex at their respective promoters."
    explanation: Shows MED12 variants dysregulate immediate early gene expression.
  - reference: PMID:28369444
    reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the expression of late responsive genes such as the matrix metalloproteinase-3 and the RE1 silencing transcription factor implicated respectively in neural plasticity and the specific expression of neuronal genes is disturbed"
    explanation: Links MED12 dysfunction to disrupted REST-dependent neuronal gene programs.

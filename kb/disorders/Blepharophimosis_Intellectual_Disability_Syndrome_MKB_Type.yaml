differential_diagnoses:
- name: KAT6B-related Say-Barber-Biesecker-Young-Simpson syndrome
  description: >-
    An overlapping blepharophimosis-intellectual disability syndrome with a similar facial phenotype in young
    children.
  distinguishing_features:
  - Usually de novo dominant KAT6B-related disease, versus predominantly X-linked MED12-associated MKB disease.
  - MKB facial coarsening, triangular face and thick alae nasi become more apparent with age.
  evidence:
  - reference: url:https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Although Ohdo syndrome MKB type can be distinguished from Ohdo syndrome SBBYS type at older age through
      the triangular face and the increasingly bulbous nose with thick alae nasi, its facial phenotype can
      be very similar to that of Ohdo syndrome SBBYS type at a young age.
    explanation: >-
      Full text of PMID:23395478. The founding MKB paper directly compares the age-dependent overlap with SBBYS.
    quote_role: BACKGROUND
- name: Other MED12-related intellectual disability syndromes
  description: >-
    FG, Lujan and nonspecific MED12-related intellectual disability overlap genetically and clinically with
    MKB syndrome. A shared pathogenic variant can occur with different clinical labels.
  distinguishing_features:
  - Assess the whole phenotype rather than assigning subtype from the gene alone.
  - Corpus callosum and anal anomalies or marfanoid habitus may favor another MED12 phenotype but are not absolute exclusions.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1676/?report=reader
    reference_title: MED12-Related Disorders - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      two affected females and their unaffected mother were found to have the ... variant previously reported
      in males with XLOS
    explanation: >-
      The same MED12 allele can occur under different clinical diagnoses.
    quote_role: REVIEW_SYNTHESIS
discussions:
- evidence:
  - reference: url:https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      It is thus possible that the Ohdo syndrome mutations in MED12 impair recruitment of Mediator to RE1-bound
      REST, as was shown previously for the Opitz-Kaveggia and Lujan-Fryns muta- tions in MED12.
    explanation: >-
      Full text of PMID:23395478. The original paper explicitly presents impaired recruitment as a possibility.
  discussion_id: ohdox_rest_recruitment
  prompt: REST-target repression and the unmeasured recruitment step
  rationale: >-
    The original p.Arg1148His/p.Ser1165Pro HEK293 experiments establish deficient target-gene repression with
    retained Mediator incorporation and G9a binding. Impaired recruitment to RE1-bound REST is an explanatory
    hypothesis based on other MED12 alleles, not a direct result for these two variants. The intermediate steps
    from these non-neuronal transcriptional phenotypes to human neural development also require resolution.
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired REST-Dependent Repression of Neuronal Genes
- evidence:
  - reference: PMID:41023835
    reference_title: 'Functional characterization of the MED12 p.Arg1138Trp variant in females: implications for neural development and disease mechanism.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The two clones showed differential X-inactivation, expressing either WT MED12 transcript or the MED12
      c.3412 C > T; p. Arg1138Trp transcript (Fig. 1C, D).
    explanation: >-
      Defines the allelic-expression comparison rather than a genome-editing rescue.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41023835
    reference_title: 'Functional characterization of the MED12 p.Arg1138Trp variant in females: implications for neural development and disease mechanism.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Taken together, these findings confirm normal differentiation of MED12_WT and MED12_VUS iPSCs into NPCs.
    explanation: >-
      Morphological and marker differentiation is preserved despite the pathway-level differences.
    quote_role: PRIMARY_RESULT
  discussion_id: ohdox_neural_model_scope
  prompt: Human neural models from the broader MED12 spectrum
  rationale: >-
    A 2025 study compared two iPSC clones from a single female carrying p.Arg1138Trp, expressing different
    MED12 alleles through X-inactivation. Neural progenitors showed variant-associated transcriptomic and gene-set
    changes, while gross differentiation and MED12 protein abundance were preserved. This offers a useful neighboring
    model, but the donor had a broader MED12-related phenotype, the comparison was not a gene-corrected isogenic
    experiment, and it does not validate a universal MKB Wnt, Hedgehog or ribosome mechanism.
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#MED12 Variant-Dependent Transcriptional Dysfunction

name: Blepharophimosis-Intellectual Disability Syndrome, MKB Type
creation_date: '2026-07-30T00:00:00Z'
category: Mendelian
synonyms:
- Ohdo syndrome, Maat-Kievit-Brunner type
- Ohdo syndrome, X-linked
- X-linked Ohdo syndrome
- XLOS
- OHDOX
- Blepharophimosis-mental retardation syndrome, Maat-Kievit-Brunner type
- BMRS, MKB type
description: >
  Blepharophimosis-intellectual disability syndrome, Maat-Kievit-Brunner (MKB)
  type — also called X-linked Ohdo syndrome (XLOS/OHDOX) — is a rare X-linked
  recessive neurodevelopmental disorder caused by hemizygous missense variants in
  MED12 (Xq13.1). Ohdo syndrome is a clinically heterogeneous group of
  blepharophimosis-intellectual disability syndromes; the MKB type is the form
  distinguished by X-linked inheritance and progressive facial coarsening with
  age. Affected males have intellectual disability, blepharophimosis (horizontally
  small palpebral fissures) and ptosis, and additional features including hearing
  loss, dental anomalies, congenital heart defects, and genitourinary anomalies.
  MED12 encodes a subunit of the CDK8 kinase module of the Mediator complex, a
  transcriptional coactivator for RNA polymerase II; disease variants perturb
  MED12-dependent transcriptional programs (immediate early genes, REST-mediated
  neuronal gene silencing, and Wnt/β-catenin and Sonic hedgehog/GLI3 developmental
  signaling). It is allelic to the other MED12-related disorders (FG/Opitz-Kaveggia
  syndrome and Lujan-Fryns syndrome).

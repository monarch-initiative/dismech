inheritance:
- name: X-linked inheritance
  description: >-
    Classic pedigrees show X-linked recessive transmission with affected hemizygous males and usually unaffected
    carrier females. De novo variants occur, and heterozygous females with an XLOS phenotype have been described.
    A mother carrying the familial pathogenic variant has a 50% chance of transmitting it in each pregnancy;
    clinical expression in females is variable. Blood X-inactivation does not establish the pattern in brain
    tissue.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  evidence:
  - reference: PMID:34573309
    reference_title: MED12 Mutation in Two Families with X-Linked Ohdo Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Segregation analysis revealed a hemizygous variant in the affected boys and a carrier status in the unaffected
      mothers. Also, the mutation was confirmed in the maternal affected uncle.
    explanation: >-
      Documents segregation in one extended family with two affected cousins and their uncle.
    quote_role: PRIMARY_RESULT

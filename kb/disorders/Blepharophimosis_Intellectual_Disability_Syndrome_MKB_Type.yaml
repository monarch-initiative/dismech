- name: HEK293 MED12 knockdown and variant add-back
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Established HEK293 line with RNAi and transient MED12 expression
  publication: PMID:23395478
  description: >-
    MED12-depleted HEK293 cells receive siRNA-resistant wild-type, p.Arg1148His or p.Ser1165Pro MED12. Target-gene
    qPCR, protein expression and co-immunoprecipitation distinguish defective repression from loss of protein
    stability, Mediator incorporation or G9a binding.
  modeled_mechanisms:
  - target: Impaired REST-Dependent Repression of Neuronal Genes
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      MED12-depleted HEK293 cells receive siRNA-resistant wild-type, p.Arg1148His or p.Ser1165Pro MED12. Target-gene
      qPCR, protein expression and co-immunoprecipitation distinguish defective repression from loss of protein
      stability, Mediator incorporation or G9a binding.
    limitations: >-
      An engineered non-neuronal cell assay supports a specific biochemical defect. It does not demonstrate
      recruitment failure at REST sites, neuronal differentiation defects or the complete clinical phenotype.

- name: Impaired REST-Dependent Repression of Neuronal Genes
  description: >-
    In HEK293 cells depleted of endogenous MED12, wild-type MED12 suppresses derepression of CHRM4, SNAP25
    and SYN1, whereas p.Arg1148His and p.Ser1165Pro are impaired in this rescue. Comparable protein abundance,
    Mediator incorporation and G9a binding argue against simple protein instability or loss of the G9a interface.
    Impaired recruitment to RE1-bound REST was proposed by analogy with other MED12 alleles; it was not directly
    measured for these Ohdo variants in the original experiment.
  biological_scale: MOLECULAR
  evidence:
  - reference: url:https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      FLAG-tagged MED12 mutants p.Arg1148His and p.Ser1165Pro were unable to repress CHRM4, SNAP25, and SYN1
      expression.
    explanation: >-
      Full text of PMID:23395478. The HEK293 knockdown/add-back assay demonstrates defective repression by
      the two tested Ohdo variants.
    quote_role: PRIMARY_RESULT
  - reference: url:https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      FLAG- tagged MED12 mutants p.Arg1148His and p.Ser1165Pro were incorporated into Mediator comparably to
      WT MED12.
    explanation: >-
      Full text of PMID:23395478. Co-immunoprecipitation shows retained incorporation into Mediator.
    quote_role: PRIMARY_RESULT
  - reference: url:https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      FLAG-tagged MED12 mutants p.Arg1148His and p.Ser1165Pro bound to G9a comparably to WT MED12.
    explanation: >-
      Full text of PMID:23395478. Direct G9a binding is retained in the tested mutants.
    quote_role: PRIMARY_RESULT
  downstream: []
- name: Altered Serum-Responsive FOS and EGR1 Expression
  description: >-
    After serum stimulation, p.Arg1148His and p.Ser1165Pro patient lymphoblastoid cells show increased FOS
    and reduced EGR1 expression. The extensive JUN-promoter, MMP3 and REST2 analyses in the same paper mainly
    concern p.Arg1295His fibroblasts and cannot be assigned wholesale to MKB syndrome. These experiments support
    variant- and cell-context-dependent transcriptional responses, not a demonstrated neuronal developmental
    cascade.
  biological_scale: CELLULAR
  evidence:
  - reference: url:https://repository.ubn.ru.nl/bitstream/2066/174772/1/174772.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/2066/174772/1/174772.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The two mutations related to Ohdo syndrome (R1148H and S1165P) also lead to an up regu- lation of FOS
      and a down-regulation of EGR1 (Supplementary Material, Fig. S7), illustrating the regulatory role of
      MED12 in IEGs expression regulation.
    explanation: >-
      Full text of PMID:28369444. The Ohdo alleles increase FOS and decrease EGR1 after serum stimulation;
      this is variant-specific cell evidence.
    quote_role: PRIMARY_RESULT
  downstream: []
  notes: >-
    The 2025 correction DOI:10.1093/hmg/ddaf138 replaces the MED23 immunoprecipitation row in Figure 5A after
    an image-assembly error; the editors state that the conclusions are unchanged. The Ohdo FOS/EGR1 result
    is reported in Supplementary Figure S7.

        the two tested Ohdo variants.
      quote_role: PRIMARY_RESULT
  - target: Altered Serum-Responsive FOS and EGR1 Expression
    description: >-
      Patient-derived lymphoblastoid cells with the two tested Ohdo variants show an altered serum response.
    causal_link_type: DIRECT
    evidence:
    - reference: url:https://repository.ubn.ru.nl/bitstream/2066/174772/1/174772.pdf
      reference_title: https://repository.ubn.ru.nl/bitstream/2066/174772/1/174772.pdf
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        The two mutations related to Ohdo syndrome (R1148H and S1165P) also lead to an up regu- lation of FOS
        and a down-regulation of EGR1 (Supplementary Material, Fig. S7), illustrating the regulatory role of
        MED12 in IEGs expression regulation.
      explanation: >-
        Full text of PMID:28369444. The Ohdo alleles increase FOS and decrease EGR1 after serum stimulation;
        this is variant-specific cell evidence.
      quote_role: PRIMARY_RESULT
  - target: Intellectual disability
    description: >-
      MED12 variants cause the neurodevelopmental phenotype, although the intervening neural developmental
      mechanisms are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

    snippet: >-
      Identification of a heterozygous ... variant of uncertain significance does not establish or rule out
      a diagnosis of an ... -related disorder.
    explanation: >-
      In context, identification of a heterozygous MED12 variant of uncertain significance is insufficient
      for a diagnosis.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: MED12 Variant-Dependent Transcriptional Dysfunction
  description: >-
    Pathogenic MED12 variants alter transcriptional regulation by Mediator. MED12 is part of the MED12-MED13-cyclin
    C-CDK8 regulatory module, but membership in that module does not establish a uniform CDK8 catalytic defect
    in MKB syndrome. Experiments with p.Arg1148His and p.Ser1165Pro retain MED12 expression, Mediator incorporation
    and G9a binding while revealing selective transcriptional abnormalities.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:23395478
    reference_title: Mutations in MED12 cause X-linked Ohdo syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The occurrence of three different hemizygous missense mutations in three unrelated families affected
      by Ohdo syndrome MKB type shows that mutations in MED12 are the underlying cause of this X-linked form
      of Ohdo syndrome.
    explanation: >-
      Human genetic evidence establishes MED12 causality.
    quote_role: PRIMARY_RESULT
  - reference: url:https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      FLAG-tagged MED12 mutants p.Arg1148His and p.Ser1165Pro were unable to repress CHRM4, SNAP25, and SYN1
      expression.
    explanation: >-
      Full text of PMID:23395478. The HEK293 knockdown/add-back assay demonstrates defective repression by
      the two tested Ohdo variants.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Impaired REST-Dependent Repression of Neuronal Genes
    description: >-
      The tested Ohdo variants fail to restore normal REST-target repression in MED12-depleted HEK293 cells.
    causal_link_type: DIRECT
    evidence:
    - reference: url:https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
      reference_title: https://repository.ubn.ru.nl/bitstream/2066/116577/1/116577.pdf
      supports: SUPPORT

diagnosis:
- name: Phenotype assessment and MED12 molecular testing
  description: >-
    Recognize the blepharophimosis, developmental disability and facial phenotype, then identify a pathogenic
    or likely pathogenic MED12 variant with appropriate segregation analysis. Affected males are usually hemizygous;
    an affected female may be heterozygous. Exome sequencing, including rapid trio sequencing in a critically
    ill neonate, has established diagnoses. A variant of uncertain significance alone does not establish the
    diagnosis, and a pathogenic MED12 variant must be interpreted against the overlapping MED12 clinical spectrum.
    Formal XLOS clinical diagnostic criteria have not been established.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1676/?report=reader
    reference_title: MED12-Related Disorders - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Diagnostic criteria have not been established for XLOS.
    explanation: >-
      GeneReviews explicitly states the lack of formal clinical criteria.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://pure.plymouth.ac.uk/ws/portalfiles/portal/39259074/Ohdo%20syndrome%20Revision%20accepted.pdf
    reference_title: https://pure.plymouth.ac.uk/ws/portalfiles/portal/39259074/Ohdo%20syndrome%20Revision%20accepted.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In view of his dysmorphic features and cardiac abnormality, rapid trio exome sequencing was requested.
      This detected a novel de novo hemizygous MED12 missense variant NM_005120.2:c.4831C>T p.(Arg1611Cys),
      classified in line with American College of Medical Genetics and Association for Clinical Genomic Science
      2019 guidelines as likely pathogenic and absent from the population database, gnomAd.
    explanation: >-
      Full text of PMID:35102032. Rapid trio exome sequencing identified a likely pathogenic de novo variant
      in a severely affected neonate.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1676/?report=reader

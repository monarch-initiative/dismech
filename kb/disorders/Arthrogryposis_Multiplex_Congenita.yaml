notes: >-
  This umbrella entry intentionally omits prevalence and a single inheritance
  statement: published occurrence estimates vary with case definition and
  setting, and inheritance belongs to the identified underlying diagnosis.
  Amyoplasia and distal arthrogryposis are retained as illustrative
  clinical-pattern branches, not an exhaustive taxonomy. The fetal-akinesia
  pathway is explicitly bounded to etiologies for which reduced movement is
  supported.


  The nine gene-defined entities recorded as has_subtypes rows are those that
  carry arthrogryposis in their own MONDO concept name: the numbered AMC1 to AMC7
  series, MYBPC1-related non-lethal AMC, and lethal arthrogryposis with anterior
  horn cell disease. Eight of the nine are direct children of this entry's term;
  the ninth, AMC1 (MONDO:0060486), is filed under hypomyelination
  neuropathy-arthrogryposis syndrome (MONDO:0700428), itself a direct child of
  this term, so AMC1 is a grandchild whose own label nonetheless numbers it as
  AMC1. All nine are the nosologic subdivision of this exact concept rather than
  separate diseases that merely feature contractures, so they belong here. Each
  is wired to the etiologic-branch pathophysiology node its lesion acts in
  (skeletal muscle, peripheral nerve hypomyelination, anterior horn motor neuron
  loss, ERGIC1-associated, central nervous system) rather than listed flat,
  because the branch a gene acts in is what determines how it reaches the shared
  movement-dependent pathway. Recording them does not convert this entry into a
  single etiologic disease; it makes the umbrella's own subdivision explicit.


  Seven further concepts are deliberately NOT recorded as rows here, because each
  has a better home that this knowledge base already curates. Fetal akinesia
  deformation sequence 1, 2 and 3 are MUSK-, RAPSN- and DOK7-related; MONDO files
  them under fetal akinesia deformation sequence (MONDO:0008824), which is itself
  a direct child of this term, so they are grandchildren rather than rows here, and all three genes are already curated with bound MONDO subtype terms on
  Congenital_Myasthenic_Syndrome as CMS9, CMS10 and CMS11, of which the
  fetal-akinesia presentations are the severe prenatal end. Fetal akinesia
  deformation sequence 4 (NUP88) sits under that same MONDO parent and is not a
  neuromuscular-junction gene; it has no curated home here yet, and a row on
  this umbrella would not be one. Spinal muscular atrophy with congenital bone
  fractures 1 and 2 (TRIP4, ASCC1) sit under prenatal-onset spinal muscular
  atrophy with congenital bone fractures (MONDO:0000209) and belong to the spinal
  muscular atrophy space, where X-Linked_Infantile_Spinal_Muscular_Atrophy already
  carries SMABF2 as a differential diagnosis. Van den Ende-Gupta syndrome (SCARF2)
  is dual-parented in MONDO under multiple congenital anomalies/dysmorphic
  syndrome as well as under this term, is diagnosed on blepharophimosis and
  arachnodactyly rather than on contractures, and is already curated as a
  differential diagnosis of
  Congenital_Heart_Defects_and_Skeletal_Malformations_Syndrome.

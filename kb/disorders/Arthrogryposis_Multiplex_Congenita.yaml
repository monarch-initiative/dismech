name: Arthrogryposis Multiplex Congenita
creation_date: "2026-05-13T12:00:00Z"
category: Complex
description: >-
  Arthrogryposis multiplex congenita (AMC) is a descriptive congenital
  phenotype and clinical syndrome, not a single etiologic disease. It is
  defined by congenital contractures affecting at least two different body
  regions. The distribution, associated anomalies, functional consequences,
  underlying cause, and recurrence risk vary widely. Etiologies can involve
  the central or peripheral nervous system, neuromuscular junction, muscle,
  connective or skeletal tissue, or the intrauterine environment. Reduced
  fetal movement is a well-supported route to contracture formation in some
  etiologic branches, but it is not modeled here as a proven universal cause.
synonyms:
- AMC
- Arthrogryposis
- Multiple congenital contractures
disease_term:
  preferred_term: arthrogryposis multiplex congenita
  term:
    id: MONDO:0015168
    label: arthrogryposis multiplex congenita
parents:
- Congenital Disorder

definitions:
- name: Multi-region congenital contracture definition
  definition_type: OTHER
  description: >-
    AMC is identified clinically when congenital joint contractures involve
    two or more different body regions. This definition identifies a phenotype
    for etiologic investigation; it does not assign a gene, inheritance mode,
    or mechanism.
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthrogryposis is a clinical feature defined by congenital joint
      contractures in two or more different body areas
    explanation: >-
      The clinical genetics report states the phenotype-level inclusion
      definition without treating arthrogryposis as one molecular disorder.
- name: Etiologically heterogeneous clinical-syndrome definition
  definition_type: OTHER
  description: >-
    AMC is an etiologically heterogeneous clinical syndrome. A complete
    diagnosis therefore includes both recognition of the contracture phenotype
    and an attempt to determine the underlying disorder or exposure.
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Arthrogryposis multiplex congenita (AMC) is a clinical syndrome with complex etiology."
    explanation: >-
      The multidisciplinary consensus explicitly distinguishes the clinical
      syndrome from its many possible etiologies.
  - reference: PMID:40195522
    reference_title: "Perinatal genetic diagnostic yield in a population of fetuses with the phenotype arthrogryposis multiplex congenita: a cohort study 2007-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthrogryposis multiplex congenita (AMC) presents challenges for prenatal
      detection due to its heterogeneous etiology, onset, and phenotypical
      manifestations.
    explanation: >-
      The consecutive fetal cohort independently supports heterogeneity of
      cause, onset, and presentation.

has_subtypes:
- name: Amyoplasia pattern
  display_name: Amyoplasia
  description: >-
    Amyoplasia is a recognized clinical pattern within AMC, with characteristic
    limb positions and fatty-fibrous replacement of affected muscle. Its
    sporadic occurrence is a property of Amyoplasia, not an inheritance rule
    for the AMC umbrella.
  subtype_term:
    preferred_term: congenital amyoplasia
    term:
      id: MONDO:0044629
      label: congenital amyoplasia
  evidence:
  - reference: PMID:24459070
    reference_title: Amyoplasia revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected limbs had characteristic positions with fatty-fibrous replacement of muscle."
    explanation: >-
      The 560-person Amyoplasia series supports this pattern-specific tissue
      and limb-position phenotype.
- name: Distal arthrogryposis pattern
  display_name: Distal arthrogryposis
  description: >-
    Distal arthrogryposis is a group of etiologic diagnoses in which distal
    joints are emphasized and proximal involvement is generally less extensive.
    Molecular and inheritance findings for individual distal arthrogryposis
    disorders must not be generalized to all AMC.
  subtype_term:
    preferred_term: distal arthrogryposis
    term:
      id: MONDO:0019942
      label: distal arthrogryposis
  evidence:
  - reference: PMID:33104047
    reference_title: A review of the orthopedic interventions and functional outcomes among a cohort of 114 children with arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with DA had less involvement of the proximal joints than those in the two other groups."
    explanation: >-
      The pediatric cohort supports distal arthrogryposis as a clinically
      distinguishable distribution pattern.
- name: Central nervous system, neuromuscular, and syndromic patterns
  description: >-
    AMC may accompany central nervous system, peripheral neuromuscular, or
    multisystem disorders. This is an etiologic-work-up grouping rather than a
    single formal subtype, and associated prognosis is determined by the
    underlying diagnosis.
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AMC may be divided into amyoplasia, distal arthrogryposis, central nervous
      system and neuromuscular diseases
    explanation: >-
      The consensus uses these groups to organize diagnostic evaluation while
      retaining AMC as a complex clinical syndrome.

clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Functional burden ranges from independent ambulation and self-care to major
    mobility limitation and repeated orthopedic care. Contracture count,
    distribution, knee involvement, central nervous system or syndromic
    involvement, and the underlying etiology materially change outcome, so no
    single low, moderate, or high burden level represents the umbrella.
  evidence:
  - reference: PMID:41475428
    reference_title: "Factors Associated With Functional Mobility in 256 Children With Arthrogryposis Multiplex Congenita: A Multicentric Cross-Sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Greater joint involvement, particularly at the knees, was a strong negative factor."
    explanation: >-
      The multicenter cohort links distribution and number of contractures with
      mobility, supporting substantial within-syndrome variability.
  - reference: PMID:33104047
    reference_title: A review of the orthopedic interventions and functional outcomes among a cohort of 114 children with arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contractures can lead to decreased range of motion and strength, and
      affect ambulation and autonomy.
    explanation: >-
      The pediatric cohort directly documents the functional domains affected
      by AMC contractures.
progression:
- phase: Prenatal emergence and detection
  age_range: Fetal period
  notes: >-
    Contractures and reduced movement may become apparent at different
    gestational stages. A normal earlier scan does not exclude later recognition,
    and serial assessment may be appropriate when findings evolve.
  evidence:
  - reference: PMID:41936055
    reference_title: "Prenatal Diagnosis of Arthrogryposis Multiplex Congenita (AMC): Ultrasound and Genetic Findings in 69 Fetuses From 67 Unrelated Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMC can occur at any stage of pregnancy and exhibits phenotypic heterogeneity. Regular follow-up ultrasounds are essential."
    explanation: >-
      The retrospective fetal cohort supports variable prenatal timing and
      serial ultrasound follow-up.
- phase: Congenital contracture state with variable later function
  age_range: Birth onward
  notes: >-
    The defining contractures are congenital and described as non-progressive.
    This does not mean that range of motion, secondary deformity, mobility, or
    care needs remain static; those outcomes vary with growth, distribution,
    treatment, and the underlying diagnosis.
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is a non-progressive syndrome characterized by joint deformity and
      stiffness, muscle atrophy, reduction of skin folds and subcutaneous
      tissue, and contracture of periarticular tissue
    explanation: >-
      The consensus supports congenital non-progression of the defining
      syndrome while the entry separately preserves variable functional course.

pathophysiology:
- name: Etiology-specific fetal hypomobility or akinesia
  description: >-
    Reduced or absent fetal movement is a mechanistically supported route to
    contractures when an upstream neurologic, neuromuscular, muscular, mechanical,
    or environmental process restricts movement. Evidence for sufficiency comes
    mainly from experimental immobilization. This node represents a bounded
    causal branch and is not asserted for every person meeting the AMC definition.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:6685864
    reference_title: "Fetal akinesia deformation sequence: an animal model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      It is suggested that this phenotype is not specific but, rather,
      represents a deformation sequence which results from fetal immobilization
      or akinesia.
    explanation: >-
      Pharmacologic fetal paralysis in rats supports immobilization as a
      sufficient route to a contracture-containing deformation sequence.
  - reference: PMID:33771841
    reference_title: Joint development recovery on resumption of embryonic movement following paralysis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      reduced or absent movement can lead to long-term skeletal defects, such as
      Fetal Akinesia Deformation Sequence, joint dysplasia and arthrogryposis.
    explanation: >-
      The chick immobilization study supports a movement-dependent developmental
      route while remaining model-organism evidence.
  downstream:
  - target: Decreased fetal movement
    causal_link_type: DIRECT
    description: >-
      In this etiologic branch, the upstream process manifests as reduced or
      absent fetal movement; this phenotype is not required in all AMC cases.
    evidence:
    - reference: PMID:6685864
      reference_title: "Fetal akinesia deformation sequence: an animal model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Rat fetuses were paralyzed by daily transuterine injections of curare
        from day 18 of gestation until term (day 21).
      explanation: >-
        The experimental perturbation directly produced fetal immobilization in
        the model.
  - target: Movement-dependent joint development disruption
    causal_link_type: DIRECT
    description: >-
      Experimental loss of embryonic movement perturbs separation and
      organization of developing joints.
    evidence:
    - reference: PMID:33771841
      reference_title: Joint development recovery on resumption of embryonic movement following paralysis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At developing joints, defects include reduced joint interzones with
        frequent fusion of cartilaginous skeletal rudiments across the joint.
      explanation: >-
        The chick model directly links immobilization with impaired joint
        interzone development and rudiment separation.
- name: Movement-dependent joint development disruption
  description: >-
    In immobilized chick embryos, developing joints show reduced interzones,
    fusion across cartilaginous rudiments, and impaired cavitation. Partial
    recovery after movement resumes indicates that timing and joint site matter.
    Translation of these experimental findings to individual human AMC etiologies
    remains incomplete.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33771841
    reference_title: Joint development recovery on resumption of embryonic movement following paralysis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate partial recovery of movement and partial recovery of joint
      development under both recovery conditions, but no improvement in spine
      defects.
    explanation: >-
      The controlled recovery experiment supports movement-sensitive joint
      development and anatomical variation in reversibility.
  downstream:
  - target: Congenital multi-region contracture state
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced joint interzone separation and cavitation
    description: >-
      Sustained immobility can culminate in congenital contractures through
      abnormal joint formation and periarticular adaptation.
    evidence:
    - reference: PMID:6685864
      reference_title: "Fetal akinesia deformation sequence: an animal model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The following anomalies were noted at the time of delivery: multiple
        joint contractures, pulmonary hypoplasia, micrognathia, fetal growth
        retardation, short umbilical cords, and polyhydramnios.
      explanation: >-
        The rat experiment demonstrates multiple congenital contractures after
        sustained fetal paralysis.
- name: Amyoplasia-pattern fatty-fibrous muscle replacement
  description: >-
    In the Amyoplasia pattern, affected limb muscles may be replaced by
    fatty-fibrous tissue and occur with characteristic limb positions. This
    human tissue observation applies to Amyoplasia and must not be generalized
    to every etiologic form of AMC; the causal ordering remains incompletely
    resolved.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:24459070
    reference_title: Amyoplasia revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected limbs had characteristic positions with fatty-fibrous replacement of muscle."
    explanation: >-
      The large clinical series documents this Amyoplasia-specific tissue
      finding and limb pattern.
  downstream:
  - target: Congenital multi-region contracture state
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Amyoplasia-associated muscle replacement and the contracture pattern
      co-occur, but the cited clinical series does not establish a complete
      molecular causal chain.
    evidence:
    - reference: PMID:24459070
      reference_title: Amyoplasia revisited.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Affected limbs had characteristic positions with fatty-fibrous replacement of muscle."
      explanation: >-
        The association is directly observed, while the intermediate causal
        steps are not resolved by this clinical series.
- name: Congenital multi-region contracture state
  description: >-
    Fixed congenital contractures in at least two different body regions are
    the shared clinical endpoint of heterogeneous upstream pathways. This node
    is the phenotype-level convergence point, not evidence for one shared gene,
    inheritance mode, or universal molecular mechanism.
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthrogryposis is a clinical feature defined by congenital joint
      contractures in two or more different body areas
    explanation: >-
      The source supports the multi-region contracture endpoint used to define
      the umbrella.
  downstream:
  - target: Arthrogryposis multiplex congenita phenotype
    causal_link_type: DIRECT
    description: >-
      Multi-region congenital contractures satisfy the phenotype definition of
      AMC.
    evidence:
    - reference: PMID:38856159
      reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Arthrogryposis is a clinical feature defined by congenital joint
        contractures in two or more different body areas
      explanation: >-
        The defining phenotype directly connects the convergence node to the
        HPO AMC phenotype.
  - target: Limb joint contracture
    causal_link_type: DIRECT
    description: >-
      Limb joints are commonly among the affected body regions, although the
      joints and positions vary by etiologic pattern.
    evidence:
    - reference: PMID:33104047
      reference_title: A review of the orthopedic interventions and functional outcomes among a cohort of 114 children with arthrogryposis multiplex congenita.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Contractures and deformities of the foot and ankle were the most
        prevalent
      explanation: >-
        The pediatric cohort supports limb-joint involvement across major AMC
        clinical groups.
  - target: Talipes equinovarus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Clubfoot is a frequent but non-obligate limb-position phenotype whose
      occurrence and treatment response vary across AMC patterns.
    evidence:
    - reference: PMID:41936055
      reference_title: "Prenatal Diagnosis of Arthrogryposis Multiplex Congenita (AMC): Ultrasound and Genetic Findings in 69 Fetuses From 67 Unrelated Families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common prenatal ultrasound finding was clubfoot, observed in 50.7% (35/69) of fetuses."
      explanation: >-
        The fetal cohort establishes clubfoot as a common, not universal,
        manifestation in that ascertainment setting.
  - target: Limitation of joint mobility
    causal_link_type: DIRECT
    description: >-
      Fixed contractures reduce available range of motion, with functional
      impact determined by distribution and severity.
    evidence:
    - reference: PMID:33104047
      reference_title: A review of the orthopedic interventions and functional outcomes among a cohort of 114 children with arthrogryposis multiplex congenita.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Contractures can lead to decreased range of motion and strength, and affect ambulation and autonomy."
      explanation: >-
        The cohort directly links contractures with reduced range of motion and
        functional consequences.

phenotypes:
- name: Arthrogryposis multiplex congenita phenotype
  category: Musculoskeletal
  description: >-
    Congenital contractures affecting at least two different body regions are
    the defining phenotype. This phenotype alone does not determine etiology or
    recurrence risk.
  phenotype_term:
    preferred_term: Arthrogryposis multiplex congenita
    term:
      id: HP:0002804
      label: Arthrogryposis multiplex congenita
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthrogryposis is a clinical feature defined by congenital joint
      contractures in two or more different body areas
    explanation: >-
      The source states the defining multi-region congenital contracture
      phenotype.
- name: Limb joint contracture
  category: Musculoskeletal
  description: >-
    Limb joints are commonly involved, but proximal-versus-distal distribution,
    symmetry, position, and severity differ among Amyoplasia, distal
    arthrogryposis, and syndromic or neuromuscular patterns.
  phenotype_term:
    preferred_term: Limb joint contracture
    term:
      id: HP:0003121
      label: Limb joint contracture
  evidence:
  - reference: PMID:24459070
    reference_title: Amyoplasia revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upper limb involvement was usually characterized by extended elbows.
      Lower limbs were held in various positions at birth
    explanation: >-
      The Amyoplasia series demonstrates pattern-specific upper- and lower-limb
      contracture positioning.
- name: Talipes equinovarus

- name: Peripheral nerve hypomyelination
  description: >-
    The motor command fails to reach fetal muscle because the peripheral nerve is
    not myelinated, while the muscle itself is not the primary lesion. LGI4 is
    secreted by Schwann cells and regulates peripheral nerve myelination through
    its receptor ADAM22, and electron microscopy of an affected individual's
    sciatic nerve showed a lack of myelin. The reporting authors place this
    finding in an axoglial branch of AMC causation.

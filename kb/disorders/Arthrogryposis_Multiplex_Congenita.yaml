animal_models:
- species: Rat (Rattus norvegicus)
  genotype: Pharmacologic fetal paralysis by transuterine curare exposure
  description: >-
    Daily fetal curare exposure from gestational day 18 to term produced
    multiple joint contractures and a broader deformation sequence not seen in
    sham-operated or untouched littermates. This demonstrates sufficiency of
    late-gestation immobilization in a rat model, not universality in human AMC.
  evidence:
  - reference: PMID:6685864
    reference_title: "Fetal akinesia deformation sequence: an animal model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Neither sham-operated nor untouched littermate control fetuses had any of these anomalies."
    explanation: >-
      The controlled comparison supports a causal effect of experimental fetal
      paralysis on the deformation sequence.
- species: Chicken (Gallus gallus)
  genotype: Experimental embryonic immobilization followed by natural or stimulated movement recovery
  description: >-
    Embryos immobilized during joint development showed interzone and
    skeletal-rudiment defects. Resumption of movement partially restored development in
    some joints, with site-specific differences. The model informs timing and
    reversibility but does not directly test heterogeneous human AMC etiologies.
  evidence:
  - reference: PMID:33771841
    reference_title: Joint development recovery on resumption of embryonic movement following paralysis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The hip joint showed the best recovery with improved rudiment separation,
      tissue organisation and commencement of cavitation.
    explanation: >-
      The recovery experiment directly demonstrates movement-sensitive joint
      development in the chick model.

diagnosis:
- name: Clinical recognition and distribution mapping
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Confirm congenital contractures in at least two body regions, document every
    involved joint and position, and assess craniofacial, neurologic,
    neuromuscular, skeletal, and other systemic findings. The clinical AMC label
    should be followed by etiologic classification when possible.
  results: >-
    Multi-region congenital contractures establish the AMC phenotype; associated
    findings guide the underlying-diagnosis work-up.
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthrogryposis is a clinical feature defined by congenital joint
      contractures in two or more different body areas
    explanation: >-
      The source supports the clinical threshold used to recognize the
      phenotype.
- name: Prenatal joint, movement, and multisystem ultrasonography
  diagnosis_term:
    preferred_term: fetal ultrasonography
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  description: >-
    Prenatal ultrasound evaluates joint posture, limb movement, clubfoot, and
    associated craniofacial or multisystem anomalies. Serial scans may be needed
    because recognition can occur at different gestational stages.
  results: >-
    Multiple contractures or abnormal posture with reduced movement and
    associated anomalies supports prenatal AMC and guides testing and counseling.
  evidence:
  - reference: PMID:41936055
    reference_title: "Prenatal Diagnosis of Arthrogryposis Multiplex Congenita (AMC): Ultrasound and Genetic Findings in 69 Fetuses From 67 Unrelated Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A comprehensive joint and movement assessment is essential when clubfoot is detected."
    explanation: >-
      The 69-fetus cohort supports systematic prenatal joint and movement
      assessment.
- name: Etiology-directed cytogenomic and sequencing tests
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Select testing from karyotype, chromosomal microarray or other copy-number
    analysis, multigene sequencing, exome sequencing, or genome sequencing based
    on prenatal and postnatal findings. A negative result does not negate the
    clinical AMC phenotype, and cohort-specific yields must not be treated as a
    universal diagnostic rate.
  results: >-
    A pathogenic chromosomal or sequence finding can identify the underlying
    diagnosis and its inheritance; unresolved testing leaves AMC as a descriptive
    phenotype.
  evidence:
  - reference: PMID:41936055
    reference_title: "Prenatal Diagnosis of Arthrogryposis Multiplex Congenita (AMC): Ultrasound and Genetic Findings in 69 Fetuses From 67 Unrelated Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aneuploidy and pathogenic copy number variations (CNV) were identified in
      10.45% (7/67) of the unrelated families.
    explanation: >-
      The fetal cohort demonstrates that chromosomal and copy-number testing can
      resolve a subset of cases.
  - reference: PMID:40195522
    reference_title: "Perinatal genetic diagnostic yield in a population of fetuses with the phenotype arthrogryposis multiplex congenita: a cohort study 2007-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing had the highest yield (41.7%)."
    explanation: >-
      The consecutive fetal cohort supports exome sequencing as a high-yield
      component in that referral setting while not establishing a universal rate.
- name: Postnatal etiologic neurologic and systemic evaluation
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    History, pedigree, detailed physical and neurologic examination, imaging,
    neuromuscular electrophysiology, and targeted laboratory tests are selected
    according to the phenotype. The purpose is to locate the upstream disorder,
    not merely to reconfirm contractures.
  results: >-
    Central, peripheral nerve, neuromuscular-junction, muscle, connective-tissue,
    skeletal, multisystem, or environmental findings narrow the etiologic class.
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      clinical evaluation, genetic examination, neuromuscular electrophysiological
      examination, imaging examination and special laboratory examination after
      birth
    explanation: >-
      The multidisciplinary consensus supports a phenotype-directed postnatal
      etiologic work-up across modalities.

differential_diagnoses:
- name: Amyoplasia
  description: >-
    Amyoplasia is a specific clinical pattern within the AMC umbrella rather
    than a synonym for every AMC presentation. Characteristic limb positions,
    fatty-fibrous muscle replacement, and apparently sporadic occurrence favor
    this classification.
  distinguishing_features:
  - Characteristic limb-position pattern with fatty-fibrous replacement of affected muscle.
  - The large clinical series describes Amyoplasia itself as sporadic.
  evidence:
  - reference: PMID:24459070
    reference_title: Amyoplasia revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amyoplasia appears to be completely sporadic."
    explanation: >-
      This pattern-specific observation helps separate Amyoplasia from familial
      Mendelian causes without assigning sporadic inheritance to AMC as a whole.
- name: Distal arthrogryposis group
  description: >-
    Distal arthrogryposis diagnoses emphasize hand and foot contractures with
    comparatively less proximal involvement. Individual disorders in this group
    can have defined genes and inheritance modes, which should be recorded only
    after the specific diagnosis is established.
  distinguishing_features:
  - Distal joints predominate and proximal joint involvement is less extensive than in Amyoplasia in a pediatric cohort.
  - A compatible family history or molecular result supports a specific distal arthrogryposis diagnosis, not generic AMC.
  evidence:
  - reference: PMID:33104047
    reference_title: A review of the orthopedic interventions and functional outcomes among a cohort of 114 children with arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with DA had less involvement of the proximal joints than those in the two other groups."
    explanation: >-
      The cohort provides a clinically useful distribution boundary for this
      etiologic group.
- name: Fetal akinesia deformation sequence
  description: >-
    Fetal akinesia deformation sequence is a severe overlapping deformation
    pattern caused by marked prenatal immobilization. Multiple contractures may
    coexist with pulmonary hypoplasia, micrognathia, growth restriction, short
    umbilical cord, and polyhydramnios. It is not synonymous with all AMC, and
    the cause of the akinesia still requires investigation.
  distinguishing_features:
  - Pulmonary hypoplasia and craniofacial or broader deformation findings suggest a severe fetal-akinesia sequence.
  - Identifying the neurologic, neuromuscular, environmental, or mechanical cause of akinesia is necessary for classification and counseling.
  evidence:
  - reference: PMID:6685864
    reference_title: "Fetal akinesia deformation sequence: an animal model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Diagnostic evaluation of patients with this group of anomalies should
      include the identification of the underlying pathologic process (etiology
      of the akinesia)
    explanation: >-
      The experimental paper explicitly frames the sequence as nonspecific and
      calls for identification of its upstream cause.

treatments:
- name: Individualized rehabilitation and physical therapy
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Goal-directed rehabilitation is tailored to involved joints, muscle strength,
    mobility, transfers, self-care, communication, and the underlying diagnosis.
    The evidence supports rehabilitation as a management domain, not one
    universally effective intensity or protocol.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Limb joint contracture
    term:
      id: HP:0003121
      label: Limb joint contracture
  - preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The goal of treatment is to improve the self-care ability of children,
      and the methods mainly include rehabilitation therapy
    explanation: >-
      The consensus supports rehabilitation with a functional, self-care goal.
- name: Splinting and orthotic support
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  description: >-
    Splints and orthoses can support positioning and function as part of an
    individualized plan. Device choice, duration, and goals depend on the joint,
    growth, skin tolerance, and etiologic pattern.
  treatment_term:
    preferred_term: orthotic device usage
  target_phenotypes:
  - preferred_term: Limb joint contracture
    term:
      id: HP:0003121
      label: Limb joint contracture
  - preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "splint support and orthotic fixation"
    explanation: >-
      The expert consensus explicitly includes splint and orthotic management.
- name: Ponseti-style manipulation and serial casting for arthrogrypotic clubfoot
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Ponseti-style manipulation and serial casting can be used as an initial
    clubfoot strategy. Small AMC cohorts show frequent initial correction but
    substantial relapse and later surgery, with poorer results in Amyoplasia
    than distal arthrogryposis. These data do not support a uniform outcome
    claim across all AMC.
  target_phenotypes:
  - preferred_term: Talipes equinovarus
    term:
      id: HP:0001762
      label: Talipes equinovarus
  evidence:
  - reference: PMID:37215511
    reference_title: Effectiveness of Ponseti technique in management of arthrogrypotic clubfeet - a prospective study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an initial correction was achieved in 13 out of 19 arthrogrypotic clubfeet (68.4%)."
    explanation: >-
      The small prospective cohort supports initial correction in a subset and
      provides a denominator that prevents overgeneralization.
  - reference: PMID:39342344
    reference_title: "Midterm clinical and radiological outcomes of arthrogryposis-associated clubfoot treated with the Ponseti method: a retrospective observational study and comprehensive literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the studies reviewed (11 case series, 144 patients) reported high
      initial clinical correction rates, followed by high recurrence rates and
      the need for further surgeries.
    explanation: >-
      Midterm cohort data and the accompanying literature review support both
      initial benefit and the important relapse/surgery boundary.
- name: Selected orthopedic surgery
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Joint- and pattern-specific orthopedic surgery may be considered when
    contractures or deformities substantially limit function and conservative
    measures are insufficient. Procedure choice and timing cannot be generalized
    across the AMC umbrella.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Limb joint contracture
    term:
      id: HP:0003121
      label: Limb joint contracture
  - preferred_term: Talipes equinovarus
    term:
      id: HP:0001762
      label: Talipes equinovarus
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "as well as orthopedic surgery."
    explanation: >-
      The consensus includes orthopedic surgery among management options without
      specifying one universal procedure.
- name: Etiology-specific genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counseling should explain that AMC is a phenotype, review the identified or
    suspected underlying cause, and derive recurrence risk and reproductive
    options from that diagnosis. No single recurrence risk applies to AMC.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:6685864
    reference_title: "Fetal akinesia deformation sequence: an animal model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      identification of the underlying pathologic process (etiology of the
      akinesia) to allow for proper classification and genetic counseling
    explanation: >-
      The source directly links etiologic classification, rather than the
      umbrella phenotype alone, to appropriate counseling.
  - reference: PMID:41936055
    reference_title: "Prenatal Diagnosis of Arthrogryposis Multiplex Congenita (AMC): Ultrasound and Genetic Findings in 69 Fetuses From 67 Unrelated Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ES significantly improves the diagnostic yield by providing key information for genetic counseling."
    explanation: >-
      The fetal cohort supports molecular etiologic information as an input to
      counseling.

discussions:
- discussion_id: interpretation_amc_is_a_descriptive_umbrella
  prompt: >-
    Should AMC be modeled as one genetic disease with a shared inheritance and
    gene list, or as a descriptive phenotype that triggers etiologic work-up?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - definitions#Multi-region congenital contracture definition
  - definitions#Etiologically heterogeneous clinical-syndrome definition
  - diagnosis#Etiology-directed cytogenomic and sequencing tests
  rationale: >-
    The defining criterion is phenotypic, authoritative consensus describes a
    clinical syndrome with complex etiology, and fetal cohorts resolve different
    chromosomal and sequence diagnoses in only subsets. This entry therefore
    intentionally omits umbrella-level inheritance and gene assertions.
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Arthrogryposis multiplex congenita (AMC) is a clinical syndrome with complex etiology."
    explanation: >-
      The consensus directly supports phenotype-first, etiology-second modeling.
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, akin to CPSFS, both dominant and recessively inherited distal
      arthrogryposis can be caused by variants in MYH3.
    explanation: >-
      Even within one gene-associated distal group, different inheritance modes
      occur, illustrating why inheritance cannot be assigned to AMC generally.
- discussion_id: interpretation_fetal_akinesia_is_a_bounded_route
  prompt: >-
    Does fetal akinesia constitute a universal mechanism for every AMC case?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - pathophysiology#Etiology-specific fetal hypomobility or akinesia
  - pathophysiology#Movement-dependent joint development disruption
  rationale: >-
    Rat and chick immobilization experiments demonstrate that reduced movement
    can be sufficient to disrupt joint development and produce contractures.
    They do not establish that every clinically defined AMC case traverses this
    route, and clinical sources emphasize etiologic heterogeneity. The graph
    therefore marks this branch provisional and explicitly scoped.
  evidence:
  - reference: PMID:33771841
    reference_title: Joint development recovery on resumption of embryonic movement following paralysis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate partial recovery of movement and partial recovery of joint
      development under both recovery conditions
    explanation: >-
      Controlled restoration of movement supports causality within the
      experimental model.
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Arthrogryposis multiplex congenita (AMC) is a clinical syndrome with complex etiology."
    explanation: >-
      Clinical heterogeneity prevents extrapolation of one model pathway to all
      AMC etiologies.
- discussion_id: gap_unsolved_etiology_after_current_testing
  prompt: >-
    Which causes account for AMC cases that remain unresolved after current
    cytogenomic and sequencing evaluation, and how should testing be prioritized
    across prenatal phenotype groups?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Etiology-directed cytogenomic and sequencing tests
  rationale: >-
    Recent fetal cohorts report improved but incomplete and setting-specific
    diagnostic yields. Their ascertainment, phenotype mix, and testing sequence
    differ, so the percentages should not be converted into a universal expected
    yield or a fixed algorithm.
  evidence:
  - reference: PMID:40195522
    reference_title: "Perinatal genetic diagnostic yield in a population of fetuses with the phenotype arthrogryposis multiplex congenita: a cohort study 2007-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall genetic diagnostic yield was 28% (18/64)"
    explanation: >-
      Most cases in this consecutive fetal cohort remained without a genetic
      diagnosis despite perinatal testing.
  - reference: PMID:41936055
    reference_title: "Prenatal Diagnosis of Arthrogryposis Multiplex Congenita (AMC): Ultrasound and Genetic Findings in 69 Fetuses From 67 Unrelated Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By exome sequencing, we identified causative variants in 14 of 42 families
      with negative karyotype and CNV results
    explanation: >-
      Sequential exome testing resolved a subset while leaving a substantial
      unsolved group.


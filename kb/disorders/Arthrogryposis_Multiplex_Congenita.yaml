    peripheral nerve branch.
  evidence:
  - reference: PMID:28318499
    reference_title: "Loss-of-Function Mutations in LGI4, a Secreted Ligand Involved in Schwann Cell Myelination, Are Responsible for Arthrogryposis Multiplex Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through genetic mapping of disease loci and whole-exome sequencing in four
      unrelated multiplex families presenting with severe AMC, we identified
      biallelic loss-of-function mutations in LGI4 (leucine-rich glioma-inactivated 4).
    explanation: >-
      Establishes biallelic LGI4 loss of function as causative across four families.
  - reference: PMID:33820833
    reference_title: Phenotypic spectrum and genomics of undiagnosed arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We achieved disease gene identification in 52.7% of AMC index patients

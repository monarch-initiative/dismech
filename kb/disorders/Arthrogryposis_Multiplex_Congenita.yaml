name: Arthrogryposis Multiplex Congenita
creation_date: "2026-05-13T12:00:00Z"
category: Complex
description: >-
  Arthrogryposis multiplex congenita (AMC) is a descriptive congenital
  phenotype and clinical syndrome, not a single etiologic disease. It is
  defined by congenital contractures affecting at least two different body
  regions. The distribution, associated anomalies, functional consequences,
  underlying cause, and recurrence risk vary widely. Etiologies can involve
  the central or peripheral nervous system, neuromuscular junction, muscle,
  connective or skeletal tissue, or the intrauterine environment. Reduced
  fetal movement is a well-supported route to contracture formation in some
  etiologic branches, but it is not modeled here as a proven universal cause.
synonyms:
- AMC
- Arthrogryposis
- Multiple congenital contractures
disease_term:
  preferred_term: arthrogryposis multiplex congenita
  term:
    id: MONDO:0015168
    label: arthrogryposis multiplex congenita
parents:
- Congenital Disorder

definitions:
- name: Multi-region congenital contracture definition
  definition_type: OTHER
  description: >-
    AMC is identified clinically when congenital joint contractures involve
    two or more different body regions. This definition identifies a phenotype
    for etiologic investigation; it does not assign a gene, inheritance mode,
    or mechanism.
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthrogryposis is a clinical feature defined by congenital joint
      contractures in two or more different body areas
    explanation: >-
      The clinical genetics report states the phenotype-level inclusion
      definition without treating arthrogryposis as one molecular disorder.
- name: Etiologically heterogeneous clinical-syndrome definition
  definition_type: OTHER
  description: >-
    AMC is an etiologically heterogeneous clinical syndrome. A complete
    diagnosis therefore includes both recognition of the contracture phenotype
    and an attempt to determine the underlying disorder or exposure.
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Arthrogryposis multiplex congenita (AMC) is a clinical syndrome with complex etiology."
    explanation: >-
      The multidisciplinary consensus explicitly distinguishes the clinical
      syndrome from its many possible etiologies.
  - reference: PMID:40195522
    reference_title: "Perinatal genetic diagnostic yield in a population of fetuses with the phenotype arthrogryposis multiplex congenita: a cohort study 2007-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arthrogryposis multiplex congenita (AMC) presents challenges for prenatal
      detection due to its heterogeneous etiology, onset, and phenotypical
      manifestations.
    explanation: >-
      The consecutive fetal cohort independently supports heterogeneity of
      cause, onset, and presentation.

has_subtypes:
- name: Amyoplasia pattern
  display_name: Amyoplasia
  description: >-
    Amyoplasia is a recognized clinical pattern within AMC, with characteristic
    limb positions and fatty-fibrous replacement of affected muscle. Its
    sporadic occurrence is a property of Amyoplasia, not an inheritance rule
    for the AMC umbrella.
  subtype_term:
    preferred_term: congenital amyoplasia
    term:
      id: MONDO:0044629
      label: congenital amyoplasia
  evidence:
  - reference: PMID:24459070
    reference_title: Amyoplasia revisited.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected limbs had characteristic positions with fatty-fibrous replacement of muscle."
    explanation: >-
      The 560-person Amyoplasia series supports this pattern-specific tissue
      and limb-position phenotype.
- name: Distal arthrogryposis pattern
  display_name: Distal arthrogryposis
  description: >-
    Distal arthrogryposis is a group of etiologic diagnoses in which distal
    joints are emphasized and proximal involvement is generally less extensive.
    Molecular and inheritance findings for individual distal arthrogryposis
    disorders must not be generalized to all AMC.
  subtype_term:
    preferred_term: distal arthrogryposis
    term:
      id: MONDO:0019942
      label: distal arthrogryposis
  evidence:
  - reference: PMID:33104047
    reference_title: A review of the orthopedic interventions and functional outcomes among a cohort of 114 children with arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with DA had less involvement of the proximal joints than those in the two other groups."
    explanation: >-
      The pediatric cohort supports distal arthrogryposis as a clinically
      distinguishable distribution pattern.
- name: Central nervous system, neuromuscular, and syndromic patterns
  description: >-
    AMC may accompany central nervous system, peripheral neuromuscular, or
    multisystem disorders. This is an etiologic-work-up grouping rather than a
    single formal subtype, and associated prognosis is determined by the
    underlying diagnosis.
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      AMC may be divided into amyoplasia, distal arthrogryposis, central nervous
      system and neuromuscular diseases
    explanation: >-
      The consensus uses these groups to organize diagnostic evaluation while
      retaining AMC as a complex clinical syndrome.

- name: AMC1
  display_name: Arthrogryposis multiplex congenita 1, neurogenic, with myelin defect (LGI4)
  subtype_term:
    preferred_term: arthrogryposis multiplex congenita 1, neurogenic, with myelin defect
    term:
      id: MONDO:0060486
      label: arthrogryposis multiplex congenita 1, neurogenic, with myelin defect
  genes:
  - preferred_term: LGI4
    term:
      id: hgnc:18712
      label: LGI4
  description: >-
    Biallelic loss-of-function mutations in LGI4, a ligand secreted by Schwann
    cells that regulates peripheral nerve myelination through its receptor
    ADAM22. Sciatic nerve from an affected individual showed a lack of myelin,
    placing the lesion in the peripheral nerve rather than in muscle or brain.
    Note that MONDO files this term under hypomyelination neuropathy-arthrogryposis
    syndrome rather than directly under the AMC parent, even though its own label
    numbers it as AMC1.
  evidence:
  - reference: PMID:28318499
    reference_title: "Loss-of-Function Mutations in LGI4, a Secreted Ligand Involved in Schwann Cell Myelination, Are Responsible for Arthrogryposis Multiplex Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through genetic mapping of disease loci and whole-exome sequencing in four
      unrelated multiplex families presenting with severe AMC, we identified
      biallelic loss-of-function mutations in LGI4 (leucine-rich glioma-inactivated 4).
    explanation: >-
      Establishes biallelic LGI4 loss of function as a cause of severe AMC in
      four independent families.
  - reference: PMID:28318499
    reference_title: "Loss-of-Function Mutations in LGI4, a Secreted Ligand Involved in Schwann Cell Myelination, Are Responsible for Arthrogryposis Multiplex Congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunolabeling experiments and transmission electron microscopy of the
      sciatic nerve from one of the affected individuals revealed a lack of myelin.
    explanation: >-
      Direct tissue evidence for the peripheral myelin defect that assigns this
      subtype to the nerve branch.
- name: AMC2
  display_name: Arthrogryposis multiplex congenita 2, neurogenic type (ERGIC1)
  subtype_term:
    preferred_term: arthrogryposis multiplex congenita 2, neurogenic type
    term:
      id: MONDO:0008823
      label: arthrogryposis multiplex congenita 2, neurogenic type
  genes:
  - preferred_term: ERGIC1
    term:
      id: hgnc:29205
      label: ERGIC1
  description: >-
    A homozygous pathogenic ERGIC1 variant identified in a large Israeli Arab
    kindred previously mapped to chromosome 5qter. ERGIC1 encodes a cycling
    membrane protein with a possible role in endoplasmic reticulum to Golgi
    transport, so the authors propose protein trafficking, rather than a
    contractile or myelin lesion, as the underlying abnormality. Note that the
    bound term does double duty in MONDO: it carries the ERGIC1 OMIM entity
    (OMIM:208100) and is also the parent of arthrogryposis-renal
    dysfunction-cholestasis syndrome (MONDO:0017123, VPS33B and VIPAS39), which
    is curated separately here. A causal-gene query against this term therefore
    returns VPS33B and VIPAS39 alongside ERGIC1; only ERGIC1 is bound on this
    row, because only ERGIC1 is the gene of the AMC2 concept itself.
  evidence:
  - reference: PMID:28317099
    reference_title: "Mutations in ERGIC1 cause Arthrogryposis multiplex congenita, neuropathic type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole exome sequencing, we have now identified homozygous pathogenic
      variant in the ERGIC1 gene within the previously defined linked region.
    explanation: >-
      Establishes the homozygous ERGIC1 variant as the cause in the mapped kindred.
  - reference: PMID:28317099
    reference_title: "Mutations in ERGIC1 cause Arthrogryposis multiplex congenita, neuropathic type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ERGIC1 encodes a cycling membrane protein which has a possible role in
      transport between endoplasmic reticulum and Golgi.
    explanation: >-
      Source for the trafficking mechanism recorded here; note the authors
      themselves write "possible role", which this description preserves.
- name: AMC3
  display_name: Arthrogryposis multiplex congenita 3, myogenic type (SYNE1)
  subtype_term:
    preferred_term: arthrogryposis multiplex congenita 3, myogenic type
    term:
      id: MONDO:0032778
      label: arthrogryposis multiplex congenita 3, myogenic type
  genes:
  - preferred_term: SYNE1
    term:
      id: hgnc:17089
      label: SYNE1
  description: >-
    An autosomal recessive myogenic form described in a large consanguineous
    family, caused by a homozygous splice acceptor site substitution in SYNE1
    that removes the C-terminal KASH transmembrane domain of nesprin-1. The
    clinical course includes bilateral clubfoot, decreased fetal movements,
    delayed motor milestones and progressive motor decline after the first
    decade. SYNE1 also causes autosomal recessive cerebellar ataxia and
    Emery-Dreifuss muscular dystrophy, both curated separately here.
  evidence:
  - reference: PMID:19542096
    reference_title: "Mutation of SYNE-1, encoding an essential component of the nuclear lamina, is responsible for autosomal recessive arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe an autosomal recessive form of myogenic AMC in a large
      consanguineous family.
    explanation: >-
      Establishes the myogenic autosomal recessive form this subtype records.
  - reference: PMID:19542096
    reference_title: "Mutation of SYNE-1, encoding an essential component of the nuclear lamina, is responsible for autosomal recessive arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease is characterized by bilateral clubfoot, decreased fetal
      movements, delay in motor milestones, then progressive motor decline after
      the first decade.
    explanation: >-
      Source for the clinical course quoted in this description.
- name: AMC4
  display_name: Arthrogryposis multiplex congenita 4, neurogenic, with agenesis of the corpus callosum (SCYL2)
  subtype_term:
    preferred_term: arthrogryposis multiplex congenita 4, neurogenic, with agenesis of the corpus callosum
    term:
      id: MONDO:0032903
      label: arthrogryposis multiplex congenita 4, neurogenic, with agenesis of the corpus callosum
  genes:
  - preferred_term: SCYL2
    term:
      id: hgnc:19286
      label: SCYL2
  description: >-
    Caused by biallelic SCYL2 variants. Although MONDO and OMIM label this form
    neurogenic, the reported phenotype is central: microcephaly, agenesis of the
    corpus callosum, optic atrophy, global developmental delay and early
    lethality. It is therefore wired here to the central nervous system branch
    rather than to the peripheral motor unit branch.
  evidence:
  - reference: PMID:40243816
    reference_title: "Novel SCYL2 Mutations and Arthrogryposis Multiplex Congenita 4: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurogenic arthrogryposis due to SCYL2 mutations, also known as
      arthrogryposis multiplex congenita 4 (AMC4), is a rare condition that
      presents with microcephaly, agenesis of the corpus callosum, optic atrophy,
      global developmental delay, and early lethality.
    explanation: >-
      Source for both the AMC4 designation and the central nervous system
      phenotype that places this subtype in the brain branch.
  - reference: PMID:40243816
    reference_title: "Novel SCYL2 Mutations and Arthrogryposis Multiplex Congenita 4: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present two novel missense mutations in SCYL2 resulting in loss of
      function at the protein level in a pediatric case of AMC4, further
      highlighting the key role of SCYL2 in neuronal cell survival and healthy
      brain development.
    explanation: >-
      Supports loss of function as the mechanism and the neuronal/brain role
      recorded here.
- name: AMC5
  display_name: Arthrogryposis multiplex congenita 5 (TOR1A)
  subtype_term:
    preferred_term: arthrogryposis multiplex congenita 5
    term:
      id: MONDO:0100218
      label: arthrogryposis multiplex congenita 5
  genes:
  - preferred_term: TOR1A
    term:
      id: hgnc:3098
      label: TOR1A
  description: >-
    Caused by biallelic TOR1A variants. This is the recessive counterpart of the
    heterozygous TOR1A allele that causes DYT1 dystonia with incomplete
    penetrance; the recessive syndrome is characterized by severe arthrogryposis,
    developmental delay, strabismus and tremor, and dystonic movements were
    observed in the reported infant.
  evidence:
  - reference: PMID:30244176
    reference_title: "Biallelic TOR1A mutations cause severe arthrogryposis: A case requiring reverse phenotyping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive TOR1A disease is a very recently described syndrome
      characterized by severe arthrogryposis, developmental delay, strabismus and
      tremor.
    explanation: >-
      Source for the recessive TOR1A syndrome definition recorded in this description.
  - reference: PMID:30244176
    reference_title: "Biallelic TOR1A mutations cause severe arthrogryposis: A case requiring reverse phenotyping."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing revealed a homozygous nonsense variant in exon 5 of
      TOR1A (c.862C > T, p.Arg288*).
    explanation: >-
      Identifies the biallelic genotype in the reported case.
- name: AMC6
  display_name: Arthrogryposis multiplex congenita 6 (NEB)
  subtype_term:
    preferred_term: arthrogryposis multiplex congenita 6
    term:
      id: MONDO:0030281
      label: arthrogryposis multiplex congenita 6
  genes:
  - preferred_term: NEB
    term:
      id: hgnc:7720
      label: NEB
  description: >-
    NEB mutations producing nemaline myopathy can present as fetal akinesia
    deformation sequence or AMC, with characteristic nemaline bodies on muscle
    specimens. In the reported series of seven cases from three families, only
    the Ashkenazi Jewish family carried two identified pathogenic alleles; in the
    other two families a single pathogenic heterozygous mutation was detected,
    so the genotype was not fully resolved in every case. NEB is also curated
    here under Nemaline Myopathy.
  evidence:
  - reference: PMID:27933661
    reference_title: Mutations in the NEB gene cause fetal akinesia/arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nemaline myopathy due to NEB mutation(s) leads to FADS/AMC.
    explanation: >-
      States the gene-to-phenotype link this subtype records.
  - reference: PMID:27933661
    reference_title: Mutations in the NEB gene cause fetal akinesia/arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other two families were of Chinese and Korean origins, and only one
      pathogenic heterozygous mutation was detected in each.
    explanation: >-
      Source for the incomplete-genotype caveat this description records rather
      than omits.
- name: AMC7
  display_name: Arthrogryposis multiplex congenita 7, X-linked (THOC2)
  subtype_term:
    preferred_term: arthrogryposis multiplex congenita 7, X-linked
    term:
      id: MONDO:0975826
      label: arthrogryposis multiplex congenita 7, X-linked
  genes:
  - preferred_term: THOC2
    term:
      id: hgnc:19073
      label: THOC2
  description: >-
    An X-linked form reported in two male fetuses of one family carrying a novel
    consensus acceptor splice site variant in THOC2, which encodes a subunit of
    the Transcription-Export (TREX) complex that facilitates mRNA export. THOC2
    is otherwise known for X-linked intellectual disability, curated separately
    here, and the authors describe this as the most severe THOC2 phenotype
    reported at the time. Evidence rests on a single family.
  evidence:
  - reference: PMID:34976470
    reference_title: "Novel Consensus Splice Site Pathogenic Variation in THOC2 Gene Leads to Recurrent Arthrogryposis Multiplex Congenita Phenotype: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe for the first time a recurrent arthrogryposis multiplex
      congenita phenotype (AMC) in two male fetuses in a family.
    explanation: >-
      Establishes the AMC phenotype and the single-family, two-fetus evidence base.
  - reference: PMID:34976470
    reference_title: "Novel Consensus Splice Site Pathogenic Variation in THOC2 Gene Leads to Recurrent Arthrogryposis Multiplex Congenita Phenotype: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the most severe phenotype described in THOC2 gene-related disease
      till date.
    explanation: >-
      Source for the severity framing recorded in this description.
- name: MYBPC1-related AMC
  display_name: MYBPC1-related autosomal recessive non-lethal arthrogryposis multiplex congenita
  subtype_term:
    preferred_term: MYBPC1-related autosomal recessive non-lethal arthrogryposis multiplex congenita syndrome
    term:
      id: MONDO:0044682
      label: MYBPC1-related autosomal recessive non-lethal arthrogryposis multiplex congenita syndrome
  genes:
  - preferred_term: MYBPC1
    term:
      id: hgnc:7549
      label: MYBPC1
  description: >-
    A homozygous MYBPC1 missense variant reported in a consanguineous
    Israeli-Druze family with variable intrafamilial AMC. MYBPC1 encodes a slow
    skeletal muscle isoform essential for muscle contraction, so the lesion is
    myogenic. This is a milder, non-lethal phenotype distinct from the lethal
    congenital contractural syndrome 4 that a homozygous MYBPC1 nonsense mutation
    produces; that lethal form is curated here under Lethal Congenital
    Contracture Syndrome as LCCS4.
  evidence:
  - reference: PMID:26661508
    reference_title: "Expanding the MYBPC1 phenotypic spectrum: a novel homozygous mutation causes arthrogryposis multiplex congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variant analysis focused on rare homozygous changes, revealed a missense
      variant in MYBPC1, NM_002465:c.556G>A (p.E286K), affecting the last
      nucleotide of Exon 8.
    explanation: >-
      Identifies the homozygous MYBPC1 genotype in the reported AMC family.
  - reference: PMID:26661508
    reference_title: "Expanding the MYBPC1 phenotypic spectrum: a novel homozygous mutation causes arthrogryposis multiplex congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous mutations in this gene are associated with distal
      arthrogryposis types 1b and 2, whereas a homozygous nonsense mutation is
      implicated in one family with lethal congenital contractural syndrome 4.
    explanation: >-
      Source for the allelic relationship with LCCS4 and distal arthrogryposis
      that this description records.
  - reference: PMID:26661508
    reference_title: "Expanding the MYBPC1 phenotypic spectrum: a novel homozygous mutation causes arthrogryposis multiplex congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYBPC1 encodes a slow skeletal muscle isoform, essential for muscle
      contraction.
    explanation: >-
      Source for assigning this subtype to the skeletal muscle branch.
- name: LAAHD
  display_name: Lethal arthrogryposis with anterior horn cell disease (GLE1)
  subtype_term:
    preferred_term: lethal arthrogryposis-anterior horn cell disease syndrome
    term:
      id: MONDO:0012750
      label: lethal arthrogryposis-anterior horn cell disease syndrome
  genes:
  - preferred_term: GLE1
    term:
      id: hgnc:4315
      label: GLE1
  description: >-
    One of two recessive AMC subtypes caused by GLE1 mutations, historically
    separated from lethal congenital contracture syndrome 1 (LCCS1), which is
    curated here under Lethal Congenital Contracture Syndrome. The authors of the
    spectrum report argue the two are not sufficiently differentiated clinically
    or molecularly to be considered separate allelic disorders, and instead
    describe a single variable GLE1 severity spectrum; a surviving affected
    individual reported at 12 years of age contradicts the earlier claim that all
    patients die in the perinatal period. This row records the distinct MONDO
    concept while flagging that published opinion disputes the split.
  evidence:
  - reference: PMID:27684565
    reference_title: Expansion of the GLE1-associated arthrogryposis multiplex congenita clinical spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in GLE1 cause two recessive subtypes of arthrogryposis multiplex
      congenita (AMC), a condition characterized by joint contractures at birth,
      and all previously reported patients died in the perinatal period.
    explanation: >-
      Establishes GLE1 as the cause of two recessive AMC subtypes, of which this
      row is one.
  - reference: PMID:27684565
    reference_title: Expansion of the GLE1-associated arthrogryposis multiplex congenita clinical spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also suggest that lethal congenital contracture syndrome 1 (LCCS1) and
      lethal arthrogryposis with anterior horn disease (LAAHD), the two AMC
      subtypes related to GLE1, do not have sufficient clinical or molecular
      differentiation to be considered allelic disorders.
    explanation: >-
      The published challenge to the LCCS1/LAAHD split that this description
      records rather than silently adopting.
  - reference: PMID:27684565
    reference_title: Expansion of the GLE1-associated arthrogryposis multiplex congenita clinical spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report two non-Finnish brothers with novel compound heterozygous
      splicing mutations in GLE1, one of whom has survived to 12 years of age.
    explanation: >-
      Source for the 12-year survival that contradicts the uniformly perinatal
      lethality previously reported.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Functional burden ranges from independent ambulation and self-care to major
    mobility limitation and repeated orthopedic care. Contracture count,
    distribution, knee involvement, central nervous system or syndromic
    involvement, and the underlying etiology materially change outcome, so no
    single low, moderate, or high burden level represents the umbrella.
  evidence:
  - reference: PMID:41475428
    reference_title: "Factors Associated With Functional Mobility in 256 Children With Arthrogryposis Multiplex Congenita: A Multicentric Cross-Sectional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Greater joint involvement, particularly at the knees, was a strong negative factor."
    explanation: >-
      The multicenter cohort links distribution and number of contractures with
      mobility, supporting substantial within-syndrome variability.
  - reference: PMID:33104047
    reference_title: A review of the orthopedic interventions and functional outcomes among a cohort of 114 children with arthrogryposis multiplex congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contractures can lead to decreased range of motion and strength, and
      affect ambulation and autonomy.
    explanation: >-
      The pediatric cohort directly documents the functional domains affected
      by AMC contractures.
progression:
- phase: Prenatal emergence and detection
  age_range: Fetal period
  notes: >-
    Contractures and reduced movement may become apparent at different
    gestational stages. A normal earlier scan does not exclude later recognition,
    and serial assessment may be appropriate when findings evolve.
  evidence:
  - reference: PMID:41936055
    reference_title: "Prenatal Diagnosis of Arthrogryposis Multiplex Congenita (AMC): Ultrasound and Genetic Findings in 69 Fetuses From 67 Unrelated Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMC can occur at any stage of pregnancy and exhibits phenotypic heterogeneity. Regular follow-up ultrasounds are essential."
    explanation: >-
      The retrospective fetal cohort supports variable prenatal timing and
      serial ultrasound follow-up.
- phase: Congenital contracture state with variable later function
  age_range: Birth onward
  notes: >-
    The defining contractures are congenital and described as non-progressive.
    This does not mean that range of motion, secondary deformity, mobility, or
    care needs remain static; those outcomes vary with growth, distribution,
    treatment, and the underlying diagnosis.
  evidence:
  - reference: PMID:40947408
    reference_title: "[Expert consensus on the clinical diagnosis and management of Arthrogryposis multiplex congenita (2025 Edition)]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is a non-progressive syndrome characterized by joint deformity and
      stiffness, muscle atrophy, reduction of skin folds and subcutaneous
      tissue, and contracture of periarticular tissue
    explanation: >-
      The consensus supports congenital non-progression of the defining
      syndrome while the entry separately preserves variable functional course.

pathophysiology:
- name: Primary skeletal muscle etiologic branch
  description: >-
    The contractile apparatus of fetal skeletal muscle fails, so movement is
    lost at the effector rather than at its neural command. In a 315-family
    cohort of undiagnosed AMC, primary involvement of skeletal muscle was the
    most frequent cause at 40%. The genes bound here act at different points of
    that apparatus: MYBPC1 encodes a slow skeletal muscle isoform essential for
    muscle contraction, NEB produces nemaline myopathy with nemaline bodies on

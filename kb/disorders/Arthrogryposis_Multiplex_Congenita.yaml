notes: >-
  This umbrella entry intentionally omits prevalence, inheritance, and a gene
  list. Published occurrence estimates vary with case definition and setting,
  while inheritance and causal genes belong to the identified underlying
  diagnosis. Amyoplasia and distal arthrogryposis are retained as illustrative
  clinical-pattern branches, not an exhaustive taxonomy. The fetal-akinesia
  pathway is explicitly bounded to etiologies for which reduced movement is
  supported. Detailed gene-specific mechanisms and recurrence risks belong in
  dedicated etiologic disorder entries.

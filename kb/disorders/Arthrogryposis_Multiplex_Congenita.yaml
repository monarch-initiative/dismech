- accession: geo:GSE208171
  title: Loss of protein function of ZC4H2 gene causing severe phenotypes of female-restricted Wieacker Wolff Syndrome
  description: 'Background: Pathogenic variants of zinc finger C4H2-type containing (ZC4H2) on the X chromosome caused a group of genetic diseases called ZC4H2-associated rare disorders (ZARD), including Wieacker-Wolff Syndrome (WRWF) and Female-restricted Wieacker-Wolff Syndrome (WRWFFR). Patients displayed arthrogryposis multiplex congenita (AMC), central and peripheral nervous system involvement, as well as multiple dysmorphic features. The underlying mechanisms of the complex syndrome remain to be elucidated. Methods: Expression levels of ZC4H2 were knockdown in neural stem cells (NSCs) derived from induced pluripotent stem cells (iPSCs) by lentiviral-expressed shRNAs against ZC4H2.'
  organism:
    preferred_term: human
    term:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common prenatal ultrasound finding was clubfoot, observed in 50.7% (35/69) of fetuses."
    explanation: >-
      This cohort-specific estimate supports common prenatal clubfoot without
      making it universal.
- name: Decreased fetal movement

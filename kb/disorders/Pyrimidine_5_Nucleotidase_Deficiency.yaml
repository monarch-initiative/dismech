name: Pyrimidine 5-Nucleotidase Deficiency
creation_date: "2026-09-09T14:00:00Z"
category: Mendelian
synonyms:
- P5N deficiency
- P5'N-1 deficiency
- UMPH1 deficiency
- uridine 5-prime monophosphate hydrolase deficiency
- hemolytic anemia due to pyrimidine 5' nucleotidase deficiency
- NT5C3A deficiency
- cN-III deficiency
description: >-
  Pyrimidine 5-nucleotidase deficiency is an autosomal recessive congenital
  nonspherocytic hemolytic anemia caused by biallelic NT5C3A variants. It is the
  third most common red-cell enzymopathy after glucose-6-phosphate dehydrogenase
  and pyruvate kinase deficiency, and the most common of the nucleotide-metabolism
  defects.

  The mechanism turns on something the mature erythrocyte cannot do. During
  reticulocyte maturation the cell dismantles its ribosomes, and the pyrimidine
  nucleotides released from ribosomal RNA are charged and therefore cannot cross
  the membrane. Pyrimidine 5-nucleotidase dephosphorylates them to diffusible
  nucleosides so they can leave. Without it the pyrimidine nucleotides are
  trapped: total erythrocyte nucleotide rises several-fold and around 80 percent
  of the pool becomes pyrimidine, where a normal red cell is 97 percent or more
  adenine.

  What the blood film shows follows directly. The undegraded ribosomal RNA
  aggregates into the coarse basophilic stippling that is the diagnostic hallmark
  of the disease, and the affected cells are cleared early, giving a chronic
  compensated-to-moderate hemolysis with reticulocytosis, unconjugated
  hyperbilirubinemia and pigment gallstones.

  Two features of the history are worth keeping in view. The disorder was
  originally named for a raised red-cell ATP, because the accumulated nucleotides
  were assumed to be adenine phosphates; they are pyrimidines, and the associated
  ribose phosphate pyrophosphokinase deficiency the first reports emphasised was
  an epiphenomenon. And the same enzyme deficiency is produced acquired by lead,
  which is why lead poisoning reproduces both the hemolysis and the stippling.

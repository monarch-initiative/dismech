inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Only homozygotes and compound heterozygotes are affected. Biochemical
    heterozygotes are hematologically normal, which makes carriers hard to
    identify by enzyme assay and is one reason the disease is underdiagnosed.
  evidence:
  - reference: PMID:10916681
    reference_title: "Chronic non-spherocytic haemolytic anaemia due to congenital pyrimidine 5' nucleotidase deficiency: 25 years later."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic transmission is via the autosomic recessive mode, and only homozygous or compound heterozygous are clinically affected. Family members who are biochemically heterozygous are haematologically normal and difficult to detect.
    explanation: >-
      States the inheritance mode and, in the same passage, the carrier
      detection problem it creates.
  - reference: PMID:4372252
    reference_title: "Hereditary hemolytic anemia with human erythrocyte pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While comparatively few family members have been available thus far for study, initial data are compatible with an autosomal, recessive mode of transmission of the deficiency.
    explanation: >-
      The original inference of recessive inheritance, quoted with the
      authors' own hedge about how few families it rested on.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. Reported family counts are the only figure
    available and they have grown steadily: about 35 unrelated families by 2000,
    more than 60 by 2022. Relative rank is better established than absolute
    frequency - it is the third most common red cell enzymopathy behind G6PD and
    pyruvate kinase deficiency.
  evidence:
  - reference: PMID:10916681
    reference_title: "Chronic non-spherocytic haemolytic anaemia due to congenital pyrimidine 5' nucleotidase deficiency: 25 years later."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-five years after its description, P5N deficiency has been reported in about 35 unrelated families from different parts of the world, and it has become one commonly identified cause of hereditary non-spherocytic haemolytic anaemia due to RBC enzymopathy.
    explanation: >-
      The published family count at 25 years, standing in for a prevalence
      estimate that has never been made.
  - reference: PMID:36434495
    reference_title: "A rare mutation (p.F149del) of the NT5C3A gene is associated with pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The least numerous and the rarest is the group of erythrocyte disorders involved in nucleotide metabolism.
    explanation: >-
      Places the nucleotide-metabolism enzymopathies, of which this is the
      commonest, as the rarest group of red cell enzyme disorders.
pathophysiology:
- name: Biallelic NT5C3A Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Missense, nonsense, splice-site and in-frame deletion variants on both
    NT5C3A alleles. The gene sits on chromosome 7, has 10 exons with alternative
    splicing of exon 2, and encodes proteins of 286 and 297 amino acids.
    Molecular diagnosis was delayed by nearly three decades after the clinical
    description, partly because P5N pseudogenes on chromosomes 4 and 7
    complicate the sequencing.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of Erythrocyte Pyrimidine 5-Nucleotidase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36434495
      reference_title: "A rare mutation (p.F149del) of the NT5C3A gene is associated with pyrimidine 5'-nucleotidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Only residual activity of pyrimidine 5'-nucleotidase in the brothers' erythrocytes could be observed when compared with the controls, including their asymptomatic father and sister.
      explanation: >-
        Ties a specific NT5C3A genotype to the loss of enzyme activity in the
        patients' own red cells, with unaffected relatives as the comparison.
  evidence:
  - reference: PMID:11369620
    reference_title: "Genetic basis of hemolytic anemia caused by pyrimidine 5' nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is found on chromosome 7, consists of 10 exons with alternative splicing of exon 2, and produces proteins 286 and 297 amino acids long.
    explanation: >-
      The gene structure this node describes, from the paper that identified it.
  - reference: PMID:11369620
    reference_title: "Genetic basis of hemolytic anemia caused by pyrimidine 5' nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three homozygous mutations were identified in this gene in 4 subjects with P5'N-1 deficiency: codon 98 GAT-->GTT, Asp-->Val (linked to a silent polymorphism codon 92, TAC-->TAT), codon 177, CAA-->TAA, Gln-->termination, and IVS9-1, G-->T.
    explanation: >-
      The first three disease alleles, showing the missense, nonsense and splice
      classes this node covers.
- name: Loss of Erythrocyte Pyrimidine 5-Nucleotidase Activity
  biological_scale: MOLECULAR
  description: >-
    Enzyme activity in affected red cells falls to under 14 percent, usually
    under 10 percent, of normal. The deficit is larger than it looks on a raw
    assay: the enzyme is normally enriched in reticulocytes, so a
    reticulocyte-rich hemolytic sample should read high, and reading low against
    that expectation means the true deficit is greater than the ratio to normal
    whole blood suggests. In one severe case Western blot showed no detectable
    protein at all.
  molecular_functions:
  - preferred_term: pyrimidine 5-nucleotidase activity
    modifier: DECREASED
    term:
      id: GO:0008253
      label: 5'-nucleotidase activity
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  downstream:
  - target: Intraerythrocytic Pyrimidine Nucleotide Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:4372252
      reference_title: "Hereditary hemolytic anemia with human erythrocyte pyrimidine 5'-nucleotidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The pyrimidine 5'-ribonucleotides are presumably derived from RNA degradation and, not being diffusible, accumulate when the enzyme catalyzing their dephosphorylation is deficient.
      explanation: >-
        States the causal step this edge asserts, and the reason the substrate
        cannot simply leave the cell instead.
  evidence:
  - reference: PMID:4372252
    reference_title: "Hereditary hemolytic anemia with human erythrocyte pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nucleotidase activity in deficient red cells assayed less than 14%, and usually less than 10%, of normal and much less in terms of reticulocyte-rich blood, where it was consistently found to be increased.
    explanation: >-
      Quantifies the residual activity and makes the reticulocyte correction
      that this node depends on.
  - reference: PMID:36434495
    reference_title: "A rare mutation (p.F149del) of the NT5C3A gene is associated with pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Western blot showed no sign of the presence of 5'-nucleotidase protein in the erythrocytes of both studied patients.
    explanation: >-
      A case in which the loss is of the protein itself rather than of its
      catalytic activity.
- name: Intraerythrocytic Pyrimidine Nucleotide Accumulation
  biological_scale: CELLULAR
  description: >-
    Pyrimidine nucleotides released by ribosomal RNA breakdown during
    reticulocyte maturation carry a phosphate and cannot cross the membrane.
    Undephosphorylated, they are trapped. Total nucleotide rises three- to
    six-fold and roughly 80 percent of the pool becomes pyrimidine, against 97
    percent or more adenine in a normal red cell - a compositional inversion, not
    merely an excess.
  cell_types:
  - preferred_term: erythrocyte
    term:

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:4372252
    reference_title: "Hereditary hemolytic anemia with human erythrocyte pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is postulated that the prominent basophilic stippling results from retarded ribosomal RNA degradation secondary to accumulation of degradation products, namely pyrimidine 5'-ribonucleotides.
    explanation: >-
      The proposed link from nucleotide accumulation to stippling, quoted with
      the authors' own "It is postulated" so the epistemic status is visible.
- name: Coarse Basophilic Stippling
  biological_scale: CELLULAR
  description: >-
    Aggregated undegraded ribosomal RNA visible on a Romanowsky-stained film as
    coarse blue granules throughout the erythrocyte. It is the diagnostic
    hallmark of the disease and, together with a nonspherocytic hemolytic
    picture and normal G6PD and pyruvate kinase, is what prompts the enzyme assay
    or the NT5C3A sequencing.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  downstream:
  - target: Erythrocyte inclusion bodies
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11369620
    reference_title: "Genetic basis of hemolytic anemia caused by pyrimidine 5' nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pyrimidine 5' nucleotidase (P5'N-1) deficiency is an autosomal recessive condition causing hemolytic anemia characterized by marked basophilic stippling and the accumulation of high concentrations of pyrimidine nucleotides within the erythrocyte.
    explanation: >-
      Names the stippling as the characterising feature alongside the nucleotide
      accumulation that causes it.
- name: Shortened Erythrocyte Survival
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Chronic extravascular hemolysis, ranging from fully compensated to
    transfusion-requiring. The step from the loaded, stippled cell to its
    premature clearance is the least well understood part of the chain: reviews
    describe the hemolytic mechanism as still unclear, and the raised reduced
    glutathione seen in patient cells has never been explained. The entry
    therefore records this edge as indirect with unknown intermediates rather
    than asserting a mechanism.

    One candidate has real support and is worth naming rather than leaving out.
    Beyond the nucleotide load itself, inhibition of hexose monophosphate shunt
    activity in young erythrocytes has been proposed as a second contributor,
    which would make the cells oxidant-vulnerable. The evidence for it is
    indirect and comes from a co-inheritance experiment: in a family segregating
    both this deficiency and hemoglobin E, the doubly homozygous individual had
    severe hemolysis while each single homozygote was mild or asymptomatic, and
    globin-chain work traced that to marked instability of Hb E specifically in
    enzyme-deficient cells, with free alpha-chains accumulating on the membrane.
    Note the tension with the raised glutathione: an oxidative account has to
    accommodate a finding that points the other way, and no cited source
    reconciles them.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  downstream:
  - target: Nonspherocytic hemolytic anemia
    causal_link_type: DIRECT
  - target: Reticulocytosis
    causal_link_type: DIRECT
  - target: Unconjugated hyperbilirubinemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23992312
    reference_title: "The enzymology of cytosolic pyrimidine 5'-nucleotidases: functional analysis and physiopathological implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cN-III was first linked to a genetic defect , hereditary pyrimidine nucleotidase deficiency, associated to a nonspherocyt ic hemolytic anemia disorder of still unclear mechanism but metabolically characterized by abnormally high levels of pyrimidine compounds and ribonucleoproteins in erythrocytes, as evidenced by occurrence of basophilic stippling on blood smearings.
    explanation: >-
      A review stating that the hemolytic mechanism remains unclear even though
      the metabolic lesion is well characterised. Quoted verbatim including the
      source's own typesetting artefacts.
  - reference: PMID:4372252
    reference_title: "Hereditary hemolytic anemia with human erythrocyte pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanism responsible for increased red cell GSH is unknown.
    explanation: >-
      The unexplained glutathione finding that has accompanied the disease since
      its description and is part of why the hemolytic step is unresolved.
  - reference: PMID:8839873
    reference_title: "Interaction of hemoglobin E and pyrimidine 5' nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      In view of the increasing evidence that the hemolysis associated with pyrimidine 5' nucleotidase deficiency results not only from an increase in the level of erythrocyte pyrimidines, but also from inhibition of the hexose monophosphate shunt activity in young erythrocytes, it is likely that the marked instability of Hb E in the enzyme-deficient cells results from oxidant damage acting on a mildly unstable Hb variant.
    explanation: >-
      Names the hexose-monophosphate-shunt candidate for the hemolytic step.
      Recorded as INDIRECT because the observation is about Hb E instability in
      deficient cells rather than about hemolysis in the isolated disorder, and
      quoted with the source's own "increasing evidence" and "it is likely".

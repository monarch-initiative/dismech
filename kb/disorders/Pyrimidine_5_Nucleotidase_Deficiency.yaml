genetic:
- name: NT5C3A
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: NT5C3A
    term:
      id: hgnc:17820
      label: NT5C3A
  notes: >-
    Encodes cytosolic 5-nucleotidase III-A (cN-IIIA, P5N-1), on chromosome 7.
    Formerly written P5'N-1 or UMPH1 in the older literature.

    Two practical points about sequencing this gene. P5N pseudogenes on
    chromosomes 4 and 7 complicated the original mutation analysis and are still
    a source of mapping artefact. And at least one reported family shows a
    genotype that does not read as straightforwardly biallelic: two brothers
    carried a heterozygous in-frame deletion yet expressed only the mutant
    transcript, so the authors proposed negative regulation of the normal allele
    rather than a second coding variant. A heterozygous NT5C3A finding in a
    patient with the biochemical phenotype should therefore not be dismissed
    without transcript-level work.

    NT5C3A also has a function outside the red cell that is not part of this
    disease: it is interferon-inducible in many cell types and represses NF-kB
    driven cytokine transcription. No immunological phenotype has been reported
    in P5N-deficient patients, and this entry makes no claim that one exists.
  evidence:
  - reference: PMID:11369620
    reference_title: "Genetic basis of hemolytic anemia caused by pyrimidine 5' nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The DNA analysis was complicated by P5'N-1 pseudogenes found on chromosomes 4 and 7.
    explanation: >-
      The pseudogene problem, from the study that first sequenced the gene.
  - reference: PMID:36434495
    reference_title: "A rare mutation (p.F149del) of the NT5C3A gene is associated with pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, our results may substantiate the hypothesis of the heterogeneity of the molecular basis of the defect involving both the mutation presented here and negative regulation of expression of the "normal" allele.
    explanation: >-
      The authors' proposal that a heterozygous coding genotype can still give
      the full phenotype through allele-specific expression.
  - reference: PMID:29463777
    reference_title: The intracellular pyrimidine 5'-nucleotidase NT5C3A is a negative epigenetic factor in interferon and cytokine signaling.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      The enzyme pyrimidine 5'-nucleotidase (NT5C3A), which mediates nucleotide catabolism, was previously thought to be restricted to blood cells.
    explanation: >-
      Recorded as NO_EVIDENCE deliberately. The paper establishes a real
      non-erythroid function for the gene, but says nothing about the hemolytic
      disease, and no immunological phenotype has been reported in patients. It
      is cited so that a reader who finds this literature is not left to infer a
      disease claim from it.
variants:
- name: NT5C3A c.444_446delGTT (p.F149del)
  description: >-
    In-frame single-codon deletion reported in two Polish brothers, inherited
    from an asymptomatic mother, with no detectable 5-nucleotidase protein on
    Western blot.
  evidence:
  - reference: PMID:36434495
    reference_title: "A rare mutation (p.F149del) of the NT5C3A gene is associated with pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous deletion in the NT5C3A gene (c.444_446delGTT), inherited most likely from their asymptomatic mother, resulted in a single amino acid residue deletion (p.F149del) in cytosolic pyrimidine 5'-nucleotidase.
    explanation: >-
      The variant, its consequence and its parental origin.
- name: NT5C3A c.693+1G>A
  description: >-
    Homozygous splice-donor variant reported in a 65-year-old woman with
    systemic lupus erythematosus and prior splenectomy, classified as possibly
    pathogenic on ACMG criteria.
  evidence:
  - reference: PMID:39967523
    reference_title: "Pyrimidine-5'-Nucleotidase Deficiency: a New Homozygous NT5C3A Mutation (c.693+1G>A variant)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing revealed a homozygous c.693+1G>A variant in the NT5C3A gene, classified as possibly pathogenic based on ACMG criteria.
    explanation: >-
      The variant and the classification the reporting authors assigned it.
environmental:
- name: Lead exposure
  description: >-
    Lead inhibits erythrocyte pyrimidine 5-nucleotidase, producing an acquired
    copy of the inherited enzyme defect. In a patient with lead intoxication,
    nucleotidase activity fell to about 25 percent of normal and 12 percent of
    erythrocyte nucleotides contained cytidine, where pyrimidine nucleotides are
    virtually absent from normal red cells. This is the mechanistic reason lead
    poisoning shows the same hemolysis and the same basophilic stippling, and it
    is why an acquired cause has to be excluded before the inherited disease is
    diagnosed.
  influences_mechanisms:
  - target: Loss of Erythrocyte Pyrimidine 5-Nucleotidase Activity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Lead phenocopies the disease at exactly this node, inhibiting the same
      enzyme rather than acting anywhere else in the chain.
    evidence:
    - reference: PMID:965496
      reference_title: "Lead poisoning: association with hemolytic anemia, basophilic stippling, erythrocyte pyrimidine 5'-nucleotidase deficiency, and intraerythrocytic accumulation of pyrimidines."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lead intoxication is accompanied by an acquired deficiency of erythrocyte pryimidine-specific, 5'-nucleotidase.
      explanation: >-
        States that lead acts by producing a deficiency of this specific enzyme.
        Quoted verbatim including the source's misspelling of pyrimidine.
  evidence:
  - reference: PMID:965496
    reference_title: "Lead poisoning: association with hemolytic anemia, basophilic stippling, erythrocyte pyrimidine 5'-nucleotidase deficiency, and intraerythrocytic accumulation of pyrimidines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present report documents that lead-induced deficiency when sufficiently severe gives rise to findings similar to the hereditary disorder.
    explanation: >-
      The phenocopy claim itself, stated by the same group that described the
      inherited disease.
  notes: >-
    No ECTO exposure term is bound. ECTO was searched for a lead-exposure term
    matching this claim and the candidates found describe route-specific
    exposures rather than the systemic lead intoxication the cited work reports,
    so the field is left unbound rather than approximated.
treatments:
- name: Supportive care and transfusion
  description: >-
    There is no treatment for the enzyme defect. Management is folate support,
    monitoring of the hemolysis, and transfusion during severe crises. Because
    both reported Chinese patients carried Gilbert-type UGT1A1 alleles and one
    had already developed gallstones, biliary surveillance is part of routine
    care.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Nonspherocytic hemolytic anemia
    term:
      id: HP:0001930
      label: Nonspherocytic hemolytic anemia
  evidence:
  - reference: PMID:39967523
    reference_title: "Pyrimidine-5'-Nucleotidase Deficiency: a New Homozygous NT5C3A Mutation (c.693+1G>A variant)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case underscores the necessity for genetic counseling for affected individuals and their families, as well as the importance of continued follow-up and supportive care in managing hemolytic anemia related to enzyme deficiencies.
    explanation: >-
      Names supportive care and follow-up as the management, which is the
      absence of a disease-modifying option stated positively.
- name: Splenectomy
  description: >-
    Reported in patients with this disease but not established as effective.
    The 65-year-old case had undergone splenectomy and was nonetheless admitted
    for persistent hemolytic crises, so the entry records splenectomy as
    something that is done rather than something that works.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  evidence:
  - reference: PMID:39967523
    reference_title: "Pyrimidine-5'-Nucleotidase Deficiency: a New Homozygous NT5C3A Mutation (c.693+1G>A variant)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a case of a 65-year-old female patient with systemic lupus erythematosus and a history of splenectomy, who was admitted for evaluation of persistent hemolytic crises.
    explanation: >-
      Records both that splenectomy was performed and that hemolysis persisted
      after it. This is the entry's only evidence on the question and it does
      not support efficacy.
diagnosis:
- name: Basophilic stippling with normal G6PD and pyruvate kinase
  description: >-
    The disease is found by looking at the film. Marked basophilic stippling in
    a nonspherocytic hemolytic anemia, with normal osmotic fragility and normal
    G6PD and pyruvate kinase activity, is the trigger for either a P5N enzyme
    assay or NT5C3A sequencing. A cheap screening alternative exists and is
    underused: deproteinized red cell extract shows a shifted ultraviolet
    absorbance maximum, from the usual 256-257 nm to about 266-270 nm, which
    requires no enzyme assay at all.
  evidence:
  - reference: PMID:4372252
    reference_title: "Hereditary hemolytic anemia with human erythrocyte pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The spectral characteristics of extracts provide the basis of a readily performed screening procedure, which does not require enzyme assay.
    explanation: >-
      The screening test and the fact that it avoids the enzyme assay.
  - reference: PMID:4372252
    reference_title: "Hereditary hemolytic anemia with human erythrocyte pyrimidine 5'-nucleotidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ultraviolet spectral curves of deproteinized red cell extracts exhibited a shift in maximum absorbance from the usual 256-257 nm to approximately 266-270 nm, and absorbance at 250, 270, 280, and 290 nm, expressed as a ratio of that at 260 nm, differed greatly from normal.
    explanation: >-
      The measurement the screening procedure rests on, with the wavelengths.
differential_diagnoses:
- name: Lead poisoning
  disease_term:
    preferred_term: lead poisoning
    term:
      id: MONDO:0018019
      label: lead poisoning
  description: >-
    The acquired phenocopy, and the differential that matters most because it is
    treatable and preventable. Lead inhibits the same enzyme, so the film, the
    hemolysis and the enzyme assay all look the same.
  distinguishing_features:
  - A blood lead level, which is normal in the inherited disease.
  - Lead-induced enzyme deficiency is partial (about 25 percent of normal activity reported) where the inherited deficiency is usually under 10 percent.
  - Biallelic NT5C3A variants are present in the inherited disease and absent in lead poisoning.
  evidence:
  - reference: PMID:965496
    reference_title: "Lead poisoning: association with hemolytic anemia, basophilic stippling, erythrocyte pyrimidine 5'-nucleotidase deficiency, and intraerythrocytic accumulation of pyrimidines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nucleotidase activity was about 25% that in normal erythrocytes and 15% or less of that expected in comparable reticulocyte-rich blood.
    explanation: >-
      The residual activity in lead intoxication, which is the figure the
      distinguishing feature above compares against.
discussions:
- discussion_id: p5n_hemolysis_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does pyrimidine nucleotide accumulation actually shorten
    erythrocyte survival?
  attaches_to:
  - pathophysiology#Shortened Erythrocyte Survival
  rationale: >-
    Every step from the gene to the stippled cell is well characterised, and the
    last one is not. Reviews written forty years after the disease was described
    still call the hemolytic mechanism unclear. Two long-standing observations
    are unexplained and may be part of the answer: reduced glutathione is raised
    rather than lowered in patient cells, which is the opposite of the oxidative
    picture in other red cell enzymopathies, and the ribose phosphate
    pyrophosphokinase deficiency that dominated the earliest reports was set
    aside as an epiphenomenon without ever being explained.
- discussion_id: p5n_basophilic_stippling_has_no_hp_term
  kind: CURATION_TODO
  prompt: >-
    Basophilic stippling, the diagnostic hallmark of this disease, has no term
    in the Human Phenotype Ontology.
  attaches_to:
  - phenotypes#Erythrocyte inclusion bodies
  rationale: >-
    HPO carries Erythrocyte inclusion bodies (HP:0020080) with three children -
    Pappenheimer bodies, Heinz bodies and Howell-Jolly bodies - and no term for
    basophilic stippling. The entry binds the parent and carries the specific
    concept in preferred_term. Pappenheimer bodies (HP:0020081) must not be used
    instead: its HPO definition happens to contain the words "basophilic
    stippling", but Pappenheimer bodies are iron-containing siderotic granules,
    a different entity with a different cause, so that term is an inviting wrong
    answer rather than a usable approximation. An HPO term request would let
    this and lead poisoning both bind the finding precisely.

    The gap is not theoretical. The OpenScientist deep-research report for this
    disease offered HP:0011273 as "basophilic stippling of erythrocytes"; HPO
    calls that term Anisocytosis, defined as abnormally increased variability in
    erythrocyte size. The report's own term-validation section caught it. A
    missing term does not stay missing: something plausible gets bound in its
    place.
notes: >-
  Naming. The disease has accumulated an unusual number of names because it was
  described before it was understood. It first appeared as a "high ATP syndrome"
  and as "ribose phosphate pyrophosphokinase deficiency", both of which turned
  out to be wrong: the accumulated nucleotides are pyrimidines rather than
  adenine phosphates, and the kinase deficiency was an epiphenomenon. The entry
  name uses the enzyme, and the older names are recorded as synonyms so the
  historical literature is findable.

  Apostrophes. The enzyme is universally written with a prime, "pyrimidine
  5'-nucleotidase", and the MONDO label keeps it. The entry name and filename
  drop it, because an apostrophe in a KB filename has caused shell-quoting
  breakage in this repository's tooling before. The primed form is carried in
  disease_term.preferred_term, in the synonyms, and in every quoted snippet.

  Ontology gaps encountered. Basophilic stippling has no HP term and is
  discussed above. The environmental lead entry is left with no ECTO
  exposure_term for the reason recorded in its notes.

  No GeneReviews chapter exists for this disease. PubMed was searched for
  "pyrimidine 5'-nucleotidase deficiency GeneReviews[All Fields]" with no
  results. The phenotype baseline is therefore the 1974 primary description, the
  2000 twenty-five-year review, and the recent case reports.

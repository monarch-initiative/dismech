- name: Retarded Ribosomal RNA Degradation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The accumulated pyrimidine ribonucleotides feed back on the dismantling of
    ribosomal RNA, so undegraded rRNA persists in the maturing cell. This is the
    step the original authors proposed to connect the biochemical lesion to the
    morphological one, and it remains the standard account. The mechanism by
    which the cell is then destroyed is not equally well established.
  cell_types:
  - preferred_term: reticulocyte
    term:
      id: CL:0000558
      label: reticulocyte
  biological_processes:

animal_models:
- name: Bcl10-null mouse
  species: Mouse
  genotype: Bcl10 knockout
  publication: PMID:11163238
  description: >-
    The Bcl10 knockout reproduces the human immunological defect and adds one the human
    disease does not have. About a third of null embryos develop exencephaly and die;
    survivors are severely immunodeficient with lymphocytes that cannot be activated
    through the antigen receptor. No human BCL10-deficient patient has been reported with
    a neural tube defect, which is what makes this model useful and partly misleading at
    the same time.
  modeled_mechanisms:
  - target: Arrested Lymphocyte Activation and Proliferation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Null lymphocytes fail to activate on antigen-receptor stimulation, which is the
      same functional lesion measured in patients.
    limitations: >-
      A constitutive whole-animal null, so it cannot separate the lymphocyte-intrinsic
      defect from developmental effects. The subset structure also differs: mouse work
      shows the CD4+ subset is the most severely impaired, and no human study has
      resolved the defect by subset in that way.
    readouts:
    - name: Antigen-receptor-induced lymphocyte activation
      target: Arrested Lymphocyte Activation and Proliferation
      direction: DECREASED
      interpretation: >-
        Failure of activation on antigen-receptor or PMA/ionomycin stimulation, the
        cellular readout corresponding to the human proliferation block.
      evidence:
      - reference: PMID:11163238
        reference_title: "Bcl10 is a positive regulator of antigen receptor-induced activation of NF-kappaB and neural tube closure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, surviving bcl10-/- mice were severely immunodeficient and bcl10-/- lymphocytes are defective in antigen receptor or PMA/Ionomycin-induced activation."
        explanation: The measurement behind this readout, in the surviving null animals.
    evidence:
    - reference: PMID:18941215
      reference_title: "Loss of protein kinase C theta, Bcl10, or Malt1 selectively impairs proliferation and NF-kappa B activation in the CD4+ T cell subset."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our data confirm that CD4(+) T cells from PKCtheta, Bcl10, and Malt1 knockout mice show severe impairment of proliferation in response to TCR stimulation."
      explanation: >-
        Independent confirmation of the proliferation defect in the knockout, and the
        source of the subset asymmetry noted in the limitations.
diagnosis:
- name: Functional lymphocyte testing against normal lymphocyte counts
  description: >-
    The diagnostic trap. Total T and B cell counts are normal, so quantitative
    immunophenotyping reads as reassuring; the abnormality appears only in memory subset
    proportions, immunoglobulin levels, and proliferation on stimulation. One patient
    passed newborn SCID screening and presented at five months with fatal disseminated
    infection.
  presence: PRESENT
  evidence:
  - reference: PMID:38159157
    reference_title: "BCL10 Deficiency Presenting as Severe Combined Immunodeficiency Escaping Newborn Screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Newborn screening was normal including TREC (T cell receptor excision circles) based screening for SCID."
    explanation: >-
      The paper that actually reports the screening escape, cited for that claim. TREC
      screening counts recent thymic emigrants, which are preserved here, so the assay
      is blind to a defect that lies downstream in activation and memory formation.
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This gene should be studied when a patient presents with recurrent infections, hypogammaglobulinemia, and reduced numbers of B and T memory lymphocytes."
    explanation: >-
      Gives the triad that should trigger BCL10 testing, none of which is a total
      lymphocyte count.
- name: Functional validation of a candidate variant
  description: >-
    BCL10 is on current primary immunodeficiency sequencing panels, so the variant is
    now usually found before the phenotype is understood. The source is explicit that a
    candidate variant should be functionally validated, including protein expression,
    before committing a child to transplantation.
  presence: PRESENT
  evidence:
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Still, when a candidate mutation appears disease-causing, performing a functional validation, including protein expression, is crucial to ensure that it is a BCL10 deficiency and thus proceed to HSCT."
    explanation: >-
      States the functional-validation requirement and ties it to the transplant
      decision.
differential_diagnoses:
- name: CARD11 and MALT1 deficiency
  description: >-
    The other two components of the same signalosome. Complete loss of any one produces
    a combined immunodeficiency that is clinically similar, and the distinction is made
    by sequencing rather than by phenotype. The one phenotypic hint is the
    non-haematopoietic arm: the fibroblast signalling defect is a BCL10 finding.
  evidence:
  - reference: PMID:31060714
    reference_title: "Germline CBM-opathies: From immunodeficiency to atopy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Germline mutations that alter the function of members of this complex (termed CBM-opathies) cause a broad array of clinical phenotypes, ranging from profound combined immunodeficiency to B-cell lymphocytosis."
    explanation: >-
      Establishes that the CBM component deficiencies form one clinical family, which is
      what makes them each other's differential.
- name: CARD9 deficiency
  description: >-
    Also a CBM-opathy, but the opposite cell-type pattern. CARD9 is the myeloid CARD
    adaptor and its loss gives isolated invasive fungal disease; BCL10-deficient myeloid
    cells respond normally to fungal and bacterial PAMPs, and the reported fungal
    disease is mucosal candidiasis rather than invasive.
  evidence:
  - reference: PMID:34868072
    reference_title: "Clinical and Immunological Features of Human BCL10 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal recessive complete deficiencies in the two Caspase recruitment domain-containing (CARD) adaptor proteins, CARD9 (3) and CARD11 (2, 4) cause isolated invasive fungal infections (3, 5–28) and combined immunodeficiency (CID) respectively (2, 4)."
    explanation: >-
      Contrasts the CARD9 phenotype (isolated invasive fungal infection) with the
      combined immunodeficiency seen here.
discussions:
- discussion_id: imd37_fibroblast_defect_independent_contribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Fibroblast Innate Receptor Signalling
  prompt: >-
    Does the fibroblast signalling defect contribute independently to the clinical
    phenotype, or is the disease fully explained by the lymphocyte defect?
  rationale: >-
    The fibroblast finding is what the founding paper is named for, and it is
    reproducible across patients. What is missing is any observation that separates its
    contribution from the lymphocyte defect. Transplantation replaces only the
    haematopoietic compartment, so a fibroblast-attributable residual phenotype in
    successfully transplanted patients would be the natural readout, but the transplanted
    series is too small and too short for anyone to have looked. Until then the
    fibroblast-to-infection edge in this entry is INDIRECT on purpose.
- discussion_id: imd37_minor_lymphocyte_subsets_single_patient
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Failure of Memory B and T Cell Generation
  prompt: >-
    Are the reduced NK and gamma-delta T cell frequencies a general feature of BCL10
    deficiency, or a finding in one patient?
  rationale: >-
    The mass-cytometry study that reported reduced NK, gamma-delta T, regulatory T and
    follicular helper T cells is the only one to have measured NK and gamma-delta T
    subsets, so those two remain single-patient observations and are recorded here
    without a frequency.

    The regulatory T cell half of that finding is no longer in this position, and this
    entry no longer treats it as such. The 2026 report measured Tregs independently by
    conventional flow cytometry with intracellular FOXP3, Helios and CTLA-4 staining,
    found them markedly reduced, and describes reduced or absent Tregs as typical across
    the reported series. So conventional flow cytometry does resolve them and the deficit
    is corroborated. Follicular helper T cells sit between the two: the same report places
    Tfh and Tfr at the low end of the age-matched normal range, which is weaker
    corroboration than the Treg finding and not enough to support a frequency.
- discussion_id: imd37_mouse_neural_tube_defect_absent_in_humans
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Bcl10-null mouse
  - pathophysiology#CBM Signalosome Assembly Failure
  prompt: >-
    Why does Bcl10 loss cause a neural tube closure defect in mouse but not, apparently,
    in humans?
  rationale: >-
    A third of Bcl10-null mouse embryos develop exencephaly and die of it. Nothing like
    that has been described in any reported human patient, all of whom had complete or
    near-complete deficiency and survived to present with infection. Three explanations
    are open and nothing distinguishes them: BCL10 may simply have no non-redundant role
    in human neural tube closure; the human alleles may retain enough residual function
    for closure while failing for lymphocyte activation; or human embryos with the same
    defect may be lost before ascertainment, since every reported family came to
    attention through a surviving affected child. The third possibility matters for
    counselling and is unaddressed. It also bears on the fibroblast finding: a
    developmental role for BCL10 outside the haematopoietic system would fit the
    non-haematopoietic defect this entry records.
  evidence:
  - reference: PMID:11163238
    reference_title: "Bcl10 is a positive regulator of antigen receptor-induced activation of NF-kappaB and neural tube closure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that one-third of bcl10-/- embryos developed exencephaly, leading to embryonic lethality."
    explanation: >-
      The mouse finding whose human counterpart is absent, with its penetrance, which is
      what makes the ascertainment explanation worth stating.

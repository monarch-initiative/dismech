prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported as individual probands rather than as a cohort. A 2026 report counts six
    published patients; there is no registry and no population estimate. Every reported
    family has been consanguineous, so the allele frequency in outbred populations is
    unknown rather than known to be low.
  evidence:
  - reference: PMID:42473108
    reference_title: "A novel linker region truncating variant in BCL10 underlies a leaky immunodeficiency phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCL10 deficiency is an exceptionally rare autosomal recessive combined immunodeficiency, with only six patients reported to date."
    explanation: >-
      Gives the size of the published experience at the time of writing, which is what
      the CASES_IN_LITERATURE measure records.
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients are all coming from consanguineous parents (Table 1)."
    explanation: >-
      Records that ascertainment has been entirely through consanguineous families,
      which is why no outbred-population frequency can be inferred from the case count.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported allele is homozygous and every reported family consanguineous.
    Heterozygous carriers have been examined directly rather than assumed healthy:
    parental T cell proliferation and the lymphocyte subset frequencies of five
    carriers were normal, so BCL10 shows no haploinsufficiency.
  evidence:
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCL10 deficiency is an autosomal recessive trait with heterozygous carriers not showing clinical or immunological manifestations."
    explanation: >-
      States the inheritance mode and, specifically, that carriers are unaffected on
      clinical and immunological examination.
genetic:
- name: BCL10
  gene_term:
    preferred_term: BCL10
    term:
      id: hgnc:989
      label: BCL10
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    Reported alleles are a splice-site change (IVS1+1G>A), two nonsense changes (K63X,
    R88X) and two missense changes (T91P, R42H), plus a later linker-region frameshift
    (p.Gly116GlufsTer3). The first five all fall in the CARD domain, which is the
    protein-protein interaction surface that nucleates the CBM filament, so the
    genotype-phenotype story is about the assembly interface rather than about protein
    dosage.
  evidence:
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A common feature of all the mutations is that they are located in the CARD domain of the molecule (Figure 1)."
    explanation: >-
      Establishes that the disease alleles cluster in the CARD domain rather than
      being distributed across the protein.
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCL10 is a 233 amino acid intracellular signaling protein characterized by an amino-terminal CARD motif and a Ser/Thr-rich carboxyl terminus of unknown function [27,28]."
    explanation: >-
      Describes the protein's two-domain architecture, which is what makes the CARD
      clustering of disease alleles interpretable.
  - reference: PMID:25365219
    reference_title: "Inherited BCL10 deficiency impairs hematopoietic and nonhematopoietic immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient died at 3 years of age and was homozygous for a loss-of-expression, loss-of-function BCL10 mutation."
    explanation: >-
      The founding report's statement that the causal allele abolishes both expression
      and function, which is what makes this a complete deficiency.
  - reference: PMID:32008135
    reference_title: "Human BCL10 Deficiency due to Homozygosity for a Rare Allele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present study, we report a new BCL10 mutation in another child with CID who was homozygous for a BCL10 variant (R88X), previously reported as a rare allele in heterozygosis (minor allele frequency, 0.000003986)."
    explanation: >-
      Puts a population frequency on one allele, which is the only quantitative anchor
      this entry has for the ultra-rare classification. It also shows the allele was
      already catalogued in heterozygotes before anyone had seen it homozygous.
pathophysiology:
- name: Biallelic BCL10 Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: BCL10
      term:
        id: hgnc:989
        label: BCL10
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Every reported disease allele is homozygous and germline. Recorded as
      LOSS_OF_FUNCTION rather than a finer category because the measured consequence is
      absent or greatly reduced protein rather than an altered activity: the splice-site
      and nonsense alleles abolish expression outright, and the one missense allele whose
      expression was measured was greatly reduced.
  description: >-
    Homozygous loss-of-function alleles in the BCL10 CARD domain remove or destabilize
    the protein. Four of the five alleles whose protein consequence was measured gave
    absent or greatly reduced BCL10.
  downstream:
  - target: CBM Signalosome Assembly Failure
    causal_link_type: DIRECT
    description: >-
      With BCL10 absent, the CARD adaptor has nothing to nucleate and MALT1 has nothing
      to bind, so the complex cannot form.
    evidence:
    - reference: PMID:38129623
      reference_title: "Inherited Human BCL10 Deficiencies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutations are always mapped to the CARD domain of BCL10, critical for protein-protein interactions and CBM complex assembly."
      explanation: >-
        Links the location of the disease alleles to the specific step they break,
        which is the edge being asserted here rather than either node alone.
  evidence:
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All disease-causing BCL10 mutations described to date are homozygous, loss-of-function with a complete or significantly reduced protein expression (Table 1)."
    explanation: >-
      Establishes the molecular lesion as loss of the protein rather than as an altered
      or gain-of-function product.
- name: CBM Signalosome Assembly Failure
  biological_scale: MOLECULAR
  description: >-
    The CBM complex is the shared module downstream of antigen receptors and several
    innate receptors, with a cell-type-specific CARD subunit (CARD11 in lymphocytes,
    CARD9 in myeloid cells, CARD10 in epithelium, CARD14 in keratinocytes) built on a
    constant BCL10-MALT1 core. BCL10 is therefore the single point every version of the
    complex passes through.
  biological_processes:
  - preferred_term: CBM signalosome assembly
    term:
      id: GO:0065003
      label: protein-containing complex assembly
    modifier: DECREASED
  downstream:
  - target: Defective Antigen Receptor-Induced NF-kappaB Activation
    causal_link_type: DIRECT
    description: >-
      NF-kappaB induction downstream of the T and B cell receptors requires an intact
      CBM complex, so assembly failure is read out as loss of receptor-triggered
      NF-kappaB signalling.
    evidence:
    - reference: PMID:42473108
      reference_title: "A novel linker region truncating variant in BCL10 underlies a leaky immunodeficiency phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "BCL10 is a core CBM (CARD-BCL10-MALT1) complex component required for antigen receptor-mediated NF-κB activation."
      explanation: >-
        States the dependency this edge asserts: antigen-receptor NF-kappaB activation
        requires BCL10 as a CBM component.
  - target: Impaired Fibroblast Innate Receptor Signalling
    causal_link_type: DIRECT
    description: >-
      The same complex operates outside the haematopoietic system. In fibroblasts,
      TLR4, TLR2/6 and Dectin-1 signalling is BCL10-dependent.
    evidence:
    - reference: PMID:32008135
      reference_title: "Human BCL10 Deficiency due to Homozygosity for a Rare Allele."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "TLR4, TLR2/6, and Dectin-1 responses were found to depend on BCL10 in fibroblasts, and final maturation of T cell and B cell maturation into memory cells was affected."
      explanation: >-
        Establishes fibroblast innate signalling as BCL10-dependent, which is the
        non-haematopoietic branch of the chain.
  evidence:
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Caspase recruitment domain (CARD), B-cell lymphoma 10 (BCL10), and mucosa-associated lymphoid tissue lymphoma-translocation gene 1 (MALT1) proteins form the cytosolic CBM (CARD-BCL10-MALT1) complex."
    explanation: >-
      Defines the complex whose assembly fails. Graded OTHER because the sentence is
      background architecture stated in a review, not a patient observation.
  - reference: PMID:24074955
    reference_title: "Structural architecture of the CARMA1/Bcl10/MALT1 signalosome: nucleation-induced filamentous assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that the reconstituted CBM signalosome is a helical filamentous assembly in which substoichiometric CARMA1 nucleates Bcl10 filaments."
    explanation: >-
      Gives the structural reason the CARD domain is where every disease allele falls:
      BCL10 is not a stoichiometric partner but the polymerising scaffold, and the CARD
      is the filament interface.
  - reference: PMID:24074955
    reference_title: "Structural architecture of the CARMA1/Bcl10/MALT1 signalosome: nucleation-induced filamentous assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Structure-guided mutagenesis confirmed the observed interfaces in Bcl10 filament assembly and MALT1 activation in vitro and NF-κB activation in cells."
    explanation: >-
      Shows that disrupting the filament interfaces is sufficient to abolish downstream
      NF-kappaB activation, which is the experimental counterpart of the human CARD
      alleles.
- name: Defective Antigen Receptor-Induced NF-kappaB Activation
  biological_scale: CELLULAR
  description: >-
    Loss of CBM-dependent signalling downstream of the T and B cell receptors. The
    defect is stimulus dependent rather than global: TNF-alpha and LPS still induce
    p65 phosphorylation, because those routes to NF-kappaB do not run through the CBM
    complex.
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    modifier: DECREASED
  - preferred_term: B cell receptor signaling pathway
    term:
      id: GO:0050853
      label: B cell receptor signaling pathway
    modifier: DECREASED
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: DECREASED
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Arrested Lymphocyte Activation and Proliferation
    causal_link_type: DIRECT
    description: >-
      Antigen-receptor NF-kappaB signalling is what licenses the activated lymphocyte
      to proliferate, so the proliferation block follows the signalling block.
    evidence:
    - reference: PMID:38129623
      reference_title: "Inherited Human BCL10 Deficiencies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "T cell proliferation was measured in P1 and P4 and was blocked upon TCR stimulation (Table 1) [35,38]."
      explanation: >-
        Reports the proliferation failure specifically on TCR stimulation, which is the
        step downstream of the signalling defect this edge asserts.
  evidence:
  - reference: PMID:42473108
    reference_title: "A novel linker region truncating variant in BCL10 underlies a leaky immunodeficiency phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NF-κB signaling was stimulus dependent, with near-absent p-p65 induction in T cells after PMA/ionomycin but relative preservation or enhancement after TNF-α or LPS."
    explanation: >-
      Shows the defect is confined to the CBM-dependent route rather than being a
      general loss of NF-kappaB signalling, which is what the node claims.
  - reference: PMID:34868072
    reference_title: "Clinical and Immunological Features of Human BCL10 Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is located downstream of various immune receptors and it mediates NF-κB and mitogen-activated protein kinase (MAPK) activation, in a cell type-specific manner (31)."
    explanation: >-
      Places BCL10 downstream of immune receptors and names the two effector arms.
      Graded OTHER: this is the review's framing sentence, not its patient data.
- name: Arrested Lymphocyte Activation and Proliferation
  biological_scale: CELLULAR
  description: >-
    Lymphocytes reach normal numbers but cannot complete an antigen-driven response.
    Proliferation fails on TCR ligation, and the failure is dose-graded: in the leaky
    frameshift patient, anti-CD3 alone gave almost no proliferation while
    anti-CD3/CD28 costimulation partially rescued it.
  biological_processes:
  - preferred_term: T cell proliferation
    term:
      id: GO:0042098
      label: T cell proliferation
    modifier: DECREASED
  downstream:
  - target: Failure of Memory B and T Cell Generation
    causal_link_type: DIRECT
    description: >-
      Memory differentiation is the endpoint of a completed antigen-driven response, so
      an arrest at activation leaves the naive compartment intact and the memory
      compartment empty.
    evidence:
    - reference: PMID:34868072
      reference_title: "Clinical and Immunological Features of Human BCL10 Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings and previous reports of BCL10 deficient patients (29, 30) support the critical role of BCL10 in human BCR-dependent signaling and memory B cell generation."
      explanation: >-
        Connects the antigen-receptor signalling defect to the memory generation
        failure, which is the causal step this edge records.
  evidence:
  - reference: PMID:42473108
    reference_title: "A novel linker region truncating variant in BCL10 underlies a leaky immunodeficiency phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T cell proliferation was partially preserved with anti-CD3/CD28 but nearly absent with anti-CD3 alone."
    explanation: >-
      Quantifies the proliferation arrest and shows costimulation partially bypasses it,
      supporting an activation-threshold defect rather than an absolute one.
- name: Failure of Memory B and T Cell Generation
  biological_scale: CELLULAR
  description: >-
    The immunological signature of the disease. Total T and B cell counts are normal
    and the compartment is overwhelmingly naive; memory subsets are near-absent. Deeper
    phenotyping in one patient additionally found reduced NK, gamma-delta T,
    regulatory T and follicular helper T cell frequencies, so the defect is not
    confined to the classical memory subsets.
  cell_types:
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  biological_processes:
  - preferred_term: memory B cell differentiation
    term:
      id: GO:0002319
      label: memory B cell differentiation
    modifier: DECREASED
  downstream:
  - target: Hypogammaglobulinemia
    causal_link_type: DIRECT
    description: >-
      Without class-switched memory B cells and plasma cell output, circulating
      immunoglobulin falls.
    evidence:
    - reference: PMID:38129623
      reference_title: "Inherited Human BCL10 Deficiencies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This gene should be studied when a patient presents with recurrent infections, hypogammaglobulinemia, and reduced numbers of B and T memory lymphocytes."
      explanation: >-
        States that the memory deficit and the hypogammaglobulinemia co-occur as the
        recognised presentation, which is the association this edge records. The
        sentence is diagnostic guidance, so it evidences co-occurrence rather than
        proving the direction of causation.
  evidence:
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most significant immunological feature of BCL10 deficiency is that despite normal total numbers of T and B cells, their phenotype is naïve mainly with very low numbers of memory T and B cells."
    explanation: >-
      The core claim of the node: a maturation block, not a numbers defect.
  - reference: PMID:34868072
    reference_title: "Clinical and Immunological Features of Human BCL10 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We showed that in addition to the near absence of memory B and T cells previously reported, this patient displays a reduction in NK, γδT, Tregs, and TFH cells."
    explanation: >-
      Extends the cellular defect beyond memory B and T cells to NK, gamma-delta T,
      regulatory T and follicular helper T subsets, in one deeply phenotyped patient.
- name: Hypogammaglobulinemia
  biological_scale: ORGANISM
  description: >-
    Reduced circulating immunoglobulin, present in every reported patient. It is the
    laboratory abnormality that, together with the memory deficit, defines the
    recognisable pattern.
  biological_processes:
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: DECREASED
  downstream:
  - target: Susceptibility to Recurrent and Opportunistic Infection
    causal_link_type: DIRECT
    description: >-
      Loss of specific antibody, on top of the cellular defect, leaves the airway and
      gut mucosa without effective humoral defence.
    evidence:
    - reference: PMID:38129623
      reference_title: "Inherited Human BCL10 Deficiencies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical hallmark of BCL10 deficiency is mainly respiratory infections since the first months of life, dermatitis, and gastrointestinal tract infections (Table 3)."
      explanation: >-
        Names the infection pattern that follows the immunological defect, at the sites
        where humoral defence matters most.
  evidence:
  - reference: PMID:34868072
    reference_title: "Clinical and Immunological Features of Human BCL10 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No memory lymphocytes (or reduced levels) despite normal total cell numbers, hypogammaglobulinemia."
    explanation: >-
      The paper's own summary of the shared immunological phenotype, pairing the memory
      deficit with hypogammaglobulinemia against normal total counts.
- name: Impaired Fibroblast Innate Receptor Signalling
  biological_scale: CELLULAR
  description: >-
    The non-haematopoietic arm, and the finding that names the founding paper. Patient
    fibroblasts fail to produce IL-6 and IL-8 in response to TLR4, TLR2/6 and Dectin-1
    agonists, while the same patient's monocyte-derived macrophages and dendritic cells
    respond normally to those agonists. BCL10 is therefore non-redundant in fibroblasts
    and redundant in myeloid cells. This asymmetry is what separates BCL10 deficiency
    from CARD9 deficiency, where the myeloid arm is the one that fails.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: toll-like receptor 4 signaling pathway
    term:
      id: GO:0034142
      label: toll-like receptor 4 signaling pathway
    modifier: DECREASED
  - preferred_term: pattern recognition receptor signaling pathway
    term:
      id: GO:0002221
      label: pattern recognition receptor signaling pathway
    modifier: DECREASED
  - preferred_term: cytokine production
    term:
      id: GO:0001816
      label: cytokine production
    modifier: DECREASED
  downstream:
  - target: Susceptibility to Recurrent and Opportunistic Infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed rather than demonstrated. The founding report argues that the
      non-haematopoietic defect contributes to the clinical phenotype, but no study has
      separated its contribution from that of the lymphocyte defect in a patient.
    evidence:
    - reference: PMID:25365219
      reference_title: "Inherited BCL10 deficiency impairs hematopoietic and nonhematopoietic immunity."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The results of this study indicate that inherited BCL10 deficiency should be considered in patients with combined immunodeficiency with B cell, T cell, and fibroblast defects."
      explanation: >-
        Supports treating the fibroblast defect as part of the disease phenotype.
        Graded INDIRECT because the sentence is a diagnostic recommendation; it does not
        show the fibroblast defect independently causing infection.
  evidence:
  - reference: PMID:25365219
    reference_title: "Inherited BCL10 deficiency impairs hematopoietic and nonhematopoietic immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of the patient's myeloid cells with a variety of pathogen-associated molecular pattern molecules (PAMPs) elicited a normal response; however, NF-κB-mediated fibroblast functions were dramatically impaired."
    explanation: >-
      The cell-type asymmetry stated in one sentence: myeloid PAMP responses preserved,
      fibroblast NF-kappaB function lost.
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, TLR4, TLR2/6, and Dectin-1 signaling in fibroblasts were impaired."
    explanation: >-
      Names the three receptor routes that fail in fibroblasts.
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We introduced the newly reported mutation R42H in BCL10-deficient fibroblasts and showed impaired IL6 and IL8 production in response to stimulation with TLR4, TLR2/6, and Dectin agonists, while TLR3 signaling is BCL10-independent (Figure 2D and 2E)."
    explanation: >-
      Bounds the defect from the other side. TLR3 signals normally in the same
      BCL10-deficient fibroblasts, so this is a specific loss of CBM-coupled receptors
      rather than a general failure of innate signalling in the cell type.
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In terms of cellular responses, the first patient analyzed revealed normal responses to TLR1/2, TLR4, TLR2/6, and Dectin-1 agonists by monocyte-derived macrophages (MDMs) or monocyte-derived dendritic cells (MDDCs)."
    explanation: >-
      The other half of the asymmetry: the same receptors signal normally in the
      patient's myeloid cells, so the fibroblast failure is cell-type-specific rather
      than receptor-specific.
- name: Susceptibility to Recurrent and Opportunistic Infection
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: respiratory infection from the first months of life,
    dermatitis, and gastrointestinal infection, with opportunistic organisms in the
    most severe presentations. Severity varies across the reported alleles, from a
    fatal SCID-like course to a leaky phenotype with relatively mild infections.
  evidence:
  - reference: PMID:38159157
    reference_title: "BCL10 Deficiency Presenting as Severe Combined Immunodeficiency Escaping Newborn Screening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a 5-month-old male infant with complete B-cell lymphoma/leukemia 10 (BCL10) deficiency presenting with fatal severe combined immunodeficiency (SCID) characterized by systemic adenovirus infection and Pneumocystis jirovecii pneumonia."
    explanation: >-
      Documents the severe end of the range, including the two opportunistic organisms
      and the fatal outcome.
  - reference: PMID:32008135
    reference_title: "Human BCL10 Deficiency due to Homozygosity for a Rare Allele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype shared features, such as respiratory infections, but differed from that of the previous patient that he did not develop significant gastroenteritis episodes or chronic colitis."
    explanation: >-
      Shows that respiratory infection is the shared feature while gut involvement
      varies between patients with the same complete deficiency.
phenotypes:
- category: Immunologic
  name: Combined immunodeficiency
  description: >-
    Both cellular and humoral arms are affected. Presentations have ranged from a
    SCID-like course fatal in infancy to a leaky combined immunodeficiency with
    relatively mild infections.
  phenotype_term:
    preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human BCL10 deficiency causes combined immunodeficiency with bone marrow transplantation as its only curative option."
    explanation: Names the defining phenotype of the disease.
- category: Immunologic

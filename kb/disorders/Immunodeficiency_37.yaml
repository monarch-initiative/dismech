treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative option, and the reason early genetic diagnosis matters. Outcome
    depends on how much damage has accumulated: the index patient died before he could
    be transplanted, later patients were transplanted early after a fast genetic
    diagnosis, and one patient died after transplantation.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Failure of Memory B and T Cell Generation
    description: >-
      Replaces the BCL10-deficient haematopoietic compartment with donor cells that can
      assemble a CBM complex, restoring lymphocyte activation and memory generation. It
      does not address the fibroblast defect, which is not of haematopoietic origin.
    evidence:
    - reference: PMID:38129623
      reference_title: "Inherited Human BCL10 Deficiencies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In these patients, the only effective treatment is HSCT."
      explanation: >-
        States that transplantation is the only effective treatment, which is the claim
        this treatment-to-mechanism link rests on.
  evidence:
  - reference: PMID:38129623
    reference_title: "Inherited Human BCL10 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human BCL10 deficiency causes combined immunodeficiency with bone marrow transplantation as its only curative option."
    explanation: Names transplantation as the only curative option.
- name: Immunoglobulin Replacement Therapy

notes: >-
  MONDO carries a descendant of MONDO:0014491, MONDO:0979327 "combined immunodeficiency
  with low Ig due to BCL10 deficiency", which names the same disease under an
  Orphanet-style convention rather than a distinct subtype. It is deliberately not
  curated here as a has_subtypes entry: there is no second entity to describe, and
  splitting one gene's single phenotype across two records would misrepresent the
  literature.

  No GeneReviews chapter exists for BCL10 deficiency, so the phenotype baseline for this
  entry is the 2023 five-patient review (PMID:38129623) rather than a GeneReviews
  Clinical Characteristics section.

  Deep research. An openscientist report is committed alongside this entry. Its reference
  validation resolved 16 of 16 citations but flagged one quote as unsupported by the paper
  it was attributed to (PMID:30283440); nothing from that reference is used here. Its term
  validation reported seven label mismatches, all of which turned out to be table-cell text
  ("Laboratory abnormality", "Clinical sign") rather than proposed labels. The report's
  substantive contribution to this entry was two references the manual search had missed:
  the CBM filament structure (PMID:24074955), which explains why every disease allele sits
  in the CARD domain, and the Bcl10-null mouse (PMID:11163238), which carries a neural tube
  phenotype with no human counterpart. Every snippet here was taken from the cached
  reference text, not from the report.

  No datasets block. Searching BCL10 in expression repositories returns lymphoma studies,
  where BCL10 is famous for the MALT lymphoma translocations, and none of them concerns
  this disease. That is the Named Entity Confusion case the dataset-curation guidance
  warns about, so the block is omitted rather than filled with gene-symbol matches.

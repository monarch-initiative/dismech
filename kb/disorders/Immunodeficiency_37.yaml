name: Immunodeficiency 37
creation_date: "2026-09-07T17:30:00Z"
category: Mendelian
synonyms:
- IMD37
- BCL10 deficiency
- combined immunodeficiency due to BCL10 deficiency
- BCL10 primary immunodeficiency disease
- immunodeficiency type 37
description: >-
  Immunodeficiency 37 is the autosomal recessive combined immunodeficiency caused by
  biallelic loss of BCL10, the scaffold subunit of the CARD-BCL10-MALT1 (CBM)
  signalosome. The CBM complex is the module that couples an engaged antigen receptor
  to NF-kappaB, and BCL10 is the component every cell-type-specific version of it
  shares: CARD11 in lymphocytes, CARD9 in myeloid cells, CARD10 in epithelium, CARD14
  in keratinocytes all nucleate the same BCL10-MALT1 filament. Losing BCL10 therefore
  ought to disable more than losing any one CARD adaptor, and the patients show a
  specific version of that prediction.

  Two features distinguish this entry from its CBM siblings. First, the lymphocyte
  defect is a maturation block rather than a numbers defect: total T and B cell counts
  are normal, and what is missing is the memory compartment, together with
  hypogammaglobulinemia. A quantitative immune workup therefore reads as reassuring,
  and one patient passed newborn SCID screening before dying of disseminated
  adenovirus and Pneumocystis. Second, the deficiency reaches beyond the
  haematopoietic system: patient fibroblasts fail to signal through TLR4, TLR2/6 and
  Dectin-1, while the same receptors on the patient's own monocyte-derived macrophages
  and dendritic cells respond normally. BCL10 is thus non-redundant in fibroblasts and
  redundant in myeloid cells, which is the opposite of the arrangement CARD9 deficiency
  would predict and is the reason the founding report is titled around
  "nonhematopoietic immunity".

  The published experience is a handful of patients from consanguineous families, all
  with loss-of-function alleles in the CARD domain, and haematopoietic stem cell
  transplantation is the only curative option.

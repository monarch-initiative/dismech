name: Dorfman-Chanarin Disease
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Dorfman-Chanarin disease (Chanarin-Dorfman syndrome; neutral lipid storage disease with
  ichthyosis) is an autosomal recessive neutral lipid storage disorder caused by biallelic
  ABHD5 (CGI-58) variants. ABHD5 co-activates adipose triglyceride lipase (ATGL/PNPLA2) for
  intracellular triacylglycerol hydrolysis; its loss causes cytoplasmic accumulation of
  triacylglycerol droplets in most tissues, with nonbullous congenital ichthyosiform
  erythroderma, hepatic steatosis, myopathy, cataracts, sensorineural hearing loss, and the
  pathognomonic Jordans' anomaly (lipid vacuoles in circulating leukocytes).
synonyms:
- Chanarin-Dorfman syndrome
- neutral lipid storage disease with ichthyosis
- NLSDI
- triglyceride storage disease with ichthyosis
category: Mendelian
disease_term:
  preferred_term: Dorfman-Chanarin disease
  term:
    id: MONDO:0010155
    label: Dorfman-Chanarin disease
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0010155
      label: Dorfman-Chanarin disease
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
parents:
- Neutral Lipid Storage Disease
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of intracellular triacylglycerol lipolysis: ABHD5/CGI-58
      is the co-activator of adipose triglyceride lipase (ATGL/PNPLA2).
  - classification_value: DERMATOLOGY
    notes: >-
      Nonbullous congenital ichthyosiform erythroderma is the presenting and
      defining feature of the ichthyosis form of neutral lipid storage disease.
  icimd_category:
  - classification_value: glycerolipid_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      glycerolipid metabolism" under category "Disorders of lipid metabolism".
      The lesion is in triacylglycerol (a glycerolipid) hydrolysis. Despite the
      "neutral lipid storage" name this is a cytoplasmic lipid-droplet
      disorder, not a lysosomal hydrolase deficiency, so no
      lysosomal_storage_category is assigned.

differential_diagnoses:
- name: Historical Triglyceride Storage Disease Type 1
  description: >-
    The historical type 1 adipose-lipolysis phenotype (MONDO:0008601; OMIM:190420)
    was described in malnourished children with peripheral adipose triglyceride
    deposits and a blunted adipose cyclic-AMP response, without a known gene. It
    shares a MONDO label with "triglyceride storage disease" but is not
    ABHD5-related neutral lipid storage disease with ichthyosis.
  disease_term:
    preferred_term: triglyceride storage disease, type 1
    term:
      id: MONDO:0008601
      label: triglyceride storage disease, type 1
  evidence:
  - reference: PMID:187005
    reference_title: "Triglyceride storage disease. A report of two affected children associated with neurological abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "no response in tissue levels of cyclic AMP when stimulated by isoprenaline"
    explanation: The historical type 1 phenotype is defined by an adipose signalling assay, not by ABHD5 variants or leukocyte lipid vacuoles.

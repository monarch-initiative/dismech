    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chanarin-Dorfman syndrome (CDS) is a rare medical condition that is inherited in an autosomal recessive pattern"
    explanation: CDS is inherited in an autosomal recessive manner.
pathophysiology:
- name: ABHD5/CGI-58 Deficiency and Loss of ATGL Co-activation
  description: >-
    Biallelic ABHD5 (CGI-58) variants eliminate the co-activator of adipose triglyceride
    lipase (ATGL/PNPLA2). ABHD5 itself lacks hydrolase activity but is required to activate
    PNPLA-family triacylglycerol lipolysis.
  gene:
    preferred_term: ABHD5
    term:
      id: hgnc:21396
      label: ABHD5
  molecular_functions:
  - preferred_term: ATGL/PNPLA-family lipase co-activator activity
    term:
      id: GO:0060229
      label: lipase activator activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: positive regulation of triglyceride catabolic process
    term:
      id: GO:0010898
      label: positive regulation of triglyceride catabolic process
    modifier: DECREASED
  - preferred_term: triglyceride catabolic process
    term:
      id: GO:0019433
      label: triglyceride catabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: lipid droplet
    term:
      id: GO:0005811
      label: lipid droplet
  evidence:
  - reference: PMID:36355098
    reference_title: "ABHD5-A Regulator of Lipid Metabolism Essential for Diverse Cellular Functions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it functions as a co-activating enzyme of\nthe patatin-like phospholipase domain-containing (PNPLA) protein family that is\ninvolved in triacylglycerol"
    explanation: ABHD5 co-activates PNPLA-family lipases (ATGL) for triacylglycerol hydrolysis; its loss blocks lipolysis.
  downstream:
  - target: Cytoplasmic Triacylglycerol Droplet Accumulation
    description: Loss of ATGL co-activation prevents triacylglycerol hydrolysis, so TG droplets accumulate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20023287
      reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "systemic TG accumulation and severe hepatic steatosis in newborn Cgi-58(-/-) mice establish a limiting role for CGI-58 in ATGL-mediated TG hydrolysis"
      explanation: >-
        The CGI-58 knockout mouse shows that loss of the co-activator limits
        ATGL-mediated hydrolysis and produces systemic TG accumulation.
  - target: Epidermal Lipid-Barrier Defect
    description: In parallel (ATGL-independently), loss of the ABHD5 epidermal lipid role impairs the skin barrier.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20023287
      reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a severe skin permeability barrier defect uncovers an essential ATGL-independent role of CGI-58 in skin lipid metabolism."
      explanation: >-
        Establishes the ATGL-independent arm: CGI-58 loss impairs skin lipid
        metabolism directly rather than through the systemic lipolysis defect.
- name: Cytoplasmic Triacylglycerol Droplet Accumulation
  description: >-
    Undegraded triacylglycerol accumulates as cytoplasmic lipid droplets in most tissues,
    including skin, liver, muscle, leukocytes, eye, and CNS, driving the multisystem disease.
  biological_processes:
  - preferred_term: lipid storage
    term:
      id: GO:0019915
      label: lipid storage
    modifier: INCREASED
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:21122093
    reference_title: "Clinical and genetic characterization of Chanarin-Dorfman syndrome patients: first report of large deletions in the ABHD5 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an intracellular accumulation of triacylglycerol (TG) droplets in most tissues"
    explanation: Intracellular triacylglycerol droplet accumulation in most tissues is the defining lesion of CDS.
  downstream:
  - target: Ichthyosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hepatic steatosis and hepatomegaly
    causal_link_type: DIRECT
  - target: Myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural hearing loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hepatomegaly
    causal_link_type: DIRECT
  - target: Splenomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hepatic failure
    description: Progressive hepatic lipid storage can culminate in hepatic failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - hepatocyte lipid droplet accumulation
    - hepatic steatosis
    evidence:
    - reference: PMID:28499397
      reference_title: "Neutral Lipid Storage Diseases: clinical/genetic features and natural history in a large cohort of Italian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two patients (9.5%, both with NLSD-I) died of hepatic failure"
      explanation: >-
        Hepatic failure as a cause of death in NLSD-I supports the
        steatosis-to-failure endpoint of the hepatic branch.
- name: Epidermal Lipid-Barrier Defect
  description: >-
    ABHD5/CGI-58 has an ATGL-independent role in epidermal lipid metabolism (acylceramide
    synthesis); its loss impairs the skin permeability barrier, underlying the ichthyosis
    that defines the ichthyosis form of neutral lipid storage disease.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:20023287
    reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "severe skin permeability barrier defect\nuncovers an essential ATGL-independent role of CGI-58 in skin lipid metabolism"
    explanation: CGI-58/ABHD5 has an ATGL-independent epidermal lipid-metabolism role whose loss causes the skin-barrier defect.
  downstream:
  - target: Ichthyosis
    description: The ABHD5-dependent epidermal lipid-barrier defect produces the nonbullous congenital ichthyosis phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20023287
      reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "sequestration of fatty acids in TG prevents the synthesis of acylceramides, which are essential lipid precursors for the formation of a functional skin permeability barrier. This mechanism may also underlie the pathogenesis of ichthyosis in neutral lipid storage disease patients lacking functional CGI-58."
      explanation: >-
        Gives the acylceramide-precursor mechanism connecting the barrier defect to
        ichthyosis. The authors hedge ("may also underlie"): the mechanism is
        demonstrated in mouse and proposed, not proven, for human patients.

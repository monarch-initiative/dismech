  - reference: PMID:41437099
    reference_title: "Clinical and genetic characterization of congenital disorders of glycosylation in 20 Chinese patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, variants in COG5, COG6, MOGS, DPM3, ALG1, ALG3, ALG11, SSR4 and SLC35A2 each were observed in single case."
    explanation: >-
      The 2025 Chinese CDG cohort adds a contemporary ALG1 case, while the

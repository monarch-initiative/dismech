prevalence:
- population: European ancestry in gnomAD v2.1.1
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ULTRA_RARE
  notes: >-
    Direct observed prevalence is not established. This is an
    allele-frequency-based birth-prevalence estimate rather than measured point prevalence.
    Within the study's all-person and European-ancestry aggregates, only
    PMM2-CDG exceeded one in 100,000; ancestry-specific ALG1 rates are not
    asserted here because they are not recoverable from the cached article text.
  evidence:
  - reference: PMID:34447415
    reference_title: "The Estimated Prevalence of N-Linked Congenital Disorders of Glycosylation Across Various Populations Based on Allele Frequencies in General Population Databases."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Among assessed 27 autosomal recessive N-glycosylation disorders, the only disease with estimated birth prevalence higher than one in 100,000 was PMM2-CDG (in both, all gnomAD individuals and those with European ancestry)."
    explanation: >-
      The computational study establishes the measure as estimated birth
      prevalence and supports an ultrarare, below-one-in-100,000 band for ALG1-CDG;
      it does not measure observed point prevalence.
progression:
- phase: Prenatal-to-infantile multisystem spectrum
  notes: >-
    Severity ranges from milder intellectual disability to lethal neonatal or
    early-infantile multisystem disease; premature death is frequent, especially
    in the first year of life and in specific genotypes.
  evidence:
  - reference: PMID:26931382
    reference_title: "ALG1-CDG: Clinical and Molecular Characterization of 39 Unreported Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Premature death occurred in 17/39 (44%) cases"
    explanation: >-
      The cohort documents high premature mortality, marking the severe end of
      the ALG1-CDG spectrum.
  - reference: PMID:14973782
    reference_title: "Congenital disorder of glycosylation type Ik (CDG-Ik): a defect of mannosyltransferase I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in semiconserved regions in the corresponding gene, HMT-1 (yeast homologue, Alg1), in two patients caused drastically reduced enzyme activity, leading to a severe disease with death in early infancy."
    explanation: >-
      The original CDG-Ik description links ALG1 loss of function to severe
      disease with death in early infancy.
  - reference: PMID:35221878
    reference_title: "ALG1-CDG: A Patient with a Mild Phenotype and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here present a patient with a mild phenotype of ALG1-CDG."
    explanation: >-
      A molecularly diagnosed patient with a mild phenotype confirms the less
      severe end of the progression spectrum.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_alg1_cdg_model
  hypothesis_label: Canonical ALG1-CDG Precursor Assembly and Protein Hypoglycosylation Model
  status: CANONICAL
  description: >-
    Biallelic ALG1 loss of function reduces ER beta-1,4-mannosyltransferase
    activity, blocking transfer of the first mannose onto
    dolichol-pyrophosphate-GlcNAc2. GlcNAc2-PP-dolichol and GlcNAc1-PP-dolichol
    precursors accumulate, full-sized dolichol-linked oligosaccharide synthesis
    is impaired, and truncated glycans are transferred to nascent proteins,
    producing under-occupied N-glycosylation sites and a type I transferrin
    pattern.
  evidence:
  - reference: PMID:14973778
    reference_title: "Deficiency of GDP-Man:GlcNAc2-PP-dolichol mannosyltransferase causes congenital disorder of glycosylation type Ik."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "indicated a severely reduced activity of the beta 1,4-mannosyltransferase, elongating GlcNAc(2)-PP-dolichol to Man(1)GlcNAc(2)-PP-dolichol at the cytosolic side of the endoplasmic reticulum."
    explanation: >-
      Patient-derived biochemistry directly demonstrates the reduced
      beta-1,4-mannosyltransferase activity that defines the canonical model.
  - reference: PMID:26931382
    reference_title: "ALG1-CDG: Clinical and Molecular Characterization of 39 Unreported Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An inability to efficiently synthesize or transfer full-sized DLO results in under-occupied glycosylation sites"
    explanation: >-
      The cohort describes the downstream consequence of impaired lipid-linked
      oligosaccharide assembly: under-occupied N-glycosylation sites.
- hypothesis_group_id: alg1_cdg_clinical_convergence_model
  hypothesis_label: Emerging ALG1-CDG Clinical Convergence Model
  status: EMERGING
  description: >-
    Protein hypoglycosylation is associated with neurological and multisystem
    manifestations through unresolved glycoprotein-, cell-, and tissue-specific
    intermediates. This group separates those clinical convergence bridges from
    the canonical precursor-assembly chain.
  evidence:
  - reference: PMID:26931382
    reference_title: "ALG1-CDG: Clinical and Molecular Characterization of 39 Unreported Patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We also report a substantial number of patients with dysmorphic facial features 24/39 (62%), hematological defects 18/34 (53%), gastrointestinal problems 20/38 (53%), skeletal abnormalities 13/39 (33%) and hypoalbuminemia 12/39 (31%)"
    explanation: >-
      The cohort supports clinical convergence but does not resolve the causal
      intermediates from hypoglycosylation to individual manifestations.
- hypothesis_group_id: alg1_cdg_fibroblast_stress_model
  hypothesis_label: Emerging ALG1-CDG Fibroblast Glycoproteome and Stress Model
  status: EMERGING
  description: >-
    Patient fibroblasts show broad glycoproteome disruption together with
    mitochondrial-protein loss and increased autophagy-related proteins. The
    relevance of this cellular signature to neural tissue remains provisional.
  evidence:
  - reference: PMID:38470198
    reference_title: "Dysregulated proteome and N-glycoproteome in ALG1-deficient fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally, we observed a decrease in the expression of mitochondrial proteins and an increase in autophagy-related proteins, suggesting mitochondrial and cellular stress."
    explanation: >-
      Patient-cell proteomics directly supports the emerging cellular-stress
      signature without establishing tissue-level clinical causality.

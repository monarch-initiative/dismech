biochemical:
- name: ALG1-associated xeno-tetrasaccharide NeuAc-Gal-GlcNAc2
  presence: INCREASED
  context: >-
    A short mannose-deprived N-glycan detected on serum transferrin and other
    serum or fibroblast glycoproteins; useful as a diagnostic readout but not
    absolutely required for diagnosis.
  readouts:
  - target: Protein hypoglycosylation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Detection reports transfer and Golgi processing of short ALG1-associated
      N-glycans downstream of incomplete lipid-linked oligosaccharide assembly.
    evidence:
    - reference: PMID:26335155
      reference_title: "Serum transferrin carrying the xeno-tetrasaccharide NeuAc-Gal-GlcNAc2 is a biomarker of ALG1-CDG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This is the first time analysis of serum TF can suggest a specific CDG type I subtype and we suggest this tetrasaccharide be used in the clinic to guide the ALG1-CDG diagnostic process."
      explanation: >-
        The original biomarker study supports its diagnostic readout role for
        ALG1-CDG while describing guidance rather than a standalone diagnosis.
  evidence:
  - reference: PMID:26335155
    reference_title: "Serum transferrin carrying the xeno-tetrasaccharide NeuAc-Gal-GlcNAc2 is a biomarker of ALG1-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show mass spectrometric data combined with data from enzymatic digestions that suggest the presence of a tetrasaccharide consisting of two N-acetylglucosamines, one galactose, and one sialic acid, appearing on serum TF, is a biomarker of this particular CDG subtype."
    explanation: >-
      Directly identifies the serum-transferrin glycan composition and its
      disease-associated biomarker interpretation.
genetic:
- name: ALG1
  association: Biallelic loss-of-function or hypomorphic variants
  features: >-
    ALG1-CDG shows broad allelic heterogeneity, including missense and
    splice-altering alleles that reduce functional ALG1 activity. The recurrent
    c.773C>T (p.Ser258Leu) allele was the most frequently observed in the major
    cohort; all six cohort patients homozygous for it died before six months.
    Complex intronic alleles can be pathogenic through non-functional
    alternative splicing, so coding-only interpretation can miss relevant
    mechanisms.
  gene_term:
    preferred_term: ALG1
    term:
      id: hgnc:18294
      label: ALG1
  evidence:
  - reference: PMID:26931382
    reference_title: "ALG1-CDG: Clinical and Molecular Characterization of 39 Unreported Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently observed mutation, in both the homozygous and compound heterozygous state (17/39, 44%) (Table 1) was c.773C>T, which encodes a known pathogenic mutation p.Ser258Leu"
    explanation: >-
      The recurrent c.773C>T (p.Ser258Leu) allele was the most frequently
      observed ALG1 variant in the cohort.
  - reference: PMID:26931382
    reference_title: "ALG1-CDG: Clinical and Molecular Characterization of 39 Unreported Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All six individuals homozygous for the p.Ser258Leu mutation died within the first five months of life."
    explanation: >-
      Directly supports the severe early-lethal genotype association without
      extrapolating it to compound heterozygotes.
  - reference: PMID:34567092
    reference_title: "ALG1-CDG Caused by Non-functional Alternative Splicing Involving a Novel Pathogenic Complex Allele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the other carried a new uncharacterized variant (c.208 + 25G > T) causing non-functional alternative splicing that, in conjunction with the benign variant, defines the pathogenic protein effect (p.N70S_S71ins9)."
    explanation: >-
      The molecular case study demonstrates a pathogenic complex allele acting
      through abnormal splicing.
  - reference: PMID:37204045
    reference_title: "A novel variant in ALG1 gene associated with congenital disorder of glycosylation: A case report and short literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical exome sequencing revealed the biallelic compound heterozygosity variants, a previously reported variant c.434G>A (p.G145N, paternal) and a novel variant c.314T>A (p.V105N, maternal)."
    explanation: >-
      A 2023 case expands the allelic series with a novel missense variant in

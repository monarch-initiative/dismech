  downstream:
  - target: Protein hypoglycosylation
    description: >-
      Oligosaccharyltransferase-mediated transfer of incomplete precursors,
      together with under-occupied glycosylation sites, produces proteins bearing
      truncated N-glycans and a type I transferrin pattern.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Transfer of incomplete lipid-linked oligosaccharides to nascent proteins and site under-occupancy.
    hypothesis_groups:
    - canonical_alg1_cdg_model
    evidence:
    - reference: PMID:14973778
      reference_title: "Deficiency of GDP-Man:GlcNAc2-PP-dolichol mannosyltransferase causes congenital disorder of glycosylation type Ik."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In patient-derived serum, the total amount of the glycoprotein transferrin was reduced. Moreover, a partial loss of N-glycan chains was observed, a characteristic feature of CDG type I forms."
      explanation: >-
        The patient transferrin result links the precursor lesion to protein
        hypoglycosylation with a type I pattern.
- name: Protein hypoglycosylation
  description: >-
    Transfer of incomplete ALG1-associated oligosaccharides and site
    under-occupancy produce hypoglycosylated glycoproteins, detectable as a type
    I serum transferrin pattern and, more specifically, as the ALG1-associated
    xeno-tetrasaccharide NeuAc-Gal-GlcNAc2.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  evidence:
  - reference: PMID:26931382
    reference_title: "ALG1-CDG: Clinical and Molecular Characterization of 39 Unreported Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "twenty-seven were tested and all had this novel tetrasaccharide present on either serum or fibroblast glycoproteins"
    explanation: >-
      The ALG1-associated xeno-tetrasaccharide, a direct readout of aberrant
      N-glycosylation, was present in all tested patients.
  downstream:
  - target: Multisystem glycoprotein dysfunction
    description: >-
      Widespread abnormal N-glycosylation is associated with neurologic,
      ocular, hepatic, hematologic, gastrointestinal, renal, skeletal, and
      immune manifestations, while the specific client proteins driving each
      remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - canonical_alg1_cdg_model
    evidence:
    - reference: PMID:26931382
      reference_title: "ALG1-CDG: Clinical and Molecular Characterization of 39 Unreported Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients had variable degree of neurodevelopmental deficiencies including developmental delay 37/37 (100%), hypotonia 37/39 (95%), seizures /epilepsy 36/38 (95%), microcephaly 27/37 (73%), abnormal brain imaging 25/37 (68%) which consisted primarily of cerebral or cerebellar atrophy 11/25 (44%) and for those who could be evaluated, intellectual disability 21/22 (95%)"
      explanation: >-
        The multisystem, predominantly neurologic phenotype is the clinical
        expression of widespread glycoprotein dysfunction.

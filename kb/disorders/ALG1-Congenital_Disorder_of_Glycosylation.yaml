name: ALG1-congenital disorder of glycosylation
creation_date: "2026-07-24T18:00:00Z"
updated_date: "2026-07-24T18:00:00Z"
description: >-
  ALG1-congenital disorder of glycosylation (ALG1-CDG, formerly CDG type Ik) is
  a rare autosomal recessive disorder of protein N-linked glycosylation caused
  by biallelic loss-of-function variants in ALG1. ALG1 encodes the endoplasmic
  reticulum beta-1,4-mannosyltransferase that adds the first mannose to
  dolichol-pyrophosphate-linked GlcNAc2, an early committed step of lipid-linked
  oligosaccharide assembly. Deficiency produces a type I congenital disorder of
  glycosylation with severe early-infantile epileptic encephalopathy, profound
  developmental delay, hypotonia, microcephaly, failure to thrive, hepatomegaly,
  coagulopathy, immunodeficiency, and frequently early death.
category: Mendelian
disease_term:
  preferred_term: ALG1-congenital disorder of glycosylation
  term:
    id: MONDO:0012052
    label: ALG1-congenital disorder of glycosylation
parents:
- congenital disorder of glycosylation type I
- disorder of protein N-glycosylation
synonyms:
- ALG1-CDG
- CDG-Ik
- congenital disorder of glycosylation type Ik
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    ALG1-CDG is inherited in an autosomal recessive manner, with affected
    individuals carrying biallelic ALG1 variants.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_alg1_cdg_model
  hypothesis_label: Canonical ALG1-CDG Precursor Assembly and Protein Hypoglycosylation Model
  status: CANONICAL
  description: >-
    Biallelic ALG1 loss of function reduces ER beta-1,4-mannosyltransferase
    activity, blocking transfer of the first mannose onto
    dolichol-pyrophosphate-GlcNAc2. Truncated lipid-linked oligosaccharide
    precursors are transferred to nascent proteins, producing protein
    hypoglycosylation, a type I transferrin pattern, and multisystem disease.
pathophysiology:
- name: ALG1 beta-1,4-mannosyltransferase deficiency
  description: >-
    Pathogenic ALG1 variants impair the ER beta-1,4-mannosyltransferase that
    adds the first mannose to dolichol-pyrophosphate-GlcNAc2 during lipid-linked
    oligosaccharide assembly.
  genes:
  - preferred_term: ALG1
    term:
      id: hgnc:18294
      label: ALG1
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
  molecular_functions:
  - preferred_term: mannosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0000030
      label: mannosyltransferase activity
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  downstream:
  - target: Protein hypoglycosylation
    description: >-
      Transfer of incomplete lipid-linked oligosaccharides to proteins produces
      truncated N-glycans and a type I hypoglycosylation pattern.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Accumulation and transfer of truncated dolichol-linked oligosaccharides.
    hypothesis_groups:
    - canonical_alg1_cdg_model
- name: Protein hypoglycosylation
  description: >-
    Transfer of incomplete ALG1-associated oligosaccharides produces proteins
    bearing truncated N-glycans, detectable as a type I serum transferrin
    isoelectric focusing pattern.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  downstream:
  - target: Multisystem glycoprotein dysfunction
    description: >-
      Widespread abnormal N-glycosylation is associated with neurologic,
      hepatic, hematologic, immune, and other multisystem manifestations.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - canonical_alg1_cdg_model

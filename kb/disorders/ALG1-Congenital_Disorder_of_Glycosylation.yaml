  - reference: PMID:14973778
    reference_title: "Deficiency of GDP-Man:GlcNAc2-PP-dolichol mannosyltransferase causes congenital disorder of glycosylation type Ik."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of the patient's hALG1 gene identified a homozygous mutation leading to the exchange of a serine residue to leucine at position 258 in the hALG1 protein."
    explanation: >-
      The original biochemical report identified the recurrent homozygous
      p.Ser258Leu ALG1 variant.
diagnosis:
- name: Serum transferrin glycoform analysis
  description: >-
    A type I carbohydrate-deficient transferrin pattern is the usual biochemical
    screening clue and is not gene-specific. A normal result does not exclude
    ALG1-CDG, including severe disease, so molecular and orthogonal glycomic
    testing remain necessary when suspicion is high.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Usually a type I CDG pattern requiring etiologic follow-up; rarely normal.
  evidence:
  - reference: PMID:14973778
    reference_title: "Deficiency of GDP-Man:GlcNAc2-PP-dolichol mannosyltransferase causes congenital disorder of glycosylation type Ik."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patient-derived serum, the total amount of the glycoprotein transferrin was reduced. Moreover, a partial loss of N-glycan chains was observed, a characteristic feature of CDG type I forms."
    explanation: >-
      The type I transferrin pattern is the biochemical screening result; it is
      not ALG1-specific.
  - reference: PMID:38736633
    reference_title: "Normal transferrin glycosylation does not rule out severe ALG1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite her severe clinical manifestations and genetic diagnosis, serum transferrin glycoform analysis was normal."
    explanation: >-
      A molecularly diagnosed severe case directly demonstrates that a normal
      transferrin glycoform result cannot exclude ALG1-CDG.
- name: ALG1 molecular genetic testing
  description: >-
    Definitive diagnosis requires identification of biallelic pathogenic ALG1
    variants. Testing is warranted in unsolved type I CDG with compatible
    features and also when glycan screening is normal but the phenotype and
    genomic findings remain compelling.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic pathogenic or likely pathogenic ALG1 variants confirm the diagnosis.
  evidence:
  - reference: PMID:22966035
    reference_title: "Defining the phenotype in congenital disorder of glycosylation due to ALG1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest testing for ALG1 mutations in unsolved CDG patients with a type 1 transferrin isoelectric focusing pattern, especially with epilepsy, severe visual loss and hemorrhagic/thrombotic events."
    explanation: >-
      The phenotype series recommends ALG1 testing in unsolved type I CDG with
      compatible clinical features.
  - reference: PMID:38736633
    reference_title: "Normal transferrin glycosylation does not rule out severe ALG1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALG1-CDG was suggested based on exome sequencing and Western blot analysis."
    explanation: >-
      The severe normal-transferrin case illustrates why molecular testing and
      orthogonal protein/glycan assays must be integrated.
- name: Mass-spectrometric ALG1-associated glycan profiling
  description: >-
    Mass spectrometry can detect the ALG1-associated NeuAc-Gal-GlcNAc2
    xeno-tetrasaccharide and a fucosylated N-pentasaccharide signature. These
    markers support subtype prioritization but do not replace biallelic variant
    interpretation, and the tetrasaccharide can also occur in PMM2- and MPI-CDG.
  diagnosis_term:
    preferred_term: mass-spectrometric glycan profiling
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: ALG1-associated short N-glycan signatures on serum, plasma, or fibroblast glycoproteins.
  evidence:
  - reference: PMID:26335155
    reference_title: "Serum transferrin carrying the xeno-tetrasaccharide NeuAc-Gal-GlcNAc2 is a biomarker of ALG1-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest this tetrasaccharide be used in the clinic to guide the ALG1-CDG diagnostic process."
    explanation: >-
      The original study supports the tetrasaccharide as a guide to subtype
      selection, not a standalone molecular confirmation.
  - reference: PMID:35279850
    reference_title: "Synergistic use of glycomics and single-molecule molecular inversion probes for identification of congenital disorders of glycosylation type-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glycomics profiling in patients with known defects revealed novel features such as the N-tetrasaccharide in ALG2-CDG patients and a novel fucosylated N-pentasaccharide as specific glycomarker for ALG1-CDG."
    explanation: >-
      A 111-patient CDG-I glycomics cohort identifies an additional
      ALG1-specific fucosylated pentasaccharide signature.
treatments:
- name: Supportive and complication-directed management
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  description: >-
    No approved ALG1-specific disease-modifying therapy exists. Management is
    multidisciplinary and complication-directed, including antiseizure therapy,
    nutritional and feeding support, and surveillance/treatment of hepatic,
    renal, hematologic, ophthalmologic, and skeletal complications. Substrate
    therapies effective in some other CDGs (e.g., mannose in MPI-CDG) are not
    established for ALG1-CDG.
  review_notes: >-
    No ALG1-specific management guideline or therapeutic clinical trial was
    located through 2026-08-04. The examples summarize complication-directed
    practice and are not claims of disease-modifying efficacy.
  evidence:
  - reference: PMID:42220679
    reference_title: "Resistant Epilepsy and Developmental Delay in a Syndromic Infant: A Case of Congenital Disorder of Glycosylation Type Ik From India."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive therapies, including physiotherapy, developmental stimulation, and nutritional management, were initiated in view of global developmental delay and hypotonia."
    explanation: >-
      A recent molecularly confirmed case documents representative supportive
      interventions, but a single case does not establish comparative efficacy
      or a comprehensive management guideline.
- name: D-mannose supplementation in patient fibroblasts
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: experimental substrate supplementation
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: D-mannose
      term:
        id: CHEBI:16024
        label: D-mannose
  description: >-
    D-mannose reduced the ALG1-associated N-tetrasaccharide and increased
    larger N-glycans in one responsive patient-derived fibroblast line. Other
    ALG1 mutant lines, including homozygous p.Ser258Leu cells, did not respond,
    the effective in-vitro concentration may not be achievable in vivo, and no
    human ALG1-CDG efficacy is established; this is not a clinical
    recommendation.
  target_mechanisms:
  - target: Protein hypoglycosylation
    treatment_effect: RESTORES
    evidence:
    - reference: PMID:26430078
      reference_title: "A Novel N-Tetrasaccharide in Patients with Congenital Disorders of Glycosylation, Including Asparagine-Linked Glycosylation Protein 1, Phosphomannomutase 2, and Mannose Phosphate Isomerase Deficiencies."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "After 16 h, there was an 86% reduction of N-tetrasaccharide in ALG1-CDG cells, along with increased amounts of high-mannose and sialylated N-glycans"
      explanation: >-
        Biochemical normalization in one patient fibroblast line partially
        supports restoration of glycosylation, without proving organism-level
        benefit.
  evidence:
  - reference: PMID:26430078
    reference_title: "A Novel N-Tetrasaccharide in Patients with Congenital Disorders of Glycosylation, Including Asparagine-Linked Glycosylation Protein 1, Phosphomannomutase 2, and Mannose Phosphate Isomerase Deficiencies."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "After 16 h, there was an 86% reduction of N-tetrasaccharide in ALG1-CDG cells, along with increased amounts of high-mannose and sialylated N-glycans"
    explanation: >-
      A patient-derived fibroblast line showed biochemical rescue, but this
      preclinical result does not establish clinical efficacy or generalize to
      all ALG1 genotypes.
  - reference: PMID:26430078
    reference_title: "A Novel N-Tetrasaccharide in Patients with Congenital Disorders of Glycosylation, Including Asparagine-Linked Glycosylation Protein 1, Phosphomannomutase 2, and Mannose Phosphate Isomerase Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The applicability of mannose treatment for patients with ALG1-CDG remains unknown because not all the ALG1-CDG mutant cell lines respond to mannose supplementation."
    explanation: >-
      The authors explicitly limit the translational scope and document
      genotype-dependent nonresponse.
discussions:
- discussion_id: gap_alg1_cdg_translational_therapy
  prompt: >-
    Can ALG1-specific glycan rescue or shared CDG autophagy and mitochondrial
    signatures be translated into a safe disease-modifying therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#D-mannose supplementation in patient fibroblasts
  - pathophysiology#Mitochondrial and autophagic stress
  rationale: >-
    Mannose rescue is limited to selected patient fibroblasts and has no human
    efficacy evidence. A 2025 multi-omics study nominated shared CDG drug
    candidates computationally, but explicitly requires future in-vitro
    validation and does not establish ALG1-specific benefit.
  proposed_experiments:
  - experiment_id: exp_alg1_genotype_stratified_therapy_screen
    name: Genotype-stratified ALG1 patient-cell rescue study
    description: >-
      Test mannose and independently prioritized multi-omics candidates across
      ALG1 patient-derived neural and hepatic cell models representing severe
      and mild alleles, with glycoproteomic, mitochondrial, autophagic, and
      toxicity endpoints before any clinical translation.
    evidence:
    - reference: PMID:40743674
      reference_title: "Predicting disease-overarching therapeutic approaches for congenital disorders of glycosylation using multi-OMICS."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Several candidate drugs targeting these shared abnormalities emerged from integrative analysis and warrant validation in future in vitro studies."
      explanation: >-
        The stated need for experimental validation motivates a
        genotype-stratified patient-cell study.
  evidence:
  - reference: PMID:40743674
    reference_title: "Predicting disease-overarching therapeutic approaches for congenital disorders of glycosylation using multi-OMICS."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Several candidate drugs targeting these shared abnormalities emerged from integrative analysis and warrant validation in future in vitro studies."
    explanation: >-
      The multi-omics analysis supplies candidate hypotheses while explicitly
      documenting that experimental validation remains outstanding.
  posed_date: "2026-08-04T00:00:00Z"

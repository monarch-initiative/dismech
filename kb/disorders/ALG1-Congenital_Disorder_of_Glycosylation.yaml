name: ALG1-congenital disorder of glycosylation
creation_date: "2026-07-24T18:00:00Z"
description: >-
  ALG1-congenital disorder of glycosylation (ALG1-CDG, formerly CDG type Ik) is
  a rare autosomal recessive disorder of protein N-linked glycosylation caused
  by biallelic pathogenic variants in ALG1. ALG1 encodes the endoplasmic
  reticulum beta-1,4-mannosyltransferase that adds the first of nine mannose
  residues to the dolichol-pyrophosphate-linked GlcNAc2 precursor, an early
  committed step of lipid-linked oligosaccharide assembly. Deficiency yields
  incomplete lipid-linked oligosaccharides, under-occupied N-glycosylation
  sites, and a type I congenital disorder of glycosylation with a spectrum that
  ranges from milder intellectual disability to lethal neonatal/infantile
  multisystem disease, dominated by developmental delay, epilepsy, hypotonia,
  microcephaly, and frequent premature death.

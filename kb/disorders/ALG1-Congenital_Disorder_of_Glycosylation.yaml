      beta-1,4-mannosyltransferase catalysing the first mannosylation step.
  downstream:
  - target: Truncated lipid-linked oligosaccharide accumulation
    description: >-
      Reduced ALG1 activity causes accumulation of incomplete
      dolichol-pyrophosphate-linked GlcNAc2 (and GlcNAc1) precursors before
      mannosylation.
    causal_link_type: DIRECT
    hypothesis_groups:
    - canonical_alg1_cdg_model
    evidence:
    - reference: PMID:14973778
      reference_title: "Deficiency of GDP-Man:GlcNAc2-PP-dolichol mannosyltransferase causes congenital disorder of glycosylation type Ik."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "an accumulation of GlcNAc(2)-PP-dolichol and GlcNAc(1)-PP-dolichol in skin fibroblasts of the patient."
      explanation: >-
        Patient fibroblast labelling directly demonstrates accumulation of the
        truncated precursors upstream of the ALG1 block.
- name: Truncated lipid-linked oligosaccharide accumulation
  description: >-
    The ALG1 enzymatic block leaves dolichol-pyrophosphate-GlcNAc2 and
    GlcNAc1 precursors unmannosylated, so full-sized Glc3Man9GlcNAc2
    lipid-linked oligosaccharide is not efficiently assembled.

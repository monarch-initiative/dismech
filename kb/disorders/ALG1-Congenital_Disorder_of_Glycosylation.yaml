    snippet: "The molecular nature of a severe multisystemic disorder with a recurrent nonimmune hydrops fetalis was identified as deficiency of GDP-Man:GlcNAc(2)-PP-dolichol mannosyltransferase, the human orthologue of the yeast ALG1 gene (MIM 605907)."
    explanation: >-
      The defining biochemical report describes recurrent nonimmune hydrops
      fetalis at the severe prenatal end of the spectrum.
genetic:
- name: ALG1
  association: Biallelic loss-of-function or hypomorphic variants
  features: >-
    ALG1-CDG is caused by biallelic ALG1 variants, most commonly missense but
    also splice-site, nonsense, frameshift, and indel alleles acting through loss
    of function or severe hypomorphism. The recurrent c.773C>T (p.Ser258Leu)
    allele is the most frequently observed and, in the homozygous state, is
    uniformly lethal in early infancy. Most cohort variants were novel.
  gene_term:
    preferred_term: ALG1
    term:
      id: hgnc:18294
      label: ALG1
  evidence:
  - reference: PMID:26931382
    reference_title: "ALG1-CDG: Clinical and Molecular Characterization of 39 Unreported Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently observed mutation, in both the homozygous and compound heterozygous state (17/39, 44%)"
    explanation: >-
      The recurrent c.773C>T (p.Ser258Leu) allele was the most frequently
      observed ALG1 variant in the cohort.
  - reference: PMID:14973778
    reference_title: "Deficiency of GDP-Man:GlcNAc2-PP-dolichol mannosyltransferase causes congenital disorder of glycosylation type Ik."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of the patient's hALG1 gene identified a homozygous mutation leading to the exchange of a serine residue to leucine at position 258 in the hALG1 protein."
    explanation: >-
      The original biochemical report identified the recurrent homozygous
      p.Ser258Leu ALG1 variant.
diagnosis:
- name: Serum transferrin glycoform analysis
  description: >-
    A type I carbohydrate-deficient transferrin pattern is the usual biochemical
    screening clue, reflecting reduced and truncated N-glycan occupancy, but it
    is not gene-specific.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: MAXO:0000003
      label: diagnostic procedure
  results: A type I CDG transferrin pattern requiring etiologic follow-up.
  evidence:
  - reference: PMID:14973778
    reference_title: "Deficiency of GDP-Man:GlcNAc2-PP-dolichol mannosyltransferase causes congenital disorder of glycosylation type Ik."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patient-derived serum, the total amount of the glycoprotein transferrin was reduced. Moreover, a partial loss of N-glycan chains was observed, a characteristic feature of CDG type I forms."
    explanation: >-
      The type I transferrin pattern is the biochemical screening result; it is
      not ALG1-specific.
- name: ALG1 molecular genetic testing
  description: >-
    Definitive diagnosis requires identification of biallelic pathogenic ALG1
    variants; the ALG1-associated xeno-tetrasaccharide biomarker can support
    diagnosis, and testing is recommended in unsolved type I CDG with compatible
    features.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: MAXO:0000533
      label: molecular genetic testing
  results: Biallelic pathogenic or likely pathogenic ALG1 variants confirm the diagnosis.
  evidence:
  - reference: PMID:22966035
    reference_title: "Defining the phenotype in congenital disorder of glycosylation due to ALG1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest testing for ALG1 mutations in unsolved CDG patients with a type 1 transferrin isoelectric focusing pattern, especially with epilepsy, severe visual loss and hemorrhagic/thrombotic events."
    explanation: >-
      The phenotype series recommends ALG1 testing in unsolved type I CDG with
      compatible clinical features.
treatments:
- name: Supportive and complication-directed management
  description: >-
    No approved ALG1-specific disease-modifying therapy exists. Management is
    multidisciplinary and complication-directed, including antiseizure therapy,
    nutritional and feeding support, and surveillance/treatment of hepatic,
    renal, hematologic, ophthalmologic, and skeletal complications. Substrate
    therapies effective in some other CDGs (e.g., mannose in MPI-CDG) are not
    established for ALG1-CDG.
  evidence:
  - reference: PMID:38256263
    reference_title: "Targeted Proteomics Reveals Quantitative Differences in Low-Abundance Glycosyltransferases of Patients with Congenital Disorders of Glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The analysis of primary skin fibroblasts from eight CDG type I patients with impaired ALG1, ALG2, and ALG11 genes, respectively, revealed a substantial reduction in the corresponding protein levels. The abundance of the other GTs, however, remained unchanged at the transcript and protein levels, indicating that there is no fail-safe mechanism for the early steps of glycosylation in the endoplasmic reticulum."
    explanation: >-
      Recent proteomics shows no compensatory upregulation of other ER
      glycosyltransferases in ALG1 deficiency, underscoring the absence of an
      intrinsic rescue pathway and the current reliance on supportive care.

  description: >-
    Metastasis and recurrence are major clinical features of fusion-positive
    ARMS. Their incidence varies by fusion status, primary site, stage, and
    ascertainment time, so this entry does not assign a single frequency band.
  evidence:
  - reference: PMID:41131073
    reference_title: Cancer-associated fibroblasts promote tumor progression in fusion-positive rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The PAX3/PAX7-FOXO1 fusion-positive alveolar subtype has poor clinical
      outcomes, with frequent recurrence, metastasis, and low survival.
    explanation: >-
      Supports recurrence and metastasis specifically in fusion-positive ARMS
      without extrapolating a mixed-RMS cohort percentage to this disorder.
  - reference: PMID:32044412
    reference_title: Patterns of Failure in Parameningeal Alveolar Rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 7 patients with distant metastases as the first site of recurrence had
      central nervous system metastases.
    explanation: >-
      Adds direct human-cohort evidence for distant metastatic recurrence in
      pediatric parameningeal ARMS without extrapolating a page-wide frequency.
- category: Oncologic
  name: Regional Nodal Disease
  description: >-
    Regional lymph-node involvement is a clinically important staging and
    prognostic feature in ARMS. The cited cohort is limited to parameningeal
    disease; no page-wide frequency is assigned. No sufficiently specific HPO
    term for regional nodal metastasis is used in place of the broader
    lymphadenopathy phenotype.
  evidence:
  - reference: PMID:32044412
    reference_title: Patterns of Failure in Parameningeal Alveolar Rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      N1 disease and intracranial extension (ICE) portended inferior overall
      survival (P = .002 and .02, respectively).
    explanation: >-
      Directly supports regional node-positive disease as an adverse feature in
      a pediatric parameningeal ARMS cohort.
- category: Neurologic
  name: Intracranial Extension
  description: >-
    Intracranial extension occurs in a subset of parameningeal ARMS and is an
    adverse prognostic feature. This site-specific cohort estimate is not
    generalized to ARMS at other primary sites, and no overly broad HPO term is
    assigned.
  evidence:
  - reference: PMID:32044412
    reference_title: Patterns of Failure in Parameningeal Alveolar Rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients had group III (96%), node-negative (67%), positive FOX
      fusion status (63%) disease, and intracranial extension (54%).
    explanation: >-
      Directly quantifies intracranial extension in the defined pediatric
      parameningeal ARMS cohort.
biochemical:
- name: PAX-FOXO1 Fusion Detection
  notes: >-
    RT-PCR, FISH, or next-generation sequencing detection of PAX3-FOXO1 or
    PAX7-FOXO1 fusion is diagnostic and prognostic. Fusion status is more
    predictive of outcome than histologic classification.
  evidence:
  - reference: PMID:39686893
    reference_title: "[Characteristics of the cytogenetic variants of alveolar rhabdomyosarcoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-two tumor samples were collected and analyzed using a combination of histological, immunohistochemistry (Myogenin, MyoD1), and molecular genetic techniques (fluorescence in situ hybridization (FISH) and real-time polymerase chain reaction (RT-PCR))."
    explanation: Directly supports use of FISH and RT-PCR for routine PAX-FOXO1 fusion detection in clinical ARMS pathology.
- name: Myogenic Markers
  notes: >-
    Immunohistochemistry shows expression of myogenic markers including
    myogenin and MyoD1 and is interpreted together with morphology and
    molecular testing. The cited study does not by itself quantify staining
    intensity or establish a stand-alone subtype rule.
  evidence:
  - reference: PMID:39686893
    reference_title: "[Characteristics of the cytogenetic variants of alveolar rhabdomyosarcoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-two tumor samples were collected and analyzed using a combination of histological, immunohistochemistry (Myogenin, MyoD1), and molecular genetic techniques"
    explanation: Directly supports use of myogenin and MyoD1 immunohistochemistry as standard diagnostic markers in ARMS.
- name: Baseline circulating tumor DNA
  notes: >-
    Fusion-junction sequencing detects pretreatment ctDNA in a subset of
    fusion-positive intermediate-risk RMS. Detection is prognostic at the cohort
    level but is not yet represented here as a stand-alone diagnostic test or a
    validated treatment-selection surrogate.
  evidence:
  - reference: DOI:10.1200/jco.22.00409
    reference_title: "Circulating Tumor DNA Is Prognostic in Intermediate-Risk Rhabdomyosarcoma: A Report From the Children's Oncology Group"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of pathognomonic translocations between PAX3 or PAX7 and
      FOXO1 by Rhabdo-Seq was the best method for measuring ctDNA in FP-RMS and
      detected ctDNA in 27 of 49 cases (55%).
    explanation: >-
      Directly supports fusion-junction ctDNA detection in a clinical FP-RMS
      cohort.
  - reference: DOI:10.1200/jco.22.00409
    reference_title: "Circulating Tumor DNA Is Prognostic in Intermediate-Risk Rhabdomyosarcoma: A Report From the Children's Oncology Group"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      as did patients with FP-RMS (event-free survival, 37% v 70%; P = .045;
      overall survival, 39.2% v 75%; P = .023).
    explanation: >-
      Supports prognostic association in fusion-positive RMS while not claiming
      independent significance in the smaller FP-RMS subgroup.
- name: Elevated serum lactate dehydrogenase
  notes: >-
    Elevated LDH at diagnosis was associated with worse survival in a
    resource-limited pediatric RMS cohort containing both embryonal and alveolar
    tumors. It is therefore a nonspecific prognostic laboratory finding, not an
    ARMS diagnostic marker or an ARMS-specific frequency estimate.
  evidence:
  - reference: PMID:40790568
    reference_title: Predictors of survival among children and adolescents with rhabdomyosarcoma treated in a single resource-limited centre -Uganda.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      elevated serum lactate dehydrogenase at diagnosis above 400 U/L
      (HR = 2.80; 95% CI 1.46-5.33; p = 0.002)
    explanation: >-
      Directly supports elevated baseline LDH as an adverse prognostic finding
      in the mixed-histology pediatric RMS cohort.
diagnosis:
- name: Histologic and immunohistochemical classification
  description: >-
    Tissue diagnosis evaluates the contemporary alveolar or solid-sheet
    morphology and myogenic differentiation markers. Morphology establishes
    the histologic class, while myogenin and MyoD1 support rhabdomyoblastic
    differentiation.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  markers: Myogenin; MyoD1
  results: Alveolar architecture or solid sheets of monotonous round cells with myogenic-marker expression
  evidence:
  - reference: PMID:28058850
    reference_title: Molecular diagnostics in the management of rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The current histologic definition of ARMS requires that the majority of a
      tumor show alveolar histology, or solid sheets of cells with monotonous
      round nuclei characteristic of ARMS.
    explanation: Defines the contemporary histologic classification criterion.
  - reference: PMID:39686893
    reference_title: "[Characteristics of the cytogenetic variants of alveolar rhabdomyosarcoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-two tumor samples were collected and analyzed using a combination
      of histological, immunohistochemistry (Myogenin, MyoD1), and molecular
      genetic techniques
    explanation: >-
      Supports the combined morphology, myogenic-marker, and molecular workflow
      in a clinical ARMS series.
- name: PAX3/7-FOXO1 fusion testing
  description: >-
    FISH, RT-PCR, or sequencing is used to establish FOXO1 rearrangement and
    identify the fusion partner. Fusion status refines prognosis and treatment
    stratification but does not replace the histologic classification.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  markers: PAX3-FOXO1; PAX7-FOXO1; FOXO1 rearrangement
  results: Fusion-positive, fusion-negative, or alternative PAX fusion
  evidence:
  - reference: PMID:28058850
    reference_title: Molecular diagnostics in the management of rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The PAX3-FOXO1 and PAX7-FOXO1 gene fusions occur in 80% of cases with the
      alveolar subtype and are more predictive of outcome than histologic
      classification.
    explanation: >-
      Supports routine ascertainment of fusion status for molecular and
      prognostic classification.
  - reference: PMID:39686893
    reference_title: "[Characteristics of the cytogenetic variants of alveolar rhabdomyosarcoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenetic analysis using the FISH technique with a FOXO1-specific probe
      identified 26 (81%) samples with rearrangements at the FOXO1 locus and
      seven (19%) without rearrangements.
    explanation: Directly supports FOXO1 FISH testing in a clinical ARMS cohort.
differential_diagnoses:
- name: Embryonal rhabdomyosarcoma
  description: >-
    ERMS shares skeletal-muscle differentiation and can overlap clinically with
    ARMS. Fusion-negative tumors called ARMS by morphology frequently resemble
    ERMS molecularly and clinically, so morphology and fusion status must be
    reported separately.
  disease_term:
    preferred_term: embryonal rhabdomyosarcoma
    term:
      id: MONDO:0009993
      label: embryonal rhabdomyosarcoma
  distinguishing_features:
  - Predominantly alveolar architecture or monotonous solid-sheet cytology supports ARMS histology.
  - A PAX3-FOXO1 or PAX7-FOXO1 fusion supports fusion-positive RMS biology and adverse-risk stratification.
  - Fusion-negative alveolar histology has molecular and clinical behavior closer to ERMS.
  evidence:
  - reference: PMID:28058850
    reference_title: Molecular diagnostics in the management of rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Further, gene expression profiling of RMS shows ARMSn is highly similar
      to ERMS
    explanation: >-
      Supports the important molecular overlap between fusion-negative
      alveolar-histology RMS and ERMS.
  - reference: PMID:28058850
    reference_title: Molecular diagnostics in the management of rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Historically, pediatric RMS has been classified into two groups;
      alveolar RMS (ARMS) composed of primitive monotonous round cells typically
      with scant cytoplasm, and embryonal RMS (ERMS) with a range of appearances
      from small moderately pleomorphic cells to spindle cells that can have
      abundant eosinophilic cytoplasm with striations.
    explanation: Directly states the principal histologic distinction.
- name: B-lymphoblastic lymphoma
  description: >-
    An orbital lymphoblastic lymphoma can mimic the clinical and radiologic
    presentation of orbital rhabdomyosarcoma. Tissue histopathology and
    lineage-directed immunophenotyping distinguish the entities. The evidence
    is a single pediatric case and establishes a diagnostic pitfall rather than
    its frequency in an ARMS population.
  disease_term:
    preferred_term: lymphoblastic lymphoma
    term:
      id: MONDO:0000873
      label: lymphoblastic lymphoma
  distinguishing_features:
  - Lymphoid-lineage immunophenotyping supports B-lymphoblastic lymphoma.
  - Myogenin and MyoD1 expression with appropriate morphology supports rhabdomyosarcoma.
  - FOXO1 rearrangement testing further resolves fusion-positive RMS biology.
  evidence:
  - reference: PMID:41986061
    reference_title: "Primary orbital B cell lymphoblastic lymphoma in a toddler mimicking rhabdomyosarcoma: a diagnostic challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to overlapping clinical and radiological features, these cases are
      often misdiagnosed initially, with rhabdomyosarcoma being a common
      provisional diagnosis.
    explanation: >-
      Directly supports orbital B-lymphoblastic lymphoma as a clinical and
      radiologic mimic requiring tissue lineage confirmation.
genetic:
- name: PAX3-FOXO1 Fusion
  association: Somatic Fusion Oncogene
  gene_term:
    preferred_term: PAX3
    term:
      id: hgnc:8617
      label: PAX3
  notes: >-
    The t(2;13)(q35;q14) translocation creates the PAX3-FOXO1 fusion and is
    the dominant FOXO1-rearranged subtype, reported in roughly 70-90% of
    fusion-positive cases. This is the most aggressive molecular subtype.
  evidence:
  - reference: PMID:39686893
    reference_title: "[Characteristics of the cytogenetic variants of alveolar rhabdomyosarcoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to literature data, the frequency of the PAX3::FOXO1 translocation is 70-90% and the PAX7::FOXO1 translocation 10-30%."
    explanation: Supports PAX3-FOXO1 as the dominant fusion-positive subtype in alveolar rhabdomyosarcoma.
- name: PAX7-FOXO1 Fusion
  association: Somatic Fusion Oncogene
  gene_term:
    preferred_term: PAX7
    term:
      id: hgnc:8621
      label: PAX7
  notes: >-
    The t(1;13)(p36;q14) translocation creates the PAX7-FOXO1 fusion in
    roughly 10-30% of fusion-positive cases. Associated with better prognosis
    than PAX3-FOXO1.
  evidence:
  - reference: PMID:39686893
    reference_title: "[Characteristics of the cytogenetic variants of alveolar rhabdomyosarcoma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to literature data, the frequency of the PAX3::FOXO1 translocation is 70-90% and the PAX7::FOXO1 translocation 10-30%."
    explanation: Supports PAX7-FOXO1 as a recurrent minority fusion-positive subtype in alveolar rhabdomyosarcoma.
  - reference: PMID:22454413
    reference_title: PAX3/FOXO1 fusion gene status is the key prognostic molecular marker in rhabdomyosarcoma and significantly improves current risk stratification.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among nonmetastatic patients, patients who were PAX3/FOXO1 positive had a
      significantly poorer outcome compared with both alveolar-negative and
      PAX7/FOXO1-positive patients.
    explanation: >-
      Supports the relative prognostic statement for the PAX7-FOXO1 fusion.
- name: MYCN Amplification
  association: Secondary Genetic Event
  gene_term:
    preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  notes: >-
    MYCN amplification occurs in a subset of fusion-positive ARMS and is
    associated with worse prognosis.
  evidence:
  - reference: PMID:24436047
    reference_title: Comprehensive genomic analysis of rhabdomyosarcoma reveals a landscape of alterations affecting a common genetic axis in fusion-positive and fusion-negative tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amplification of 2p24 involving MYCN (5%) occurred predominantly in PFP
      tumors (8 PFP vs. 1 PFN)
    explanation: >-
      Documents recurrent MYCN amplification occurring predominantly in
      fusion-positive (PFP) rhabdomyosarcoma as a cooperating genetic event.
- name: CDK4 Amplification
  association: Secondary Genetic Event
  gene_term:
    preferred_term: CDK4
    term:
      id: hgnc:1773
      label: CDK4
  notes: >-
    The gene-rich 12q13-q14 amplicon in ARMS includes CDK4 as an oncogenic
    target. Amplification is a cooperating event rather than the defining
    PAX-FOXO1 driver, and its treatment-predictive value remains complex.
  evidence:
  - reference: PMID:41828638
    reference_title: "Gene Amplification in Rhabdomyosarcoma: Lessons from a Rare Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      amplification of the 12q13-q14 chromosomal region involves a gene-rich
      region in which there are at least two critical protein-coding oncogenic
      targets (CDK4 and SHMT2).
    explanation: >-
      Directly supports CDK4 as an oncogenic target of the recurrent
      12q13-q14 amplification in ARMS.
treatments:
- name: Multi-Agent Chemotherapy
  description: >-
    Intensive chemotherapy with vincristine, actinomycin D, and cyclophosphamide
    (VAC) forms the North American backbone of treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Combination Chemotherapy
    term:
      id: NCIT:C191
      label: Combination Chemotherapy
    therapeutic_agent:
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
    - preferred_term: actinomycin D
      term:
        id: CHEBI:27666
        label: actinomycin D
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4026
        label: cyclophosphamide hydrate
  regimen_term:
    preferred_term: VAC regimen
    term:
      id: NCIT:C67299
      label: VAC Regimen
  evidence:
  - reference: PMID:41038289
    reference_title: Towards directed therapy for fusion-positive rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the gene fusions PAX3::FOXO1 and PAX7::FOXO1 were discovered in
      the early 1990s, and since that time shown to be the molecular drivers of
      the disease, the best treatment to date still remains VAC (vincristine,
      actinomycin D, cyclophosphamide) combination therapy, first instituted as
      standard of care in the 1970s.
    explanation: >-
      Directly supports the named VAC backbone in fusion-positive RMS rather
      than only the nonspecific statement that therapy is intensive.
- name: European IVA Induction Chemotherapy
  description: >-
    Ifosfamide, vincristine, and actinomycin D (IVA) is the European induction
    backbone for high-risk localized RMS. Evidence is RMS-wide and includes
    ARMS; it does not establish superiority over VAC.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Combination Chemotherapy
    term:
      id: NCIT:C191
      label: Combination Chemotherapy
    therapeutic_agent:
    - preferred_term: ifosfamide
      term:
        id: CHEBI:5864
        label: ifosfamide
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
    - preferred_term: actinomycin D
      term:
        id: CHEBI:27666
        label: actinomycin D
  evidence:
  - reference: PMID:41038289
    reference_title: Towards directed therapy for fusion-positive rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IVA remains the standard induction regimen for high-risk localized RMS in
      Europe
    explanation: >-
      Directly supports the European IVA induction backbone while preserving
      the review-level evidence classification.
- name: Vinorelbine and Low-Dose Cyclophosphamide Maintenance
  description: >-
    Six cycles of intravenous vinorelbine plus continuous daily low-dose oral
    cyclophosphamide after remission-producing standard treatment improved
    overall survival in the EpSSG RMS 2005 randomized phase III trial. Eligible
    high-risk groups included nonmetastatic ARMS; this is a European standard
    and not an ARMS-only trial result.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Combination Chemotherapy
    term:
      id: NCIT:C191
      label: Combination Chemotherapy
    therapeutic_agent:
    - preferred_term: vinorelbine
      term:
        id: CHEBI:480999
        label: vinorelbine
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
  evidence:
  - reference: PMID:31562043
    reference_title: "Vinorelbine and continuous low-dose cyclophosphamide as maintenance chemotherapy in patients with high-risk rhabdomyosarcoma (RMS 2005): a multicentre, open-label, randomised, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those with non-metastatic alveolar rhabdomyosarcoma but without nodal
      involvement. Patients in remission after standard treatment
    explanation: >-
      Directly documents inclusion of nonmetastatic ARMS in the phase III
      maintenance trial.
  - reference: PMID:31562043
    reference_title: "Vinorelbine and continuous low-dose cyclophosphamide as maintenance chemotherapy in patients with high-risk rhabdomyosarcoma (RMS 2005): a multicentre, open-label, randomised, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      5-year overall survival was 86·5% (95% CI 80·2-90·9) with maintenance
      chemotherapy versus 73·7% (65·8-80·1) without
    explanation: >-
      Directly supports the randomized overall-survival benefit; the
      disease-free-survival endpoint did not cross its significance threshold.
- name: Cixutumumab or Temozolomide Intensification
  description: >-
    COG ARST08P1 evaluated adding either cixutumumab or temozolomide to an
    intensive metastatic-RMS chemotherapy backbone. Both nonrandomized pilot
    regimens were feasible but neither improved outcome; they are retained as
    negative clinical evidence and are not presented as standards of care.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:30351457
    reference_title: "The addition of cixutumumab or temozolomide to intensive multiagent chemotherapy is feasible but does not improve outcome for patients with metastatic rhabdomyosarcoma: A report from the Children's Oncology Group."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither agent improved outcome compared with the same chemotherapy that
      was used on ARST0431.
    explanation: >-
      Directly refutes clinical benefit from either intensification strategy in
      the metastatic RMS pilot cohorts, most of which had alveolar histology.
- name: Surgical Resection
  description: >-
    Complete surgical resection with negative margins when feasible without
    excessive morbidity. Surgery may be delayed until after chemotherapy
    to facilitate resection.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  evidence:
  - reference: PMID:39809723
    reference_title: Rhabdomyosarcoma Surgical Update.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advances in local control therapy of RMS have improved outcomes after surgical resection of the primary tumor, either before or after induction chemotherapy, even in the setting of metastatic disease."
    explanation: Supports surgical resection as an established local-control modality in rhabdomyosarcoma, including after induction chemotherapy.
- name: Radiation Therapy
  description: >-
    Radiation therapy is used for local control, particularly when complete
    surgical resection is not possible or margins are positive.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:32124549
    reference_title: "Do children and adolescents with completely resected alveolar rhabdomyosarcoma require adjuvant radiation? A report from the Children's Oncology Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with FOXO1 positivity who received RT had superior EFS compared with those who did not (77.8% vs 16.7%; P = 0.03)."
    explanation: Supports adjuvant radiation therapy in FOXO1-positive alveolar rhabdomyosarcoma, even after complete resection.
- name: PAX-FOXO1/ETS1 Complex Disruption
  description: >-
    Investigational small-molecule disruption of the PAX3-FOXO1/ETS1 complex is
    a direct chromatin-handle strategy: it aims to displace PAX3-FOXO1 from
    disease enhancers and suppress fusion-dependent gene regulation rather than
    treating the fusion as an untargetable upstream abstraction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: YK-4-279
      term:
        id: CHEBI:94301
        label: YK-4-279
  evidence:
  - reference: PMID:39448867
    reference_title: Dependence of PAX3-FOXO1 chromatin occupancy on ETS1 at important disease-promoting genes exposes new targetable vulnerability in Fusion-Positive Rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further show that the PAX3-FOXO1/ETS1 complex can be disrupted by the
      clinically relevant small molecule inhibitor YK-4-279.
    explanation: >-
      Supports YK-4-279-like disruption of the PAX3-FOXO1/ETS1 complex as an
      investigational therapeutic mechanism.
  target_mechanisms:
  - target: ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
    treatment_effect: INHIBITS
    description: >-
      Disrupts the ETS1-dependent PAX3-FOXO1 chromatin complex and thereby
      reduces fusion occupancy and target-gene regulation.
    evidence:
    - reference: PMID:39448867
      reference_title: Dependence of PAX3-FOXO1 chromatin occupancy on ETS1 at important disease-promoting genes exposes new targetable vulnerability in Fusion-Positive Rhabdomyosarcoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        YK-4-279 displaces PAX3-FOXO1 from chromatin and interferes with
        PAX3-FOXO1-dependent gene regulation, resulting in potent inhibition of
        growth and invasive properties in FP-RMS, along with downregulation of
        FGF8, IL4R, MEST and PODXL expression.
      explanation: >-
        Shows that the compound acts at the modeled ETS1/PAX3-FOXO1 chromatin
        cofactor node and suppresses downstream malignant behavior.
- name: YOD1 Inhibition
  description: >-
    Investigational YOD1 inhibition is modeled as a feedback-loop intervention:
    inhibiting YOD1 destabilizes both PAX-FOXO1 and N-Myc, reducing the
    reciprocal oncogenic amplification loop rather than targeting only a
    downstream proliferation phenotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:41401084
    reference_title: Therapeutic targeting of YOD1 disrupts the PAX-FOXO1/N-Myc feedback loop in rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knocking down YOD1 or inhibiting it with G5 could suppress FP-RMS growth
      both in vitro and in vivo, through promoting the degradation of both
      PAX-FOXO1 and N-Myc.
    explanation: >-
      Supports YOD1 inhibition as a preclinical strategy that destabilizes both
      oncogenic proteins and suppresses FP-RMS growth.
  target_mechanisms:
  - target: YOD1-N-Myc PAX-FOXO1 Feedback Loop
    treatment_effect: INHIBITS
    description: >-
      Inhibits YOD1-mediated stabilization of PAX-FOXO1 and N-Myc, collapsing
      the positive feedback loop.
    evidence:
    - reference: PMID:41401084
      reference_title: Therapeutic targeting of YOD1 disrupts the PAX-FOXO1/N-Myc feedback loop in rhabdomyosarcoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knocking down YOD1 or inhibiting it with G5 could suppress FP-RMS
        growth both in vitro and in vivo, through promoting the degradation of
        both PAX-FOXO1 and N-Myc.
      explanation: >-
        Directly supports the treatment-mechanism link between YOD1 inhibition
        and disruption of the modeled feedback loop.

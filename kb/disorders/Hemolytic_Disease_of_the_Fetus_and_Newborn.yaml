- name: Neonatal Phototherapy
  description: >
    Blue-light photoisomerisation of unconjugated bilirubin in the skin into
    water-soluble isomers that can be excreted without glucuronidation.
    First-line postnatal treatment for the hyperbilirubinemia phase, and the
    reason kernicterus is now rare where it is available.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Phototherapy
    term:
      id: NCIT:C15301
      label: Phototherapy
  target_mechanisms:
  - target: Neonatal Unconjugated Hyperbilirubinemia
    treatment_effect: INHIBITS
    description: >
      Provides a glucuronidation-independent route of bilirubin elimination.
    evidence:
    - reference: PMID:36469119

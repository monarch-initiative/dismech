  phase: PHASE_II
  status: COMPLETED
  description: >-
    UNITY: open-label phase 2 study of M281 (nipocalimab), an FcRn-blocking
    monoclonal antibody, in pregnant people at high risk for early-onset severe
    HDFN. The primary effectiveness endpoint was live birth at or after 32 weeks
    gestation without any intrauterine transfusion — i.e. interruption of the
    placental IgG-transfer arm of the mechanism, assessed against a historical
    benchmark rather than a randomised control.
  target_phenotypes:
  - preferred_term: Coombs-positive hemolytic anemia
    term:

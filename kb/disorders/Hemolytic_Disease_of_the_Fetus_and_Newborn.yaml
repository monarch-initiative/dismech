    explanation: Documents phototherapy and exchange transfusion as the treatments severe hemolysis requires.
- name: Neonatal Exchange Transfusion
  description: >
    Replacement of the neonate's blood volume with antigen-negative donor cells,
    which simultaneously removes bilirubin, removes antibody-coated red cells,
    and removes circulating maternal alloantibody. Reserved for
    hyperbilirubinemia refractory to intensive phototherapy or already
    approaching the exchange threshold.

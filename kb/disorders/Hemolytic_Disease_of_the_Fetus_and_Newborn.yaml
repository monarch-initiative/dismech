prevalence:
- population: United States (commercial laboratory database, 2010-2021)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1518.0
  notes: >
    This is the prevalence of a positive maternal red-cell antibody screen per
    pregnancy, not of clinical HDFN — it is the population at risk, roughly
    three quarters of which carry an antibody capable of causing HDFN. The
    denominator is pregnancies, not the general population. Anti-D prevalence in
    this dataset cannot be cleanly interpreted because passive antibody from
    RhIG prophylaxis is indistinguishable from true alloimmunisation on a
    screen.
  evidence:
  - reference: PMID:38662646
    reference_title: "Maternal red blood cell alloimmunization prevalence in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 9 876 196 pregnancies, 147 262 (1.5%) screened positive for RBC abs, corresponding to an estimated prevalence of 1518 of 100 000 pregnancies."
    explanation: Gives the normalised rate per 100,000 pregnancies used here.
  - reference: PMID:38662646
    reference_title: "Maternal red blood cell alloimmunization prevalence in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among almost 10 million pregnancies in the United States, comprising an estimated 14.4% of all pregnancies, 1.5% screened positive for RBC abs."
    explanation: >
      Establishes the size and national representativeness of the denominator
      behind the rate.
- population: Iceland (nationwide, 1996-2015)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1040.0
  notes: >
    A nationwide denominator with universal antibody screening since 1978 and
    postnatal — but not routine antenatal — RhIG. Anti-D prevalence among
    D-negative mothers was 1.1%, which is the residual alloimmunisation rate
    under a postnatal-only prophylaxis programme.
  evidence:
  - reference: PMID:28840609
    reference_title: "Red blood cell alloimmunization in pregnancy during the years 1996-2015 in Iceland: a nation-wide population study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 912 positive antibody screens from 87,437 births were identified (1.04% prevalence)."
    explanation: Gives the nationwide per-birth prevalence of a positive antibody screen.
  - reference: PMID:28840609
    reference_title: "Red blood cell alloimmunization in pregnancy during the years 1996-2015 in Iceland: a nation-wide population study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-D prevalence among D-negative mothers was 1.1%."
    explanation: Quantifies residual anti-D alloimmunisation under postnatal-only prophylaxis.
clinical_burden:
  burden_level: HIGH
  rationale: >
    Untreated severe HDFN causes fetal hydrops, fetal death, and kernicterus.
    The burden is now overwhelmingly a distributional one: immunoprophylaxis has
    made Rh(D) disease rare where RhIG is available and affordable, and anti-D
    nevertheless remains the commonest cause of severe HDFN globally. Where
    intrauterine transfusion is available the surviving cohort does well
    neurologically, with under 5% neurodevelopmental impairment.
  evidence:
  - reference: PMID:38662646
    reference_title: "Maternal red blood cell alloimmunization prevalence in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemolytic disease of fetus and newborn (HDFN) is a life-threatening disease mediated by maternal alloimmunization to red blood cell (RBC) antigens."
    explanation: States the life-threatening character of the disease.
  - reference: PMID:36469119
    reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preventative measures, such as Rhesus(D) immunoprophylaxis (RhIG), have greatly decreased the prevalence of Rh(D)-mediated HDFN, although a gap between high-income countries and middle- to low-income countries was created largely due to a lack in availability and high costs of RhIG."
    explanation: Establishes the income-gradient distribution of residual burden.
  - reference: PMID:38959811
    reference_title: "Why do RhD negative pregnant women still become anti-D immunized despite prophylaxis with anti-D immunoglobulin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite comprehensive programs with these targeted measures, allo-anti-D is still the most common reason for severe hemolytic disease of the fetus and newborn."
    explanation: States that anti-D remains the leading cause of severe disease despite prophylaxis.
pathophysiology:
- name: Fetomaternal Hemorrhage and Exposure to Paternally Inherited Red Cell Antigens
  role: trigger
  biological_scale: TISSUE
  description: >
    Fetal erythrocytes carrying a paternally inherited antigen the pregnant
    person lacks cross into the maternal circulation. This happens
    physiologically at delivery and is amplified by sensitising events —
    abdominal trauma, antepartum bleeding, amniocentesis, miscarriage,
    termination, external cephalic version. Because most sensitising exposure
    occurs at or near the end of a pregnancy, the index pregnancy is usually
    spared and the disease manifests in a subsequent antigen-positive pregnancy.
    This latency is the reason a prophylaxis programme timed to delivery and to
    sensitising events can work at all.
  cell_types:
  - preferred_term: fetal erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:38959811
    reference_title: "Why do RhD negative pregnant women still become anti-D immunized despite prophylaxis with anti-D immunoglobulin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Potentially sensitizing events like trauma to the pregnant abdomen, vaginal bleeding, and amniocentesis may lead to fetomaternal hemorrhage and necessitate additional doses."
    explanation: Names the sensitising events that produce fetomaternal hemorrhage.
  downstream:
  - target: Maternal Alloimmunization and IgG Alloantibody Production
    causal_link_type: DIRECT
    description: >
      Exposure to a foreign red-cell antigen primes an alloantibody response.
    evidence:
    - reference: PMID:34675752
      reference_title: "Hemolytic Disease of the Newborn: A Review of Current Trends and Prospects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The pathophysiology of HDN begins with maternal antibodies attacking fetal red blood cells following alloimmunization due to rhesus or ABO incompatibility between the maternal and fetal blood."
      explanation: Places alloimmunisation upstream of antibody-mediated fetal red-cell destruction.
- name: Maternal Alloimmunization and IgG Alloantibody Production
  biological_scale: CELLULAR
  description: >
    A class-switched, IgG-secreting plasma-cell response develops against the
    foreign red-cell antigen. Anti-D is the archetype and remains the most
    frequent cause of severe disease, but anti-K (Kell) and anti-c are also
    clinically major, and the antibody specificity — not merely its titre —
    determines the mechanism of fetal anemia downstream. Only IgG matters for
    fetal disease, because IgM cannot be transported across the placenta.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: humoral immune response mediated by circulating immunoglobulin
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
    modifier: INCREASED
  evidence:
  - reference: PMID:38959811
    reference_title: "Why do RhD negative pregnant women still become anti-D immunized despite prophylaxis with anti-D immunoglobulin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal allo-anti-D in RhD negative pregnant women may cause mild to severe hemolytic disease of the fetus and newborn."
    explanation: Identifies maternal allo-anti-D as the causal antibody.
  - reference: PMID:28840609
    reference_title: "Red blood cell alloimmunization in pregnancy during the years 1996-2015 in Iceland: a nation-wide population study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among specificities in the clinically significant group, anti-D antibodies were most strongly associated with severe hemolysis."
    explanation: Establishes that antibody specificity, not merely presence, predicts severity.
  downstream:
  - target: FcRn-Mediated Transplacental IgG Transfer
    causal_link_type: DIRECT
    description: >
      Circulating maternal IgG becomes substrate for active placental transport.
    evidence:
    - reference: PMID:39115062
      reference_title: "Nipocalimab in Early-Onset Severe Hemolytic Disease of the Fetus and Newborn."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In early-onset severe hemolytic disease of the fetus and newborn (HDFN), transplacental transfer of maternal antierythrocyte IgG alloantibodies causes fetal anemia that leads to the use of high-risk intrauterine transfusions in order to avoid fetal hydrops and fetal death."
      explanation: States the transplacental-transfer step as the link between maternal antibody and fetal anemia.
- name: FcRn-Mediated Transplacental IgG Transfer
  biological_scale: MOLECULAR
  description: >
    The neonatal Fc receptor (FcRn, encoded by FCGRT) on the syncytiotrophoblast
    of the chorionic villi binds maternal IgG and transcytoses it into the fetal
    circulation. Transport is subclass-selective — IgG1 is carried most
    efficiently — and rises steeply through the second and third trimesters,
    which sets the gestational window of disease. This node is the disease's
    single most druggable step: it is the only point at which the maternal and
    fetal compartments are coupled, and a competitive FcRn blocker both
    interrupts the transfer and accelerates catabolism of maternal IgG.
  cell_types:
  - preferred_term: syncytiotrophoblast cell
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:
  - preferred_term: IgG transcytosis mediated by FcRn
    term:
      id: GO:0002416
      label: IgG immunoglobulin transcytosis in epithelial cells mediated by FcRn immunoglobulin receptor
    modifier: INCREASED
  evidence:
  - reference: PMID:12850341
    reference_title: "Placental transport of immunoglobulin G."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transfer across the syncytiotrophoblast of the chorionic villi is mediated by the neonatal Fc receptor, FcRn."
    explanation: Identifies FcRn on the syncytiotrophoblast as the transport mechanism.
  - reference: PMID:12850341
    reference_title: "Placental transport of immunoglobulin G."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal immunoglobulin G (IgG) concentrations in fetal blood increase from early in the second trimester through term, most antibodies being acquired during the third trimester."
    explanation: Establishes the gestational time course of IgG accumulation in the fetus.
  - reference: PMID:12850341
    reference_title: "Placental transport of immunoglobulin G."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IgG1 is the most efficiently transported subclass and IgG2 the least."
    explanation: Documents the subclass selectivity of placental transport.
  - reference: PMID:39197469
    reference_title: "Design of a Phase 3, Global, Multicenter, Randomized, Placebo-Controlled, Double-Blind Study of Nipocalimab in Pregnancies at Risk for Severe Hemolytic Disease of the Fetus and Newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nipocalimab is a neonatal fragment crystallizable (Fc) receptor (FcRn)-blocking monoclonal antibody that inhibits placental immunoglobulin G (IgG) transfer and lowers circulating maternal IgG levels."
    explanation: Confirms FcRn as the pharmacological target of the transfer step.
  downstream:
  - target: Opsonisation and Splenic Erythrophagocytosis of Fetal Erythrocytes
    causal_link_type: DIRECT
    hypothesis_groups:
    - antibody_mediated_erythrophagocytosis
    description: >
      Transferred alloantibody coats antigen-positive fetal red cells.
    evidence:
    - reference: PMID:36469119
      reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "fetal and neonatal red blood cells (RBC) are hemolyzed by maternal alloantibodies directed against RBC antigens potentially leading to severe disease"
      explanation: States that maternal alloantibodies hemolyse fetal red cells.
  - target: Anti-Kell Suppression of Fetal Erythroid Progenitors
    causal_link_type: DIRECT
    hypothesis_groups:
    - erythroid_progenitor_suppression
    description: >
      When the transferred antibody is anti-Kell, the dominant downstream effect
      is on progenitors rather than on mature circulating erythrocytes.
    evidence:
    - reference: PMID:9504940
      reference_title: "Inhibition of erythroid progenitor cells by anti-Kell antibodies in fetal alloimmune anemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Anti-Kell antibodies specifically inhibit the growth of Kell-positive erythroid burst-forming units and colony-forming units, a finding that supports the hypothesis that these antibodies cause fetal anemia by suppressing erythropoiesis at the progenitor-cell level."
      explanation: Establishes the progenitor-suppression route as antibody-specificity dependent.
- name: Opsonisation and Splenic Erythrophagocytosis of Fetal Erythrocytes
  biological_scale: CELLULAR
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  description: >
    IgG-coated antigen-positive fetal erythrocytes are recognised by
    Fc-gamma receptors on macrophages of the fetal spleen and removed by
    extravascular phagocytosis. This is predominantly extravascular and
    complement-independent for IgG alloantibodies of the Rh system, which is why
    hemoglobinuria is not a feature and why the spleen enlarges. The rate of
    destruction, not the antibody titre alone, is what the fetus must
    compensate for.
  cell_types:
  - preferred_term: splenic red pulp macrophage
    term:
      id: CL:0000874
      label: splenic red pulp macrophage
  - preferred_term: fetal erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: Fc-gamma receptor signaling pathway involved in phagocytosis
    term:
      id: GO:0038096
      label: Fc-gamma receptor signaling pathway involved in phagocytosis
    modifier: INCREASED
  evidence:
  - reference: PMID:40752319
    reference_title: "Hemolytic disease of the fetus and newborn: A review of pathophysiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemolytic Disease of the Fetus and Newborn (HDFN) results from maternal alloantibodies attacking fetal red blood cells, leading to fetal anemia and potentially severe complications such as hydrops fetalis."
    explanation: States the antibody-mediated destruction of fetal red cells and its consequence.
  downstream:
  - target: Fetal Anemia and Compensatory Extramedullary Erythropoiesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - antibody_mediated_erythrophagocytosis
    description: >
      Accelerated destruction of circulating fetal red cells lowers fetal
      hemoglobin faster than the fetus can replace it.
    evidence:
    - reference: PMID:36469119
      reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Prenatally, fetal anemia may occur and intrauterine transfusions may be needed."
      explanation: Places fetal anemia downstream of hemolysis.
  - target: Neonatal Unconjugated Hyperbilirubinemia
    causal_link_type: DIRECT
    description: >
      Continued hemolysis after birth generates a bilirubin load the neonatal
      liver must now clear alone.
    evidence:
    - reference: PMID:36469119
      reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "should provide treatment for hyperbilirubinemia in the early phase and monitor for late anemia in the late phase of the disease"
      explanation: Establishes hyperbilirubinemia as the early postnatal consequence of ongoing hemolysis.
- name: Anti-Kell Suppression of Fetal Erythroid Progenitors
  biological_scale: CELLULAR
  description: >
    Kell alloantibodies act on Kell-positive erythroid burst-forming and
    colony-forming units rather than on mature circulating red cells, arresting
    erythropoiesis at the progenitor stage. The clinical signature is diagnostic
    of the mechanism: severe anemia with disproportionately little hemolysis,
    and reticulocyte and normoblast counts that are inappropriately low for the
    degree of anemia — the opposite of what Rh disease produces. Practically
    this means anti-K titres and amniotic-fluid bilirubin underestimate risk,
    and Kell-alloimmunised pregnancies must be monitored by direct anemia
    assessment instead.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    term:
      id: GO:0030218
      label: erythrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:9504940
    reference_title: "Inhibition of erythroid progenitor cells by anti-Kell antibodies in fetal alloimmune anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In alloimmune anemia of the newborn, the level of hemolysis caused by the presence of antibodies to antigens of the Kell blood-group system is less than that caused by antibodies to the D antigen of the Rh blood-group system, and the numbers of reticulocytes and normoblasts in the baby's circulation are inappropriately low for the degree of anemia."
    explanation: Documents the clinical signature that distinguishes the Kell mechanism from Rh hemolysis.
  - reference: PMID:9504940
    reference_title: "Inhibition of erythroid progenitor cells by anti-Kell antibodies in fetal alloimmune anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The growth of Kell-positive erythroid progenitor cells (erythroid burst-forming units and colony-forming units) from cord blood was markedly inhibited by monoclonal IgG and IgM anti-Kell antibodies in a dose-dependent fashion"
    explanation: Provides the direct progenitor-culture evidence for suppression.
  downstream:
  - target: Fetal Anemia and Compensatory Extramedullary Erythropoiesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - erythroid_progenitor_suppression
    description: >
      Progenitor arrest produces anemia by failure of production rather than by
      accelerated destruction.
    evidence:
    - reference: PMID:9504940
      reference_title: "Inhibition of erythroid progenitor cells by anti-Kell antibodies in fetal alloimmune anemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "these antibodies cause fetal anemia by suppressing erythropoiesis at the progenitor-cell level"
      explanation: States the production-failure route to fetal anemia.
- name: Fetal Anemia and Compensatory Extramedullary Erythropoiesis
  biological_scale: ORGANISM
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Shortened Erythrocyte Lifespan and Erythropoietic Strain"
  description: >
    Falling fetal hemoglobin drives erythropoietin-mediated expansion of
    erythropoiesis beyond the marrow into the fetal liver and spleen. The
    hepatosplenomegaly and the circulating nucleated red cells this produces are
    what gave the disease its historical name, erythroblastosis fetalis. This
    node is where the disease is measured clinically: fetal anemia is detected
    non-invasively by an elevated middle cerebral artery peak systolic velocity,
    which exploits the fall in blood viscosity rather than any direct
    measurement of hemoglobin.
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  biological_processes:
  - preferred_term: hemopoiesis
    term:
      id: GO:0030097
      label: hemopoiesis
    modifier: INCREASED
  evidence:
  - reference: PMID:10620643
    reference_title: "Noninvasive diagnosis by Doppler ultrasonography of fetal anemia due to maternal red-cell alloimmunization. Collaborative Group for Doppler Assessment of the Blood Velocity in Anemic Fetuses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 111 fetuses at risk for anemia, 41 fetuses did not have anemia; 35 had mild anemia; 4 had moderate anemia; and 31, including 12 with hydrops, had severe anemia."
    explanation: Quantifies the spectrum of fetal anemia severity in an alloimmunised at-risk cohort.
  downstream:
  - target: Hydrops Fetalis and Fetal Death
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      When anemia outpaces compensation, high-output cardiac failure, hepatic
      congestion and reduced oncotic pressure produce generalised fetal oedema.
    evidence:
    - reference: PMID:39115062
      reference_title: "Nipocalimab in Early-Onset Severe Hemolytic Disease of the Fetus and Newborn."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "transplacental transfer of maternal antierythrocyte IgG alloantibodies causes fetal anemia that leads to the use of high-risk intrauterine transfusions in order to avoid fetal hydrops and fetal death"
      explanation: Places hydrops and fetal death as the endpoint of untreated fetal anemia.
- name: Hydrops Fetalis and Fetal Death
  biological_scale: ORGANISM
  description: >
    Severe anemia produces high-output cardiac failure and abnormal fluid
    accumulation in two or more fetal compartments — ascites, pleural and
    pericardial effusions, skin oedema, often with placentomegaly and
    polyhydramnios. Hydrops is the pre-terminal state of untreated HDFN, and it
    is also the strongest antenatal predictor of long-term neurological outcome
    among fetuses who are rescued: in the largest follow-up cohort, severe
    hydrops carried an eleven-fold odds of neurodevelopmental impairment.
    Preventing hydrops, rather than merely surviving it, is therefore the
    treatment target.
  evidence:
  - reference: PMID:22030316
    reference_title: "Long-term neurodevelopmental outcome after intrauterine transfusion for hemolytic disease of the fetus/newborn: the LOTUS study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a multivariate regression analysis including only preoperative risk factors, severe hydrops was independently associated with neurodevelopmental impairment (odds ratio, 11.2; 95% confidence interval, 1.7-92.7)."
    explanation: Quantifies hydrops as the dominant preoperative predictor of impaired neurodevelopment.
  - reference: PMID:22030316
    reference_title: "Long-term neurodevelopmental outcome after intrauterine transfusion for hemolytic disease of the fetus/newborn: the LOTUS study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevention of fetal hydrops, the strongest preoperative predictor for impaired neurodevelopment, by timely detection, referral and treatment may improve long-term outcome."
    explanation: States hydrops prevention as the actionable target.
- name: Neonatal Unconjugated Hyperbilirubinemia
  biological_scale: ORGANISM
  description: >
    Hemoglobin released by ongoing hemolysis is catabolised to unconjugated
    bilirubin. Before birth this is cleared across the placenta by the maternal
    liver, so the fetus is anemic but not jaundiced; delivery severs that route
    while the maternal alloantibody, with an IgG half-life of weeks, continues
    to circulate in the neonate. The immature neonatal glucuronidation capacity
    is then the only clearance path, and bilirubin rises sharply in the first
    days of life. Anemia recurs later — hyporegenerative late anemia at two to
    six weeks — which is why postnatal surveillance has two distinct phases.
  biological_processes:
  - preferred_term: heme catabolic process
    term:
      id: GO:0042167
      label: heme catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:36469119
    reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "should provide treatment for hyperbilirubinemia in the early phase and monitor for late anemia in the late phase of the disease"
    explanation: Establishes the two-phase postnatal course, hyperbilirubinemia then late anemia.
  - reference: PMID:34675752
    reference_title: "Hemolytic Disease of the Newborn: A Review of Current Trends and Prospects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is also vital to understand prospective complications such as severe hyperbilirubinemia and develop appropriate remedies."
    explanation: Identifies severe hyperbilirubinemia as a principal complication.
  downstream:
  - target: Bilirubin Neurotoxicity and Kernicterus
    causal_link_type: DIRECT
    description: >
      Unbound unconjugated bilirubin crosses the blood-brain barrier and is
      neurotoxic.
    evidence:
    - reference: PMID:25577653
      reference_title: "The clinical syndrome of bilirubin-induced neurologic dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "which can occur in the absence of classical kernicterus"
      explanation: >
        Supports a graded bilirubin-injury spectrum extending below the
        classical kernicterus threshold.
- name: Bilirubin Neurotoxicity and Kernicterus
  biological_scale: TISSUE
  description: >
    Unconjugated bilirubin not bound to albumin crosses the blood-brain barrier
    and stains discrete brain regions — the basal ganglia, brain stem and
    cerebellum — producing acute bilirubin encephalopathy and, if not
    interrupted, permanent sequelae spanning neuromotor, muscle-tone, auditory
    and visuomotor domains. A curation-relevant caveat is that total serum
    bilirubin, the number treatment thresholds are written against, is an
    imperfect proxy for the neurotoxic exposure, and a subthreshold spectrum of
    bilirubin-induced neurologic dysfunction is recognised in the absence of
    classical kernicterus.
  evidence:
  - reference: PMID:25745520
    reference_title: "Brain magnetic resonance imaging and magnetic resonance spectroscopy findings of children with kernicterus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The term kernicterus, or bilirubin encephalopathy, is used to describe pathological bilirubin staining of the basal ganglia, brain stem, and cerebellum, and is associated with hyperbilirubinemia."
    explanation: >
      Names the regions in which bilirubin deposits, which is the anatomical
      claim this node's description makes.
  - reference: PMID:25577653
    reference_title: "The clinical syndrome of bilirubin-induced neurologic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(i) neuromotor signs; (ii) muscle tone abnormalities; (iii) hyperexcitable neonatal reflexes; (iv) variety of neurobehavior manifestations; (v) speech and language abnormalities; and (vi) evolving array of central processing abnormalities, such as sensorineural audiology and visuomotor dysfunctions"
    explanation: >
      Enumerates the neurologic domains the description refers to, replacing
      the previously unsourced list of specific kernicteric sequelae.
  - reference: PMID:25577653
    reference_title: "The clinical syndrome of bilirubin-induced neurologic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a total serum/plasma bilirubin (TB) level is not the most precise indicator of neurotoxicity"
    explanation: States the limitation of the biomarker that treatment thresholds are based on.
mechanistic_hypotheses:
- hypothesis_group_id: antibody_mediated_erythrophagocytosis
  hypothesis_label: Alloantibody-mediated extravascular destruction of mature fetal erythrocytes
  status: CANONICAL
  description: >
    The default model, and the one that fits Rh(D) disease: transferred maternal
    IgG opsonises antigen-positive circulating fetal red cells, which are then
    removed by Fc-gamma-receptor-bearing splenic macrophages. Anemia is a
    destruction problem, so the fetus mounts a brisk compensatory erythroid
    response — reticulocytosis, circulating erythroblasts, hepatosplenomegaly —
    and the bilirubin load is correspondingly high.
  evidence:
  - reference: PMID:36469119
    reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fetal and neonatal red blood cells (RBC) are hemolyzed by maternal alloantibodies directed against RBC antigens potentially leading to severe disease"
    explanation: States the canonical hemolytic model.
- hypothesis_group_id: erythroid_progenitor_suppression
  hypothesis_label: Alloantibody suppression of erythroid progenitors (Kell arm)
  status: ALTERNATIVE
  description: >
    A mechanistically distinct, antibody-specificity-dependent route in which
    the alloantibody inhibits Kell-positive erythroid progenitors rather than
    destroying mature red cells. This is not a competing explanation of the same
    observations but a competing explanation for a different subset of
    pregnancies: it predicts anemia with low reticulocytes, little hemolysis,
    and less hyperbilirubinemia, and it is the reason antibody titre and
    amniotic-fluid spectrophotometry are unreliable in Kell alloimmunisation.
    Both arms converge on the same fetal-anemia node.
  evidence:
  - reference: PMID:9504940
    reference_title: "Inhibition of erythroid progenitor cells by anti-Kell antibodies in fetal alloimmune anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Anti-Kell antibodies specifically inhibit the growth of Kell-positive erythroid burst-forming units and colony-forming units, a finding that supports the hypothesis that these antibodies cause fetal anemia by suppressing erythropoiesis at the progenitor-cell level."
    explanation: Direct progenitor-level evidence for the alternative mechanism.
  - reference: PMID:9504940
    reference_title: "Inhibition of erythroid progenitor cells by anti-Kell antibodies in fetal alloimmune anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that sensitization to Kell antigens results in suppression of fetal erythropoiesis as well as hemolysis."
    explanation: States that Kell sensitisation adds suppression on top of hemolysis rather than replacing it entirely.
phenotypes:
- category: Hematologic
  name: Fetal and Neonatal Hemolytic Anemia
  description: >
    Anemia from immune destruction of antigen-positive erythrocytes, present in
    utero and continuing after birth for as long as maternal IgG persists.
  phenotype_term:
    preferred_term: Coombs-positive hemolytic anemia
    term:
      id: HP:0004844
      label: Coombs-positive hemolytic anemia
  evidence:
  - reference: PMID:40752319
    reference_title: "Hemolytic disease of the fetus and newborn: A review of pathophysiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemolytic Disease of the Fetus and Newborn (HDFN) results from maternal alloantibodies attacking fetal red blood cells, leading to fetal anemia and potentially severe complications such as hydrops fetalis."
    explanation: States fetal anemia as the defining hematologic phenotype.
- category: Hematologic
  name: Positive Direct Antiglobulin Test
  description: >
    The neonate's erythrocytes are coated with maternal IgG, giving a positive
    direct antiglobulin (Coombs) test — the serological confirmation that the
    anemia is alloimmune rather than intrinsic to the red cell.
  phenotype_term:
    preferred_term: Positive Coombs test
    term:
      id: HP:0020026
      label: Positive Coombs test
  evidence:
  - reference: PMID:41965236
    reference_title: "Investigation of a neonate with blocked D phenomenon: resolving D type using serologic and molecular methods."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neonate's direct antiglobulin test (DAT) was strongly positive for IgG, and eluate testing confirmed anti-D specificity, indicating that maternal anti-D was coating the neonate's RBCs."
    explanation: >
      Names the test and states what a positive result demonstrates — maternal
      IgG alloantibody coating the neonate's red cells.
  - reference: PMID:40252497
    reference_title: "Estimation of ABO hemolytic disease of the fetus and newborn through gene frequency study and immunohematological characterization of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct antiglobulin test (DAT) positivity due to IgG1 or IgG3 or both was observed in 15 (75 %) cases."
    explanation: >
      Quantifies DAT positivity across a consecutive HDFN case series and
      identifies the IgG subclasses responsible.
  - reference: PMID:36469119
    reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fetal and neonatal red blood cells (RBC) are hemolyzed by maternal alloantibodies directed against RBC antigens potentially leading to severe disease"
    explanation: >
      Supports the antibody-coating of fetal and neonatal red cells that the
      direct antiglobulin test detects.
- category: Hematologic
  name: Extramedullary Hematopoiesis with Hepatosplenomegaly
  description: >
    Compensatory erythropoiesis in the fetal liver and spleen enlarges both
    organs and releases nucleated red cells into the circulation — the finding
    that named erythroblastosis fetalis.
  phenotype_term:
    preferred_term: Extramedullary hematopoiesis
    term:
      id: HP:0001978
      label: Extramedullary hematopoiesis
  evidence:
  - reference: PMID:3189438
    reference_title: "Erythroblastosis and reticulocytosis in anemic fetuses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that medullary hematopoiesis is stimulated by mild anemia and that recruitment of extramedullary sites occurs when anemia is severe. Extensive hepatic erythropoiesis may be the cause of fetal hydrops in red blood cell isoimmunization."
    explanation: >
      Direct evidence for extramedullary (hepatic) erythropoiesis in
      alloimmune fetal anemia, measured in 127 isoimmunised pregnancies, and
      the link onward to hydrops.
  - reference: PMID:3189438
    reference_title: "Erythroblastosis and reticulocytosis in anemic fetuses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reticulocyte count increased linearly with fetal anemia, and the erythroblast count increased exponentially."
    explanation: >
      Supports the release of nucleated red cells (erythroblasts) into the
      fetal circulation in proportion to the severity of the anemia.
  - reference: PMID:34675752
    reference_title: "Hemolytic Disease of the Newborn: A Review of Current Trends and Prospects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemolytic disease of the newborn (HDN), also known as Erythroblastosis fetalis, is a hemolytic condition that predominantly affects rhesus-positive fetuses and infants born to rhesus-negative mothers."
    explanation: >
      Records the erythroblastosis synonym only; it does not itself evidence
      extramedullary erythropoiesis, hence PARTIAL.
- category: Fetal
  name: Hydrops Fetalis
  description: >
    Abnormal fluid accumulation in two or more fetal compartments from
    high-output cardiac failure secondary to severe anemia. The pre-terminal
    manifestation of untreated disease.
  phenotype_term:
    preferred_term: Hydrops fetalis
    term:
      id: HP:0001789
      label: Hydrops fetalis
    severity: SEVERE
  evidence:
  - reference: PMID:40752319
    reference_title: "Hemolytic disease of the fetus and newborn: A review of pathophysiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leading to fetal anemia and potentially severe complications such as hydrops fetalis"
    explanation: Names hydrops fetalis as the severe complication of fetal anemia.
  - reference: PMID:10620643
    reference_title: "Noninvasive diagnosis by Doppler ultrasonography of fetal anemia due to maternal red-cell alloimmunization. Collaborative Group for Doppler Assessment of the Blood Velocity in Anemic Fetuses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "31, including 12 with hydrops, had severe anemia"
    explanation: Documents hydrops occurring within the severely anemic subset of an alloimmunised cohort.
- category: Neonatal
  name: Severe Unconjugated Hyperbilirubinemia
  description: >
    Rapidly rising unconjugated bilirubin in the first days of life once
    placental clearance is lost, the principal indication for phototherapy and
    exchange transfusion.
  phenotype_term:
    preferred_term: Hyperbilirubinemia
    term:
      id: HP:0002904
      label: Hyperbilirubinemia
    temporality: ACUTE
  evidence:
  - reference: PMID:34675752
    reference_title: "Hemolytic Disease of the Newborn: A Review of Current Trends and Prospects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is also vital to understand prospective complications such as severe hyperbilirubinemia and develop appropriate remedies."
    explanation: Identifies severe hyperbilirubinemia as a principal neonatal complication.
- category: Neurologic
  name: Kernicterus
  description: >
    Bilirubin staining of the basal ganglia, brain stem and cerebellum,
    producing acute bilirubin encephalopathy and permanent neurologic sequelae.
    Now rare where phototherapy and exchange transfusion are available.
  phenotype_term:
    preferred_term: Kernicterus
    term:
      id: HP:0001343
      label: Kernicterus
    severity: SEVERE
  evidence:
  - reference: PMID:39905388
    reference_title: "Patient experience and burden of haemolytic disease of the foetus and newborn: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While in newborns, HDFN can lead to severe forms of neonatal hyperbilirubinaemia and kernicterus."
    explanation: >
      Attributes kernicterus to HDFN specifically — the disease-phenotype link
      the graded-spectrum citation below does not itself make.
  - reference: PMID:25577653
    reference_title: "The clinical syndrome of bilirubin-induced neurologic dysfunction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "which can occur in the absence of classical kernicterus"
    explanation: >
      Context only: places classical kernicterus at the severe pole of a graded
      bilirubin-injury spectrum. It does not link kernicterus to HDFN, hence
      PARTIAL.
- category: Neurologic
  name: Neurodevelopmental Impairment After Intrauterine Transfusion
  description: >
    Cerebral palsy, severe developmental delay or bilateral deafness in
    survivors treated with intrauterine transfusion. The incidence is low, and
    it is concentrated in those who were hydropic before treatment.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Neurodevelopmental delay
    term:
      id: HP:0012758
      label: Neurodevelopmental delay
  evidence:
  - reference: PMID:22030316
    reference_title: "Long-term neurodevelopmental outcome after intrauterine transfusion for hemolytic disease of the fetus/newborn: the LOTUS study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall incidence of neurodevelopmental impairment was 4.8% (14/291)."
    explanation: >
      Gives the 4.8% incidence in a cohort of 291 treated children, which falls
      in the VERY_RARE band (<5%).
  - reference: PMID:22030316
    reference_title: "Long-term neurodevelopmental outcome after intrauterine transfusion for hemolytic disease of the fetus/newborn: the LOTUS study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral palsy was detected in 6 (2.1%) children, severe developmental delay in 9 (3.1%) children, and bilateral deafness in 3 (1.0%) children."
    explanation: Breaks the composite outcome into its components.
- category: Obstetric
  name: Stillbirth
  description: >
    Fetal death from untreated severe anemia and hydrops. Alloimmunised
    pregnancies with clinically significant antibodies have more stillbirths and
    shorter gestation than those with clinically insignificant antibodies.
  evidence:
  - reference: PMID:28840609
    reference_title: "Red blood cell alloimmunization in pregnancy during the years 1996-2015 in Iceland: a nation-wide population study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mothers in the clinically significant group were older, more often multigravidae, had more abortions and stillbirths, and had shorter gestational length."
    explanation: Associates clinically significant alloimmunisation with excess stillbirth and shorter gestation.
  notes: >
    Deliberately left without a bound `phenotype_term`. HP:0003826 Stillbirth
    sits under Mortality/Aging rather than under HP:0000118 phenotypic
    abnormality, so it is outside the PhenotypeTerm enum root and would fail
    term validation. This is the same HPO structural gap flagged for pregnancy
    phenotypes in issue #7837.
diagnosis:
- name: Maternal Red Cell Antibody Screening and Titration
  description: >
    Universal antenatal antibody screening identifies the at-risk pregnancy and
    the antibody specificity. Titre guides escalation for most specificities but
    is unreliable for anti-K, where anemia is driven by progenitor suppression
    rather than by antibody-dose-dependent hemolysis.
  evidence:
  - reference: PMID:40752319
    reference_title: "Hemolytic disease of the fetus and newborn: A review of pathophysiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Effective management relies on early detection through maternal antibody screening, fetal antigen testing, and close monitoring of fetal anemia."
    explanation: States the three-part diagnostic strategy.
- name: Middle Cerebral Artery Peak Systolic Velocity
  description: >
    Doppler measurement of the fetal middle cerebral artery peak systolic
    velocity detects moderate-to-severe fetal anemia non-invasively, exploiting
    the fall in blood viscosity. Its introduction replaced serial amniocentesis
    for amniotic-fluid bilirubin and cordocentesis as the routine monitoring
    tool, at the cost of a roughly 12% false-positive rate.
  evidence:
  - reference: PMID:10620643
    reference_title: "Noninvasive diagnosis by Doppler ultrasonography of fetal anemia due to maternal red-cell alloimmunization. Collaborative Group for Doppler Assessment of the Blood Velocity in Anemic Fetuses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sensitivity of an increased peak velocity of systolic blood flow in the middle cerebral artery for the prediction of moderate or severe anemia was 100 percent either in the presence or in the absence of hydrops (95 percent confidence interval, 86 to 100 percent for the 23 fetuses without hydrops), with a false positive rate of 12 percent."
    explanation: Gives the diagnostic performance including the false-positive rate.
  - reference: PMID:10620643
    reference_title: "Noninvasive diagnosis by Doppler ultrasonography of fetal anemia due to maternal red-cell alloimmunization. Collaborative Group for Doppler Assessment of the Blood Velocity in Anemic Fetuses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate and severe anemia can be detected noninvasively by Doppler ultrasonography on the basis of an increase in the peak velocity of systolic blood flow in the middle cerebral artery"
    explanation: States the non-invasive detection principle.
- name: Non-Invasive Fetal RHD Genotyping from Cell-Free DNA
  description: >
    Cell-free fetal DNA in maternal plasma determines fetal RHD status, which
    both targets anti-D prophylaxis to the pregnancies that can benefit and
    identifies which alloimmunised pregnancies need monitoring at all. Pooled
    diagnostic accuracy is equivalent to serologic typing of the newborn; what
    is still missing is trial evidence on patient-relevant outcomes rather than
    on test accuracy.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32033599
    reference_title: "Targeted antenatal anti-D prophylaxis for RhD-negative pregnant women: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-analysis of data from about 60,000 participants showed high sensitivity"
    explanation: >
      Records the pooled diagnostic-accuracy finding and the size of the
      evidence base behind it.
  - reference: PMID:32033599
    reference_title: "Targeted antenatal anti-D prophylaxis for RhD-negative pregnant women: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NIPT for fetal RhD status is equivalent to conventional serologic testing using the newborn's blood."
    explanation: States the equivalence conclusion.
genetic:
- name: RHD
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: RHD
    term:
      id: hgnc:10009
      label: RHD
  notes: >
    RHD encodes the RhD antigen. The genotypes that matter are those of the
    fetus (whether it inherited a paternal RHD allele) and of the pregnant
    person (whether they lack it) — not a heritable susceptibility in the
    affected individual, which is why `relationship_type` is SUSCEPTIBILITY
    rather than CAUSATIVE. Fetal RHD status is determinable from cell-free
    fetal DNA in maternal plasma.
  evidence:
  - reference: PMID:32033599
    reference_title: "Targeted antenatal anti-D prophylaxis for RhD-negative pregnant women: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-invasive prenatal testing (NIPT) of cell-free fetal DNA in maternal plasma could avoid unnecessary anti-D administration."
    explanation: >
      Establishes that fetal RHD genotype, determined from cell-free fetal DNA,
      is the variable that determines whether a pregnancy is at risk.
- name: KEL
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: KEL
    term:
      id: hgnc:6308
      label: KEL
  notes: >
    KEL encodes the Kell glycoprotein. Fetal inheritance of a K-positive allele
    from a K-positive father in a K-negative alloimmunised pregnant person
    produces the progenitor-suppression arm of the disease.
  evidence:
  - reference: PMID:9504940
    reference_title: "Inhibition of erythroid progenitor cells by anti-Kell antibodies in fetal alloimmune anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The growth of these types of cells from Kell-negative cord blood was not affected by either type of antibody."
    explanation: >
      Shows the effect is strictly dependent on fetal Kell antigen status,
      making KEL genotype the determinant of susceptibility.
- name: FCGRT
  relationship_type: UNKNOWN
  gene_term:
    preferred_term: FCGRT
    term:
      id: hgnc:3621
      label: FCGRT
  notes: >
    FCGRT encodes the alpha chain of the neonatal Fc receptor that transcytoses
    maternal IgG across the syncytiotrophoblast. It is listed here for
    queryability as the molecular identity of the transmission step and the
    target of nipocalimab, not as a disease gene — no FCGRT genotype-disease
    association is asserted, hence `relationship_type: UNKNOWN`.
  evidence:
  - reference: PMID:12850341
    reference_title: "Placental transport of immunoglobulin G."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transfer across the syncytiotrophoblast of the chorionic villi is mediated by the neonatal Fc receptor, FcRn."
    explanation: Identifies FcRn as the placental IgG transporter.
treatments:
- name: Anti-D Immunoglobulin Prophylaxis
  description: >
    Passive anti-D IgG given to non-sensitised D-negative pregnant people at
    around 28 weeks and after delivery of a D-positive infant, plus additional
    doses after sensitising events. This is prophylaxis against the disease ever
    starting, not treatment of an established case: it prevents the primary
    alloimmune response to fetal D-positive cells, and is useless once
    alloimmunisation has occurred.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: anti-D immunoglobulin prophylaxis
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human Rho(D) immune globulin
      term:
        id: NCIT:C80832
        label: Human Rho(D) Immune Globulin
  target_mechanisms:
  - target: Maternal Alloimmunization and IgG Alloantibody Production
    treatment_effect: INHIBITS
    description: >
      Passive anti-D prevents the pregnant person mounting an active anti-D
      response to fetal D-positive erythrocytes.
    evidence:
    - reference: PMID:38959811
      reference_title: "Why do RhD negative pregnant women still become anti-D immunized despite prophylaxis with anti-D immunoglobulin?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Targeted antenatal care together with postpartum prophylaxis with anti-D immunoglobulin has significantly reduced the D-alloimmunization risk."
      explanation: Establishes that prophylaxis acts by reducing alloimmunisation risk.
  evidence:
  - reference: PMID:36469119
    reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Preventative measures, such as Rhesus(D) immunoprophylaxis (RhIG), have greatly decreased the prevalence of Rh(D)-mediated HDFN"
    explanation: States the population-level effect of RhIG on Rh(D) HDFN prevalence.
  - reference: PMID:38959811
    reference_title: "Why do RhD negative pregnant women still become anti-D immunized despite prophylaxis with anti-D immunoglobulin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although several other antibodies may also destroy red blood cells of the fetus and newborn, preventive measures with anti-D immunoglobulin are only available for D antigen."
    explanation: >
      Records the key limitation — prophylaxis exists only for D, so the
      non-D-mediated fraction of the disease is unpreventable.
  notes: >
    The mechanism by which passive IgG suppresses an active alloimmune response
    is still not settled; epitope masking, immune deviation and antigen
    modulation are all candidates, and the discriminating experiments are in
    mice. See the HUMAN_MODEL_MISMATCH discussion on this entry.
- name: Intrauterine Transfusion
  description: >
    Ultrasound-guided transfusion of antigen-negative packed red cells into the
    umbilical vein, repeated every one to four weeks. It treats the anemia
    without touching the antibody, and the transfused antigen-negative cells are
    not destroyed. It remains the only intervention that reliably rescues a
    severely anemic fetus, and it is itself high-risk, which is what makes an
    upstream preventive therapy valuable.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intrauterine transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Fetal Anemia and Compensatory Extramedullary Erythropoiesis
    treatment_effect: INHIBITS
    description: >
      Directly corrects the fetal red-cell deficit, preventing progression to
      hydrops.
    evidence:
    - reference: PMID:40752319
      reference_title: "Hemolytic disease of the fetus and newborn: A review of pathophysiology, diagnosis, and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In cases of severe anemia, intrauterine transfusion (IUT) remains the primary intervention to improve fetal outcomes."
      explanation: States IUT as the primary intervention for severe fetal anemia.
  evidence:
  - reference: PMID:36469119
    reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatally, fetal anemia may occur and intrauterine transfusions may be needed."
    explanation: Records IUT as the prenatal treatment of fetal anemia.
  - reference: PMID:22030316
    reference_title: "Long-term neurodevelopmental outcome after intrauterine transfusion for hemolytic disease of the fetus/newborn: the LOTUS study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence of neurodevelopmental impairment in children treated with intrauterine transfusion for fetal alloimmune anemia is low (4.8%)."
    explanation: Gives the long-term neurological outcome of the treated cohort.
- name: Nipocalimab
  description: >
    An FcRn-blocking monoclonal antibody given weekly to the pregnant person
    from the early second trimester. It is the first therapy in HDFN directed at
    the transmission step itself: by competing with IgG for FcRn it both blocks
    transplacental transfer and shortens maternal IgG half-life, lowering
    alloantibody in both compartments. In the open-label phase 2 UNITY study 7
    of 13 high-risk pregnancies reached live birth at 32 weeks or later with no
    intrauterine transfusion, against a historical benchmark of 0%, and no
    hydrops occurred. The randomised phase 3 AZALEA trial is the confirmatory
    study; until it reports, the efficacy claim rests on a small single-arm
    comparison against a historical control.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nipocalimab
      term:
        id: NCIT:C170891
        label: Nipocalimab
  target_mechanisms:
  - target: FcRn-Mediated Transplacental IgG Transfer
    treatment_effect: INHIBITS
    description: >
      Competitive FcRn blockade prevents transcytosis of maternal alloantibody
      into the fetal circulation and accelerates its catabolism in the pregnant
      person.
    evidence:
    - reference: PMID:39197469
      reference_title: "Design of a Phase 3, Global, Multicenter, Randomized, Placebo-Controlled, Double-Blind Study of Nipocalimab in Pregnancies at Risk for Severe Hemolytic Disease of the Fetus and Newborn."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

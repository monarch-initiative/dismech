    explanation: Names the late postnatal phase and its surveillance target.
differential_diagnoses:
- name: ABO Hemolytic Disease of the Newborn
  description: >
    Naturally occurring maternal anti-A/anti-B IgG in group O mothers causes a
    generally milder, usually postnatal-only hemolytic disease that does not
    require antenatal monitoring and does not worsen across pregnancies. It
    shares the neonatal hyperbilirubinemia phenotype but not the fetal anemia
    one.
  evidence:
  - reference: PMID:34675752
    reference_title: "Hemolytic Disease of the Newborn: A Review of Current Trends and Prospects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "alloimmunization due to rhesus or ABO incompatibility between the maternal and fetal blood"
    explanation: Establishes ABO incompatibility as a distinct alloimmune route to the same syndrome.
- name: Non-Immune Hydrops Fetalis
  description: >
    Hydrops from parvovirus B19 infection, fetal arrhythmia, structural cardiac
    disease, chromosomal abnormality, twin-twin transfusion or
    alpha-thalassaemia major. The discriminator is a negative maternal antibody
    screen and a negative direct antiglobulin test on cord blood.
  evidence:
  - reference: PMID:40752319
    reference_title: "Hemolytic disease of the fetus and newborn: A review of pathophysiology, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Effective management relies on early detection through maternal antibody screening, fetal antigen testing, and close monitoring of fetal anemia."
    explanation: >
      Supports maternal antibody screening as the step that establishes the
      alloimmune aetiology and therefore separates immune from non-immune
      hydrops.
discussions:
- discussion_id: gap_hdfn_rhig_mechanism_unresolved
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does anti-D immunoglobulin prevent alloimmunisation in humans by epitope
    masking, immune deviation, or antigen modulation — and can the murine models
    in which these mechanisms are dissected be trusted to represent the human
    process?
  rationale: >-
    This is not a peripheral question. Anti-D prophylaxis is the single most
    effective intervention in the disease and has been in routine use since the
    late 1960s, yet its mechanism of action is still contested, and the
    experiments that discriminate between the candidate mechanisms are done in
    mice engineered to carry human erythrocyte antigens. The translational risk
    is concrete rather than theoretical: rational design of a recombinant
    monoclonal replacement for plasma-derived anti-D — which is what would close
    the availability gap in low- and middle-income countries — depends on
    knowing which mechanism to optimise for. That blends of monoclonals against
    non-overlapping epitopes approach polyclonal efficacy is itself a
    model-derived finding awaiting human confirmation.
  attaches_to:
  - pathophysiology#Maternal Alloimmunization and IgG Alloantibody Production
  evidence:
  - reference: PMID:28719385
    reference_title: "Prevention of hemolytic disease of the fetus and newborn: what have we learned from animal models?"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The search to elucidate the mechanism of action of IgG-mediated inhibition of erythrocyte alloimmunization has provided new evidence in support of a potential role for epitope masking, immune deviation and/or antigen modulation in this process."
    explanation: States that three candidate mechanisms remain undiscriminated.
  - reference: PMID:28719385
    reference_title: "Prevention of hemolytic disease of the fetus and newborn: what have we learned from animal models?"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "New murine models with clinically relevant human erythrocyte antigens have been used to understand the alloimmunization process and its inhibition."
    explanation: Identifies the model system in which the mechanism is being dissected.
  - reference: PMID:28719385
    reference_title: "Prevention of hemolytic disease of the fetus and newborn: what have we learned from animal models?"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A better understanding of the underlying mechanisms leading to hemolytic disease of the fetus and newborn is required to develop the most effective prevention strategies for future patients."
    explanation: States the translational motivation for resolving the mismatch.
  proposed_experiments:
  - experiment_id: exp_hdfn_rhig_mechanism_human_challenge
    name: Human comparison of recombinant anti-D monoclonal blends against polyclonal RhIG
    description: >
      Test whether recombinant anti-D monoclonal blends against non-overlapping
      D epitopes suppress primary alloimmunisation in D-negative human
      volunteers as effectively as plasma-derived polyclonal anti-D, with
      mechanistic readouts (D-antigen site occupancy, antigen modulation on the
      transfused cells, Th1/Th2 deviation) sampled in parallel.
- discussion_id: gap_hdfn_nipocalimab_single_arm_benchmark
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does FcRn blockade actually reduce intrauterine transfusion, hydrops and
    perinatal death in severe HDFN when tested against a concurrent randomised
    control rather than against a 0% historical benchmark?
  rationale: >-
    The phase 2 efficacy signal is genuinely striking, but it comes from 13
    open-label pregnancies compared with an assumed historical rate of zero.
    Historical benchmarks in a disease whose management has changed
    substantially over the same period are the weakest available comparator,
    and the enrolled population was selected on prior obstetric history, which
    selects for recurrence risk in a way a contemporaneous cohort would not.
    The confirmatory randomised trial exists and is enrolling; until it reports,
    this entry deliberately marks the efficacy claim as PARTIAL rather than
    SUPPORT.
  attaches_to:
  - pathophysiology#FcRn-Mediated Transplacental IgG Transfer
  evidence:
  - reference: PMID:39115062
    reference_title: "Nipocalimab in Early-Onset Severe Hemolytic Disease of the Fetus and Newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary end point was live birth at 32 weeks' gestation or later without intrauterine transfusions as assessed against a historical benchmark (0%; clinically meaningful difference, 10%)."
    explanation: Documents that the comparator was a historical benchmark rather than a concurrent control.
  - reference: PMID:39197469
    reference_title: "Design of a Phase 3, Global, Multicenter, Randomized, Placebo-Controlled, Double-Blind Study of Nipocalimab in Pregnancies at Risk for Severe Hemolytic Disease of the Fetus and Newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary endpoint is the proportion of pregnancies that do not result in intrauterine transfusion (IUT), hydrops fetalis, or fetal loss/neonatal death from all causes."
    explanation: Names the randomised trial and endpoint that would resolve the gap.
  proposed_experiments:
  - experiment_id: exp_hdfn_azalea_randomised_readout
    name: AZALEA randomised placebo-controlled phase 3 readout
    description: >
      Report the AZALEA randomised placebo-controlled phase 3 result on the
      composite of intrauterine transfusion, hydrops fetalis and fetal
      loss/neonatal death, with the HDFN severity index and FcRn receptor
      occupancy as supporting pharmacodynamic evidence.
- discussion_id: gap_hdfn_no_prophylaxis_for_non_d_antibodies
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can alloimmunisation to non-D red-cell antigens — anti-K above all, which
    causes the most severe disease per unit titre — be prevented, given that
    immunoprophylaxis exists only for D?
  rationale: >-
    Anti-D prophylaxis has been so effective that the residual disease burden is
    increasingly composed of specificities against which nothing preventive
    exists. Anti-K is the clearest case: it produces severe anemia by a
    different mechanism, its titre does not track severity, and most maternal
    K sensitisation is transfusion-acquired rather than pregnancy-acquired,
    which makes it addressable by K-matched transfusion policy for people of
    reproductive potential rather than by a new immunoglobulin. Whether such a
    policy actually reduces HDFN incidence has not been demonstrated.
  attaches_to:
  - pathophysiology#Anti-Kell Suppression of Fetal Erythroid Progenitors
  - pathophysiology#Maternal Alloimmunization and IgG Alloantibody Production
  evidence:
  - reference: PMID:38959811
    reference_title: "Why do RhD negative pregnant women still become anti-D immunized despite prophylaxis with anti-D immunoglobulin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although several other antibodies may also destroy red blood cells of the fetus and newborn, preventive measures with anti-D immunoglobulin are only available for D antigen."
    explanation: States the absence of prophylaxis for non-D specificities.
  - reference: PMID:38662646
    reference_title: "Maternal red blood cell alloimmunization prevalence in the United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the sequelae of HDFN, new initiatives are required to reduce the incidence of alloimmunization in patients of reproductive potential."
    explanation: States the unmet prevention need in the population at risk.
- discussion_id: gap_hdfn_cffdna_outcome_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does targeting antenatal anti-D prophylaxis by cell-free-DNA fetal RHD
    genotyping improve patient-relevant outcomes, or is the evidence base
    entirely diagnostic-accuracy evidence?
  rationale: >-
    The accuracy data are excellent and the policy case — avoiding a
    plasma-derived blood product in the substantial minority of D-negative
    pregnancies where the fetus is D-negative — is strong on those grounds
    alone. But a systematic review found neither direct randomised evidence nor
    sufficient data for a linked-evidence chain to morbidity outcomes. This
    matters because withholding prophylaxis on the basis of a test is an
    asymmetric decision: a false-negative genotype result leads to an
    unprotected at-risk pregnancy.
  attaches_to:
  - pathophysiology#Fetomaternal Hemorrhage and Exposure to Paternally Inherited Red Cell Antigens
  evidence:
  - reference: PMID:32033599
    reference_title: "Targeted antenatal anti-D prophylaxis for RhD-negative pregnant women: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither direct evidence nor sufficient data for linked evidence were identified."
    explanation: States the absence of outcome-level evidence directly.
  - reference: PMID:32033599
    reference_title: "Targeted antenatal anti-D prophylaxis for RhD-negative pregnant women: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies investigating patient-relevant outcomes are still lacking."
    explanation: Confirms that only diagnostic-accuracy evidence exists.
notes: >
  Curation notes.

  Anchor choice. `MONDO:0006760` (fetal erythroblastosis) is used as the
  `disease_term` because its exact synonyms include "HDFN", "hemolytic disease
  of the fetus or newborn" and "erythroblastosis fetalis", making it the term
  for the syndrome as a whole. `MONDO:0006953` (Rh isoimmunization) is mapped
  as a related match — it names the maternal alloimmunisation event rather than
  the fetal/neonatal disease — and `MONDO:0859172` (hemolytic disease of fetus
  and newborn, RH-induced) as a narrow match for the Rh-specific arm. Two
  upstream MONDO oddities are noted here so a future curator does not "fix"
  them locally: MONDO:0006760 is classified under microcytic anemia (HDFN is
  not characteristically microcytic), and MONDO:0859172 sits under familial
  hemolytic anemia and carries the `omim_susceptibility` subset, which
  mis-frames an alloimmune disease as a hereditary one.

  Modelling stance. HDFN is deliberately modelled as a two-organism disease.
  The nodes upstream of `FcRn-Mediated Transplacental IgG Transfer` are
  processes in the pregnant person; the nodes downstream are processes in the
  fetus and neonate. Keeping the transfer step as its own atomic node is what
  makes the FcRn-blockade drug target expressible as a `target_mechanisms`
  edge rather than being buried inside a bundled "maternal antibody causes
  fetal anemia" claim.

  Two mechanism arms, not one. The Rh (destruction) and Kell (progenitor
  suppression) arms are curated as separate `mechanistic_hypotheses` groups
  that converge on the same fetal-anemia node, because they make opposite
  predictions about the reticulocyte response and about the usefulness of
  antibody titre. This is a genuine mechanistic divergence determined by
  antibody specificity, not a controversy about the same observations.

  Module conformance. Two nodes declare conformance to
  `hemolytic_anemia_erythrocyte_destruction`. The Kell arm deliberately does
  NOT — it is a production failure, not an erythrocyte-destruction process, so
  conformance there would be false.

  Unbound phenotype. The `Stillbirth` phenotype is intentionally left without a
  `phenotype_term`; HP:0003826 is outside the `PhenotypeTerm` enum root
  (HP:0000118). This is one of the pregnancy-phenotype HPO structural gaps
  catalogued in issue #7837 and is recorded here rather than worked around.

  Not yet curated. Reference ranges and interpretation bands for neonatal total
  serum bilirubin (the phototherapy and exchange-transfusion thresholds) would
  be a natural addition but require a citable source with quotable numeric
  thresholds; the AAP hyperbilirubinemia guideline was not fetched for this
  pass. ABO HDN is curated here only as a differential, not as a subtype.

  - preferred_term: Hydrops fetalis
    term:
      id: HP:0001789
      label: Hydrops fetalis
  evidence:
  - reference: clinicaltrials:NCT03842189
    reference_title: >-
      A Multicenter, Open-label Study to Evaluate the Safety, Efficacy,
      Pharmacokinetics and Pharmacodynamics of M281 Administered to Pregnant
      Women at High Risk for Early Onset Severe Hemolytic Disease of the Fetus
      and Newborn (HDFN)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

progression:
- phase: Early postnatal hyperbilirubinemia phase
  notes: >
    In the first days of life, loss of placental bilirubin clearance while
    maternal IgG continues to circulate produces rapidly rising unconjugated
    bilirubin. This is the phototherapy and exchange-transfusion window.
  evidence:
  - reference: PMID:36469119
    reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "should provide treatment for hyperbilirubinemia in the early phase"
    explanation: Names the early postnatal phase and its treatment target.
- phase: Late anemia phase
  notes: >
    Hyporegenerative anemia emerging weeks after birth, after the bilirubin
    problem has resolved. Surveillance that stops when jaundice settles misses
    it.
  evidence:
  - reference: PMID:36469119
    reference_title: "History and current standard of postnatal management in hemolytic disease of the fetus and newborn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

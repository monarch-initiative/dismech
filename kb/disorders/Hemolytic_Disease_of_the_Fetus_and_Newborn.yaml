name: Hemolytic Disease of the Fetus and Newborn
creation_date: "2026-08-05T00:00:00Z"
category: Complex
synonyms:
- HDFN
- Erythroblastosis fetalis
- Fetal erythroblastosis
- Hemolytic disease of the newborn
- Rhesus disease
- Rh alloimmunisation
description: >
  Hemolytic disease of the fetus and newborn (HDFN) is an alloimmune disorder in
  which a pregnant person makes IgG antibodies against a red-cell antigen the
  fetus has inherited from the father but which the parent carrying the
  pregnancy lacks. Its defining feature as a disease model is that the causal
  lesion is not in the affected individual at all: the antibody is made in one
  organism and does its damage in another, and the placenta is the transmission
  step that converts a maternal immune memory into fetal disease. That
  transmission is not passive leakage — the neonatal Fc receptor (FcRn) on the
  syncytiotrophoblast actively transcytoses IgG into the fetal circulation,
  which is why the disease is essentially confined to the second and third
  trimesters and why blocking FcRn is a mechanism-matched therapy rather than a
  symptomatic one.

  Once in the fetal circulation the alloantibody opsonises antigen-positive
  fetal erythrocytes, which are cleared by Fc-gamma-receptor-bearing macrophages
  of the fetal spleen. The resulting anemia drives compensatory extramedullary
  erythropoiesis (the hepatosplenomegaly and circulating erythroblasts that gave
  the disease its historical name), and, when compensation fails, hydrops
  fetalis and fetal death. A second, mechanistically distinct arm exists: Kell
  alloantibodies suppress erythroid progenitors directly rather than lysing
  mature cells, producing anemia with an inappropriately low reticulocyte
  response.

  The disease also has a sharp temporal discontinuity at birth. In utero the
  maternal liver clears the bilirubin generated by hemolysis across the
  placenta, so the fetus is anemic but not jaundiced; at delivery that clearance
  route is severed while hemolysis continues, and unconjugated bilirubin rises
  into the range that crosses the blood-brain barrier and causes kernicterus.
  Anemia is the fetal problem and hyperbilirubinemia is the neonatal one, and
  the two are separated by the umbilical cord.

  HDFN is the paradigm of a disease largely engineered out of existence in
  high-income settings by anti-D immunoprophylaxis, and it is the residual
  gradient — anti-D remains the commonest cause of severe HDFN worldwide, and
  RhIG availability tracks national income — that now determines most of its
  global burden.

  description: The FDA label describes a randomized placebo-controlled study with 23 animals per arm, 7.50±0.15 Gy total-body irradiation at 0.8±0.03 Gy/min, pegfilgrastim on days 1 and 8, and medical management including fluids, antibiotics and transfusions.
  publication: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2015/125031s180lbl.pdf
  modeled_mechanisms:
  - target: Bone Marrow Hematopoietic Suppression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Models hematopoietic injury and tests an intervention-associated survival outcome.
    limitations: Controlled exposure, species and protocol-defined care limit transfer to human casualties. Survival is an integrated outcome and does not prove rescue of every organ injury.
    evidence:
    - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2015/125031s180lbl.pdf
      reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2015/125031s180lbl.pdf
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 91% survival (21/23) in the pegfilgrastim group compared to 48% survival (11/23) in the control group.
      explanation: Pegfilgrastim increased 60-day survival under this two-dose protocol.
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS

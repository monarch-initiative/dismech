- name: Erythropoiesis-stimulating agents for prolonged anemia
  description: The 2011 consensus weakly recommends considering erythropoietin in selected patients with prolonged anemia or a significant hemoglobin decline. Response takes weeks. Use requires individualized assessment of risks, iron status and applicable product labeling; this recommendation does not establish controlled human ARS efficacy or an FDA ARS indication.
  evidence:
  - reference: PMID:21987000
    reference_title: First global consensus for evidence-based management of the hematopoietic syndrome resulting from exposure to ionizing radiation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Individuals with prolonged anemia, a significant decline in hemoglobin concentration, or both may be candidates for treatment with erythropoietin.
    explanation: The 2011 consensus makes a weak recommendation for selected prolonged anemia; this is not controlled human ARS efficacy.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21987000
    reference_title: First global consensus for evidence-based management of the hematopoietic syndrome resulting from exposure to ionizing radiation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Experiencing a response to erythropoietin will take weeks rather than days.
    explanation: The expected response is delayed and does not replace urgent transfusion support.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS

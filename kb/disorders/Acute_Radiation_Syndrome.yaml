experimental_models:
- name: Irradiated resting human lymphocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Primary peripheral-blood lymphocytes from healthy donors.
  publication: PMID:9525257
  description: Resting lymphocytes were irradiated with cobalt-60 gamma rays or fast neutrons and evaluated for apoptosis after 24 hours of culture. Doses ranged from 0.05 to 5 Gy.
  modeled_mechanisms:
  - target: Mature Lymphocyte Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Demonstrates early interphase apoptosis in nondividing lymphocytes.
    limitations: Ex-vivo assay, not whole-body exposure or an ARS patient cohort; it does not alone establish clinical depletion kinetics.
    evidence:
    - reference: PMID:9525257
      reference_title: Apoptosis induced by fast neutrons versus 60Co gamma-rays in human peripheral blood lymphocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The dose-response data confirm the high radiosensitivity of lymphocytes and demonstrate that their response to undergo early interphase cell death by apoptosis is largely independent of LET.
      explanation: Resting human lymphocytes underwent apoptosis after ex-vivo irradiation; cell division is not required.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
    readouts:
    - name: Apoptotic lymphocyte yield
      target: Mature Lymphocyte Apoptosis
      direction: INCREASED
      interpretation: Apoptotic yield increased steeply below 1 Gy and flattened toward 5 Gy.
      evidence:
      - reference: PMID:9525257
        reference_title: Apoptosis induced by fast neutrons versus 60Co gamma-rays in human peripheral blood lymphocytes.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Dose-response curves obtained with both radiation qualities were characterized by an initial steep increase in the number of apoptotic cells below 1 Gy, with a flattening of the curves at higher doses towards 5 Gy.
        explanation: Measured ex-vivo dose response.
        directness: DIRECT
        quote_role: PRIMARY_RESULT
- name: Healthy-donor blood dicentric biodosimetry assay
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Healthy-donor peripheral blood, with cultured mononuclear cells.
  publication: PMID:36543843
  description: DLADES dose-response calibration used blood from two donors irradiated with cobalt-60 gamma rays at 0–4 Gy and 0.8 Gy/min. Two other donors provided blinded samples. Chromosome-number filtering improved image selection.
  modeled_mechanisms:
  - target: Radiation-Induced Chromosomal Aberrations
    relationship: MEASURES
    fidelity: MODERATE
    description: Measures acquired dicentrics for calibrated dose estimation.
    limitations: Healthy blood irradiated ex vivo, not ARS casualties; only four donors overall. The blinded evaluation spanned 0.5–4 Gy. The 0.5 Gy sample had no finite lower confidence bound; lower/higher doses, heterogeneous exposures and other radiation qualities were not validated.
    evidence:
    - reference: PMID:36543843
      reference_title: Dicentric chromosome assay using a deep learning-based automated system.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Blood samples from two donors were exposed to cobalt-60 gamma rays (0-4 Gy, 0.8 Gy/min).
      explanation: Abstract specifies the calibration exposure.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
    readouts:
    - name: Blind-sample dose reconstruction
      target: Radiation-Induced Chromosomal Aberrations
      interpretation: The known doses lay within the reported 95%confidence limits after quality filtering, with an undefined lower bound for the 0.5 Gy sample.
      evidence:
      - reference: PMID:36543843
        reference_title: Dicentric chromosome assay using a deep learning-based automated system.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The actual dose for each sample was within the 95% confidence limits of the estimated dose.
        explanation: Performance finding applies only to the tested ex-vivo samples.
        directness: DIRECT
        quote_role: PRIMARY_RESULT

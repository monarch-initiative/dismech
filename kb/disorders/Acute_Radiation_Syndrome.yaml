- name: Recurrent infections
  description: >-
    Neutropenic infection, the proximate cause of death in the haematopoietic
    subsyndrome.
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
- name: Petechiae
  description: >-
    Mucocutaneous bleeding from thrombocytopenia.
  phenotype_term:
    preferred_term: Petechiae
    term:
      id: HP:0000967
      label: Petechiae
diagnosis:
- name: Dicentric chromosome assay biodosimetry
  description: >-
    The reference method for reconstructing absorbed dose when no physical
    dosimeter was worn, which is the usual case in an accident or a release.
    Scoring dicentric chromosomes in peripheral lymphocytes gives a dose estimate
    against a calibration curve. Its weakness is throughput: it is slow and needs
    expert readers, which is the wrong shape for a mass-casualty event and the
    reason automated scoring is being developed.
  evidence:
  - reference: PMID:36543843
    reference_title: "Dicentric chromosome assay using a deep learning-based automated system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The dicentric chromosome assay is the "gold standard" in biodosimetry for
      estimating radiation exposure.
    explanation: >-
      Establishes the assay as the reference standard for dose estimation.
  - reference: PMID:36543843
    reference_title: "Dicentric chromosome assay using a deep learning-based automated system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      its large-scale deployment is limited owing to its time-consuming nature and
      requirement for expert reviewers
    explanation: >-
      Records the throughput limitation, which is what makes the faster clinical
      triage methods below necessary rather than merely convenient.
- name: Lymphocyte depletion kinetics and time to emesis
  description: >-
    Early clinical triage. The rate at which the lymphocyte count falls, and the
    interval from exposure to vomiting, both track absorbed dose and are available
    within hours, before any cytogenetic result. This is the method the entry's
    lymphopenia phenotype is clinically useful for.
  evidence:
  - reference: PMID:17993851
    reference_title: "Estimating radiation dose from time to emesis and lymphocyte depletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphocyte depletion kinetics and time to emesis have previously been shown
      to correlate with radiation dose.
    explanation: >-
      Establishes both triage parameters as dose-correlated.
  - reference: PMID:17993851
    reference_title: "Estimating radiation dose from time to emesis and lymphocyte depletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dose can be estimated by a simple table lookup, given the ratio of two
      lymphocyte counts and the time between blood samples.
    explanation: >-
      Documents the simplified method, derived from radiation-accident case data,
      that makes lymphocyte kinetics usable at the bedside.
animal_models:
- name: Non-human primate total-body irradiation model
  species: Macaca mulatta
  description: >-
    Rhesus macaques given a mid-lethal total-body dose with protocol-defined
    supportive care. This is the model the entire approved-countermeasure evidence
    base rests on, and under the FDA Animal Rule it is the model that stands in
    for the human efficacy trial that cannot be run.
  publication: PMID:23210705
  modeled_mechanisms:
  - target: Bone Marrow Hematopoietic Suppression
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the marrow suppression and its survival consequence at a
      controlled dose, which is what allows countermeasure efficacy to be measured
      at all.
    limitations: >-
      Dose is uniform, delivered by linear accelerator, and paired with
      protocolised supportive care. A human casualty has an unknown, non-uniform
      dose and variable care, so the dose-equivalence assumption is the part that
      does not transfer cleanly.
    readouts:
    - name: 60-day overall mortality
      target: Bone Marrow Hematopoietic Suppression
      direction: DECREASED
      interpretation: >-
        Filgrastim reduced 60-day mortality from 59.1% to 20.8% at an approximate
        LD50/60 dose.
      evidence:
      - reference: PMID:23210705
        reference_title: "Filgrastim improves survival in lethally irradiated nonhuman primates."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Filgrastim significantly (P < 0.004) reduced 60 day overall mortality
          [20.8% (5/24)] compared to the controls [59.1% (13/22)].
        explanation: >-
          The survival readout that carries the efficacy claim for this model.
    evidence:
    - reference: PMID:23210705
      reference_title: "Filgrastim improves survival in lethally irradiated nonhuman primates."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We evaluated the efficacy of filgrastim to increase survival of nonhuman
        primates (NHP) exposed to an approximate mid-lethal dose
      explanation: >-
        Establishes the model, species and dose regimen this entry's efficacy
        evidence comes from.
environmental:
- name: Acute whole-body ionizing radiation exposure
  description: >-
    A single high-dose exposure from a criticality accident, radiological source
    mishandling, reactor accident or nuclear detonation. It is distinguished from
    therapeutic irradiation by being uncontrolled, unfractionated, and usually of
    initially unknown dose, which is what makes early triage on lymphocyte
    depletion kinetics necessary.
  exposure_term:
    preferred_term: acute whole-body exposure to ionizing radiation
    term:
      id: ECTO:7000047
      label: exposure to ionizing radiation
  exposure_classifications:
    hazard_agent_type:
    - classification_value: PHYSICAL
    exposure_route:
    - classification_value: MULTIPLE
      notes: >-
        Whole-body external irradiation is not an absorption route in the
        chemical sense; MULTIPLE is recorded because the exposure is not
        confined to one portal of entry.
    exposure_duration:
    - classification_value: ACUTE
  influences_mechanisms:
  - target: Hematopoietic Progenitor Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The radiation exposure is the physical insult that initiates progenitor
      killing.
    evidence:
    - reference: PMID:23210705
      reference_title: "Filgrastim improves survival in lethally irradiated nonhuman primates."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Filgrastim, administered at this dose and schedule, effectively mitigated
        the lethality of the hematopoietic subsyndrome of the acute radiation
        syndrome.
      explanation: >-
        Establishes the haematopoietic subsyndrome as the consequence of the
        irradiation exposure modelled at this node, in a controlled total-body
        irradiation experiment.
  notes: >-
    Bound to ECTO:7000047 (exposure to ionizing radiation), which resolves in the
    repository's ECTO adapter (sqlite:obo:ecto) and is already in the validated
    cache. An earlier draft of this entry bound ECTO:0000006 (exposure to
    ultraviolet radiation), which is wrong - ultraviolet is non-ionizing and does
    not produce this syndrome - together with a note claiming no better term was
    available. That note was itself wrong: the correct term was in the cache all
    along and had simply not been searched for. The acute, whole-body and
    unfractionated character of the exposure is carried in preferred_term and
    description, since the ECTO class does not distinguish it from chronic or
    partial-body irradiation.
  evidence:
  - reference: PMID:34402734
    reference_title: "Radiation countermeasures for hematopoietic acute radiation syndrome: growth factors, cytokines and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is critical that additional agents for other major sub-syndromes of ARS
      (gastrointestinal-ARS) be approved.
    explanation: >-
      Records that the syndrome has subsyndromes beyond the haematopoietic one
      modelled here, and that countermeasure coverage for them remains an
      acknowledged gap.
treatments:
- name: Granulocyte colony-stimulating factor (filgrastim)
  description: >-
    Filgrastim is FDA-approved for the haematopoietic subsyndrome and acts by
    stimulating surviving myeloid progenitors to accelerate granulocyte recovery.
    It shortens the duration of neutropenia without altering the nadir, so it
    rescues marrow output rather than preventing the initial radiation injury.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: NCIT:C1474
        label: Filgrastim
  target_mechanisms:
  - target: Bone Marrow Hematopoietic Suppression
    treatment_effect: RESTORES
    description: >-
      Acts on the marrow-suppression node rather than the radiation trigger,
      accelerating recovery of granulopoiesis from surviving progenitors.
  evidence:
  - reference: PMID:23210705
    reference_title: "Filgrastim improves survival in lethally irradiated nonhuman primates."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Filgrastim significantly (P < 0.004) reduced 60 day overall mortality [20.8%
      (5/24)] compared to the controls [59.1% (13/22)].
    explanation: >-
      Controlled non-human primate survival evidence at a mid-lethal dose. Graded
      MODEL_ORGANISM, which for this indication is not a weakness of the evidence
      base but its regulatory design - see the entry's discussion on the FDA
      Animal Rule.
- name: Sargramostim
  description: >-
    Recombinant GM-CSF, also FDA-approved for the haematopoietic subsyndrome. It
    acts on the same surviving-progenitor pool as filgrastim but across a broader
    myeloid range, and is stockpiled alongside it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sargramostim
      term:
        id: NCIT:C1492
        label: Sargramostim
  target_mechanisms:
  - target: Bone Marrow Hematopoietic Suppression
    treatment_effect: RESTORES
    description: >-
      Stimulates surviving myeloid progenitors to restore marrow output.
  evidence:
  - reference: PMID:34402734
    reference_title: "Radiation countermeasures for hematopoietic acute radiation syndrome: growth factors, cytokines and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These agents are largely recombinant growth factors (e.g.
      rhuG-CSF/filgrastim, rhuGM-CSF/sargramostim) that target and stimulate
      myeloid progenitors within bone marrow.
    explanation: >-
      Names sargramostim among the approved recombinant growth factors and states
      the myeloid-progenitor target that places it on this node.
- name: Romiplostim
  description: >-
    A thrombopoietin receptor agonist approved for the haematopoietic subsyndrome,
    addressing the platelet lineage that growth-factor support for granulocytes
    does not cover.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Bone Marrow Hematopoietic Suppression
    treatment_effect: RESTORES
    description: >-
      Stimulates bone marrow megakaryocytes to restore platelet production.
  evidence:
  - reference: PMID:34402734
    reference_title: "Radiation countermeasures for hematopoietic acute radiation syndrome: growth factors, cytokines and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Romiplostim, a small molecular agonist that enhances platelet production via
      stimulation of bone marrow megakaryocytes, has been recently approved and
      indicated for H-ARS.
    explanation: >-
      Establishes the approval and the megakaryocyte mechanism placing it on the
      marrow-suppression node.
discussions:
- discussion_id: ars_animal_rule_evidence_base
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How far do non-human primate survival results for the haematopoietic
    subsyndrome transfer to human radiation casualties, given that human efficacy
    trials for this indication cannot ethically be run?
  attaches_to:
  - "pathophysiology#Bone Marrow Hematopoietic Suppression"
  rationale: >-
    Every treatment in this entry is graded MODEL_ORGANISM, and that is a feature
    of the regulatory pathway rather than a gap in curation. Countermeasures for
    acute radiation syndrome are approved under the FDA Animal Rule, which permits
    marketing approval on adequate and well-controlled animal efficacy data
    precisely because deliberately irradiating humans to test a drug is not
    ethical or feasible. The consequence for this knowledge base is that the
    efficacy claims here can never be upgraded to HUMAN_CLINICAL by finding a
    better trial - no such trial will exist. What human data does exist comes from
    accident case series with uncontrolled dose, heterogeneous supportive care and
    small numbers. The open question is therefore not whether the animal data are
    good, but how dose-equivalence and supportive-care differences between a
    primate protocol and a mass-casualty setting affect the expected benefit.
  evidence:
  - reference: PMID:23210705
    reference_title: "Filgrastim improves survival in lethally irradiated nonhuman primates."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The Animal Rule enumerates criteria whereby the FDA would approve a drug or
      biologic for ARS indication based on animal efficacy data when efficacy
      studies in humans are unethical or not feasible.
    explanation: >-
      States the regulatory basis that makes model-organism evidence the ceiling
      rather than a stepping stone for this indication.

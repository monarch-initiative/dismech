name: Acute Radiation Syndrome
creation_date: '2026-09-01T14:00:00Z'
description: >-
  Acute radiation syndrome is the constellation of organ failures produced by
  whole-body or substantial partial-body exposure to a high dose of penetrating
  ionizing radiation delivered over a short period. It is the clinical expression of a
  single physical exposure acting on several proliferating tissues at once, and its
  presentation is ordered by how fast those tissues turn over: the haematopoietic
  syndrome appears first and at the lowest doses, followed by the gastrointestinal
  syndrome, then the neurovascular syndrome at doses that are almost uniformly fatal.
  The haematopoietic arm is the dose-limiting and most treatable component, and it
  follows the same cytotoxic marrow-injury pathway as chemotherapy-induced
  myelosuppression, which is why growth-factor support developed for oncology is the
  mainstay of radiation casualty management.
categories:
- Environmental Health Disorder
- Toxic Exposure Disorder
category: Complex
parents:
- Radiation Injury
disease_term:
  preferred_term: acute radiation syndrome
  term:
    id: MONDO:0033938
    label: acute radiation syndrome
pathophysiology:
- name: Hematopoietic Progenitor Injury
  description: >-
    Penetrating ionizing radiation delivered to the whole body over a short period
    kills proliferating haematopoietic stem and progenitor cells in the marrow. The
    marrow is the first compartment to fail because its progenitors are the most
    rapidly cycling, which is the same reason it is the dose-limiting tissue for
    cytotoxic chemotherapy - the insult differs but the vulnerable cell population
    does not.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "myelosuppression#Cytotoxic Insult to Proliferating Hematopoietic Progenitors"
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: hematopoietic progenitor cell
    term:
      id: CL:0008001
      label: hematopoietic precursor cell
  biological_processes:
  - preferred_term: cellular response to ionizing radiation
    term:
      id: GO:0071479
      label: cellular response to ionizing radiation
    modifier: INCREASED
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:34402734
    reference_title: "Radiation countermeasures for hematopoietic acute radiation syndrome: growth factors, cytokines and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These agents are largely recombinant growth factors (e.g.
      rhuG-CSF/filgrastim, rhuGM-CSF/sargramostim) that target and stimulate
      myeloid progenitors within bone marrow.
    explanation: >-
      Identifies myeloid progenitors in bone marrow as the compartment the
      approved countermeasures act on. This is INDIRECT support for the node: it
      establishes the target compartment rather than demonstrating that radiation
      kills progenitors, and is retained for that narrower purpose alongside the
      direct survival evidence carried on the exposure link.
    directness: INDIRECT
  downstream:
  - target: Bone Marrow Hematopoietic Suppression
    causal_link_type: DIRECT
    description: >-
      Loss of cycling progenitors collapses marrow output.
- name: Bone Marrow Hematopoietic Suppression
  description: >-
    Marrow aplasia following radiation injury to the progenitor pool. Unlike the
    predictable nadir-and-recovery of a chemotherapy cycle, the depth and
    reversibility here are set by a single uncontrolled exposure, so the clinical
    question is whether enough stem cells survived to permit autologous recovery.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "myelosuppression#Bone Marrow Hematopoietic Suppression"
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  downstream:
  - target: Multilineage Peripheral Cytopenias
    causal_link_type: DIRECT
    description: >-
      Suppressed marrow output empties the peripheral blood of all lineages.
- name: Multilineage Peripheral Cytopenias
  description: >-
    Neutropenia, thrombocytopenia and anaemia appear in sequence set by each
    lineage's circulating half-life, with lymphocytes falling first and fastest.
    Duration of neutropenia rather than nadir depth is the parameter the approved
    countermeasures actually shift.
  role: effector
  biological_scale: ORGANISM
  conforms_to: "myelosuppression#Multilineage Peripheral Cytopenias"
  downstream:
  - target: Decreased total lymphocyte count
    causal_link_type: DIRECT
    description: >-
      Lymphocytes fall first, within hours of exposure.
  - target: Decreased total neutrophil count
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  - target: Anemia
    causal_link_type: DIRECT
  - target: Cytopenia-Related Clinical Complications
    causal_link_type: DIRECT
    description: >-
      Loss of neutrophils and platelets produces the infections and bleeding that
      drive mortality.
  evidence:
  - reference: PMID:23210705
    reference_title: "Filgrastim improves survival in lethally irradiated nonhuman primates."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Filgrastim significantly decreased the duration of neutropenia, but did not
      affect the absolute neutrophil count nadir.
    explanation: >-
      Establishes that duration of neutropenia, not nadir depth, is the parameter
      that responds to treatment - which is why this node is framed around
      duration and infection risk rather than around the nadir alone.
- name: Cytopenia-Related Clinical Complications
  description: >-
    Neutropenic infection and haemorrhage are the proximate causes of death in
    the haematopoietic subsyndrome, and they are what supportive care and growth
    factors are given to prevent. Kept separate from the cytopenias themselves
    because the countermeasures act on the counts while the mortality is driven by
    the complications.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "myelosuppression#Cytopenia-Related Clinical Complications"
  evidence:
  - reference: PMID:23210705
    reference_title: "Filgrastim improves survival in lethally irradiated nonhuman primates."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Filgrastim, administered at this dose and schedule, effectively mitigated
      the lethality of the hematopoietic subsyndrome of the acute radiation
      syndrome.
    explanation: >-
      Establishes lethality as the endpoint of this arm and that it is
      modifiable, which is why the complications are modelled as their own node
      rather than folded into the cytopenias.
  downstream:
  - target: Recurrent infections
    causal_link_type: DIRECT
    description: >-
      Neutropenia removes the principal defence against bacterial infection.
  - target: Petechiae
    causal_link_type: DIRECT
    description: >-
      Thrombocytopenia produces mucocutaneous bleeding.
phenotypes:
- name: Decreased total lymphocyte count
  description: >-
    Lymphopenia is the earliest and most useful haematological sign, because
    lymphocytes are exquisitely radiosensitive and fall within hours. The rate of
    the fall over the first 48 hours is the basis of early biodosimetry triage
    when the physical dose is unknown.
  phenotype_term:
    preferred_term: Lymphopenia
    term:
      id: HP:0001888
      label: Decreased total lymphocyte count
    temporality: ACUTE
- name: Decreased total neutrophil count
  phenotype_term:
    preferred_term: Neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
- name: Thrombocytopenia
  phenotype_term:

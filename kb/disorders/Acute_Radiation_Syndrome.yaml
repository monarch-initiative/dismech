animal_models:
- name: Rhesus macaque filgrastim total-body irradiation study
  species: Macaca mulatta
  description: Randomized blinded study in 46 rhesus macaques given 7.5 Gy total-body LINAC irradiation at 0.8 Gy/min, with medical management in both arms. Filgrastim began 23±3 hours after irradiation;24 treated animals were compared with 22 controls.
  publication: PMID:23210705
  modeled_mechanisms:
  - target: Bone Marrow Hematopoietic Suppression
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces hematopoietic suppression and measures filgrastim-associated survival under this protocol.
    limitations: Controlled total-body irradiation, treatment timing and supportive care differ from heterogeneous accidental exposure. This experiment supports filgrastim; it is not the sole efficacy study for all approved drugs. It does not establish human dose equivalence or gastrointestinal/neurovascular rescue.
    readouts:
    - name: 60-day overall mortality
      target: Bone Marrow Hematopoietic Suppression
      direction: DECREASED
      interpretation: Filgrastim reduced 60-day mortality from 59.1% to 20.8% at an approximate LD 50/60 dose.
      evidence:
      - reference: PMID:23210705
        reference_title: Filgrastim improves survival in lethally irradiated nonhuman primates.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Filgrastim significantly (P < 0.004) reduced 60 day overall mortality [20.8% (5/24)] compared to the controls [59.1% (13/22)].
        explanation: The survival readout that carries the efficacy claim for this model.
    - name: Duration of neutropenia
      target: Multilineage Peripheral Cytopenias
      direction: DECREASED
      interpretation: Filgrastim shortened neutropenia in this experiment; the ANC nadir did not differ significantly.
      evidence:
      - reference: PMID:23210705
        reference_title: Filgrastim improves survival in lethally irradiated nonhuman primates.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Filgrastim significantly decreased the duration of neutropenia, but did not affect the absolute neutrophil count nadir.
        explanation: The duration-versus-nadir result applies to this regimen and does not define every countermeasure.
        directness: DIRECT
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:23210705
      reference_title: Filgrastim improves survival in lethally irradiated nonhuman primates.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We evaluated the efficacy of filgrastim to increase survival of nonhuman primates (NHP) exposed to an approximate mid-lethal dose
      explanation: Establishes the model, species and dose regimen this entry's efficacy evidence comes from.
    - reference: PMID:23210705
      reference_title: Filgrastim improves survival in lethally irradiated nonhuman primates.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: A total of 46 (38 males/8 females) rhesus macaques, Macaca Mulatta, Chinese substrain, 4.0–6.5 kg body weight, were used.
      explanation: Methods establish the number, sex distribution and species of experimental animals.
      directness: DIRECT
      quote_role: PRIMARY_RESULT

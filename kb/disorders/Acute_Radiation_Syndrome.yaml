discussions:
- discussion_id: ars_animal_rule_evidence_base
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: How do exposure heterogeneity, combined injury and available supportive care modify the benefit expected from controlled animal countermeasure studies?
  attaches_to:
  - pathophysiology#Bone Marrow Hematopoietic Suppression
  rationale: 'Animal efficacy studies support regulatory approval because controlled efficacy experiments involving deliberate harmful human irradiation are unethical or infeasible. Human accident-treatment observations and healthy-volunteer safety/pharmacology studies nevertheless exist. Their designs answer different questions: uncontrolled temporal marrow recovery is not a randomized survival estimate, and healthy-volunteer pharmacology is not irradiated-patient efficacy. Neither the filgrastim macaque experiment nor any single regimen establishes a universal effect for all countermeasures.'
  evidence:
  - reference: PMID:21987000
    reference_title: First global consensus for evidence-based management of the hematopoietic syndrome resulting from exposure to ionizing radiation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Descriptive studies like these that do not have an appropriate, contemporaneous comparison group allow assessment of hypotheses for possible associations but not robust assessments of causality.
    explanation: Consensus identifies the limitation of uncontrolled accident observations.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/125268s167lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/125268s167lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Approval for this indication was based on efficacy studies conducted in animals
    explanation: FDA label identifies the regulatory efficacy source.
    directness: DIRECT
    quote_role: BACKGROUND
  - reference: clinicaltrials:NCT02343133
    reference_title: A Phase 2 Single-Dose, Randomized, Double-Blind, Placebo-Controlled Study to Evaluate the Safety, Tolerability, Pharmacokinetics, and Pharmacodynamics of HemaMax™ (rHuIL-12) in Healthy Subjects
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The purpose of this study is to determine whether HemaMax is safe and well tolerated to support efficacy under FDA's Animal Rule to reduce the morbidity and mortality associated with the hematopoietic syndrome of acute radiation syndrome.
    explanation: Registry description establishes the study purpose and population; it is not an efficacy result.
    directness: DIRECT

notes: This entry emphasizes acute illness, established countermeasures, supportive care and directly relevant experimental systems. Cutaneous injury can accompany ARS but can also occur after local exposure without systemic ARS. Absorbed-dose boundaries are approximate and source-dependent; CDC ranges quoted here are gamma-equivalent values and are not individual prognostic cutoffs. Delayed radiation effects and exploratory regeneration, microbiome and cell-death pathways are outside the detailed acute pathograph. Clinical-trial records describe research designs and do not establish efficacy in irradiated patients.
has_subtypes:
- name: Hematopoietic subsyndrome
  description: Marrow injury predominates at lower ARS dose ranges. CDC describes the full syndrome usually between 0.7 and 10 Gy; these are approximate gamma-equivalent ranges and do not exclude concomitant organ injury.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the full syndrome will usually occur with a dose between 0.7 and 10 Gy
    explanation: CDC range for the hematopoietic syndrome.
    directness: DIRECT
    quote_role: BACKGROUND
- name: Gastrointestinal subsyndrome
  description: Severe gastrointestinal injury coexists with marrow injury at higher exposures. CDC describes full syndrome usually above approximately 10 Gy, with some symptoms from 6 Gy; other consensus sources use lower syndrome thresholds.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the full syndrome will usually occur with a dose greater than approximately 10 Gy
    explanation: CDC range for full gastrointestinal syndrome.
    directness: DIRECT
    quote_role: BACKGROUND
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Some symptoms may occur as low as 6 Gy or 600 rads.
    explanation: Lower-dose symptoms do not imply that all cases have a full gastrointestinal syndrome.
    directness: DIRECT
    quote_role: BACKGROUND
- name: Neurovascular subsyndrome
  description: Very-high-dose cardiovascular and central nervous system injury can evolve within hours. CDC describes full syndrome usually above approximately 50 Gy and some symptoms from 20 Gy; these ranges are source-dependent and are not individual survival cutoffs.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the full syndrome will usually occur with a dose greater than approximately 50 Gy
    explanation: CDC range for full cardiovascular/CNS syndrome.
    directness: DIRECT
    quote_role: BACKGROUND
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Some symptoms may occur as low as 20 Gy or 2000 rads.
    explanation: CDC distinguishes lower-dose symptoms from the full syndrome.
    directness: DIRECT
    quote_role: BACKGROUND
- name: Associated cutaneous radiation injury
  description: Skin injury can accompany systemic ARS or follow localized exposure independently. It is an overlapping organ component, not a mandatory systemic stage.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: It is also possible to receive a damaging dose to the skin without symptoms of ARS
    explanation: CDC explicitly distinguishes isolated skin irradiation from systemic ARS.
    directness: DIRECT
    quote_role: BACKGROUND
stages:
- name: Prodromal stage
  description: Nausea, vomiting, anorexia and sometimes diarrhea can begin within minutes to days; timing and severity depend on exposure.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The classic symptoms for this stage are nausea, vomiting, as well as anorexia and possibly diarrhea (depending on dose)
    explanation: CDC describes the prodromal symptom cluster.
    directness: DIRECT
    quote_role: BACKGROUND
- name: Latent stage
  description: Symptoms may improve while tissue injury continues. Its duration varies greatly and can be very brief after severe exposure.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In this stage, the patient looks and feels generally healthy for a few hours or even up to a few weeks.
    explanation: The latent interval does not demonstrate recovery.
    directness: DIRECT
    quote_role: BACKGROUND
- name: Manifest illness stage
  description: Organ-specific hematologic, gastrointestinal, skin or neurovascular manifestations emerge; subsyndromes can coexist.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In this stage the symptoms depend on the specific syndrome
    explanation: CDC describes the organ-dependent manifest phase.
    directness: DIRECT
    quote_role: BACKGROUND
- name: Recovery or death
  description: Outcome depends on exposure, residual tissue reserve, associated injury and care. Recovery can take weeks to years; neurovascular death can occur within days.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The recovery process lasts from several weeks up to two years.
    explanation: Recovery time is variable rather than a fixed sequence of subsyndromes.
    directness: DIRECT
    quote_role: BACKGROUND

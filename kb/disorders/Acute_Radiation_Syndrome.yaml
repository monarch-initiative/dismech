name: Acute Radiation Syndrome
creation_date: '2026-09-01T14:00:00Z'
description: 'Acute radiation syndrome follows whole-body or substantial partial-body exposure to a high dose of penetrating ionizing radiation over a short interval. Injury can involve hematopoietic, gastrointestinal, cutaneous and neurovascular tissues in combination. Dose thresholds do not determine chronological order: early lymphocyte loss and prodromal symptoms can precede marrow failure over subsequent weeks, whereas very-high-dose neurovascular injury can become fatal within days. Dose distribution, radiation quality, concurrent injuries and supportive care influence outcome. Growth factors and a thrombopoietin-receptor agonist target the hematopoietic component; gastrointestinal and other organ injuries require additional supportive care.'
categories:
- Environmental Health Disorder
- Toxic Exposure Disorder
category: Complex
parents:
- Radiation Injury
disease_term:
  preferred_term: acute radiation syndrome
  term:
    id: MONDO:0033938
    label: acute radiation syndrome
pathophysiology:
- name: Hematopoietic Progenitor Injury
  description: Radiation impairs survival and proliferative capacity of marrow stem/progenitor cells and their progeny. Radiosensitivity does not mean every hematopoietic stem cell is rapidly cycling. Surviving marrow reserve helps determine reversibility.
  role: trigger
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:21987000
    reference_title: First global consensus for evidence-based management of the hematopoietic syndrome resulting from exposure to ionizing radiation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The primary causes of HS are radiation-induced suppression of mitosis in hematopoietic stem/progenitor cells and their progeny, resulting in hypocellularity and aplasia of the bone marrow and apoptosis in lymphocytes and other hematopoietic cells.
    explanation: The consensus distinguishes impaired marrow production from radiation-induced lymphocyte apoptosis.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  conforms_to: myelosuppression#Cytotoxic Insult to Proliferating Hematopoietic Progenitors

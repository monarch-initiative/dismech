environmental:
- name: Acute whole-body or substantial partial-body ionizing radiation exposure
  description: A large short-duration dose of penetrating radiation to the whole body or a substantial fraction can produce ARS. Dose distribution can be heterogeneous. Irradiation is distinct from radioactive contamination, which may coexist; chemical absorption-route categories do not describe external irradiation.
  exposure_term:
    preferred_term: acute whole-body or substantial partial-body exposure to ionizing radiation
    term:
      id: ECTO:7000047
      label: exposure to ionizing radiation
  exposure_classifications:
    hazard_agent_type:
    - classification_value: PHYSICAL
    exposure_duration:
    - classification_value: ACUTE
  influences_mechanisms:
  - target: Hematopoietic Progenitor Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Radiation exposure initiates this component of tissue injury.
    evidence:
    - reference: PMID:21987000
      reference_title: First global consensus for evidence-based management of the hematopoietic syndrome resulting from exposure to ionizing radiation.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The primary causes of HS are radiation-induced suppression of mitosis in hematopoietic stem/progenitor cells and their progeny, resulting in hypocellularity and aplasia of the bone marrow and apoptosis in lymphocytes and other hematopoietic cells.
      explanation: The consensus distinguishes impaired marrow production from radiation-induced lymphocyte apoptosis.
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
  - target: Mature Lymphocyte Apoptosis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Radiation exposure initiates this component of tissue injury.
    evidence:
    - reference: PMID:9525257
      reference_title: Apoptosis induced by fast neutrons versus 60Co gamma-rays in human peripheral blood lymphocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The dose-response data confirm the high radiosensitivity of lymphocytes and demonstrate that their response to undergo early interphase cell death by apoptosis is largely independent of LET.
      explanation: Resting human lymphocytes underwent apoptosis after ex-vivo irradiation; cell division is not required.
      directness: DIRECT
      quote_role: PRIMARY_RESULT
  - target: Intestinal Epithelial Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Radiation exposure initiates this component of tissue injury.
    evidence:
    - reference: PMID:21986999
      reference_title: Literature review and global consensus on management of acute radiation syndrome affecting nonhematopoietic organ systems.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Destruction of the intestinal epithelial lining causes breakdown of the mucosal barrier that normally separates the contents of the intestinal lumen from the GI tissue, resulting in severe secretory diarrhea, dehydration, and electrolyte imbalance.
      explanation: Consensus links epithelial destruction to loss of barrier function and gastrointestinal fluid losses.
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
  - target: Basal Epidermal Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Radiation exposure initiates this component of tissue injury.
    evidence:
    - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
      reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: When the basal cell layer of the skin is damaged by radiation, inflammation, erythema, and dry or moist desquamation can occur.
      explanation: CDC links basal epidermal injury to local cutaneous manifestations.
      directness: DIRECT
      quote_role: BACKGROUND
  - target: Hair Follicle Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Radiation exposure initiates this component of tissue injury.
    evidence:
    - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
      reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Also, hair follicles may be damaged, causing epilation.
      explanation: Hair-follicle injury is a separate cause of post-exposure hair loss.
      directness: DIRECT
      quote_role: BACKGROUND
  - target: Neurovascular Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Radiation exposure initiates this component of tissue injury.
    evidence:
    - reference: PMID:21986999
      reference_title: Literature review and global consensus on management of acute radiation syndrome affecting nonhematopoietic organ systems.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Several pathophysiologic processes may contribute to neurovascular collapse, including vascular damage, inflammation, cerebral edema, increased vascular permeability, and perivascular hemorrhage.
      explanation: The consensus presents contributing processes, not a single experimentally resolved human cascade.
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
  - target: Radiation-Induced Chromosomal Aberrations
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Radiation exposure initiates this component of tissue injury.
    evidence:
    - reference: PMID:36543843
      reference_title: Dicentric chromosome assay using a deep learning-based automated system.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Radiation-induced DNA double-strand breaks activate cellular damage repair mechanisms. However, misrepair of chromosomes results in chromosomal aberrations, typically dicentric chromosomes and translocations
      explanation: The assay paper explains the biological basis of the acquired chromosome-damage readout.
      directness: DIRECT
      quote_role: BACKGROUND
  notes: The ECTO binding covers ionizing-radiation exposure broadly; the acute duration, penetrating quality and extent are specified in this record. Localized skin injury alone does not establish systemic ARS.
  evidence:
  - reference: url:https://www.cdc.gov/radiation-emergencies/hcp/clinical-guidance/ars.html
    reference_title: 'Acute Radiation Syndrome: Information for Clinicians | Radiation Emergencies | CDC'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Acute Radiation Syndrome (ARS) (sometimes known as acute radiation sickness) is an acute illness caused by radiation exposure (or irradiation) of the entire body (or most of the body) by a high dose of penetrating radiation in a very short period of time (usually a matter of minutes).
    explanation: Clinical guidance defines the systemic exposure pattern.
    directness: DIRECT
    quote_role: BACKGROUND
treatments:
- name: Filgrastim
  description: Recombinant G-CSF is FDA-approved to improve survival after myelosuppressive radiation exposure. It stimulates residual hematopoiesis. The cited macaque experiment shortened neutropenia without changing its nadir and demonstrated a protocol-specific survival benefit.
  evidence:
  - reference: PMID:23210705
    reference_title: Filgrastim improves survival in lethally irradiated nonhuman primates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Filgrastim significantly (P < 0.004) reduced 60 day overall mortality [20.8% (5/24)] compared to the controls [59.1% (13/22)].
    explanation: 'Randomized rhesus study with supportive care: mortality difference was 38.3 percentage points under this protocol.'
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:23210705
    reference_title: Filgrastim improves survival in lethally irradiated nonhuman primates.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Filgrastim significantly decreased the duration of neutropenia, but did not affect the absolute neutrophil count nadir.
    explanation: The duration-versus-nadir result applies to this regimen and does not define every countermeasure.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.fda.gov/emergency-preparedness-and-response/medical-countermeasure-mcm-issues/radiological-and-nuclear-emergency-preparedness
    reference_title: Radiological and Nuclear Emergency Preparedness | FDA
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Neupogen (filgrastim) – approved March 2015
    explanation: FDA current preparedness page lists the approved parent product; biosimilars are not separate mechanisms.
    directness: DIRECT
    quote_role: BACKGROUND
  treatment_term:

diagnosis:
- name: Dicentric chromosome assay biodosimetry
  description: Dicentric chromosomes in cultured peripheral lymphocytes are scored against a calibrated dose-response curve. This is a reference method for biological dose estimation, with laboratory and throughput constraints. Automated scoring remains method-dependent; the cited DLADES evaluation used healthy donor blood irradiated ex vivo, not an ARS casualty cohort.
  evidence:
  - reference: PMID:36543843
    reference_title: Dicentric chromosome assay using a deep learning-based automated system.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The dicentric chromosome assay is the "gold standard" in biodosimetry for estimating radiation exposure.
    explanation: Establishes the assay as the reference standard for dose estimation.
  - reference: PMID:36543843
    reference_title: Dicentric chromosome assay using a deep learning-based automated system.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: its large-scale deployment is limited owing to its time-consuming nature and requirement for expert reviewers
    explanation: Records the throughput limitation, which is what makes the faster clinical triage methods below necessary rather than merely convenient.
- name: Lymphocyte depletion kinetics and time to emesis
  description: Serial lymphocyte counts and the interval from exposure to vomiting support early dose assessment. They should be interpreted with exposure history, physical dosimetry, cytogenetics and evolving clinical findings. Vomiting can be absent after a clinically important exposure or occur for other reasons; a single count or symptom should not determine prognosis.
  evidence:
  - reference: PMID:17993851
    reference_title: Estimating radiation dose from time to emesis and lymphocyte depletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Lymphocyte depletion kinetics and time to emesis have previously been shown to correlate with radiation dose.
    explanation: Establishes both triage parameters as dose-correlated.
  - reference: PMID:17993851
    reference_title: Estimating radiation dose from time to emesis and lymphocyte depletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: dose can be estimated by a simple table lookup, given the ratio of two lymphocyte counts and the time between blood samples.
    explanation: Documents the simplified method, derived from radiation-accident case data, that makes lymphocyte kinetics usable at the bedside.
  - reference: PMID:21986999
    reference_title: Literature review and global consensus on management of acute radiation syndrome affecting nonhematopoietic organ systems.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Health care providers should base individualized treatment decisions on whatever data are available, especially clinical signs and symptoms, but also take into consideration physical dosimetry and individual biodosimetry.
    explanation: Consensus recommends integrated assessment rather than a symptom-only dose estimate.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:21986999
    reference_title: Literature review and global consensus on management of acute radiation syndrome affecting nonhematopoietic organ systems.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a false-negative rate of >45% at doses of ≤3 Gy
    explanation: The review documents important false-negative limitations of postexposure vomiting.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS

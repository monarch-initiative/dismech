- name: Romiplostim
  description: The FDA-approved thrombopoietin-receptor agonist is an Fc-peptide fusion protein that increases platelet production. Regulatory efficacy rests on animal studies, with supportive human pharmacodynamic and safety information from other settings.
  evidence:
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/125268s167lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/125268s167lbl.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Romiplostim is a thrombopoietin receptor agonist (TPO-RA). Romiplostim, a member of the TPO mimetic class, is an Fc-peptide fusion protein (peptibody).
    explanation: Romiplostim is a biologic peptibody, not a small molecule.
    directness: DIRECT
    quote_role: BACKGROUND
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/125268s167lbl.pdf

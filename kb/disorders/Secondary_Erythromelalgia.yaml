- name: Chemical lumbar sympathectomy
  description: >-
    An invasive procedural option for refractory disease, reported to give sustained
    pain reduction with mild thigh pain as the common side effect. Carried as a
    sibling of the symptomatic-pharmacotherapy node under the SAME mixed-aetiology
    caveat: the systematic review supplying this evidence pooled 120 patients across
    primary, idiopathic and secondary erythromelalgia (13 of them receiving CLS) and
    did not stratify outcomes by aetiology, so efficacy in secondary disease is not
    established. Long-term outcomes are additionally underreported, and relapse is
    described in patients carrying SCN9A variants — a caveat belonging to the primary
    form, noted here only because it is inseparable from the pooled cohort. Term
    note: NCIT has no verifiable term for sympathectomy specifically, so the generic
    verified action term is used with a precise `preferred_term`; the procedure is a
    percutaneous chemical neurolysis rather than open surgery, though `SURGERY` is
